<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽水蓄能 · 电网的巨型充电宝</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#22b8cf;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0c8599;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(34,184,207,.6); background: rgba(34,184,207,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(12,133,153,.55); background: rgba(12,133,153,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(34,184,207,.10); border-color: rgba(34,184,207,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,133,153,.08); border-color: rgba(12,133,153,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9f2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="抽水蓄能 · 电网的巨型充电宝" data-en="Pumped-Storage Hydropower · The Grid's Giant Power Bank">抽水蓄能 · 电网的巨型充电宝</h1>
  <div class="sub" data-zh="白天峰荷,上库放水,水柱沿 500 m 落差的压力钢管冲进地下厂房,可逆式水轮机正转、发电机并网送出 300 MW 点亮城市灯带;深夜低谷,同一台机器反转成泵,用廉价基荷电把水抽回山巅。同一根轴上,电机白天是发电机、夜里是电动机;抽进 100 份电、发回约 76 份,往返效率 ~76%,从静止到满负荷只要 1–3 分钟 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="At evening peak the gate opens: water plunges 500 m down the penstock into the underground powerhouse, the reversible turbine spins forward and the generator feeds 300 MW to the city skyline; in the nightly valley the same machine runs backwards as a pump, lifting water uphill with cheap base-load power. One shaft, two identities — generator by day, motor by night; 100 units in, ~76 out, ~76% round-trip efficiency, full load within 1–3 minutes · 3D interactive demo · drag to orbit · Space = run/pause">抽水蓄能 · 电网的巨型充电宝</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="模式" data-en="Mode">模式</span><span class="v" id="stMode">—</span>
  <span class="k" data-zh="当前功率" data-en="Power">当前功率</span><span class="v" id="stPow">—</span>
  <span class="k" data-zh="往返效率" data-en="Round-trip eff.">往返效率</span><span class="v" id="stEff">—</span>
  <span class="k" data-zh="上库可发电量" data-en="Stored energy">上库可发电量</span><span class="v" id="stAvail">—</span>
  <span class="k" data-zh="下库水位" data-en="Lower level">下库水位</span><span class="v" id="stLow">—</span>
  <span class="k" data-zh="机组转速" data-en="Speed">机组转速</span><span class="v" id="stRpm">—</span>
</div>

<div id="plot">
  <h3 data-zh="24 小时需求曲线与充放电柱:绿柱=发电补峰、橙柱=抽水填谷,青线=当前时刻;下方为两库水位随时间轨迹" data-en="24 h demand curve with charge/discharge bars: green = generating into the peak, orange = pumping into the valley, cyan dot = now; below: water levels of both reservoirs over time">24 小时需求曲线与充放电柱:绿柱=发电补峰、橙柱=抽水填谷,青线=当前时刻;下方为两库水位随时间轨迹</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="青流:发电放水顺管下" data-en="cyan flow: generating, water runs down">青流:发电放水顺管下</span>
    <span class="chip.o" data-zh="橙流:抽水提水逆管上" data-en="orange flow: pumping, water lifted up">橙流:抽水提水逆管上</span>
    <span class="chip.g" data-zh="绿柱:发电功率(补峰)" data-en="green bars: generating (peak shave)">绿柱:发电功率(补峰)</span>
    <span class="chip.r" data-zh="琥珀段:峰荷需求灯带" data-en="amber cells: peak-demand strip">琥珀段:峰荷需求灯带</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnGen" data-zh="手动切发电" data-en="Switch to generate">手动切发电</button>
    <button class="abtn" id="btnPump" data-zh="手动切抽水" data-en="Switch to pump">手动切抽水</button>
    <button class="abtn brk" id="btnStop" data-zh="急停" data-en="Emergency stop">急停</button>
  </div>
  <div class="row"><label data-zh="一天中的时刻" data-en="Time of day">一天中的时刻</label><input id="sHour" type="range" min="0" max="24" step="0.05" value="18.6"><span class="val" id="sHourVal">18:36</span></div>
  <div class="row"><label data-zh="机组功率" data-en="Unit power">机组功率</label><input id="sPow" type="range" min="0.2" max="1" step="0.05" value="0.8"><span class="val" id="sPowVal">80%</span></div>
  <div class="row"><label data-zh="时间流速" data-en="Time speed">时间流速</label><input id="sSpd" type="range" min="0.25" max="4" step="0.25" value="1"><span class="val" id="sSpdVal">1.0 ×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglFlow" type="checkbox" checked> <span data-zh="水流动画" data-en="Water flow">水流动画</span></label>
      <label><input id="tglGrid" type="checkbox" checked> <span data-zh="电网灯带" data-en="Grid lights">电网灯带</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../hydroelectric/" data-zh="水电:只发电的孪生兄弟" data-en="hydroelectric: the generate-only twin">水电:只发电的孪生兄弟</a>
    <a href="../motor-generator/" data-zh="电动发电机:一台机器两身份" data-en="motor-generator: one machine, two roles">电动发电机:一台机器两身份</a>
    <a href="../flywheel/" data-zh="飞轮:短时高频储能" data-en="flywheel: short-burst storage">飞轮:短时高频储能</a>
    <a href="../elevator/" data-zh="电梯:配重与势能的日常版" data-en="elevator: counterweights in daily life">电梯:配重与势能的日常版</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d1117, 26, 78);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  groundM.color.setHex(dark ? 0x1c2126 : 0xb2bec9); mountainM.color.setHex(dark ? 0x4a5044 : 0x9fa892);
  cavernM.color.setHex(dark ? 0x262b26 : 0x6f7768); concM.color.setHex(dark ? 0x565e66 : 0xa8b2ba);
  penM.color.setHex(dark ? 0x5f6a76 : 0x8f9ca9);
  waterM.color.setHex(dark ? 0x0f6f80 : 0x2f9db8); waterM.emissive.setHex(dark ? 0x0b4a55 : 0x1a7d94);
  bodyM.color.setHex(dark ? 0x39424c : 0x7e8b98); copperM.color.setHex(dark ? 0xb06a35 : 0xc9803f);
  pylonM.color.setHex(dark ? 0x5c6a78 : 0x8fa0b0); buildM.color.setHex(dark ? 0x232d3a : 0x8494a6);
  transfM.color.setHex(dark ? 0x4f5864 : 0x8b98a6); stripPanelM.color.setHex(dark ? 0x11161c : 0xcfd8df);
  segDimC = dark ? 0x1a232c : 0xb6c2cc;
  condLineM.color.setHex(dark ? 0x22b8cf : 0x0c8599);
  updateDayNight();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => { el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh; });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('抽水蓄能 · 电网的巨型充电宝', "Pumped-Storage Hydropower · The Grid's Giant Power Bank");
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark'; localStorage.setItem('htw-theme', THEME); applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh'; localStorage.setItem('htw-lang', LANG); applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.localClippingEnabled = true;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 220);
camera.position.set(10.5, 8.5, 17.5);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0.8, 3.6, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 2.5; controls.maxDistance = 48; controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55); scene.add(hemi);

const DEM_PTS = [[0,.52],[2,.47],[4,.45],[6,.50],[7,.58],[9,.72],[12,.78],[14,.74],[17,.80],[19,.96],[20,1.0],[22,.78],[24,.52]];
function demand(h) {
  const x = ((h % 24) + 24) % 24;
  for (let i = 0; i < DEM_PTS.length - 1; i++) {
    if (x >= DEM_PTS[i][0] && x <= DEM_PTS[i + 1][0]) {
      const t = (x - DEM_PTS[i][0]) / (DEM_PTS[i + 1][0] - DEM_PTS[i][0]);
      const s = 0.5 - 0.5 * Math.cos(Math.PI * t);
      return DEM_PTS[i][1] + (DEM_PTS[i + 1][1] - DEM_PTS[i][1]) * s;
    }
  }
  return 0.52;
}
/* 调度策略:峰荷发电补峰,低谷抽水填谷;av 传 1.0 时为纯计划(画柱状用) */
function autoPow(h, pwF, av) {
  const D = demand(h);
  let g = 0, p = 0;
  if (D > BASE + 0.015 && av > 0.03) g = Math.min(RATED_G * pwF, D - BASE);
  else if (D < BASE - 0.015 && av < 1.79) p = Math.min(RATED_P * pwF, BASE - D);
  return { g, p, D };
}
function targetPow() {
  let g = 0, p = 0;
  if (override === 'gen') { if (avail > 0.03) g = RATED_G * pw; }
  else if (override === 'pump') { if (avail < 1.79) p = RATED_P * pw; }
  else if (override === 'stop') { }
  else { const ap = autoPow(hour, pw, avail); g = ap.g; p = ap.p; }
  return { g, p, m: g > 0.005 ? 'gen' : (p > 0.005 ? 'pump' : 'idle') };
}

/* 水流粒子路径(上库→水轮机→尾水渠全程) */
function makePath(ctrl, n) {
  const pts = new THREE.CatmullRomCurve3(ctrl).getPoints(n);
  const seg = [0];
  for (let i = 1; i < pts.length; i++) seg.push(seg[i - 1] + pts[i].distanceTo(pts[i - 1]));
  const total = seg[seg.length - 1];
  return { pts, seg, total, at(u, v) {
    const d = clamp(u, 0, 1) * total;
    let i = 1;
    while (i < seg.length - 1 && seg[i] < d) i++;
    const t = (d - seg[i - 1]) / Math.max(1e-6, seg[i] - seg[i - 1]);
    return v.lerpVectors(pts[i - 1], pts[i], t);
  } };
}

const wV = new THREE.Vector3();
function makeFlow(n, size) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

  pts.frustumCulled = false;
  scene.add(pts);
  return { geo, pos, col, arr: Array.from({ length: n }, () => ({ u: Math.random() })) };
}
const wFlow = makeFlow(220, 0.085), gFlow = makeFlow(30, 0.1);
function stepFlow(F, path, dir, spd, run, dt, base, cDown, cUp) {
  for (let i = 0; i < F.arr.length; i++) {
    const p = F.arr[i];
    if (run) {
      p.u += dir * dt * (base + 0.16 * spd);
      if (p.u > 1) p.u -= 1;
      if (p.u < 0) p.u += 1;
      path.at(p.u, wV);
      F.pos[i * 3] = wV.x; F.pos[i * 3 + 1] = wV.y; F.pos[i * 3 + 2] = wV.z;
      const c = dir > 0 ? cDown : cUp;
      F.col[i * 3] = c[0]; F.col[i * 3 + 1] = c[1]; F.col[i * 3 + 2] = c[2];
    } else F.pos[i * 3 + 1] = -999;
  }
  F.geo.attributes.position.needsUpdate = true;
  F.geo.attributes.color.needsUpdate = true;
}
function stepParticles(dt) {

}

function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:需求曲线+充放柱+两库水位 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const cMain = css.getPropertyValue('--text').trim() || '#f2f5f9';
  const padL = 40, padR = 12, padT = 12, padB = 20;
  const splitY = padT + (H - padT - padB) * 0.58;
  const xOf = h => padL + h / 24 * (W - padL - padR);
  const yOfG = v => splitY - v / 1.1 * (splitY - padT);
  ctx.font = '11px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)'; ctx.fillStyle = cTxt;
  for (const v of [0, 0.5, 1.0]) {
    ctx.beginPath(); ctx.moveTo(padL, yOfG(v)); ctx.lineTo(W - padR, yOfG(v)); ctx.stroke();
    ctx.fillText(v.toFixed(1), 6, yOfG(v) + 4);
  }
  ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(150,170,190,.6)';
  ctx.beginPath(); ctx.moveTo(padL, yOfG(BASE)); ctx.lineTo(W - padR, yOfG(BASE)); ctx.stroke();
  ctx.setLineDash([]); ctx.fillText(L('基荷 0.66 GW', 'base 0.66 GW'), padL + 4, yOfG(BASE) - 4);
  /* 充放电柱(按当前功率滑档的计划) */
  const bw = (W - padL - padR) / 24;
  for (let h = 0; h < 24; h += 0.1) {
    const ap = autoPow(h, pw, 1.0);
    if (ap.g > 0.002) {
      ctx.fillStyle = 'rgba(116,220,132,.55)';
      ctx.fillRect(xOf(h) - bw * 0.45, yOfG(BASE + ap.g), bw * 0.9, Math.max(1, yOfG(BASE) - yOfG(BASE + ap.g)));
    } else if (ap.p > 0.002) {
      ctx.fillStyle = 'rgba(255,169,77,.5)';
      ctx.fillRect(xOf(h) - bw * 0.45, yOfG(BASE), bw * 0.9, Math.max(1, yOfG(BASE - ap.p) - yOfG(BASE)));
    }
  }
  /* 需求曲线 + 当前时刻 */
  ctx.strokeStyle = cMain; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let h = 0; h <= 24.001; h += 0.25) {
    const px = xOf(h), py = yOfG(demand(h));
    h <= 0.001 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke(); ctx.lineWidth = 1;
  ctx.fillText(L('需求 GW', 'demand GW'), padL + 4, padT + 10);
  ctx.strokeStyle = '#22b8cf'; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(xOf(hour), padT); ctx.lineTo(xOf(hour), splitY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#22b8cf'; ctx.beginPath(); ctx.arc(xOf(hour), yOfG(demand(hour)), 4, 0, Math.PI * 2); ctx.fill();
  /* 下半:两库水位轨迹(最近 24 h) */
  const bot0 = splitY + 10;
  const yOfW = v => (H - padB) - v * (H - padB - bot0 - 4);
  ctx.fillStyle = cTxt; ctx.fillText(L('两库水位(近 24 h)', 'levels, last 24 h'), padL + 2, bot0 + 2);
  const line = (key, col, w) => {
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath();
    let pen = false;
    for (const s of hist) {
      const x = xOf(s.t - (tAbs - 24));
      if (x < padL - 2) { pen = false; continue; }
      const y = yOfW(s[key]);
      pen ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), pen = true);
    }
    ctx.stroke(); ctx.lineWidth = 1;
  };
  line('u', '#22b8cf', 2.2);
  line('l', '#74c0fc', 1.6);
  ctx.fillStyle = '#22b8cf'; ctx.fillText(L('上库', 'upper'), W - padR - 56, yOfW(upFrac()) - 4);
  ctx.fillStyle = '#74c0fc'; ctx.fillText(L('下库', 'lower'), W - padR - 56, yOfW(lowFrac()) + 12);
  ctx.fillStyle = cTxt;
  for (const h of [0, 6, 12, 18, 24]) ctx.fillText(h + 'h', xOf(h) - 8, H - padB + 14);
}

  const lit = Math.round(demand(hour) / 1.1 * 10);
  for (let i = 0; i < 10; i++) demandSegs[i].m.color.setHex(gridOn && i < lit ? (i < 6 ? 0x8fe0f0 : 0xffd43b) : segDimC);

/* ================= 预演一天(初始化水位轨迹) ================= */
function preSim() {
  avail = 1.3;
  let t = 0;
  while (t < 24) {
    t += 0.05;
    tAbs = t;
    const ap = autoPow(t, pw, avail);
    if (ap.g > 0) { const e = Math.min(ap.g * 0.05, avail); avail -= e; genOut += e; }
    else if (ap.p > 0) { const e = Math.min(ap.p * 0.05, (CAP_E - avail) / ETA_RT); avail += e * ETA_RT; pumpIn += e; }
    hist.push({ t, u: upFrac(), l: lowFrac() });
  }
  while (hist.length > 520) hist.shift();
  hour = 18.6;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  curTg = targetPow();
  /* 自动模式切换提示(招牌瞬间) */
  const am = override === null ? curTg.m : 'idle';
  if (am !== 'idle' && am !== lastAutoM) {
    if (am === 'gen') notify('晚峰到来:自动切为发电,上库放水补峰,点亮城市灯带', 'evening peak: auto-switch to generating — water released to shave the peak');
    else notify('深夜低谷:自动切为抽水,基荷余电把水提回山巅', 'nightly valley: auto-switch to pumping — cheap base-load power lifts water uphill');
  }
  lastAutoM = am;
  const hAdv = dt * 0.30 * tSpd;
  if (dt > 0) {
    simT += dt;
    tAbs += hAdv;
    hour = (hour + hAdv) % 24;
    /* 功率/转速爬坡(急停更快) */
    const tgt = curTg.g + curTg.p;
    const rate = override === 'stop' ? 2.4 : 0.8;
    Pnow += (tgt - Pnow) * Math.min(1, dt * rate);
    if (Math.abs(tgt - Pnow) < 0.004) Pnow = tgt;
    const rpmT = curTg.m === 'gen' ? 375 : (curTg.m === 'pump' ? -375 : 0);
    rpm += (rpmT - rpm) * Math.min(1, dt * (override === 'stop' ? 2.2 : 0.7));
    /* 能量账本 */
    if (curTg.m === 'gen') { const e = Math.min(Pnow * hAdv, avail); avail -= e; genOut += e; }
    else if (curTg.m === 'pump') { const e = Math.min(Pnow * hAdv, (CAP_E - avail) / ETA_RT); avail += e * ETA_RT; pumpIn += e; }
    avail = clamp(avail, 0, CAP_E);
    accH += hAdv;
    if (accH >= 0.12) {
      accH = 0;
      hist.push({ t: tAbs, u: upFrac(), l: lowFrac() });
      while (hist.length > 520 || (hist.length && hist[0].t < tAbs - 24.4)) hist.shift();
    }
    stepParticles(dt);
  }
  /* 机器与水面 */
  const wSpin = rpm / 375 * 7.5, uf = upFrac(), lf = lowFrac();
  rotorG.rotation.y += wSpin * dt;
  runnerG.rotation.y += wSpin * 1.6 * dt;
  upWater.position.y = 8.30 + 0.64 * uf - 0.15;
  lowWater.position.y = 0.16 + 0.32 * lf - 0.15;
  /* 涟漪环 */
  const ripOn = flowOn && Pnow > 0.01 && Math.abs(rpm) > 25;
  rip1.visible = rip2.visible = ripOn;
  if (ripOn) {
    const pul = 1 + 0.35 * (0.5 + 0.5 * Math.sin(simT * 5));
    rip1.scale.setScalar(pul); rip2.scale.setScalar(pul);
    const c = curTg.m === 'gen' ? 0x53d8ea : 0xffa94d;
    rip1.material.color.setHex(c); rip2.material.color.setHex(c);
    rip1.position.set(-3.0, 8.30 + 0.64 * uf + 0.03, 0);
    rip2.position.set(1.55, 0.16 + 0.32 * lf + 0.03, 0);
  }
  /* 灯带 / 城市窗光 / 厂房灯 */
  updateStrip();
  const D = demand(hour), dl = clamp(Math.sin(Math.PI * (hour - 6) / 12), 0, 1);
  buildM.emissiveIntensity = gridOn ? (0.25 + 1.5 * (1 - dl)) * (0.35 + 0.75 * D) : 0.04;
  plantStripM.color.setHex(gridOn ? 0x74d88c : segDimC);
  cavLight.color.setHex(curTg.m === 'pump' ? 0xffa060 : 0x7be3a0);
  cavLight.intensity = 0.15 + 1.2 * clamp(Pnow / RATED_G, 0, 1.2);
  updateDayNight();
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); updateFormula(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
preSim();
syncAll();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
