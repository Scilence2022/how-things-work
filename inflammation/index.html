<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>炎症反应与吞噬 · 红肿热痛是抢修的代价单</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e64980;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c2255c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  .lbl.p{border-color:rgba(230,73,128,.9);color:#ffdeeb}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}:root[data-theme="light"] .lbl.p{color:#c2255c}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(230,73,128,.6);background:rgba(230,73,128,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(194,37,92,.55);background:rgba(194,37,92,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(230,73,128,.10);border-color:rgba(230,73,128,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(194,37,92,.08);border-color:rgba(194,37,92,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffdeeb}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="炎症反应与吞噬" data-en="Inflammation & Phagocytosis">炎症反应与吞噬</h1>
  <div class="sub" data-zh="组织一受损,肥大细胞撒出组胺:血管扩张渗漏,红肿热痛只是代价单;中性粒细胞顺着趋化梯度爬出血管,把细菌包围消化——炎症不是故障,是抢修 · 拖动旋转 / 空格运行/暂停" data-en="Injury and mast cells scatter histamine: vessels dilate and leak — redness, heat and swelling are the price tag; neutrophils crawl out along chemotactic gradients to engulf and digest bacteria — inflammation isn't a malfunction, it's emergency repair · drag to orbit / Space = run/pause">组织一受损,肥大细胞撒出组胺:血管扩张渗漏,红肿热痛只是代价单;中性粒细胞顺着趋化梯度爬出血管,把细菌包围消化——炎症不是故障,是抢修 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="细菌数" data-en="Bacteria">细菌数</span><span class="v" id="stB">—</span>
  <span class="k" data-zh="在场白细胞" data-en="Neutrophils">在场白细胞</span><span class="v" id="stW">—</span>
  <span class="k" data-zh="血管通透性" data-en="Permeability">血管通透性</span><span class="v" id="stPerm">—</span>
  <span class="k" data-zh="炎症等级" data-en="Inflammation">炎症等级</span><span class="v" id="stInfl">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bWound" data-zh="划伤感染" data-en="Infect">划伤感染</button>
    <button class="abtn" id="bAnti" data-zh="抗炎药对照" data-en="Anti-inflammatory">抗炎药对照</button>
    <button class="abtn" id="bReset" data-zh="🔄 重置" data-en="🔄 Reset">🔄 重置</button>
  </div>
  <div class="row">
    <label data-zh="感染强度" data-en="Inoculum">感染强度</label>
    <input id="sDose" type="range" min="5" max="40" step="1" value="15">
    <span class="val" id="sDoseVal">15</span>
  </div>
  <div class="row">
    <label data-zh="响应速度" data-en="Response speed">响应速度</label>
    <input id="sSpeed" type="range" min="0.4" max="2.5" step="0.1" value="1.2">
    <span class="val" id="sSpeedVal">×1.2</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglTrail" type="checkbox" checked> <span data-zh="趋化梯度" data-en="Gradient">趋化梯度</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../immune-response/" data-zh="免疫应答" data-en="Immune Response">免疫应答</a>
    <a href="../complement-cascade/" data-zh="补体级联与膜攻击复合物" data-en="Complement Cascade & Membrane Attack Complex">补体级联与膜攻击复合物</a>
    <a href="../wound-healing/" data-zh="伤口愈合" data-en="Wound Healing">伤口愈合</a>
    <a href="../allergy/" data-zh="过敏反应" data-en="Allergic Reaction">过敏反应</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,55);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-1.5,4.0,10);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=35;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* 组织场景:一条血管横穿 + 周围组织 + 伤口 */
const tissueM=new THREE.MeshStandardMaterial({color:0x8a5560,roughness:0.9});
const tissue=new THREE.Mesh(new THREE.BoxGeometry(16,0.6,9),tissueM);
tissue.position.set(0,0.4,0);scene.add(tissue);
/* 血管(横管,半透明壁) */
const vM=new THREE.MeshPhysicalMaterial({color:0xc25470,roughness:0.3,transparent:true,opacity:0.4});
const vessel=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,14,24,1,true),vM);
vessel.rotation.z=Math.PI/2;vessel.position.set(0,1.6,0);scene.add(vessel);
/* 血管开孔(渗出口) */
const gapM=new THREE.MeshBasicMaterial({color:0x12070a,side:THREE.DoubleSide});
for(const dx of [-1.0,1.0]){
  const g=new THREE.Mesh(new THREE.CircleGeometry(0.3,20),gapM);
  g.position.set(dx,1.6,0.56);scene.add(g);
  const g2=g.clone();g2.position.z=-0.56;g2.rotation.y=Math.PI;scene.add(g2);
}
/* 伤口(右侧组织缺口) */
const woundM=new THREE.MeshBasicMaterial({color:0x4a1020});
const wound=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,0.62,20),woundM);
wound.position.set(3.6,0.42,0);scene.add(wound);
/* 趋化梯度(半透明绿面从伤口向左衰减) */
const gradM=new THREE.MeshBasicMaterial({color:0x8ce99a,transparent:true,opacity:0,
  side:THREE.DoubleSide,depthWrite:false});
const grad=new THREE.Mesh(new THREE.PlaneGeometry(9,7),gradM);
grad.rotation.x=-Math.PI/2;grad.position.set(0.2,0.75,0);scene.add(grad);
/* 细菌(红点) */
const NBAC=40;
const bacM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.4});
const bac=new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.07,0.1,4,8),bacM,NBAC);
bac.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(bac);
const bacD=[];for(let i=0;i<NBAC;i++)bacD.push({x:3.6,y:0.75,z:(Math.random()-0.5)*2,a:Math.random()*7,alive:0});
/* 白细胞(紫球,从血管渗出后爬行) */
const NWBC=26;
const wbcM=new THREE.MeshStandardMaterial({color:0xd0bfff,roughness:0.4,emissive:0x7048e8,emissiveIntensity:0.15});
const wbc=new THREE.InstancedMesh(new THREE.SphereGeometry(0.21,16,12),wbcM,NWBC);
wbc.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(wbc);
const wbcD=[];for(let i=0;i<NWBC;i++)wbcD.push({x:-5,y:1.6,z:0,phase:i*0.4,state:0,outX:0,engulf:0});
/* 组胺粒子(黄,从肥大细胞散出) */
const NH=20;
const hisM=new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.85});
const hist=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,8,6),hisM,NH);
hist.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(hist);
const hisD=[];for(let i=0;i<NH;i++)hisD.push({t:2,x:0,y:0,z:0});
/* 脓(伤口上的黄白团) */
const pusM=new THREE.MeshStandardMaterial({color:0xf1e3a0,roughness:0.6,transparent:true,opacity:0});
const pus=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,12),pusM);
pus.position.set(3.6,0.8,0);pus.scale.set(1,0.6,1);scene.add(pus);
const m4=new THREE.Matrix4();

/* 状态 */
let dose=15,speedMul=1.2,anti=false,playing=true,labelsOn=true,slowMo=false,gradOn=true;
let bacteria=0,killed=0,perm=0,infl=0,simT=0,woundT=-1;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function infect(){bacteria=dose;killed=0;perm=0;infl=0;woundT=0;
  bacD.forEach((b,i)=>{b.alive=i<dose?1:0;});}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('肥大细胞撒组胺:血管扩张、门户打开','Mast cells scatter histamine: vessels dilate, doors open'),
  new THREE.Vector3(-4.2,3.4,0),'y',()=>infl>0.1);
addLabel(()=>L('红肿热痛=渗漏的代价单','Redness, heat, swelling = the leak\u0027s price tag'),
  new THREE.Vector3(-0.5,-0.4,0),'p',()=>perm>0.2);
addLabel(()=>L('贴壁-出血管-沿梯度爬行','Roll, squeeze out, crawl down the gradient'),
  new THREE.Vector3(-1.0,2.9,0),'b',()=>woundT>1.5);
addLabel(()=>L('吞噬:包裹、吞入、酶解','Engulf: wrap, ingest, enzymatic digest'),
  new THREE.Vector3(3.2,2.6,0),'g',()=>wbcD.some(w=>w.engulf>0.1));
addLabel(()=>L('脓=阵亡的白细胞与残骸','Pus = fallen neutrophils and debris'),
  new THREE.Vector3(4.6,1.6,0),'o',()=>killed>4);

function setDose(v){dose=clamp(v,5,40);
  document.getElementById('sDose').value=dose;
  document.getElementById('sDoseVal').textContent=dose;updateStats();}
function setSpeed(v){speedMul=clamp(v,0.4,2.5);
  document.getElementById('sSpeed').value=speedMul;
  document.getElementById('sSpeedVal').textContent='×'+speedMul.toFixed(1);}

const STEPS=[
 {zh:'损伤:细菌进场,警报拉响',en:'Injury: bacteria in, the alarm sounds',
  act(){anti=false;document.getElementById('bWound').classList.add('on');infect();setDose(10);}},
 {zh:'组胺扩散:血管扩张渗漏',en:'Histamine spreads: dilate and leak',
  act(){infect();setDose(15);}},
 {zh:'白细胞出血管:贴壁变形挤过去',en:'Diapedesis: squeeze through the wall',
  act(){infect();setSpeed(1.8);}},
 {zh:'趋化爬行:沿梯度直奔伤口',en:'Chemotaxis: straight up the gradient',
  act(){infect();setDose(20);}},
 {zh:'吞噬与脓:胜仗与阵亡清点',en:'Engulfment & pus: the win and the fallen',
  act(){infect();setDose(25);setSpeed(1.8);}},
 {zh:'抗炎对照:组胺被压住,反应迟但稳',en:'Anti-inflammatory control: slower but steadier',
  act(){anti=true;infect();setDose(15);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const live=bacD.filter(b=>b.alive).length;
  document.getElementById('stB').textContent=live;
  document.getElementById('stB').className='v '+(live>12?'warn':'ok');
  document.getElementById('stW').textContent=wbcD.filter(w=>w.state>=2).length;
  const pv=document.getElementById('stPerm');
  pv.innerHTML=(100*perm).toFixed(0)+'<small> %</small>';
  const iv=document.getElementById('stInfl');
  iv.innerHTML=(100*infl).toFixed(0)+'<small> %</small>';
  iv.className='v '+(infl>0.8?'warn':(infl>0.2?'':'ok'));
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bWound').addEventListener('click',()=>{anti=false;infect();});
document.getElementById('bAnti').addEventListener('click',()=>{anti=true;infect();});
document.getElementById('bReset').addEventListener('click',()=>{bacteria=0;perm=0;infl=0;woundT=-1;
  bacD.forEach(b=>b.alive=0);wbcD.forEach(w=>{w.state=0;w.x=-5;w.engulf=0;});});
document.getElementById('sDose').addEventListener('input',e=>setDose(+e.target.value));
document.getElementById('sSpeed').addEventListener('input',e=>setSpeed(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglTrail').addEventListener('change',e=>{gradOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1)*speedMul;
  simT+=dts;
  /* 炎症进程 */
  if(woundT>=0){
    woundT+=dts;
    const target=anti?0.45:1;
    infl+=(clamp((woundT-0.4)*0.8,0,1)*target-infl)*Math.min(1,dts*0.8);
    perm=infl;
    /* 细菌增殖(未被发现时) */
    bacD.forEach(b=>{
      if(b.alive&&woundT<3&&Math.random()<0.002*dose/15*dts*60){/* 缓慢增殖 */}
      if(b.alive){
        b.a+=dts*2;
        b.x=clamp(b.x+Math.cos(b.a)*dts*0.5,2.6,4.6);
        b.z=clamp(b.z+Math.sin(b.a)*dts*0.5,-1.4,1.4);
      }
    });
  }
  /* 组胺扩散 */
  if(infl>0.15&&Math.random()<0.3){
    const h=hisD.find(h=>h.t>=1);
    if(h){h.t=0;h.x=-3+Math.random()*1.2;h.y=1.6;h.z=(Math.random()-0.5);}
  }
  hisD.forEach(h=>{
    h.t+=dts*0.9;
  });
  for(let i=0;i<NH;i++){
    const h=hisD[i];
    const s=h.t<1?1-h.t:0.001;
    m4.makeScale(s*1.4,s*1.4,s*1.4);
    m4.setPosition(h.x,h.y+h.t*0.8,h.z);
    hist.setMatrixAt(i,m4);
  }
  hist.instanceMatrix.needsUpdate=true;
  hist.visible=infl>0.1;
  /* 梯度面显形 */
  gradM.opacity=gradOn?0.06+infl*0.12:0;
  /* 白细胞状态机:0 在血管内滚动 → 1 贴壁 → 2 出血管 → 3 爬向伤口 → 4 吞噬 */
  let spawned=clamp(Math.floor(infl*26),0,NWBC);
  for(let i=0;i<NWBC;i++){
    const w=wbcD[i];
    if(i<spawned&&w.state===0&&Math.random()<0.02)w.state=1;
    if(w.state===1){w.x+= (0.8)*dts;if(w.x>-1.4){w.state=2;w.outX=w.x;}}
    else if(w.state===2){w.y+=(0.75-w.y)*dts*3;if(Math.abs(w.y-0.78)<0.05){w.state=3;}}
    else if(w.state===3){
      const dx=3.6-w.x,dz=0-w.z,d=Math.hypot(dx,dz);
      w.x+=dx/d*dts*0.9;w.z+=dz/d*dts*0.9;
      if(d<0.9)w.state=4;
    }else if(w.state===4){
      w.engulf+=dts*0.5;
      if(w.engulf>1){w.engulf=0;w.state=5;}
    }else if(w.state===5){
      w.x=-5;w.y=1.6;w.state=0;w.engulf=0;
    }
    const s=w.state===4?1.25:1;
    m4.makeScale(s,s,s);
    m4.setPosition(w.x,w.y,w.z);
    wbc.setMatrixAt(i,m4);
  }
  wbc.instanceMatrix.needsUpdate=true;
  /* 吞噬细菌:最近伤口的白细胞消灭附近细菌 */
  if(woundT>2){
    bacD.forEach(b=>{
      if(!b.alive)return;
      const eater=wbcD.find(w=>w.state===4&&Math.hypot(w.x-b.x,w.z-b.z)<0.5);
      if(eater&&Math.random()<0.1){b.alive=0;killed++;}
    });
    /* 细菌繁殖压力 */
    if(Math.random()<0.004*(infl)*(perm)&&bacteria<60){
      const slot=bacD.find(b=>!b.alive);
      if(slot){slot.alive=1;slot.x=3.6;slot.z=(Math.random()-0.5)*1.8;}
    }
  }
  for(let i=0;i<NBAC;i++){
    const b=bacD[i];
    const s=b.alive?1:0.001;
    m4.makeScale(s,s,s);
    m4.setPosition(b.x,b.y+0.04*Math.sin(simT*6+i),b.z);
    bac.setMatrixAt(i,m4);
  }
  bac.instanceMatrix.needsUpdate=true;
  /* 脓 */
  pusM.opacity=clamp((killed-3)/12,0,0.85);
  pus.scale.set(1+Math.min(killed,20)/30,0.6+Math.min(killed,20)/40,1+Math.min(killed,20)/30);
  /* 组织发红(血管扩张可视化) */
  vessel.scale.set(1+infl*0.3,1+infl*0.3,1);
  vM.opacity=0.4-infl*0.15;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
