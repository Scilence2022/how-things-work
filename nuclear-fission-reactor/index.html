<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核裂变链式反应与反应堆控制</title>
<style>
:root,:root[data-theme="dark"]{
  color-scheme:dark;--acc:#f59f00;
  --bg:#0d1117;--panel:rgba(13,17,24,.88);--panel-border:rgba(255,255,255,.09);
  --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
  --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
  --tool:rgba(13,17,24,.78);--tool-border:rgba(255,255,255,.12);
}
:root[data-theme="light"]{
  color-scheme:light;--acc:#e67700;
  --bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
  --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
  --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
  --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  transition:background .25s;}
#app{position:fixed;inset:0;}
#tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
.tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
  color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;
  min-width:40px;height:32px;padding:0 12px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  text-decoration:none;backdrop-filter:blur(6px);
  transition:border-color .15s,color .15s,transform .15s;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
#title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;
  max-width:calc(100vw - 320px);}
#title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;
  text-shadow:0 2px 8px rgba(0,0,0,.6);}
#title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;
  text-shadow:0 1px 4px rgba(0,0,0,.5);}
:root[data-theme="light"] #title h1,:root[data-theme="light"] #title .sub{text-shadow:none;}
#stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:12px;padding:11px 16px;
  backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
#stats .k{font-size:12px;color:var(--text2);align-self:center;}
#stats .v{font-size:19px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
#stats .v.g{color:var(--acc);}
#panel{position:fixed;left:18px;bottom:18px;z-index:5;width:384px;
  background:var(--panel);border:1px solid var(--panel-border);
  border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
  box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto;}
#steps{list-style:none;margin-top:8px;}
#steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;align-items:flex-start;}
#steps li:hover{background:var(--hover);}
#steps li.on{background:rgba(245,159,0,.10);border-color:rgba(245,159,0,.45);}
:root[data-theme="light"] #steps li.on{background:rgba(230,119,0,.08);border-color:rgba(230,119,0,.4);}
#steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  background:rgba(255,255,255,.12);color:var(--text3);}
:root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
#steps li.on .n{background:var(--acc);color:#fff;}
#steps .t{font-size:12.5px;color:var(--text3);line-height:1.45;}
#steps .t b{color:var(--text);}
#steps li.on .t b{color:#ffe0a0;}
:root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
#abtnRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--panel-border);}
.abtn{appearance:none;font:inherit;font-size:12px;cursor:pointer;flex:1;min-width:80px;
  background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
  border-radius:9px;padding:6px 10px;text-align:center;
  transition:border-color .15s,color .15s,background .15s;}
.abtn:hover{border-color:var(--acc);color:var(--acc);}
.abtn.on{border-color:var(--acc);color:var(--text);background:rgba(245,159,0,.12);}
#rodRow{display:flex;align-items:center;gap:8px;margin-top:8px;}
#rodRow label{font-size:12px;color:var(--text2);white-space:nowrap;}
#rodRow input{flex:1;accent-color:var(--acc);}
#rodRow .rv{font-size:11.5px;color:var(--text3);width:36px;text-align:right;}
@media(max-width:900px){#stats{display:none;}}
@media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh;}
  #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="title">
  <h1 data-zh="核裂变链式反应与反应堆控制" data-en="Nuclear Fission — Chain Reaction &amp; Reactor Control">核裂变链式反应与反应堆控制</h1>
  <div class="sub" data-zh="中子打开铀核，控制棒让 k=1 精准维持临界" data-en="Neutrons split uranium, control rods hold k=1 exactly at criticality">中子打开铀核，控制棒让 k=1 精准维持临界</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn">EN</button>
  <button class="tbtn" id="themeBtn">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="增殖因子 k" data-en="Multiplication k">增殖因子 k</span><span class="v g" id="stK">1.00</span>
  <span class="k" data-zh="功率 MW_th" data-en="Power MW_th">功率 MW_th</span><span class="v" id="stP">1000</span>
  <span class="k" data-zh="堆芯温度 °C" data-en="Core temp °C">堆芯温度 °C</span><span class="v" id="stT">325</span>
  <span class="k" data-zh="控制棒插入 %" data-en="Rod insertion %">控制棒插入 %</span><span class="v" id="stR">50</span>
</div>
<div id="panel">
  <ol id="steps"></ol>
  <div id="abtnRow">
    <button class="abtn" id="btnStart" data-zh="启动(抽棒)" data-en="Start up">启动(抽棒)</button>
    <button class="abtn on" id="btnSteady" data-zh="稳定 k=1" data-en="Steady k=1">稳定 k=1</button>
    <button class="abtn" id="btnScram" data-zh="紧急停堆 SCRAM" data-en="SCRAM">紧急停堆 SCRAM</button>
    <button class="abtn" id="btnSuper" data-zh="超临界演示" data-en="Supercritical demo">超临界演示</button>
  </div>
  <div id="rodRow">
    <label data-zh="控制棒深度" data-en="Rod depth">控制棒深度</label>
    <input type="range" id="rodSlider" min="0" max="100" value="50">
    <span class="rv" id="rodVal">50%</span>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 9, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 40;

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const dirL = new THREE.DirectionalLight(0xffffff, 2.2);
dirL.position.set(6, 12, 8); scene.add(dirL);
const fillL = new THREE.DirectionalLight(0x4488ff, 0.4);
fillL.position.set(-8, 4, -6); scene.add(fillL);

// --- vessel ---
const vesselMat = new THREE.MeshStandardMaterial({color:0x607080,metalness:0.7,roughness:0.3,transparent:true,opacity:0.30,side:THREE.DoubleSide});
const vessel = new THREE.Mesh(new THREE.CylinderGeometry(5,5,9,40,1,true), vesselMat);
vessel.position.y = 4.5; scene.add(vessel);
const capMat = new THREE.MeshStandardMaterial({color:0x708090,metalness:0.6,roughness:0.4,transparent:true,opacity:0.4,side:THREE.DoubleSide});
const capT = new THREE.Mesh(new THREE.CircleGeometry(5,40), capMat);
capT.rotation.x = -Math.PI/2; capT.position.y = 9; scene.add(capT);
const capB = new THREE.Mesh(new THREE.CircleGeometry(5,40), capMat);
capB.rotation.x = Math.PI/2; capB.position.y = 0; scene.add(capB);

// water
const waterMat = new THREE.MeshStandardMaterial({color:0x1a90ff,transparent:true,opacity:0.18,roughness:1});
const water = new THREE.Mesh(new THREE.CylinderGeometry(4.7,4.7,8.8,40), waterMat);
water.position.y = 4.4; scene.add(water);

// floor
const floorMat = new THREE.MeshStandardMaterial({color:0x1a2030,roughness:0.9});
const floor = new THREE.Mesh(new THREE.CylinderGeometry(5.2,5.2,0.2,40), floorMat);
floor.position.y = -0.1; scene.add(floor);

// --- fuel rods 4x4 grid ---
const fuelRods = [];
const fuelGeo = new THREE.CylinderGeometry(0.18,0.18,7,10);
for (let r = 0; r < 4; r++) {
  for (let c = 0; c < 4; c++) {
    const x = (c-1.5)*1.8, z = (r-1.5)*1.8;
    const mat = new THREE.MeshStandardMaterial({color:0xffcc00,metalness:0.25,roughness:0.5,emissive:0xffaa00,emissiveIntensity:0.12});
    const mesh = new THREE.Mesh(fuelGeo, mat);
    mesh.position.set(x, 3.5, z); scene.add(mesh);
    fuelRods.push({mesh, mat, x, z});
  }
}

// --- control rods (offset grid, 3x3) ---
const ctrlRods = [];
const ctrlGeo = new THREE.CylinderGeometry(0.13,0.13,8,10);
const ctrlMat = new THREE.MeshStandardMaterial({color:0x1a1a2e,metalness:0.6,roughness:0.45});
for (let r = 0; r < 3; r++) {
  for (let c = 0; c < 3; c++) {
    const x = (c-1)*2.0 + 0.0, z = (r-1)*2.0;
    if (Math.sqrt(x*x+z*z) > 4.0) continue;
    const mesh = new THREE.Mesh(ctrlGeo, ctrlMat);
    mesh.position.set(x, 9, z); scene.add(mesh);
    ctrlRods.push({mesh, x, z});
  }
}
// --- neutron pool ---
const MAX_N = 400;
const nGeo = new THREE.SphereGeometry(0.09, 6, 5);
const nMat = new THREE.MeshBasicMaterial({color:0xffffff});
const neutrons = [];
for (let i = 0; i < MAX_N; i++) {
  const m = new THREE.Mesh(nGeo, nMat);
  m.visible = false;
  scene.add(m);
  neutrons.push({mesh:m, vel:new THREE.Vector3(), life:0, maxLife:0, active:false});
}
function spawnNeutron(x, y, z, vx, vy, vz, life) {
  const n = neutrons.find(n => !n.active);
  if (!n) return;
  n.mesh.position.set(x, y, z);
  n.vel.set(vx, vy, vz);
  n.life = 0; n.maxLife = life; n.active = true; n.mesh.visible = true;
}
function spawnFission(rod) {
  const {x, z} = rod;
  const y = 2 + Math.random()*5;
  rod.mat.emissiveIntensity = 0.9;
  rod.flash = 0.18;
  const cnt = 2 + (Math.random() < 0.33 ? 1 : 0);
  for (let i = 0; i < cnt; i++) {
    const a = Math.random()*Math.PI*2, e = (Math.random()-0.5)*Math.PI;
    const sp = 1.5 + Math.random()*1.5;
    spawnNeutron(x, y, z, Math.cos(a)*Math.cos(e)*sp, Math.sin(e)*sp, Math.sin(a)*Math.cos(e)*sp, 1.2+Math.random()*0.8);
  }
}

// --- fragment geo ---
const fragGeo = new THREE.SphereGeometry(0.16, 8, 7);
const frags = [];
for (let i = 0; i < 30; i++) {
  const clr = i % 2 === 0 ? 0xff6030 : 0xff9020;
  const m = new THREE.Mesh(fragGeo, new THREE.MeshBasicMaterial({color:clr}));
  m.visible = false; scene.add(m);
  frags.push({mesh:m, vel:new THREE.Vector3(), life:0, active:false});
}
function spawnFrags(x, y, z) {
  for (let i = 0; i < 2; i++) {
    const f = frags.find(f => !f.active); if (!f) return;
    const a = Math.random()*Math.PI*2;
    f.mesh.position.set(x, y, z);
    f.vel.set(Math.cos(a)*0.8, (Math.random()-0.5)*0.5, Math.sin(a)*0.8);
    f.life = 0; f.active = true; f.mesh.visible = true;
  }
}

// --- simulation state ---
let mode = 'steady'; // 'startup','steady','scram','super'
let kFactor = 1.0, power = 1000, temp = 325, rodPct = 50;
let tSim = 0;
let fissionTimer = 0, fissionInterval = 0.12;
let superTimer = 0;

function setMode(m) {
  mode = m;
  ['btnStart','btnSteady','btnScram','btnSuper'].forEach(id => document.getElementById(id).classList.remove('on'));
  const map = {startup:'btnStart',steady:'btnSteady',scram:'btnScram',super:'btnSuper'};
  if (map[m]) document.getElementById(map[m]).classList.add('on');
  if (m === 'startup') { rodPct = 20; document.getElementById('rodSlider').value = 20; document.getElementById('rodVal').textContent = '20%'; }
  if (m === 'steady') { rodPct = 50; document.getElementById('rodSlider').value = 50; document.getElementById('rodVal').textContent = '50%'; }
  if (m === 'scram') { rodPct = 100; document.getElementById('rodSlider').value = 100; document.getElementById('rodVal').textContent = '100%'; }
  if (m === 'super') { rodPct = 10; document.getElementById('rodSlider').value = 10; document.getElementById('rodVal').textContent = '10%'; superTimer = 0; }
}
// --- theme / lang ---
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x0d1117);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('核裂变链式反应与反应堆控制','Nuclear Fission — Chain Reaction & Reactor Control');
  buildSteps();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME); applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG); applyLang();
});

const STEPS = [
  {b:'裂变',be:'Fission',d:'热中子被 U-235 俘获，铀核分裂，释放约 200 MeV 能量和 2-3 个快中子',de:'Thermal neutron absorbed by U-235 → nucleus splits → ~200 MeV + 2-3 fission neutrons'},
  {b:'链式反应',be:'Chain reaction',d:'k=1 稳态；k>1 指数增长；k<1 自行熄灭',de:'k=1 steady; k>1 exponential growth; k<1 dies out'},
  {b:'慢化',be:'Moderation',d:'快中子被水（氢）碰撞减速到热能量，才能高效被 U-235 吸收',de:'Fast neutrons slowed by water (H collisions) to thermal energy for efficient U-235 absorption'},
  {b:'控制棒',be:'Control rods',d:'硼/镉强力吸收中子；插入→k 降低，抽出→k 短暂升到 1 以上再稳定',de:'B/Cd absorbs neutrons; insert → k falls; withdraw → k briefly >1 then stabilizes'},
  {b:'缓发中子',be:'Delayed neutrons',d:'0.65% 的中子延迟释放（最长 55 秒），正是这微小比例让人工控制成为可能',de:'0.65% arrive 0.2–55s after fission — this tiny fraction makes human control possible'},
  {b:'压水堆',be:'PWR',d:'一回路高压水（155 bar, 325°C）带走热量，经蒸汽发生器驱动二回路汽轮机',de:'Primary loop at 155 bar/325°C carries heat → steam generator → secondary steam → turbine'},
];
function buildSteps() {
  const el = document.getElementById('steps'); el.innerHTML = '';
  STEPS.forEach((s,i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b> ${L(s.d,s.de)}</span>`;
    el.appendChild(li);
  });
}

document.getElementById('btnStart').addEventListener('click',()=>setMode('startup'));
document.getElementById('btnSteady').addEventListener('click',()=>setMode('steady'));
document.getElementById('btnScram').addEventListener('click',()=>setMode('scram'));
document.getElementById('btnSuper').addEventListener('click',()=>setMode('super'));
document.getElementById('rodSlider').addEventListener('input', e => {
  rodPct = parseInt(e.target.value);
  document.getElementById('rodVal').textContent = rodPct + '%';
});

// --- main loop ---
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  tSim += dt;

  // update k based on rod insertion and mode
  const targetK = mode === 'scram' ? 0.05 : mode === 'super' ? 1.35 : mode === 'startup' ? 1.08 : 1.0;
  const kSpeed = mode === 'scram' ? 3.0 : 0.4;
  kFactor += (targetK - kFactor) * dt * kSpeed;

  // power dynamics
  if (mode === 'scram') {
    power *= Math.pow(0.001, dt);
    if (power < 1) power = 0;
  } else {
    power += (kFactor - 1.0) * 800 * dt;
    power = Math.max(0, Math.min(6000, power));
  }

  // temp follows power
  temp += (280 + power * 0.05 - temp) * dt * 0.3;

  // control rod visual positions
  const rodY = 9 - (rodPct / 100) * 7;
  ctrlRods.forEach(r => { r.mesh.position.y += (rodY - r.mesh.position.y) * dt * 3; });

  // fission events
  if (mode !== 'scram') {
    fissionInterval = mode === 'super' ? 0.04 : mode === 'startup' ? 0.08 : 0.12;
    fissionTimer += dt;
    if (fissionTimer >= fissionInterval * (1 / Math.max(0.1, kFactor))) {
      fissionTimer = 0;
      const rod = fuelRods[Math.floor(Math.random() * fuelRods.length)];
      spawnFission(rod);
      spawnFrags(rod.x, 2+Math.random()*5, rod.z);
    }
  }

  // supercritical auto-SCRAM after 4s
  if (mode === 'super') {
    superTimer += dt;
    if (superTimer > 4.0) setMode('scram');
  }

  // update neutrons
  neutrons.forEach(n => {
    if (!n.active) return;
    n.life += dt; n.mesh.position.addScaledVector(n.vel, dt);
    // absorb if hitting control rod zone
    let absorbed = false;
    ctrlRods.forEach(r => {
      const dx = n.mesh.position.x - r.x, dz = n.mesh.position.z - r.z;
      if (Math.sqrt(dx*dx+dz*dz) < 0.4 && n.mesh.position.y < r.mesh.position.y + 4)
        absorbed = true;
    });
    if (absorbed || n.life > n.maxLife || Math.abs(n.mesh.position.x)>5.5 || Math.abs(n.mesh.position.z)>5.5) {
      n.active = false; n.mesh.visible = false;
    }
  });

  // update frags
  frags.forEach(f => {
    if (!f.active) return;
    f.life += dt; f.mesh.position.addScaledVector(f.vel, dt);
    if (f.life > 0.6) { f.active = false; f.mesh.visible = false; }
  });

  // fuel rod flash decay
  fuelRods.forEach(r => {
    if (r.flash > 0) { r.flash -= dt * 3; if (r.flash < 0) r.flash = 0; }
    r.mat.emissiveIntensity = 0.08 + r.flash * 0.8 + (power/6000) * 0.25;
    const t = Math.min(1, power/4000);
    r.mat.color.setRGB(1, 0.8-t*0.4, 0.0+t*0.0);
  });

  // stats
  document.getElementById('stK').textContent = kFactor.toFixed(3);
  document.getElementById('stP').textContent = Math.round(power);
  document.getElementById('stT').textContent = Math.round(temp);
  document.getElementById('stR').textContent = rodPct;

  controls.update();
  renderer.render(scene, camera);
}

// --- resize ---
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

applyTheme(); applyLang(); buildSteps();
setMode('steady');
requestAnimationFrame(frame);
</script>
</body>
</html>
