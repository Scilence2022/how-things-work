<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开尔文-亥姆霍兹剪切涡 · 剪切不稳定性</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="开尔文-亥姆霍兹剪切涡" data-en="Kelvin–Helmholtz Shear Billows">开尔文-亥姆霍兹剪切涡</h1>
  <div class="sub" data-zh="两层流速不同的流体擦肩而过,界面上任何微扰都会被剪切指数放大——正弦波长出陡峰、翻卷成一串「猫眼」涡,最后破碎混合;云里的浪花、木星条带的漩涡、飞机最怕的晴空湍流,都是这一条不稳定性 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Two fluid layers sliding past each other amplify any ripple on their interface exponentially — sinusoidal waves steepen, curl into a street of cat's-eye vortices, then break and mix; cloud breakers, the swirls along Jupiter's bands and the clear-air turbulence pilots fear most are all this one instability · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">两层流速不同的流体擦肩而过,界面上任何微扰都会被剪切指数放大——正弦波长出陡峰、翻卷成一串「猫眼」涡,最后破碎混合;云里的浪花、木星条带的漩涡、飞机最怕的晴空湍流,都是这一条不稳定性 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="剪切 ΔU" data-en="Shear ΔU">剪切 ΔU</span><span class="v" id="stDU">—</span>
  <span class="k" data-zh="时间 t" data-en="Time t">时间 t</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="振幅 A" data-en="Amplitude A">振幅 A</span><span class="v warn" id="stA">—</span>
  <span class="k" data-zh="状态" data-en="Stage">状态</span><span class="v ok" id="stS">—</span>
  <span class="k" data-zh="稳定度 g′" data-en="Stability g′">稳定度 g′</span><span class="v" id="stG">—</span>
</div>

<div id="plot">
  <h3 data-zh="振幅 A(t) · 半对数:直线段=指数增长,虚线=e 折叠拟合" data-en="Amplitude A(t) · semi-log: straight ramp = exponential stage, dashed = e-folding fit">振幅 A(t) · 半对数:直线段=指数增长,虚线=e 折叠拟合</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="暖色=上层快流" data-en="warm = fast upper layer">暖色=上层快流</span>
    <span class="chip.b" data-zh="冷色=下层慢流" data-en="cool = slow lower layer">冷色=下层慢流</span>
    <span class="chip.r" data-zh="界面=涡片(猫眼在此卷起)" data-en="interface = vortex sheet (cat's eyes roll up here)">界面=涡片(猫眼在此卷起)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnPerturb" data-zh="扰动一下" data-en="perturb">扰动一下</button>
    <button class="abtn" id="btnCloud" data-zh="云浪" data-en="cloud billows">云浪</button>
    <button class="abtn" id="btnSea" data-zh="海面风剪" data-en="sea wind-shear">海面风剪</button>
    <button class="abtn" id="btnJup" data-zh="木星条带" data-en="Jupiter bands">木星条带</button>
    <button class="abtn brk" id="btnRelay" data-zh="重铺界面" data-en="relay interface">重铺界面</button>
  </div>
  <div class="row"><label data-zh="上层流速 U₂" data-en="Upper speed U₂">上层流速 U₂</label><input id="u2" type="range" min="0" max="2" step="0.05" value="1.2"><span class="val" id="u2Val">1.20</span></div>
  <div class="row"><label data-zh="下层流速 U₁" data-en="Lower speed U₁">下层流速 U₁</label><input id="u1" type="range" min="0" max="1" step="0.05" value="0.2"><span class="val" id="u1Val">0.20</span></div>
  <div class="row"><label data-zh="密度差 g′" data-en="Density gap g′">密度差 g′</label><input id="gp" type="range" min="0" max="0.5" step="0.01" value="0.12"><span class="val" id="gpVal">0.12</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../magnus-effect/" data-zh="涡的另一面:马格努斯效应" data-en="the vortex, harnessed: Magnus">涡的另一面:马格努斯效应</a>
    <a href="../reynolds-number/" data-zh="失稳的温床:雷诺数" data-en="the instability nursery: Reynolds number">失稳的温床:雷诺数</a>
    <a href="../cloud-formation/" data-zh="看得见的界面:云的形成" data-en="the visible interface: cloud formation">看得见的界面:云的形成</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x131c2a, 26, 72);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  const bg = new THREE.Color(dark ? 0x131c2a : 0xd9e5ef);
  scene.background = bg;
  scene.fog.color = bg;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('开尔文-亥姆霍兹剪切涡 · 剪切不稳定性', 'Kelvin–Helmholtz Shear Billows · shear instability');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncPresetBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
  drawPlot();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
camera.position.set(9.5, 3.4, 12.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 9, 7);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 剪切盒 ================= */
const Ldom = 10, Hhalf = 2.5, Zdep = 0.8, TWOPI = Math.PI * 2;
const upBox = new THREE.Mesh(new THREE.BoxGeometry(Ldom, Hhalf, Zdep),
  mat(0xff9e57, { opacity: 0.07, roughness: 0.9, metalness: 0, depthWrite: false }));
upBox.position.y = Hhalf / 2;
scene.add(upBox);
const dnBox = new THREE.Mesh(new THREE.BoxGeometry(Ldom, Hhalf, Zdep),
  mat(0x4d9fff, { opacity: 0.07, roughness: 0.9, metalness: 0, depthWrite: false }));
dnBox.position.y = -Hhalf / 2;
scene.add(dnBox);
const boxEdge = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(Ldom, Hhalf, Zdep)),
  new THREE.LineBasicMaterial({ color: 0x7d8ea3, transparent: true, opacity: 0.5 }));
scene.add(boxEdge);

/* ================= 涡片模型(点涡 + Krasny 重排) ================= */
/* 界面=涡片:NV 个等环量点涡沿界面等弧长重排(每步),
   速度 = Σ 脱奇 Biot–Savart u=Γ·(−Δy,Δx)/(r²+δ²),周期镜像 x±L。
   Γ_seg = ΔU·dx/(2π)(1/2π 折入 G);上层快 → 涡片顺时针(G<0)。 */
const NM = 150, NV = 48, NM2 = 120, NV2 = 40;
const DELTA = 0.12, D2 = DELTA * DELTA;
const KG = 0.4, Y2 = 1.6;               // 浮力耦合系数 / 木星第二界面基线
let U2 = 1.2, U1 = 0.2, gp = 0.12;      // 滑块:上层流速 / 下层流速 / 密度差
let jup = false;                        // 木星条带:第二片反向剪切界面
const dUmain = () => U2 - U1;
const dUs2 = () => -0.8 * (U2 - U1);

function newSheet(y0, nM, nV) {
  return { y0, nM, nV,
    px: new Float32Array(nM), py: new Float32Array(nM),
    bx: new Float32Array(nV), by: new Float32Array(nV),
    arc: new Float32Array(nM + 1), arcTot: Ldom,
    G: 0, amp: 0.02, resCtr: 0, vmax: 0.3, hist: [] };
}
const sh1 = newSheet(0, NM, NV);
const sh2 = newSheet(Y2, NM2, NV2);

const wrapX = x => ((x + Ldom / 2) % Ldom + Ldom) % Ldom - Ldom / 2;
const wrapDelta = d => ((d + Ldom / 2) % Ldom + Ldom) % Ldom - Ldom / 2;

function regridArc(s) {
  let a = 0; s.arc[0] = 0;
  for (let i = 1; i <= s.nM; i++) {
    const j = i % s.nM;
    a += Math.hypot(wrapDelta(s.px[j] - s.px[(i - 1) % s.nM]), s.py[j] - s.py[(i - 1) % s.nM]);
    s.arc[i] = a;
  }
  s.arcTot = Math.max(a, 1e-4);
}
function interpAtArc(s, frac, out) {
  let target = ((frac % 1) + 1) % 1 * s.arcTot;
  for (let i = 0; i < s.nM; i++) {
    const len = s.arc[i + 1] - s.arc[i];
    if (target <= s.arc[i + 1] || i === s.nM - 1) {
      const t = clamp((target - s.arc[i]) / Math.max(len, 1e-9), 0, 1);
      const j = (i + 1) % s.nM;
      out.x = wrapX(s.px[i] + wrapDelta(s.px[j] - s.px[i]) * t);
      out.y = s.py[i] + (s.py[j] - s.py[i]) * t;
      return;
    }
  }
}
const _ip = { x: 0, y: 0 };
function regridBlobs(s) {
  for (let j = 0; j < s.nV; j++) {
    interpAtArc(s, (j + 0.5) / s.nV, _ip);
    s.bx[j] = _ip.x; s.by[j] = _ip.y;
  }
}
function resampleMarkers(s) {
  const nx = new Float32Array(s.nM), ny = new Float32Array(s.nM);
  for (let i = 0; i < s.nM; i++) {
    interpAtArc(s, (i + 0.5) / s.nM, _ip);
    nx[i] = _ip.x; ny[i] = _ip.y;
  }
  s.px.set(nx); s.py.set(ny);
}
function seedSheet(s) {
  for (let i = 0; i < s.nM; i++) {
    s.px[i] = -Ldom / 2 + (i + 0.5) * Ldom / s.nM;
    s.py[i] = s.y0 + 0.02 * Math.sin(TWOPI * s.px[i] / 2.5);
  }
  regridArc(s); regridBlobs(s);
  s.amp = 0.02; s.resCtr = 0; s.vmax = 0.3; s.hist.length = 0;
}
const _v = { x: 0, y: 0 };
function velAt(s, X, Y, out) {
  const G = s.G; let ux = 0, uy = 0;
  for (let j = 0; j < s.nV; j++) {
    const bx = s.bx[j], by = s.by[j];
    for (let m = -1; m <= 1; m++) {          // 周期镜像 x±L
      const dx = X - (bx + m * Ldom), dy = Y - by;
      const f = G / (dx * dx + dy * dy + D2);
      ux -= dy * f; uy += dx * f;
    }
  }
  out.x = ux; out.y = uy;
}
const _ty = new Float32Array(NM2 > NM ? NM2 : NM);
function stepSheet(s, h, gpv, dUv) {
  s.G = -dUv * (Ldom / s.nV) / TWOPI;        // Γ_seg = ΔU·dx/(2π),符号:上层快→顺时针
  let vm = 0;
  const n = s.nM;
  for (let i = 0; i < n; i++) {
    velAt(s, s.px[i], s.py[i], _v);
    const vx = _v.x, vy = _v.y - gpv * KG * (s.py[i] - s.y0);   // 浮力回复
    s.px[i] = wrapX(s.px[i] + vx * h);
    s.py[i] = clamp(s.py[i] + vy * h, -2.35, 2.35);
    const sp = Math.abs(vx) + Math.abs(vy);
    if (sp > vm) vm = sp;
  }
  s.vmax = vm;
  _ty.set(s.py);
  for (let i = 0; i < n; i++)                // 轻微拉普拉斯平滑防锯齿
    s.py[i] += 0.02 * (_ty[(i - 1 + n) % n] + _ty[(i + 1) % n] - 2 * _ty[i]);
  regridArc(s);
  if (++s.resCtr % 90 === 0) { resampleMarkers(s); regridArc(s); }   // 偶尔弧长重整
  regridBlobs(s);
  let mn = 1e9, mx = -1e9;
  for (let i = 0; i < n; i++) { if (s.py[i] < mn) mn = s.py[i]; if (s.py[i] > mx) mx = s.py[i]; }
  s.amp = (mx - mn) / 2;
}

function makeSheetLine(color, op, nM) {

  pos.setUsage(THREE.DynamicDrawUsage);

const _xs = new Float32Array(NM2 > NM ? NM2 + 1 : NM + 1), _ys = new Float32Array(NM2 > NM ? NM2 + 1 : NM + 1);
function updateSheetLine(s, line) {
  const n = s.nM, pos = line.geometry.attributes.position;
  let acc = s.px[0]; _xs[0] = acc; _ys[0] = s.py[0];
  for (let i = 1; i <= n; i++) {
    const j = i % n;
    acc += wrapDelta(s.px[j] - s.px[(i - 1) % n]);
    _xs[i] = acc; _ys[i] = s.py[j];
  }
  let mean = 0;
  for (let i = 0; i <= n; i++) mean += _xs[i];
  const shift = Ldom * Math.round(mean / (n + 1) / Ldom);
  let k = 0;
  for (let i = 0; i < n; i++) {
    let x0 = _xs[i] - shift, x1 = _xs[i + 1] - shift;
    const mid = (x0 + x1) / 2;
    if (Math.abs(mid) > Ldom / 2) { const off = mid > 0 ? -Ldom : Ldom; x0 += off; x1 += off; }
    if (Math.max(Math.abs(x0), Math.abs(x1)) > Ldom / 2 + 0.15) continue;
    pos.setXYZ(k++, x0, _ys[i], 0);
    pos.setXYZ(k++, x1, _ys[i + 1], 0);
  }
  pos.needsUpdate = true;
  line.geometry.setDrawRange(0, k);
}

}

/* ================= 曲线图(A 半对数) ================= */
const plotCv = document.getElementById('plotCv');
function fitSigma() {
  const h = sh1.hist; let n = 0, st = 0, sx = 0, sy = 0, sxx = 0, sxy = 0, t0 = NaN, t1 = NaN;
  for (const p of h) {
    if (p.a < 0.02 || p.a > 0.32) continue;
    const x = p.t, y = Math.log(p.a);
    n++; st += x; sx += x; sy += y; sxx += x * x; sxy += x * y;
    if (Number.isNaN(t0)) t0 = x; t1 = x;
  }
  if (n < 8 || t1 - t0 < 2) return null;
  const denom = n * sxx - sx * sx;
  if (Math.abs(denom) < 1e-9) return null;
  const slope = (n * sxy - sx * sy) / denom;
  const icept = (sy - slope * sx) / n;
  return { slope, icept, t0, t1 };
}
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const padL = 34, padR = 14, padT = 12, padB = 28;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const t1 = Math.max(40, tSim + 1), t0 = t1 - 40;
  const X = t => padL + (t - t0) / (t1 - t0) * (W - padL - padR);
  const la = a => Math.log10(clamp(a, 0.004, 3.2));
  const Y = a => padT + (1 - (la(a) + 2.4) / 2.9) * (H - padT - padB);
  ctx.strokeStyle = 'rgba(128,150,170,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '16px system-ui';
  for (const [a, txt] of [[0.01, '0.01'], [0.1, '0.1'], [1, '1.0']]) {
    ctx.strokeStyle = 'rgba(128,150,170,.16)';
    ctx.beginPath(); ctx.moveTo(padL, Y(a)); ctx.lineTo(W - padR, Y(a)); ctx.stroke();
    ctx.fillText(txt, 6, Y(a) + 5);
  }
  for (let tt = Math.ceil(t0 / 10) * 10; tt <= t1; tt += 10)
    ctx.fillText(tt.toFixed(0) + (LANG === 'en' ? ' t.u.' : ' 时'), X(tt) - 12, H - 8);
  /* 饱和参考线 */
  ctx.strokeStyle = 'rgba(128,150,170,.4)'; ctx.setLineDash([5, 6]);
  ctx.beginPath(); ctx.moveTo(padL, Y(0.9)); ctx.lineTo(W - padR, Y(0.9)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillText(L('饱和', 'satur.'), W - 58, Y(0.9) - 6);
  /* A(t) 曲线 */
  ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3; ctx.beginPath();
  let started = false;
  for (const p of sh1.hist) {
    if (p.t < t0) continue;
    const x = X(p.t), y = Y(p.a);
    started ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    started = true;
  }
  ctx.stroke();
  /* e 折叠拟合(指数段回归) */
  const fit = fitSigma();
  if (fit && fit.slope > 0.01) {
    ctx.strokeStyle = '#4dabf7'; ctx.lineWidth = 2; ctx.setLineDash([7, 6]);
    ctx.beginPath();
    ctx.moveTo(X(fit.t0), Y(Math.exp(fit.icept + fit.slope * fit.t0)));
    ctx.lineTo(X(fit.t1), Y(Math.exp(fit.icept + fit.slope * fit.t1)));
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#74c0fc';
    ctx.fillText(L(`σ≈${fit.slope.toFixed(2)}  τ_e≈${(1 / fit.slope).toFixed(1)}`,
      `σ≈${fit.slope.toFixed(2)}  τ_e≈${(1 / fit.slope).toFixed(1)}`), padL + 10, padT + 18);
  }
  /* 当前点 */
  const px = X(clamp(tSim, t0, t1)), py = Y(sh1.amp);
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath(); ctx.arc(px, py, 6, 0, TWOPI); ctx.fill();
}

  else applyPreset('jupiter');
});
document.getElementById('btnRelay').addEventListener('click', () => { relay(); syncAll(); });
document.getElementById('u2').addEventListener('input', e => { U2 = +e.target.value; syncAll(); });
document.getElementById('u1').addEventListener('input', e => { U1 = +e.target.value; syncAll(); });
document.getElementById('gp').addEventListener('input', e => { gp = +e.target.value; syncAll(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = spinOn;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
function stateInfo() {
  if (gp * KG >= 0.1 && sh1.arcTot < 12 && tSim > 6)
    return [L('浮力稳定:涡片被压平', 'stabilized: buoyancy pins the sheet'), 'ok'];
  if (sh1.arcTot > 20 || sh1.amp > 1.2) return [L('破碎混合', 'breaking & mixing'), 'bad'];
  if (sh1.arcTot > 12) return [L('卷起(猫眼)', 'rolling into cat\'s eyes'), 'warn'];
  return [L('线性指数增长', 'linear exponential growth'), 'ok'];
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0);
  if (dt > 0) {
    /* 数值卫生:dt ≤ 0.02·(点涡间距/最大速度),子步 2 */
    const sp = Math.max(sh1.vmax, jup ? sh2.vmax : 0, 0.25);
    let hAllow = 0.02 * Math.min(sh1.arcTot / sh1.nV, jup ? sh2.arcTot / sh2.nV : 1) / sp;
    hAllow = clamp(hAllow, 0.0015, 0.02);
    const h = Math.min(dt, hAllow * 2) / 2;
    const g = gp, d1 = dUmain(), d2v = dUs2();
    for (let s = 0; s < 2; s++) {
      stepSheet(sh1, h, g, d1);
      if (jup) stepSheet(sh2, h, g, d2v);
      stepTracers(h);
    }
    tSim += 2 * h;
    histAcc += 2 * h;
    if (histAcc > 0.08) {
      histAcc = 0;
      sh1.hist.push({ t: tSim, a: sh1.amp });
      if (sh1.hist.length > 1400) sh1.hist.shift();
    }
    if (++colT % 6 === 0) tracerColors();
  }
  updateSheetLine(sh1, line1);
  if (jup) updateSheetLine(sh2, line2);
  updateDots();
  for (let i = 0; i < TR; i++) {
    const tr = trs[i];
    dummy.position.set(tr.x, tr.y, tr.z);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    trIM.setMatrixAt(i, dummy.matrix);
  }
  trIM.instanceMatrix.needsUpdate = true;
  statsAcc += dt0;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stDU.textContent = (U2 - U1).toFixed(2);
    stT.textContent = tSim.toFixed(1);
    stA.textContent = sh1.amp.toFixed(3);
    const [txt, cls] = stateInfo();
    stS.textContent = txt;
    stS.className = 'v ' + cls;
    stG.textContent = gp.toFixed(2);
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(读参数 → build → theme → lang → start) ================= */
U2 = clamp(qsFloat('u2', 1.2), 0, 2);
U1 = clamp(qsFloat('u1', 0.2), 0, 1);
gp = clamp(qsFloat('rho', 0.12), 0, 0.5);
const preset = qs.get('preset');
seedSheet(sh1);
if (preset === 'cloud' || preset === 'sea' || preset === 'jupiter') applyPreset(preset);
syncSliders();
setPlayLabel();
buildSteps();
applyTheme();
applyLang();
syncAll();
start();
</script>
</body>
</html>
