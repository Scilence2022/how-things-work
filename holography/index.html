<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全息 · 把相位刻进条纹</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,169,77,.6); background: rgba(255,169,77,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(232,89,12,.55); background: rgba(232,89,12,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="全息 · 把相位刻进条纹" data-en="Holography · Phase Pressed into Fringes">全息 · 把相位刻进条纹</h1>
  <div class="sub" data-zh="激光被分束镜一分为二:参考光以平面波直奔干板,物光照亮棋子后被表面散射成携带形状的漫射波,两束相干光在乳剂里叠加,I=I₁+I₂+2√(I₁I₂)cosΔφ 把物光每点的相位刻成亮暗条纹——θ=30° 时条纹间距只有 1.22 µm;重建时参考光射向条纹,光栅的 +1 级衍射把原始波前复活,棋子虚像带完整视差浮现,−1 级给出共轭实像;把干板遮住一半,像并不缺半——每块碎片都记录过整个物体,只是窗口变窄;普通照片只记 |E|²,相位全丢,永远还原不出立体 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="A laser is split in two at the beamsplitter: the reference wave marches to the plate as a plane wave, while the object wave illuminates a pawn and is scrambled by surface scatter into a diffuse carrier of shape; the two coherent beams overlap in the emulsion and I=I₁+I₂+2√(I₁I₂)cosΔφ presses the phase Δφ of every object point into bright and dark fringes — at θ=30° the spacing is a mere 1.22 µm, about 820 lines per millimeter; on reconstruction the reference light hits the fringes, the +1 diffraction order revives the original wavefront, and the pawn's virtual image floats with full parallax while the −1 order yields a conjugate real image; cover half the plate and the image is not halved — every fragment recorded the whole object, only the window narrows; an ordinary photo keeps only |E|², loses all phase, and can never be re-formed into depth · 3D interactive demo · drag to orbit · Space = run/pause">全息 · 把相位刻进条纹</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="激光波长" data-en="Laser wavelength">激光波长</span><span class="v" id="stLam">—</span>
  <span class="k" data-zh="条纹间距" data-en="Fringe spacing">条纹间距</span><span class="v" id="stD">—</span>
  <span class="k" data-zh="干板状态" data-en="Plate state">干板状态</span><span class="v" id="stPlate">—</span>
  <span class="k" data-zh="像类型" data-en="Image type">像类型</span><span class="v" id="stImg">—</span>
  <span class="k" data-zh="遮挡比例" data-en="Occlusion">遮挡比例</span><span class="v" id="stOcc">—</span>
  <span class="k" data-zh="可用视角" data-en="Usable view">可用视角</span><span class="v" id="stFov">—</span>
</div>

<div id="plot">
  <h3 data-zh="干板强度剖面 I(x)=I₁+I₂+2√(I₁I₂)cos(2πx/d) —— 夹角越大条纹越密;灰色虚线=普通照片的均匀曝光(无条纹)" data-en="Plate intensity profile I(x)=I₁+I₂+2√(I₁I₂)cos(2πx/d) — larger angle, denser fringes; the gray dash is a photo's uniform exposure (no fringes)">干板强度剖面 I(x)=I₁+I₂+2√(I₁I₂)cos(2πx/d) —— 夹角越大条纹越密;灰色虚线=普通照片的均匀曝光(无条纹)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="参考光:平面波直射干板" data-en="reference: plane wave to the plate">参考光:平面波直射干板</span>
    <span class="chip.o" data-zh="物光:被物体散射的波" data-en="object beam: scattered by the subject">物光:被物体散射的波</span>
    <span class="chip.g" data-zh="干涉条纹:相位被刻成位置" data-en="fringes: phase pressed into position">干涉条纹:相位被刻成位置</span>
    <span class="chip.b" data-zh="±1 级衍射:虚像与共轭实像" data-en="±1 orders: virtual & conjugate images">±1 级衍射:虚像与共轭实像</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnExpose" data-zh="曝光(刻条纹)" data-en="Expose (record fringes)">曝光(刻条纹)</button>
    <button class="abtn" id="btnRecon" data-zh="重建(参考光复照)" data-en="Reconstruct (ref. light on)">重建(参考光复照)</button>
    <button class="abtn brk" id="btnReset" data-zh="重置干板" data-en="Reset plate">重置干板</button>
  </div>
  <div class="row"><label data-zh="两束光夹角 θ" data-en="Beam angle θ">两束光夹角 θ</label><input id="sTheta" type="range" min="10" max="60" step="1" value="30"><span class="val" id="sThetaVal">30 °</span></div>
  <div class="row"><label data-zh="遮挡干板" data-en="Occlude plate">遮挡干板</label><input id="sOcc" type="range" min="0" max="100" step="5" value="0"><span class="val" id="sOccVal">0 %</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRays" type="checkbox" checked> <span data-zh="显示光线" data-en="Rays">显示光线</span></label>
      <label><input id="tglPhoto" type="checkbox"> <span data-zh="普通照片对照" data-en="Photo contrast">普通照片对照</span></label>
      <label><input id="tglLoupe" type="checkbox"> <span data-zh="条纹放大镜" data-en="Fringe loupe">条纹放大镜</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../double-slit/" data-zh="双缝干涉:条纹的源头" data-en="double-slit: where fringes come from">双缝干涉:条纹的源头</a>
    <a href="../laser/" data-zh="激光:相干光的供给者" data-en="laser: the supplier of coherent light">激光:相干光的供给者</a>
    <a href="../camera-sensor/" data-zh="相机传感器:只记强度的对照" data-en="camera sensor: the intensity-only contrast">相机传感器:只记强度的对照</a>
    <a href="../thin-film/" data-zh="薄膜干涉:另一种相位游戏" data-en="thin-film: another phase game">薄膜干涉:另一种相位游戏</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 24, 70);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  tableM.color.setHex(dark ? 0x23262d : 0xaeb9c4);
  dotM.color.setHex(dark ? 0x101318 : 0x8d99a5);
  machineM.color.setHex(dark ? 0x3a4048 : 0x707a86);
  plateGlassM.color.setHex(dark ? 0xbfd4e6 : 0x9fb4c8);
  pawnM.color.setHex(dark ? 0xe9e2d2 : 0xcfc6b2);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('全息 · 把相位刻进条纹', 'Holography · Phase Pressed into Fringes');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 140);
camera.position.set(-3.5, 6.6, 10.2);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0.4, 0.8, 0.7);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);

function pawnPoints(n) {

    let k = 0; while (k < prof.length - 2 && prof[k + 1][1] < t) k++;
    const [r0, y0] = prof[k], [r1, y1] = prof[k + 1];
    const f = (t - y0) / Math.max(0.001, y1 - y0);
    const r = Math.max(0.02, lerp(r0, r1, f)), a2 = Math.random() * Math.PI * 2;
    a[i * 3] = r * Math.cos(a2) * 0.95; a[i * 3 + 1] = t * 1.05; a[i * 3 + 2] = r * Math.sin(a2) * 0.95;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(a, 3));
  return g;
}

const cRed = new THREE.Color(0xff5252), cAmb = new THREE.Color(0xffb35c);
const parts = [];
function addParticles(path, n, col, s) {
  for (let i = 0; i < n && parts.length < P_MAX; i++)
    parts.push({ path, u: Math.random(), s: s * (0.8 + Math.random() * 0.4), col });
}
addParticles(laserPath, 8, cRed, 0.5);
refPaths.forEach(p => addParticles(p, 4, cRed, 0.42));
addParticles(pObj, 8, cAmb, 0.4);

function stepParts(dt) {
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (!p.path.cond()) { pPos[i * 3 + 1] = -999; continue; }
    p.u = (p.u + p.s * dt) % 1;
    const x = lerp(p.path.a.x, p.path.b.x, p.u), y = lerp(p.path.a.y, p.path.b.y, p.u), z = lerp(p.path.a.z, p.path.b.z, p.u);
    pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
    pCol[i * 3] = p.col.r; pCol[i * 3 + 1] = p.col.g; pCol[i * 3 + 2] = p.col.b;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

function drawLoupe() {
  const c = loupeCv.getContext('2d');
  const W = 150, H = 100;
  c.clearRect(0, 0, W, H);
  c.fillStyle = 'rgba(8,10,14,.9)'; c.fillRect(0, 0, W, H);
  const s = clamp(dMicron() * 26, 7, 60);
  c.save();
  c.translate(W / 2, H / 2); c.rotate((theta / 2) * Math.PI / 180 * 0.5);
  for (let x = -W; x < W; x += s) {
    c.fillStyle = `rgba(230,238,246,${0.12 + expo * 0.75})`;
    c.fillRect(x, -H, s * 0.5, H * 2);
  }
  c.restore();
  c.strokeStyle = 'rgba(116,192,252,.8)'; c.strokeRect(0.5, 0.5, W - 1, H - 1);
  c.fillStyle = '#bde9ff'; c.font = '11px system-ui';
  c.fillText(`d=${dMicron().toFixed(2)} µm  ×40000`, 6, H - 6);
}

    d: '两束光在乳剂里叠加:I=I₁+I₂+2√(I₁I₂)cosΔφ,物光每一点的相位 Δφ 决定这里是亮纹还是暗纹。θ=30° 时条纹间距仅 1.22 µm,每毫米约 820 条——相位从此变成可以冲洗出来的几何。点「曝光」看条纹显影,拖夹角滑块看条纹变密变疏。',
    de: 'The beams overlap in the emulsion: I=I₁+I₂+2√(I₁I₂)cosΔφ — the phase Δφ of every object point decides bright fringe or dark. At θ=30° the spacing is just 1.22 µm, about 820 lines per millimeter: phase has become geometry you can develop. Press Expose, and drag the angle slider to watch fringes densify.',
    act: () => { setPhoto(false); doReset(); applyOcc(0); doExpose(); flyTo([3.2, 4.2, 7.4], [4.6, 0.9, 0.3]); } },
  { b: '重建:条纹当光栅,波前复活', be: 'Reconstruction: fringes as a grating, the wavefront revives',
    d: '显影后的条纹就是一副衍射光栅。用原参考光照射:+1 级衍射精确复制出当年的物光波前——眼睛接收到它,就像棋子还站在那里,虚像带完整视差;−1 级则给出相位共轭的实像。点「重建」,物体和物光都会被挡住。',
    de: 'Developed fringes are a diffraction grating. Illuminate with the original reference: the +1 order reproduces the object wavefront exactly — your eye receives it as if the pawn still stood there, a virtual image with full parallax; the −1 order gives the phase-conjugated real image. Press Reconstruct: object and object beam are blocked.',
    act: () => { if (expo < 1) { expo = 1; exposing = false; } doRecon(); flyTo([8.6, 3.4, 7.0], [5.4, 1.0, 0.4]); } },
  { b: '打碎一半:像不缺、只是窗口变窄', be: 'Smash half: the image is not halved, the window just narrows',
    d: '把干板遮住一半再重建:虚像依然完整!物体上每一点发出的光都洒满整块干板,任何碎片都记录过整个物体。代价是数值孔径:像变暗、可用视角从 ±28° 缩到 ±14°,分辨率也随之下降——这就是全息的「碎片定理」。',
    de: 'Occlude half the plate and reconstruct: the virtual image is still whole! Light from every object point splattered across the entire plate, so any fragment recorded the whole object. The price is numerical aperture: dimmer image, usable view shrinks from ±28° to ±14°, resolution drops — the holographic fragment theorem.',
    act: () => { if (expo < 1) { expo = 1; exposing = false; } applyOcc(0.5); doRecon(); flyTo([9.2, 2.8, 5.4], [5.5, 1.0, 0.2]); } },
  { b: '普通照片对照:没有条纹就没有像', be: 'Photo contrast: no fringes, no image',
    d: '打开「普通照片对照」再走一遍曝光+重建:干板只记 |E|²,均匀曝光、没有条纹,也就没有光栅;重建时参考光径直穿过,只在干板后留下一团亮斑。没有相位,就没有立体——全息与照片的分水岭就在 cosΔφ 这一项。',
    de: 'Switch on "photo contrast" and run expose + reconstruct again: the plate records only |E|², a uniform exposure with no fringes and hence no grating; the reference passes straight through and leaves a mere blob. No phase, no depth — the watershed between holography and photography is that cosΔφ term.',
    act: () => { setPhoto(true); doReset(); applyOcc(0); expo = 1; doRecon(); flyTo([5.6, 4.0, 6.2], [5.5, 1.0, 0.2]); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:干板强度剖面 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  if (!plotCv.clientWidth) return;
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 46, padR = 14, padT = 12, padB = 22;
  const X = x => padL + x / 12 * (W - padL - padR);
  const Y = v => (H - padB) - (clamp(v, -0.15, 2.2) + 0.15) / 2.35 * (H - padT - padB);
  ctx.font = '12px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.25)';
  ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText('2I', 12, Y(2) + 4);
  ctx.fillText('0', padL - 14, H - padB + 4);
  ctx.fillText('x/µm', W - padR - 44, H - 6);
  const d = dMicron();
  ctx.setLineDash([5, 4]); ctx.strokeStyle = 'rgba(150,160,175,.8)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(12), Y(1)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = expo > 0 ? '#ff6b6b' : 'rgba(255,107,107,.45)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k <= 240; k++) {
    const x = k / 240 * 12, v = 1 + Math.cos(2 * Math.PI * x / d);
    k ? ctx.lineTo(X(x), Y(v)) : ctx.moveTo(X(x), Y(v));
  }
  ctx.stroke();
  ctx.fillStyle = '#ff6b6b';
  ctx.fillText(L('干涉条纹', 'fringes'), padL + 8, padT + 14);
  ctx.fillStyle = '#9aa3ad';
  ctx.fillText(L('普通照片', 'photo'), padL + 88, padT + 14);
  ctx.fillStyle = cTxt;
  ctx.fillText(`d=${d.toFixed(2)}µm θ=${theta}°`, W - padR - 112, padT + 14);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elTheta = document.getElementById('sTheta'), elThetaVal = document.getElementById('sThetaVal');
const elOcc = document.getElementById('sOcc'), elOccVal = document.getElementById('sOccVal');
const stLam = document.getElementById('stLam'), stD = document.getElementById('stD'),
  stPlate = document.getElementById('stPlate'), stImg = document.getElementById('stImg'),
  stOcc = document.getElementById('stOcc'), stFov = document.getElementById('stFov');
const formulaEl = document.getElementById('formula');
const btnExpose = document.getElementById('btnExpose'), btnRecon = document.getElementById('btnRecon'),
  btnReset = document.getElementById('btnReset');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elTheta.value = theta; elThetaVal.textContent = `${theta} °`;
  elOcc.value = Math.round(occ * 100); elOccVal.textContent = `${Math.round(occ * 100)} %`;
}
function syncBtns() {
  btnExpose.classList.toggle('on', exposing);
  btnRecon.classList.toggle('on', rec);
}
function plateName() {
  if (rec) return L('重建中', 'reconstructing');
  if (exposing && expo < 1) return L(`曝光中 ${(expo * 100) | 0}%`, `exposing ${(expo * 100) | 0}%`);
  if (expo >= 1) return photoMode ? L('已曝光·均匀', 'exposed·uniform') : L('已曝光·条纹', 'exposed·fringes');
  return L('空白', 'blank');
}
function updateStats() {
  stLam.innerHTML = `632.8<small> nm</small>`;
  stD.innerHTML = `${dMicron().toFixed(2)}<small> µm</small>`;
  stD.className = 'v ok';
  stPlate.textContent = plateName();
  stPlate.className = 'v ' + (rec ? 'warn' : expo >= 1 ? 'ok' : '');
  stImg.textContent = rec ? (photoMode ? L('仅亮斑(对照)', 'blob only (contrast)') : L('虚像+共轭实像', 'virtual + conjugate')) : L('无', 'none');
  stImg.className = 'v ' + (rec && !photoMode ? 'ok' : '');
  stOcc.textContent = `${Math.round(occ * 100)} %`;
  stOcc.className = 'v ' + (occ > 0.6 ? 'bad' : occ > 0 ? 'warn' : '');
  stFov.textContent = `±${(28 * (1 - occ)).toFixed(0)}°`;
}
function updateFormula() {
  const d = dMicron();
  formulaEl.innerHTML = L(
    `<b>记录:I = I₁+I₂+2√(I₁I₂)cosΔφ</b>,Δφ 含物光相位 → 相位决定条纹的亮暗位置<br>` +
    `<b>条纹间距:d = λ/(2sin(θ/2))</b> = 632.8nm/(2·sin${(theta / 2)}°) = <b>${d.toFixed(2)} µm</b>(θ=${theta}°,θ=30° 时 1.22 µm)<br>` +
    `<b>重建:条纹=衍射光栅</b>,+1 级复制原始波前 → 虚像;−1 级 → 共轭实像<br>` +
    `<b>照片只记 |E|²</b>:cos 项只剩直流,相位全丢 → 重建只有均匀亮斑<br>` +
    `<b>碎片定理</b>:每块碎片都记过整个物体 → 像完整,仅数值孔径变小:遮挡 ${Math.round(occ * 100)}% → 可用视角 ±${(28 * (1 - occ)).toFixed(0)}°`,
    `<b>Recording: I = I₁+I₂+2√(I₁I₂)cosΔφ</b>, Δφ carries the object phase → phase decides where fringes fall<br>` +
    `<b>Fringe spacing: d = λ/(2sin(θ/2))</b> = 632.8nm/(2·sin${(theta / 2)}°) = <b>${d.toFixed(2)} µm</b> (θ=${theta}°; 1.22 µm at 30°)<br>` +
    `<b>Reconstruction: fringes = a grating</b>, +1 order copies the original wavefront → virtual image; −1 order → conjugate real image<br>` +
    `<b>A photo keeps only |E|²</b>: the cosine collapses to DC, phase lost → reconstruction is a uniform blob<br>` +
    `<b>Fragment theorem</b>: every fragment saw the whole object → image complete, only NA shrinks: ${(Math.round(occ * 100))}% occluded → view ±${(28 * (1 - occ)).toFixed(0)}°`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elTheta.addEventListener('input', () => { theta = +elTheta.value; applyTheta(); updateFormula(); updateStats(); drawPlot(); });
elOcc.addEventListener('input', () => applyOcc(+elOcc.value / 100));
btnExpose.addEventListener('click', doExpose);
btnRecon.addEventListener('click', doRecon);
btnReset.addEventListener('click', () => { doReset(); applyOcc(0); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglRays').addEventListener('change', e => { raysOn = e.target.checked; });
document.getElementById('tglPhoto').addEventListener('change', e => setPhoto(e.target.checked));
document.getElementById('tglLoupe').addEventListener('change', e => { loupeOn = e.target.checked; loupeObj.visible = loupeOn; drawLoupe(); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    if (exposing && expo < 1) {
      expo = Math.min(1, expo + dt / 2.5);
      if (expo >= 1) { exposing = false; syncBtns(); updateStats(); }
    }
    stepParts(dt * 1.2);
  }
  /* 光线可见性 */
  rayMeshRef.visible = raysOn;
  rayMeshInc.visible = raysOn && !rec;
  rayMeshScat.visible = raysOn && !rec;
  objCover.visible = rec;
  /* 乳剂 / 条纹 / 像的渐变 */
  emulM.opacity = 0.12 + Math.min(0.72, expo * (photoMode ? 0.62 : 0.5));
  fringeM.opacity = photoMode ? 0 : expo * 0.85;
  const imgT = rec && !photoMode ? 0.9 * (1 - 0.55 * occ) : 0;
  const conT = rec && !photoMode ? 0.34 * (1 - 0.55 * occ) : 0;
  const blbT = rec && photoMode ? 0.9 : 0;
  const kf = Math.min(1, dt0 * 3);
  imgM.opacity += (imgT - imgM.opacity) * kf;
  conjM.opacity += (conT - conjM.opacity) * kf;
  blobM.opacity += (blbT - blobM.opacity) * kf;
  fan.visible = rec && !photoMode && raysOn;
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.3) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
layoutOcc();
applyTheta();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
