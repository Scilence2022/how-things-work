<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>血红蛋白协同运氧 · MWC 别构模型 3D 动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d8434b;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b32a31;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: var(--cv-pill); border: 1px solid var(--panel-border);
    color: var(--text3); font-size: 12px; line-height: 1.35; padding: 3px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  .lbl.s    { border-color: rgba(255,255,255,.45); color: #eef3f8; font-weight: 600; }
  .lbl.b    { border-color: rgba(140,200,225,.7); color: #bfe6f2; }
  .lbl.warn { border-color: rgba(255,150,120,.8); color: #ffc9b3; }
  .lbl.h    { border-color: rgba(255,143,160,.7); color: #ffc9d2; }
  .lbl.cap  { border-color: rgba(216,67,75,.7); color: #ffb0a6; font-size: 12.5px; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  :root[data-theme="light"] .lbl.s    { color: #33414f; border-color: rgba(15,25,40,.35); }
  :root[data-theme="light"] .lbl.b    { color: #2f7f95; border-color: rgba(47,127,149,.6); }
  :root[data-theme="light"] .lbl.warn { color: #b03a12; border-color: rgba(190,80,60,.7); }
  :root[data-theme="light"] .lbl.h    { color: #c23a44; border-color: rgba(194,58,68,.6); }
  :root[data-theme="light"] .lbl.cap  { color: #b32a31; border-color: rgba(179,42,49,.6); }

  /* ===== 工具条（全站共享模式） ===== */
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  #badge { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5;
    pointer-events: none; font-size: 15px; font-weight: 700; padding: 7px 20px;
    border-radius: 999px; border: 1.5px solid; background: var(--cv-pill);
    backdrop-filter: blur(6px); white-space: nowrap; }

  #msg { position: fixed; right: 24px; bottom: 24px; z-index: 4; pointer-events: none;
    max-width: 46vw; text-align: right; font-size: 14px; font-weight: 600; opacity: 0;
    text-shadow: 0 2px 6px rgba(0,0,0,.55); }
  :root[data-theme="light"] #msg { text-shadow: 0 1px 3px rgba(255,255,255,.7); }

  #plot { position: fixed; right: 18px; top: 64px; z-index: 4; width: 344px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
    backdrop-filter: blur(6px); padding: 10px 12px 8px; box-shadow: var(--shadow); }
  #plot h3 { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  #plotCv { width: 100%; height: 252px; display: block; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 372px;
    max-height: calc(100vh - 110px); overflow: auto;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 13px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o2 { color: #ff8fa0; border-color: rgba(255,143,160,.6); }
  .chip.t  { color: #9fd3e8; border-color: rgba(140,200,225,.55); }
  .chip.r  { color: #ff9b8a; border-color: rgba(255,140,120,.55); }
  .chip.fe { color: #ffd9a0; border-color: rgba(255,200,140,.55); }
  :root[data-theme="light"] .chip.o2 { color: #c23a44; border-color: rgba(194,58,68,.6); }
  :root[data-theme="light"] .chip.t  { color: #2f7f95; border-color: rgba(47,127,149,.55); }
  :root[data-theme="light"] .chip.r  { color: #c23a44; border-color: rgba(194,58,68,.55); }
  :root[data-theme="light"] .chip.fe { color: #96622a; border-color: rgba(150,98,42,.55); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 5px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(216,67,75,.14); border-color: rgba(216,67,75,.5); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  :root[data-theme="dark"] #steps li.on .t b { color: #ffc9c2; }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1200px) { #plot { display: none; } }
  @media (max-width: 900px) { #msg { display: none; } #badge { font-size: 12.5px; padding: 5px 14px; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 52vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
    #badge { display: none; }
  }
</style>

<body>
<div id="app"></div>

<div id="title">
  <h1 data-zh="血红蛋白怎么协同运氧？—— MWC 别构模型" data-en="How does hemoglobin carry O₂ cooperatively? — The MWC allosteric model">血红蛋白怎么协同运氧？—— MWC 别构模型</h1>
  <div class="sub" data-zh="3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · O₂ 结合诱导 T→R 构象翻转 · S 形曲线 vs 肌红蛋白双曲线 · 空格播放/暂停" data-en="Interactive 3D · drag to orbit / scroll to zoom · O₂ binding flips T→R · sigmoid curve vs myoglobin hyperbola · Space = play/pause">3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · O₂ 结合诱导 T→R 构象翻转 · S 形曲线 vs 肌红蛋白双曲线 · 空格播放/暂停</div>

    <a href="../michaelis-menten/" data-zh="对照：无协同的米氏双曲线" data-en="contrast: non-cooperative Michaelis hyperbola">对照：无协同的米氏双曲线</a>
    <a href="../enzyme-induced-fit/" data-zh="蛋白质也会变形：诱导契合" data-en="proteins change shape too: induced fit">蛋白质也会变形：诱导契合</a>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 工具 ---------------- */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const mixC = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(PAL.bg);
  groundMat.color.set(THEME === 'light' ? 0xdde3ec : 0x1d2330);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('血红蛋白协同运氧 · MWC 别构模型 3D 动画',
                     'Hemoglobin Cooperativity · MWC Allosteric Model 3D');
  buildSteps();
  setPlayLabel();
  for (const r of labelRegistry) r.o.element.textContent = r.text();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 常量与时序（与原 2D 版一致，周期 15 秒） ---------------- */
const CYCLE = 15;
const HILL_N = 2.8, P50 = 26.6;
const hill = p => 100 * Math.pow(p, HILL_N) / (Math.pow(P50, HILL_N) + Math.pow(p, HILL_N));
const mbSat = p => 100 * p / (p + 2.8);
const ROTS = 6.5 * Math.PI / 180;                 // 每个二聚体各转 6.5°（相对 ~13°）
const T_TOP = [74, 88, 100], T_BOT = [63, 77, 89];
const R_TOP = [130, 62, 70], R_BOT = [114, 55, 63];

// 四个亚基：half 0 = α₁β₁ 二聚体（后），half 1 = α₂β₂（前）；绕 Y 轴（二重轴）对转
const SUBS = [
  { id: 'α₁', x: -0.78, y:  0.08, z: -0.62, half: 0, bind: 0.265, rel: 0.864, sc: 0.95 },
  { id: 'β₁', x:  0.78, y: -0.05, z: -0.62, half: 0, bind: 0.565, rel: 0.836, sc: 1.03 },
  { id: 'α₂', x: -0.78, y: -0.08, z:  0.62, half: 1, bind: 0.640, rel: 0.808, sc: 0.95 },
  { id: 'β₂', x:  0.78, y:  0.05, z:  0.62, half: 1, bind: 0.715, rel: 0.780, sc: 1.03 },
];
const BRIDGES = [
  { a: 0, b: 3, thr: 0.02, bt: 0.325 },   // α₁–β₂ 对角
  { a: 0, b: 2, thr: 0.28, bt: 0.375 },   // α₁–α₂ 左竖
  { a: 1, b: 3, thr: 0.72, bt: 0.428 },   // β₁–β₂ 右竖
  { a: 1, b: 2, thr: 0.97, bt: 0.478 },   // β₁–α₂ 对角
];
const O2F = [
  { sub: 0, t0: 0.120, t1: 0.265, hard: true  },   // 第 1 个：艰难
  { sub: 1, t0: 0.500, t1: 0.565, hard: false },   // 之后轻快
  { sub: 2, t0: 0.575, t1: 0.640, hard: false },
  { sub: 3, t0: 0.660, t1: 0.715, hard: false },
];
const FLY_START = [V3(-3.4, 1.9, 0.8), V3(3.5, 2.2, -1.1), V3(-3.2, -1.5, 2.0), V3(3.3, -1.7, 2.4)];
const REL_DRIFT = V3(0.4, -1.0, 0.3);

function rfrac(t) { return ss(0.31, 0.49, t) * (1 - ss(0.82, 0.90, t)); }
function po2Cur(t) { return 25 + 75 * ss(0.08, 0.13, t) - 75 * ss(0.78, 0.88, t); }
function satCur(t) {
  const steps = 6 + 19 * ss(0.263, 0.278, t) + 25 * ss(0.563, 0.578, t)
              + 25 * ss(0.638, 0.653, t) + 22 * ss(0.713, 0.728, t);
  const s = lerp(steps, hill(100 - 75 * ss(0.78, 0.88, t)), ss(0.775, 0.80, t));
  return lerp(s, 6, ss(0.885, 0.955, t));
}
// Fe²⁺ 高出卟啉平面的程度：结合时落入平面，释放时重新拱起
const feLiftOf = (s, t) => clamp(1 - ss(s.bind - 0.023, s.bind - 0.003, t) + ss(s.rel + 0.002, s.rel + 0.022, t), 0, 1);

/* ---------------- 相位讲解（7 步覆盖 0..1，文案与原页一致） ---------------- */
const STEPS = [
  { t0: 0.00, t1: 0.12, n: 1, b: 'T 态 · 锁紧', d: '去氧四聚体被盐桥锁成方正紧绷的轮廓，O₂ 口袋狭窄、亲和力低——刚从组织回来的形态。',
    be: 'T state · locked', de: 'Salt bridges lock the deoxy tetramer into a stiff, boxy shape; the O₂ pockets are narrow and low-affinity — the form it returns from tissues in.' },
  { t0: 0.12, t1: 0.30, n: 2, b: '第 1 个 O₂ · 艰难结合', d: '克服盐桥阻力，O₂ 结合到 α₁ 血红素：Fe²⁺ 被拉入卟啉平面，牵动上方 F 螺旋。',
    be: '1st O₂ · a hard bind', de: 'Against salt-bridge resistance, O₂ binds the α₁ heme: Fe²⁺ is pulled into the porphyrin plane, tugging the F helix above.' },
  { t0: 0.30, t1: 0.50, n: 3, b: '咔哒！T → R 变构', d: 'F 螺旋撬动亚基界面，盐桥逐根绷断；α₁β₁ 相对 α₂β₂ 旋转 ~13°，四聚体松弛张开。',
    be: 'Click! T → R switch', de: 'The F helix levers the subunit interfaces and salt bridges snap one by one; α₁β₁ rotates ~13° against α₂β₂ and the tetramer relaxes open.' },
  { t0: 0.50, t1: 0.66, n: 4, b: '亲和力骤增 · 协同', d: '其余口袋全部张开，第 2、3 个 O₂ 轻快入位——对比第 1 个的吃力，这就是协同。',

/* ---------------- 血红素组件（卟啉环 + Fe²⁺ + 近端 His 连杆 + F 螺旋 + O₂） ---------------- */
function makeHeme() {
  const heme = new THREE.Group();
  const ringMat = M.heme.clone();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.05, 10, 26), ringMat);
  heme.add(ring);
  for (const [nx, ny] of [[-0.13, 0], [0.13, 0], [0, -0.13], [0, 0.13]]) {
    const nn = new THREE.Mesh(sphereGeo, M.n);
    nn.position.set(nx, ny, 0);
    nn.scale.setScalar(0.032);
    heme.add(nn);
  }
  const fe = new THREE.Mesh(sphereGeo, M.fe);
  fe.scale.setScalar(0.058);
  heme.add(fe);
  const his = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1, 8), M.his);
  his.rotation.x = Math.PI / 2;
  heme.add(his);
  const helix = new THREE.Group();
  const hx = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.5, 12), M.helix);
  hx.rotation.z = Math.PI / 2;
  helix.add(hx);
  heme.add(helix);
  const o2 = new THREE.Group();
  const oa = new THREE.Mesh(sphereGeo, M.o2a); oa.scale.setScalar(0.075); oa.position.x = -0.055;
  const ob = new THREE.Mesh(sphereGeo, M.o2b); ob.scale.setScalar(0.075); ob.position.x = 0.055;
  o2.add(oa, ob);
  o2.position.set(0, 0, 0.17);
  o2.visible = false;
  heme.add(o2);
  return { heme, ring, ringMat, fe, his, helix, o2 };
}
// 每个血红素内部随相位更新（Fe²⁺ 落面 / 拉 F 螺旋 / O₂ 落座 / 颚片张开）
function updateHeme(h, feL, boundK, jawOpen) {
  h.fe.position.z = -0.10 * feL;
  h.helix.position.set(0, 0.03, -0.34 + 0.09 * (1 - feL));
  h.helix.rotation.x = 0.25 * (1 - feL);
  const z0 = h.fe.position.z - 0.03, z1 = h.helix.position.z + 0.10;
  h.his.position.z = (z0 + z1) / 2;
  h.his.scale.set(1, Math.abs(z1 - z0), 1);
  h.o2.visible = boundK > 0.5;
  const rc = mixC([0x4c, 0x1a, 0x24], [0x93, 0x26, 0x3a], boundK);
  h.ringMat.color.setRGB(rc[0] / 255, rc[1] / 255, rc[2] / 255);
  h.ringMat.emissiveIntensity = 0.18 + boundK * 0.35;
  if (jawOpen !== undefined) for (const j of h.jaws) j.jg.rotation.y = j.sgn * jawOpen;
}

function drawPlot(t) {
  const W = plotCv.clientWidth * 2, H = plotCv.clientHeight * 2;
  if (plotCv.width !== W || plotCv.height !== H) { plotCv.width = W; plotCv.height = H; }
  const ctx = pctx, light = THEME === 'light';
  ctx.clearRect(0, 0, W, H);
  const PX0 = 52, PX1 = W - 20, PY0 = 16, PY1 = H - 48;
  const Xp = p => PX0 + p / 110 * (PX1 - PX0);
  const Ys = s => PY1 - s / 100 * (PY1 - PY0);
  const hl = ss(0.90, 0.94, t) * (1 - ss(0.972, 0.998, t));      // 第 7 步高亮对比
  // 背景竖带：肺 / 组织
  ctx.fillStyle = `rgba(100,181,246,${light ? .20 : .09})`; ctx.fillRect(Xp(88), PY0, Xp(110) - Xp(88), PY1 - PY0);
  ctx.fillStyle = `rgba(255,150,80,${light ? .16 : .08})`;  ctx.fillRect(Xp(20), PY0, Xp(40) - Xp(20), PY1 - PY0);
  ctx.font = '500 19px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = light ? '#3a76b8' : '#8fb6e8'; ctx.fillText(L('肺 ≈100', 'Lung ≈100'), Xp(99), PY0 + 22);
  ctx.fillStyle = light ? '#b26212' : '#ffc188'; ctx.fillText(L('组织 20–40', 'Tissue 20–40'), Xp(30), PY1 - 12);
  // 网格 / 坐标轴 / 刻度
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  for (const s of [25, 50, 75]) { ctx.beginPath(); ctx.moveTo(PX0, Ys(s)); ctx.lineTo(PX1, Ys(s)); ctx.stroke(); }
  ctx.strokeStyle = PAL.axis; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PX0, PY0); ctx.lineTo(PX0, PY1); ctx.lineTo(PX1, PY1); ctx.stroke();
  ctx.font = '500 17px system-ui'; ctx.fillStyle = PAL.dim;
  for (const p of [0, 25, 50, 75, 100]) {
    ctx.beginPath(); ctx.moveTo(Xp(p), PY1); ctx.lineTo(Xp(p), PY1 + 7); ctx.stroke();
    ctx.fillText(String(p), Xp(p), PY1 + 26);
  }
  ctx.textAlign = 'right';
  for (const s of [0, 25, 50, 75, 100]) {
    ctx.beginPath(); ctx.moveTo(PX0 - 7, Ys(s)); ctx.lineTo(PX0, Ys(s)); ctx.stroke();
    ctx.fillText(String(s), PX0 - 11, Ys(s) + 6);
  }
  ctx.fillStyle = PAL.dim2; ctx.font = '500 18px system-ui';
  ctx.fillText('PO₂ (mmHg)', PX1, PY1 + 44);
  ctx.save(); ctx.translate(PX0 - 34, (PY0 + PY1) / 2); ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center'; ctx.fillText(L('O₂ 饱和度 (%)', 'O₂ saturation (%)'), 0, 0); ctx.restore();
  // 肌红蛋白双曲线（蓝灰虚线）
  const pathMb = () => {
    ctx.beginPath();
    for (let p = 0; p <= 110.01; p += 2) { const x = Xp(p), y = Ys(mbSat(p)); p ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  };
  ctx.setLineDash([7, 6]); ctx.lineCap = 'round';
  pathMb(); ctx.strokeStyle = `rgba(125,147,173,${0.18 + 0.22 * hl})`; ctx.lineWidth = 7 + 3 * hl; ctx.stroke();
  pathMb(); ctx.strokeStyle = 'rgba(150,172,196,.95)'; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.setLineDash([]);
  // 血红蛋白 S 形（accent 红）
  const pathHb = () => {
    ctx.beginPath();
    for (let p = 0; p <= 110.01; p += 1.5) { const x = Xp(p), y = Ys(hill(p)); p ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  };
  const hc = mixC([216, 67, 75], [255, 110, 100], hl);
  pathHb(); ctx.strokeStyle = `rgba(216,67,75,${0.20 + 0.25 * hl})`; ctx.lineWidth = 10 + 4 * hl; ctx.stroke();
  pathHb(); ctx.strokeStyle = `rgba(${hc[0] | 0},${hc[1] | 0},${hc[2] | 0},1)`; ctx.lineWidth = 4; ctx.stroke();
  // P₅₀ 虚线十字
  ctx.setLineDash([4, 4]); ctx.strokeStyle = PAL.axis; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(Xp(P50), PY1); ctx.lineTo(Xp(P50), Ys(50)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PX0, Ys(50)); ctx.lineTo(Xp(P50), Ys(50)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(Xp(P50), Ys(50), 5, 0, 7);
  ctx.fillStyle = '#d8434b'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.textAlign = 'left'; ctx.font = '500 18px system-ui';
  ctx.fillStyle = light ? '#c23a44' : '#ffb0a6';
  ctx.fillText('P₅₀ ≈ 26 mmHg', Xp(P50) + 12, Ys(50) - 10);
  ctx.fillStyle = PAL.dim2;
  ctx.fillText(L('肌红蛋白：无协同', 'Myoglobin: no cooperativity'), PX0 + 10, PY0 + 24);
  ctx.fillStyle = light ? '#c23a44' : '#ff9b8a';
  ctx.fillText(L('血红蛋白：协同（S 形）', 'Hemoglobin: cooperative (sigmoid)'), Xp(52), Ys(52));
  if (hl > 0.02) {
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(${light ? '164,98,20' : '255,208,160'},${hl})`;
    ctx.font = '600 19px system-ui';
    ctx.fillText(L('S 形：肺里装得满 · 组织卸得净', 'Sigmoid: loads in lungs, unloads in tissues'), (PX0 + PX1) / 2, PY0 + 24);
  }
  // 实时游标
  const pc = po2Cur(t), sc = satCur(t), px = Xp(pc), py = Ys(sc);
  ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(216,67,75,.45)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, PY1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PX0, py); ctx.lineTo(px, py); ctx.stroke();
  ctx.setLineDash([]);
  const g = ctx.createRadialGradient(px, py, 0, px, py, 26);
  g.addColorStop(0, 'rgba(255,110,100,.5)'); g.addColorStop(1, 'rgba(255,110,100,0)');
  ctx.fillStyle = g; ctx.fillRect(px - 26, py - 26, 52, 52);
  ctx.beginPath(); ctx.arc(px, py, 7, 0, 7);
  ctx.fillStyle = '#ffd9d2'; ctx.fill();
  ctx.strokeStyle = '#d8434b'; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.font = '600 17px system-ui'; ctx.textAlign = 'left';
  ctx.fillStyle = light ? '#c23a44' : '#ffc9c2';
  const nx = clamp(px + 14, PX0 + 4, PX1 - 132), ny = clamp(py - 12, PY0 + 16, PY1 - 30);
  ctx.fillText(`${pc.toFixed(0)} mmHg · ${sc.toFixed(0)}%`, nx, ny);
  if (pc > 90) for (const lv of [25, 50, 75, 97]) if (sc > lv + 3) {   // 肺内已达档位
    ctx.beginPath(); ctx.arc(Xp(100), Ys(lv), 5, 0, 7);
    ctx.strokeStyle = 'rgba(255,150,140,.75)'; ctx.lineWidth = 1.6; ctx.stroke();
  }
  for (const thr of [78, 58, 42, 30]) {           // 卸载：掉下来的 O₂ 从曲线飞出
    if (pc >= thr) continue;
    const age = (thr - pc) / 750;
    if (age > 0.05) continue;
    const k = age / 0.05;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = '#ff5d6e'; ctx.beginPath(); ctx.arc(Xp(thr) + 50 * k - 5, Ys(hill(thr)) - 64 * k, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff8fa0'; ctx.beginPath(); ctx.arc(Xp(thr) + 50 * k + 5, Ys(hill(thr)) - 64 * k, 5, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------------- 每帧更新 ---------------- */
const WP = [V3(), V3(), V3(), V3()];
const tA = V3(), tB = V3(), tC = V3(), tD = V3(), tE = V3(), tF = V3();

function updateWorld(t) {
  const r = rfrac(t);
  /* --- 二聚体对转 ~13° + 界面滑开 --- */
  halves[0].rotation.y =  ROTS * r;
  halves[1].rotation.y = -ROTS * r;
  const push = 1 + 0.10 * r;
  for (const o of subObjs) {
    o.g.position.set(o.s.x * push,
      o.s.y + Math.sin(cycles * Math.PI * 14 + o.s.x * 3) * 0.012, o.s.z * push);
  }
  /* --- T↔R 配色 --- */
  const cT = mixC(T_TOP, R_TOP, r), cB = mixC(T_BOT, R_BOT, r);
  matTop.color.setRGB(cT[0] / 255, cT[1] / 255, cT[2] / 255);
  matTop.emissive.setRGB(cT[0] / 510, cT[1] / 510, cT[2] / 510);
  matBot.color.setRGB(cB[0] / 255, cB[1] / 255, cB[2] / 255);
  matBot.emissive.setRGB(cB[0] / 510, cB[1] / 510, cB[2] / 510);
  /* --- 各亚基血红素 --- */
  const jawOpen = 0.22 + 0.95 * r;
  for (const o of subObjs) {
    const boundK = ss(o.s.bind - 0.004, o.s.bind + 0.012, t) * (1 - ss(o.s.rel - 0.012, o.s.rel + 0.004, t));
    updateHeme(o, feLiftOf(o.s, t), boundK, jawOpen);
  }
  for (let i = 0; i < 4; i++) subObjs[i].g.getWorldPosition(WP[i]);

  /* --- 盐桥：逐根绷断（火花 + 闪光），回 T 自动复连 --- */
  let flashK = 0;
  for (let i = 0; i < 4; i++) {
    const br = BRIDGES[i], ln = bridgeLines[i];
    const A = WP[br.a], B = WP[br.b];
    const alpha = clamp((br.thr - r) / 0.05, 0, 1);
    ln.material.opacity = 0.85 * alpha;
    ln.visible = alpha > 0.02;
    if (ln.visible) {
      tA.lerpVectors(A, B, 0.42); tB.lerpVectors(A, B, 0.58);
      tC.subVectors(tB, tA);
      tD.set(0, 1, 0);
      tE.crossVectors(tC, tD);
      if (tE.lengthSq() < 1e-6) tE.set(1, 0, 0);
      tE.normalize();
      tF.crossVectors(tC, tE).normalize();
      const pos = ln.geometry.attributes.position;
      for (let j = 0; j <= 8; j++) {
        const u = j / 8, amp = Math.sin(u * Math.PI) * 0.055 * (j % 2 ? 1 : -1),
              amp2 = Math.sin(u * Math.PI) * 0.028 * (j % 2 ? -1 : 1);
        pos.setXYZ(j,
          tA.x + tC.x * u + tE.x * amp + tF.x * amp2,
          tA.y + tC.y * u + tE.y * amp + tF.y * amp2,
          tA.z + tC.z * u + tE.z * amp + tF.z * amp2);
      }
      pos.needsUpdate = true;
      ln.computeLineDistances();
    }
    const k = (t - br.bt) / 0.035;
    if (k > 0 && k < 1) {
      tA.lerpVectors(A, B, 0.5);
      for (let j = 0; j < SPK; j++) {
        dummy.position.copy(tA).addScaledVector(SPK_DIRS[j], 0.06 + 0.42 * k);
        dummy.scale.setScalar(Math.max(0.001, (1 - k) * 0.05));
        dummy.updateMatrix();
        sparkIM.setMatrixAt(i * SPK + j, dummy.matrix);
      }
      if (1 - k > flashK) { flashK = 1 - k; flashLight.position.copy(tA); }
    } else hideInstance(sparkIM, i * SPK, SPK);
  }
  sparkIM.instanceMatrix.needsUpdate = true;
  flashLight.intensity = flashK * 7;
  /* --- 满载微光脉冲 --- */
  pulseLight.intensity = (t > 0.715 && t < 0.78) ? Math.sin((t - 0.715) / 0.065 * Math.PI) * 9 : 0;

  /* --- O₂：环境 / 飞行结合 / 卸载飘走 --- */
  for (let i = 0; i < AMB; i++) {
    const a = amb[i], th = a.th + cycles * 0.18 * a.dir;
    tA.set(Math.cos(th) * a.r, a.y + Math.sin(cycles * 5 + a.ph) * 0.1, Math.sin(th) * a.r);
    setO2(i, tA, a.ax, 0.07);
  }
  for (let f = 0; f < 4; f++) {
    const fl = O2F[f], slot = AMB + f;
    if (t < fl.t0 || t >= fl.t1) { hideO2(slot); if (fl.hard) lblResist.element.style.opacity = 0; continue; }
    const target = subObjs[fl.sub].o2.getWorldPosition(tA);
    const start = FLY_START[f], u = clamp((t - fl.t0) / (fl.t1 - fl.t0), 0, 1);
    let k, wob = 0;
    if (fl.hard) { k = 1 - Math.pow(1 - u, 2.7); wob = Math.sin(u * Math.PI * 3) * 0.35 * Math.sin(u * Math.PI); }
    else k = u * u * (3 - 2 * u);
    tB.subVectors(target, start);
    tC.set(-tB.z, 0.3, tB.x).normalize();
    tD.lerpVectors(start, target, k).addScaledVector(tC, wob);
    tB.normalize();
    setO2(slot, tD, tB, 0.078);
    if (fl.hard) {                                  // 阻力感：减速爬行 + 标注
      const kk = clamp((u - 0.7) / 0.3, 0, 1);
      lblResist.element.style.opacity = showLabels ? kk : 0;
      lblResist.position.set(tD.x + 0.15, tD.y + 0.32, tD.z);
    }
  }
  for (let i = 0; i < 4; i++) {
    const slot = AMB + 4 + i, s = SUBS[i];
    if (t < s.rel || t > s.rel + 0.05) { hideO2(slot); continue; }
    const k = (t - s.rel) / 0.05;
    subObjs[i].o2.getWorldPosition(tA);
    tB.set(s.x, 0, s.z).normalize();
    tC.copy(tA).addScaledVector(tB, 1.9 * k).addScaledVector(REL_DRIFT, k);
    setO2(slot, tC, tB, Math.max(0.005, 0.078 * (1 - k * 0.9)));
  }
  o2IM.instanceMatrix.needsUpdate = true;

  /* --- 血红素特写窗 --- */
  const hw = showHeme ? ss(0.15, 0.20, t) * (1 - ss(0.295, 0.345, t)) : 0;
  closeup.visible = hw > 0.02;
  const a1 = subObjs[0];
  if (closeup.visible) {
    closeup.scale.setScalar(0.05 + 2.45 * hw);
    const feL = feLiftOf(SUBS[0], t);
    updateHeme(cu, feL, ss(0.261, 0.273, t), undefined);
    // O₂ 飞入并落座
    const u2 = ss(0.235, 0.265, t);
    cu.o2.visible = t >= 0.235;
    cu.o2.position.set(lerp(0.55, 0, u2), lerp(0.35, 0, u2), lerp(0.55, 0.17, u2));
    // 引导虚线 + α₁ 脉冲圈
    a1.heme.getWorldPosition(tA);
    const gp = guide.geometry.attributes.position;
    gp.setXYZ(0, closeup.position.x, closeup.position.y, closeup.position.z);
    gp.setXYZ(1, tA.x, tA.y, tA.z);
    gp.needsUpdate = true;
    guide.computeLineDistances();
    guide.material.opacity = 0.45 * hw;
    a1.pulse.material.opacity = 0.8 * hw;
    a1.pulse.scale.setScalar(1 + 0.14 * Math.sin(cycles * Math.PI * 8));
    for (const o of [cuTitle, cuHelix, cuFe, cuCap1]) o.element.style.opacity = 1;
    cuAng.element.style.opacity = feL > 0.5 ? 1 : 0;
    cuCap2.element.style.opacity = feL < 0.45 ? 1 : 0;
  } else {
    guide.material.opacity = 0;
    a1.pulse.material.opacity = 0;
  }
  lblBridge.element.style.opacity = (showLabels && r < 0.4 && t > 0.02 && t < 0.60) ? 1 : 0;

  /* --- 状态徽章 + 讲解字幕 --- */
  const light = THEME === 'light';
  let bs, bc;
  if (t < 0.31)      { bs = L('T 态 · 盐桥锁紧 · 低亲和', 'T state · locked · low affinity');  bc = light ? '#2f7f95' : '#8fc3d4'; }
  else if (t < 0.50) { bs = L('T → R 变构中 · 盐桥绷断', 'T → R switch · bridges snapping');   bc = light ? '#b26212' : '#ffb46e'; }
  else if (t < 0.66) { bs = L('R 态 · 松弛 · 高亲和', 'R state · relaxed · high affinity');     bc = light ? '#c23a44' : '#ff9b8a'; }
  else if (t < 0.78) { bs = L('R 态 · 满载 → 运往组织', 'R state · loaded → to the tissues');   bc = light ? '#c23a44' : '#ff9b8a'; }
  else if (t < 0.90) { bs = L('卸 O₂ · R → T · 反向协同', 'Unloading O₂ · R → T · reverse shift'); bc = light ? '#b05a4d' : '#f0a8a0'; }
  else               { bs = L('T 态 · 归位 · 等待下一轮', 'T state · reset · awaiting next cycle'); bc = light ? '#2f7f95' : '#8fc3d4'; }
  if (elBadge.textContent !== bs) elBadge.textContent = bs;
  elBadge.style.color = bc;
  elBadge.style.borderColor = bc + 'aa';
  let m = null;
  for (const [a, b, zh, en, c, cl] of MSGS) if (t >= a && t < b) {
    m = [L(zh, en), light ? cl : c, ss(a, a + 0.015, t) * (1 - ss(b - 0.015, b, t))];
    break;
  }
  if (m) {
    if (elMsg.textContent !== m[0]) { elMsg.textContent = m[0]; elMsg.style.color = m[1]; }
    elMsg.style.opacity = m[2];
  } else elMsg.style.opacity = 0;
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let rafId = 0;
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (playing) cycles += dt * speed / CYCLE;
  const t = cycles - Math.floor(cycles);

  updateWorld(t);
  if (showCurve) drawPlot(t);

  const si = stepIndex(t);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { clock.getDelta(); rafId = requestAnimationFrame(frame); }
});

applyTheme();
applyLang();
updateWorld(cycles - Math.floor(cycles));
rafId = requestAnimationFrame(frame);
</script>
</body>
