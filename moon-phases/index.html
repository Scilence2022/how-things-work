<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月相与日月食 · 三体的视角</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--tool-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.s { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.e { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.b { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="月相与日月食:三体视角的相位游戏" data-en="Moon Phases &amp; Eclipses: a three-body view">月相与日月食：三体视角的相位游戏</h1>
  <div class="sub" data-zh="月球同步自转 → 朔望弦:日地月角度决定相位;白道黄道 5° 夹角——为什么不是月月有食 · 空格播放/暂停" data-en="Tidal-locked Moon → new/quarter/full: the Sun-Earth-Moon angle sets the phase; the 5° tilt between ecliptic and lunar orbit is why eclipses aren\'t monthly · Space = play/pause">月球同步自转 → 朔望弦：日地月角度决定相位；白道黄道 5° 夹角——为什么不是月月有食 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="月相" data-en="phase">月相</span><span class="v g" id="stPhase" style="font-size:14px">—</span>
  <span class="k" data-zh="月地距离(km)" data-en="lunar distance">月地距离(km)</span><span class="v" id="stDist">—</span>
  <span class="k" data-zh="日地月夹角" data-en="SE-M angle">日地月夹角</span><span class="v" id="stAng">—</span>
  <span class="k" data-zh="下次日食" data-en="next solar eclipse">下次日食</span><span class="v g" id="stNxt" style="font-size:14px">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.s" data-zh="太阳(黄,中心)" data-en="sun (yellow, centre)">太阳(黄,中心)</span>
    <span class="chip.e" data-zh="地球(绿,绕日)" data-en="earth (green, orbits Sun)">地球(绿,绕日)</span>
    <span class="chip.b" data-zh="月球(蓝,绕地)" data-en="moon (blue, orbits Earth)">月球(蓝,绕地)</span>
  </div>
  <div class="row"><label data-zh="月相位置" data-en="phase position">月相位置</label><input id="phase" type="range" min="0" max="1000" step="5" value="125"><span class="val" id="phaseVal">蛾眉月</span></div>
<div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../tides/" data-zh="副产品:潮汐" data-en="the byproduct: tides">副产品:潮汐</a>
    <a href="../orbital-mechanics/" data-zh="更基础:开普勒轨道" data-en="foundation: Kepler orbits">更基础:开普勒轨道</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0x0c1424 : 0x050810);
  starMat.opacity = THEME === 'dark' ? 0.7 : 0;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('月相与日月食', 'Moon Phases & Eclipses');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.5, 3.6, 9.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(5, 4, 4);
scene.add(key);

/* 星空 */
const starMat = new THREE.PointsMaterial({ color: 0x9fb0c3, size: 0.05, transparent: true, opacity: 0.7 });
{
  const g = new THREE.BufferGeometry();
  const N = 320, arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, r = 12 + Math.random() * 18;
    arr[i * 3] = Math.cos(a) * r; arr[i * 3 + 1] = (Math.random() - 0.3) * 16; arr[i * 3 + 2] = Math.sin(a) * r;
  }
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  scene.add(new THREE.Points(g, starMat));
}

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  sun: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  sunHalo: new THREE.MeshBasicMaterial({ color: 0xffd166, blending: THREE.AdditiveBlending, transparent: true }),
  earth: mat(0x3a7ec0, { opacity: 1 }),
  moon: mat(0x9aa7b3, { opacity: 1 }),
  orbit: new THREE.MeshBasicMaterial({ color: 0x5a6a7a, transparent: true, opacity: 0.4 }),
  shadow: new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }),
};

/* ================= 太阳(中心) ================= */
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 18), M.sun);
scene.add(sun);
const sunHalo = new THREE.Mesh(new THREE.SphereGeometry(0.85, 24, 18), M.sunHalo.clone());
sunHalo.material.opacity = 0.25;
scene.add(sunHalo);

/* 地球轨道 */
const earthOrbit = new THREE.Mesh(new THREE.TorusGeometry(3.6, 0.008, 6, 90), M.orbit);
scene.add(earthOrbit);
const earth = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 24), M.earth);
earth.position.set(3.6, 0, 0);
scene.add(earth);

/* 月轨道(围绕地球) */
const moonOrbit = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.005, 6, 64), M.orbit);
moonOrbit.position.copy(earth.position);
moonOrbit.rotation.x = Math.PI / 2;
scene.add(moonOrbit);
const moon = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 18), M.moon);
scene.add(moon);

/* 月影(日食) */
const moonShadow = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), M.shadow);
scene.add(moonShadow);
/* 地影(月食) */
const earthShadow = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), M.shadow.clone());
earthShadow.material.opacity = 0.45;
scene.add(earthShadow);

/* 白道-黄道夹角指示:把月轨道略微倾斜 */
const LANE_TILT = 5 * Math.PI / 180;
moonOrbit.rotation.x = Math.PI / 2 + LANE_TILT;

/* 同步自转:月球的远侧始终背对地球(用 lookAt 跟踪相对运动) */

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let phaseIdx = qsFloat('p', 0.125);   // 月相滑块 0..1
let tSim = 0;
const R_EARTH = 3.6, R_MOON = 1.0;

function moonOrbitPos(phase, time) {
  /* 月相对太阳的角度:0=朔,0.25=上弦,0.5=望,0.75=下弦 */
  /* 把月位置放在地球周围 */
  const a = phase * Math.PI * 2;     // 月在绕地轨道上的相位
  const x = earth.position.x + Math.cos(a) * R_MOON;
  const z = Math.sin(a) * R_MOON;
  /* 白道倾角:倾斜 5° */
  const y = Math.sin(a) * Math.sin(LANE_TILT) * R_MOON;
  const px = x;
  const pz = z * Math.cos(LANE_TILT);
  return new THREE.Vector3(px, y, pz);
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblPhase = addLabel(() => {
  const p = ((phaseIdx % 1) + 1) % 1;
  if (p < 0.05) return L('朔:月在地日之间,被照面背向地球——看不见(新月)', 'new Moon: between us and Sun — its lit side faces away');
  if (p < 0.2) return L('蛾眉月:看见一弯亮', 'waxing crescent: a thin bright sliver');
  if (p < 0.3) return L('上弦:右边半亮,日落时正头顶——「月上」', 'first quarter: right half lit — the evening star');
  if (p < 0.45) return L('盈凸月', 'waxing gibbous');
  if (p < 0.55) return L('望:地球在日月中,被照面正对地球——满月', 'full Moon: we are between — full face lit up');
  if (p < 0.7) return L('亏凸月', 'waning gibbous');
  if (p < 0.8) return L('下弦:左边半亮,日出时正头顶——「月落」', 'last quarter: left half lit — the morning star');
  return L('残月:亮弯逐渐收窄', 'waning crescent: thinning sliver');
}, new THREE.Vector3(0, 3.4, 0), 'g');
const lblTilt = addLabel(() => L('白道 vs 黄道 5° 夹角:日月食一年只两三次,不会月月发生', 
  'lunar orbit tilted 5° from ecliptic: solar/lunar eclipses cluster 2-3 times a year, not monthly'),
  new THREE.Vector3(-3.4, 1.0, -1.4), 'st');
const lblSync = addLabel(() => L('同步自转:月用同一面看地球——潮汐锁定 50 亿年来的副产物', 
  'tidal lock: the Moon shows us only one face — a side-effect of 5 billion years of Earth\'s pull'),
  new THREE.Vector3(0, -1.4, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '同步自转:永远一面朝', be: 'Tidal lock: one face forever',
    d: '地球的潮汐摩擦锁死了月球自转:它绕地球的公转周期 = 自转周期,永远同一面对我们——远侧要送飞船才能看见。',
    de: 'Earth\'s tidal friction locked the Moon\'s spin: its orbit equals its rotation, always the same face — only spacecraft see the far side.',
    act: () => {} },
  { b: '相位=角度', be: 'Phase = angle',
    d: '月本身不发光,只反射太阳——「亮的部分」就是被太阳照到且能从地球看到的那一半。日-地-月夹角决定你看到的多亮。',
    de: 'The Moon doesn\'t make its own light — it reflects the Sun. The Sun-Earth-Moon angle sets what fraction of the lit side you can see.',
    act: () => {} },
  { b: '日食:月挡日', be: 'Solar eclipse: Moon in front',
    d: '新月时月球恰好跨在日地连线之间,影子投到地球——全环食看远近巧合(地月距离在 363-405 km 间,月球影锥正好够长)。',
    de: 'At new Moon the Moon crosses the Sun-Earth line and its shadow lands on us — total vs annular is a near/far coincidence (363-405 km orbits).',
    act: () => {} },
  { b: '月食:地挡日', be: 'Lunar eclipse: Earth in front',
    d: '满月时地球插在日月之间,月球走入地球影锥——地球阴影比月球大得多,所以月食每次覆盖区域更广。',
    de: 'At full Moon the Earth inserts itself; the Moon enters the cone — Earth\'s umbra is far larger, so lunar eclipses cover more geography.',
    act: () => {} },
  { b: '5° 夹角:不是月月有食', be: 'The 5° tilt: why not every month',
    d: '白道面与黄道面夹 5°:多数满月/新月时月影/地影在地球上/月亮的上空擦过——一年只两三次挤到交点附近才有食。',
    de: 'The Moon\'s plane tilts 5° off the ecliptic: most new/full moons pass the Sun-Earth line above or below — eclipses cluster twice a year when the line crosses the nodes.',
    act: () => {} },
];
function stepIndex() {
  const p = phaseIdx % 1;
  if (p < 0.05 || p > 0.95) return 2;       // 日食相关
  if (p > 0.45 && p < 0.55) return 3;       // 月食
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elPhase = document.getElementById('phase');
const elPhaseVal = document.getElementById('phaseVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function phaseLabelOf(p) {
  p = ((p % 1) + 1) % 1;
  if (p < 0.05 || p > 0.95) return L('朔', 'new');
  if (p < 0.2) return L('蛾眉', 'crescent');
  if (p < 0.3) return L('上弦', 'first Q');
  if (p < 0.45) return L('盈凸', 'gibbous+');
  if (p < 0.55) return L('望', 'full');
  if (p < 0.7) return L('亏凸', 'gibbous−');
  if (p < 0.8) return L('下弦', 'last Q');
  return L('残月', 'crescent−');
}
elPhase.addEventListener('input', e => {
  phaseIdx = parseInt(e.target.value) / 1000;
  elPhaseVal.textContent = phaseLabelOf(phaseIdx);
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.textContent = r.text();
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
elPhaseVal.textContent = phaseLabelOf(phaseIdx);

/* ================= 场景更新 ================= */
const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
sunLight.position.set(-5, 0, 0);
scene.add(sunLight);

function apply() {
  /* 地球固定,月绕地转;太阳在屏幕左,地球偏右 */
  /* 朔=月在地日之间:phase=0;上弦 phase=0.25;望 phase=0.5;下弦 phase=0.75 */
  const mPos = moonOrbitPos(phaseIdx, tSim);
  moon.position.copy(mPos);
  /* 同步自转:月始终朝向地球 */
  moon.lookAt(earth.position);
  moon.rotateY(Math.PI);   /* 让我们看到月球"近侧"的旋转正确 */
  /* 阴影 */
  /* 日食:phase≈0(朔)+ 倾斜线恰好穿过太阳 */
  /* 简单判断:月-太阳方向上,影锥打到地球 */
  const sunToEarth = new THREE.Vector3().subVectors(earth.position, sun.position).normalize();
  const sunToMoon = new THREE.Vector3().subVectors(moon.position, sun.position);
  const moonShadowScale = Math.max(0, 1 - sunToMoon.length() * 0.4);   // 越远越小(简化)
  /* 投射方向:沿 sun→moon */
  const dir = new THREE.Vector3().subVectors(moon.position, sun.position).normalize();
  const reach = 0.7;     // 月球影锥长度
  const hit = sunToMoon.length() < reach;
  /* 月影位置 */
  const t = Math.min(0.99, Math.max(0, sunToMoon.length() / 4.0));
  moonShadow.position.copy(sun.position).add(dir.clone().multiplyScalar(2.6 + t * 0.8));
  moonShadow.material.opacity = hit ? 0.55 : 0;
  moonShadow.visible = hit;
  /* 地影位置(满月时) */
  const earthShadowDist = new THREE.Vector3().subVectors(moon.position, earth.position).length();
  const hitE = earthShadowDist < 0.65 && Math.abs(phaseIdx - 0.5) % 1 < 0.06;
  earthShadow.position.copy(moon.position).clone().lerp(earth.position, 0.5);
  earthShadow.material.opacity = hitE ? 0.55 : 0;
  earthShadow.visible = hitE;
  /* 月球光照面:始终朝向太阳一侧亮(简化:看 dot) */
  const lightDot = moon.position.clone().sub(sun.position).normalize();
  const moonAxis = moon.position.clone().sub(earth.position).normalize();
  const litFactor = (lightDot.dot(moonAxis) + 1) / 2;  // 0..1
  /* 受光面:从黄到灰 */
  moon.material.color.setRGB(lerp(0.4, 0.95, litFactor), lerp(0.4, 0.95, litFactor), lerp(0.45, 0.98, litFactor));
  moon.material.emissiveIntensity = 0.05 + litFactor * 0.25;
  /* 月影球随月动 */
  moonShadow.position.lerp(new THREE.Vector3(earth.position.x, 0.05, 0), 0.05);
  earthShadow.position.lerp(new THREE.Vector3(earth.position.x, 0.05, 0), 0.05);
  /* 月地距离 */
  const d = moon.position.distanceTo(earth.position);
  document.getElementById('stPhase').textContent = phaseLabelOf(phaseIdx);
  document.getElementById('stDist').innerHTML = (d * 6000).toFixed(0) + '<small> km</small>';   // 场景单位
  document.getElementById('stAng').innerHTML = (phaseIdx * 360).toFixed(0) + '<small>°</small>';
  /* 下次日食:朔+倾角对齐的近似 */
  document.getElementById('stNxt').textContent = hit ? L('正在发生!', 'happening!') : hitE ? L('正在月食!', 'lunar!') : L('数月后', 'months away');
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  if (playing) {
    phaseIdx = (phaseIdx + dts * 0.012) % 1;
    document.getElementById('phase').value = Math.round(phaseIdx * 1000);
    document.getElementById('phaseVal').textContent = phaseLabelOf(phaseIdx);
  }
  apply();

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
