<style>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xdfe8f3 : 0x05070d);
  starMat.opacity = THEME === 'dark' ? 0.85 : 0.2;
  gridMat.opacity = THEME === 'dark' ? 0.4 : 0.55;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('月相与日月食 · 朔望与交点的几何', 'Moon Phases & Eclipses · geometry of syzygy and nodes');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 220);
camera.position.set(7.4, 5.6, 10.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.4;
controls.maxDistance = 90;
controls.autoRotateSpeed = 0.35;

/* 光照:太阳在远处,DirectionalLight 表现平行日光 */
scene.add(new THREE.HemisphereLight(0x8fa8cc, 0x0a0c12, 0.22));
const sunLight = new THREE.DirectionalLight(0xfff3d6, 2.6);
sunLight.position.set(34, 0, 0);
scene.add(sunLight, sunLight.target);

/* 星空(InstancedMesh) */
const starMat = new THREE.MeshBasicMaterial({ color: 0xcfd8ea, transparent: true, opacity: 0.85 });
{
  const g = new THREE.IcosahedronGeometry(0.045, 0);
  const stars = new THREE.InstancedMesh(g, starMat, 320);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  const rnd = mulberry32(7);
  for (let i = 0; i < 320; i++) {
    const a = rnd() * Math.PI * 2, b = Math.acos(2 * rnd() - 1), r = 60 + rnd() * 50;
    p.set(Math.sin(b) * Math.cos(a) * r, Math.cos(b) * r, Math.sin(b) * Math.sin(a) * r);
    const k = 0.5 + rnd() * 1.4;
    s.set(k, k, k);
    m.compose(p, q, s);
    stars.setMatrixAt(i, m);
  }
  scene.add(stars);
}

/* 黄道面参考网格 */
const grid = new THREE.PolarGridHelper(7.4, 8, 4, 64, 0x4a5c72, 0x2c3846);
const gridMat = grid.material;
gridMat.transparent = true;
gridMat.opacity = 0.4;
scene.add(grid);

/* ---------------- 程序纹理 ---------------- */
function earthTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d'), rnd = mulberry32(42);
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#7fb2dd'); grd.addColorStop(0.5, '#1d5c96'); grd.addColorStop(1, '#7fb2dd');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 256);
  for (let i = 0; i < 14; i++) {
    const x = rnd() * 512, y = 50 + rnd() * 156, r = 14 + rnd() * 42;
    g.fillStyle = rnd() < 0.6 ? '#3f7a4a' : '#8a7a4a';
    g.beginPath(); g.ellipse(x, y, r, r * (0.4 + rnd() * 0.5), rnd() * 3, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(240,246,252,.9)';
  g.fillRect(0, 0, 512, 16); g.fillRect(0, 240, 512, 16);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function moonTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d'), rnd = mulberry32(11);
  g.fillStyle = '#a8aeb6'; g.fillRect(0, 0, 256, 128);
  const mare = (x, y, r) => {
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(96,104,116,.9)'); grd.addColorStop(1, 'rgba(96,104,116,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  };
  mare(128, 66, 34); mare(160, 48, 22); mare(104, 88, 18);
  for (let i = 0; i < 90; i++) {
    const x = rnd() * 256, y = rnd() * 128, r = 0.8 + rnd() * 3.2;
    g.fillStyle = 'rgba(70,76,84,.5)'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.fillStyle = 'rgba(200,206,214,.35)'; g.beginPath(); g.arc(x - r * 0.35, y - r * 0.35, r * 0.55, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;

/* ================= 几何与食(全部实时计算) ================= */
const EVT_NAMES = {
  st: () => L('日全食 · 全食带 ~270 km', 'total solar · belt ~270 km'),
  se: () => L('日偏食(半影扫过)', 'partial solar (penumbra sweeps)'),
  lt: () => L('月全食 · 红月亮', 'total lunar · blood moon'),
  le: () => L('月偏食', 'partial lunar eclipse'),
  pe: () => L('半影月食(微暗)', 'penumbral lunar (slight dim)'),
};
const V_A = new THREE.Vector3(), V_B = new THREE.Vector3(), V_C = new THREE.Vector3(), V_D = new THREE.Vector3();
const SUN_POS = new THREE.Vector3(SUN_D, 0, 0);
const moonPos = new THREE.Vector3(), moonDir = new THREE.Vector3();
function compute() {
  const lam = (2 * Math.PI * p) - nodeDeg * DEG;
  moonPos.set(Math.cos(lam), 0, -Math.sin(lam)).applyQuaternion(orbitGrp.quaternion).multiplyScalar(R_M);
  moonDir.copy(moonPos).normalize();
  phi = Math.acos(clamp(moonDir.x, -1, 1));          // 日-地-月夹角 = 地心看日月角距
  litK = (1 - Math.cos(phi)) / 2;
  betaDeg = Math.asin(clamp(moonDir.y, -1, 1)) / DEG;
  const dLam = Math.abs((2 * Math.PI * p - nodeDeg * DEG + Math.PI * 3) % (Math.PI * 2) - Math.PI);
  nodeDist = Math.min(dLam / DEG, 180 - dLam / DEG);
  const d1 = phi / DEG, d2 = Math.acos(clamp(-moonDir.x, -1, 1)) / DEG;
  evt = 'none'; missKm = 0; evtLabel = '';
  if (d1 < 0.5) evt = 'st';
  else if (d1 < 1.48) evt = 'se';
  else if (d2 < 0.44) evt = 'lt';
  else if (d2 < 0.96) evt = 'le';
  else if (d2 < 1.47) evt = 'pe';
  if (evt !== 'none') evtLabel = EVT_NAMES[evt]();
  else if (d1 < 8) { missKm = 384400 * Math.tan(d1 * DEG); evtLabel = missText(d1, d2); }
  else if (d2 < 8) { missKm = 384400 * Math.tan(d2 * DEG); evtLabel = missText(d1, d2); }
}
function missText(d1, d2) {
  const side = betaDeg >= 0 ? L('北', 'N') : L('南', 'S');
  const wan = (missKm / 1e4).toFixed(1);
  if (d1 < 8) {
    return L(`月影错过地球 · 偏${side}约 ${wan} 万 km —— 本月无日食`,
      `Moon's shadow misses Earth by ~${(missKm / 1e3).toFixed(0)},000 km (to the ${side.toLowerCase()}) — no solar eclipse this month`);
  }
  return L(`月球错过地影 · 偏${side}约 ${wan} 万 km —— 本月无月食`,
    `Moon misses Earth's shadow by ~${(missKm / 1e3).toFixed(0)},000 km (to the ${side.toLowerCase()}) — no lunar eclipse this month`);
}
function phaseName(pp) {
  pp = ((pp % 1) + 1) % 1;
  if (pp < 0.03 || pp > 0.97) return L('朔(新月)', 'new moon');
  if (pp < 0.22) return L('蛾眉月', 'waxing crescent');
  if (pp < 0.28) return L('上弦月', 'first quarter');
  if (pp < 0.47) return L('盈凸月', 'waxing gibbous');
  if (pp < 0.53) return L('望(满月)', 'full moon');
  if (pp < 0.72) return L('亏凸月', 'waning gibbous');
  if (pp < 0.78) return L('下弦月', 'last quarter');
  return L('残月', 'waning crescent');
}

function stepIndex() {
  if (evt === 'st' || evt === 'se') return 2;
  if (evt === 'lt' || evt === 'le' || evt === 'pe') return 3;
  const d1 = phi / DEG, d2 = Math.acos(clamp(-moonDir.x, -1, 1)) / DEG;
  if (Math.min(d1, d2) < 6 && nodeAligned() > 30) return 4;
  if ((p > 0.21 && p < 0.29) || (p > 0.71 && p < 0.79)) return 1;
  if (nodeAligned() < 22 && (Math.abs(p - 0) < 0.1 || Math.abs(p - 1) < 0.1 || Math.abs(p - 0.5) < 0.1)) return 5;
  return 0;
}
function buildSteps() {

}

elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglView.addEventListener('change', () => { viewOn = tglView.checked; layout2(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });

function subSize() { return innerWidth < 760 ? 148 : innerWidth < 1100 ? 190 : 232; }
let SUB = subSize();
function layout2() {
  SUB = subSize();
  view2El.style.display = viewOn ? '' : 'none';
  view2El.style.width = view2El.style.height = SUB + 'px';
  renderer2.setSize(SUB, SUB, false);
  statsEl.style.bottom = viewOn ? (SUB + 30) + 'px' : '18px';
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  layout2();
});

/* ================= 每帧应用 ================= */
const COPPER = new THREE.Color(0.62, 0.26, 0.12), WHITE = new THREE.Color(1, 1, 1);
const AX = new THREE.Vector3(), AY = new THREE.Vector3(), AZ = new THREE.Vector3(), AD = new THREE.Vector3();
const XHAT = new THREE.Vector3(1, 0, 0);
let capStr = '';
function apply(dts) {
  compute();
  moonGrp.position.copy(moonPos);
  moonGrp.lookAt(0, 0, 0);
  lblMoon.o.position.copy(moonPos).add(V_A.set(0, 0.55, 0));
  mShadow.position.copy(moonPos);
  /* 日食影斑:射线 origin=月亮 方向=背日,与单位球解析求交 (带严格 t > 0 判定) */
  AD.copy(moonPos).sub(SUN_POS).normalize();
  mShadow.quaternion.setFromUnitVectors(V_B.set(0, -1, 0), AD);
  const b = moonPos.dot(AD), c = moonPos.lengthSq() - 1, disc = b * b - c;
  const t = disc > 0 ? -b - Math.sqrt(disc) : -1;
  if (disc > 0 && t > 0 && (evt === 'st' || evt === 'se')) {
    V_C.copy(moonPos).addScaledVector(AD, t);
    V_D.copy(V_C).normalize();
    spotU.visible = spotP.visible = true;
    spotU.position.copy(V_C).addScaledVector(V_D, 0.004);
    spotP.position.copy(V_C).addScaledVector(V_D, 0.003);
    spotU.quaternion.setFromUnitVectors(V_B.set(0, 0, 1), V_D);
    spotP.quaternion.copy(spotU.quaternion);
    const ru = Math.max(MOON_R * (1 - t / 6.9), 0.02);
    spotU.scale.setScalar(ru);
    spotP.scale.setScalar(Math.max(MOON_R * (1 + 1.3 * t / 6.9), ru * 1.8));
    spotU.material.opacity = evt === 'st' ? 0.85 : 0.5;
    spotP.material.opacity = evt === 'st' ? 0.22 : 0.12;
  } else spotU.visible = spotP.visible = false;
  /* 月食染色(主场景) */
  const d2 = Math.acos(clamp(-moonDir.x, -1, 1)) / DEG;
  const lunK = clamp((1.47 - d2) / 1.03, 0, 1);
  const copperK = clamp((0.96 - d2) / 0.52, 0, 1);
  moonMat.color.copy(WHITE).lerp(COPPER, copperK * 0.95);
  moonMat.emissive.setRGB(0.35 * copperK, 0.08 * copperK, 0.02 * copperK);
  umbraMat.opacity = lunK > 0 ? 0.45 : 0.26;
  mShadowMat.opacity = evt === 'st' || evt === 'se' ? 0.45 : 0.24;
  nodeMat.opacity = 0.35 + 0.5 * (1 - clamp(nodeAligned() / 45, 0, 1));
  earth.rotation.y += dts * 0.25;
  /* 节点标记 / 交线 / 白道标签位置 */
  nodeMarkA.getWorldPosition(V_A);
  lblNodeA.o.position.copy(V_A).add(V_B.set(0, 0.32, 0));
  nodeMarkB.getWorldPosition(V_A);
  lblNodeB.o.position.copy(V_A).add(V_B.set(0, 0.32, 0));
  V_A.set(Math.cos(2.2), 0, -Math.sin(2.2)).applyQuaternion(orbitGrp.quaternion).multiplyScalar(R_M);
  lblLane.o.position.copy(V_A).add(V_B.set(0, 0.32, 0));
  V_A.set(1, 0, 0).applyQuaternion(orbitGrp.quaternion).multiplyScalar(2.8);
  lblNodeLn.o.position.copy(V_A).add(V_B.set(0, 0.28, 0));
  /* 事件大标签跟现场走 */
  if (evt === 'st' || evt === 'se') lblEvt.o.position.copy(spotU.visible ? spotU.position : moonPos).add(V_B.set(0, 0.55, 0));
  else lblEvt.o.position.copy(moonPos).add(V_B.set(0, evt === 'none' ? 1.05 : -1.05, 0));

  /* ---- 副视窗:从地球看 (地心视角,严格由天球几何驱动) ---- */
  // 视线深入屏幕为 -Z, 故面向观察者的 +Z 轴为 -rM
  const vZ = V_B.copy(moonDir).negate();
  // 屏幕正上方 +Y 轴: 天球北极在垂直视线平面的投影
  const uNorth = V_A.set(0, 1, 0);
  const vY = V_C.copy(uNorth).addScaledVector(moonDir, -uNorth.dot(moonDir)).normalize();
  // 屏幕正向右 +X 轴: vY × vZ
  const vX = V_D.crossVectors(vY, vZ).normalize();

  // 平行日光入射方向 (+X 轴)
  const rSun = XHAT;
  // 阳光矢量在观察者屏幕坐标系的分量:
  const Lx = rSun.dot(vX); // >0: 右半亮 (上弦月/蛾眉月); <0: 左半亮 (下弦月/残月)
  const Ly = rSun.dot(vY); // 高度角
  const Lz = rSun.dot(vZ); // >0: 顺光 (满月); <0: 逆光 (新月)

  // 设置副视窗直射日光
  light2.position.set(Lx, Ly, Lz).multiplyScalar(10);
  light2.target.position.set(0, 0, 0);
  light2.intensity = 2.8 * (1 - 0.92 * lunK) + 0.08;

  // 月球表面颜色与月食血月同步
  moonMat2.color.copy(moonMat.color);
  moonMat2.emissive.copy(moonMat.emissive);

  // 日食: 太阳在副视窗中的视角位置 (1 单位 = 0.26° 月球角半径)
  const angDistSun = phi / DEG;
  if (Lz < 0 && angDistSun < 5.5) {
    sun2Grp.visible = true;
    const sScale = 1 / 0.26;
    sun2Grp.position.set(Lx * angDistSun * sScale, Ly * angDistSun * sScale, -2.2);
    const cover = clamp((0.533 - angDistSun) / 0.5, 0, 1);
    corona.material.opacity = cover > 0.85 ? (cover - 0.85) / 0.15 * 0.95 : 0;
  } else {
    sun2Grp.visible = false;
    corona.material.opacity = 0;
  }

  // 月食: 地影在副视窗中的视角位置 (地影中心位于反日方向 -Lx, -Ly)
  const angDistShadow = d2;
  if (Lz > 0 && angDistShadow < 3.8) {
    shadowDisc.visible = true;
    const sScale = 1 / 0.26;
    shadowDisc.position.set(-Lx * angDistShadow * sScale, -Ly * angDistShadow * sScale, 1.01);
    if (evt === 'lt') {
      // 月全食时, 地影稍透出暗红光辉并呈现月球自身血月红光
      shadowDisc.material.color.setHex(0x1a0505);
      shadowDisc.material.opacity = 0.32;
    } else {
      shadowDisc.material.color.setHex(0x05060c);
      const offShadow = angDistShadow * sScale;
      shadowDisc.material.opacity = clamp((3.69 - offShadow) / 0.9, 0, 1) * 0.85;
    }
  } else {
    shadowDisc.visible = false;
  }

  /* 副窗标题 */
  const solar = evt === 'st' || evt === 'se';
  const cap = solar
    ? (evt === 'st' ? L('从地球看:日轮被吞 · 全食', 'from Earth: Sun devoured · total') : L('从地球看:日轮', 'from Earth: the Sun'))
    : L('从地球看:月面', 'from Earth: the Moon');
  if (cap !== capStr) { capStr = cap; cap2.textContent = cap; }
  /* 读数 */
  document.getElementById('stPhase').textContent = phaseName(p) + (solar ? L(' · 日食', ' · solar') : evt === 'none' ? '' : L(' · 月食', ' · lunar'));
  document.getElementById('stLit').innerHTML = (litK * 100).toFixed(0) + '<small> %</small>';
  document.getElementById('stAng').innerHTML = (phi / DEG).toFixed(1) + '<small>°</small>';
  document.getElementById('stLat').innerHTML = (betaDeg >= 0 ? '+' : '') + betaDeg.toFixed(2) + '<small>°</small>';
  document.getElementById('stNode').innerHTML = nodeDist.toFixed(1) + '<small>°</small>';
  const stEvt = document.getElementById('stEvt');
  stEvt.textContent = evt === 'none' ? L('无(常态)', 'none (usual)') : EVT_NAMES[evt]();
  stEvt.className = 'v ' + (evt === 'none' ? 'g' : evt === 'pe' ? 'g' : 'bad');
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1, raf = null;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  if (dts > 0) {
    p = (p + dts / SYNODIC) % 1;
    if (document.activeElement !== elPhase) elPhase.value = Math.round(p * 1000);
    elPhaseVal.textContent = phaseName(p);
  }
  apply(dts);
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  if (viewOn) {
    renderer2.render(scene2, cam2);
  }
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
elPhase.value = Math.round(p * 1000); elPhaseVal.textContent = phaseName(p);
elTilt.value = tiltDeg; elTiltVal.textContent = tiltDeg.toFixed(1) + '°';
elNode.value = Math.round(nodeDeg); elNodeVal.textContent = Math.round(nodeDeg) + '°';
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
tglLabels.checked = labelsOn;
tglView.checked = viewOn;
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
updateOrbitQuat();
layout2();
applyTheme();
applyLang();
refreshLabels();
setPlayLabel();
start();
</script>
