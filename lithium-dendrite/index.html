<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>锂枝晶 · 越凸越长,一刺就短路</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="锂枝晶 · 越凸越长,一刺就短路" data-en="Lithium Dendrites · the bump that shorts the cell">锂枝晶 · 越凸越长,一刺就短路</h1>
  <div class="sub" data-zh="充电时 Li⁺ 在负极得电子沉积:凸起处电场集中,越凸越长成针状枝晶,刺穿隔膜→内短路→热失控;快充与低温都火上浇油,石墨嵌锂是解法 · 拖动旋转 / 空格运行/暂停" data-en="On charge, Li⁺ plates onto the anode: bumps focus the field and grow into needles that pierce the separator — internal short, thermal runaway; fast charge and cold make it worse; graphite intercalation is the fix · drag to orbit / Space = run/pause">充电时 Li⁺ 在负极得电子沉积:凸起处电场集中,越凸越长成针状枝晶,刺穿隔膜→内短路→热失控;快充与低温都火上浇油,石墨嵌锂是解法 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="充电倍率" data-en="C-rate">充电倍率</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="最高凸起" data-en="Max bump">最高凸起</span><span class="v" id="stH">—</span>
  <span class="k" data-zh="距隔膜" data-en="To separator">距隔膜</span><span class="v" id="stG">—</span>
  <span class="k" data-zh="电池温度" data-en="Cell temp">电池温度</span><span class="v" id="stT">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnGraphite" data-zh="负极:锂金属 ⇄ 石墨" data-en="anode: Li metal ⇄ graphite">负极:锂金属 ⇄ 石墨</button>
    <button class="abtn on" id="btnSEI" data-zh="SEI 界面膜:显示" data-en="SEI layer: show">SEI 界面膜:显示</button>
    <button class="abtn" id="btnReset" data-zh="重置电池" data-en="reset cell">重置电池</button>
  </div>
  <div class="row">
    <label data-zh="充电倍率" data-en="C-rate">充电倍率</label>
    <input id="sC" type="range" min="5" max="30" step="1" value="15">
    <span class="val" id="sCVal">1.5C</span>
  </div>
  <div class="row">
    <label data-zh="环境温度" data-en="Ambient T">环境温度</label>
    <input id="sT" type="range" min="-20" max="60" step="5" value="25">
    <span class="val" id="sTVal">25 °C</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../li-ion-battery/" data-zh="锂离子电池:摇椅式原理" data-en="Li-ion battery: rocking-chair principle">锂离子电池</a>
    <a href="../crystal-growth/" data-zh="晶体生长:同样的正反馈" data-en="Crystal growth: the same feedback">晶体生长</a>
    <a href="../electric-vehicle/" data-zh="电动车:为何怕快充低温" data-en="Electric vehicles: why fast-charge & cold hurt">电动车</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- 工具 / 主题 / 语言 / URL 参数 ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---------- 渲染器 / 场景 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(1.5,1.2,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=26;controls.autoRotateSpeed=0.5;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(4,6,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-6,2,-5);scene.add(fill);

/* ---------- 材料 ----------
   尺寸注:示意放大。真实负极-隔膜间隙 ~20 μm,这里画成 2.65 格。 */
const mCath=new THREE.MeshStandardMaterial({color:0x2f5e50,roughness:0.6,metalness:0.2,emissive:0x000000});
const mAnode=new THREE.MeshStandardMaterial({color:0x6b7d8e,roughness:0.35,metalness:0.7,emissive:0x000000});
const mSep=new THREE.MeshStandardMaterial({color:0xdfe8f2,transparent:true,opacity:0.4,roughness:0.3,side:THREE.DoubleSide});
const mLi=new THREE.MeshStandardMaterial({color:0xc5d1e0,roughness:0.25,metalness:0.75,emissive:0x334155,emissiveIntensity:0.35});
const mGraph=new THREE.MeshStandardMaterial({color:0x3b4654,roughness:0.5,metalness:0.4,emissive:0x8a6d00,emissiveIntensity:0});
const mIon=new THREE.MeshStandardMaterial({color:0xb197ff,emissive:0x7048e8,emissiveIntensity:0.7,roughness:0.3});
const mSEI=new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.28,roughness:0.2});
const mGlow=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});

/* ---------- 布景:正极(上)/隔膜/负极(下) ---------- */
const cath=new THREE.Mesh(new THREE.BoxGeometry(9.6,0.5,2.4),mCath);
cath.position.set(0,2.6,0);scene.add(cath);
const sep=new THREE.Mesh(new THREE.BoxGeometry(9.6,0.08,2.4),mSep);
sep.position.set(0,1.15,0);scene.add(sep);
const anode=new THREE.Mesh(new THREE.BoxGeometry(9.6,0.7,2.4),mAnode);
anode.position.set(0,-1.85,0);scene.add(anode);
const glow=new THREE.Mesh(new THREE.PlaneGeometry(9.6,2.6),mGlow);
glow.position.set(0,0.4,0);scene.add(glow);
/* 石墨层状负极(切换模式用) */
const graphG=new THREE.Group();scene.add(graphG);
const gapY=[-1.31,-0.93,-0.55,-0.17];
for(let i=0;i<5;i++){
  const slab=new THREE.Mesh(new THREE.BoxGeometry(9.6,0.09,2.4),mGraph);
  slab.position.set(0,-1.5+0.38*i,0);graphG.add(slab);
}
graphG.visible=false;
/* SEI 膜 */
const sei=new THREE.Mesh(new THREE.BoxGeometry(9.6,0.14,2.5),mSEI);
sei.position.set(0,-1.42,0);scene.add(sei);

/* ---------- 枝晶列(锂金属模式) ---------- */
const NCOL=26,COLW=9.2/NCOL;
const colX=[],colM=[];
for(let i=0;i<NCOL;i++){
  colX.push(-4.6+COLW*(i+0.5));
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.26,1,0.6),mLi);
  m.position.set(colX[i],-1.5,0);scene.add(m);colM.push(m);
}
let heights=new Float32Array(NCOL);

/* ---------- Li⁺ 离子池 ---------- */
const NION=30,ions=[];
for(let i=0;i<NION;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),mIon);
  m.visible=false;scene.add(m);
  ions.push({m,on:false,x:0,y:0,tx:0,ty:0,col:0});
}
/* 石墨嵌锂槽位:4 层间 × 12 位;停靠离子用独立网格,避免与离子池抢 */
const slotX=[];for(let i=0;i<12;i++)slotX.push(-4.2+7.6*i/11*0.98+0.15);
const parkPool=[];
for(let i=0;i<48;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),mIon);
  m.visible=false;scene.add(m);parkPool.push(m);
}
let parked=[],slotCursor=0,parkCursor=0;

/* ---------- 标签 ---------- */
const labelReg=[];
let labelsOn=true;
function addLabel(fn,pos,cls='',visFn){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,fn,vis:visFn||(()=>true)});return o;
}
addLabel(()=>L('正极(嵌锂化合物)','cathode (host structure)'),new THREE.Vector3(0,3.15,0),'g');
addLabel(()=>L('隔膜','separator'),new THREE.Vector3(-4.5,1.35,0),'b');
addLabel(()=>L('SEI:界面膜,导 Li⁺ 挡电子','SEI: conducts Li⁺, blocks e⁻'),new THREE.Vector3(3.4,-1.05,0),'b',()=>seiOn&&mode==='li');
addLabel(()=>L('锂金属负极','Li-metal anode'),new THREE.Vector3(0,-2.45,0),'',()=>mode==='li');
addLabel(()=>L('石墨负极:Li⁺ 嵌进层间','graphite anode: Li⁺ between layers'),new THREE.Vector3(0,-1.95,0),'g',()=>mode==='graphite');
addLabel(()=>L('枝晶!正反馈生长','dendrite! positive feedback'),new THREE.Vector3(1.6,0.6,0),'r',()=>hMax>1.1&&mode==='li');
const lblStatus=addLabel(()=>{
  if(mode==='graphite')return L('石墨嵌锂:层间储锂,均匀可逆,无枝晶','graphite: intercalation is even and dendrite-free');
  if(mode==='short')return L('内短路!热失控:温度飙升','internal short! thermal runaway');
  if(C>=2)return L('高倍率:电场集中在凸起,针状枝晶','high C-rate: field focuses on bumps — needles');
  if(Tenv<10)return L('低温:扩散慢,沉积更不均','cold: slow diffusion, uneven plating');
  return L('充电:Li⁺ 穿过隔膜,在负极得电子析出','charging: Li⁺ crosses the separator, plates on the anode');
},new THREE.Vector3(0,3.85,0),'o');

/* ---------- 状态 ---------- */
let playing=!(qs.get('pause')==='1');
let speed=clamp(parseFloat(qs.get('speed'))||1,0.2,3);
let C=1.5,Tenv=25,mode='li',seiOn=true;
let Tbat=25,spawnAcc=0,simT=0;
let hMax=0;
function seedBumps(){for(let i=0;i<NCOL;i++)heights[i]=Math.random()*0.06;}
seedBumps();
function triggerShort(){
  if(mode!=='short'&&mode==='li'){mode='short';flashT=0;}
}
let flashT=9;

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('锂枝晶 · 越凸越长,一刺就短路','Lithium Dendrites');
  buildSteps();updateStats();
}

/* ---------- 步骤 ---------- */
const STEPS=[
 {b:'充电:Li⁺ 得电子析出锂',be:'Charging: Li⁺ plates onto the anode',
  d:'Li⁺ 从正极脱出,穿过隔膜,在负极表面得电子变成金属锂——沉积本可以很均匀。',
  de:'Li⁺ leaves the cathode, crosses the separator and plates as metal on the anode.',
  act:()=>{setMode('li');C=1;seedBumps();}},
 {b:'表面不平:凸起处电场集中',be:'Bumps focus the electric field',
  d:'负极从来不平。凸起尖端电场线密、局部电流密度大——锂偏偏喜欢长在这里。',
  de:'The anode is never flat: tips see denser field lines and higher local current density.',
  act:()=>{setMode('li');C=1.5;heights[12]+=0.55;heights[13]+=0.45;heights[11]+=0.3;}},
 {b:'正反馈:越凸越长成枝晶',be:'Runaway feedback: a needle grows',
  d:'尖端越长电场越集中,沉积越快——正反馈把小凸起拉成针状枝晶,快充(高倍率)让它疯长。',
  de:'Longer tip → stronger focusing → faster plating: a positive feedback that pulls needles.',
  act:()=>{setMode('li');C=2.8;}},
 {b:'刺穿隔膜:内短路',be:'Piercing the separator: short',
  d:'针尖碰到隔膜就是电子捷径——正负极直接握手,内短路瞬间放焦耳热。',
  de:'Needle meets separator: electrodes touch, current flows straight through, joule heat spikes.',
  act:()=>{setMode('li');heights[13]=2.68;}},
 {b:'热失控:温度飙红',be:'Thermal runaway',
  d:'短路热让隔膜崩塌、电解液分解,温度冲上 200 °C 以上——电池鼓包、起火都在这之后。',
  de:'Short heat collapses the separator and decomposes electrolyte; past ~200 °C the cell vents or burns.',
  act:()=>{setMode('li');heights[13]=2.68;Tbat=Math.max(Tbat,220);}},
 {b:'对策:石墨嵌锂/固态/浓盐',be:'Fixes: graphite, solid-state, salt-rich',
  d:'石墨把锂存在层间(无金属锂析出);固态电解质扎不穿;浓盐电解液让锂均匀沉积。',
  de:'Graphite hosts Li between layers; solid electrolytes cannot be pierced; concentrated salts plate evenly.',
  act:()=>{setMode('graphite');}},
];
let activeStep=0;
function stepIndex(){
  if(mode==='graphite')return 5;
  if(mode==='short')return Tbat>140?4:3;
  if(hMax>1.1)return 2;
  if(C>=2)return 2;
  return 0;
}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps(true);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(manual){
  const si=manual?activeStep:stepIndex();
  if(!manual)activeStep=si;
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===si));
}
function setMode(m){
  mode=m;
  graphG.visible=(m==='graphite');
  colM.forEach(c=>c.visible=(m==='li'));
  ions.forEach(io=>{io.on=false;io.m.visible=false;});
  if(m==='graphite'){parked.forEach(p=>p.m.visible=false);parked=[];slotCursor=0;mGraph.emissiveIntensity=0;}
  if(m==='li'){Tbat=Math.min(Tbat,Tenv);flashT=9;mGlow.opacity=0;mGraph.emissiveIntensity=0;}
}

/* ---------- 沉积模型 ----------
   电场聚焦:柱 i 被选中概率 ∝ (h+δ)^p;p 随低温升高(扩散跟不上)、随倍率升高。
   形态:高倍率→针状(集中 dq);低倍率→苔状(摊到邻居)。 */
function pickCol(){
  const p=clamp(1.3+(25-Tenv)/45*0.9+(C-0.5)*0.35,1.2,3.0);
  let sum=0;const w=new Float64Array(NCOL);
  for(let i=0;i<NCOL;i++){w[i]=Math.pow(heights[i]+0.06,p);sum+=w[i];}
  let r=Math.random()*sum;
  for(let i=0;i<NCOL;i++){r-=w[i];if(r<=0)return i;}
  return NCOL-1;
}
function deposit(col){
  if(C>=1.8)heights[col]+=0.13;
  else{
    heights[col]+=0.085;
    if(col>0)heights[col-1]+=0.02;
    if(col<NCOL-1)heights[col+1]+=0.02;
  }
}

/* ---------- 统计 ---------- */
function updateStats(){
  hMax=0;for(let i=0;i<NCOL;i++)hMax=Math.max(hMax,heights[i]);
  document.getElementById('stC').innerHTML=C.toFixed(1)+'<small> C</small>';
  document.getElementById('stH').innerHTML=(mode==='graphite'?'0':(hMax*100).toFixed(0))+'<small> μm</small>';
  document.getElementById('stG').innerHTML=mode==='graphite'?'∞':Math.max(0,(2.65-hMax)*100).toFixed(0)+'<small> μm</small>';
  const stT=document.getElementById('stT');
  stT.innerHTML=Tbat.toFixed(0)+'<small> °C</small>';
  stT.style.color=Tbat>110?'#ff6b6b':'';
}

/* ---------- 交互 ---------- */
document.getElementById('sC').addEventListener('input',e=>{
  C=+e.target.value/10;
  document.getElementById('sCVal').textContent=C.toFixed(1)+'C';
});
document.getElementById('sT').addEventListener('input',e=>{
  Tenv=+e.target.value;
  document.getElementById('sTVal').textContent=Tenv+' °C';
});
document.getElementById('btnGraphite').addEventListener('click',()=>{
  setMode(mode==='li'?'graphite':'li');
});
document.getElementById('btnSEI').addEventListener('click',e=>{
  seiOn=!seiOn;sei.visible=seiOn;
  e.currentTarget.classList.toggle('on',seiOn);
});
document.getElementById('btnReset').addEventListener('click',()=>{
  heights.fill(0);seedBumps();Tbat=Tenv;flashT=9;mGlow.opacity=0;
  mCath.emissive.setHex(0x000000);mAnode.emissive.setRGB(0,0,0);
  ions.forEach(io=>{io.on=false;io.m.visible=false;});
  parkPool.forEach(p=>p.visible=false);parked=[];slotCursor=0;parkCursor=0;
  if(mode==='short')mode='li';
});
const elPlay=document.getElementById('play');
function setPlayLabel(){elPlay.textContent=playing?L('暂停','Pause'):L('运行','Run');}
elPlay.addEventListener('click',()=>{playing=!playing;setPlayLabel();});
const tglLabels=document.getElementById('tglLabels');
tglLabels.addEventListener('change',()=>{labelsOn=tglLabels.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{
  LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();
});
document.getElementById('themeBtn').addEventListener('click',()=>{
  THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();
});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();elPlay.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
if(qs.get('labels')==='0'){tglLabels.checked=false;labelsOn=false;}

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function spawnIon(){
  const io=ions.find(i=>!i.on);if(!io)return;
  io.on=true;io.m.visible=true;
  io.x=(Math.random()*2-1)*4.4;io.y=2.25;
  if(mode==='li'){
    io.col=pickCol();io.tx=colX[io.col];io.ty=-1.5+heights[io.col]+0.03;
  }else{
    io.col=-1;io.tx=slotX[slotCursor%12];io.ty=gapY[Math.floor(slotCursor/12)%4];
    io.slot=slotCursor;slotCursor++;
  }
  io.x=io.tx+(Math.random()*2-1)*0.9; // 略偏后横向收敛
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    /* 离子通量 ∝ 倍率;SEI 缺失时副反应消耗,净沉积反而更狠 */
    const flux=(mode==='short')?0:C*9*(seiOn?1:1.35)*speed;
    spawnAcc+=flux*dt;
    while(spawnAcc>1){spawnAcc-=1;spawnIon();}
    /* 离子运动 */
    const v=2.4+C*0.9;
    for(const io of ions){
      if(!io.on)continue;
      io.x+=(io.tx-io.x)*Math.min(1,dt*2.5);
      io.y-=v*dt;
      io.m.position.set(io.x,io.y,0);
      if(io.y<=io.ty){
        io.on=false;io.m.visible=false;
        if(mode==='li')deposit(io.col);
        else{
          const pm=parkPool[parkCursor%48];
          pm.visible=true;pm.position.set(io.tx,io.ty,0);
          parked.push({m:pm});parkCursor++;
          if(parked.length>48)parked.shift();
          mGraph.emissiveIntensity=0.04+0.28*Math.min(1,parked.length/48);
        }
      }
    }
    /* 短路检测与热失控 */
    hMax=0;for(let i=0;i<NCOL;i++)hMax=Math.max(hMax,heights[i]);
    if(mode==='li'&&hMax>=2.62){mode='short';flashT=0;}
    if(mode==='short'){
      Tbat=Math.min(430,Tbat+dt*140*speed);
      if(flashT<9)flashT+=dt;
      mGlow.opacity=0.25+0.2*Math.sin(simT*12);
      const heat=clamp((Tbat-80)/300,0,0.85);
      mAnode.emissive.setRGB(heat*0.8,heat*0.12,0.02);
      mCath.emissive.setRGB(heat*0.6,heat*0.08,0.01);
    }else{
      Tbat+=(Tenv-Tbat)*dt*0.4;
      mGlow.opacity*=0.9;
      const cool=clamp((Tbat-60)/300,0,1);
      mAnode.emissive.setRGB(cool*0.5,cool*0.05,0);
      mCath.emissive.setRGB(0,0,0);
    }
  }
  /* 枝晶列几何 */
  for(let i=0;i<NCOL;i++){
    const h=Math.max(heights[i],0.02);
    colM[i].scale.y=h;colM[i].position.y=-1.5+h/2;
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();syncSteps();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.fn();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();updateStats();setPlayLabel();
if(document.hidden)stop();else start();
</script>
</body>
