#ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}

#rel a:hover{color:var(--acc);border-color:var(--acc)}
@media(max-width:900px){#stats{display:none}}
@media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}#title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;

const L=(zh,en)=>LANG==='en'?en:zh;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x010205);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.05,500);camera.position.set(0,2,14);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,0,0);

{const _m=new THREE.Matrix4(),_q=new THREE.Quaternion();for(let i=0;i<NS;i++){const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=90+Math.random()*120;_m.compose(new THREE.Vector3(r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph)),_q,new THREE.Vector3().setScalar(.08+Math.random()*.22));starMesh.setMatrixAt(i,_m);}starMesh.instanceMatrix.needsUpdate=true;}

{const g=glowCv.getContext('2d'),gr=g.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,'rgba(255,180,60,.95)');gr.addColorStop(.25,'rgba(255,100,20,.35)');gr.addColorStop(.6,'rgba(255,60,0,.08)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);}
const glowSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(glowCv),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.7}));scene.add(glowSprite);

const ringMesh=new THREE.Mesh(ringGeo,ringMat);ringMesh.rotation.x=Math.PI/2;scene.add(ringMesh);
// Virtual pair particles (InstancedMesh)
const NVP=40;
const fallinM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});
const escapM=new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});
const fallinMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(1,6,5),fallinM,NVP);
const escapMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(1,6,5),escapM,NVP);
fallinMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);escapMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(fallinMesh);scene.add(escapMesh);

const NH=120;
const hawkM=new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false});
const hawkMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(1,5,4),hawkM,NH);scene.add(hawkMesh);
// Pair + photon data
const vpData=[];for(let i=0;i<NVP;i++){const a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);vpData.push({theta:a,phi:b,t:Math.random()*3,life:1.2+Math.random()*1.2,active:false});}
const hpData=[];for(let i=0;i<NH;i++){const a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);hpData.push({theta:a,phi:b,r:2+Math.random()*6,speed:.3+Math.random()*.5});}
// Label registry
const labelReg=[];
function addLabel(textFn,pos,cls,vis){if(!vis)vis=()=>true;const div=document.createElement('div');div.className='lbl '+(cls||'');const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);labelReg.push({o,text:textFn,vis,last:''});div.textContent=textFn();return o;}
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
addLabel(()=>L(`事件视界 r_s`,`Event horizon r_s`),v3(0,1.2,0),'o');
addLabel(()=>L('正能粒子逸出','escaping particle'),v3(2.8,.4,0),'b',()=>MASS_LOG<29);
addLabel(()=>L('负能粒子落入','negative-E falls in'),v3(-2.8,.4,0),'r',()=>MASS_LOG<29);
const lblNotify=addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',v3(0,3.8,0),'o');
let labelsOn=true;
function refreshLabels(){for(const r of labelReg)r.o.visible=labelsOn&&r.vis();}
// Physics constants
const G=6.674e-11,C=3e8,HBAR=1.055e-34,KB=1.38e-23,MSUN=2e30;
let MASS_LOG=24;
let bhRadius=1.0;
let notifyT=0,notifyZ='',notifyE='';
function notify(z,e,t){notifyT=t||4;notifyZ=z;notifyE=e;}
function calcM(){return Math.pow(10,MASS_LOG);}
function calcRs(){return 2*G*calcM()/(C*C);}
function calcT(){return HBAR*C*C*C/(8*Math.PI*G*calcM()*KB)*1e9;}// nK
function calcLife(){const M=calcM();return 5120*Math.PI*G*G*M*M*M/(HBAR*C*C*C*C)/(3.156e7);}// yr

function rebuildBH(){bhRadius=sceneRadius();bhMesh.scale.setScalar(bhRadius);const rg=new THREE.TorusGeometry(bhRadius*1.55,.06,8,96);ringMesh.geometry.dispose();ringMesh.geometry=rg;}
// Steps
const STEPS=[
  {b:'施瓦西半径',be:'Schwarzschild radius',d:'r_s=2GM/c²：光无法从视界内逃出。太阳若坍缩为黑洞，r_s≈3 km。',de:'r_s = 2GM/c² — nothing escapes. For the Sun: r_s ≈ 3 km.',act:()=>{notify('r_s = 2GM/c² · 移动滑块观察视界尺寸变化','r_s = 2GM/c² · move slider to see horizon scale');}},
  {b:'量子真空涨落',be:'Quantum vacuum',d:'量子场论预言空间中虚粒子对不断生灭，ΔE·Δt ≈ ℏ，通常立即湮灭。',de:'QFT: virtual pairs constantly pop in and out (ΔE·Δt ≈ ℏ) and normally annihilate immediately.',act:()=>{notify('虚粒子对(红/蓝)短暂出现后湮灭','Virtual pairs (red/blue) appear then annihilate');}},
  {b:'霍金辐射',be:'Hawking radiation',d:'视界附近：负能虚粒子越过视界落入，正能粒子逸出成为真实霍金光子，黑洞失去质量。',de:'Near horizon: negative-energy partner falls in, positive-energy one escapes — real Hawking radiation, BH loses mass.',act:()=>{notify('蓝色=霍金光子逸出；红色=负能粒子落入','Blue=Hawking photon escapes; red=negative-E falls in');}},
  {b:'温度公式',be:'Temperature formula',d:'T_H=ℏc³/(8πGMk_B)，质量越小温度越高。1 M☉≈60 nK，远低于CMB 2.7 K，净蒸发极慢。',de:'T_H ∝ 1/M. One solar mass: T≈60 nK, far below CMB 2.7 K — no net evaporation today.',act:()=>{MASS_LOG=31;document.getElementById('sM').value=31;document.getElementById('sMVal').textContent='10³¹';rebuildBH();updateStats();updateFormula();notify(`T_H≈${calcT().toFixed(2)} nK (10 M☉)`,`T_H≈${calcT().toFixed(2)} nK (10 M☉)`);}},
  {b:'蒸发加速与末期爆发',be:'Runaway evaporation',d:'M减小→T升高→辐射亮度∝T⁴→M更快减小。末期爆发：最后时刻温度趋向无穷、黑洞消失在光爆中。',de:'M↓→T↑→L∝T⁴→M↓ faster. Final burst: T→∞, BH vanishes in a flash of light.',act:()=>{MASS_LOG=24;document.getElementById('sM').value=24;document.getElementById('sMVal').textContent='10²⁴';rebuildBH();updateStats();updateFormula();evapPlaying=true;document.getElementById('btnEvap').classList.add('on');notify('播放蒸发：观察黑洞缩小、温度飙升、最终光爆！','Play: BH shrinks, T skyrockets, final burst!');}},
  {b:'信息悖论',be:'Information paradox',d:'霍金辐射看似纯热辐射（不含信息），但量子力学要求幺正性——信息必须守恒。霍金晚年提出"软毛发"假说，至今未解。',de:'Radiation appears purely thermal (no info), but unitarity demands conservation. Hawking's "soft hair" proposal — still unsolved.',act:()=>{infoMode=!infoMode;document.getElementById('btnInfo').classList.toggle('on',infoMode);notify('信息悖论：纯热辐射 vs 幺正守恒——物理学未解之谜','Info paradox: thermal vs unitarity — physics' open wound');}},
];
let curStep=-1,playing=true,evapPlaying=false,infoMode=false,simT=0;
function buildSteps(){const ol=document.getElementById('steps');ol.innerHTML='';STEPS.forEach((s,i)=>{const li=document.createElement('li');li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==="en"?s.be:s.b}</b><br>${LANG==="en"?s.de:s.d}</span>`;li.addEventListener('click',()=>{STEPS[i].act();curStep=i;syncSteps();});ol.appendChild(li);});}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===curStep));}
function updateStats(){const M=calcM(),T=calcT(),rs=calcRs(),life=calcLife();const Msun=M/MSUN;document.getElementById('stM').innerHTML=Msun>=.001?`${Msun.toFixed(Msun<1?3:2)}<small> M☉</small>`:`${M.toExponential(1)}<small> kg</small>`;document.getElementById('stT').innerHTML=T>1e9?`${(T/1e9).toFixed(1)}<small> GK</small>`:T>1000?`${(T/1000).toFixed(2)}<small> μK</small>`:`${T.toFixed(2)}<small> nK</small>`;const rsKm=rs/1000;document.getElementById('stR').innerHTML=rsKm>=.001?`${rsKm.toFixed(3)}<small> km</small>`:`${rs.toExponential(1)}<small> m</small>`;document.getElementById('stLife').innerHTML=life>1e15?`${life.toExponential(1)}<small> yr</small>`:life>1e9?`${(life/1e9).toFixed(1)}<small> Gyr</small>`:life>1?`${life.toFixed(0)}<small> yr</small>`:`<1 <small>yr</small>`;}
function updateFormula(){const T=calcT();document.getElementById('formula').innerHTML=`<b>T_H = ℏc³/(8πGMk_B) = ${T>1e6?(T/1e9).toFixed(2)+' GK':T>1?T.toFixed(2)+' nK':'< 1 nK'}</b><br>r_s = 2GM/c² = ${(calcRs()/1000).toExponential(2)} km · t_evap ≈ ${calcLife().toExponential(1)} yr<br>L ∝ 1/M² → 质量越小越亮越热，末期爆发`;}
// Particle sim helpers
const _M4=new THREE.Matrix4(),_Q4=new THREE.Quaternion(),_V4=new THREE.Vector3();
function updatePairs(dt){for(let i=0;i<NVP;i++){const v=vpData[i];v.t+=dt;if(!v.active&&v.t>v.life){v.t=0;v.active=true;v.life=.6+Math.random()*.9;v.theta=Math.random()*Math.PI*2;v.phi=Math.acos(2*Math.random()-1);}if(v.active){const prog=v.t/v.life;const hR=bhRadius*1.05;const outR=hR+prog*bhRadius*1.4;const inR=Math.max(hR-prog*bhRadius*.95,.01);const sx=Math.sin(v.phi)*Math.cos(v.theta),sy=Math.sin(v.phi)*Math.sin(v.theta),sz=Math.cos(v.phi);const fade=Math.sin(prog*Math.PI);const sc=.07+prog*.03;_M4.compose(_V4.set(sx*outR,sy*outR,sz*outR),_Q4,new THREE.Vector3(sc,sc,sc));escapMesh.setMatrixAt(i,_M4);escapM.opacity=fade*.75;_M4.compose(_V4.set(sx*inR,sy*inR,sz*inR),_Q4,new THREE.Vector3(sc*.75,sc*.75,sc*.75));fallinMesh.setMatrixAt(i,_M4);fallinM.opacity=fade*.6;if(v.t>=v.life){v.active=false;v.t=Math.random()*v.life*.4;}}else{_M4.setPosition(0,9999,0);escapMesh.setMatrixAt(i,_M4);fallinMesh.setMatrixAt(i,_M4);}}escapMesh.instanceMatrix.needsUpdate=true;fallinMesh.instanceMatrix.needsUpdate=true;escapM.needsUpdate=true;fallinM.needsUpdate=true;}
function updateHawk(dt){const T=calcT();const bright=clamp(Math.log10(Math.max(T,.001))*0.14,.02,.85);hawkM.opacity=bright*.38;for(let i=0;i<NH;i++){const h=hpData[i];h.r+=h.speed*dt;if(h.r>20){h.r=bhRadius*1.1+Math.random()*.4;h.theta=Math.random()*Math.PI*2;h.phi=Math.acos(2*Math.random()-1);}const sc=.04+.015*(1-h.r/20);const sx=Math.sin(h.phi)*Math.cos(h.theta),sy=Math.sin(h.phi)*Math.sin(h.theta),sz=Math.cos(h.phi);_M4.compose(_V4.set(sx*h.r,sy*h.r,sz*h.r),_Q4,new THREE.Vector3(sc,sc,sc));hawkMesh.setMatrixAt(i,_M4);}hawkMesh.instanceMatrix.needsUpdate=true;hawkM.needsUpdate=true;}
function stepEvap(dt){if(!evapPlaying)return;const M=calcM();if(M<1e12){// final burst: flash and reset after brief delay
glowSprite.material.opacity=Math.min(glowSprite.material.opacity+dt*5,4);if(glowSprite.material.opacity>3.2){evapPlaying=false;document.getElementById('btnEvap').classList.remove('on');setTimeout(()=>{MASS_LOG=24;document.getElementById('sM').value=24;document.getElementById('sMVal').textContent='10²⁴';rebuildBH();glowSprite.material.opacity=.7;updateStats();updateFormula();notify('蒸发完毕！黑洞在终末爆发中消失','Evaporation complete — BH vanished in a final burst!');},800);}return;}
const rate=Math.max(1e-5,8e-12*Math.pow(10,(31-MASS_LOG)*.65));MASS_LOG=Math.max(12,MASS_LOG-rate*dt*180);document.getElementById('sM').value=MASS_LOG;document.getElementById('sMVal').textContent=`10^${MASS_LOG.toFixed(1)}`;rebuildBH();updateStats();updateFormula();}
// Theme / Lang
function applyTheme(){htmlEl.dataset.theme=THEME;document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';scene.background.set(THEME==='dark'?0x010205:0xe8ecf2);}
function applyLang(){htmlEl.lang=LANG==='en'?'en':'zh-CN';document.querySelectorAll('[data-zh]').forEach(el=>{el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh;});document.getElementById('langBtn').textContent=LANG==='en'?'中':'EN';document.title=L('霍金辐射与黑洞蒸发','Hawking Radiation & Black Hole Evaporation');buildSteps();syncSteps();updateStats();updateFormula();}
// Controls
document.getElementById('sM').addEventListener('input',e=>{MASS_LOG=+e.target.value;document.getElementById('sMVal').textContent=`10^${(+e.target.value).toFixed(1)}`;rebuildBH();updateStats();updateFormula();});
document.getElementById('btnStellar').addEventListener('click',()=>{MASS_LOG=31;document.getElementById('sM').value=31;document.getElementById('sMVal').textContent='10³¹';rebuildBH();updateStats();updateFormula();document.getElementById('btnStellar').classList.add('on');document.getElementById('btnMicro').classList.remove('on');curStep=3;syncSteps();notify('恒星质量黑洞 (10 M☉)：T_H≈6 nK，低于CMB，无法净蒸发','Stellar-mass BH (10 M☉): T_H≈6 nK, below CMB — no net evap now');});
document.getElementById('btnMicro').addEventListener('click',()=>{MASS_LOG=24;document.getElementById('sM').value=24;document.getElementById('sMVal').textContent='10²⁴';rebuildBH();updateStats();updateFormula();document.getElementById('btnMicro').classList.add('on');document.getElementById('btnStellar').classList.remove('on');curStep=4;syncSteps();notify('微型黑洞 (10²⁴ kg)：温度更高，可观察蒸发过程','Micro BH (10²⁴ kg): hotter, observable evaporation');});
document.getElementById('btnEvap').addEventListener('click',()=>{evapPlaying=!evapPlaying;document.getElementById('btnEvap').classList.toggle('on',evapPlaying);if(evapPlaying){curStep=4;syncSteps();notify('播放蒸发：质量→温度飙升→末期爆发 (招牌瞬间)','Play: M↓ T↑ luminosity burst — signature moment!');}});
document.getElementById('btnInfo').addEventListener('click',()=>{infoMode=!infoMode;document.getElementById('btnInfo').classList.toggle('on',infoMode);curStep=5;syncSteps();notify('信息悖论：纯热辐射 vs 幺正守恒——仍是未解之谜','Info paradox: thermal radiation vs unitarity — still unsolved');});
const elPlay=document.getElementById('play');
function setPlayLabel(){elPlay.textContent=LANG==='zh'?(playing?'暂停':'播放'):(playing?'Pause':'Play');}
elPlay.addEventListener('click',()=>{playing=!playing;setPlayLabel();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();elPlay.click();}});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;refreshLabels();});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);});
// Main loop
const clock=new THREE.Clock();let raf=null,statsT=0;
function frame(){raf=requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);const simDt=playing?dt:0;if(simDt>0){simT+=simDt;updatePairs(simDt);updateHawk(simDt);stepEvap(simDt);}if(notifyT>0)notifyT-=dt;statsT+=dt;if(statsT>.2){statsT=0;updateStats();updateFormula();for(const r of labelReg){const on=labelsOn&&r.vis();r.o.visible=!!on;if(on){const t=r.text();if(t!==r.last){r.o.element.textContent=t;r.last=t;}}}}const T=calcT();const glowScale=clamp(.35+Math.log10(Math.max(T,.001))*.09,.25,3.5)*bhRadius;glowSprite.scale.setScalar(glowScale);glowSprite.material.opacity=clamp(.28+Math.log10(Math.max(T,1))*.1,.2,.92);ringMesh.rotation.z+=dt*.25;controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera);}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
applyTheme();applyLang();rebuildBH();buildSteps();updateStats();updateFormula();setPlayLabel();
document.getElementById('btnMicro').classList.add('on');curStep=0;syncSteps();start();
</script>
</body>
</html>
