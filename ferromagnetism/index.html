<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>磁铁与磁畴 · 磁滞与居里点</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="磁铁与磁畴 · 磁滞与居里点" data-en="Ferromagnets & Domains · Hysteresis and the Curie Point">磁铁与磁畴 · 磁滞与居里点</h1>
  <div class="sub" data-zh="交换作用把相邻原子自旋锁成平行,比任何外场都强→未磁化的铁=磁畴联邦:每畴内部磁化已饱和,畴间由畴壁隔开,各畴取向随机互相抵消,对外不显磁→加外场 H:畴壁移动、有利畴吞并不利畴,畴磁化再整体转向,全畴同向=饱和磁化→撤场留下剩磁 Br,这就是「永磁体」,把 M 拉回零要反向矫顽力 Hc→继续反向到反向饱和,闭合一周=磁滞回线,回线面积=每周耗散热→软磁(硅钢)回线窄当铁芯省损耗,硬磁(钕铁硼 Nd₂Fe₁₄B)回线宽锁死磁场→温度跨过居里点 Tc,热扰动追平交换作用,铁磁性当场消失:纯铁 770 °C、钕铁硼 ~310 °C、钆 ~20 °C · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Exchange locks neighboring atomic spins parallel, stronger than any external field → unmagnetized iron is a federation of domains: each domain saturated inside, walls between them, random orientations canceling out → apply field H: walls sweep, favorable domains swallow the rest, then magnetizations rotate — all aligned = saturation → remove it and remanence Br remains: that is a permanent magnet; to zero M you need coercivity Hc → sweep negative to reverse saturation and close one full hysteresis loop, whose area is heat per cycle → soft magnetic Si-steel has a narrow loop for cores, hard Nd₂Fe₁₄B a wide loop to lock field → cross the Curie point Tc and thermal agitation ties exchange: iron 770 °C, NdFeB ~310 °C, gadolinium ~20 °C · 3D interactive demo · drag to orbit · Space = run/pause">磁铁与磁畴 · 磁滞与居里点</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="磁化强度 M" data-en="Magnetization M">磁化强度 M</span><span class="v" id="stM">—</span>
  <span class="k" data-zh="剩磁 Br" data-en="Remanence Br">剩磁 Br</span><span class="v warn" id="stBr">—</span>
  <span class="k" data-zh="矫顽力 Hc(归一)" data-en="Coercivity Hc (norm)">矫顽力 Hc(归一)</span><span class="v" id="stHc">—</span>
  <span class="k" data-zh="温度 / Tc" data-en="Temp / Tc">温度 / Tc</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v ok" id="stSt">—</span>
</div>

<div id="plot">
  <h3 data-zh="B-H 磁滞回线:回线面积=每循环耗散热;软磁窄回线当铁芯省损耗,硬磁宽回线锁死磁场。动点=当前 H 与 M" data-en="B-H hysteresis loop: loop area = heat per cycle; soft narrow loops make efficient cores, hard wide loops lock the field. The dot = current H and M">B-H 磁滞回线:回线面积=每循环耗散热;软磁窄回线当铁芯省损耗,硬磁宽回线锁死磁场。动点=当前 H 与 M</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="粗箭头=畴磁化方向(畴内自旋已饱和)" data-en="arrows = domain magnetization (saturated inside)">粗箭头=畴磁化方向(畴内自旋已饱和)</span>
    <span class="chip.g" data-zh="红闪=畴翻转:畴壁正在扫过" data-en="red flash = domain flipping: a wall sweeps by">红闪=畴翻转:畴壁正在扫过</span>
    <span class="chip.b" data-zh="青色线=外磁场线,|M| 越大越亮" data-en="cyan lines = field lines, brighter with |M|">青色线=外磁场线,|M| 越大越亮</span>
    <span class="chip.o" data-zh="铁钉=净磁化 M 的探针,失磁即掉落" data-en="the nail probes net M: it drops on demagnetizing">铁钉=净磁化 M 的探针,失磁即掉落</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnMat" data-zh="材料:纯铁" data-en="Material: pure iron">材料:纯铁</button>
    <button class="abtn brk" id="btnDemag" data-zh="消磁:交流衰减场" data-en="Demagnetize: AC decay">消磁:交流衰减场</button>
    <button class="abtn" id="btnRand" data-zh="打乱:回到未磁化" data-en="Scramble: unmagnetize">打乱:回到未磁化</button>
    <button class="abtn" id="btnWide" data-zh="全景视角" data-en="Wide view">全景视角</button>
  </div>
  <div class="row"><label data-zh="外场 H(归一)" data-en="Field H (norm)">外场 H(归一)</label><input id="sH" type="range" min="-100" max="100" step="1" value="0"><span class="val" id="sHVal">+0.00</span></div>
  <div class="row"><label data-zh="温度 T" data-en="Temperature T">温度 T</label><input id="sT" type="range" min="20" max="900" step="5" value="20"><span class="val" id="sTVal">20 °C</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglLines" type="checkbox" checked> <span data-zh="磁场线" data-en="Field lines">磁场线</span></label>
      <label><input id="tglNail" type="checkbox" checked> <span data-zh="铁钉" data-en="Nail">铁钉</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../electromagnetic-induction/" data-zh="发电机与变压器为何用软磁铁芯" data-en="why generators and transformers use soft cores">发电机与变压器为何用软磁铁芯</a>
    <a href="../hard-drive-flash/" data-zh="磁记录=纳米磁畴" data-en="magnetic recording = nanoscale domains">磁记录=纳米磁畴</a>
    <a href="../maglev/" data-zh="永磁与励磁" data-en="permanent and excited magnets">永磁与励磁</a>
    <a href="../speaker-microphone/" data-zh="永磁体做工" data-en="permanent magnets at work">永磁体做工</a>
    <a href="../induction-cooktop/" data-zh="居里点在电磁炉的应用" data-en="the Curie point inside an induction cooktop">居里点在电磁炉的应用</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 16, 52);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('磁铁与磁畴 · 磁滞与居里点', 'Ferromagnets & Domains · Hysteresis and the Curie Point');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, glErr = '';
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) { glErr = (e && e.message) || String(e); }
if (renderer) {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} else {
  const err = document.createElement('div');
  err.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);color:#ff8787;font-size:14px;text-align:center;padding:30px;';
  err.textContent = L('WebGL 初始化失败,3D 视图已停用(左侧面板与图表仍可用):', 'WebGL failed to start; 3D disabled (panel and plot still work):') + ' ' + glErr;
  document.body.appendChild(err);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = renderer ? new THREE.PMREMGenerator(renderer) : null;
scene.environment = pmrem ? pmrem.fromScene(new RoomEnvironment(), 0.04).texture : null;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 160);
camera.position.set(6.6, 3.6, 8.8);
const controls = new OrbitControls(camera, renderer ? renderer.domElement : labelRenderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 70;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);

/* ================= 绘图:B-H 磁滞回线 ================= */
const plotCv = document.getElementById('plotCv');
const TH0 = [0.1, 0.18, 0.26, 0.34, 0.42, 0.5, 0.57, 0.64, 0.71, 0.78, 0.84, 0.9, 0.95, 1.0];
function branchM(h, cs, s) { let m = 0; for (const c of cs) m += Math.tanh((s * h + c) / 0.05); return m / cs.length; }
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const Hc = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, Hc);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 40, padR = 12, padT = 10, padB = 22;
  const xOf = h => padL + (h + 1) / 2 * (W - padL - padR);
  const yOf = m => (Hc - padB) - (m + 1) / 2 * (Hc - padB - padT);
  ctx.font = '13px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.25)';
  ctx.fillStyle = cTxt;
  ctx.beginPath(); ctx.moveTo(padL, yOf(0)); ctx.lineTo(W - padR, yOf(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xOf(0), padT); ctx.lineTo(xOf(0), Hc - padB); ctx.stroke();
  ctx.fillText('M', 8, padT + 12);
  ctx.fillText('+H', W - padR - 30, yOf(0) - 6);
  ctx.fillText('Br', xOf(0) + 6, padT + 12);
  ctx.fillText('Hc', xOf(-0.32), Hc - padB + 16);
  /* 三条材料回线 */
  for (let mi = 0; mi < 3; mi++) {
    const cs = TH0.map(x => x * MATS[mi].hc);
    const cur = mi === matIdx;
    if (cur) {
      ctx.beginPath();
      for (let h = 1; h >= -1.001; h -= 0.02) { const y = yOf(branchM(h, cs, 1)); h === 1 ? ctx.moveTo(xOf(h), y) : ctx.lineTo(xOf(h), y); }
      for (let h = -1; h <= 1.001; h += 0.02) ctx.lineTo(xOf(h), yOf(branchM(h, cs, -1)));
      ctx.closePath();
      ctx.globalAlpha = 0.10; ctx.fillStyle = MATS[mi].col; ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = MATS[mi].col;
    ctx.lineWidth = cur ? 3 : 1.2;
    ctx.setLineDash(cur ? [] : [5, 5]);
    ctx.beginPath();
    for (let h = 1; h >= -1.001; h -= 0.02) { const y = yOf(branchM(h, cs, 1)); h === 1 ? ctx.moveTo(xOf(h), y) : ctx.lineTo(xOf(h), y); }
    for (let h = -1; h <= 1.001; h += 0.02) ctx.lineTo(xOf(h), yOf(branchM(h, cs, -1)));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = MATS[mi].col;
    ctx.fillText(L(MATS[mi].n, MATS[mi].ne), padL + 8 + mi * 74, padT + 12);
  }
  /* 当前工作点 */
  const mx = clamp(xOf(Hcur), padL, W - padR), my = clamp(yOf(M), padT, Hc - padB);
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath(); ctx.arc(mx, my, 6, 0, 6.29); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
}

btnDemag.addEventListener('click', () => { if (demagT < 0) demagT = 0; });
btnRand.addEventListener('click', () => { randomizeAll(true); syncSliders(); updateStats(); });
btnWide.addEventListener('click', () => flyTo([6.6, 3.6, 8.8], [0, 0, 0]));
elPlay.addEventListener('click', () => {
  playing = !playing;
  if (playing && Math.abs(Math.sin(sweepPh) - Hcur) > 0.05) sweepPh = Math.asin(clamp(Hcur, -1, 1));
  setPlayLabel();
});
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglLines').addEventListener('change', e => { linesOn = e.target.checked; });
document.getElementById('tglNail').addEventListener('change', e => { nailOn = e.target.checked; nail.visible = nailOn; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer && renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
const _Q = new THREE.Quaternion(), _Q2 = new THREE.Quaternion(), _V = new THREE.Vector3();

function startFlip(d, hsign) {
  d.flipT = 0;
  d.qOld = d.qd.clone();
  setDir(d, new THREE.Vector3(hsign, (Math.random() - 0.5) * 0.55, (Math.random() - 0.5) * 0.55));
  d.qNew = d.qd.clone();
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dtA = dt0 * speedMul;
  if (notifyT > 0) notifyT -= dt0;
  if (flipCd > 0) flipCd -= dtA;
  const m = MATS[matIdx];
  const superC = T > m.tc;
  /* 外场取值:消磁动画 > 自动扫描 > 滑块 */
  if (demagT >= 0) {
    demagT += dtA;
    const u = demagT / DEMAG_DUR;
    if (u >= 1) { demagT = -1; Hcur = 0; H = 0; randomizeAll(true); }
    else Hcur = 1.15 * (1 - u) * Math.sin(u * 38);
    syncSliders();
  } else if (playing) {
    sweepPh += dtA * 0.5;
    Hcur = Math.sin(sweepPh);
    syncSliders();
  } else Hcur = H;
  /* 磁畴更新 */
  const jAmp = 0.4 * Math.pow(clamp(T / m.tc, 0, 1), 3);
  for (const d of doms) {
    if (superC) {
      _V.copy(d.dir).lerp(d.tgt, dtA * 2.2);
      setDir(d, _V);
      if (d.dir.angleTo(d.tgt) < 0.25) { d.tgt.randomDirection(); d.axs.randomDirection(); }
    } else {
      if (d.flipT < 1) {
        d.flipT = Math.min(1, d.flipT + dtA / 0.34);
        d.qd.slerpQuaternions(d.qOld, d.qNew, ease(d.flipT));
        d.dir.set(0, 1, 0).applyQuaternion(d.qd);
      } else {
        if (flipCd <= 0 && d.dir.x * Hcur < -0.15 && Math.abs(Hcur) > d.c) { startFlip(d, Math.sign(Hcur)); flipCd = 0.16; }
        else if (Math.abs(Hcur) > 0.5 && d.dir.x * Hcur >= -0.15) {
          _V.set(Math.sign(Hcur), 0, 0);
          _V.lerp(d.dir, 1 - dtA * 0.9 * Math.abs(Hcur));
          setDir(d, _V);
        }
      }
    }
    /* 热抖动 */
    const jAngle = jAmp * (Math.sin(performance.now() / 130 + d.ph) + Math.sin(performance.now() / 71 + d.ph * 2)) * 0.5;
    _Q.setFromAxisAngle(d.axs, jAngle);
    d.arrow.quaternion.copy(d.qd).multiply(_Q);
    /* 有利畴长大 / 不利畴缩小 + 翻转红闪 */
    const fav = d.dir.x * Math.sign(Hcur || 1) * Math.min(1, Math.abs(Hcur) * 2.5);
    const s = 1 + 0.14 * Math.max(0, fav) - 0.1 * Math.max(0, -fav);
    const flash = d.flipT < 1 ? Math.sin(d.flipT * Math.PI) : 0;
    d.cube.scale.setScalar(s + flash * 0.1);
    d.cube.material.emissiveIntensity = flash * 0.9;
    d.am.emissiveIntensity = 0.75 + flash * 2.6;
  }
  M = 0;
  for (const d of doms) M += d.dir.x;
  M /= ND;
  if (T > m.tc) M *= 0.02;
  if (Math.abs(Hcur) < 0.04 && demagT < 0) brMem = M;
  /* 磁场线 */
  fieldGrp.visible = linesOn;
  fieldM.opacity = 0.6 * clamp((Math.abs(M) - 0.55) / 0.45, 0, 1);
  /* 铁钉 */
  if (nailOn) {
    const hold = Math.abs(M) > 0.45;
    if (hold && nailSt !== 'on') { nailSt = 'on'; nailVy = 0; nail.position.copy(NAIL_ON); nail.rotation.set(0, 0.5, 0); }
    else if (!hold && nailSt === 'on') { nailSt = 'fall'; nailVy = 0; }
    if (nailSt === 'fall') {
      nailVy += dtA * 8;
      nail.position.y -= nailVy * dtA;
      nail.rotation.z += dtA * 1.4;
      if (nail.position.y < -2.35) { nail.position.y = -2.35; nailSt = 'down'; }
    }
  }
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.06) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
randomizeAll(false);
applyMat();
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
