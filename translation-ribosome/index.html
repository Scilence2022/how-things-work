<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻译 · 核糖体逐密码子读卡动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e0a13f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.p { color: #43d17c; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.m  { color: #bde9ff; border-color: rgba(127,208,247,.6); }
  .chip.tr { color: #ffc188; border-color: rgba(255,159,67,.6); }
  .chip.pp { color: #7ee2ae; border-color: rgba(67,209,124,.6); }
  :root[data-theme="light"] .chip.m  { color: #0c7ba6; border-color: rgba(12,123,166,.55); }
  :root[data-theme="light"] .chip.tr { color: #b26214; border-color: rgba(178,98,20,.55); }
  :root[data-theme="light"] .chip.pp { color: #148a5c; border-color: rgba(20,138,92,.55); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(224,161,63,.12); border-color: rgba(224,161,63,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.10); border-color: rgba(176,118,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="翻译：核糖体怎么逐密码子读卡——tRNA 挂钩成链" data-en="Translation: the ribosome reads codons one by one — tRNAs hook the chain">翻译：核糖体怎么逐密码子读卡——tRNA 挂钩成链</h1>
  <div class="sub" data-zh="AUG 起步 → EF-Tu 押 tRNA 进 A 位 → 密码子对上才锁定(错的踢出去) → 肽键转移 → EF-G 移位 → UAA 终止落链 · 空格播放/暂停" data-en="Starts at AUG → EF-Tu delivers tRNAs to the A site → only matching codons lock in (wrong ones ejected) → peptide transfer → EF-G translocates → UAA drops the chain · Space = play/pause">AUG 起步 → EF-Tu 押 tRNA 进 A 位 → 密码子对上才锁定(错的踢出去) → 肽键转移 → EF-G 移位 → UAA 终止落链 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="多肽长度" data-en="Peptide length">多肽长度</span><span class="v p" id="stP">1<small>/4 aa</small></span>
  <span class="k" data-zh="校对踢出" data-en="Rejected tRNAs">校对踢出</span><span class="v" id="stR">0<small> 个错 tRNA</small></span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip m" data-zh="mRNA(密码子)" data-en="mRNA (codons)">mRNA(密码子)</span>
    <span class="chip tr" data-zh="tRNA(反密码子+氨基酸)" data-en="tRNA (anticodon + aa)">tRNA(反密码子+氨基酸)</span>
    <span class="chip pp" data-zh="多肽链" data-en="Polypeptide">多肽链</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglBases" type="checkbox" checked> <span data-zh="碱基字母" data-en="Base letters">碱基字母</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('翻译 · 核糖体逐密码子读卡动画', 'Translation · the Ribosome Reads Codons');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function dot(x, y, r, color, glow) {
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  circle(x, y, r, color);
  ctx.shadowBlur = 0;
}

/* ================= 密码子与时序 ================= */
const CYCLE = 20;
const CODONS = ['AUG', 'GCU', 'UAU', 'GCA', 'UAA'];   // fMet-Ala-Tyr-Ala-STOP
const AA = [
  { n: 'fMet', c: '#4dd0e1' }, { n: 'Ala', c: '#7ee2a0' },
  { n: 'Tyr', c: '#f48fb1' }, { n: 'Ala', c: '#7ee2a0' },
];
const P_X = 780, A_X = 885, E_X = 695;    // P / A / E 位点
const MRNA_Y = 560;
const CW = 74;                             // 密码子宽
const TRANS = [0.30, 0.46, 0.62];          // 三次移位完成时刻
const COL_M = '#7fd0f7', COL_TR = '#ffd166', COL_R = '#ff9f43';
const AAS = { AUG: 'fMet', GCU: 'Ala', UAU: 'Tyr', GCA: 'Ala' };
const ANTIC = { AUG: 'UAC', GCU: 'CGA', UAU: 'AUG', GCA: 'CGU' };
const AAOBJ = { fMet: AA[0], Ala: AA[1], Tyr: AA[2] };   // 氨基酸对象(n + c)
const AACOL = { fMet: '#4dd0e1', Ala: '#7ee2a0', Tyr: '#f48fb1' };
let showLabels = true, showBases = true;
let t01 = 0;

/* P 位点当前密码子序号(0..4),随移位平滑推进 */
function pIdx(t) {
  let idx = 0;
  for (const tr of TRANS) if (t >= tr) idx++;
  let k = 0;
  const prev = idx === 0 ? 0 : TRANS[idx - 1];
  if (idx > 0) k = ss(TRANS[idx - 1] - 0.02, idx < TRANS.length ? TRANS[idx] : 0.62, Math.max(t, 0));
  void k;
  return { idx, k };
}
function slideX(t) {
  // mRNA 左移:三次移位各滑一个密码子
  let s = 0;
  s += ss(0.28, 0.32, t) + ss(0.44, 0.48, t) + ss(0.60, 0.64, t);
  return -s * CW;
}

/* ================= 相位讲解 ================= */
const STEPS = [
  { t0: 0.00, t1: 0.14, n: 1, b: '起始:AUG 上 P 位', d: '30S 小亚基认出 mRNA 的 SD 序列并就位;起始 tRNA 带着fMet以反密码子 UAC 配上 AUG;50S 大亚基组装到位。',
    be: 'Initiation: AUG on the P site', de: 'The 30S subunit finds the SD sequence; the initiator tRNA carries fMet with anticodon UAC onto AUG; the 50S subunit locks on.' },
  { t0: 0.14, t1: 0.62, n: 2, b: '延伸:读卡三连', d: 'EF-Tu 押着氨酰-tRNA 进 A 位,密码子-反密码子对上才水解 GTP 锁定——第二轮有颗错的,当场踢出去;肽酰转移酶把多肽从 P 位转挂 A 位;EF-G 移位一码,空 tRNA 从 E 位离场。',
    be: 'Elongation: three rounds', de: 'EF-Tu escorts each tRNA into the A site; only a matching codon-anticodon pair locks in (a wrong one is ejected in round two). The peptidyl transferase center moves the chain to the A site; EF-G translocates one codon and the empty tRNA leaves via E.' },
  { t0: 0.62, t1: 0.80, n: 3, b: '终止:UAA 落链', d: 'A 位出现 UAA——没有 tRNA 能配它,释放因子(RF)入位,多肽从最后一个 tRNA 上落下,亚基解散。',
    be: 'Termination: UAA drops the chain', de: 'UAA lands in the A site — no tRNA fits it. Release factor enters, the polypeptide drops off the last tRNA, and the subunits dissociate.' },
  { t0: 0.80, t1: 1.00, n: 4, b: '产物:中心法则闭环', d: '多肽折叠成蛋白质。中心法则三件套:复制(DNA→DNA)→ 转录(DNA→RNA)→ 翻译(RNA→蛋白质),信息流向在此闭环。',
    be: 'Product: the dogma closes', de: 'The polypeptide folds into a protein. Central dogma complete: replication → transcription → translation.' },
];
function stepIndex(t) {
  if (t < 0.14) return 0;
  if (t < 0.62) return 1;
  if (t < 0.80) return 2;
  return 3;
}

/* ================= 绘制 ================= */
function drawScene(t) {
  const sx = slideX(t);
  const sepK = ss(0.76, 0.82, t);   // 终止后亚基解散
  // mRNA
  line(200, MRNA_Y, 1400, MRNA_Y, 'rgba(127,208,247,.4)', 3);
  for (let ci = 0; ci < CODONS.length + 2; ci++) {
    const cx = P_X + (ci - 1) * CW + sx;
    if (cx < 260 || cx > 1340) continue;
    const cod = CODONS[ci] || '';
    if (ci === CODONS.length - 1 && t >= 0.62) {   // 终止密码子高亮
      rrect(cx - CW / 2 + 4, MRNA_Y - 26, CW - 8, 30, 8, 'rgba(255,93,93,.15)', 'rgba(255,93,93,.8)', 1.4);
    }
    if (ci === 0) {
      rrect(cx - CW / 2 + 4, MRNA_Y - 26, CW - 8, 30, 8, 'rgba(67,209,124,.12)', 'rgba(67,209,124,.7)', 1.4);
    }
    if (showBases) [...cod].forEach((b, bi) => {
      text(b, cx - 24 + bi * 24, MRNA_Y - 6, 16, COL_M, 'center', 700);
    });
  }
  // SD 序列框
  if (t < 0.2) {
    const sdX = P_X - CW + sx - 74;
    rrect(sdX - 30, MRNA_Y - 26, 60, 30, 8, 'rgba(255,209,102,.14)', 'rgba(255,209,102,.7)', 1.2);
    if (showLabels) text(L('SD 序列', 'SD sequence'), sdX, MRNA_Y + 26, 11, COL_M, 'center');
  }
  // 位点标签
  if (showLabels && sepK < 0.5) {
    text('A', A_X, MRNA_Y + 52, 15, PAL.dim2, 'center', 700);
    text('P', P_X, MRNA_Y + 52, 15, PAL.dim2, 'center', 700);
    text('E', E_X, MRNA_Y + 52, 15, PAL.dim2, 'center', 700);
  }
  // 亚基
  const gap = sepK * 90;
  rrect(680, 596 + gap, 360, 120, 30, 'rgba(127,208,247,.10)', '#7fd0f7', 2);
  if (showLabels && sepK < 0.5) text('30S', 700, 700 + gap, 17, '#7fd0f7', 'center', 700);
  rrect(670, 360 - gap, 380, 190, 40, 'rgba(203,174,232,.10)', '#cbaee8', 2);
  if (showLabels && sepK < 0.5) text('50S', 700, 420 - gap, 17, '#cbaee8', 'center', 700);
}
function tRNA(x, anticodon, aa, withChain, t, chainLen) {
  const y0 = MRNA_Y + 6, y1 = 480;
  ctx.strokeStyle = COL_TR; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y0);
  ctx.quadraticCurveTo(x - 8, (y0 + y1) / 2, x, y1 - 10);
  ctx.stroke();
  line(x - 30, y1 - 12, x + 30, y1 - 12, COL_TR, 3);
  circle(x, y0 + 14, 17, COL_TR + '2b', COL_TR, 1.6);
  text(anticodon, x, y0 + 19, 11, '#10141b', 'center', 700);
  circle(x, y1 - 34, 15, aa.c + 'cc', aa.c, 1.4);
  text(aa.n, x, y1 - 30, 9.5, '#10141b', 'center', 700);
  // 挂在 aa 上的多肽
  if (withChain && chainLen > 0) {
    for (let i = 0; i < chainLen; i++) {
      const a = AA[Math.min(i, AA.length - 1)];
      const cx2 = x - 24 - i * 22, cy2 = y1 - 60 - 8 * Math.sin(i * 1.3 + t * 0);
      circle(cx2, cy2, 11, a.c + 'cc', a.c, 1.4);
      text(a.n, cx2, cy2 + 3.5, 8, '#10141b', 'center', 700);
    }
  }
}
/* 各位点 tRNA 状态表:t → {A:{cod,ok..}, P:{...}, E:{...}} */
function siteState(t) {
  // 返回 [site, codIdx, enteringK, rejected]
  const st = { A: null, P: null, E: null, wrong: null };
  const ini = ss(0.06, 0.12, t);
  if (ini > 0) st.P = { cod: 0, k: t < 0.06 ? ini : 1 };
  const rounds = [
    { cod: 1, in0: 0.14, in1: 0.22, xf: 0.30 },
    { cod: 2, in0: 0.36, in1: 0.40, xf: 0.46, wrongAt: [0.30, 0.36] },
    { cod: 3, in0: 0.46, in1: 0.52, xf: 0.62 },
  ];
  for (const r of rounds) {
    if (t >= r.xf) {
      if (st.P && t < r.xf + 0.20) st.P = { cod: r.cod, k: 1 };
      const eLeave = ss(r.xf, r.xf + 0.05, t);
      if (eLeave < 1) st.E = { cod: r.cod - 1, k: 1 - eLeave, leaving: true };
      continue;
    }
    if (t >= r.in0) {
      if (r.wrongAt && t < r.wrongAt[1]) {
        const k = ss(r.wrongAt[0], r.wrongAt[1], t);
        st.wrong = { cod: r.cod, k, ok: false };
        if (k >= 1) st.wrong = null;
      } else {
        st.A = { cod: r.cod, k: ss(r.in0, r.in1, t) };
      }
      if (t >= r.in1 && st.A && st.A.cod === r.cod) st.A.k = 1;
    }
  }
  if (t >= 0.62 && t < 0.80) st.A = { cod: 4, k: 1, stop: true };
  return st;
}
function chainLenAt(t) {
  if (t < 0.24) return 1;
  if (t < 0.40) return 2;
  if (t < 0.56) return 3;
  return 4;
}
function drawAa(t) {
  const st = siteState(t);
  const chain = chainLenAt(t);
  const transfer1 = ss(0.24, 0.28, t), transfer2 = ss(0.40, 0.44, t), transfer3 = ss(0.56, 0.60, t);
  // P 位
  if (st.P) {
    const x = P_X, cod = CODONS[st.P.cod];
    const carried = (t < transfer1 ? chain - 1 + 1 : 0);
    void carried;
    const len = t < transfer1 ? 1 : t < transfer2 ? (t < 0.28 ? 1 : 2) : t < transfer2 + 0.001 ? 2 : (t < 0.44 ? 2 : t < 0.46 ? 3 : (t < 0.56 ? 3 : t < 0.62 ? 4 : 4));
    const useLen = t < 0.24 ? 1 : t < 0.40 ? (transfer1 >= 1 ? 2 : 1) : t < 0.56 ? (transfer2 >= 1 ? 3 : 2) : (transfer3 >= 1 ? 4 : 3);
    tRNA(x, ANTIC[cod], AAOBJ[AAS[cod]], true, t, clamp(useLen, 1, 4));
  }
  // A 位
  if (st.A) {
    const cod = CODONS[st.A.cod];
    if (st.A.stop) {
      circle(A_X, MRNA_Y + 20, 15, 'rgba(255,93,93,.2)', '#ff5d5d', 2);
      text('?', A_X, MRNA_Y + 26, 16, '#ff5d5d', 'center', 700);
      if (showLabels) text(L('没有 tRNA 能配它', 'no tRNA fits'), A_X, MRNA_Y - 34, 12, '#ff8a80', 'center');
      const rf = ss(0.68, 0.74, t);
      if (rf > 0) {
        rrect(A_X - 30, 470 - rf * 30, 60, 30, 15, '#ff5d5d2b', '#ff5d5d', 2);
        text('RF', A_X, 490 - rf * 30, 13, '#ff8a80', 'center', 700);
      }
      const drop = ss(0.74, 0.80, t);
      if (drop > 0) {
        for (let i = 0; i < chain; i++) {
          const a = AA[Math.min(i, AA.length - 1)];
          circle(A_X - 40 - i * 24, 460 + 120 * drop + 8 * Math.sin(i), 11, a.c + 'cc', a.c, 1.4);
        }
      }
    } else {
      const len = st.A.cod === 1 ? (transfer1 >= 1 ? chain : 0)
        : st.A.cod === 2 ? (transfer2 >= 1 ? chain : 0)
        : (transfer3 >= 1 ? chain : 0);
      tRNA(A_X, ANTIC[cod], AAOBJ[AAS[cod]], len > 0, t, len);
    }
  } else if (st.wrong) {
    const k = st.wrong.k;
    const x = lerp(1180, A_X, Math.min(k * 1.4, 1));
    tRNA(x, 'UGA', { n: '✗', c: '#ff8a80' }, false, t, 0);
    if (k > 0.5 && showLabels) text(L('错配!踢出去', 'mismatch! ejected'), A_X, MRNA_Y - 40, 12.5, '#ff5d5d', 'center', 700);
  }
  // E 位离场
  if (st.E && st.E.leaving) {
    const cod = CODONS[st.E.cod];
    ctx.globalAlpha = st.E.k;
    tRNA(E_X + (1 - st.E.k) * -40, ANTIC[cod], AAOBJ[AAS[cod]], false, t, 0);
    ctx.globalAlpha = 1;
  }
}
function drawFactors(t) {
  // EF-Tu 押送(每轮进入期)
  const rounds = [[0.14, 0.22], [0.36, 0.40], [0.46, 0.52]];
  for (const [a, b] of rounds) {
    if (t >= a && t <= b + 0.02) {
      const k = ss(a, b, t);
      const x = lerp(1240, A_X + 26, k);
      circle(x, 500, 16, '#90be6d2b', '#90be6d', 1.8);
      text('EF-Tu', x, 505, 10, '#90be6d', 'center', 700);
      if (k >= 1 && showLabels) text(L('GTP 水解 → 锁定', 'GTP hydrolyzed → locked'), A_X + 60, MRNA_Y - 60, 12, '#90be6d', 'center', 700);
    }
  }
  // EF-G 移位(三轮移位窗口)
  const moves = [[0.28, 0.32], [0.44, 0.48], [0.60, 0.64]];
  for (const [a, b] of moves) {
    if (t >= a && t <= b) {
      const k = ss(a, b, t);
      const x = lerp(A_X + 80, E_X, k);
      rrect(x - 26, 470, 52, 34, 16, '#cbaee82b', '#cbaee8', 1.8);
      text('EF-G', x, 492, 11, '#cbaee8', 'center', 700);
      if (showLabels) text(L('移位一码', 'translocate one codon'), x + 90, 470, 12, '#cbaee8', 'center', 700);
    }
  }
}
function drawProduct(t) {
  if (t < 0.80) return;
  const k = ss(0.82, 0.94, t);
  const x = lerp(760, 1120, k), y = lerp(560, 300, k);
  ctx.globalAlpha = k;
  rrect(x - 78, y - 30, 156, 60, 30, '#43d17c22', '#43d17c', 2);
  text(L('多肽 → 折叠成蛋白', 'polypeptide → folds'), x, y + 6, 14, '#43d17c', 'center', 700);
  if (showLabels) text(L('中心法则:复制 → 转录 → 翻译,在此闭环', 'dogma: replication → transcription → translation'),
    x + 10, y + 58, 12.5, PAL.dim2, 'center');
  ctx.globalAlpha = 1;
}
function draw(t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawScene(t);
  drawFactors(t);
  drawAa(t);
  drawProduct(t);
}
function updateStats(t) {
  const n = chainLenAt(t);
  stP.innerHTML = n + '<small>/4 aa</small>';
  const r = ss(0.33, 0.36, t) >= 1 ? 1 : 0;
  stR.innerHTML = r + '<small> 个错 tRNA</small>';
}

/* ================= UI / 主循环 ================= */
let cycles = (() => { const v = parseFloat(qs.get('t')); return Number.isFinite(v) ? v : 0; })();
let playing = !qsBool('pause', false);
let speed = (() => { const v = parseFloat(qs.get('speed')); return Number.isFinite(v) ? v : 1; })();

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const stP = document.getElementById('stP'), stR = document.getElementById('stR');
const tglLabels = document.getElementById('tglLabels');
const tglBases = document.getElementById('tglBases');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglBases.addEventListener('change', () => { showBases = tglBases.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

let lastStep = -1, last = performance.now();
applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (playing) cycles += dt * speed / CYCLE;
  t01 = cycles - Math.floor(cycles);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(t01);
  updateStats(t01);

  const si = stepIndex(t01);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t01 * 1000);
  elScrubVal.textContent = Math.round(t01 * 100) + '%';
}
requestAnimationFrame(frame);
</script>
