<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻译 · 核糖体逐密码子读卡动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e0a13f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.e { border-color: rgba(99,230,190,.9); color: #c3f5e5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.o { border-color: rgba(255,209,102,.85); color: #ffe3a3; }
  .lbl.b { background: transparent; border: 0; padding: 0 1px; font-weight: 700; font-size: 12.5px;
    color: #9fdcf9; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  :root[data-theme="light"] .lbl.b { color: #0b6e96; text-shadow: 0 1px 2px rgba(255,255,255,.7); }
  .lbl.site { background: transparent; border: 0; font-size: 14px; font-weight: 700;
    color: var(--text2); letter-spacing: 1px; }
  .lbl.sub { font-size: 13px; font-weight: 700; padding: 5px 10px; }
  .lbl.b30 { border-color: rgba(127,208,247,.85); color: #bde9ff; }
  .lbl.b50 { border-color: rgba(203,174,232,.85); color: #e8dbfa; }
  :root[data-theme="light"] .lbl.b30 { color: #0c7ba6; }
  :root[data-theme="light"] .lbl.b50 { color: #6d4fa8; }
  .lbl.ac { border-color: rgba(255,209,102,.8); color: #ffd08a; background: rgba(255,209,102,.12);
    font-size: 11px; padding: 3px 6px; }
  :root[data-theme="light"] .lbl.ac { color: #a05a10; }
  .lbl.aa, .lbl.bd { font-size: 10.5px; padding: 2px 6px; font-weight: 700; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.4); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.p { color: #43d17c; }

  #hud { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    padding: 9px 14px 8px; backdrop-filter: blur(6px); max-width: min(560px, 46vw); }
  #hudTrack { display: flex; gap: 5px; justify-content: center; margin-bottom: 6px; }
  #hudTrack .cd { font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid transparent;
    color: var(--text3); letter-spacing: 1px; font-variant-numeric: tabular-nums; transition: background .2s; }
  #hudTrack .cd.m { color: #7fd0f7; border-color: rgba(127,208,247,.35); }
  #hudTrack .cd.start { color: #43d17c; border-color: rgba(67,209,124,.6); }
  #hudTrack .cd.stop { color: #ff5d5d; border-color: rgba(255,93,93,.6); }
  #hudTrack .cd.p { background: rgba(224,161,63,.20); border-color: var(--acc); }
  #hudTrack .cd.a { background: rgba(127,208,247,.15); }
  #hudPair { font-size: 12px; color: var(--text3); text-align: center; line-height: 1.55; }
  #hudPair b { color: var(--text); }
  #hudPair .bad { color: #ff8787; }
  #hudPair .ok { color: #43d17c; }
  #hudPair .warn { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.m  { color: #bde9ff; border-color: rgba(127,208,247,.6); }
  .chip.tr { color: #ffc188; border-color: rgba(255,159,67,.6); }
  .chip.pp { color: #7ee2ae; border-color: rgba(67,209,124,.6); }
  :root[data-theme="light"] .chip.m  { color: #0c7ba6; border-color: rgba(12,123,166,.55); }
  :root[data-theme="light"] .chip.tr { color: #b26214; border-color: rgba(178,98,20,.55); }
  :root[data-theme="light"] .chip.pp { color: #148a5c; border-color: rgba(20,138,92,.55); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(224,161,63,.12); color: var(--text); border: 1px solid rgba(224,161,63,.5);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(224,161,63,.12); border-color: rgba(224,161,63,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.10); border-color: rgba(176,118,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1250px) { #hud { display: none; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="翻译：核糖体怎么逐密码子读卡——tRNA 挂钩成链" data-en="Translation: the ribosome reads codons one by one — tRNAs hook the chain">翻译：核糖体怎么逐密码子读卡——tRNA 挂钩成链</h1>
  <div class="sub" data-zh="3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · AUG 起步 → EF-Tu 押 tRNA 进 A 位 → 密码子对上才锁定(错的踢出去) → 肽键转移 → EF-G 移位 → UAA 终止落链 · 空格播放/暂停" data-en="Interactive 3D · drag to orbit / scroll to zoom · Starts at AUG → EF-Tu delivers tRNAs to the A site → only matching codons lock in (wrong ones ejected) → peptide transfer → EF-G translocates → UAA drops the chain · Space = play/pause">3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · AUG 起步 → EF-Tu 押 tRNA 进 A 位 → 密码子对上才锁定(错的踢出去) → 肽键转移 → EF-G 移位 → UAA 终止落链 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="多肽长度" data-en="Peptide length">多肽长度</span><span class="v p" id="stP">1<small>/4 aa</small></span>
  <span class="k" data-zh="校对踢出" data-en="Rejected tRNAs">校对踢出</span><span class="v" id="stR">0<small> 个错 tRNA</small></span>
</div>

<div id="hud">
  <div id="hudTrack"></div>
  <div id="hudPair">—</div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip m" data-zh="mRNA(密码子)" data-en="mRNA (codons)">mRNA(密码子)</span>
    <span class="chip tr" data-zh="tRNA(反密码子+氨基酸)" data-en="tRNA (anticodon + aa)">tRNA(反密码子+氨基酸)</span>
    <span class="chip pp" data-zh="多肽链" data-en="Polypeptide">多肽链</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnEgg" data-zh="彩蛋:回放「错配踢出」一幕" data-en="easter egg: replay the mismatch ejection">彩蛋:回放「错配踢出」一幕</button>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglBases" type="checkbox" checked> <span data-zh="碱基字母" data-en="Base letters">碱基字母</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../transcription/" data-zh="上游一步:转录" data-en="one step upstream: transcription">上游一步:转录</a>
    <a href="../dna-replication/" data-zh="中心法则第一环:复制" data-en="first link of the dogma: replication">中心法则第一环:复制</a>
    <a href="../virus-lifecycle/" data-zh="被病毒劫持的核糖体" data-en="ribosomes, hijacked by a virus">被病毒劫持的核糖体</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lerpV = (a, b, k) => a.clone().lerp(b, k);
const hx = n => '#' + n.toString(16).padStart(6, '0');

/* ---------------- 密码子与时序(与 2D 版一致) ---------------- */
const CYCLE = 20;
const CW = 0.72;                                     // 密码子间距(世界单位)
const SITE = { E: -CW, P: 0, A: CW };
const CODONS = ['AUG', 'GCU', 'UAU', 'GCA', 'UAA'];  // fMet-Ala-Tyr-Ala-STOP
const AAS = { AUG: 'fMet', GCU: 'Ala', UAU: 'Tyr', GCA: 'Ala' };
const ANTIC = { AUG: 'UAC', GCU: 'CGA', UAU: 'AUG', GCA: 'CGU' };
const AA = [ { n: 'fMet', c: 0x4dd0e1 }, { n: 'Ala', c: 0x7ee2a0 },
             { n: 'Tyr', c: 0xf48fb1 }, { n: 'Ala', c: 0x7ee2a0 } ];
const COL_AA = AA.map(a => new THREE.Color(a.c));
const chainLenAt = t => t < 0.24 ? 1 : t < 0.40 ? 2 : t < 0.56 ? 3 : 4;
/* 三轮延伸:进位 / 锁定 / 肽键转移 / 移位滑码 */
const ROUNDS = [
  { cod: 1, in0: 0.14, in1: 0.22, tf0: 0.24, tf1: 0.28, sl0: 0.28, sl1: 0.32 },
  { cod: 2, in0: 0.36, in1: 0.40, tf0: 0.40, tf1: 0.44, sl0: 0.44, sl1: 0.48, wrong: [0.30, 0.36] },
  { cod: 3, in0: 0.46, in1: 0.52, tf0: 0.56, tf1: 0.60, sl0: 0.60, sl1: 0.64 },
];
function stepIndex(t) { return t < 0.14 ? 0 : t < 0.62 ? 1 : t < 0.80 ? 2 : 3; }

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('翻译 · 核糖体逐密码子读卡动画', 'Translation · the Ribosome Reads Codons');
  for (const r of labelRegistry) { const x = r.text(); r.o.element.textContent = x; }
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.5, 1.5, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.25, 0.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 14;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const M = {
  s30: mat(0x7fd0f7, { opacity: 0.15, depthWrite: false, roughness: 0.3 }),
  s30d: mat(0x7fd0f7, { opacity: 0.5, roughness: 0.5 }),
  s50: mat(0xcbaee8, { opacity: 0.16, depthWrite: false, roughness: 0.3 }),
  mrna: mat(0x7fd0f7, { opacity: 0.85, emissiveIntensity: 0.25 }),
  codon: mat(0x7fd0f7, { opacity: 0.30, depthWrite: false, emissiveIntensity: 0.2 }),
  dim: mat(0x7fd0f7, { opacity: 0.10, depthWrite: false }),
  plateOk: mat(0x43d17c, { opacity: 0.28, depthWrite: false, emissiveIntensity: 0.3 }),
  plateStop: mat(0xff5d5d, { opacity: 0, depthWrite: false, emissiveIntensity: 0.35 }),
  plateSD: mat(0xffd166, { opacity: 0.26, depthWrite: false, emissiveIntensity: 0.3 }),
};

/* 基座 */
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.5, 0.12, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -1.9;
scene.add(base);

function mkTRNA(ac, aaName, aaHex) {
  const g = new THREE.Group();
  const mats = [];
  const tm = mat(0xffd166, { emissiveIntensity: 0.22, roughness: 0.4 });
  mats.push(tm);
  const add = (geo, m, x, y, z, rz = 0, ry = 0) => {
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.set(x, y, z); mesh.rotation.set(0, ry, rz);
    g.add(mesh); return mesh;
  };
  add(new THREE.TorusGeometry(0.15, 0.035, 10, 22), tm, 0, 0.03, 0, 0, Math.PI / 2);
  add(new THREE.CylinderGeometry(0.045, 0.045, 0.82, 10), tm, 0, 0.46, 0);
  add(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 10), tm, -0.24, 0.9, 0, Math.PI / 2);
  const am = mat(aaHex, { emissiveIntensity: 0.35, roughness: 0.35 });
  mats.push(am);
  add(new THREE.SphereGeometry(0.135, 16, 12), am, -0.46, 0.9, 0);
  g.visible = false;
  scene.add(g);
  const mkTag = (txt, cls, pos) => {
    const div = document.createElement('div');
    div.className = 'lbl ' + cls; div.textContent = txt;
    if (cls === 'aa' || cls === 'bd') { div.style.color = hx(aaHex); div.style.borderColor = hx(aaHex); }
    const o = new CSS2DObject(div); o.position.copy(pos); g.add(o); return o;
  };
  const lblAc = mkTag(ac, 'ac', V3(0, -0.24, 0));
  const lblAa = mkTag(aaName, 'aa', V3(-0.46, 1.16, 0));
  return { g, mats, lblAc, lblAa };
}

/* ================= 世界更新(全部为相位 t 的确定函数,可任意拖动相位) ================= */
function placeIni(t) {
  const k = ss(0.06, 0.12, t);
  let x = SITE.P, y = lerp(-0.95, 0, k), op = k;
  x = lerp(x, SITE.E, ss(0.28, 0.32, t));
  const ex = ss(0.30, 0.35, t);
  op *= 1 - ex; y -= ex * 0.18;
  tIni.g.position.set(x, y, 0);
  setOp(tIni, op);
}
function placeRound(T, ri, t) {
  const r = ROUNDS[ri];
  const e = ss(r.in0, r.in1, t);
  let x = lerp(2.75, SITE.A, e), y = lerp(-0.42, 0, e), z = lerp(0.55, 0, e), op = e;
  x = lerp(x, SITE.P, ss(r.sl0, r.sl1, t));
  if (ri < 2) {
    const ex = ss(r.sl0 + 0.02, r.sl0 + 0.07, t);
    x = lerp(x, SITE.E, ex); op *= 1 - ex; y -= ex * 0.18;
  } else {
    op *= 1 - ss(0.74, 0.80, t);          // 最后一颗:落链时随链释出
  }
  T.g.position.set(x, y, z);
  setOp(T, op);
}
function placeWrong(t) {
  const wk = ss(0.30, 0.36, t);
  let op = 0;
  if (wk > 0 && wk < 1) {
    const kin = Math.min(wk * 1.4, 1);
    let x = lerp(2.7, SITE.A - 0.18, kin), y = lerp(0.1, 0.03, kin);
    const z = lerp(0.45, 0, kin);
    if (wk > 0.5) x += Math.sin(wk * 70) * 0.03;
    const j = clamp((wk - 0.72) / 0.28, 0, 1);
    x += j * 1.4; y += j * 1.25;
    tW.g.rotation.z = -j * 2.4;
    op = kin * (1 - j);
    tW.g.position.set(x, y, z);
  } else tW.g.rotation.z = 0;
  setOp(tW, op);
}
function placeEfTu(t) {
  let op = 0;
  const Ts = [t1, t2, t3];
  for (let i = 0; i < TU.length; i++) {
    const [a, b] = TU[i];
    if (t >= a && t <= b + 0.06) {
      const k = ss(a, b, t);
      const p = lerpV(V3(3.05, 0.5, 0.75), aaPos(Ts[i]).add(V3(0.34, 0.02, 0.3)), k);
      let f = 1;
      if (t > b) { f = 1 - ss(b, b + 0.05, t); p.y += (1 - f) * 0.32; }
      efTu.position.copy(p);
      op = ss(a, a + 0.02, t) * f;
      break;
    }
  }
  showFactor(efTu, op);
}
function placeEfG(t) {
  let op = 0;
  for (const [a, b] of EG) {
    if (t >= a && t <= b) {
      const k = ss(a, b, t);
      efG.position.copy(lerpV(V3(CW + 0.6, 0.5, 0.42), V3(-CW - 0.4, 0.5, 0.42), k));
      op = ss(a, a + 0.012, t) * (1 - ss(b - 0.012, b, t));
      break;
    }
  }
  showFactor(efG, op);
}
function placeStop(t) {
  const qk = ss(0.62, 0.65, t) * (1 - ss(0.78, 0.82, t));
  qGrp.position.set(CW, 0.05, 0);
  showFactor(qGrp, qk);
  const rk = ss(0.68, 0.74, t);
  rf.position.set(CW, lerp(-0.66, 0.34, rk), 0.3);
  showFactor(rf, rk * (1 - ss(0.80, 0.86, t)));
}
function placeChain(t, ts) {
  const hanging = clamp(chainLenAt(t) - 1, 0, 3);
  let root;
  if (t < 0.28) root = lerpV(aaPos(tIni), aaPos(t1), ss(0.24, 0.28, t));
  else if (t < 0.44) root = lerpV(aaPos(t1), aaPos(t2), ss(0.40, 0.44, t));
  else if (t < 0.60) root = lerpV(aaPos(t2), aaPos(t3), ss(0.56, 0.60, t));
  else root = aaPos(t3);
  const falling = t >= 0.74;
  const dk = ss(0.74, 0.80, t), pk = ss(0.82, 0.94, t);
  for (let i = 0; i < 4; i++) {
    let pos, sc = 0;
    if (!falling) {
      sc = i < hanging ? 1 : 0;
      pos = root.clone();
      pos.x -= 0.27 * (i + 1);
      pos.y += Math.sin(ts * 2.2 + i * 1.4) * 0.02;
    } else {
      sc = 1;
      const start = root.clone();
      if (i < 3) start.x -= 0.27 * (i + 1);
      pos = lerpV(start, V3(-0.55 - 0.34 * i, -1.72, i % 2 ? 0.15 : -0.15), dk);
      pos.y += Math.sin(dk * Math.PI) * 0.22;
      if (pk > 0) pos = lerpV(pos, helixSlot(i), pk);
    }
    dummy.position.copy(pos);
    dummy.scale.setScalar(sc);
    dummy.updateMatrix();
    chainMesh.setMatrixAt(i, dummy.matrix);
    chainMesh.setColorAt(i, COL_AA[i]);
    const bl = beadLbls[i];
    const show = sc > 0 && pk <= 0;
    bl.element.style.display = show ? '' : 'none';
    if (show) bl.position.copy(pos).add(V3(0, -0.24, 0));
  }
  chainMesh.instanceMatrix.needsUpdate = true;
  if (chainMesh.instanceColor) chainMesh.instanceColor.needsUpdate = true;
}
let tSim = 0;
function updateWorld(t, ts) {
  tNow = t; tSim = ts;
  /* mRNA 逐密码子左滑(三次移位) */
  mrnaGrp.position.x = -(ss(0.28, 0.32, t) + ss(0.44, 0.48, t) + ss(0.60, 0.64, t)) * CW;
  sdPlate.material.opacity = 0.26 * (1 - ss(0.2, 0.23, t));
  stopPlate.material.opacity = 0.34 * ss(0.60, 0.625, t);
  /* 亚基解散 */
  const sep = ss(0.76, 0.82, t);
  grp50.position.y = 0.62 + sep * 1.3; grp50.rotation.z = sep * 0.10;
  grp30.position.y = -0.55 - sep * 0.6; grp30.rotation.z = -sep * 0.05;
  ptc.material.emissiveIntensity = 0.5 + 0.3 * Math.sin(ts * 3);
  /* tRNA 全员 */
  placeIni(t);
  placeRound(t1, 0, t); placeRound(t2, 1, t); placeRound(t3, 2, t);
  placeWrong(t);
  /* 因子与终止 */
  placeEfTu(t); placeEfG(t); placeStop(t);
  /* 多肽链 */
  placeChain(t, ts);
  /* 胞质粒子 */
  for (let i = 0; i < moteN; i++) {
    const sd = moteSeed[i];
    dummy.position.set(Math.sin(sd * 40 + ts * 0.3) * 2.7, -1.7 + ((ts * 0.06 + sd) % 1) * 3.4, Math.cos(sd * 29 + ts * 0.25) * 1.7);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    motes.setMatrixAt(i, dummy.matrix);
  }
  motes.instanceMatrix.needsUpdate = true;
}

    if (t >= r.in1 && t < r.tf0) return `<span class="ok">${L('配对成功:GTP 水解 → 锁定', 'pairing verified: GTP hydrolyzed → locked')}</span>`;
    if (t >= r.tf0 && t < r.tf1) return L('肽酰转移酶:多肽从 P 位转挂 A 位', 'peptidyl transferase: the chain moves from P to A');
    if (t >= r.tf1 && t < r.sl1) return L('EF-G 移位一码:空 tRNA 从 E 位弹出', 'EF-G translocates one codon; the empty tRNA leaves via E');
  }
  if (t >= 0.62 && t < 0.68) return `<span class="bad">A 位:UAA = ${L('终止密码子,没有 tRNA 能配它', 'stop codon — no tRNA fits it')}</span>`;
  if (t >= 0.68 && t < 0.74) return L('释放因子 RF 入位', 'release factor (RF) enters the A site');
  if (t >= 0.74 && t < 0.80) return L('多肽落链!随后亚基解散', 'the polypeptide drops! subunits dissociate next');
  if (t >= 0.80) return L('产物:fMet–Ala–Tyr–Ala 四肽 → 折叠成蛋白质', 'product: fMet–Ala–Tyr–Ala tetrapeptide → folds into a protein');
  return `${L('P 位:', 'P site:')} <b>${CODONS[idx]}</b> ⇄ ${ANTIC[CODONS[idx]]} → <b>${AAS[CODONS[idx]]}</b>`;
}
function updateHUD(t) {
  const idx = (t >= 0.30 ? 1 : 0) + (t >= 0.46 ? 1 : 0) + (t >= 0.62 ? 1 : 0);
  const aOn = t >= 0.14 && t < 0.62;
  codPills.forEach((el, i) => {
    el.classList.toggle('p', i === idx);
    el.classList.toggle('a', aOn && i === idx + 1);
  });
  hudPair.innerHTML = hudLine(t);
}

/* ================= UI / 主循环 ================= */
let cycles = clamp(qsFloat('t', 0), 0, 1e9);
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.1, 3);

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const stP = document.getElementById('stP'), stR = document.getElementById('stR');
const tglLabels = document.getElementById('tglLabels');
const tglBases = document.getElementById('tglBases');
const tglRotate = document.getElementById('tglRotate');
const btnEgg = document.getElementById('btnEgg');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
const fmtSpd = v => v.toFixed(2).replace(/0$/, '') + '×';
elSpeed.value = speed; elSpeedVal.textContent = fmtSpd(speed);
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = fmtSpd(speed); });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglBases.addEventListener('change', () => {
  for (const b of baseLbls) b.element.style.display = tglBases.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
btnEgg.addEventListener('click', () => { cycles = Math.floor(cycles) + 0.33; });
if (!qsBool('labels', true)) { tglLabels.checked = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

function updateStats(t) {
  stP.innerHTML = chainLenAt(t) + '<small>/4 aa</small>';
  const r = ss(0.33, 0.36, t) >= 1 ? 1 : 0;
  stR.innerHTML = r + '<small>' + L(' 个错 tRNA', ' wrong tRNA') + '</small>';
}

const clock = new THREE.Clock();
let lastStep = -1, loopOn = true;
function frame() {
  if (!loopOn || document.hidden) { loopOn = false; return; }
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  cycles += dts / CYCLE;
  const t01 = cycles - Math.floor(cycles);
  updateWorld(t01, tSim + dts);
  updateStats(t01);
  updateHUD(t01);
  for (const r of labelRegistry) {
    const x = r.text();
    r.o.element.textContent = x;
    r.o.element.style.display = (x && tglLabels.checked) ? '' : 'none';
  }
  const si = stepIndex(t01);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t01 * 1000);
  elScrubVal.textContent = Math.round(t01 * 100) + '%';
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !loopOn) { loopOn = true; clock.getDelta(); requestAnimationFrame(frame); }
});

applyTheme();
applyLang();
requestAnimationFrame(frame);
</script>
</body>
</html>
