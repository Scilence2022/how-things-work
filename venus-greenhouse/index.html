<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>金星与失控温室 · 地球的另一个我</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="title">

  <div class="sub" data-zh="与地球同尺寸、只离太阳近 30%——海洋蒸发→水汽温室→更热的正反馈越过阈值，水被紫外光解逃逸（D/H=地球 100 倍），CO₂ 埋不回去积成 92 bar、465 °C · 拖动旋转 / 空格运行/暂停" data-en="Same size as Earth, just 30% closer: evaporation → vapor greenhouse → hotter, past the runaway threshold; UV splits water, hydrogen escapes (D/H = 100× Earth), carbon can't be buried — 92 bar, 465 °C · drag to orbit / Space = run/pause">与地球同尺寸、只离太阳近 30%——海洋蒸发→水汽温室→更热的正反馈越过阈值，水被紫外光解逃逸（D/H=地球 100 倍），CO₂ 埋不回去积成 92 bar、465 °C · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const QS=new URLSearchParams(location.search);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,40,140);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,300);
camera.position.set(-1.4,1.1,5.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.15,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=2.4; controls.maxDistance=25;

scene.add(new THREE.HemisphereLight(0x8899bb,0x1a1410,0.35));
const sunLight=new THREE.PointLight(0xfff1d8,1.9,0,0); scene.add(sunLight);

/* ---- 星空 ---- */
const starGeo=new THREE.BufferGeometry();
const sp=new Float32Array(500*3);
for(let i=0;i<500;i++){
  const v=new THREE.Vector3().randomDirection().multiplyScalar(80+Math.random()*40);
  sp[i*3]=v.x;sp[i*3+1]=v.y;sp[i*3+2]=v.z;
}
starGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xcfd8e6,size:0.55,sizeAttenuation:true,fog:false})));

/* ---- 太阳（滑块改变距离=改变日照）---- */
function glowTex(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,244,214,1)');gr.addColorStop(0.3,'rgba(255,206,110,0.55)');gr.addColorStop(1,'rgba(255,170,50,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const sun=new THREE.Mesh(new THREE.SphereGeometry(0.55,24,16),new THREE.MeshBasicMaterial({color:0xffe6a8}));
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),transparent:true,depthWrite:false}));
sunGlow.scale.setScalar(3.6); sun.add(sunGlow); scene.add(sun);

/* ---- 行星 ---- */
const planet=new THREE.Group(); scene.add(planet);
const landM=new THREE.MeshStandardMaterial({color:0x8a7358,roughness:1,emissive:0xff4a12,emissiveIntensity:0});
const land=new THREE.Mesh(new THREE.SphereGeometry(1.5,48,32),landM); planet.add(land);
const oceanM=new THREE.MeshStandardMaterial({color:0x1565a8,roughness:0.35,transparent:true,opacity:0.88});
const ocean=new THREE.Mesh(new THREE.SphereGeometry(1.508,48,32),oceanM); planet.add(ocean);
/* 大气壳：稀薄蓝 → 蒸汽白 → 硫酸黄 */
const atmoM=new THREE.MeshBasicMaterial({color:0x7fb2ff,transparent:true,opacity:0.14,depthWrite:false});
const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.62,48,32),atmoM); atmo.renderOrder=2; planet.add(atmo);
const cloudM=new THREE.MeshBasicMaterial({color:0xf4f7fa,transparent:true,opacity:0.3,depthWrite:false});
const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.7,48,32),cloudM); clouds.renderOrder=3; planet.add(clouds);

/* ---- 逃逸的氢（水被紫外光解后，氢挣脱行星）---- */
const NESC=240;
const escMesh=new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.022,6,5),
  new THREE.MeshBasicMaterial({color:0xbfe0ff,transparent:true,opacity:0.75}),
  NESC);
scene.add(escMesh);
const escDir=[],escP=new Float32Array(NESC);
for(let i=0;i<NESC;i++){escDir.push(new THREE.Vector3().randomDirection());escP[i]=Math.random();}
const escDummy=new THREE.Object3D();
{                                                // 预填零缩放矩阵（?pause=1 时不堆原点）
  for(let i=0;i<NESC;i++){escDummy.scale.setScalar(0);escDummy.updateMatrix();escMesh.setMatrixAt(i,escDummy.matrix);}
  escMesh.instanceMatrix.needsUpdate=true;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('太阳','Sun'),new THREE.Vector3(0,0.9,0),'b',()=>sun.position.x<7.5,sun);
addLabel(()=>L('海洋：曾经的金星','Ocean: once Venus\' too'),new THREE.Vector3(0,-1.85,0),'g',()=>O()>0.3);
addLabel(()=>L('水汽温室：越热蒸得越多','Vapor greenhouse: hotter → more evaporation'),new THREE.Vector3(0,2.05,0),'o',()=>pw>0.05);
addLabel(()=>L('光解出的氢正在逃逸','Photolysed hydrogen escaping'),new THREE.Vector3(1.6,2.4,0),'g',()=>escVis);
addLabel(()=>L('92 bar CO₂ + 硫酸云 = 465 °C','92 bar CO₂ + H₂SO₄ clouds = 465 °C'),new THREE.Vector3(0,2.15,0),'r',()=>pco2>40);

/* ---- 物理模型（灰大气近似，校准到实测值）----
   日照 S=1361/d²；吸收 F=(1-A)S/4（湿润行星 A=0.3；干涸后硫酸云 A→0.72）
   表面温度：σT⁴ = F·(1+0.75τ)，τ=0.85 + 2.6·pCO2^0.85 + 4.0·pH2O^0.8
   → 地球(1 AU, A=0.3)：289 K ✓；金星(0.723 AU, 92 bar, A=0.72)：~738 K ✓（实测 737 K）
   蒸发平衡：pH2O → 0.25·es(Ts)（Tetens/Clausius–Clapeyron），受水库存限制（地球海=270 bar 蒸汽）
   逃逸：湿润温室阈值 F>287 W/m² 后氢速逃（扩散极限）+ 蒸汽大气直接流失
   D/H：Rayleigh 分馏 R=W^(-0.62)，拟合实测金星 D/H ≈ 地球 100 倍以上 */
const S0=1361, SIGMA=5.67e-8;
let d=0.723, pco2=0.5, W=1, pw=0.02;   // W: 水总量（地球海洋=1），pw: 大气水汽 bar
let simMyr=0, playing=true, labelsOn=true, escVis=false;
let speedK=2;

const es=T=>{const Tc=T-273.15;return 611*Math.exp(17.27*Tc/(Tc+237.3));};  // Pa
function albedo(){
  const dry=clamp(1-O()*6,0,1);                 // 海洋在 → 云是水云；干涸后 CO₂+SO₂ 云
  return 0.3+0.42*dry*clamp((pco2-1)/91,0,1);
}
function O(){return Math.max(0,W-pw/270);}      // 液态海洋余量
function Fab(){return (1-albedo())*S0/(d*d)/4;}
function tau(){return 0.85+2.6*Math.pow(Math.max(pco2,1e-4),0.85)+4.0*Math.pow(Math.max(pw,1e-6),0.8);}
function surfT(){return Math.pow(Fab()*(1+0.75*tau())/SIGMA,0.25);}
function escRate(){
  const moist=0.09*Math.pow(clamp((Fab()-287)/287,0,3),1.3)*Math.min(1,O()*50);
  const steam=0.15*Math.pow(clamp(pw/270,0,1),0.5);
  return moist+steam;   // 地球海洋份额 / Myr
}
function physicsStep(myr){
  const T=surfT();
  const pwt=Math.min(0.25*es(T)/1e5,W*270);     // 蒸发平衡（快弛豫）
  pw+=(pwt-pw)*clamp(myr*300,0,1);
  W=Math.max(1e-4,W-escRate()*myr);             // 逃逸（慢）
  simMyr+=myr;
}

/* ---- 状态切换 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  starGeo.attributes.position.needsUpdate=true;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
function preset(which){
  if(which==='earth'){d=1.0;pco2=0.0004;W=1;pw=0.004;simMyr=4567;}
  else if(which==='early'){d=0.723;pco2=0.5;W=1;pw=0.02;simMyr=4567;}
  else{d=0.723;pco2=92;W=0.0005;pw=0.01;simMyr=4567;}   // 金星如今：D/H≈实测量级
  syncUI();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'孪生起点：金星与地球几乎同尺寸同密度，只离太阳近 30%',en:'Twin start: nearly Earth\'s size and density, just 30% closer to the Sun'},
  {zh:'更近一步：日照是地球的 1.9 倍，海洋蒸发更多——水汽本身就是强温室',en:'1.9× sunlight: ocean evaporates more — vapor itself is a strong greenhouse gas'},
  {zh:'正反馈失控：T↑→蒸发↑→水汽↑→温室↑，越过阈值海洋整体蒸入大气',en:'Runaway: hotter → wetter → thicker blanket; past the threshold the ocean boils in'},
  {zh:'光解逃逸：紫外把 H₂O 拆开，轻的氢挣脱行星——冷阱再也关不住水',en:'UV splits H₂O; light hydrogen escapes — the cold trap can\'t hold water any more'},
  {zh:'氘的指纹：氢跑了、氘留下——D/H 攀升百倍，水流失的铁证',en:'Deuterium fingerprint: H fled, D stayed — D/H climbs ~100×, proof of the loss'},
  {zh:'碳埋不回去：无板块无生命，碳酸盐循环断路，CO₂ 积满 92 bar、465 °C',en:'No plate tectonics to bury carbon: CO₂ piles to 92 bar, 465 °C'},
  {zh:'地球的镜子：宜居带边界不在星际远方，就在 0.72 AU 与 1.0 AU 之间',en:'Earth\'s mirror: the habitable edge lies between 0.72 and 1.0 AU'},
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;gotoStep(i);syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function gotoStep(i){
  if(i===0)preset('earth');
  else if(i===1){preset('early');}
  else if(i===2){preset('early');playing=true;}
  else if(i===3){for(let k=0;k<60;k++)physicsStep(0.5);playing=true;}
  else if(i===4){for(let k=0;k<160;k++)physicsStep(0.5);}
  else if(i===5)preset('venus');
  else if(i===6)preset('earth');
  syncUI();
}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stS').innerHTML=S0/(d*d)<1000?(S0/(d*d)).toFixed(0)+'<small> W/m²</small>':(S0/(d*d)).toFixed(0)+'<small> W/m²</small>';
  const T=surfT(),Tc=T-273.15;
  const tEl=document.getElementById('stT');
  tEl.innerHTML=Tc.toFixed(0)+'<small> °C</small>';
  tEl.style.color=Tc>100?'#ff6b6b':'';
  document.getElementById('stW').innerHTML=(W*100).toFixed(1)+'<small> %</small>';
  const R=Math.pow(Math.max(W,1e-4),-0.62);
  document.getElementById('stD').innerHTML=(R<100?R.toFixed(1):R.toFixed(0))+'<small> ×地球</small>';
}

/* ---- UI 同步 ---- */
function syncUI(){
  document.getElementById('sDist').value=d;
  document.getElementById('sDistVal').textContent=d.toFixed(3)+' AU';
  document.getElementById('sCo2').value=clamp(pco2,0,92);
  document.getElementById('sCo2Val').textContent=(pco2<0.01?L('≈0（今地球）','≈0 (today)'):pco2.toFixed(1)+' bar');
  document.getElementById('sSpdVal').textContent=speedK.toFixed(0)+' Myr/s';
  document.getElementById('btnEarth').classList.toggle('on',d===1);
  document.getElementById('btnEarly').classList.toggle('on',d<1&&O()>0.01);
  document.getElementById('btnVenus').classList.toggle('on',pco2>40);
}
document.getElementById('sDist').addEventListener('input',e=>{d=+e.target.value;syncUI();});
document.getElementById('sCo2').addEventListener('input',e=>{pco2=+e.target.value;syncUI();});
document.getElementById('sSpd').addEventListener('input',e=>{speedK=+e.target.value/10;syncUI();});
document.getElementById('btnEarth').addEventListener('click',()=>{preset('earth');activeStep=0;syncSteps();});
document.getElementById('btnEarly').addEventListener('click',()=>{preset('early');activeStep=2;syncSteps();});
document.getElementById('btnVenus').addEventListener('click',()=>{preset('venus');activeStep=5;syncSteps();});
document.getElementById('btnFF').addEventListener('click',()=>{for(let k=0;k<200;k++)physicsStep(0.25);});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,statAcc=0;
const cWhite=new THREE.Color(0xf4f7fa),cSulfur=new THREE.Color(0xd9c25e);
const cAtmo1=new THREE.Color(0x7fb2ff),cAtmo2=new THREE.Color(0xe8e2d2),cAtmo3=new THREE.Color(0xdfc468);
const _c=new THREE.Color(),_c2=new THREE.Color();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing)physicsStep(dt*speedK);
  const T=surfT(),Tc=T-273.15,oc=O(),ab=albedo();
  // 太阳随距离滑块移动，光强 ∝ 1/d²
  sun.position.set(d*7.5,0.6,0);
  sunLight.position.copy(sun.position);
  sunLight.intensity=1.9*S0/(d*d)/S0;
  // 海洋：水位与颜色
  ocean.visible=oc>0.004;
  const os=1+0.006*clamp(oc,0,1);
  ocean.scale.setScalar(os);
  // 地表：干涸色 + 高温红热
  landM.color.setHex(0x8a7358).lerp(_c.setHex(0xb5925f),clamp(oc*3,0,1));
  landM.emissiveIntensity=clamp((T-450)/300,0,1)*1.4;
  // 大气与云
  const steamT=clamp(pw/0.35,0,1),co2T=clamp((pco2-1)/91,0,1)*clamp(1-oc*6,0,1);
  _c2.copy(cAtmo1).lerp(cAtmo2,steamT).lerp(cAtmo3,co2T);
  atmoM.color.copy(_c2);
  atmoM.opacity=0.12+0.32*clamp((tau()-0.9)/80,0,1);
  cloudM.opacity=Math.max(0.34*clamp(oc*3,0,1),0.6*steamT,0.4*co2T);
  cloudM.color.copy(cWhite).lerp(cSulfur,co2T);
  planet.rotation.y+=dt*0.05; clouds.rotation.y+=dt*0.083;
  // 逃逸粒子：速率 ∝ 逃逸通量
  const er=escRate();
  escVis=er>0.002;
  for(let i=0;i<NESC;i++){
    if(!escVis||escP[i]<=0){escDummy.scale.setScalar(0);}
    else{
      escP[i]-=dt*clamp(0.25+er*6,0.1,2.2);
      if(escP[i]<=0)escP[i]=1;
      const p=escP[i];
      escDummy.position.copy(escDir[i]).multiplyScalar(1.72+p*1.8);
      escDummy.scale.setScalar(0.5+0.9*p);
    }
    escDummy.updateMatrix();escMesh.setMatrixAt(i,escDummy.matrix);
  }
  escMesh.instanceMatrix.needsUpdate=true;
  statAcc+=dt;if(statAcc>0.1){statAcc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
if(QS.get('pause')==='1')playing=false;
if(QS.get('labels')==='0')labelsOn=false;
const qSpd=QS.get('speed');if(qSpd){speedK=clamp(+qSpd||2,0.5,8);document.getElementById('sSpd').value=speedK*10;}
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();applyLang();buildSteps();updateStats();syncUI();start();
</script>
</body>
</html>
