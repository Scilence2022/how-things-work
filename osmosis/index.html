<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渗透与反渗透 · 外加压强越过 π 的瞬间净流反转</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0c7ba6;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.w { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.s { border-color: rgba(255,159,40,.9); color: #ffd9a3; }
  .lbl.g { border-color: rgba(67,209,124,.9); color: #c9f3da; font-size: 13px; padding: 6px 11px; }
  .lbl.r { border-color: rgba(255,93,93,.9); color: #ffc2c2; }
  :root[data-theme="light"] .lbl.w { border-color: rgba(12,123,166,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.s { border-color: rgba(156,95,0,.9); color: #9c5f00; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(71,112,31,.9); color: #3f6d1c; }
  :root[data-theme="light"] .lbl.r { border-color: rgba(200,60,60,.9); color: #b83232; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.p { color: #ffd9a3; }
  #stats .v.f { color: #4cc9f0; }
  #stats .v.rev { color: #ff8a80; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.w { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  .chip.s { color: #ffd9a3; border-color: rgba(255,159,40,.7); }
  :root[data-theme="light"] .chip.w { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.s { color: #9c5f00; border-color: rgba(178,128,20,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 108px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,123,166,.08); border-color: rgba(12,123,166,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="渗透与反渗透：外加压强越过 π 的瞬间净流反转" data-en="Osmosis & Reverse Osmosis: push past π and the flow flips">渗透与反渗透：外加压强越过 π 的瞬间净流反转</h1>
  <div class="sub" data-zh="半透膜只放水过:水「想」稀释糖,液面差攒出反向静压,Δh = π 时平衡;右侧加压越过 π,水被反向压出——海水淡化 · 空格播放/暂停" data-en="The membrane passes only water: it rushes to dilute the sugar until the head balances π; squeeze the solution past π and pure water is squeezed out — desalination · Space = play/pause">半透膜只放水过:水「想」稀释糖,液面差攒出反向静压,Δh = π 时平衡;右侧加压越过 π,水被反向压出——海水淡化 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="液面差 Δh" data-en="head Δh">液面差 Δh</span><span class="v" id="stH">—</span>
  <span class="k" data-zh="渗透压 π" data-en="osmotic π">渗透压 π</span><span class="v p" id="stP">—</span>
  <span class="k" data-zh="外加压强 P" data-en="applied P">外加压强 P</span><span class="v p" id="stA">—</span>
  <span class="k" data-zh="净流向" data-en="net flow">净流向</span><span class="v f" id="stF">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip w" data-zh="● 水分子(能过膜)" data-en="● water (passes)">● 水分子(能过膜)</span>
    <span class="chip s" data-zh="● 糖/盐(过不去)" data-en="● solute (blocked)">● 糖/盐(过不去)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnReset" data-zh="重置液面" data-en="Reset levels">重置液面</button>
    <button class="abtn" id="btnEq" data-zh="跳到渗透平衡" data-en="Jump to equilibrium">跳到渗透平衡</button>
  </div>
  <div class="row"><label data-zh="外加压强 P(右室)" data-en="applied P (right)">外加压强 P(右室)</label><input id="prs" type="range" min="0" max="250" step="5" value="0"><span class="val" id="prsVal">0.00π</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglMol" type="checkbox" checked> <span data-zh="分子" data-en="molecules">分子</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../buffer-solution/" data-zh="同族:溶液里的粒子视角" data-en="same family: particle view of solutions">同族:溶液里的粒子视角</a>
    <a href="../sodium-potassium-pump/" data-zh="生物膜上的离子运输" data-en="ion transport across membranes">生物膜上的离子运输</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.frame.color.set(THEME === 'light' ? 0x9aa4b2 : 0x39424f);
  M.waterL.color.set(THEME === 'light' ? 0x9fd4f0 : 0x2a6f9e);
  M.waterR.color.set(THEME === 'light' ? 0xaed6ea : 0x2e688a);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('渗透与反渗透 · 净流反转的瞬间', 'Osmosis & Reverse Osmosis · the moment flow flips');
  for (const r of labelRegistry) r.o.element.textContent = L(r.zh, r.en);
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(3.4, 3.4, 8.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  frame: mat(0x39424f, { roughness: 0.7 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.06,
    roughness: 0.15, side: THREE.DoubleSide, depthWrite: false }),
  waterL: new THREE.MeshPhysicalMaterial({ color: 0x2a6f9e, transparent: true, opacity: 0.30, roughness: 0.3 }),
  waterR: new THREE.MeshPhysicalMaterial({ color: 0x2e688a, transparent: true, opacity: 0.30, roughness: 0.3 }),
  mem: new THREE.MeshPhysicalMaterial({ color: 0xd8e4ec, transparent: true, opacity: 0.28, roughness: 0.4, side: THREE.DoubleSide }),
  h2o: new THREE.MeshBasicMaterial({ color: 0xbfe3f5 }),
  solute: new THREE.MeshBasicMaterial({ color: 0xff9f28 }),
  pore: new THREE.MeshBasicMaterial({ color: 0x8fb8cc, transparent: true, opacity: 0.75 }),
  piston: mat(0x8d99a8, { metalness: 0.5, roughness: 0.4 }),
  rod: mat(0xcfd4dc, { metalness: 0.7, roughness: 0.3 }),
  arrowL: new THREE.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.95 }),
  arrowR: new THREE.MeshBasicMaterial({ color: 0xff8a80, transparent: true, opacity: 0.0 }),
};

/* ---------------- 水槽 ---------------- */
const TW = 3.4, TH = 2.6, TD = 1.0;      // 半宽 / 高 / 半深
const K_LEVEL = 0.0065;                    // 每分子水位
const N0 = 200;                            // 初始每侧水分子数
const N_S = 46;                            // 溶质数(固定右室)
const KP = 3.7;                            // π = KP · nS/nR
const tank = new THREE.Group();
scene.add(tank);
function buildTank() {
  const bottom = new THREE.Mesh(new THREE.BoxGeometry(TW * 2 + 0.16, 0.1, TD * 2 + 0.16), M.frame);
  bottom.position.y = -0.05;
  tank.add(bottom);
  for (const sx of [-1, 1]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(0.06, TH, TD * 2), M.glass);
    wall.position.set(sx * (TW + 0.03), TH / 2, 0);
    tank.add(wall);
    const edge = new THREE.Mesh(new THREE.BoxGeometry(0.06, TH, 0.06), M.frame);
    edge.position.set(sx * (TW + 0.03), TH / 2, TD);
    tank.add(edge);
    const edge2 = edge.clone();
    edge2.position.z = -TD;
    tank.add(edge2);
  }
  for (const sz of [-1, 1]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(TW * 2, TH, 0.06), M.glass);
    wall.position.set(0, TH / 2, sz * (TD + 0.03));
    tank.add(wall);
  }
  /* 半透膜 */
  const mem = new THREE.Mesh(new THREE.BoxGeometry(0.05, TH, TD * 2), M.mem);
  mem.position.set(0, TH / 2, 0);
  tank.add(mem);
  /* 膜孔 */
  for (let i = 0; i < 6; i++) {
    const pore = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.02, 8, 20), M.pore);
    pore.rotation.y = Math.PI / 2;
    pore.position.set(0, 0.45 + Math.floor(i / 3) * 1.15 + (i % 3 - 1) * 0.22, (i % 2 ? 0.3 : -0.3));
    tank.add(pore);
  }
}
buildTank();
/* 两侧水体(高度随分子数) */
const waterLBox = new THREE.Mesh(new THREE.BoxGeometry(TW - 0.08, 1, TD * 2 - 0.12), M.waterL);
waterLBox.position.set(-(TW + 0.05) / 2 - 0.02, 0, 0);
scene.add(waterLBox);
const waterRBox = new THREE.Mesh(new THREE.BoxGeometry(TW - 0.08, 1, TD * 2 - 0.12), M.waterR);
waterRBox.position.set((TW + 0.05) / 2 + 0.02, 0, 0);
scene.add(waterRBox);

/* 活塞(右室) */
const piston = new THREE.Group();
scene.add(piston);
const plate = new THREE.Mesh(new THREE.BoxGeometry(TW - 0.2, 0.09, TD * 2 - 0.2), M.piston);
piston.add(plate);
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.6, 12), M.rod);
rod.position.y = 0.8;
piston.add(rod);

/* 流向箭头 */
function makeArrow(material, r = 0.06) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 10), material);
  shaft.rotation.z = Math.PI / 2;
  shaft.position.x = 0.5;
  g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(r * 2.2, r * 5, 12), material);
  tip.rotation.z = Math.PI / 2;
  tip.position.x = 1 + r * 2.4;
  g.add(tip);
  g.setLen = (len) => { g.scale.x = Math.max(len, 0.001); };
  return g;
}
const flowArrow = new THREE.Group();
const arrowPos = makeArrow(M.arrowL);
const arrowNeg = makeArrow(M.arrowR);
flowArrow.add(arrowPos);
flowArrow.add(arrowNeg);
flowArrow.position.set(-1.7, 2.15, 0);
scene.add(flowArrow);

/* ---------------- 分子 ---------------- */
const m4tmp = new THREE.Matrix4();
function makeInst(material, n, r) {
  const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 10, 8), material, n);
  for (let i = 0; i < n; i++) { m4tmp.makeScale(0.001, 0.001, 0.001); inst.setMatrixAt(i, m4tmp); }
  scene.add(inst);
  return inst;
}
const instW = makeInst(M.h2o, 460, 0.055);
const instS = makeInst(M.solute, N_S, 0.105);
const waters = [];   // {p, side: -1|1, crossing: 0..1|null, from}
const solutes = [];
function initMolecules() {
  waters.length = 0;
  for (let i = 0; i < N0 * 2; i++) {
    const side = i < N0 ? -1 : 1;
    waters.push({ p: randPos(side, N0 * K_LEVEL), side, cross: null });
  }
  solutes.length = 0;
  for (let i = 0; i < N_S; i++) solutes.push({ p: randPos(1, N0 * K_LEVEL), w: rand(0, 9) });
}
function randPos(side, hMax) {
  return new THREE.Vector3(
    side * rand(0.25, TW - 0.25),
    rand(0.12, Math.max(hMax - 0.1, 0.3)),
    rand(-TD + 0.22, TD - 0.22));
}
initMolecules();

/* ---------------- 状态 ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let P = 0;                     // 外加压强,单位与世界 Δh 同标度
let tSim = 0;
const LP = 15;                 // 膜通量系数( pacing:初始 ~13 分子/秒 )
function counts() {
  let nL = 0, nR = 0;
  for (const w of waters) if (w.cross === null) { w.side < 0 ? nL++ : nR++; }
  return { nL, nR };
}
function osmoticPi(nR) { return KP * N_S / Math.max(nR, 30); }

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(zh, en, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.textContent = zh;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, zh, en });
  return o;
}
const lblPure = addLabel('纯水', 'pure water', new THREE.Vector3(-TW / 2 - 0.2, TH + 0.25, 0), 'w');
const lblSol = addLabel('糖盐溶液', 'solution', new THREE.Vector3(TW / 2 + 0.2, TH + 0.25, 0), 's');
const lblMem = addLabel('半透膜:只放水过', 'semi-permeable: water only', new THREE.Vector3(0, TH + 0.25, -TD), 'g');
const lblPiston = addLabel('活塞 · 外加压强 P', 'piston · applied P', new THREE.Vector3(TW / 2 + 0.3, TH + 0.8, 0), 's');
const lblFlow = addLabel('净流向', 'net flow', new THREE.Vector3(-1.7, 2.75, 0), 'w');
const lblEq = addLabel('Δh = π:渗透平衡', 'Δh = π: equilibrium', new THREE.Vector3(0.9, 0.9, TD + 0.25), 'g');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '半透膜:一道筛子', be: 'A sieve called the membrane',
    d: '膜孔只容得下水分子钻过,糖/盐分子太大,永远留在右侧。',
    de: 'Pores pass water molecules only; sugar/salt are too big and stay on the right.',
    act: () => { setP(0); resetLevels(); } },
  { b: '渗透:水想稀释糖', be: 'Osmosis: water dilutes',
    d: '右侧一部分水被溶质「拴住」,能钻膜的自由水更少——净流从纯水侧流向溶液侧,右液面升高。',
    de: 'Solute ties up some water on the right, so fewer free water molecules hit the pores — net flow runs pure → solution, the right level rises.',
    act: () => { setP(0); resetLevels(); } },
  { b: '液面差攒出反向静压', be: 'The head fights back',
    d: '右液面越高,往回压的静压 ρgΔh 越大;Δh = π 时净流恰好为零——渗透平衡,不是停止,是双向打平。',
    de: 'A higher right column pushes back harder; at Δh = π the net flow is exactly zero — dynamic equilibrium, not a stop.',
    act: () => jumpEq() },
  { b: '反渗透:压强越过 π', be: 'Reverse osmosis: P > π',
    d: '活塞下压超过渗透压的瞬间,净流反转:纯水被从溶液里「挤」出来穿膜回首侧,糖盐留下——海水淡化。',
    de: 'The moment piston pressure passes π, the flow flips: pure water is squeezed out of the solution while salt stays — desalination.',
    act: () => { setPiFactor(1.35); } },
  { b: '越淡化越费压', be: 'The more you make, the more it takes',
    d: '右室水变少、糖盐变浓,π 随之上涨——持续淡化必须持续加压。这是反渗透厂的能耗账本。',
    de: 'Less water, more concentrated brine, higher π — sustained desalination needs sustained pressure. That is a plant\'s energy bill.',
    act: () => { setPiFactor(2.3); } },
];
function stepIndex() {
  if (P > 2.0) return 4;
  if (P > 0.8) return 3;
  const { nL, nR } = counts();
  const dh = (nR - nL) * K_LEVEL;
  if (P > 0.05) return 3;
  if (dh > 0.72 * osmoticPi(nR)) return 2;
  if (dh > 0.1) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elPrs = document.getElementById('prs');
const elPrsVal = document.getElementById('prsVal');
const tglLabels = document.getElementById('tglLabels');
const tglMol = document.getElementById('tglMol');
const tglRotate = document.getElementById('tglRotate');
const stH = document.getElementById('stH'), stP = document.getElementById('stP'),
  stA = document.getElementById('stA'), stF = document.getElementById('stF');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setP(piUnits) {
  P = piUnits * osmoticPi(counts().nR);
  elPrs.value = Math.round(piUnits * 100);
  elPrsVal.textContent = piUnits.toFixed(2) + 'π';
}
function setPiFactor(f) { setP(f); }
function resetLevels() {
  initMolecules();
}
function jumpEq() {
  setP(0);
  const x = Math.round(osmoticPi(N0) / (2 * K_LEVEL));
  initMolecules();
  for (let i = 0; i < x; i++) waters[i].side = 1;
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elPrs.addEventListener('input', () => {
  const u = parseInt(elPrs.value, 10) / 100;
  P = u * osmoticPi(counts().nR);
  elPrsVal.textContent = u.toFixed(2) + 'π';
});
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
document.getElementById('btnReset').addEventListener('click', () => { resetLevels(); setP(0); });
document.getElementById('btnEq').addEventListener('click', jumpEq);
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let transferAcc = 0;
function stepPhysics(dt) {
  const { nL, nR } = counts();
  const hL = nL * K_LEVEL, hR = nR * K_LEVEL;
  const pi = osmoticPi(nR);
  const F = LP * (pi - (hR - hL) - P);          // >0 左→右
  transferAcc += F * dt;
  const src = transferAcc >= 0 ? -1 : 1;        // 净流的源侧
  let n = Math.min(Math.abs(Math.trunc(transferAcc)), 60);
  transferAcc -= Math.sign(transferAcc) * n;
  for (let i = 0; i < n; i++) {
    const cands = waters.filter(w => w.side === src && w.cross === null);
    if (!cands.length) break;
    const w = cands[(Math.random() * cands.length) | 0];
    w.cross = 0.0001;
    w.from = src;
  }
  /* 穿膜动画 */
  for (const w of waters) {
    if (w.cross === null) continue;
    w.cross += dt * 2.2;
    if (w.cross >= 1) { w.side = -w.from; w.cross = null; }
  }
  return { F, pi, hL, hR, nL, nR };
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;
  const st = playing ? stepPhysics(dts) : null;
  const { nL, nR } = counts();
  const hL = nL * K_LEVEL, hR = nR * K_LEVEL;
  const pi = osmoticPi(nR);
  const F = st ? st.F : LP * (pi - (hR - hL) - P);

  /* 水体与活塞 */
  waterLBox.scale.y = Math.max(hL, 0.02);
  waterLBox.position.y = hL / 2;
  waterRBox.scale.y = Math.max(hR, 0.02);
  waterRBox.position.y = hR / 2;
  const conc = N_S / Math.max(nR, 30) / (N_S / N0);
  piston.position.set(TW / 2 + 0.1, hR + 0.06 + P * 0.03, 0);

  /* 分子游动 */
  for (const w of waters) {
    if (w.cross === null) {
      w.p.x += rand(-1, 1) * 0.5 * dts;
      w.p.y += rand(-1, 1) * 0.5 * dts;
      w.p.z += rand(-1, 1) * 0.5 * dts;
      const hMax = (w.side < 0 ? hL : hR) - 0.07;
      w.p.x = clamp(w.p.x, w.side < 0 ? -TW + 0.2 : 0.2, w.side < 0 ? -0.2 : TW - 0.2);
      w.p.y = clamp(w.p.y, 0.12, Math.max(hMax, 0.16));
      w.p.z = clamp(w.p.z, -TD + 0.22, TD - 0.22);
    } else {
      const k = w.cross;
      const x0 = w.from < 0 ? -0.12 : 0.12, x1 = w.from < 0 ? 0.12 : -0.12;
      w.p.x = lerp(x0, x1, k);
      w.p.y = clamp(w.p.y, 0.3, 2.2);
    }
  }
  const show = tglMol.checked;
  let iw = 0;
  for (const w of waters) {
    m4tmp.makeScale(...(show ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4tmp.setPosition(w.p);
    instW.setMatrixAt(iw++, m4tmp);
  }
  instW.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < N_S; i++) {
    const s = solutes[i];
    s.p.x += rand(-1, 1) * 0.32 * dts;
    s.p.y += rand(-1, 1) * 0.32 * dts;
    s.p.z += rand(-1, 1) * 0.32 * dts;
    s.p.x = clamp(s.p.x, 0.3, TW - 0.25);
    s.p.y = clamp(s.p.y, 0.16, Math.max(hR - 0.12, 0.2));
    s.p.z = clamp(s.p.z, -TD + 0.25, TD - 0.25);
    m4tmp.makeScale(...(show ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4tmp.setPosition(s.p);
    instS.setMatrixAt(i, m4tmp);
  }
  instS.instanceMatrix.needsUpdate = true;
  M.solute.color.setHSL(0.076, 1, lerp(0.58, 0.44, clamp(conc - 1, 0, 1.4)));

  /* 流向箭头 */
  const mag = clamp(Math.abs(F) / (LP * pi) * 2.2, 0.06, 2.6);
  arrowPos.setLen(F > 0.4 ? mag : 0.001);
  arrowNeg.setLen(F < -0.4 ? mag : 0.001);
  M.arrowL.opacity = F > 0.4 ? 0.95 : 0.12;
  M.arrowR.opacity = F < -0.4 ? 0.95 : 0.12;
  lblFlow.element.textContent =
    F > 0.4 ? L('净流向右 → 渗透', 'net → osmosis')
    : F < -0.4 ? L('← 净流向左:反渗透淡化', 'net ← reverse osmosis')
    : L('净流为零:动态平衡', 'no net flow: dynamic equilibrium');

  /* 统计 */
  stH.textContent = (hR - hL).toFixed(2);
  stP.textContent = pi.toFixed(2);
  stA.innerHTML = (P / pi).toFixed(2) + '<small> × π</small>';
  stF.textContent = F > 0.4 ? L('左 → 右', 'L → R') : F < -0.4 ? L('右 → 左', 'R → L') : L('平衡', 'balance');
  stF.classList.toggle('rev', F < -0.4);
  lblEq.element.style.opacity = Math.abs(hR - hL - pi) < 0.09 && P < 0.05 ? 1 : 0;

  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
setP(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
