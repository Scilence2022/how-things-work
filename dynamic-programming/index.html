<style>

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}

    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

  #play:hover{filter:brightness(1.12)}

  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具 / 主题 / 语言 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.01,400);
camera.position.set(0,7,26);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=120;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.9));
const keyL=new THREE.DirectionalLight(0xffffff,0.8);keyL.position.set(4,8,6);scene.add(keyL);

const grid=new THREE.GridHelper(44,44,0x2a3340,0x1c232c);
grid.position.y=-13.6;scene.add(grid);

/* ============ 精确计数：朴素调用 2F(n+1)−1，记忆化 2n−1，自底向上 n−1 次加法 ============ */
function fib(n){let a=0,b=1;for(let i=0;i<n;i++){const t=a+b;a=b;b=t;}return a;}
const naiveCalls=n=>2*fib(n+1)-1;

/* ============ 状态 ============ */
let n=12,mode='naive',playing=true,speedK=1,labelsOn=true;
let tree=null,anim={list:[],idx:0};
const TRUNC_D=7,MAX_RENDER=520;

/* ============ 调用树 ============ */
const nodeIM=new THREE.InstancedMesh(new THREE.SphereGeometry(1,10,8),
  new THREE.MeshBasicMaterial({transparent:true,opacity:0.97}),MAX_RENDER);
nodeIM.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAX_RENDER*3),3);
nodeIM.frustumCulled=false;
{const zm=new THREE.Matrix4().makeScale(0,0,0);for(let i=0;i<MAX_RENDER;i++)nodeIM.setMatrixAt(i,zm);nodeIM.instanceMatrix.needsUpdate=true;}
const treeG=new THREE.Group();treeG.add(nodeIM);scene.add(treeG);
const edgePos=new Float32Array(MAX_RENDER*6),edgeCol=new Float32Array(MAX_RENDER*6);
const edgeGeo=new THREE.BufferGeometry();
edgeGeo.setAttribute('position',new THREE.BufferAttribute(edgePos,3).setUsage(THREE.DynamicDrawUsage));
edgeGeo.setAttribute('color',new THREE.BufferAttribute(edgeCol,3).setUsage(THREE.DynamicDrawUsage));
const edgeLines=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.8}));
edgeLines.frustumCulled=false;treeG.add(edgeLines);

const C_IDLE=new THREE.Color(0x3a4756),C_VIS=new THREE.Color(0xffa94d),
      C_HIT=new THREE.Color(0x94a1b0),C_CUT=new THREE.Color(0x232b34),
      E_DIM=new THREE.Color(0x2c3642),E_ON=new THREE.Color(0xffd43b);
const treePos=[];   // 每节点世界坐标
let nodeR=0.2;
function buildTree(){
  const nodes=[];let cut=false;
  function rec(k,d,parent){
    if(nodes.length>=MAX_RENDER||d>TRUNC_D){cut=true;return null;}
    const id=nodes.length;
    const nd={k,d,parent,id,children:[],x:0};
    nodes.push(nd);
    if(k<=1||d===TRUNC_D||nodes.length>=MAX_RENDER)return nd;
    const c1=rec(k-1,d+1,id);if(c1)nd.children.push(c1.id);
    const c2=rec(k-2,d+1,id);if(c2)nd.children.push(c2.id);
    return nd;
  }
  rec(n,0,-1);
  /* 中序位置：叶从左到右编号，内部节点取子均值 */
  let cx=0;
  (function assign(id){
    const nd=nodes[id];
    if(!nd.children.length){nd.x=cx++;return;}
    for(const c of nd.children)assign(c);
    nd.x=(nodes[nd.children[0]].x+nodes[nd.children[1]].x)/2;
  })(0);
  const leaves=cx,spacing=clamp(30/leaves,0.05,1.0);
  nodeR=clamp(spacing*0.36,0.05,0.3);
  treePos.length=0;
  nodes.forEach(nd=>treePos.push(new THREE.Vector3((nd.x-leaves/2)*spacing,-nd.d*1.0,0)));
  tree={nodes,cut};
  /* 布线 */
  let e=0;
  for(let i=1;i<nodes.length;i++){
    const p=nodes[i].parent,a=treePos[p],b=treePos[i];
    edgePos[e*6]=a.x;edgePos[e*6+1]=a.y;edgePos[e*6+2]=a.z;
    edgePos[e*6+3]=b.x;edgePos[e*6+4]=b.y;edgePos[e*6+5]=b.z;
    e++;
  }
  edgeGeo.setDrawRange(0,e*2);
  edgeGeo.attributes.position.needsUpdate=true;
}
function paintNode(i,c){nodeIM.setColorAt(i,c);}
function paintEdge(i,c){edgeCol[i*6]=c.r;edgeCol[i*6+1]=c.g;edgeCol[i*6+2]=c.b;edgeCol[i*6+3]=c.r;edgeCol[i*6+4]=c.g;edgeCol[i*6+5]=c.b;}
function resetTreePaint(){
  const dummy=new THREE.Object3D();
  tree.nodes.forEach((nd,i)=>{
    dummy.position.copy(treePos[i]);dummy.scale.setScalar(nd.k<=1?nodeR*0.75:nodeR);
    dummy.updateMatrix();nodeIM.setMatrixAt(i,dummy.matrix);
    paintNode(i,C_IDLE);paintEdge(i,E_DIM);
  });
  nodeIM.instanceMatrix.needsUpdate=true;
  nodeIM.instanceColor.needsUpdate=true;
  edgeGeo.attributes.color.needsUpdate=true;
}
function pruneSubtree(id){
  const stack=[...tree.nodes[id].children];
  while(stack.length){
    const i=stack.pop();paintNode(i,C_CUT);paintEdge(i,new THREE.Color(0x1a2028));
    stack.push(...tree.nodes[i].children);
  }
}

/* ============ 事件序列 ============ */
function naiveEvents(){
  /* 建树顺序 = 朴素调用顺序（先左后右） */
  return tree.nodes.map((_,i)=>({t:'calc',id:i}));
}
function memoEvents(){
  const events=[],memo=new Map();
  (function rec(id){
    const nd=tree.nodes[id];
    if(memo.has(nd.k)){events.push({t:'hit',id});return;}
    for(const c of nd.children)rec(c);
    events.push({t:'calc',id});
    memo.set(nd.k,id);
  })(0);
  return events;
}

/* ============ DP 表（fib） ============ */
const tableG=new THREE.Group();scene.add(tableG);
let cellBoxes=[],cellLbls=[];
const boxGeo=new THREE.BoxGeometry(0.52,1,0.52);boxGeo.translate(0,0.5,0);
function buildTable(){
  for(const b of cellBoxes)tableG.remove(b);
  for(const l of cellLbls){l.element.remove();tableG.remove(l);}
  cellBoxes=[];cellLbls=[];
  const sp=0.6,x0=-(n)*sp/2;
  for(let i=0;i<=n;i++){
    const h=0.28+Math.log10(fib(i)+1)*0.34;
    const m=new THREE.Mesh(boxGeo,new THREE.MeshBasicMaterial({transparent:true,opacity:0.9}));
    m.position.set(x0+i*sp,0,3.2);
    m.scale.y=0.001;
    m.material.color.setHSL(0.58-0.5*(i/Math.max(n,1)),0.65,0.55);
    tableG.add(m);cellBoxes.push(m);
    const div=document.createElement('div');div.className='lbl';
    div.textContent='F('+i+')='+fmt(fib(i));
    const o=new CSS2DObject(div);o.position.set(x0+i*sp,h+0.25,3.2);
    tableG.add(o);cellLbls.push(o);
  }
}
/* ============ 背包 DP 表 ============ */
const KN_W=[2,3,4,5,9],KN_V=[3,4,5,8,10],KN_C=10;
const knapG=new THREE.Group();knapG.visible=false;scene.add(knapG);
let knBoxes=[],knChosen=[];
const cellGeo=new THREE.BoxGeometry(0.7,1,0.7);cellGeo.translate(0,0.5,0);
function knapDP(){
  const dp=Array.from({length:KN_W.length+1},()=>new Array(KN_C+1).fill(0));
  for(let i=1;i<=KN_W.length;i++)for(let c=0;c<=KN_C;c++){
    dp[i][c]=dp[i-1][c];
    if(KN_W[i-1]<=c)dp[i][c]=Math.max(dp[i][c],dp[i-1][c-KN_W[i-1]]+KN_V[i-1]);
  }
  return dp;
}
function buildKnap(){
  for(const b of knBoxes)knapG.remove(b);
  knBoxes=[];knChosen=[];
  const dp=knapDP();
  for(let i=0;i<KN_W.length;i++)for(let c=0;c<=KN_C;c++){
    const v=dp[i+1][c],h=0.12+v*0.16;
    const m=new THREE.Mesh(cellGeo,new THREE.MeshBasicMaterial({transparent:true,opacity:0.9}));
    m.position.set((c-KN_C/2)*0.85,0,i*0.9);
    m.scale.y=0.001;
    m.material.color.setHSL(0.09+v/26*0.5,0.7,0.52);
    m.userData={i:i+1,c,v};
    knapG.add(m);knBoxes.push(m);
  }
  /* 行标签：物品重量/价值 */
  const div=document.createElement('div');div.className='lbl b';
  div.textContent=L('容量 0→10','capacity 0→10');
  const o=new CSS2DObject(div);o.position.set(0,2.4,-0.8);knapG.add(o);knChosen.push(o);
  KN_W.forEach((w,i)=>{
    const d2=document.createElement('div');d2.className='lbl';
    d2.textContent=`w${w} v${KN_V[i]}`;
    const o2=new CSS2DObject(d2);o2.position.set(-5.4,0.3,i*0.9);
    knapG.add(o2);knChosen.push(o2);
  });
}
function knapBacktrack(){
  const dp=knapDP();let c=KN_C;const chosen=[];
  for(let i=KN_W.length;i>=1;i--){
    if(dp[i][c]!==dp[i-1][c]){chosen.push(i-1);c-=KN_W[i-1];}
  }
  return chosen;
}

/* ============ 标签 ============ */
const labelReg=[];
let curLbl=null;
function addLabel(textFn,pos,cls='',vis=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis});div.textContent=textFn();return o;
}
function rebuildCurLbl(){
  if(curLbl){curLbl.element.remove();scene.remove(curLbl);const r=labelReg.find(r=>r.o===curLbl);if(r)labelReg.splice(labelReg.indexOf(r),1);}
  curLbl=addLabel(()=>anim.curText||'',new THREE.Vector3(0,4.4,-1),'o',()=>!!anim.curText);
}

/* ============ 模式切换与动画 ============ */
function setMode(m){
  mode=m;
  document.getElementById('mNaive').classList.toggle('on',m==='naive');
  document.getElementById('mMemo').classList.toggle('on',m==='memo');
  document.getElementById('mBottom').classList.toggle('on',m==='bottom');
  document.getElementById('mKnap').classList.toggle('on',m==='knap');
  treeG.visible=m!=='knap';
  knapG.visible=m==='knap';
  tableG.visible=m!=='knap';
  if(m==='knap'){
    buildKnap();
    anim={list:knBoxes.map((b,i)=>({t:'kcell',id:i})),idx:0,curText:'',finished:false};
    knBoxes.forEach(b=>b.scale.y=0.001);
  }else{
    if(!tree||tree.builtFor!==n||!treeG.visible){buildTree();tree.builtFor=n;}
    resetTreePaint();
    anim.curText='';
    if(m==='naive'){anim={list:naiveEvents(),idx:0,curText:'',finished:false};buildTable();}
    else if(m==='memo'){anim={list:memoEvents(),idx:0,curText:'',finished:false};buildTable();}
    else{ /* bottom：只填表，树灰着 */
      anim={list:cellBoxes.map((_,i)=>({t:'bcell',id:i})),idx:0,curText:'',finished:false};
      buildTable();
    }
  }
  rebuildCurLbl();
  updateFormula();
}
function applyEvent(ev){
  if(ev.t==='calc'){
    paintNode(ev.id,C_VIS);
    const p=tree.nodes[ev.id].parent;
    if(p>=0)paintEdge(ev.id,E_ON);
    anim.curText=L(`正在算 fib(${tree.nodes[ev.id].k})`,`computing fib(${tree.nodes[ev.id].k})`);
  }else if(ev.t==='hit'){
    paintNode(ev.id,C_HIT);pruneSubtree(ev.id);
    anim.curText=L(`fib(${tree.nodes[ev.id].k}) 查表命中——整棵子树剪掉`,`fib(${tree.nodes[ev.id].k}) memo hit — subtree pruned`);
  }else if(ev.t==='bcell'){
    const b=cellBoxes[ev.id];
    b.scale.y=0.28+Math.log10(fib(ev.id)+1)*0.34;
    anim.curText=L(`F(${ev.id}) = ${fmt(fib(ev.id))}：只依赖前两格`,`F(${ev.id}) = ${fmt(fib(ev.id))}: only needs the two cells before it`);
  }else if(ev.t==='kcell'){
    const b=knBoxes[ev.id];
    b.scale.y=0.12+b.userData.v*0.16;
    if(ev.id%1===0)anim.curText=L(`dp[${ev.id+1}][${b.userData.c}] = ${b.userData.v}`,`dp[${ev.id+1}][${b.userData.c}] = ${b.userData.v}`);
  }
  if(nodeIM.instanceColor)nodeIM.instanceColor.needsUpdate=true;
  edgeGeo.attributes.color.needsUpdate=true;
}
function finishAnim(){
  if(mode==='knap'){
    /* 回溯：选中的物品行高亮 */
    const chosen=knapBacktrack();
    knBoxes.forEach(b=>{
      if(chosen.includes(b.userData.i-1)){b.material.color.setHSL(0.36,0.75,0.5);b.scale.y=0.3+b.userData.v*0.16;}
    });
    anim.curText=L(`最优解 = ${chosen.map(i=>`w${KN_W[i]}v${KN_V[i]}`).join(' + ')}，总价值 ${knapDP()[KN_W.length][KN_C]}`,
      `optimal = ${chosen.map(i=>`w${KN_W[i]}v${KN_V[i]}`).join(' + ')} · total ${knapDP()[KN_W.length][KN_C]}`);
  }
}

/* ============ 统计 / 公式 / 步骤 ============ */
const modeZh={naive:'朴素递归',memo:'记忆化',bottom:'自底向上',knap:'0-1 背包'};
const modeEn={naive:'naive',memo:'memoized',bottom:'bottom-up',knap:'knapsack'};
const target=()=>mode==='naive'?naiveCalls(n):mode==='memo'?2*n-1:mode==='bottom'?n-1:knBoxes.length;
const elM=document.getElementById('stMode'),elN=document.getElementById('stN'),
      elC=document.getElementById('stCnt'),elR=document.getElementById('stRatio');
function updateStats(){
  const frac=clamp(anim.idx/Math.max(anim.list.length,1),0,1);
  elM.textContent=L(modeZh[mode],modeEn[mode]);
  elN.innerHTML=n+'<small>'+(tree&&tree.cut&&mode!=='knap'?L(' · 树截断显示',' · tree truncated'):'')+'</small>';
  elC.innerHTML=fmt(frac*target())+'<small> / '+fmt(target())+'</small>';
  elR.innerHTML=fmt(naiveCalls(n))+' <small>×</small> '+(2*n-1);
}
const formulaEl=document.getElementById('formula');
function updateFormula(){
  formulaEl.innerHTML=L(
    `朴素调用 = 2F(n+1)−1 = <b>${fmt(naiveCalls(n))}</b> 次（估算 ${(naiveCalls(n)*2e-8).toFixed(2)} s）· `+
    `记忆化 = <b>${2*n-1}</b> 次 · 自底向上 = <b>${n-1}</b> 次加法<br>适用判据：<b>最优子结构 + 重叠子问题</b>`,
    `naive = 2F(n+1)−1 = <b>${fmt(naiveCalls(n))}</b> calls (~${(naiveCalls(n)*2e-8).toFixed(2)} s) · `+
    `memoized = <b>${2*n-1}</b> · bottom-up = <b>${n-1}</b> adds<br>applies when: <b>optimal substructure + overlapping subproblems</b>`);
}
const STEPS=[
  {zh:'朴素递归：fib(n)=fib(n−1)+fib(n−2)，一次调用裂成两个',en:'Naive recursion: one call splits into two — a binary explosion',
   act:()=>{setMode('naive');playing=true;}},
  {zh:'调用树指数爆炸：fib(35) 要调用 29,860,703 次',en:'Exponential blow-up: fib(35) makes 29,860,703 calls',
   act:()=>{n=35;document.getElementById('sN').value=35;document.getElementById('sNVal').textContent='35';rebuildAll();setMode('naive');playing=true;}},
  {zh:'病根是重叠子问题：fib(7) 这样的小块头被重算千万次',en:'The disease: overlapping subproblems — fib(7) recomputed millions of times',
   act:()=>{n=12;document.getElementById('sN').value=12;document.getElementById('sNVal').textContent='12';rebuildAll();setMode('naive');playing=true;}},
  {zh:'记忆化：算过的存进表，再遇到直接查 → O(n)',en:'Memoization: store each answer, look it up ever after → O(n)',
   act:()=>{setMode('memo');playing=true;}},
  {zh:'剪枝：查表命中的瞬间，整棵灰子树再也不用走',en:'Pruning: on a cache hit the whole gray subtree is skipped',
   act:()=>{setMode('memo');playing=true;}},
  {zh:'自底向上：从 F(0) 填到 F(n)，连递归栈都省了',en:'Bottom-up: fill F(0)…F(n) — no recursion stack at all',
   act:()=>{setMode('bottom');playing=true;}},
  {zh:'同一招解背包：dp[i][c]=max(不装, 装)——逐格填表再回溯',en:'Same trick for knapsack: dp[i][c]=max(skip, take) — fill then backtrack',
   act:()=>{setMode('knap');playing=true;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.zh,s.en)}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ============ UI ============ */
function rebuildAll(){buildTree();tree.builtFor=n;buildTable();}
document.getElementById('mNaive').addEventListener('click',()=>{setMode('naive');playing=true;});
document.getElementById('mMemo').addEventListener('click',()=>{setMode('memo');playing=true;});
document.getElementById('mBottom').addEventListener('click',()=>{setMode('bottom');playing=true;});
document.getElementById('mKnap').addEventListener('click',()=>{setMode('knap');playing=true;});
document.getElementById('btnRerun').addEventListener('click',()=>{setMode(mode);playing=true;});
document.getElementById('btnN35').addEventListener('click',()=>{
  n=35;document.getElementById('sN').value=35;document.getElementById('sNVal').textContent='35';
  rebuildAll();setMode('naive');playing=true;
});
document.getElementById('sN').addEventListener('input',e=>{
  n=+e.target.value;document.getElementById('sNVal').textContent=n;
  rebuildAll();setMode(mode);
});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
});
const playBtn=document.getElementById('play');
playBtn.addEventListener('click',()=>{playing=!playing;playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playBtn.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x0f1113:0xf1efec);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps();updateFormula();
  if(knapG.visible)buildKnap();
  cellLbls.forEach((o,i)=>{o.element.textContent='F('+i+')='+fmt(fib(i));});
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0,lastIdx=-1;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing&&anim.list.length){
    anim.idx=Math.min(anim.idx+dt*speedK*22,anim.list.length);
    const upto=Math.floor(anim.idx);
    while(lastIdx<upto-1&&lastIdx<anim.list.length-1){lastIdx++;applyEvent(anim.list[lastIdx]);}
    if(upto>=anim.list.length&&!anim.finished){
      anim.finished=true;
      while(lastIdx<anim.list.length-1){lastIdx++;applyEvent(anim.list[lastIdx]);}
      finishAnim();
    }
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  for(const l of cellLbls)l.visible=labelsOn;
  for(const l of knChosen)l.visible=labelsOn;
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ============ 初始化 ============ */
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(qs.get('speed')){document.getElementById('sSpd').value=qs.get('speed');speedK=+qs.get('speed')/100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';}
const qsN=parseInt(qs.get('n'));if(qsN>=5&&qsN<=35){n=qsN;document.getElementById('sN').value=n;document.getElementById('sNVal').textContent=n;}
applyTheme();applyLang();rebuildAll();setMode('naive');start();
</script>
</body>
</html>
