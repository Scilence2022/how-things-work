<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 打印 · 把模型切成一叠纸再摞起来</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff8787;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#f0efed; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,135,135,.6); background: rgba(255,135,135,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(201,42,42,.55); background: rgba(201,42,42,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,135,135,.10); border-color: rgba(255,135,135,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="3D 打印:把模型切成一叠纸,再一层层摞起来" data-en="3D Printing: Slicing a Model into Sheets, Stacking Them Back">3D 打印:把模型切成一叠纸,再一层层摞起来</h1>
  <div class="sub" data-zh="切片软件把模型拆成一层层 2D 轮廓;喷嘴把 200 °C 的 PLA 沿轮廓+zigzag 填充铺成丝,冷却定型——上一层就是下一层的打印平台;悬挑超过 45° 没东西可踩,要么加支撑要么重新摆 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A slicer cuts the model into 2D outlines; a 200 °C nozzle lays PLA as perimeter + zigzag infill that sets as it cools — each layer is the build platform for the next; overhangs past 45° have nothing to stand on: add supports or reorient · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">切片软件把模型拆成一层层 2D 轮廓;喷嘴把 200 °C 的 PLA 沿轮廓+zigzag 填充铺成丝,冷却定型——上一层就是下一层的打印平台;悬挑超过 45° 没东西可踩,要么加支撑要么重新摆 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="层号" data-en="Layer">层号</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="打印头" data-en="Head">打印头</span><span class="v" id="stH">—</span>
  <span class="k" data-zh="耗材" data-en="Filament">耗材</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="层高 / 填充" data-en="Layer / infill">层高 / 填充</span><span class="v" id="stS">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v ok" id="stT">—</span>
</div>

<div id="plot">
  <h3 data-zh="切片预览:当前层轮廓(橙)+ 填充线(细)+ 打印头位置(点)" data-en="Slicer preview: current layer perimeter (orange) + infill lines + head position (dot)">切片预览:当前层轮廓(橙)+ 填充线(细)+ 打印头位置(点)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="挤出丝" data-en="extruded strand">挤出丝</span>
    <span class="chip.r" data-zh="悬挑下垂(失败)" data-en="sagging overhang">悬挑下垂(失败)</span>
    <span class="chip.b" data-zh="支撑格" data-en="supports">支撑格</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnSupport" data-zh="支撑:开(球头下沿)" data-en="supports: ON (under the ball)">支撑:开(球头下沿)</button>
    <button class="abtn" id="btnBreak" data-zh="掰掉支撑(完成后)" data-en="snap supports off (when done)">掰掉支撑(完成后)</button>
    <button class="abtn" id="btnRedo" data-zh="重新打印" data-en="print again">重新打印</button>
  </div>
  <div class="row"><label data-zh="层高" data-en="Layer height">层高</label><input id="lh" type="range" min="0" max="2" step="1" value="1"><span class="val" id="lhVal">0.2 mm</span></div>
  <div class="row"><label data-zh="填充密度" data-en="Infill">填充密度</label><input id="infill" type="range" min="10" max="40" step="5" value="20"><span class="val" id="infillVal">20%</span></div>
  <div class="row"><label data-zh="打印速度" data-en="Print speed">打印速度</label><input id="pspd" type="range" min="30" max="150" step="10" value="80"><span class="val" id="pspdVal">80 mm/s</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="切片" data-en="Slicer">切片</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../phase-transition/" data-zh="熔化与凝固" data-en="melt & solidify">熔化与凝固</a>
    <a href="../crystal-growth/" data-zh="另一种逐层生长" data-en="another layer-by-layer">另一种逐层生长</a>
    <a href="../ball-screw/" data-zh="Z 轴滚珠丝杠" data-en="the Z ball-screw">Z 轴滚珠丝杠</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xf0efed : 0x0f1013);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('3D 打印 · 把模型切成一叠纸再摞起来', '3D Printing · Slicing a Model into Sheets');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setToggleBtns();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.6, 1.9, 3.1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.6;
controls.maxDistance = 14;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(3, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const ground = new THREE.Mesh(new THREE.CylinderGeometry(7, 7.4, 0.12, 48),
  mat(0x23262c, { roughness: 0.95, emissive: 0x000000, opacity: 1 }));
ground.position.y = -0.5;
scene.add(ground);

/* ================= 打印机框架 ================= */
const frameMat = mat(0x2f3640, { roughness: 0.55, metalness: 0.4, opacity: 1 });
const railMat = mat(0x9aa8b5, { roughness: 0.3, metalness: 0.8, opacity: 1 });
const FW = 1.5, FH = 2.1;                     // 半宽与高
for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.09, FH, 0.09), frameMat);
  post.position.set(sx * FW, FH / 2 - 0.42, sz * FW);
  scene.add(post);
}
for (const y of [FH - 0.42, -0.42]) {
  for (const rot of [0, Math.PI / 2]) {
    const beam = new THREE.Mesh(new THREE.BoxGeometry(FW * 2 + 0.09, 0.07, 0.07), frameMat);
    beam.position.y = y;
    beam.rotation.y = rot;
    scene.add(beam);
  }
}
/* 热床 */
const bed = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.06, 1.9), mat(0x1d2126, { roughness: 0.4, opacity: 1 }));
bed.position.y = -0.36;
scene.add(bed);
const bedSurf = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.012, 1.7), mat(0x2c3440, { roughness: 0.85, opacity: 1 }));
bedSurf.position.y = -0.325;
scene.add(bedSurf);
const PLATE_Y = -0.32;

/* 龙门(X 梁 + 打印头) */
const gantry = new THREE.Group();
scene.add(gantry);
const xbeam = new THREE.Mesh(new THREE.BoxGeometry(FW * 2, 0.08, 0.08), railMat);
gantry.add(xbeam);
for (const sz of [-1, 1]) {
  const ycar = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 0.12), frameMat);
  ycar.position.set(0, 0, sz * FW);
  gantry.add(ycar);
}
const headG = new THREE.Group();
gantry.add(headG);
const headBody = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.2, 0.15), mat(0x37414c, { roughness: 0.5, opacity: 1 }));
headBody.position.y = 0.1;
headG.add(headBody);
const fanFace = new THREE.Mesh(new THREE.CircleGeometry(0.05, 16), mat(0x1d2126, { opacity: 1 }));
fanFace.rotation.x = Math.PI / 2;

/* ================= 模型定义:棋子(锥身+球头,自带悬挑教学) ================= */
const OBJ_H = 1.16;
function profRadius(y) {
  if (y < 0.26) return 0.5;
  if (y < 0.62) return lerp(0.5, 0.15, (y - 0.26) / 0.36);   // 锥身:每层都比下层小,安全
  if (y < 0.72) return 0.15;                                  // 颈
  const t = 0.22 * 0.22 - (y - 0.94) * (y - 0.94);            // 球头:下沿半径越涨越快
  return t > 0 ? Math.max(Math.sqrt(t), 0.02) : 0;
}
const LH_OPTS = [0.1, 0.2, 0.3];
const LH_LAYERS = [90, 60, 40];
let lhIdx = clamp(Math.round(qsFloat('lh', 1)), 0, 2);
let infillPct = clamp(qsFloat('infill', 20), 10, 40);
let printSpd = clamp(qsFloat('pspd', 80), 30, 150);
let supportOn = qsBool('support', true);
let layerCount = LH_LAYERS[lhIdx];                            // 层高→层数(视觉标定)
const layerY = i => (i + 1) / layerCount * OBJ_H;
function overhangOK(i) {                                     // 该层外悬是否 ≤45°
  if (i === 0) return true;
  const r1 = profRadius(layerY(i)), r0 = profRadius(layerY(i - 1));
  if (r1 <= r0 + 1e-6) return true;                          // 收缩/等径:坐得稳
  return (r1 - r0) <= OBJ_H / layerCount;                    // 外扩量 ≤ 层高 ≈ 45°
}
let overhangFrom = -1;
function computeOverhang() {
  overhangFrom = -1;
  for (let i = 0; i < layerCount; i++) if (!overhangOK(i)) { overhangFrom = i; break; }
}

/* ================= 已打印部分(逐层构建) ================= */
const printG = new THREE.Group();
scene.add(printG);
const strandMatP = mat(0xff9f43, { roughness: 0.5, opacity: 1 });
const strandMatI = mat(0xffb763, { roughness: 0.6, opacity: 1 });
const strandMatSag = new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.7, emissive: 0x5a1212, emissiveIntensity: 0.5, transparent: true, opacity: 1 });
const INF_MAX = 2600;
const infillIM = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.02, 0.036), strandMatI, INF_MAX);
infillIM.count = 0;
infillIM.frustumCulled = false;
printG.add(infillIM);
let layersBuilt = [];                 // {tube, pts, cum, total, perimLen, infill:[{start,len,zc,xc,halfW,idx}]}
let infillUsed = 0;
function buildLayer(i) {
  const y = PLATE_Y + layerY(i);
  const r = profRadius(layerY(i));
  const sagF = (!supportOn && i >= overhangFrom && overhangFrom >= 0)
    ? clamp((layerY(overhangFrom) + 0.05 - layerY(i)) / 0.05 + 1, 0, 1) * 0.045 : 0;
  const n = 44;
  const pts = [];
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2;
    const sag = sagF > 0 ? sagF * (0.6 + 0.4 * Math.sin(a * 3)) : 0;
    pts.push(new THREE.Vector3(Math.cos(a) * r, y - sag, Math.sin(a) * r));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true);
  const matP = sagF > 0 ? strandMatSag : strandMatP;
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.014 + LH_OPTS[lhIdx] * 0.01, 6, true), matP);
  tube.geometry.setDrawRange(0, 0);
  printG.add(tube);
  /* 填充线(zigzag,沿 x 扫,间隔 dz) */
  const spacing = lerp(0.17, 0.055, (infillPct - 10) / 30);
  const infill = [];
  let s = 2 * Math.PI * r;
  const nLines = Math.max(1, Math.floor(2 * r / spacing));
  for (let k = 0; k < nLines && infillUsed < INF_MAX; k++) {
    const zc = -r + spacing / 2 + k * spacing;
    if (Math.abs(zc) >= r) break;
    const halfW = Math.sqrt(Math.max(r * r - zc * zc, 0)) - 0.02;
    if (halfW <= 0.02) continue;
    const len = halfW * 2;
    const m = new THREE.Matrix4().compose(
      new THREE.Vector3(0, y, zc), new THREE.Quaternion(), new THREE.Vector3(0.001, 1, 1));
    infillIM.setMatrixAt(infillUsed, m);
    infill.push({ start: s, len, zc, halfW, idx: infillUsed });
    infillUsed++;
    s += len;
  }
  infillIM.count = infillUsed;
  infillIM.instanceMatrix.needsUpdate = true;
  /* 弧长表 */
  const perimPts = curve.getPoints(120);
  const cum = [0];
  for (let k = 1; k < perimPts.length; k++) cum.push(cum[k - 1] + perimPts[k].distanceTo(perimPts[k - 1]));
  const total = 2 * Math.PI * r + infill.reduce((a, f) => a + f.len, 0);
  layersBuilt[i] = { tube, pts, cum, perimLen: 2 * Math.PI * r, infill, total };
}
/* 支撑格 */
let supportG = new THREE.Group();
scene.add(supportG);
function buildSupports() {
  supportG.clear();
  if (!supportOn || overhangFrom < 0) return;
  const y0 = PLATE_Y + layerY(Math.max(0, overhangFrom - Math.round(2 / (LH_OPTS[lhIdx] / 100 * 55))));
  const y1 = PLATE_Y + layerY(overhangFrom);
  const m = mat(0xf2c14e, { roughness: 0.6, opacity: 0.95 });
  for (let k = 0; k < 8; k++) {
    const a = k / 8 * Math.PI * 2 + 0.2;
    const rr = profRadius(layerY(overhangFrom)) - 0.035;
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.02, y1 - y0, 0.02), m);
    col.position.set(Math.cos(a) * (rr + 0.02), (y0 + y1) / 2, Math.sin(a) * (rr + 0.02));
    supportG.add(col);
    const cross = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.016, (rr + 0.02) * 2), m);
    cross.position.set(0, y0 + (y1 - y0) * (k % 2 ? 0.35 : 0.7), 0);
    cross.rotation.y = -a;
    supportG.add(cross);
  }
}

let headJitter = 0;
const MM_PER_UNIT = 50;                        // 场景 1 单位 ≈ 50 mm(棋子高 55 mm)

function pathPointAt(i, s, out) {
  const L = layersBuilt[i];
  if (s <= L.perimLen) {                       // 沿圆周
    const frac = s / L.perimLen;
    const idx = frac * (L.pts.length - 1);
    const i0 = Math.floor(idx) % L.pts.length, i1 = (i0 + 1) % L.pts.length;
    out.lerpVectors(L.pts[i0], L.pts[i1], idx - Math.floor(idx));
    return 'perim';
  }
  let rem = s - L.perimLen;
  for (const f of L.infill) {
    if (rem <= f.len) {
      out.set(lerp(-f.halfW, f.halfW, rem / f.len), PLATE_Y + layerY(i), f.zc);
      return 'infill';
    }
    rem -= f.len;
  }
  out.set(0, PLATE_Y + layerY(i), 0);
  return 'infill';
}

function resetPrint() {
  for (const l of layersBuilt) if (l && l.tube) { printG.remove(l.tube); l.tube.geometry.dispose(); }
  layersBuilt = [];
  infillUsed = 0;
  infillIM.count = 0;
  curLayer = 0; curS = 0; printedMm = 0; done = false;
  supportsOff = false;
  computeOverhang();
  buildSupports();
  buildLayer(0);
}

function stepIndex() {
  if (!supportOn && overhangFrom >= 0 && layerY(curLayer) > layerY(Math.max(0, overhangFrom))) return 4;
  if (infillPct >= 40 && curLayer < 3) return 3;
  if (lhIdx === 0 && curLayer < 3) return 5;
  if (done) return 4;
  if (curLayer > layerCount * 0.35) return 2;
  if (curLayer > 1) return 1;
  return 0;
}

/* ================= 曲线图(切片预览) ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 16;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const cx = W / 2, cy = H / 2, sc = Math.min(W, H) / 2 - pad;
  const i = Math.min(curLayer, layerCount - 1);
  const r = profRadius(layerY(i));
  /* 外框=热床 */
  ctx.strokeStyle = cTxt; ctx.lineWidth = 1.5;
  ctx.strokeRect(cx - sc, cy - sc, sc * 2, sc * 2);
  /* 轮廓 */
  ctx.strokeStyle = '#ffa94d'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r / 0.6 * sc, 0, Math.PI * 2);
  ctx.stroke();
  /* 填充线 */
  const spacing = lerp(0.17, 0.055, (infillPct - 10) / 30);
  ctx.strokeStyle = 'rgba(255,169,77,.45)'; ctx.lineWidth = 1.6;
  const nL = Math.max(1, Math.floor(2 * r / spacing));
  for (let k = 0; k < nL; k++) {
    const zc = -r + spacing / 2 + k * spacing;
    if (Math.abs(zc) >= r) break;
    const hw = Math.sqrt(Math.max(r * r - zc * zc, 0));
    ctx.beginPath();
    ctx.moveTo(cx - hw / 0.6 * sc, cy + zc / 0.6 * sc);
    ctx.lineTo(cx + hw / 0.6 * sc, cy + zc / 0.6 * sc);
    ctx.stroke();
  }
  /* 打印头位置 */
  if (layersBuilt[i]) {
    const p = pathPointAt(i, Math.min(curS, layersBuilt[i].total - 0.001), new THREE.Vector3());
    ctx.fillStyle = '#69db7c';
    ctx.beginPath(); ctx.arc(cx + p.x / 0.6 * sc, cy + p.z / 0.6 * sc, 6, 0, Math.PI * 2); ctx.fill();
  }
  /* 悬挑警示 */
  if (!overhangOK(i)) {
    ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 16px system-ui';
    ctx.fillText(L('悬挑 >45°', 'overhang >45°'), cx - 44, pad + 20);
  }
  ctx.fillStyle = cTxt; ctx.font = '15px system-ui';
  ctx.fillText(`r = ${(r * MM_PER_UNIT).toFixed(1)} mm`, pad, H - 8);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
const tmpV = new THREE.Vector3();
const _m = new THREE.Matrix4(), _v = new THREE.Vector3(), _s = new THREE.Vector3(), _q = new THREE.Quaternion();
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05) * (playing ? speed : 0);
  /* 打印推进 */
  if (!done && playing) {
    const mmPerS = printSpd / MM_PER_UNIT;                 // 场景单位/s(视觉×速度档)
    curS += mmPerS * dt * 6;
    printedMm += mmPerS * dt * 6 * MM_PER_UNIT;
    const Lc = layersBuilt[curLayer];
    if (Lc) {
      /* 轮廓逐步显示 */
      Lc.tube.geometry.setDrawRange(0, Math.floor(clamp(curS / Lc.perimLen, 0, 1) * 64) * 36);
      /* 填充线逐条出现(从左往右拉出) */
      for (const f of Lc.infill) {
        const frac = clamp((curS - f.start) / f.len, 0, 1);
        const sx = Math.max(frac * f.len, 0.001);
        _m.compose(_v.set(-f.halfW + sx / 2, PLATE_Y + layerY(curLayer), f.zc), _q.identity(), _s.set(sx, 1, 1));
        infillIM.setMatrixAt(f.idx, _m);
      }
      infillIM.instanceMatrix.needsUpdate = true;
    }
    if (curS >= (Lc ? Lc.total : 0)) {
      curLayer++;
      curS = 0;
      if (curLayer >= layerCount) { done = true; curLayer = layerCount - 1; setToggleBtns(); }
      else if (!layersBuilt[curLayer]) buildLayer(curLayer);
    }
    /* 打印头与龙门 */
    const li = Math.min(curLayer, layerCount - 1);
    if (layersBuilt[li]) {
      pathPointAt(li, Math.min(curS, layersBuilt[li].total - 0.001), tmpV);
      headG.position.set(tmpV.x, 0, tmpV.z);
      gantry.position.y = PLATE_Y + layerY(li) + 0.34;
      gantry.position.z = tmpV.z * 0.35;
    }
    nozzleGlow.material.opacity = 0.7 + Math.sin(performance.now() * 0.02) * 0.2;
  }
  statsAcc += dt;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stL.textContent = `${Math.min(curLayer + 1, layerCount)} / ${layerCount}`;
    stH.textContent = `${(headG.position.x * MM_PER_UNIT).toFixed(0)}, ${(headG.position.z * MM_PER_UNIT).toFixed(0)} mm`;
    stF.textContent = (printedMm / 1000).toFixed(2) + ' m';
    stS.textContent = `${LH_OPTS[lhIdx].toFixed(1)} / ${infillPct}%`;
    const overNow = !overhangOK(Math.min(curLayer, layerCount - 1));
    stT.textContent = done ? (supportOn && !supportsOff ? L('完成(带支撑)', 'done (with supports)') : L('完成 ✓', 'done ✓'))
      : overNow && !supportOn ? L('悬挑失败 ⚠', 'overhang failed ⚠') : L('打印中', 'printing');
    stT.className = 'v ' + (done ? 'ok' : overNow && !supportOn ? 'bad' : '');
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
layerCount = LH_LAYERS[lhIdx];
supportOn = qsBool('support', true);
infillPct = clamp(qsFloat('infill', 20), 10, 40);
lhIdx = clamp(Math.round(qsFloat('lh', 1)), 0, 2);
syncSliders();
setToggleBtns();
applyTheme();
applyLang();
resetPrint();
setPlayLabel();
start();
</script>
