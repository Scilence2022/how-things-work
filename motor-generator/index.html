<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直流电动机 ⇄ 发电机 · 同一台机器的两种身份</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e0913f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b06a1f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--cv-text); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.n   { border-color: rgba(255,93,93,.9);  color: #ffc2c2; }
  .lbl.s   { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.co  { border-color: rgba(203,174,232,.9); color: #ecd5ff; }
  .lbl.e   { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.g   { border-color: rgba(67,209,124,.9);  color: #c9f3da; font-size: 13px; padding: 6px 11px; }
  .lbl.f   { border-color: rgba(255,159,28,.9);  color: #ffd9a3; }
  :root[data-theme="light"] .lbl.n   { border-color: rgba(200,60,60,.9);  color: #b83232; }
  :root[data-theme="light"] .lbl.s   { border-color: rgba(12,123,166,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.co  { border-color: rgba(130,60,190,.9); color: #7a2fb0; }
  :root[data-theme="light"] .lbl.e   { border-color: rgba(178,128,20,.9); color: #9c6f00; }
  :root[data-theme="light"] .lbl.g   { border-color: rgba(71,112,31,.9);  color: #3f6d1c; }
  :root[data-theme="light"] .lbl.f   { border-color: rgba(156,95,0,.9);   color: #9c5f00; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.n  { color: #ffc2c2; border-color: rgba(255,93,93,.7); }
  .chip.s  { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  .chip.co { color: #ecd5ff; border-color: rgba(203,174,232,.7); }
  .chip.e  { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.n  { color: #b83232; border-color: rgba(200,60,60,.7); }
  :root[data-theme="light"] .chip.s  { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.co { color: #7a2fb0; border-color: rgba(130,60,190,.7); }
  :root[data-theme="light"] .chip.e  { color: #9c6f00; border-color: rgba(178,128,20,.7); }

  #modeRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  #modeRow .brl { font-size: 12px; color: var(--text2); flex: 0 0 auto; align-self: center; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(224,145,63,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(176,106,31,.10); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(224,145,63,.10); border-color: rgba(224,145,63,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,106,31,.10); border-color: rgba(176,106,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffd9b0; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

  }
}
</script>

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="直流电动机 ⇄ 发电机：同一台机器的两种身份" data-en="DC motor ⇄ generator: one machine, two identities">直流电动机 ⇄ 发电机：同一台机器的两种身份</h1>
  <div class="sub" data-zh="通电受力转起来(电→动)/ 外力拖动切磁感线发电(动→电)——换向器每过中性面把电流翻个身 · 空格播放/暂停" data-en="Feed it current and it spins (electric→motion); crank it through the field and it lights the lamp (motion→electric) — the commutator flips the current every neutral crossing · Space = play/pause">通电受力转起来(电→动)/ 外力拖动切磁感线发电(动→电)——换向器每过中性面把电流翻个身 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip n" data-zh="N 磁极" data-en="N pole">N 磁极</span>
    <span class="chip s" data-zh="S 磁极" data-en="S pole">S 磁极</span>
    <span class="chip co" data-zh="线圈 + 换向器" data-en="coil + commutator">线圈 + 换向器</span>
    <span class="chip e" data-zh="能量流" data-en="energy flow">能量流</span>
  </div>
  <div id="modeRow">
    <span class="brl" data-zh="身份：" data-en="Role:">身份：</span>
    <button id="btnMotor" class="bon on"><b data-zh="电动机 · 电 → 动" data-en="Motor · electric → motion">电动机 · 电 → 动</b><i data-zh="电池喂电流，安培力推转子" data-en="battery feeds current, Lorentz force spins it">电池喂电流，安培力推转子</i></button>
    <button id="btnGen" class="bon"><b data-zh="发电机 · 动 → 电" data-en="Generator · motion → electric">发电机 · 动 → 电</b><i data-zh="摇把拖动切割磁感线，点亮灯泡" data-en="crank it through the field, light the lamp">摇把拖动切割磁感线，点亮灯泡</i></button>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglForce" type="checkbox" checked> <span data-zh="受力/电流箭头" data-en="Force/current arrows">受力/电流箭头</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
let mode = qs.get('mode') === 'gen' ? 'gen' : 'motor';

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.base.color.set(THEME === 'light' ? 0xb9c2cf : 0x3a414d);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('直流电动机 ⇄ 发电机 · 两种身份', 'DC Motor ⇄ Generator · Two Identities');
  buildSteps();
  setPlayLabel();
  refreshStaticLabels();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(8.2, 5.6, 9.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 26;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(5, 8, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  base: mat(0x3a414d, { roughness: 0.7 }),
  magnetN: mat(0xff5d5d, { roughness: 0.4 }),
  magnetS: mat(0x4cc9f0, { roughness: 0.4 }),
  shaft: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  coil: mat(0xcb6ce5, { roughness: 0.35 }),
  commA: mat(0xd8956a, { metalness: 0.6, roughness: 0.3 }),
  commB: mat(0x6b4a2f, { metalness: 0.6, roughness: 0.3 }),
  brush: mat(0x30363f, { roughness: 0.6 }),
  battery: mat(0x90be6d, { roughness: 0.4 }),
  lamp: mat(0xfff2cc, { emissive: 0xffd166, emissiveIntensity: 0.05, roughness: 0.3 }),
  lampGlow: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.0, depthWrite: false }),
  wireBat: mat(0x90be6d, { roughness: 0.4 }),
  wireLamp: mat(0xffd166, { roughness: 0.4 }),
  dot: new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.95 }),
  arrow: new THREE.MeshBasicMaterial({ color: 0xff9f28, transparent: true, opacity: 0.95 }),
  crank: mat(0x90be6d, { metalness: 0.4, roughness: 0.3 }),
};

/* ---------------- 静态场景 ---------------- */
const CY = 2.6;
function buildStatic() {
  const base = new THREE.Mesh(new THREE.BoxGeometry(7.8, 0.5, 3.4), M.base);
  base.position.set(0, 0.25, -0.2);
  scene.add(base);
  for (const sx of [-2.35, 2.35]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.5, 0.55), M.base);
    b.position.set(sx, 1.35, -1.35);
    scene.add(b);
  }
  const mN = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3.0, 2.7), M.magnetN);
  mN.position.set(-2.95, CY, 0.15);
  scene.add(mN);
  const mS = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3.0, 2.7), M.magnetS);
  mS.position.set(2.95, CY, 0.15);
  scene.add(mS);
  // 磁场虚线(N → S)
  for (const dy of [-0.75, 0, 0.75]) {
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-2.55, CY + dy, 0.3), new THREE.Vector3(2.55, CY + dy, 0.3)]);
    const l = new THREE.Line(g, new THREE.LineDashedMaterial({ color: 0x8b97a8, dashSize: 0.16, gapSize: 0.12, transparent: true, opacity: 0.5 }));
    l.computeLineDistances();
    scene.add(l);
  }
  // 电池
  const bat = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.9, 0.95), M.battery);
  bat.position.set(-5.6, 0.95, 1.7);
  scene.add(bat);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.3, 0.5), M.shaft);
  cap.position.set(-5.6 + 0.72, 1.45, 1.7);
  scene.add(cap);
  // 灯泡
  const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.55, 0.5, 20), M.base);
  lampBase.position.set(5.6, 0.75, 1.7);
  scene.add(lampBase);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.52, 28, 22), M.lamp);
  bulb.position.set(5.6, 1.62, 1.7);
  scene.add(bulb);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.86, 24, 18), M.lampGlow);
  halo.position.copy(bulb.position);
  scene.add(halo);
  // 电刷
  for (const sx of [-0.62, 0.62]) {
    const br = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.5), M.brush);
    br.position.set(sx, CY, -1.35);
    scene.add(br);
  }
  // 检流计
  const gbox = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.1, 0.3), M.base);
  gbox.position.set(6.7, 2.6, -0.6);
  gbox.rotation.y = -0.35;
  scene.add(gbox);
  return { bulb, halo, gbox };
}

/* ---------------- 转子(线圈 + 换向器 + 摇把) ---------------- */
const rotor = new THREE.Group();
rotor.position.set(0, CY, 0);
scene.add(rotor);
function buildRotor() {
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 5.2, 16), M.shaft);
  shaft.rotation.x = Math.PI / 2;
  rotor.add(shaft);
  // 矩形线圈(3 匝嵌套)
  const pts = [];
  const a = 1.5, b = 1.05, r = 0.22;
  const corner = (cx, cy, a0, a1) => {
    for (let k = 0; k <= 6; k++) {
      const ang = a0 + (a1 - a0) * k / 6;
      pts.push(new THREE.Vector3(cx + r * Math.cos(ang), cy + r * Math.sin(ang), 0));
    }
  };
  corner(a - r, b - r, 0, Math.PI / 2);
  corner(-a + r, b - r, Math.PI / 2, Math.PI);
  corner(-a + r, -b + r, Math.PI, Math.PI * 1.5);
  corner(a - r, -b + r, Math.PI * 1.5, Math.PI * 2);
  for (const s of [1.0, 0.84, 0.68]) {
    const scaled = pts.map(p => new THREE.Vector3(p.x * s, p.y * s, 0.3 + (s - 1) * 0.06));
    const curve = new THREE.CatmullRomCurve3(scaled, true);
    rotor.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.045, 8, true), M.coil));
  }
  // 换向器:两个半环
  for (const [start, m] of [[-Math.PI / 2 + 0.07, M.commA], [Math.PI / 2 + 0.07, M.commB]]) {
    const half = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.52, 24, 1, false, start, Math.PI - 0.14), m);
    half.rotation.x = Math.PI / 2;
    half.position.z = -1.35;
    rotor.add(half);
  }
  // 摇把(发电模式可见)
  const crank = new THREE.Group();
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.9, 10), M.crank);
  arm.rotation.x = Math.PI / 2; arm.position.z = 0.45;
  crank.add(arm);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.7, 10), M.crank);
  handle.rotation.x = Math.PI / 2; handle.position.set(0, 0, 0.85);
  crank.add(handle);
  crank.position.z = 1.9;
  crank.name = 'crank';
  rotor.add(crank);
}

/* ---------------- 导线(样条管) ---------------- */
function tube(points, m, r = 0.045) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, r, 8, false), m);
  scene.add(mesh);
  return { mesh, curve };
}
let wireBat1, wireBat2, wireLamp1, wireLamp2;
function buildWires() {
  wireBat1 = tube([new THREE.Vector3(-5.0, 1.45, 1.7), new THREE.Vector3(-3.6, 3.2, 1.8),
    new THREE.Vector3(-1.6, 3.3, -1.35), new THREE.Vector3(-0.62, CY, -1.35)], M.wireBat);
  wireBat2 = tube([new THREE.Vector3(0.62, CY, -1.35), new THREE.Vector3(1.8, 3.4, 0.4),
    new THREE.Vector3(-4.2, 2.2, 2.4), new THREE.Vector3(-5.0, 0.95, 1.7)], M.wireBat);
  wireLamp1 = tube([new THREE.Vector3(-0.62, CY, -1.35), new THREE.Vector3(-2.2, 3.6, 1.6),
    new THREE.Vector3(3.4, 3.8, 2.0), new THREE.Vector3(5.35, 1.85, 1.7)], M.wireLamp);
  wireLamp2 = tube([new THREE.Vector3(0.62, CY, -1.35), new THREE.Vector3(2.4, 3.0, -0.6),
    new THREE.Vector3(5.6, 2.4, 0.4), new THREE.Vector3(5.6, 1.05, 1.25)], M.wireLamp);
}

/* ---------------- 标签 ---------------- */
const labelObjs = [];
function addLabel(html, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.innerHTML = html;
  const o = new CSS2DObject(div);

let lblEnergy, lblNeutral, lblParts = [];
function buildLabels() {
  lblEnergy = addLabel('', new THREE.Vector3(0, 5.6, 0.3), 'g');
  lblNeutral = addLabel(L('中性面:换向!', 'neutral: flip!'), new THREE.Vector3(0, CY + 1.75, -1.35), 'f');
  lblNeutral.element.style.opacity = 0;
  lblParts = [
    addLabel(L('N', 'N'), new THREE.Vector3(-2.95, CY + 1.75, 0.15), 'n'),

    addLabel(L('线圈(3 匝)', 'coil (3 turns)'), new THREE.Vector3(-1.7, 0.6, 0.3), 'co'),
    addLabel(L('换向器', 'commutator'), new THREE.Vector3(0, CY - 1.35, -1.35), 'co'),
    addLabel(L('电池', 'battery'), new THREE.Vector3(-5.6, 1.95, 1.7), 'g'),

  ];

function refreshStaticLabels() {
  lblEnergy.element.textContent = mode === 'motor'
    ? L('电能 → 动能', 'electric → motion')
    : L('动能 → 电能', 'motion → electric');
  lblEnergy.element.className = 'lbl g';
}

/* ---------------- 动态箭头 ---------------- */
const dynGeoms = [], dynMeshes = [];
function clearDyn() {
  for (const g of dynGeoms) g.dispose();
  dynGeoms.length = 0;
  for (const m of dynMeshes) scene.remove(m);
  dynMeshes.length = 0;
}
function straightArrow(p, dir, len) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, Math.max(len - 0.2, 0.05), 8), M.arrow);
  shaft.position.copy(dir.clone().multiplyScalar((len - 0.2) / 2));
  shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.095, 0.24, 10), M.arrow);
  tip.position.copy(dir.clone().multiplyScalar(len - 0.12));
  tip.quaternion.copy(shaft.quaternion);
  g.add(tip);
  g.position.copy(p);
  scene.add(g);
  dynMeshes.push(g);
}

/* ---------------- θ(时间的纯函数,可任意拖相位) ---------------- */
function rampI(t, t0, t1) {   // ∫ ss(t0,t1,u) du
  if (t <= t0) return 0;
  if (t < t1) { const k = (t - t0) / (t1 - t0); return (t1 - t0) * (k ** 3 - (k ** 4) / 2); }
  return (t1 - t0) / 2;
}
const thM = t => 0.6 + 2.2 * (rampI(t, 0.14, 0.30) + Math.max(0, t - 0.30));
const thG = t => 0.6 + 2.6 * (rampI(t, 0.14, 0.34) + Math.max(0, t - 0.34));
const opOf = t => ss(-0.045, 0, t) * (1 - ss(0.90, 0.955, t));

/* ---------------- 每帧更新 ---------------- */
let needle = null, lever = null;
function buildSwitchAndNeedle() {
  const swBase = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.18, 0.6), M.base);
  swBase.position.set(-4.3, 0.6, 0.9);
  scene.add(swBase);
  lever = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.75, 0.16), M.brush);
  lever.geometry.translate(0, 0.34, 0);
  lever.position.set(-4.3, 0.68, 0.9);
  scene.add(lever);
  const gface = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.06), mat(0x1d232e, { roughness: 0.4 }));
  gface.position.set(6.7, 2.6, -0.42);
  gface.rotation.y = -0.35;
  scene.add(gface);
  needle = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.55, 0.03), M.arrow);
  needle.geometry.translate(0, 0.24, 0);
  needle.position.set(6.62, 2.34, -0.36);
  needle.rotation.y = -0.35;
  scene.add(needle);
}
function updateWorld(t) {
  const isM = mode === 'motor';
  const op = opOf(t);
  const theta = isM ? thM(t) : thG(t);
  rotor.rotation.z = -theta;

  const powered = isM && t >= 0.14;
  const genOn = !isM && t >= 0.30;
  const c = Math.cos(theta);
  const neutral = powered && Math.abs(c) < 0.12;

  /* --- 电路状态 --- */
  M.wireBat.opacity = isM ? 1 : 0.22;
  M.wireLamp.opacity = isM ? 0.22 : 1;
  M.battery.opacity = isM ? 1 : 0.3;
  const bright = (!isM && genOn) ? Math.abs(c) ** 2 : 0;
  M.lamp.emissiveIntensity = 0.05 + bright * 1.6;
  M.lampGlow.opacity = bright * 0.4;
  lever.rotation.z = isM ? 0 : -0.85;
  rotor.getObjectByName('crank').visible = !isM;
  needle.rotation.z = -0.35 + (isM ? 0 : lerp(-0.8, 0.8, Math.abs(c)) + 0.03 * Math.sin(t * 90));

  /* --- 受力箭头(电动机, powered) --- */
  clearDyn();
  if (tglForce.checked && powered) {
    const s = Math.sign(c) || 1;
    const lenA = 0.35 + 0.9 * Math.abs(c);
    const ax = 1.5 * Math.cos(theta), ay = 1.5 * Math.sin(theta);
    M.arrow.opacity = 0.95 * op;
    straightArrow(new THREE.Vector3(ax, CY + ay, 0.3), new THREE.Vector3(0, s, 0), lenA);
    straightArrow(new THREE.Vector3(-ax, CY - ay, 0.3), new THREE.Vector3(0, -s, 0), lenA);
  } else M.arrow.opacity = 0;

  /* --- 导线电流点 --- */
  if (tglForce.checked) {
    if (isM && powered) {
      for (let i = 0; i < 7; i++) {
        const p = (t * 3 + i / 7) % 1;
        dot(wireBat1.curve.getPoint(p), 0.09, M.dot.color.getHex(), 0);
        dot(wireBat2.curve.getPoint(1 - p), 0.09, M.dot.color.getHex(), 0);
      }
    }
    if (!isM && genOn) {
      const sp = 1.2 + 2.6 * Math.abs(c);
      for (let i = 0; i < 7; i++) {
        const p = (t * sp + i / 7) % 1;
        dot(wireLamp1.curve.getPoint(p), 0.09, M.dot.color.getHex(), 0);
        dot(wireLamp2.curve.getPoint(1 - p), 0.09, M.dot.color.getHex(), 0);
      }
    }
  }

  /* --- 标签 --- */
  const lblOp = op;
  for (const o of labelObjs) o.element.style.opacity = lblOp;
  lblNeutral.element.style.opacity = neutral ? (0.55 + 0.45 * Math.sin(t * 120)) * lblOp : 0;
  lblEnergy.element.style.opacity = ((isM ? powered : genOn) ? 1 : 0.45) * lblOp;
}
function dot(p, r, hex, glow) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), M.dot);
  s.position.copy(p);
  scene.add(s);
  dynMeshes.push(s);
  dynGeoms.push(s.geometry);
}

/* ================= 相位讲解(随身份切换) ================= */
const STEPS_MOTOR = [
  { t0: 0.0, b: '部件认识', be: 'Meet the parts',
    d: 'N/S 磁极、矩形线圈(3 匝)、换向器半环、电刷、电池——先认清每一件东西。',
    de: 'N/S poles, a 3-turn coil, the commutator halves, brushes and a battery — learn each part first.' },

    de: 'Current enters the coil; the two sides carry opposite currents and feel opposite forces (F = BIL) — a couple that spins the rotor.' },
  { t0: 0.30, b: '换向器:过中性面', be: 'Commutator at the neutral',
    d: '线圈转经竖直的中性面时力矩本来要反号——换向器半环恰在此刻扫过电刷,把电流翻个身:力矩方向不变,转子顺势冲过死点。',

    d: '力矩 ∝ |cosθ|:水平时最大、竖直时为零,靠惯性冲过死点再加换向,转子匀速转个不停——电能持续变动能。',

const STEPS_GEN = [

  { t0: 0.14, b: '拖动切割磁感线', be: 'Crank through the field',
    d: '摇把拖动线圈旋转,两侧导线切割磁感线 → 感应电动势 e = BLv——机械能开始变成电能。',
    de: 'The crank spins the coil; its sides sweep through the field → induced EMF e = BLv — mechanical energy becomes electrical.' },
  { t0: 0.34, b: '灯泡亮:脉动的直流', be: 'The lamp lights: pulsed DC',
    d: '亮度随 |cosθ| 每转脉动两峰;换向器把感应电流「整」成同方向——检流计指针偏向一边并抖动。',
    de: 'Brightness pulses as |cosθ| twice per turn; the commutator rectifies the current one way — the meter stays on one side, twitching.' },
  { t0: 0.60, b: '互逆:只看你从哪头喂能量', be: 'Inverse processes',
    d: '电动机:电能进、动能出;发电机:动能进、电能出。结构一模一样——安培力与电磁感应,互为逆过程。',
    de: 'Motor: electric in, motion out. Generator: motion in, electric out. Identical structure — the force law and induction are inverse processes.' },
];
const STEPS = () => mode === 'motor' ? STEPS_MOTOR : STEPS_GEN;
function stepIndex(t) {
  const b = mode === 'motor' ? [0.14, 0.30, 0.58] : [0.14, 0.34, 0.60];
  if (t < b[0]) return 0;
  if (t < b[1]) return 1;
  if (t < b[2]) return 2;
  return 3;
}

/* ================= UI / 主循环 ================= */
let cycles = qsFloat('t', 0);
let playing = !qsBool('pause', false);
let speed = qsFloat('speed', 1);

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const btnMotor = document.getElementById('btnMotor');
const btnGen = document.getElementById('btnGen');
const tglLabels = document.getElementById('tglLabels');
const tglForce = document.getElementById('tglForce');
const tglRotate = document.getElementById('tglRotate');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS().forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000 * 0.96; });
tglLabels.addEventListener('change', () => { for (const o of labelObjs) o.element.style.display = tglLabels.checked ? '' : 'none'; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
function setMode(m) {
  if (mode === m) return;
  mode = m;
  btnMotor.classList.toggle('on', m === 'motor');
  btnGen.classList.toggle('on', m === 'gen');
  cycles = 0;
  refreshStaticLabels();
  buildSteps();
}
btnMotor.addEventListener('click', () => setMode('motor'));
btnGen.addEventListener('click', () => setMode('gen'));
btnMotor.classList.toggle('on', mode === 'motor');
btnGen.classList.toggle('on', mode === 'gen');
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function phase(tt0) {
  const t = tt0 - Math.floor(tt0);
  return t < 0.96 ? t : t - 0.96;
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing) cycles += dt * speed / 12;
  const tt = phase(cycles);

  scene.background.set(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  updateWorld(tt);
  const si = stepIndex(tt);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(clamp(tt, 0, 0.96) / 0.96 * 1000);
  elScrubVal.textContent = Math.round(clamp(tt, 0, 0.96) / 0.96 * 100) + '%';
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
buildStatic();
buildRotor();
buildWires();
buildSwitchAndNeedle();
buildLabels();
applyTheme();
applyLang();
updateWorld(phase(cycles));
requestAnimationFrame(frame);
</script>
