<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金属腐蚀 · 一块短路了的原电池</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e0913f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b06a1f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.a { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  .lbl.c { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.z { border-color: rgba(125,208,247,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.ok { border-color: rgba(67,209,124,.9); color: #c9f3da; font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.a { border-color: rgba(201,42,42,.9); color: #c92a2a; }
  :root[data-theme="light"] .lbl.ok { border-color: rgba(47,158,92,.9); color: #2f9e5c; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.r { color: #ff8787; }
  #stats .v.z { color: #7fd0f7; }
  #stats .v.g { color: #43d17c; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.e { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.fe { color: #b3f0c2; border-color: rgba(104,211,145,.7); }
  .chip.oh { color: #a5d8ff; border-color: rgba(116,192,252,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(125,208,247,.12); color: var(--text); border: 1px solid rgba(125,208,247,.5);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: filter .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(67,209,124,.14); border-color: rgba(67,209,124,.6); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(224,145,63,.10); border-color: rgba(224,145,63,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,106,31,.08); border-color: rgba(176,106,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffd9b0; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="金属腐蚀：一块短路了的原电池" data-en="Corrosion: a short-circuited galvanic cell">金属腐蚀：一块短路了的原电池</h1>
  <div class="sub" data-zh="铁上同时长出阳极区和阴极区:Fe 失电子溶解,电子走金属本体,离子走海水——锈就此长出;装上锌块,锌替铁挨刀 · 空格播放/暂停" data-en="Anodic and cathodic spots grow on the same iron: Fe dissolves, electrons flow through the metal, ions through the sea — rust. Add a zinc block and it takes the beating · Space = play/pause">铁上同时长出阳极区和阴极区:Fe 失电子溶解,电子走金属本体,离子走海水——锈就此长出;装上锌块,锌替铁挨刀 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="腐蚀速率" data-en="corrosion rate">腐蚀速率</span><span class="v r" id="stR">—</span>
  <span class="k" data-zh="铁累计损失" data-en="iron lost">铁累计损失</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="锌块剩余" data-en="zinc left">锌块剩余</span><span class="v z" id="stZ">—</span>
  <span class="k" data-zh="模拟年份" data-en="elapsed years">模拟年份</span><span class="v g" id="stY">0.0</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.e" data-zh="● 电子(走金属本体)" data-en="● electrons (through metal)">● 电子(走金属本体)</span>
    <span class="chip.fe" data-zh="● Fe²⁺(溶入海水)" data-en="● Fe²⁺ (into seawater)">● Fe²⁺(溶入海水)</span>
    <span class="chip.oh" data-zh="● OH⁻(阴极生成)" data-en="● OH⁻ (made at cathode)">● OH⁻(阴极生成)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnZinc" data-zh="焊上锌块(牺牲阳极)" data-en=" weld on a zinc anode">焊上锌块(牺牲阳极)</button>
  </div>
  <div class="row"><label data-zh="盐度" data-en="salinity">盐度</label><input id="salt" type="range" min="5" max="100" step="5" value="70"><span class="val" id="saltVal">70%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCarriers" type="checkbox" checked> <span data-zh="载流子" data-en="carriers">载流子</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../galvanic-cell/" data-zh="原电池:同一家族的「正经」用法" data-en="galvanic cell: the honest version">原电池:同一家族的「正经」用法</a>
    <a href="../electroplating/" data-zh="电镀:反过来付电费把铁救回来" data-en="electroplating: pay to reverse it">电镀:反过来付电费把铁救回来</a>
    <a href="../fuel-cell/" data-zh="燃料电池:原电池的工业化版" data-en="fuel cell: the industrial version">燃料电池:原电池的工业化版</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.tank.color.set(THEME === 'light' ? 0x9fc8e8 : 0x1d5d8a);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('金属腐蚀 · 短路了的原电池', 'Corrosion · a shorted galvanic cell');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.6, 3.2, 7.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  steel: mat(0x77808d, { metalness: 0.6, roughness: 0.45 }),
  zinc: mat(0x9fc4d8, { metalness: 0.55, roughness: 0.4 }),
  rust: mat(0x9c4a1e, { roughness: 0.85, emissiveIntensity: 0.05 }),
  tank: new THREE.MeshPhysicalMaterial({ color: 0x1d5d8a, transparent: true, opacity: 0.24, roughness: 0.3 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  water: new THREE.MeshBasicMaterial({ color: 0x1d5d8a, transparent: true, opacity: 0.14, depthWrite: false }),
  eDot: new THREE.MeshBasicMaterial({ color: 0xffe066 }),
  feDot: new THREE.MeshBasicMaterial({ color: 0x69db7c }),
  ohDot: new THREE.MeshBasicMaterial({ color: 0x74c0fc }),
};

/* ================= 场景:海水槽 + 钢板 ================= */
const TANK_W = 6.8, TANK_H = 2.4, TANK_D = 2.0;
{
  const bottom = new THREE.Mesh(new THREE.BoxGeometry(TANK_W + 0.2, 0.14, TANK_D + 0.2), M.frame);
  bottom.position.y = -0.07;
  scene.add(bottom);
  for (const [w, h, x, y, z] of [
    [0.08, TANK_H, -TANK_W / 2, TANK_H / 2, 0], [0.08, TANK_H, TANK_W / 2, TANK_H / 2, 0],
    [TANK_W, TANK_H, 0, TANK_H / 2, -TANK_D / 2], [TANK_W, TANK_H, 0, TANK_H / 2, TANK_D / 2]]) {
    const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, w < 0.2 ? TANK_D : 0.08), M.frame);
    glass.material = new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.07, roughness: 0.15, side: THREE.DoubleSide, depthWrite: false });
    glass.position.set(x, y, z);
    scene.add(glass);
  }
  const water = new THREE.Mesh(new THREE.BoxGeometry(TANK_W - 0.06, TANK_H - 0.25, TANK_D - 0.06), M.water);
  water.position.set(0, (TANK_H - 0.25) / 2, 0);
  scene.add(water);
}
/* 钢板(船壁一段):竖立在中部 */
const plate = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.7, 1.5), M.steel);
plate.position.set(0, 1.15, 0);
scene.add(plate);
/* 锈斑(阳极侧,逐步长大) */
const rustPatches = [];
for (let i = 0; i < 10; i++) {
  const r = new THREE.Mesh(new THREE.SphereGeometry(rand(0.06, 0.13), 10, 8), M.rust);
  const a = rand(-0.55, 0.55);
  r.position.set(-0.10, 1.15 + rand(-0.6, 0.6), a);
  r.visible = false;
  scene.add(r);
  rustPatches.push(r);
}
/* 锌块(焊在阳极侧下部) */
const zinc = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.5, 0.55), M.zinc);
zinc.position.set(-0.22, 0.62, 0.35);
zinc.visible = false;
scene.add(zinc);

/* 载流子 */
const m4 = new THREE.Matrix4();
function makeInst(material, n, r) {
  const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 8, 6), material, n);
  for (let i = 0; i < n; i++) { m4.makeScale(0.001, 0.001, 0.001); inst.setMatrixAt(i, m4); }
  scene.add(inst);
  return inst;
}
const instE = makeInst(M.eDot, 16, 0.035);      // 电子:板内 阳极→阴极
const instFe = makeInst(M.feDot, 26, 0.042);    // Fe²⁺:阳极面溶入海水
const instOh = makeInst(M.ohDot, 20, 0.042);    // OH⁻:阴极面生成
const eDots = [], feDots = [], ohDots = [];
for (let i = 0; i < 16; i++) eDots.push({ p: Math.random() });
for (let i = 0; i < 26; i++) feDots.push({ x: 0, y: rand(0.7, 1.7), z: rand(-0.6, 0.6), drift: Math.random(), life: Math.random() });
for (let i = 0; i < 20; i++) ohDots.push({ x: 0, y: rand(0.7, 1.7), z: rand(-0.6, 0.6), drift: Math.random(), life: Math.random() });

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let salt = 0.7;                    // 0.05..1
let zincOn = false;
let ironLost = 0;                  // mm
let zincLeft = 1;                  // 0..1
let years = 0;
let tSim = 0;
function corrosionRate() {         // mm/年(示意)
  if (zincOn) return 0.015;
  return 0.03 + 0.17 * salt;
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblAnode = addLabel(() => zincOn ? L('锌块 = 新阳极(挨刀)', 'zinc = the new anode') : L('阳极区:Fe → Fe²⁺ + 2e⁻', 'anode: Fe → Fe²⁺ + 2e⁻'),
  new THREE.Vector3(-1.5, 2.0, 0), 'a');
const lblCathode = addLabel(() => zincOn ? L('钢板 = 阴极(被保住)', 'plate = cathode (protected)') : L('阴极区:O₂ + H₂O + e⁻ → OH⁻', 'cathode: O₂ + H₂O + e⁻ → OH⁻'),
  new THREE.Vector3(1.5, 2.0, 0), zincOn ? 'ok' : 'c');
const lblZinc = addLabel(() => L('锌块', 'zinc block'), new THREE.Vector3(-0.25, 0.15, 0.35), 'z', zinc);
const lblStatus = addLabel(() => zincOn ? L('牺牲阳极保护中:锌溶铁安', 'sacrificial protection: zinc dissolves, iron rests')
  : L('腐蚀进行中:锈是一块短路了的原电池', 'corroding: rust is a shorted galvanic cell'),
  new THREE.Vector3(0, 3.15, 0), zincOn ? 'ok' : 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '一块铁上,两个区', be: 'One plate, two zones',
    d: '钢板表面总有不均匀:某处略「阳」,某处略「阴」——阳极区失电子、阴极区收电子,海水当电解质,一块短路的原电池就此营业。',
    de: 'Plate surfaces are never uniform: some spots turn anodic, others cathodic — seawater is the electrolyte, and a shorted galvanic cell opens for business.',
    act: () => { zincOn = false; syncZinc(); } },
  { b: '阳极:铁溶解', be: 'Anode: iron dissolves',
    d: '阳极区 Fe → Fe²⁺ + 2e⁻:铁原子丢下电子变成离子溶进海水——钢板从这里「掉秤」。',
    de: 'At the anode Fe → Fe²⁺ + 2e⁻: iron leaves the plate as ions — this is where the plate loses weight.',
    act: () => { zincOn = false; syncZinc(); } },
  { b: '电子走金属,离子走海水', be: 'Electrons through metal, ions through sea',
    d: '电子沿钢板本体跑到阴极区(黄色小点),海水中 Fe²⁺ 离开、OH⁻ 在阴极生成——内外电路合起来才成回路;盐度越高,离子跑得越快,锈得越快。',
    de: 'Electrons run through the metal to the cathode; Fe²⁺ leaves and OH⁻ forms in the sea — the loop closes only with both paths. More salt, faster ions, faster rust.',
    act: () => { zincOn = false; syncZinc(); } },
  { b: '锈 = Fe²⁺ 撞上 OH⁻', be: 'Rust = Fe²⁺ meets OH⁻',
    d: 'Fe²⁺ 与 OH⁻ 相遇生成氢氧化铁,进一步氧化成红棕色铁锈——锈不是「铁变旧了」,是电化学反应的沉淀物。',
    de: 'Fe²⁺ meeting OH⁻ makes iron hydroxide, oxidizing further into brown rust — not "old iron", just electrochemical precipitate.',
    act: () => { zincOn = false; syncZinc(); } },
  { b: '牺牲阳极:锌替铁挨刀', be: 'Sacrificial anode: zinc takes the beating',
    d: '焊上一块更活泼的锌:电子改由锌供应,整块钢板被压成阴极——锈停了,锌块慢慢溶没。船底、管道、热水器里的镁棒,全是这一招。',
    de: 'Weld on reactive zinc: it supplies the electrons, the whole plate is pushed cathodic — rust stops while the zinc melts away. Ship hulls, pipelines, heater anodes: all this trick.',
    act: () => { zincOn = true; syncZinc(); } },
];
function stepIndex() {
  if (zincOn) return 4;
  if (ironLost > 0.25) return 3;
  if (ironLost > 0.08) return 2;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elSalt = document.getElementById('salt');
const elSaltVal = document.getElementById('saltVal');
const btnZinc = document.getElementById('btnZinc');
const tglLabels = document.getElementById('tglLabels');
const tglCarriers = document.getElementById('tglCarriers');
const tglRotate = document.getElementById('tglRotate');
const stR = document.getElementById('stR'), stL = document.getElementById('stL'),
  stZ = document.getElementById('stZ'), stY = document.getElementById('stY');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncZinc() {
  zinc.visible = zincOn;
  btnZinc.classList.toggle('on', zincOn);
  btnZinc.textContent = zincOn ? L('拆掉锌块(恢复腐蚀)', 'remove zinc (corrode again)') : L('焊上锌块(牺牲阳极)', 'weld on a zinc anode');
}
btnZinc.addEventListener('click', () => { zincOn = !zincOn; syncZinc(); });
elSalt.addEventListener('input', () => { salt = parseInt(elSalt.value, 10) / 100; elSaltVal.textContent = elSalt.value + '%'; });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    tSim += dts;
    const rate = corrosionRate();
    years += dts * 0.8;
    if (zincOn) {
      zincLeft = clamp(zincLeft - dts * 0.022 * (0.4 + salt), 0, 1);
      zinc.scale.set(1, Math.max(zincLeft, 0.06), 1);
      ironLost += rate * dts * 0.8;
    } else {
      ironLost += rate * dts * 0.8;
    }
    /* 锈斑生长(非保护时) */
    if (!zincOn) {
      rustPatches.forEach((r, i) => {
        if (ironLost > (i + 1) * 0.07) {
          r.visible = true;
          const k = clamp(ironLost / 1.6, 0.1, 1);
          r.scale.setScalar(0.4 + k * 0.9);
        }
      });
    }
  }

  /* 载流子动画 */
  const showC = tglCarriers.checked;
  const rateK = (0.3 + salt * 1.4) * (zincOn ? 0.6 : 1);
  /* 电子:板内,从锌/阳极侧 → 阴极侧 */
  eDots.forEach((e, i) => {
    e.p = (e.p + dts * 0.35 * rateK) % 1;
    const x = lerp(-0.05, 0.05, e.p);
    const y = 1.15 + Math.sin(i * 2.4) * 0.55;
    const z = Math.cos(i * 1.7) * 0.5;
    m4.makeScale(...(showC ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4.setPosition(x, y, z);
    instE.setMatrixAt(i, m4);
  });
  instE.instanceMatrix.needsUpdate = true;
  /* Fe²⁺:离开阳极面 */
  feDots.forEach((d, i) => {
    d.life += dts * rateK;
    if (d.life > 1) { d.life = 0; d.y = rand(0.7, 1.7); d.z = rand(-0.6, 0.6); }
    const x = -0.12 - d.life * (0.6 + d.drift * 0.8);
    const y = d.y + Math.sin(d.life * 9 + i) * 0.04;
    m4.makeScale(...(showC && (zincOn ? i < 6 : true) ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4.setPosition(x, y, d.z);
    instFe.setMatrixAt(i, m4);
  });
  instFe.instanceMatrix.needsUpdate = true;
  /* OH⁻:阴极面生成飘散 */
  ohDots.forEach((d, i) => {
    d.life += dts * rateK * 0.8;
    if (d.life > 1) { d.life = 0; d.y = rand(0.7, 1.7); d.z = rand(-0.6, 0.6); }
    const x = 0.12 + d.life * (0.5 + d.drift * 0.7);
    const y = d.y + Math.sin(d.life * 7 + i) * 0.04;
    const vis = showC && !zincOn ? true : showC && zincOn ? i < 5 : false;
    m4.makeScale(...(vis ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4.setPosition(x, y, d.z);
    instOh.setMatrixAt(i, m4);
  });
  instOh.instanceMatrix.needsUpdate = true;

  /* 统计 */
  stR.innerHTML = corrosionRate().toFixed(2) + '<small> mm/年</small>';
  stL.innerHTML = ironLost.toFixed(2) + '<small> mm</small>';
  stZ.innerHTML = zincOn ? (zincLeft * 100).toFixed(0) + '<small> %</small>' : '—';
  stY.textContent = years.toFixed(1);

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

syncZinc();
elSaltVal.textContent = Math.round(salt * 100) + '%';
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
