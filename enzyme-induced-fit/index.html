<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酶促反应 · 诱导契合 3D 动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#8d6fe3;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#6d3be0;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: var(--cv-pill); border: 1px solid var(--panel-border);
    color: var(--text3); font-size: 12px; line-height: 1.35; padding: 4px 9px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .3s; }
  .lbl.enzyme { border-color: rgba(147,165,216,.85); color: #ccd8ff; }
  .lbl.subA   { border-color: rgba(255,209,102,.9); color: #ffe9b3; }
  .lbl.subB   { border-color: rgba(6,214,160,.9); color: #b3f2e0; }
  .lbl.catA   { border-color: rgba(255,107,74,.9); color: #ffc9b3; }
  .lbl.catB   { border-color: rgba(77,208,225,.9); color: #bdeef5; }
  .lbl.state  { border-color: rgba(141,111,227,.9); color: #dcc9ff; font-size: 13px; padding: 6px 12px; }
  .lbl.bond   { border-color: rgba(255,93,93,.85); color: #ffc2c2; }
  .lbl.d      { border-color: var(--tool-border); color: var(--text3); font-variant-numeric: tabular-nums; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  :root[data-theme="light"] .lbl.enzyme { color: #3c4d92; }
  :root[data-theme="light"] .lbl.subA   { color: #8a5f00; }
  :root[data-theme="light"] .lbl.subB   { color: #007a5c; }
  :root[data-theme="light"] .lbl.catA   { color: #b03a12; }
  :root[data-theme="light"] .lbl.catB   { color: #0b6d80; }
  :root[data-theme="light"] .lbl.state  { color: #5a3bb0; }
  :root[data-theme="light"] .lbl.bond   { color: #b03030; }

  /* ===== 工具条（全站共享模式） ===== */
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 372px;
    max-height: calc(100vh - 110px); overflow: auto;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 13px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); }
  #legend { display: flex; gap: 7px; margin-bottom: 9px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.enzyme { color: #ccd8ff; border-color: rgba(147,165,216,.6); }
  .chip.sub    { color: #ffe9b3; border-color: rgba(255,209,102,.65); }
  .chip.cat    { color: #ffc9b3; border-color: rgba(255,107,74,.6); }
  .chip.dim    { color: var(--text3); border-color: var(--tool-border); }
  :root[data-theme="light"] .chip.enzyme { color: #3c4d92; }
  :root[data-theme="light"] .chip.sub    { color: #8a5f00; }
  :root[data-theme="light"] .chip.cat    { color: #b03a12; }

  #stats { display: flex; gap: 18px; margin-bottom: 9px; }
  #stats .cell { font-size: 11.5px; color: var(--text2); }
  #stats .cell b { display: block; font-size: 14.5px; color: var(--text); font-weight: 600;
    font-variant-numeric: tabular-nums; }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 5px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(141,111,227,.13); border-color: rgba(141,111,227,.5); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="酶为什么既专一又高效？—— 诱导契合" data-en="Why are enzymes so specific and efficient? — Induced fit">酶为什么既专一又高效？—— 诱导契合</h1>
  <div class="sub" data-zh='3D 交互演示 · 酶不是刚性的"锁"——底物结合会诱导酶改变构象，酶与底物互相塑造' data-en="Interactive 3D · An enzyme is not a rigid “lock” — substrate binding induces a conformational change; enzyme and substrate shape each other">3D 交互演示 · 酶不是刚性的"锁"——底物结合会诱导酶改变构象，酶与底物互相塑造</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip enzyme" data-zh="酶（两个结构域）" data-en="Enzyme (two domains)">酶（两个结构域）</span>
    <span class="chip sub" data-zh="底物（两瓣 + 敏感键）" data-en="Substrate (two lobes + scissile bond)">底物（两瓣 + 敏感键）</span>
    <span class="chip cat" data-zh="催化残基（酸 / 碱）" data-en="Catalytic residues (acid / base)">催化残基（酸 / 碱）</span>
    <span class="chip dim" data-zh="虚线 = 非共价结合" data-en="dashes = noncovalent binding">虚线 = 非共价结合</span>
  </div>

  <div id="stats">
    <div class="cell"><span data-zh="催化基团间距" data-en="Catalytic gap">催化基团间距</span><b id="catD">7.9 Å</b></div>
    <div class="cell"><span data-zh="敏感键长度" data-en="Scissile bond">敏感键长度</span><b id="bondL">1.4 Å</b></div>
    <div class="cell"><span data-zh="酶构象" data-en="Conformation">酶构象</span><b id="enzState">开放</b></div>
  </div>

  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglDashes" type="checkbox" checked> <span data-zh="非共价结合" data-en="Noncovalent bonds">非共价结合</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(PAL.bg);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('酶促反应 · 诱导契合 3D 动画', 'Enzyme Catalysis · Induced Fit 3D Animation');
  buildSteps();
  setPlayLabel();
  applyLabelLangs();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 常量：时序（tt ∈ [0, 0.96)，周期末尾淡出复位） ---------------- */
const CYCLE_SECONDS = 10.0;
const T_CLOSE   = [0.24, 0.44];   // 诱导契合：结构域合拢
const T_STRETCH = [0.42, 0.52];   // 敏感键被拉伸
const T_BREAK   = 0.52;           // 断键
const T_REOPEN  = [0.62, 0.78];   // 酶恢复开放构象
const T_DRIFT   = [0.62, 0.80];   // 产物上浮离开
const OPEN_A = 0.46;              // 开放时结构域张角（rad）
const SCALE_A = 5;                // 1 单位 ≈ 5 Å（显示用）

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- 场景基础 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.9, 2.0, 3.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 12;
controls.autoRotateSpeed = 0.65;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.62));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(3.5, 6, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-4, 2.5, -3);
scene.add(fill);

/* ---------------- 材质 ---------------- */
const M = {
  enzyme: new THREE.MeshStandardMaterial({ color: 0x93a5d8, transparent: true, opacity: 0.34,
    roughness: 0.55, metalness: 0.05, depthWrite: false }),
  contact: new THREE.MeshStandardMaterial({ color: 0xffb347, roughness: 0.45,
    emissive: 0xffb347, emissiveIntensity: 0.3 }),
  catA: new THREE.MeshStandardMaterial({ color: 0xff6b4a, roughness: 0.4,
    emissive: 0xff6b4a, emissiveIntensity: 0.3 }),
  catB: new THREE.MeshStandardMaterial({ color: 0x4dd0e1, roughness: 0.4,
    emissive: 0x4dd0e1, emissiveIntensity: 0.3 }),
  lobeA: new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.42,
    emissive: 0xffd166, emissiveIntensity: 0.18, transparent: true }),
  lobeB: new THREE.MeshStandardMaterial({ color: 0x06d6a0, roughness: 0.42,
    emissive: 0x06d6a0, emissiveIntensity: 0.18, transparent: true }),
  bond: new THREE.MeshStandardMaterial({ color: 0xe9ecef, roughness: 0.35, metalness: 0.2,
    emissive: 0xe9ecef, emissiveIntensity: 0.1, transparent: true }),
  stub: new THREE.MeshStandardMaterial({ color: 0xff5d5d, roughness: 0.4,
    emissive: 0xff5d5d, emissiveIntensity: 0.5, transparent: true, opacity: 0 }),
  dash: new THREE.MeshBasicMaterial({ color: 0xbfd7ff, transparent: true, opacity: 0,
    depthWrite: false }),
};

/* ---------------- 酶：两个结构域绕铰链开合 ---------------- */
const jawL = new THREE.Group(), jawR = new THREE.Group();
scene.add(jawL, jawR);

// 结构域外形：一簇球体拼成的"钳臂"（局部坐标，x<0 为左臂）。
// 内壁在 |x| ≈ 0.6+ 处留出裂隙，闭合时恰好贴住底物两瓣（±0.36 ± 0.24）。
const L_SPHERES = [
  [-0.35, 0.0, 0, 0.26], [-0.66, 0.2, 0, 0.36],
  [-0.84, 0.58, 0.18, 0.38], [-0.86, 0.6, -0.17, 0.36],
  [-1.0, 1.0, 0, 0.36],
  [-0.88, 1.4, 0.14, 0.3], [-0.86, 1.42, -0.14, 0.28],
  [-0.62, 1.62, 0, 0.24],
];
function buildJaw(sign) {
  const grp = sign < 0 ? jawL : jawR;
  for (const [x, y, z, r] of L_SPHERES) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 26, 20), M.enzyme);
    m.position.set(sign * x, y, z);
    m.renderOrder = 2;
    grp.add(m);
  }
}
buildJaw(-1); buildJaw(1);

// 残基：每侧 2 个接触残基 + 1 个催化残基（酸在左 / 碱在右，闭合时恰好夹住敏感键）
const RES_L = [[-0.64, 1.32, 0.16], [-0.56, 0.74, -0.16]]; // 接触残基（局部，恰好从内壁探出）
const CAT_L = [-0.34, 1.36, 0.06], CAT_R = [0.34, 1.36, -0.06];
const contacts = [];
for (const [x, y, z] of RES_L) {
  const a = new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 12), M.contact);
  a.position.set(x, y, z); jawL.add(a);
  const b = a.clone(); b.position.set(-x, y, -z); jawR.add(b);
  contacts.push(a, b);
}
const catA = new THREE.Mesh(new THREE.SphereGeometry(0.115, 18, 14), M.catA);
catA.position.set(...CAT_L); jawL.add(catA);
const catB = new THREE.Mesh(new THREE.SphereGeometry(0.115, 18, 14), M.catB);
catB.position.set(...CAT_R); jawR.add(catB);

// 铰链轴与底座（空间参照）
{
  const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.9, 12),
    new THREE.MeshStandardMaterial({ color: 0x5b6470, metalness: 0.7, roughness: 0.4 }));
  hinge.rotation.x = Math.PI / 2;
  scene.add(hinge);
  const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.3, 0.9, 16),
    new THREE.MeshStandardMaterial({ color: 0x333c4a, metalness: 0.4, roughness: 0.6 }));
  pedestal.position.y = -0.85;
  scene.add(pedestal);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.7, 0.08, 40),
    new THREE.MeshStandardMaterial({ color: 0x1d2330, metalness: 0.2, roughness: 0.85 }));
  disc.position.y = -1.32;
  scene.add(disc);
}

/* ---------------- 底物（两瓣 + 敏感键） ---------------- */
const substrate = new THREE.Group();
scene.add(substrate);
const SUB_HOME = V3(0, 1.02, 0);      // 结合后的位置
const SUB_START = V3(0.4, 3.0, 0.55); // 接近起点
const lobeA = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.15, 6), M.lobeA);
lobeA.rotation.x = Math.PI / 2;
lobeA.position.set(-0.36, 0, 0);
const lobeB = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.15, 6), M.lobeB);
lobeB.rotation.x = Math.PI / 2;
lobeB.position.set(0.36, 0, 0);
const bond = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.26, 12), M.bond);
bond.rotation.z = Math.PI / 2;
const stubA = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.1, 8), M.stub);
stubA.rotation.z = Math.PI / 2; stubA.position.set(-0.27, 0, 0);
const stubB = stubA.clone(); stubB.position.x = 0.27;
lobeA.add(stubB); lobeB.add(stubA);
substrate.add(lobeA, lobeB, bond);

// 断键闪光
const flash = new THREE.PointLight(0xff8866, 0, 3.2, 2);
scene.add(flash);

/* ---------------- 非共价结合虚线（每帧摆位） ---------------- */
const dashes = [];
for (let i = 0; i < 4; i++) {
  const d = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1, 6), M.dash);
  d.renderOrder = 3;
  scene.add(d); dashes.push(d);
}
function placeStickBetween(mesh, a, b) {
  const d = V3().subVectors(b, a);
  const len = d.length();
  if (len < 1e-4) { mesh.visible = false; return; }
  mesh.visible = true;
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize());
}
// 局部坐标 → 世界（左臂转 +th、右臂转 −th，与 jawL/jawR 的 rotation.z 一致）
function jawWorld(sign, x, y, z, th) {
  const a = sign < 0 ? th : -th;
  const c = Math.cos(a), s = Math.sin(a);
  return V3(x * c - y * s, x * s + y * c, z);
}

/* ---------------- 标签 ---------------- */
function addLabel(html, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.innerHTML = html;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  return o;
}
const LBL_TEXTS = [
  ['酶 · 结构域 A', 'Enzyme · domain A'],
  ['酶 · 结构域 B', 'Enzyme · domain B'],
  ['底物（两瓣）', 'Substrate (two lobes)'],
  ['催化残基（酸）', 'Catalytic residue (acid)'],
  ['催化残基（碱）', 'Catalytic residue (base)'],
  ['待断键', 'Scissile bond'],
];
const labelObjs = [
  addLabel(L(...LBL_TEXTS[0]), V3(-1.15, 0.62, 0.3), 'enzyme'),
  addLabel(L(...LBL_TEXTS[1]), V3(1.15, 0.62, -0.3), 'enzyme'),
  addLabel(L(...LBL_TEXTS[2]), V3(0, 0.46, 0), 'subA', substrate),
  addLabel(L(...LBL_TEXTS[3]), V3(-0.15, 0.3, 0), 'catA', catA),
  addLabel(L(...LBL_TEXTS[4]), V3(0.15, -0.32, 0), 'catB', catB),
  addLabel(L(...LBL_TEXTS[5]), V3(0, -0.26, 0), 'bond', substrate),
  addLabel('', V3(0, 2.35, 0), 'state'),
  addLabel('', V3(0, 0.34, 0), 'd'),
];
function applyLabelLangs() {
  LBL_TEXTS.forEach(([zh, en], i) => { labelObjs[i].element.innerHTML = L(zh, en); });
}
const lblState = labelObjs[6], lblDist = labelObjs[7];
const [lblSub, lblBond] = [labelObjs[2], labelObjs[5]];

/* ---------------- 相位讲解 ---------------- */
const STEPS = [
  { t0: 0.0,  b: '开放构象 · 底物接近', d: '酶的活性中心不是刚性的"现成锁"——初始构象与底物只是大致互补，催化基团相距约 8 Å，远到无法催化。',
    be: 'Open conformation · substrate approach', de: 'The active site is not a rigid pre-formed lock: the starting conformation only roughly complements the substrate, and the catalytic groups sit ~8 Å apart, far too far to catalyze.' },
  { t0: 0.24, b: '底物结合', d: '底物靠氢键等非共价相互作用进入活性中心。结合本身就开始"通知"酶：酶被底物结合能驱动着改变构象。',
    be: 'Substrate binding', de: 'The substrate enters the active site through hydrogen bonds and other noncovalent interactions; the binding energy itself drives the enzyme to change conformation.' },
  { t0: 0.42, b: '诱导契合 · 催化就位', d: '两个结构域像钳子一样合拢，催化基团精确就位（间距 ~4 Å）；同时底物的敏感键被拉伸、扭曲——活化能被"机械"地压低。',
    be: 'Induced fit · catalysis in place', de: 'The two domains close like pincers, aligning the catalytic groups precisely (~4 Å apart) while stretching and twisting the scissile bond — mechanically lowering the activation energy.' },
  { t0: 0.52, b: '催化 · 断键', d: '酸碱催化残基协同攻击敏感键，键断裂，一分为二。',
    be: 'Catalysis · bond cleavage', de: 'The acid–base catalytic residues attack the scissile bond cooperatively; it breaks and the substrate splits in two.' },
  { t0: 0.62, b: '产物释放 · 酶复原', d: '产物形状与闭合构象不再契合，亲和力骤降；酶弹回开放构象，产物离开——酶本身不消耗，进入下一轮循环。',
    be: 'Product release · enzyme restored', de: 'The product no longer fits the closed conformation and its affinity drops sharply; the enzyme springs back open and releases the product — unconsumed, ready for the next cycle.' },
];
const elSteps = document.getElementById('steps');
function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function stepIndex(tt) {
  if (tt < 0.24) return 0;
  if (tt < 0.42) return 1;
  if (tt < 0.52) return 2;
  if (tt < 0.62) return 3;
  return 4;
}

/* ---------------- 每帧更新 ---------------- */
let cycles = 0;
let playing = !qsBool('pause', false);
let speed = qsFloat('speed', 1);

const stD = document.getElementById('catD'), stL = document.getElementById('bondL'),
      stS = document.getElementById('enzState');
const catWorldA = V3(), catWorldB = V3();

function updateWorld(tt) {
  /* --- 结构域开合 --- */
  let open = OPEN_A;
  if (tt >= T_CLOSE[0]) open = lerp(OPEN_A, 0, ss(...T_CLOSE, tt));
  if (tt >= T_REOPEN[0]) open = lerp(0, OPEN_A, ss(...T_REOPEN, tt));
  jawL.rotation.z = open; jawR.rotation.z = -open;

  /* --- 底物位置（接近 → 结合 → 随产物离开） --- */
  const approach = tt < 0.2 ? ss(0.02, 0.2, tt) : 1;
  const drift = ss(...T_DRIFT, tt);
  substrate.position.lerpVectors(SUB_START, SUB_HOME, approach);
  substrate.position.y += drift * 1.3;
  substrate.position.x += drift * 0.1;
  substrate.rotation.y = (1 - approach) * 0.7;

  /* --- 两瓣分离（断键后） --- */
  const split = tt < T_BREAK ? 0 : ss(T_BREAK, T_BREAK + 0.08, tt) * (1 + drift * 1.6);
  lobeA.position.x = -0.36 - 0.14 * split - 0.45 * drift;
  lobeB.position.x = 0.36 + 0.14 * split + 0.45 * drift;
  lobeA.position.y = 0.28 * drift; lobeB.position.y = 0.36 * drift;

  /* --- 敏感键：拉伸 → 变红 → 断裂 --- */
  const stretch = tt < T_STRETCH[0] ? 1 : lerp(1, 1.5, ss(...T_STRETCH, tt));
  const broken = tt >= T_BREAK;
  bond.visible = !broken;
  if (!broken) {
    bond.scale.y = stretch;
    const hot = ss(...T_STRETCH, tt);
    M.bond.color.lerpColors(new THREE.Color(0xe9ecef), new THREE.Color(0xff5d5d), hot);
    M.bond.emissiveIntensity = 0.1 + hot * 0.7;
  }
  M.stub.opacity = broken ? clamp(1 - ss(T_BREAK + 0.1, 0.7, tt), 0, 1) : 0;
  flash.intensity = broken ? Math.max(0, 10 * (1 - (tt - T_BREAK) / 0.07)) : 0;
  flash.position.copy(substrate.position);
  const catPulse = broken ? Math.max(0, 1 - (tt - T_BREAK) / 0.12) : 0;
  M.catA.emissiveIntensity = 0.3 + catPulse * 1.3;
  M.catB.emissiveIntensity = 0.3 + catPulse * 1.3;

  /* --- 非共价虚线 --- */
  const dashOp = tglDashes.checked
    ? ss(0.24, 0.34, tt) * (1 - ss(T_DRIFT[0] + 0.03, T_DRIFT[0] + 0.1, tt)) : 0;
  M.dash.opacity = dashOp * 0.75;
  if (dashOp > 0.02) {
    const s = substrate.position;
    const lp = [jawWorld(-1, ...RES_L[0], open), jawWorld(-1, ...RES_L[1], open)];
    const rp = [jawWorld(1, ...RES_L[0], open), jawWorld(1, ...RES_L[1], open)];
    placeStickBetween(dashes[0], V3(s.x - 0.32, s.y + 0.26, s.z + 0.12), lp[0]);
    placeStickBetween(dashes[1], V3(s.x - 0.34, s.y - 0.22, s.z - 0.12), lp[1]);
    placeStickBetween(dashes[2], V3(s.x + 0.32, s.y + 0.26, s.z - 0.12), rp[0]);
    placeStickBetween(dashes[3], V3(s.x + 0.34, s.y - 0.22, s.z + 0.12), rp[1]);
  } else for (const d of dashes) d.visible = false;

  /* --- 催化基团世界坐标 / 间距 --- */
  catWorldA.copy(jawWorld(-1, ...CAT_L, open));
  catWorldB.copy(jawWorld(1, ...CAT_R, open));
  const dA = catWorldA.distanceTo(catWorldB) * SCALE_A;
  stD.textContent = dA.toFixed(1) + ' Å';
  stL.textContent = broken ? L('已断裂', 'broken') : (1.4 * stretch).toFixed(1) + ' Å';
  stS.textContent = open > 0.05 ? L('开放', 'open')
    : (broken ? L('闭合 · 释放中', 'closed · releasing') : L('闭合 · 催化态', 'closed · catalytic'));
  lblDist.element.textContent = 'd ≈ ' + dA.toFixed(1) + ' Å';
  const distOp = (tt > 0.06 && tt < 0.62 ? 1 : 0);
  lblDist.element.style.opacity = distOp;
  lblDist.position.lerpVectors(catWorldA, catWorldB, 0.5).add(V3(0, 0.42, 0));

  /* --- 状态标签 --- */
  const stateText = tt < 0.24 ? L('① 开放构象 — 等待底物', '① Open — awaiting substrate')
    : tt < 0.42 ? L('② 结合 — 开始诱导', '② Binding — induction begins')
    : tt < 0.52 ? L('③ 诱导契合 · 催化就位', '③ Induced fit · catalysis set')
    : tt < 0.62 ? L('④ 催化 · 断键！', '④ Catalysis · bond breaks!')
    : tt < 0.86 ? L('⑤ 释放产物 · 复原', '⑤ Product release · reset')
    : L('① 开放构象 — 等待底物', '① Open — awaiting substrate');
  lblState.element.innerHTML = stateText;

  /* --- 底物淡入淡出（周期复位） --- */
  const op = ss(0, 0.05, tt) * (1 - ss(0.78, 0.86, tt));
  for (const m of [M.lobeA, M.lobeB, M.bond]) m.opacity = op;
  M.stub.opacity = Math.min(M.stub.opacity, op);
  lblSub.element.style.opacity = op;
  lblBond.element.style.opacity = broken ? 0 : op;

  return open;
}

/* ---------------- UI 接线 ---------------- */
cycles = qsFloat('t', 0);
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const tglLabels = document.getElementById('tglLabels');
const tglDashes = document.getElementById('tglDashes');
const tglRotate = document.getElementById('tglRotate');

function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000 * 0.96; });
tglLabels.addEventListener('change', () => { for (const o of labelObjs) o.element.style.display = tglLabels.checked ? '' : 'none'; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }

addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let lastStep = -1;
function phase(tt0) {
  const t = tt0 - Math.floor(tt0);
  return t < 0.96 ? t : t - 0.96;
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing) cycles += dt * speed / CYCLE_SECONDS;
  const tt = phase(cycles);

  updateWorld(tt);

  const si = stepIndex(tt);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(clamp(tt, 0, 0.96) / 0.96 * 1000);
  elScrubVal.textContent = Math.round(clamp(tt, 0, 0.96) / 0.96 * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
applyTheme();
applyLang();
updateWorld(phase(cycles));
requestAnimationFrame(frame);
</script>
</body>
</html>
