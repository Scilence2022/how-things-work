<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>放射性衰变 · 半衰期从大数定律长出来</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd43b;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#f08c00;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.y { border-color: rgba(255,212,59,.9); color: #fff3bf; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.y { border-color: rgba(240,140,0,.9); color: #e8590c; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.y { color: #ffd43b; }
  #stats .v.g { color: #69db7c; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.y { color: #fff3bf; border-color: rgba(255,212,59,.7); }
  .chip.k { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,212,59,.12); color: var(--text); border: 1px solid rgba(255,212,59,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,212,59,.10); border-color: rgba(255,212,59,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(240,140,0,.08); border-color: rgba(240,140,0,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #fff3bf; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="放射性衰变：半衰期从大数定律长出来" data-en="Radioactive Decay: half-life from the law of large numbers">放射性衰变：半衰期从大数定律长出来</h1>
  <div class="sub" data-zh="每个核每秒等概率「爆」一颗:单个核说不准,一万个核却走出精确的指数曲线——半衰期是统计的节拍 · 空格播放/暂停" data-en="Every nucleus rolls the same dice each second: one is unknowable, ten thousand draw an exact exponential — half-life is statistics' metronome · Space = play/pause">每个核每秒等概率「爆」一颗:单个核说不准,一万个核却走出精确的指数曲线——半衰期是统计的节拍 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="剩余未衰变核" data-en="nuclei left">剩余未衰变核</span><span class="v y" id="stN">—</span>
  <span class="k" data-zh="已过半衰期数" data-en="half-lives elapsed">已过半衰期数</span><span class="v" id="stH">0.0</span>
  <span class="k" data-zh="理论预测" data-en="theory predicts">理论预测</span><span class="v g" id="stP">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.y" data-zh="未衰变核(黄)" data-en="intact nucleus (yellow)">未衰变核(黄)</span>
    <span class="chip.k" data-zh="已衰变(绿) + 放出粒子" data-en="decayed (green) + emitted particle">已衰变(绿) + 放出粒子</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnReset" data-zh="重新装填一万颗" data-en="reload the sample">重新装填一万颗</button>
  </div>
  <div class="row"><label data-zh="半衰期(秒)" data-en="half-life (s)">半衰期(秒)</label><input id="hl" type="range" min="10" max="60" step="5" value="25"><span class="val" id="hlVal">25 s</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.5" max="3" step="0.5" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../galton-board/" data-zh="同族:随机长出规律" data-en="same family: randomness → law">同族:随机长出规律</a>
    <a href="../random-walk/" data-zh="同族:随机游走" data-en="same family: random walk">同族:随机游走</a>
    <a href="../nuclear-reactor/" data-zh="应用:可控链式反应(规划中)" data-en="application: reactors (planned)">应用:可控链式反应(规划中)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('放射性衰变 · 半衰期', 'Radioactive Decay · half-life');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.2, 4.6, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.6, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(4, 9, 5);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  intact: new THREE.MeshBasicMaterial({ color: 0xffd43b }),
  decayed: new THREE.MeshBasicMaterial({ color: 0x51cf66 }),
  part: new THREE.MeshBasicMaterial({ color: 0xff922b }),
};

/* ================= 核样品(立方网格) ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(7, 0.16, 5), M.floor);
floor.position.set(0.6, -0.1, 0);
scene.add(floor);
const N_SIDE = 12;
const N_ALL = 1728;
const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.055, 8, 6), M.intact.clone(), N_ALL);
mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N_ALL * 3), 3);
scene.add(mesh);
const m4 = new THREE.Matrix4();
const nuclei = [];
const emitted = [];      // {p, v, life}
function seed() {
  nuclei.length = 0;
  const sp = 0.135;
  let i = 0;
  for (let ix = 0; ix < N_SIDE; ix++) for (let iy = 0; iy < N_SIDE; iy++) for (let iz = 0; iz < N_SIDE; iz++) {
    nuclei.push({
      p: new THREE.Vector3(-0.75 + ix * sp, 0.1 + iy * sp, -0.75 + iz * sp),
      alive: true,
    });
    i++;
  }
  emitted.length = 0;
}

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let halfLife = 25;          // 秒(视觉)
let tSim = 0;               // 已流逝(秒,视觉)
let lambda = Math.LN2 / halfLife;
let theoryN0 = N_ALL;
/* 理论曲线画布 */
const theoryCv = document.createElement('canvas');
theoryCv.width = 300; theoryCv.height = 110;
theoryCv.style.cssText = 'display:block;border-radius:8px;grid-column:1/3;margin-top:6px;';
document.getElementById('stats').appendChild(theoryCv);
const tctx = theoryCv.getContext('2d');
function drawTheory() {
  const W = 300, Hc = 110;
  tctx.clearRect(0, 0, W, Hc);
  const pill = getComputedStyle(htmlEl).getPropertyValue('--cv-pill').trim() || 'rgba(13,17,24,.8)';
  tctx.fillStyle = pill;
  tctx.beginPath(); tctx.roundRect(0, 0, W, Hc, 8); tctx.fill();
  const gy = n => Hc - 14 - clamp(n / N_ALL, 0, 1) * (Hc - 34);
  const gx = t => 14 + clamp(t / (halfLife * 4), 0, 1) * (W - 28);
  /* 半衰期网格 */
  tctx.strokeStyle = 'rgba(128,140,155,.35)'; tctx.setLineDash([3, 3]);
  for (let h = 1; h <= 4; h++) {
    tctx.beginPath(); tctx.moveTo(gx(h * halfLife), 12); tctx.lineTo(gx(h * halfLife), Hc - 14); tctx.stroke();
    tctx.fillStyle = 'rgba(199,210,222,.8)'; tctx.font = '9px system-ui'; tctx.textAlign = 'center';
    tctx.fillText(h + 'T½', gx(h * halfLife), Hc - 3);
  }
  tctx.setLineDash([]);
  /* 理论指数线 */
  tctx.strokeStyle = '#69db7c'; tctx.lineWidth = 1.8;
  tctx.beginPath();
  for (let x = 14; x <= W - 14; x++) {
    const t = (x - 14) / (W - 28) * halfLife * 4;
    const n = N_ALL * Math.exp(-Math.LN2 * t / halfLife);
    x === 14 ? tctx.moveTo(x, gy(n)) : tctx.lineTo(x, gy(n));
  }
  tctx.stroke();
  /* 实测点 */
  tctx.fillStyle = '#ffd43b';
  tctx.beginPath(); tctx.arc(gx(tSim), gy(alive()), 4, 0, 7); tctx.fill();
  tctx.textAlign = 'left';
}
function alive() { let k = 0; for (const n of nuclei) k += n.alive; return k; }

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblSample = addLabel(() => L(`样品:剩余 ${alive()} / ${N_ALL}`, `sample: ${alive()} / ${N_ALL} left`),
  new THREE.Vector3(0.6, 2.3, 0), 'y');
const lblStatus = addLabel(() => L('每个核每秒掷同一颗骰子——谁先爆纯靠运气', 'every nucleus rolls identical dice — who pops first is pure luck'),
  new THREE.Vector3(0.6, 3.3, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '每秒同一颗骰子', be: 'Same dice every second',
    d: '一个未衰变的核,每秒都有固定概率衰变——不管它已经等了多久。核没有记忆,只有概率。',
    de: 'An intact nucleus rolls identical dice every second, however long it has waited. Nuclei have no memory, only odds.',
    act: () => { halfLife = 25; document.getElementById('hl').value = 25; document.getElementById('hlVal').textContent = '25 s'; tSim = 0; seed(); } },
  { b: '半衰期:折半的节拍', be: 'Half-life: the halving beat',
    d: '大数定律接管后,整批样品每过一个半衰期就精确折半——单个随机,群体命定。绿色曲线是理论线,黄点是实测。',
    de: 'With enough nuclei the sample halves precisely each half-life — individuals random, the crowd fated. Green line = theory, gold dot = measured.',
    act: () => { halfLife = 25; document.getElementById('hl').value = 25; document.getElementById('hlVal').textContent = '25 s'; tSim = 0; seed(); } },
  { b: '永不归零,只向零收敛', be: 'Never zero, only closer',
    d: '四个半衰期后剩 1/16,十个半衰期后剩千分之一——指数衰减永不归零,只是小到测不出。',
    de: 'After 4 half-lives 1/16 remains; after 10, one in a thousand. Exponential decay never hits zero — it just fades beyond measure.',
    act: () => { halfLife = 25; tSim = 0; seed(); } },
  { b: '碳-14 测年', be: 'Carbon-14 dating',
    d: '碳-14 半衰期 5730 年:生物死后停止补充,余量对数一查便知年代——半衰期就是自然的沙漏。',
    de: 'C-14 (half-life 5730 y) stops renewing at death; measure the remainder, read the age. Half-life is nature\'s hourglass.',
    act: () => { halfLife = 50; document.getElementById('hl').value = 50; document.getElementById('hlVal').textContent = '50 s'; tSim = 0; seed(); } },
  { b: '可控与不可控', be: 'Tamed and untamed',
    d: '衰变本身无法加速或叫停——但链式反应可以靠控制棒调节:核电站与原子弹的分界,就在「可控」二字。',
    de: 'Decay itself cannot be rushed or stopped — but chain reactions can be throttled with control rods. Reactors vs bombs: one word, controlled.',
    act: () => { halfLife = 25; document.getElementById('hl').value = 25; document.getElementById('hlVal').textContent = '25 s'; tSim = 0; seed(); } },
];
function stepIndex() {
  const h = tSim / halfLife;
  if (h > 2) return 2;
  if (h > 0.9) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elHl = document.getElementById('hl');
const elHlVal = document.getElementById('hlVal');
const btnReset = document.getElementById('btnReset');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stN = document.getElementById('stN'), stH = document.getElementById('stH'),
  stP = document.getElementById('stP');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elHl.addEventListener('input', () => { halfLife = parseInt(elHl.value, 10); elHlVal.textContent = elHl.value + ' s'; });
btnReset.addEventListener('click', () => { tSim = 0; seed(); });
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
const emitMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.03, 6, 5), M.part, 300);
scene.add(emitMesh);
let emitCursor = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  lambda = Math.LN2 / halfLife;
  if (playing) {
    tSim += dts;
    /* 每个活核按 λ·dt 概率衰变 */
    const p = 1 - Math.exp(-lambda * dts);
    for (const n of nuclei) {
      if (!n.alive) continue;
      if (Math.random() < p) {
        n.alive = false;
        /* 放出一颗粒子 */
        const e = emitted.find(x => x.life <= 0) || { p: n.p.clone(), v: new THREE.Vector3(), life: 0 };
        const a = Math.random() * Math.PI * 2, b = Math.acos(Math.random() * 2 - 1);
        e.p = n.p.clone();
        e.v = new THREE.Vector3(Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a)).multiplyScalar(1.4);
        e.life = 0.9;
        if (!emitted.includes(e)) emitted.push(e);
      }
    }
  }

  /* 渲染核 */
  nuclei.forEach((n, i) => {
    m4.makeScale(1, 1, 1);
    m4.setPosition(n.p);
    mesh.setMatrixAt(i, m4);
    mesh.setColorAt(i, n.alive ? M.intact.color : M.decayed.color);
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

  /* 渲染放出粒子 */
  let k = 0;
  for (const e of emitted) {
    if (e.life > 0 && playing) { e.life -= dts; e.p.addScaledVector(e.v, dts); }
    if (e.life > 0) {
      m4.makeScale(1, 1, 1);
      m4.setPosition(e.p);
      emitMesh.setMatrixAt(k++, m4);
    }
  }
  for (let i = k; i < 300; i++) { m4.makeScale(0.001, 0.001, 0.001); emitMesh.setMatrixAt(i, m4); }
  emitMesh.instanceMatrix.needsUpdate = true;

  const nAlive = alive();
  stN.innerHTML = nAlive + '<small> / ' + N_ALL + '</small>';
  stH.textContent = (tSim / halfLife).toFixed(2);
  stP.innerHTML = Math.round(N_ALL * Math.exp(-lambda * tSim)) + '<small> (理论)</small>';

  drawTheory();
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

seed();
elHlVal.textContent = halfLife + ' s';
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
