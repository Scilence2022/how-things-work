<!DOCTYPE html>

<title>张拉整体结构 · 以拉定形</title>
<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#9c36b5;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}

  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}

    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(3.0,2.2,4.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=1.5;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与展台 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const tableM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8});
const table=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,0.18,48),tableM);
table.position.y=-0.09;scene.add(table);

/* ---- 三杆棱柱:6节点 / 3压杆 / 9索 ---- */
/* 压杆 zigzag 与侧索反向(top_i→bottom_{i-1}),平衡扭转角由
   扭矩平衡 d_h·sin(30°−φ/2)=d_s·cos(φ/2) 解出(经典结果 ≈30°),
   预张力按自应力比分配:侧面索 T_s,环索 T_r≈0.65·T_s,压杆 C≈1.57·T_s */
const R=0.85,LB=2.05,D2R=Math.PI/180;
const KC=300,KB=4000;
const PHI=(()=>{ /* 平衡扭转角(弧度) */
  const f=ph=>2*R*Math.sin(60*D2R+ph/2)*Math.sin(30*D2R-ph/2)-2*R*Math.sin(ph/2)*Math.cos(ph/2);
  let lo=5*D2R,hi=60*D2R;
  for(let i=0;i<60;i++){const mid=(lo+hi)/2;if(f(mid)>0)lo=mid;else hi=mid;}
  return (lo+hi)/2;
})();
const REFG=(()=>{
  const dh=2*R*Math.sin(60*D2R+PHI/2),H=Math.sqrt(LB*LB-dh*dh);
  const ds=2*R*Math.sin(PHI/2),LS=Math.hypot(ds,H),ring=Math.sqrt(3)*R;
  const trTs=((dh/LS)*Math.cos(30*D2R-PHI/2)-(ds/LS)*Math.sin(PHI/2))/Math.sqrt(3);
  return {H,LS,ring,trTs};
})();
const mass=[2.2,2.2,2.2,0.7,0.7,0.7];
let pre=0.65,loadW=0;
const pos=new Float32Array(18),vel=new Float32Array(18);
const dist3=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);
function refPos(){
  const bot=[],top=[];
  for(let i=0;i<3;i++){
    const a1=(-90+120*i)*D2R,a2=a1+PHI;
    bot.push([R*Math.cos(a1),0.06,R*Math.sin(a1)]);
    top.push([R*Math.cos(a2),0.06+REFG.H,R*Math.sin(a2)]);
  }
  return {bot,top};
}
/* 索:0-2 顶环,3-5 底环,6-8 侧索 */
const cables=[];
function buildCables(p){
  cables.length=0;
  const Ts0=60*p,Tr=REFG.trTs*Ts0;
  const rs=Math.max(0.3,REFG.LS-Ts0/KC),rr=Math.max(0.3,REFG.ring-Tr/KC);
  for(let i=0;i<3;i++){const j=(i+1)%3;
    cables.push({a:3+i,b:3+j,rest:rr,broken:false});}
  for(let i=0;i<3;i++){const j=(i+1)%3;
    cables.push({a:i,b:j,rest:rr,broken:false});}
  for(let i=0;i<3;i++){
    cables.push({a:3+i,b:i,rest:rs,broken:false});}
}
function doReset(){
  const {bot,top}=refPos();
  for(let i=0;i<3;i++){
    pos.set(bot[i],i*3);pos.set(top[i],(3+i)*3);
    vel[i*3]=vel[i*3+1]=vel[i*3+2]=0;
    vel[(3+i)*3]=vel[(3+i)*3+1]=vel[(3+i)*3+2]=0;
  }
  buildCables(pre);
}
buildCables(pre);doReset();

/* ---- 动态松弛物理(索只拉不压,杆双向弹簧,地面接触) ---- */
function physStep(h){
  const fx=new Float32Array(6),fy=new Float32Array(6),fz=new Float32Array(6);
  for(let i=0;i<6;i++){
    fy[i]-=9.81*mass[i];
    if(i>=3&&loadW>0)fy[i]-=loadW*9.81/3;
    if(i>=3)fx[i]+=0.12*Math.sin(simT*0.9+i*2.1); /* 轻微扰动,保持活性 */
  }
  for(const c of cables){
    if(c.broken)continue;
    const dx=pos[c.b*3]-pos[c.a*3],dy=pos[c.b*3+1]-pos[c.a*3+1],dz=pos[c.b*3+2]-pos[c.a*3+2];
    const len=Math.max(1e-6,Math.hypot(dx,dy,dz));
    if(len<=c.rest)continue;
    const T=KC*(len-c.rest)/len;
    fx[c.a]+=T*dx;fy[c.a]+=T*dy;fz[c.a]+=T*dz;
    fx[c.b]-=T*dx;fy[c.b]-=T*dy;fz[c.b]-=T*dz;
  }
  for(let i=0;i<3;i++){ /* 压杆:top_i ↔ bottom_{i-1}(与侧索反向) */
    const a=3+i,b=(i+2)%3;
    const dx=pos[b*3]-pos[a*3],dy=pos[b*3+1]-pos[a*3+1],dz=pos[b*3+2]-pos[a*3+2];
    const len=Math.max(1e-6,Math.hypot(dx,dy,dz));
    const F=KB*(len-LB)/len;
    fx[a]+=F*dx;fy[a]+=F*dy;fz[a]+=F*dz;
    fx[b]-=F*dx;fy[b]-=F*dy;fz[b]-=F*dz;
  }
  const damp=Math.max(0,1-2.2*h);
  for(let i=0;i<6;i++){
    vel[i*3]=(vel[i*3]+fx[i]/mass[i]*h)*damp;
    vel[i*3+1]=(vel[i*3+1]+fy[i]/mass[i]*h)*damp;
    vel[i*3+2]=(vel[i*3+2]+fz[i]/mass[i]*h)*damp;
    const sp=Math.hypot(vel[i*3],vel[i*3+1],vel[i*3+2]);
    if(sp>25){const s=25/sp;vel[i*3]*=s;vel[i*3+1]*=s;vel[i*3+2]*=s;}
    pos[i*3]+=vel[i*3]*h;pos[i*3+1]+=vel[i*3+1]*h;pos[i*3+2]+=vel[i*3+2]*h;
    if(pos[i*3+1]<0.06){ /* 地面接触:法向 + 摩擦 */
      pos[i*3+1]=0.06;
      if(vel[i*3+1]<0)vel[i*3+1]*=-0.25;
      const fr=Math.max(0,1-8*h);
      vel[i*3]*=fr;vel[i*3+2]*=fr;
    }
  }
}
function cableTension(c){
  if(c.broken)return 0;
  const len=Math.hypot(pos[c.b*3]-pos[c.a*3],pos[c.b*3+1]-pos[c.a*3+1],pos[c.b*3+2]-pos[c.a*3+2]);
  return Math.max(0,KC*(len-c.rest));
}

/* ---- 索/杆/节点网格 ---- */
const v3=new THREE.Vector3(),q=new THREE.Quaternion(),vY=new THREE.Vector3(0,1,0);
function orientMesh(mesh,x1,y1,z1,x2,y2,z2){
  v3.set(x2-x1,y2-y1,z2-z1);const len=Math.max(1e-4,v3.length());v3.normalize();
  mesh.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  mesh.quaternion.setFromUnitVectors(vY,v3);mesh.scale.set(1,len,1);
}
const barGeo=new THREE.CylinderGeometry(0.035,0.035,1,10);
const barM=new THREE.MeshStandardMaterial({color:0x7f95ad,roughness:0.3,metalness:0.65});
const bars=[];
for(let i=0;i<3;i++){const m=new THREE.Mesh(barGeo,barM);scene.add(m);bars.push(m);}
const cabGeo=new THREE.CylinderGeometry(0.016,0.016,1,6);
const cablesMesh=[];
for(let i=0;i<9;i++){
  const m=new THREE.Mesh(cabGeo,new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.5}));
  scene.add(m);cablesMesh.push(m);
}
const nodeM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.35,metalness:0.4});
const nodes=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,12,10),nodeM,6);
nodes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(nodes);
const m4=new THREE.Matrix4();
const NTOP=new THREE.Color(0xd8b4fe),NBOT=new THREE.Color(0xcfd8e3);
for(let i=0;i<6;i++)nodes.setColorAt(i,i<3?NBOT:NTOP);
nodes.instanceColor.needsUpdate=true;
/* 顶盘 + 连接柱 + 砝码(实例化) */
const trayM=new THREE.MeshStandardMaterial({color:0x9c36b5,roughness:0.4,metalness:0.3});
const tray=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.045,24),trayM);scene.add(tray);
const trayPostM=new THREE.MeshStandardMaterial({color:0xd8b4fe,roughness:0.5});
const trayPosts=[];
for(let i=0;i<3;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(0.013,0.013,1,6),trayPostM);scene.add(p);trayPosts.push(p);}
const weightM=new THREE.MeshStandardMaterial({color:0x55606e,roughness:0.35,metalness:0.6});
const weights=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.09,0.09,0.075,16),weightM,5);
weights.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(weights);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false,keepRatio=100;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('压杆:只顶不碰,像三根气撑杆','Struts: compression only, never touching'),
  new THREE.Vector3(1.45,1.55,0.55),'b');
addLabel(()=>L('受拉索网:预张力收走全部推力','Tensioned net: pretension collects every push'),
  new THREE.Vector3(-1.5,0.95,0.55),'r');
addLabel(()=>L('悬浮顶盘:由索"吊"住,不由杆撑','Floating tray: hung by cables, not propped'),
  new THREE.Vector3(0,2.55,0),'g',()=>keepRatio>40);
addLabel(()=>L('索色:灰 = 松弛 · 红 = 高张力','Cable color: gray = slack · red = high tension'),
  new THREE.Vector3(0,2.0,0),'o',()=>document.getElementById('tglScale').checked);

function setPre(v){
  pre=clamp(v,0,100)/100;
  document.getElementById('sPre').value=pre*100;
  document.getElementById('sPreVal').textContent=(pre*100).toFixed(0)+'%';
  buildCables(pre);
}
function setLoadW(v){
  loadW=clamp(v,0,5);
  document.getElementById('sW').value=loadW;
  document.getElementById('sWVal').textContent=loadW.toFixed(1)+' kg';
  document.getElementById('bTop').classList.toggle('on',loadW>0);
}
function cutCable(){
  for(const idx of [6,7,8,0,1,2,3,4,5]){
    if(!cables[idx].broken){cables[idx].broken=true;return;}
  }
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'压杆不接触:形状完全由索网决定',en:'Struts never touch: the shape is set entirely by the cable net',
  act(){setLoadW(0);setPre(65);doReset();}},
 {zh:'预张力先把系统"撑开"到位',en:'Pretension inflates the system into place',
  act(){setPre(100);}},
 {zh:'载荷沿索网重新分配,张力重排',en:'Load redistributes along the net — tensions rearrange',
  act(){setLoadW(4);}},
 {zh:'断一根索:局部松弛、整体重组',en:'Cut one cable: local slack, global reorganization',
  act(){cutCable();}},
 {zh:'零预紧对照:三根杆当场散架',en:'Zero-prestress control: the three struts collapse on the spot',
  act(){setLoadW(0);setPre(0);}},
 {zh:'从雕塑到太空:可展开天线与张拉整体',en:'From sculpture to space: deployable antennas and tensegrity',
  act(){setPre(85);doReset();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const t6=[6,7,8].map(i=>cableTension(cables[i]));
  const tPre=t6.reduce((a,b)=>a+b,0)/3;
  let tMax=0;for(const c of cables)tMax=Math.max(tMax,cableTension(c));
  let cy=0;for(let i=3;i<6;i++)cy+=pos[i*3+1];cy/=3;
  keepRatio=clamp((cy-0.06)/REFG.H*100,0,130);
  document.getElementById('stPre').innerHTML=tPre.toFixed(0)+'<small> N</small>';
  document.getElementById('stMax').innerHTML=tMax.toFixed(0)+'<small> N</small>';
  const ks=document.getElementById('stShape');
  ks.textContent=keepRatio.toFixed(0)+'%';
  ks.className='v '+(keepRatio<40?'warn':'ok');
  document.getElementById('stLoadN').innerHTML=(loadW*9.81).toFixed(0)+'<small> N</small>';
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bReset').addEventListener('click',()=>{doReset();});
document.getElementById('bTop').addEventListener('click',()=>{setLoadW(loadW>0?0:4);});
document.getElementById('bCut').addEventListener('click',()=>{cutCable();});
document.getElementById('sPre').addEventListener('input',e=>setPre(+e.target.value));
document.getElementById('sW').addEventListener('input',e=>setLoadW(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  tableM.color.setHex(dark?0x3a3f4b:0xbfb8ab);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const C_S0=new THREE.Color(0x6b7280),C_S1=new THREE.Color(0xff5c5c),cTmp=new THREE.Color();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  if(dts>0){
    const n=clamp(Math.ceil(dts/0.004),4,32),h=dts/n;
    for(let s=0;s<n;s++)physStep(h);
  }
  /* 压杆 */
  for(let i=0;i<3;i++){
    const a=3+i,b=(i+2)%3;
    orientMesh(bars[i],pos[a*3],pos[a*3+1],pos[a*3+2],pos[b*3],pos[b*3+1],pos[b*3+2]);
  }
  /* 索:张力着色与粗细 */
  for(let i=0;i<9;i++){
    const c=cables[i],m=cablesMesh[i];
    if(c.broken){m.scale.set(0.001,0.001,0.001);m.position.set(0,-99,0);continue;}
    orientMesh(m,pos[c.a*3],pos[c.a*3+1],pos[c.a*3+2],pos[c.b*3],pos[c.b*3+1],pos[c.b*3+2]);
    const T=cableTension(c),t=clamp(T/60,0,1);
    cTmp.lerpColors(C_S0,C_S1,t);
    m.material.color.copy(cTmp);
    const th=0.5+1.4*t;
    m.scale.x=th;m.scale.z=th;
  }
  /* 节点 */
  for(let i=0;i<6;i++){m4.makeTranslation(pos[i*3],pos[i*3+1],pos[i*3+2]);nodes.setMatrixAt(i,m4);}
  nodes.instanceMatrix.needsUpdate=true;
  /* 顶盘、连接柱与砝码 */
  let cx=0,cy=0,cz=0;
  for(let i=3;i<6;i++){cx+=pos[i*3];cy+=pos[i*3+1];cz+=pos[i*3+2];}
  cx/=3;cy/=3;cz/=3;
  const ty=cy+0.16;
  tray.position.set(cx,ty,cz);
  tray.rotation.y=simT*0.15;
  for(let i=0;i<3;i++){
    const j=3+i;
    orientMesh(trayPosts[i],cx,ty,cz,pos[j*3],pos[j*3+1]+0.05,pos[j*3+2]);
  }
  const nW=Math.ceil(loadW-0.01);
  for(let k=0;k<5;k++){
    if(k<nW){m4.makeTranslation(cx,ty+0.023+0.0375+k*0.075,cz);}
    else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);}
    weights.setMatrixAt(k,m4);
  }
  weights.instanceMatrix.needsUpdate=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setPre(65);setLoadW(0);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
