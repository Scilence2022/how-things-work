<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,60);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,0.1,300);
camera.position.set(0.5,3.3,10.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.5;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(22,64),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}

/* ── 场景:资源分配图。进程=左列圆球,资源=右列方块(下方计数点) ── */
const matP=new THREE.MeshStandardMaterial({color:0x5f8dff,roughness:0.35,metalness:0.3,emissive:0x1c3a8c,emissiveIntensity:0.3});
const matR=new THREE.MeshStandardMaterial({color:0xe8a33d,roughness:0.45,metalness:0.25});
const matDotOn=new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.3,emissive:0xffd43b,emissiveIntensity:0.55});
const matDotOff=new THREE.MeshStandardMaterial({color:0x3d4450,roughness:0.7});
const matAlloc=new THREE.LineBasicMaterial({color:0x35c8dd,transparent:true,opacity:0.95});
const matReq=new THREE.LineDashedMaterial({color:0xffd43b,dashSize:0.14,gapSize:0.09,transparent:true,opacity:0.95});
const matCyc=new THREE.LineBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.9});
const nodeG=new THREE.Group();scene.add(nodeG);
const edgeG=new THREE.Group();scene.add(edgeG);
const dotG=new THREE.Group();scene.add(dotG);

/* ── 状态与算法数据 ──
   银行家:avail=total-Σalloc;need=max-alloc;
   安全性:存在顺序使每个进程的 need ≤ 当前可用+前序完成者归还的资源 */
let mode='dead',N=4,M=2;
let total=[2,2],avail=[2,2],alloc=[],maxm=[],reqP=[];
let playing=true,labelsOn=true,slowMo=false,chipsOn=true;
let simT=0,demoPhase=1,demoT=0,demoHold=0,recOn=false,recStage=0,recT=0;
let bank={st:'idle',t:0,p:0,j:0,approved:0,suspKey:null,doneT:0};
let cycleKeys=null,edgeBorn={};
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const zeros=()=>Array.from({length:N},()=>new Array(M).fill(0));
const randInt=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* 进程节点 / 资源节点 / 计数点 */
let pMeshes=[],rMeshes=[],dots=[];
function colY(i,n){return n===1?2.4:4.0-(4.0-0.7)*i/(n-1);}
function recomputeAvail(){
  avail=total.slice();
  for(let i=0;i<N;i++)for(let j=0;j<M;j++)avail[j]-=alloc[i][j];
}
function findSafe(av,al,mx){
  const work=av.slice(),fin=al.map(()=>false),seq=[],nd=[];
  for(let i=0;i<N;i++){nd.push([]);for(let j=0;j<M;j++)nd[i].push(mx[i][j]-al[i][j]);}
  for(let pass=0;pass<N;pass++){
    for(let i=0;i<N;i++){
      if(fin[i])continue;
      let ok=true;for(let j=0;j<M;j++)if(nd[i][j]>work[j]){ok=false;break;}
      if(ok){fin[i]=true;seq.push(i);for(let j=0;j<M;j++)work[j]+=al[i][j];}
    }
    if(seq.length===N)return seq;
  }
  return null;
}
/* 环检测:P→R 为请求边,R→P 为分配边,DFS 找回路并回溯边键 */
function findCycleKeys(){
  const adj=new Map();
  const add=(a,b)=>{if(!adj.has(a))adj.set(a,[]);adj.get(a).push(b);};
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){
    if(alloc[i][j]>0)add(N+j,i);
    if(reqP[i][j]>0)add(i,N+j);
  }
  const color=new Array(N+M).fill(0),par=new Array(N+M).fill(-1);
  let cyc=null;
  const dfs=u=>{
    color[u]=1;
    for(const v of(adj.get(u)||[])){
      if(cyc)return;
      else if(color[v]===0){par[v]=u;dfs(v);}
      else if(color[v]===1){cyc=[[u,v]];let x=u;while(x!==v){cyc.push([par[x],x]);x=par[x];}}
    }
    color[u]=2;
  };
  for(let s=0;s<N+M&&cyc===null;s++)if(color[s]===0)dfs(s);
  if(!cyc)return null;
  const keys=new Set();
  for(const[a,b]of cyc){if(a>=N)keys.add('a'+b+'-'+(a-N));else keys.add('r'+a+'-'+(b-N));}
  return keys;
}

let edges=[];
function rebuildEdges(){
  for(const e of edges)edgeG.remove(e.line),e.line.geometry.dispose();
  edges=[];
  const list=[];cycleKeys=mode==='dead'?findCycleKeys():null;
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){
    if(alloc[i][j]>0)list.push({key:'a'+i+'-'+j,from:rMeshes[j].position,to:pMeshes[i].position,kind:'alloc'});
    if(reqP[i][j]>0)list.push({key:'r'+i+'-'+j,from:pMeshes[i].position,to:rMeshes[j].position,kind:'req'});
  }
  list.forEach((e,idx)=>{
    const dir=new THREE.Vector3().subVectors(e.to,e.from).normalize();
    const a=e.from.clone().addScaledVector(dir,0.36),b=e.to.clone().addScaledVector(dir,-0.38);
    const pts=[],SEG=16;
    for(let k=0;k<=SEG;k++)pts.push(a.clone().lerp(b,k/SEG));
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),matAlloc);
    line.geometry.setDrawRange(0,0);
    if(e.kind==='req')line.computeLineDistances();
    edgeG.add(line);
    if(!(e.key in edgeBorn))edgeBorn[e.key]=simT+idx*0.07;
    edges.push({line,key:e.key,kind:e.kind,born:edgeBorn[e.key]});
  });
  updateChips();
}
/* 四条件芯片:一条 CSS2D 承载四个小片 */
const chipsDiv=document.createElement('div');chipsDiv.className='chips';
const chipsObj=new CSS2DObject(chipsDiv);chipsObj.position.set(0,5.15,0);scene.add(chipsObj);
const chipEls=[];
function buildChips(){
  chipsDiv.innerHTML='';chipEls.length=0;
  const names=[L('互斥','Mutual excl.'),L('持有并等待','Hold & wait'),L('不可剥夺','No preemption'),L('循环等待','Circular wait')];
  for(const nm of names){
    const s=document.createElement('span');s.className='chip';s.textContent=nm;
    chipsDiv.appendChild(s);chipEls.push(s);
  }
}function updateChips(){
  let anyA=false,anyHW=false,anyNP=false;
  for(let i=0;i<N;i++){
    let ha=false,wa=false;
    for(let j=0;j<M;j++){if(alloc[i][j]>0)ha=true;if(reqP[i][j]>0)wa=true;}
    if(ha){anyA=true;if(wa)anyHW=true;}
  }
  for(let i=0;i<N;i++)for(let j=0;j<M;j++)if(reqP[i][j]>0&&avail[j]===0)anyNP=true;
  const st=[anyA,anyHW,anyNP,cycleKeys!==null];
  chipEls.forEach((c,i)=>c.classList.toggle('on',st[i]));
}
const statusDiv=document.createElement('div');statusDiv.className='lbl';
const statusObj=new CSS2DObject(statusDiv);statusObj.position.set(0,0.1,0);scene.add(statusObj);
function setStatus(text,cls){statusDiv.textContent=text;statusDiv.className='lbl '+cls;}

function rebuildGraph(){
  for(const o of[nodeG,edgeG,dotG]){o.traverse(m=>{if(m.geometry)m.geometry.dispose();});o.clear();}
  for(const r of labelReg)scene.remove(r.o);
  pMeshes=[];rMeshes=[];dots=[];edges=[];edgeBorn={};
  labelReg.length=0;
  alloc=zeros();reqP=zeros();avail=total.slice();
  const geoP=new THREE.SphereGeometry(0.27,22,18);
  for(let i=0;i<N;i++){
    const m=new THREE.Mesh(geoP,matP.clone());
    m.position.set(-2.3,colY(i,N),0);nodeG.add(m);pMeshes.push(m);
    addLabel(()=>'P'+(i+1),m.position.clone().add(new THREE.Vector3(-0.52,0.06,0)),'b');
  }
  const geoR=new THREE.BoxGeometry(0.54,0.54,0.54);
  for(let j=0;j<M;j++){
    const m=new THREE.Mesh(geoR,matR.clone());
    m.position.set(2.3,colY(j,M),0);nodeG.add(m);rMeshes.push(m);
    addLabel(()=>'R'+(j+1),m.position.clone().add(new THREE.Vector3(0,0.56,0)),'y');
    dots.push([]);
    for(let k=0;k<total[j];k++){
      const d=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8),matDotOn);
      d.position.set(2.3+(k-(total[j]-1)/2)*0.17,m.position.y-0.46,0);
      dotG.add(d);dots[j].push(d);
    }
  }
  rebuildEdges();
}
function refreshDots(){
  for(let j=0;j<M;j++)for(let k=0;k<dots[j].length;k++)dots[j][k].material=k<avail[j]?matDotOn:matDotOff;
}

/* ── 死锁演示:脚本化四步成环;释放=剥夺→完成→归还 ── */
function applyDemoPhase(p){
  demoPhase=p;
  alloc=zeros();reqP=zeros();  if(p>=1)alloc[0][0]=1;
  if(p>=2)alloc[1][1]=1;
  if(M===3)alloc[2][2]=1;
  if(p>=3)reqP[0][1]=1;
  if(p>=4)reqP[1][0]=1;
  recomputeAvail();rebuildEdges();refreshDots();
  demoHold=0;
  const msgs=[
    L('空场景:P1、P2 与 R1、R2','Empty stage: P1, P2 and R1, R2'),
    L('P1 已占用 R1 —— 互斥:资源一次一人','P1 holds R1 — mutual exclusion: one owner at a time'),
    L('P2 已占用 R2','P2 holds R2'),
    L('P1 抓着 R1,还要等 R2 —— 持有并等待','P1 holds R1 and now waits for R2 — hold-and-wait'),
    L('死锁!P1 ⇄ P2 循环等待,四条件凑齐','Deadlock! P1 ⇄ P2 circular wait — all four conditions met')];
  if(!recOn){
    if(p>=4)setStatus(msgs[4],'r');
    else setStatus(msgs[p],p>=1?'y':'');
  }
}
function startRecovery(){
  recOn=true;recStage=0;recT=0;
  setStatus(L('抢救:打破『不可剥夺』——剥夺 P1 的 R1','Rescue: break no-preemption — preempt R1 from P1'),'y');
}
const REC=[
 {t:1.1,run(){alloc[0][0]=0;recomputeAvail();rebuildEdges();refreshDots();setStatus(L('P1 被剥夺 R1(现实中=回滚/杀进程)','P1 preempted of R1 (in practice: rollback / kill)'),'y');}},
 {t:1.1,run(){alloc[1][0]=1;reqP[1][0]=0;recomputeAvail();rebuildEdges();refreshDots();setStatus(L('P2 拿到 R1,需求满足','P2 gets R1, its need is met'),'g');}},
 {t:1.2,run(){alloc[1][0]=0;alloc[1][1]=0;recomputeAvail();rebuildEdges();refreshDots();setStatus(L('P2 完成,归还 R1+R2','P2 finishes, returns R1+R2'),'g');}},
 {t:1.1,run(){alloc[0][1]=1;reqP[0][1]=0;recomputeAvail();rebuildEdges();refreshDots();setStatus(L('P1 获得 R2','P1 gets R2'),'g');}},
 {t:1.2,run(){alloc[0][0]=0;alloc[0][1]=0;recomputeAvail();rebuildEdges();refreshDots();setStatus(L('P1 完成,资源全还 —— 死锁解除','P1 finishes, all returned — deadlock cleared'),'g');}},
 {t:2.4,run(){recOn=false;recStage=0;demoT=0;applyDemoPhase(1);setStatus(L('重置推演:再看一遍成环','Replaying the cycle'),'');}},
];

/* ── 银行家模式:生成必然安全的状态,请求→假装批准→安全序列判定 ── */
function newBank(){
  total=[3,2];if(M===3)total.push(2);
  alloc=zeros();maxm=zeros();reqP=zeros();avail=total.slice();
  const order=[...Array(N).keys()];
  for(let i=order.length-1;i>0;i--){const k=randInt(0,i);[order[i],order[k]]=[order[k],order[i]];}
  for(const i of order){
    for(let j=0;j<M;j++){
      alloc[i][j]=randInt(0,Math.min(avail[j],2));
      maxm[i][j]=alloc[i][j]+randInt(0,Math.min(avail[j]-alloc[i][j],2));
    }
    for(let j=0;j<M;j++)avail[j]-=alloc[i][j];
  }
  bank={st:'idle',t:0,p:0,j:0,approved:0,suspKey:null,doneT:0};
  rebuildEdges();refreshDots();
  setStatus(L('银行家就位:每次批准前先沙盘推演','Banker ready: every grant is simulated first'),'');
}
function tryRequest(){
  const cands=[];
  for(let i=0;i<N;i++)for(let j=0;j<M;j++)if(maxm[i][j]-alloc[i][j]>0)cands.push([i,j]);
  if(!cands.length){
    bank.st='done';bank.t=0;
    setStatus(L('全部需求已满足 —— 重开一局','All needs met — dealing a new round'),'g');
    return;
  }
  const[i,j]=cands[randInt(0,cands.length-1)];
  bank.p=i;bank.j=j;reqP[i][j]=1;rebuildEdges();
  bank.st='req';bank.t=0;
  setStatus(L(`P${i+1} 请求 1×R${j+1} —— 假装批准,推演中…`,`P${i+1} asks 1×R${j+1} — pretend-grant, simulating…`),'y');
}
function seqName(seq){return seq.map(i=>'P'+(i+1)).join('→');}
function resolveRequest(){
  const{p,j}=bank;
  avail[j]--;alloc[p][j]++;
  const seq=findSafe(avail,alloc,maxm);
  if(seq){
    bank.approved++;reqP[p][j]=0;bank.suspKey=null;
    setStatus(L(`批准 ✓ 安全序列 ${seqName(seq)}`,`Granted ✓ safe sequence ${seqName(seq)}`),'g');
  }else{
    avail[j]++;alloc[p][j]--;
    bank.suspKey='r'+p+'-'+j;
    setStatus(L(`挂起:P${p+1} 的请求会把系统带进死角`,`Suspended: granting P${p+1} would corner the system`),'r');
  }
  bank.st='result';bank.t=0;
  rebuildEdges();refreshDots();
}

function setMode(m){
  mode=m;edgeBorn={};
  document.getElementById('bDead').classList.toggle('on',m==='dead');
  document.getElementById('bBank').classList.toggle('on',m==='bank');
  total=m==='dead'?[2,2]:[3,2];if(M===3)total.push(2);
  rebuildGraph();
  if(m==='dead'){applyDemoPhase(1);demoT=0;demoHold=0;recOn=false;recStage=0;}
  else newBank();
  updateStats();
}
document.getElementById('bDead').addEventListener('click',()=>setMode('dead'));
document.getElementById('bBank').addEventListener('click',()=>setMode('bank'));
document.getElementById('bInject').addEventListener('click',()=>{
  if(mode==='dead'){
    if(recOn)return;
    if(demoPhase<4){demoT=0;applyDemoPhase(demoPhase+1);}
    else startRecovery();
  }else if(bank.st==='idle'){bank.t=0;tryRequest();}
});
document.getElementById('bRelease').addEventListener('click',()=>{
  if(mode==='dead'){if(demoPhase>=4&&!recOn)startRecovery();}
  else if(bank.st==='idle'){
    const cands=[];
    for(let i=0;i<N;i++)for(let j=0;j<M;j++)if(alloc[i][j]>0)cands.push([i,j]);
    if(!cands.length)return;
    const[i,j]=cands[randInt(0,cands.length-1)];
    alloc[i][j]--;avail[j]++;
    rebuildEdges();refreshDots();
    setStatus(L(`剥夺:P${i+1} 交出 1×R${j+1} —— 不可剥夺被打破`,`Preempted: P${i+1} surrenders 1×R${j+1}`),'y');
  }
});document.getElementById('bReset').addEventListener('click',()=>setMode(mode));

const STEPS=[
 {zh:'<b>互斥</b>:资源一次只能归一个进程——R1 到了 P1 手里,别人只能排队',
  en:'<b>Mutual exclusion</b>: a resource has one owner at a time — once R1 is P1\u2019s, everyone else queues',act(){setMode('dead');applyDemoPhase(1);}},
 {zh:'<b>持有并等待</b>:P1 抓着 R1 不放,还要伸手要 R2——一边占有一边等待',
  en:'<b>Hold-and-wait</b>: P1 keeps R1 while asking for R2 — holding one hand out and another one open',act(){setMode('dead');applyDemoPhase(3);}},
 {zh:'<b>不可剥夺</b>:R1、R2 都不能硬抢,只能等持有者自愿放手',
  en:'<b>No preemption</b>: neither R1 nor R2 can be seized — you wait for the owner to let go',act(){setMode('dead');applyDemoPhase(4);}},
 {zh:'<b>循环等待成环</b>:P1 等 R2、P2 等 R1,请求边连成环路——全场停摆,四条件凑齐',
  en:'<b>Circular wait</b>: P1 waits on R2, P2 waits on R1 — the request edges close a loop and everything stalls',act(){setMode('dead');applyDemoPhase(4);}},
 {zh:'<b>银行家:假装批准</b>:每次请求先做沙盘推演——批准之后,还能找出人人能走完的安全序列吗?',
  en:'<b>Banker: pretend-grant</b>: simulate every request first — after granting, does a safe sequence still exist?',act(){setMode('bank');}},
 {zh:'<b>批准或挂起</b>:找得到序列就放行,找不到就把请求挂起——宁可排队,不进死角',
  en:'<b>Grant or suspend</b>: commit when a sequence exists, suspend when it does not — queueing beats a corner',act(){setMode('bank');bank.t=99;}},
 {zh:'<b>预防死锁</b>:一次性申请全部资源、允许剥夺、或给资源定序按号申请——拆掉任一条件,环就成不了',
  en:'<b>Prevention</b>: request everything up front, allow preemption, or order resources — remove one condition and no cycle can close',act(){setMode('dead');applyDemoPhase(1);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();updateStats();}

function updateStats(){
  const e1=document.getElementById('stState'),e2=document.getElementById('stSeq'),
    e3=document.getElementById('stAvail'),e4=document.getElementById('stReq');
  e3.innerHTML=avail.reduce((a,b)=>a+b,0)+'<small> 个</small>';
  if(mode==='dead'){
    e4.textContent='—';e2.textContent='—';
    if(recOn){e1.textContent=L('解除中','Clearing');e1.className='v';}
    else if(demoPhase>=4){e1.textContent=L('死锁','Deadlock');e1.className='v warn';}
    else{e1.textContent=L('推演中','Building');e1.className='v';}
  }else{
    e4.innerHTML=bank.approved+'<small> 笔</small>';
    if(bank.st==='done'){e1.textContent=L('全部满足','All met');e1.className='v ok';e2.textContent='—';}
    else{
      const seq=findSafe(avail,alloc,maxm);
      e1.textContent=seq?L('安全','Safe'):L('不安全','Unsafe');
      e1.className='v '+(seq?'ok':'warn');
      e2.textContent=seq?seqName(seq):'—';
    }
  }
  updateChips();
}

document.getElementById('sN').addEventListener('input',e=>{
  N=clamp(+e.target.value,3,5);
  document.getElementById('sNVal').textContent=N+' '+L('个','');
  setMode(mode);
});
document.getElementById('sM').addEventListener('input',e=>{
  M=clamp(+e.target.value,2,3);
  document.getElementById('sMVal').textContent=M+' '+L('类','');
  setMode(mode);
});
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{
  labelsOn=e.target.checked;
  for(const r of labelReg)r.o.visible=labelsOn;
});
document.getElementById('tglChips').addEventListener('change',e=>{chipsOn=e.target.checked;chipsObj.visible=chipsOn;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildChips();updateChips();
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  if(mode==='dead'){
    if(recOn){
      recT+=dts;
      if(recT>=REC[recStage].t){recT=0;REC[recStage].run();recStage++;
        if(recStage>=REC.length){recOn=false;recStage=0;}}
    }else if(demoPhase<4){
      demoT+=dts;
      if(demoT>2.1){demoT=0;applyDemoPhase(demoPhase+1);}
    }else if((demoHold+=dts)>6){demoHold=0;startRecovery();}
    const hot=demoPhase>=4&&!recOn;
    pMeshes.forEach((m,i)=>{
      const target=(hot&&i<2)?0.9+0.5*Math.sin(simT*6):0.3;
      m.material.emissiveIntensity+=(target-m.material.emissiveIntensity)*Math.min(1,dt*8);
      m.material.emissive.setHex(hot&&i<2?0xc22626:0x1c3a8c);
    });
  }else{
    bank.t+=dts;
    if(bank.st==='idle'&&bank.t>2.3){bank.t=0;tryRequest();}
    else if(bank.st==='req'&&bank.t>1.0)resolveRequest();
    else if(bank.st==='result'&&bank.t>1.3){
      reqP[bank.p][bank.j]=0;bank.suspKey=null;bank.st='idle';bank.t=0;rebuildEdges();
    }else if(bank.st==='done'&&bank.t>2.2)newBank();
    pMeshes.forEach(m=>{m.material.emissiveIntensity+=(0.3-m.material.emissiveIntensity)*Math.min(1,dt*8);});
  }
  for(const e of edges){
    const k=clamp((simT-e.born)/0.45,0,1);
    e.line.geometry.setDrawRange(0,Math.max(2,Math.ceil(17*k)));
    e.line.material=e.key===bank.suspKey?matCyc:e.kind==='alloc'?matAlloc:e.kind==='req'?matReq:matCyc;
  }
  matCyc.opacity=0.72+0.28*Math.sin(simT*6);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  statusObj.visible=labelsOn;chipsObj.visible=labelsOn&&chipsOn;
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildChips();buildSteps();
setMode('dead');
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
