<style>

  *{margin:0;padding:0;box-sizing:border-box}

    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-6.5,4.6,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.9,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=80;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 页面场景 ---- */
/* ---- 巢脾（倾斜 34° 的六棱柱阵列）---- */
const combG=new THREE.Group();combG.position.set(-2.6,1.9,0);combG.rotation.x=-0.60;scene.add(combG);
const frameBd=new THREE.Mesh(new THREE.BoxGeometry(4.6,4.6,0.12),new THREE.MeshStandardMaterial({color:0x6b4f2a,roughness:0.8}));
frameBd.position.z=-0.32;combG.add(frameBd);
const cellG=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.20,0.20,0.34,6),
  new THREE.MeshStandardMaterial({color:0xe8b84b,roughness:0.55}),300);
{const m=new THREE.Matrix4(),q=new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2,0,0));
 let k=0;
 for(let r=-5;r<=5;r++)for(let c=-5;c<=5;c++){
   const x=c*0.365+(r%2?0.182:0),y=r*0.317;
   if(x*x+y*y>4.4)continue;
   m.compose(new THREE.Vector3(x,y,0.02),q,new THREE.Vector3(1,1,1));
   cellG.setMatrixAt(k++,m);}
 cellG.count=k;}
combG.add(cellG);
/* 垂直参考线：上=太阳方位 */
const refGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-1.6,0.2),new THREE.Vector3(0,1.9,0.2)]);
combG.add(new THREE.Line(refGeo,new THREE.LineDashedMaterial({color:0xffd43b,dashSize:0.12,gapSize:0.09})));
refGeo.computeLineDistances?refGeo.computeLineDistances():0;
{const ln=combG.children[combG.children.length-1];ln.computeLineDistances();}
/* ---- 舞者 ---- */
const bee=new THREE.Group();combG.add(bee);
const bodyM=new THREE.MeshStandardMaterial({color:0xf4b23e,roughness:0.5,emissive:0x8a5a00,emissiveIntensity:0.25});
const body=new THREE.Mesh(new THREE.SphereGeometry(0.16,14,12),bodyM);body.scale.set(1,0.8,1.7);bee.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),new THREE.MeshStandardMaterial({color:0x2b2115,roughness:0.6}));
head.position.set(0,0.02,0.26);bee.add(head);
const wingM=new THREE.MeshStandardMaterial({color:0xdfe8f2,transparent:true,opacity:0.55,side:THREE.DoubleSide});
const wingL=new THREE.Mesh(new THREE.SphereGeometry(0.14,8,6),wingM);wingL.scale.set(1.6,0.12,0.55);wingL.position.set(0.12,0.12,0);bee.add(wingL);
const wingR=wingL.clone();wingR.position.x=-0.12;bee.add(wingR);
/* 摇摆轨迹残影 */
const trailG=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,6,6),
  new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.5}),90);
trailG.count=0;combG.add(trailG);
/* ---- 地图平面（罗盘）---- */
const mapG=new THREE.Group();mapG.position.set(3.4,0.02,2.6);scene.add(mapG);
const mapD=new THREE.Mesh(new THREE.CylinderGeometry(3.1,3.1,0.1,40),new THREE.MeshStandardMaterial({color:0x243024,roughness:0.9}));
mapD.position.y=0.05;mapG.add(mapD);
for(let a=0;a<12;a++){
  const tick=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.02,0.3),new THREE.MeshBasicMaterial({color:0x9fb0c3}));
  const ra=a*Math.PI/6;tick.position.set(Math.sin(ra)*2.85,0.11,Math.cos(ra)*2.85);tick.rotation.y=ra;mapG.add(tick);
}
const hiveM=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.42,0.5),new THREE.MeshStandardMaterial({color:0xe8b84b,roughness:0.6}));
hiveM.position.y=0.31;mapG.add(hiveM);
const sunM=new THREE.Mesh(new THREE.SphereGeometry(0.24,14,10),new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xe67700,emissiveIntensity:0.9}));
mapG.add(sunM);
const foodM=new THREE.Group();mapG.add(foodM);
const flowerM=new THREE.MeshStandardMaterial({color:0xff8fab,roughness:0.5});
const flowerC=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.5});
for(let i=0;i<5;i++){
  const f=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,6),i%2?flowerM:flowerC);
  const a=i*1.3;f.position.set(Math.sin(a)*0.35,0.2,Math.cos(a)*0.35);foodM.add(f);
  const st=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.02,0.24,6),new THREE.MeshStandardMaterial({color:0x2f9e44}));
  st.position.set(f.position.x,0.1,f.position.z);foodM.add(st);
}
/* 解码箭头（地图上：巢→食物方向）与太阳光箭头 */
function makeFlatArrow(color){
  const g=new THREE.Group();
  const m=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:0.35});
  const sh=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.02,1.6),m);sh.position.z=0.8;g.add(sh);
  const hd=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.4,10),m);hd.rotation.x=Math.PI/2;hd.position.z=1.75;g.add(hd);
  g.visible=false;mapG.add(g);return g;
}
const foodArrow=makeFlatArrow(0xff6b6b);
const sunArrow=makeFlatArrow(0xffd43b);
/* 跟随蜂（小点从巢飞向食物） */
const FN=14;
const flockG=new THREE.InstancedMesh(new THREE.SphereGeometry(0.07,8,6),
  new THREE.MeshStandardMaterial({color:0xf4b23e,emissive:0x8a5a00,emissiveIntensity:0.3}),FN);
flockG.count=0;mapG.add(flockG);
const flock=[];for(let i=0;i<FN;i++)flock.push({p:Math.random(),fly:false});
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('巢脾垂直面 = 天空平面：上=太阳','Comb face = sky map: up = sun'),new THREE.Vector3(-2.6,4.6,0),'y');
addLabel(()=>L('摇摆跑：偏角 φ 相对垂直线','Waggle run: angle φ from vertical'),new THREE.Vector3(-5.4,2.4,0),'o',
  ()=>playing);
addLabel(()=>L('太阳方位 S（随时刻西移）','Sun azimuth S (drifts west)'),new THREE.Vector3(6.8,1.6,2.6),'y',()=>tglSunEl.checked);
addLabel(()=>L('解码：食物方位 = S + φ','Decode: food bearing = S + φ'),new THREE.Vector3(5.6,2.2,0.2),'r',()=>tglArrowEl.checked);
addLabel(()=>L('摇摆时长 ≈ 距离（1 s ≈ 1 km）','Waggle seconds ≈ km'),new THREE.Vector3(-5.2,-0.2,0),'b');

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0;
let hour=9,foodAz=240,distKm=1.5;
let loops=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
function sunAz(){return (90+(hour-6)*15)%360;}          // 6h→东 90°，12h→南 180°
function danceAngle(){                                   // 巢脾偏角 = 食物-太阳，规到 (-180,180]
  let d=(foodAz-sunAz())%360;if(d>180)d-=360;if(d<-180)d+=360;return d;
}
function setHour(h){hour=h;document.getElementById('sHour').value=h;
  const hh=Math.floor(h),mm=Math.round((h-hh)*60);
  document.getElementById('sHourVal').textContent=hh+':'+String(mm).padStart(2,'0');}
function setFood(a){foodAz=a;document.getElementById('sFood').value=a;
  document.getElementById('sFoodVal').textContent=a.toFixed(0)+'°';}
function setDist(d){distKm=d;document.getElementById('sDist').value=d;
  document.getElementById('sDistVal').textContent=d.toFixed(1)+' km';}
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'侦察蜂找到花田，回巢上舞台',en:'A scout finds the flowers and dances on the comb'},
 {zh:'巢脾垂直面当天空平面用：正上方 = 正对太阳飞',en:'The vertical comb stands in for the sky: straight up = fly toward the sun'},
 {zh:'摇摆跑偏角 φ = 食物方位 − 太阳方位',en:'Waggle angle φ = food bearing − sun azimuth'},
 {zh:'摇摆时长编码距离：约 1 s ≈ 1 km',en:'Waggle duration encodes distance: ≈1 s per km'},
 {zh:'太阳每小时西移 15°：钟补偿让同一朵花的角度随时刻变',en:'Sun drifts 15°/h: the dance clock re-angles the same flower all day'},
 {zh:'跟随蜂触角读舞，解码起飞——群体导航协议',en:'Followers read the dance with their antennae and fly — a colony nav protocol'}
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
activeStep=i;
  if(i===0){setHour(9);setFood(240);setDist(1.5);}
  else if(i===2){setFood(sunAz());}      // φ=0：正对太阳
  else if(i===3){setDist(3.0);}
  else if(i===4){setHour(15);setFood(240);}
  else {setHour(9);setFood(240);}
 syncSteps();
}

/* ---- 读数 ---- */
function updateStats(){
const sunEl=document.getElementById('stSun');
  sunEl.innerHTML=sunAz().toFixed(0)+'<small>°</small>';
  const angEl=document.getElementById('stAng');
  angEl.innerHTML=danceAngle().toFixed(0)+'<small>°</small>';
  angEl.className='v'+(Math.abs(danceAngle())>90?' warn':'');
  document.getElementById('stWag').innerHTML=(distKm*0.75+0.35).toFixed(2)+'<small> s</small>';
  document.getElementById('stDist').innerHTML=distKm.toFixed(1)+'<small> km</small>';
  document.getElementById('stLoop').textContent=loops;
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  if(typeof groundM!=='undefined')groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
/* 舞蹈循环：摇摆跑(上) → 右半圆回 → 摇摆跑(上) → 左半圆回 */
  const LOOP=2.6,WR=0.30;
  if(playing){
    const p=(simT%LOOP)/LOOP;
    const phi=danceAngle()*Math.PI/180;
    const ux=Math.sin(phi),uy=Math.cos(phi);      // 巢脾局部坐标：x 右，y 上
    const runLen=0.95,wag=0.05;
    let px,py;
    if(p<WR){const s=p/WR;px=ux*s*runLen+(-uy)*wag*Math.sin(s*44);py=uy*s*runLen+ux*wag*Math.sin(s*44);}
    else if(p<0.5+WR/2){
      const s=(p-WR)/(0.5-WR/2);
      const cx=ux*runLen/2,cy=uy*runLen/2,R=runLen/2;
      const a0=Math.atan2(uy,ux),a1=Math.atan2(-uy,-ux);
      let da=a1-a0;while(da>0)da-=Math.PI*2;while(da<-Math.PI*2)da+=Math.PI*2;
      const a=a0+da*s;px=cx+Math.cos(a+Math.PI)*R*0+Math.cos(a)*R;py=cy+Math.sin(a)*R;
      px=cx+Math.cos(a)*R;py=cy+Math.sin(a)*R;
    }
    else if(p<0.8){const s=(p-0.5-WR/2)/WR;px=ux*s*runLen+(-uy)*wag*Math.sin(s*44);py=uy*s*runLen+ux*wag*Math.sin(s*44);}
    else{
      const s=(p-0.8)/(0.2);
      const cx=ux*runLen/2,cy=uy*runLen/2,R=runLen/2;
      const a0=Math.atan2(uy,ux),a1=Math.atan2(-uy,-ux);
      let da=a1-a0;while(da<0)da+=Math.PI*2;while(da>Math.PI*2)da-=Math.PI*2;
      const a=a0+da*s;px=cx+Math.cos(a)*R;py=cy+Math.sin(a)*R;
    }
    bee.position.set(px,py,0.20);
    bee.rotation.z=-phi+(p>=WR&&p<0.5+WR/2)||(p>=0.8)?Math.PI:0;
    bee.lookAt?0:0;
    wingL.rotation.z=0.5+0.6*Math.sin(simT*90);
    wingR.rotation.z=-0.5-0.6*Math.sin(simT*90);
    /* 残影 */
    if(tglTrailEl.checked){
      const k=Math.floor(simT*22)%90;
      const m=new THREE.Matrix4();m.setPosition(px,py,0.18);trailG.setMatrixAt(k,m);
      trailG.count=Math.max(trailG.count,Math.min(90,k+1));
    }else trailG.count=0;
    if(p<0.01&&simT>0.5)loops++;
  }
  /* 地图：太阳标记与解码箭头 */
  const sAz=sunAz()*Math.PI/180,fAz=foodAz*Math.PI/180;
  sunM.position.set(Math.sin(sAz)*2.7,0.35,Math.cos(sAz)*2.7);
  sunM.visible=tglSunEl.checked;
  sunArrow.visible=tglSunEl.checked;sunArrow.rotation.y=sAz;sunArrow.position.y=0.16;
  foodM.position.set(Math.sin(fAz)*clamp(distKm*0.62,0.4,2.6),0,Math.cos(fAz)*clamp(distKm*0.62,0.4,2.6));
  foodArrow.visible=tglArrowEl.checked;
  foodArrow.rotation.y=fAz;foodArrow.position.set(hiveM.position.x,0.14,hiveM.position.z);
  foodArrow.scale.z=clamp(distKm*0.62,0.4,2.6)/1.6;
  /* 跟随蜂 */
  if(playing&&tglFlockEl.checked){
    if(Math.random()<dt*0.5){const f=flock.find(f=>!f.fly);if(f){f.fly=true;f.p=0;}}
    let k=0;
    for(const f of flock){
      if(f.fly){
        f.p+=dt*0.45;
        if(f.p>=1){f.fly=false;continue;}
        const r=f.p*clamp(distKm*0.62,0.4,2.6);
        const m=new THREE.Matrix4();
        m.setPosition(Math.sin(fAz)*r+Math.sin(k*7+simT*3)*0.1,0.24+0.12*Math.sin(simT*9+k),Math.cos(fAz)*r);
        flockG.setMatrixAt(k,m);k++;
      }
    }
    flockG.count=k;
  }else flockG.count=0;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const tglSunEl=document.getElementById('tglSun');
const tglArrowEl=document.getElementById('tglArrow');
const tglTrailEl=document.getElementById('tglTrail');
const tglFlockEl=document.getElementById('tglFlock');
document.getElementById('sHour').addEventListener('input',e=>setHour(+e.target.value));
document.getElementById('sFood').addEventListener('input',e=>setFood(+e.target.value));
document.getElementById('sDist').addEventListener('input',e=>setDist(+e.target.value));
document.getElementById('bMorning').addEventListener('click',()=>setHour(9));
document.getElementById('bNoon').addEventListener('click',()=>setHour(12));
document.getElementById('bAft').addEventListener('click',()=>setHour(15));
document.getElementById('tglArrow').addEventListener('change',e=>{});
document.getElementById('tglSun').addEventListener('change',e=>{});
document.getElementById('tglFlock').addEventListener('change',e=>{});
document.getElementById('tglTrail').addEventListener('change',e=>{});
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setHour(9);setFood(240);setDist(1.5);
syncSteps();updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
