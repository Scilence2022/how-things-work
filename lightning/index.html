<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪电 · 梯级先导与回击</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.p { color: #ffccd5; border-color: rgba(255,143,163,.7); }
  .chip.n { color: #a5d8ff; border-color: rgba(116,192,252,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(99,230,190,.2); border-color: rgba(99,230,190,.6); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="闪电:梯级先导与回击" data-en="Lightning: stepped leader &amp; return stroke">闪电：梯级先导与回击</h1>
  <div class="sub" data-zh="冰晶摩擦分离电荷 → 云底负电荷击穿空气,梯级先导下探 → 地面正电上迎 → 回击亮屏——3 万安培的一次短路 · 空格播放/暂停" data-en="Ice friction separates charge → negative cloud base breaks down in a stepped leader → ground positives reach up → the return stroke floods with light — a 30 kA short circuit · Space = play/pause">冰晶摩擦分离电荷 → 云底负电荷击穿空气，梯级先导下探 → 地面正电上迎 → 回击亮屏——3 万安培的一次短路 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="阶段" data-en="phase">阶段</span><span class="v" id="stPh" style="font-size:14px">—</span>
  <span class="k" data-zh="云底电压" data-en="cloud potential">云底电压</span><span class="v g" id="stV">—</span>
  <span class="k" data-zh="放电峰值" data-en="peak current">放电峰值</span><span class="v" id="stI">—</span>
  <span class="k" data-zh="已放电次数" data-en="strikes">已放电次数</span><span class="v" id="stN">0</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.p" data-zh="正电荷(红,云顶/地面)" data-en="positive (red, cloud top / ground)">正电荷(红,云顶/地面)</span>
    <span class="chip.n" data-zh="负电荷(蓝,云底)" data-en="negative (blue, cloud base)">负电荷(蓝,云底)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnCharge" data-zh="充入电荷" data-en="charge the cloud">充入电荷</button>
    <button class="abtn" id="btnRod" data-zh="避雷针:关" data-en="lightning rod: OFF">避雷针:关</button>
  </div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../em-wave/" data-zh="雷是声,光是电磁波" data-en="thunder is sound, lightning is EM">雷是声,光是电磁波</a>
    <a href="../lightning/" data-zh="家族:静电与放电" data-en="family: static and discharge">家族:静电与放电</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xcfd8e4 : 0x0c1119);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('闪电', 'Lightning');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 1.9, 7.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  cloud: mat(0x5a6a7d, { opacity: 0.75, emissiveIntensity: 0.05 }),
  ground: mat(0x2c5f3e, { opacity: 1 }),
  pos: new THREE.MeshBasicMaterial({ color: 0xff8787 }),
  neg: new THREE.MeshBasicMaterial({ color: 0x74c0fc }),
  bolt: new THREE.MeshBasicMaterial({ color: 0xfff3bf, blending: THREE.AdditiveBlending, transparent: true }),
  rod: mat(0xb197fc, { metalness: 0.6 }),
};
const base = new THREE.Mesh(new THREE.BoxGeometry(9, 0.2, 5), M.ground);
base.position.y = -0.1;
scene.add(base);

/* 云(一团球) */
const cloudGrp = new THREE.Group();
scene.add(cloudGrp);
for (let i = 0; i < 26; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.3 + Math.random() * 0.25, 14, 10), M.cloud);
  m.position.set((Math.random() - 0.5) * 3.4, 3.4 + Math.random() * 0.7, (Math.random() - 0.5) * 1.6);
  cloudGrp.add(m);
}
/* 云内电荷:顶部红(+)、底部蓝(−),摩擦后分家 */
const charges = [];
for (let i = 0; i < 40; i++) {
  const top = i < 20;
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), top ? M.pos : M.neg);
  m.position.set((Math.random() - 0.5) * 2.6, top ? 4.1 + Math.random() * 0.35 : 3.15 + Math.random() * 0.25, (Math.random() - 0.5) * 1.2);
  scene.add(m);
  charges.push({ mesh: m, top });
}
/* 地面正电荷 */
const gPos = [];
for (let i = 0; i < 16; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), M.pos);
  m.position.set((Math.random() - 0.5) * 3.4, 0.1, (Math.random() - 0.5) * 2.2);
  scene.add(m);
  gPos.push(m);
}
/* 避雷针 */
const rod = new THREE.Group();
{
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 1.0, 8), M.rod);
  pole.position.y = 0.5;
  rod.add(pole);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 8), M.rod);
  tip.position.y = 1.06;
  rod.add(tip);
}
rod.position.set(1.7, 0.1, 0);
rod.visible = false;
scene.add(rod);
/* 树 */
const tree = new THREE.Group();
{
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.7, 8), mat(0x6b4a2f));
  trunk.position.y = 0.35;
  tree.add(trunk);
  const crown = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 10), mat(0x2f9e44));
  crown.position.y = 0.85;
  tree.add(crown);
}
tree.position.set(-1.9, 0.1, 0.6);
scene.add(tree);

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let voltage = 30;          // MV,云底电位
let rodOn = false;
let tSim = 0;
let strikes = 0;
let bolt = null;           // {group, leaderT, flashT, path}
let phaseName = L('电荷分离中', 'separating charge');
const BOLT_V = 60;         // 起晕电压

/* 生成闪电折线路径 */
function mkBoltPath(x0, y0, x1, y1) {
  const pts = [new THREE.Vector3(x0, y0, 0)];
  let cur = pts[0].clone();
  const segs = 9;
  for (let i = 1; i <= segs; i++) {
    cur = cur.clone().add(new THREE.Vector3(
      (x1 - x0) / segs + (Math.random() - 0.5) * 0.5,
      (y1 - y0) / segs + (Math.random() - 0.5) * 0.1,
      (Math.random() - 0.5) * 0.2));
    pts.push(cur.clone());
  }
  pts[pts.length - 1].set(x1, y1, 0);
  return pts;
}
function fireBolt() {
  const target = rodOn ? new THREE.Vector3(1.7, 1.1, 0) : new THREE.Vector3((Math.random() - 0.5) * 2.4, 0.02, 0);
  const pts = mkBoltPath((Math.random() - 0.5) * 1.2, 3.2, target.x, target.y);
  const g = new THREE.Group();
  const lineMat = M.bolt;
  const lines = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const d = new THREE.Vector3().subVectors(pts[i + 1], pts[i]);
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1, 5), lineMat);
    seg.position.copy(pts[i]).addScaledVector(d, 0.5);
    seg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
    seg.scale.y = d.length();
    seg.visible = false;
    g.add(seg);
    lines.push(seg);
  }
  scene.add(g);
  bolt = { group: g, lines, leaderT: 0, flashT: 0, path: pts, x: target.x };
  voltage = 0;
  strikes++;
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblCloud = addLabel(() => L('冰晶与霰粒在云里摩擦碰撞:轻的正电荷被上升气流抬到顶,重的负电荷沉在底', 
  'ice and graupel collide in the cloud: light positives ride the updraft to the top, heavy negatives sink to the base'),
  new THREE.Vector3(0, 4.7, 0), 'st');
const lblGround = addLabel(() => rodOn
  ? L('避雷针:尖端优先积聚电荷、率先放电——把闪电引到无人的金属线上', 
      'the rod: charge piles on the tip and discharges first — leading the bolt down a harmless wire')
  : L('地面感应出正电荷,跟着云底负电荷的脚步走', 'the ground gains induced positive charge, following the negative base'),
  new THREE.Vector3(0, 0.55, 0), rodOn ? 'e' : 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '电荷分离:云充电', be: 'Charge separation: the cloud charges',
    d: '对流云里冰晶霰粒疯狂碰撞摩擦:轻的正电荷升顶、重的负电荷沉底——云变成一个巨大的电容器。按「充入电荷」加压。',
    de: 'Ice and graupel collide wildly in the convective cloud: light positives ride high, heavy negatives sink — the cloud becomes a giant capacitor. Charge it.',
    act: () => { voltage = Math.min(90, voltage + 22); } },
  { b: '击穿:梯级先导下探', be: 'Breakdown: the stepped leader',
    d: '场强超过 3 kV/cm,空气被击穿。负电荷以 50 米一级、每级停 50 µs 的节奏「摸黑」下探——肉眼看到的是闪烁分叉。',
    de: 'Past ~3 kV/cm air breaks down. Negative charge probes downward 50 m a step, pausing 50 µs each — the flickering fork you see.',
    act: () => { voltage = 80; } },
  { b: '上行先导:地面上迎', be: 'Upward streamer: the ground reaches up',
    d: '先导接近地面时,尖端(树、塔、避雷针)感应出强正电,向上迎出一条上行先导——谁先接上,雷打谁。',
    de: 'As the leader nears, tips (trees, towers, rods) spark upward-streamers — whoever connects first takes the strike.',
    act: () => { voltage = 80; } },
  { b: '回击:真正的闪电', be: 'The return stroke: the real flash',
    d: '接通的瞬间,地面向上倾泻反极性电流——3 万安培、3 万度,把通道烧成白炽。你看到的亮闪是「回击」,从下往上跑。',
    de: 'On contact the ground dumps the return stroke — 30 kA at 30,000 K, incandescing the channel. The flash you see runs bottom-up.',
    act: () => { voltage = 80; } },
  { b: '避雷针:驯服闪电', be: 'The rod: taming the bolt',
    d: '富兰克林的尖针不是「吸收」闪电而是「预定」它:尖端场强最高、最早发出上行先导,把雷引到接地的金属线上。',
    de: 'Franklin\'s spike does not absorb lightning — it books it: the tip has the highest field and streams first, leading the strike down a grounded wire.',
    act: () => document.getElementById('btnRod').click() },
];
function stepIndex() {
  if (bolt) return bolt.leaderT < 1 ? 1 : 3;
  if (voltage > BOLT_V * 0.7) return 0;
  return rodOn ? 4 : 2;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const btnRod = document.getElementById('btnRod');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnRod.addEventListener('click', () => {
  rodOn = !rodOn;
  btnRod.classList.toggle('on', rodOn);
  btnRod.textContent = rodOn ? L('避雷针:开', 'lightning rod: ON') : L('避雷针:关', 'lightning rod: OFF');
  rod.visible = rodOn;
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 闪电动画 ================= */
function boltTick(dts) {
  /* 自然充电 */
  voltage = Math.min(90, voltage + dts * 2.4);
  if (!bolt && voltage >= BOLT_V && playing) fireBolt();
  if (bolt) {
    if (bolt.leaderT < 1) {
      bolt.leaderT += dts * 1.6;
      const nVisible = Math.floor(bolt.leaderT * bolt.lines.length);
      bolt.lines.forEach((s, i) => s.visible = i < nVisible);
      phaseName = L('梯级先导下探', 'stepped leader');
    } else {
      bolt.flashT += dts;
      bolt.lines.forEach(s => { s.visible = true; s.scale.x = s.scale.z = 2.2; });
      phaseName = L('回击!', 'return stroke!');
      if (bolt.flashT > 0.5) {
        scene.remove(bolt.group);
        bolt = null;
        phaseName = L('云再充电', 'recharging');
      }
    }
  }
  /* 电荷微动 */
  for (const c of charges) {
    c.mesh.position.x += Math.sin(tSim * 2 + c.mesh.id) * dts * 0.05;
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  boltTick(dts);
  document.getElementById('stV').innerHTML = voltage.toFixed(0) + '<small> MV</small>';
  document.getElementById('stI').innerHTML = bolt && bolt.leaderT >= 1 ? '30<small> kA</small>' : '—';
  document.getElementById('stN').textContent = strikes;
  document.getElementById('stPh').textContent = phaseName;

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
