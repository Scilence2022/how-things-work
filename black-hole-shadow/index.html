<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>黑洞阴影与事件视界望远镜 · 把地球拼成一面望远镜</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#05060a;--panel:rgba(10,12,18,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(10,12,18,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(10,12,18,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#dde5f0;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="黑洞阴影与事件视界望远镜" data-en="Black Hole Shadow &amp; the EHT">黑洞阴影与事件视界望远镜</h1>
  <div class="sub" data-zh="引力把光弯成天然透镜→光子球在 1.5 rs,绕圈的光挤成光子环→阴影直径 √27·rs≈2.6 rs,比视界大一圈半:背后的视界像也被拉到正面→吸积盘多普勒束流让转向我们的一侧亮几倍→EHT 把 8 台毫米波望远镜合成地球尺度巨镜,230 GHz、基线 ~1 万 km、分辨 ~20 µas→M87*(2019)与 Sgr A*(2022)首张黑洞照片 · 拖动旋转 / 空格运行/暂停" data-en="Gravity bends light into a natural lens → the photon sphere sits at 1.5 rs and orbiting light stacks into the photon ring → the shadow spans √27·rs ≈ 2.6 rs, half again wider than the horizon: even the far-side image of the horizon is pulled to the front → Doppler beaming makes the side sweeping toward us several times brighter → EHT combines 8 millimetre telescopes into an Earth-sized mirror, 230 GHz, baselines ~10,000 km, ~20 µas resolution → first images: M87* (2019), Sgr A* (2022) · drag to orbit / Space = run/pause">引力把光弯成天然透镜→光子球在 1.5 rs,绕圈的光挤成光子环→阴影直径 √27·rs≈2.6 rs,比视界大一圈半:背后的视界像也被拉到正面→吸积盘多普勒束流让转向我们的一侧亮几倍→EHT 把 8 台毫米波望远镜合成地球尺度巨镜,230 GHz、基线 ~1 万 km、分辨 ~20 µas→M87*(2019)与 Sgr A*(2022)首张黑洞照片 · 拖动旋转 / 空格运行/暂停</div>
</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <span class="k" data-zh="阴影角径" data-en="Shadow size">阴影角径</span><span class="v" id="stSh">—</span>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const D2R=Math.PI/180;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,700);
camera.position.set(5.2,3.6,13.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4.2;controls.maxDistance=70;controls.autoRotateSpeed=0.55;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.35));
const key=new THREE.DirectionalLight(0xfff2dd,0.85);key.position.set(9,12,10);scene.add(key);

/* ── 常数与目标黑洞 ── 场景单位:1 = 1 rs(rs=2GM/c²) */
const RS_SUN=2953.25;               /* 太阳的希瓦西半径,m */
const PC=3.0857e16;                 /* 秒差距,m */
const MUAS=2.062648e11;             /* rad → µas */
const SQ27=Math.sqrt(27);           /* 阴影直径 = √27·rs */
const BHS={m87:{M:6.5e9,D:16.8e6*PC},sgra:{M:4.297e6,D:8277*PC}};

/* ── 状态 ── */
let mode='m87',beta=0.30,incl=74,playing=true,labelsOn=true,slowMo=false;
let simT=0,vlbiBase=0,vlbiT0=0,maxBaseKm=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

/* ── 星空 ── */
const NS=950;
const starM=new THREE.MeshBasicMaterial({color:0xffffff});
const stars=new THREE.InstancedMesh(new THREE.SphereGeometry(1,4,3),starM,NS);
{
  const m=new THREE.Matrix4(),q=new THREE.Quaternion();
  for(let i=0;i<NS;i++){
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=170+Math.random()*180;
    m.compose(new THREE.Vector3(r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph)),
      q,new THREE.Vector3().setScalar(0.12+Math.random()*0.32));
    stars.setMatrixAt(i,m);
  }
  stars.instanceMatrix.needsUpdate=true;
}
scene.add(stars);

/* ── 视界 + 阴影(始终朝向相机的黑盘) + 光子环 ── */
const bhMesh=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),new THREE.MeshBasicMaterial({color:0x000000}));
scene.add(bhMesh);
const shCv=document.createElement('canvas');shCv.width=shCv.height=256;
{
  const g=shCv.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(0.82,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
}
const shadowSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(shCv),transparent:true,depthWrite:false}));
shadowSpr.scale.setScalar(5.45);scene.add(shadowSpr);
const ringMat=new THREE.MeshBasicMaterial({color:0xffd9a0,transparent:true,opacity:0.95,side:THREE.DoubleSide});
const photonRing=new THREE.Mesh(new THREE.RingGeometry(2.50,2.78,128),ringMat);
scene.add(photonRing);
/* 背景微光 */
const glowCv=document.createElement('canvas');glowCv.width=glowCv.height=256;
{
  const g=glowCv.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(255,180,90,.55)');gr.addColorStop(.4,'rgba(255,120,30,.16)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
}
const glowSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(glowCv),
  blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.3}));
glowSpr.scale.setScalar(17);scene.add(glowSpr);

/* ── 吸积盘:主环(顶点色=多普勒束流)+ 旋转亮块 + 热斑 ── */
const DISK_R0=3.0,DISK_R1=8.2;
const diskG=new THREE.Group();scene.add(diskG);
const diskGeo=new THREE.RingGeometry(DISK_R0,DISK_R1,168,8);
diskGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(diskGeo.attributes.position.count*3),3));
const diskMat=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide,transparent:true,opacity:0.97});
const disk=new THREE.Mesh(diskGeo,diskMat);diskG.add(disk);
const cIn=new THREE.Color(0xfff3d6),cMid=new THREE.Color(0xffab4a),cOut=new THREE.Color(0xa44d1e);
const tmpC=new THREE.Color();
function paintDisk(){
  const p=diskGeo.attributes.position,c=diskGeo.attributes.color;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),r=Math.hypot(x,y);
    const t=clamp((r-DISK_R0)/(DISK_R1-DISK_R0),0,1);
    tmpC.copy(cIn).lerp(cMid,smooth(t*1.5)).lerp(cOut,smooth((t-0.45)/0.55));
    const dop=Math.pow(clamp(1+beta*(x/r),0.1,2.4),3);          /* +x 侧朝向我们 */
    let br=0.16+0.42*dop;
    br*=1+0.85*Math.exp(-(r-DISK_R0)*1.15);                      /* 内缘更热 */
    c.setXYZ(i,tmpC.r*br,tmpC.g*br,tmpC.b*br);
  }
  c.needsUpdate=true;
}
paintDisk();
/* 旋转的亮块层(透明叠加) */
const clGeo=new THREE.RingGeometry(DISK_R0,DISK_R1,168,4);
const clCol=new Float32Array(clGeo.attributes.position.count*3);
{
  const p=clGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),r=Math.hypot(x,y),th=Math.atan2(y,x);
    const v=0.45+0.55*Math.abs(Math.sin(th*6+r*1.7)*Math.sin(th*2.3-r*3.1+1.2));
    clCol[i*3]=v;clCol[i*3+1]=v*0.92;clCol[i*3+2]=v*0.8;
  }
  clGeo.setAttribute('color',new THREE.BufferAttribute(clCol,3));
}
const clMat=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.3,
  side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
const clumps=new THREE.Mesh(clGeo,clMat);clumps.position.z=0.03;diskG.add(clumps);
/* 轨道热斑 */
const hsCv=document.createElement('canvas');hsCv.width=hsCv.height=64;
{
  const g=hsCv.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,240,210,1)');gr.addColorStop(.35,'rgba(255,170,70,.55)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);
}
const hsTex=new THREE.CanvasTexture(hsCv);
const hotSpots=[];
for(let i=0;i<3;i++){
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:hsTex,blending:THREE.AdditiveBlending,
    depthWrite:false,transparent:true,opacity:0.85}));
  spr.scale.setScalar(1.05);diskG.add(spr);
  hotSpots.push({spr,R:3.8+i*1.15,a:i*2.1});
}

/* ── 远端盘的透镜像:头顶/脚下的拱(始终朝向相机) ── */
const archG=new THREE.Group();scene.add(archG);
function archPts(sx,sy,lift){
  const pts=[];
  for(let i=0;i<=44;i++){const a=Math.PI*(1-i/44);
    pts.push(new THREE.Vector3(sx*Math.cos(a),lift+sy*Math.sin(a)*0.97,0));}
  return pts;
}
function makeArch(sx,sy,lift,rad){
  const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(archPts(sx,sy,lift)),56,rad,10,false);
  geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count*3),3));
  const mat=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.9});
  const mesh=new THREE.Mesh(geo,mat);
  archG.add(mesh);return {geo,mat,mesh};
}
const arch=makeArch(3.35,3.05,0.25,0.27);
const uArch=makeArch(2.95,2.35,-0.22,0.16);
function paintArch(){
  for(const a of [arch,uArch]){
    const p=a.geo.attributes.position,c=a.geo.attributes.color,dim=a===uArch?0.55:1;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i);
      const dop=Math.pow(clamp(1+beta*x/3.35,0.1,2.4),3);
      const br=(0.18+0.42*dop)*dim;
      c.setXYZ(i,cMid.r*br,cMid.g*br,cMid.b*br);
    }
    c.needsUpdate=true;
  }
}
paintArch();

/* ── VLBI 阵列模式:地球+8 台站+基线+逐步合成的图像 ── */
const vlbiG=new THREE.Group();vlbiG.visible=false;scene.add(vlbiG);
const earthM=new THREE.MeshStandardMaterial({color:0x3e6f9e,roughness:0.72});
const earth=new THREE.Mesh(new THREE.SphereGeometry(2.3,48,32),earthM);vlbiG.add(earth);
const EARTH_R=2.3,KM_PER_UNIT=6371/EARTH_R;
const STATIONS=[
  ['ALMA·智利','ALMA Chile',-23,-68],['APEX·智利','APEX Chile',-23,-61],
  ['SPT·南极','SPT Antarctica',-84,-25],['LMT·墨西哥','LMT Mexico',19,-97],
  ['SMT·亚利桑那','SMT Arizona',33,-110],['SMA·夏威夷','SMA Hawaii',20,-156],
  ['JCMT·夏威夷','JCMT Hawaii',19.8,-154],['IRAM·西班牙','IRAM Spain',37,-3]
];
const dishM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.35,metalness:0.6});
function ll2v(lat,lon,r){
  const la=lat*D2R,lo=lon*D2R;
  return new THREE.Vector3(r*Math.cos(la)*Math.cos(lo),r*Math.sin(la),-r*Math.cos(la)*Math.sin(lo));
}
const stPos=STATIONS.map(s=>ll2v(s[2],s[3],EARTH_R*1.01));
stPos.forEach((p,i)=>{
  const dish=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.14,10),dishM);
  dish.position.copy(p);
  dish.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),p.clone().normalize());
  vlbiG.add(dish);
});
/* 基线:按长度排序,从最长到最短逐条点亮 */
const PAIRS=[];
for(let i=0;i<stPos.length;i++)for(let j=i+1;j<stPos.length;j++)PAIRS.push([i,j]);
PAIRS.sort((a,b)=>stPos[b[0]].distanceTo(stPos[b[1]])-stPos[a[0]].distanceTo(stPos[a[1]]));
const blMat=new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.55});
const blLines=PAIRS.map(pr=>{
  const g=new THREE.BufferGeometry().setFromPoints([stPos[pr[0]],stPos[pr[1]]]);
  const ln=new THREE.Line(g,blMat);ln.visible=false;vlbiG.add(ln);return ln;
});
maxBaseKm=stPos[PAIRS[0][0]].distanceTo(stPos[PAIRS[0][1]])*KM_PER_UNIT;
/* 合成图像:小画布,基线越多越锐利 */
const synCv=document.createElement('canvas');synCv.width=synCv.height=128;
const synCtx=synCv.getContext('2d');
const synTex=new THREE.CanvasTexture(synCv);
const synPlane=new THREE.Mesh(new THREE.PlaneGeometry(3.1,3.1),
  new THREE.MeshBasicMaterial({map:synTex,transparent:true}));
synPlane.position.set(6.6,2.3,0);vlbiG.add(synPlane);
function drawSynth(n){
  const g=synCtx;
  g.clearRect(0,0,128,128);
  g.fillStyle='#07080d';g.fillRect(0,0,128,128);
  const f=n/PAIRS.length;
  g.filter=`blur(${(17-15.5*f).toFixed(1)}px)`;
  g.strokeStyle='#ffb35c';g.lineWidth=9;
  g.beginPath();g.arc(64,64,35,0,Math.PI*2);g.stroke();
  g.strokeStyle='#fff1cf';g.lineWidth=7;
  g.beginPath();g.arc(64,64,35,-0.65,0.65);g.stroke();
  g.fillStyle='#000';g.beginPath();g.arc(64,64,30,0,Math.PI*2);g.fill();
  g.filter='none';
  const np=Math.round(520-500*f);
  g.fillStyle='rgba(255,215,170,0.5)';
  for(let i=0;i<np;i++)g.fillRect(Math.random()*128,Math.random()*128,1,1);
  synTex.needsUpdate=true;
}
drawSynth(0);

/* ── 标签 ── */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblHz=addLabel(()=>L('事件视界 1 rs','Event horizon, 1 rs'),new THREE.Vector3(0.2,1.25,0.9),'r');
const lblPh=addLabel(()=>L('光子球 1.5 rs:光在此绕圈','Photon sphere 1.5 rs: light loops here'),new THREE.Vector3(-1.5,1.7,1.1),'y');
const lblRing=addLabel(()=>L('光子环:多圈绕行光的亮壳','Photon ring: shell of many-loop light'),new THREE.Vector3(2.75,0.55,1.3),'o');
const lblShadow=addLabel(()=>L(`阴影 ≈2.6 rs(√27/2·rs)`,`Shadow ≈ 2.6 rs (√27/2 · rs)`),new THREE.Vector3(-3.5,-0.5,1.0),'r');
const lblDisk=addLabel(()=>L('吸积盘近端','Accretion disk, near side'),new THREE.Vector3(6.4,-1.4,2.6),'o');
const lblArch=addLabel(()=>L('远端盘的像被引力翻上头顶','Image of the far side lensed overhead'),new THREE.Vector3(0.2,3.6,0),'b');
const lblDop=addLabel(()=>L('朝向我们的一侧被束流放大','Side sweeping toward us: beamed brighter'),new THREE.Vector3(6.9,1.5,0),'g');
const lblSt1=addLabel(()=>L('ALMA · 智利','ALMA · Chile'),new THREE.Vector3(0,0,0),'g',()=>mode==='vlbi');
const lblSt2=addLabel(()=>L('SMA/JCMT · 夏威夷','SMA/JCMT · Hawaii'),new THREE.Vector3(0,0,0),'b',()=>mode==='vlbi');
const lblSt3=addLabel(()=>L('IRAM · 西班牙','IRAM · Spain'),new THREE.Vector3(0,0,0),'y',()=>mode==='vlbi');
const lblSt4=addLabel(()=>L('SPT · 南极点','SPT · South Pole'),new THREE.Vector3(0,0,0),'r',()=>mode==='vlbi');
const lblBase=addLabel(()=>L(`基线 B=${(mode==='vlbi'?curBaseKm():maxBaseKm).toFixed(0)} km`,`Baseline B=${(mode==='vlbi'?curBaseKm():maxBaseKm).toFixed(0)} km`),new THREE.Vector3(0,3.4,0),'b',()=>mode==='vlbi');
const lblSyn=addLabel(()=>L(`合成图像: ${vlbiBase}/${PAIRS.length} 条基线`,`Synthesized image: ${vlbiBase}/${PAIRS.length} baselines`),new THREE.Vector3(6.6,4.15,0),'o',()=>mode==='vlbi');
function posStLabels(){
  lblSt1.position.copy(stPos[0].clone().multiplyScalar(1.22));
  lblSt2.position.copy(stPos[5].clone().multiplyScalar(1.22));
  lblSt3.position.copy(stPos[7].clone().multiplyScalar(1.22));
  lblSt4.position.copy(stPos[2].clone().multiplyScalar(1.3).add(new THREE.Vector3(0,0.3,0)));
}
posStLabels();
function curBaseKm(){
  if(vlbiBase<=0)return 0;
  let mx=0;
  for(let i=0;i<vlbiBase;i++){const pr=PAIRS[i];mx=Math.max(mx,stPos[pr[0]].distanceTo(stPos[pr[1]])*KM_PER_UNIT);}
  return mx;
}

/* ── 参数设置 ── */
function setBeta(v){beta=clamp(v,0.05,0.5);
  document.getElementById('sBeta').value=beta;
  document.getElementById('sBetaVal').textContent=beta.toFixed(2);
  paintDisk();paintArch();updateStats();}
function setIncl(v){incl=clamp(v,5,88);
  document.getElementById('sIncl').value=incl;
  document.getElementById('sInclVal').textContent=incl.toFixed(0)+'°';}
function setMode(m){mode=m;
  document.getElementById('bM87').classList.toggle('on',m==='m87');
  document.getElementById('bSgA').classList.toggle('on',m==='sgra');
  document.getElementById('bVLBI').classList.toggle('on',m==='vlbi');
  const vb=m==='vlbi';
  bhMesh.visible=!vb;shadowSpr.visible=!vb;photonRing.visible=!vb;
  diskG.visible=!vb;archG.visible=!vb;glowSpr.visible=!vb;
  vlbiG.visible=vb;
  controls.target.set(0,vb?0.4:0,0);
  if(vb){vlbiT0=simT;vlbiBase=0;blLines.forEach(l=>l.visible=false);drawSynth(0);}
  updateStats();}

/* ── 步骤 ── */
const STEPS=[
 {b:'光被引力弯折',be:'Gravity bends light',
  d:'黑洞附近时空弯曲,光只能走弯曲的测地线:掠过黑洞的光被折转,背景星光绕到正面——黑洞本身就是一面天然引力透镜。',
  de:'Curved spacetime forces light onto bent geodesics: rays skimming the hole are deflected and starlight from behind wraps around — the hole is a natural gravitational lens.',
  act(){setMode('m87');setIncl(74);setBeta(0.30);}},
 {b:'光子球:1.5 rs 的光轨道',be:'Photon sphere at 1.5 rs',
  d:'在 1.5 rs 处光可以绕黑洞做圆周运动;那些绕行好几圈才逃出的光线被挤成一圈薄亮壳——光子环,影像里最锐利的边缘。',
  de:'At 1.5 rs light can orbit the hole; rays that loop several times before escaping stack into a thin bright shell — the photon ring, the sharpest edge of the image.',
  act(){setMode('m87');}},
 {b:'阴影比视界大一圈半',be:'Shadow wider than the horizon',
  d:'阴影直径 √27·rs≈2.6 rs:引力透镜把视界背面的像也拉到正面,连“背后的黑”都被你算进阴影——看到的是全部方向的视界像。',
  de:'The shadow spans √27·rs ≈ 2.6 rs: lensing pulls the image of the far-side horizon to the front, so even the darkness behind counts — you see the horizon from every direction at once.',
  act(){setMode('m87');setIncl(40);}},
 {b:'多普勒束流:一侧更亮',be:'Doppler beaming: one side brighter',
  d:'盘内物质以接近光速旋转:朝向我们运动的一侧辐射被束流放大、亮几倍,远离的一侧变暗——亮暗不对称直接指出盘的转向。',
  de:'Disk material orbits near light speed: the side sweeping toward us is beamed several times brighter while the receding side dims — the asymmetry points out the spin direction.',
  act(){setMode('m87');setBeta(0.44);}},
 {b:'远端盘被翻上头顶',be:'Far side lifted overhead',
  d:'盘远端发出的光从黑洞上方、下方绕过来:你看到的“拱”是盘背面的像,不是盘真的翘起——倾角越大,拱越舒展。',
  de:'Light from the far side of the disk bends over and under the hole: the arch is the image of the back of the disk, not a warped disk — the bigger the tilt, the taller the arch.',
  act(){setMode('m87');setIncl(84);setBeta(0.30);}},
 {b:'倾角改变一切',be:'Inclination changes everything',
  d:'几乎正对盘面时只见一个圆环;倾角加大,近端盘压到阴影前面、远端拱升起——M87* 的视线与盘轴仅约 17°。',
  de:'Nearly face-on you see a clean ring; tilt further and the near-side disk slides in front of the shadow while the arch rises — M87* is viewed at only ~17° from its disk axis.',
  act(){setMode('m87');setIncl(26);}},
 {b:'EHT:把地球当望远镜',be:'EHT: Earth as one telescope',
  d:'8 台毫米波望远镜做甚长基线干涉:230 GHz、基线长至 ~1 万 km,分辨本领 ~20 µas——2019 年 M87*、2022 年 Sgr A* 首张黑洞照片。',
  de:'Eight millimetre telescopes in very-long-baseline interferometry: 230 GHz, baselines to ~10,000 km, resolution ~20 µas — the first black hole images, M87* in 2019 and Sgr A* in 2022.',
  act(){setMode('vlbi');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ── 统计 ── */
function shadowMuas(){
  const b=BHS[mode==='sgra'?'sgra':'m87'];
  return SQ27*RS_SUN*b.M/b.D*MUAS;
}
function updateStats(){
  document.getElementById('stSh').innerHTML=shadowMuas().toFixed(1)+'<small> µas</small>';
  const dop=Math.pow((1+beta)/(1-beta),3);
  const dv=document.getElementById('stDop');
  dv.innerHTML=dop.toFixed(1)+'<small> ×</small>';
  dv.className='v '+(dop>8?'warn':'');
  const bk=mode==='vlbi'?curBaseKm():maxBaseKm;
  document.getElementById('stBase').innerHTML=bk.toFixed(0)+'<small> km</small>';
  document.getElementById('stRing').innerHTML='2.60<small> rs</small>';
}

/* ── 事件 ── */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bM87').addEventListener('click',()=>setMode('m87'));
document.getElementById('bSgA').addEventListener('click',()=>setMode('sgra'));
document.getElementById('bVLBI').addEventListener('click',()=>setMode('vlbi'));
document.getElementById('sBeta').addEventListener('input',e=>setBeta(+e.target.value));
document.getElementById('sIncl').addEventListener('input',e=>setIncl(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglAuto').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x05060a:0xdde5f0);
  starM.color.setHex(dark?0xffffff:0x5d6b80);
  glowSpr.material.opacity=dark?0.30:0.10;
  clMat.blending=dark?THREE.AdditiveBlending:THREE.NormalBlending;
  clMat.opacity=dark?0.30:0.20;clMat.needsUpdate=true;
  earthM.color.setHex(dark?0x3e6f9e:0x4d84ba);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ── 主循环 ── */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 盘旋转与热斑(局部 xy 平面,法向 z) */
  const om=0.10+beta*0.55;
  clumps.rotation.z+=om*dts;
  for(const h of hotSpots){
    h.a+=om*1.5*dts;
    h.spr.position.set(h.R*Math.cos(h.a),h.R*Math.sin(h.a),0.06);
  }
  /* 视角锁定元素 */
  photonRing.quaternion.copy(camera.quaternion);
  archG.quaternion.copy(camera.quaternion);
  const archOp=0.10+0.9*Math.sin(incl*D2R);
  arch.mat.opacity=archOp;uArch.mat.opacity=0.6*archOp;
  diskG.rotation.x=incl*D2R;
  diskMat.opacity=0.97;glowSpr.material.rotation+=dt*0.02;
  /* VLBI:基线逐条点亮 */
  if(mode==='vlbi'&&playing){
    const n=Math.min(PAIRS.length,Math.floor((simT-vlbiT0)*0.85));
    if(n!==vlbiBase){
      vlbiBase=n;
      for(let i=0;i<PAIRS.length;i++)blLines[i].visible=i<n;
      drawSynth(n);updateStats();
    }
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
controls.autoRotate=true;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
