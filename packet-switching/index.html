<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互联网如何送包裹:分组交换</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.hot { border-color: rgba(255,93,93,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(178,128,20,.9); color: #9c6f00; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(12,123,166,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.hot { border-color: rgba(200,60,60,.9); color: #b83232; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }
  #stats .v.b { color: #4dabf7; }
  #stats .v.hot { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #modeRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(255,209,102,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(176,118,31,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 4; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #btnLoss { appearance: none; font: inherit; width: 100%; margin-top: 9px; padding: 7px 10px;
    font-size: 12.5px; font-weight: 600; border-radius: 9px; cursor: pointer;
    color: #ffb3b3; background: rgba(255,93,93,.10); border: 1px solid rgba(255,93,93,.5);
    transition: background .15s, transform .15s; }
  #btnLoss:hover { background: rgba(255,93,93,.22); transform: translateY(-1px); }
  :root[data-theme="light"] #btnLoss { color: #b83232; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="互联网如何送包裹:分组交换" data-en="How the Internet Ships a Message: Packet Switching">互联网如何送包裹:分组交换</h1>
  <div class="sub" data-zh="消息切成 5 个带序号的包 → 各自选路、逐跳存储转发 → 乱序到达、按序号重组;丢包 → 超时 → 重传;对照电路交换:专线独占、他人排队 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放" data-en="A message becomes 5 numbered packets → each picks its own path, hop-by-hop store-and-forward → out-of-order arrival, reassembled by seq #; loss → timeout → retransmit; vs circuit switching: a reserved-but-idle line blocks everyone · 3D interactive · drag to orbit / scroll to zoom">消息切成 5 个带序号的包 → 各自选路、逐跳存储转发 → 乱序到达、按序号重组;丢包 → 超时 → 重传;对照电路交换:专线独占、他人排队 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" id="k1" data-zh="已到达" data-en="arrived">已到达</span><span class="v b" id="st1">0/5</span>
  <span class="k" id="k2" data-zh="乱序到达" data-en="out-of-order">乱序到达</span><span class="v g" id="st2">0</span>
  <span class="k" id="k3" data-zh="链路占用" data-en="link util.">链路占用</span><span class="v" id="st3">0%</span>
  <span class="k" id="k4" data-zh="重传" data-en="retransmits">重传</span><span class="v hot" id="st4">0</span>
</div>

<div id="panel">
  <div id="modeRow">
    <button id="btnPkt" class="bon on"><b data-zh="分组交换" data-en="Packet switching">分组交换</b><i data-zh="切件 · 独立选路 · 统计复用" data-en="chop · route · multiplex">切件 · 独立选路 · 统计复用</i></button>
    <button id="btnCir" class="bon"><b data-zh="电路交换" data-en="Circuit switching">电路交换</b><i data-zh="呼叫建立 · 专线独占 · 他人排队" data-en="call setup · reserved · queues">呼叫建立 · 专线独占 · 他人排队</i></button>
  </div>
  <ol id="steps"></ol>
  <button id="btnLoss" data-zh="⚡ 制造丢包(中途闪红消失)" data-en="⚡ Drop a packet (flashes red, vanishes)">⚡ 制造丢包(中途闪红消失)</button>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="进度" data-en="Progress">进度</label><input id="prog" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="progVal">0%</span></div>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglGray" type="checkbox" checked> <span data-zh="第三方流量" data-en="other traffic">第三方流量</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../rsa-crypto/" data-zh="延伸:包里装的秘密(RSA)" data-en="related: secrets inside packets">延伸:包里装的秘密(RSA)</a>
    <a href="../random-walk/" data-zh="同族:路径的随机性" data-en="same family: randomness of paths">同族:路径的随机性</a>
    <a href="../galton-board/" data-zh="延伸:大量小事件的统计" data-en="related: statistics of small events">延伸:大量小事件的统计</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mulberry32 = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
let mode = qs.get('mode') === 'circuit' ? 'circuit' : 'packet';

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('互联网如何送包裹:分组交换', 'How the Internet Ships a Message: Packet Switching');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  syncStatLabels();
  syncModeUI();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
camera.position.set(0.5, 8.8, 15.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 46;
controls.autoRotateSpeed = 0.45;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 10, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-7, 4, -6);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.92, emissive: 0x000000 }),
  hostA: mat(0x5b6675, { metalness: 0.35, roughness: 0.5 }),
  hostB: mat(0x4c5a6a, { metalness: 0.4, roughness: 0.45 }),
  router: mat(0x6b7787, { metalness: 0.4, roughness: 0.45 }),
  steel: mat(0x9aa4b2, { metalness: 0.55, roughness: 0.45 }),
  screen: mat(0x9fd8ff, { emissive: 0x4dabf7, emissiveIntensity: 0.8, roughness: 0.3 }),
  led: new THREE.MeshBasicMaterial({ color: 0x8affc1 }),
};

/* ================= 拓扑 ================= */
const NPOS = {
  A: [-7.6, 1.15, 0], B: [7.6, 1.15, 0],
  R1: [-3.4, 0.95, -3.0], R2: [-3.4, 1.4, 3.0],
  R3: [0.5, 1.8, -1.4], R4: [4.0, 1.0, 2.4],
};
const V3 = {};
for (const k in NPOS) V3[k] = new THREE.Vector3(...NPOS[k]);
const LINKS = [['A', 'R1'], ['A', 'R2'], ['R1', 'R3'], ['R2', 'R3'], ['R2', 'R4'], ['R3', 'R4'], ['R3', 'B'], ['R4', 'B']];
const LKEY = {};
LINKS.forEach((l, i) => { LKEY[l[0] + '|' + l[1]] = i; LKEY[l[1] + '|' + l[0]] = i; });
const PATHS = {
  a: ['A', 'R1', 'R3', 'B'],
  b: ['A', 'R2', 'R3', 'B'],
  c: ['A', 'R2', 'R4', 'B'],
  d: ['A', 'R1', 'R3', 'R4', 'B'],
};
function mkHops(pathIds) {
  return pathIds.slice(0, -1).map((n, i) => {
    const li = LKEY[n + '|' + pathIds[i + 1]];
    const dur = V3[n].distanceTo(V3[pathIds[i + 1]]) / 3.4;
    return { li, dur };
  });
}
const HOPS = {};
for (const k in PATHS) HOPS[k] = mkHops(PATHS[k]);

/* 地板 */
const floor = new THREE.Mesh(new THREE.BoxGeometry(25, 0.2, 13), M.floor);
floor.position.y = -0.1;
scene.add(floor);

/* 主机 A(电脑) */
const hostA = new THREE.Group();
{
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.5, 0.85), M.hostA);
  base.position.y = 0.75;
  hostA.add(base);
  const scr = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.62, 0.06), M.screen);
  scr.position.set(0, 0.95, 0.44);
  hostA.add(scr);
  const kb = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.08, 0.5), M.steel);
  kb.position.set(0, 0.06, 0.62);
  hostA.add(kb);
}
hostA.position.set(...NPOS.A);
hostA.position.y = 0;
scene.add(hostA);
/* 主机 B(机架服务器) */
const hostB = new THREE.Group();
{
  const rack = new THREE.Mesh(new THREE.BoxGeometry(1.05, 2.1, 0.95), M.hostB);
  rack.position.y = 1.05;
  hostB.add(rack);
  for (let i = 0; i < 5; i++) {
    const slat = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.07, 0.06), M.screen);
    slat.position.set(0, 0.35 + i * 0.36, 0.48);
    hostB.add(slat);
  }
}
hostB.position.set(...NPOS.B);
hostB.position.y = 0;
scene.add(hostB);
/* 路由器 */
const routerGrps = {};
for (const r of ['R1', 'R2', 'R3', 'R4']) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.62, 0.95), M.router);
  body.position.y = 0.31;
  g.add(body);
  for (const s of [-0.28, 0.28]) {
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.035, 0.62, 8), M.steel);
    ant.position.set(s, 0.85, 0);
    g.add(ant);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), M.led);
    tip.position.set(s, 1.18, 0);
    g.add(tip);
  }
  g.position.set(...NPOS[r]);
  g.position.y = 0;
  scene.add(g);
  routerGrps[r] = g;
}

/* ---------------- 主更新 ---------------- */
function update(dt) {

  if (isCir) {
    if (!reserved && !tornDown && cycleT >= setupStart + setupDur) reserved = true;
    if (completeT && !tornDown && cycleT >= completeT + 0.9) cutCircuit(false);
    if (tornDown && grayQueue.length && cycleT >= drainNext && grayList.length < 8) {
      grayQueue.shift();
      spawnGray(cycleT);
      drainNext = cycleT + 0.18;
    }
  }
  /* 第三方包生成 */
  while (spawnPtr < spawnSched.length && cycleT >= spawnSched[spawnPtr]) {
    if (isCir && reserved && !tornDown) grayQueue.push(spawnSched[spawnPtr]);
    else spawnGray(cycleT);
    spawnPtr++;
  }
  /* 发送调度 */
  packets.forEach((p, k) => {
    if (p.st === 'stage' && cycleT >= SEND[k] && !(isCir && tornDown)) { srcSegs[k].material = segOff; launchOurs(p); }
  });
  /* 预置丢包(step 4 / ?loss=1):seq1 第 2 段中点 */
  if (lossArmed) {
    const p = packets[1];
    if (p.st === 'fly' && p.hop === 1 && p.ph > 0.45) { lossArmed = false; killPkt(p); }
  }
  /* 超时重传 */
  packets.forEach(p => { if (p.st === 'dead' && p.pendingTO && cycleT >= p.reTxAt) reviveOurs(p); });

  /* 灰色包推进 */
  for (let i = grayList.length - 1; i >= 0; i--) {
    const g = grayList[i];
    if (g.st === 'fly') {
      g.ph += dt / g.dur;
      if (g.ph >= 1) {
        occEnd(g);
        if (g.hop + 1 === g.path.length - 1) grayList.splice(i, 1);
        else { g.hop++; g.st = 'proc'; g.procLeft = PROC; }
      }
    } else if (g.st === 'proc') {
      g.procLeft -= dt;
      if (g.procLeft <= 0) occStart(g);
    }
  }
  /* 主角推进 */
  for (const p of packets) {
    if (p.st === 'fly') {
      p.ph += dt / p.dur;
      if (lossArmed && p.seq === 1 && p.hop === 1 && p.ph > 0.45) { lossArmed = false; killPkt(p); continue; }
      if (p.ph >= 1) {
        occEnd(p);
        if (p.hop + 1 === p.path.length - 1) arriveOurs(p);
        else { p.hop++; p.st = 'proc'; p.procLeft = PROC; }
      }
    } else if (p.st === 'proc') {
      p.procLeft -= dt;
      if (p.procLeft <= 0) occStart(p);
    } else if (p.st === 'dying') {

      if (p.dieT <= 0) finishKill(p);
    }

  for (let li = 0; li < linkBusy.length; li++) if (linkBusy[li] > 0) linkBusyT[li] += dt;
  /* 爆散粒子 */
  for (let i = burstP.length - 1; i >= 0; i--) {
    const b = burstP[i];
    b.life -= dt; b.vy -= 6.5 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;

    out.y += Math.sin(f.ph * Math.PI) * 0.06;

  st1.textContent = arriveCnt + '/5';
  st2.textContent = reorderCnt + '';
  let uSum = 0; for (let li = 0; li < linkBusyT.length; li++) uSum += linkBusyT[li] / totalT;
  st3.textContent = Math.round(100 * uSum / linkBusyT.length) + '%';
  st4.textContent = mode === 'circuit' ? Math.min(grayQueue.length, 99) + '' : retxCnt + '';
}

/* ================= 讲解步骤 ================= */
function restartPkt(autoLoss) {
  setMode('packet');
  lossArmed = !!autoLoss;
}
const STEPS = [
  { b: '切件:消息 → 5 个带序号的包', be: 'Chop: one message → 5 numbered packets',
    d: '网页、语音都被切成包,头部写「发给 B · 序号 #k」——真实包头约 40 字节(IP 20 + TCP 20),MTU 1500 字节,一个网页要几十个包,这里 5 个示意。思想出自 1960 年代的 Baran 与 Davies。',
    de: 'Pages and voice are chopped into packets, each headered "to B, seq #k" — real overhead ≈40 B (IP 20 + TCP 20), MTU 1500 B; a page is dozens of packets, 5 shown here. Idea due to Baran & Davies, 1960s.',
    act: () => restartPkt(false) },
  { b: '独立选路:逐跳存储转发', be: 'Each packet routes itself, hop by hop',
    d: '路由器把包收全 → 查转发表 → 再发下一跳。没人给整条消息订路线:5 个包各走各的(a/b/c/d 四条路),哪条队短走哪条。',
    de: 'Each router receives the whole packet, looks up its forwarding table, sends it on. Nobody books an end-to-end route: the 5 packets fan out over paths a/b/c/d.',
    act: () => restartPkt(false) },
  { b: '乱序到达:按序号重组', be: 'Out of order, reassembled by seq #',
    d: '路有长短、队有疏密,#2 完全可能比 #1 先到。接收端按序号把包摆回 5 格缓冲,先到的等,集齐即还原——看右侧彩色格逐个点亮。',
    de: 'Paths and queues differ: #2 may beat #1. The receiver slots packets by number into a 5-slot buffer; fill them all and the message is whole.',
    act: () => restartPkt(false) },
  { b: '丢包 → 超时 → 重传', be: 'Loss → timeout → retransmit',
    d: '路由器缓存满就丢包,互联网不承诺送达。发送端等不到确认,超时计时器(红条)到点,把丢的那个包重发一遍——可靠性由主机端 TCP 兜底。点「制造丢包」试试。',
    de: 'Full buffers drop packets; the network promises nothing. The sender\'s timer (red bar) fires and it resends just that packet — reliability lives at the hosts (TCP). Try "drop a packet".',
    act: () => restartPkt(true) },
  { b: '对照:电路交换独占专线', be: 'Contrast: circuit switching',
    d: '传统电话先「呼叫建立」,独占一条 64 kbps 电路:静默思考时线路空着也不给别人,其他人只能在主机 A 排队。分组交换按需占用、统计复用——同样的线,喂得起更多人。看「链路占用」与「排队」读数。',
    de: 'The telephone network sets up a call and holds a 64 kbps circuit: idle silence still blocks others, who queue at host A. Packets share on demand — statistical multiplexing feeds far more users per wire.',
    act: () => setMode('circuit') },
];
function stepIndex() {
  if (mode === 'circuit') return 4;
  if (lossArmed || packets.some(p => p.pendingTO || p.retx)) return 3;
  if (arriveCnt > 0) return 2;
  if (packets.every(p => p.st !== 'stage')) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elProg = document.getElementById('prog');
const elProgVal = document.getElementById('progVal');
const st1 = document.getElementById('st1'), st2 = document.getElementById('st2'),
  st3 = document.getElementById('st3'), st4 = document.getElementById('st4');
const tglLabels = document.getElementById('tglLabels');
const tglGray = document.getElementById('tglGray');
const tglRotate = document.getElementById('tglRotate');
const btnPkt = document.getElementById('btnPkt');
const btnCir = document.getElementById('btnCir');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncStatLabels() {
  const ks = mode === 'circuit'
    ? [L('已送达', 'delivered'), L('乱序到达', 'out-of-order'), L('链路占用', 'link util.'), L('他人排队', 'others queued')]
    : [L('已到达', 'arrived'), L('乱序到达', 'out-of-order'), L('链路占用', 'link util.'), L('重传', 'retransmits')];
  document.querySelectorAll('#stats .k').forEach((k, i) => { k.dataset.zh = ks[i]; k.dataset.en = ks[i]; k.textContent = ks[i]; });
}
function syncModeUI() {
  btnPkt.classList.toggle('on', mode === 'packet');
  btnCir.classList.toggle('on', mode === 'circuit');
  document.getElementById('btnLoss').textContent = mode === 'circuit'
    ? L('⚡ 掐断专线(整个会话作废)', '⚡ Cut the circuit (whole session lost)')
    : L('⚡ 制造丢包(中途闪红消失)', '⚡ Drop a packet (flashes red, vanishes)');
  syncStatLabels();
}
function setMode(m) {
  mode = m;
  syncModeUI();
  planCycle();
}
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
btnPkt.addEventListener('click', () => setMode('packet'));
btnCir.addEventListener('click', () => setMode('circuit'));
document.getElementById('btnLoss').addEventListener('click', () => {
  if (mode === 'circuit') { cutCircuit(true); return; }
  const p = packets.find(p => p.st === 'fly') || packets.find(p => ['proc', 'wait'].includes(p.st));
  if (p) killPkt(p);
  else lossArmed = true;
});
let progDrag = false;
function progMax() { return completeT ? completeT + (mode === 'circuit' ? 4.0 : 2.4) : cycleEst; }
function seekTo(t) {
  t = clamp(t, 0, progMax());
  if (t < cycleT - 0.25) planCycle();
  let guard = 1600;
  while (cycleT < t && guard-- > 0) update(1 / 40);
}
elProg.addEventListener('pointerdown', () => { progDrag = true; });
addEventListener('pointerup', () => { progDrag = false; });
elProg.addEventListener('input', () => seekTo(parseInt(elProg.value, 10) / 1000 * progMax()));
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
  lblCir.o.element.style.display = tglLabels.checked && mode === 'circuit' && reserved && !tornDown ? '' : 'none';
});
tglGray.addEventListener('change', () => {
  if (!tglGray.checked) {
    for (const g of grayList.slice()) killGrayNow(g);
    grayQueue.length = 0; spawnSched = spawnSched.filter(t => t < cycleT);
  }
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
if (!qsBool('gray', true)) { tglGray.checked = false; tglGray.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1, rafId = 0;
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) update(dt * speed);
  syncVisual(playing ? dt * speed : 0);
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  if (!progDrag) {
    const pv = Math.round(1000 * clamp(cycleT / progMax(), 0, 1));
    if (+elProg.value !== pv) elProg.value = pv;
    elProgVal.textContent = Math.round(pv / 10) + '%';
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { clock.getDelta(); rafId = requestAnimationFrame(frame); }
});

/* ---------------- 启动 ---------------- */
planCycle();
if (qsBool('loss', false)) lossArmed = true;
if (qs.get('t') !== null) seekTo(qsFloat('t', 0));
applyTheme();
applyLang();
setPlayLabel();
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
rafId = requestAnimationFrame(frame);
</script>
</body>
</html>
