<style>

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);

  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);

    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}

  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

    border:1px solid transparent;align-items:flex-start}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }

  #panel::-webkit-scrollbar-track { background: transparent; }

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="中心极限定理" data-en="The Central Limit Theorem">中心极限定理</h1>
  <div class="sub" data-zh="一枚骰子是平的,两枚相加起了弧,五枚已经像钟——不管单个分布长什么样,加得足够多,和总是挤向同一条正态曲线;σ_和=σ·√n 是唯一要付的价:看得越准、拢得越慢 · 拖动旋转 / 空格运行/暂停" data-en="One die is flat, two summed make a bulge, five already ring like a bell — whatever each distribution looks like, sum enough of them and the total crowds onto the same normal curve; σ·√n is the only price you pay: the finer the resolution, the slower it gathers · drag to orbit / Space = run/pause">一枚骰子是平的,两枚相加起了弧,五枚已经像钟——不管单个分布长什么样,加得足够多,和总是挤向同一条正态曲线;σ_和=σ·√n 是唯一要付的价:看得越准、拢得越慢 · 拖动旋转 / 空格运行/暂停</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,72);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(4.4,6.9,12.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.3,1.9,0.5);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与台座 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const baseM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8});
const base=new THREE.Mesh(new THREE.BoxGeometry(13.6,0.3,6.6),baseM);
base.position.set(0,0.15,0.3);scene.add(base);

/* ---- 骰子加法机:框架 + 漏斗 + 求和舱 ---- */
const machX=-4.5,machZ=-0.9;
const frameM=new THREE.MeshStandardMaterial({color:0x2b313c,roughness:0.55,metalness:0.35});
for(const[sx,sz]of[[-1.3,-1.3],[1.3,-1.3],[-1.3,1.3],[1.3,1.3]]){
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,3.3,10),frameM);
  leg.position.set(machX+sx,1.95,machZ+sz);scene.add(leg);
}
const rim=new THREE.Mesh(new THREE.TorusGeometry(1.85,0.06,10,48),frameM);
rim.rotation.x=Math.PI/2;rim.position.set(machX,3.6,machZ);scene.add(rim);
const funnelM=new THREE.MeshPhysicalMaterial({color:0x8fa8ff,roughness:0.15,transparent:true,opacity:0.2,side:THREE.DoubleSide});
const funnel=new THREE.Mesh(new THREE.CylinderGeometry(1.8,0.5,1.7,40,1,true),funnelM);
funnel.position.set(machX,2.75,machZ);scene.add(funnel);
const throat=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.5,16),frameM);
throat.position.set(machX,1.75,machZ);scene.add(throat);
const sumBoxM=new THREE.MeshStandardMaterial({color:0x1f2733,roughness:0.35,metalness:0.5,emissive:0x91a7ff,emissiveIntensity:0});
const sumBox=new THREE.Mesh(new THREE.BoxGeometry(0.66,0.5,0.66),sumBoxM);
sumBox.position.set(machX,1.2,machZ);scene.add(sumBox);

/* ---- 斜坡轨道:和值小球从机器滚向直方图 ---- */
const railCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(machX+0.35,1.3,machZ),
  new THREE.Vector3(machX+1.7,1.55,-0.2),
  new THREE.Vector3(machX+3.5,2.1,0.9),
  new THREE.Vector3(0.2,2.35,1.6)]);
const rail=new THREE.Mesh(new THREE.TubeGeometry(railCurve,48,0.05,10),frameM);
scene.add(rail);
for(const s of[0.22,0.5,0.78]){
  const p=railCurve.getPoint(s);
  const sup=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,p.y-0.3,8),frameM);
  sup.position.set(p.x,0.3+(p.y-0.3)/2,p.z);scene.add(sup);
}

/* ---- 直方图柱阵(InstancedMesh)+ ±σ 区带 ---- */
const NB=48,AXW=8,XS=1.25,HISTX=1.3,HISTZ=1.6,HMAX=2.3;
const binW=AXW/NB;
const barX=i=>HISTX+((i+0.5)*binW-AXW/2)*XS;
const meanWX=()=>HISTX+(3.5-AXW/2)*XS;
const axisStrip=new THREE.Mesh(new THREE.BoxGeometry(NB*binW*XS+0.5,0.06,1.15),
  new THREE.MeshStandardMaterial({color:0x222833,roughness:0.8}));
axisStrip.position.set(HISTX,0.33,HISTZ);scene.add(axisStrip);
const barM=new THREE.MeshStandardMaterial({color:0x5c7cfa,roughness:0.4,metalness:0.15,emissive:0x1b2a6b,emissiveIntensity:0.55});
const bars=new THREE.InstancedMesh(new THREE.BoxGeometry(binW*XS*0.82,1,0.85),barM,NB);
scene.add(bars);
const strip1=new THREE.Mesh(new THREE.BoxGeometry(1,0.04,1.35),
  new THREE.MeshBasicMaterial({color:0x69db7c,transparent:true,opacity:0.32}));
const strip2=new THREE.Mesh(new THREE.BoxGeometry(1,0.03,1.35),
  new THREE.MeshBasicMaterial({color:0x69db7c,transparent:true,opacity:0.13}));
strip1.position.set(meanWX(),0.37,HISTZ);strip2.position.set(meanWX(),0.355,HISTZ);
scene.add(strip1,strip2);

/* ---- 漏斗里的骰子(InstancedMesh,六面 CanvasTexture 点数) ---- */
function dieFace(n){
  const c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d');g.fillStyle='#f5f7fb';g.fillRect(0,0,64,64);g.fillStyle='#232a36';
  const P={1:[[32,32]],2:[[17,17],[47,47]],3:[[15,15],[32,32],[49,49]],
    4:[[17,17],[47,17],[17,47],[47,47]],5:[[17,17],[47,17],[32,32],[17,47],[47,47]],
    6:[[17,14],[47,14],[17,32],[47,32],[17,50],[47,50]]};
  for(const[px,py]of P[n]){g.beginPath();g.arc(px,py,6.5,0,6.3);g.fill();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const dieMats=[1,2,3,4,5,6].map(n=>new THREE.MeshStandardMaterial({map:dieFace(n),roughness:0.35}));
const dice=new THREE.InstancedMesh(new THREE.BoxGeometry(0.36,0.36,0.36),dieMats,12);
scene.add(dice);

/* ---- 和值小球池 ---- */
const ballM=new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.3,emissive:0x7a5a00,emissiveIntensity:0.65});
const balls=[];
for(let i=0;i<8;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.11,14,12),ballM);
  m.visible=false;scene.add(m);balls.push({m,t:-1,sum:0,xb:0,bin:0});
}

/* ---- 正态罩:理论曲线(单位峰高,按直方图尺度缩放) ---- */
let capMesh=null,capOn=true,capK=0.05,pdfPk=1;
function pdfNormal(x,mu,sg){return Math.exp(-0.5*((x-mu)/sg)**2)/(sg*Math.sqrt(2*Math.PI));}
function rebuildCap(){
  if(capMesh){capMesh.geometry.dispose();scene.remove(capMesh);capMesh=null;}
  const sg=sigmaXbar(),NP=44,pts=[],raw=[];
  pdfPk=0;
  for(let i=0;i<NP;i++){
    const xb=0.15+(AXW-0.3)*i/(NP-1),p=pdfNormal(xb,3.5,sg);
    raw.push([xb,p]);if(p>pdfPk)pdfPk=p;
  }
  for(const[xb,p]of raw)pts.push(new THREE.Vector3(HISTX+(xb-AXW/2)*XS,p/pdfPk,HISTZ));
  capMesh=new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),72,0.055,10),
    new THREE.MeshStandardMaterial({color:0x66d9e8,roughness:0.3,emissive:0x0b7285,emissiveIntensity:0.75,transparent:true,opacity:0.9}));
  capMesh.position.y=0.3;capMesh.visible=capOn;scene.add(capMesh);
}

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false;
let n=1,mode='dice',rate=1.6,cycleT=0;
let total=0,sumVals=0,sumSq=0,inSig1=0,inSig2=0,barsDirty=true;
const SIG_DIE=Math.sqrt(35/12);
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('直方图:一球一票,柱随样本长高','Histogram: one ballot per ball, bars grow with samples'),
  new THREE.Vector3(4.6,2.85,1.6),'b');
addLabel(()=>L('正态罩:理论曲线 N(3.5, σ/√n)','Normal bell: theory curve N(3.5, σ/√n)'),
  new THREE.Vector3(0.675,3.4,1.6),'b',()=>capOn);
addLabel(()=>L(`±1σ 区:实测 ${(total?100*inSig1/total:0).toFixed(0)}% · 理论 68%`,
    `±1σ band: measured ${(total?100*inSig1/total:0).toFixed(0)}% · theory 68%`),
  new THREE.Vector3(0.675,0.85,3.0),'g');
addLabel(()=>L('新样本流:和值滚下斜坡落柱','Fresh samples: each sum rolls down the ramp'),
  new THREE.Vector3(-2.4,3.2,0.3),'y',()=>playing&&total>0);

function sigmaXbar(){return (mode==='dice'?SIG_DIE:3.5)/Math.sqrt(n);}
function srcStd(){return mode==='dice'?SIG_DIE:3.5;}
function resetHist(){counts.fill(0);total=0;sumVals=0;sumSq=0;inSig1=0;inSig2=0;barsDirty=true;}
function setN(v){n=clamp(Math.round(v),1,12);
  document.getElementById('sN').value=n;
  document.getElementById('sNVal').textContent=n;resetHist();}
function setRate(v){rate=clamp(v,0.5,4);
  document.getElementById('sRate').value=rate;
  document.getElementById('sRateVal').textContent=rate.toFixed(1)+'/s';}
function setMode(m){mode=m;
  const col=new THREE.Color(m==='skew'?0xffc078:0xffffff);
  for(let i=0;i<12;i++)dice.setColorAt(i,col);
  dice.instanceColor.needsUpdate=true;
  resetHist();rebuildCap();updateStrips();}
function updateStrips(){
  const s=sigmaXbar();
  strip1.scale.x=Math.max(0.25,2*s*XS);
  strip2.scale.x=Math.max(0.5,4*s*XS);
}

/* ---- 步骤 ---- */
function markBtn(id){for(const b of['bOne','bFive','bSkew'])
  document.getElementById(b).classList.toggle('on',b===id);}
const STEPS=[
 {zh:'一枚骰子:每个面 1/6,直方图是平坦的一条',en:'One die: every face 1/6 — the histogram is a flat line',
  act(){setMode('dice');setN(1);markBtn('bOne');}},
 {zh:'两枚相加:2 和 12 各只有一种凑法,7 有六种——中间隆起',
  en:'Two dice summed: 2 and 12 have one combination each, 7 has six — a bulge grows in the middle',
  act(){setMode('dice');setN(2);markBtn('');}},
 {zh:'五枚:反复卷积把边缘压下去,钟形已现',
  en:'Five dice: repeated convolution crushes the edges — the bell is already there',
  act(){setMode('dice');setN(5);markBtn('bFive');}},
 {zh:'n 越大:散布 σ·√n 变宽、均值钉在 3.5n,相对散布按 1/√n 收拢',
  en:'As n grows, the spread σ·√n widens while the mean pins to 3.5n — relative scatter tightens like 1/√n',
  act(){setMode('dice');setN(9);markBtn('');}},
 {zh:'换个偏斜源(指数分布):单次歪得厉害,求和照样钟形',
  en:'Swap in a skewed source (exponential): wildly lopsided alone, yet the sum still rings bell-shaped',
  act(){setMode('skew');setN(6);markBtn('bSkew');}},
 {zh:'大数定律管均值,CLT 管形状:均值钉死 3.5n,形状趋于正态',
  en:'LLN pins the mean, CLT molds the shape: the average locks onto 3.5n while the shape goes Gaussian',
  act(){setMode('dice');setN(12);markBtn('');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stN').textContent=n;
  document.getElementById('stSamples').textContent=total;
  document.getElementById('stMean').innerHTML=total>0
    ?(sumVals/total).toFixed(2)+'<small> / '+L('理论 ','theory ')+(3.5*n).toFixed(1)+'</small>':'—';
  const sEl=document.getElementById('stSig');
  if(total>20){
    const mean=sumVals/total,va=Math.max(0,sumSq/total-mean*mean);
    sEl.innerHTML=Math.sqrt(va).toFixed(2)+'<small> / '+(srcStd()*Math.sqrt(n)).toFixed(2)+'</small>';
  }else sEl.textContent='—';
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bOne').addEventListener('click',()=>{setMode('dice');setN(1);markBtn('bOne');});
document.getElementById('bFive').addEventListener('click',()=>{setMode('dice');setN(5);markBtn('bFive');});
document.getElementById('bSkew').addEventListener('click',()=>{setMode('skew');markBtn('bSkew');});
document.getElementById('sN').addEventListener('input',e=>setN(+e.target.value));
document.getElementById('sRate').addEventListener('input',e=>setRate(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglCap').addEventListener('change',e=>{capOn=e.target.checked;if(capMesh)capMesh.visible=capOn;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  baseM.color.setHex(dark?0x3a3f4b:0xb5ad9e);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4(),eul=new THREE.Euler(),tmpV=new THREE.Vector3();
function fireSample(){
  let sum=0;
  if(mode==='dice'){for(let i=0;i<n;i++)sum+=1+Math.floor(Math.random()*6);}
  else{for(let i=0;i<n;i++)sum-=3.5*Math.log(1-Math.random());}
  const xb=sum/n;
  let bin=Math.floor(xb/binW);bin=clamp(bin,0,NB-1);
  for(const b of balls)if(b.t<0){b.t=0;b.sum=sum;b.xb=xb;b.bin=bin;return;}
}
function landBall(b){
  const pos=clamp(b.xb/binW-0.5,0,NB-1.001),i0=Math.floor(pos),fr=pos-i0;
  counts[i0]+=1-fr;counts[i0+1]+=fr;
  total++;sumVals+=b.sum;sumSq+=b.sum*b.sum;
  const dev=Math.abs(b.xb-3.5),sxb=sigmaXbar();
  if(dev<=sxb)inSig1++;if(dev<=2*sxb)inSig2++;
  barsDirty=true;
}
function updateBalls(dts){
  const RAIL_T=0.85,DROP_T=0.55,ex=0.2,ey=2.35,ez=1.6;
  for(const b of balls){
    if(b.t<0){b.m.visible=false;continue;}
    b.t+=dts;
    if(b.t<RAIL_T){railCurve.getPoint(b.t/RAIL_T,b.m.position);b.m.visible=true;}
    else{
      const u=Math.min(1,(b.t-RAIL_T)/DROP_T),tx=barX(b.bin);
      b.m.position.set(ex+(tx-ex)*u,(ey+(0.34-ey)*u)+1.05*Math.sin(u*Math.PI),ez);
      b.m.visible=true;
      if(u>=1){b.t=-1;landBall(b);}
    }
  }
}
function updateDice(){
  for(let i=0;i<12;i++){
    if(i>=n){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);dice.setMatrixAt(i,m4);continue;}
    const p=(cycleT+i*0.14)%1;
    let r,y,s=1;
    if(p<0.78){y=3.85-p*0.85;r=0.18+(y-1.9)*0.62;}
    else{const q=(p-0.78)/0.22;y=3.0-q*1.1;r=0.2*(1-q)+0.06;s=1-q*0.55;}
    const a=simT*1.4+i*2.7;
    m4.makeRotationFromEuler(eul.set(simT*2.1+i,simT*1.6+i*0.7,simT*1.2));
    m4.scale(tmpV.set(s,s,s));
    m4.setPosition(machX+Math.cos(a)*r,y,machZ+Math.sin(a)*r*0.8);
    dice.setMatrixAt(i,m4);
  }
  dice.instanceMatrix.needsUpdate=true;
}
function rebuildBars(){
  let pk=0;for(let i=0;i<NB;i++)if(counts[i]>pk)pk=counts[i];
  for(let i=0;i<NB;i++){
    const h=pk>0?counts[i]/pk*HMAX:0;
    m4.makeScale(1,Math.max(h,0.001),1);
    m4.setPosition(barX(i),0.36+h/2,HISTZ);
    bars.setMatrixAt(i,m4);
  }
  bars.instanceMatrix.needsUpdate=true;
  capK=pk>0?clamp(pdfPk*total*binW/pk*HMAX,0.02,3.2):0.02;
  if(capMesh)capMesh.scale.y=capK;
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  cycleT+=dts*rate;
  let g=0;while(cycleT>=1&&g++<4){cycleT-=1;fireSample();sumBoxM.emissiveIntensity=1.5;}
  updateDice();
  updateBalls(dts);
  if(barsDirty){barsDirty=false;rebuildBars();}
  sumBoxM.emissiveIntensity*=Math.max(0,1-dts*4);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const counts=new Float32Array(NB);
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setMode('dice');setN(1);setRate(1.6);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
