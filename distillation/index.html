<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蒸馏与分馏 · 一次次局部蒸发</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,186,106,.9); color: #ffe0c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(200,110,20,.9); color: #9c5f10; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffca8a; }
  #stats .v.b { color: #74c0fc; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.a { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.b2 { color: #a5d8ff; border-color: rgba(116,192,252,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="蒸馏与分馏:一次蒸发不够就蒸一千次" data-en="Distillation: one evaporation is never enough">蒸馏与分馏:一次蒸发不够就蒸一千次</h1>
  <div class="sub" data-zh="沸点差 = 气液分配差;每块塔板做一次局部蒸发-冷凝,轻组分一级级富集向上——石油炼化就是一座 40 层塔 · 空格播放/暂停" data-en="Boiling-point gap = vapor/liquid split; each tray runs one local evaporate-condense cycle, enriching the light component upward — an oil refinery is a 40-tray tower · Space = play/pause">沸点差 = 气液分配差;每块塔板做一次局部蒸发-冷凝,轻组分一级级富集向上——石油炼化就是一座 40 层塔 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="塔顶蒸气 A%" data-en="top vapor %A">塔顶蒸气 A%</span><span class="v g" id="stTop">—</span>
  <span class="k" data-zh="釜液 A%" data-en="bottom liquid %A">釜液 A%</span><span class="v b" id="stBot">—</span>
  <span class="k" data-zh="馏出速率" data-en="distillate rate">馏出速率</span><span class="v" id="stRate">—</span>
  <span class="k" data-zh="塔顶温度" data-en="head temp">塔顶温度</span><span class="v" id="stTemp">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.a" data-zh="A 组分:低沸点(易挥发)" data-en="A: low boiling (volatile)">A 组分:低沸点(易挥发)</span>
    <span class="chip.b2" data-zh="B 组分:高沸点" data-en="B: high boiling">B 组分:高沸点</span>
  </div>
  <div class="row"><label data-zh="加热功率" data-en="heat power">加热功率</label><input id="heat" type="range" min="20" max="100" step="1" value="60"><span class="val" id="heatVal">60%</span></div>
  <div class="row"><label data-zh="塔板数" data-en="tray count">塔板数</label><input id="trays" type="range" min="1" max="6" step="1" value="4"><span class="val" id="traysVal">4</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../phase-transition/" data-zh="沸点从哪来" data-en="where boiling points come from">沸点从哪来</a>
    <a href="../hydrogen-bond/" data-zh="水为什么 100°C 才开" data-en="why water boils at 100°C">水为什么 100°C 才开</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('蒸馏与分馏', 'Distillation & Fractionation');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.8, 2.6, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.13,
    roughness: 0.12, metalness: 0, side: THREE.DoubleSide, depthWrite: false }),
  plate: mat(0x8a93a3, { metalness: 0.55, roughness: 0.35, opacity: 0.95 }),
  metal: mat(0x9aa7b8, { metalness: 0.7, roughness: 0.3 }),
  liquidA: mat(0xffa94d, { emissiveIntensity: 0.25 }),
  liquidB: mat(0x74c0fc, { emissiveIntensity: 0.2 }),
  flame: new THREE.MeshBasicMaterial({ color: 0xff7b3d, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false }),
};

/* 底座 */
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.2, 0.16, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.3;
scene.add(base);

/* ================= 装置布局 ================= */
/* 釜(左下) → 塔(中) → 冷凝器(顶) → 馏出液杯(左上?) 简化:釜在塔底,塔直立,顶出冷凝管到右杯 */
const COL_R = 0.52;
const colGrp = new THREE.Group();
scene.add(colGrp);
const colY0 = 0.9;                       // 塔底
const colY1 = 5.2;                       // 塔顶
const colShell = new THREE.Mesh(new THREE.CylinderGeometry(COL_R, COL_R, colY1 - colY0, 28, 1, true), M.glass);
colShell.position.y = (colY0 + colY1) / 2;
colGrp.add(colShell);
/* 釜:球瓶 */
const pot = new THREE.Mesh(new THREE.SphereGeometry(0.95, 32, 24), M.glass);
pot.position.set(0, 0.55, 0);
colGrp.add(pot);
/* 釜内液体(A/B 双色混合,随成分变色) */
const potLiquid = new THREE.Mesh(new THREE.SphereGeometry(0.78, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2),
  M.liquidB.clone());
potLiquid.rotation.x = Math.PI;
potLiquid.position.set(0, 0.32, 0);
colGrp.add(potLiquid);
/* 加热灯 */
const flame = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.5, 14), M.flame);
flame.position.set(0, -0.12, 0);
flame.rotation.x = Math.PI;
colGrp.add(flame);

/* 塔板 */
const MAXTRAY = 6;
const trayMeshes = [];
for (let i = 0; i < MAXTRAY; i++) {
  const y = colY0 + (i + 0.8) * (colY1 - colY0 - 0.4) / MAXTRAY;
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(COL_R * 0.94, COL_R * 0.94, 0.055, 28), M.plate.clone());
  plate.position.y = y;
  colGrp.add(plate);
  /* 塔板液层(A 浓度显色) */
  const pool = new THREE.Mesh(new THREE.CylinderGeometry(COL_R * 0.8, COL_R * 0.8, 0.09, 28),
    M.liquidA.clone());
  pool.position.y = y + 0.08;
  colGrp.add(pool);
  trayMeshes.push({ y, plate, pool });
}
/* 塔壁温度辉光(底部热→顶部冷) */
const glowTubes = [];
for (let i = 0; i < 10; i++) {
  const y = colY0 + (i + 0.5) * (colY1 - colY0) / 10;
  const t = new THREE.Mesh(new THREE.CylinderGeometry(COL_R + 0.02, COL_R + 0.02, (colY1 - colY0) / 10 * 0.92, 28, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xff7b3d, transparent: true, opacity: 0.0,
      blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false }));
  t.position.y = y;
  colGrp.add(t);
  glowTubes.push(t);
}
/* 冷凝管(塔顶弯向右) */
const condPipe = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.09, 10, 24, Math.PI / 2), M.metal);
condPipe.position.set(COL_R, colY1, 0);
condPipe.rotation.z = -Math.PI / 2;
colGrp.add(condPipe);
/* 冷凝蛇管 */
const coil = new THREE.Mesh(new THREE.TorusKnotGeometry(0.16, 0.035, 60, 8, 2, 3), M.metal);
coil.position.set(1.55, colY1 + 0.05, 0);
colGrp.add(coil);
/* 馏出液杯 */
const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.36, 0.7, 24, 1, true), M.glass);
cup.position.set(2.5, 4.35, 0);
colGrp.add(cup);
const cupBase = new THREE.Mesh(new THREE.CircleGeometry(0.36, 24), M.glass.clone());
cupBase.rotation.x = -Math.PI / 2;
cupBase.position.set(2.5, 4.01, 0);
colGrp.add(cupBase);
const cupLiquid = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.34, 0.3, 24), M.liquidA.clone());
cupLiquid.position.set(2.5, 4.18, 0);
colGrp.add(cupLiquid);

/* ================= 状态(标签之前) ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let heat = 0.6;
let nTrays = 4;
let tSim = 0;
const ALPHA = 2.6;                       // 相对挥发度
let xTop = 0.5, xPot = 0.5;              // 顶/釜 A 摩尔分数
let dropsMade = 0;
let rateAcc = 0, rateWin = [];

/* 塔板局部液相 A 浓度(自底向上逐板富集) */
let trayX = [0.5, 0.5, 0.5, 0.5, 0.5, 0.5];

/* 气泡 */
const bubbles = [];   // {mesh, y, vy, xA, trayIdx}
const bubbleMat = () => new THREE.MeshBasicMaterial({ color: 0xffd8a8, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false });
function spawnBubble(xA) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), bubbleMat());
  b.position.set((Math.random() - 0.5) * 0.5, colY0 - 0.4, (Math.random() - 0.5) * 0.5);
  scene.add(b);
  bubbles.push({ mesh: b, vy: 0.55 + Math.random() * 0.25, xA, trayIdx: -1 });
}

/* 液滴(馏出) */
const drops = [];      // {mesh, t}
function spawnDrop(xA) {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().lerpColors(new THREE.Color(0x74c0fc), new THREE.Color(0xffa94d), xA) }));
  d.position.set(1.55, colY1 + 0.25, 0);
  scene.add(d);
  drops.push({ mesh: d, t: 0, xA });
}

/* 逐板平衡:y = αx/(1+(α−1)x) 气相 A 富集;塔顶组成 = 逐板级联 */
function cascade() {
  let x = xPot;
  for (let i = 0; i < nTrays; i++) {
    trayX[i] = x;
    x = ALPHA * x / (1 + (ALPHA - 1) * x);
  }
  xTop = x;
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblPot = addLabel(() => L('蒸馏釜:混合液沸腾,蒸气总是比液体更富 A', 'the pot: mixture boils; vapor is always A-richer than the liquid'),
  new THREE.Vector3(0, -0.55, 0), 'g');
const lblCol = addLabel(() => L(`${nTrays} 块塔板 = ${nTrays} 次局部蒸发-冷凝:每过一板,蒸气再富集一次 A`, 
  `${nTrays} trays = ${nTrays} local evaporate-condense steps; each tray enriches vapor in A once more`),
  new THREE.Vector3(0, colY1 + 0.75, 0), 'st');
const lblCup = addLabel(() => L('馏出液:A 富集(颜色越橙越纯)', 'distillate: A-enriched (oranger = purer)'),
  new THREE.Vector3(2.5, 3.85, 0), 'g');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '挥发性差异 = 分配差异', be: 'Volatility = the split',
    d: 'A 沸点低(78°C)、B 沸点高(100°C)。沸腾时两者都会蒸发,但 A 更容易进气体——所以蒸气里 A 的浓度永远高于液相。',
    de: 'A boils low (78°C), B high (100°C). Both evaporate, but A escapes easier — vapor is always A-richer than the liquid it left.',
    act: () => setHeat(30) },
  { b: '一次蒸发太弱', be: 'One flash is too weak',
    d: 'α=2.6 时,单次蒸发把 A 从 50% 提到 ~72%——想喝 95% 的酒、炼 99% 的馏分,一次远远不够。',
    de: 'At α=2.6 one flash lifts A from 50% to ~72% — nowhere near the 95% spirit or 99% cuts. One pass is never enough.',
    act: () => setTrays(1) },
  { b: '塔板:局部蒸发-冷凝', be: 'A tray = one local cycle',
    d: '上升蒸气撞上塔板的冷液层:高沸点 B 先冷凝留下,蒸气变富 A;板上的液体被蒸气加热再蒸发,又富集一次。一块板就是一次提纯。',
    de: 'Rising vapor hits the cool liquid pool: B condenses first, vapor enriches in A; the pool re-evaporates and enriches again. One tray, one purification.',
    act: () => setTrays(4) },
  { b: '塔内双梯度', be: 'Two gradients in one column',
    d: '温度下高上低(底部 ~95°C,顶部 ~80°C),组成下贫上富——看塔壁辉光从红到蓝、塔板液色从蓝到橙。',
    de: 'Temperature falls upward (~95°C bottom, ~80°C top) while A climbs upward — watch the wall glow go red→blue and the pools blue→orange.',
    act: () => setTrays(6) },
  { b: '工业同款', be: 'Industry runs on this',
    d: '石油炼化是一座 40+ 层塔:塔顶出液化气、中段出汽油煤油、塔底出重油——一座塔把原油切成几十种产品。',
    de: 'A refinery is one 40+ tray tower: LPG off the top, gasoline and kerosene from the middle, heavy fuel at the bottom — crude sliced into dozens of products.',
    act: () => { setTrays(6); setHeat(85); } },
];
function stepIndex() {
  if (heat > 0.8 && nTrays >= 6) return 4;
  if (nTrays >= 6) return 3;
  if (nTrays >= 3) return 2;
  if (nTrays <= 1) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setHeat(v) {
  heat = clamp(v, 0.2, 1);
  document.getElementById('heat').value = heat * 100;
  document.getElementById('heatVal').textContent = (heat * 100).toFixed(0) + '%';
}
function setTrays(n) {
  nTrays = clamp(Math.round(n), 1, MAXTRAY);
  document.getElementById('trays').value = nTrays;
  document.getElementById('traysVal').textContent = nTrays;
  trayMeshes.forEach((t, i) => { t.plate.visible = t.pool.visible = i < nTrays; });
  cascade();
}
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
document.getElementById('heat').addEventListener('input', e => setHeat(parseInt(e.target.value) / 100));
document.getElementById('trays').addEventListener('input', e => setTrays(parseInt(e.target.value)));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let spawnAcc = 0, dropAcc = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  /* 火焰 */
  flame.visible = heat > 0.22;
  flame.scale.set(0.7 + heat * 0.6, 0.7 + heat, 0.7 + heat * 0.6);
  flame.material.opacity = 0.5 + 0.3 * Math.sin(tSim * 11);
  /* 塔壁温度辉光:底部红热 → 顶部蓝冷 */
  const Tbot = lerp(60, 98, heat), Ttop = lerp(70, 82, heat);
  glowTubes.forEach((t, i) => {
    const f = i / (glowTubes.length - 1);
    const T = lerp(Tbot, Ttop, f);
    const hot = clamp((T - 60) / 40, 0, 1);
    t.material.color.setHSL(lerp(0.6, 0.02, hot), 0.9, 0.5);
    t.material.opacity = 0.10 + hot * 0.16;
  });
  /* 釜液颜色 */
  potLiquid.material.color.lerpColors(new THREE.Color(0x74c0fc), new THREE.Color(0xffa94d), xPot);

  /* 气泡生成与上升 */
  spawnAcc += dts * heat * 7;
  while (spawnAcc > 1) {
    spawnAcc -= 1;
    if (bubbles.length < 40) spawnBubble(xPot);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.mesh.position.y += b.vy * dts;
    b.mesh.position.x += Math.sin(tSim * 6 + i) * dts * 0.06;
    /* 到达下一塔板:局部平衡,富集一次 */
    const nextTray = b.trayIdx + 1;
    if (nextTray < nTrays && b.mesh.position.y >= trayMeshes[nextTray].y) {
      b.trayIdx = nextTray;
      b.xA = ALPHA * b.xA / (1 + (ALPHA - 1) * b.xA);
      const c = new THREE.Color().lerpColors(new THREE.Color(0x74c0fc), new THREE.Color(0xffa94d), b.xA);
      b.mesh.material.color = c;
      /* 液滴回落(视觉:溅落即可,不模拟) */
    }
    /* 到顶:进冷凝器出滴 */
    if (b.mesh.position.y >= colY1) {
      scene.remove(b.mesh);
      bubbles.splice(i, 1);
      xTop = b.xA;
      rateWin.push(tSim);
      spawnDrop(xTop);
    }
  }
  /* 馏出液滴落杯 */
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.t += dts;
    d.mesh.position.y -= dts * 0.9;
    d.mesh.position.x = lerp(d.mesh.position.x, 2.5, clamp(dts * 2.4, 0, 1));
    if (d.mesh.position.y < 4.42) {
      scene.remove(d.mesh);
      drops.splice(i, 1);
      dropsMade++;
      rateAcc++;
      /* 釜液微贫 A */
      xPot = Math.max(0.06, xPot - 0.0009);
      /* 回流:釜液重置为接近初始(连续进料假设) */
      if (dropsMade % 60 === 0) xPot = lerp(xPot, 0.5, 0.25);
      cupLiquid.material.color.lerpColors(new THREE.Color(0x74c0fc), new THREE.Color(0xffa94d), xTop);
      cascade();
    }
  }
  /* 塔板液色 */
  trayMeshes.forEach((t, i) => {
    if (i < nTrays) {
      t.pool.material.color.lerpColors(new THREE.Color(0x74c0fc), new THREE.Color(0xffa94d), trayX[i]);
    }
  });

  /* 统计 */
  rateWin = rateWin.filter(t => tSim - t < 3);
  document.getElementById('stTop').innerHTML = (xTop * 100).toFixed(1) + '<small>%</small>';
  document.getElementById('stBot').innerHTML = (xPot * 100).toFixed(1) + '<small>%</small>';
  document.getElementById('stRate').innerHTML = (rateWin.length / 3).toFixed(1) + '<small>滴/s</small>';
  document.getElementById('stTemp').innerHTML = Ttop.toFixed(1) + '<small>°C</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

cascade();
applyTheme();
applyLang();
setHeat(heat);
setTrays(nTrays);
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
