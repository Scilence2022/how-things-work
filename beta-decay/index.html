<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>β 衰变与中微子 · 能量账本</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#b8862b; --accBright:#dcae55; --accSoft:rgba(184,134,43,.14); --accBorder:rgba(184,134,43,.55);
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#966b1e; --accBright:#966b1e; --accSoft:rgba(150,107,30,.10); --accBorder:rgba(150,107,30,.5);
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.y { border-color: rgba(184,134,43,.9); color: #ffd8a8; }
  :root[data-theme="light"] .lbl.y { border-color: rgba(150,107,30,.9); color: #7a5514; }
  .lbl.o { border-color: rgba(212,148,58,.9); color: #ffd8a8; }
  :root[data-theme="light"] .lbl.o { color: #8a5a10; }
  .lbl.g { border-color: rgba(105,219,124,.85); color: #c3f5cf; }
  :root[data-theme="light"] .lbl.g { color: #2b7a3d; }
  .lbl.b { border-color: rgba(140,180,220,.9); color: #d8e9f8; }
  :root[data-theme="light"] .lbl.b { color: #33587a; }
  .lbl.w { border-color: rgba(255,255,255,.8); color: #fff; }
  :root[data-theme="light"] .lbl.w { color: #444; border-color: rgba(70,80,95,.7); }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.y { color: var(--accBright); }
  #stats .v.g { color: #69db7c; }
  #stats .v.r { color: #ff8787; }
  :root[data-theme="light"] #stats .v.r { color: #c92a2a; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 12px 14px 10px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 6px; margin-bottom: 7px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  .chip.u { color: #ffcf9a; border-color: rgba(255,176,84,.7); }
  .chip.d { color: #cfc2ff; border-color: rgba(150,130,255,.7); }
  .chip.e { color: #ffe1b3; border-color: rgba(212,148,58,.75); }
  .chip.n { color: #d6e6f5; border-color: rgba(140,175,205,.65); }
  :root[data-theme="light"] .chip.u { color: #9c5f14; }
  :root[data-theme="light"] .chip.d { color: #5b43c9; }
  :root[data-theme="light"] .chip.e { color: #8a5a10; }
  :root[data-theme="light"] .chip.n { color: #33587a; }
  #actions { display: flex; gap: 8px; margin-bottom: 6px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--accSoft); color: var(--text); border: 1px solid var(--accBorder);
    border-radius: 9px; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
    transition: filter .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 16px; }
  #steps { list-style: none; margin-top: 6px; }
  #steps li { display: flex; gap: 8px; padding: 5px 7px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: var(--accSoft); border-color: var(--accBorder); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.4; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: var(--accBright); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 8px 12px; font-size: 13.5px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 10px; margin-top: 0; flex-wrap: wrap; align-items: center; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #toggles label.star { border: 1px solid var(--accBorder); border-radius: 999px; padding: 3px 10px;
    color: var(--text3); }
  @keyframes htwPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(184,134,43,0); }
    50% { box-shadow: 0 0 0 8px rgba(184,134,43,.28); } }
  .pulse { animation: htwPulse 1.1s ease-in-out 3; }
  #rel { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="β 衰变:看不见的第三者补平能量账本" data-en="Beta decay: the invisible third particle closes the ledger">β 衰变:看不见的第三者补平能量账本</h1>
  <div class="sub" data-zh="核里一个 d 夸克翻成 u,放出电子与反中微子;只算电子,账本永远亏空——泡利的「中微子」把连续 β 谱当场补平 · 拖动旋转 / 空格运行/暂停" data-en="Inside the nucleus a d quark flips to u, emitting an electron and an antineutrino; count the electron alone and the books never balance — Pauli's neutrino closes the continuous beta spectrum · drag to orbit / space = play/pause">核里一个 d 夸克翻成 u,放出电子与反中微子;只算电子,账本永远亏空——泡利的「中微子」把连续 β 谱当场补平 · 拖动旋转 / 空格运行/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="电子动能(最近事件)" data-en="electron KE (last event)">电子动能(最近事件)</span><span class="v y" id="stEe">—</span>
  <span class="k" data-zh="能量账本" data-en="energy ledger">能量账本</span><span class="v g" id="stLedger">—</span>
  <span class="k" data-zh="累计衰变数" data-en="decays total">累计衰变数</span><span class="v" id="stDec">0</span>
  <span class="k" data-zh="剩余份额 N/N₀" data-en="remaining N/N₀">剩余份额 N/N₀</span><span class="v" id="stFrac">100.0%</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip u" data-zh="u(+⅔)" data-en="u (+2/3)">u(+⅔)</span>
    <span class="chip d" data-zh="d(−⅓)" data-en="d (−1/3)">d(−⅓)</span>
    <span class="chip e" data-zh="e±" data-en="e±">e±</span>
    <span class="chip n" data-zh="ν 幽灵" data-en="ν ghost">ν 幽灵</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnReset" data-zh="重置样品与谱" data-en="reset sample and spectrum">重置样品与谱</button>
    <button class="abtn" id="btnMode">模式:β⁻(C-14)</button>
  </div>
  <div class="row"><label data-zh="半衰期(视觉秒)" data-en="half-life (visual s)">半衰期(视觉秒)</label><input id="hl" type="range" min="6" max="40" step="2" value="14"><span class="val" id="hlVal">14 s</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.5" max="3" step="0.5" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="ph" type="range" min="1" max="6" step="1" value="1"><span class="val" id="phVal">1/6</span></div>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label class="star"><input id="tglNu" type="checkbox" checked> <span data-zh="中微子·第三粒子" data-en="neutrino · 3rd particle">中微子·第三粒子</span></label>
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../radioactive-decay/" data-zh="同族:指数衰变与半衰期" data-en="same family: exponential decay">同族:指数衰变与半衰期</a>
    <a href="../quarks-qcd/" data-zh="深一层:夸克与 QCD" data-en="deeper: quarks and QCD">深一层:夸克与 QCD</a>
    <a href="../solar-neutrino/" data-zh="同族:中微子天文学" data-en="same family: neutrino astronomy">同族:中微子天文学</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141b);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background.set(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.ped.color.set(THEME === 'light' ? 0xc2cad6 : 0x232b38);
  M.shell.color.set(THEME === 'light' ? 0x7c8ea3 : 0x8fa3b8);
}

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.5, 2.9, 8.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.3, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(4, 9, 5);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  ped: mat(0x232b38, { roughness: 0.85 }),
  shell: mat(0x8fa3b8, { roughness: 0.35, opacity: 0.16, depthWrite: false }),
  panel: mat(0x64748b, { roughness: 0.6, opacity: 0.25, depthWrite: false }),
};
const C_ALIVE = new THREE.Color(0xe2a95c), C_DEAD = new THREE.Color(0x44607e);
const C_U = new THREE.Color(0xffb054), C_D = new THREE.Color(0x8f7bff);
const C_E = new THREE.Color(0xffc76a), C_EP = new THREE.Color(0x7ce495);

/* ---------------- 物理量(碳-14 β⁻) ---------------- */
const Q = 156;            // Q 值 / 电子动能上限 (keV)
const ME = 511;           // 电子静质量 (keV)
const MN2 = 2.6082e7;     // 2×子核质量 (keV), 用于反冲
const fE = E => { const p = Math.sqrt(E * E + 2 * ME * E); return p * E * (Q - E) * (Q - E); }; // 容许型 β 谱形状
let fMax = 0;
for (let i = 1; i < 48; i++) fMax = Math.max(fMax, fE((i + 0.5) / 48 * Q));
const CDFN = 192;
const cdf = new Float32Array(CDFN + 1);
for (let i = 0; i < CDFN; i++) cdf[i + 1] = cdf[i] + fE((i + 0.5) / CDFN * Q);
function sampleEe() {     // 按谱形抽样电子动能
  const u = Math.random() * cdf[CDFN];
  let lo = 0, hi = CDFN - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (cdf[m] <= u) lo = m; else hi = m - 1; }
  const f0 = cdf[lo], f1 = cdf[lo + 1];
  const fr = f1 > f0 ? (u - f0) / (f1 - f0) : 0.5;
  return clamp((lo + fr) / CDFN * Q, 0, Q);
}

/* ---------------- 场景:地面 / 样品 / 探测器 ---------------- */
const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.16, 5.5), M.floor);
floor.position.set(0.4, -0.08, 0); scene.add(floor);
const ped1 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.18, 1.5), M.ped);
ped1.position.set(0, 0.09, 0); scene.add(ped1);
const ped2 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.36, 1.1), M.ped);
ped2.position.set(-2.35, 0.18, 0); scene.add(ped2);

const NS = 10, NA = NS * NS * NS;
const sampleMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.045, 8, 6),
  new THREE.MeshBasicMaterial({ color: 0xffffff }), NA);
sampleMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(NA * 3), 3);
sampleMesh.frustumCulled = false;
scene.add(sampleMesh);
const nuclei = [];
for (let i = 0; i < NA; i++) nuclei.push({ p: new THREE.Vector3(), alive: true });
let aliveCnt = NA;
function seed() {
  aliveCnt = NA;
  let i = 0;
  for (let ix = 0; ix < NS; ix++) for (let iy = 0; iy < NS; iy++) for (let iz = 0; iz < NS; iz++) {
    nuclei[i].p.set(-0.5625 + ix * 0.125, 0.2875 + iy * 0.125, -0.5625 + iz * 0.125);
    nuclei[i++].alive = true;
  }
}

const NB = 48;

let decays = 0, lastEe = -1, lastEnu = 0, lastErec = 0;
let nuOn = true;
function decayAt(n) {
  n.alive = false; aliveCnt--; decays++;
  const Ee = sampleEe();
  const pe = Math.sqrt(Ee * Ee + 2 * ME * Ee);
  const th = Math.acos(Math.random() * 2 - 1);
  const Enu0 = Q - Ee;
  const Erec = (pe * pe + Enu0 * Enu0 + 2 * pe * Enu0 * Math.cos(th)) / MN2;
  const Enu = Math.max(0, Q - Ee - Erec);
  const bin = clamp(Math.floor(Ee / Q * NB), 0, NB - 1);
  spawnE(n.p, 2.78, yOf(Ee), (Math.random() * 2 - 1) * 0.9, 0.55 + Math.random() * 0.15,
    Ee, Enu, Erec, bin, false, C_E);
  if (nuOn) spawnNu(n.p, Enu, false);
}

const MODES = [

  { id: 'b+', zh: 'β⁺(C-11)', en: 'β⁺ (C-11)' },

function setMode(m) {
  heroMode = m; heroT = 0; lastFire = -9;
  quarks[0].material.color.copy(C_U);
  quarks[1].material.color.copy(m === 'b-' ? C_D : C_U);
  quarks[2].material.color.copy(C_D);
  const k = MODES.findIndex(x => x.id === m);
  if (k >= 0) modeIdx = k;

function updateHero(dts) {
  heroT += dts;
  const t = heroT % HERO_T;
  const fade = t < 0.35 ? t / 0.35 : t > HERO_T - 0.35 ? (HERO_T - t) / 0.35 : 1;
  M.shell.opacity = 0.16 * fade;
  for (let i = 0; i < 3; i++) {
    const q = quarks[i];
    const ph = heroT * 0.55 + i * 2.09;
    q.position.set(Math.cos(ph) * 0.3, Math.sin(heroT * 0.8 + i * 2.4) * 0.14, Math.sin(ph) * 0.3);
    q.material.opacity = fade;
    q.material.emissiveIntensity = 0.18 + 0.25 * fade;
  }
  const from = heroMode === 'b-' ? C_D : C_U, to = heroMode === 'b-' ? C_U : C_D;
  const t0 = heroMode === 'ec' ? 1.75 : 1.1;
  if (t < 0.05) quarks[1].material.color.copy(from);
  else if (t > t0) quarks[1].material.color.copy(from).lerp(to, clamp((t - t0) / 0.7, 0, 1));
  /* 电子俘获:轨道电子俯冲入核 */
  if (heroMode === 'ec') {
    orbE.visible = t < t0;
    if (t < 1.1) {
      const a = heroT * 2.2;
      orbE.position.set(Math.cos(a), Math.sin(heroT * 3.1) * 0.18, Math.sin(a));
    } else {
      const k = clamp((t - 1.1) / 0.65, 0, 1);
      const a = heroT * 2.2, r = 1 - 0.88 * k;
      orbE.position.set(Math.cos(a) * r, Math.sin(heroT * 3.1) * 0.18 * (1 - k), Math.sin(a) * r);
    }
  } else orbE.visible = false;
  /* W 玻色子:在夸克处涨起、漂出、缩没 */
  const wOn = t > t0 - 0.05 && t < t0 + 1.25;
  wMesh.visible = wOn;
  if (wOn) {
    let sc, drift = 0;
    if (t < t0 + 0.7) sc = clamp((t - t0) / 0.7, 0.05, 1);
    else { sc = clamp(1 - (t - t0 - 0.7) / 0.55, 0, 1); drift = (t - t0 - 0.7) / 0.55 * 0.35; }
    wMesh.position.set(quarks[1].position.x + drift * 1.6, quarks[1].position.y + drift * 0.5, quarks[1].position.z);
    wMesh.scale.setScalar(Math.max(sc, 0.001));
    wMesh.material.opacity = fade * sc;
  }
  /* 出射演示粒子 */
  if (t >= t0 + 0.78 && t < t0 + 0.95 && heroT - lastFire > 2) {
    lastFire = heroT;
    if (heroMode !== 'ec') spawnE(hero.position, 0.8 + Math.random() * 1.4, 1.3 + Math.random() * 0.8,
      (Math.random() - 0.5) * 1.4, 1.25, 0, 0, 0, 0, true, heroMode === 'b+' ? C_EP : C_E);
    spawnNu(hero.position, Q * 0.7, true);
  }
}

const specCv = document.createElement('canvas');

const sctx = specCv.getContext('2d');
function drawSpec() {
  const W = 300, Hc = 156;
  sctx.clearRect(0, 0, W, Hc);
  const pill = getComputedStyle(htmlEl).getPropertyValue('--cv-pill').trim() || 'rgba(13,17,24,.8)';
  sctx.fillStyle = pill;
  sctx.beginPath(); sctx.roundRect(0, 0, W, Hc, 8); sctx.fill();
  const fg = THEME === 'light' ? '#3d4c5c' : '#c7d2de';
  const dim = THEME === 'light' ? 'rgba(60,75,92,.55)' : 'rgba(154,167,184,.6)';
  const acc = THEME === 'light' ? '#966b1e' : '#d4943a';
  const x0 = 34, x1 = 288, y0 = 16, y1 = 88;
  sctx.font = '9px system-ui';
  /* 双体预言:单一能量竖虚线 */
  sctx.strokeStyle = nuOn ? dim : acc;
  sctx.setLineDash([4, 3]);
  sctx.beginPath(); sctx.moveTo(x1, y0); sctx.lineTo(x1, y1); sctx.stroke();
  sctx.fillStyle = nuOn ? dim : acc; sctx.textAlign = 'right';
  sctx.fillText(L('双体预言:单一 156 keV', 'two-body: single 156 keV'), x1 - 2, y0 + 8);
  /* 实测谱形状(灰虚线) */
  sctx.strokeStyle = dim; sctx.setLineDash([2, 3]);
  sctx.beginPath();
  for (let i = 0; i <= 48; i++) {
    const E = Math.max(i / 48 * Q, 0.01);
    const y = y1 - fE(E) / fMax * (y1 - y0);
    i === 0 ? sctx.moveTo(x0, y) : sctx.lineTo(x0 + (x1 - x0) * i / 48, y);
  }
  sctx.stroke(); sctx.setLineDash([]);
  /* 累积直方图 */
  sctx.fillStyle = acc;
  const bw = (x1 - x0) / NB;
  for (let i = 0; i < NB; i++) {
    if (bins[i] <= 0) continue;
    const h = bins[i] / binMax * (y1 - y0);
    sctx.fillRect(x0 + i * bw + 0.5, y1 - h, bw - 1.2, h);
  }
  sctx.fillStyle = dim; sctx.textAlign = 'left';
  sctx.fillText('0', x0 - 2, y1 + 10);
  sctx.textAlign = 'right';
  sctx.fillText('156 keV', x1 + 2, y1 + 10);
  sctx.textAlign = 'left';
  sctx.fillText(L('β 谱:柱=累积实测,虚线=形状/预言', 'β spectrum: bars = measured, dashed = shape/forecast'), x0, y0 - 6);
  /* 能量账本三栏 */
  const ly = 110, lh = 16;
  sctx.fillStyle = dim; sctx.textAlign = 'left';
  sctx.fillText(L('能量账本(Q = 156 keV 总账)', 'energy ledger (Q = 156 keV)'), x0, ly - 4);
  sctx.strokeStyle = dim;
  sctx.strokeRect(x0 + 0.5, ly + 0.5, x1 - x0, lh);
  if (lastEe >= 0) {
    const we = lastEe / Q * (x1 - x0);
    const rest = (nuOn ? lastEnu : Q - lastEe - lastErec) / Q * (x1 - x0);
    sctx.fillStyle = acc;
    sctx.fillRect(x0 + 1, ly + 1, Math.max(we - 1, 0), lh - 2);
    sctx.fillStyle = nuOn ? '#69db7c' : '#e05252';
    sctx.fillRect(x0 + 1 + we, ly + 1, Math.max(rest - 1, 0), lh - 2);
    sctx.fillStyle = fg; sctx.textAlign = 'center';
    if (we > 26) sctx.fillText('e⁻', x0 + we / 2, ly + 11);
    if (rest > 30) sctx.fillText(nuOn ? 'ν̄ₑ' : L('亏空', 'missing'), x0 + we + rest / 2, ly + 11);
  } else {
    sctx.fillStyle = dim; sctx.textAlign = 'center';
    sctx.fillText(L('等待第一个衰变事件…', 'waiting for the first decay…'), (x0 + x1) / 2, ly + 11);
  }
  if (lastEe >= 0) {
    sctx.fillStyle = fg; sctx.font = '10px system-ui'; sctx.textAlign = 'left';
    const rec = (lastErec * 1000).toFixed(1);
    sctx.fillText(nuOn
      ? L(`e⁻ ${lastEe.toFixed(1)} + ν̄ₑ ${lastEnu.toFixed(1)} + 反冲 ${rec} eV = 156 keV ✓`,
          `e⁻ ${lastEe.toFixed(1)} + ν̄ₑ ${lastEnu.toFixed(1)} + recoil ${rec} eV = 156 keV ✓`)
      : L(`e⁻ ${lastEe.toFixed(1)} + 亏空 ${(Q - lastEe - lastErec).toFixed(1)} + 反冲 ${rec} eV ≠ 156 keV ✗`,
          `e⁻ ${lastEe.toFixed(1)} + missing ${(Q - lastEe - lastErec).toFixed(1)} + recoil ${rec} eV ≠ 156 keV ✗`),
      x0, 146);
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });

function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('β 衰变与中微子 · 能量账本', 'Beta Decay and Neutrino · energy ledger');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  updateModeBtn();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
const m4 = new THREE.Matrix4();
function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  const lam = Math.LN2 / hlVis;
  if (playing) {
    phaseT += dts;
    if (phaseT > 13) applyPhase((phase + 1) % STEPS.length);
    const pd = 1 - Math.exp(-lam * dts);
    for (const n of nuclei) if (n.alive && Math.random() < pd) decayAt(n);
    if (aliveCnt < 4) seed();
    updateHero(dts);
    for (const o of parts) if (o.on) o.t += dts;
    for (const o of nus) if (o.on) o.t += dts;
  }
  if (camLerp) {
    const k = 1 - Math.exp(-2.6 * dt);
    camera.position.lerp(camGoal.p, k);
    controls.target.lerp(camGoal.t, k);
  }
  /* 样品实例 */
  for (let i = 0; i < NA; i++) {
    m4.makeScale(1, 1, 1);
    m4.setPosition(nuclei[i].p);
    sampleMesh.setMatrixAt(i, m4);
    sampleMesh.setColorAt(i, nuclei[i].alive ? C_ALIVE : C_DEAD);
  }
  sampleMesh.instanceMatrix.needsUpdate = true;
  if (sampleMesh.instanceColor) sampleMesh.instanceColor.needsUpdate = true;
  /* 直方柱(空柱全轴缩没,避免 z 深度渲染成满宽横条) */
  for (let i = 0; i < NB; i++) {
    if (bins[i] > 0) {
      const len = 0.03 + clamp(bins[i] / binMax, 0, 1) * 1.42;
      m4.makeScale(len, 1, 1);
      m4.setPosition(2.74 + len / 2, yOf((i + 0.5) / NB * Q), 0);
    } else {
      m4.makeScale(0.001, 0.001, 0.001);
      m4.setPosition(0, -5, 0);
    }
    binMesh.setMatrixAt(i, m4);
  }
  binMesh.instanceMatrix.needsUpdate = true;
  /* 电子 */
  let k = 0;
  for (const o of parts) {
    if (!o.on) continue;
    const u = o.t / o.dur;
    if (u >= 1) {
      o.on = false;
      if (!o.demo) {
        bins[o.bin]++;
        if (bins[o.bin] > binMax) binMax = bins[o.bin];
        lastEe = o.Ee; lastEnu = o.Enu; lastErec = o.Erec;
      }
      continue;
    }
    const sc = 1 - 0.4 * u;
    m4.makeScale(sc, sc, sc);
    m4.setPosition(o.p.x + (o.tgt.x - o.p.x) * u, o.p.y + (o.tgt.y - o.p.y) * u, o.p.z + (o.tgt.z - o.p.z) * u);
    eMesh.setMatrixAt(k, m4);
    eMesh.setColorAt(k, o.col);
    k++;
  }
  for (let i = k; i < EPN; i++) { m4.makeScale(0.001, 0.001, 0.001); m4.setPosition(0, -5, 0); eMesh.setMatrixAt(i, m4); }
  eMesh.instanceMatrix.needsUpdate = true;
  if (eMesh.instanceColor) eMesh.instanceColor.needsUpdate = true;
  /* 中微子 */
  let nk = 0;
  for (const o of nus) {
    if (!o.on) continue;
    const u = o.t / o.dur;
    if (u >= 1) { o.on = false; continue; }
    if (playing) o.p.addScaledVector(o.v, dts);
    const sc = 0.9 * (1 - u) + 0.1;
    m4.makeScale(sc, sc, sc);
    m4.setPosition(o.p);
    nuMesh.setMatrixAt(nk++, m4);
  }
  for (let i = nk; i < NPN; i++) { m4.makeScale(0.001, 0.001, 0.001); m4.setPosition(0, -5, 0); nuMesh.setMatrixAt(i, m4); }
  nuMesh.instanceMatrix.needsUpdate = true;
  /* stats 读数 */
  stEe.innerHTML = lastEe >= 0 ? lastEe.toFixed(1) + '<small> keV</small>' : '—';
  if (lastEe >= 0) {
    if (nuOn) { stLedger.className = 'v g'; stLedger.innerHTML = '✓<small> 156 keV</small>'; }
    else { stLedger.className = 'v r'; stLedger.innerHTML = '亏空 ' + (Q - lastEe - lastErec).toFixed(1) + '<small> keV</small>'; }
  } else { stLedger.className = 'v'; stLedger.textContent = '—'; }
  stDec.textContent = decays;
  stFrac.innerHTML = (aliveCnt / NA * 100).toFixed(1) + '<small>%</small>';
  drawSpec();
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* ---------------- 启动 ---------------- */
seed();
elHlVal.textContent = hlVis + ' s';
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
applyTheme();
applyLang();
setPlayLabel();
setMode('b-');
const t0 = parseInt(qs.get('t'), 10);
if (Number.isFinite(t0) && t0 >= 1 && t0 <= STEPS.length) applyPhase(t0 - 1); else applyPhase(0);
requestAnimationFrame(frame);
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
