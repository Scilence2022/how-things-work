<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>克拉德尼图形 · 把声音拍成看得见的沙画</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="克拉德尼图形" data-en="Chladni Patterns">克拉德尼图形</h1>
  <div class="sub" data-zh="撒在振动铜板上的沙子自己排队:板在固有频率上振出驻波,波腹抖得凶、波节纹丝不动,沙子全被抖离波腹、汇入节线——每一个频率锁出一副几何花纹,克拉德尼把声音拍成了看得见的沙画 · 拖动旋转 / 空格运行/暂停" data-en="Sand sprinkled on a vibrating plate lines up by itself: at a natural frequency the plate rings into standing waves — antinodes shake hard, nodes stay perfectly still — and the sand is shaken off the antinodes into the nodal lines; each frequency locks in one geometric pattern; Chladni turned sound into visible sand drawings · drag to orbit / Space = run/pause">撒在振动铜板上的沙子自己排队:板在固有频率上振出驻波,波腹抖得凶、波节纹丝不动,沙子全被抖离波腹、汇入节线——每一个频率锁出一副几何花纹,克拉德尼把声音拍成了看得见的沙画 · 拖动旋转 / 空格运行/暂停</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <span class="k" data-zh="驱动频率" data-en="Drive frequency">驱动频率</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="振型 (m,n)" data-en="Mode (m,n)">振型 (m,n)</span><span class="v" id="stMN">—</span>
  <span class="k" data-zh="节线数" data-en="Nodal lines">节线数</span><span class="v" id="stNodes">—</span>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>

    <button class="abtn on" id="bBase" data-zh="方板基频" data-en="Square, fundamental">方板基频</button>
    <button class="abtn" id="bHigh" data-zh="高阶振型" data-en="Higher mode">高阶振型</button>

      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglDisp" type="checkbox" checked> <span data-zh="板面位移着色" data-en="Displacement colors">板面位移着色</span></label>

  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(4.6,4.5,7.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(22,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const daisM=new THREE.MeshStandardMaterial({color:0x242a34,roughness:0.85});
const dais=new THREE.Mesh(new THREE.CylinderGeometry(6,6,0.16,64),daisM);
dais.position.y=-0.08;scene.add(dais);

/* ---- 底座+立柱+激振器 ---- */
const metalM=new THREE.MeshStandardMaterial({color:0x2b3038,metalness:0.85,roughness:0.35});
const base=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.9,0.35,48),metalM);
base.position.y=0.175;scene.add(base);
const pillar=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,1.13,16),metalM);
pillar.position.y=0.915;scene.add(pillar);
const exciter=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.2,24),metalM);
exciter.position.y=1.36;scene.add(exciter);
const coil=new THREE.Mesh(new THREE.TorusGeometry(0.32,0.03,8,32),
  new THREE.MeshStandardMaterial({color:0x74c0fc,metalness:0.6,roughness:0.3,emissive:0x1864ab,emissiveIntensity:0.5}));
coil.rotation.x=Math.PI/2;coil.position.y=1.25;scene.add(coil);

/* ---- 方板(可变形+顶点着色) ---- */
const matBase=new THREE.MeshStandardMaterial({color:0x39414e,metalness:0.7,roughness:0.35});
const matDisp=new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.6,roughness:0.35,vertexColors:true});
const sqGeo=new THREE.BoxGeometry(2.3,0.05,2.3,24,1,24);
const baseSq=sqGeo.attributes.position.array.slice();
sqGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(sqGeo.attributes.position.count*3).fill(0.24),3));
const sqPlate=new THREE.Mesh(sqGeo,matDisp);
sqPlate.position.y=1.5;scene.add(sqPlate);
const sqG=new THREE.Group();sqG.add(sqPlate);scene.add(sqG);

/* ---- 圆板:可变形顶面 + 静止侧沿/底 ---- */
const ciGeo=new THREE.RingGeometry(0.17,1.15,48,10);
ciGeo.rotateX(-Math.PI/2);
const baseCi=ciGeo.attributes.position.array.slice();
ciGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(ciGeo.attributes.position.count*3).fill(0.24),3));
const ciTop=new THREE.Mesh(ciGeo,matDisp);
ciTop.position.y=1.525;
const rim=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,0.05,48,1,true),matBase);
rim.position.y=1.5;
const ciBottom=new THREE.Mesh(new THREE.CircleGeometry(1.15,48),matBase);
ciBottom.rotation.x=Math.PI/2;ciBottom.position.y=1.476;
const ciG=new THREE.Group();ciG.add(ciTop);ciG.add(rim);ciG.add(ciBottom);
ciG.visible=false;scene.add(ciG);

/* ---- 沙粒(InstancedMesh,3000+) ---- */
const NP=3200;
const sand=new THREE.InstancedMesh(new THREE.SphereGeometry(0.02,6,5),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:1}),NP);
scene.add(sand);
const su=new Float32Array(NP),sv=new Float32Array(NP),sandS=new Float32Array(NP);
const cTmp=new THREE.Color();
for(let i=0;i<NP;i++){
  su[i]=(Math.random()*2-1)*1.07;sv[i]=(Math.random()*2-1)*1.07;
  sandS[i]=0.8+0.5*Math.random();
  cTmp.setHSL(0.09+0.02*Math.random(),0.32,0.66+0.16*Math.random());
  sand.setColorAt(i,cTmp);
}
sand.instanceColor.needsUpdate=true;

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let shape='square',f=300,amp=1,slowMo=false,dispOn=true;
let mM=1,nN=1,f0=168,res=0,anU=0.5,anV=0.5,ndU=0.5,ndV=0.5;
let agPct=0,agDisp=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 方板振型:cos(mπu)cos(nπv) ∓ cos(nπu)cos(mπv)(中心被立柱夹持);
   圆板振型:cos(mθ)·sin((n+1/2)π·r)(节径 m 条 + 节圆 n 圈) */
let s0=0,s1=0,s2=0;
function psiG(u,v){
  const P=Math.PI;
  if(shape==='square'){
    if(mM===nN){
      const cu=Math.cos(mM*P*u),smu=Math.sin(mM*P*u),cv=Math.cos(mM*P*v),smv=Math.sin(mM*P*v);
      s0=cu*cv;s1=-mM*P*smu*cv;s2=-mM*P*cu*smv;
    }else{
      const cmu=Math.cos(mM*P*u),smu=Math.sin(mM*P*u),cnv=Math.cos(nN*P*v),snv=Math.sin(nN*P*v);
      const cnu=Math.cos(nN*P*u),snu=Math.sin(nN*P*u),cmv=Math.cos(mM*P*v),smv=Math.sin(mM*P*v);
      s0=cmu*cnv-cnu*cmv;
      s1=-mM*P*smu*cnv+nN*P*snu*cmv;
      s2=-nN*P*cmu*snv+mM*P*cnu*smv;
    }
  }else{
    const r=Math.hypot(u,v);
    if(r<1e-5){s0=0;s1=0;s2=0;return;}
    const rr=Math.min(1.03,r/1.05),th=Math.atan2(v,u),Pk=(nN+0.5)*P;
    const sm=Math.sin(Pk*rr),cm=Math.cos(Pk*rr);
    const cth=Math.cos(mM*th),sth=Math.sin(mM*th);
    s0=cth*sm;
    const dr=cth*Pk*cm/1.05,dth=-sth*sm;
    s1=dr*(u/r)+dth*(-v/(r*r));
    s2=dr*(v/r)+dth*(u/(r*r));
  }
}
/* 固有频率表:方板 f∝m²+n²;圆板经验表 */
const CIRC=[{m:0,n:1,f:195},{m:1,n:1,f:385},{m:2,n:1,f:585},{m:0,n:2,f:640},{m:3,n:1,f:815},
  {m:1,n:2,f:880},{m:4,n:1,f:1060},{m:2,n:2,f:1150},{m:5,n:1,f:1320},{m:3,n:2,f:1440},
  {m:1,n:3,f:1520},{m:6,n:1,f:1600},{m:4,n:2,f:1700},{m:0,n:3,f:1730}];
function pickMode(){
  let best=null;
  if(shape==='square'){
    for(let m=1;m<=6;m++)for(let n=1;n<=m;n++){
      const fq=84*(m*m+n*n);
      if(fq>2050)continue;
      if(!best||Math.abs(f-fq)<Math.abs(f-best.f))best={m,n,f:fq};
    }
  }else{
    CIRC.forEach(c=>{if(!best||Math.abs(f-c.f)<Math.abs(f-best.f))best={m:c.m,n:c.n,f:c.f};});
  }
  mM=best.m;nN=best.n;f0=best.f;
  res=Math.exp(-Math.pow((f-f0)/30,2));
  /* 波腹锚点:网格扫描最大 |ψ| */
  let ba=0;
  for(let i=0;i<=40;i++)for(let j=0;j<=40;j++){
    const u=-1+2*i/40,v=-1+2*j/40;
    psiG(u,v);
    const a=Math.abs(s0);
    if(a>ba){ba=a;anU=u;anV=v;}
  }
  /* 节线锚点:解析零点 */
  if(shape==='square'){
    if(mM===nN){ndU=0.5;ndV=0.5;}
    else{ndU=0;ndV=2/(mM+nN);}
  }else{
    if(mM>0){const th=Math.PI/(2*mM);ndU=0.6*Math.cos(th);ndV=0.6*Math.sin(th);}
    else{ndU=1/(nN+0.5);ndV=0;}
  }
  lblAntin.position.set(anU*1.05,2.5,anV*1.05);
  lblNode.position.set(ndU*1.05,2.5,ndV*1.05);
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblAntin=addLabel(()=>L('波腹:振幅最大,沙被抖走','Antinode: peak amplitude — sand is shaken away'),
  new THREE.Vector3(0.5,2.5,0.5),'o',()=>res>0.4);
const lblNode=addLabel(()=>L('节线:振幅为零,沙的集合地','Nodal line: zero amplitude — where sand gathers'),
  new THREE.Vector3(0,2.5,0.35),'',()=>res>0.4);
addLabel(()=>L('激振器:电磁驱动,频率 f 连续可扫','Shaker: electromagnetic drive, frequency f sweeps continuously'),
  new THREE.Vector3(0.85,1.05,0.4),'b');
addLabel(()=>L(`命中固有频率 f₀ = ${f0} Hz`,`Hit a natural frequency f₀ = ${f0} Hz`),
  new THREE.Vector3(0,3.2,0),'g',()=>res>0.55);

function setF(v){
  f=Math.round(clamp(v,100,2000));
  document.getElementById('sF').value=f;
  document.getElementById('sFVal').textContent=f+' Hz';
  pickMode();
}
function setAmp(v){
  amp=clamp(v,0.2,2);
  document.getElementById('sAmp').value=amp;
  document.getElementById('sAmpVal').textContent='×'+amp.toFixed(2);
}
function setShape(s){
  shape=s;
  sqG.visible=s==='square';ciG.visible=s==='circle';
  pickMode();
}
function resetSand(){
  for(let i=0;i<NP;i++){
    if(shape==='square'){su[i]=(Math.random()*2-1)*1.07;sv[i]=(Math.random()*2-1)*1.07;}
    else{const r=Math.sqrt(Math.random())*1.07,a2=Math.random()*6.2832;su[i]=r*Math.cos(a2);sv[i]=r*Math.sin(a2);}
  }
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'扫频开始:沙随机铺满',en:'The sweep begins: sand scattered at random',
  act(){setShape('square');setF(300);setAmp(1);resetSand();}},
 {zh:'命中固有频率:整板共振',en:'Hit a natural frequency: the whole plate resonates',
  act(){setShape('square');setF(168);resetSand();}},
 {zh:'驻波形成:波腹狂抖、波节静止',en:'A standing wave forms: antinodes shake hard, nodes sit still',
  act(){setShape('square');setF(168);}},
 {zh:'沙被抖离波腹,汇入节线',en:'Sand is shaken off the antinodes and collects along the nodal lines',
  act(){setShape('square');setF(420);}},
 {zh:'频率翻倍:节线数翻倍',en:'Double the frequency and the nodal lines multiply',
  act(){setShape('square');setF(840);}},
 {zh:'一张沙图=一次振型测绘:从克拉德尼到音叉厂',en:'One sand picture = one vibration-mode survey: from Chladni to the tuning-fork works',
  act(){setShape('circle');setF(880);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stF').innerHTML=f.toFixed(0)+'<small> Hz</small>';
  const eM=document.getElementById('stMN');
  eM.textContent=`${mM} , ${nN}`;
  eM.className='v '+(res>0.55?'ok':'');
  document.getElementById('stNodes').innerHTML=(mM+nN)+'<small>'+L(' 条',' lines')+'</small>';
  agDisp+=(agPct-agDisp)*0.35;
  const eA=document.getElementById('stAg');
  eA.innerHTML=agDisp.toFixed(0)+'<small> %</small>';
  eA.className='v '+(agDisp>55?'ok':'');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function presetBtn(id){['bBase','bHigh','bCircle'].forEach(b=>document.getElementById(b).classList.toggle('on',b===id));}
document.getElementById('bBase').addEventListener('click',()=>{setShape('square');setF(168);presetBtn('bBase');resetSand();});
document.getElementById('bHigh').addEventListener('click',()=>{setShape('square');setF(1092);presetBtn('bHigh');resetSand();});
document.getElementById('bCircle').addEventListener('click',()=>{setShape('circle');setF(880);presetBtn('bCircle');resetSand();});
document.getElementById('sF').addEventListener('input',e=>setF(+e.target.value));
document.getElementById('sAmp').addEventListener('input',e=>setAmp(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglDisp').addEventListener('change',e=>{
  dispOn=e.target.checked;
  sqPlate.material=ciTop.material=dispOn?matDisp:matBase;
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  daisM.color.setHex(dark?0x242a34:0xbfb8ac);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
const nodeC=[0.145,0.20,0.29],hotC=[1.0,0.663,0.302];
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const k=res*amp,dt60=dts*60;
  const phase=Math.sin(simT*6.2832*f0*0.02);
  const dispAmp=0.07*k;
  /* 沙粒:波腹强抖动 + 沿 |ψ| 梯度向节线迁移 */
  if(sand.visible&&dts>0){
    let low=0;
    for(let i=0;i<NP;i++){
      let u=su[i],v=sv[i];
      psiG(u/1.05,v/1.05);
      let a=Math.abs(s0);if(a>1.6)a=1.6;a/=1.6;
      if(a<0.12)low++;
      const jit=0.021*(0.35+2.2*a*k)*dt60;
      u+=(Math.random()-0.5)*jit;v+=(Math.random()-0.5)*jit;
      const gl=Math.hypot(s1,s2);
      if(gl>1e-4&&k>0.02){
        const g=0.010*k*dt60/(1+gl),sg=s0>=0?1:-1;
        u-=g*sg*s1;v-=g*sg*s2;
      }
      if(shape==='square'){u=clamp(u,-1.08,1.08);v=clamp(v,-1.08,1.08);}
      else{
        const r=Math.hypot(u,v);
        if(r>1.08){u*=1.08/r;v*=1.08/r;}
        else if(r<0.19&&r>1e-6){u*=0.19/r;v*=0.19/r;}
      }
      su[i]=u;sv[i]=v;
      const dz=dispAmp*s0*phase;
      const hop=a*k*0.03*Math.abs(Math.sin(simT*13+i*0.7));
      m4.makeScale(sandS[i],sandS[i],sandS[i]);
      m4.setPosition(u,1.535+dz+hop,v);
      sand.setMatrixAt(i,m4);
    }
    sand.instanceMatrix.needsUpdate=true;
    agPct=low/NP*100;
  }
  /* 板面:驻波微形变 + 位移着色 */
  const geo=sqG.visible?sqGeo:ciGeo,baseA=sqG.visible?baseSq:baseCi,mesh=sqG.visible?sqPlate:ciTop;
  const pos=geo.attributes.position,col=geo.attributes.color;
  for(let i=0;i<pos.count;i++){
    const x=baseA[i*3],z=baseA[i*3+2];
    psiG(x/1.05,z/1.05);
    pos.setY(i,baseA[i*3+1]+dispAmp*s0*phase);
    if(dispOn){
      let a=Math.abs(s0)/1.4;if(a>1)a=1;
      col.setXYZ(i,
        nodeC[0]+(hotC[0]-nodeC[0])*a,
        nodeC[1]+(hotC[1]-nodeC[1])*a,
        nodeC[2]+(hotC[2]-nodeC[2])*a);
    }
  }
  pos.needsUpdate=true;
  geo.computeVertexNormals();
  if(dispOn)col.needsUpdate=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setF(300);setAmp(1);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
