<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>大气逃逸与行星宜居 · 高斯尾巴一撮撮漏光行星</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#3bc9db;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1098ab;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(59,201,219,.6);background:rgba(59,201,219,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(16,152,171,.55);background:rgba(16,152,171,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(59,201,219,.10);border-color:rgba(59,201,219,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(16,152,171,.08);border-color:rgba(16,152,171,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#c5f6fa}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="大气逃逸与行星宜居" data-en="Atmospheric Escape & Habitability">大气逃逸与行星宜居</h1>
  <div class="sub" data-zh="气体分子速度有分布,高斯尾巴总有一撮超过逃逸速度:行星太轻或太热,大气就一点一点漏光——火星丢了磁层被太阳风剥,金星蒸干的水只剩重水作证 · 拖动旋转 / 空格运行/暂停" data-en="Molecular speeds spread out, and the Gaussian tail always has a few over escape velocity: too light or too hot a planet leaks its air a molecule at a time — Mars lost its magnetic shield and was stripped by the solar wind; Venus boiled its water away and the leftover deuterium testifies · drag to orbit / Space = run/pause">气体分子速度有分布,高斯尾巴总有一撮超过逃逸速度:行星太轻或太热,大气就一点一点漏光——火星丢了磁层被太阳风剥,金星蒸干的水只剩重水作证 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="逃逸速度" data-en="Escape velocity">逃逸速度</span><span class="v" id="stVesc">—</span>
  <span class="k" data-zh="外逸层温度" data-en="Exosphere T">外逸层温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="逃逸通量" data-en="Escape flux">逃逸通量</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="剩余大气" data-en="Air left">剩余大气</span><span class="v" id="stAir">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn" id="bEarth" data-zh="地球(有磁场)" data-en="Earth (shielded)">地球(有磁场)</button>
    <button class="abtn" id="bMars" data-zh="火星(失磁对照)" data-en="Mars (stripped)">火星(失磁对照)</button>
    <button class="abtn" id="bVenus" data-zh="金星(烤炉对照)" data-en="Venus (baked)">金星(烤炉对照)</button>
  </div>
  <div class="row">
    <label data-zh="行星质量 (M⊕)" data-en="Mass (M⊕)">行星质量 (M⊕)</label>
    <input id="sM" type="range" min="0.1" max="3" step="0.05" value="1">
    <span class="val" id="sMVal">1.00</span>
  </div>
  <div class="row">
    <label data-zh="恒星活动" data-en="Stellar activity">恒星活动</label>
    <input id="sAct" type="range" min="0.5" max="5" step="0.5" value="1.5">
    <span class="val" id="sActVal">×1.5</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglDist" type="checkbox" checked> <span data-zh="速度分布" data-en="Speed tail">速度分布</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../venus-greenhouse/" data-zh="金星与失控温室" data-en="Venus & the Runaway Greenhouse">金星与失控温室</a>
    <a href="../solar-wind/" data-zh="太阳风与日冕加热" data-en="Solar Wind & The Hot Corona">太阳风与日冕加热</a>
    <a href="../aurora/" data-zh="极光" data-en="Aurora">极光</a>
    <a href="../exoplanet-transit/" data-zh="系外行星:凌星法" data-en="Exoplanets: the Transit Method">系外行星:凌星法</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,90);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,300);
camera.position.set(-3,4.5,13);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.8,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.4));
const sunL=new THREE.DirectionalLight(0xfff2dd,1.1);sunL.position.set(-14,4,4);scene.add(sunL);
const stars=new THREE.Points(
  (()=>{const g=new THREE.BufferGeometry();const n=320;
    const a=new Float32Array(n*3);
    for(let i=0;i<n;i++){a[i*3]=(Math.random()-0.5)*110;a[i*3+1]=(Math.random()-0.3)*60;a[i*3+2]=(Math.random()-0.5)*110;}
    g.setAttribute('position',new THREE.BufferAttribute(a,3));return g;})(),
  new THREE.PointsMaterial({color:0x8ea6c0,size:0.1,transparent:true,opacity:0.6}));
scene.add(stars);

/* 行星 */
const planetG=new THREE.Group();planetG.position.set(1.5,0.8,0);scene.add(planetG);
const rockM=new THREE.MeshStandardMaterial({color:0x9a6a4a,roughness:0.85});
const rock=new THREE.Mesh(new THREE.SphereGeometry(1.0,36,26),rockM);
planetG.add(rock);
/* 大气壳(透明度=剩余大气) */
const atmM=new THREE.MeshPhysicalMaterial({color:0x74c0fc,roughness:0.15,transparent:true,
  opacity:0.5,side:THREE.DoubleSide,depthWrite:false});
const atm=new THREE.Mesh(new THREE.SphereGeometry(1.18,36,26),atmM);
planetG.add(atm);
/* 磁层(可选) */
const magM=new THREE.MeshBasicMaterial({color:0x74c0fc,wireframe:true,transparent:true,opacity:0.12});
const mag=new THREE.Mesh(new THREE.SphereGeometry(2.1,18,12),magM);
mag.scale.set(1.3,1,1);planetG.add(mag);
/* 逃逸粒子(从大气顶溜走的分子) */
const NESC=50;
const escM=new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.9});
const esc=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),escM,NESC);
esc.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(esc);
const escD=[];for(let i=0;i<NESC;i++)escD.push({t:Math.random()*2,a:Math.random()*Math.PI*2,elev:Math.random()*0.8+0.2});
const m4=new THREE.Matrix4();
/* 速度分布(高斯+尾巴,左侧竖板) */
const distG=new THREE.Group();distG.position.set(-4.8,1.6,0);distG.scale.setScalar(0.62);scene.add(distG);
const distBG=new THREE.Mesh(new THREE.BoxGeometry(6,3.4,0.1),
  new THREE.MeshStandardMaterial({color:0x232830,roughness:0.7}));
distG.add(distBG);
const NBIN=36;
const binsM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4});
const bins=new THREE.InstancedMesh(new THREE.BoxGeometry(0.1,1,0.1),binsM,NBIN);
distG.add(bins);
/* 逃逸门槛线 */
const vescLineM=new THREE.LineBasicMaterial({color:0xff6b6b});
const vescGeo=new THREE.BufferGeometry();
vescGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(2*3),3));
const vescLine=new THREE.Line(vescGeo,vescLineM);
distG.add(vescLine);
/* 太阳风(左侧粒子流) */
const NSW=30;
const swM=new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0.6});
const sw=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),swM,NSW);
sw.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(sw);
const swD=[];for(let i=0;i<NSW;i++)swD.push({t:Math.random(),y:(Math.random()-0.5)*5,z:(Math.random()-0.5)*3});

/* 状态 */
let mass=1.0,activity=1.5,shield=true,hot=false,playing=true,labelsOn=true,slowMo=false,distOn=true;
let air=1.0,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function vesc(){/* km/s ∝ sqrt(M/R),R∝M^0.27 for rocky */
  return 11.2*Math.sqrt(mass/Math.pow(mass,0.27))/1;}
function texo(){/* 外逸层温度 K */
  return (hot?700:230)*Math.pow(activity,0.7)*100/100*activity>0?(hot?700:230)*(0.6+0.4*activity):300;}
function texoK(){return (hot?700:230)*(0.55+0.45*activity);}
function flux(){/* Jeans 参数近似:尾巴越贴门槛越快漏 */
  const vth=0.5*Math.sqrt(texoK()/300);/* 视觉域速度 */
  const ratio=vth/(vesc()/11.2);
  return clamp(Math.exp(-2.5/Math.max(ratio,0.05))*8*(shield?0.25:1)*(0.4+activity*0.5),0,8);}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`逃逸速度 ${vesc().toFixed(1)} km/s:出门的票价`,`Escape velocity ${vesc().toFixed(1)} km/s: the ticket price`),
  new THREE.Vector3(1.5,3.4,0),'b');
addLabel(()=>L('速度分布的高斯尾巴:总有人跑得够快','The Gaussian tail: someone is always fast enough'),
  new THREE.Vector3(-4.8,3.8,0),'y',()=>distOn);
addLabel(()=>L('磁层偏转太阳风:大气多了把伞','The magnetosphere bends the wind — an umbrella for the air'),
  new THREE.Vector3(4.6,2.4,0),'g',()=>shield);
addLabel(()=>L('太阳风直接剥离:没有伞就硬淋','No shield: the solar wind strips it bare'),
  new THREE.Vector3(4.4,-1.2,0),'r',()=>!shield);
addLabel(()=>L('氢先走,氧跟着,水就没了','Hydrogen leaves, oxygen follows — the water is gone'),
  new THREE.Vector3(-2.4,-1.0,0),'o',()=>air<0.7);

function setMass(v){mass=clamp(v,0.1,3);
  document.getElementById('sM').value=mass;
  document.getElementById('sMVal').textContent=mass.toFixed(2);updateStats();}
function setAct(v){activity=clamp(v,0.5,5);
  document.getElementById('sAct').value=activity;
  document.getElementById('sActVal').textContent='×'+activity.toFixed(1);updateStats();}
function pick(which){
  if(which==='earth'){mass=1.0;shield=true;hot=false;}
  if(which==='mars'){mass=0.38;shield=false;hot=false;}
  if(which==='venus'){mass=0.82;shield=false;hot=true;}
  document.getElementById('bEarth').classList.toggle('on',which==='earth');
  document.getElementById('bMars').classList.toggle('on',which==='mars');
  document.getElementById('bVenus').classList.toggle('on',which==='venus');
  updateStats();}

const STEPS=[
 {zh:'地球:磁场撑伞,大气守得住',en:'Earth: the magnetic umbrella holds the air',
  act(){pick('earth');setAct(1.5);}},
 {zh:'质量减半:逃逸门槛降低一截',en:'Half the mass: the exit door lowers',
  act(){setMass(0.5);}},
 {zh:'火星:失磁四十一亿年,被风剥光',en:'Mars: four billion years unshielded and stripped',
  act(){pick('mars');setAct(2.5);}},
 {zh:'恒星发怒:年轻恒星的 EUV 更凶',en:'An angry star: the young EUV bites harder',
  act(){pick('mars');setAct(4.5);}},
 {zh:'金星:烤炉里的水,氢逃氧留',en:'Venus: water baked away — H leaves, O stays',
  act(){pick('venus');setAct(2);}},
 {zh:'宜居带不是保险箱:还得有磁场与质量',en:'The habitable zone is not a vault: mass and a field too',
  act(){pick('earth');setAct(3.5);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stVesc').innerHTML=vesc().toFixed(1)+'<small> km/s</small>';
  document.getElementById('stT').innerHTML=texoK().toFixed(0)+'<small> K</small>';
  const fv=document.getElementById('stF');
  fv.innerHTML=flux().toFixed(2)+'<small> rel</small>';
  fv.className='v '+(flux()>2?'warn':'ok');
  const av=document.getElementById('stAir');
  av.innerHTML=(100*air).toFixed(0)+'<small> %</small>';
  av.className='v '+(air<0.4?'warn':'ok');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bEarth').addEventListener('click',()=>pick('earth'));
document.getElementById('bMars').addEventListener('click',()=>pick('mars'));
document.getElementById('bVenus').addEventListener('click',()=>pick('venus'));
document.getElementById('sM').addEventListener('input',e=>setMass(+e.target.value));
document.getElementById('sAct').addEventListener('input',e=>setAct(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglDist').addEventListener('change',e=>{distOn=e.target.checked;distG.visible=distOn;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  planetG.rotation.y+=dts*0.2;
  mag.rotation.y=planetG.rotation.y;
  /* 大气流失 */
  air=clamp(air-flux()*dts*0.01,0.05,1);
  atmM.opacity=0.5*air+0.05;
  atm.scale.setScalar(1+0.1*air);
  rockM.color.setHex(hot?0xb08a5a:(air<0.4?0xa85a3a:0x9a6a4a));
  mag.visible=shield;
  /* 逃逸粒子 */
  const f=flux();
  for(let i=0;i<NESC;i++){
    const p=escD[i];
    if(p.t>1.8){p.t=Math.random()<clamp(f/6,0.1,1)?0:1.9;p.a=Math.random()*Math.PI*2;p.elev=Math.random()*0.8+0.2;}
    p.t+=dts*0.8;
    const r=1.2+p.t*2.4;
    const x=r*Math.cos(p.a)*Math.cos(p.elev*0.4);
    const y=r*Math.sin(p.elev);
    const z=r*Math.sin(p.a)*Math.cos(p.elev*0.4);
    const s=p.t<1.6?1-clamp(p.t-0.8,0,0.8):0.001;
    m4.makeScale(s,s,s);
    m4.setPosition(planetG.position.x+x,planetG.position.y+y,planetG.position.z+z);
    esc.setMatrixAt(i,m4);
  }
  esc.instanceMatrix.needsUpdate=true;
  /* 太阳风 */
  for(let i=0;i<NSW;i++){
    const p=swD[i];
    p.t+=dts*(0.5+activity*0.3);
    if(p.t>1)p.t-=1;
    const x=-9+p.t*17;
    let y=p.y,z=p.z;
    if(shield&&x>-2.6){/* 磁层偏转 */
      const dx=x+2.6;
      y+=Math.sign(y)*Math.max(0,(0.6-Math.abs(y)))*Math.min(dx,2)*0.5;
      z+=Math.sign(z)*0.4*Math.min(dx,2)*0.3;
    }
    const s=(!shield&&Math.abs(x-planetG.position.x)<1.2)?0.4:0.8;
    m4.makeScale(s,s,s);
    m4.setPosition(x,0.8+y*0.5,z);
    sw.setMatrixAt(i,m4);
  }
  sw.instanceMatrix.needsUpdate=true;
  /* 速度分布直方图 */
  const vth=0.5*Math.sqrt(texoK()/300);
  for(let i=0;i<NBIN;i++){
    const v=(i+0.5)/NBIN*3.2;
    const h=Math.exp(-Math.pow((v-vth)/0.45,2));
    const s=clamp(h*1.6,0.02,1.6);
    m4.makeScale(1,s,1);
    m4.setPosition(-2.8+v*1.55,-1.4+s/2,0.08);
    bins.setMatrixAt(i,m4);
    bins.setColorAt(i,i*3.2/NBIN>vesc()/11.2*2.2?new THREE.Color(0xff6b6b):new THREE.Color(0x74c0fc));
  }
  bins.instanceMatrix.needsUpdate=true;
  bins.instanceColor.needsUpdate=true;
  /* 逃逸门槛线 */
  const vx=clamp(vesc()/11.2*1.45,0,3.1);
  const vp=vescLine.geometry.attributes.position;
  vp.setXYZ(0,-2.8+vx,-1.3,0.1);
  vp.setXYZ(1,-2.8+vx,0.7,0.1);
  vp.needsUpdate=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
distG.visible=distOn;
pick('earth');
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
