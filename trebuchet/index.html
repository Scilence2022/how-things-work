<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>投石机 · 配重的势能,一甩千斤</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ff922b;--acc-rgb:255,146,43;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;--acc-rgb:232,89,12;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(var(--acc-rgb),.6);background:rgba(var(--acc-rgb),.12);color:var(--text)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(var(--acc-rgb),.10);border-color:rgba(var(--acc-rgb),.45)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="投石机与配重抛射" data-en="The Trebuchet">投石机与配重抛射</h1>
  <div class="sub" data-zh="绞盘把配重举到高处蓄势,释放销一脱,势能在半秒内走完交接:长臂立起、软索甩摆追上、末端鞭击补速,石弹以接近 45° 出射 · 拖动旋转 / 空格运行/暂停" data-en="A winch hoists the counterweight; release the pin and potential energy changes hands in half a second — beam rears up, sling lashes like a whip, stone leaves near 45° · drag to orbit / Space = run/pause">绞盘把配重举到高处蓄势,释放销一脱,势能在半秒内走完交接:长臂立起、软索甩摆追上、末端鞭击补速,石弹以接近 45° 出射 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="弹丸初速" data-en="Muzzle speed">弹丸初速</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="射程" data-en="Range">射程</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="峰值高度" data-en="Apex">峰值高度</span><span class="v" id="stH">—</span>
  <span class="k" data-zh="能量传递率" data-en="Energy transfer">能量传递率</span><span class="v" id="stEff">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bFire" data-zh="🚀 发射" data-en="🚀 Fire">🚀 发射</button>
    <button class="abtn" id="bCock" data-zh="🔄 重新装填" data-en="🔄 Reload">🔄 重新装填</button>
    <button class="abtn" id="bCine" data-zh="🎬 慢放发射" data-en="🎬 Slow launch">🎬 慢放发射</button>
  </div>
  <div class="row">
    <label data-zh="配重质量 (kg)" data-en="Counterweight (kg)">配重质量 (kg)</label>
    <input id="sCW" type="range" min="20" max="120" step="5" value="60">
    <span class="val" id="sCWVal">60</span>
  </div>
  <div class="row">
    <label data-zh="长短臂比" data-en="Short/long arm ratio">长短臂比</label>
    <input id="sArm" type="range" min="0.25" max="0.6" step="0.01" value="0.4">
    <span class="val" id="sArmVal">0.4</span>
  </div>
  <div class="row">
    <label data-zh="释放角 (°)" data-en="Release angle (°)">释放角 (°)</label>
    <input id="sRel" type="range" min="35" max="70" step="1" value="55">
    <span class="val" id="sRelVal">55</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglSling" type="checkbox" checked> <span data-zh="有 sling 对照" data-en="Sling on/off">有 sling 对照</span></label>
      <label><input id="tglTrail" type="checkbox" checked> <span data-zh="弹道轨迹" data-en="Trajectory">弹道轨迹</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../lever-pulley/" data-zh="杠杆滑轮" data-en="Lever &amp; Pulley">杠杆滑轮</a>
    <a href="../angular-momentum/" data-zh="角动量" data-en="Angular Momentum">角动量</a>
    <a href="../flywheel/" data-zh="飞轮储能" data-en="The Flywheel">飞轮储能</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const m4=new THREE.Matrix4();
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,400);
camera.position.set(-7,6,12);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=120;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyLight=new THREE.DirectionalLight(0xfff2dd,1.05);keyLight.position.set(6,10,8);scene.add(keyLight);
const fillLight=new THREE.DirectionalLight(0x9ab8ff,0.3);fillLight.position.set(-8,5,-6);scene.add(fillLight);

/* ---- 页面独特代码(定义 BG_DARK/BG_LIGHT/applyPageTheme/STEPS/updateStats/tick/pageInit) ---- */
const BG_DARK=0x101418,BG_LIGHT=0xe9e4dc;
/* ---- 地面与标尺 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.x=8;scene.add(ground);
const rulerM=new THREE.MeshStandardMaterial({color:0x5b6b7d,roughness:0.6});
for(let m=0;m<=40;m+=5){
  const tick=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.02,1.6),rulerM);
  tick.position.set(m-4,0.012,3.2);scene.add(tick);
}
/* ---- 机架 ---- */
const woodM=new THREE.MeshStandardMaterial({color:0x8a6a45,roughness:0.85});
const darkWoodM=new THREE.MeshStandardMaterial({color:0x5f4630,roughness:0.9});
function leg(x,z,tilt){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.16,4.2,8),woodM);
  b.position.y=2.1;g.add(b);g.position.set(x,0,z);g.rotation.z=tilt;
  scene.add(g);return g;
}
leg(-0.9,0.55,0.14);leg(-0.9,-0.55,-0.14);leg(0.9,0.55,-0.14);leg(0.9,-0.55,0.14);
const axle=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,2.2,10),darkWoodM);
axle.rotation.x=Math.PI/2;axle.position.set(0,3.4,0);scene.add(axle);
const baseBeam=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.18,1.6),darkWoodM);
baseBeam.position.set(0,0.09,0);scene.add(baseBeam);
/* ---- 长臂+配重 ---- */
const armG=new THREE.Group();armG.position.set(0,3.4,0);scene.add(armG);
const longArm=new THREE.Mesh(new THREE.BoxGeometry(6.0,0.16,0.22),woodM);
longArm.position.x=3.0;armG.add(longArm);
const shortArm=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.16,0.22),woodM);
shortArm.position.x=-1.2;armG.add(shortArm);
const cwBox=new THREE.Group();scene.add(cwBox);
const cwMesh=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.8,0.9),
  new THREE.MeshStandardMaterial({color:0x6b7280,roughness:0.5,metalness:0.4}));
cwMesh.position.y=-0.45;cwBox.add(cwMesh);
const hanger=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.9,6),darkWoodM);
hanger.position.y=-0.15;cwBox.add(hanger);
/* ---- sling 与石弹 ---- */
const slingMat=new THREE.LineBasicMaterial({color:0xd9b38c});
const slingGeo=new THREE.BufferGeometry();
slingGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
const slingLine=new THREE.Line(slingGeo,slingMat);scene.add(slingLine);
const pouch=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.08,0.36),darkWoodM);scene.add(pouch);
const stoneM=new THREE.MeshStandardMaterial({color:0x9aa3ad,roughness:0.65});
const stone=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12),stoneM);scene.add(stone);
/* ---- 轨迹线 ---- */
const NPT=300;
const trailGeo=new THREE.BufferGeometry();
trailGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NPT*3),3));
trailGeo.setDrawRange(0,0);
const trail=new THREE.Line(trailGeo,new THREE.LineDashedMaterial({color:0xffd43b,dashSize:0.35,gapSize:0.22,transparent:true,opacity:0.9}));
scene.add(trail);
let trailN=0;
/* ---- 状态 ---- */
const G=9.81;
let mCW=60,armRatio=0.4,relDeg=55;
let slingOn=true,trailOn=true;
let mode='cocked';                 /* cocked | firing | flown */
let th=0,thv=0,psi=0,psiv=0;       /* 臂角 / sling 角 */
let proj=null,projV=null,apex=0,v0=0;
let eff=0,rangeX=0;
const PIV=new THREE.Vector3(0,3.4,0);
function armGeom(){const total=6.0;const long=total/(1+armRatio);return{long,short:total-long};}
function tipPos(t){
  const g=armGeom();
  return new THREE.Vector3(PIV.x+Math.sin(t)*g.long,PIV.y-Math.cos(t)*g.long,0);
}
function shortPos(t){
  const g=armGeom();
  return new THREE.Vector3(PIV.x-Math.sin(t)*g.short,PIV.y+Math.cos(t)*g.short,0);
}
function cock(){
  mode='cocked';th=-0.85;thv=0;psi=0.95;psiv=0;
  proj=null;projV=null;apex=0;v0=0;eff=0;rangeX=0;trailN=0;trailGeo.setDrawRange(0,0);
  const p=pouchPos(th,psi);stone.position.copy(p);stone.visible=true;pouch.visible=true;
  updateArm();updateStats();
}
function pouchPos(t,ps){
  const tip=tipPos(t);
  const dir=new THREE.Vector3(Math.sin(t+ps),-Math.cos(t+ps),0); /* 相对竖直 */
  return tip.clone().add(dir.multiplyScalar(2.0));
}
function updateArm(){
  armG.rotation.z=th-Math.PI/2;              /* 渲染臂向=物理臂向:th 增大→长臂向前立起 */
  const sp=shortPos(th);
  cwBox.position.copy(sp);
  const p=pouchPos(th,psi);
  pouch.position.copy(p);
  const tip=tipPos(th);
  const arr=slingGeo.attributes.position.array;
  arr[0]=tip.x;arr[1]=tip.y;arr[2]=0;arr[3]=p.x;arr[4]=p.y;arr[5]=0;
  slingGeo.attributes.position.needsUpdate=true;
  slingLine.visible=slingOn&&mode!=='flown';
  stone.visible=mode!=='flown'||trailOn;
  if(mode!=='flown')stone.position.copy(p);
  if(proj){stone.position.copy(proj);}
}
function fire(){
  if(mode!=='cocked')cock();
  mode='firing';trailN=0;trailGeo.setDrawRange(0,0);
}
function releaseVelocity(t,tv,psv){
  const tip=tipPos(t);
  const tipV=new THREE.Vector3(Math.cos(t),Math.sin(t),0).multiplyScalar(tv*armGeom().long);
  if(!slingOn)return tipV.multiplyScalar(1.0);
  const whip=clamp(Math.abs(psv)/(Math.abs(tv)+0.6),0,1.3);
  const speed=tipV.length()*(0.62+0.5*whip);
  const dir=tipV.clone().normalize();
  dir.y+=0.35+0.25*whip;dir.normalize();
  return dir.multiplyScalar(speed);
}
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'绞盘蓄势:配重升顶、sling 收拢',en:'Winch cocks: weight up, sling gathered',
  act(){cock();mCW=Math.max(mCW,60);mode='cocked';updateStats();}},
 {zh:'释放:配重下坠,长臂立起',en:'Release: weight drops, beam rears up',
  act(){cock();fire();}},
 {zh:'鞭击:sling 追平并反超,补一记速度',en:'The whip: sling catches up and cracks',
  act(){cock();fire();}},
 {zh:'45° 出射:释放角定射程',en:'Leave near 45°: release angle sets range',
  act(){relDeg=45;document.getElementById('sRel').value=45;document.getElementById('sRelVal').textContent='45.0';cock();fire();}},
 {zh:'配重比与臂比:射程扫参',en:'Sweep mass & arm ratios',
  act(){mCW=100;armRatio=0.55;document.getElementById('sCW').value=100;document.getElementById('sArm').value=0.55;cock();fire();}},
 {zh:'无 sling 对照:纯杠杆损失鞭击',en:'No sling: a plain lever loses the whip',
  act(){slingOn=false;document.getElementById('tglSling').checked=false;cock();fire();}},
];
/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stV').innerHTML=v0?v0.toFixed(1)+' <small>m/s</small>':'—';
  document.getElementById('stR').innerHTML=rangeX?rangeX.toFixed(1)+' <small>m</small>':'—';
  document.getElementById('stH').innerHTML=apex?apex.toFixed(1)+' <small>m</small>':'—';
  const e=document.getElementById('stEff');
  e.innerHTML=eff?(eff*100).toFixed(0)+'<small>%</small>':'—';
  e.className='v '+(eff>0.5?'ok':'');
}
/* ---- 主题 ---- */
function applyPageTheme(dark){groundM.color.setHex(dark?0x1c2027:0xc9c2b6);}
/* ---- 控件 ---- */
function pageInit(){
  const $=id=>document.getElementById(id);
  const bind=(id,dec,fn)=>{const el=$(id);const f=()=>{fn(+el.value);if($(id+'Val'))$(id+'Val').textContent=(+el.value).toFixed(dec);};el.addEventListener('input',f);f();};
  bind('sCW',0,v=>{mCW=v;if(mode==='cocked')updateArm();});
  bind('sArm',2,v=>{armRatio=v;if(mode==='cocked')cock();});
  bind('sRel',0,v=>{relDeg=v;});
  $('bFire').addEventListener('click',()=>{cock();fire();});
  $('bCock').addEventListener('click',cock);
  $('bCine').addEventListener('click',()=>{cock();document.getElementById('tglSlow').checked=true;slowMo=true;fire();});
  $('tglSling').addEventListener('change',e=>{slingOn=e.target.checked;if(mode==='cocked')updateArm();});
  $('tglTrail').addEventListener('change',e=>{trailOn=e.target.checked;trail.visible=trailOn;});
  addLabel(()=>L('配重势能仓:满链升高 = mgh','Counterweight silo: raised mgh'),new THREE.Vector3(-1.9,4.6,0),'y');
  addLabel(()=>L('短臂-长臂杠杆:mCW·s = 力矩','Short/long lever: mCW·s sets torque'),new THREE.Vector3(0,2.2,0.6),'o');
  addLabel(()=>L('sling 鞭击:滞后→追平→反超','Sling whip: lag → catch → crack'),new THREE.Vector3(3.4,3.4,0),'b',()=>mode!=='cocked');
  addLabel(()=>L('接近 45° 出射最远','≈45° leaves farthest'),new THREE.Vector3(11,5.2,0),'g',()=>mode==='flown');
}
/* ---- 主循环 ---- */
function tick(dt,dts){
  if(mode==='firing'&&dts>0){
    const g=armGeom();
    const torque=Math.max(0.25,1.0+0.5*Math.sin(th+0.6));
    const acc=2.6*G*(mCW/(mCW+6*mP0()))*torque/(1+armRatio);
    thv+=acc*dts;th+=thv*dts;
    /* sling 弹簧滞后 */
    const target=-0.45*thv;
    psiv+=((target-psi)*26-psiv*6)*dts;psi+=psiv*dts;
    if(th>=relDeg*Math.PI/180){
      mode='flown';
      const v=releaseVelocity(th,thv,psiv);
      proj=tipPos(th).clone().add(new THREE.Vector3(0,0.3,0));
      projV=v.clone();v0=v.length();
      const hDrop=Math.max(0.5,PIV.y+g.short-0.5);
      eff=0.5*1*v0*v0/(mCW*G*hDrop);
      apex=proj.y;rangeX=0;
    }
    updateArm();
  }
  if(mode==='flown'&&proj&&dts>0){
    projV.y-=G*dts;
    proj.addScaledVector(projV,dts);
    apex=Math.max(apex,proj.y);
    if(trailOn&&trailN<NPT){
      const arr=trailGeo.attributes.position.array;
      arr[trailN*3]=proj.x;arr[trailN*3+1]=proj.y;arr[trailN*3+2]=0;
      trailN++;trailGeo.setDrawRange(0,trailN);
      trailGeo.attributes.position.needsUpdate=true;
      trail.computeLineDistances();
    }
    if(proj.y<=0.3){
      rangeX=Math.max(0,proj.x+4);
      stone.position.y=0.3;mode='landed';
      updateStats();
    }
    stone.position.copy(proj);
  }
}
function mP0(){return 1;}

/* ---- 共享运行时 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let slowMo=false;
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
let activeStep=0;
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=clamp(i,0,STEPS.length-1);STEPS[activeStep].act();syncSteps();}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();if(typeof onPlayToggle==='function')onPlayToggle(playing);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?BG_DARK:BG_LIGHT);
  scene.fog.color.setHex(dark?BG_DARK:BG_LIGHT);
  if(typeof applyPageTheme==='function')applyPageTheme(dark);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  tick(dt,dts);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){frame.acc=0;if(typeof updateStats==='function')updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();
buildSteps();
if(typeof pageInit==='function')pageInit();
{const t=qs.get('t');if(t!==null){const i=parseInt(t)||0;if(i>=0&&i<STEPS.length)applyPhase(i);}else applyPhase(0);}
if(typeof updateStats==='function')updateStats();
syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
