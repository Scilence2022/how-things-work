<style>

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(0.4,3.0,7.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 桌面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const table=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,0.18,48),
  new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8}));
table.position.y=-0.08;scene.add(table);/* 桌面顶面抬到 y=0.01,避免与 y=0 地面及器皿底面共面产生像素化闪面伪影 */

/* ---- 两只比色皿:左=真溶液,右=胶体 ---- */
const glassM=new THREE.MeshPhysicalMaterial({color:0xdfe8f2,roughness:0.06,transparent:true,opacity:0.22,side:THREE.DoubleSide});
const cuvL=new THREE.Mesh(new THREE.BoxGeometry(1.15,1.5,0.8),glassM);
cuvL.position.set(-1.35,0.75,0);scene.add(cuvL);
const cuvR=new THREE.Mesh(new THREE.BoxGeometry(1.15,1.5,0.8),glassM.clone());
cuvR.position.set(1.35,0.75,0);scene.add(cuvR);
const cClean=new THREE.Color(0x66d9e8),cMud=new THREE.Color(0x8a6a4a);
const liqSolM=new THREE.MeshStandardMaterial({color:0xa5b8d4,roughness:0.3,transparent:true,opacity:0.1});
const liqSol=new THREE.Mesh(new THREE.BoxGeometry(1.05,1.36,0.7),liqSolM);
liqSol.position.set(-1.35,0.72,0);scene.add(liqSol);
const liqColM=new THREE.MeshStandardMaterial({color:0x66d9e8,roughness:0.3,transparent:true,opacity:0.2});
const liqCol=new THREE.Mesh(new THREE.BoxGeometry(1.05,1.36,0.7),liqColM);
liqCol.position.set(1.35,0.72,0);scene.add(liqCol);

/* ---- 激光器 + 光束(可绕出射口小幅扫描) ---- */
const laserBody=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.24,0.24),
  new THREE.MeshStandardMaterial({color:0x2b3038,roughness:0.5,metalness:0.4}));
laserBody.position.set(-3.55,1.05,0);scene.add(laserBody);
const beamG=new THREE.Group();beamG.position.set(-3.3,1.05,0);scene.add(beamG);
const core=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,7.35,8),
  new THREE.MeshBasicMaterial({color:0x74d97a}));
core.rotation.z=-Math.PI/2;core.position.x=3.675;beamG.add(core);
const glowM=new THREE.MeshBasicMaterial({color:0x37b24d,transparent:true,opacity:0.2,blending:THREE.AdditiveBlending,depthWrite:false});
const glow=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,7.35,8),glowM);
glow.rotation.z=-Math.PI/2;glow.position.x=3.675;beamG.add(glow);
/* 真溶液段:几乎无痕 */
const solScatM=new THREE.MeshBasicMaterial({color:0x69db7c,transparent:true,opacity:0.025,blending:THREE.AdditiveBlending,depthWrite:false});
const solScat=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.14,12,1,true),solScatM);
solScat.rotation.z=-Math.PI/2;solScat.position.x=1.95;beamG.add(solScat);
/* 胶体段:亮的散射锥 */
const coneM=new THREE.MeshBasicMaterial({color:0x69db7c,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const cone=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.02,1.14,24,1,true),coneM);
cone.rotation.z=-Math.PI/2;cone.position.x=4.65;beamG.add(cone);
const spot=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,10),new THREE.MeshBasicMaterial({color:0x8ff0b0}));
spot.position.x=7.2;beamG.add(spot);
const screen=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.95,0.7),
  new THREE.MeshStandardMaterial({color:0xdfe8f2,roughness:0.9}));
screen.position.set(3.97,1.05,0);scene.add(screen);

/* ---- 胶体颗粒(布朗运动)+ 真溶液分子 + 盐粒 + 聚沉团簇 ---- */
const NCP=240,NSM=70,NSM2=60,NGR=42,KCL=16;
const colloidParts=new THREE.InstancedMesh(new THREE.SphereGeometry(0.028,8,8),
  new THREE.MeshStandardMaterial({color:0x66d9e8,roughness:0.3,transparent:true,opacity:0.85,emissive:0x0b7285,emissiveIntensity:0.35}),NCP);
colloidParts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(colloidParts);
const bx=new Float32Array(NCP),by=new Float32Array(NCP),bz=new Float32Array(NCP),by0=new Float32Array(NCP);
const offX=new Float32Array(NCP),offY=new Float32Array(NCP),offZ=new Float32Array(NCP);
const fq=new Float32Array(NCP),ph=new Float32Array(NCP);
const solMol=new THREE.InstancedMesh(new THREE.SphereGeometry(0.009,6,6),
  new THREE.MeshStandardMaterial({color:0xa5b8d4,roughness:0.4,transparent:true,opacity:0.7}),NSM);
solMol.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(solMol);
const solX=new Float32Array(NSM),solY=new Float32Array(NSM),solZ=new Float32Array(NSM),solPh=new Float32Array(NSM);
const solMol2=new THREE.InstancedMesh(new THREE.SphereGeometry(0.009,6,6),
  new THREE.MeshStandardMaterial({color:0xa5b8d4,roughness:0.4,transparent:true,opacity:0.7}),NSM2);
solMol2.instanceMatrix.setUsage(THREE.DynamicDrawUsage);solMol2.visible=false;scene.add(solMol2);
const sol2X=new Float32Array(NSM2),sol2Y=new Float32Array(NSM2),sol2Z=new Float32Array(NSM2),sol2Ph=new Float32Array(NSM2);
const grains=new THREE.InstancedMesh(new THREE.BoxGeometry(0.035,0.035,0.035),
  new THREE.MeshStandardMaterial({color:0xf1f3f5,roughness:0.6}),NGR);
grains.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(grains);
const gT=new Float32Array(NGR).fill(-1),gX=new Float32Array(NGR),gZ=new Float32Array(NGR),gY0=new Float32Array(NGR);
const blobs=new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,10),
  new THREE.MeshStandardMaterial({color:0xd6604d,roughness:0.5,transparent:true,opacity:0.75}),KCL);
blobs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);blobs.visible=false;scene.add(blobs);
const clX=new Float32Array(KCL),clY=new Float32Array(KCL),clZ=new Float32Array(KCL),clFloor=new Float32Array(KCL);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let slowMo=false;
let d=80,saltPct=40,coag=0,saltDose=0,saltActive=false;
let sweepOn=true,compare=false,brownOn=true;
let brownK=1,compareK=0,sweepCur=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 相对散射强度:瑞利区 I ∝ d⁶/颗 × N ∝ 1/d³ → 总强度 ∝ d³(以 200 nm 为 100%) */
function I01(){return Math.pow(d/200,3)*(1-coag)*(1-0.94*compareK);}
function setD(v2){d=v2;document.getElementById('sSize').value=v2;
  document.getElementById('sSizeVal').textContent=v2.toFixed(0)+' nm';}
function setSaltPct(v2){saltPct=v2;document.getElementById('sSalt').value=v2;
  document.getElementById('sSaltVal').textContent=v2.toFixed(0)+' %';}
function setCompare(v2){compare=v2;document.getElementById('bSol').classList.toggle('on',v2);}
function resetCoag(){
  coag=0;saltDose=0;saltActive=false;
  for(let i=0;i<NCP;i++){
    bx[i]=1.35+(Math.random()-0.5)*0.9;by[i]=0.2+Math.random()*1.1;bz[i]=(Math.random()-0.5)*0.5;
    by0[i]=by[i];offX[i]=Math.random()-0.5;offY[i]=Math.random()-0.5;offZ[i]=Math.random()-0.5;
    fq[i]=2+Math.random()*3;ph[i]=Math.random()*6.28;
  }
  for(let k=0;k<KCL;k++){
    clX[k]=1.35+(Math.random()-0.5)*0.7;clY[k]=0.45+Math.random()*0.75;clZ[k]=(Math.random()-0.5)*0.4;
    clFloor[k]=0.18+(k%4)*0.05;
  }
  for(let i=0;i<NGR;i++)gT[i]=-1;
  blobs.visible=false;
}
function addSalt(){
  if(coag>=0.999)return;
  saltDose=Math.max(0.15,saltPct/100);saltActive=true;
  for(let i=0;i<NGR;i++){
    gT[i]=Math.random()*0.15;
    gX[i]=1.35+(Math.random()-0.5)*0.7;gZ[i]=(Math.random()-0.5)*0.4;
    gY0[i]=2.1+Math.random()*0.5;
  }
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`散射光锥 I ∝ d³:相对强度 ${(I01()*100).toFixed(0)}%`,
  `Scattering cone I ∝ d³: relative ${(I01()*100).toFixed(0)}%`),
  new THREE.Vector3(1.35,2.1,0),'y',()=>I01()>0.04&&coag<0.95);
addLabel(()=>L(`胶体颗粒 d = ${d.toFixed(0)} nm`,`Colloid particles d = ${d.toFixed(0)} nm`),
  new THREE.Vector3(1.35,0.45,1.05),'b');
addLabel(()=>L('真溶液对照:分子太小,几乎不散射','True-solution control: molecules are far too small to scatter'),
  new THREE.Vector3(-1.35,2.1,0),'');
addLabel(()=>L(`聚沉中 ${(coag*100).toFixed(0)}%`,`Coagulating ${(coag*100).toFixed(0)}%`),
  new THREE.Vector3(2.15,1.15,0.9),'r',()=>coag>0.04&&coag<1.02);

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'胶体:1–100 nm 颗粒悬在分散介质里',en:'A colloid: 1–100 nm particles suspended in a dispersion medium',
  act(){setD(80);setCompare(false);resetCoag();brownOn=true;
    document.getElementById('tglBrown').checked=true;
    document.getElementById('bSol').classList.remove('on');}},
 {zh:'光路亮起:粒径逼近波长,散射暴涨',en:'The path lights up: as size nears the wavelength, scattering soars',
  act(){setD(150);sweepOn=true;document.getElementById('bSweep').classList.add('on');}},
 {zh:'布朗运动顶住重力:颗粒不沉',en:'Brownian motion holds off gravity: the particles never settle',
  act(){setD(60);brownOn=true;document.getElementById('tglBrown').checked=true;}},
 {zh:'真溶液对照:分子太小,散射可忽略',en:'True-solution control: molecules are far too small to scatter',
  act(){setCompare(true);}},
 {zh:'加盐:双电层压薄,范德华力获胜、聚沉',en:'Add salt: the double layer compresses, van der Waals wins, they coagulate',
  act(){addSalt();}},
 {zh:'从丁达尔到应用:烟雾报警、浑浊度预警与蓝天白云',en:'From Tyndall to applications: smoke alarms, turbidity sensing, blue skies',
  act(){setD(100);setCompare(false);resetCoag();sweepOn=true;
    document.getElementById('bSweep').classList.add('on');document.getElementById('bSol').classList.remove('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stD').innerHTML=d.toFixed(0)+'<small> nm</small>';
  document.getElementById('stI').innerHTML=(I01()*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stB').innerHTML=Math.pow(80/d,1.5).toFixed(2)+'<small> ×</small>';
  document.getElementById('stC').innerHTML=(coag*100).toFixed(0)+'<small> %</small>';
  document.getElementById('bSalt').classList.toggle('on',coag>0.02&&coag<0.999);
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSweep').addEventListener('click',function(){
  sweepOn=!sweepOn;this.classList.toggle('on',sweepOn);
});
document.getElementById('bSalt').addEventListener('click',()=>addSalt());
document.getElementById('bSol').addEventListener('click',()=>setCompare(!compare));
document.getElementById('sSize').addEventListener('input',e=>setD(+e.target.value));
document.getElementById('sSalt').addEventListener('input',e=>setSaltPct(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglBrown').addEventListener('change',e=>{brownOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 平滑开关量 */
  brownK+=((brownOn?1:0)-brownK)*Math.min(1,dt*4);
  compareK+=((compare?1:0)-compareK)*Math.min(1,dt*4);
  sweepCur+=((sweepOn?0.05:0)-sweepCur)*Math.min(1,dt*4);
  beamG.rotation.z=sweepCur*Math.sin(simT*1.7);
  /* 聚沉推进:盐越多越快 */
  if(saltActive&&coag<1){
    coag=Math.min(1,coag+dts*(0.06+0.16*saltDose));
    if(coag>=1)saltActive=false;
  }
  if(coag>0&&coag<1)for(let k=0;k<KCL;k++)
    clY[k]=Math.max(clFloor[k],clY[k]-dts*0.12*(0.3+coag));
  /* 胶体颗粒:布朗运动 / 重力沉降 / 聚沉并入团簇 */
  const amp=0.03*Math.pow(80/d,0.75)*brownK;
  const psc=1-0.45*coag;
  for(let i=0;i<NCP;i++){
    if(coag>0.01){
      const c=i%KCL,rr=0.04+0.10*coag,k2=Math.min(1,dts*(0.5+saltDose)*1.2);
      bx[i]+=(clX[c]+offX[i]*rr-bx[i])*k2;
      by[i]+=(clY[c]+offY[i]*rr-by[i])*k2;
      bz[i]+=(clZ[c]+offZ[i]*rr-bz[i])*k2;
    }else if(brownK<0.95){
      by[i]=Math.max(0.16,by[i]-dts*0.06*(1-brownK));
    }else{
      by[i]+=(by0[i]-by[i])*Math.min(1,dts*0.5);
    }
    const px=bx[i]+Math.sin(simT*fq[i]+ph[i])*amp;
    const py=by[i]+Math.sin(simT*fq[i]*1.13+ph[i]+2.1)*amp;
    const pz=bz[i]+Math.sin(simT*fq[i]*0.87+ph[i]+4.2)*amp;
    m4.makeScale(psc,psc,psc);m4.setPosition(px,py,pz);
    colloidParts.setMatrixAt(i,m4);
  }
  colloidParts.instanceMatrix.needsUpdate=true;
  colloidParts.visible=compareK<0.5;
  /* 聚沉团簇 */
  blobs.visible=coag>0.03&&compareK<0.5;
  if(blobs.visible){
    for(let k=0;k<KCL;k++){
      const sc=0.05+0.14*coag;
      m4.makeScale(sc,sc,sc);m4.setPosition(clX[k],clY[k],clZ[k]);
      blobs.setMatrixAt(k,m4);
    }
    blobs.instanceMatrix.needsUpdate=true;
  }
  /* 盐粒落下并在液面溶解 */
  for(let i=0;i<NGR;i++){
    if(gT[i]>=0){
      gT[i]+=dts*1.3;const p=gT[i];
      if(p>=1){gT[i]=-1;m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);}
      else{
        const y=gY0[i]-(gY0[i]-1.32)*p*p;
        const s=p<0.72?1:Math.max(0.001,1-(p-0.72)/0.28);
        m4.makeScale(s,s,s);m4.setPosition(gX[i],y,gZ[i]);
      }
    }else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);}
    grains.setMatrixAt(i,m4);
  }
  grains.instanceMatrix.needsUpdate=true;
  /* 真溶液分子(左皿常驻,右皿仅对照模式) */
  for(let i=0;i<NSM;i++){
    m4.makeScale(1,1,1);
    m4.setPosition(solX[i]+Math.sin(simT*1.3+solPh[i])*0.008,
      solY[i]+Math.sin(simT*1.7+solPh[i]*2)*0.008,solZ[i]);
    solMol.setMatrixAt(i,m4);
  }
  solMol.instanceMatrix.needsUpdate=true;
  solMol2.visible=compareK>0.5;
  if(solMol2.visible){
    for(let i=0;i<NSM2;i++){
      m4.makeScale(1,1,1);
      m4.setPosition(sol2X[i]+Math.sin(simT*1.4+sol2Ph[i])*0.008,
        sol2Y[i]+Math.sin(simT*1.8+sol2Ph[i]*2)*0.008,sol2Z[i]);
      solMol2.setMatrixAt(i,m4);
    }
    solMol2.instanceMatrix.needsUpdate=true;
  }
  /* 液体浑浊度 / 散射锥亮度 */
  liqColM.opacity=0.08+0.33*(1-compareK)*(0.35+0.65*Math.min(1,coag*1.5));
  liqColM.color.lerpColors(cClean,cMud,Math.min(1,coag*1.2)*(1-compareK));
  coneM.opacity=0.06+0.5*I01();
  solScatM.opacity=0.02+0.06*Math.pow(d/200,3);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
for(let i=0;i<NSM;i++){
  solX[i]=-1.35+(Math.random()-0.5)*0.9;solY[i]=0.2+Math.random()*1.1;
  solZ[i]=(Math.random()-0.5)*0.5;solPh[i]=Math.random()*6.28;
}
for(let i=0;i<NSM2;i++){
  sol2X[i]=1.35+(Math.random()-0.5)*0.9;sol2Y[i]=0.2+Math.random()*1.1;
  sol2Z[i]=(Math.random()-0.5)*0.5;sol2Ph[i]=Math.random()*6.28;
}
resetCoag();setD(80);setSaltPct(40);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
