<style>

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}

  #play:hover{filter:brightness(1.12)}

  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============================================================
   横摆动力学（单车模型，量级真实，比例 1 单位 = 2.5 m）：
   - 预期横摆 r_des = v·tanδ / L（L=2.7 m 轴距，δ=atan(L/R) 跟圆）
   - 附着极限：侧向加速度 a=v·r ≤ μg → 横摆上限 r_lim = μg/v
   - 推头（前轴先饱和）：r_act 被钳在 r_lim 以下，车头往外滑
   - 甩尾（后轴先饱和）：横摆发散 dr ∝ (excess-1)·r，车尾甩出自旋
   - ESP：比较 r_des 与 r_act（≥25 Hz 采样）：
     Δr<0（转不够）→ 制动弯道内侧后轮，产生增强转向的横摆力矩；
     Δr>0（转过头）→ 制动弯道外侧前轮，反向横摆力矩；同时收油减速，
     让需求 a=v²/R 降回 μg 以内——两条曲线当场收拢。
   ============================================================ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const R2D=180/Math.PI;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const qsBool=(k,d)=>{const v=qs.get(k);return v===null?d:(v!=='0'&&v!=='false');};

/* ---- renderer ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,60,150);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,400);
camera.position.set(-10,26,-32);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=120;

scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.8));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.0);keyL.position.set(20,40,15);scene.add(keyL);

/* ---- 场地：弯道 = 半径 R 的圆环跑道 ---- */
const R=22;            // 22 单位 = 55 m 弯道半径
const SCALE=2.5;       // 1 单位 = 2.5 m
const g=9.81;
const groundM=new THREE.MeshStandardMaterial({color:0x22301f,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(90,64),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;scene.add(ground);
/* 路面环带 */
const roadM=new THREE.MeshStandardMaterial({color:0x2a2d33,roughness:0.9});
const road=new THREE.Mesh(new THREE.RingGeometry(R-2.2,R+2.2,120),roadM);
road.rotation.x=-Math.PI/2;road.position.y=0.01;scene.add(road);
/* 预期轨迹虚线（圆心线） */
const pathM=new THREE.LineDashedMaterial({color:0xffa94d,dashSize:0.7,gapSize:0.5});
const pathPts=[];
for(let i=0;i<=240;i++){const a=i/240*Math.PI*2;pathPts.push(new THREE.Vector3(Math.cos(a)*R,0.05,Math.sin(a)*R));}
const pathLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pathPts),pathM);
pathLine.computeLineDistances();scene.add(pathLine);

/* ---- 车 ---- */
const carG=new THREE.Group();scene.add(carG);
const bodyM=new THREE.MeshStandardMaterial({color:0x4a7fa5,roughness:0.35,metalness:0.6});
const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.55,0.95),bodyM); // 长1.9u=4.75m
body.position.y=0.5;carG.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.42,0.85),
  new THREE.MeshStandardMaterial({color:0x35526b,roughness:0.3,metalness:0.5}));
cabin.position.set(-0.1,0.95,0);carG.add(cabin);
const headL=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.12,0.25),
  new THREE.MeshStandardMaterial({color:0xfff3bf,emissive:0xfff3bf,emissiveIntensity:0.9}));
headL.position.set(0.95,0.55,0.3);carG.add(headL);
const headR=headL.clone();headR.position.z=-0.3;carG.add(headR);
/* 四轮：[x,z]  x=车头方向；0 内后轮 1 外后轮 2 内前轮 3 外前轮（弯心在 z+ 侧） */
const wheelGeo=new THREE.CylinderGeometry(0.22,0.22,0.16,18);
const wheelPos=[[-0.62,0.52],[0.62,0.52],[-0.62,-0.52],[0.62,-0.52]];
const wheels=[];
for(let i=0;i<4;i++){
  const pivot=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0x14181d,roughness:0.8,
    emissive:0xff4d4d,emissiveIntensity:0});
  const w=new THREE.Mesh(wheelGeo,mat);
  w.rotation.x=Math.PI/2; // 滚动轴沿 z（横向）
  pivot.add(w);
  pivot.position.set(wheelPos[i][0],0.22,wheelPos[i][1]);
  carG.add(pivot);
  wheels.push({pivot,w,mat,front:wheelPos[i][0]>0});
}
/* 制动力箭头 */
const brakeArrow=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.5,10),
  new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff4d4d,emissiveIntensity:0.9}));
brakeArrow.visible=false;scene.add(brakeArrow);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
/* 预期轨迹标签：动态锚在车前方路线上（固定在世界顶部会与标题副题重叠） */
const pathLbl=addLabel(()=>L('预期轨迹（半径 55 m）','intended path (R=55 m)'),new THREE.Vector3(2.2,0.42,-R+2.2),'o');
addLabel(()=>L('ESP：横摆差 > 阈值 → 单轮制动','ESP: brake one wheel on |Δr|'),new THREE.Vector3(0,0.4,-R-3),'b');

/* ---- 横摆曲线图（跟随车，悬在上方） ---- */
const chartG=new THREE.Group();scene.add(chartG);
const chartBoard=new THREE.Mesh(new THREE.PlaneGeometry(7,3),
  new THREE.MeshStandardMaterial({color:0x11151a,roughness:0.9,transparent:true,opacity:0.85,
    side:THREE.DoubleSide}));
chartG.add(chartBoard);
const CW=6.4,CHt=2.4;
const chAxisM=new THREE.LineBasicMaterial({color:0x5b6b7d});
function chartLine(pts,mat){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);chartG.add(l);return l;}
chartLine([new THREE.Vector3(-CW/2,0,0.01),new THREE.Vector3(CW/2,0,0.01)],chAxisM);
const desCurve=chartLine([],new THREE.LineDashedMaterial({color:0x74c0fc,dashSize:0.12,gapSize:0.08}));
const actCurve=chartLine([],new THREE.LineBasicMaterial({color:0xffa94d}));
addLabel(()=>L('横摆：蓝虚线=预期，橙线=实际','yaw: blue=wanted, orange=actual'),new THREE.Vector3(0,1.7,0),'',()=>true,chartG);

/* ---- 状态 ---- */
let playing=true;
const S={v:75/3.6,mu:0.9,slip:'front',esp:true,
  x:0,z:-R,psi:0,rAct:0,brakeWheel:-1,brakeAmt:0,outT:0,simT:0,spinT:0,
  histD:[],histA:[],speedK:1,labelsOn:true};
const Lwb=2.7,PREVIEW=6; // 轴距 2.7m；预瞄 6 单位=15m（Lwb 与场地常数共用）
/* 驾驶员：纯跟踪（pure pursuit）盯住预期圆弧前方的点 */
function steerAngle(){
  const th=Math.atan2(S.z,S.x);
  const tt=th+PREVIEW/R;
  const tx=Math.cos(tt)*R,tz=Math.sin(tt)*R;
  const dx=tx-S.x,dz=tz-S.z;
  const hx=Math.cos(S.psi),hz=Math.sin(S.psi);
  const alpha=Math.atan2(hx*dz-hz*dx,hx*dx+hz*dz);
  return Math.min(0.61,Math.atan(2*Lwb*Math.sin(alpha)/(PREVIEW*SCALE))); // 最大转角 ~35°
}
function rDesired(){return S.v*Math.tan(steerAngle())/Lwb;}
function reset(){
  S.x=0;S.z=-R;S.psi=0;S.brakeWheel=-1;S.brakeAmt=0;S.outT=0;S.spinT=0;
  S.histD=[];S.histA=[];
  S.rAct=rDesired();                 // 入弯时横摆已建立
  if(S.slip==='rear')S.rAct*=1.15;   // 甩尾场景：后轴先滑一下作为扰动
  /* 预填 4 s 稳态过弯历史：首屏曲线即成形，不必等采样累积 */
  const rd=rDesired()*R2D;
  for(let t=0;t<=4.01;t+=0.1){
    S.histD.push([t,rd]);
    S.histA.push([t,rd*(0.86+0.14*Math.min(1,t/2.5))+Math.sin(t*7)*0.6]);
  }
  S.simT=4;
  carG.position.set(S.x,0,S.z);carG.rotation.y=-S.psi;
  chartG.position.set(S.x-6,6.5,S.z-4);chartG.rotation.y=0.3;
  for(const w of wheels)w.mat.emissiveIntensity=0;
  brakeArrow.visible=false;
}
/* 单步物理（dt 秒） */
function step(dt){
  const rDes=rDesired();
  const aDem=S.v*rDes;                 // 侧向需求加速度
  const rLim=S.mu*g/Math.max(S.v,3);   // 附着允许的横摆上限
  const excess=aDem/(S.mu*g);
  let bw=-1,ba=0;
  if(excess<=1){
    S.rAct+=(rDes-S.rAct)*2.5*dt;      // 正常跟随
  }else if(S.slip==='front'){          // 推头：前轴饱和
    const target=Math.sign(rDes)*rLim;
    S.rAct+=(target-S.rAct)*2.5*dt;
  }else{                               // 甩尾：后轴先失附，横摆发散
    if(S.rAct>rDes*0.9){               // 转起来之后，超出量正反馈→尾部滑出自旋
      S.rAct+=(S.rAct-rDes)*(8*(excess-1))*dt+(rDes-S.rAct)*2.5*dt;
    }else S.rAct+=(rDes-S.rAct)*2.5*dt;
  }
  /* ESP：横摆差超阈值（约 4.5°/s）→ 单轮制动 + 收油（助力受横摆力矩上限约束） */
  const dR=rDes-S.rAct;
  if(S.esp&&Math.abs(dR)>4.5/R2D){
    const pull=clamp(dR,-25/R2D,25/R2D)*4.0;
    if(dR>0&&S.rAct<rLim*1.8)S.rAct+=pull*dt; // 补横摆：不能超越附着物理太多
    else if(dR<0)S.rAct+=pull*dt;             // 压横摆
    S.v=Math.max(4,S.v-5.0*dt);               // 收油/制动（~0.5g）
    ba=clamp(Math.abs(dR)/0.45,0,1);
    /* 转不够（推头）→ 制动内侧后轮（0）；转过头（甩尾）→ 制动外侧前轮（3） */
    bw=dR>0?0:3;
  }
  S.brakeWheel=bw;S.brakeAmt=ba;
  /* 位姿积分 */
  S.psi+=S.rAct*dt;
  S.x+=S.v*Math.cos(S.psi)*dt;
  S.z+=S.v*Math.sin(S.psi)*dt;
  S.simT+=dt;
  /* 自旋判定：横摆超过 80°/s 持续 1.5 s → 已失控 */
  if(Math.abs(S.rAct)>80/R2D)S.spinT+=dt;else S.spinT=0;
  /* 出界计时（跑出路面太远自动重置） */
  const rr=Math.hypot(S.x,S.z);
  if(rr>R+14||rr<R-14){S.outT+=dt;}else S.outT=0;
  /* 曲线采样 10 Hz */
  if(S.histD.length===0||S.simT-S.histD[S.histD.length-1][0]>=0.1){
    S.histD.push([S.simT,rDes*R2D]);S.histA.push([S.simT,S.rAct*R2D]);
    if(S.histD.length>140){S.histD.shift();S.histA.shift();}
  }
}
/* 视觉同步 */
function syncVisual(){
  carG.position.set(S.x,0,S.z);
  carG.rotation.y=-S.psi; // Three.js 绕 y 正方向为逆时针（俯视 x-z 平面）
  /* 轨迹标签跟车走，避免固定在世界顶部与标题文字重叠 */
  pathLbl.position.set(S.x+2.6,0.42,S.z+2.0);
  for(const w of wheels){
    if(w.front)w.pivot.rotation.y=-steerAngle(); // 前轮朝弯心方向偏转
    w.mat.emissiveIntensity=0;
  }
  if(S.brakeWheel>=0){
    wheels[S.brakeWheel].mat.emissiveIntensity=S.brakeAmt*1.2;
    const wp=new THREE.Vector3();wheels[S.brakeWheel].pivot.getWorldPosition(wp);
    brakeArrow.position.set(wp.x,0.5,wp.z);
    brakeArrow.scale.setScalar(0.6+S.brakeAmt);
    brakeArrow.visible=true;
  }else brakeArrow.visible=false;
  /* 曲线图跟随 */
  chartG.position.set(S.x-6.5,7,S.z-5);
  if(S.histD.length>2){
    const t1=S.histD[S.histD.length-1][0],t0=Math.max(0,t1-14);
    const yOf=r=>clamp(r/45,-1,1)*(CHt/2);
    const pd=S.histD.map(h=>new THREE.Vector3(-CW/2+(h[0]-t0)/14*CW,yOf(h[1]),0.02));
    const pa=S.histA.map(h=>new THREE.Vector3(-CW/2+(h[0]-t0)/14*CW,yOf(h[1]),0.02));
    desCurve.geometry.dispose();desCurve.geometry=new THREE.BufferGeometry().setFromPoints(pd);
    desCurve.computeLineDistances();
    actCurve.geometry.dispose();actCurve.geometry=new THREE.BufferGeometry().setFromPoints(pa);
  }
}
/* 统计 */
const WHEEL_NAMES=()=>[L('内后轮','inner rear'),L('外后轮','outer rear'),L('内前轮','inner front'),L('外前轮','outer front')];
function updateStats(){
  const rDes=rDesired()*R2D,rAct=S.rAct*R2D;
  document.getElementById('stAct').innerHTML=rAct.toFixed(1)+'<small> °/s</small>';
  document.getElementById('stDes').innerHTML=rDes.toFixed(1)+'<small> °/s</small>';
  document.getElementById('stD').innerHTML=(rDes-rAct).toFixed(1)+'<small> °/s</small>';
  document.getElementById('stB').textContent=S.brakeWheel>=0
    ?WHEEL_NAMES()[S.brakeWheel]+' '+(S.brakeAmt*100).toFixed(0)+'%'
    :L('— 未介入','— none');
}

/* ---- 步骤 ---- */
function setMu(v){S.mu=v;document.getElementById('sMu').value=v*100;
  document.getElementById('sMuVal').textContent=v.toFixed(2);}
function setV(kmh){S.v=kmh/3.6;document.getElementById('sV').value=kmh;
  document.getElementById('sVVal').textContent=kmh;}
function setSlip(s){S.slip=s;
  document.getElementById('btnStable').classList.toggle('on',s==='none');
  document.getElementById('btnUnder').classList.toggle('on',s==='front');
  document.getElementById('btnOver').classList.toggle('on',s==='rear');}
const STEPS=[
  {zh:'想要 vs 实际：方向盘转角给出预期横摆 r=v·tanδ/L；陀螺仪+轮速实测 r_act',en:'Wanted vs actual: steering sets wanted yaw r=v·tanδ/L; gyro+wheel speeds measure it',
   act(){setSlip('none');setMu(0.9);setV(65);S.esp=true;reset();}},
  {zh:'推头：湿路上速度太高，前轴先到附着极限（a=v²/R>μg），r_act 被钳住、车头往外滑',en:'Understeer: front axle saturates (a>μg), yaw capped, car plows wide',
   act(){setSlip('front');setMu(0.5);setV(90);S.esp=false;document.getElementById('tglEsp').checked=false;reset();}},
  {zh:'甩尾：后轴先失附，横摆发散 dr∝(excess-1)·r，车尾甩出自旋',en:'Oversteer: rear axle lets go, yaw diverges, tail spins out',
   act(){setSlip('rear');setMu(0.5);setV(80);S.esp=false;document.getElementById('tglEsp').checked=false;reset();}},
  {zh:'ESP 介入：Δr 超阈值 → 制动内侧后轮补横摆力矩 + 收油，把车「拧」回来',en:'ESP kicks in: brakes inner rear for yaw moment + cuts throttle',
   act(){setSlip('front');setMu(0.5);setV(90);S.esp=true;document.getElementById('tglEsp').checked=true;reset();}},
  {zh:'甩尾被按住：外侧前轮闪红，Δr 当场收拢到零——每秒采样 25 次以上',en:'Oversteer caught: outer front flashes red, Δr collapses — sampled ≥25 Hz',
   act(){setSlip('rear');setMu(0.5);setV(80);S.esp=true;document.getElementById('tglEsp').checked=true;reset();}},
  {zh:'NHTSA 数据：ESP 让湿滑路面单车失控率降约 50%——雪地 μ=0.25 试试没有它会怎样',en:'NHTSA: ESP cuts single-vehicle crashes ~50% — try snow μ=0.25 without it',
   act(){setSlip('front');setMu(0.25);setV(75);S.esp=true;document.getElementById('tglEsp').checked=true;reset();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();STEPS[i].act();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x22301f:0xbcc8ae);
  roadM.color.setHex(dark?0x2a2d33:0x8e959c);
  chartBoard.material.color.setHex(dark?0x11151a:0xf8f5ef);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();updateStats();
}

/* ---- 交互 ---- */
document.getElementById('btnStable').addEventListener('click',()=>{setSlip('none');reset();});
document.getElementById('btnUnder').addEventListener('click',()=>{setSlip('front');reset();});
document.getElementById('btnOver').addEventListener('click',()=>{setSlip('rear');reset();});
document.getElementById('btnReset').addEventListener('click',reset);
document.getElementById('sMu').addEventListener('input',e=>{
  S.mu=+e.target.value/100;document.getElementById('sMuVal').textContent=S.mu.toFixed(2);});
document.getElementById('sV').addEventListener('input',e=>{
  S.v=+e.target.value/3.6;document.getElementById('sVVal').textContent=e.target.value;});
document.getElementById('sSpd').addEventListener('input',e=>{
  S.speedK=+e.target.value/100;document.getElementById('sSpdVal').textContent=S.speedK.toFixed(1)+'×';});
document.getElementById('tglEsp').addEventListener('change',e=>{S.esp=e.target.checked;});
function setPlayText(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayText();});
document.getElementById('tglLabels').addEventListener('change',e=>{S.labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05)*S.speedK;
  if(playing){
    let steps=Math.max(1,Math.round(dt/0.02));
    steps=Math.min(steps,20);
    const h=dt/steps;
    for(let i=0;i<steps;i++)step(h);
    if(S.outT>3||S.spinT>1.5)reset(); // 失控跑飞/自旋后自动回到弯道起点
  }
  syncVisual();
  /* 相机跟随：目标平滑追车 */
  const tgt=new THREE.Vector3(S.x,1.5,S.z);
  const nt=tgt.clone().lerp(controls.target,0.06);
  const deltaV=nt.clone().sub(controls.target);
  camera.position.add(deltaV);
  controls.target.copy(nt);
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=S.labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 启动 ---- */
applyTheme();applyLang();setSlip('front');S.esp=true;reset();
if(qs.get('pause')==='1'){playing=false;setPlayText();}
if(!qsBool('labels',true)){S.labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(qs.get('speed')!==null){const v=clamp(parseFloat(qs.get('speed'))||1,0.5,3);
  S.speedK=v;document.getElementById('sSpd').value=Math.round(v*100);
  document.getElementById('sSpdVal').textContent=v.toFixed(1)+'×';}
updateStats();start();
</script>
</body>
</html>
