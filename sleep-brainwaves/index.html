<style>

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);

    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);

    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 生理学注脚（真实量级）：
   - 睡眠结构：NREM–REM 每 ~90 min 一轮；正常人 8 h 约5 轮，前半夜 N3（慢波睡眠）多，
     后半夜 REM 越来越长。
   - 波形：清醒 β(13–30 Hz)/γ(>30 Hz) 低幅快；N1 α(8–12 Hz) 消退；N2 出现睡眠纺锤波
     (11–16 Hz, 持续 0.5–2 s) 与 K 复合波；N3 δ 慢波 <4 Hz 高幅(可达 100–200 µV)；
     REM 脑电近似清醒（低幅快），但肌张力完全消失（atonia，脑干 REM-on 核团主动抑制运动神经元）。
   - 腺苷：清醒时在基底前脑持续积累=睡眠压力；咖啡因是 A1/A2A 受体拮抗剂，只压低信号不清除腺苷。
   - 系统巩固：N3 期海马 sharp-wave ripple 驱动“海马→皮层”记忆回放，慢波同步化把记忆搬进皮层长期存储；
     慢波剥夺会显著降低次日陈述性记忆成绩。整夜 480 min 压缩为 30 s（×960 快放）。 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
const Q=new URLSearchParams(location.search);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0a0d12,26,70);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(-1.5,6.2,21.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-2.0,5.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=5;controls.maxDistance=55;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14181e,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,0.9);key.position.set(6,10,9);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 材质 ---- */
const scopeM=new THREE.MeshStandardMaterial({color:0x11161f,roughness:0.6});
const eegM=new THREE.LineBasicMaterial({color:0x74c0fc});
const emgM=new THREE.LineBasicMaterial({color:0xff8787});
const cortexM=new THREE.MeshPhysicalMaterial({color:0x9fb8d8,transparent:true,opacity:0.14,roughness:0.35,side:THREE.DoubleSide});
const hippocM=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xe8590c,emissiveIntensity:0.55,roughness:0.4});
const fiberM=new THREE.LineBasicMaterial({color:0x51cf66,transparent:true,opacity:0.5});
const partM=new THREE.MeshStandardMaterial({color:0x8ce99a,emissive:0x2f9e44,emissiveIntensity:1.3});
const remPartM=new THREE.MeshStandardMaterial({color:0xda77f2,emissive:0xae3ec9,emissiveIntensity:1.2});
/* 睡眠塔 5 阶段配色 */
const STAGE_COL=[0x868e96,0x74c0fc,0x4dabf7,0x3b5bdb,0xda77f2];

/* ---- 示波器面板（左，避开控制面板） ---- */
const scope=new THREE.Group();scope.position.set(-4.0,5.4,0);scene.add(scope);
scope.add(new THREE.Mesh(new THREE.BoxGeometry(8.4,4.6,0.12),scopeM));
const NE=220;
const eegGeo=new THREE.BufferGeometry();
eegGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NE*3),3));
const eegLine=new THREE.Line(eegGeo,eegM);scope.add(eegLine);
const emgGeo=new THREE.BufferGeometry();
emgGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NE*3),3));
const emgLine=new THREE.Line(emgGeo,emgM);scope.add(emgLine);

/* ---- 大脑（右中）：皮层壳 + 海马 + 5 条纤维 ---- */
const brain=new THREE.Group();brain.position.set(3.5,5.4,0);scene.add(brain);
const cortex=new THREE.Mesh(new THREE.SphereGeometry(2.5,36,22),cortexM);brain.add(cortex);
const hippo=new THREE.Mesh(new THREE.SphereGeometry(0.55,18,14),hippocM);
hippo.position.set(-0.4,-1.1,0.4);brain.add(hippo);
const fibers=[],N_FIB=6;
const fiberEnds=[];
for(let i=0;i<N_FIB;i++){
  const a=i/N_FIB*Math.PI*2;
  fiberEnds.push(new THREE.Vector3(Math.cos(a)*1.9,(i%2?1.4:-0.6),Math.sin(a)*1.4));
}
for(let i=0;i<N_FIB;i++){
  const p0=hippo.position.clone();
  const p1=p0.clone().lerp(fiberEnds[i],0.5).add(new THREE.Vector3(0.6,0.3,0));
  const curve=new THREE.CatmullRomCurve3([p0,p1,fiberEnds[i]]);
  const geo=new THREE.BufferGeometry().setFromPoints(curve.getPoints(24));
  brain.add(new THREE.Line(geo,fiberM));
  fibers.push(curve);
}

/* ---- 睡眠塔（右）：48 格 = 48×10 min ---- */
const tower=new THREE.Group();tower.position.set(9.0,0.9,0);scene.add(tower);
const CH=0.235,CELLS=48;
const cellGeo=new THREE.BoxGeometry(0.85,CH-0.03,0.85);
const towerCells=[];
for(let i=0;i<CELLS;i++){
  const c=new THREE.Mesh(cellGeo,new THREE.MeshStandardMaterial({color:STAGE_COL[0],roughness:0.5,emissive:STAGE_COL[0],emissiveIntensity:0.12}));
  c.position.y=(i+0.5)*CH;tower.add(c);towerCells.push(c);
}
const cursor=new THREE.Mesh(new THREE.OctahedronGeometry(0.32),
  new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xe8590c,emissiveIntensity:1.2}));
tower.add(cursor);

/* ---- 睡眠结构表（分钟），按 480 min 归一化 ---- */
const RAW=[['W',10],['N1',4],['N2',18],['N3',40],['N2',10],['REM',8],
  ['W',2],['N1',4],['N2',18],['N3',30],['N2',10],['REM',14],
  ['N1',4],['N2',18],['N3',20],['N2',10],['REM',20],
  ['N1',4],['N2',18],['N3',10],['N2',10],['REM',26],
  ['N1',4],['N2',18],['N2',10],['REM',32]];
const S2I={W:0,N1:1,N2:2,N3:3,REM:4};
const rawTotal=RAW.reduce((s,r)=>s+r[1],0);
const SEGS=RAW.map(r=>[r[1]*480/rawTotal,S2I[r[0]]]);
function stageAt(min,depriv){
  let t=min*(480/480);
  for(const [d,s] of SEGS){
    if(t<d){
      if(s===3&&depriv)return 2; // 慢波剥夺：N3 降级为 N2
      return s;
    }
    t-=d;
  }
  return 0;
}

/* ---- 状态 ---- */
let playing=true,speedK=1.0,simT=0,nightT=0,eegT=0;
let coffee=false,depriv=false;
let n3Min=0,remMin=0,lastMin=0;
let labelsOn=!Q.has('labels')||Q.get('labels')!=='0';
const NIGHT_SEC=30; // 8h 压缩成 30 s（速度 1×）
const parts=[];

/* ---- EEG 波形合成（显示频率为真实生理频率） ---- */
const noise=t=>{const s=Math.sin(t*12.9898)*43758.5453;return (s-Math.floor(s))-0.5;};
function spindleEnv(t){const u=t%2.6;return u<0.9?Math.pow(Math.sin(Math.PI*u/0.9),2):0;}
function kCompEnv(t){const u=t%7.3;return u<1.1?Math.sin(Math.PI*u/1.1):0;}
function eegVal(t,st){
  const w2=Math.PI*2;
  let v=0;
  if(st===0)v=0.10*Math.sin(w2*18*t)+0.07*Math.sin(w2*31*t+1.7)+0.05*noise(t*3.1);
  else if(st===1)v=0.14*Math.sin(w2*9.5*t)*(t%9<6?1:0.4)+0.04*noise(t*2.7);
  else if(st===2)v=0.07*Math.sin(w2*6*t)+0.32*spindleEnv(t)*Math.sin(w2*14*t)
    +0.42*kCompEnv(t)*Math.sin(w2*t/1.1)+0.03*noise(t*2.3);
  else if(st===3)v=0.62*Math.sin(w2*1.8*t)+0.30*Math.sin(w2*0.9*t+0.8)+0.04*noise(t*1.7);
  else v=0.09*Math.sin(w2*16*t)+0.07*Math.sin(w2*24*t+2)+0.05*noise(t*4);
  return v;
}
function emgVal(t,st){
  const amp=[0.55,0.42,0.34,0.24,0.03][st];
  return amp*(0.6*Math.sin(2*Math.PI*37*t)+0.4*Math.sin(2*Math.PI*61*t+1)+0.3*noise(t*5.2));
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('脑电 EEG · 肌电 EMG','EEG · EMG oscilloscope'),new THREE.Vector3(-4.0,8.2,0),'b');
addLabel(()=>L('δ 慢波 <4 Hz','δ slow waves <4 Hz'),new THREE.Vector3(-4.0,2.7,0),'b',()=>curStage===3);
addLabel(()=>L('纺锤波 12–16 Hz + K 复合波','Spindles 12–16 Hz + K-complex'),new THREE.Vector3(-4.0,2.7,0),'g',()=>curStage===2);
addLabel(()=>L('REM：脑波像醒着，肌电归零！','REM: awake-like EEG, EMG flat!'),new THREE.Vector3(-4.0,2.7,0),'r',()=>curStage===4);
addLabel(()=>L('海马 → 皮层：记忆回放','Hippocampus → cortex: replay'),new THREE.Vector3(3.5,8.6,0),'g',()=>curStage===3||curStage===4);
addLabel(()=>L('REM 期肌肉瘫痪（atonia）','REM atonia'),new THREE.Vector3(3.5,2.4,0),'r',()=>curStage===4);
addLabel(()=>L('睡眠塔：8 h = 48 格','Sleep tower: 8 h = 48 cells'),new THREE.Vector3(9.0,12.6,0),'b');
addLabel(()=>L('咖啡因占住腺苷受体，压力被压低','Caffeine blocks adenosine receptors'),new THREE.Vector3(-4.0,9.3,0),'o',()=>coffee);

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0a0d12:0xe9e4dc);
  scene.fog.color.setHex(dark?0x0a0d12:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'清醒 W：皮层各自为政（β/γ 小而碎）；腺苷持续积累=睡眠压力',en:'Wake W: cortex desynchronized (β/γ); adenosine builds = sleep pressure',
   go(){nightT=0;eegT=0;syncTime();}},
  {zh:'入睡 N1→N2：α 消退；纺锤波(12–16 Hz)与 K 复合波上岗',en:'N1→N2: α fades; spindles (12–16 Hz) and K-complexes appear',
   go(){nightT=18;eegT=0;syncTime();}},
  {zh:'N3 慢波：丘脑-皮层大合唱(δ<4 Hz)；海马把记忆回放搬进皮层',en:'N3: thalamo-cortical choir (δ<4 Hz); hippocampus replays memories to cortex',
   go(){nightT=55;eegT=0;syncTime();}},
  {zh:'REM：脑波近似清醒，肌电却归零——做梦时身体被锁住',en:'REM: awake-like EEG but EMG zero — body locked while dreaming',
   go(){nightT=90;eegT=0;syncTime();}},
  {zh:'90 min 一轮循环：夜越深 REM 越长、N3 越少（睡眠塔阶梯）',en:'~90 min cycles: REM grows, N3 fades toward morning (see the tower)',
   go(){nightT=300;eegT=0;syncTime();}},
  {zh:'咖啡因：A1/A2A 受体被占据，睡眠压力被压低、入睡推迟',en:'Caffeine: A1/A2A receptors blocked, pressure dips, onset delayed',
   go(){coffee=true;syncUI();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.go();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function syncTime(){
  nightT=clamp(nightT,0,480);
  document.getElementById('sTime').value=nightT;
  document.getElementById('sTimeVal').textContent=Math.round(nightT)+' min';
}

/* ---- 按钮/滑块 ---- */
function syncUI(){
  document.getElementById('btnCoffee').classList.toggle('on',coffee);
  document.getElementById('btnDepriv').classList.toggle('on',depriv);
}
document.getElementById('btnCoffee').addEventListener('click',()=>{coffee=!coffee;syncUI();});
document.getElementById('btnDepriv').addEventListener('click',()=>{depriv=!depriv;syncUI();});
document.getElementById('btnNow').addEventListener('click',()=>{nightT=55;eegT=0;syncTime();});
document.getElementById('btnReset').addEventListener('click',()=>{
  nightT=0;eegT=0;n3Min=0;remMin=0;lastMin=0;coffee=false;depriv=false;syncUI();syncTime();
});
document.getElementById('sTime').addEventListener('input',e=>{
  nightT=+e.target.value;syncTime();
});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 统计 ---- */
let curStage=0;
function clockStr(){
  const m=23*60+30+nightT,h=Math.floor(m/60)%24,mm=Math.floor(m%60);
  return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;
}
function memPct(){
  // 基线：整夜 N3 ≈ 115 min、REM ≈ 112 min（归一化后）；加权贡献
  const p=55*(n3Min/115)+45*(remMin/112);
  return clamp(p,0,100);
}
function updateStats(){
  const names=LANG==='en'?['Wake','N1','N2','N3','REM']:['清醒','N1','N2','N3','REM'];
  const st=stageAt(nightT,depriv);
  document.getElementById('stStage').textContent=names[st];
  document.getElementById('stClock').textContent=clockStr();
  const ado=Math.round(clamp(70-nightT/480*52-(coffee?16:0),5,95));
  document.getElementById('stAdo').innerHTML=ado+'<small> %</small>';
  const mp=memPct(),test=Math.round(60+mp*0.35);
  document.getElementById('stMem').innerHTML=Math.round(mp)+'<small> % · </small>'+test+'<small> 分</small>';
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0,replayAcc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    const dk=dt*speedK;
    simT+=dk;eegT+=dk;
    nightT=clamp(nightT+dk*480/NIGHT_SEC,0,480);
    /* 记忆巩固积分（分钟） */
    const st=stageAt(nightT,depriv);
    const dMin=dk*480/NIGHT_SEC;
    if(st===3)n3Min+=dMin;else if(st===4)remMin+=dMin;
    curStage=st;
    /* N3/REM 期间海马发粒子沿纤维上行 */
    if(st===3||st===4){
      replayAcc+=dk;
      if(replayAcc>=(st===3?0.28:0.8)){
        replayAcc=0;
        const m=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,6),st===3?partM:remPartM);
        scene.add(m);
        parts.push({mesh:m,curve:fibers[Math.floor(Math.random()*N_FIB)],p:0,
          sp:st===3?0.45:0.22,st});
      }
    }
  }
  /* 粒子推进 */
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(playing){
      p.p+=dt*speedK*p.sp;
      if(p.p>=1){scene.remove(p.mesh);parts.splice(i,1);continue;}
    }
    p.mesh.position.copy(p.curve.getPoint(p.p)).add(brain.position);
  }
  /* 示波器重画 */
  const pa=eegGeo.attributes.position.array,pm2=emgGeo.attributes.position.array;
  for(let i=0;i<NE;i++){
    const tt=eegT+(i-NE)*0.014;
    pa[i*3]=-4.0+i*(8.0/(NE-1));pa[i*3+1]=eegVal(tt,curStage)*1.15+1.0;pa[i*3+2]=0.08;
    pm2[i*3]=-4.0+i*(8.0/(NE-1));pm2[i*3+1]=emgVal(tt,curStage)*0.55-1.7;pm2[i*3+2]=0.08;
  }
  eegGeo.attributes.position.needsUpdate=true;
  emgGeo.attributes.position.needsUpdate=true;
  /* 睡眠塔着色与游标 */
  for(let i=0;i<CELLS;i++){
    const s=stageAt(i*10+5,depriv);
    const c=towerCells[i].material;
    const col=new THREE.Color(STAGE_COL[s]);
    c.color.copy(col);c.emissive.copy(col);
    c.emissiveIntensity=(nightT>=i*10&&nightT<(i+1)*10)?0.75:0.12;
  }
  cursor.position.y=nightT/480*(CELLS*CH);
  brain.rotation.y=Math.sin(simT*0.3)*0.12;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

/* ---- URL 参数与启动 ---- */
if(Q.get('pause')==='1'){playing=false;}
document.getElementById('tglLabels').checked=labelsOn;
if(Q.get('speed')){
  const v=clamp(+Q.get('speed'),20,200);
  document.getElementById('sSpd').value=v;
  speedK=v/100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
}
syncUI();
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSteps();start();
</script>
