<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陀螺进动 · 重力矩为什么不把它放倒</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#43d17c;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#2f9e5c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.l { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.tau { border-color: rgba(255,159,40,.9); color: #ffd9a3; }
  .lbl.g { border-color: rgba(67,209,124,.9); color: #c9f3da; }
  .lbl.mg { border-color: rgba(255,93,93,.9); color: #ffc2c2; }
  .lbl.note { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.l { border-color: rgba(178,128,20,.9); color: #9c6f00; }
  :root[data-theme="light"] .lbl.tau { border-color: rgba(156,95,0,.9); color: #9c5f00; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(71,112,31,.9); color: #3f6d1c; }
  :root[data-theme="light"] .lbl.mg { border-color: rgba(200,60,60,.9); color: #b83232; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.w { color: #ffd166; }
  #stats .v.o { color: #43d17c; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 10px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(67,209,124,.14); color: var(--text); border: 1px solid rgba(67,209,124,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, border-color .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.warn { background: rgba(255,159,40,.12); border-color: rgba(255,159,40,.5); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(67,209,124,.10); border-color: rgba(67,209,124,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(47,158,92,.08); border-color: rgba(47,158,92,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #a9edc6; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="陀螺进动：重力矩为什么不把它放倒" data-en="Gyroscopic Precession: why gravity can't knock it over">陀螺进动：重力矩为什么不把它放倒</h1>
  <div class="sub" data-zh="重力矩 τ 与角动量 L 垂直——不改变大小、只改变方向:轴绕竖直扫锥(Ω = mgd / Iω);拖慢自转,进动反而变快 · 空格播放/暂停" data-en="Gravity's torque τ ⊥ L — it can't change the size of L, only its direction: the axle sweeps a cone (Ω = mgd / Iω); slow the spin and precession speeds up · Space = play/pause">重力矩 τ 与角动量 L 垂直——不改变大小、只改变方向:轴绕竖直扫锥(Ω = mgd / Iω);拖慢自转,进动反而变快 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="自转 ω" data-en="spin ω">自转 ω</span><span class="v w" id="stW">—</span>
  <span class="k" data-zh="进动 Ω" data-en="precession Ω">进动 Ω</span><span class="v o" id="stO">—</span>
  <span class="k" data-zh="角动量 L = Iω" data-en="angular momentum L = Iω">角动量 L = Iω</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="轴仰角 φ" data-en="axle elevation φ">轴仰角 φ</span><span class="v" id="stP">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button id="btnLift" class="abtn" data-zh="抬起并保持" data-en="Lift &amp; hold">抬起并保持</button>
    <button id="btnRelease" class="abtn warn" data-zh="松手!" data-en="Release!" disabled>松手!</button>
  </div>
  <div class="row"><label data-zh="自转 ω" data-en="spin ω">自转 ω</label><input id="spin" type="range" min="0" max="60" step="1" value="0"><span class="val" id="spinVal">0.0</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglVectors" type="checkbox" checked> <span data-zh="L / τ / mg 向量" data-en="L / τ / mg vectors">L / τ / mg 向量</span></label>
    <label><input id="tglTrail" type="checkbox" checked> <span data-zh="轴尖轨迹" data-en="axle trace">轴尖轨迹</span></label>
    <label><input id="tglFriction" type="checkbox" checked> <span data-zh="轴承摩擦(ω 缓慢衰减)" data-en="bearing friction (ω decays)">轴承摩擦(ω 缓慢衰减)</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../angular-momentum/" data-zh="角动量守恒(大小不变)" data-en="angular momentum (magnitude)">角动量守恒(大小不变)</a>
    <a href="../orbital-mechanics/" data-zh="开普勒轨道:另一种「横着走」" data-en="Kepler orbits: another sideways move">开普勒轨道:另一种「横着走」</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.post.color.set(THEME === 'light' ? 0x8d99a8 : 0x3a414d);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('陀螺进动 · 重力矩不把它放倒', 'Gyroscopic Precession · why it will not fall');
  for (const r of labelRegistry) r.o.element.textContent = L(r.zh, r.en);
  buildSteps();
  setPlayLabel();
  updateLiftBtn();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.8, 4.0, 7.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.7, 2.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  post: mat(0x3a414d, { roughness: 0.7 }),
  metal: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  rim: mat(0xff9f28, { roughness: 0.4 }),
  tire: mat(0x23272e, { roughness: 0.85 }),
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  ring: new THREE.MeshBasicMaterial({ color: 0x39424f, transparent: true, opacity: 0.85 }),
  vecL: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.95 }),
  vecTau: new THREE.MeshBasicMaterial({ color: 0xff9f28, transparent: true, opacity: 0.95 }),
  vecG: new THREE.MeshBasicMaterial({ color: 0xff5d5d, transparent: true, opacity: 0.95 }),
  vecO: new THREE.MeshBasicMaterial({ color: 0x43d17c, transparent: true, opacity: 0.95 }),
  trail: new THREE.LineDashedMaterial({ color: 0x8b97a8, dashSize: 0.14, gapSize: 0.1, transparent: true, opacity: 0.55 }),
  spinMark: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.9 }),
};

/* ---------------- 地面 / 支架 ---------------- */
const PIVOT = new THREE.Vector3(0, 3.3, 0);
const floor = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.6, 0.22, 48), M.floor);
floor.position.y = -0.11;
scene.add(floor);
const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.7, 0.16, 28), M.post);
base.position.set(0, 0.08, 0);
scene.add(base);
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 3.1, 14), M.post);
post.position.set(0, 1.63, 0);
scene.add(post);
const pivotBall = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), M.metal);
pivotBall.position.copy(PIVOT);
scene.add(pivotBall);
const ring = new THREE.Mesh(new THREE.TorusGeometry(2.9, 0.012, 6, 96), M.ring);
ring.rotation.x = Math.PI / 2;
ring.position.y = 0.006;
scene.add(ring);

/* ---------------- 轮子(axle 沿局部 +x,自转绕 x) ---------------- */
const WHEEL_D = 1.65;
const wheelRig = new THREE.Group();       // 定位 + 朝向(四元数)
scene.add(wheelRig);
const wheelSpin = new THREE.Group();      // 自转(绕局部 x)
wheelRig.add(wheelSpin);
function buildWheel() {
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.0, 12), M.metal);
  axle.rotation.z = Math.PI / 2;
  axle.position.x = 0.25;
  wheelSpin.add(axle);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), M.metal);
  tip.position.x = -0.25;
  wheelSpin.add(tip);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.07, 12, 48), M.rim);
  rim.rotation.y = Math.PI / 2;
  rim.position.x = WHEEL_D;
  wheelSpin.add(rim);
  const tire = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.09, 12, 48), M.tire);
  tire.rotation.y = Math.PI / 2;
  tire.position.x = WHEEL_D;
  wheelSpin.add(tire);
  for (let i = 0; i < 6; i++) {
    const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1.52, 8), M.metal);
    sp.rotation.x = i / 6 * Math.PI;
    sp.position.x = WHEEL_D;
    wheelSpin.add(sp);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.14, 14), M.metal);
  hub.rotation.z = Math.PI / 2;
  hub.position.x = WHEEL_D;
  wheelSpin.add(hub);
  const mark = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), M.spinMark);
  mark.position.set(WHEEL_D, 0.82, 0);
  wheelSpin.add(mark);
}
buildWheel();
const axleDir = new THREE.Vector3();
function placeWheel(phi, theta) {
  axleDir.set(Math.cos(phi) * Math.cos(theta), Math.sin(phi), Math.cos(phi) * Math.sin(theta));
  wheelRig.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), axleDir);
  wheelRig.position.copy(PIVOT).addScaledVector(axleDir, 0.25);   // 轴的枢轴端贴住支点
}

/* ---------------- 向量箭头 ---------------- */
function makeArrow(material, r = 0.045) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 10), material);
  shaft.position.y = 0.5;
  g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(r * 2.4, r * 5.5, 12), material);
  tip.position.y = 1 + r * 2.6;
  g.add(tip);
  g.setV = (dir, len) => {
    g.scale.set(1, Math.max(len, 0.001), 1);
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  };
  return g;
}
const arrL = makeArrow(M.vecL, 0.05);
scene.add(arrL);
const arrTau = makeArrow(M.vecTau, 0.045);
scene.add(arrTau);
const arrG = makeArrow(M.vecG, 0.04);
scene.add(arrG);
const omegaSpin = new THREE.Group();
omegaSpin.position.set(0, PIVOT.y - 0.04, 0);
scene.add(omegaSpin);
const omegaTilt = new THREE.Group();
omegaTilt.rotation.x = Math.PI / 2;
omegaSpin.add(omegaTilt);
const omegaArc = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.02, 6, 48, 4.4), M.vecO);
omegaTilt.add(omegaArc);

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(zh, en, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.textContent = zh;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, zh, en });
  return o;
}
const lblL = addLabel('L = Iω', 'L = Iω', new THREE.Vector3(0, 0, 0), 'l');
const lblTau = addLabel('τ = mgd ⊥ L', 'τ = mgd ⊥ L', new THREE.Vector3(0, 0, 0), 'tau');
const lblMg = addLabel('mg', 'mg', new THREE.Vector3(0, 0, 0), 'mg');
const lblOmega = addLabel('Ω', 'Ω', new THREE.Vector3(0, 0, 0), 'g');
const lblNote = addLabel(' ', ' ', new THREE.Vector3(0, 4.4, 0), 'note');

/* ---------------- 轴尖轨迹圈 ---------------- */
const TRAIL_N = 72;
const trailGeom = new THREE.BufferGeometry();
trailGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array((TRAIL_N + 1) * 3), 3));
const trail = new THREE.Line(trailGeom, M.trail);
trail.computeLineDistances();
scene.add(trail);
function updateTrail(phi) {
  const pos = trailGeom.attributes.position;
  const r = Math.max(WHEEL_D * Math.cos(phi), 0.05);
  for (let i = 0; i <= TRAIL_N; i++) {
    const a = i / TRAIL_N * Math.PI * 2;
    pos.setXYZ(i, Math.cos(a) * r, PIVOT.y, Math.sin(a) * r);
  }
  pos.needsUpdate = true;
  trail.computeLineDistances();
}

/* ================= 物理 ================= */
/* φ:轴仰角(0 = 水平,−π/2 = 倒挂)  θ:进动角  ω:自转 */
let phi = -1.45, phiDot = 0, theta = 0, spinSpin = 0;
let omegaTarget = clamp(qsFloat('omega', 0) * 10, 0, 60) / 10;
let held = false, everSpun = false;
const M_M = 1.0, D = WHEEL_D, G = 9.8, I_DISK = 1.0, I_P = I_DISK + M_M * D * D;
const TAU_G = M_M * G * D;              // 18.6
const W_CRIT = 2.2;                     // 临界自转
const A_GYRO = TAU_G / (W_CRIT * W_CRIT);
let friction = true;
const spinVal = document.getElementById('spinVal');
function physics(dt) {
  if (held) {
    phi = lerp(phi, 0, 1 - Math.exp(-dt * 5));
    phiDot = 0;
    return;
  }
  const w = spinSpin;
  const gyro = A_GYRO * w * w;
  const alpha = (-TAU_G * Math.cos(phi) - gyro * Math.sin(phi)) / I_P - 0.45 * phiDot;
  phiDot += alpha * dt;
  phi += phiDot * dt;
  if (phi > 0.55) { phi = 0.55; phiDot = Math.min(phiDot, 0); }
  const omega = w;
  if (omega > 0.25) {
    const Omega = TAU_G * Math.cos(clamp(phi, -0.6, 0.6)) / (I_DISK * omega);
    theta -= Omega * dt;
  }
}
function stepSpin(dt) {
  spinSpin = lerp(spinSpin, omegaTarget, 1 - Math.exp(-dt * 2.2));
  if (friction && omegaTarget > 0.01) omegaTarget *= Math.exp(-dt * 0.055);
  if (spinSpin > 0.5) everSpun = true;
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '不转:重力矩直接放倒', be: 'No spin: gravity wins',
    d: '支点只托住轴的一端,重力把另一端往下拽——力矩 τ = mgd 水平指向画面里。轮子静止时没有任何东西抵抗它,只能倒挂。',
    de: 'The pivot holds one end only; gravity pulls the other end down — a horizontal torque τ = mgd. A still wheel has nothing to answer it: it just hangs.',
    act: () => { omegaTarget = 0; document.getElementById('spin').value = 0; spinVal.textContent = '0.0'; } },
  { b: '抬起并高速自转', be: 'Lift it & spin it up',
    d: 'L = Iω 沿轴、随自转加速变长——角动量有了大小,也有了「脾气」:它抗拒方向被改变。',
    de: 'L = Iω points along the axle and grows with the spin — angular momentum now resists any change of direction.',
    act: () => { held = true; omegaTarget = 4.6; document.getElementById('spin').value = 46; spinVal.textContent = '4.6'; } },
  { b: '松手:进动,而不是坠落', be: 'Release: it precesses',
    d: 'τ ⊥ L → dL/dt 沿 τ 方向:轴尖沿着水平圆圈走,轮子扫出一个锥面。Ω = mgd / Iω——这就是「横着走」。',
    de: 'τ ⊥ L means dL/dt points along τ: the axle tip walks a horizontal circle, sweeping a cone. Ω = mgd / Iω.',
    act: () => { held = false; phiDot = 0; if (spinSpin < 3) { omegaTarget = 4.6; document.getElementById('spin').value = 46; spinVal.textContent = '4.6'; } } },
  { b: '拖慢自转:进动反而更快', be: 'Slow the spin: precession speeds up',
    d: 'Ω ∝ 1/ω——转得越慢,L 越小,同样的力矩把它拧得越快。把滑块往左拖,看进动加速。',
    de: 'Ω ∝ 1/ω — a slower wheel has smaller L, so the same torque wrenches it around faster. Drag the slider left and watch.',
    act: () => { held = false; phi = 0; phiDot = 0; omegaTarget = 2.6; document.getElementById('spin').value = 26; spinVal.textContent = '2.6'; } },
  { b: '转得太慢:撑不住,塌落', be: 'Too slow: it collapses',
    d: 'ω 低于临界值,陀螺项撑不住重力矩——轴一路垂下去。自行车骑起来才稳、直升机尾桨抗反扭,都在这条线上。',
    de: 'Below the critical spin the gyroscopic term loses to gravity and the axle drops. Bikes are stable only when ridden; helicopter tail rotors fight the same torque.',
    act: () => { held = false; omegaTarget = 1.1; document.getElementById('spin').value = 11; spinVal.textContent = '1.1'; } },
];
function stepIndex() {
  if (held) return 1;
  if (spinSpin < 0.4 && phi < -0.9) return 0;
  if (everSpun && phi < -0.9 && spinSpin < W_CRIT) return 4;
  if (Math.abs(phi) < 0.5 && spinSpin >= 2.4) return 2;
  if (Math.abs(phi) < 0.6 && spinSpin >= 0.4) return 3;
  return spinSpin >= 0.4 ? 3 : 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.1, 3);
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elSpin = document.getElementById('spin');
const btnLift = document.getElementById('btnLift');
const btnRelease = document.getElementById('btnRelease');
const tglLabels = document.getElementById('tglLabels');
const tglVectors = document.getElementById('tglVectors');
const tglTrail = document.getElementById('tglTrail');
const tglFriction = document.getElementById('tglFriction');
const stW = document.getElementById('stW'), stO = document.getElementById('stO'),
  stL = document.getElementById('stL'), stP = document.getElementById('stP');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elSpin.addEventListener('input', () => {
  omegaTarget = parseInt(elSpin.value, 10) / 10;
  spinVal.textContent = omegaTarget.toFixed(1);
  everSpun = everSpun || omegaTarget > 0.5;
});
btnLift.addEventListener('click', () => { held = true; updateLiftBtn(); });
btnRelease.addEventListener('click', () => { held = false; phiDot = 0; updateLiftBtn(); });
function updateLiftBtn() { btnRelease.disabled = !held; }
tglFriction.addEventListener('change', () => { friction = tglFriction.checked; });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglVectors.addEventListener('change', () => {
  for (const a of [arrL, arrTau, arrG, omegaSpin]) a.visible = tglVectors.checked;
  lblL.element.style.display = lblTau.element.style.display =
  lblMg.element.style.display = lblOmega.element.style.display =
    (tglVectors.checked && tglLabels.checked) ? '' : 'none';
});
tglTrail.addEventListener('change', () => { trail.visible = tglTrail.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
if (!qsBool('vectors', true)) { tglVectors.checked = false; tglVectors.dispatchEvent(new Event('change')); }
if (!qsBool('trail', true)) { tglTrail.checked = false; tglTrail.dispatchEvent(new Event('change')); }
if (!qsBool('friction', true)) { tglFriction.checked = false; tglFriction.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    const n = 2;
    for (let i = 0; i < n; i++) { stepSpin(dts / n); physics(dts / n); }
  }
  const spinAngle = spinSpin * performance.now() / 1000;
  wheelSpin.rotation.x = spinAngle * 0.35;
  placeWheel(phi, theta);
  updateTrail(phi);

  /* 向量 */
  const wl = clamp(spinSpin / 6 * 1.5, 0.25, 1.7);
  arrL.setV(axleDir, wl);
  arrL.position.copy(wheelRig.position).addScaledVector(axleDir, 0.35);
  lblL.position.copy(arrL.position).addScaledVector(axleDir, wl + 0.22);
  const tauDir = new THREE.Vector3(axleDir.z, 0, -axleDir.x);
  if (tauDir.lengthSq() < 1e-6) tauDir.set(0, 0, -1);
  arrTau.setV(tauDir, 0.9);
  arrTau.position.copy(PIVOT);
  lblTau.position.copy(PIVOT).addScaledVector(tauDir, 1.18);
  arrG.setV(new THREE.Vector3(0, -1, 0), 0.75);
  arrG.position.copy(wheelRig.position);
  lblMg.position.copy(wheelRig.position).add(new THREE.Vector3(0, -1.05, 0));
  omegaSpin.rotation.y = theta * 3;
  lblOmega.position.set(0, PIVOT.y + 0.42, 0);
  lblOmega.element.textContent = `Ω = ${(TAU_G / Math.max(I_DISK * spinSpin, 0.01)).toFixed(2)} rad/s`;

  /* 状态注释 */
  const st = stepIndex();
  lblNote.element.textContent =
    st === 0 ? L('ω = 0:只有重力矩——倒挂,像单摆', 'ω = 0: only gravity — it hangs like a pendulum')
    : st === 1 ? L('手持保持水平(先转起来!)', 'held level (spin it up first!)')
    : st === 2 ? L('进动中:τ 只改变 L 的方向', 'precessing: τ only redirects L')
    : st === 3 ? L('自转偏慢:进动加速,接近临界', 'slow spin: precession racing toward critical')
    : L('ω 低于临界:塌落', 'ω below critical: collapse');
  lblNote.element.style.opacity = 1;

  const si = st;
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  const Omega = spinSpin > 0.25 ? TAU_G * Math.cos(clamp(phi, -0.6, 0.6)) / (I_DISK * spinSpin) : 0;
  stW.textContent = spinSpin.toFixed(2) + ' rad/s';
  stO.textContent = Omega.toFixed(2) + ' rad/s';
  stL.textContent = (I_DISK * spinSpin).toFixed(2);
  stP.textContent = (phi * 180 / Math.PI).toFixed(0) + '°';
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
updateLiftBtn();
if (omegaTarget > 0.4) { elSpin.value = Math.round(omegaTarget * 10); spinVal.textContent = omegaTarget.toFixed(1); everSpun = true; }
requestAnimationFrame(frame);
</script>
</body>
</html>
