<!DOCTYPE html>

<style>

  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.v { border-color: rgba(178,130,255,.9); color: #e4d4ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.v { color:#6741d9; }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }

    text-shadow: 0 2px 8px rgba(0,0,0,.6); }

    text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;

  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }
  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }

  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);

    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }

  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }

    border: 1px solid transparent; align-items: flex-start; }

  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="蛋白质折叠:一条链如何折成一台机器" data-en="Protein Folding: How a Chain Folds into a Machine">蛋白质折叠:一条链如何折成一台机器</h1>
  <div class="sub" data-zh="核糖体吐出的只是一条一维氨基酸链——疏水侧链怕水往里躲(水熵是发动机)、氢键与二硫键把骨架钉住,能量漏斗把亿万种构象收束成唯一的天然态;结构即功能:活性位点成形,酶才开始工作;错误折叠的链会互相「粘」成淀粉样纤维——朊病毒与阿尔茨海默的真相 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="The ribosome extrudes only a one-dimensional chain of amino acids — hydrophobic side chains flee water inward (water entropy is the engine), hydrogen bonds and disulfide bridges pin the backbone, and an energy funnel squeezes billions of conformations into the single native state; structure is function: only when the active site takes shape does the enzyme start work; misfolded chains glue into amyloid fibrils — the truth behind prions and Alzheimer's · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">蛋白质折叠:一条链如何折成一台机器</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="折叠进度" data-en="Folded">折叠进度</span><span class="v" id="stP">0%</span>

    <button class="abtn on" id="btnRefold" data-zh="重新折叠" data-en="refold">重新折叠</button>

  <div class="row"><label data-zh="温度" data-en="Temperature">温度</label><input id="temp" type="range" min="20" max="90" step="1" value="37"><span class="val" id="tempVal">37 °C</span></div>
  <div class="row"><label data-zh="pH" data-en="pH">pH</label><input id="ph" type="range" min="0" max="14" step="0.5" value="7"><span class="val" id="phVal">7.0</span></div>

      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>

    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../translation-ribosome/" data-zh="上游:核糖体逐密码子造链" data-en="upstream: the ribosome builds the chain">上游:核糖体逐密码子造链</a>
    <a href="../enzyme-induced-fit/" data-zh="折叠好后:诱导契合" data-en="once folded: induced fit">折叠好后:诱导契合</a>
    <a href="../virus-lifecycle/" data-zh="劫持这台折叠工厂" data-en="hijacking this folding factory">劫持这台折叠工厂</a>
    <a href="../hydrogen-bond/" data-zh="钉住骨架的弱键:氢键" data-en="the weak bonds pinning it: hydrogen bonds">钉住骨架的弱键:氢键</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x18243a, 14, 34);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
  scene.fog.color = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('蛋白质折叠 · 一条链如何折成一台机器', 'Protein Folding · How a Chain Folds into a Machine');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
camera.position.set(3.4, 1.9, 5.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 9, 7);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 状态 ================= */
const NM = 0.85;
const N = 48;
let foldT = 0, foldTarget = 0;
let grown = 0;
let chaperone = false, prionOn = false, converted = false, convT = 0;
let substrateDocked = 0, catalysis = 0;
let waterFreed = 0;
let tempC = 37, phV = 7;
let denatured = false;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let labelsOn = qsBool('labels', true);
let spinOn = qsBool('spin', true);

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ================= 场景布置 ================= */
const cyto = new THREE.Mesh(new THREE.BoxGeometry(7.4, 4.6, 4.6),
  mat(0x9db8d6, { opacity: 0.05, roughness: 0.1, metalness: 0 }));
cyto.position.y = 0.2;
scene.add(cyto);
const grid = new THREE.GridHelper(7, 14, 0x3a4a63, 0x2a3648);
grid.position.y = -2.1;
(grid.material).transparent = true;
(grid.material).opacity = 0.35;
scene.add(grid);

const ribo = new THREE.Group();
{
  const big = new THREE.Mesh(new THREE.SphereGeometry(0.95, 28, 20),
    mat(0x8f9fb8, { opacity: 0.4, roughness: 0.35 }));
  big.scale.set(1.25, 0.85, 1.1);
  ribo.add(big);
  const small = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 16),
    mat(0xa7b6cd, { opacity: 0.45, roughness: 0.35 }));
  small.scale.set(1.2, 0.7, 1.05);
  small.position.set(0.15, -0.75, 0.05);
  ribo.add(small);
  const tunnel = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.05, 10, 22),

}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 26, padB = 26;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const xOf = rg => pad + (clamp(rg, 0.8, 2.9) - 0.8) / 2.1 * (W - pad - 14);
  const yOf = e => 10 + (1 - clamp(e, 0, 260) / 260) * (H - padB - 12);
  ctx.strokeStyle = 'rgba(255,169,77,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= 100; x++) {
    const rg = 0.8 + x / 100 * 2.1;
    const eMax = 250 * Math.pow(clamp((rg - 0.92) / 1.9, 0, 1), 1.4) + 10;
    if (x === 0) ctx.moveTo(xOf(rg), yOf(eMax));
    else ctx.lineTo(xOf(rg), yOf(eMax));
  }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,169,77,.07)';
  ctx.lineTo(xOf(0.8), yOf(0));
  ctx.lineTo(xOf(0.8), yOf(10));
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = cTxt;
  ctx.font = '16px sans-serif';
  ctx.fillText('Rg →', W - 74, H - 8);
  ctx.save();
  ctx.translate(14, 54);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('ΔG (kJ/mol) ↑', 0, 0);
  ctx.restore();
  const rg = radiusGyration(), e = energyNow();
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath();
  ctx.arc(xOf(rg), yOf(e), 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,169,77,.5)';
  ctx.beginPath();
  ctx.moveTo(xOf(rg), H - padB);
  ctx.lineTo(xOf(rg), yOf(e));
  ctx.stroke();
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elTemp = document.getElementById('temp'), elTempVal = document.getElementById('tempVal');
const elPh = document.getElementById('ph'), elPhVal = document.getElementById('phVal');
const stP = document.getElementById('stP'), stRg = document.getElementById('stRg'), stE = document.getElementById('stE'),
  stW = document.getElementById('stW'), stS = document.getElementById('stS');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncSliders() {
  elTemp.value = tempC; elTempVal.textContent = tempC + ' °C';
  elPh.value = phV; elPhVal.textContent = phV.toFixed(1);
}
function stateNow() {
  if (converted) return [L('朊病毒聚集 ⚠', 'prion aggregate ⚠'), 'bad'];
  if (denatured) return [L('变性(一级结构还在)', 'denatured (primary intact)'), 'warn'];
  if (foldT > 0.97 && grown === 1) return [substrateDocked >= 1 ? L('天然态·催化中', 'native · catalyzing') : L('天然态', 'native'), 'ok'];
  if (foldT > 0.1) return [L('折叠中', 'folding'), 'warn'];
  return [grown > 0 ? L('翻译延伸中', 'translating') : L('未开始', 'idle'), 'warn'];
}
function updateFormula() {
  const rg = radiusGyration(), e = energyNow();
  const p = clamp(foldT, 0, 1);
  const cond = tempC > 65 || phV < 4 || phV > 11;
  formulaEl.innerHTML = L(
    `ΔG ≈ 230·(1−p)² = <b>${e.toFixed(0)} kJ/mol</b> · p(折叠进度)=<b>${(p * 100).toFixed(0)}%</b><br>` +
    `Rg = <b>${rg.toFixed(2)} nm</b> · 释放水 ≈ <b>${waterFreed}</b> · Tm ≈ 65 °C · ${cond ? '<b style="color:#ff8787">变性条件!</b>' : L('条件适宜', 'conditions fine')}`,
    `ΔG ≈ 230·(1−p)² = <b>${e.toFixed(0)} kJ/mol</b> · p(folded)=<b>${(p * 100).toFixed(0)}%</b><br>` +
    `Rg = <b>${rg.toFixed(2)} nm</b> · waters freed ≈ <b>${waterFreed}</b> · Tm ≈ 65 °C · ${cond ? '<b style="color:#ff8787">denaturing!</b>' : L('conditions fine', 'conditions fine')}`);
}
document.getElementById('btnRefold').addEventListener('click', () => {
  denatured = false;
  if (prionOn || converted) { resetChain(); }
  grown = 1;
  foldTarget = 1;
  setBtnState();
  syncAll();
});
document.getElementById('btnDenat').addEventListener('click', () => {
  denatured = true;
  foldTarget = 0;
  tempC = Math.max(tempC, 80);
  setBtnState();
  syncAll();
});
document.getElementById('btnChap').addEventListener('click', () => {
  chaperone = !chaperone;
  cage.visible = chaperone;
  setBtnState();
  syncAll();
});
document.getElementById('btnPrion').addEventListener('click', () => {
  if (foldTarget < 0.9) foldTarget = 1;
  grown = 1;
  prionOn = true;
  denatured = false;
  setBtnState();
  syncAll();
});
function setBtnState() {
  document.getElementById('btnChap').classList.toggle('on', chaperone);
  document.getElementById('btnPrion').classList.toggle('on', prionOn || converted);
}
elTemp.addEventListener('input', () => {
  tempC = +elTemp.value;
  if (tempC > 65) { denatured = true; foldTarget = 0; }
  else if (denatured && tempC <= 65 && phV >= 4 && phV <= 11) { denatured = false; foldTarget = grown ? 1 : 0; }
  syncAll();
});
elPh.addEventListener('input', () => {
  phV = +elPh.value;
  if (phV < 4 || phV > 11) { denatured = true; foldTarget = 0; }
  else if (denatured && tempC <= 65) { denatured = false; foldTarget = grown ? 1 : 0; }
  syncAll();
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
controls.autoRotate = spinOn;
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});
function syncAll() { syncSliders(); updateFormula(); drawPlot(); }

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, statsAcc = 0, dockT = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const t = clock.elapsedTime;
  const dt = dt0 * (playing ? speed : 0);
  if (dt > 0) {
    if (grown > 0 && grown < 1) grown = Math.min(1, grown + dt * 0.22);
    if (grown > 0.999) {
      if (foldT < foldTarget) foldT = Math.min(foldTarget, foldT + dt * 0.16 * (chaperone ? 1.8 : 1));
      else if (foldT > foldTarget) foldT = Math.max(foldTarget, foldT - dt * 0.5);
    }
    if (substrateDocked > 0 && substrateDocked < 1) {
      substrateDocked = Math.min(1, substrateDocked + dt * 0.5);
      substrate.position.lerpVectors(SUB_HOME, SUB_POCKET, ease(substrateDocked));
      if (substrateDocked >= 1) catalysis += dt;
    } else if (substrateDocked >= 1 && foldT > 0.9 && !denatured && !converted) {
      catalysis += dt;
      substrate.position.copy(SUB_POCKET);
      dockRing.material.opacity = 0.4 + 0.4 * Math.sin(t * 5);
    } else dockRing.material.opacity = 0;
    dockT += dt;
    updateChain(t);
    updateHBonds();
    updateWater(t, dt);
    updatePrion(t, dt);
    labCore.position.lerp(new THREE.Vector3(0.1, 0.85, 0.05), 0.05);
    labCage.position.set(0, 1.75, 0);
    labCage.visible = chaperone;
    labPocket.visible = foldT > 0.9;
    labPrion.visible = prionOn;
    labHelix.visible = labSheet.visible = foldT > 0.55;
    labCore.visible = foldT > 0.35;
    refreshLabels();
    statsAcc += dt0;
    if (statsAcc > 0.12) {
      statsAcc = 0;
      const p = clamp(foldT, 0, 1);
      stP.textContent = (p * 100).toFixed(0) + '%';
      stRg.innerHTML = radiusGyration().toFixed(2) + ' <small>nm</small>';
      stE.textContent = energyNow().toFixed(0) + ' kJ/mol';
      stW.textContent = waterFreed;
      const [st, cls] = stateNow();
      stS.textContent = st;
      stS.className = 'v ' + cls;
      updateFormula();
      drawPlot();
    }
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* URL 参数 */
const ph0 = Math.round(qsFloat('phase', 0));
if (ph0 >= 1 && ph0 <= 6) { STEPS[ph0 - 1].act(); }
else if (qsFloat('t', 0) > 0) {
  grown = 1;
  foldT = foldTarget = clamp(qsFloat('t', 0) / 10, 0, 1);
}
setBtnState();
applyTheme();
applyLang();
syncAll();
start();
</script>
</body>
