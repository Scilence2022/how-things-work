<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>细菌鞭毛马达 · 300 转每秒的生物涡轮</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="细菌鞭毛马达" data-en="The Flagellar Motor">细菌鞭毛马达</h1>
  <div class="sub" data-zh="看质子一颗颗挤过定子通道、转子环以 ~14° 步进拧转；调高引诱剂，右上俯视轨迹当场从折线变直线（游多滚少）· 拖动旋转 / 空格运行/暂停" data-en="Watch protons squeeze through stator channels as the rotor turns in ~14° steps; raise attractant and the top-view trail straightens from zigzag to run · drag to orbit / Space = run/pause">看质子一颗颗挤过定子通道、转子环以 ~14° 步进拧转；调高引诱剂，右上俯视轨迹当场从折线变直线（游多滚少）· 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="转速" data-en="Speed">转速</span><span class="v" id="stRps">—</span>
  <span class="k" data-zh="方向" data-en="Direction">方向</span><span class="v" id="stDir">—</span>
  <span class="k" data-zh="顺时针概率" data-en="CW probability">顺时针概率</span><span class="v" id="stCw">—</span>
  <span class="k" data-zh="质子流量" data-en="Proton flux">质子流量</span><span class="v" id="stFlux">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnMode" data-zh="换向：自动趋化" data-en="Switch: auto chemotaxis">换向：自动趋化</button>
    <button class="abtn" id="btnReset" data-zh="重置轨迹" data-en="Reset trail">重置轨迹</button>
  </div>
  <div class="row">
    <label data-zh="质子动力势 Δp" data-en="Proton motive force">质子动力势 Δp</label>
    <input id="sPmf" type="range" min="0" max="100" step="1" value="70">
    <span class="val" id="sPmfVal">119 mV</span>
  </div>
  <div class="row">
    <label data-zh="引诱剂浓度" data-en="Attractant">引诱剂浓度</label>
    <input id="sAtt" type="range" min="0" max="100" step="1" value="15">
    <span class="val" id="sAttVal">15</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../atp-synthase/" data-zh="ATP 合酶：同款旋转泵" data-en="ATP synthase: the rotary cousin">ATP 合酶</a>
    <a href="../kinesin/" data-zh="驱动蛋白：直线马达" data-en="Kinesin: the linear motor">驱动蛋白</a>
    <a href="../boids-flocking/" data-zh="boids：偏置随机游走的群体版" data-en="Boids: biased random walk, en masse">boids 群体</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---- 工具 ---- */
const qs=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,f)=>a+(b-a)*f;
const rnd=(a,b)=>a+Math.random()*(b-a);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 / 场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,40);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,120);
camera.position.set(3.6,2.8,9.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.8,0.5,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=3; controls.maxDistance=45;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(4,7,6); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-6,4,-4); scene.add(fill);

/* ---- 细胞包膜剖面 ---- */
const membIn=new THREE.Mesh(new THREE.BoxGeometry(7.4,0.16,3.2),
  new THREE.MeshStandardMaterial({color:0x39424e,roughness:.45,metalness:.25}));
membIn.position.y=0; scene.add(membIn);
const pgWall=new THREE.Mesh(new THREE.BoxGeometry(7.4,0.05,3.2),
  new THREE.MeshStandardMaterial({color:0x5c6b7a,roughness:.7,transparent:true,opacity:.75}));
pgWall.position.y=0.5; scene.add(pgWall);
const membOut=new THREE.Mesh(new THREE.BoxGeometry(7.4,0.14,3.2),
  new THREE.MeshStandardMaterial({color:0x4c5866,roughness:.45,metalness:.25}));
membOut.position.y=1.02; scene.add(membOut);

/* ---- 转子（随角度旋转）：杆 + MS 环 + C 环 + 钩 + 鞭毛丝 ---- */
const rotorG=new THREE.Group(); scene.add(rotorG);
const rodMat=new THREE.MeshStandardMaterial({color:0xb8c4d0,roughness:.3,metalness:.7});
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.6,12),rodMat);
rod.position.y=0.28; rotorG.add(rod);
const ringMat=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:.35,metalness:.4});
const msRing=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.075,12,40),ringMat);
msRing.rotation.x=Math.PI/2; msRing.position.y=0.02; rotorG.add(msRing);
const cRing=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.1,12,44),
  new THREE.MeshStandardMaterial({color:0x4dabf7,roughness:.35,metalness:.4}));
cRing.rotation.x=Math.PI/2; cRing.position.y=-0.4; rotorG.add(cRing);
/* L/P 套环（静止轴衬） */
const lpMat=new THREE.MeshStandardMaterial({color:0x8a97a5,roughness:.5,transparent:true,opacity:.85});
const lp1=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.05,10,30),lpMat);
lp1.rotation.x=Math.PI/2; lp1.position.y=0.5; scene.add(lp1);
const lp2=lp1.clone(); lp2.position.y=0.94; scene.add(lp2);
/* 钩 */
const hookCurve=new THREE.QuadraticBezierCurve3(
  new THREE.Vector3(0,1.0,0),new THREE.Vector3(0.42,1.3,0),new THREE.Vector3(0.1,1.62,0));
const hook=new THREE.Mesh(new THREE.TubeGeometry(hookCurve,20,0.07,8),rodMat);
rotorG.add(hook);
/* 鞭毛丝：螺旋管（真实为 11 根原丝螺旋，螺距 ~2.3µm/圈，此处按比例示意） */
const AX=new THREE.Vector3(-0.34,0.9,0.28).normalize();
const U=new THREE.Vector3(0,1,0).cross(AX).normalize();
const V=new THREE.Vector3().crossVectors(AX,U).normalize();
const helixPts=[];
for(let i=0;i<=130;i++){
  const t=i/130*3.9, ang=t*10.5;
  const p=new THREE.Vector3(0.1,1.62,0)
    .addScaledVector(AX,t)
    .addScaledVector(U,Math.cos(ang)*0.16)
    .addScaledVector(V,Math.sin(ang)*0.16);
  helixPts.push(p);
}
const fila=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(helixPts),240,0.05,8),
  new THREE.MeshStandardMaterial({color:0xdfe8f2,roughness:.4,metalness:.15}));
rotorG.add(fila);

/* ---- 定子 MotA/MotB ×10（静止） ---- */
const stators=[];
const stG=new THREE.Group(); scene.add(stG);
for(let i=0;i<10;i++){
  const a=i/10*Math.PI*2;
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.17,0.52,0.17),
    new THREE.MeshStandardMaterial({color:0xffa94d,roughness:.4,emissive:0xffa000,emissiveIntensity:0}));
  m.position.set(Math.cos(a)*0.98,0,Math.sin(a)*0.98);
  stG.add(m); stators.push(m);
}

/* ---- 质子（实例化，未用实例缩放置零） ---- */
const PN=24;
const pMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.075,10,8),
  new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x74c0fc,emissiveIntensity:.9}),PN);
pMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(pMesh);
const zeroM=new THREE.Matrix4().makeScale(0,0,0), tmpM=new THREE.Matrix4();
const pState=[];
for(let i=0;i<PN;i++){ pMesh.setMatrixAt(i,zeroM); pState.push({mode:0,t:0,a0:0,st:-1}); }

/* ---- 俯视轨迹面板（canvas 纹理） ---- */
const cv=document.createElement('canvas'); cv.width=256; cv.height=176;
const cx2=cv.getContext('2d');
const cvTex=new THREE.CanvasTexture(cv);
const insetFrame=new THREE.Mesh(new THREE.BoxGeometry(3.9,2.75,0.06),
  new THREE.MeshStandardMaterial({color:0x161b22,roughness:.9}));
insetFrame.position.set(5.0,2.55,-0.6); scene.add(insetFrame);
const inset=new THREE.Mesh(new THREE.PlaneGeometry(3.7,2.55),
  new THREE.MeshBasicMaterial({map:cvTex,transparent:true,opacity:.96}));
inset.position.set(5.0,2.55,-0.56); scene.add(inset);
/* 轨迹小菌 */
let bx=128,by=88,bh=rnd(0,6.28);
function updateInset(dt){
  cx2.fillStyle='rgba(8,10,14,0.075)'; cx2.fillRect(0,0,256,176);
  if(rotDir>0){ // 逆时针：平滑游动
    bx+=Math.cos(bh)*50*dt; by+=Math.sin(bh)*50*dt;
  }else{ // 顺时针：翻滚——方向剧烈改变、原地打转
    bh+=(Math.random()-0.5)*22*dt; bx+=Math.cos(bh)*7*dt; by+=Math.sin(bh)*7*dt;
  }
  if(bx<6||bx>250||by<6||by>170){ bx=clamp(bx,6,250); by=clamp(by,6,170); bh+=Math.PI*rnd(0.7,1.3); }
  cx2.fillStyle='#ffa94d';
  cx2.beginPath(); cx2.arc(bx,by,3.2,0,6.29); cx2.fill();
  cx2.strokeStyle='rgba(255,169,77,.7)'; cx2.beginPath();
  cx2.moveTo(bx,by); cx2.lineTo(bx+Math.cos(bh)*9,by+Math.sin(bh)*9); cx2.stroke();
  cvTex.needsUpdate=true;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('定子 MotA/MotB ×10','Stators MotA/MotB ×10'),
  new THREE.Vector3(0,0.5,1.25),'o',()=>true,stG);
addLabel(()=>L('转子：杆+MS 环+C 环','Rotor: rod + MS + C rings'),
  new THREE.Vector3(0,-0.85,0),'b',()=>true,rotorG);
addLabel(()=>L('钩 hook','Hook'),new THREE.Vector3(0.85,1.45,0),'g',()=>true,rotorG);
addLabel(()=>L('鞭毛丝（螺旋管，可正反转）','Filament (helical, reversible)'),
  new THREE.Vector3(-1.4,3.4,0.5),'g',()=>true,rotorG);
addLabel(()=>L('H⁺ 顺 Δp 梯度过通道','H⁺ down Δp through channel'),
  new THREE.Vector3(1.5,0.62,0),'b',()=>true,stG);
addLabel(()=>L('俯视轨迹：游动 ↔ 翻滚','Top view: swim ↔ tumble'),
  new THREE.Vector3(0,1.68,0),'o',()=>true,inset);
addLabel(()=>L('MCP 感受器 → CheA → CheY-P ↓ → 顺时针↓','MCP → CheA → CheY-P ↓ → CW ↓'),
  new THREE.Vector3(0,-1.7,0),'g',()=>attract>25);

/* ---- 状态 ---- */
let playing=true, labelsOn=true;
let pmf=70, attract=15;          // Δp 滑条 0-100 → 0-170mV；引诱剂 0-100
let rotDir=1, modeIdx=0;         // 0 自动 1 强制CCW 2 强制CW
let targetAngle=0, rotorAngle=0, pendingSteps=0, protonsDone=0;
let pTimer=0, dirTimer=1.2;
const STEP=2*Math.PI/26;         // ~26 步/圈（实测步进统计）
function rpsNow(){ return pmf*3; }             // 满Δp≈300 rps（E. coli 实测量级）
function cwProb(){ return modeIdx===1?0:modeIdx===2?1:0.45-0.4*(attract/100); }

function spawnProton(){
  for(let i=0;i<PN;i++){
    const p=pState[i];
    if(p.mode===0){
      p.mode=1; p.t=0; p.st=Math.floor(Math.random()*10);
      p.a0=rnd(0,6.28); return;
    }
  }
}
function updateProtons(dt){
  const visRate=clamp(26*Math.min(rpsNow(),3.5),0.6,95); // 画面每秒步数（高速时慢放）
  pTimer+=dt*visRate;
  while(pTimer>=1){ pTimer-=1; spawnProton(); }
  for(let i=0;i<PN;i++){
    const p=pState[i];
    if(p.mode===1){ // 周质空间螺旋逼近
      p.t+=dt/0.9;
      const f=Math.min(p.t,1), sa=p.st/10*Math.PI*2;
      const a=p.a0+(sa-p.a0)*f+Math.PI*2*f;
      const r=lerp(2.4,1.06,f);
      tmpM.makeScale(1,1,1).setPosition(Math.cos(a)*r,0.52+0.1*Math.sin(f*9),Math.sin(a)*r);
      pMesh.setMatrixAt(i,tmpM);
      if(p.t>=1){ p.mode=2; p.t=0; }
    }else if(p.mode===2){ // 过定子通道
      p.t+=dt/0.35;
      const sa=p.st/10*Math.PI*2;
      tmpM.makeScale(1,1,1).setPosition(Math.cos(sa)*0.98,lerp(0.42,-0.5,Math.min(p.t,1)),Math.sin(sa)*0.98);
      pMesh.setMatrixAt(i,tmpM);
      stators[p.st].material.emissiveIntensity=1.6;
      if(p.t>=1){ p.mode=0; pMesh.setMatrixAt(i,zeroM); pendingSteps++; protonsDone++; }
    }
  }
  pMesh.instanceMatrix.needsUpdate=true;
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'结构：杆+MS 环+C 环为转子，10 个 MotA/MotB 定子环绕（直径 ~45 nm）',en:'Rod + MS + C rings form the rotor; 10 MotA/MotB stators surround it (~45 nm)'},
 {zh:'质子动力势：H⁺ 顺电化学梯度（Δψ+ΔpH）穿过定子通道',en:'PMF: H⁺ flows down its electrochemical gradient through stator channels'},
 {zh:'步进：每颗质子把转子拧过 ~14°，约 26 步转一圈——比 ATP 合酶更直白的旋转马达',en:'Each proton twists the rotor ~14°; ~26 steps/rev — a motor more direct than ATP synthase'},
 {zh:'逆时针 = 鞭毛成束平滑游动；顺时针 = 束散开、菌体翻滚',en:'CCW = bundled smooth swimming; CW = bundle falls apart, cell tumbles'},
 {zh:'趋化：感受器→CheA→CheY-P；引诱剂降低 CheY-P → 顺时针概率下降',en:'Chemotaxis: receptor→CheA→CheY-P; attractant lowers CheY-P and CW bias'},
 {zh:'偏置随机游走：游多滚少，菌体沿浓度梯度净位移上坡',en:'Biased random walk: more run, less tumble — net drift up the gradient'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stRps').innerHTML=rpsNow().toFixed(0)+'<small> rps</small>';
  document.getElementById('stDir').textContent=rotDir>0?L('逆时针·游动','CCW·swim'):L('顺时针·翻滚','CW·tumble');
  document.getElementById('stCw').innerHTML=(cwProb()*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stFlux').innerHTML=(26*rpsNow()).toFixed(0)+'<small> H⁺/s</small>';
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  insetFrame.material.color.setHex(dark?0x161b22:0xdcd6cc); // 轨迹面板随主题
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}

/* ---- 交互 ---- */
function setPlaying(v){
  playing=v;
  document.getElementById('play').textContent=v?L('暂停','Pause'):L('运行','Run');
}
const MODES=[['换向：自动趋化','Switch: auto chemotaxis'],['换向：强制逆时针','Force CCW'],['换向：强制顺时针','Force CW']];
document.getElementById('btnMode').addEventListener('click',e=>{
  modeIdx=(modeIdx+1)%3;
  e.currentTarget.classList.toggle('on',modeIdx>0);
  e.currentTarget.textContent=L(MODES[modeIdx][0],MODES[modeIdx][1]);
});
document.getElementById('btnReset').addEventListener('click',()=>{
  cx2.fillStyle='rgba(8,10,14,1)'; cx2.fillRect(0,0,256,176); cvTex.needsUpdate=true;
  bx=128; by=88; bh=rnd(0,6.28);
});
document.getElementById('sPmf').addEventListener('input',e=>{
  pmf=+e.target.value;
  document.getElementById('sPmfVal').textContent=(pmf*1.7).toFixed(0)+' mV';
});
document.getElementById('sAtt').addEventListener('input',e=>{
  attract=+e.target.value; document.getElementById('sAttVal').textContent=attract;
});
document.getElementById('play').addEventListener('click',()=>setPlaying(!playing));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();document.getElementById('btnMode').textContent=L(MODES[modeIdx][0],MODES[modeIdx][1]);});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
let simT=0;
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    /* 自动模式下按 CW 概率随机换向 */
    if(modeIdx===0){
      dirTimer-=dt;
      if(dirTimer<=0){
        rotDir=Math.random()<cwProb()?-1:1;
        dirTimer=rnd(0.9,2.4);
      }
    }else rotDir=modeIdx===1?1:-1;
    updateProtons(dt);
    /* 步进→角度（限速，防止高速时闪烁） */
    targetAngle+=pendingSteps*STEP*rotDir; pendingSteps=0;
    const maxV=2*Math.PI*Math.min(rpsNow(),3.5)*dt;
    const dAng=clamp(targetAngle-rotorAngle,-maxV,maxV);
    rotorAngle+=dAng;
    rotorG.rotation.y=rotorAngle;
    updateInset(dt);
  }
  for(const s of stators) s.material.emissiveIntensity*=Math.max(0,1-6*dt);
  acc+=dt; if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis(); if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数 & 启动 ---- */
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
const qsPmf=parseFloat(qs.get('pmf'));
if(Number.isFinite(qsPmf)){pmf=clamp(qsPmf,0,100);document.getElementById('sPmf').value=pmf;document.getElementById('sPmfVal').textContent=(pmf*1.7).toFixed(0)+' mV';}
const qsAtt=parseFloat(qs.get('speed'));
if(Number.isFinite(qsAtt)){attract=clamp(qsAtt,0,100);document.getElementById('sAtt').value=attract;document.getElementById('sAttVal').textContent=attract.toFixed(0);}
cx2.fillStyle='rgba(8,10,14,1)'; cx2.fillRect(0,0,256,176);
applyTheme(); applyLang();
if(qs.get('pause')==='1') setPlaying(false);
start();
</script>
