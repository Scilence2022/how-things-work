{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 比例：1 世界单位 = 10 mm（钟表轮系量级） */
const MM = 10;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const R2D = 180/Math.PI;
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x101418,30,80);
const camera = new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0,2.5,17);
const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=70;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key = new THREE.DirectionalLight(0xfff2dd,0.9); key.position.set(6,10,9); scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-8,4,-6); scene.add(fill);

/* ---- 参数 ---- */
const Z1=7, Z2=14, R1=1.6, R2=1.6*Z2/Z1;          // 摆线副：钟表小轮 7 齿
const ZI1=12, ZI2=24, MI=2*R1/ZI1, RI1=MI*ZI1/2, RI2=MI*ZI2/2; // 渐开线副：12/24 齿
let rcK = 0.35;                                     // 滚圆半径比 rc/R
let err = 0;                                        // 中心距误差（世界单位）
const ERR_JAM = 0.05;                               // 超过 0.5 mm 即卡死
const O1c=new THREE.Vector2(-8.1,0), O1i=new THREE.Vector2(3.1,0);
const OC2 = R1+R2;                                  // 理想中心距（两副相同）

/* ---- 材质 ---- */
const groundM = new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
function pairMats(main,emiss){
  return {
    g1:new THREE.MeshStandardMaterial({color:main,roughness:0.35,metalness:0.6}),
    g2:new THREE.MeshStandardMaterial({color:main,roughness:0.35,metalness:0.6}),
    hub:new THREE.MeshStandardMaterial({color:0x3d4654,roughness:0.5,metalness:0.55}),
    emiss:new THREE.MeshStandardMaterial({color:emiss,emissive:emiss,emissiveIntensity:0.25,roughness:0.4}),
    list:[]
  };
}
const mC = pairMats(0xd9730d,0xffa94d);   // 摆线副（橙）
const mI = pairMats(0x4a7fa5,0x74c0fc);   // 渐开线副（蓝）
[mC,mI].forEach(m=>m.list=[m.g1,m.g2,m.hub,m.emiss]);
const dotM  = new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xffa000,emissiveIntensity:0.9});
const dotM2 = new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.9});
const pathM = new THREE.LineDashedMaterial({color:0x74e0d0,dashSize:0.14,gapSize:0.1,transparent:true,opacity:0.75});
const arcM  = new THREE.LineBasicMaterial({color:0x74e0d0,transparent:true,opacity:0.95});
const pitchM= new THREE.LineDashedMaterial({color:0x888888,dashSize:0.12,gapSize:0.12,transparent:true,opacity:0.5});
const trailM= new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.95});
const genM  = new THREE.MeshStandardMaterial({color:0x5f6f80,roughness:0.4,metalness:0.5});
const penM  = new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xffa000,emissiveIntensity:0.8});

/* ---- 摆线齿形 ----
   外摆线 E(t)=（R+rc)v(t) − rc·v(k1 t)，内摆线 H(t)=（R−rc)v(t)+rc·v(−k2 t)
   共轭条件：两轮用同一滚圆 rc，接触点必在过节点的滚圆弧上 */
function cycloidGearGeo(R,rc,z,add,ded){
  const k1=(R+rc)/rc, k2=(R-rc)/rc;
  const E=t=>new THREE.Vector2((R+rc)*Math.cos(t)-rc*Math.cos(k1*t),(R+rc)*Math.sin(t)-rc*Math.sin(k1*t));
  const H=t=>new THREE.Vector2((R-rc)*Math.cos(t)+rc*Math.cos(k2*t),(R-rc)*Math.sin(t)-rc*Math.sin(k2*t));
  const bis=(f,hi)=>{let a=0,b=hi;for(let i=0;i<48;i++){const m=(a+b)/2;(f(m)<0)?a=m:b=m;}return (a+b)/2;};
  const tT=bis(t=>E(t).length()-(R+add), Math.PI/k1);
  const tD=bis(t=>(R-ded)-H(t).length(), Math.PI/k2);
  const aDed=Math.atan2(H(tD).y,H(tD).x), aTip=Math.atan2(E(tT).y,E(tT).x);
  const pts=[];
  const push=(v,rot)=>{ if(rot) v=v.clone().rotateAround(new THREE.Vector2(0,0),rot); pts.push(v); };
  for(let k=0;k<z;k++){
    const rot=k*2*Math.PI/z;
    for(let i=0;i<=10;i++){const t=tD+(0-tD)*i/10; push(H(-t),rot);}          // −侧齿根（内摆线）
    for(let i=1;i<=10;i++){const t=tT*i/10; push(E(-t),rot);}                 // −侧齿顶（外摆线）
    for(let i=1;i<=6;i++){const a=-aTip+2*aTip*i/6;
      push(new THREE.Vector2((R+add)*Math.cos(a),(R+add)*Math.sin(a)),rot);}  // 齿顶圆弧
    for(let i=9;i>=0;i--){const t=tT*i/10; push(E(t),rot);}                   // +侧齿顶
    for(let i=1;i<=10;i++){const t=tD*i/10; push(H(t),rot);}                  // +侧齿根
    for(let i=1;i<=8;i++){const a=aDed+(2*Math.PI/z-2*aDed)*i/8;
      push(new THREE.Vector2((R-ded)*Math.cos(a),(R-ded)*Math.sin(a)),rot);}  // 齿根圆弧
  }
  const sh=new THREE.Shape();
  pts.forEach((p,i)=>i?sh.lineTo(p.x,p.y):sh.moveTo(p.x,p.y));
  sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:0.35,bevelEnabled:false});
  geo.translate(0,0,-0.175);
  return geo;
}
/* ---- 渐开线齿形（与全站渐开线齿轮页同款做法） ---- */
function involuteGearGeo(z,m){
  const rp=m*z/2, rb=rp*Math.cos(20*Math.PI/180), rt=rp+m, rr=rp-1.25*m;
  const half=Math.PI/(2*z), invA=Math.tan(20*Math.PI/180)-20*Math.PI/180;
  const inv=t=>t-Math.atan(t);
  const tOf=r=>Math.sqrt(Math.max(0,r*r/(rb*rb)-1));
  const t0=tOf(Math.max(rr,rb*1.001)), t1=tOf(rt);
  const pts=[];
  const flank=(g,sgn,rev)=>{
    for(let j=0;j<=8;j++){const i=rev?8-j:j, t=t0+(t1-t0)*i/8;
      const ang=g+sgn*(half+invA-inv(t)); const r=rb*Math.sqrt(1+t*t);
      pts.push(new THREE.Vector2(r*Math.cos(ang),r*Math.sin(ang)));}
  };
  for(let k=0;k<z;k++){
    const g=k*2*Math.PI/z, dTip=half+invA-inv(t1), dRoot=half+invA-inv(t0);
    flank(g,-1,false);
    for(let i=1;i<5;i++){const a=g-dTip+2*dTip*i/5; pts.push(new THREE.Vector2(rt*Math.cos(a),rt*Math.sin(a)));}
    flank(g,1,true);
    for(let i=1;i<6;i++){const a=g+dRoot+(g+2*Math.PI/z-dRoot-g-dRoot)*i/6;
      pts.push(new THREE.Vector2(rr*Math.cos(a),rr*Math.sin(a)));}
  }
  const sh=new THREE.Shape();
  pts.forEach((p,i)=>i?sh.lineTo(p.x,p.y):sh.moveTo(p.x,p.y));
  sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:0.35,bevelEnabled:false});
  geo.translate(0,0,-0.175);
  return geo;
}

/* ---- 场景搭建 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(46,0.3,14),groundM);
ground.position.set(0,-4.4,0); scene.add(ground);

function buildGear(geo,mat,O){
  const g=new THREE.Group();
  const mesh=new THREE.Mesh(geo,mat.g1); g.add(mesh);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.7,14),mat.hub);
  hub.rotation.x=Math.PI/2; g.add(hub);
  g.position.set(O.x,O.y,0); scene.add(g);
  return {group:g,mesh,mat};
}
/* 摆线副（左） */
let addC=0.72*rcK*R1, dedC=0.78*rcK*R1, rc=rcK*R1;
const gearC1=buildGear(cycloidGearGeo(R1,rc,Z1,addC,dedC),mC,O1c);
const gearC2=buildGear(cycloidGearGeo(R2,rc,Z2,0.72*rcK*R2,0.78*rcK*R2),mC,new THREE.Vector2(O1c.x+OC2,0));
/* 渐开线副（右） */
const gearI1=buildGear(involuteGearGeo(ZI1,MI),mI,O1i);
const gearI2=buildGear(involuteGearGeo(ZI2,MI),mI,new THREE.Vector2(O1i.x+OC2,0));

/* 节圆（虚线参考） */
function pitchCircle(R,O,mat){
  const p=[]; for(let i=0;i<=80;i++){const a=i/80*2*Math.PI; p.push(new THREE.Vector3(O.x+R*Math.cos(a),O.y+R*Math.sin(a),-0.2));}
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),mat);
  l.computeLineDistances(); scene.add(l); return l;
}
pitchCircle(R1,O1c,pitchM); pitchCircle(R2,new THREE.Vector2(O1c.x+OC2,0),pitchM);

/* 接触轨迹：两条描述圆（过节点、半径 rc 的滚圆弧）+ 亮弧 + 接触点 */
const descA=new THREE.Group(), descB=new THREE.Group(); scene.add(descA,descB);
let arcLine=null;
const contactDot=new THREE.Mesh(new THREE.SphereGeometry(0.12,14,12),dotM); scene.add(contactDot);
function circPts(cx,cy,r,n){ const p=[]; for(let i=0;i<=n;i++){const a=i/n*2*Math.PI;
  p.push(new THREE.Vector3(cx+r*Math.cos(a),cy+r*Math.sin(a),-0.21));} return p; }
function rebuildContactPath(){
  descA.clear(); descB.clear();
  const ca=new THREE.Line(new THREE.BufferGeometry().setFromPoints(circPts(O1c.x+R1+rc,0,rc,72)),pathM);
  ca.computeLineDistances(); descA.add(ca);
  const cb=new THREE.Line(new THREE.BufferGeometry().setFromPoints(circPts(O1c.x+R1-rc,0,rc,72)),pathM);
  cb.computeLineDistances(); descB.add(cb);
  /* 亮弧：C_A 上从节点到小轮齿顶圆的弧段 + C_B 上从大轮齿顶圆到节点的弧段 */
  const angA=Math.acos(clamp(((R1+rc)*(R1+rc)+rc*rc-(R1+addC)*(R1+addC))/(2*(R1+rc)*rc),-1,1));
  const angB=Math.acos(clamp(((R2+rc)*(R2+rc)+rc*rc-(R2+0.72*rcK*R2)*(R2+0.72*rcK*R2))/(2*(R2+rc)*rc),-1,1));
  const ptsA=[],ptsB=[];
  for(let i=0;i<=24;i++){const a=Math.PI-angA*i/24;
    ptsA.push(new THREE.Vector3(O1c.x+R1+rc+rc*Math.cos(a),rc*Math.sin(a),-0.22));}
  for(let i=0;i<=24;i++){const a=angB*(1-i/24);
    ptsB.push(new THREE.Vector3(O1c.x+R1-rc+rc*Math.cos(a),rc*Math.sin(a),-0.22));}
  if(arcLine){scene.remove(arcLine); arcLine.geometry.dispose();}
  arcLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([...ptsB,...ptsA]),arcM);
  scene.add(arcLine);
}
rebuildContactPath();

/* ---- 生成台（后上方）：滚圆沿基圆滚动，笔尖画摆线 ---- */
const gen=new THREE.Group(); gen.position.set(0,4.9,-3); scene.add(gen);
const RG=1.35, rcG=()=>rcK*RG;
const baseRing=new THREE.Mesh(new THREE.RingGeometry(RG-0.05,RG,64),genM); gen.add(baseRing);
const roller=new THREE.Group(); gen.add(roller);
const rollerRing=new THREE.Mesh(new THREE.RingGeometry(rcG()-0.04,rcG(),48),penM.clone()); roller.add(rollerRing);
const spoke=new THREE.Mesh(new THREE.BoxGeometry(rcG(),0.04,0.02),penM); spoke.position.x=rcG()/2; roller.add(spoke);
const pen=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),penM); gen.add(pen);
/* 轨迹线（外摆线/内摆线，一段一段循环画） */
const TRMAX=260;
const trailGeo=new THREE.BufferGeometry();
trailGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(TRMAX*3),3));
trailGeo.setDrawRange(0,0);
const trail=new THREE.Line(trailGeo,trailM); gen.add(trail);
let genMode=0; // 0 外摆线 1 内摆线
let genT=0, genN=0;
function genPoint(t){
  const r=rcG(), k1=(RG+r)/r, k2=(RG-r)/r;
  if(genMode===0) return new THREE.Vector3((RG+r)*Math.cos(t)-r*Math.cos(k1*t),(RG+r)*Math.sin(t)-r*Math.sin(k1*t),0.15);
  return new THREE.Vector3((RG-r)*Math.cos(t)+r*Math.cos(k2*t),(RG-r)*Math.sin(t)-r*Math.sin(k2*t),0.15);
}
function stepGen(dt){
  const r=rcG(), k1=(RG+r)/r, k2=(RG-r)/r;
  const tEnd=genMode===0?Math.PI/k1:Math.PI/k2;   // 画到摆线最高点，一段完整的齿顶/齿根弧
  genT+=dt*0.9;
  if(genT>tEnd+0.8){ genT=0; genN=0; trailGeo.setDrawRange(0,0); }
  if(genT<=tEnd){
    const p=genPoint(genT); pen.position.copy(p);
    roller.position.set((genMode===0?(RG+r):(RG-r))*Math.cos(genT),(genMode===0?(RG+r):(RG-r))*Math.sin(genT),0);
    roller.rotation.z=genMode===0?(Math.PI-k1*genT):(-k2*genT);
    const arr=trailGeo.attributes.position.array;
    if(genN<TRMAX){ arr[genN*3]=p.x; arr[genN*3+1]=p.y; arr[genN*3+2]=p.z; genN++; trailGeo.setDrawRange(0,genN);
      trailGeo.attributes.position.needsUpdate=true; }
  }
}
function rebuildRoller(){
  roller.clear();
  const rr=rcG();
  const ring=new THREE.Mesh(new THREE.RingGeometry(rr-0.04,rr,48),penM.clone()); roller.add(ring);
  const sp=new THREE.Mesh(new THREE.BoxGeometry(rr,0.04,0.02),penM); sp.position.x=rr/2; roller.add(sp);
}

/* ---- 标签 ---- */
const labelReg=[];
let focusMode=0; // 0 双方 1 仅摆线 2 仅渐开线
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L(`钟表小轮 ${Z1} 齿`,'Clock pinion, 7 teeth'),new THREE.Vector3(0,2.2,0.3),'o',
  ()=>focusMode!==2,gearC1.group);
addLabel(()=>L(`大轮 ${Z2} 齿`,'Wheel, 14 teeth'),new THREE.Vector3(0.6,R2+0.8,0.3),'o',
  ()=>focusMode!==2,gearC2.group);
addLabel(()=>L('接触点沿滚圆弧滑移','Contact slides along the roller arc'),new THREE.Vector3(0,1.5,0),'g',
  ()=>focusMode!==2&&err<=ERR_JAM);
addLabel(()=>L('描述圆 = 接触轨迹','Describing circles = path of contact'),new THREE.Vector3(-0.4,-R1-1.0,0),'b',
  ()=>focusMode!==2&&err<=ERR_JAM);
addLabel(()=>L(`渐开线 ${ZI1} 齿（不根切下限）`,`Involute ${ZI1} teeth (no-undercut min)`),new THREE.Vector3(0,2.2,0.3),'b',
  ()=>focusMode!==1,gearI1.group);
addLabel(()=>L(`渐开线 ${ZI2} 齿`,`Involute ${ZI2} teeth`),new THREE.Vector3(0,R2+0.8,0.3),'b',
  ()=>focusMode!==1,gearI2.group);
addLabel(()=>L('渐开线：中心距敏感度低（可分性）','Involute: insensitive to center distance'),new THREE.Vector3(0.4,-R1-1.0,0),'b',
  ()=>focusMode!==1&&err>0.02);
const jamLabel=addLabel(()=>L('✕ 卡死：接触脱离滚圆弧','✕ JAMMED: contact left the roller arc'),new THREE.Vector3(O1c.x+OC2/2,3.4,0),'r',
  ()=>err>ERR_JAM&&focusMode!==2);
addLabel(()=>L('滚圆沿节圆外/内滚动','Roller rolling outside/inside'),new THREE.Vector3(0,RG+1.1,0),'g',()=>true,gen);
addLabel(()=>L('外摆线→齿顶 / 内摆线→齿根','Epicycloid→tip / hypocycloid→root'),new THREE.Vector3(0,-RG-0.8,0),'o',()=>true,gen);

/* ---- 状态 ---- */
let playing=true, theta=0, rpm=22, labelsOn=true, simT=0;
const BETA2=Math.PI-Math.PI/Z2, BETAI2=Math.PI-Math.PI/ZI2;

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'滚圆沿节圆外侧滚动，笔尖画出外摆线——这就是齿顶的廓线',
   en:'A roller rolls outside the pitch circle; the pen traces the epicycloid — the tooth tip flank', do:()=>{genMode=0;genT=0;genN=0;trailGeo.setDrawRange(0,0);setFocus(0);}},
  {zh:'沿节圆内侧滚出内摆线——齿根的廓线；两段拼成一颗齿',
   en:'Inside the pitch circle it traces the hypocycloid — the root flank; both form one tooth', do:()=>{genMode=1;genT=0;genN=0;trailGeo.setDrawRange(0,0);}},
  {zh:'两轮共用同一滚圆即共轭：接触点沿两段描述圆弧连续滑移（亮线）',
   en:'Sharing one roller makes the pair conjugate: contact slides along the two bright arcs', do:()=>{genMode=0;setErr(0);}},
  {zh:'凸-凹接触、当量曲率半径大：接触应力小，钟表敢用 6–7 齿小轮',
   en:'Convex-on-concave contact lowers stress — clocks dare use 6–7 tooth pinions', do:()=>{setRc(0.25);setErr(0);}},
  {zh:'代价：中心距敏感——拖歪 0.5 mm 接触就脱离滚圆弧，直接卡死',
   en:'The price: center distance is critical — 0.5 mm off and the mesh jams', do:()=>{setErr(0.18);}},
  {zh:'渐开线对照：中心距变了照转（可分性），只是齿隙变大',
   en:'Involute contrast: it keeps turning with shifted centers (separability), just more backlash', do:()=>{setErr(0.18);setFocus(2);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i; syncSteps(); STEPS[i].do();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 参数应用 ---- */
function setRc(k){
  rcK=clamp(k,0.2,0.45);
  addC=0.72*rcK*R1; const dedC2=0.78*rcK*R1; rc=rcK*R1;
  gearC1.mesh.geometry.dispose(); gearC1.mesh.geometry=cycloidGearGeo(R1,rc,Z1,addC,dedC2);
  gearC2.mesh.geometry.dispose(); gearC2.mesh.geometry=cycloidGearGeo(R2,rc,Z2,0.72*rcK*R2,0.78*rcK*R2);
  rebuildContactPath(); rebuildRoller();
  document.getElementById('sRcVal').textContent=rcK.toFixed(2)+' R';
}
function setErr(v){
  err=clamp(v,0,0.35);
  gearC2.group.position.x=O1c.x+OC2+err;
  gearI2.group.position.x=O1i.x+OC2+err;
  document.getElementById('sErrVal').textContent=(err*MM).toFixed(1)+' mm';
}
function setFocus(f){
  focusMode=f%3;
  const set=(m,on)=>m.list.forEach(mm=>{mm.transparent=!on;mm.opacity=on?1:0.13;mm.needsUpdate=true;});
  set(mC,focusMode!==2); set(mI,focusMode!==1);
  document.getElementById('btnFocus').textContent=
    focusMode===0?L('对照：双方','Compare: both'):focusMode===1?L('对照：仅摆线','Cycloid only'):L('对照：仅渐开线','Involute only');
}

/* ---- 统计 ---- */
function updateStats(){
  document.getElementById('stRc').innerHTML=rcK.toFixed(2);
  document.getElementById('stErr').innerHTML=(err*MM).toFixed(1)+'<small> mm</small>';
  document.getElementById('stRatio').innerHTML='1 : '+(Z2/Z1).toFixed(0);
  const jam=err>ERR_JAM;
  const el=document.getElementById('stState');
  el.innerHTML=jam?'<small>✕ 卡死</small>':'<small>啮合中</small>';
  el.style.color=jam?'#ff8787':'';
}

/* ---- UI ---- */
document.getElementById('sRc').addEventListener('input',e=>setRc(+e.target.value/100));
document.getElementById('sErr').addEventListener('input',e=>setErr(+e.target.value/100));
document.getElementById('sSpd').addEventListener('input',e=>{rpm=+e.target.value;
  document.getElementById('sSpdVal').textContent=rpm+' rpm';});
document.getElementById('btnFocus').addEventListener('click',()=>setFocus(focusMode+1));
document.getElementById('btnZero').addEventListener('click',()=>{setErr(0);
  document.getElementById('sErr').value=0;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh'; localStorage.setItem('htw-lang',LANG); applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark'; localStorage.setItem('htw-theme',THEME); applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  const jam=err>ERR_JAM;
  if(playing){
    if(!jam) theta+=rpm/60*2*Math.PI*dt;
    else theta+=0;                       // 卡死：停转（渲染时加抖动）
    stepGen(dt);
  }
  const jit=jam?0.012*Math.sin(simT*38):0;
  gearC1.group.rotation.z=theta+jit;
  gearC2.group.rotation.z=BETA2-(Z1/Z2)*(theta+jit);
  gearI1.group.rotation.z=theta*0.62;    // 两副齿数不同，各自按速比转
  gearI2.group.rotation.z=BETAI2-(ZI1/ZI2)*theta*0.62;
  /* 接触点：φ=(R1/rc)θ 折算到齿周期内；先 C_B（接近弧）后 C_A（退出弧） */
  const phi=((R1/rc)*theta+angB())%(  (R1/rc)*(2*Math.PI/Z1) );
  const psiA=Math.PI-Math.acos(clamp(((R1+rc)*(R1+rc)+rc*rc-(R1+addC)*(R1+addC))/(2*(R1+rc)*rc),-1,1));
  const psiB=Math.acos(clamp(((R2+rc)*(R2+rc)+rc*rc-(R2+0.72*rcK*R2)*(R2+0.72*rcK*R2))/(2*(R2+rc)*rc),-1,1));
  const span=psiB+ (Math.PI-psiA);
  if(jam){ contactDot.material=dotM2;
    contactDot.position.set(O1c.x+R1-rc+rc*Math.cos(psiB),rc*Math.sin(psiB),0.25);
  }else{
    contactDot.material=dotM;
    if(phi<psiB){ const a=psiB-phi;
      contactDot.position.set(O1c.x+R1-rc+rc*Math.cos(a),rc*Math.sin(a),0.25);
    }else if(phi<span){ const a=Math.PI-(phi-psiB);
      contactDot.position.set(O1c.x+R1+rc+rc*Math.cos(a),rc*Math.sin(a),0.25);
    }else contactDot.position.set(0,-50,0);      // 齿与齿之间的短暂无接触
  }
  acc+=dt; if(acc>0.1){acc=0; updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis(); if(r.o.visible) r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function angB(){ return Math.acos(clamp(((R2+rc)*(R2+rc)+rc*rc-(R2+0.72*rcK*R2)*(R2+0.72*rcK*R2))/(2*(R2+rc)*rc),-1,1)); }
function start(){if(raf===null){clock.getDelta(); raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf); raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数与初始化 ---- */
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1') playing=false;
if(qp.get('labels')==='0') labelsOn=false;
if(qp.get('speed')){ rpm=clamp(+qp.get('speed')||22,6,60); document.getElementById('sSpd').value=rpm;
  document.getElementById('sSpdVal').textContent=rpm+' rpm'; }
document.getElementById('tglLabels').checked=labelsOn;
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
document.getElementById('sRcVal').textContent=rcK.toFixed(2)+' R';
applyTheme(); applyLang(); buildSteps(); start();
</script>
</body>
</html>
