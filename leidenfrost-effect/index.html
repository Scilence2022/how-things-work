<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>莱顿弗罗斯特效应 · 被自己蒸气托起的水滴</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="莱顿弗罗斯特效应" data-en="The Leidenfrost Effect">莱顿弗罗斯特效应</h1>
  <div class="sub" data-zh="同一颗水滴三种命运：160 °C 溅干、220 °C 暴沸、280 °C 却被底部瞬间汽化的蒸汽垫托起，优雅游走几十秒；拖「温度偏移」看三区当场重新划分，液氮在常温桌面也是同一效应 · 拖动旋转 / 空格运行/暂停" data-en="One drop, three fates: 160 °C spits dry, 220 °C boils wild, yet 280 °C levitates it on an instant vapor cushion for tens of seconds; drag the offset to re-divide the three regimes live — liquid nitrogen on your desk is the same effect · drag to orbit / Space = run/pause">同一颗水滴三种命运：160 °C 溅干、220 °C 暴沸、280 °C 却被底部瞬间汽化的蒸汽垫托起，优雅游走几十秒；拖「温度偏移」看三区当场重新划分，液氮在常温桌面也是同一效应 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="中板温度" data-en="Middle plate">中板温度</span><span class="v" id="stMid">—</span>
  <span class="k" data-zh="当前沸腾区" data-en="Boiling regime">当前沸腾区</span><span class="v" id="stReg">—</span>
  <span class="k" data-zh="蒸汽垫厚度" data-en="Vapor layer">蒸汽垫厚度</span><span class="v" id="stVap">—</span>
  <span class="k" data-zh="280 板液滴寿命" data-en="Drop age">280 板液滴寿命</span><span class="v" id="stLife">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnLN2" data-zh="液氮模式" data-en="LN₂ mode">液氮模式</button>
    <button class="abtn" id="btnSec" data-zh="蒸汽垫剖面慢放" data-en="Cushion slow-mo">蒸汽垫剖面慢放</button>
    <button class="abtn" id="btnHill" data-zh="爬坡演示" data-en="Climb demo">爬坡演示</button>

    <label data-zh="温度偏移" data-en="Temp offset">温度偏移</label>

    <span class="val" id="sDTVal">+0 °C</span>
  </div>
  <div class="row">
    <label data-zh="液滴大小" data-en="Drop size">液滴大小</label>
    <input id="sSize" type="range" min="60" max="160" step="5" value="100">
    <span class="val" id="sSizeVal">1.0×</span>

    <button id="play" data-zh="运行" data-en="Run">运行</button>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>

    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../phase-transition/" data-zh="相变：潜热去哪了" data-en="Phase transition: latent heat">相变</a>
    <a href="../pressure-cooker/" data-zh="高压锅：沸点随压强" data-en="Pressure cooker: boiling vs pressure">高压锅</a>
    <a href="../rayleigh-benard/" data-zh="瑞利-伯纳德对流" data-en="Rayleigh-Bénard convection">瑞利-伯纳德对流</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const QS=new URLSearchParams(location.search);
let playing=true, labelsOn=true;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,22,70);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(-0.9,5.0,12.0);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-2.4,0.9,0); controls.enableDamping=true; controls.dampingFactor=0.08;   // 目标点左移：三板整体右移避开左下面板
controls.minDistance=3; controls.maxDistance=45;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(6,10,7); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-7,5,-6); scene.add(fill);

/* ---- 物理模型（沸腾谱）----
   水滴落在远超沸点的热面上：底部瞬间汽化成 0.1–0.3 mm 蒸汽垫，把液滴托起——
   隔热（传热骤降）+ 低摩擦（蒸气润滑），液滴能游走几十秒，甚至被"热端→冷端"的
   蒸气流拖向冷端。沸腾谱：核态沸腾（<~200 °C，气泡搅拌，散热最强）→
   过渡沸腾（200–250 °C，蒸气膜时立时崩，散热最差）→ Leidenfrost 点
   （水在抛光金属上约 250 °C，随表面状况 160–300 °C 浮动）→ 稳定膜态沸腾。
   液氮 bp 77 K（−196 °C）：常温桌面 20 °C 远高于它的 Leidenfrost 点——同一效应。 */
const BASE=[160,220,280];          // 三块板的基准温度
const PX=[-3.7,0,3.7];             // 工位 x（收窄，三板三滴整体落在面板右侧可见区）
const REGIME=['核态沸腾','过渡沸腾','膜态（Leidenfrost）'];
const REGIME_EN=['Nucleate','Transition','Film (Leidenfrost)'];
let dT=0, sizeK=1, ln2=false, section=false, hill=false;

/* ---- 台面与三块热板 ---- */
const benchM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const bench=new THREE.Mesh(new THREE.BoxGeometry(26,0.3,9),benchM);
bench.position.y=-0.15; scene.add(bench);
const plateTopM=[],plateBodyM=[];
const plates=[];
for(let i=0;i<3;i++){
  const g=new THREE.Group(); g.position.set(PX[i],0,0); scene.add(g);
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.5,2.5),new THREE.MeshStandardMaterial({color:0x39434f,roughness:0.6,metalness:0.4}));
  body.position.y=0.25; g.add(body);
  const topM=new THREE.MeshStandardMaterial({color:0x8a3a22,roughness:0.35,metalness:0.3,emissive:0xff5a1e,emissiveIntensity:0.2});
  const top=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.12,2.5),topM);
  top.position.y=0.56; g.add(top);
  plateTopM.push(topM); plateBodyM.push(body.material);
  plates.push(g);
}
/* ---- 温标条（100–400 °C 三区，实时划分）---- */
const posT=T=>clamp((T-100)/300*10.4-5.2,-5.4,5.4);   // 温标条与板距同步收窄
const zones=[[100,200,0x2e7d4f],[200,250,0xb08a2e],[250,400,0xa83a28]];
const zoneMeshes=zones.map(z=>{
  const w=(z[1]-z[0])/300*10.4;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w-0.08,0.09,0.6),
    new THREE.MeshStandardMaterial({color:z[2],roughness:0.5,transparent:true,opacity:0.85}));
  m.position.set((posT(z[0])+posT(z[1]))/2,0.35,-3.1); scene.add(m); return m;
});
const markers=[];
for(let i=0;i<3;i++){
  const mk=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.34,10),
    new THREE.MeshBasicMaterial({color:0xffd8a8}));
  mk.position.set(posT(BASE[i]),0.62,-3.1); scene.add(mk); markers.push(mk);
}

/* ---- 液滴（球压扁）与蒸气垫亮盘 ---- */
const dropGeo=new THREE.SphereGeometry(1,22,16);
const dropM=[];
const drops=[];
for(let i=0;i<3;i++){
  const m=new THREE.MeshStandardMaterial({color:0x9fd0f5,roughness:0.15,metalness:0.05,transparent:true,opacity:0.9});
  dropM.push(m);
  const mesh=new THREE.Mesh(dropGeo,m); scene.add(mesh);
  drops.push({mesh,r:0.42,h:0,x:0,z:0,vx:0,vz:0,age:0,dead:false,respawn:0});
}
const vapM=[];
const vaps=[];
for(let i=0;i<3;i++){
  const m=new THREE.MeshBasicMaterial({color:0xffe2b0,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false});
  const mesh=new THREE.Mesh(new THREE.CircleGeometry(0.55,26),m);
  mesh.rotation.x=-Math.PI/2; scene.add(mesh);
  vapM.push(m); vaps.push(mesh);
}
function resetDrop(i){
  const d=drops[i];
  d.r=0.42*sizeK; d.age=0; d.dead=false; d.h=0;
  d.x=PX[i]+(Math.random()-0.5)*0.6; d.z=(Math.random()-0.5)*0.8; d.vx=0; d.vz=0;
}
function regOf(i){
  if(i===2&&ln2) return 2;                       // 液氮在常温桌面：直接膜态
  const T=BASE[i]+dT;
  return T<200?0:T<250?1:2;
}
function tempOf(i){
  if(i===2&&ln2) return -196;
  return BASE[i]+dT;
}

/* ---- 蒸汽/雾粒子 ---- */
const NST=240, PST=80;
const stMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.07,7,6),
  new THREE.MeshBasicMaterial({color:0xe6eef4,transparent:true,opacity:0.45,depthWrite:false}),NST);
stMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(stMesh);
const stP=[];
for(let i=0;i<NST;i++) stP.push({life:0,span:1,x:0,y:0,z:0,vx:0,vy:0,vz:0});
{                                                // 预填零缩放矩阵（?pause=1 时不堆原点）
  const d0=new THREE.Object3D();
  for(let i=0;i<NST;i++){ d0.scale.setScalar(0); d0.updateMatrix(); stMesh.setMatrixAt(i,d0.matrix); }
  stMesh.instanceMatrix.needsUpdate=true;
}
function spawnSt(i,mode){                        // mode: 0 沸腾汽泡 1 溅射 2 膜态侧滑
  const slot=stP.find(p=>p.life<=0); if(!slot)return;
  const d=drops[i];
  slot.x=d.x+(Math.random()-0.5)*d.r*1.4; slot.z=d.z+(Math.random()-0.5)*d.r*1.2;
  slot.y=Math.max(0.68,d.h)+d.r*0.8;
  if(mode===0){ slot.vx=(Math.random()-0.5)*0.5; slot.vy=0.9+Math.random()*0.7; slot.vz=(Math.random()-0.5)*0.5; slot.span=0.9+Math.random()*0.6; }
  else if(mode===1){ const a=Math.random()*6.28; slot.vx=Math.cos(a)*(0.9+Math.random()); slot.vy=0.6+Math.random()*1.1; slot.vz=Math.sin(a)*(0.9+Math.random()); slot.span=0.4+Math.random()*0.3; }
  else{ slot.vx=(Math.random()<0.5?-1:1)*(0.5+Math.random()*0.5); slot.vy=0.25+Math.random()*0.2; slot.vz=(Math.random()-0.5)*0.4; slot.span=1.2+Math.random()*0.8; }
  if(i===2&&ln2){ slot.vy*=0.35; slot.vx*=1.6; slot.vz*=1.6; slot.span*=1.8; }  // 液氮雾沉、贴地漫流
  slot.life=slot.span;
}

/* ---- 剖面慢放（放大 20×：液滴-蒸汽垫-板面）---- */
const secG=new THREE.Group(); secG.position.set(0,3.4,2.6); secG.visible=false; scene.add(secG);
const secPlate=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.5,1.5),new THREE.MeshStandardMaterial({color:0xd45a1e,emissive:0xff5a1e,emissiveIntensity:0.35,roughness:0.4}));
secG.add(secPlate);
const secGap=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.16,1.1),new THREE.MeshBasicMaterial({color:0x9fe8ff,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false}));
secGap.position.y=0.33; secG.add(secGap);
const secDropM=new THREE.MeshStandardMaterial({color:0x9fd0f5,roughness:0.15,transparent:true,opacity:0.9});
const secDrop=new THREE.Mesh(new THREE.SphereGeometry(0.95,24,18),secDropM);
secDrop.scale.y=0.8; secG.add(secDrop);

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
const lbPlate=[];
for(let i=0;i<3;i++){
  const idx=i;
  lbPlate.push(addLabel(()=>{
    const T=tempOf(idx), r=regOf(idx);
    const tn=T<=-100?'−196 °C 液氮':Math.round(T)+' °C';
    const rn=LANG==='en'?REGIME_EN[r]:REGIME[r];
    return `${tn} · ${rn}`;
  },new THREE.Vector3(PX[i],2.35,0),i===1?'o':''));
}
addLabel(()=>L('核态沸腾','Nucleate'),new THREE.Vector3(posT(150),0.75,-3.1),'g');
addLabel(()=>L('过渡沸腾','Transition'),new THREE.Vector3(posT(225),0.75,-3.1),'o');
addLabel(()=>L('膜态 / Leidenfrost 点≈250 °C','Film / Leidenfrost ≈250 °C'),new THREE.Vector3(posT(325),0.75,-3.1),'r');
addLabel(()=>L('液氮（−196 °C）落在 20 °C 桌面：桌面对它就是「远超沸点」——同一效应',
  'LN₂ (−196 °C) on a 20 °C desk: the desk is "white-hot" to it — same effect'),
  new THREE.Vector3(PX[2],3.1,0),'b',()=>ln2);
addLabel(()=>L('蒸汽从热端涌向冷端，把液滴拖向冷端','Vapor flows hot→cold, dragging the drop to the cold end'),
  new THREE.Vector3(PX[2],2.8,0),'g',()=>hill&&!ln2);
addLabel(()=>L('慢放 ×20：蒸汽垫 0.1–0.3 mm——隔热 + 低摩擦','Slow-mo ×20: vapor cushion 0.1–0.3 mm — insulation + low friction'),
  new THREE.Vector3(0,5.2,2.6),'b',()=>section);

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'核态沸腾（<200 °C）：气泡在液滴里炸开搅动——散热最强，液滴反而死得快',en:'Nucleate (<200 °C): bubbles churn inside the drop — best cooling, quickest death'},
  {zh:'过渡沸腾（200–250 °C）：蒸气膜时立时崩——散热最差、液滴暴沸最狂躁',en:'Transition (200–250 °C): vapor film flickers — worst cooling, wildest boiling'},
  {zh:'Leidenfrost 点 ≈250 °C：底部瞬间汽化，液滴被自己的蒸气托起悬浮',en:'Leidenfrost point ≈250 °C: the base flashes to vapor — the drop lifts itself up'},
  {zh:'蒸汽垫 0.1–0.3 mm：隔热 + 低摩擦——液滴优雅游走几十秒',en:'Cushion 0.1–0.3 mm: insulated and near-frictionless — the drop glides for tens of seconds'},
  {zh:'爬向冷端：垫内蒸气从热端流向冷端，反冲把液滴拽过去',en:'Climbing: vapor flows hot→cold under the drop, dragging it along'},
  {zh:'液氮在常温桌面：−196 °C 遇 20 °C——桌面对它就是炽热板',en:'LN₂ on your desk: −196 °C meets 20 °C — the desk is a hot plate to it'},
  {zh:'工程里是敌人：淬火越过 Leidenfrost 点冷却骤慢，锅炉壁烧毁都在过渡区',en:'Enemy in engineering: quenching stalls past the Leidenfrost point; boiler tubes burn in transition'},
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;gotoStep(i);syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  if(i===0){dT=-60;ln2=false;hill=false;}
  else if(i===1){dT=-30;ln2=false;hill=false;}
  else if(i===2){dT=+20;ln2=false;hill=false;}
  else if(i===3){dT=+40;ln2=false;hill=false;}
  else if(i===4){dT=+40;ln2=false;hill=true;}
  else if(i===5){ln2=true;hill=false;section=false;}
  else{dT=-30;ln2=false;hill=false;}
  for(let k=0;k<3;k++)resetDrop(k);
  syncUI();
}

/* ---- 读数 ---- */
function updateStats(){
  const Tm=BASE[1]+dT, r=regOf(1);
  document.getElementById('stMid').innerHTML=Math.round(Tm)+'<small> °C</small>';
  document.getElementById('stReg').textContent=LANG==='en'?REGIME_EN[r]:REGIME[r];
  const film=regOf(1)===2;
  document.getElementById('stVap').innerHTML=film?Math.round(210+80*Math.sin(clock.elapsedTime*1.7))+'<small> µm</small>':'—';
  const d=drops[2];
  document.getElementById('stLife').innerHTML=(regOf(2)===2&&!d.dead?d.age.toFixed(0):'—')+'<small> s</small>';
}
function syncUI(){
  document.getElementById('sDTVal').textContent=(dT>=0?'+':'')+dT+' °C';
  document.getElementById('sSizeVal').textContent=sizeK.toFixed(1)+'×';
  document.getElementById('btnLN2').classList.toggle('on',ln2);
  document.getElementById('btnSec').classList.toggle('on',section);
  document.getElementById('btnHill').classList.toggle('on',hill);
  secG.visible=section;
}
document.getElementById('sDT').addEventListener('input',e=>{dT=+e.target.value;syncUI();});
document.getElementById('sSize').addEventListener('input',e=>{sizeK=+e.target.value/100;syncUI();});
document.getElementById('btnLN2').addEventListener('click',()=>{ln2=!ln2;syncUI();});
document.getElementById('btnSec').addEventListener('click',()=>{section=!section;syncUI();});
document.getElementById('btnHill').addEventListener('click',()=>{hill=!hill;syncUI();});
document.getElementById('btnReset').addEventListener('click',()=>{for(let k=0;k<3;k++)resetDrop(k);});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  benchM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); syncUI();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, statAcc=0;
const dummy=new THREE.Object3D();
const cCold=new THREE.Color(0x5a3a2e), cMid=new THREE.Color(0xb0431f), cHot=new THREE.Color(0xe8721e);
const _c=new THREE.Color();
function plateColor(T){                          // 板面颜色随温度
  if(T<=-100) return _c.setHex(0x7a828c);
  const u=clamp((T-100)/300,0,1);
  return u<0.5?_c.lerpColors(cCold,cMid,u*2):_c.lerpColors(cMid,cHot,(u-0.5)*2);
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    for(let i=0;i<3;i++){
      const d=drops[i], reg=regOf(i), bx=0.85;
      // 板面颜色与热度
      const T=tempOf(i);
      plateTopM[i].color.copy(plateColor(T));
      plateTopM[i].emissiveIntensity=T<=-100?0:clamp((T-100)/300,0,1)*0.55;
      markers[i].position.x=posT(T<=-100?100:T);
      if(d.dead){
        d.mesh.visible=false; vaps[i].visible=false;
        d.respawn-=dt; if(d.respawn<=0)resetDrop(i);
        continue;
      }
      d.age+=dt;
      if(reg===0){                               // 核态：贴面暴沸，快速蒸干
        d.h=0.66+d.r*0.75+Math.sin(clock.elapsedTime*22+i)*0.008;
        d.r-=dt*0.10;
        if(Math.random()<dt*9)spawnSt(i,0);
        if(Math.random()<dt*2){d.vx+=(Math.random()-0.5)*0.6;d.vz+=(Math.random()-0.5)*0.6;}
        if(d.r<0.1){                             // 溅干
          for(let k=0;k<12;k++)spawnSt(i,1);
          d.dead=true; d.respawn=1.4;
        }
      }else if(reg===1){                         // 过渡：狂躁暴沸，死得最快
        d.h=0.66+d.r*0.72+Math.abs(Math.sin(clock.elapsedTime*30+i))*0.03;
        d.r-=dt*0.15;
        if(Math.random()<dt*16)spawnSt(i,0);
        if(Math.random()<dt*3){d.vx+=(Math.random()-0.5)*1.6;d.vz+=(Math.random()-0.5)*1.6;}
        if(d.r<0.1){
          for(let k=0;k<16;k++)spawnSt(i,1);
          d.dead=true; d.respawn=1.1;
        }
      }else{                                     // 膜态：蒸汽垫托起，游走几十秒
        d.h=1.12+0.035*Math.sin(clock.elapsedTime*2.1+i*2);
        d.r-=dt*0.011;
        if(Math.random()<dt*3.2)spawnSt(i,2);
        d.vx+=(Math.random()-0.5)*0.5*dt*10; d.vz+=(Math.random()-0.5)*0.5*dt*10;
        if(hill&&i===2) d.vx+=dt*0.55;           // 热端→冷端蒸气流：向 +x（冷端）漂
        const sp=Math.hypot(d.vx,d.vz), mx=0.3;
        if(sp>mx){d.vx*=mx/sp;d.vz*=mx/sp;}
        if(Math.abs(d.x-PX[i])>bx){d.vx*=-1;}
        if(Math.abs(d.z)>0.72){d.vz*=-1;}
        d.x+=d.vx*dt; d.z+=d.vz*dt;
        if(d.r<0.12)resetDrop(i);
      }
      d.vx*=1-1.2*dt; d.vz*=1-1.2*dt;
      d.x=clamp(d.x,PX[i]-bx,PX[i]+bx); d.z=clamp(d.z,-0.72,0.72);
      d.mesh.visible=true;
      d.mesh.position.set(d.x,d.h,d.z);
      d.mesh.scale.set(d.r,d.r*0.8,d.r);
      const film=reg===2;
      vaps[i].visible=film;
      if(film){
        vaps[i].position.set(d.x,0.625,d.z);
        vapM[i].opacity=0.3+0.25*Math.sin(clock.elapsedTime*3+i);
        const s=d.r*1.5; vaps[i].scale.setScalar(s/0.55);
      }
      dropM[i].color.setHex(ln2&&i===2?0xcfe8ff:0x9fd0f5);
    }
    // 蒸汽粒子
    for(let i=0;i<NST;i++){
      const p=stP[i];
      if(p.life>0){
        p.life-=dt;
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
        p.vy-=0.15*dt; p.vx*=1-0.4*dt; p.vz*=1-0.4*dt;
        dummy.position.set(p.x,p.y,p.z);
        dummy.scale.setScalar(clamp(p.life/p.span,0,1)*1.1+0.05);
      }else{ dummy.position.set(0,-5,0); dummy.scale.setScalar(0); }
      dummy.updateMatrix(); stMesh.setMatrixAt(i,dummy.matrix);
    }
    stMesh.instanceMatrix.needsUpdate=true;
  }
  // 剖面慢放：厚度 0.1–0.3 mm 的视觉振荡（慢）
  if(section){
    const gap=0.2+0.09*Math.sin(clock.elapsedTime*0.9);
    secGap.scale.y=gap/0.16;
    secDrop.position.y=0.4+gap+0.75;
    secDrop.rotation.y+=dt*0.2;
  }
  statAcc+=dt; if(statAcc>0.1){statAcc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
if(QS.get('pause')==='1')playing=false;
if(QS.get('labels')==='0')labelsOn=false;
const qSpd=QS.get('speed'); if(qSpd){/* 本页无速度滑块：参数保留兼容 */}
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
document.getElementById('tglLabels').checked=labelsOn;
for(let k=0;k<3;k++)resetDrop(k);
syncUI();
applyTheme(); applyLang(); buildSteps(); updateStats(); start();
</script>
</body>
</html>
