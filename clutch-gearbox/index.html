<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离合器与手动变速箱 · 半联动起步与换挡</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#f06595;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c2255c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.e { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.w { border-color: rgba(255,224,102,.9); color: #ffe9a8; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.e { border-color: rgba(25,113,194,.9); color: #1971c2; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: #ff8787; }
  #stats .v.g { color: #38d9a9; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 388px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #gearRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .gbtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 6px 8px; text-align: center; font-size: 13px; font-weight: 700;
    transition: border-color .15s, color .15s, background .15s; }
  .gbtn:hover { border-color: var(--acc); }
  .gbtn.on { border-color: var(--acc); color: var(--text); background: rgba(240,101,149,.14); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(240,101,149,.10); border-color: rgba(240,101,149,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(194,37,92,.08); border-color: rgba(194,37,92,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #fcc2d7; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="离合器与手动变速箱：半联动起步与换挡" data-en="Clutch & Gearbox: biting point and shifting">离合器与手动变速箱：半联动起步与换挡</h1>
  <div class="sub" data-zh="半联动:摩擦片带滑差传递扭矩,车慢慢起步;换挡先分离、同步器磨齐转速再咬合;P=扭矩×转速,升扭必降转 · 空格播放/暂停" data-en="Half-clutch: the plates slip to pass torque smoothly; shifting = disengage, sync, engage; P = torque × speed, so more torque means fewer rpm · Space = play/pause">半联动:摩擦片带滑差传递扭矩,车慢慢起步;换挡先分离、同步器磨齐转速再咬合;P=扭矩×转速,升扭必降转 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="发动机转速" data-en="engine rpm">发动机转速</span><span class="v e" id="stE">—</span>
  <span class="k" data-zh="离合器滑差" data-en="clutch slip">离合器滑差</span><span class="v hot" id="stSlip">—</span>
  <span class="k" data-zh="车轮转速" data-en="wheel rpm">车轮转速</span><span class="v" id="stW">—</span>
  <span class="k" data-zh="扭矩倍数" data-en="torque ×">扭矩倍数</span><span class="v g" id="stT">—</span>
</div>

<div id="panel">
  <div id="gearRow">
    <button class="gbtn" id="g1" data-zh="1 挡(起步)" data-en="1st (launch)">1 挡(起步)</button>
    <button class="gbtn on" id="g2" data-zh="2 挡(巡航)" data-en="2nd (cruise)">2 挡(巡航)</button>
  </div>
  <div class="row"><label data-zh="油门" data-en="throttle">油门</label><input id="thr" type="range" min="5" max="100" step="5" value="60"><span class="val" id="thrVal">60%</span></div>
  <div class="row"><label data-zh="离合器踏板" data-en="clutch pedal">离合器踏板</label><input id="clu" type="range" min="0" max="100" step="2" value="0"><span class="val" id="cluVal">全接合</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../universal-joint/" data-zh="下游:万向节拐弯" data-en="downstream: the universal joint">下游:万向节拐弯</a>
    <a href="../differential/" data-zh="下游:差速器分左右" data-en="downstream: the differential">下游:差速器分左右</a>
    <a href="../four-stroke-engine/" data-zh="上游:四冲程发动机" data-en="upstream: the four-stroke engine">上游:四冲程发动机</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.frame.color.set(THEME === 'light' ? 0x9aa4b2 : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('离合器与手动变速箱', 'Clutch & Gearbox');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  syncGearBtns();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.2, 4.4, 8.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.6, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  frame: mat(0x39424f, { roughness: 0.7 }),
  engine: mat(0x74c0fc, { metalness: 0.5, roughness: 0.4 }),
  flywheel: mat(0x8a93a3, { metalness: 0.7, roughness: 0.3 }),
  clutch1: mat(0xff8787, { metalness: 0.4, roughness: 0.55 }),
  clutch2: mat(0xffd166, { metalness: 0.4, roughness: 0.55 }),
  gear: mat(0x63e6be, { metalness: 0.6, roughness: 0.3 }),
  shaft: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  wheel: mat(0x2c3340, { roughness: 0.7 }),
  rim: mat(0x8a93a3, { metalness: 0.6, roughness: 0.4 }),
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  slip: new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.0, depthWrite: false }),
};

/* ================= 场景:发动机 → 离合器 → 变速箱 → 车轮 ================= */
const floorSlab = new THREE.Mesh(new THREE.BoxGeometry(12, 0.2, 5), M.floor);
floorSlab.position.y = -0.1;
scene.add(floorSlab);
/* 发动机(缸体+飞轮) */
const engineGrp = new THREE.Group();
engineGrp.position.set(-3.4, 1.5, 0);
scene.add(engineGrp);
const block = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 1.2), M.engine);
block.position.y = 0.35;
engineGrp.add(block);
const flywheel = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.12, 32), M.flywheel);
flywheel.rotation.z = Math.PI / 2;
flywheel.position.x = 0.72;
engineGrp.add(flywheel);
const fwMark = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.5, 0.1), M.frame);
fwMark.position.x = 0.74;
engineGrp.add(fwMark);
/* 离合器:两片摩擦盘(间隙随踏板) */
const clutchIn = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.07, 32), M.clutch1);
clutchIn.rotation.z = Math.PI / 2;
clutchIn.position.x = 1.15;
engineGrp.add(clutchIn);
const clutchOut = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.07, 32), M.clutch2);
clutchOut.rotation.z = Math.PI / 2;
clutchOut.position.x = 1.15;
scene.add(clutchOut);
const slipHalo = new THREE.Mesh(new THREE.TorusGeometry(0.44, 0.05, 8, 40), M.slip);
slipHalo.rotation.y = Math.PI / 2;
slipHalo.position.x = 1.15;
scene.add(slipHalo);
/* 变速箱:输入轴/输出轴 + 两对齿轮 */
const boxGrp = new THREE.Group();
boxGrp.position.set(1.4, 1.5, 0);
scene.add(boxGrp);
const inShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.4, 12), M.shaft);
inShaft.rotation.z = Math.PI / 2;
inShaft.position.x = -0.4;
boxGrp.add(inShaft);
const outShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.4, 12), M.shaft);
outShaft.rotation.z = Math.PI / 2;
outShaft.position.x = 0.2;
boxGrp.add(outShaft);
function gearPair(y, rIn, rOut, on) {
  const g = new THREE.Group();
  const gi = new THREE.Mesh(new THREE.CylinderGeometry(rIn, rIn, 0.12, 28), M.gear);
  gi.rotation.z = Math.PI / 2;
  gi.position.set(-0.4, 0, 0);
  g.add(gi);
  const go = new THREE.Mesh(new THREE.CylinderGeometry(rOut, rOut, 0.12, 36), M.gear);
  go.rotation.z = Math.PI / 2;
  go.position.set(0.2, 0, 0);
  g.add(go);
  g.position.y = y;
  g.visible = on;
  boxGrp.add(g);
  return { g, gi, go };
}
const pair1 = gearPair(-0.4, 0.22, 0.5, true);    // 1 挡:大减速
const pair2 = gearPair(0.35, 0.34, 0.38, false);  // 2 挡:小减速
/* 换挡拨叉(示意) */
const fork = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.5, 0.5), M.frame);
fork.position.set(0.45, 0, 0);
boxGrp.add(fork);
/* 车轮 */
const wheelGrp = new THREE.Group();
wheelGrp.position.set(4.3, 0.75, 0);
scene.add(wheelGrp);
const tire = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.22, 14, 40), M.wheel);
wheelGrp.add(tire);
const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.2, 28), M.rim);
rim.rotation.z = Math.PI / 2;
wheelGrp.add(rim);
const wMark = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.08), M.frame);
wheelGrp.add(wMark);
/* 传动轴 */
const driveShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 10), M.shaft);
driveShaft.rotation.z = Math.PI / 2;
driveShaft.position.set(2.9, 1.5, 0);
scene.add(driveShaft);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let throttle = 0.6;
let clutchPedal = 0;          // 0 = 全接合,1 = 踩到底(分离)
let gear = 2;                 // 1 or 2
const GEAR_RATIO = { 1: 4.2, 2: 1.9 };   // 变速箱减速比
let wEngine = 40 * Math.PI;   // rad/s 视觉
let wOut = 10 * Math.PI;
let thetaE = 0, thetaC = 0, thetaW = 0;
let slipping = 0;
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function engagement() { return 1 - clutchPedal; }   // 0..1

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblEng = addLabel(() => L('发动机 + 飞轮', 'engine + flywheel'), new THREE.Vector3(-3.4, 2.6, 0), 'e');
const lblClu = addLabel(() => slipping > 0.05
  ? L(`离合器:滑差传扭 ${Math.round(slipping * 100)}%`, `clutch: slipping ${Math.round(slipping * 100)}%`)
  : L('离合器:同步咬合', 'clutch: locked'),
  new THREE.Vector3(-2.1, 3.0, 0), slipping > 0.05 ? 'bad' : 'w', engineGrp);
const lblBox = addLabel(() => gear === 1 ? L('1 挡:4.2× 扭矩,车轮慢', '1st: 4.2× torque, slow wheel') : L('2 挡:1.9× 扭矩,车轮快', '2nd: 1.9× torque, faster'),
  new THREE.Vector3(1.4, 2.9, 0), 'e', boxGrp);
const lblStatus = addLabel(() => {
  const e = engagement();
  if (e < 0.1) return L('离合器分离:发动机空转,动力断开', 'clutch disengaged: engine idles free');
  if (slipping > 0.08) return L('半联动:摩擦片带滑差,扭矩温柔地传过去', 'biting point: plates slip, torque passes gently');
  return L('全接合:发动机与车轮锁成一体', 'fully engaged: engine and wheel locked as one');
}, new THREE.Vector3(0.6, 4.0, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '动力链条', be: 'The powertrain',
    d: '发动机(飞轮)→ 离合器 → 变速箱 → 车轮。发动机只会转圈,不会「慢慢转」——中间全靠离合器与齿轮组翻译。',
    de: 'Engine → clutch → gearbox → wheel. The engine only knows how to spin fast — the clutch and gears do the translating.',
    act: () => { setGear(2); setClutch(0); } },
  { b: '半联动起步', be: 'The biting point',
    d: '把踏板抬到中间:摩擦片一边打滑一边压紧,滑差把发动机的转速「温柔地」递给静止的车——这就是半联动,起步不熄火的全部秘密。',
    de: 'Raise the pedal halfway: plates slip while pressing, feeding engine speed gently into a standing car — the whole secret of a smooth launch.',
    act: () => { setGear(1); setClutch(0.55); } },
  { b: '全接合:滑差归零', be: 'Fully engaged: zero slip',
    d: '踏板完全松开,两片摩擦片被弹簧压死,滑差归零——发动机与车轮锁成一体,磨损也归零。',
    de: 'Release fully: the spring clamps the plates together, slip is zero — engine and wheel locked, zero wear.',
    act: () => { setGear(1); setClutch(0); } },
  { b: '换挡:先分离再同步', be: 'Shifting: disengage, sync, engage',
    d: '换挡三拍:踩下踏板断开动力 → 同步器把新齿轮对磨到同速 → 咬合。带着动力硬拔,齿与齿会打架打齿。',
    de: 'Shift in three beats: disengage, let the synchronizer match speeds, engage. Yank it under load and the teeth grind.',
    act: () => { setClutch(1); setTimeout(() => { setGear(gear === 1 ? 2 : 1); setClutch(0); }, 1400); } },
  { b: '扭矩 ⇄ 转速守恒', be: 'Torque ⇄ speed trade',
    d: '功率 = 扭矩 × 转速:1 挡把转速缩 4.2 倍,就把扭矩放大 4.2 倍——爬坡用低挡、巡航用高挡,和变压器升压降流同构。',
    de: 'Power = torque × speed: 1st gear shrinks speed 4.2× to multiply torque 4.2× — kin to the transformer\'s voltage/current trade.',
    act: () => { setGear(1); setClutch(0); } },
];
function stepIndex() {
  const e = engagement();
  if (e < 0.1) return 3;
  if (slipping > 0.08) return 1;
  if (gear === 1 && wOut < 20 * Math.PI) return 2;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elThr = document.getElementById('thr');
const elThrVal = document.getElementById('thrVal');
const elClu = document.getElementById('clu');
const elCluVal = document.getElementById('cluVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stE = document.getElementById('stE'), stSlip = document.getElementById('stSlip'),
  stW = document.getElementById('stW'), stT = document.getElementById('stT');
function setGear(g) {
  gear = g;
  pair1.g.visible = g === 1;
  pair2.g.visible = g === 2;
  fork.position.y = g === 1 ? -0.4 : 0.35;
  syncGearBtns();
}
function syncGearBtns() {
  document.getElementById('g1').classList.toggle('on', gear === 1);
  document.getElementById('g2').classList.toggle('on', gear === 2);
}
function setClutch(v) {
  clutchPedal = clamp(v, 0, 1);
  elClu.value = Math.round(clutchPedal * 100);
  elCluVal.textContent = clutchPedal < 0.05 ? L('全接合', 'engaged') : clutchPedal > 0.9 ? L('分离', 'disengaged') : Math.round((1 - clutchPedal) * 100) + '%';
  /* 摩擦片间距 */
  clutchOut.position.x = 1.15 + clutchPedal * 0.22;
  slipHalo.position.x = clutchOut.position.x;
}
document.getElementById('g1').addEventListener('click', () => setGear(1));
document.getElementById('g2').addEventListener('click', () => setGear(2));
elThr.addEventListener('input', () => { throttle = parseInt(elThr.value, 10) / 100; elThrVal.textContent = elThr.value + '%'; });
elClu.addEventListener('input', () => setClutch(parseInt(elClu.value, 10) / 100));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  const e = engagement();
  const g = GEAR_RATIO[gear];

  if (playing) {
    /* 发动机朝油门目标松弛 */
    const wTarget = (12 + throttle * 78) * Math.PI;
    wEngine += (wTarget - wEngine) * clamp(dts * 1.2, 0, 1);
    /* 离合器:滑差扭矩 */
    const slipW = wEngine - wOut;
    slipping = clamp(Math.abs(slipW) / (30 * Math.PI), 0, 1) * (e < 0.98 ? 1 : 0);
    if (e > 0.97 && Math.abs(slipW) < 8 * Math.PI) {
      wOut = wEngine;                       // 锁死
    } else {
      const T = e * e * slipW * 0.9;        // 滑差正比传递
      wOut += T * dts;
    }
    wOut = clamp(wOut, 0, wEngine);
    thetaE += wEngine * dts;
    thetaC += wOut * dts;
    thetaW += wOut / g * dts;
  }
  flywheel.rotation.x = -thetaE;
  fwMark.rotation.x = -thetaE;
  clutchIn.rotation.x = -thetaE;
  clutchOut.rotation.x = -thetaC;
  slipHalo.material.opacity = slipping * 0.8 * (0.5 + 0.5 * Math.sin(clock.elapsedTime * 20));
  inShaft.rotation.x = -thetaC;
  outShaft.rotation.x = -thetaC;
  const gi = gear === 1 ? pair1.gi : pair2.gi;
  const go = gear === 1 ? pair1.go : pair2.go;
  gi.rotation.x = -thetaC;
  go.rotation.x = thetaC * (gi.geometry.parameters.radiusTop / go.geometry.parameters.radiusTop);
  driveShaft.rotation.x = -thetaC;
  wheelGrp.rotation.z = -thetaW;
  wMark.rotation.z = -thetaW;

  stE.innerHTML = (wEngine / Math.PI).toFixed(0) + '<small> ×π rad/s</small>';
  stSlip.innerHTML = (slipping * 100).toFixed(0) + '<small> %</small>';
  stW.innerHTML = (thetaW === 0 ? 0 : (wOut / g / Math.PI)).toFixed(0) + '<small> ×π rad/s</small>';
  stT.textContent = '×' + g.toFixed(1);

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setGear(2);
setClutch(0);
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
