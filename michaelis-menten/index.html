<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>米氏酶动力学 · v-[S] 曲线</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(176,118,31,.9); color: #9c6f00; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; top: 64px; z-index: 4; width: 300px; height: 224px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.e { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.s { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.p { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .chip.i { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(255,107,107,.22); border-color: rgba(255,107,107,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="米氏酶动力学:v-[S] 曲线" data-en="Michaelis-Menten Kinetics: v vs [S]">米氏酶动力学:v-[S] 曲线</h1>
  <div class="sub" data-zh="酶先结合底物(E+S→ES)再催化(ES→E+P):低浓度斜着走、高浓度饱和封顶 Vmax,Km 是到一半速度的浓度 · 空格播放/暂停" data-en="Enzyme binds substrate (E+S→ES) then catalyzes (ES→E+P): linear at low [S], saturated at Vmax, Km = [S] at half-Vmax · Space = play/pause">酶先结合底物(E+S→ES)再催化(ES→E+P):低浓度斜着走、高浓度饱和封顶 Vmax,Km 是到一半速度的浓度 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="plot">
  <h3 data-zh="反应速率 v-[S] 曲线(实时测量 vs 理论)" data-en="Rate v vs [S] (live measurement vs theory)">反应速率 v-[S] 曲线(实时测量 vs 理论)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="stats">
  <span class="k" data-zh="实时速率 v" data-en="live rate v">实时速率 v</span><span class="v g" id="stV">—</span>
  <span class="k" data-zh="Vmax(理论)" data-en="Vmax (theory)">Vmax(理论)</span><span class="v" id="stVmax">—</span>
  <span class="k" data-zh="表观 Km" data-en="apparent Km">表观 Km</span><span class="v" id="stKm">—</span>
  <span class="k" data-zh="催化循环数" data-en="turnovers">催化循环数</span><span class="v" id="stTurn">0</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.e" data-zh="酶 E(带活性位点)" data-en="enzyme E (active site)">酶 E(带活性位点)</span>
    <span class="chip.s" data-zh="底物 S" data-en="substrate S">底物 S</span>
    <span class="chip.p" data-zh="产物 P" data-en="product P">产物 P</span>
    <span class="chip.i" data-zh="竞争性抑制剂 I" data-en="competitive inhibitor I">竞争性抑制剂 I</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnInh" data-zh="加竞争性抑制剂" data-en="add competitive inhibitor">加竞争性抑制剂</button>
  </div>
  <div class="row"><label data-zh="底物浓度 [S]" data-en="substrate [S]">底物浓度 [S]</label><input id="cs" type="range" min="0" max="100" step="1" value="30"><span class="val" id="csVal">30</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../molecular-motors/" data-zh="另一台分子机器" data-en="another molecular machine">另一台分子机器</a>
    <a href="../polymerization/" data-zh="化学里的链式速率" data-en="chain rates in chemistry">化学里的链式速率</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('米氏酶动力学', 'Michaelis-Menten Kinetics');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
  drawPlot();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.5, 1.4, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.45;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}
const M = {
  enzyme: mat(0x63e6be, { transparent: true, opacity: 0.92, roughness: 0.3 }),
  site: new THREE.MeshBasicMaterial({ color: 0x1a2b33, transparent: true, opacity: 0.85 }),
  S: mat(0xffd166, { emissiveIntensity: 0.25 }),
  P: mat(0x74c0fc, { emissiveIntensity: 0.25 }),
  I: mat(0xff6b6b, { emissiveIntensity: 0.3 }),
  siteGlow: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false }),
};

/* ================= 酶:大球+凹槽(活性位点) ================= */
const enzyme = new THREE.Group();
enzyme.position.set(0, 0.5, 0);
scene.add(enzyme);
const eBody = new THREE.Mesh(new THREE.SphereGeometry(1.0, 40, 30), M.enzyme);
enzyme.add(eBody);
/* 活性位点:朝向镜头侧的小凹坑 */
const site = new THREE.Mesh(new THREE.SphereGeometry(0.30, 20, 14), M.site);
site.position.set(0, 0.1, 0.86);
site.scale.set(1, 1, 0.6);
enzyme.add(site);
const siteGlow = new THREE.Mesh(new THREE.SphereGeometry(0.36, 20, 14), M.siteGlow);
siteGlow.position.copy(site.position);
siteGlow.scale.copy(site.scale);
enzyme.add(siteGlow);
/* 表面起伏(几个凸起,像蛋白) */
for (let i = 0; i < 10; i++) {
  const a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1);
  const bump = new THREE.Mesh(new THREE.SphereGeometry(0.16 + Math.random() * 0.12, 12, 8), M.enzyme);
  bump.position.set(Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a)).multiplyScalar(0.95);
  enzyme.add(bump);
}
/* 底座 */
const base = new THREE.Mesh(new THREE.CylinderGeometry(2.9, 3.1, 0.16, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -1.15;
scene.add(base);

/* ================= 粒子 ================= */
const parts = [];    // {mesh, kind:'S'|'P'|'I', state:'free'|'seek'|'bind'|'release', v:Vec3, t}
const POOL_S = 26, POOL_P = 14, POOL_I = 8;
function mkMesh(kind) {
  const mm = { S: M.S, P: M.P, I: M.I }[kind];
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(kind === 'I' ? 0.15 : 0.17, 16, 12), mm);
  mesh.visible = false;
  scene.add(mesh);
  return mesh;
}
for (let i = 0; i < POOL_S; i++) parts.push({ mesh: mkMesh('S'), kind: 'S', state: 'idle', v: new THREE.Vector3(), t: 0 });
for (let i = 0; i < POOL_P; i++) parts.push({ mesh: mkMesh('P'), kind: 'P', state: 'idle', v: new THREE.Vector3(), t: 0 });
for (let i = 0; i < POOL_I; i++) parts.push({ mesh: mkMesh('I'), kind: 'I', state: 'idle', v: new THREE.Vector3(), t: 0 });

const SITE_POS = new THREE.Vector3(0, 0.6, 0.9);   // 世界坐标活性位点

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let cs = qsFloat('s', 30);          // 底物浓度 0-100
let inhibitor = false;
let tSim = 0;
let turnovers = 0;
let rateWindow = [];                // 最近事件时刻
const K_CAT = 2.2;                  // 每秒每酶最大循环(仿真尺度)
const KM_REAL = 30;                 // 半速率浓度(仿真尺度)
const KI = 12;
let siteState = 'empty';       // empty | bound | blocked
let bindT = 0;
let curBound = null;
let inhibitorLeaveT = 0;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblE = addLabel(() => L('酶 E(绿色大分子)', 'enzyme E (green macromolecule)'), new THREE.Vector3(0, 1.7, 0), 'g', enzyme);
const lblSite = addLabel(() => {
  const st = siteState;
  if (st === 'empty') return L('活性位点:空,等底物', 'active site: empty, waiting');
  if (st === 'bound') return L('ES 复合物:锁钥结合,正在催化', 'ES complex: lock-and-key, catalyzing');
  return L('I 占住了活性位点!底物进不来', 'I is squatting in the active site!');
}, new THREE.Vector3(0.3, 0.55, 1.2), inhibitor ? 'r' : 'g', enzyme);
const lblFormula = addLabel(() => inhibitor
  ? L('竞争性抑制:v = Vmax·[S] / (Km(1+[I]/Ki)+[S]) —— Km 变大,Vmax 不变', 'competitive: v = Vmax·[S]/(Km(1+[I]/Ki)+[S]) — Km up, Vmax same')
  : L('米氏方程:v = Vmax·[S]/(Km+[S])', 'Michaelis-Menten: v = Vmax·[S]/(Km+[S])'),
  new THREE.Vector3(0, -0.95, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: 'E + S → ES:锁钥结合', be: 'E + S → ES: lock and key',
    d: '底物滑进活性位点,形状互补+弱键锁定——这是第一步,可逆(结合得牢不牢由 Km 反映)。',
    de: 'Substrate slides into the active site: complementary shape, weak bonds. Reversible — how tightly = Km.',
    act: () => setCS(10) },
  { b: 'ES → E + P:催化', be: 'ES → E + P: catalysis',
    d: '结合态里催化基团就位,反应速率提升 10⁶~10¹⁷ 倍;产物释放,酶原样回收,立即接下一单。',
    de: 'With substrate docked, catalytic groups strike — 10⁶–10¹⁷× faster than uncatalyzed. Product leaves, enzyme recycles.',
    act: () => setCS(30) },
  { b: '低 [S]:速率与浓度成正比', be: 'Low [S]: rate ∝ concentration',
    d: '酶大多空着,底物一来就接——速率由「底物多久碰上酶」决定,曲线是直线段。',
    de: 'Most enzymes idle; rate limited by how often substrate finds enzyme — the straight part of the curve.',
    act: () => setCS(8) },
  { b: '高 [S]:饱和,封顶 Vmax', be: 'High [S]: saturation, Vmax cap',
    d: '酶全部被占满,再多的底物也只能排队——速率达到 kcat·[E]总,曲线拉平。',
    de: 'Every enzyme is busy; extra substrate queues up — rate maxes out at kcat·[E] and the curve flattens.',
    act: () => setCS(95) },
  { b: '竞争性抑制:Km↑,Vmax 不变', be: 'Competitive inhibition: Km↑, Vmax same',
    d: '抑制剂抢活性位点,底物要更高浓度才能到半速——曲线右移但天花板不动;加大 [S] 能完全解毒。',
    de: 'Inhibitor fights for the site; more [S] needed for half-speed — curve shifts right, ceiling unchanged. Dumping in [S] wins.',
    act: () => toggleInhibitor() },
];
function stepIndex() {
  if (inhibitor) return 4;
  if (cs >= 70) return 3;
  if (cs >= 20) return 1;
  return 2;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 反应逻辑 ================= */
function spawn(kind) {
  const p = parts.find(q => q.kind === kind && q.state === 'idle');
  if (!p) return null;
  p.mesh.visible = true;
  p.mesh.position.set((Math.random() - 0.5) * 5.6, 0.2 + Math.random() * 1.6, (Math.random() - 0.5) * 4.5 - 1.2);
  p.state = 'free';
  p.t = 0;
  return p;
}
function freeAll(kind) {
  for (const p of parts) {
    if (p.kind === kind && p.state !== 'idle') { p.state = 'idle'; p.mesh.visible = false; }
  }
}
function updateParts(dt) {
  for (const p of parts) {
    if (p.state === 'idle') continue;
    p.t += dt;
    if (p.state === 'free') {
      /* 布朗漂移 + 向酶的弱扩散倾向 */
      const toE = new THREE.Vector3().subVectors(SITE_POS, p.mesh.position);
      if (toE.length() < 5 && toE.length() > 0.001) {
        p.mesh.position.addScaledVector(toE.normalize(), dt * 0.35);
      }
      p.mesh.position.x += Math.sin(tSim * 1.4 + p.mesh.id) * dt * 0.5;
      p.mesh.position.y += Math.sin(tSim * 1.1 + p.mesh.id * 2) * dt * 0.35;
      p.mesh.position.z += Math.cos(tSim * 1.2 + p.mesh.id) * dt * 0.5;
      p.mesh.position.x = clamp(p.mesh.position.x, -3.1, 3.1);
      p.mesh.position.y = clamp(p.mesh.position.y, 0.1, 2.2);
      p.mesh.position.z = clamp(p.mesh.position.z, -2.6, 2.6);
      p.mesh.rotation.y += dt * 1.5;
    } else if (p.state === 'seek') {
      if (p.kind !== 'I' && siteState !== 'empty') { p.state = 'free'; continue; }
      const d = new THREE.Vector3().subVectors(SITE_POS, p.mesh.position);
      const dist = d.length();
      if (dist < 0.18) {
        p.state = 'gone';
        p.mesh.visible = false;
        if (p.kind === 'S' && siteState === 'empty') {
          siteState = 'bound';
          curBound = p;
          bindT = 0;
          turnovers++;
          rateWindow.push(tSim);
        } else if (p.kind === 'I' && siteState === 'empty') {
          siteState = 'blocked';
          curBound = p;
          inhibitorLeaveT = 0.8 + Math.random() * 1.2;
        }
      } else {
        p.mesh.position.addScaledVector(d.normalize(), clamp(dt * 2.4, 0, dist));
      }
    } else if (p.state === 'release') {
      /* 飞出画面 */
      p.mesh.position.addScaledVector(p.v, dt * 2.4);
      if (p.t > 1.6) { p.state = 'idle'; p.mesh.visible = false; }
    }
  }
}
function reactionTick(dt) {
  /* 维持底物粒子数 ~ cs */
  const want = Math.round(cs / 100 * POOL_S);
  const have = parts.filter(p => p.kind === 'S' && (p.state === 'free' || p.state === 'seek')).length;
  if (have < want && Math.random() < dt * 6) spawn('S');
  if (have > want + 4) {
    const extra = parts.find(p => p.kind === 'S' && p.state === 'free');
    if (extra) { extra.state = 'idle'; extra.mesh.visible = false; }
  }
  /* 抑制剂粒子 */
  const inh = parts.filter(p => p.kind === 'I' && (p.state === 'free' || p.state === 'seek')).length;
  if (inhibitor && inh < POOL_I && Math.random() < dt * 3) spawn('I');
  if (!inhibitor && inh > 0) {
    const ex = parts.find(p => p.kind === 'I' && p.state === 'free');
    if (ex) { ex.state = 'idle'; ex.mesh.visible = false; }
  }
  /* 底物 seek 位点:结合尝试率 ∝ [S](泊松),高浓度自然饱和 */
  if (siteState === 'empty' && Math.random() < dt * 0.06 * (cs + 4)) {
    /* 竞争:从附近候选中抽一个,S 与 I 同台竞争 */
    const cands = parts.filter(p => (p.kind === 'S' || p.kind === 'I')
      && p.state === 'free' && p.mesh.position.distanceTo(SITE_POS) < 2.6);
    if (cands.length) cands[Math.floor(Math.random() * cands.length)].state = 'seek';
  }
  /* 催化:ES → E + P */
  if (siteState === 'bound') {
    bindT += dt;
    if (bindT > 1 / K_CAT) {
      siteState = 'empty';
      curBound = null;
      const pr = spawn('P');
      if (pr) { pr.mesh.position.copy(SITE_POS); pr.state = 'release';
        pr.v = new THREE.Vector3((Math.random() - 0.5), 0.4 + Math.random() * 0.4, 0.6 + Math.random() * 0.4).normalize(); }
      siteGlow.material.opacity = 0.8;
    }
  }
  /* blocked: inhibitor 停一会儿再离开 */
  if (siteState === 'blocked') {
    inhibitorLeaveT -= dt;
    if (inhibitorLeaveT <= 0) {
      siteState = 'empty';
      if (curBound) { curBound.state = 'release'; curBound.v = new THREE.Vector3(-0.5, 0.5, -0.5).normalize(); curBound = null; }
    }
  }
  /* 实时速率 = 最近 3 秒循环数/3 */
  rateWindow = rateWindow.filter(t => tSim - t < 3);
}
function vTheoretical() {
  const km = KM_REAL * (inhibitor ? 1 + POOL_I / KI : 1);
  return K_CAT * cs / (km + cs);
}

/* ================= 曲线绘制 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.scale(1, 1);
  ctx.clearRect(0, 0, W, H);
  const padL = 46, padB = 34, padT = 12, padR = 10;
  const pw = W - padL - padR, ph = H - padB - padT;
  const vmax = K_CAT * 1.05;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const cAcc = '#ffd166', cBlue = '#74c0fc', cRed = '#ff6b6b';
  ctx.font = '20px system-ui';
  /* 轴 */
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph); ctx.lineTo(padL + pw, padT + ph);
  ctx.stroke();
  /* 网格:半速线 */
  const km = KM_REAL * (inhibitor ? 1 + POOL_I / KI : 1);
  ctx.setLineDash([8, 8]);
  ctx.strokeStyle = cBlue; ctx.lineWidth = 2;
  const yV = padT + ph * (1 - 0.5 / 1.05);
  ctx.beginPath(); ctx.moveTo(padL, yV); ctx.lineTo(padL + pw, yV); ctx.stroke();
  /* Vmax 渐近线 */
  ctx.strokeStyle = 'rgba(154,167,184,.6)';
  const yM = padT + ph * (1 - K_CAT / vmax);
  ctx.beginPath(); ctx.moveTo(padL, yM); ctx.lineTo(padL + pw, yM); ctx.stroke();
  ctx.setLineDash([]);
  /* 理论曲线 */
  const curve = (kmm, color, dash) => {
    ctx.strokeStyle = color; ctx.lineWidth = 4;
    if (dash) ctx.setLineDash([10, 8]);
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const S = i / 100 * 100;
      const v = K_CAT * S / (kmm + S);
      const x = padL + pw * i / 100;
      const y = padT + ph * (1 - v / vmax);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  };
  if (inhibitor) curve(KM_REAL * (1 + POOL_I / KI), cRed, false);
  curve(KM_REAL, inhibitor ? 'rgba(255,209,102,.4)' : cAcc, false);
  /* Km 竖线 */
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = inhibitor ? cRed : cAcc;
  const xK = padL + pw * km / 100;
  ctx.beginPath(); ctx.moveTo(xK, padT + ph); ctx.lineTo(xK, yV); ctx.stroke();
  ctx.setLineDash([]);
  /* 当前 [S] 点(实时 v) */
  const live = rateWindow.length / 3;
  const xS = padL + pw * cs / 100;
  const vT = vTheoretical();
  const yLt = padT + ph * (1 - clamp(live, 0, vmax) / vmax);
  ctx.fillStyle = cBlue;
  ctx.beginPath(); ctx.arc(xS, yLt, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2; ctx.stroke();
  /* 标签 */
  ctx.fillStyle = cTxt;
  ctx.font = '19px system-ui';
  ctx.fillText('[S]', padL + pw - 26, padT + ph + 26);
  ctx.fillText('v', padL - 30, padT + 12);
  ctx.fillText('Vmax', padL + pw - 64, yM - 8);
  ctx.fillText(inhibitor ? "Km'" : 'Km', xK + 6, padT + ph - 8);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elCs = document.getElementById('cs');
const elCsVal = document.getElementById('csVal');
const btnInh = document.getElementById('btnInh');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setCS(v) {
  cs = clamp(v, 0, 100);
  elCs.value = cs;
  elCsVal.textContent = cs.toFixed(0);
  drawPlot();
}
function toggleInhibitor() {
  inhibitor = !inhibitor;
  btnInh.classList.toggle('on', inhibitor);
  drawPlot();
}
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elCs.addEventListener('input', e => setCS(parseInt(e.target.value)));
btnInh.addEventListener('click', toggleInhibitor);
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let plotTick = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  enzyme.rotation.y += dts * 0.12;
  reactionTick(dts);
  updateParts(dts);
  siteGlow.material.opacity = Math.max(0, siteGlow.material.opacity - dt * 2.2)
    + (siteState === 'bound' ? 0.25 + 0.2 * Math.sin(tSim * 8) : 0);

  document.getElementById('stV').innerHTML = (rateWindow.length / 3).toFixed(2) + ' <small>/s</small>';
  document.getElementById('stVmax').innerHTML = K_CAT.toFixed(1) + ' <small>/s</small>';
  const kmApp = KM_REAL * (inhibitor ? 1 + POOL_I / KI : 1);
  document.getElementById('stKm').innerHTML = kmApp.toFixed(0) + (inhibitor ? ' <small>(↑)</small>' : '');
  document.getElementById('stTurn').textContent = turnovers;

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  lblSite.element.className = 'lbl ' + (siteState === 'blocked' ? 'r' : 'g');
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  plotTick += dt;
  if (plotTick > 0.2) { plotTick = 0; drawPlot(); }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setCS(cs);
setPlayLabel();
requestAnimationFrame(frame);
</script>
