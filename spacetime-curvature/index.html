<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时空弯曲 · 质量告诉时空如何弯曲</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#0b0f16; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.p { border-color: rgba(99,230,190,.9); color: #c3f5e5; }
  .lbl.st { border-color: rgba(255,209,102,.85); font-size: 12.5px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g, :root[data-theme="light"] .lbl.st { color: #8a5c0d; }
  :root[data-theme="light"] .lbl.b { color: #14648c; }
  :root[data-theme="light"] .lbl.p { color: #0d7a5c; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    max-width: 640px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }
  :root[data-theme="light"] #stats .v.g { color: #9c6f00; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 396px;
    background: var(--panel); border: 1px solid var(--tool-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.s { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.p { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.r { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .chip.m { color: #d3c2f0; border-color: rgba(180,150,230,.6); }
  :root[data-theme="light"] .chip.s { color: #8a5c0d; border-color: rgba(178,128,20,.7); }
  :root[data-theme="light"] .chip.p { color: #0d7a5c; border-color: rgba(13,122,92,.6); }
  :root[data-theme="light"] .chip.r { color: #14648c; border-color: rgba(20,100,140,.6); }
  :root[data-theme="light"] .chip.m { color: #6a4fa0; border-color: rgba(106,79,160,.6); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,209,102,.6); background: rgba(255,209,102,.13); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(176,118,31,.55); background: rgba(176,118,31,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  :root[data-theme="light"] #formula b { color: var(--text); }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="时空弯曲:质量告诉时空如何弯曲" data-en="Spacetime Curvature: mass tells spacetime how to bend">时空弯曲:质量告诉时空如何弯曲</h1>
  <div class="sub" data-zh="弹性膜类比(真实弯曲在四维时空):中心质量把网格面压成 Flamm 抛物面,行星沿测地线自由下落兜出进动的椭圆;掠日星光偏折 1.75″——1919 爱丁顿日食实测 · 拖动旋转 / 空格播放/暂停" data-en="Rubber-sheet analogy (real curvature is 4D): a central mass dents the grid into a Flamm paraboloid, planets free-fall along geodesics into precessing ellipses, grazing starlight bends 1.75″ — Eddington's 1919 eclipse · drag to orbit / Space = play/pause">弹性膜类比(真实弯曲在四维时空):中心质量把网格面压成 Flamm 抛物面,行星沿测地线自由下落兜出进动的椭圆;掠日星光偏折 1.75″——1919 爱丁顿日食实测 · 拖动旋转 / 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="中心质量" data-en="central mass">中心质量</span><span class="v g" id="stMass">—</span>
  <span class="k" data-zh="凹陷深度" data-en="dent depth">凹陷深度</span><span class="v" id="stDent">—</span>
  <span class="k" data-zh="轨道周期" data-en="orbit period">轨道周期</span><span class="v" id="stPeriod">—</span>
  <span class="k" data-zh="光线偏折角" data-en="light deflection">光线偏折角</span><span class="v g" id="stBend">—</span>

<div id="panel">
  <div id="legend">
    <span class="chip s" data-zh="中心天体(下陷源)" data-en="central mass (the dent)">中心天体(下陷源)</span>
    <span class="chip p" data-zh="行星(测地线轨道)" data-en="planet (geodesic orbit)">行星(测地线轨道)</span>
    <span class="chip r" data-zh="星光(掠过太阳)" data-en="starlight (grazing the Sun)">星光(掠过太阳)</span>

  <div id="actions">
    <button class="abtn on" id="btnOrbit" data-zh="模式:行星轨道" data-en="mode: planet orbit">模式:行星轨道</button>
    <button class="abtn" id="btnLight" data-zh="模式:光线偏折" data-en="mode: light bending">模式:光线偏折</button>
    <button class="abtn" id="btnReset" data-zh="重发" data-en="relaunch">重发</button>
  </div>
  <div class="row"><label data-zh="中心质量" data-en="central mass">中心质量</label><input id="mass" type="range" min="20" max="200" step="5" value="100"><span class="val" id="massVal">1.00 M☉</span></div>
  <div class="row"><label data-zh="掠射距离 b" data-en="impact param b">掠射距离 b</label><input id="bend" type="range" min="90" max="220" step="5" value="100"><span class="val" id="bendVal">1.00 R☉</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglFlat" type="checkbox"> <span data-zh="平直对照线" data-en="flat-space line">平直对照线</span></label>
      <label><input id="tglGR" type="checkbox"> <span data-zh="GR 进动" data-en="GR precession">GR 进动</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../black-hole-tides/" data-zh="同一几何更狠:黑洞潮汐撕扯" data-en="same geometry, harsher: black-hole tides">同一几何更狠:黑洞潮汐撕扯</a>
    <a href="../gravitational-waves/" data-zh="弯曲在波动:引力波" data-en="curvature in motion: gravitational waves">弯曲在波动:引力波</a>
    <a href="../orbital-mechanics/" data-zh="牛顿层近似:开普勒轨道" data-en="the Newtonian limit: Kepler orbits">牛顿层近似:开普勒轨道</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xdfe7f1 : 0x05070c);
  starMat.opacity = THEME === 'dark' ? 0.7 : 0;
  M.sheet.opacity = THEME === 'dark' ? 0.20 : 0.16;
  M.grid.opacity = THEME === 'dark' ? 0.55 : 0.42;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('时空弯曲 · 质量告诉时空如何弯曲', 'Spacetime Curvature · mass tells spacetime how to bend');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(3.6, 2.8, 5.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(5, 6, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.35);
fill.position.set(-5, 3, -4);
scene.add(fill);

/* 星野背景(InstancedMesh) */
const starMat = new THREE.MeshBasicMaterial({ color: 0xcfd8ea, transparent: true, opacity: 0.7 });
{
  const g = new THREE.IcosahedronGeometry(0.04, 0);
  const stars = new THREE.InstancedMesh(g, starMat, 240);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < 240; i++) {
    const a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1), r = 16 + Math.random() * 18;
    p.set(Math.sin(b) * Math.cos(a) * r, Math.abs(Math.cos(b)) * r * 0.6 + 1, Math.sin(b) * Math.sin(a) * r);
    const k = 0.5 + Math.random() * 1.2;
    s.set(k, k, k);
    m4.compose(p, q, s);
    stars.setMatrixAt(i, m4);
  }
  scene.add(stars);
}

/* ---------------- 材质 ---------------- */
function glowTexture(inner, mid) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, inner);
  grd.addColorStop(0.35, mid);
  grd.addColorStop(1, 'rgba(255,180,60,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const M = {
  sun: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  halo: new THREE.SpriteMaterial({ map: glowTexture('rgba(255,220,130,1)', 'rgba(255,190,90,.4)'),
    transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending, depthWrite: false }),
  sheet: new THREE.MeshStandardMaterial({ color: 0x4f7ec4, roughness: 0.7, metalness: 0.1,
    transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false }),
  grid: new THREE.LineBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.55 }),
  planet: new THREE.MeshStandardMaterial({ color: 0x63e6be, roughness: 0.4, metalness: 0.15,
    emissive: 0x63e6be, emissiveIntensity: 0.3 }),
  trail: new THREE.LineBasicMaterial({ color: 0x63e6be, transparent: true, opacity: 0.55 }),
  apse: new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.8 }),
  dot: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  ray: new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.95 }),
  flat: new THREE.LineDashedMaterial({ color: 0x9fb0c3, transparent: true, opacity: 0.7, dashSize: 0.16, gapSize: 0.1 }),
  head: new THREE.MeshBasicMaterial({ color: 0xfff3c4 }),
  star: new THREE.MeshBasicMaterial({ color: 0xeef3ff }),
  obs: new THREE.MeshBasicMaterial({ color: 0x9fd8ff }),
};

/* ================= 弹性膜(Flamm 抛物面嵌入) ================= */
const R_GRID = 4.2;
const MU0 = 1.0;
const C_LIGHT = 4.2;

}

/* 轨道积分状态 */
const R0 = 2.5, VF = 0.78;
let px = 0, pz = 0, vx = 0, vz = 0, rPrev = 0, drPrev = 0;
let periAng = 0, rPeri = 0, periPrevAng = null, periRate = 0, periCount = 0;
let lastPeriT = -1, period = 0, periFlash = 0;
/* 光线状态 */
let rayPts = null, rayAng = 0, lastTraceM = -1, lastTraceB = -1;

function resetOrbit() {
  px = R0; pz = 0;
  vx = 0; vz = -VF * Math.sqrt(MU0 * mVis / R0);
  rPrev = R0; drPrev = 0;
  periPrevAng = null; periRate = 0; periCount = 0;
  rPeri = R0; periAng = 0;
  lastPeriT = -1; period = 0; periFlash = 0;
  trHead = 0; trCount = 0; trSkip = 0;
}
function orbitStep(h) {
  const mu = MU0 * mVis;
  const r = Math.hypot(px, pz), r2 = r * r, r3 = r2 * r;
  const hg = px * vz - pz * vx;
  const k = grOn ? 3 * mu * hg * hg / (C_LIGHT * C_LIGHT * r3 * r2) : 0;
  const s = -(mu / r3 + k);
  vx += s * px * h; vz += s * pz * h;
  px += vx * h; pz += vz * h;
  const rn = Math.hypot(px, pz), dr = rn - rPrev;
  if (drPrev < 0 && dr >= 0) {
    periAng = Math.atan2(pz, px);
    rPeri = rn;
    periFlash = 1;
    if (periPrevAng !== null) {
      let d = periAng - periPrevAng;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      periRate = Math.abs(d);
      if (lastPeriT >= 0) period = tSim - lastPeriT;
      lastPeriT = tSim;
      periCount++;
    } else { periPrevAng = periAng; lastPeriT = tSim; periCount++; }
    periPrevAng = periAng;
  }
  drPrev = dr; rPrev = rn;
  if (++trSkip >= TR_EVERY) {
    trSkip = 0;
    trXZ[trHead * 2] = px; trXZ[trHead * 2 + 1] = pz;
    trHead = (trHead + 1) % TR_N;
    trCount = Math.min(trCount + 1, TR_N);
  }
}
function traceRay() {
  lastTraceM = mVis; lastTraceB = bRs;
  const mu = MU0 * mVis, bw = bRs * 0.5, h = 0.004;
  let x = -4.8, z = bw, rvx = C_LIGHT, rvz = 0;
  const out = [x, z];
  for (let i = 0; i < 3800; i++) {
    const r = Math.hypot(x, z);
    if (r < 0.3) break;
    const a = -2 * mu / (r * r * r);
    rvx += a * x * h; rvz += a * z * h;
    x += rvx * h; z += rvz * h;
    if (i % 2 === 0) out.push(x, z);
    if (i > 100 && x > 4.8) break;
  }
  out.push(x, z);
  rayPts = out;
  rayAng = Math.abs(Math.atan2(rvz, rvx));
}

let orbitAcc = 0;
function advance(dts) {
  mVis += (mTarget - mVis) * Math.min(1, dts * 2.5);
  if (Math.abs(mTarget - mVis) < 1e-4) mVis = mTarget;
  orbitAcc += dts;
  const h = 0.004;
  let guard = 0;
  while (orbitAcc >= h && guard++ < 160) {
    orbitAcc -= h;
    if (mode === 'orbit') orbitStep(h);
  }
  rayPhase = (rayPhase + dts / 3) % 1;
  periFlash = Math.max(0, periFlash - dts * 2.5);
}
function updateFormula() {
  if (mode === 'light') {
    formulaEl.innerHTML = L(
      `偏折角 <b>α = 4GM☉/c²b = 1.75″·(M/M☉)/(b/R☉) = ${(1.75 * mVis / bRs).toFixed(2)}″</b>(真实值)· 画面 ≈ ${(rayAng * 180 / Math.PI).toFixed(0)}°(故意夸张)<br>` +
      `GR 是牛顿微粒说偏折的 <b>2 倍</b>——1919 年日食量出 1.75″,天平倒向 Einstein`,
      `deflection <b>α = 4GM☉/c²b = 1.75″·(M/M☉)/(b/R☉) = ${(1.75 * mVis / bRs).toFixed(2)}″</b> (real) · on-screen ≈ ${(rayAng * 180 / Math.PI).toFixed(0)}° (deliberately exaggerated)<br>` +
      `GR bends light <b>2×</b> Newton's corpuscles — the 1919 eclipse measured 1.75″ and the verdict went to Einstein`);
  } else {
    const v = Math.hypot(vx, vz), r = Math.hypot(px, pz) || 1;
    const E = v * v / 2 - MU0 * mVis / r;
    const a = E < 0 ? -MU0 * mVis / (2 * E) : 0;
    const hg = px * vz - pz * vx;
    const e = a > 0 ? Math.sqrt(Math.max(0, 1 - hg * hg / (MU0 * mVis * a))) : 0;
    const dp = a > 0 ? 6 * Math.PI * MU0 * mVis / (C_LIGHT * C_LIGHT * a * Math.max(1 - e * e, 1e-3)) : 0;
    formulaEl.innerHTML = L(
      `截面 <b>w(r)=2√(rs(r−rs))</b>,rs=2GM/c²=${rsOf(mVis).toFixed(2)} · 轨道 <b>a=${a.toFixed(2)}, e=${e.toFixed(2)}</b><br>` +
      `进动 <b>Δϖ≈6πGM/c²a(1−e²)=${(dp * 180 / Math.PI).toFixed(0)}°/圈</b>(演示单位)· 水星真实值:43″/世纪`,
      `cross-section <b>w(r)=2√(rs(r−rs))</b>, rs=2GM/c²=${rsOf(mVis).toFixed(2)} · orbit <b>a=${a.toFixed(2)}, e=${e.toFixed(2)}</b><br>` +
      `precession <b>Δϖ≈6πGM/c²a(1−e²)=${(dp * 180 / Math.PI).toFixed(0)}°/orbit</b> (demo units) · real Mercury: 43″/century`);
  }
}

    planet.scale.setScalar(1 + 0.7 * periFlash);
    M.planet.emissiveIntensity = 0.3 + 1.3 * periFlash;
    if (trCount > 1) {
      const tp = trGeo.attributes.position;
      for (let i = 0; i < trCount; i++) {
        const j = (trHead - trCount + i + 2 * TR_N) % TR_N;
        const x = trXZ[j * 2], z = trXZ[j * 2 + 1];
        tp.setXYZ(i, x, memY(Math.hypot(x, z), mVis) + 0.06, z);
      }
      trGeo.setDrawRange(0, trCount);
      tp.needsUpdate = true;
    }
    const peY = memY(rPeri, mVis) + 0.04;
    const ap = apseGeo.attributes.position;
    ap.setXYZ(0, 0, -d0 + 0.04, 0);
    ap.setXYZ(1, Math.cos(periAng) * rPeri, peY, Math.sin(periAng) * rPeri);
    ap.needsUpdate = true;
    periDot.position.set(Math.cos(periAng) * rPeri, peY + 0.02, Math.sin(periAng) * rPeri);
    lblPeri.o.position.set(Math.cos(periAng) * (rPeri + 0.25), peY + 0.3, Math.sin(periAng) * (rPeri + 0.25));
  }
  /* 星光 */
  const shining = mode === 'light';
  rayLine.visible = shining;
  rayHead.visible = shining;
  starDot.visible = shining;
  obsDot.visible = shining;
  flatLine.visible = shining && flatOn;
  if (shining) {
    if (Math.abs(mVis - lastTraceM) > 1e-3 || Math.abs(bRs - lastTraceB) > 1e-3) traceRay();
    const bw = bRs * 0.5;
    starDot.position.set(-4.8, memY(Math.hypot(4.8, bw), mVis) + 0.06, bw);
    const rp = rayGeo.attributes.position, n = Math.min(rayPts.length / 2, RAY_N);
    for (let i = 0; i < n; i++) {
      const x = rayPts[i * 2], z = rayPts[i * 2 + 1];
      rp.setXYZ(i, x, memY(Math.hypot(x, z), mVis) + 0.05, z);
    }
    rayGeo.setDrawRange(0, n);
    rp.needsUpdate = true;
    const fi = rayPhase * (n - 1), i0 = Math.floor(fi), f = fi - i0, i1 = Math.min(i0 + 1, n - 1);
    const hx = lerp(rayPts[i0 * 2], rayPts[i1 * 2], f);
    const hz = lerp(rayPts[i0 * 2 + 1], rayPts[i1 * 2 + 1], f);
    rayHead.position.set(hx, memY(Math.hypot(hx, hz), mVis) + 0.09, hz);
    obsDot.position.set(rayPts[(n - 1) * 2] + 0.25, memY(Math.hypot(rayPts[(n - 1) * 2], rayPts[(n - 1) * 2 + 1]), mVis) + 0.06, rayPts[(n - 1) * 2 + 1]);
    const y0 = memY(Math.hypot(4.8, bw), mVis);
    const fp = flatLine.geometry.attributes.position;
    fp.setXYZ(0, -4.8, y0 + 0.05, bw);
    fp.setXYZ(1, 4.8, y0 + 0.05, bw);
    fp.needsUpdate = true;
    flatLine.computeLineDistances();
  }
  /* stats:全部实时计算;读数真实、画面夸张 */
  stMass.innerHTML = mVis.toFixed(2) + '<small> M☉</small>';
  stDent.innerHTML = d0.toFixed(2) + '<small> ' + L('演示单位 · ∝√M', 'demo units · ∝√M') + '</small>';
  stPeriod.innerHTML = period > 0
    ? period.toFixed(1) + '<small> s · ' + L('实测(模拟)', 'measured (sim)') + '</small>'
    : '<small>' + L('等待首个近日点…', 'awaiting first perihelion…') + '</small>';
  stBend.innerHTML = (1.75 * mVis / bRs).toFixed(2) + '<small>″ · ' + L('真实值 4GM/c²b', 'real 4GM/c²b') + '</small>';
  stPrec.innerHTML = grOn && periCount >= 2
    ? (periRate * 180 / Math.PI).toFixed(1) + '<small>°/' + L('圈(演示)· 水星 43″/世纪', 'orbit (demo) · Mercury 43″/century') + '</small>'
    : '<small>' + (grOn ? L('等待第二个近日点…', 'awaiting 2nd perihelion…') : L('开 GR 进动可见', 'enable GR precession')) + '</small>';
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let rafId = 0, lastStep = -1, formulaAcc = 0;
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;
  if (dts > 0) advance(dts);
  if (camGoal) {
    camera.position.lerp(camGoal.p, 1 - Math.exp(-dt * 3));
    controls.target.lerp(camGoal.t, 1 - Math.exp(-dt * 3));
    if (camera.position.distanceTo(camGoal.p) < 0.03) camGoal = null;
  }
  apply();
  for (const r of labelRegistry) if (r.o.element.style.display !== 'none') r.o.element.textContent = r.text();
  refreshLabels();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  formulaAcc += dt;
  if (formulaAcc > 0.25) { formulaAcc = 0; updateFormula(); }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (!rafId && !document.hidden) { clock.getDelta(); rafId = requestAnimationFrame(frame); } }
function stop() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
syncMassUI();
syncBendUI();
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
tglLabels.checked = labelsOn;
tglFlat.checked = flatOn;
tglGR.checked = grOn;
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
setMode(mode);
resetOrbit();
traceRay();
applyTheme();
applyLang();
updateFormula();
apply();
setPlayLabel();
start();
</script>
