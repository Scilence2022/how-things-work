<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三相感应电动机 · 旋转磁场拖着鼠笼跑</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1971c2;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.n { border-color: rgba(255,93,93,.9); color: #ffc2c2; }
  .lbl.s { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.g { border-color: rgba(67,209,124,.9); color: #c9f3da; font-size: 13px; padding: 6px 11px; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.f { border-color: rgba(255,159,40,.9); color: #ffd9a3; }
  :root[data-theme="light"] .lbl.n { border-color: rgba(200,60,60,.9); color: #b83232; }
  :root[data-theme="light"] .lbl.s { border-color: rgba(12,123,166,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(71,112,31,.9); color: #3f6d1c; }
  :root[data-theme="light"] .lbl.bad { border-color: rgba(200,60,60,.9); color: #b83232; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.o { color: #ffa94d; }
  #stats .v.b { color: #4dabf7; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.a { color: #ffc2c2; border-color: rgba(255,93,93,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  .chip.c { color: #ffd9a3; border-color: rgba(255,159,40,.7); }
  :root[data-theme="light"] .chip.a { color: #b83232; border-color: rgba(200,60,60,.7); }
  :root[data-theme="light"] .chip.b { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,93,93,.7); color: #ffc2c2; background: rgba(255,93,93,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(25,113,194,.08); border-color: rgba(25,113,194,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #a5d8ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="三相感应电动机：旋转磁场拖着鼠笼跑" data-en="Three-Phase Induction Motor: a spinning field drags the cage">三相感应电动机：旋转磁场拖着鼠笼跑</h1>
  <div class="sub" data-zh="三组绕组 120° 错开,合成一个旋转磁场;笼条切割磁感线生电流,被安培力拖着转——永远差一点同步速,转差就是动力 · 空格播放/暂停" data-en="Three windings 120° apart weave a rotating magnetic field; cage bars cut it, induced currents feel the Lorentz force — the rotor always lags, and the slip IS the push · Space = play/pause">三组绕组 120° 错开,合成一个旋转磁场;笼条切割磁感线生电流,被安培力拖着转——永远差一点同步速,转差就是动力 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="同步转速" data-en="synchronous speed">同步转速</span><span class="v b" id="stSync">—</span>
  <span class="k" data-zh="转子转速" data-en="rotor speed">转子转速</span><span class="v" id="stRot">—</span>
  <span class="k" data-zh="转差率 s" data-en="slip s">转差率 s</span><span class="v o" id="stSlip">—</span>
  <span class="k" data-zh="笼条电流" data-en="bar current">笼条电流</span><span class="v o" id="stI">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip a" data-zh="N 极(瞬时)" data-en="N (instant)">N 极(瞬时)</span>
    <span class="chip b" data-zh="S 极(瞬时)" data-en="S (instant)">S 极(瞬时)</span>
    <span class="chip c" data-zh="感应电流(转差越大越亮)" data-en="induced current (brighter = more slip)">感应电流(转差越大越亮)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnPhase" data-zh="断一相试试(启动失败)" data-en="Cut one phase (fail to start)">断一相试试(启动失败)</button>
  </div>
  <div class="row"><label data-zh="负载" data-en="Load">负载</label><input id="load" type="range" min="0" max="100" step="2" value="25"><span class="val" id="loadVal">25%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglField" type="checkbox" checked> <span data-zh="磁场箭头" data-en="field arrow">磁场箭头</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../motor-generator/" data-zh="直流电机⇄发电机:换向器版" data-en="DC motor ⇄ generator: the commutator version">直流电机⇄发电机:换向器版</a>
    <a href="../electromagnetic-induction/" data-zh="电磁感应:一切感应电机的根" data-en="EM induction: the root of it all">电磁感应:一切感应电机的根</a>
    <a href="../transformer/" data-zh="变压器:同一旋转磁场的静止版" data-en="transformer: the standing version">变压器:同一旋转磁场的静止版</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.frame.color.set(THEME === 'light' ? 0x9aa4b2 : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('三相感应电动机', 'Three-Phase Induction Motor');
  for (const r of labelRegistry) r.o.element.textContent = L(r.zh, r.en);
  buildSteps();
  setPlayLabel();
  updatePhaseBtn();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(5.0, 3.6, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  frame: mat(0x39424f, { roughness: 0.7 }),
  metal: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  cage: mat(0xd8b26a, { metalness: 0.6, roughness: 0.35, emissiveIntensity: 0.1 }),
  poleBody: mat(0x555e6b, { roughness: 0.6 }),
  coilA: mat(0xff6b6b, { emissiveIntensity: 0.3 }),
  coilB: mat(0xffa94d, { emissiveIntensity: 0.3 }),
  coilC: mat(0xffd166, { emissiveIntensity: 0.3 }),
  fieldArrow: new THREE.MeshBasicMaterial({ color: 0x4dabf7, transparent: true, opacity: 0.9 }),
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
};

/* ---------------- 场景:定子 + 鼠笼转子 ---------------- */
const POLES = 6;                 // 6 槽 → 2 极旋转磁场
const R_STATOR = 1.55;
const stator = new THREE.Group();
stator.position.y = 1.6;
scene.add(stator);
/* 机座环 */
const frameRing = new THREE.Mesh(new THREE.TorusGeometry(R_STATOR + 0.28, 0.22, 14, 48), M.frame);
stator.add(frameRing);
/* 底座 */
const basePlate = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.3, 2.2), M.frame);
basePlate.position.set(0, -1.75, 0);
stator.add(basePlate);
const feetA = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 1.6), M.frame);
feetA.position.set(-1.15, -1.3, 0);
stator.add(feetA);
const feetB = feetA.clone();
feetB.position.x = 1.15;
stator.add(feetB);

/* 六个磁极(极性由三相电流实时着色) */
const poleMeshes = [];
for (let k = 0; k < POLES; k++) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.6, 0.85), M.poleBody);
  g.add(body);
  const coil = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.07, 8, 24), [M.coilA, M.coilB, M.coilC][k % 3]);
  g.add(coil);
  const ang = k / POLES * Math.PI * 2;
  g.position.set(Math.cos(ang) * R_STATOR, 0, Math.sin(ang) * R_STATOR);
  g.rotation.y = -ang + Math.PI / 2;
  stator.add(g);
  poleMeshes.push({ g, body, ang });
}
/* 极性色(N 红 / S 蓝) 用 body 的材质克隆逐极着色 */
const poleMats = poleMeshes.map(() => new THREE.MeshStandardMaterial({
  color: 0x555e6b, roughness: 0.55, metalness: 0.15, emissive: 0x000000, emissiveIntensity: 0.5 }));
poleMeshes.forEach((p, i) => { p.body.material = poleMats[i]; });

/* 鼠笼转子 */
const rotor = new THREE.Group();
rotor.position.y = 1.6;
scene.add(rotor);
const N_BARS = 12;
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 3.4, 14), M.metal);
shaft.rotation.x = Math.PI / 2;
rotor.add(shaft);
const core = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 1.5, 32), mat(0x5b6675, { roughness: 0.6, metalness: 0.3 }));
core.rotation.x = Math.PI / 2;
rotor.add(core);
const barMat = new THREE.MeshStandardMaterial({ color: 0xd8b26a, metalness: 0.55, roughness: 0.35,
  emissive: 0xffb340, emissiveIntensity: 0.0 });
const bars = [];
for (let i = 0; i < N_BARS; i++) {
  const ang = i / N_BARS * Math.PI * 2;
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 1.66, 10), barMat);
  b.position.set(Math.cos(ang) * 1.02, Math.sin(ang) * 1.02, 0);
  b.rotation.x = Math.PI / 2;
  rotor.add(b);
  bars.push(b);
}
for (const z of [-0.85, 0.85]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.02, 0.09, 10, 40), barMat);
  ring.position.z = z;
  rotor.add(ring);
}
/* 轴带轮(看转速) */
const pulley = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.5, 0.5), M.metal);
pulley.position.z = 1.85;
rotor.add(pulley);

/* 磁场合成箭头(绕轴旋转) */
const fieldArrow = new THREE.Group();
{
  const shaftA = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.9, 10), M.fieldArrow);
  shaftA.rotation.z = Math.PI / 2;
  shaftA.position.x = 0.45;
  fieldArrow.add(shaftA);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.26, 12), M.fieldArrow);
  tip.rotation.z = -Math.PI / 2;
  tip.position.x = 1.0;
  fieldArrow.add(tip);
}
fieldArrow.position.set(0, 1.6, 0);
scene.add(fieldArrow);
const fieldGhost = fieldArrow.clone();
fieldGhost.rotateX(Math.PI);
scene.add(fieldGhost);

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(zh, en, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.textContent = zh;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, zh, en });
  return o;
}
const lblField = addLabel('旋转磁场', 'rotating field', new THREE.Vector3(0, 3.15, 0), 'g');
const lblCage = addLabel('鼠笼转子', 'squirrel cage', new THREE.Vector3(-1.9, 0.75, 0), 'f');
const lblStator = addLabel('定子:三组绕组 120° 错开', 'stator: 3 windings, 120° apart', new THREE.Vector3(2.6, 0.7, 0), 'g');
const lblStatus = addLabel('运行中', 'running', new THREE.Vector3(0, 4.1, 0), 'g');

/* ================= 物理模型 ================= */
/* 转矩-转差曲线:T(s) = Tmax·2s·s_max/(s²+s_max²);J·dω/dt = T − T_load */
const W_SYNC = 2.4 * Math.PI;    // 视觉同步角速度 rad/s
const S_MAX = 0.22, T_MAX = 3.4, J = 0.9;
let wRot = 0;                     // 转子角速度
let slip = 1;                     // (w_sync − w_rot)/w_sync
let thetaRot = 0;
let load = 0.25;                  // 0..1
let onePhaseCut = false;
let phaseCutAnim = 0;
const elLoad = document.getElementById('load');
const elLoadVal = document.getElementById('loadVal');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }

function stepPhysics(dt) {
  const wField = onePhaseCut ? 0 : W_SYNC;
  /* 断一相时:用正反转两个脉振场近似 → 净启动转矩≈0,只留下轻微摆动 */
  const s = clamp((wField - wRot) / W_SYNC, -0.5, 1.2);
  slip = clamp((W_SYNC - wRot) / W_SYNC, 0, 1.2);
  let T;
  if (onePhaseCut) {
    /* 脉振场 = 正转+反转场叠加:启动转矩抵消,仅随 thetaField 振荡 */
    T = T_MAX * 0.12 * Math.sin(performance.now() / 1000 * 6) - load * T_MAX * 0.9;
  } else {
    T = T_MAX * (2 * s * S_MAX) / (s * s + S_MAX * S_MAX) - load * T_MAX;
  }
  wRot += (T / J) * dt;
  wRot = clamp(wRot, 0, W_SYNC * 1.05);
  if (onePhaseCut && wRot < 0.05) wRot = Math.max(0, wRot + 0.4 * Math.sin(performance.now() / 1000 * 6) * dt);
  thetaRot += wRot * dt;
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '定子:三组绕组,120° 错开', be: 'Stator: three windings, 120° apart',
    d: 'A/B/C 三相各喂一对槽,空间上错开 120°——这是「旋转」的全部伏笔。',
    de: 'Phases A/B/C feed pole pairs spaced 120° in space — that offset is the entire setup for rotation.',
    act: () => { onePhaseCut = false; load = 0.1; elLoad.value = 10; elLoadVal.textContent = '10%'; updatePhaseBtn(); } },
  { b: '三相电流合成旋转磁场', be: 'Three phases weave a rotating field',
    d: '电流互差 120° 相位,六个磁极的 N/S 图样像走马灯一样绕圈平移——没有东西机械旋转,磁场自己在转。',
    de: 'Currents offset 120° in time make the N/S pattern march around the ring — nothing mechanical spins, the field itself rotates.',
    act: () => { onePhaseCut = false; updatePhaseBtn(); } },
  { b: '鼠笼感应:切磁感线 → 电流 → 安培力', be: 'The cage: cut flux → current → force',
    d: '旋转磁场扫过笼条,条里感生电流;通电条在磁场中受安培力 F = BIL,方向顺着磁场转——转子被「拖」着跑。',
    de: 'The sweeping field induces currents in the cage bars; live bars feel F = BIL along the rotation — the rotor is dragged along.',
    act: () => { onePhaseCut = false; updatePhaseBtn(); } },
  { b: '转差率:追不上才有劲', be: 'Slip: you must lag to be pushed',
    d: '转子一追上磁场就没有相对运动、没有感应、没有力——所以永远差一点。拖重载:转速掉、转差变大、笼条电流变亮。看转差读数。',
    de: 'Catch up with the field and induction vanishes — so the rotor must lag. Heavier load: speed drops, slip grows, bars glow brighter.',
    act: () => { onePhaseCut = false; load = 0.75; elLoad.value = 75; elLoadVal.textContent = '75%'; updatePhaseBtn(); } },
  { b: '断一相:哼哼不转', be: 'Cut a phase: hum, no start',
    d: '缺一相,旋转场退化成来回「脉振」的场:正转与反转分量互相抵消,启动转矩为零——电机嗡嗡发热就是不转。单相电机必须加启动装置,就是这个道理。',
    de: 'Lose a phase and the field merely pulsates: forward and backward components cancel, starting torque is zero — it hums and heats but will not start. That is why single-phase motors need a starter.',
    act: () => { onePhaseCut = true; updatePhaseBtn(); } },
];
function stepIndex() {
  if (onePhaseCut) return 4;
  if (load > 0.5) return 3;
  if (slip < 0.08) return 2;
  if (wRot > 0.4 * W_SYNC) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.1, 3);
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const btnPhase = document.getElementById('btnPhase');
const tglLabels = document.getElementById('tglLabels');
const tglField = document.getElementById('tglField');
const tglRotate = document.getElementById('tglRotate');
const stSync = document.getElementById('stSync'), stRot = document.getElementById('stRot'),
  stSlip = document.getElementById('stSlip'), stI = document.getElementById('stI');
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elLoad.addEventListener('input', () => { load = parseInt(elLoad.value, 10) / 100; elLoadVal.textContent = elLoad.value + '%'; });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
btnPhase.addEventListener('click', () => { onePhaseCut = !onePhaseCut; updatePhaseBtn(); });
function updatePhaseBtn() {
  btnPhase.classList.toggle('on', onePhaseCut);
  btnPhase.textContent = onePhaseCut ? L('恢复三相', 'restore 3 phases') : L('断一相试试(启动失败)', 'Cut one phase (fail to start)');
}
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglField.addEventListener('change', () => {
  fieldArrow.visible = fieldGhost.visible = tglField.checked;
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let thetaField = 0;
const cN = new THREE.Color(0xff5d5d), cS = new THREE.Color(0x4cc9f0), cOff = new THREE.Color(0x3a414d);
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  const t = clock.elapsedTime;
  if (playing) {
    thetaField += (onePhaseCut ? 0 : W_SYNC) * dts;
    stepPhysics(dts);
  }
  rotor.rotation.z = -thetaRot;

  /* 六极瞬时极性:B_k = cos(θ_field − k·60°);断相时变成 2cos 振荡(不旋转) */
  const barGlow = clamp(slip * 1.6, 0.03, 1.6);
  for (let k = 0; k < POLES; k++) {
    let B;
    if (onePhaseCut) B = 0.85 * Math.cos(6 * t) * Math.cos(k / POLES * Math.PI * 2);
    else B = Math.cos(thetaField - k / POLES * Math.PI * 2);
    const mag = Math.abs(B);
    const c = cOff.clone().lerp(B > 0 ? cN : cS, mag);
    poleMats[k].color.copy(c);
    poleMats[k].emissive.copy(B > 0 ? cN : cS);
    poleMats[k].emissiveIntensity = mag * 0.55;
  }
  barMat.emissiveIntensity = onePhaseCut ? barGlow * 0.25 : barGlow;

  /* 磁场箭头 */
  const fa = onePhaseCut ? (Math.cos(6 * t) > 0 ? 0 : Math.PI) + Math.sin(6 * t) * 0.35 : -thetaField;
  fieldArrow.rotation.z = fa;
  fieldGhost.rotation.z = fa + Math.PI;
  const vis = tglField.checked;
  fieldArrow.visible = vis;
  fieldGhost.visible = vis;
  M.fieldArrow.opacity = onePhaseCut ? 0.45 : 0.9;
  lblField.element.textContent = onePhaseCut
    ? L('脉振磁场:只胀缩、不旋转', 'pulsating field: no rotation')
    : L('旋转磁场(同步速)', 'rotating field (synchronous)');
  lblStatus.element.textContent = onePhaseCut
    ? L('缺相!启动转矩为零——哼哼不转', 'PHASE LOST! zero starting torque — humming, not turning')
    : wRot > 0.92 * W_SYNC ? L('运行中:转差小,电流省', 'running: small slip, efficient')
    : L('加速中:转差大,感应强', 'accelerating: big slip, strong induction');
  lblStatus.element.className = 'lbl ' + (onePhaseCut ? 'bad' : 'g');

  /* 统计 */
  const rpmSync = 1500, rpmRot = rpmSync * clamp(wRot / W_SYNC, 0, 1.05);
  stSync.textContent = rpmSync + ' rpm';
  stRot.innerHTML = rpmRot.toFixed(0) + '<small> rpm</small>';
  stSlip.innerHTML = (clamp((rpmSync - rpmRot) / rpmSync, 0, 9) * 100).toFixed(1) + '<small> %</small>';
  stI.innerHTML = (barGlow * 100).toFixed(0) + '<small> %</small>';

  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
updatePhaseBtn();
requestAnimationFrame(frame);
</script>
</body>
</html>
