<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>折射与全反射 · 临界角的抉择</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#3bc9db;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0c8599;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.b { border-color: rgba(59,201,219,.9); color: #c5f6fa; }
  .lbl.g { border-color: rgba(255,168,168,.9); color: #ffc9c9; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(12,133,153,.9); color: #0c8599; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.b { color: #3bc9db; }
  #stats .v.g { color: #ffa8a8; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #modeRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(59,201,219,.12); }
  :root[data-theme="light"] .bon.on { background: rgba(12,133,153,.08); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(59,201,219,.10); border-color: rgba(59,201,219,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,133,153,.08); border-color: rgba(12,133,153,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #c5f6fa; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="折射与全反射：临界角的抉择" data-en="Refraction &amp; Total Internal Reflection">折射与全反射：临界角的抉择</h1>
  <div class="sub" data-zh="光进水变慢,拐向法线;n₁sinθ₁ = n₂sinθ₂;从密到疏越过临界角 48.6°,折射消失、全部反射——光纤的地基 · 空格播放/暂停" data-en="Light slows in water and bends toward the normal; past the critical angle 48.6° refraction vanishes and everything reflects — the bedrock of fiber optics · Space = play/pause">光进水变慢,拐向法线;n₁sinθ₁ = n₂sinθ₂;从密到疏越过临界角 48.6°,折射消失、全部反射——光纤的地基 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="入射角 θ₁" data-en="incident θ₁">入射角 θ₁</span><span class="v b" id="stI">—</span>
  <span class="k" data-zh="折射角 θ₂" data-en="refracted θ₂">折射角 θ₂</span><span class="v b" id="stR">—</span>
  <span class="k" data-zh="临界角" data-en="critical angle">临界角</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="状态" data-en="state">状态</span><span class="v g" id="stS">—</span>
</div>

<div id="panel">
  <div id="modeRow">
    <button class="bon on" id="mPool"><b data-zh="水池:临界角实验" data-en="pool: critical angle">水池:临界角实验</b><i data-zh="水下灯照向水面" data-en="underwater lamp aims up">水下灯照向水面</i></button>
    <button class="bon" id="mFiber"><b data-zh="光纤:全反射接力" data-en="fiber: TIR relay">光纤:全反射接力</b><i data-zh="光在芯里一路弹跳" data-en="light bounces along the core">光在芯里一路弹跳</i></button>
  </div>
  <div class="row"><label data-zh="入射角 θ₁" data-en="incident θ₁">入射角 θ₁</label><input id="ang" type="range" min="5" max="85" step="1" value="40"><span class="val" id="angVal">40°</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../double-slit/" data-zh="干涉:光的波动性" data-en="interference: waves again">干涉:光的波动性</a>
    <a href="../lens-imaging/" data-zh="透镜:折射的应用(规划中)" data-en="lenses (planned)">透镜:折射的应用(规划中)</a>
    <a href="../gps/" data-zh="光纤之外的信号路(规划中)" data-en="signals without fiber (planned)">光纤之外的信号路(规划中)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
let mode = qs.get('mode') === 'fiber' ? 'fiber' : 'pool';

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('折射与全反射', 'Refraction & TIR');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.2, 2.8, 8.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.6, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  water: new THREE.MeshPhysicalMaterial({ color: 0x1d7a9e, transparent: true, opacity: 0.3, roughness: 0.2 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x9adbe8, transparent: true, opacity: 0.35, roughness: 0.15 }),
  lamp: mat(0xffd166, { emissive: 0xffd166, emissiveIntensity: 0.6 }),
  rayIn: new THREE.MeshBasicMaterial({ color: 0xffe066 }),
  rayRef: new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.9 }),
  rayOut: new THREE.MeshBasicMaterial({ color: 0x63e6be, transparent: true, opacity: 0.9 }),
  rayDim: new THREE.MeshBasicMaterial({ color: 0x63e6be, transparent: true, opacity: 0.0 }),
  normal: new THREE.LineDashedMaterial({ color: 0x9aa4b2, dashSize: 0.1, gapSize: 0.08, transparent: true, opacity: 0.6 }),
};

/* ================= 模式 A:水池 ================= */
const poolGrp = new THREE.Group();
scene.add(poolGrp);
{
  const tank = new THREE.Mesh(new THREE.BoxGeometry(6.4, 2.4, 3.0), M.frame);
  tank.material = new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.06, roughness: 0.1, side: THREE.DoubleSide });
  tank.position.set(0, 1.2, 0);
  poolGrp.add(tank);
  const water = new THREE.Mesh(new THREE.BoxGeometry(6.3, 1.2, 2.9), M.water);
  water.position.set(0, 0.6, 0);
  poolGrp.add(water);
}
const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.16, 18, 14), M.lamp);
lamp.position.set(-1.9, 0.5, 0);
poolGrp.add(lamp);
/* 法线 */
{
  const pts = [new THREE.Vector3(0, 0.2, 0), new THREE.Vector3(0, 2.0, 0)];
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const l = new THREE.Line(g, M.normal);
  l.computeLineDistances();
  poolGrp.add(l);
}
/* 三条光线:入射/反射/折射(动态重建) */
function mkRay(m, r = 0.018) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 8), m);
  scene.add(mesh);
  mesh.setSeg = (a, b) => {
    const d = new THREE.Vector3().subVectors(b, a);
    mesh.scale.y = Math.max(d.length(), 0.001);
    mesh.position.copy(a).addScaledVector(d, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
  };
  return mesh;
}
const rayIn = mkRay(M.rayIn, 0.024);
const rayRefl = mkRay(M.rayRef);
const rayRefr = mkRay(M.rayOut, 0.024);
/* 角度弧 */
const arcIn = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.012, 6, 32, Math.PI / 3), M.rayIn.clone());
arcIn.rotation.y = Math.PI / 2;
scene.add(arcIn);

/* ================= 模式 B:光纤 ================= */
const fiberGrp = new THREE.Group();
scene.add(fiberGrp);
{
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const t = i / 60;
    pts.push(new THREE.Vector3(-3.2 + t * 7.6, 1.0 + Math.sin(t * Math.PI * 1.5) * 0.55, 0));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  fiberGrp.userData.curve = curve;
  const core = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.16, 16, false), M.glass);
  fiberGrp.add(core);
  const clad = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.21, 16, false),
    new THREE.MeshPhysicalMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.14, roughness: 0.2 }));
  fiberGrp.add(clad);
}
/* 光纤内的弹跳光线(点串) */
const fbGeo = new THREE.BufferGeometry();
const FB_N = 90;
fbGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(FB_N * 3), 3));
const fbPts = new THREE.Points(fbGeo, new THREE.PointsMaterial({ size: 0.06, color: 0xffe066, transparent: true, opacity: 0.95 }));
fiberGrp.add(fbPts);
const fbProg = [];
for (let i = 0; i < FB_N; i++) fbProg.push((i / FB_N) % 1);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let theta1 = 40 * Math.PI / 180;
const N_WATER = 1.33, N_AIR = 1.0;
const CRIT = Math.asin(N_AIR / N_WATER);       // 48.6°
let tSim = 0;
function tir() { return Math.sin(theta1) > N_AIR / N_WATER; }

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblLamp = addLabel(() => L('水下灯', 'underwater lamp'), new THREE.Vector3(-1.9, 0.15, 0), 'b', poolGrp);
const lblFiber = addLabel(() => L('光纤纤芯:每次碰壁都超过临界角', 'fiber core: every bounce beats the critical angle'),
  new THREE.Vector3(0.6, 2.5, 0), 'b', fiberGrp);
const lblStatus = addLabel(() => mode === 'pool'
  ? tir() ? L('全反射!折射光消失,能量全数折返——水面像一面镜子', 'TIR! refraction gone — the surface turns mirror')
    : L('折射 + 部分反射:Snell n₁sinθ₁ = n₂sinθ₂', 'refraction + partial reflection: Snell\'s law')
  : L('光纤:全反射把光锁在纤芯里,拐弯也不漏', 'fiber: TIR keeps the light inside, bends and all'),
  new THREE.Vector3(0.6, 3.6, 0), mode === 'pool' && tir() ? 'st' : 'st');

/* ================= 讲解步骤 ================= */
const STEPS_POOL = [
  { b: '光在水里更慢', be: 'Light slows in water',
    d: '介质里的光速 c/n——水 n=1.33,光速降到四分之三。跨界面时方向随之改变:斯涅尔定律 n₁sinθ₁ = n₂sinθ₂。',
    de: 'In water light crawls at c/n; crossing the border bends the ray: n₁sinθ₁ = n₂sinθ₂.',
    act: () => { theta1 = 30 * Math.PI / 180; document.getElementById('ang').value = 30; document.getElementById('angVal').textContent = '30°'; } },
  { b: '从密到疏,偏离法线', be: 'Dense → rare: bending away',
    d: '水下灯往上照:进入空气后折射角比入射角大——光线「挣脱」时被甩开。这就是水里的筷子看着折断的原因。',
    de: 'Exiting into air the ray bends away from the normal — the broken-pencil illusion in a glass of water.',
    act: () => { theta1 = 30 * Math.PI / 180; document.getElementById('ang').value = 30; document.getElementById('angVal').textContent = '30°'; } },
  { b: '临界角 48.6°', be: 'The critical angle: 48.6°',
    d: '入射角越大,折射角越靠近水面;sinθ₂ = 1 时折射光贴着水面爬行——此时入射角就是临界角 arcsin(1/1.33)。',
    de: 'Push the angle until the refracted ray skims the surface: that incident angle is arcsin(1/1.33) ≈ 48.6°.',
    act: () => { theta1 = 48 * Math.PI / 180; document.getElementById('ang').value = 48; document.getElementById('angVal').textContent = '48°'; } },
  { b: '全反射:水面的镜子', be: 'TIR: the surface becomes a mirror',
    d: '越过临界角,折射光直接消失,能量全部折返水中——从水下往上看,水面亮如银镜。钻石的火彩也是这招。',
    de: 'Past critical, refraction vanishes and everything reflects — from below, the surface looks like silver. Diamond fire works the same.',
    act: () => { theta1 = 60 * Math.PI / 180; document.getElementById('ang').value = 60; document.getElementById('angVal').textContent = '60°'; } },
];
const STEPS_FIBER = [
  { b: '一根玻璃丝', be: 'A strand of glass',
    d: '纤芯折射率比包层略高——光从芯射向壁时,永远超过临界角。',
    de: 'The core index beats the cladding slightly — every wall strike exceeds the critical angle.',
    act: () => setMode('fiber') },
  { b: '全反射接力', be: 'TIR relay',
    d: '每次碰壁都全反射,光被死死锁在纤芯里,沿任意弯曲的路径前进——拐弯也不漏。',
    de: 'Every bounce is total: the ray stays locked in the core, following any curve.',
    act: () => setMode('fiber') },
  { b: '为什么赢过铜线', be: 'Why it beats copper',
    d: '光不发热、不受电磁干扰、一根纤维的带宽顶几千根铜线——全球互联网的骨干躺在海底,就是玻璃丝。',
    de: 'No heat, no interference, one fiber out-carries thousands of copper pairs — the internet\'s backbone is glass on the seafloor.',
    act: () => setMode('fiber') },
];
const STEPS = () => mode === 'pool' ? STEPS_POOL : STEPS_FIBER;
function stepIndex() {
  if (mode === 'fiber') return 1;
  if (tir()) return 3;
  if (theta1 > 0.75) return 2;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS().forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elAng = document.getElementById('ang');
const elAngVal = document.getElementById('angVal');
const btnPool = document.getElementById('mPool');
const btnFiber = document.getElementById('mFiber');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stI = document.getElementById('stI'), stR = document.getElementById('stR'),
  stC = document.getElementById('stC'), stS = document.getElementById('stS');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setMode(m) {
  mode = m;
  btnPool.classList.toggle('on', m === 'pool');
  btnFiber.classList.toggle('on', m === 'fiber');
  poolGrp.visible = m === 'pool';
  rayIn.visible = m === 'pool';
  rayRefl.visible = m === 'pool';
  rayRefr.visible = m === 'pool';
  arcIn.visible = m === 'pool';
  fiberGrp.visible = m === 'fiber';
  camera.position.set(...(m === 'pool' ? [1.2, 2.8, 8.6] : [0.6, 3.4, 7.6]));
  controls.target.set(...(m === 'pool' ? [0.6, 1.0, 0] : [0.6, 1.0, 0]));
  buildSteps();
}
btnPool.addEventListener('click', () => setMode('pool'));
btnFiber.addEventListener('click', () => setMode('fiber'));
elAng.addEventListener('input', () => { theta1 = parseInt(elAng.value, 10) * Math.PI / 180; elAngVal.textContent = elAng.value + '°'; });
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
const V3 = THREE.Vector3;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;

  if (mode === 'pool') {
    /* 入射:灯 → 界面点 */
    const hit = new V3(-1.9 + Math.tan(theta1) * 0.5, 1.2, 0);
    lamp.position.set(-1.9, 0.5, 0);
    rayIn.setSeg(new V3(-1.9, 0.5, 0), hit);
    /* 反射:对称 */
    const reflDir = new V3(Math.sin(theta1), Math.cos(theta1), 0);
    rayRefl.setSeg(hit, hit.clone().addScaledVector(reflDir, 1.7));
    /* 折射 */
    const sin2 = N_WATER * Math.sin(theta1) / N_AIR;
    if (sin2 <= 1) {
      const th2 = Math.asin(sin2);
      const refrDir = new V3(Math.sin(th2), -Math.cos(th2), 0);
      const trans = tir() ? 0 : 0.9;
      rayRefr.material.opacity = trans;
      rayRefr.setSeg(hit, hit.clone().addScaledVector(refrDir, 2.2));
    } else {
      rayRefr.material.opacity = 0;
    }
    rayRefl.material.opacity = tir() ? 0.95 : 0.35;
    /* 弧 */
    arcIn.position.copy(hit);
    arcIn.rotation.x = -Math.PI / 2;
    arcIn.rotation.z = theta1;

    stI.textContent = Math.round(theta1 * 180 / Math.PI) + '°';
    stR.textContent = tir() ? '—' : Math.round(Math.asin(clamp(N_WATER * Math.sin(theta1), 0, 1)) * 180 / Math.PI) + '°';
    stC.textContent = (CRIT * 180 / Math.PI).toFixed(1) + '°';
    stS.textContent = tir() ? L('全反射', 'TIR') : L('折射中', 'refracting');
    stS.className = 'v ' + (tir() ? 'g' : 'b');
  } else {
    /* 光纤:点沿曲线跑 */
    const curve = fiberGrp.userData.curve;
    fbProg.forEach((p, i) => {
      if (playing) fbProg[i] = (p + dts * 0.12) % 1;
      const pt = curve.getPoint(fbProg[i]);
      fbGeo.attributes.position.setXYZ(i, pt.x, pt.y, Math.sin(tSim * 3 + i) * 0.02);
    });
    fbGeo.attributes.position.needsUpdate = true;
  }

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setMode(mode);
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
