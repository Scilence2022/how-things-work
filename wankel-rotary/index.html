<style>

    22% { transform: scale(1.9); opacity: 1; }

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10151c);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.stand.color.set(THEME === 'light' ? 0x9aa6b4 : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('转子发动机 · 偏心轴 3:1', 'Wankel rotary engine · 3:1 eccentric');
  for (const r of labelReg) if (r.o.element.childElementCount === 0) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.4, 2.5, 5.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.92, emissive: 0x000000 }),
  stand: mat(0x39424f, { roughness: 0.7 }),
  house: mat(0x9fb0c3, { metalness: 0.55, roughness: 0.42, side: THREE.DoubleSide }),
  rotor: mat(0xd6dade, { metalness: 0.7, roughness: 0.32, side: THREE.DoubleSide }),
  steel: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25, side: THREE.DoubleSide }),
  dark:  mat(0x525a66, { metalness: 0.75, roughness: 0.45 }),
  brass: mat(0xd5a34c, { metalness: 0.75, roughness: 0.3 }),
  seal:  mat(0xe0a63e, { metalness: 0.6, roughness: 0.35, emissive: 0xff9d2a, emissiveIntensity: 0.35, side: THREE.DoubleSide }),
  ceramic: mat(0xe8e2d6, { roughness: 0.6, metalness: 0.05 }),
  portI: mat(0x7fb0e8, { metalness: 0.3, roughness: 0.5 }),
  portE: mat(0xb08a78, { metalness: 0.3, roughness: 0.5 }),
  red:   mat(0xe63946, { metalness: 0.4, roughness: 0.4 }),
  ptr:   mat(0x525a66, { metalness: 0.75, roughness: 0.45 }),
};

/* ---------------- 几何:摆线缸体 / 转子 / 偏心轴 ---------------- */
const PI = Math.PI, TAU = 2 * PI, TAU3 = 6 * PI;
const R = 1, E = 0.15;                           // 创成半径 / 偏心距
const W = 0.556;                                 // 棱面弧伸展(按全运动对缸壁间隙≈0.03 数值求解)
const KC = (R * R - W * W) / (2 * W - R);        // 棱面弧圆心偏距
const RF = KC + W;                               // 棱面弧半径
const DEPTH = 0.56, RDEP = 0.44;                 // 缸体 / 转子厚度
/* 缸体参数 ψ:进气口 2π · 排气口 0.5π · 火花塞 5.405π(最小容积腔的挤压袋位)
   点火 3.47π(塞尖入腔即燃,恰在最小容积 3.5π) · 排气口开 4.5π(最大容积前泄压) */
const PSI_IN = 2 * PI, PSI_EX = 0.5 * PI, PSI_PLUG = 5.405 * PI, PSI_FIRE = 3.47 * PI, PSI_EVO = 4.5 * PI;
const hou = (psi, out) => out.set(E * Math.cos(psi) + R * Math.cos(psi / 3), E * Math.sin(psi) + R * Math.sin(psi / 3));
const houN = (psi, out) => {                     // 摆线外法线
  const tx = -E * Math.sin(psi) - (R / 3) * Math.sin(psi / 3);
  const ty = E * Math.cos(psi) + (R / 3) * Math.cos(psi / 3);
  out.set(ty, -tx).normalize();
  const h = hou(psi, _v2a);
  if (out.dot(h) < 0) out.negate();
  return out;
};
const _v2a = new THREE.Vector2(), _v2b = new THREE.Vector2(), _v2c = new THREE.Vector2();
const _v3a = new THREE.Vector3(), _v3b = new THREE.Vector3();

const engGrp = new THREE.Group();
engGrp.position.y = 0.55;
scene.add(engGrp);

/* 缸体环形拉伸体(外轮廓 = 摆线沿法线加厚) */
{
  const N = 200, off = 0.17, sh = new THREE.Shape();
  const pt = new THREE.Vector2(), nv = new THREE.Vector2();
  const outer = [];
  for (let i = 0; i <= N; i++) {
    const psi = i / N * TAU3;
    hou(psi, pt); houN(psi, nv);
    outer.push(pt.x + nv.x * off, pt.y + nv.y * off);
  }
  sh.moveTo(outer[0], outer[1]);
  for (let i = 1; i <= N; i++) sh.lineTo(outer[i * 2], outer[i * 2 + 1]);
  for (let i = N; i >= 0; i--) {
    const psi = i / N * TAU3; hou(psi, pt);
    sh.lineTo(pt.x, pt.y);
  }
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: DEPTH, bevelEnabled: false });
  g.translate(0, 0, -DEPTH / 2);
  const house = new THREE.Mesh(g, M.house);
  house.renderOrder = 4;
  engGrp.add(house);
}

/* 转子(三段圆弧棱面 + 中心孔) */
const rotorGrp = new THREE.Group();
engGrp.add(rotorGrp);
{
  const sh = new THREE.Shape();
  for (let j = 0; j < 3; j++) {
    const a0 = j * TAU / 3;
    const cx = KC * Math.cos(a0 + 4 * PI / 3), cy = KC * Math.sin(a0 + 4 * PI / 3);
    const s0 = Math.atan2(R * Math.sin(a0) - cy, R * Math.cos(a0) - cx);
    let s1 = Math.atan2(R * Math.sin(a0 + TAU / 3) - cy, R * Math.cos(a0 + TAU / 3) - cx);
    while (s1 < s0 - 1e-6) s1 += TAU;
    for (let k = 0; k <= 18; k++) {
      if (j > 0 && k === 0) continue;
      const a = s0 + (s1 - s0) * k / 18;
      const x = cx + RF * Math.cos(a), y = cy + RF * Math.sin(a);
      if (j === 0 && k === 0) sh.moveTo(x, y); else sh.lineTo(x, y);
    }
  }
  sh.closePath();
  const hole = new THREE.Path();
  hole.absarc(0, 0, 0.2, 0, TAU, true);
  sh.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(sh, { depth: RDEP, bevelEnabled: false });
  g.translate(0, 0, -RDEP / 2);
  const rotor = new THREE.Mesh(g, M.rotor);
  engGrp.add(rotor);
  rotorGrp.add(rotor);

  for (let i = 0; i < sparkN; i++) {

const prevU = [0, 0, 0];
const fireT = [];
elRpm.value = rpm; elRpmVal.textContent = rpm + ' rpm';
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';

const omBase = () => Math.min(rpm, 720) / 60 / 6 * TAU;    // 画面按约 1:6 放慢,>720rpm 封顶
function jumpTo(p) {
  phi = ((p % TAU3) + TAU3) % TAU3;
  boost = 0;
  for (let i = 0; i < 3; i++) prevU[i] = uOf(i);
  flashK = [0, 0, 0];
}
function onFire(i) {
  fires++;
  flashK[i] = 1;
  boost = Math.min(boost + 0.55, 1.6);
  lastFire = phi;
  fireT.push(tSim);
  if (fireT.length > 6) fireT.shift();
  firePop();
  burst(12);
}
function crossed(prev, cur, x) {
  if (cur >= prev) return prev < x && x <= cur;
  return x > prev || x <= cur;
}
function fastForward(sec) {
  const h = 1 / 240;
  let n = Math.min(Math.round(sec / h), 24000);
  for (let k = 0; k < n; k++) {
    phi = (phi + omBase() * h) % TAU3;
    tSim += h;
    for (let i = 0; i < 3; i++) {
      const u = uOf(i);
      if (crossed(prevU[i], u, PSI_FIRE)) onFire(i);
      prevU[i] = u;
    }
  }
}

/* ---------------- 每帧几何 ---------------- */
const chCent = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
function updateWorld(dt) {
  const th = phi / 3;
  /* 转子:中心沿偏心圆 + 自转 1/3 */
  rotorGrp.position.set(E * Math.cos(phi), E * Math.sin(phi), 0);
  rotorGrp.rotation.z = th;
  throwGrp.position.copy(rotorGrp.position);
  throwGrp.rotation.z = phi;
  ptrGrp.rotation.z = phi;
  /* 三腔弧线 */
  for (let i = 0; i < 3; i++) {
    const u = uOf(i);
    const a0 = i * TAU / 3;
    const cx = KC * Math.cos(a0 + 4 * PI / 3), cy = KC * Math.sin(a0 + 4 * PI / 3);
    const cosT = Math.cos(th), sinT = Math.sin(th);
    const kwx = rotorGrp.position.x + cx * cosT - cy * sinT;
    const kwy = rotorGrp.position.y + cx * sinT + cy * cosT;
    hou(u, _v2c);
    const s0 = Math.atan2(_v2c.y - kwy, _v2c.x - kwx);
    hou(u + TAU, _v2c);
    let s1 = Math.atan2(_v2c.y - kwy, _v2c.x - kwx);
    while (s1 < s0 - 1e-6) s1 += TAU;
    let cx0 = 0, cy0 = 0;
    for (let s = 0; s < NH; s++) {
      const f = s / (NH - 1);
      hou(u + f * TAU, Hp[i][s]);
      const a = s0 + (s1 - s0) * f;
      Fp[i][s].set(kwx + RF * Math.cos(a), kwy + RF * Math.sin(a));
      cx0 += Hp[i][s].x + Fp[i][s].x; cy0 += Hp[i][s].y + Fp[i][s].y;
    }
    chCent[i].set(cx0 / (2 * NH), cy0 / (2 * NH), 0);
    /* 相位着色 */
    const ph = phaseOf(u);
    const col = _gc;
    let op;
    if (ph === 0) { col.copy(C_INTAKE); op = 0.28; }
    else if (ph === 1) { const k = clamp((u - PSI_IN) / (PSI_FIRE - PSI_IN), 0, 1); col.lerpColors(C_INTAKE, C_COMP, k); op = 0.26 + 0.18 * k; }
    else if (ph === 2) { const k = clamp((u - PSI_FIRE) / (PSI_EVO - PSI_FIRE), 0, 1); col.lerpColors(C_BURN, C_EXH, k * 0.6); op = 0.5 - 0.12 * k; }
    else { const k = clamp((u - PSI_EVO) / (TAU3 - PSI_EVO), 0, 1); col.lerpColors(C_EXH, C_EXH, 0); op = 0.34 - 0.16 * k; }
    col.lerp(C_FLASH, Math.min(1, flashK[i] * 0.85));
    op += flashK[i] * 0.3;
    gasMat[i].color.copy(col);
    gasMat[i].opacity = op;
    /* 顶点写入 */
    const p = gasGeo[i].attributes.position.array;
    const Hf = 0, Ff = 22, Hb = 44, Fb = 66;
    for (let s = 0; s < NH; s++) {
      p[(Hf + s) * 3] = Hp[i][s].x; p[(Hf + s) * 3 + 1] = Hp[i][s].y; p[(Hf + s) * 3 + 2] = GZ;
      p[(Ff + s) * 3] = Fp[i][s].x; p[(Ff + s) * 3 + 1] = Fp[i][s].y; p[(Ff + s) * 3 + 2] = GZ;
      p[(Hb + s) * 3] = Hp[i][s].x; p[(Hb + s) * 3 + 1] = Hp[i][s].y; p[(Hb + s) * 3 + 2] = -GZ;
      p[(Fb + s) * 3] = Fp[i][s].x; p[(Fb + s) * 3 + 1] = Fp[i][s].y; p[(Fb + s) * 3 + 2] = -GZ;
    }
    gasGeo[i].attributes.position.needsUpdate = true;
    /* 腔标签 */
    const Vf = Math.round(100 * chamberArea(i) / AMAX);
    chLbl[i].div.textContent = L(`腔${['Ⅰ', 'Ⅱ', 'Ⅲ'][i]} ${PH_Z[ph]} · V ${Vf}%`, `Ch.${['I', 'II', 'III'][i]} ${PH_E[ph]} · V ${Vf}%`);
    chLbl[i].div.className = 'lbl ' + ['in', 'comp', 'power', 'exh'][ph];
    chLbl[i].o.position.set(chCent[i].x, chCent[i].y, 0.42);
  }
  sparkMesh.material.opacity = Math.min(1, Math.max(flashK[0], flashK[1], flashK[2]) * 1.4);
  sparkMesh.scale.setScalar(0.7 + Math.max(...flashK) * 1.3);
  sparkLight.intensity = Math.max(...flashK) * 9;
  M.seal.emissiveIntensity = 0.3 + Math.max(...flashK) * 0.6;
}

/* 腔内混合气粒子 + 口部气流 */
function updateGasParticles(dt) {
  for (let i = 0; i < gasN; i++) {
    const d = gasD[i];
    const u = uOf(d.ch), ph = phaseOf(u);
    d.a = (d.a + dt * 0.05 * d.sp) % 1;
    const Hpt = Hp[d.ch][Math.floor(d.a * (NH - 1))], Fpt = Fp[d.ch][Math.floor(d.a * (NH - 1))];
    let k = ph === 0 ? clamp(u / PSI_IN, 0, 1) : ph === 1 ? 1 : ph === 2 ? 1 : 1 - clamp((u - PSI_EVO) / (TAU3 - PSI_EVO), 0, 1);
    const active = k > 0.03;
    if (active) {
      const b = clamp(d.b, 0.08, 0.92);
      const x = Fpt.x + (Hpt.x - Fpt.x) * b + 0.02 * Math.sin(d.ph + tSim * 3 * d.sp);
      const y = Fpt.y + (Hpt.y - Fpt.y) * b + 0.02 * Math.cos(d.ph + tSim * 2.6 * d.sp);
      setInst(gasP, i, x, y, (d.ph - PI) * 0.03, (0.6 + 0.5 * d.sp) * k);
      let c = _gc;
      if (ph === 0) c.copy(C_INTAKE);
      else if (ph === 1) c.lerpColors(C_INTAKE, C_COMP, clamp(u / PSI_FIRE, 0, 1));
      else if (ph === 2) c.copy(C_BURN).lerp(C_FLASH, Math.min(1, flashK[d.ch]));
      else c.copy(C_EXH);
      gasP.setColorAt(i, c);
    } else setInst(gasP, i, 0, -10, 0, 0.0001);
  }
  gasP.instanceMatrix.needsUpdate = true;
  if (gasP.instanceColor) gasP.instanceColor.needsUpdate = true;
  /* 口部气流:进气口/排气口当前连接的腔 */
  const cIn = portChamber(PSI_IN), cEx = portChamber(PSI_EX);
  const flowIn = phaseOf(uOf(cIn)) === 0 ? 1 : 0;
  const flowEx = phaseOf(uOf(cEx)) === 3 ? 1 : 0;
  for (let i = 0; i < puffN; i++) {
    const isIn = i < 10;
    const ch = isIn ? cIn : cEx;
    const f = ((i % 10) / 10 + tSim * 0.55) % 1;
    const on = (isIn ? flowIn : flowEx) > 0;
    if (on) {
      const m = isIn ? mouthI : mouthE, cc = chCent[ch];
      const x = m.x + (cc.x - m.x) * f, y = m.y + (cc.y - m.y) * f;
      setInst(puffI, i, x, y, 0, (isIn ? 1 - f * 0.4 : 0.5 + f * 0.8) * (0.7 + 0.3 * Math.sin(f * PI)));
    } else setInst(puffI, i, 0, -10, 0, 0.0001);
  }
  puffI.instanceMatrix.needsUpdate = true;
}
function portChamber(psi) {
  for (let i = 0; i < 3; i++) {
    if (((psi - uOf(i)) % TAU3 + TAU3) % TAU3 < TAU) return i;
  }
  return 0;
}

/* 预扫容积曲线:Vmax / 几何压缩比 */
let AMAX = 1, AMIN = 1;
{
  const probe = u => {
    phi = u;
    const cx = KC * Math.cos(4 * PI / 3), cy = KC * Math.sin(4 * PI / 3);
    const th = u / 3;
    const kwx = E * Math.cos(u) + cx * Math.cos(th) - cy * Math.sin(th);
    const kwy = E * Math.sin(u) + cx * Math.sin(th) + cy * Math.cos(th);
    hou(u, _v2c);
    const s0 = Math.atan2(_v2c.y - kwy, _v2c.x - kwx);
    hou(u + TAU, _v2c);
    let s1 = Math.atan2(_v2c.y - kwy, _v2c.x - kwx);
    while (s1 < s0 - 1e-6) s1 += TAU;
    for (let s = 0; s < NH; s++) {
      const f = s / (NH - 1);
      hou(u + f * TAU, Hp[0][s]);
      const a = s0 + (s1 - s0) * f;
      Fp[0][s].set(kwx + RF * Math.cos(a), kwy + RF * Math.sin(a));
    }
    return chamberArea(0);
  };
  let mx = 0, mn = 1e9;
  for (let k = 0; k <= 360; k++) {
    const A = probe(k / 360 * TAU3);
    mx = Math.max(mx, A); mn = Math.min(mn, A);
  }
  AMAX = mx; AMIN = mn;
  phi = 0;
}
const CR = AMAX / AMIN;

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0;
const elSteps = document.getElementById('steps');
function stepIndex() {
  if (phi - lastFire >= 0 && (phi - lastFire) < 0.3 && fires > 0) return 4;
  return phaseOf(uOf(0));
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const mul = dt * speed * (tglSlow.checked ? 0.12 : 1);
  if (playing) {
    phi = (phi + (omBase() + boost) * mul) % TAU3;
    tSim += dt;
    boost *= Math.exp(-dt * 1.1);
    for (let i = 0; i < 3; i++) {
      const u = uOf(i);
      if (crossed(prevU[i], u, PSI_FIRE)) onFire(i);
      prevU[i] = u;
      flashK[i] = Math.max(0, flashK[i] - dt * 3.2);
    }
  }
  updateWorld(dt);
  updateGasParticles(dt);
  updateSparks(dt);
  /* 读数 */
  document.getElementById('stShaft').textContent = rpm + ' rpm';
  document.getElementById('stRotor').textContent = Math.round(rpm / 3) + ' rpm';
  if (formulaAcc > 0.25) {
    formulaAcc = 0;
    let h = '';
    for (let i = 0; i < 3; i++) {
      const ph = phaseOf(uOf(i));
      h += `<b style="color:${PH_COL[ph]}">${L(PH_Z[ph], PH_E[ph])}</b>` + (i < 2 ? '<small> · </small>' : '');
    }
    document.getElementById('stPhase').innerHTML = h;
    document.getElementById('stFires').textContent = '3';
    let rate = omBase() / TAU;
    if (fireT.length >= 2) rate = (fireT.length - 1) / (fireT[fireT.length - 1] - fireT[0]);
    document.getElementById('stPulse').innerHTML = rate.toFixed(2) + '<small> Hz</small>';
    document.getElementById('stCount').textContent = fires;
    updateFormula();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  for (const r of labelReg) if (labelsOn && r.vis() && r.o.element.childElementCount === 0) r.o.element.textContent = r.text();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
document.getElementById('btnReset').addEventListener('click', () => {
  jumpTo(0); fires = 0; fireT.length = 0; lastFire = -99; tSim = 0;
});

/* ================= 初始化(URL 参数) ================= */
fastForward(clamp(qsFloat('t', 0), 0, 120));
setMode('cut');
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
