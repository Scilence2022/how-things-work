<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<style>

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;

  #panel.collapsed > :not(#panelToggle) { display: none; }

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="DNA 测序与双脱氧链终止" data-en="DNA Sequencing &amp; Dideoxy Chain Termination">DNA 测序与双脱氧链终止</h1>
  <div class="sub" data-zh="聚合酶本会忠实抄完 DNA,但反应里掺 ~1% 的双脱氧核苷酸(ddNTP):它缺 3′-OH,被接上后下一个磷酸二酯键无处成键——链在此终止;四种 ddNTP 各带一种荧光,于是模板每个位置都会随机终止出一批片段:终止于位置 i 的片段长度都是 i,颜色 = 位置 i 的碱基;毛细管电泳把片段按长度排队(短的跑得快),检测窗口依次读出荧光——长度的顺序就是位置的顺序,颜色的顺序就是碱基的顺序 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Polymerase would copy DNA faithfully, but ~1% dideoxynucleotides (ddNTPs) are mixed in: lacking the 3′-OH, once incorporated no next phosphodiester bond can form — the chain stops there. Four ddNTPs carry four fluorescent colors, so every template position randomly spawns terminated fragments: all fragments ending at position i have length i, colored by the base at i. Capillary electrophoresis queues them by length (short runs fast) and the detection window reads fluorescence in order — length order becomes position order, color order becomes base order · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">DNA 测序与双脱氧链终止</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="反应轮次" data-en="Synthesis rounds">反应轮次</span><span class="v" id="stRd">—</span>
  <span class="k" data-zh="终止片段" data-en="Terminated frags">终止片段</span><span class="v" id="stFr">—</span>
  <span class="k" data-zh="平均终止长度" data-en="Mean length">平均终止长度</span><span class="v" id="stLen">—</span>
  <span class="k" data-zh="已读长度" data-en="Read so far">已读长度</span><span class="v ok" id="stRead">—</span>
  <span class="k" data-zh="检测事件" data-en="Detector events">检测事件</span><span class="v" id="stDet">—</span>
  <span class="k" data-zh="窗口终止率 p′" data-en="p′ per window">窗口终止率 p′</span><span class="v warn" id="stP">—</span>
</div>

<div id="plot">
  <h3 data-zh="色谱图:峰位置 = 片段长度 = 终止位置,峰色 = 该位碱基(四色一管,依次经过检测窗口)" data-en="Chromatogram: peak position = fragment length = stop position; peak color = the base there (four colors, one tube)">色谱图:峰位置 = 片段长度 = 终止位置,峰色 = 该位碱基</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip.b" data-zh="模板链:被读的原件" data-en="template: the original being read">模板链:被读的原件</span>
    <span class="chip.g" data-zh="dNTP:有 3′-OH,链继续长" data-en="dNTP: has 3′-OH, chain grows on">dNTP:有 3′-OH,链继续长</span>
    <span class="chip.r" data-zh="ddNTP:缺 3′-OH,掺入即终止" data-en="ddNTP: no 3′-OH, stops the chain">ddNTP:缺 3′-OH,掺入即终止</span>
    <span class="chip.v" data-zh="聚合酶:只在 3′ 端成键" data-en="polymerase: bonds only at 3′">聚合酶:只在 3′ 端成键</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnTpl" data-zh="换一段模板" data-en="Swap template">换一段模板</button>
    <button class="abtn" id="btnRerun" data-zh="重跑反应" data-en="Rerun reaction">重跑反应</button>
    <button class="abtn" id="btnNgs" data-zh="与二代测序对照" data-en="Compare with NGS">与二代测序对照</button>
  </div>
  <div class="row"><label data-zh="ddNTP 掺入比" data-en="ddNTP ratio">ddNTP 掺入比</label><input id="sRatio" type="range" min="0" max="16" step="1" value="6"><span class="val" id="sRatioVal">1:200</span></div>
  <div class="row"><label data-zh="模拟速度" data-en="Sim speed">模拟速度</label><input id="sSpd" type="range" min="0.25" max="3" step="0.05" value="1"><span class="val" id="sSpdVal">×1.0</span></div>
  <div class="row"><label data-zh="步骤" data-en="Step">步骤</label><input id="sStep" type="range" min="0" max="1000" value="0"><span class="val" id="sStepVal">—</span></div>
  <div id="seq">
    <div class="sq"><span class="sqk" data-zh="模板 3′←" data-en="Template 3′←">模板 3′←</span><span class="letters" id="seqT"></span></div>
    <div class="sq"><span class="sqk" data-zh="读出 5′→" data-en="Read 5′→">读出 5′→</span><span class="letters" id="seqR"></span></div>
  </div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglPlot" type="checkbox" checked> <span data-zh="色谱图" data-en="Chromatogram">色谱图</span></label>
      <label><input id="tglNgs" type="checkbox"> <span data-zh="NGS 芯片" data-en="NGS chip">NGS 芯片</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../pcr/" data-zh="PCR:海量拷贝是测序的原料" data-en="PCR: mass copying feeds sequencing">PCR 扩增</a>
    <a href="../gel-electrophoresis/" data-zh="凝胶电泳:按长度排队的老办法" data-en="gel electrophoresis: the original length sorter">凝胶电泳</a>
    <a href="../dna-replication/" data-zh="DNA 复制:聚合酶的原装工作" data-en="DNA replication: polymerase's day job">DNA 复制</a>
    <a href="../transcription/" data-zh="转录:另一台读取机器" data-en="transcription: the other reading machine">转录</a>
  </div>
</div>

<script type="module">

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;
const hex = c => '#' + c.toString(16).padStart(6, '0');

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
  plateM.color.setHex(dark ? 0x232935 : 0xc4cdd8);
  slabM.color.setHex(dark ? 0x1a1f27 : 0xbcc6d2);
  drawChromatogram();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L(

/* 理论几何分布曲线(换掺入比时重算) */
let geoCurve = null;
function buildGeoCurve() {
  if (geoCurve) { scene.remove(geoCurve); geoCurve.geometry.dispose(); }
  const pts = [];
  const ex = [];
  for (let i = 1; i <= N; i++) ex.push(pEff * Math.pow(1 - pEff, i - 1));
  const mx = Math.max(...ex, 1e-9);
  for (let i = 1; i <= N; i++)
    pts.push(new THREE.Vector3(LIB_X0 + (i - 1) * LIB_PITCH, -0.62 + ex[i - 1] / mx * LIB_HMAX, LIB_Z));
  geoCurve = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x9775fa, transparent: true, opacity: 0.85 }));
  geoCurve.visible = stepIdx === 2 || stepIdx === 3;
  scene.add(geoCurve);
}
function updateLibBars() {
  const mx = Math.max(...counts, 1);
  for (let i = 1; i <= N; i++) {
    const h = counts[i] > 0 ? clamp(counts[i] / mx * LIB_HMAX, 0.04, LIB_HMAX) : 0.02;
    _M4.compose(_V.set(LIB_X0 + (i - 1) * LIB_PITCH, -0.67 + h / 2, LIB_Z), _Q.identity(), _S.set(0.13, h, 0.13));
    libBars.setMatrixAt(i - 1, _M4);
  }
  libBars.instanceMatrix.needsUpdate = true;
}

   (真实反应管里有 ~10^12 条模板拷贝同时延伸,演示取一瞥) */

/* 虚拟链抽样:逐格掷骰,掺 dd(概率 p′)即终止于该格;走完 24 格仍未终止 = 全长 runoff */
function sampleVirtualChains(nChains) {
  for (let c = 0; c < nChains; c++) {
    let stop = 0;
    for (let i = 1; i <= N; i++) {
      if (Math.random() < pEff) { stop = i; break; }
    }
    if (stop > 0) { counts[stop]++; fragTotal++; injQueue.push(stop); }
  }
}

/* 可视化聚合酶:enzymePos ∈ [0..N],延伸速度 ENV 格/秒;终止 → 闪光并回位 */
let enzPos = 0, enzReturning = 0;
const ENV = 5.0;                 /* 格/秒 @ ×1 */
const VB_PER_PASS = 30;          /* 每轮虚拟链数 */
function stepEnzyme(dt) {
  if (enzReturning > 0) {        /* 终止后快速回到起点,开始下一条链 */
    enzReturning -= dt;
    if (enzReturning <= 0) { enzPos = 0; strandLen = 0; strandDD.fill(false); }
    return;
  }
  const old = enzPos;
  enzPos += dt * ENV;
  const iNext = Math.floor(old) + 1;
  if (enzPos >= iNext && iNext <= N) {
    enzPos = iNext;              /* 整格推进,一次处理一格 */
    strandLen = iNext;
    if (Math.random() < pEff) {
      /* 掺入 ddNTP:缺 3′-OH,下一个磷酸二酯键无处成键 → 链终止 */
      const base = COMP[SEQ[iNext - 1]];
      strandDD[iNext - 1] = true;
      flashT = 1.1;
      flashMsgZ = `终止于第 ${iNext} 格 · 片段长 ${iNext} · 荧光 ${base}`;
      flashMsgE = `stopped at slot ${iNext} · length ${iNext} · fluor ${base}`;
      counts[iNext]++; fragTotal++; injQueue.push(iNext);
      enzReturning = 0.32;
      flashRing.position.set(tmplPos(iNext), RY, 0);
      passes++; sampleVirtualChains(VB_PER_PASS);
    } else if (iNext >= N) {
      /* 走完模板仍无 dd 掺入:全长 runoff(无荧光,不计入读序) */
      strandLen = N;
      passes++; sampleVirtualChains(VB_PER_PASS);
      enzReturning = 0.32;
    }
  }
}

/* 毛细管:从队列进样 → 按迁移率泳动 → 过检测窗口记一次荧光事件 */
let injTimer = 0;
function stepCapillary(dt) {
  /* 进样:每 0.12 s 模拟时间放行一批(最多 8 条),队列封顶让「短先到」次序可辨 */
  injTimer += dt;
  if (injTimer >= 0.12) {
    injTimer = 0;
    if (injQueue.length > 240) injQueue.length = 240;
    let n = 0, tinted = false;
    for (let i = 0; i < NFRAG && n < 8 && injQueue.length; i++) {
      const f = fragPool[i];
      if (f.alive) continue;
      f.alive = true; f.len = injQueue.shift(); f.x = CX0 + 0.2;
      frags.setColorAt(i, _C.setHex(BASE_C[COMP[SEQ[f.len - 1]]]));
      tinted = true; n++;
    }
    if (tinted && frags.instanceColor) frags.instanceColor.needsUpdate = true;
  }
  /* 泳动:速度 ∝ 迁移率;过 DET_X → 色谱图 +1 峰 */
  const v0 = 1.55;
  for (let i = 0; i < NFRAG; i++) {
    const f = fragPool[i];
    if (!f.alive) continue;
    f.x += dt * v0 * fragMob(f.len);
    if (f.x >= DET_X) {
      f.alive = false;
      const base = COMP[SEQ[f.len - 1]];
      amps[base][f.len]++;
      detected++;
      if (f.len > readLen) readLen = f.len;
    }
  }
}

/* ---------------- 色谱图(HTML 覆盖层 canvas) ---------------- */
const plotCv = document.getElementById('plotCv');
function drawChromatogram() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const cLine = css.getPropertyValue('--panel-border').trim() || 'rgba(255,255,255,.09)';
  const padL = 14, padR = 14, padT = 10, padB = 34;
  const pw = W - padL - padR, ph = H - padT - padB;
  const xOf = i => padL + (i - 0.5) / N * pw;
  /* 网格与横轴刻度 */
  ctx.strokeStyle = cLine; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT + ph); ctx.lineTo(padL + pw, padT + ph); ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '13px system-ui';
  for (let i = 1; i <= N; i += 4) ctx.fillText(String(i), xOf(i) - 6, H - 18);
  ctx.fillText(L('片段长度(格,1 格≈33 nt)', 'length (slots, 1≈33 nt)'), padL, H - 3);
  /* 峰高归一化 */
  let mx = 1;
  for (const b in amps) for (let i = 1; i <= N; i++) if (amps[b][i] > mx) mx = amps[b][i];
  const sig = pw / N * 0.38;
  const COLORS = { A: '#ff6b6b', C: '#38bdf8', G: '#51cf66', T: '#ffd43b' };
  for (const b of ['A', 'C', 'G', 'T']) {
    ctx.strokeStyle = COLORS[b]; ctx.lineWidth = 2.4;
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    for (let px = 0; px <= pw; px += 2) {
      const xw = padL + px;
      let v = 0;
      for (let i = 1; i <= N; i++) {
        if (!amps[b][i]) continue;
        const d = (xw - xOf(i)) / sig;
        v += amps[b][i] * Math.exp(-d * d);
      }
      const y = padT + ph - clamp(v / mx, 0, 1) * (ph - 6);
      px === 0 ? ctx.moveTo(xw, y) : ctx.lineTo(xw, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  /* 峰下读出的碱基字母(有峰即读;颜色 = 峰色) */
  ctx.font = 'bold 15px ui-monospace, Menlo, monospace';
  for (let i = 1; i <= N; i++) {
    let best = '', bv = 0;
    for (const b of ['A', 'C', 'G', 'T']) if (amps[b][i] > bv) { bv = amps[b][i]; best = b; }
    if (bv > 0) {
      ctx.fillStyle = COLORS[best];
      ctx.fillText(best, xOf(i) - 5, padT + ph + 16);
    } else {
      ctx.fillStyle = cTxt; ctx.globalAlpha = 0.5;
      ctx.fillText('·', xOf(i) - 2, padT + ph + 16);
      ctx.globalAlpha = 1;
    }
  }
  /* 读序进度线 */
  if (readLen > 0) {
    const x = xOf(Math.min(readLen + 0.5, N));
    ctx.strokeStyle = 'rgba(151,117,250,.85)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ph); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.fillStyle = cTxt; ctx.font = '12px system-ui';
  ctx.fillText(L(`检测 ${detected} 次 · 读至第 ${readLen}/${N} 格`, `events ${detected} · read to ${readLen}/${N}`), padL + 4, padT + 12);
}

  counts.fill(0);
  for (const b in amps) amps[b].fill(0);

  injQueue.length = 0;
  for (const f of fragPool) f.alive = false;
  enzPos = 0; enzReturning = 0; strandLen = 0; strandDD.fill(false);
  updateLibBars(); syncReadRow(); drawChromatogram(); updateStats();
}
function swapTemplate() {

  if (libBars.instanceColor) libBars.instanceColor.needsUpdate = true;
  buildSeq(); resetRun();
}

}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, accS = 0, accC = 0;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0);
  if (flashT > 0) flashT -= dt0;
  /* 反应与电泳推进 */
  if (playing) { stepEnzyme(dt); stepCapillary(dt); }
  /* 聚合酶位姿:沿模板滑行;终止后快速回位 */
  const tNow = performance.now() / 1000;
  if (enzReturning > 0) {
    const u = ease(clamp(1 - enzReturning / 0.32, 0, 1));
    enzGrp.position.x = lerp(enzGrp.userData.stopX ?? RX0, RX0 - 0.35, u);
    heldMesh.visible = false;
  } else {
    enzGrp.position.x = enzPos <= 0 ? RX0 - 0.35 : RX0 + (enzPos - 0.5) / N * (RX1 - RX0);
    heldMesh.visible = enzPos < N;
    const nb = clamp(Math.floor(enzPos), 0, N - 1);
    heldMesh.material = baseMats[COMP[SEQ[nb]]];
    enzGrp.userData.stopX = enzGrp.position.x;
  }
  enzGrp.position.y = RY + Math.sin(tNow * 2.1) * 0.02;
  /* 已合成的新链:正常 dNTP 常色,dd 终止球加亮(荧光) */
  let n = 0;
  for (let i = 0; i < strandLen; i++) {
    _M4.compose(_V.set(tmplPos(i + 1), RY + 0.24, 0), _Q.identity(), _S.set(1, 1, 1));
    newStrand.setMatrixAt(n, _M4);
    const c = BASE_C[COMP[SEQ[i]]];
    newStrand.setColorAt(n, _C.setHex(c).multiplyScalar(strandDD[i] ? 1.7 : 1));
    n++;
  }
  newStrand.count = n;
  if (newStrand.instanceColor) newStrand.instanceColor.needsUpdate = true;
  if (newStrand.instanceMatrix) newStrand.instanceMatrix.needsUpdate = true;
  /* dNTP 漩涡 + ddNTP 三兄弟巡游 */
  const swirl = playing ? 1 : 0;
  for (let i = 0; i < ND; i++) {
    const d = dSeed[i];
    const a = d.a + tNow * 0.5 * d.w * swirl;
    _M4.compose(_V.set(Math.cos(a) * d.r, d.y + Math.sin(tNow * 0.8 * d.w + d.ph) * 0.25, Math.sin(a) * d.r), _Q.identity(), _S.set(1, 1, 1));
    dntp.setMatrixAt(i, _M4);
  }
  dntp.instanceMatrix.needsUpdate = true;
  ddPool.forEach((g, i) => {
    const a = tNow * 0.4 + i * Math.PI * 2 / 3;
    g.position.set(Math.cos(a) * 0.85, Math.sin(tNow * 1.1 + i) * 0.3, Math.sin(a) * 0.85);
  });
  /* 终止闪光环 */
  if (flashT > 0) {
    flashRing.visible = true;
    const u = 1 - flashT / 1.1;
    flashRing.scale.setScalar(0.4 + u * 3.2);
    flashRing.material.opacity = 0.9 * (1 - u);
  } else flashRing.visible = false;
  /* 毛细管片段:实例化排布,过窗即灭 */
  for (let i = 0; i < NFRAG; i++) {
    const f = fragPool[i];
    if (!f.alive) { _M4.compose(_V.set(0, -50, 0), _Q.identity(), _S.set(0.001, 0.001, 0.001)); }
    else {
      const jy = Math.sin(tNow * 3 + f.ph) * 0.02;
      _M4.compose(_V.set(f.x, CY + jy, CZ), _Q.identity(), _S.set(f.len * 0.085 + 0.1, 1, 1));
    }
    frags.setMatrixAt(i, _M4);
  }
  frags.instanceMatrix.needsUpdate = true;
  /* 检测窗口脉动 */
  detRing.material.emissiveIntensity = 1.3 + Math.sin(tNow * 5) * 0.35;
  detLight.intensity = 0.8 + Math.sin(tNow * 5) * 0.25;
  /* NGS 芯片:每循环全体点闪一次该循环的碱基色 */
  if (chipGrp.visible) {
    chipT += dt0;
    if (chipT > 1.35) { chipT = 0; chipCycle++; chipFlash(chipCycle); chipLit = true; }
    else if (chipLit && chipT > 0.55) { chipDim(); chipLit = false; }
  }
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  /* 节流刷新:统计 / 直方图 / 色谱 / 读出行 */
  accS += dt0;
  if (accS > 0.15) {
    accS = 0;
    updateStats();
    updateLibBars();
    syncReadRow();
  }
  accC += dt0;
  if (accC > 0.3) { accC = 0; drawChromatogram(); }
  /* 标签 */
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSeq();
buildGeoCurve();
updateLibBars();
applyLang();
setSpeed(speed);
setRatio(ratioU);
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 1 && t0 <= STEPS.length) activateStep(t0 - 1);
else activateStep(0);
setPlayLabel();
start();

</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
