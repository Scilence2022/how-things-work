<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制冷 ⇄ 热泵 · 同一台机器的冷暖两副面孔</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1971c2;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.hot { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  .lbl.cold { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.hot { border-color: rgba(201,42,42,.9); color: #c92a2a; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: #ff8787; }
  #stats .v.cold { color: #74c0fc; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 388px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #modeRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(77,171,247,.12); }
  :root[data-theme="light"] .bon.on { background: rgba(25,113,194,.08); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(25,113,194,.08); border-color: rgba(25,113,194,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #a5d8ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="制冷 ⇄ 热泵：同一台机器的冷暖两副面孔" data-en="Fridge ⇄ Heat Pump: one machine, two seasons">制冷 ⇄ 热泵：同一台机器的冷暖两副面孔</h1>
  <div class="sub" data-zh="压缩→冷凝放热→节流骤降→蒸发吸热;四通阀一换,室内外盘管角色对调——COP>1 不违反能量守恒,热量是搬运的不是制造的 · 空格播放/暂停" data-en="Compress → condense (dump heat) → expand → evaporate (soak heat); flip the 4-way valve and indoor/outdoor coils swap — COP>1 moves heat, it never creates it · Space = play/pause">压缩→冷凝放热→节流骤降→蒸发吸热;四通阀一换,室内外盘管角色对调——COP>1 不违反能量守恒,热量是搬运的不是制造的 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="室内温度" data-en="indoor temp">室内温度</span><span class="v cold" id="stIn">—</span>
  <span class="k" data-zh="室外温度" data-en="outdoor temp">室外温度</span><span class="v" id="stOut">—</span>
  <span class="k" data-zh="COP(能效比)" data-en="COP">COP(能效比)</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="电功率" data-en="electric power">电功率</span><span class="v hot" id="stE">—</span>
</div>

<div id="panel">
  <div id="modeRow">
    <button class="bon on" id="mCool"><b data-zh="制冷(夏天)" data-en="cooling (summer)">制冷(夏天)</b><i data-zh="室内=蒸发器吸热" data-en="indoor = evaporator soaks">室内=蒸发器吸热</i></button>
    <button class="bon" id="mHeat"><b data-zh="制热(冬天)" data-en="heating (winter)">制热(冬天)</b><i data-zh="室内=冷凝器放热" data-en="indoor = condenser dumps">室内=冷凝器放热</i></button>
  </div>
  <div class="row"><label data-zh="压缩机功率" data-en="compressor">压缩机功率</label><input id="pwr" type="range" min="20" max="100" step="5" value="65"><span class="val" id="pwrVal">65%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../carnot-cycle/" data-zh="卡诺循环:理论天花板" data-en="Carnot cycle: the ceiling">卡诺循环:理论天花板</a>
    <a href="../motor-generator/" data-zh="互逆器件:电机⇄发电机同构" data-en="inverse pair: motor⇄generator">互逆器件:电机⇄发电机同构</a>
    <a href="../kinetic-theory/" data-zh="分子动理论:热是什么" data-en="kinetic theory: what heat is">分子动理论:热是什么</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
let coolMode = qs.get('mode') !== 'heat';

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('制冷 ⇄ 热泵', 'Fridge ⇄ Heat Pump');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.0, 3.4, 9.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.4, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  comp: mat(0x8a93a3, { metalness: 0.5, roughness: 0.4 }),
  coilHot: mat(0xff6b6b, { roughness: 0.4, emissive: 0xff6b6b, emissiveIntensity: 0.2 }),
  coilCold: mat(0x4dabf7, { roughness: 0.4, emissive: 0x4dabf7, emissiveIntensity: 0.2 }),
  valve: mat(0xffd166, { metalness: 0.5, roughness: 0.35 }),
  wall: new THREE.MeshStandardMaterial({ color: 0x39424f, roughness: 0.8, transparent: true, opacity: 0.5 }),
  roomTag: mat(0x63e6be, { roughness: 0.5 }),
  outTag: mat(0xffa94d, { roughness: 0.5 }),
};

/* ================= 场景:室内(左) | 墙 | 室外(右) ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(12, 0.18, 4.6), M.floor);
floor.position.y = -0.1;
scene.add(floor);
/* 中间墙 */
const wall = new THREE.Mesh(new THREE.BoxGeometry(0.18, 3.4, 4.2), M.wall);
wall.position.set(0.2, 1.6, 0);
scene.add(wall);
/* 室内机(左):盘管 */
const indoorUnit = new THREE.Group();
indoorUnit.position.set(-2.6, 2.4, 0);
scene.add(indoorUnit);
const inCoil = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.09, 10, 40), M.coilCold);
indoorUnit.add(inCoil);
const inBlow = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.35, 0.5), M.roomTag);
inBlow.position.y = 0.75;
indoorUnit.add(inBlow);
/* 室外机(右):盘管 + 压缩机 */
const outdoorUnit = new THREE.Group();
outdoorUnit.position.set(3.2, 1.4, 0);
scene.add(outdoorUnit);
const outCoil = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.09, 10, 40), M.coilHot);
outCoil.position.y = 1.0;
outdoorUnit.add(outCoil);
const fan = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.05, 8, 36), M.frame);
fan.position.y = 1.0;
fan.position.z = 0.1;
outdoorUnit.add(fan);
const compressor = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.6, 20), M.comp);
compressor.position.set(-0.6, 0.35, 0);
outdoorUnit.add(compressor);
/* 节流阀(室内机附近管路上) */
const xvalve = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.2, 16), M.valve);
xvalve.rotation.z = Math.PI / 2;
xvalve.position.set(-1.0, 1.2, 0);
scene.add(xvalve);
/* 连接管路(回路,动态着色) */
function pipe(points, r = 0.06) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 60, r, 8, false),
    new THREE.MeshBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.9 }));
  scene.add(mesh);
  return { curve, mesh, mat: mesh.material };
}
/* 回路:室内机 → 节流阀 → 室外压缩机 → 冷凝盘管 → 四通阀 → 回室内 */
const loopA = pipe([
  new THREE.Vector3(-2.6, 2.4, 0), new THREE.Vector3(-1.6, 1.9, 0),
  new THREE.Vector3(-1.0, 1.2, 0), new THREE.Vector3(0.2, 1.0, 0),
  new THREE.Vector3(2.6, 0.35, 0)]);
const loopB = pipe([
  new THREE.Vector3(2.6, 0.35, 0), new THREE.Vector3(3.2, 0.4, 0),
  new THREE.Vector3(3.2, 1.0, 0)]);
const loopC = pipe([
  new THREE.Vector3(3.2, 1.0, 0), new THREE.Vector3(2.4, 2.2, 0),
  new THREE.Vector3(0.2, 2.6, 0), new THREE.Vector3(-2.6, 2.4, 0)]);
/* 制冷剂流动点(三段回路各若干) */
const N_DOTS = 21;
const dots = [];
for (let i = 0; i < N_DOTS; i++) {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xff8787 }));
  scene.add(d);
  dots.push({ mesh: d, seg: i % 3, p: (i / N_DOTS) % 1 });
}
/* 四通阀(墙上) */
const valve4 = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.3, 18), M.valve);
valve4.rotation.z = Math.PI / 2;
valve4.position.set(0.2, 2.9, 0);
scene.add(valve4);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let power = 0.65;
let tIn = 30, tOut = 33;
let tSim = 0;
function cop() { return clamp(3.2 - Math.abs(tIn - tOut) * 0.05, 0.8, 4); }

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblIn = addLabel(() => {
  const evap = coolMode;
  return L(evap ? '室内机 = 蒸发器:吸热降温' : '室内机 = 冷凝器:放热升温',
    evap ? 'indoor = evaporator: soaks heat' : 'indoor = condenser: dumps heat');
}, new THREE.Vector3(-2.6, 3.5, 0), coolMode ? 'cold' : 'hot', indoorUnit);
const lblOut = addLabel(() => {
  const cond = coolMode;
  return L(cond ? '室外机 = 冷凝器:把热排出去' : '室外机 = 蒸发器:从冷空里偷热',
    cond ? 'outdoor = condenser: dumps heat out' : 'outdoor = evaporator: steals from cold air');
}, new THREE.Vector3(3.2, 2.9, 0), cond ? 'hot' : 'cold', outdoorUnit);
const lblValve = addLabel(() => L('四通阀:冷暖切换的枢纽', '4-way valve: the season switch'),
  new THREE.Vector3(0.2, 3.6, 0), 'b');
const lblStatus = addLabel(() => coolMode
  ? L('制冷:热量从室内被搬运到室外', 'cooling: heat moved from indoors to outdoors')
  : L('制热:热量从室外冷空里被「偷」进室内', 'heating: heat stolen from the cold outdoors'),
  new THREE.Vector3(0.4, -0.45, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '压缩机:加压升温', be: 'Compressor: squeeze to heat',
    d: '压缩机把制冷剂气体压成高压高温——给热量「抬高度」,好让它能流向更热的一侧。',
    de: 'The compressor squeezes refrigerant into hot high pressure — hoisting the heat so it can flow where needed.',
    act: () => { coolMode = false; syncMode(); } },
  { b: '冷凝器:放热液化', be: 'Condenser: dumping heat',
    d: '高压气体流过盘管,把热吐给周围空气,自己液化——夏天室外机吹出的就是这股热风。',
    de: 'High-pressure gas dumps heat through the coil and liquefies — the hot breeze outside your AC in summer.',
    act: () => { coolMode = false; syncMode(); } },
  { b: '节流阀:骤降急冻', be: 'Expansion valve: the deep chill',
    d: '高压液体挤过狭窄阀口突然膨胀——温度骤降到比室内还低,为吸热做好准备。',
    de: 'High-pressure liquid squeezes through a tight valve and flash-expands — colder than the room, ready to soak.',
    act: () => { coolMode = true; syncMode(); } },
  { b: '蒸发器:吸热变气', be: 'Evaporator: soaking heat',
    d: '低温液体流过室内盘管,把室内的热「吸」走自己蒸发——房间变凉,制冷剂变气回到压缩机,循环闭合。',
    de: 'Cold liquid soaks room heat as it evaporates — the room cools, the gas returns to the compressor, loop closed.',
    act: () => { coolMode = true; syncMode(); } },
  { b: '四通阀一换:变热泵', be: 'Flip the 4-way valve: heat pump',
    d: '把循环反向,室内盘管改当冷凝器放热——冬天从室外冷空里「偷」热进屋。COP>1:热是搬运的,不是制造的。',
    de: 'Reverse the loop: the indoor coil becomes the condenser — winter heat stolen from cold air. COP>1: moved, not made.',
    act: () => { coolMode = !coolMode; syncMode(); } },
];
function stepIndex() {
  if (Math.abs(tIn - (coolMode ? 22 : 26)) < 1.2) return 4;
  if (!coolMode) return 0;
  if (tIn < 26) return 3;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elPwr = document.getElementById('pwr');
const elPwrVal = document.getElementById('pwrVal');
const btnCool = document.getElementById('mCool');
const btnHeat = document.getElementById('mHeat');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stIn = document.getElementById('stIn'), stOut = document.getElementById('stOut'),
  stC = document.getElementById('stC'), stE = document.getElementById('stE');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncMode() {
  btnCool.classList.toggle('on', coolMode);
  btnHeat.classList.toggle('on', !coolMode);
}
btnCool.addEventListener('click', () => { coolMode = true; syncMode(); });
btnHeat.addEventListener('click', () => { coolMode = false; syncMode(); });
elPwr.addEventListener('input', () => { power = parseInt(elPwr.value, 10) / 100; elPwrVal.textContent = elPwr.value + '%'; });
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
const curves = [loopA, loopB, loopC];
const cHot = new THREE.Color(0xff6b6b), cCold = new THREE.Color(0x4dabf7), cTmp = new THREE.Color();
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;

  /* 温度动力学:向目标松弛 */
  const target = coolMode ? 22 : 26;
  const rate = power * cop() * 0.055;
  tIn += ((target - tIn)) * clamp(dts * rate, 0, 1);
  tOut += coolMode ? dts * power * 0.5 : -dts * power * 0.35;
  tOut = clamp(tOut, coolMode ? 30 : 0, coolMode ? 42 : 33);

  /* 盘管与制冷剂点着色 */
  const hotIn = !coolMode;
  inCoil.material = hotIn ? M.coilHot : M.coilCold;
  outCoil.material = hotIn ? M.coilCold : M.coilHot;
  dots.forEach((d, i) => {
    if (playing) d.p = (d.p + dts * (0.1 + 0.15 * power)) % 1;
    const seg = curves[d.seg];
    const pos = seg.curve.getPoint(d.p);
    d.mesh.position.copy(pos);
    /* 颜色按位置温度(压缩后热、节流后冷) */
    let hotHere;
    if (coolMode) hotHere = (d.seg === 2) || (d.seg === 1 && d.p > 0.25);
    else hotHere = (d.seg === 0 && d.p > 0.3) || d.seg === 1;
    cTmp.lerpColors(cCold, cHot, clamp((hotHere ? 0.8 : 0.2) + Math.sin(tSim * 3 + i) * 0.05, 0, 1));
    d.mesh.material.color.copy(cTmp);
  });

  /* 温度统计 */
  stIn.innerHTML = tIn.toFixed(1) + '<small> °C</small>';
  stOut.innerHTML = tOut.toFixed(1) + '<small> °C</small>';
  stC.textContent = cop().toFixed(2);
  stE.innerHTML = (power * 1000).toFixed(0) + '<small> W</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

syncMode();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
