<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C4 与 CAM 光合 · CO₂ 浓缩的两条妙计(3D 动画)</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#5da45c;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --mint:#8fe3b0;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#388e3c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --mint:#1e7a4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.st { border-color: rgba(143,227,176,.9); font-size: 13px; padding: 6px 11px; color: #c4e8b8; }
  .lbl.g { border-color: rgba(143,227,176,.9); color: #bdeecb; }
  .lbl.b { border-color: rgba(125,211,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.m { border-color: rgba(232,176,74,.9); color: #ffd9a0; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.st { color: #1e7a4a; }
  :root[data-theme="light"] .lbl.g { color: #1e7a4a; }
  :root[data-theme="light"] .lbl.b { color: #0369a1; }
  :root[data-theme="light"] .lbl.r { color: #b23b32; }
  :root[data-theme="light"] .lbl.m { color: #9a6b12; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.bad { color: var(--hot); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 8px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(143,227,176,.6); background: rgba(93,164,92,.14); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(56,142,60,.55); background: rgba(56,142,60,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row.off { display: none; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 62px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #cmp { margin-top: 8px; border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #cmp .ct { font-size: 11.5px; color: var(--text2); margin-bottom: 4px; }
  .crow { display: flex; align-items: center; gap: 8px; padding: 2.5px 6px; border-radius: 7px;
    font-size: 11.5px; color: var(--text2); opacity: .62; transition: opacity .3s, background .3s; }
  .crow.lit { opacity: 1; background: rgba(93,164,92,.10); color: var(--text3); }
  .crow b { flex: 0 0 86px; font-weight: 600; color: var(--text3); }
  .crow .w { flex: 1; font-variant-numeric: tabular-nums; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(93,164,92,.12); border-color: rgba(93,164,92,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(56,142,60,.08); border-color: rgba(56,142,60,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #c4e8b8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="C4 与 CAM 光合:CO₂ 浓缩的两条妙计" data-en="C4 & CAM photosynthesis: two CO₂-concentrating tricks">C4 与 CAM 光合:CO₂ 浓缩的两条妙计</h1>
  <div class="sub" data-zh="炎热干旱时气孔被迫关闭,C3 的 Rubisco 会抓错氧白烧能量;C4 用空间分离、CAM 用昼夜时间分离,先把 CO₂ 打包浓缩再喂给卡尔文循环 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="When heat forces stomata shut, C3's Rubisco grabs O₂ and burns energy for nothing; C4 separates in space, CAM in time — both pre-concentrate CO₂ before feeding the Calvin cycle · 3D interactive · drag to orbit / scroll to zoom · Space = play/pause">炎热干旱时气孔被迫关闭,C3 的 Rubisco 会抓错氧白烧能量;C4 用空间分离、CAM 用昼夜时间分离,先把 CO₂ 打包浓缩再喂给卡尔文循环 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>

    <span data-zh="相关:" data-en="Related:">相关:</span>

    <a href="../photosynthesis-z-scheme/" data-zh="ATP 与 NADPH 的来源:光反应" data-en="where ATP &amp; NADPH come from: light reactions">ATP 与 NADPH 的来源:光反应</a>
    <a href="../krebs-cycle/" data-zh="C4 酸这类有机酸的故事:三羧酸循环" data-en="the story of C4 acids: Krebs cycle">C4 酸这类有机酸的故事:三羧酸循环</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const bez3 = (p0, c, p1, k) => {
  const u = 1 - k;
  return V3(u*u*p0.x + 2*u*k*c.x + k*k*p1.x, u*u*p0.y + 2*u*k*c.y + k*k*p1.y, u*u*p0.z + 2*u*k*c.z + k*k*p1.z);
};

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('C4 与 CAM 光合 · CO₂ 浓缩的两条妙计(3D 动画)', 'C4 & CAM Photosynthesis · CO₂-concentrating tricks (3D)');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  buildCompare();
  setPlayLabel();
  updateFormula();
  updateStatKeys();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.7, 3.3, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.5;

const hemi = new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7);
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 8, 5);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(hemi, key, fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  slab: mat(0x2f6b3f, { opacity: 0.9, roughness: 0.8, emissiveIntensity: 0.05 }),
  skin: mat(0x59955f, { opacity: 0.85, roughness: 0.7 }),
  cell: mat(0x79b06a, { opacity: 0.42, roughness: 0.45, emissiveIntensity: 0.12 }),
  sheath: mat(0x3f8f5f, { opacity: 0.5, roughness: 0.5 }),
  vein: mat(0xc9b37a, { opacity: 0.95, roughness: 0.55 }),
  guard: mat(0x8fd07f, { opacity: 0.95, emissiveIntensity: 0.25 }),
  enzyme: mat(0x2e6e58, { opacity: 0.95, emissiveIntensity: 0.3 }),
  pep: mat(0x4a8fbf, { opacity: 0.95, emissiveIntensity: 0.35 }),
  vac: mat(0x74a8d8, { opacity: 0.3, roughness: 0.2, emissiveIntensity: 0.08 }),
  acid: mat(0xe8b04a, { opacity: 0.85, emissiveIntensity: 0.5 }),
  pd: mat(0xd8c07a, { opacity: 0.9, emissiveIntensity: 0.3 }),
  sun: mat(0xffd166, { emissiveIntensity: 1.4, opacity: 1 }),
  moon: mat(0xcfd8e6, { emissiveIntensity: 0.7, opacity: 1 }),
};

/* ================= 布局:叶片横切 = 上表皮(气孔) + 叶肉 + 维管束鞘环 + 叶脉 ================= */
const leaf = new THREE.Group();
scene.add(leaf);
const slab = new THREE.Mesh(new THREE.BoxGeometry(9, 0.7, 4.4), M.slab);
leaf.add(slab);
const skin = new THREE.Mesh(new THREE.BoxGeometry(9, 0.09, 4.4), M.skin);
skin.position.y = 0.395;
leaf.add(skin);

/* 叶肉细胞(左侧) */
const mesoPos = [V3(-3.1, 0, 0.35), V3(-2.15, 0, -0.55), V3(-1.25, 0, 0.5), V3(-2.5, 0, 1.15)];
for (const [i, p] of mesoPos.entries()) {
  const c = new THREE.Mesh(new THREE.SphereGeometry(i === 2 ? 0.62 : 0.55, 24, 18), M.cell);
  c.position.copy(p);
  leaf.add(c);
}
/* PEP 羧化酶(C4 专用,不理会 O₂) */
const pepGrp = new THREE.Group();
pepGrp.position.set(-2.15, 0.15, 0.3);
{
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.19, 18, 14), M.pep);
  pepGrp.add(b);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.02, 8, 32), mat(0x7dd3fc, { emissiveIntensity: 0.55 }));
  rim.rotation.x = Math.PI / 2;
  pepGrp.add(rim);
}
leaf.add(pepGrp);
/* CAM 大液泡(贮酸罐) */

/* ================= 状态与物理(先于标签:标签创建时即读状态) ================= */
const HPS = 0.25;                       // 模拟小时 / 模拟秒
let MODE = ['c4', 'cam'].includes(qs.get('mode')) ? qs.get('mode') : 'c3';
let heat = clamp(qsFloat('heat', 30), 20, 45);
let hourBase = clamp(qsFloat('hour', 12), 0, 24);
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let tSim = 0, hour = hourBase;
let Ci = 30, O2 = 30, malate = 0, tank = 0, sheathC = 30, gaugePulse = 0;
let phAcc = 0, sugAcc = 0, watAcc = 0, atpAcc = 0;
let spawnO2 = 0, spawnMal = 0, spawnATP = 0, bill = false;

const isDay = () => MODE !== 'cam' || (hour >= 6 && hour < 18);
const light = () => isDay() ? 1 : 0.05;
function gStom() {
  if (MODE === 'cam') return isDay() ? 0.03 : 1 - ss(34, 45, heat) * 0.35;
  if (MODE === 'c4') return (1 - ss(28, 43, heat)) * 0.75;
  return 1 - ss(26, 40, heat);
}
const siteC = () => MODE === 'c3' ? Ci : sheathC;
function concX() { return 1 + clamp(siteC() / 12, 0, 11); }
function resetState() {
  tSim = 0; hour = hourBase;
  Ci = 30; O2 = 30; malate = 0; tank = 0; sheathC = 30;
  phAcc = 0; sugAcc = 0; watAcc = 0; atpAcc = 0; gaugePulse = 0;
  spawnO2 = 0; spawnMal = 0; spawnATP = 0; bill = false;
}
function physStep(h) {
  const g = gStom(), Lr = light(), inflow = g * 9;
  spawnO2 += Lr * 1.6 * h;
  if (MODE === 'c3') {
    O2 = clamp(O2 + (Lr * 46 - g * 3.4 * O2) * h, 2, 260);
    const ph = Lr * 1.7 * (O2 / 100) * (30 / (Ci + 10));
    Ci = clamp(Ci + (inflow * 0.9 - Lr * 0.22 * Ci - ph * 2.5) * h, 0.3, 120);
    sheathC = Ci;
    phAcc += ph * h;
    sugAcc += Math.max(0, Lr * 2.4 * Ci / (Ci + 18) - ph * 0.55) * h;
  } else if (MODE === 'c4') {
    const pep = (0.3 + 0.7 * g) * 9 * 0.92;          // PEP 亲和力高:气孔收紧也能继续泵送
    const dec = malate * 0.5;
    malate = clamp(malate + (pep - dec) * h, 0, 40);
    O2 = clamp(O2 + (Lr * 46 - g * 3.4 * O2) * h, 2, 260);
    sheathC = clamp(sheathC + (dec * 10 - Lr * 0.28 * sheathC) * h, 0.3, 130);
    phAcc += Lr * 1.7 * (O2 / 100) * (30 / (sheathC + 10)) * 0.04 * h;
    sugAcc += Math.max(0, Lr * 2.8 * sheathC / (sheathC + 18)) * h;
    atpAcc += 2 * pep * h * 0.35;
    spawnMal += dec * h * 0.5;
    spawnATP += pep * h * 0.22;
  } else {
    if (!isDay()) {
      const pep = inflow * 0.92;
      tank = clamp(tank + pep * h * 0.0023, 0, 1);
      sheathC = clamp(sheathC * Math.exp(-h * 0.5), 0.3, 130);
      spawnMal += pep * h * 0.5;
    } else {
      const rel = tank * 0.05;
      tank = Math.max(0, tank - rel * h);
      sheathC = clamp(sheathC + ((tank * 120) - sheathC * 0.4) * h, 0.3, 130);
      O2 = clamp(O2 + (Lr * 46 - g * 3.4 * O2) * h, 2, 260);
      phAcc += Lr * 1.7 * (O2 / 100) * (30 / (sheathC + 10)) * 0.05 * h;
      sugAcc += Math.max(0, Lr * 2.8 * sheathC / (sheathC + 18)) * h;
      atpAcc += 2 * rel * 9 * h * 0.35;
      spawnMal += rel * 9 * h * 0.5;
      spawnATP += rel * 9 * h * 0.25;
    }
  }
  watAcc += g * (0.35 + heat * 0.014) * (isDay() ? 1 : 0.32) * h * 2;
  watAcc += (0.04 + heat * 0.0015) * h;              // 角质层渗漏
}
function fastForward(sec) {
  const limit = tSim + sec;
  let guard = 0;
  while (tSim < limit && guard++ < 9000) {
    physStep(0.25); tSim += 0.25;
    hour = (hourBase + tSim * HPS) % 24;
  }
}
function instantSim(sec) {
  resetState();
  fastForward(clamp(sec, 0, 600));
}

  if (MODE === 'c3') {
    formulaEl.innerHTML = L(
      `气孔导度 <b>${g}%</b> · 固定位点 CO₂ <b>${siteC().toFixed(0)}</b> / O₂ ${O2.toFixed(0)}<br>` +
      `Rubisco:CO₂ 与 O₂ 竞争同一活性位点 —— CO₂ 短缺时光呼吸把能量白白烧掉(<b>ΔG 浪费,0 糖</b>)`,
      `Stomatal conductance <b>${g}%</b> · CO₂ at site <b>${siteC().toFixed(0)}</b> / O₂ ${O2.toFixed(0)}<br>` +
      `Rubisco: CO₂ and O₂ compete for one active site — when CO₂ runs short, photorespiration burns energy for nothing`);
  } else if (MODE === 'c4') {
    formulaEl.innerHTML = L(
      `叶肉:PEP + HCO₃⁻ → 草酰乙酸 → <b>苹果酸(C4)</b> → 胞间连丝 → 鞘内脱羧<br>` +
      `鞘内 CO₂ 浓缩 <b>×${concX().toFixed(0)}</b>,Rubisco 饱和运行 · 光呼吸 ≈ 0 · 代价:每 CO₂ <b>+2 ATP</b>(PEP 再生需丙酮酸回流磷酸化)`,
      `Mesophyll: PEP + HCO₃⁻ → oxaloacetate → <b>malate (C4)</b> → plasmodesmata → decarboxylated in sheath<br>` +
      `Sheath CO₂ concentrated <b>×${concX().toFixed(0)}</b>, Rubisco saturated · photorespiration ≈ 0 · cost: <b>+2 ATP</b> per CO₂ (pyruvate re-phosphorylation)`);
  } else {
    formulaEl.innerHTML = L(
      `${isDay() ? '<b>白天</b>:气孔紧闭,液泡缓慢放酸 → CO₂ 喂卡尔文循环' : '<b>夜晚</b>:气孔大开,PEP 把 CO₂ 装进苹果酸,存入液泡'}` +
      ` · 贮酸 <b>${Math.round(tank * 100)}%</b> · 昼夜节律驱动(景天酸代谢)<br>` +
      `水几乎只从角质层漏 · 代价同为每 CO₂ <b>+2 ATP</b> —— 换来沙漠生存权`,
      `${isDay() ? '<b>Day</b>: stomata welded shut; the vacuole slowly releases acid → CO₂ feeds the Calvin cycle' : '<b>Night</b>: stomata wide open; PEP packs CO₂ into malate, stored in the vacuole'}` +
      ` · tank <b>${Math.round(tank * 100)}%</b> · driven by the circadian clock (CAM)<br>` +
      `Water leaks only via cuticle · same <b>+2 ATP</b> per CO₂ — the price of desert citizenship`);
  }
}
function setMode(m, animate = true) {
  MODE = m;
  bill = false;
  document.getElementById('btnC3').classList.toggle('on', m === 'c3');
  document.getElementById('btnC4').classList.toggle('on', m === 'c4');
  document.getElementById('btnCAM').classList.toggle('on', m === 'cam');
  document.getElementById('rowHour').classList.toggle('off', m !== 'cam');
  pepGrp.visible = m === 'c4' || m === 'cam';
  vacGrp.visible = m === 'cam';
  rubGrp.position.copy(RUB_AT[m]);
  gaugeGrp.visible = m !== 'c3';
  resetState();
  updateStatKeys();
  updateFormula();
  updateCompare();
}
elHeat.value = heat; elHeatVal.textContent = heat + ' °C';
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
elHeat.addEventListener('input', () => { heat = +elHeat.value; elHeatVal.textContent = heat + ' °C'; updateCompare(); });
elHour.addEventListener('input', () => {
  hourBase = ((+elHour.value - tSim * HPS) % 24 + 24) % 24;
  hour = +elHour.value % 24;
  elHourVal.textContent = hour.toFixed(1) + ' h';
});
elSpd.addEventListener('input', () => { speed = +elSpd.value; elSpdVal.textContent = speed.toFixed(1) + '×'; });
document.getElementById('btnC3').addEventListener('click', () => { setMode('c3'); instantSim(0); });
document.getElementById('btnC4').addEventListener('click', () => { setMode('c4'); instantSim(0); });
document.getElementById('btnCAM').addEventListener('click', () => { setMode('cam'); instantSim(0); });
document.getElementById('btnReset').addEventListener('click', () => { resetState(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; }
refreshLabels();
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 粒子逻辑 ---------------- */
function spawnCO2One() {
  const s = stomata[Math.floor(Math.random() * 3)];
  const q = co2P.find(x => x.life <= 0);
  if (!q) return;
  q.life = 1; q.stage = 0;
  q.p.set(s.g.position.x + (Math.random() - 0.5) * 0.9, 2.1 + Math.random() * 0.9, s.g.position.z + (Math.random() - 0.5) * 0.9);
  q.s = Math.random() * 9;
}
const targetFor = () => (MODE === 'c4' || (MODE === 'cam' && !isDay())) ? pepGrp.position : rubGrp.position;
function updateParticles(dt) {
  /* CO₂:上方空气 → 气孔 → 固定位点 */
  for (let i = 0; i < NCO2; i++) {
    const q = co2P[i];
    if (q.life > 0) {
      if (q.stage === 0) {
        q.p.y -= dt * 1.5;
        q.p.x += Math.sin(q.s + q.p.y * 3) * 0.12 * dt;
        if (q.p.y < 0.55) q.stage = 1;
      } else {
        const t = targetFor();
        q.p.lerp(t, Math.min(dt * 1.4, 1));
        if (q.p.distanceTo(t) < 0.18) q.life = 0;
      }
    } else if (Math.random() < dts * 7 && gStom() > 0.06) {
      spawnCO2One();
    }
    setInst(co2IM, i, q.p, q.life > 0 ? 1 : 0.0001);
  }
  co2IM.instanceMatrix.needsUpdate = true;
  /* O₂:固定位点冒出,上飘散逸 */
  for (let i = 0; i < NO2; i++) {
    const q = o2P[i];
    if (q.life > 0) {
      q.life -= dt * (gStom() > 0.3 ? 0.9 : 0.12);
      q.p.addScaledVector(q.v, dt);
      q.p.x += Math.sin(q.s + q.p.y * 2) * 0.1 * dt;
      if (q.p.y > 2.8) q.life = 0;
    } else if (Math.random() < dt * spawnO2 * 0.8) {
      q.life = 1;
      q.p.copy(targetFor()).add(V3((Math.random() - 0.5) * 0.3, 0.1, (Math.random() - 0.5) * 0.3));
      q.v.set(0, 0.7 + Math.random() * 0.5, 0);
      q.s = Math.random() * 9;
    }
    setInst(o2IM, i, q.p, q.life > 0 ? Math.min(q.life * 2, 1) : 0.0001);
  }
  o2IM.instanceMatrix.needsUpdate = true;
  /* 苹果酸接力(签名时刻) */
  for (let i = 0; i < NMAL; i++) {
    const q = malP[i];
    if (q.life > 0) {
      q.life -= dt / q.d;
      const k = 1 - q.life;
      q.p.copy(bez3(q.from, q.ctrl, q.to, ss(0, 1, k)));
      if (q.life <= 0) { q.life = 0; gaugePulse = 1; }
    }
    setInst(malIM, i, q.p, q.life > 0 ? 1 : 0.0001);
  }
  malIM.instanceMatrix.needsUpdate = true;
  /* ATP 芯片(额外开销可视化) */
  for (let i = 0; i < NATP; i++) {
    const q = atpP[i];
    if (q.life > 0) {
      q.life -= dt / q.d;
      q.p.lerpVectors(q.from, q.to, ss(0, 1, 1 - q.life));
    }
    setInst(atpIM, i, q.p, q.life > 0 ? 1 - q.life * 0.4 : 0.0001);
  }
  atpIM.instanceMatrix.needsUpdate = true;
  /* 基质颗粒 */
  for (let i = 0; i < NAMB; i++) {
    const b = ambBase[i];
    dummy.position.set(b.x, b.y + Math.sin(tSim * b.sp + b.ph) * 0.06, b.z);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    ambIM.setMatrixAt(i, dummy.matrix);
  }
  ambIM.instanceMatrix.needsUpdate = true;
  /* 生成器 */
  if (spawnMal >= 1 && MODE !== 'c3') {
    spawnMal = 0;
    const from = MODE === 'cam' ? (isDay() ? vacGrp.position : pepGrp.position) : pepGrp.position;
    const to = MODE === 'cam' ? (isDay() ? rubGrp.position : vacGrp.position) : rubGrp.position;
    const ctrl = MODE === 'c4' ? V3(0.3, 0.75, 0.6) : from.clone().add(to).multiplyScalar(0.5).add(V3(0, 0.35, 0));
    homeParticle(malP, from, ctrl, to, MODE === 'c4' ? 1.6 : 1.1);
  } else if (MODE === 'c3') spawnMal = 0;
  if (spawnATP >= 1) {
    spawnATP = 0;
    homeParticle(atpP, V3(2.4, 0.6, 0), null, MODE === 'c4' ? pepGrp.position : rubGrp.position, 1.2);
  }
}

/* ---------------- 图形更新 ---------------- */
const C_COLD = new THREE.Color(0x3f8ba6), C_HOT = new THREE.Color(0xff5a3c),
  C_OK = new THREE.Color(0x7dd3a6), C_BAD = new THREE.Color(0xff7a5c), C_SCRATCH = new THREE.Color();
function updateVisuals(dt) {
  const g = gStom(), conc = MODE === 'cam' ? clamp(tank * 1.3, 0, 1) : clamp(siteC() / 120, 0, 1);
  /* 气孔开合 */
  for (const s of stomata) {
    s.k1.rotation.z = 0.16 + g * 0.5;
    s.k2.rotation.z = Math.PI - (0.16 + g * 0.5);
    s.pore.material.opacity = g * 0.8;
  }
  /* 热度计指针 + 脉冲 */
  gaugePulse = Math.max(0, gaugePulse - dt * 2.5);
  gaugeNeedle.rotation.z = Math.PI + conc * Math.PI * 1.1 + gaugePulse * 0.12;
  C_SCRATCH.lerpColors(C_COLD, C_HOT, conc);
  gaugeNeedle.material.color.copy(C_SCRATCH);
  gaugeRing.material.emissive.copy(C_SCRATCH);
  gaugeRing.material.emissiveIntensity = 0.2 + conc * 1.2 + gaugePulse * 0.8;
  /* 胞间连丝发光(苹果酸过境) */
  const pdGlow = MODE === 'c4' ? 0.25 + clamp(malate / 30, 0, 1) * 0.7 : 0.15;
  for (const t of pdTubes) t.material.emissiveIntensity = pdGlow;
  /* 液泡贮酸 */
  acidTank.scale.y = Math.max(0.02 + tank * 0.62, 0.001);
  acidTank.position.y = -0.28 + acidTank.scale.y / 2;
  acidTank.material.emissiveIntensity = 0.3 + tank * 0.6;
  vacShell.material.emissiveIntensity = 0.05 + tank * 0.25;
  /* Rubisco 状态色:O₂ 竞争激烈时泛红 */
  const stressed = MODE === 'c3' ? clamp(O2 / 200 + (30 - siteC()) / 40, 0, 1) : 0;
  rubRim.material.color.copy(C_SCRATCH.lerpColors(C_OK, C_BAD, stressed));
  rubRim.material.emissive.copy(rubRim.material.color);
  /* 迷你卡尔文环旋转 + 糖珠 */
  calvinRing.rotation.z += dt * (0.4 + (isDay() ? siteC() : 0) / 40);
  const sugarOn = isDay() && siteC() > 8 ? 1 : 0;
  for (let i = 0; i < 3; i++) {
    const a = tSim * 1.2 + i * Math.PI * 2 / 3;
    sugarDots[i].position.set(Math.cos(a) * 0.42, 0, Math.sin(a) * 0.42);
    sugarDots[i].scale.setScalar(Math.max(sugarOn, 0.001));
  }
  /* PEP 呼吸 */
  pepGrp.children[1].material.emissiveIntensity = 0.4 + Math.sin(tSim * 4) * 0.25;
  /* 太阳 / 月亮与光照(CAM 昼夜) */
  const day = isDay();
  sky.material = day ? M.sun : M.moon;
  sky.material.emissiveIntensity = day ? 1.4 : 0.7;
  const dayK = MODE === 'cam' ? (day ? 1 : 0.22) : 1;
  key.intensity = 2.0 * dayK;
  hemi.intensity = 0.7 * dayK;
  fill.intensity = 0.45 * (day ? 1 : 1.6);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, hudAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    physStep(dts);
    tSim += dts;
    hour = (hourBase + tSim * HPS) % 24;
    if (MODE === 'cam') { elHour.value = hour.toFixed(2); elHourVal.textContent = hour.toFixed(1) + ' h'; }
  }
  updateVisuals(dt);
  updateParticles(dts);
  /* 读数:约 4 Hz */
  hudAcc += dt;
  if (hudAcc > 0.25) {
    hudAcc = 0;
    stC.textContent = siteC().toFixed(0);
    stC.className = 'v ' + (siteC() < 15 ? 'bad' : 'ok');
    stP.textContent = phAcc.toFixed(1);
    stS.textContent = sugAcc.toFixed(1);
    stW.textContent = watAcc.toFixed(1);
    stA.textContent = atpAcc.toFixed(0);
    updateFormula();
    updateCompare();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.element.style.display = on ? '' : 'none';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
hourBase = clamp(qsFloat('hour', 12), 0, 24);
elHour.value = hourBase; elHourVal.textContent = hourBase.toFixed(1) + ' h';
setMode(MODE, false);
instantSim(clamp(qsFloat('t', 0), 0, 600));
hour = (hourBase + tSim * HPS) % 24;
applyTheme();
applyLang();
setPlayLabel();
start();
