<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>星系碰撞与并合 · 擦肩而过的千万次</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="labels"></div>

  <div class="sub" data-zh="看什么：恒星间距是恒星直径的 ~10⁷ 倍——两星系相撞恒星几乎互不相撞；较量在潮汐尾、气体星暴与动力学摩擦。怎么玩：选「掠过/迎头」预设看两条镜像潮汐尾；动力学摩擦拨到 0 看永远互相绕转；数一数恒星相撞计数器 · 拖动旋转 / 空格运行/暂停" data-en="Watch: stellar spacing is ~10⁷ stellar diameters — stars almost never collide; the fight is tidal tails, gas starbursts and dynamical friction. Play: pick grazing/head-on presets, set friction to 0 to orbit forever · drag to orbit / Space = run/pause">看什么：恒星间距是恒星直径的 ~10⁷ 倍——两星系相撞恒星几乎互不相撞；较量在潮汐尾、气体星暴与动力学摩擦。怎么玩：选「掠过/迎头」预设看两条镜像潮汐尾；动力学摩擦拨到 0 看永远互相绕转；数一数恒星相撞计数器 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- renderer ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,300);
camera.position.set(0,8.5,12.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=2; controls.maxDistance=80;
scene.add(new THREE.AmbientLight(0xffffff,0.55));
const key=new THREE.PointLight(0xfff0dd,120,60); key.position.set(0,10,6); scene.add(key);

/* ---- 物理模型（Toomre & Toomre 1972 式受限三体 + 核心二体轨道）----
   单位：1 长度 = 10 kpc，1 时间 = 0.12 Gyr；GM₁=GM₂=1.2。
   恒星/气体是测试粒子：只受两个核球的引力（软化 ε=0.12），
   恒星穿过时互不碰撞——间距/直径 ~10⁷，直接相撞概率由计数器按
   N²π(2R★)²vΔt/V 严格累加，全程 ~10⁻²⁰ 量级 ⇒ 计数永远 ≈0。
   核心轨道用辛欧拉积分；动力学摩擦把轨道能量交给恒星海
   （等效简化，见 step() 内注释）。
   真实星系并合历时 ~10⁹ 年，这里按等效强度压缩演示。 */
const GM=1.2, EPS2=0.0144, N1=1500, N2=1500, NG1=270, NG2=270;
const NSTAR=N1+N2, NGAS=NG1+NG2;
const sPos=new Float32Array(NSTAR*3), sVel=new Float32Array(NSTAR*3), sCol=new Float32Array(NSTAR*3);
const gPos=new Float32Array(NGAS*3), gVel=new Float32Array(NGAS*3), gCol=new Float32Array(NGAS*3);
const gHome=new Int8Array(NGAS); // 气体归属哪个星系（盘面回正用）
let cores=[{x:0,y:0,z:0,vx:0,vy:0,vz:0},{x:0,y:0,z:0,vx:0,vy:0,vz:0}];
let merged=false, mergeT=0, relax=0;

function initDisk(n0,n,nCore,cx,cz,vx0,vz0,spin,baseCol,gArr,home0){
  /* 盘在 xz 面：r 对数分布，开普勒圆轨道 v=sqrt(GM/r)，spin=±1 决定顺/逆行 */
  for(let i=0;i<n;i++){
    const p=(n0+i)*3;
    const r=0.35+1.25*Math.pow(Math.random(),1.6);
    const th=Math.random()*Math.PI*2;
    const lx=cx+r*Math.cos(th), lz=cz+r*Math.sin(th), ly=(Math.random()-0.5)*0.14;
    const vc=Math.sqrt(GM/r); // 开普勒圆速度
    gArr[p]=lx;gArr[p+1]=ly;gArr[p+2]=lz;
    if(gArr===sPos){
      sVel[p]=vx0 - spin*vc*Math.sin(th); sVel[p+1]=0; sVel[p+2]=vz0 + spin*vc*Math.cos(th);
      const c=baseCol;
      sCol[p]=c[0];sCol[p+1]=c[1];sCol[p+2]=c[2];
    }else{
      gVel[p]=vx0 - spin*vc*Math.sin(th); gVel[p+1]=0; gVel[p+2]=vz0 + spin*vc*Math.cos(th);
      gCol[p]=1;gCol[p+1]=0.62;gCol[p+2]=0.30;
      gHome[n0+i]=home0;
    }
  }
}
function loadPreset(kind,vt,spin){
  /* 远拱点 r=5 的束缚椭圆轨道；掠过 peri≈0.8，迎头 peri≈0.22 */
  merged=false;relax=0;passes=0;bursts=0;collExp=0;
  bulge1.visible=bulge2.visible=true;bulgeM.visible=false;
  cores=[{x:-2.5,y:0,z:0,vx:0,vy:0,vz:-vt*0.5},{x:2.5,y:0,z:0,vx:0,vy:0,vz:vt*0.5}];
  initDisk(0,N1,-1,cores[0].x,cores[0].z,0,0,spin,[1,0.92,0.78],sPos,0);
  initDisk(N1,N2,-1,cores[1].x,cores[1].z,0,0,spin,[0.74,0.84,1.0],sPos,0);
  initDisk(0,NG1,-1,cores[0].x,cores[0].z,0,0,spin,null,gPos,0);
  initDisk(NG1,NG2,-1,cores[1].x,cores[1].z,0,0,spin,null,gPos,1);
  starGeo.attributes.position.needsUpdate=true;starGeo.attributes.color.needsUpdate=true;
  gasGeo.attributes.position.needsUpdate=true;gasGeo.attributes.color.needsUpdate=true;
}
function stateSane(){
  const okC=c=>[c.x,c.y,c.z,c.vx,c.vy,c.vz].every(Number.isFinite);
  return okC(cores[0])&&okC(cores[1])
    &&Number.isFinite(sPos[0])&&Number.isFinite(sPos[(NSTAR-1)*3])
    &&Number.isFinite(gPos[0])&&Number.isFinite(gPos[(NGAS-1)*3]);
}
function setPreset(kind){
  const vt=kind==='head'?0.20:0.363;
  const spin=kind==='head'?-1:1; // 迎头给逆行盘：尾巴弱 → 对照
  loadPreset(kind,vt,spin);
  /* 守卫：任何关键量为 NaN → 回退默认预设（掠过·顺行） */
  if(!stateSane())loadPreset('graze',0.363,1);
}

/* ---- 3D 对象 ---- */
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
starGeo.setAttribute('color',new THREE.BufferAttribute(sCol,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({size:0.055,vertexColors:true,sizeAttenuation:true})));
const gasGeo=new THREE.BufferGeometry();
gasGeo.setAttribute('position',new THREE.BufferAttribute(gPos,3));
gasGeo.setAttribute('color',new THREE.BufferAttribute(gCol,3));
const gasPts=new THREE.Points(gasGeo,new THREE.PointsMaterial({size:0.10,vertexColors:true,transparent:true,opacity:0.85,
  blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
scene.add(gasPts);
/* 核球 */
function bulgeMesh(col){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.16,18,14),
    new THREE.MeshBasicMaterial({color:col}));
  scene.add(m);return m;
}
const bulge1=bulgeMesh(0xffe2b8), bulge2=bulgeMesh(0xbcd8ff), bulgeM=bulgeMesh(0xffd9a0);
bulgeM.visible=false;
/* 星暴闪光 sprite 池 */
const flashPool=[];
for(let i=0;i<26;i++){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({color:0xfff3c8,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.scale.setScalar(0.01);scene.add(sp);flashPool.push({sp,t:9});
}
function spawnFlash(x,y,z){
  const f=flashPool.reduce((a,b)=>a.t>b.t?a:b);
  f.t=0;f.sp.position.set(x,y,z);f.sp.scale.setScalar(0.5);
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const tailPos=new THREE.Vector3();
const lblA=addLabel(()=>L('星系 A（暖色盘）','Galaxy A (warm disk)'),new THREE.Vector3(-2.5,0.9,0),'o',()=>!merged);
const lblB=addLabel(()=>L('星系 B（冷色盘）','Galaxy B (cool disk)'),new THREE.Vector3(2.5,0.9,0),'b',()=>!merged);
addLabel(()=>L('潮汐尾：低引力束缚的外层恒星被甩出','Tidal tail: loosely bound stars flung out'),tailPos,'g',()=>tailVis);
addLabel(()=>L('并合残余 → 椭圆星系（Milkomeda）','Remnant → elliptical (Milkomeda)'),new THREE.Vector3(0,1.1,0),'r',()=>merged&&simT-mergeT>1.5);

/* ---- 状态 ---- */
const Q=new URLSearchParams(location.search);
let playing=!Q.has('pause');
let simT=0, speedK=3, fric=1.0, gasOn=true, labelsOn=Q.get('labels')!=='0';
let preset='graze', passes=0, prevSep=9, rising=false, bursts=0, collExp=0, tailVis=false;
if(Q.get('speed'))speedK=clamp(+Q.get('speed')||3,1,8);
let phaseTxt='—';

function accelCore(i,out){
  /* 核心彼此引力（软化）+ 动力学摩擦（并合后关闭） */
  const cc=cores[i], o=cores[i===0?1:0];
  let dx=o.x-cc.x,dy=o.y-cc.y,dz=o.z-cc.z;
  const r2=dx*dx+dy*dy+dz*dz, inv=1/Math.pow(r2+0.02,1.5);
  const f=GM*inv;
  out.x+=f*dx;out.y+=f*dy;out.z+=f*dz;
}
function step(h){
  /* 核心轨道：kick-drift-kick */
  const a1={x:0,y:0,z:0},a2={x:0,y:0,z:0};
  if(!merged){
    accelCore(0,a1);accelCore(1,a2);
    /* 动力学摩擦（Chandrasekhar 型等效简化，动量守恒的双体耗散）：
       远距项 ∝r⁻³ 让轨道一圈圈衰减，近距项 ∝r⁻¹⁰ 让末段螺旋坠入快速收尾；
       a₁=+k·v_rel，a₂=-k·v_rel ⇒ d v_rel/dt = -2k·v_rel。
       真实并合历时 ~10⁹ 年，此处按等效强度压缩演示（滑块可调）。 */
    const dx=cores[1].x-cores[0].x,dy=cores[1].y-cores[0].y,dz=cores[1].z-cores[0].z;
    const r2=dx*dx+dy*dy+dz*dz;
    const kv=fric*(0.006/Math.pow(r2+0.05,1.5)+0.0003/Math.pow(r2+0.02,5));
    const dvx=(cores[1].vx-cores[0].vx)*kv,dvy=(cores[1].vy-cores[0].vy)*kv,dvz=(cores[1].vz-cores[0].vz)*kv;
    a1.x+=dvx;a1.y+=dvy;a1.z+=dvz; a2.x-=dvx;a2.y-=dvy;a2.z-=dvz;
    cores[0].vx+=a1.x*h;cores[0].vy+=a1.y*h;cores[0].vz+=a1.z*h;
    cores[1].vx+=a2.x*h;cores[1].vy+=a2.y*h;cores[1].vz+=a2.z*h;
  }
  for(const c of cores){c.x+=c.vx*h;c.y+=c.vy*h;c.z+=c.vz*h;}
  if(!merged){
    const dx=cores[1].x-cores[0].x,dy=cores[1].y-cores[0].y,dz=cores[1].z-cores[0].z;
    const sep=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(sep<0.32){ // 穿心并合：动量守恒合成一核
      const m1=1,m2=1;
      cores[0]={x:(cores[0].x+cores[1].x)/2,y:(cores[0].y+cores[1].y)/2,z:(cores[0].z+cores[1].z)/2,
        vx:(cores[0].vx+cores[1].vx)/2,vy:(cores[0].vy+cores[1].vy)/2,vz:(cores[0].vz+cores[1].vz)/2};
      merged=true;mergeT=simT;relax=1;
      bulge1.visible=bulge2.visible=false;bulgeM.visible=true;
    }else{
      /* 近心点计数：sep 由降转升 */
      if(sep<1.8){
        if(!rising&&prevSep<sep){passes++;rising=true;}
        if(prevSep>sep)rising=false;
      }
      prevSep=sep;
    }
  }
  /* 恒星测试粒子：双核引力（并合后单核） */
  const cs=merged?[cores[0]]:cores;
  for(let i=0;i<NSTAR;i++){
    const p=i*3;
    let x=sPos[p],y=sPos[p+1],z=sPos[p+2];
    let ax=0,ay=0,az=0;
    for(const c of cs){
      const dx=c.x-x,dy=c.y-y,dz=c.z-z;
      const f=GM/Math.pow(dx*dx+dy*dy+dz*dz+EPS2,1.5);
      ax+=f*dx;ay+=f*dy;az+=f*dz;
    }
    if(relax>0){ax-=sVel[p]*0.05*relax;ay-=sVel[p+1]*0.05*relax;az-=sVel[p+2]*0.05*relax;}
    sVel[p]+=ax*h;sVel[p+1]+=ay*h;sVel[p+2]+=az*h;
    sPos[p]+=sVel[p]*h;sPos[p+1]+=sVel[p+1]*h;sPos[p+2]+=sVel[p+2]*h;
  }
  /* 气体：同样受引力，另加耗散（回盘面+微阻尼）——气体云相撞丢能量 */
  const close=!merged&&(Math.hypot(cores[1].x-cores[0].x,cores[1].y-cores[0].y,cores[1].z-cores[0].z)<2.4);
  for(let i=0;i<NGAS;i++){
    const p=i*3;
    let x=gPos[p],y=gPos[p+1],z=gPos[p+2];
    let ax=0,ay=0,az=0;
    for(const c of cs){
      const dx=c.x-x,dy=c.y-y,dz=c.z-z;
      const f=GM/Math.pow(dx*dx+dy*dy+dz*dz+EPS2,1.5);
      ax+=f*dx;ay+=f*dy;az+=f*dz;
    }
    ay-=gPos[p+1]*0.6; // 耗散：气体沉回母盘面
    ax-=gVel[p]*0.02;ay-=gVel[p+1]*0.02;az-=gVel[p+2]*0.02;
    gVel[p]+=ax*h;gVel[p+1]+=ay*h;gVel[p+2]+=az*h;
    gPos[p]+=gVel[p]*h;gPos[p+1]+=gVel[p+1]*h;gPos[p+2]+=gVel[p+2]*h;
    /* 星暴：核间距近时，冲进对方引力井的气体被压缩点燃 */
    if(close&&!merged){
      const other=cores[1-gHome[i]];
      const dx=other.x-x,dy=other.y-y,dz=other.z-z;
      const d2=dx*dx+dy*dy+dz*dz;
      if(d2<0.9){
        const vrel=Math.hypot(gVel[p]-other.vx,gVel[p+1]-other.vy,gVel[p+2]-other.vz);
        if(vrel>1.0&&Math.random()<0.012&&bursts<400){
          bursts++;spawnFlash(x,y,z);
          gCol[p]=1;gCol[p+1]=0.9;gCol[p+2]=0.62; // 点亮成新恒星
        }
      }
    }
  }
  if(relax>0){relax=Math.max(0,relax-h*0.03);}
  /* 理论恒星相撞期望：Σ N²/2 · π(2R★)² · v_rel · dt / V
     R★≈7×10⁵ km = 2.3×10⁻¹⁴ kpc；v: 1 km/s ≈ 1.02 kpc/Gyr */
  {
    const vrel=merged?0.3:Math.hypot(cores[1].vx-cores[0].vx,cores[1].vz-cores[0].vz)*30;
    const sig=3.14159*Math.pow(4.5e-14,2); // kpc²，两倍恒星半径截面
    collExp+=(NSTAR*NSTAR*0.5)*sig*(vrel*1.023)*(h*0.12)/(3000); // V≈(10 kpc)³ 量级
  }
}

/* ---- UI ---- */
const STEPS=[
 {zh:'空旷的舞台：星系内恒星间距是恒星直径的 ~10⁷ 倍——两盘互穿，恒星几乎零碰撞',en:'An empty stage: stellar spacing ~10⁷ stellar diameters — disks pass through, almost zero collisions',
  act(){setPreset(preset);}},
 {zh:'第一次接近：潮汐力把外层恒星沿轨道甩出去，顺行盘撕出两条对称潮汐尾',en:'First pass: tides fling outer stars along the orbit — prograde disks throw two mirror tails',
  act(){setPreset('graze');}},
 {zh:'气体才是主角：气体云迎头相撞、耗能压缩 → 星暴，新恒星成片点亮',en:'Gas is the protagonist: colliding clouds lose energy, compress → starburst lights up',
  act(){setPreset('graze');fric=2.0;document.getElementById('sFric').value=2;}},
 {zh:'动力学摩擦：核球把轨道能量与角动量交给恒星海，远拱点一圈圈缩小',en:'Dynamical friction: cores hand orbital energy to the star sea; apoapsis shrinks pass by pass',
  act(){setPreset('graze');fric=3.0;document.getElementById('sFric').value=3;}},
 {zh:'穿心并合：两核螺旋坠入合并，残余恒星弛豫成一颗椭圆星系',en:'Final plunge: cores spiral in and merge; the debris relaxes into one elliptical galaxy',
  act(){setPreset('head');fric=3.0;document.getElementById('sFric').value=3;}},
 {zh:'45 亿年后：银河系 × 仙女座 → Milkomeda；全程恒星相撞计数 ≈ 0',en:'T+4.5 Gyr: Milky Way × Andromeda → Milkomeda; star-collision counter ≈ 0 throughout',
  act(){setPreset('head');fric=3.0;document.getElementById('sFric').value=3;}}
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();STEPS[i].act();applyUI();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function phaseName(){
  if(merged)return simT-mergeT<2?L('穿心并合','Final plunge'):L('弛豫 → 椭圆星系','Relaxing → elliptical');
  if(bursts>passes*6&&passes>0)return L('星暴','Starburst');
  if(passes===0)return L('第一次接近','First approach');
  if(passes===1)return L('第一次掠过 · 潮汐尾','First passage · tidal tails');
  if(passes<7)return L('第 '+passes+' 次掠过 · 轨道衰减','Passage #'+passes+' · orbit decaying');
  return L('螺旋坠入 · 即将并合','Spiraling in · merger imminent');
}
function updateStats(){
  const sep=merged?0:Math.hypot(cores[1].x-cores[0].x,cores[1].y-cores[0].y,cores[1].z-cores[0].z);
  document.getElementById('stSep').innerHTML=(sep*10).toFixed(1)+'<small> kpc</small>';
  document.getElementById('stPhase').textContent=phaseName();
  const cEl=document.getElementById('stColl');
  cEl.innerHTML='0 <small>(期望 '+(collExp<=0?'0':collExp.toExponential(0))+')</small>';
  document.getElementById('stBurst').innerHTML=bursts+'<small> 团</small>';
}
function applyUI(){
  document.getElementById('btnGraz').classList.toggle('on',preset==='graze');
  document.getElementById('btnHead').classList.toggle('on',preset==='head');
  document.getElementById('btnGas').classList.toggle('on',gasOn);
  document.getElementById('btnGas').textContent=gasOn?L('气体层：显示','Gas layer: on'):L('气体层：隐藏','Gas layer: off');
  gasPts.visible=gasOn;
  document.getElementById('sFricVal').textContent=fric.toFixed(1)+'×';
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
}
document.getElementById('btnGraz').addEventListener('click',()=>{preset='graze';setPreset(preset);applyUI();});
document.getElementById('btnHead').addEventListener('click',()=>{preset='head';setPreset(preset);applyUI();});
document.getElementById('btnGas').addEventListener('click',()=>{gasOn=!gasOn;applyUI();});
document.getElementById('btnReset').addEventListener('click',()=>{setPreset(preset);});
document.getElementById('sFric').addEventListener('input',e=>{fric=+e.target.value;applyUI();});
document.getElementById('sSpd').addEventListener('input',e=>{speedK=+e.target.value;applyUI();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';
  localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x07090c:0xdde6ee);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();applyUI();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    const total=dt*speedK*0.9, sub=3, h=total/sub;
    for(let s=0;s<sub;s++)step(h);
    simT+=total;
    starGeo.attributes.position.needsUpdate=true;
    gasGeo.attributes.position.needsUpdate=true;
    gasGeo.attributes.color.needsUpdate=true;
    /* 潮汐尾检测：存在离双核都 >3.2 的恒星 → 标注 */
    tailVis=false;
    for(let i=0;i<NSTAR;i+=7){
      const p=i*3;
      const d1=Math.hypot(sPos[p]-cores[0].x,sPos[p+1]-cores[0].y,sPos[p+2]-cores[0].z);
      const d2=merged?9:Math.hypot(sPos[p]-cores[1].x,sPos[p+1]-cores[1].y,sPos[p+2]-cores[1].z);
      if(d1>3.2&&d2>3.2){tailVis=true;
        tailPos.set(sPos[p],sPos[p+1]+0.3,sPos[p+2]);break;}
    }
  }
  bulge1.position.set(cores[0].x,cores[0].y,cores[0].z);
  bulge2.position.set(cores[1].x,cores[1].y,cores[1].z);
  bulgeM.position.set(cores[0].x,cores[0].y,cores[0].z);
  lblA.position.set(cores[0].x,cores[0].y+0.8,cores[0].z);
  lblB.position.set(cores[1].x,cores[1].y+0.8,cores[1].z);
  key.position.set(cores[0].x,cores[0].y+8,cores[0].z+5);
  for(const f of flashPool){
    if(f.t<1){f.t+=dt*2.2;f.sp.material.opacity=Math.max(0,1-f.t);f.sp.scale.setScalar(0.3+f.t*1.4);}
    else f.sp.material.opacity=0;
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
applyTheme();applyLang();setPreset('graze');updateStats();
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
start();
</script>
