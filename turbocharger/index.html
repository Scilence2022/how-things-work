<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涡轮增压器 · 废气里的免费动力</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff9f43;
    --bg:#10151c; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b26205;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,180,84,.9); color: #ffe0ae; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(255,159,67,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(160,106,18,.9); color: #8a5c0d; }
  :root[data-theme="light"] .lbl.r { border-color: rgba(196,68,48,.9); color: #b03a26; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    max-width: 620px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.bad { color: var(--hot); }
  #stats .v.b { color: var(--cold); }
  #stats .v.g { color: #38d9a9; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 396px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,159,67,.6); background: rgba(255,159,67,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(178,98,5,.55); background: rgba(178,98,5,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 58px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,159,67,.10); border-color: rgba(255,159,67,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(178,98,5,.08); border-color: rgba(178,98,5,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="涡轮增压器:废气不白扔" data-en="Turbocharger: exhaust is not thrown away">涡轮增压器:废气不白扔</h1>
  <div class="sub" data-zh="废气本要白扔 → 吹涡轮到 100,000+ rpm → 同一根轴带动压气机 → 更多空气=更多油=更大功率;低转有迟滞,超压有泄压阀 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Exhaust was going overboard → it spins the turbine past 100,000 rpm → one shared shaft drives the compressor → more air = more fuel = more power; lag at low rpm, wastegate caps boost · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">废气本要白扔 → 吹涡轮到 100,000+ rpm → 同一根轴带动压气机 → 更多空气=更多油=更大功率;低转有迟滞,超压有泄压阀 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="涡轮转速" data-en="turbine speed">涡轮转速</span><span class="v hot" id="stN">—</span>
  <span class="k" data-zh="增压压力" data-en="boost">增压压力</span><span class="v ok" id="stB">—</span>
  <span class="k" data-zh="进气密度" data-en="intake density">进气密度</span><span class="v b" id="stD">—</span>
  <span class="k" data-zh="输出功率" data-en="power">输出功率</span><span class="v g" id="stP">—</span>
  <span class="k" data-zh="迟滞时间" data-en="lag">迟滞时间</span><span class="v" id="stL">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnStomp" data-zh="一脚地板油" data-en="Floor it!">一脚地板油</button>
    <button class="abtn" id="btnWG" data-zh="泄压阀:自动" data-en="wastegate: auto">泄压阀:自动</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="油门" data-en="Throttle">油门</label><input id="thr" type="range" min="0" max="100" step="1" value="35"><span class="val" id="thrVal">35 %</span></div>
  <div class="row"><label data-zh="增压目标" data-en="Boost target">增压目标</label><input id="btg" type="range" min="0.5" max="2" step="0.05" value="1.2"><span class="val" id="btgVal">1.20 bar</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../four-stroke-engine/" data-zh="它服务的本体:四冲程发动机" data-en="its host: the four-stroke engine">它服务的本体:四冲程发动机</a>
    <a href="../wind-turbine/" data-zh="同款叶轮:风力发电机" data-en="same impeller trick: wind turbine">同款叶轮:风力发电机</a>
    <a href="../centrifugal-governor/" data-zh="泄压阀也是反馈:离心调速器" data-en="wastegate is feedback too: Watt governor">泄压阀也是反馈:离心调速器</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10151c);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.board.color.set(THEME === 'light' ? 0xe3e9f1 : 0x151c26);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('涡轮增压器 · 废气里的免费动力', 'Turbocharger · free power from exhaust');
  syncWGBtn();
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.6, 3.1, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, metalness: 0, emissive: 0x000000 }),
  board: mat(0x151c26, { roughness: 0.95, metalness: 0, emissive: 0x000000 }),
  dark: mat(0x39424f, { roughness: 0.7 }),
  steel: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  alu: mat(0xc9d2da, { metalness: 0.75, roughness: 0.3 }),
  block: mat(0x525e6e, { metalness: 0.6, roughness: 0.5 }),
  iron: mat(0x4a4f58, { metalness: 0.6, roughness: 0.55 }),
  ironHot: mat(0x3c3f46, { metalness: 0.55, roughness: 0.5, emissive: 0xff3800, emissiveIntensity: 0.05 }),
  mani: mat(0x6e5a52, { metalness: 0.6, roughness: 0.45, emissive: 0xff5a2a, emissiveIntensity: 0.12 }),
  bladeT: mat(0x9aa2ac, { metalness: 0.85, roughness: 0.3 }),
  bladeC: mat(0xbfd4ea, { metalness: 0.8, roughness: 0.25 }),
  sleeve: new THREE.MeshStandardMaterial({ color: 0x9fb6cf, transparent: true, opacity: 0.14,
    roughness: 0.4, metalness: 0.2, side: THREE.DoubleSide, depthWrite: false }),
  tube: new THREE.MeshStandardMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.17,
    roughness: 0.4, metalness: 0.2, side: THREE.DoubleSide, depthWrite: false }),
};

/* ---------------- 造型小工具 ---------------- */
function box(w, h, d, m, x, y, z, parent = scene) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z); parent.add(o); return o;
}
function cyl(r1, r2, h, m, x, y, z, parent = scene, seg = 20) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), m);
  o.position.set(x, y, z); parent.add(o); return o;
}
function curveOf(pts) { return new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))); }
function tubeAlong(pts, r, m) {
  const o = new THREE.Mesh(new THREE.TubeGeometry(curveOf(pts), 40, r, 10, false), m);
  scene.add(o); return o;
}

/* ================= 布局:右=发动机,中=涡轮,左=压气机,后=迟滞记录板 ================= */
const ground = new THREE.Mesh(new THREE.BoxGeometry(12.5, 0.2, 6.4), M.floor);
ground.position.y = -0.1;
scene.add(ground);
box(0.16, 1.3, 0.16, M.dark, -1.05, 0.65, 0);          // 涡轮支架

/* ---------------- 发动机(右,x≈2.3) ---------------- */
box(1.1, 0.32, 1.0, M.block, 2.3, 0.4, 0);             // 曲轴箱
box(1.14, 0.3, 1.04, M.block, 2.3, 1.76, 0);           // 缸盖
box(1.05, 1.06, 0.1, M.block, 2.3, 1.15, -0.47);       // 排气侧板
box(1.05, 1.06, 0.1, M.block, 2.3, 1.15, 0.47);        // 进气侧板
for (const z of [-0.22, 0.22]) {
  const sl = cyl(0.31, 0.31, 1.06, M.sleeve, 2.3, 1.15, z, scene, 24);
  sl.renderOrder = 4;
  const crank = cyl(0.13, 0.13, 0.07, M.steel, 2.3, 0.5, z);
  crank.rotation.x = Math.PI / 2;
}
const pistons = [], rods = [];
for (const z of [-0.22, 0.22]) {
  pistons.push(cyl(0.26, 0.26, 0.2, M.alu, 2.3, 1.12, z, scene, 22));
  rods.push(cyl(0.045, 0.045, 1, M.steel, 2.3, 0.8, z, scene, 8));
}
const crankShaft = cyl(0.06, 0.06, 0.62, M.steel, 2.3, 0.5, 0);
crankShaft.rotation.x = Math.PI / 2;

/* ---------------- 管路曲线(造型与粒子共用) ---------------- */
const EX_THRU = [[2.35, 1.9, -0.28], [1.95, 2.08, -0.42], [1.45, 2.1, -0.34], [1.05, 2.02, -0.34],

/* ================= 状态与物理 ================= */
const RHO0 = 1.225, P_ATM = 1.013;
let playing = !qsBool('pause', false);
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let throttle = 0.35, boostTgt = 1.2;
let engRPM = 850, turboN = 10, boost = 0.02, wgLift = 0, wgStuck = false, wgShare = 0;
let exh = 0, PR = 1, rho = RHO0, powKW = 0, powNA = 0;
let stompT = -1e9, measuring = false, lag = null;
let tSim = 0, sampleAcc = 0, chartN = 0, crankPh = 0, rotorAng = 0;
const chR = [], chB = [];
const overboost = () => wgStuck && boost > boostTgt + 0.22;

function physStep(h) {
  const rpmTgt = 850 + throttle * 5650;
  engRPM += (rpmTgt - engRPM) * (1 - Math.exp(-h / 0.45));
  exh = Math.pow(engRPM / 6500, 1.6) * (0.3 + 0.7 * throttle);
  const wgCmd = (!wgStuck && boost > boostTgt - 0.06) ? clamp((boost - (boostTgt - 0.06)) / 0.18, 0, 1) : 0;
  wgLift += (wgCmd - wgLift) * (1 - Math.exp(-h / 0.1));
  wgShare = wgLift * 0.55;
  const Nss = 128 * Math.pow(Math.max(exh * (1 - wgShare), 0.001), 0.42);
  const tau = Math.max(1.6 - 1.1 * clamp(exh, 0, 1), 0.25);
  turboN += (Nss - turboN) * (1 - Math.exp(-h / tau));
  boost += (Math.pow(turboN / 128, 2) * 1.9 - boost) * (1 - Math.exp(-h / 0.16));
  PR = 1 + boost / P_ATM;
  rho = RHO0 * PR / (1 + 0.089 * boost);
  powNA = 92 * Math.pow(engRPM / 6000, 0.9) * (0.4 + 0.6 * throttle);
  powKW = powNA * (1 + 0.72 * boost);
  if (measuring && boost >= 0.9 * boostTgt) { lag = tSim - stompT; measuring = false; }
}
function pushSample() { chR.push(turboN); chB.push(boost); if (chR.length > NSAMP) { chR.shift(); chB.shift(); } chartN = chR.length; }
function fastForward(sec, stopFn) {
  const lim = tSim + sec;
  let g = 0;
  while (tSim < lim && g++ < 4000 && !(stopFn && stopFn())) {
    physStep(0.05); tSim += 0.05; sampleAcc += 0.05;
    if (sampleAcc >= SAMPLE_DT) { sampleAcc -= SAMPLE_DT; pushSample(); }
  }
}
function resetState() {
  tSim = 0; sampleAcc = 0; chartN = 0; chR.length = 0; chB.length = 0;
  engRPM = 850; turboN = 10; boost = 0.02; wgLift = 0; wgShare = 0;
  stompT = -1e9; measuring = false; lag = null; crankPh = 0;
  physStep(0);
}
function instantSim(sec) { resetState(); fastForward(clamp(sec, 0, 90) - tSim, null); }

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 每帧图形更新 ---------------- */
function updateVisuals() {
  rotorGrp.rotation.x = rotorAng;
  for (let i = 0; i < 2; i++) {
    const p = pistons[i], y = 1.12 + 0.18 * Math.cos(crankPh + i * Math.PI);
    p.position.y = y;
    rods[i].scale.y = Math.max(y - 0.62, 0.1);
    rods[i].position.y = (y - 0.1 + 0.5) / 2;
  }
  M.mani.emissiveIntensity = 0.1 + exh * 1.3;
  M.ironHot.emissiveIntensity = 0.04 + exh * (1 - 0.35 * wgLift) * 1.1;
  wgHinge.rotation.x = -wgLift * 1.15;
  const spin = clamp(turboN / 128, 0, 1);
  blurMatT.opacity = spin * 0.4;
  blurMatC.opacity = spin * 0.3;
}
function updateFlow(dts) {
  const vEx = (0.16 + exh * 1.4) * dts;
  const nEx = Math.round(lerp(16, 90, exh));
  for (let i = 0; i < 90; i++) {
    const p = exP[i];
    p.s += vEx * p.mul;
    if (p.s >= 1) { p.s -= 1; p.wg = Math.random() < wgShare ? 1 : 0; }
    if (i < nEx) {
      (p.wg ? exWgC : exThruC).getPoint(clamp(p.s, 0, 1), v3);
      dummy.position.copy(v3);
      dummy.rotation.set(p.s * 9, p.s * 7, 0);
      dummy.scale.setScalar(1);
      cTmp.copy(C_EXHOT).lerp(C_EXCOOL, clamp((p.s - 0.52) / 0.2, 0, 1));
      exMesh.setColorAt(i, cTmp);
    } else dummy.scale.setScalar(0.0001);
    dummy.updateMatrix();
    exMesh.setMatrixAt(i, dummy.matrix);
  }
  exMesh.instanceMatrix.needsUpdate = true;
  if (exMesh.instanceColor) exMesh.instanceColor.needsUpdate = true;
  const vIn = (0.22 + turboN / 128 * 1.0) * dts;
  const nIn = Math.round(lerp(30, 110, clamp(boost / 1.8, 0, 1)));
  const bs = 0.8 + 0.6 * clamp(boost / 1.8, 0, 1);
  for (let i = 0; i < 110; i++) {
    const p = inP[i];
    p.s += vIn * p.mul;
    if (p.s >= 1) p.s -= 1;
    if (i < nIn) {
      inCurve.getPoint(clamp(p.s, 0, 1), v3);
      dummy.position.copy(v3);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.setScalar(bs);
      if (p.s < 0.33) cTmp.copy(C_AMB);
      else if (p.s < 0.43) cTmp.copy(C_AMB).lerp(C_HOTK, (p.s - 0.33) / 0.10);
      else if (p.s < 0.52) cTmp.copy(C_HOTK);
      else if (p.s < 0.68) cTmp.copy(C_HOTK).lerp(C_ICC, (p.s - 0.52) / 0.16);
      else cTmp.copy(C_ICC);
      inMesh.setColorAt(i, cTmp);
    } else dummy.scale.setScalar(0.0001);
    dummy.updateMatrix();
    inMesh.setMatrixAt(i, dummy.matrix);
  }
  inMesh.instanceMatrix.needsUpdate = true;
  if (inMesh.instanceColor) inMesh.instanceColor.needsUpdate = true;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    physStep(dts);
    tSim += dts;
    sampleAcc += dts;
    while (sampleAcc >= SAMPLE_DT) { sampleAcc -= SAMPLE_DT; pushSample(); }
    crankPh += engRPM * 0.004 * dts;
    rotorAng += turboN * 0.105 * dts;
  }
  updateVisuals();
  updateFlow(dts);
  updateChartGeo();
  stN.textContent = Math.round(turboN * 1000).toLocaleString('en-US') + ' rpm';
  stB.textContent = boost.toFixed(2) + ' bar';
  stB.className = 'v ' + (overboost() ? 'bad' : (wgLift > 0.3 ? '' : 'ok'));
  stD.textContent = rho.toFixed(2) + ' kg/m³';
  stP.textContent = Math.round(powKW) + ' kW';
  stL.textContent = lag !== null ? lag.toFixed(2) + ' s' : '—';
  formulaAcc += dt;
  if (formulaAcc > 0.25) { formulaAcc = 0; updateFormula(); }
  for (const r of labelReg) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
speed = clamp(qsFloat('speed', 1), 0.2, 3);
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
instantSim(clamp(qsFloat('t', 0), 0, 90));
applyTheme();
applyLang();
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; refreshLabels(); }
if (!qsBool('chart', true)) { chartOn = false; tglChart.checked = false; board.visible = lnR.l.visible = lnBo.l.visible = false; }
if (!qsBool('spin', true)) { controls.autoRotate = false; tglRotate.checked = false; }
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
setPlayLabel();
start();
</script>
