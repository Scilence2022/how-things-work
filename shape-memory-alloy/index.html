<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>形状记忆合金 · 温度唤醒的形状</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="形状记忆合金 · 温度唤醒的形状" data-en="Shape-Memory Alloys · Heat It and It Remembers">形状记忆合金 · 温度唤醒的形状</h1>
  <div class="sub" data-zh="镍钛诺有两副晶格:低温马氏体(B19′ 单斜)可以被掰弯——孪晶畴整格翻转,晶格只记账不结账,所以能塑性变形却不破坏记忆→加热跨过 Af,原子滑回奥氏体(B2 立方)原型位置,~8% 的应变一次归还,V 形当场弹直;在 Af 以上拉伸则走出应力诱发马氏体的 500–800 MPa 平台,卸载即弹回——眼镜框与牙弓丝掰不坏的原因;Af 由成分配比调定,心血管支架调到 ~25 °C 以下,体温一到自动张开→单向记忆降温不回头,双向要靠训练 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Nitinal carries two lattices: low-temperature martensite (B19′ monoclinic) can be bent — twin domains flip whole-cell style, the lattice books the strain without settling it, so it deforms plastically yet keeps its memory → heat past Af and atoms slide back to the austenite (B2 cubic) prototype sites, returning ~8% strain in one payment as the V snaps straight; pull above Af and stress-induced martensite draws a 500–800 MPa plateau, springing back on unload — why eyeglass frames and arch wires survive bending; Af is set by composition, stents tuned below ~25 °C so body heat deploys them → one-way memory never returns on cooling; two-way takes training · 3D interactive demo · drag to orbit · Space = run/pause">形状记忆合金 · 温度唤醒的形状</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="当前相" data-en="Phase">当前相</span><span class="v" id="stPh">—</span>
  <span class="k" data-zh="应变" data-en="Strain">应变</span><span class="v warn" id="stStr">—</span>
  <span class="k" data-zh="温度" data-en="Temperature">温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="回复应力" data-en="Recovery stress">回复应力</span><span class="v ok" id="stSig">—</span>
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v" id="stSt">—</span>
</div>

<div id="plot">
  <h3 data-zh="应力-应变:镍钛诺(蓝)在 500–800 MPa 走出应力诱发马氏体平台,卸载原路弹回;普通钢(灰)屈服后卸载留下永久变形" data-en="Stress-strain: NiTi (blue) crosses a 500–800 MPa stress-induced martensite plateau and springs back on unload; ordinary steel (gray) keeps a permanent set after yielding">应力-应变:镍钛诺(蓝)在 500–800 MPa 走出应力诱发马氏体平台,卸载原路弹回;普通钢(灰)屈服后卸载留下永久变形</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="马氏体 B19′(蓝):低温,可变形" data-en="martensite B19′ (blue): cold, deformable">马氏体 B19′(蓝):低温,可变形</span>
    <span class="chip.r" data-zh="奥氏体 B2(红):高温,记忆原型" data-en="austenite B2 (red): hot, the remembered shape">奥氏体 B2(红):高温,记忆原型</span>
    <span class="chip.o" data-zh="孪晶畴 ±45°:整格翻转去孪晶" data-en="twin domains ±45°: de-twinning by cell flips">孪晶畴 ±45°:整格翻转去孪晶</span>
    <span class="chip.g" data-zh="平台 500–800 MPa:超弹性的签名" data-en="plateau 500–800 MPa: superelasticity's signature">平台 500–800 MPa:超弹性的签名</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnMode" data-zh="模式:形状记忆" data-en="Mode: shape memory">模式:形状记忆</button>
    <button class="abtn" id="btnV" data-zh="重新弯成 V 形" data-en="Re-bend to V">重新弯成 V 形</button>
    <button class="abtn" id="btnCycle" data-zh="温度扫描:关" data-en="T sweep: OFF">温度扫描:关</button>
    <button class="abtn" id="btnUnload" data-zh="卸载" data-en="Unload">卸载</button>
  </div>
  <div class="row"><label data-zh="温度" data-en="Temperature">温度</label><input id="sT" type="range" min="-20" max="120" step="1" value="20"><span class="val" id="sTVal">20 °C</span></div>
  <div class="row"><label data-zh="Af 相变温度" data-en="Af transition">Af 相变温度</label><input id="sAf" type="range" min="0" max="100" step="1" value="60"><span class="val" id="sAfVal">60 °C</span></div>
  <div class="row"><label data-zh="载荷(超弹性)" data-en="Load (superelastic)">载荷(超弹性)</label><input id="sLoad" type="range" min="0" max="100" step="1" value="0"><span class="val" id="sLoadVal">0 %</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Plot">曲线</span></label>
      <label><input id="tglDom" type="checkbox" checked> <span data-zh="孪晶畴" data-en="Domains">孪晶畴</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../crystal-growth/" data-zh="晶体生长:晶格如何搭出秩序" data-en="crystal growth: how lattices build order">晶体生长:晶格如何搭出秩序</a>
    <a href="../phase-transition/" data-zh="相变:一整个家族的同行者" data-en="phase transition: the whole family">相变:一整个家族的同行者</a>
    <a href="../thermoelectric/" data-zh="温差电:精确控温的手段" data-en="thermoelectric: precise temperature control">温差电:精确控温的手段</a>
    <a href="../piezoelectricity/" data-zh="压电:另一类智能材料" data-en="piezoelectricity: another smart material">压电:另一类智能材料</a>
    <a href="../quartz-watch/" data-zh="石英表:被驯服的晶格振动" data-en="quartz watch: a tamed lattice vibration">石英表:被驯服的晶格振动</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = u => u * u * (3 - 2 * u);
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 12, 46);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('形状记忆合金 · 温度唤醒的形状', 'Shape-Memory Alloys · Heat It and It Remembers');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0.8, 1.8, 8.6);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, -0.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 36;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(6, 8, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff, 0.3);
fill.position.set(-7, 5, -6);

/* 应力-应变(超弹性):σ = 120 + load·680 → 500 MPa 前弹性 1%,500–800 平台走到 8% */
function calcSigmaEps() {
  sigma = seMode ? 120 + load * 680 : 0;
  if (!seMode) { eps = 0; return; }
  if (sigma <= 500) eps = sigma / 500;
  else if (sigma <= 800) eps = 1 + (sigma - 500) / 300 * 7;
  else eps = 8 + (sigma - 800) / 50;
}
function targetWave() {

function pathPoint(u, out) {
  const x = (u - 0.5) * 6.8 * stretch;
  const vY = -bend * 0.9 * (1 - Math.abs(2 * u - 1));
  const sY = -bend * 0.9;
  out.set(x, lerp(vY, sY, ease(mS)), 0);
  return out;
}
function buildTube() {
  if (tubeMesh) { wireGrp.remove(tubeMesh); tubeMesh.geometry.dispose(); }
  const pts = [];
  const tmp = new THREE.Vector3();
  for (let i = 0; i <= 32; i++) pts.push(pathPoint(i / 32, tmp).clone());
  const curve = new THREE.CatmullRomCurve3(pts);
  tubeMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.085, 10), wireM);
  wireGrp.add(tubeMesh);
  builtM = mS; builtStretch = stretch; bendBuild = bend;
}

/* ================= 绘图:应力-应变 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 42, padR = 12, padT = 12, padB = 24;
  const xOf = e => padL + clamp(e, 0, 10) / 10 * (W - padL - padR);
  const yOf = s => (H - padB) - clamp(s, 0, 1000) / 1000 * (H - padT - padB);
  ctx.font = '14px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const e of [0, 2, 4, 6, 8, 10]) {
    ctx.beginPath(); ctx.moveTo(xOf(e), padT); ctx.lineTo(xOf(e), H - padB); ctx.stroke();
    ctx.fillText(String(e), xOf(e) - 6, H - padB + 18);
  }
  ctx.fillText('%', W - padR - 8, H - padB + 18);
  for (const s of [0, 500, 800]) {
    ctx.beginPath(); ctx.moveTo(padL, yOf(s)); ctx.lineTo(W - padR, yOf(s)); ctx.stroke();
    ctx.fillText(String(s), padL - 34, yOf(s) + 5);
  }
  ctx.fillText('MPa', 6, padT + 12);
  /* 普通钢:线弹性到 400 MPa@0.2%,屈服后卸载残留(虚线) */
  ctx.strokeStyle = '#9aa4ae'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(xOf(0), yOf(0)); ctx.lineTo(xOf(0.2), yOf(400)); ctx.stroke();
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(xOf(0.2), yOf(400)); ctx.lineTo(xOf(8), yOf(520)); ctx.stroke();
  ctx.setLineDash([]);
  /* NiTi:弹性 1% → 平台 500–800 → 8% */
  ctx.strokeStyle = '#4dabf7'; ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(xOf(0), yOf(0)); ctx.lineTo(xOf(1), yOf(500));
  ctx.lineTo(xOf(8), yOf(800)); ctx.lineTo(xOf(10), yOf(900));
  ctx.stroke();
  ctx.fillStyle = 'rgba(77,171,247,.14)';
  ctx.fillRect(xOf(1), yOf(800), xOf(8) - xOf(1), yOf(500) - yOf(800));
  /* 当前工作点 */
  const eCur = seMode ? eps : 8 * (1 - mS);
  const sCur = seMode ? sigma : 0;
  const xd = xOf(eCur), yd = yOf(sCur);
  ctx.strokeStyle = 'rgba(200,220,240,.5)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(xd, H - padB); ctx.lineTo(xd, yd); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = seMode ? '#7bd88f' : '#ffa94d';
  ctx.beginPath(); ctx.arc(xd, yd, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#4dabf7';
  ctx.fillText(L('NiTi 平台', 'NiTi plateau'), xOf(1.3), yOf(650));
  ctx.fillStyle = '#9aa4ae';
  ctx.fillText(L('普通钢(屈服残留)', 'steel (permanent set)'), padL + 8, padT + 14);
}

  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
const _M4 = new THREE.Matrix4(), _Q = new THREE.Quaternion(), _S = new THREE.Vector3(), _V = new THREE.Vector3(), _E = new THREE.Euler();
const _A = new THREE.Vector3(), _B = new THREE.Vector3();

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    simT += dt;
    /* 温度扫描 */
    if (autoT) { Tair = clamp(50 + 75 * Math.sin(simT * 0.45), -20, 120); syncSliders(); }
    /* 超弹性载荷脉冲(步骤 3 / 模式切换触发) */
    if (loadPulse >= 0) {
      loadPulse += dt / 6;
      load = 0.5 - 0.5 * Math.cos(clamp(loadPulse, 0, 1) * Math.PI * 2);
      if (loadPulse >= 1) { loadPulse = -1; load = 0; }
      syncSliders();
    }
    /* 马氏体变形脉冲(步骤 1):掰到 2.05 再松到 1.85(塑性保留) */
    if (deformPulse >= 0) {
      deformPulse += dt / 2.2;
      bendT = deformPulse < 0.45 ? lerp(1.6, 2.05, ease(clamp(deformPulse / 0.45, 0, 1)))
        : lerp(2.05, 1.85, ease(clamp((deformPulse - 0.45) / 0.55, 0, 1)));
      if (deformPulse >= 1) { deformPulse = -1; bendT = 1.85; }
    }
    bend += (bendT - bend) * Math.min(1, dt * 4);
    /* 畴波 + 单向回复 */
    const tgt = targetWave();
    waveU += clamp(tgt - waveU, -dt * 0.55, dt * 0.55);
    mRec = Math.max(mRec, seMode ? 1 : waveU);
    calcSigmaEps();
  }
  mS = ease(mRec);
  stretch = 1 + (seMode ? eps / 100 : 0);
  /* 丝:形变/拉伸变化时重建管几何 */
  if (Math.abs(mS - builtM) > 0.004 || Math.abs(stretch - builtStretch) > 0.0004 || Math.abs(bend - bendBuild) > 0.006) buildTube();
  /* 相变热辉光 */
  const near = clamp(1 - Math.abs(Tair - af) / 8, 0, 1);
  wireM.emissiveIntensity = 0.4 + near * 1.1;
  const aFrac = seMode ? 1 : waveU;
  wireM.color.copy(cBlue).lerp(cRed, aFrac);
  wireM.emissive.copy(cBlue).multiplyScalar(0.25).lerp(cRed, aFrac);
  if (seMode && sigma > 500) wireM.color.lerp(cOr, clamp((sigma - 500) / 300, 0, 1) * 0.7);
  /* 孪晶畴:位置贴丝 + 逐格翻转 */
  if (domOn) {
    for (let i = 0; i < N_DOM; i++) {
      const u = (i + 0.5) / N_DOM;
      pathPoint(u, _A);
      pathPoint(clamp(u + 0.01, 0, 1), _B);
      pathPoint(clamp(u - 0.01, 0, 1), _V);
      _B.sub(_V).normalize();
      const nx = -_B.y, ny = _B.x;
      let nx2, ny2;
      if (ny < 0) { nx2 = -nx; ny2 = -ny; } else { nx2 = nx; ny2 = ny; }
      _A.x += nx2 * 0.19; _A.y += ny2 * 0.19;
      const slope = Math.atan2(_B.y, _B.x);
      const pi = clamp((waveU - (i / N_DOM) * 0.55) / 0.45, 0, 1);
      const fracM = seMode ? clamp((sigma - 500) / 300, 0, 1) : 0;
      const ang = seMode ? ((i % 2 ? 45 : -45) * Math.PI / 180) * fracM
        : ((i % 2 ? 45 : -45) * Math.PI / 180) * (1 - pi);
      _Q.setFromEuler(_E.set(0, 0, slope + ang));
      _M4.compose(_A, _Q, _S.setScalar(1));
      domMesh.setMatrixAt(i, _M4);
      if (seMode) _C.copy(cRed).lerp(cOr, fracM);
      else _C.copy(cBlue).lerp(cRed, pi);
      domMesh.setColorAt(i, _C);
    }
    domMesh.instanceMatrix.needsUpdate = true;
    if (domMesh.instanceColor) domMesh.instanceColor.needsUpdate = true;
  }
  /* 夹具跟随端点 */
  pathPoint(0, _A); pathPoint(1, _B);
  gripL.position.set(_A.x - 0.18, _A.y, 0);
  gripR.position.set(_B.x + 0.18, _B.y, 0);
  rodR.position.set(_B.x + 0.95, _B.y, 0);
  rodR.visible = seMode;
  gripR.visible = true;
  /* 温度计 */
  const tFrac = (Tair + 20) / 140;
  thermo.forEach((seg, i) => {
    const on = (i + 0.5) / thermo.length <= tFrac;
    seg.material.color.copy(cBlue).lerp(cRed, clamp((i / thermo.length - 0.35) * 2.4, 0, 1));
    seg.material.opacity = on ? 1 : 0.15;
    seg.material.transparent = true;
  });
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.06) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
buildTube();
domMesh.visible = domOn;
calcSigmaEps();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
