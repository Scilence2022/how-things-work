<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>季风 · 半年一场的风向大掉头</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="季风 · 半年一场的风向大掉头" data-en="Monsoon · The Great Half-Yearly Wind Reversal">季风 · 半年一场的风向大掉头</h1>
  <div class="sub" data-zh="水的比热 4.2 vs 陆地 0.8 → 夏季大陆烤成热低压、海洋稳成高压 → 风整体掉头冲向大陆,抬升成雨(6–9 月)→ 冬季反转,风倒灌回海,只剩干季——雨季不是云多了,是风向换了 · 拖动月份滑杆看 180° 大掉头 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Water's heat capacity 4.2 vs land 0.8 → in summer the continent bakes into a heat low while the ocean stays cool and high-pressure → the whole wind field flips onshore and rain follows (Jun–Sep) → in winter it reverses and dry air drains back to sea — the rainy season isn't more clouds, it's the wind changing sides · drag the month slider for the 180° flip · 3D interactive demo · drag to orbit · Space = run/pause">季风 · 半年一场的风向大掉头</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

<div id="stats">
  <span class="k" data-zh="陆地气温" data-en="Land temp">陆地气温</span><span class="v" id="stTl">—</span>
  <span class="k" data-zh="海表温度" data-en="Sea surface">海表温度</span><span class="v" id="stTw">—</span>
  <span class="k" data-zh="海陆温差" data-en="Land−sea ΔT">海陆温差</span><span class="v" id="stDT">—</span>
  <span class="k" data-zh="季风相位" data-en="Phase">季风相位</span><span class="v ok" id="stPh">—</span>
  <span class="k" data-zh="孟买月降水" data-en="Mumbai rain">孟买月降水</span><span class="v" id="stPr">—</span>
  <span class="k" data-zh="地面风向" data-en="Surface wind">地面风向</span><span class="v" id="stWd">—</span>
</div>

<div id="plot">
  <h3 data-zh="孟买逐月降水(柱)与海陆温差(线):雨挤在 6–9 月" data-en="Mumbai monthly rain (bars) vs land−sea ΔT (line): the rain is packed into Jun–Sep">孟买逐月降水(柱)与海陆温差(线):雨挤在 6–9 月</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">

    <span class="chip.b" data-zh="蓝色箭头:湿气流(海洋→大陆)" data-en="blue arrows: moist flow (sea → land)">蓝色箭头:湿气流(海洋→大陆)</span>
    <span class="chip.o" data-zh="黄箭头:干气流(大陆→海洋)" data-en="tan arrows: dry flow (land → sea)">黄箭头:干气流(大陆→海洋)</span>
    <span class="chip.g" data-zh="绿点:水汽输送带" data-en="green dots: moisture conveyor">绿点:水汽输送带</span>
    <span class="chip.r" data-zh="光柱:地形抬升成雨" data-en="pillars: uplift turning to rain">光柱:地形抬升成雨</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnGlobe" data-zh="全球视角" data-en="Global">全球视角</button>
    <button class="abtn" id="btnIndia" data-zh="印度视角" data-en="India">印度视角</button>
    <button class="abtn" id="btnEAsia" data-zh="东亚视角" data-en="East Asia">东亚视角</button>
    <button class="abtn" id="btnFlip" data-zh="演示:夏↔冬掉头" data-en="Demo: summer ↔ winter flip">演示:夏↔冬掉头</button>
  </div>
  <div class="row"><label data-zh="月份" data-en="Month">月份</label><input id="sM" type="range" min="1" max="13" step="0.02" value="6.5"><span class="val" id="sMVal">—</span></div>
  <div class="row"><label data-zh="动画速度" data-en="Speed">动画速度</label><input id="sSpd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="sSpdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="降水图" data-en="Chart">降水图</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../atmospheric-circulation/" data-zh="大气环流:风的骨架" data-en="atmospheric circulation: the skeleton of wind">大气环流:风的骨架</a>
    <a href="../seasons/" data-zh="四季:加热的年度节拍" data-en="seasons: the annual beat of heating">四季:加热的年度节拍</a>
    <a href="../cloud-formation/" data-zh="云的形成:抬升与凝结" data-en="cloud formation: lift & condense">云的形成:抬升与凝结</a>
    <a href="../greenhouse-effect/" data-zh="温室效应:热量的账本" data-en="greenhouse effect: the heat ledger">温室效应:热量的账本</a>
    <a href="../el-nino/" data-zh="厄尔尼诺:季风的捣乱表亲" data-en="El Niño: the monsoon's unruly cousin">厄尔尼诺:季风的捣乱表亲</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 22, 70);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  starsMat.opacity = dark ? 0.85 : 0.22;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('季风 · 半年一场的风向大掉头', 'Monsoon · The Great Half-Yearly Wind Reversal');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
  syncSliders();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3.4;
controls.maxDistance = 60;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.5);
key.position.set(9, 6, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff, 0.35);
fill.position.set(-8, 4, -7);
scene.add(fill);

/* ---------------- 地理:经纬度 ↔ 3D ---------------- */
const R = 9, DEG = Math.PI / 180;
function llToV3(lat, lon, r = R) {
  const phi = (90 - lat) * DEG, th = (lon + 180) * DEG;
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
}
function eastN(lat, lon) {          /* 该点的正东 / 正北切向量 */
  const th = (lon + 180) * DEG, phi = (90 - lat) * DEG;
  return {
    e: new THREE.Vector3(Math.sin(th), 0, Math.cos(th)),
    n: new THREE.Vector3(Math.cos(th) * Math.cos(phi), -Math.sin(phi), Math.sin(th) * Math.cos(phi)).normalize()
  };
}
/* 粗略陆地多边形 [lon,lat] */
const LAND = [
  [[35,32],[60,30],[58,17],[48,12],[43,12],[34,28]],                              /* 阿拉伯 */
  [[33,-6],[40,-2],[42,8],[35,18],[30,20],[26,12],[32,-4]],                       /* 东非 */
  [[68,24],[71,20],[73,15],[77,8],[80,13],[86,20],[89,22],[89,27],[84,26],[80,29],[75,32],[71,32],[68,28]], /* 印度半岛 */
  [[75,32],[89,28],[97,29],[104,30],[112,28],[121,31],[122,40],[100,43],[84,41],[76,38]],                   /* 亚洲腹地 */
  [[95,25],[100,22],[105,20],[108,16],[106,10],[104,2],[101,3],[99,8],[97,14],[93,18]],                     /* 中南半岛 */
  [[96,4],[104,2],[110,0],[117,4],[118,8],[110,6],[100,7]],                        /* 婆罗洲一带 */
  [[95,-2],[103,-5],[110,-7],[114,-8],[104,-6],[97,-3]]                            /* 苏门答腊-爪哇 */
];
const PLATEAU = [[76,28],[90,28],[100,30],[103,33],[97,37],[88,38],[79,35]];       /* 青藏高原 */
function inPoly(lon, lat, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];

}

function earthTexture() {
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512;
  const c = cv.getContext('2d');
  const X = lon => (lon + 180) / 360 * cv.width, Y = lat => (90 - lat) / 180 * cv.height;
  const grad = c.createLinearGradient(0, 0, 0, cv.height);
  grad.addColorStop(0, '#12304a'); grad.addColorStop(0.5, '#17517d'); grad.addColorStop(1, '#12304a');
  c.fillStyle = grad; c.fillRect(0, 0, cv.width, cv.height);
  for (const poly of LAND) {
    c.beginPath(); c.moveTo(X(poly[0][0]), Y(poly[0][1]));
    for (let i = 1; i < poly.length; i++) c.lineTo(X(poly[i][0]), Y(poly[i][1]));
    c.closePath();
    c.fillStyle = '#8d7f58'; c.fill();
    c.strokeStyle = 'rgba(40,50,40,.55)'; c.lineWidth = 2; c.stroke();
  }
  c.beginPath(); c.moveTo(X(PLATEAU[0][0]), Y(PLATEAU[0][1]));
  for (let i = 1; i < PLATEAU.length; i++) c.lineTo(X(PLATEAU[i][0]), Y(PLATEAU[i][1]));
  c.closePath(); c.fillStyle = '#b5a173'; c.fill();
  c.strokeStyle = '#6f6142'; c.lineWidth = 2.5; c.stroke();
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* ---------------- 风场模型 ---------------- */
function windAt(lat, lon) {
  const w = seasonW();
  /* 夏季:印度一侧强西风 + 越靠近喜马拉雅越向北转 */
  let sE = 1.0, sN = 0.42 + 0.5 * clamp((26 - lat) / 14, 0, 1);
  /* 夏季:东亚转向南风 */
  const fEA = clamp((lon - 96) / 12, 0, 1);
  sE = lerp(sE, 0.22, fEA); sN = lerp(sN, 0.95, fEA);
  /* 冬季:印度一侧东北季风;东亚西伯利亚北风 */
  let dE = -0.85, dN = -0.5;
  dE = lerp(dE, 0.28, fEA); dN = lerp(dN, -1.0, fEA);
  /* 赤道附近全年偏东信风 */
  const fTr = clamp((10 - lat) / 8, 0, 1);
  sE = lerp(sE, -0.55, fTr); sN = lerp(sN, 0.12, fTr);
  dE = lerp(dE, -0.55, fTr); dN = lerp(dN, 0.12, fTr);
  return { e: lerp(dE, sE, w), n: lerp(dN, sN, w), w };
}
function moistAt(lat, lon) {
  const w = seasonW(), land = isLand(lat, lon);
  if (land) return lerp(0.10, 0.62, w);
  return lerp(0.22, 0.95, w);
}

const _M4 = new THREE.Matrix4(), _Q = new THREE.Quaternion(), _V = new THREE.Vector3(), _S = new THREE.Vector3();
const _DIR = new THREE.Vector3();
const cMoist = new THREE.Color(0x35a7ff), cDry = new THREE.Color(0xe0c08a), cTmp = new THREE.Color();
function updateArrows(t) {
  for (let i = 0; i < vane.length; i++) {
    const p = vane[i], tn = eastN(p.lat, p.lon), wv = windAt(p.lat, p.lon);

    _Q.setFromUnitVectors(_Y, _DIR);

    const len = (0.5 + 0.5 * mag) * puls, wd = 0.8 + 0.35 * mag;

const OCEAN_SPAWN = [[4, 14, 57, 69], [3, 13, 84, 94], [4, 16, 107, 119]];      /* 阿拉伯海/孟加拉湾/南海 */
const LAND_SPAWN = [[24, 36, 70, 100], [25, 38, 100, 118]];
function spawnFlow(i) {
  const w = seasonW(), p = fp[i];
  const box = (w > 0.5 ? OCEAN_SPAWN : LAND_SPAWN)[Math.floor(Math.random() * (w > 0.5 ? 3 : 2))];
  p.lat = lerp(box[0], box[1], Math.random());
  p.lon = lerp(box[2], box[3], Math.random());
  p.m = w > 0.5 ? 0.95 : 0.22;
  p.age = 0; p.life = 9 + Math.random() * 6;
}
for (let i = 0; i < NF; i++) { fp.push({}); spawnFlow(i); fp[i].age = Math.random() * fp[i].life; }
function updateFlow(dt) {
  const w = seasonW();
  for (let i = 0; i < NF; i++) {
    const p = fp[i], wv = windAt(p.lat, p.lon);
    const k = dt * 1.35;
    p.lat += wv.n * k;
    p.lon += wv.e * k / Math.max(0.3, Math.cos(p.lat * DEG));
    p.age += dt;
    const land = isLand(p.lat, p.lon);
    if (land) p.m -= dt * (0.12 + (w > 0.5 && p.m > 0.3 ? 0.4 : 0));
    else p.m += ((w > 0.5 ? 0.95 : 0.4) - p.m) * Math.min(1, dt * 1.1);
    if (p.age > p.life || p.lat < -12 || p.lat > 44 || p.lon < 46 || p.lon > 126 || (land && w > 0.5 && p.m < 0.08)) { spawnFlow(i); continue; }
    const raining = land && w > 0.5 && p.m > 0.3;
    const sc = (0.55 + p.m * 0.75) * (raining ? 0.75 + 0.25 * Math.sin(p.age * 9) : 1);
    _Q.setFromUnitVectors(_Y, _DIR.copy(llToV3(p.lat, p.lon, 0)).normalize());
    _M4.compose(_V.copy(llToV3(p.lat, p.lon, R + 0.06 + 0.04 * Math.sin(p.age * 3 + i))), _Q, _S.set(sc, sc, sc));
    flow.setMatrixAt(i, _M4);
    cTmp.copy(cDry).lerp(cMoist, clamp(p.m, 0, 1));
    if (raining) cTmp.lerp(new THREE.Color(0xffffff), 0.45);
    flow.setColorAt(i, cTmp);
  }
  flow.instanceMatrix.needsUpdate = true;
  if (flow.instanceColor) flow.instanceColor.needsUpdate = true;
}

/* ================= 绘图:降水柱 + 温差线 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 46, padR = 50, padT = 14, padB = 26;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB, mmax = 800;
  ctx.font = '17px system-ui';
  /* 降水网格 */
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const v of [0, 200, 400, 600, 800]) {
    const y = y1 - v / mmax * (y1 - y0);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillText(String(v), x0 - 38, y + 6);
  }
  /* 柱 */
  const bw = (x1 - x0) / 12;
  const cur = ((month - 1) % 12 + 12) % 12;
  for (let i = 0; i < 12; i++) {
    const h = RAIN[i] / mmax * (y1 - y0);
    ctx.fillStyle = i === Math.round(cur) ? '#ffa94d' : 'rgba(77,171,247,.45)';
    ctx.fillRect(x0 + i * bw + bw * 0.18, y1 - h, bw * 0.64, h);
  }
  /* 温差线(右轴 ±10 °C) */
  ctx.strokeStyle = '#ff8787';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i = 0; i <= 24; i++) {
    const m = 1 + i / 2;
    const dT = temps(m).dT;
    const x = x0 + (i / 24) * (x1 - x0), y = y1 - clamp(dT, -10, 10) / 20 * (y1 - y0) - (y1 - y0) / 2;
    i <= 0.01 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* 当前月份标记 */
  const fx = x0 + (cur + 0.5) / 12 * (x1 - x0);
  ctx.strokeStyle = 'rgba(255,169,77,.75)';
  ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(fx, y0); ctx.lineTo(fx, y1); ctx.stroke();
  ctx.setLineDash([]);
  /* 月份刻度 */
  ctx.fillStyle = cTxt;
  for (const i of [0, 2, 4, 6, 8, 10]) ctx.fillText(String(i + 1), x0 + i * bw + bw * 0.4, H - 8);
  ctx.fillText(L('月', 'mon'), x1 - 14, H - 8);
  ctx.fillStyle = '#ff8787';
  ctx.fillText(L('海陆温差 ±10 °C', 'ΔT ±10 °C'), x1 - 46, y0 + 10);
  ctx.fillStyle = 'rgba(77,171,247,.9)';
  ctx.fillText(L('降水 mm', 'rain mm'), x0 - 38, y0 + 10);
}

  elMVal.textContent = monthLabel(month);
  elSpd.value = speed;
  elSpdVal.textContent = '×' + speed.toFixed(1);
}
function syncBtns() {
  btnGlobe.classList.toggle('on', viewMode === 'globe');
  btnIndia.classList.toggle('on', viewMode === 'india');
  btnEAsia.classList.toggle('on', viewMode === 'eastasia');
}
function updateStats() {
  const { Tl, Tw, dT } = temps();
  stTl.innerHTML = Tl.toFixed(0) + '<small> °C</small>';
  stTw.innerHTML = Tw.toFixed(1) + '<small> °C</small>';
  stDT.innerHTML = (dT > 0 ? '+' : '') + dT.toFixed(1) + '<small> °C</small>';
  stDT.className = 'v ' + (dT > 2 ? 'bad' : dT < -2 ? 'ok' : '');
  const w = seasonW();
  stPh.textContent = w > 0.65 ? L('夏季风(西南)', 'SW monsoon') : w < 0.35 ? L('冬季风(东北)', 'NE monsoon') : L('季节转换期', 'transition');
  stPh.className = 'v ' + (w > 0.65 ? 'ok' : w < 0.35 ? 'warn' : '');
  stPr.innerHTML = rainAt(month).toFixed(0) + '<small> mm</small>';
  stPr.className = 'v ' + (rainAt(month) > 300 ? 'ok' : rainAt(month) < 10 ? 'warn' : '');
  const wv = windAt(19, 72.8), brg = (Math.atan2(wv.e, wv.n) / DEG + 360) % 360;
  const card = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(brg / 45) % 8];
  const tag = wv.e > 0.05 ? L('向岸(带来暴雨)', 'onshore (rain-bearing)') : wv.e < -0.05 ? L('离岸(干燥)', 'offshore (dry)') : L('沿岸', 'alongshore');
  stWd.textContent = card + ' ' + brg.toFixed(0) + '° ' + tag;
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>Q = mcΔT</b>:c(水) ≈ 4.2 kJ/(kg·K),c(陆地) ≈ 0.8 —— 同样的日照,陆地升温约 5 倍快,夏季大陆 = 热低压,海洋稳住高压<br>` +
    `<b>孟买 ≈ 2200 mm/年,6–9 月占 ~90%</b>:季风的定义就是风向的季节性 180° 掉头,雨季只是它的开关<br>` +
    `<b>冬季反转</b>:蒙古–西伯利亚冷高压(~1030 hPa)驱动东北季风,风从陆地倒灌向海——干季<br>` +
    `<b>季风泵</b>:青藏高原把加热面抬到 ~4.5 km,像烟囱把热低压抽得更高更深`,
    `<b>Q = mcΔT</b>: c(water) ≈ 4.2 kJ/(kg·K) vs land ≈ 0.8 — same sunshine, land warms ~5× faster; the summer continent is a heat low while the sea holds a high<br>` +
    `<b>Mumbai ≈ 2200 mm/yr, ~90% in Jun–Sep</b>: a monsoon is defined by the seasonal 180° wind reversal; the rainy season is just its switch<br>` +
    `<b>Winter reversal</b>: the Siberian High (~1030 hPa) drives the NE monsoon, draining dry air back to sea<br>` +
    `<b>Monsoon pump</b>: Tibet lifts the heating surface to ~4.5 km, chimney-drawing the heat low higher and deeper`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elM.addEventListener('input', () => { month = +elM.value; flipAnim = null; syncSliders(); });
elSpd.addEventListener('input', () => { speed = +elSpd.value; syncSliders(); });
btnGlobe.addEventListener('click', () => { viewMode = 'globe'; setView('globe'); syncBtns(); });
btnIndia.addEventListener('click', () => { viewMode = 'india'; setView('india'); syncBtns(); });
btnEAsia.addEventListener('click', () => { viewMode = 'eastasia'; setView('eastasia'); syncBtns(); });
btnFlip.addEventListener('click', () => {
  flipAnim = { t: 0, from: month };          /* 6.5 → 0.5+12 再拉回:两段式掉头 */
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, camTween = null, simT = 0;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0);
  simT += dt0;
  /* 掉头动画:先从当前位置滑到盛夏 6.5,再翻到隆冬 12.5+1=13.5→1.5 */
  if (flipAnim) {
    flipAnim.t += dt0 * 1.1;
    const k = Math.min(1, flipAnim.t);
    if (k < 0.45) setMonth(lerp(flipAnim.from, 6.5, k / 0.45));
    else setMonth(lerp(6.5, 13.0, (k - 0.45) / 0.55));
    if (k >= 1) { flipAnim = null; setMonth(1.0); phaseIdx = 5; syncAll(); }
    else syncSliders();
  }
  /* 自动走年 */
  if (playing && !flipAnim) {
    month += dt * 12 / 34;
    if (month >= 13) month -= 12;
    syncSliders();
  }
  /* 场景更新 */
  updateArrows(simT);
  updateFlow(dt);
  updateRain();
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
camera.position.copy(VIEWS.globe[0]);
controls.target.copy(VIEWS.globe[1]);
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
</html>
