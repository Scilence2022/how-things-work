<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>十字滑块机构 · 严格正弦 vs 曲柄滑块</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 400px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  /* 示波器：两条位移曲线实时叠加 */
  #scope{position:fixed;top:62px;right:18px;z-index:4;width:344px;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:8px 10px 6px;backdrop-filter:blur(6px)}
  #scope .lg{display:flex;gap:10px;font-size:10.5px;color:var(--text2);margin-bottom:4px;align-items:center}
  #scope .lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:3px;vertical-align:middle}
  #scopeCv{width:100%;height:170px;display:block}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:1120px){#scope{display:none}}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="十字滑块机构 · 严格正弦 vs 曲柄滑块" data-en="Scotch Yoke · Pure Sine vs Slider-Crank">十字滑块机构 · 严格正弦 vs 曲柄滑块</h1>
  <div class="sub" data-zh="曲柄销插在滑槽里，滑块位移严格 = r·cosθ，没有任何高次谐波；并排的曲柄滑块只有连杆无限长才近似正弦 · 看示波器上两条曲线的偏差 · 拖动旋转 / 空格运行/暂停" data-en="The pin rides in the slot so displacement is exactly r·cosθ — no higher harmonics; the slider-crank needs an infinite rod to match · watch the deviation on the scope · drag to orbit / Space = run/pause">曲柄销插在滑槽里，滑块位移严格 = r·cosθ，没有任何高次谐波；并排的曲柄滑块只有连杆无限长才近似正弦 · 看示波器上两条曲线的偏差 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="scope">
  <div class="lg">
    <span><i style="background:#ffa94d"></i><span data-zh="十字滑块 x/r（纯正弦）" data-en="Scotch yoke x/r (pure sine)">十字滑块 x/r（纯正弦）</span></span>
    <span><i style="background:#74c0fc"></i><span data-zh="曲柄滑块" data-en="Slider-crank">曲柄滑块</span></span>
    <span><i style="background:#ff6b6b"></i><span data-zh="偏差" data-en="Deviation">偏差</span></span>
  </div>
  <canvas id="scopeCv"></canvas>
</div>
<div id="stats">
  <span class="k" data-zh="转速" data-en="Speed">转速</span><span class="v" id="stRpm">—</span>
  <span class="k" data-zh="连杆比 λ=l/r" data-en="Rod ratio λ=l/r">连杆比 λ=l/r</span><span class="v" id="stLam">—</span>
  <span class="k" data-zh="偏差峰值" data-en="Peak deviation">偏差峰值</span><span class="v" id="stDev">—</span>
  <span class="k" data-zh="曲柄转角" data-en="Crank angle">曲柄转角</span><span class="v" id="stAng">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn on" id="btnDual" data-zh="双机对比" data-en="Dual compare">双机对比</button>
    <button class="abtn" id="btnSync" data-zh="回零 °" data-en="Reset 0°">回零 °</button>
  </div>
  <div class="row">
    <label data-zh="转速" data-en="Speed">转速</label>
    <input id="sRpm" type="range" min="8" max="120" step="1" value="42">
    <span class="val" id="sRpmVal">42 rpm</span>
  </div>
  <div class="row">
    <label data-zh="曲柄半径 r" data-en="Crank radius r">曲柄半径 r</label>
    <input id="sR" type="range" min="70" max="160" step="1" value="115">
    <span class="val" id="sRVal">29 mm</span>
  </div>
  <div class="row">
    <label data-zh="连杆长 l" data-en="Rod length l">连杆长 l</label>
    <input id="sL" type="range" min="200" max="900" step="5" value="360">
    <span class="val" id="sLVal">90 mm</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cam-follower/" data-zh="凸轮从动件" data-en="Cam follower">凸轮从动件</a>
    <a href="../four-bar-linkage/" data-zh="四杆机构" data-en="Four-bar linkage">四杆机构</a>
    <a href="../four-stroke-engine/" data-zh="四冲程发动机" data-en="Four-stroke engine">四冲程发动机</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 比例：1 世界单位 = 25 mm。曲柄半径 r、连杆长 l 都由滑块给出 */
const MM = 25;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const D2R = Math.PI/180, R2D = 180/Math.PI;
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x101418,26,70);
const camera = new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(0,6.2,20.5);
const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.5,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=60;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key = new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(6,10,8); scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff,0.28); fill.position.set(-8,5,-6); scene.add(fill);

/* ---- 材质 ---- */
const groundM = new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const bodyM   = new THREE.MeshStandardMaterial({color:0x2e3a47,roughness:0.4,metalness:0.6});
const discM   = new THREE.MeshStandardMaterial({color:0x4a7fa5,roughness:0.3,metalness:0.72});
const pinM    = new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xffa000,emissiveIntensity:0.35,roughness:0.3,metalness:0.5});
const yokeM   = new THREE.MeshStandardMaterial({color:0xd9730d,roughness:0.38,metalness:0.55});
const rodM    = new THREE.MeshStandardMaterial({color:0x788795,roughness:0.45,metalness:0.65});
const pistonM = new THREE.MeshStandardMaterial({color:0x6baed6,roughness:0.32,metalness:0.6});
const railM   = new THREE.MeshStandardMaterial({color:0x3d4654,roughness:0.55,metalness:0.5});

/* ---- 场景搭建 ---- */
const ground = new THREE.Mesh(new THREE.BoxGeometry(40,0.3,10),groundM);
ground.position.set(0,-2.6,0); scene.add(ground);

/* 曲柄组件：圆盘 + 曲柄臂 + 销，绕 z 旋转 */
function makeCrank(r){
  const g = new THREE.Group();
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(r+0.45,r+0.45,0.26,40),discM);
  disc.rotation.x = Math.PI/2; g.add(disc);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.5,16),railM);
  hub.rotation.x = Math.PI/2; g.add(hub);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(r+0.1,0.3,0.2),bodyM);
  arm.position.set((r+0.1)/2 - 0.1,0,0); g.add(arm);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,1.1,14),pinM);
  pin.rotation.x = Math.PI/2; pin.position.set(r,0,0.28); g.add(pin);
  return g;
}

/* ===== 机器 A：十字滑块（左） ===== */
const AX = -6.2;
const mA = new THREE.Group(); mA.position.set(AX,0,0); scene.add(mA);
let crankA = makeCrank(1.15); mA.add(crankA);
/* 十字滑块：带纵向滑槽的板（Shape 挖孔挤出），滑槽容纳销的纵向运动 */
function yokeMesh(r){
  const hw=r+1.0, hh=r+0.85, sw=0.28, sh=r+0.3;
  const s=new THREE.Shape();
  s.moveTo(-hw,-hh); s.lineTo(hw,-hh); s.lineTo(hw,hh); s.lineTo(-hw,hh); s.closePath();
  const hole=new THREE.Path();
  hole.moveTo(-sw,-sh); hole.lineTo(sw,-sh); hole.lineTo(sw,sh); hole.lineTo(-sw,sh); hole.closePath();
  s.holes.push(hole);
  const geo=new THREE.ExtrudeGeometry(s,{depth:0.34,bevelEnabled:false});
  geo.translate(0,0,-0.17);
  return new THREE.Mesh(geo,yokeM);
}
let R = 1.15;
const yoke = new THREE.Group(); mA.add(yoke);
let yokePlate = yokeMesh(R); yokePlate.position.z = 0.52; yoke.add(yokePlate);
/* 导轨（固定）+ 滑块上的轴套 */
const guideM = railM;
for(const yy of [1,-1]){
  const bar = new THREE.Mesh(new THREE.BoxGeometry(7.4,0.16,0.16),guideM);
  bar.position.set(0.4, yy*(R+0.62), 0.52); mA.add(bar);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.2,2.6,12),guideM);
  post.position.set(3.6, yy*(R+0.62)/2, 0.52); mA.add(post);
}
const bushTop = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.34,0.5),bodyM); yoke.add(bushTop);
const bushBot = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.34,0.5),bodyM); yoke.add(bushBot);
/* 输出杆 + 工作头 */
const outRod = new THREE.Mesh(new THREE.BoxGeometry(1.3,0.18,0.18),rodM);
outRod.position.set(R+1.55,0,0.52); yoke.add(outRod);
const head = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.9,0.7),pistonM);
head.position.set(R+2.4,0,0.52); yoke.add(head);

/* ===== 机器 B：曲柄滑块（右，有限连杆） ===== */
const BX = 6.2;
const mB = new THREE.Group(); mB.position.set(BX,0,0); scene.add(mB);
let crankB = makeCrank(1.15); mB.add(crankB);
let Lr = 3.6;
const rodMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1,12),rodM); mB.add(rodMesh);
const piston = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.85,0.44),pistonM); mB.add(piston);
const wrist = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.6,12),pinM);
wrist.rotation.x = Math.PI/2; mB.add(wrist);
for(const yy of [0.62,-0.62]){
  const bar = new THREE.Mesh(new THREE.BoxGeometry(7.0,0.16,0.16),guideM);
  bar.position.set(1.6, yy, 0); mB.add(bar);
}
/* 连杆/活塞位置更新 */
function placeRod(x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  rodMesh.position.set((x1+x2)/2,(y1+y2)/2,0);
  rodMesh.scale.y = len;
  rodMesh.rotation.z = Math.atan2(dy,dx) - Math.PI/2;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('曲柄销','Crank pin'),new THREE.Vector3(R,0.25,0.65),'o',()=>true,crankA);
addLabel(()=>L('十字滑块 · 纵向滑槽','Scotch yoke · vertical slot'),new THREE.Vector3(-0.9,R+1.35,0.5),'o',()=>true,yoke);
addLabel(()=>L('位移 x = r·cosθ（严格正弦）','x = r·cosθ (exact sine)'),new THREE.Vector3(-1.2,-R-1.6,0.5),'g',()=>true,yoke);
addLabel(()=>L('连杆 l','Rod l'),new THREE.Vector3(0,1.1,0),'b',()=>true,mB);
addLabel(()=>L('活塞（有限连杆 → 二次谐波）','Piston (finite rod → 2nd harmonic)'),new THREE.Vector3(1.2,-1.45,0),'b',()=>true,piston);

/* ---- 状态 ---- */
let playing=true, theta=0, rpm=42, dualMode=true, labelsOn=true, simT=0;
/* 曲柄滑块位移：x = r·cosθ + √(l²−r²sin²θ) − l（减去行程中心）
   展开到二阶：≈ r·cosθ − (r²/4l)·(1−cos2θ) —— 二次谐波幅值 r/4l，峰值偏差 1/(2λ) */
function pistonX(th,r,l){ return r*Math.cos(th) + Math.sqrt(l*l - r*r*Math.sin(th)**2) - l; }
let pMean = 0;
function calcMean(){ let s=0; for(let i=0;i<720;i++){const th=i/720*2*Math.PI; s+=pistonX(th,R,Lr);} pMean=s/720; }
calcMean();

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  bodyM.color.setHex(dark?0x2e3a47:0x6b7d8e);
  discM.color.setHex(dark?0x4a7fa5:0x2c5f80);
  yokeM.color.setHex(dark?0xd9730d:0xe8590c);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); updateStats();
}

/* ---- 步骤（点击切相位） ---- */
const STEPS=[
  {zh:'曲柄销插在滑块的纵向滑槽里旋转，销的横坐标直接成为滑块位移',
   en:'The pin rides in the vertical slot; its x-coordinate is the slider displacement', th:0.6, l:null},
  {zh:'x = r·cosθ，不经过连杆：严格简谐运动，没有高次谐波',
   en:'x = r·cosθ with no link: pure harmonic motion, zero higher harmonics', th:Math.PI/2, l:null},
  {zh:'有限连杆的曲柄滑块引入二次谐波 −(r²/4l)(1−cos2θ)，示波器上偏差张开',
   en:'A finite rod adds the 2nd harmonic −(r²/4l)(1−cos2θ); the scope shows the gap', th:Math.PI/2, l:2.4},
  {zh:'连杆拉长 λ→∞：偏差 ∝ 1/(2λ) 消失，曲柄滑块才近似正弦',
   en:'Stretch the rod (λ→∞): deviation ∝ 1/(2λ) vanishes; only then is it near-sine', th:0, l:8.8},
  {zh:'应用：往复式压缩机十字头、正弦振动台——要的就是这条严格正弦',
   en:'Applications: compressor crossheads and sine vibration tables demand the exact sine', th:null, l:null},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i; setPhase(i); syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function setPhase(i){
  const s=STEPS[i];
  if(s.l!==null){ Lr=s.l; ui.sL.value=Math.round(s.l*MM); }
  if(s.th!==null){ theta=s.th; playing=false; } else { playing=true; }
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  refreshGeometry();
}

/* ---- 统计读数 ---- */
function updateStats(){
  document.getElementById('stRpm').innerHTML=rpm.toFixed(0)+'<small> rpm</small>';
  document.getElementById('stLam').innerHTML=(Lr/R).toFixed(1)+'<small> : 1</small>';
  document.getElementById('stDev').innerHTML=(peakDev*100).toFixed(1)+'<small> %r</small>';
  const ang=((theta*R2D)%360+360)%360;
  document.getElementById('stAng').innerHTML=ang.toFixed(0)+'<small> °</small>';
}

/* ---- 示波器（2D HUD 画布） ---- */
const cv=document.getElementById('scopeCv'); const ctx=cv.getContext('2d');
const BUFMAX=250; const bufA=[], bufB=[]; let peakDev=0;
function sizeScope(){ cv.width=cv.clientWidth*2; cv.height=cv.clientHeight*2; }
sizeScope();
function drawScope(dark){
  const W=cv.width, H=cv.height, mid=H/2, amp=H*0.38;
  ctx.clearRect(0,0,W,H);
  /* 网格与中线 */
  ctx.strokeStyle=dark?'rgba(255,255,255,.08)':'rgba(20,40,70,.12)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(W,mid); ctx.stroke();
  ctx.setLineDash([6,6]); ctx.beginPath();
  ctx.moveTo(0,mid-amp); ctx.lineTo(W,mid-amp); ctx.moveTo(0,mid+amp); ctx.lineTo(W,mid+amp);
  ctx.stroke(); ctx.setLineDash([]);
  const n=bufA.length; if(n<2) return;
  const dx=W/(BUFMAX-1);
  const x0=W-(n-1)*dx;
  /* 偏差区域（两曲线之间涂红） */
  ctx.beginPath();
  for(let i=0;i<n;i++){const x=x0+i*dx, y=mid-bufA[i]*amp; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=n-1;i>=0;i--){const x=x0+i*dx, y=mid-bufB[i]*amp; ctx.lineTo(x,y);}
  ctx.closePath();
  ctx.fillStyle=dark?'rgba(255,107,107,.22)':'rgba(201,42,42,.18)'; ctx.fill();
  /* 两条曲线 */
  const trace=(arr,col,w)=>{ ctx.beginPath();
    for(let i=0;i<n;i++){const x=x0+i*dx, y=mid-arr[i]*amp; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.strokeStyle=col; ctx.lineWidth=w; ctx.stroke(); };
  trace(bufA, dark?'#ffa94d':'#e8590c', 3);
  trace(bufB, '#74c0fc', 3);
  /* 偏差峰值标注 */
  if(peakDev>0.005){
    const y1=mid-(peakDev)*amp, y2=mid+(peakDev)*amp;
    ctx.setLineDash([4,5]); ctx.strokeStyle=dark?'rgba(255,107,107,.7)':'rgba(201,42,42,.6)';
    ctx.beginPath(); ctx.moveTo(0,y1); ctx.lineTo(W,y1); ctx.moveTo(0,y2); ctx.lineTo(W,y2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=dark?'#ffc2c2':'#c92a2a'; ctx.font='22px system-ui';
    ctx.fillText('±'+(peakDev*100).toFixed(1)+'%r', 10, y1-8);
  }
  ctx.fillStyle=dark?'rgba(255,255,255,.35)':'rgba(20,40,70,.5)'; ctx.font='20px system-ui';
  ctx.fillText('+r',6,mid-amp-8); ctx.fillText('−r',6,mid+amp+20);
  ctx.fillText(L('时间 →','time →'),W-88,H-8);
}

/* ---- UI 事件 ---- */
const ui={sR:document.getElementById('sR'),sL:document.getElementById('sL'),sRpm:document.getElementById('sRpm')};
function refreshGeometry(){
  /* 半径变化需要重建曲柄与滑槽板 */
  mA.remove(crankA); const nc=makeCrank(R); crankA=nc; mA.add(crankA);
  if(labelReg.length){ // 把曲柄销标签挪到新曲柄上
    const lo=labelReg[0].o; if(lo.parent) lo.parent.remove(lo); nc.add(lo);
  }
  yoke.remove(yokePlate); const np=yokeMesh(R); np.position.z=0.52; yokePlate=np; yoke.add(yokePlate);
  bushTop.position.set(0,R+0.62,0.52); bushBot.position.set(0,-(R+0.62),0.52);
  outRod.position.set(R+1.55,0,0.52); head.position.set(R+2.4,0,0.52);
  mB.remove(crankB); const nb=makeCrank(R); crankB=nb; mB.add(nb);
  calcMean();
  document.getElementById('sRVal').textContent=Math.round(R*MM)+' mm';
  document.getElementById('sLVal').textContent=Math.round(Lr*MM)+' mm';
}
ui.sR.addEventListener('input',e=>{ R=+e.target.value/MM; refreshGeometry(); });
ui.sL.addEventListener('input',e=>{ Lr=+e.target.value/MM; calcMean();
  document.getElementById('sLVal').textContent=Math.round(Lr*MM)+' mm'; });
ui.sRpm.addEventListener('input',e=>{ rpm=+e.target.value;
  document.getElementById('sRpmVal').textContent=rpm+' rpm'; });
document.getElementById('btnDual').addEventListener('click',e=>{
  dualMode=!dualMode; mA.visible=dualMode;
  e.target.classList.toggle('on',dualMode);
  if(!dualMode){ controls.target.set(BX,0.5,0); } else { controls.target.set(0,0.5,0); }
});
document.getElementById('btnSync').addEventListener('click',()=>{ theta=0; bufA.length=0; bufB.length=0; });
document.getElementById('play').addEventListener('click',()=>{ playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run'); });
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh'; localStorage.setItem('htw-lang',LANG); applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark'; localStorage.setItem('htw-theme',THEME); applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); sizeScope();
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    theta += rpm/60*2*Math.PI*dt;
    if(theta>Math.PI*2) theta-=Math.PI*2;
    /* 归一化位移：yoke 严格 cosθ；活塞减去自身均值后对比 */
    const py=Math.cos(theta);
    const pp=(pistonX(theta,R,Lr)-pMean)/R;
    const dev=pp-py;
    bufA.push(py); bufB.push(pp);
    if(bufA.length>BUFMAX){bufA.shift(); bufB.shift();}
    peakDev=0; for(let i=0;i<bufA.length;i++){const d=Math.abs(bufA[i]-bufB[i]); if(d>peakDev)peakDev=d;}
  }
  crankA.rotation.z=theta; crankB.rotation.z=theta;
  yoke.position.x=R*Math.cos(theta);
  const px=pistonX(theta,R,Lr);
  piston.position.set(px,0,0);
  wrist.position.set(px,0,0);
  placeRod(R*Math.cos(theta),R*Math.sin(theta),px,0);
  acc+=dt; if(acc>0.1){acc=0; updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis(); if(r.o.visible) r.o.element.textContent=r.text(); }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
  drawScope(THEME==='dark');
}
function start(){if(raf===null){clock.getDelta(); raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf); raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数 ---- */
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1') playing=false;
if(qp.get('labels')==='0') labelsOn=false;
if(qp.get('speed')){ rpm=clamp(+qp.get('speed')||42,8,120); ui.sRpm.value=rpm; }
document.getElementById('tglLabels').checked=labelsOn;
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
refreshGeometry();
/* 首屏预填约 3.5 秒波形历史（含当前转角）：首帧即见完整橙/蓝曲线与红色偏差区 */
(function prefillScope(){
  const w=rpm/60*2*Math.PI, back=3.5, n=BUFMAX;
  for(let i=0;i<n;i++){
    const th=theta-(n-1-i)/(n-1)*back*w;
    bufA.push(Math.cos(th));
    bufB.push((pistonX(th,R,Lr)-pMean)/R);
  }
  peakDev=0;
  for(let i=0;i<bufA.length;i++){const d=Math.abs(bufA[i]-bufB[i]); if(d>peakDev)peakDev=d;}
})();
applyTheme(); applyLang(); buildSteps(); start();
</script>
