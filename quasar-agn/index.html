<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>类星体与活动星系核 · 一个引擎的千张面孔</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#cc4f3f;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a63e30;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.y { border-color: rgba(255,212,92,.9); color: #fff0c2; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.y { color:#9a7a00; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.y { color: #fff0c2; border-color: rgba(255,212,92,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  :root[data-theme="light"] .chip.y { color:#9a7a00; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(204,79,63,.6); background: rgba(204,79,63,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(166,62,48,.55); background: rgba(166,62,48,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(204,79,63,.10); border-color: rgba(204,79,63,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(166,62,48,.08); border-color: rgba(166,62,48,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffd6ce; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="类星体与活动星系核 · 一个引擎的千张面孔" data-en="Quasar & AGN · One Engine, Many Faces">类星体与活动星系核 · 一个引擎的千张面孔</h1>
  <div class="sub" data-zh="星系中心的超大质量黑洞(10⁶–10¹⁰ M☉)以 ~10% 质能效率吸积气体(氢聚变仅 0.7%)→10⁸ M☉ 即可输出 ~10⁴⁰ W、比整个星系亮千倍;爱丁顿极限 L_Edd≈1.3×10³¹(M/M☉) W 是辐射压天花板,吃太快自己吹跑燃料;盘+宽线区+尘埃环+窄线区+喷流本是同一套结构,只因视线角不同,就被我们叫成赛弗特、类星体、射电星系或 BL Lac · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="A supermassive black hole (10⁶–10¹⁰ M☉) at a galaxy's core accretes gas at ~10% mass-energy efficiency (fusion manages 0.7%) → 10⁸ M☉ alone outputs ~10⁴⁰ W, a thousand times an entire galaxy; the Eddington limit L_Edd ≈ 1.3×10³¹(M/M☉) W is the radiation-pressure ceiling — eat faster and you blow your own fuel away; disk + broad-line region + dust torus + narrow-line region + jets are one single machine — only the viewing angle decides whether we call it a Seyfert, quasar, radio galaxy or BL Lac · 3D interactive demo · drag to orbit · Space = run/pause">…</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="观测光度 L" data-en="Observed L">观测光度 L</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="爱丁顿比" data-en="Eddington ratio">爱丁顿比</span><span class="v ok" id="stE">—</span>
  <span class="k" data-zh="黑洞质量" data-en="Black-hole mass">黑洞质量</span><span class="v" id="stM">—</span>
  <span class="k" data-zh="视线角 i" data-en="Viewing angle i">视线角 i</span><span class="v" id="stI">—</span>
  <span class="k" data-zh="红移 z(样本)" data-en="Redshift z (example)">红移 z(样本)</span><span class="v" id="stZ">—</span>
  <span class="k" data-zh="观测分类" data-en="Observed class">观测分类</span><span class="v ok" id="stC">—</span>
</div>

<div id="plot">
  <h3 data-zh="光谱随视线角变(log F–log λ):i≳45° 宽线被尘埃环吞掉;i≲10° 束流连续谱暴涨,淹没一切谱线" data-en="Spectrum vs viewing angle (log F–log λ): i≳45° the torus swallows the broad lines; i≲10° the beamed continuum booms and drowns every line">光谱随视线角变(log F–log λ):i≳45° 宽线被尘埃环吞掉;i≲10° 束流连续谱暴涨,淹没一切谱线</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip.o" data-zh="白热吸积盘:~10% 质能变光" data-en="white-hot disk: ~10% of mc² into light">白热吸积盘:~10% 质能变光</span>
    <span class="chip.b" data-zh="宽线区 BLR:云快→谱线宽" data-en="broad-line region: fast clouds → wide lines">宽线区 BLR:云快→谱线宽</span>
    <span class="chip.y" data-zh="尘埃环:45° 漏斗,遮挡视线" data-en="dust torus: 45° funnel, blocks the view">尘埃环:45° 漏斗,遮挡视线</span>
    <span class="chip.g" data-zh="窄线区·电离锥:云慢→谱线窄" data-en="narrow lines & ionization cone: slow clouds → thin lines">窄线区·电离锥:云慢→谱线窄</span>
    <span class="chip.r" data-zh="相对论喷流:正对即耀变体" data-en="relativistic jets: face-on = blazar">相对论喷流:正对即耀变体</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnQ" data-zh="类星体视角 i=30°" data-en="Quasar view i=30°">类星体视角 i=30°</button>
    <button class="abtn" id="btnBL" data-zh="BL Lac 视角 i=5°(招牌)" data-en="BL Lac view i=5° (signature)">BL Lac 视角 i=5°(招牌)</button>
    <button class="abtn" id="btnT2" data-zh="侧视 i=80°:环面遮挡" data-en="Edge-on i=80°: obscured">侧视 i=80°:环面遮挡</button>
    <button class="abtn" id="btnWide" data-zh="拉远:回到星系全景" data-en="Zoom out: host galaxy">拉远:回到星系全景</button>
  </div>
  <div class="row"><label data-zh="视线角 i(招牌)" data-en="Viewing angle i (signature)">视线角 i(招牌)</label><input id="sView" type="range" min="0" max="89" step="0.5" value="62"><span class="val" id="sViewVal">62°</span></div>
  <div class="row"><label data-zh="质量 log₁₀(M/M☉)" data-en="Mass log₁₀(M/M☉)">质量 log₁₀(M/M☉)</label><input id="sMass" type="range" min="5.5" max="10" step="0.05" value="6.6"><span class="val" id="sMassVal">10^6.6</span></div>
  <div class="row"><label data-zh="供给率 ṁ(L/L_Edd)" data-en="Supply ṁ (L/L_Edd)">供给率 ṁ(L/L_Edd)</label><input id="sMd" type="range" min="0" max="2" step="0.01" value="0.01"><span class="val" id="sMdVal">0.01</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglJets" type="checkbox" checked> <span data-zh="喷流" data-en="Jets">喷流</span></label>
      <label><input id="tglSpec" type="checkbox" checked> <span data-zh="光谱" data-en="Spectrum">光谱</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢速 0.35×" data-en="Slow 0.35×">慢速 0.35×</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../accretion-disk/" data-zh="吸积盘" data-en="accretion disk">吸积盘</a>
    <a href="../black-hole-shadow/" data-zh="黑洞剪影" data-en="black-hole shadow">黑洞剪影</a>
    <a href="../galaxy-merger/" data-zh="星系并合" data-en="galaxy merger">星系并合</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sm = (x, a, b) => clamp((x - a) / (b - a), 0, 1);
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 120, 560);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  starM.opacity = dark ? 0.9 : 0.5;
  hostM.opacity = dark ? 0.95 : 0.8;
  torusM.opacity = dark ? 0.9 : 0.95;
  drawSpec();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('类星体与活动星系核 · 一个引擎的千张面孔', 'Quasar & AGN · One Engine, Many Faces');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  updateFormula();
  updateStats();
  drawSpec();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */

function derive() {
  M = Math.pow(10, Mlog);
  Ledd = 1.26e31 * M;                       /* 爱丁顿光度 W:L_Edd≈1.3×10³¹·(M/M☉) */
  Lth = Math.min(mdot, 1) * Ledd;           /* 超线供给被吹回,辐射封顶在 L_Edd */
  const G = 10, B = 0.995;                  /* 喷流洛伦兹因子 Γ~10 */
  delta = 1 / (G * (1 - B * Math.cos(iCur * Math.PI / 180)));
  Lobs = Lth * (1 + 0.1 * delta ** 3);      /* 束流按 δ³ 增亮的那部分连续谱 */
  windOn = mdot > 1.02;
}

/* ---------------- 格式化 ---------------- */
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sup = s => String(s).split('').map(c => SUP[c] || c).join('');
function fmtExp(x) {
  if (!isFinite(x) || x <= 0) return '0';
  const e = Math.floor(Math.log10(x));
  const m = x / Math.pow(10, e);
  return (m >= 9.95 ? '10' + sup(e + 1) : m.toFixed(1) + '×10' + sup(e));
}

const STOPS = [
  [0.00, [0.13, 0.03, 0.02]], [0.16, [0.36, 0.07, 0.02]], [0.34, [0.80, 0.22, 0.04]],
  [0.52, [1.00, 0.50, 0.13]], [0.70, [1.00, 0.76, 0.38]], [0.86, [1.00, 0.95, 0.80]], [1.00, [0.93, 0.97, 1.00]]
];
function ramp(t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const [t0, c0] = STOPS[i - 1], [t1, c1] = STOPS[i];
      const f = (t - t0) / (t1 - t0);
      return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
    }
  }
  return STOPS[STOPS.length - 1][1];
}

const _V = new THREE.Vector3();
function camAngle() {
  _V.copy(camera.position).sub(controls.target);
  const r = _V.length();
  if (r < 1e-4) return iCur;
  const th = Math.acos(clamp(_V.y / r, -1, 1)) * 180 / Math.PI;
  return th > 90 ? 180 - th : th;
}
function flyView(iDeg, r) {
  const d = camera.position.clone().sub(controls.target);
  const rr = r || d.length();
  const az = Math.atan2(d.x, d.z);
  const el = (90 - clamp(iDeg, 0.3, 89.8)) * Math.PI / 180;
  camTween = {
    p0: camera.position.clone(),
    p1: new THREE.Vector3(Math.sin(el) * Math.sin(az) * rr, Math.cos(el) * rr, Math.sin(el) * Math.cos(az) * rr),
    t0: controls.target.clone(), t1: new THREE.Vector3(0, 0, 0), k: 0
  };
}

/* ================= 光谱图:宽线遮挡 + 束流增亮 ================= */
const specCv = document.getElementById('plotCv');
function drawSpec() {
  const ctx = specCv.getContext('2d');
  const W = specCv.width = specCv.clientWidth * 2;
  const H = specCv.height = specCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const acc = css.getPropertyValue('--acc').trim() || '#cc4f3f';
  const padL = 42, padR = 12, padT = 14, padB = 22;
  const l0 = Math.log10(1300), l1 = Math.log10(7600);
  const fLo = -2.3, fHi = 3.15;
  const xOf = l => padL + (l - l0) / (l1 - l0) * (W - padL - padR);
  const yOf = f => (H - padB) - (f - fLo) / (fHi - fLo) * (H - padT - padB);
  ctx.font = '14px system-ui';
  ctx.fillStyle = cTxt;
  ctx.strokeStyle = 'rgba(128,150,170,.15)';
  for (let e = -2; e <= 3; e++) {
    ctx.beginPath(); ctx.moveTo(padL, yOf(e)); ctx.lineTo(W - padR, yOf(e)); ctx.stroke();
    ctx.fillText('10' + sup(e), 6, yOf(e) + 5);
  }
  [2000, 4000, 7000].forEach(lv => ctx.fillText(lv, xOf(Math.log10(lv)) - 12, H - 6));
  const s = clamp(mdot / 0.5, 0.004, 1.6);
  const broad = 1 - sm(iCur, 40, 50);
  const jet = 0.1 * delta ** 3;
  const bw = (lam, h, c, w) => h * broad * Math.exp(-(((lam - c) / w) ** 2));
  const nw = (lam, h, c, w) => h * Math.exp(-(((lam - c) / w) ** 2));
  const flux = lam => {
    let f = 1.1 * Math.pow(5000 / lam, 1.4) + 4.2 * Math.exp(-(((lam - 2500) / 620) ** 2));
    f += jet * 1.3 * Math.pow(3000 / lam, 1.0);
    f += bw(lam, 6.5, 6563, 55) + bw(lam, 4.5, 4861, 38) + bw(lam, 3.6, 2800, 34) + bw(lam, 3.0, 1549, 26);
    f += nw(lam, 1.6, 5007, 6) + nw(lam, 0.8, 4959, 6) + nw(lam, 0.9, 6563, 7) + nw(lam, 0.5, 4861, 6);
    return f * s;
  };
  ctx.beginPath();
  const N = 170;
  for (let k = 0; k <= N; k++) {
    const lg = l0 + (l1 - l0) * k / N;
    const f = clamp(Math.log10(Math.max(flux(Math.pow(10, lg)), 1e-12)), fLo, fHi);
    const X = xOf(lg), Y = yOf(f);
    k === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
  }
  ctx.strokeStyle = acc; ctx.lineWidth = 2.6; ctx.stroke();
  ctx.lineTo(xOf(l1), yOf(fLo)); ctx.lineTo(xOf(l0), yOf(fLo)); ctx.closePath();
  ctx.globalAlpha = 0.16; ctx.fillStyle = acc; ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = cTxt;
  const tags = [['C IV', 1549], ['Mg II', 2800], ['Hβ', 4861], ['[O III]', 5007], ['Hα', 6563]];
  tags.forEach(([t, lv]) => ctx.fillText(t, xOf(Math.log10(lv)) - 10, padT + 12));
  if (mdot > 0.05 && broad < 0.35) { ctx.fillStyle = '#ffa94d'; ctx.fillText(L('宽线被环面遮挡', 'broad lines torus-blocked'), padL + 8, H - padB - 10); }
  if (jet > 3) { ctx.fillStyle = '#bde9ff'; ctx.fillText(L('δ³ 束流连续谱', 'δ³ beamed continuum'), W - padR - 130, padT + 12); }
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const sView = document.getElementById('sView'), sViewVal = document.getElementById('sViewVal');
const sMass = document.getElementById('sMass'), sMassVal = document.getElementById('sMassVal');
const sMd = document.getElementById('sMd'), sMdVal = document.getElementById('sMdVal');
const stL = document.getElementById('stL'), stE = document.getElementById('stE'), stM = document.getElementById('stM'),
  stI = document.getElementById('stI'), stZ = document.getElementById('stZ'), stC = document.getElementById('stC');
const formulaEl = document.getElementById('formula');
const btnQ = document.getElementById('btnQ'), btnBL = document.getElementById('btnBL'),
  btnT2 = document.getElementById('btnT2'), btnWide = document.getElementById('btnWide');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  sView.value = iCur; sViewVal.textContent = iCur.toFixed(0) + '°';
  sMass.value = Mlog; sMassVal.textContent = '10^' + Mlog.toFixed(1);
  sMd.value = mdot; sMdVal.textContent = mdot.toFixed(2);
}
function syncBtns() {
  btnQ.classList.toggle('on', iCur >= 12 && iCur < 45);
  btnBL.classList.toggle('on', iCur < 12);
  btnT2.classList.toggle('on', iCur >= 45);
}
function classify() {
  if (mdot < 0.02) return [L('沉睡·普通星系核', 'dormant nucleus'), ''];
  if (iCur < 12) return [L('耀变体 BL Lac', 'blazar (BL Lac)'), 'warn'];
  if (iCur < 45) return [L('1 型:宽线可见', 'Type 1: broad lines'), 'ok'];
  return [L('2 型:环面遮挡', 'Type 2: obscured'), ''];
}
function updateStats() {
  stL.textContent = fmtExp(Lobs) + ' W';
  const er = Lobs / Ledd;
  stE.textContent = (er < 10 ? er.toFixed(2) : fmtExp(er)) + ' ×L_Edd';
  stE.className = 'v ' + (windOn ? 'bad' : er > 1.05 ? 'warn' : 'ok');
  stM.textContent = '10^' + Mlog.toFixed(1) + ' M☉';
  stI.textContent = iCur.toFixed(1) + '°';
  stZ.textContent = zShow.toFixed(3);
  const [ct, cc] = classify();
  stC.textContent = ct;
  stC.className = 'v ' + cc;
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>L_Edd = 1.3×10³¹·(M/M☉) W</b>:当前 ${fmtExp(Ledd)} W——辐射压=引力的天花板,超线吸积自己吹跑燃料<br>` +
    `<b>δ = 1/(Γ(1−βcos i))</b>:Γ~10,i=${iCur.toFixed(0)}° → δ=${delta.toFixed(1)};束流按 δ³ 增亮 → L_obs = L_盘(1+0.1δ³) = ${fmtExp(Lobs)} W<br>` +
    `<b>效率 ~10%</b> 质能转化(氢聚变 0.7%);极限吸积下每 4.5×10⁷ 年质量翻 e 倍`,
    `<b>L_Edd = 1.3×10³¹·(M/M☉) W</b>: now ${fmtExp(Ledd)} W — where radiation pressure equals gravity; overfeed and you blow your own fuel away<br>` +
    `<b>δ = 1/(Γ(1−βcos i))</b>: Γ~10, i=${iCur.toFixed(0)}° → δ=${delta.toFixed(1)}; the beam gains δ³ → L_obs = L_disk(1+0.1δ³) = ${fmtExp(Lobs)} W<br>` +
    `<b>~10%</b> mass-to-radiation efficiency (fusion: 0.7%); at the Eddington rate mass grows by e every 4.5×10⁷ yr`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawSpec();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
let svDrag = false;
sView.addEventListener('pointerdown', () => { svDrag = true; });
addEventListener('pointerup', () => { svDrag = false; });
sView.addEventListener('input', () => { flyView(+sView.value); sViewVal.textContent = (+sView.value).toFixed(0) + '°'; });
sMass.addEventListener('input', () => { Mlog = +sMass.value; sMassVal.textContent = '10^' + Mlog.toFixed(1); updateStats(); updateFormula(); });
sMd.addEventListener('input', () => { mdot = +sMd.value; sMdVal.textContent = mdot.toFixed(2); updateStats(); updateFormula(); drawSpec(); });
btnQ.addEventListener('click', () => flyView(30));
btnBL.addEventListener('click', () => flyView(5));
btnT2.addEventListener('click', () => flyView(80));
btnWide.addEventListener('click', () => flyView(iCur, 105));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglJets').addEventListener('change', e => { jetsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglSpec').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglSlow').addEventListener('change', e => { slowMo = e.target.checked; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawSpec();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, T = 0;
controls.addEventListener('start', () => { camTween = null; });
const _M4 = new THREE.Matrix4(), _Q = new THREE.Quaternion(), _S = new THREE.Vector3(), _Qi = new THREE.Quaternion();
function updJet(j, pole, cosCam, dt) {
  const cApp = clamp(Math.abs(cosCam), 0, 1) * (Math.sign(cosCam) * pole > 0 ? 1 : -1);
  const dApp = 1 / (10 * (1 - 0.995 * cApp));
  const bd = clamp(0.18 + 0.95 * Math.pow(dApp ** 3 / 8000, 0.45), 0.18, 1.15);
  j.m.color.setRGB(0.6 * bd, 0.75 * bd, Math.min(1, 1.05 * bd));
  for (let i = 0; i < NJ; i++) {
    j.D[i] += j.V[i] * dt;
    if (j.D[i] > 92) { j.D[i] = 2 + Math.random() * 3; j.A[i] = Math.random() * Math.PI * 2; }
    j.A[i] += dt * 3.0 * clamp(6 / j.D[i], 0.3, 2);
    const rho = 0.16 + j.D[i] * 0.018;
    _V.set(Math.cos(j.A[i]) * rho, pole * j.D[i], Math.sin(j.A[i]) * rho);
    const s = j.S[i] * (1 + 0.6 * Math.max(0, Math.sin(j.D[i] * 1.8 - T * 7)));
    _M4.compose(_V, _Qi, _S.set(s, s, s));
    j.mesh.setMatrixAt(i, _M4);
  }
  j.mesh.instanceMatrix.needsUpdate = true;
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * timeScale * (slowMo ? 0.35 : 1) * (playing ? 1 : 0);
  T += dt;
  iCur = camAngle();
  derive();
  const dimNuc = 0.1 + 0.9 * (1 - sm(iCur, 42, 55));
  const bl = clamp(0.16 + 0.9 * Math.pow(Math.min(mdot, 1.1), 0.45), 0.16, 1.1);
  /* 吸积盘粒子 */
  for (let i = 0; i < NDK; i++) {
    let r = dkR[i];
    r -= dt * 0.4 * Math.pow(Math.max(mdot, 0.03), 0.5) * Math.pow(RD_IN / Math.max(r, 1), 1.5);
    if (r < RD_IN + 0.06) { respawnDisk(i); r = dkR[i]; }
    dkR[i] = r;
    dkP[i] += KW / Math.pow(r, 1.5) * dt;
    const puff = 1 + 1.6 * Math.max(0, mdot - 1);
    _V.set(Math.cos(dkP[i]) * r, dkY[i] * (0.028 * r + 0.02) * puff, Math.sin(dkP[i]) * r);
    const sz = dkS[i] * clamp(r / 2.5, 0.55, 1.6);
    _M4.compose(_V, _Qi, _S.set(sz, sz, sz));
    disk.setMatrixAt(i, _M4);
    const f = clamp(1 - (r - RD_IN) / (RD_OUT - RD_IN), 0, 1);
    const c = ramp(Math.pow(f, 1.35));
    const g = bl * dimNuc * (1 + 0.5 * Math.pow(f, 3));
    _C.setRGB(c[0] * g, c[1] * g, c[2] * g);
    disk.setColorAt(i, _C);
  }
  disk.instanceMatrix.needsUpdate = true;
  if (disk.instanceColor) disk.instanceColor.needsUpdate = true;
  /* BLR 云 */
  blrM.color.setScalar(clamp(bl * dimNuc * 1.1, 0.1, 1.1));
  for (let i = 0; i < NBL; i++) {
    blP[i] += 26 / Math.pow(blR[i], 1.5) * dt;
    _V.set(Math.cos(blP[i]) * blR[i], blY[i], Math.sin(blP[i]) * blR[i]);
    const sz = 0.13 + 0.1 * (i % 5) / 5;
    _M4.compose(_V, _Qi, _S.set(sz, sz, sz));
    blr.setMatrixAt(i, _M4);
  }
  blr.instanceMatrix.needsUpdate = true;
  /* 尘埃环慢转 */
  for (let i = 0; i < NTR; i++) {
    trA[i] += trW[i] * dt;
    _V.set(Math.cos(trA[i]) * trR[i], trY[i], Math.sin(trA[i]) * trR[i]);
    const sz = 0.18 + 0.22 * (i % 7) / 7;
    _M4.compose(_V, _Qi, _S.set(sz, sz, sz));
    torus.setMatrixAt(i, _M4);
  }
  torus.instanceMatrix.needsUpdate = true;
  /* 窄线区双极锥外流 */
  for (let i = 0; i < NNL; i++) {
    nlR[i] += dt * 2.4;
    if (nlR[i] > 64) nlR[i] = 24;
    const al = 0.55 * Math.pow((i % 13) / 13, 0.8) + 0.05;
    _V.set(Math.cos(nlA[i]) * Math.sin(al) * nlR[i], nlT[i] * Math.cos(al) * nlR[i], Math.sin(nlA[i]) * Math.sin(al) * nlR[i]);
    const sz = 0.55 + 0.4 * (i % 4) / 4;
    _M4.compose(_V, _Qi, _S.set(sz, sz, sz));
    nlr.setMatrixAt(i, _M4);
  }
  nlr.instanceMatrix.needsUpdate = true;
  /* 喷流:近端增亮、远端压暗 */
  const toCam = clamp(camera.position.clone().normalize().y, -1, 1);
  if (jetsOn) {
    updJet(jetA, 1, toCam, dt);
    updJet(jetB, -1, toCam, dt);
  }
  jetA.mesh.visible = jetB.mesh.visible = jetsOn;
  /* 并合送气内流 */
  infall.visible = fueling && mdot > 0.02;
  if (infall.visible) {
    inM.opacity = clamp(0.15 + mdot, 0, 0.75);
    for (let i = 0; i < NIN; i++) {
      inR[i] -= dt * (5 + inR[i] * 0.42);
      if (inR[i] < 8.2) { inR[i] = 34 + Math.random() * 12; inY[i] = (Math.random() - 0.5) * 10; }
      inA[i] += dt * 46 / Math.pow(inR[i], 1.5);
      _V.set(Math.cos(inA[i]) * inR[i], inY[i] * (inR[i] / 44), Math.sin(inA[i]) * inR[i]);
      const sz = 0.14 + 0.1 * (i % 5) / 5;
      _M4.compose(_V, _Qi, _S.set(sz, sz, sz));
      infall.setMatrixAt(i, _M4);
    }
    infall.instanceMatrix.needsUpdate = true;
  }
  /* 超爱丁顿外流风 */
  wind.visible = windOn;
  if (windOn) {
    for (let i = 0; i < NW; i++) {
      wD[i] += wV[i] * dt * (1 + wD[i] * 0.12);
      if (wD[i] > 36) { wD[i] = 2.6; wA[i] = Math.random() * Math.PI * 2; }
      const al = (0.45 + 0.9 * ((i % 11) / 11)) * Math.PI / 180 * 55;
      _V.set(Math.cos(wA[i]) * Math.sin(al) * wD[i], wT[i] * Math.cos(al) * wD[i], Math.sin(wA[i]) * Math.sin(al) * wD[i]);
      const sz = 0.12 + 0.08 * (i % 6) / 6;
      _M4.compose(_V, _Qi, _S.set(sz, sz, sz));
      wind.setMatrixAt(i, _M4);
    }
    wind.instanceMatrix.needsUpdate = true;
  }
  /* 亮度/辉光随供给率与遮挡 */
  glow.scale.setScalar(3 + 3.2 * Math.sqrt(Math.min(mdot, 1.5)));
  glow.material.opacity = (0.12 + 0.42 * Math.pow(Math.min(mdot, 1), 0.6)) * dimNuc * (THEME === 'dark' ? 1 : 0.75);
  host.rotation.y += dt * 0.012;
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  /* 视线角滑块跟随相机 */
  if (!svDrag && Math.abs(+sView.value - iCur) > 0.7) { sView.value = iCur; sViewVal.textContent = iCur.toFixed(0) + '°'; }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); updateFormula(); drawSpec(); syncBtns(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis() && r.text() !== '';
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
syncAll();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); syncAll(); }
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
