<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>金属探测器与涡流 · 涡流应答,电桥报警</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#fab005;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e67700;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(250,176,5,.6);background:rgba(250,176,5,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(230,119,0,.55);background:rgba(230,119,0,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(250,176,5,.10);border-color:rgba(250,176,5,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(230,119,0,.08);border-color:rgba(230,119,0,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe9a8}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="金属探测器与涡流" data-en="Metal Detectors & Eddy Currents">金属探测器与涡流</h1>
  <div class="sub" data-zh="发射线圈把交变磁场打进地里,金属里的涡流回敬一个反磁场:接收线圈一失衡,电桥当场报警——铁的相位与非铁不同,扫频一比就能分家 · 拖动旋转 / 空格运行/暂停" data-en="The transmitter coil drives an alternating field into the ground and eddy currents answer with an opposing field: the receiver goes off balance and the bridge alarms — ferrous and non-ferrous answer in different phase, so a frequency sweep sorts them · drag to orbit / Space = run/pause">发射线圈把交变磁场打进地里,金属里的涡流回敬一个反磁场:接收线圈一失衡,电桥当场报警——铁的相位与非铁不同,扫频一比就能分家 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="线圈阻抗变化" data-en="Coil ΔZ">线圈阻抗变化</span><span class="v" id="stZ">—</span>
  <span class="k" data-zh="涡流强度" data-en="Eddy strength">涡流强度</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="目标深度" data-en="Target depth">目标深度</span><span class="v" id="stD">—</span>
  <span class="k" data-zh="报警" data-en="Alarm">报警</span><span class="v" id="stA">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bSweep" data-zh="左右扫描" data-en="Sweep">左右扫描</button>
    <button class="abtn" id="bCut" data-zh="剖开地面" data-en="Cutaway">剖开地面</button>
    <button class="abtn" id="bFreq" data-zh="扫频鉴别" data-en="Freq sweep">扫频鉴别</button>
  </div>
  <div class="row">
    <label data-zh="扫描位置" data-en="Sweep position">扫描位置</label>
    <input id="sPos" type="range" min="-4" max="4" step="0.1" value="-4">
    <span class="val" id="sPosVal">-4.0 m</span>
  </div>
  <div class="row">
    <label data-zh="目标材质" data-en="Target material">目标材质</label>
    <input id="sMat" type="range" min="0" max="2" step="1" value="0">
    <span class="val" id="sMatVal">铁钉</span>
  </div>
  <div class="row">
    <label data-zh="目标深度" data-en="Target depth">目标深度</label>
    <input id="sDep" type="range" min="5" max="60" step="5" value="20">
    <span class="val" id="sDepVal">20 cm</span>
  </div>
  <div class="row">
    <label data-zh="灵敏度" data-en="Sensitivity">灵敏度</label>
    <input id="sSens" type="range" min="20" max="100" step="5" value="70">
    <span class="val" id="sSensVal">70 %</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglField" type="checkbox" checked> <span data-zh="磁通线" data-en="Flux lines">磁通线</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../electromagnetic-induction/" data-zh="电磁感应" data-en="Electromagnetic Induction">电磁感应</a>
    <a href="../induction-cooktop/" data-zh="电磁炉" data-en="The Induction Cooktop">电磁炉</a>
    <a href="../faraday-cage/" data-zh="法拉第笼" data-en="The Faraday Cage">法拉第笼</a>
    <a href="../maglev/" data-zh="磁悬浮列车" data-en="Maglev">磁悬浮列车</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,22,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-5.5,4.2,8.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 沙滩地面(可剖切:两块板) ---- */
const sandM=new THREE.MeshStandardMaterial({color:0x8a7a5c,roughness:1});
const groundA=new THREE.Mesh(new THREE.BoxGeometry(12,0.5,6),sandM);
groundA.position.set(0,-0.25,3.0);scene.add(groundA);
const groundB=groundA.clone();groundB.position.z=-3.0;scene.add(groundB);

/* ---- 金属目标(埋在地下) ---- */
const TARGET_X=0.8,TARGET_Z=0;
const matList=[
 {name:'铁钉(铁磁)',zh:'铁钉',en:'Iron nail',color:0x868e96,phase:45,mu:3.0},
 {name:'铜币(导电非磁)',zh:'铜币',en:'Copper coin',color:0xe8985a,phase:-30,mu:1.0},
 {name:'铝盖(低阻)',zh:'铝盖',en:'Aluminum cap',color:0xcfd8e3,phase:-60,mu:1.0},
];
const targetM=new THREE.MeshStandardMaterial({color:0x868e96,roughness:0.4,metalness:0.7});
const target=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.5,12),targetM);
target.rotation.z=Math.PI/2;
target.position.set(TARGET_X,-0.25,TARGET_Z);
scene.add(target);

/* ---- 探测器(杆+盘) ---- */
const detG=new THREE.Group();scene.add(detG);
const rodM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.5,metalness:0.4});
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,2.2,10),rodM);
rod.position.y=1.1;detG.add(rod);
const grip=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.12,0.12),rodM);
grip.position.y=2.0;detG.add(grip);
const coilM=new THREE.MeshStandardMaterial({color:0x495057,roughness:0.5,metalness:0.5});
const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.12,28),coilM);
detG.add(disc);
detG.position.set(-4,0.4,0);

/* ---- 发射线圈(盘下铜环)与磁通线 ---- */
const coilRing=new THREE.Mesh(new THREE.TorusGeometry(0.36,0.035,10,36),
  new THREE.MeshStandardMaterial({color:0xd8a03c,roughness:0.3,metalness:0.75}));
coilRing.rotation.x=Math.PI/2;coilRing.position.y=-0.12;detG.add(coilRing);
const recvRing=coilRing.clone();recvRing.position.y=-0.2;recvRing.scale.setScalar(0.7);
recvRing.material=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.3,metalness:0.75});
detG.add(recvRing);
/* 磁通泡泡(呼吸) */
const fluxM=new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.25,side:THREE.DoubleSide,depthWrite:false});
const fluxGroup=new THREE.Group();scene.add(fluxGroup);
const fluxRings=[];
for(let i=0;i<4;i++){
  const r=new THREE.Mesh(new THREE.TorusGeometry(0.5+i*0.28,0.008,6,40),fluxM);
  r.rotation.x=Math.PI/2;
  fluxGroup.add(r);fluxRings.push(r);
}
/* 涡流环(目标处亮起) */
const eddyM=new THREE.MeshBasicMaterial({color:0x8ce99a,transparent:true,opacity:0,side:THREE.DoubleSide});
const eddy=new THREE.Mesh(new THREE.TorusGeometry(0.14,0.02,8,32),eddyM);
eddy.rotation.x=Math.PI/2;
eddy.position.copy(target.position);
scene.add(eddy);
/* 反磁场(反向弧) */
const antiM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0,side:THREE.DoubleSide});
const anti=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.012,8,36),antiM);
anti.rotation.x=Math.PI/2;
anti.position.copy(target.position);
scene.add(anti);

/* ---- 信号表(侧板指针) ---- */
const meterG=new THREE.Group();meterG.position.set(5.5,2.6,0);scene.add(meterG);
const meterBG=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.4,0.1),
  new THREE.MeshStandardMaterial({color:0x232830,roughness:0.7}));
meterG.add(meterBG);
const needle=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.9,0.03),
  new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff6b6b,emissiveIntensity:0.4}));
needle.geometry.translate(0,0.45,0);
needle.position.z=0.08;
meterG.add(needle);
/* 音波条 */
const beepM=new THREE.MeshStandardMaterial({color:0x8ce99a,emissive:0x8ce99a,emissiveIntensity:0});
const beep=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,10),beepM);
beep.position.set(0.6,0.5,0.1);meterG.add(beep);

/* ---- 状态 ---- */
let sweepPos=-4,matI=0,depth=20,sens=70,playing=true,labelsOn=true,slowMo=false;
let autoSweep=true,cutOpen=false,freqScan=false,simT=0,fScanT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function dist2target(){return Math.hypot(sweepPos-TARGET_X,TARGET_Z);}
function coupling(){/* 线圈-目标耦合系数 */
  const d=dist2target();
  const depthF=clamp(1-depth/70,0.1,1);
  return Math.exp(-Math.pow(d/1.4,2))*depthF;}
function signal(){/* 信号强度与相位 */
  const m=matList[matI];
  return {amp:coupling()*m.mu*(freqScan?1+0.4*Math.sin(fScanT*2):1),phase:m.phase};}
function alarming(){
  const s=signal();
  return s.amp*2.4>sens/100*0.55;}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('发射线圈:几十 kHz 交变磁场入地','Transmitter: tens-of-kHz AC field into the ground'),
  new THREE.Vector3(-4,2.9,0),'y');
addLabel(()=>L('接收线圈:电桥只认失衡','Receiver: the bridge only reads imbalance'),
  new THREE.Vector3(-4,2.2,0),'b');
addLabel(()=>L(`目标:埋着 ${matList[matI].zh},深 ${depth} cm`,`Target: a ${matList[matI].en} at ${depth} cm`),
  new THREE.Vector3(TARGET_X+1.6,-1.2,0),'o',()=>cutOpen);
addLabel(()=>L('涡流亮起:金属回敬一个反磁场','Eddy currents lit: the metal answers with an opposing field'),
  new THREE.Vector3(TARGET_X+1.8,0.4,0),'g',()=>signal().amp>0.05);

/* ---- 控件 ---- */
function setPos(v){sweepPos=clamp(v,-4,4);
  document.getElementById('sPos').value=sweepPos;
  document.getElementById('sPosVal').textContent=sweepPos.toFixed(1)+' m';
  autoSweep=false;updateStats();}
function setMat(v){matI=clamp(v,0,2);
  document.getElementById('sMat').value=matI;
  document.getElementById('sMatVal').textContent=matList[matI].zh;
  targetM.color.setHex(matList[matI].color);
  target.scale.set(1,matI===0?1.6:0.7,1);
  target.rotation.z=matI===0?Math.PI/2:0;
  updateStats();}
function setDep(v){depth=clamp(v,5,60);
  document.getElementById('sDep').value=depth;
  document.getElementById('sDepVal').textContent=depth.toFixed(0)+' cm';
  target.position.y=-0.15-depth/100;
  eddy.position.copy(target.position);
  anti.position.copy(target.position);updateStats();}
function setSens(v){sens=clamp(v,20,100);
  document.getElementById('sSens').value=sens;
  document.getElementById('sSensVal').textContent=sens.toFixed(0)+' %';updateStats();}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'发射线圈:交变磁通打进地里',en:'Transmitter: AC flux driven into the ground',
  act(){setPos(-4);setMat(0);setDep(20);autoSweep=true;}},
 {zh:'金属目标:感生涡流成形',en:'The target: eddy currents take shape',
  act(){setPos(0.5);setMat(0);}},
 {zh:'反磁场:削弱并移相原信号',en:'Counter-field: weakened and phase-shifted',
  act(){setPos(0.8);setMat(0);}},
 {zh:'接收失衡:电桥当场报警',en:'Receiver off balance: the bridge alarms',
  act(){setPos(0.8);setSens(70);}},
 {zh:'铁/非铁:相位不同,当场分家',en:'Ferrous vs not: the phase sorts them',
  act(){setPos(0.8);setMat(1);}},
 {zh:'灵敏度与地平衡:太灵了满地假信号',en:'Sensitivity: crank it and the ground lies',
  act(){setPos(0.8);setSens(100);setDep(50);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const s=signal();
  const z=s.amp*2.4-sens/100*0.5;
  document.getElementById('stZ').innerHTML=(z*100).toFixed(1)+'<small> %</small>';
  document.getElementById('stE').innerHTML=(s.amp*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stD').innerHTML=depth.toFixed(0)+'<small> cm</small>';
  const av=document.getElementById('stA');
  const al=alarming();
  av.textContent=al?L('响!','BEEP!'):L('静默','quiet');
  av.className='v '+(al?'warn':'ok');
}

/* ---- 事件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSweep').addEventListener('click',()=>{autoSweep=true;document.getElementById('sPos').value=sweepPos;});
document.getElementById('bCut').addEventListener('click',()=>{
  cutOpen=!cutOpen;
  document.getElementById('bCut').classList.toggle('on',cutOpen);
  groundB.position.z=cutOpen?5.4:-3.0;
  groundA.position.z=cutOpen?5.4:3.0;});
document.getElementById('bFreq').addEventListener('click',()=>{freqScan=!freqScan;fScanT=0;
  document.getElementById('bFreq').classList.toggle('on',freqScan);});
document.getElementById('sPos').addEventListener('input',e=>setPos(+e.target.value));
document.getElementById('sMat').addEventListener('input',e=>setMat(+e.target.value));
document.getElementById('sDep').addEventListener('input',e=>setDep(+e.target.value));
document.getElementById('sSens').addEventListener('input',e=>setSens(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglField').addEventListener('change',e=>{fluxGroup.visible=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  sandM.color.setHex(dark?0x8a7a5c:0xd6c9ae);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 自动扫掠 */
  if(autoSweep&&playing){
    sweepPos=Math.sin(simT*0.6)*4;
    document.getElementById('sPos').value=sweepPos;
    document.getElementById('sPosVal').textContent=sweepPos.toFixed(1)+' m';
  }
  if(freqScan)fScanT+=dts;
  /* 探测器跟随 */
  detG.position.x=sweepPos;
  detG.rotation.z=Math.sin(simT*1.7)*0.04;
  detG.position.y=0.4+Math.abs(Math.sin(simT*0.6))*0.12*0;
  /* 磁通呼吸 */
  const s=signal();
  const breathe=1+0.06*Math.sin(simT*18);
  fluxGroup.position.copy(detG.position);
  fluxRings.forEach((r,i)=>{
    r.scale.setScalar(breathe+i*0.04*Math.sin(simT*9+i));
    r.material=fluxM;
  });
  fluxM.opacity=0.18+0.08*Math.sin(simT*18);
  /* 涡流强度 */
  const e=s.amp;
  eddyM.opacity=clamp(e*2.2,0,0.9);
  eddy.scale.setScalar(1+0.15*Math.sin(simT*18));
  eddy.rotation.z+=dts*6;
  /* 反磁场(相位差可视化:铁相移小,非铁相移大) */
  antiM.opacity=clamp(e*1.6,0,0.7);
  anti.scale.setScalar(1.1+0.2*Math.sin(simT*18+matList[matI].phase*Math.PI/180));
  /* 信号表 */
  const z=s.amp*2.4-sens/100*0.5;
  needle.rotation.z=clamp(-z*1.2,-1.1,1.1);
  const al=alarming();
  beepM.emissiveIntensity=al?0.4+0.4*Math.abs(Math.sin(simT*14)):0;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
