<!DOCTYPE html>

<title>磁重联与太阳耀斑 · 断裂的磁弦</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---- 工具 ---- */
const qs=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=f=>{f=clamp(f,0,1);return f*f*(3-2*f);};
const lerp=(a,b,f)=>a+(b-a)*f;
const rnd=(a,b)=>a+Math.random()*(b-a);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 / 场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,52);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,150);
camera.position.set(0.5,1.8,12.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.5,0.4,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=55;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(4,7,6); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-6,4,-4); scene.add(fill);

/* ---- 能量账本 ---- */
const E={mag:70,ke:0,heat:0,part:0,released:0};
function ledgerBars(){
  barMag.scale.x=Math.max(E.mag,0.01); barMag.position.x=BX+barMag.scale.x/2;
  barKe.scale.x=Math.max(E.ke,0.01);   barKe.position.x=BX+barKe.scale.x/2;
  barHe.scale.x=Math.max(E.heat,0.01); barHe.position.x=BX+barHe.scale.x/2;
  barPa.scale.x=Math.max(E.part,0.01); barPa.position.x=BX+barPa.scale.x/2;
}
const BX=-6.6, BMAX=3.4;
function barMesh(c,y){
  const m=new THREE.Mesh(new THREE.BoxGeometry(1,0.16,0.16),
    new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.4,roughness:.4}));
  m.scale.x=0.01; m.position.set(BX,y,2.6); scene.add(m); return m;
}
const barMag=barMesh(0x74c0fc,-0.9), barKe=barMesh(0xffa94d,-1.3),
      barHe=barMesh(0xff6b6b,-1.7), barPa=barMesh(0xffe066,-2.1);
function release(dE){
  const e=Math.min(dE,E.mag); // 释放不能超过储存
  E.mag-=e; E.released+=e;
  E.ke+=e*0.45; E.heat+=e*0.3; E.part+=e*0.25;
}

/* ---- 日冕场景 ---- */
const corG=new THREE.Group(); scene.add(corG);
const photo=new THREE.Mesh(new THREE.BoxGeometry(15,0.3,6),
  new THREE.MeshStandardMaterial({color:0x8a3c10,roughness:.85,emissive:0xd9480f,emissiveIntensity:.35}));
photo.position.set(0,-2.55,0); corG.add(photo);
function pad(x,c){
  const m=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.2,1.3),
    new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.5,roughness:.5}));
  m.position.set(x,-2.36,0); corG.add(m); return m;
}
/* 磁拱：二次贝塞尔 + 管几何（参数变化节流重建） */
const NL=3, HGT=[1.7,2.25,2.8];
const ARCADW=2.3, GCrit=1.0, GMAX=3.4;
let gap=GMAX, lastGap=-9, eventT=-1;
const arcs=[]; // {p0,pa,p1,curve,tube,side}
const lineMat=()=>new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1c6ea0,emissiveIntensity:.5,roughness:.4});
for(let s=0;s<2;s++) for(let i=0;i<NL;i++){
  const tube=new THREE.Mesh(new THREE.BufferGeometry(),lineMat());
  corG.add(tube);
  arcs.push({side:s,idx:i,tube,curve:null});
}
function arcCurve(side,idx,g){
  const sgn=side===0?-1:1, a=ARCADW;
  return new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(sgn*(a+g/2),-2.35,0),
    new THREE.Vector3(sgn*(a*0.28+g/2),-2.35+HGT[idx],0),
    new THREE.Vector3(sgn*g/2,-2.35,0));
}
function rebuildArcs(){
  for(const a of arcs){
    a.curve=arcCurve(a.side,a.idx,gap);
    const geo=new THREE.TubeGeometry(a.curve,40,0.035,6,false);
    a.tube.geometry.dispose(); a.tube.geometry=geo;
  }
  lastGap=gap;
}
/* 重联产物：新内拱 + 开放线 + 磁云 + 闪光 */
const newArcCurve=g=>new THREE.QuadraticBezierCurve3(
  new THREE.Vector3(-g/2,-2.35,0),new THREE.Vector3(0,-0.95,0),new THREE.Vector3(g/2,-2.35,0));
const newArc=new THREE.Mesh(new THREE.BufferGeometry(),
  new THREE.MeshStandardMaterial({color:0xffd8a8,emissive:0xffa94d,emissiveIntensity:.8,roughness:.35}));
newArc.visible=false; corG.add(newArc);
const openMat=new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:.85});
const openArcs=[0,1].map(s=>{
  const m=new THREE.Mesh(new THREE.BufferGeometry(),openMat.clone());
  m.visible=false; corG.add(m); return m;
});
function openCurve(s,g){
  return new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(s?g/2:-g/2,0.6,0),
    new THREE.Vector3(s?2.6:-2.6,3.2,0),
    new THREE.Vector3(s?5.2:-5.2,5.6,0));
}
const plasmoid=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.13,10,24),
  new THREE.MeshStandardMaterial({color:0xffe8cc,emissive:0xff922b,emissiveIntensity:.9,roughness:.35}));
plasmoid.visible=false; corG.add(plasmoid);
const flash=new THREE.Mesh(new THREE.SphereGeometry(0.5,20,14),
  new THREE.MeshBasicMaterial({color:0xfff4e6,transparent:true,opacity:0}));
flash.position.set(0,0.35,0); corG.add(flash);
const flareLight=new THREE.PointLight(0xffc078,0,18); flareLight.position.set(0,1,2); corG.add(flareLight);
/* 粒子雨（上喷 + 下注） */
const RN=70;
const rain=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,8,6),
  new THREE.MeshStandardMaterial({color:0xfff4e6,emissive:0xffc078,emissiveIntensity:.9,transparent:true}),RN);
rain.instanceMatrix.setUsage(THREE.DynamicDrawUsage); corG.add(rain);
const zeroM=new THREE.Matrix4().makeScale(0,0,0), tmpM=new THREE.Matrix4();
const rp=[];
for(let i=0;i<RN;i++){ rain.setMatrixAt(i,zeroM); rp.push({on:false,p0:new THREE.Vector3(),v:new THREE.Vector3()}); }
function burstRain(g){
  for(let i=0;i<RN;i++){
    const up=i<RN*0.62;
    rp[i].on=true;
    rp[i].p0.set(rnd(-0.25,0.25),0.35+rnd(-0.15,0.15),rnd(-0.25,0.25));
    rp[i].v.set(rnd(-0.5,0.5),up?rnd(2.2,4.6):rnd(-2.4,-3.6),rnd(-0.5,0.5));
  }
}
/* 电流片 */
const sheet=new THREE.Mesh(new THREE.PlaneGeometry(0.5,2.6),
  new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:.14,side:THREE.DoubleSide}));
sheet.position.set(0,-0.9,0); corG.add(sheet);
/* 磁拱珠子：显示方向（左右反向） */
const BN=12;
const beads=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),
  new THREE.MeshBasicMaterial({color:0xffe8cc,transparent:true,opacity:.9}),BN);
beads.instanceMatrix.setUsage(THREE.DynamicDrawUsage); corG.add(beads);
let beadT=0;

function coronaUpdate(dt){
  const etaFrac=eta/100;
  const drive=drv/100;
  if(playing&&eventT<0){
    gap-=drive*2.4*dt;         // 光球对流把磁拱压近
    E.mag=Math.min(100,E.mag+drive*1.6*dt);
    sheet.material.opacity=0.1+0.16*(1-gap/GMAX);
    if(gap<=GCrit*(1.6-1.2*etaFrac)) fire(); // η 越大越早/越快重联
  }else if(playing&&eventT>=0){
    eventT+=dt;
    if(eventT>2.2) resetEvent(); // 循环：光球对流再次扭缠
  }
  /* 事件视觉全部由 eventT 决定（暂停时跳步骤也能正确呈现） */
  if(eventT>=0){
    const t=eventT;
    flash.material.opacity=Math.max(0,0.9-t*1.4);
    flash.scale.setScalar(1+t*2.4);
    flareLight.intensity=Math.max(0,26-t*30);
    if(newArc.visible)
      newArc.geometry.setDrawRange(0,Math.floor(40*6*smooth(t/0.4)));
    for(let s=0;s<2;s++){
      const m=openArcs[s];
      if(m.visible){
        m.geometry.setDrawRange(0,Math.floor(30*6*smooth((t-0.12)/0.5)));
        m.material.opacity=Math.max(0,0.85-t*0.5);
      }
    }
    if(plasmoid.visible){
      plasmoid.position.y=0.9+2.2*t+1.0*t*t;
      plasmoid.rotation.z+=dt*3;
      plasmoid.material.opacity=Math.max(0,1-t*0.8);
    }
    for(let i=0;i<RN;i++){
      const r=rp[i]; if(!r.on) continue;
      const k=0.7, s=(1-Math.exp(-k*t))/k;
      tmpM.makeScale(1,1,1).setPosition(r.p0.x+r.v.x*s,r.p0.y+r.v.y*s,r.p0.z+r.v.z*s);
      rain.setMatrixAt(i,tmpM);
    }
    rain.instanceMatrix.needsUpdate=true;
  }
  if(Math.abs(gap-lastGap)>0.05) rebuildArcs();
  /* 珠子沿磁拱流动：左右反向（反平行磁场） */
  beadT+=dt*(0.25+drv/100*0.5);
  for(let i=0;i<BN;i++){
    const a=arcs[i%arcs.length];
    if(!a.curve||eventT>=0){ beads.setMatrixAt(i,zeroM); continue; }
    let u=(beadT*0.4+i*0.13)%1;
    if(a.side===1)u=1-u;
    const p=a.curve.getPoint(u);
    tmpM.makeScale(1,1,1).setPosition(p); beads.setMatrixAt(i,tmpM);
  }
  beads.instanceMatrix.needsUpdate=true;
  ledgerBars();
}
function resetEvent(){
  eventT=-1; newArc.visible=false; plasmoid.visible=false;
  openArcs.forEach(m=>m.visible=false);
  gap=GMAX; flash.material.opacity=0; flareLight.intensity=0;
  for(let i=0;i<RN;i++){ rp[i].on=false; rain.setMatrixAt(i,zeroM); }
  rain.instanceMatrix.needsUpdate=true;
}
function fire(){
  eventT=0;
  const dE=E.mag*0.35+8;
  release(dE);
  /* 新内拱（重搭） */
  const geo=new THREE.TubeGeometry(newArcCurve(gap),40,0.045,6,false);
  newArc.geometry.dispose(); newArc.geometry=geo;
  newArc.geometry.setDrawRange(0,0); newArc.visible=true;
  /* 开放线 + 磁云 */
  for(let s=0;s<2;s++){
    const m=openArcs[s], og=new THREE.TubeGeometry(openCurve(s,gap),30,0.035,6,false);
    m.geometry.dispose(); m.geometry=og; m.geometry.setDrawRange(0,0);
    m.material.opacity=0.85; m.visible=true;
  }
  plasmoid.visible=true; plasmoid.position.set(0,0.9,0); plasmoid.material.opacity=1;
  burstRain(gap);
  rebuildArcs();
}

/* ---- 磁层场景 ---- */
const magG=new THREE.Group(); scene.add(magG); magG.visible=false;
const EX=2.6;
const earth=new THREE.Mesh(new THREE.SphereGeometry(1.05,36,26),
  new THREE.MeshStandardMaterial({color:0x1c5f8f,roughness:.55,emissive:0x0b3357,emissiveIntensity:.3}));
earth.position.set(EX,0,0); magG.add(earth);
/* 偶极场弧（静态装饰） */
for(let i=0;i<3;i++){
  const c=new THREE.Mesh(new THREE.TorusGeometry(1.5+i*0.5,0.012,6,80,Math.PI),
    new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:.3}));
  c.position.copy(earth.position); magG.add(c);
}
/* 极光椭圆（夜侧高纬，亚暴时增亮） */
const aurora=new THREE.Mesh(new THREE.RingGeometry(0.22,0.5,24),
  new THREE.MeshBasicMaterial({color:0x69db7c,transparent:true,opacity:.25,side:THREE.DoubleSide}));
aurora.position.set(EX-0.72,0.62,0); aurora.rotation.y=Math.PI/2.6; aurora.rotation.x=-0.4;
magG.add(aurora);
/* 太阳风粒子 */
const WN=80;
const wind=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),
  new THREE.MeshStandardMaterial({color:0xbde9ff,emissive:0x4dabf7,emissiveIntensity:.5,transparent:true,opacity:.8}),WN);
wind.instanceMatrix.setUsage(THREE.DynamicDrawUsage); magG.add(wind);
const wp=[];
for(let i=0;i<WN;i++){
  wind.setMatrixAt(i,zeroM);
  wp.push({p:new THREE.Vector3(rnd(-8,8),rnd(-2.6,2.6),rnd(-1.4,1.4)),v:new THREE.Vector3()});
}
/* IMF 磁力线（南向 Bz）：wind→morph(白天侧重联)→open(拖入磁尾)→burst(亚暴释放) */
const NLm=5;
const mlines=[];
for(let i=0;i<NLm;i++){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(25*3),3));
  const ln=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:.85}));
  magG.add(ln);
  mlines.push({ln,st:'wind',x:-8-i*2.2,y0:(i%2?1:-1)*(0.25+i*0.16),t:0,
    p0:new THREE.Vector3(),pa:new THREE.Vector3(),p1:new THREE.Vector3()});
}
let tailFlashT=-1;
const tailFlash=new THREE.Mesh(new THREE.SphereGeometry(0.5,18,12),
  new THREE.MeshBasicMaterial({color:0xfff4e6,transparent:true,opacity:0}));
tailFlash.position.set(EX+4.1,0,0); magG.add(tailFlash);
function bez(p0,pa,p1,arr,n){
  for(let i=0;i<=n;i++){
    const u=i/n,a=(1-u)*(1-u),b=2*(1-u)*u,c=u*u;
    arr[i*3]=a*p0.x+b*pa.x+c*p1.x; arr[i*3+1]=a*p0.y+b*pa.y+c*p1.y; arr[i*3+2]=0;
  }
}
function mlineShape(m){
  if(m.st==='wind'){
    m.p0.set(m.x-1.1,m.y0+0.32,0); m.pa.set(m.x,m.y0-0.12,0); m.p1.set(m.x+1.1,m.y0+0.32,0);
  }else if(m.st==='morph'){
    const f=smooth(m.t/1.1);
    m.p0.set(lerp(m.x-1.1,EX-2.05,f),lerp(m.y0+0.32,0.15,f),0);
    m.pa.set(lerp(m.x,EX,f),lerp(m.y0-0.12,2.35,f),0);
    m.p1.set(lerp(m.x+1.1,EX+2.2,f),lerp(m.y0+0.32,1.1,f),0);
  }else if(m.st==='open'){
    m.p0.set(EX-2.05,0.15,0); m.pa.set(EX,2.35,0);
    m.p1.set(m.tx,1.1+(m.tx-EX)*0.06,0);
  }else{ // burst
    const f=smooth(m.t/0.9);
    m.p0.set(lerp(EX-2.05,EX+0.9,f),lerp(0.15,-0.5,f),0);
    m.pa.set(EX+1.8,lerp(2.35,0.8,f),0);
    m.p1.set(lerp(m.tx,m.tx+2.6,f),lerp(1.1,-1.9,f),0);
  }
}
function magUpdate(dt){
  const windV=1.4+drv/100*2.6;
  /* 太阳风 */
  for(let i=0;i<WN;i++){
    const w=wp[i];
    w.v.set(windV,0,0);
    const d=w.p.distanceTo(earth.position);
    if(d<2.2){ // 绕流：磁层顶偏转
      const away=new THREE.Vector3().subVectors(w.p,earth.position).normalize();
      w.v.addScaledVector(away,windV*1.3*(1-d/2.2));
    }
    w.p.addScaledVector(w.v,dt);
    if(w.p.x>9){ w.p.set(-8,rnd(-2.6,2.6),rnd(-1.4,1.4)); }
    tmpM.makeScale(1,1,1).setPosition(w.p); wind.setMatrixAt(i,tmpM);
  }
  wind.instanceMatrix.needsUpdate=true;
  /* IMF 线状态机 */
  let anyBurst=false;
  for(const m of mlines){
    if(playing){
      if(m.st==='wind'){
        m.x+=windV*dt;
        if(m.x>9){ m.x=-9-rnd(0,3); m.y0=(Math.random()<0.5?1:-1)*rnd(0.25,0.9); }
        else if(m.x>EX-2.3&&Math.abs(m.y0)<0.62){ m.st='morph'; m.t=0; }
      }else if(m.st==='morph'){
        m.t+=dt;
        if(m.t>=1.1){ m.st='open'; m.tx=EX+2.2; E.mag=Math.min(100,E.mag+7); }
      }else if(m.st==='open'){
        m.tx+=0.85*dt;
        if(m.tx>EX+3.9){ m.st='burst'; m.t=0; }
      }else if(m.st==='burst'){
        m.t+=dt; anyBurst=true;
        if(m.t>1.3){ m.st='wind'; m.x=-9; m.y0=(Math.random()<0.5?1:-1)*rnd(0.25,0.9); }
      }
    }
    mlineShape(m);
    const arr=m.ln.geometry.attributes.position.array;
    bez(m.p0,m.pa,m.p1,arr,24);
    m.ln.geometry.attributes.position.needsUpdate=true;
    m.ln.material.opacity=m.st==='burst'?Math.max(0.15,0.85-m.t*0.7):0.85;
  }
  if(anyBurst&&tailFlashT<0){ // 亚暴：磁尾释放（每次亚暴只结算一次）
    tailFlashT=0;
    release(Math.min(E.mag*0.6+4,26));
  }
  if(tailFlashT>=0){
    tailFlashT+=dt;
    tailFlash.material.opacity=Math.max(0,0.9-tailFlashT*1.6);
    tailFlash.scale.setScalar(1+tailFlashT*2);
    aurora.material.opacity=0.25+0.75*Math.max(0,1-tailFlashT/1.6);
    if(tailFlashT>2){ tailFlashT=-1; tailFlash.material.opacity=0; }
  }
  ledgerBars();
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('光球对流压近（驱动）','Photospheric driving'),
  new THREE.Vector3(-2.0,-3.05,0),'o',()=>sceneMode===0);   /* 右移避开左下面板 */
addLabel(()=>L('反平行磁拱：珠子反向流动','Antiparallel loops: beads flow opposite'),
  new THREE.Vector3(-1.9,1.5,0),'b',()=>sceneMode===0);     /* 右移避开左下面板 */
addLabel(()=>L('电流片 → X 点','Current sheet → X-point'),
  new THREE.Vector3(0.9,1.0,0),'o',()=>sceneMode===0);
addLabel(()=>L('耀斑闪光 + 粒子雨','Flare flash + particle rain'),
  new THREE.Vector3(0.2,2.6,0),'r',()=>sceneMode===0&&eventT>=0&&eventT<1.6);
addLabel(()=>L('磁云(小型 CME)上抛','Plasmoid (mini-CME) up'),
  new THREE.Vector3(1.6,3.6,0),'o',()=>sceneMode===0&&plasmoid.visible);
addLabel(()=>L('太阳风（超声速等离子体）','Solar wind (supersonic)'),
  new THREE.Vector3(-5.4,1.9,0),'b',()=>sceneMode===1);
addLabel(()=>L('白天侧磁层顶重联：装填磁尾','Dayside reconnection: loading the tail'),
  new THREE.Vector3(-0.6,-1.7,0),'o',()=>sceneMode===1);
addLabel(()=>L('夜间侧磁尾重联：亚暴释放','Nightside tail reconnection: substorm'),
  new THREE.Vector3(EX+4.1,-1.9,0),'r',()=>sceneMode===1);
addLabel(()=>L('极光增亮','Aurora brightens'),
  new THREE.Vector3(EX+0.6,2.0,0),'g',()=>sceneMode===1&&tailFlashT>=0);
addLabel(()=>L('磁能','B energy'),new THREE.Vector3(BX-0.85,-0.9,2.6),'b',()=>true);
addLabel(()=>L('动能','Kinetic'),new THREE.Vector3(BX-0.85,-1.3,2.6),'o',()=>true);
addLabel(()=>L('热','Heat'),new THREE.Vector3(BX-0.85,-1.7,2.6),'r',()=>true);
addLabel(()=>L('粒子','Particles'),new THREE.Vector3(BX-0.85,-2.1,2.6),'',()=>true);

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'冻结磁场：等离子体把磁力线「锁」在一起，扭缠磁拱储存磁能',en:'Frozen-in flux: plasma locks field lines; twisted loops store energy'},
 {zh:'反向磁力线被光球对流压近，电流片变薄，X 点形成',en:'Driving presses antiparallel lines together; the sheet thins into an X-point'},
 {zh:'磁力线剪断重搭：下方新拱收拢，磁张力把等离子体猛地弹开',en:'Lines cut & rejoin: a new loop snaps below, tension flings plasma outward'},
 {zh:'磁能 → 动能+热+高能粒子：耀斑闪光、磁云(小型 CME)上抛',en:'B energy → kinetic + heat + particles: flare flash, mini-CME ejects'},
 {zh:'快慢之别：低电阻率下 Sweet-Parker 慢重联；高 η/湍流 → 快重联',en:'Sweet-Parker slow vs fast (high-η/turbulent) reconnection'},
 {zh:'地球磁层：白天侧重联装填磁尾，夜间侧释放 → 极光亚暴',en:'Magnetosphere: dayside loading, nightside release → aurora substorm'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>gotoStep(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  activeStep=i; syncSteps(); setPlaying(false);
  if(i<=4){
    setScene(0);
    if(i===0){ gap=GMAX; eventT=-1; }
    else if(i===1){ gap=GCrit*1.05; eventT=-1; }
    else if(i===2){ gap=Math.min(gap,GCrit); fire(); eventT=0.42; }
    else if(i===3){ gap=Math.min(gap,GCrit); fire(); eventT=0.8; }
    else if(i===4){ eta=90; document.getElementById('sEta').value=90; document.getElementById('sEtaVal').textContent='90'; gap=GMAX; eventT=-1; }
    rebuildArcs();
  }else setScene(1);
}

/* ---- 状态 ---- */
let playing=true, labelsOn=true, sceneMode=0;
let drv=45, eta=20;

function setScene(m){
  sceneMode=m;
  corG.visible=m===0; magG.visible=m===1;
  document.getElementById('btnCor').classList.toggle('on',m===0);
  document.getElementById('btnMag').classList.toggle('on',m===1);
}
function updateStats(){
  const etaFrac=eta/100;
  document.getElementById('stScene').textContent=sceneMode===0?L('日冕','Corona'):L('磁层','Magnetosphere');
  const MA=sceneMode===0?0.01+0.09*etaFrac:0.04+0.06*etaFrac;
  document.getElementById('stRate').innerHTML=MA.toFixed(3)+'<small> v_A</small>';
  document.getElementById('stMag').innerHTML=E.mag.toFixed(0)+'<small> %</small>';
  document.getElementById('stRel').innerHTML=E.released.toFixed(0)+'<small> 单位</small>';
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}

/* ---- 交互 ---- */
function setPlaying(v){
  playing=v;
  document.getElementById('play').textContent=v?L('暂停','Pause'):L('运行','Run');
}
document.getElementById('btnCor').addEventListener('click',()=>setScene(0));
document.getElementById('btnMag').addEventListener('click',()=>setScene(1));
document.getElementById('btnFire').addEventListener('click',()=>{setScene(0);gap=Math.min(gap,GCrit);rebuildArcs();fire();});
document.getElementById('btnReset').addEventListener('click',()=>{E.mag=70;E.ke=0;E.heat=0;E.part=0;E.released=0;});
document.getElementById('sDrv').addEventListener('input',e=>{
  drv=+e.target.value; document.getElementById('sDrvVal').textContent=(drv/100).toFixed(2);
});
document.getElementById('sEta').addEventListener('input',e=>{
  eta=+e.target.value; document.getElementById('sEtaVal').textContent=eta;
});
document.getElementById('play').addEventListener('click',()=>setPlaying(!playing));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
let simT=0;
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(sceneMode===0) coronaUpdate(dt); else magUpdate(dt);
  acc+=dt; if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis(); if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数 & 启动 ---- */
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
const qsDrv=parseFloat(qs.get('speed'));
if(Number.isFinite(qsDrv)){drv=clamp(qsDrv*100,10,100);document.getElementById('sDrv').value=drv;document.getElementById('sDrvVal').textContent=(drv/100).toFixed(2);}
if(qs.get('scene')==='mag') setScene(1); else setScene(0);
rebuildArcs(); applyTheme(); applyLang();
if(qs.get('pause')==='1') setPlaying(false);
start();
</script>
