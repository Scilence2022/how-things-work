<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泰勒展开 · 一点相切,逐段重合</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.y { border-color: rgba(255,209,102,.9); color: #ffe9b3; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.b { color:#1864ab; } :root[data-theme="light"] .lbl.o { color:#a34e00; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.y { color:#9c6f00; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.f { color: #9fd9f9; border-color: rgba(127,208,247,.7); }
  .chip.t { color: #ffc78f; border-color: rgba(255,179,92,.7); }
  .chip.e { color: #ffaaa2; border-color: rgba(255,138,128,.7); }
  .chip.x { color: #ffe29a; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.f { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.t { color: #b26214; border-color: rgba(178,98,20,.7); }
  :root[data-theme="light"] .chip.e { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.x { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  #funcRow { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  #funcRow .brl { font-size: 12px; color: var(--text2); }
  .bon { appearance: none; font: inherit; cursor: pointer;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(76,201,240,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(21,128,163,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 58px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.6; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; font-variant-numeric: tabular-nums; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="泰勒展开:一点相切,逐段重合" data-en="Taylor series: tangent at a point, overlap everywhere">泰勒展开:一点相切,逐段重合</h1>
  <div class="sub" data-zh="在 x₀ 处逐阶仿造函数:多项式从切线长成整条曲线,误差带 |f−Pₙ| 随 N 收缩;sin/eˣ 全局收敛,ln(1+x) 一出收敛圈就飞走 · 拖黄点换 x₀ · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Rebuild f order by order at x₀: the polynomial grows from a tangent into the whole curve, the error band |f−Pₙ| shrinks with N; sin/eˣ converge everywhere, ln(1+x) flies off past its convergence circle · drag the yellow dot · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">在 x₀ 处逐阶仿造函数:多项式从切线长成整条曲线,误差带 |f−Pₙ| 随 N 收缩;sin/eˣ 全局收敛,ln(1+x) 一出收敛圈就飞走 · 拖黄点换 x₀ · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="展开点 x₀" data-en="expansion point x₀">展开点 x₀</span><span class="v" id="stX">0.00</span>
  <span class="k" data-zh="阶数 N" data-en="order N">阶数 N</span><span class="v" id="stN">3</span>
  <span class="k" data-zh="窗口最大误差 |f−Pₙ|" data-en="max error in view |f−Pₙ|">窗口最大误差 |f−Pₙ|</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="收敛半径 R" data-en="convergence radius R">收敛半径 R</span><span class="v" id="stR">∞</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip f" data-zh="真函数 f(x)" data-en="true function f(x)">真函数 f(x)</span>
    <span class="chip t" data-zh="泰勒多项式 Pₙ" data-en="Taylor polynomial Pₙ">泰勒多项式 Pₙ</span>
    <span class="chip e" data-zh="误差带 |f−Pₙ|" data-en="error band |f−Pₙ|">误差带 |f−Pₙ|</span>
    <span class="chip x" data-zh="x₀ 可拖" data-en="x₀ draggable">x₀ 可拖</span>
  </div>
  <div id="funcRow">
    <span class="brl" data-zh="函数：" data-en="Function:">函数：</span>
    <button id="fSin" class="bon on" data-zh="sin x" data-en="sin x">sin x</button>
    <button id="fCos" class="bon" data-zh="cos x" data-en="cos x">cos x</button>
    <button id="fExp" class="bon" data-zh="eˣ" data-en="eˣ">eˣ</button>
    <button id="fLn" class="bon" data-zh="ln(1+x)" data-en="ln(1+x)">ln(1+x)</button>
  </div>
  <div class="row"><label data-zh="阶数 N" data-en="Order N">阶数 N</label><input id="ord" type="range" min="0" max="12" step="1" value="3"><span class="val" id="ordVal">3</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="进度 = 阶数 N" data-en="Progress = order N">进度 = 阶数 N</label><input id="prog" type="range" min="0" max="12" step="0.01" value="3"><span class="val" id="progVal">3/12</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglBand" type="checkbox" checked> <span data-zh="误差带" data-en="Error band">误差带</span></label>
    <label><input id="tglTan" type="checkbox" checked> <span data-zh="切线对比(P₁ 虚线)" data-en="tangent ghost (P₁ dashed)">切线对比(P₁ 虚线)</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../fourier-series/" data-zh="对照:傅里叶——全局三角基" data-en="contrast: Fourier — global trig basis">对照:傅里叶——全局三角基</a>
    <a href="../neural-gradient/" data-zh="延伸:梯度下降只用一、二阶" data-en="related: gradient descent uses 1st/2nd order only">延伸:梯度下降只用一、二阶</a>
    <a href="../standing-waves/" data-zh="同族:泛音也是基函数配方" data-en="same family: harmonics as basis recipes">同族:泛音也是基函数配方</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const SUPD = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻' };
const SUBD = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
const sup = n => String(n).split('').map(c => SUPD[c] || c).join('');
const sub = n => String(n).split('').map(c => SUBD[c] || c).join('');
function fmt(v) {
  if (!isFinite(v)) return v > 0 ? '∞' : '−∞';
  const s = v < 0 ? '−' : '', a = Math.abs(v);
  if (a >= 1e5) { const e = Math.floor(Math.log10(a)); return s + (a / 10 ** e).toFixed(1) + '×10' + sup(e); }
  if (a >= 100) return s + a.toFixed(0);
  if (a >= 1) return s + a.toFixed(2);
  if (a < 0.001 && a > 0) return s + a.toExponential(0);
  return s + a.toFixed(3);
}

/* ---------------- 主题 / 语言(全站共享模式) ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const light = THEME === 'light';
  const bg = light ? 0xeef1f6 : 0x10141b;
  scene.background = new THREE.Color(bg);
  scene.fog = new THREE.Fog(bg, 17, 40);
  floorGrid.material.color.set(light ? 0x9aa7b8 : 0x3a4656);
  floorGrid.material.opacity = light ? 0.55 : 0.35;
  wallGrid.material.color.set(light ? 0x9fb0c3 : 0x39434f);
  wallGrid.material.opacity = light ? 0.62 : 0.55;
  axes.material.color.set(light ? 0x5b6b7d : 0x7d8a9c);
  fRb.mesh.material.color.set(light ? 0x35a8d8 : 0x2b9fc9);
  pRb.mesh.material.color.set(light ? 0xbd7419 : 0xcf8327);
  fEdge.material.color.set(light ? 0x0c7ba6 : 0x7fd0f7);
  pEdge.material.color.set(light ? 0xb26214 : 0xffb35c);
  for (const m of ghostMats) m.color.set(light ? 0xd97c1a : 0xff9a3c);
  tanLine.material.color.set(light ? 0x55657a : 0xc7d5e5);
  tanLine.material.opacity = light ? 0.75 : 0.5;
  singLine.material.color.set(light ? 0xb23b32 : 0xff8a80);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('泰勒展开 · 一点相切,逐段重合', 'Taylor Series · Tangent at a Point, Overlap Everywhere');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(3.6, 1.9, 11.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 30;

/* ================= 数学核心:四个函数的精确各阶导数 ================= */
const FACT = [1, 1, 2, 6, 24, 120, 720, 5040, 40320, 362880, 3628800, 39916800, 479001600];
const FUNCS = {
  sin: { f: x => Math.sin(x),
         d: (k, x0) => Math.sin(x0 + k * Math.PI / 2),
         R: () => Infinity },
  cos: { f: x => Math.cos(x),
         d: (k, x0) => Math.cos(x0 + k * Math.PI / 2),
         R: () => Infinity },
  exp: { f: x => Math.exp(x),
         d: (k, x0) => Math.exp(x0),
         R: () => Infinity },
  ln:  { f: x => x > -1 ? Math.log(1 + x) : NaN,
         d: (k, x0) => k === 0 ? Math.log(1 + x0)
             : (k % 2 === 1 ? 1 : -1) * FACT[k - 1] / Math.pow(1 + x0, k),
         R: x0 => x0 + 1 },
};
let F = FUNCS.sin, funcKey = 'sin';

/* 系数 aₖ = f⁽ᵏ⁾(x₀)/k!,Horner 求值 Pₙ(x);按 n 截断(2D 版恒取 12 阶是笔误) */
function coeffs() {
  const A = [];
  for (let k = 0; k <= 12; k++) A.push(F.d(k, x0) / FACT[k]);
  return A;
}
function makePN(A, n) {
  return x => { const dx = x - x0; let s = 0;
    for (let k = n; k >= 0; k--) s = s * dx + A[k];
    return s; };
}

const scratchY = new Float32Array(COLS + 1);
const allOk = new Uint8Array(COLS + 1).fill(1);
function fillGaps(y, ok) {          // 无效点用最近有效值填充 → 退化四边形不可见
  let first = -1;
  for (let i = 0; i <= COLS; i++) if (ok[i]) { first = i; break; }
  if (first < 0) { y.fill(0); return; }
  for (let i = 0; i < first; i++) y[i] = y[first];
  let lastV = y[first];
  for (let i = first + 1; i <= COLS; i++) { if (ok[i]) lastV = y[i]; else y[i] = lastV; }
}
function buildRibbon(zc, half, material, std) {
  const pos = new Float32Array((COLS + 1) * 2 * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const idx = [];
  for (let i = 0; i < COLS; i++) {
    const a = i * 2, b = a + 2;
    idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  geo.setIndex(idx);
  const mesh = new THREE.Mesh(geo, material);
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { geo, pos, mesh, zc, half, std };
}
function fillRibbonFromArray(rb, Y, Ok) {
  scratchY.set(Y);
  fillGaps(scratchY, Ok);
  const pos = rb.pos, h = rb.half, zc = rb.zc;
  for (let i = 0; i <= COLS; i++) {
    const iL = i > 0 ? i - 1 : 0, iR = i < COLS ? i + 1 : COLS;
    const slope = (scratchY[iR] - scratchY[iL]) / (xs[iR] - xs[iL]);
    const q = Math.hypot(1, slope);
    const ox = -slope / q * h, oy = 1 / q * h;      // 沿法向加厚,正视即等宽飘带
    const y = clamp(scratchY[i], CL_LO, CL_HI);
    const o = i * 6;
    pos[o]     = xs[i] + ox; pos[o + 1] = y + oy; pos[o + 2] = zc;
    pos[o + 3] = xs[i] - ox; pos[o + 4] = y - oy; pos[o + 5] = zc;
  }
  rb.geo.attributes.position.needsUpdate = true;
  if (rb.std) rb.geo.computeVertexNormals();
}

function buildEdge(color, opacity) {
  const pos = new Float32Array(COLS * 2 * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const line = new THREE.LineSegments(geo,
    new THREE.LineBasicMaterial({ color, transparent: true, opacity, toneMapped: false }));
  line.frustumCulled = false;
  line.renderOrder = 5;
  scene.add(line);
  return { geo, pos, line, material: line.material };
}
function fillEdgeFromArray(ed, Y, Ok, z) {
  let n = 0;
  for (let i = 0; i < COLS; i++) {
    if (!Ok[i] || !Ok[i + 1]) continue;
    const o = n * 6;
    ed.pos[o]     = xs[i];     ed.pos[o + 1] = clamp(Y[i], CL_LO, CL_HI);     ed.pos[o + 2] = z;
    ed.pos[o + 3] = xs[i + 1]; ed.pos[o + 4] = clamp(Y[i + 1], CL_LO, CL_HI); ed.pos[o + 5] = z;
    n++;
  }
  ed.geo.attributes.position.needsUpdate = true;
  ed.geo.setDrawRange(0, n * 2);
}

/* ================= 采样(每帧一次,f 与 P 共用) ================= */
const fY = new Float32Array(COLS + 1), pY = new Float32Array(COLS + 1);
const fFin = new Uint8Array(COLS + 1), fVis = new Uint8Array(COLS + 1);
function computeCurves(P) {
  maxErr = 0;
  for (let i = 0; i <= COLS; i++) {
    const x = xs[i];
    const yf = F.f(x);
    const fin = Number.isFinite(yf);
    fFin[i] = fin ? 1 : 0;
    fVis[i] = fin && yf > YMIN - 2 && yf < YMAX + 2 ? 1 : 0;
    fY[i] = fin ? yf : 0;
    const yp = P(x);
    pY[i] = yp;
    if (fin) { const e = Math.abs(yf - yp); if (e > maxErr) maxErr = e; }
  }
}

  () => { const R = F.R(x0); return isFinite(R) && XMAX - (x0 + R) > 0.6; });
const singLbl = addLabel(() => L('奇点 x = −1(对数在这里炸,多项式永远学不会)',
  'singularity x = −1 — the log blows up here; no polynomial can learn it'),
  new THREE.Vector3(), 'r', () => {
    const R = F.R(x0);
    if (!isFinite(R)) return false;
    const xL = x0 - R;
    return xL > XMIN && xL < XMAX;
  });
let lastA0 = 0, lastPR = 0, lastPL = 0;
const flyR = addLabel(() => `P${sub(N)}(${XMAX.toFixed(1)}) ≈ ${fmt(lastPR)} ${lastPR > 0 ? '↗ 飞出' : '↘ 飞出'}`,
  new THREE.Vector3(), 'o', () => F === FUNCS.ln && (lastPR > YMAX || lastPR < YMIN), true);
const flyL = addLabel(() => `P${sub(N)}(${XMIN.toFixed(1)}) ≈ ${fmt(lastPL)} ${lastPL > 0 ? '↗ 飞出' : '↘ 飞出'}`,
  new THREE.Vector3(), 'o', () => F === FUNCS.ln && (lastPL > YMAX || lastPL < YMIN), true);

/* ================= 相位讲解(5 步,可点击跳转) ================= */
const STEPS = [
  { b: '一点相切', be: 'One tangent point',
    d: 'P₀ 只记得高度 f(x₀)——一条水平线;P₁ 就是切线,在 x₀ 附近贴着 f 走一小段。',
    de: 'P₀ only remembers the height f(x₀) — a flat line; P₁ is the tangent, hugging f briefly around x₀.',
    j: { n: 1 } },
  { b: '逐阶长出弯曲', be: 'Curvature, order by order',
    d: '配方:第 k 项 = f⁽ᵏ⁾(x₀)/k!·(x−x₀)ᵏ——它保证 Pₙ 在 x₀ 处 0…N 阶导数与 f 全部对上;每加一阶,贴合区间变宽。',
    de: 'Term k = f⁽ᵏ⁾(x₀)/k!·(x−x₀)ᵏ — this forces derivatives 0…N to match f at x₀; each order widens the fit.',
    j: { n: 3 } },
  { b: '误差带收缩', be: 'The error band collapses',
    d: '阴影 = |f−Pₙ|:N 每加一阶,误差按 (x−x₀) 的 N+1 次幂收紧——离 x₀ 越近收得越快。',
    de: 'The shaded band is |f−Pₙ|: each extra order squeezes it by (x−x₀)ᴺ⁺¹ — fastest right around x₀.',
    j: { n: 7 } },
  { b: 'sin / eˣ:全局收敛', be: 'sin / eˣ: converge everywhere',
    d: '正弦与指数处处解析,R = ∞——N 拉到 12,整个画面蓝橙几乎重合,误差带整条变绿。',
    de: 'Sine and exponential are analytic everywhere, R = ∞ — at N = 12 blue and orange overlap across the view.',
    j: { f: 'sin', n: 12 } },
  { b: 'ln(1+x):收敛半径', be: 'ln(1+x): a finite radius',
    d: '对数在 x = −1 有奇点,收敛半径 R = x₀+1:圈内重合,一出去多项式飞走;拖动 x₀,「信任圈」跟着搬家。',
    de: 'The log has a singularity at x = −1, so R = x₀+1: overlap inside, fly-away outside; drag x₀ and the circle follows.',
    j: { f: 'ln', x0: 0, n: 12 } },
];
function stepIndex() {
  if (F === FUNCS.ln) return 4;
  if (N >= 10) return 3;
  if (N >= 5) return 2;
  if (N >= 2) return 1;
  return 0;
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elOrd = document.getElementById('ord');
const elOrdVal = document.getElementById('ordVal');
const elProg = document.getElementById('prog');
const elProgVal = document.getElementById('progVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglBand = document.getElementById('tglBand');
const tglTan = document.getElementById('tglTan');
const tglRotate = document.getElementById('tglRotate');
const stX = document.getElementById('stX'), stN = document.getElementById('stN');
const stE = document.getElementById('stE'), stR = document.getElementById('stR');
const formulaEl = document.getElementById('formula');
const btns = { sin: document.getElementById('fSin'), cos: document.getElementById('fCos'),
  exp: document.getElementById('fExp'), ln: document.getElementById('fLn') };

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => {
      if (s.j.f) setFunc(s.j.f);
      if (s.j.x0 !== undefined) x0 = s.j.x0;
      if (s.j.n !== undefined) { Nf = s.j.n; holdT = 0; }
      syncInputs();
    });
    elSteps.appendChild(li);
  });
}
function setFunc(key) {
  funcKey = key;
  F = FUNCS[key];
  Object.entries(btns).forEach(([k, b]) => b.classList.toggle('on', k === key));
  if (F === FUNCS.ln && x0 < -0.85) x0 = 0;
  syncInputs();
}
function syncInputs() { elOrd.value = N; elProg.value = Math.min(Nf, 12); }
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function updateStats() {
  stX.textContent = x0.toFixed(2);
  stN.textContent = N;
  stE.textContent = fmt(maxErr);
  stE.style.color = maxErr < 0.05 ? '#5ec97c' : maxErr < 1 ? '#ffb35c' : '#ff8a80';
  const R = F.R(x0);
  stR.textContent = isFinite(R) ? R.toFixed(2) : '∞';
  stR.style.color = isFinite(R) ? '#ff8a80' : '#5ec97c';
}
function updateFormula() {
  const rows = Math.min(N, 6);
  let html = `<b>${L(`在 x₀ = ${x0.toFixed(2)} 处:0…${N} 阶导数「全部对上」`,
    `at x₀ = ${x0.toFixed(2)}: derivatives 0…${N} all match`)}</b>`;
  for (let k = 0; k <= rows; k++) {
    const dk = F.d(k, x0);
    html += `<br>k = ${k}　f⁽ᵏ⁾(x₀) = <b>${fmt(dk)}</b>　aₖ = <b>${fmt(dk / FACT[k])}</b>`;
  }
  if (N > 6) html += '<br>…';
  formulaEl.innerHTML = html;
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elOrd.addEventListener('input', () => { Nf = parseInt(elOrd.value, 10); holdT = 0; });
elProg.addEventListener('input', () => { Nf = parseFloat(elProg.value); holdT = 0; });
let slHeld = false;
[elOrd, elProg].forEach(el => el.addEventListener('pointerdown', () => { slHeld = true; }));
addEventListener('pointerup', () => { slHeld = false; });
btns.sin.addEventListener('click', () => setFunc('sin'));
btns.cos.addEventListener('click', () => setFunc('cos'));
btns.exp.addEventListener('click', () => setFunc('exp'));
btns.ln.addEventListener('click', () => setFunc('ln'));
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; labelsOn = showLabels; refreshLabels(); });
tglBand.addEventListener('change', () => { showBand = tglBand.checked; });
tglTan.addEventListener('change', () => { showTan = tglTan.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });

/* x₀ 拖动:raycast 命中黄点/竖直虚线后,在坐标墙平面内跟随 */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const hitPt = new THREE.Vector3();
let dragging = false;
function setRay(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}
renderer.domElement.addEventListener('pointerdown', e => {
  setRay(e);
  if (raycaster.intersectObjects([hitSphere, hitCyl], false).length) {
    dragging = true;
    controls.enabled = false;
    renderer.domElement.setPointerCapture(e.pointerId);
    renderer.domElement.style.cursor = 'grabbing';
    e.stopImmediatePropagation();
  }
}, true);
renderer.domElement.addEventListener('pointermove', e => {
  setRay(e);
  if (dragging) {
    if (raycaster.ray.intersectPlane(dragPlane, hitPt))
      x0 = clamp(hitPt.x, F === FUNCS.ln ? -0.85 : -3.6, 3.6);
  } else {
    renderer.domElement.style.cursor =
      raycaster.intersectObjects([hitSphere, hitCyl], false).length ? 'grab' : '';
  }
});
addEventListener('pointerup', () => {
  if (dragging) { dragging = false; controls.enabled = true; renderer.domElement.style.cursor = ''; }
});
addEventListener('pointercancel', () => {
  if (dragging) { dragging = false; controls.enabled = true; renderer.domElement.style.cursor = ''; }
});

addEventListener('keydown', e => {
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'BUTTON')) return;
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
  if (e.code === 'ArrowLeft') { x0 = clamp(x0 - 0.1, F === FUNCS.ln ? -0.85 : -3.6, 3.6); }
  if (e.code === 'ArrowRight') { x0 = clamp(x0 + 0.1, F === FUNCS.ln ? -0.85 : -3.6, 3.6); }
  if (e.code === 'ArrowUp') { Nf = clamp(Math.floor(Nf) + 1, 0, 12); holdT = 0; syncInputs(); e.preventDefault(); }
  if (e.code === 'ArrowDown') { Nf = clamp(Math.floor(Nf) - 1, 0, 12); holdT = 0; syncInputs(); e.preventDefault(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环(页面隐藏时自动停 rAF) ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaKey = '';
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing && !slHeld && !dragging) {
    if (Nf < 12) { Nf = Math.min(12, Nf + dt * speed * 1.6); holdT = 0; }
    else { holdT += dt; if (holdT > 1.3) { Nf = 0; holdT = 0; } }
  }
  N = Math.min(12, Math.floor(Nf + 1e-9));
  const A = coeffs();
  const P = makePN(A, N);
  lastA0 = A[0];
  lastPR = P(XMAX); lastPL = P(XMIN);
  computeCurves(P);
  fillRibbonFromArray(fRb, fY, fVis);
  fillEdgeFromArray(fEdge, fY, fVis, Z_F + 0.02);
  fillRibbonFromArray(pRb, pY, allOk);
  fillEdgeFromArray(pEdge, pY, allOk, Z_P + 0.02);
  updateGhosts(A);
  updateBand();
  updateTangent(A);
  updateX0Visuals();
  updateConv();
  tanLbl.o.position.set(clamp(x0 + 0.55, XMIN + 0.3, XMAX - 0.3),
    clamp(lastA0 + 0.36, YMIN + 0.25, YMAX - 0.1), Z_TAN + 0.06);
  flyR.o.position.set(XMAX - 0.62, lastPR > 0 ? YMAX + 0.42 : YMIN - 0.45, 0.4);
  flyL.o.position.set(XMIN + 0.62, lastPL > 0 ? YMAX + 0.42 : YMIN - 0.45, 0.4);
  elOrdVal.textContent = N;
  elProgVal.textContent = N + '/12';
  if (!slHeld) syncInputs();
  updateStats();
  const fk = funcKey + '|' + x0.toFixed(3) + '|' + N + '|' + LANG;
  if (fk !== formulaKey) { formulaKey = fk; updateFormula(); }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  refreshLabels();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
speed = clamp(qsFloat('speed', 1), 0.2, 3);
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
if (qs.get('t') !== null) Nf = clamp(qsFloat('t', 0), 0, 12);
if (qs.get('n') !== null) Nf = clamp(qsFloat('n', 0), 0, 12);
x0 = clamp(qsFloat('x0', 0), -3.6, 3.6);
const fq = qs.get('f');
if (fq && FUNCS[fq]) setFunc(fq); else setFunc('sin');
N = Math.min(12, Math.floor(Nf + 1e-9));
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
if (!qsBool('band', true)) { tglBand.checked = false; showBand = false; }
labelsOn = showLabels;
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
playing = qs.get('pause') === null
  ? !matchMedia('(prefers-reduced-motion: reduce)').matches
  : !qsBool('pause', false);
applyTheme();
applyLang();
syncInputs();
setPlayLabel();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
