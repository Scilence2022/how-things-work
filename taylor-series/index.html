<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泰勒展开 · 一点相切,逐段重合</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; touch-action: none; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.f { color: #9fd9f9; border-color: rgba(127,208,247,.7); }
  .chip.t { color: #ffc78f; border-color: rgba(255,179,92,.7); }
  .chip.e { color: #ffaaa2; border-color: rgba(255,138,128,.7); }
  .chip.x { color: #ffe29a; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.f { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.t { color: #b26214; border-color: rgba(178,98,20,.7); }
  :root[data-theme="light"] .chip.e { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.x { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  #funcRow { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  #funcRow .brl { font-size: 12px; color: var(--text2); }
  .bon { appearance: none; font: inherit; cursor: pointer;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(76,201,240,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(21,128,163,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 58px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="泰勒展开:一点相切,逐段重合" data-en="Taylor series: tangent at a point, overlap everywhere">泰勒展开:一点相切,逐段重合</h1>
  <div class="sub" data-zh="在 x₀ 处逐阶仿造函数:多项式从切线长成整条曲线,误差带 |f−Pₙ| 随 N 收缩;sin/eˣ 全局收敛,ln(1+x) 一出收敛圈就飞走 · 拖黄点换 x₀ · 空格播放/暂停" data-en="Rebuild f order by order at x₀: the polynomial grows from a tangent into the whole curve, the error band |f−Pₙ| shrinks with N; sin/eˣ converge everywhere, ln(1+x) flies off past its convergence circle · drag the yellow dot · Space = play/pause">在 x₀ 处逐阶仿造函数:多项式从切线长成整条曲线,误差带 |f−Pₙ| 随 N 收缩;sin/eˣ 全局收敛,ln(1+x) 一出收敛圈就飞走 · 拖黄点换 x₀ · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="展开点 x₀" data-en="expansion point x₀">展开点 x₀</span><span class="v" id="stX">0.00</span>
  <span class="k" data-zh="阶数 N" data-en="order N">阶数 N</span><span class="v" id="stN">3</span>
  <span class="k" data-zh="窗口最大误差 |f−Pₙ|" data-en="max error in view |f−Pₙ|">窗口最大误差 |f−Pₙ|</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="收敛半径 R" data-en="convergence radius R">收敛半径 R</span><span class="v" id="stR">∞</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip f" data-zh="真函数 f(x)" data-en="true function f(x)">真函数 f(x)</span>
    <span class="chip t" data-zh="泰勒多项式 Pₙ" data-en="Taylor polynomial Pₙ">泰勒多项式 Pₙ</span>
    <span class="chip e" data-zh="误差带 |f−Pₙ|" data-en="error band |f−Pₙ|">误差带 |f−Pₙ|</span>
    <span class="chip x" data-zh="x₀ 可拖" data-en="x₀ draggable">x₀ 可拖</span>
  </div>
  <div id="funcRow">
    <span class="brl" data-zh="函数：" data-en="Function:">函数：</span>
    <button id="fSin" class="bon on" data-zh="sin x" data-en="sin x">sin x</button>
    <button id="fCos" class="bon" data-zh="cos x" data-en="cos x">cos x</button>
    <button id="fExp" class="bon" data-zh="eˣ" data-en="eˣ">eˣ</button>
    <button id="fLn" class="bon" data-zh="ln(1+x)" data-en="ln(1+x)">ln(1+x)</button>
  </div>
  <div class="row"><label data-zh="阶数 N" data-en="Order N">阶数 N</label><input id="ord" type="range" min="0" max="12" step="1" value="3"><span class="val" id="ordVal">3</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="进度 = 阶数 N" data-en="Progress = order N">进度 = 阶数 N</label><input id="prog" type="range" min="0" max="12" step="0.01" value="3"><span class="val" id="progVal">3/12</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglBand" type="checkbox" checked> <span data-zh="误差带" data-en="Error band">误差带</span></label>
    <label><input id="tglTan" type="checkbox" checked> <span data-zh="切线对比(P₁ 虚线)" data-en="tangent ghost (P₁ dashed)">切线对比(P₁ 虚线)</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../fourier-series/" data-zh="对照:傅里叶——全局三角基" data-en="contrast: Fourier — global trig basis">对照:傅里叶——全局三角基</a>
    <a href="../neural-gradient/" data-zh="延伸:梯度下降只用一、二阶" data-en="related: gradient descent uses 1st/2nd order only">延伸:梯度下降只用一、二阶</a>
    <a href="../standing-waves/" data-zh="同族:泛音也是基函数配方" data-en="same family: harmonics as basis recipes">同族:泛音也是基函数配方</a>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('泰勒展开 · 一点相切,逐段重合', 'Taylor Series · Tangent at a Point, Overlap Everywhere');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
const SUPD = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻' };
const SUBD = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
const sup = n => String(n).split('').map(c => SUPD[c] || c).join('');
const sub = n => String(n).split('').map(c => SUBD[c] || c).join('');
function fmt(v) {
  if (!isFinite(v)) return v > 0 ? '∞' : '−∞';
  const s = v < 0 ? '−' : '', a = Math.abs(v);
  if (a >= 1e5) { const e = Math.floor(Math.log10(a)); return s + (a / 10 ** e).toFixed(1) + '×10' + sup(e); }
  if (a >= 100) return s + a.toFixed(0);
  if (a >= 1) return s + a.toFixed(2);
  if (a < 0.001 && a > 0) return s + a.toExponential(0);
  return s + a.toFixed(3);
}

/* ================= 数学核心：四个函数的精确各阶导数 ================= */
const FACT = [1, 1, 2, 6, 24, 120, 720, 5040, 40320, 362880, 3628800, 39916800, 479001600];
const FUNCS = {
  sin: { f: x => Math.sin(x),
         d: (k, x0) => Math.sin(x0 + k * Math.PI / 2),
         R: () => Infinity },
  cos: { f: x => Math.cos(x),
         d: (k, x0) => Math.cos(x0 + k * Math.PI / 2),
         R: () => Infinity },
  exp: { f: x => Math.exp(x),
         d: (k, x0) => Math.exp(x0),
         R: () => Infinity },
  ln:  { f: x => x > -1 ? Math.log(1 + x) : NaN,
         d: (k, x0) => k === 0 ? Math.log(1 + x0)
             : (k % 2 === 1 ? 1 : -1) * FACT[k - 1] / Math.pow(1 + x0, k),
         R: x0 => x0 + 1 },
};
let F = FUNCS.sin;
let x0 = 0, Nf = 3, N = 3;
let playing = true, speed = 1, holdT = 0;
let showLabels = true, showBand = true, showTan = true;

/* 系数 aₖ = f⁽ᵏ⁾(x₀)/k!，Horner 求值 Pₙ(x) */
function coeffs() {
  const A = [];
  for (let k = 0; k <= 12; k++) A.push(F.d(k, x0) / FACT[k]);
  return A;
}
function makePN(A) {
  return x => { const dx = x - x0; let s = 0;
    for (let k = 12; k >= 0; k--) s = s * dx + A[k];
    return s; };
}

/* ================= 状态 ================= */
let maxErr = 0;
const XMIN = -4.4, XMAX = 4.4, YMIN = -2.6, YMAX = 4.6;
const AX0 = 80, AX1 = 1540, AY0 = 150, AY1 = 800;
const px = x => AX0 + (x - XMIN) / (XMAX - XMIN) * (AX1 - AX0);
const py = y => AY1 - (y - YMIN) / (YMAX - YMIN) * (AY1 - AY0);

/* ================= 相位讲解（5 步，可点击跳转） ================= */
const STEPS = [
  { b: '一点相切', be: 'One tangent point',
    d: 'P₀ 只记得高度 f(x₀)——一条水平线;P₁ 就是切线,在 x₀ 附近贴着 f 走一小段。',
    de: 'P₀ only remembers the height f(x₀) — a flat line; P₁ is the tangent, hugging f briefly around x₀.',
    j: { n: 1 } },
  { b: '逐阶长出弯曲', be: 'Curvature, order by order',
    d: '配方:第 k 项 = f⁽ᵏ⁾(x₀)/k!·(x−x₀)ᵏ——它保证 Pₙ 在 x₀ 处 0…N 阶导数与 f 全部对上;每加一阶,贴合区间变宽。',
    de: 'Term k = f⁽ᵏ⁾(x₀)/k!·(x−x₀)ᵏ — this forces derivatives 0…N to match f at x₀; each order widens the fit.',
    j: { n: 3 } },
  { b: '误差带收缩', be: 'The error band collapses',
    d: '阴影 = |f−Pₙ|:N 每加一阶,误差按 (x−x₀) 的 N+1 次幂收紧——离 x₀ 越近收得越快。',
    de: 'The shaded band is |f−Pₙ|: each extra order squeezes it by (x−x₀)ᴺ⁺¹ — fastest right around x₀.',
    j: { n: 7 } },
  { b: 'sin / eˣ:全局收敛', be: 'sin / eˣ: converge everywhere',
    d: '正弦与指数处处解析,R = ∞——N 拉到 12,整个画面蓝橙几乎重合,误差带整条变绿。',
    de: 'Sine and exponential are analytic everywhere, R = ∞ — at N = 12 blue and orange overlap across the view.',
    j: { f: 'sin', n: 12 } },
  { b: 'ln(1+x):收敛半径', be: 'ln(1+x): a finite radius',
    d: '对数在 x = −1 有奇点,收敛半径 R = x₀+1:圈内重合,一出去多项式飞走;拖动 x₀,「信任圈」跟着搬家。',
    de: 'The log has a singularity at x = −1, so R = x₀+1: overlap inside, fly-away outside; drag x₀ and the circle follows.',
    j: { f: 'ln', x0: 0, n: 12 } },
];
function stepIndex() {
  if (F === FUNCS.ln) return 4;
  if (N >= 10) return 3;
  if (N >= 5) return 2;
  if (N >= 2) return 1;
  return 0;
}

/* ================= 绘制 ================= */
function drawGrid() {
  for (let gx = Math.ceil(XMIN); gx <= XMAX; gx++) {
    line(px(gx), AY0, px(gx), AY1, gx === 0 ? PAL.axis : PAL.grid, gx === 0 ? 1.5 : 1);
    text(String(gx), px(gx), py(0) + 24, 11.5, PAL.dim2, 'center');
  }
  for (let gy = Math.ceil(YMIN); gy <= YMAX; gy++) {
    if (gy === 0) continue;
    line(AX0, py(gy), AX1, py(gy), PAL.grid, 1);
    text(String(gy), AX0 - 10, py(gy) + 4, 11.5, PAL.dim2, 'right');
  }
  line(AX0, py(0), AX1, py(0), PAL.axis, 1.5);
}
function drawConvergence() {
  const R = F.R(x0);
  const yB = py(0) + 64;
  if (!isFinite(R)) {
    line(AX0, yB, AX1, yB, 'rgba(94,201,124,.85)', 5);
    text(L('全实轴收敛 R = ∞(处处解析,没有坏点)', 'converges on all of ℝ (R = ∞ — no bad points)'),
      (AX0 + AX1) / 2, yB + 20, 12.5, '#5ec97c', 'center', 600);
  } else {
    const xL = x0 - R, xR = x0 + R;
    const pxl = Math.max(AX0, px(xL)), pxr = Math.min(AX1, px(xR));
    if (pxl - AX0 > 4) line(AX0, yB, pxl, yB, 'rgba(228,106,106,.8)', 5);
    if (AX1 - pxr > 4) line(pxr, yB, AX1, yB, 'rgba(228,106,106,.8)', 5);
    line(pxl, yB, pxr, yB, 'rgba(94,201,124,.85)', 5);
    text(L(`收敛圈 |x−x₀| < R = ${R.toFixed(2)}`, `converges for |x−x₀| < R = ${R.toFixed(2)}`),
      (pxl + pxr) / 2, yB + 22, 12.5, '#5ec97c', 'center', 600);
    if (pxl - AX0 > 80) text(L('发散', 'diverges'), (AX0 + pxl) / 2, yB + 22, 12, '#e46a6a', 'center', 600);
    if (AX1 - pxr > 80) text(L('发散', 'diverges'), (pxr + AX1) / 2, yB + 22, 12, '#e46a6a', 'center', 600);
    if (xL < XMAX && xL > XMIN) {
      line(px(xL), AY0, px(xL), AY1, 'rgba(255,138,128,.5)', 1.5, [6, 6]);
      text(L('奇点 x = −1(对数在这里炸,多项式永远学不会)', 'singularity x = −1 — the log blows up here; no polynomial can learn it'),
        px(xL) + 10, AY0 + 18, 12, '#ff8a80', 'left', 600);
    }
  }
}
function errColor(e) {
  const t = clamp((Math.log10(e + 1e-9) + 2) / (Math.log10(20) + 2), 0, 1);
  return `hsla(${145 - 137 * t},72%,50%,${0.14 + 0.12 * t})`;
}
function drawCurves() {
  const A = coeffs(), P = makePN(A);
  const cols = 730, stepX = (XMAX - XMIN) / cols, wp = 2;
  maxErr = 0;
  if (showBand) {
    for (let i = 0; i <= cols; i++) {
      const x = XMIN + i * stepX;
      const yf = F.f(x);
      if (isNaN(yf)) continue;
      const yp = P(x);
      const e = Math.abs(yf - yp);
      if (e > maxErr) maxErr = e;
      const y1 = clamp(yf, YMIN - 0.5, YMAX + 0.5), y2 = clamp(yp, YMIN - 0.5, YMAX + 0.5);
      const sx = px(x) - wp / 2;
      ctx.fillStyle = errColor(e);
      ctx.fillRect(sx, py(Math.max(y1, y2)), wp, Math.max(Math.abs(py(y1) - py(y2)), 1));
    }
  } else {
    for (let i = 0; i <= cols; i++) {
      const x = XMIN + i * stepX, yf = F.f(x);
      if (isNaN(yf)) continue;
      const e = Math.abs(yf - P(x));
      if (e > maxErr) maxErr = e;
    }
  }
  if (showTan && N >= 2) {
    ctx.strokeStyle = 'rgba(199,213,229,.55)'; ctx.lineWidth = 1.4; ctx.setLineDash([5, 6]);
    ctx.beginPath();
    for (let i = 0; i <= cols; i++) {
      const x = XMIN + i * stepX, y = clamp(A[0] + A[1] * (x - x0), YMIN - 1, YMAX + 1);
      i ? ctx.lineTo(px(x), py(y)) : ctx.moveTo(px(x), py(y));
    }
    ctx.stroke(); ctx.setLineDash([]);
    if (showLabels) text(L('P₁ 切线', 'P₁ tangent'), px(x0) + 14, py(A[0]) - 10, 11.5, PAL.dim2);
  }
  ctx.strokeStyle = '#7fd0f7'; ctx.lineWidth = 2.6;
  ctx.beginPath();
  let pen = false;
  for (let i = 0; i <= cols; i++) {
    const x = XMIN + i * stepX, yf = F.f(x);
    if (isNaN(yf) || yf < YMIN - 2 || yf > YMAX + 2) { pen = false; continue; }
    pen ? ctx.lineTo(px(x), py(yf)) : ctx.moveTo(px(x), py(yf)); pen = true;
  }
  ctx.stroke();
  ctx.strokeStyle = '#ffb35c'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (let i = 0; i <= cols; i++) {
    const x = XMIN + i * stepX;
    const y = clamp(P(x), YMIN - 30, YMAX + 30);
    i ? ctx.lineTo(px(x), py(y)) : ctx.moveTo(px(x), py(y));
  }
  ctx.stroke();
  if (showLabels && F === FUNCS.ln) {
    const pR = P(XMAX), pL = P(XMIN);
    const yMid = py(0) - 16;
    if (pR > YMAX || pR < YMIN)
      text(`P${sub(N)}(${XMAX.toFixed(1)}) ≈ ${fmt(pR)} ${pR > 0 ? '↗ 飞出' : '↘ 飞出'}`,
        AX1 - 12, yMid, 12.5, '#ffb35c', 'right', 700);
    if (pL > YMAX || pL < YMIN)
      text(`P${sub(N)}(${XMIN.toFixed(1)}) ≈ ${fmt(pL)} ${pL > 0 ? '↗ 飞出' : '↘ 飞出'}`,
        AX0 + 12, yMid, 12.5, '#ffb35c', 'left', 700);
  }
}
function drawX0() {
  const X = px(x0), Yf = F.f(x0);
  line(X, AY1, X, py(clamp(Yf, YMIN, YMAX)), 'rgba(255,209,102,.55)', 1.6, [5, 5]);
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(X, py(0), 10, 0, Math.PI * 2); ctx.fillStyle = '#ffd166'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(X, py(0), 3.5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();
  ctx.beginPath(); ctx.arc(X, py(clamp(Yf, YMIN, YMAX)), 5, 0, Math.PI * 2); ctx.fillStyle = '#ffd166'; ctx.fill();
  if (showLabels) text(`x₀ = ${x0.toFixed(2)} (${L('拖我', 'drag')})`, X, py(0) + 46, 12.5, '#ffd166', 'center', 700);
}
function drawFormulaTable() {
  if (!showLabels || innerWidth < 1000) return;
  text(L('Pₙ(x) = f(x₀) + f′(x₀)·Δx + f″(x₀)·Δx²/2! + … + f⁽ⁿ⁾(x₀)·Δxⁿ/n!    (Δx = x−x₀)',
         'Pₙ(x) = f(x₀) + f′(x₀)·Δx + f″(x₀)·Δx²/2! + … + f⁽ⁿ⁾(x₀)·Δxⁿ/n!    (Δx = x−x₀)'),
    (AX0 + AX1) / 2, 126, 14.5, PAL.text, 'center', 600);
  const rows = Math.min(N, 6);
  const tx = 1178, tw = 352, ty = 148;
  const th = 58 + (rows + 1 + (N > 6 ? 1 : 0)) * 22;
  ctx.fillStyle = PAL.pill; ctx.fillRect(tx, ty, tw, th);
  ctx.strokeStyle = 'rgba(128,140,155,.25)'; ctx.lineWidth = 1; ctx.strokeRect(tx, ty, tw, th);
  text(L(`在 x₀ = ${x0.toFixed(2)} 处:0…${N} 阶导数「全部对上」`,
         `at x₀ = ${x0.toFixed(2)}: derivatives 0…${N} all match`),
    tx + tw / 2, ty + 24, 12.5, '#ffd166', 'center', 700);
  const cx1 = tx + 16, cx2 = tx + 78, cx3 = tx + 196;
  text('k', cx1, ty + 48, 12, PAL.dim2);
  text(L('f⁽ᵏ⁾(x₀)', 'f⁽ᵏ⁾(x₀)'), cx2, ty + 48, 12, PAL.dim2);
  text(L('aₖ = f⁽ᵏ⁾/k!', 'aₖ = f⁽ᵏ⁾/k!'), cx3, ty + 48, 12, PAL.dim2);
  for (let k = 0; k <= rows; k++) {
    const y = ty + 70 + k * 22;
    const dk = F.d(k, x0);
    text(String(k), cx1, y, 12.5, PAL.text, 'left', 600);
    text(fmt(dk), cx2, y, 12.5, '#7fd0f7');
    text(fmt(dk / FACT[k]), cx3, y, 12.5, '#ffb35c');
  }
  if (N > 6) text('…', cx1, ty + 70 + 7 * 22, 12.5, PAL.dim2);
}
function draw() {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawGrid();
  drawConvergence();
  drawCurves();
  drawX0();
  drawFormulaTable();
}

/* ================= UI / 主循环 ================= */
let last = performance.now();
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elOrd = document.getElementById('ord');
const elOrdVal = document.getElementById('ordVal');
const elProg = document.getElementById('prog');
const elProgVal = document.getElementById('progVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglBand = document.getElementById('tglBand');
const tglTan = document.getElementById('tglTan');
const stX = document.getElementById('stX'), stN = document.getElementById('stN');
const stE = document.getElementById('stE'), stR = document.getElementById('stR');
const btns = { sin: document.getElementById('fSin'), cos: document.getElementById('fCos'),
  exp: document.getElementById('fExp'), ln: document.getElementById('fLn') };

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => {
      if (s.j.f) setFunc(s.j.f);
      if (s.j.x0 !== undefined) x0 = s.j.x0;
      if (s.j.n !== undefined) { Nf = s.j.n; holdT = 0; }
      syncInputs();
    });
    elSteps.appendChild(li);
  });
}
function setFunc(key) {
  F = FUNCS[key];
  Object.entries(btns).forEach(([k, b]) => b.classList.toggle('on', k === key));
  if (F === FUNCS.ln && x0 < -0.85) x0 = 0;
  syncInputs();
}
function syncInputs() { elOrd.value = N; elProg.value = Math.min(Nf, 12); }
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elOrd.addEventListener('input', () => { Nf = parseInt(elOrd.value, 10); holdT = 0; });
elProg.addEventListener('input', () => { Nf = parseFloat(elProg.value); holdT = 0; });
let slHeld = false;
[elOrd, elProg].forEach(el => el.addEventListener('pointerdown', () => { slHeld = true; }));
addEventListener('pointerup', () => { slHeld = false; });
btns.sin.addEventListener('click', () => setFunc('sin'));
btns.cos.addEventListener('click', () => setFunc('cos'));
btns.exp.addEventListener('click', () => setFunc('exp'));
btns.ln.addEventListener('click', () => setFunc('ln'));
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglBand.addEventListener('change', () => { showBand = tglBand.checked; });
tglTan.addEventListener('change', () => { showTan = tglTan.checked; });

/* x₀ 拖动(黄点或其竖直虚线) */
let dragging = false;
function evX(e) { return (e.clientX - vox) / vs; }
function hitX0(e) {
  const mx = evX(e), my = (e.clientY - voy) / vs;
  const d = Math.hypot(mx - px(x0), my - py(0));
  return d < 36 || (Math.abs(mx - px(x0)) < 18 && my > AY0 && my < AY1);
}
cv.addEventListener('pointerdown', e => {
  if (hitX0(e)) {
    dragging = true; cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
  }
});
cv.addEventListener('pointermove', e => {
  if (dragging) {
    const lo = F === FUNCS.ln ? -0.85 : -3.6;
    x0 = clamp(XMIN + (evX(e) - AX0) / (AX1 - AX0) * (XMAX - XMIN), lo, 3.6);
  } else {
    cv.style.cursor = hitX0(e) ? 'grab' : 'default';
  }
});
addEventListener('pointerup', () => { dragging = false; cv.style.cursor = 'default'; });

addEventListener('keydown', e => {
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'BUTTON')) return;
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
  if (e.code === 'ArrowLeft') { x0 = clamp(x0 - 0.1, F === FUNCS.ln ? -0.85 : -3.6, 3.6); }
  if (e.code === 'ArrowRight') { x0 = clamp(x0 + 0.1, F === FUNCS.ln ? -0.85 : -3.6, 3.6); }
  if (e.code === 'ArrowUp') { Nf = clamp(Math.floor(Nf) + 1, 0, 12); holdT = 0; syncInputs(); e.preventDefault(); }
  if (e.code === 'ArrowDown') { Nf = clamp(Math.floor(Nf) - 1, 0, 12); holdT = 0; syncInputs(); e.preventDefault(); }
});

function updateStats() {
  stX.textContent = x0.toFixed(2);
  stN.textContent = N;
  stE.textContent = fmt(maxErr);
  stE.style.color = maxErr < 0.05 ? '#5ec97c' : maxErr < 1 ? '#ffb35c' : '#ff8a80';
  const R = F.R(x0);
  stR.textContent = isFinite(R) ? R.toFixed(2) : '∞';
  stR.style.color = isFinite(R) ? '#ff8a80' : '#5ec97c';
}

/* ================= 主循环(页面隐藏时自动停 rAF) ================= */
let raf = null, lastT = 0, lastStep = -1;
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = clamp((now - lastT) / 1000, 0, 0.05); lastT = now;
  if (playing && !slHeld && !dragging) {
    if (Nf < 12) { Nf = Math.min(12, Nf + dt * speed * 1.6); holdT = 0; }
    else { holdT += dt; if (holdT > 1.3) { Nf = 0; holdT = 0; } }
  }
  N = Math.min(12, Math.floor(Nf + 1e-9));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw();
  updateStats();
  elOrdVal.textContent = N;
  elProgVal.textContent = N + '/12';
  if (!slHeld) syncInputs();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
}
function start() { if (raf === null && !document.hidden) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
speed = clamp(parseFloat(qs.get('speed')) || 1, 0.2, 3);
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
if (qs.get('t') !== null) Nf = clamp(parseFloat(qs.get('t')) || 0, 0, 12);
if (qs.get('n') !== null) Nf = clamp(parseFloat(qs.get('n')) || 0, 0, 12);
x0 = clamp(parseFloat(qs.get('x0')) || 0, -3.6, 3.6);
const fq = qs.get('f');
if (fq && FUNCS[fq]) setFunc(fq); else setFunc('sin');
N = Math.min(12, Math.floor(Nf + 1e-9));
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
if (!qsBool('band', true)) { tglBand.checked = false; showBand = false; }
playing = qs.get('pause') === null
  ? !matchMedia('(prefers-reduced-motion: reduce)').matches
  : !qsBool('pause', false);
applyTheme();
applyLang();
syncInputs();
setPlayLabel();
start();
</script>
</body>
</html>
