<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">

<title>预混火焰 · 蓝锥与黄焰的分界</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);

    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,169,77,.6); background: rgba(255,169,77,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(232,89,12,.55); background: rgba(232,89,12,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="预混火焰 · 蓝锥与黄焰的分界" data-en="The Premixed Flame · Blue Cone vs Yellow Flame">预混火焰 · 蓝锥与黄焰的分界</h1>
  <div class="sub" data-zh="燃气从喷嘴高速射出,在收窄的文丘里喉部把一次空气卷吸进来,在混合管里预混成可燃气;流到火孔,当气流速度恰好等于火焰传播速度 S_L≈0.4 m/s,火焰便驻定成锥:内锥贫氧预热(淡蓝),外焰扩散补氧完全燃烧(亮蓝,~1900 °C);关小空气门,缺氧让碳氢裂解成碳烟微粒,按 T⁴ 黑体规律发出黄橙光,火焰变高变软、锅底积碳;气流慢过 S_L 火焰缩回管内即回火,快过约 2S_L 则被推离火孔即脱火——一切灶具设计,都在把工况按进 S_L 与 2S_L 之间的稳定窗口 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Gas jets from the nozzle and, at the venturi throat, entrains primary air through the intake ports; the premixed charge reaches the ports, and when flow speed equals the laminar flame speed S_L≈0.4 m/s the flame anchors as a cone: an inner preheat cone (pale blue) and an outer cone where diffusion air completes combustion (bright blue, ~1900 °C). Close the air door and oxygen starvation cracks the fuel into soot, glowing yellow-orange by T⁴ blackbody radiation — a tall, soft, fouling flame. Flow slower than S_L and the flame flashes back into the tube; faster than ~2S_L and it blows off the port. Every burner design lives inside the window between S_L and 2S_L · 3D interactive demo · drag to orbit · Space = run/pause">预混火焰 · 蓝锥与黄焰的分界</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="一次空气系数 α" data-en="Primary air α">一次空气系数 α</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="火焰温度" data-en="Flame temp">火焰温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v" id="stState">—</span>
  <span class="k" data-zh="碳烟指数" data-en="Soot index">碳烟指数</span><span class="v" id="stSoot">—</span>
  <span class="k" data-zh="气流速度 vs S_L" data-en="Flow vs S_L">气流速度 vs S_L</span><span class="v" id="stV">—</span>
</div>

<div id="plot">
  <h3 data-zh="气流速度–火焰速度图:回火区(v<S_L)/稳定区/脱火区(v>≈2S_L),动点为当前工况" data-en="Flow speed vs flame speed: flashback (v<S_L) / stable / blowoff (v>≈2S_L) zones; the dot is the current operating point">气流速度–火焰速度图:回火区(v<S_L)/稳定区/脱火区(v>≈2S_L),动点为当前工况</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="青/蓝流:燃气射流与一次空气" data-en="cyan/blue: gas jet & primary air">青/蓝流:燃气射流与一次空气</span>
    <span class="chip.g" data-zh="亮蓝外焰:补氧完全燃烧" data-en="bright blue: diffusion-finishing outer cone">亮蓝外焰:补氧完全燃烧</span>
    <span class="chip.o" data-zh="黄橙:碳烟黑体发光" data-en="yellow-orange: soot glowing blackbody">黄橙:碳烟黑体发光</span>
    <span class="chip.r" data-zh="红橙羽流:高温烟气" data-en="red plume: hot combustion gas">红橙羽流:高温烟气</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnIgnite" data-zh="点火" data-en="Ignite">点火</button>
    <button class="abtn brk" id="btnExt" data-zh="熄火" data-en="Extinguish">熄火</button>
    <button class="abtn" id="btnClean" data-zh="清积碳" data-en="Clean soot">清积碳</button>
  </div>
  <div class="row"><label data-zh="空气门(α)" data-en="Air door (α)">空气门(α)</label><input id="sAlpha" type="range" min="0" max="100" step="1" value="65"><span class="val" id="sAlphaVal">65 %</span></div>
  <div class="row"><label data-zh="燃气流量" data-en="Gas flow">燃气流量</label><input id="sFlow" type="range" min="0.15" max="1.2" step="0.01" value="0.55"><span class="val" id="sFlowVal">0.55 m/s</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="剖视(单孔特写)" data-en="Cutaway (one port)">剖视(单孔特写)</span></label>
      <label><input id="tglTemp" type="checkbox"> <span data-zh="温度着色" data-en="Temp colors">温度着色</span></label>
      <label><input id="tglSoot" type="checkbox" checked> <span data-zh="烟粒" data-en="Soot">烟粒</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../venturi-flow/" data-zh="文丘里:引射的物理" data-en="venturi: the physics of entrainment">文丘里:引射的物理</a>
    <a href="../oxyhydrogen-combustion/" data-zh="氢氧燃烧:爆燃的另一极端" data-en="oxyhydrogen: the deflagration extreme">氢氧燃烧:爆燃的另一极端</a>
    <a href="../blackbody-radiation/" data-zh="黑体辐射:黄焰的碳粒发光" data-en="blackbody: how soot glows yellow">黑体辐射:黄焰的碳粒发光</a>
    <a href="../fireworks/" data-zh="焰火:焰色与发光" data-en="fireworks: flame colors & emission">焰火:焰色与发光</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 10, 40);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x191c22 : 0xb2bec9);
  tubeM.color.setHex(dark ? 0x6e7984 : 0x93a0ad);
  potM.color.setHex(dark ? 0x8f99a4 : 0x7d8894);
  standM.color.setHex(dark ? 0x3d444d : 0x828f9c);
  mixTube.material.color.copy(tubeM.color);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('预混火焰 · 蓝锥与黄焰的分界', 'The Premixed Flame · Blue Cone vs Yellow Flame');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 120);
camera.position.set(2.8, 2.7, 5.2);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 2.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 0.95);
key.position.set(5, 8, 6);
scene.add(key);
const fillL = new THREE.DirectionalLight(0xffd8a8, 0.3);
fillL.position.set(-6, 4, -5);
scene.add(fillL);
const flameLight = new THREE.PointLight(0x66b8ff, 0, 6, 2);
flameLight.position.set(0, 2.8, 0);

/* ================= 燃烧状态(真实公式) ================= */

/* ---------------- 粒子(射流/空气/混气/羽流/碳烟,Points+vertexColors) ---------------- */
const P_MAX = 260;
const parts = [];
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_MAX * 3), pCol = new Float32Array(P_MAX * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pPoints = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.075, vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
pPoints.frustumCulled = false;
scene.add(pPoints);
const C_JET = new THREE.Color(0x35d0e8), C_AIR = new THREE.Color(0x5b9bff), C_MIX = new THREE.Color(0x9fd8ff),
  C_PLUME = new THREE.Color(0xff9a55), C_SOOT = new THREE.Color(0xffd23e), C_DARK = new THREE.Color(0x3a3a3a);
let jetAcc = 0, airAcc = 0;
function spawnGas() {
  if (parts.length >= P_MAX) return;
  parts.push({ x: 0, y: 0.5, z: 0, vx: (Math.random() - 0.5) * 0.06, vy: 1.4 + vFlow, vz: (Math.random() - 0.5) * 0.06, tp: 0, age: 0 });
}
function spawnAir() {
  if (parts.length >= P_MAX) return;
  const sgn = Math.random() < 0.5 ? -1 : 1;
  parts.push({ x: sgn * 0.6, y: 0.62 + (Math.random() - 0.5) * 0.1, z: (Math.random() - 0.5) * 0.06, vx: -sgn * 1.2, vy: 0.3, vz: 0, tp: 1, age: 0 });
}
const TMP = new THREE.Color();
const TEMP_STOPS = [[400, 0x8c2f2b], [800, 0xe35b1e], [1200, 0xffb043], [1600, 0xffe08a], [1900, 0xcfe8ff], [2200, 0xffffff]];
function tempColor(t) {
  for (let i = 0; i < TEMP_STOPS.length - 1; i++) {
    if (t <= TEMP_STOPS[i + 1][0] || i === TEMP_STOPS.length - 2) {
      const f = clamp((t - TEMP_STOPS[i][0]) / (TEMP_STOPS[i + 1][0] - TEMP_STOPS[i][0]), 0, 1);
      return TMP.setHex(TEMP_STOPS[i][1]).lerp(new THREE.Color(TEMP_STOPS[i + 1][1]), f);
    }
  }
  return TMP.setHex(0xffffff);
}
function stepParts(dt) {
  jetAcc += dt * (4 + 30 * (vFlow - 0.1));
  while (jetAcc > 1) { spawnGas(); jetAcc -= 1; }
  airAcc += dt * 40 * alpha;
  while (airAcc > 1) { spawnAir(); airAcc -= 1; }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.age += dt;
    if (p.tp === 0) {                                  // 燃气射流:过喉部加速
      if (p.y > 0.8 && p.y < 1.0) p.vy += 3.5 * dt;
      if (p.y > 1.35) p.tp = 2;
    } else if (p.tp === 1) {                           // 卷吸空气进入混合管
      if (Math.abs(p.x) < 0.26) p.tp = 2;
    } else if (p.tp === 2) {                           // 混气上行,到火孔分流
      p.vy = 0.7 + vFlow * 1.4;
      if (p.y > portY - 0.06) {
        if (ignited && state === 'fb' && p.y > 1.7) { parts.splice(i, 1); continue; }
        if (ignited && state !== 'fb') {
          if (yellowF > 0.2 && Math.random() < yellowF * 0.85) { p.tp = 4; p.vy = 0.9; }
          else { p.tp = 3; p.vy = 1.0 + vFlow; p.vx = (Math.random() - 0.5) * 0.5; p.vz = (Math.random() - 0.5) * 0.5; }
        } else if (!ignited) p.tp = 5;
      }
    } else if (p.tp === 3) {                           // 热羽流
      p.vy = Math.max(0.4, 1.15 + vFlow - p.age * 0.35);
      if (p.y > 5.6) { parts.splice(i, 1); continue; }
    } else if (p.tp === 4) {                           // 碳烟:黑体发光→降温变黑→部分沉积锅底
      p.vy = Math.max(0.3, 0.95 - p.age * 0.3);
      p.vx = Math.sin(p.age * 4 + i) * 0.12;
      if (sootOn && p.y > 3.72 && Math.abs(p.x) < 0.72 && Math.abs(p.z) < 0.72 && Math.random() < dt * 3) {
        sootDep = Math.min(1, sootDep + 0.008);
        parts.splice(i, 1); continue;
      }
      if (p.y > 6) { parts.splice(i, 1); continue; }
    } else {                                           // 未燃气体(熄火时散逸)
      if (p.y > 4.6 || p.age > 3) { parts.splice(i, 1); continue; }
    }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.tp < 3) {                                    // 管内限幅
      const r = Math.hypot(p.x, p.z), rmax = p.y < 2.0 ? 0.24 : 0.13;
      if (r > rmax) { p.x *= rmax / r; p.z *= rmax / r; }
    }
  }
}
function drawParts() {
  for (let i = 0; i < P_MAX; i++) {
    if (i < parts.length) {
      const p = parts[i];
      let c;
      if (p.tp === 0) c = C_JET;
      else if (p.tp === 1) c = C_AIR;
      else if (p.tp === 2) c = C_MIX;
      else if (p.tp === 3) c = tempOn ? tempColor(1850 - p.age * 320) : C_PLUME;
      else if (p.tp === 4) {
        if (!sootOn) { pPos[i * 3 + 1] = -999; continue; }
        c = TMP.copy(C_SOOT).lerp(C_DARK, clamp(p.age / 1.6, 0, 1));
        if (tempOn) c = tempColor(1200 - p.age * 400);
      } else c = C_MIX;
      pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.y; pPos[i * 3 + 2] = p.z;
      pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;
    } else pPos[i * 3 + 1] = -999;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 46, padR = 14, padT = 14, padB = 26;
  const VMAX = 1.3;
  const xOf = v => padL + v / VMAX * (W - padL - padR);
  const yOf = v => (H - padB) - clamp(v, 0, 1.3) / 1.3 * (H - padT - padB);
  const s = sEff(), vb = vBo();
  /* 三区着色 */
  ctx.fillStyle = 'rgba(255,107,107,.14)';
  ctx.fillRect(padL, padT, Math.max(0, xOf(s) - padL), H - padT - padB);
  ctx.fillStyle = 'rgba(116,220,132,.12)';
  ctx.fillRect(xOf(s), padT, Math.max(0, xOf(vb) - xOf(s)), H - padT - padB);
  ctx.fillStyle = 'rgba(255,169,77,.14)';
  ctx.fillRect(xOf(vb), padT, Math.max(0, W - padR - xOf(vb)), H - padT - padB);
  ctx.fillStyle = cTxt;
  ctx.font = '12px system-ui';
  ctx.fillText(L('回火', 'flashback'), padL + 6, padT + 14);
  ctx.fillText(L('稳定', 'stable'), xOf((s + vb) / 2) - 12, padT + 14);
  ctx.fillText(L('脱火', 'blowoff'), Math.min(W - padR - 50, xOf(vb) + 8), padT + 14);
  /* 界线 */
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = 'rgba(255,107,107,.75)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(s)); ctx.lineTo(W - padR, yOf(s)); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,169,77,.75)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(vb)); ctx.lineTo(W - padR, yOf(vb)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ff8787';
  ctx.fillText(`S_L=${s.toFixed(2)}`, W - padR - 78, yOf(s) - 5);
  ctx.fillStyle = '#ffa94d';
  ctx.fillText(`2S_L=${vb.toFixed(2)}`, W - padR - 84, yOf(vb) - 5);
  /* 坐标轴 */
  ctx.strokeStyle = 'rgba(128,150,170,.25)';
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText('0', padL - 6, H - padB + 16);
  ctx.fillText('1.3 m/s', W - padR - 52, H - padB + 16);
  ctx.fillText(L('火焰速度 ↑ / 气流速度 →', 'flame speed ↑ / flow →'), padL + 6, H - 6);
  /* 当前工况动点 */
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath();
  ctx.arc(xOf(vFlow), yOf(s), 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(xOf(vFlow), yOf(s), 5.5, 0, Math.PI * 2); ctx.stroke();
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elAlpha = document.getElementById('sAlpha'), elAlphaVal = document.getElementById('sAlphaVal');
const elFlow = document.getElementById('sFlow'), elFlowVal = document.getElementById('sFlowVal');
const stA = document.getElementById('stA'), stT = document.getElementById('stT'),
  stState = document.getElementById('stState'), stSoot = document.getElementById('stSoot'),
  stV = document.getElementById('stV');
const formulaEl = document.getElementById('formula');
const btnIgnite = document.getElementById('btnIgnite'), btnExt = document.getElementById('btnExt'),
  btnClean = document.getElementById('btnClean');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elAlpha.value = alpha * 100; elAlphaVal.textContent = `${(alpha * 100).toFixed(0)} %`;
  elFlow.value = vFlow; elFlowVal.textContent = `${vFlow.toFixed(2)} m/s`;
}
function syncBtns() { btnIgnite.classList.toggle('on', ignited); }
function stateName() {
  if (state === 'fb') return L('回火!', 'FLASHBACK');
  if (state === 'bo') return L('脱火!', 'BLOWOFF');
  if (!ignited) return L('未点火', 'not lit');
  return yellowF > 0.5 ? L('稳定·黄焰', 'stable · yellow') : L('稳定·蓝焰', 'stable · blue');
}
function updateStats() {
  stA.innerHTML = `${(alpha * 100).toFixed(0)}<small> %</small>`;
  stA.className = 'v ' + (alpha > 0.6 ? 'ok' : alpha < 0.3 ? 'bad' : 'warn');
  stT.textContent = ignited ? `${flameT()}°C` : '—';
  stState.textContent = stateName();
  stState.className = 'v ' + (state === 'fb' || state === 'bo' ? 'bad' : ignited ? 'ok' : '');
  stSoot.innerHTML = `${(sootIdx() * 100).toFixed(0)}<small> %</small>`;
  stSoot.className = 'v ' + (sootIdx() > 0.1 ? 'bad' : 'ok');
  const s = sEff();
  stV.innerHTML = `${vFlow.toFixed(2)}<small> / S ${s.toFixed(2)} m/s</small>`;
  stV.className = 'v ' + (vFlow < s ? 'bad' : vFlow > vBo() ? 'warn' : 'ok');
}
function updateFormula() {
  const s = sEff(), vb = vBo();
  formulaEl.innerHTML = L(
    `<b>引射:一次空气 ∝ √(喷嘴动量)</b>,无风机;当前 α = ${(alpha * 100).toFixed(0)}%(α>60% 蓝焰稳定,α<30% 黄焰积碳)<br>` +
    `<b>驻定条件:v_flow = S_L</b>;回火 v<S_L,吹熄 v>≈2S_L;S_L(CH₄)≈${S_L_METHANE.toFixed(2)} m/s<br>` +
    `<b>当前工况:v = ${vFlow.toFixed(2)} m/s,S_eff = ${s.toFixed(2)} m/s(α 偏离最佳值会降低 S),吹熄极限 ≈ 2.05S = ${vb.toFixed(2)} m/s</b><br>` +
    `<b>完全燃烧:CH₄+2O₂→CO₂+2H₂O</b>,T ≈ 1900 °C;蓝 = CH*/C₂* 化学发光,足氧无碳烟<br>` +
    `<b>缺氧:CH₄→C(碳烟)+2H₂</b>,碳粒黑体发光 j∝T⁴,~1200 °C 呈黄橙;锅底沉积 ${(sootDep * 100).toFixed(0)}%`,
    `<b>Ejector: primary air ∝ √(nozzle momentum)</b>, no fan; α = ${(alpha * 100).toFixed(0)}% (>60% stable blue, <30% yellow & soot)<br>` +
    `<b>Anchoring: v_flow = S_L</b>; flashback v<S_L, blowoff v>≈2S_L; S_L(CH₄)≈${S_L_METHANE.toFixed(2)} m/s<br>` +
    `<b>Now: v = ${vFlow.toFixed(2)} m/s, S_eff = ${s.toFixed(2)} m/s (α off-optimum lowers S), blowoff ≈ 2.05S = ${vb.toFixed(2)} m/s</b><br>` +
    `<b>Complete: CH₄+2O₂→CO₂+2H₂O</b>, T ≈ 1900 °C; blue = CH*/C₂* chemiluminescence, no soot<br>` +
    `<b>Starved: CH₄→C(soot)+2H₂</b>, soot glows blackbody j∝T⁴, yellow-orange at ~1200 °C; pot fouling ${(sootDep * 100).toFixed(0)}%`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot(); applyView();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elAlpha.addEventListener('input', () => { alpha = +elAlpha.value / 100; syncSliders(); updateFormula(); });
elFlow.addEventListener('input', () => { vFlow = +elFlow.value; syncSliders(); updateFormula(); });
btnIgnite.addEventListener('click', () => { ignite(); syncBtns(); });
btnExt.addEventListener('click', () => { extinguish(); syncBtns(); });
btnClean.addEventListener('click', () => { sootDep = 0; updateFormula(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglCut').addEventListener('change', e => { cutOn = e.target.checked; applyView(); });
document.getElementById('tglTemp').addEventListener('change', e => { tempOn = e.target.checked; });
document.getElementById('tglSoot').addEventListener('change', e => { sootOn = e.target.checked; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
const cInnerA = new THREE.Color(0x9fd4ff), cOuterA = new THREE.Color(0x39c4ff), cOuterY = new THREE.Color(0xffa833);
const METAL = new THREE.Color(0xb9c1cc), BLACK = new THREE.Color(0x161616);
let coneLift = 0;

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    simT += dt;
    /* 状态机:驻定条件 v_flow = S_L */
    if (ignited) {
      prevState = state;
      if (vFlow < sEff()) { state = 'fb'; fbT += dt; boT = 0; }
      else if (vFlow > vBo()) { state = 'bo'; boT += dt; fbT = 0; }
      else { state = 'stable'; fbT = 0; boT = 0; }
      if (state === 'fb' && prevState !== 'fb' && fbT < dt * 2)
        notify('回火!气流速度低于火焰传播速度,火焰缩入管内', 'flashback! flow speed below flame speed, flame retreats into the tube');
      if (state === 'bo' && prevState !== 'bo' && boT < dt * 2)
        notify('脱火!超过吹熄极限 ≈2S_L,火焰被吹离火孔', 'blowoff! past the ≈2S_L limit, flame lifted off the port');
      if (state === 'fb' && fbT > 1.6) { extinguish(); notify('回火熄灭:先关气、再点火', 'flame out: shut the gas first, then relight'); }
      if (state === 'bo' && boT > 1.3) { extinguish(); notify('脱火熄灭:燃气未燃直接散逸', 'blown out: unburned gas dispersing'); }
    }
    yellowF = lerp(yellowF, ignited ? yellowTarget() : 0, Math.min(1, dt * 2.5));
    stepParts(dt);
  }
  drawParts();
  /* 火焰锥体:黄焰变高变软,回火下沉,脱火上浮 */
  const on = ignited;
  innerCone.visible = on;
  outerCone.visible = on;
  warnRing.visible = state === 'fb' && on;
  if (on) {
    const liftT = state === 'fb' ? -0.95 : state === 'bo' ? 0.62 : 0;
    coneLift = lerp(coneLift, liftT, Math.min(1, dt * 4));
    const wob = yellowF * 0.5 + (state === 'bo' ? 0.8 : 0);
    const innerH = 0.52 * (1 - 0.62 * yellowF) * (1 - 0.5 * yellowF);
    const oH = outerH();
    innerCone.scale.set(1 - 0.55 * yellowF, Math.max(0.1, innerH), 1 - 0.55 * yellowF);
    innerCone.position.y = portY - 0.02 + innerH / 2 + coneLift;
    outerCone.scale.set(1 - 0.18 * yellowF, oH, 1 - 0.18 * yellowF);
    outerCone.position.y = portY - 0.02 + oH / 2 + coneLift;
    outerCone.rotation.x = Math.sin(simT * 7.3) * 0.09 * wob;
    outerCone.rotation.z = Math.cos(simT * 6.1) * 0.09 * wob;
    innerCone.position.x = Math.sin(simT * 8.7) * 0.02 * wob;
    outerCone.position.x = Math.sin(simT * 7.9) * 0.04 * wob;
    innerM.opacity = 0.5 * (1 - 0.8 * yellowF) * (state === 'bo' ? Math.max(0.15, 1 - boT) : 1);
    outerM.opacity = (0.34 + 0.18 * yellowF) * (state === 'bo' ? Math.max(0.1, 1 - boT * 0.8) : 1) * (0.85 + 0.15 * Math.sin(simT * 11));
    /* 颜色:化学发光 vs 温度着色 */
    if (tempOn) {
      innerM.color.copy(tempColor(1350 - 250 * yellowF));
      outerM.color.copy(tempColor(1900 - 650 * yellowF));
    } else {
      innerM.color.copy(cInnerA).lerp(new THREE.Color(0xffe9a8), yellowF * 0.85);
      outerM.color.copy(cOuterA).lerp(cOuterY, yellowF);
    }
    /* 侧火焰同步(整体视图) */
    sideFlames.children.forEach((m, idx) => {
      const oH2 = oH * 0.5, iH2 = innerH * 0.55;
      const baseX = idx < 2 ? -0.36 : 0.36;
      m.scale.set(1, idx % 2 === 0 ? Math.max(0.1, iH2) : oH2, 1);
      m.position.y = portY - 0.04 + (idx % 2 === 0 ? iH2 / 2 : oH2 / 2) + coneLift;
      m.position.x = baseX + Math.sin(simT * 7 + idx) * 0.03 * wob;
    });
    flameLight.intensity = (1.6 - yellowF * 0.6) * (0.85 + 0.15 * Math.sin(simT * 9));
    flameLight.color.setHex(yellowF > 0.5 ? 0xffa04d : 0x66b8ff);
  } else {
    flameLight.intensity = lerp(flameLight.intensity, 0, Math.min(1, dt0 * 4));
    coneLift = lerp(coneLift, 0, Math.min(1, dt0 * 4));
  }
  if (warnRing.visible) ringM.opacity = 0.4 + 0.5 * Math.abs(Math.sin(simT * 9));
  /* 空气门滑环位置 ∝ α */
  for (const { sh, sgn } of shutters) sh.position.x = sgn * (0.62 - 0.24 * alpha);
  /* 锅底积碳显色 */
  sootDiscM.color.copy(METAL).lerp(BLACK, Math.min(1, sootDep * 1.15));
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on2 = labelsOn && r.vis();
    r.o.visible = on2 && r.text() !== '';
    if (on2) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
applyView();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
