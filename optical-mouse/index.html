<title>光学鼠标 · 1500 fps 的纹理标尺</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.warn{color:#ffd43b}#stats .v.bad{color:#ff6b6b}
  :root[data-theme="light"] #stats .v.warn{color:#d98f00}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<div id="labels"></div>
<div id="title">
  <h1 data-zh="光学鼠标 · 1500 fps 的纹理标尺" data-en="The Optical Mouse · A 1500 fps Texture Ruler">光学鼠标 · 1500 fps 的纹理标尺</h1>
  <div class="sub" data-zh="LED 斜照桌面→微透镜把表面纹理成像到 18×18 的小 CMOS 上，~1500 fps 连拍；芯片把相邻两帧做块匹配互相关，相关峰的位移×像素比例=移动量——表面纹理就是「标尺」。光滑玻璃无纹理→相关峰消失→光标不走。拖动鼠标试试 · 拖动旋转 / 空格运行/暂停" data-en="An LED rakes light across the desk; a lens images the surface texture onto a tiny 18x18 CMOS at ~1500 fps. The chip block-matches consecutive frames — the correlation peak's shift times pixel scale IS the motion; the texture is the ruler. On smooth glass the peak vanishes and the cursor stops. Drag the mouse · drag to orbit / Space = run/pause">LED 斜照桌面→微透镜把表面纹理成像到 18×18 的小 CMOS 上，~1500 fps 连拍；芯片把相邻两帧做块匹配互相关，相关峰的位移×像素比例=移动量——表面纹理就是「标尺」。光滑玻璃无纹理→相关峰消失→光标不走。拖动鼠标试试 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============ 工具 / 主题 / 语言 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const el=id=>document.getElementById(id);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const speedMul=clamp(parseFloat(qs.get('speed'))||1,0.25,3);

/* ============ 渲染器 / 场景 ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,80);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,120);
camera.position.set(6.5,7.2,13.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(2,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,0.9);key.position.set(6,12,8);scene.add(key);

/* ============ 表面纹理（值噪声高度场） ============
   传感器看到的就是这个高度场的亮度;粗糙度=幅度。
   相关:相邻两帧 SAD 滑动匹配,峰的位移×像素间距=移动量(真实计算) */
function hash(ix,iz){
  let n=(Math.imul(ix,374761393)+Math.imul(iz,668265263))|0;
  n=Math.imul(n^(n>>>13),1274126177);
  return ((n^(n>>>16))>>>0)/4294967295;
}
function vnoise(x,z){
  const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;
  const u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  const a=hash(ix,iz),b=hash(ix+1,iz),c=hash(ix,iz+1),d=hash(ix+1,iz+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
let amp=0.55*0.14;
const heightN=(wx,wz)=>clamp(
  0.6*vnoise(wx*3.1,wz*3.1)+0.4*vnoise(wx*7.3+7.3,wz*7.3+7.3),0,1);

/* 桌面 */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const deskGeo=new THREE.PlaneGeometry(26,18,52,36);
const desk=new THREE.Mesh(deskGeo,
  new THREE.MeshStandardMaterial({color:0x4a4238,roughness:0.92}));
desk.rotation.x=-Math.PI/2;scene.add(desk);
function updateDesk(){
  const p=deskGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const wx=p.getX(i),wz=-p.getY(i);          // 旋转前局部坐标
    p.setZ(i,(heightN(wx,wz)-0.5)*amp*2.6);
  }
  p.needsUpdate=true;deskGeo.computeVertexNormals();
}

/* ============ 鼠标模型（可拖动） ============ */
const mouseG=new THREE.Group();mouseG.position.set(0,0,0);scene.add(mouseG);
const bodyM=new THREE.MeshStandardMaterial({color:0x2b3138,roughness:0.35,metalness:0.4});
const body=new THREE.Mesh(new THREE.SphereGeometry(1,28,20),bodyM);
body.scale.set(0.95,0.5,1.45);body.position.y=0.42;mouseG.add(body);
const wheel=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.12,18),
  new THREE.MeshStandardMaterial({color:0x15181c,roughness:0.5}));
wheel.rotation.z=Math.PI/2;wheel.position.set(0,0.86,-0.25);mouseG.add(wheel);
const ledLens=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),
  new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff2b2b,emissiveIntensity:2.2}));
ledLens.position.set(0,0.06,0.62);mouseG.add(ledLens);
const spot=new THREE.SpotLight(0xff5040,26,5,0.55,0.55);
spot.position.set(0,0.5,0.62);
const spotTgt=new THREE.Object3D();spotTgt.position.set(0,0,0.95);
mouseG.add(spot,spotTgt);spot.target=spotTgt;
/* 光锥示意 */
const cone=new THREE.Mesh(new THREE.ConeGeometry(0.5,1.05,20,1,true),
  new THREE.MeshBasicMaterial({color:0xff5040,transparent:true,opacity:0.1,side:THREE.DoubleSide}));
cone.position.set(0,0.42,0.78);cone.rotation.x=0.35;mouseG.add(cone);

/* ============ 传感器：18×18 @1500 fps + 互相关 ============ */
const NPX=18,PITCH=0.055,SEARCH=6,TICK=0.09;
let curFrame=new Float32Array(NPX*NPX),prevFrame=new Float32Array(NPX*NPX),frameIdx=0;
let mx=0,mz=0,curX=0,curY=0;      // 鼠标位置 / 光标位置
let tracking=true;
let playing=!qs.get('pause');
function sampleFrame(){
  const f=new Float32Array(NPX*NPX),k=amp/0.14;   // 粗糙度同时缩放传感器对比度:玻璃→无纹理
  for(let j=0;j<NPX;j++)for(let i=0;i<NPX;i++){
    const wx=mx+(i-8.5)*PITCH,wz=mz+(j-8.5)*PITCH;
    f[j*NPX+i]=clamp(0.5+(heightN(wx,wz)-0.5)*k+0.01*hash(i+frameIdx*3,j*7+frameIdx),0,1);
  }
  frameIdx++;
  return f;
}
/* SAD 块匹配:峰在 (sx,sy) → 鼠标位移 = (-sx,-sy)×PITCH */
function correlate(){
  let min=1e9,mxI=0,mxJ=0,sum=0,max=0;
  const sad=new Float32Array((2*SEARCH+1)*(2*SEARCH+1));
  for(let sy=-SEARCH;sy<=SEARCH;sy++)for(let sx=-SEARCH;sx<=SEARCH;sx++){
    let s=0,n=0;
    for(let j=SEARCH;j<NPX-SEARCH;j++)for(let i=SEARCH;i<NPX-SEARCH;i++){
      s+=Math.abs(curFrame[j*NPX+i]-prevFrame[(j+sy)*NPX+(i+sx)]);n++;
    }
    s/=n;
    sad[(sy+SEARCH)*(2*SEARCH+1)+(sx+SEARCH)]=s;
    sum+=s;if(s<min){min=s;mxI=sx;mxJ=sy;}if(s>max)max=s;
  }
  return {sad,min,mxI,mxJ,mean:sum/sad.length,max};
}

/* ============ 悬浮面板:帧流 + 相关热图 + 光标屏 ============ */
function makePanel(x,z,w){
  const g=new THREE.Group();g.position.set(x,3.1,z);
  g.rotation.x=-0.42;g.rotation.y=-0.3;
  const back=new THREE.Mesh(new THREE.BoxGeometry(w,w,0.12),bodyM);
  g.add(back);scene.add(g);return g;
}
const fpG=makePanel(8.2,0,2.7);
const frGeo=new THREE.BoxGeometry(0.125,0.125,0.5);
const frameMesh=new THREE.InstancedMesh(frGeo,new THREE.MeshStandardMaterial({roughness:0.4}),NPX*NPX);
fpG.add(frameMesh);
const ghostMesh=new THREE.InstancedMesh(frGeo.clone(),
  new THREE.MeshStandardMaterial({roughness:0.4,transparent:true,opacity:0.3}),NPX*NPX);
ghostMesh.position.z=-0.42;fpG.add(ghostMesh);
const hpG=makePanel(11.0,2.6,2.4);
const heatMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(0.115,0.115,0.28),
  new THREE.MeshStandardMaterial({roughness:0.4}),(2*SEARCH+1)*(2*SEARCH+1));
hpG.add(heatMesh);
/* 光标小屏 */
const scG=makePanel(8.4,-2.9,2.6);
const cursor=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.22,4),
  new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:0.6}));
cursor.rotation.x=Math.PI;scG.add(cursor);
/* 位移箭头 */
const arrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,0xffa94d,0.22,0.12);
arrow.position.set(0,1.75,0);fpG.add(arrow);
const gridM=new THREE.Matrix4(),colC=new THREE.Color();
for(let j=0;j<NPX;j++)for(let i=0;i<NPX;i++){
  gridM.identity();gridM.setPosition((i-8.5)*0.14,(8.5-j)*0.14,0);
  frameMesh.setMatrixAt(j*NPX+i,gridM);ghostMesh.setMatrixAt(j*NPX+i,gridM);
}
for(let j=0;j<2*SEARCH+1;j++)for(let i=0;i<2*SEARCH+1;i++){
  gridM.identity();gridM.setPosition((i-SEARCH)*0.17,(SEARCH-j)*0.17,0);
  heatMesh.setMatrixAt(j*(2*SEARCH+1)+i,gridM);
}
function paintFrame(mesh,frame,ghost){
  for(let j=0;j<NPX;j++)for(let i=0;i<NPX;i++){
    const v=frame[j*NPX+i];
    colC.setScalar(0.12+v*0.88);
    mesh.setColorAt(j*NPX+i,colC);
    mesh.getMatrixAt(j*NPX+i,gridM);
    gridM.elements[10]=0.1+v*(ghost?0.5:1.0);
    mesh.setMatrixAt(j*NPX+i,gridM);
  }
  mesh.instanceColor.needsUpdate=true;mesh.instanceMatrix.needsUpdate=true;
}
function paintHeat(res,ok){
  const S=2*SEARCH+1;
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){
    const v=res?res.sad[j*S+i]:0.5;
    const t=res?clamp((v-res.min)/((res.max-res.min)+1e-9),0,1):1;
    if(ok&&res&&v===res.min)colC.setHex(0xffffff);
    else colC.setRGB(0.15+0.85*(1-t),0.15+0.5*(1-t),0.2);
    heatMesh.setColorAt(j*S+i,colC);
    heatMesh.getMatrixAt(j*S+i,gridM);
    gridM.elements[10]=ok&&res&&v===res.min?0.75:0.28;
    heatMesh.setMatrixAt(j*S+i,gridM);
  }
  heatMesh.instanceColor.needsUpdate=true;heatMesh.instanceMatrix.needsUpdate=true;
}

/* ============ 拖动鼠标 ============ */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
const dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-0.2);
let dragging=false;
renderer.domElement.addEventListener('pointerdown',e=>{
  ptr.x=e.clientX/innerWidth*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  if(ray.intersectObject(body,false).length){
    dragging=true;controls.enabled=false;
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  ptr.x=e.clientX/innerWidth*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const p=new THREE.Vector3();
  if(ray.ray.intersectPlane(dragPlane,p)){
    mx=clamp(p.x,-6,6);mz=clamp(p.z,-5,5);
  }
});
addEventListener('pointerup',()=>{if(dragging){dragging=false;controls.enabled=true;}});

/* ============ 标签 ============ */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('LED 斜照:纹理影子给 CMOS 提供对比度','LED rakes light: texture shadows give contrast'),new THREE.Vector3(-0.7,1.35,1.2),'r',()=>true,mouseG);
addLabel(()=>L('18×18 CMOS · 视场约 1 mm · ~1500 fps','18x18 CMOS · ~1 mm field · ~1500 fps'),new THREE.Vector3(0,1.85,0),'b',()=>true,fpG);
addLabel(()=>L('相邻帧 SAD 匹配:白格=相关峰','SAD match: white cell = correlation peak'),new THREE.Vector3(0,1.7,0),'g',()=>true,hpG);
const failLbl=addLabel(()=>tracking?'' :L('相关失败:表面无纹理,光标不走','correlation failed: no texture, no cursor'),
  new THREE.Vector3(0,2.3,0),'r',()=>!tracking,fpG);
addLabel(()=>L('滚轮=光学编码器(注脚:老鼠标用滚球+机械编码)','wheel = optical encoder (old mice: ball + mechanical)'),new THREE.Vector3(0,1.35,0),'o',()=>true,mouseG);
addLabel(()=>L('拖我!','drag me!'),new THREE.Vector3(0,1.2,0),'o');

/* ============ 步骤 ============ */
let camTween=null;
function flyTo(p,t){camTween={p0:camera.position.clone(),p1:new THREE.Vector3(...p),t0:controls.target.clone(),t1:new THREE.Vector3(...t),k:0};}
const STEPS=[
  {zh:'LED 斜照桌面:光线掠过微纹理,明暗影子投到传感器上——没有影子就没有对比度',
   en:'LED rakes the desk: micro-texture casts bright/dark shadows onto the sensor — no shadow, no contrast',
   act:()=>{flyTo([2,2.6,6.5],[0,0.6,0]);}},
  {zh:'微透镜把表面成像到 18×18 的小 CMOS,~1500 fps 连拍,视场只有约 1 mm',
   en:'A lens images the surface onto an 18x18 CMOS at ~1500 fps, field of view ~1 mm',
   act:()=>{flyTo([8.2,5,4.5],[8.2,3.1,0]);}},
  {zh:'块匹配互相关:拿当前帧在上一帧里滑动比对,SAD(误差)最小的位置=相关峰',
   en:'Block matching: slide the current frame over the previous one; the min-SAD spot is the peak',
   act:()=>{flyTo([10,5,6],[11,3.1,2.6]);}},
  {zh:'相关峰的位移×像素间距=移动量;芯片每秒算几千次,把位移报给电脑,光标跟着走',
   en:'Peak shift x pixel pitch = motion; thousands of reports per second steer the cursor',
   act:()=>{flyTo([8.4,5,0],[8.4,3.1,-2.9]);}},
  {zh:'光滑玻璃无纹理:两帧处处相同,SAD 曲面平坦,找不到峰→光标不走(把粗糙度拖到 0)',
   en:'Glass has no texture: SAD is flat everywhere, no peak → the cursor stops (drag roughness to 0)',
   act:()=>{el('sRough').value=0;el('sRough').dispatchEvent(new Event('input'));flyTo([2,2.6,6.5],[0,0.6,0]);}},
  {zh:'注脚:滚轮是光学编码器,计数滚格栅;滚球鼠标靠球带动码盘——同一思想,机械版',
   en:'Footnote: the wheel is an optical encoder counting notches; ball mice turned the same idea mechanically',
   act:()=>{el('sRough').value=55;el('sRough').dispatchEvent(new Event('input'));flyTo([1.5,2.8,3.5],[0,0.8,-0.3]);}},
];
let activeStep=0;
function buildSteps(){
  const ol=el('steps');ol.innerHTML='';
  STEPS.forEach((s,i)=>{
    const zh2=s.zh.split('：'),en2=s.en.split(':');
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(zh2[0],en2[0])}</b>　${L(zh2.slice(1).join('：'),en2.slice(1).join(':'))}</span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    ol.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ============ 主题 / 语言 / UI ============ */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  el('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(e=>{
    if(e.tagName==='INPUT')return;
    e.textContent=LANG==='en'?(e.dataset.en||e.dataset.zh):e.dataset.zh;
  });
  el('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();syncUI();setPlayLabel();
}
function syncUI(){
  el('sRoughVal').textContent=el('sRough').value+' %';
  el('sAutoVal').textContent=(+el('sAuto').value).toFixed(1)+' u/s';
}
function setPlayLabel(){el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
let lastRes=null,speedPx=0;
function updateStats(){
  el('stTrk').textContent=tracking?L('正常','locked'):L('失败','failed');
  el('stTrk').className='v '+(tracking?'ok':'bad');
  const ct=lastRes&&lastRes.max>0?(1-lastRes.min/lastRes.mean)*100:0;
  el('stCt').innerHTML=clamp(ct,0,99).toFixed(0)+'<small> %</small>';
  el('stCt').className='v '+(ct>12?'ok':'bad');
  el('stV').innerHTML=speedPx.toFixed(0)+'<small> px/s</small>';
  el('stAmp').innerHTML=(amp/0.14*100).toFixed(0)+'<small> %</small>';
}
el('btnFlick').addEventListener('click',()=>{flickT=0.45;});
el('btnGlass').addEventListener('click',()=>{el('sRough').value=0;el('sRough').dispatchEvent(new Event('input'));});
el('sRough').addEventListener('input',e=>{
  amp=+e.target.value/100*0.14;updateDesk();syncUI();
});
el('sAuto').addEventListener('input',syncUI);
el('tglGhost').addEventListener('change',e=>{ghostMesh.visible=e.target.checked;});
el('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
el('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
el('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
el('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
el('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();el('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
let labelsOn=qs.get('labels')!=='0';
if(!labelsOn)el('tglLabels').checked=false;

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,accT=0,corrT=0.08,flickT=0,autoAng=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=dt0*speedMul*(playing?1:0);
  if(dt>0){
    /* 自动移动(绕圈) + 甩动脉冲 */
    let vx=0,vz=0;
    const auto=+el('sAuto').value;
    if(auto>0){autoAng+=dt*0.5;vx=Math.cos(autoAng)*auto;vz=Math.sin(autoAng)*auto*0.7;}
    if(flickT>0){flickT-=dt;vx+=2.0*Math.cos(autoAng);vz+=1.4*Math.sin(autoAng);}
    mx=clamp(mx+vx*dt,-6,6);mz=clamp(mz+vz*dt,-5,5);
    corrT+=dt;
    if(corrT>=TICK){
      corrT=0;
      prevFrame=curFrame;curFrame=sampleFrame();
      const res=correlate();lastRes=res;
      const contrast=res.max>0?1-res.min/res.mean:0;
      tracking=amp>0.018&&contrast>0.08;
      if(tracking){
        /* 实测标定:峰 (sx,sy) = 位移/PITCH → 位移 = (mxI,mxJ)×PITCH */
        const dx=res.mxI*PITCH,dz=res.mxJ*PITCH;
        curX=clamp(curX+dx*3.4,-1.1,1.1);curY=clamp(curY-dz*3.4,-0.65,0.65);
        if(Math.abs(curX)>=1.1)curX=-Math.sign(curX)*1.1;
        if(Math.abs(curY)>=0.65)curY=-Math.sign(curY)*0.65;
        speedPx=Math.hypot(res.mxI,res.mxJ)*PITCH/TICK;
        arrow.setDirection(new THREE.Vector3(res.mxI,0,res.mxJ).normalize());
        arrow.setLength(clamp(Math.hypot(res.mxI,res.mxJ)*0.09,0.15,0.9),0.2,0.1);
        arrow.visible=true;
      }else{speedPx=0;arrow.visible=false;}
      paintFrame(frameMesh,curFrame,false);
      if(ghostMesh.visible)paintFrame(ghostMesh,prevFrame,true);
      paintHeat(res,tracking);
      cursor.position.set(curX,curY,0.12);
    }
    mouseG.position.set(mx,0,mz);
  }
  if(camTween){
    camTween.k=Math.min(1,camTween.k+dt0*1.4);
    const e=1-Math.pow(1-camTween.k,3);
    camera.position.lerpVectors(camTween.p0,camTween.p1,e);
    controls.target.lerpVectors(camTween.t0,camTween.t1,e);
    if(camTween.k>=1)camTween=null;
  }
  accT+=dt0;if(accT>0.1){accT=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ============ 初始化 ============ */
curFrame=sampleFrame();prevFrame=sampleFrame();
updateDesk();
applyTheme();
applyLang();
paintFrame(frameMesh,curFrame,false);
paintHeat(null,false);
syncUI();
setPlayLabel();
start();
</script>
