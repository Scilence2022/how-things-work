<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引力波 · 四极涟漪与激光干涉</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(127,240,187,.9); color: #c2f7dd; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(255,209,102,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(176,118,31,.9); color: #8a5c0d; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(27,124,110,.9); color: #0c6e52; }
  :root[data-theme="light"] .lbl.r { border-color: rgba(196,68,48,.9); color: #b03a26; }
  .pop { display: inline-block; opacity: 0; }
  .pop.on { animation: pop .8s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(.3); opacity: 0; }
    22% { transform: scale(1.9); opacity: 1; }
    45% { transform: scale(1.15); }
    75% { opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    max-width: 600px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #chart { position: fixed; top: 62px; right: 18px; z-index: 4; width: 328px; height: 116px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    backdrop-filter: blur(6px); }
  @media (max-width: 1240px) { #chart { display: none; } }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 16px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: var(--acc); }
  #stats .v.hot { color: var(--hot); }
  #stats .v.cold { color: var(--cold); }
  :root[data-theme="light"] #stats .v.g { color: var(--acc); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 396px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.g { color: #ffd166; border-color: rgba(255,209,102,.7); }
  .chip.b { color: #8ff0b6; border-color: rgba(127,240,187,.7); }
  .chip.r { color: #ff9d85; border-color: rgba(255,122,92,.7); }
  :root[data-theme="light"] .chip.g { color: #9c6f00; border-color: rgba(156,111,0,.6); }
  :root[data-theme="light"] .chip.b { color: #0c6e52; border-color: rgba(12,110,82,.6); }
  :root[data-theme="light"] .chip.r { color: #b03a26; border-color: rgba(176,58,38,.6); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 6px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,209,102,.6); background: rgba(255,209,102,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(176,118,31,.55); background: rgba(176,118,31,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="引力波:四极涟漪与激光干涉" data-en="Gravitational Waves: quadrupole ripples & laser readout">引力波:四极涟漪与激光干涉</h1>
  <div class="sub" data-zh="双星旋进把时空搅出四极涟漪——最低阶没有偶极,沿轨道轴最强;远处粒子环被 + / × 偏振交替拉伸压缩,4 km 干涉仪把 h ~ 10⁻²¹ 读成一声啁啾 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="An inspiral stirs quadrupole ripples — no dipole at leading order, strongest along the orbital axis; distant test-mass rings stretch and squeeze under + / × polarization, and 4 km arms read h ~ 10⁻²¹ as a chirp · 3D interactive · drag to orbit / scroll to zoom · Space = play/pause">双星旋进把时空搅出四极涟漪——最低阶没有偶极,沿轨道轴最强;远处粒子环被 + / × 偏振交替拉伸压缩,4 km 干涉仪把 h ~ 10⁻²¹ 读成一声啁啾 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<canvas id="chart"></canvas>

<div id="stats">
  <span class="k" data-zh="应变 h(瞬时)" data-en="strain h (instant)">应变 h(瞬时)</span><span class="v hot" id="stH">—</span>
  <span class="k" data-zh="波频率 f_GW" data-en="wave freq f_GW">波频率 f_GW</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="单臂 ΔL(4 km)" data-en="arm ΔL (4 km)">单臂 ΔL(4 km)</span><span class="v" id="stDA">—</span>
  <span class="k" data-zh="臂长差 ΔLx−ΔLz" data-en="differential ΔL">臂长差 ΔLx−ΔLz</span><span class="v" id="stDD">—</span>
  <span class="k" data-zh="距并合(真实)" data-en="time to merger (real)">距并合(真实)</span><span class="v g" id="stT">—</span>
  <span class="k" data-zh="阶段" data-en="phase">阶段</span><span class="v" id="stP">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip g" data-zh="时空波纹 / 应变" data-en="spacetime ripple / strain">时空波纹 / 应变</span>
    <span class="chip b" data-zh="1064 nm 激光" data-en="1064 nm laser">1064 nm 激光</span>
    <span class="chip r" data-zh="干涉输出信号" data-en="interference output">干涉输出信号</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnVBin" data-zh="全景" data-en="overview">全景</button>
    <button class="abtn" id="btnVRing" data-zh="粒子环" data-en="test rings">粒子环</button>
    <button class="abtn" id="btnVIfo" data-zh="干涉仪" data-en="interferometer">干涉仪</button>
    <button class="abtn on" id="btnPolP" data-zh="+ 偏振" data-en="+ pol">+ 偏振</button>
    <button class="abtn" id="btnPolX" data-zh="× 偏振" data-en="× pol">× 偏振</button>
    <button class="abtn" id="btnSrc" data-zh="波源:黑洞" data-en="source: black holes">波源:黑洞</button>
  </div>
  <div class="row"><label data-zh="啁啾质量" data-en="chirp mass">啁啾质量</label><input id="mc" type="range" min="10" max="50" step="1" value="30"><span class="val" id="mcVal">30 M☉</span></div>
  <div class="row"><label data-zh="初始间距" data-en="initial separation">初始间距</label><input id="a0" type="range" min="1000" max="3500" step="50" value="2000"><span class="val" id="a0Val">2000 km</span></div>
  <div class="row"><label data-zh="波源距离" data-en="distance">波源距离</label><input id="dist" type="range" min="100" max="2000" step="10" value="410"><span class="val" id="distVal">410 Mpc</span></div>
  <div class="row"><label data-zh="波速(演示)" data-en="wave speed (demo)">波速(演示)</label><input id="cv" type="range" min="0.5" max="3" step="0.1" value="1.6"><span class="val" id="cvVal">—</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRipple" type="checkbox" checked> <span data-zh="波场" data-en="Wave field">波场</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../spacetime-curvature/" data-zh="被搅动的是什么:时空弯曲" data-en="what gets stirred: spacetime curvature">被搅动的是什么:时空弯曲</a>
    <a href="../black-hole-tides/" data-zh="并合前的终极旋绕:黑洞潮汐" data-en="the final whirl: black-hole tides">并合前的终极旋绕:黑洞潮汐</a>
    <a href="../tides/" data-zh="同款 1/r³ 差分:潮汐" data-en="the same 1/r³ trick: tides">同款 1/r³ 差分:潮汐</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
const fmtExp = (x, d = 2) => { if (!Number.isFinite(x) || Math.abs(x) < 1e-300) return '0';
  const [m, e] = x.toExponential(d).split('e'); return m + '×10' + sup(parseInt(e, 10)); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0x131a26 : 0x04060c);
  M.grid.color.set(THEME === 'light' ? 0x6084b8 : 0x33507c);
  M.wire.color.set(THEME === 'light' ? 0x9cc3ee : 0x7fb3e8);
  M.axis.color.set(THEME === 'light' ? 0x8a93a5 : 0x5a6474);
  M.front.color.set(THEME === 'light' ? 0xc79545 : 0xffd166);
}

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(-0.6, 6.6, 10.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-1.5, -0.4, 0.2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 32;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.35);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.05, ...opts });
}
const M = {
  grid: new THREE.MeshBasicMaterial({ color: 0x33507c, transparent: true, opacity: 0.38, side: THREE.DoubleSide, depthWrite: false }),
  wire: new THREE.MeshBasicMaterial({ color: 0x7fb3e8, wireframe: true, transparent: true, opacity: 0.16 }),
  bh: new THREE.MeshBasicMaterial({ color: 0x05070c }),
  ns: new THREE.MeshStandardMaterial({ color: 0xcfe6ff, roughness: 0.35, metalness: 0.1, emissive: 0x8ec9ff, emissiveIntensity: 0.85 }),
  halo: new THREE.MeshBasicMaterial({ color: 0xffa94d, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }),
  test: new THREE.MeshBasicMaterial({ color: 0xfff3bf }),
  axis: new THREE.MeshBasicMaterial({ color: 0x5a6474, transparent: true, opacity: 0.45 }),
  front: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
  flash: new THREE.MeshBasicMaterial({ color: 0xfff3bf, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }),
  spark: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  steel: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xbcd4e8, roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.55 }),

/* ================= 状态与物理(真实 SI 纯函数 + 演示时间轴) ================= */
const G = 6.674e-11, C = 2.998e8, MS = 1.989e30, MPC = 3.0857e22;
const L_ARM = 4000, LAM = 1.064e-6, PROTON = 1.7e-15, NCAV = 280;
const KV = 0.09, TR = 1.6, TQ = 0.8;
let Mc = 30, a0km = 2000, Dmpc = 410, CVis = 1.6;
let POL = '+', srcType = 'bh', view = 'bin';
const Mtot = () => 2.3 * Mc * MS;
const fOf = a => Math.sqrt(G * Mtot() / (a * a * a)) / Math.PI;
const hOf = f => 4 / (Dmpc * MPC) * Math.pow(G * Mc * MS / (C * C), 5 / 3) * Math.pow(Math.PI * f / C, 2 / 3);
const tauOf = f => (5 / 256) * Math.pow(G * Mc * MS / (C * C * C), -5 / 3) * Math.pow(Math.PI * f, -8 / 3);
const CY = { T1: 12, Tc: 0 };
let A0M = 2e6, F0 = 0, FR = 0, OMR = 0, HMG = 1, VISB = 1, PSI_M = 0, TAU0 = 1;
function rebuild() {
  A0M = a0km * 1000;
  F0 = fOf(A0M);
  FR = 0.3737 * C * C * C / (2 * Math.PI * G * 0.95 * Mtot());
  OMR = KV * FR;
  HMG = hOf(fOf(6 * G * Mtot() / (C * C)));
  VISB = clamp(HMG * 1e21, 0.12, 1.15);
  CY.T1 = clamp(12 * (a0km / 2000) ** 2, 6, 14);
  CY.Tc = CY.T1 + TR + TQ;
  PSI_M = 3.2 * KV * F0 * CY.T1;
  TAU0 = tauOf(F0);
}
rebuild();
function waveAt(tt) {
  if (tt <= 0 || tt >= CY.Tc) return null;
  if (tt < CY.T1) {
    const x = tt / CY.T1;
    const a = A0M * Math.pow(1 - x, 0.25);
    const f = fOf(a), hN = Math.min(hOf(f) / HMG, 1.35);
    const psi = 2 * 1.6 * KV * F0 * CY.T1 * (1 - Math.pow(1 - x, 0.625));
    return { s: hN * Math.cos(psi), amp: hN, psi, om: KV * f, f };
  }
  const u = tt - CY.T1, e = Math.exp(-u / 0.5);
  return { s: 1.35 * e * Math.cos(PSI_M + OMR * u), amp: 1.35 * e, psi: PSI_M + OMR * u, om: OMR, f: FR };
}
const kmPerUnit = () => a0km / 0.92;

  const rot = POL === '×' ? Math.PI / 4 : 0, cb = Math.cos(rot), sb = Math.sin(rot);
  for (let k = 0; k < ringDefs.length; k++) {
    const d = ringDefs[k];

    const a = w ? d.fac * VISB * w.amp : 0;
    const hv = 0.34 * Math.min(a, 1.15);
    const cs = w ? Math.cos(w.psi) : 0;
    for (let i = 0; i < RING_N; i++) {
      const th = i / RING_N * Math.PI * 2;
      const u = RING_R * (1 + hv * cs) * Math.cos(th);
      const v = RING_R * (1 - hv * cs) * Math.sin(th);
      const ru = u * cb - v * sb, rv = u * sb + v * cb;
      if (d.dir === 'h') dummy.position.set(d.pos[0] + ru, d.pos[1], d.pos[2] + rv);
      else dummy.position.set(d.pos[0], d.pos[1] + ru, d.pos[2] + rv);
      dummy.updateMatrix();
      ringDots.setMatrixAt(k * RING_N + i, dummy.matrix);
    }
  }
  ringDots.instanceMatrix.needsUpdate = true;
}

const chart = document.getElementById('chart');
const ctx2 = chart.getContext('2d');
const dpr = Math.min(devicePixelRatio, 2);
const CHW = 328, CHH = 116, WIN = 6.4;
chart.width = CHW * dpr; chart.height = CHH * dpr;
function drawChart() {
  ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx2.clearRect(0, 0, CHW, CHH);
  const gold = THEME === 'light' ? '#a86f1a' : '#ffd166';
  const dim = THEME === 'light' ? 'rgba(40,55,75,.55)' : 'rgba(190,205,225,.55)';
  const hot = THEME === 'light' ? '#d64933' : '#ff9d85';
  ctx2.strokeStyle = dim;
  ctx2.lineWidth = 1;
  ctx2.beginPath();
  ctx2.moveTo(8, CHH / 2 - 4); ctx2.lineTo(CHW - 8, CHH / 2 - 4);
  ctx2.setLineDash([3, 4]);
  ctx2.stroke();
  ctx2.setLineDash([]);
  ctx2.fillStyle = gold;
  ctx2.font = '600 11px system-ui';
  ctx2.textAlign = 'left';
  ctx2.fillText(L('应变 h(t) — 单次并合', 'strain h(t) — one event'), 9, 15);
  ctx2.fillStyle = dim;
  ctx2.font = '10px system-ui';
  ctx2.textAlign = 'right';
  ctx2.fillText(L(`LIGO 实测:h ~ 10⁻²¹`, `LIGO measured: h ~ 10⁻²¹`), CHW - 9, 15);
  const w = waveAt(tCyc);
  const dl = w ? Math.abs(hOf(w.f) * L_ARM / 2) : 0;
  ctx2.fillStyle = dim;
  ctx2.textAlign = 'left';
  ctx2.fillText(L(`4 km 单臂 ΔL = ${fmtExp(dl)} m`, `4 km arm ΔL = ${fmtExp(dl)} m`), 9, CHH - 7);
  ctx2.textAlign = 'right';
  ctx2.fillStyle = w ? gold : dim;
  ctx2.fillText(w ? L(`f = ${w.f.toFixed(1)} Hz`, `f = ${w.f.toFixed(1)} Hz`) : L('静默', 'quiet'), CHW - 9, CHH - 7);
  if (tCyc >= CY.T1 && tCyc < CY.T1 + 2.4) {
    ctx2.font = '700 11px system-ui';
    const x = CHW - 9 - ctx2.measureText(L('并合!', 'MERGE!')).width - 14;
    ctx2.fillStyle = hot;
    ctx2.fillText(L('并合!', 'MERGE!'), x, 15);
  }
  const n = samples.length;
  if (n > 1) {
    ctx2.strokeStyle = gold;
    ctx2.lineWidth = 1.6;
    ctx2.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      const age = tCyc - samples[i][0];
      if (age > WIN) continue;
      const x = CHW - 10 - age / WIN * (CHW - 20);
      const y = CHH / 2 - 4 - samples[i][1] * 34;
      if (!started) { ctx2.moveTo(x, y); started = true; }
      else ctx2.lineTo(x, y);
    }
    ctx2.stroke();
    if (w) {
      ctx2.fillStyle = '#fff3bf';
      ctx2.beginPath();
      ctx2.arc(CHW - 10, CHH / 2 - 4 - w.s * 34, 3, 0, Math.PI * 2);
      ctx2.fill();
    }
  }
}

function setSrc(s) {
  srcType = s;
  const m = s === 'bh' ? M.bh : M.ns;
  b1.material = m; b2.material = m;
  b1.children[0].visible = b2.children[0].visible = s === 'bh';

}
function syncSrcBtn() {
  const b = document.getElementById('btnSrc');
  b.textContent = srcType === 'bh' ? L('波源:黑洞', 'source: black holes') : L('波源:中子星', 'source: neutron stars');
}
const STEPS = [

    de: 'Two compact stars whip around each other: their time-varying quadrupole moment stirs ripples into spacetime itself, racing out at light speed. Not a new force — a wave of geometry.',

    act: () => { setView('bin'); jumpTo(0.74 * CY.T1); camTo(PP.NEAR, TT.NEAR); } },

    d: '并合时 h 峰值 ~10⁻²¹:4 km 臂长变化不到质子直径的千分之一,只能靠激光干涉读出。新黑洞像被敲响的钟:单一频率、指数衰减——GW150914 全程仅 0.2 s。',

function stepIndex() {
  if (tCyc >= CY.T1) return 5;
  if (view === 'ifo') return 3;
  if (view === 'ring') return 2;
  const x = tCyc / CY.T1;
  if (x > 0.68) return 4;
  if (x > 0.25) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ---------------- UI ---------------- */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd'), elSpdVal = document.getElementById('spdVal');
const elMc = document.getElementById('mc'), elMcVal = document.getElementById('mcVal');
const elA0 = document.getElementById('a0'), elA0Val = document.getElementById('a0Val');
const elDist = document.getElementById('dist'), elDistVal = document.getElementById('distVal');
const elCv = document.getElementById('cv'), elCvVal = document.getElementById('cvVal');
const tglLabels = document.getElementById('tglLabels'), tglRipple = document.getElementById('tglRipple'), tglRotate = document.getElementById('tglRotate');
const stH = document.getElementById('stH'), stF = document.getElementById('stF'),
  stDA = document.getElementById('stDA'), stDD = document.getElementById('stDD'),
  stT = document.getElementById('stT'), stP = document.getElementById('stP');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function updateFormula() {
  const w = waveAt(tCyc);
  const f = w ? w.f : F0, hPk = hOf(f), dl = hPk * L_ARM / 2;
  formulaEl.innerHTML = L(
    `f_GW = √(GM/a³)/π = <b>${f.toFixed(1)} Hz</b> · h = (4/D)·(GMc/c²)^(5/3)·(πf/c)^(2/3) = <b>${fmtExp(hPk)}</b><br>` +
    `单臂 ΔL = h·L/2 = <b>${fmtExp(dl)} m</b> ≈ 质子直径(1.7×10⁻¹⁵ m)的 ${fmtExp(dl / PROTON)} · 腔内往返 ×${NCAV} · GW150914:h 峰值 ≈ 1.0×10⁻²¹,全程 0.2 s`,
    `f_GW = √(GM/a³)/π = <b>${f.toFixed(1)} Hz</b> · h = (4/D)·(GMc/c²)^(5/3)·(πf/c)^(2/3) = <b>${fmtExp(hPk)}</b><br>` +
    `per-arm ΔL = h·L/2 = <b>${fmtExp(dl)} m</b> ≈ ${fmtExp(dl / PROTON)} of a proton's width (1.7×10⁻¹⁵ m) · cavities ×${NCAV} · GW150914: peak h ≈ 1.0×10⁻²¹, 0.2 s long`);
}
function updateStats() {
  const w = waveAt(tCyc);
  const merged = tCyc >= CY.T1;
  const f = w ? w.f : F0;
  const hPk = hOf(f), s = w ? w.s : 0;
  stH.textContent = fmtExp(hPk * s);
  stF.innerHTML = w ? w.f.toFixed(1) + '<small> Hz</small>' : '—';
  stDA.innerHTML = fmtExp(hPk * L_ARM / 2) + '<small> m</small>';
  stDD.innerHTML = fmtExp(dlDiff) + '<small> m</small>';
  if (merged) stT.innerHTML = '0<small> 已并合</small>';
  else stT.innerHTML = (w ? tauOf(w.f) : TAU0).toFixed(3) + '<small> s</small>';
  const ph = tCyc < CY.T1 ? 0 : tCyc < CY.T1 + 0.2 ? 1 : tCyc < CY.T1 + TR ? 2 : 3;
  stP.textContent = L(['旋进', '并合', '铃宕', '静默'][ph], ['inspiral', 'merger', 'ringdown', 'quiet'][ph]);
  stP.className = 'v ' + ['g', 'hot', 'cold', ''][ph];
}
elMc.addEventListener('input', () => {
  Mc = +elMc.value; elMcVal.textContent = Mc + ' M☉';
  rebuild();
  samples.length = 0;
});
elA0.addEventListener('input', () => {
  a0km = +elA0.value; elA0Val.textContent = a0km + ' km';
  rebuild();
  if (tCyc >= CY.Tc) tCyc = 0;
  samples.length = 0;
  updateCvVal();
});
elDist.addEventListener('input', () => { Dmpc = +elDist.value; elDistVal.textContent = Dmpc + ' Mpc'; });
function updateCvVal() {
  const slow = (C / 1000) / (CVis * kmPerUnit());
  elCvVal.textContent = L('慢 ×', 'slow ×') + slow.toFixed(0);
}
elCv.addEventListener('input', () => { CVis = +elCv.value; updateCvVal(); });
updateCvVal();
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('btnVBin').addEventListener('click', () => { setView('bin'); camTo(PP.OV, TT.OV); });
document.getElementById('btnVRing').addEventListener('click', () => { setView('ring'); camTo(PP.RING, TT.RING); });
document.getElementById('btnVIfo').addEventListener('click', () => { setView('ifo'); camTo(PP.IFO, TT.IFO); });
document.getElementById('btnPolP').addEventListener('click', () => setPol('+'));
document.getElementById('btnPolX').addEventListener('click', () => setPol('×'));
document.getElementById('btnSrc').addEventListener('click', () => setSrc(srcType === 'bh' ? 'ns' : 'bh'));
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; });
tglRipple.addEventListener('change', () => { rippleOn = tglRipple.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('引力波 · 四极涟漪与激光干涉', 'Gravitational Waves · quadrupole ripples & laser readout');
  snapWord = L('并合!', 'MERGE!');
  for (const r of labelReg) r.o.element.textContent = r.text();
  syncSrcBtn();
  buildSteps();
  setPlayLabel();
  updateFormula();
}

/* ---------------- 每帧更新 ---------------- */
function updateBinary(t) {
  const merged = t >= CY.T1;
  if (!merged) {
    const a = A0M * Math.pow(1 - t / CY.T1, 0.25);
    const R = 0.92 * a / A0M;
    const ph = psiNow / 2;
    b1.position.set(SX + Math.cos(ph) * R / 2, -0.15, Math.sin(ph) * R / 2);
    b2.position.set(SX - Math.cos(ph) * R / 2, -0.15, -Math.sin(ph) * R / 2);
    b1.scale.setScalar(1);
    b2.visible = true;
  } else {
    b2.visible = false;
    b1.position.set(SX, -0.15, 0);
    b1.scale.setScalar(1.3 + 0.12 * (waveAt(t) ? waveAt(t).s : 0));
  }
  flash.position.set(SX, -0.15, 0);
}
function ampPast(dt) {
  const j = Math.round(dt / AH_DT);
  if (j >= AH_N) return 0;
  if (j <= 0) return ampNow;
  return ampH[(ahIdx - j + AH_N) % AH_N];
}
function updateGrid(t) {
  const R = CVis * t;
  const show = rippleOn && R > 0.2 && R < 9.6;
  waveFront.visible = show;
  if (show) {
    waveFront.scale.setScalar(R);
    M.front.opacity = 0.34 * VISB;
  }
  for (let i = 0; i < NV; i++) {
    const x = BX[i], z = BZ[i];
    const dx = x - SX, dz = z;
    const r = Math.hypot(dx, dz) + 1e-6;
    const g2 = Math.exp(-(dx * dx + dz * dz) / (t < CY.T1 ? 0.4 : 0.6));
    const sag = (t < CY.T1 ? 0.42 : 0.62) * g2;
    let dv = 0, dr = 0;
    if (rippleOn) {
      const tr = r / CVis;
      if (tr <= t) {
        const a = ampPast(tr);
        if (a > 0.008) {
          const c = Math.cos(2 * Math.atan2(dz, dx) - (psiNow - 2 * omNow * tr));
          dv = a * c / (1 + 0.32 * r);
          dr = a * c;
        }
      }
    }
    const sm = clamp((r - 0.8) / 0.7, 0, 1);
    gPos.setXYZ(i, x + dx / r * dr * 0.055 * sm, GY - sag + dv * 0.34 * sm, z + dz / r * dr * 0.055 * sm);
  }
  gPos.needsUpdate = true;
}
function updateIFO(t) {
  const wX = waveAt(t - D_IX / CVis);
  const wZ = waveAt(t - D_IZ / CVis);
  const sX = POL === '+' && wX ? wX.amp * Math.cos(wX.psi) : 0;
  const sZ = POL === '+' && wZ ? -wZ.amp * Math.cos(wZ.psi) : 0;
  mx.position.x = MXX + sX * 0.055;
  mxPad.position.x = mx.position.x;
  mz.position.z = MZZ + sZ * 0.055;
  mzPad.position.z = mz.position.z;
  setBeamX(beam1, BSX, mx.position.x);
  setBeamZ(beam2, mz.position.z);
  dlArmX = sX * hOf(wX ? wX.f : F0) * L_ARM / 2;
  dlArmZ = sZ * hOf(wZ ? wZ.f : F0) * L_ARM / 2;
  dlDiff = dlArmX + dlArmZ;
  dPhiReal = 4 * Math.PI * NCAV * Math.abs(dlDiff) / LAM;
  const dPhiVis = 4 * Math.PI * NCAV * dlDiff / LAM * 3e8;
  I_out = 0.5 * (1 - Math.cos(dPhiVis));
  beam3.scale.y = DETZ; beam3.position.set(BSX, BY, DETZ / 2);
  beam3.material.opacity = 0.08 + 0.8 * I_out;
  M.lamp.emissiveIntensity = 0.1 + 1.7 * I_out;
  bands.forEach((b, i) => { b.material.opacity = I_out * (0.25 + 0.5 * (1 - i / 5)); });
  updatePhotons(t);
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let raf = null, lastStep = -1;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  const prev = tCyc;
  if (playing) {
    tCyc += dts;
    if (tCyc >= CY.Tc) { tCyc -= CY.Tc; samples.length = 0; ampH.fill(0); ahIdx = 0; }
    sampleAcc += dts;
    while (sampleAcc >= SDT) {
      sampleAcc -= SDT;
      samples.push([tCyc, (waveAt(tCyc) || { s: 0 }).s]);
      if (samples.length > 300) samples.shift();
    }
    ahAcc += dts;
    while (ahAcc >= AH_DT) {
      ahAcc -= AH_DT;
      ahIdx = (ahIdx + 1) % AH_N;
      ampH[ahIdx] = ampNow;
    }
    if (prev < CY.T1 && tCyc >= CY.T1 && tCyc < prev + 1) { burst(); fireSnap(); flashK = 1; }
  }
  const w = waveAt(tCyc);
  psiNow = w ? w.psi : psiNow;
  omNow = w ? w.om : 0;
  ampNow = w ? Math.min(w.amp, 1.35) : 0;
  updateBinary(tCyc);
  updateGrid(tCyc);
  updateRings(tCyc);
  updateIFO(tCyc);
  updateSparks(dt);
  drawChart();
  flash.material.opacity = flashK * 0.85;
  flash.scale.setScalar(0.4 + (1 - flashK) * 1.8);
  flashK *= Math.exp(-dt * 2.6);
  stAcc += dt;
  if (stAcc > 0.25) { stAcc = 0; updateStats(); updateFormula(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.element.style.display = on ? '' : 'none';
    if (on && !r.span) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  if (camK < 1) {
    camK = clamp(camK + dt / 0.9, 0, 1);
    const e = camK * camK * (3 - 2 * camK);
    camera.position.lerpVectors(camP0, camP1, e);
    controls.target.lerpVectors(camT0, camT1v, e);
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ---------------- 初始化(URL 参数) ---------------- */
setSrc('bh'); setPol('+');
if (qs.get('pol') === 'x' || qs.get('pol') === 'cross') setPol('×');
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; }
if (!qsBool('ripple', true)) { tglRipple.checked = false; rippleOn = false; }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
CVis = clamp(qsFloat('cv', 1.6), 0.5, 3);
elCv.value = CVis;
Mc = clamp(qsFloat('mc', 30), 10, 50);
elMc.value = Mc; elMcVal.textContent = Mc + ' M☉';
a0km = clamp(qsFloat('a0', 2000), 1000, 3500);
elA0.value = a0km; elA0Val.textContent = a0km + ' km';
Dmpc = clamp(qsFloat('dist', 410), 100, 2000);
elDist.value = Dmpc; elDistVal.textContent = Dmpc + ' Mpc';
rebuild();
const t0 = clamp(qsFloat('t', 0), 0, CY.Tc - 0.01);
updateBinary(tCyc); updateGrid(tCyc); updateRings(tCyc); updateIFO(tCyc); updateStats();
applyTheme();
applyLang();
if (t0 > 0) jumpTo(t0);
setPlayLabel();
start();
</script>
