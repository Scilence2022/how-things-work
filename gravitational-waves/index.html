<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引力波 · 啁啾与激光干涉</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(176,118,31,.9); color: #8a5c0d; }
  .pop { display: inline-block; opacity: 0; }
  .pop.on { animation: pop .8s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(.3); opacity: 0; }
    22% { transform: scale(1.9); opacity: 1; }
    45% { transform: scale(1.15); }
    75% { opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 16px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v.g { color: var(--acc); }
  #stats .v.hot { color: var(--hot); }
  #stats .v.cold { color: var(--cold); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,209,102,.6); background: rgba(255,209,102,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(176,118,31,.55); background: rgba(176,118,31,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 62px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>

</div>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
const fmtExp = (x, d = 2) => { if (!Number.isFinite(x) || Math.abs(x) < 1e-300) return '0';
  const [m, e] = x.toExponential(d).split('e'); return m + '×10' + sup(parseInt(e, 10)); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0x131a26 : 0x04060c);
  M.grid.color.set(THEME === 'light' ? 0x6084b8 : 0x33507c);
  M.wire.color.set(THEME === 'light' ? 0x9cc3ee : 0x7fb3e8);
  M.board.color.set(THEME === 'light' ? 0xe3e9f1 : 0x121a28);
  M.trace.color.set(THEME === 'light' ? 0xa06a12 : 0xffd166);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('引力波 · 啁啾与激光干涉', 'Gravitational Waves · chirp & interferometry');
  snapWord = L('并合!', 'MERGE!');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(0.2, 5.0, 10.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.4, -0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 28;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.35);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.05, ...opts });
}
const M = {
  grid: new THREE.MeshBasicMaterial({ color: 0x33507c, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false }),
  wire: new THREE.MeshBasicMaterial({ color: 0x7fb3e8, wireframe: true, transparent: true, opacity: 0.14 }),
  bh: new THREE.MeshBasicMaterial({ color: 0x05070c }),
  ring: new THREE.MeshBasicMaterial({ color: 0xffa94d, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }),
  ns: new THREE.MeshStandardMaterial({ color: 0xcfe6ff, roughness: 0.35, metalness: 0.1, emissive: 0x8ec9ff, emissiveIntensity: 0.85 }),
  flash: new THREE.MeshBasicMaterial({ color: 0xfff3bf, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }),
  spark: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  steel: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xbcd4e8, roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.55 }),
  laser: mat(0x2f9e44, { roughness: 0.4, emissiveIntensity: 0.3 }),
  det: mat(0x3b4656, { roughness: 0.5 }),
  lamp: new THREE.MeshStandardMaterial({ color: 0x2b2f38, emissive: 0xffe066, emissiveIntensity: 0.1, roughness: 0.4 }),
  beam: new THREE.MeshBasicMaterial({ color: 0x8ff0b6, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false }),
  beamOut: new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending, depthWrite: false }),
  board: mat(0x121a28, { roughness: 0.9, emissive: 0x000000 }),
  trace: new THREE.LineBasicMaterial({ color: 0xffd166 }),
  band: new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false }),
  dot: new THREE.MeshBasicMaterial({ color: 0xfff3bf }),
};

/* ---------------- 星空 ---------------- */
{
  const n = 260, sp = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(28 + Math.random() * 16);
    if (v.y < -3) v.y = -v.y;
    sp.set([v.x, v.y, v.z], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcdd9e8, size: 0.06, transparent: true, opacity: 0.7 })));
}

/* ---------------- 时空网格(下陷 + 四极涟漪) ---------------- */
const gridGrp = new THREE.Group();
gridGrp.position.y = -0.6;
scene.add(gridGrp);
const gridGeo = new THREE.PlaneGeometry(10.5, 7.2, 60, 42).rotateX(-Math.PI / 2);
const gridMesh = new THREE.Mesh(gridGeo, M.grid);
gridGrp.add(gridMesh);
gridGrp.add(new THREE.Mesh(gridGeo, M.wire));
const gPos = gridGeo.attributes.position;
const NV = gPos.count;
const BX = new Float32Array(NV), BZ = new Float32Array(NV);
for (let i = 0; i < NV; i++) { BX[i] = gPos.getX(i); BZ[i] = gPos.getZ(i); }

/* ---------------- 状态与物理(解析啁啾模型) ---------------- */
const W0 = 1.25, W1 = 6.4, WR = 8.95, TMW = 0.7, TRD = 3.2, TQ = 0.8;
const C_VIS = 2.4, BINX = -3.4, A0 = 0.28, BY = -0.42, IX = 2.1, DET_Z = 0.95;
const SDT = 0.035, LC = 1.064e-6, PROTON = 1.7e-15;
let Mc = 30, Dmpc = 410, POL = '+', srcType = 'bh';
let CY = {};
function setCycle() {
  const T1 = 13 * (30 / Mc);
  CY = { T1, tm: T1 + TMW, tr: T1 + TMW + TRD, Tc: T1 + TMW + TRD + TQ };

function omega(t) {
  if (t <= 0) return W0;
  if (t < CY.T1) { const x = t / CY.T1; return W0 + (W1 - W0) * x * x; }
  if (t < CY.tm) return W1 + (WR - W1) * (t - CY.T1) / TMW;
  return WR;
}
function phase(t) {
  if (t <= 0) return 0;
  const { T1, tm } = CY;
  if (t < T1) { const x = t / T1; return W0 * t + (W1 - W0) * T1 * x * x * x / 3; }
  const p1 = W0 * T1 + (W1 - W0) * T1 / 3;
  if (t < tm) { const u = t - T1; return p1 + W1 * u + (WR - W1) * u * u / (2 * TMW); }
  return p1 + W1 * TMW + (WR - W1) * TMW / 2 + WR * (t - tm);
}
function amp(t) {
  if (t <= 0) return 0;
  const { T1, tm } = CY;
  if (t < T1) return A0 * Math.pow(omega(t) / W0, 2 / 3);
  const a1 = A0 * Math.pow(W1 / W0, 2 / 3);
  if (t < tm) return a1 + (1 - a1) * (t - T1) / TMW;
  return Math.exp(-(t - tm) / 1.05);
}

elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('btnBH').addEventListener('click', () => setSrc('bh'));
document.getElementById('btnNS').addEventListener('click', () => setSrc('ns'));
document.getElementById('btnPolP').addEventListener('click', () => setPol('+'));
document.getElementById('btnPolX').addEventListener('click', () => setPol('×'));
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; });
tglRipple.addEventListener('change', () => { rippleOn = tglRipple.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 每帧更新 ---------------- */
function updateBinary(t) {
  const om = omega(t), ph = phase(t);
  const merged = t >= CY.tm;
  const R = merged ? 0.1 : clamp(0.9 * Math.pow(W0 / om, 2 / 3), 0.3, 0.9);
  const cph = Math.cos(ph), sph = Math.sin(ph);
  b1x = BINX + cph * R / 2; b1z = sph * R / 2;
  b1.position.set(b1x, -0.15, b1z);
  if (!merged) {
    b2.visible = true;
    b2x = BINX - cph * R / 2; b2z = -sph * R / 2;
    b2.position.set(b2x, -0.15, b2z);
    b1.scale.setScalar(1);
  } else {
    b2.visible = false;
    b2x = b1x; b2z = b1z;
    const k2 = clamp((t - CY.tm) / 0.4, 0, 1);
    b1.scale.setScalar((1 + 0.38 * k2) * (1 + 0.1 * amp(t) * Math.sin(2 * ph)));
  }
  flash.position.set(b1x, -0.15, b1z);
}
function updateGrid(t) {
  const pol2 = POL === '×' ? Math.PI / 2 : 0;
  const merged = t >= CY.tm;
  for (let i = 0; i < NV; i++) {
    const x = BX[i], z = BZ[i];
    const dx = x - BINX, r = Math.hypot(dx, z) + 1e-6;
    const d1x = x - b1x, d1z = z - b1z, d2x = x - b2x, d2z = z - b2z;
    const sag = 0.48 * Math.exp(-(d1x * d1x + d1z * d1z) / 0.42)
      + (merged ? 0.6 : 0.48) * Math.exp(-(d2x * d2x + d2z * d2z) / 0.42);
    let disp = 0;
    if (rippleOn) {
      const tr = t - r / C_VIS;
      if (tr > 0) {
        const a = amp(tr);
        if (a > 0.004) disp = a * Math.cos(2 * Math.atan2(z, dx) - pol2 - 2 * phase(tr)) / (1 + r * 0.5);
      }
    }
    const rd = Math.min(r / 0.7, 1);
    gPos.setXYZ(i, x + dx / r * disp * 0.35 * rd, -sag + disp * 0.5, z + z / r * disp * 0.35 * rd);
  }
  gPos.needsUpdate = true;
}
function updateIFO(t) {
  const s = sOf(t);
  const dL = s * 0.05;
  mx.position.x = 3.35 + dL; mxPad.position.x = 3.35 + dL;
  mz.position.z = -1.25 + dL; mzPad.position.z = -1.25 + dL;
  setBeamX(beam1, IX, mx.position.x);
  setBeamZ(beam2, mz.position.z);
  const I = clamp(0.5 + 0.5 * Math.sin(2.4 * s - 1.35), 0, 1);
  beam3.scale.y = DET_Z; beam3.position.set(IX, BY, DET_Z / 2);
  beam3.material.opacity = 0.12 + 0.78 * I;
  M.lamp.emissiveIntensity = 0.12 + 1.6 * I;
  bands.forEach((b, i) => { b.material.opacity = I * (0.3 + 0.55 * (1 - i / 5)); });
  updatePhotons(t);
}
function updateChart(t) {
  const n = samples.length;
  for (let i = 0; i < n; i++) {
    trArr[i * 3] = CX0 + samples[i][0] / CY.Tc * CW;
    trArr[i * 3 + 1] = CYM + samples[i][1] * 0.52;
    trArr[i * 3 + 2] = BOARD_Z + 0.04;
  }
  trGeo.setDrawRange(0, Math.max(n, 0));
  trGeo.attributes.position.needsUpdate = true;
  const x1 = CX0 + CY.T1 / CY.Tc * CW, x2 = CX0 + CY.tm / CY.Tc * CW;
  setVLine(div1, x1, CYM - 0.62, CYM + 0.62);
  setVLine(div2, x2, CYM - 0.62, CYM + 0.62);
  setVLine(cursor, CX0 + t / CY.Tc * CW, CYM - 0.66, CYM + 0.66);
  cursorDot.position.set(CX0 + t / CY.Tc * CW, CYM + sOf(t) * 0.52 + 0.02, BOARD_Z + 0.04);
  lblPh1.o.position.set((CX0 + x1) / 2, CYM + 0.82, BOARD_Z);
  lblPhM.o.position.set(x2 + 0.12, CYM + 0.82, BOARD_Z);
  lblPhR.o.position.set((x2 + CX0 + CW) / 2, CYM + 0.82, BOARD_Z);
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let raf = null, lastStep = -1;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  const prev = tCyc;
  if (playing) {
    tCyc += dts;
    if (tCyc >= CY.Tc) { tCyc -= CY.Tc; samples.length = 0; }
    sampleAcc += dts;
    while (sampleAcc >= SDT) {
      sampleAcc -= SDT;
      if (samples.length >= NSAMP) samples.shift();
      samples.push([tCyc, sOf(tCyc)]);
    }
    if (prev < CY.tm && tCyc >= CY.tm && tCyc < prev + 1) { burst(); fireSnap(); flashK = 1; }
  }
  updateBinary(tCyc);
  updateGrid(tCyc);
  updateIFO(tCyc);
  updateChart(tCyc);
  updateSparks(dt);
  flash.material.opacity = flashK * 0.85;
  flash.scale.setScalar(0.4 + (1 - flashK) * 1.8);
  flashK *= Math.exp(-dt * 2.6);
  stAcc += dt;
  if (stAcc > 0.24) { stAcc = 0; updateStats(); updateFormula(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.element.style.display = on ? '' : 'none';
    if (on && !r.span) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  if (camK < 1) {
    camK = clamp(camK + dt / 0.9, 0, 1);
    const e = camK * camK * (3 - 2 * camK);
    camera.position.lerpVectors(camP0, camP1, e);
    controls.target.lerpVectors(camT0, camT1, e);
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ---------------- 初始化(URL 参数) ---------------- */
setSrc('bh'); setPol('+');
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
const t0 = clamp(qsFloat('t', 0), 0, 600);
if (t0 > 0) { tCyc = t0 % CY.Tc; for (let ts = 0; ts <= tCyc; ts += 0.05) samples.push([ts, sOf(ts)]); }
updateBinary(tCyc); updateGrid(tCyc); updateIFO(tCyc); updateChart(tCyc); updateStats();
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
</body>
