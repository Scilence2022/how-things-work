<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>牛顿迭代法 · 切线如何把误差平方甩掉</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#63e6be;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#0ca678;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="牛顿迭代法" data-en="Newton's Method">牛顿迭代法</h1>
  <div class="sub" data-zh="猜一个 x,画切线、落到横轴、再从落点重来:x_{n+1}=x_n−f/f′ 每步把误差平方甩掉——二次收敛,四位小数三步到手;但切线也会骗人:初值选错,迭代要么振荡要么跑路,多初值染色还会开出牛顿分形 · 拖动旋转 / 空格运行/暂停" data-en="Guess an x, draw the tangent, land on the axis, start again from the landing point: x_{n+1} = x_n − f/f′ squares the error away each step — quadratic convergence delivers four decimals in three steps; but tangents can lie: a poor starting value oscillates or runs away, and coloring many starts grows a Newton fractal · drag to orbit / Space = run/pause">猜一个 x,画切线、落到横轴、再从落点重来:x_{n+1}=x_n−f/f′ 每步把误差平方甩掉——二次收敛,四位小数三步到手;但切线也会骗人:初值选错,迭代要么振荡要么跑路,多初值染色还会开出牛顿分形 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

  <span class="k" data-zh="迭代步数" data-en="Iterations">迭代步数</span><span class="v" id="stIt">0</span>
  <span class="k" data-zh="当前 x" data-en="Current x">当前 x</span><span class="v" id="stX">—</span>
  <span class="k" data-zh="|f(x)| 误差" data-en="Error |f(x)|">|f(x)| 误差</span><span class="v" id="stErr">—</span>

    <input id="sX0" type="range" min="-3" max="3" step="0.05" value="1.7">
    <span class="val" id="sX0Val">1.70</span>

  <div class="row">
    <label data-zh="函数选择" data-en="Function">函数选择</label>

  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglTrail" type="checkbox" checked> <span data-zh="切线残留" data-en="Tangent trail">切线残留</span></label>

  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../taylor-series/" data-zh="泰勒级数" data-en="Taylor Series">泰勒级数</a>

  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,72);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(4.8,4.7,9.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.7,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.5;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与网格 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(17,34,0x39424f,0x232a33);
grid.position.y=0.02;scene.add(grid);

/* ---- 坐标系:横轴(发光)+ 纵轴 + 刻度 ---- */
const SX=1.35,SY=0.26,AY=2.6,YCLIP=9.4,XLIM=3.95;
const wx=x=>x*SX,wy=f=>AY+f*SY;
const axisM=new THREE.MeshStandardMaterial({color:0xdfe6ec,roughness:0.4,metalness:0.3,emissive:0x3a4652,emissiveIntensity:0.6});
const xAxis=new THREE.Mesh(new THREE.CylinderGeometry(0.024,0.024,10.6,10),axisM);
xAxis.rotation.z=Math.PI/2;xAxis.position.set(0,AY,0);scene.add(xAxis);
const yAxis=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,5.4,10),
  new THREE.MeshStandardMaterial({color:0x9aa5b1,roughness:0.5,emissive:0x2a3138,emissiveIntensity:0.5}));
yAxis.position.set(0,3.0,0);scene.add(yAxis);
const tickM=new THREE.MeshStandardMaterial({color:0x868e96,roughness:0.6});
for(let k=-3;k<=3;k++){
  const t=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.12,0.03),tickM);
  t.position.set(wx(k),AY,0);scene.add(t);
}

/* ---- 函数库与发光曲线 y=f(x) ---- */
const FUNCS=[
 {zh:'x³−3x+1',f:x=>x*x*x-3*x+1,d:x=>3*x*x-3,roots:[-1.8793852,0.3472964,1.5320889],lo:-2.6,hi:2.6},
 {zh:'x³−2x+2',f:x=>x*x*x-2*x+2,d:x=>3*x*x-2,roots:[-1.7692924],lo:-2.4,hi:2.4},
 {zh:'(x−1)²(x+2)',f:x=>(x-1)*(x-1)*(x+2),d:x=>3*(x-1)*(x+1),roots:[-2,1],lo:-2.8,hi:2.8},
];
const curveGrp=new THREE.Group();scene.add(curveGrp);
const curveM=new THREE.MeshStandardMaterial({color:0x63e6be,roughness:0.3,emissive:0x0b7250,emissiveIntensity:0.9});
function rebuildCurve(){
  for(const c of[...curveGrp.children]){c.geometry.dispose();curveGrp.remove(c);}
  const F=FUNCS[fnIdx];let run=[];
  const flush=()=>{
    if(run.length>1){
      const pts=run.map(x=>new THREE.Vector3(wx(x),wy(F.f(x)),0));
      curveGrp.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),80,0.045,10),curveM));
    }
    run=[];
  };
  for(let i=0;i<=160;i++){
    const x=F.lo+(F.hi-F.lo)*i/160;
    if(Math.abs(F.f(x))<YCLIP)run.push(x);else flush();
  }
  flush();
}
const rootRings=[];
const rootM=new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.3,emissive:0x8a6d00,emissiveIntensity:0.85});
for(let i=0;i<3;i++){
  const r=new THREE.Mesh(new THREE.TorusGeometry(0.085,0.022,8,20),rootM);
  r.visible=false;scene.add(r);rootRings.push(r);
}
function updateRoots(){
  const roots=FUNCS[fnIdx].roots;
  rootRings.forEach((r,i)=>{r.visible=i<roots.length;
    if(r.visible)r.position.set(wx(roots[i]),AY,0);});
}

/* ---- 迭代演员:当前点球 / 切线 / 横轴交点 / 垂直虚线 / 误差对数条 ---- */
const ball=new THREE.Mesh(new THREE.SphereGeometry(0.1,16,12),
  new THREE.MeshStandardMaterial({color:0x8ce99a,roughness:0.25,emissive:0x2b8a3e,emissiveIntensity:0.9}));
scene.add(ball);
const cross=new THREE.Mesh(new THREE.SphereGeometry(0.07,14,10),
  new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.25,emissive:0x8a6d00,emissiveIntensity:1.0}));
cross.visible=false;scene.add(cross);
const tangent=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1,8),
  new THREE.MeshStandardMaterial({color:0x66d9e8,roughness:0.3,emissive:0x0b7285,emissiveIntensity:0.9}));
tangent.visible=false;scene.add(tangent);
const dropGeo=new THREE.BufferGeometry();
dropGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
const dropLine=new THREE.Line(dropGeo,
  new THREE.LineDashedMaterial({color:0xdfe6ec,dashSize:0.12,gapSize:0.09,transparent:true,opacity:0.85}));
dropLine.visible=false;scene.add(dropLine);
const errM=new THREE.MeshStandardMaterial({color:0xff8787,roughness:0.4,emissive:0x5c1a1a,emissiveIntensity:0.5});
const errBar=new THREE.Mesh(new THREE.BoxGeometry(0.16,1,0.16),errM);
errBar.position.set(wx(3.55),AY,0);scene.add(errBar);

/* ---- 轨迹残留:过去点(InstancedMesh)+ 过去切线(InstancedMesh) ---- */
const NT=14;
const trailIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,10,8),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9}),NT);
scene.add(trailIM);
const trailPos=[],trailAge=new Float32Array(NT).fill(99);
for(let i=0;i<NT;i++)trailPos.push(new THREE.Vector3(0,-99,0));
let trailPtr=0;
const NR=10;
const residIM=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.018,0.018,1,6),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9}),NR);
scene.add(residIM);
const resids=[];
for(let i=0;i<NR;i++)resids.push({q:new THREE.Quaternion(),mid:new THREE.Vector3(0,-99,0),len:1,age:99});
let residPtr=0;

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false,tglTrailOn=true;
let fnIdx=0,x0=1.7,xCur=1.7,prevX=1.7,prev2=1.7,xNext=null;
let stepN=0,status='run',animT=0,frozen=false;
const STEP_T=1.35;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblPt=addLabel(()=>L('当前点 (x, f(x))','Current point (x, f(x))'),new THREE.Vector3(0,-99,0),'g');
const lblTan=addLabel(()=>L('切线:局部线性化','Tangent: local linearization'),new THREE.Vector3(0,-99,0),'b',()=>tangent.visible);
const lblCross=addLabel(()=>L('横轴交点 → xₙ₊₁','Axis crossing → xₙ₊₁'),new THREE.Vector3(0,-99,0),'y',()=>cross.visible);
const lblAlert=addLabel(
  ()=>status==='osc'?L('振荡:0 ↔ 1 死循环','Oscillation: stuck in a 0 ↔ 1 loop')
                    :L('发散:切线把点甩了出去','Diverged: the tangent flung the point away'),
  new THREE.Vector3(0,-99,0),'r',()=>status==='osc'||status==='div');
const lblErr=addLabel(()=>L('误差条 log₁₀|f|','Error gauge log₁₀|f|'),new THREE.Vector3(wx(3.55),5.55,0),'');

function newtonStep(x){
  const F=FUNCS[fnIdx],d=F.d(x);
  if(!isFinite(d)||Math.abs(d)<1e-7)return null;
  const x1=x-F.f(x)/d;
  if(!isFinite(x1))return null;
  return clamp(x1,-40,40);
}
function resetIter(){
  xCur=x0;prevX=x0;prev2=x0;xNext=null;
  stepN=0;status='run';animT=0;frozen=false;
  trailAge.fill(99);resids.forEach(r=>r.age=99);
}
function setX0(v){
  x0=clamp(v,-3,3);
  document.getElementById('sX0').value=x0;
  document.getElementById('sX0Val').textContent=x0.toFixed(2);
  resetIter();
}
function setFn(i){
  fnIdx=clamp(Math.round(i),1,3)-1;
  document.getElementById('sFn').value=fnIdx+1;
  document.getElementById('sFnVal').textContent=FUNCS[fnIdx].zh;
  rebuildCurve();updateRoots();resetIter();
}

/* ---- 分形盆地:复平面按收敛到的根染色(预计算 CanvasTexture) ---- */
let basin=null;
function buildBasin(){
  if(basin){basin.visible=true;return;}
  const W=280,H=200,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d'),img=g.createImageData(W,H);
  const RT=FUNCS[0].roots,COLS=[[99,230,190],[116,192,252],[247,131,172]];
  for(let j=0;j<H;j++){
    const im=2.5-5.0*j/(H-1);
    for(let i=0;i<W;i++){
      const re=-3.5+7.0*i/(W-1);
      let zr=re,zi=im,k=0;
      for(k=0;k<40;k++){
        const a=zr*zr-zi*zi,b=2*zr*zi;          /* z² */
        const cr=zr*a-zi*b,ci=zr*b+zi*a;        /* z³ */
        const pr=cr-3*zr+1,pi=ci-3*zi;          /* p(z) */
        const dr=3*(a-1),di=3*b;                /* p'(z) */
        const dd=dr*dr+di*di;if(dd<1e-9)break;
        const qr=(pr*dr+pi*di)/dd,qi=(pi*dr-pr*di)/dd;
        zr-=qr;zi-=qi;
        if(qr*qr+qi*qi<1e-12)break;
      }
      let bi=0,bd=1e9;
      for(let r=0;r<3;r++){
        const dzr=zr-RT[r],dzi=zi,dq=dzr*dzr+dzi*dzi;
        if(dq<bd){bd=dq;bi=r;}
      }
      const sh=Math.max(0.3,1-k*0.024),o=(j*W+i)*4,cl=COLS[bi];
      img.data[o]=cl[0]*sh;img.data[o+1]=cl[1]*sh;img.data[o+2]=cl[2]*sh;img.data[o+3]=255;
    }
  }
  g.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  basin=new THREE.Mesh(new THREE.PlaneGeometry(9.45,6.75),
    new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.96}));
  basin.rotation.x=-Math.PI/2;basin.position.y=0.05;scene.add(basin);
}
function showBasin(on){
  if(on)buildBasin();else if(basin)basin.visible=false;
  document.getElementById('bBasin').classList.toggle('on',on);
}

/* ---- 步骤 ---- */
function markBtn(id){
  document.getElementById('bGood').classList.toggle('on',id==='bGood');
  document.getElementById('bBad').classList.toggle('on',id==='bBad');
}
const STEPS=[
 {zh:'猜一个 x₀:在曲线上落下初始点',en:'Guess an x₀: drop the initial point onto the curve',
  act(){setFn(1);setX0(1.7);slowMo=false;document.getElementById('tglSlow').checked=false;markBtn('bGood');}},
 {zh:'画切线:线性化是这一点附近最好的局部地图',en:'Draw the tangent: linearization is the best local map around this point',
  act(){slowMo=true;document.getElementById('tglSlow').checked=true;}},
 {zh:'落到横轴:切线与 x 轴的交点,就是下一个猜测 x₁',en:'Slide down to the axis: where the tangent crosses x lies the next guess x₁',
  act(){slowMo=true;document.getElementById('tglSlow').checked=true;}},
 {zh:'误差平方消失:每步 |f| 近似平方——二次收敛的复利',en:'The error squares away: |f| roughly squares each step — the compound interest of quadratic convergence',
  act(){slowMo=false;document.getElementById('tglSlow').checked=false;setFn(1);setX0(2.4);}},
 {zh:'初值陷阱:选错位置,切线把你甩进 0 ↔ 1 的死循环',en:'The initial-value trap: start badly and the tangent slings you into a 0 ↔ 1 dead loop',
  act(){slowMo=false;document.getElementById('tglSlow').checked=false;setFn(2);setX0(0);markBtn('bBad');}},
 {zh:'分形盆地:复平面上按收敛到的根染色,三个根分天下',en:'The fractal basin: the plane colored by which root each start converges to — three roots split the world',
  act(){setFn(1);setX0(1.7);showBasin(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const F=FUNCS[fnIdx];
  document.getElementById('stIt').textContent=stepN;
  document.getElementById('stX').textContent=xCur.toFixed(4);
  const fa=Math.abs(F.f(xCur));
  document.getElementById('stErr').innerHTML=fa>=0.001?fa.toFixed(4):fa.toExponential(1);
  const st=document.getElementById('stStat');
  st.textContent=status==='conv'?L('收敛','converged'):status==='osc'?L('振荡','oscillating')
    :status==='div'?L('发散','diverged'):L('迭代中…','running…');
  st.className='v '+(status==='conv'?'ok':status==='run'?'':'warn');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bGood').addEventListener('click',()=>{setFn(1);setX0(1.7);markBtn('bGood');});
document.getElementById('bBad').addEventListener('click',()=>{setFn(2);setX0(0);markBtn('bBad');});
document.getElementById('bBasin').addEventListener('click',()=>showBasin(!(basin&&basin.visible)));
document.getElementById('sX0').addEventListener('input',e=>setX0(+e.target.value));
document.getElementById('sFn').addEventListener('input',e=>setFn(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglTrail').addEventListener('change',e=>{tglTrailOn=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4(),tmpV=new THREE.Vector3(),tmpC=new THREE.Color();
const UP=new THREE.Vector3(0,1,0),P=new THREE.Vector3(),Q=new THREE.Vector3(),R=new THREE.Vector3(),N=new THREE.Vector3();
function beginStep(F){
  xNext=newtonStep(xCur);
  if(xNext===null){status='div';frozen=true;return;}
  prev2=prevX;prevX=xCur;
}
function finishStep(F){
  stepN++;
  trailPos[trailPtr].set(wx(clamp(xCur,-XLIM,XLIM)),clamp(wy(F.f(xCur)),0.14,6.2),0);
  trailAge[trailPtr]=0;trailPtr=(trailPtr+1)%NT;
  if(tangent.visible){
    const r=resids[residPtr];
    r.q.copy(tangent.quaternion);r.mid.copy(tangent.position);r.len=tangent.scale.y;
    r.age=0;residPtr=(residPtr+1)%NR;
  }
  const dx=Math.abs(xNext-xCur);
  xCur=xNext;xNext=null;animT=0;
  const fa=Math.abs(F.f(xCur));
  if(fa<1e-11||dx<1e-10){status='conv';frozen=true;}
  else if(stepN>4&&Math.abs(xCur-prev2)<1e-6){status='osc';}
  else if(Math.abs(xCur)>30||stepN>120){status='div';frozen=true;}
  else status='run';
}
function drawIter(F,dts){
  const dxC=clamp(xCur,-XLIM,XLIM),fy=F.f(xCur);
  P.set(wx(dxC),clamp(wy(fy),0.14,6.2),0);
  if(xNext!==null&&!frozen){
    const e=clamp(animT/0.55,0,1),eased=e*e*(3-2*e);
    Q.set(wx(clamp(xNext,-5.4,5.4)),AY,0);
    tmpV.copy(Q).sub(P);
    const len=tmpV.length();
    if(len>0.06){
      R.copy(tmpV).normalize();
      const seg=len*(0.03+1.28*eased);
      tangent.visible=true;
      tangent.quaternion.setFromUnitVectors(UP,R);
      tangent.scale.set(1,Math.max(seg,0.01),1);
      tangent.position.copy(P).addScaledVector(R,seg/2);
      cross.visible=eased>0.1;
      cross.position.copy(Q);
      cross.scale.setScalar(1+0.3*Math.sin(simT*10));
      const u=clamp((animT-0.55)/0.3,0,1);
      dropLine.visible=u>0&&u<1;
      if(dropLine.visible){
        const ny=clamp(wy(F.f(xNext)),0.14,6.0);
        const pa=dropGeo.attributes.position.array;
        pa[0]=Q.x;pa[1]=AY;pa[2]=0;pa[3]=Q.x;pa[4]=AY+(ny-AY)*u;pa[5]=0;
        dropGeo.attributes.position.needsUpdate=true;
        dropLine.computeLineDistances();
      }
      N.set(wx(clamp(xNext,-XLIM,XLIM)),clamp(wy(F.f(xNext)),0.14,6.2),0);
      const u2=clamp((animT-0.85)/0.15,0,1);
      ball.position.lerpVectors(P,N,u2);
    }else{tangent.visible=false;cross.visible=false;dropLine.visible=false;ball.position.copy(P);}
  }else{
    tangent.visible=false;cross.visible=false;dropLine.visible=false;
    ball.position.copy(P);
  }
  /* 误差对数条 */
  const lv=clamp((Math.log10(Math.max(1e-14,Math.abs(fy)))+14)/16,0,1);
  const h=0.15+lv*2.3;
  errBar.scale.y=h;errBar.position.y=AY+h/2;
  errM.color.setHex(0x8ce99a).lerp(tmpC.setHex(0xff6b6b),lv);
  errM.emissive.copy(errM.color).multiplyScalar(0.35);
  /* 跟随标签 */
  lblPt.position.copy(ball.position);lblPt.position.y+=0.45;
  if(tangent.visible){lblTan.position.copy(tangent.position);lblTan.position.y+=0.5;}
  if(cross.visible){lblCross.position.copy(cross.position);lblCross.position.y+=0.4;}
  if(status==='osc'||status==='div'){lblAlert.position.copy(ball.position);lblAlert.position.y+=0.95;}
}
function updateFx(dts){
  for(let i=0;i<NT;i++){
    const age=trailAge[i]+dts;
    trailAge[i]=age;
    if(age>2.8){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);}
    else{
      const f=1-age/2.8;
      m4.makeScale(0.55*f+0.001,0.55*f+0.001,0.55*f+0.001);
      m4.setPosition(trailPos[i].x,trailPos[i].y,trailPos[i].z);
      trailIM.setColorAt(i,tmpC.setHex(0x63e6be).multiplyScalar(0.25+0.75*f));
    }
    trailIM.setMatrixAt(i,m4);
  }
  trailIM.instanceMatrix.needsUpdate=true;
  if(trailIM.instanceColor)trailIM.instanceColor.needsUpdate=true;
  const dur=tglTrailOn?7:1.2;
  for(let i=0;i<NR;i++){
    const r=resids[i],age=r.age+dts;
    r.age=age;
    const f=1-age/dur;
    if(f<=0){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);}
    else{
      m4.compose(r.mid,r.q,tmpV.set(1,r.len,1));
      residIM.setColorAt(i,tmpC.setHex(0x66d9e8).multiplyScalar(0.2+0.8*f));
    }
    residIM.setMatrixAt(i,m4);
  }
  residIM.instanceMatrix.needsUpdate=true;
  if(residIM.instanceColor)residIM.instanceColor.needsUpdate=true;
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const F=FUNCS[fnIdx];
  if(!frozen&&playing){
    if(xNext===null)beginStep(F);
    if(!frozen){
      animT+=dts/STEP_T;
      if(animT>=1)finishStep(F);
    }
  }
  drawIter(F,dts);
  updateFx(dts);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
rebuildCurve();updateRoots();
setX0(1.7);setFn(1);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
