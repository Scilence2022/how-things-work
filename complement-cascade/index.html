<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>补体级联与膜攻击复合物 · 免疫的点名爆破队</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.bad{color:#ff6b6b}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="补体级联与膜攻击复合物" data-en="Complement Cascade & Membrane Attack Complex">补体级联与膜攻击复合物</h1>
  <div class="sub" data-zh="C1(或 MBL)点燃 C3 转化酶,C3b 以 2ⁿ 指数暴增铺满病原体;C5b 带 C6-C7-C8 锚上膜,C9 逐根插膜拼出 ~10 nm 跨膜孔,水盐涌入细菌胀破;宿主细胞靠 CD59 自带免炸牌 · 切换经典/凝集素/旁路三途径,开 C3 缺乏对照看细菌存活 · 拖动旋转 / 空格运行/暂停" data-en="C1 (or MBL) ignites the C3 convertase; C3b multiplies as 2^n and carpets the pathogen; C5b anchors C6-C7-C8, then C9 monomers slot in one by one into a ~10 nm transmembrane pore — water rushes in and the cell bursts; host cells carry CD59 as a do-not-kill tag · switch classical/lectin/alternative, try the C3-deficiency contrast · drag to orbit / Space = run/pause">C1(或 MBL)点燃 C3 转化酶,C3b 以 2ⁿ 指数暴增铺满病原体;C5b 带 C6-C7-C8 锚上膜,C9 逐根插膜拼出 ~10 nm 跨膜孔,水盐涌入细菌胀破;宿主细胞靠 CD59 自带免炸牌 · 切换经典/凝集素/旁路三途径,开 C3 缺乏对照看细菌存活 · 拖动旋转 / 空格运行/暂停</div>
</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="C3b 拷贝数" data-en="C3b copies">C3b 拷贝数</span><span class="v" id="stC3b">—</span>
  <span class="k" data-zh="C9 已插膜" data-en="C9 inserted">C9 已插膜</span><span class="v" id="stC9">—</span>
  <span class="k" data-zh="细菌状态" data-en="Bacterium">细菌状态</span><span class="v" id="stBac">—</span>

    <button class="abtn" id="btnLectin" data-zh="凝集素途径" data-en="Lectin">凝集素途径</button>

    <input id="sC9" type="range" min="8" max="18" step="1" value="12">

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 生物学锚点:C3 转化酶每秒切 ~1000 个 C3;MAC 内径 ~10 nm;C9 聚合体 12–18 聚;
   CD59=GPI 锚定膜蛋白,阻 C9/阻 C5b-8 插膜;C3 缺乏→反复化脓感染(虎克定律式渗透裂解) */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
const easeOut=p=>1-Math.pow(1-p,3);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
let playing=qs.get('pause')!=='1';          // 公共状态先声明(防 TDZ)
let labelsOn=qs.get('labels')!=='0';
const speedMul=clamp(parseFloat(qs.get('speed'))||1,0.25,3);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,55);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(1.0,2.8,13.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=42;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,9,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-7,5,-5);scene.add(fill);

/* ---- 材质 ---- */
const floorM=new THREE.MeshStandardMaterial({color:0x171b22,roughness:0.96});
const memM=new THREE.MeshStandardMaterial({color:0x74b3e8,transparent:true,opacity:0.2,roughness:0.25});
const cytoM=new THREE.MeshStandardMaterial({color:0x2e4a63,roughness:0.55,emissive:0x0c2233,emissiveIntensity:0.55});
const hostM=new THREE.MeshStandardMaterial({color:0x8fd0a8,transparent:true,opacity:0.18,roughness:0.3});
const abM=new THREE.MeshStandardMaterial({color:0xd6b24a,roughness:0.4,metalness:0.25});
const fragM=new THREE.MeshStandardMaterial({color:0x5b8cb8,roughness:0.5,transparent:true});
const nodeCols=[0xb197fc,0xffa94d,0xffd43b,0xff8787,0xe86aa6];

/* ---- 地面(细胞外液) ---- */
const floor=new THREE.Mesh(new THREE.CylinderGeometry(16,16,0.16,48),floorM);
floor.position.y=-3.4;scene.add(floor);

/* ---- 病原体(革兰阴性杆菌,示意) ---- */
const bacG=new THREE.Group();bacG.position.set(2.6,0.6,0);bacG.rotation.z=Math.PI/2;scene.add(bacG);
bacG.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.95,1.4,6,26),memM));
bacG.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.8,1.3,6,20),cytoM));
const bacCenter=v3(2.6,0.6,0);

/* 抗体 Y(经典途径的识别标签) */
function makeY(){
  const g=new THREE.Group();const arm=new THREE.CylinderGeometry(0.045,0.045,0.5,6);
  const a1=new THREE.Mesh(arm,abM);a1.position.set(0.17,0.18,0);a1.rotation.z=-0.62;
  const a2=new THREE.Mesh(arm,abM);a2.position.set(-0.17,0.18,0);a2.rotation.z=0.62;
  const st=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.45,6),abM);st.position.y=-0.22;
  g.add(a1,a2,st);return g;
}
const abs=[];
[[-0.55,0],[0,0.18],[0.55,-0.06]].forEach(o=>{
  const y=makeY();y.position.set(2.6+o[0],1.55+o[1]*0.2,o[1]);y.rotation.z=o[0]*-0.12;scene.add(y);abs.push(y);
});

/* ---- 级联节点(左侧弧线) ---- */
const NODEP=[v3(-6.4,-1.5,0.6),v3(-4.8,-0.35,0.3),v3(-3.2,0.6,0),v3(-1.7,1.45,0),v3(-0.35,2.1,0)];
const nodes=NODEP.map((p,i)=>{
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.2,16,12),
    new THREE.MeshStandardMaterial({color:nodeCols[i],roughness:0.3,emissive:nodeCols[i],emissiveIntensity:0.06}));
  m.position.copy(p);scene.add(m);return m;
});
const pathLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(NODEP),
  new THREE.LineBasicMaterial({color:0x6b7f96,transparent:true,opacity:0.3}));
scene.add(pathLine);
const pulse=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),new THREE.MeshBasicMaterial({color:0xffffff}));
pulse.visible=false;scene.add(pulse);

/* ---- MAC 组装位(细菌顶部) ---- */
const macG=new THREE.Group();macG.position.set(2.6,1.63,0);scene.add(macG);
const anchor=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,10),
  new THREE.MeshStandardMaterial({color:0xe07b39,roughness:0.35,emissive:0x8a2b00,emissiveIntensity:0.3}));
anchor.position.y=-0.16;anchor.visible=false;macG.add(anchor);
const termM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.3,emissive:0x1c5f9e,emissiveIntensity:0.35});
const term=[0,1,2].map(i=>{
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.11-0.012*i,10,8),termM);
  m.visible=false;macG.add(m);return m;});
const c9M=new THREE.MeshStandardMaterial({color:0xe86aa6,roughness:0.3,emissive:0x90183f,emissiveIntensity:0.32});
const c9Geo=new THREE.CylinderGeometry(0.072,0.072,0.62,10);
const c9s=[];for(let i=0;i<18;i++){const m=new THREE.Mesh(c9Geo,c9M);m.visible=false;macG.add(m);c9s.push(m);}
const pore=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.06,20),
  new THREE.MeshBasicMaterial({color:0x05070a,transparent:true,opacity:0.88}));
pore.position.y=-0.04;pore.visible=false;macG.add(pore);
function layoutC9(){                    // 按聚合数排环
  const r=0.24+0.011*c9Count;
  c9s.forEach((m,i)=>{
    const a=i/c9Count*Math.PI*2;
    m.position.set(Math.cos(a)*r,0.55,Math.sin(a)*r);
    m.visible=false;
  });
}
let c9Count=12;layoutC9();

/* C5b 飞行球 / C4b+C2a 合体球 */
const c5bMesh=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,10),
  new THREE.MeshStandardMaterial({color:0xff8787,roughness:0.3,emissive:0x801f1f,emissiveIntensity:0.4}));
c5bMesh.visible=false;scene.add(c5bMesh);
const cvM=new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.3,emissive:0xa34e00,emissiveIntensity:0.35});
const cvA=new THREE.Mesh(new THREE.SphereGeometry(0.14,10,8),cvM);cvA.visible=false;scene.add(cvA);
const cvB=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),cvM.clone());cvB.visible=false;scene.add(cvB);
/* 途径启动子(C1 / MBL) */
const initM=new THREE.Mesh(new THREE.SphereGeometry(0.24,14,12),
  new THREE.MeshStandardMaterial({color:0xb197fc,roughness:0.3,emissive:0x5f3dc4,emissiveIntensity:0.5}));
initM.visible=false;scene.add(initM);
const attachP=v3(2.05,1.48,0.28);

/* ---- C3b 调理素(实例化) ---- */
const C3BMAX=240;
const c3bIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.07,8,6),
  new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0x996b00,emissiveIntensity:0.5,roughness:0.35}),C3BMAX);
scene.add(c3bIM);
const c3bPos=[];
for(let i=0;i<C3BMAX;i++){

/* ---- 状态(先于所有闭包引用声明,防 TDZ) ---- */
let phase=0,phaseT=0,pathway='classical',defC3=false,slowMAC=false;
let speedK=1,burstDone=false,lastN=-1,c9In=0,copies=0;
let pulseT=1;const glow=[0,0,0,0,0];
let notifyT=0,notifyZ='',notifyE='';

/* ---- 标签 ---- */

addLabel(()=>L(pathway==='classical'?'C1qrs · 抗原-抗体复合物':pathway==='lectin'?'MBL-MASP · 甘露糖':'iC3bBb · 自发滴活',

const lblNotify=addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',v3(0,4.5,0),'o');

/* ---- 状态机 ---- */
const PHASE_ZH=['识别启动','C3 转化酶','C3b 放大','终末途径','MAC 组装','渗透裂解','宿主免炸'];
const PHASE_EN=['Recognition','C3 convertase','C3b burst','Terminal pathway','MAC assembly','Osmotic lysis','Host sparing'];
const PHASE_DUR=[1.6,1.8,3.6,1.6,5.0,4.4,3.8];
function notify(zh,en){notifyT=3.2;notifyZ=zh;notifyE=en;}
function resetAll(){
  burstDone=false;lastN=-1;c9In=0;copies=0;
  bacG.visible=true;bacG.scale.setScalar(1);macG.visible=true;
  c9s.forEach(m=>{m.visible=false;m.position.y=0.55;});
  layoutC9();
  term.forEach(m=>m.visible=false);c5bMesh.visible=false;
  cvA.visible=false;cvB.visible=false;initM.visible=false;
  anchor.visible=false;pore.visible=false;
  host.visible=false;hostM.opacity=0.18;
  for(let i=0;i<C3BMAX;i++)c3bIM.setMatrixAt(i,ZERO);
  c3bIM.instanceMatrix.needsUpdate=true;
  for(let i=0;i<40;i++)waterIM.setMatrixAt(i,ZERO);
  for(let i=0;i<26;i++)fragIM.setMatrixAt(i,ZERO);
  waterIM.instanceMatrix.needsUpdate=true;fragIM.instanceMatrix.needsUpdate=true;
  fragM.opacity=1;
}
function setPhase(i){
  if(defC3&&i>=3&&i<=5){notify('C3 缺乏:C3b 无法放大,级联在第三步断链','C3 deficiency: no amplification, cascade breaks at step 3');return;}
  resetAll();phase=i;phaseT=0;pulseT=(i>0&&i<5)?0:1;
  syncSteps();
}
function doBurst(){
  bacG.visible=false;macG.visible=false;abs.forEach(a=>a.visible=false);
  for(let i=0;i<40;i++)waterIM.setMatrixAt(i,ZERO);
  waterIM.instanceMatrix.needsUpdate=true;
  for(let i=0;i<26;i++){
    const f=frags[i];
    f.p.set(bacCenter.x+(Math.random()*2-1)*0.9,bacCenter.y+(Math.random()*2-1)*0.7,(Math.random()*2-1)*0.7);
    f.v.set(f.p.x-bacCenter.x,f.p.y-bacCenter.y,f.p.z).normalize().multiplyScalar(1.8+Math.random()*2.4);
  }
  notify(L('胀破:水沿渗透压涌入,细胞膜失稳碎裂','Lysis: water floods in along osmotic pressure, membrane ruptures'),
         'Lysis: water floods in, membrane ruptures');
}

/* ---- 相位驱动(纯函数于 phaseT,可暂停可跳步) ---- */
function updatePhase(dt0,dt){
  const t=phaseT;
  /* 节点点亮 */
  for(let k=0;k<5;k++){
    let tg=0;
    if(phase===6)tg=0;
    else if(defC3&&k>=3)tg=0;
    else if(phase>=5)tg=1;
    else if(k<phase)tg=1;
    else if(k===phase&&t>0.35)tg=1;
    glow[k]+=(tg-glow[k])*Math.min(1,dt0*6);
    nodes[k].material.emissiveIntensity=0.06+glow[k]*1.6;
  }
  /* 节点间脉冲 */
  if(pulseT<0.7&&phase>0&&phase<5){
    pulseT+=dt0;
    pulse.position.lerpVectors(NODEP[phase-1],NODEP[phase],clamp(pulseT/0.7,0,1));
    pulse.visible=pulseT<0.7;
  }else pulse.visible=false;
  /* 抗体与启动子 */
  const abShow=pathway==='classical'&&phase<6&&!burstDone;
  abs.forEach(a=>a.visible=abShow);
  if(pathway!=='alternative'&&phase===0){
    const p=easeOut(clamp(t/1.4,0,1));
    initM.visible=p<1;
    initM.position.lerpVectors(NODEP[0],attachP,p);
  }else initM.visible=false;
  /* C4b+C2a 汇合 */
  if(phase===1){
    const p=easeOut(clamp(t/1.1,0,1));
    cvA.visible=cvB.visible=p<1;
    cvA.position.lerpVectors(NODEP[1].clone().add(v3(-0.55,0.3,0)),NODEP[1],p);
    cvB.position.lerpVectors(NODEP[1].clone().add(v3(0.15,0.55,0)),NODEP[1],p);
  }else{cvA.visible=cvB.visible=false;}
  /* C3b 计数与铺膜 */
  if(phase===2){
    copies=defC3?Math.floor(3+t*2):Math.min(2.6e6,4*Math.pow(2,t*3.1));
    const n=defC3?3:Math.min(C3BMAX,Math.floor(4*Math.pow(2,t*2.1)));
    revealC3b(n);
  }else if(phase>=3&&phase<6){copies=2.6e6;revealC3b(C3BMAX);}
  else{copies=0;revealC3b(0);}
  /* C5b 飞向膜锚 */
  if(phase>=3&&phase<6&&!burstDone){
    const p=phase>3?1:easeOut(clamp(t/1.2,0,1));
    c5bMesh.visible=true;
    c5bMesh.position.lerpVectors(NODEP[3],v3(2.6,1.5,0),p);
  }else c5bMesh.visible=false;
  /* 终末途径:C6 C7 C8 依次挂锚 */
  anchor.visible=phase>=4&&phase<6&&!burstDone;
  if(phase>=4&&phase<6&&!burstDone){
    term.forEach((m,k)=>{
      const on=t>0.4+k*0.55||phase>4;
      m.visible=on;
      if(on){
        const p=phase>4?1:easeOut(clamp((t-0.4-k*0.55)/0.5,0,1));
        m.position.lerpVectors(NODEP[4],v3(0,-0.16+k*0.05,0.05),p);
      }
    });
  }else term.forEach(m=>m.visible=false);
  /* C9 逐根插膜 */
  if(phase>=4&&phase<6&&!burstDone){
    const dur2=PHASE_DUR[4]*(slowMAC?2.6:1)-2.4;
    const iv=dur2/c9Count;
    const t2=phase>4?1e9:t-2.4;
    c9In=t2<0?0:clamp(Math.floor(t2/iv)+1,0,c9Count);
    c9s.forEach((m,k)=>{
      if(k>=c9Count){m.visible=false;return;}
      if(k<c9In){
        const p=easeOut(clamp((t2-k*iv)/0.45,0,1));
        m.visible=true;m.position.y=0.55-0.67*p;
      }else m.visible=false;
    });
    pore.visible=phase===5||(phase===4&&c9In>=c9Count);
  }else{c9s.forEach(m=>m.visible=false);pore.visible=false;}
  /* 渗透胀破 */
  if(phase===5){
    if(!burstDone){
      bacG.scale.setScalar(1+easeOut(clamp(t/2.4,0,1))*0.35);
      waterP.forEach(w=>{
        w.t+=dt*0.9;if(w.t>1)w.t=0;
        const dir=v3(Math.cos(w.a),0.4,Math.sin(w.a)).normalize();
        waterIM.setMatrixAt(waterP.indexOf(w),
          new THREE.Matrix4().setPosition(bacCenter.clone().add(dir.multiplyScalar(w.r*(1-w.t)))));
      });
      waterIM.instanceMatrix.needsUpdate=true;
      if(t>=2.6)doBurst();
    }else{
      for(let i=0;i<26;i++){
        const f=frags[i];f.v.y-=1.6*dt;f.p.addScaledVector(f.v,dt);
        const m=new THREE.Matrix4().makeRotationFromEuler(f.e);
        m.scale(v3(1,1,1));m.setPosition(f.p);fragIM.setMatrixAt(i,m);
      }
      fragIM.instanceMatrix.needsUpdate=true;
      fragM.opacity=clamp((4.4-t)/1.4,0,1);
    }
  }else{waterP.forEach(w=>{if(w.t>0&&w.t<1)w.t=1;});}
  /* 宿主免炸演示 */
  if(phase===6){
    host.visible=true;
    hostM.opacity=Math.min(0.18,t*0.15);
    gray9.forEach((m,i)=>{
      const pt=clamp((t-0.3-i*0.45)/1.5,0,1);
      m.visible=pt<1;
      if(m.visible){
        const a=v3(4.6,2.6,-1.2+i*0.3),b=v3(5.4,2.8,-1.6+i*0.4);
        m.position.lerpVectors(a,b,Math.sin(pt*Math.PI));
      }
    });
  }else{host.visible=false;gray9.forEach(m=>m.visible=false);}
}
function revealC3b(n){
  if(n===lastN)return;lastN=n;
  const m=new THREE.Matrix4();
  for(let i=0;i<C3BMAX;i++){
    if(i<n){m.makeScale(1,1,1);m.setPosition(c3bPos[i]);c3bIM.setMatrixAt(i,m);}
    else c3bIM.setMatrixAt(i,ZERO);
  }
  c3bIM.instanceMatrix.needsUpdate=true;
}

/* ---- 讲解步骤 ---- */
const STEPS=[
  {zh:'识别启动:抗原-抗体复合物点亮 C1qrs;凝集素途径由 MBL 认病原体甘露糖;旁路靠 C3 自发水解',en:'Recognition: Ag-Ab complexes light C1qrs; MBL binds mannose; alternative starts by spontaneous C3 hydrolysis'},
  {zh:'C3 转化酶:C4b2a(旁路为 C3bBb)坐上病原体表面,是整条级联的心脏',en:'C3 convertase: C4b2a (or C3bBb) seats on the pathogen — the heart of the cascade'},
  {zh:'放大:每个转化酶每秒切 ~1000 个 C3,C3b 铺满病原体并 2ⁿ 倍增(调理)',en:'Amplification: each convertase cuts ~1000 C3/s; C3b carpets the cell, doubling exponentially (opsonization)'},
  {zh:'终末启动:C5 转化酶切出 C5b,与 C6-C7-C8 依次锚定到膜上',en:'Terminal start: C5 convertase frees C5b; C6-C7-C8 anchor sequentially into the membrane'},
  {zh:'MAC 组装:10–18 个 C9 聚合成环,插入脂双层拼出 ~10 nm 跨膜孔',en:'MAC assembly: 10-18 C9 monomers polymerise into a ring punching a ~10 nm transmembrane pore'},
  {zh:'渗透裂解:孔道无选择放行离子,水顺渗透压涌入,细菌胀破',en:'Osmotic lysis: the pore passes ions freely; water rushes in and the cell bursts'},
  {zh:'自家免炸:宿主 CD59 挡住 C9 聚合;C3 缺乏者失去放大级联→反复化脓感染',en:'Host sparing: CD59 blocks C9; C3 deficiency breaks amplification → recurrent pyogenic infections'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;setPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  activeStep=phase;
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 统计 ---- */
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.round(n);
function updateStats(){
  document.getElementById('stC3b').innerHTML=fmt(copies)+'<small> 拷贝</small>';
  document.getElementById('stC9').innerHTML=(phase>=5?c9Count:c9In)+'<small> / '+c9Count+'</small>';
  const st=document.getElementById('stBac');
  const txt=burstDone?L('已裂解','lysed'):(phase===5?L('胀大中','swelling'):(defC3?L('存活(C3 缺乏)','survives (C3−)'):(phase>=4?L('受攻','attacked'):L('完好','intact'))));
  st.textContent=txt;st.className='v'+(burstDone?' bad':(defC3?'':' ok'));
  document.getElementById('stPh').textContent=L(PHASE_ZH[phase],PHASE_EN[phase]);
}

  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=playing?dt0*speedK*speedMul:0;
  if(playing){
    phaseT+=dt;
    if(defC3&&phase===2&&phaseT>2.2){
      phase=6;phaseT=0;syncSteps();
      notify('C3 缺乏:级联断链,细菌存活——这就是反复化脓感染的免疫学','C3 deficiency: the cascade breaks, bacteria survive — the immunology of recurrent abscesses');
    }
    const dur=PHASE_DUR[phase]*(phase===4&&slowMAC?2.6:1);
    if(phaseT>=dur){
      phaseT=0;phase=(phase+1)%7;
      pulseT=(phase>0&&phase<5)?0:1;
      if(phase===0)resetAll();
      syncSteps();
    }
  }
  if(notifyT>0)notifyT-=dt0;
  updatePhase(dt0,dt);
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    const t=r.text();const on=labelsOn&&r.vis()&&t!=='';
    r.o.visible=on;if(on)r.o.element.textContent=t;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();applyLang();resetAll();setPlayLabel();
start();
