<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四杆机构 · Grashof 条件与急回特性</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#63e6be;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0ca678;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.c { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.k { border-color: rgba(99,230,190,.9); color: #c3f5e5; }
  .lbl.r { border-color: rgba(255,159,40,.9); color: #ffd9a3; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.c { border-color: rgba(25,113,194,.9); color: #1971c2; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #63e6be; }
  #stats .v.bad { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.c { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.k { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.r { color: #ffd9a3; border-color: rgba(255,159,40,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1; min-width: 100px;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 8px; font-size: 12px; font-weight: 600;
    transition: border-color .15s, color .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: var(--acc); background: rgba(99,230,190,.10); color: var(--text); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(99,230,190,.10); border-color: rgba(99,230,190,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,166,120,.08); border-color: rgba(12,166,120,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #c3f5e5; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="四杆机构：Grashof 条件与急回特性" data-en="Four-Bar Linkage: Grashof & quick-return">四杆机构：Grashof 条件与急回特性</h1>
  <div class="sub" data-zh="最短杆+最长杆 ≤ 其余两杆之和,最短杆才能整周转;曲柄匀速、摇杆却急回——工作慢回程快;连杆点画出漂亮的曲线 · 空格播放/暂停" data-en="Shortest + longest ≤ the other two, or the crank jams; constant crank speed still gives quick-return rockers; the coupler point draws beautiful curves · Space = play/pause">最短杆+最长杆 ≤ 其余两杆之和,最短杆才能整周转;曲柄匀速、摇杆却急回——工作慢回程快;连杆点画出漂亮的曲线 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <span class="k" data-zh="Grashof 检验" data-en="Grashof test">Grashof 检验</span><span class="v g" id="stG">—</span>

  <div class="row"><label data-zh="转速" data-en="speed">转速</label><input id="spd" type="range" min="10" max="100" step="5" value="50"><span class="val" id="spdVal">0.50×</span></div>

    <a href="../escapement/" data-zh="机构家族:擒纵(规划中)" data-en="mechanism family: escapement (planned)">机构家族:擒纵(规划中)</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.frame.color.set(THEME === 'light' ? 0x9aa4b2 : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('四杆机构 · Grashof 与急回', 'Four-Bar · Grashof & quick-return');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.3, 4.6, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.1, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(4, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  crank: mat(0x74c0fc, { metalness: 0.5, roughness: 0.35 }),
  coupler: mat(0x63e6be, { metalness: 0.5, roughness: 0.35 }),
  rocker: mat(0xffa94d, { metalness: 0.5, roughness: 0.35 }),
  pin: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  trace: new THREE.MeshBasicMaterial({ color: 0xb197fc }),
  jam: new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.9 }),
};

/* ================= 机构参数 ================= */
const O1 = new THREE.Vector2(0, 0);        // 曲柄中心
const O4 = new THREE.Vector2(2.5, 0);      // 摇杆中心
const R1 = 0.8;                            // 曲柄(最短)
const R2 = 2.6;                            // 连杆
let R3 = 1.9;                              // 摇杆(可调)
const D = 2.5;                             // 机架
const COUPLER_PT = 0.9;                    // 连杆延长线上的描点(距 B)

function grashofOK() {
  const lens = [R1, R2, R3, D];
  lens.sort((a, b) => a - b);
  return lens[0] + lens[3] <= lens[1] + lens[2] + 1e-9;
}
/* 解四杆:给定曲柄角 θ,求 B;无解返回 null */
function solve(th) {
  const ax = R1 * Math.cos(th), ay = R1 * Math.sin(th);
  const dx = ax - O4.x, dy = ay - O4.y;
  const dist = Math.hypot(dx, dy);
  if (dist > R2 + R3 || dist < Math.abs(R2 - R3)) return null;
  const a = (R2 * R2 - R3 * R3 + dist * dist) / (2 * dist);
  const h2 = R2 * R2 - a * a;
  if (h2 < 0) return null;
  const h = Math.sqrt(h2);
  const mx = ax + a * dx / dist, my = ay + a * dy / dist;
  return { x: mx + h * dy / dist, y: my - h * dx / dist, ax, ay };
}

/* ================= 场景物件 ================= */
/* 机构放在 x-y 平面,z=0;镜头斜看 */
const rig = new THREE.Group();
rig.position.set(-0.6, 0.2, 0);
scene.add(rig);
const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.16, 4.6), M.floor);
floor.position.set(1.6, -1.15, 0);
scene.add(floor);
/* 机架 */
const groundBar = new THREE.Mesh(new THREE.BoxGeometry(D + 0.5, 0.1, 0.14), M.frame);
groundBar.position.set(D / 2, 0, 0);
rig.add(groundBar);
for (const p of [O1, O4]) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 0.12), M.frame);
  post.position.set(p.x, -0.35, 0);
  rig.add(post);
}
function linkMesh(material) {
  const g = new THREE.Group();
  const bar = new THREE.Mesh(new THREE.BoxGeometry(1, 0.14, 0.1), material);
  bar.geometry.translate(0.5, 0, 0);
  g.add(bar);
  return g;
}
const crankG = linkMesh(M.crank);
crankG.scale.x = R1 + 0.12;
rig.add(crankG);
const couplerG = linkMesh(M.coupler);
couplerG.scale.x = R2 + 0.12;
rig.add(couplerG);
const rockerG = linkMesh(M.rocker);
rockerG.scale.x = R3 + 0.12;
rig.add(rockerG);
function pinMesh() {
  return new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.3, 14), M.pin);
}
const pins = [pinMesh(), pinMesh(), pinMesh(), pinMesh()];
pins.forEach(p => rig.add(p));
/* 连杆描点小球 */
const traceBall = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), M.trace);
rig.add(traceBall);
/* 连杆曲线轨迹 */
const TRACE_N = 600;
const traceGeo = new THREE.BufferGeometry();
traceGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRACE_N * 3), 3));
traceGeo.setDrawRange(0, 0);
const traceLine = new THREE.Line(traceGeo, new THREE.LineBasicMaterial({ color: 0xb197fc, transparent: true, opacity: 0.85 }));
rig.add(traceLine);
let traceLen = 0;
function pushTrace(x, y) {
  const a = traceGeo.attributes.position;
  if (traceLen >= TRACE_N) { a.array.copyWithin(0, 3); a.setXYZ(TRACE_N - 1, x, y, 0); }
  else { a.setXYZ(traceLen, x, y, 0); traceLen++; }
  a.needsUpdate = true;
  traceGeo.setDrawRange(0, traceLen);
}

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let theta = 0.6;
let jammed = false;
let jamLo = 0, jamHi = Math.PI * 2;      // 可动弧段
let jamDir = 1;
/* 扫描可动范围 */
function scanArc() {
  const N = 720;
  let lo = null, hi = null;
  for (let i = 0; i <= N; i++) {
    const th = i / N * Math.PI * 2;
    if (solve(th)) { if (lo === null) lo = th; hi = th; }
  }
  jammed = lo === null || hi - lo < Math.PI * 2 - 0.02;
  jamLo = lo === null ? 0 : lo + 0.02;
  jamHi = hi === null ? Math.PI : hi - 0.02;
}
/* 急回统计:摇杆极值处对应曲柄角 */
function quickReturn() {
  if (!grashofOK()) return null;
  const N = 720;
  /* 解卷绕:以摇杆平均方向为参考,避免 atan2 的 ±π 分支坑 */
  let sumSin = 0, sumCos = 0;
  const samples = [];
  for (let i = 0; i <= N; i++) {
    const th = i / N * Math.PI * 2;
    const B = solve(th);
    if (!B) continue;
    const ang = Math.atan2(B.y - O4.y, B.x - O4.x);
    sumSin += Math.sin(ang); sumCos += Math.cos(ang);
    samples.push([th, ang]);
  }
  if (!samples.length) return null;
  const m = Math.atan2(sumSin, sumCos);
  let aMin = 9, aMax = -9, thMin = 0, thMax = 0;
  for (const [th, ang] of samples) {
    const a = ((ang - m + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    if (a < aMin) { aMin = a; thMin = th; }
    if (a > aMax) { aMax = a; thMax = th; }
  }
  /* 极位夹角 = 两极位间曲柄转角(小弧) */
  let dth = Math.abs(thMin - thMax);
  if (dth > Math.PI) dth = Math.PI * 2 - dth;
  const K = (Math.PI + dth) / (Math.PI - dth);
  return { swing: (aMax - aMin) * 180 / Math.PI, K };
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblCrank = addLabel(() => L(`曲柄 r₁=${R1}`, `crank r₁=${R1}`), new THREE.Vector3(0, 0.4, 0), 'c', crankG);
const lblRocker = addLabel(() => L(`摇杆 r₃=${R3.toFixed(2)}`, `rocker r₃=${R3.toFixed(2)}`), new THREE.Vector3(R3 / 2 + 0.1, 0.4, 0), 'r', rockerG);
const lblStatus = addLabel(() => jammed
  ? L('卡死!Grashof 不满足:曲柄转不了一整圈,只能来回撞墙', 'JAMMED! Grashof fails — the crank cannot pass, it just slams back and forth')
  : L('曲柄摇杆机构:曲柄匀速整周,摇杆变速摆动', 'crank-rocker: the crank turns evenly, the rocker swings with quick-return'),
  new THREE.Vector3(1.1, 3.3, 0), jammed ? 'bad' : 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '四杆全家福', be: 'Meet the four bars',
    d: '机架(灰)固定两个转轴,曲柄(蓝)、连杆(绿)、摇杆(橙)依次铰接——日常机器里最常见的运动链。',
    de: 'A frame holding two pivots; crank, coupler, rocker hinged in turn — the most common linkage in machines.',
    act: () => setR3(1.9) },
  { b: 'Grashof 条件', be: 'The Grashof condition',
    d: '最短杆 + 最长杆 ≤ 其余两杆之和 → 最短杆(曲柄)才能相对邻杆整周旋转。当前组合在右下角实时判定。',
    de: 'Shortest + longest ≤ the other two — only then can the shortest bar spin fully. Live verdict bottom-right.',
    act: () => setR3(1.9) },
  { b: '推向卡死边界', be: 'Push to the jam',
    d: '把摇杆缩短越过临界值:三杆共线的位置再也通不过——曲柄被卡在扇区里来回撞。真实机器里这叫「死点锁死」。',
    de: 'Shorten the rocker past critical: the collinear position blocks the crank — it rocks between walls. Real machines call this lock-up.',
    act: () => setR3(0.82) },
  { b: '急回特性', be: 'Quick-return',
    d: '曲柄匀速,摇杆两个极限位置间的曲柄转角却不一样——工作行程慢而有力,回程快而省时,急回比 K>1。刨床、雨刮全靠它。',
    de: 'Constant crank speed, unequal crank angles between rocker extremes — slow powerful cut, quick idle return. K > 1.',
    act: () => setR3(1.9) },
  { b: '连杆曲线的魔法', be: 'Coupler-curve magic',
    d: '连杆延长线上的描点画出六次方曲线——电影放映机抓片爪、步行机器人腿部,都是照着这条曲线设计的。',
    de: 'A point on the coupler draws a sixth-order curve — film-projector claws and walking-robot legs are designed around it.',
    act: () => setR3(2.3) },
];
function stepIndex() {
  if (jammed) return 2;
  if (R3 > 2.2) return 4;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elR3 = document.getElementById('r3');
const elR3Val = document.getElementById('r3Val');
const tglTrace = document.getElementById('tglTrace');
const tglRotate = document.getElementById('tglRotate');
const stG = document.getElementById('stG'), stSw = document.getElementById('stSw'),
  stK = document.getElementById('stK'), stS = document.getElementById('stS');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setR3(v) {
  R3 = clamp(v, 0.7, 2.8);
  elR3.value = Math.round(R3 * 100);
  elR3Val.textContent = R3.toFixed(2);
  rockerG.scale.x = R3 + 0.12;
  scanArc();
  traceLen = 0; traceGeo.setDrawRange(0, 0);
}
elR3.addEventListener('input', () => setR3(parseInt(elR3.value, 10) / 100));
elSpd.addEventListener('input', () => { speed = parseInt(elSpd.value, 10) / 100; elSpdVal.textContent = speed.toFixed(2) + '×'; });
document.getElementById('pQuick').addEventListener('click', () => setR3(1.9));
document.getElementById('pJam').addEventListener('click', () => setR3(0.82));
document.getElementById('pDouble').addEventListener('click', () => setR3(2.7));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglTrace.addEventListener('change', () => { traceLine.visible = tglTrace.checked; traceBall.visible = tglTrace.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; document.getElementById('tglLabels').dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    if (jammed) {
      theta += jamDir * dts * 0.8;
      if (theta > jamHi) { theta = jamHi; jamDir = -1; }
      if (theta < jamLo) { theta = jamLo; jamDir = 1; }
    } else {
      theta = (theta + dts * 0.9) % (Math.PI * 2);
    }
  }
  const B = solve(theta);
  const A = new THREE.Vector2(R1 * Math.cos(theta), R1 * Math.sin(theta));
  crankG.position.set(A.x, A.y, 0);
  crankG.rotation.z = theta;
  pins[0].position.set(O1.x, O1.y, 0);
  pins[1].position.set(A.x, A.y, 0);
  if (B) {
    couplerG.position.set(A.x, A.y, 0);
    couplerG.rotation.z = Math.atan2(B.y - A.y, B.x - A.x);
    rockerG.position.set(O4.x, O4.y, 0);
    rockerG.rotation.z = Math.atan2(B.y - O4.y, B.x - O4.x);
    pins[2].position.set(B.x, B.y, 0);
    pins[3].position.set(O4.x, O4.y, 0);
    /* 描点:B 沿 BA 方向延长 */
    const ux = (A.x - B.x), uy = (A.y - B.y);
    const ul = Math.hypot(ux, uy) || 1;
    const px = B.x + ux / ul * COUPLER_PT, py = B.y + uy / ul * COUPLER_PT;
    traceBall.position.set(px, py, 0.05);
    if (playing && tglTrace.checked) pushTrace(px, py);
  }
  const gOK = grashofOK();
  stG.textContent = gOK ? L('满足 ✓', 'holds ✓') : L('不满足 ✗', 'fails ✗');
  stG.className = 'v ' + (gOK ? 'g' : 'bad');
  const qr = quickReturn();
  if (qr && gOK) {
    stSw.textContent = qr.swing.toFixed(0) + '°';
    stK.textContent = qr.K.toFixed(2);
  } else {
    stSw.textContent = '—';
    stK.textContent = '—';
  }
  stS.textContent = jammed ? L('卡死区', 'jammed') : L('整周旋转', 'full rotation');
  stS.className = 'v ' + (jammed ? 'bad' : 'g');
  lblStatus.element.textContent = jammed
    ? L('卡死!Grashof 不满足:曲柄转不了一整圈,只能来回撞墙', 'JAMMED! Grashof fails — the crank cannot pass, it just slams back and forth')
    : L('曲柄摇杆机构:曲柄匀速整周,摇杆变速摆动', 'crank-rocker: the crank turns evenly, the rocker swings with quick-return');
  lblStatus.element.className = 'lbl ' + (jammed ? 'bad' : 'st');

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setR3(1.9);
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
