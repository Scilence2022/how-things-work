<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菌根网络 · 植物用碳雇真菌找磷</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#38d9a9;
    --bg:#0f1213; --panel:rgba(15,18,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,18,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,18,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0ca678;
    --bg:#eef2f4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(56,217,169,.9); color: #c9f7ea; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(245,193,78,.9); color: #ffe9b8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.p { border-color: rgba(176,122,232,.9); color: #e3d2ff; }
  :root[data-theme="light"] .lbl.o { color:#0b7253; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#a06a00; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.p { color:#7048c8; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #38d9a9; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #c9f7ea; border-color: rgba(56,217,169,.7); }
  .chip.g { color: #ffe9b8; border-color: rgba(245,193,78,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.p { color: #e3d2ff; border-color: rgba(176,122,232,.7); }
  :root[data-theme="light"] .chip.o { color:#0b7253; } :root[data-theme="light"] .chip.g { color:#a06a00; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.p { color:#7048c8; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(56,217,169,.6); background: rgba(56,217,169,.12); color: var(--text); }
  .abtn.warn { border-color: rgba(255,107,107,.55); background: rgba(255,107,107,.10); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(12,166,120,.55); background: rgba(12,166,120,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(56,217,169,.10); border-color: rgba(56,217,169,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,166,120,.08); border-color: rgba(12,166,120,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #c9f7ea; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="菌根网络 · 植物用碳雇真菌找磷" data-en="Mycorrhizal Network · Plants Hire Fungi for Phosphorus, Paying in Carbon">菌根网络 · 植物用碳雇真菌找磷</h1>
  <div class="sub" data-zh="陆地九成植物的根都包着真菌:菌丝把吸收面积放大 10–100 倍,替根去够磷——磷在土壤里的扩散只有毫米级、慢得像蜡油;植物用光合碳付账(约 13% 的净同化碳流向真菌),真菌送回磷、氮和水;菌丝还能把几株植物连成网,幼苗建株时从网络里「借」碳启动;全球每年约 130 亿吨碳沿这条地下暗渠流动 · 时间加速演示,数字为文献量级 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Nine in ten land plants wrap their roots in fungi: hyphae enlarge absorbing area 10–100× and reach for phosphorus on the root's behalf — soil P diffuses only millimetres, slow as candle wax; plants pay with photosynthetic carbon (about 13% of net assimilated carbon goes to the fungus), which sends back P, N and water; hyphae also wire several plants into one web, and seedlings “borrow” carbon from it to build themselves; each year ~13 billion tonnes of carbon flow down this underground channel · time-dilated demo, figures are literature-scale · 3D interactive demo · drag to orbit / Space = run/pause">菌根网络 · 植物用碳雇真菌找磷</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="吸收面积放大(幼苗)" data-en="Area gain (seedling)">吸收面积放大(幼苗)</span><span class="v" id="stMul">—</span>
  <span class="k" data-zh="碳流量" data-en="Carbon flow">碳流量</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="磷流量(幼苗)" data-en="P flow (seedling)">磷流量(幼苗)</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="网络连接数" data-en="Web links">网络连接数</span><span class="v" id="stEdges">—</span>
  <span class="k" data-zh="幼苗状态" data-en="Seedling">幼苗状态</span><span class="v" id="stSeed">—</span>
</div>

<div id="plot">
  <h3 data-zh="幼苗磷摄入(紫)与碳支出(金)· 剪断菌丝看双双跌落" data-en="Seedling P uptake (violet) vs carbon cost (gold) — cut the web and watch both fall">幼苗磷摄入(紫)与碳支出(金)· 剪断菌丝看双双跌落</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="青绿丝线:菌丝网络(发光=活的)" data-en="teal threads: hyphal web (glow = alive)">青绿丝线:菌丝网络(发光=活的)</span>
    <span class="chip.g" data-zh="金色粒子:糖(碳)沿根→真菌" data-en="gold: sugar (carbon) flows root → fungus">金色粒子:糖(碳)沿根→真菌</span>
    <span class="chip.p" data-zh="紫色粒子/晶体:磷回流根、远处磷矿" data-en="violet beads/crystals: P returns to root, distant rock">紫色粒子/晶体:磷回流根、远处磷矿</span>
    <span class="chip.r" data-zh="白色:根系 · 点「切断网络」菌丝熄灭断开" data-en="white: roots · “Cut web” snuffs the severed hyphae">白色:根系 · 点「切断网络」菌丝熄灭断开</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnFar" data-zh="拖远磷矿" data-en="Push rock away">拖远磷矿</button>
    <button class="abtn" id="btnCut">切断网络</button>
    <button class="abtn on" id="btnCross" data-zh="剖视开关" data-en="Cutaway view">剖视开关</button>
  </div>
  <div class="row"><label data-zh="土壤磷距离" data-en="Soil P distance">土壤磷距离</label><input id="sDist" type="range" min="0.5" max="5" step="0.1" value="2"><span class="val" id="sDistVal">2.0 m</span></div>
  <div class="row"><label data-zh="植物给碳率" data-en="Plant carbon rate">植物给碳率</label><input id="sRate" type="range" min="5" max="25" step="1" value="13"><span class="val" id="sRateVal">13%</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglFlow" type="checkbox" checked> <span data-zh="粒子流" data-en="Particles">粒子流</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="缓转" data-en="Auto-orbit">缓转</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../root-nodule/" data-zh="根瘤:另一种共生,细菌固氮" data-en="root-nodule: the other symbiosis, bacteria fixing N">根瘤:另一种共生,细菌固氮</a>
    <a href="../transpiration/" data-zh="蒸腾作用:地上部分的水分经济学" data-en="transpiration: the above-ground water economy">蒸腾作用:地上部分的水分经济学</a>
    <a href="../carbon-cycle/" data-zh="碳循环:地下碳泵的一环" data-en="carbon-cycle: the underground carbon pump">碳循环:地下碳泵的一环</a>
    <a href="../nitrogen-cycle/" data-zh="氮循环:氮也在网里跑" data-en="nitrogen-cycle: nitrogen rides the same web">氮循环:氮也在网里跑</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const TAU = Math.PI * 2;
const rnd = s => { const x = Math.sin(s * 12.9898) * 43758.5453; return x - Math.floor(x); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10151a, 26, 72);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10151a : 0xdce6ee);
  scene.fog.color = new THREE.Color(dark ? 0x10151a : 0xdce6ee);
  groundM.color.setHex(dark ? 0x33422a : 0x9db07a);
  soilM.color.setHex(dark ? 0x6b5138 : 0xb99a6f);
  frameM.color.setHex(dark ? 0x39424e : 0x93a2b2);
  grainM.color.setHex(dark ? 0x453a2c : 0x8f7f62);
  grassM.color.setHex(dark ? 0x3d7a44 : 0x5d9a4f);
  stemM.color.setHex(dark ? 0x5a7a4a : 0x6f8f5c);
  rootM.color.setHex(dark ? 0xe8e2d2 : 0xbdb49e);
  leafAdultM.color.setHex(dark ? 0x3f8f4f : 0x4f9d4a);
  seedGreen.setHex(dark ? 0x6fbf5f : 0x74b95a);
}

/* ---------------- 渲染器 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) { webglOK = false; }
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 160);
camera.position.set(9.5, 3.4, 11.5);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(1.0, -1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 40;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xd8e8f0, 0x241a10, 0.65));
const key = new THREE.DirectionalLight(0xfff0d8, 1.15);
key.position.set(7, 10, 5);
scene.add(key);
const fillL = new THREE.DirectionalLight(0xcfe8dd, 0.3);
fillL.position.set(-8, 4, -6);
scene.add(fillL);

/* ---------------- 全局状态 ---------------- */
let dist = clamp(qsFloat('d', 2), 0.5, 5), rate = 13;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let labelsOn = true, flowOn = true, cross = true, cut = false;
let simT = 0, phaseIdx = 0, notifyT = 0, nz = '', ne = '';
const distF = () => clamp(1.3 - 0.11 * dist, 0.55, 1.25);
function notify(z, e, t = 3.4) { notifyT = t; nz = z; ne = e; }

/* ---------------- 材质 ---------------- */
const groundM = new THREE.MeshStandardMaterial({ color: 0x33422a, roughness: 1 });
const soilM = new THREE.MeshStandardMaterial({ vertexColors: true, color: 0x6b5138, roughness: 0.98, transparent: true, opacity: 0.42, depthWrite: false, side: THREE.DoubleSide });
const frameM = new THREE.LineBasicMaterial({ color: 0x39424e, transparent: true, opacity: 0.5 });
const grainM = new THREE.MeshStandardMaterial({ color: 0x453a2c, roughness: 1 });
const grassM = new THREE.MeshStandardMaterial({ color: 0x3d7a44, roughness: 0.9 });
const stemM = new THREE.MeshStandardMaterial({ color: 0x5a7a4a, roughness: 0.8 });
const rootM = new THREE.MeshStandardMaterial({ color: 0xe8e2d2, roughness: 0.85 });
const leafAdultM = new THREE.MeshStandardMaterial({ color: 0x3f8f4f, roughness: 0.7 });
const seedGreen = new THREE.Color(0x6fbf5f), seedYellow = new THREE.Color(0xc9b83f);

/* ---------------- 图算法:邻接 / BFS / 路由 / 剪断 ---------------- */
let adj = [], chainGrown = 1, chainOn = true, cutSet = new Set(), aliveEdges = 0;
const pRoute = [null, null, null], sugarRoute = [null, null, null];
function buildAdj() {
  adj = nodes.map(() => []);
  edges.forEach((e, ei) => {
    if (e.chain ? chainOn : !cutSet.has(ei)) { adj[e.a].push(e.b); adj[e.b].push(e.a); }
  });
  aliveEdges = adj.reduce((s, a) => s + a.length, 0) >> 1;
}
function bfs(from) {
  const par = new Int32Array(nodes.length).fill(-1); par[from] = from;
  const qq = [from];
  for (let h = 0; h < qq.length; h++) for (const m of adj[qq[h]]) if (par[m] < 0) { par[m] = qq[h]; qq.push(m); }
  return par;
}
function route(from, to) {
  const par = bfs(from);
  if (par[to] < 0) return null;
  const p = [to];
  while (p[p.length - 1] !== from) p.push(par[p[p.length - 1]]);
  p.reverse();
  const pts = p.map(i => nodes[i].p), seg = [0]; let len = 0;
  for (let i = 1; i < pts.length; i++) { len += pts[i].distanceTo(pts[i - 1]); seg.push(len); }
  return { pts, seg, len };
}
function routeAt(rt, s, out) {
  const d = clamp(s, 0, 1) * rt.len;
  let i = 1; while (i < rt.seg.length - 1 && rt.seg[i] < d) i++;
  const t = (d - rt.seg[i - 1]) / Math.max(1e-6, rt.seg[i] - rt.seg[i - 1]);
  return out.copy(rt.pts[i - 1]).lerp(rt.pts[i], t);
}
function segDist(p, a, b) {
  const ab = b.clone().sub(a), t = clamp(p.clone().sub(a).dot(ab) / Math.max(1e-6, ab.lengthSq()), 0, 1);
  return p.distanceTo(a.clone().addScaledVector(ab, t));
}
function computeCut() {
  cutSet.clear();
  if (cut) for (const si of [1, 2]) {
    const A = nodes[rootN[si]].p, B = nodes[front0].p;
    const cand = edges.map((e, i) => ({ i, d: segDist(nodes[e.a].p.clone().add(nodes[e.b].p).multiplyScalar(0.5), A, B) }))
      .filter(o => !edges[o.i].chain).sort((x, y) => x.d - y.d);
    for (const o of cand) {
      cutSet.add(o.i); buildAdj();
      if (bfs(rootN[0])[rockN] < 0) { cutSet.delete(o.i); buildAdj(); continue; }
      if (bfs(rootN[si])[rockN] < 0) break;
    }
  }
  buildAdj();
  const c = baseGeo.attributes.color.array, gp = baseGeo.attributes.position.array;
  let w = 0;
  edges.forEach((e, i) => {
    if (e.chain) return;
    const b = 0.75 + 0.45 * rnd(i + 40);
    const dead = cutSet.has(i);
    const r = dead ? 0.02 : 0.42 * b, g = dead ? 0.03 : 0.95 * b, bl = dead ? 0.03 : 0.8 * b;
    for (const nd of [e.a, e.b]) {
      gp[w * 3] = nodes[nd].p.x; gp[w * 3 + 1] = nodes[nd].p.y; gp[w * 3 + 2] = nodes[nd].p.z;
      c[w * 3] = r; c[w * 3 + 1] = g; c[w * 3 + 2] = bl; w++;
    }
  });

  baseGeo.attributes.color.needsUpdate = true;
  buildSugar();
}
function rebuildRoutes() {
  for (let pi = 0; pi < 3; pi++) {
    pRoute[pi] = route(rockN, rootN[pi]);
    plants[pi].target = pRoute[pi] ? 0 : 1;

}

  for (let pi = 0; pi < 3; pi++) {
    const par = bfs(rootN[pi]), opts = [];
    par.forEach((v, i) => { if (v >= 0 && i !== rootN[pi]) opts.push(i); });
    if (opts.length) sugarRoute[pi] = route(rootN[pi], opts[Math.floor(rnd(pi + 60) * opts.length)]);
  }
}
/* 幼苗靠少数几条桥接菌丝挂上共同网络(剪桥 = 切断幼苗) */
function nearestNode(p, maxD, labOk) {
  let bi = -1, bd = maxD * maxD;
  nodes.forEach((n, i) => {
    if (!labOk(n.label)) return;
    const d = n.p.distanceToSquared(p);
    if (d < bd) { bd = d; bi = i; }
  });
  return bi;
}

    let prev = rootN[si];
    for (let k = 1; k <= 3; k++) {
      const t = k / 3;
      const q = V(base.x + Math.cos(a) * len * t, 0, base.z + Math.sin(a) * len * t);
      q.y = clamp(-0.45 - 0.55 * t - 0.3 * rnd(b * 5 + k + 3), -3.6, -0.5);
      const n = addNode(q, si); cellAdd(n); tryEdge(prev, n); prev = n;
    }

    if (far < 0) far = nearestNode(nodes[prev].p, 3.0, l => l !== si);

function buildChain(d) {

    p.y += (rnd(i * 5 + 17) - 0.5) * 0.8 * Math.sin(Math.PI * t);

  for (let i = 0; i < CHN; i++) {
    arr[w++] = pts[i].x; arr[w++] = pts[i].y; arr[w++] = pts[i].z;
    arr[w++] = pts[i + 1].x; arr[w++] = pts[i + 1].y; arr[w++] = pts[i + 1].z;
  }

}

    act: () => { flyTo([13.5, 5.0, 14.0], [1.8, -1.6, 0]); notify('AM 细而广(作物),ECM 粗而贵(森林)', 'AM: fine and widespread (crops); ECM: thick and costly (forests)'); } },

function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 幼苗磷/碳曲线 ================= */
const pSeedVal = () => pRoute[1] ? 2.4 * distF() : 0.06;
const cSeedVal = () => pRoute[1] ? rate * 0.008 * distF() : 0.006;
const plotCv = document.getElementById('plotCv');
const samples = [];
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 36, padR = 12, padT = 10, padB = 18;
  const t1 = simT, t0 = t1 - 14;
  const xOf = t => padL + (t - t0) / 14 * (W - padL - padR);
  const yP = v => H - padB - clamp(v / 3, 0, 1) * (H - padT - padB);
  const yC = v => H - padB - clamp(v / 0.2, 0, 1) * (H - padT - padB);
  ctx.font = '11px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  for (const g of [0, 1.5, 3]) { ctx.beginPath(); ctx.moveTo(padL, yP(g)); ctx.lineTo(W - padR, yP(g)); ctx.stroke(); }
  ctx.fillStyle = cTxt;
  ctx.fillText('3 mg', 4, yP(3) + 4); ctx.fillText('0', 14, yP(0) - 3);
  const vis = samples.filter(s => s.t >= t0);
  for (const [kk, yf, col] of [['p', yP, '#b07ae8'], ['c', yC, '#f2c14e']]) {
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    vis.forEach((s, i) => { const x = xOf(s.t), y = yf(s[kk]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    if (vis.length) {
      const ls = vis[vis.length - 1];
      ctx.fillStyle = col; ctx.fillRect(xOf(ls.t) - 2, yf(ls[kk]) - 2, 4, 4);
    }
  }
  ctx.lineWidth = 1;
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elDist = document.getElementById('sDist'), elDistVal = document.getElementById('sDistVal');
const elRate = document.getElementById('sRate'), elRateVal = document.getElementById('sRateVal');
const stMul = document.getElementById('stMul'), stC = document.getElementById('stC'), stP = document.getElementById('stP'),
  stEdges = document.getElementById('stEdges'), stSeed = document.getElementById('stSeed');
const formulaEl = document.getElementById('formula');
const btnFarEl = document.getElementById('btnFar'), btnCutEl = document.getElementById('btnCut'), btnCrossEl = document.getElementById('btnCross');
let initDone = false;
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elDist.value = dist; elDistVal.textContent = dist.toFixed(1) + ' m';
  elRate.value = rate; elRateVal.textContent = rate + '%';
}
function updateBtns() {
  btnCutEl.textContent = cut ? L('重连网络', 'Reconnect web') : L('切断网络', 'Cut web');
  btnCutEl.classList.toggle('warn', cut);
  btnCrossEl.classList.toggle('on', cross);
}
function updateStats() {
  const ok = !!pRoute[1];
  stMul.innerHTML = ok ? '×' + Math.round(2 + 78 * distF()) : '×1';
  stMul.className = 'v ' + (ok ? 'ok' : 'bad');
  stC.innerHTML = (rate * 0.07).toFixed(2) + '<small> ' + L('g/m²/天', 'g/m²/day') + '</small>';
  const pv = pSeedVal();
  stP.innerHTML = pv.toFixed(2) + '<small> ' + L('mg/天', 'mg/day') + '</small>';
  stP.className = 'v ' + (ok ? 'ok' : 'bad');
  stEdges.innerHTML = aliveEdges + '<small> ' + L('条', ' links') + '</small>';
  stSeed.textContent = ok ? L('健康', 'healthy') : L('缺磷', 'P-starved');
  stSeed.className = 'v ' + (ok ? 'ok' : 'bad');
}
function updateFormula() {
  const ex = rate * 0.07 > 0.02 ? pSeedVal() / (rate * 0.07) : 0;
  formulaEl.innerHTML = L(
    `<b>磷扩散:D ≈ 10⁻⁹ cm²/s(土壤)</b> → 挪 1 mm 需 x²/2D ≈ 58 天,根周形成「耗竭区」,只能靠菌丝外延<br>` +
    `<b>碳账:植物→真菌 ≈ ${rate}% 净同化碳</b>(文献均值 ~13%,≈0.9 g C/m²/天)· 全球沿菌丝入地 ~13 Gt C/年<br>` +
    `<b>交换价:当前 ≈ ${ex.toFixed(0)} mg P / g C</b>(实测 10–30 量级)· 土壤磷越富,植物越会「减薪」`,
    `<b>P diffusion: D ≈ 10⁻⁹ cm²/s (soil)</b> → ~58 days per mm (x²/2D); a depletion zone forms and only hyphae can reach past it<br>` +
    `<b>Carbon bill: plant → fungus ≈ ${rate}% of net assimilated C</b> (literature mean ~13%, ≈0.9 g C/m²/day) · ~13 Gt C/yr flows underground via hyphae<br>` +
    `<b>Exchange price: now ≈ ${ex.toFixed(0)} mg P / g C</b> (measured order 10–30) · the richer the soil P, the more plants cut the wage`);
}
function syncAll() {
  syncSliders(); updateBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => { el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh; });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('菌根网络 · 植物用碳雇真菌找磷', 'Mycorrhizal Network · Plants Hire Fungi for Phosphorus, Paying in Carbon');
  for (const [o, z, e] of LBLS) o.element.textContent = L(z, e);
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateBtns();
  updateFormula();
  updateStats();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
  drawPlot();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});
elDist.addEventListener('input', () => { dist = +elDist.value; buildChain(dist); syncSliders(); updateFormula(); updateStats(); });
elRate.addEventListener('input', () => { rate = +elRate.value; syncSliders(); updateFormula(); updateStats(); drawPlot(); });
btnFarEl.addEventListener('click', () => {
  dist = 5; buildChain(5); syncSliders(); updateFormula(); updateStats();
  notify('磷矿已拖远:菌丝网络正延伸生长过去…', 'Rock pushed away: the hyphal web is growing toward it…');
});
btnCutEl.addEventListener('click', () => {
  cut = !cut;
  computeCut(); rebuildRoutes(); updateBtns(); updateStats(); updateFormula();
  notify(cut ? '已剪断幼苗–成株间菌丝:磷摄入跌落,叶色转黄' : '网络重连:幼苗恢复磷流与借款',
    cut ? 'Seedling–adult hyphae severed: P uptake crashes, leaves yellow' : 'Web restored: seedling P flow and loans resume');
});
btnCrossEl.addEventListener('click', () => {
  cross = !cross;
  soilM.transparent = cross; soilM.opacity = cross ? 0.42 : 1; soilM.depthWrite = !cross; soilM.needsUpdate = true;
  frameLine.visible = cross;
  updateBtns();
  notify(cross ? '剖视:透视土壤,看见根与菌丝' : '土壤复原:地下网络被遮住',
    cross ? 'Cutaway: soil made transparent — roots and hyphae visible' : 'Soil restored: the underground web is hidden');
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglFlow').addEventListener('change', e => { flowOn = e.target.checked; });
document.getElementById('tglSpin').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
if (controls.autoRotate) document.getElementById('tglSpin').checked = true;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, accSamp = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) simT += dt;
  /* 磷矿移动 + 链生长 */
  rockGroup.position.lerp(rockTarget, Math.min(1, dt0 * 2.2));
  nodes[rockN].p.copy(rockGroup.position);
  if (chainGrown < 1) {
    chainGrown = Math.min(1, chainGrown + dt / 3.2);
    chainGeo.setDrawRange(0, 2 * Math.max(1, Math.floor(chainGrown * CHN)));
    if (chainGrown >= 1) {
      chainOn = true; computeCut(); rebuildRoutes(); updateStats(); updateFormula();
      btnFarEl.classList.remove('on');
      notify('菌丝接通磷矿:磷流恢复', 'Hyphae reconnected: phosphorus flow restored');
    }
  }
  for (let i = 0; i < CHN; i++) {
    const g = clamp((chainGrown * CHN - i) * 1.5, 0, 1);
    dummy.position.copy(nodes[chainN0 + i].p);
    dummy.scale.setScalar(g); dummy.updateMatrix();
    chainNodeMesh.setMatrixAt(i, dummy.matrix);
  }
  chainNodeMesh.instanceMatrix.needsUpdate = true;
  /* 幼苗胁迫 → 叶色 */
  plants.forEach(pl => {
    pl.stress += (pl.target - pl.stress) * Math.min(1, dt0 * 0.9);
    if (pl.seed) leafSeedM.color.copy(seedGreen).lerp(seedYellow, pl.stress);
  });
  /* 网络 / 粒子 */
  webLineM.opacity = 0.55 + 0.22 * Math.sin(simT * 2.2);
  nodeM.emissiveIntensity = 0.9 + 0.35 * Math.sin(simT * 2.1);
  webLight.intensity = 0.8 + 0.25 * Math.sin(simT * 2.1);
  if (flowOn && dt > 0) {
    for (let i = 0; i < NP; i++) {
      const q = pd[i], rt = pRoute[q.pl];
      if (rt) {
        q.s = (q.s + q.sp * dt / rt.len) % 1;
        routeAt(rt, q.s, tmpV).add(q.j);
        dummy.position.copy(tmpV);
        dummy.scale.setScalar(q.pl ? 0.6 : 1);
      } else dummy.scale.setScalar(0.0001);
      dummy.updateMatrix(); pMesh.setMatrixAt(i, dummy.matrix);
    }
    pMesh.instanceMatrix.needsUpdate = true;
    for (let i = 0; i < NS; i++) {
      const q = sd[i], rt = sugarRoute[q.pl];
      if (rt) {
        q.s = (q.s + (0.03 + rate * 0.003) * dt / rt.len) % 1;
        routeAt(rt, q.s, tmpV).add(q.j);
        dummy.position.copy(tmpV);
        dummy.scale.setScalar(q.pl ? 0.6 : 1);
      } else dummy.scale.setScalar(0.0001);
      dummy.updateMatrix(); sMesh.setMatrixAt(i, dummy.matrix);
    }
    sMesh.instanceMatrix.needsUpdate = true;
  } else {
    dummy.scale.setScalar(0.0001); dummy.updateMatrix();
    for (let i = 0; i < NP; i++) pMesh.setMatrixAt(i, dummy.matrix);
    for (let i = 0; i < NS; i++) sMesh.setMatrixAt(i, dummy.matrix);
    pMesh.instanceMatrix.needsUpdate = true;
    sMesh.instanceMatrix.needsUpdate = true;
  }
  /* 采样曲线 */
  if (dt > 0) {
    accSamp += dt;
    if (accSamp > 0.15) {
      accSamp = 0;
      samples.push({ t: simT, p: pSeedVal(), c: cSeedVal() });
      while (samples.length && samples[0].t < simT - 15) samples.shift();
    }
  }
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.16) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.14) { accPlot = 0; drawPlot(); }
  for (const o of labelReg) o.visible = labelsOn && (o !== lblNotify || notifyT > 0);
  lblNotify.element.textContent = notifyT > 0 ? L(nz, ne) : '';
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildChain(dist);
computeCut();
rebuildRoutes();
buildSugar();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
initDone = true;
syncAll();
start();
</script>
