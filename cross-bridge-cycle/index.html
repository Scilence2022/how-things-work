<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肌肉收缩的横桥循环 · 原理动画</title>
<style>
  :root { --acc:#e0524a; color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #10141b;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  #cv { position: fixed; inset: 0; display: block; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; }
  #title h1 { font-size: 20px; font-weight: 700; color: #f2f5f9; letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: #9fb0c3; margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 356px;
    background: rgba(13,17,24,.86); border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.ca  { color: #ffb35c; border-color: rgba(255,179,92,.6); }
  .chip.adp { color: #ce93d8; border-color: rgba(206,147,216,.55); }
  .chip.pi  { color: #ff8a65; border-color: rgba(255,138,101,.55); }
  .chip.atp { color: #ffd54f; border-color: rgba(255,213,79,.55); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: rgba(255,255,255,.05); }
  #steps li.on { background: rgba(224,82,74,.13); border-color: rgba(224,82,74,.5); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: #dfe6ee; }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: #c7d2de; line-height: 1.45; }
  #steps .t b { color: #f2f5f9; font-size: 12.5px; }
  #steps li.on .t b { color: #ffb3ad; }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: #9fb0c3; flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: #c7d2de; flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: #b9c4d0; display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 760px) { #panel { width: calc(100vw - 36px); } #title h1 { font-size: 16px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1>肌肉是怎么收缩的？—— 横桥循环与肌丝滑行</h1>
  <div class="sub">粗细肌丝滑行 × 单次横桥循环分屏对照 · 每划动 1 次消耗 1 个 ATP · 空格播放/暂停</div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip ca">Ca²⁺</span>
    <span class="chip adp">ADP+Pi</span>
    <span class="chip pi">Pi</span>
    <span class="chip atp">ATP</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label>速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label>相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> 标注</label>
    <label><input id="tglForce" type="checkbox" checked> 力箭头与能量标注</label>
    <label><input id="tglLedger" type="checkbox" checked> 净效应账本</label>
  </div>
</div>

<script>
'use strict';
/* ================= URL 参数 ================= */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ================= 画布（1600×900 虚拟坐标，等比缩放居中） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function arrow(pts, color, lw = 2, len = 9, dash = null) {
  const [x2, y2] = pts[pts.length - 1], [x1, y1] = pts[pts.length - 2];
  const ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - len * Math.cos(ang - 0.42), y2 - len * Math.sin(ang - 0.42));
  ctx.lineTo(x2 - len * Math.cos(ang + 0.42), y2 - len * Math.sin(ang + 0.42));
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
function glow(x, y, r, color, core = 0.35) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(core, color.replace(/[\d.]+\)$/, '0.35)'));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function dot(x, y, r, fill, stroke, lw = 1.5) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
const rnd = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
function chip(x, y, label, color, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = `700 12.5px ${FONT}`;
  const w = ctx.measureText(label).width + 16;
  rrect(x - w / 2, y - 12, w, 24, 8, color, 'rgba(0,0,0,.45)', 1.5);
  text(label, x, y + 4.5, 12.5, '#1a1208', 'center', 700);
  ctx.restore();
}

/* ================= 配色与时序 ================= */
const CYCLE = 15;                      // 一个完整横桥循环的秒数
const ACC = '#e0524a';                 // 主题 accent（肌肉红）
const C_CA = '#ffb35c', C_ADP = '#ce93d8', C_PI = '#ff8a65', C_ATP = '#ffd54f';
const C_ACT = '#7ea1cc', C_MYO = '#54718f', C_MYO_D = '#41546b';
const C_TROP = '#cfa96e', C_TN = '#63b99c';

/* ================= 相位讲解（t0/t1 无缝覆盖 0..1） ================= */
const STEPS = [
  { t0: 0.00, t1: 0.14, n: 1, b: 'Ca²⁺ 点火', d: 'Ca²⁺ 结合肌钙蛋白 C → 原肌球蛋白旋离，暴露肌动蛋白结合位点。' },
  { t0: 0.14, t1: 0.30, n: 2, b: '搭桥 · 横桥形成', d: '已储能的头部（杠杆臂翘起 90°，带着 ADP+Pi）咬合暴露位点，形成横桥。' },
  { t0: 0.30, t1: 0.50, n: 3, b: 'Power stroke · 划动', d: 'Pi 释放是扳机：杠杆臂回摆 45°，把细肌丝拖向 M 线 ≈10 nm，随后 ADP 脱落。' },
  { t0: 0.50, t1: 0.62, n: 4, b: 'Rigor · 强直', d: '没有 ATP 结合，头部锁死在低能构象——这就是尸僵的根源。' },
  { t0: 0.62, t1: 0.80, n: 5, b: 'ATP 结合 · 松手', d: 'ATP 结合到头部 → 对肌动蛋白亲和力骤降 → 头部分离。ATP 是让肌丝「松手」的。' },
  { t0: 0.80, t1: 1.00, n: 6, b: '回位 · Recovery stroke', d: 'ATP 水解为 ADP+Pi，能量把杠杆臂重新翘到 90° 储存，等待下一循环。' },
];
function stepIndex(t) {
  for (let i = 0; i < STEPS.length; i++) if (t >= STEPS[i].t0 && t < STEPS[i].t1) return i;
  return STEPS.length - 1;
}

/* ================= 状态 / UI ================= */
let cycles = qsFloat('t', 0);
let playing = !qsBool('pause', false);
let speed = qsFloat('speed', 1);
let showLabels = qsBool('labels', true);
let showForce = qsBool('force', true);
let showLedger = qsBool('ledger', true);

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglForce = document.getElementById('tglForce');
const tglLedger = document.getElementById('tglLedger');

for (const s of STEPS) {
  const li = document.createElement('li');
  li.innerHTML = `<span class="n">${s.n}</span><span class="t"><b>${s.b}</b>　${s.d}</span>`;
  li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.002; });
  elSteps.appendChild(li);
}
elPlay.textContent = playing ? '暂停' : '播放';
elPlay.addEventListener('click', () => { playing = !playing; elPlay.textContent = playing ? '暂停' : '播放'; });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglLabels.checked = showLabels; tglForce.checked = showForce; tglLedger.checked = showLedger;
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglForce.addEventListener('change', () => { showForce = tglForce.checked; });
tglLedger.addEventListener('change', () => { showLedger = tglLedger.checked; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });

/* ================= 循环运动学（左右两屏共用同一状态机） =================
   科学红线：ATP 结合 → 分离（不是划动）；划动扳机 = Pi 释放；
   划动能量在 ATP 水解瞬间就已储存在翘起的杠杆臂里。               */
function cycPhase(q) {                 // q ∈ [0,1) 单个头部自身的相位
  const strokeK = ss(0.32, 0.46, q);                                  // 划动进度
  const bound = ss(0.17, 0.25, q) * (1 - ss(0.68, 0.74, q));          // 与肌动蛋白结合程度
  const recock = ss(0.84, 0.99, q);                                   // 回位（走回下一个位点）
  const cock = q < 0.80 ? 1 - ss(0.32, 0.46, q) : ss(0.84, 0.99, q);  // 杠杆臂翘起程度 0..1
  return { strokeK, bound, recock, cock };
}
function nucState(p) {                 // 头部活性位点上的核苷酸
  if (p >= 0.90 || p < 0.31) return 'ADPPi';   // 水解后储能态（ADP+Pi 在位）
  if (p < 0.44) return 'ADP';                  // Pi 已释放，只剩 ADP
  if (p < 0.64) return '';                     // Rigor：空
  return 'ATP';                                // ATP 已结合（→ 松手）
}
function tropK(p) { return ss(0.06, 0.13, p) * (1 - ss(0.96, 1, p)); }  // 原肌球蛋白旋离程度
function caK(p)   { return ss(0.02, 0.06, p) * (1 - ss(0.96, 0.995, p)); } // Ca²⁺ 占据程度
function accumOf(p) {                  // 累计划动（封顶 5 次 → 肌节 2.30→2.05 μm）
  return Math.min(Math.floor(cycles) + ss(0.32, 0.46, p), 5);
}

/* ================= 背景 / 分区框架 ================= */
function drawBg(now) {
  ctx.fillStyle = '#10141b'; ctx.fillRect(0, 0, W, H);
  let g = ctx.createRadialGradient(445, 310, 40, 445, 310, 430);
  g.addColorStop(0, 'rgba(224,82,74,.05)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(1210, 340, 40, 1210, 340, 470);
  g.addColorStop(0, 'rgba(224,82,74,.045)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 悬浮微粒（暂停时仍轻微漂动 = 稳态热运动）
  for (let i = 0; i < 16; i++) {
    const px = i < 9 ? 70 + rnd(i, 31) * 740 : 880 + rnd(i, 32) * 640;
    const py = 160 + rnd(i, 33) * 380 + 10 * Math.sin(now * 0.0004 + i * 1.7);
    dot(px, py, 2.6, 'rgba(255,255,255,.05)');
  }
  rrect(52, 132, 786, 400, 16, 'rgba(255,255,255,.012)', 'rgba(255,255,255,.07)', 1);
  rrect(852, 132, 708, 452, 16, 'rgba(255,255,255,.012)', 'rgba(255,255,255,.07)', 1);
}

/* ================= 左侧：肌节宏观视角 ================= */
const MX = 445;                        // M 线（肌节中央）
const HEADS = [                        // 粗肌丝上的 7 个头；hl = 与右屏同相的高亮头
  { x: 395, side: 'L', top: true,  off: 0.55, hl: false },
  { x: 465, side: 'R', top: true,  off: 0.22, hl: false },
  { x: 535, side: 'R', top: true,  off: 0.00, hl: true  },
  { x: 585, side: 'R', top: true,  off: 0.71, hl: false },
  { x: 430, side: 'L', top: false, off: 0.38, hl: false },
  { x: 500, side: 'R', top: false, off: 0.86, hl: false },
  { x: 560, side: 'R', top: false, off: 0.13, hl: false },
];

// 一根细肌丝：双螺旋串珠 + 位点 + 原肌球蛋白 + 肌钙蛋白；返回肌钙蛋白坐标
function thinStrand(x0, dir, tk) {
  const tip = x0 + dir * 300;
  line(x0 + dir * 8, 300, tip - dir * 6, 300, 'rgba(126,161,204,.4)', 3);
  for (let i = 0; i < 46; i++) {
    const x = x0 + dir * i * 6.6;
    if (dir > 0 ? x > tip : x < tip) break;
    dot(x, 300 + ((i % 2) ? 6 : -6), 5.4, i % 2 ? '#6f93bd' : C_ACT, 'rgba(0,0,0,.25)', 1);
  }
  for (let i = 8; i < 46; i += 4) {    // 结合位点凹槽（逐个点亮）
    const x = x0 + dir * i * 6.6;
    if (dir > 0 ? x > tip - 8 : x < tip + 8) break;
    const lit = clamp(tk * 1.5 - i * 0.025, 0, 1);
    dot(x, 285, 3.4, lit > 0 ? `rgba(224,82,74,${0.18 + 0.8 * lit})` : 'rgba(255,255,255,.14)',
        lit > 0.5 ? ACC : null, 1.2);
  }
  ctx.save(); ctx.globalAlpha = 0.9 - 0.5 * tk;   // 原肌球蛋白细链（旋离 = 下移+变淡）
  ctx.beginPath();
  for (let xx = x0 + dir * 14 - dir * 6 * tk; dir > 0 ? xx < tip - 8 : xx > tip + 8; xx += dir * 14) {
    const y = 287 + 9 * tk + 2 * Math.sin(xx * 0.09);
    xx === x0 + dir * 14 - dir * 6 * tk ? ctx.moveTo(xx, y) : ctx.lineTo(xx, y);
  }
  ctx.strokeStyle = C_TROP; ctx.lineWidth = 2.2; ctx.stroke(); ctx.restore();
  const tns = [];
  for (const i of [12, 27]) {          // 肌钙蛋白小结
    const x = x0 + dir * i * 6.6;
    dot(x, 287 + 9 * tk, 6.5, C_TN, 'rgba(0,0,0,.35)', 1.5);
    tns.push([x, 287 + 9 * tk]);
  }
  return tns;
}

function drawMiniHead(h, p) {          // 左屏单个肌球蛋白头（两段线 + 关节圆）
  const q = (p + h.off) % 1;
  const st = cycPhase(q);
  const dir = h.side === 'L' ? 1 : -1;           // 划动方向：拖向 M 线
  const handX = h.x + dir * (-7 * st.strokeK + 7 * st.recock);
  const top = h.top ? 1 : -1;
  const eC = { x: h.x + dir * 14, y: 300 - top * 39 };   // 翘起肘点
  const eR = { x: h.x - dir * 11, y: 300 - top * 35 };   // 回摆肘点
  const ex = lerp(eR.x, eC.x, st.cock), ey = lerp(eR.y, eC.y, st.cock);
  const handY = 300 - top * (4 + 10 * (1 - st.bound));
  const col = h.hl ? ACC : C_MYO_D;
  line(h.x, 300 - top * 17, ex, ey, col, 4.5);
  line(ex, ey, handX, handY, col, 4.5);
  dot(ex, ey, 3.2, h.hl ? ACC : '#5f81a3');
  if (h.hl) glow(handX, handY, 26, 'rgba(224,82,74,.35)');
  dot(handX, handY, 8.5, h.hl ? ACC : C_MYO, 'rgba(0,0,0,.3)', 1.2);
  if (h.hl) {                          // 高亮头带上核苷酸小点（与右屏一致）
    const n = nucState(p);
    if (n === 'ADPPi') { dot(handX - 8, handY - top * 13, 3, C_ADP); dot(handX + 1, handY - top * 13, 2.5, C_PI); }
    if (n === 'ATP') dot(handX - 3, handY - top * 13, 3, C_ATP);
  }
}

function drawLeft(p, now) {
  const strokeK = ss(0.32, 0.46, p);
  const sTot = 14 * accumOf(p);        // 累计滑移 px → Z 盘靠近
  const ZL = 125 + sTot / 2, ZR = 765 - sTot / 2;
  const tk = tropK(p);
  text('肌节 · 宏观视角（多个横桥接力）', 445, 158, 14, '#8fa0b5', 'center', 600);
  // Z 盘（随滑移相互靠近）
  rrect(ZL - 7, 238, 14, 124, 5, '#97a3b8', 'rgba(0,0,0,.3)', 1.2);
  rrect(ZR - 7, 238, 14, 124, 5, '#97a3b8', 'rgba(0,0,0,.3)', 1.2);
  text('Z 盘', ZL, 382, 12, '#9fb0c3', 'center', 600);
  text('Z 盘', ZR, 382, 12, '#9fb0c3', 'center', 600);
  // 细肌丝（左右两根，从 Z 盘伸向中央）
  const tns = [...thinStrand(ZL, 1, tk), ...thinStrand(ZR, -1, tk)];
  // 粗肌丝 + M 线
  const g = ctx.createLinearGradient(0, 281, 0, 319);
  g.addColorStop(0, C_MYO); g.addColorStop(1, '#3c5269');
  rrect(MX - 150, 281, 300, 38, 10, g, 'rgba(255,255,255,.18)', 1.5);
  line(MX, 256, MX, 344, 'rgba(255,255,255,.28)', 2, [5, 5]);
  text('M 线', MX, 250, 12, '#9fb0c3', 'center', 600);
  text('粗肌丝（肌球蛋白）', 288, 268, 12, '#8fa0b5');
  // 7 个横桥头（高亮头与右屏严格同相位，其余错相循环）
  for (const h of HEADS) drawMiniHead(h, p);
  // Ca²⁺ 飞向肌钙蛋白
  const srcs = [[ZL + 30, 205], [ZL + 140, 192], [ZR - 40, 205], [ZR - 150, 192]];
  tns.forEach((tg, k) => {
    const t0 = 0.02 + 0.011 * k, t1 = t0 + 0.055;
    if (p < t0) return;
    let x, y, a = caK(p);
    if (p < t1) {
      const kk = ss(t0, t1, p);
      x = lerp(srcs[k][0], tg[0], kk); y = lerp(srcs[k][1], tg[1], kk) - 24 * Math.sin(kk * Math.PI); a = 1;
    } else { x = tg[0]; y = tg[1]; }
    if (a <= 0.02) return;
    ctx.globalAlpha = a;
    glow(x, y, 15, 'rgba(255,179,92,.5)');
    dot(x, y, 6.5, C_CA, 'rgba(0,0,0,.35)', 1.2);
    ctx.globalAlpha = 1;
  });
  if (showLabels && caK(p) > 0.3) text('Ca²⁺', tns[0][0], 262, 12, C_CA, 'center', 600);
  // 力箭头：划动窗口内细丝滑向 M 线、Z 盘靠近
  if (showForce && p >= 0.30 && p < 0.52) {
    ctx.globalAlpha = clamp((0.52 - p) / 0.06, 0, 1);
    arrow([[340, 352], [420, 352]], ACC, 3);
    arrow([[560, 352], [480, 352]], ACC, 3);
    text('细肌丝滑向 M 线', 445, 372, 12, ACC, 'center', 600);
    arrow([[ZL - 30, 300], [ZL - 8, 300]], '#97a3b8', 2.5);
    arrow([[ZR + 30, 300], [ZR + 8, 300]], '#97a3b8', 2.5);
    text('Z 盘间距微缩', 445, 404, 12, '#97a3b8', 'center', 600);
    ctx.globalAlpha = 1;
  }
}

/* ================= 右侧：单次横桥循环放大 ================= */
const ZA = { x: 1210, y: 263 };        // 杠杆臂锚点（粗肌丝上）
function zoomPose(p) {
  const st = cycPhase(p);
  const shift = 78 * st.strokeK;       // 细肌丝每循环滑移一格（≈10 nm 放大像）
  const headX = 1300 - shift + 78 * st.recock;   // 未结合时沿肌丝「走回」下一位点
  const headY = 455 - 28 * (1 - st.bound);       // 未结合时悬停抬起
  const E = { x: lerp(1170, 1330, st.cock), y: lerp(351, 341, st.cock) };
  return { ...st, shift, headX, headY, E };
}
function badge(p) {
  const names = [
    ['Ca²⁺ 点火 · 位点暴露', C_CA],
    ['搭桥 · 横桥形成', '#9fc7f0'],
    ['Power stroke · Pi 释放 → 划动', ACC],
    ['Rigor · 无 ATP 锁死', '#9fb0c3'],
    ['ATP 结合 · 亲和力骤降 → 分离', C_ATP],
    ['Recovery · 水解储能 90°', '#7ee2ae'],
  ];
  const [s, c] = names[stepIndex(p)];
  ctx.font = `700 14px ${FONT}`;
  const w = ctx.measureText(s).width + 40;
  rrect(1210 - w / 2, 172, w, 32, 16, 'rgba(13,17,24,.85)', c + 'aa', 1.4);
  text(s, 1210, 193, 14, c, 'center', 700);
}

function drawRight(p, now) {
  const zp = zoomPose(p), tk = tropK(p);
  text('单次横桥循环 · 放大对照', 1210, 158, 14, '#8fa0b5', 'center', 600);
  badge(p);
  // 粗肌丝断段（上）
  const g = ctx.createLinearGradient(0, 212, 0, 258);
  g.addColorStop(0, C_MYO); g.addColorStop(1, '#3c5269');
  rrect(985, 212, 450, 46, 10, g, 'rgba(255,255,255,.18)', 1.5);
  for (const x of [996, 1006, 1414, 1424]) line(x, 216, x, 254, 'rgba(255,255,255,.10)', 2);
  text('粗肌丝（肌球蛋白）', 1210, 204, 12.5, '#8fa0b5', 'center', 600);
  // 杠杆臂：锚点 → 肘关节 → S1 头（两段粗线 + 关节圆）
  const H = { x: zp.headX, y: zp.headY };
  glow(H.x, H.y, 52, 'rgba(224,82,74,.22)');
  line(ZA.x, ZA.y, zp.E.x, zp.E.y, C_MYO, 15);
  dot(zp.E.x, zp.E.y, 8, '#5f81a3', 'rgba(0,0,0,.35)', 1.5);
  line(zp.E.x, zp.E.y, H.x, H.y, C_MYO, 11);
  // 肌动蛋白单链 + 结合位点
  line(880, 470, 1540, 470, 'rgba(126,161,204,.35)', 4);
  for (let j = 5; j <= 14; j++) {
    const x = 520 + 78 * j - zp.shift;
    if (x < 868 || x > 1552) continue;
    dot(x, 470, 12.5, j % 2 ? '#6f93bd' : C_ACT, 'rgba(0,0,0,.28)', 1.5);
    const lit = 0.15 + 0.85 * tk;
    dot(x, 457, 3.6, `rgba(224,82,74,${lit})`, tk > 0.5 ? ACC : null, 1.2);
  }
  const gx = 1300 - zp.shift;          // 目标位点（j=10）
  ctx.globalAlpha = Math.max(zp.bound, tk * 0.55);
  dot(gx, 470, 17, null, ACC, 2); ctx.globalAlpha = 1;
  // 原肌球蛋白 + 肌钙蛋白 + Ca²⁺
  ctx.save(); ctx.globalAlpha = 0.9 - 0.5 * tk;
  ctx.beginPath();
  for (let xx = 940 - 16 * tk; xx <= 1460 - 16 * tk; xx += 16) {
    const y = 452 + 10 * tk + 2 * Math.sin(xx * 0.08);
    xx === 940 - 16 * tk ? ctx.moveTo(xx, y) : ctx.lineTo(xx, y);
  }
  ctx.strokeStyle = C_TROP; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
  const tn = { x: 1140, y: 452 + 10 * tk };
  dot(tn.x, tn.y, 10, C_TN, 'rgba(0,0,0,.35)', 1.5);
  if (p >= 0.02) {
    let cx = tn.x, cy = tn.y, a = caK(p);
    if (p < 0.09) {
      const kk = ss(0.02, 0.09, p);
      cx = lerp(1030, tn.x, kk); cy = lerp(368, tn.y, kk) - 24 * Math.sin(kk * Math.PI); a = 1;
    }
    if (a > 0.02) {
      ctx.globalAlpha = a;
      glow(cx, cy, 17, 'rgba(255,179,92,.55)');
      dot(cx, cy, 7, C_CA, 'rgba(0,0,0,.35)', 1.2);
      if (showLabels && p < 0.14) text('Ca²⁺', cx + 20, cy - 10, 12, C_CA, 'left', 600);
      ctx.globalAlpha = 1;
    }
  }
  // S1 头（咬合在位点上）
  dot(H.x, H.y, 24, '#5b7c9e', 'rgba(255,255,255,.28)', 2);
  dot(H.x, H.y, 24, null, ACC, 2.5);
  if (zp.bound > 0.4) {
    line(H.x - 10, H.y + 16, H.x - 16, H.y + 32, 'rgba(255,255,255,.30)', 3);
    line(H.x + 10, H.y + 16, H.x + 16, H.y + 32, 'rgba(255,255,255,.30)', 3);
  }
  // 活性位点核苷酸 + 飞行粒子
  const n = nucState(p), nx = H.x, ny = H.y - 40;
  if (n === 'ADPPi') { chip(nx - 18, ny, 'ADP', C_ADP); chip(nx + 22, ny, 'Pi', C_PI); }
  if (n === 'ATP') chip(nx, ny, 'ATP', C_ATP);
  if (n === '' && showLabels) text('活性位点（空）', nx, ny + 5, 11.5, '#6b7684', 'center');
  if (p >= 0.30 && p < 0.42) {         // Pi 释放（划动扳机）
    const k = ss(0.30, 0.38, p);
    chip(H.x - 26 - 80 * k, H.y - 14 + 96 * k, 'Pi', C_PI, 1 - ss(0.36, 0.42, p));
  }
  if (p >= 0.44 && p < 0.50) {         // ADP 脱落
    const k = ss(0.44, 0.49, p);
    chip(H.x - 46 * k, H.y - 14 + 120 * k, 'ADP', C_ADP, 1 - ss(0.47, 0.50, p));
  }
  if (p >= 0.62 && p < 0.68) {         // ATP 飞来
    const k = ss(0.62, 0.665, p);
    chip(lerp(1478, nx, k), lerp(560, ny, k), 'ATP', C_ATP);
  }
  if (p >= 0.88 && p < 0.93) {         // ATP 水解瞬间（能量存入杠杆臂）
    const k = ss(0.88, 0.93, p);
    ctx.globalAlpha = 1 - k;
    dot(H.x, H.y, 26 + 44 * k, null, C_ATP, 2.5);
    ctx.globalAlpha = 1;
  }
  // 力箭头与能量标注
  if (showForce) {
    if (p >= 0.30 && p < 0.52) {
      ctx.globalAlpha = clamp((0.52 - p) / 0.06, 0, 1);
      arrow([[gx + 190, 505], [gx + 60, 505]], ACC, 3.5);
      text('≈10 nm 滑移', gx + 125, 527, 12.5, ACC, 'center', 600);
      ctx.globalAlpha = 1;
    }
    if (p >= 0.30 && p < 0.44) text('Pi 释放 → 扳机！', H.x, 385, 13, C_PI, 'center', 700);
    if (p >= 0.50 && p < 0.62) text('锁死：无 ATP', H.x, 385, 12.5, '#9fb0c3', 'center', 600);
    if (p >= 0.62 && p < 0.80) text('ATP 结合 → 分离', H.x, 385, 12.5, C_ATP, 'center', 600);
    if ((p < 0.30 || p >= 0.90) && n === 'ADPPi')
      text('杠杆臂已储能 90°', zp.E.x + 14, zp.E.y - 14, 12.5, C_ATP, 'left', 600);
  }
  // 标注
  if (showLabels) {
    text('杠杆臂', zp.E.x + 24, zp.E.y + 4, 11.5, '#9fb0c3');
    text('S1 头', H.x + 32, H.y + 4, 11.5, '#ffb3ad');
    text('肌动蛋白（细肌丝）', 1538, 500, 12, C_ACT, 'right', 600);
    arrow([[952, 494], [894, 494]], '#9fb0c3', 2, 8);
    text('朝 M 线', 958, 498, 11.5, '#9fb0c3');
    if (tk > 0.6 && p < 0.32) text('结合位点', gx + 28, 442, 11.5, '#ffb3ad');
    if (showLabels && p >= 0.50 && p < 0.62) text('尸僵的根源', 1210, 552, 12, '#6b7684', 'center');
  }
}

/* ================= 底部信息卡 ================= */
function drawReadout(p) {              // 左下实时读数（避开控制面板 x<430）
  const strokeK = ss(0.32, 0.46, p);
  const sar = 2.30 * (640 - 14 * accumOf(p)) / 640;
  rrect(440, 615, 380, 196, 14, 'rgba(13,17,24,.84)', 'rgba(255,255,255,.10)');
  text('实时读数（左侧肌节）', 458, 645, 13.5, '#c7d2de', 'left', 600);
  text('肌节长度', 458, 686, 13, '#9fb0c3');
  text(sar.toFixed(2) + ' μm', 802, 688, 21, ACC, 'right', 700);
  text('本周期划动进度', 458, 720, 13, '#9fb0c3');
  text(Math.round(strokeK * 100) + ' %', 802, 720, 15, '#e6ecf3', 'right', 600);
  text('已完成完整循环', 458, 750, 13, '#9fb0c3');
  text(Math.floor(cycles) + ' 次', 802, 750, 15, '#e6ecf3', 'right', 600);
  line(458, 764, 802, 764, 'rgba(255,255,255,.08)', 1);
  text('单次划动 ≈10 nm，动画放大示意', 458, 784, 11.5, '#6b7684');
  text('真实肌节由上百万个横桥接力缩短', 458, 801, 11.5, '#6b7684');
}
function drawEnergy(p) {               // 中下：能量与扳机（科学红线）
  rrect(852, 615, 298, 196, 14, 'rgba(13,17,24,.84)', 'rgba(255,255,255,.10)');
  text('能量与扳机（容易搞反）', 870, 645, 13.5, '#c7d2de', 'left', 600);
  const rows = [
    ['ATP 结合 → 头部松手', p >= 0.62 && p < 0.80, C_ATP],
    ['Pi 释放 → 触发划动', p >= 0.30 && p < 0.52, C_PI],
    ['划动能量 = 水解时储存', p >= 0.90 || p < 0.31, '#7ee2ae'],
  ];
  rows.forEach((r, i) => {
    const y = 684 + i * 32;
    dot(880, y - 4, 5, r[1] ? r[2] : 'rgba(255,255,255,.14)');
    text(r[0], 896, y, 13, r[1] ? '#e6ecf3' : '#5b6673');
  });
  line(870, 772, 1132, 772, 'rgba(255,255,255,.08)', 1);
  text('能量在 ATP 水解瞬间存入翘起的杠杆臂', 870, 792, 11, '#6b7684');
}
function drawLedger(p) {               // 右下：净效应账本
  rrect(1162, 615, 394, 196, 14, 'rgba(13,17,24,.84)', 'rgba(255,255,255,.10)');
  text('净效应账本（每 1 个 ATP）', 1180, 645, 13.5, '#c7d2de', 'left', 600);
  const strokeDone = p >= 0.46;
  const rows = [
    ['1 ATP → ADP + Pi（水解储能）', p >= 0.90, C_ATP],
    ['1 次划动 · 细肌丝滑 ≈10 nm', strokeDone, ACC],
    ['粗肌丝不动 · 细肌丝滑向 M 线', strokeDone, C_ACT],
    ['肌节缩短 · Z 盘相互靠近', strokeDone, '#97a3b8'],
  ];
  rows.forEach((r, i) => {
    const y = 676 + i * 30;
    dot(1190, y - 4, 5, r[1] ? r[2] : 'rgba(255,255,255,.14)');
    text(r[0], 1206, y, 13, r[1] ? '#e6ecf3' : '#5b6673');
  });
  line(1180, 774, 1538, 774, 'rgba(255,255,255,.08)', 1);
  text('几百万个横桥接力 → 宏观肌肉收缩', 1180, 794, 11, '#6b7684');
}

/* ================= 主绘制 ================= */
function draw(t, now) {
  drawBg(now);
  drawLeft(t, now);
  drawRight(t, now);
  drawReadout(t);
  drawEnergy(t);
  if (showLedger) drawLedger(t);
}

/* ================= 主循环 ================= */
let lastStep = -1, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (playing) cycles += dt * speed / CYCLE;
  const t = cycles - Math.floor(cycles);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#10141b'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(t, now);

  const si = stepIndex(t);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';
}
frame();
</script>
