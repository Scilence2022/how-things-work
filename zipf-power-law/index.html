    /* 每步按权重 count^α 抽一个词加 1（轮盘赌，O(M) 直接实现） */
    let tot=0;const w=new Array(M);
    for(let i=0;i<M;i++){w[i]=Math.pow(simCounts[i],alpha);tot+=w[i];}
    let r=Math.random()*tot,i=0;
    for(;i<M-1;i++){r-=w[i];if(r<=0)break;}
    simCounts[i]++;
  }
}
function freqOfCounts(){return simCounts.map(c=>c/1);}

/* ============ 拟合（log-log 最小二乘） ============ */
function fitLogLog(fr){
  let sx=0,sy=0,sxx=0,sxy=0;const n=fr.length;
  for(let i=0;i<n;i++){const x=Math.log10(i+1),y=Math.log10(Math.max(fr[i],1e-9));sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;}
  const m=(n*sxy-sx*sy)/(n*sxx-sx*sx);
  return {m,b:(sy-m*sx)/n};
}
function headShare(fr){
  const k=Math.round(fr.length*0.2);
  const sorted=[...fr].sort((a,b)=>b-a);
  let tot=0,head=0;
  sorted.forEach((v,i)=>{tot+=v;if(i<k)head+=v;});
  return head/tot;
}

/* ============ 高度映射：log 频率 → 杆高 ============ */
let hLo=0,hHi=1;
function computeHMap(fr){
  let fmax=0,fmin=Infinity;
  fr.forEach(f=>{fmax=Math.max(fmax,f);fmin=Math.min(fmin,f);});
  hHi=Math.log10(fmax);hLo=Math.log10(Math.max(fmin*0.6,fmax*1e-6));
}
const hMap=f=>0.15+6.6*clamp((Math.log10(Math.max(f,1e-9))-hLo)/Math.max(hHi-hLo,1e-9),0,1);

/* ============ 数据源切换 ============ */
function loadDataset(key){
  srcName=key;
  document.getElementById('dsSim').classList.toggle('on',key==='sim');
  document.getElementById('dsWord').classList.toggle('on',key==='word');
  document.getElementById('dsCity').classList.toggle('on',key==='city');
  document.getElementById('dsName').classList.toggle('on',key==='name');
  if(key==='sim'){
    dataLabel=L('模拟（60 个词，6000 次投放）','sim (60 words, 6000 drops)');
    simReset();
  }else{
    const d=key==='word'?WORDS:key==='city'?CITIES:SURNAMES;
    dataFreq=d.map(x=>x[1]);dataNames=d.map(x=>x[0]);
    dataLabel=key==='word'?L('英语词频（Brown 语料，%）','English word freq (Brown, %)')
      :key==='city'?L('城市圈人口（百万，UN 近似）','metro population (M, UN approx.)')
      :L('中国姓氏占比（%）','Chinese surnames (%)');
    computeHMap(dataFreq);fit=fitLogLog(dataFreq);
    rebuildNameLbls();
  }
  updateFormula();drawPlot();
}
function rebuildNameLbls(){
  for(const o of nameLbls){o.element.remove();scene.remove(o);}
  nameLbls.length=0;
  if(srcName==='sim')return;
  [[0,1.0],[Math.round(M*0.2),0.7],[M-1,0.6]].forEach(([i,dy])=>{
    if(i>=dataNames.length)return;
    const div=document.createElement('div');div.className='lbl b';
    div.textContent=`#${i+1} ${dataNames[i]}`;
    const o=new CSS2DObject(div);
    o.position.set((i-(M-1)/2)*0.52,hMap(dataFreq[i])+dy,0);
    scene.add(o);nameLbls.push(o);
  });
}
let nameLbls=[];

/* ============ 标签 ============ */
const labelReg=[];
function addLabel(textFn,pos,cls=''){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn});div.textContent=textFn();return o;
}
addLabel(()=>L('排名 →（第 1 名在最左）','rank → (No.1 at left)'),new THREE.Vector3(-14.6,-0.5,0),'b');
addLabel(()=>L('杆高 ∝ log 频率','height ∝ log frequency'),new THREE.Vector3(-14.6,4.2,0),'o');
addLabel(()=>L('头 20% 分界线','top-20% cut'),new THREE.Vector3(headX+0.2,7.9,-2.2),'b');
addLabel(()=>dataLabel,new THREE.Vector3(0,8.6,0),'g');

/* ============ 2D 图 ============ */
const plotCv=document.getElementById('plotCv');
let logAxes=true;
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  ctx.clearRect(0,0,W,H);
  const pad=30,padB=34;
  const fr=srcName==='sim'?freqOfCounts():dataFreq;
  const n=fr.length;
  let xmax,ymax,ymin;
  if(logAxes){xmax=Math.log10(n);ymax=Math.log10(Math.max(...fr));ymin=Math.log10(Math.min(...fr));}
  else{xmax=n;ymax=Math.max(...fr);ymin=0;}
  const X=v=>pad+(W-2*pad)*(logAxes?v/Math.max(xmax,1e-9):v/xmax);
  const Y=v=>H-padB-(H-pad-padB)*((v-ymin)/Math.max(ymax-ymin,1e-9));
  const css=getComputedStyle(document.documentElement);
  const cTxt=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  ctx.strokeStyle=cTxt;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(pad,pad-6);ctx.lineTo(pad,H-padB);ctx.lineTo(W-pad+6,H-padB);ctx.stroke();
  ctx.fillStyle=cTxt;ctx.font='20px system-ui';
  if(logAxes){
    for(let d=1;d<=n;d*=10)if(d<=n)ctx.fillText(d,X(Math.log10(d))-6,H-padB+26);
    ctx.fillText(L('排名(对数)','rank (log)'),W/2-50,H-6);
    ctx.fillText(L('频率(对数)','freq (log)'),pad+6,pad-10);
  }else{
    ctx.fillText('1',X(1)-6,H-padB+26);
    ctx.fillText(String(n),X(n)-14,H-padB+26);
    ctx.fillText(L('排名','rank'),W/2-30,H-6);
    ctx.fillText(L('频率','freq'),pad+6,pad-10);
  }
  /* 散点 */
  ctx.fillStyle='#'+C_HEAD.getHexString();
  const k=Math.round(n*0.2);
  for(let i=0;i<n;i++){
    const x=logAxes?Math.log10(i+1):i+1;
    const y=Math.log10(Math.max(fr[i],1e-9));
    ctx.fillStyle=i<k?'#'+C_HEAD.getHexString():'#'+C_TAIL.getHexString();
    ctx.beginPath();ctx.arc(X(x),Y(logAxes?y:fr[i]),4.5,0,Math.PI*2);ctx.fill();
  }
  /* 拟合线（仅双对数） */
  if(logAxes){
    fit=fitLogLog(fr);
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(X(0),Y(fit.b));
    ctx.lineTo(X(xmax),Y(fit.b+fit.m*xmax));
    ctx.stroke();
  }
}

/* ============ 统计 / 公式 / 步骤 ============ */
const elH=document.getElementById('stHead'),elS=document.getElementById('stSlope'),
      elR=document.getElementById('stRatio'),elN=document.getElementById('stN');
function updateStats(){
  const fr=srcName==='sim'?freqOfCounts():dataFreq;
  fit=fitLogLog(fr);
  elH.innerHTML=(headShare(fr)*100).toFixed(0)+'<small> %</small>';
  elS.textContent=fit.m.toFixed(2);
  const r40=fr.length>40?fr[0]/fr[39]:NaN;
  elR.textContent=Number.isNaN(r40)?'—':(r40>=100?Math.round(r40):r40.toFixed(1))+'×';
  elN.textContent=fr.length;
}
const formulaEl=document.getElementById('formula');
function updateFormula(){
  formulaEl.innerHTML=L(
    `f(k) ∝ k^(−s)，拟合 s=<b>${fit.m.toFixed(2)}</b>；齐普夫定律 s≈1。`+
    `注脚：正态世界（伽尔顿板：大量独立小扰动叠加）有特征尺度、钟形集中；`+
    `幂律世界（优先连接）跨数量级、没有特征尺度——头 20% 拿走大头。`,
    `f(k) ∝ k^(−s), fitted s=<b>${fit.m.toFixed(2)}</b>; Zipf's law s≈1. `+
    `Footnote: the normal world (Galton board: many independent small nudges) has a characteristic scale; `+
    `the power-law world (preferential attachment) spans orders of magnitude.`);
}
const STEPS=[
  {zh:'排队发现规律：第 k 名的频率 ≈ 第 1 名 / k（f(k) ∝ k^−s）',en:'Line them up: the k-th is ≈ 1/k of the first (f(k) ∝ k^−s)',
   act:()=>{loadDataset('word');logAxes=true;document.getElementById('tglLog').checked=true;}},
  {zh:'双对数坐标：齐普夫定律是一条斜率 ≈ −1 的直线',en:'On log-log axes Zipf is a straight line of slope ≈ −1',
   act:()=>{loadDataset('name');logAxes=true;document.getElementById('tglLog').checked=true;}},
  {zh:'没有特征尺度：头 20% 的词拿走 ~80% 的用量',en:'No characteristic scale: the top 20% of words take ~80% of usage',
   act:()=>{loadDataset('city');logAxes=false;document.getElementById('tglLog').checked=false;}},
  {zh:'机制=优先连接：新词/新居民按现有规模加权落下，富者愈富',en:'Mechanism = preferential attachment: newcomers land weighted by size',
   act:()=>{loadDataset('sim');playing=true;syncPlay();}},
  {zh:'拖 α 滑块：0=均匀增长（挤成弯曲线），1=纯马太效应（拉直成 −1）',en:'Drag α: 0 = uniform growth (bent), 1 = pure Matthew effect (straight −1)',
   act:()=>{loadDataset('sim');document.getElementById('sAlpha').value=0;document.getElementById('sAlpha').dispatchEvent(new Event('input'));}},
  {zh:'正态对照：伽尔顿板的钟形有特征尺度；幂律跨数量级',en:'Normal contrast: the Galton bell has a scale; power laws span decades',
   act:()=>{loadDataset('word');logAxes=false;document.getElementById('tglLog').checked=false;}},
  {zh:'无处不在：城市人口、网页入度、地震能量、财富分配',en:'Everywhere: city sizes, web in-degree, quake energies, wealth',
   act:()=>{loadDataset('city');logAxes=true;document.getElementById('tglLog').checked=true;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.zh,s.en)}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ============ UI ============ */
document.getElementById('sAlpha').addEventListener('input',e=>{
  alpha=+e.target.value/100;
  document.getElementById('sAlphaVal').textContent=alpha.toFixed(2);
  if(srcName==='sim')simReset();   // 换机制重长一遍
});
document.getElementById('dsSim').addEventListener('click',()=>{loadDataset('sim');playing=true;syncPlay();});
document.getElementById('dsWord').addEventListener('click',()=>{loadDataset('word');});
document.getElementById('dsCity').addEventListener('click',()=>{loadDataset('city');});
document.getElementById('dsName').addEventListener('click',()=>{loadDataset('name');});
document.getElementById('btnRerun').addEventListener('click',()=>{if(srcName==='sim'){simReset();playing=true;syncPlay();}else loadDataset(srcName);});
document.getElementById('tglLog').addEventListener('change',e=>{logAxes=e.target.checked;
  document.getElementById('plotTitle').textContent=logAxes?L('双对数坐标：log 频率 vs log 排名（白线=最小二乘拟合）','Log-log: log frequency vs log rank (white = least-squares fit)')
    :L('线性坐标：同样的数据被压扁在角落','Linear axes: the same data crushed into a corner');drawPlot();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
const playBtn=document.getElementById('play');
function syncPlay(){playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');}
playBtn.addEventListener('click',()=>{playing=!playing;syncPlay();});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playBtn.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
  drawPlot();
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x0f1113:0xf1efec);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps();updateFormula();loadDataset(srcName);
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(srcName==='sim'){
    if(playing)simAdvance(Math.round(dt*4500));   // 约 1.3s 长完 6000 步
    const fr=freqOfCounts();
    computeHMap(fr);fit=fitLogLog(fr);
    for(let i=0;i<M;i++)bars[i].scale.y=Math.max(hMap(fr[i]),0.01);
    const fp=fitGeo.attributes.position;
    for(let i=0;i<M;i++){
      const f=Math.pow(10,fit.b+fit.m*Math.log10(i+1));
      fp.setXYZ(i,(i-(M-1)/2)*0.52,hMap(f)+0.06,0);
    }
    fp.needsUpdate=true;
    fitLine.visible=true;
  }
  acc+=dt;
  if(acc>0.1){acc=0;updateStats();drawPlot();}
  for(const r of labelReg)r.o.visible=labelsOn;
  for(const o of nameLbls)o.visible=labelsOn;
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ============ 初始化 ============ */
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(qs.get('speed')){/* 本页无速度滑块，参数忽略 */}
applyTheme();applyLang();loadDataset('sim');syncPlay();start();
</script>
