<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>燃气报警器 · 一层二氧化锡守着爆炸窗</title>
<style>
:root, :root[data-theme="dark"] {
color-scheme: dark;
--acc:#2e9c9c;
--bg:#101014; --panel:rgba(15,15,20,.86); --panel-border:rgba(255,255,255,.09);
--text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
--hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
--tool:rgba(15,15,20,.78); --tool-border:rgba(255,255,255,.12);
--cv-pill:rgba(15,15,20,.8);
}
:root[data-theme="light"] {
color-scheme: light;
--acc:#247c7c;
--bg:#f1f0ec; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
--text:#16202c; --text2:#5b6b7d; --text3:#33414f;
--hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
--tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
--cv-pill:rgba(255,255,255,.85);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
transition: background .25s; }
#app { position: fixed; inset: 0; }
#app canvas { display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
:root[data-theme="light"] .lbl { text-shadow: none; }
.lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
.lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
.lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
.lbl.g { border-color: rgba(64,214,198,.9); color: #c5f5ee; }
.lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
:root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
:root[data-theme="light"] .lbl.r { color:#c92a2a; } :root[data-theme="light"] .lbl.g { color:#0b7268; }
#tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
.tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
display: inline-flex; align-items: center; justify-content: center; gap: 6px;
text-decoration: none; backdrop-filter: blur(6px);
transition: border-color .15s, color .15s, transform .15s; }
.tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
#title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
max-width: calc(100vw - 320px); }
#title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
text-shadow: 0 2px 8px rgba(0,0,0,.6); }
#title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
text-shadow: 0 1px 4px rgba(0,0,0,.5); }
#plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 210px;
background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
backdrop-filter: blur(6px); padding: 8px 10px 6px; }
#plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
#plotCv { width: 100%; height: calc(100% - 20px); display: block; }
#stats { position: fixed; right: 18px; bottom: 240px; z-index: 4; background: var(--panel);
border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
#stats .k { font-size: 12px; color: var(--text2); align-self: center; }
#stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
#stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
#stats .v.ok { color: #7bd88f; }
#stats .v.warn { color: #ffa94d; }
#stats .v.bad { color: #ff6b6b; }
#stats .v.acc { color: var(--acc); }
#panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
background: var(--panel); border: 1px solid var(--panel-border);
border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
#legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
.chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
.chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
.chip.g { color: #bdeee8; border-color: rgba(64,214,198,.7); }
:root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.b { color:#1864ab; }
:root[data-theme="light"] .chip.g { color:#0b7268; }
#actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
transition: border-color .15s, color .15s, background .15s; }
.abtn:hover { border-color: var(--acc); color: var(--text); }
.abtn.on { border-color: rgba(46,156,156,.6); background: rgba(46,156,156,.12); color: var(--text); }
.abtn.gas { border-color: rgba(53,214,196,.5); color: #7fe3d6; }
.abtn.gas.on { background: rgba(53,214,196,.15); }
:root[data-theme="light"] .abtn.on { border-color: rgba(36,124,124,.55); background: rgba(36,124,124,.10); }
:root[data-theme="light"] .abtn.gas { color:#0b7268; }
.row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
.row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 62px; text-align: right;
font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
#formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
border-top: 1px dashed var(--panel-border); padding-top: 7px; }
#formula b { color: var(--text3); font-weight: 600; }
#steps { list-style: none; margin-top: 8px; }
#steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
border: 1px solid transparent; align-items: flex-start; }
#steps li:hover { background: var(--hover); }
#steps li.on { background: rgba(46,156,156,.10); border-color: rgba(46,156,156,.45); }
:root[data-theme="light"] #steps li.on { background: rgba(36,124,124,.08); border-color: rgba(36,124,124,.4); }
#steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
display: flex; align-items: center; justify-content: center; margin-top: 1px;
background: rgba(255,255,255,.12); color: var(--text3); }
:root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
#steps li.on .n { background: var(--acc); color: #072a2a; }
#steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
#steps .t b { color: var(--text); font-size: 12px; }
#steps li.on .t b { color: #8ce3dc; }
:root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
#ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
#play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
background: var(--acc); color: #072a2a; border: 0; border-radius: 10px; cursor: pointer; }
#play:hover { filter: brightness(1.08); }
#toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
#toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
cursor: pointer; }
#toggles input { accent-color: var(--acc); }
#rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#rel span { font-size: 11.5px; color: var(--text2); }
#rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
#rel a:hover { color: var(--acc); border-color: var(--acc); }
@media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
@media (max-width: 900px) { #stats { display: none; } }
@media (max-width: 760px) {
#panel { width: calc(100vw - 36px); max-height: 55vh; }
#title { max-width: calc(100vw - 200px); }
#title h1 { font-size: 16px; }
}
/* 控制面板折叠按钮 */
#panelToggle { display: flex; align-items: center; justify-content: center;
width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
#panelToggle:hover { border-color: var(--acc); color: var(--acc); }
#panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
#panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
#panel::-webkit-scrollbar { width: 6px; }
#panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
#panel::-webkit-scrollbar-track { background: transparent; }
#panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
pointer-events: none; opacity: 0; transition: opacity .2s;
background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
#panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
#panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
#panel.collapsed > :not(#panelToggle) { display: none; }
#panel.collapsed > #panelToggle { margin: 0; position: static; }
@media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="燃气报警器:一层二氧化锡守着爆炸窗" data-en="Gas Detector: a tin-oxide film guards the explosion window">燃气报警器:一层二氧化锡守着爆炸窗</h1>
  <div class="sub" data-zh="加热丝把 SnO₂ 烤到 ~300 °C → 表面吸附氧抢走自由电子、电阻高达 ~32 kΩ → 甲烷把电子夺回来、电阻跳水数倍到数十倍 → 跌破 10% LEL(0.5 vol%)报警线,蜂鸣响起 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A heater bakes SnO₂ to ~300 °C → adsorbed oxygen strips free electrons, R ≈ 32 kΩ → methane hands the electrons back, R dives severalfold → below the 10% LEL line (0.5 vol%) the horn fires · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">加热丝把 SnO₂ 烤到 ~300 °C → 表面吸附氧抢走自由电子、电阻高达 ~32 kΩ → 甲烷把电子夺回来、电阻跳水数倍到数十倍 → 跌破 10% LEL(0.5 vol%)报警线,蜂鸣响起 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="传感器电阻" data-en="Sensor R">传感器电阻</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="燃气浓度" data-en="Gas level">燃气浓度</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="加热温度" data-en="Heater temp">加热温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v ok" id="stSt">—</span>
</div>

<div id="plot">
  <h3 data-zh="传感器电阻 R(青)· 红虚线=报警电阻 ~6.2 kΩ(10% LEL)" data-en="Sensor resistance R (teal) · red dashed = alarm threshold ~6.2 kΩ (10% LEL)">传感器电阻 R(青)· 红虚线=报警电阻 ~6.2 kΩ(10% LEL)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip.g" data-zh="青点 甲烷 CH₄" data-en="teal = methane CH₄">青点 甲烷 CH₄</span>
    <span class="chip.o" data-zh="橙点 吸附氧 O⁻" data-en="orange = adsorbed O⁻">橙点 吸附氧 O⁻</span>
    <span class="chip.b" data-zh="蓝点 自由电子" data-en="blue = free electrons">蓝点 自由电子</span>
  </div>
  <div id="actions">
    <button class="abtn gas" id="btnInject" data-zh="喷入燃气" data-en="inject gas">喷入燃气</button>
    <button class="abtn" id="btnVent" data-zh="通风散气" data-en="ventilate">通风散气</button>
    <button class="abtn" id="btnAlc" data-zh="酒精干扰(误报)" data-en="alcohol (false alarm)">酒精干扰(误报)</button>
    <button class="abtn" id="btnMute" data-zh="消音复位" data-en="mute / reset">消音复位</button>
    <button class="abtn" id="btnNG" data-zh="天然气·顶装" data-en="nat. gas · ceiling">天然气·顶装</button>
    <button class="abtn" id="btnLPG" data-zh="液化气·底装" data-en="LPG · floor">液化气·底装</button>
  </div>
  <div class="row"><label data-zh="燃气浓度" data-en="Gas level">燃气浓度</label><input id="gasC" type="range" min="0" max="100" step="1" value="0"><span class="val" id="gasVal">0 %LEL</span></div>
  <div class="row"><label data-zh="加热温度" data-en="Heater temp">加热温度</label><input id="htT" type="range" min="150" max="400" step="5" value="300"><span class="val" id="htVal">300 °C</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../smoke-detector/" data-zh="烟雾报警器" data-en="smoke detector">烟雾报警器</a>
    <a href="../catalytic-converter/" data-zh="催化转化器" data-en="catalytic converter">催化转化器</a>
    <a href="../fire-extinguisher/" data-zh="灭火器" data-en="fire extinguisher">灭火器</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const scene = new THREE.Scene();
function applyTheme() {
htmlEl.dataset.theme = THEME;
document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
scene.background = new THREE.Color(THEME === 'light' ? 0xf1f0ec : 0x101014);
}
function applyLang() {
htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
document.querySelectorAll('[data-zh]').forEach(el => {
el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
});
document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
document.title = L('燃气报警器 · 一层二氧化锡守着爆炸窗', 'Gas Detector · a tin-oxide film guards the explosion window');
buildSteps();
setPlayLabel();
updateFormula();
drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
THEME = THEME === 'dark' ? 'light' : 'dark';
localStorage.setItem('htw-theme', THEME);
applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
LANG = LANG === 'zh' ? 'en' : 'zh';
localStorage.setItem('htw-lang', LANG);
applyLang();
});
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.7, 2.5, 6.3);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.4;
scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);
function mat(color, opts = {}) {
return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const base = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.8, 0.14, 48),
mat(0x23262e, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.55;
scene.add(base);
const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.52, 20),
mat(0x2b2f36, { roughness: 0.8, opacity: 1 }));
pedestal.position.y = -0.22;
scene.add(pedestal);
const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.16, 32),
mat(0x2b2f36, { roughness: 0.7, opacity: 1 }));
flange.position.y = 0.12;
scene.add(flange);
for (let i = 0; i < 5; i++) {
const a = i / 5 * Math.PI * 2 + 0.4;
const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.3, 8), mat(0xc9ccd4, { metalness: 0.8, opacity: 1 }));
pin.position.set(Math.cos(a) * 0.24, -0.06, Math.sin(a) * 0.24);
scene.add(pin);
}

? (coAlarm ? L('CO 报警!', 'CO ALARM') : L('CO 监测', 'CO watch'))
: { ok: L('监测中', 'OK'), near: L('接近阈值', 'NEAR'), alarm: L('报警!', 'ALARM'),
false: L('误报!', 'FALSE'), blind: L('欠温失明', 'COLD') }[alarmState];
stSt.className = 'v ' + (alarmState === 'ok' && !coAlarm ? 'ok' : 'bad');
updateFormula();
drawPlot();
}
for (const r of labelReg) {
const on = labelsOn && r.vis();
r.o.visible = on;
if (on) r.o.element.textContent = r.text();
}
if (phase !== lastStep) {
lastStep = phase;
[...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phase));
}
controls.update();
renderer.render(scene, camera);
labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
C_tgt = clamp(qsFloat('gas', 0), 0, 100);
C_now = C_tgt;
speed = clamp(qsFloat('speed', 1), 0.2, 3);
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
R = rOf(C_now, 300);
for (let i = 0; i < NSAMP; i++) pushSample();
applyTheme();
applyLang();
syncUI();
setPlayLabel();
const t0 = parseInt(qs.get('t'), 10);
if (t0 >= 1 && t0 <= STEPS.length) STEPS[t0 - 1].act();
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
