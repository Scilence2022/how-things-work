<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>冬眠 · 代谢的悬崖,不是斜坡</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#bac8ff;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#4263eb;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}#stats .v.cold{color:#74c0fc}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(186,200,255,.6);background:rgba(186,200,255,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(66,99,235,.55);background:rgba(66,99,235,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(186,200,255,.10);border-color:rgba(186,200,255,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(66,99,235,.08);border-color:rgba(66,99,235,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#dce4ff}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="冬眠与代谢抑制" data-en="Hibernation & Metabolic Suppression">冬眠与代谢抑制</h1>
  <div class="sub" data-zh="短日照与缺粮拧开内分泌闸门,体温从 37 ℃ 直落 5 ℃,代谢被 Q10 一级级腰斩:心跳 300 → 个位数,几分钟一息;每隔数周棕色脂肪点火复温一遍、清掉代谢废物,苏醒时产热全开爬回 37 ℃——不是深睡,是重编程的能耗悬崖 · 拖动旋转 / 空格运行/暂停" data-en="Short days and famine flip the endocrine gate; body temperature plunges 37 → 5 °C while Q10 halves metabolism every 10 degrees: heart 300 → single digits, a breath every few minutes; every few weeks brown fat ignites a brief rewarm to clear metabolic waste; arousal opens the furnace back to 37 °C — not deep sleep, a reprogrammed energy cliff · drag to orbit / Space = run/pause">短日照与缺粮拧开内分泌闸门,体温从 37 ℃ 直落 5 ℃,代谢被 Q10 一级级腰斩:心跳 300 → 个位数,几分钟一息;每隔数周棕色脂肪点火复温一遍、清掉代谢废物,苏醒时产热全开爬回 37 ℃——不是深睡,是重编程的能耗悬崖 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="体温" data-en="Body temp">体温</span><span class="v" id="stTb">—</span>
  <span class="k" data-zh="心率" data-en="Heart rate">心率</span><span class="v" id="stHr">—</span>
  <span class="k" data-zh="代谢率(×常温)" data-en="Metabolic rate">代谢率(×常温)</span><span class="v" id="stMr">—</span>
  <span class="k" data-zh="累计能耗" data-en="Cumulative energy">累计能耗</span><span class="v" id="stE">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn" id="bReset" data-zh="🔄 重置" data-en="🔄 Reset">🔄 重置</button>
    <button class="abtn" id="bEnter" data-zh="入眠" data-en="Enter torpor">入眠</button>
    <button class="abtn" id="bDeep" data-zh="深眠" data-en="Deep torpor">深眠</button>
    <button class="abtn" id="bWake" data-zh="苏醒" data-en="Arouse">苏醒</button>
  </div>
  <div class="row">
    <label data-zh="环境温度" data-en="Cave temp">环境温度</label>
    <input id="sEnv" type="range" min="-5" max="15" step="1" value="5">
    <span class="val" id="sEnvVal">5 °C</span>
  </div>
  <div class="row">
    <label data-zh="时间倍率" data-en="Time scale">时间倍率</label>
    <input id="sSpd" type="range" min="0.2" max="5" step="0.1" value="1">
    <span class="val" id="sSpdVal">1.0×</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglCtrl" type="checkbox"> <span data-zh="对照组" data-en="Control">对照组</span></label>
      <label><input id="tglMon" type="checkbox" checked> <span data-zh="监测板" data-en="Monitor">监测板</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../thermoregulation/" data-zh="体温调节" data-en="Thermoregulation">体温调节</a>
    <a href="../circadian-rhythm/" data-zh="昼夜节律" data-en="Circadian Rhythm">昼夜节律</a>
    <a href="../sleep-brainwaves/" data-zh="睡眠与脑波" data-en="Sleep & Brainwaves">睡眠与脑波</a>
    <a href="../altitude-acclimatization/" data-zh="高原适应" data-en="Altitude Acclimatization">高原适应</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const frac=x=>x-Math.floor(x);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x11151c,26,70);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(-2.2,5.6,12.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.6,1.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=34;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xdde6ff,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 材质与地面 ---- */
const M={
  ground:new THREE.MeshStandardMaterial({color:0x1b2129,roughness:0.95}),
  rock:new THREE.MeshStandardMaterial({color:0x3d4550,roughness:0.9}),
  back:new THREE.MeshStandardMaterial({color:0x171c24,roughness:0.95}),
  snow:new THREE.MeshStandardMaterial({color:0xdce7f2,roughness:0.85}),
  screen:new THREE.MeshStandardMaterial({color:0x0c1016,roughness:0.35,metalness:0.15}),
  frame:new THREE.MeshStandardMaterial({color:0x39424f,roughness:0.6}),
  gate:new THREE.MeshBasicMaterial({color:0xbac8ff,transparent:true,opacity:0.85}),
};
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,48),M.ground);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ---- 洞窟剖面 ---- */
const cave=new THREE.Group();cave.position.set(2.3,0,-0.7);scene.add(cave);
const backWall=new THREE.Mesh(new THREE.BoxGeometry(4.8,3.0,0.4),M.back);
backWall.position.set(0,1.45,-2.0);cave.add(backWall);
const rockGeo=new THREE.DodecahedronGeometry(1,0);
[[0.2,0.8,-1.2,1.5],[2.4,1.1,-1.5,1.9],[4.6,0.7,-1.1,1.4],[-0.2,0.45,0.6,0.95],
 [4.9,0.4,0.7,0.9],[2.3,2.55,-1.2,1.35]].forEach(([x,y,z,s],i)=>{
  const r=new THREE.Mesh(rockGeo,M.rock);
  r.position.set(x,y,z);r.scale.setScalar(s);r.rotation.set(i*1.3,i*0.7,i*0.9);
  cave.add(r);
});
for(let i=0;i<5;i++){
  const sp=new THREE.Mesh(new THREE.SphereGeometry(0.3+((i*37)%23)/40,12,8),M.snow);
  sp.scale.y=0.22;sp.position.set(-2+((i*53)%50)/12,0.02,-0.6+((i*29)%40)/14);
  cave.add(sp);
}
/* 内分泌闸门:发光环,开启=下沉熄灭 */
const gateRing=new THREE.Mesh(new THREE.TorusGeometry(1.15,0.05,10,48),M.gate);
gateRing.position.set(2.3,1.1,0.9);scene.add(gateRing);

/* ---- 蜷缩动物体:体温染色 + 心脏闪光 + 棕色脂肪 ---- */
function makeAnimal(furMat,parent){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.55,26,20),furMat);
  body.scale.set(1.15,0.85,0.95);body.position.y=0.5;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.24,18,14),furMat);
  head.position.set(0.44,0.4,0.3);g.add(head);
  for(const s of[-1,1]){
    const ear=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.13,8),furMat);
    ear.position.set(0.44+s*0.13,0.6,0.28);ear.rotation.z=s*-0.2;g.add(ear);
  }
  const tail=new THREE.Mesh(new THREE.SphereGeometry(0.12,12,10),furMat);
  tail.position.set(-0.58,0.44,-0.2);g.add(tail);
  const heart=new THREE.Mesh(new THREE.SphereGeometry(0.09,14,10),
    new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff4d4d,emissiveIntensity:0.5,roughness:0.4}));
  heart.position.set(0.32,0.5,0.42);g.add(heart);
  const heartLight=new THREE.PointLight(0xff6b6b,0,1.8);
  heartLight.position.set(0.32,0.5,0.55);g.add(heartLight);
  const bfMats=[];
  for(let i=0;i<3;i++){
    const b=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),
      new THREE.MeshStandardMaterial({color:0x8a4a2b,emissive:0xff922b,emissiveIntensity:0,roughness:0.6}));
    b.position.set(-0.18+i*0.18,0.9-(i===1?0.06:0),0.05);g.add(b);bfMats.push(b.material);
  }
  parent.add(g);
  return {g,body,heart,heartLight,bfMats};
}
const hibFur=new THREE.MeshStandardMaterial({color:0xc9856e,roughness:0.85});
const A=makeAnimal(hibFur,scene);
A.g.position.set(2.3,0,0.3);A.g.rotation.y=-0.3;
const ctrlGrp=new THREE.Group();scene.add(ctrlGrp);
const ctrlFur=new THREE.MeshStandardMaterial({color:0x9aa4b5,roughness:0.85,transparent:true,opacity:0.55});
const C=makeAnimal(ctrlFur,ctrlGrp);
C.g.position.set(5.8,0,0.5);C.g.rotation.y=0.4;

/* ---- 冷空气粒子(InstancedMesh) ---- */
const NAIR=240;
const air=new THREE.InstancedMesh(new THREE.SphereGeometry(0.04,6,5),
  new THREE.MeshBasicMaterial({color:0xa5d8ff,transparent:true,opacity:0.4,depthWrite:false}),NAIR);
air.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(air);
const airP=Array.from({length:NAIR},()=>({
  x:-5+Math.random()*11.5,y:0.1+Math.random()*2.8,z:-2.2+Math.random()*4.6,
  v:0.25+Math.random()*0.5,ph:Math.random()*6.283}));

/* ---- 监测板:心电 / 呼吸 / 体温-时间曲线 ---- */
const monGrp=new THREE.Group();
monGrp.position.set(-3.6,1.95,0.9);monGrp.rotation.y=0.22;scene.add(monGrp);
const frameBox=new THREE.Mesh(new THREE.BoxGeometry(3.5,3.6,0.12),M.frame);monGrp.add(frameBox);
const screen=new THREE.Mesh(new THREE.PlaneGeometry(3.3,3.4),M.screen);
screen.position.z=0.065;monGrp.add(screen);
const gridMat=new THREE.LineBasicMaterial({color:0x39424f,transparent:true,opacity:0.85});
const gpts=[[-1.45,1.45],[1.45,1.45],[-1.45,0.45],[1.45,0.45],[-1.45,-0.3],[1.45,-0.3],
  [-1.45,-1.62],[1.45,-1.62],[-1.45,1.45],[-1.45,-1.62],[1.45,1.45],[1.45,-1.62]].map(p=>new THREE.Vector3(p[0],p[1],0.07));
monGrp.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(gpts),gridMat));
/* 心电:每拍一个小峰,间隔随心率拉伸 */
const NE=240,ECGW=1.8;
const ecgGeo=new THREE.BufferGeometry();
ecgGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NE*3),3));
monGrp.add(new THREE.Line(ecgGeo,new THREE.LineBasicMaterial({color:0x69db7c})));
function ecgY(u){
  const g=(c,w)=>{let d=Math.abs(u-c);d=Math.min(d,1-d);return Math.exp(-d*d/w);};
  return 0.14*g(0.16,0.002)-0.16*g(0.285,0.0008)+g(0.31,0.0006)-0.22*g(0.335,0.001)+0.22*g(0.55,0.005);
}
/* 呼吸:慢正弦 */
const NR=120,RESPW=12;
const respGeo=new THREE.BufferGeometry();
respGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NR*3),3));
monGrp.add(new THREE.Line(respGeo,new THREE.LineBasicMaterial({color:0x66d9e8})));
/* 体温历史(含间歇复温小峰) */
const NT=480;
const tGeo=new THREE.BufferGeometry();
tGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NT*3),3));
tGeo.setDrawRange(0,0);
monGrp.add(new THREE.Line(tGeo,new THREE.LineBasicMaterial({color:0xbac8ff})));
const histTb=[];
const y37=-1.62+37/40*1.2;
const ref37=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(-1.45,y37,0.072),new THREE.Vector3(1.45,y37,0.072)]),
  new THREE.LineDashedMaterial({color:0x8a93a3,dashSize:0.07,gapSize:0.05,transparent:true,opacity:0.7}));
ref37.computeLineDistances();monGrp.add(ref37);

/* ---- 能耗累计条:冬眠 vs 对照 ---- */
const barsG=new THREE.Group();barsG.position.set(-0.9,0,2.1);scene.add(barsG);
const barBase=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.08,0.7),
  new THREE.MeshStandardMaterial({color:0x2a323d,roughness:0.8}));
barBase.position.y=0.04;barsG.add(barBase);
const barH=new THREE.Mesh(new THREE.BoxGeometry(0.44,1,0.44),
  new THREE.MeshStandardMaterial({color:0xbac8ff,emissive:0xbac8ff,emissiveIntensity:0.25,roughness:0.4}));
barH.position.set(-0.35,0.08,0);barsG.add(barH);
const barC=new THREE.Mesh(new THREE.BoxGeometry(0.44,1,0.44),
  new THREE.MeshStandardMaterial({color:0xff8785,emissive:0xff8785,emissiveIntensity:0.25,roughness:0.4}));
barC.position.set(0.35,0.08,0);barsG.add(barC);

/* ---- 状态与生理模型 ---- */
const DAYRATE=0.8;
let mode='awake',gate=0,gateTarget=0,Tb=37,MR=1,HR=300;
let simDays=0,E_h=0,E_c=0,rewarmT=0,nextRewarm=7;
let env=5,timeMult=1;
let playing=true,labelsOn=true,ctrlOn=false,monOn=true;
let heartPhase=0,heartPulse=0,breathPhase=0,chPhase=0,respT=0,sampleAcc=0,bfGlow=0,wallT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const ctrlBurn=()=>1+Math.max(0,20-env)*0.07;
function physStep(dd){
  simDays+=dd;
  gate=lerp(gate,gateTarget,clamp(dd*6,0,1));
  let tgt,tau,burn;
  if(mode==='awake'){tgt=37;tau=0.5;burn=ctrlBurn();}
  else if(mode==='rewarm'){tgt=17;tau=0.35;burn=4.5;}
  else if(mode==='arouse'){tgt=37;tau=0.8;burn=6;}
  else{tgt=env+1;tau=1.1;burn=1;}
  Tb=lerp(Tb,tgt,clamp(dd/tau,0,1));
  const supp=(mode==='enter'||mode==='torpor')?lerp(1,0.15,clamp(gate,0,1)):1;
  const q10=Math.pow(2,(Tb-37)/10);
  MR=clamp(burn*supp*q10,0.02,8);
  if(mode==='enter'&&Tb<12){mode='torpor';nextRewarm=7;}
  else if(mode==='torpor'){nextRewarm-=dd;if(nextRewarm<=0){mode='rewarm';rewarmT=0.6;}}
  else if(mode==='rewarm'){rewarmT-=dd;if(rewarmT<=0){mode='torpor';nextRewarm=6+Math.random()*4;}}
  HR=3+297*Math.pow(clamp((Tb-5)/32,0,1),2.5);
  E_h+=MR*dd;E_c+=ctrlBurn()*dd;
}
function ff(days){
  let g=0;
  while(days>0&&g++<4000){const d=Math.min(0.02,days);physStep(d);days-=d;}
  histTb.push(Tb);if(histTb.length>NT)histTb.shift();
}
function resetAll(){mode='awake';gate=0;gateTarget=0;Tb=37;E_h=0;E_c=0;simDays=0;nextRewarm=7;bfGlow=0;}
function startEnter(){mode='enter';gateTarget=1;}
function startRewarm(){mode='rewarm';rewarmT=0.6;}
function startArouse(){mode='arouse';gateTarget=0;}
const brVis=()=>clamp(HR/8,0.5,38);

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`内分泌闸门 开度 ${(gate*100).toFixed(0)}%`,`Endocrine gate ${(gate*100).toFixed(0)}% open`),
  new THREE.Vector3(2.3,3.2,0.2),'o');
addLabel(()=>{const q=Math.pow(2,(Tb-37)/10);
  return L(`Q10 台阶:每降 10 ℃ 代谢 ÷2 → 纯 Q10 项 ${q.toFixed(3)}×`,
    `Q10 steps: ÷2 per 10 °C → pure Q10 term ${q.toFixed(3)}×`);},
  new THREE.Vector3(-3.6,3.95,0.9),'b');
addLabel(()=>L('棕色脂肪点火:燃烧复温、清代谢废物','Brown fat ignition: burn to rewarm & clear waste'),
  new THREE.Vector3(2.6,1.65,0.9),'r',()=>mode==='rewarm'||(mode==='arouse'&&Tb<30));
addLabel(()=>{const pct=E_c>0.3?(E_h/E_c*100).toFixed(1):'—';
  return L(`悬崖式能耗:冬眠累计仅为对照的 ${pct}%`,`Cliff energy: hibernator total = ${pct}% of control`);},
  new THREE.Vector3(-0.9,3.5,2.1),'g',()=>E_c>0.5);

/* ---- 控件 ---- */
function setEnv(v){env=clamp(v,-5,15);
  document.getElementById('sEnv').value=env;
  document.getElementById('sEnvVal').textContent=env+' °C';}
function setSpd(v){timeMult=clamp(v,0.2,5);
  document.getElementById('sSpd').value=timeMult;
  document.getElementById('sSpdVal').textContent=timeMult.toFixed(1)+'×';}
function setCtrl(v){ctrlOn=v;
  document.getElementById('tglCtrl').checked=v;
  ctrlGrp.visible=v;barC.visible=v;}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'入眠闸门:短日照+缺粮,内分泌开关拧开',en:'Entry gate: short days + famine flip the switch',
  act(){resetAll();setEnv(5);startEnter();}},
 {zh:'体温滑落:Q10 逐级腰斩',en:'Temperature slide: Q10 halves it again and again',
  act(){resetAll();startEnter();ff(1.5);}},
 {zh:'深度冬眠:心跳个位数,几分钟一息',en:'Deep torpor: single-digit heart rate, minutes per breath',
  act(){resetAll();startEnter();ff(5);}},
 {zh:'间歇复温:棕色脂肪点火清废物',en:'Intermittent rewarm: brown fat ignites to clear waste',
  act(){resetAll();startEnter();ff(5);startRewarm();}},
 {zh:'苏醒:产热全开,爬回 37 ℃',en:'Arousal: furnace wide open, climbing back to 37 °C',
  act(){resetAll();startEnter();ff(5);startArouse();ff(0.4);}},
 {zh:'不冬眠对照:能耗差出几十倍',en:'No-hibernation control: tens of times the energy',
  act(){resetAll();startEnter();ff(24);setCtrl(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const eTb=document.getElementById('stTb');
  eTb.innerHTML=Tb.toFixed(1)+'<small>°C</small>';
  eTb.className='v '+(Tb<12?'cold':(Tb>=35?'ok':''));
  const eHr=document.getElementById('stHr');
  eHr.innerHTML=(HR<10?HR.toFixed(1):String(Math.round(HR)))+'<small>bpm</small>';
  const eMr=document.getElementById('stMr');
  eMr.innerHTML=(MR<0.1?MR.toFixed(3):MR.toFixed(2))+'<small>×</small>';
  eMr.className='v '+(MR<0.1?'ok':'');
  document.getElementById('stE').innerHTML=E_h.toFixed(1)+'<small>'+L('常温日','basal-days')+'</small>';
}

/* ---- 事件 ---- */
let slowMo=false;
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bReset').addEventListener('click',resetAll);
document.getElementById('bEnter').addEventListener('click',()=>{resetAll();startEnter();});
document.getElementById('bDeep').addEventListener('click',()=>{resetAll();startEnter();ff(5);});
document.getElementById('bWake').addEventListener('click',()=>{if(mode!=='awake')startArouse();});
document.getElementById('sEnv').addEventListener('input',e=>setEnv(+e.target.value));
document.getElementById('sSpd').addEventListener('input',e=>setSpd(+e.target.value));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCtrl').addEventListener('change',e=>setCtrl(e.target.checked));
document.getElementById('tglMon').addEventListener('change',e=>{monOn=e.target.checked;monGrp.visible=monOn;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x11151c:0xe9e4dc);
  scene.fog.color.setHex(dark?0x11151c:0xe9e4dc);
  M.ground.color.setHex(dark?0x1b2129:0xc6ccd6);
  M.rock.color.setHex(dark?0x3d4550:0x9aa3ae);
  M.back.color.setHex(dark?0x171c24:0xb7bec8);
  M.frame.color.setHex(dark?0x39424f:0x8b95a2);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();updateStats();
}

/* ---- 监测板逐帧重画 ---- */
function updateMonitor(){
  if(!monGrp.visible)return;
  const hz=clamp(HR/60*Math.min(timeMult,2),0.01,6);
  const p=ecgGeo.attributes.position;
  for(let i=0;i<NE;i++){
    const toff=-ECGW*(NE-1-i)/(NE-1);
    p.setXYZ(i,-1.45+2.9*i/(NE-1),0.62+ecgY(frac(heartPhase+toff*hz))*0.5,0.072);
  }
  p.needsUpdate=true;
  const per=clamp(60/brVis(),1.2,12);
  const q=respGeo.attributes.position;
  for(let i=0;i<NR;i++){
    const ts=respT-RESPW*(NR-1-i)/(NR-1);
    q.setXYZ(i,-1.45+2.9*i/(NR-1),-0.02+0.17*Math.sin(6.283*ts/per),0.072);
  }
  q.needsUpdate=true;
  const n=histTb.length,r=tGeo.attributes.position;
  for(let i=0;i<n;i++){
    r.setXYZ(i,-1.45+2.9*((i+NT-n)/(NT-1)),-1.62+clamp(histTb[i],0,40)/40*1.2,0.072);
  }
  r.needsUpdate=true;tGeo.setDrawRange(0,n);
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,statAcc=0;
const dummy=new THREE.Object3D();
const cCold=new THREE.Color(0x5f8fc7),cWarm=new THREE.Color(0xc9856e),tmpC=new THREE.Color();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?timeMult:0)*(slowMo?0.3:1);
  wallT+=dt;
  if(dts>0){
    physStep(dts*DAYRATE);
    respT+=dt;sampleAcc+=dt;
    if(sampleAcc>=0.12){sampleAcc=0;histTb.push(Tb);if(histTb.length>NT)histTb.shift();}
  }
  /* 心跳:间隔从 0.2 s 拉到 5 s 以上 */
  const hz=clamp(HR/60*Math.min(timeMult,2),0.01,6);
  const pb=Math.floor(heartPhase);
  if(playing)heartPhase+=dt*hz;
  if(Math.floor(heartPhase)>pb)heartPulse=1;
  heartPulse*=Math.exp(-dt*5);
  A.heart.material.emissiveIntensity=0.4+heartPulse*2.6;
  A.heart.scale.setScalar(1+heartPulse*0.35);
  A.heartLight.intensity=heartPulse*2.5;
  /* 呼吸:深眠时一轮十几秒 */
  breathPhase+=dt*(playing?1:0)/clamp(60/brVis(),1.2,12);
  A.body.scale.y=0.85*(1+0.05*Math.sin(breathPhase*6.283));
  /* 对照影:清醒、在冷里发抖、心跳急促 */
  chPhase+=dt*5;
  const gp=Math.max(0,Math.sin(chPhase*Math.PI));
  C.heart.material.emissiveIntensity=0.5+gp*1.8;
  C.heart.scale.setScalar(1+gp*0.25);
  C.g.position.x=5.8+Math.sin(wallT*30)*0.008;
  /* 棕色脂肪:复温/苏醒时点亮 */
  bfGlow=lerp(bfGlow,(mode==='rewarm'||mode==='arouse')?1:0,clamp(dt*3,0,1));
  for(const m of A.bfMats)m.emissiveIntensity=bfGlow*(1.8+0.6*Math.sin(wallT*18+m.id));
  /* 体温染色:蓝(5 ℃)→ 暖棕(37 ℃) */
  tmpC.copy(cCold).lerp(cWarm,clamp((Tb-5)/32,0,1));
  hibFur.color.copy(tmpC);
  /* 闸门环 */
  gateRing.position.y=lerp(1.1,0.1,clamp(gate,0,1));
  M.gate.opacity=lerp(0.85,0.12,clamp(gate,0,1));
  gateRing.rotation.z+=dt*0.15;
  /* 冷空气粒子 */
  for(let i=0;i<NAIR;i++){
    const pt=airP[i];
    pt.x-=pt.v*dts*1.2;
    if(pt.x<-5.2)pt.x+=12;
    dummy.position.set(pt.x,pt.y+0.08*Math.sin(respT*1.5+pt.ph),pt.z);
    dummy.scale.setScalar(0.7+0.5*Math.sin(pt.ph*3.7));
    dummy.updateMatrix();
    air.setMatrixAt(i,dummy.matrix);
  }
  air.instanceMatrix.needsUpdate=true;
  /* 能耗条:几乎停涨 vs 一直烧 */
  const hE=clamp(E_h*0.064,0.02,3.2),hC=clamp(E_c*0.064,0.02,3.2);
  barH.scale.y=hE;barH.position.y=0.08+hE/2;
  barC.scale.y=hC;barC.position.y=0.08+hC/2;
  updateMonitor();
  /* 读数节流 */
  statAcc+=dt;
  if(statAcc>0.2){statAcc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
setCtrl(false);
setEnv(5);setSpd(1);
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
