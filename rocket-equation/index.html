<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火箭与齐奥尔科夫斯基方程 · 对数墙与分级</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#0b0f16; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.ok { border-color: rgba(123,216,143,.9); color: #b7f0c6; }
  .lbl.st { border-color: rgba(255,209,102,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { color: #8a5c0d; }
  :root[data-theme="light"] .lbl.b { color: #1b7ca0; }
  :root[data-theme="light"] .lbl.ok { color: #1e7a3c; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    max-width: 640px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: var(--acc); }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.bad { color: #ff8a6b; }
  :root[data-theme="light"] #stats .v.ok { color: #1e7a3c; }
  :root[data-theme="light"] #stats .v.bad { color: #c23b22; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 396px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.f { color: #ffd166; border-color: rgba(255,209,102,.7); }
  .chip.s { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .chip.t { color: #7bd88f; border-color: rgba(123,216,143,.7); }
  :root[data-theme="light"] .chip.f { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  :root[data-theme="light"] .chip.s { color: #1b7ca0; border-color: rgba(27,124,160,.7); }
  :root[data-theme="light"] .chip.t { color: #1e7a3c; border-color: rgba(30,122,60,.7); }
  #actions { display: flex; gap: 7px; margin-bottom: 9px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 28%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 6px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,209,102,.65); background: rgba(255,209,102,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(176,118,31,.55); background: rgba(176,118,31,.10); }
  .abtn.fire { flex: 1 1 60%; background: rgba(255,209,102,.14); border-color: rgba(255,209,102,.55); color: var(--text); }
  #chart { display: block; width: 100%; aspect-ratio: 352 / 210; border-radius: 10px;
    border: 1px solid var(--panel-border); background: rgba(0,0,0,.18); }
  :root[data-theme="light"] #chart { background: rgba(255,255,255,.5); }
  #chartCap { font-size: 11px; line-height: 1.5; color: var(--text2); margin: 5px 0 7px; }
  #chartCap b { color: var(--acc); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 108px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<div id="title">
  <h1 data-zh="火箭与齐奥尔科夫斯基方程:对数墙与分级" data-en="Rockets &amp; the Tsiolkovsky Equation: the log wall and staging">火箭与齐奥尔科夫斯基方程:对数墙与分级</h1>
  <div class="sub" data-zh="Δv = ve·ln(m0/mf):质量比每翻一倍只多得 ~2.3 km/s——对数墙前唯有边飞边扔空壳;点火看液位烧干、逐级抛离,指针连闯 LEO 9.4 / 地月 12.6 / 火星 13.0 km/s · 空格播放/暂停" data-en="Δv = ve·ln(m0/mf): every doubling of mass ratio buys just ~2.3 km/s more — past the log wall only by dropping empty shells; ignite to watch tanks drain and stages fall away as the needle clears LEO 9.4 / Moon 12.6 / Mars 13.0 km/s · Space = play/pause">Δv = ve·ln(m0/mf):质量比每翻一倍只多得 ~2.3 km/s——对数墙前唯有边飞边扔空壳;点火看液位烧干、逐级抛离,指针连闯 LEO 9.4 / 地月 12.6 / 火星 13.0 km/s · 空格播放/暂停</div>

    <a href="../time-dilation/" data-zh="快到时间变慢:时间膨胀" data-en="fast enough to slow time: dilation">快到时间变慢:时间膨胀</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
const CHC = {};
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dk = THEME === 'dark';
  scene.background = new THREE.Color(dk ? 0x070a12 : 0xe9eef5);
  starMesh.material.opacity = dk ? 0.8 : 0;
  M.floor.color.set(dk ? 0x161c26 : 0xd6dce6);
  Object.assign(CHC, {
    grid: dk ? 'rgba(160,180,205,.14)' : 'rgba(50,70,95,.14)',
    axis: dk ? 'rgba(200,214,230,.45)' : 'rgba(40,55,75,.5)',
    txt: dk ? 'rgba(200,214,230,.85)' : 'rgba(40,55,75,.85)',
    dim: dk ? 'rgba(160,175,195,.55)' : 'rgba(90,105,125,.6)',
    acc: dk ? '#ffd166' : '#b0761f',
    ideal: dk ? 'rgba(150,168,190,.5)' : 'rgba(90,105,125,.5)',
    real: dk ? '#ffd166' : '#b0761f',
    ok: dk ? '#7bd88f' : '#1e7a3c',
  });
  drawChart();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('火箭与齐奥尔科夫斯基方程 · 对数墙与分级', 'Rockets & Tsiolkovsky · the log wall and staging');
  refreshConfigUI();
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  drawChart();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
camera.position.set(4.6, 4.4, 11.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 34;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.35);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* 星空 */
const starMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.04, 0),
  new THREE.MeshBasicMaterial({ color: 0xcfd8ea, transparent: true, opacity: 0.8 }), 260);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < 260; i++) {
    const a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1), r = 26 + Math.random() * 40;
    p.set(Math.sin(b) * Math.cos(a) * r, Math.cos(b) * r * 0.7 + 8, Math.sin(b) * Math.sin(a) * r);
    const k = 0.5 + Math.random() * 1.3;
    s.set(k, k, k);
    m.compose(p, q, s);
    starMesh.setMatrixAt(i, m);
  }
}
scene.add(starMesh);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, ...opts });
}
const M = {

const FUELS = {
  solid: { ve: 2.9, zh: '固体', en: 'solid', c1: 0xfff2d0, c2: 0xffa040 },
  kero: { ve: 3.3, zh: '煤油', en: 'kerosene', c1: 0xffe0a0, c2: 0xff7a3d },
  lh2: { ve: 4.4, zh: '液氢', en: 'hydrogen', c1: 0xd8ecff, c2: 0x74a8ff },
};
const FKEYS = ['solid', 'kero', 'lh2'];
const MPT = 126;
const MP_SETS = { 1: [126], 2: [100.8, 25.2], 3: [96, 24, 6] };
const MPL = 1;
const G0 = 9.81, TW0 = 1.4;
const TARGETS = [
  { dv: 9.4, zh: 'LEO 近地轨道', en: 'LEO', note: '9.4' },
  { dv: 12.6, zh: '地月转移', en: 'Moon', note: '+3.2' },

let N = 3, fuelKey = 'kero';

let stages = [];
let totDv = 0, dvSE = 0, MPtot = 0, MStot = 0, m0tot = 0, fuelPct = 0;

function recompute() {
  const F = FUELS[fuelKey], mps = MP_SETS[N];
  stages = [];
  let above = MPL;
  for (let i = N - 1; i >= 0; i--) {
    const mp = mps[i], ms = mp * (1 - fv[i]) / fv[i];
    const mIgn = above + ms + mp;
    stages[i] = { mp, ms, above, mIgn, level: 1, dropped: false,
      dv: F.ve * Math.log(mIgn / (mIgn - mp)),
      TB: mp * F.ve / (TW0 * mIgn * G0) };
    above += ms + mp;
  }
  totDv = stages.reduce((s, x) => s + x.dv, 0);
  MPtot = stages.reduce((s, x) => s + x.mp, 0);
  MStot = stages.reduce((s, x) => s + x.ms, 0);
  m0tot = above;
  fuelPct = MPtot / m0tot;
  dvSE = F.ve * Math.log((MPL + MStot + MPtot) / (MPL + MStot));
}

  for (const st of stages) if (st.lab) rmLabel(st.lab);

  const F = FUELS[fuelKey];
  let y = 0;
  stages.forEach((st, i) => {
    const s = Math.cbrt(st.mp);
    const r = clamp(0.105 * s + 0.07, 0.18, 0.62);

    const g = new THREE.Group();

    shell.position.y = hgt / 2;

    for (const yy of [0.02, hgt - 0.02]) {

      ring.rotation.x = Math.PI / 2;

    const fMax = hgt * 0.92;

    fuel.position.y = fMax / 2 + hgt * 0.02;
    g.add(fuel);
    const bellH = 0.2 + r * 0.5;
    const bellMat = M.bell.clone();
    bellMat.userData.dyn = true;
    const bell = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.42, r * 0.66, bellH, 20, 1, true), bellMat);
    bell.position.y = -bellH / 2;
    g.add(bell);
    const flameMat = new THREE.MeshBasicMaterial({ color: F.c1, transparent: true, opacity: 0.85,
      blending: THREE.AdditiveBlending, depthWrite: false });

    const flame = new THREE.Mesh(new THREE.ConeGeometry(r * 0.5, 1, 14), flameMat);
    flame.rotation.x = Math.PI;
    flame.position.y = -bellH;

    if (i === 0) {
      for (let k = 0; k < 3; k++) {

        const a = k * Math.PI * 2 / 3 + Math.PI * 0.4;

    st.grp = g; st.fuel = fuel; st.flame = flame; st.bell = bell;
    st.fMax = fMax; st.hgt = hgt; st.r = r; st.bellH = bellH; st.baseY = y;
    st.lab = addLabel(() => {
      if (st.dropped) return L(`${stageName(i)}空壳已抛 · 死重 ${st.ms.toFixed(1)}`, `${stageName(i)} shell away · ${st.ms.toFixed(1)} dead mass`);

        const m = st.mIgn - st.mp * (1 - st.level);

        return L(`${stageName(i)}燃烧中 · a = ${a.toFixed(1)} m/s² · 真实燃烧约 ${st.TB.toFixed(0)} s`,
          `${stageName(i)} burning · a = ${a.toFixed(1)} m/s² · real burn ≈ ${st.TB.toFixed(0)} s`);
      }
      return L(`${stageName(i)} · 燃料 ${(fv[i] * 100).toFixed(1)}% → Δv ${st.dv.toFixed(1)} km/s`,
        `${stageName(i)} · fuel ${(fv[i] * 100).toFixed(1)}% → Δv ${st.dv.toFixed(1)} km/s`);
    }, g, new THREE.Vector3(r + 0.5, hgt * 0.6, 0), i === 0 ? 'st' : '');

const PMAX = 260;
const plume = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 6, 5),
  new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }), PMAX);
plume.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
plume.frustumCulled = false;
scene.add(plume);
const parts = Array.from({ length: PMAX }, () => ({
  life: 0, max: 1, x: 0, y: -99, z: 0, vx: 0, vy: 0, vz: 0, sz: 1,
  ca: new THREE.Color(), cb: new THREE.Color(),
}));
const dummy = new THREE.Object3D(), cTmp = new THREE.Color();
for (let i = 0; i < PMAX; i++) {
  dummy.position.set(0, -99, 0);
  dummy.scale.setScalar(0.0001);
  dummy.updateMatrix();
  plume.setMatrixAt(i, dummy.matrix);
  plume.setColorAt(i, cTmp.set(0xffffff));
}
plume.instanceMatrix.needsUpdate = true;
if (plume.instanceColor) plume.instanceColor.needsUpdate = true;
let pCursor = 0, emitAcc = 0;
function emit(n, ox, oy, oz, spread, vDown, colA, colB) {
  for (let k = 0; k < n; k++) {
    const p = parts[pCursor];
    pCursor = (pCursor + 1) % PMAX;
    p.max = p.life = 0.45 + Math.random() * 0.5;
    p.x = ox + (Math.random() - 0.5) * spread;
    p.y = oy;
    p.z = oz + (Math.random() - 0.5) * spread;
    p.vx = (Math.random() - 0.5) * 0.9;
    p.vy = -vDown * (0.7 + Math.random() * 0.6);
    p.vz = (Math.random() - 0.5) * 0.9;
    p.sz = 0.5 + Math.random() * 0.9;
    p.ca.copy(colA); p.cb.copy(colB);
  }
}
function updatePlume(dt) {
  if (dt <= 0) return;
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (p.life > 0) {
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      const k = Math.max(p.life / p.max, 0);
      dummy.position.set(p.x, p.y, p.z);
      dummy.scale.setScalar(Math.max(p.sz * (0.4 + 0.6 * (1 - k)) * k, 0.0001));
      cTmp.copy(p.ca).lerp(p.cb, k);
      plume.setColorAt(i, cTmp);
    } else {
      dummy.position.set(0, -99, 0);
      dummy.scale.setScalar(0.0001);
    }
    dummy.updateMatrix();
    plume.setMatrixAt(i, dummy.matrix);
  }
  plume.instanceMatrix.needsUpdate = true;
  if (plume.instanceColor) plume.instanceColor.needsUpdate = true;
}

/* ================= 飞行状态机 ================= */
function restage() {
  for (const st of stages) {
    if (st.dropped && st.grp.parent !== rocket) rocket.add(st.grp);
    st.dropped = false;
    st.level = 1;
    st.grp.position.set(0, st.baseY, 0);
    st.grp.rotation.set(0, 0, 0);
    st.grp.scale.setScalar(1);
    st.flame.visible = false;
    st.bell.material.emissive.setHex(0x4a4f58);
    st.bell.material.emissiveIntensity = 0.06;
  }
}
function clearDebris() {
  for (const d of debris) rmLabel(d.st.lab);
  debris.length = 0;
}
function resetFlight(rebuild = true) {
  TWN.on = false;
  clearDebris();
  if (rebuild) buildRocket();
  else restage();
  phase = 'idle'; curStage = 0; burnT = 0; sepT = 0;
  dvAcc = 0; dvNow = 0; alt = 0;
  rocket.position.y = PAD_Y;
  drawChart();
}
function ignite() {
  if (phase === 'burn' || phase === 'sep') return;
  if (phase === 'done') resetFlight(false);
  phase = 'burn'; curStage = 0; burnT = 0;
  playing = true; setPlayLabel();
  drawChart();
}
function separate() {
  const st = stages[curStage];
  st.dropped = true;
  st.flame.visible = false;
  rocket.remove(st.grp);
  st.grp.position.y = PAD_Y + alt + st.baseY;
  scene.add(st.grp);
  debris.push({ st, vy: 0.4, vx: (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.6),
    ax: (Math.random() - 0.5) * 1.6, landed: false, tLand: 0 });
  const F = FUELS[fuelKey];
  emit(36, st.grp.position.x, st.grp.position.y + st.hgt + 0.15, 0, st.r * 1.4, 0.6,
    CA.set(F.c1), CB.set(F.c2));
  phase = 'sep'; sepT = 0;
}
function flightStep(dts) {
  if (phase === 'burn') {
    const st = stages[curStage], F = FUELS[fuelKey];
    burnT += dts;
    const k = Math.min(burnT / (st.TB * 0.022 + 1.8), 1);
    st.level = 1 - k;
    const m = st.mIgn - st.mp * k;
    dvNow = F.ve * Math.log(st.mIgn / m);
    st.flame.visible = true;
    st.flame.scale.set(1 + 0.15 * Math.sin(tSim * 31), 0.9 + 0.5 * Math.abs(Math.sin(tSim * 23)) + k * 0.4, 1 + 0.15 * Math.sin(tSim * 29));
    st.flame.material.opacity = 0.75 + 0.2 * Math.sin(tSim * 41);
    st.bell.material.emissive.set(F.c2);
    st.bell.material.emissiveIntensity = 0.9;
    st.grp.getWorldPosition(v3a);
    emitAcc += dts * 150;
    const n = Math.floor(emitAcc);
    emitAcc -= n;
    emit(n, v3a.x, v3a.y - st.bellH - 0.15, v3a.z, st.r * 0.9, 3.2, CA.set(F.c1), CB.set(F.c2));
    if (alt < 0.6) emit(n, v3a.x, 0.3, v3a.z, st.r * 2.2, 0.25, CD1, CD2);
    if (k >= 1) {
      dvAcc += st.dv; dvNow = 0;
      st.level = 0;
      st.flame.visible = false;
      st.bell.material.emissiveIntensity = 0.06;
      if (curStage < N - 1) separate();
      else { phase = 'done'; drawChart(); }
    }
  } else if (phase === 'sep') {
    sepT += dts;
    if (sepT > 1.15) { curStage++; burnT = 0; phase = 'burn'; }
  }
  if (phase !== 'idle' && alt < 26) alt += dvCur() * 0.085 * dts;
  rocket.position.y = PAD_Y + alt;
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i], g = d.st.grp;
    if (!d.landed) {
      d.vy -= 2.2 * dts;
      g.position.y += d.vy * dts;
      g.position.x += d.vx * dts;
      g.rotation.z += d.ax * dts;
      g.rotation.x += d.ax * 0.6 * dts;
      const landY = 0.15 + d.st.hgt * 0.45;
      if (g.position.y <= landY) {
        g.position.y = landY;
        if (Math.abs(d.vy) > 0.8) {
          d.vy = -d.vy * 0.3; d.vx *= 0.5;
          emit(10, g.position.x, landY, g.position.z, d.st.r * 1.6, 0.3, CD1, CD2);
        } else { d.landed = true; d.tLand = 0; }
      }
    } else {
      d.tLand += dts;
      if (d.tLand > 1.2) {
        const s = Math.max(1 - (d.tLand - 1.2) / 0.8, 0.001);
        g.scale.setScalar(s);
        if (s <= 0.001) { rmLabel(d.st.lab); scene.remove(g); debris.splice(i, 1); }
      }
    }
  }
  const dh = rocket.position.y - PAD_Y - followH;
  if (Math.abs(dh) > 1e-6) {
    followH += dh;
    camera.position.y += dh;
    controls.target.y += dh;
  }
  ladder.position.y = PAD_Y + followH;
  for (const st of stages) {
    if (st.dropped || !st.fuel) continue;
    const lv = st.level;
    st.fuel.scale.y = Math.max(st.fMax * lv, 0.001);
    st.fuel.position.y = st.fMax * lv / 2 + st.hgt * 0.02;
    st.fuel.material.color.setHSL(lerp(0.02, 0.115, lv), 0.95, lerp(0.48, 0.62, lv));
    st.fuel.material.emissive.setHSL(lerp(0.01, 0.09, lv), 0.9, 0.42);
  }
  const f = clamp(dvCur() / DVM, 0, 1);
  ladFill.scale.y = Math.max(f * LAD_H, 0.001);
  ladFill.position.y = f * LAD_H / 2;
  ladTop.position.y = f * LAD_H;
  for (const tk of ladTicks) {
    const passed = dvCur() >= tk.t.dv - 1e-9;
    const planned = totDv >= tk.t.dv - 1e-9;
    tk.ring.material.color.set(passed ? 0x7bd88f : planned ? 0xffd166 : 0x8fa3b8);
  }
}

const chartEl = document.getElementById('chart');
const chartCap = document.getElementById('chartCap');
const ctx = chartEl.getContext('2d');
const CW = 352, CH = 210, ML = 34, MR = 60, MT = 12, MB = 24;
const PW = CW - ML - MR, PH = CH - MT - MB;
const xOf = f => ML + (f - 0.7) / 0.3 * PW;
const yOf = dv => MT + PH - clamp(dv / DVM, 0, 1.04) * PH;
const fOfR = R => MPT * (R - 1) / (1 + R * (MPT - 1));
const dvReal = (f, ve) => {
  const ms = MPT * (1 - f) / f;
  return ve * Math.log((MPL + ms + MPT) / (MPL + ms));
};
function fFor(dvWant, ve) {
  let lo = 0.7, hi = 0.9999;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    (dvReal(mid, ve) < dvWant) ? lo = mid : hi = mid;
  }
  return (lo + hi) / 2;
}
function drawChart() {
  if (!CHC.txt) return;
  const dpr = Math.min(devicePixelRatio, 2);
  const W = Math.round(CW * dpr), H = Math.round(CH * dpr);
  if (chartEl.width !== W) { chartEl.width = W; chartEl.height = H; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, CW, CH);
  ctx.font = '9.5px system-ui, sans-serif';
  const F = FUELS[fuelKey];
  const cur = dvCur();
  ctx.strokeStyle = CHC.grid; ctx.fillStyle = CHC.dim; ctx.lineWidth = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const f of [0.7, 0.8, 0.9, 0.95, 0.99, 0.999]) {
    const x = xOf(f);
    ctx.beginPath(); ctx.moveTo(x, MT); ctx.lineTo(x, MT + PH); ctx.stroke();
    ctx.fillText((f * 100).toFixed(f === 0.999 ? 1 : 0) + '%', x, MT + PH + 4);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const d of [0, 3, 6, 9, 12, 15, 18]) {
    const y = yOf(d);
    ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(ML + PW, y); ctx.stroke();
    ctx.fillText(d + '', ML - 4, y);
  }
  ctx.fillStyle = CHC.txt;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(L('Δv km/s', 'Δv km/s'), 4, MT + 8);
  /* 目标线 */
  for (const t of TARGETS) {
    const y = yOf(t.dv);
    const passed = totDv >= t.dv - 1e-9;
    ctx.strokeStyle = passed ? CHC.ok : CHC.dim;
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = passed ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(ML + PW, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = passed ? CHC.ok : CHC.dim;
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(`${L(t.zh, t.en)} ${t.note}`, ML + 4, y - 2);
  }
  /* 理想曲线(无结构) */
  ctx.strokeStyle = CHC.ideal; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.4;
  ctx.beginPath();
  let started = false;
  for (let f = 0.70; f <= 0.9995; f += 0.004) {
    const y = yOf(-F.ve * Math.log(1 - f));
    if (y < MT - 4) break;
    const x = xOf(f);
    if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
  }
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = CHC.ideal; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText(L('理想(无结构)ve·ln(1/(1−f))', 'ideal (no structure) ve·ln(1/(1−f))'), ML + PW - 4, MT + 3);
  /* 单级真实曲线 + 天花板 */
  const ceil = F.ve * Math.log(MPL + MPT);
  if (ceil <= DVM) {
    const y = yOf(ceil);
    ctx.strokeStyle = CHC.dim; ctx.setLineDash([2, 3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(ML + PW, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = CHC.dim; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText(L(`单级天花板 ${ceil.toFixed(1)}(结构→0)`, `single-stage ceiling ${ceil.toFixed(1)} (structure→0)`), ML + PW - 4, y - 2);
  }
  ctx.strokeStyle = CHC.real; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let f = 0.70; f <= 0.9995; f += 0.002) {
    const x = xOf(f), y = yOf(dvReal(f, F.ve));
    if (f === 0.70) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* 质量比刻度:×R 翻倍只买 ve·ln2 */
  for (const R of [4, 8, 16, 32, 64]) {
    const f = fOfR(R);
    if (f < 0.701) continue;
    const x = xOf(f), y = yOf(F.ve * Math.log(R));
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = CHC.real; ctx.fill();
    ctx.fillStyle = CHC.dim; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('×' + R, x, y - 4);
  }
  /* 工作点 */
  const dot = (f, dv, big, tag) => {
    const x = xOf(f), y = yOf(dv);
    ctx.beginPath(); ctx.arc(x, y, big ? 5 : 4, 0, Math.PI * 2);
    ctx.fillStyle = CHC.acc; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke();
    if (tag) { ctx.fillStyle = CHC.txt; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(tag, x + 7, y); }
  };
  if (N === 1) {
    const R0 = stages[0].mIgn / (stages[0].mIgn - stages[0].mp);
    dot(fv[0], stages[0].dv, true, `${(fv[0] * 100).toFixed(1)}% · ×${R0.toFixed(1)} → ${stages[0].dv.toFixed(1)}`);
  } else stages.forEach((st, i) => dot(fv[i], st.dv, false, i + 1 + ''));
  /* 右侧堆叠条:总 Δv */
  const bx = CW - MR + 10, bw = 14;
  ctx.strokeStyle = CHC.axis; ctx.lineWidth = 1;
  ctx.strokeRect(bx, MT, bw, PH);
  const cols = ['#ff9f43', '#ffd166', '#fff3c4'];
  let acc = 0, accCur = cur;
  stages.forEach((st, i) => {
    const h0 = yOf(acc), h1 = yOf(acc + st.dv);
    ctx.fillStyle = cols[i % 3] + (THEME === 'dark' ? 'cc' : 'aa');
    ctx.fillRect(bx + 1, h1, bw - 2, h0 - h1);
    const used = clamp(accCur, 0, st.dv);
    if (used > 0) {
      ctx.fillStyle = cols[i % 3];
      ctx.fillRect(bx + 1, yOf(acc + used), bw - 2, yOf(acc) - yOf(acc + used));
    }
    acc += st.dv; accCur -= st.dv;
  });
  ctx.fillStyle = CHC.txt; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('Σ ' + totDv.toFixed(1), bx + bw / 2, MT - 1);
  for (const t of TARGETS) {
    const y = yOf(t.dv);
    ctx.strokeStyle = totDv >= t.dv - 1e-9 ? CHC.ok : CHC.dim;
    ctx.beginPath(); ctx.moveTo(bx - 3, y); ctx.lineTo(bx + bw + 3, y); ctx.stroke();
  }
  /* 当前 Δv 指针 */
  if (phase !== 'idle' || cur > 0.01) {
    const y = yOf(cur);
    ctx.strokeStyle = CHC.acc; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(ML + PW, y); ctx.stroke();
    ctx.fillStyle = CHC.acc; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText(cur.toFixed(2), ML + PW - 4, y - 2);
  }
  /* 说明文字 */
  if (N === 1) {
    const R0 = stages[0].mIgn / (stages[0].mIgn - stages[0].mp);
    const fLEO = fFor(9.4, F.ve);
    chartCap.innerHTML = L(
      `单级${L(F.zh, F.en)}(ve=${F.ve}):燃料 <b>${(fv[0] * 100).toFixed(1)}%</b> → Δv <b>${stages[0].dv.toFixed(1)} km/s</b>(质量比 ×${R0.toFixed(1)});过 LEO 需 <b>${(fLEO * 100).toFixed(1)}%</b> 燃料,${ceil <= DVM ? `天花板 ${ceil.toFixed(1)}` : `天花板 ${ceil.toFixed(1)} 超出量程`}`,
      `single-stage ${L(F.zh, F.en)} (ve=${F.ve}): fuel <b>${(fv[0] * 100).toFixed(1)}%</b> → Δv <b>${stages[0].dv.toFixed(1)} km/s</b> (mass ratio ×${R0.toFixed(1)}); LEO needs <b>${(fLEO * 100).toFixed(1)}%</b> propellant, ceiling ${ceil.toFixed(1)}`);
  } else {
    chartCap.innerHTML = L(
      `${N} 级${L(F.zh, F.en)}:总 Δv <b>${totDv.toFixed(1)} km/s</b> = 同样 ${MPT} 份燃料塞进单级的 <b>${(totDv / dvSE).toFixed(2)}×</b>(对照 ${dvSE.toFixed(1)});各点是每级在曲线上的位置,烧完即抛壳`,
      `${N}-stage ${L(F.zh, F.en)}: total Δv <b>${totDv.toFixed(1)} km/s</b> = <b>${(totDv / dvSE).toFixed(2)}×</b> a single stage on the same ${MPT} units of propellant (${dvSE.toFixed(1)}); dots = each stage on the same curve`);
  }
}

/* ================= 步骤 ================= */
function setFuel(k) { fuelKey = k; resetFlight(true); syncSeg(); }
function setN(n) { N = n; resetFlight(true); syncSeg(); }
function setF(i, v) {
  fv[i] = clamp(v, 0.7, 0.999);
  const el = [elF1, elF2, elF3][i];
  el.value = (fv[i] * 100).toFixed(1);
  [elF1V, elF2V, elF3V][i].textContent = (fv[i] * 100).toFixed(1) + '%';
  recompute();
  drawChart();
}
const TWN = { on: false, t: 0, dur: 6, from: 0.75, to: 0.985 };
function ease(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
function stepTween(dts) {
  if (!TWN.on) return;
  if (phase !== 'idle') { TWN.on = false; return; }
  TWN.t += dts;
  const k = Math.min(TWN.t / TWN.dur, 1);
  setF(0, lerp(TWN.from, TWN.to, ease(k)));
  if (k >= 1) TWN.on = false;
}
const STEPS = [
  { b: '反冲:动量守恒', be: 'Recoil: momentum conservation',
    d: '没有地可蹬,火箭只能向后猛抛质量。点火:燃料烧掉、质量变轻,推力不变而加速度一路爬——看 a 从 3.9 涨到 30+ m/s²,方程就是这笔动量账。',
    de: 'A rocket has nothing to push against — it hurls mass backward. Ignite: as fuel drains the rocket lightens, so the same thrust gives ever-rising acceleration — a climbs from ~4 past 30 m/s². The equation is that momentum ledger.',
    act: () => { if (phase === 'done') resetFlight(false); ignite(); } },
  { b: '对数墙:翻倍只买 2.3', be: 'The log wall: ×2 buys just 2.3',
    d: 'Δv = ve·ln(m0/mf):质量比每翻一倍只多得 ve·ln2 ≈ 2.3 km/s。点击后滑块自己爬向 98.5%:×8 在 88%、×16 在 94.5%、×32 在 97.6%——越往后越挤,Δv 越涨越慢。',
    de: 'Δv = ve·ln(m0/mf): each doubling of mass ratio buys only ve·ln2 ≈ 2.3 km/s. The slider crawls toward 98.5% on its own: ×8 sits at 88%, ×16 at 94.5%, ×32 at 97.6% — ever more crowded, ever slower gains.',
    act: () => { setN(1); TWN.on = true; TWN.t = 0; TWN.from = Math.max(fv[0], 0.75); TWN.to = 0.985; playing = true; setPlayLabel(); } },
  { b: '死重:空罐也算质量', be: 'Dead mass: empty tanks count',
    d: 'mf 不只是没烧的燃料——贮箱、发动机、载荷全在分母里。单级煤油要约 95% 的燃料占比才摸到 LEO;99.9% 才够到火星,而那意味着薄到不存在的罐壁。',
    de: 'mf is not just unburnt fuel — tanks, engines and payload all sit in the denominator. A kerosene single stage needs ~95% propellant to graze LEO and 99.9% to reach Mars — tank walls too thin to build.',
    act: () => { setN(1); setF(0, 0.999); } },
  { b: '分级:边飞边扔死重', be: 'Staging: drop dead mass on the way',
    d: '同样 126 份燃料:单级 7.4、两级 10.9、三级 12.8 km/s。每级烧尽立刻整级抛离,上级不再拖空壳——点火看逐级烧干、分离、再点火。',
    de: 'Same 126 units of propellant: 7.4 single-stage, 10.9 two-stage, 12.8 three-stage. Each stage is dropped the instant it burns out — ignite and watch drain, separate, reignite.',
    act: () => { setN(3); [0.90, 0.90, 0.90].forEach((v, i) => setF(i, v)); ignite(); } },
  { b: '比冲 ve 是乘数', be: 'Isp: ve is a multiplier',
    d: '方程里 ve 直接乘在最前面:固体 2.9 / 煤油 3.3 / 液氢 4.4 km/s。同一辆三级车换液氢,总 Δv 12.8 → 17.0 km/s,火星线轻松越过——代价是液氢罐又大又娇贵。',
    de: 've sits right out front: solid 2.9, kerosene 3.3, hydrogen 4.4 km/s. Swap the same three-stage vehicle to hydrogen and total Δv jumps 12.8 → 17.0 km/s, clearing Mars with ease — at the price of bulky cryogenic tanks.',
    act: () => { setN(3); setFuel('lh2'); } },
  { b: '化学火箭的天花板', be: 'The chemical ceiling',
    d: '三级煤油约 12.8 km/s:过 LEO、过地月转移,距火星线只差 0.2。再远就靠引力弹弓、电推进或轨道补加——化学燃料的能量密度,到这里就到头了。',
    de: 'Three kerosene stages give ~12.8 km/s: past LEO and the Moon line, 0.2 short of Mars transfer. Beyond that: gravity assists, electric propulsion, orbital refueling — chemical energy density tops out here.',
    act: () => { setFuel('kero'); setN(3); ignite(); } },
];
function stepIndex() {
  if (phase === 'burn' || phase === 'sep') return N > 1 ? 3 : 0;
  if (phase === 'done') return fuelKey === 'lh2' ? 4 : (N > 1 ? 5 : 2);
  if (N === 1) return (TWN.on || fv[0] < 0.995) ? 1 : 2;
  return fuelKey === 'lh2' ? 4 : 3;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd'), elSpdVal = document.getElementById('spdVal');
const elF1 = document.getElementById('f1'), elF2 = document.getElementById('f2'), elF3 = document.getElementById('f3');
const elF1V = document.getElementById('f1Val'), elF2V = document.getElementById('f2Val'), elF3V = document.getElementById('f3Val');
const tglLabels = document.getElementById('tglLabels'), tglChart = document.getElementById('tglChart'),
  tglRotate = document.getElementById('tglRotate');
let chartOn = true;
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncSeg() {
  FKEYS.forEach((k, i) => document.getElementById('btnF' + i).classList.toggle('on', k === fuelKey));
  [1, 2, 3].forEach(n => document.getElementById('btnN' + n).classList.toggle('on', n === N));
  refreshConfigUI();
}
function refreshConfigUI() {
  document.getElementById('rowF2').style.display = N >= 2 ? '' : 'none';
  document.getElementById('rowF3').style.display = N >= 3 ? '' : 'none';
  document.getElementById('f1Lab').textContent = N === 1 ? L('燃料占比', 'fuel fraction') : L('一级燃料占比', 'stage-1 fuel %');
}
function bindF(el, elV, i) {
  el.addEventListener('input', () => {
    TWN.on = false;
    fv[i] = clamp(parseFloat(el.value) / 100, 0.7, 0.999);
    elV.textContent = (fv[i] * 100).toFixed(1) + '%';
    if (phase !== 'idle') resetFlight(false);
    else { recompute(); drawChart(); }
  });
}
bindF(elF1, elF1V, 0); bindF(elF2, elF2V, 1); bindF(elF3, elF3V, 2);
document.getElementById('btnFire').addEventListener('click', ignite);
document.getElementById('btnReset').addEventListener('click', () => resetFlight(false));
FKEYS.forEach((k, i) => document.getElementById('btnF' + i).addEventListener('click', () => setFuel(k)));
[1, 2, 3].forEach(n => document.getElementById('btnN' + n).addEventListener('click', () => setN(n)));
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglChart.addEventListener('change', () => {
  chartOn = tglChart.checked;
  chartEl.style.display = chartOn ? '' : 'none';
  chartCap.style.display = chartOn ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawChart();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, chartAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;
  stepTween(dts);
  if (dts > 0) flightStep(dts);
  updatePlume(dts);
  const cur = dvCur();
  document.getElementById('stNow').innerHTML = cur.toFixed(2) + '<small> km/s</small>';
  document.getElementById('stTot').innerHTML = totDv.toFixed(1) + `<small> km/s · ${N}${L('级', ' st.')}</small>`;
  document.getElementById('stSE').innerHTML = dvSE.toFixed(1) + '<small> km/s</small>';
  document.getElementById('stFr').innerHTML = (fuelPct * 100).toFixed(1) + '<small>%</small>';
  const stA = document.getElementById('stA');
  if (phase === 'burn') {
    const st = stages[curStage];
    const m = st.mIgn - st.mp * (1 - st.level);
    stA.innerHTML = (G0 * (TW0 * st.mIgn / m - 1)).toFixed(1) + '<small> m/s²</small>';
  } else stA.innerHTML = '—';
  const stR = document.getElementById('stR');
  const next = TARGETS.find(t => totDv < t.dv - 1e-9);
  if (!next) { stR.innerHTML = L('火星转移 ✓', 'Mars ✓'); stR.className = 'v ok'; }
  else {
    const pass = TARGETS.filter(t => totDv >= t.dv - 1e-9);
    stR.innerHTML = pass.length
      ? L(`${pass[pass.length - 1].zh} ✓`, `${pass[pass.length - 1].en} ✓`) + `<small> −${(next.dv - totDv).toFixed(1)} ${L('到', 'to')} ${L(next.zh, next.en)}</small>`
      : L('不够 LEO', 'short of LEO') + `<small> −${(next.dv - totDv).toFixed(1)} km/s</small>`;
    stR.className = 'v ' + (pass.length ? 'ok' : 'bad');
  }
  chartAcc += dt;
  if (chartAcc > 0.12 && (phase !== 'idle' || TWN.on)) { chartAcc = 0; drawChart(); }
  for (const r of labelReg) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
{
  const n = parseInt(qs.get('n'), 10);
  if ([1, 2, 3].includes(n)) N = n;
  const fk = qs.get('fuel');
  if (FKEYS.includes(fk)) fuelKey = fk;
  [0, 1, 2].forEach(i => {
    const v = qsFloat('f' + (i + 1), NaN);
    if (Number.isFinite(v)) fv[i] = clamp(v > 1 ? v / 100 : v, 0.7, 0.999);
  });
  elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
  [elF1, elF2, elF3].forEach((el, i) => {
    el.value = (fv[i] * 100).toFixed(1);
    [elF1V, elF2V, elF3V][i].textContent = (fv[i] * 100).toFixed(1) + '%';
  });
  if (!qsBool('labels', true)) { labelsOn = false; tglLabels.checked = false; }
  if (!qsBool('chart', true)) { chartOn = false; tglChart.checked = false; chartEl.style.display = 'none'; chartCap.style.display = 'none'; }
  controls.autoRotate = qsBool('spin', true);
  tglRotate.checked = controls.autoRotate;
}
recompute();
buildRocket();
syncSeg();
applyTheme();
applyLang();
refreshLabels();
setPlayLabel();
start();
</script>
