<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表观遗传学 · 3D 原理动画</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;
    --acc:#34d399;
    --bg:#0c1210;--panel:rgba(12,18,16,.88);--panel-border:rgba(255,255,255,.09);
    --text:#f0f5f2;--text2:#7fa89a;--text3:#aecfc4;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(12,18,16,.78);--tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(12,18,16,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --acc:#059669;
    --bg:#eef6f2;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,40,25,.10);
    --text:#102018;--text2:#4a6b5c;--text3:#2d4a3e;
    --hover:rgba(15,40,25,.05);--shadow:0 8px 26px rgba(20,50,30,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,40,25,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    transition:background .25s;}
  #app{position:fixed;inset:0;}
  #app canvas{display:block;}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;
    max-width:calc(100vw - 320px);}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;
    text-shadow:0 2px 8px rgba(0,0,0,.25);}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;
    text-shadow:0 1px 4px rgba(0,0,0,.2);}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;
    min-width:40px;height:32px;padding:0 12px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
  #stats{position:fixed;right:18px;top:64px;z-index:4;width:288px;
    display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    padding:11px 14px;backdrop-filter:blur(6px);box-shadow:var(--shadow);}
  .card h3{font-size:13px;color:var(--text);font-weight:600;margin-bottom:8px;}
  .kv{display:flex;justify-content:space-between;align-items:baseline;margin:5px 0;}
  .kv .k{font-size:12px;color:var(--text2);}
  .kv .v{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  .kv .v.big{font-size:20px;color:var(--acc);}
  .bar-wrap{height:6px;background:rgba(128,160,144,.18);border-radius:3px;margin-top:3px;}
  .bar-fill{height:100%;border-radius:3px;transition:width .3s;}
  .note{font-size:11px;color:var(--text2);border-top:1px solid var(--panel-border);
    margin-top:8px;padding-top:7px;line-height:1.55;}
  @media(max-width:1150px){#stats{display:none;}}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:356px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 140px);overflow:auto;}
  #steps{list-style:none;}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start;}
  #steps li:hover{background:var(--hover);}
  #steps li.on{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.45);}
  :root[data-theme="light"] #steps li.on{background:rgba(5,150,105,.10);border-color:rgba(5,150,105,.4);}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
    background:rgba(128,160,144,.25);color:var(--text3);}
  #steps li.on .n{background:var(--acc);color:#fff;}
  #steps .t{font-size:12.5px;color:var(--text3);line-height:1.45;}
  #steps li.on .t b{color:var(--acc);}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer;}
  #play:hover{filter:brightness(1.12);}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px;}
  .row{display:flex;align-items:center;gap:8px;}
  .row label{font-size:12px;color:var(--text2);flex:0 0 30px;}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 38px;text-align:right;}
  #actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .abtn{font-size:11.5px;color:var(--text3);background:var(--hover);
    border:1px solid var(--panel-border);border-radius:8px;padding:5px 10px;
    cursor:pointer;transition:border-color .15s,color .15s;}
  .abtn:hover,.abtn.active{border-color:var(--acc);color:var(--acc);}
  .abtn.active{background:rgba(52,211,153,.10);}
  @media(max-width:760px){
    #panel{width:calc(100vw - 36px);max-height:55vh;}
    #title{max-width:calc(100vw - 200px);}
    #title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="title">
  <h1 data-zh="表观遗传学" data-en="Epigenetics — Reading Without Rewriting">表观遗传学</h1>
  <div class="sub" data-zh="DNA 甲基化与组蛋白修饰如何在不改变序列的前提下开关基因 · 空格播放/暂停" data-en="DNA methylation and histone marks switch genes on/off without touching the sequence · Space = play/pause">DNA 甲基化与组蛋白修饰如何在不改变序列的前提下开关基因 · 空格播放/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn">EN</button>
  <button class="tbtn" id="themeBtn">☀</button>
</div>
<div id="stats">
  <div class="card">
    <h3 data-zh="染色质状态" data-en="Chromatin State">染色质状态</h3>
    <div class="kv"><span class="k" data-zh="甲基化程度" data-en="Methylation level">甲基化程度</span><span class="v big" id="stMeth">0%</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barMeth" style="width:0%;background:#6b7280"></div></div>
    <div class="kv"><span class="k" data-zh="乙酰化程度" data-en="Acetylation level">乙酰化程度</span><span class="v" id="stAcet">0%</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barAcet" style="width:0%;background:#34d399"></div></div>
    <div class="kv"><span class="k" data-zh="染色质压缩度" data-en="Chromatin compaction">染色质压缩度</span><span class="v" id="stComp">0%</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barComp" style="width:0%;background:#f87171"></div></div>
    <div class="kv"><span class="k" data-zh="基因表达量" data-en="Gene expression">基因表达量</span><span class="v" id="stExpr">0%</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barExpr" style="width:0%;background:#60a5fa"></div></div>
    <div class="note" id="chromatinNote" data-zh="常染色质（松弛）→ RNA 聚合酶可读取" data-en="Euchromatin (open) → RNA polymerase can access">常染色质（松弛）→ RNA 聚合酶可读取</div>
  </div>
</div>
<div id="panel">
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="actions">
    <button class="abtn active" id="btnMeth" data-zh="甲基化沉默" data-en="Methylate &amp; silence">甲基化沉默</button>
    <button class="abtn" id="btnDemeth" data-zh="去甲基化激活" data-en="Demethylate &amp; activate">去甲基化激活</button>
    <button class="abtn" id="btnAcet" data-zh="组蛋白乙酰化" data-en="Acetylate histones">组蛋白乙酰化</button>
    <button class="abtn" id="btnCell" data-zh="对比发育分化" data-en="Cell type comparison">对比发育分化</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const lerp = (a,b,t) => a + (b-a)*t;
const ss = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

const STEPS_DATA = [
  ['核小体单元：DNA 缠绕组蛋白八聚体 1.75 圈，147 bp 一个核小体',
   'Nucleosome: 147 bp of DNA wrapped 1.75 turns around a histone octamer'],
  ['DNA 甲基化：DNMT 在 CpG 的胞嘧啶上加甲基→基因启动子沉默',
   'DNA methylation: DNMT adds -CH₃ to cytosine at CpG → promoter silencing'],
  ['组蛋白乙酰化：HAT 加乙酰基中和组蛋白正电→染色质松开→基因活化',
   'Histone acetylation: HAT adds acetyl, neutralizing positive charge → chromatin opens → gene active'],
  ['组蛋白甲基化：H3K27me3 = Polycomb 标记→染色质压实→基因沉默',
   'H3K27me3: Polycomb repressive mark → compact chromatin → gene silent'],
  ['可遗传性：DNA 复制后 DNMT1 识别半甲基化 CpG→维持甲基化模式',
   'Heritability: DNMT1 maintains methylation pattern after DNA replication'],
  ['发育命运：同一 DNA 序列，不同甲基化图谱→肝细胞 vs 神经元',
   'Development: same DNA sequence, different methylation maps → liver vs neuron'],
];

function buildSteps() {
  const ol = document.getElementById('steps');
  ol.innerHTML = '';
  STEPS_DATA.forEach(([zh, en], i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i+1}</span><span class="t">${LANG==='en'?en:zh}</span>`;
    ol.appendChild(li);
  });
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 100);
camera.position.set(0, 2, 18);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 6; controls.maxDistance = 28;
controls.target.set(0, 0, 0);

scene.add(new THREE.HemisphereLight(0x9dc8b6, 0x1c2c28, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(5, 8, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0x80ffc0, 0.3);
fill.position.set(-4, 2, -4); scene.add(fill);

function mat(color, opts={}) {
  return new THREE.MeshStandardMaterial({ color, roughness:0.45, metalness:0.15,
    emissive:color, emissiveIntensity:0.12, transparent:true, opacity:1, ...opts });
}

const dummy = new THREE.Object3D();

// Nucleosome array: 7 nucleosomes spaced along a chromatin fiber
const NUM_NUC = 7;
const NUC_SPACING = 2.8;
const NUC_START_X = -(NUM_NUC - 1) * NUC_SPACING * 0.5;

// Histone octamer spools (beige/tan cylinders)
const histoneMat = mat(0xd4b896, { roughness:0.55, emissiveIntensity:0.08 });
const histoneGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.5, 16);
const histones = [];
for (let i = 0; i < NUM_NUC; i++) {
  const m = new THREE.Mesh(histoneGeo, histoneMat.clone());
  m.position.set(NUC_START_X + i * NUC_SPACING, 0, 0);
  m.rotation.z = Math.PI / 2;
  scene.add(m);
  histones.push(m);
}

// DNA helix strand connecting all nucleosomes (bead-on-string representation)
// Using InstancedMesh for DNA beads
const DNA_BEADS = 120;
const dnaBeadGeo = new THREE.SphereGeometry(0.10, 8, 6);
const dnaStrand1 = new THREE.InstancedMesh(dnaBeadGeo, mat(0x60a5fa, { emissiveIntensity:0.4 }), DNA_BEADS);
const dnaStrand2 = new THREE.InstancedMesh(dnaBeadGeo, mat(0x818cf8, { emissiveIntensity:0.4 }), DNA_BEADS);
scene.add(dnaStrand1, dnaStrand2);

// Place DNA beads in helix around histones
function setDnaBeads(compaction) {
  const totalLen = (NUM_NUC - 1) * NUC_SPACING + 1.2;
  for (let i = 0; i < DNA_BEADS; i++) {
    const t = i / (DNA_BEADS - 1);
    const x = NUC_START_X - 0.6 + t * (totalLen + 1.2);
    // Which nucleosome segment? wrap tightly around each histone
    const segmentPhase = t * NUM_NUC * 1.75 * Math.PI * 2;
    const nearNuc = Math.round((x - NUC_START_X) / NUC_SPACING);
    const nucIdx = clamp(nearNuc, 0, NUM_NUC - 1);
    const nucX = NUC_START_X + nucIdx * NUC_SPACING;
    const dx = x - nucX;
    const onNuc = Math.abs(dx) < 0.9;
    // Compaction affects linker spacing
    const linkerY = lerp(0.9, 0.3, compaction) * Math.sin(t * Math.PI * 3);
    const linkerZ = lerp(0.9, 0.3, compaction) * Math.cos(t * Math.PI * 3);
    const wrapR = onNuc ? 0.62 : lerp(0.18, 0.08, compaction);
    const angle1 = segmentPhase;
    const angle2 = segmentPhase + Math.PI;
    dummy.position.set(x, onNuc ? Math.sin(angle1)*wrapR*0.9 : linkerY, onNuc ? Math.cos(angle1)*wrapR : linkerZ);
    dummy.scale.setScalar(1); dummy.rotation.set(0,0,0); dummy.updateMatrix();
    dnaStrand1.setMatrixAt(i, dummy.matrix);
    dummy.position.set(x, onNuc ? Math.sin(angle2)*wrapR*0.9 : -linkerY*0.7, onNuc ? Math.cos(angle2)*wrapR : -linkerZ*0.7);
    dummy.updateMatrix();
    dnaStrand2.setMatrixAt(i, dummy.matrix);
  }
  dnaStrand1.instanceMatrix.needsUpdate = true;
  dnaStrand2.instanceMatrix.needsUpdate = true;
}

// Histone tails (6 per nucleosome, extending outward like arms)
const TAILS_PER_NUC = 6;
const tailGroup = new THREE.Group();
scene.add(tailGroup);
const tailMeshes = [];
for (let i = 0; i < NUM_NUC; i++) {
  const nucTails = [];
  for (let t = 0; t < TAILS_PER_NUC; t++) {
    const angle = (t / TAILS_PER_NUC) * Math.PI * 2;
    const m = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.035, 0.7, 6),
      mat(0xe8d5b8, { emissiveIntensity:0.05, roughness:0.7 })
    );
    m.position.set(NUC_START_X + i * NUC_SPACING + Math.cos(angle)*0.25, Math.sin(angle)*0.55, 0);
    m.rotation.z = angle + Math.PI/2;
    tailGroup.add(m);
    nucTails.push(m);
  }
  tailMeshes.push(nucTails);
}

// Methyl groups: small dark spheres on DNA (CpG methylation marks)
const METHYL_COUNT = 28;
const methylMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.11, 7, 5),
  mat(0x374151, { emissiveIntensity:0.3 }),
  METHYL_COUNT
);
methylMesh.count = 0;
scene.add(methylMesh);

// Acetyl flags: green flat discs on histone tails (active mark)
const ACETYL_COUNT = NUM_NUC * TAILS_PER_NUC;
const acetylMesh = new THREE.InstancedMesh(
  new THREE.CylinderGeometry(0.14, 0.14, 0.04, 8),
  mat(0x34d399, { emissiveIntensity:0.7 }),
  ACETYL_COUNT
);
acetylMesh.count = 0;
scene.add(acetylMesh);

// Repressive H3K27me3 marks: red spheres on tails
const repMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.13, 8, 6),
  mat(0xf87171, { emissiveIntensity:0.6 }),
  ACETYL_COUNT
);
repMesh.count = 0;
scene.add(repMesh);

// DNMT enzyme (small blue capsule sliding along DNA)
const dnmtMesh = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.22, 0.4, 8, 12),
  mat(0x3b82f6, { emissiveIntensity:0.5 })
);
dnmtMesh.visible = false;
scene.add(dnmtMesh);

// RNA Polymerase (gold, traveling along DNA when active)
const rnapMesh = new THREE.Mesh(
  new THREE.BoxGeometry(0.45, 0.38, 0.35),
  mat(0xfbbf24, { emissiveIntensity:0.6 })
);
rnapMesh.visible = false;
scene.add(rnapMesh);

// Compaction effect: shift histones closer together
function updateCompaction(compaction) {
  const compactedSpacing = lerp(NUC_SPACING, 1.2, compaction);
  const newStart = -(NUM_NUC - 1) * compactedSpacing * 0.5;
  for (let i = 0; i < NUM_NUC; i++) {
    histones[i].position.x = lerp(NUC_START_X + i * NUC_SPACING, newStart + i * compactedSpacing, compaction);
    // Darken histones when compacted
    histones[i].material.color.setHex(compaction > 0.5 ? 0x8a7060 : 0xd4b896);
    histones[i].material.emissiveIntensity = lerp(0.08, 0.05, compaction);
    // Update tail positions
    for (let t = 0; t < TAILS_PER_NUC; t++) {
      const angle = (t / TAILS_PER_NUC) * Math.PI * 2;
      tailMeshes[i][t].position.x = histones[i].position.x + Math.cos(angle)*0.25;
      tailMeshes[i][t].position.y = Math.sin(angle) * lerp(0.55, 0.35, compaction);
    }
  }
}

// Mode: 0=methylate+silence, 1=demethylate+activate, 2=acetylate, 3=celltype
let mode = 0;
let wallT = 0;
let playing = true;
let speed = 1;
let progress = 0;
let lastStep = -1;

// Smooth target values
let targetMeth = 0, targetAcet = 0, targetComp = 0, targetExpr = 0;
let curMeth = 0, curAcet = 0, curComp = 0, curExpr = 0;

document.getElementById('btnMeth').addEventListener('click', () => { mode = 0; updateModeTargets(); setActiveBtn('btnMeth'); });
document.getElementById('btnDemeth').addEventListener('click', () => { mode = 1; updateModeTargets(); setActiveBtn('btnDemeth'); });
document.getElementById('btnAcet').addEventListener('click', () => { mode = 2; updateModeTargets(); setActiveBtn('btnAcet'); });
document.getElementById('btnCell').addEventListener('click', () => { mode = 3; updateModeTargets(); setActiveBtn('btnCell'); });

function setActiveBtn(id) {
  document.querySelectorAll('.abtn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateModeTargets() {
  // mode 0: methylation silencing
  if (mode === 0) { targetMeth = 0.85; targetAcet = 0.05; targetComp = 0.72; targetExpr = 0.05; }
  // mode 1: demethylation activation
  else if (mode === 1) { targetMeth = 0.05; targetAcet = 0.3; targetComp = 0.1; targetExpr = 0.85; }
  // mode 2: histone acetylation
  else if (mode === 2) { targetMeth = 0.1; targetAcet = 0.92; targetComp = 0.05; targetExpr = 0.95; }
  // mode 3: cell type comparison (liver=partial meth, neuron=different pattern)
  else { targetMeth = 0.5; targetAcet = 0.5; targetComp = 0.45; targetExpr = 0.55; }
}
updateModeTargets();

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME==='dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME==='light' ? 0xeef6f2 : 0x0c1210);
}
function applyLang() {
  htmlEl.lang = LANG==='en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG==='en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG==='en' ? '中' : 'EN';
  document.title = L('表观遗传学 · 3D 原理动画', 'Epigenetics · 3D Animation');
  buildSteps();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME==='dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME); applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG==='zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG); applyLang();
});

const elPlay = document.getElementById('play');
elPlay.addEventListener('click', () => {
  playing = !playing;
  elPlay.textContent = playing ? L('暂停','Pause') : L('播放','Play');
});
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1)+'×'; });
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
elScrub.addEventListener('input', () => { progress = parseInt(elScrub.value)/1000; });
addEventListener('keydown', e => { if (e.code==='Space') { e.preventDefault(); elPlay.click(); } });

const clock = new THREE.Clock();

function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min(clock.getDelta(), 0.1);
  wallT += dt;
  if (playing) {
    progress = (progress + dt * speed * 0.022) % 1;
  }

  // Smooth transitions
  const lk = 1 - Math.pow(0.015, dt);
  curMeth = lerp(curMeth, targetMeth, lk);
  curAcet = lerp(curAcet, targetAcet, lk);
  curComp = lerp(curComp, targetComp, lk);
  curExpr = lerp(curExpr, targetExpr, lk);

  // Animate based on progress cycle
  const cycP = progress;
  const methAnim = (mode === 0) ? ss(0.1, 0.6, cycP) : (mode === 1 ? 1 - ss(0.1, 0.6, cycP) : curMeth);

  // Update compaction
  updateCompaction(curComp);
  setDnaBeads(curComp);

  // Methyl groups on DNA
  const nMethyl = Math.round(curMeth * METHYL_COUNT);
  methylMesh.count = nMethyl;
  for (let i = 0; i < nMethyl; i++) {
    const nucIdx = Math.floor(i / 4);
    const offset = i % 4;
    const nx = histones[clamp(nucIdx, 0, NUM_NUC-1)].position.x;
    const angle = (offset/4)*Math.PI*2 + wallT*0.05;
    dummy.position.set(nx + (offset%2 ? 0.5 : -0.5), Math.sin(angle)*0.75, Math.cos(angle)*0.75);
    dummy.scale.setScalar(1); dummy.rotation.set(0,0,0); dummy.updateMatrix();
    methylMesh.setMatrixAt(i, dummy.matrix);
  }
  methylMesh.instanceMatrix.needsUpdate = true;

  // Acetyl flags on tails
  const nAcetyl = Math.round(curAcet * ACETYL_COUNT);
  acetylMesh.count = nAcetyl;
  let aidx = 0;
  outer:
  for (let i = 0; i < NUM_NUC; i++) {
    for (let t = 0; t < TAILS_PER_NUC; t++) {
      if (aidx >= nAcetyl) break outer;
      const tp = tailMeshes[i][t];
      dummy.position.set(tp.position.x + Math.cos(tp.rotation.z)*0.4, tp.position.y + Math.sin((t/TAILS_PER_NUC)*Math.PI*2)*0.4, tp.position.z);
      dummy.scale.setScalar(1); dummy.rotation.set(0,0,0); dummy.updateMatrix();
      acetylMesh.setMatrixAt(aidx++, dummy.matrix);
    }
  }
  acetylMesh.instanceMatrix.needsUpdate = true;

  // Repressive H3K27me3 marks (when high compaction/methylation)
  const nRep = Math.round(curComp * ACETYL_COUNT * 0.6);
  repMesh.count = nRep;
  let ridx = 0;
  outer2:
  for (let i = 0; i < NUM_NUC; i++) {
    for (let t = 0; t < TAILS_PER_NUC; t++) {
      if (ridx >= nRep) break outer2;
      const tp = tailMeshes[i][t];
      dummy.position.set(tp.position.x - Math.cos(tp.rotation.z)*0.35, tp.position.y - Math.sin((t/TAILS_PER_NUC)*Math.PI*2)*0.35, tp.position.z);
      dummy.scale.setScalar(1); dummy.rotation.set(0,0,0); dummy.updateMatrix();
      repMesh.setMatrixAt(ridx++, dummy.matrix);
    }
  }
  repMesh.instanceMatrix.needsUpdate = true;

  // DNMT enzyme sliding along DNA (mode 0 or during methylation phase)
  const showDnmt = (mode === 0 && curMeth > 0.1) || (mode === 1 && curMeth > 0.1);
  dnmtMesh.visible = showDnmt;
  if (showDnmt) {
    const t = (wallT * 0.25) % 1;
    const totalLen = (NUM_NUC - 1) * NUC_SPACING;
    dnmtMesh.position.set(NUC_START_X + t * totalLen, 0.8 + Math.sin(wallT*1.5)*0.15, 0.3);
    dnmtMesh.rotation.y = wallT*0.5;
    dnmtMesh.material.emissiveIntensity = 0.3 + 0.2*Math.sin(wallT*3);
  }

  // RNA Polymerase moving when gene is active
  const showRnap = curExpr > 0.3;
  rnapMesh.visible = showRnap;
  if (showRnap) {
    const t = (wallT * 0.18 * curExpr) % 1;
    const totalLen = (NUM_NUC - 1) * NUC_SPACING;
    rnapMesh.position.set(NUC_START_X + t * totalLen, 0.7, 0);
    rnapMesh.material.emissiveIntensity = 0.4 + 0.3*Math.sin(wallT*2)*curExpr;
  }

  // Cell type comparison view: show two rows
  if (mode === 3) {
    // Show two chromatin fibers offset vertically
    for (let i = 0; i < NUM_NUC; i++) {
      const h = histones[i];
      h.position.y = Math.sin(wallT*0.5 + i*0.3)*0.05;
    }
  } else {
    for (let i = 0; i < NUM_NUC; i++) histones[i].position.y = 0;
    tailMeshes.forEach((nucTails, i) => nucTails.forEach(t => { t.position.y = (Math.sin((tailMeshes[i].indexOf(t)/TAILS_PER_NUC)*Math.PI*2))*lerp(0.55, 0.35, curComp); }));
  }

  // Stats update
  const methPct = Math.round(curMeth * 100);
  const acetPct = Math.round(curAcet * 100);
  const compPct = Math.round(curComp * 100);
  const exprPct = Math.round(curExpr * 100);
  document.getElementById('stMeth').textContent = methPct+'%';
  document.getElementById('barMeth').style.width = methPct+'%';
  document.getElementById('stAcet').textContent = acetPct+'%';
  document.getElementById('barAcet').style.width = acetPct+'%';
  document.getElementById('stComp').textContent = compPct+'%';
  document.getElementById('barComp').style.width = compPct+'%';
  document.getElementById('stExpr').textContent = exprPct+'%';
  document.getElementById('barExpr').style.width = exprPct+'%';

  const noteEl = document.getElementById('chromatinNote');
  if (curComp > 0.6) {
    noteEl.textContent = L('异染色质（致密）→ 基因沉默，不可读取', 'Heterochromatin (compact) → gene silenced, inaccessible');
  } else if (curAcet > 0.6) {
    noteEl.textContent = L('常染色质（松弛）→ RNA 聚合酶可读取', 'Euchromatin (open) → RNA polymerase can access');
  } else if (mode === 3) {
    noteEl.textContent = L('发育分化：同序列，不同甲基化模式→不同细胞命运', 'Differentiation: same sequence, different methylation → different cell fate');
  } else {
    noteEl.textContent = L('常染色质（松弛）→ RNA 聚合酶可读取', 'Euchromatin (open) → RNA polymerase can access');
  }

  // Step highlight
  let si = Math.floor(progress * STEPS_DATA.length);
  si = clamp(si, 0, STEPS_DATA.length - 1);
  if (si !== lastStep) {
    lastStep = si;
    document.querySelectorAll('#steps li').forEach((li,i) => li.classList.toggle('on', i===si));
  }

  elScrub.value = Math.round(progress * 1000);
  elScrubVal.textContent = Math.round(progress * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
}

applyTheme(); applyLang();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
requestAnimationFrame(frame);
</script>
</body>
</html>
