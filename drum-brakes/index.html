<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>鼓式刹车与自增力 · 蹄片自己把自己压紧</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e03131;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;

    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b02525;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(224,49,49,.6);background:rgba(224,49,49,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,37,37,.55);background:rgba(176,37,37,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(224,49,49,.10);border-color:rgba(224,49,49,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,37,37,.08);border-color:rgba(176,37,37,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffc9c9}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="鼓式刹车与自增力" data-en="Drum Brakes &amp; Self-Servo">鼓式刹车与自增力</h1>
  <div class="sub" data-zh="轮缸液压把两枚蹄片撑向旋转的制动鼓→领蹄的摩擦力绕支点与推力同向,蹄把自己越压越紧(自增力/servo),从蹄力矩反向、只能靠液压硬推→增益 G=1/(1−μ·a/b),μ 既是放大器也是隐患:μ 过大逼近自锁抱死,温升 μ 降、增益缩水=热衰退→双向双领蹄让正反转都有伺服 · 拖动旋转 / 空格运行/暂停" data-en="Hydraulic pressure pries two shoes against the spinning drum → on the leading shoe friction about the pivot acts WITH the applied force, so the shoe presses itself harder (self-servo); on the trailing shoe the moment reverses and hydraulics must carry it alone → gain G=1/(1−μ·a/b): μ is amplifier and hazard — too high nears lockup, heat lowers μ and the gain sags (fade) → duo-servo keeps both directions strong · drag to orbit / Space = run/pause">轮缸液压把两枚蹄片撑向旋转的制动鼓→领蹄的摩擦力绕支点与推力同向,蹄把自己越压越紧(自增力/servo),从蹄力矩反向、只能靠液压硬推→增益 G=1/(1−μ·a/b),μ 既是放大器也是隐患:μ 过大逼近自锁抱死,温升 μ 降、增益缩水=热衰退→双向双领蹄让正反转都有伺服 · 拖动旋转 / 空格运行/暂停</div>
</div>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

    <label data-zh="轮缸液压" data-en="Line pressure">轮缸液压</label>

    <label data-zh="摩擦系数 μ" data-en="Friction μ">摩擦系数 μ</label>

    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x111214,14,42);
const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,0.1,200);
camera.position.set(2.7,1.15,6.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=18;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:剖开的制动鼓,轴线沿 Z,领从蹄式剖面 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-2.05;scene.add(ground);
const D2R=Math.PI/180;
const polar=(deg,r,z=0)=>new THREE.Vector3(r*Math.cos(deg*D2R),r*Math.sin(deg*D2R),z);
/* 背板(制动底板) */
const plateM=new THREE.MeshStandardMaterial({color:0x2a2f38,roughness:0.85});
const plate=new THREE.Mesh(new THREE.CircleGeometry(1.52,48),plateM);
plate.position.z=-0.42;scene.add(plate);
/* 制动鼓:半透明圆筒+前缘圈+轮毂+定位销(旋转可见) */
const drumM=new THREE.MeshStandardMaterial({color:0x9aa6b6,roughness:0.35,metalness:0.55,
  transparent:true,opacity:0.20,side:THREE.DoubleSide,depthWrite:false});
const drumG=new THREE.Group();scene.add(drumG);
const wall=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.55,0.95,72,1,true),drumM);
wall.rotation.x=Math.PI/2;drumG.add(wall);
const rimM=new THREE.MeshStandardMaterial({color:0x8a96a8,roughness:0.3,metalness:0.7});
const rim=new THREE.Mesh(new THREE.TorusGeometry(1.55,0.05,10,72),rimM);
rim.position.z=0.475;drumG.add(rim);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.52,0.52,1.1,32),
  new THREE.MeshStandardMaterial({color:0x4a5462,roughness:0.45,metalness:0.6}));
hub.rotation.x=Math.PI/2;hub.position.z=-0.05;drumG.add(hub);
const studM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.3,metalness:0.85});
for(let i=0;i<5;i++){
  const st=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.32,10),studM);
  st.rotation.x=Math.PI/2;st.position.copy(polar(i*72,0.66,0.55));drumG.add(st);
}
const mark=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.07,0.05),
  new THREE.MeshStandardMaterial({color:0xe03131,roughness:0.4,emissive:0xe03131,emissiveIntensity:0.5}));
mark.position.set(1.42,0,0.5);drumG.add(mark);
/* 蹄片:弧形环带 + 摩擦片 + 腹板 */
function bandGeo(a0,a1,ro,ri,depth){
  const s=new THREE.Shape();
  s.absarc(0,0,ro,a0*D2R,a1*D2R,false);
  s.absarc(0,0,ri,a1*D2R,a0*D2R,true);
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:36});
  g.translate(0,0,-depth/2);return g;
}
const shoeM=new THREE.MeshStandardMaterial({color:0x5c6675,roughness:0.6,metalness:0.5});
const linHot=new THREE.Color(0xff4a2a);
function makeShoe(a0,a1){
  const grp=new THREE.Group();
  const body=new THREE.Mesh(bandGeo(a0,a1,1.36,1.06,0.42),shoeM);grp.add(body);
  const linM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.75,
    emissive:0xff3300,emissiveIntensity:0});
  const lin=new THREE.Mesh(bandGeo(a0,a1,1.44,1.30,0.32),linM);grp.add(lin);
  const webA=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.1,0.3),shoeM);
  webA.position.copy(polar(a1,1.12));webA.rotation.z=(a1+90)*D2R;grp.add(webA);
  const webB=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.1,0.3),shoeM);
  webB.position.copy(polar(a0,1.12));webB.rotation.z=(a0+90)*D2R;grp.add(webB);
  scene.add(grp);return {grp,lin,linM};
}
const shoeR=makeShoe(-80,72), shoeL=makeShoe(108,260);   /* 右=领蹄(顺时针鼓) */
const midR=-4, midL=184;
/* 轮缸(上)+ 双向模式的下轮缸;支点销 */
const cylM=new THREE.MeshStandardMaterial({color:0x6e7a8c,roughness:0.45,metalness:0.55});
const pisM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85});
function makeCylinder(y){
  const g=new THREE.Group();
  const box=new THREE.Mesh(new THREE.BoxGeometry(0.98,0.2,0.34),cylM);
  box.position.set(0,y,0);g.add(box);
  const pis=[];
  for(const sx of [-0.33,0.33]){
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.18,14),pisM);
    p.position.set(sx,y-Math.sign(y)*0.15,0);g.add(p);pis.push(p);
  }
  scene.add(g);return {g,pis};
}
const cylTop=makeCylinder(1.32), cylBot=makeCylinder(-1.32);cylBot.g.visible=false;
const pinM=new THREE.MeshStandardMaterial({color:0xb8c2cc,roughness:0.35,metalness:0.7});
const pinsBot=[],pinsSide=[];
function makePin(deg){
  const p=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.5,12),pinM);
  p.rotation.x=Math.PI/2;p.position.copy(polar(deg,1.18,0));scene.add(p);return p;
}
pinsBot.push(makePin(262),makePin(278));pinsSide.push(makePin(8),makePin(172));
pinsSide.forEach(p=>p.visible=false);
const bracket=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.14,0.3),cylM);
bracket.position.set(0,-1.24,0);scene.add(bracket);
/* 摩擦力箭头(切向)+ 蹄片被压/被推箭头(径向) */
const arrLeadM=new THREE.MeshStandardMaterial({color:0xff5a5a,roughness:0.4,emissive:0xff5a5a,emissiveIntensity:0.45});
const arrTrailM=new THREE.MeshStandardMaterial({color:0x74a8ff,roughness:0.4,emissive:0x74a8ff,emissiveIntensity:0.4});
const tipInM=new THREE.MeshStandardMaterial({color:0x74dc84,roughness:0.4,emissive:0x74dc84,emissiveIntensity:0.45});
const tipOutM=new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:0.4,emissive:0x9fb0c3,emissiveIntensity:0.3});
const arrows=[];
function makeArrow(mat){
  const g=new THREE.Group();
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1,10),mat);
  cyl.rotation.z=Math.PI/2;cyl.position.x=0.5;g.add(cyl);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.085,0.22,12),mat);
  cone.rotation.z=-Math.PI/2;cone.position.x=1.0;g.add(cone);
  scene.add(g);arrows.push(g);return g;
}
const aFricR=makeArrow(arrLeadM), aFricL=makeArrow(arrTrailM);
const aTipR=makeArrow(tipInM), aTipL=makeArrow(tipOutM);

/* 状态 */
let mode='lt',p=3,mu=0.38,vKmh=60,playing=true,labelsOn=true,slowMo=false,arrowsOn=true;
let temp=25,v=16.7,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const R_D=0.115, R_W=0.28, M_VEH=1200, GEO=1.35;
function gains(m){return {gl:1/Math.max(0.06,1-m*GEO), gt:1/(1+m*GEO)};}
function muEff(){return mu*(1-0.32*clamp((temp-80)/260,0,1));}
function cycleEnv(t){const c=t%5.6;
  if(c<0.5)return 0; if(c<1.0)return smooth((c-0.5)/0.5);
  if(c<3.8)return 1; if(c<4.3)return 1-smooth((c-3.8)/0.5); return 0;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
let st={T:0,gl:2,gt:0.7,env:0,pEff:0,muE:0.38,decel:0};
const lblCyl=addLabel(()=>L(`轮缸液压 ${st.pEff.toFixed(1)} MPa`,`line pressure ${st.pEff.toFixed(1)} MPa`),
  new THREE.Vector3(0,1.72,0.3),'o');
const lblLead=addLabel(()=>L(`领蹄 · 自增力 G=${st.gl.toFixed(2)}`,`leading shoe · servo G=${st.gl.toFixed(2)}`),
  new THREE.Vector3(1.72,0.72,0.4),'r');
const lblTrail=addLabel(()=>mode==='lt'
    ?L(`从蹄 · 被反推 G=${st.gt.toFixed(2)}`,`trailing shoe · de-servo G=${st.gt.toFixed(2)}`)
    :L(`领蹄② · 自增力 G=${st.gl.toFixed(2)}`,`leading shoe ② · servo G=${st.gl.toFixed(2)}`),
  new THREE.Vector3(-1.72,0.72,0.4),'b');
const lblPivot=addLabel(()=>L('支点销(反力支座)','anchor pin'),new THREE.Vector3(0,-1.78,0.4),'y');
const lblDrum=addLabel(()=>L(`制动力矩 ${st.T.toFixed(0)} N·m`,`brake torque ${st.T.toFixed(0)} N·m`),
  new THREE.Vector3(0.75,-0.35,0.9),'g');
const lblTemp=addLabel(()=>L(`鼓温 ${temp.toFixed(0)} °C`,temp>150?`drum ${temp.toFixed(0)} °C HOT`:`drum ${temp.toFixed(0)} °C`),
  new THREE.Vector3(-1.35,-0.95,0.6),'y');
const lblSpeed=addLabel(()=>L(`车速 ${vKmh.toFixed(0)} km/h`,`speed ${vKmh.toFixed(0)} km/h`),
  new THREE.Vector3(0.95,1.9,0),'b');
const lblServo=addLabel(()=>L('摩擦力矩与推力同向 → 越压越紧','friction moment aids the push → self-energizing'),
  new THREE.Vector3(1.55,-0.75,0.5),'g',()=>arrowsOn&&mode==='lt');
const lblAnti=addLabel(()=>L('摩擦力矩反向 → 把蹄推离','friction moment opposes → shoe pushed off'),
  new THREE.Vector3(-1.62,-0.45,0.5),'r',()=>arrowsOn&&mode==='lt');

function setP(vv){p=clamp(vv,0.5,6);
  document.getElementById('sP').value=p;
  document.getElementById('sPVal').textContent=p.toFixed(1)+' MPa';}
function setMu(vv){mu=clamp(vv,0.25,0.55);
  document.getElementById('sMu').value=mu;
  document.getElementById('sMuVal').textContent=mu.toFixed(2);}
function setV(vv){vKmh=clamp(vv,20,100);
  document.getElementById('sV').value=vKmh;
  document.getElementById('sVVal').textContent=vKmh.toFixed(0)+' km/h';}
function setMode(m){mode=m;
  document.getElementById('bLT').classList.toggle('on',m==='lt');
  document.getElementById('bDuo').classList.toggle('on',m==='duo');
  cylBot.g.visible=(m==='duo');
  pinsBot.forEach(pp=>pp.visible=(m==='lt'));
  pinsSide.forEach(pp=>pp.visible=(m==='duo'));
  bracket.visible=(m==='lt');
  aTipL.children.forEach(c=>c.material=(m==='lt'?tipOutM:tipInM));
  aFricL.children.forEach(c=>c.material=(m==='lt'?arrTrailM:arrLeadM));
  lblAnti.visible=labelsOn&&arrowsOn&&mode==='lt';}

const STEPS=[
 {b:'轮缸推开两蹄',be:'The cylinder pries both shoes',
  d:'液压进入轮缸,两只活塞把蹄片腹板向外撑开,蹄片离开支点、朝旋转的鼓壁靠拢——这是唯一的主动施力环节。',
  de:'Fluid enters the wheel cylinder and its two pistons spread the shoe webs apart; the shoes swing off their anchors toward the spinning drum — the only active force input in the system.',
  act(){setMode('lt');setP(2);setMu(0.38);setV(60);}},
 {b:'贴合鼓壁产生摩擦',be:'Contact makes friction',
  d:'蹄片贴上鼓壁,摩擦力沿鼓的转向拖曳蹄片,法向压紧力 × 摩擦系数 × 鼓半径,制动扭矩开始出现。',
  de:'The linings touch the drum and friction drags each shoe along the rotation; normal force × μ × drum radius adds up into braking torque.',
  act(){setP(3.5);}},
 {b:'领蹄:力矩自增强',be:'Leading shoe: self-energizing',
  d:'领蹄(朝转向前方)的摩擦力绕支点的力矩与轮缸推力同向,把蹄越压越紧——法向力被放大 G_l=1/(1−μ·a/b) 倍,蹄在给自己踩刹车。',
  de:'On the leading shoe the friction moment about the anchor acts WITH the cylinder push, pressing the shoe harder against the drum — normal force amplified by G=1/(1−μ·a/b); the shoe brakes itself.',
  act(){setMode('lt');setMu(0.45);setP(3);}},
 {b:'从蹄:反被推离',be:'Trailing shoe: pushed off',
  d:'从蹄的摩擦力矩与推力反向,把蹄往回推离鼓壁,只能靠液压硬顶,同样的压紧力要花更大的轮缸力——这就是领从蹄式的不对称。',
  de:'On the trailing shoe the friction moment REVERSES, dragging the shoe off the drum; hydraulics must carry it alone, so the same grip costs far more line pressure — the asymmetry of the L-T layout.',
  act(){setMode('lt');setP(4.5);}},
 {b:'μ 是增益也是悬崖',be:'μ: amplifier and cliff edge',
  d:'增益随 μ 放大:μ 越大分母 1−μ·a/b 越小;双向双领蹄把 μ 拉满时倍率逼近自锁——摩擦自己就能维持压紧,一点扰动就抱死。',
  de:'Gain grows with μ as the denominator 1−μ·a/b shrinks; on a duo-servo at max μ the factor nears self-lock — friction alone sustains the grip and any perturbation snatches the wheel dead.',
  act(){setMode('duo');setMu(0.55);setP(3);}},
 {b:'温升 μ 降 = 热衰退',be:'Heat kills μ: brake fade',
  d:'连续制动把鼓加热到 150 °C 以上,μ 随温度下滑、增益缩水:同样的液压,扭矩却越踩越“软”——长下坡拖刹就是经典场景。',
  de:'Sustained braking heats the drum past 150 °C; μ slides down with temperature and the gain sags — same pedal, shrinking torque. Dragging brakes down a long descent is the textbook case.',
  act(){setMode('lt');setMu(0.38);setV(90);setP(5);}},
 {b:'双向双领蹄',be:'Duo-servo, both ways',
  d:'两只蹄在正反两个方向都是领蹄:上下两只轮缸从两端施力,倒车制动同样有伺服,扭矩比领从蹄式高出约五成。',
  de:'Both shoes lead in BOTH directions: two cylinders actuate from both ends, reverse braking gets the same servo, and torque runs ~50% above the L-T layout.',
  act(){setMode('duo');setMu(0.38);setP(3);setV(60);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stT').innerHTML=st.T.toFixed(0)+'<small> N·m</small>';
  const gv=document.getElementById('stG');
  const gain=mode==='duo'?st.gl:(st.gl+st.gt)/2;
  gv.innerHTML=gain.toFixed(2)+'<small> ×</small>';
  gv.className='v '+(gain>3.2?'warn':'');
  const tv=document.getElementById('stTemp');
  tv.innerHTML=temp.toFixed(0)+'<small> °C</small>';
  tv.className='v '+(temp>150?'warn':temp<100?'ok':'');
  document.getElementById('stA').innerHTML=st.decel.toFixed(1)+'<small> m/s²</small>';
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bLT').addEventListener('click',()=>setMode('lt'));
document.getElementById('bDuo').addEventListener('click',()=>setMode('duo'));
document.getElementById('sP').addEventListener('input',e=>setP(+e.target.value));
document.getElementById('sMu').addEventListener('input',e=>setMu(+e.target.value));
document.getElementById('sV').addEventListener('input',e=>setV(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglArr').addEventListener('change',e=>{arrowsOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x111214:0xe9e4dc);
  scene.fog.color.setHex(dark?0x111214:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  plateM.color.setHex(dark?0x2a2f38:0x9aa2ad);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 物理 ── */
  const env=cycleEnv(simT);
  const pEff=p*env;
  const mE=muEff();
  const F=pEff*450;                       /* A=4.5 cm² 双活塞 */
  const g=gains(mE);
  const T=mode==='duo'?mE*R_D*2*F*g.gl:mE*R_D*F*(g.gl+g.gt);
  const vT=vKmh/3.6;
  v=Math.max(0.4,v+(-(4*T/(M_VEH*R_W))+(vT-v)*0.35)*dts);
  const om=v/R_W;
  temp=Math.max(25,temp+(T*om-42*(temp-25))/2800*dts);
  st={T,gl:g.gl,gt:g.gt,env,pEff,muE:mE,decel:4*T/(M_VEH*R_W)};
  /* ── 可视化 ── */
  const eng=clamp(pEff/2.2,0,1);
  const expand=0.022*eng;
  shoeR.grp.position.copy(polar(midR,expand));
  shoeL.grp.position.copy(polar(midL,expand));
  const heatK=clamp((temp-80)/260,0,1);
  shoeR.linM.emissiveIntensity=0.12*eng+heatK*0.85;
  shoeL.linM.emissiveIntensity=0.12*eng+heatK*0.85;
  drumM.opacity=0.20+0.10*heatK;
  cylTop.pis.forEach(pp=>pp.position.y=1.32-0.15-0.10*eng);
  cylBot.pis.forEach(pp=>pp.position.y=-1.32+0.15+0.10*eng);
  drumG.rotation.z-=om*dts*0.22;
  /* 摩擦力箭头:切向,长度∝μN */
  const fR=mE*F*g.gl*eng, fL=mE*F*(mode==='duo'?g.gl:g.gt)*eng;
  const setA=(ar,force,deg,pos,dir)=>{
    ar.visible=arrowsOn&&force>8;
    if(!ar.visible)return;
    ar.position.copy(pos);
    ar.scale.set(clamp(0.16+force*2.6e-4,0.16,0.85),1,1);
    ar.rotation.z=Math.atan2(dir.y,dir.x);
  };
  setA(aFricR,fR,polar(midR,1.5,0.3),polar(midR,1.5,0.3),
    new THREE.Vector3(Math.sin(midR*D2R),-Math.cos(midR*D2R),0));
  setA(aFricL,fL,polar(midL,1.5,0.3),polar(midL,1.5,0.3),
    new THREE.Vector3(Math.sin(midL*D2R),-Math.cos(midL*D2R),0));
  /* 蹄片趋势箭头:领蹄径向向外(压紧),从蹄径向向内(推离) */
  aTipR.visible=arrowsOn&&eng>0.05;
  if(aTipR.visible){
    aTipR.position.copy(polar(midR,1.24,0.3));
    aTipR.scale.set(0.3+0.15*eng,1,1);
    aTipR.rotation.z=midR*D2R+(mode==='duo'?0:0);
  }
  aTipL.visible=arrowsOn&&eng>0.05;
  if(aTipL.visible){
    aTipL.position.copy(polar(midL,1.24,0.3));
    aTipL.scale.set(0.3+0.15*eng,1,1);
    aTipL.rotation.z=midL*D2R+(mode==='lt'?180:0);
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
