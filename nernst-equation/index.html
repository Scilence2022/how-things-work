<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能斯特方程 · 浓度决定电压</title>
<style>
:root,:root[data-theme="dark"]{color-scheme:dark;
  --acc:#4dabf7;--bg:#0f1214;--panel:rgba(15,18,20,.86);--panel-border:rgba(255,255,255,.09);
  --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;--hover:rgba(255,255,255,.05);
  --shadow:0 8px 30px rgba(0,0,0,.45);--tool:rgba(15,18,20,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,18,20,.8);}
:root[data-theme="light"]{color-scheme:light;
  --acc:#1864ab;--bg:#eef2f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
  --text:#16202c;--text2:#5b6b7d;--text3:#33414f;--hover:rgba(15,25,40,.05);
  --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s;}
#app{position:fixed;inset:0;}#app canvas{display:block;}
#tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
.tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
  font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;text-decoration:none;backdrop-filter:blur(6px);transition:border-color .15s,color .15s,transform .15s;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
#title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
#title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
#title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5);}
#stats{position:fixed;right:18px;bottom:244px;z-index:4;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
  backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
#stats .k{font-size:12px;color:var(--text2);align-self:center;}
#stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
#stats .v small{font-size:11px;color:var(--text2);font-weight:400;}
#stats .v.ok{color:#7bd88f;}#stats .v.warn{color:#ffa94d;}#stats .v.bad{color:#ff6b6b;}
#panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
  background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
  padding:14px 16px 12px;backdrop-filter:blur(6px);box-shadow:var(--shadow);
  max-height:calc(100vh - 160px);overflow:auto;}
#actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;background:var(--hover);
  color:var(--text2);border:1px solid var(--tool-border);border-radius:9px;padding:7px 10px;
  font-size:12.5px;font-weight:600;transition:border-color .15s,color .15s,background .15s;}
.abtn:hover{border-color:var(--acc);color:var(--text);}
.abtn.on{border-color:rgba(77,171,247,.6);background:rgba(77,171,247,.12);color:var(--text);}
:root[data-theme="light"] .abtn.on{border-color:rgba(24,100,171,.55);background:rgba(24,100,171,.10);}
#formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);
  border-top:1px dashed var(--panel-border);padding-top:7px;}
#formula b{color:var(--text3);font-weight:600;}
#steps{list-style:none;margin-top:8px;}
#steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;align-items:flex-start;}
#steps li:hover{background:var(--hover);}
#steps li.on{background:rgba(77,171,247,.10);border-color:rgba(77,171,247,.45);}
:root[data-theme="light"] #steps li.on{background:rgba(24,100,171,.08);border-color:rgba(24,100,171,.4);}
#steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  background:rgba(255,255,255,.12);color:var(--text3);}
:root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
#steps li.on .n{background:var(--acc);color:#fff;}
#steps .t{font-size:12px;color:var(--text3);line-height:1.45;}
#steps .t b{color:var(--text);font-size:12px;}
#steps li.on .t b{color:#bde9ff;}
:root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
#ctrl{margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);display:flex;flex-direction:column;gap:6px;}
#ctrl label{font-size:12px;color:var(--text2);display:flex;justify-content:space-between;}
#ctrl input[type=range]{width:100%;accent-color:var(--acc);height:4px;cursor:pointer;}
@media(max-width:900px){#stats{display:none;}}
@media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh;}
  #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>

<div id="title">
  <h1 data-zh="能斯特方程" data-en="Nernst Equation">能斯特方程</h1>
  <div class="sub" data-zh="浓度决定电压：Q 每增十倍，电压降 29.5 mV（n=2）" data-en="Concentration drives voltage — Q×10 drops E by 29.5 mV (n=2)">浓度决定电压：Q 每增十倍，电压降 29.5 mV（n=2）</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="电压 E (V)" data-en="Voltage E (V)">电压 E (V)</span><span class="v ok" id="stE">1.13</span>
  <span class="k" data-zh="[Cu²⁺] mol/L" data-en="[Cu²⁺] mol/L">[Cu²⁺] mol/L</span><span class="v" id="stCu">1.000</span>
  <span class="k" data-zh="[Zn²⁺] mol/L" data-en="[Zn²⁺] mol/L">[Zn²⁺] mol/L</span><span class="v" id="stZn">0.100</span>
  <span class="k" data-zh="log Q" data-en="log Q">log Q</span><span class="v" id="stLogQ">−1.00</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnDischarge" data-zh="开始放电" data-en="Discharge">开始放电</button>
    <button class="abtn" id="btnReset" data-zh="重置" data-en="Reset">重置</button>
    <button class="abtn" id="btnConc" data-zh="浓差电池" data-en="Concentration cell">浓差电池</button>
  </div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <label data-zh="[Cu²⁺] 浓度" data-en="[Cu²⁺] concentration">
      <span data-zh="[Cu²⁺] 浓度" data-en="[Cu²⁺]">[Cu²⁺] 浓度</span>
      <span id="slCuVal">1.000 mol/L</span>
    </label>
    <input type="range" id="slCu" min="-3" max="0" step="0.01" value="0">
    <label>
      <span data-zh="温度 T" data-en="Temperature T">温度 T</span>
      <span id="slTVal">298 K</span>
    </label>
    <input type="range" id="slT" min="280" max="340" step="1" value="298">
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG  = localStorage.getItem('htw-lang')  || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));

let discharging = false, concCell = false;
let cu_conc = 1.0, zn_conc = 0.1, T = 298;
let E_std = 1.10, playing = true;

function calcE(){
  if(concCell) return (0.059*T/298/2)*Math.log10(zn_conc/cu_conc);
  return E_std - (0.059*T/298/2)*Math.log10(zn_conc/cu_conc);
}

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x0a0c0e);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0c0e,30,80);
const camera = new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(0,5,18);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.target.set(0,0,0);

scene.add(new THREE.AmbientLight(0xffffff,0.45));
const sun = new THREE.DirectionalLight(0xffffff,0.85); sun.position.set(6,12,8); scene.add(sun);

// Left half-cell (Zn) — blue semi-transparent cylinder
const cellGeoL = new THREE.CylinderGeometry(1.1,1.1,3.5,32);
const cellMatL = new THREE.MeshStandardMaterial({color:0x3a6186,transparent:true,opacity:0.35,roughness:0.3,metalness:0.1,side:THREE.DoubleSide});
const cellL = new THREE.Mesh(cellGeoL,cellMatL); cellL.position.set(-3,0,0); scene.add(cellL);

// Right half-cell (Cu) — darker blue semi-transparent
const cellGeoR = new THREE.CylinderGeometry(1.1,1.1,3.5,32);
const cellMatR = new THREE.MeshStandardMaterial({color:0x1a3a5c,transparent:true,opacity:0.35,roughness:0.3,metalness:0.1,side:THREE.DoubleSide});
const cellR = new THREE.Mesh(cellGeoR,cellMatR); cellR.position.set(3,0,0); scene.add(cellR);

// Zn electrode (gray rod)
const znGeo = new THREE.CylinderGeometry(0.18,0.18,3.2,16);
const znMat = new THREE.MeshStandardMaterial({color:0x8a8a8a,roughness:0.6,metalness:0.7});
const znRod = new THREE.Mesh(znGeo,znMat); znRod.position.set(-3.4,0,0); scene.add(znRod);

// Cu electrode (copper-colored rod)
const cuGeo = new THREE.CylinderGeometry(0.18,0.18,3.2,16);
const cuMat = new THREE.MeshStandardMaterial({color:0xb87333,roughness:0.4,metalness:0.8});
const cuRod = new THREE.Mesh(cuGeo,cuMat); cuRod.position.set(3.4,0,0); scene.add(cuRod);

// Salt bridge — curved tube (approximate with cylinders)
const bridgeMat = new THREE.MeshStandardMaterial({color:0xd4a843,roughness:0.5,transparent:true,opacity:0.7});
const bridgeSegs = 12;
const bridgePoints = [];
for(let i=0;i<=bridgeSegs;i++){
  const t = i/bridgeSegs;
  const x = -2.5 + t*5;
  const y = 2.2 + Math.sin(t*Math.PI)*0.8;
  bridgePoints.push(new THREE.Vector3(x,y,0));
}
const bridgeCurve = new THREE.CatmullRomCurve3(bridgePoints);
const bridgeTubeGeo = new THREE.TubeGeometry(bridgeCurve,20,0.12,8,false);
const bridgeMesh = new THREE.Mesh(bridgeTubeGeo,bridgeMat); scene.add(bridgeMesh);

// External wire (arc above)
const wireMat = new THREE.MeshStandardMaterial({color:0xe0e0e0,roughness:0.4,metalness:0.8});
const wirePoints = [];
for(let i=0;i<=20;i++){
  const t=i/20; const x=-3.4+t*6.8; const y=3.5+Math.sin(t*Math.PI)*1.2;
  wirePoints.push(new THREE.Vector3(x,y,0));
}
const wireCurve = new THREE.CatmullRomCurve3(wirePoints);
const wireTubeGeo = new THREE.TubeGeometry(wireCurve,20,0.06,8,false);
scene.add(new THREE.Mesh(wireTubeGeo,wireMat));

// Voltmeter plane with canvas texture
const vmCanvas = document.createElement('canvas'); vmCanvas.width=200; vmCanvas.height=80;
const vmCtx = vmCanvas.getContext('2d');
const vmTex = new THREE.CanvasTexture(vmCanvas);
const vmGeo = new THREE.PlaneGeometry(2.0,0.8);
const vmMat = new THREE.MeshBasicMaterial({map:vmTex,side:THREE.DoubleSide});
const vmMesh = new THREE.Mesh(vmGeo,vmMat); vmMesh.position.set(0,5.5,0); scene.add(vmMesh);

function drawVoltmeter(){
  const E = calcE();
  vmCtx.fillStyle='#1a2a3a'; vmCtx.fillRect(0,0,200,80);
  vmCtx.strokeStyle='#4dabf7'; vmCtx.lineWidth=2; vmCtx.strokeRect(2,2,196,76);
  vmCtx.font='bold 14px monospace'; vmCtx.fillStyle='#9fb0c3'; vmCtx.textAlign='center';
  vmCtx.fillText('VOLTMETER',100,20);
  vmCtx.font='bold 28px monospace'; vmCtx.fillStyle='#7bd88f';
  vmCtx.fillText(E.toFixed(3)+' V',100,55);
  vmTex.needsUpdate=true;
}

// Zn²⁺ ions (light blue, emerge from Zn anode)
const ZN_COUNT = 30;
const znIonGeo = new THREE.SphereGeometry(0.07,8,8);
const znIonMat = new THREE.MeshBasicMaterial({color:0x74c0fc});
const znIonMesh = new THREE.InstancedMesh(znIonGeo,znIonMat,ZN_COUNT);
znIonMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(znIonMesh);
const znIonState = Array.from({length:ZN_COUNT},(_,i)=>({x:-3.4+(Math.random()-0.5)*0.3,y:(Math.random()-0.5)*3,z:(Math.random()-0.5)*0.5,vx:0.3+Math.random()*0.2,life:Math.random()}));

// Cu²⁺ ions (darker blue, drift toward Cu electrode)
const CU_COUNT = 30;
const cuIonGeo = new THREE.SphereGeometry(0.07,8,8);
const cuIonMat = new THREE.MeshBasicMaterial({color:0x339af0});
const cuIonMesh = new THREE.InstancedMesh(cuIonGeo,cuIonMat,CU_COUNT);
cuIonMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(cuIonMesh);
const cuIonState = Array.from({length:CU_COUNT},(_,i)=>({x:1.5+Math.random()*1.5,y:(Math.random()-0.5)*2.5,z:(Math.random()-0.5)*0.5,vx:0.25+Math.random()*0.2,life:Math.random()}));

// Electron flow (yellow dots along wire arc)
const EL_COUNT = 20;
const elGeo = new THREE.SphereGeometry(0.09,8,8);
const elMat = new THREE.MeshBasicMaterial({color:0xffd43b});
const elMesh = new THREE.InstancedMesh(elGeo,elMat,EL_COUNT);
elMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(elMesh);
const elState = Array.from({length:EL_COUNT},(_,i)=>({t:i/EL_COUNT}));

// Salt bridge ions
const SB_COUNT = 10;
const sbGeo = new THREE.SphereGeometry(0.06,8,8);
const sbMat = new THREE.MeshBasicMaterial({color:0xffa94d});
const sbMesh = new THREE.InstancedMesh(sbGeo,sbMat,SB_COUNT);
sbMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(sbMesh);
const sbState = Array.from({length:SB_COUNT},(_,i)=>({t:i/SB_COUNT}));

const dummy = new THREE.Object3D();
function hide(mesh,i){dummy.position.set(0,-100,0);dummy.scale.set(0.001,0.001,0.001);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);}

function stepParticles(dt){
  // Zn²⁺ ions drifting right into solution
  for(let i=0;i<ZN_COUNT;i++){
    const s=znIonState[i];
    s.x+=s.vx*dt*0.4;
    if(s.x>-1.5){s.x=-3.4+(Math.random()-0.5)*0.2;s.y=(Math.random()-0.5)*2.5;s.life=0;}
    dummy.position.set(s.x,s.y,s.z);dummy.scale.set(1,1,1);dummy.updateMatrix();
    znIonMesh.setMatrixAt(i,dummy.matrix);
  }
  znIonMesh.instanceMatrix.needsUpdate=true;

  // Cu²⁺ ions drifting toward Cu rod and disappearing
  const cuDensity = clamp(cu_conc,0.001,1.0);
  for(let i=0;i<CU_COUNT;i++){
    const s=cuIonState[i];
    if(i >= Math.round(cuDensity*CU_COUNT)){hide(cuIonMesh,i);continue;}
    s.x+=s.vx*dt*0.35;
    if(s.x>3.2){s.x=1.5+Math.random()*1.5;s.y=(Math.random()-0.5)*2.5;}
    dummy.position.set(s.x,s.y,s.z);dummy.scale.set(1,1,1);dummy.updateMatrix();
    cuIonMesh.setMatrixAt(i,dummy.matrix);
  }
  cuIonMesh.instanceMatrix.needsUpdate=true;

  // Electrons along wire
  const wirePts = wireCurve.getPoints(50);
  for(let i=0;i<EL_COUNT;i++){
    const s=elState[i];
    s.t=(s.t+dt*0.25)%1;
    const idx=Math.floor(s.t*49); const p=wirePts[idx];
    dummy.position.copy(p);dummy.scale.set(1,1,1);dummy.updateMatrix();
    elMesh.setMatrixAt(i,dummy.matrix);
  }
  elMesh.instanceMatrix.needsUpdate=true;

  // Salt bridge ions
  const sbPts = bridgeCurve.getPoints(30);
  for(let i=0;i<SB_COUNT;i++){
    const s=sbState[i];
    s.t=(s.t+dt*0.15)%1;
    const idx=Math.floor(s.t*29); const p=sbPts[idx];
    dummy.position.copy(p);dummy.scale.set(1,1,1);dummy.updateMatrix();
    sbMesh.setMatrixAt(i,dummy.matrix);
  }
  sbMesh.instanceMatrix.needsUpdate=true;
}

function stepSim(dt){
  if(discharging){
    cu_conc = Math.max(0.001, cu_conc - 0.003*dt);
    zn_conc = Math.min(2.0, zn_conc + 0.003*dt);
    document.getElementById('slCu').value = Math.log10(cu_conc).toString();
    updateSliderLabels();
  }
}

function updateStats(){
  const E=calcE();
  const logQ=Math.log10(zn_conc/cu_conc);
  const eEl = document.getElementById('stE');
  eEl.textContent=E.toFixed(3);
  eEl.className='v '+(E>1.0?'ok':E>0.5?'warn':'bad');
  document.getElementById('stCu').textContent=cu_conc.toFixed(3);
  document.getElementById('stZn').textContent=zn_conc.toFixed(3);
  document.getElementById('stLogQ').textContent=logQ.toFixed(2);
}

function updateFormula(){
  const E=calcE(); const logQ=Math.log10(zn_conc/cu_conc);
  const n=2; const coeff=(0.059*T/298/n).toFixed(4);
  document.getElementById('formula').innerHTML=
    `<b>${L('能斯特方程','Nernst Equation')}:</b> E = E° − (0.059×T/298/n)×log Q<br>`+
    `<b>${L('当前','Current')}:</b> E = ${concCell?'0.00':E_std.toFixed(2)} − ${coeff}×${logQ.toFixed(2)} = <b>${E.toFixed(3)} V</b><br>`+
    `<b>Q</b> = [Zn²⁺]/[Cu²⁺] = ${zn_conc.toFixed(3)}/${cu_conc.toFixed(3)} = ${(zn_conc/cu_conc).toFixed(3)}`;
}

const STEPS=[
  {zh:'标准电动势 E°=1.10 V：锌活性高于铜，锌失去电子更自发',en:'Standard EMF E°=1.10V: Zn more active than Cu — Zn oxidation is more spontaneous'},
  {zh:'反应商 Q=[Zn²⁺]/[Cu²⁺]，偏离 Q=1 时电压偏离 E°',en:'Reaction quotient Q=[Zn²⁺]/[Cu²⁺] — deviation from Q=1 shifts E from E°'},
  {zh:'能斯特方程：E=E°−(0.059/n)log Q，每十倍 Q 变化电压差 59/n mV',en:'Nernst: E=E°−(0.059/n)log Q — each decade of Q changes E by 59/n mV'},
  {zh:'放电：Cu²⁺ 浓度持续降低，Q 增大，电压缓慢下降',en:'Discharge: Cu²⁺ depletes, Q rises, voltage slowly falls'},
  {zh:'浓差电池：两侧同种电极，E°=0，完全靠浓度差做功',en:'Concentration cell: identical electrodes, E°=0 — voltage entirely from concentration difference'},
  {zh:'温度效应：T 升高使 RT/nF 增大，浓度对电压影响更强',en:'Temperature: higher T increases RT/nF coefficient — concentration has stronger effect'},
];

function buildSteps(){
  const ol=document.getElementById('steps'); ol.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    const txt=LANG==='en'?s.en:s.zh;
    const parts=txt.split(/[:：]/);
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${parts[0]}</b>${parts.length>1?'<br>'+parts.slice(1).join('：'):''}</span>`;
    li.addEventListener('click',()=>{document.querySelectorAll('#steps li').forEach(x=>x.classList.remove('on'));li.classList.add('on');});
    ol.appendChild(li);
  });
}

function updateSliderLabels(){
  cu_conc = Math.pow(10, parseFloat(document.getElementById('slCu').value));
  T = parseFloat(document.getElementById('slT').value);
  document.getElementById('slCuVal').textContent = cu_conc.toFixed(3)+' mol/L';
  document.getElementById('slTVal').textContent = T+' K';
}

document.getElementById('slCu').addEventListener('input',()=>{updateSliderLabels();updateStats();updateFormula();drawVoltmeter();});
document.getElementById('slT').addEventListener('input',()=>{updateSliderLabels();updateStats();updateFormula();drawVoltmeter();});

document.getElementById('btnDischarge').addEventListener('click',()=>{
  discharging=!discharging; concCell=false;
  document.getElementById('btnDischarge').classList.toggle('on',discharging);
  document.getElementById('btnConc').classList.remove('on');
});
document.getElementById('btnReset').addEventListener('click',()=>{
  cu_conc=1.0; zn_conc=0.1; T=298; discharging=false; concCell=false;
  document.getElementById('slCu').value='0';
  document.getElementById('slT').value='298';
  document.getElementById('btnDischarge').classList.remove('on');
  document.getElementById('btnConc').classList.remove('on');
  updateSliderLabels(); updateStats(); updateFormula(); drawVoltmeter();
});
document.getElementById('btnConc').addEventListener('click',()=>{
  concCell=!concCell; discharging=false;
  cu_conc=0.01; zn_conc=1.0;
  document.getElementById('slCu').value='-2';
  document.getElementById('btnConc').classList.toggle('on',concCell);
  document.getElementById('btnDischarge').classList.remove('on');
  updateSliderLabels(); updateStats(); updateFormula(); drawVoltmeter();
});

function applyTheme(){
  htmlEl.setAttribute('data-theme',THEME);
  renderer.setClearColor(THEME==='dark'?0x0a0c0e:0xd0d8e4);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh;});
  document.getElementById('langBtn').textContent=LANG==='en'?'中':'EN';
  document.title=L('能斯特方程 · 浓度决定电压','Nernst Equation · Concentration Drives Voltage');
  buildSteps(); updateFormula();
}
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});

const clock=new THREE.Clock(); let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);
  if(playing){ stepSim(dt); stepParticles(dt); drawVoltmeter(); }
  updateStats(); updateFormula();
  controls.update();
  renderer.render(scene,camera);
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.matches('input')){e.preventDefault();playing=!playing;}});
document.addEventListener('visibilitychange',()=>{ if(document.hidden){cancelAnimationFrame(raf);raf=null;}else{clock.getDelta();raf=requestAnimationFrame(frame);}});

applyTheme(); applyLang(); buildSteps(); updateSliderLabels(); updateStats(); updateFormula(); drawVoltmeter();
raf=requestAnimationFrame(frame);
</script>
</body></html>
