<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>燃料电池 · 不停加料的原电池</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#90be6d;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#5c8a3c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.a { border-color: rgba(255,159,40,.9); color: #ffd9a3; }
  .lbl.c { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.m { border-color: rgba(216,201,143,.9); color: #f0e6bd; }
  .lbl.w { border-color: rgba(127,208,247,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(144,190,109,.9); color: #d3ecbd; font-size: 13px; padding: 6px 11px; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; }
  :root[data-theme="light"] .lbl.a { border-color: rgba(156,95,0,.9); color: #9c5f00; }
  :root[data-theme="light"] .lbl.c { border-color: rgba(12,123,166,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.m { border-color: rgba(140,125,70,.9); color: #7a6d33; }
  :root[data-theme="light"] .lbl.st { border-color: rgba(92,138,60,.9); color: #4c7a2a; }
  :root[data-theme="light"] .lbl.bad { border-color: rgba(200,60,60,.9); color: #b83232; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.w { color: #7fd0f7; }
  #stats .v.g { color: #90be6d; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h2 { color: #e8e8e8; border-color: rgba(230,230,230,.55); }
  .chip.o2 { color: #ff8a80; border-color: rgba(255,138,128,.7); }
  .chip.hp { color: #ffe08a; border-color: rgba(255,224,138,.7); }
  .chip.el { color: #7fd0f7; border-color: rgba(127,208,247,.7); }
  .chip.wa { color: #a8d8f0; border-color: rgba(168,216,240,.7); }
  :root[data-theme="light"] .chip.h2 { color: #555; border-color: rgba(80,80,80,.6); }
  :root[data-theme="light"] .chip.o2 { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.hp { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  :root[data-theme="light"] .chip.el { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 44px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(144,190,109,.10); border-color: rgba(144,190,109,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(92,138,60,.08); border-color: rgba(92,138,60,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #cfe8b8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #toggles label.big { font-weight: 600; color: var(--text3); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="燃料电池：不停加料的原电池" data-en="Fuel Cell: a galvanic cell you keep feeding">燃料电池：不停加料的原电池</h1>
  <div class="sub" data-zh="H₂ 在阳极裂成质子+电子;膜只放 H⁺ 过,电子被逼走外电路做功,在阴极与 O₂ 合成水——不断供料就不断发电 · 空格播放/暂停" data-en="H₂ splits at the anode; the membrane passes only H⁺, forcing electrons through the load; at the cathode they meet O₂ and make water — keep feeding it and it keeps running · Space = play/pause">H₂ 在阳极裂成质子+电子;膜只放 H⁺ 过,电子被逼走外电路做功,在阴极与 O₂ 合成水——不断供料就不断发电 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="输出电流" data-en="output current">输出电流</span><span class="v w" id="stI">—</span>
  <span class="k" data-zh="灯亮度" data-en="lamp brightness">灯亮度</span><span class="v" id="stB">—</span>
  <span class="k" data-zh="已产水 H₂O" data-en="water produced">已产水 H₂O</span><span class="v g" id="stW">0</span>
  <span class="k" data-zh="已用 H₂" data-en="H₂ consumed">已用 H₂</span><span class="v" id="stH">0</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip h2" data-zh="●● H₂" data-en="●● H₂">●● H₂</span>
    <span class="chip o2" data-zh="●● O₂" data-en="●● O₂">●● O₂</span>
    <span class="chip hp" data-zh="● H⁺" data-en="● H⁺">● H⁺</span>
    <span class="chip el" data-zh="● e⁻" data-en="● e⁻">● e⁻</span>
    <span class="chip wa" data-zh="H₂O" data-en="H₂O">H₂O</span>
  </div>
  <div class="row"><label data-zh="负载" data-en="Load">负载</label><input id="load" type="range" min="0" max="100" step="5" value="60"><span class="val" id="loadVal">60%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div id="toggles" style="margin-top:0">
      <label class="big"><input id="tglFuel" type="checkbox" checked> <span data-zh="供氢" data-en="H₂ supply">供氢</span></label>
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../galvanic-cell/" data-zh="原电池:同一家族(料在电极里)" data-en="galvanic cell: same family (fuel inside)">原电池:同一家族(料在电极里)</a>
    <a href="../water-electrolysis/" data-zh="水电解:把它倒过来就是电解池" data-en="water electrolysis: run it backwards">水电解:把它倒过来就是电解池</a>
    <a href="../pn-junction/" data-zh="p-n 结:另一对互逆器件" data-en="p-n junction: another inverse pair">p-n 结:另一对互逆器件</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.frame.color.set(THEME === 'light' ? 0x9aa4b2 : 0x39424f);
  M.back.color.set(THEME === 'light' ? 0xdde3ec : 0x181d26);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('燃料电池 · 不停加料的原电池', 'Fuel Cell · a galvanic cell you keep feeding');
  for (const r of labelRegistry) r.o.element.textContent = L(r.zh, r.en);
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.6, 3.1, 8.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  frame: mat(0x39424f, { roughness: 0.7 }),
  back: mat(0x181d26, { roughness: 0.9 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.07,
    roughness: 0.15, metalness: 0, side: THREE.DoubleSide, depthWrite: false }),
  metal: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  mem: mat(0xd8c98f, { roughness: 0.55, transparent: true, opacity: 0.5 }),
  catA: mat(0xff9f28, { roughness: 0.4, emissiveIntensity: 0.25 }),
  catC: mat(0x4cc9f0, { roughness: 0.4, emissiveIntensity: 0.2 }),
  atomH: new THREE.MeshBasicMaterial({ color: 0xe8e8e8 }),
  atomO: new THREE.MeshBasicMaterial({ color: 0xff6b62 }),
  hplus: new THREE.MeshBasicMaterial({ color: 0xffe08a }),
  ediag: new THREE.MeshBasicMaterial({ color: 0x7fd0f7 }),
  wire: mat(0xcfd4dc, { metalness: 0.7, roughness: 0.3 }),
  lamp: mat(0xfff2cc, { emissive: 0xffd166, emissiveIntensity: 0.05, roughness: 0.3 }),
  lampGlow: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.0, depthWrite: false }),
  tank: mat(0x5b6675, { roughness: 0.6, metalness: 0.3 }),
  beaker: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.15,
    roughness: 0.2, side: THREE.DoubleSide, depthWrite: false }),
  water: new THREE.MeshBasicMaterial({ color: 0x7fc4e8, transparent: true, opacity: 0.55 }),
  flash: new THREE.MeshBasicMaterial({ color: 0xfff0b8, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false }),
};

/* ---------------- 电池体(正面开口玻璃盒) ---------------- */
const CW = 5.6, CH = 2.2, CD = 1.0, CY = 1.5;   // 中心 y
const cell = new THREE.Group();
scene.add(cell);
{
  const back = new THREE.Mesh(new THREE.BoxGeometry(CW, CH, 0.06), M.back);
  back.position.set(0, CY, -CD / 2);
  cell.add(back);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), M.glass);
  glass.position.set(0, CY, CD / 2);
  cell.add(glass);
  for (const [w, h, x, y] of [
    [CW, 0.08, 0, CY - CH / 2], [CW, 0.08, 0, CY + CH / 2],
    [0.08, CH, -CW / 2, CY], [0.08, CH, CW / 2, CY]]) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(w, h, CD), M.frame);
    f.position.set(x, y, 0);
    cell.add(f);
  }
  /* 质子交换膜 + 两侧催化层 */
  const mem = new THREE.Mesh(new THREE.BoxGeometry(0.24, CH - 0.2, CD - 0.14), M.mem);
  mem.position.set(0, CY, 0);
  cell.add(mem);
  for (const [x, m] of [[-0.2, M.catA], [0.2, M.catC]]) {
    const cat = new THREE.Mesh(new THREE.BoxGeometry(0.05, CH - 0.2, CD - 0.16), m);
    cat.position.set(x, CY, 0);
    cell.add(cat);
  }
}

/* ---------------- 端子 / 外电路 / 灯 ---------------- */
function tube(points, m, r = 0.035) {
  const curve = new THREE.CatmullRomCurve3(points);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 48, r, 8, false), m));
  return curve;
}
for (const sx of [-0.9, 0.9]) {
  const term = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.55, 12), M.metal);
  term.position.set(sx, CY + CH / 2 + 0.24, 0);
  scene.add(term);
}
const wireCurve = tube([
  new THREE.Vector3(-0.9, CY + CH / 2 + 0.5, 0),
  new THREE.Vector3(-0.9, 3.75, 0), new THREE.Vector3(-0.35, 4.15, 0),
  new THREE.Vector3(0.35, 4.15, 0), new THREE.Vector3(0.9, 3.75, 0),
  new THREE.Vector3(0.9, CY + CH / 2 + 0.5, 0),
], M.wire);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 22, 16), M.lamp);
bulb.position.set(0, 4.15, 0);
scene.add(bulb);
const halo = new THREE.Mesh(new THREE.SphereGeometry(0.55, 18, 14), M.lampGlow);
halo.position.copy(bulb.position);
scene.add(halo);

/* ---------------- 气罐 / 集水瓶 ---------------- */
const tankH = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.75, 18), M.tank);
tankH.position.set(-2.5, 0.38, 0);
scene.add(tankH);
const tankO = tankH.clone();
tankO.position.set(2.5, 0.38, 0);
scene.add(tankO);
const beaker = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.36, 0.8, 20, 1, true), M.beaker);
beaker.position.set(0.9, 0.4, 0);
scene.add(beaker);
const waterBody = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.31, 0.3, 18), M.water);
waterBody.position.set(0.9, 0.18, 0);
scene.add(waterBody);

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(zh, en, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.textContent = zh;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, zh, en });
  return o;
}
const lblAnode = addLabel('阳极(−) 催化剂', 'anode (−) catalyst', new THREE.Vector3(-0.85, CY + 1.42, 0), 'a');
const lblCath = addLabel('阴极(+) 催化剂', 'cathode (+) catalyst', new THREE.Vector3(0.95, CY + 1.42, 0), 'c');
const lblMem = addLabel('质子交换膜:只放 H⁺ 过', 'PEM: H⁺ only', new THREE.Vector3(0, CY - 1.45, 0), 'm');
const lblLamp = addLabel('负载(灯)', 'load (lamp)', new THREE.Vector3(0, 4.75, 0), 'w');
const lblTankH = addLabel('H₂ 入', 'H₂ in', new THREE.Vector3(-2.5, 1.0, 0), 'a');
const lblTankO = addLabel('O₂ 入', 'O₂ in', new THREE.Vector3(2.5, 1.0, 0), 'c');
const lblWater = addLabel('产物水', 'water out', new THREE.Vector3(0.9, 1.0, 0), 'w');
const lblStatus = addLabel('运行中', 'running', new THREE.Vector3(0, 5.25, 0), 'st');
const lblBlocked = addLabel('✗ 电子过不去!', '✗ electrons can\'t pass!', new THREE.Vector3(-0.42, CY + 0.8, 0), 'bad');

/* ================= 分子系统(InstancedMesh) ================= */
const m4tmp = new THREE.Matrix4();
function makeInst(material, n, r) {
  const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 10, 8), material, n);
  for (let i = 0; i < n; i++) { m4tmp.makeScale(0.001, 0.001, 0.001); inst.setMatrixAt(i, m4tmp); }
  scene.add(inst);
  return inst;
}
const instH = makeInst(M.atomH, 84, 0.075);    // H 原子(H₂×2 + H₂O×2)
const instO = makeInst(M.atomO, 52, 0.095);    // O 原子(O₂×2 + H₂O×1)
const instHp = makeInst(M.hplus, 30, 0.06);    // H⁺
const instE = makeInst(M.ediag, 18, 0.055);    // 外电路 e⁻
const flashMesh = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), M.flash.clone());
flashMesh.visible = false;
scene.add(flashMesh);

/* 分子:{p, v, t: 'h2'|'o2'|'hp'|'h2o', alive, bond} */
const mols = [];
function spawnMol(t, x, y, z) {
  const m = { p: new THREE.Vector3(x, y, z), v: new THREE.Vector3(), t, alive: true, bond: Math.random() * Math.PI, wob: Math.random() * 9 };
  mols.push(m);
  return m;
}
function killMol(m) { m.alive = false; }
function renderMols() {
  let ih = 0, io = 0, ip = 0;
  for (const m of mols) {
    if (!m.alive) continue;
    const put = (inst, k, x, y, z) => {
      if (k >= inst.count) return;
      m4tmp.makeScale(1, 1, 1);
      m4tmp.setPosition(x, y, z);
      inst.setMatrixAt(k, m4tmp);
    };
    if (m.t === 'h2') {
      const dx = Math.cos(m.bond) * 0.09, dy = Math.sin(m.bond) * 0.09;
      put(instH, ih++, m.p.x - dx, m.p.y - dy, m.p.z);
      put(instH, ih++, m.p.x + dx, m.p.y + dy, m.p.z);
    } else if (m.t === 'o2') {
      const dx = Math.cos(m.bond) * 0.11, dy = Math.sin(m.bond) * 0.11;
      put(instO, io++, m.p.x - dx, m.p.y - dy, m.p.z);
      put(instO, io++, m.p.x + dx, m.p.y + dy, m.p.z);
    } else if (m.t === 'h2o') {
      put(instO, io++, m.p.x, m.p.y, m.p.z);
      const a = m.bond;
      put(instH, ih++, m.p.x + Math.cos(a - 0.52) * 0.12, m.p.y + Math.sin(a - 0.52) * 0.12, m.p.z);
      put(instH, ih++, m.p.x + Math.cos(a + 0.52) * 0.12, m.p.y + Math.sin(a + 0.52) * 0.12, m.p.z);
    } else if (m.t === 'hp') {
      put(instHp, ip++, m.p.x, m.p.y, m.p.z);
    }
  }
  for (let i = ih; i < instH.count; i++) { m4tmp.makeScale(0.001, 0.001, 0.001); instH.setMatrixAt(i, m4tmp); }
  for (let i = io; i < instO.count; i++) { m4tmp.makeScale(0.001, 0.001, 0.001); instO.setMatrixAt(i, m4tmp); }
  for (let i = ip; i < instHp.count; i++) { m4tmp.makeScale(0.001, 0.001, 0.001); instHp.setMatrixAt(i, m4tmp); }
  instH.instanceMatrix.needsUpdate = true;
  instO.instanceMatrix.needsUpdate = true;
  instHp.instanceMatrix.needsUpdate = true;
}

/* 外电路电子(沿 wireCurve 参数化) */
const eDots = [];
for (let i = 0; i < 14; i++) eDots.push({ p: -1, v: 0 });

/* 产物水滴 */
const drops = [];
for (let i = 0; i < 10; i++) {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), M.water);
  d.visible = false;
  scene.add(d);
  drops.push({ mesh: d, p: new THREE.Vector3(), v: new THREE.Vector3(), alive: false });
}

/* ================= 状态 ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let load = 0.6;
let fuel = true;
let waterCount = 0, h2Count = 0;
let tSim = 0, ghostT = 0;
let anodeFill = 1;        // 阳极气室「存料」0..1
const stI = document.getElementById('stI'), stB = document.getElementById('stB'),
  stW = document.getElementById('stW'), stH = document.getElementById('stH');

/* 阳极:H₂ 从罐到催化层;到达即裂 */
function stepAnode(dt) {
  anodeFill = clamp(anodeFill + (fuel ? 0.14 : -0.5) * dt * (0.4 + load), 0, 1);
  if (playing && fuel && anodeFill > 0.5 && Math.random() < dt * (1.2 + 7 * load)) {
    spawnMol('h2', rand(-2.4, -2.0), rand(0.5, 0.8), rand(-0.2, 0.2));
  }
  for (const m of mols) {
    if (!m.alive || m.t !== 'h2') continue;
    /* 上升 + 向催化层漂 */
    m.v.y += (0.55 - m.v.y) * dt * 1.6;
    m.v.x += ((m.p.x < -0.42 ? 0.5 : 0) - m.v.x) * dt * 2.2;
    m.v.z += Math.sin(tSim * 2 + m.wob) * 0.12 * dt;
    m.p.addScaledVector(m.v, dt);
    m.bond += dt * 2.4;
    m.p.y = Math.min(m.p.y, CY + CH / 2 - 0.18);
    if (m.p.x > -0.42) {           // 到达催化层
      killMol(m);
      h2Count++;
      flash(m.p);
      /* 2 H⁺ 进膜 + 2 e⁻ 上端子 */
      for (const dy of [-0.06, 0.06]) {
        const hp = spawnMol('hp', -0.16, m.p.y + dy, m.p.z);
        hp.v.set(rand(0.8, 1.3), rand(-0.1, 0.1), 0);
      }
      for (const e of eDots) if (e.p < 0) { e.p = 0; e.v = 0.55 + 0.5 * load; break; }
    }
  }
}
/* H⁺:穿膜 → 阴极催化剂 */
function stepProtons(dt) {
  for (const m of mols) {
    if (!m.alive || m.t !== 'hp') continue;
    m.v.x += Math.sin(tSim * 3 + m.wob) * 0.25 * dt;
    m.v.y += Math.cos(tSim * 2.3 + m.wob) * 0.2 * dt;
    m.p.addScaledVector(m.v, dt);
    if (m.p.x > 0.42) { killMol(m); flash(m.p); }
  }
}
/* 阴极:O₂ 供给 + 成水 */
function stepCathode(dt) {
  if (playing && Math.random() < dt * (0.8 + 4 * load)) {
    spawnMol('o2', rand(2.2, 2.6), rand(0.5, 0.8), rand(-0.2, 0.2));
  }
  for (const m of mols) {
    if (!m.alive || m.t !== 'o2') continue;
    m.v.y += (0.5 - m.v.y) * dt * 1.6;
    m.v.x += ((m.p.x > 0.42 ? -0.45 : 0) - m.v.x) * dt * 2.0;
    m.v.z += Math.cos(tSim * 1.7 + m.wob) * 0.12 * dt;
    m.p.addScaledVector(m.v, dt);
    m.bond += dt * 2.0;
    m.p.y = Math.min(m.p.y, CY + CH / 2 - 0.18);
    if (m.p.x < 0.42) killMol(m);       // 到达催化层待反应
  }
}
/* 成水与水滴 */
function stepWater(dt) {
  if (playing && fuel && anodeFill > 0.2 && load > 0.02 && Math.random() < dt * (0.4 + 5 * load)) {
    const w = spawnMol('h2o', rand(0.5, 0.9), rand(CY - 0.6, CY + 0.7), rand(-0.25, 0.25));
    w.v.set(rand(0.1, 0.3), 0, 0);
  }
  for (const m of mols) {
    if (!m.alive || m.t !== 'h2o') continue;
    m.v.y -= 1.4 * dt;
    m.p.addScaledVector(m.v, dt);
    m.bond += dt * 1.5;
    if (m.p.y < CY - CH / 2 + 0.14) {
      killMol(m);
      const d = drops.find(x => !x.alive);
      if (d) {
        d.alive = true;
        d.mesh.visible = true;
        d.p.set(rand(0.6, 1.0), CY - CH / 2 + 0.1, rand(-0.15, 0.15));
        d.v.set(rand(-0.06, 0.06), 0.4, 0);
      }
    }
  }
  for (const d of drops) {
    if (!d.alive) continue;
    d.v.y -= 2.2 * dt;
    d.p.addScaledVector(d.v, dt);
    if (d.p.y < 0.6) {                     // 落进集水瓶
      d.alive = false; d.mesh.visible = false;
      waterCount++;
      waterBody.scale.y = clamp(0.12 + waterCount * 0.02, 0.12, 1.6);
      waterBody.position.y = 0.12 + 0.15 * waterBody.scale.y;
      continue;
    }
    d.mesh.position.copy(d.p);
  }
}
/* 电子沿导线;到达阴极端子即闪光 */
function stepElectrons(dt) {
  for (const e of eDots) {
    if (e.p < 0) continue;
    e.p += e.v * dt;
    if (e.p > 1) { e.p = -1; flash(new THREE.Vector3(0.9, CY + CH / 2 + 0.55, 0)); }
  }
}
/* 「电子过不去」演示:一只蓝色小球冲向膜被弹回 */
let ghost = null;
function stepGhost(dt) {
  ghostT += dt;
  if (!ghost && ghostT > 7) {
    ghost = { p: new THREE.Vector3(-0.55, CY + 0.75, 0.25), v: new THREE.Vector3(0.9, 0, 0), t: 0 };
    ghostT = 0;
  }
  if (ghost) {
    ghost.t += dt;
    ghost.p.addScaledVector(ghost.v, dt);
    if (ghost.p.x > -0.16 && ghost.v.x > 0) {
      ghost.v.x = -0.8;
      flash(ghost.p);
      lblBlocked.element.style.opacity = 1;
      setTimeout(() => { lblBlocked.element.style.opacity = 0; }, 900);
    }
    if (ghost.t > 2.2) { ghost = null; }
  }
  if (ghost) { ghostMesh.position.copy(ghost.p); ghostMesh.visible = true; }
  else ghostMesh.visible = false;
}
const ghostMesh = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 8), M.ediag);
ghostMesh.visible = false;
scene.add(ghostMesh);
function flash(p) {
  flashMesh.position.copy(p);
  flashMesh.material.opacity = 0.95;
  flashMesh.visible = true;
  flashMesh.scale.setScalar(1);
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '阳极:催化剂裂氢', be: 'Anode: crack the H₂',
    d: 'H₂ 涌到阳极催化层,铂把它撕成 2 H⁺ + 2 e⁻——燃料被「拆件」。',
    de: 'H₂ flows to the anode catalyst; platinum tears it into 2 H⁺ + 2 e⁻ — the fuel is unpacked.',
    act: () => { fuel = true; document.getElementById('tglFuel').checked = true; load = 0.6; syncLoad(); } },
  { b: '电子被逼走外电路', be: 'Electrons forced outside',
    d: '质子交换膜是电子的绝缘墙——H⁺ 穿得过去,电子只能上端子走导线。离子走内电路、电子走外电路,和原电池/锂电池同构。',
    de: 'The membrane is an electronic insulator — H⁺ passes, electrons must go up the terminal and through the wire. Ions inside, electrons outside: same split as the galvanic cell and Li-ion.',
    act: () => { fuel = true; document.getElementById('tglFuel').checked = true; load = 0.6; syncLoad(); } },
  { b: '电子做功:灯亮', be: 'Electrons do work',
    d: '电子流过负载(灯)才到达阴极——电被「取用」了。拖大负载看亮度与流量变化。',
    de: 'Electrons reach the cathode only by passing through the load — that is the electricity you harvest. Drag the load slider and watch.',
    act: () => { fuel = true; document.getElementById('tglFuel').checked = true; load = 1.0; syncLoad(); } },
  { b: '阴极:合成水', be: 'Cathode: make water',
    d: 'O₂ + 4H⁺ + 4e⁻ → 2H₂O。三个流(H⁺、e⁻、O₂)在阴极催化层会师,水滴落进瓶里——唯一产物是水。',
    de: 'O₂ + 4H⁺ + 4e⁻ → 2H₂O. Three streams meet at the cathode; the only exhaust is water.',
    act: () => { fuel = true; document.getElementById('tglFuel').checked = true; load = 0.8; syncLoad(); } },
  { b: '断料实验:立刻熄火', be: 'Cut the fuel: it stalls',
    d: '关掉「供氢」——阳极存料耗尽,电子断流,灯灭、水停。电池把料存在电极里,燃料电池必须不停加料:这就是两者的本质区别。',
    de: 'Switch off the H₂ supply — the anode runs dry, current stops, lamp dies. A battery stores its fuel; a fuel cell must be fed. That is the whole difference.',
    act: () => { fuel = false; document.getElementById('tglFuel').checked = false; } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elLoad = document.getElementById('load');
const elLoadVal = document.getElementById('loadVal');
const tglFuel = document.getElementById('tglFuel');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncLoad() { elLoad.value = Math.round(load * 100); elLoadVal.textContent = Math.round(load * 100) + '%'; }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elLoad.addEventListener('input', () => { load = parseInt(elLoad.value, 10) / 100; elLoadVal.textContent = elLoad.value + '%'; });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
tglFuel.addEventListener('change', () => { fuel = tglFuel.checked; });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
  lblBlocked.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
if (!qsBool('fuel', true)) { tglFuel.checked = false; fuel = false; }
load = clamp(qsFloat('load', 0.6), 0, 1);
syncLoad();
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    tSim += dts;
    stepAnode(dts);
    stepProtons(dts);
    stepCathode(dts);
    stepWater(dts);
    stepElectrons(dts);
    stepGhost(dts);
  }
  /* 清理死亡分子(就地压缩) */
  for (let i = mols.length - 1; i >= 0; i--) if (!mols[i].alive) mols.splice(i, 1);
  renderMols();
  /* 电子位置 */
  eDots.forEach((e, i) => {
    const inst = i;
    if (e.p < 0) { m4tmp.makeScale(0.001, 0.001, 0.001); instE.setMatrixAt(inst, m4tmp); return; }
    const pt = wireCurve.getPoint(clamp(e.p, 0, 1));
    m4tmp.makeScale(1, 1, 1);
    m4tmp.setPosition(pt);
    instE.setMatrixAt(inst, m4tmp);
  });
  instE.instanceMatrix.needsUpdate = true;
  /* 闪光衰减 */
  if (flashMesh.visible) {
    flashMesh.material.opacity -= dt * 2.6;
    flashMesh.scale.multiplyScalar(1 + dt * 2.4);
    if (flashMesh.material.opacity <= 0) flashMesh.visible = false;
  }
  /* 灯亮度 */
  const active = fuel && anodeFill > 0.25 && load > 0.02;
  const brightTgt = active ? clamp(0.15 + 0.85 * load, 0, 1) * clamp(anodeFill * 2, 0, 1) : 0;
  const curBright = (M.lamp.emissiveIntensity - 0.05) / 1.8;
  const newBright = lerp(curBright, brightTgt, 1 - Math.exp(-dt * 3));
  M.lamp.emissiveIntensity = 0.05 + newBright * 1.8;
  M.lampGlow.opacity = newBright * 0.4;
  /* 状态与统计 */
  const current = active ? (0.2 + 0.8 * load) * anodeFill : 0;
  lblStatus.element.textContent =
    !fuel || anodeFill < 0.2 ? L('断料!阳极空了——电流归零', 'OUT OF FUEL! anode empty — current zero')
    : active ? L(`运行中 · I ≈ ${(current).toFixed(2)} A(示意)`, `running · I ≈ ${(current).toFixed(2)} A (arb.)`)
    : L('待机:负载为零', 'idle: no load');
  stI.innerHTML = current.toFixed(2) + '<small> A(示意)</small>';
  stB.innerHTML = Math.round(newBright * 100) + '<small> %</small>';
  stW.textContent = waterCount;
  stH.textContent = h2Count;
  /* 步骤高亮 */
  const si = (!fuel || anodeFill < 0.2) ? 4
    : h2Count === 0 ? 0
    : waterCount === 0 ? 1
    : load >= 0.95 ? 2 : 3;
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
lblBlocked.element.style.opacity = 0;
requestAnimationFrame(frame);
</script>
