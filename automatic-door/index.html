<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>自动门 · 先看见你,再决定怎么让你过</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="自动门 · 先看见你,再决定怎么让你过" data-en="The Automatic Door · it sees you first, then lets you through">自动门 · 先看见你,再决定怎么让你过</h1>
  <div class="sub" data-zh="天线发 10.5 GHz 微波迎着你:走近时反射波带上多普勒频移 Δf=2vf/c——它探测的是「移动」,站着不动它就不开门;频移超阈值电机带动吊轮开门,保持时间倒数后再关;光幕被挡当场反转 · 拖动旋转 / 空格运行/暂停" data-en="An antenna beams 10.5 GHz microwaves at you: approaching Doppler-shifts the echo by Δf=2vf/c — it senses motion, so stand still and it won't open; past the threshold a motor drives the hangers, a hold timer closes it, and the light curtain reverses the door if you're in the way · drag to orbit / Space = run/pause">天线发 10.5 GHz 微波迎着你:走近时反射波带上多普勒频移 Δf=2vf/c——它探测的是「移动」,站着不动它就不开门;频移超阈值电机带动吊轮开门,保持时间倒数后再关;光幕被挡当场反转 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="多普勒频移" data-en="Doppler Δf">多普勒频移</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="目标距离" data-en="Range">目标距离</span><span class="v" id="stD">—</span>
  <span class="k" data-zh="门速" data-en="Door speed">门速</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="门状态" data-en="State">门状态</span><span class="v" id="stS">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bWalk" data-zh="正常通过" data-en="Walk through">正常通过</button>
    <button class="abtn" id="bStill" data-zh="静止站立" data-en="Stand still">静止站立</button>
    <button class="abtn" id="bCurtain" data-zh="光幕反转" data-en="Light curtain">光幕反转</button>
  </div>
  <div class="row">
    <label data-zh="走近速度 m/s" data-en="Approach m/s">走近速度 m/s</label>
    <input id="sV" type="range" min="0" max="2" step="0.1" value="1">
    <span class="val" id="sVVal">1.0</span>
  </div>
  <div class="row">
    <label data-zh="保持时间 s" data-en="Hold time s">保持时间 s</label>
    <input id="sHold" type="range" min="1" max="8" step="0.5" value="3">
    <span class="val" id="sHoldVal">3.0</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglWave" type="checkbox" checked> <span data-zh="收发波形" data-en="TX/RX waves">收发波形</span></label>
      <label><input id="tglIR" type="checkbox"> <span data-zh="红外存在模式" data-en="IR presence mode">红外存在模式</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../doppler-effect/" data-zh="多普勒效应" data-en="Doppler effect">多普勒效应</a>
    <a href="../radar-speed/" data-zh="雷达测速" data-en="Speed radar">雷达测速</a>
    <a href="../optical-mouse/" data-zh="光学鼠标" data-en="Optical mouse">光学鼠标</a>
    <a href="../elevator/" data-zh="电梯与配重" data-en="Elevator">电梯与配重</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,85);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.5,3.8,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.7,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 店面:墙 + 门框 + 玻璃 + 双滑门 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const wallM=new THREE.MeshStandardMaterial({color:0x39414d,roughness:0.8});
const DW=1.35,DH=2.5;
function wallSeg(w,x){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,3.1,0.22),wallM);
  m.position.set(x,1.55,0);scene.add(m);return m;
}
wallSeg(3.4,-(DW+1.7));
wallSeg(3.4,(DW+1.7));
const lintel=new THREE.Mesh(new THREE.BoxGeometry(DW*2+0.3,0.6,0.22),wallM);
lintel.position.set(0,DH+0.3,0);scene.add(lintel);
/* 玻璃(墙两侧) */
const glassM=new THREE.MeshPhysicalMaterial({color:0xbcd8e8,transparent:true,opacity:0.16,roughness:0.05,side:THREE.DoubleSide});
for(const s of [-1,1]){
  const g=new THREE.Mesh(new THREE.BoxGeometry(3.3,2.5,0.04),glassM);
  g.position.set(s*3.08,1.25,0);scene.add(g);
}
/* 门框 */
const frameM=new THREE.MeshStandardMaterial({color:0x8a94a6,metalness:0.6,roughness:0.35});
for(const s of [-1,1]){
  const jamb=new THREE.Mesh(new THREE.BoxGeometry(0.12,DH+0.6,0.3),frameM);
  jamb.position.set(s*(DW+0.06),(DH+0.6)/2-0.05,0);scene.add(jamb);
}
const header=new THREE.Mesh(new THREE.BoxGeometry(DW*2+0.35,0.16,0.3),frameM);
header.position.set(0,DH+0.08,0);scene.add(header);
/* 滑门两扇(吊轮+导轨) */
const doorM=new THREE.MeshPhysicalMaterial({color:0xcfe4f2,transparent:true,opacity:0.4,roughness:0.05,side:THREE.DoubleSide});
const doorL=new THREE.Group(),doorR=new THREE.Group();
const panelL=new THREE.Mesh(new THREE.BoxGeometry(DW,DH,0.05),doorM);
panelL.position.y=DH/2;doorL.add(panelL);
const panelR=panelL.clone();doorR.add(panelR);
for(const g of [doorL,doorR]){
  for(const hx of [-DW/2+0.15,DW/2-0.15]){
    const hanger=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.16,10),frameM);
    hanger.position.set(hx,DH+0.05,0.02);g.add(hanger);
  }
}
scene.add(doorL);scene.add(doorR);
/* 传感器盒 */
const sensor=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.12,0.18),
  new THREE.MeshStandardMaterial({color:0x22262e,roughness:0.4}));
sensor.position.set(0,DH+0.24,0.14);scene.add(sensor);
const ledM=new THREE.MeshBasicMaterial({color:0x51cf66});
const led=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,8),ledM);
led.position.set(0.16,DH+0.24,0.24);scene.add(led);
/* 微波锥(可视化探测区) */
const beamM=new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.06,side:THREE.DoubleSide});
const beam=new THREE.Mesh(new THREE.ConeGeometry(1.5,3.4,20,1,true),beamM);
beam.rotation.x=Math.PI/2;beam.position.set(0,DH-0.4,1.8);scene.add(beam);
/* 光幕(关门时显示的红扇面) */
const curtainM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.0,side:THREE.DoubleSide});
const curtain=new THREE.Mesh(new THREE.PlaneGeometry(DW*2,0.5),curtainM);
curtain.position.set(0,0.3,0.15);scene.add(curtain);

/* ---- 行人 ---- */
const personG=new THREE.Group();scene.add(personG);
const bodyM=new THREE.MeshStandardMaterial({color:0x4c6ef5,roughness:0.6});
const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,0.55,6,12),bodyM);
body.position.y=1.0;personG.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.13,12,10),
  new THREE.MeshStandardMaterial({color:0xe8b48f,roughness:0.7}));
head.position.y=1.52;personG.add(head);
const legL=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.05,0.55,8),bodyM);
legL.position.set(-0.09,0.28,0);personG.add(legL);
const legR=legL.clone();legR.position.x=0.09;personG.add(legR);
personG.position.set(0,0,6);

/* ---- 收发波形板 ---- */
const waveG=new THREE.Group();waveG.position.set(-3.6,4.0,-1.8);waveG.rotation.y=0.5;scene.add(waveG);
const wBoard=new THREE.Mesh(new THREE.BoxGeometry(4.4,2.2,0.06),
  new THREE.MeshStandardMaterial({color:0x070b10,roughness:0.75,transparent:true,opacity:0.92}));
waveG.add(wBoard);
const txLine=new THREE.Line(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({color:0xffd43b,transparent:true,opacity:0.8}));
const rxLine=new THREE.Line(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({color:0xff8787}));
txLine.position.z=0.06;rxLine.position.z=0.07;waveG.add(txLine);waveG.add(rxLine);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let walkV=1.0,holdT=3.0;
const F0=10.5e9,C=3e8;
let persZ=6,doorOpen=0,doorTarget=0,doorV=0;
let state='close';   // close→open→hold→close …
let holdCnt=0;
let reversed=false,reverseFlash=0;
const OPEN_TH=15;    // Hz
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('微波传感器:探测的是「移动」','Microwave sensor: it detects motion, not presence'),new THREE.Vector3(0,DH+0.75,0),'y');
addLabel(()=>L('吊轮+同步带:电机拉门','Hangers + belt: the motor pulls'),new THREE.Vector3(-1.2,DH+0.35,0),'b');
addLabel(()=>L(`Δf = 2vf/c = ${dopplerHz().toFixed(0)} Hz`,`Δf = 2vf/c = ${dopplerHz().toFixed(0)} Hz`),new THREE.Vector3(0,2.0,2.6),'o');
addLabel(()=>L('光幕:被挡当场反转','Light curtain: blocked means reverse'),new THREE.Vector3(1.5,0.6,0.2),'r',()=>closing||reversed);

function dopplerHz(){return 2*walkV*F0/C;}   // 1 m/s → 70 Hz
function setV(v){walkV=v;document.getElementById('sV').value=v;
  document.getElementById('sVVal').textContent=v.toFixed(1);}
function setHold(v){holdT=v;document.getElementById('sHold').value=v;
  document.getElementById('sHoldVal').textContent=v.toFixed(1);}
function irMode(){return document.getElementById('tglIR').checked;}
/* 行人自主循环:走近→过门→绕回 */
function personAI(dt){
  const moving=walkV>0.02;
  if(reversed){
    persZ+=dt*0.8;
    if(persZ>3.2)reversed=false;
    return;
  }
  if(state==='hold'||state==='open'){
    /* 通过门 */
    if(persZ>0.4)persZ-=dt*walkV;
    else persZ-=dt*walkV*0.6;
    if(persZ<-2.6){persZ=6;}
  }else{
    if(persZ>2.6)persZ-=dt*walkV;
    else if(moving)persZ-=dt*0.15;
  }
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'天线发 10.5 GHz 微波,锥形照亮门口',en:'The antenna beams 10.5 GHz microwaves over the approach',
  act(){setV(0);setHold(3);document.getElementById('bWalk').classList.add('on');document.getElementById('bStill').classList.remove('on');document.getElementById('bCurtain').classList.remove('on');}},
 {zh:'你走近:反射波带上多普勒频移 Δf=2vf/c',en:'You approach: the echo Doppler-shifts by Δf=2vf/c',
  act(){setV(1.0);}},
 {zh:'频移超 15 Hz →「有人移动」→ 开门',en:'Past 15 Hz: motion confirmed — the door opens',
  act(){setV(1.0);persZ=4.5;}},
 {zh:'电机带同步带,吊轮把两扇门拉开',en:'Motor and belt: the hangers slide both panels open',
  act(){setV(1.0);}},
 {zh:'保持时间倒数:没人继续靠近就关',en:'Hold countdown: no further approach, it closes',
  act(){setV(0.4);}},
 {zh:'静止站不住门:多普勒=0 它不理你;红外模式才认',en:'Stand still, no door: Δf=0 — only an IR presence sensor cares',
  act(){setV(0);persZ=2.2;document.getElementById('bStill').classList.add('on');document.getElementById('bWalk').classList.remove('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const f=document.getElementById('stF');
  const hz=dopplerHz();
  f.innerHTML=hz.toFixed(0)+'<small> Hz</small>';
  f.className='v'+(hz>OPEN_TH?' ok':'');
  document.getElementById('stD').innerHTML=Math.abs(persZ).toFixed(1)+'<small> m</small>';
  document.getElementById('stV').innerHTML=(doorV*1.4).toFixed(2)+'<small> m/s</small>';
  const s=document.getElementById('stS');
  s.textContent=state==='open'?L('开','open'):state==='hold'?L('保持','hold'):state==='reverse'?L('反转','reverse'):L('关','closed');
  s.className='v '+(state==='reverse'?'warn':'ok');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bWalk').addEventListener('click',()=>{
  setV(1.0);persZ=6;
  document.getElementById('bWalk').classList.add('on');
  document.getElementById('bStill').classList.remove('on');
  document.getElementById('bCurtain').classList.remove('on');
});
document.getElementById('bStill').addEventListener('click',()=>{
  setV(0);persZ=2.2;
  document.getElementById('bStill').classList.add('on');
  document.getElementById('bWalk').classList.remove('on');
});
document.getElementById('bCurtain').addEventListener('click',()=>{
  setV(0.8);persZ=0.6;holdCnt=0.1;
  document.getElementById('bCurtain').classList.add('on');
  document.getElementById('bWalk').classList.remove('on');
  document.getElementById('bStill').classList.remove('on');
});
document.getElementById('sV').addEventListener('input',e=>setV(+e.target.value));
document.getElementById('sHold').addEventListener('input',e=>setHold(+e.target.value));
document.getElementById('tglWave').addEventListener('change',e=>{waveG.visible=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
let closing=false;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0);
  simT+=dts;
  /* 逻辑:探测 → 开 → 保持 → 关(光幕反转) */
  const hz=dopplerHz();
  const sees=irMode()?Math.abs(persZ)<3.2:hz>OPEN_TH&&persZ<3.4&&persZ>0.3;
  const inCurtain=Math.abs(persZ)<0.5;
  if(state==='close'){
    if(sees){state='open';}
    doorTarget=0;
  }else if(state==='open'){
    doorTarget=1;
    if(doorOpen>0.95){state='hold';holdCnt=holdT;}
  }else if(state==='hold'){
    doorTarget=1;
    holdCnt-=dts;
    if(!sees&&holdCnt<=0&&!inCurtain)state='shut';
    else if(holdCnt<=0&&inCurtain&&!irMode()){state='reverse';}
  }else if(state==='shut'){
    doorTarget=0;
    closing=true;
    if(inCurtain){state='reverse';}
    else if(doorOpen<0.02){state='close';closing=false;}
  }else if(state==='reverse'){
    doorTarget=1;reversed=true;reverseFlash=1;
    if(persZ>1.2){state='hold';holdCnt=holdT;reversed=false;}
  }
  /* 门运动学 */
  const prev=doorOpen;
  doorOpen+=(doorTarget-doorOpen)*Math.min(1,dts*3);
  doorV=Math.abs(doorOpen-prev)/Math.max(dt,1e-4)*0.5;
  doorL.position.x=-DW*doorOpen;
  doorR.position.x=DW*doorOpen;
  /* 行人 */
  personAI(dts);
  personG.position.z=persZ;
  personG.position.y=Math.abs(Math.sin(simT*7))*0.03*walkV;
  legL.rotation.x=Math.sin(simT*7)*0.5*walkV;
  legR.rotation.x=-Math.sin(simT*7)*0.5*walkV;
  /* 传感器灯 */
  const detected=irMode()?Math.abs(persZ)<3.2:hz>OPEN_TH;
  ledM.color.setHex(detected?0x51cf66:0xff6b6b);
  /* 光幕 */
  curtainM.opacity=closing?0.25+0.15*Math.sin(simT*10):(state==='reverse'?0.4:0);
  /* 波形:发射 10.5 GHz(降采样示意)与接收(带 Δf 频移) */
  if(waveG.visible){
    const NP=140,tx=[],rx=[];
    const fT=6,fR=6+hz/OPEN_TH*2.5;
    for(let i=0;i<NP;i++){
      const x=-2.0+i/(NP-1)*4.0;
      tx.push(new THREE.Vector3(x,Math.sin((x+simT*2)*fT*Math.PI)*0.5,0.06));
      rx.push(new THREE.Vector3(x,Math.sin((x+simT*2.2)*fR*Math.PI)*0.5*(Math.abs(persZ)<3.4?1:0.25),0.07));
    }
    txLine.geometry.setFromPoints(tx);
    rxLine.geometry.setFromPoints(rx);
  }
  reverseFlash=Math.max(0,reverseFlash-dt*2);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setV(1.0);setHold(3);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
