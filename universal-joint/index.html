<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万向节 · 单节有节奏,双节治百病</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa8a8;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e03131;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.in { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.out { border-color: rgba(255,168,168,.9); color: #ffc9c9; }
  .lbl.mid { border-color: rgba(255,224,102,.9); color: #ffe9a8; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.in { border-color: rgba(25,113,194,.9); color: #1971c2; }
  :root[data-theme="light"] .lbl.out { border-color: rgba(224,49,49,.9); color: #e03131; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 14px 12px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 16px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.i { color: #74c0fc; }
  #stats .v.o { color: #ffa8a8; }
  #chart { grid-column: 1 / 3; margin-top: 6px; }
  #chart canvas { display: block; border-radius: 8px; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: var(--acc); background: rgba(255,168,168,.12); color: var(--text); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,168,168,.10); border-color: rgba(255,168,168,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(224,49,49,.08); border-color: rgba(224,49,49,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffc9c9; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="万向节：单节有节奏，双节治百病" data-en="Universal Joints: one wobbles, two cure">万向节：单节有节奏，双节治百病</h1>
  <div class="sub" data-zh="十字万向节让轴拐弯,但单节的从动轴速度按 1/cos²θ 波动——拐角越大顿挫越狠;再加一节按 Z 字同相位,波动互相抵消 · 空格播放/暂停" data-en="A Cardan joint bends the shaft, but the output speed pulses; add a second joint in a Z-arrangement and the pulses cancel · Space = play/pause">十字万向节让轴拐弯,但单节的从动轴速度按 1/cos²θ 波动——拐角越大顿挫越狠;再加一节按 Z 字同相位,波动互相抵消 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="输入速度 ω₁" data-en="input ω₁">输入速度 ω₁</span><span class="v i" id="stI">—</span>
  <span class="k" data-zh="单节输出 ω₂" data-en="single-joint ω₂">单节输出 ω₂</span><span class="v o" id="stO">—</span>
  <span class="k" data-zh="波动幅度" data-en="ripple">波动幅度</span><span class="v o" id="stA">—</span>
  <div id="chart"><canvas id="cvChart" width="300" height="110"></canvas></div>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnDouble" data-zh="加第二万向节(Z 字同相位)" data-en="add a second joint (Z-phased)">加第二万向节(Z 字同相位)</button>
  </div>
  <div class="row"><label data-zh="拐角 α" data-en="angle α">拐角 α</label><input id="ang" type="range" min="0" max="40" step="1" value="28"><span class="val" id="angVal">28°</span></div>
  <div class="row"><label data-zh="输入速度" data-en="input speed">输入速度</label><input id="spd" type="range" min="20" max="100" step="5" value="60"><span class="val" id="spdVal">0.60×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../differential/" data-zh="下游:差速器就在拐弯尽头" data-en="downstream: the differential">下游:差速器就在拐弯尽头</a>
    <a href="../planetary-gears/" data-zh="上游:行星轮系(自动变速箱)" data-en="upstream: planetary gears">上游:行星轮系(自动变速箱)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('万向节 · 单节有节奏双节治百病', 'Universal Joints · one wobbles, two cure');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 5.0, 10.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.6, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 26;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  frame: mat(0x39424f, { roughness: 0.7 }),
  shaftIn: mat(0x74c0fc, { metalness: 0.55, roughness: 0.3 }),
  shaftOut: mat(0xff8787, { metalness: 0.55, roughness: 0.3 }),
  shaftMid: mat(0xffe066, { metalness: 0.55, roughness: 0.3 }),
  cross: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  bearing: mat(0x1b212c, { roughness: 0.8 }),
};

/* ================= 几何工具 ================= */
function makeYoke(material) {
  const g = new THREE.Group();
  for (const s of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.36, 10), material);
    arm.position.set(0, s * 0.18, 0);
    g.add(arm);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.16, 16), material);
  hub.rotation.z = Math.PI / 2;
  g.add(hub);
  return g;
}
function makeCross(size = 0.2) {
  const g = new THREE.Group();
  const a = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, size * 2, 10), M.cross);
  g.add(a);
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, size * 2, 10), M.cross);
  b.rotation.z = Math.PI / 2;
  g.add(b);
  const c = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), M.cross);
  g.add(c);
  return g;
}
function makeShaft(len, material, radial = 0.075) {
  const g = new THREE.Group();
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radial, radial, len, 18), material);
  cyl.rotation.z = Math.PI / 2;
  g.add(cyl);
  const mark = new THREE.Mesh(new THREE.BoxGeometry(0.06, radial * 2.5, radial * 2.5), M.frame);
  mark.position.x = len / 2 - 0.2;
  g.add(mark);
  return g;
}

/* ================= 布局 =================
   输入轴(水平,左) → 节1(x=0) → [单节] 输出轴(倾 α)
                            → [双节] 中间轴(倾 α) → 节2 → 输出轴(水平,Z 字) */
const H = 1.4, L_IN = 2.4, L_SEG = 1.9;
let doubleMode = false;

const shaftIn = makeShaft(L_IN, M.shaftIn);
shaftIn.position.set(-L_IN / 2 - 0.2, H, 0);
scene.add(shaftIn);
const bearingIn = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), M.bearing);
bearingIn.position.set(-L_IN - 0.2, H, 0);
scene.add(bearingIn);

/* 节1:原点。yoke1In 随输入转(叉面竖直);yoke1Out 在倾斜枢轴内随 θ2 转 */
const joint1 = new THREE.Group();
joint1.position.set(0, H, 0);
scene.add(joint1);
const yoke1In = makeYoke(M.shaftIn);
joint1.add(yoke1In);
const pivot1Out = new THREE.Group();     // 倾斜 α
pivot1Out.rotation.z = 0;                // 每帧更新
joint1.add(pivot1Out);
const yoke1Out = makeYoke(M.shaftOut);
pivot1Out.add(yoke1Out);
const cross1 = makeCross(0.2);
joint1.add(cross1);

/* 单节输出轴 */
const pivotOut = new THREE.Group();      // 倾斜 α
scene.add(pivotOut);
const shaftOut = makeShaft(L_SEG, M.shaftOut);
pivotOut.add(shaftOut);
const bearingOut = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), M.bearing);
scene.add(bearingOut);

/* 双节:中间轴(倾 α) → 节2 → 输出轴(水平) */
const pivotMid = new THREE.Group();      // 倾斜 α,起点在节2? 反向:从节1 伸向节2
scene.add(pivotMid);
const shaftMid = makeShaft(L_SEG, M.shaftMid);
pivotMid.add(shaftMid);
const joint2 = new THREE.Group();        // 位于中间轴末端
scene.add(joint2);
const yoke2Mid = makeYoke(M.shaftMid);
joint2.add(yoke2Mid);
const yoke2Out = makeYoke(M.shaftOut);
joint2.add(yoke2Out);
const cross2 = makeCross(0.2);
joint2.add(cross2);
const shaftOut2 = makeShaft(L_SEG, M.shaftOut);
scene.add(shaftOut2);
const bearingOut2 = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), M.bearing);
scene.add(bearingOut2);

const floor = new THREE.Mesh(new THREE.BoxGeometry(13, 0.18, 3.4), M.floor);
floor.position.set(1.2, -0.09, 0);
scene.add(floor);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let alpha = 28 * Math.PI / 180;
let inSpeed = 0.6;
let thetaIn = 0;
const theta2of = (th1, a) => Math.atan(Math.tan(th1) * Math.cos(a));
function omega2(th1, a, w1) {
  const s2 = Math.sin(a) ** 2;
  return w1 * Math.cos(a) / (1 - s2 * Math.cos(th1) ** 2);
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblIn = addLabel(() => L('输入轴:匀速', 'input: constant ω'), new THREE.Vector3(-L_IN / 2 - 0.2, H + 0.55, 0), 'in');
const lblJ1 = addLabel(() => L('十字节 1', 'cardan 1'), new THREE.Vector3(0, H + 0.62, 0), 'mid', joint1);
const lblJ2 = addLabel(() => L('十字节 2(同相位)', 'cardan 2 (in phase)'), new THREE.Vector3(0, H + 0.62, 0), 'mid', joint2);
const lblOut = addLabel(() => doubleMode ? L('输出轴:恢复匀速', 'output: smooth again') : L('输出轴:速度在波动!', 'output: speed pulsates!'),
  new THREE.Vector3(0, H + 0.55, 0), 'out');
const lblStatus = addLabel(() => doubleMode
  ? L('双节 Z 字同相位:两处波动互相抵消 → 输出恢复匀速', 'Z-phased double joint: the two ripples cancel → smooth again')
  : L('单节:每转两顿,拐角越大顿得越狠', 'single joint: two jerks per turn, worse with angle'),
  new THREE.Vector3(1.5, 3.7, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '让轴拐个弯', be: 'Bend the driveline',
    d: '十字万向节:两只叉子互相垂直,咬着同一枚十字——两轴夹角多大都能传扭矩。',
    de: 'Two yokes at right angles share one cross — torque passes at any bend angle.',
    act: () => { doubleMode = false; syncDouble(); } },
  { b: '单节的隐疾:速度波动', be: 'The flaw: speed ripple',
    d: '盯住输出轴的标记块:输入匀速,输出却时快时慢——ω₂ = ω₁·cosα/(1−sin²α·cos²θ),每转波动两次。',
    de: 'Watch the output mark: constant in, pulsing out — two surges per revolution.',
    act: () => { doubleMode = false; syncDouble(); } },
  { b: '拐角越大越颠', be: 'Bigger angle, harsher jerk',
    d: '拐角 α 拉到 40°:波动接近 ±25%——这就是传动轴的「嗡嗡顿挫」,也是说明书警告别乱改吊挂角度的原因。',
    de: 'At α = 40° the ripple nears ±25% — the driveline shudder behind those "don’t modify" warnings.',
    act: () => { doubleMode = false; syncDouble(); elAng.value = 40; alpha = 40 * Math.PI / 180; elAngVal.textContent = '40°'; } },
  { b: '双节 Z 字:波动抵消', be: 'Double joint: the cure',
    d: '加一节,中间轴两端叉子同相位(Z 字):第一节制造的反相波动被第二节原样收回——输出重新匀速,代价是多一段轴。',
    de: 'A second joint with mid-shaft yokes in phase: the second ripple cancels the first — smooth output for one extra shaft.',
    act: () => { doubleMode = true; syncDouble(); } },
  { b: '后驱车的底盘', be: 'Under a rear-drive car',
    d: '变速箱出来一枚、差速器进去一枚,传动轴天天在 Z 字里工作;前驱车驱动轴用的是球笼等速节,那是另一个故事。',
    de: 'One joint at the gearbox, one at the differential — a driveshaft lives in the Z all day; CV joints are the front-drive sequel.',
    act: () => { doubleMode = true; syncDouble(); } },
];
function stepIndex() {
  if (doubleMode) return 3;
  if (alpha > 0.6) return 2;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}
function syncDouble() {
  document.getElementById('btnDouble').classList.toggle('on', doubleMode);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elAng = document.getElementById('ang');
const elAngVal = document.getElementById('angVal');
const btnDouble = document.getElementById('btnDouble');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stI = document.getElementById('stI'), stO = document.getElementById('stO'),
  stA = document.getElementById('stA');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnDouble.addEventListener('click', () => { doubleMode = !doubleMode; syncDouble(); });
elAng.addEventListener('input', () => { alpha = parseInt(elAng.value, 10) * Math.PI / 180; elAngVal.textContent = elAng.value + '°'; });
elSpd.addEventListener('input', () => { inSpeed = parseInt(elSpd.value, 10) / 100; elSpdVal.textContent = inSpeed.toFixed(2) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* 波形图 */
const chart = document.getElementById('cvChart').getContext('2d');
function drawChart() {
  const W = 300, Hc = 110;
  chart.clearRect(0, 0, W, Hc);
  const pill = getComputedStyle(htmlEl).getPropertyValue('--cv-pill').trim() || 'rgba(13,17,24,.8)';
  chart.fillStyle = pill;
  chart.beginPath(); chart.roundRect(0, 0, W, Hc, 8); chart.fill();
  const mid = Hc / 2;
  chart.strokeStyle = 'rgba(128,140,155,.3)';
  chart.beginPath(); chart.moveTo(0, mid); chart.lineTo(W, mid); chart.stroke();
  const s2 = Math.sin(alpha) ** 2;
  chart.strokeStyle = '#ffa8a8';
  chart.lineWidth = 1.8;
  chart.beginPath();
  for (let x = 0; x <= W; x++) {
    const th = x / W * Math.PI * 4;
    const w = Math.cos(alpha) / (1 - s2 * Math.cos(th) ** 2);
    const y = mid - (w - 1) * 90;
    x ? chart.lineTo(x, y) : chart.moveTo(x, y);
  }
  chart.stroke();
  chart.strokeStyle = '#74c0fc';
  chart.setLineDash([4, 4]);
  chart.beginPath(); chart.moveTo(0, mid); chart.lineTo(W, mid); chart.stroke();
  chart.setLineDash([]);
  chart.fillStyle = 'rgba(199,210,222,.9)';
  chart.font = '10px system-ui';
  chart.fillText(L('单节输出 ω₂/ω₁', 'single-joint ω₂/ω₁'), 8, 14);
  chart.fillText(L('虚线 = 匀速输入', 'dashed = constant input'), 8, Hc - 8);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) thetaIn += inSpeed * dts;
  const th2 = theta2of(thetaIn, alpha);       // 节1 输出转角(波动)
  const w2 = omega2(thetaIn, alpha, inSpeed);
  const cA = Math.cos(alpha), sA = Math.sin(alpha);
  lblOut.position.set(doubleMode ? cA * L_SEG + L_SEG / 2 : cA * L_SEG / 2, H - sA * L_SEG + 0.55, 0);

  /* 输入 */
  shaftIn.rotation.x = -thetaIn;
  yoke1In.rotation.x = -thetaIn;

  /* 节1 输出叉:随 θ2 在倾斜枢轴内转 */
  pivot1Out.rotation.z = -alpha;
  yoke1Out.rotation.x = -th2;
  cross1.rotation.x = -th2 * 0.5;

  if (!doubleMode) {
    /* 单节:输出轴沿 α 倾斜,转 θ2 */
    pivotOut.rotation.z = -alpha;
    pivotOut.position.set(0, H, 0);
    shaftOut.rotation.x = -th2;
    bearingOut.position.set(cA * L_SEG, H - sA * L_SEG, 0);
  }
  /* 双节:中间轴(倾 α,转 θ2)→ 节2 → 输出轴(水平,转 θ1) */
  joint2.visible = doubleMode;
  pivotMid.visible = doubleMode;
  shaftOut2.visible = doubleMode;
  bearingOut2.visible = doubleMode;
  pivotOut.visible = !doubleMode;
  bearingOut.visible = !doubleMode;
  shaftOut.visible = !doubleMode;
  if (doubleMode) {
    pivotMid.rotation.z = -alpha;
    pivotMid.position.set(0, H, 0);
    shaftMid.rotation.x = -th2;
    joint2.position.set(cA * L_SEG, H - sA * L_SEG, 0);
    yoke2Mid.rotation.x = -th2;
    yoke2Out.rotation.x = -thetaIn;          // 同相位 → 输出恢复匀速
    shaftOut2.rotation.x = -thetaIn;
    shaftOut2.position.set(cA * L_SEG + L_SEG / 2, H - sA * L_SEG, 0);
    bearingOut2.position.set(cA * L_SEG + L_SEG, H - sA * L_SEG, 0);
  }

  drawChart();

  stI.innerHTML = (inSpeed * 60).toFixed(0) + '<small> rpm</small>';
  stO.innerHTML = doubleMode ? (inSpeed * 60).toFixed(0) + '<small> rpm ✓</small>' : (w2 * 60).toFixed(0) + '<small> rpm</small>';
  const ripple = alpha > 0.001 ? Math.abs(1 / Math.cos(alpha) - Math.cos(alpha)) / 2 : 0;
  stA.innerHTML = doubleMode ? '≈ 0<small> %</small>' : (ripple * 100).toFixed(1) + '<small> %</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

syncDouble();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
