<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>肝脏解毒与胆汁 · 先过肝,再进血</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d94f43;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#a83a2e;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,79,67,.6);background:rgba(217,79,67,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(168,58,46,.55);background:rgba(168,58,46,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,79,67,.10);border-color:rgba(217,79,67,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(168,58,46,.08);border-color:rgba(168,58,46,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffd9d4}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="肝脏解毒与胆汁" data-en="Liver Detox &amp; Bile">肝脏解毒与胆汁</h1>
  <div class="sub" data-zh="肠道吸收的一切先经门静脉押运入肝(首过效应);相 I 滑面内质网的 CYP450 加氧改造、引入极性基团——但产物未必更安全,乙醇反而变成更毒的乙醛;相 II 胞质酶缀上葡萄糖醛酸/硫酸/谷胱甘肽,水溶性大增、毒性大降;相 III 外排泵把产物打进胆小管,随胆汁入肠或入血由肾排;胆汁里的胆盐是两亲分子,入肠把脂肪包成胶束帮消化,再经肠肝循环回收 · 拖动旋转 / 空格运行/暂停" data-en="Everything the gut absorbs is first shipped to the liver by the portal vein (first pass); Phase I CYP450 on the smooth ER adds oxygen and exposes polar groups — yet products are not always safer: ethanol becomes the more toxic acetaldehyde; Phase II cytosolic enzymes bolt on glucuronide/sulfate/glutathione — water solubility jumps, toxicity drops; Phase III efflux pumps push products into canaliculi, out with bile or via blood to the kidneys; bile salts are amphipathic — in the gut they wrap fat into micelles for digestion, then get recycled enterohepatically · drag to orbit / Space = run/pause">肠道吸收的一切先经门静脉押运入肝(首过效应);相 I 滑面内质网的 CYP450 加氧改造、引入极性基团——但产物未必更安全,乙醇反而变成更毒的乙醛;相 II 胞质酶缀上葡萄糖醛酸/硫酸/谷胱甘肽,水溶性大增、毒性大降;相 III 外排泵把产物打进胆小管,随胆汁入肠或入血由肾排;胆汁里的胆盐是两亲分子,入肠把脂肪包成胶束帮消化,再经肠肝循环回收 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="毒素处理率" data-en="Clearance">毒素处理率</span><span class="v" id="stRate">—</span>
  <span class="k" data-zh="血中毒素" data-en="Blood toxin">血中毒素</span><span class="v" id="stBlood">—</span>
  <span class="k" data-zh="胆汁流量" data-en="Bile flow">胆汁流量</span><span class="v" id="stBile">—</span>
  <span class="k" data-zh="乙醛堆积" data-en="Acetaldehyde">乙醛堆积</span><span class="v" id="stAald">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bNormal" data-zh="正常" data-en="Normal">正常</button>
    <button class="abtn" id="bDrink" data-zh="饮酒" data-en="Drinking">饮酒</button>
    <button class="abtn" id="bDrug" data-zh="药物竞争" data-en="Drug clash">药物竞争</button>
  </div>
  <div class="row">
    <label data-zh="血流速度" data-en="Blood flow">血流速度</label>
    <input id="sFlow" type="range" min="0.2" max="2" step="0.05" value="1">
    <span class="val" id="sFlowVal">×1.00</span>
  </div>
  <div class="row">
    <label data-zh="CYP450 活性" data-en="CYP450 activity">CYP450 活性</label>
    <input id="sCyp" type="range" min="40" max="150" step="5" value="100">
    <span class="val" id="sCypVal">100 %</span>
  </div>
  <div class="row">
    <label data-zh="缀合酶活性" data-en="Conjugation">缀合酶活性</label>
    <input id="sConj" type="range" min="30" max="150" step="5" value="100">
    <span class="val" id="sConjVal">100 %</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglZones" type="checkbox"> <span data-zh="相 I·II·III 分区" data-en="Phase zones">相 I·II·III 分区</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../digestion/" data-zh="消化道" data-en="Digestion">消化道</a>
    <a href="../nephron/" data-zh="肾元与尿液" data-en="Nephron">肾元与尿液</a>
    <a href="../enzyme-induced-fit/" data-zh="酶的诱导契合" data-en="Induced Fit">酶的诱导契合</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x14100f,22,54);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,200);
camera.position.set(1.5,8.0,20.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.9,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1412,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:肝小叶切片 —— 血窦左→右,肝细胞列,胆小管→胆管→肠腔 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1d1a18,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(17,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const tissueM=new THREE.MeshStandardMaterial({color:0x8a4038,transparent:true,opacity:0.10,
  roughness:0.9,depthWrite:false});
const tissue=new THREE.Mesh(new THREE.BoxGeometry(14.8,3.4,5.2),tissueM);
tissue.position.set(0,3.15,0);scene.add(tissue);
/* 血窦:血流通道 */
const sinCurve=new THREE.CatmullRomCurve3([
  [-9.8,4.35,0],[-7,4.5,0.2],[-4,4.28,-0.18],[-1,4.42,0.16],
  [2,4.26,-0.14],[5,4.46,0.1],[7.6,4.3,-0.06],[9.8,4.32,0]
].map(p=>new THREE.Vector3(...p)));
const sinM=new THREE.MeshStandardMaterial({color:0x93362c,transparent:true,opacity:0.28,
  roughness:0.4,depthWrite:false});
scene.add(new THREE.Mesh(new THREE.TubeGeometry(sinCurve,64,0.36,12,false),sinM));
/* 中央静脉(右侧竖管)与门静脉入口(左下) */
const veinM=new THREE.MeshStandardMaterial({color:0x4a6a9a,transparent:true,opacity:0.32,
  roughness:0.4,depthWrite:false});
const cvein=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,2.8,16),veinM);
cvein.position.set(10.2,3.4,0);scene.add(cvein);
const portalCurve=new THREE.CatmullRomCurve3(
  [[-9.8,4.35,0],[-11,3.4,0.3],[-11.6,2.4,0.5]].map(p=>new THREE.Vector3(...p)));
scene.add(new THREE.Mesh(new THREE.TubeGeometry(portalCurve,16,0.3,10,false),veinM));
/* 肝细胞列:每格一个"分子车间",处理时发亮 */
const cellMats=[],cells=[];
for(let i=0;i<6;i++){
  const x=-5+i*2;
  const mat=new THREE.MeshStandardMaterial({color:0xc98a80,roughness:0.55,transparent:true,
    opacity:0.92,emissive:0xd94f43,emissiveIntensity:0});
  const c=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.7,1.3),mat);
  c.position.set(x,2.95,0);scene.add(c);
  const nucM=new THREE.MeshStandardMaterial({color:0x7a4058,roughness:0.5});
  const n=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,10),nucM);
  n.position.set(x,3.5,0);scene.add(n);
  cellMats.push(mat);cells.push({x,u:(x+9.8)/19.6,cu:clamp((x+6)/12.6,0,1)*0.62,busy:null,heat:0});
}
/* 胆小管 → 胆管 */
const canaCurve=new THREE.CatmullRomCurve3([
  [-6,2.02,0.85],[0,2.02,0.85],[5.4,2.02,0.85],[6.7,1.78,0.95],
  [7.7,1.2,1.05],[8.5,0.98,1.1],[9.0,0.9,1.1]
].map(p=>new THREE.Vector3(...p)));
const bileM=new THREE.MeshStandardMaterial({color:0x3f7d4f,transparent:true,opacity:0.5,
  roughness:0.5,depthWrite:false});
scene.add(new THREE.Mesh(new THREE.TubeGeometry(canaCurve,48,0.13,10,false),bileM));
/* 肠腔(右下半管) */
const gutM=new THREE.MeshStandardMaterial({color:0xa8823a,transparent:true,opacity:0.16,
  roughness:0.6,depthWrite:false,side:THREE.DoubleSide});
const gut=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,3.6,20,1,true,0,Math.PI*1.3),gutM);
gut.rotation.z=Math.PI/2;gut.rotation.y=0.5;gut.position.set(9.6,0.8,1.1);scene.add(gut);
/* 相 I/II/III 分区框 */
const zoneData=[[0,3.72,0xff9a4a,11,0.72,2.0],[0,2.95,0x54d06a,11,0.68,2.0],[0,2.1,0x54a8f0,11,0.6,2.6]];
const zones=[];
for(const [x,y,col,w,h,d] of zoneData){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.07,depthWrite:false})));
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),
    new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.4})));
  g.position.set(x,y,0);g.visible=false;scene.add(g);zones.push(g);
}
/* 血流粒子(红细胞) */
const rbcGeo=new THREE.SphereGeometry(0.15,10,8);
const rbcM=new THREE.MeshStandardMaterial({color:0xb23232,roughness:0.5});
const rbcs=[];
for(let i=0;i<12;i++){
  const m=new THREE.Mesh(rbcGeo,rbcM);m.scale.set(1,0.5,1);scene.add(m);
  rbcs.push({m,off:i/12});
}

const clock=new THREE.Clock();
let raf=null;
const v3=new THREE.Vector3();
function respawnToxin(t){
  t.state='wait';t.timer=1.2+Math.random()*2.6;t.cell=-1;
  t.mat.color.copy(C_RED);t.mat.emissive.copy(C_RED);
  t.o1.scale.setScalar(0.001);t.o2.scale.setScalar(0.001);
  t.sgs.forEach(s=>s.scale.setScalar(0.001));
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  flowT+=dts*0.018*bloodFlow;
  /* 血细胞沿血窦流动 */
  for(const r of rbcs){sinCurve.getPoint((r.off+flowT)%1,v3);r.m.position.copy(v3);}
  /* 事件窗口衰减 + 乙醛动力学 */
  const dec=Math.exp(-dts/9);
  doneW*=Math.max(dec,0.01);escW*=Math.max(dec,0.01);
  if(drinkMode)acald=Math.min(100,acald+dts*(2.5+cypAct*0.035));
  else acald=Math.max(0,acald-dts*14);
  /* 毒素状态机:sin → in → p1 → p2 → p3 → bile */
  for(const t of toxins){
    if(t.state==='wait'){
      t.timer-=dts;
      if(t.timer<=0){t.state='sin';t.u=0.02;t.cell=-1;t.mat.color.copy(C_RED);t.mat.emissive.copy(C_RED);}
    }else if(t.state==='sin'){
      t.u+=dts*0.09*bloodFlow;
      sinCurve.getPoint(Math.min(t.u,0.999),v3);t.grp.position.copy(v3);
      if(t.cell<0){
        for(const c of cells){
          if(!c.busy&&Math.abs(t.u-c.u)<0.045){
            t.cell=cells.indexOf(c);c.busy=t;
            t.from.copy(v3);t.to.set(c.x,3.0,0.15);t.p=0;t.state='in';break;
          }
        }
      }
      if(t.state==='sin'&&t.u>=0.985){escW+=1;respawnToxin(t);}
    }else if(t.state==='in'){
      t.p+=dts/0.7;
      t.grp.position.lerpVectors(t.from,t.to,Math.min(t.p,1));
      if(t.p>=1){t.state='p1';t.p=0;}
    }else if(t.state==='p1'){
      t.p+=dts*(cypAct/100)/2.2;
      cells[t.cell].heat=1;
      t.mat.color.lerpColors(C_RED,C_ORANGE,Math.min(t.p,1));t.mat.emissive.copy(t.mat.color);
      t.o1.scale.setScalar(Math.min(1,t.p*2));t.o2.scale.setScalar(Math.min(1,t.p*2));
      if(t.p>=1){
        if(drinkMode)acald=Math.min(100,acald+9);
        t.state='p2';t.p=0;
      }
    }else if(t.state==='p2'){
      t.p+=dts*(conjAct/100)/2.6;
      cells[t.cell].heat=1;
      t.mat.color.lerpColors(C_ORANGE,C_GREEN,Math.min(t.p,1));t.mat.emissive.copy(t.mat.color);
      const fade=Math.max(0,1-t.p);
      t.o1.scale.setScalar(0.35*fade);t.o2.scale.setScalar(0.35*fade);
      t.sgs.forEach((s,k)=>s.scale.setScalar(clamp(t.p*3-k,0.001,1)));
      if(t.p>=1){
        t.state='p3';t.p=0;
        t.from.copy(t.grp.position);t.to.set(cells[t.cell].x,2.02,0.85);
        cells[t.cell].busy=null;
      }
    }else if(t.state==='p3'){
      t.p+=dts/0.9;
      t.grp.position.lerpVectors(t.from,t.to,Math.min(t.p,1));
      if(t.p>=1){t.state='bile';t.u=cells[t.cell].cu;}
    }else if(t.state==='bile'){
      t.u+=dts*0.10*(0.4+bloodFlow*0.5);
      canaCurve.getPoint(Math.min(t.u,0.999),v3);t.grp.position.copy(v3);
      if(t.u>=1){doneW+=1;respawnToxin(t);}
    }
  }
  /* 肝细胞处理发热 */
  for(let i=0;i<cells.length;i++){
    cells[i].heat=Math.max(0,cells[i].heat-dts*0.8);
    cellMats[i].emissiveIntensity=cells[i].heat*0.3;
  }
  /* 乙醛示踪粒子 */
  const nAc=Math.round(acald/20);
  acalds.forEach((a,i)=>{
    a.m.visible=i<nAc;
    if(a.m.visible){sinCurve.getPoint((a.off+flowT*0.7)%1,v3);a.m.position.copy(v3);}
  });
  /* 肠腔:胆盐把脂肪滴包成胶束 */
  for(let i=0;i<fats.length;i++){
    const f=fats[i];
    f.ph=(f.ph+dts*(0.10+0.12*bloodFlow))%1;
    const p=f.ph;
    let wrap=0;
    if(p<0.35)wrap=p/0.35;else if(p<0.7)wrap=1;else wrap=1-(p-0.7)/0.3;
    f.m.scale.setScalar(Math.max(0.5,1-0.42*wrap));
    for(let k=0;k<4;k++){
      const s=salts[i*4+k];const a=k*Math.PI/2+f.ph*5;
      const R=0.46-0.08*wrap;
      s.position.set(f.m.position.x+Math.cos(a)*R,f.m.position.y+Math.sin(a)*R*0.8,f.m.position.z+0.12);
      s.visible=wrap>0.03;
      s.scale.setScalar(0.6+0.6*wrap);
    }
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

document.getElementById('tglLabels').checked=true;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
