<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嗅觉受体 · 从分子到气味 3D 动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#46c8b2;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-dim:#77828f; --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --ok:#7bd88f;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0e8a74;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-dim:#8593a3; --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --ok:#1d7a4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.35); transition: opacity .25s; }
  .lbl.st { border-color: rgba(155,127,232,.9); color: #dcc9ff; font-size: 13px; padding: 6px 11px; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.g { border-color: rgba(123,216,143,.9); color: #c4f0cf; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  :root[data-theme="light"] .lbl.st { color: #5a3bb0; }
  :root[data-theme="light"] .lbl.b { color: #1b7ca0; }
  :root[data-theme="light"] .lbl.g { color: #1d7a4a; }
  :root[data-theme="light"] .lbl.r { color: #b03a12; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.4); }

  #plot { position: fixed; right: 18px; bottom: 108px; z-index: 4; width: 348px; height: 196px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px;
    display: flex; justify-content: space-between; align-items: center; }
  #plot h3 #vmPill { font-size: 12.5px; font-weight: 700; color: var(--acc); }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.ok { color: var(--ok); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(70,200,178,.6); background: rgba(70,200,178,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(14,138,116,.55); background: rgba(14,138,116,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }

  #matrix { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
  #matrix .mrow { display: grid; grid-template-columns: 58px repeat(4, 1fr); gap: 3px; align-items: center; }
  #matrix .mh { font-size: 10.5px; color: var(--text2); text-align: center; }
  #matrix .ml { font-size: 11px; color: var(--text3); }
  #matrix .mc { height: 15px; border-radius: 4px; background: rgba(128,140,155,.14);
    transition: background .3s; }
  #matrix .mrow.on .ml { color: var(--acc); font-weight: 700; }
  #matrixCap { font-size: 10.5px; color: var(--text2); margin-top: 3px; }

  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(70,200,178,.10); border-color: rgba(70,200,178,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(14,138,116,.08); border-color: rgba(14,138,116,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1250px) { #plot { width: 290px; height: 170px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
    #plot { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="嗅觉受体:从分子到气味" data-en="Olfactory receptors: from molecule to smell">嗅觉受体:从分子到气味</h1>
  <div class="sub" data-zh="一个对的分子钻进对的口袋 → G 蛋白换岗 → cAMP 暴涨 → 通道开门放电;一个气味分子炸出一串脉冲,而大脑读的是受体激活的「模式」 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="The right molecule docks into the right pocket → G protein swaps GDP→GTP → cAMP explodes → channels open and the cell fires; one odorant detonates a spike train, and the brain reads the receptor activation pattern · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">一个对的分子钻进对的口袋 → G 蛋白换岗 → cAMP 暴涨 → 通道开门放电;一个气味分子炸出一串脉冲,而大脑读的是受体激活的「模式」 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="plot">
  <h3><span data-zh="膜电位 · 逐个结合事件推向放电" data-en="Membrane voltage · each binding event pushes toward firing">膜电位 · 逐个结合事件推向放电</span><span id="vmPill">−70 mV</span></h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="stats">
  <span class="k" data-zh="已结合受体数" data-en="bound receptors">已结合受体数</span><span class="v" id="stB">—</span>
  <span class="k" data-zh="cAMP 浓度" data-en="[cAMP]">cAMP 浓度</span><span class="v hot" id="stC">—</span>
  <span class="k" data-zh="膜电位" data-en="membrane Vm">膜电位</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="脉冲频率" data-en="spike rate">脉冲频率</span><span class="v ok" id="stR">—</span>
  <span class="k" data-zh="激活模式码" data-en="activation code">激活模式码</span><span class="v" id="stM">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn on" id="btnCoffee" data-zh="☕ 咖啡" data-en="☕ coffee">☕ 咖啡</button>
    <button class="abtn" id="btnLemon" data-zh="🍋 柠檬" data-en="🍋 lemon">🍋 柠檬</button>
    <button class="abtn" id="btnMint" data-zh="🌿 薄荷" data-en="🌿 mint">🌿 薄荷</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="气味浓度" data-en="Odorant conc.">气味浓度</label><input id="conc" type="range" min="0" max="100" step="1" value="55"><span class="val" id="concVal">55</span></div>
  <div class="row"><label data-zh="气流" data-en="Airflow">气流</label><input id="flow" type="range" min="0" max="100" step="1" value="50"><span class="val" id="flowVal">50</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <div id="matrix"></div>
  <div id="matrixCap" data-zh="组合编码:行=气味,列=受体类型,亮度=激活度——大脑读的是哪几列亮" data-en="Combinatorial code: rows = odorants, columns = receptor types, brightness = activation — the brain reads which columns light up">组合编码:行=气味,列=受体类型,亮度=激活度——大脑读的是哪几列亮</div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../enzyme-induced-fit/" data-zh="口袋怎么认形状:诱导契合" data-en="how pockets read shape: induced fit">口袋怎么认形状:诱导契合</a>
    <a href="../action-potential/" data-zh="脉冲怎么产生:动作电位" data-en="how spikes are made: action potential">脉冲怎么产生:动作电位</a>
    <a href="../synaptic-transmission/" data-zh="信号怎么传下一站:突触传递" data-en="how signals hop the next gap: synaptic transmission">信号怎么传下一站:突触传递</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ===== URL 参数 / 工具 ===== */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';

/* ===== 主题 / 语言 ===== */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

const scene = new THREE.Scene();
const floorMat = new THREE.MeshStandardMaterial({ color: 0x141a24, roughness: .95 });
const cytoMat = new THREE.MeshStandardMaterial({ color: 0x0d1119, roughness: .9, transparent: true, opacity: .55, depthWrite: false });
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg: '--bg', grid: '--cv-grid', axis: '--cv-axis', dim: '--cv-dim', text: '--cv-text' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(PAL.bg);
  floorMat.color.set(THEME === 'light' ? 0xd7dee9 : 0x141a24);
  cytoMat.color.set(THEME === 'light' ? 0xc9d4e2 : 0x0d1119);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('嗅觉受体 · 从分子到气味 3D 动画', 'Olfactory Receptors · From Molecule to Smell 3D');
  for (const r of labelReg) r.o.element.innerHTML = r.text();
  buildSteps();
  buildMatrix();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ===== 渲染器 / 场景 ===== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.3, 3.0, 7.9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.4, -0.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.72));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 9, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.42);
fill.position.set(-6, 3, -5);
scene.add(fill);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}

/* ===== 场景基底:嗅腔剖面 / 黏液 / 上皮 ===== */
const floorM = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 9), floorMat);
floorM.position.y = -1.95;
scene.add(floorM);
const cyto = new THREE.Mesh(new THREE.BoxGeometry(7.4, 1.7, 2.7), cytoMat);
cyto.position.set(0.3, -0.92, 0);
scene.add(cyto);
const epi = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.12, 2.3),
  mat(0xd98ba3, { opacity: 0.32, roughness: 0.35, emissiveIntensity: 0.04 }));
epi.position.set(-0.85, 0, 0);
scene.add(epi);
const mucus = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.18, 2.3),
  mat(0x9adcf0, { opacity: 0.1, emissiveIntensity: 0.03, depthWrite: false }));
mucus.position.set(-0.85, 0.24, 0);
scene.add(mucus);

/* ===== GPCR:7 螺旋蛇形受体 ===== */
const gpcr = new THREE.Group();
scene.add(gpcr);
const helixMat = mat(0x9b7fe8, { opacity: 0.92, emissiveIntensity: 0.15 });
const helices = [];
for (let i = 0; i < 7; i++) {
  const a = i / 7 * Math.PI * 2;
  const h = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.66, 10), helixMat);
  h.position.set(Math.cos(a) * 0.16, 0, Math.sin(a) * 0.16);
  h.rotation.z = Math.cos(a) * 0.1;
  h.rotation.x = -Math.sin(a) * 0.1;
  gpcr.add(h);
  helices.push(h);

function physStep(h) {
  tSim += h;
  for (let i = 0; i < 4; i++)
    occ[i] = clamp(occ[i] + (conc * AFF[ODORS[odor]][i] * KON - occ[i] * KOFF) * h, 0, 1);
  bindAcc += conc * AFF[ODORS[odor]][0] * (0.35 + flow * 1.15) * h;
  if (dockT <= 0 && bindAcc >= 1) { bindAcc -= 1; dockT = 2.6; homeRequested = true; }
  if (dockT > 0) dockT -= h;
  const gEnv = dockT > 0.9 && dockT < 2.15 ? 1 : 0;
  gAct += (gEnv - gAct) * (1 - Math.exp(-h * 5));
  if (gEnv === 0) gAct *= Math.exp(-h * 0.9);
  camp = Math.max(0, camp + (gAct * PROD - camp * DEG) * h);
  ch = clamp((camp - 1.2) / 8, 0, 1);
  if (spikeT > 0) {
    spikeT -= h;
    Vm = -70 + 102 * Math.sin(Math.PI * clamp(1 - spikeT / 0.09, 0, 1));
    if (spikeT <= 0) Vm = -72;
  } else {
    Vm += ((-70 + ch * 102) - Vm) * (1 - Math.exp(-h * 3.4));
    if (Vm >= -52 && refr <= 0 && ch > 0.15) {
      spikeT = 0.09; refr = 0.14;
      spikeTimes.push(tSim); sparkK = 0;
    }
  }
  refr -= h;
  while (spikeTimes.length && spikeTimes[0] < tSim - 3) spikeTimes.shift();
  if (demo6) {
    demoAcc += h;
    if (demoAcc > 2.6) {
      demoAcc = 0;
      odor = (odor + 1) % 3;
      occ = [0, 0, 0, 0];
      camp *= 0.3;
      syncOdorUI();
    }
  }
}

    }
    pctx.strokeStyle = '#46c8b2'; pctx.lineWidth = 3; pctx.stroke();
  }
}

/* ===== 每帧更新 ===== */
const POCKET = V3(0, 0.48, 0);
function updateParticles(dt) {
  const dmy = odorPool.dmy;
  const target = 9 + conc * 17;
  const active = odorPool.arr.filter(o => o.life > 0).length;
  if (active < target && Math.random() < dt * 9)
    spawnP(odorPool, V3(rnd(-4.4, -3.6), rnd(0.35, 1.5), rnd(-1, 1)),
      V3(flow * 1.25 + 0.18, -rnd(0.12, 0.4), 0), 8, ODOR_COL[odor]);
  if (homeRequested) {
    homeRequested = false;
    const q = odorPool.arr.find(o => o.life > 0 && !o.homing) || odorPool.arr.find(o => o.life <= 0);
    if (q) {
      if (q.life <= 0) { q.p.set(rnd(-4.2, -3.4), rnd(0.5, 1.3), rnd(-0.6, 0.6)); q.life = 8; }
      q.homing = true;
      odorPool.im.setColorAt(odorPool.arr.indexOf(q), ODOR_COL[odor]);
      odorPool.im.instanceColor.needsUpdate = true;
    }
  }
  for (let i = 0; i < odorPool.arr.length; i++) {
    const p = odorPool.arr[i];
    if (p.life > 0) {
      if (p.homing) {
        p.p.lerp(POCKET, 1 - Math.exp(-dt * 3.4));
        if (p.p.distanceTo(POCKET) < 0.07) p.life = 0;
      } else {
        p.life -= dt * 0.22;
        p.p.addScaledVector(p.v, dt);
        p.p.x += Math.sin(p.life * 5 + i) * 0.1 * dt;
        if (p.p.x > 2.8 || p.p.y < 0.07) p.life = 0;
      }
      dmy.position.copy(p.p);
      dmy.scale.setScalar(Math.max(p.life > 0 ? 1 : 0.0001, 0.0001));
    } else { dmy.position.set(0, -99, 0); dmy.scale.setScalar(0.0001); }
    dmy.updateMatrix();
    odorPool.im.setMatrixAt(i, dmy.matrix);
  }
  odorPool.im.instanceMatrix.needsUpdate = true;
  const cSpawn = campPool.dmy;
  if (Math.random() < gAct * dt * 26)
    spawnP(campPool, V3(1.2 + rnd(-0.06, 0.06), -0.42, rnd(-0.08, 0.08)),
      V3(rnd(-0.28, 0.28), rnd(-0.42, -0.1), rnd(-0.22, 0.22)), 1);
  for (let i = 0; i < campPool.arr.length; i++) {
    const p = campPool.arr[i];
    if (p.life > 0) {
      p.life -= dt / 2.2;
      p.p.addScaledVector(p.v, dt);
      p.p.x += Math.sin(tSim * 3 + i) * 0.05 * dt;
      p.p.y = Math.max(p.p.y, -1.3);
      cSpawn.position.copy(p.p);
      cSpawn.scale.setScalar(Math.max(clamp(p.life * 2, 0, 1), 0.0001));
    } else { cSpawn.position.set(0, -99, 0); cSpawn.scale.setScalar(0.0001); }
    cSpawn.updateMatrix();
    campPool.im.setMatrixAt(i, cSpawn.matrix);
  }
  campPool.im.instanceMatrix.needsUpdate = true;
  const nDmy = naPool.dmy;
  if (Math.random() < ch * dt * 30)
    spawnP(naPool, V3(-1.15 + rnd(-0.05, 0.05), 0.34, rnd(-0.05, 0.05)),
      V3(0, -rnd(1.4, 1.9), 0), 1);
  for (let i = 0; i < naPool.arr.length; i++) {
    const p = naPool.arr[i];
    if (p.life > 0) {
      p.p.addScaledVector(p.v, dt);
      if (p.p.y < -0.55) p.life = 0;
      nDmy.position.copy(p.p);
      nDmy.scale.setScalar(p.life > 0 ? 1 : 0.0001);
    } else { nDmy.position.set(0, -99, 0); nDmy.scale.setScalar(0.0001); }
    nDmy.updateMatrix();
    naPool.im.setMatrixAt(i, nDmy.matrix);
  }
  naPool.im.instanceMatrix.needsUpdate = true;
  const vDmy = vesPool.dmy;
  if (glomFlash > 0.55 && Math.random() < dt * 14) {
    const from = V3(3.5, 0.55, -0.5);
    const q = spawnP(vesPool, from, V3(rnd(0.8, 1.4), rnd(-1.2, -0.7), rnd(-0.15, 0.15)), 1);
    if (q) q.v.multiplyScalar(rnd(0.9, 1.15));
  }
  for (let i = 0; i < vesPool.arr.length; i++) {
    const p = vesPool.arr[i];
    if (p.life > 0) {
      p.life -= dt / 0.85;
      p.p.addScaledVector(p.v, dt);
      vDmy.position.copy(p.p);
      vDmy.scale.setScalar(Math.max(clamp(p.life * 2.5, 0, 1), 0.0001));
    } else { vDmy.position.set(0, -99, 0); vDmy.scale.setScalar(0.0001); }
    vDmy.updateMatrix();
    vesPool.im.setMatrixAt(i, vDmy.matrix);
  }
  vesPool.im.instanceMatrix.needsUpdate = true;
}
function updateVisuals(dt) {
  const vis = dockT > 0.02;
  mols.forEach((m, i) => {
    m.visible = vis && i === odor;
    if (m.visible) {
      const sc = ss(2.0, 1.78, dockT) * (1 - ss(0.0, 0.3, dockT));
      m.scale.setScalar(Math.max(sc, 0.001));
      m.rotation.y += dt * 1.6;
    }
  });
  pocket.material.opacity = vis ? 0.35 + 0.35 * Math.sin(tSim * 10) : 0;
  gpcr.rotation.z = 0.055 * gAct;
  helixMat.emissiveIntensity = 0.15 + gAct * 0.9;
  const kG = clamp(gAct * 1.35, 0, 1);
  gA.position.lerpVectors(A_HOME, A_ACT, kG);
  gBG.position.lerpVectors(BG_HOME, BG_ACT, kG);
  gdp.visible = gAct < 0.45;
  gtp.visible = !gdp.visible;
  acSite.material.emissiveIntensity = 0.5 + gAct * 1.6;
  gate.position.y = lerp(-0.27, -0.42, ch);
  gate.material.opacity = 1 - 0.55 * ch;
  if (sparkK < 1.4) {
    sparkK += dt * 2.6;
    spark.visible = sparkK <= 1;
    if (sparkK <= 1) spark.position.copy(axonCurve.getPointAt(clamp(sparkK, 0, 1)));
    spGlow.material.opacity = sparkK < 1 ? 0.35 : 0.3 * (1 - (sparkK - 1) / 0.4);
    glomFlash = ss(0.8, 1.0, sparkK) * (1 - ss(1.05, 1.4, sparkK));
  } else { spark.visible = false; glomFlash = Math.max(0, glomFlash - dt * 2); }
  glomMat.emissiveIntensity = 0.12 + glomFlash * 1.8;
}

/* ===== 读数 / 公式 ===== */
function rate() { return conc * AFF[ODORS[odor]][0] * (0.35 + flow * 1.15); }
function code() { return occ.map(o => o > 0.25 ? '1' : '0').join(''); }
function updateStats() {
  stB.textContent = (occ[0] + occ[1] + occ[2] + occ[3]).toFixed(2);
  stC.textContent = (camp / CAMP2UM).toFixed(1) + ' µM';
  stV.textContent = Vm.toFixed(0) + ' mV';
  stV.className = 'v' + (Vm > -55 ? ' hot' : '');
  stR.textContent = (spikeTimes.length / 3).toFixed(1) + ' Hz';
  stM.textContent = code();
  vmPill.textContent = `${Vm > 0 ? '+' : ''}${Vm.toFixed(0)} mV`;
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>1 个气味分子 → ~10² cAMP</b>　结合速率 ≈ 浓度×亲和力×气流 = ${rate().toFixed(2)} /s<br>` +
    `[cAMP] = ${(camp / CAMP2UM).toFixed(1)} µM → CNG 开放 P = ${(ch * 100).toFixed(0)}% → 过阈 −52 mV 放电 ${(spikeTimes.length / 3).toFixed(1)} Hz · 一个受体认多种气味,一种气味点亮多个受体`,
    `<b>1 odorant → ~10² cAMP</b>　bind rate ≈ conc × affinity × flow = ${rate().toFixed(2)} /s<br>` +
    `[cAMP] = ${(camp / CAMP2UM).toFixed(1)} µM → CNG open P = ${(ch * 100).toFixed(0)}% → past −52 mV threshold fires ${(spikeTimes.length / 3).toFixed(1)} Hz · one receptor, many odors; one odor, many receptors`);
}

/* ===== 主循环 ===== */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    physStep(dts);
    sampleAcc += dts;
    while (sampleAcc >= 0.03) { sampleAcc -= 0.03; pushSample(); }
  }
  updateParticles(dt);
  updateVisuals(dt);
  drawPlot();
  formulaAcc += dt;
  if (formulaAcc > 0.25) {
    formulaAcc = 0;
    updateStats();
    updateFormula();
    updateMatrix();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ===== 初始化(URL 参数) ===== */
fastForward(qsFloat('t', 0));
syncOdorUI();
applyTheme();
applyLang();
setPlayLabel();
updateStats();
start();
</script>
