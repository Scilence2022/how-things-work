<style>

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}

  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);

  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 生物学注脚（真实量级）：
   - 场景比例 1 单位 ≈ 10 nm：囊泡直径 ~40 nm（突触囊泡），时间约压缩 10⁵×（真实全流程 ~秒级，
     突触处 Ca²⁺ 触发到递质释放仅需 ~0.2 ms）。
   - 衣被蛋白（COPⅡ/clathrin）把膜弯曲成芽，dynamin 以 GTP 水解掐断颈部。
   - kinesin 驱动顺行（→ 正端，~0.6–1.5 µm/s），dynein 驱动逆行。
   - 系留：Rab-GTP + 系留复合物；随后 v-SNARE（VAMP）与 t-SNARE（syntaxin-1 + SNAP-25 两螺旋）
     组装成四螺旋束，逐圈拉链把两层膜从 ~8 nm 拉到 <1 nm，脂膜自发融合；
     神经末梢由 Ca²⁺ 与 synaptotagmin 结合作为最后的扳机。 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const htmlEl=document.documentElement;
const Q=new URLSearchParams(location.search);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0e141a,24,60);
const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,0.1,200);
camera.position.set(1.8,6.0,15.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.3,1.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=45;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14181e,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,4,-6);scene.add(fill);

/* ---- 材质 ---- */
const mtM=new THREE.MeshStandardMaterial({color:0x5a7d9a,roughness:0.4,metalness:0.55});
const protoM=new THREE.MeshStandardMaterial({color:0x3d5a75,roughness:0.45,metalness:0.5});
const golgiM=new THREE.MeshStandardMaterial({color:0xd6a05a,roughness:0.5,transparent:true,opacity:0.85});
const pmM=new THREE.MeshPhysicalMaterial({color:0x63b3ed,transparent:true,opacity:0.16,roughness:0.2});
const vesM=new THREE.MeshPhysicalMaterial({color:0x8ee0ff,transparent:true,opacity:0.55,roughness:0.25});
const vesFadeM=new THREE.MeshPhysicalMaterial({color:0x8ee0ff,transparent:true,opacity:0.55,roughness:0.25});
const coatM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xe8590c,emissiveIntensity:0.5,roughness:0.4});
const cargoM=new THREE.MeshStandardMaterial({color:0x69db7c,emissive:0x2f9e44,emissiveIntensity:1.1,roughness:0.3});
const vSnM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xe8590c,emissiveIntensity:0.7,roughness:0.3});
const tSnM=new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1864ab,emissiveIntensity:0.7,roughness:0.3});
const caM=new THREE.MeshStandardMaterial({color:0x66d9e8,emissive:0x0ca678,emissiveIntensity:1.2});
const poreM=new THREE.MeshStandardMaterial({color:0xffe066,emissive:0xf59f00,emissiveIntensity:1.0,roughness:0.3});
const tetherM=new THREE.LineBasicMaterial({color:0xb197fc,transparent:true,opacity:0.85});

/* ---- 微管轨道（整体右移，让全链条落在控制面板右侧可见区） ---- */
const MT_LEN=14,MT_R=0.18;
const track=new THREE.Group();track.position.x=2.2;scene.add(track);
const mt=new THREE.Mesh(new THREE.CylinderGeometry(MT_R,MT_R,MT_LEN,16),mtM);
mt.rotation.z=Math.PI/2;track.add(mt);
/* 13 根原丝简化为 6 条纵脊 */
for(let i=0;i<6;i++){
  const a=i/6*Math.PI*2;
  const p=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,MT_LEN,6),protoM);
  p.rotation.z=Math.PI/2;
  p.position.set(0,Math.cos(a)*(MT_R+0.02),Math.sin(a)*(MT_R+0.02));
  track.add(p);
}

/* ---- 供膜：高尔基体扁平囊堆（左） ---- */
const golgi=new THREE.Group();scene.add(golgi);
for(let i=0;i<3;i++){
  const c=new THREE.Mesh(new THREE.SphereGeometry(1.7,26,14),golgiM);
  c.scale.set(1,0.22,0.75);
  c.position.set(-0.9+0.25*i,-0.9+i*0.55,0);
  golgi.add(c);
}
golgi.position.set(-2.0,1.6,0);

/* ---- 靶膜：质膜大球（右，只露出左冠） ---- */
const pm=new THREE.Mesh(new THREE.SphereGeometry(4.4,40,26),pmM);
pm.position.set(10.6,1.6,0);scene.add(pm);

/* ---- 囊泡（衣被 + 货物 + Rab 斑点） ---- */
const VS_R=0.75;
const vesicle=new THREE.Group();scene.add(vesicle);
const vesBody=new THREE.Mesh(new THREE.SphereGeometry(VS_R,28,20),vesM);vesicle.add(vesBody);
const coatGrp=new THREE.Group();vesicle.add(coatGrp);
const coatGeo=new THREE.SphereGeometry(0.13,8,6);
for(let i=0;i<14;i++){
  const b=new THREE.Mesh(coatGeo,coatM);
  const th=Math.acos(1-2*(i+0.5)/14),ph=i*2.399963; // 黄金角均匀分布
  b.position.set(VS_R*Math.sin(th)*Math.cos(ph),VS_R*Math.cos(th),VS_R*Math.sin(th)*Math.sin(ph));
  coatGrp.add(b);
}
const cargoGrp=new THREE.Group();vesicle.add(cargoGrp);
const cargoSeeds=[];
for(let i=0;i<8;i++){
  const c=new THREE.Mesh(new THREE.SphereGeometry(0.11,8,6),cargoM);
  c.position.set((Math.random()-0.5)*0.7,(Math.random()-0.5)*0.7,(Math.random()-0.5)*0.7);
  cargoGrp.add(c);cargoSeeds.push(c.position.clone());
}
const rab=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,6),
  new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xf08c00,emissiveIntensity:0.2}));
rab.position.set(VS_R*0.7,VS_R*0.5,0);vesicle.add(rab);

/* ---- 马达（驱动蛋白/dynein：双足） ---- */
const motor=new THREE.Group();scene.add(motor);
const footM=new THREE.MeshStandardMaterial({color:0xc44b2a,roughness:0.4});
const foot1=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,6),footM);
const foot2=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,6),footM);
const stalk=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.55,6),footM);
stalk.position.y=0.3;motor.add(foot1,foot2,stalk);

/* ---- 系留线 ×3 ---- */
const tetherLines=[];
for(let i=0;i<3;i++){
  const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  const ln=new THREE.Line(g,tetherM);ln.visible=false;scene.add(ln);tetherLines.push(ln);
}

/* ---- SNARE 四螺旋（1 v-SNARE 橙 + 3 t-SNARE 蓝，含条纹显示盘绕） ---- */
const helixGeo=new THREE.CylinderGeometry(0.045,0.045,1.25,8);
const helixGrps=[];
for(let i=0;i<4;i++){
  const outer=new THREE.Group();          // 定位+指向
  const spin=new THREE.Group();           // 自转显示拉链
  const cyl=new THREE.Mesh(helixGeo,i===0?vSnM:tSnM);
  spin.add(cyl);
  for(let k=0;k<2;k++){                   // 螺旋表面条纹
    const st=new THREE.Mesh(new THREE.BoxGeometry(0.012,1.0,0.16),
      new THREE.MeshStandardMaterial({color:i===0?0xffe0b2:0xd0ebff,roughness:0.4}));
    st.position.x=k?0.05:-0.05;spin.add(st);
  }
  outer.add(spin);outer.visible=false;scene.add(outer);
  helixGrps.push({outer,spin});
}

/* ---- 融合孔与粒子 ---- */
const pore=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.05,8,24),poreM);
pore.rotation.y=Math.PI/2;pore.visible=false;scene.add(pore);
const parts=[];       // 货物/钙粒子 {mesh,v,life}
const partGeoC=new THREE.SphereGeometry(0.09,8,6);
const partGeoG=new THREE.SphereGeometry(0.11,8,6);

/* ---- 位置参数（随方向翻转） ---- */
let dir=1; // 1=顺行(高尔基→质膜)  -1=逆行
function geo(){
  return dir===1
    ?{budX:-0.5,endX:6.2,budMemY:1.6}
    :{budX:5.4,endX:-0.9,budMemY:1.6};
}
const RAIL_Y=MT_R+VS_R+0.02; // 囊泡骑在微管上的中心高度

/* ---- 状态机 ---- */
/* 相位: 0 出芽 1 掐断/装载 2 押运 3 系留 4 拉链 5 融合 */
let phase=0,pt=0,playing=true,speedK=1.0,simT=0,slowZip=false;
let zip=0,fusionCount=0,cargoRel=0;
let labelsOn=!Q.has('labels')||Q.get('labels')!=='0';
const DUR=[2.4,1.6,5.5,2.0,5.0,2.6];

function resetVes(){
  const g=geo();
  phase=0;pt=0;zip=0;
  vesicle.position.set(g.budX-dir*0.3,1.6,0);
  vesicle.scale.setScalar(0.25);
  vesBody.material=vesM;vesBody.material.opacity=0.55;
  coatGrp.children.forEach(b=>b.scale.setScalar(0));
  cargoGrp.children.forEach((c,i)=>{c.position.copy(cargoSeeds[i]);c.visible=false;});
  rab.material.emissiveIntensity=0.2;
  helixGrps.forEach(h=>h.outer.visible=false);
  pore.visible=false;tetherLines.forEach(l=>l.visible=false);
}
resetVes();

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('高尔基体（供膜）','Golgi (donor)'),new THREE.Vector3(-2.0,3.4,0),'o',()=>true);
addLabel(()=>L('靶膜 / 质膜','Target / plasma membrane'),new THREE.Vector3(7.0,4.4,0),'b');
addLabel(()=>L('微管轨道 · 驱动蛋白押运','Microtubule track · kinesin hauling'),new THREE.Vector3(2.2,0.2,1.4),'b',()=>phase===2);
addLabel(()=>L('Rab-GTP 系留信号','Rab-GTP tether signal'),new THREE.Vector3(3.4,3.6,0),'b',()=>phase===3);
addLabel(()=>L('四螺旋束 · 逐圈拉链','4-helix bundle · zippering'),new THREE.Vector3(4.4,3.4,0),'o',()=>phase===4);
addLabel(()=>L('融合孔 · 货物一泻而下','Fusion pore · cargo floods out'),new THREE.Vector3(6.1,3.4,0),'g',()=>phase===5);
addLabel(()=>L('Ca²⁺ 扳机','Ca²⁺ trigger'),new THREE.Vector3(6.1,2.5,0),'g',()=>phase===5&&pt<0.8);

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0e141a:0xe9e4dc);
  scene.fog.color.setHex(dark?0x0e141a:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('btnDir').textContent=dir===1?L('方向：顺行 →','Direction: anterograde →'):L('方向：← 逆行','Direction: ← retrograde');
  buildSteps();updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'出芽：衣被蛋白把供膜弯成球，货物装进囊泡',en:'Budding: coat proteins curve the donor membrane, cargo is loaded',
   go(){resetVes();}},
  {zh:'掐断与脱被衣：dynamin 水解 GTP 掐断颈部，衣被脱落',en:'Scission & uncoating: dynamin pinches the neck with GTP, coat sheds',
   go(){resetVes();phase=1;pt=0;}},
  {zh:'押运：驱动蛋白/ dynein 沿微管把囊泡运到靶区',en:'Hauling: kinesin/dynein carry the vesicle along the microtubule',
   go(){resetVes();phase=2;pt=0;vesicle.position.set(geo().budX,RAIL_Y,0);}},
  {zh:'系留与互认：Rab-GTP 亮灯，系留线抓住囊泡',en:'Tethering: Rab-GTP lights up, tethers catch the vesicle',
   go(){resetVes();phase=3;pt=0;vesicle.position.set(geo().endX-dir*2.75,RAIL_Y,0);}},
  {zh:'拉链盘绕：v-/t-SNARE 组成四螺旋束，把膜拉到 ~1 nm',en:'Zippering: v-/t-SNAREs coil into a 4-helix bundle, membranes to ~1 nm',
   go(){resetVes();phase=4;pt=0;vesicle.position.set(geo().endX-dir*2.75,1.6,0);}},
  {zh:'融合释放：Ca²⁺ 扳机→融合孔绽开→货物一泻而下（突递质释放的全速版）',en:'Fusion: Ca²⁺ trigger → pore opens → cargo floods out (fast version = transmitter release)',
   go(){resetVes();phase=5;pt=0;zip=1;vesicle.position.set(geo().endX-dir*0.78,1.6,0);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.go();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 按钮 ---- */
document.getElementById('btnCa').addEventListener('click',()=>{
  // Ca²⁺ 只在系留之后有效：直接把拉链拉满并引爆融合
  if(phase<3)return;
  phase=5;pt=0;zip=1;burstCa();
});
document.getElementById('btnDir').addEventListener('click',()=>{
  dir=-dir;resetVes();
  document.getElementById('btnDir').textContent=dir===1?L('方向：顺行 →','Direction: anterograde →'):L('方向：← 逆行','Direction: ← retrograde');
  updateStats();
});
document.getElementById('btnSlow').addEventListener('click',e=>{
  slowZip=!slowZip;e.currentTarget.classList.toggle('on',slowZip);
});
document.getElementById('btnRestart').addEventListener('click',()=>{resetVes();activeStep=0;syncSteps();});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/60;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 粒子 ---- */
function burstCa(){
  const cx=geo().endX-dir*0.4;
  for(let i=0;i<18;i++){
    const m=new THREE.Mesh(partGeoC,caM);
    m.position.set(cx+(Math.random()-0.5)*1.2,1.6+(Math.random()-0.5)*1.2,(Math.random()-0.5)*1.2);
    scene.add(m);
    parts.push({mesh:m,v:new THREE.Vector3((Math.random()-0.5),Math.random()*0.8,(Math.random()-0.5)).multiplyScalar(2.2),life:1.0,max:1.0});
  }
}
function releaseCargo(){
  const cx=geo().endX-dir*0.15;
  cargoGrp.children.forEach(c=>{
    if(!c.visible)return;
    const m=new THREE.Mesh(partGeoG,cargoM);
    m.position.copy(c.position).add(vesicle.position);
    scene.add(m);
    parts.push({mesh:m,v:new THREE.Vector3(dir*(1.6+Math.random()),(Math.random()-0.5)*0.8,(Math.random()-0.5)*0.8),life:1.6,max:1.6});
    cargoRel++;
  });
}

/* ---- 统计 ---- */
function updateStats(){
  document.getElementById('stDir').textContent=dir===1?L('顺行','antero'):L('逆行','retro');
  const g=phase>=4?(1-zip)*2.0+0.1:phase===3?2.0:9.9;
  document.getElementById('stGap').innerHTML=g>=9.9?'<small>—</small>':(g*10).toFixed(0)+'<small> nm</small>';
  document.getElementById('stZip').innerHTML=Math.round((phase>=4?zip:phase===5?1:0)*100)+'<small> %</small>';
  document.getElementById('stCargo').textContent=cargoRel;
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    const k=speedK*(phase===4&&slowZip?0.35:1);
    pt+=dt*k;simT+=dt*k;
    const g=geo();
    /* 相位推进 */
    if(pt>=DUR[phase]){
      pt=0;
      if(phase===0){phase=1;}
      else if(phase===1){phase=2;vesicle.position.set(g.budX,RAIL_Y,0);}
      else if(phase===2){phase=3;}
      else if(phase===3){phase=4;helixGrps.forEach(h=>h.outer.visible=true);}
      else if(phase===4){phase=5;burstCa();}
      else if(phase===5){resetVes();}
    }
    /* 各相位的具体运动 */
    if(phase===0){
      const u=pt/DUR[0];
      vesicle.position.set(g.budX-dir*0.3*u,1.6+0.25*u,0);
      vesicle.scale.setScalar(lerp(0.25,1,Math.min(1,u*1.4)));
      coatGrp.children.forEach(b=>b.scale.setScalar(u>0.3?1:u/0.3));
      cargoGrp.children.forEach((c,i)=>c.visible=u>0.35);
    }else if(phase===1){
      const u=pt/DUR[1];
      vesicle.position.set(g.budX,lerp(1.85,RAIL_Y,u),0);
      coatGrp.children.forEach(b=>b.scale.setScalar(1-u)); // 脱被衣
      cargoGrp.children.forEach(c=>c.visible=true);
    }else if(phase===2){
      const u=pt/DUR[2];
      vesicle.position.x=lerp(g.budX,g.endX-dir*2.75,u);
      vesicle.position.y=RAIL_Y+Math.sin(simT*9)*0.03;
      /* 双足交替（ATM 简化为步进） */
      const st=simT*10;
      foot1.position.set(0.1,Math.max(0,Math.sin(st))*0.14,0.14);
      foot2.position.set(-0.1,Math.max(0,Math.sin(st+Math.PI))*0.14,-0.14);
      motor.position.set(vesicle.position.x-dir*0.35,MT_R+0.1,0);
      stalk.rotation.x=0.5;
      cargoGrp.children.forEach((c,i)=>{
        c.position.copy(cargoSeeds[i]);
        c.position.y+=Math.sin(simT*7+i)*0.05;
      });
    }else if(phase===3){
      const u=pt/DUR[3];
      vesicle.position.set(g.endX-dir*2.75,lerp(RAIL_Y,1.6,u),0);
      rab.material.emissiveIntensity=0.4+Math.sin(simT*8)*0.35+u;
      tetherLines.forEach((ln,i)=>{
        ln.visible=true;
        const zoff=(i-1)*0.4;
        const p1=new THREE.Vector3(g.endX-dir*0.05,1.6+zoff*0.4,0);
        const p2=vesicle.position.clone().add(new THREE.Vector3(-dir*0.5,zoff*0.5,0));
        const mid=p1.clone().lerp(p2,0.5);mid.y+=0.35;
        const curve=new THREE.QuadraticBezierCurve3(p2,mid,p1);
        ln.geometry.setFromPoints(curve.getPoints(12));
      });
      motor.visible=phase===2;
    }else if(phase===4){
      zip=Math.min(1,pt/DUR[4]);
      /* 囊被拉向靶膜：间隙 2.0 → 0.05（~1 nm 实尺） */
      const gap=lerp(2.0,0.05,zip);
      vesicle.position.x=g.endX-dir*(0.75+gap);
      vesicle.position.y=1.6;
      vesicle.scale.set(1,1-0.25*zip,1-0.1*zip); // 轻微变扁
      tetherLines.forEach(ln=>ln.visible=false);
      /* 四螺旋：先伸出→盘绕聚拢到接触点 */
      const contact=g.endX-dir*gap*0.5;
      const twist=zip*Math.PI*4;
      helixGrps.forEach((h,i)=>{
        const zoff=(i-1.5)*0.13;
        const anchor=i===0
          ?vesicle.position.clone().add(new THREE.Vector3(dir*0.75,zoff*0.6,0))
          :new THREE.Vector3(g.endX-dir*0.05,1.6+zoff*0.6,0);
        const stick=anchor.clone().add(new THREE.Vector3(dir*(i===0?0.62:-0.62),0,0));
        const gather=new THREE.Vector3(contact,1.6+zoff*0.25,(i%2?1:-1)*0.05*zip);
        h.outer.position.lerpVectors(stick,gather,zip);
        h.outer.rotation.z=-Math.PI/2*dir;   // 圆柱 Y 轴对齐到 X 轴
        h.spin.rotation.y=twist+i*Math.PI/2; // 逐圈咬合的自旋
      });
      rab.material.emissiveIntensity=0.3;
    }else if(phase===5){
      helixGrps.forEach(h=>h.outer.visible=false);
      if(pt<0.5){
        pore.visible=true;
        pore.position.set(g.endX-dir*0.1,1.6,0);
        pore.scale.setScalar(lerp(0.2,1.6,pt/0.5));
        vesicle.scale.set(1,1-0.5*pt*2,1);
      }else{
        if(pore.visible){pore.visible=false;releaseCargo();}
        const u=(pt-0.5)/2.1;
        vesBody.material=vesFadeM;
        vesFadeM.opacity=0.55*(1-u);
        vesicle.scale.set(lerp(1,0.4,u),lerp(0.5,0.15,u),1-u*0.5);
      }
    }
    motor.visible=(phase===2);
  }
  /* 粒子更新（暂停时冻结） */
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(playing){
      p.mesh.position.addScaledVector(p.v,dt);
      p.life-=dt;
      p.mesh.scale.setScalar(Math.max(0.05,p.life/p.max));
      if(p.life<=0){scene.remove(p.mesh);parts.splice(i,1);}
    }
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

/* ---- URL 参数与启动 ---- */
if(Q.get('pause')==='1'){playing=false;}
document.getElementById('tglLabels').checked=labelsOn;
if(Q.get('speed')){
  const v=clamp(+Q.get('speed'),20,150);
  document.getElementById('sSpd').value=v;
  speedK=v/60;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSteps();start();
</script>
</body>
</html>
