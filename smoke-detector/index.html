<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烟雾报警器 · 一缕烟掐断一道电流</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd43b;
    --bg:#101014; --panel:rgba(15,15,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,15,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,15,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b08900;
    --bg:#f1f0ec; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.r { color:#c92a2a; } :root[data-theme="light"] .lbl.g { color:#2b8a3e; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 210px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 240px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }
  #stats .v.acc { color: var(--acc); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.g { color: #dfe2e6; border-color: rgba(154,167,184,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,212,59,.6); background: rgba(255,212,59,.12); color: var(--text); }
  .abtn.smoke { border-color: rgba(255,120,60,.5); color: #ffa070; }
  .abtn.smoke.on { background: rgba(255,120,60,.15); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(176,137,0,.55); background: rgba(176,137,0,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 62px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,212,59,.10); border-color: rgba(255,212,59,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,137,0,.08); border-color: rgba(176,137,0,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #333; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe9a3; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #333; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.08); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="烟雾报警器:一缕烟掐断一道电流" data-en="Smoke Detector: how a wisp of smoke cuts a current">烟雾报警器:一缕烟掐断一道电流</h1>
  <div class="sub" data-zh="镅-241 的 α 粒子电离空气 → 9 V 偏压收出 ~50 pA 恒定离子电流 → 烟雾颗粒吸附离子、电流骤跌 → 采样室对比密封参考室,失衡即触发 85 dB 蜂鸣 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Am-241 α particles ionize the air → a 9 V bias collects a steady ~50 pA ion current → smoke grains soak up ions and the current sags → sensing chamber vs sealed reference, the imbalance fires an 85 dB horn · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">镅-241 的 α 粒子电离空气 → 9 V 偏压收出 ~50 pA 恒定离子电流 → 烟雾颗粒吸附离子、电流骤跌 → 采样室对比密封参考室,失衡即触发 85 dB 蜂鸣 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="采样室电流" data-en="Sensing current">采样室电流</span><span class="v" id="stIs">—</span>
  <span class="k" data-zh="参考室电流" data-en="Reference current">参考室电流</span><span class="v" id="stIr">—</span>
  <span class="k" data-zh="烟雾浓度" data-en="Smoke">烟雾浓度</span><span class="v" id="stSm">—</span>
  <span class="k" data-zh="α 活度" data-en="α activity">α 活度</span><span class="v" id="stAct">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v ok" id="stSt">—</span>
</div>

<div id="plot">
  <h3 data-zh="采样室电流(橙)· 参考室(灰)· 虚线=报警门槛 −25%" data-en="Sensing current (orange) · reference (grey) · dashed = alarm at −25%">采样室电流(橙)· 参考室(灰)· 虚线=报警门槛 −25%</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="橙点 正离子" data-en="orange = + ions">橙点 正离子</span>
    <span class="chip.b" data-zh="蓝点 电子" data-en="blue = electrons">蓝点 电子</span>
    <span class="chip.g" data-zh="灰点 烟雾颗粒" data-en="grey = smoke">灰点 烟雾颗粒</span>
  </div>
  <div id="actions">
    <button class="abtn smoke" id="btnSmoke" data-zh="点一支烟" data-en="light a cigarette">点一支烟</button>
    <button class="abtn" id="btnAir" data-zh="开窗通风" data-en="air it out">开窗通风</button>
    <button class="abtn" id="btnSrc" data-zh="拆走镅源(故障)" data-en="remove source (fault)">拆走镅源(故障)</button>
    <button class="abtn" id="btnMute" data-zh="消音复位" data-en="hush / reset">消音复位</button>
  </div>
  <div class="row"><label data-zh="烟雾浓度" data-en="Smoke level">烟雾浓度</label><input id="sm" type="range" min="0" max="100" step="1" value="0"><span class="val" id="smVal">0 %</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../radioactive-decay/" data-zh="半衰期与活度" data-en="half-life and activity">半衰期与活度</a>
    <a href="../lightning/" data-zh="空气被击穿时" data-en="when air breaks down">空气被击穿时</a>
    <a href="../kinetic-theory/" data-zh="离子也在乱撞" data-en="ions random-walk too">离子也在乱撞</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xf1f0ec : 0x101014);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('烟雾报警器 · 一缕烟掐断一道电流', 'Smoke Detector · a wisp of smoke cuts a current');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.6, 2.6, 6.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
/* 底座 */
const base = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.8, 0.14, 48),
  mat(0x23262e, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.55;
scene.add(base);

/* ================= 报警器外壳(剖开)与腔体 ================= */
const CH = { r: 1.05, y0: -0.35, y1: 1.15 };          // 腔体半径 / 上下底
const shellMat = new THREE.MeshStandardMaterial({ color: 0xe8e4da, roughness: 0.55, metalness: 0.05,
  transparent: true, opacity: 0.17, depthWrite: false, side: THREE.DoubleSide });
const shell = new THREE.Mesh(new THREE.CylinderGeometry(CH.r + 0.12, CH.r + 0.12, CH.y1 - CH.y0 + 0.24, 40, 1, true, Math.PI * 0.15, Math.PI * 1.7), shellMat);
shell.position.y = (CH.y0 + CH.y1) / 2;
scene.add(shell);
/* 顶盖 + 报警灯 */
const topCap = new THREE.Mesh(new THREE.CylinderGeometry(CH.r + 0.12, CH.r + 0.12, 0.14, 40),
  new THREE.MeshStandardMaterial({ color: 0xe8e4da, roughness: 0.55, transparent: true, opacity: 0.3, depthWrite: false }));
topCap.position.y = CH.y1 + 0.19;
scene.add(topCap);
for (let i = 0; i < 8; i++) {
  const slot = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.16, 0.1), mat(0x2a2d34, { opacity: 1 }));
  const a = i / 8 * Math.PI * 2;
  slot.position.set(Math.cos(a) * (CH.r + 0.02), CH.y1 + 0.2, Math.sin(a) * (CH.r + 0.02));
  slot.rotation.y = -a;
  scene.add(slot);
}
const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: 0xff0000, emissiveIntensity: 0.15, roughness: 0.3 }));
beacon.position.y = CH.y1 + 0.27;
scene.add(beacon);

/* 电极板(上下)与中间隔板 */
const plateMat = mat(0xc8b478, { roughness: 0.4, metalness: 0.5, opacity: 1 });
const topPlate = new THREE.Mesh(new THREE.CylinderGeometry(CH.r - 0.04, CH.r - 0.04, 0.05, 36), plateMat);
topPlate.position.y = CH.y1 - 0.05;
scene.add(topPlate);
const botPlate = topPlate.clone();
botPlate.position.y = CH.y0 + 0.05;
scene.add(botPlate);
/* 隔板:前=采样室(通烟),后=参考室(密封) */
const baffle = new THREE.Mesh(new THREE.BoxGeometry(CH.r * 2, CH.y1 - CH.y0 - 0.1, 0.05), mat(0x8a8f98, { opacity: 0.95 }));
baffle.position.set(0, (CH.y0 + CH.y1) / 2, 0);
scene.add(baffle);
/* 采样室底部进烟口 */

function logicStep(dt) {

const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 12, padB = 18;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const yOf = v => pad + (H - pad - padB) * (1 - clamp(v, 0, 60) / 60);
  const thr = refCurrent() * 0.75;
  ctx.strokeStyle = 'rgba(255,107,107,.55)'; ctx.lineWidth = 2; ctx.setLineDash([8, 7]);
  ctx.beginPath(); ctx.moveTo(pad, yOf(thr)); ctx.lineTo(W - pad, yOf(thr)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - padB); ctx.lineTo(W - pad, H - padB); ctx.stroke();
  const line = (arr, color, width) => {
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.beginPath();
    for (let i = 0; i < arr.length; i++) {
      const x = pad + (W - 2 * pad) * i / (NSAMP - 1);
      i ? ctx.lineTo(x, yOf(arr[i])) : ctx.moveTo(x, yOf(arr[i]));
    }
    ctx.stroke();
  };
  line(histR, '#9aa4ad', 2);
  line(histS, '#ffd43b', 2.6);
  ctx.fillStyle = cTxt; ctx.font = '15px system-ui';
  ctx.fillText('50 pA', pad + 2, yOf(50) - 5);
  ctx.fillText('0', pad + 2, H - padB - 4);
}

/* ---------------- 粒子驱动 ---------------- */
const dummy = new THREE.Object3D();
const UP = new THREE.Vector3(0, 1, 0);
const Q = new THREE.Quaternion();
function randInChamber(front, out) {
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * (CH.r - 0.12);
  out.set(Math.cos(a) * r, CH.y0 + 0.15 + Math.random() * (CH.y1 - CH.y0 - 0.3),
    Math.sin(a) * r * (front ? -Math.abs(1) : 1) * (front ? 1 : -1));
  if (front) out.z = Math.abs(out.z) * 0.9 + 0.06;
  else out.z = -Math.abs(out.z) * 0.9 - 0.06;
  return out;
}
let alphaAcc = 0, ionAcc = 0, smokeAcc = 0;
function updateParticles(vis) {
  const smoky = smokeNow / 100;
  /* α 径迹 */
  alphaAcc += vis * 5.5 * (srcIn ? 1 : 0);
  if (alphaAcc >= 1) {
    alphaAcc = 0;
    const s = alphaState.find(x => x.t < 0);
    if (s) {
      s.t = 0;
      const front = Math.random() < 0.6;
      randInChamber(front, s.pos);
      s.pos.multiplyScalar(0.22);
      s.pos.y = (CH.y0 + CH.y1) / 2 + (Math.random() - 0.5) * 0.3;
      const a = Math.random() * Math.PI * 2, el = (Math.random() - 0.5) * Math.PI * 0.8;
      s.dir.set(Math.cos(a) * Math.cos(el), Math.sin(el), Math.sin(a) * Math.cos(el) * (front ? 1 : -1)).normalize();
      s.len = 0.55 + Math.random() * 0.5;
      if (!front) s.pos.z = -Math.abs(s.pos.z) - 0.04; else s.pos.z = Math.abs(s.pos.z) + 0.04;
    }
  }
  for (let i = 0; i < A_N; i++) {
    const s = alphaState[i];
    if (s.t >= 0) {
      s.t += vis * 2.2;
      if (s.t >= 1) s.t = -1;
    }
    if (s.t >= 0) {
      const fade = Math.sin(Math.PI * clamp(s.t, 0, 1));
      dummy.position.copy(s.pos).addScaledVector(s.dir, s.len * 0.5 * s.t + 0.1);
      dummy.quaternion.setFromUnitVectors(UP, s.dir);
      dummy.scale.set(1, s.len, 1);
      dummy.updateMatrix();
      alphaIM.setColorAt(i, ionCol.setRGB(0.35 * fade, 0.95 * fade, 0.6 * fade));
    } else {
      dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.001); dummy.quaternion.identity();
      alphaIM.setColorAt(i, ionCol.setRGB(0, 0, 0));
    }
    dummy.updateMatrix();
    alphaIM.setMatrixAt(i, dummy.matrix);
  }
  alphaIM.instanceMatrix.needsUpdate = true;
  if (alphaIM.instanceColor) alphaIM.instanceColor.needsUpdate = true;
  /* 离子对:α 径迹上生成,正上负下 */
  ionAcc += vis * 26 * (srcIn ? 1 : 0);
  if (ionAcc >= 1) {
    ionAcc = 0;
    for (let k = 0; k < 2; k++) {
      const s = ionState.find(x => !x.on);
      if (!s) break;
      s.on = true;
      s.sign = k === 0 ? 1 : -1;
      randInChamber(Math.random() < 0.6, s.pos);
      s.v = 0.42 * (1 - 0.62 * smoky) * (0.8 + Math.random() * 0.5);
    }
  }
  let arrived = 0;
  for (let i = 0; i < ION_N; i++) {
    const s = ionState[i];
    if (s.on) {
      s.pos.y += vis * s.v * s.sign;
      /* 烟雾吸附:浓度越高越容易中途消失 */
      if (smoky > 0.1 && Math.random() < vis * smoky * 2.4) s.on = false;
      if (s.pos.y > CH.y1 - 0.1 || s.pos.y < CH.y0 + 0.1) { s.on = false; arrived++; }
    }
    if (s.on) {
      dummy.position.copy(s.pos);
      dummy.scale.setScalar(0.9);
      ionCol.setHex(s.sign > 0 ? 0xffa94d : 0x74c0fc);
      ionIM.setColorAt(i, ionCol);
    } else {
      dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.001);
      ionCol.setHex(0x000000);
      ionIM.setColorAt(i, ionCol);
    }
    dummy.updateMatrix();
    ionIM.setMatrixAt(i, dummy.matrix);
  }
  ionIM.instanceMatrix.needsUpdate = true;
  if (ionIM.instanceColor) ionIM.instanceColor.needsUpdate = true;
  /* 烟雾颗粒:从进口涌入采样室 */
  smokeAcc += vis * (0.4 + smoky * 5);
  if (smokeAcc >= 1 && smoky > 0.03) {
    smokeAcc = 0;
    const s = smokeState.find(x => !x.on);
    if (s) {
      s.on = true;
      s.pos.set((Math.random() - 0.5) * 0.5, CH.y0 + 0.1, 0.9);
    }
  }
  for (let i = 0; i < SM_N; i++) {
    const s = smokeState[i];
    if (s.on) {
      s.pos.y += vis * s.sp * 0.32;
      s.pos.x += Math.sin(performance.now() / 900 + s.ph) * vis * 0.08;
      if (s.pos.y > CH.y1 - 0.08) s.on = false;
      if (smoky < 0.03) s.on = false;
    }
    if (s.on) {
      dummy.position.copy(s.pos);
      dummy.scale.setScalar(0.7 + 0.6 * Math.sin(s.ph + performance.now() / 800) * 0.3 + 0.3);
      dummy.updateMatrix();
      smokeIM.setMatrixAt(i, dummy.matrix);
    } else {
      dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.001); dummy.updateMatrix();
      smokeIM.setMatrixAt(i, dummy.matrix);
    }
  }
  smokeIM.instanceMatrix.needsUpdate = true;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 1, flashAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const vis = dt * speed;
  if (playing) {
    logicStep(dt);
    sampleAcc += dt;
    while (sampleAcc >= SAMPLE_DT) { sampleAcc -= SAMPLE_DT; pushSample(); }
  }
  updateParticles(vis);
  /* 报警灯闪 / 源辉光 */
  flashAcc += dt;
  const alarmOn = (state === 'alarm' && !muted) || state === 'fault';
  beacon.material.emissiveIntensity = alarmOn ? (Math.sin(flashAcc * 10) > 0 ? 2.2 : 0.1) : 0.12;
  beacon.material.color.setHex(state === 'fault' ? 0xffa94d : 0xff6b6b);
  srcDisc.material.emissiveIntensity = srcIn ? 0.3 + 0.15 * Math.sin(flashAcc * 5) : 0;
  srcDisc.visible = srcIn;
  statsAcc += dt;
  if (statsAcc > 0.25) {
    statsAcc = 0;
    const Is = ionCurrent(), Ir = refCurrent();
    stIs.innerHTML = Is.toFixed(0) + ' <small>pA</small>';
    stIs.className = 'v ' + (Is < Ir * 0.75 ? 'bad' : Is < Ir * 0.95 ? 'warn' : 'ok');
    stIr.innerHTML = Ir.toFixed(0) + ' <small>pA</small>';
    stSm.textContent = smokeNow.toFixed(0) + ' %';
    stAct.textContent = srcIn ? '33 kBq' : '0';
    stSt.textContent = state === 'alarm' && !muted ? L('报警!', 'ALARM') : state === 'fault' ? L('故障', 'FAULT') : L('正常', 'OK');
    stSt.className = 'v ' + (state === 'ok' ? 'ok' : 'bad');
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
smokePct = clamp(qsFloat('smoke', 0), 0, 100);
smokeNow = smokePct;
srcIn = !qsBool('nosrc', false);
for (let i = 0; i < NSAMP; i++) pushSample();
applyTheme();
applyLang();
syncUI();
setPlayLabel();
start();
</script>
