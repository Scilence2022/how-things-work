<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>叶片泵与偏心转子 · 排量听偏心距的,压力听负载的</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="叶片泵与偏心转子" data-en="The Vane Pump">叶片泵与偏心转子</h1>
  <div class="sub" data-zh="转子偏心安在定子腔里,槽中滑片随旋转一伸一缩:相邻叶片间的容积变大就吸油、变小就压油——排量由偏心距说了算,压力由负载说了算;离心力把叶片甩向内壁,缝隙里的泄漏是唯一的账单 · 拖动旋转 / 空格运行/暂停" data-en="Set the rotor off-center in the stator ring and the vanes slide in and out of their slots: the chamber between neighboring vanes grows to inhale oil and shrinks to squeeze it out — displacement is set by the eccentricity, pressure is set by the load; centrifugal force seats the vanes on the ring, and tip leakage is the only bill · drag to orbit / Space = run/pause">转子偏心安在定子腔里,槽中滑片随旋转一伸一缩:相邻叶片间的容积变大就吸油、变小就压油——排量由偏心距说了算,压力由负载说了算;离心力把叶片甩向内壁,缝隙里的泄漏是唯一的账单 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="转速" data-en="Speed">转速</span><span class="v" id="stRpm">—</span>
  <span class="k" data-zh="排量" data-en="Displacement">排量</span><span class="v" id="stDisp">—</span>
  <span class="k" data-zh="出口压力" data-en="Outlet press.">出口压力</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="瞬时流量" data-en="Flow">瞬时流量</span><span class="v" id="stFlow">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bFixed" data-zh="定量泵" data-en="Fixed disp.">定量泵</button>
    <button class="abtn" id="bVar" data-zh="变量泵·偏心可调" data-en="Variable disp.">变量泵·偏心可调</button>
  </div>
  <div class="row">
    <label data-zh="转速" data-en="Speed">转速</label>
    <input id="sRpm" type="range" min="100" max="1800" step="10" value="900">
    <span class="val" id="sRpmVal">900 rpm</span>
  </div>
  <div class="row">
    <label data-zh="偏心距" data-en="Eccentricity">偏心距</label>
    <input id="sEcc" type="range" min="0" max="5" step="0.1" value="3">
    <span class="val" id="sEccVal">3.0 mm</span>
  </div>
  <div class="row">
    <label data-zh="负载压力" data-en="Load press.">负载压力</label>
    <input id="sPress" type="range" min="0" max="25" step="0.5" value="8">
    <span class="val" id="sPressVal">8.0 MPa</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="剖视" data-en="Cutaway">剖视</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../gear-pump/" data-zh="齿轮泵" data-en="Gear Pump">齿轮泵</a>
    <a href="../centrifugal-pump/" data-zh="离心泵与汽蚀" data-en="Centrifugal Pump & Cavitation">离心泵与汽蚀</a>
    <a href="../twin-screw-compressor/" data-zh="双螺杆压缩机" data-en="The Twin-Screw Compressor">双螺杆压缩机</a>
    <a href="../excavator-hydraulics/" data-zh="挖掘机液压" data-en="Excavator Hydraulics">挖掘机液压</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.6,3.7,8.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:叶片泵,轴线沿 X,剖视窗口朝 +Z ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const CY=2.3,RS=1.5,RR=1.1,ESC=0.08,ROOT=0.95;
const colM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const colL=new THREE.Mesh(new THREE.BoxGeometry(0.66,0.5,1.7),colM);
colL.position.set(-0.36,0.25,0);scene.add(colL);
const colR=colL.clone();colR.position.x=0.36;scene.add(colR);
const pan=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.12,1.5),colM);
pan.position.set(0,0.06,0);scene.add(pan);
const shellM=new THREE.MeshStandardMaterial({color:0x5f6b7c,roughness:0.5,metalness:0.5,side:THREE.DoubleSide});
const shellA=new THREE.Mesh(new THREE.CylinderGeometry(1.78,1.78,0.66,64,1,true,0.75,Math.PI*2-1.5),shellM);
shellA.rotation.z=Math.PI/2;shellA.position.y=CY;scene.add(shellA);
const shellB=new THREE.Mesh(new THREE.CylinderGeometry(1.78,1.78,0.66,64,1,true,-0.75,1.5),shellM);
shellB.rotation.z=Math.PI/2;shellB.position.y=CY;scene.add(shellB);
const plateM=new THREE.MeshStandardMaterial({color:0x465060,roughness:0.45,metalness:0.6});
const plateL=new THREE.Mesh(new THREE.RingGeometry(0.3,1.95,48),plateM);
plateL.rotation.y=-Math.PI/2;plateL.position.set(-0.36,CY,0);scene.add(plateL);
const plateR=plateL.clone();plateR.rotation.y=Math.PI/2;plateR.position.x=0.36;scene.add(plateR);
const portM=new THREE.MeshStandardMaterial({color:0x6b7787,roughness:0.4,metalness:0.55});
const pipeIn=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,1.15,24),portM);
pipeIn.position.set(0,4.42,0);scene.add(pipeIn);
const flIn=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.09,24),portM);
flIn.position.set(0,4.97,0);scene.add(flIn);
const pipeOut=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.48,24),portM);
pipeOut.position.set(0,0.38,0);scene.add(pipeOut);
const flOut=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.09,24),portM);
flOut.position.set(0,0.17,0);scene.add(flOut);
const cAxis=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,10),
  new THREE.MeshStandardMaterial({color:0xe9e4dc,emissive:0xe9e4dc,emissiveIntensity:0.5}));
cAxis.position.set(0,CY,0);scene.add(cAxis);
/* 电机与偏心转子组 */
const motorM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.4});
const motor=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.15,1.15),motorM);
motor.position.set(-3.0,CY,0);scene.add(motor);
const rotorG=new THREE.Group();rotorG.position.set(0,CY,0);scene.add(rotorG);
const rotorM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.35,metalness:0.7});
const rotor=new THREE.Mesh(new THREE.CylinderGeometry(RR,RR,0.5,40),rotorM);
rotor.rotation.z=Math.PI/2;rotorG.add(rotor);
const shaftM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85});
const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,2.5,14),shaftM);
shaft.rotation.z=Math.PI/2;shaft.position.x=-1.25;rotorG.add(shaft);
const keyway=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.05,0.26),shaftM);
keyway.position.set(-1.55,0.12,0);rotorG.add(keyway);
const vaneM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85});
const vanes=[];
for(let i=0;i<8;i++){
  const v=new THREE.Mesh(new THREE.BoxGeometry(0.5,1,0.09),vaneM);
  v.rotation.x=i*Math.PI/4;rotorG.add(v);vanes.push(v);
}
/* 偏心距双箭头 + 变量泵调节环 */
const arrM=new THREE.MeshStandardMaterial({color:0xd9822b,roughness:0.4,emissive:0xd9822b,emissiveIntensity:0.35});
const arrCyl=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,1,8),arrM);
arrCyl.rotation.x=Math.PI/2;arrCyl.position.set(0.44,CY,0);scene.add(arrCyl);
const arrC1=new THREE.Mesh(new THREE.ConeGeometry(0.055,0.16,10),arrM);
arrC1.rotation.x=-Math.PI/2;arrC1.position.set(0.44,CY,0.05);scene.add(arrC1);
const arrC2=arrC1.clone();arrC2.rotation.x=Math.PI/2;scene.add(arrC2);
const actRing=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.045,10,24),arrM);
actRing.rotation.y=Math.PI/2;actRing.position.set(-0.85,CY,0);actRing.visible=false;scene.add(actRing);
/* 油液粒子 */
const NP=170;
const oilM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.35,metalness:0.1});
const drops=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,8),oilM,NP);
drops.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(drops);
const pd=[];for(let i=0;i<NP;i++)pd.push({m:i%8<5?0:2,k:i%8,f:Math.random(),rf:Math.random(),
  px:(Math.random()-0.5)*0.34,pz:(Math.random()-0.5)*0.3,y:0});

/* 状态 */
let mode='fixed',rpm=900,ecc=3,press=8,playing=true,labelsOn=true,slowMo=false,cut=true;
let rotorAngle=0,simT=0,vane0Phi=0,vane0Out=0,Qact=0,leakFrac=0,Pout=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const wrapA=a=>{a%=Math.PI*2;return a<0?a+Math.PI*2:a;};
function tWall(phi){/* 定子内壁到转子中心的距离 */
  const s=ecc*ESC,cu=s*Math.sin(phi);
  return -cu+Math.sqrt(Math.max(1e-4,RS*RS-s*s+cu*cu));}
function qth(){return 6*ecc*rpm/1000;}
function leakQ(){return rpm>0?press*(0.02+0.008*ecc):0;}
function hydraulics(){const q=qth(),lk=leakQ();
  Qact=Math.max(0,q-lk);leakFrac=q>0.2?lk/q:0;Pout=q>0.08?press:0;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('进油口 · 低压','Inlet · low pressure'),new THREE.Vector3(0,5.2,0),'b');
addLabel(()=>L(`排油口 · ${Pout.toFixed(1)} MPa`,`Outlet · ${Pout.toFixed(1)} MPa`),
  new THREE.Vector3(0,-0.3,0),'r');
const vaneLbl=addLabel(()=>L(`滑片 · 伸出 ${vane0Out.toFixed(1)} mm`,`Vane · extends ${vane0Out.toFixed(1)} mm`),
  new THREE.Vector3(0.32,3.7,0.3),'y');
const eccLbl=addLabel(()=>L(`偏心距 e = ${ecc.toFixed(1)} mm`,`Eccentricity e = ${ecc.toFixed(1)} mm`),
  new THREE.Vector3(0.44,CY,0.3),'o');

function setRpm(v){rpm=clamp(v,100,1800);
  document.getElementById('sRpm').value=rpm;
  document.getElementById('sRpmVal').textContent=rpm.toFixed(0)+' rpm';updateStats();}
function setEcc(v){ecc=clamp(v,0,5);
  document.getElementById('sEcc').value=ecc;
  document.getElementById('sEccVal').textContent=ecc.toFixed(1)+' mm';updateStats();}
function setPress(v){press=clamp(v,0,25);
  document.getElementById('sPress').value=press;
  document.getElementById('sPressVal').textContent=press.toFixed(1)+' MPa';updateStats();}
function setMode(m){mode=m;
  document.getElementById('bFixed').classList.toggle('on',m==='fixed');
  document.getElementById('bVar').classList.toggle('on',m==='var');
  document.getElementById('sEcc').disabled=(m==='fixed');
  actRing.visible=(m==='var');
  if(m==='fixed')setEcc(3);
  updateStats();}

const STEPS=[
 {zh:'<b>正常泵送</b>:容积一涨一缩,油从进口走到出口',en:'<b>Normal pumping</b>: chambers swell and shrink, oil goes in and out',
  act(){setMode('fixed');setRpm(900);setEcc(3);setPress(8);}},
 {zh:'<b>吸油行程</b>:相邻叶片间容积长大,把油含住',en:'<b>Suction stroke</b>: the chamber between vanes grows and traps oil',
  act(){setRpm(220);}},
 {zh:'<b>排油行程</b>:容积缩小,油从排油口被挤出',en:'<b>Discharge stroke</b>: the shrinking chamber squeezes oil out',
  act(){setRpm(900);}},
 {zh:'<b>偏心距定排量</b>:偏心归零,流量跟着归零',en:'<b>Eccentricity sets displacement</b>: zero offset, zero flow',
  act(){setMode('var');setEcc(0.3);setRpm(900);}},
 {zh:'<b>负载定压力</b>:压力拉满,流量几乎不变——容积式的底气',en:'<b>Load sets pressure</b>: max pressure, flow barely moves — the positive-displacement way',
  act(){setPress(25);setRpm(900);setEcc(3);}},
 {zh:'<b>泄漏</b>:偏心大+转速低,缝隙回吐吃掉流量',en:'<b>Leakage</b>: big offset + low rpm, tip leakage eats the flow',
  act(){setMode('var');setEcc(5);setRpm(180);setPress(18);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  hydraulics();
  document.getElementById('stRpm').innerHTML=rpm.toFixed(0)+'<small> rpm</small>';
  document.getElementById('stDisp').innerHTML=(6*ecc).toFixed(1)+'<small> mL/rev</small>';
  const pv=document.getElementById('stP');
  pv.innerHTML=Pout.toFixed(1)+'<small> MPa</small>';
  pv.className='v '+(press>18?'warn':'ok');
  const fv=document.getElementById('stFlow');
  fv.innerHTML=Qact.toFixed(2)+'<small> L/min</small>';
  fv.className='v '+(leakFrac>0.18?'warn':'ok');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bFixed').addEventListener('click',()=>setMode('fixed'));
document.getElementById('bVar').addEventListener('click',()=>setMode('var'));
document.getElementById('sRpm').addEventListener('input',e=>setRpm(+e.target.value));
document.getElementById('sEcc').addEventListener('input',e=>setEcc(+e.target.value));
document.getElementById('sPress').addEventListener('input',e=>setPress(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{
  cut=e.target.checked;shellB.visible=!cut;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  hydraulics();
  rotorAngle+=dts*rpm*0.0035;
  const eS=ecc*ESC;
  rotorG.rotation.x=-rotorAngle;
  rotorG.position.z=eS;
  motor.position.y=CY+Math.sin(simT*40)*0.004*(rpm/1800);
  actRing.position.z=eS;
  /* 滑片随角度伸缩:伸出量=触到定子内壁 */
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4,phi=wrapA(a-rotorAngle);
    const len=Math.max(0.02,tWall(phi)-ROOT),mid=ROOT+len/2,v=vanes[i];
    v.scale.y=len;v.position.set(0,Math.cos(a)*mid,Math.sin(a)*mid);
    if(i===0){vane0Phi=phi;vane0Out=(tWall(phi)-RR)/ESC;}
  }
  /* 偏心距双箭头 */
  const showE=eS>0.06;
  arrCyl.visible=showE;arrC2.visible=showE;
  arrCyl.scale.y=Math.max(eS,0.02);arrCyl.position.z=eS/2;
  arrC2.position.z=Math.max(eS-0.05,0.05);
  const t0w=tWall(vane0Phi);
  vaneLbl.position.set(0.32,CY+Math.cos(vane0Phi)*(t0w+0.15),eS+Math.sin(vane0Phi)*(t0w+0.15));
  eccLbl.position.set(0.44,CY,eS*0.5+0.2);
  /* 油液粒子:腔内被搬运,出油口排入油盘,再从进油口回来 */
  const spd=clamp(0.25+Qact*0.09,0.25,1.8),pumping=qth()>0.06;
  for(let i=0;i<NP;i++){
    const p=pd[i];let x,y,z,c;
    if(p.m===0){
      const phi=wrapA(p.k*Math.PI/4-rotorAngle+(p.f-0.5)*0.5);
      const rad=RR+0.07+p.rf*Math.max(0.03,tWall(phi)-RR-0.13);
      x=p.px;y=CY+Math.cos(phi)*rad;z=eS+Math.sin(phi)*rad;
      c=Math.cos(phi)<0?0xff9e80:0x74c0fc;
      if(pumping&&wrapA(phi+Math.PI)<0.45){p.m=1;p.y=CY-RS-eS-0.04;}
    }else if(p.m===1){
      p.y-=spd*dts;x=p.px;y=p.y;z=0;c=0xff6b6b;
      if(p.y<0.2){p.m=2;p.y=4.9;p.px=(Math.random()-0.5)*0.3;}
    }else{
      p.y-=spd*dts;x=p.px;y=p.y;z=p.pz;c=0x91d0ff;
      if(p.y<CY+RS+eS+0.12){
        p.m=0;p.k=Math.round(rotorAngle/(Math.PI/4))&7;
        p.f=Math.random();p.rf=Math.random();}
    }
    m4.makeScale(1,1,1);m4.setPosition(x,y,z);
    drops.setMatrixAt(i,m4);
    drops.setColorAt(i,tmpC.setHex(c));
  }
  drops.instanceMatrix.needsUpdate=true;
  if(drops.instanceColor)drops.instanceColor.needsUpdate=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
const m4=new THREE.Matrix4(),tmpC=new THREE.Color();
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
