<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大气环流 · 被拧弯的三圈环流</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,120,80,.9); color: #ffc9b2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.u { color: #ffb38a; border-color: rgba(255,150,90,.7); }
  .chip.d { color: #a5d8ff; border-color: rgba(116,192,252,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="大气环流:被拧弯的三圈环流" data-en="Atmospheric Circulation: three twisted cells">大气环流：被拧弯的三圈环流</h1>
  <div class="sub" data-zh="赤道受热上升 → 哈德里三圈;科里奥利把南北风拧成信风/西风带——撒哈拉为什么长在 30° · 空格播放/暂停" data-en="Heat rises at the equator → three Hadley cells; Coriolis twists N-S winds into trades and westerlies — why the Sahara sits at 30° · Space = play/pause">赤道受热上升 → 哈德里三圈；科里奥利把南北风拧成信风/西风带——撒哈拉为什么长在 30° · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="自转角速度" data-en="spin rate">自转角速度</span><span class="v g" id="stSpin">—</span>
  <span class="k" data-zh="信风偏角" data-en="trade deflection">信风偏角</span><span class="v" id="stDef">—</span>
  <span class="k" data-zh="30° 副热带" data-en="30° subtropics">30° 副热带</span><span class="v" style="font-size:14px">干燥少雨(沙漠带)</span>
  <span class="k" data-zh="赤道" data-en="equator">赤道</span><span class="v" style="font-size:14px">湿热多雨</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.u" data-zh="上升支(湿热成云降雨)" data-en="rising branch (wet, rainy)">上升支(湿热成云降雨)</span>
    <span class="chip.d" data-zh="下降支(干热无云)" data-en="sinking branch (dry)">下降支(干热无云)</span>
  </div>
  <div class="row"><label data-zh="地球自转速度" data-en="spin rate">地球自转速度</label><input id="spin" type="range" min="0" max="100" step="1" value="100"><span class="val" id="spinVal">1.0×</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cloud-formation/" data-zh="上升之后:成云致雨" data-en="after rising: clouds and rain">上升之后:成云致雨</a>
    <a href="../angular-momentum/" data-zh="科里奥利的本质:角动量" data-en="Coriolis is angular momentum">科里奥利的本质:角动量</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xdfe9f2 : 0x0a0f16);
  starMat.opacity = THEME === 'dark' ? 0.7 : 0;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('大气环流', 'Atmospheric Circulation');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.6, 2.2, 5.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(6, 3, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 2, -4);
scene.add(fill);

/* 星空 */
const starMat = new THREE.PointsMaterial({ color: 0x9fb0c3, size: 0.05, transparent: true, opacity: 0.7 });
{
  const g = new THREE.BufferGeometry();
  const N = 350, arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, r = 10 + Math.random() * 16;
    arr[i * 3] = Math.cos(a) * r; arr[i * 3 + 1] = (Math.random() - 0.3) * 16; arr[i * 3 + 2] = Math.sin(a) * r;
  }
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  scene.add(new THREE.Points(g, starMat));
}

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  globe: mat(0x3a7ec0, { opacity: 1 }),
  rise: new THREE.MeshBasicMaterial({ color: 0xffa864, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.85 }),
  sink: new THREE.MeshBasicMaterial({ color: 0x74c0fc, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8 }),
  wind: new THREE.MeshBasicMaterial({ color: 0xffe8cc, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.9 }),
  band: new THREE.MeshBasicMaterial({ color: 0xd8b46a, transparent: true, opacity: 0.35 }),
};

/* ================= 地球(自转轴竖直) ================= */
const globe = new THREE.Mesh(new THREE.SphereGeometry(1.6, 48, 36), M.globe);
scene.add(globe);
const axis = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 4.4, 8),
  new THREE.MeshBasicMaterial({ color: 0x8a93a3 }));
scene.add(axis);

/* 纬度圈色带(赤道湿绿/30°沙黄/60°湿/极地白) */
function latBand(latDeg, color, op) {
  const lat = latDeg * Math.PI / 180;
  const r = 1.615 * Math.cos(lat);
  const y = 1.615 * Math.sin(lat);
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, 0.045, 8, 64), M.band.clone());
  m.material.color = new THREE.Color(color);
  m.material.opacity = op;
  m.rotation.x = Math.PI / 2;
  m.position.y = y;
  scene.add(m);
}
latBand(0, 0x2f9e44, 0.5);
latBand(30, 0xd8b46a, 0.6);
latBand(-30, 0xd8b46a, 0.6);
latBand(60, 0x2f9e44, 0.4);
latBand(-60, 0x2f9e44, 0.4);

/* ================= 哈德里环流粒子(6 条环:每半球 3 圈) ================= */
const CELL = [
  { lat0: 0, lat1: 30, hemi: 1 },
  { lat0: 30, lat1: 60, hemi: 1 },
  { lat0: 60, lat1: 90, hemi: 1 },
  { lat0: 0, lat1: -30, hemi: -1 },
  { lat0: 30, lat1: -60, hemi: -1 },
  { lat0: 60, lat1: -90, hemi: -1 },
];
const cellParts = [];
for (const c of CELL) {
  for (let i = 0; i < 26; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), c.lat0 === 0 ? M.rise : (Math.abs(c.lat1) >= 90 || Math.abs(c.lat0) >= 90 ? M.sink : M.rise));
    scene.add(m);
    cellParts.push({ mesh: m, c, t: i / 26 });
  }
}
function cellPos(t, c) {
  /* 环:沿经圈(赤道升 → 30° 降 → 贴地回),再叠自转 */
  const R = 1.95;
  const latA = c.lat0 * Math.PI / 180, latB = c.lat1 * Math.PI / 180;
  /* t:0..1;前半段高空从 latA→latB,后半段贴地回来 */
  let lat, h;
  if (t < 0.5) {
    const k = t / 0.5;
    lat = lerp(latA, latB, k);
    h = Math.sin(k * Math.PI) * 0.75 + 0.12;
  } else {
    const k = (t - 0.5) / 0.5;
    lat = lerp(latB, latA, k);
    h = 0.1 + Math.sin(k * Math.PI) * 0.06;
  }
  const r = R + h;
  return new THREE.Vector3(Math.cos(lat) * r, Math.sin(lat) * r, 0);
}

/* 地面风箭(信风/西风带) */
const windArrows = [];
function mkArrow(latDeg, kind) {
  /* kind: 'trade' | 'westerly' */
  const lat = latDeg * Math.PI / 180;
  const r = 1.68;
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.5, 6), M.wind);
  shaft.rotation.z = Math.PI / 2;
  g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 8), M.wind);
  tip.rotation.z = -Math.PI / 2;
  tip.position.x = 0.3;
  g.add(tip);
  g.position.set(0, Math.sin(lat) * r, Math.cos(lat) * r);
  g.rotation.x = -lat;
  g.userData = { kind, latDeg };
  scene.add(g);
  windArrows.push(g);
  return g;
}
mkArrow(-22, 'trade'); mkArrow(-18, 'trade');
mkArrow(18, 'trade'); mkArrow(22, 'trade');
mkArrow(-48, 'westerly'); mkArrow(-42, 'westerly');
mkArrow(48, 'westerly'); mkArrow(42, 'westerly');

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let spin = 1;              // 0-1 自转强度(科里奥利强度)
let tSim = 0;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblEq = addLabel(() => L('赤道:阳光直射,湿热空气猛烈上升(上升支=多云多雨)', 
  'equator: direct sun, hot wet air surges upward (rising branch = clouds and rain)'),
  new THREE.Vector3(0, 2.9, 0), 'g');
const lbl30 = addLabel(() => L('30°:空气已把水汽丢在赤道,干着地、下沉增温——撒哈拉、阿拉伯都在这条沙黄带上', 
  '30°: the air lost its moisture at the equator; it descends dry and warming — Sahara and Arabia sit on this gold band'),
  new THREE.Vector3(0.9, 1.65, 0), 'st');
const lblCor = addLabel(() => spin < 0.05
  ? L('自转≈0:气流老老实实南来北往——没有信风,没有气旋', 
      'spin ≈ 0: winds run straight N-S — no trades, no cyclones')
  : L('自转拧风:北半球右偏(东北信风)、南半球左偏;自转越快拧得越狠', 
      'spin twists winds: right in the north (NE trades), left in the south — faster spin, harder twist'),
  new THREE.Vector3(0, -2.35, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '热机:赤道是锅炉', be: 'The engine: equator as boiler',
    d: '赤道直射受热最强,湿热空气上升;到高空向两极方向流——大气这台热机永远在把赤道的热往外运。',
    de: 'Direct sun heats the equator hardest; hot wet air rises and flows poleward aloft — the atmosphere endlessly exports equatorial heat.',
    act: () => {} },
  { b: '下沉:30° 是沙漠带', be: 'Deserts at 30°',
    d: '流到 30° 的空气已把水汽在赤道上空下完,干冷下沉、压缩增温——彻底干燥:撒哈拉、阿拉伯、澳洲内陆全在这条带。',
    de: 'By 30° the air has dumped its moisture; it descends dry and compresses warm — bone dry: Sahara, Arabia, the Australian outback.',
    act: () => {} },
  { b: '三圈:不是一圈是三圈', be: 'Not one cell — three',
    d: '理想单圈被搅成三圈:哈德里(0-30°)、费雷尔(30-60°)、极地(60-90°)——每半球三套,共六个。',
    de: 'The ideal single cell shatters into three: Hadley (0-30°), Ferrel (30-60°), polar (60-90°) — three per hemisphere, six total.',
    act: () => {} },
  { b: '科里奥利:拧风的手', be: 'Coriolis: the twisting hand',
    d: '地球自转让运动物体偏转(北右南左):南北风被拧成东北/东南信风与西风带——把「自转速度」拖到 0 看直吹的世界。',
    de: 'Rotation deflects movers (right in N, left in S): N-S winds twist into trades and westerlies. Drag spin to 0 for a straight-line world.',
    act: () => { document.getElementById('spin').value = 0; document.getElementById('spin').dispatchEvent(new Event('input')); } },
  { b: '帆船时代的公路网', be: 'The sailing-era highway',
    d: '信风推帆船横渡大西洋,西风带送帆船回家——哥伦布的航线就是画在环流图上的;今天航班也循着急流飞。',
    de: 'Trades carried sailing ships across the Atlantic; westerlies brought them home — Columbus\' route was drawn on this map; jets still ride it today.',
    act: () => {} },
];
function stepIndex() {
  if (spin > 0.6) return 3;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
document.getElementById('spin').addEventListener('input', e => {
  spin = parseInt(e.target.value) / 100;
  document.getElementById('spinVal').textContent = spin.toFixed(1) + '×';
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  /* 自转 */
  globe.rotation.y += dts * 0.22 * spin;
  /* 环流粒子 */
  for (const p of cellParts) {
    p.t = (p.t + dts * 0.09) % 1;
    const pos = cellPos(p.t, p.c);
    /* 环在 y-z 平面(经圈),绕轴分布到不同经度 */
    const lon = (p.c.hemi > 0 ? 0.5 : -0.5) + (p.c.lat0 > 30 || p.c.lat0 < -30 ? 0.35 : 0);
    const px = pos.x;
    const yz = new THREE.Vector2(pos.y, pos.z);
    p.mesh.position.set(px, yz.x, yz.y * Math.sign(lon));
    p.mesh.visible = true;
  }
  /* 风箭:偏转角随自转强度 */
  for (const a of windArrows) {
    const kind = a.userData.kind;
    const sgn = a.userData.latDeg > 0 ? 1 : -1;
    const defl = spin * (kind === 'trade' ? -0.6 : 0.9) * sgn;
    a.rotation.y = defl;
    a.rotation.x = -a.userData.latDeg * Math.PI / 180;
  }

  document.getElementById('stSpin').innerHTML = spin.toFixed(1) + '<small>×(科氏强度)</small>';
  document.getElementById('stDef').innerHTML = (spin * 45).toFixed(0) + '<small>°(演示)</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
