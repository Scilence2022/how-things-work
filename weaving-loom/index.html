<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>织机与提花 · 打孔卡是最早的程序</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#2a9d8f;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1f7a70;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(42,157,143,.6);background:rgba(42,157,143,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(31,122,112,.55);background:rgba(31,122,112,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(42,157,143,.10);border-color:rgba(42,157,143,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(31,122,112,.08);border-color:rgba(31,122,112,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#a5ece3}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="织机与提花" data-en="The Loom &amp; Jacquard">织机与提花</h1>
  <div class="sub" data-zh="经线被综框分上下两片拉开成梭口→梭子引着纬线飞越梭口→钢筘把新纬打进织口压紧→卷取送经、循环往复→平纹一上一下最紧实、斜纹错位留浮长出斜线、缎纹散点浮长出光泽→提花机(1804)用打孔卡逐纬决定哪根经针抬起:穿孔=程序,织机=第一台可编程机器 · 拖动旋转 / 空格运行/暂停" data-en="Heddle frames split the warp up and down into a shed → the shuttle flies the weft across → the reed beats each pick into the fell → take-up and let-off repeat the cycle → plain weave 1-up-1-down is firmest, twill staggers floats into diagonals, satin scatters them for lustre → the Jacquard loom (1804) reads a punched card each pick to lift individual threads: the holes were programs, the loom the first programmable machine · drag to orbit / Space = run/pause">经线被综框分上下两片拉开成梭口→梭子引着纬线飞越梭口→钢筘把新纬打进织口压紧→卷取送经、循环往复→平纹一上一下最紧实、斜纹错位留浮长出斜线、缎纹散点浮长出光泽→提花机(1804)用打孔卡逐纬决定哪根经针抬起:穿孔=程序,织机=第一台可编程机器 · 拖动旋转 / 空格运行/暂停</div>
</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <span class="k" data-zh="已织纬线" data-en="Picks woven">已织纬线</span><span class="v" id="stPicks">—</span>
  <span class="k" data-zh="梭速" data-en="Shuttle speed">梭速</span><span class="v" id="stSh">—</span>

  <div id="ctrl">

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>

  <div id="rel">

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 织造循环:开梭口→引纬→打纬→卷取;
   组织点 (pick k, warp c):平纹 (c+k)%2==0 经面;斜纹 (c+k)%3!=0 经面(2/1ↆ);
   提花:菱形图案 lift(c)=|c-中心| <= 2+三角波(k%16)。
   综框:平纹 2 片 / 斜纹 3 片 / 提花单针控制;打孔卡 = 逐纬程序存储 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x11141a,14,40);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(0.5,4.4,8.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=22;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(5,9,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.35);fill.position.set(-7,5,-5);scene.add(fill);

/* ── 机架 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x171b21,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(13,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-1.45;scene.add(ground);
const woodM=new THREE.MeshStandardMaterial({color:0x5a4a38,roughness:0.75,metalness:0.1});
const beamM=new THREE.MeshStandardMaterial({color:0x3f4750,roughness:0.5,metalness:0.5});
let N=24;const DX=0.15;
let W=()=>N*DX;
const postL=new THREE.Mesh(new THREE.BoxGeometry(0.16,2.4,0.3),woodM);
postL.position.set(-(N*DX/2+0.75),-0.25,0.2);scene.add(postL);
const postR=new THREE.Mesh(new THREE.BoxGeometry(0.16,2.4,0.3),woodM);
postR.position.set(N*DX/2+0.75,-0.25,0.2);scene.add(postR);
const topBeam=new THREE.Mesh(new THREE.BoxGeometry(N*DX+1.9,0.16,0.22),woodM);
topBeam.position.set(0,0.98,0.2);scene.add(topBeam);
const backBeam=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,N*DX+1.6,20),beamM);
backBeam.rotation.z=Math.PI/2;backBeam.position.set(0,0,2.9);scene.add(backBeam);
const clothBeam=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,N*DX+1.6,20),beamM);
clothBeam.rotation.z=Math.PI/2;clothBeam.position.set(0,-0.42,-2.95);scene.add(clothBeam);

/* ── 经线 ── */
const warpM=new THREE.MeshBasicMaterial({color:0xcfc6b2,transparent:true,opacity:0.95});
const warpHotM=new THREE.MeshBasicMaterial({color:0xffd98a,transparent:true,opacity:1});
let warpLines=[];
function buildWarp(){
  for(const w of warpLines){scene.remove(w);w.geometry.dispose();}
  warpLines=[];
  for(let c=0;c<N;c++){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(4*3),3));
    const ln=new THREE.Line(g,warpM.clone());
    ln.frustumCulled=false;scene.add(ln);
    warpLines.push({ln,x:-W()/2+DX/2+c*DX});
  }
}

/* ── 综框 ── */
const shaftM=new THREE.MeshStandardMaterial({color:0x8a6a45,roughness:0.65});
let shafts=[];
function buildShafts(nS){
  for(const s of shafts){scene.remove(s.g);}
  shafts=[];
  for(let i=0;i<nS;i++){
    const g=new THREE.Group();
    for(const sx of [-1,1]){
      const bar=new THREE.Mesh(new THREE.BoxGeometry(0.05,1.15,0.05),shaftM);
      bar.position.set(sx*(W()/2+0.28),0,0);g.add(bar);
    }
    for(const sy of [-0.55,0.55]){
      const slat=new THREE.Mesh(new THREE.BoxGeometry(W()+0.6,0.05,0.04),shaftM);
      slat.position.set(0,sy,0);g.add(slat);
    }
    g.position.set(0,0,1.5-i*0.22);
    scene.add(g);shafts.push({g,idx:i});
  }
}

/* ── 钢筘 ── */
const reedG=new THREE.Group();scene.add(reedG);
{
  const barTop=new THREE.Mesh(new THREE.BoxGeometry(1,0.05,0.03),woodM);
  barTop.position.y=0.42;barTop.scale.x=1;reedG.add(barTop);
  const barBot=new THREE.Mesh(new THREE.BoxGeometry(1,0.05,0.03),woodM);
  barBot.position.y=-0.4;reedG.add(barBot);
}
let reedSlats=[];
function buildReed(){
  for(const s of reedSlats)reedG.remove(s);
  reedSlats=[];
  for(let c=0;c<=N;c++){
    const s=new THREE.Mesh(new THREE.BoxGeometry(0.022,0.84,0.022),beamM);
    s.position.set(-W()/2+c*DX,0,0);reedG.add(s);reedSlats.push(s);
  }
  reedG.children[0].scale.x=W()/1+0.35;
  reedG.children[1].scale.x=W()/1+0.35;
}
reedG.userData.fixBars=()=>{reedG.children[0].scale.x=W()+0.35;reedG.children[1].scale.x=W()+0.35;};
buildReed();reedG.userData.fixBars();

/* ── 织物:实例化网格,经面/纬面双色 ── */
const MAXC=32,MAXR=28;
const clothM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.85,metalness:0});
const clothIM=new THREE.InstancedMesh(new THREE.BoxGeometry(0.132,0.03,0.075),clothM,MAXC*MAXR);
clothIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(clothIM);
const cWarp=new THREE.Color(0xd8cfbc),cWeft=new THREE.Color(0x4a63d8),cHide=new THREE.Color(0x000000);
let rowsData=[];   /* {k, mode} 由新到旧 */
let shiftZ=0;
const m4=new THREE.Matrix4();
function liftRule(k,c,md){
  if(md==='plain')return (c+k)%2===0;
  if(md==='twill')return (c+k)%3!==0;
  const cc=Math.abs(c-(N-1)/2);
  const r16=k%16,tri=r16<8?r16:15-r16;
  return cc<=2+tri*0.9;
}
function renderCloth(){
  let idx=0;
  for(let r=0;r<rowsData.length&&r<MAXR;r++){
    const rd=rowsData[r],z=-0.06-r*densDr()+shiftZ;
    if(z<-2.6)continue;
    for(let c=0;c<N;c++){
      const up=liftRule(rd.k,c,rd.mode);
      m4.makeTranslation(-W()/2+DX/2+c*DX,up?0.018:-0.018,z);
      clothIM.setMatrixAt(idx,m4);
      clothIM.setColorAt(idx,up?cWarp:cWeft);
      idx++;
    }
  }
  clothIM.count=idx;
  clothIM.instanceMatrix.needsUpdate=true;
  if(clothIM.instanceColor)clothIM.instanceColor.needsUpdate=true;
}
function densDr(){return 2.6/dens;}   /* 视觉行距随纬密变化 */

/* ── 梭子 ── */
const shuttleG=new THREE.Group();scene.add(shuttleG);
const shuttleBody=new THREE.Mesh(new THREE.CapsuleGeometry(0.075,0.42,6,12),
  new THREE.MeshStandardMaterial({color:0x8a5a2b,roughness:0.5,metalness:0.2,
    emissive:0xffa042,emissiveIntensity:0.35}));
shuttleBody.rotation.z=Math.PI/2;shuttleG.add(shuttleBody);
function glowTex(){
  const cv=document.createElement('canvas');cv.width=cv.height=128;const c=cv.getContext('2d');
  const g=c.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,220,160,0.85)');g.addColorStop(1,'rgba(255,220,160,0)');
  c.fillStyle=g;c.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const shuttleGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),color:0xffc070,
  transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
shuttleGlow.scale.setScalar(1.1);shuttleG.add(shuttleGlow);
shuttleG.visible=false;

pickGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(MAXC*3),3));
pickGeo.setDrawRange(0,N);
const pickLine=new THREE.Line(pickGeo,new THREE.LineBasicMaterial({color:0x7d8fe8,transparent:true,opacity:0.95}));

const cardBand=new THREE.Mesh(new THREE.BoxGeometry(0.62,1.3,0.02),

cardG.add(cardBand);
const holeM=new THREE.MeshStandardMaterial({color:0x22252b,roughness:0.6});
const holes=[];
for(let r=0;r<8;r++){
  for(let c=0;c<12;c++){
    const h=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.045,10),holeM);

    cardG.add(h);holes.push(h);

/* ── 状态 ── */
let mode='plain',spd=1,dens=26;
let playing=true,labelsOn=true,slowMo=false,cardOn=true;
let simT=0,cycT=0,picks=0,shuttleDir=1;
const qs=new URLSearchParams(location.search);

if(qs.get('labels')==='0')labelsOn=false;

const PH={open:0.8,pass:0.95,beat:0.62,close:0.4,take:0.62};
const CYC=PH.open+PH.pass+PH.beat+PH.close+PH.take;
let stat={picks:0,sh:0,groups:2,len:0};

}
let shedAmt=0,liftArr=new Array(MAXC).fill(0);
const lblWarp=addLabel(()=>L('经线 · 纵向绷紧','warp · stretched lengthwise'),new THREE.Vector3(-W()/2-0.5,0.75,2.0),'b');

const lblFell=addLabel(()=>L('织口 · 每纬推进一格','fell · advances one pick at a time'),new THREE.Vector3(W()/2+0.4,0.18,0.15),'');
const lblCard=addLabel(()=>L('打孔卡 · 有孔=抬起该经线','punched card · hole = lift that warp'),new THREE.Vector3(0,2.0,0),'r',

const lblShaft=addLabel(()=>L('综框 · 提起自己那组经线','heddle shafts · each lifts its own set'),new THREE.Vector3(-W()/2-0.5,1.15,1.4),'g',
  ()=>mode!=='jacq');

function setSpd(vv){spd=clamp(vv,0.5,2);
  document.getElementById('sSpd').value=spd;
  document.getElementById('sSpdVal').textContent='×'+spd.toFixed(2);}
function setWarp(vv){
  N=Math.round(clamp(vv,16,32)/4)*4;
  document.getElementById('sWarp').value=N;
  document.getElementById('sWarpVal').textContent=N+' 根';
  postL.position.x=-(W()/2+0.75);postR.position.x=W()/2+0.75;
  topBeam.scale.x=(N*DX+1.9)/(N0DX+1.9);topBeam.position.x=0;
  backBeam.scale.y=(N*DX+1.6)/(N0DX+1.6);clothBeam.scale.y=(N*DX+1.6)/(N0DX+1.6);
  buildWarp();buildReed();reedG.userData.fixBars();
  pickGeo.setDrawRange(0,N);
  cardG.position.x=W()/2+1.35;
  buildShafts(mode==='plain'?2:3);
  renderCloth();
}
function setDens(vv){dens=clamp(vv,18,40);
  document.getElementById('sDens').value=dens;
  document.getElementById('sDensVal').textContent=dens.toFixed(0)+' /cm';
  renderCloth();}
function setMode(m){mode=m;
  document.getElementById('bPlain').classList.toggle('on',m==='plain');
  document.getElementById('bTwill').classList.toggle('on',m==='twill');
  document.getElementById('bJacq').classList.toggle('on',m==='jacq');
  buildShafts(m==='plain'?2:3);
  shafts.forEach(s=>s.g.visible=(m!=='jacq'));
  cardG.visible=(m==='jacq');
}
const N0DX=24*DX;   /* 初始横梁几何长度基准 */

const STEPS=[
 {b:'经线与综框',be:'Warp and heddle shafts',
  d:'经线纵向绷紧在织机前后梁之间,每根穿在一个综框的综眼里;综框升降,带动自己那一组经线——这是"提综"。',
  de:'Warp yarns stretch lengthwise between the beams, each threaded through a heddle eye on a shaft; raising a shaft lifts its own set of warp threads — the shedding prep.',
  act(){setMode('plain');}},
 {b:'开梭口',be:'Open the shed',
  d:'综框把经线分成上下两片,中间张开一个楔形通道——梭口;织什么组织,取决于这一纬谁上谁下。',
  de:'The shafts split the warp into upper and lower layers, opening a wedge-shaped tunnel — the shed; which threads go up decides the weave structure of this pick.',

 {b:'梭子引纬',be:'Shuttle carries the weft',
  d:'梭子拖着纬线从梭口一侧飞到另一侧,纬线被留在下片经线上方、上片经线下方——水平方向只有这一根纬纱。',
  de:'The shuttle shoots across the shed trailing its weft, leaving it above the lower layer and below the upper layer — one horizontal yarn per pass.',

 {b:'钢筘打纬',be:'The reed beats',

 {b:'卷取与送经',be:'Take-up and let-off',
  d:'织好的布被卷取辊带走一格,送经机构放出新的经线补上——梭口闭合,下一纬开始;织机就是这样一纬一纬"逐行打印"布料。',
  de:'The take-up rolls the woven cloth forward one pick, let-off feeds fresh warp to replace it, the shed closes and the next pick begins — the loom prints fabric row by row.',
  act(){setSpd(1.5);}},
 {b:'平纹:一上一下',be:'Plain weave: 1-up-1-down',
  d:'相邻经线升降相反、每纬都交织,组织点最多——布最紧实耐磨、正反同貌,衬衫和帆布都是它。',
  de:'Neighboring warps alternate and interlace every pick — the most interlacings, the firmest and most reversible cloth: shirting and canvas.',

 {b:'斜纹:错位浮长',be:'Twill: staggered floats',

  de:'Jacquard\u2019s 1804 loom read a chain of punched cards, one per pick, lifting exactly the needles whose holes were punched: the card chain stored the program, making the loom the first programmable machine — later inspiring Babbage and Hollerith.',
  act(){setMode('jacq');setSpd(0.9);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stPicks').innerHTML=picks.toFixed(0)+'<small> 纬</small>';
  document.getElementById('stSh').innerHTML=(12*spd).toFixed(1)+'<small> m/s</small>';
  const gv=document.getElementById('stShaft');
  gv.innerHTML=mode==='jacq'?N+'<small> 针</small>':(mode==='plain'?2:3)+'<small> 片</small>';
  gv.className='v '+(mode==='jacq'?'warn':'');
  document.getElementById('stLen').innerHTML=(picks/dens).toFixed(1)+'<small> cm</small>';
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='en'?'zh':'en';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bPlain').addEventListener('click',()=>setMode('plain'));
document.getElementById('bTwill').addEventListener('click',()=>setMode('twill'));
document.getElementById('bJacq').addEventListener('click',()=>setMode('jacq'));
document.getElementById('sSpd').addEventListener('input',e=>setSpd(+e.target.value));
document.getElementById('sWarp').addEventListener('input',e=>setWarp(+e.target.value));
document.getElementById('sDens').addEventListener('input',e=>setDens(+e.target.value));

document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x11141a:0xe9e4dc);
  scene.fog.color.setHex(dark?0x11141a:0xe9e4dc);
  groundM.color.setHex(dark?0x171b21:0xd8d0c2);
  woodM.color.setHex(dark?0x5a4a38:0xa8896a);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  cycT+=dts*spd;
  if(cycT>=CYC){cycT-=CYC;}
  /* ── 提升量 ── */
  let target=0;
  if(cycT<PH.open)target=smooth(cycT/PH.open);
  else if(cycT<PH.open+PH.pass+PH.beat)target=1;
  else if(cycT<PH.open+PH.pass+PH.beat+PH.close)target=1-smooth((cycT-PH.open-PH.pass-PH.beat)/PH.close);
  shedAmt+=(target-shedAmt)*Math.min(1,10*dts);
  const k=picks;   /* 本纬编号 */
  if(cycT<PH.open)justPicked=false;
  for(let c=0;c<N;c++){
    const up=liftRule(k,c,mode);
    liftArr[c]=up?shedAmt:-shedAmt*0.9;
  }
  /* ── 经线形变 ── */
  for(let c=0;c<N;c++){
    const w=warpLines[c],li=liftArr[c];
    const a=w.ln.geometry.attributes.position.array;
    a[0]=w.x;a[1]=0;a[2]=2.9;
    a[3]=w.x;a[4]=li*0.42;a[5]=1.5-(mode==='jacq'?0:(mode==='twill'?c%3:c%2)*0.22);
    a[6]=w.x;a[7]=li*0.1;a[8]=0.35;
    a[9]=w.x;a[10]=0;a[11]=0.05;
    w.ln.geometry.attributes.position.needsUpdate=true;
    w.ln.material.color.setHex(Math.abs(li)>0.2?0xffd98a:0xcfc6b2);
  }
  /* ── 综框升降 ── */
  shafts.forEach((s,i)=>{
    const up=liftRule(k,i,mode)?shedAmt:-shedAmt*0.9;
    s.g.position.y=up*0.42;
  });
  /* ── 梭子 ── */
  const tP=(cycT-PH.open)/PH.pass;
  shuttleG.visible=cycT>=PH.open&&cycT<PH.open+PH.pass;
  if(shuttleG.visible){
    const e=tP<0.15?smooth(tP/0.15):tP>0.85?smooth((1-tP)/0.15):1;
    shuttleG.position.set(shuttleDir>0?-W()/2-0.55+e*(W()+1.1):W()/2+0.55-e*(W()+1.1),0.03,0.28);
    shuttleGlow.material.opacity=0.35+0.3*e;
  }
  /* ── 飘浮纬线 ── */
  pickLine.visible=cycT>=PH.open+PH.pass*0.5&&cycT<PH.open+PH.pass+PH.beat*0.8;
  if(pickLine.visible){
    const a=pickGeo.attributes.position.array;
    for(let c=0;c<N;c++){
      a[c*3]=-W()/2+DX/2+c*DX;
      a[c*3+1]=0.015+0.02*Math.sin(c*1.7+simT*3);
      a[c*3+2]=0.28;
    }
    pickGeo.attributes.position.needsUpdate=true;
  }
  /* ── 钢筘打纬 ── */
  const tB=(cycT-PH.open-PH.pass)/PH.beat;
  reedG.position.z=1.9-1.85*smooth(clamp(tB,0,1));
  /* ── 卷取:布面滑移一格,结束时登记新纬 ── */
  const tT=(cycT-PH.open-PH.pass-PH.beat-PH.close)/PH.take;
  if(tT>0){
    shiftZ=-densDr()*smooth(tT);
    if(tT>0.92&&!justPicked){
      justPicked=true;
      rowsData.unshift({k,mode});
      if(rowsData.length>MAXR)rowsData.pop();
      picks++;shuttleDir*=-1;
      cardBand.position.y=0.42-((picks%8)/8)*0.8;
      shiftZ=0;renderCloth();
    }else renderCloth();
  }else if(shiftZ!==0){shiftZ=0;renderCloth();}
  /* ── 打孔卡孔位 ── */
  if(mode==='jacq'){
    for(let r=0;r<8;r++){
      for(let c=0;c<12;c++){
        const cc=Math.abs(c*2-(N-1)/2);
        const kk=picks+7-r,r16=((kk%16)+16)%16,tri=r16<8?r16:15-r16;
        holes[r*12+c].visible=cc<=2+tri*0.9;
      }
    }
  }
  stat={picks,sh:12*spd};
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
let justPicked=false;
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();applyLang();buildWarp();buildReed();reedG.userData.fixBars();
buildShafts(2);renderCloth();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
