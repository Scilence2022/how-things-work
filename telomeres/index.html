<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>端粒 · 每复制一次,就磨掉一截</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.e { border-color: rgba(99,230,190,.9); color: #c3f5e5; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }
  #stats .v.r { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.g { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.b { color: #a5d8ff; border-color: rgba(116,192,252,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(99,230,190,.2); border-color: rgba(99,230,190,.6); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="端粒:每复制一次,就磨掉一截" data-en="Telomeres: ground down one copy at a time">端粒:每复制一次，就磨掉一截</h1>
  <div class="sub" data-zh="后随链最后一段永远无法起步 → 末端逐年缩短 → 海弗里克极限；端粒酶能续命——癌细胞的不死密码 · 空格播放/暂停" data-en="The lagging strand's last segment can never start → ends shorten every generation → the Hayflick limit; telomerase renews them — the immortality trick of cancer · Space = play/pause">后随链最后一段永远无法起步 → 末端逐年缩短 → 海弗里克极限；端粒酶能续命——癌细胞的不死密码 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="已复制代数" data-en="generations">已复制代数</span><span class="v g" id="stGen">0</span>
  <span class="k" data-zh="端粒剩余" data-en="telomere left">端粒剩余</span><span class="v" id="stTel">—</span>
  <span class="k" data-zh="复制终点" data-en="terminus">复制终点</span><span class="v" id="stFork" style="font-size:14px">—</span>
  <span class="k" data-zh="细胞命运" data-en="cell fate">细胞命运</span><span class="v" id="stFate" style="font-size:14px">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.g" data-zh="端粒重复 TTAGGG(缓冲垫)" data-en="telomere repeats TTAGGG (the buffer)">端粒重复 TTAGGG(缓冲垫)</span>
    <span class="chip.b" data-zh="基因区(绝不能丢)" data-en="genes (must not lose)">基因区(绝不能丢)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnRep" data-zh="复制一代" data-en="replicate one generation">复制一代</button>
    <button class="abtn" id="btnTel" data-zh="端粒酶:关" data-en="telomerase: OFF">端粒酶:关</button>
  </div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../dna-replication/" data-zh="上游:半保留复制" data-en="upstream: semi-conservative replication">上游:半保留复制</a>
    <a href="../telomeres/" data-zh="家族:DNA 复制" data-en="family: DNA replication">家族:DNA 复制</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('端粒与复制末端', 'Telomeres');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 2.6, 6.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.2,
    emissive: color, emissiveIntensity: 0.14, transparent: true, ...opts });
}
const M = {
  gene: mat(0x74c0fc),
  tel: mat(0xffd166),
  rna: mat(0x63e6be, { emissiveIntensity: 0.3 }),
  primer: mat(0xff8fa3),
  gap: new THREE.MeshBasicMaterial({ color: 0xff4d4d, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.6 }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.4, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.7;
scene.add(base);

/* ================= 链模型 ================= */
/* 链由珠子串成:x 从左到右。基因区 12 珠(蓝),端粒 6 珠(黄,两端) */
const SEG = 0.36;
const GENE_N = 12;
const TEL_MAX = 6;         // 满端粒珠数
let telLen = TEL_MAX;      // 当前端粒(右端)
let gen = 0;

const strandTop = new THREE.Group();    // 亲代(上链)
const strandBot = new THREE.Group();    // 子代(下链)
scene.add(strandTop, strandBot);
function buildStrand(grp, y, telRight, telLeft) {
  grp.clear();
  const total = GENE_N + telRight + telLeft;
  const x0 = -(total - 1) * SEG / 2;
  for (let i = 0; i < total; i++) {
    const isTelL = i < telLeft;
    const isTelR = i >= total - telRight;
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 10), isTelL || isTelR ? M.tel : M.gene);
    m.position.set(x0 + i * SEG, y, 0);
    grp.add(m);
    if (i > 0) {
      const prev = grp.children[grp.children.length - 2];
      const d = new THREE.Vector3().subVectors(m.position, prev.position);
      const bond = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1, 8), mat(0x8a93a3, { metalness: 0.4 }));
      bond.position.copy(prev.position).addScaledVector(d, 0.5);
      bond.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
      bond.scale.y = d.length();
      grp.add(bond);
    }
  }
  grp.position.x = 0;
}
/* 中心法则示意:上链为「复制前」,下链为「复制后两条子链之一」 */
function renderStrands() {
  buildStrand(strandTop, 1.35, telLen, telLen);
  buildStrand(strandBot, -0.35, telLen, 0);   // 后随链合成终点:左端无法补(简化显示右端磨损)
}

/* 复制叉动画(上链下方扫过) */
const fork = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.4, 14),
  new THREE.MeshBasicMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.9 }));
fork.rotation.x = Math.PI;
scene.add(fork);
let forkT = 1;         // 0..1,1=完成
let replicating = false;

/* RNA 引物 / 缺口标记 */
const gapMesh = new THREE.Mesh(new THREE.BoxGeometry(SEG * 0.9, 0.1, 0.3), M.gap);
scene.add(gapMesh);

/* 端粒酶(小机器人) */
const telomerase = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.2, 6, 12), M.rna);
  telomerase.add(body);
  const arms = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.03, 8, 20), M.rna);
  arms.rotation.x = Math.PI / 2;
  telomerase.add(arms);
}
telomerase.visible = false;
scene.add(telomerase);
let telomeraseOn = false;

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let tSim = 0;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblEnd = addLabel(() => L(`右端端粒:${telLen} 段 TTAGGG 重复——它是「可牺牲的缓冲垫」`,
  `right telomere: ${telLen} units of TTAGGG repeats — a sacrificial buffer`),
  new THREE.Vector3(0, 2.15, 0), 'g');
const lblProblem = addLabel(() => replicating
  ? L('复制叉行进中:前导链一路抄到底;后随链分段(冈崎)……最后一段没有「落脚点」',
      'fork running: the leading strand copies to the end; the lagging strand in Okazaki fragments… but the last one has nowhere to start')
  : telLen <= 2
    ? L('端粒见底:再复制就要切到基因区——细胞进入海弗里克极限,停止分裂',
        'telomere nearly gone: the next copy would eat genes — the cell hits the Hayflick limit and stops dividing')
    : L('问题:DNA 聚合酶只能「往前接」,不能「凭空起步」——每个末端注定短一截',
        'the problem: polymerase can only extend, never start from nothing — every end is doomed to shorten'),
  new THREE.Vector3(0, -1.25, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '复制的基本矛盾', be: 'The copying dilemma',
    d: 'DNA 聚合酶只能把核苷酸接到已有的 3′-OH 上——它只会「续写」,不会「起笔」。前导链没问题,后随链却要一段段起笔。',
    de: 'Polymerase can only add to an existing 3′-OH — it continues, never starts. Fine for the leading strand; the lagging strand must start again and again.',
    act: () => {} },
  { b: '末端:最后一格引物拆掉后', be: 'The end: last primer removed',
    d: '后随链在染色体最末端也要放 RNA 引物才能起步;引物随后被拆掉——但拆掉后那个缺口没人能补(没有 3′-OH 可接)。链短了一截。',
    de: 'Even the chromosome\'s very end needs an RNA primer to begin; primers are later removed — and that final gap can never be filled. The strand shrinks.',
    act: () => { document.getElementById('btnRep').click(); } },
  { b: '端粒:牺牲的缓冲垫', be: 'Telomeres: the sacrificial buffer',
    d: '染色体末端备着几千段 TTAGGG 重复——丢的是它们而不是基因。但缓冲垫不是无限的:体细胞每次分裂磨掉 50-200 碱基。',
    de: 'Chromosome ends carry thousands of TTAGGG repeats — what gets lost is buffer, not genes. But the buffer is finite: somatic cells lose 50–200 bases per division.',
    act: () => { for (let i = 0; i < 3; i++) document.getElementById('btnRep').click(); } },
  { b: '海弗里克极限', be: 'The Hayflick limit',
    d: '端粒磨到底,细胞停止分裂进入衰老(或启动自毁)。人类体细胞约 50-70 代——这就是细胞层面的「寿命时钟」。',
    de: 'When telomeres run out, cells senesce or self-destruct. Human somatic cells manage ~50-70 divisions — a cellular life clock.',
    act: () => { for (let i = 0; i < 3; i++) document.getElementById('btnRep').click(); } },
  { b: '端粒酶:续命与作恶', be: 'Telomerase: renewal — and evil',
    d: '端粒酶自带 RNA 模板,能把 TTAGGG 画回末端(生殖细胞和干细胞靠它)。85% 的癌细胞偷偷重启端粒酶——这就是它们「不死」的秘密,也是抗癌药的靶点。',
    de: 'Telomerase carries its own RNA template to redraw TTAGGG ends (germ and stem cells rely on it). 85% of cancers secretly re-ignite it — their immortality trick, and a drug target.',
    act: () => document.getElementById('btnTel').click() },
];
function stepIndex() {
  if (telomeraseOn) return 4;
  if (telLen <= 2) return 3;
  if (telLen <= 4) return 2;
  if (gen > 0) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const btnRep = document.getElementById('btnRep');
const btnTel = document.getElementById('btnTel');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnRep.addEventListener('click', () => {
  if (replicating || forkT < 1) return;
  if (telLen <= 0 && !telomeraseOn) return;
  replicating = true;
  forkT = 0;
});
btnTel.addEventListener('click', () => {
  telomeraseOn = !telomeraseOn;
  btnTel.classList.toggle('on', telomeraseOn);
  btnTel.textContent = telomeraseOn ? L('端粒酶:开(续命)', 'telomerase: ON (renewing)') : L('端粒酶:关', 'telomerase: OFF');
  telomerase.visible = telomeraseOn;
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 复制流程 ================= */
function replicateTick(dts) {
  if (!replicating) return;
  forkT += dts * 0.22;
  const x = lerp(-2.9, 2.9, clamp(forkT, 0, 1));
  fork.position.set(x, 0.5, 0);
  fork.visible = true;
  /* 缺口标记跟在叉后(末端) */
  gapMesh.position.set(x - 0.5, 0.02, 0);
  if (forkT >= 1) {
    replicating = false;
    fork.visible = false;
    gen++;
    /* 端粒缩短;端粒酶先补 */
    if (telomeraseOn) {
      telLen = Math.min(TEL_MAX, telLen + 2);
    }
    telLen = Math.max(0, telLen - 1);
    renderStrands();
  }
}
function telomeraseTick(dts) {
  if (!telomeraseOn) return;
  const endX = (GENE_N + telLen - 1) * SEG / 2 - (GENE_N + telLen - 1) * SEG / 2 + (GENE_N + telLen) * SEG / 2;
  void endX;
  const total = GENE_N + telLen * 2;
  const ex = -(total - 1) * SEG / 2 + (total - telLen + 0.5) * SEG;
  telomerase.position.set(ex, 1.9 + Math.sin(tSim * 3) * 0.06, 0);
  telomerase.rotation.y += dts * 1.2;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  replicateTick(dts);
  telomeraseTick(dts);

  document.getElementById('stGen').textContent = gen;
  document.getElementById('stTel').innerHTML = telLen + '<small>/' + TEL_MAX + ' 段</small>';
  document.getElementById('stTel').className = 'v ' + (telLen > 2 ? 'g' : 'r');
  document.getElementById('stFork').textContent = replicating ? L('进行中…', 'running…') : L('空闲', 'idle');
  const fate = telLen <= 0 ? L('海弗里克极限:停止分裂', 'Hayflick limit: division stops')
    : telomeraseOn ? L('端粒酶维持:可无限传代', 'telomerase: potentially immortal')
    : L('正常体细胞', 'normal somatic cell');
  document.getElementById('stFate').textContent = fate;

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

renderStrands();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
