<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>最速降线与摆线 · 快,不在于走直线</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#9775fa;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#7048b6;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(151,117,250,.6);background:rgba(151,117,250,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(112,72,182,.55);background:rgba(112,72,182,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(151,117,250,.10);border-color:rgba(151,117,250,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(112,72,182,.08);border-color:rgba(112,72,182,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#e6dbff}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="最速降线与摆线" data-en="The Brachistochrone">最速降线与摆线</h1>
  <div class="sub" data-zh="重力做功只看深度:v=√(2gy),早降早得速度;A→B 的最快路径不是直线而是倒摆线——先陡后平,把时间积分 T=∫ds/v 变分到最小,伯努利 1696 年解出它;同一条摆线上任意起点下滑,都会在同一时刻到达最低点(tautochrone),惠更斯据此造出摆钟 · 拖动旋转 / 空格运行/暂停" data-en="Gravity pays out speed by depth alone, v=√(2gy) — drop early, earn speed early; the fastest slide from A to B is not the straight line but an inverted cycloid — steep first, flat later, the curve that minimizes the time integral T=∫ds/v, solved by Bernoulli in 1696; released from anywhere on the same cycloid, every ball reaches the bottom at the same instant (tautochrone) — the principle of Huygens' pendulum clock · drag to orbit / Space = run/pause">重力做功只看深度:v=√(2gy),早降早得速度;A→B 的最快路径不是直线而是倒摆线——先陡后平,把时间积分 T=∫ds/v 变分到最小,伯努利 1696 年解出它;同一条摆线上任意起点下滑,都会在同一时刻到达最低点(tautochrone),惠更斯据此造出摆钟 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="摆线用时" data-en="Cycloid time">摆线用时</span><span class="v" id="stT1">—</span>
  <span class="k" data-zh="直线用时" data-en="Line time">直线用时</span><span class="v" id="stT2">—</span>
  <span class="k" data-zh="领先差" data-en="Lead">领先差</span><span class="v" id="stLead">—</span>
  <span class="k" data-zh="摆线球速" data-en="Ball speed">摆线球速</span><span class="v" id="stV">—</span>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bRace" data-zh="三轨竞速" data-en="Race">三轨竞速</button>
    <button class="abtn" id="bTaut" data-zh="等时演示" data-en="Tautochrone">等时演示</button>
  </div>
  <div class="row">
    <label data-zh="水平距离" data-en="Distance">水平距离</label>
    <input id="sD" type="range" min="2" max="7" step="0.1" value="4.5">
    <span class="val" id="sDVal">4.5 m</span>
  </div>
  <div class="row">
    <label data-zh="下降高度" data-en="Drop">下降高度</label>
    <input id="sH" type="range" min="1" max="4" step="0.1" value="2.6">
    <span class="val" id="sHVal">2.6 m</span>
  </div>
  <div class="row">
    <label data-zh="重力 g" data-en="Gravity g">重力 g</label>
    <input id="sG" type="range" min="1" max="20" step="0.1" value="9.8">
    <span class="val" id="sGVal">9.8 m/s²</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglArr" type="checkbox" checked> <span data-zh="速度箭头" data-en="Velocity arrows">速度箭头</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cycloid-gears/" data-zh="摆线齿轮" data-en="Cycloidal Gears">摆线齿轮</a>
    <a href="../projectile-motion/" data-zh="抛体运动" data-en="Projectile Motion">抛体运动</a>
    <a href="../newton-method/" data-zh="牛顿迭代" data-en="Newton's Method">牛顿迭代</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,60);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,300);
camera.position.set(1.2,5.2,12.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=34;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:同一竖直平面内三条并行轨道,小球自 A 同时释放 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(20,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const frameM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.4});
const matStr=new THREE.MeshStandardMaterial({color:0x4dabf7,roughness:0.35,metalness:0.45});
const matArc=new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.35,metalness:0.45});
const matCyc=new THREE.MeshStandardMaterial({color:0x69db7c,roughness:0.35,metalness:0.45});
const ballMats={
  str:new THREE.MeshStandardMaterial({color:0x4dabf7,roughness:0.3,metalness:0.2,emissive:0x4dabf7,emissiveIntensity:0.25}),
  arc:new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.3,metalness:0.2,emissive:0xffd43b,emissiveIntensity:0.22}),
  cyc:new THREE.MeshStandardMaterial({color:0x69db7c,roughness:0.3,metalness:0.2,emissive:0x69db7c,emissiveIntensity:0.25})};
const trackG=new THREE.Group();scene.add(trackG);
const fixG=new THREE.Group();scene.add(fixG);
const ballG=new THREE.Group();scene.add(ballG);
const BR=0.11;

/* 状态 */
let mode='race',D=4.5,H=2.6,G=9.8,playing=true,labelsOn=true,slowMo=false,arrOn=true;
let raceT=0,holdT=0,simT=0,race=null;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblA=addLabel(()=>L('起点 A','Start A'),new THREE.Vector3(-2.8,3.3,0),'o');
const lblB=addLabel(()=>L('终点 B','End B'),new THREE.Vector3(2.8,0.8,0),'o');
const lblStr=addLabel(()=>L('直线','Straight line'),new THREE.Vector3(-2,3,0),'b',()=>mode==='race');
const lblArc=addLabel(()=>L('圆弧','Circular arc'),new THREE.Vector3(-1.4,2,0),'y',()=>mode==='race');
const lblCyc=addLabel(()=>L('摆线','Cycloid'),new THREE.Vector3(-0.6,1.4,0),'g');
const finStr=addLabel(()=>L('直线','Line')+' '+(race&&race.balls[0].done?race.balls[0].tbl.T.toFixed(2)+' s':'…'),
  new THREE.Vector3(3.4,1.1,0),'b',()=>mode==='race');
const finArc=addLabel(()=>L('圆弧','Arc')+' '+(race&&race.balls[1].done?race.balls[1].tbl.T.toFixed(2)+' s':'…'),
  new THREE.Vector3(3.4,0.75,0),'y',()=>mode==='race');
const finCyc=addLabel(()=>L('摆线','Cycloid')+' '+(race&&race.balls[2].done?race.balls[2].tbl.T.toFixed(2)+' s':'…'),
  new THREE.Vector3(3.4,0.4,0),'g',()=>mode==='race');
const tautLbls=[0,1,2].map(i=>addLabel(()=>L(`起点 ${i+1}`,`Start ${i+1}`),new THREE.Vector3(0,2,0),'byr'[i]==='b'?'b':'byr'[i]==='y'?'y':'r',()=>mode==='taut'));
const lblEq=addLabel(()=>race?L('等时:任意起点同时到底 · ','Tautochrone: any start, same arrival · ')+
  `t=π√(r/g)=${(Math.PI*Math.sqrt(race.r/G)).toFixed(2)} s`:'—',new THREE.Vector3(2.6,0.9,0),'g',()=>mode==='taut');

/* ── 几何:摆线参数由终点反解 ──
   摆线 x=r(θ-sinθ), y=r(1-cosθ);要求 x(θe)=D, y(θe)=H。
   (θ-sinθ)/(1-cosθ) 在 (0,2π) 单调增,二分求 θe。 */
function cycloidSolve(d,h){
  const f=t=>(t-Math.sin(t))/(1-Math.cos(t));
  let lo=1e-3,hi=2*Math.PI-1e-3;
  for(let i=0;i<80;i++){const m=(lo+hi)/2;if(f(m)<d/h)lo=m;else hi=m;}
  const te=(lo+hi)/2;return{r:h/(1-Math.cos(te)),te};
}
/* 时间表:dt=ds/v,v=√(2g·深度),能量守恒逐段积分 */
function timeTable(pts,dep,d0){
  const n=pts.length,t=[0];
  for(let i=1;i<n;i++){
    const ds=pts[i].distanceTo(pts[i-1]);
    const dm=Math.max((dep[i]+dep[i-1])/2-d0,1e-6);
    t.push(t[i-1]+ds/Math.sqrt(2*G*dm));
  }
  return{t,T:t[n-1]};
}
function addBall(kind,pts,dep,d0){
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(BR,20,16),ballMats[kind]);
  ballG.add(mesh);
  const col=kind==='str'?0x4dabf7:kind==='arc'?0xffd43b:0x69db7c;
  const am=new THREE.MeshStandardMaterial({color:col,roughness:0.4,emissive:col,emissiveIntensity:0.5});
  const arrow=new THREE.Group();
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,1,10),am);
  cyl.rotation.z=Math.PI/2;cyl.position.x=0.5;arrow.add(cyl);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.2,12),am);
  cone.rotation.z=-Math.PI/2;cone.position.x=1.0;arrow.add(cone);
  scene.add(arrow);
  return{kind,pts,dep,tbl:timeTable(pts,dep,d0),mesh,arrow,v:0,done:false};
}
function pillar(x,h){
  if(h<0.08)return;
  const p=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.075,h,10),frameM);
  p.position.set(x,h/2,0);fixG.add(p);
}
function buildRace(){
  const{r,te}=cycloidSolve(D,H);
  const R=(D*D+H*H)/(2*D),dB=Math.atan2(2*D*H,H*H-D*D);
  const raw={str:[],arc:[],cyc:[]};
  for(let i=0;i<64;i++){const u=i/63;raw.str.push([D*u,H*u]);}
  for(let i=0;i<160;i++){const d=dB*i/159;raw.arc.push([R*(1-Math.cos(d)),R*Math.sin(d)]);}
  for(let i=0;i<220;i++){const t=te*i/219;raw.cyc.push([r*(t-Math.sin(t)),r*(1-Math.cos(t))]);}
  let mx=0;for(const k in raw)for(const p of raw[k])mx=Math.max(mx,p[1]);
  const x0=-D/2,yTop=mx+0.45;
  const mk=kind=>{
    const pts=[],dep=[];
    for(const p of raw[kind]){dep.push(p[1]);pts.push(new THREE.Vector3(x0+p[0],yTop-p[1],0));}
    const mat=kind==='str'?matStr:kind==='arc'?matArc:matCyc;
    trackG.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),200,0.042,8,false),mat));
    return addBall(kind,pts,dep,0);
  };
  const balls=[mk('str'),mk('arc'),mk('cyc')];
  pillar(x0,yTop);pillar(x0+D,Math.max(yTop-H,0.08));
  for(const p of[[x0,yTop],[x0+D,yTop-H]]){
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.09,14,12),frameM);
    s.position.set(p[0],p[1],0);fixG.add(s);
  }
  race={balls,x0,yTop,span:D,r,te,T:{str:balls[0].tbl.T,arc:balls[1].tbl.T,cyc:balls[2].tbl.T}};
}
function buildTaut(){
  const{r}=cycloidSolve(D,H);
  const span=r*Math.PI,x0=-span/2,yTop=2*r+0.45;
  const pts=[],dep=[];
  for(let i=0;i<240;i++){const t=Math.PI*i/239;
    dep.push(r*(1-Math.cos(t)));pts.push(new THREE.Vector3(x0+r*(t-Math.sin(t)),yTop-dep[i],0));}
  trackG.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),220,0.042,8,false),matCyc));
  const pad=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.3,0.06,18),frameM);
  pad.position.set(x0+span,0.44,0);fixG.add(pad);
  pillar(x0,yTop);pillar(x0+span,Math.max(0.1,0.45-0.1));
  const balls=[];
  for(const th0 of[0.35,1.05,1.85]){
    const idx=Math.round(th0/Math.PI*239);
    balls.push(addBall(['str','arc','cyc'][balls.length],pts.slice(idx),dep.slice(idx),dep[idx]));
  }
  race={balls,x0,yTop,span,r,te:Math.PI,T:balls[1].tbl.T};
}
function buildAll(auto){
  for(const g of[trackG,fixG,ballG]){g.traverse(o=>{if(o.geometry)o.geometry.dispose();});g.clear();}
  race=null;
  if(mode==='race')buildRace();else buildTaut();
  resetRace();positionLabels();
  if(auto)autoFrame();
}
function resetRace(){raceT=0;holdT=0;if(race)for(const b of race.balls){b.done=false;b.v=0;}}
function autoFrame(){
  if(!race)return;
  const w=mode==='race'?D:race.span;
  controls.target.set(0,race.yTop*0.48,0);
  camera.position.set(w*0.28+0.6,race.yTop*0.9+1.0,Math.max(9.5,w*1.75+3.5));
}
function positionLabels(){
  if(!race)return;
  const place=(reg,pts,off)=>{
    const n=pts.length,c=Math.floor(n*0.55);
    const i0=Math.max(0,c-1),i1=Math.min(n-1,c+1);
    const tx=pts[i1].x-pts[i0].x,ty=pts[i1].y-pts[i0].y,ln=Math.hypot(tx,ty)||1;
    reg.position.set(pts[c].x-ty/ln*off,pts[c].y+tx/ln*off,0);
  };
  if(mode==='race'){
    const x0=race.x0,yTop=race.yTop;
    lblA.position.set(x0-0.6,yTop+0.3,0);
    lblB.position.set(x0+D+0.6,yTop-H+0.12,0);
    place(lblStr,race.balls[0].pts);place(lblArc,race.balls[1].pts);place(lblCyc,race.balls[2].pts);
    finStr.position.set(x0+D+0.62,yTop-H+0.56,0);
    finArc.position.set(x0+D+0.62,yTop-H+0.2,0);
    finCyc.position.set(x0+D+0.62,yTop-H-0.16,0);
  }else{
    const x0=race.x0,span=race.span,yTop=race.yTop;
    lblA.position.set(x0-0.6,yTop+0.3,0);
    lblB.position.set(x0+span+0.75,0.55,0);
    place(lblCyc,race.balls[1].pts);
    for(let i=0;i<3;i++)place(tautLbls[i],race.balls[i].pts,0.48);
    lblEq.position.set(x0+span+0.95,1.15,0);
  }
}
/* 按时刻 τ 反查位置与速度 */
function posAt(b){
  const{pts,dep,tbl}=b,n=pts.length;
  if(raceT<=0)return{i:0,x:pts[0].x,y:pts[0].y,v:0,done:false};
  if(raceT>=tbl.T){const p=pts[n-1];
    return{i:n-1,x:p.x,y:p.y,v:Math.sqrt(2*G*Math.max(dep[n-1],0)),done:true};}
  let lo=0,hi=n-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(tbl.t[m]<=raceT)lo=m;else hi=m;}
  const sp=Math.max(tbl.t[hi]-tbl.t[lo],1e-9),f=(raceT-tbl.t[lo])/sp;
  return{i:lo,x:pts[lo].x+(pts[hi].x-pts[lo].x)*f,y:pts[lo].y+(pts[hi].y-pts[lo].y)*f,
    v:Math.sqrt(2*G*Math.max(dep[lo]+(dep[hi]-dep[lo])*f,0)),done:false};
}
const _n=new THREE.Vector3(),_t=new THREE.Vector3(),_X=new THREE.Vector3(1,0,0);
function nrmAt(b,i){
  const pts=b.pts,i0=Math.max(0,i-1),i1=Math.min(pts.length-1,i+1);
  const tx=pts[i1].x-pts[i0].x,ty=pts[i1].y-pts[i0].y,l=Math.hypot(tx,ty)||1;
  return _n.set(-ty/l,tx/l,0);
}
function tanAt(b,i){
  const pts=b.pts,i0=Math.max(0,i-1),i1=Math.min(pts.length-1,i+1);
  return _t.set(pts[i1].x-pts[i0].x,pts[i1].y-pts[i0].y,0).normalize();
}

function setD(v){D=clamp(v,2,7);
  document.getElementById('sD').value=D;
  document.getElementById('sDVal').textContent=D.toFixed(1)+' m';
  buildAll(false);updateStats();}
function setH(v){H=clamp(v,1,4);
  document.getElementById('sH').value=H;
  document.getElementById('sHVal').textContent=H.toFixed(1)+' m';
  buildAll(false);updateStats();}
function setG(v){G=clamp(v,1,20);
  document.getElementById('sG').value=G;
  document.getElementById('sGVal').textContent=G.toFixed(1)+' m/s²';
  buildAll(false);updateStats();}
function setMode(m){mode=m;
  document.getElementById('bRace').classList.toggle('on',m==='race');
  document.getElementById('bTaut').classList.toggle('on',m==='taut');
  buildAll(true);updateStats();}

const STEPS=[
 {zh:'<b>直觉是直线</b>:A 到 B 走最短的路,却不是最快的路——直线起步太缓,三球竞速它垫底',
  en:'<b>Intuition says line</b>: the shortest path is not the fastest — the straight line starts too gently and finishes last',
  act(){setMode('race');setD(4.5);setH(2.6);setG(9.8);}},
 {zh:'<b>v=√(2gy)</b>:无摩擦时速度只由下降深度决定——早降早得速度,起步陡的路径先富起来',
  en:'<b>v=√(2gy)</b>: frictionless speed depends only on depth — drop early, earn speed early',
  act(){setD(3.4);setH(3.2);}},
 {zh:'<b>摆线先陡后平</b>:把时间积分 T=∫ds/v 压到最小——前段俯冲攒下的速度,让后段平飞也占优',
  en:'<b>Cycloid: steep then flat</b>: minimize T=∫ds/v — speed banked in the dive pays for the glide',
  act(){setD(5.5);setH(2.2);}},
 {zh:'<b>变分法之答</b>:1696 年伯努利以光学最短时间原理解出——正是倒摆线;终点越远,它还会沉到 B 之下再回升',
  en:'<b>Variational answer</b>: Bernoulli solved it in 1696 via Fermat\u2019s least-time principle — an inverted cycloid, dipping below B when B lies far',
  act(){setD(6.5);setH(1.6);}},
 {zh:'<b>等时性 tautochrone</b>:同一条摆线上任意起点同时释放,在同一时刻抵达最低点',
  en:'<b>Tautochrone</b>: released from any height on the same cycloid, every ball bottoms out at the same instant',
  act(){setMode('taut');}},
 {zh:'<b>惠更斯摆钟</b>:摆的周期随摆幅漂移,摆线挡板把它校正成严格等时;摆线齿廓同样让齿轮匀速咬合',
  en:'<b>Huygens\u2019 clock</b>: cycloidal cheeks correct the pendulum\u2019s amplitude drift into perfect isochronism; cycloidal teeth mesh likewise',
  act(){setMode('taut');setG(9.8);}},
 {zh:'<b>摩擦之下</b>:真实轨道有损耗,摆线不再严格最快,却仍是最优近似——先陡后平的配方不变',
  en:'<b>With friction</b>: real tracks leak energy; the cycloid is no longer exactly fastest yet remains the best approximation',
  act(){setMode('race');setD(4.5);setH(2.6);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  if(!race)return;
  const e1=document.getElementById('stT1'),e2=document.getElementById('stT2'),
    e3=document.getElementById('stLead'),e4=document.getElementById('stV');
  if(mode==='race'){
    const Tc=race.T.cyc,Ts=race.T.str,pct=(Ts-Tc)/Ts*100;
    e1.innerHTML=Tc.toFixed(2)+'<small> s</small>';
    e2.innerHTML=Ts.toFixed(2)+'<small> s</small>';
    e3.innerHTML=pct.toFixed(1)+'<small> %</small>';
    e3.className='v '+(pct>0.5?'ok':'');
    e4.innerHTML=race.balls[2].v.toFixed(2)+'<small> m/s</small>';
  }else{
    e1.innerHTML=race.balls[1].tbl.T.toFixed(2)+'<small> s</small>';
    e2.textContent='—';e3.textContent='—';e3.className='v';
    e4.innerHTML=race.balls[1].v.toFixed(2)+'<small> m/s</small>';
  }
}

document.getElementById('bRace').addEventListener('click',()=>setMode('race'));
document.getElementById('bTaut').addEventListener('click',()=>setMode('taut'));
document.getElementById('sD').addEventListener('input',e=>setD(+e.target.value));
document.getElementById('sH').addEventListener('input',e=>setH(+e.target.value));
document.getElementById('sG').addEventListener('input',e=>setG(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglArr').addEventListener('change',e=>{arrOn=e.target.checked;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  frameM.color.setHex(dark?0x54607a:0x8a93a8);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;raceT+=dts;
  if(race){
    let allDone=true;
    for(const b of race.balls){
      const st=posAt(b);
      b.v=st.v;b.done=st.done;
      b.mesh.position.set(st.x,st.y,0).addScaledVector(nrmAt(b,st.i),BR);
      const tan=tanAt(b,st.i);
      b.arrow.position.copy(b.mesh.position);
      b.arrow.quaternion.setFromUnitVectors(_X,tan);
      b.arrow.scale.set(clamp(b.v*0.16,0.14,1.5),1,1);
      b.arrow.visible=arrOn&&playing&&!b.done&&b.v>0.08;
      if(!st.done)allDone=false;
    }
    if(allDone&&playing){holdT+=dt;if(holdT>1.7)resetRace();}
  }
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
buildAll(true);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
