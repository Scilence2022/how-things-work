<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海啸与浅水波 · 深海一声跳,岸边一堵墙</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#38d9a9;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#087f5b;
    --bg:#eaf5f0; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.quake { border-color: rgba(255,107,107,.55); color: #ff8787; }
  .abtn.on { border-color: rgba(56,217,169,.6); background: rgba(56,217,169,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(8,127,91,.55); background: rgba(8,127,91,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 108px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 76px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(56,217,169,.10); border-color: rgba(56,217,169,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(8,127,91,.08); border-color: rgba(8,127,91,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #06301f; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #b2f2e0; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #06301f; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.1); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="海啸与浅水波:深海一声跳,岸边一堵墙" data-en="Tsunami & Shallow-Water Waves: A Jump in the Deep, a Wall at the Beach">海啸与浅水波:深海一声跳,岸边一堵墙</h1>
  <div class="sub" data-zh="海底断层一错动,几千米深的水柱整体抬升——波长 200 km 的「浅水波」在 4000 m 深海就以 c=√(gh)≈713 km/h 奔跑,海面只是一道 1 m 的温柔鼓包,船上的你毫无感觉;冲上大陆架,深度把速度踩住,能量通量守恒按 Green 定律 A∝h^(-1/4) 把波高一路顶起——1 m 变 10 m;波谷先到,海水先「跑光」再折返成墙。一维浅水方程实时求解(时间加速 ×60,竖向大幅夸张)· 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A fault slips and the whole multi-kilometre water column is lifted — a 200 km shallow-water wave already runs at c = √(gh) ≈ 713 km/h in 4000 m of water; at the surface it is a gentle 1-metre bump, unfelt aboard a ship. Onto the shelf the depth pins the speed down, and energy-flux conservation piles the height up by Green's law A ∝ h^(-1/4) — 1 m becomes 10 m. The trough arrives first: the sea drains, then returns as a wall. Live 1-D shallow-water solver (time ×60, vertical scale heavily exaggerated) · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">海啸与浅水波:深海一声跳,岸边一堵墙</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="波峰速度 c" data-en="Crest speed c">波峰速度 c</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="波峰高度" data-en="Crest height">波峰高度</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="当地水深" data-en="Local depth">当地水深</span><span class="v" id="stH">—</span>

  <canvas id="plotCv"></canvas>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="蓝面=海水(白峰=波高)" data-en="blue = sea (white crests)">蓝面=海水(白峰=波高)</span>

  <div id="actions">
    <button class="abtn quake" id="btnQuake" data-zh="触发地震 🌊" data-en="trigger quake 🌊">触发地震 🌊</button>
    <button class="abtn" id="btnSlow" data-zh="慢动作 ×15" data-en="slow-mo ×15">慢动作 ×15</button>

    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../earthquake-waves/" data-zh="源头:P波S波与断层" data-en="the source: P, S and the fault">源头:P波S波与断层</a>
    <a href="../tides/" data-zh="另一种浅水长波:潮汐" data-en="another long wave: the tides">另一种浅水长波:潮汐</a>
    <a href="../water-hammer/" data-zh="管中的压力波:水锤" data-en="pressure waves in pipes: water hammer">管中的压力波:水锤</a>
    <a href="../ship-buoyancy/" data-zh="波里的船:浮力稳性" data-en="a hull in waves: buoyancy">波里的船:浮力稳性</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x16324a, 34, 95);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x16324a : 0xd0e5ef);
  scene.fog.color = new THREE.Color(dark ? 0x16324a : 0xd0e5ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('海啸与浅水波 · 深海一声跳,岸边一堵墙', 'Tsunami & Shallow-Water Waves · A Jump in the Deep, a Wall at the Beach');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  setSlowBtn();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
  drawPlot();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 400);
camera.position.set(6.4, 4.6, 15.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(6.4, -0.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 70;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(6, 10, 8);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 一维浅水方程(变深度) ================= */
const N = 361;                       // 格点
const LK = 120;                      // 域长 km
const DX = LK * 1000 / (N - 1);      // 500 m
const G = 9.81;
const DT = 1.4;                      // s(CFL≈0.83:dt<dx/c_max=1.68)
const X_QUAKE = 45;                  // 地震中心 km
const X_BUOY = 72;                   // DART 浮标 km
let ampSlip = 2.0;                   // 初始水面扰动峰值 m
const hDep = new Float64Array(N);    // 静水深(正=水深,负=滩面高出海面)
const eta = new Float64Array(N);     // 水面扰动 m(相对静止海平面)
const u = new Float64Array(N);       // 深度平均水平速度 m/s
const dry = new Uint8Array(N);
const HMIN = 0.05;                   // 干湿阈值 m
const CF = 0.0006;                   // 底摩擦系数
const etaNew = new Float64Array(N), uNew = new Float64Array(N);
let tSim = 0, quakeT = 0;
let crestX = X_QUAKE, crestAmp = 0, crestSpd = Math.sqrt(G * 4000), troughShore = 0;
let runupKm = 0, housesHit = false;

function bathymetry() {
  for (let i = 0; i < N; i++) {
    const x = i / (N - 1) * LK;      // km
    if (x < 70) hDep[i] = 4000;
    else if (x < 103) {
      const t = (x - 70) / 33;       // 大陆坡:4000 → 60 m(平滑阶跃)
      hDep[i] = 4000 - (4000 - 60) * (t * t * (3 - 2 * t));
    } else if (x < 111) hDep[i] = 60 - (x - 103) / 8 * 66;      // 滩面变浅至出水
    else hDep[i] = -3 - (x - 111) * 2;                          // 岸线以上的缓滩(约 1:500)
  }
}
bathymetry();
function shorelineX() {
  let xs = LK;
  for (let i = 0; i < N; i++) if (hDep[i] <= 0) { xs = i / (N - 1) * LK; break; }
  return xs;
}
const SHORE_KM = shorelineX();

function resetSim() {
  eta.fill(0); u.fill(0); tSim = 0; quakeT = 0;
  crestX = X_QUAKE; crestAmp = 0; crestSpd = Math.sqrt(G * 4000); troughShore = 0;
  runupKm = SHORE_KM; housesHit = false;
  for (let i = 0; i < N; i++) dry[i] = hDep[i] <= HMIN ? 1 : 0;
  for (const hh of houses) { hh.userData.hit = false; hh.rotation.z = 0; hh.position.y = hh.userData.y0; }
}
function triggerQuake() {
  resetSim();
  /* 小波包:余弦调幅高斯(前导为谷)——登陆时先看到海水退潮 */
  for (let i = 0; i < N; i++) {
    if (dry[i]) continue;
    const x = i / (N - 1) * LK;
    const s = (x - X_QUAKE) / 16;
    eta[i] = ampSlip * Math.exp(-s * s) * Math.cos(s * 1.7);
  }
  quakeT = 1.4;
}
/* 非线性浅水 Lax-Wendroff(二阶,η/u 主变量)+ 干格点隔离 + 底摩擦
   η_t + [(h+η)u]_x = 0 ;  u_t + u·u_x + g·η_x = −c_f|u|u
   二阶格式把一阶数值耗散去掉 —— 浅水段波高才能按 Green 定律长起来;
   干邻居按零梯度/零通量处理,静止湖面严格平衡 */
function stepSWE() {
  const inv2dx = 1 / (2 * DX), hd = DT / DX;
  for (let i = 1; i < N - 1; i++) {
    const wet = !dry[i], wetL = !dry[i - 1], wetR = !dry[i + 1];
    if (!wet && !wetL && !wetR) { etaNew[i] = eta[i]; uNew[i] = 0; continue; }
    const eL = wetL ? eta[i - 1] : eta[i];
    const eR = wetR ? eta[i + 1] : eta[i];
    const uL = wetL ? u[i - 1] : 0, uR = wetR ? u[i + 1] : 0;
    const HiL = Math.max(hDep[i - 1] + eL, 0), HiR = Math.max(hDep[i + 1] + eR, 0);
    const ee = eta[i], uu = wet ? u[i] : 0;
    const Hi = Math.max(hDep[i] + ee, 0);
    const qL = wetL ? HiL * uL : 0, qR = wetR ? HiR * uR : 0;
    /* 一阶项(中心差分) */
    const de = -inv2dx * (qR - qL);                          // ∂η/∂t
    const du = wet ? -inv2dx * (uu * (uR - uL) + G * (eR - eL)) - CF * Math.abs(uu) * uu : 0;
    /* 二阶修正 dt²/2 · A² · W_xx,A = [[u, H],[g, u]] */
    const cc = G * Hi, d2e = eR - 2 * ee + eL, d2u = uR - 2 * uu + uL;
    const a11 = uu * uu + cc, a12 = 2 * uu * Hi, a21 = 2 * uu * G, a22 = uu * uu + cc;
    const k = 0.5 * hd * hd;
    etaNew[i] = ee + DT * de + k * (a11 * d2e + a12 * d2u);
    uNew[i] = uu + DT * du + k * (a21 * d2e + a22 * d2u);
    /* 湿干判定:总水深过小即搁浅(水漫上来可再湿化→上岸) */
    if (hDep[i] + etaNew[i] <= HMIN) { etaNew[i] = Math.min(etaNew[i], -hDep[i] + HMIN); uNew[i] = 0; }
    /* 限速:数值防爆 */
    const hN = Math.max(hDep[i] + etaNew[i], 0);
    const uc = 3 * Math.sqrt(G * hN) + 0.5;
    if (Math.abs(uNew[i]) > uc) uNew[i] = Math.sign(uNew[i]) * uc;
  }
  etaNew[0] = eta[1]; uNew[0] = 0;                   // 左端反射墙
  etaNew[N - 1] = eta[N - 2]; uNew[N - 1] = 0;
  for (let i = 0; i < N; i++) {
    eta[i] = etaNew[i]; u[i] = uNew[i];
    dry[i] = hDep[i] + eta[i] <= HMIN ? 1 : 0;
  }
  /* 轻量平滑:压掉二阶色散的小振荡(仅对湿区)*/
  for (let i = 2; i < N - 2; i++) {
    if (dry[i] || dry[i + 1]) continue;
    eta[i] = 0.98 * eta[i] + 0.01 * (eta[i - 1] + eta[i + 1]);
  }
}
/* 波峰/岸线追踪 */
let crestPrev = X_QUAKE, crestT = 0;
function trackWave(dtSim) {
  let best = -1, bi = -1, trough = 0;
  for (let i = 0; i < N; i++) {
    const x = i / (N - 1) * LK;
    if (!dry[i] && x > 4 && eta[i] > best) { best = eta[i]; bi = i; }
    if (!dry[i] && x > 88 && x < 112) trough = Math.min(trough, eta[i]);
  }
  troughShore = trough;
  if (bi >= 0 && best > 0.12) {
    const cx = bi / (N - 1) * LK;
    crestAmp = best;
    crestT += dtSim;
    if (crestT > 20 && cx > crestPrev) {
      crestSpd = lerp(crestSpd, (cx - crestPrev) * 1000 / Math.max(crestT, 1), 0.25);
    }
    if (cx >= crestPrev) { crestX = cx; if (crestT > 20) { crestPrev = cx; crestT = 0; } }
  }
}

let floodFront = SHORE_KM, runupM = 0;
let floodMask = new Uint8Array(N);
function updateRunup() {

  for (let i = 0; i < N; i++) {

    const flooded = hDep[i] < 0 && -hDep[i] <= runupM;
    floodMask[i] = flooded ? 1 : 0;
    if (flooded) front = x;
  }
  floodFront = front;
  runupKm = Math.max(SHORE_KM, front);
  if (!housesHit && front > 112.3) housesHit = true;
}

  const pad = 18, padB = 20;
  const xOf2 = km => pad + km / LK * (W - pad - 10);
  const yMid = H * 0.44;
  const ampMax = Math.max(4, ampSlip * 4);
  const yOfEta = m => yMid - clamp(m / ampMax, -1, 1) * (H * 0.36);
  const yOfBed = d => yMid + 8 + clamp(d / 4000, 0, 1) * (H - padB - yMid - 10);
  /* 水深剖面填充 */
  ctx.fillStyle = 'rgba(107,128,150,.22)';
  ctx.beginPath();
  ctx.moveTo(xOf2(0), yOfBed(4000));
  for (let i = 0; i < N; i += 2) ctx.lineTo(xOf2(i / (N - 1) * LK), yOfBed(Math.max(hDep[i], 0)));
  ctx.lineTo(xOf2(LK), yOfBed(0));
  ctx.lineTo(xOf2(LK), yOfBed(4000));
  ctx.closePath();
  ctx.fill();
  /* 海平面 */
  ctx.strokeStyle = 'rgba(128,150,170,.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, yMid); ctx.lineTo(W - 10, yMid); ctx.stroke();
  /* Green 定律预期 A(km)=A0·(4000/h)^0.25 */
  ctx.strokeStyle = 'rgba(56,217,169,.75)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < N; i++) {
    const x = i / (N - 1) * LK;
    if (hDep[i] < 130 || hDep[i] > 4000) continue;
    const y = yOfEta(ampSlip * Math.pow(4000 / hDep[i], 0.25));
    started ? ctx.lineTo(xOf2(x), y) : (ctx.moveTo(xOf2(x), y), started = true);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  /* η(x) 实时 */
  ctx.strokeStyle = '#4dabf7'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < N; i += 2) {
    const x = i / (N - 1) * LK, y = yOfEta(dry[i] ? -hDep[i] : eta[i]);
    i === 0 ? ctx.moveTo(xOf2(x), y) : ctx.lineTo(xOf2(x), y);
  }
  ctx.stroke();
  /* 波峰点 */
  if (crestAmp > 0.12) {
    ctx.fillStyle = '#51cf66';
    ctx.beginPath(); ctx.arc(xOf2(crestX), yOfEta(crestAmp), 7, 0, Math.PI * 2); ctx.fill();
  }
  /* 浮标 */
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath(); ctx.arc(xOf2(X_BUOY), yOfEta(eta[buoyI]), 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = cTxt; ctx.font = '15px system-ui';
  ctx.fillText(L('km(波峰→岸)', 'km (crest → shore)'), W - 150, H - 4);
  ctx.fillText(L('η', 'η'), pad + 4, yMid - 8);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elAmp = document.getElementById('amp'), elAmpVal = document.getElementById('ampVal');
const elSpd = document.getElementById('spd'), elSpdVal = document.getElementById('spdVal');
const stC = document.getElementById('stC'), stA = document.getElementById('stA'), stH = document.getElementById('stH'),
  stT = document.getElementById('stT'), stS = document.getElementById('stS');
const formulaEl = document.getElementById('formula');
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.25, 2);
let spinOn = qsBool('spin', true);
let SIM_ACCEL = 60;
const setPlayLabel = () => { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); };
const setSlowBtn = () => {
  document.getElementById('btnSlow').classList.toggle('on', SIM_ACCEL < 30);
  document.getElementById('btnSlow').textContent = SIM_ACCEL < 30 ? L('慢动作 ×15 ✓', 'slow-mo ×15 ✓') : L('慢动作 ×15', 'slow-mo ×15');
};
function syncSliders() {
  elAmp.value = ampSlip; elAmpVal.textContent = ampSlip.toFixed(1) + ' m';
  elSpd.value = speed; elSpdVal.textContent = '×' + speed.toFixed(2).replace(/\.?0+$/, '');
}
function syncAll() { syncSliders(); updateFormula(); drawPlot(); }
function updateFormula() {
  const iC = clamp(Math.round(crestX / LK * (N - 1)), 0, N - 1);
  const hC = Math.max(hDep[iC], 0.5);
  const cKmh = Math.sqrt(G * hC) * 3.6;
  const greenA = ampSlip * Math.pow(4000 / Math.max(hC, 130), 0.25);
  formulaEl.innerHTML = L(
    `波峰处:h=${hC.toFixed(0)} m → c=√(gh)=<b>${(Math.sqrt(G * hC)).toFixed(0)} m/s(${cKmh.toFixed(0)} km/h)</b> · 模拟波峰 ${crestAmp.toFixed(1)} m<br>` +
    `Green:A=A₀(4000/h)^¼ ≈ <b>${greenA.toFixed(1)} m</b> · 时间加速 <b>×${SIM_ACCEL}</b> · t=${(tSim / 60).toFixed(1)} min`,
    `at the crest: h = ${hC.toFixed(0)} m → c = √(gh) = <b>${Math.sqrt(G * hC).toFixed(0)} m/s (${cKmh.toFixed(0)} km/h)</b> · model crest ${crestAmp.toFixed(1)} m<br>` +
    `Green: A = A₀(4000/h)^¼ ≈ <b>${greenA.toFixed(1)} m</b> · time ×${SIM_ACCEL} · t = ${(tSim / 60).toFixed(1)} min`);
}
document.getElementById('btnQuake').addEventListener('click', () => { triggerQuake(); syncAll(); });
document.getElementById('btnSlow').addEventListener('click', () => { SIM_ACCEL = SIM_ACCEL < 30 ? 60 : 15; setSlowBtn(); updateFormula(); });
document.getElementById('btnReset').addEventListener('click', () => { resetSim(); syncAll(); });
elAmp.addEventListener('input', () => { ampSlip = +elAmp.value; triggerQuake(); syncAll(); });
elSpd.addEventListener('input', () => { speed = +elSpd.value; syncSliders(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = spinOn;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dtSim = dt0 * (playing ? speed : 0) * SIM_ACCEL;
  if (dtSim > 0) {
    if (SIM_JUMP) { /* 快进到浅化阶段:模拟 90 s */
      for (let k = 0; k < Math.round(90 / DT); k++) { stepSWE(); tSim += DT; }
      SIM_JUMP = 0;
    }
    let acc = dtSim;
    const budget = Math.min(Math.round(dtSim / DT) + 1, 240);
    let done = 0;
    while (acc > 0 && done < budget) {
      stepSWE();
      acc -= DT; done++;
      tSim += DT;
    }
    if (quakeT > 0) quakeT -= dt0;
    trackWave(dtSim);
    updateRunup();
    lblCrest.position.set(xOf(crestX), ySurf(clamp(Math.round(crestX / LK * (N - 1)), 0, N - 1)) + 0.55, 0);
    updateSurfMesh();
    updateBuoy();
    /* 小屋被淹:倾倒 */
    for (const hh of houses) {
      if (housesHit && !hh.userData.hit) {
        hh.userData.hit = true;
        hh.rotation.z = (Math.random() - 0.5) * 0.9;
        hh.position.y = hh.userData.y0 - 0.06;
      }
    }
    /* 断层脉冲 */
    const fq = Math.max(quakeT, 0) / 1.4;
    faultG.children[0].scale.setScalar(1 + fq * 1.2);
    faultG.children[0].position.y = yBed(clamp(Math.round(X_QUAKE / LK * (N - 1)), 0, N - 1)) - 0.05 + fq * 0.18;
  }
  statsAcc += dt0;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    const iC = clamp(Math.round(crestX / LK * (N - 1)), 0, N - 1);
    const hC = Math.max(hDep[iC], 0.5);
    stC.textContent = (Math.sqrt(G * hC) * 3.6).toFixed(0) + ' km/h';
    stC.className = 'v ' + (Math.sqrt(G * hC) * 3.6 < 120 ? 'warn' : 'ok');
    stA.textContent = crestAmp.toFixed(1) + ' m';
    stA.className = 'v ' + (crestAmp > 4 ? 'bad' : crestAmp > 1.5 ? 'warn' : 'ok');
    stH.textContent = hC.toFixed(0) + ' m';
    stT.textContent = (tSim / 60).toFixed(1) + ' min';
    const ph = tSim < 1 ? L('待触发', 'idle')
      : crestX < 70 ? L('深海传播', 'deep-ocean run')
      : crestX < 104 ? L('浅化:增高加速', 'shoaling: piling up')
      : runupKm > SHORE_KM + 0.5 ? L('上岸!⚠', 'run-up! ⚠')
      : L('近岸', 'near shore');
    stS.textContent = ph;
    stS.className = 'v ' + (ph.includes('上岸') || ph.includes('run-up') ? 'bad' : ph.includes('浅化') || ph.includes('shoal') ? 'warn' : 'ok');
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
ampSlip = clamp(qsFloat('a', 2.0), 0.5, 5);
setPlayLabel();
setSlowBtn();
buildSteps();
applyTheme();
resetSim();
updateRunup();
applyLang();
syncAll();
updateBedMesh();
updateSurfMesh();
updateBuoy();
start();
</script>
</body>
</html>
