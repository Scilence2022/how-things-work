<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>海市蜃楼与大气折射 · 光向冷侧弯,路面浮出水潭</title>
<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);

  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}

  #panelToggle { display: flex; align-items: center; justify-content: center;

    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);

  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;

</style>

  <div class="sub" data-zh="地表被晒热,贴地空气「下热上冷」,密度与折射率便下小上大(n-1∝1/T),光每一步都向更冷更密的一侧偏一点,直路画成弧:柏油路上方的天空之光被弯回眼睛,顺着入射方向反推出去,路面上就浮出一汪倒映天空的「水潭」;冷海面上梯度反向,光线向下弯、远方景物被抬升甚至叠出双像;低空的月亮下缘穿过更密的气层被抬得更多(≈34′ 对 28′),月面便上下压扁 · 拖动旋转 / 空格运行/暂停" data-en="A sun-baked surface leaves the air hot below and cool above, so density and refractive index rise with height (n-1∝1/T) and light tilts a little toward the cooler, denser side at every step — a straight path bends into an arc: sky light above hot asphalt is curled back into your eye, and extending it onward paints a 'puddle' of inverted sky on the road; over a cold sea the gradient flips, rays bow downward and distant objects loom or double; the low Moon's lower limb crosses denser air and is lifted more (≈34′ vs 28′), squashing the disc · drag to orbit / Space = run/pause">地表被晒热,贴地空气「下热上冷」,密度与折射率便下小上大(n-1∝1/T),光每一步都向更冷更密的一侧偏一点,直路画成弧:柏油路上方的天空之光被弯回眼睛,顺着入射方向反推出去,路面上就浮出一汪倒映天空的「水潭」;冷海面上梯度反向,光线向下弯、远方景物被抬升甚至叠出双像;低空的月亮下缘穿过更密的气层被抬得更多(≈34′ 对 28′),月面便上下压扁 · 拖动旋转 / 空格运行/暂停</div>

<script type="module">

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0e1620,28,72);

camera.position.set(0.6,3.8,17.8);

/* ── 场景:侧视剖面 — 观察者在左 x=-9,棕榈在右 x=+9,梯度只在近地薄层 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x26282c,roughness:0.95});

const band=new THREE.Mesh(new THREE.PlaneGeometry(26,2.2),bandM);
band.rotation.x=-Math.PI/2;band.position.y=0.006;scene.add(band);
function buildPalm(tm,lm){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.16,2.7,10),tm);
  trunk.position.y=1.35;trunk.rotation.z=0.05;g.add(trunk);

    const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.13,1.6,6),lm);
    leaf.scale.z=0.3;leaf.rotation.z=2.25-i*0.12;leaf.position.y=0.45;
    arm.add(leaf);g.add(arm);
  }
  return g;
}
const trunkM=new THREE.MeshStandardMaterial({color:0x8a6a42,roughness:0.85});
const leafM=new THREE.MeshStandardMaterial({color:0x3f9a4d,roughness:0.7,side:THREE.DoubleSide});
const palm=buildPalm(trunkM,leafM);palm.position.set(9,0,0);scene.add(palm);
const gTm=trunkM.clone();gTm.transparent=true;gTm.opacity=0.32;
const gLm=leafM.clone();gLm.transparent=true;gLm.opacity=0.32;
const ghost=buildPalm(gTm,gLm);ghost.scale.y=-1;ghost.visible=false;scene.add(ghost);
/* 观察者 */
const eyeG=new THREE.Group();eyeG.position.x=-9;scene.add(eyeG);
const postM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.6});
const post=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,1,8),postM);eyeG.add(post);
const eyeball=new THREE.Mesh(new THREE.SphereGeometry(0.15,16,12),
  new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.3}));eyeG.add(eyeball);
/* 月亮(低空月扁模式) */
const moonG=new THREE.Group();moonG.position.set(9,0.4,0);moonG.visible=false;scene.add(moonG);
const moonBall=new THREE.Mesh(new THREE.SphereGeometry(0.46,36,24),
  new THREE.MeshStandardMaterial({color:0xe8e2d2,roughness:0.9,emissive:0x8a8574,emissiveIntensity:0.35}));
moonG.add(moonBall);
const truePts=new THREE.EllipseCurve(0,0,0.46,0.46).getPoints(60).map(p=>new THREE.Vector3(p.x,p.y,0));
const moonTrue=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(truePts),
  new THREE.LineBasicMaterial({color:0x9aa8bc,transparent:true,opacity:0.55}));
moonTrue.position.set(9,0,0);moonTrue.visible=false;scene.add(moonTrue);
/* 水潭倒像 */
const puddle=new THREE.Mesh(new THREE.CircleGeometry(1,40),
  new THREE.MeshBasicMaterial({color:0xbfe3ff,transparent:true,opacity:0.28,depthWrite:false}));
puddle.rotation.x=-Math.PI/2;puddle.scale.set(2.6,1.15,1);puddle.position.set(9.4,0.012,0);
puddle.visible=false;scene.add(puddle);
/* 温度场色层 */
const fieldPlanes=[];
{
  const fGeo=new THREE.PlaneGeometry(23,1.7);
  for(let i=0;i<9;i++){
    const m=new THREE.MeshBasicMaterial({color:0x888888,transparent:true,opacity:0.085,
      side:THREE.DoubleSide,depthWrite:false});
    const p=new THREE.Mesh(fGeo,m);p.rotation.x=-Math.PI/2;p.position.set(0,0.16+i*0.235,0);
    scene.add(p);fieldPlanes.push(m);
  }
}
const COOL=new THREE.Color(0x3f7fe0),HOT=new THREE.Color(0xff5a36);
/* 光线:折线 Line + 流动光点 */
const RCOL={sky:0x86c5ff,palm:0x8ce99a,road:0x98a2b3,moon:0xffe9a8};
const rayLines=[];
for(let i=0;i<8;i++){
  const mat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.85});

}
const probeMat=new THREE.LineBasicMaterial({color:0x8fdcef,transparent:true,opacity:0.95,depthTest:false});
const probeLine=new THREE.Line(new THREE.BufferGeometry(),probeMat);

let mode='inferior',SURF=55,EYE=1.6,FAN=3,playing=true,labelsOn=true,slowMo=false,fieldOn=true;
let simT=0,dwell=0,ghostY=0,ghostOn=false,puddleOn=false,moonD=null;
const EXAG=1200,HPROF=0.8,TAIR=25,XE=-9,XP=9,YPP=1.6,SEA_T=8;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function tempAt(y){const Ts=mode==='moon'?SEA_T:SURF;
  return TAIR+(Ts-TAIR)*Math.exp(-Math.max(y,0)/HPROF);}
function nAir(y){return 1+2.93e-4*288/(tempAt(y)+273.15);}
function nTrace(y){return 1+(nAir(Math.max(y,0.015))-1)*EXAG;}
/* 分层介质不变量 n·cosθ=K:每步向 n 大的一侧偏,遇 n=K 层折返 */
function trace(th0){
  let x=XE,y=EYE,s=th0<0?-1:1,turned=false,hit='sky',hitY=EYE+20;
  const pts=[x,y];
  const K=nTrace(EYE)*Math.cos(Math.abs(th0));
  for(let i=0;i<720;i++){
    const c=Math.min(K/nTrace(y),1);
    if(!turned&&c>0.999999&&Math.abs(y-EYE)>0.03){turned=true;s=-s;}
    const th=Math.acos(c);
    x+=0.06;y+=s*Math.tan(th)*0.06;
    pts.push(x,y);
    if(y<=0.015){hit='road';hitY=0;break;}
    if(x>=XP){hit=y<=3.35?'palm':'sky';hitY=y;break;}
  }
  return {pts,hit,turned,hitY,th0};
}
function scanSolve(targetY,lo,hi,wantTurned){
  let best=lo,bestScore=1e9;
  for(let i=0;i<=110;i++){
    const a=lo+(hi-lo)*i/110,r=trace(a);
    const y=r.hit==='road'?-8:r.hitY;
    let sc=Math.abs(y-targetY);
    if(r.turned!==wantTurned)sc+=6;
    if(sc<bestScore){bestScore=sc;best=a;}
  }
  return best;
}
/* 标准大气折射表(视高度°→抬升′),低空月扁用 */
const MTBL=[[0,34.5],[0.5,29.2],[1,24.4],[1.5,21.0],[2,18.2],[2.5,16.0],[3,14.3],[4,11.9],[5,9.9],[6,8.5],[8,6.4],[10,5.2]];
function refTbl(h){h=clamp(h,0,10);
  for(let i=1;i<MTBL.length;i++)if(h<=MTBL[i][0]){
    const a=MTBL[i-1],b=MTBL[i];
    return a[1]+(b[1]-a[1])*(h-a[0])/(b[0]-a[0]);
  }
  return 5.2;}
function moonCalc(){
  const hA=SURF,liftL=refTbl(hA);
  let Dv=31.1,liftU=refTbl(hA+Dv/60);
  for(let k=0;k<3;k++){liftU=refTbl(hA+Dv/60);Dv=31.1-Math.max(liftL-liftU,0);}
  return {hA,liftL,liftU,Dv,flat:liftL-liftU};
}

}

function setLine(line,pts){
  const arr=[];
  for(let i=0;i<pts.length;i+=2)arr.push(pts[i],pts[i+1],0);
  line.geometry.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  line.geometry.computeBoundingSphere();
}
function refreshScene(){
  palm.visible=mode!=='moon';
  moonG.visible=moonTrue.visible=(mode==='moon');
  eyeG.position.y=0;post.scale.y=EYE;post.position.y=EYE/2;eyeball.position.y=EYE;
  lblEye.position.set(-9,EYE+0.45,0);
  lblProbe.position.set(-6.6,EYE+0.85,0);
  lblGhost.position.y=ghostY+0.3;
  /* 温度场色层 */
  const Ts=mode==='moon'?SEA_T:SURF,lo=Math.min(Ts,TAIR),hi=Math.max(Ts,TAIR);
  for(let i=0;i<9;i++){
    const y=0.16+i*0.235,T=tempAt(y);
    const t=hi>lo?clamp((T-lo)/(hi-lo),0,1):0;
    fieldPlanes[i].color.copy(COOL).lerp(HOT,t);

  /* 地表:柏油 or 海面 */
  const dark=THEME==='dark';
  if(mode==='inferior'){

  }else{
    groundM.color.setHex(dark?0x14304a:0x9cc2da);bandM.color.setHex(dark?0x1d4266:0x86b3cf);
  }
}
let mirageA=null;
function rebuildRays(){
  let list=[];
  mirageA=null;ghostOn=false;puddleOn=false;moonD=null;
  if(mode==='inferior'){
    list.push({r:trace(scanSolve(3.05,0.3*d2r,12*d2r,false))});
    list.push({r:trace(scanSolve(2.2,0.05*d2r,12*d2r,false))});
    list.push({r:trace(scanSolve(5.3,4*d2r,14*d2r,false))});
    const aT=scanSolve(3.05,-14*d2r,-0.2*d2r,true);
    list.push({r:trace(aT),a:aT});
    list.push({r:trace(scanSolve(2.3,-14*d2r,-0.2*d2r,true))});
    list.push({r:trace(scanSolve(4.8,-14*d2r,-0.2*d2r,true))});
    list.push({r:trace(-12.5*d2r)});
    const mt=list[3];
    if(mt.r.turned&&mt.r.hit==='palm'){
      mirageA=aT;ghostY=EYE+18*Math.tan(aT);
      ghostOn=Math.abs(ghostY-2.7)>0.45;puddleOn=ghostOn;
    }
  }else if(mode==='superior'){
    list.push({r:trace(scanSolve(3.05,0.3*d2r,11*d2r,false))});
    list.push({r:trace(scanSolve(2.2,0.05*d2r,11*d2r,false))});
    const aT=scanSolve(3.05,0.5*d2r,11*d2r,true);
    list.push({r:trace(aT),a:aT});
    list.push({r:trace(scanSolve(2.3,0.5*d2r,11*d2r,true))});
    list.push({r:trace(scanSolve(5.0,0.5*d2r,11*d2r,true))});
    if(list[2].r.turned&&list[2].r.hit==='palm'){
      mirageA=aT;ghostY=EYE+18*Math.tan(aT);
      ghostOn=Math.abs(ghostY-2.7)>0.45;
    }
  }else{
    moonD=moonCalc();
    const yl=moonD.hA*YPP,yc=(moonD.hA+moonD.Dv/120)*YPP,yu=(moonD.hA+moonD.Dv/60)*YPP;
    list.push({r:trace(scanSolve(Math.max(yl,0.03),0.3*d2r,11*d2r,true))});
    list.push({r:trace(scanSolve(yc,0.3*d2r,11*d2r,true))});
    list.push({r:trace(scanSolve(yu,0.3*d2r,11*d2r,true))});
    moonG.position.y=yc;moonBall.scale.set(1,clamp(moonD.Dv/31.1,0.2,1),1);
    const ycT=(moonD.hA+moonD.Dv/120-(moonD.liftL+moonD.liftU)/120)*YPP;
    moonTrue.position.y=ycT;
    lblMoonL.position.set(10.4,Math.max(yl,0.1)+0.25,0);
    lblMoonT.position.set(9,ycT-0.75,0);
  }
  ghost.visible=ghostOn&&mode!=='moon';
  if(ghost.visible)ghost.position.set(9,ghostY,0);
  puddle.visible=puddleOn;
  rayLines.forEach((rl,i)=>{
    if(i<list.length){
      rl.pts=list[i].r.pts;rl.line.visible=true;
      const h=list[i].r.hit;
      rl.mat.color.setHex(mode==='moon'?RCOL.moon:RCOL[h]||RCOL.sky);
      rl.pulse.material.color.setHex(rl.mat.color.getHex());
    }else{rl.line.visible=false;rl.pts=[];}
  });
  lblGhost.position.y=ghostY+0.3;
}
let probePts=[];
function rebuildProbe(){
  const a=(mode==='inferior'?-1:1)*FAN*d2r;
  const r=trace(a);probePts=r.pts;
  setLine(probeLine,probePts);
  let mi=0,minY=1e9;
  for(let i=1;i<probePts.length/2;i++){
    if(probePts[i*2+1]<minY){minY=probePts[i*2+1];mi=i;}
  }
  probeDot.visible=r.turned;
  probeDot.position.set(probePts[mi*2],minY,0);
}

 {zh:'<b>n 随密度变化</b>:空气冷则密、n 大,热则疏、n 小,n-1∝1/T——一切蜃景的根',

let activeStep=0;

  const el=document.getElementById('steps');el.innerHTML='';

    const li=document.createElement('li');

    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

function updateStats(){
  const Ts=mode==='moon'?SEA_T:SURF,T0=Ts+273.15;
  const nS=1+2.93e-4*288/T0;
  const dndh=(-(Ts-TAIR)/HPROF)*(-2.93e-4*288/(T0*T0));
  document.getElementById('stN').innerHTML=nS.toFixed(6);
  const gv=document.getElementById('stG');
  gv.innerHTML=(dndh/1e-6).toFixed(1)+'<small> ×10⁻⁶/m</small>';
  gv.className='v '+(Math.abs(dndh)>2e-5?'ok':(Math.abs(dndh)<5e-6?'warn':''));
  const rv=document.getElementById('stR');
  if(Math.abs(dndh)<1e-8){
    rv.innerHTML='—<small> km</small>';rv.className='v';
  }else{
    const Rkm=1/Math.abs(dndh)/1000;
    rv.innerHTML=Rkm.toFixed(1)+'<small> km</small>';
    rv.className='v '+(Rkm<30?'ok':(Rkm>80?'warn':''));
  }
  const av=document.getElementById('stA');
  if(mode==='moon'&&moonD){
    av.innerHTML=moonD.liftL.toFixed(1)+'<small> ′</small>';
    av.className='v '+(moonD.liftL>=25?'ok':(moonD.liftL<10?'warn':''));
  }else{
    const a=mirageA===null?0:Math.abs(Math.atan2(ghostY-EYE,18))/d2r*60;
    av.innerHTML=a.toFixed(0)+'<small> ′</small>';
    av.className='v '+(ghostOn?'ok':'warn');
  }
}

const clock=new THREE.Clock();
let raf=null;
const DWELL=7;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  if(playing){dwell+=dts;if(dwell>DWELL)applyPhase((activeStep+1)%STEPS.length);}
  /* 光脉冲:沿光线从远处流向眼睛 */
  for(const rl of rayLines){
    const n=rl.pts.length/2;
    if(!n){rl.pulse.visible=false;continue;}
    const u=(simT*0.13+rl.off)%1;
    const k=Math.max(0,Math.floor((1-u)*(n-1)));
    rl.pulse.visible=true;
    rl.pulse.position.set(rl.pts[k*2],rl.pts[k*2+1],0);
  }
  puddle.material.opacity=0.22+0.1*Math.sin(simT*2.2);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);else applyPhase(1);
updateStats();syncPlayBtn();start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
