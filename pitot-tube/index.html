<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>皮托管 · 把动压换成读数</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#4dabf7;
    --bg:#0e1216;--panel:rgba(14,18,22,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(14,18,22,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(14,18,22,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1971c2;
    --bg:#eef2f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(77,171,247,.9);color:#cde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}

    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

    transition:border-color .15s,color .15s,transform .15s}

  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(77,171,247,.6);background:rgba(77,171,247,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(25,113,194,.55);background:rgba(25,113,194,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  input[type=range]{width:100%;accent-color:var(--acc);height:18px}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;

  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}

  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0e1216,20,52);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-8.5,4.6,10.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.3,0.7,0.6);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(4,8,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-6,4,-5);scene.add(fill);

/* ---- 材质 ---- */
const wallM=new THREE.MeshPhysicalMaterial({color:0x9ec8ee,transparent:true,opacity:0.10,
  roughness:0.12,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const frameM=new THREE.LineBasicMaterial({color:0x41546a,transparent:true,opacity:0.9});
const pitotM=new THREE.MeshStandardMaterial({color:0xd9dee5,metalness:0.85,roughness:0.32});
const portM=new THREE.MeshStandardMaterial({color:0x1c2126,roughness:0.6});
const accentM=new THREE.MeshStandardMaterial({color:0x4dabf7,emissive:0x1864ab,emissiveIntensity:0.5,roughness:0.35});
const redM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.4,roughness:0.4});
const hoseTM=new THREE.MeshStandardMaterial({color:0xff8787,roughness:0.55});
const hoseSM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.55});
const glassM=new THREE.MeshPhysicalMaterial({color:0xcfe8ff,transparent:true,opacity:0.22,
  roughness:0.06,metalness:0,depthWrite:false});
const liqM=new THREE.MeshStandardMaterial({color:0xff5c5c,emissive:0xa61e1e,emissiveIntensity:0.35,roughness:0.25});
const iceM=new THREE.MeshStandardMaterial({color:0xe8f4ff,roughness:0.38,metalness:0.05});
const groundM=new THREE.MeshStandardMaterial({color:0x171b21,roughness:0.95});
const boardM=new THREE.MeshStandardMaterial({color:0x232a33,roughness:0.8});
const pulseM=new THREE.MeshBasicMaterial({color:0x4dabf7,transparent:true,opacity:0.6});
const tickM=new THREE.LineBasicMaterial({color:0x8fa3b8,transparent:true,opacity:0.75});
const arrM=redM;

/* ---- 风洞：半透明长方管，x=流向，来流从 -x 吹向 +x ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(22,0.3,10),groundM);
ground.position.set(0,-1.45,0);scene.add(ground);
function slab(w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallM);m.position.set(x,y,z);scene.add(m);return m;}
slab(13.6,0.1,2.0, 0,-1.2, 0);            // 底板
slab(13.6,0.1,2.0, 0, 1.2, 0);            // 顶板
slab(13.6,2.5,0.06,0, 0, 0.98);           // 侧板 z+
slab(13.6,2.5,0.06,0, 0,-0.98);           // 侧板 z-
{ // 环形加强框
  const fr=[],hw=1.27,hd=0.99;
  for(const fx of [-6.5,-3.25,0,3.25,6.5])
    fr.push(fx,-hw,-hd,fx,hw,-hd, fx,hw,-hd,fx,hw,hd, fx,hw,hd,fx,-hw,hd, fx,-hw,hd,fx,-hw,-hd);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(fr,3));
  scene.add(new THREE.LineSegments(g,frameM));
}

/* ---- 皮托管（L 形 Prandtl 管）：全压口迎风 + 侧壁静压孔 ---- */
const pitot=new THREE.Group();scene.add(pitot);
{
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,3.4,20),pitotM);
  body.rotation.z=Math.PI/2;pitot.add(body);                       // 水平段 x∈[-1.7,1.7]
  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.09,20,14),pitotM);
  nose.scale.set(1.9,1,1);nose.position.x=-1.7;pitot.add(nose);    // 圆钝头
  const tport=new THREE.Mesh(new THREE.CircleGeometry(0.032,16),portM);
  tport.rotation.y=-Math.PI/2;tport.position.x=-1.876;pitot.add(tport); // 全压口(驻点)
  for(const sx of [-0.55,-0.85]){                                  // 静压孔 ×2(顶面)
    const d=new THREE.Mesh(new THREE.CircleGeometry(0.03,12),portM);
    d.rotation.x=-Math.PI/2;d.position.set(sx,0.091,0);pitot.add(d);
  }
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,1.45,16),pitotM);
  stem.position.set(1.45,0.725,0);pitot.add(stem);                 // L 形立杆穿出顶板
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.075,14,10),pitotM);
  cap.position.set(1.45,1.45,0);pitot.add(cap);
}
/* 结冰组：总压口被冰封 */
const iceGrp=new THREE.Group();iceGrp.visible=false;scene.add(iceGrp);
{
  const geo=new THREE.IcosahedronGeometry(0.17,1);
  const p=geo.attributes.position,v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);
    const n=0.78+0.4*Math.abs(Math.sin(v.x*43.7+v.y*17.3+v.z*31.1)); // 位置哈希，避免裂缝
    v.multiplyScalar(n);p.setXYZ(i,v.x,v.y,v.z);}
  geo.computeVertexNormals();
  const blob=new THREE.Mesh(geo,iceM);blob.scale.set(1.5,1,1);blob.position.x=-1.86;iceGrp.add(blob);
  for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(0.025,0.14,8),iceM);
    c.position.set(-1.86+0.1*Math.cos(i*2.1),-0.17,0.07*Math.sin(i*2.1));c.rotation.x=Math.PI;iceGrp.add(c);}
}

/* ---- U 形压差计：玻璃 U 管 + 红色液柱 + 刻度背板 ---- */
const manu=new THREE.Group();manu.position.set(4.3,0,2.5);scene.add(manu);
{
  const pts=[[-0.55,3.3],[-0.55,2.2],[-0.55,1.5],[-0.42,1.02],[0,0.8],[0.42,1.02],[0.55,1.5],[0.55,2.2],[0.55,3.3]]
    .map(p=>new THREE.Vector3(p[0],p[1],0));
  const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),48,0.14,14),glassM);
  manu.add(tube);
  const capT=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.16,10),hoseTM);capT.position.set(-0.55,3.38,0);
  const capS=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.16,10),hoseSM);capS.position.set(0.55,3.38,0);
  manu.add(capT,capS);
}
const bendLiq=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.082,10,28,Math.PI),liqM);
bendLiq.rotation.z=Math.PI;bendLiq.position.y=1.35;manu.add(bendLiq);   // 弯管内常满
const liqGeo=new THREE.CylinderGeometry(0.082,0.082,1,12);
const liqL=new THREE.Mesh(liqGeo,liqM);liqL.position.x=-0.55;manu.add(liqL); // 全压侧(被压低)
const liqR=new THREE.Mesh(liqGeo,liqM);liqR.position.x= 0.55;manu.add(liqR); // 静压侧(升高)
{
  const board=new THREE.Mesh(new THREE.BoxGeometry(1.9,2.5,0.06),boardM);board.position.set(0,2.3,-0.22);manu.add(board);
  const tp=[];
  for(let n=0;n<=10;n++){const yy=1.3+n*0.2,len=n%5===0?0.18:0.09;tp.push(0.72,yy,-0.15,0.72+len,yy,-0.15);}
  const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.Float32BufferAttribute(tp,3));
  manu.add(new THREE.LineSegments(tg,tickM));
  const stand=new THREE.Mesh(new THREE.BoxGeometry(1.1,2.05,0.5),boardM);stand.position.set(0,-0.28,0);manu.add(stand);
  const base=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.1,0.8),boardM);base.position.set(0,-1.25,0);manu.add(base);
}
/* 测压软管：全压(红)/静压(蓝) 从立杆引到 U 管 */
function hose(points,mat){
  const c=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  const m=new THREE.Mesh(new THREE.TubeGeometry(c,36,0.034,8),mat);scene.add(m);return m;
}
hose([[1.45,1.52,0.05],[1.6,2.1,0.7],[2.6,2.9,2.0],[3.75,3.42,2.5]],hoseTM);
hose([[1.45,1.52,-0.05],[1.2,2.5,0.9],[2.8,3.2,2.55],[4.85,3.42,2.5]],hoseSM);

/* ---- 高亮脉冲环 ---- */
function ring(pos,rot,r){
  const m=new THREE.Mesh(new THREE.TorusGeometry(r,0.016,8,36),pulseM);
  m.position.copy(pos);if(rot)m.rotation.set(rot[0],rot[1],rot[2]);
  m.visible=false;scene.add(m);return m;
}
const ringNose=ring(new THREE.Vector3(-1.96,0,0),[0,Math.PI/2,0],0.22);
const ringStat1=ring(new THREE.Vector3(-0.55,0.1,0),[Math.PI/2,0,0],0.07);
const ringStat2=ring(new THREE.Vector3(-0.85,0.1,0),[Math.PI/2,0,0],0.07);
const ringU=ring(new THREE.Vector3(4.3,2.35,2.85),null,0.85);

/* ---- 流线粒子：势流绕圆柱（驻点在迎风面），颜色=局部速率 ---- */
const P_N=900,P_SPD=0.045,STAG_X=-1.8,R_EFF=0.16;   // 速度→场景比例/驻点中心/有效半径(示意)
const pPos=new Float32Array(P_N*3),pCol=new Float32Array(P_N*3);
function respawn(i,x){
  pPos[i*3]=x!==undefined?x:-6.2+Math.random()*0.6;
  pPos[i*3+1]=(Math.random()*2-1)*0.85;
  let z=(Math.random()*2-1)*0.78;
  if(Math.abs(pPos[i*3+1])<0.3&&Math.abs(pPos[i*3]-STAG_X)<R_EFF+0.05)
    z=(z>0?1:-1)*(R_EFF+0.12+Math.random()*0.5);
  pPos[i*3+2]=z;
}
for(let i=0;i<P_N;i++)respawn(i,-6.2+Math.random()*12.4);
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const points=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.075,vertexColors:true,
  transparent:true,opacity:0.95,depthWrite:false}));
scene.add(points);
function updateParticles(dt){
  const V=v;
  for(let i=0;i<P_N;i++){
    const ix=i*3;let x=pPos[ix],y=pPos[ix+1],z=pPos[ix+2];
    const dx=x-STAG_X,r2=dx*dx+z*z;
    let u=V,w=0;
    if(r2<R_EFF*R_EFF*4){                    // 近场：二维势流绕圆柱
      const f=Math.exp(-y*y/0.30);           // 离中面越远扰动越小
      const c=R_EFF*R_EFF/(r2*r2);
      u=V*(1-f*c*(dx*dx-z*z));
      w=V*(-f*2*c*dx*z);
    }
    x+=u*P_SPD*dt;z+=w*P_SPD*dt;
    if(x>6.3||Math.abs(z)>0.85||(r2<R_EFF*R_EFF*1.1&&Math.abs(y)<0.15)){respawn(i);continue;}
    pPos[ix]=x;pPos[ix+1]=y;pPos[ix+2]=z;
    const s=V>1?Math.min(1,Math.sqrt(u*u+w*w)/V):0.5,t=s*s;   // 慢→红(驻点停滞) 快→蓝
    pCol[ix]=1.0-0.55*t;pCol[ix+1]=0.42+0.33*t;pCol[ix+2]=0.42+0.58*t;
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
}

/* ---- 箭头 ---- */
function makeArrow(mat){
  const g=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,1,10),mat);g.add(shaft);
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.32,12),mat);head.position.y=0.6;g.add(head);
  g.visible=false;scene.add(g);return g;
}
const flowArr=makeArrow(accentM),stagArr=makeArrow(redM);
function setArrow(g,from,to){
  const d=to.clone().sub(from),len=d.length();
  if(len<0.12){g.visible=false;return;}
  g.visible=true;g.position.copy(from);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  g.scale.set(1,len,1);
}

/* ---- 状态 ----
   真实物理：ISA 大气 ρ=1.225·f^4.25588、p=101325·f^5.25588（f=1-2.25577e-5·h）；
   动压 ΔP=½ρv²；指示空速按海平面密度反解 v_ias=√(2ΔP/ρ0)。
   U 管液面差按平方根压缩显示以适配视野，刻度数值为真实值。 */
let playing=true,labelsOn=true,simT=0;
let v=85,alt=0,iced=false,activeStep=0,qMeas=0.5*1.225*85*85;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
const rho=()=>{const f=1-2.25577e-5*alt;return 1.225*Math.pow(f,4.25588);};
const pStatic=()=>{const f=1-2.25577e-5*alt;return 101325*Math.pow(f,5.25588);};
const qTrue=()=>0.5*rho()*v*v;

function refreshValTexts(){
  document.getElementById('sVelVal').textContent=Math.round(v)+' m/s';
  const a=alt>=1000?(alt/1000).toFixed(1)+'km':alt+'m';
  document.getElementById('sAltVal').textContent=a+'·ρ'+rho().toFixed(2);
  syncPlayBtn();
}
function setVel(val){v=val;document.getElementById('sVel').value=val;refreshValTexts();}
function setAlt(val){alt=val;document.getElementById('sAlt').value=val;refreshValTexts();}
function setIce(on){iced=on;document.getElementById('tglIce').checked=on;if(!on)qMeas=qTrue();}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'迎面开孔：气流正撞管口，驻点处流速归零',en:'Nose-on port: flow rams the mouth and stops dead at the stagnation point'},
 {zh:'动压 ½ρv² 全部转成静压：总压口感受 p+½ρv²',en:'All dynamic pressure ½ρv² turns static: the port senses p+½ρv²'},
 {zh:'侧壁开孔：气流平行掠过，只量当地静压 p',en:'Side-wall ports: flow grazes by, sensing only the local static p'},
 {zh:'两口接 U 形管：液面高度差读出 ΔP=½ρv²',en:'Both ports feed a U-tube: the level difference reads ΔP=½ρv²'},
 {zh:'开方得空速 v=√(2ΔP/ρ)，指针就是解出的方程',en:'Square root gives v=√(2ΔP/ρ) — the needle is the solved equation'},
 {zh:'结冰=错误的空速：总压口被冰封死，法航447 的注脚',en:'Icing = false airspeed: a frozen total port — the Air France 447 footnote'},
];
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  activeStep=i;
  if(i===5)setIce(true);else setIce(false);
  if(i===0){setVel(85);setAlt(0);playing=true;}
  syncSteps();syncPlayBtn();
}

/* ---- 读数 ---- */
function updateStats(){
  const qT=qTrue();
  document.getElementById('stV').innerHTML=v.toFixed(0)+'<small> m/s</small>';
  document.getElementById('stQ').innerHTML=Math.round(qT)+'<small> Pa</small>';
  document.getElementById('stP').innerHTML=(pStatic()/1000).toFixed(1)+'<small> kPa</small>';
  const ias=Math.sqrt(2*qMeas/1.225)*1.94384;    // 1 m/s = 1.94384 kt
  const elI=document.getElementById('stIAS');
  elI.innerHTML=Math.round(ias)+'<small> kt</small>';
  elI.className='v'+(iced&&qMeas<0.5*qT?' warn':'');
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
addLabel(()=>L('全压口 · 迎面开孔','Total port · nose-on'),V3(-2.2,0.55,0),'b',()=>!iced);
addLabel(()=>L('驻点：流速→0，动压全部转为静压','Stagnation: v→0, dynamic → static'),V3(-2.6,1.4,0),'r',
  ()=>stagOn&&!iced);
addLabel(()=>L('静压孔 ×2：气流平行掠过，只感静压','Static ports ×2: parallel flow, senses p only'),V3(-0.7,0.62,0),'g',
  ()=>statOn);
addLabel(()=>L('总压口冰堵：ΔP→0，空速不可信！','Total port iced: ΔP→0, airspeed false!'),V3(-2.4,1.4,0),'r',
  ()=>iced);
addLabel(()=>`${L('来流 v','Flow v')} = ${Math.round(v)} m/s`,V3(-6.2,0.8,0),'b',()=>v>1);
addLabel(()=>L('全压','Total'),V3(3.75,3.62,2.5),'r',()=>true);
addLabel(()=>L('静压','Static'),V3(4.85,3.62,2.5),'b',()=>true);
addLabel(()=>`${L('ΔP = ','ΔP = ')}${Math.round(qMeas)} Pa${L(' ≈ 水柱 ',' ≈ water col. ')}${Math.round(qMeas/9.81)} mm`,
  V3(4.3,4.15,2.5),'o',()=>true);
addLabel(()=>L('v = √(2ΔP/ρ) → 仪表开方即空速','v = √(2ΔP/ρ) — the gauge square-roots it'),V3(4.3,4.75,2.5),'o',
  ()=>activeStep===4);

/* ---- 事件 ---- */
let stagOn=true,statOn=true;
document.getElementById('sVel').addEventListener('input',e=>setVel(+e.target.value));
document.getElementById('sAlt').addEventListener('input',e=>setAlt(+e.target.value));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglFlow').addEventListener('change',e=>{points.visible=e.target.checked;});
document.getElementById('tglStag').addEventListener('change',e=>{stagOn=e.target.checked;});
document.getElementById('tglStatic').addEventListener('change',e=>{statOn=e.target.checked;});
document.getElementById('tglIce').addEventListener('change',e=>{
  setIce(e.target.checked);
  if(iced&&activeStep!==5){activeStep=5;syncSteps();}     // 手动结冰 → 跳到注脚步骤
  else if(!iced&&activeStep===5){activeStep=0;syncSteps();}
});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('btnSL').addEventListener('click',()=>{setVel(85);setAlt(0);setIce(false);playing=true;syncPlayBtn();});
document.getElementById('btnCruise').addEventListener('click',()=>{setVel(230);setAlt(11000);setIce(false);playing=true;syncPlayBtn();});
document.getElementById('btnIce').addEventListener('click',()=>{setIce(!iced);playing=true;syncPlayBtn();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0e1216:0xe8edf3);
  scene.fog.color.setHex(dark?0x0e1216:0xe8edf3);
  groundM.color.setHex(dark?0x171b21:0xccd3dc);
  boardM.color.setHex(dark?0x232a33:0xdde3ea);
  frameM.color.setHex(dark?0x41546a:0x8fa0b3);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  refreshValTexts();buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    if(v>0.5)updateParticles(dt);
    qMeas=iced?qMeas+(0-qMeas)*Math.min(1,dt*0.9):qTrue();  // 冰堵：总压保持不住，读数衰减
  }
  /* U 管液面：ΔP 大→全压侧被压低、静压侧升高（液面差按 √ 压缩显示） */
  const h=1.15*Math.sqrt(Math.min(qMeas,40000)/40000);
  liqL.scale.y=Math.max(0.05,2.35-h/2-1.30);liqL.position.y=1.30+liqL.scale.y/2;
  liqR.scale.y=Math.max(0.05,2.35+h/2-1.30);liqR.position.y=1.30+liqR.scale.y/2;
  /* 来流箭头 + 驻点压强箭头 */
  if(v>1)setArrow(flowArr,V3(-6.2,0,0),V3(-6.2+0.4+0.009*v,0,0));else flowArr.visible=false;
  if(activeStep<=1&&!iced)setArrow(stagArr,V3(-2.35,0,0),V3(-1.92,0,0));else stagArr.visible=false;
  /* 高亮环脉冲 */
  const pu=0.45+0.35*Math.sin(simT*6),sc=1+0.15*Math.sin(simT*6);
  [ringNose,ringStat1,ringStat2,ringU].forEach(r=>{r.material.opacity=pu;r.scale.set(sc,sc,sc);});
  ringNose.visible=activeStep<=1&&!iced;
  ringStat1.visible=ringStat2.visible=activeStep===2;
  ringU.visible=activeStep===3||activeStep===4;
  iceGrp.visible=iced;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化：85 m/s 海平面来流 + 满标注，招牌画面即现 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
stagOn=document.getElementById('tglStag').checked;
statOn=document.getElementById('tglStatic').checked;
applyTheme();applyLang();
applyPhase(0);
updateStats();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
