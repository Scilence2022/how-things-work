<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>迈克耳孙干涉仪 · 用波长当尺子量位移</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#4dabf7;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1971c2;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="迈克耳孙干涉仪 · 用波长当尺子量位移" data-en="Michelson Interferometer · measuring with the wavelength as ruler">迈克耳孙干涉仪 · 用波长当尺子量位移</h1>
  <div class="sub" data-zh="一束光被分束器劈成两半：一半走向参考镜，一半走向待测镜，回来叠加。待测镜每移动 λ/2，两臂光程差变化 λ，干涉条纹明暗循环一次——数条纹就是数半波长，红光下每条纹对应 316 nm；引力波探测器把臂长做到 4 km，量出千分之一质子直径的颤动 · 拖动旋转 / 空格运行/暂停" data-en="A beam splitter cuts one beam in two: one half walks to a reference mirror, the other to the moving mirror; recombined, they interfere. Each λ/2 of mirror travel cycles the fringes once — counting fringes is counting half-wavelengths (316 nm per fringe in red light); LIGO scales the arms to 4 km to feel a wobble 1/1000 the width of a proton · drag to orbit / Space = run/pause">一束光被分束器劈成两半：一半走向参考镜，一半走向待测镜，回来叠加。待测镜每移动 λ/2，两臂光程差变化 λ，干涉条纹明暗循环一次——数条纹就是数半波长，红光下每条纹对应 316 nm；引力波探测器把臂长做到 4 km，量出千分之一质子直径的颤动 · 拖动旋转 / 空格运行/暂停</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="镜位移" data-en="Mirror travel">镜位移</span><span class="v" id="stPos">—</span>
  <span class="k" data-zh="光程差 ΔL" data-en="Path gap ΔL">光程差 ΔL</span><span class="v" id="stGap">—</span>
  <span class="k" data-zh="条纹计数" data-en="Fringe count">条纹计数</span><span class="v" id="stCnt">—</span>

      <label><input id="tglBeam" type="checkbox" checked> <span data-zh="光束路径" data-en="Beams">光束路径</span></label>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(4.6,6.9,13.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.0,0.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=80;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 页面场景 ---- */
/* 光学平台 */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const table=new THREE.Mesh(new THREE.BoxGeometry(14,0.4,8),groundM);
table.position.set(0,-0.2,0);scene.add(table);
const steelM=new THREE.MeshStandardMaterial({color:0x9aa7b4,roughness:0.35,metalness:0.85});
const darkM=new THREE.MeshStandardMaterial({color:0x2e3338,roughness:0.7});
function mount(x,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.18,0.5,12),darkM);m.position.set(x,0.25,z);scene.add(m);}
/* 激光器 */
const laserG=new THREE.Group();laserG.position.set(-5.6,0.75,0);scene.add(laserG);
const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,1.6,16),new THREE.MeshStandardMaterial({color:0xc92a2a,roughness:0.35,emissive:0x5c0e0e,emissiveIntensity:0.4}));
tube.rotation.z=Math.PI/2;laserG.add(tube);mount(-5.6,0);
/* 分束器（45° 半透明方片） */
const bsG=new THREE.Group();bsG.position.set(-2.6,0.75,0);bsG.rotation.y=Math.PI/4;scene.add(bsG);
const bsM=new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.35,roughness:0.05,metalness:0.4});
const bs=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.05),bsM);bsG.add(bs);mount(-2.6,0);
/* 参考镜（固定，左侧） */
const rmG=new THREE.Group();rmG.position.set(-5.4,0.75,0);scene.add(rmG);
const mirM=new THREE.MeshStandardMaterial({color:0xf1f3f5,roughness:0.05,metalness:1});
const rm=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.95,0.95),mirM);rmG.add(rm);mount(-5.4,0);
/* 待测镜（可移动，右/后方） */
const mmG=new THREE.Group();mmG.position.set(2.6,0.75,0);scene.add(mmG);
const mm=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.95,0.95),mirM);mmG.add(mm);
const mmRail=new THREE.Mesh(new THREE.BoxGeometry(6.4,0.1,0.16),steelM);mmRail.position.set(0,0.28,0);mmG.add(mmRail);
const mmCar=new THREE.Group();mmG.add(mmCar);
mmCar.add(mm);mm.position.set(0,0,0);
mount(2.6,0);
const mmCar2=new THREE.Group();scene.add(mmCar2);
/* 探测器 */
const detM=new THREE.MeshStandardMaterial({color:0x2b8a3e,emissive:0x0ca678,emissiveIntensity:0.6});
const det=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.3),detM);
det.position.set(-2.6,0.75,-3.2);scene.add(det);mount(-2.6,-3.2);
/* 光束（发光扁条 + 光子点） */
let beamR=0xff6b6b;
const beamM=new THREE.MeshBasicMaterial({color:beamR,transparent:true,opacity:0.55});
function beamBar(pts,w=0.05){
  const g=new THREE.Group();
  for(let i=0;i<pts.length-1;i++){
    const a=new THREE.Vector3(...pts[i]),b=new THREE.Vector3(...pts[i+1]);
    const len=a.distanceTo(b);
    const bar=new THREE.Mesh(new THREE.BoxGeometry(len,w,w),beamM);
    bar.position.copy(a).add(b).multiplyScalar(0.5);
    bar.lookAt(b);g.add(bar);
  }
  scene.add(g);return g;
}
let beams=null;
function buildBeams(){
  if(beams)for(const b of beams)scene.remove(b);
  beams=[];
  const y=0.75,bsX=-2.6;
  beams.push(beamBar([[-4.8,y,0],[bsX,y,0]]));                 // 激光→分束
  beams.push(beamBar([[bsX,y,0],[-5.0,y,0]]));                 // →参考镜
  const mx=mmCar.position? 2.6:2.6;
  beams.push(beamBar([[bsX,y,0],[2.6-mirPos,y,0]]));           // →待测镜
  beams.push(beamBar([[bsX,y,0],[bsX,y,-2.9]]));               // →探测器
}
/* 光子流 */
const NP=36;
const photM=new THREE.MeshBasicMaterial({color:0xff8787});
const photG=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,6,6),photM,NP);
scene.add(photG);
/* 条纹视窗（悬浮面板） */
/* 条纹盘：CanvasTexture 画同心圆环（牛顿环式），相位驱动环纹吞吐 */
const frCv=document.createElement('canvas');frCv.width=frCv.height=256;
const frCx=frCv.getContext('2d');
const frTex=new THREE.CanvasTexture(frCv);
function drawFringes(phase,contrast){
  const img=frCx.createImageData(256,256);
  for(let y=0;y<256;y++)for(let x=0;x<256;x++){
    const dx=x-128,dy=y-128,r=Math.sqrt(dx*dx+dy*dy)/116;
    let v=0.5+0.5*Math.cos(r*Math.PI*4-phase);      // 同心圆条纹
    v=v*contrast+ (1-contrast)*0.5;
    v=Math.floor(v*255);
    const i=(y*256+x)*4;
    img.data[i]=v;img.data[i+1]=v*0.94;img.data[i+2]=v*0.88;img.data[i+3]=255;
  }
  frCx.putImageData(img,0,0);
  frTex.needsUpdate=true;
}
const fringeM=new THREE.MeshBasicMaterial({map:frTex});
const fringes=new THREE.Mesh(new THREE.CircleGeometry(1.15,48),fringeM);
fringes.position.set(-5.3,3.5,-1.6);fringes.visible=false;scene.add(fringes);
const fringeFrame=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.05,10,40),steelM);
fringeFrame.position.copy(fringes.position);fringeFrame.visible=false;scene.add(fringeFrame);
/* 条纹盘挂更高更左，避开主光路视图 */
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('激光：相干单色光源','Laser: coherent monochrome source'),new THREE.Vector3(-6.2,2.75,0),'r');
addLabel(()=>L('分束器：一半透过，一半反射','Beam splitter: half through, half reflected'),new THREE.Vector3(-1.7,2.5,0),'b');
addLabel(()=>L('参考镜（固定）','Reference mirror (fixed)'),new THREE.Vector3(-4.6,1.35,0),'g');
addLabel(()=>L('待测镜：每走 λ/2 明暗循环一次','Moving mirror: one cycle per λ/2'),new THREE.Vector3(3.4,1.9,0),'o');
addLabel(()=>L('探测器：亮度 = 两臂的相位账','Detector: brightness = phase ledger'),new THREE.Vector3(-3.6,1.0,-3.4),'g');

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0;
let mirPos=0,lam=632.8,wob=0;
let cycles=0,prevSig=1;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
function setPos(p){mirPos=clamp(p,0,40);document.getElementById('sPos').value=mirPos;
  document.getElementById('sPosVal').textContent=mirPos.toFixed(2)+' μm';}
function setLam(l){lam=l;document.getElementById('sLam').value=l;
  document.getElementById('sLamVal').textContent=l.toFixed(0)+' nm';}
function setWob(w){wob=w;document.getElementById('sWob').value=w;
  document.getElementById('sWobVal').textContent=w.toFixed(0)+'%';}
function hexColor(nm){ // 简化波长→RGB
  if(nm<450)return 0x748ffc;if(nm<495)return 0x4dabf7;if(nm<570)return 0x51cf66;
  if(nm<590)return 0xffd43b;if(nm<620)return 0xff922b;return 0xff6b6b;
}
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'激光被分束器劈成两半，两臂互为参照',en:'The splitter cuts the beam in two; the arms mirror each other'},
 {zh:'一半去参考镜，一半去待测镜，再回来叠加',en:'One half walks to the reference mirror, one to the moving mirror; they recombine'},
 {zh:'待测镜移动 λ/2：光程差变化 λ，条纹明→暗→明循环一次',en:'Mirror moves λ/2: path gap changes by λ and the fringes cycle bright→dark→bright'},
 {zh:'数条纹 = 数半波长：红光下每条纹 316 nm',en:'Count fringes = count half-wavelengths: 316 nm per fringe in red'},
 {zh:'倾斜/振动扰动会让条纹糊掉——这是它灵敏的原因',en:'Tilt or vibration smears the fringes — that is why it is so sensitive'},
 {zh:'LIGO 把臂拉到 4 km：量出千分之一质子直径的引力波颤动',en:'LIGO stretches the arms to 4 km to feel a wobble 1/1000 of a proton'}
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
activeStep=i;
  if(i===0){setPos(0);setWob(0);}
  else if(i===1){setPos(0);}
  else if(i===2){setPos(3.2);setWob(0);}
  else if(i===3){setPos(9.5);setWob(0);}
  else if(i===4){setPos(4.0);setWob(7);}
  else {setPos(0.16);setWob(0);}
 syncSteps();
}

/* ---- 读数 ---- */
function updateStats(){
document.getElementById('stPos').innerHTML=mirPos.toFixed(2)+'<small> μm</small>';
  const gap=2*mirPos*1000;   // nm
  document.getElementById('stGap').innerHTML=(gap/1000).toFixed(3)+'<small> μm</small>';
  document.getElementById('stCnt').textContent=cycles;
  const sig=document.getElementById('stSig');
  sig.innerHTML=(lastSig*100).toFixed(0)+'<small> %</small>';
  sig.className='v'+(lastSig>0.8?' ok':(lastSig<0.2?' warn':''));
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  if(typeof groundM!=='undefined')groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
if(playing&&document.querySelector('#sPos:not(:active)')){
    setPos((mirPos+dt*1.6)%40);
  }
  /* 信号：cos²(2π ΔL/λ)，ΔL=2·位移；倾斜按强度打折 */
  const phase=2*Math.PI*(2*mirPos*1000)/lam;
  let sigV=Math.cos(phase)*0.5+0.5;
  sigV*=1-wob/100*(0.35+0.25*Math.sin(simT*5));
  if(prevSig>0.5&&sigV<=0.5&&playing&&wob<8)cycles++;
  prevSig=sigV;lastSig=sigV;
  /* 待测镜小车 */
  const railHalf=2.9;
  mmCar.position.x=-(mirPos/40)*railHalf*2+0;  // 向分束器方向
  mm.position.x=0;
  mmG.rotation.y=wob>0?Math.sin(simT*3)*wob*0.002:0;
  /* 光束颜色与亮度 */
  const c=hexColor(lam);
  beamM.color.setHex(c);photM.color.setHex(c);
  if(tglFringesEl.checked&&!drawFringes._t)drawFringes._t=0;
  if(tglFringesEl.checked){drawFringes._t+=dt;
    if(drawFringes._t>0.05){drawFringes._t=0;drawFringes(phase,wob>0?clamp(1-wob/45,0.25,1):1);}}
  /* 光子流动 */
  const m4=new THREE.Matrix4();
  const y=0.75,bsX=-2.6,mx=2.6-(mirPos/40)*railHalf*2;
  for(let i=0;i<NP;i++){
    const p=(simT*0.55+i/NP)%1;
    let px,pz;
    if(p<0.22){px=-4.8+p/0.22*(bsX+4.8);pz=0;}
    else if(p<0.44){px=bsX-(p-0.22)/0.22*2.4;pz=0;}
    else if(p<0.66){px=bsX+(p-0.44)/0.22*(mx-bsX);pz=0;}
    else{px=bsX;pz=-(p-0.66)/0.34*2.9;}
    m4.setPosition(px,y+0.02*Math.sin(i+simT*6),pz);
    photG.setMatrixAt(i,m4);
  }
  photG.instanceMatrix.needsUpdate=true;
  photG.visible=tglBeamEl.checked;
  fringeFrame.visible=fringes.visible=tglFringesEl.checked;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const tglBeamEl=document.getElementById('tglBeam');
const tglFringesEl=document.getElementById('tglFringes');
let lastSig=1;
document.getElementById('sPos').addEventListener('input',e=>setPos(+e.target.value));
document.getElementById('sLam').addEventListener('input',e=>setLam(+e.target.value));
document.getElementById('sWob').addEventListener('input',e=>setWob(+e.target.value));
document.getElementById('tglBeam').addEventListener('change',()=>{});
document.getElementById('tglFringes').addEventListener('change',()=>{});
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setPos(0);setLam(632.8);setWob(0);
cycles=0;lastSig=1;
syncSteps();updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
