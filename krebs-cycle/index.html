<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三羧酸循环 · 转一圈回原点</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.e { border-color: rgba(99,230,190,.9); color: #c3f5e5; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.a { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.co { color: #ffc2c2; border-color: rgba(255,143,163,.7); }
  .chip.n { color: #d0bfff; border-color: rgba(177,151,252,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="三羧酸循环:转一圈,回原点" data-en="The Krebs Cycle: one lap, back to start">三羧酸循环:转一圈,回原点</h1>
  <div class="sub" data-zh="4C 草酰乙酸接上 2C 乙酰基转一圈:2 个碳以 CO₂ 呼出,收 3 NADH + 1 FADH₂ + 1 GTP——ETC 的燃料精炼厂 · 空格播放/暂停" data-en="4C oxaloacetate picks up a 2C acetyl and goes one lap: two carbons leave as CO₂, pocketing 3 NADH + 1 FADH₂ + 1 GTP — the refinery feeding the ETC · Space = play/pause">4C 草酰乙酸接上 2C 乙酰基转一圈:2 个碳以 CO₂ 呼出,收 3 NADH + 1 FADH₂ + 1 GTP——ETC 的燃料精炼厂 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="已转圈数" data-en="laps">已转圈数</span><span class="v g" id="stLap">0</span>
  <span class="k" data-zh="NADH / FADH₂ / GTP" data-en="NADH / FADH₂ / GTP">NADH / FADH₂ / GTP</span><span class="v" id="stOut" style="font-size:14px">0/0/0</span>
  <span class="k" data-zh="呼出 CO₂" data-en="CO₂ out">呼出 CO₂</span><span class="v" id="stCO2">0</span>
  <span class="k" data-zh="载子单价" data-en="ATP equivalent">载子单价</span><span class="v" id="stEq">≈10<small> ATP/圈</small></span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.a" data-zh="乙酰基 2C(橙色,进料)" data-en="acetyl 2C (orange, feed)">乙酰基 2C(橙色,进料)</span>
    <span class="chip.co" data-zh="CO₂(离场的碳)" data-en="CO₂ (carbons leaving)">CO₂(离场的碳)</span>
    <span class="chip.n" data-zh="NADH / FADH₂(载子)" data-en="NADH / FADH₂ (carriers)">NADH / FADH₂(载子)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnFeed" data-zh="送入一个乙酰-CoA" data-en="feed one acetyl-CoA">送入一个乙酰-CoA</button>
  </div>
  <div class="row"><label data-zh="循环进度" data-en="cycle phase">循环进度</label><input id="scrub" type="range" min="0" max="1000" step="5" value="0"><span class="val" id="scrubVal">0%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../glycolysis/" data-zh="上游:糖酵解" data-en="upstream: glycolysis">上游:糖酵解</a>
    <a href="../electron-transport-chain/" data-zh="下游:电子传递链" data-en="downstream: the ETC">下游:电子传递链</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('三羧酸循环', 'The Krebs Cycle');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.2, 4.6, 5.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const M = {
  ring: mat(0x1e2a38, { opacity: 0.55 }),
  station: mat(0x63e6be, { opacity: 0.5 }),
  Cacetyl: mat(0xffa94d, { emissiveIntensity: 0.4 }),
  Ccycle: mat(0xffd166),
  CO2: mat(0xff8fa3, { emissiveIntensity: 0.35 }),
  NADH: mat(0xd0bfff, { emissiveIntensity: 0.45 }),
  FADH2: mat(0x74c0fc, { emissiveIntensity: 0.4 }),
  GTP: mat(0x63e6be, { emissiveIntensity: 0.45 }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.4, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.35;
scene.add(base);

/* ================= 循环环(8 站) ================= */
const R = 1.9;
const cyc = new THREE.Group();
cyc.position.y = 0.8;
scene.add(cyc);
const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(R, 0.07, 10, 72), M.ring);
ringMesh.rotation.x = Math.PI / 2;
cyc.add(ringMesh);
/* 站位:0 草酰乙酸(OAA,起点) 1 柠檬酸 2 异柠檬酸 3 α-KG 4 琥珀酰-CoA 5 琥珀酸 6 延胡索酸 7 苹果酸 */
const STN = [
  { zh: '草酰乙酸 4C', en: 'oxaloacetate 4C' },
  { zh: '柠檬酸 6C', en: 'citrate 6C' },
  { zh: '异柠檬酸 6C', en: 'isocitrate 6C' },
  { zh: 'α-酮戊二酸 5C', en: 'α-KG 5C' },
  { zh: '琥珀酰-CoA 4C', en: 'succinyl-CoA 4C' },
  { zh: '琥珀酸 4C', en: 'succinate 4C' },
  { zh: '延胡索酸 4C', en: 'fumarate 4C' },
  { zh: '苹果酸 4C', en: 'malate 4C' },
];
const stations = STN.map((st, i) => {
  const a = -i / 8 * Math.PI * 2 + Math.PI / 2;
  const pos = new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R);
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.26, 18, 14), M.station);
  m.position.copy(pos);
  cyc.add(m);
  const div = document.createElement('div');
  div.className = 'lbl e';
  div.textContent = st.zh;
  const lb = new CSS2DObject(div);
  lb.position.set(0, 0.45, 0);
  m.add(lb);
  return { pos, mesh: m, div };
});

/* 中央载体球(循环中的分子代表) */
const carrier = new THREE.Group();
cyc.add(carrier);
const carrierBalls = [];
for (let i = 0; i < 6; i++) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 10), M.Ccycle);
  carrier.add(b);
  carrierBalls.push(b);
}

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let phase = qsFloat('p', 0);         // 0..1 一圈进度
let laps = 0;
let out = { NADH: 0, FADH2: 0, GTP: 0, CO2: 0 };
let tSim = 0;

/* 飞行 token */
const flyers = [];   // {mesh, from, to, t, color}
function fly(color, from, to) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 10),
    new THREE.MeshBasicMaterial({ color, blending: THREE.AdditiveBlending, transparent: true }));
  m.position.copy(from);
  cyc.add(m);
  flyers.push({ mesh: m, from: from.clone(), to: to.clone(), t: 0 });
}
/* CO₂ 气泡 */
const co2 = [];      // {mesh, v}
function puffCO2(pos) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), M.CO2);
  m.position.copy(pos);
  cyc.add(m);
  co2.push({ mesh: m, v: new THREE.Vector3((Math.random() - 0.5) * 0.2, 0.9 + Math.random() * 0.4, (Math.random() - 0.5) * 0.2) });
}

/* 每段事件:[from阶段,to阶段, 类型] */
const EVENTS = [
  { at: 0.0, kind: 'feed' },                 // 乙酰接入
  { at: 0.125, kind: 'NADH' },               // 异柠檬酸→αKG
  { at: 0.22, kind: 'CO2' },                 // 第一个 CO2
  { at: 0.25, kind: 'NADH' }, { at: 0.3, kind: 'CO2' },   // αKG→琥珀酰
  { at: 0.4, kind: 'GTP' },                  // 琥珀酰→琥珀酸
  { at: 0.5, kind: 'FADH2' },                // 琥珀酸→延胡索酸
  { at: 0.75, kind: 'NADH' },                // 苹果酸→OAA
];
let firedSet = new Set();

function phaseLabel() {
  if (phase < 0.06) return L('乙酰-CoA 靠站:2C 乙酰基递给 4C 草酰乙酸 → 6C 柠檬酸', 'acetyl-CoA docks: the 2C acetyl hands to 4C oxaloacetate → 6C citrate');
  if (phase < 0.35) return L('两次氧化脱羧:2 个碳以 CO₂ 离场,2 NADH 到手——6C 降回 4C', 'two oxidative decarboxylations: two carbons leave as CO₂ with 2 NADH — 6C back to 4C');
  if (phase < 0.6) return L('底物水平磷酸化:GTP 直接落袋;FADH₂ 从琥珀酸收税', 'substrate-level phosphorylation: GTP lands; FADH₂ levied from succinate');
  if (phase < 0.95) return L('重生:延胡索酸→苹果酸→草酰乙酸,再收一枚 NADH——回到原点', 'regeneration: fumarate → malate → oxaloacetate, one more NADH — back to start');
  return L('一圈完成:3 NADH + 1 FADH₂ + 1 GTP + 2 CO₂——草酰乙酸原地满血', 'lap done: 3 NADH + 1 FADH₂ + 1 GTP + 2 CO₂ — oxaloacetate fully restored');
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblStatus = addLabel(phaseLabel, new THREE.Vector3(0, 2.9, 0), 'st');
const lblAccount = addLabel(() => L(`本圈账本:NADH ${out.NADH}/3 · FADH₂ ${out.FADH2}/1 · GTP ${out.GTP}/1 · CO₂ ${out.CO2}/2`,
  `this lap: NADH ${out.NADH}/3 · FADH₂ ${out.FADH2}/1 · GTP ${out.GTP}/1 · CO₂ ${out.CO2}/2`),
  new THREE.Vector3(0, -0.85, 0), 'g', cyc);

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '接料:4C 等在门口', be: 'Docking: 4C waits at the gate',
    d: '草酰乙酸(4C)是循环的「接收器」:乙酰-CoA 的 2C 一接入,变成 6C 柠檬酸——循环有名字叫「三羧酸」,因为柠檬酸带三个羧基。',
    de: 'Oxaloacetate (4C) is the receptor: the 2C acetyl joins to make 6C citrate. It is called the tricarboxylic acid cycle because citrate carries three carboxyls.',
    act: () => { phase = 0.03; apply(true); } },
  { b: '两次脱羧:碳离场', be: 'Two decarboxylations: carbons leave',
    d: '异柠檬酸和 α-KG 先后氧化脱羧:两个 CO₂ 呼出(呼吸的碳从这里来!),两枚 NADH 装满电子——6C 又降回 4C。',
    de: 'Isocitrate and α-KG oxidatively decarboxylate in turn: two CO₂ out (exhale carbon starts here!) and two NADH loaded — 6C back to 4C.',
    act: () => { phase = 0.32; apply(true); } },
  { b: 'GTP:直接落袋', be: 'GTP: cash on the spot',
    d: '琥珀酰-CoA 的高能硫酯键直接磷酸化出 1 GTP——循环里唯一不靠载子的现钱。',
    de: 'The high-energy thioester of succinyl-CoA phosphorylates GDP straight to GTP — the cycle\'s only cash payment without a carrier.',
    act: () => { phase = 0.45; apply(true); } },
  { b: '载子三连', be: 'The carrier harvest',
    d: '3 NADH + 1 FADH₂ 是本循环真正的产出:它们去电子传递链兑换 ~10 ATP——循环本身像精炼厂,炼出高能载子。',
    de: '3 NADH + 1 FADH₂ are the real output, redeemed for ~10 ATP at the ETC — the cycle is a refinery turning fuel into carriers.',
    act: () => { phase = 0.8; apply(true); } },
  { b: '回原点:催化剂再生', be: 'Back to start: catalyst restored',
    d: '延胡索酸→苹果酸→草酰乙酸:接收器满血复位,等下一个乙酰。循环不消耗草酰乙酸——它是催化剂,乙酰的碳才是燃料。',
    de: 'Fumarate → malate → oxaloacetate: the receptor is restored for the next acetyl. The cycle never consumes OAA — it is a catalyst; acetyl carbons are the fuel.',
    act: () => { phase = 0.99; apply(true); } },
];
function stepIndex() {
  if (phase < 0.06) return 0;
  if (phase < 0.35) return 1;
  if (phase < 0.5) return 2;
  if (phase < 0.95) return 3;
  return 4;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 场景应用 ================= */
function ringPos(f) {
  const a = -f * Math.PI * 2 + Math.PI / 2;
  return new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R);
}
function apply(reset) {
  if (reset) firedSet = new Set();
  /* 载子球数量随碳数(4-6) */
  const nC = phase < 0.06 ? 4 : phase < 0.28 ? 6 : phase < 0.38 ? 5 : 4;
  carrierBalls.forEach((b, i) => {
    b.visible = i < nC;
    b.material = i < 2 && phase < 0.35 ? M.Cacetyl : M.Ccycle;
    const a = i / Math.max(nC, 1) * Math.PI * 2;
    b.position.set(Math.cos(a) * 0.26, 0.2, Math.sin(a) * 0.26);
  });
  /* 事件触发 */
  for (const ev of EVENTS) {
    if (phase >= ev.at && !firedSet.has(ev.at)) {
      firedSet.add(ev.at);
      const p = carrier.position.clone();
      if (ev.kind === 'feed') {
        /* 乙酰 2 球飞入 */
        fly(0xffa94d, new THREE.Vector3(0, 0.6, -2.8), p);
      } else if (ev.kind === 'CO2') {
        puffCO2(p);
        out.CO2++;
      } else if (ev.kind === 'NADH') {
        fly(0xd0bfff, p, new THREE.Vector3(0, 1.9, 0));
        out.NADH++;
      } else if (ev.kind === 'FADH2') {
        fly(0x74c0fc, p, new THREE.Vector3(0, 1.9, 0));
        out.FADH2++;
      } else if (ev.kind === 'GTP') {
        fly(0x63e6be, p, new THREE.Vector3(0, 1.9, 0));
        out.GTP++;
      }
    }
  }
  /* 高亮当前站位 */
  const stIdx = Math.min(7, Math.floor(phase * 8));
  stations.forEach((s, i) => {
    s.mesh.scale.setScalar(i === stIdx ? 1.35 : 1);
    s.div.textContent = LANG === 'en' ? STN[i].en : STN[i].zh;
    s.div.style.opacity = i === stIdx ? '1' : '0.55';
  });
  /* 统计 */
  document.getElementById('stLap').textContent = laps;
  document.getElementById('stOut').textContent = `${out.NADH}/${out.FADH2}/${out.GTP}`;
  document.getElementById('stCO2').textContent = out.CO2;
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elScrub.addEventListener('input', () => {
  playing = false;
  setPlayLabel();
  phase = parseInt(elScrub.value, 10) / 1000;
  elScrubVal.textContent = Math.round(phase * 100) + '%';
  apply(true);
});
document.getElementById('btnFeed').addEventListener('click', () => {
  phase = 0;
  out = { NADH: 0, FADH2: 0, GTP: 0, CO2: 0 };
  elScrub.value = 0;
  playing = true;
  setPlayLabel();
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let prevBucket = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  if (playing) {
    const pb = Math.floor(phase * 1000);
    phase = clamp(phase + dts * 0.045, 0, 1);
    elScrub.value = Math.round(phase * 1000);
    elScrubVal.textContent = Math.round(phase * 100) + '%';
    if (phase >= 1) { phase = 0; laps++; out = { NADH: 0, FADH2: 0, GTP: 0, CO2: 0 }; elScrub.value = 0; }
    else if (Math.floor(phase * 1000) !== pb) apply(false);
  }
  /* 载体沿环走 */
  carrier.position.copy(ringPos(phase));
  carrier.rotation.y = -phase * Math.PI * 2;
  /* CO₂ 上飘 */
  for (let i = co2.length - 1; i >= 0; i--) {
    const c = co2[i];
    c.mesh.position.addScaledVector(c.v, dts);
    c.mesh.material.opacity = Math.max(0, 1 - c.mesh.position.y / 2.6);
    if (c.mesh.position.y > 2.6) { cyc.remove(c.mesh); co2.splice(i, 1); }
  }
  /* flyer 飞行 */
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    f.t += dts * 1.3;
    f.mesh.position.lerpVectors(f.from, f.to, ss(0, 1, f.t));
    f.mesh.position.y += Math.sin(f.t * Math.PI) * 0.35;
    if (f.t >= 1) { cyc.remove(f.mesh); flyers.splice(i, 1); }
  }

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

apply(true);
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
