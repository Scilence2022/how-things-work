<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E2 消除反应 · 反式共平面 3D 动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#9a6fd0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#7448b8;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--cv-text); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.b     { border-color: rgba(76,201,240,.9);  color: #bde9ff; }
  .lbl.x     { border-color: rgba(255,159,28,.9);  color: #ffd9a3; }
  .lbl.r     { border-color: rgba(255,255,255,.3); }
  .lbl.ts    { border-color: rgba(255,93,93,.9);   color: #ffc2c2; font-size: 12.5px; }
  .lbl.plane { border-color: rgba(76,201,240,.55); color: #9adcf2; font-size: 11.5px; }
  .lbl.prod  { border-color: rgba(144,190,109,.9); color: #d8f3c0; font-size: 13px; padding: 6px 11px; }
  .lbl.pi    { border-color: rgba(199,125,255,.8); color: #ecd5ff; font-size: 11.5px; }
  :root[data-theme="light"] .lbl.b     { border-color: rgba(12,123,166,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.x     { border-color: rgba(156,95,0,.9);   color: #9c5f00; }
  :root[data-theme="light"] .lbl.r     { border-color: rgba(15,25,40,.35); }
  :root[data-theme="light"] .lbl.ts    { border-color: rgba(200,60,60,.9);  color: #b83232; }
  :root[data-theme="light"] .lbl.plane { border-color: rgba(12,123,166,.55); color: #17708f; }
  :root[data-theme="light"] .lbl.prod  { border-color: rgba(90,140,50,.9);  color: #3f6d1c; }
  :root[data-theme="light"] .lbl.pi    { border-color: rgba(130,60,190,.8); color: #7a2fb0; }

  /* ===== 工具条（全站共享模式） ===== */
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.b   { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  .chip.x   { color: #ffd9a3; border-color: rgba(255,159,28,.7); }
  .chip.p   { color: #d8f3c0; border-color: rgba(144,190,109,.7); }
  .chip.dim { color: #b9c4d0; border-color: rgba(255,255,255,.22); }
  :root[data-theme="light"] .chip.b   { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.x   { color: #9c5f00; border-color: rgba(156,95,0,.7); }
  :root[data-theme="light"] .chip.p   { color: #47701f; border-color: rgba(71,112,31,.7); }
  :root[data-theme="light"] .chip.dim { color: var(--text2); border-color: rgba(15,25,40,.25); }

  /* 碱切换 */
  #baseRow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #baseRow .brl { font-size: 12px; color: var(--text2); flex: 0 0 auto; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(154,111,208,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(116,72,184,.10); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(154,111,208,.10); border-color: rgba(154,111,208,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(116,72,184,.10); border-color: rgba(116,72,184,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ddc8ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }

  #exploreRow { display: none; align-items: center; gap: 8px; margin-top: 8px;
    padding: 7px 9px; border: 1px dashed var(--tool-border); border-radius: 9px; }
  #exploreRow.show { display: flex; }
  #exploreRow label { font-size: 12px; color: var(--text2); flex: 0 0 auto; }
  #phiVal { font-size: 11.5px; color: var(--text3); flex: 0 0 44px; text-align: right; }
  #phiStatus { font-size: 11.5px; flex: 0 0 auto; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  #phiStatus.ok { color: #d8f3c0; border-color: rgba(144,190,109,.8); }
  #phiStatus.no { color: #ffc2c2; border-color: rgba(255,93,93,.7); }
  :root[data-theme="light"] #phiStatus.ok { color: #3f6d1c; }
  :root[data-theme="light"] #phiStatus.no { color: #b83232; }

  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }

  /* 能量曲线（右下 2D 覆盖层） */
  #energy { position: fixed; right: 20px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 8px 10px 4px;
    backdrop-filter: blur(6px); }
  #energy text { font-family: inherit; }
  /* 纽曼投影（右上 2D 覆盖层） */
  #newman { position: fixed; right: 20px; top: 60px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 8px 10px 6px;
    backdrop-filter: blur(6px); }
  #newman text { font-family: inherit; }
  @media (max-width: 1060px) { #newman { display: none; } }
  @media (max-width: 900px) { #energy { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; overflow: auto; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="E2 消除反应为什么要「反式共平面」？—— 协同消除" data-en="Why does E2 require anti-periplanar geometry? — Concerted elimination">E2 消除反应为什么要「反式共平面」？—— 协同消除</h1>
  <div class="sub" data-zh="3D 交互演示 · 碱摘 β-H、π 键生成、Br⁻ 离去一拍完成 · 转动 C–C 键找 anti 构象" data-en="Interactive 3D demo · base grabs β-H, π bond forms and Br⁻ leaves in one stroke · rotate the C–C bond to find the anti conformer">3D 交互演示 · 碱摘 β-H、π 键生成、Br⁻ 离去一拍完成 · 转动 C–C 键找 anti 构象</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip b" data-zh="B:⁻ 碱（摘 β-H）" data-en="B:⁻ base (takes β-H)">B:⁻ 碱（摘 β-H）</span>
    <span class="chip x" data-zh="Br 离去基团" data-en="Br leaving group">Br 离去基团</span>
    <span class="chip p" data-zh="烯烃 + 新 π 键" data-en="Alkene + new π bond">烯烃 + 新 π 键</span>
    <span class="chip dim" data-zh="一步协同 · 无中间体" data-en="One concerted step · no intermediate">一步协同 · 无中间体</span>
  </div>
  <div id="baseRow">
    <span class="brl" data-zh="碱 B⁻：" data-en="Base B⁻:">碱 B⁻：</span>
    <button id="btnEt" class="bon on"><b>EtO⁻</b><i data-zh="小碱 → Zaitsev 产物" data-en="small → Zaitsev">小碱 → Zaitsev 产物</i></button>
    <button id="btnTbu" class="bon"><b>t-BuO⁻</b><i data-zh="大位阻 → Hofmann 产物" data-en="bulky → Hofmann">大位阻 → Hofmann 产物</i></button>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="exploreRow">
    <label data-zh="旋转 C–C" data-en="Rotate C–C">旋转 C–C</label>
    <input id="phi" type="range" min="-180" max="180" step="1" value="180">
    <span id="phiVal">0°</span><span id="phiStatus" class="no">未反式 ✗</span>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglArrows" type="checkbox" checked> <span data-zh="电子流向箭头" data-en="Electron-flow arrows">电子流向箭头</span></label>
    <label><input id="tglNewman" type="checkbox" checked> <span data-zh="纽曼投影" data-en="Newman view">纽曼投影</span></label>
    <label><input id="tglEnergy" type="checkbox" checked> <span data-zh="能量曲线" data-en="Energy curve">能量曲线</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    <label><input id="tglExplore" type="checkbox"> <span data-zh="构象探索" data-en="Explore conformers">构象探索</span></label>
  </div>
</div>

<div id="newman">
  <svg id="newmanSvg" width="168" height="196" viewBox="0 0 168 196"></svg>
</div>

<div id="energy">
  <svg id="energySvg" width="292" height="182" viewBox="0 0 292 182"></svg>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数（调试/截图用） ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  if (scene.background) scene.background.set(PAL.bg); else scene.background = new THREE.Color(PAL.bg);
  M.bondC.color.set(THEME === 'light' ? 0x84909e : 0xcfd4dc);
  M.bondC.emissive.set(THEME === 'light' ? 0x84909e : 0xcfd4dc);
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  buildNewman(); buildEnergy();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('E2 消除反应 · 反式共平面 3D 动画', 'E2 Elimination · Anti-periplanar 3D Animation');
  buildSteps(); buildEnergy(); buildNewman();
  refreshStaticLabels(); setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 常量：时序与几何 ---------------- */
const CYCLE_SECONDS = 10.0;
const T_BASE  = [0.02, 0.14];   // 碱从远处逼近
const PIVOT_T = 0.16;           // t-BuO⁻ 枢转：换到外侧 Cα–C1 轴
const T_ROT   = [0.16, 0.34];   // C–C 旋转找 anti 构象
const T_TS    = [0.34, 0.56];   // 协同过渡态
const T_BREAK = [0.56, 0.76];   // 断键成键

const D2R = Math.PI / 180;
const S109 = 0.9428, C109 = -1 / 3;    // sp³：与键轴夹角 109.47°
const S120 = 0.8660, C120 = -0.5;      // sp²：120°
const L_CH = 1.0, L_CC = 1.5, L_OH = 0.98;

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const dirFront = a => V3(S109 * Math.cos(a), S109 * Math.sin(a), C109);   // 前碳取代基方向（−z 侧）
const dirBack  = a => V3(S109 * Math.cos(a), S109 * Math.sin(a), -C109);  // 后碳取代基方向（+z 侧）
const mixDir = (a, b, k) => a.clone().lerp(b, k).normalize();

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.3, 2.5, -3.1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.15, 0.8);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.6;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 6, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.55);
fill.position.set(-5, 2, -4);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.05,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const fadeMats = [];
function fade(m, baseOp = 1) { m.transparent = true; m.userData.baseOp = baseOp; fadeMats.push(m); return m; }

const M = {
  C:   fade(mat(0x5b6270, { roughness: 0.35, metalness: 0.3 })),
  H:   fade(mat(0xe8edf4, { roughness: 0.5 })),
  Br:  fade(mat(0xff9f1c, { emissiveIntensity: 0.3 })),
  O:   fade(mat(0x3fb6e8, { emissiveIntensity: 0.35 })),
  haloO:  fade(new THREE.MeshBasicMaterial({ color: 0x3fb6e8, transparent: true, opacity: 0.14, depthWrite: false }), 0.14),

// 绕「母原子 M、邻居 GP」的 sp³ 锥面上放 n 个原子（甲基氢 / 叔丁基三叉）
function conePos(Mp, GP, len, n, i, psi0 = 30) {
  const u = V3().subVectors(GP, Mp).normalize();
  const ref = Math.abs(u.y) < 0.9 ? V3(0, 1, 0) : V3(1, 0, 0);
  const e1 = V3().crossVectors(u, ref).normalize();
  const e2 = V3().crossVectors(u, e1);
  const psi = (psi0 + i * 120) * D2R;
  return Mp.clone().addScaledVector(u, C109 * len)
    .addScaledVector(e1, S109 * len * Math.cos(psi))
    .addScaledVector(e2, S109 * len * Math.sin(psi));
}
function buildBase(kind) {
  B.kind = kind;
  for (let i = baseG.children.length - 1; i >= 0; i--) {   // 只清网格，保留挂在其上的 CSS2D 标签
    if (baseG.children[i].isCSS2DObject) continue;
    baseG.remove(baseG.children[i]);
  }
  B.O = addSphere(baseG, 0.30, M.O);
  B.halo = addSphere(baseG, 0.52, M.haloO);
  const O0 = V3(0, 0, 0);
  const sticks = [];
  const link = (a, b) => {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 12), M.bondO);
    baseG.add(s); sticks.push([s, a, b]); return s;
  };
  if (kind === 'et') {   // EtO⁻：O–CH₂–CH₃
    const Cb1 = V3(-1.32, 0.3, 0.1);
    const Cb2 = Cb1.clone().add(V3(-1.1, -0.55, -0.5));
    const c1 = addSphere(baseG, 0.30, M.C), c2 = addSphere(baseG, 0.30, M.C);
    c1.position.copy(Cb1); c2.position.copy(Cb2);
    link(B.O.position, Cb1); link(Cb1, Cb2);
    for (let i = 0; i < 2; i++) {
      const h = addSphere(baseG, 0.18, M.H);
      h.position.copy(conePos(Cb1, O0, L_CH, 2, i, 40));
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1, 10), M.bondO);
      baseG.add(s); sticks.push([s, Cb1, h.position]);
    }
    for (let i = 0; i < 3; i++) {
      const h = addSphere(baseG, 0.18, M.H);
      h.position.copy(conePos(Cb2, Cb1, L_CH, 3, i, 10));
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1, 10), M.bondO);
      baseG.add(s); sticks.push([s, Cb2, h.position]);
    }
  } else {               // t-BuO⁻：O–C(CH₃)₃
    const Ct = V3(-1.35, 0.25, 0.1);
    const ct = addSphere(baseG, 0.30, M.C);
    ct.position.copy(Ct);
    link(B.O.position, Ct);
    const u = V3().subVectors(O0, Ct).normalize();
    const ref = V3(0, 1, 0);
    const e1 = V3().crossVectors(u, ref).normalize();
    const e2 = V3().crossVectors(u, e1);
    for (let k = 0; k < 3; k++) {
      const psi = (30 + k * 120) * D2R;
      const Cm = Ct.clone().addScaledVector(u, C109 * 1.5)
        .addScaledVector(e1, S109 * 1.5 * Math.cos(psi))
        .addScaledVector(e2, S109 * 1.5 * Math.sin(psi));
      const cm = addSphere(baseG, 0.28, M.C);
      cm.position.copy(Cm);
      link(Ct, Cm);
      for (let i = 0; i < 3; i++) {
        const h = addSphere(baseG, 0.17, M.H);
        h.position.copy(conePos(Cm, Ct, L_CH, 3, i, 55));
        const s = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1, 10), M.bondO);
        baseG.add(s); sticks.push([s, Cm, h.position]);
      }
    }
  }
  for (const [s, a, b] of sticks) placeStick(s, a, b);
}
buildBase('et');

/* ---------------- 构象探索状态 ---------------- */
let exploring = false, explorePhi = 180 * D2R, wasPlaying = false;

/* ---------------- 时序标量函数（全部为 tt 的纯函数，可任意拖相位） ---------------- */
const dBrOf = tt => tt < 0.34 ? 1.55
  : tt < 0.50 ? lerp(1.55, 1.95, ss(0.34, 0.50, tt))
  : tt < 0.56 ? 1.95
  : tt < 0.74 ? lerp(1.95, 4.4, ss(0.56, 0.74, tt))
  : lerp(4.4, 5.8, ss(0.74, 0.90, tt));
const LccOf = tt => tt < 0.34 ? 1.5
  : tt < 0.50 ? lerp(1.5, 1.42, ss(0.34, 0.50, tt))
  : lerp(1.42, 1.34, ss(0.50, 0.72, tt));
function dHovOf(tt) {
  const tBu = B.kind === 'tbu';
  const hold = tBu ? 3.2 : 2.3;                      // 大碱够不着，悬停更远
  const tIn = tBu ? 0.10 : 0.14;
  if (tt < T_BASE[0]) return 4.8;
  if (tt < tIn) return lerp(4.8, hold, ss(T_BASE[0], tIn, tt));
  if (tt < 0.34) return hold;
  if (tt < 0.50) return lerp(hold, 1.4, ss(0.34, 0.50, tt));
  if (tt < 0.60) return 1.4;
  return lerp(1.4, 3.4, ss(0.60, 0.86, tt));
}
const phiOf = tt => tt < T_ROT[0] ? 180 * D2R
  : tt < T_ROT[1] ? lerp(180 * D2R, 0, ss(...T_ROT, tt))
  : 0;
const opOf = tt => ss(-0.045, 0, tt) * (1 - ss(0.88, 0.945, tt));

/* ---------------- 每帧更新 ---------------- */
function updateWorld(tt) {
  const R = ROLES[curPath];
  let op = opOf(tt);
  if (B.kind === 'tbu') op *= 1 - 0.9 * (ss(0.146, 0.158, tt) * (1 - ss(0.162, 0.174, tt)));  // 枢转遮罩
  for (const m of fadeMats) m.opacity = m.userData.baseOp * op;

  const phi = exploring ? explorePhi : phiOf(tt);
  const phiDeg = phi / D2R;
  const kF = ss(0.58, 0.74, tt);   // sp³ → sp² 平面化
  const kT = ss(0.56, 0.68, tt);   // H 向碱转移

  /* --- 原子位置 --- */
  const P = {};
  P.Ca = V3(0, 0, 0);
  P.Br = dirFront(90 * D2R).clone().multiplyScalar(dBrOf(tt));
  P.Ha = mixDir(dirFront(210 * D2R), V3(S120, 0, C120), kF).multiplyScalar(L_CH);
  P[R.third] = mixDir(dirFront(330 * D2R), V3(-S120, 0, C120), kF).multiplyScalar(L_CC);
  const backPos = V3(0, 0, LccOf(tt));
  P[R.back] = backPos;
  P[R.s2] = backPos.clone().add(mixDir(dirBack(30 * D2R + phi), V3(-S120, 0, -C120), kF).multiplyScalar(L_CH));
  P[R.s3] = backPos.clone().add(mixDir(dirBack(150 * D2R + phi), V3(S120, 0, -C120), kF).multiplyScalar(R.s3 === 'C4' ? L_CC : L_CH));
  // β-H：TS 轻微拉伸，随后向碱转移
  const stretch = 1 + 0.22 * ss(0.36, 0.50, tt);
  const Hslot = backPos.clone().add(dirBack(270 * D2R + phi).multiplyScalar(stretch));
  const hoverDir = V3().subVectors(Hslot, backPos).normalize();
  const O = Hslot.clone().addScaledVector(hoverDir, dHovOf(tt));
  const Hpos = Hslot.clone().lerp(O.clone().addScaledVector(hoverDir, -L_OH), kT);
  P[R.tgt] = Hpos;
  // 甲基/亚甲基上的氢随母原子刚体跟随
  if (curPath === 'H') P.C4 = conePos(P.C3, P.Ca, L_CC, 1, 0, 60);   // 乙基末端甲基（Hofmann 路径非槽位原子）
  for (const [pn, gn, kids] of R.leaves)
    kids.forEach((kid, i) => { P[kid] = conePos(P[pn], P[gn], L_CH, 3, i, 40); });

  for (const k in A) if (P[k]) A[k].position.copy(P[k]);
  baseG.position.copy(O);
  if (B.kind === 'tbu' && tt > 0.10 && tt < 0.155) baseG.position.x += 0.035 * Math.sin(tt * 700);  // 挤不进去的晃动

  /* --- 键 --- */
  for (const [key, an, bn] of STICKDEFS) {
    if (!S[key].visible) continue;
    const pa = an === 'back' ? P[R.back] : an === 's2' ? P[R.s2] : an === 's3' ? P[R.s3] : P[an];
    const pb = bn === 'back' ? P[R.back] : bn === 's2' ? P[R.s2] : bn === 's3' ? P[R.s3] : P[bn];
    placeStick(S[key], pa, pb);
  }
  const dCH = V3().subVectors(Hpos, P[R.back]).length();
  const chOp = 1 - ss(1.25, 1.7, dCH);
  M.bondCH.opacity = M.bondCH.userData.baseOp * op * chOp;
  S.bT.visible = chOp > 0.02 && dCH < 2.0;
  if (S.bT.visible) placeStick(S.bT, P[R.back], Hpos);
  const dBr = dBrOf(tt);
  const brOp = 1 - ss(2.3, 2.9, dBr);
  M.bondCBr.opacity = M.bondCBr.userData.baseOp * op * brOp;
  S.CaBr.visible = brOp > 0.02 && dBr < 3.2;
  if (S.CaBr.visible) placeStick(S.CaBr, P.Ca, P.Br);
  const opOH = ss(0.58, 0.66, tt);
  M.bondOH.opacity = M.bondOH.userData.baseOp * op * opOH;
  stickOH.visible = opOH > 0.02;
  if (stickOH.visible) placeStick(stickOH, O, Hpos);

  /* --- 部分键点串（过渡态窗口） --- */
  const pBH = ss(0.36, 0.42, tt) * (1 - ss(0.56, 0.64, tt)) * op;
  const pCH = ss(0.38, 0.46, tt) * (1 - ss(0.60, 0.68, tt)) * op;
  const pCBr = ss(0.38, 0.46, tt) * (1 - ss(0.58, 0.66, tt)) * op;
  M.dot.opacity = 0.9 * Math.max(pBH, pCH, pCBr, 0.0001 * op);
  placeDots(dotsBH, O, Hpos, pBH);
  placeDots(dotsCH, P[R.back], Hpos, pCH);
  placeDots(dotsCBr, P.Ca, P.Br, pCBr);

  /* --- π 键双瓣 --- */
  const opPi = ss(0.58, 0.70, tt) * op;
  M.lobeA.opacity = 0.30 * opPi; M.lobeB.opacity = 0.30 * opPi;
  lobeUp.visible = lobeDn.visible = opPi > 0.02;
  lobeUp.position.set(0, 0.46, LccOf(tt) / 2);
  lobeDn.position.set(0, -0.46, LccOf(tt) / 2);

  /* --- 四原子共平面高亮 --- */
  const antiN = 1 - ss(5, 25, Math.abs(phiDeg));
  const opPl = ss(0.24, 0.30, tt) * (1 - ss(0.38, 0.46, tt)) * antiN * op;
  M.planeM.opacity = 0.10 * opPl; M.planeEdge.opacity = 0.5 * opPl;
  planeG.visible = opPl > 0.01;
  planeG.position.set(0, 0.05, LccOf(tt) / 2);

  /* --- 电子流向箭头（三处同时） --- */
  clearDyn();
  const a3 = ss(0.36, 0.42, tt) * (1 - ss(0.56, 0.62, tt)) * op;
  if (tglArrows.checked && a3 > 0.02) {
    M.arrow.opacity = M.arrow.userData.baseOp * a3 * (0.75 + 0.25 * Math.sin(tt * 90));
    const Lcc = LccOf(tt);
    curvedArrow(O.clone().add(V3(0.32, 0.24, 0.1)), O.clone().add(V3(0.55, 0.5, 0.15)),
      Hpos.clone().add(V3(0.14, 0.22, 0)));                                                        // B: → H
    curvedArrow(V3().lerpVectors(Hpos, P[R.back], 0.5).add(V3(0.1, 0.05, 0)),
      V3(0.5, 0.3, Lcc * 0.5), V3(0.05, 0.72, Lcc * 0.5));                                          // C–H → π
    curvedArrow(P.Br.clone().multiplyScalar(0.55).add(V3(0.15, 0.12, 0)),
      P.Br.clone().multiplyScalar(0.85).add(V3(0.3, 0.25, 0)),
      P.Br.clone().multiplyScalar(1.06));                                                           // C–Br → Br
  } else M.arrow.opacity = 0;

  /* --- 电荷云 --- */
  M.haloO.opacity = 0.14 * op * (1 - 0.7 * kT);
  M.haloBr.opacity = 0.22 * op * ss(0.60, 0.70, tt);
  A.haloBr.position.copy(P.Br);

  /* --- 标签 --- */
  const lblOp = op;
  for (const o of labelObjs) o.element.style.opacity = lblOp;
  lblBr.element.innerHTML = tt < 0.56 ? L('Br 离去基团', 'Br leaving group') : L('Br⁻（已离去）', 'Br⁻ (departed)');
  lblHb.position.copy(Hpos).add(V3(0, -0.42, 0));
  lblHb.element.style.opacity = lblOp * (1 - ss(0.60, 0.66, tt));
  lblBack.position.copy(P[R.back]).add(V3(0, -0.52, 0));
  lblThird.position.copy(P[R.third]).add(V3(0.36, 0.28, 0));
  lblSub3.position.copy(P[R.s3]).add(V3(0.36, 0.28, 0));
  lblBase.element.textContent = B.kind === 'et'
    ? (tt < 0.60 ? L('EtO⁻ 碱', 'EtO⁻ base') : L('EtOH 共轭酸', 'EtOH conjugate acid'))
    : (tt < 0.60 ? L('t-BuO⁻ 大位阻碱', 't-BuO⁻ bulky base') : L('t-BuOH 共轭酸', 't-BuOH conjugate acid'));
  lblTS.element.style.opacity = (tt > 0.38 && tt < 0.58 ? 1 : 0) * lblOp;
  lblPlane.element.style.opacity = (tt > 0.26 && tt < 0.44 ? 1 : 0) * lblOp * antiN;
  lblPi.element.style.opacity = (tt > 0.62 && tt < 0.88 ? 1 : 0) * lblOp;
  lblProd.element.style.opacity = (tt > 0.78 ? 1 : 0) * lblOp;
  lblClash.element.style.opacity = (B.kind === 'tbu' && tt > 0.09 && tt < 0.155 ? 1 : 0) * lblOp;

  updateNewman(phi);
  updateEnergy(tt, op);
  return op;
}

/* ---------------- 相位讲解 ---------------- */
const STEPS = [
  { t0: 0.0, b: '底物与碱', be: 'Substrate & base',
    d: '2-溴丁烷 + 碱。α-C 带着 Br；相邻碳上的氢就是 β-H——消除反应摘的就是它。',
    de: '2-bromobutane + base. The α-carbon carries Br; hydrogens on the adjacent carbons are β-H — the ones to be removed.' },
  { t0: 0.14, b: '反式共平面', be: 'Anti-periplanar',
    d: 'C–C 单键旋转，只有当 H–Cβ–Cα–Br 四原子共面、且 Hβ 与 Br 反式（二面角 180°）时，两对电子才能头尾相接排进同一个过渡态。',
    de: 'The C–C bond rotates; only when H–Cβ–Cα–Br are coplanar and anti (dihedral 180°) can both electron pairs line up head-to-tail in one transition state.' },
  { t0: 0.34, b: '协同过渡态', be: 'Concerted TS',
    d: '碱抓 H、C–H 电子落向 C=C、C–Br 电子随 Br 离去：三处变化一拍完成，只有一个过渡态 ‡，没有中间体。',
    de: 'The base grabs H, the C–H pair falls toward C=C, the C–Br pair leaves with Br: three changes in one stroke — a single transition state ‡, no intermediate.' },
  { t0: 0.56, b: '断键成键', be: 'Bonds break & form',
    d: 'H 转移给碱生成共轭酸，Br⁻ 带着一对电子离开，π 键在 Cα 与 Cβ 之间生成——烯烃平面一锤定音。',
    de: 'H transfers to the base (conjugate acid), Br⁻ departs with its electron pair, and a π bond forms between Cα and Cβ — the alkene plane is set.' },
  { t0: 0.76, b: '产物与选择性', be: 'Products & selectivity',
    d: '小碱（EtO⁻）够得着内侧 β-H → Zaitsev 多取代烯烃；大位阻碱（t-BuO⁻）被挤到外侧 → Hofmann。动力学 v = k[RX][B]，二级。',
    de: 'A small base (EtO⁻) reaches the inner β-H → Zaitsev alkene; a bulky base (t-BuO⁻) is squeezed to the outer β-H → Hofmann. Kinetics: v = k[RX][B], second order.' },
];
function stepIndex(tt) {
  if (tt < 0.14) return 0;
  if (tt < 0.34) return 1;
  if (tt < 0.56) return 2;
  if (tt < 0.76) return 3;
  return 4;
}

/* ---------------- 能量曲线（E2 单峰 + E1 双峰虚线对比） ---------------- */
const svg = document.getElementById('energySvg');
const NS = 'http://www.w3.org/2000/svg';
const E_R = 0.30, E_TS = 0.90, E_P = 0.16;
const energyOf = p => { const base = lerp(E_R, E_P, p); return base + (E_TS - base) * 4 * p * (1 - p); };
const gauss = (p, c, w) => Math.exp(-(((p - c) / w) ** 2));
const e1Of = p => lerp(0.30, 0.36, p) + 0.52 * gauss(p, 0.30, 0.15) + 0.26 * gauss(p, 0.70, 0.10) - 0.03 * gauss(p, 0.51, 0.08);
const pOf = tt => tt < 0.10 ? 0
  : tt < 0.46 ? 0.48 * (tt - 0.10) / 0.36
  : tt < 0.54 ? 0.48 + 0.04 * (tt - 0.46) / 0.08
  : tt < 0.80 ? 0.52 + 0.48 * (tt - 0.54) / 0.26
  : 1;
let markerDot, markerLine;
const energyThemed = [];
function buildEnergy() {
  svg.innerHTML = '';
  energyThemed.length = 0;
  const X0 = 40, X1 = 280, Y0 = 158, Y1 = 16;
  const px = p => lerp(X0, X1, p);
  const py = e => lerp(Y0, Y1, e);
  const el = (tag, attrs, txt) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (txt) n.textContent = txt;
    svg.appendChild(n); return n;
  };
  const themed = (n, attr, get) => { energyThemed.push({ el: n, attr, get }); return n; };
  const axisCol  = () => PAL.axis;
  const dimCol   = () => PAL.dim;
  const curveCol = () => THEME === 'light' ? '#c79100' : '#ffd166';
  const refCol   = () => PAL.dim2;
  const refTxt   = () => THEME === 'light' ? '#6b7a8a' : '#8b97a8';
  const tsTxt    = () => THEME === 'light' ? '#c23b3b' : '#ffb3b3';
  themed(el('line', { x1: X0, y1: Y0, x2: X1, y2: Y0, 'stroke-width': 1 }), 'stroke', axisCol);
  themed(el('line', { x1: X0, y1: Y0, x2: X0, y2: Y1 - 6, 'stroke-width': 1 }), 'stroke', axisCol);
  themed(el('text', { x: X1 - 4, y: Y0 + 14, 'font-size': 11, 'text-anchor': 'end' },
         L('反应进程', 'Reaction progress')), 'fill', dimCol);
  themed(el('text', { x: X0 - 6, y: Y1 + 2, 'font-size': 11, 'text-anchor': 'middle' },
         L('能量', 'Energy')), 'fill', dimCol);
  // E1 参考虚线（双峰 + 中间体盆地）
  let d1 = '';
  for (let i = 0; i <= 60; i++) {
    const p = i / 60;
    d1 += (i ? 'L' : 'M') + px(p).toFixed(1) + ' ' + py(e1Of(p)).toFixed(1);
  }
  themed(el('path', { d: d1, fill: 'none', 'stroke-width': 1.2, 'stroke-dasharray': '5 4', opacity: 0.75 }), 'stroke', refCol);
  // E2 主曲线（单峰协同）
  let d = '';
  for (let i = 0; i <= 60; i++) {
    const p = i / 60;
    d += (i ? 'L' : 'M') + px(p).toFixed(1) + ' ' + py(energyOf(p)).toFixed(1);
  }
  themed(el('path', { d, fill: 'none', 'stroke-width': 2 }), 'stroke', curveCol);
  themed(el('text', { x: px(0.5), y: py(E_TS) - 6, 'font-size': 10.5, 'text-anchor': 'middle' },
         L('E2 · 协同单峰（无中间体）', 'E2 · concerted single hump (no intermediate)')), 'fill', tsTxt);
  themed(el('text', { x: px(0.33), y: py(e1Of(0.33)) - 6, 'font-size': 10, 'text-anchor': 'middle' },
         L('E1 · 分步双峰', 'E1 · stepwise two humps')), 'fill', refTxt);
  markerLine = el('line', { x1: 0, y1: Y0, x2: 0, y2: 0, stroke: '#ff6b6b', 'stroke-width': 0.8, opacity: 0.5 });
  markerDot = el('circle', { cx: 0, cy: 0, r: 4.5, fill: '#ff6b6b' });
  svg._px = px; svg._py = py;
  if (PAL.bg) { for (const t of energyThemed) t.el.setAttribute(t.attr, t.get()); }
}
function updateEnergy(tt, op) {
  if (!markerDot) return;
  const p = pOf(tt);
  const ex = svg._px(p), ey = svg._py(energyOf(p));
  markerDot.setAttribute('cx', ex); markerDot.setAttribute('cy', ey);
  markerLine.setAttribute('x1', ex); markerLine.setAttribute('x2', ex);
  markerLine.setAttribute('y1', svg._py(E_P) + 8); markerLine.setAttribute('y2', ey);
  markerDot.setAttribute('opacity', op);
  markerLine.setAttribute('opacity', 0.5 * op);
}

/* ---------------- 纽曼投影（沿 Cα→Cβ 轴，后碳随构象旋转） ---------------- */
const nsvg = document.getElementById('newmanSvg');
const NM = { cx: 84, cy: 92, r: 46 };
const nmPt = (deg, r) => [NM.cx + r * Math.cos(deg * D2R), NM.cy - r * Math.sin(deg * D2R)];
let nmBackLines = [], nmBackLabels = [], nmBadge, nmDih, nmAntiLine;
function buildNewman() {
  nsvg.innerHTML = '';
  nmBackLines = []; nmBackLabels = [];
  const el = (tag, attrs, txt) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (txt) n.textContent = txt;
    nsvg.appendChild(n); return n;
  };
  const themed = (n, attr, get) => { (nsvg._t = nsvg._t || []).push({ el: n, attr, get }); return n; };
  const dimC   = () => PAL.dim;
  const dim2C  = () => PAL.dim2;
  const axisC  = () => PAL.axis;
  const brCol  = () => THEME === 'light' ? '#9c5f00' : '#ffd9a3';
  const hbCol  = () => THEME === 'light' ? '#0c7ba6' : '#bde9ff';
  const alkCol = () => THEME === 'light' ? '#47701f' : '#d8f3c0';
  themed(el('text', { x: NM.cx, y: 16, 'font-size': 11, 'text-anchor': 'middle' },
         L(...ROLES[curPath].axis)), 'fill', dimC);
  themed(el('circle', { cx: NM.cx, cy: NM.cy, r: NM.r, fill: 'none', 'stroke-width': 1.2 }), 'stroke', axisC);
  const FRONT = [[90, brCol, 'Br'], [210, dim2C, 'H'], [330, alkCol, L(...ROLES[curPath].thirdLbl)]];
  for (const [ang, col, txt] of FRONT) {
    const [x1, y1] = nmPt(ang, 4), [x2, y2] = nmPt(ang, NM.r);
    themed(el('line', { x1, y1, x2, y2, 'stroke-width': 2 }), 'stroke', col);
    const [lx, ly] = nmPt(ang, NM.r + 12);
    themed(el('text', { x: lx, y: ly + 4, 'font-size': 11, 'text-anchor': 'middle' }, txt), 'fill', col);
  }
  const BACK = [[270, hbCol, 'H'], [30, dim2C, 'H'], [150, alkCol, curPath === 'Z' ? 'CH₃' : 'H']];
  for (const [ang0, col, txt] of BACK) {
    const [x1, y1] = nmPt(ang0, NM.r), [x2, y2] = nmPt(ang0, NM.r + 15);
    nmBackLines.push(themed(el('line', { x1, y1, x2, y2, 'stroke-width': 2 }), 'stroke', col));
    const [lx, ly] = nmPt(ang0, NM.r + 26);
    nmBackLabels.push(themed(el('text', { x: lx, y: ly + 4, 'font-size': 11, 'text-anchor': 'middle' }, txt), 'fill', col));
  }
  nmAntiLine = el('line', { x1: 0, y1: 0, x2: 0, y2: 0, stroke: '#ff5d5d', 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0 });
  nmBadge = el('text', { x: NM.cx, y: 176, 'font-size': 12, 'text-anchor': 'middle', 'font-weight': 700 }, '—');
  themed(nmDih = el('text', { x: NM.cx, y: 191, 'font-size': 10.5, 'text-anchor': 'middle' }, '—'), 'fill', dimC);
  if (PAL.bg) for (const t of (nsvg._t || [])) t.el.setAttribute(t.attr, t.get());
}
function updateNewman(phi) {
  if (!nmBadge) return;
  const angs = [270 + phi / D2R, 30 + phi / D2R, 150 + phi / D2R];
  angs.forEach((ang, i) => {
    const [x1, y1] = nmPt(ang, NM.r), [x2, y2] = nmPt(ang, NM.r + 15);
    nmBackLines[i].setAttribute('x1', x1); nmBackLines[i].setAttribute('y1', y1);
    nmBackLines[i].setAttribute('x2', x2); nmBackLines[i].setAttribute('y2', y2);
    const [lx, ly] = nmPt(ang, NM.r + 26);
    nmBackLabels[i].setAttribute('x', lx); nmBackLabels[i].setAttribute('y', ly + 4);
  });
  const d = ((180 + phi / D2R) % 360 + 360) % 360;
  const ok = Math.abs(d - 180) <= 25;
  nmDih.textContent = L('二面角 ∠Br–C–C–H = ', 'dihedral ∠Br–C–C–H = ') + Math.round(d) + '°';
  nmBadge.textContent = ok ? L('anti ✓ 可协同消除', 'anti ✓ allowed') : L('未反式 ✗ 反应锁死', 'not anti ✗ locked');
  nmBadge.setAttribute('fill', ok ? (THEME === 'light' ? '#3f6d1c' : '#d8f3c0') : (THEME === 'light' ? '#b83232' : '#ffc2c2'));
  nmAntiLine.setAttribute('opacity', ok ? 0.8 : 0);
  if (ok) {
    const [ax, ay] = nmPt(90, NM.r), [bx, by] = nmPt(270 + phi / D2R, NM.r);
    nmAntiLine.setAttribute('x1', ax); nmAntiLine.setAttribute('y1', ay);
    nmAntiLine.setAttribute('x2', bx); nmAntiLine.setAttribute('y2', by);
  }
  elPhiVal.textContent = Math.round(d) + '°';
  elPhiStatus.textContent = ok ? L('anti ✓ 可以反应', 'anti ✓ allowed') : L('未反式 ✗ 锁死', 'not anti ✗ locked');
  elPhiStatus.className = ok ? 'ok' : 'no';
}

/* ---------------- UI 接线 ---------------- */
let cycles = qsFloat('t', 0);
let playing = !qsBool('pause', false);
let speed = qsFloat('speed', 1);
let baseKind = qs.get('base') === 'tbu' ? 'tbu' : 'et';

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const elExploreRow = document.getElementById('exploreRow');
const elPhi = document.getElementById('phi');
const elPhiVal = document.getElementById('phiVal');
const elPhiStatus = document.getElementById('phiStatus');
const btnEt = document.getElementById('btnEt');
const btnTbu = document.getElementById('btnTbu');
const tglLabels = document.getElementById('tglLabels');
const tglArrows = document.getElementById('tglArrows');
const tglNewman = document.getElementById('tglNewman');
const tglEnergy = document.getElementById('tglEnergy');
const tglRotate = document.getElementById('tglRotate');
const tglExplore = document.getElementById('tglExplore');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000 * 0.96; });
tglLabels.addEventListener('change', () => { for (const o of labelObjs) o.element.style.display = tglLabels.checked ? '' : 'none'; });
tglNewman.addEventListener('change', () => { document.getElementById('newman').style.display = tglNewman.checked ? '' : 'none'; });
tglEnergy.addEventListener('change', () => { document.getElementById('energy').style.display = tglEnergy.checked ? '' : 'none'; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
tglExplore.addEventListener('change', () => {
  exploring = tglExplore.checked;
  elExploreRow.classList.toggle('show', exploring);
  if (exploring) {
    wasPlaying = playing; playing = false;
    const d = phiOf(phase(cycles)) / D2R;
    elPhi.value = Math.round(((d % 360) + 540) % 360 - 180);
  } else { playing = wasPlaying; }
  setPlayLabel();
});
elPhi.addEventListener('input', () => { if (exploring) explorePhi = parseFloat(elPhi.value) * D2R; });
function setBase(kind) {
  if (baseKind === kind) return;
  baseKind = kind;
  buildBase(kind);
  btnEt.classList.toggle('on', kind === 'et');
  btnTbu.classList.toggle('on', kind === 'tbu');
  cycles = 0;
}
btnEt.addEventListener('click', () => setBase('et'));
btnTbu.addEventListener('click', () => setBase('tbu'));
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
if (!qsBool('arrows', true)) { tglArrows.checked = false; }
if (!qsBool('newman', true)) { tglNewman.checked = false; tglNewman.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
if (qs.get('top') === '1') {   // 轴向机位：正对 Cα→Cβ 轴（纽曼视角），检验反式共平面
  camera.position.set(0, 0.4, -7.4);
  controls.target.set(0, 0, 0.8);
}

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let lastStep = -1;
function phase(tt0) {
  const t = tt0 - Math.floor(tt0);
  return t < 0.96 ? t : t - 0.96;
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing) cycles += dt * speed / CYCLE_SECONDS;
  const tt = phase(cycles);
  const desired = (baseKind === 'tbu' && tt >= PIVOT_T) ? 'H' : 'Z';
  if (desired !== curPath) applyPath(desired);
  scene.background.set(PAL.bg);
  updateWorld(tt);
  const si = stepIndex(tt);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(clamp(tt, 0, 0.96) / 0.96 * 1000);
  elScrubVal.textContent = Math.round(clamp(tt, 0, 0.96) / 0.96 * 100) + '%';
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
applyTheme();
applyLang();
buildBase(baseKind);
if (baseKind === 'tbu') { btnEt.classList.remove('on'); btnTbu.classList.add('on'); }
updateWorld(phase(cycles));
requestAnimationFrame(frame);
</script>
