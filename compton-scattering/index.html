<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>康普顿散射 · 光子撞电子，像台球一样把动能交出去</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e599f7;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#862e9c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panelToggle + .row + .row { padding-right: 34px; } /* panelTogglePad2: 滑杆起步的面板第二行给 ▾ 让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="康普顿散射 · 光子撞电子，像台球一样把动能交出去" data-en="Compton Scattering · a photon billiards off an electron and pays out energy">康普顿散射 · 光子撞电子，像台球一样把动能交出去</h1>
  <div class="sub" data-zh="X 射线光子撞上自由电子：一部分能量动量当场交给电子，散射光子波长变长 Δλ=(h/mₑc)(1−cosθ)——波长的变化只看散射角、与材料无关，是光子携带动量的直接证据；经典波理论给不出这个位移，康普顿因此拿到 1927 诺奖 · 拖动旋转 / 空格运行/暂停" data-en="An X-ray photon strikes a free electron, hands over energy and momentum on the spot, and scatters off redder: Δλ=(h/mₑc)(1−cosθ) — the shift depends only on angle, not material; classical wave theory cannot produce it, and the shift is the direct proof that light carries momentum (Nobel 1927) · drag to orbit / Space = run/pause">X 射线光子撞上自由电子：一部分能量动量当场交给电子，散射光子波长变长 Δλ=(h/mₑc)(1−cosθ)——波长的变化只看散射角、与材料无关，是光子携带动量的直接证据；经典波理论给不出这个位移，康普顿因此拿到 1927 诺奖 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="入射波长" data-en="Incident λ">入射波长</span><span class="v" id="stLam">—</span>
  <span class="k" data-zh="散射角 θ" data-en="Angle θ">散射角 θ</span><span class="v" id="stThe">—</span>
  <span class="k" data-zh="波长移 Δλ" data-en="Shift Δλ">波长移 Δλ</span><span class="v" id="stShift">—</span>
  <span class="k" data-zh="电子反冲能" data-en="Recoil energy">电子反冲能</span><span class="v" id="stRek">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div class="row">
    <label data-zh="散射角 θ" data-en="Angle θ">散射角 θ</label>
    <input id="sThe" type="range" min="0" max="180" step="5" value="90">
    <span class="val" id="sTheVal">90°</span>
  </div>
  <div class="row">
    <label data-zh="入射能量" data-en="Incident E">入射能量</label>
    <input id="sEin" type="range" min="20" max="200" step="5" value="66">
    <span class="val" id="sEinVal">66 keV</span>
  </div>
  <div class="row">
    <label data-zh="发射速率" data-en="Fire rate">发射速率</label>
    <input id="sRate" type="range" min="1" max="10" step="1" value="4">
    <span class="val" id="sRateVal">4 /s</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglTrack" type="checkbox" checked> <span data-zh="轨迹" data-en="Tracks">轨迹</span></label>
      <label><input id="tglSpectrum" type="checkbox" checked> <span data-zh="谱线图" data-en="Spectrum">谱线图</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../photoelectric-effect/" data-zh="光电效应" data-en="Photoelectric effect">光电效应</a>
    <a href="../xray-imaging/" data-zh="X 射线成像" data-en="X-ray imaging">X 射线</a>
    <a href="../matter-waves/" data-zh="物质波" data-en="Matter waves">物质波</a>
    <a href="../blackbody-radiation/" data-zh="黑体辐射" data-en="Blackbody">黑体辐射</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-6.5,4.6,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.9,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=80;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 页面场景 ---- */
/* 靶：石墨块 + 自由电子 */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const table=new THREE.Mesh(new THREE.BoxGeometry(14,0.4,8),groundM);
table.position.set(0,-0.2,0);scene.add(table);
const target=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),
  new THREE.MeshStandardMaterial({color:0x495057,roughness:0.5,metalness:0.4}));
target.position.set(0,0.8,0);scene.add(target);
const targetLabel=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.6,6),
  new THREE.MeshStandardMaterial({color:0x9aa7b4}));
targetLabel.position.set(0,1.7,0);scene.add(targetLabel);
/* 电子（靶内亮点） */
const elecM=new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1864ab,emissiveIntensity:0.9});
const elec=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),elecM);
elec.position.set(0,0.8,0);scene.add(elec);
/* X 射线管 */
const gun=new THREE.Group();gun.position.set(-5.2,0.8,0);scene.add(gun);
const gunBody=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,1.4,16),
  new THREE.MeshStandardMaterial({color:0x868e96,roughness:0.4,metalness:0.7}));
gunBody.rotation.z=Math.PI/2;gun.add(gunBody);
const gunWin=new THREE.Mesh(new THREE.CircleGeometry(0.16,16),
  new THREE.MeshBasicMaterial({color:0xe5dbff}));
gunWin.rotation.y=Math.PI/2;gunWin.position.x=0.72;gun.add(gunWin);
/* 光子 */
const NP=12;
const photons=[];
for(let i=0;i<NP;i++){
  const g=new THREE.Group();
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,8),
    new THREE.MeshStandardMaterial({color:0xd0bfff,emissive:0x7048e8,emissiveIntensity:1.2}));
  g.add(core);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(0.2,10,8),
    new THREE.MeshBasicMaterial({color:0xe5dbff,transparent:true,opacity:0.28}));
  g.add(halo);
  g.visible=false;scene.add(g);
  photons.push({g,core,halo,state:'idle',p:0,theta:0,energy:66});
}
/* 反冲电子轨迹 */
const tracks=[];
const trackM=new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.5});
function addTrack(pts,mat){
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);
  scene.add(ln);tracks.push(ln);
  if(tracks.length>14){const old=tracks.shift();scene.remove(old);}
}
/* 谱线图（悬浮板：两条竖线 = 原波长与移动后波长） */
const specG=new THREE.Group();specG.position.set(4.6,3.4,-1.0);specG.visible=false;scene.add(specG);
const specBoard=new THREE.Mesh(new THREE.BoxGeometry(3.6,2.2,0.06),
  new THREE.MeshStandardMaterial({color:0x14181d,roughness:0.8,transparent:true,opacity:0.9}));
specG.add(specBoard);
const specInM=new THREE.MeshBasicMaterial({color:0xd0bfff});
const specOutM=new THREE.MeshBasicMaterial({color:0xffd43b});
const specIn=new THREE.Mesh(new THREE.BoxGeometry(0.05,1.6,0.03),specInM);specIn.position.set(-0.8,-0.05,0.05);specG.add(specIn);
const specOut=new THREE.Mesh(new THREE.BoxGeometry(0.05,1.2,0.03),specOutM);specOut.position.set(0.8,-0.25,0.05);specG.add(specOut);
const specBase=new THREE.Mesh(new THREE.BoxGeometry(3.2,0.03,0.03),new THREE.MeshBasicMaterial({color:0x9fb0c3}));
specBase.position.set(0,-0.92,0.05);specG.add(specBase);
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('X 射线管：打出一颗颗光子','X-ray tube: fires one photon at a time'),new THREE.Vector3(-5.2,2.1,0),'b');
addLabel(()=>L('石墨靶：外层电子近似自由','Graphite target: outer electrons ≈ free'),new THREE.Vector3(0,2.3,0),'g');
addLabel(()=>L('散射光子：波长变长（能量变小）','Scattered photon: redder, less energy'),new THREE.Vector3(2.6,2.4,0.9),'y');
addLabel(()=>L('反冲电子：拿走动能与动量','Recoil electron: takes the balance'),new THREE.Vector3(-1.8,0.4,1.6),'b',
  ()=>tglTrackEl.checked);
addLabel(()=>L('Δλ=(h/mₑc)(1−cosθ)：只看角度，与材料无关','Δλ=(h/mₑc)(1−cosθ): angle only, material-free'),new THREE.Vector3(0.6,4.6,0),'o');

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0;
let theta=90,Ein=66,rate=4;
let fireAcc=0,hits=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
const LAM0=20.0;   // 66 keV 光子波长（pm 量级：λ=hc/E）
function setThe(t){theta=t;document.getElementById('sThe').value=t;
  document.getElementById('sTheVal').textContent=t.toFixed(0)+'°';}
function setEin(e){Ein=e;document.getElementById('sEin').value=e;
  document.getElementById('sEinVal').textContent=e.toFixed(0)+' keV';}
function setRate(r){rate=r;document.getElementById('sRate').value=r;
  document.getElementById('sRateVal').textContent=r.toFixed(0)+' /s';}
function lamIn(){return 1239.84/Ein;}               // pm
function lamOut(){return lamIn()+2.426*(1-Math.cos(theta*Math.PI/180));}
function recoilE(){const li=lamIn(),lo=lamOut();return 1239.84*(1/li-1/lo);}  // keV
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'X 射线光子撞上石墨里近似自由的外层电子',en:'An X-ray photon strikes an outer, nearly free electron in graphite'},
 {zh:'光子交出一部分能量与动量，方向被弹开 θ 角',en:'The photon hands over energy & momentum and bounces off at angle θ'},
 {zh:'散射光子波长变长：Δλ=(h/mₑc)(1−cosθ)',en:'The scattered wavelength stretches: Δλ=(h/mₑc)(1−cosθ)'},
 {zh:'θ=90° 时 Δλ 恰为一个康普顿波长 2.43 pm',en:'At θ=90° the shift equals one Compton wavelength, 2.43 pm'},
 {zh:'位移与材料无关：只看角度——粒子性的铁证',en:'The shift is material-free: angle only — hard evidence of particle light'},
 {zh:'光电效应是"整吞"，康普顿是"台球"——两个实验夹出光量子的形象',en:'Photoelectric swallows whole; Compton billiards — two experiments bracket the photon'}
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
activeStep=i;
  if(i===0){setThe(0);}
  else if(i===1){setThe(60);}
  else if(i===2){setThe(90);}
  else if(i===3){setThe(90);}
  else if(i===4){setThe(135);}
  else {setThe(90);}
 syncSteps();
}

/* ---- 读数 ---- */
function updateStats(){
const li=lamIn(),lo=lamOut(),dl=lo-li;
  document.getElementById('stLam').innerHTML=li.toFixed(2)+'<small> pm</small>';
  document.getElementById('stThe').innerHTML=theta.toFixed(0)+'<small>°</small>';
  const sh=document.getElementById('stShift');
  sh.innerHTML=dl.toFixed(2)+'<small> pm</small>';
  sh.className='v'+(dl>0.01?' warn':'');
  const rk=document.getElementById('stRek');
  rk.innerHTML=recoilE().toFixed(1)+'<small> keV</small>';
  rk.className='v'+(recoilE()>1?' warn':'' );
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  if(typeof groundM!=='undefined')groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
/* 发射 */
  if(playing){
    fireAcc+=dt*rate;
    if(fireAcc>=1){
      fireAcc-=1;
      const ph=photons.find(p=>p.state==='idle');
      if(ph){
        ph.state='fly';ph.p=0;ph.energy=Ein;
        ph.g.visible=true;ph.g.position.set(-4.4,0.8,0);
        ph.g.rotation.y=0;
      }
    }
  }
  const th=theta*Math.PI/180;
  for(const ph of photons){
    if(ph.state==='fly'){
      ph.p+=dt*1.5;
      ph.g.position.set(-4.4+ph.p*4.4,0.8+Math.sin(simT*30)*0.015,0);
      if(ph.p>=1){
        ph.state='scat';ph.p=0;hits++;
        /* 反冲电子轨迹 */
        const phi=th*Math.random()*0.4+0.5;
        addTrack([new THREE.Vector3(0,0.8,0),
          new THREE.Vector3(-Math.cos(phi)*1.2,0.8-Math.sin(phi)*0.9,Math.sin(phi)*0.9)],trackM);
        elecM.emissiveIntensity=2.2;
      }
    }else if(ph.state==='scat'){
      ph.p+=dt*1.1;
      const R=2.2+ph.p*2.6;
      /* 散射方向：在 x-y 平面内转过 θ，z 稍随机 */
      const zj=(hash(ph)+0.5)*0.5-0.25;
      ph.g.position.set(Math.cos(th)*R,-Math.sin(th)*R*0.8+0.8,zj*R*0.3);
      /* 波长变长 → 颜色向黄红移 */
      const lo=lamOut();
      const f=clamp((lo-20)/40,0,1);
      ph.core.material=new THREE.MeshStandardMaterial({
        color:new THREE.Color().setHSL(0.72-f*0.42,0.75,0.72),
        emissive:new THREE.Color().setHSL(0.72-f*0.42,0.85,0.45),emissiveIntensity:1.2});
      if(ph.p>=1){ph.state='idle';ph.g.visible=false;}
    }
  }
  elecM.emissiveIntensity+=(0.9-elecM.emissiveIntensity)*dt*3;
  elec.position.x=0.06*Math.sin(simT*21);
  /* 谱线板 */
  specG.visible=tglSpectrumEl.checked;
  if(specG.visible){
    const li=lamIn(),lo=lamOut();
    const xOf=l=>clamp((l-15)/60,-1.5,1.5);
    specIn.position.x=xOf(li);specOut.position.x=xOf(lo);
    specOut.scale.y=clamp(1-recoilE()/Ein*0.8,0.3,1);
    specOut.position.y=-0.05-(1.6-specOut.scale.y*1.6)/2;
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const tglTrackEl=document.getElementById('tglTrack');
const tglSpectrumEl=document.getElementById('tglSpectrum');
function hash(o){let x=Math.sin((o.g.position.x||0)*12.9898+simT)*43758.5;return x-Math.floor(x);}
document.getElementById('sThe').addEventListener('input',e=>setThe(+e.target.value));
document.getElementById('sEin').addEventListener('input',e=>setEin(+e.target.value));
document.getElementById('sRate').addEventListener('input',e=>setRate(+e.target.value));
document.getElementById('tglTrack').addEventListener('change',()=>{});
document.getElementById('tglSpectrum').addEventListener('change',()=>{});
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setThe(90);setEin(66);setRate(4);
syncSteps();updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
