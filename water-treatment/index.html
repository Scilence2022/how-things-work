<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自来水厂 · 从浑水到龙头的四道关</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1214; --panel:rgba(15,18,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,18,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,18,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="自来水厂 · 从浑水到龙头的四道关" data-en="The Water Treatment Plant · Four Gates from Murky to Tap">自来水厂 · 从浑水到龙头的四道关</h1>
  <div class="sub" data-zh="河水进厂要闯四道关:混凝——铝盐中和胶体的 Zeta 电位,斥力消失,撞上就粘,「矾花」越滚越大;沉淀——矾花比水重,缓缓沉底刮走;过滤——一米厚石英砂截住漏网之鱼,活性炭吸附异味;消毒——次氯酸钠氧化病原体,留 0.3–0.5 mg/L 余氯护送进管网;浊度从几十 NTU 降到 1 以下,一吨水只要约 0.3 kWh——拧开龙头的每一秒,都是四道关口的接力 · 时间加速演示,数值真实量级 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="River water must pass four gates: coagulation — alum salts neutralize the colloids' zeta potential, repulsion vanishes, collisions stick, and 'floc' snowballs; sedimentation — floc is heavier than water, sinking slowly to be scraped off; filtration — a metre of quartz sand catches the stragglers while GAC adsorbs tastes and odors; disinfection — sodium hypochlorite oxidizes pathogens and leaves 0.3–0.5 mg/L residual chlorine to escort the water into the mains; turbidity falls from tens of NTU to below 1 for about 0.3 kWh per tonne — every second at your tap is a relay across four gates · time-accelerated demo, true-scale numbers · 3D interactive demo · drag to orbit · Space = run/pause">自来水厂 · 从浑水到龙头的四道关</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="当前浊度" data-en="Turbidity">当前浊度</span><span class="v" id="stTurb">—</span>
  <span class="k" data-zh="余氯" data-en="Cl residual">余氯</span><span class="v" id="stCl">—</span>
  <span class="k" data-zh="矾花尺寸" data-en="Floc size">矾花尺寸</span><span class="v" id="stFloc">—</span>
  <span class="k" data-zh="沉速" data-en="Settling v">沉速</span><span class="v" id="stVs">—</span>
  <span class="k" data-zh="累计能耗" data-en="Energy used">累计能耗</span><span class="v" id="stEgy">—</span>
</div>

<div id="plot">
  <h3 data-zh="浊度阶梯:原水 → 混凝 → 沉淀 → 出厂(对数坐标,虚线 = 目标 1 NTU)" data-en="Turbidity cascade: raw → coagulated → settled → tap (log scale, dashed = 1 NTU target)">浊度阶梯:原水 → 混凝 → 沉淀 → 出厂(对数坐标,虚线 = 目标 1 NTU)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="棕色颗粒:未脱稳胶体(一路漂进滤池)" data-en="brown: unstabilized colloids drifting to the filter">棕色颗粒:未脱稳胶体(一路漂进滤池)</span>
    <span class="chip.g" data-zh="白色絮团:矾花(撞上就粘,越滚越大)" data-en="pale tufts: floc (collide-and-stick, ever growing)">白色絮团:矾花(撞上就粘,越滚越大)</span>
    <span class="chip.b" data-zh="黑点:砂层截留的泥渣(反冲洗冲走)" data-en="black: solids trapped in the sand (flushed by backwash)">黑点:砂层截留的泥渣(反冲洗冲走)</span>
    <span class="chip.o" data-zh="蓝绿色:加氯清水(余氯 0.3–0.5 mg/L)" data-en="cyan: chlorinated clear water (0.3–0.5 mg/L Cl)">蓝绿色:加氯清水(余氯 0.3–0.5 mg/L)</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnDose" data-zh="投药" data-en="Dose">投药</button>
    <button class="abtn" id="btnSkip" data-zh="跳过混凝(对照)" data-en="Skip coagulation (control)">跳过混凝(对照)</button>
    <button class="abtn" id="btnWash" data-zh="反冲洗砂滤" data-en="Backwash filter">反冲洗砂滤</button>
  </div>
  <div class="row"><label data-zh="原水浊度" data-en="Raw turbidity">原水浊度</label><input id="sRaw" type="range" min="5" max="100" step="5" value="40"><span class="val" id="sRawVal">40 NTU</span></div>
  <div class="row"><label data-zh="加药量" data-en="Alum dose">加药量</label><input id="sDose" type="range" min="0" max="60" step="5" value="30"><span class="val" id="sDoseVal">30 mg/L</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="暂停" data-en="Pause">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglParts" type="checkbox" checked> <span data-zh="颗粒" data-en="Particles">颗粒</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../reverse-osmosis/" data-zh="反渗透:膜法深处理的对手" data-en="reverse-osmosis: the membrane route for the last mile">反渗透:膜法深处理的对手</a>
    <a href="../surfactant-micelle/" data-zh="胶体与胶束:悬浮为什么稳定" data-en="surfactant-micelle: why colloids refuse to settle">胶体与胶束:悬浮为什么稳定</a>
    <a href="../stokes-centrifuge/" data-zh="斯托克斯沉降:沉淀的物理" data-en="stokes-centrifuge: the physics of settling">斯托克斯沉降:沉淀的物理</a>
    <a href="../cyclone-separator/" data-zh="旋风分离:另一台无重力分离机" data-en="cyclone-separator: separation without gravity">旋风分离:另一台无重力分离机</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10161c, 30, 82);

/* ---------------- 材质(注册主题色) ---------------- */
const groundM = new THREE.MeshStandardMaterial({ color: 0x151a1e, roughness: 0.95 });
const gridM = new THREE.LineBasicMaterial({ color: 0x2c3a44, transparent: true, opacity: 0.5 });
const wallM = new THREE.MeshStandardMaterial({ color: 0x8fa3b8, roughness: 0.25, metalness: 0.35, transparent: true, opacity: 0.17, side: THREE.DoubleSide, depthWrite: false });
const frameM = new THREE.MeshStandardMaterial({ color: 0x39424e, roughness: 0.5, metalness: 0.6 });
const stirM = new THREE.MeshStandardMaterial({ color: 0xb9c2cc, roughness: 0.3, metalness: 0.85 });
const sandM = new THREE.MeshStandardMaterial({ color: 0xcfae63, roughness: 0.9 });
const gravelM = new THREE.MeshStandardMaterial({ color: 0x666d78, roughness: 0.9 });
const carbM = new THREE.MeshStandardMaterial({ color: 0x23272e, roughness: 0.85 });
const tankM = new THREE.MeshStandardMaterial({ color: 0xc47f3f, roughness: 0.45, metalness: 0.5 });
const walkM = new THREE.MeshStandardMaterial({ color: 0x2b333c, roughness: 0.8 });
const fineM = new THREE.MeshStandardMaterial({ color: 0x8a5a2e, roughness: 0.8 });
const flocM = new THREE.MeshStandardMaterial({ color: 0xdcd2b8, roughness: 0.75 });
const dirtM = new THREE.MeshStandardMaterial({ color: 0x111418, roughness: 0.8 });
const dropM = new THREE.MeshStandardMaterial({ color: 0xffd57a, emissive: 0xffb340, emissiveIntensity: 0.9, roughness: 0.4 });
const THEME_MATS = [
  [groundM, 0x151a1e, 0xb9c3cd], [gridM, 0x2c3a44, 0x8fa0ad],
  [wallM, 0x8fa3b8, 0x4c5a68], [frameM, 0x39424e, 0x8b98a6],
  [stirM, 0xb9c2cc, 0x64717f], [sandM, 0xcfae63, 0xd9bc74],
  [gravelM, 0x666d78, 0x9aa0a8], [carbM, 0x23272e, 0x3a4048],
  [tankM, 0xc47f3f, 0x9a6a3a], [walkM, 0x2b333c, 0x7b8794]
];
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  const bg = new THREE.Color(dark ? 0x10161c : 0xdde7ee);
  scene.background = bg;
  scene.fog.color = bg;
  for (const [m, dk, lt] of THEME_MATS) m.color.setHex(dark ? dk : lt);
  wallM.opacity = dark ? 0.17 : 0.24;
}

/* ---------------- 渲染器 / 相机 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0.6, 12.6, 16.0);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(-0.8, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 44;
controls.autoRotateSpeed = 0.3;
controls.autoRotate = qsBool('spin', false);

scene.add(new THREE.AmbientLight(0xdfe8f2, 0.55));
const key = new THREE.DirectionalLight(0xfff2dd, 1.5);
key.position.set(9, 14, 9);
scene.add(key);
const rim = new THREE.DirectionalLight(0x9ab8ff, 0.45);

function stepSim(dt) {
  simT += dt;
  const doseOpt = 0.45 * rawT + 6;
  const effT = dosing ? clamp(dose / doseOpt, 0, 1) : 0;
  effS += (effT - effS) * Math.min(1, dt * 0.6);
  const fTgt = dosing ? 0.15 + 1.65 * effS : 0.03;
  flocSize += (fTgt - flocSize) * Math.min(1, dt * (dosing ? 0.3 : 0.55));
  vs = flocSize * flocSize * 8.17;                          // mm/s,Δρ≈15 kg/m³
  const remSed = clamp(vs / 0.3, 0, 0.965);                 // 表面负荷 v₀≈0.3 mm/s
  Tsed = rawT * (1 - effS * remSed);
  if (washT > 0) { clog = Math.max(0, clog - dt * 0.5); washT -= dt; }
  else clog = clamp(clog + dt * 0.055 * (Tsed / (Tsed + 6)) * (0.35 + 0.65 * (1 - effS)), 0, 1);
  const remF = 0.9 * (1 - 0.75 * clog);
  tout = Tsed * (1 - remF);
  toutShow += (tout - toutShow) * Math.min(1, dt * 1.6);
  cl = clamp(0.5 - 0.02 * Math.max(0, toutShow - 1), 0.06, 0.5);
  egy += dt * 0.348;                                        // 1.16 m³/s × 0.30 kWh/m³
  sludge = Math.min(1, sludge + dt * 0.008);
}

    de: 'Clay and organic debris in rivers are 0.01–5 μm colloids: Brownian motion beats gravity (Stokes settling < 0.01 mm/s — a century gets nowhere), and negatively charged surfaces (zeta −20 to −30 mV) make particles repel, so they never collide-and-stick. Left to stand, raw water barely clears.',

    de: 'The flocculation basin drops G to 20–80 s⁻¹ for gentle collisions: floc rolls from 0.05 mm to 0.5–2 mm (GT≈10⁴–10⁵). Stokes law v=2r²Δρg/(9η): settling speed scales with radius squared — 20× the radius, 400× the fall. Large floc crosses a metre of water in minutes; the scraper collects it.',
    act: () => { flyTo([-1.8, 8.8, 10.0], [-3.4, 0.8, 0]); notify('矾花越滚越大,沉速按半径平方暴涨,刮泥机收走沉底', 'flocs snowball, settling grows with r², the scraper takes the sludge'); } },
  { b: '砂滤与活性炭:截住最后的漏网', be: 'Sand filter and GAC: catching the stragglers',
    d: '沉淀池出水约 2~5 NTU,进入砂滤:0.7~1 m 石英砂(粒径 0.5~1.2 mm)以约 8 m/h 滤速把 1~10 μm 的漏网颗粒截到 0.3 NTU 以下,活性炭再吸附嗅味与有机物。若不混凝直闯滤池,胶体糊死砂层,几小时就堵塞报废——混凝是滤池的保命符。',

  { b: '水质账:浊度 <1 NTU、吨水 0.3 kWh', be: 'The water ledger: <1 NTU, 0.3 kWh per tonne',
    d: '浊度从几十 NTU 降到 0.3~1 NTU(国标 <1),余氯 0.3~0.5 mg/L;一座 10 万吨/日的水厂吨水电耗约 0.3 kWh(取水 0.06+混凝 0.05+过滤 0.14+反冲与消毒 0.05),每天约 3 万 kWh——四道关接力,把一江浑水送到你的指尖。',
    de: 'Turbidity falls from tens of NTU to 0.3–1 (standard: <1), residual chlorine 0.3–0.5 mg/L; a 100,000 m³/day plant spends ~0.3 kWh per tonne (intake 0.06 + coagulation 0.05 + filtration 0.14 + backwash & disinfection 0.05), about 30 MWh a day — four gates in relay carry a muddy river to your fingertip.',
    act: () => { flyTo([0.6, 12.6, 16.0], [-0.8, 0.8, 0]); notify('四道关接力:几十 NTU → <1 NTU,吨水约 0.3 kWh', 'four gates in relay: tens of NTU → <1 NTU at ~0.3 kWh per tonne'); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:浊度阶梯(对数) ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 34, padR = 14, padT = 14, padB = 20;
  const yLo = Math.log10(0.08), yHi = Math.log10(200);
  const xOf = i => padL + (W - padL - padR) * i / 3;
  const yOf = v => H - padB - (Math.log10(Math.max(v, 0.08)) - yLo) / (yHi - yLo) * (H - padT - padB);
  ctx.font = '11px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const g of [0.1, 1, 10, 100]) {
    ctx.beginPath(); ctx.moveTo(padL, yOf(g)); ctx.lineTo(W - padR, yOf(g)); ctx.stroke();
    ctx.fillText(String(g), 6, yOf(g) + 4);
  }
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = 'rgba(56,217,169,.8)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(1)); ctx.lineTo(W - padR, yOf(1)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#38d9a9';
  ctx.fillText(L('目标 1 NTU', 'target 1 NTU'), W - 96, yOf(1) - 5);
  const vals = [rawT, rawT * 0.95, Tsed, Math.max(0.08, toutShow)];
  const names = [L('原水', 'raw'), L('混凝', 'coag'), L('沉淀', 'settled'), L('出厂', 'tap')];
  ctx.strokeStyle = '#4dabf7';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) { const x = xOf(i), y = yOf(vals[i]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const x = xOf(i), y = yOf(vals[i]);
    const dot = i === 3 ? (vals[i] < 1 ? '#38d9a9' : '#ff6b6b') : '#4dabf7';
    ctx.fillStyle = dot;
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 6.29); ctx.fill();
    ctx.fillStyle = cTxt;
    ctx.fillText(names[i], x - 12, H - 6);
    ctx.fillStyle = dot;
    ctx.fillText(vals[i] < 10 ? vals[i].toFixed(2) : vals[i].toFixed(0), x - 10, y - 9);
  }
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elRaw = document.getElementById('sRaw'), elRawVal = document.getElementById('sRawVal');
const elDose = document.getElementById('sDose'), elDoseVal = document.getElementById('sDoseVal');
const stTurb = document.getElementById('stTurb'), stCl = document.getElementById('stCl'),
  stFloc = document.getElementById('stFloc'), stVs = document.getElementById('stVs'),
  stEgy = document.getElementById('stEgy');
const formulaEl = document.getElementById('formula');
const btnDose = document.getElementById('btnDose'), btnSkip = document.getElementById('btnSkip'), btnWash = document.getElementById('btnWash');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elRaw.value = rawT;
  elRawVal.textContent = `${rawT} NTU`;
  elDose.value = dose;
  elDoseVal.textContent = `${dose} mg/L`;
}
function syncBtns() {
  btnDose.classList.toggle('on', dosing);
  btnSkip.classList.toggle('on', !dosing);
}
function updateStats() {
  stTurb.innerHTML = `${toutShow < 10 ? toutShow.toFixed(2) : toutShow.toFixed(0)}<small> NTU</small>`;
  stTurb.className = 'v ' + (toutShow < 1 ? 'ok' : toutShow < 5 ? 'warn' : 'bad');
  stCl.innerHTML = `${cl.toFixed(2)}<small> mg/L</small>`;
  stCl.className = 'v ' + (cl >= 0.3 ? 'ok' : cl >= 0.1 ? 'warn' : 'bad');
  stFloc.innerHTML = `${flocSize < 0.06 ? '—' : flocSize.toFixed(2)}<small> mm</small>`;
  stVs.innerHTML = `${vs < 0.5 ? '<0.1' : vs.toFixed(1)}<small> mm/s</small>`;
  stEgy.innerHTML = `${egy < 1000 ? egy.toFixed(0) : (egy / 1000).toFixed(1) + 'k'}<small> kWh</small>`;
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>斯托克斯沉速:v = 2r²Δρg/(9η)</b> → r = ${(flocSize / 2).toFixed(2)} mm、Δρ ≈ 15 kg/m³ 时 v ≈ ${vs < 0.5 ? '<0.1' : vs.toFixed(1)} mm/s(未混凝胶体 <0.01 mm/s,沉一年也下不来)<br>` +
    `<b>絮凝判据:G·T ≈ 5.4×10⁴</b>(G≈45 s⁻¹ × 20 min)· 快速混合 G≈700 s⁻¹ × 30 s · 沉淀表面负荷 ≈1.1 m/h<br>` +
    `<b>余氯 0.3–0.5 mg/L</b> 护送进管网 · 出厂浊度目标 <1 NTU(GB 5749)<br>` +
    `<b>吨水能耗 ≈ 0.3 kWh</b>:取水 0.06 + 混凝絮凝 0.05 + 过滤 0.14 + 反冲/消毒 0.05 · 10 万吨/日 ≈ 3 万 kWh/日`,
    `<b>Stokes settling: v = 2r²Δρg/(9η)</b> → at r = ${(flocSize / 2).toFixed(2)} mm, Δρ ≈ 15 kg/m³: v ≈ ${vs < 0.5 ? '<0.1' : vs.toFixed(1)} mm/s (uncoagulated colloids <0.01 mm/s — a year gets nowhere)<br>` +
    `<b>Flocculation criterion: G·T ≈ 5.4×10⁴</b> (G≈45 s⁻¹ × 20 min) · rapid mix G≈700 s⁻¹ × 30 s · overflow rate ≈1.1 m/h<br>` +
    `<b>Residual chlorine 0.3–0.5 mg/L</b> into the mains · turbidity target <1 NTU<br>` +
    `<b>Energy ≈ 0.3 kWh/t</b>: intake 0.06 + coagulation 0.05 + filtration 0.14 + backwash/disinfection 0.05 · 100,000 m³/d ≈ 30 MWh/d`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elRaw.addEventListener('input', () => { rawT = +elRaw.value; syncSliders(); drawPlot(); });
elDose.addEventListener('input', () => { dose = +elDose.value; syncSliders(); });
btnDose.addEventListener('click', () => {
  dosing = true;
  syncBtns();
  notify('投药:铝盐压平 Zeta 电位,矾花翻滚长大,浊度开始跳水', 'Dosing: alum flattens the zeta potential — floc blooms and turbidity dives');
});
btnSkip.addEventListener('click', () => {
  dosing = false;
  syncBtns();
  notify('对照组:停药直闯滤池——细颗粒把砂层堵黑,浊度下不来', 'Control group: no coagulant — fines clog the sand black and turbidity never drops');
});
btnWash.addEventListener('click', () => {
  washT = 3;
  notify('反冲洗:水流反向顶起砂层,冲走截留泥渣', 'Backwash: upward flow lifts the sand bed and flushes the trapped solids');
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglParts').addEventListener('change', e => {
  partsOn = e.target.checked;
  for (const m of [fineMesh, flocMesh, dirtMesh, dropMesh]) m.visible = partsOn;
});
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ---------------- 主题 / 语言切换 ---------------- */
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('自来水厂 · 从浑水到龙头的四道关', 'The Water Treatment Plant · Four Gates from Murky to Tap');
  for (const o of labelReg) o.element.textContent = o.userData.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    stepSim(dt);
    stepParts(dt);
    mixStir.rotation.y += (dosing ? 8.5 : 4.0) * dt;
    for (let k = 0; k < 3; k++) paddles[k].rotation.y += (0.9 + 0.6 * effS) * dt * (k % 2 ? -1 : 1);
    scrape.position.x = -2.5 + ((simT * 0.55) % 6.2);
    pile.scale.setScalar(0.15 + 0.85 * sludge);
  }
  waterCol(wMixM, rawT * 0.95, 0);
  waterCol(wFlocM, rawT * 0.88, 0);
  const span = Math.max(0, rawT - Tsed);
  waterCol(wSedAM, Tsed + span * 0.66, 0);
  waterCol(wSedBM, Tsed + span * 0.33, 0);
  waterCol(wSedCM, Tsed, 0);
  waterCol(wFltM, Tsed, 0);
  waterCol(wClrM, toutShow, cl);
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; drawPlot(); }
  for (const o of labelReg) {
    const on = labelsOn && o.userData.vis();
    o.visible = on && o.userData.text() !== '';
    if (on) o.element.textContent = o.userData.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
