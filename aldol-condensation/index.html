<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羟醛缩合反应 · 碱催化 C–C 成键</title>
<style>
:root,:root[data-theme="dark"]{color-scheme:dark;
  --acc:#4dabf7;--bg:#0f1214;--panel:rgba(15,18,20,.86);--panel-border:rgba(255,255,255,.09);
  --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;--hover:rgba(255,255,255,.05);
  --shadow:0 8px 30px rgba(0,0,0,.45);--tool:rgba(15,18,20,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,18,20,.8);}
:root[data-theme="light"]{color-scheme:light;
  --acc:#1864ab;--bg:#eef2f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
  --text:#16202c;--text2:#5b6b7d;--text3:#33414f;--hover:rgba(15,25,40,.05);
  --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s;}
#app{position:fixed;inset:0;}#app canvas{display:block;}
#tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
.tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
  font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;text-decoration:none;backdrop-filter:blur(6px);transition:border-color .15s,color .15s,transform .15s;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
#title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
#title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
#title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5);}
#stats{position:fixed;right:18px;bottom:244px;z-index:4;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
  backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
#stats .k{font-size:12px;color:var(--text2);align-self:center;}
#stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
#stats .v small{font-size:11px;color:var(--text2);font-weight:400;}
#stats .v.ok{color:#7bd88f;}#stats .v.warn{color:#ffa94d;}#stats .v.bad{color:#ff6b6b;}
#panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
  background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
  padding:14px 16px 12px;backdrop-filter:blur(6px);box-shadow:var(--shadow);
  max-height:calc(100vh - 160px);overflow:auto;}
#actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;background:var(--hover);
  color:var(--text2);border:1px solid var(--tool-border);border-radius:9px;padding:7px 10px;
  font-size:12.5px;font-weight:600;transition:border-color .15s,color .15s,background .15s;}
.abtn:hover{border-color:var(--acc);color:var(--text);}
.abtn.on{border-color:rgba(77,171,247,.6);background:rgba(77,171,247,.12);color:var(--text);}
:root[data-theme="light"] .abtn.on{border-color:rgba(24,100,171,.55);background:rgba(24,100,171,.10);}
#formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);
  border-top:1px dashed var(--panel-border);padding-top:7px;}
#formula b{color:var(--text3);font-weight:600;}
#steps{list-style:none;margin-top:8px;}
#steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;align-items:flex-start;}
#steps li:hover{background:var(--hover);}
#steps li.on{background:rgba(77,171,247,.10);border-color:rgba(77,171,247,.45);}
:root[data-theme="light"] #steps li.on{background:rgba(24,100,171,.08);border-color:rgba(24,100,171,.4);}
#steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  background:rgba(255,255,255,.12);color:var(--text3);}
:root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
#steps li.on .n{background:var(--acc);color:#fff;}
#steps .t{font-size:12px;color:var(--text3);line-height:1.45;}
#steps .t b{color:var(--text);font-size:12px;}
#steps li.on .t b{color:#bde9ff;}
:root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
#ctrl{margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);display:flex;flex-direction:column;gap:6px;}
#ctrl label{font-size:12px;color:var(--text2);display:flex;justify-content:space-between;}
#ctrl input[type=range]{width:100%;accent-color:var(--acc);height:4px;cursor:pointer;}
@media(max-width:900px){#stats{display:none;}}
@media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh;}
  #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>

<div id="title">
  <h1 data-zh="羟醛缩合反应" data-en="Aldol Condensation">羟醛缩合反应</h1>
  <div class="sub" data-zh="碱催化烯醇化·C–C 成键·消除脱水" data-en="Enolization · C–C bond formation · dehydration">碱催化烯醇化·C–C 成键·消除脱水</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="步骤" data-en="Step">步骤</span><span class="v ok" id="stStep">0</span>
  <span class="k" data-zh="温度 °C" data-en="Temp °C">温度 °C</span><span class="v" id="stTemp">25</span>
  <span class="k" data-zh="产物 %" data-en="Product %">产物 %</span><span class="v" id="stProd">0</span>
  <span class="k">pH</span><span class="v" id="stPH">13.0</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnStep" data-zh="逐步演示" data-en="Step through">逐步演示</button>
    <button class="abtn" id="btnDehy" data-zh="加热脱水" data-en="Dehydrate">加热脱水</button>
    <button class="abtn" id="btnReset" data-zh="重置" data-en="Reset">重置</button>
  </div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <label>
      <span data-zh="温度 T" data-en="Temperature T">温度 T</span>
      <span id="slTVal">25 °C</span>
    </label>
    <input type="range" id="slT" min="20" max="120" step="1" value="25">
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG  = localStorage.getItem('htw-lang')  || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

let rxnStep = 0, animT = 0, autoAnimate = false, tempC = 25;
let productPct = 0;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x0a0c0e);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0c0e,25,60);
const camera = new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(0,4,16);
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.target.set(0,0,0);
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const sun=new THREE.DirectionalLight(0xffffff,0.85); sun.position.set(5,10,7); scene.add(sun);

// Materials
const matC = new THREE.MeshStandardMaterial({color:0x444444,roughness:0.4,metalness:0.1});
const matO = new THREE.MeshStandardMaterial({color:0xdd3333,roughness:0.4});
const matH = new THREE.MeshStandardMaterial({color:0xeeeeee,roughness:0.5});
const matBond = new THREE.MeshStandardMaterial({color:0x888888,roughness:0.5});
const matOH = new THREE.MeshStandardMaterial({color:0xff4444,roughness:0.3});
const matEnolate = new THREE.MeshStandardMaterial({color:0xffd700,roughness:0.3,emissive:0xffd700,emissiveIntensity:0.4});
const matNewBond = new THREE.MeshStandardMaterial({color:0xffaa00,roughness:0.3,emissive:0xffaa00,emissiveIntensity:0.3});
const matDblBond = new THREE.MeshStandardMaterial({color:0xff8800,roughness:0.3,emissive:0xff6600,emissiveIntensity:0.4});

function makeSphere(r,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat);
  m.position.set(x,y,z); scene.add(m); return m;
}
function makeBond(a,b,mat,r=0.04){
  const dir=new THREE.Vector3().subVectors(b,a);
  const len=dir.length();
  const mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8),mat||matBond);
  m.position.copy(mid);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  scene.add(m); return m;
}

// --- Molecule A: CH3CHO at left (-3.5, 0, 0) ---
// C1 (methyl), C2 (carbonyl), O (=O on C2)
const A_C1 = makeSphere(0.18,matC,-4.2,0.2,0);
const A_C2 = makeSphere(0.18,matC,-3.2,0,0);
const A_O  = makeSphere(0.15,matO,-2.5,0.7,0);
// H atoms on C1
const A_H1 = makeSphere(0.10,matH,-4.8,0.8,0.3);
const A_H2 = makeSphere(0.10,matH,-4.8,-0.2,-0.3);
const A_H3 = makeSphere(0.10,matH,-4.6,-0.3,0.6);
// alpha-H on C2 (the one OH- will grab)
const A_aH = makeSphere(0.10,matH,-3.3,-0.8,0.5);
// H on CHO
const A_H_CHO = makeSphere(0.10,matH,-2.9,-0.7,-0.5);

// Bonds for molecule A
const bA_C1C2=makeBond(A_C1.position,A_C2.position);
const bA_C2O =makeBond(A_C2.position,A_O.position,matBond,0.055); // double bond approx
const bA_C1H1=makeBond(A_C1.position,A_H1.position);
const bA_C1H2=makeBond(A_C1.position,A_H2.position);
const bA_C1H3=makeBond(A_C1.position,A_H3.position);
const bA_C2aH=makeBond(A_C2.position,A_aH.position);
const bA_CHO =makeBond(A_C2.position,A_H_CHO.position);

// --- Molecule B: CH3CHO at right (3.5, 0, 0) ---
const B_C1 = makeSphere(0.18,matC,3.0,0.2,0);
const B_C2 = makeSphere(0.18,matC,4.0,0,0);
const B_O  = makeSphere(0.15,matO,4.7,0.7,0);
const B_H1 = makeSphere(0.10,matH,2.4,0.8,0.3);
const B_H2 = makeSphere(0.10,matH,2.4,-0.2,-0.3);
const B_H3 = makeSphere(0.10,matH,2.6,-0.3,0.6);
const B_aH = makeSphere(0.10,matH,3.9,-0.8,0.5);
const B_H_CHO=makeSphere(0.10,matH,4.4,-0.6,-0.5);

const bB_C1C2=makeBond(B_C1.position,B_C2.position);
const bB_C2O =makeBond(B_C2.position,B_O.position,matBond,0.055);
const bB_C1H1=makeBond(B_C1.position,B_H1.position);
const bB_C1H2=makeBond(B_C1.position,B_H2.position);
const bB_C1H3=makeBond(B_C1.position,B_H3.position);
const bB_C2aH=makeBond(B_C2.position,B_aH.position);
const bB_CHO =makeBond(B_C2.position,B_H_CHO.position);

// OH- catalyst
const OH_O = makeSphere(0.13,matOH,-1.5,-2.5,0);
const OH_H = makeSphere(0.09,matH,-1.0,-2.1,0);
const bOH = makeBond(OH_O.position,OH_H.position);

// New C-C bond (hidden initially)
let newBondMesh = null;
// Dehydration double bond (hidden initially)
let dblBondMesh = null;

// Glow sphere for enolate (hidden initially)
const enolGlow = makeSphere(0.22,matEnolate,-3.2,0,0);
enolGlow.visible=false;

// Water leaving group (hidden initially)
const waterO=makeSphere(0.13,matO,0,-3,0); waterO.visible=false;
const waterH1=makeSphere(0.09,matH,0.4,-3.5,0); waterH1.visible=false;
const waterH2=makeSphere(0.09,matH,-0.4,-3.5,0); waterH2.visible=false;

function setVisible(objs, vis){ objs.forEach(o=>{ if(o) o.visible=vis; }); }

function applyStep(s){
  // Reset colors first
  A_C2.material=matC; A_aH.material=matH;
  enolGlow.visible=false;
  if(newBondMesh){ newBondMesh.visible=false; }
  if(dblBondMesh){ dblBondMesh.visible=false; }
  setVisible([waterO,waterH1,waterH2],false);
  bA_C2aH.visible=true;

  if(s>=1){
    // Enolization: OH- moves toward alpha-H, alpha-H detaches, enolate forms
    OH_O.position.set(-3.0,-1.2,0);
    OH_H.position.set(-3.3,-0.7,0.3);
    A_aH.position.set(-3.5,-1.5,0.5);
    bA_C2aH.visible=false;
    enolGlow.visible=true;
    A_C2.material=matEnolate;
  }
  if(s>=2){
    // C-C bond: alpha-C of A attacks carbonyl C of B
    A_C2.material=matC;
    enolGlow.visible=false;
    // Move molecule A closer to B
    const shift=1.5;
    [A_C1,A_C2,A_O,A_H1,A_H2,A_H3,A_H_CHO].forEach(o=>o.position.x+=shift);
    [bA_C1C2,bA_C2O,bA_C1H1,bA_C1H2,bA_C1H3,bA_CHO].forEach(b=>{
      if(b) b.visible=true; // bonds were already moved with their positions
    });
    // Draw new C-C bond
    if(!newBondMesh){
      newBondMesh=makeBond(A_C2.position,B_C1.position,matNewBond,0.055);
    } else { newBondMesh.visible=true; }
    productPct=Math.min(productPct+40,60);
  }
  if(s>=3){
    // Protonation: H attaches to O of molecule B
    B_O.material=new THREE.MeshStandardMaterial({color:0xdd3333});
    const protonH=makeSphere(0.09,matH,4.7,1.4,0);
    makeBond(B_O.position,protonH.position);
    productPct=Math.min(productPct+20,80);
  }
  if(s>=4){
    // Dehydration: OH and alpha-H leave as water
    setVisible([waterO,waterH1,waterH2],true);
    waterO.position.set(0,-2.5,0);
    waterH1.position.set(0.5,-3.0,0.3);
    waterH2.position.set(-0.5,-3.0,-0.3);
    // Show double bond
    if(!dblBondMesh){
      const p1=A_C2.position.clone(); const p2=B_C1.position.clone();
      const off=new THREE.Vector3(0,0.12,0);
      dblBondMesh=makeBond(p1.clone().add(off),p2.clone().add(off),matDblBond,0.04);
    } else { dblBondMesh.visible=true; }
    productPct=100;
  }
  document.getElementById('stStep').textContent=s;
  document.getElementById('stProd').textContent=productPct.toFixed(0)+'%';
}

function resetScene(){
  rxnStep=0; animT=0; productPct=0;
  // Reset all positions to initial
  A_C1.position.set(-4.2,0.2,0); A_C2.position.set(-3.2,0,0); A_O.position.set(-2.5,0.7,0);
  A_H1.position.set(-4.8,0.8,0.3); A_H2.position.set(-4.8,-0.2,-0.3); A_H3.position.set(-4.6,-0.3,0.6);
  A_aH.position.set(-3.3,-0.8,0.5); A_H_CHO.position.set(-2.9,-0.7,-0.5);
  OH_O.position.set(-1.5,-2.5,0); OH_H.position.set(-1.0,-2.1,0);
  enolGlow.visible=false; bA_C2aH.visible=true;
  if(newBondMesh){ newBondMesh.visible=false; }
  if(dblBondMesh){ dblBondMesh.visible=false; }
  setVisible([waterO,waterH1,waterH2],false);
  A_C2.material=matC; A_aH.material=matH;
  document.getElementById('stStep').textContent='0';
  document.getElementById('stProd').textContent='0%';
  document.querySelectorAll('#steps li').forEach(x=>x.classList.remove('on'));
  updateFormula();
}

function updateStats(){
  const pH = tempC > 60 ? 12.5 : 13.0;
  document.getElementById('stTemp').textContent=tempC;
  document.getElementById('stPH').textContent=pH.toFixed(1);
}

function updateFormula(){
  document.getElementById('formula').innerHTML=
    `<b>${L('催化剂','Catalyst')}:</b> OH⁻ (pKa ${L('匹配目标','match target')} ~20)<br>`+
    `<b>${L('总反应','Overall')}:</b> 2 CH₃CHO → CH₃CH(OH)CH₂CHO (aldol)<br>`+
    `<b>${L('加热时','With heat')}:</b> → CH₃CH=CHCHO + H₂O (α,β-${L('不饱和醛','unsaturated aldehyde')})`;
}

const STEPS=[
  {zh:'α-H 酸性：羰基使相邻 C–H 的 pKa 降至约 20，碱可夺取',en:'α-H acidity: carbonyl lowers adjacent pKa to ~20 — base can abstract it'},
  {zh:'烯醇负离子：OH⁻ 夺走 α-H，负电荷离域到氧，α-C 成亲核体',en:'Enolate: OH⁻ abstracts α-H, charge delocalizes to O — α-C becomes nucleophile'},
  {zh:'C–C 成键：烯醇负离子 α-C 进攻第二分子羰基 C，新 C–C 键形成（金色高亮）',en:'C–C bond: enolate α-C attacks second molecule\'s carbonyl C — new C–C bond (gold highlight)'},
  {zh:'质子化：从溶剂得质子，生成 β-羟基醛（aldol 产物）',en:'Protonation: solvent provides H⁺ → β-hydroxy aldehyde (aldol product)'},
  {zh:'消除脱水：加热，β-OH 和 α-H 脱去水分子，形成 α,β-不饱和醛',en:'Dehydration (heat): β-OH and α-H leave as water → α,β-unsaturated aldehyde'},
  {zh:'合成价值：一步实现 C–C 成键，延伸碳链——有机合成核心策略',en:'Synthetic value: forms C–C bond in one step — foundational in organic synthesis'},
];

function buildSteps(){
  const ol=document.getElementById('steps'); ol.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    const txt=LANG==='en'?s.en:s.zh;
    const parts=txt.split(/[:：]/);
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${parts[0]}</b>${parts.length>1?'<br>'+parts.slice(1).join(''): ''}</span>`;
    li.addEventListener('click',()=>{document.querySelectorAll('#steps li').forEach(x=>x.classList.remove('on'));li.classList.add('on');});
    ol.appendChild(li);
  });
}

document.getElementById('btnStep').addEventListener('click',()=>{
  if(rxnStep<4){ rxnStep++; applyStep(rxnStep); }
  const lis=document.querySelectorAll('#steps li');
  lis.forEach(x=>x.classList.remove('on'));
  if(rxnStep-1<lis.length) lis[rxnStep-1].classList.add('on');
});
document.getElementById('btnDehy').addEventListener('click',()=>{
  rxnStep=4; applyStep(4); tempC=Math.max(tempC,80);
  document.getElementById('slT').value='80'; updateSlider(); updateStats();
});
document.getElementById('btnReset').addEventListener('click',resetScene);
document.getElementById('slT').addEventListener('input',()=>{updateSlider();updateStats();});

function updateSlider(){
  tempC=parseInt(document.getElementById('slT').value);
  document.getElementById('slTVal').textContent=tempC+' °C';
}

function applyTheme(){
  htmlEl.setAttribute('data-theme',THEME);
  renderer.setClearColor(THEME==='dark'?0x0a0c0e:0xd0d8e4);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh;});
  document.getElementById('langBtn').textContent=LANG==='en'?'中':'EN';
  document.title=L('羟醛缩合反应 · 碱催化 C–C 成键','Aldol Condensation · Base-catalyzed C–C Bond');
  buildSteps(); updateFormula();
}
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});

const clock=new THREE.Clock(); let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);
  animT+=dt;
  // Gentle idle bobbing
  [A_C1,A_C2,A_O].forEach((o,i)=>{o.position.y+=Math.sin(animT*1.2+i)*0.0003;});
  [B_C1,B_C2,B_O].forEach((o,i)=>{o.position.y+=Math.sin(animT*1.1+i+1)*0.0003;});
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=null;}else{clock.getDelta();raf=requestAnimationFrame(frame);}});

applyTheme(); applyLang(); buildSteps(); updateSlider(); updateStats(); updateFormula();
raf=requestAnimationFrame(frame);
</script>
</body></html>
