<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>行星逆行 · 打结的视轨迹</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.warn{color:#ffd43b}#stats .v.bad{color:#ff6b6b}
  :root[data-theme="light"] #stats .v.warn{color:#d98f00}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 行星逆行:圆轨道简化(行星偏心率最大 0.09,对逆行几何影响甚小)
   ωp = 2π/Tp,逆行窗口 = 会合周期 S=1/|1/1−1/Tp| 附近,火星 S=780d≈26 个月
   视经度变化率 dλ/dt = (rx·vz − rz·vx)/|r|²,<0 即西退(逆行) */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---------- 渲染器 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070d);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,4000);
camera.position.set(0,58,64);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=600;controls.autoRotateSpeed=0.4;

scene.add(new THREE.AmbientLight(0x8899bb,0.6));
const sunLight=new THREE.PointLight(0xfff2dd,2.6,0,0);scene.add(sunLight);

/* ---------- 行星数据(周期:年) ---------- */
const AU=12;
const PDATA={
  mercury:{a:0.387,T:0.2408,c:0x9c8f7f,r:0.26,zh:'水星',en:'Mercury',sup:false},
  venus:{a:0.723,T:0.6152,c:0xe8c37e,r:0.42,zh:'金星',en:'Venus',sup:false},
  earth:{a:1.0,T:1.0,c:0x4d9de0,r:0.5,zh:'地球',en:'Earth',sup:true},
  mars:{a:1.524,T:1.8808,c:0xd6604a,r:0.4,zh:'火星',en:'Mars',sup:true},
  jupiter:{a:5.203,T:11.862,c:0xd9a066,r:0.85,zh:'木星',en:'Jupiter',sup:true},
  saturn:{a:9.537,T:29.457,c:0xd8c78a,r:0.72,zh:'土星',en:'Saturn',sup:true},
};
const sun=new THREE.Mesh(new THREE.SphereGeometry(1.7,32,20),new THREE.MeshBasicMaterial({color:0xffd76e}));
scene.add(sun);
const bodies={};
for(const k in PDATA){
  const d=PDATA[k];
  const m=new THREE.Mesh(new THREE.SphereGeometry(d.r,24,16),
    new THREE.MeshStandardMaterial({color:d.c,roughness:0.55,emissive:d.c,emissiveIntensity:0.12}));
  scene.add(m);
  const pts=[];
  for(let i=0;i<=128;i++){const a=i/128*2*Math.PI;pts.push(new THREE.Vector3(d.a*AU*Math.cos(a),0,-d.a*AU*Math.sin(a)));}
  const orbit=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0x3a4a63,transparent:true,opacity:0.5}));
  scene.add(orbit);
  bodies[k]={mesh:m,orbit};
}

/* ---------- 轨迹(定长环形缓冲,满了丢最旧 1/4) ---------- */
class Trail{
  constructor(max,color,opacity,parent=scene){
    this.max=max;this.n=0;
    this.pos=new Float32Array(max*3);
    this.geo=new THREE.BufferGeometry();
    this.geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
    this.geo.setDrawRange(0,0);
    this.line=new THREE.Line(this.geo,new THREE.LineBasicMaterial({color,transparent:true,opacity}));
    this.line.frustumCulled=false;
    parent.add(this.line);
  }
  clear(){this.n=0;this.geo.setDrawRange(0,0);}
  push(x,y,z){
    if(this.n>=this.max){const drop=this.max>>2;this.pos.copyWithin(0,drop*3);this.n-=drop;}
    const i=this.n*3;this.pos[i]=x;this.pos[i+1]=y;this.pos[i+2]=z;this.n++;
    this.geo.setDrawRange(0,this.n);
    this.geo.attributes.position.needsUpdate=true;
  }
}
const trailE=new Trail(1600,0x74c0fc,0.55);
const trailP=new Trail(1600,0xffa94d,0.7);

/* ---------- 地心组:跟随地球的星空背景带 + 相对视轨迹 ---------- */
const geoGrp=new THREE.Group();scene.add(geoGrp);
{
  const n=520,arr=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a=Math.random()*2*Math.PI,r=26+Math.random()*1.6;
    arr[i*3]=r*Math.cos(a);arr[i*3+1]=(Math.random()-0.5)*2.6;arr[i*3+2]=r*Math.sin(a);
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  geoGrp.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x9db4d6,size:0.17,transparent:true,opacity:0.85})));
}
const trailGeo=new Trail(2600,0xffa94d,0.95,geoGrp);
const marker=new THREE.Mesh(new THREE.SphereGeometry(0.55,16,12),new THREE.MeshBasicMaterial({color:0xff6b6b}));
geoGrp.add(marker);

/* ---------- 视线 + 速度箭头 ---------- */
const sight=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),
  new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.85}));
scene.add(sight);
const mkArrow=c=>new THREE.ArrowHelper(new THREE.Vector3(0,0,1),new THREE.Vector3(),3.4,c,0.9,0.45);
const arrE=mkArrow(0x74c0fc),arrP=mkArrow(0xffa94d);
arrE.visible=arrP.visible=false;scene.add(arrE,arrP);

/* ---------- 状态(先于标签声明,避免标签立即求值时 TDZ) ---------- */
let simT=-0.985,speedDPS=80,targetK='mars',geoView=false;
let trailsOn=true,arrowsOn=false,playing=true,labelsOn=true;
let rateDPS=0,distAU=1,phaseName='顺行';
let playingInit=!(qs.get('pause')==='1');
if(qs.get('labels')==='0'){labelsOn=false;}
if(qs.get('speed')!==null){const v=parseFloat(qs.get('speed'));if(Number.isFinite(v))speedDPS=clamp(v,5,300);}

/* ---------- 标签(addLabel 返回 CSS2DObject 本体) ---------- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});
  div.textContent=textFn();
  return o;
}
const plLbl=addLabel(()=>L(PDATA[targetK].zh,PDATA[targetK].en),new THREE.Vector3(),'o');
addLabel(()=>L('太阳','Sun'),new THREE.Vector3(0,2.6,0),'o',()=>!geoView,sun);
addLabel(()=>L('地球(内圈,跑得快)','Earth (inner, faster)'),new THREE.Vector3(0,1.2,0),'b',()=>true,bodies.earth.mesh);
addLabel(()=>L('星空背景带(黄道星座)','Star band (zodiac)'),new THREE.Vector3(0,2.4,-25),'b',()=>geoView,geoGrp);
addLabel(()=>L('地心视角:行星视轨迹当场画出打结的环','Geocentric view: the knot is drawn live'),new THREE.Vector3(0,4.2,0),'o',()=>geoView,geoGrp);
addLabel(()=>L('视位置(沿星空带的东西摆动)','Apparent position (east–west drift)'),new THREE.Vector3(0,1.1,0),'r',()=>geoView,marker);
let oppNear=false,oppTextZh='',oppTextEn='';
const oppLbl=addLabel(()=>oppNear?L(oppTextZh,oppTextEn):'',new THREE.Vector3(0,4.6,0),'r');

/* ---------- 轨道函数 ---------- */
function wPos(k,t){const d=PDATA[k],th=2*Math.PI*t/d.T;
  return {x:d.a*AU*Math.cos(th),z:-d.a*AU*Math.sin(th)};}
function wVel(k,t){const d=PDATA[k],th=2*Math.PI*t/d.T,w=2*Math.PI/d.T;
  return {x:-d.a*AU*w*Math.sin(th),z:-d.a*AU*w*Math.cos(th)};}
/* 所有过点相位为 0 → 与地球成一直线(冲/下合)的时刻 = 会合周期的整数倍 */
function synodic(k){const wE=2*Math.PI,w=2*Math.PI/PDATA[k].T;return 2*Math.PI/Math.abs(wE-w);}
function nextAlign(k,t0){const D=synodic(k);let t=Math.ceil((t0+1e-6)/D)*D;if(t<=t0+1e-6)t+=D;return t;}
function clearTrails(){trailE.clear();trailP.clear();trailGeo.clear();}

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('sSpdVal').textContent=Math.round(speedDPS)+' '+L('天/秒','d/s');
  document.getElementById('btnGeo').textContent=geoView?L('切到日心视角','Heliocentric view'):L('切到地心视角','Geocentric view');
  buildSteps();updateStats();
}

/* ---------- 步骤 ---------- */
function selectPlanet(k){
  targetK=k;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById(k==='venus'?'pInner':'p'+k.charAt(0).toUpperCase()+k.slice(1)).classList.add('on');
}
const STEPS=[
  {zh:'顺行:行星在星空上大多数时间向东走,黄道方向的日常',en:'Prograde: planets drift east (direct) against the stars most of the time',
   act(){selectPlanet('mars');geoView=false;simT=nextAlign('mars',simT)+200/365.25;speedDPS=80;clearTrails();}},
  {zh:'冲日临近:视运动一天天变慢,在「留」点停住',en:'Approaching opposition: apparent motion slows day by day, then stations',
   act(){selectPlanet('mars');geoView=true;simT=nextAlign('mars',simT)-30/365.25;speedDPS=40;clearTrails();}},
  {zh:'逆行:地球从内圈超车,火星在星空上倒退 2~3 个月',en:'Retrograde: Earth overtakes on the inside lane — Mars backs up for 2–3 months',
   act(){selectPlanet('mars');geoView=true;simT=nextAlign('mars',simT);speedDPS=20;clearTrails();}},
  {zh:'复顺:过了冲日,火星恢复向东,轨迹收成一个环',en:'Resuming: past opposition Mars heads east again, closing the loop',
   act(){selectPlanet('mars');geoView=true;simT=nextAlign('mars',simT)+45/365.25;speedDPS=60;clearTrails();}},
  {zh:'木星·土星:更慢更小,同样在冲日前后打一个小环',en:'Jupiter & Saturn: slower, smaller loops, still centred on opposition',
   act(){selectPlanet('jupiter');geoView=true;simT=nextAlign('jupiter',simT)-50/365.25;speedDPS=15;clearTrails();}},
  {zh:'内行星:只有贴近太阳的顺行圈与留,短暂西退藏进下合的晨昏光里',en:'Inner planets: loops hug the Sun — their brief westward slip hides in twilight near inferior conjunction',
   act(){selectPlanet('venus');geoView=true;simT=nextAlign('venus',simT)-20/365.25;speedDPS=8;clearTrails();}},
  {zh:'同一运动两种宇宙观:本轮套本轮,或地球只是内圈一颗快行星',en:'One motion, two cosmologies: wheels on wheels, or Earth as the faster inner planet',
   act(){geoView=!geoView;simT=nextAlign(targetK,simT);speedDPS=30;clearTrails();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncAfterStep();});
    el.appendChild(li);
  });
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function syncAfterStep(){
  document.getElementById('sSpd').value=speedDPS;
  document.getElementById('sSpdVal').textContent=Math.round(speedDPS)+' '+L('天/秒','d/s');
  document.getElementById('btnGeo').textContent=geoView?L('切到日心视角','Heliocentric view'):L('切到地心视角','Geocentric view');
  document.getElementById('btnGeo').classList.toggle('on',geoView);
  buildSteps();
}
function updateStats(){
  const elR=document.getElementById('stRate'),elP=document.getElementById('stPhase');
  document.getElementById('stDay').innerHTML=(simT*365.25).toFixed(0)+'<small> d</small>';
  elR.innerHTML=(rateDPS>=0?'+':'')+rateDPS.toFixed(3)+'<small> °/d</small>';
  elR.className='v'+(rateDPS<-0.03?' bad':Math.abs(rateDPS)<0.03?' warn':'');
  document.getElementById('stDist').innerHTML=distAU.toFixed(2)+'<small> AU</small>';
  elP.textContent=phaseName;
  elP.className='v'+(phaseName===L('逆行','retrograde')?' bad':phaseName===L('留','station')?' warn':'');
}

/* ---------- 事件绑定 ---------- */
document.getElementById('pMars').addEventListener('click',()=>{selectPlanet('mars');clearTrails();});
document.getElementById('pJup').addEventListener('click',()=>{selectPlanet('jupiter');clearTrails();});
document.getElementById('pSat').addEventListener('click',()=>{selectPlanet('saturn');clearTrails();});
document.getElementById('pInner').addEventListener('click',()=>{selectPlanet('venus');clearTrails();});
document.getElementById('btnGeo').addEventListener('click',()=>{
  geoView=!geoView;
  document.getElementById('btnGeo').classList.toggle('on',geoView);
  document.getElementById('btnGeo').textContent=geoView?L('切到日心视角','Heliocentric view'):L('切到地心视角','Geocentric view');
});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedDPS=+e.target.value;
  document.getElementById('sSpdVal').textContent=Math.round(speedDPS)+' '+L('天/秒','d/s');
});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('tglTrail').addEventListener('change',e=>{trailsOn=e.target.checked;
  if(!trailsOn)clearTrails();});
document.getElementById('tglArr').addEventListener('change',e=>{arrowsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';
  localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0,sampAcc=0;
const target=new THREE.Vector3();
if(!labelsOn){document.getElementById('tglLabels').checked=false;}
if(!playingInit){playing=false;document.getElementById('play').textContent=L('运行','Run');}

function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    const dYears=dt*speedDPS/365.25;
    simT+=dYears;
    sampAcc+=dYears*365.25;
    if(sampAcc>=2){ /* 每 2 个模拟日采一个轨迹点 */
      sampAcc=0;
      const pe=wPos('earth',simT),pp=wPos(targetK,simT);
      if(trailsOn){
        trailE.push(pe.x,0,pe.z);trailP.push(pp.x,0,pp.z);
        trailGeo.push(pp.x-pe.x,0,pp.z-pe.z);
      }
    }
  }
  const pe=wPos('earth',simT),pp=wPos(targetK,simT);
  const ve=wVel('earth',simT),vp=wVel(targetK,simT);
  bodies.earth.mesh.position.set(pe.x,0,pe.z);
  bodies[targetK].mesh.position.set(pp.x,0,pp.z);
  /* 视经度变化率(黄道面内) */
  const rx=pp.x-pe.x,rz=pp.z-pe.z,vx=vp.x-ve.x,vz=vp.z-ve.z;
  const r2=rx*rx+rz*rz;
  distAU=Math.sqrt(r2)/AU;
  const rate=(rx*vz-rz*vx)/r2;      /* rad/yr */
  rateDPS=rate*57.29578/365.25;     /* °/day */
  phaseName=rateDPS<-0.03?L('逆行','retrograde'):rateDPS>0.03?L('顺行','prograde'):L('留','station');
  sight.geometry.attributes.position.setXYZ(0,pe.x,0,pe.z);
  sight.geometry.attributes.position.setXYZ(1,pp.x,0,pp.z);
  sight.geometry.attributes.position.needsUpdate=true;
  sight.material.color.setHex(rateDPS<-0.03?0xff6b6b:0x74c0fc);
  /* 冲日 / 下合提示 */
  const D=synodic(targetK);
  const dAl=Math.abs(simT-Math.round(simT/D)*D)*365.25;
  oppNear=dAl<9;
  oppTextZh=PDATA[targetK].sup?'冲日:地球正在超车,视运动西退':'下合:内行星超过地球,短暂西退';
  oppTextEn=PDATA[targetK].sup?'Opposition: Earth overtaking — apparent motion reverses':'Inferior conjunction: the inner planet laps Earth';
  /* 地心组跟随地球,星空带与相对轨迹随之平移 */
  geoGrp.position.set(pe.x,0,pe.z);
  geoGrp.visible=geoView;
  const rl=Math.sqrt(r2);
  marker.position.set(rx/rl*26,0,rz/rl*26);
  trailE.line.visible=trailP.line.visible=trailsOn&&!geoView;
  sight.visible=true;
  /* 速度箭头(视差) */
  arrE.visible=arrP.visible=arrowsOn;
  if(arrowsOn){
    const s=1.6/Math.max(1,distAU*0.5);
    arrE.position.set(pe.x,0,pe.z);arrP.position.set(pp.x,0,pp.z);
    arrE.setDirection(new THREE.Vector3(ve.x,0,ve.z).normalize());
    arrP.setDirection(new THREE.Vector3(vp.x,0,vp.z).normalize());
    arrE.setLength(2.6*s,0.7,0.35);arrP.setLength(2.6*s,0.7,0.35);
  }
  /* 行星名牌跟随 */
  plLbl.position.set(pp.x,PDATA[targetK].r+1.1,pp.z);
  oppLbl.position.set(pe.x,4.6,pe.z);
  /* 相机目标:日心看太阳,地心看地球 */
  if(geoView)target.copy(bodies.earth.mesh.position);else target.set(0,0,0);
  controls.target.lerp(target,1-Math.exp(-2.5*dt));
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();syncAfterStep();start();
</script>
</body>
</html>
