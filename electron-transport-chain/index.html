<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线粒体电子传递链 · 电子下坡、质子上坡动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d9784a;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b35a31;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }

  /* ===== 工具条（全站共享模式） ===== */
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  /* 计数面板 */
  #stats { position: fixed; top: 60px; right: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-icons; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.h { color: #7fd0f7; }
  #stats .v.a { color: #43d17c; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 372px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.e  { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.h  { color: #bde9ff; border-color: rgba(127,208,247,.7); }
  .chip.q  { color: #ffc188; border-color: rgba(255,159,67,.7); }
  .chip.c  { color: #d5c6f2; border-color: rgba(179,157,219,.7); }
  :root[data-theme="light"] .chip.e  { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  :root[data-theme="light"] .chip.h  { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.q  { color: #b26214; border-color: rgba(178,98,20,.7); }
  :root[data-theme="light"] .chip.c  { color: #6a4fa3; border-color: rgba(106,79,163,.7); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(217,120,74,.12); border-color: rgba(217,120,74,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(179,90,49,.10); border-color: rgba(179,90,49,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #toggles label.hot { color: #ffb08a; font-weight: 600; }
  :root[data-theme="light"] #toggles label.hot { color: #b35a31; }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="线粒体电子传递链：电子下坡，质子上坡" data-en="Mitochondrial electron transport chain: electrons fall, protons climb">线粒体电子传递链：电子下坡，质子上坡</h1>
  <div class="sub" data-zh="工厂视角：NADH 交出电子，Ⅰ/Ⅲ/Ⅳ 借势把 H⁺ 泵上膜间隙——梯度就是 ATP 合酶的燃料 · 空格播放/暂停" data-en="Factory view: NADH hands off electrons while complexes Ⅰ/Ⅲ/Ⅳ use the fall to pump H⁺ uphill — the gradient fuels ATP synthase · Space = play/pause">工厂视角：NADH 交出电子，Ⅰ/Ⅲ/Ⅳ 借势把 H⁺ 泵上膜间隙——梯度就是 ATP 合酶的燃料 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="已泵 H⁺（每 NADH）" data-en="H⁺ pumped (per NADH)">已泵 H⁺（每 NADH）</span><span class="v h" id="stH">0<small>/10</small></span>
  <span class="k" data-zh="ATP 产出" data-en="ATP made">ATP 产出</span><span class="v a" id="stA">0<small>≈2.5/NADH</small></span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip e" data-zh="e⁻ 电子（渐暗=能量下坡）" data-en="e⁻ (dimming = falling energy)">e⁻ 电子（渐暗=能量下坡）</span>
    <span class="chip h" data-zh="H⁺ 质子" data-en="H⁺ proton">H⁺ 质子</span>
    <span class="chip q" data-zh="CoQ 泛醌摆渡" data-en="CoQ shuttle">CoQ 泛醌摆渡</span>
    <span class="chip c" data-zh="cyt c 接力" data-en="cyt c relay">cyt c 接力</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglFlow" type="checkbox" checked> <span data-zh="H⁺ 流" data-en="H⁺ flow">H⁺ 流</span></label>
    <label class="hot"><input id="tglDnp" type="checkbox"> <span data-zh="DNP 解偶联彩蛋" data-en="DNP uncoupler easter egg">DNP 解偶联彩蛋</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('线粒体电子传递链 · 电子下坡、质子上坡动画',
                     'Electron Transport Chain · Electrons Fall, Protons Climb');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标，等比留白缩放） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function dot(x, y, r, color, glow) {
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  circle(x, y, r, color);
  ctx.shadowBlur = 0;
}

/* ================= 常量:膜工厂布局与时序 ================= */
const CYCLE = 14;                 // 一个周期 = 一个 NADH 被氧化
const MEM_Y = 400, MEM_H = 100;   // 膜(磷脂双分子层)条带
const IMS_Y = 385, MAT_Y = 545;   // 膜间隙面 / 基质面参考线
const C1  = { x: 560,  w: 170 };  // 复合体 Ⅰ(中心 x 与宽;给左面板留出 ~450 虚拟像素)
const C3  = { x: 880,  w: 200 };  // 复合体 Ⅲ
const C4  = { x: 1160, w: 170 };  // 复合体 Ⅳ
const ATP = { x: 1400, w: 120 };  // ATP 合酶
const Q_PARK = { x: 730, y: 470 };// CoQ 停靠点(膜内)
const CC_PARK = { x: 1030, y: 386 };// cyt c 停靠点(膜间隙面)
const COL_E1 = '#ffe9a8', COL_E2 = '#ffd166', COL_E3 = '#ff9f43', COL_E4 = '#ff7043';
const COL_H = '#7fd0f7', COL_Q = '#ff9f43', COL_QH = '#7ee2a0', COL_CC = '#b39ddb';
const COL_NADH = '#7ee2a0', COL_O2 = '#ff8a80', COL_H2O = '#4dd0e1', COL_ATP = '#43d17c';
const PUMP_I  = [0.16, 0.205, 0.25, 0.295];   // Ⅰ 泵 4 H⁺
const PUMP_III = [0.36, 0.405, 0.45, 0.495];  // Ⅲ 泵 4 H⁺
const PUMP_IV  = [0.56, 0.615];               // Ⅳ 泵 2 H⁺
const ATP_POP = [0.82, 0.89, 0.96];           // ATP 弹出时刻
const DNP_X = [712, 1027, 1292];              // DNP 孔位(复合体之间)

/* ================= 相位讲解 ================= */
const STEPS = [
  { t0: 0.00, t1: 0.14, n: 1, b: 'NADH 进场', d: 'NADH(营养物质的最终快递)扩散到复合体 Ⅰ 底面就位——它带着两个高能电子。',
    be: 'NADH arrives', de: 'NADH (the final delivery of the food chain) docks at complex Ⅰ, carrying two high-energy electrons.' },
  { t0: 0.14, t1: 0.34, n: 2, b: '复合体 Ⅰ:泵 4 H⁺', d: 'NADH 氧化为 NAD⁺,电子沿 Ⅰ 的黄素—铁硫簇逐级下坡;释放的能量把 4 个 H⁺ 从基质泵上膜间隙。',
    be: 'Complex Ⅰ pumps 4 H⁺', de: 'NADH is oxidized to NAD⁺; electrons step downhill through flavin and Fe-S clusters. The released energy pumps 4 H⁺ from matrix to intermembrane space.' },
  { t0: 0.34, t1: 0.54, n: 3, b: 'CoQ 摆渡 · Ⅲ 泵 4 H⁺', d: '泛醌 CoQ 在膜内接过电子、摇到 Ⅲ 交货;Ⅲ 借势再泵 4 个 H⁺,把电子递给膜间隙面的细胞色素 c。',
    be: 'CoQ shuttle · Ⅲ pumps 4 H⁺', de: 'Ubiquinone picks up the electrons inside the membrane and ferries them to Ⅲ, which pumps 4 more H⁺ and hands the electrons to cytochrome c on the IMS face.' },
  { t0: 0.54, t1: 0.74, n: 4, b: 'cyt c 接力 · Ⅳ 终点', d: 'cyt c 沿膜面小跑把电子送到 Ⅳ;O₂ 进来与 4 e⁻ + 4 H⁺ 化合成 2 个 H₂O——这就是「呼吸」的终点;Ⅳ 再泵 2 H⁺。',
    be: 'cyt c relay · Ⅳ finish line', de: 'cyt c dashes along the membrane to Ⅳ; O₂ enters and joins 4 e⁻ + 4 H⁺ to make 2 H₂O — the end point of respiration; Ⅳ pumps 2 more H⁺.' },
  { t0: 0.74, t1: 1.00, n: 5, b: '梯度发电', d: '10 个 H⁺ 顺梯度经 ATP 合酶流回基质,转子每 120° 弹出一个 ATP,每 NADH 约合 2.5 个。FADH₂ 从 Ⅱ 进入,少泵 4 H⁺ ≈1.5 ATP。',
    be: 'The gradient generates ATP', de: 'Ten H⁺ flow back through ATP synthase; the rotor pops one ATP per 120° — about 2.5 per NADH. (FADH₂ enters at Ⅱ with 4 fewer H⁺ ≈ 1.5 ATP.)' },
];
function stepIndex(t) {
  if (t < 0.14) return 0;
  if (t < 0.34) return 1;
  if (t < 0.54) return 2;
  if (t < 0.74) return 3;
  return 4;
}

/* ================= 状态 ---------------- */
let showLabels = true, showFlow = true, dnp = qsBool('dnp', false);

/* ================= 背景 / 膜 / 复合体 ================= */
function drawBg() {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(127,208,247,.05)'; ctx.fillRect(0, 0, W, MEM_Y);          // 膜间隙
  ctx.fillStyle = 'rgba(255,159,67,.04)'; ctx.fillRect(0, MEM_Y + MEM_H, W, H);   // 基质
  text(L('膜间隙 [H⁺] 高', 'Intermembrane space [H⁺] high'), 44, 66, 14, PAL.dim2);
  text(L('基质 [H⁺] 低', 'Matrix [H⁺] low'), 44, H - 40, 14, PAL.dim2);
  if (dnp) {   // 解偶联热浪
    const g = ctx.createLinearGradient(0, MEM_Y + MEM_H, 0, H);
    const a = 0.10 + 0.05 * Math.sin(performance.now() / 300);
    g.addColorStop(0, `rgba(255,112,67,${a})`); g.addColorStop(1, 'rgba(255,112,67,0)');
    ctx.fillStyle = g; ctx.fillRect(0, MEM_Y + MEM_H, W, H - MEM_Y - MEM_H);
  }
}
function drawMembrane() {
  // 磷脂双分子层:两排头圆 + 尾线(DNP 孔位留空)
  const gap = (x) => dnp && DNP_X.some(px => Math.abs(x - px) < 30);
  for (let x = 56; x < W - 40; x += 22) {
    if (gap(x)) continue;
    circle(x, MEM_Y + 12, 7, 'rgba(154,167,184,.55)');
    circle(x, MEM_Y + MEM_H - 12, 7, 'rgba(154,167,184,.55)');
    line(x, MEM_Y + 20, x, MEM_Y + MEM_H - 20, 'rgba(154,167,184,.28)', 2);
  }
  if (dnp) {
    for (const px of DNP_X) {
      rrect(px - 26, MEM_Y + 4, 52, MEM_H - 8, 10, 'rgba(255,112,67,.14)', 'rgba(255,112,67,.7)', 1.4);
      text('DNP', px, MEM_Y + MEM_H / 2 - 8, 11, '#ff8a65', 'center', 700);
      // 漏下来的 H⁺
      for (let i = 0; i < 3; i++) {
        const k = (t01 * 1.4 + i / 3 + px / 900) % 1;
        dot(px - 12 + i * 12, lerp(MEM_Y + 8, MEM_Y + MEM_H - 8, k), 6.5, COL_H);
      }
    }
  }
}
function complexBox(x, w, color, label, roman) {
  rrect(x - w / 2, MEM_Y - 12, w, MEM_H + 24, 16, color + '2e', color, 1.6);
  // 中央质子通道
  rrect(x - 13, MEM_Y + 6, 26, MEM_H - 12, 8, 'rgba(0,0,0,.18)', color + '88', 1);
  text(roman, x - w / 2 + 18, MEM_Y + MEM_H / 2 - 4, 21, color, 'center', 700);
  if (showLabels) text(label, x, MEM_Y - 22, 12.5, PAL.dim2, 'center');
}
function drawComplexes() {
  complexBox(C1.x, C1.w, '#7fd0f7', L('Ⅰ NADH 脱氢酶', 'Ⅰ NADH dehydrogenase'), 'Ⅰ');
  complexBox(C3.x, C3.w, '#cbaee8', L('Ⅲ 细胞色素 bc₁', 'Ⅲ cytochrome bc₁'), 'Ⅲ');
  complexBox(C4.x, C4.w, '#f48fb1', L('Ⅳ 细胞色素氧化酶', 'Ⅳ cytochrome oxidase'), 'Ⅳ');
  // 电子在此复合体内逐级下坡的小台阶
  const steps = (cx, w, col) => {
    for (let i = -1; i <= 1; i++) {
      const sx = cx + i * w * 0.22;
      line(sx - 10, 445 + i * 6, sx + 10, 445 + i * 6, col + 'aa', 2.5);
      if (i < 1) line(sx + 10, 445 + i * 6, sx + 10, 445 + (i + 1) * 6, col + '55', 1.6);
    }
  };
  steps(C1.x, C1.w, '#7fd0f7'); steps(C3.x, C3.w, '#cbaee8'); steps(C4.x, C4.w, '#f48fb1');
}

/* ================= 载体:NADH / CoQ / cyt c ================= */
function drawNad(t) {
  const dock = ss(0.02, 0.10, t);
  const bx = lerp(500, C1.x, dock), by = lerp(660, MAT_Y + 18, dock);
  const off = ss(0.14, 0.22, t);                    // 交出电子后以 NAD⁺ 离场
  const x = lerp(bx, bx - 60, off), y = lerp(by, 720, off);
  const nad = t < 0.14;
  const col = nad ? COL_NADH : PAL.dim;
  rrect(x - 34, y - 15, 68, 30, 15, col + '30', col, 1.6);
  text(nad ? 'NADH' : 'NAD⁺', x, y + 5, 13, col, 'center', 700);
}
function qState(t) {
  let x = Q_PARK.x, carrying = false;
  if (t >= 0.28 && t < 0.34) x = lerp(Q_PARK.x, C1.x + C1.w / 2 + 16, ss(0.28, 0.34, t));
  else if (t >= 0.34 && t < 0.42) { x = lerp(C1.x + C1.w / 2 + 16, C3.x - C3.w / 2 - 16, ss(0.34, 0.42, t)); carrying = t >= 0.31; }
  else if (t >= 0.42 && t < 0.52) { x = C3.x - C3.w / 2 - 16; carrying = t < 0.46; }
  else if (t >= 0.52 && t < 0.62) x = lerp(C3.x - C3.w / 2 - 16, Q_PARK.x, ss(0.52, 0.62, t));
  return { x, y: Q_PARK.y, carrying };
}
function ccState(t) {
  let x = CC_PARK.x, carrying = false;
  if (t >= 0.50 && t < 0.54) x = lerp(CC_PARK.x, C3.x + 42, ss(0.50, 0.54, t));
  else if (t >= 0.54 && t < 0.64) { x = lerp(C3.x + 42, C4.x - 62, ss(0.54, 0.64, t)); carrying = true; }
  else if (t >= 0.64 && t < 0.72) { x = C4.x - 62; carrying = t < 0.68; }
  else if (t >= 0.72 && t < 0.80) x = lerp(C4.x - 62, CC_PARK.x, ss(0.72, 0.80, t));
  return { x, y: CC_PARK.y, carrying };
}
function drawCarriers(t) {
  const q = qState(t);
  circle(q.x, q.y, 13, q.carrying ? COL_QH + 'cc' : COL_Q + 'cc', COL_Q, 1.6);
  text('Q', q.x, q.y + 4, 11, '#10141b', 'center', 700);
  if (showLabels && Math.abs(q.x - Q_PARK.x) < 4) text(L('CoQ 泛醌(膜内摆渡)', 'CoQ (shuttle in membrane)'), q.x, q.y + 30, 12, PAL.dim2, 'center');
  const c = ccState(t);
  circle(c.x, c.y, 12, c.carrying ? '#cbb3ec' : COL_CC + '99', COL_CC, 1.6);
  text('c', c.x, c.y + 4, 11, '#10141b', 'center', 700);
  if (showLabels && Math.abs(c.x - CC_PARK.x) < 4) text(L('cyt c(膜间隙面接力)', 'cyt c (relay on IMS face)'), c.x, c.y - 20, 12, PAL.dim2, 'center');
}

/* ================= 电子(两个一组,颜色随下坡渐暗) ================= */
const EKEY = [
  [0.14, 560, 575], [0.28, 560, 405], [0.34, 648, 470], [0.42, 862, 470],
  [0.50, 880, 405], [0.54, 922, 386], [0.64, 1098, 386], [0.68, 1160, 405], [0.74, 1160, 500],
];
function eCol(t) { return t < 0.28 ? COL_E1 : t < 0.50 ? COL_E2 : t < 0.68 ? COL_E3 : COL_E4; }
function drawElectrons(t) {
  if (t < 0.14 || t >= 0.74) return;
  let i = 0;
  while (i < EKEY.length - 2 && t > EKEY[i + 1][0]) i++;
  const [t0, x0, y0] = EKEY[i], [t1, x1, y1] = EKEY[i + 1];
  const k = ss(t0, t1, t);
  const x = lerp(x0, x1, k), y = lerp(y0, y1, k);
  const col = eCol(t);
  dot(x - 7, y, 6.5, col, 10); dot(x + 7, y, 6.5, col, 10);
  if (showLabels && t < 0.20) text(L('2 e⁻ 下坡', '2 e⁻ falling'), x + 26, y - 12, 12, col);
}

/* ================= 质子:泵上 + 回流 + 环境 ================= */
function hdot(x, y, r = 7.5, a = 1) {
  dot(x, y, r, COL_H + (a >= 1 ? '' : ''));
  ctx.globalAlpha = a;
  text('+', x, y + 4, 10, '#0d1117', 'center', 700);
  ctx.globalAlpha = 1;
}
function drawPumps(t) {
  if (!showFlow) return;
  const ev = [
    ...PUMP_I.map((f, i) => ({ f, x: C1.x - 30 + i * 20 })),
    ...PUMP_III.map((f, i) => ({ f, x: C3.x - 30 + i * 20 })),
    ...PUMP_IV.map((f, i) => ({ f, x: C4.x - 14 + i * 28 })),
  ];
  for (const { f, x } of ev) {
    const k = ss(f, f + 0.045, t);
    if (k <= 0 || k >= 1) continue;
    hdot(x, lerp(MAT_Y, IMS_Y, k));
  }
  // 膜间隙环境 H⁺(随泵入数量变密) + 基质稀疏 H⁺
  const pumped = [...PUMP_I, ...PUMP_III, ...PUMP_IV].filter(f => t > f + 0.04).length;
  for (let i = 0; i < 12; i++) {
    if (i >= Math.max(pumped, 3) && pumped < 10) break;
    const bx = 500 + (i * 137) % 1060, by = 100 + (i * 89) % 240;
    hdot(bx, by + 5 * Math.sin(t * Math.PI * 4 + i), 6, 0.55);
  }
  for (let i = 0; i < 4; i++) hdot(700 + i * 280, 640 + 6 * Math.sin(t * Math.PI * 4 + i * 2), 6, 0.35);
  if (showLabels && t > 0.16 && t < 0.33) text(L('H⁺ 上坡(耗能)', 'H⁺ climbing (costs energy)'), C1.x + 60, MAT_Y - 40, 12.5, COL_H, 'center', 700);
}
function drawAtpase(t) {
  const x = ATP.x;
  rrect(x - 13, MEM_Y + 4, 26, MEM_H - 8, 8, 'rgba(0,0,0,.18)', COL_ATP + '88', 1);
  const flowGate = dnp ? 0 : 1;
  // 顺梯度回流(只在 S5)
  if (showFlow) {
    for (let i = 0; i < 6; i++) {
      if (t < 0.74 || t > 0.97 || dnp) break;
      const k = ((t - 0.74) * 3 + i / 6) % 1;
      hdot(x - 6 + (i % 2) * 12, lerp(MEM_Y + 8, MEM_Y + MEM_H - 4, k), 6.5);
    }
  }
  // 转子 + 头部
  const hy = MEM_Y + MEM_H + 34;
  const ang = 6 * Math.PI * ss(0.74, 0.96, t) * flowGate;
  circle(x, hy, 40, COL_ATP + '2b', COL_ATP, 1.8);
  for (let i = 0; i < 3; i++) {
    const a = ang + i * Math.PI * 2 / 3;
    circle(x + Math.cos(a) * 26, hy + Math.sin(a) * 26, 12, COL_ATP + '99');
  }
  line(x + 46, MEM_Y + 30, x + 46, hy - 8, COL_ATP + '77', 3);   // 定子臂
  // ATP 弹出
  ATP_POP.forEach((pt, i) => {
    const k = ss(pt, pt + 0.06, t);
    if (k <= 0 || k >= 1 || dnp) return;
    const px2 = x + 50 + 60 * k, py2 = hy + 26 + 26 * k;
    dot(px2, py2, 9, COL_ATP, 12);
    text('ATP', px2, py2 + 3.5, 8.5, '#0d1117', 'center', 700);
  });
  if (showLabels) {
    text(L('ATP 合酶', 'ATP synthase'), x, hy + 66, 12.5, PAL.dim2, 'center');
    if (t > 0.76 && t < 0.95 && !dnp) text(L('H⁺ 顺梯度回流 → 转子转动', 'H⁺ flows back → rotor turns'), x - 10, MEM_Y - 22, 12.5, COL_ATP, 'center', 700);
  }
}
function drawO2(t) {
  if (t >= 0.56 && t < 0.74) {
    const k = ss(0.56, 0.66, t);
    const x = lerp(1300, C4.x + 24, k), y = lerp(210, 470, k);
    circle(x - 8, y, 10, COL_O2 + 'cc'); circle(x + 8, y, 10, COL_O2 + 'cc');
    if (showLabels && k < 1) text(L('O₂(最终电子受体)', 'O₂ (final electron acceptor)'), x + 30, y - 16, 12, COL_O2);
    const w = ss(0.66, 0.74, t);
    if (w > 0) {
      for (let i = 0; i < 2; i++) {
        const wx = lerp(C4.x + 20, C4.x + 60 + i * 42, w), wy = lerp(MAT_Y + 14, MAT_Y + 66, w);
        circle(wx, wy, 8, COL_H2O + 'cc');
        if (w > 0.6 && i === 0) text(L('2 H₂O', '2 H₂O'), wx + 34, wy + 4, 12, COL_H2O, 'center', 700);
      }
    }
    if (showLabels && t > 0.64 && t < 0.73) text(L('呼吸的终点', 'the end of respiration'), C4.x + 40, MAT_Y + 96, 12.5, COL_H2O, 'center', 700);
  }
}
function drawLabels2(t) {
  if (!showLabels) return;
  if (t > 0.30 && t < 0.52) text(L('QH₂(携 e⁻)', 'QH₂ (carrying e⁻)'), qState(t).x, qState(t).y - 24, 11.5, COL_QH, 'center', 700);
  if (dnp) {
    rrect(W / 2 - 270, MEM_Y + MEM_H + 26, 540, 44, 12, 'rgba(255,112,67,.12)', 'rgba(255,112,67,.75)', 1.4);
    text(L('DNP 解偶联:质子梯度短路,能量以热散失——ATP 停产,产热飙升(棕色脂肪产热同款原理)',
      'DNP uncouples: the gradient short-circuits, energy escapes as heat — ATP stops, heat soars (how brown fat works)'),
      W / 2, MEM_Y + MEM_H + 54, 13, '#ff8a65', 'center', 700);
  }
}

/* ================= 计数 / 主绘制 ================= */
const stH = document.getElementById('stH'), stA = document.getElementById('stA');
let lastH = -1, lastA = -1;
function updateStats(t) {
  const h = [...PUMP_I, ...PUMP_III, ...PUMP_IV].filter(f => t > f + 0.04).length;
  const a = dnp ? 0 : ATP_POP.filter(pt => t > pt).length;
  if (h !== lastH) { stH.innerHTML = h + '<small>/10</small>'; lastH = h; }
  if (a !== lastA) { stA.innerHTML = a + '<small>≈2.5/NADH</small>'; lastA = a; }
}
function draw(t) {
  drawBg();
  drawMembrane();
  drawComplexes();
  drawAtpase(t);
  drawNad(t);
  drawCarriers(t);
  drawO2(t);
  drawElectrons(t);
  drawPumps(t);
  drawLabels2(t);
}

/* ================= UI / 主循环 ================= */
let cycles = (() => { const v = parseFloat(qs.get('t')); return Number.isFinite(v) ? v : 0; })();
let playing = !qsBool('pause', false);
let speed = (() => { const v = parseFloat(qs.get('speed')); return Number.isFinite(v) ? v : 1; })();
let t01 = 0;

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglFlow = document.getElementById('tglFlow');
const tglDnp = document.getElementById('tglDnp');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglFlow.addEventListener('change', () => { showFlow = tglFlow.checked; });
tglDnp.addEventListener('change', () => { dnp = tglDnp.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

let lastStep = -1, last = performance.now();
applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (playing) cycles += dt * speed / CYCLE;
  t01 = cycles - Math.floor(cycles);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(t01);
  updateStats(t01);

  const si = stepIndex(t01);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t01 * 1000);
  elScrubVal.textContent = Math.round(t01 * 100) + '%';
}
requestAnimationFrame(frame);
</script>
