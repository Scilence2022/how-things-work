<style>

    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);

    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const $=id=>document.getElementById(id);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
$('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0e1216,46,130);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,400);
camera.position.set(-13,8.5,20);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,-1.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=90;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x141820,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(10,16,9);scene.add(key);

/* ---- 物理常数与状态 ---- */
const G=9.81,RHO=1025,H2=130,TX=60,TZ=36,FLOOR=-5.2,VSC=2.2,KBG=0.30;
const AK=80,KD=1.0,MASS=2600;
let h1=30,dRho=4.0,throttle=4.5;
let strat=true,v=0,simT=0,shipX=-8,waveE=1,greenFrac=0;
const ph={Afree:3,profile:true,bands:false,mix:false};
const qs=new URLSearchParams(location.search);
let playing=true,labelsOn=true,slowMo=false;
let simSpeed=parseFloat(qs.get('speed'));
if(!isFinite(simSpeed)||simSpeed<=0)simSpeed=1;simSpeed=clamp(simSpeed,0.1,5);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null)t0=parseInt(qs.get('t'))||0;
const gp=()=>G*dRho/RHO;
const cInt=()=>Math.sqrt(gp()*h1*H2/(h1+H2));
const yI=()=>-(1.35+h1*0.042);
const etaSc=m=>2.3*Math.tanh(m*0.085/2.3);
const cSc=()=>cInt()*VSC;
const wBg=()=>KBG*cSc();
const kI=()=>2*Math.PI/9.5;
const MK0=(Math.PI/2-0.6)/KBG;

/* ---- 水体:上层/下层/界面/表面/海床 ---- */
const upGeo=new THREE.BoxGeometry(TX,1,TZ);upGeo.translate(0,-0.5,0);
const upMat=new THREE.MeshStandardMaterial({color:0x2e6da8,transparent:true,opacity:0.26,roughness:0.4,metalness:0.05,depthWrite:false});
const loGeo=new THREE.BoxGeometry(TX,1,TZ);loGeo.translate(0,0.5,0);
const loMat=new THREE.MeshStandardMaterial({color:0x0d2b4a,transparent:true,opacity:0.55,roughness:0.5,depthWrite:false});
const lower=new THREE.Mesh(loGeo,loMat);scene.add(lower);
const floorMat=new THREE.MeshStandardMaterial({color:0x0b1015,roughness:0.95});
const floorM=new THREE.Mesh(new THREE.PlaneGeometry(TX+6,TZ+6),floorMat);
floorM.geometry.rotateX(-Math.PI/2);floorM.position.y=FLOOR-0.02;scene.add(floorM);
/* 界面(主角) */
const iGeo=new THREE.PlaneGeometry(TX,TZ,110,66);iGeo.rotateX(-Math.PI/2);
const iMat=new THREE.MeshStandardMaterial({color:0x3f8fd9,roughness:0.35,metalness:0.15,emissive:0x113a66,emissiveIntensity:0.55,transparent:true,opacity:0.95});
const inter=new THREE.Mesh(iGeo,iMat);scene.add(inter);
const iWire=new THREE.Mesh(iGeo,new THREE.MeshBasicMaterial({color:0x9cc7f0,wireframe:true,transparent:true,opacity:0.08}));
scene.add(iWire);
const iBase=iGeo.attributes.position.array.slice();
/* 海面(半透明,顶点色做明暗条带) */
const sGeo=new THREE.PlaneGeometry(TX,TZ,90,54);sGeo.rotateX(-Math.PI/2);
sGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(sGeo.attributes.position.count*3),3));
const sMat=new THREE.MeshStandardMaterial({color:0x1d4f66,roughness:0.28,metalness:0.12,vertexColors:true,transparent:true,opacity:0.55,side:THREE.DoubleSide,depthWrite:false});
scene.add(new THREE.Mesh(sGeo,sMat));
const sBase=sGeo.attributes.position.array.slice(),sCol=sGeo.attributes.color;
function bandF(x,t){return ph.bands&&waveE>0.05?Math.cos(KBG*x-wBg()*t+0.6):0;}
function surfH(x,z,t){
  let h=0.05*Math.sin(1.3*x+2.1*t)+0.04*Math.cos(1.0*z+1.6*t);
  h*=0.6+0.9*(0.5+0.5*bandF(x,t));
  return h;
}
function updTank(){
  const yi=yI();
  upMat.opacity=0.26*Math.max(waveE,0.001);
  lower.position.y=yi*waveE+FLOOR*(1-waveE);
  lower.scale.y=Math.max(0.05,-lower.position.y);
  upper.scale.y=Math.max(0.002,-yi*waveE);
  const on=waveE>0.04;
  inter.visible=on;iWire.visible=on;
  iMat.opacity=0.95*waveE;iWire.material.opacity=0.08*waveE;
}
const upper=new THREE.Mesh(upGeo,upMat);scene.add(upper);
/* 密度剖面线(右侧剖视) */
const profN=28;
const profGeo=new THREE.BufferGeometry();
profGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(profN*3),3));
const prof=new THREE.Line(profGeo,new THREE.LineBasicMaterial({color:0xffd43b,transparent:true,opacity:0.9}));
prof.frustumCulled=false;scene.add(prof);
function updProfile(){
  const p=profGeo.attributes.position,yi=yI();
  for(let i=0;i<profN;i++){
    const f=i/(profN-1),y=0.1+(FLOOR-0.1)*f;
    const rho=y>yi?RHO-dRho:RHO;
    p.setXYZ(i,28.5+(rho-1018)/10*1.6,y,-17.6);
  }
  p.needsUpdate=true;
}

/* ---- 界面波场(米制) ---- */
function etaM(x,z,t){
  if(waveE<0.01)return 0;
  let h=ph.Afree*Math.sin(KBG*x-wBg()*t+0.6);
  if(v>0.25){
    const r=Math.min(v/cInt(),0.99),A=16*r*r,dxs=x-shipX;
    if(dxs<=0)h+=A*Math.exp(dxs/20)*sm(-dxs/2.5)*Math.cos(kI()*dxs)*Math.exp(-z*z/72);
    else h-=A*0.3*Math.exp(-dxs/2.5);
  }
  return h*waveE;
}
function updInterface(){
  const p=iGeo.attributes.position,yi=yI(),t=simT;
  for(let i=0;i<p.count;i++){
    p.setY(i,yi+etaSc(etaM(iBase[i*3],iBase[i*3+2],t)));
  }

}
function updSurface(){
  const p=sGeo.attributes.position,t=simT;
  for(let i=0;i<p.count;i++){
    const x=sBase[i*3],z=sBase[i*3+2];
    p.setY(i,surfH(x,z,t));
    const b=bandF(x,t),f=0.8+0.45*(0.5+0.5*b)+0.05*Math.sin(x*0.8+z*0.5);
    sCol.setXYZ(i,f,f,f);
  }
  p.needsUpdate=true;sCol.needsUpdate=true;
}

const tmpM=new THREE.Matrix4(),tmpV=new THREE.Vector3(),tmpQ=new THREE.Quaternion().identity(),tmpS=new THREE.Vector3(),tmpC=new THREE.Color();
function updTracers(dt5){
  const yi=yI(),t=simT;
  const act=waveE*(0.18+0.7*Math.min(1,ph.Afree/12+(strat&&v>0.05?Math.pow(Math.min(v/cInt(),0.99),2)*1.6:0)));
  for(let i=0;i<NP;i++){
    const d=trD[i];
    d.x+=(d.up?1:-1)*act*VSC*dt5*0.35;
    if(d.x>29)d.x=-29;else if(d.x<-29)d.x=29;
    const disp=etaSc(etaM(d.x,d.z,t))*(d.up?(1-d.yf)*0.95:(1-d.yf)*0.5);
    const y=d.up?yi-yi*d.yf:yi+(FLOOR-yi)*d.yf;
    tmpM.makeTranslation(d.x,y+disp,d.z);
    tr.setMatrixAt(i,tmpM);
  }
  tr.instanceMatrix.needsUpdate=true;
}
function updNutrients(dt5){
  const yi=yI(),t=simT;let nUp=0;
  for(let i=0;i<NN;i++){
    const d=nuD[i];
    if(ph.mix&&strat&&waveE>0.3&&!d.up&&Math.random()<dt5*0.5*Math.min(1,ph.Afree/9)){d.up=true;d.yf=0.2+Math.random()*0.65;}
    else if(d.up&&!ph.mix&&Math.random()<dt5*0.15){d.up=false;d.yf=0.08+Math.random()*0.6;}
    d.x+=Math.sin(simT*0.3+i)*dt5*0.12;
    if(d.x>29)d.x=-29;else if(d.x<-29)d.x=29;
    const disp=etaSc(etaM(d.x,d.z,t))*(d.up?(1-d.yf)*0.7:(1-d.yf)*0.4);
    const y=d.up?yi-yi*d.yf:yi+(FLOOR-yi)*d.yf;
    tmpM.makeTranslation(d.x,y+disp,d.z);
    nu.setMatrixAt(i,tmpM);
    nu.setColorAt(i,tmpC.setHex(d.up?0x8fe3a8:0x50705a));
    if(d.up)nUp++;
  }
  nu.instanceMatrix.needsUpdate=true;
  if(nu.instanceColor)nu.instanceColor.needsUpdate=true;
  greenFrac=nUp/NN;
}
function updFoam(dt){
  spawnAcc+=dt*v;
  if(v>1.3){while(spawnAcc>1.4){spawnAcc-=1.4;const d=foamD[foamI%NF];foamI++;d.x=shipX-1.7-Math.random()*0.9;d.z=(Math.random()-0.5)*1.1;d.age=0.0001;}}
  else spawnAcc=Math.min(spawnAcc,1.4);
  for(let i=0;i<NF;i++){
    const d=foamD[i];
    if(d.age>0){
      d.age+=dt*0.5;d.x-=dt*0.5;
      if(d.age>=1){d.age=0;tmpM.makeScale(0,0,0);}
      else{
        const s=0.35+d.age;
        tmpM.compose(tmpV.set(d.x,surfH(d.x,d.z,simT)+0.035,d.z),tmpQ,tmpS.set(s,1,s));
      }
    }else tmpM.makeScale(0,0,0);
    foam.setMatrixAt(i,tmpM);
  }
  foam.instanceMatrix.needsUpdate=true;
}
function updBreak(){
  let idx=0;const on=ph.mix&&waveE>0.2;
  for(let n=0;n<3;n++){
    const base=MK0+wBg()*simT/KBG+n*(2*Math.PI/KBG);
    const xc=((base+30)%60+60)%60-30;
    for(let j=0;j<8;j++){
      const z=-13+j*(26/7),s=on?0.7+0.3*Math.sin(simT*3+j*1.3):0;
      tmpM.compose(tmpV.set(xc,yI()+etaSc(etaM(xc,z,simT))+0.07,z),tmpQ,tmpS.set(s,1,s));
      bk.setMatrixAt(idx++,tmpM);
    }
  }
  bk.instanceMatrix.needsUpdate=true;
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'分层水柱:轻浮上、重沉下,恢复力 g′≈0.04 m/s²',en:'Stratified column: light floats, heavy sinks; restoring g′≈0.04 m/s²',

 {zh:'对照 · 均匀水:同一油门,动力全变船速',en:'Control · uniform water: same throttle, all power becomes speed',
  act(){setStrat(false);setThr(4.5);ph.profile=false;ph.bands=false;ph.mix=false;ph.Afree=0;}},
 {zh:'死水!同一油门换成分层水:船被当场黏住',en:'Dead water! Same throttle, stratified: the hull sticks on the spot',
  act(){setStrat(true);setThr(4.5);ph.profile=false;ph.bands=false;ph.mix=false;ph.Afree=2;}},
 {zh:'内波有多慢?c=√(g′h₁h₂/(h₁+h₂)) — 拖 Δρ、h₁ 验证',en:'How slow? c=√(g′h₁h₂/(h₁+h₂)) — drag Δρ and h₁ to verify',

 {zh:'卫星之眼:内波调制表层流→明暗条带',en:'Satellite eye: internal waves stripe the surface',
  act(){setStrat(true);setThr(1.5);ph.profile=false;ph.bands=true;ph.mix=false;ph.Afree=12;}},
 {zh:'破碎与营养泵:垂向混合喂饱透光层',en:'Breaking & nutrient pump: mixing feeds the sunlit layer',
  act(){setStrat(true);setThr(2.5);ph.profile=false;ph.bands=false;ph.mix=true;ph.Afree=10;}},

let activeStep=0;
function buildSteps(){
  const el=$('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const c=strat?cInt():0;
  const r=strat&&v>0.05?Math.min(v/c,0.99):0;
  const A=ph.Afree*waveE+(strat?16*r*r*waveE:0);
  const P=Ri*v+(ph.mix&&strat?120*ph.Afree*waveE:0);
  const sv=$('stV');
  sv.innerHTML=v.toFixed(2)+'<small> m/s</small>';
  sv.className='v '+((strat&&throttle>2&&v<0.6*throttle)?'warn':'');
  $('stA').innerHTML=A.toFixed(1)+'<small> m</small>';
  $('stC').innerHTML=strat?('≈'+c.toFixed(2)+'<small> m/s</small>'):'—';
  const sp=$('stP');
  sp.innerHTML=Math.round(P)+'<small> W</small>';
  sp.className='v '+(P>200?'warn':'');
}

const PAL={
 dark:{bg:0x0e1216,surf:0x1d4f66,up:0x2e6da8,lo:0x0d2b4a,iface:0x3f8fd9,emi:0x113a66,floor:0x0b1015,wire:0x9cc7f0},
 light:{bg:0xe8ecf0,surf:0xa9cddd,up:0x9cc4e4,lo:0x48799f,iface:0x3a7cc0,emi:0x1c4a77,floor:0xcfd8de,wire:0xdff0fb}
};
function updWaterColors(){
  upMat.color.setHex(PAL[THEME].up).lerp(GREENC,gfSafe()*0.55);
}
function gfSafe(){return clamp(greenFrac,0,1);}
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  $('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const P=PAL[THEME];
  scene.background=new THREE.Color(P.bg);

  sMat.color.setHex(P.surf);loMat.color.setHex(P.lo);
  iMat.color.setHex(P.iface);iMat.emissive.setHex(P.emi);
  iWire.material.color.setHex(P.wire);floorMat.color.setHex(P.floor);
  updWaterColors();

function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,Ri=0,acc3=0,acc5=0,accS=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1)*simSpeed;
  simT+=dts;
  waveE+=((strat?1:0)-waveE)*Math.min(1,dts*1.6);
  /* 船的动力学:推力-均匀阻力-内波死水阻力 */
  const c=cInt(),T=AK*throttle*throttle;
  let R=AK*v*v;Ri=0;
  if(strat&&v>0.05){const r=Math.min(v/c,0.985);Ri=AK*v*v*KD*Math.pow(r,4)/Math.pow(1-r*r,2);}
  v=Math.max(0,v+(T-R-Ri)/MASS*dts);
  shipX+=v*VSC*dts;if(shipX>32)shipX=-32;
  ship.position.x=shipX;
  const rN=strat?Math.min(1,Ri/(T||1)):0;
  ship.position.y=-0.09*rN+surfH(shipX,0,simT)*0.4;
  const sl=(etaM(shipX+1.2,0,simT)-etaM(shipX-1.2,0,simT))/2.4;
  ship.rotation.z=clamp(sl*0.8*waveE+0.015*Math.min(v,6),-0.32,0.32);
  updTank();
  /* 波面(节流) */
  acc3+=dt;
  if(acc3>0.033){acc3=0;updInterface();updSurface();}
  /* 粒子与泡沫(节流) */
  acc5+=dt;
  if(acc5>0.05){const d5=acc5;acc5=0;updTracers(d5);updNutrients(d5);updFoam(d5);updBreak();updWaterColors();}
  /* 波峰标线 */
  const mv=(activeStep===1||activeStep===4)&&strat;
  mk.visible=mv;
  if(mv){
    const x=((cSc()*simT/KBG*KBG+MK0)%60+60)%60-30;
    const p=mkGeo.attributes.position;
    for(let i=0;i<14;i++){
      const z=-15+i*(30/13);
      p.setXYZ(i,x,yI()+etaSc(etaM(x,z,simT))+0.06,z);
    }
    p.needsUpdate=true;
    lblMark.position.set(x,yI()+1.6,-8);
  }
  /* 读数节流 */
  accS+=dt;
  if(accS>0.15){accS=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.target.set(shipX*0.3,-1.6,0);
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
$('tglLabels').checked=labelsOn;
applyTheme();applyLang();
updProfile();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
