<title>应激反应与肾上腺素 · 快慢双线总动员</title>
<style>

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}

    transition:border-color .15s,color .15s,background .15s}

  :root[data-theme="light"] .abtn.on{border-color:rgba(217,72,15,.55);background:rgba(217,72,15,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}

  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

  <div class="sub" data-zh="威胁被杏仁核识别→下丘脑双线并发:交感神经直连(秒级,突触去甲肾上腺素)+肾上腺髓质倾泻肾上腺素入血(几十秒,全身广播)→心率心缩力↑、支气管扩张、糖原分解血糖↑、瞳孔散大、骨骼肌血流↑而肠道肾脏血流让位→HPA 轴再补一记慢刀:皮质醇约半小时到位,升糖、动员脂肪、抑制免疫,维持战备→威胁解除后副交感(迷走)刹车回摆 · 拖动旋转 / 空格运行/暂停" data-en="The amygdala flags a threat → the hypothalamus fires two lines at once: sympathetic nerves wired straight to organs (seconds, norepinephrine at synapses) plus the adrenal medulla dumping adrenaline into blood (tens of seconds, a body-wide broadcast) → heart rate &amp; contractility up, bronchi dilate, glycogen breakdown raises blood glucose, pupils widen, muscle perfusion up while gut and kidney yield theirs → the HPA axis adds a slow blade: cortisol arrives in ~30 min, sustaining readiness, mobilizing fat, suppressing immunity → once the threat lifts, the vagal brake swings back · drag to orbit / Space = run/pause">威胁被杏仁核识别→下丘脑双线并发:交感神经直连(秒级,突触去甲肾上腺素)+肾上腺髓质倾泻肾上腺素入血(几十秒,全身广播)→心率心缩力↑、支气管扩张、糖原分解血糖↑、瞳孔散大、骨骼肌血流↑而肠道肾脏血流让位→HPA 轴再补一记慢刀:皮质醇约半小时到位,升糖、动员脂肪、抑制免疫,维持战备→威胁解除后副交感(迷走)刹车回摆 · 拖动旋转 / 空格运行/暂停</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x12100c,14,40);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(0.4,3.1,11.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.8,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=24;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xe8dcc8,0x14100a,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:半透明人形剪影 + 内部器官 + 威胁源 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c1812,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;scene.add(ground);
/* 人形:半透明外壳(后画,套住器官) */
const bodyM=new THREE.MeshStandardMaterial({color:0x8fb4dd,roughness:0.35,transparent:true,
  opacity:0.14,depthWrite:false});
const head=new THREE.Mesh(new THREE.SphereGeometry(0.42,20,16),bodyM);
head.position.set(0,4.55,0);scene.add(head);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.2,0.4,10),bodyM);
neck.position.set(0,4.1,0);scene.add(neck);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.6,1.55,6,14),bodyM);
torso.position.set(0,3.05,0);scene.add(torso);
function limb(len,r,x,y,rz){
  const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,4,10),bodyM);
  m.position.set(x,y,0);m.rotation.z=rz;scene.add(m);return m;
}
limb(1.35,0.17,-0.85,3.0,0.2);limb(1.35,0.17,0.85,3.0,-0.2);
limb(1.7,0.24,-0.35,1.05,0.03);limb(1.7,0.24,0.35,1.05,-0.03);
/* 眼睛(瞳孔散大用) */
const eyeM=new THREE.MeshStandardMaterial({color:0x14161c,roughness:0.3});
const eyes=[];
for(const s of [-1,1]){
  const e=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),eyeM);
  e.position.set(0.15*s,4.6,0.36);scene.add(e);eyes.push(e);
}
/* 脑:杏仁核/下丘脑/垂体 */
const brainM=new THREE.MeshStandardMaterial({color:0xd8c2d8,roughness:0.55});
const brain=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12),brainM);
brain.scale.set(1,0.85,1);brain.position.set(0,4.6,-0.02);scene.add(brain);
const amyM=new THREE.MeshStandardMaterial({color:0x8c3038,roughness:0.4,emissive:0xff4d4d,emissiveIntensity:0});
const amy=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),amyM);
amy.position.set(0.1,4.47,0.16);scene.add(amy);
const hypM=new THREE.MeshStandardMaterial({color:0xc2903a,roughness:0.4,emissive:0xffa938,emissiveIntensity:0.15});
const hyp=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),hypM);
hyp.position.set(0,4.34,0.12);scene.add(hyp);
const pit=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),hypM.clone());
pit.position.set(0,4.22,0.1);scene.add(pit);
/* 心脏 */
const heartM=new THREE.MeshStandardMaterial({color:0xa03440,roughness:0.4,emissive:0xff5a5a,emissiveIntensity:0.2});
const heart=new THREE.Mesh(new THREE.SphereGeometry(0.3,14,12),heartM);
heart.scale.set(1,1.2,0.9);heart.position.set(-0.16,3.5,0.08);scene.add(heart);
/* 肺(呼吸起伏) */
const lungM=new THREE.MeshStandardMaterial({color:0xc9a7a7,roughness:0.6,transparent:true,opacity:0.9});
const lungs=[];
for(const s of [-1,1]){
  const l=new THREE.Mesh(new THREE.SphereGeometry(0.4,14,12),lungM);
  l.scale.set(0.72,1.35,0.75);l.position.set(0.52*s,3.55,-0.05);scene.add(l);lungs.push(l);
}
/* 肝(糖原分解) */
const liverM=new THREE.MeshStandardMaterial({color:0x7a4a30,roughness:0.5,emissive:0xff922b,emissiveIntensity:0});
const liver=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.42,0.5),liverM);
liver.position.set(-0.42,2.66,0.1);scene.add(liver);
/* 肠(血流让位,变暗) */
const gutM=new THREE.MeshStandardMaterial({color:0xb8806e,roughness:0.6});
const gut=new THREE.Mesh(new THREE.TorusGeometry(0.32,0.13,10,24),gutM);
gut.position.set(0.18,2.32,0.14);gut.rotation.x=1.2;scene.add(gut);
/* 肾 + 肾上腺(髓质倾泻点) */
const kidM=new THREE.MeshStandardMaterial({color:0x8c4438,roughness:0.55});
const adrM=new THREE.MeshStandardMaterial({color:0xd8b04a,roughness:0.4,emissive:0xffa938,emissiveIntensity:0});
const kidneys=[];
for(const s of [-1,1]){
  const k=new THREE.Mesh(new THREE.SphereGeometry(0.18,12,10),kidM);
  k.scale.set(0.7,1.15,0.8);k.position.set(0.38*s,2.28,-0.12);scene.add(k);kidneys.push(k);
  const a=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.12,10),adrM);
  a.position.set(0.38*s,2.52,-0.1);a.rotation.x=Math.PI;scene.add(a);
}
/* 骨骼肌高亮(股四头肌) */
const musM=new THREE.MeshStandardMaterial({color:0x9c5148,roughness:0.55,emissive:0xff6b6b,emissiveIntensity:0});
for(const s of [-1,1]){
  const m=new THREE.Mesh(new THREE.CapsuleGeometry(0.26,0.85,4,10),musM);
  m.position.set(0.35*s,1.45,0.06);scene.add(m);
}
/* 威胁源:暗色尖刺剪影+红眼 */
const threatG=new THREE.Group();

/* 粒子池:肾上腺素(橙)/皮质醇(黄)/交感电脉冲(白) */
function pool(n,r,col){
  const arr=[];
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,8,8),new THREE.MeshBasicMaterial({color:col}));
    m.visible=false;scene.add(m);arr.push({m,on:false,t:0,stage:0});
  }
  return arr;
}
const epiP=pool(40,0.05,0xffa938);
const corP=pool(18,0.055,0xffe066);
const nrvP=pool(12,0.04,0xfff5da);

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const drive=clamp(0.22*symp+0.78*epi01,0,1);
  const hr=Math.round(68+intensity*9*drive);
  const hEl=document.getElementById('stHR');
  hEl.innerHTML=hr+'<small> bpm</small>';
  hEl.className='v '+(hr>120?'warn':hr<85?'ok':'');
  const glu=5.0+0.06*intensity*(0.5*symp+2.2*epi01)+1.6*c2;
  const gEl=document.getElementById('stGlu');
  gEl.innerHTML=glu.toFixed(1)+'<small> mmol/L</small>';
  gEl.className='v '+(glu>7?'warn':'');
  const br=100+intensity*(0.8*symp+1.2*epi01);
  const bEl=document.getElementById('stBr');
  bEl.innerHTML=br.toFixed(0)+'<small> %</small>';
  bEl.className='v '+(br>110?'warn':'');
  const cor=Math.round(240+480*c2);
  const cEl=document.getElementById('stCor');
  cEl.innerHTML=cor+'<small> nmol/L</small>';
  cEl.className='v '+(cor>500?'warn':cor<300?'ok':'');
}

document.getElementById('bThreat').addEventListener('click',()=>setPhase('threat'));
document.getElementById('bCalm').addEventListener('click',()=>setPhase('calm'));

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x12100c:0xece7de);
  scene.fog.color.setHex(dark?0x12100c:0xece7de);
  groundM.color.setHex(dark?0x1c1812:0xd8d0c0);
  bodyM.color.setHex(dark?0x8fb4dd:0x5b7fa8);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function runParticles(arr,dt){
  arr.forEach(p=>{
    if(!p.on)return;
    p.t+=dt*p.speed;
    if(p.t>=1){p.on=false;p.m.visible=false;return;}
    p.m.position.copy(p.curve.getPoint(p.t));
  });
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 应激动力学(时间压缩 ×60,量级按生理数据)── */
  const on=phase==='threat'?1:0;
  symp+=(on-symp)*(1-Math.exp(-dts*3));
  epi01+=(on-epi01)*(1-Math.exp(-dts*(on?1.2:0.35)));
  c1+=(on-c1)*(1-Math.exp(-dts*0.07));
  c2+=(c1-c2)*(1-Math.exp(-dts*0.07));
  const drive=clamp(0.22*symp+0.78*epi01,0,1);
  const hr=68+intensity*9*drive;
  /* 可视化:心跳/呼吸 */
  beat+=dts*hr/60*2*Math.PI;
  const hb=Math.max(0,Math.sin(beat));
  heart.scale.set(1+0.13*hb,1.2+0.16*hb,0.9+0.12*hb);
  heartM.emissiveIntensity=0.2+0.9*drive;
  breath+=dts*(12+intensity*1.6*Math.max(symp,epi01))/60*2*Math.PI;
  const brs=1+0.09*Math.sin(breath);
  lungs.forEach(l=>l.scale.set(0.72*brs,1.35*brs,0.75*brs));
  amyM.emissiveIntensity=on?1.0:0;
  hypM.emissiveIntensity=0.15+1.1*Math.max(symp,c2*0.8);
  adrM.emissiveIntensity=0.1+2.2*epi01;
  liverM.emissiveIntensity=1.4*epi01;
  musM.emissiveIntensity=0.9*epi01+0.3*symp;
  const con=clamp(0.7*Math.max(symp,epi01),0,0.8);
  gutM.color.setRGB(0.72*(1-con*0.6),0.5*(1-con*0.6),0.43*(1-con*0.6));
  kidneys.forEach(k=>k.material=kidM);
  kidM.color.setRGB(0.55*(1-con*0.55),0.27*(1-con*0.55),0.22*(1-con*0.55));
  eyes.forEach(e=>e.scale.setScalar(1+0.7*drive));
  threatG.scale.setScalar(1+0.03*Math.sin(simT*2.2));
  /* ── 粒子 ── */
  if(flowOn){
    epiAcc+=dts*(0.6+14*clamp(epi01,0,1)*clamp(intensity/10,0.2,1));
    while(epiAcc>=1){epiAcc-=1;
      const p=epiP.find(x=>!x.on);
      if(p){p.on=true;p.t=0;p.stage=0;p.speed=0.55;
        p.curve=curAdr[Math.random()<0.5?0:1];p.m.visible=true;}}
    corAcc+=dts*((on&&c2<0.95)?1.1:(!on&&c2>0.1?0.35:0));
    while(corAcc>=1){corAcc-=1;
      const p=corP.find(x=>!x.on);
      if(p){p.on=true;p.t=0;p.speed=0.09;p.curve=curHpa;p.m.visible=true;}}
    nrvAcc+=dts*symp*7;
    while(nrvAcc>=1){nrvAcc-=1;
      const p=nrvP.find(x=>!x.on);
      if(p){p.on=true;p.t=0;p.speed=2.6;p.curve=curNrv;p.m.visible=true;}}
  }
  epiP.forEach(p=>{
    if(!p.on)return;
    p.t+=dts*p.speed;
    if(p.t>=1){
      if(p.stage===0){p.stage=1;p.t=0;p.curve=curMus[Math.random()<0.5?0:1];}
      else{p.on=false;p.m.visible=false;return;}
    }
    p.m.position.copy(p.curve.getPoint(p.t));
  });
  runParticles(corP,dts);
  runParticles(nrvP,dts);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on2=labelsOn&&r.vis();
    r.o.visible=on2&&r.text()!=='';
    if(on2)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
setInt(6);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
