<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

    transition:border-color .15s,color .15s,transform .15s}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);

    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);

    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);border-top:1px dashed var(--panel-border);padding-top:7px}
  #formula b{color:var(--text3);font-weight:600}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;

  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="指纹识别 · 脊谷成像与细节点匹配" data-en="Fingerprint Sensors · Ridge Imaging & Minutiae Matching">指纹识别 · 脊谷成像与细节点匹配</h1>
  <div class="sub" data-zh="指纹是周期 ~0.5mm 的「凸脊-凹谷」花纹:电容阵列测每个触点与脊/谷的距离差拼出灰度像(脊亮谷暗);湿手=水把脊谷桥接,电容差被抹平;超声脉冲穿透表皮在真皮层回波成像,脏污湿手都挡不住;光学靠全反射在脊处漏光;识别只存细节点(端点/分叉)不存图片,分数过阈值才解锁 · 拖动旋转 / 空格运行/暂停" data-en="A fingerprint is a ~0.5 mm pattern of ridges and valleys: a capacitive array reads each cell's ridge/valley distance into a grayscale image (ridge bright, valley dark); a wet finger bridges ridges and valleys, erasing the contrast; ultrasound pulses penetrate to the dermis and echo back, shrugging off water and grime; optics frustrate total internal reflection at ridges; matching stores minutiae (endings/bifurcations), never the picture — score beats threshold or it stays locked · drag to orbit / Space = run/pause">指纹是周期 ~0.5mm 的「凸脊-凹谷」花纹:电容阵列测每个触点与脊/谷的距离差拼出灰度像(脊亮谷暗);湿手=水把脊谷桥接,电容差被抹平;超声脉冲穿透表皮在真皮层回波成像,脏污湿手都挡不住;光学靠全反射在脊处漏光;识别只存细节点(端点/分叉)不存图片,分数过阈值才解锁 · 拖动旋转 / 空格运行/暂停</div>
</div>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <div class="row"><label data-zh="按压力度" data-en="Press force">按压力度</label>
    <input id="sF" type="range" min="10" max="100" step="1" value="85"><span class="val" id="sFVal">0.85</span></div>
  <div class="row"><label data-zh="匹配阈值" data-en="Threshold">匹配阈值</label>

    <div id="toggles">
      <label><input id="tglWet" type="checkbox"> <span data-zh="湿手" data-en="Wet finger">湿手</span></label>
      <label><input id="tglDirt" type="checkbox"> <span data-zh="脏污" data-en="Dirty sensor">脏污</span></label>
      <label><input id="tglMin" type="checkbox" checked> <span data-zh="细节点" data-en="Minutiae">细节点</span></label>
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../touch-screen/" data-zh="电容触摸屏:同一套电容感知" data-en="Touch screen: the same capacitive sense">电容触摸屏</a>
    <a href="../camera-sensor/" data-zh="CMOS 传感器:光学成像的近亲" data-en="CMOS sensor: optical imaging cousin">CMOS 传感器</a>
    <a href="../convolutional-network/" data-zh="卷积网络:特征提取的另一条路" data-en="Conv nets: another way to extract features">卷积网络</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
/* 模板公共状态:先于一切使用点声明 */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let speedK=clamp(parseFloat(qs.get('speed'))||1,0.2,3);
let simT=0,notifyT=0,notifyZ='',notifyE='';

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,70);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,120);
camera.position.set(-1.2,4.4,9.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.6,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.62));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,8,7);scene.add(key);

/* ---- 材质(主题可变) ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const glassM=new THREE.MeshStandardMaterial({color:0x8fb3cc,roughness:0.08,metalness:0.1,transparent:true,opacity:0.38});
const frameM=new THREE.MeshStandardMaterial({color:0x2e3a47,roughness:0.5,metalness:0.5});
const skinM=new THREE.MeshStandardMaterial({color:0xc98d6b,roughness:0.75});
const dermisM=new THREE.MeshStandardMaterial({color:0xf0b795,roughness:0.7,emissive:0x7a4426,emissiveIntensity:0.18});
const waterM=new THREE.MeshStandardMaterial({color:0x4dabf7,roughness:0.15,transparent:true,opacity:0.55});
const dirtM=new THREE.MeshStandardMaterial({color:0x6e5238,roughness:0.9,transparent:true,opacity:0.6});
const nailM=new THREE.MeshStandardMaterial({color:0xe8d9c8,roughness:0.3});
const elecOnM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xffa000,emissiveIntensity:1.1,roughness:0.3});
const usM=new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.85});

/* ================= 指纹图案(确定性) =================
 * 相位场 p(u,v)=n·θ+f·r+φ,脊=sin(p)>0;周期≈0.5mm(图示为 4mm 局部放大)
 * 模板只存细节点(端点/分叉)坐标,不存图像 */
function mulberry(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
const FINGERS=[
  {cu:0.14,cv:-0.10,n:2.3,f:13.0,ph:0.4},
  {cu:-0.18,cv:0.12,n:-2.1,f:15.5,ph:2.1},
];
let fingerIdx=0;
function ridgeFn(u,v){
  const F=FINGERS[fingerIdx];
  const dx=u-F.cu,dy=v-F.cv;
  return Math.sin(F.n*Math.atan2(dy,dx)+F.f*Math.hypot(dx,dy)+F.ph);
}
/* 细节点:由种子确定性生成(端点/分叉交替) */
const minutiae=[];
{const rnd=mulberry(20240926);
 for(let k=0;k<12;k++)minutiae.push({u:rnd()*1.7-0.85,v:rnd()*1.7-0.85,type:k%2});}

/* ================= 感测状态 ================= */
let mode='cap';                       // cap | ult | opt
let wet=false,dirt=false;
let pressed=true,forceT=0.85,F=0.85;  // 目标/当前按压力
let reveal=0,scanned=false;
let contrast=0,score=0,verdict=null;  // verdict: true=解锁 false=拒绝 null=未判定
let thr=0.60;
/* 三种模式的读数:输入 [-1,1]² 与状态,输出 0..1 灰度 */
function readCell(u,v){
  const rid=ridgeFn(u,v);
  let g;
  if(mode==='cap'){
    g=0.5+0.45*rid*F*(1-0.85*(wet?1:0))*(1-0.45*(dirt?1:0));   // 脊近→C大→亮;水桥接抹平差
  }else if(mode==='ult'){
    g=0.5+0.45*rid*F;                                          // 真皮层回波:湿污免疫
  }else{
    g=0.5-0.45*rid*F*(1-0.5*(wet?1:0))*(1-0.55*(dirt?1:0));    // 全反射:脊接触漏光→暗
  }
  return clamp(g,0,1);
}

/* ================= 场景搭建 ================= */
const ground=new THREE.Mesh(new THREE.BoxGeometry(24,0.24,14),groundM);
ground.position.y=-0.12;scene.add(ground);
/* 传感器玻璃板 + 边框 */
const slab=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.16,2.4),glassM);
slab.position.set(0,0.10,0);scene.add(slab);
const slabFrame=new THREE.Mesh(new THREE.BoxGeometry(3.7,0.10,2.7),frameM);
slabFrame.position.set(0,0.05,0);scene.add(slabFrame);
/* 手指组:胶囊指向 -x,剖面 ribbon 在 +z 侧 */
const finger=new THREE.Group();scene.add(finger);
const capsule=new THREE.Mesh(new THREE.CapsuleGeometry(0.46,1.5,10,20),skinM);
capsule.rotation.z=Math.PI/2;finger.add(capsule);
const nail=new THREE.Mesh(new THREE.SphereGeometry(0.462,16,12,0,Math.PI),nailM);
nail.rotation.z=Math.PI/2;nail.position.x=-0.98;nail.scale.set(0.6,1,1);finger.add(nail);
/* 电极阵列提示:玻璃下的亮格随读数闪烁 */
const NEL=20;
const elecs=new THREE.InstancedMesh(new THREE.BoxGeometry(0.09,0.02,0.09),elecOnM,NEL);
scene.add(elecs);
const m4=new THREE.Matrix4(),q0=new THREE.Quaternion(),s1=new THREE.Vector3(1,1,1);
const rndE=mulberry(7);
const elecU=[],elecV=[],elecPh=[];
for(let i=0;i<NEL;i++){elecU.push(rndE()*2.6-1.3);elecV.push(rndE()*1.6-0.8);elecPh.push(rndE()*6.28);}
function updateElecs(){
  for(let i=0;i<NEL;i++){
    const g=readCell(elecU[i],elecV[i]);
    const s=reveal>0.05?0.5+0.5*g:0.25;
    m4.compose(new THREE.Vector3(elecU[i],0.045,elecV[i]),q0,s1.clone().multiplyScalar(s));
    elecs.setMatrixAt(i,m4);
    elecs.setColorAt(i,new THREE.Color().setHSL(0.08,0.9,0.25+0.45*g));
  }
  elecs.instanceMatrix.needsUpdate=true;
  if(elecs.instanceColor)elecs.instanceColor.needsUpdate=true;
}
/* 剖面 ribbon:x∈[-1.1,1.1],上皮底面带脊谷(朝下),水/脏污填充谷底 */
const NX=96;
function makeRibbon(topFn,botFn,mat){
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array((NX+1)*2*3),idx=[];
  for(let i=0;i<=NX;i++){
    const x=-1.15+2.3*i/NX;
    pos[i*6]=x;pos[i*6+1]=0;pos[i*6+2]=0;
    pos[i*6+3]=x;pos[i*6+4]=0;pos[i*6+5]=0;
    if(i<NX){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setIndex(idx);geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,mat);
  mesh.userData.update=()=>{
    const p=geo.attributes.position;
    for(let i=0;i<=NX;i++){
      const x=-1.15+2.3*i/NX;
      p.setXYZ(i*2,x,topFn(x),0);
      p.setXYZ(i*2+1,x,botFn(x),0);
    }
    p.needsUpdate=true;geo.computeVertexNormals();
  };
  return mesh;
}
const ridgeH=x=>0.05*(0.5+0.5*Math.sin(13.0*x+0.4))*(F>0.15?1:0.35);  // 脊高随按压变浅
/* 剖面挂在手指前方 z=0.5:上皮带底缘带脊谷(朝下),真皮亮带,水/脏污填充谷底 */
const epi=makeRibbon(x=>-0.06,x=>-0.47-ridgeH(x),skinM);
const der=makeRibbon(x=>-0.20,x=>-0.25,dermisM);                      // 真皮层亮带
const wat=makeRibbon(x=>-0.535,x=>-0.47-ridgeH(x)-0.012,waterM);
const drt=makeRibbon(x=>-0.545,x=>-0.585,dirtM);
epi.userData.update();der.userData.update();wat.userData.update();drt.userData.update();
epi.position.z=der.position.z=wat.position.z=drt.position.z=0.5;
finger.add(epi,der,wat,drt);
finger.position.set(0.1,0,0);
wat.visible=false;drt.visible=false;
/* 超声波纹:三圈扩散弧(各自独立材质,透明度随扩散衰减) */
const usRings=[];
for(let k=0;k<3;k++){
  const r=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(
    new THREE.Shape().absarc(0,0,1,0,Math.PI*2).getPoints(48).map(p=>new THREE.Vector3(p.x,p.y,0))),usM.clone());
  r.position.set(0.1,0.22,0.2);r.rotation.x=-Math.PI/2.6;
  scene.add(r);usRings.push(r);
}
/* 指纹图像画布 → 贴到右侧面板 */
const IMG=28,PX=8;
/* 逐格读取次序:固定洗牌,reveal 推进时格子只进不出(不闪烁) */
const rankOf=new Float32Array(IMG*IMG);
{const arr=[];const rnd=mulberry(99);
 for(let k=0;k<IMG*IMG;k++)arr.push({k,r:rnd()});
 arr.sort((a,b)=>a.r-b.r);
 for(let i=0;i<arr.length;i++)rankOf[arr[i].k]=i/(arr.length-1);}
const imgCv=document.createElement('canvas');imgCv.width=IMG*PX;imgCv.height=IMG*PX;
const imgCtx=imgCv.getContext('2d');
const imgTex=new THREE.CanvasTexture(imgCv);
const imgPlane=new THREE.Mesh(new THREE.PlaneGeometry(2.5,2.5),
  new THREE.MeshBasicMaterial({map:imgTex}));
imgPlane.position.set(4.75,1.75,-0.4);imgPlane.rotation.y=-0.62;scene.add(imgPlane);
const imgBack=new THREE.Mesh(new THREE.BoxGeometry(2.72,2.72,0.08),frameM);
imgBack.position.set(4.75,1.75,-0.47);imgBack.rotation.y=-0.62;scene.add(imgBack);
let imgDirty=true;
function redrawImage(){
  imgCtx.fillStyle=THEME==='dark'?'#141a20':'#dcd5c9';
  imgCtx.fillRect(0,0,imgCv.width,imgCv.height);
  const vals=[];
  for(let j=0;j<IMG;j++)for(let i=0;i<IMG;i++){
    const u=((i+0.5)/IMG)*2-1,v=((j+0.5)/IMG)*2-1;
    const shown=rankOf[j*IMG+i]<reveal;
    const g=readCell(u,v);
    vals.push(g);
    const bright=shown?Math.round(g*235+18):(THEME==='dark'?26:205);
    imgCtx.fillStyle=`rgb(${bright},${bright},${bright})`;
    imgCtx.fillRect(i*PX,j*PX,PX,PX);
  }
  /* 对比度=读数标准差 */
  let m=0;for(const g of vals)m+=g;m/=vals.length;
  let s2=0;for(const g of vals)s2+=(g-m)*(g-m);
  contrast=Math.sqrt(s2/vals.length);
  /* 细节点叠加:橙色圆圈(端点)/方框(分叉) */
  if(document.getElementById('tglMin').checked&&reveal>0.95&&contrast>0.15){
    imgCtx.strokeStyle='#ffa94d';imgCtx.lineWidth=2;
    for(const mt of minutiae){
      const cx=(mt.u+1)/2*IMG*PX,cy=(mt.v+1)/2*IMG*PX;
      imgCtx.beginPath();
      if(mt.type===0)imgCtx.arc(cx,cy,PX*0.9,0,7);
      else imgCtx.rect(cx-PX*0.8,cy-PX*0.8,PX*1.6,PX*1.6);
      imgCtx.stroke();
    }
  }
  imgTex.needsUpdate=true;
  imgDirty=false;
}

}

addLabel(()=>L('脊贴得近→电容大→亮;谷悬空→暗','ridge near → C big → bright; valley → dark'),
  new THREE.Vector3(-2.4,1.5,0),'b',()=>mode==='cap');
addLabel(()=>L('水膜把脊谷一起桥接 → 对比度抹平','water film bridges ridge & valley → contrast gone'),
  new THREE.Vector3(1.6,1.15,1.3),'r',()=>wet);
addLabel(()=>L('真皮层:超声回波的成像界面','dermis: the echo surface ultrasound reads'),
  new THREE.Vector3(-1.6,2.15,0.62),'g',()=>mode==='ult');
addLabel(()=>L('灰度像逐格拼出(4mm 局部放大)','grayscale image, cell by cell (4 mm patch)'),
  new THREE.Vector3(4.75,3.3,-0.4),'b');
const lblOk=addLabel(()=>L('✓ 匹配成功 · 解锁','✓ matched · unlocked'),new THREE.Vector3(4.25,3.02,-0.4),'g',()=>verdict===true);
const lblNo=addLabel(()=>L('✗ 拒绝','✗ rejected'),new THREE.Vector3(4.25,3.02,-0.4),'r',()=>verdict===false);
const lblNotify=addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',new THREE.Vector3(0,3.4,0),'o');

/* ================= 判定逻辑 ================= */
function evaluate(){
  /* 质量 q 由对比度决定;主人高分,陌生人天生低分(细节点对不上) */
  const q=clamp((contrast-0.05)/0.28,0,1);
  score=fingerIdx===0?0.30+0.65*q:0.18+0.24*q;
  verdict=score>=thr;
  if(verdict&&fingerIdx===0)notify(`匹配分 ${score.toFixed(2)} ≥ 阈值 ${thr.toFixed(2)}:解锁`,
    `score ${score.toFixed(2)} ≥ threshold ${thr.toFixed(2)}: unlocked`,2.6);
  else if(verdict)notify(`匹配分 ${score.toFixed(2)} 过了过低的阈值:误识!`,`score ${score.toFixed(2)} beat a too-low threshold: false accept!`,3.2);
  else notify(`匹配分 ${score.toFixed(2)} < 阈值 ${thr.toFixed(2)}:拒识(图像质量不足?)`,
    `score ${score.toFixed(2)} < threshold ${thr.toFixed(2)}: rejected (poor image?)`,2.8);
}
function rescan(){scanned=false;reveal=Math.min(reveal,0.99);if(pressed)reveal=Math.min(reveal,0.5);}

/* ================= 步骤 ================= */
const STEPS=[
  {zh:'指纹=凸脊-凹谷:周期 ~0.5mm 的皮肤花纹,三种传感器各显神通',en:'Ridges & valleys: a ~0.5mm skin pattern — three sensor types read it'},
  {zh:'电容式:电极测每个触点的电容,脊贴得近 C 大亮、谷悬空 C 小暗',en:'Capacitive: C is big where the ridge touches (bright), small over valleys'},
  {zh:'湿手失灵:水把脊谷一起桥接,电容差被抹平,图像一片灰',en:'Wet fail: water bridges ridges & valleys — the image washes out'},
  {zh:'超声式:脉冲穿透表皮,真皮层界面回波成像,湿手脏污都挡不住',en:'Ultrasonic: pulses echo off the dermis — water and grime are ignored'},
  {zh:'光学式:全反射在脊接触处漏光,棱镜面上明暗成像',en:'Optical: frustrated TIR leaks light at ridges, imaging bright/dark patches'},
  {zh:'细节点提取:模板只存脊端点/分叉点的坐标,从不存图片',en:'Minutiae: the template stores ending/bifurcation coordinates, never the image'},
  {zh:'匹配阈值:分数过线才解锁——阈值低了误识,高了拒识',en:'Threshold: score must beat it — too low = false accepts, too high = rejections'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();stepAct(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function stepAct(i){
  if(i===0){setMode('cap');wet=false;dirt=false;syncTgl();press(true);notify('干净的干手指:三种模式都能读','a clean dry finger: all three modes work',2.8);}
  if(i===1){setMode('cap');press(true);notify('逐格读电容,拼出灰度像:脊亮谷暗','cell-by-cell capacitance builds the grayscale image',3.0);}
  if(i===2){setMode('cap');document.getElementById('tglWet').checked=true;wet=true;syncTgl();press(true);
    notify('湿手:水是导体,把脊谷电容差抹平','wet finger: water shorts the ridge-valley contrast',3.2);}
  if(i===3){setMode('ult');document.getElementById('tglWet').checked=true;wet=true;document.getElementById('tglDirt').checked=true;dirt=true;syncTgl();press(true);
    notify('超声穿透表皮:真皮层照样成像','ultrasound skips the mess: dermis still images',3.2);}
  if(i===4){setMode('opt');wet=false;dirt=false;syncTgl();press(true);notify('全反射:脊接触处漏光成暗纹','TIR: ridge contact leaks light into dark lines',3.0);}
  if(i===5){press(true);notify('橙圈=脊端点,方框=分叉点——模板只存这些','orange circles = endings, boxes = bifurcations — that is the whole template',3.4);}
  if(i===6){document.getElementById('sThr').value=35;thr=0.35;document.getElementById('sThrVal').textContent='0.35';
    setStranger();notify('阈值 0.35:陌生人也过线——误识!','threshold 0.35: even a stranger passes — false accept!',3.4);}
  syncBtns();
}
function notify(z,e,t=3.0){notifyT=t;notifyZ=z;notifyE=e;}
function setMode(m){
  mode=m;scanned=false;
  if(pressed)reveal=Math.min(reveal,0.5);
  imgDirty=true;syncBtns();
}
function press(p){
  pressed=p;
  document.getElementById('btnPress').textContent=L(p?'抬起手指':'按下扫描',p?'Lift finger':'Press & scan');
  document.getElementById('btnPress').classList.toggle('on',p);
}
function setStranger(){
  if(fingerIdx===0){fingerIdx=1;rescan();imgDirty=true;notify('换了一只手指:细节点对不上','a different finger: minutiae no longer align',2.6);}
}
function setOwner(){
  if(fingerIdx!==0){fingerIdx=0;rescan();imgDirty=true;notify('主人手指回归','the owner is back',2.0);}
}
function syncBtns(){
  document.getElementById('mCap').classList.toggle('on',mode==='cap');
  document.getElementById('mUlt').classList.toggle('on',mode==='ult');
  document.getElementById('mOpt').classList.toggle('on',mode==='opt');
  document.getElementById('btnOwner').classList.toggle('on',fingerIdx===0);
  document.getElementById('btnStr').classList.toggle('on',fingerIdx!==0);
}
function syncTgl(){
  wet=document.getElementById('tglWet').checked;
  dirt=document.getElementById('tglDirt').checked;
  wat.visible=wet;drt.visible=dirt;
  imgDirty=true;scanned=false;
  if(pressed)reveal=Math.min(reveal,0.5);      // 状态变了要重读
}

/* ================= 主题 / 语言 / 统计 ================= */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  frameM.color.setHex(dark?0x2e3a47:0x8b98a6);
  imgDirty=true;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('btnPress').textContent=L(pressed?'抬起手指':'按下扫描',pressed?'Lift finger':'Press & scan');
  document.title=L('指纹识别 · 脊谷成像与细节点匹配','Fingerprint Sensors · Ridge Imaging & Minutiae Matching');
  document.getElementById('formula').innerHTML=L(
    `<b>脊谷周期</b> ~0.5mm;电容 C=εA/d:脊 d≈5µm,谷 d≈80µm+,差一个量级<br>`+
    `<b>湿手</b>:水(导电)填平谷底,各电极读数趋同 → 对比度≈0<br>`+
    `<b>超声</b>:MHz 级脉冲在真皮层界面回波,只认深度不认表面脏污<br>`+
    `<b>匹配</b>:细节点(端点/分叉)配对得分;模板不是图片,丢手机也丢不了指纹`,
    `<b>Ridge period</b> ~0.5mm; C=εA/d: ridge d≈5µm vs valley d≈80µm+ — an order apart<br>`+
    `<b>Wet finger</b>: conductive water evens out every electrode → contrast≈0<br>`+
    `<b>Ultrasound</b>: MHz pulses echo off the dermis — depth, not surface gunk<br>`+
    `<b>Matching</b>: pairs minutiae (endings/bifurcations) into a score; templates are not images`);
  buildSteps();updateStats();
}
function updateStats(){
  document.getElementById('stCon').innerHTML=(contrast*100).toFixed(1)+'<small> %</small>';
  document.getElementById('stScan').innerHTML=(reveal*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stScore').textContent=scanned?score.toFixed(2):'—';
  const el=document.getElementById('stVerdict');
  if(!scanned){el.textContent='—';el.className='v';}
  else if(verdict){el.textContent=L('解锁','unlock');el.className='v ok';}
  else{el.textContent=L('拒绝','reject');el.className='v bad';}
}

/* ================= UI ================= */
document.getElementById('mCap').addEventListener('click',()=>setMode('cap'));
document.getElementById('mUlt').addEventListener('click',()=>setMode('ult'));

document.getElementById('tglWet').addEventListener('change',syncTgl);
document.getElementById('tglDirt').addEventListener('change',syncTgl);

document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});

addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ================= 模拟步进 ================= */
function simStep(dt){
  /* 按压动画:手指下降,接触面积/读数幅度随 F 增长 */
  const target=pressed?forceT:0.05;
  F+=(target-F)*clamp(dt*2.4,0,1);
  if(F>0.45)reveal=Math.min(1,reveal+dt*speedK/1.2);      // 逐格读取
  else if(F<0.2)reveal=Math.max(0,reveal-dt*2*speedK);
  if(reveal>=1&&!scanned){scanned=true;evaluate();}       // 读满 → 提取+匹配
  if(reveal<0.2)scanned=false;
  imgDirty=true;
}

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let raf=null,acc=0,accImg=0,autoT=1.3;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(notifyT>0)notifyT-=dt;
  if(playing){
    /* 加载 1.3s 后自动演示一次完整按压 — 招牌瞬间不等按钮(?pause=1 保持静止) */
    if(autoT>0){autoT-=dt;if(autoT<=0){press(true);}}
    simStep(dt);
  }
  /* 手指位姿:按压深度(F=1 时脊尖恰好触到玻璃) + 剖面脊谷随 F 变形 */
  finger.position.y=0.63+0.42*(1-F);
  epi.userData.update();der.userData.update();
  if(wet)wat.userData.update();
  if(dirt)drt.userData.update();
  updateElecs();
  /* 超声波纹扩散 */
  if(mode==='ult'&&F>0.2){
    usRings.forEach((r,k)=>{
      const t=(simT*1.1+k/3)%1;
      r.scale.setScalar(0.25+t*1.6);
      r.material.opacity=0.85*(1-t);
      r.visible=true;
    });
  }else usRings.forEach(r=>r.visible=false);
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  accImg+=dt;if(accImg>0.09&&imgDirty){accImg=0;redrawImage();}
  for(const r of labelReg){
    const txt=r.text();
    r.o.visible=labelsOn&&r.vis()&&txt!=='';
    if(r.o.visible)r.o.element.textContent=txt;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
syncBtns();
syncTgl();
if(!playing)document.getElementById('play').textContent=L('运行','Run');
/* 预演一次完整按压,再退到「读到一半」的中间态:
   播放时 1.3s 后自动按下去补完读取与判定(?pause=1 保持静止画面) */
pressed=true;
for(let t=0;t<160;t++){simT+=0.03;simStep(0.03);}
press(false);          // 归位手指并同步按钮文案
reveal=0.55;scanned=false;verdict=null;score=0;
imgDirty=true;
redrawImage();
updateStats();
start();
</script>
