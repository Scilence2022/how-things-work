<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 紧凑同步 SHA-256(对标准向量校验通过) ---------------- */
const SHA256 = (() => {
  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const W = new Uint32Array(64);
  return msg => {
    const bytes = new TextEncoder().encode(msg);
    const bitLen = bytes.length * 8;
    const padded = new Uint8Array(((bytes.length + 8) >> 6 << 6) + 64);
    padded.set(bytes);
    padded[bytes.length] = 0x80;
    const dv = new DataView(padded.buffer);
    dv.setUint32(padded.length - 8, Math.floor(bitLen / 4294967296));
    dv.setUint32(padded.length - 4, bitLen >>> 0);
    let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
    for (let off = 0; off < padded.length; off += 64) {
      for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + (i << 2));
      for (let i = 16; i < 64; i++) {
        const x = W[i - 15], y = W[i - 2];
        const s0 = (x >>> 7 | x << 25) ^ (x >>> 18 | x << 14) ^ (x >>> 3);
        const s1 = (y >>> 17 | y << 15) ^ (y >>> 19 | y << 13) ^ (y >>> 10);
        W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
      }
      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for (let i = 0; i < 64; i++) {
        const S1 = (e >>> 6 | e << 26) ^ (e >>> 11 | e << 21) ^ (e >>> 25 | e << 7);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + W[i]) | 0;
        const S0 = (a >>> 2 | a << 30) ^ (a >>> 13 | a << 19) ^ (a >>> 22 | a << 10);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        h=g; g=f; f=e; e=(d + t1) | 0; d=c; c=b; b=a; a=(t1 + t2) | 0;
      }
      h0=(h0+a)|0; h1=(h1+b)|0; h2=(h2+c)|0; h3=(h3+d)|0; h4=(h4+e)|0; h5=(h5+f)|0; h6=(h6+g)|0; h7=(h7+h)|0;
    }
    return [h0,h1,h2,h3,h4,h5,h6,h7].map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
  };
})();

function attachBlock(data, mesh, mat) {
  const p = slotPos(data.i);
  mesh.position.copy(fly ? fly.to : p);
  mesh.rotation.z = -0.12;
  scene.add(mesh);
  data.mesh = mesh;
  data.mat = mat;
  data.baseP = p;
  chain.push(data);
  ghosts[data.i].visible = false;
  const lbl = addLabel(() => data.tampered
    ? L(`#${data.i} ${data.hash.slice(0, 6)}…(原 ${data.oldHash.slice(0, 6)}…) · ${data.tx}`, `#${data.i} ${data.hash.slice(0, 6)}… (was ${data.oldHash.slice(0, 6)}…) · ${data.tx}`)
    : L(`#${data.i} ${data.hash.slice(0, 6)}… · ${data.tx}`, `#${data.i} ${data.hash.slice(0, 6)}… · ${data.tx}`),
    new THREE.Vector3(p.x, p.y - 0.75, p.z), data.tampered ? 'r' : 'b');
  data.lbl = lbl;
}
function addSeal(i) {
  const a = slotPos(i - 1), b = slotPos(i);
  const m = makeSeal(a.clone().lerp(b, 0.5), sealOkM);
  seals[i] = { mesh: m };
  sealPop.set(i, 0);
  const broken = () => chain[i] && (chain[i].tampered || (tamperIdx >= 0 && i > tamperIdx));
  seals[i].lbl = addLabel(() => broken()
    ? L('✗ 指纹对不上:断裂', '✗ fingerprint mismatch: broken')
    : L(`嵌入 prev:${chain[i - 1].hash.slice(0, 6)}…`, `embeds prev:${chain[i - 1].hash.slice(0, 6)}…`),
    m.position.clone().add(new THREE.Vector3(0, 0.42, 0)), 'g');
}
function onHonestFind(m, h) {
  const mi = miners.indexOf(m);
  const data = { i: chain.length + pendingH, tx: curTx, nonce: m.nonce, hash: h, prev: curPrev, tampered: false };
  pendingH++;
  const mat = blockBase.clone();
  const mesh = makeBlockMesh(mat);
  mesh.position.set(rigs[mi].x, 1.2, rigs[mi].z);
  mesh.scale.setScalar(0.3);
  scene.add(mesh);
  flyQueue.push({
    mesh, from: mesh.position.clone(), to: slotPos(data.i), t: 0,
    after: () => { pendingH--; attachBlock(data, mesh, mat); addSeal(data.i); }
  });
  flashT = 0;
  flashPos.set(rigs[mi].x, 2.2, rigs[mi].z);
  if (state === 'mining') {
    state = 'idle';
    syncButtons();
  } else if (chain.length + pendingH >= CAP) {
    stopAttack(L('诚实链到顶仍领先:攻击追不上——除非 >51%', 'honest chain topped out still ahead: attack cannot catch up — not without >51%'));
  } else {
    curPrev = h; curTx = newTx();
    for (const mm of miners) mm.prefix = prefixFor(curPrev, curTx, mm.name);
  }
}
function onAtkFind(h) {
  const j = fork.length + pendingF;
  const data = { i: tamperIdx + j, tx: forkTx, nonce: attacker.nonce, hash: h, prev: forkPrev };
  pendingF++;
  const mesh = makeBlockMesh(forkBase.clone());
  mesh.position.set(rigs[3].x, 1.2, rigs[3].z);
  mesh.scale.setScalar(0.3);
  scene.add(mesh);
  flyQueue.push({
    mesh, from: mesh.position.clone(), to: forkSlot(data.i, j), t: 0,
    after: () => {
      pendingF--;
      fork.push(data);
      data.lbl = addLabel(() => L(`攻击#${j} ${data.hash.slice(0, 6)}… · ${data.tx}`, `atk#${j} ${data.hash.slice(0, 6)}… · ${data.tx}`),
        forkSlot(data.i, j).clone().add(new THREE.Vector3(0, -0.75, 0)), 'r');
      if (j >= 1) {
        fseals[j] = makeSeal(forkSlot(data.i - 1, j - 1).lerp(forkSlot(data.i, j), 0.5), sealBadM);
        sealPop.set('f' + j, 0);
      }
    }
  });
  flashT = 0;
  flashPos.set(rigs[3].x, 2.2, rigs[3].z);
  forkPrev = h;
  attacker.prefix = prefixFor(forkPrev, forkTx, 'X');
}
function startMining() {
  if (chain.length >= CAP) { notifyT = 2; notifyZ = '链条已到演示上限,点「重置」重开'; notifyE = 'demo chain is full — hit Reset'; return; }
  state = 'mining';
  curTx = newTx();
  curPrev = chain[chain.length - 1].hash;

}
function doTamper(b) {
  b.tampered = true;
  b.oldHash = b.hash;
  b.tx = b.tx.replace(/[0-9.]+$/, x => (parseFloat(x) + 3).toFixed(1));
  b.hash = SHA256(prefixFor(b.prev, b.tx, 'X') + b.nonce);
  b.mat.color.setHex(0x8c3a3a);
  b.mat.emissive.setHex(0xff3b30);
  b.mat.emissiveIntensity = 0.35;
  tamperIdx = b.i;
  for (let i = b.i + 1; i < chain.length; i++) {
    chain[i].mat.color.setHex(0x7c4040);
    chain[i].mat.emissive.setHex(0xff3b30);
    chain[i].mat.emissiveIntensity = 0.22;
  }
  for (let i = seals.length - 1; i > b.i; i--) if (seals[i]) {
    seals[i].mesh.material = sealBadM;
    if (seals[i].lbl) { seals[i].lbl.element.classList.remove('g'); seals[i].lbl.element.classList.add('r'); }
  }
  notifyT = 3.2;
  notifyZ = `雪崩!#${b.i} 的哈希面目全非,身后 ${chain.length - b.i - 1} 块全部烧红断裂`;
  notifyE = `Avalanche! #${b.i}'s hash is unrecognizable — ${chain.length - b.i - 1} blocks after it burn red and break`;
  armTamper = false;
  syncButtons();
  syncAll();
}
function startAttack() {
  if (tamperIdx < 0) { notifyT = 2.2; notifyZ = '先做第 5 步:篡改一个旧块'; notifyE = 'Do step 5 first: tamper with a block'; return; }
  state = 'attack';
  fork = []; pendingF = 0;
  forkTx = chain[tamperIdx].tx;
  forkPrev = tamperIdx > 0 ? chain[tamperIdx - 1].hash : '';
  attacker.prefix = prefixFor(forkPrev, forkTx, 'X');
  triesThisBlock = 0;
  curTx = newTx();
  curPrev = chain[chain.length - 1].hash;
  for (const m of miners) m.prefix = prefixFor(curPrev, curTx, m.name);
  syncButtons();
}
function stopAttack(msgZ, msgE) {
  state = 'idle';
  notifyT = 3.5; notifyZ = msgZ; notifyE = msgE;
  syncButtons();
}
function resetAll() {
  for (const b of chain) { scene.remove(b.mesh); if (b.lbl) killLabel(b.lbl); }
  for (const f of fork) { scene.remove(f.mesh); if (f.lbl) killLabel(f.lbl); }
  for (const s of seals) if (s) { scene.remove(s.mesh); if (s.lbl) killLabel(s.lbl); }
  for (const s of fseals) if (s) scene.remove(s);
  flyQueue.forEach(f => scene.remove(f.mesh));
  if (fly) { scene.remove(fly.mesh); fly = null; }
  chain = []; fork = []; seals = []; fseals = []; flyQueue = []; sealPop.clear();
  pendingH = 0; pendingF = 0;
  ghosts.forEach(g => g.visible = true);
  tamperIdx = -1; totalTries = 0; triesThisBlock = 0; autoQueue = 3;
  state = 'idle'; armTamper = false;
  buildGenesis();
  syncButtons();
}
function buildGenesis() {
  const h = SHA256('HTW|创世 genesis|HTW');
  const data = { i: 0, tx: 'genesis', nonce: 0, hash: h, prev: '', tampered: false };
  const mat = blockBase.clone();
  const mesh = makeBlockMesh(mat);
  attachBlock(data, mesh, mat);
}

/* ================= 每帧挖矿预算(≤3000 次/帧,6 ms 守卫) ================= */
function mineStep() {
  const cap = Math.min(3000, Math.round(2600 * speed));
  const t0 = performance.now();
  const guard = () => (performance.now() - t0) > 6;
  if (state === 'mining') {
    const per = Math.max(1, Math.round(cap / miners.length));
    for (const m of miners) {
      for (let k = 0; k < per; k++) {
        if ((k & 63) === 0 && guard()) return;
        const h = SHA256(m.prefix + m.nonce);
        m.nonce++; m.tries++; totalTries++; triesThisBlock++;
        if (okHash(h)) { onHonestFind(m, h); return; }
      }
    }
  } else if (state === 'attack') {
    /* 攻击者:从篡改点重挖分叉 */
    if (atkShare > 0.001 && fork.length + pendingF < FORK_CAP && chain.length + pendingH < CAP) {
      for (let k = 0; k < Math.round(cap * atkShare); k++) {
        if ((k & 63) === 0 && guard()) return;
        const h = SHA256(attacker.prefix + attacker.nonce);
        attacker.nonce++; attacker.tries++; totalTries++;
        if (okHash(h)) { onAtkFind(h); return; }
      }
    }
    /* 诚实矿机:继续延伸诚实链 */
    if (atkShare < 0.999 && chain.length + pendingH < CAP) {
      const per = Math.max(1, Math.round(cap * (1 - atkShare) / miners.length));
      for (const m of miners) {
        for (let k = 0; k < per; k++) {
          if ((k & 63) === 0 && guard()) return;
          const h = SHA256(m.prefix + m.nonce);
          m.nonce++; m.tries++; totalTries++; triesThisBlock++;
          if (okHash(h)) { onHonestFind(m, h); return; }
        }
      }
    }
  }
}

/* ================= 讲解步骤 ================= */

function resetSoft() {

}
const STEPS = [

    de: 'More hashrate worldwide means faster blocks, but each rig\u2019s odds are simply its share — hashrate is the vote. After a few blocks, check the stats: tries and wins scale with share.',

    de: 'Arm tamper and click any historical block: change the amount and its hash avalanches on the spot; the fingerprint embedded in the next header no longer matches — from that point the chain burns red and breaks. That is why the ledger resists edits.',

    d: '攻击者从篡改点起重挖分叉,同时诚实全网继续延伸主链:算力 <50%,落后只会越拉越大;拉过 51%,反超才有可能——51% 是改写历史的入场券。',

function avalancheDemo() {
  const h1 = SHA256('区块#3 金额 5.0 block#3 amount 5.0');

}
let formulaAva = null;
function gotoPhase(i) {
  phase = clamp(i, 0, STEPS.length - 1);
  STEPS[phase].act();
  syncAll();
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { gotoPhase(i); });
    el.appendChild(li);
  });
}

/* ================= 绘图:挖中概率曲线 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const exp = expOf();
  const padL = 42, padR = 16, padT = 12, padB = 26;
  const xOf = n => padL + clamp(n / (2 * exp), 0, 1) * (W - padL - padR);
  const yOf = p => (H - padB) - p * (H - padB - padT);
  ctx.font = '12px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const p of [0.25, 0.5, 0.75, 1]) {
    ctx.beginPath(); ctx.moveTo(padL, yOf(p)); ctx.lineTo(W - padR, yOf(p)); ctx.stroke();
    ctx.fillText(p * 100 + '%', padL - 40, yOf(p) + 4);
  }
  ctx.fillText('0', padL - 8, H - 8);
  ctx.fillText('2×16^' + diff, W - padR - 52, H - 8);
  ctx.fillText('16^' + diff, xOf(exp) - 22, H - 8);
  /* 累计命中概率:p = 1 − exp(−n/16^d) */
  ctx.strokeStyle = '#4dabf7';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let n = 0; n <= 2 * exp; n += Math.max(1, Math.round(exp / 60))) {
    const p = 1 - Math.exp(-n / exp);
    n === 0 ? ctx.moveTo(xOf(n), yOf(p)) : ctx.lineTo(xOf(n), yOf(p));
  }
  ctx.stroke();
  ctx.lineWidth = 1;
  /* 期望点:1/1 − 1/e ≈ 63% */
  ctx.strokeStyle = 'rgba(255,169,77,.6)';
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(xOf(exp), padT); ctx.lineTo(xOf(exp), H - padB); ctx.stroke();
  ctx.setLineDash([]);
  /* 当前进度 */
  ctx.strokeStyle = 'rgba(159,176,195,.6)';
  ctx.beginPath(); ctx.moveTo(xOf(triesThisBlock), padT); ctx.lineTo(xOf(triesThisBlock), H - padB); ctx.stroke();
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath(); ctx.arc(xOf(triesThisBlock), yOf(1 - Math.exp(-triesThisBlock / exp)), 6, 0, 7); ctx.fill();
  ctx.fillStyle = cTxt;
  ctx.fillText(L(`本块已试 ${fmt(triesThisBlock)} 次`, `this block: ${fmt(triesThisBlock)} tries`), padL + 8, padT + 14);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elDiff = document.getElementById('sDiff'), elDiffVal = document.getElementById('sDiffVal');
const elAtk = document.getElementById('sAtk'), elAtkVal = document.getElementById('sAtkVal');
const elSpd = document.getElementById('sSpd'), elSpdVal = document.getElementById('sSpdVal');
const stHash = document.getElementById('stHash'), stExp = document.getElementById('stExp'),
  stDiff = document.getElementById('stDiff'), stH = document.getElementById('stH'),
  stA = document.getElementById('stA'), stDef = document.getElementById('stDef'),
  stAtk = document.getElementById('stAtk'), stState = document.getElementById('stState');
const formulaEl = document.getElementById('formula');
const btnMine = document.getElementById('btnMine'), btnTamper = document.getElementById('btnTamper'),
  btnAttack = document.getElementById('btnAttack');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncButtons() {
  btnMine.classList.toggle('on', state === 'mining');
  btnTamper.classList.toggle('brk', true);
  btnTamper.classList.toggle('on', armTamper);
  btnTamper.textContent = armTamper ? L('已武装:去点一个旧块!', 'Armed: now click a block!') : L('篡改旧块(先点此,再点块)', 'Tamper (arm, then click a block)');
  btnAttack.classList.toggle('on', state === 'attack');
  btnAttack.textContent = state === 'attack' ? L('停止攻击', 'Stop attack') : L('重挖攻击(51% 赛跑)', 'Re-mine attack (51% race)');
}
function syncSliders() {
  elDiff.value = diff; elDiffVal.textContent = diff + L(' 零', ' zeros');
  elAtk.value = Math.round(atkShare * 100); elAtkVal.textContent = Math.round(atkShare * 100) + '%';
  elSpd.value = speed; elSpdVal.textContent = '×' + speed.toFixed(1);
}
function updateStats() {
  stHash.textContent = fmt(totalTries);
  stExp.textContent = fmt(expOf());
  stDiff.textContent = 'd=' + diff;
  stH.textContent = chain.length;
  stA.textContent = fork.length || '—';
  const d = chain.length - fork.length;
  stDef.textContent = fork.length ? (d > 0 ? '+' + d : String(d)) : '—';
  stDef.className = 'v ' + (fork.length ? (d > 0 ? 'bad' : 'ok') : '');
  stAtk.textContent = Math.round(atkShare * 100) + '%';
  stState.textContent = state === 'mining' ? L('挖矿中', 'mining') : state === 'attack' ? L('攻击赛跑', 'attack race') : L('待机', 'idle');
  stState.className = 'v ' + (state === 'attack' ? 'warn' : 'ok');
}
function updateFormula() {
  const ava = formulaAva ? L(
    `<b>雪崩演示</b>:SHA256(…5.0) = <span style="color:#7bd88f">${formulaAva[0].slice(0, 16)}…</span><br>SHA256(…5.1) = <span style="color:#ff8787">${formulaAva[1].slice(0, 16)}…</span> —— 一位之差,两张脸`,
    `<b>avalanche demo</b>: SHA256(…5.0) = <span style="color:#7bd88f">${formulaAva[0].slice(0, 16)}…</span><br>SHA256(…5.1) = <span style="color:#ff8787">${formulaAva[1].slice(0, 16)}…</span> — one bit apart, two different faces`) : L(
    '<b>雪崩演示</b>:进入第 2 步即可看到改一位前后的两个哈希',
    '<b>avalanche demo</b>: go to step 2 to see the before/after pair');
  formulaEl.innerHTML = L(
    `<b>工作量证明</b>:找 nonce 使 SHA-256(头) 前 ${diff} 位为 0 → 期望 16^${diff} = ${fmt(expOf())} 次,已试 ${fmt(totalTries)} 次<br>` +
    ava + '<br>' +
    `<b>51% 规则</b>:赢家概率 = 算力占比;攻击要追上诚实链,算力必须过半——演示 4 零 ≈ 6.5 万次,比特币 ~19–20 零 ≈ 2^76`,
    `<b>proof of work</b>: find a nonce so SHA-256(header) starts with ${diff} zeros → expect 16^${diff} = ${fmt(expOf())} tries; tried ${fmt(totalTries)}<br>` +
    ava + '<br>' +
    `<b>the 51% rule</b>: win odds = hashrate share; overtaking the honest chain needs a majority — demo 4 zeros ≈ 65k tries, Bitcoin ~19–20 zeros ≈ 2^76`);
}
function syncAll() {
  syncSliders(); syncButtons(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phase));
}
elDiff.addEventListener('input', () => { diff = +elDiff.value; triesThisBlock = 0; syncAll(); });
elAtk.addEventListener('input', () => { atkShare = +elAtk.value / 100; syncAll(); });
elSpd.addEventListener('input', () => { speed = +elSpd.value; syncSliders(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
btnMine.addEventListener('click', () => { if (state === 'idle') startMining(); syncAll(); });
btnTamper.addEventListener('click', () => {
  if (state === 'attack') { notifyT = 1.8; notifyZ = '攻击进行中,先停止'; notifyE = 'attack running — stop it first'; return; }
  armTamper = !armTamper;
  syncButtons();
});
btnAttack.addEventListener('click', () => {
  if (state === 'attack') stopAttack(L('攻击已停止:分叉弃置,诚实链仍是唯一历史', 'attack stopped: fork abandoned, the honest chain stays the only history'));
  else startAttack();
  syncAll();
});
document.getElementById('btnReset').addEventListener('click', () => { resetAll(); syncAll(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglPlot').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglGhost').addEventListener('change', e => { ghosts.forEach((g, i) => g.visible = e.target.checked && i >= chain.length); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});
/* 点击选块(篡改) */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  if (!armTamper || state !== 'idle') return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const meshes = chain.filter(b => b.i >= 1).map(b => b.mesh);
  const hit = ray.intersectObjects(meshes, true)[0];
  if (!hit) return;
  let o = hit.object;
  while (o && !chain.some(b => b.mesh === o)) o = o.parent;
  const b = chain.find(x => x.mesh === o);
  if (b && b.i >= 1 && !b.tampered) doTamper(b);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, statsAcc = 0, camTween = null, tSim = 0;
controls.addEventListener('start', () => { camTween = null; });
const _M4 = new THREE.Matrix4(), _P = new THREE.Vector3(), _Q = new THREE.Quaternion(), _S = new THREE.Vector3();
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  tSim += dt0;
  if (notifyT > 0) notifyT -= dt0;
  /* —— 挖矿预算 —— */
  if (playing && state !== 'idle') mineStep();
  if (playing && state === 'idle' && autoQueue > 0 && !fly && !flyQueue.length && pendingH === 0) { autoQueue--; startMining(); }
  /* —— 新块飞入(队列) —— */
  if (!fly && flyQueue.length) fly = flyQueue.shift();
  if (fly) {
    fly.t += dt0 * 1.8;
    const s = Math.min(1, fly.t), e = 1 - Math.pow(1 - s, 3);
    fly.mesh.position.lerpVectors(fly.from, fly.to, e);
    fly.mesh.scale.setScalar(0.3 + 0.7 * e);
    if (s >= 1) { const after = fly.after; fly = null; if (after) after(); }
  }
  /* —— 攻击反超裁决 —— */
  if (state === 'attack' && fork.length + pendingF > chain.length) {
    stopAttack(L('攻击链反超!>51% 的算力改写了历史(演示)', 'attack leads! >51% hashrate rewrote history (demo)'));
    syncAll();
  }
  /* —— 篡改后继块:倾斜脱扣 —— */
  for (const b of chain) {
    if (b.i === 0) continue;
    const burn = b.tampered ? 1 : (tamperIdx >= 0 && b.i > tamperIdx ? 1 : 0);
    const tZ = -0.12 - burn * 0.4, tY = b.baseP.y - burn * 0.3;
    b.mesh.rotation.z += (tZ - b.mesh.rotation.z) * Math.min(1, dt0 * 4);
    b.mesh.position.y += (tY - b.mesh.position.y) * Math.min(1, dt0 * 4);
  }
  /* —— 印章环弹出 —— */
  for (const [k, v] of sealPop) {
    if (v < 1) {
      const nv = Math.min(1, v + dt0 * 3);
      sealPop.set(k, nv);
      const e = 1 - Math.pow(1 - nv, 3);
      if (typeof k === 'number') { if (seals[k]) seals[k].mesh.scale.setScalar(e); }
      else { const fs = fseals[+k.slice(1)]; if (fs) fs.scale.setScalar(e); }
    }
  }
  /* —— 金色闪光 + 矿机辉光衰减 —— */
  if (flashT < 9) flashT += dt0;
  flash.position.copy(flashPos);
  flash.intensity = flashT < 0.8 ? 30 * (1 - flashT) : 0;
  for (const r of rigs) r.mat.emissiveIntensity = flashT < 0.6 ? (0.6 - flashT) * 3 : 0;
  /* —— 算力条与流光粒子 —— */
  for (let i = 0; i < 3; i++) {
    const share = state === 'attack' ? (1 - atkShare) / 3 : 1 / 3;
    rigs[i].bar.scale.x = clamp(share * 3, 0.25, 1.2);
  }
  rigs[3].bar.scale.x = clamp(atkShare * 3, 0.1, 1.6);
  const active = playing && state !== 'idle';
  for (let i = 0; i < NP; i++) {
    const p = pA[i];
    const rig = rigs[p.rig];
    const act = active ? (p.rig === 3 ? atkShare : (state === 'attack' ? (1 - atkShare) / 3 : 1 / 3)) : 0;
    p.t += dt0 * (0.5 + act * 6);
    if (p.t > 1) { p.t -= 1; p.ph = Math.random() * 6.28; }
    _P.set(rig.x + Math.sin(p.ph * 3 + tSim * 2) * 0.3, 1.05 + p.t * 0.85, rig.z + Math.cos(p.ph * 3 + tSim * 2) * 0.25);
    _M4.compose(_P, _Q.identity(), _S.setScalar(act > 0.02 ? 0.6 + 0.6 * Math.sin(p.t * 3.14) : 0.001));
    partIM.setMatrixAt(i, _M4);
  }
  partIM.instanceMatrix.needsUpdate = true;
  /* —— 相机飞行 —— */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const s = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, s);
    controls.target.lerpVectors(camTween.t0, camTween.t1, s);
    if (camTween.k >= 1) camTween = null;
  }
  statsAcc += dt0;
  if (statsAcc > 0.15) { statsAcc = 0; updateStats(); updateFormula(); drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phase));
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildGenesis();
buildSteps();
applyLang();
syncAll();
{ const p0 = clamp(Math.round(qsFloat('t', 0)), 0, STEPS.length - 1); if (qs.get('t') !== null) gotoPhase(p0); }
start();
</script>
