<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}

  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}

  @media(max-width:1020px){#plot{display:none}}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,44);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(-1.2,1.3,11.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.2,0.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(4,6,7);scene.add(key);

/* ---- 材质 ---- */
const cM=new THREE.MeshStandardMaterial({color:0x4a525c,roughness:0.35,metalness:0.55});
const hM=new THREE.MeshStandardMaterial({color:0xe8edf2,roughness:0.4});
const bondM=new THREE.MeshStandardMaterial({color:0x7a8794,roughness:0.4,metalness:0.5});
const nM=new THREE.MeshStandardMaterial({color:0x4dabf7,roughness:0.3,metalness:0.3});
const oM=new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.3,metalness:0.3});
const baseM=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xe67700,emissiveIntensity:0.35,roughness:0.35});
const chM=new THREE.MeshStandardMaterial({color:0x37424e,roughness:0.4,metalness:0.4});
const piM=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xffa000,emissiveIntensity:0.85,roughness:0.25,transparent:true,opacity:0.95});
const ringMkM=new THREE.MeshStandardMaterial({color:0x8ce99a,emissive:0x2f9e44,emissiveIntensity:0.8,transparent:true,opacity:0.9});
const bgM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});

/* ---- 苯环几何 ---- */
const RC=2.0,RH=2.95;
const hexa=i=>Math.PI/2-i*Math.PI/3;         // C0 顶点，顺时针
const posOn=(i,r)=>new THREE.Vector3(r*Math.cos(hexa(i)),r*Math.sin(hexa(i)),0);
const cAtoms=[],hAtoms=[],bonds=[];
const ringGroup=new THREE.Group();scene.add(ringGroup);
for(let i=0;i<6;i++){
  const c=new THREE.Mesh(new THREE.SphereGeometry(0.42,26,20),cM);
  c.position.copy(posOn(i,RC));ringGroup.add(c);cAtoms.push(c);
  const h=new THREE.Mesh(new THREE.SphereGeometry(0.17,16,12),hM);
  h.position.copy(posOn(i,RH));ringGroup.add(h);hAtoms.push(h);
}
for(let i=0;i<6;i++){
  const p1=posOn(i,RC),p2=posOn((i+1)%6,RC);
  const d=p2.clone().sub(p1),len=d.length();
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,len,10),bondM);
  b.position.copy(p1).addScaledVector(d,0.5);
  b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  ringGroup.add(b);bonds.push(b);
}
/* 芳香 π 云（金色圆环，可熄灭/复燃） */
const piCloud=new THREE.Mesh(new THREE.TorusGeometry(1.15,0.075,10,72),piM);
scene.add(piCloud);
/* 有效位点脉冲标记 */
const siteMarks=[];
for(let i=1;i<6;i++){
  const m=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.045,8,32),ringMkM.clone());
  m.position.copy(posOn(i,RC+0.85));siteMarks.push({i,m});
}
/* 取代基（C0 顶点向外） */
let subGroup=null;
function buildSubstituent(kind){
  if(subGroup){ringGroup.remove(subGroup);subGroup=null;}
  const g=new THREE.Group();
  const out=posOn(0,RC),dir=out.clone().normalize();
  if(kind==='H'){g.visible=false;}
  else if(kind==='CH3'){
    const c=new THREE.Mesh(new THREE.SphereGeometry(0.3,18,14),chM);
    c.position.copy(dir.clone().multiplyScalar(0.72));g.add(c);
  }else if(kind==='OH'){
    const o=new THREE.Mesh(new THREE.SphereGeometry(0.3,18,14),oM);
    o.position.copy(dir.clone().multiplyScalar(0.72));g.add(o);
    const h=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,10),hM);
    h.position.copy(dir.clone().multiplyScalar(1.18));g.add(h);
  }else if(kind==='NO2'){
    const n=new THREE.Mesh(new THREE.SphereGeometry(0.3,18,14),nM);
    n.position.copy(dir.clone().multiplyScalar(0.75));g.add(n);
    [[0.5,0.32],[-0.5,0.32]].forEach(([dz,dr])=>{
      const o=new THREE.Mesh(new THREE.SphereGeometry(0.24,16,12),oM);
      o.position.copy(dir.clone().multiplyScalar(1.2));o.position.z=dz;g.add(o);
    });
  }else if(kind==='COOH'){
    const c=new THREE.Mesh(new THREE.SphereGeometry(0.28,18,14),chM);
    c.position.copy(dir.clone().multiplyScalar(0.72));g.add(c);
    const o1=new THREE.Mesh(new THREE.SphereGeometry(0.24,16,12),oM);
    o1.position.copy(dir.clone().multiplyScalar(1.18));o1.position.z=0.32;g.add(o1);
    const o2=new THREE.Mesh(new THREE.SphereGeometry(0.24,16,12),oM);
    o2.position.copy(dir.clone().multiplyScalar(1.18));o2.position.z=-0.32;g.add(o2);
  }
  const bond=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.55,10),bondM);
  bond.position.copy(dir.clone().multiplyScalar(0.28));
  bond.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  g.add(bond);
  ringGroup.add(g);subGroup=g;
}
/* NO2+ 亲电试剂 */
const no2p=new THREE.Group();
{
  const n=new THREE.Mesh(new THREE.SphereGeometry(0.32,18,14),nM);no2p.add(n);
  [[0.5,0.3],[-0.5,0.3]].forEach(([dz])=>{
    const o=new THREE.Mesh(new THREE.SphereGeometry(0.25,16,12),oM);
    o.position.set(0.28,0.34,dz);no2p.add(o);
  });
}
no2p.position.set(5.4,3.4,0);no2p.visible=false;scene.add(no2p);
/* 进攻键（C—N） */
const atkBond=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1,10),bondM);
atkBond.visible=false;scene.add(atkBond);
/* 碱 HSO4-（黄球） */
const base=new THREE.Mesh(new THREE.SphereGeometry(0.3,18,14),baseM);
base.position.set(5.6,-3.6,0);base.visible=false;scene.add(base);
/* 被拔走的 H（复用 hAtoms[target] 的移动） */
const bg=new THREE.Mesh(new THREE.BoxGeometry(14,0.3,8),bgM);
bg.position.set(0.4,-3.2,0);scene.add(bg);

/* ---- 标签 ---- */
let sub='CH3';   // 先于标签声明：addLabel 创建时会立即求值 subLabel()
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblNo2=addLabel(()=>L('NO₂⁺ 亲电试剂','NO₂⁺ electrophile'),new THREE.Vector3(0,0.75,0),'o',()=>no2p.visible);
const lblPi=addLabel(()=>L('π 云（芳香性在线）','π cloud (aromatic)'),new THREE.Vector3(-1.35,1.5,0),'b',()=>phase<2);
const lblSigma=addLabel(()=>L('σ-配合物：正电荷离域、芳香性暂停','σ-complex: charge delocalized'),new THREE.Vector3(0,-2.6,0),'r',()=>phase===2||phase===3);
const lblBase=addLabel(()=>L('HSO₄⁻ 碱：拔走 H⁺','HSO₄⁻ base pulls H⁺'),new THREE.Vector3(0,0.85,0),'g',()=>phase===3&&base.visible);
const lblSub=addLabel(()=>L('取代基 ','Substituent ')+subLabel(),posOn(0,RC+1.75),'g');
const lblDone=addLabel(()=>L('硝化完成！芳香性已恢复','Nitrated! aromaticity restored'),new THREE.Vector3(0,3.2,0),'g',()=>phase===4||phase===5);
const lblStall=addLabel(()=>L('能垒太高：反应停滞——需发烟硫酸/更高温','Barrier too high: stalled — needs fuming acid / more heat'),new THREE.Vector3(0,-3.5,0),'r',()=>stalled);
function subLabel(){return {H:'−H',CH3:'−CH₃',OH:'−OH',NO2:'−NO₂',COOH:'−COOH'}[sub];}

/* ---- 化学数据（代表性值：ΔΔG‡ = −RT·ln(krel) @298K） ---- */
const SUBS={
 H:   {k:1,      dir:[],      ddG:0},
 CH3: {k:25,     dir:[1,3,5], ddG:-8.0},
 OH:  {k:1000,   dir:[1,3,5], ddG:-17.1},
 NO2: {k:1e-7,   dir:[2,4],   ddG:+39.9},
 COOH:{k:0.004,  dir:[2,4],   ddG:+13.7},
};
const EA0=65,NO2_PENALTY=1e-5;   // 每上一个 NO₂，速率 ×1e-5（钝化累积）
let tempC=50,speedK=1.0;
let playing=true,labelsOn=true,simT=0;
let phase=0,phaseT=0,stalled=false,nCount=0,target=3;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')){const v=clamp(+qs.get('speed'),20,200);document.getElementById('sSpd').value=v;speedK=v/100;}

/* ---- 状态 ---- */
function netRate(){
  return SUBS[sub].k*Math.pow(NO2_PENALTY,nCount)*Math.exp(-eaEff()*1000/8.314*(1/(tempC+273.15)-1/298.15));
}
function eaEff(){return EA0+SUBS[sub].ddG;}
function pickTarget(){
  const dirs=SUBS[sub].dir.filter(i=>!taken[i]);
  target=dirs.length?dirs[0]:-1;
}
const taken=new Set();   // 已被 NO₂ 占据的位

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'催化剂造亲电试剂：HNO₃+H₂SO₄ → NO₂⁺ + HSO₄⁻ + H₂O',en:'The acid catalyst makes NO₂⁺: HNO₃+H₂SO₄ → NO₂⁺+HSO₄⁻+H₂O'},
 {zh:'苯环富电子却极稳：直接加成要拆芳香性——能垒如山（红虚线）',en:'π-rich yet ultra-stable: addition must demolish aromaticity (red dashed hill)'},
 {zh:'改走取代：NO₂⁺ 进攻 π 云 → σ-配合物（芳香性暂停，决速步）',en:'Substitute instead: NO₂⁺ → σ-complex (aromaticity paused, rate-determining)'},
 {zh:'碱拔质子：HSO₄⁻ 抽走 H⁺，生成 H₂SO₄——催化剂再生',en:'Base pulls the proton: HSO₄⁻ takes H⁺ → H₂SO₄, catalyst regenerated'},
 {zh:'芳香性瞬间恢复：放热、发光——总策略「先破一小步，立刻修复」',en:'Aromaticity snaps back, exothermic: break a little, repair at once'},
 {zh:'定位效应：给电子基(CH₃/OH)→邻对位；吸电子基(NO₂/COOH)→间位',en:'Directing: EDG (CH₃/OH) ortho/para; EWG (NO₂/COOH) meta'},
 {zh:'钝化累积：每上一个 NO₂ 速率 ×10⁻⁵——再硝化需更高温/发烟酸',en:'Deactivation stacks: each NO₂ costs ×10⁻⁵ — further nitration needs harsher conditions'},
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;phase=Math.min(i,5);phaseT=0;stalled=false;syncAll();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function syncAll(){syncSteps();updateStats();drawPlot();}

/* ---- 能垒图 ---- */
const cv=document.getElementById('plotCv'),ctx=cv.getContext('2d');
const EAS_PTS=[[0,0],[0.22,1.0],[0.40,0.58],[0.60,0.74],[0.78,0.16],[1.0,0.10]];
const ADD_PTS=[[0,0],[0.16,0.85],[0.32,1.92],[0.50,1.58],[0.72,1.38],[1.0,1.22]];
function curveY(pts,x){
  for(let i=0;i<pts.length-1;i++){
    if(x<=pts[i+1][0]){
      const t=(x-pts[i][0])/(pts[i+1][0]-pts[i][0]);
      return pts[i][1]+(pts[i+1][1]-pts[i][1])*t;
    }
  }
  return pts[pts.length-1][1];
}
function phaseX(){
  const t=phaseT;
  return [0.03,0.03+0.19*t,0.40+0.16*t,0.60+0.16*t,0.78+0.20*t,0.98][phase]??0.03;
}
function drawPlot(){
  const dark=THEME==='dark';
  const W=cv.width,Hh=cv.height,padL=46,padB=30,padT=14;
  const scale=clamp(eaEff()/104,0.25,1.25);
  ctx.clearRect(0,0,W,Hh);
  ctx.fillStyle=dark?'rgba(16,20,24,0.5)':'rgba(255,255,255,0.5)';
  ctx.fillRect(0,0,W,Hh);
  ctx.strokeStyle=dark?'rgba(255,255,255,.18)':'rgba(15,25,40,.2)';
  ctx.fillStyle=dark?'#9fb0c3':'#5b6b7d';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,Hh-padB);ctx.lineTo(W-8,Hh-padB);ctx.stroke();
  ctx.font='11px system-ui';
  ctx.fillText('E',padL-16,padT+8);
  ctx.fillText(L('反应进程','progress'),W-84,Hh-10);
  const X=x=>padL+(W-padL-14)*x;
  const Y=y=>Hh-padB-(Hh-padB-padT)*(y*scale/2.0);
  // 参考刻度：苯基准 Ea
  ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(padL,Y(1.0));ctx.lineTo(W-8,Y(1.0));ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillText('ΔG‡ = '+eaEff().toFixed(0)+' kJ/mol',padL+6,Y(1.0)-4);
  // 加成路线（红虚线大山）
  ctx.setLineDash([6,5]);ctx.strokeStyle='#ff6b6b';
  ctx.beginPath();ADD_PTS.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));
  ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#ff8787';
  ctx.fillText(L('加成：拆芳香性','addition: kills aromaticity'),X(0.30),Y(1.92)-6);
  // 取代路线
  ctx.strokeStyle=dark?'#74c0fc':'#1864ab';ctx.lineWidth=2.4;
  ctx.beginPath();EAS_PTS.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));
  ctx.stroke();ctx.lineWidth=1;
  ctx.fillStyle=dark?'#bde9ff':'#1864ab';
  ctx.fillText(L('取代：两座小丘','substitution: two bumps'),X(0.55),Y(0.74)-8);
  ctx.fillStyle='#ffd43b';
  ctx.fillText(L('σ-配合物','σ-complex'),X(0.40)-18,Y(0.58)+14);
  // 动点
  const dx=X(phaseX()),dy=Y(curveY(EAS_PTS,phaseX()));
  ctx.fillStyle='#ffa94d';ctx.beginPath();ctx.arc(dx,dy,5.5,0,7);ctx.fill();
  ctx.strokeStyle=dark?'#fff':'#333';ctx.stroke();
}

/* ---- 读数 ---- */
function fmtRate(v){
  if(v>=100)return v.toFixed(0)+'×';
  if(v>=1)return v.toFixed(1)+'×';
  const e=Math.floor(Math.log10(v));
  return (v/Math.pow(10,e)).toFixed(1)+'e'+e+'×';
}
function siteName(){
  if(target<0)return '—';
  const rel=((target-0)+6)%6;
  return rel===3?L('对位 para','para'):((rel===1||rel===5)?L('邻位 ortho','ortho'):L('间位 meta','meta'));
}
function updateStats(){
  const r=netRate();
  const el=document.getElementById('stRate');
  el.innerHTML=fmtRate(r);el.className='v'+(stalled?' warn':(r>10?' ok':''));
  document.getElementById('stEa').innerHTML=eaEff().toFixed(0)+'<small> kJ/mol</small>';
  document.getElementById('stSite').textContent=siteName();
  document.getElementById('stN').textContent=nCount;
}

/* ---- 相机推进逻辑 ---- */
const atkDir=()=>posOn(Math.max(target,0),1);
function setBond(from,to){
  const d=to.clone().sub(from),len=Math.max(d.length(),0.01);
  atkBond.position.copy(from).addScaledVector(d,0.5);
  atkBond.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  atkBond.scale.set(1,len,1);
}
function applyPhaseState(dt){
  const t=phaseT;
  const tp=posOn(target,RC),dir=tp.clone().normalize();
  const Npos=dir.clone().multiplyScalar(RC+1.05);
  if(phase===0){
    no2p.visible=t>0.25;
    no2p.position.set(5.4,3.4,0);
    atkBond.visible=false;base.visible=false;
  }else if(phase===1){
    no2p.visible=true;base.visible=false;atkBond.visible=false;
    const k=Math.min(t/1.1,1);
    no2p.position.lerpVectors(new THREE.Vector3(5.4,3.4,0),Npos,k*k*(3-2*k));
  }else if(phase===2){
    no2p.visible=true;atkBond.visible=true;
    no2p.position.copy(Npos);
    setBond(tp,Npos);
    piM.opacity=0.95-0.83*Math.min(t/0.8,1);
    cAtoms[target].position.z=0.55*Math.min(t/0.8,1);
  }else if(phase===3){
    no2p.visible=true;atkBond.visible=true;base.visible=t>0.15;
    no2p.position.copy(Npos);setBond(tp,Npos);
    piM.opacity=0.12;cAtoms[target].position.z=0.55;
    const hp=hAtoms[target].position;
    const bp=new THREE.Vector3(4.9,-3.2,0);
    const k=Math.min(t/1.3,1);
    if(k<0.45){base.position.lerpVectors(new THREE.Vector3(5.6,-3.6,0),hp.clone().add(new THREE.Vector3(0.55,0.4,0)),k/0.45);}
    else{
      base.position.lerpVectors(hp.clone().add(new THREE.Vector3(0.55,0.4,0)),bp,(k-0.45)/0.55);
      hAtoms[target].position.lerpVectors(tp.clone().add(dir.clone().multiplyScalar(RH-RC)),base.position,Math.min(1,(k-0.45)/0.3));
    }
  }else if(phase===4){
    base.visible=true;atkBond.visible=true;
    base.position.lerp(new THREE.Vector3(6.2,-4.0,0),0.08);
    hAtoms[target].position.copy(base.position);
    const back=1-Math.min(t/0.7,1);
    piM.opacity=0.95-0.83*back;
    cAtoms[target].position.z=0.55*back;
    const pulse=1+0.28*Math.max(0,Math.sin(Math.min(t/0.7,1)*Math.PI));
    piCloud.scale.setScalar(pulse);
  }else{
    base.visible=false;atkBond.visible=true;
    no2p.position.copy(Npos);setBond(tp,Npos);
    piM.opacity=0.95;cAtoms[target].position.z=0;
    piCloud.scale.setScalar(1);
  }
}
function resetRound(){
  phase=0;phaseT=0;
  no2p.visible=false;atkBond.visible=false;base.visible=false;
  piM.opacity=0.95;piCloud.scale.setScalar(1);
  hAtoms.forEach((h,i)=>{h.position.copy(posOn(i,RH));});
  cAtoms.forEach(c=>c.position.z=0);
  base.position.set(5.6,-3.6,0);
  pickTarget();stalled=false;
}
function finishRound(){
  taken.add(target);nCount++;
  hAtoms[target].visible=false;             // 该位 H 已被硝基替换
  const g=no2p.clone();g.visible=true;scene.add(g);   // 留下的硝基
  attachedGroups.push(g);
  if(nCount>=3||!SUBS[sub].dir.some(i=>!taken.has(i))){
    taken.clear();nCount=0;
    attachedGroups.forEach(g=>scene.remove(g));attachedGroups.length=0;
    hAtoms.forEach((h,i)=>{h.visible=true;h.position.copy(posOn(i,RH));});
  }
}
const attachedGroups=[];
function setSub(s){
  sub=s;taken.clear();nCount=0;
  attachedGroups.forEach(g=>scene.remove(g));attachedGroups.length=0;
  hAtoms.forEach((h,i)=>{h.visible=true;h.position.copy(posOn(i,RH));});
  buildSubstituent(s);
  document.querySelectorAll('[data-sub]').forEach(b=>b.classList.toggle('on',b.dataset.sub===s));
  resetRound();updateStats();drawPlot();
}

/* ---- 事件 ---- */
document.querySelectorAll('[data-sub]').forEach(b=>b.addEventListener('click',()=>setSub(b.dataset.sub)));
document.getElementById('btnRestart').addEventListener('click',()=>{setSub(sub);playing=true;syncPlayBtn();});
document.getElementById('sTemp').addEventListener('input',e=>{tempC=+e.target.value;document.getElementById('sTempVal').textContent=tempC+'°C';updateStats();drawPlot();});
document.getElementById('sSpd').addEventListener('input',e=>{speedK=+e.target.value/100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  bgM.color.setHex(dark?0x1c2027:0xc9c2b6);
  drawPlot();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();updateStats();drawPlot();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
const PHASE_DUR=[1.6,1.2,2.2,1.7,1.2,1.8];
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    const r=netRate();
    stalled=r<0.002;                       // 停滞判据：相对速率过低
    if(!stalled){
      const rateK=clamp(0.4+0.5*Math.log10(1+r*4),0.3,3.2)*speedK;
      phaseT+=dt*rateK;
      if(phaseT>=PHASE_DUR[phase]){
        phaseT=0;phase++;
        if(phase===4){/* 恢复瞬间 */}
        if(phase>5){finishRound();resetRound();pickTarget();}
      }
    }
  }
  applyPhaseState(dt);
  siteMarks.forEach((mk,idx)=>{
    const valid=SUBS[sub].dir.includes(mk.i)&&!taken.has(mk.i)&&!stalled;
    mk.m.visible=valid;
    if(valid){mk.m.material.emissiveIntensity=0.5+0.5*Math.sin(simT*4+idx*1.7);mk.m.rotation.z+=dt*0.8;}
  });
  acc+=dt;if(acc>0.1){acc=0;updateStats();drawPlot();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
applyTheme();buildSteps();
buildSubstituent(sub);pickTarget();
{ // 首屏预演：σ-配合物已在进行中（招牌画面预热）
  phase=1;phaseT=1.0;applyPhaseState(0.016);
  phase=2;phaseT=0.4;
}
updateStats();drawPlot();syncPlayBtn();start();
</script>
</body>
