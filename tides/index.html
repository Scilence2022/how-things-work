<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮汐 · 引力差把海顶出两个隆起</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#05070d; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#e6ecf4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.gr { border-color: rgba(123,216,143,.9); color: #b8f0c6; }
  .lbl.st { border-color: rgba(255,209,102,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { color: #9c6f00; }
  :root[data-theme="light"] .lbl.b { color: #0c6ba0; }
  :root[data-theme="light"] .lbl.gr { color: #2c7a3f; }
  :root[data-theme="light"] .lbl.st { color: #9c6f00; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    max-width: 640px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: var(--acc); }

  #chartWrap { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    padding: 8px 10px 6px; backdrop-filter: blur(6px); }
  #chart { display: block; width: 384px; height: 132px; }
  @media (max-width: 1180px) { #chartWrap { display: none; } }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--tool-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.b { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .chip.g { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.gr { color: #b8f0c6; border-color: rgba(123,216,143,.7); }
  :root[data-theme="light"] .chip.b { color: #0c6ba0; border-color: rgba(12,107,160,.6); }
  :root[data-theme="light"] .chip.g { color: #9c6f00; border-color: rgba(156,111,0,.55); }
  :root[data-theme="light"] .chip.gr { color: #2c7a3f; border-color: rgba(44,122,63,.55); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 74px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="潮汐:引力差把海顶出两个隆起" data-en="Tides: the gravity difference raises two bulges">潮汐:引力差把海顶出两个隆起</h1>
  <div class="sub" data-zh="金箭头 = 每点的月球引力减去地心那份,近月远月两坨隆起等高——1/d³ 梯度现场拆解;地球自转带着测潮仪一天两穿隆起(12h25m),日月同线大潮、成 90° 小潮;潮汐摩擦把月球每年推远 3.8 cm · 可拖月球与绿色测潮仪 / 空格播放暂停" data-en="Gold arrows = the Moon's pull minus Earth-center's share at each point — two equal bulges, the 1/d³ gradient dissected live; Earth's spin sweeps a gauge through both bulges a day (12 h 25 m apart); spring at alignment, neap at 90°; tidal friction nudges the Moon 3.8 cm/yr away · drag the Moon & the green gauge / Space = play-pause">金箭头 = 每点的月球引力减去地心那份,近月远月两坨隆起等高——1/d³ 梯度现场拆解;地球自转带着测潮仪一天两穿隆起(12h25m),日月同线大潮、成 90° 小潮;潮汐摩擦把月球每年推远 3.8 cm · 可拖月球与绿色测潮仪 / 空格播放暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="潮差倍数" data-en="tidal range">潮差倍数</span><span class="v g" id="stRange">—</span>
  <span class="k" data-zh="日月角" data-en="sun–moon angle">日月角</span><span class="v" id="stElong">—</span>
  <span class="k" data-zh="高潮间隔" data-en="high-tide gap">高潮间隔</span><span class="v" id="stInterval">—</span>
  <span class="k" data-zh="月球退行速率" data-en="lunar recession">月球退行速率</span><span class="v" id="stRec">—</span>
  <span class="k" data-zh="地球日变长" data-en="day lengthening">地球日变长</span><span class="v" id="stDay">—</span>
</div>

<div id="chartWrap"><canvas id="chart"></canvas></div>

<div id="panel">
  <div id="legend">
    <span class="chip b" data-zh="水层隆起(蓝壳)" data-en="ocean bulge (blue shell)">水层隆起(蓝壳)</span>
    <span class="chip g" data-zh="引潮力箭头(金)" data-en="tidal force arrows (gold)">引潮力箭头(金)</span>
    <span class="chip gr" data-zh="测潮点(绿·可拖)" data-en="tide gauge (green · draggable)">测潮点(绿·可拖)</span>
  </div>
  <div class="row"><label data-zh="日月角(拖月球亦可)" data-en="sun–moon angle (or drag Moon)">日月角(拖月球亦可)</label><input id="elong" type="range" min="0" max="360" step="1" value="0"><span class="val" id="elongVal">0°</span></div>
  <div class="row"><label data-zh="潮汐摩擦(拖角夸张)" data-en="tidal friction (lead ×4)">潮汐摩擦(拖角夸张)</label><input id="fric" type="range" min="0" max="100" step="5" value="0"><span class="val" id="fricVal">0 %</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglArrows" type="checkbox" checked> <span data-zh="引潮力箭头" data-en="force arrows">引潮力箭头</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="潮位曲线" data-en="tide chart">潮位曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../moon-phases/" data-zh="同一个日月角:月相与日月食" data-en="the same angle: moon phases & eclipses">同一个日月角:月相与日月食</a>
    <a href="../orbital-mechanics/" data-zh="月球轨道为何外扩:开普勒轨道" data-en="why the orbit grows: Kepler orbits">月球轨道为何外扩:开普勒轨道</a>
    <a href="../black-hole-tides/" data-zh="同款 1/d³ 梯度:黑洞撕扯" data-en="same 1/d³ gradient: black-hole tides">同款 1/d³ 梯度:黑洞撕扯</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const TAU = Math.PI * 2;
const P2 = c => (3 * c * c - 1) / 2;
const norm = a => ((a % TAU) + TAU) % TAU;

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xe6ecf4 : 0x05070d);
  starMat.opacity = THEME === 'dark' ? 0.7 : 0;
  planeGrid.material.opacity = THEME === 'dark' ? 0.3 : 0.42;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('潮汐 · 引力差把海顶出两个隆起', 'Tides · the gravity difference raises two bulges');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  syncFricVal();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(2.6, 3.0, 7.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x232830, 0.55));
const sunLight = new THREE.PointLight(0xfff3d0, 1.6, 0, 0);
scene.add(sunLight);

const starMat = new THREE.MeshBasicMaterial({ color: 0xcfd8ea, transparent: true, opacity: 0.7 });
{
  const g = new THREE.IcosahedronGeometry(0.04, 0);
  const stars = new THREE.InstancedMesh(g, starMat, 240);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < 240; i++) {
    const a = Math.random() * TAU, b = Math.acos(2 * Math.random() - 1), r = 20 + Math.random() * 22;
    p.set(Math.sin(b) * Math.cos(a) * r, Math.cos(b) * r * 0.7, Math.sin(b) * Math.sin(a) * r);
    const k = 0.5 + Math.random() * 1.2;
    s.set(k, k, k);
    m.compose(p, q, s);
    stars.setMatrixAt(i, m);
  }
  scene.add(stars);
}
const planeGrid = new THREE.PolarGridHelper(9, 8, 5, 64, 0x3a4a5e, 0x232e3c);
planeGrid.material.transparent = true;
scene.add(planeGrid);

const SUN_R = 8.6;
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.55, 28, 20),
  new THREE.MeshBasicMaterial({ color: 0xffd166 }));
sun.position.set(SUN_R, 0, 0);
scene.add(sun);
sunLight.position.copy(sun.position);
function haloTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,220,130,1)');
  grd.addColorStop(0.35, 'rgba(255,190,90,.45)');
  grd.addColorStop(1, 'rgba(255,170,60,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const haloTex = haloTexture();
for (const [sc, op] of [[2.6, 0.85], [4.4, 0.4]]) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: op }));
  sp.scale.set(sc, sc, 1);
  sp.position.copy(sun.position);
  scene.add(sp);
}

const spinGrp = new THREE.Group();
scene.add(spinGrp);
const earth = new THREE.Mesh(new THREE.SphereGeometry(1.0, 48, 32),
  new THREE.MeshStandardMaterial({ color: 0x24507e, roughness: 0.75, metalness: 0.05 }));
spinGrp.add(earth);
{
  const g = new THREE.SphereGeometry(1, 8, 6);
  const land = new THREE.InstancedMesh(g, new THREE.MeshStandardMaterial({ color: 0x4c9a5f, roughness: 0.9 }), 110);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), p = new THREE.Vector3(), s = new THREE.Vector3();
  for (let i = 0; i < 110; i++) {
    const y = 1 - (i + 0.5) / 110 * 2, r = Math.sqrt(1 - y * y), a = i * 2.39996;
    p.set(Math.cos(a) * r, y, Math.sin(a) * r);
    q.setFromUnitVectors(up, p);
    const k = 0.05 + ((i * 37) % 10) / 10 * 0.055;
    s.set(k, k * 0.32, k);
    m.compose(p.clone().multiplyScalar(0.995), q, s);
    land.setMatrixAt(i, m);
  }
  spinGrp.add(land);
}
const axis = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 2.7, 8),
  new THREE.MeshBasicMaterial({ color: 0x8fa3b8 }));
spinGrp.add(axis);
const markerGrp = new THREE.Group();
spinGrp.add(markerGrp);
const marker = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10),
  new THREE.MeshBasicMaterial({ color: 0x7bd88f }));
marker.position.set(1.02, 0, 0);
markerGrp.add(marker);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.3, 6),
  new THREE.MeshBasicMaterial({ color: 0x7bd88f }));
pole.position.set(1.16, 0, 0);
pole.rotation.z = Math.PI / 2;
markerGrp.add(pole);

const W_BASE = 1.1, W_AMP = 0.12;
const waterGeo = new THREE.SphereGeometry(W_BASE, 72, 48);
const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({
  color: 0x4aa3e0, roughness: 0.15, metalness: 0.05, transparent: true, opacity: 0.55,
  emissive: 0x0b2a44, emissiveIntensity: 0.35 }));
scene.add(water);
const wPos = waterGeo.attributes.position;
const wDirs = new Float32Array(wPos.count * 3);
{
  const v = new THREE.Vector3();

const samples = [];
let lastSamp = -1;
function tideAtTime(tt) {
  const dA = tH - tt;
  const aG = angE + gLon - dA * OM_E;
  const aB = angM + leadRad() - dA * OM_M;
  return { h: tideValue(aG, aB), m: H_M * P2(Math.cos(aG - aB)) };
}
function prefill() {
  samples.length = 0;
  for (let k = 480; k >= 1; k--) {
    const t = tH - k * 0.1;
    samples.push({ t, ...tideAtTime(t) });
  }
  lastSamp = samples[samples.length - 1].t;
}
function findPeaks() {
  const pk = [];
  for (let i = 1; i < samples.length - 1; i++) {
    const s = samples[i];
    if (s.h > 0.12 && s.h >= samples[i - 1].h && s.h > samples[i + 1].h) {
      if (pk.length && s.t - pk[pk.length - 1].t < 8) {
        if (s.h > pk[pk.length - 1].h) pk[pk.length - 1] = s;
      } else pk.push(s);
    }
  }
  return pk;
}

const chartCv = document.getElementById('chart');
const chartCtx = chartCv.getContext('2d');
const CW = 384, CH = 132;
function drawChart() {
  const dpr = Math.min(devicePixelRatio, 2);
  if (chartCv.width !== CW * dpr) { chartCv.width = CW * dpr; chartCv.height = CH * dpr; }
  const g = chartCtx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, CW, CH);
  const dark = THEME === 'dark';
  const ink = dark ? '#9fb0c3' : '#5b6b7d';
  const gold = dark ? '#ffd166' : '#b0761f';
  const blue = dark ? 'rgba(116,192,252,.55)' : 'rgba(12,107,160,.5)';
  const x0 = 34, x1 = CW - 8, y0 = 16, y1 = CH - 18, midY = (y0 + y1) / 2;
  const t1 = tH, t0 = t1 - 48;
  const X = t => x0 + (t - t0) / 48 * (x1 - x0);
  const Y = h => midY - clamp(h / 0.65, -1.05, 1.05) * (midY - y0 - 2);
  g.font = '10px system-ui, sans-serif';
  g.fillStyle = ink;
  g.fillText(L('潮位 m · 金=日月合成 蓝=仅月球', 'sea level m · gold=Sun+Moon blue=Moon only'), x0, 11);
  g.strokeStyle = 'rgba(128,140,155,.28)';
  g.lineWidth = 1;
  for (let t = Math.ceil(t0 / 12) * 12; t <= t1; t += 12) {
    g.beginPath(); g.moveTo(X(t), y0); g.lineTo(X(t), y1); g.stroke();
    g.fillText(`${((Math.round(t) % 24) + 24) % 24}h`, X(t) - 6, y1 + 11);
  }
  g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(x0, midY); g.lineTo(x1, midY); g.stroke();
  g.setLineDash([]);
  g.fillText('+0.5', 4, Y(0.5) + 3);
  g.fillText('−0.5', 4, Y(-0.5) + 3);
  const n = samples.length;
  if (n > 1) {
    const stride = Math.max(1, Math.floor(n / 420));
    g.beginPath();
    let started = false;
    for (let i = 0; i < n; i += stride) {
      const s = samples[i];
      if (s.t < t0) continue;
      const x = X(s.t), y = Y(s.m);
      if (!started) { g.moveTo(x, y); started = true; } else g.lineTo(x, y);
    }
    g.strokeStyle = blue;
    g.lineWidth = 1.1;
    g.stroke();
    g.beginPath();
    started = false;
    for (let i = 0; i < n; i += stride) {
      const s = samples[i];
      if (s.t < t0) continue;
      const x = X(s.t), y = Y(s.h);
      if (!started) { g.moveTo(x, y); started = true; } else g.lineTo(x, y);
    }
    g.strokeStyle = gold;
    g.lineWidth = 1.8;
    g.stroke();
    g.lineTo(X(t1), midY);
    g.closePath();
    g.fillStyle = dark ? 'rgba(255,209,102,.10)' : 'rgba(176,118,31,.10)';
    g.fill();
  }
  const pk = findPeaks().filter(s => s.t >= t0);
  g.fillStyle = gold;
  for (const s of pk) {
    g.beginPath(); g.arc(X(s.t), Y(s.h), 2.6, 0, Math.PI * 2); g.fill();
  }
  lastGap = 0;
  if (pk.length >= 2) {
    const gaps = [];
    for (let i = 1; i < pk.length; i++) gaps.push(pk[i].t - pk[i - 1].t);
    lastGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    g.fillText(`Δt ≈ ${lastGap.toFixed(1)} h`, x1 - 64, 11);
  }
}

  arrowsGrp.visible = showArrows;
  if (showArrows) {
    vG.set(Math.cos(angM), 0, -Math.sin(angM)).multiplyScalar(1 / (D_PHYS * D_PHYS));
    for (let i = 0; i < 12; i++) {
      const b = i / 12 * TAU;
      vP.set(Math.cos(b), 0, -Math.sin(b));
      vM.set(Math.cos(angM) * D_PHYS, 0, -Math.sin(angM) * D_PHYS).sub(vP);
      const r = vM.length();
      vT.copy(vM).multiplyScalar(1 / (r * r * r)).sub(vG);
      const len = 0.55 * Math.log10(1 + vT.length() / 2.5e-6);
      const a = tideArrows[i];
      a.position.copy(vP).multiplyScalar(Math.max(waterRadius(vP.x, 0, vP.z, vB.x, 0, vB.z) + 0.03, 1.02));
      a.setDirection(vT.normalize());
      a.setLength(len, len * 0.32, len * 0.18);
    }
  }
  const wA = norm(aB + Math.PI / 2);
  lblNear.position.copy(vB).multiplyScalar(1.66);
  lblNear.position.y += 0.42;
  lblFar.position.copy(vB).multiplyScalar(-1.66);
  lblFar.position.y += 0.42;
  vW.set(Math.cos(wA), 0, -Math.sin(wA)).multiplyScalar(1.3);
  lblWaist.position.copy(vW);
  const fricOn = fric > 0.02;
  leadArc.visible = fricOn;
  torqueArrow.visible = fricOn;
  if (fricOn) {
    for (let i = 0; i <= 12; i++) {
      const a = angM + leadRad() * i / 12;
      leadArcPts[i * 3] = Math.cos(a) * 1.55;
      leadArcPts[i * 3 + 1] = 0;
      leadArcPts[i * 3 + 2] = -Math.sin(a) * 1.55;
    }
    leadArcGeo.attributes.position.needsUpdate = true;
    lblLead.position.copy(vB).multiplyScalar(1.95);
    lblLead.position.y += 0.72;
    torqueArrow.position.copy(moonGrp.position);
    torqueArrow.setDirection(vT.set(-Math.sin(angM), 0, -Math.cos(angM)));
  }
  const p = phiDeg();
  if (document.activeElement !== elElong && !dragMode) elElong.value = Math.round(p);
  elElongVal.textContent = `${Math.round(p)}° ${phaseName(p)}`;
  const rf = rangeFactor();
  const kind = rf > 1.2 ? L('大潮', 'spring') : rf < 0.75 ? L('小潮', 'neap') : L('过渡', 'mid');
  document.getElementById('stRange').innerHTML = `${rf.toFixed(2)}<small>× · ${kind}</small>`;
  document.getElementById('stElong').innerHTML = `${Math.round(p)}°<small> ${phaseName(p)}</small>`;
  document.getElementById('stInterval').innerHTML =
    `${(lastGap > 0 ? lastGap : 12 / (1 - 1 / SYN)).toFixed(1)}<small> h · ${L('太阴日', 'lunar day')} 24h50m</small>`;
  document.getElementById('stRec').innerHTML = fricOn
    ? `3.8<small> cm/${L('年', 'yr')} · ${L('激光实测', 'laser-ranging')}</small>`
    : `—<small> ${L('摩擦已关', 'friction off')}</small>`;
  document.getElementById('stDay').innerHTML = fricOn
    ? `+2.3<small> ms/${L('世纪', 'century')}</small>`
    : `—<small> ${L('摩擦已关', 'friction off')}</small>`;
}

const clock = new THREE.Clock();
let lastStep = -1, rafId = 0, chartAcc = 1;
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing && dts > 0) {
    const dtH = dts * 24 / T_DAY;
    tH += dtH;
    angE = norm(angE + dtH * OM_E);
    if (dragMode !== 1) angM = norm(angM + dtH * OM_M);
    if (fric > 0) accumCm += 3.8 * fric * dtH / (24 * 365.25);
    if (tH - lastSamp > 0.06) {
      const aG = angE + gLon;
      samples.push({ t: tH, h: tideValue(aG, angM + leadRad()), m: H_M * P2(Math.cos(aG - angM - leadRad())) });
      lastSamp = tH;
      while (samples.length && samples[0].t < tH - 48) samples.shift();
    }
  }
  if (camAnim) {
    camAnim.k += dt / 1.1;
    const s = (k => k * k * (3 - 2 * k))(clamp(camAnim.k, 0, 1));
    camera.position.lerpVectors(camAnim.fp, camAnim.tp, s);
    controls.target.lerpVectors(camAnim.ft, camAnim.tt, s);
    if (camAnim.k >= 1) camAnim = null;
  }
  apply();
  for (const r of labelReg) {
    r.o.element.textContent = r.text();
    r.o.visible = showLabels && r.vis();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  chartAcc += dt;
  if (chartAcc > 0.12) { chartAcc = 0; if (chartOn) drawChart(); }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (rafId === 0 && !document.hidden) { clock.getDelta(); rafId = requestAnimationFrame(frame); } }
function stop() { if (rafId !== 0) { cancelAnimationFrame(rafId); rafId = 0; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elFric.value = Math.round(fric * 100);
syncFricVal();
tglLabels.checked = showLabels;
tglArrows.checked = showArrows;
tglChart.checked = chartOn;
if (!chartOn) document.getElementById('chartWrap').style.display = 'none';
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
prefill();
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
</body>
</html>
