<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>玻璃与玻璃化 · 冻住的就是命运</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #vt{width:100%;height:120px;display:block;border:1px solid var(--panel-border);border-radius:8px;margin-top:8px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="玻璃与玻璃化 · 冻住的就是命运" data-en="Glass &amp; Vitrification · frozen is fate">玻璃与玻璃化 · 冻住的就是命运</h1>
  <div class="sub" data-zh="120 颗原子面对熔点分岔:慢冷→成核生长排成晶格闪亮并放潜热,快冷→粘度冲过 10¹² Pa·s、位形被冻住成 Tg;看 V-T 曲线两种命运,退火消应力 · 拖动旋转 / 空格运行/暂停" data-en="120 atoms face the melting-point fork: slow cooling nucleates a shining lattice (latent heat), fast cooling freezes disorder at Tg as viscosity passes 10¹² Pa·s; watch the V-T curve split fates, anneal to relax stress · drag to orbit / Space = run/pause">120 颗原子面对熔点分岔:慢冷→成核生长排成晶格闪亮并放潜热,快冷→粘度冲过 10¹² Pa·s、位形被冻住成 Tg;看 V-T 曲线两种命运,退火消应力 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="温度" data-en="Temperature">温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="粘度 η" data-en="Viscosity">粘度 η</span><span class="v" id="stV">—</span>

    <label data-zh="降温速率" data-en="Cooling rate">降温速率</label>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- 工具 / 主题 / 语言 / URL 参数 ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const gauss=()=>Math.random()+Math.random()+Math.random()-1.5;

/* ---------- 物理常数(钠钙玻璃,示意标定) ----------
   Tm≈1000 °C(结晶分岔);Tg 定义:η=10¹² Pa·s
   VFT:η=3e-3·exp(8840/(T-560)) Pa·s → Tg≈550 °C,1400 °C 时 η≈8 Pa·s */
const TM=1000, TG=550;

/* ---------- 渲染器 / 场景 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(0,0,6.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.5;controls.maxDistance=18;controls.autoRotateSpeed=0.4;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.7));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(3,5,7);scene.add(key);

/* 粒子盒边框 */
const edgeM=new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.5});
const boxEdges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(6,4,0.9)),edgeM);
scene.add(boxEdges);

/* ---------- 120 颗原子:InstancedMesh ---------- */
const N=120;
const inst=new THREE.InstancedMesh(new THREE.SphereGeometry(0.085,10,8),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.35,metalness:0.15}),N);
inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(inst);
const dummy=new THREE.Object3D(),col=new THREE.Color();
/* 改性离子(Na⁺/Ca²⁺):大颗,永远排不进晶格 */
const NM=10,mods=[];
const modM=new THREE.MeshStandardMaterial({color:0x51cf66,roughness:0.4,emissive:0x2b8a3e,emissiveIntensity:0.3});
for(let i=0;i<NM;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.135,14,10),modM);
  m.visible=false;scene.add(m);
  mods.push({m,x:0,y:0});
}

/* ---------- 晶格位点(三角)与分配 ---------- */
const sites=[];
for(let r=0;r<14;r++){
  const y=-1.75+r*0.235;
  for(let c=0;c<21;c++){
    const x=-2.75+c*0.27+(r%2?0.135:0);
    if(y>1.8)continue;
    sites.push([x,y]);
  }
}
while(sites.length>N)sites.splice(Math.floor(Math.random()*sites.length),1);
let assign=new Int16Array(N);
const px=new Float64Array(N),py=new Float64Array(N);
function scramble(){
  for(let i=0;i<N;i++){px[i]=(Math.random()*2-1)*2.8;py[i]=(Math.random()*2-1)*1.8;}
  const used=new Uint8Array(N);
  for(let i=0;i<N;i++){ // 贪心:每颗原子认领最近空位(成核模板)
    let best=-1,bd=1e9;
    for(let s=0;s<N;s++){
      if(used[s])continue;
      const dx=sites[s][0]-px[i],dy=sites[s][1]-py[i],d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=s;}
    }
    assign[i]=best;used[best]=1;
  }
}

/* ---------- 状态 ---------- */
let playing=!(qs.get('pause')==='1');
let speed=clamp(parseFloat(qs.get('speed'))||1,0.2,3);
let T=1250,rate=40,cf=0,order=0,stress=0,stressScale=1;
let annealT=0,modOn=false,labelsOn=true,simT=0,trail=[],trailAcc=0;
scramble();

/* ---------- 标签 ---------- */
const labelReg=[];
function addLabel(fn,pos,cls='',visFn){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,fn,vis:visFn||(()=>true)});return o;
}
addLabel(()=>L('120 颗原子 · 粒子盒','120 atoms · particle box'),new THREE.Vector3(0,2.45,0),'b');
const lblStatus=addLabel(()=>{
  if(T>TM)return L('熔体:原子乱跑,η 只有几 Pa·s','melt: atoms roam, η a few Pa·s');
  if(T>TG)return cf>0.08?L('过冷液体:成核+生长,排位中(放潜热,降温变慢)','supercooled: nucleating & growing (latent heat slows cooling)')
    :L('过冷液体:还来得及排位……','supercooled liquid: still time to order…');
  return cf>0.5?L('晶体:晶格完成,闪亮,体积跳变','crystal: lattice done, shining, volume jumps')
    :L('玻璃:η≥10¹² Pa·s,位形被冻住 → Tg','glass: η≥10¹² Pa·s, configuration frozen → Tg');
},new THREE.Vector3(0,-2.55,0),'o');

/* ---------- V-T 曲线 ---------- */
const vt=document.getElementById('vt'),vtx=vt.getContext('2d');
function drawVT(){
  const W=vt.width,H=vt.height;
  vtx.clearRect(0,0,W,H);
  const X=t=>8+(1400-t)/1400*(W-16);   // 左 1400 °C → 右 0 °C
  const Y=v=>112-(v-0.995)/0.12*100;   // V 0.995..1.115
  const dark=THEME==='dark';
  vtx.strokeStyle=dark?'rgba(255,255,255,.25)':'rgba(15,25,40,.3)';
  vtx.lineWidth=1;
  vtx.strokeRect(0.5,0.5,W-1,H-1);
  /* Tm / Tg 竖线 */
  vtx.setLineDash([4,3]);
  vtx.strokeStyle=dark?'rgba(255,107,107,.55)':'rgba(201,42,42,.55)';
  vtx.beginPath();vtx.moveTo(X(TM),8);vtx.lineTo(X(TM),H-14);vtx.stroke();
  vtx.strokeStyle=dark?'rgba(116,192,252,.55)':'rgba(24,100,171,.55)';
  vtx.beginPath();vtx.moveTo(X(TG),8);vtx.lineTo(X(TG),H-14);vtx.stroke();
  vtx.setLineDash([]);
  vtx.fillStyle=dark?'#9fb0c3':'#5b6b7d';vtx.font='10px sans-serif';vtx.textAlign='center';
  vtx.fillText('Tm 1000',X(TM),H-4);vtx.fillText('Tg≈550',X(TG),H-4);
  /* 轨迹 */
  if(trail.length>1){
    vtx.strokeStyle='#ffa94d';vtx.lineWidth=2;vtx.beginPath();
    trail.forEach((p,i)=>{const x=X(p.t),y=Y(p.v);i?vtx.lineTo(x,y):vtx.moveTo(x,y);});
    vtx.stroke();
    const cur=trail[trail.length-1];
    vtx.fillStyle='#fff';vtx.beginPath();vtx.arc(X(cur.t),Y(cur.v),3,0,7);vtx.fill();
  }
  vtx.fillStyle=dark?'#9fb0c3':'#5b6b7d';vtx.textAlign='left';
  vtx.fillText('V',10,12);vtx.textAlign='right';vtx.fillText('T→',W-10,12);
}

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
  drawVT();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('玻璃与玻璃化 · 冻住的就是命运','Glass & Vitrification');
  buildSteps();updateStats();drawVT();
}

/* ---------- 步骤 ---------- */
const STEPS=[
 {b:'熔体:原子乱跑',be:'The melt: atoms roam',
  d:'1400 °C 的熔体里,原子每秒换无数次邻居,粘度只有几 Pa·s——位形完全没定下来。',
  de:'At 1400 °C atoms swap neighbours constantly; viscosity is a few Pa·s, nothing is fixed.',
  act:()=>{remelt();}},
 {b:'熔点分岔:排位 or 冻住',be:'The fork at Tm: order or freeze',
  d:'降到熔点,命运分岔:成核-生长来得及,就排位结晶;冷得比成核快,就带着乱位形往下走。',
  de:'At Tm the fates split: if nucleation can keep up, crystals grow; else the disorder is carried down.',
  act:()=>{setRate(40);remelt();}},
 {b:'慢冷:晶格闪亮+潜热平台',be:'Slow cooling: shining lattice, latent plateau',
  d:'慢冷时原子滑进晶格位,释放潜热——V-T 曲线在 Tm 出现拐点与体积跳变。',
  de:'Slow cooling lets atoms glide onto lattice sites, releasing latent heat — a kink and volume drop at Tm.',
  act:()=>{setRate(15);remelt();}},
 {b:'快冷:粘度冻结 → Tg',be:'Fast cooling: viscosity freezes it → Tg',
  d:'冷得快过成核:粘度沿 VFT 曲线飙升,冲过 10¹² Pa·s 时位形被冻住——这就是 Tg,玻璃诞生。',
  de:'Cool faster than nuclei can form: viscosity rockets past 10¹² Pa·s and the configuration locks — Tg.',
  act:()=>{setRate(320);remelt();}},
 {b:'透明的原因',be:'Why glass is transparent',
  d:'没有晶界散射(非晶连续)+ 电子带隙宽过可见光子能量 → 光直穿不吸不散。',
  de:'No grain boundaries to scatter, and a band gap wider than visible photons: light passes straight through.',
  act:()=>{setRate(320);}},
 {b:'退火:消掉表面应力',be:'Annealing relaxes the stress',
  d:'快冷玻璃表层是压不匀的应力网,一碰就炸;回火到 Tg 附近让原子微调位形,应力消退。',
  de:'Fast-cooled glass carries a stressed skin that shatters on cue; soak near Tg and atoms settle it away.',
  act:()=>{startAnneal();}},
];
let activeStep=0;
function stepIndex(){
  if(annealT>0)return 5;
  if(T>TM)return 0;
  if(T>TG)return cf>0.08?2:1;
  return cf>0.5?2:3;
}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps(true);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(manual){
  const si=manual?activeStep:stepIndex();
  if(!manual)activeStep=si;
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===si));
}
function setRate(r){
  rate=r;
  const v=Math.round(Math.log10(r/5)*50);
  document.getElementById('sRate').value=clamp(v,0,100);
  document.getElementById('sRateVal').textContent=(r<10?r.toFixed(1):r.toFixed(0))+' K/s';
}
function remelt(){
  T=1400;cf=0;stressScale=1;trail=[];annealT=0;
  scramble();
  if(modOn)placeMods();
}
function placeMods(){
  for(const md of mods){md.x=(Math.random()*2-1)*2.6;md.y=(Math.random()*2-1)*1.7;md.m.position.set(md.x,md.y,0.2);}
}
function startAnneal(){
  if(T>TG+40)T=Math.min(T,540);
  annealT=4;
}

/* ---------- 统计 ---------- */
function updateStats(){
  document.getElementById('stT').innerHTML=T.toFixed(0)+'<small> °C</small>';
  const TK=T+273;
  const eta=TK-560<20?Infinity:0.003*Math.exp(8840/(TK-560));
  document.getElementById('stV').innerHTML=(eta===Infinity?'≈∞':'10<sup>'+Math.log10(eta).toFixed(1)+'</sup>')+'<small> Pa·s</small>';
  document.getElementById('stX').innerHTML=(order*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stS').innerHTML=(stress*100).toFixed(0)+'<small> %</small>';
  drawVT();
}

/* ---------- 模拟:过阻尼动力学 ----------
   粒子对:近程排斥+弱吸引;成核模板:慢冷时往认领位点弹(教学简化:LJ→谐合+模板引导) */
function simStep(dt){
  const mob=T>TG?1:0.045;
  const namp=0.085*Math.sqrt(Math.max(T,10)/1400)*mob;
  const ks=cf*(T<TM?18:3);
  for(let i=0;i<N;i++){
    let fx=(sites[assign[i]][0]-px[i])*ks, fy=(sites[assign[i]][1]-py[i])*ks;
    for(let j=0;j<N;j++){
      if(j===i)continue;
      const dx=px[j]-px[i],dy=py[j]-py[i],d2=dx*dx+dy*dy;
      if(d2>0.13||d2<1e-6)continue;
      const d=Math.sqrt(d2),ux=dx/d,uy=dy/d;
      const f=d<0.24?(0.24-d)*30:-(d-0.24)*5;
      fx-=ux*f;fy-=uy*f;
    }
    px[i]=clamp(px[i]+fx*dt*1.6+gauss()*namp,-2.9,2.9);
    py[i]=clamp(py[i]+fy*dt*1.6+gauss()*namp,-1.9,1.9);
  }
  /* 改性离子:大颗慢游,卡在网络空隙里 */
  if(modOn)for(const md of mods){
    md.x=clamp(md.x+gauss()*0.02*mob,-2.7,2.7);
    md.y=clamp(md.y+gauss()*0.02*mob,-1.75,1.75);
    md.m.position.set(md.x,md.y,0.2);
  }
}
function metrics(){
  let sd=0;
  for(let i=0;i<N;i++){
    const dx=sites[assign[i]][0]-px[i],dy=sites[assign[i]][1]-py[i];
    sd+=Math.sqrt(dx*dx+dy*dy);
  }
  const md=sd/N;
  order=clamp(1-md/0.16,0,1);
  stress=clamp(md/0.16,0,1)*stressScale;
}

/* ---------- 交互 ---------- */
document.getElementById('sRate').addEventListener('input',e=>{
  const r=5*Math.pow(10,+e.target.value/50);
  rate=r;
  document.getElementById('sRateVal').textContent=(r<10?r.toFixed(1):r.toFixed(0))+' K/s';
});
document.getElementById('btnAnneal').addEventListener('click',startAnneal);
document.getElementById('btnMod').addEventListener('click',e=>{
  modOn=!modOn;
  mods.forEach(m=>m.m.visible=modOn);
  if(modOn)placeMods();
  e.currentTarget.classList.toggle('on',modOn);
});
document.getElementById('btnReset').addEventListener('click',remelt);
const elSpd=document.getElementById('sSpd');
elSpd.value=Math.round(speed*100);
elSpd.addEventListener('input',e=>{
  speed=+e.target.value/100;
  document.getElementById('sSpdVal').textContent=speed.toFixed(1)+'×';
});
const elPlay=document.getElementById('play');
function setPlayLabel(){elPlay.textContent=playing?L('暂停','Pause'):L('运行','Run');}
elPlay.addEventListener('click',()=>{playing=!playing;setPlayLabel();});
const tglLabels=document.getElementById('tglLabels');
tglLabels.addEventListener('change',()=>{labelsOn=tglLabels.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{
  LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();
});
document.getElementById('themeBtn').addEventListener('click',()=>{
  THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();
});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();elPlay.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
if(qs.get('labels')==='0'){tglLabels.checked=false;labelsOn=false;}

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    /* 结晶进度:慢冷(<80 K/s)在 Tm 之下才来得及排位;改性离子卡位 → 永远结不全 */
    if(T<TM-30){
      const cap=modOn?0.3:1;
      cf=rate<80?Math.min(cap,cf+dt*0.4):Math.max(0,cf-dt*0.55);
    }
    /* 潜热:结晶放热,降温显著变慢(平台) */
    const latent=(cf>0&&cf<1&&T<TM)?0.22:1;
    /* 退火:回到 Tg 附近保温,应力位形松弛 */
    if(annealT>0){
      annealT-=dt;
      T+=(540-T)*dt*1.5;
      stressScale=Math.max(0,stressScale-dt*0.3);
    }else if(T>20)T=Math.max(20,T-rate*latent*dt*speed);
    simStep(dt/2);simStep(dt/2);
    metrics();
    /* V-T 轨迹采样 */
    trailAcc+=dt;
    if(trailAcc>0.06){
      trailAcc=0;
      const V=1+4.0e-5*T+0.055*(1-order);
      trail.push({t:T,v:V});
      if(trail.length>900)trail.shift();
    }
  }
  /* 粒子着色:晶体金光闪烁 / 玻璃白中带应力红 / 熔体灰白 */
  for(let i=0;i<N;i++){
    dummy.position.set(px[i],py[i],0);
    dummy.scale.setScalar(1);dummy.rotation.set(0,0,0);
    dummy.updateMatrix();
    inst.setMatrixAt(i,dummy.matrix);
    if(cf>0.5){
      const sh=0.5+0.14*Math.sin(simT*4+i*1.7);
      col.setHSL(0.11,0.75,sh);
    }else{
      const si=1-clamp(Math.hypot(sites[assign[i]][0]-px[i],sites[assign[i]][1]-py[i])/0.16,0,1);
      const heat=clamp((1-si)*stressScale*1.4,0,1);
      col.setRGB(0.85+heat*0.15,0.87-heat*0.45,0.9-heat*0.55);
    }
    inst.setColorAt(i,col);
  }
  inst.instanceMatrix.needsUpdate=true;
  if(inst.instanceColor)inst.instanceColor.needsUpdate=true;
  acc+=dt;if(acc>0.1){acc=0;updateStats();syncSteps();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.fn();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();setRate(40);updateStats();setPlayLabel();
if(document.hidden)stop();else start();
</script>
</body>
