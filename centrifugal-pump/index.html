<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离心泵与汽蚀 · 叶轮甩水,蜗壳收速度</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="离心泵与汽蚀" data-en="Centrifugal Pump & Cavitation">离心泵与汽蚀</h1>
  <div class="sub" data-zh="离心泵从不「吸」水:叶轮把水甩出去,眼区变低压,是大气压把水压进泵里;蜗壳流道变宽,速度头换成压强;H-Q 泵曲线与管路曲线的交点就是工况点;转速 ×2 → Q×2、H×4、P×8;当 NPSHa<NPSHr,水在叶轮眼里自己「沸腾」——气泡在高压区塌缩成微型水锤,把叶轮凿出麻点 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A centrifugal pump never sucks: the impeller flings water outward, the eye turns low-pressure, and atmospheric pressure pushes water in; the widening volute trades velocity head for pressure; the H-Q pump curve crosses the system curve at the duty point; speed ×2 gives Q×2, H×4, P×8; when NPSHa&lt;NPSHr the water boils at the eye — bubbles implode in the high-pressure zone like micro water hammers, pitting the impeller · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">离心泵从不「吸」水:叶轮把水甩出去,眼区变低压,是大气压把水压进泵里;蜗壳流道变宽,速度头换成压强;H-Q 泵曲线与管路曲线的交点就是工况点;转速 ×2 → Q×2、H×4、P×8;当 NPSHa<NPSHr,水在叶轮眼里自己「沸腾」——气泡在高压区塌缩成微型水锤,把叶轮凿出麻点 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="扬程 H" data-en="Head H">扬程 H</span><span class="v" id="stH">—</span>
  <span class="k" data-zh="流量 Q" data-en="Flow Q">流量 Q</span><span class="v" id="stQ">—</span>
  <span class="k" data-zh="轴功率 P" data-en="Shaft power P">轴功率 P</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="NPSHa / NPSHr" data-en="NPSHa / NPSHr">NPSHa / NPSHr</span><span class="v" id="stN">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v ok" id="stS">—</span>
</div>

<div id="plot">
  <h3 id="plotTitle"></h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="蓝粒=水流:眼→叶轮→蜗壳→出口" data-en="blue = water: eye → impeller → volute → outlet">蓝粒=水流:眼→叶轮→蜗壳→出口</span>
    <span class="chip.o" data-zh="蜗壳=减速增压" data-en="volute = slow down, pressurize">蜗壳=减速增压</span>
    <span class="chip.r" data-zh="白泡=汽蚀气泡(塌缩凿伤)" data-en="white = vapor bubbles (implode & pit)">白泡=汽蚀气泡(塌缩凿伤)</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnRated" data-zh="额定工况 1450 rpm" data-en="rated 1450 rpm">额定工况 1450 rpm</button>
    <button class="abtn" id="btnMax" data-zh="转速拉满 2900" data-en="max out 2900">转速拉满 2900</button>
    <button class="abtn brk" id="btnCav" data-zh="关小吸入阀(触发汽蚀)" data-en="throttle suction (cavitate)">关小吸入阀(触发汽蚀)</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="转速 N" data-en="Speed N">转速 N</label><input id="sRPM" type="range" min="600" max="2900" step="10" value="1450"><span class="val" id="sRPMVal">1450 rpm</span></div>
  <div class="row"><label data-zh="吸入液面 h_s" data-en="Suction level h_s">吸入液面 h_s</label><input id="sHS" type="range" min="-1" max="8" step="0.1" value="3"><span class="val" id="sHSVal">+3.0 m</span></div>
  <div class="row"><label data-zh="出口阀开度" data-en="Discharge valve">出口阀开度</label><input id="sV" type="range" min="0" max="100" step="1" value="100"><span class="val" id="sVVal">100 %</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cavitation/" data-zh="塌缩的微射流:空化与超空泡" data-en="collapsing micro-jets: cavitation">塌缩的微射流:空化与超空泡</a>
    <a href="../propeller/" data-zh="同一叶素理论:螺旋桨与桨距" data-en="same blade theory: propeller pitch">同一叶素理论:螺旋桨与桨距</a>
    <a href="../venturi-flow/" data-zh="伯努利兄弟:文丘里管" data-en="Bernoulli brothers: Venturi">伯努利兄弟:文丘里管</a>
    <a href="../siphon/" data-zh="大气压的 10 m 天花板:虹吸" data-en="the 10 m ceiling: siphon">大气压的 10 m 天花板:虹吸</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d161e, 30, 85);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0d161e : 0xd9e7ee);
  scene.fog.color = new THREE.Color(dark ? 0x0d161e : 0xd9e7ee);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('离心泵与汽蚀 · 叶轮甩水,蜗壳收速度', 'Centrifugal Pump & Cavitation · Impeller flings, volute collects');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
  drawPlot();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 300);
camera.position.set(8.2, 5.6, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.8, 2.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x2a3644, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(6, 10, 7);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 物理(真实单位:m、m³/h、rpm) =================
   叶轮 r₂=0.13 m,额定 N₀=1450 rpm → u₂=ωr₂=19.7 m/s,H₀=u₂²/g=39.7 m
   泵曲线(相似律换算)H(Q,N)=(N/N₀)²·H₀ − a·Q²,a=0.0011
   管路曲线 H_sys = H_st + k(阀)·Q²,H_st=6 m
   NPSHa = p₀/ρg + h_s − k_s·Q² = 10.33 + h_s − 0.00038Q²
   NPSHr = 1 + 0.32·(Q/81)²·(N/1450)^1.7(随流量与转速上升)
   轴功率 P = ρgQH/(3.6e6·η),η=0.72;相似定律 Q∝N H∝N² P∝N³ */
const G0 = 9.81, RHO = 1000, P_ATM_M = 10.33, R2 = 0.13, N_R = 1450;
const HST = 6, A_Q = 0.0011, KS = 0.00038, ETA = 0.72, KV100 = 0.004;
const NPSH_A = 1.0, NPSH_B = 0.32, Q_REF = 81;
let RPM = 1450, HS = 3, VALVE = 100, simT = 0;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let spinOn = qsBool('spin', true);

const omegaOf = n => n / 60 * 2 * Math.PI;
const u2Of = n => omegaOf(n) * R2;
const H0of = n => { const u = u2Of(n); return u * u / G0; };
const H0N = H0of(N_R);
const kvOf = v => KV100 * Math.pow(100 / Math.max(v, 8), 1.5);
const Hp = q => Math.pow(RPM / N_R, 2) * H0N - A_Q * q * q;      // 泵 H-Q 曲线
const Hsys = q => HST + kvOf(VALVE) * q * q;                      // 管路曲线
const npsHa = q => P_ATM_M + HS - KS * q * q;
const npsHr = q => NPSH_A + NPSH_B * Math.pow(Math.max(q, 1) / Q_REF, 2) * Math.pow(RPM / N_R, 1.7);
const sevOf = q => clamp((npsHr(q) - npsHa(q)) / 2.5, 0, 1);      // 汽蚀烈度 0..1
const cavH = q => Hp(q) * (1 - 0.94 * Math.pow(sevOf(q), 1.3));   // 汽蚀塌落后的有效曲线
function intersect() {                                            // 泵曲线 × 管路曲线
  const kv = kvOf(VALVE);
  const f = q => Hp(q) - (HST + kv * q * q);
  if (f(0.4) <= 0) return 0;
  let q1 = 0.4;
  for (let q = 2; q <= 240; q += 2) {
    if (f(q) < 0) {
      let a = q1, b = q;
      for (let i = 0; i < 16; i++) { const m = (a + b) / 2; f(m) > 0 ? a = m : b = m; }
      return (a + b) / 2;
    }
    q1 = q;
  }
  return 240;
}
let OP = null;
function computeOp() {                                            // 工况点(含汽蚀塌落)
  const qi = intersect();                                         // 未汽蚀交点
  const npsha = npsHa(qi), npshr = npsHr(qi);
  const sev = sevOf(qi);
  const H = Hp(qi) * (1 - 0.94 * Math.pow(sev, 1.3));
  let q = H > HST + 0.05 ? Math.sqrt((H - HST) / kvOf(VALVE)) : 0;
  if (q < 0.8) { q = 0; }
  const Hdisp = q > 0 ? H : Math.min(H, HST);
  const P = RHO * G0 * q * Hdisp / (3.6e6 * ETA);  // kW(ρ=1000 已折算)
  return { qi, npsha, npshr, sev, H: Hdisp, q, P };
}

const PN = 400;
const waterIM = new THREE.InstancedMesh(new THREE.SphereGeometry(0.055, 6, 5),
  new THREE.MeshStandardMaterial({ roughness: 0.3, metalness: 0, transparent: true, opacity: 0.92 }), PN);
waterIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(waterIM);
const dummy = new THREE.Object3D();
const WCOL = [new THREE.Color(0x2b6fb0), new THREE.Color(0x4dabf7), new THREE.Color(0x74c0fc), new THREE.Color(0xa5d8ff)];
const parts = [];
function resetPart(p, spread) {
  p.sd = Math.random(); p.sd2 = Math.random();
  if (p.st === 0) { p.x = spread ? -4.2 + Math.random() * 3.6 : -4.2; }
  else if (p.st === 1) { p.r = 0.22 + Math.random() * 1.3; p.th = Math.random() * 6.283; p.ax = (Math.random() - 0.5) * 0.8; }
  else if (p.st === 2) {
    p.e0 = Math.random() * 6.283;
    const Ti = 6.283 - p.e0 + 0.3;
    p.tr = Math.random() * Ti;
    p.r = Math.min(2.42, 1.6 + 0.85 * p.tr / Ti);
    p.th = p.e0 + p.tr; p.ax = (Math.random() - 0.5) * 0.8;
  } else { p.y = 2.5 + Math.random() * 4.8; p.x = (Math.random() - 0.5) * 0.4; p.z = (Math.random() - 0.5) * 0.4; }
}
for (let i = 0; i < PN; i++) {
  const p = { st: i % 4, x: 0, y: 0, z: 0, r: 0, th: 0, e0: 0, tr: 0, ax: 0, sd: 0, sd2: 0 };
  parts.push(p);
  resetPart(p, true);
}
/* st 0 吸入管 → 1 叶轮(旋转外甩)→ 2 蜗壳(减速增压,沿螺旋壁走)→ 3 出口管(向上) */
function stepWater(dt, vsc, sev, oms) {
  for (const p of parts) {
    if (p.st === 0) {
      p.x += 2.5 * vsc * dt;
      if (p.x > -0.45) { p.st = 1; p.r = 0.22 + p.sd * 0.22; p.th = p.sd2 * 6.283; p.ax = (p.sd - 0.5) * 0.8; }
    } else if (p.st === 1) {
      p.th += oms * (0.9 + 0.18 * p.sd) * dt;
      p.r += (0.15 + 0.11 * p.sd) * oms * p.r * dt * (1 - 0.5 * sev);
      if (sev > 0.2) p.th += (Math.random() - 0.5) * sev * 22 * dt;
      if (p.r > 1.58) { p.st = 2; p.e0 = p.th % 6.283; p.tr = 0; }
    } else if (p.st === 2) {
      const Ti = 6.283 - p.e0 + 0.3;
      const rr = Math.max(1.62, 1.6 + 0.85 * p.tr / Ti);
      p.tr += (oms * 2.56 / (rr * rr)) * dt * (1 - 0.3 * sev);   // v_θ∝u₂∝N,随 r 衰减
      p.r = Math.min(2.42, 1.6 + 0.85 * p.tr / Ti);
      p.th = p.e0 + p.tr;
      if (p.tr >= Ti) { p.st = 3; p.y = 2.2; p.x = p.ax * 0.5; p.z = 0; }
    } else {
      p.y += 3.6 * vsc * dt;
      p.x += (0 - p.x) * Math.min(1, 4 * dt);
      p.z += (0 - p.z) * Math.min(1, 4 * dt);
      if (p.y > 7.5) { p.st = 0; resetPart(p, false); }
    }
  }
}
function drawWater(sev, live) {
  for (let i = 0; i < PN; i++) {
    const p = parts[i];
    let px, py, pz;
    if (p.st === 0) { px = p.x; py = (p.sd - 0.5) * 0.34; pz = (p.sd2 - 0.5) * 0.5; }
    else if (p.st === 3) { px = p.x; py = p.y; pz = p.z; }
    else {
      px = p.ax; py = p.r * Math.cos(p.th); pz = p.r * Math.sin(p.th);
      if (live && sev > 0.15) {
        const j = sev * 0.24;
        px += (Math.random() - 0.5) * j; py += (Math.random() - 0.5) * j; pz += (Math.random() - 0.5) * j;
      }
    }
    dummy.position.set(px, py, pz);
    dummy.scale.setScalar(p.st === 2 ? 0.85 : 1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    waterIM.setMatrixAt(i, dummy.matrix);
    waterIM.setColorAt(i, WCOL[p.st]);
  }
  waterIM.instanceMatrix.needsUpdate = true;
  if (waterIM.instanceColor) waterIM.instanceColor.needsUpdate = true;
}

const FLN = 50;
const flashIM = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6),
  new THREE.MeshBasicMaterial({ color: 0xffe9b0, transparent: true, opacity: 0.95 }), FLN);
flashIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(flashIM);
const flashes = [];
for (let i = 0; i < FLN; i++) flashes.push({ on: false, x: 0, y: 0, z: 0, t: 0 });
let spawnAcc = 0;
function spawnBubble(oms) {
  const b = bubbles.find(b => !b.on);
  if (!b) return;
  const ang = Math.random() * 6.283, rr = 0.14 + Math.random() * 0.5;
  b.on = true;
  b.x = (Math.random() - 0.5) * 0.7;
  b.y = Math.cos(ang) * rr; b.z = Math.sin(ang) * rr;
  const vt = oms * rr * 0.8;
  b.vx = (Math.random() - 0.5) * 0.6;
  b.vy = -Math.sin(ang) * vt; b.vz = Math.cos(ang) * vt;
  b.life = 0.15 + Math.random() * 0.3;
  b.r = 0.035 + Math.random() * 0.05;
}
function stepBubbles(dt, sev, oms) {
  if (sev > 0.06) {
    spawnAcc += sev * 26 * dt;
    while (spawnAcc > 1) {
      spawnAcc -= 1;
      spawnBubble(oms);
      if (sev > 0.7 && Math.random() < 0.5) spawnBubble(oms);
    }
  }
  for (const b of bubbles) {
    if (!b.on) continue;
    b.life -= dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    b.vy += Math.sin(b.x * 9 + simT * 20) * 0.4 * dt;
    if (b.life <= 0) {
      b.on = false;
      if (Math.random() < 0.35) {
        const f = flashes.find(f => !f.on);
        if (f) { f.on = true; f.x = b.x; f.y = b.y; f.z = b.z; f.t = 0; }
      }
    }
  }
  for (const f of flashes) { if (f.on) { f.t += dt; if (f.t > 0.14) f.on = false; } }
}
function drawBubbles() {
  bubbles.forEach((b, i) => {
    if (b.on) {
      dummy.position.set(b.x, b.y, b.z);
      dummy.scale.setScalar(b.r * (1 + 0.6 * (0.3 - Math.min(b.life, 0.3))));
      dummy.rotation.set(0, 0, 0);
    } else { dummy.position.set(0, -50, 0); dummy.scale.setScalar(0.0001); }
    dummy.updateMatrix();
    bubbleIM.setMatrixAt(i, dummy.matrix);
  });
  bubbleIM.instanceMatrix.needsUpdate = true;
  flashes.forEach((f, i) => {
    if (f.on) {
      dummy.position.set(f.x, f.y, f.z);
      dummy.scale.setScalar(0.03 + f.t / 0.14 * 0.12);
      dummy.rotation.set(0, 0, 0);
    } else { dummy.position.set(0, -50, 0); dummy.scale.setScalar(0.0001); }
    dummy.updateMatrix();
    flashIM.setMatrixAt(i, dummy.matrix);
  });
  flashIM.instanceMatrix.needsUpdate = true;
}

/* ================= 曲线图:H-Q 泵曲线 × 管路曲线 ================= */
const plotCv = document.getElementById('plotCv');
const plotTitle = document.getElementById('plotTitle');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const pad = 30, padB = 26, padT = 12;
  const qMax = 200, hMax = 170;
  const xOf = q => pad + q / qMax * (W - pad - 14);
  const yOf = h => padT + (1 - clamp(h / hMax, 0, 1)) * (H - padB - padT);
  ctx.strokeStyle = 'rgba(128,150,170,.22)'; ctx.lineWidth = 1;
  ctx.font = '15px system-ui'; ctx.fillStyle = cTxt; ctx.textAlign = 'right';
  for (const h of [0, 40, 80, 120, 160]) {
    ctx.beginPath(); ctx.moveTo(pad, yOf(h)); ctx.lineTo(W - 14, yOf(h)); ctx.stroke();
    ctx.fillText(String(h), pad - 5, yOf(h) + 5);
  }
  ctx.textAlign = 'center';
  for (const q of [0, 50, 100, 150, 200]) ctx.fillText(String(q), xOf(q), H - 8);
  ctx.textAlign = 'left';
  ctx.strokeStyle = 'rgba(128,150,170,.4)';
  ctx.beginPath(); ctx.moveTo(pad, padT); ctx.lineTo(pad, H - padB); ctx.lineTo(W - 14, H - padB); ctx.stroke();
  ctx.fillText('H (m)', pad + 6, padT + 2);
  ctx.fillText('Q (m³/h)', W - 92, H - padB + 18);
  /* 泵曲线(随 N² 抬升) */
  ctx.strokeStyle = '#4dabf7'; ctx.lineWidth = 3;
  let started = false;
  ctx.beginPath();
  for (let q = 0; q <= qMax; q += 4) {
    const h = Hp(q);
    if (h < 0.5) break;
    started ? ctx.lineTo(xOf(q), yOf(h)) : ctx.moveTo(xOf(q), yOf(h));
    started = true;
  }
  ctx.stroke();
  ctx.fillStyle = '#4dabf7';
  ctx.fillText(L('泵曲线(随 N²)', 'pump curve (N²)'), xOf(6), yOf(Hp(6)) + 20);
  /* 汽蚀塌落曲线 */
  if (OP && OP.sev > 0.02) {
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
    ctx.beginPath();
    started = false;
    for (let q = 0; q <= qMax; q += 4) {
      const h = cavH(q);
      if (h < 0.5) break;
      started ? ctx.lineTo(xOf(q), yOf(h)) : ctx.moveTo(xOf(q), yOf(h));
      started = true;
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ff8787';
    ctx.fillText(L('汽蚀塌落', 'cavitation collapse'), xOf(6), yOf(cavH(6)) - 8);
  }
  /* 管路曲线(随阀门) */
  ctx.strokeStyle = '#ffa94d'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  started = false;
  for (let q = 0; q <= qMax; q += 4) {
    const h = Hsys(q);
    if (h > hMax) break;
    started ? ctx.lineTo(xOf(q), yOf(h)) : ctx.moveTo(xOf(q), yOf(h));
    started = true;
  }
  ctx.stroke();
  ctx.fillStyle = '#ffa94d';
  ctx.fillText(L('管路(随阀门)', 'system (valve)'), xOf(120), yOf(Math.min(Hsys(120), hMax * 0.95)) - 8);
  /* 工况点 */
  if (OP) {
    const cav = OP.sev > 0.12;
    ctx.fillStyle = cav ? '#ff6b6b' : '#ffd43b';
    ctx.beginPath(); ctx.arc(xOf(OP.q), yOf(OP.H), 8, 0, Math.PI * 2); ctx.fill();
    if (cav) {
      ctx.fillStyle = '#ff8787';
      ctx.fillText(L('汽蚀!', 'CAV!'), xOf(OP.q) + 12, yOf(OP.H) - 8);
    }
  }
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const sRPM = document.getElementById('sRPM'), sRPMVal = document.getElementById('sRPMVal');
const sHS = document.getElementById('sHS'), sHSVal = document.getElementById('sHSVal');
const sV = document.getElementById('sV'), sVVal = document.getElementById('sVVal');
const stH = document.getElementById('stH'), stQ = document.getElementById('stQ'),
  stP = document.getElementById('stP'), stN = document.getElementById('stN'), stS = document.getElementById('stS');
const formulaEl = document.getElementById('formula');
const setPlayLabel = () => { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); };
function syncSliders() {
  sRPM.value = RPM; sRPMVal.textContent = RPM.toFixed(0) + ' rpm';
  sHS.value = HS; sHSVal.textContent = (HS >= 0 ? '+' : '') + HS.toFixed(1) + ' m';
  sV.value = VALVE; sVVal.textContent = VALVE.toFixed(0) + ' %';
}
function updateStats() {
  stH.innerHTML = OP.H.toFixed(1) + ' <small>m</small>';
  stQ.innerHTML = OP.q.toFixed(0) + ' <small>m³/h</small>';
  stP.innerHTML = OP.P.toFixed(1) + ' <small>kW</small>';
  stN.innerHTML = OP.npsha.toFixed(1) + ' / ' + OP.npshr.toFixed(1) + ' <small>m</small>';
  const mg = OP.npsha - OP.npshr;
  stN.className = 'v ' + (mg < 0 ? 'bad' : mg < 1 ? 'warn' : 'ok');
  let txt, cls;
  if (OP.q < 1) { txt = L('零流量:扬程<静扬程', 'zero flow: head < static'); cls = 'warn'; }
  else if (OP.sev > 0.45) { txt = L('汽蚀!噪声+剥蚀', 'CAVITATION! noise+pits'); cls = 'bad'; }
  else if (OP.sev > 0.12) { txt = L('汽蚀前兆 ⚠', 'incipient cavitation ⚠'); cls = 'warn'; }
  else { txt = L('正常', 'normal'); cls = 'ok'; }
  stS.textContent = txt;
  stS.className = 'v ' + cls;
}
function updateFormula() {
  const op = OP || computeOp();
  const s = RPM / N_R, u2 = u2Of(RPM), h0 = H0of(RPM);
  const mg = op.npsha - op.npshr;
  const loss = KS * op.qi * op.qi;
  const verd = mg >= 0
    ? L('余量 +', 'margin +') + mg.toFixed(1) + ' m ✓'
    : L('缺 ', 'short ') + (-mg).toFixed(1) + ' m ⚠' + L('汽蚀', 'cavitation');
  formulaEl.innerHTML = L(
    `H₀=u₂²/g=(ωr₂)²/g:u₂=<b>${u2.toFixed(1)} m/s</b> → H₀=<b>${h0.toFixed(1)} m</b> · 转速 ×2 → H₀ ×4<br>` +
    `相似定律 N/1450=<b>${s.toFixed(2)}</b>:Q×${s.toFixed(2)} · H×${(s * s).toFixed(2)} · P×${(s * s * s).toFixed(2)} | 现在 H=<b>${op.H.toFixed(1)} m</b> · Q=${op.q.toFixed(0)} m³/h · P=${op.P.toFixed(1)} kW<br>` +
    `NPSHa=p₀/ρg+h_s−kQ²=10.33+${HS.toFixed(1)}−${loss.toFixed(1)}=<b>${op.npsha.toFixed(1)} m</b> vs NPSHr=<b>${op.npshr.toFixed(1)} m</b> → ${verd} · 大气压只托得起 ≈10.3 m 吸程`,
    `H₀=u₂²/g=(ωr₂)²/g: u₂=<b>${u2.toFixed(1)} m/s</b> → H₀=<b>${h0.toFixed(1)} m</b> · speed ×2 → H₀ ×4<br>` +
    `affinity laws N/1450=<b>${s.toFixed(2)}</b>: Q×${s.toFixed(2)} · H×${(s * s).toFixed(2)} · P×${(s * s * s).toFixed(2)} | now H=<b>${op.H.toFixed(1)} m</b> · Q=${op.q.toFixed(0)} m³/h · P=${op.P.toFixed(1)} kW<br>` +
    `NPSHa=p₀/ρg+h_s−kQ²=10.33+${HS.toFixed(1)}−${loss.toFixed(1)}=<b>${op.npsha.toFixed(1)} m</b> vs NPSHr=<b>${op.npshr.toFixed(1)} m</b> → ${verd} · the atmosphere holds only ≈10.3 m of suction lift`);
}
function setPresetBtns() {
  document.getElementById('btnRated').classList.toggle('on', RPM === 1450 && HS === 3 && VALVE === 100);
  document.getElementById('btnMax').classList.toggle('on', RPM === 2900 && HS === 8 && VALVE === 100);
  document.getElementById('btnCav').classList.toggle('on', RPM === 2900 && HS <= -0.9);
}
function applyPreset(rpm, hs, valve) {
  RPM = rpm; HS = hs; VALVE = valve;
  OP = computeOp();
  syncSliders(); updateFormula(); drawPlot();
}
document.getElementById('btnRated').addEventListener('click', () => applyPreset(1450, 3, 100));
document.getElementById('btnMax').addEventListener('click', () => applyPreset(2900, 8, 100));
document.getElementById('btnCav').addEventListener('click', () => applyPreset(2900, -1, 100));
document.getElementById('btnReset').addEventListener('click', () => {
  applyPreset(1450, 3, 100);
  camera.position.set(8.2, 5.6, 11);
  controls.target.set(-0.8, 2.3, 0);
});
sRPM.addEventListener('input', () => { RPM = +sRPM.value; OP = computeOp(); syncSliders(); updateFormula(); drawPlot(); setPresetBtns(); });
sHS.addEventListener('input', () => { HS = +sHS.value; OP = computeOp(); syncSliders(); updateFormula(); drawPlot(); setPresetBtns(); });
sV.addEventListener('input', () => { VALVE = +sV.value; OP = computeOp(); syncSliders(); updateFormula(); drawPlot(); setPresetBtns(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = spinOn;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * (playing ? speed : 0);
  simT += dt;
  const oms = omegaOf(RPM) / 30;                    // 慢镜头 ×30
  const vsc = OP ? clamp(OP.q / 81, 0.03, 1.5) : 1;
  const sev = OP ? OP.sev : 0;
  if (dt > 0) {
    impG.rotation.x += oms * dt;
    stepWater(dt, vsc, sev, oms);
    stepBubbles(dt, sev, oms);
  }
  drawWater(sev, dt > 0);
  drawBubbles();
  updateTank();
  statsAcc += dt0;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    OP = computeOp();
    updateStats();
    updateFormula();
    drawPlot();
    setPresetBtns();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
RPM = clamp(qsFloat('rpm', 1450), 600, 2900);
HS = clamp(qsFloat('hs', 3), -1, 8);
VALVE = clamp(qsFloat('valve', 100), 0, 100);
simT = qsFloat('t', 0);
OP = computeOp();
setPlayLabel();
buildSteps();
applyTheme();
applyLang();
syncSliders();
updateTank();
start();
</script>
</body>
