<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>等速万向节 · 铰链角下速度均匀输出</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #plot{position:fixed;right:18px;bottom:18px;z-index:4;width:310px;height:130px;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    backdrop-filter:blur(6px);padding:8px 10px 6px}
  #plot h3{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:2px}
  #plotCv{width:100%;height:calc(100% - 20px);display:block}
  #stats{position:fixed;right:18px;bottom:160px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.warn{color:#ffa94d}#stats .v.bad{color:#ff6b6b}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="等速万向节 · 铰链角下速度均匀输出" data-en="Constant-Velocity Joint · Smooth Output at Any Angle">等速万向节 · 铰链角下速度均匀输出</h1>
  <div class="sub" data-zh="虎克铰每转两次快慢波动；等速节六颗球被保持架锁在角平分面，任何铰链角下瞬时速比恒=1——前驱车半轴的核心 · 拖动旋转 / 空格运行/暂停" data-en="U-joint speed oscillates twice per rev; CV joint's 6 balls in bisecting plane give constant ratio at any δ — the core of FWD driveshafts · drag to orbit / Space = run/pause">虎克铰每转两次快慢波动；等速节六颗球被保持架锁在角平分面，任何铰链角下瞬时速比恒=1——前驱车半轴的核心 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="输入转速" data-en="Input speed">输入转速</span><span class="v" id="stIn">—</span>
  <span class="k" data-zh="输出转速" data-en="Output speed">输出转速</span><span class="v" id="stOut">—</span>
  <span class="k" data-zh="铰链角 δ" data-en="Joint angle δ">铰链角 δ</span><span class="v" id="stDelta">—</span>
  <span class="k" data-zh="速度波动" data-en="Speed ripple">速度波动</span><span class="v" id="stRipple">—</span>
</div>
<div id="plot">
  <h3 id="plotTitle" data-zh="输出角速度 ω_out/ω_in（橙=虎克铰，蓝=等速节）" data-en="Output speed ω_out/ω_in (orange=U-joint, blue=CV joint)">输出角速度 ω_out/ω_in（橙=虎克铰，蓝=等速节）</h3>
  <canvas id="plotCv"></canvas>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnUJ" data-zh="U 型铰对照" data-en="U-joint compare">U 型铰对照</button>
    <button class="abtn" id="btnAngle" data-zh="加大铰链角" data-en="Increase angle">加大铰链角</button>
    <button class="abtn" id="btnBisect" data-zh="高亮角平分面" data-en="Show bisecting plane">高亮角平分面</button>
    <button class="abtn" id="btnGraph" data-zh="速度图表" data-en="Speed graph">速度图表</button>
  </div>
  <div class="row">
    <label data-zh="铰链角 δ" data-en="Joint angle δ">铰链角 δ</label>
    <input id="sDelta" type="range" min="0" max="40" step="1" value="15">
    <span class="val" id="sDeltaVal">15°</span>
  </div>
  <div class="row">
    <label data-zh="输入转速" data-en="Input speed">输入转速</label>
    <input id="sSpd" type="range" min="30" max="300" step="10" value="120">
    <span class="val" id="sSpdVal">120 rpm</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../universal-joint/" data-zh="万向节（双节消波）" data-en="Universal joint (double-joint)">万向节</a>
    <a href="../differential/" data-zh="汽车差速器" data-en="Car differential">汽车差速器</a>
    <a href="../involute-gears/" data-zh="渐开线齿轮" data-en="Involute gears">渐开线齿轮</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const D2R=Math.PI/180, R2D=180/Math.PI;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,22,58);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(2,5,20);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=55;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.05); key.position.set(6,10,7); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.28); fill.position.set(-7,5,-5); scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.9});
const shaftM=new THREE.MeshStandardMaterial({color:0x4a5568,roughness:0.3,metalness:0.8});
const outerM=new THREE.MeshStandardMaterial({color:0x2d3748,roughness:0.35,metalness:0.75,transparent:true,opacity:0.8,side:THREE.DoubleSide});
const innerM=new THREE.MeshStandardMaterial({color:0xc9a227,roughness:0.2,metalness:0.85});
const ballM=new THREE.MeshStandardMaterial({color:0xd4d4d4,roughness:0.08,metalness:0.95});
const cageM=new THREE.MeshStandardMaterial({color:0xe88a2e,roughness:0.3,metalness:0.65});
const bisectM=new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.18,side:THREE.DoubleSide,depthWrite:false});
const ujointM=new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.3,metalness:0.6});
const markM=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xff8c00,emissiveIntensity:0.8});

const ground=new THREE.Mesh(new THREE.BoxGeometry(30,0.22,8),groundM);
ground.position.y=-3.5; scene.add(ground);

function makeShaftMesh(len,r,mat){
  const g=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,18),mat);
  g.rotation.z=Math.PI/2; return g;
}
function makeYoke(mat){
  const g=new THREE.Group();
  const arm1=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.8,0.12),mat); arm1.position.y=0.4; g.add(arm1);
  const arm2=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.8,0.12),mat); arm2.position.y=-0.4; g.add(arm2);
  const conn=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.12,0.12),mat); g.add(conn);
  return g;
}

/* ====== CV JOINT ====== */
const CVG=new THREE.Group(); CVG.position.set(2,0,0); scene.add(CVG);
const cvInShaft=makeShaftMesh(4,0.15,shaftM); cvInShaft.position.x=-2; CVG.add(cvInShaft);
const cvOutPivot=new THREE.Group(); CVG.add(cvOutPivot);
const cvOutShaft=makeShaftMesh(4,0.15,shaftM); cvOutShaft.position.x=2; cvOutPivot.add(cvOutShaft);
const cvMark=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.22,0.22),markM); cvMark.position.x=3.6; cvOutPivot.add(cvMark);

const outerRace=new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.85,1.6,28,1,true),outerM);
outerRace.rotation.z=Math.PI/2; CVG.add(outerRace);
const outerCap=new THREE.Mesh(new THREE.RingGeometry(0.16,0.85,28),outerM);
outerCap.rotation.y=Math.PI/2; outerCap.position.x=0.8; CVG.add(outerCap);

const innerRaceG=new THREE.Group(); CVG.add(innerRaceG);
const innerBody=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,1.2,20),innerM);
innerBody.rotation.z=Math.PI/2; innerRaceG.add(innerBody);
const innerHub=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,1.5,14),innerM);
innerHub.rotation.z=Math.PI/2; innerRaceG.add(innerHub);

const cageRing=new THREE.Mesh(new THREE.TorusGeometry(0.63,0.065,10,28),cageM);
cageRing.rotation.y=Math.PI/2; CVG.add(cageRing);

const N_BALLS=6, balls=[];
for(let i=0;i<N_BALLS;i++){
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,12),ballM);
  CVG.add(b); balls.push(b);
}

const bisectPlane=new THREE.Mesh(new THREE.CircleGeometry(1.1,32),bisectM);
CVG.add(bisectPlane); bisectPlane.visible=false;

/* ====== U-JOINT ====== */
const UJG=new THREE.Group(); UJG.position.set(-7,0,0); scene.add(UJG);
const ujInShaft=makeShaftMesh(4,0.15,shaftM); ujInShaft.position.x=-2; UJG.add(ujInShaft);
const ujOutPivot=new THREE.Group(); UJG.add(ujOutPivot);
const ujOutShaft=makeShaftMesh(4,0.15,shaftM); ujOutShaft.position.x=2; ujOutPivot.add(ujOutShaft);
const ujMark=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.22,0.22),markM); ujMark.position.x=3.6; ujOutPivot.add(ujMark);
const yk1=makeYoke(shaftM); UJG.add(yk1);
const yk2=makeYoke(ujointM); UJG.add(yk2);
const cross1=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.75),ujointM); UJG.add(cross1);
const cross2=new THREE.Mesh(new THREE.BoxGeometry(0.75,0.08,0.08),ujointM); UJG.add(cross2);

/* ---- labels ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('等速万向节 (Rzeppa)','CV Joint (Rzeppa)'),new THREE.Vector3(2,2.2,0),'b');
const lblUJ=addLabel(()=>L('虎克铰 (Cardan)','U-joint (Cardan)'),new THREE.Vector3(-7,2.2,0),'r',()=>showUJ);
addLabel(()=>L('六颗球 · 保持架','6 balls · cage'),new THREE.Vector3(4.2,0.8,0),'g');
addLabel(()=>L('外圈 (钟形壳)','Outer race (bell)'),new THREE.Vector3(2,1.5,0),'o');
addLabel(()=>L('内圈 (星形)','Inner race (star)'),new THREE.Vector3(2,-1.3,0),'g');
const lblBisect=addLabel(()=>L('角平分面','Bisecting plane'),new THREE.Vector3(2,1.9,0),'b',()=>showBisect);

/* ---- state ---- */
let playing=true, deltaAngle=15, inSpeed=120, thetaIn=0;
let showUJ=true, showBisect=false, showGraph=true, autoAngle=false;
let labelsOn=true, simT=0;

const ujTheta2=(th1,a)=>Math.atan(Math.tan(th1)*Math.cos(a));
function ujOmega(th1,a,w1){
  const s2=Math.sin(a)**2;
  return w1*Math.cos(a)/(1-s2*Math.cos(th1)**2);
}

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  outerM.color.setHex(dark?0x2d3748:0x6b7d8e);
  shaftM.color.setHex(dark?0x4a5568:0x5a6878);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); updateStats();
}

const STEPS=[
  {zh:'万向节速度不均：单个虎克铰每转两次快慢，幅度随铰链角加大',en:'U-joint speed variation: twice-per-rev oscillation, amplitude grows with joint angle'},
  {zh:'等速条件：两轴夹角的角平分面内的传力点保证瞬时速比=1',en:'CV condition: force point in bisecting plane → instantaneous ratio = 1'},
  {zh:'球保持架：保持架强制六颗球留在角平分面，无论铰链角多大',en:'Cage forces 6 balls into bisecting plane at any angle δ'},
  {zh:'最大铰链角：Rzeppa 式最大 ~47°（转向时）；三销等速节最大 ~23°',en:'Rzeppa max δ ≈ 47° (steering); tripod joint max ≈ 23°'},
  {zh:'润滑与密封：等速节充满锂基脂、橡皮护套封闭，使用寿命 200,000 km',en:'Grease-packed, rubber boot seal → 200,000 km life'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i; syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

function updateCVJoint(thetaI,delta){
  const a=delta*D2R;
  innerRaceG.rotation.x=-thetaI;
  cvOutPivot.rotation.z=-a;
  cvOutPivot.rotation.x=-thetaI;
  const bisectAngle=-a/2;
  bisectPlane.rotation.z=bisectAngle;
  cageRing.rotation.z=bisectAngle;
  for(let i=0;i<N_BALLS;i++){
    const phi=thetaI+i*Math.PI/3;
    const r=0.63;
    const by=r*Math.cos(phi), bz=r*Math.sin(phi);
    const bx2=-bz*Math.sin(bisectAngle);
    const bz2=bz*Math.cos(bisectAngle);
    balls[i].position.set(bx2,by,bz2);
  }
}

function updateUJoint(thetaI,delta){
  const a=delta*D2R;
  const th2=ujTheta2(thetaI,a);
  yk1.rotation.x=-thetaI;
  ujOutPivot.rotation.z=-a;
  ujOutPivot.rotation.x=-th2;
  cross1.rotation.x=-th2*0.5;
}

const plotCv=document.getElementById('plotCv');
function drawPlot(){
  const W=plotCv.parentElement.clientWidth-20, Hc=plotCv.parentElement.clientHeight-22;
  plotCv.width=W; plotCv.height=Hc;
  const ctx=plotCv.getContext('2d');
  ctx.clearRect(0,0,W,Hc);
  const mid=Hc/2;
  ctx.strokeStyle='rgba(128,140,155,.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(W,mid); ctx.stroke();
  const a=deltaAngle*D2R, s2=Math.sin(a)**2;
  ctx.strokeStyle='#ffa94d'; ctx.lineWidth=1.8; ctx.beginPath();
  for(let x=0;x<=W;x++){
    const th=x/W*Math.PI*4;
    const w=Math.cos(a)/(1-s2*Math.cos(th)**2);
    const y=mid-(w-1)*65;
    x?ctx.lineTo(x,clamp(y,2,Hc-2)):ctx.moveTo(x,clamp(y,2,Hc-2));
  }
  ctx.stroke();
  ctx.strokeStyle='#74c0fc'; ctx.lineWidth=2.2; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(W,mid); ctx.stroke();
  ctx.setLineDash([]);
  const curX=(thetaIn%(Math.PI*4))/(Math.PI*4)*W;
  const curW=Math.cos(a)/(1-s2*Math.cos(thetaIn)**2);
  const curY=mid-(curW-1)*65;
  ctx.fillStyle='#ffa94d'; ctx.beginPath(); ctx.arc(curX,clamp(curY,4,Hc-4),4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(199,210,222,.85)'; ctx.font='10px system-ui';
  ctx.fillText(L('橙=虎克铰  蓝=等速节','orange=U-joint  blue=CV joint'),8,12);
}

function updateStats(){
  const a=deltaAngle*D2R, s2=Math.sin(a)**2;
  const outW=Math.cos(a)/(1-s2*Math.cos(thetaIn)**2);
  const outRpm=inSpeed*outW;
  const ripple=a>0.001?Math.abs(1/Math.cos(a)-Math.cos(a))/2:0;
  document.getElementById('stIn').innerHTML=inSpeed.toFixed(0)+'<small> rpm</small>';
  const outEl=document.getElementById('stOut');
  if(showUJ){
    outEl.innerHTML=outRpm.toFixed(0)+'<small> rpm</small>';
    outEl.className='v '+(ripple>0.15?'bad':ripple>0.05?'warn':'ok');
  } else {
    outEl.innerHTML=inSpeed.toFixed(0)+'<small> rpm ✓</small>'; outEl.className='v ok';
  }
  document.getElementById('stDelta').innerHTML=deltaAngle.toFixed(0)+'<small> °</small>';
  const rippleEl=document.getElementById('stRipple');
  if(showUJ){
    rippleEl.innerHTML=(ripple*100).toFixed(1)+'<small> %</small>';
    rippleEl.className='v '+(ripple>0.15?'bad':ripple>0.05?'warn':'ok');
  } else {
    rippleEl.innerHTML='≈ 0<small> %</small>'; rippleEl.className='v ok';
  }
}

document.getElementById('btnUJ').addEventListener('click',()=>{showUJ=!showUJ;UJG.visible=showUJ;document.getElementById('btnUJ').classList.toggle('on',showUJ);});
document.getElementById('btnAngle').addEventListener('click',()=>{autoAngle=!autoAngle;document.getElementById('btnAngle').classList.toggle('on',autoAngle);});
document.getElementById('btnBisect').addEventListener('click',()=>{showBisect=!showBisect;bisectPlane.visible=showBisect;document.getElementById('btnBisect').classList.toggle('on',showBisect);});
document.getElementById('btnGraph').addEventListener('click',()=>{showGraph=!showGraph;document.getElementById('plot').style.display=showGraph?'':'none';document.getElementById('btnGraph').classList.toggle('on',showGraph);});
document.getElementById('sDelta').addEventListener('input',e=>{deltaAngle=+e.target.value;document.getElementById('sDeltaVal').textContent=deltaAngle+'°';updateStats();drawPlot();});
document.getElementById('sSpd').addEventListener('input',e=>{inSpeed=+e.target.value;document.getElementById('sSpdVal').textContent=inSpeed+' rpm';updateStats();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();drawPlot();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);drawPlot();});

const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    thetaIn+=inSpeed*D2R/60*dt*60;
    if(autoAngle){
      deltaAngle=20+18*Math.sin(simT*0.4);
      document.getElementById('sDelta').value=deltaAngle.toFixed(0);
      document.getElementById('sDeltaVal').textContent=deltaAngle.toFixed(0)+'°';
    }
  }
  updateCVJoint(thetaIn,deltaAngle);
  if(showUJ) updateUJoint(thetaIn,deltaAngle);
  UJG.visible=showUJ;
  acc+=dt; if(acc>0.1){acc=0;updateStats();drawPlot();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

document.getElementById('btnUJ').classList.add('on');
applyTheme(); applyLang(); buildSteps(); updateStats(); drawPlot(); start();
</script>
