<style>
  :root,:root[data-theme="dark"]{

  #app{position:fixed;inset:0}#app canvas{display:block}

  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;

  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="六足并联平台 · 六根腿定一个位姿" data-en="Stewart Platform · six legs, one pose">六足并联平台 · 六根腿定一个位姿</h1>
  <div class="sub" data-zh="六根腿两端球铰，3 平移 + 3 旋转由 6 个腿长唯一确定：刚度大、误差不累积，飞行模拟器/望远镜副镜都在用 · 拖滑块看腿长读数唯一解跳动，或开浪涌模拟看李萨如轨迹 · 拖动旋转 / 空格运行/暂停" data-en="Six legs with ball joints at both ends: 3 translations + 3 rotations are fixed uniquely by 6 leg lengths — stiff and error-free, as in flight simulators · drag the sliders and watch the six length readouts, or run the swell preset for a Lissajous trace · drag to orbit / Space = run/pause">六足并联平台 · 六根腿定一个位姿</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 运动学：腿 i 的上下铰点 b_i（固定）与 p_i（平台局部坐标），位姿 = 平移 T + 旋转 R
   反解（易）：L_i = |R·p_i + T − b_i|，6 个腿长 ↔ 位姿一一对应（并联闭式解）
   正解（难）：由腿长求位姿需解非线性方程组——这正是并联机床用腿长闭环控制的原因 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const D2R=Math.PI/180, R2D=180/Math.PI;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(6.8,4.6,9.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.6,1.5,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=3; controls.maxDistance=60;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(6,10,8); key.castShadow=true; scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-7,4,-6); scene.add(fill);

/* ---- 材质 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const baseM=new THREE.MeshStandardMaterial({color:0x2e3a47,roughness:0.5,metalness:0.55});
const platM=new THREE.MeshStandardMaterial({color:0xd9730d,roughness:0.4,metalness:0.5});
const barrelM=new THREE.MeshStandardMaterial({color:0x788795,roughness:0.35,metalness:0.75});
const rodM=new THREE.MeshStandardMaterial({color:0xc7d2de,roughness:0.25,metalness:0.85});
const jointM=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xffa000,emissiveIntensity:0.3,roughness:0.35,metalness:0.4});
const armM=new THREE.MeshStandardMaterial({color:0x4a7fa5,roughness:0.4,metalness:0.6});
const coneM=new THREE.MeshStandardMaterial({color:0xff6b6b,transparent:true,opacity:0.16,side:THREE.DoubleSide,depthWrite:false});
const trailM=new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.85});

/* ---- 布局 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(30,0.3,14),groundM);
ground.position.set(1.5,-0.65,0); ground.receiveShadow=true; scene.add(ground);
const RB=2.2, RT=1.7;
/* 基座铰点角度：3 对（0°,120°,240° 附近）；平台铰点错开 60° */
const baseAng=[-14,14,106,134,226,254].map(a=>a*D2R);
const topAng=[46,74,166,194,286,314].map(a=>a*D2R);
const basePts=baseAng.map(a=>new THREE.Vector3(RB*Math.cos(a),0.12,RB*Math.sin(a)));
const topLocal=topAng.map(a=>new THREE.Vector3(RT*Math.cos(a),0.06,RT*Math.sin(a)));

/* 基础平台（定） */
const base=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.8,0.24,6),baseM);
base.position.y=0; base.castShadow=true; scene.add(base);
for(const p of basePts){
  const j=new THREE.Mesh(new THREE.SphereGeometry(0.13,12,10),jointM);
  j.position.copy(p); scene.add(j);
  const pin=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.18,8),barrelM);
  pin.position.set(p.x,0.2,p.z); scene.add(pin);
}
/* 上平台（动） */
const platform=new THREE.Group(); scene.add(platform);
const platDisc=new THREE.Mesh(new THREE.CylinderGeometry(1.85,1.7,0.18,6),platM);
platDisc.position.y=0; platDisc.castShadow=true; platform.add(platDisc);
for(const p of topLocal){
  const j=new THREE.Mesh(new THREE.SphereGeometry(0.12,12,10),jointM);
  j.position.copy(p); platform.add(j);
}
const seat=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.3,1.2),baseM);   // 驾驶舱示意
seat.position.y=0.24; platform.add(seat);
/* 六条腿：外缸 + 活塞杆 + 两端球铰 */
const legs=[];
for(let i=0;i<6;i++){
  const g=new THREE.Group(); scene.add(g);
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.115,1,10),barrelM);
  barrel.castShadow=true; g.add(barrel);
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.058,0.058,1,8),rodM);
  g.add(rod);
  const s0=new THREE.Mesh(new THREE.SphereGeometry(0.115,12,10),jointM); g.add(s0);
  const s1=new THREE.Mesh(new THREE.SphereGeometry(0.105,12,10),jointM); g.add(s1);
  legs.push({g,barrel,rod,s0,s1});
}
/* 位姿 → 腿长（反解，显式） */
const euler=new THREE.Euler(), vTmp=new THREE.Vector3(), yAxis=new THREE.Vector3(0,1,0);
const qLeg=new THREE.Quaternion();
const legLens=[0,0,0,0,0,0];
function updateLegs(heave,pitch,roll){
  euler.set(pitch,0,roll,'XYZ');
  platform.position.set(0,heave,0);
  platform.rotation.copy(euler);
  let mn=1e9,mx=-1e9;
  for(let i=0;i<6;i++){
    vTmp.copy(topLocal[i]).applyEuler(euler); vTmp.y+=heave;
    const b=basePts[i];
    const dx=vTmp.x-b.x, dy=vTmp.y-b.y, dz=vTmp.z-b.z;
    const len=Math.sqrt(dx*dx+dy*dy+dz*dz);
    legLens[i]=len; if(len<mn)mn=len; if(len>mx)mx=len;
    const leg=legs[i];
    leg.g.position.copy(b);
    vTmp.set(dx,dy,dz).normalize();
    qLeg.setFromUnitVectors(yAxis,vTmp);
    leg.g.quaternion.copy(qLeg);
    leg.barrel.scale.y=0.55*len; leg.barrel.position.y=0.275*len;
    leg.rod.scale.y=0.6*len;     leg.rod.position.y=len-0.3*len;
    leg.s1.position.y=len;
  }
  return mx-mn;
}

/* ---- 串联机械臂对照（右） ---- */
const armG=new THREE.Group(); armG.position.set(6.2,-0.5,0); armG.visible=false; scene.add(armG);
const armBase=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.5,0.5,20),armM);
armBase.position.y=0.25; armG.add(armBase);
const seg1=new THREE.Group(); seg1.position.y=0.5; armG.add(seg1);
const s1m=new THREE.Mesh(new THREE.BoxGeometry(0.22,1.5,0.22),armM); s1m.position.y=0.75; seg1.add(s1m);
const seg2=new THREE.Group(); seg2.position.y=1.5; seg1.add(seg2);
const s2m=new THREE.Mesh(new THREE.BoxGeometry(0.18,1.2,0.18),armM); s2m.position.y=0.6; seg2.add(s2m);
const seg3=new THREE.Group(); seg3.position.y=1.2; seg2.add(seg3);
const s3m=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.9,0.14),armM); s3m.position.y=0.45; seg3.add(s3m);
const tip=new THREE.Mesh(new THREE.SphereGeometry(0.12,14,12),jointM); tip.position.y=0.95; seg3.add(tip);
/* 误差锥：逐级放大（视觉化“误差累积”） */
const cone1=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.5,20,1,true),coneM); cone1.position.y=0.5; armG.add(cone1);
const cone2=new THREE.Mesh(new THREE.ConeGeometry(0.2,0.9,20,1,true),coneM); cone2.position.y=1.25; armG.add(cone2);
const cone3=new THREE.Mesh(new THREE.ConeGeometry(0.34,1.2,20,1,true),coneM); cone3.position.y=2.4; armG.add(cone3);
/* 末端目标十字（与平台中心对应高度） */
const targetG=new THREE.Group(); targetG.visible=false; scene.add(targetG);
const tRing=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.02,8,24),jointM);
tRing.rotation.x=Math.PI/2; targetG.add(tRing);

/* 轨迹（上平台中心，预设动作时呈李萨如图形） */
const TRN=160;
const trailGeo=new THREE.BufferGeometry();
trailGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(TRN*3),3));
trailGeo.setDrawRange(0,0);
const trail=new THREE.Line(trailGeo,trailM); scene.add(trail);
let trailN=0;

/* ---- 标签 ---- */
const labelReg=[];
let labelsOn=true;
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('基础平台（固定）','Base platform (fixed)'),new THREE.Vector3(0,0.55,2.6),'g');
addLabel(()=>L('上平台：6 腿长 ↔ 位姿一一对应','Top platform: 6 lengths ↔ one pose'),new THREE.Vector3(0,1.0,0),'o',()=>true,platform);
addLabel(()=>L('球铰 ×12','Ball joints ×12'),new THREE.Vector3(RT+0.5,0.1,RT+0.5),'b',()=>true,platform);
addLabel(()=>L('串联机械臂：误差逐级累积','Serial arm: errors stack up'),new THREE.Vector3(0,3.4,0),'r',()=>armG.visible,armG);
/* 六条腿的腿长读数 */
const legLabels=[];
for(let i=0;i<6;i++){
  const idx=i;
  const reg=addLabel(()=>`L${idx+1} ${(legLens[idx]*1000).toFixed(0)} mm`,
    new THREE.Vector3(0,0,0),'b',()=>true);
  legLabels.push(reg);
}

/* ---- 状态 ---- */
let playing=true, simT=0;
let heave=2.2, pitch=0, roll=0;
let preset=0;                        // 0 手动 1 浪涌 2 圆周
let serialOn=false;
const ui={
  h:document.getElementById('sHeave'), p:document.getElementById('sPitch'),
  r:document.getElementById('sRoll')
};
function syncSliders(){
  ui.h.value=Math.round(heave*100);
  ui.p.value=Math.round(pitch*R2D);
  ui.r.value=Math.round(roll*R2D);
  document.getElementById('sHeaveVal').textContent=heave.toFixed(2)+' m';
  document.getElementById('sPitchVal').textContent=(pitch*R2D).toFixed(0)+'°';
  document.getElementById('sRollVal').textContent=(roll*R2D).toFixed(0)+'°';
}
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  baseM.color.setHex(dark?0x2e3a47:0x6b7d8e);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'六根腿两端球铰：6 个腿长唯一确定上平台位姿（3 平移 + 3 旋转）',
   en:'Six ball-jointed legs: 6 lengths uniquely fix the pose (3 translations + 3 rotations)', do:()=>{setPreset(0); heave=2.2; pitch=0; roll=0; syncSliders();}},
  {zh:'反解是显式的：L = |R·p + T − b|，腿长读数跟着位姿唯一解跳动',
   en:'Inverse kinematics is explicit: L = |Rp+T−b|; the six readouts track the pose exactly', do:()=>{setPreset(0); heave=3.0; syncSliders();}},
  {zh:'并联优势：载荷分到 6 缸、刚度大、精度高——误差不经过累积链',
   en:'Parallel perks: load split over 6 cylinders, high stiffness, no error stacking', do:()=>{setPreset(0); pitch=12; roll=10; syncSliders(); setSerial(true);}},
  {zh:'串联对照：机械臂每一级关节的间隙与变形都叠加到末端（红锥）',
   en:'Serial contrast: every joint adds backlash and flex to the tip (red cones)', do:()=>{setSerial(true);}},
  {zh:'飞行模拟器：浪涌谱驱动六腿，平台中心画出李萨如复合运动',
   en:'Flight sim: a swell spectrum drives the legs, tracing a Lissajous figure', do:()=>{setPreset(1);}},
  {zh:'其他应用：望远镜副镜微调、并联机床、卫星对接试验台',
   en:'Also: telescope secondary mirrors, parallel machine tools, docking rigs', do:()=>{setPreset(2);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((stp,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?stp.en:stp.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i; syncSteps(); STEPS[i].do();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function setPreset(p){
  preset=p;
  document.getElementById('btnWave').classList.toggle('on',p===1);
  document.getElementById('btnCircle').classList.toggle('on',p===2);
}
function setSerial(v){
  serialOn=v; armG.visible=v; targetG.visible=v;
  document.getElementById('btnSerial').classList.toggle('on',v);
}

/* ---- 统计 ---- */
let endErr=0;
function updateStats(){
  document.getElementById('stH').innerHTML=heave.toFixed(2)+'<small> m</small>';
  document.getElementById('stPR').innerHTML=(pitch*R2D).toFixed(0)+' / '+(roll*R2D).toFixed(0)+'<small> °</small>';
  const span=Math.max(...legLens)-Math.min(...legLens);
  document.getElementById('stSpan').innerHTML=(span*1000).toFixed(0)+'<small> mm</small>';
  document.getElementById('stErr').innerHTML='±'+(endErr*1000).toFixed(0)+'<small> mm</small>';
}

/* ---- UI ---- */
ui.h.addEventListener('input',e=>{heave=+e.target.value/100; preset=0; setPreset(0);
  document.getElementById('sHeaveVal').textContent=heave.toFixed(2)+' m';});
ui.p.addEventListener('input',e=>{pitch=+e.target.value*D2R; preset=0; setPreset(0);
  document.getElementById('sPitchVal').textContent=e.target.value+'°';});
ui.r.addEventListener('input',e=>{roll=+e.target.value*D2R; preset=0; setPreset(0);
  document.getElementById('sRollVal').textContent=e.target.value+'°';});
document.getElementById('btnWave').addEventListener('click',()=>setPreset(preset===1?0:1));
document.getElementById('btnCircle').addEventListener('click',()=>setPreset(preset===2?0:2));
document.getElementById('btnZero').addEventListener('click',()=>{setPreset(0); heave=2.2; pitch=0; roll=0; syncSliders();});
document.getElementById('btnSerial').addEventListener('click',()=>setSerial(!serialOn));
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh'; localStorage.setItem('htw-lang',LANG); applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark'; localStorage.setItem('htw-theme',THEME); applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, acc=0;
function stepPreset(dt){
  if(preset===1){        // 浪涌：三轴不同频率 → 李萨如
    heave=2.2+0.42*Math.sin(simT*0.9);
    pitch=10*D2R*Math.sin(simT*0.62+0.7);
    roll=13*D2R*Math.sin(simT*0.47+2.1);
    syncSliders();
  }else if(preset===2){  // 圆周扫掠：俯仰/横滚正交等幅 → 锥形运动
    heave=2.2+0.12*Math.sin(simT*1.6);
    pitch=13*D2R*Math.sin(simT*0.8);
    roll=13*D2R*Math.cos(simT*0.8);
    syncSliders();
  }
}
function stepArm(dt){
  /* 串联臂按位姿指令运动，但每级叠加间隙噪声，末端误差逐级放大 */
  const w1=0.010*Math.sin(simT*7.3)+0.006*Math.sin(simT*13.7);
  const w2=0.022*Math.sin(simT*5.1+1.0)+0.012*Math.sin(simT*11.3);
  const w3=0.04*Math.sin(simT*3.9+2.0)+0.02*Math.sin(simT*9.1);
  seg1.rotation.z=-pitch*0.6+w1;
  seg2.rotation.x=roll*0.8+w2;
  seg3.rotation.z=pitch*0.5+heave*0.1+w3;
  endErr=Math.abs(w1)*1.5+Math.abs(w2)*2.7+Math.abs(w3)*3.9;   // 逐级臂长加权
  targetG.position.set(6.2,heave+0.4,0);
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    stepPreset(dt);
    stepArm(dt);
    /* 轨迹记录（平台中心） */
    const arr=trailGeo.attributes.position.array;
    if(trailN<TRN){ trailN++; } else {
      arr.copyWithin(0,3);
    }
    arr[(Math.min(trailN,TRN)-1)*3]=0;
    arr[(Math.min(trailN,TRN)-1)*3+1]=heave+0.15;
    arr[(Math.min(trailN,TRN)-1)*3+2]=0;
    trailGeo.setDrawRange(0,Math.min(trailN,TRN));
    trailGeo.attributes.position.needsUpdate=true;
  }
  const span=updateLegs(heave,pitch,roll);
  /* 腿长读数贴到各腿中部（legLabels[i] 本身就是 CSS2DObject） */
  for(let i=0;i<6;i++){
    const leg=legs[i];
    vTmp.set(0,legLens[i]*0.55,0).applyQuaternion(leg.g.quaternion).add(leg.g.position);
    legLabels[i].position.copy(vTmp);
  }
  acc+=dt; if(acc>0.1){acc=0; updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis(); if(r.o.visible) r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta(); raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf); raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数与初始化 ---- */
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1') playing=false;
if(qp.get('labels')==='0') labelsOn=false;
document.getElementById('tglLabels').checked=labelsOn;
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
updateLegs(heave,pitch,roll);
applyTheme(); applyLang(); buildSteps(); start();
</script>
</body>
</html>
