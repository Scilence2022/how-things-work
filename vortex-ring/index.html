<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具与全局 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const QS=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
let playing=!QS.has('pause');          // ?pause=1 初始不运行
let labelsOn=QS.get('labels')!=='0';   // ?labels=0 隐藏标签
let timeScale=clamp(parseFloat(QS.get('speed'))||1,0.15,2); // ?speed=
const D2R=Math.PI/180;

/* ============ 渲染基础 ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0c141c,26,70);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(-2,8,28);   // 拉远取景：整条水槽+孔口入画、避开面板
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-3,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=60;
scene.add(new THREE.HemisphereLight(0xbfe0ff,0x0a0f14,0.85));
const key=new THREE.DirectionalLight(0xffffff,1.0);key.position.set(6,10,8);scene.add(key);

/* ============ 水槽（左壁开圆孔） ============ */
const tank=new THREE.Group();scene.add(tank);
const floorM=new THREE.MeshStandardMaterial({color:0x14222e,roughness:0.9});
const wallM=new THREE.MeshStandardMaterial({color:0x1e3242,roughness:0.55,transparent:true,opacity:0.55,side:THREE.DoubleSide});
const floor=new THREE.Mesh(new THREE.BoxGeometry(34,0.3,9),floorM);
floor.position.set(-1,-4.4,0);tank.add(floor);
// 左壁用 Shape 打洞再挤出，孔就是喷口
const ws=new THREE.Shape();
ws.moveTo(-4.7,-4.25);ws.lineTo(4.7,-4.25);ws.lineTo(4.7,4.25);ws.lineTo(-4.7,4.25);ws.closePath();
const hp=new THREE.Path();hp.absarc(0,0,1.35,0,Math.PI*2,true);ws.holes.push(hp);
const wall=new THREE.Mesh(new THREE.ExtrudeGeometry(ws,{depth:0.25,bevelEnabled:false}),wallM);
wall.rotation.y=Math.PI/2;wall.position.set(-14.85,0,0.125);tank.add(wall);
const rim=new THREE.Mesh(new THREE.TorusGeometry(1.35,0.05,8,40),
  new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0.8}));
rim.rotation.y=Math.PI/2;rim.position.set(-14.55,0,0);tank.add(rim);

/* ============ 墨水粒子 ============ */
const PN=900,NODES=14,TWO_PI=Math.PI*2,INV4PI=1/(4*Math.PI);
const pPos=new Float32Array(PN*3),pVel=new Float32Array(PN*3),pCol=new Float32Array(PN*3);
const pLife=new Float32Array(PN),pKind=new Uint8Array(PN),pR=new Float32Array(PN);
let pHead=0;
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pMat=new THREE.PointsMaterial({size:0.14,vertexColors:true,transparent:true,opacity:0.9,depthWrite:false});
const points=new THREE.Points(pGeo,pMat);points.frustumCulled=false;tank.add(points);
function spawn(x,y,z,vx,vy,vz,kind,life,r){
  const i=pHead;pHead=(pHead+1)%PN;
  pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
  pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;
  pLife[i]=life;pKind[i]=kind;pR[i]=r;
  setPColor(i);
}
const INKC=[0x5fb0ff,0x1d5f9e],CROC=[0xa8dcff,0x4b93c8];
function setPColor(i){
  const dark=THEME==='dark';
  const c=pKind[i]===1?CROC[dark?0:1]:INKC[dark?0:1];
  pCol[i*3]=((c>>16)&255)/255;pCol[i*3+1]=((c>>8)&255)/255;pCol[i*3+2]=(c&255)/255;
}

/* ============ 涡环：参数化圆环 + Biot–Savart 正则化场 ============
   诱导速度 u = Γ/4π · (dl×r)/(|r|²+ε²)^{3/2}（Rosenhead–Moore 核）
   环自感应前进速度 U = Γ/(4πR)·(ln(8R/a) − 1/4)，a 为涡核半径 */
const rings=[];
const ringGeo=new THREE.TorusGeometry(1,0.07,8,48);
const ringMat=new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0.4});
class Ring{
  constructor(x,y,z,ax,ay,az,R,g,dir,parent){
    this.p=new THREE.Vector3(x,y,z);
    this.ax=new THREE.Vector3(ax,ay,az).normalize();
    const ref=Math.abs(this.ax.y)>0.9?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0);
    this.e1=new THREE.Vector3().crossVectors(ref,this.ax).normalize();
    this.e2=new THREE.Vector3().crossVectors(this.ax,this.e1);
    this.R=R;this.g=g;this.core=0.32;this.dir=dir;this.age=0;this.alive=true;this.fade=1;
    this.ds=TWO_PI*R/NODES;
    this.np=new Float32Array(NODES*3);this.ns=new Float32Array(NODES*3);
    this.mesh=new THREE.Mesh(ringGeo,ringMat.clone());
    this.mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(this.e1,this.e2,this.ax));
    parent.add(this.mesh);
  }
  update(dt,extra){
    this.age+=dt;
    const self=INV4PI*this.g/this.R*(Math.log(8*this.R/this.core)-0.25); // 自感应
    // 其它环的诱导（涡环相遇会互相拉扯/穿行）
    const vx=new THREE.Vector3();fieldAt(this.p.x,this.p.y,this.p.z,vx,this);
    this.p.addScaledVector(this.ax,self*this.dir*dt).addScaledVector(vx,dt);
    if(extra)extra(this,dt);
    this.R+=0.04*dt;            // 卷吸清水，环缓慢变大
    this.g*=1-0.05*dt;          // 粘性耗散
    this.core+=0.02*dt;
    if(this.fade<1)this.fade=Math.max(0,this.fade-dt*1.4);
    if(this.g<0.4||this.age>16)this.fade=Math.max(0,this.fade-dt*2);
    if(this.fade<=0)this.alive=false;
    this.ds=TWO_PI*this.R/NODES;
    for(let i=0;i<NODES;i++){
      const a=i/NODES*TWO_PI,ca=Math.cos(a),sa=Math.sin(a);
      this.np[i*3]=this.p.x+(this.e1.x*ca+this.e2.x*sa)*this.R;
      this.np[i*3+1]=this.p.y+(this.e1.y*ca+this.e2.y*sa)*this.R;
      this.np[i*3+2]=this.p.z+(this.e1.z*ca+this.e2.z*sa)*this.R;
      const tx=-this.e1.x*sa+this.e2.x*ca,ty=-this.e1.y*sa+this.e2.y*ca,tz=-this.e1.z*sa+this.e2.z*ca;
      const s=this.g*this.ds*this.dir*this.fade;
      this.ns[i*3]=tx*s;this.ns[i*3+1]=ty*s;this.ns[i*3+2]=tz*s;
    }
    this.mesh.position.copy(this.p);this.mesh.scale.setScalar(this.R);
    this.mesh.material.opacity=0.42*this.fade*clamp(this.g/10,0.15,1);
    if(this.mesh.material.opacity<0.01)this.alive=false;
  }
  kill(){this.fade=Math.min(this.fade,0.3);}
}
function fieldAt(x,y,z,out,skip){
  out.set(0,0,0);
  for(const r of rings){
    if(!r.alive||r===skip)continue;
    const cc=r.core*r.core,K=INV4PI*r.g*r.ds;
    for(let i=0;i<NODES;i++){
      const rx=x-r.np[i*3],ry=y-r.np[i*3+1],rz=z-r.np[i*3+2];
      const d2=rx*rx+ry*ry+rz*rz+cc;
      const c=K/(d2*Math.sqrt(d2));
      out.x+=c*(r.ns[i*3+1]*rz-r.ns[i*3+2]*ry);
      out.y+=c*(r.ns[i*3+2]*rx-r.ns[i*3]*rz);
      out.z+=c*(r.ns[i*3]*ry-r.ns[i*3+1]*rx);
    }
  }
  return out;
}

/* ============ 主循环 ============ */
const V=new THREE.Vector3();
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=dt0*timeScale;
  if(playing){
    simT+=dt;
    stepSim(dt);
  }
  // 相机缓动
  if(camLerp>0){
    const k=1-Math.exp(-3*dt0);
    camera.position.lerp(camGoalP,k);controls.target.lerp(camGoalT,k);
    if(camera.position.distanceTo(camGoalP)<0.05)camLerp=0;
  }
  // 标签
  ringLbl.o.visible=false;
  if(labelsOn){
    if(mode!=='vrs'){
      const r=leadRing();
      if(r&&r.age>0.9){ringLbl.o.visible=true;ringLbl.div.textContent=ringTxt(r);
        ringLbl.o.position.set(r.p.x,r.p.y+r.R+0.7,r.p.z);}
    }
    for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  }else{
    for(const r of labelReg)r.o.visible=false;
  }
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function stepSim(dt){
  /* —— 喷射 —— */
  if(jetOn&&mode!=='vrs'){
    jetT+=dt;
    const n=Math.min(14,Math.round(300*dt)+ (Math.random()<300*dt%1?1:0));
    for(let k=0;k<n;k++){
      const a=Math.random()*TWO_PI,rr=Math.sqrt(Math.random())*1.05;
      const prof=1-0.72*(rr/1.05)**2;              // 抛物型剖面：孔缘慢、中心快
      spawn(-14.2+Math.random()*0.3,Math.cos(a)*rr,Math.sin(a)*rr,
        jetU*prof,0,0,0,16,rr/1.05);
    }
    if(jetT>=jetDur){
      jetOn=false;pulseCount++;lastFire=simT;
      const g=clamp(jetU*jetDur*3.3*amp,4,42);      // 冲量→环量
      makeRing(-13.5,0,0,[1,0,0],1.0+0.2*(amp-1),g,1,tank);
    }
  }
  /* —— 自动补脉冲（招牌画面 10 秒内必现） —— */
  if(mode==='tank'&&!jetOn&&playing&&!rings.some(r=>r.alive)&&simT-lastFire>2.2&&simT>0.15)firePulse();  // 0.15s 后自动首脉冲，首屏即见成环
  /* —— 横流粒子 —— */
  if(crossOn&&mode!=='vrs'&&Math.random()<dt*90)
    spawn(1.5+Math.random(),4.5,Math.random()*2.4-1.2,0,-2.4,0,1,5,0);
  /* —— 水母 —— */
  if(mode==='jelly'){
    jPulseT-=dt;
    bell.scale.y=0.8+0.18*Math.sin(simT*3);
    if(jPulseT<=0){
      jPulseT=2.0;
      makeRing(jx-1.2,-1.6,0,[1,0,0],0.95,clamp(6.5*0.7*3.3*amp,5,30),-1,tank);
      jvx+=1.5*amp;                                // 反冲：喷环→身体前进
    }
    jvx*=1-0.55*dt;jx=clamp(jx+jvx*dt,-11,12);
    jelly.position.x=jx;jelly.position.z=Math.sin(simT*0.7)*0.5;
    if(jx>11.5){jx=-9;jvx=0;}
  }
  /* —— 涡环状态（直升机） —— */
  if(mode==='vrs'){
    ratio=wSet/v_i;
    regime=fwdT>0?0:(ratio<0.4?0:ratio<=1.3?1:2);
    const liftT=regime===1?0.45:regime===2?0.75:1;
    lift+=(liftT-lift)*Math.min(1,dt*1.6);
    wAct+=((wSet+(1-lift)*5.0)-wAct)*Math.min(1,dt*2);  // 升力亏缺→下沉加剧
    hAlt-=wAct*dt;
    if(hAlt<0.3){hAlt=0.3;crashT+=dt;if(crashT>2.2){hAlt=13;crashT=0;lift=1;}}
    fwdT=Math.max(0,fwdT-dt);
    heliX=clamp(heliX+(fwdT>0?2.5:0)*dt,-6,6);
    heli.position.set(heliX+(1-lift)*0.06*Math.sin(simT*37),0.9+hAlt,(1-lift)*0.06*Math.cos(simT*41));
    heli.rotation.z=(1-lift)*0.02*Math.sin(simT*29);
    blades.rotation.y+=28*dt;
    // 桨尖涡：从桨盘边缘交替脱出（heli 局部坐标）
    if(Math.random()<dt*3.2){
      const side=Math.random()<0.5?-1:1;
      makeRing(side*1.55,0.8,side*0.6*Math.random(),
        [0,1,0],0.5,clamp(2+wSet*0.25,2,6),-1,heli);
    }
    for(const r of rings){
      if(!r.alive)continue;
      if(regime===1){ // 涡环状态：下沉太慢，尾涡被托回桨盘再吞入
        const dx=r.p.x,dy=r.p.y-0.85;
        if(dx*dx+dy*dy<4.4&&dy>-1.5&&dy<3.4){
          r.p.y+=2.4*dt;r.p.x-=dx*0.5*dt;
        }
      }else if(regime===2){r.p.y-=1.2*dt;r.p.x+=Math.sign(r.p.x)*0.8*dt;}
      if(fwdT>0)r.p.x-=2.2*dt;   // 前飞：尾涡甩在身后
      if(r.p.y<-6)r.fade=Math.min(r.fade,0.4); // 落到下方远处，耗散
    }
  }
  /* —— 环推进 —— */
  for(const r of rings){
    if(!r.alive)continue;
    let extra=null;
    if(mode!=='vrs'){
      extra=(rr,dt2)=>{
        if(rr.p.x>13.6)rr.fade=Math.min(rr.fade,0.5);  // 撞到远端，耗散
        if(crossOn&&rr.p.x>0.8&&rr.p.x<3.2&&mode==='tank')rr.p.y-=0.25*dt2; // 过横流略被压
      };
    }
    r.update(dt,extra);
  }
  /* —— 粒子输运 —— */
  for(let i=0;i<PN;i++){
    if(pLife[i]<=0)continue;
    pLife[i]-=dt;
    const ix=i*3;
    fieldAt(pPos[ix],pPos[ix+1],pPos[ix+2],V);
    if(jetOn&&pKind[i]===0&&pPos[ix]<-12.6){
      V.x+=jetU*(1-0.72*pR[i]*pR[i])*0.55;           // 塞子还在被推动
      V.x*=1.6;
    }
    if(crossOn&&pKind[i]===0&&pPos[ix]>1.2&&pPos[ix]<2.8)V.y-=1.1; // 穿过横流
    pPos[ix]+=(pVel[ix]*0.4+V.x)*dt;
    pPos[ix+1]+=(pVel[ix+1]*0.4+V.y)*dt;
    pPos[ix+2]+=(pVel[ix+2]*0.4+V.z)*dt;
    // 轻微粘性扩散
    pPos[ix+1]+=(Math.random()-0.5)*0.02;
    pPos[ix+2]+=(Math.random()-0.5)*0.02;
    if(pLife[i]<=0||pPos[ix]>16||pPos[ix]<-16||Math.abs(pPos[ix+1])>6){pLife[i]=0;pPos[ix+1]=99;}
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
}
let ratio=0;
applyTheme();applyLang();buildSteps();
el('tglLabels').checked=labelsOn;
el('sSpd').value=timeScale*100;el('sSpdVal').textContent=timeScale.toFixed(1)+'×';
updateStats();
if(playing)el('play').textContent=L('暂停','Pause');
start();
