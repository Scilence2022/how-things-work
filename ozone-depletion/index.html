<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臭氧空洞 · 一个氯自由基的十万次破坏</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(200,60,60,.9); color: #b03030; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.r { color: #ff8787; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.c { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(255,209,102,.26); }
  .abtn.danger { background: rgba(255,107,107,.12); border-color: rgba(255,107,107,.5); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="臭氧空洞:一个氯的十万次破坏" data-en="The Ozone Hole: one chlorine, 100,000 kills">臭氧空洞:一个氯的十万次破坏</h1>
  <div class="sub" data-zh="氟利昂在平流层被紫外线劈出 Cl·,Cl· + O₃ → ClO + O₂,ClO + O → Cl + O₂——氯原样归还,循环十万个来回才退休 · 空格播放/暂停" data-en="UV splits CFCs into Cl·; Cl· + O₃ → ClO + O₂ and ClO + O → Cl + O₂ — chlorine returned intact, ~100,000 laps before retirement · Space = play/pause">氟利昂在平流层被紫外线劈出 Cl·,Cl· + O₃ → ClO + O₂,ClO + O → Cl + O₂——氯原样归还,循环十万个来回才退休 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="本页已毁臭氧" data-en="ozone destroyed here">本页已毁臭氧</span><span class="v r" id="stKill">0</span>
  <span class="k" data-zh="活性 Cl· 数" data-en="active Cl·">活性 Cl· 数</span><span class="v g" id="stCl">0</span>
  <span class="k" data-zh="臭氧层剩余" data-en="layer remaining">臭氧层剩余</span><span class="v" id="stO3">100<small>%</small></span>
  <span class="k" data-zh="换算真实世界" data-en="scaled to reality">换算真实世界</span><span class="v" id="stReal">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="O₃ 臭氧 / O 氧原子" data-en="O₃ ozone / O atom">O₃ 臭氧 / O 氧原子</span>
    <span class="chip.r" data-zh="Cl· / ClO(催化毒瘤)" data-en="Cl· / ClO (catalyst)">Cl· / ClO(催化毒瘤)</span>
    <span class="chip.c" data-zh="O₂(无害离场)" data-en="O₂ (leaves harmlessly)">O₂(无害离场)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnCFC" data-zh="释放一罐氟利昂" data-en="release a CFC canister">释放一罐氟利昂</button>
    <button class="abtn danger" id="btnAntarctic" data-zh="南极春天:储库齐爆" data-en="Antarctic spring: reservoirs burst">南极春天:储库齐爆</button>
  </div>
  <div class="row"><label data-zh="紫外线强度" data-en="UV intensity">紫外线强度</label><input id="uv" type="range" min="0" max="100" step="1" value="70"><span class="val" id="uvVal">70%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../radical-chain/" data-zh="同款自由基链式反应" data-en="same radical chain logic">同款自由基链式反应</a>
    <a href="../oxygen/" data-zh="臭氧从哪来:光合作用" data-en="where O₂ comes from">臭氧从哪来:光合作用</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xdfe9f2 : 0x0a0f16);
  starMat.opacity = THEME === 'dark' ? 0.8 : 0;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('臭氧空洞', 'Ozone Depletion');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 300);
camera.position.set(2.2, 2.6, 8.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 10, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 4, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  O: mat(0xff6b6b),
  O2b: mat(0xc3f5e5),
  Cl: new THREE.MeshBasicMaterial({ color: 0x9dff70, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.95 }),
  ClO: mat(0xffa94d),
  cfc: mat(0xb197fc),
  bond: mat(0x8a93a3, { metalness: 0.4 }),
  star: null,
};
/* 星空(暗色模式) */
const starMat = new THREE.PointsMaterial({ color: 0x9fb0c3, size: 0.06, transparent: true, opacity: 0.8 });
{
  const g = new THREE.BufferGeometry();
  const N = 500, arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, r = 30 + Math.random() * 40;
    arr[i * 3] = Math.cos(a) * r;
    arr[i * 3 + 1] = 8 + Math.random() * 40;
    arr[i * 3 + 2] = Math.sin(a) * r;
  }
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  scene.add(new THREE.Points(g, starMat));
}
/* 地球弧面 */
const earth = new THREE.Mesh(new THREE.SphereGeometry(26, 48, 32),
  mat(0x2b6cb0, { roughness: 0.8, opacity: 1 }));
earth.position.y = -25.4;
scene.add(earth);
const atmGlow = new THREE.Mesh(new THREE.SphereGeometry(26.6, 48, 32),
  new THREE.MeshBasicMaterial({ color: 0x4dabf7, transparent: true, opacity: 0.08, side: THREE.BackSide, blending: THREE.AdditiveBlending }));
atmGlow.position.y = -25.4;
scene.add(atmGlow);

/* ================= 臭氧层(顶部一排 O₃ 图标) ================= */
const O3_N = 40;
const o3Layer = new THREE.Group();
o3Layer.position.y = 4.6;
scene.add(o3Layer);
const o3Icons = [];
{
  const geo = new THREE.SphereGeometry(0.1, 10, 8);
  for (let i = 0; i < O3_N; i++) {
    const g2 = new THREE.Group();
    const m1 = new THREE.Mesh(geo, M.O);
    const m2 = new THREE.Mesh(geo, M.O);
    const m3 = new THREE.Mesh(geo, M.O);
    m1.position.set(-0.12, 0.04, 0);
    m2.position.set(0.12, 0.04, 0);
    m3.position.set(0, -0.08, 0);
    g2.add(m1, m2, m3);
    const a = i / O3_N * Math.PI * 2;
    const x = Math.cos(a) * 7.5, z = Math.sin(a) * 7.5;
    g2.position.set(x, (Math.sin(i * 3.7) * 0.4), z);
    g2.rotation.y = -a;
    o3Layer.add(g2);
    o3Icons.push(g2);
  }
}
/* 地面(近景台) */
const stage = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.6, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
stage.position.y = 0;
scene.add(stage);

/* ================= 紫外线光束 ================= */
const uvBeams = [];
const uvMat = new THREE.MeshBasicMaterial({ color: 0xb197fc, transparent: true, opacity: 0.0,
  blending: THREE.AdditiveBlending, depthWrite: false });
for (let i = 0; i < 6; i++) {
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 3.2, 6), uvMat.clone());
  const a = i / 6 * Math.PI * 2;
  beam.position.set(Math.cos(a) * 2.2, 5.8, Math.sin(a) * 2.2);
  beam.rotation.z = 0.3 * Math.cos(a);
  beam.rotation.x = -0.3 * Math.sin(a);
  scene.add(beam);
  uvBeams.push(beam);
}
let uv = 0.7;

/* ================= 分子构建 ================= */
function mkO3(pos) {
  const g = new THREE.Group();
  const a = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 10), M.O);
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 10), M.O);
  const c = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 10), M.O);
  a.position.set(-0.16, -0.06, 0); b.position.set(0.16, -0.06, 0); c.position.set(0, 0.16, 0);
  g.add(a, b, c);
  g.position.copy(pos);
  scene.add(g);
  return g;
}
function mkO(pos) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 10), M.O);
  m.position.copy(pos);
  scene.add(m);
  return m;
}
function mkO2(pos) {
  const g = new THREE.Group();
  const a = new THREE.Mesh(new THREE.SphereGeometry(0.15, 14, 10), M.O2b);
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.15, 14, 10), M.O2b);
  a.position.set(-0.13, 0, 0); b.position.set(0.13, 0, 0);
  const bond = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.26, 8), M.bond);
  bond.rotation.z = Math.PI / 2;
  g.add(a, b, bond);
  g.position.copy(pos);
  scene.add(g);
  return g;
}
function mkCl(pos) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.15, 14, 10), M.Cl);
  m.position.copy(pos);
  scene.add(m);
  return m;
}
function mkClO(pos) {
  const g = new THREE.Group();
  const cl = new THREE.Mesh(new THREE.SphereGeometry(0.15, 14, 10), M.Cl);
  const o = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 10), M.O);
  o.position.set(0.26, 0, 0);
  const bond = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.26, 8), M.bond);
  bond.rotation.z = Math.PI / 2;
  bond.position.set(0.13, 0, 0);
  g.add(cl, o, bond);
  g.position.copy(pos);
  scene.add(g);
  return g;
}
function mkCFC(pos) {
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), M.cfc);
  g.add(c);
  for (let i = 0; i < 3; i++) {
    const a = i / 3 * Math.PI * 2;
    const x = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), M.cfc);
    x.position.set(Math.cos(a) * 0.3, i === 0 ? 0.24 : -0.12, Math.sin(a) * 0.3);
    g.add(x);
  }
  g.position.copy(pos);
  scene.add(g);
  return g;
}

/* ================= 状态(在标签前) ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let tSim = 0;
let killed = 0;
let cfcPending = 0;          // 待光解 CFC 数
let antarcticT = 0;          // 南极春天爆发剩余时间
const clUnits = [];          // {mesh:Cl球 or ClO group, phase:'hunt'|'ClO', t, homeO3}
const o3Stock = [];          // 可用 O₃(3D 摆件,近景)
const O3_SPOTS = 5;
for (let i = 0; i < O3_SPOTS; i++) {
  const a = i / O3_SPOTS * Math.PI * 2 + 0.6;
  const p = new THREE.Vector3(Math.cos(a) * 2.0, 1.5 + 0.35 * Math.sin(i * 2.1), Math.sin(a) * 2.0);
  o3Stock.push({ pos: p, mesh: null, alive: false });
}
function refreshO3Stock() {
  for (const s of o3Stock) {
    if (s.alive && !s.mesh) s.mesh = mkO3(s.pos);
    if (!s.alive && s.mesh) { scene.remove(s.mesh); s.mesh = null; }
  }
}
for (const s of o3Stock) s.alive = true;
refreshO3Stock();

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblLayer = addLabel(() => L('臭氧层(25 km 高空):吸收 97% 紫外', 'ozone layer (25 km up): absorbs 97% of UV'),
  new THREE.Vector3(0, 5.35, 0), 'b', o3Layer);
const lblCycle = addLabel(() => {
  const hunting = clUnits.filter(c => c.phase === 'hunt').length;
  const clo = clUnits.filter(c => c.phase === 'ClO').length;
  return L(`催化循环:${hunting} 个 Cl· 正在找 O₃,${clo} 个 ClO 在等自由 O`,
    `cycle: ${hunting} Cl· hunting O₃, ${clo} ClO awaiting free O`);
}, new THREE.Vector3(0, 3.1, 0), 'st');
const lblRes = addLabel(() => antarcticT > 0
  ? L('极地平流层云表面:HCl + ClONO₂ → Cl₂,阳光一来全部变 Cl·!', 'on PSC surfaces: HCl + ClONO₂ → Cl₂; spring light frees it all as Cl·!')
  : L('平静时氯大多锁在储库(HCl、ClONO₂)里,循环率低', 'chlorine mostly locked in reservoirs (HCl, ClONO₂) — low turnover'),
  new THREE.Vector3(0, -0.75, 0), antarcticT > 0 ? 'g' : 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '氟利昂:无害的谎言', be: 'CFCs: harmless-looking',
    d: 'CFC-11/12 化学稳定、不可燃,在地面完美;升到平流层却遇到强紫外——C-Cl 键被劈断,释放 Cl·。',
    de: 'Stable, non-flammable, perfect on the ground — but strong UV at 25 km snaps the C-Cl bond and frees Cl·.',
    act: () => releaseCFC() },
  { b: '第一击:Cl· + O₃ → ClO + O₂', be: 'Strike one: Cl· + O₃ → ClO + O₂',
    d: '氯自由基抽出臭氧的一个氧原子,臭氧变普通氧气——紫外线防护网破了一个洞。',
    de: 'The radical strips one oxygen from ozone, leaving plain O₂ — a hole in the UV shield.',
    act: () => releaseCFC() },
  { b: '第二击:ClO + O → Cl + O₂', be: 'Strike two: ClO + O → Cl + O₂',
    d: 'ClO 遇到游离氧原子,把氧吐出去换回 Cl·——催化剂原样归来,一个都不损耗。',
    de: 'ClO hands its oxygen to a free O atom and regenerates Cl· — the catalyst returns intact, nothing consumed.',
    act: () => { uv = 1; document.getElementById('uv').value = 100; document.getElementById('uvVal').textContent = '100%'; } },
  { b: '一个 Cl ≈ 十万个 O₃', be: 'One Cl ≈ 100,000 O₃',
    d: '循环重复约十万次直到 Cl 被偶发反应锁进储库退休——这就是 1 kg 氟利昂毁掉 10 万 kg 臭氧的原因。',
    de: 'The loop repeats ~100,000 times before Cl retires into a reservoir — hence 1 kg CFC destroys ~100,000 kg ozone.',
    act: () => { for (let i = 0; i < 3; i++) setTimeout(releaseCFC, i * 400); } },
  { b: '南极空洞:云与春天', be: 'Antarctic hole: clouds + spring',
    d: '极夜期间氯锁进储库;极地平流层云表面把 HCl+ClONO₂ 变成 Cl₂。春天阳光一到,Cl· 大爆发——臭氧对半砍,September 空洞。',
    de: 'During polar night chlorine locks into reservoirs; PSC surfaces convert them to Cl₂. Spring light detonates it all — the September hole.',
    act: () => antarcticSpring() },
];
function stepIndex() {
  if (antarcticT > 0) return 4;
  if (killed > 8) return 3;
  if (clUnits.some(c => c.phase === 'ClO')) return 2;
  if (clUnits.length) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 反应逻辑 ================= */
function freeO3() {
  const s = o3Stock.filter(q => q.alive);
  if (s.length) return s[Math.floor(Math.random() * s.length)];
  /* 全毁则补充(模拟还在生成) */
  const dead = o3Stock.filter(q => !q.alive);
  if (dead.length) { dead[0].alive = true; refreshO3Stock(); return dead[0]; }
  return null;
}
function releaseCFC() {
  cfcPending += 1;
  const cfc = mkCFC(new THREE.Vector3((Math.random() - 0.5) * 4, 0.6, -2.4));
  anims.push({ kind: 'cfc', mesh: cfc, t: 0 });
}
function antarcticSpring() {
  antarcticT = 6;
  for (let i = 0; i < 6; i++) spawnCl();
}
function spawnCl() {
  const mesh = mkCl(new THREE.Vector3((Math.random() - 0.5) * 3, 2.6, (Math.random() - 0.5) * 3));
  clUnits.push({ mesh, phase: 'hunt', t: 0 });
}
const anims = [];    // 飞行小动画 {kind, mesh, t, from, to, src}

function tick(dt) {
  /* CFC 上升→光解 */
  for (const a of anims) {
    a.t += dt;
    if (a.kind === 'cfc') {
      a.mesh.position.y += dt * 1.1;
      a.mesh.rotation.y += dt * 2;
      if (a.mesh.position.y > 3.4 || a.t > 3) {
        scene.remove(a.mesh);
        a.done = true;
        if (Math.random() < uv) spawnCl();
      }
    }
  }
  for (let i = anims.length - 1; i >= 0; i--) if (anims[i].done) anims.splice(i, 1);
  /* Cl 单位 */
  for (const u of clUnits) {
    u.t += dt;
    if (u.phase === 'hunt') {
      /* 找一个 O₃ */
      if (!u.target || !u.target.alive) {
        u.target = freeO3();
        if (!u.target) continue;
        u.attacking = true;
      }
      const tgt = u.target.mesh.position;
      const d = new THREE.Vector3().subVectors(tgt, u.mesh.position);
      const dist = d.length();
      if (dist > 0.35) {
        u.mesh.position.addScaledVector(d.normalize(), clamp(dt * 1.6, 0, dist));
      } else {
        /* 摧毁:O₃ → ClO + O₂ */
        scene.remove(u.target.mesh);
        u.target.alive = false;
        u.target.mesh = null;
        killed++;
        scene.remove(u.mesh);
        const clo = mkClO(u.mesh.position.clone());
        const o2 = mkO2(u.mesh.position.clone().add(new THREE.Vector3(0.7, 0.3, 0)));
        u.mesh = clo;
        u.phase = 'ClO';
        u.t = 0;
        anims.push({ kind: 'o2', mesh: o2, t: 0, v: new THREE.Vector3((Math.random() - 0.5), 0.5, (Math.random() - 0.5)).normalize() });
      }
    } else if (u.phase === 'ClO') {
      /* 找自由 O 原子 */
      if (u.t > 1.2) {
        const freeO = mkO(new THREE.Vector3((Math.random() - 0.5) * 4, 2.2 + Math.random(), (Math.random() - 0.5) * 4));
        const d = new THREE.Vector3().subVectors(freeO.position, u.mesh.position);
        const dist = d.length();
        if (dist > 0.3) {
          u.mesh.position.addScaledVector(d.normalize(), clamp(dt * 1.8, 0, dist));
        } else {
          scene.remove(freeO);
          scene.remove(u.mesh);
          killed++;
          const cl = mkCl(u.mesh.position.clone().add(new THREE.Vector3(-0.2, 0, 0)));
          const o2 = mkO2(u.mesh.position.clone().add(new THREE.Vector3(0.5, 0.2, 0)));
          u.mesh = cl;
          u.phase = 'hunt';
          u.target = null;
          u.t = 0;
          anims.push({ kind: 'o2', mesh: o2, t: 0, v: new THREE.Vector3((Math.random() - 0.5), 0.5, (Math.random() - 0.5)).normalize() });
        }
      }
    }
  }
  /* O₂ 离场 */
  for (const a of anims) {
    if (a.kind === 'o2') {
      a.mesh.position.addScaledVector(a.v, dt * 1.4);
      a.mesh.rotation.z += dt * 2;
      if (a.t > 2.2) { scene.remove(a.mesh); a.done = true; }
    }
  }
  for (let i = anims.length - 1; i >= 0; i--) if (anims[i].kind === 'o2' && anims[i].done) anims.splice(i, 1);
  /* 南极春天倒计时 */
  if (antarcticT > 0) antarcticT -= dt;
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elUv = document.getElementById('uv');
const elUvVal = document.getElementById('uvVal');
const btnCFC = document.getElementById('btnCFC');
const btnAnt = document.getElementById('btnAntarctic');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elUv.addEventListener('input', e => {
  uv = parseInt(e.target.value) / 100;
  elUvVal.textContent = e.target.value + '%';
});
btnCFC.addEventListener('click', releaseCFC);
btnAnt.addEventListener('click', antarcticSpring);
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  tick(dts);
  /* 紫外光束闪烁 */
  uvBeams.forEach((b, i) => {
    b.material.opacity = uv * (0.15 + 0.2 * Math.abs(Math.sin(tSim * 3 + i)));
  });
  /* 臭氧层呼吸 */
  o3Icons.forEach((g, i) => {
    const s = 1 + 0.12 * Math.sin(tSim * 2 + i);
    g.scale.setScalar(s);
  });
  o3Layer.rotation.y += dts * 0.05;
  /* Cl 发光脉动 */
  for (const u of clUnits) {
    if (u.phase === 'hunt' && u.mesh.material === M.Cl) {
      u.mesh.scale.setScalar(1 + 0.25 * Math.sin(tSim * 6));
    }
  }

  const remaining = Math.max(0, 100 - killed * (100 / 120));
  document.getElementById('stKill').textContent = killed;
  document.getElementById('stCl').textContent = clUnits.length;
  document.getElementById('stO3').innerHTML = remaining.toFixed(0) + '<small>%</small>';
  document.getElementById('stReal').innerHTML =
    L(`×10⁵ <small>分子 O₃/个 Cl</small>`, `×10⁵ <small>O₃ per Cl</small>`);

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
