<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>驻波与乐器 · 音色是泛音的配方</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#38d9a9;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0ca678;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(56,217,169,.9); color: #c3f5e5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(12,166,120,.9); color: #0ca678; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #38d9a9; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.g { color: #c3f5e5; border-color: rgba(56,217,169,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  #modeRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1; min-width: 80px;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(56,217,169,.12); }
  :root[data-theme="light"] .bon.on { background: rgba(12,166,120,.08); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(56,217,169,.10); border-color: rgba(56,217,169,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,166,120,.08); border-color: rgba(12,166,120,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #b8f2e0; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="驻波与乐器：音色是泛音的配方" data-en="Standing Waves: timbre is the harmonic recipe">驻波与乐器：音色是泛音的配方</h1>
  <div class="sub" data-zh="两端固定的弦只允许特定波长驻留:λ = 2L/n;基频相同、泛音配方不同,钢琴和小提琴就听出差别 · 空格播放/暂停" data-en="A fixed string only hosts λ = 2L/n; same fundamental, different overtone recipe — that's piano vs violin · Space = play/pause">两端固定的弦只允许特定波长驻留:λ = 2L/n;基频相同、泛音配方不同,钢琴和小提琴就听出差别 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="谐波次数 n" data-en="harmonic n">谐波次数 n</span><span class="v g" id="stN">—</span>
  <span class="k" data-zh="波长 λ" data-en="wavelength λ">波长 λ</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="频率" data-en="frequency">频率</span><span class="v g" id="stF">—</span>
  <span class="k" data-zh="波节数" data-en="nodes">波节数</span><span class="v" id="stNd">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.g" data-zh="弦(实时振动)" data-en="string (live)">弦(实时振动)</span>
    <span class="chip.b" data-zh="包络线(波节/波腹)" data-en="envelope (nodes/antinodes)">包络线(波节/波腹)</span>
  </div>
  <div id="modeRow">
    <button class="bon on" id="pPure"><b data-zh="纯基频" data-en="pure sine">纯基频</b><i data-zh="音叉:只有 n=1" data-en="tuning fork: only n=1">音叉:只有 n=1</i></button>
    <button class="bon" id="pGuitar"><b data-zh="吉他" data-en="guitar">吉他</b><i data-zh="泛音衰减配方" data-en="decaying overtones">泛音衰减配方</i></button>
    <button class="bon" id="pPiano"><b data-zh="钢琴" data-en="piano">钢琴</b><i data-zh="奇次泛音偏强" data-en="strong odd harmonics">奇次泛音偏强</i></button>
  </div>
  <div class="row"><label data-zh="主谐波 n" data-en="dominant n">主谐波 n</label><input id="harm" type="range" min="1" max="4" step="1" value="1"><span class="val" id="harmVal">1</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglEnv" type="checkbox" checked> <span data-zh="包络线" data-en="envelope">包络线</span></label>
      <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../fourier-series/" data-zh="傅里叶:任意波形=泛音之和" data-en="Fourier: any wave = overtones summed">傅里叶:任意波形=泛音之和</a>
    <a href="../double-slit/" data-zh="干涉:波的另一场重头戏" data-en="interference: the other wave show">干涉:波的另一场重头戏</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('驻波与乐器', 'Standing Waves & Instruments');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 1.9, 7.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  post: mat(0x39424f, { roughness: 0.7 }),
  string: mat(0x63e6be, { metalness: 0.4, roughness: 0.35, emissiveIntensity: 0.25 }),
  env: new THREE.LineBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.5 }),
  node: mat(0xff8787, { roughness: 0.4 }),
  bar: mat(0xb197fc, { metalness: 0.4, roughness: 0.4 }),
};

/* ================= 弦 ================= */
const STR_L = 5.0;             // 弦长
const Y0 = 1.6;                // 弦高
const SEG = 80;
const floor = new THREE.Mesh(new THREE.BoxGeometry(8.4, 0.18, 3.6), M.floor);
floor.position.set(0, -0.1, 0);
scene.add(floor);
for (const x of [-STR_L / 2, STR_L / 2]) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.6, 0.16), M.post);
  post.position.set(x, 0.8, 0);
  scene.add(post);
}
/* 弦: instanced 球串 */
const strGeo = new THREE.BufferGeometry();
strGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((SEG + 1) * 3), 3));
const strLine = new THREE.Line(strGeo, new THREE.LineBasicMaterial({ color: 0x63e6be, linewidth: 2 }));
scene.add(strLine);
const strDots = [];
{
  const g = new THREE.SphereGeometry(0.028, 8, 6);
  for (let i = 0; i <= 40; i++) {
    const m = new THREE.Mesh(g, M.string);
    scene.add(m);
    strDots.push(m);
  }
}
/* 包络线(上下两条) */
function envelopeLine(sign) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array((SEG + 1) * 3), 3));
  const l = new THREE.Line(g, M.env);
  scene.add(l);
  return l;
}
const envUp = envelopeLine(1);
const envDn = envelopeLine(-1);
/* 波节标记 */
const nodeDots = [];
for (let i = 0; i < 5; i++) {
  const n = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), M.node);
  n.visible = false;
  scene.add(n);
  nodeDots.push(n);
}
/* 泛音配方柱(n=1..5) */
const bars = [];
for (let i = 0; i < 5; i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.36, 1, 0.36), M.bar.clone());
  b.geometry.translate(0, 0.5, 0);
  b.position.set(-1.6 + i * 0.8, 0.02, 1.15);
  b.scale.y = 0.05;
  scene.add(b);
  bars.push(b);
}

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let mainN = 1;                 // 主谐波
let mix = [1, 0, 0, 0, 0];     // 泛音配方
let tSim = 0;
const F1 = 110;                // 基频(A2)
const recipes = {
  pure: [1, 0, 0, 0, 0],
  guitar: [1, 0.5, 0.33, 0.15, 0.08],
  piano: [1, 0.25, 0.5, 0.12, 0.22],
};
function setMix(m) {
  mix = m.slice();
  bars.forEach((b, i) => { b.scale.y = 0.05 + mix[i] * 1.3; });
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblStr = addLabel(() => L(`弦长 L(两端固定)`, `string L (both ends fixed)`), new THREE.Vector3(0, Y0 + 0.45, 0), 'g');
const lblBars = addLabel(() => L('泛音配方(n=1…5 的权重)', 'overtone recipe (n = 1…5)'), new THREE.Vector3(-0.8, 1.75, 1.15), 'g');
const lblStatus = addLabel(() => L('波节不动,波腹最大;频率只取 n·f₁ —— 不是随便什么频率都能活', 'nodes hold, antinodes swing; only n·f₁ survives'),
  new THREE.Vector3(0, -0.5, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '两端锁死:波长被筛选', be: 'Fixed ends select wavelengths',
    d: '弦两端必须自己是波节——只有 L = n·λ/2 的波长才能驻留,别的频率一出现就被两端反射抵消。',
    de: 'The ends must be nodes — only λ = 2L/n survives; any other frequency cancels itself at the posts.',
    act: () => { document.getElementById('pPure').click(); } },
  { b: 'n 次谐波:频率 = n·f₁', be: 'nth harmonic: f = n·f₁',
    d: 'n=1 基频, n=2 两段、频率翻倍……频率只能取基频的整数倍——这就是「谐波」的名字来源。',
    de: 'n = 1 fundamental; n = 2 twice the frequency… frequencies come only in integer multiples — hence "harmonics".',
    act: () => { document.getElementById('harm').value = 2; mainN = 2; document.getElementById('harmVal').textContent = '2'; setMix([0, 1, 0, 0, 0]); } },
  { b: '波节与波腹', be: 'Nodes and antinodes',
    d: 'n 次驻波有 n−1 个纹丝不动的波节,波腹在中间疯狂振——能量被锁在两节之间来回倒手,不向外跑。',
    de: 'n−1 dead nodes, furious antinodes between them — energy sloshes in place instead of radiating away.',
    act: () => { document.getElementById('harm').value = 3; mainN = 3; document.getElementById('harmVal').textContent = '3'; setMix([0, 0, 1, 0, 0]); } },
  { b: '音色 = 泛音配方', be: 'Timbre = the overtone recipe',
    d: '同一个 A4,钢琴与吉他听感不同——因为泛音配方不同。切一下三种音色,看柱状图与波形同时变。',
    de: 'Same A4, different instrument: the overtone mix differs. Flip the three presets and watch bars and waveform shift.',
    act: () => { document.getElementById('pGuitar').click(); } },
  { b: '耳蜗在做什么', be: 'What your cochlea does',
    d: '耳蜗沿螺旋管按频率分位置共振,把配方拆成一张频谱——你听到的「音色」,就是大脑读到的这张柱状图。',
    de: 'Your cochlea resonates place-by-frequency, unmixing the recipe — "timbre" is your brain reading these bars.',
    act: () => { document.getElementById('pPiano').click(); } },
];
function stepIndex() {
  if (mainN === 3) return 2;
  if (mix[1] > 0.4) return 3;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elHarm = document.getElementById('harm');
const elHarmVal = document.getElementById('harmVal');
const tglLabels = document.getElementById('tglLabels');
const tglEnv = document.getElementById('tglEnv');
const tglRotate = document.getElementById('tglRotate');
const stN = document.getElementById('stN'), stL = document.getElementById('stL'),
  stF = document.getElementById('stF'), stNd = document.getElementById('stNd');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
document.getElementById('pPure').addEventListener('click', () => {
  setMix(recipes.pure);
  mainN = 1; elHarm.value = 1; elHarmVal.textContent = '1';
  document.getElementById('pPure').classList.add('on');
  document.getElementById('pGuitar').classList.remove('on');
  document.getElementById('pPiano').classList.remove('on');
});
document.getElementById('pGuitar').addEventListener('click', () => {
  setMix(recipes.guitar);
  mainN = 1; elHarm.value = 1; elHarmVal.textContent = '1';
  document.getElementById('pGuitar').classList.add('on');
  document.getElementById('pPure').classList.remove('on');
  document.getElementById('pPiano').classList.remove('on');
});
document.getElementById('pPiano').addEventListener('click', () => {
  setMix(recipes.piano);
  mainN = 1; elHarm.value = 1; elHarmVal.textContent = '1';
  document.getElementById('pPiano').classList.add('on');
  document.getElementById('pPure').classList.remove('on');
  document.getElementById('pGuitar').classList.remove('on');
});
elHarm.addEventListener('input', () => {
  mainN = parseInt(elHarm.value, 10);
  elHarmVal.textContent = elHarm.value;
  const m = [0, 0, 0, 0, 0];
  m[mainN - 1] = 1;
  setMix(m);
});
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglEnv.addEventListener('change', () => { envUp.visible = envDn.visible = tglEnv.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
const pos = strGeo.attributes.position;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;
  const A = 0.16;
  for (let i = 0; i <= SEG; i++) {
    const x = -STR_L / 2 + STR_L * i / SEG;
    const u = i / SEG;
    let y = 0;
    for (let n = 1; n <= 5; n++) {
      if (mix[n - 1] < 0.01) continue;
      y += A * mix[n - 1] * Math.sin(n * Math.PI * u) * Math.cos(n * 2.4 * tSim);
    }
    pos.setXYZ(i, x, Y0 + y, 0);
    if (i % 2 === 0) {
      const d = strDots[i / 2];
      d.position.set(x, Y0 + y, 0);
    }
  }
  pos.needsUpdate = true;

  /* 包络与波节(按主谐波 n) */
  for (let i = 0; i <= SEG; i++) {
    const x = -STR_L / 2 + STR_L * i / SEG;
    const u = i / SEG;
    const e = A * 1.05 * Math.sin(mainN * Math.PI * u);
    envUp.geometry.attributes.position.setXYZ(i, x, Y0 + e, 0);
    envDn.geometry.attributes.position.setXYZ(i, x, Y0 - e, 0);
  }
  envUp.geometry.attributes.position.needsUpdate = true;
  envDn.geometry.attributes.position.needsUpdate = true;
  nodeDots.forEach((n, i) => {
    const idx = i + 1;
    n.visible = idx < mainN;
    if (n.visible) {
      const x = -STR_L / 2 + STR_L * idx / mainN;
      n.position.set(x, Y0, 0);
    }
  });

  stN.textContent = mainN;
  stL.innerHTML = (2 * STR_L / mainN).toFixed(2) + '<small> m</small>';
  stF.innerHTML = (F1 * mainN).toFixed(0) + '<small> Hz(视觉 ×0.05)</small>';
  stNd.textContent = mainN - 1;

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setMix(recipes.pure);
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
