<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 海王星的笔尖发现:天王星实测经度 vs 布瓦尔星表理论经度的残差
   1781 发现,残差近似按 ramp·134″ 增长(1845 前后达 ~2′,量级取自史实);
   加入海王星(质量 m)后残差 ×(1−m) 归零,m=2 反向推过头。
   教学化处理:天球上 0.5″ 级的偏移肉眼不可见,图示位置偏移放大 ×100,读数用真实角秒。 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const AU=2.6,RU=19.19*AU,RN=30.07*AU,TU=84.011,TN=164.79;
const Y0=1781,DEV_Y=1846.72,RES_MAX=134,EXAG=100,AS2RAD=Math.PI/648000;
const TH0U=0.35-2*Math.PI*(DEV_Y-Y0)/TU, TH0N=2.0-2*Math.PI*(DEV_Y-Y0)/TN, SEP=0.012;
const rampAt=y=>Math.pow(clamp((y-Y0)/64,0,1),1.7);
const thU=y=>TH0U+2*Math.PI*(y-Y0)/TU, thN=y=>TH0N+2*Math.PI*(y-Y0)/TN;
const posAt=(r,a,out)=>out.set(r*Math.cos(a),0,-r*Math.sin(a));

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,260,700);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.1,900);
camera.position.set(-10,172,8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-10,0,-28);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=15;controls.maxDistance=400;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(30,60,20);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-40,30,-30);scene.add(fill);

/* ── 场景:俯视黄道面一角:太阳、天王星、海王星轨道图 ── */
{
  const n=300,arr=new Float32Array(n*3);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=220+Math.random()*120;
    arr[i*3]=r*Math.cos(a);arr[i*3+1]=(Math.random()-0.4)*60;arr[i*3+2]=r*Math.sin(a);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x9db4d6,size:1.1,transparent:true,opacity:0.7,fog:false})));
}
const sun=new THREE.Mesh(new THREE.SphereGeometry(2.6,28,18),new THREE.MeshBasicMaterial({color:0xffd76e}));
scene.add(sun);
const sunLight=new THREE.PointLight(0xffe2b0,2.2,0,0);scene.add(sunLight);
/* 轨道环 + 极坐标细线(星图感) */
const circlePts=r=>Array.from({length:160},(_,i)=>{const a=i/160*Math.PI*2;return new THREE.Vector3(r*Math.cos(a),0,-r*Math.sin(a));});
const ringU=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(circlePts(RU)),
  new THREE.LineBasicMaterial({color:0x4a5f80,transparent:true,opacity:0.55}));
scene.add(ringU);
const ringN=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(circlePts(RN)),
  new THREE.LineBasicMaterial({color:0x3a4a63,transparent:true,opacity:0.5}));
scene.add(ringN);
{
  const pts=[];
  for(let k=0;k<12;k++){const a=k/12*Math.PI*2;
    pts.push(new THREE.Vector3(3*Math.cos(a),0,-3*Math.sin(a)),new THREE.Vector3(RN*1.01*Math.cos(a),0,-RN*1.01*Math.sin(a)));}
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0x33445e,transparent:true,opacity:0.35})));
}
/* 行星:天王星(实测)、理论位置幽灵、海王星 */
const bodyM=c=>new THREE.MeshStandardMaterial({color:c,roughness:0.55,emissive:c,emissiveIntensity:0.12});
const uranus=new THREE.Mesh(new THREE.SphereGeometry(1.15,24,16),bodyM(0x8fd0e8));scene.add(uranus);
const ghost=new THREE.Mesh(new THREE.SphereGeometry(1.15,24,16),
  new THREE.MeshStandardMaterial({color:0x9ab8ff,transparent:true,opacity:0.35,depthWrite:false,roughness:0.6}));
scene.add(ghost);
const neptune=new THREE.Mesh(new THREE.SphereGeometry(1.1,24,16),bodyM(0x5b7fdd));scene.add(neptune);
/* 残差弦(理论→实测,红) */
const chordGeo=new THREE.BufferGeometry();
const chord=new THREE.Line(chordGeo,new THREE.LineBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.9}));
scene.add(chord);
/* 勒维耶预言点 + 伽勒实际发现点 + 指向射线 */
function marker(color){
  const g=new THREE.Group();
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.3,1.9,36),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.9,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;g.add(ring);
  const cross=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(-2.6,0,0),new THREE.Vector3(2.6,0,0),new THREE.Vector3(0,0,-2.6),new THREE.Vector3(0,0,2.6)]),
    new THREE.LineBasicMaterial({color,transparent:true,opacity:0.9}));
  g.add(cross);return g;
}
const predMk=marker(0xffb35c);predMk.position.copy(posAt(RN,thN(DEV_Y)+SEP,new THREE.Vector3()));scene.add(predMk);
const foundMk=marker(0x74dc84);foundMk.position.copy(posAt(RN,thN(DEV_Y),new THREE.Vector3()));scene.add(foundMk);
const rayGeo=new THREE.BufferGeometry();
const predRay=new THREE.Line(rayGeo,new THREE.LineDashedMaterial({color:0xffb35c,transparent:true,opacity:0.6,dashSize:2.5,gapSize:2}));
scene.add(predRay);
/* 轨迹:实测(橙)/ 理论(蓝)/ 海王星(绿) */
class Trail{
  constructor(max,color,opacity){
    this.max=max;this.n=0;this.pos=new Float32Array(max*3);
    this.geo=new THREE.BufferGeometry();
    this.geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
    this.geo.setDrawRange(0,0);
    this.line=new THREE.Line(this.geo,new THREE.LineBasicMaterial({color,transparent:true,opacity}));
    this.line.frustumCulled=false;scene.add(this.line);
  }
  clear(){this.n=0;this.geo.setDrawRange(0,0);}
  push(x,y,z){
    if(this.n>=this.max){const drop=this.max>>2;this.pos.copyWithin(0,drop*3);this.n-=drop;}
    const i=this.n*3;this.pos[i]=x;this.pos[i+1]=y;this.pos[i+2]=z;this.n++;
    this.geo.setDrawRange(0,this.n);this.geo.attributes.position.needsUpdate=true;
  }
}
const trailA=new Trail(2400,0xffa94d,0.8),trailG=new Trail(2400,0x74c0fc,0.55),trailN=new Trail(2400,0x74dc84,0.7);
function clearTrails(){trailA.clear();trailG.clear();trailN.clear();}

/* 状态 */
let mode='alone',mN=1,spd=8,predOn=true,vulcan=false,labelsOn=true,slowMo=false,playing=true;
let simYear=DEV_Y-65.72,lastSample=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 残差(角秒,负=落后于理论):只建天王星模型时取全部,加入海王星后 ×(1−m) */
function resArcsec(){
  const mm=mode==='alone'?1:(1-mN);
  return RES_MAX*rampAt(simYear)*mm;
}
const gW=new THREE.Vector3(),aW=new THREE.Vector3(),nW=new THREE.Vector3(),v1=new THREE.Vector3();

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblSun=addLabel(()=>L('太阳','Sun'),new THREE.Vector3(0,4.5,0),'o');
const lblU=addLabel(()=>L('天王星 · 实测位置','Uranus · observed'),new THREE.Vector3(0,3.4,0),'b');
const lblGhost=addLabel(()=>L('理论位置 · 布瓦尔星表(偏移放大 ×100)','Theory · Bouvard tables (offset drawn ×100)'),new THREE.Vector3(0,-3.6,0),'y');
const lblN=addLabel(()=>L('海王星','Neptune'),new THREE.Vector3(0,3.4,0),'g',()=>mode==='with',neptune);
const lblPred=addLabel(()=>L('勒维耶预言点 · 1846-09','Le Verrier\'s predicted spot · Sep 1846'),new THREE.Vector3(-6.5,-2.6,0),'o',()=>predOn,predMk);
const lblFound=addLabel(()=>L('伽勒当夜找到 · 相距 0.69°','Found by Galle that night · 0.69° away'),new THREE.Vector3(-6.5,-6.2,0),'g',()=>predOn,foundMk);
const lblVulcan=addLabel(()=>L('水星残差 →「火神星」并不存在——那是广义相对论管的进动',
    'Mercury\'s residual → "Vulcan" never existed — that precession belongs to general relativity'),
  new THREE.Vector3(0,15,0),'r',()=>vulcan);
addLabel(()=>L('19.2 AU','19.2 AU'),new THREE.Vector3(-0.707*(RU+3),0.6,-0.707*(RU+3)),'',()=>true);
const lblAU2=addLabel(()=>L('30.1 AU','30.1 AU'),new THREE.Vector3(-0.174*(RN+3),0.6,-0.985*(RN+3)),'',()=>mode==='with');

function setYear(y){simYear=clamp(y,1781,1869);lastSample=simYear;clearTrails();updateStats();}
function setSpeed(v){spd=clamp(v,1,50);
  document.getElementById('sSpd').value=spd;
  document.getElementById('sSpdVal').textContent='×'+spd.toFixed(0);}
function setMass(v){mN=clamp(v,0,2);
  document.getElementById('sMass').value=mN;
  document.getElementById('sMassVal').textContent='×'+mN.toFixed(1);
  clearTrails();lastSample=simYear;updateStats();}
function setPred(v){predOn=v;
  document.getElementById('tglPred').checked=v;
  predMk.visible=foundMk.visible=predRay.visible=v;}
function setVulcan(v){vulcan=v;}
function setMode(m){mode=m;
  document.getElementById('bAlone').classList.toggle('on',m==='alone');
  document.getElementById('bWith').classList.toggle('on',m==='with');
  document.getElementById('sMass').disabled=(m==='alone');
  neptune.visible=ringN.visible=trailN.line.visible=lblAU2.visible=(m==='with');
  clearTrails();lastSample=simYear;updateStats();}

const STEPS=[
 {zh:'<b>1781 · 赫歇尔发现天王星</b>:肉眼之外的第一颗行星,几十年的观测攒成精密星表',
  en:'<b>1781 · Herschel finds Uranus</b>: the first planet beyond naked-eye sight; decades of observation pile into precise tables',
  act(){setMode('alone');setYear(1781.2);setPred(false);setVulcan(false);}},
 {zh:'<b>轨迹越走越偏</b>:到 1840 年代,实测经度比布瓦尔星表落后近 2 角分,彗星摄动也解释不了',
  en:'<b>The track drifts off</b>: by the 1840s the observed longitude lags Bouvard\'s tables by nearly 2′ — no comet explains it',
  act(){setMode('alone');setYear(1843);setPred(false);setVulcan(false);}},
 {zh:'<b>残差反推元凶</b>:勒维耶/亚当斯假设一颗未知行星,从残差倒推它的质量与方位',
  en:'<b>Inverting the residuals</b>: Le Verrier and Adams assume an unknown planet and back out its mass and direction',
  act(){setMode('alone');setYear(1845);setPred(true);setVulcan(false);}},
 {zh:'<b>笔尖给出位置</b>:1846-09-23 勒维耶把预言经度寄到柏林天文台,伽勒当晚开镜',
  en:'<b>A position from pen alone</b>: on 1846-09-23 Le Verrier mails the predicted longitude to Berlin; Galle observes that night',
  act(){setMode('alone');setYear(DEV_Y);setPred(true);setVulcan(false);}},
 {zh:'<b>当夜验证 · 偏差 0.69°</b>:不到 1° 处找到海王星;纳入摄动后残差当场归零',
  en:'<b>Verified that night · 0.69° off</b>: Neptune sits within 1° of the prediction; with it in the model the residual dies',
  act(){setMode('with');setMass(1);setYear(DEV_Y+0.3);setPred(true);setVulcan(false);}},
 {zh:'<b>残差法的边界</b>:同样的方法从水星残差推出「火神星」——它并不存在,那是广义相对论管的进动',
  en:'<b>The method\'s edge</b>: the same trick pulled "Vulcan" out of Mercury\'s residual — it never existed; GR owns that precession',
  act(){setMode('with');setMass(1);setYear(1858);setPred(true);setVulcan(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stYear').innerHTML=simYear.toFixed(1);
  const r=resArcsec(),el=document.getElementById('stRes');
  el.innerHTML=Math.abs(r)<2?'≈0':(r>0?'−':'+')+Math.abs(r).toFixed(0)+'<small> ″</small>';
  el.className='v '+(Math.abs(r)<5?'ok':(Math.abs(r)>=30?'warn':''));
  const dv=document.getElementById('stDev');
  dv.innerHTML=predOn?'0.69<small> °</small>':'—';
  dv.className='v '+(predOn?'ok':'');
  document.getElementById('stND').innerHTML='30.07<small> AU</small>';
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bAlone').addEventListener('click',()=>setMode('alone'));
document.getElementById('bWith').addEventListener('click',()=>setMode('with'));
document.getElementById('sSpd').addEventListener('input',e=>setSpeed(+e.target.value));
document.getElementById('sMass').addEventListener('input',e=>setMass(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglPred').addEventListener('change',e=>{setPred(e.target.checked);});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  if(dts>0){
    simYear+=dts*0.35*spd;
    if(simYear>1870){simYear=1781;clearTrails();lastSample=1781;}
    if(simYear-lastSample>0.25){
      lastSample=simYear;
      trailA.push(aW.x,0,aW.z);trailG.push(gW.x,0,gW.z);
      if(mode==='with')trailN.push(nW.x,0,nW.z);
    }
  }
  /* 位置:理论幽灵 vs 实测(偏移放大 ×100,读数真实) */
  const thUw=thU(simYear);
  posAt(RU,thUw,gW);
  const res=resArcsec();
  posAt(RU,thUw-res*AS2RAD*EXAG,aW);
  uranus.position.copy(aW);ghost.position.copy(gW);
  posAt(RN,thN(simYear),nW);neptune.position.copy(nW);
  /* 残差弦(理论→实测,红;数值见统计面板) */
  const show=Math.abs(res)>=3;
  chord.visible=show;
  chordGeo.setAttribute('position',new THREE.Float32BufferAttribute([gW.x,0,gW.z,aW.x,0,aW.z],3));
  /* 预言射线:太阳 → 勒维耶预言点 */
  if(predRay.visible){
    predRay.geometry.setAttribute('position',
      new THREE.Float32BufferAttribute([0,0,0,predMk.position.x,0,predMk.position.z],3));
    predRay.computeLineDistances();
  }
  /* 标签跟随 */
  lblU.position.set(aW.x+3.0,aW.y+4.4,aW.z);
  lblGhost.position.set(gW.x-3.0,gW.y-4.4,gW.z);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();setSpeed(8);setMass(1);setPred(true);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(1);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
