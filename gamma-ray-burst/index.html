function doppler(){
  const b=Math.sqrt(1-1/(gam*gam));
  const d=1/(gam*(1-b*Math.cos(obs*Math.PI/180)));
  return {delta:d,boost:d*d*d};
}
function fmtExp(v){
  if(!(v>0))return '0';
  const e=Math.floor(Math.log10(v)),m=v/Math.pow(10,e);
  return m.toFixed(1)+'e'+e;
}

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });

}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const {boost}=doppler();
  const fSt=Math.exp(-obs*obs/(2*thetaJ*thetaJ));
  const Eiso=2*3e42/(1-Math.cos(thetaJ*Math.PI/180))*fSt;
  document.getElementById('stEiso').innerHTML=fmtExp(Eiso)+'<small> J</small>';
  const ang=document.getElementById('stAng');
  ang.innerHTML=obs.toFixed(0)+'<small> °</small>';
  ang.className='v '+(obs<=thetaJ?'ok':'warn');
  const lg=Math.log10(boost);
  const bst=document.getElementById('stBst');
  bst.innerHTML='10<sup>'+lg.toFixed(1)+'</sup>';
  bst.className='v '+(lg>3?'ok':'');
  const age=document.getElementById('stAge');
  if(afterglowAge>0){
    age.innerHTML=afterglowAge<1?(afterglowAge*24).toFixed(1)+'<small> h</small>':afterglowAge.toFixed(1)+'<small> d</small>';
  }else age.innerHTML='<small>—</small>';
}

/* ── 光变曲线:γ 尖峰 + 幂律余辉(log-log) ── */
function drawLC(){
  const c=lcCtx,W=512,H=300,ml=46,mr=12,mt=30,mb=34,pw=W-ml-mr,ph=H-mt-mb;
  c.clearRect(0,0,W,H);
  c.fillStyle='rgba(8,13,22,0.94)';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(217,95,166,0.45)';c.strokeRect(0.5,0.5,W-1,H-1);
  const X=lg=>ml+(lg+5)/6.2*pw,Y=lf=>mt+(4-lf)/6.2*ph;
  c.strokeStyle='rgba(120,140,170,0.22)';c.lineWidth=1;
  for(let lg=-5;lg<=1;lg++){c.beginPath();c.moveTo(X(lg),mt);c.lineTo(X(lg),mt+ph);c.stroke();}
  for(let lf=-2;lf<=4;lf++){c.beginPath();c.moveTo(ml,Y(lf));c.lineTo(ml+pw,Y(lf));c.stroke();}
  c.fillStyle='#9fb0c3';c.font='10px sans-serif';c.textAlign='center';
  for(const [tv,sv] of [[-4.94,'1 s'],[-1.38,'1 h'],[0,'1 d'],[1,'10 d']])c.fillText(sv,X(tv),H-14);
  c.textAlign='left';c.fillText('t / '+L('天','days'),ml+pw-42,mt-9);
  c.save();c.translate(12,mt+ph/2);c.rotate(-Math.PI/2);c.textAlign='center';
  c.fillText(L('相对光度 lg F','relative flux lg F'),0,0);c.restore();
  const fSt=Math.exp(-obs*obs/(2*thetaJ*thetaJ));
  const {boost}=doppler(),bN=Math.min(1.2,boost/8e6);
  const tpk=1.157e-4*(1+Math.pow(obs/thetaJ,4));
  /* 余辉幂律 */
  c.strokeStyle='#ff9f43';c.lineWidth=2;c.beginPath();let pen=false;
  for(let px=0;px<=pw;px+=2){
    const lg=-5+px/pw*6.2,t=Math.pow(10,lg);
    let lf=-2.3;
    if(t>tpk)lf=Math.log10(3.0*fSt*Math.pow(t/tpk,-1.1)+1e-6);
    if(lf<-2.2){pen=false;continue;}
    if(!pen){c.moveTo(X(lg),Y(lf));pen=true;}else c.lineTo(X(lg),Y(lf));
  }
  c.stroke();
  if(fSt>0.02){
    const lf1=Math.log10(3.0*fSt*Math.pow(1/tpk,-1.1)+1e-6);
    c.fillStyle='#ff9f43';c.font='10px sans-serif';c.textAlign='left';
    c.fillText(L('余辉 F∝t⁻¹·¹','afterglow F∝t⁻¹·¹'),X(0.05),Y(clamp(lf1,-2.2,4))+14);
  }
  /* 瞬时 γ 尖峰 */
  if(bN>0.005){
    c.strokeStyle='#ffffff';c.lineWidth=2;c.beginPath();pen=false;
    for(let px=0;px<=pw;px+=2){
      const lg=-5+px/pw*6.2;
      const lf=Math.log10(2.6*bN*Math.exp(-Math.pow((lg+4.94)/0.16,2))+1e-6);
      if(lf<-2.2){pen=false;continue;}
      if(!pen){c.moveTo(X(lg),Y(lf));pen=true;}else c.lineTo(X(lg),Y(lf));
    }
    c.stroke();
    c.fillStyle='#ffffff';c.font='10px sans-serif';c.textAlign='left';
    c.fillText(L('瞬时 γ','prompt γ'),X(-4.9)+4,mt+10);
  }
  /* 当前时刻标记 */
  if(afterglowAge>0){
    const lg=Math.log10(afterglowAge);
    if(lg>-5&&lg<1.2){
      c.strokeStyle='rgba(255,107,107,0.9)';c.setLineDash([3,3]);c.lineWidth=1;
      c.beginPath();c.moveTo(X(lg),mt);c.lineTo(X(lg),mt+ph);c.stroke();c.setLineDash([]);
      let lf=-2.3;if(afterglowAge>tpk)lf=Math.log10(3.0*fSt*Math.pow(afterglowAge/tpk,-1.1)+1e-6);
      c.fillStyle='#ff6b6b';c.beginPath();c.arc(X(lg),Y(clamp(lf,-2.2,4)),3.5,0,7);c.fill();
    }
  }
  c.fillStyle='#c7d2de';c.font='11px sans-serif';c.textAlign='left';
  c.fillText(L('光变曲线 · log-log 示意','Light curve · log-log schematic'),ml,mt-12);
  lcTex.needsUpdate=true;
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  animT+=dts;
  if(playing){burstT+=dts;if(burstT>CYC)burstT-=CYC;}
  const bt=burstT,isLong=mode==='long';
  /* 长暴:蓝超巨星 → 坍缩 */
  starG.visible=isLong&&bt<TCOLL;
  if(starG.visible){
    const p=clamp((bt-3.3)/(TCOLL-3.3),0,1);
    starG.scale.setScalar(Math.max(0.001,1.15*(1-0.85*p*p)));
    starG.position.x=Math.sin(bt*47)*0.06*p;
  }else starG.position.x=0;
  /* 黑洞 + 吸积盘 */
  const tbh=isLong?TCOLL:TMERGE;
  bhG.visible=bt>=tbh;
  if(bhG.visible)diskG.scale.setScalar(clamp((bt-tbh)/0.8,0.001,1));
  /* 双中子星旋近 */
  nsG.visible=!isLong&&bt<TMERGE;
  if(nsG.visible){
    const p=bt/TMERGE,sep=Math.max(0.42,1.7*Math.pow(1-p,0.35));
    phi+=dts*2.2/Math.pow(sep,1.5);
    ns1.position.set(sep/2*Math.cos(phi),0,sep/2*Math.sin(phi));
    ns2.position.set(-sep/2*Math.cos(phi),0,-sep/2*Math.sin(phi));
  }
  /* 喷流 */
  const jt0=isLong?4.6:5.15;
  jetsG.visible=bt>=jt0;
  if(jetsG.visible){
    const f=clamp((bt-jt0)/1.2,0,1),s=f*f*(3-2*f);
    jetsG.scale.setScalar(Math.max(0.001,s));
    jetMatO.opacity=0.13*(0.85+0.15*Math.sin(animT*7));
  }
  /* 闪光 */
  const ft=bt-TFLASH;
  flash.visible=ft>=0&&ft<0.7;
  if(flash.visible){
    flash.scale.setScalar((isLong?3.2:4.5)+ft*14);
    flash.material.opacity=0.95*(1-ft/0.7);
  }
  /* 余辉壳层 */
  const age=bt-TFLASH;
  agS.visible=age>0;
  if(agS.visible){
    agS.scale.setScalar(0.5+age*0.52);
    agS.material.opacity=0.15*Math.max(0,1-age/11);
  }
  /* 千新星壳层 */
  const kAge=bt-5.15;
  kwS.visible=!isLong&&kAge>0;
  if(kwS.visible){
    kwS.scale.setScalar(0.35+kAge*0.34);
    kwS.material.opacity=0.32*Math.max(0,1-kAge/11);
  }
  /* 引力波涟漪 */
  const gwOn=!isLong&&bt>0.4&&bt<7.5;
  gwRings.forEach((r,k)=>{
    r.visible=gwOn;
    if(gwOn){
      const rr=((bt*1.5+k*1.63)%6.5)+0.05;
      r.scale.set(rr,1,rr);
      r.material.opacity=0.4*(1-rr/6.5);
    }
  });
  /* 标签位置与类别 */
  lblObs.position.copy(obsG.position).multiplyScalar(1.12);
  lblObs.element.className='lbl '+(obs<=thetaJ?'g':'r');
  lcG.lookAt(camera.position);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){
    frame.acc=0;
    afterglowAge=bt>TFLASH?Math.pow(10,-4+5*Math.min(1,(bt-TFLASH)/10.8)):-1;
    updateStats();
    if(lcOn)drawLC();
  }
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
