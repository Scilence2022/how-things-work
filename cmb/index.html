<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙微波背景 · 大爆炸的余晖</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="宇宙微波背景 · 大爆炸的余晖" data-en="The Cosmic Microwave Background · Afterglow of the Big Bang">宇宙微波背景 · 大爆炸的余晖</h1>
  <div class="sub" data-zh="早期宇宙是高温等离子体雾:光子被自由电子 Thomson 散射,平均自由程极短→宇宙不透明;宇宙膨胀把温度按 T∝1/a 一路拉低;z≈1100、约 38 万年、T≈3000 K 时复合发生:质子抓住电子成中性氢→光子解耦自由飞行——雾散了,宇宙第一缕光出发;空间膨胀把这批光子拉长 ×1100→今天 2.725 K 的完美黑体,谱峰 λ≈1.06 mm(COBE/FIRAS 偏差 <5×10⁻⁵;1965 年 Penzias & Wilson 天线里抹不掉的 ~3.5 K 噪声就是它);温度涨落 δT/T≈10⁻⁵(±约 100 μK)=星系与星系团的种子 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="The early universe was a hot plasma fog: photons Thomson-scattered off free electrons, mean free path tiny → opaque; expansion cooled everything as T∝1/a; at z≈1100, age ~380,000 yr, T≈3000 K recombination happened: protons captured electrons into neutral hydrogen → photons decoupled and flew free — the fog cleared and the first light set out; expansion stretched those photons ×1100 → today a 2.725 K near-perfect blackbody peaking at λ≈1.06 mm (COBE/FIRAS deviation <5×10⁻⁵; the unremovable ~3.5 K noise in Penzias & Wilson's 1965 horn antenna was exactly this); temperature ripples δT/T≈10⁻⁵ (±~100 μK) are the seeds of galaxies and clusters · 3D interactive demo · drag to orbit · Space = run/pause">宇宙微波背景 · 大爆炸的余晖</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="宇宙温度" data-en="Universe temp">宇宙温度</span><span class="v warn" id="stT">—</span>
  <span class="k" data-zh="红移 z" data-en="Redshift z">红移 z</span><span class="v" id="stZ">—</span>
  <span class="k" data-zh="宇宙年龄" data-en="Age">宇宙年龄</span><span class="v" id="stAge">—</span>
  <span class="k" data-zh="光子自由程(相对)" data-en="Photon mfp (rel.)">光子自由程(相对)</span><span class="v bad" id="stFree">—</span>
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v bad" id="stState">—</span>
</div>

<div id="plot">
  <h3 data-zh="左:T(t) 幂律下降(标记=复合点与当前)· 右:普朗克黑体谱随 T 左移,λmax=2898/T" data-en="Left: power-law T(t) (markers = recombination and now) · Right: Planck spectrum slides redward as T drops, λmax=2898/T">左:T(t) 幂律下降(标记=复合点与当前)· 右:普朗克黑体谱随 T 左移,λmax=2898/T</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="等离子体雾:光子走不远——不透明" data-en="plasma fog: photons go nowhere — opaque">等离子体雾:光子走不远——不透明</span>
    <span class="chip.b" data-zh="最后散射壳:38 万岁时出发的第一缕光" data-en="last-scattering shell: first light leaving at 380 kyr">最后散射壳:38 万岁时出发的第一缕光</span>
    <span class="chip.g" data-zh="光子路径:雾中乱撞→解耦后直线远飞" data-en="photon paths: scattered zigzag → free straight flight">光子路径:雾中乱撞→解耦后直线远飞</span>
    <span class="chip.o" data-zh="±200 μK 涨落:未来星系的种子" data-en="±200 μK ripples: seeds of future galaxies">±200 μK 涨落:未来星系的种子</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnFog" data-zh="早期浓雾" data-en="Early fog">早期浓雾</button>
    <button class="abtn" id="btnRec" data-zh="复合瞬间" data-en="Recombination">复合瞬间</button>
    <button class="abtn" id="btnNow" data-zh="今天" data-en="Today">今天</button>
    <button class="abtn" id="btnSky" data-zh="拉近看壳" data-en="Shell close-up">拉近看壳</button>
  </div>
  <div class="row"><label data-zh="时间(log)" data-en="Time (log)">时间(log)</label><input id="sTime" type="range" min="0" max="1000" step="1" value="30"><span class="val" id="sTimeVal">—</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglMap" type="checkbox"> <span data-zh="全天图" data-en="All-sky map">全天图</span></label>
      <label><input id="tglPath" type="checkbox" checked> <span data-zh="光子路径" data-en="Photon paths">光子路径</span></label>
      <label><input id="tglBB" type="checkbox" checked> <span data-zh="黑体谱" data-en="Blackbody">黑体谱</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cosmic-expansion/" data-zh="宇宙膨胀:波长被空间拉长的机制" data-en="cosmic expansion: how space stretches wavelength">宇宙膨胀:波长被空间拉长的机制</a>
    <a href="../blackbody-radiation/" data-zh="黑体辐射:普朗克谱与维恩位移" data-en="blackbody radiation: Planck spectrum and Wien shift">黑体辐射:普朗克谱与维恩位移</a>
    <a href="../stellar-lifecycle/" data-zh="恒星生灭:涨落种子点燃的第一代星" data-en="stellar lifecycle: first stars lit by those seeds">恒星生灭:涨落种子点燃的第一代星</a>
    <a href="../em-wave/" data-zh="电磁波:微波只是低频的光" data-en="EM waves: microwaves are just low-frequency light">电磁波:微波只是低频的光</a>
    <a href="../gravitational-waves/" data-zh="引力波:另一种宇宙回响" data-en="gravitational waves: another cosmic echo">引力波:另一种宇宙回响</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const smooth = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 24, 90);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0a0c11 : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x0a0c11 : 0xd9e2ea);
  baseM.color.setHex(dark ? 0x161a20 : 0xb0bcc8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('宇宙微波背景 · 大爆炸的余晖', 'The Cosmic Microwave Background · Afterglow of the Big Bang');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  updateFormula();
  updateStats();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
function fatal(msg) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:15px/1.7 system-ui;padding:30px;text-align:center';
  d.textContent = msg;
  document.body.appendChild(d);
}
let renderer = null;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (e) { renderer = null; }
if (!renderer) {
  fatal(L('本页需要 WebGL 显示 3D 场景,但当前浏览器无法创建 WebGL 上下文。请更换浏览器或开启硬件加速后重试。', 'This page needs WebGL for its 3D scene, but the browser could not create a WebGL context. Try another browser or enable hardware acceleration.'));
  throw new Error('WebGL unavailable');
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(8.2, 5.0, 9.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 60;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(6, 8, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff, 0.3);
fill.position.set(-7, 5, -6);
scene.add(fill);

/* ================= 宇宙学数据(简报给值) ================= */
const T0 = 2.725, T_REC = 3000, T_REC_YR = 3.8e5, T_EQ_YR = 5e4, TMAX_AGE = 13.8e9;
const LOG_MIN = 4, LOG_MAX = Math.log10(TMAX_AGE);
const T_EQ = T_REC * Math.pow(T_REC_YR / T_EQ_YR, 2 / 3);
function Tof(tYr) { return tYr < T_EQ_YR ? T_EQ * Math.sqrt(T_EQ_YR / tYr) : T_REC * Math.pow(T_REC_YR / tYr, 2 / 3); }
function fRecOf(logT) { return smooth((logT - Math.log10(T_REC_YR)) / 0.5 + 0.5); }
function bbColor(T) {                                  /* 普朗克轨迹近似,温度低于 1000K 压暗 */
  const t = clamp(T, 1000, 40000) / 100;
  let r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
  let g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  let b = t >= 66 ? 255 : (t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307);
  const dim = T < 1000 ? clamp(T / 3000, 0.07, 1) : 1;
  return new THREE.Color(clamp(r, 0, 255) / 255 * dim, clamp(g, 0, 255) / 255 * dim, clamp(b, 0, 255) / 255 * dim);
}

/* 等离子体雾(实例化) */
const NF = 320;
const fogPre = new THREE.Color(1.0, 0.62, 0.30), fogPost = new THREE.Color(0.24, 0.27, 0.33);
const fogM = new THREE.MeshStandardMaterial({ color: 0xffa050, emissive: 0xff8c3a, emissiveIntensity: 0.9, roughness: 0.6, transparent: true, opacity: 0.9 });
const fog = new THREE.InstancedMesh(new THREE.SphereGeometry(0.085, 8, 6), fogM, NF);
fog.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
fog.frustumCulled = false;
scene.add(fog);
const fogSeed = [];
for (let i = 0; i < NF; i++) {
  const r = 1.1 + Math.pow(Math.random(), 0.7) * 4.4;
  const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
  fogSeed.push({
    x: r * Math.sin(ph) * Math.cos(th), y: r * Math.cos(ph) * 0.8, z: r * Math.sin(ph) * Math.sin(th),
    p1: Math.random() * 20, p2: Math.random() * 20, amp: 0.12 + Math.random() * 0.22
  });
}
const _M4 = new THREE.Matrix4(), _Q = new THREE.Quaternion(), _S = new THREE.Vector3(), _V = new THREE.Vector3();
function updateFog(tNow) {
  const amp = (1 - fRec) * 1.0;
  for (let i = 0; i < NF; i++) {
    const s = fogSeed[i];
    _V.set(
      s.x + Math.sin(tNow * 2.1 + s.p1) * s.amp * amp,
      s.y + Math.cos(tNow * 1.7 + s.p2) * s.amp * amp,
      s.z + Math.sin(tNow * 2.4 + s.p1 * 1.3 + s.p2) * s.amp * amp);
    _M4.compose(_V, _Q.identity(), _S.setScalar(1 - 0.35 * fRec));
    fog.setMatrixAt(i, _M4);
  }
  fog.instanceMatrix.needsUpdate = true;
  fogM.opacity = 0.92 - 0.72 * fRec;
  fogM.emissiveIntensity = 0.9 - 0.72 * fRec;
  fogM.color.lerpColors(fogPre, fogPost, fRec);
  fogM.emissive.lerpColors(fogPre, fogPost, fRec);
}

/* 光子路径 */
const NP = 22, NPTS = 14;
const photonM = new THREE.LineBasicMaterial({ color: 0xffc070, transparent: true, opacity: 0.85 });
const pathGroup = new THREE.Group();
scene.add(pathGroup);
const photons = [];
for (let i = 0; i < NP; i++) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NPTS * 3), 3));
  const line = new THREE.Line(g, photonM);
  line.frustumCulled = false;
  pathGroup.add(line);
  const r = 0.6 + Math.random() * 3.6, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
  const dir = new THREE.Vector3(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
  const pos = dir.clone().multiplyScalar(r);
  photons.push({ pos, dir, trail: Array.from({ length: NPTS - 1 }, () => pos.clone()), bt: Math.random() * 0.3 });
}
function reseedWalk(p) {
  const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
  p.dir.set(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
  for (const q of p.trail) q.copy(p.pos);
}
function updatePaths(dt) {
  if (fRec < 0.5) {
    for (let i = 0; i < NP; i++) {
      const p = photons[i];
      p.pos.addScaledVector(p.dir, dt * 1.5);
      if (p.pos.length() > 5.6) { p.pos.setLength(0.8); reseedWalk(p); }
      p.bt += dt;
      if (p.bt > 0.26) {
        p.bt = 0;
        for (let k = 0; k < 6; k++) p.trail.push(p.pos.clone());
        while (p.trail.length > NPTS - 1) p.trail.shift();
        if (Math.random() < 0.8) reseedWalk(p);
      }
      const buf = pathGroup.children[i].geometry.attributes.position.array;
      let n = 0;
      for (const q of p.trail) { buf[n++] = q.x; buf[n++] = q.y; buf[n++] = q.z; }
      buf[n++] = p.pos.x; buf[n++] = p.pos.y; buf[n++] = p.pos.z;
      for (; n < NPTS * 3; n += 3) { buf[n] = p.pos.x; buf[n + 1] = p.pos.y; buf[n + 2] = p.pos.z; }
      pathGroup.children[i].geometry.attributes.position.needsUpdate = true;
    }
  } else {
    for (let i = 0; i < NP; i++) {
      const p = photons[i];
      p.pos.addScaledVector(p.dir, dt * 3.4);
      if (p.pos.length() > 11.5) {
        p.pos.setLength(1.0);
        const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
        p.dir.set(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
      }
      const buf = pathGroup.children[i].geometry.attributes.position.array;
      for (let k = 0; k < NPTS; k++) {
        buf[k * 3] = p.pos.x - p.dir.x * k * 0.55;
        buf[k * 3 + 1] = p.pos.y - p.dir.y * k * 0.55;
        buf[k * 3 + 2] = p.pos.z - p.dir.z * k * 0.55;
      }
      pathGroup.children[i].geometry.attributes.position.needsUpdate = true;
    }
  }
  photonM.color.copy(bbColor(curT).lerp(new THREE.Color(1, 1, 1), 0.25));
  photonM.opacity = 0.85;
}

/* 全天图:程序化 ±200 μK 涨落 */
const skyCv = document.createElement('canvas');
skyCv.width = 512; skyCv.height = 256;
(function paintSky() {
  const cx = skyCv.getContext('2d'), im = cx.createImageData(512, 256);
  const blobs = [];
  for (let k = 0; k < 420; k++) blobs.push({
    x: Math.random() * 512, y: Math.random() * 256,
    r: 4 + Math.pow(Math.random(), 2) * 46, a: (Math.random() - 0.5) * 2
  });
  for (let y = 0; y < 256; y++) for (let x = 0; x < 512; x++) {
    let v = 0;
    for (const b of blobs) {
      let dx = Math.abs(x - b.x); dx = Math.min(dx, 512 - dx);
      const dy = y - b.y;
      const d2 = (dx * dx + dy * dy) / (b.r * b.r);
      if (d2 < 4) v += b.a * Math.exp(-d2 * 1.6);
    }
    v = clamp(v / 2.4, -1, 1);
    const o = (y * 512 + x) * 4;
    if (v < 0) {
      const u = v + 1;
      im.data[o] = lerp(36, 224, u); im.data[o + 1] = lerp(70, 226, u); im.data[o + 2] = lerp(170, 236, u);
    } else {
      const u = v;
      im.data[o] = lerp(224, 160, u); im.data[o + 1] = lerp(226, 34, u); im.data[o + 2] = lerp(236, 30, u);
    }
    im.data[o + 3] = 255;
  }
  cx.putImageData(im, 0, 0);
})();

/* ================= 绘图:T(t) + 黑体谱 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  ctx.font = '13px system-ui';
  const half = (W - 30) / 2;
  /* 左:T(t) log-log */
  {
    const x0 = 34, x1 = 34 + half, y0 = 10, y1 = H - 22;
    const xOf = lt => lerp(x0, x1, (lt - LOG_MIN) / (LOG_MAX - LOG_MIN));
    const yOf = lT => lerp(y1, y0, (lT - 0.4) / (4.6 - 0.4));
    ctx.strokeStyle = 'rgba(128,150,170,.25)'; ctx.fillStyle = cTxt;
    for (const lt of [4, 6, 8, 10]) {
      ctx.beginPath(); ctx.moveTo(xOf(lt), y0); ctx.lineTo(xOf(lt), y1); ctx.stroke();
      ctx.fillText('10' + (lt === 10 ? '¹⁰' : lt === 8 ? '⁸' : lt === 6 ? '⁶' : '⁴'), xOf(lt) - 8, y1 + 15);
    }
    ctx.fillText('yr', x1 + 4, y1 + 15);
    ctx.fillText(L('T(t) 幂律下降', 'T(t) power law'), x0 + 6, y0 + 12);
    ctx.strokeStyle = '#4dabf7'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let i = 0; i <= 70; i++) {
      const lt = lerp(LOG_MIN, LOG_MAX, i / 70);
      const lT10 = Math.log10(Tof(Math.pow(10, lt)));
      i === 0 ? ctx.moveTo(xOf(lt), yOf(lT10)) : ctx.lineTo(xOf(lt), yOf(lT10));
    }
    ctx.stroke();
    const lrec = Math.log10(T_REC_YR);
    ctx.fillStyle = '#ffa94d';
    ctx.beginPath(); ctx.arc(xOf(lrec), yOf(Math.log10(T_REC)), 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillText(L('复合', 'rec.'), xOf(lrec) - 12, yOf(Math.log10(T_REC)) - 8);
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath(); ctx.arc(xOf(logT), yOf(Math.log10(curT)), 4.5, 0, Math.PI * 2); ctx.fill();
  }
  /* 右:普朗克谱 */
  {
    const x0 = 34 + half + 26, x1 = W - 8, y0 = 10, y1 = H - 22;
    const LMIN = -1, LMAX2 = 4;                       /* log10 λ(μm): 0.1 – 10000 */
    const xOf = ll => lerp(x0, x1, (ll - LMIN) / (LMAX2 - LMIN));
    ctx.strokeStyle = 'rgba(128,150,170,.25)'; ctx.fillStyle = cTxt;
    for (const [ll, tx] of [[0.38, '0.4'], [0.75, '0.75'], [1, '1'], [10, '10'], [1000, '10³']]) {
      ctx.beginPath(); ctx.moveTo(xOf(Math.log10(ll)), y0); ctx.lineTo(xOf(Math.log10(ll)), y1); ctx.stroke();
      ctx.fillText(tx, xOf(Math.log10(ll)) - 6, y1 + 15);
    }
    ctx.fillText(L('λ μm', 'λ µm'), x1 - 30, y1 + 15);
    /* 可见光带 */
    ctx.fillStyle = 'rgba(116,220,132,.18)';
    ctx.fillRect(xOf(Math.log10(0.38)), y0, xOf(Math.log10(0.75)) - xOf(Math.log10(0.38)), y1 - y0);
    ctx.fillText(L('可见光', 'visible'), xOf(Math.log10(0.38)) - 4, y1 - 4);
    if (bbOn) {
      const lpk = 2898 / curT;
      let mx = 1e-30;
      const val = [];
      for (let i = 0; i <= 60; i++) {
        const lm = Math.pow(10, lerp(LMIN, LMAX2, i / 60));
        const b = 1 / (Math.pow(lm, 5) * (Math.exp(14387.8 / (lm * curT)) - 1) + 1e-300);
        val.push([lm, b]); mx = Math.max(mx, b);
      }
      const col = bbColor(curT);
      const hex = '#' + [col.r, col.g, col.b].map(c => Math.round(clamp(c, 0, 1) * 255).toString(16).padStart(2, '0')).join('');
      ctx.strokeStyle = hex; ctx.lineWidth = 2.2;
      ctx.beginPath();
      val.forEach((p, i) => {
        const x = xOf(Math.log10(p[0])), y = y1 - clamp(p[1] / mx, 0, 1.05) * (y1 - y0 - 6);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.fillStyle = hex;
      ctx.beginPath(); ctx.arc(xOf(Math.log10(lpk)), y1 - (y1 - y0 - 6), 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillText('λmax≈' + (lpk >= 1 ? Math.round(lpk) + ' μm' : Math.round(lpk * 1000) + ' nm'), xOf(Math.log10(lpk)) - 34, y0 + 12);
    }
  }
}

function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>T∝1/a</b>:辐射主导 a∝t^(1/2),物质主导 a∝t^(2/3)→T(t) 幂律下降(左图)<br>` +
    `<b>复合:z≈1100,约 38 万年,T≈3000 K</b>:p+e⁻→H,光子解耦——雾散,第一缕光出发<br>` +
    `<b>膨胀拉长波长 ×1100→今天 2.725 K</b>;维恩:λmax=2898 μm·K/T≈1.06 mm;黑体谱偏差 <5×10⁻⁵(COBE/FIRAS)<br>` +
    `<b>当前:T=${fmtT(curT)},z≈${curT / T0 - 1 < 10 ? (curT / T0 - 1).toFixed(1) : Math.round(curT / T0 - 1).toLocaleString('en-US')},t=${fmtAge(Math.pow(10, logT))}${fRec < 0.5 ? '——不透明' : '——已透明'}</b>`,
    `<b>T∝1/a</b>: a∝t^(1/2) in radiation domination, a∝t^(2/3) in matter domination → power-law T(t) (left)<br>` +
    `<b>Recombination: z≈1100, ~380 kyr, T≈3000 K</b>: p+e⁻→H, photons decouple — the fog clears, first light departs<br>` +
    `<b>Expansion stretched λ ×1100 → 2.725 K today</b>; Wien: λmax=2898 µm·K/T≈1.06 mm; blackbody deviation <5×10⁻⁵ (COBE/FIRAS)<br>` +
    `<b>Now: T=${fmtT(curT)}, z≈${curT / T0 - 1 < 10 ? (curT / T0 - 1).toFixed(1) : Math.round(curT / T0 - 1).toLocaleString('en-US')}, t=${fmtAge(Math.pow(10, logT))}${fRec < 0.5 ? ' — opaque' : ' — transparent'}</b>`);
}
function syncAll() {
  syncSliders(); updateFormula(); updateStats(); drawPlot(); refreshLabels();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elTime.addEventListener('input', () => { setTime(LOG_MIN + (+elTime.value) / 1000 * (LOG_MAX - LOG_MIN)); });
document.getElementById('btnFog').addEventListener('click', () => { setTime(4.15); syncAll(); });
document.getElementById('btnRec').addEventListener('click', () => { setTime(5.62); syncAll(); });
document.getElementById('btnNow').addEventListener('click', () => { setTime(LOG_MAX); syncAll(); });
document.getElementById('btnSky').addEventListener('click', () => { flyTo([4.6, 2.4, 5.8], [0, 0, 0]); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglMap').addEventListener('change', e => { mapOn = e.target.checked; sky.visible = mapOn; });
document.getElementById('tglPath').addEventListener('change', e => { pathOn = e.target.checked; pathGroup.visible = pathOn; });
document.getElementById('tglBB').addEventListener('change', e => { bbOn = e.target.checked; drawPlot(); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
if (mapOn) document.getElementById('tglMap').checked = true;
if (!pathOn) document.getElementById('tglPath').checked = false;
if (!bbOn) document.getElementById('tglBB').checked = false;
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ---------------- 场景标签 ---------------- */
const labelReg = [];
function addLabel(textFn, pos, cls = '', vis = () => true, parent = null) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  (parent || scene).add(o);
  labelReg.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return o;
}
function refreshLabels() { for (const r of labelReg) r.o.visible = labelsOn && r.vis(); }
const lblObs = addLabel(() => L('观察点:今天的地球——我们收到的正是这批光子', "observation point: Earth today — this is exactly the light we receive"), new THREE.Vector3(0, 0.75, 0), 'b');
const lblFog = addLabel(() => L('等离子体雾:光子被自由电子 Thomson 散射,平均自由程极短', 'plasma fog: photons Thomson-scatter off free electrons, mean free path tiny'), new THREE.Vector3(0, 4.4, 0), 'r', () => fRec < 0.5);
const lblShell = addLabel(() => L(`最后散射壳:出发时 ~3000 K,膨胀拉长 ×1,100 → 现在 ${fmtT(curT)}`, `last-scattering shell: left at ~3000 K, stretched ×1,100 → ${fmtT(curT)} now`), new THREE.Vector3(0, 8.2, 0), 'o', () => fRec > 0.3 && !mapOn);
const lblMap = addLabel(() => L('全天图:±200 μK 色标;δT/T≈10⁻⁵ 的斑点=星系与星团的种子', 'all-sky map: ±200 µK scale; δT/T≈10⁻⁵ speckles = seeds of galaxies & clusters'), new THREE.Vector3(0, 10.5, 0), 'g', () => mapOn);
const lblNotify = addLabel(() => notifyT > 0 ? L(notifyZ, notifyE) : '', new THREE.Vector3(0, 5.8, 0), 'g', () => !mapOn);

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null, sceneT = 0;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * (playing ? SPEED : 0);
  const tNow = (sceneT += dt);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    logT += dt * 0.20;
    if (logT > LOG_MAX) logT = LOG_MIN;
  }
  curT = Tof(Math.pow(10, logT));
  fRec = fRecOf(logT);
  if (prevFRec < 0.5 && fRec >= 0.5) for (const p of photons) p.dir.copy(p.pos).normalize();
  if (prevFRec >= 0.5 && fRec < 0.5) for (const p of photons) reseedWalk(p);
  prevFRec = fRec;
  updateFog(tNow);
  updatePaths(dt);
  shellM.color.copy(bbColor(curT));
  shellM.opacity = 0.06 + 0.3 * smooth((fRec - 0.3) / 0.7);
  sky.visible = mapOn;
  fog.visible = !mapOn;
  shell.visible = !mapOn;
  pathGroup.visible = !mapOn && pathOn;
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e2 = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e2);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e2);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.15) { acc = 0; updateStats(); updateFormula(); syncSliders(); }
  accPlot += dt0;
  if (accPlot > 0.066) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis() && r.text() !== '';
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
{
  const t0 = Math.round(qsFloat('t', 0));
  if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
}
syncAll();
start();
</script>
</body>
</html>
