  <div class="sub" data-zh="斜坡竞赛的胜负在「咕噜噜」那一刻就定了:a=g·sinθ/(1+k) 里的 k=I/mr² 只看形状——实心球 0.4、实心柱 0.5、薄壁环 1.0,质量半径再大也白搭;势能被转动分走 k/(1+k) 这笔「转动税」,头顶能量条实时记账;滑块不滚不交税,气垫导轨上第一个到底;摩擦太小时滚动锁不住、打滑滑行,税没了反而变快 · 拖动旋转 / 空格运行/暂停" data-en="The race is decided the instant things start rolling: in a = g·sinθ/(1+k), k = I/mr² depends only on shape — solid sphere 0.4, solid cylinder 0.5, thin hoop 1.0; mass and radius count for nothing; the spin takes a k/(1+k) 'rotation tax' out of the potential energy, itemized live in the bars overhead; the block rolls not and pays nothing — first across on the air track; with too little friction rolling can't lock, bodies slip, and with the tax gone they speed up · drag to orbit / Space = run/pause">斜坡竞赛的胜负在「咕噜噜」那一刻就定了:a=g·sinθ/(1+k) 里的 k=I/mr² 只看形状——实心球 0.4、实心柱 0.5、薄壁环 1.0,质量半径再大也白搭;势能被转动分走 k/(1+k) 这笔「转动税」,头顶能量条实时记账;滑块不滚不交税,气垫导轨上第一个到底;摩擦太小时滚动锁不住、打滑滑行,税没了反而变快 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(-1.05,6.1,16.0);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-1.0,1.0,0.1);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);
/* ── 场景:两条平行斜坡,坡角可调;起点闸门,坡底终点线 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const G=9.8,LEN=6.4,R=0.45;
const colM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const slopeG=new THREE.Group();scene.add(slopeG);
const plateM=new THREE.MeshStandardMaterial({color:0x454c5a,roughness:0.75,metalness:0.25});
const railM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.35,metalness:0.7});
const airM=new THREE.MeshStandardMaterial({color:0x8fd0e8,roughness:0.3,emissive:0x3f7f96,emissiveIntensity:0.25});
/* 斜坡板 + 分道条 + 气垫导轨 */
const plateA=new THREE.Mesh(new THREE.BoxGeometry(LEN,0.1,2.1),plateM);plateA.position.set(LEN/2,0,-1.25);slopeG.add(plateA);
const plateB=plateA.clone();plateB.position.z=1.25;slopeG.add(plateB);
for(const lz of [-1.8,-0.7,0.7,1.8]){
  const lane=new THREE.Mesh(new THREE.BoxGeometry(LEN,0.02,0.05),railM);
  lane.position.set(LEN/2,0.06,lz);slopeG.add(lane);}
const airRail=new THREE.Mesh(new THREE.BoxGeometry(LEN,0.015,0.14),airM);
airRail.position.set(LEN/2,0.062,1.8);slopeG.add(airRail);
/* 终点线(格纹) */
const finG=new THREE.Group();finG.position.set(LEN-0.2,0.07,0);slopeG.add(finG);
const chkM=new THREE.MeshStandardMaterial({color:0xf2f5f9,roughness:0.6});
for(let i=0;i<12;i++)for(const zz of [-1.25,1.25]){
  const c=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.012,0.175),i%2?chkM:colM);
  c.position.set(0,0.002,(i-5.5)*0.19+ (zz>0?0.05:-0.05));finG.add(c);
}
/* 起点闸门:横杆拦住,松手时如道闸掀起 */
const gateG=new THREE.Group();gateG.position.set(0.32,0.1,-2.28);slopeG.add(gateG);
const gateFlap=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.04,4.55),railM);
gateFlap.geometry.translate(0,0,2.275);gateG.add(gateFlap);
for(const zz of [0.02,4.52]){
  const post=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.5,10),railM);
  post.position.set(0,0.05,zz);gateG.add(post);
}
/* 楔形支座(斜面下的实心楔),坡角改变时重建 */
const wedgeM=new THREE.MeshStandardMaterial({color:0x2c313c,roughness:0.85});
let wedges=[];
function rebuildWedges(){
  for(const w of wedges){w.parent.remove(w);w.geometry.dispose();}
  wedges=[];
  const sh=new THREE.Shape();
  sh.moveTo(0,-0.1);sh.lineTo(LEN,-0.1);sh.lineTo(0,-0.1-LEN*Math.tan(THETA*Math.PI/180));sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:2.1,bevelEnabled:false});
  for(const cz of [-1.25,1.25]){
    const w=new THREE.Mesh(geo,wedgeM);w.position.z=cz-1.05;slopeG.add(w);wedges.push(w);}
}
function placeSlope(){
  const th=THETA*Math.PI/180;
  slopeG.rotation.z=-th;slopeG.position.set(-3.3,LEN*Math.sin(th)+0.08,0);
}
/* ── 选手:同质量 1 kg、同半径 0.45 m,只有 k=I/mr² 不同 ── */
function stripeTex(c1,c2){
  const cv=document.createElement('canvas');cv.width=256;cv.height=64;
  const g=cv.getContext('2d');
  for(let i=0;i<8;i++){g.fillStyle=i%2?c1:c2;g.fillRect(i*32,0,32,64);}
  const t=new THREE.CanvasTexture(cv);t.wrapS=THREE.RepeatWrapping;return t;}
const barCols={tr:'#74dc84',rot:'#ffb35c',heat:'#ff6b6b'};
const racers=[];
function makeRacer(opt){
  const g=new THREE.Group();slopeG.add(g);
  let mesh;
  const std=o=>new THREE.MeshStandardMaterial(o);
  if(opt.kind==='sphere')mesh=new THREE.Mesh(new THREE.SphereGeometry(R,28,20),std({map:stripeTex(opt.c1,opt.c2),roughness:0.4,metalness:0.35}));
  else if(opt.kind==='cyl'){mesh=new THREE.Mesh(new THREE.CylinderGeometry(R,R,0.78,28),std({map:stripeTex(opt.c1,opt.c2),roughness:0.4,metalness:0.35}));mesh.rotation.x=Math.PI/2;}
  else if(opt.kind==='hoop'){
    mesh=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.11,14,44),std({color:opt.c1,roughness:0.35,metalness:0.55}));
    const bead=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8),std({color:0xd9822b,emissive:0xd9822b,emissiveIntensity:0.5}));
    bead.position.set(0.34,0,0.07);mesh.add(bead);
  }else mesh=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.5,0.6),std({color:opt.c1,roughness:0.5,metalness:0.3}));
  g.add(mesh);
  /* 头顶能量条:势能→平动(绿)+转动(橙)+打滑热(红) */
  const wrap=document.createElement('div');wrap.className='lbl';
  wrap.style.cssText='border-radius:8px;padding:5px 7px;display:flex;flex-direction:column;gap:3px';
  const seg=c=>`<div style="height:100%;background:${c};width:0%"></div>`;
  wrap.innerHTML=`<div class="ebName" style="font-size:10.5px;line-height:1"></div>`+
    `<div style="width:92px;height:8px;background:rgba(120,130,140,.3);border-radius:4px;overflow:hidden;display:flex">${seg(barCols.tr)}${seg(barCols.rot)}${seg(barCols.heat)}</div>`+
    `<div class="ebTxt" style="font-size:10px;line-height:1"></div>`;
  const barObj=new CSS2DObject(wrap);barObj.position.set(0,opt.r+0.62,0);g.add(barObj);
  /* 奖牌牌 */
  const medal=document.createElement('div');medal.className='lbl';
  const medalObj=new CSS2DObject(medal);medalObj.position.set(0,opt.r+1.08,0);g.add(medalObj);medalObj.visible=false;
  const eb=wrap.children[1].children;
  const rc={...opt,g,mesh,barObj,medalObj,medalEl:medal,s:0,v:0,w:0,rolling:true,state:'ready',
    ebar:{tr:eb[0],rot:eb[1],heat:eb[2],name:wrap.children[0],txt:wrap.children[2]}};
  racers.push(rc);return rc;
}
const rSphere=makeRacer({id:'sphere',kind:'sphere',r:R,k:0.4,m:1,lane:-0.7,c1:'#5b7d9e',c2:'#9fb4c8',
  nz:'实心球 k=0.4',ez:'Sphere k=0.4',sn:'球',se:'Sph'});
const rCyl=makeRacer({id:'cyl',kind:'cyl',r:R,k:0.5,m:1,lane:-1.8,c1:'#3f6b4f',c2:'#8fd0a8',
  nz:'实心圆柱 k=0.5',ez:'Cylinder k=0.5',sn:'柱',se:'Cyl'});
const rHoop=makeRacer({id:'hoop',kind:'hoop',r:R,k:1.0,m:1,lane:0.7,c1:'#c8a23c',
  nz:'薄壁圆环 k=1.0',ez:'Hoop k=1.0',sn:'环',se:'Hoop'});
const rBlock=makeRacer({id:'block',kind:'block',r:0.25,k:0,m:1,lane:1.8,c1:'#c86a4a',
  nz:'滑块 · 气垫导轨',ez:'Block · air track',sn:'滑',se:'Blk'});
const rBig=makeRacer({id:'big',kind:'sphere',r:0.66,k:0.4,m:10,lane:0.7,c1:'#8a5a2c',c2:'#e0b070',
  nz:'大球 10 kg·2R · k=0.4',ez:'Big 10 kg·2R · k=0.4',sn:'大球',se:'Big'});
rBig.demoOnly=true;rBig.g.visible=false;rBig.barObj.visible=false;
/* ── 状态 ── */
let mode='all',pairIdx=0,THETA=15,MU=0.15,playing=true,labelsOn=true,slowMo=false,ebarOn=true;
let launched=false,demoOn=false,finishOrder=[],allDoneT=-1,simT=0,gateAng=0;
const PAIRS=[[rSphere,rHoop],[rSphere,rCyl],[rCyl,rHoop],[rBlock,rHoop]];
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const muReq=k=>Math.tan(THETA*Math.PI/180)*k/(1+k);
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=slopeG){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblEq=addLabel(()=>L('滚动加速 a = g·sinθ/(1+k)','Rolling a = g·sinθ/(1+k)'),new THREE.Vector3(LEN*0.42,1.35,-1.25),'r');
const lblK=addLabel(()=>L('k=I/mr² 只看形状:球 0.4 < 柱 0.5 < 环 1.0','k=I/mr² — shape only: sphere 0.4 < cyl 0.5 < hoop 1.0'),new THREE.Vector3(LEN*0.42,1.35,1.25),'o');
const lblAir=addLabel(()=>L('气垫导轨:滑块不滚不交税,a=g·sinθ','Air track: no rolling, no tax, a=g·sinθ'),new THREE.Vector3(LEN*0.55,0.75,1.8),'b');
const lblStart=addLabel(()=>L('起点 · 松手同时出发','Start · released together'),new THREE.Vector3(0.32,0.85,0),'g');
const lblFin=addLabel(()=>L('坡底:金·银·铜按到达亮起','Finish: gold·silver·bronze light up'),new THREE.Vector3(LEN-0.2,0.85,0),'y');
const lblBar=addLabel(()=>L('能量条:绿=平动 橙=转动税 红=打滑热','Bars: green=translation orange=spin tax red=slip heat'),new THREE.Vector3(LEN*0.75,2.05,-1.25),'',()=>mode!=='pair'&&!demoOn);
const lblDemo=addLabel(()=>L('质量半径全无关:10 kg·双半径 与 1 kg 并驾齐驱','Mass & radius don\'t matter: 10 kg·2R ties the 1 kg ball'),new THREE.Vector3(LEN*0.45,2.35,0),'g',()=>demoOn);
/* ── 物理步进:滚动 / 打滑 / 滑块,含能量记账 ── */
function stepRace(dt){
  for(const rc of racers){
    /* 终点后滑入缓冲段,渐渐刹停 */
    if(rc.state==='done'){
      if(rc.s<LEN+1.9){
        rc.v=Math.max(0,rc.v-2.6*dt);rc.s=Math.min(LEN+1.9,rc.s+rc.v*dt);
        if(rc.id!=='block')rc.mesh.rotation.z-=rc.v/rc.r*dt;}
      continue;}
    if(rc.state!=='run')continue;
    if(rc.id==='block'){rc.v+=G*Math.sin(THETA*Math.PI/180)*dt;rc.w=0;}
    else{
      const u=rc.v-rc.w*rc.r;
      if(!rc.rolling){
        const sgn=u>0?1:-1;
        rc.v+=(G*Math.sin(THETA*Math.PI/180)-sgn*MU*G*Math.cos(THETA*Math.PI/180))*dt;
        rc.w+=sgn*MU*G*Math.cos(THETA*Math.PI/180)/(rc.k*rc.r)*dt;
        if(Math.abs(rc.v-rc.w*rc.r)<0.02&&MU>=muReq(rc.k)){rc.rolling=true;rc.w=rc.v/rc.r;}
      }else{
        if(MU<muReq(rc.k)){rc.rolling=false;}
        else{rc.v+=G*Math.sin(THETA*Math.PI/180)/(1+rc.k)*dt;rc.w=rc.v/rc.r;}
      }
    }
    rc.s+=rc.v*dt;
    rc.mesh.rotation.z-=rc.w*dt;
    if(rc.state==='run'&&rc.s>=LEN){
      rc.s=LEN;rc.state='done';finishOrder.push(rc);
      const mi=finishOrder.length-1,meds=[['金','Gold'],['银','Silver'],['铜','Bronze'],['第4','4th']];
      rc.medalObj.visible=true;rc.medalObj.element.className='lbl '+['y','','o','r'][Math.min(mi,3)];
      rc.medalEl.textContent=L(meds[mi][0],meds[mi][1]);
      if(finishOrder.length===racers.filter(x=>x.g.visible).length)allDoneT=simT;
    }
  }
}
function energy(rc){
  const pe=rc.m*G*rc.s*Math.sin(THETA*Math.PI/180),et=0.5*rc.m*rc.v*rc.v,er=0.5*rc.k*rc.m*rc.r*rc.r*rc.w*rc.w;
  return {pe,et,er,heat:Math.max(0,pe-et-er)};
}
function resetRace(){
  finishOrder=[];allDoneT=-1;launched=false;
  for(const rc of racers){
    rc.s=0;rc.v=0;rc.w=0;rc.rolling=true;rc.state='ready';
    rc.mesh.rotation.z=0;rc.medalObj.visible=false;rc.medalEl.textContent='';}
}
/* ── 打滑火花 ── */
const NSPARK=110;
const sparkPos=new Float32Array(NSPARK*3);
const sparks=[];for(let i=0;i<NSPARK;i++){sparks.push({p:new THREE.Vector3(0,-99,0),v:new THREE.Vector3(),life:0});sparkPos[i*3+1]=-99;}
const sparkGeo=new THREE.BufferGeometry();
sparkGeo.setAttribute('position',new THREE.BufferAttribute(sparkPos,3));
const sparkPts=new THREE.Points(sparkGeo,new THREE.PointsMaterial({color:0xffb35c,size:0.075,transparent:true,opacity:0.95,depthWrite:false}));
scene.add(sparkPts);
let sparkCursor=0;
const vTmp=new THREE.Vector3();
function spawnSpark(rc){
  vTmp.set(rc.s,0.03,rc.g.position.z);
  slopeG.localToWorld(vTmp);
  const sp=sparks[sparkCursor];sparkCursor=(sparkCursor+1)%NSPARK;
  sp.p.copy(vTmp);sp.life=0.4;
  sp.v.set(-(0.6+Math.random())*Math.cos(THETA*Math.PI/180),0.8+Math.random()*1.2,(Math.random()-0.5)*1.4);
}
function stepSparks(dt){
  for(let i=0;i<NSPARK;i++){
    const sp=sparks[i];
    if(sp.life>0){sp.life-=dt;sp.v.y-=6*dt;sp.p.addScaledVector(sp.v,dt);
      sparkPos[i*3]=sp.p.x;sparkPos[i*3+1]=sp.life>0?sp.p.y:-99;sparkPos[i*3+2]=sp.p.z;}}
  sparkGeo.attributes.position.needsUpdate=true;
}
/* ── 模式与控件 ── */
function layoutRacers(){
  if(demoOn){
    rSphere.g.position.set(0.15,0.05+rSphere.r,-1.8);rBig.g.position.set(0.15,0.05+rBig.r,1.8);
    rBig.g.visible=true;rBig.barObj.visible=ebarOn;
    for(const rc of [rCyl,rHoop,rBlock]){rc.g.visible=false;rc.barObj.visible=false;}
    return;}
  rBig.g.visible=false;rBig.barObj.visible=false;
  const list=mode==='all'?[rSphere,rCyl,rHoop,rBlock]:PAIRS[pairIdx%PAIRS.length];
  for(const rc of racers){
    if(rc.demoOnly)continue;
    const on=list.includes(rc),lane=mode==='all'?rc.lane:(rc===list[0]?-0.7:0.7);
    rc.g.visible=on;rc.barObj.visible=on&&ebarOn;
    rc.g.position.set(0.15,0.05+rc.r,lane);}
}
function setAngle(v){THETA=clamp(v,5,30);
  document.getElementById('sAngle').value=THETA;
  document.getElementById('sAngleVal').textContent=THETA.toFixed(0)+'°';
  placeSlope();rebuildWedges();updateStats();}
function setMu(v){MU=clamp(v,0.05,0.6);
  document.getElementById('sMu').value=MU;
  document.getElementById('sMuVal').textContent=MU.toFixed(2);updateStats();}
function setEbar(v){ebarOn=v;
  document.getElementById('tglEbar').checked=v;
  layoutRacers();}
function setLaunch(){ /* 裁判松手:全体归位并同时出发 */
  resetRace();
  if(mode==='pair')pairIdx++;
  layoutRacers();launched=true;
  for(const rc of racers)if(rc.g.visible)rc.state='run';
  updateStats();}
function setMassDemo(v){demoOn=v;setLaunch();}
function setMode(m){mode=m;
  document.getElementById('bAll').classList.toggle('on',m==='all');
  document.getElementById('bPair').classList.toggle('on',m==='pair');
  setLaunch();}
const STEPS=[
 {zh:'<b>谁先到底</b>:松手!滑块不滚不交税,气垫导轨上第一个到底;球 0.4 < 柱 0.5 < 环 1.0 依次压阵',
  en:'<b>Who wins</b>: release! The block rolls not and pays no tax — first across; sphere 0.4 < cylinder 0.5 < hoop 1.0 file in behind',
  act(){setMode('all');setAngle(15);setMu(0.15);setEbar(true);setLaunch();}},
 {zh:'<b>方程与 k</b>:滚动加速 a=g·sinθ/(1+k),k=I/mr² 只由形状决定,与质量半径无关',
  en:'<b>The equation</b>: rolling acceleration a=g·sinθ/(1+k), k=I/mr² set by shape alone, mass and radius nowhere',
  act(){setMode('all');setAngle(15);setMu(0.15);setLaunch();}},
 {zh:'<b>能量条看转动税</b>:势能→平动+转动,转动占比 k/(1+k):球 29%、柱 33%、环 50%',
  en:'<b>Watch the tax</b>: PE → translation + spin, spin share k/(1+k): sphere 29%, cylinder 33%, hoop 50%',
  act(){setMode('all');setEbar(true);setLaunch();}},
 {zh:'<b>质量半径无关</b>:10 kg、双倍半径的大球与 1 kg 小球 k 同为 0.4——全程并驾齐驱',
  en:'<b>Mass & radius are moot</b>: the 10 kg double-radius ball and the 1 kg ball share k=0.4 — dead level all the way',
  act(){setMassDemo(true);setEbar(true);}},
 {zh:'<b>圆环为何最慢</b>:质量全堆在轮缘,I=mr²,一半能量拿去转——最重的转动税',
  en:'<b>Why the hoop trails</b>: all mass at the rim, I=mr², half the energy goes to spinning — the heaviest tax',
  act(){setMode('pair');pairIdx=0;setAngle(15);setMu(0.15);setLaunch();}},
 {zh:'<b>打滑反而变快?</b>:μ 拉到 0.05、坡角 25°,锁不住滚动——转动税消失,只剩一点滑动摩擦',
  en:'<b>Slip to go faster?</b>: μ to 0.05 at 25° — rolling can\'t lock, the tax vanishes, leaving a little sliding friction',
  act(){setMode('all');setAngle(25);setMu(0.05);setLaunch();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);});
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}
function updateStats(){
  document.getElementById('stAngle').innerHTML=THETA.toFixed(0)+'<small> °</small>';
  const vis=racers.filter(x=>x.g.visible&&x.state!=='ready');
  let lead=null;
  for(const rc of vis)if(!lead||rc.s>lead.s)lead=rc;
  if(lead&&lead.state==='done')lead=finishOrder[0]||lead;
  document.getElementById('stLead').textContent=lead?(LANG==='en'?lead.se:lead.sn):'—';
  const rv=document.getElementById('stRot');
  if(lead){
    const en=energy(lead),pct=en.pe>1e-6?en.er/en.pe*100:0;
    rv.innerHTML=pct.toFixed(0)+'<small> %</small>';
    rv.className='v '+(pct>45?'warn':(pct<32&&pct>0?'ok':''));
  }else{rv.innerHTML='—';rv.className='v';}
  const ov=document.getElementById('stOrder');
  ov.textContent=finishOrder.length?finishOrder.map(x=>LANG==='en'?x.se:x.sn).join('>'):'—';
  ov.className='v '+(finishOrder.length?'ok':'');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='en'?'zh':'en';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});

  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();

document.getElementById('bPair').addEventListener('click',()=>setMode('pair'));
document.getElementById('bGo').addEventListener('click',()=>setLaunch());
document.getElementById('sAngle').addEventListener('input',e=>setAngle(+e.target.value));

document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;});
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 闸门掀起的动画 */
  gateAng+=(((launched&&playing)?-0.55:0)-gateAng)*Math.min(1,dt*5);
  gateG.rotation.x=gateAng;
  /* 物理:每帧两个子步,保证高速时不穿 */
  if(dts>0){const sub=2;for(let i=0;i<sub;i++)stepRace(dts/sub);}
  /* 自动重赛:全体到齐后 1.6 s 再来一轮 */
  if(playing&&launched&&allDoneT>0&&simT-allDoneT>1.6)setLaunch();
  /* 选手摆放 + 能量条记账 */
  for(const rc of racers){
    if(!rc.g.visible)continue;
    rc.g.position.x=rc.state==='ready'?0.15:0.15+rc.s;
    const en=energy(rc),tot=Math.max(en.pe,1e-6),slipping=!rc.rolling&&rc.id!=='block'&&rc.state==='run';
    rc.ebar.tr.style.width=(en.et/tot*100).toFixed(1)+'%';
    rc.ebar.rot.style.width=(en.er/tot*100).toFixed(1)+'%';
    rc.ebar.heat.style.width=(en.heat/tot*100).toFixed(1)+'%';
    rc.ebar.name.textContent=LANG==='en'?rc.ez:rc.nz;
    rc.ebar.txt.textContent=rc.state==='ready'?L('势能待发','ready'):
      slipping?L('打滑! 转动税消失','slipping! tax gone'):
      L(`转动税 ${(en.er/tot*100).toFixed(0)}%`,`spin tax ${(en.er/tot*100).toFixed(0)}%`);
    rc.ebar.txt.style.color=slipping?barCols.heat:(rc.id==='block'?'#8fd0e8':barCols.rot);
    if(slipping&&rc.v>0.4&&Math.random()<dts*38)spawnSpark(rc);}
  stepSparks(dts);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();placeSlope();rebuildWedges();buildSteps();setMode('all');
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);else applyPhase(0);
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
