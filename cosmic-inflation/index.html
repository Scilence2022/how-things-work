{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const QS=new URLSearchParams(location.search);
let playing=true, labelsOn=true, speedK=1;    // 模板公共状态，先声明

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,160);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,2000);
camera.position.set(0,3.6,10);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=1.2; controls.maxDistance=600;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(6,8,5); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-7,4,-6); scene.add(fill);

/* ---- 星空背景（不受雾影响）---- */
const starGeo=new THREE.BufferGeometry();
const sp=new Float32Array(700*3);
for(let i=0;i<700;i++){
  const v=new THREE.Vector3().randomDirection().multiplyScalar(160+Math.random()*220);
  sp[i*3]=v.x;sp[i*3+1]=v.y;sp[i*3+2]=v.z;
}
starGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xcfd8e6,size:0.9,sizeAttenuation:true,fog:false})));

/* ---- 物理模型（暴胀标准图像）----
   尺度因子 a∝e^(Ht)；每过一个 H⁻¹ 就是一「e-折」。
   平坦性：Ωk=−k/(a²H²) ∝ e^(−2N) —— N=60 时 |Ω−1|~e^(−120)≈10⁻⁵²，观测 Ω≈1±10⁻⁵ ✓
   视界：共动哈勃半径 ∝ e^(−N)，暴胀前因果相连的区域被拉开成今日可观测宇宙还大
   磁单极：数密度 ∝ e^(−3N)，GUT 单极被稀释到可观测宇宙 <1 个
   涨落：量子涨落被拉到宇宙尺度，幅度冻结在 ~10⁻⁵ —— 即 CMB 的 ΔT/T≈10⁻⁵ 斑点 */
const PH={PLANCK:0,HORIZON:1,INFLATE:2,REHEAT:3,CMB:4,COLLAPSE:5};
const GROWTH=0.062;          // 每 e-折的视觉尺度增长率（画面压缩，数值不压缩）
const AMP0=0.35;             // 初始褶皱幅度

/* ---- 口袋宇宙：褶皱球体（共用几何的实体+线框）---- */
const spaceG=new THREE.Group(); spaceG.scale.setScalar(1.1); scene.add(spaceG);
const geo=new THREE.IcosahedronGeometry(1,4);
const posAttr=geo.attributes.position, NV=posAttr.count;
const wArr=new Float32Array(NV);              // 每顶点的褶皱值（初始化时算好）
{
  const ks=[]; let seed=7;
  const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  for(let k=0;k<7;k++){
    ks.push({d:new THREE.Vector3(rnd()*2-1,rnd()*2-1,rnd()*2-1).normalize().multiplyScalar(2+rnd()*4),
             f:3+rnd()*9,p:rnd()*6.28,a:1/(1+k*0.7)});
  }
  const v=new THREE.Vector3();
  for(let i=0;i<NV;i++){
    v.fromBufferAttribute(posAttr,i).normalize();
    let w=0; for(const k of ks) w+=k.a*Math.sin(v.dot(k.d)*k.f+k.p);
    wArr[i]=w;
  }
}
const fillMat=new THREE.MeshStandardMaterial({color:0x2c3a55,roughness:0.55,metalness:0.1,
  transparent:true,opacity:0.92,flatShading:true,emissive:0xffa94d,emissiveIntensity:0});
const wireMat=new THREE.MeshBasicMaterial({color:0x74c0fc,wireframe:true,transparent:true,opacity:0.14});
const blob=new THREE.Mesh(geo,fillMat);
const wire=new THREE.Mesh(geo,wireMat);
spaceG.add(blob,wire);
const _v3=new THREE.Vector3();
let lastAmp=-1;
function shapeBlob(amp){                       // 径向位移 p=1+amp·w（法线保持球面法线，省一次重算）
  if(Math.abs(amp-lastAmp)<0.0006) return;
  lastAmp=amp;
  for(let i=0;i<NV;i++){
    const s=1+amp*wArr[i];
    _v3.fromBufferAttribute(posAttr,i).normalize();
    posAttr.setXYZ(i,_v3.x*s,_v3.y*s,_v3.z*s);
  }
  posAttr.needsUpdate=true;
}

/* ---- 磁单极（随动坐标：位置随空间膨胀散开，自身物理尺寸不变）---- */
const NMONO=140;
const monoMat=new THREE.MeshStandardMaterial({color:0xff5a5a,emissive:0xff2222,emissiveIntensity:0.7,roughness:0.4});
const mono=new THREE.InstancedMesh(new THREE.OctahedronGeometry(0.03),monoMat,NMONO);
const monoDirs=[];
{
  const d=new THREE.Object3D(); let seed=13;
  const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  for(let i=0;i<NMONO;i++){
    const dir=new THREE.Vector3(rnd()*2-1,rnd()*2-1,rnd()*2-1).normalize().multiplyScalar(Math.cbrt(rnd())*0.85);
    monoDirs.push(dir);
    d.position.copy(dir); d.updateMatrix(); mono.setMatrixAt(i,d.matrix);
  }
}
mono.instanceMatrix.needsUpdate=true;
spaceG.add(mono);

/* ---- 视界信标与光锥圈 ---- */
function dirRotY(v,ang){ const c=Math.cos(ang),s=Math.sin(ang);
  return new THREE.Vector3(v.x*c+v.z*s,v.y,-v.x*s+v.z*c); }
const d1=new THREE.Vector3(0.8,0.22,0.56).normalize();
const d2=dirRotY(d1,65*Math.PI/180);           // 两信标相隔 65°（暴胀前同一因果区）
const beaconMat=new THREE.MeshBasicMaterial({color:0xbde9ff});
const b1=new THREE.Mesh(new THREE.SphereGeometry(0.035,12,10),beaconMat);
const b2=b1.clone();
b1.position.copy(d1); b2.position.copy(d2);
spaceG.add(b1,b2);
const ringGeo=new THREE.RingGeometry(0.94,1.0,48);
function makeRing(dir){
  const m=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,
    opacity:0.75,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.position.copy(dir).multiplyScalar(1.02);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir);
  spaceG.add(m); return m;
}
const ring1=makeRing(d1), ring2=makeRing(d2);

/* ---- CMB 球（再加热后出现：ΔT/T≈10⁻⁵ 的温度斑点）---- */
function cmbTexture(){
  const c=document.createElement('canvas');c.width=1024;c.height=512;
  const g=c.getContext('2d');
  g.fillStyle='#151b28';g.fillRect(0,0,1024,512);
  for(let i=0;i<430;i++){
    const x=Math.random()*1024,y=Math.random()*512,r=6+Math.random()*34,t=Math.random();
    const col=t<0.5?`rgba(64,120,196,${(0.22+0.42*(0.5-t)).toFixed(3)})`
                   :`rgba(216,96,84,${(0.22+0.42*(t-0.5)).toFixed(3)})`;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.3);g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const cmbMat=new THREE.MeshBasicMaterial({map:cmbTexture(),transparent:true,opacity:0,depthWrite:false});
const cmbS=new THREE.Mesh(new THREE.SphereGeometry(1.03,48,32),cmbMat);
cmbS.visible=false; spaceG.add(cmbS);

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,visFn,cls=''){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
const lbBlob=addLabel(()=>L('口袋宇宙：褶皱、单极、曲率都在里面','Pocket universe: wrinkles, monopoles, curvature'),()=>phase<=PH.HORIZON,'b');
const lbCausal=addLabel(()=>L('两侧光信号还能会合——此刻因果相连','Light still crosses — causally connected now'),()=>phase===PH.HORIZON,'g');
const lbFlat=addLabel(()=>L('褶皱被指数拉伸当场拉平','Wrinkles stretched flat on the spot'),()=>phase===PH.INFLATE&&Ndone>6,'o');
const lbHorizon=addLabel(()=>L('光追不上空间膨胀——两侧天区被拉开','Light can\'t outrun the stretch — regions torn apart'),()=>(phase===PH.INFLATE&&Ndone>15)||phase===PH.CMB,'r');
const lbMono=addLabel(()=>L('磁单极被稀释：可观测宇宙不足一个','Monopoles diluted: <1 per observable universe'),()=>phase===PH.INFLATE&&Ndone>22,'r');
const lbReheat=addLabel(()=>L('再加热：暴胀场衰变，能量灌入粒子——大爆炸「真正」开始','Reheating: inflaton decays, energy pours into particles'),()=>phase===PH.REHEAT,'o');
const lbCMB=addLabel(()=>L('CMB 斑点＝被拉到宇宙尺度的量子涨落','CMB spots = quantum fluctuations stretched to cosmic scale'),()=>phase===PH.CMB,'g');
const lbFall=addLabel(()=>L('曲率赢下比赛——宇宙弯塌重新收缩','Curvature wins — the universe bends and recollapses'),()=>phase===PH.COLLAPSE,'r');

/* ---- 状态 ---- */
let phase=PH.PLANCK, phaseT=0;
let Nset=60, Ndone=0, Sg=1.1, amp=AMP0;
let ringPhys=0.02, monoHi=false, manualCam=false;
const FILL_DARK=0x2c3a55, FALL_RED=0x8a3030;

function inflationDone(){ return 1.1*Math.exp(GROWTH*Nset); }
function resetAll(){
  phase=PH.PLANCK; phaseT=0; Ndone=0; Sg=1.1; amp=AMP0; ringPhys=0.02; manualCam=false;
  fillMat.color.setHex(FILL_DARK); fillMat.opacity=0.92; fillMat.emissiveIntensity=0;
  wireMat.opacity=0.14; cmbMat.opacity=0; cmbS.visible=false;
  shapeBlob(amp); syncUI();
}
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  starGeo.attributes.position.needsUpdate=true;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); syncUI();
}

/* ---- 步骤相位 ---- */
const STEPS=[
  {zh:'普朗克期：一粒褶皱的口袋宇宙——量子涨落、磁单极、曲率全挤在里面',en:'Planck era: a wrinkled pocket universe — fluctuations, monopoles, curvature all crammed in'},
  {zh:'视界问题：此刻两侧天区还能因果相连——为何后来温度却一模一样？',en:'Horizon problem: the two sides are still causally connected — why then identical temperatures?'},
  {zh:'暴胀：~10⁻³⁶ s 起空间指数膨胀，褶皱被当场拉平、两侧被拉开',en:'Inflation: exponential stretch flattens wrinkles and pulls the sides apart'},
  {zh:'平坦性：|Ω−1|∝e^(−2N)——曲率被稀释到 10⁻⁵²，Ω≈1 出厂即设定',en:'Flatness: |Ω−1|∝e^(−2N) — curvature diluted to 10⁻⁵²; Ω≈1 set at the factory'},
  {zh:'磁单极稀释：数密度 ∝e^(−3N)，GUT 单极被稀释到可观测宇宙不足一个',en:'Monopoles: density ∝e^(−3N) — GUT monopoles diluted below one per observable universe'},
  {zh:'再加热：暴胀场衰变，能量灌入粒子——炽热大爆炸真正开场',en:'Reheating: the inflaton decays — the hot Big Bang proper begins'},
  {zh:'量子涨落→CMB 斑点：被拉到宇宙尺度的密度涨落，冻结成 ΔT/T≈10⁻⁵ 的种子',en:'Fluctuations→CMB spots: quantum ripples frozen as ΔT/T≈10⁻⁵ seeds'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;gotoStep(i);syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function skipToEnd(){                          // 瞬时完成暴胀（供步骤跳转）
  Ndone=Nset; Sg=inflationDone(); amp=AMP0*Math.exp(-Nset/9); shapeBlob(amp); phaseT=0;
}
function gotoStep(i){
  resetAll(); playing=true; manualCam=false;
  if(i===0){ phase=PH.PLANCK; }
  else if(i===1){ phase=PH.HORIZON; }
  else if(i>=2&&i<=4){ phase=PH.INFLATE; if(i===3){Nset=60;} syncUI(); }
  else if(i===5){ skipToEnd(); phase=PH.REHEAT; }
  else if(i===6){ skipToEnd(); phase=PH.CMB; cmbS.visible=true; }
}

/* ---- 读数 ---- */
function fmtPow(x){
  if(x>=0.01) return x>=1?x.toFixed(1):x.toFixed(3);
  const lg=Math.log10(x), k=Math.floor(lg), m=Math.pow(10,lg-k);
  return m.toFixed(1)+'×10<sup>'+k+'</sup>';
}
function updateStats(){
  document.getElementById('stN').innerHTML=Ndone.toFixed(1)+'<small> e-folds</small>';
  const a=Math.exp(Ndone);
  document.getElementById('stA').innerHTML=fmtPow(a)+'<small> ×a₀</small>';
  document.getElementById('stOm').innerHTML=fmtPow(Math.exp(-2*Ndone));
  document.getElementById('stMono').innerHTML=fmtPow(Math.exp(-3*Ndone));
}

/* ---- UI 同步 ---- */
function syncUI(){
  document.getElementById('sN').value=Nset;
  document.getElementById('sNVal').textContent='N = '+Nset;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
  document.getElementById('btnMono').classList.toggle('on',monoHi);
  document.getElementById('btnFlat').classList.toggle('on',Nset>=60);
}
document.getElementById('sN').addEventListener('input',e=>{
  Nset=+e.target.value; syncUI();
  if(phase===PH.INFLATE&&Ndone>=Nset){        // 半途调低：当场结束并结算
    if(Nset<55){ phase=PH.COLLAPSE; phaseT=0; } else { skipToEnd(); phase=PH.REHEAT; }
  }
});
document.getElementById('sSpd').addEventListener('input',e=>{speedK=+e.target.value/100;syncUI();});
document.getElementById('btnReplay').addEventListener('click',()=>{resetAll();activeStep=0;syncSteps();});
document.getElementById('btnCMB').addEventListener('click',()=>{activeStep=6;gotoStep(6);syncSteps();});
document.getElementById('btnMono').addEventListener('click',()=>{monoHi=!monoHi;syncUI();});
document.getElementById('btnFlat').addEventListener('click',()=>{Nset=60;syncUI();
  if(phase===PH.INFLATE&&Ndone>=Nset){skipToEnd();phase=PH.REHEAT;}});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
controls.addEventListener('start',()=>{manualCam=true;});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, acc=0, statAcc=0;
const camDir=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const sdt=dt*speedK;
  if(playing){
    phaseT+=sdt;
    if(phase===PH.PLANCK){ if(phaseT>0.9){phase=PH.HORIZON;phaseT=0;activeStep=1;syncSteps();} }
    else if(phase===PH.HORIZON){ ringPhys+=0.5*sdt; if(phaseT>2.4){phase=PH.INFLATE;phaseT=0;activeStep=2;syncSteps();} }
    else if(phase===PH.INFLATE){
      ringPhys+=0.35*sdt;
      const T=clamp(Nset*0.07,2,5.2);
      Ndone=Math.min(Nset,Nset*phaseT/T);
      amp=AMP0*Math.exp(-Ndone/9);
      Sg=1.1*Math.exp(GROWTH*Ndone);
      if(Ndone>=Nset){
        if(Nset<55){ phase=PH.COLLAPSE; phaseT=0; activeStep=0; }
        else{ phase=PH.REHEAT; phaseT=0; activeStep=5; }
        syncSteps();
      }
    }
    else if(phase===PH.REHEAT){                // 暴胀场衰变：一次白热闪光
      fillMat.emissiveIntensity=1.4*Math.sin(Math.min(phaseT/0.8,1)*Math.PI);
      if(phaseT>0.8){ phase=PH.CMB; phaseT=0; activeStep=6; syncSteps(); fillMat.emissiveIntensity=0; cmbS.visible=true; }
    }
    else if(phase===PH.CMB){
      cmbMat.opacity=Math.min(0.96,cmbMat.opacity+sdt*1.2);
      fillMat.opacity=Math.max(0.22,fillMat.opacity-sdt*0.8);
      wireMat.opacity=Math.max(0.03,wireMat.opacity-sdt*0.12);
      Sg*=1+0.03*sdt; ringPhys+=0.45*sdt;      // 辐射纪：a∝t^1/2 慢涨，光锥重新扩张
      if(phaseT>6) resetAll();
    }
    else if(phase===PH.COLLAPSE){              // 招牌失败态：N 不足 → 曲率主导，当场弯塌
      const k=Math.min(phaseT/2.6,1);
      Sg=inflationDone()*(1-0.72*k);
      amp=AMP0*Math.exp(-Nset/9)+0.4*k*k;
      fillMat.color.lerpColors(new THREE.Color(FILL_DARK),new THREE.Color(FALL_RED),k);
      if(phaseT>3.4) resetAll();
    }
  }
  shapeBlob(amp);
  spaceG.scale.setScalar(Sg);
  spaceG.rotation.y+=dt*0.04;
  mono.scale.setScalar(1/Sg);                  // 单极物理尺寸不变，只被拉开间距
  monoMat.emissiveIntensity=monoHi?1.6:0.7;
  b1.scale.setScalar(1/Sg); b2.scale.setScalar(1/Sg);
  ring1.scale.setScalar(ringPhys/Sg);          // 光锥按物理速度扩张：暴胀中被空间甩开
  ring2.scale.setScalar(ringPhys/Sg);
  scene.fog.near=Sg*7; scene.fog.far=Sg*40;
  // 相机：保持把口袋宇宙装进画面（用户拖动后交还控制权）
  if(!manualCam){
    camDir.copy(camera.position).sub(controls.target).normalize();
    const want=Math.max(6.0,Sg*4.8);   // 拉远：整团口袋宇宙完整入画，顶部留白避开页头文字
    camera.position.copy(controls.target).addScaledVector(camDir,want);
  }
  // 标签位置随尺度走
  lbBlob.position.set(0,Sg*1.5,0);
  lbCausal.position.set((d1.x+d2.x)*0.5*Sg,(d1.y+d2.y)*0.5*Sg+0.5,(d1.z+d2.z)*0.5*Sg);
  lbFlat.position.set(0,-Sg*1.35,0);
  lbHorizon.position.set(d1.x*Sg*1.05,d1.y*Sg*1.05+0.45,d1.z*Sg*1.05);
  lbMono.position.set(-Sg*0.7,Sg*0.75,0);
  lbReheat.position.set(0,Sg*1.55,0);
  lbCMB.position.set(0,Sg*1.35,0);
  lbFall.position.set(0,Sg*1.45,0);
  statAcc+=dt; if(statAcc>0.1){statAcc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
if(QS.get('pause')==='1')playing=false;
if(QS.get('labels')==='0')labelsOn=false;
const qSpd=QS.get('speed'); if(qSpd){speedK=clamp(+qSpd||1,0.3,2.2);document.getElementById('sSpd').value=speedK*100;}
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
document.getElementById('tglLabels').checked=labelsOn;
shapeBlob(amp); syncUI();
applyTheme(); applyLang(); buildSteps(); updateStats(); start();
</script>
</body>
</html>
