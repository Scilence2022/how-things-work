<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伯努利效应 · 流速加快压强降低</title>
<style>
:root,:root[data-theme="dark"]{color-scheme:dark;
  --acc:#4dabf7;--bg:#0b0f14;--panel:rgba(11,15,20,.88);--panel-border:rgba(255,255,255,.09);
  --text:#f0f4f9;--text2:#8fa3ba;--text3:#c0cedc;--hover:rgba(255,255,255,.05);
  --shadow:0 8px 32px rgba(0,0,0,.5);--tool:rgba(11,15,20,.80);--tool-border:rgba(255,255,255,.12);
  --cv-pill:rgba(11,15,20,.82);}
:root[data-theme="light"]{color-scheme:light;
  --acc:#1971c2;--bg:#e8f0f8;--panel:rgba(255,255,255,.90);--panel-border:rgba(10,20,40,.10);
  --text:#14202e;--text2:#4d6278;--text3:#2e4157;--hover:rgba(10,20,40,.05);
  --shadow:0 8px 26px rgba(20,40,80,.14);--tool:rgba(255,255,255,.88);--tool-border:rgba(10,20,40,.14);
  --cv-pill:rgba(255,255,255,.86);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  transition:background .25s;}
#app{position:fixed;inset:0;}#app canvas{display:block;}
#tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
.tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
  font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;text-decoration:none;backdrop-filter:blur(6px);
  transition:border-color .15s,color .15s,transform .15s;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
#title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
#title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;
  text-shadow:0 2px 8px rgba(0,0,0,.6);}
#title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;
  text-shadow:0 1px 4px rgba(0,0,0,.5);}
#stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
  backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
#stats .k{font-size:12px;color:var(--text2);align-self:center;}
#stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
#stats .v small{font-size:11px;color:var(--text2);font-weight:400;}
#panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
  background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
  padding:14px 16px 12px;backdrop-filter:blur(6px);box-shadow:var(--shadow);
  max-height:calc(100vh - 160px);overflow:auto;}
#actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;background:var(--hover);
  color:var(--text2);border:1px solid var(--tool-border);border-radius:9px;padding:7px 10px;
  font-size:12.5px;font-weight:600;transition:border-color .15s,color .15s,background .15s;}
.abtn:hover{border-color:var(--acc);color:var(--text);}
.abtn.on{border-color:rgba(77,171,247,.6);background:rgba(77,171,247,.12);color:var(--text);}
:root[data-theme="light"] .abtn.on{border-color:rgba(25,113,194,.5);background:rgba(25,113,194,.10);}
#formula{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--text2);
  border-top:1px dashed var(--panel-border);padding-top:7px;}
#formula b{color:var(--text3);font-weight:600;}
#steps{list-style:none;margin-top:8px;}
#steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;align-items:flex-start;}
#steps li:hover{background:var(--hover);}
#steps li.on{background:rgba(77,171,247,.10);border-color:rgba(77,171,247,.45);}
:root[data-theme="light"] #steps li.on{background:rgba(25,113,194,.08);border-color:rgba(25,113,194,.4);}
#steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
  align-items:center;justify-content:center;margin-top:1px;
  background:rgba(255,255,255,.12);color:var(--text3);}
:root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
#steps li.on .n{background:var(--acc);color:#fff;}
#steps .t{font-size:12px;color:var(--text3);line-height:1.45;}
#ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
#play{padding:10px 14px;font-size:14px;font-weight:600;background:var(--acc);color:#fff;
  border:0;border-radius:10px;cursor:pointer;font:inherit;transition:filter .15s;}
#play:hover{filter:brightness(1.12);}
.srow{display:flex;flex-direction:column;gap:4px;}
.slabel{display:flex;justify-content:space-between;align-items:center;}
.sk{font-size:11.5px;color:var(--text2);}
.sv{font-size:11.5px;color:var(--text3);font-weight:600;}
input[type=range]{width:100%;height:4px;accent-color:var(--acc);cursor:pointer;border-radius:2px;}
.lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);
  font-size:11.5px;line-height:1;padding:3px 8px;border-radius:999px;white-space:nowrap;
  pointer-events:none;}
.lbl.b{color:#74c0fc;border-color:rgba(77,171,247,.4);}
.lbl.o{color:#ffa94d;border-color:rgba(255,169,77,.4);}
.lbl.r{color:#ff6b6b;border-color:rgba(255,107,107,.4);}
@media(max-width:900px){#stats{display:none;}}
@media(max-width:760px){
  #panel{width:calc(100vw - 36px);max-height:55vh;}
  #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>

<div id="title">
  <h1 data-zh="伯努利效应" data-en="Bernoulli Effect">伯努利效应</h1>
  <div class="sub" data-zh="流速加快压强降低——流管中能量守恒 · 文丘里管 · 皮托管 · 空格暂停/播放"
    data-en="Speed up, pressure drops — energy conservation along a streamtube · Venturi tube · Pitot tube · Space = pause/play">
    流速加快压强降低——流管中能量守恒</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="流速 v₁" data-en="Flow v₁">流速 v₁</span>
  <span class="v" id="stV1">8.0<small> m/s</small></span>
  <span class="k" data-zh="喉管 v₂" data-en="Throat v₂">喉管 v₂</span>
  <span class="v" id="stV2">20.0<small> m/s</small></span>
  <span class="k" data-zh="压差 ΔP" data-en="Press. drop ΔP">压差 ΔP</span>
  <span class="v" id="stDP">192<small> Pa</small></span>
  <span class="k" data-zh="体积流量 Q" data-en="Flow rate Q">体积流量 Q</span>
  <span class="v" id="stQ">0.008<small> m³/s</small></span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btn21" data-zh="2:1 收缩" data-en="2:1 constriction">2:1 收缩</button>
    <button class="abtn" id="btn41" data-zh="4:1 收缩" data-en="4:1 constriction">4:1 收缩</button>
    <button class="abtn" id="btnVenturi" data-zh="文丘里流量计" data-en="Venturi meter">文丘里流量计</button>
    <button class="abtn" id="btnPitot" data-zh="皮托管" data-en="Pitot tube">皮托管</button>
  </div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="暂停" data-en="Pause">暂停</button>
    <div class="srow">
      <div class="slabel">
        <span class="sk" data-zh="流速 (m/s)" data-en="Flow speed (m/s)">流速 (m/s)</span>
        <span class="sv" id="sSpeedVal">8</span>
      </div>
      <input type="range" id="sSpeed" min="1" max="20" value="8" step="0.5">
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
let LANG  = localStorage.getItem('htw-lang')  || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const RHO = 1.225; // air density kg/m3

/* ---- state ---- */
let playing = true;
let flowSpeed = 8;       // v1 inlet m/s (display units)
let ratioMode = 2.5;     // A1/A2 constriction ratio (2.5 default)
let showVenturi = false;
let showPitot   = false;
let labelsOn    = true;

/* derived */
function v2()    { return flowSpeed * ratioMode; }
function deltaP(){ return 0.5 * RHO * (v2()*v2() - flowSpeed*flowSpeed); }
function flowQ() {
  const A1 = 1.0 * 1.0; // normalized 1 m²
  return A1 / ratioMode * flowSpeed;
}

/* ---- renderer ---- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x080c10, 22, 60);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 5, 18);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 4; controls.maxDistance = 50;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xd4e8ff, 0x101820, 0.55));
const key = new THREE.DirectionalLight(0xfff4e0, 1.05);
key.position.set(6, 12, 8); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); scene.add(key);
const fill = new THREE.DirectionalLight(0x8ab0d8, 0.3);
fill.position.set(-8, 4, -6); scene.add(fill);

/* ---- materials ---- */
const groundM  = new THREE.MeshStandardMaterial({ color: 0x111820, roughness: 0.92 });
const wallHiM  = new THREE.MeshStandardMaterial({ color: 0xd4802a, roughness: 0.35, metalness: 0.25, transparent: true, opacity: 0.82 });
const wallLoM  = new THREE.MeshStandardMaterial({ color: 0x1a6daa, roughness: 0.35, metalness: 0.25, transparent: true, opacity: 0.82 });
const wallMidM = new THREE.MeshStandardMaterial({ color: 0x4a8fc0, roughness: 0.35, metalness: 0.25, transparent: true, opacity: 0.82 });
const throatM  = new THREE.MeshStandardMaterial({ color: 0x1455a0, roughness: 0.3,  metalness: 0.3,  transparent: true, opacity: 0.7 });
const glassM   = new THREE.MeshStandardMaterial({ color: 0x74b8e8, roughness: 0.05, metalness: 0.1,  transparent: true, opacity: 0.22 });
const manoBodyM= new THREE.MeshStandardMaterial({ color: 0x2a3a50, roughness: 0.6,  metalness: 0.4 });
const manoFillM= new THREE.MeshStandardMaterial({ color: 0x1c8aff, roughness: 0.3,  metalness: 0.1,  transparent: true, opacity: 0.82 });
const pitotM   = new THREE.MeshStandardMaterial({ color: 0xc0922a, roughness: 0.3,  metalness: 0.7 });
const arrowHiM = new THREE.MeshStandardMaterial({ color: 0xff6b35, emissive: 0xcc3300, emissiveIntensity: 0.6, roughness: 0.2 });
const arrowLoM = new THREE.MeshStandardMaterial({ color: 0x74c0fc, emissive: 0x1971c2, emissiveIntensity: 0.7, roughness: 0.2 });

/* ---- scene constants ---- */
const TUBE_LEN = 14;
const H_WIDE = 1.8;  // full height wide section
const H_THROAT = 0.7; // throat height (default 2.5:1)
const T_DEPTH = 1.2;  // tube depth
const T_WALL = 0.12;
const INLET_X  = -7.0;
const THROAT_X =  0.0;
const OUTLET_X =  7.0;
const TAPER_LEN = 2.0;
const GROUND_Y = -2.5;

/* ---- ground ---- */
const ground = new THREE.Mesh(new THREE.BoxGeometry(26, 0.22, 8), groundM);
ground.position.y = GROUND_Y - 0.11; ground.receiveShadow = true; scene.add(ground);

/* ---- build venturi tube walls as three sections ---- */
// Each section: top wall + bottom wall + front face (glass)
const tubeGroup = new THREE.Group();
scene.add(tubeGroup);

/* helper: make a rectangular section of tube (top + bottom wall) */
function makeTubeSection(x, len, h, mat) {
  const g = new THREE.Group();
  const topW  = new THREE.Mesh(new THREE.BoxGeometry(len, T_WALL, T_DEPTH), mat);
  topW.position.set(x,  h / 2 + T_WALL / 2, 0); topW.castShadow = true; g.add(topW);
  const botW  = new THREE.Mesh(new THREE.BoxGeometry(len, T_WALL, T_DEPTH), mat);
  botW.position.set(x, -h / 2 - T_WALL / 2, 0); botW.castShadow = true; g.add(botW);
  const frontF = new THREE.Mesh(new THREE.BoxGeometry(len, h, 0.06), glassM);
  frontF.position.set(x, 0, T_DEPTH / 2 + 0.03); g.add(frontF);
  const backF  = new THREE.Mesh(new THREE.BoxGeometry(len, h, 0.06), glassM);
  backF.position.set(x, 0, -T_DEPTH / 2 - 0.03); g.add(backF);
  return g;
}

/* ---- tube geometry ---- */
// We build the venturi as 5 sections: inlet, taper-in, throat, taper-out, outlet
const INLET_LEN  = 3.5;
const TAPER_SEGS = 14;
const THROAT_LEN = 2.0;
const OUTLET_LEN = 3.5;

// Mutable throat height driven by ratioMode
let hThroat = H_WIDE / ratioMode;

// Build taper walls (angled top/bottom wall connecting wide to throat)
function buildTaperMesh(x0, x1, h0, h1, mat) {
  const g = new THREE.Group();
  const len = Math.abs(x1 - x0);
  const cx  = (x0 + x1) / 2;
  // top taper
  const topG = new THREE.BufferGeometry();
  const topV = new Float32Array([
    x0, h0/2,           T_DEPTH/2,   x1, h1/2,           T_DEPTH/2,
    x1, h1/2,          -T_DEPTH/2,   x0, h0/2,          -T_DEPTH/2,
    x0, h0/2+T_WALL,    T_DEPTH/2,   x1, h1/2+T_WALL,    T_DEPTH/2,
    x1, h1/2+T_WALL,   -T_DEPTH/2,   x0, h0/2+T_WALL,   -T_DEPTH/2,
  ]);
  const topI = new Uint16Array([0,1,2,0,2,3,4,7,6,4,6,5,0,4,5,0,5,1,3,2,6,3,6,7]);
  topG.setAttribute('position', new THREE.BufferAttribute(topV, 3));
  topG.setIndex(new THREE.BufferAttribute(topI, 1));
  topG.computeVertexNormals();
  g.add(new THREE.Mesh(topG, mat));
  // bot taper (mirror)
  const botG = new THREE.BufferGeometry();
  const botV = new Float32Array([
    x0,-h0/2,           T_DEPTH/2,   x1,-h1/2,           T_DEPTH/2,
    x1,-h1/2,          -T_DEPTH/2,   x0,-h0/2,          -T_DEPTH/2,
    x0,-h0/2-T_WALL,    T_DEPTH/2,   x1,-h1/2-T_WALL,    T_DEPTH/2,
    x1,-h1/2-T_WALL,   -T_DEPTH/2,   x0,-h0/2-T_WALL,   -T_DEPTH/2,
  ]);
  botG.setAttribute('position', new THREE.BufferAttribute(botV, 3));
  botG.setIndex(new THREE.BufferAttribute(topI.slice(), 1));
  botG.computeVertexNormals();
  g.add(new THREE.Mesh(botG, mat));
  return g;
}

// inlet section
const inletG = makeTubeSection(-INLET_LEN/2 - TAPER_LEN - THROAT_LEN/2 - INLET_LEN/2,
  INLET_LEN, H_WIDE, wallHiM);
tubeGroup.add(inletG);

// We'll rebuild the throat/taper sections when ratio changes
let throatSections = new THREE.Group();
scene.add(throatSections);

function rebuildThroat() {
  while(throatSections.children.length) throatSections.remove(throatSections.children[0]);
  hThroat = H_WIDE / ratioMode;
  const x_inlet_end   = -(THROAT_LEN/2 + TAPER_LEN);
  const x_throat_start = -THROAT_LEN/2;
  const x_throat_end   =  THROAT_LEN/2;
  const x_outlet_start =  THROAT_LEN/2 + TAPER_LEN;

  // taper in
  const taperIn = buildTaperMesh(x_inlet_end, x_throat_start, H_WIDE, hThroat, wallMidM);
  throatSections.add(taperIn);
  // throat
  const thrSec = makeTubeSection(0, THROAT_LEN, hThroat, throatM);
  throatSections.add(thrSec);
  // taper out
  const taperOut = buildTaperMesh(x_throat_end, x_outlet_start, hThroat, H_WIDE, wallMidM);
  throatSections.add(taperOut);
  // outlet
  const outSec = makeTubeSection(x_outlet_start + OUTLET_LEN/2, OUTLET_LEN, H_WIDE, wallLoM);
  throatSections.add(outSec);
}
rebuildThroat();

// reposition inlet to match
inletG.position.x = -(THROAT_LEN/2 + TAPER_LEN + INLET_LEN/2);

/* ---- manometer tubes (3: inlet, throat, outlet) ---- */
const MANO_X = [-5.5, 0.0, 5.5];
const MANO_H_BODY = 3.5;
const MANO_R = 0.14;
const MANO_Y_BASE = H_WIDE / 2 + T_WALL;

const manoGroups = [];
const manoFills  = [];
for (let i = 0; i < 3; i++) {
  const g = new THREE.Group();
  // tube body (hollow approximation: outer cylinder)
  const outerCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(MANO_R + 0.03, MANO_R + 0.03, MANO_H_BODY, 12),
    new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.5, metalness: 0.4, transparent: true, opacity: 0.5 })
  );
  outerCyl.position.y = MANO_H_BODY / 2;
  g.add(outerCyl);
  // fill cylinder (height changes with pressure)
  const fillMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(MANO_R * 0.85, MANO_R * 0.85, 1.0, 10),
    manoFillM.clone()
  );
  fillMesh.position.y = 0.5;
  g.add(fillMesh);
  manoFills.push(fillMesh);
  // base connector
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.18, 0.22), manoBodyM);
  base.position.y = -0.09; g.add(base);
  g.position.set(MANO_X[i], MANO_Y_BASE, 0);
  scene.add(g);
  manoGroups.push(g);
}

function updateManometers() {
  const v1 = flowSpeed;
  const v2v = v2();
  const p1 = 1000;  // Pa baseline
  const p2 = p1 - 0.5 * RHO * (v2v * v2v - v1 * v1);
  const p3 = p1;    // pressure recovery
  const pMax = p1 + 100;
  const pressures = [p1, p2, p3];
  for (let i = 0; i < 3; i++) {
    const norm = clamp((pressures[i] - 600) / 600, 0.05, 1.0);
    const h = norm * MANO_H_BODY;
    manoFills[i].scale.y = h;
    manoFills[i].position.y = h / 2;
    // color: high pressure = warm amber, low = cool blue
    const t = norm;
    const r = Math.round(28 + (212 - 28) * t);
    const g2 = Math.round(109 + (168 - 109) * (1 - t));
    const b = Math.round(170 + (42 - 170) * t);
    manoFills[i].material.color.setRGB(r / 255, g2 / 255, b / 255);
  }
}

/* ---- pressure arrows on tube walls ---- */
function makeArrow(mat, len) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, len, 8), mat);
  shaft.position.y = -len / 2; g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.22, 8), mat);
  tip.position.y = -len - 0.11; g.add(tip);
  return g;
}
const pressArrowIn  = makeArrow(arrowHiM, 0.5); pressArrowIn.position.set(-5.5, H_WIDE / 2 + 0.6, 0.7);  scene.add(pressArrowIn);
const pressArrowTh  = makeArrow(arrowLoM, 0.18); pressArrowTh.position.set(0,   hThroat / 2 + 0.3, 0.7); scene.add(pressArrowTh);
const pressArrowOut = makeArrow(arrowHiM, 0.5); pressArrowOut.position.set(5.5, H_WIDE / 2 + 0.6, 0.7);  scene.add(pressArrowOut);

/* ---- velocity arrows (horizontal, inside tube) ---- */
function makeHArrow(mat, len) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, len, 8), mat);
  shaft.rotation.z = Math.PI / 2; shaft.position.x = len / 2; g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.2, 8), mat);
  tip.rotation.z = -Math.PI / 2; tip.position.x = len + 0.1; g.add(tip);
  return g;
}
const velArrowIn  = makeHArrow(arrowLoM, 0.6); velArrowIn.position.set(-6.2, 0, 0.7);  scene.add(velArrowIn);
const velArrowTh  = makeHArrow(arrowHiM, 1.1); velArrowTh.position.set(-0.8, 0, 0.7);  scene.add(velArrowTh);
const velArrowOut = makeHArrow(arrowLoM, 0.6); velArrowOut.position.set(4.8,  0, 0.7);  scene.add(velArrowOut);

/* ---- pitot tube (shown when showPitot) ---- */
const pitotGroup = new THREE.Group();
// horizontal probe pointing upstream
const pitotProbe = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.5, 8), pitotM);
pitotProbe.rotation.z = Math.PI / 2; pitotProbe.position.x = -1.25;
pitotGroup.add(pitotProbe);
// stagnation point sphere
const pitotTip = new THREE.Mesh(new THREE.SphereGeometry(0.10, 12, 10), new THREE.MeshStandardMaterial({ color: 0xff6b35, emissive: 0xcc3300, emissiveIntensity: 0.7, roughness: 0.2 }));
pitotTip.position.x = -2.5; pitotGroup.add(pitotTip);
// vertical pressure tube
const pitotVert = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.8, 8), pitotM);
pitotVert.position.y = 0.9; pitotGroup.add(pitotVert);
pitotGroup.position.set(3.5, 0.2, 0);
pitotGroup.visible = false;
scene.add(pitotGroup);

/* ---- particles (InstancedMesh) ---- */
const PARTICLE_COUNT = 200;
const pGeo = new THREE.SphereGeometry(0.06, 5, 5);
const pMat = new THREE.MeshBasicMaterial({ color: 0x74c0fc });
const particles = new THREE.InstancedMesh(pGeo, pMat, PARTICLE_COUNT);
particles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(particles);

// Particle state: each particle has an x position and a y lane
const pState = Array.from({ length: PARTICLE_COUNT }, (_, i) => {
  const lane = i % 10;      // 10 vertical lanes
  const yFrac = (lane / 9); // 0..1
  return {
    x: -7.5 + (i / PARTICLE_COUNT) * 15,
    yFrac: yFrac,
    phase: Math.random() * Math.PI * 2,
  };
});

const dummy = new THREE.Object3D();

// Map x position along tube to local half-height
function tubeHalfH(x) {
  const x0 = -(THROAT_LEN / 2 + TAPER_LEN); // taper start
  const x1 = -THROAT_LEN / 2;               // throat start
  const x2 =  THROAT_LEN / 2;               // throat end
  const x3 =  THROAT_LEN / 2 + TAPER_LEN;  // taper end
  const hW = H_WIDE / 2;
  const hT = hThroat / 2;
  if (x <= x0) return hW;
  if (x <= x1) { const t = (x - x0) / (x1 - x0); return hW + (hT - hW) * t; }
  if (x <= x2) return hT;
  if (x <= x3) { const t = (x - x2) / (x3 - x2); return hT + (hW - hT) * t; }
  return hW;
}

// Map x position to local flow speed factor (continuity: A1v1 = A2v2)
function localSpeedFactor(x) {
  const h = tubeHalfH(x);
  const hW = H_WIDE / 2;
  return (hW / h);  // width proportional, depth constant
}

function stepParticles(dt) {
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = pState[i];
    const spd = localSpeedFactor(p.x) * flowSpeed * 0.18;
    p.x += spd * dt;
    if (p.x > 7.8) p.x = -7.5 + Math.random() * 0.5;
    const hh = tubeHalfH(p.x);
    // distribute yFrac linearly within the current half-height
    const yPos = -hh + p.yFrac * hh * 2;
    const isThroat = Math.abs(p.x) < THROAT_LEN / 2;
    // color: fast = warm cyan-white, slow = blue
    const sf = localSpeedFactor(p.x);
    const r = Math.round(20 + 220 * Math.min(sf / ratioMode, 1));
    const g2 = Math.round(100 + 100 * Math.min(sf / ratioMode, 1));
    const b = 255;
    pMat.color.setRGB(r / 255, g2 / 255, b / 255);
    dummy.position.set(p.x, yPos, (Math.random() - 0.5) * T_DEPTH * 0.7);
    dummy.scale.setScalar(1.0);
    dummy.updateMatrix();
    particles.setMatrixAt(i, dummy.matrix);
  }
  particles.instanceMatrix.needsUpdate = true;
}

/* ---- CSS2D labels ---- */
const labelReg = [];
function addLabel(textFn, pos, cls, visFn) {
  if (visFn === undefined) visFn = () => true;
  const div = document.createElement('div');
  div.className = 'lbl ' + (cls || '');
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  labelReg.push({ o, text: textFn, vis: visFn });
  div.textContent = textFn();
  return o;
}

addLabel(() => L('入口 p₁ (高)', 'Inlet p₁ (high)'),      new THREE.Vector3(-5.5, 3.8, 0), 'o');
addLabel(() => L('喉管 p₂ (低)', 'Throat p₂ (low)'),      new THREE.Vector3( 0.0, 2.2, 0), 'b');
addLabel(() => L('出口 p₃ (恢复)', 'Outlet p₃ (recov.)'),  new THREE.Vector3( 5.5, 3.8, 0), 'o');
addLabel(() => L('v₁ 慢', 'v₁ slow'),  new THREE.Vector3(-6.5, 0.4, 0), '');
addLabel(() => L('v₂ 快', 'v₂ fast'),  new THREE.Vector3(-0.2, 0.05, 0), 'r');
const lblDP = addLabel(
  () => L(`ΔP = ${deltaP().toFixed(0)} Pa`, `ΔP = ${deltaP().toFixed(0)} Pa`),
  new THREE.Vector3(0, -1.8, 0), 'o'
);

/* ---- venturi annotation group (shown when showVenturi) ---- */
const venturiAnnotation = new THREE.Group();
// horizontal ΔP bracket line between inlet and throat manometer tops
const bPts = [
  new THREE.Vector3(-5.5, MANO_Y_BASE + MANO_H_BODY + 0.3, 0),
  new THREE.Vector3( 0.0, MANO_Y_BASE + MANO_H_BODY + 0.3, 0),
];
const bLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(bPts),
  new THREE.LineBasicMaterial({ color: 0xffa94d, transparent: true, opacity: 0.75 })
);
venturiAnnotation.add(bLine);
venturiAnnotation.visible = false;
scene.add(venturiAnnotation);

/* ---- update velocity arrow scales ---- */
function updateVelocityArrows() {
  const v1 = flowSpeed;
  const v2v = v2();
  // scale x of arrows proportional to speed
  velArrowIn.scale.x  = clamp(v1  / 8, 0.3, 3.0);
  velArrowTh.scale.x  = clamp(v2v / 8, 0.3, 4.0);
  velArrowOut.scale.x = clamp(v1  / 8, 0.3, 3.0);
  // update pressure arrow heights
  const p1 = 1000;
  const p2 = p1 - 0.5 * RHO * (v2v * v2v - v1 * v1);
  pressArrowIn.scale.y  = clamp(p1 / 800, 0.2, 2.5);
  pressArrowTh.scale.y  = clamp(Math.max(p2, 200) / 800, 0.1, 2.5);
  pressArrowOut.scale.y = clamp(p1 / 800, 0.2, 2.5);
  // reposition throat arrow since throat height changes
  pressArrowTh.position.y = hThroat / 2 + 0.25;
}

/* ---- stats display ---- */
function updateStats() {
  const v1 = flowSpeed;
  const v2v = v2();
  const dp  = deltaP();
  const q   = flowQ();
  document.getElementById('stV1').innerHTML = v1.toFixed(1) + '<small> m/s</small>';
  document.getElementById('stV2').innerHTML = v2v.toFixed(1) + '<small> m/s</small>';
  document.getElementById('stDP').innerHTML = dp.toFixed(0) + '<small> Pa</small>';
  document.getElementById('stQ').innerHTML  = q.toFixed(4) + '<small> m³/s</small>';
}

/* ---- formula display ---- */
function updateFormula() {
  const v1 = flowSpeed;
  const v2v = v2();
  const dp = deltaP();
  const q = flowQ();
  const dpPct = ((dp / 1000) * 100).toFixed(1);
  document.getElementById('formula').innerHTML =
    `<b>${L('连续性', 'Continuity')}:</b> A₁v₁ = A₂v₂ → v₂ = v₁ × (A₁/A₂) = ${v1.toFixed(1)} × ${ratioMode} = ${v2v.toFixed(1)} m/s<br>` +
    `<b>${L('伯努利', 'Bernoulli')}:</b> ΔP = ½ρ(v₂² − v₁²) = ½ × 1.225 × (${v2v.toFixed(1)}² − ${v1.toFixed(1)}²) = <b>${dp.toFixed(0)} Pa</b><br>` +
    `<b>${L('压降比', 'Drop ratio')}:</b> ΔP/P₁ ≈ ${dpPct}% &nbsp;|&nbsp; ` +
    `<b>Q</b> = A₂ × v₂ = ${q.toFixed(5)} m³/s`;
}

/* ---- steps ---- */
const STEPS = [
  { zh: '连续性：A₁v₁=A₂v₂，管道收窄流速倍增。面积比 2.5:1 时喉管流速是入口的 2.5 倍', en: 'Continuity: A₁v₁=A₂v₂ — narrower section, faster flow. At 2.5:1 area ratio, throat speed is 2.5× inlet' },
  { zh: '伯努利：沿流线 p+½ρv²=常数，速度增则压强降。总压（动压+静压）守恒', en: 'Bernoulli: p+½ρv²=const along streamline — speed up → pressure drops. Total pressure (dynamic + static) is conserved' },
  { zh: '喉管压降：ΔP=½ρ(v₂²-v₁²)，收缩比 2.5:1 时压降约为入口动压的 5.25 倍', en: 'Throat pressure drop: ΔP=½ρ(v₂²-v₁²); at 2.5:1 ratio, drop ≈ 5.25× inlet dynamic pressure' },
  { zh: '文丘里流量计：测两截面压差即可算体积流量 Q = A₂√(2ΔP/ρ(1-(A₂/A₁)²))', en: 'Venturi meter: measure ΔP → calculate volume flow rate Q = A₂√(2ΔP/ρ(1-(A₂/A₁)²))' },
  { zh: '皮托管：驻点总压−静压=½ρv²，由此反算飞行速度。驻点处 v=0，全部动压转为静压', en: 'Pitot tube: stagnation total pressure − static = ½ρv² → aircraft airspeed. At stagnation v=0, all dynamic → static' },
  { zh: '局限：粘性和湍流流体偏离理想伯努利方程；真实损失需用达西-魏斯巴赫公式修正', en: 'Limits: viscous and turbulent flows deviate from ideal Bernoulli; real losses need Darcy-Weisbach correction' },
];

function buildSteps() {
  const ol = document.getElementById('steps');
  ol.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    const txt = LANG === 'en' ? s.en : s.zh;
    const colon = LANG === 'en' ? ':' : '：';
    const parts = txt.split(colon);
    const bold = parts[0] || txt;
    const rest = parts.slice(1).join(colon);
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${bold}</b>${rest ? colon + rest : ''}</span>`;
    ol.appendChild(li);
  });
}

/* ---- button handlers ---- */
let activeBtn = null;
function setMode(btn, ratio, venturi, pitot) {
  ratioMode = ratio;
  showVenturi = venturi;
  showPitot = pitot;
  pitotGroup.visible = pitot;
  venturiAnnotation.visible = venturi;
  rebuildThroat();
  // reposition pressure arrow for new throat
  pressArrowTh.position.y = hThroat / 2 + 0.25;
  if (activeBtn) activeBtn.classList.remove('on');
  activeBtn = btn;
  btn.classList.add('on');
  updateStats();
  updateFormula();
}

document.getElementById('btn21').addEventListener('click', function() {
  setMode(this, 2.0, false, false);
});
document.getElementById('btn41').addEventListener('click', function() {
  setMode(this, 4.0, false, false);
});
document.getElementById('btnVenturi').addEventListener('click', function() {
  setMode(this, 2.5, !showVenturi, false);
  if (!showVenturi) venturiAnnotation.visible = false;
});
document.getElementById('btnPitot').addEventListener('click', function() {
  setMode(this, 2.5, false, !showPitot);
  if (!showPitot) pitotGroup.visible = false;
});

/* ---- speed slider ---- */
document.getElementById('sSpeed').addEventListener('input', function() {
  flowSpeed = parseFloat(this.value);
  document.getElementById('sSpeedVal').textContent = flowSpeed.toFixed(1);
  updateStats();
  updateFormula();
  updateManometers();
  updateVelocityArrows();
});

/* ---- play/pause ---- */
const elPlay = document.getElementById('play');
function setPlayLabel() {
  elPlay.textContent = LANG === 'zh' ? (playing ? '暂停' : '播放') : (playing ? 'Pause' : 'Play');
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });

/* ---- theme ---- */
function applyTheme() {
  htmlEl.setAttribute('data-theme', THEME);
  const isDark = THEME === 'dark';
  renderer.setClearColor(isDark ? 0x080c10 : 0xc8d8e8);
  scene.fog.color.setHex(isDark ? 0x080c10 : 0xc8d8e8);
  groundM.color.setHex(isDark ? 0x111820 : 0x9aafbe);
}

/* ---- lang ---- */
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = LANG === 'en' ? 'Bernoulli Effect · Speed up, pressure drops' : '伯努利效应 · 流速加快压强降低';
  buildSteps();
  setPlayLabel();
  updateFormula();
  for (const r of labelReg) r.o.element.textContent = r.text();
}

document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---- resize ---- */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

/* ---- main loop ---- */
const clock = new THREE.Clock();
let raf = null;
let accStats = 0;

function frame() {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05) * (playing ? 1 : 0);

  if (dt > 0) {
    stepParticles(dt);
    updateManometers();
    updateVelocityArrows();
  }

  accStats += dt;
  if (accStats > 0.12) {
    accStats = 0;
    updateStats();
    updateFormula();
    lblDP.element.textContent = lblDP.element.textContent; // force label refresh
    for (const r of labelReg) {
      r.o.visible = r.vis();
      if (r.o.visible) r.o.element.textContent = r.text();
    }
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop()  { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ---- init ---- */
applyTheme();
applyLang();
buildSteps();
updateStats();
updateFormula();
updateManometers();
updateVelocityArrows();
start();
</script>
