  <div class="sub" data-zh="赤道隆起被太阳和月亮多拉了一把,自转轴便像陀螺一样缓缓画锥——25772 年扫完一圈,北极星的宝座随之轮换:右枢→勾陈一→织女星;春分点同时被拽着沿黄道西移,回归年因此比恒星年短约 20 分钟;黄赤交角自身还在 22.1°-24.5° 间摆动,周期 41000 年 · 拖动旋转 / 空格运行/暂停" data-en="The equatorial bulge gets an extra tug from Sun and Moon, so the spin axis sweeps a slow cone like a top — one lap every 25,772 years and the pole-star throne rotates: Thuban → Polaris → Vega; the equinox is dragged westward along the ecliptic too, making the tropical year ~20 min shorter than the sidereal year; obliquity itself wobbles between 22.1° and 24.5° on a 41,000-year cycle · drag to orbit / Space = run/pause">赤道隆起被太阳和月亮多拉了一把,自转轴便像陀螺一样缓缓画锥——25772 年扫完一圈,北极星的宝座随之轮换:右枢→勾陈一→织女星;春分点同时被拽着沿黄道西移,回归年因此比恒星年短约 20 分钟;黄赤交角自身还在 22.1°-24.5° 间摆动,周期 41000 年 · 拖动旋转 / 空格运行/暂停</div>

[[0.9,0.4,0.16,0.5],[-2.2,-0.5,0.2,0.55],[2.8,0.1,0.13,0.6],[-0.9,0.75,0.11,0.7]].forEach(([lo,la,r,s])=>{

const STARS=[
 {ra:14.13,dec:64.38,col:0xffe2a8,cls:'y',zhS:'右枢',enS:'Thuban',
  zh:'右枢 · 公元前 2800 年的北极星',en:'Thuban · pole star of 2800 BC'},
 {ra:2.53,dec:89.35,col:0xfff6d8,cls:'g',zhS:'勾陈一',enS:'Polaris',
  zh:'勾陈一 · 现在的北极星',en:'Polaris · today\u2019s pole star'},
 {ra:18.62,dec:38.78,col:0xa8ccff,cls:'b',zhS:'织女星',enS:'Vega',
  zh:'织女星 · 公元 14000 年的北极星',en:'Vega · pole star of AD 14000'},
];
for(const s of STARS){
  s.dir=skyDir(s.ra,s.dec);
  s.mat=new THREE.MeshStandardMaterial({color:s.col,emissive:s.col,emissiveIntensity:0.18,roughness:0.4});
  s.mesh=new THREE.Mesh(new THREE.SphereGeometry(0.16,18,14),s.mat);
  s.mesh.position.copy(s.dir).multiplyScalar(SKY);earthG.add(s.mesh);
}
/* 远景星点(固定在场景里,不随地球平移) */
{
  const p=[];for(let i=0;i<300;i++){const u=Math.random()*2-1,fa=Math.random()*Math.PI*2,r=Math.sqrt(1-u*u);
    p.push(30*r*Math.cos(fa),30*u+2,30*r*Math.sin(fa));}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x9fb0c3,size:0.09,transparent:true,opacity:0.7})));
}

/* 状态 */
let mode='orbit',era=0,obliq=23.4,playing=true,labelsOn=true,slowMo=false,starsOn=true;
let simT=0;
const A=new THREE.Vector3(0,Math.sin(23.4393*DEG),Math.cos(23.4393*DEG));
const v1=new THREE.Vector3(),prevEp=new THREE.Vector3();
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function axisDir(){/* 场景系(Y=黄极)下的北天极方向:λ=90°-φ, β=90°-ε */
  const be=Math.PI/2-obliq*DEG,f=era/PREC*2*Math.PI;
  return v1.set(Math.cos(be)*Math.sin(f),Math.sin(be),Math.cos(be)*Math.cos(f));
}
function updateAxis(){A.copy(axisDir());axG.quaternion.setFromUnitVectors(UP,A);}
function rebuildCone(){
  const e=obliq*DEG,r=SKY*Math.sin(e),h=SKY*Math.cos(e);
  cone.position.y=h/2;cone.geometry.dispose();
  cone.geometry=new THREE.CylinderGeometry(0.001,r,h,64,1,true);
  const pts=[];for(let i=0;i<128;i++){const a=i/128*Math.PI*2;
    pts.push(new THREE.Vector3(r*Math.sin(a),h,r*Math.cos(a)));}
  rim.geometry.dispose();rim.geometry=new THREE.BufferGeometry().setFromPoints(pts);
  axDash.scale.y=h/SKY;
  updateTrace();
}
function updateTrace(){
  const e=obliq*DEG,r=SKY*Math.sin(e),h=SKY*Math.cos(e);
  const f0=ERAMIN/PREC*2*Math.PI,f1=era/PREC*2*Math.PI,n=128,arr=[];
  for(let i=0;i<=n;i++){const f=f0+(f1-f0)*i/n;arr.push(r*Math.sin(f),h,r*Math.cos(f));}
  trace.geometry.dispose();trace.geometry=new THREE.BufferGeometry().setFromPoints(
    arr.map((_,i)=>new THREE.Vector3(arr[i*3],arr[i*3+1],arr[i*3+2])));
}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblSun=addLabel(()=>L('太阳','Sun'),new THREE.Vector3(-1.15,0.55,0),'y');
const lblAxis=addLabel(()=>L('自转轴 → 北天极','Spin axis → NCP'),new THREE.Vector3(0,3.2,0),'o',()=>true,axG);
const lblBulge=addLabel(()=>L('赤道隆起 · 日月引力的抓手','Equatorial bulge · the Sun-Moon handle'),new THREE.Vector3(0.8,0,0),'g',()=>true,axG);
const lblCone=addLabel(()=>L('岁差锥 · 北天极 25772 年一圈','Precession cone · one lap in 25,772 yr'),new THREE.Vector3(-2.0,4.55,1.6),'o',()=>true,earthG);
const LBL_OFF=[[-0.15,-0.6,0],[0,0.5,0],[0,0.45,0]];
STARS.forEach((s,i)=>s.lbl=addLabel(()=>L(s.zh,s.en),new THREE.Vector3(...LBL_OFF[i]),s.cls,()=>starsOn,s.mesh));

function fmtEra(e){
  const y=2000+e;
  return LANG==='en'?(y>=0?`AD ${y}`:`${-y} BC`):(y>=0?`公元 ${y} 年`:`公元前 ${-y} 年`);
}
function setEra(v){era=clamp(Math.round(v/100)*100,ERAMIN,13000);
  const y=2000+era;
  document.getElementById('sEra').value=era;
  document.getElementById('sEraVal').textContent=
    LANG==='en'?(y>=0?`AD ${y}`:`${-y} BC`):(y>=0?`${y} 年`:`前 ${-y} 年`);
  updateAxis();updateTrace();updateStats();}
function setObl(v){obliq=clamp(v,22.1,24.5);
  document.getElementById('sObl').value=obliq;
  document.getElementById('sOblVal').textContent=obliq.toFixed(1)+'°';
  rebuildCone();updateStats();}
function setMode(m){mode=m;
  document.getElementById('bOrbit').classList.toggle('on',m==='orbit');
  document.getElementById('bCone').classList.toggle('on',m==='cone');
  if(m==='orbit'){camera.position.set(12.8,7.0,15.0);controls.target.set(0,3.3,0);}
  else{camera.position.copy(earthG.position).add(v1.set(9.5,4.2,13.0));
    controls.target.copy(earthG.position).add(new THREE.Vector3(0,2.8,0));}
  prevEp.copy(earthG.position);controls.update();}

const STEPS=[
 {zh:'<b>今天的北极星</b>:地轴斜 23.4°,北端直指勾陈一——但这把交椅只是暂时的租约',
  en:'<b>Today\u2019s pole star</b>: tipped 23.4°, the axis points at Polaris — a temporary tenant on the throne',
  act(){setMode('orbit');setEra(0);setObl(23.4);}},
 {zh:'<b>陀螺般的进动</b>:赤道隆起被日月多拉一把,轴像陀螺一样缓缓画锥,不倒也不回头',
  en:'<b>Gyroscopic precession</b>: the bulge feels an extra Sun-Moon tug — the axis sweeps a slow cone, like a top',
  act(){setMode('cone');setEra(-3000);}},
 {zh:'<b>25772 年一圈</b>:拖动年代滑块,轴尖沿岁差圆扫完一整圈,天极方向轮回一周',
  en:'<b>25,772 years per lap</b>: drag the epoch slider — the axis tip sweeps the full precession circle',
  act(){setEra(12772);}},
 {zh:'<b>北极星轮换</b>:右枢(前 2800)→勾陈一(今)→织女星(公元 14000),亮星轮流坐庄',
  en:'<b>Pole stars rotate</b>: Thuban (2800 BC) → Polaris (today) → Vega (AD 14000) take the throne in turn',
  act(){setMode('orbit');setEra(12000);}},
 {zh:'<b>回归年短 20 分钟</b>:春分点沿黄道西移,太阳迎头赶上少跑一段——每年短约 20 分钟',
  en:'<b>Tropical year −20 min</b>: the equinox drifts west, so the Sun meets it sooner — ~20 min shorter a year',
  act(){setEra(-6000);}},
 {zh:'<b>你的星座其实错了一位</b>:喜帕恰斯以来春分点已西移约 30°,报出的星座其实是前一位',
  en:'<b>Your sign is off by one</b>: since Hipparchus the equinox slid ~30° west — your zodiac sign actually sits one slot early',
  act(){setEra(-2130);setMode('orbit');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function poleStar(){/* 距北天极 6° 内的亮星即"北极星",否则为过渡期 */
  let best=null,ba=1e9;
  for(const s of STARS){const d=A.dot(s.dir),ang=Math.acos(clamp(d,-1,1));
    if(ang<ba){ba=ang;best=s;}}
  return ba<6*DEG?best:null;
}
function updateStats(){
  document.getElementById('stEra').textContent=fmtEra(era);
  const s=poleStar(),sv=document.getElementById('stStar');
  sv.textContent=s?L(s.zhS,s.enS):L('过渡期','Transition');
  sv.className='v '+(s?'ok':'warn');
  /* 轴指向的赤经(J2000 系);贴着极点时赤经退化,显示 — */
  const yeq=0.91748*A.z-0.39775*A.y,zeq=0.39775*A.z+0.91748*A.y;
  const dec=Math.asin(clamp(zeq,-1,1));
  if(dec>88*DEG)document.getElementById('stRa').textContent='—';
  else{const ra=(Math.atan2(yeq,A.x)/DEG+360)%360,hh=ra/15;
    document.getElementById('stRa').textContent=
      Math.floor(hh)+'h'+String(Math.floor(hh%1*60)).padStart(2,'0')+'m';}
  const dr=Math.abs(era/PREC*360),dv=document.getElementById('stDrift');
  dv.innerHTML=dr.toFixed(1)+'<small> °</small>';
  dv.className='v '+(dr<1?'ok':(dr>=30?'warn':''));
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bOrbit').addEventListener('click',()=>setMode('orbit'));
document.getElementById('bCone').addEventListener('click',()=>setMode('cone'));
document.getElementById('sEra').addEventListener('input',e=>setEra(+e.target.value));
document.getElementById('sObl').addEventListener('input',e=>setObl(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglStars').addEventListener('change',e=>{starsOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();setEra(era);setObl(obliq);
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const oa=simT*0.20+2.6;
  earthG.position.set(Math.cos(oa)*EOS,0,-Math.sin(oa)*EOS);
  spinG.rotation.y+=dts*1.3;
  /* 岁差圆锥特写:相机跟随地球平移,视向不变 */
  if(mode==='cone'){
    v1.copy(earthG.position).sub(prevEp);
    camera.position.add(v1);controls.target.add(v1);
  }
  prevEp.copy(earthG.position);
  /* 亮星:北天极进入 6° 内点亮 */
  const litTh=Math.cos(6*DEG);
  for(const s of STARS){
    const lit=A.dot(s.dir)>litTh;
    s.mat.emissiveIntensity+=((lit?1.6:0.18)-s.mat.emissiveIntensity)*Math.min(1,dt*6);
    s.mesh.scale.setScalar(lit?1.3:1);
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();rebuildCone();updateAxis();setEra(0);setObl(23.4);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
