<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勒夏特列原理 · 平衡移动 3D 动画</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #10141b;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: rgba(12,16,23,.78); border: 1px solid rgba(255,255,255,.16);
    color: #e6ecf3; font-size: 12px; line-height: 1.3; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.no2 { border-color: rgba(224,90,43,.9);  color: #ffc4a8; }
  .lbl.n2o4 { border-color: rgba(200,210,225,.7); color: #e8edf4; }
  .lbl.piston { border-color: rgba(148,163,184,.8); }
  .lbl.heat { border-color: rgba(255,120,80,.8); color: #ffc9b3; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; }
  #title h1 { font-size: 20px; font-weight: 700; color: #f2f5f9; letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: #9fb0c3; margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 400px;
    max-height: calc(100vh - 120px); overflow: auto;
    background: rgba(13,17,24,.86); border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px; padding: 13px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #legend { display: flex; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.no2  { color: #ffc4a8; border-color: rgba(224,90,43,.7); }
  .chip.n2o4 { color: #e8edf4; border-color: rgba(200,210,225,.45); }
  .chip.dim  { color: #b9c4d0; border-color: rgba(255,255,255,.22); }

  #stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px 10px; margin-bottom: 9px; }
  #stats .cell { font-size: 11.5px; color: #9fb0c3; }
  #stats .cell b { display: block; font-size: 14px; color: #f2f5f9; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  #stats .cell b small { font-size: 10px; color: #8a97a8; font-weight: 400; }

  .rateRow { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .rateRow label { flex: 0 0 78px; font-size: 11.5px; color: #9fb0c3; }
  .rateBarWrap { flex: 1; height: 10px; background: rgba(255,255,255,.07); border-radius: 5px; overflow: hidden; }
  .rateBar { height: 100%; border-radius: 5px; transition: width .18s linear; }
  #barF { background: #e05a2b; }
  #barR { background: #4f8fd9; }
  .rateRow .v { flex: 0 0 52px; font-size: 11px; color: #c7d2de; text-align: right;
    font-variant-numeric: tabular-nums; }
  #net { font-size: 12px; color: #ffd9a3; margin: 5px 0 2px; min-height: 16px; }

  #btns { display: flex; gap: 7px; flex-wrap: wrap; margin: 9px 0 4px; }
  #btns button { font-size: 12.5px; padding: 7px 12px; border-radius: 9px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #e6ecf3; }
  #btns button:hover { background: rgba(255,255,255,.13); }
  #btns button.hot  { border-color: rgba(224,90,43,.75); color: #ffc4a8; }
  #btns button.cold { border-color: rgba(79,143,217,.75); color: #b9d7f5; }
  #btns button.press{ border-color: rgba(148,163,184,.7); }
  #btns button.add  { border-color: rgba(224,90,43,.55); color: #ffb9a8; }
  #btns button.reset{ border-color: rgba(255,255,255,.14); color: #9fb0c3; }

  #log { font-size: 12px; color: #ffd9a3; background: rgba(224,90,43,.08);
    border: 1px solid rgba(224,90,43,.3); border-radius: 9px; padding: 6px 9px;
    margin: 6px 0 2px; min-height: 30px; line-height: 1.45; }

  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 5px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: rgba(255,255,255,.05); }
  #steps li.on { background: rgba(217,131,36,.12); border-color: rgba(217,131,36,.5); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: #dfe6ee; }
  #steps li.on .n { background: #d98324; color: #fff; }
  #steps .t { font-size: 12.5px; color: #c7d2de; line-height: 1.45; }
  #steps .t b { color: #f2f5f9; font-size: 12.5px; }
  #steps li.on .t b { color: #ffe3bd; }

  #ctrl { display: flex; gap: 14px; align-items: center; margin-top: 9px; padding-top: 9px;
    border-top: 1px solid rgba(255,255,255,.08); }
  #play { padding: 8px 14px; font-size: 13.5px; background: #d98324; color: #fff; border: 0;
    border-radius: 10px; cursor: pointer; }
  #play:hover { background: #e79338; }
  .row { display: flex; align-items: center; gap: 8px; flex: 1; }
  .row label { font-size: 12px; color: #9fb0c3; flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: #c7d2de; flex: 0 0 38px; text-align: right; }

  @media (max-width: 760px) { #panel { width: calc(100vw - 36px); } #title h1 { font-size: 16px; } }

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1>平衡被打破之后会发生什么？—— 勒夏特列原理</h1>
  <div class="sub">可交互粒子模拟 · N₂O₄(无色) ⇌ 2NO₂(红棕) · 正逆反应一直在进行，扰动只会被削弱、不会被消除</div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip no2">NO₂ 红棕色</span>
    <span class="chip n2o4">N₂O₄ 无色</span>
    <span class="chip dim">N₂O₄ ⇌ 2NO₂ · 正向（分解）吸热 ΔH &gt; 0</span>
  </div>

  <div id="stats">
    <div class="cell">温度<b id="stT">350<small> K</small></b></div>
    <div class="cell">体积<b id="stV">100<small> %</small></b></div>
    <div class="cell">n(NO₂) / n(N₂O₄)<b id="stN">18 / 6</b></div>
    <div class="cell">Q = [NO₂]²/[N₂O₄]<b id="stQ">54.0</b></div>
    <div class="cell">K（只随温度变）<b id="stK">54.0</b></div>
    <div class="cell">Q / K<b id="stQK">1.00</b></div>
  </div>

  <div class="rateRow"><label>v正 (分解)</label><div class="rateBarWrap"><div class="rateBar" id="barF" style="width:30%"></div></div><span class="v" id="vF">0.54/s</span></div>
  <div class="rateRow"><label>v逆 (化合)</label><div class="rateBarWrap"><div class="rateBar" id="barR" style="width:30%"></div></div><span class="v" id="vR">0.54/s</span></div>
  <div id="net"></div>

  <div id="btns">
    <button class="hot" id="bHot">🔥 升温</button>
    <button class="cold" id="bCold">❄️ 降温</button>
    <button class="press" id="bPress">⇤ 压缩</button>
    <button class="press" id="bExpand">⇥ 膨胀</button>
    <button class="add" id="bAdd">＋ 加入 NO₂</button>
    <button class="reset" id="bReset">复位</button>
  </div>
  <div id="log">试试点一个扰动按钮，观察正 / 逆速率如何分道扬镳，再把系统推向新的平衡。</div>

  <ol id="steps"></ol>

  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label>速度</label><input id="speed" type="range" min="0.1" max="4" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">

    <label><input id="tglRotate" type="checkbox"> 自动环绕</label>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 场景基础 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141b);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 2.4, 7.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.1, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.7;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(3, 6, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-4, 2, -4);
scene.add(fill);

/* ---------------- 容器几何 ---------------- */
// 内部空间：x ∈ [-2.4, P]，y ∈ [-1.05, 1.05]，z ∈ [-0.65, 0.65]；P 在 0.95 ~ 2.4 之间
const X_MIN = -2.4, P_MAX = 2.4, P_MIN = 0.95, Y_HALF = 1.05, Z_HALF = 0.65;
let P = P_MAX, Ptarget = P_MAX;
const Vrel = () => (P - X_MIN) / (P_MAX - X_MIN);

const glass = new THREE.MeshPhysicalMaterial({ color: 0xaebfd0, transparent: true, opacity: 0.09,
  roughness: 0.15, metalness: 0, depthWrite: false });
const WALL_LEN = (P_MAX - X_MIN) + 0.28;
const walls = [];
function wall(w, h, d, pos) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glass);
  m.position.set(...pos); m.renderOrder = 4; scene.add(m); walls.push(m); return m;
}
wall(0.04, Y_HALF * 2 + 0.16, Z_HALF * 2 + 0.16, [X_MIN - 0.06, 0, 0]);           // 左壁
wall(WALL_LEN, 0.04, Z_HALF * 2 + 0.16, [(X_MIN + P_MAX) / 2, Y_HALF + 0.06, 0]);  // 顶
wall(WALL_LEN, 0.04, Z_HALF * 2 + 0.16, [(X_MIN + P_MAX) / 2, -Y_HALF - 0.06, 0]); // 底
wall(WALL_LEN, Y_HALF * 2 + 0.16, 0.04, [(X_MIN + P_MAX) / 2, 0, -Z_HALF - 0.06]); // 后壁
// 边框
{
  const frameM = new THREE.MeshStandardMaterial({ color: 0x5b6470, metalness: 0.7, roughness: 0.4 });
  const mk = (w, h, d, pos) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameM); m.position.set(...pos); scene.add(m); };
  mk(0.06, Y_HALF * 2 + 0.16, Z_HALF * 2 + 0.16, [X_MIN - 0.06, 0, 0]);
  mk(0.06, 0.06, Z_HALF * 2 + 0.16, [X_MIN - 0.06, Y_HALF + 0.1, 0]);
  mk(0.06, 0.06, Z_HALF * 2 + 0.16, [X_MIN - 0.06, -Y_HALF - 0.1, 0]);
}
// 活塞
const piston = new THREE.Group(); scene.add(piston);
{
  const face = new THREE.Mesh(new THREE.BoxGeometry(0.26, Y_HALF * 2 + 0.12, Z_HALF * 2 + 0.12),
    new THREE.MeshStandardMaterial({ color: 0x8b95a3, metalness: 0.85, roughness: 0.35 }));
  face.position.x = 0.13; face.castShadow = true;
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.6, 14),
    new THREE.MeshStandardMaterial({ color: 0x9aa4b2, metalness: 0.9, roughness: 0.3 }));
  rod.rotation.z = Math.PI / 2; rod.position.x = 1.05;
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.14, 18, 14),
    new THREE.MeshStandardMaterial({ color: 0x6b7684, metalness: 0.85, roughness: 0.35 }));
  knob.position.x = 1.85;
  piston.add(face, rod, knob);
}
// 加热 / 冷却板
const heater = new THREE.Mesh(new THREE.BoxGeometry((P_MAX - X_MIN) + 0.4, 0.09, Z_HALF * 2 + 0.3),
  new THREE.MeshStandardMaterial({ color: 0x3a4149, metalness: 0.5, roughness: 0.6,
    emissive: 0xff5522, emissiveIntensity: 0 }));
heater.position.set((X_MIN + P_MAX) / 2, -Y_HALF - 0.18, 0);
scene.add(heater);
// 底座
{
  const base = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.16, 2.6),
    new THREE.MeshStandardMaterial({ color: 0x252b34, metalness: 0.2, roughness: 0.8 }));
  base.position.set(0.6, -Y_HALF - 0.32, 0);
  scene.add(base);
}
// 红棕色"气体"色调：随 [NO₂] 加深的半透明内盒
const tint = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshBasicMaterial({ color: 0x8f3d14, transparent: true, opacity: 0.16, depthWrite: false }));
tint.renderOrder = 2;
scene.add(tint);

/* ---------------- 分子 ---------------- */
const NO2_COLOR = 0xb34a1a, N2O4_COLOR = 0xc9ced9;
const matNO2 = new THREE.MeshStandardMaterial({ color: NO2_COLOR, roughness: 0.5,
  emissive: NO2_COLOR, emissiveIntensity: 0.3 });
const matN2O4 = new THREE.MeshStandardMaterial({ color: N2O4_COLOR, roughness: 0.5,
  emissive: N2O4_COLOR, emissiveIntensity: 0.12, transparent: true, opacity: 0.92 });

const molecules = [];   // { grp, type, vel:Vector3, spin:Vector3, anim:null }
function makeNO2() {
  const grp = new THREE.Group();
  const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.075, 18, 14), matNO2);
  s1.position.x = 0.06;
  const s2 = s1.clone(); s2.position.x = -0.06;
  grp.add(s1, s2);
  grp.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
  scene.add(grp);
  return { grp, type: 'NO2', vel: new THREE.Vector3(), spin: new THREE.Vector3((Math.random() - .5) * 2, (Math.random() - .5) * 2, 0), anim: null };
}
function makeN2O4() {
  const grp = new THREE.Group();
  const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.098, 18, 14), matN2O4);
  s1.position.x = 0.09;
  const s2 = s1.clone(); s2.position.x = -0.09;
  grp.add(s1, s2);
  grp.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
  scene.add(grp);
  return { grp, type: 'N2O4', vel: new THREE.Vector3(), spin: new THREE.Vector3((Math.random() - .5) * 1.4, (Math.random() - .5) * 1.4, 0), anim: null };
}
function removeMol(m) { scene.remove(m.grp); m.grp.traverse(o => o.geometry?.dispose()); const i = molecules.indexOf(m); if (i >= 0) molecules.splice(i, 1); }
const count = t => molecules.filter(m => m.type === t && !m.anim).length;

// 初始：18 NO₂ + 6 N₂O₄（Q = 18²/6 = 54 = K，恰处平衡）
const randPos = () => new THREE.Vector3(X_MIN + 0.4 + Math.random() * (P_MAX - X_MIN - 0.8),
  (Math.random() * 2 - 1) * (Y_HALF - 0.25), (Math.random() * 2 - 1) * (Z_HALF - 0.2));
for (let i = 0; i < 18; i++) { const m = makeNO2(); m.grp.position.copy(randPos()); molecules.push(m); }
for (let i = 0; i < 6; i++)  { const m = makeN2O4(); m.grp.position.copy(randPos()); molecules.push(m); }

/* ---------------- 动力学模型 ----------------
   N₂O₄ ⇌ 2NO₂，正向（分解）吸热。
   事件概率 ∝ 速率 × dt：v正 = kf·n(N₂O₄)，v逆 = kr·[NO₂]²·V
   平衡时 kf·n(N₂O₄) = kr·n(NO₂)²/V，即 [NO₂]²/[N₂O₄] = kf/kr = K(T)
   kf 的温度指数比 kr 大 2000K（ΔH/R ≈ 2000）→ 升温 K 增大，K 只随温度变 */
let T = 350, Ttarget = 350;
const kf = () => 0.162 * Math.exp(-1000 * (1 / T - 1 / 350));   // 分解（吸热方向）
const kr = () => 3.0e-3 * Math.exp(1000 * (1 / T - 1 / 350));   // 化合
// 350K: K=54；500K: K≈300；250K: K≈5.5（van't Hoff：ΔH/R = 2000K）

/* ---------------- 反应事件（一次只演一个，保持可读） ---------------- */
let eventCooldown = 0.8;
function startSplit() {   // N₂O₄ → 2NO₂
  const cands = molecules.filter(m => m.type === 'N2O4' && !m.anim);
  if (!cands.length) return false;
  const m = cands[Math.floor(Math.random() * cands.length)];
  const axis = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
  m.anim = { kind: 'split', t: 0, dur: 0.3, axis };
  return true;
}
function startCombine() {  // 2NO₂ → N₂O₄
  const cands = molecules.filter(m => m.type === 'NO2' && !m.anim);
  if (cands.length < 2) return false;
  const a = cands[Math.floor(Math.random() * cands.length)];
  let best = null, bd = 1e9;
  for (const b of cands) {
    if (b === a) continue;
    const d = a.grp.position.distanceTo(b.grp.position);
    if (d < bd) { bd = d; best = b; }
  }
  a.anim = { kind: 'combine', t: 0, dur: 0.28, other: best, mid: a.grp.position.clone().lerp(best.grp.position, 0.5) };
  best.anim = { kind: 'combineSlave', t: 0, dur: 0.28, master: a, mid: a.anim.mid };
  return true;
}
function finishEvent(ev) {
  if (ev.kind === 'split') {
    const p = ev.mol.grp.position, ax = ev.axis;
    removeMol(ev.mol);
    for (const s of [-1, 1]) {
      const m = makeNO2();
      m.grp.position.copy(p).addScaledVector(ax, s * 0.18);
      m.vel.copy(ax).multiplyScalar(s * 0.9);
      molecules.push(m);
    }
  } else if (ev.kind === 'combine') {
    const v = ev.mol.vel.clone().add(ev.other.vel).multiplyScalar(0.5);
    removeMol(ev.mol); removeMol(ev.other);
    const m = makeN2O4();
    m.grp.position.copy(ev.mid); m.vel.copy(v);
    molecules.push(m);
  }
}

/* ---------------- 步骤讲解（随模拟状态自动点亮） ---------------- */
const STEPS = [
  { b: '平衡态', d: 'v正 = v逆：N₂O₄ 分解与 NO₂ 化合一样快，浓度不再改变——但反应从未停止，是动态平衡。' },
  { b: '施加扰动', d: '升温、压缩体积、或直接加入 NO₂，都会打破 v正 = v逆。' },
  { b: '系统响应', d: '速率出现差值，平衡向「能削弱这种改变」的方向移动：升温→吸热方向；压缩→分子数减少的方向；加 NO₂→消耗 NO₂ 的方向。' },
  { b: '新平衡', d: 'v正 = v逆 重新成立，浓度维持在新水平。扰动被削弱了，但没有被完全消除。' },
];
const elSteps = document.getElementById('steps');
STEPS.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${s.b}</b>　${s.d}</span>`;
  elSteps.appendChild(li);
});

/* ---------------- 标签 ---------------- */
const labelObjs = [];
function addLabel(html, cls = '') {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.innerHTML = html;
  const o = new CSS2DObject(div);
  scene.add(o); labelObjs.push(o);
  return o;
}
const lblNO2  = addLabel('NO₂（红棕）', 'no2');
const lblN2O4 = addLabel('N₂O₄（无色）', 'n2o4');
const lblPiston = addLabel('活塞（压缩 / 膨胀）', 'piston'); lblPiston.position.set(P_MAX + 1.1, 1.35, 0);
const lblHeat = addLabel('加热 / 冷却板', 'heat'); lblHeat.position.set(-0.2, -Y_HALF - 0.42, 0.2);
const lblEq = addLabel('N₂O₄ ⇌ 2NO₂', ''); lblEq.position.set(0, Y_HALF + 0.42, 0);

/* ---------------- 扰动按钮 ---------------- */
const elLog = document.getElementById('log');
function disturb(msg) { elLog.textContent = msg; lastDisturb = simTime; }
document.getElementById('bHot').onclick = () => { Ttarget = 500; disturb('升温 → 平衡向吸热方向（分解出 NO₂）移动，颜色应变深。注意 K 只随温度改变。'); };
document.getElementById('bCold').onclick = () => { Ttarget = 250; disturb('降温 → 平衡向放热方向（化合成 N₂O₄）移动，颜色变浅。'); };
document.getElementById('bPress').onclick = () => { Ptarget = P_MIN; disturb('压缩 → 浓度骤增，Q > K，平衡向分子数少的一侧（N₂O₄）移动，总分子数下降以缓解压强。'); };
document.getElementById('bExpand').onclick = () => { Ptarget = P_MAX; disturb('膨胀 → Q < K，平衡向分子数多的一侧（2NO₂）移动。'); };
document.getElementById('bAdd').onclick = () => {
  for (let i = 0; i < 8; i++) {
    const m = makeNO2();
    m.grp.position.set(X_MIN + 0.25, (Math.random() * 2 - 1) * 0.6, (Math.random() * 2 - 1) * 0.35);
    m.vel.set(1.0 + Math.random() * 0.6, (Math.random() - .5) * 0.3, (Math.random() - .5) * 0.3);
    molecules.push(m);
  }
  disturb('加入 NO₂ → Q 瞬间大于 K，平衡逆向移动，把加入的一部分 NO₂ 消耗掉。');
};
document.getElementById('bReset').onclick = () => { Ttarget = 350; Ptarget = P_MAX; disturb('复位：回到 350 K、初始体积。'); };

/* ---------------- UI ---------------- */
let playing = !qsBool('pause', false);
let speed = qsFloat('speed', 1);
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
elPlay.textContent = playing ? '暂停' : '播放';
elPlay.onclick = () => { playing = !playing; elPlay.textContent = playing ? '暂停' : '播放'; };
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.oninput = () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; };
tglLabels.onchange = () => { for (const o of labelObjs) o.element.style.display = tglLabels.checked ? '' : 'none'; };
tglRotate.onchange = () => { controls.autoRotate = tglRotate.checked; };
controls.autoRotate = qsBool('spin', false);
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }

addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 每帧模拟 ---------------- */
const stT = document.getElementById('stT'), stV = document.getElementById('stV'),
      stN = document.getElementById('stN'), stQ = document.getElementById('stQ'),
      stK = document.getElementById('stK'), stQK = document.getElementById('stQK'),
      barF = document.getElementById('barF'), barR = document.getElementById('barR'),
      vF = document.getElementById('vF'), vR = document.getElementById('vR'),
      elNet = document.getElementById('net');
let simTime = 0, lastDisturb = -100, settledSince = 0, lastStep = -1;
const tmpV = new THREE.Vector3();

function stepSimulation(dt) {
  simTime += dt;

  // 温度 / 活塞趋近目标
  T += (Ttarget - T) * (1 - Math.exp(-dt / 0.8));
  P += (Ptarget - P) * (1 - Math.exp(-dt / 0.6));

  // 事件调度：概率 ∝ 速率 × dt（平衡态有涨落，但速率随浓度自我修正，统计上稳定在 K 附近）
  eventCooldown -= dt;
  const n2 = count('NO2'), n4 = count('N2O4'), V = Vrel();
  if (eventCooldown <= 0) {
    const rf = kf() * n4 * dt, rr = kr() * n2 * n2 / V * dt;
    if (rf + rr > 0 && Math.random() < rf + rr) {
      const ok = Math.random() < rf / (rf + rr) ? startSplit() : startCombine();
      if (ok) eventCooldown = 0.42;   // 事件间隔下限，保证可读
    }
  }
  // 活动事件推进
  for (const m of [...molecules]) {
    if (!m.anim) continue;
    const ev = m.anim;
    if (ev.kind === 'combineSlave') continue;
    ev.t += dt;
    const k = Math.min(ev.t / ev.dur, 1);
    if (ev.kind === 'split') {
      m.grp.scale.setScalar(1 - 0.45 * k);
      if (k >= 1) { m.anim = null; finishEvent({ kind: 'split', mol: m, axis: ev.axis }); }
    } else if (ev.kind === 'combine') {
      ev.other.grp.position.lerp(ev.mid, Math.min(dt * 10, 1));
      m.grp.position.lerp(ev.mid, Math.min(dt * 10, 1));
      if (k >= 1) {
        ev.other.anim = null;
        m.anim = null;
        finishEvent({ kind: 'combine', mol: m, other: ev.other, mid: ev.mid });
      }
    }
  }

  // 分子运动
  const spd = 0.62 * Math.sqrt(T / 350);
  for (const m of molecules) {
    if (m.anim) continue;
    if (m.vel.lengthSq() < 1e-6) m.vel.set(Math.random() - .5, Math.random() - .5, Math.random() - .5);
    m.vel.setLength(spd * (m.type === 'N2O4' ? 0.85 : 1));
    m.grp.position.addScaledVector(m.vel, dt);
    m.grp.rotation.x += m.spin.x * dt; m.grp.rotation.y += m.spin.y * dt;
    // 反弹
    const mg = m.type === 'N2O4' ? 0.18 : 0.14;
    const p = m.grp.position, v = m.vel;
    if (p.x < X_MIN + mg) { p.x = X_MIN + mg; v.x = Math.abs(v.x); }
    if (p.x > P - mg)     { p.x = P - mg;     v.x = -Math.abs(v.x); }
    if (p.y < -Y_HALF + mg) { p.y = -Y_HALF + mg; v.y = Math.abs(v.y); }
    if (p.y > Y_HALF - mg)  { p.y = Y_HALF - mg;  v.y = -Math.abs(v.y); }
    if (p.z < -Z_HALF + mg) { p.z = -Z_HALF + mg; v.z = Math.abs(v.z); }
    if (p.z > Z_HALF - mg)  { p.z = Z_HALF - mg;  v.z = -Math.abs(v.z); }
  }

  // 加热板发光
  const heat = clamp((Ttarget - T) / 80, -1, 1);
  heater.material.emissiveIntensity = Math.abs(heat) * 1.4;
  heater.material.emissive.setHex(heat >= 0 ? 0xff5522 : 0x3388ff);

  return { n2, n4 };
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

function updateUI(n2, n4) {
  const V = Vrel();
  const vfv = kf() * n4, vrv = kr() * n2 * n2 / V;
  const K = kf() / kr();
  const Q = n4 > 0 ? n2 * n2 / (n4 * V) : Infinity;
  stT.innerHTML = Math.round(T) + '<small> K</small>';
  stV.innerHTML = Math.round(V * 100) + '<small> %</small>';
  stN.textContent = n2 + ' / ' + n4;
  stQ.textContent = Q.toFixed(1);
  stK.textContent = K.toFixed(1);
  stQK.textContent = (Q / K).toFixed(2);
  const vmax = Math.max(vfv, vrv, 0.15);
  barF.style.width = (vfv / vmax * 100).toFixed(1) + '%';
  barR.style.width = (vrv / vmax * 100).toFixed(1) + '%';
  vF.textContent = vfv.toFixed(2) + '/s';
  vR.textContent = vrv.toFixed(2) + '/s';
  const diff = vfv - vrv;
  elNet.textContent = Math.abs(diff) < 0.02 ? '⚖️ v正 ≈ v逆 — 处于平衡'
    : diff > 0 ? '▶ 净向正方向（分解），NO₂ 增多、颜色变深'
    : '◀ 净向逆方向（化合），N₂O₄ 增多、颜色变浅';

  // 气体颜色
  tint.material.opacity = clamp(0.05 + (n2 / V) * 0.013, 0, 0.5);
  tint.scale.set(P - X_MIN - 0.06, Y_HALF * 2 - 0.06, Z_HALF * 2 - 0.06);
  tint.position.set((X_MIN + P) / 2, 0, 0);
  // 顶 / 底 / 后壁跟随活塞
  for (const w of walls) {
    w.scale.x = (P - X_MIN + 0.28) / WALL_LEN;
    w.position.x = (X_MIN + P) / 2;
  }

  // 步骤自动点亮
  const settled = Math.abs(diff) < 0.02;
  if (settled) settledSince += 1 / 60; else settledSince = 0;
  let si;
  if (simTime - lastDisturb < 2.2) si = 1;
  else if (!settled) si = 2;
  else if (settledSince < 9 && lastDisturb > 0) si = 3;
  else si = 0;
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }

  // 标签跟随
  const firstNO2 = molecules.find(m => m.type === 'NO2' && !m.anim);
  const firstN4 = molecules.find(m => m.type === 'N2O4' && !m.anim);
  lblNO2.visible = !!firstNO2; if (firstNO2) lblNO2.position.copy(firstNO2.grp.position).add(tmpV.set(0, 0.24, 0));
  lblN2O4.visible = !!firstN4; if (firstN4) lblN2O4.position.copy(firstN4.grp.position).add(tmpV.set(0, 0.26, 0));
  lblPiston.position.x = P + 1.05;
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const rawDt = Math.min(clock.getDelta(), 0.05);
  const dt = playing ? rawDt * speed : 0;
  piston.position.x = P;
  const { n2, n4 } = stepSimulation(dt);
  updateUI(n2, n4);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
