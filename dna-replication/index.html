{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= URL 参数 / 工具 ================= */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mod = (a, n) => ((a % n) + n) % n;

/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const BG_COL = new THREE.Color(0x10141b);

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  BG_COL.set(PAL.bg);
  scene.background = BG_COL.clone();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('DNA 的原理 · 半保留复制与冈崎片段动画',
                     'DNA Replication · Semi-conservative & Okazaki Fragments');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 渲染器 / 场景 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.35, 0.85, 10.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.45, 0.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 18;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ================= 材质 ================= */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const M = {
  par:   mat(0x9aa7b8),
  green: mat(0x43d17c, { emissiveIntensity: 0.22 }),
  rna:   mat(0xff9f43, { emissiveIntensity: 0.3 }),
  ssb:   mat(0x96a3b6, { opacity: 0.62 }),
  pair:  mat(0x43d17c, { opacity: 0.38, emissiveIntensity: 0.05 }),
  feed:  mat(0x67e29a, { emissiveIntensity: 0.5 }),
  pulse: mat(0xd9ffe9, { emissiveIntensity: 0.7 }),
};

/* ================= 常量：复制叉工厂时序（世界单位，1 单位 = 原稿 300px） ================= */
const R = 0.36;                    // 双螺旋半径
const YT = 1.02;                   // 上/下模板直线段 |y|
const BEND = 0.42;                 // 叉口弯弧的横向长度
const D = 2.4;                     // 右侧母链双螺旋长度
const S = 3.6;                     // 模板路径总长（叉口 → 左侧出口）
const V = 1.4;                     // 母链流速（单位/周期，= 原 P 420px）
const P = 1.4;                     // 相邻冈崎片段间距
const S_RNA = 0.14;                // RNA 引物长度
const S_PRIM = 0.267;              // 引物 5' 端诞生点距叉口
const S_GROW0 = 0.547;             // 延伸起点距叉口
const GROW_V = 5.333;              // 延伸速度（单位/周期，远离叉口）
const S_LEAD = 0.42;               // 前导链聚合酶位置（距叉口）
const X_MAX = 3.55;                // 舞台左边界
const TW = Math.PI * 2 / 1.7;     // 螺旋角速率
const CYCLE = 26;                  // 一个周期（秒，1× 速度）= 1 个冈崎片段
const OFF = 0.33;                  // 新链与模板的配对间距

/* 叉口弯弧：从螺旋上/下点平滑弯到水平模板线（按弧长取点） */
function peel(sign) {
  const c = new THREE.CubicBezierCurve3(
    new THREE.Vector3(0, sign * R, 0),
    new THREE.Vector3(-0.18, sign * (R + (YT - R) * 0.35), 0),
    new THREE.Vector3(-0.34, sign * YT, 0),
    new THREE.Vector3(-BEND, sign * YT, 0));
  const len = c.getLength();
  return (s, out) => {
    if (s <= 0) return out.set(0, sign * R, 0);
    if (s < len) return c.getPointAt(s / len, out);
    c.getPointAt(1, out);
    out.x -= s - len;
    return out;
  };
}
const topP = peel(1), botP = peel(-1);
function duplexPoint(x, top, out) {
  const a = x * TW;
  if (top) out.set(x, R * Math.cos(a), R * Math.sin(a));
  else out.set(x, -R * Math.cos(a), -R * Math.sin(a));
  return out;
}

/* ================= InstancedMesh 珠链工具 ================= */
const SPH = new THREE.SphereGeometry(1, 12, 10);
const CYL = new THREE.CylinderGeometry(1, 1, 1, 8);
function im(geo, material, max) {
  const m = new THREE.InstancedMesh(geo, material, max);
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled = false;
  m.count = 0;
  scene.add(m);
  return m;
}
const _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _sv = new THREE.Vector3(),
      _m = new THREE.Matrix4(), _d = new THREE.Vector3(), _a = new THREE.Vector3(),
      _b = new THREE.Vector3(), _Y = new THREE.Vector3(0, 1, 0), _col = new THREE.Color();
function putSphere(m, i, x, y, z, r) {
  _m.compose(_p.set(x, y, z), _q.identity(), _sv.set(r, r, r));
  m.setMatrixAt(i, _m);
}
function putCyl(m, i, ax, ay, az, bx, by, bz, r) {
  _d.set(bx - ax, by - ay, bz - az);
  const len = _d.length();
  if (len < 1e-4) { _m.makeScale(0, 0, 0); m.setMatrixAt(i, _m); return; }
  _p.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
  _q.setFromUnitVectors(_Y, _d.multiplyScalar(1 / len));
  _m.compose(_p, _q, _sv.set(r, len, r));
  m.setMatrixAt(i, _m);
}

/* 珠链网格（每帧重排实例） */
const ND = Math.ceil(D / 0.09), NS = Math.ceil(S / 0.09);
const backbone = im(SPH, M.par, 2 * (ND + NS));
const rungMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, metalness: 0.2 });
const rungs = im(CYL, rungMat, Math.ceil(D / 0.12));
rungs.setColorAt(0, _col.set(0x8a97a8));
const NLEAD = Math.ceil((X_MAX - S_LEAD) / 0.08) + 1;
const MAXG = NLEAD + 110, MAXR = 26, MAXFR = 80;
const green = im(SPH, M.green, MAXG);
const rnaB = im(SPH, M.rna, MAXR);
const fragRungs = im(CYL, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, transparent: true, opacity: 0.5 }), MAXFR);
fragRungs.setColorAt(0, _col.set(0x43d17c));

/* ================= 每帧场景更新 ================= */
const s5of = (j, u) => S_PRIM + P * (u - j - 0.16);
const RUNG_COL = new THREE.Color(0x8a97a8), ORANGE_COL = new THREE.Color(0xffb066), GREEN_COL = new THREE.Color(0x43d17c);
const FORK_T = new THREE.Vector3(-0.25, 0.15, 0);

function update(u) {
  const phi = mod(cycles, 1000) * V;

  /* --- 母链双螺旋（右侧）+ 两条分离模板（左侧）：同一串珠链流过叉口 --- */
  let i = 0;
  for (let k = 0; k < ND; k++) {
    const x = D - mod(phi + k * 0.09, D);
    const r = 0.075 * (0.3 + 0.7 * ss(D - 0.35, D - 0.03, x));
    duplexPoint(x, true, _a);
    putSphere(backbone, i++, _a.x, _a.y, _a.z, r);
  }
  for (let k = 0; k < NS; k++) {
    const s = mod(phi + k * 0.09, S);
    topP(s, _a);
    putSphere(backbone, i++, _a.x, _a.y, _a.z, 0.075 * (1 - 0.7 * ss(3.3, 3.58, s)));
  }
  for (let k = 0; k < ND; k++) {
    const x = D - mod(phi + k * 0.09, D);
    const r = 0.075 * (0.3 + 0.7 * ss(D - 0.35, D - 0.03, x));
    duplexPoint(x, false, _a);
    putSphere(backbone, i++, _a.x, _a.y, _a.z, r);
  }
  for (let k = 0; k < NS; k++) {
    const s = mod(phi + k * 0.09, S);
    botP(s, _a);
    putSphere(backbone, i++, _a.x, _a.y, _a.z, 0.075 * (1 - 0.7 * ss(3.3, 3.58, s)));
  }
  backbone.count = i;
  backbone.instanceMatrix.needsUpdate = true;

  /* --- 双螺旋碱基对横档（越靠近解旋酶越散开淡出） --- */
  for (let k = 0; k < rungs.instanceMatrix.count; k++) {
    const x = D - mod(phi + k * 0.12, D);
    duplexPoint(x, true, _a);
    duplexPoint(x, false, _b);
    putCyl(rungs, k, _a.x, _a.y, _a.z, _b.x, _b.y, _b.z, 0.026);
    const fade = 0.25 + 0.75 * ss(0.06, 0.5, x);
    rungs.setColorAt(k, _col.copy(RUNG_COL).lerp(BG_COL, 1 - fade));
  }
  rungs.count = rungs.instanceMatrix.count;
  rungs.instanceMatrix.needsUpdate = true;
  rungs.instanceColor.needsUpdate = true;

  /* --- 前导链：连续新链（下臂内侧）+ 配对短横 + 流动高亮 --- */
  let ng = 0;
  for (let k = 0; k < NLEAD; k++) {
    const s = S_LEAD + mod(phi + k * 0.08, X_MAX - S_LEAD);
    botP(s, _a);
    putSphere(green, ng++, _a.x, _a.y + OFF, _a.z, 0.068 * (1 - 0.7 * ss(3.3, 3.58, s)));
  }
  let nr = 0;
  for (let k = 0; k < leadRungs.instanceMatrix.count; k++) {
    const s = S_LEAD + 0.06 + k * 0.15;
    if (s > X_MAX) break;
    botP(s, _a);
    putCyl(leadRungs, nr++, _a.x, _a.y, _a.z, _a.x, _a.y + OFF, _a.z, 0.016);
  }
  leadRungs.count = nr;
  leadRungs.instanceMatrix.needsUpdate = true;
  for (let q = 0; q < 8; q++) {
    const s = S_LEAD + mod(phi * 1.6 + q * 0.45, X_MAX - S_LEAD);
    botP(s, _a);
    putSphere(pulses, q, _a.x, _a.y + OFF, _a.z, 0.05);
  }
  pulses.count = 8;
  pulses.instanceMatrix.needsUpdate = true;

  /* --- 后随链冈崎片段（上臂内侧）：RNA 引物 → 延伸 → 切补 → 封口 --- */
  let nR = 0, nfr = 0;
  for (let j = 0; j >= -4; j--) {
    if (j === 0 && u < 0.16) continue;
    const s5 = s5of(j, u);
    if (s5 > X_MAX + 0.02) continue;
    const sweep = clamp((u - (j + 1.44)) / 0.18, 0, 1);
    let rnaFar, dnaFar;
    if (j === 0 && u < 0.26) { rnaFar = S_PRIM + 2 * P * (u - 0.16); dnaFar = rnaFar; }
    else if (j === 0 && u < 0.58) { rnaFar = s5 + S_RNA; dnaFar = S_GROW0 + GROW_V * (u - 0.26); }
    else { rnaFar = s5 + S_RNA; dnaFar = s5 + P; }
    const rnaNear = s5 + S_RNA * sweep;
    /* RNA 引物（可被 Pol Ⅰ 边切边补：绿色从叉口侧吞掉橙色） */
    const rnaW = rnaFar - rnaNear;
    if (rnaW > 0.015) {
      const n = Math.max(1, Math.round(rnaW / 0.05));
      for (let m = 0; m < n && nR < MAXR; m++) {
        const s = rnaNear + (m + 0.5) * rnaW / n;
        topP(s, _a);
        putSphere(rnaB, nR++, _a.x, _a.y - OFF, _a.z, 0.075);
      }
    }
    /* 替换合成的新 DNA（Pol Ⅰ 补缺段） */
    if (sweep > 0) {
      const n = Math.max(1, Math.round(S_RNA * sweep / 0.06));
      for (let m = 0; m < n && ng < MAXG; m++) {
        const s = s5 + (m + 0.5) * S_RNA * sweep / n;
        topP(s, _a);
        putSphere(green, ng++, _a.x, _a.y - OFF, _a.z, 0.068);
      }
    }
    /* 片段主体 DNA */
    let last = rnaFar;
    for (let s = rnaFar + 0.04; s < dnaFar - 0.01 && ng < MAXG; s += 0.08) {
      topP(s, _a);
      putSphere(green, ng++, _a.x, _a.y - OFF, _a.z, 0.068);
      last = s;
    }
    if (dnaFar - last > 0.045 && dnaFar < X_MAX && ng < MAXG) {
      topP(dnaFar, _a);
      putSphere(green, ng++, _a.x, _a.y - OFF, _a.z, 0.068);
    }
    /* 模板↔新链 配对短横（橙 = RNA 区，绿 = DNA 区） */
    const end = Math.min(dnaFar, s5 + P - 0.04, X_MAX - 0.02);
    for (let s = s5 + 0.06; s < end && nfr < MAXFR; s += 0.16) {
      topP(s, _a);
      putCyl(fragRungs, nfr, _a.x, _a.y, _a.z, _a.x, _a.y - OFF, _a.z, 0.016);
      fragRungs.setColorAt(nfr++, (s > rnaNear + 0.01 && s < rnaFar - 0.005) ? ORANGE_COL : GREEN_COL);
    }
  }
  green.count = ng; green.instanceMatrix.needsUpdate = true;
  rnaB.count = nR; rnaB.instanceMatrix.needsUpdate = true;
  fragRungs.count = nfr; fragRungs.instanceMatrix.needsUpdate = true;
  if (nfr) fragRungs.instanceColor.needsUpdate = true;

  /* --- SSB 单链结合蛋白 --- */
  let nS = 0;
  const newest = (u >= 0.16 ? s5of(0, u) : s5of(-1, u));
  for (let s = 0.23; s < Math.min(newest + 0.1, X_MAX - 0.1); s += 0.15) {
    topP(s, _a);
    putSphere(ssbB, nS++, _a.x, _a.y + 0.16, _a.z, 0.12);
  }
  if (u >= 0.26 && u < 0.58) {
    const sG = S_GROW0 + GROW_V * (u - 0.26);
    for (let s = s5of(-1, u) - 0.073; s < sG + 0.1 && nS < 20; s += 0.15) {
      topP(s, _a);
      putSphere(ssbB, nS++, _a.x, _a.y + 0.16, _a.z, 0.12);
    }
  }
  for (const s of [0.18, 0.327]) {
    botP(s, _a);
    putSphere(ssbB, nS++, _a.x, _a.y - 0.16, _a.z, 0.12);
  }
  ssbB.count = nS;
  ssbB.instanceMatrix.needsUpdate = true;

  /* --- 酶的位置与状态 --- */
  helicase.visible = topo.visible = true;
  subG.rotation.x = u * Math.PI * 2;
  wedgeG.rotation.x = u * Math.PI * 2.4;
  const pu = u >= 0.15 && u < 0.27;
  primase.visible = pu;
  if (pu) {
    topP(S_PRIM + 2 * P * (u - 0.16), _a);
    primase.position.set(_a.x, _a.y + 0.27, _a.z);
  }
  primase.children[0].material.opacity = 0.92 * ss(0.15, 0.165, u) * (1 - ss(0.262, 0.27, u));
  const pL = u >= 0.25 && u < 0.60;
  polL.visible = pL;
  if (pL) {
    const sG = u < 0.26 ? S_PRIM + 2 * P * (u - 0.16) : S_GROW0 + GROW_V * (u - 0.26);
    topP(sG + 0.04, _a);
    polL.position.set(_a.x, _a.y - 0.27, _a.z);
  }
  polL.children[0].material.opacity = 0.92 * ss(0.25, 0.265, u) * (1 - ss(0.59, 0.60, u));
  const pI = u >= 0.585 && u < 0.795;
  polI.visible = pI;
  if (pI) {
    topP(s5of(-1, u) + S_RNA * clamp((u - 0.44) / 0.18, 0, 1) - 0.02, _a);
    polI.position.set(_a.x, _a.y - 0.26, _a.z);
  }
  polI.children[0].material.opacity = 0.92 * ss(0.585, 0.60, u) * (1 - ss(0.785, 0.795, u));
  const pLig = u >= 0.79 && u < 0.95;
  ligase.visible = pLig;
  if (pLig) {
    topP(2.38, _a);
    ligase.position.set(_a.x, _a.y - 0.26, _a.z);
  }
  ligase.children[0].material.opacity = 0.92 * ss(0.79, 0.83, u) * (1 - ss(0.92, 0.95, u));
  botP(S_LEAD, _a);
  polLead.position.set(_a.x, _a.y + 0.24, _a.z);

  /* --- dNTP 喂料小点 --- */
  let nf = 0;
  const feeds = (c, off) => {
    for (let q = 0; q < 3; q++) {
      const a = u * Math.PI * 6 + off + q * 2.09;
      putSphere(feedB, nf++, c.x + Math.cos(a) * 0.34, c.y + Math.sin(a) * 0.28, c.z + Math.cos(a) * 0.1, 0.045);
    }
  };
  if (pL) feeds(polL.position, 0);
  feeds(polLead.position, 1);
  feedB.count = nf;
  feedB.instanceMatrix.needsUpdate = true;

  /* --- 缺口红标 + 连接酶封合闪光 --- */
  const sNick = s5of(-1, u);
  nick.visible = u >= 0.58 && u < 0.86 && sNick < X_MAX;
  if (nick.visible) {
    topP(sNick, _a);
    nick.position.set(_a.x, _a.y - 0.17, _a.z);
  }
  flash.visible = u >= 0.85 && u < 0.94;
  if (flash.visible) {
    const k = ss(0.85, 0.94, u);
    topP(sNick, _a);
    flash.position.set(_a.x, _a.y - 0.17, _a.z);
    flash.scale.setScalar(1 + 2.6 * k);
    flash.material.opacity = 0.85 * (1 - k);
  }

  /* --- 跟随叉口的标注锚点 --- */
  topP((u >= 0.2 && u < 0.62) ? s5of(0, u) + 0.07 : 0, _a);
  rnaAnchor.position.set(_a.x, _a.y - OFF, _a.z);
  topP(Math.min(s5of(0, u) + P / 2, X_MAX - 0.3), _a);
  okAnchor.position.set(_a.x, _a.y - OFF - 0.28, _a.z);

  /* --- 标签文本与可见性 --- */
  for (const r of labelRegistry) {
    r.o.visible = r.vis(u);
    r.o.element.textContent = r.text();
  }

  /* --- 跟随叉口视角 --- */
  if (follow) {
    controls.target.lerp(FORK_T, 0.05);
    _d.subVectors(camera.position, controls.target);
    const len = lerp(_d.length(), 6.0, 0.04);
    camera.position.copy(controls.target).addScaledVector(_d.normalize(), len);
  }
}

/* ================= 半保留示意小卡（HUD canvas） ================= */
function drawInset(u) {
  if (!showInset || insetCv.clientWidth === 0) return;
  insetCv.width = insetCv.clientWidth * 2;
  insetCv.height = insetCv.clientHeight * 2;
  ictx.setTransform(2, 0, 0, 2, 0, 0);
  ictx.clearRect(0, 0, 336, 184);
  const cPar = THEME === 'light' ? '#5b6b7d' : '#9aa7b8';
  const cNew = THEME === 'light' ? '#148a5c' : '#43d17c';
  const cNewHi = THEME === 'light' ? '#148a5c' : '#7ee2ae';
  const line = (x1, y1, x2, y2, color, lw) => {
    ictx.beginPath(); ictx.moveTo(x1, y1); ictx.lineTo(x2, y2);
    ictx.strokeStyle = color; ictx.lineWidth = lw; ictx.stroke();
  };
  const text = (str, x, y, size, color, align = 'left') => {
    ictx.font = `500 ${size}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif`;
    ictx.fillStyle = color; ictx.textAlign = align; ictx.textBaseline = 'alphabetic';
    ictx.fillText(str, x, y);
  };
  /* 亲代双链 */
  const py = 38, px0 = 22, px1 = 196;
  line(px0, py - 7, px1, py - 7, cPar, 3.5);
  line(px0, py + 7, px1, py + 7, cPar, 3.5);
  for (let x = px0 + 10; x < px1 - 6; x += 16) line(x, py - 7, x, py + 7, THEME === 'light' ? 'rgba(91,107,125,.4)' : 'rgba(154,167,184,.4)', 2);
  text(L('亲代双链', 'Parent duplex'), px1 + 12, py + 4, 11.5, PAL.dim2);
  /* 分叉箭头 */
  ictx.strokeStyle = PAL.axis; ictx.lineWidth = 1.5;
  ictx.beginPath(); ictx.moveTo(px1 + 2, py - 7); ictx.quadraticCurveTo(236, py - 7, 254, 86); ictx.stroke();
  ictx.beginPath(); ictx.moveTo(px1 + 2, py + 7); ictx.quadraticCurveTo(236, py + 7, 254, 152); ictx.stroke();
  /* 两条子代：各一旧 + 一新 */
  const d1 = 100, d2 = 158, dx0 = 254, dx1 = 316;
  line(dx0, d1 - 7, dx1, d1 - 7, cPar, 3.5);
  line(dx0, d1 + 7, dx1, d1 + 7, cNew, 3.5);
  for (let x = dx0 + 6; x < dx1 - 4; x += 14) line(x, d1 - 7, x, d1 + 7, THEME === 'light' ? 'rgba(20,138,92,.4)' : 'rgba(67,209,124,.4)', 1.6);
  line(dx0, d2 - 7, dx1, d2 - 7, cNew, 3.5);
  line(dx0, d2 + 7, dx1, d2 + 7, cPar, 3.5);
  for (let x = dx0 + 6; x < dx1 - 4; x += 14) line(x, d2 - 7, x, d2 + 7, THEME === 'light' ? 'rgba(20,138,92,.4)' : 'rgba(67,209,124,.4)', 1.6);
  text(L('子代①', 'Daughter ①'), 246, d1 + 4, 11.5, PAL.dim2, 'right');
  text(L('子代②', 'Daughter ②'), 246, d2 + 4, 11.5, PAL.dim2, 'right');
  text(L('一旧 + 一新', 'One old + one new'), 328, 130, 11.5, cNewHi, 'right');
  text(L('两条子代双链各含一条完整母链', 'Each daughter duplex keeps one full parent strand'), 12, 178, 11.5, PAL.dim);
}

/* ================= 主循环 ================= */
let lastStep = -1, rafId = 0;
const clock = new THREE.Clock();
applyTheme();
applyLang();
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (playing) { cycles += dt * speed / CYCLE; tSim += dt * speed; }
  const t = cycles - Math.floor(cycles);
  update(t);
  drawInset(t);

  const si = stepIndex(t);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
    insetEl.classList.toggle('hl', si === 4);
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function startLoop() { if (!rafId) { clock.getDelta(); rafId = requestAnimationFrame(frame); } }
function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }
document.addEventListener('visibilitychange', () => document.hidden ? stopLoop() : startLoop());
startLoop();
</script>
