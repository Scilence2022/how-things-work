<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}#app{position:fixed;inset:0}#app canvas{display:block}#labels{position:fixed;inset:0;pointer-events:none;z-index:2}.lbl{padding:4px 8px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--muted);font-size:12px;white-space:nowrap}.lbl.hot{border-color:var(--hot);color:var(--hot)}

</style>
</head>
<body><div id="app"></div><div id="labels"></div>
<div id="title"><h1 data-zh="磁共振成像 · MRI" data-en="Magnetic Resonance Imaging · MRI">磁共振成像 · MRI</h1><div class="sub" data-zh="氢核在 B₀ 中进动，RF 脉冲翻转净磁化，FID 与梯度把位置变成信号 · 空格播放/暂停" data-en="Hydrogen precesses in B₀; RF tips net magnetization, while FID and gradients turn position into signal · Space = play/pause">氢核在 B₀ 中进动，RF 脉冲翻转净磁化，FID 与梯度把位置变成信号 · 空格播放/暂停</div></div>

<div id="stats"><span class="k" data-zh="磁场 B₀" data-en="Field B₀">磁场 B₀</span><span class="v accent" id="sB">1.50 T</span><span class="k" data-zh="拉莫尔频率" data-en="Larmor frequency">拉莫尔频率</span><span class="v accent" id="sF">63.9 MHz</span><span class="k" data-zh="T₂*" data-en="T₂*">T₂*</span><span class="v hot" id="sT">80 ms</span><span class="k" data-zh="相位" data-en="Phase">相位</span><span class="v" id="sP">0°</span></div>
<div id="panel"><div id="steps"></div><div class="actions"><button class="btn" id="play">暂停</button><button class="btn" id="grad"><span data-zh="梯度：开" data-en="Gradient: on">梯度：开</span></button></div><div class="row"><label data-zh="磁场强度" data-en="B₀ field">磁场强度</label><input id="b0" type="range" min="0.5" max="3" step=".1" value="1.5"><span class="val" id="b0v">1.50 T</span></div><div class="row"><label data-zh="RF 脉冲" data-en="RF pulse">RF 脉冲</label><input id="rf" type="range" min="45" max="135" value="90"><span class="val" id="rfv">90°</span></div><div class="row"><label data-zh="T₂* 衰减" data-en="T₂* decay">T₂* 衰减</label><input id="t2" type="range" min="20" max="180" value="80"><span class="val" id="t2v">80 ms</span></div><div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min=".2" max="3" step=".1" value="1"><span class="val" id="speedv">1.0×</span></div><div id="rel"><span data-zh="相关:" data-en="Related:">相关:</span><a href="../gyroscopic-precession/">陀螺进动</a><a href="../em-wave/">电磁波</a><a href="../eye-vision/">眼睛视觉</a></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
const q=new URLSearchParams(location.search), clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), bool=(k,d)=>q.has(k)?!['0','false'].includes(q.get(k)):d;
const root=document.documentElement;let lang=localStorage.getItem('htw-lang')||'zh',theme=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');let speed=clamp(+(q.get('speed')||1),.2,3),playing=bool('pause',true)&&!(matchMedia('(prefers-reduced-motion:reduce)').matches&&!q.has('pause')),t=clamp(+(q.get('t')||0),0,6),gradient=bool('gradient',true);
const L=(a,b)=>lang==='en'?b:a,scene=new THREE.Scene(),ren=new THREE.WebGLRenderer({antialias:true}),lab=new CSS2DRenderer();ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.querySelector('#app').append(ren.domElement);lab.setSize(innerWidth,innerHeight);Object.assign(lab.domElement.style,{position:'fixed',inset:0,pointerEvents:'none',zIndex:2});document.querySelector('#labels').append(lab.domElement);scene.background=new THREE.Color(0x09121c);scene.add(new THREE.HemisphereLight(0xaed9ff,0x14202d,1.3));scene.add(new THREE.DirectionalLight(0xffffff,1.4));
const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);cam.position.set(7,5.5,8);const ctl=new OrbitControls(cam,ren.domElement);ctl.target.set(0,1.2,0);ctl.enableDamping=true;ctl.autoRotate=bool('spin',true);ctl.autoRotateSpeed=.35;
const mat=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.15,...o}), blue=mat(0x54c8ee,{emissive:0x0b5575,emissiveIntensity:.45}), orange=mat(0xff9d70,{emissive:0x602414,emissiveIntensity:.3}), white=mat(0xeaf8ff), wire=mat(0x295069,{transparent:true,opacity:.28});
const floor=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,.15,64),mat(0x152432));floor.position.y=-.08;scene.add(floor);const bore=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.5,5.8,48,1,true),mat(0x1b3444,{transparent:true,opacity:.22,side:THREE.DoubleSide}));bore.rotation.z=Math.PI/2;bore.position.y=1.5;scene.add(bore);
const center=new THREE.Group();center.position.set(0,1.15,0);scene.add(center);const spins=[],N=32;for(let i=0;i<N;i++){const a=i/N*Math.PI*2,r=1.05*(.35+.65*(i%7)/6),x=Math.cos(a)*r,z=Math.sin(a)*r;const g=new THREE.Group(),shaft=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.75,6),white),tip=new THREE.Mesh(new THREE.ConeGeometry(.09,.22,8),blue);shaft.position.y=.37;tip.position.y=.82;g.add(shaft,tip);g.position.set(x,0,z);center.add(g);spins.push({g,shaft,tip,base:x});}
const axis=new THREE.ArrowHelper(new THREE.Vector3(0,1,0),new THREE.Vector3(0,-.1,0),2.0,0x63d7ff,.18,.1);center.add(axis);function label(txt,pos,cls=''){const d=document.createElement('div');d.className='lbl '+cls;d.textContent=txt;const o=new CSS2DObject(d);o.position.copy(pos);scene.add(o);return {d,o,txt};}const labels=[label('B₀ ↑',new THREE.Vector3(-2.3,3.1,0),'hot'),label('M net',new THREE.Vector3(.2,2.25,0)),label('FID',new THREE.Vector3(2.35,.25,0))];
const wave=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x8ee6b2}));wave.position.set(2.1,.05,0);wave.rotation.y=-Math.PI/2;scene.add(wave);const profile=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xffc86b}));profile.position.set(-2.3,.05,0);scene.add(profile);
const steps=[['B₀ 排队','B₀ alignment','均匀磁场让氢核净磁化沿 B₀ 排队。','A uniform field aligns the net hydrogen magnetization.'],['进动','Precession','每个自旋以拉莫尔频率绕 B₀ 进动：f = γB₀。','Each spin precesses at the Larmor frequency: f = γB₀.'],['RF 90°','90° RF pulse','共振 RF 脉冲把净磁化从纵向拍倒到横向。','A resonant RF pulse tips net magnetization into the transverse plane.'],['FID 衰减','FID decay','横向相干性丢失，线圈接收到自由感应衰减。','Loss of transverse coherence produces the free induction decay.'],['梯度编码','Gradient encoding','梯度让不同位置拥有不同频率/相位，写入位置。','Gradients make frequency and phase position-dependent.'],['重建一维剖面','1D reconstruction','对信号做频率分解，得到沿梯度方向的剖面。','Frequency decomposition reconstructs a one-dimensional profile.']];
function build(){const el=document.querySelector('#steps');el.innerHTML='';steps.forEach((s,i)=>{const b=document.createElement('button');b.className='step';b.innerHTML='<span class="num">'+(i+1)+'</span><span><b>'+L(s[0],s[1])+'</b><small>'+L(s[2],s[3])+'</small></span>';b.onclick=()=>{t=i;playing=false;sync()};el.append(b)})}function sync(){document.querySelector('#play').textContent=playing?L('暂停','Pause'):L('播放','Play');document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('on',i===Math.floor(t)));document.querySelector('#grad').classList.toggle('onoff',gradient);document.querySelector('#grad').firstElementChild.textContent=gradient?L('梯度：开','Gradient: on'):L('梯度：关','Gradient: off')}
const b0=document.querySelector('#b0'),rf=document.querySelector('#rf'),t2=document.querySelector('#t2'),sp=document.querySelector('#speed');function values(){document.querySelector('#b0v').textContent=(+b0.value).toFixed(2)+' T';document.querySelector('#rfv').textContent=rf.value+'°';document.querySelector('#t2v').textContent=t2.value+' ms';document.querySelector('#speedv').textContent=(+sp.value).toFixed(1)+'×';document.querySelector('#sB').textContent=(+b0.value).toFixed(2)+' T';document.querySelector('#sF').textContent=(42.58*+b0.value).toFixed(1)+' MHz';document.querySelector('#sT').textContent=t2.value+' ms'}[b0,rf,t2].forEach(x=>x.oninput=values);sp.oninput=()=>{speed=+sp.value;values()};document.querySelector('#play').onclick=()=>{playing=!playing;sync()};document.querySelector('#grad').onclick=()=>{gradient=!gradient;sync()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing=!playing;sync()}});document.querySelector('#lang').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('htw-lang',lang);document.querySelectorAll('[data-zh]').forEach(x=>x.textContent=lang==='en'?x.dataset.en:x.dataset.zh);build();sync()};document.querySelector('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('htw-theme',theme);root.dataset.theme=theme;scene.background.set(theme==='dark'?0x09121c:0xedf3f7);document.querySelector('#theme').textContent=theme==='dark'?'☀':'☾'};
let hidden=document.hidden;document.addEventListener('visibilitychange',()=>{hidden=document.hidden;if(!hidden){clock.getDelta();requestAnimationFrame(frame)}});const clock=new THREE.Clock();function frame(){if(hidden)return;requestAnimationFrame(frame);const dt=clamp(clock.getDelta(),0,.05);if(playing)t=clamp(t+dt*speed*.42,0,6);const phase=(t%1)*Math.PI*2,tilt=(t<2.35?0:t<2.85?((t-2.35)/.5)*(+rf.value/90)*Math.PI/2:Math.PI/2*(+rf.value/90));spins.forEach((s,i)=>{const drift=gradient&&t>4?(i/N-.5)*2.2:0;s.g.rotation.z=tilt;s.g.rotation.y=phase+drift+i*.025;s.tip.material=tilt>.7?orange:blue});const decay=Math.exp(-Math.max(0,t-2.85)*1000/+t2.value),pts=[],prof=[];for(let i=0;i<100;i++){const x=i/99*3.4-1.7;pts.push(new THREE.Vector3(0,x*.34,.02+Math.sin(i*.6+t*8)*decay*.32));prof.push(new THREE.Vector3(0,x*.25,.02+(gradient?Math.exp(-x*x*2)*(.2+.12*Math.sin(t*4)):0)))}wave.geometry.setFromPoints(pts);profile.geometry.setFromPoints(prof);labels[1].d.textContent=L('净磁化：'+Math.round(tilt/Math.PI*180)+'°','Net M: '+Math.round(tilt/Math.PI*180)+'°');document.querySelector('#sP').textContent=Math.round((phase%(Math.PI*2))*180/Math.PI)+'°';ctl.update();ren.render(scene,cam);lab.render(scene,cam);sync()}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);lab.setSize(innerWidth,innerHeight)});root.dataset.theme=theme;document.querySelector('#theme').textContent=theme==='dark'?'☀':'☾';b0.value=clamp(+(q.get('b0')||1.5),.5,3);t2.value=clamp(+(q.get('t2')||80),20,180);rf.value=clamp(+(q.get('rf')||90),45,135);sp.value=speed;if(!bool('labels',true))document.querySelector('#labels').style.display='none';values();build();sync();requestAnimationFrame(frame);
</script></body></html>
