<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行星轮系 · 固定谁,谁说了算</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#38d9a9;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0ca678;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.sun { border-color: rgba(255,159,40,.9); color: #ffd9a3; }
  .lbl.ring { border-color: rgba(177,151,252,.9); color: #e5d9ff; }
  .lbl.car { border-color: rgba(56,217,169,.9); color: #c3f5e5; }
  .lbl.fix { border-color: rgba(255,93,93,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.sun { border-color: rgba(156,95,0,.9); color: #9c5f00; }
  :root[data-theme="light"] .lbl.ring { border-color: rgba(112,72,232,.9); color: #7048e8; }
  :root[data-theme="light"] .lbl.car { border-color: rgba(12,166,120,.9); color: #0ca678; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #38d9a9; }
  #stats .v.rev { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.sun { color: #ffd9a3; border-color: rgba(255,159,40,.7); }
  .chip.pl { color: #8ce99a; border-color: rgba(140,233,154,.7); }
  .chip.ring { color: #e5d9ff; border-color: rgba(177,151,252,.7); }
  #modeRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(56,217,169,.12); }
  :root[data-theme="light"] .bon.on { background: rgba(12,166,120,.08); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(56,217,169,.10); border-color: rgba(56,217,169,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,166,120,.08); border-color: rgba(12,166,120,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #b8f2e0; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="行星轮系：固定谁，谁说了算" data-en="Planetary Gears: what you fix decides everything">行星轮系：固定谁，谁说了算</h1>
  <div class="sub" data-zh="太阳轮输入,固定齿圈=5:1 正转减速;固定行星架=倒挡反转;全部锁死=1:1 直连——一套齿轮,一只变速箱 · 空格播放/暂停" data-en="Sun input: fix the ring for 5:1 reduction, fix the carrier for reverse, lock everything for 1:1 — one gear set IS a gearbox · Space = play/pause">太阳轮输入,固定齿圈=5:1 正转减速;固定行星架=倒挡反转;全部锁死=1:1 直连——一套齿轮,一只变速箱 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="输出构件" data-en="output member">输出构件</span><span class="v" id="stOut">—</span>
  <span class="k" data-zh="传动比" data-en="gear ratio">传动比</span><span class="v g" id="stR">—</span>
  <span class="k" data-zh="输出方向" data-en="direction">输出方向</span><span class="v" id="stD">—</span>
  <span class="k" data-zh="太阳轮转速" data-en="sun speed">太阳轮转速</span><span class="v small-wrap" id="stS" style="font-size:15px">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip sun" data-zh="太阳轮 Z=12(输入)" data-en="sun Z=12 (input)">太阳轮 Z=12(输入)</span>
    <span class="chip pl" data-zh="行星轮 Z=18" data-en="planets Z=18">行星轮 Z=18</span>
    <span class="chip ring" data-zh="齿圈 Z=48" data-en="ring Z=48">齿圈 Z=48</span>
  </div>
  <div id="modeRow">
    <button class="bon on" id="fixRing"><b data-zh="固定齿圈" data-en="fix ring">固定齿圈</b><i data-zh="行星架输出 · 5:1 减速" data-en="carrier out · 5:1 down">行星架输出 · 5:1 减速</i></button>
    <button class="bon" id="fixCar"><b data-zh="固定行星架" data-en="fix carrier">固定行星架</b><i data-zh="齿圈输出 · 倒挡反转" data-en="ring out · reverse!">齿圈输出 · 倒挡反转</i></button>
    <button class="bon" id="fixLock"><b data-zh="全部锁死" data-en="lock all">全部锁死</b><i data-zh="直连 1:1" data-en="direct 1:1">直连 1:1</i></button>
  </div>
  <div class="row"><label data-zh="输入速度" data-en="input speed">输入速度</label><input id="spd" type="range" min="10" max="100" step="5" value="45"><span class="val" id="spdVal">0.45×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../differential/" data-zh="差速器:行星轮系的同门兄弟" data-en="differential: a planetary cousin">差速器:行星轮系的同门兄弟</a>
    <a href="../worm-drive/" data-zh="蜗杆自锁:另一种变速哲学" data-en="worm drive: another way to slow">蜗杆自锁:另一种变速哲学</a>
    <a href="../universal-joint/" data-zh="万向节:传动的拐弯处" data-en="universal joint: the bend in the driveline">万向节:传动的拐弯处</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
let fixMode = ['car', 'lock'].includes(qs.get('fix')) ? qs.get('fix') : 'ring';

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.frame.color.set(THEME === 'light' ? 0x9aa4b2 : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('行星轮系 · 固定谁谁说了算', 'Planetary Gears · fix one, rule all');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 6.2, 5.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 10, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  frame: mat(0x39424f, { roughness: 0.7 }),
  sun: mat(0xff9f28, { roughness: 0.35, metalness: 0.55 }),
  planet: mat(0x51cf66, { roughness: 0.4, metalness: 0.5 }),
  ring: mat(0xb197fc, { roughness: 0.4, metalness: 0.5 }),
  dark: mat(0x1b212c, { roughness: 0.8 }),
  arrow: new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.95 }),
  arrowC: new THREE.MeshBasicMaterial({ color: 0x38d9a9, transparent: true, opacity: 0.95 }),
  arrowR: new THREE.MeshBasicMaterial({ color: 0xb197fc, transparent: true, opacity: 0.95 }),
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
};

/* ================= 齿轮工厂 ================= */
function gearTeeth(radius, teeth, thickness, toothH, material) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, thickness, 56), material);
  body.rotation.x = Math.PI / 2;
  g.add(body);
  const toothW = Math.max(Math.PI * radius / teeth * 0.48, 0.05);
  const toothGeo = new THREE.BoxGeometry(toothH, toothW, thickness * 0.92);
  for (let i = 0; i < teeth; i++) {
    const t = new THREE.Mesh(toothGeo, material);
    const a = i / teeth * Math.PI * 2;
    t.position.set(Math.cos(a) * (radius + toothH / 2), Math.sin(a) * (radius + toothH / 2), 0);
    t.rotation.z = a;
    g.add(t);
  }
  return g;
}
/* 齿轮参数(统一模数) */
const Z_S = 12, Z_P = 18, Z_R = Z_S + 2 * Z_P;      // 48
const MOD = 0.095;
const R_S = MOD * Z_S / 2;                            // 0.57
const R_P = MOD * Z_P / 2;                            // 0.855
const R_R = MOD * Z_R / 2;                            // 2.28
const TOOTH_H = MOD * 0.62, TH = 0.34;
const R_C = R_S + R_P;                                // 行星中心圆

const root = new THREE.Group();
root.position.y = 0.6;
scene.add(root);
/* 太阳轮 */
const sunG = gearTeeth(R_S, Z_S, TH, TOOTH_H, M.sun);
root.add(sunG);
/* 行星轮 ×3 + 行星架 */
const planets = [];
const carrierGrp = new THREE.Group();
root.add(carrierGrp);
for (let i = 0; i < 3; i++) {
  const a = i / 3 * Math.PI * 2;
  const pg = gearTeeth(R_P, Z_P, TH, TOOTH_H, M.planet);
  pg.position.set(Math.cos(a) * R_C, Math.sin(a) * R_C, 0);
  carrierGrp.add(pg);
  planets.push({ g: pg, a });
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, TH * 1.9, 10), M.dark);
  pin.rotation.x = Math.PI / 2;
  pin.position.set(Math.cos(a) * R_C, Math.sin(a) * R_C, 0);
  carrierGrp.add(pin);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(R_C, 0.12, 0.1), M.frame);
  arm.position.set(Math.cos(a) * R_C / 2, Math.sin(a) * R_C / 2, -TH / 2 - 0.06);
  arm.rotation.z = a;
  carrierGrp.add(arm);
}
const hubC = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, TH * 2.2, 16), M.frame);
hubC.rotation.x = Math.PI / 2;
carrierGrp.add(hubC);
/* 齿圈(内齿) */
const ringGrp = new THREE.Group();
root.add(ringGrp);
{
  const outer = new THREE.Mesh(new THREE.CylinderGeometry(R_R + 0.3, R_R + 0.3, TH, 72, 1, true), M.ring);
  outer.rotation.x = Math.PI / 2;
  outer.material = M.ring.clone();
  outer.material.side = THREE.DoubleSide;
  ringGrp.add(outer);
  for (const y of [-TH / 2, TH / 2]) {
    const capGeo = new THREE.RingGeometry(R_R + 0.02, R_R + 0.3, 72);
    const cap = new THREE.Mesh(capGeo, M.ring);
    cap.position.y = y;
    cap.rotation.x = -Math.PI / 2;
    ringGrp.add(cap);
  }
  const toothGeo = new THREE.BoxGeometry(TOOTH_H, Math.max(Math.PI * R_R / Z_R * 0.48, 0.05), TH * 0.92);
  for (let i = 0; i < Z_R; i++) {
    const t = new THREE.Mesh(toothGeo, M.ring);
    const a = i / Z_R * Math.PI * 2;
    t.position.set(Math.cos(a) * (R_R - TOOTH_H / 2), Math.sin(a) * (R_R - TOOTH_H / 2), 0);
    t.rotation.z = a;
    ringGrp.add(t);
  }
}
const floor = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 0.16, 48), M.floor);
floor.position.y = -0.6;
scene.add(floor);

/* 方向箭头(顶视,绕各构件) */
function flatArrow(material) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.08), material);
  shaft.position.x = 0.25;
  g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.2, 10), material);
  tip.rotation.z = -Math.PI / 2;
  tip.position.x = 0.55;
  g.add(tip);
  return g;
}
const arrSun = flatArrow(M.arrow);
arrSun.position.y = TH + 0.06;
sunG.add(arrSun);
const arrRing = flatArrow(M.arrowR);
arrRing.position.y = TH + 0.06;
arrRing.position.x = R_R + 0.3 + 0.02;
ringGrp.add(arrRing);
arrRing.rotation.z = 0.4;
const arrCar = flatArrow(M.arrowC);
arrCar.position.y = TH + 0.42;
arrCar.position.x = R_C;
carrierGrp.add(arrCar);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let inSpeed = 0.45;                 // 太阳轮角速度(视觉单位)
let thetaS = 0, thetaC = 0, thetaR = 0, thetaP = 0;
function omegaC() {
  /* Willis: (ωs−ωc)Zs = −(ωr−ωc)Zr;按固定件求解 */
  if (fixMode === 'ring') return inSpeed * Z_S / (Z_S + Z_R);         // 0.2
  if (fixMode === 'car') return 0;                                     // 固定
  return inSpeed;                                                      // 锁死
}
function omegaR() {
  if (fixMode === 'ring') return 0;
  if (fixMode === 'car') return -inSpeed * Z_S / Z_R;                  // −0.25 倒挡
  return inSpeed;
}
function omegaP() {
  const wc = omegaC(), wr = omegaR();
  if (fixMode === 'lock') return inSpeed;
  /* 齿圈↔行星啮合: (ωp−ωc)/(ωr−ωc) = Zr/Zp */
  return wc + (wr - wc) * Z_R / Z_P;
}
function ratioText() {
  if (fixMode === 'ring') return '5.0 : 1 减速';
  if (fixMode === 'car') return '−4.0 : 1 倒挡';
  return '1 : 1 直连';
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblSun = addLabel(() => L(`太阳轮 12 齿(输入)`, `sun 12T (input)`), new THREE.Vector3(0, -0.75, 0), 'sun', sunG);
const lblRing = addLabel(() => fixMode === 'ring' ? L('齿圈 48 齿(固定)', 'ring 48T (fixed)') : L('齿圈 48 齿', 'ring 48T'),
  new THREE.Vector3(R_R + 0.85, 0, 0), fixMode === 'ring' ? 'fix' : 'ring', ringGrp);
const lblCar = addLabel(() => fixMode === 'car' ? L('行星架(固定)', 'carrier (fixed)') : L('行星架 = 输出', 'carrier = output'),
  new THREE.Vector3(R_C, R_C + 0.35, 0), fixMode === 'car' ? 'fix' : 'car', carrierGrp);
const lblStatus = addLabel(() => `Willis: (ωs−ωc)·12 = −(ωr−ωc)·48 · ${ratioText()}`,
  new THREE.Vector3(0, 3.6, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '四件套:太阳/行星/齿圈/架', be: 'Four members: sun, planets, ring, carrier',
    d: '三个行星轮被行星架钉在太阳轮周围,外面套一圈内齿的齿圈——四件任意固定一件,传动比就换一副面孔。',
    de: 'Three planets pinned to a carrier around the sun, inside an internally-toothed ring. Fix any member and the ratio changes personality.',
    act: () => setFix('ring') },
  { b: '固定齿圈:5:1 减速', be: 'Fix the ring: 5:1 reduction',
    d: '太阳轮转 5 圈,行星架才慢慢跟 1 圈——扭矩放大 5 倍,方向相同。这是 most 自动变速箱的前进挡。',
    de: 'Five sun turns per carrier turn — torque ×5, same direction. This is the forward gear of most automatics.',
    act: () => setFix('ring') },
  { b: '固定行星架:倒挡!', be: 'Fix the carrier: reverse!',
    d: '行星架不动,行星轮只能原地自转当「过渡轮」——齿圈被带着反向转:传动比 −4,方向反转。倒挡就是这么来的。',
    de: 'With the carrier parked, planets idle in place as idlers — the ring backs up at −4:1. That is reverse gear.',
    act: () => setFix('car') },
  { b: '全部锁死:1:1 直连', be: 'Lock everything: direct 1:1',
    d: '用离合器把任意两件焊死,整套机构变成一块刚性块——输入转多少输出转多少,效率最高的一挡。',
    de: 'Clutch any two members together and the whole set becomes one rigid block — direct drive, the most efficient gear.',
    act: () => setFix('lock') },
  { b: '一只变速箱的野心', be: 'One set, a whole gearbox',
    d: '自动变速箱 = 几排行星轮 + 几组离合器/制动器,按表固定不同构件 → 前进/倒挡/空挡无缝切换。差速器是它的同门兄弟。',
    de: 'An automatic transmission = a few planetary sets + clutches, fixing different members per gear. The differential is its cousin.',
    act: () => setFix('ring') },
];
function stepIndex() {
  if (fixMode === 'lock') return 3;
  if (fixMode === 'car') return 2;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stOut = document.getElementById('stOut'), stR = document.getElementById('stR'),
  stD = document.getElementById('stD'), stS = document.getElementById('stS');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setFix(m) {
  fixMode = m;
  document.getElementById('fixRing').classList.toggle('on', m === 'ring');
  document.getElementById('fixCar').classList.toggle('on', m === 'car');
  document.getElementById('fixLock').classList.toggle('on', m === 'lock');
}
document.getElementById('fixRing').addEventListener('click', () => setFix('ring'));
document.getElementById('fixCar').addEventListener('click', () => setFix('car'));
document.getElementById('fixLock').addEventListener('click', () => setFix('lock'));
elSpd.addEventListener('input', () => { inSpeed = parseInt(elSpd.value, 10) / 100; elSpdVal.textContent = inSpeed.toFixed(2) + '×'; });
elSpd.value = Math.round(inSpeed * 100);
elSpdVal.textContent = inSpeed.toFixed(2) + '×';
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    thetaS += inSpeed * dts;
    thetaC += omegaC() * dts;
    thetaR += omegaR() * dts;
    thetaP += omegaP() * dts;   // 行星轮绝对角(由太阳/齿圈啮合唯一确定)
  }
  sunG.rotation.z = -thetaS;
  carrierGrp.rotation.z = -thetaC;
  ringGrp.rotation.z = -thetaR;
  for (const pl of planets) pl.g.rotation.z = -thetaP;

  /* 统计 */
  const out = fixMode === 'ring' ? L('行星架', 'carrier') : fixMode === 'car' ? L('齿圈', 'ring') : L('整体', 'all');
  stOut.textContent = out;
  stR.textContent = ratioText();
  const rev = omegaC() < 0 || omegaR() < 0;
  stD.textContent = fixMode === 'car' ? L('反转 ↺', 'reverse') : L('正转 ↻', 'forward');
  stD.classList.toggle('rev', fixMode === 'car');
  stS.innerHTML = (inSpeed * 60).toFixed(0) + '<small> rpm(示意)</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setFix(fixMode);
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
