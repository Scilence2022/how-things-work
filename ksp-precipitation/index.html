<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>溶度积与沉淀 · Q 越线就「塌」</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #qbar{flex:1;height:14px;border-radius:7px;position:relative;border:1px solid var(--tool-border);
    background:linear-gradient(90deg,rgba(43,138,62,.25),rgba(255,212,59,.25),rgba(255,107,107,.3))}
  #qbar span{position:absolute;top:-3px;height:20px;border-radius:2px}
  #qksp{width:2px;background:#ff6b6b}
  #qmark{width:4px;background:var(--acc);transition:left .12s}
  #eqn{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.5}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="溶度积与沉淀 · Q 越线就「塌」" data-en="Solubility Product · when Q crosses Ksp, it crashes out">溶度积与沉淀 · Q 越线就「塌」</h1>
  <div class="sub" data-zh="难溶盐的溶解是平衡:Ksp=[M⁺][A⁻];Q<Ksp 还能溶,Q>Ksp 整瓶瞬间泛白浊,离子计数从过冲回落到平衡线;同离子效应一压就沉,水垢肾结石钡餐全是它 · 拖动旋转 / 空格运行/暂停" data-en="Dissolution is an equilibrium: Ksp=[M⁺][A⁻]; below it more salt dissolves, above it the flask flashes white and ion counts fall back to the line; the common-ion effect pushes either way — scale, kidney stones, barium meals · drag to orbit / Space = run/pause">难溶盐的溶解是平衡:Ksp=[M⁺][A⁻];Q<Ksp 还能溶,Q>Ksp 整瓶瞬间泛白浊,离子计数从过冲回落到平衡线;同离子效应一压就沉,水垢肾结石钡餐全是它 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="[M⁺] 浓度" data-en="[M⁺]">[M⁺] 浓度</span><span class="v" id="stM">—</span>
  <span class="k" data-zh="[A⁻] 浓度" data-en="[A⁻]">[A⁻] 浓度</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="离子积 Q" data-en="Q">离子积 Q</span><span class="v" id="stQ">—</span>
  <span class="k" data-zh="Q / Ksp" data-en="Q / Ksp">Q / Ksp</span><span class="v" id="stR">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnTit" data-zh="滴入一滴 M²⁺ 浓液" data-en="drop of conc. M²⁺">滴入一滴 M²⁺ 浓液</button>
    <button class="abtn" id="btnCommon" data-zh="同离子效应:加 NaA" data-en="common-ion: add NaA">同离子效应:加 NaA</button>
    <button class="abtn" id="btnReset" data-zh="重置" data-en="reset">重置</button>
    <button class="abtn salt" id="s0" data-zh="CaCO₃(水垢)" data-en="CaCO₃ (scale)">CaCO₃(水垢)</button>
    <button class="abtn salt" id="s1" data-zh="BaSO₄(钡餐)" data-en="BaSO₄ (barium meal)">BaSO₄(钡餐)</button>
    <button class="abtn salt" id="s2" data-zh="CaF₂(氟化牙)" data-en="CaF₂ (fluoridation)">CaF₂(氟化牙)</button>
    <button class="abtn salt" id="s3" data-zh="AgI(最不溶)" data-en="AgI (least soluble)">AgI(最不溶)</button>
  </div>
  <div class="row">
    <label id="lblM" data-zh="[M⁺]" data-en="[M⁺]">[M⁺]</label>
    <input id="sM" type="range" min="-90" max="-20" step="1" value="-46">
    <span class="val" id="sMVal">—</span>
  </div>
  <div class="row">
    <label id="lblA" data-zh="[A⁻]" data-en="[A⁻]">[A⁻]</label>
    <input id="sA" type="range" min="-90" max="-20" step="1" value="-46">
    <span class="val" id="sAVal">—</span>
  </div>
  <div class="row">
    <label data-zh="Q 对 Ksp" data-en="Q vs Ksp">Q 对 Ksp</label>
    <div id="qbar"><span id="qksp"></span><span id="qmark"></span></div>
    <span class="val" id="qTxt">—</span>
  </div>
  <div id="eqn"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../buffer-solution/" data-zh="缓冲溶液:pH 版的同款平衡" data-en="Buffer solutions: same game, for pH">缓冲溶液</a>
    <a href="../le-chatelier/" data-zh="勒夏特列:平衡怎么挪" data-en="Le Chatelier: how equilibria shift">勒夏特列原理</a>
    <a href="../titration-curve/" data-zh="滴定曲线:读拐点" data-en="Titration curves: reading the kink">滴定曲线</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- 工具 / 主题 / 语言 / URL 参数 ----------
   物理注(25 °C 实测 Ksp,均 1:1 型):
   CaCO₃ 3.4e-9 | BaSO₄ 1.1e-10 | CaF₂ 3.5e-11 | AgI 8.5e-17 —— 跨约 8 个数量级
   平衡关系 Q=cm·ca:Q<Ksp 继续溶;Q>Ksp 析出,直到 Q 回到 Ksp */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const gauss=()=>Math.random()+Math.random()+Math.random()-1.5;
function fmtSci(c){
  if(!(c>0))return '0';
  const e=Math.floor(Math.log10(c)),m=c/Math.pow(10,e);
  return m.toFixed(1)+'×10<sup>'+e+'</sup>';
}

/* ---------- 渲染器 / 场景 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(0,1.4,6.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=16;controls.autoRotateSpeed=0.5;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(3,6,7);scene.add(key);

/* 烧杯:玻璃壁 + 液体 + 底 */
const glass=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,2.7,48,1,true),
  new THREE.MeshStandardMaterial({color:0xdfe8f2,transparent:true,opacity:0.14,roughness:0.05,metalness:0.1,side:THREE.DoubleSide}));
glass.position.y=0.25;scene.add(glass);
const liquid=new THREE.Mesh(new THREE.CylinderGeometry(1.62,1.62,2.3,48),
  new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.12,roughness:0.15}));
liquid.position.y=0.2;scene.add(liquid);
const bottom=new THREE.Mesh(new THREE.CylinderGeometry(1.72,1.72,0.12,48),
  new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:0.3,metalness:0.4}));
bottom.position.y=-1.1;scene.add(bottom);

/* ---------- 离子(InstancedMesh)与沉淀堆 ---------- */
const NM=46;
const ionMeshM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.09,10,8),
  new THREE.MeshStandardMaterial({color:0x4dabf7,emissive:0x1864ab,emissiveIntensity:0.5,roughness:0.3}),NM);
const ionMeshA=new THREE.InstancedMesh(new THREE.SphereGeometry(0.1,10,8),
  new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xe8590c,emissiveIntensity:0.5,roughness:0.3}),NM);
ionMeshM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
ionMeshA.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(ionMeshM,ionMeshA);
const dummy=new THREE.Object3D();
const ionsM=[],ionsA=[];
for(let i=0;i<NM;i++){
  ionsM.push({x:0,y:0,z:0});ionsA.push({x:0,y:0,z:0});
}
const NP=160,pile=[];
const pileMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),
  new THREE.MeshStandardMaterial({color:0xf1f3f5,roughness:0.6}),NP);
pileMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(pileMesh);
for(let i=0;i<NP;i++){
  const row=Math.floor(i/32);
  const r=1.3*Math.sqrt(Math.max(0.05,1-row*0.16)),a=Math.random()*Math.PI*2;
  pile.push([r*Math.cos(a),-0.98+row*0.05,r*Math.sin(a)]);
}
/* 白浊云(过饱和瞬间) */
const mCloud=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
const clouds=[];
for(let i=0;i<4;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.55,14,10),mCloud.clone());
  m.visible=false;scene.add(m);
  clouds.push({m,t:9,x:0,y:0});
}
let cloudT=9;
function burstCloud(){
  cloudT=0;
  clouds.forEach((c,i)=>{
    c.t=0;c.x=(Math.random()*2-1)*0.7;c.y=(Math.random()*1.4-0.2);
    c.m.visible=true;c.m.position.set(c.x,c.y,0);
  });
}
/* 滴管液滴 */
const drop=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,10),
  new THREE.MeshStandardMaterial({color:0x4dabf7,emissive:0x1864ab,emissiveIntensity:0.6,roughness:0.2}));
drop.visible=false;scene.add(drop);
let titT=9;

/* ---------- 四种难溶盐 ---------- */
const SALTS=[
 {zh:'碳酸钙 CaCO₃(水垢·肾结石类似)',en:'CaCO₃ (scale; kidney stones alike)',f:'CaCO₃',m:'Ca²⁺',a:'CO₃²⁻',ksp:3.4e-9,
  note:'水垢就是它;肾结石的草酸钙 CaC₂O₄ 同理(Ksp≈2.3×10⁻⁹)'},
 {zh:'硫酸钡 BaSO₄(钡餐)',en:'BaSO₄ (barium meal)',f:'BaSO₄',m:'Ba²⁺',a:'SO₄²⁻',ksp:1.1e-10,
  note:'Ksp 极小 → 钡餐喝下去也不解离,Ba²⁺ 不被肠道吸收'},
 {zh:'氟化钙 CaF₂(氟化牙釉)',en:'CaF₂ (fluoridated enamel)',f:'CaF₂',m:'Ca²⁺',a:'F⁻',ksp:3.5e-11,
  note:'含氟牙膏让牙釉表面生成 CaF₂ 层,抗酸溶解'},
 {zh:'碘化银 AgI(最难溶)',en:'AgI (the least soluble)',f:'AgI',m:'Ag⁺',a:'I⁻',ksp:8.5e-17,
  note:'四者中 Ksp 最小(跨约 8 个数量级);也用来人工降雨'}
];

/* ---------- 状态 ---------- */
let playing=!(qs.get('pause')==='1');
let speed=clamp(parseFloat(qs.get('speed'))||1,0.2,3);
let saltIdx=0,cm=1e-5,ca=1e-5,solid=0,labelsOn=true,simT=0;
let wasSuper=false,demoT=2.5,demoDone=false;
function setConc(which,c){
  if(which==='m')cm=clamp(c,1e-9,1e-2);else ca=clamp(c,1e-9,1e-2);
  syncSliders();
}
function syncSliders(){
  document.getElementById('sM').value=Math.round(Math.log10(cm)*10);
  document.getElementById('sA').value=Math.round(Math.log10(ca)*10);
  document.getElementById('sMVal').innerHTML=fmtSci(cm)+' M';
  document.getElementById('sAVal').innerHTML=fmtSci(ca)+' M';
}
function setSalt(i){
  saltIdx=i;
  const s=SALTS[i];
  cm=ca=Math.sqrt(s.ksp/2);solid=0;wasSuper=false;
  document.getElementById('lblM').textContent=L('[ '+s.m+' ]','[ '+s.m+' ]');
  document.getElementById('lblA').textContent=L('[ '+s.a+' ]','[ '+s.a+' ]');
  document.querySelectorAll('.abtn.salt').forEach((b,k)=>b.classList.toggle('on',k===i));
  document.getElementById('eqn').innerHTML=
    L('离子方程式:','Dissolution: ')+s.m+' (aq) + '+s.a+' (aq) ⇌ '+s.f+' (s)　Ksp=[M⁺][A⁻]=<b>'+fmtSci(s.ksp)+'</b>'+
    '<br><span style="color:var(--text3)">'+(LANG==='en'?s.en:s.note)+'</span>';
  syncSliders();
}

/* ---------- 标签 ---------- */
const labelReg=[];
function addLabel(fn,pos,cls='',visFn){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,fn,vis:visFn||(()=>true)});return o;
}
const lblM=addLabel(()=>SALTS[saltIdx].m+' M⁺ 阳离子',new THREE.Vector3(-2.3,1.7,0),'b');
const lblA=addLabel(()=>SALTS[saltIdx].a+' A⁻ 阴离子',new THREE.Vector3(2.3,1.7,0),'o');
const lblP=addLabel(()=>L('沉淀 MA(s) 堆在瓶底','precipitate MA(s) settles'),new THREE.Vector3(0,-1.5,0),'',()=>solid>1e-7);
const lblStatus=addLabel(()=>{
  const Q=cm*ca,ksp=SALTS[saltIdx].ksp;
  if(Q>ksp*1.02)return L('Q>Ksp:过饱和!析出沉淀,直到回落','Q>Ksp: supersaturated! precipitating back down');
  if(Q<ksp*0.98)return L('Q<Ksp:未饱和,固体继续溶解','Q<Ksp: undersaturated — solid keeps dissolving');
  return L('Q≈Ksp:溶解⇄沉淀动态平衡','Q≈Ksp: dynamic dissolution⇄precipitation equilibrium');
},new THREE.Vector3(0,2.6,0),'o');

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('溶度积与沉淀 · Q 越线就「塌」','Solubility Product & Precipitation');
  setSalt(saltIdx);buildSteps();updateStats();
}

/* ---------- 步骤 ---------- */
const STEPS=[
 {b:'溶解⇄沉淀平衡',be:'Dissolution ⇄ precipitation equilibrium',
  d:'固体溶进去的速率等于析出来的速率时,溶液饱和:Ksp=[M⁺][A⁻] 是这个温度下的常数。',
  de:'At saturation the rates match: Ksp=[M⁺][A⁻], a constant at this temperature.',
  act:()=>{cm=ca=Math.sqrt(SALTS[saltIdx].ksp/2);syncSliders();}},
 {b:'Q>Ksp:过饱和瞬间「塌」',be:'Q>Ksp: it crashes out',
  d:'把两种离子都加浓,Q 一越过 Ksp,整瓶瞬间泛白浊——沉淀不是慢慢来的,是成核爆发。',
  de:'Concentrate both ions: the instant Q crosses Ksp the flask flashes white — a nucleation burst.',
  act:()=>{cm=ca=1e-3;syncSliders();}},
 {b:'回落:退回 Ksp 线',be:'Falling back to the Ksp line',
  d:'析出消耗离子,Q 自动回落到 Ksp 就停——计数器从过冲滑回平衡线,这就是平衡的意义。',
  de:'Precipitation eats ions until Q returns to Ksp — the counter slides back to equilibrium.',
  act:()=>{cm=ca=1e-3;syncSliders();}},
 {b:'同离子效应',be:'The common-ion effect',
  d:'加 NaA 让 A⁻ 暴增:平衡被压向固体,M⁺ 被迫沉出去——一边暴增,另一边遭殃。',
  de:'Flood A⁻ with NaA: the equilibrium pushes toward solid and M⁺ is squeezed out.',
  act:()=>{commonIon();}},
 {b:'滴定一瓶过饱和液',be:'Titrate into supersaturation',
  d:'一滴浓 M²⁺ 落进接近饱和的瓶里,Q 越线,白浊一闪——看右上角 Q/Ksp 的过冲与回落。',
  de:'One drop of concentrated M²⁺ into a near-saturated flask: Q crosses, white flash, watch Q/Ksp overshoot and settle.',
  act:()=>{titrate();}},
 {b:'生活里到处是 Ksp',be:'Ksp is everywhere',
  d:'水垢(CaCO₃)、肾结石(草酸钙)、钡餐(BaSO₄ 不被吸收)、氟化牙(CaF₂ 保护层)——全在 Ksp 手里。',
  de:'Scale, kidney stones, barium meals, fluoridated enamel — all governed by Ksp.',
  act:()=>{setSalt(0);}},
];
let activeStep=0;
function stepIndex(){
  const Q=cm*ca,ksp=SALTS[saltIdx].ksp;
  if(Q>ksp*1.02)return solid>1e-6?2:1;
  if(Q<ksp*0.98)return 0;
  return 1;
}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps(true);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(manual){
  const si=manual?activeStep:stepIndex();
  if(!manual)activeStep=si;
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===si));
}
function titrate(){
  titT=0;drop.visible=true;
}
function commonIon(){
  ca=Math.min(1e-2,ca*6);
  syncSliders();
}

/* ---------- 平衡动力学 ---------- */
function equilibrate(dt){
  const ksp=SALTS[saltIdx].ksp,Q=cm*ca;
  if(Q>ksp){
    const x=Math.min((Q-ksp)/(cm+ca),cm,ca)*Math.min(1,4*dt);
    cm-=x;ca-=x;solid+=x;
    if(!wasSuper){wasSuper=true;burstCloud();}
  }else{
    wasSuper=false;
    if(solid>0){
      const x=Math.min(solid,(ksp-Q)/(cm+ca+1e-30))*dt*0.8;
      cm+=x;ca+=x;solid-=x;
    }
  }
}

/* ---------- 统计 ---------- */
function updateStats(){
  const ksp=SALTS[saltIdx].ksp,Q=cm*ca;
  document.getElementById('stM').innerHTML=fmtSci(cm)+'<small> mol/L</small>';
  document.getElementById('stA').innerHTML=fmtSci(ca)+'<small> mol/L</small>';
  document.getElementById('stQ').innerHTML=fmtSci(Q);
  const stR=document.getElementById('stR');
  stR.innerHTML=(Q/ksp).toExponential(1);
  stR.style.color=Q>ksp*1.02?'#ff6b6b':'';
  /* Q 条:log10 从 -17 到 -2 */
  const lq=Math.log10(Q);
  document.getElementById('qmark').style.left=clamp((lq+17)/15*100,0,97)+'%';
  const lk=Math.log10(ksp);
  document.getElementById('qksp').style.left=clamp((lk+17)/15*100,0,98)+'%';
  document.getElementById('qTxt').textContent=Q>ksp?L('过饱和','supersat.'):Q>ksp*0.98?L('饱和','saturated'):L('未饱和','undersat.');
}

/* ---------- 交互 ---------- */
document.getElementById('sM').addEventListener('input',e=>{
  cm=Math.pow(10,+e.target.value/10);
  document.getElementById('sMVal').innerHTML=fmtSci(cm)+' M';
});
document.getElementById('sA').addEventListener('input',e=>{
  ca=Math.pow(10,+e.target.value/10);
  document.getElementById('sAVal').innerHTML=fmtSci(ca)+' M';
});
document.getElementById('btnTit').addEventListener('click',titrate);
document.getElementById('btnCommon').addEventListener('click',commonIon);
document.getElementById('btnReset').addEventListener('click',()=>setSalt(saltIdx));
SALTS.forEach((s,i)=>document.getElementById('s'+i).addEventListener('click',()=>setSalt(i)));
const elPlay=document.getElementById('play');
function setPlayLabel(){elPlay.textContent=playing?L('暂停','Pause'):L('运行','Run');}
elPlay.addEventListener('click',()=>{playing=!playing;setPlayLabel();});
const tglLabels=document.getElementById('tglLabels');
tglLabels.addEventListener('change',()=>{labelsOn=tglLabels.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{
  LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();
});
document.getElementById('themeBtn').addEventListener('click',()=>{
  THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();
});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();elPlay.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
if(qs.get('labels')==='0'){tglLabels.checked=false;labelsOn=false;}

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function ionCount(c){return clamp(Math.round(6+40*(Math.log10(c)+9)/7),2,NM);}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    /* 开场 2.5 s 自动演示一次滴定(招牌瞬间) */
    if(!demoDone){demoT-=dt;if(demoT<=0){demoDone=true;titrate();}}
    equilibrate(dt);
    if(titT<1){
      titT+=dt*1.2;
      drop.position.set(0,lerp(2.4,1.1,Math.min(titT*1.4,1)),0);
      if(titT>=0.55&&!drop.userData.done){
        drop.userData.done=true;
        cm=Math.min(1e-2,cm*2.4);syncSliders();
      }
      if(titT>=1){drop.visible=false;drop.userData.done=false;}
    }
  }
  /* 离子布朗运动 */
  const nM=ionCount(cm),nA=ionCount(ca);
  for(let i=0;i<NM;i++){
    const on=i<nM,o=ionsM[i];
    if(on&&(!o.x&&!o.y&&!o.z)){o.x=(Math.random()*2-1)*1.3;o.z=(Math.random()*2-1)*1.3;o.y=Math.random()*2.0-0.9;}
    if(on){
      o.x+=gauss()*0.02;o.z+=gauss()*0.02;o.y+=gauss()*0.013;
      const r=Math.hypot(o.x,o.z);
      if(r>1.42){o.x*=1.42/r;o.z*=1.42/r;}
      o.y=clamp(o.y,-0.95,1.3);
      dummy.position.set(o.x,o.y,o.z);dummy.scale.setScalar(1);
    }else{dummy.position.set(0,-10,0);dummy.scale.setScalar(0.001);}
    dummy.updateMatrix();ionMeshM.setMatrixAt(i,dummy.matrix);
  }
  for(let i=0;i<NM;i++){
    const on=i<nA,o=ionsA[i];
    if(on&&(!o.x&&!o.y&&!o.z)){o.x=(Math.random()*2-1)*1.3;o.z=(Math.random()*2-1)*1.3;o.y=Math.random()*2.0-0.9;}
    if(on){
      o.x+=gauss()*0.02;o.z+=gauss()*0.02;o.y+=gauss()*0.013;
      const r=Math.hypot(o.x,o.z);
      if(r>1.42){o.x*=1.42/r;o.z*=1.42/r;}
      o.y=clamp(o.y,-0.95,1.3);
      dummy.position.set(o.x,o.y,o.z);dummy.scale.setScalar(1);
    }else{dummy.position.set(0,-10,0);dummy.scale.setScalar(0.001);}
    dummy.updateMatrix();ionMeshA.setMatrixAt(i,dummy.matrix);
  }
  ionMeshM.instanceMatrix.needsUpdate=true;
  ionMeshA.instanceMatrix.needsUpdate=true;
  /* 沉淀堆 */
  const np=clamp(Math.round(solid*2.5e5),0,NP);
  for(let i=0;i<NP;i++){
    if(i<np){dummy.position.set(pile[i][0],pile[i][1],pile[i][2]);dummy.scale.setScalar(1);}
    else{dummy.position.set(0,-10,0);dummy.scale.setScalar(0.001);}
    dummy.updateMatrix();pileMesh.setMatrixAt(i,dummy.matrix);
  }
  pileMesh.instanceMatrix.needsUpdate=true;
  /* 白浊云 */
  if(cloudT<1){
    cloudT+=dt*1.4;
    clouds.forEach(c=>{
      c.m.scale.setScalar(0.4+cloudT*1.6);
      c.m.material.opacity=Math.max(0,0.5*(1-cloudT));
      if(cloudT>=1)c.m.visible=false;
    });
    liquid.material.opacity=0.12+Math.max(0,0.22*(1-cloudT*2));
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();syncSteps();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.fn();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();setSalt(0);setPlayLabel();
if(document.hidden)stop();else start();
</script>
</body>
</html>
