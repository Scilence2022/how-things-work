<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帕斯卡液压机 · 一只手抬起一辆车</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff8787;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#f0efed; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,135,135,.6); background: rgba(255,135,135,.12); color: var(--text); }
  .abtn.crash { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(201,42,42,.55); background: rgba(201,42,42,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,135,135,.10); border-color: rgba(255,135,135,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="帕斯卡液压机:一只手抬起一辆车" data-en="Pascal's Hydraulic Press: One Hand Lifts a Car">帕斯卡液压机:一只手抬起一辆车</h1>
  <div class="sub" data-zh="密闭液体里,压强原样传到每个角落(帕斯卡):小活塞压出的 p=F₁/A₁,在大活塞上被 A₂ 整体「乘」回来——F₂ = F₁·A₂/A₁;白捡的力要用行程还:F₁·s₁ = F₂·s₂;管路里混进气泡,力量就被气泡吃掉 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="In a sealed fluid, pressure reaches every corner undiminished (Pascal): the small piston makes p=F₁/A₁ and the large piston multiplies it by A₂ — F₂ = F₁·A₂/A₁; the borrowed force is paid back in stroke: F₁·s₁ = F₂·s₂; an air bubble in the line eats the force · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">帕斯卡液压机:一只手抬起一辆车</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="压强 p" data-en="Pressure">压强 p</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="输出力 F₂" data-en="Force F₂">输出力 F₂</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="每泵行程 s₂" data-en="Stroke s₂">每泵行程 s₂</span><span class="v" id="stS">—</span>
  <span class="k" data-zh="已举升" data-en="Lifted">已举升</span><span class="v ok" id="stH">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v ok" id="stSt">—</span>
</div>

<div id="plot">
  <h3 data-zh="输出力 F₂ 随面积比放大 · 虚线=车重 13.7 kN · 圆点=当前" data-en="Output force F₂ grows with area ratio · dashed = car weight 13.7 kN · dot = now">输出力 F₂ 随面积比放大 · 虚线=车重 13.7 kN · 圆点=当前</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="手按力 F₁" data-en="hand force F₁">手按力 F₁</span>
    <span class="chip.g" data-zh="输出力 F₂" data-en="output F₂">输出力 F₂</span>
    <span class="chip.o" data-zh="车重" data-en="car weight">车重</span>
  </div>
  <div id="actions">
    <button class="abtn crash" id="btnBubble" data-zh="管路进气(失灵)" data-en="air in the line (fail)">管路进气(失灵)</button>
    <button class="abtn" id="btnRelease" data-zh="开泄压阀降落" data-en="open release valve">开泄压阀降落</button>
    <button class="abtn" id="btnMagic" data-zh="一键:够力比值抬车" data-en="preset: lift ratio">一键:够力比值抬车</button>
  </div>
  <div class="row"><label data-zh="面积比 A₂/A₁" data-en="Area ratio">面积比 A₂/A₁</label><input id="ratio" type="range" min="0" max="100" step="1" value="25"><span class="val" id="ratioVal">×25</span></div>
  <div class="row"><label data-zh="手按力 F₁" data-en="Hand force">手按力 F₁</label><input id="force" type="range" min="50" max="500" step="10" value="200"><span class="val" id="forceVal">200 N</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../ship-buoyancy/" data-zh="静水压强的另一课:浮力与稳性" data-en="another static-fluid lesson: buoyancy">静水压强的另一课:浮力与稳性</a>
    <a href="../abs-brakes/" data-zh="液压的日常:ABS 刹车" data-en="hydraulics at work: ABS brakes">液压的日常:ABS 刹车</a>
    <a href="../worm-drive/" data-zh="省力的另一条路:蜗杆自锁" data-en="another way to multiply force: worm drive">省力的另一条路:蜗杆自锁</a>
    <a href="../water-hammer/" data-zh="液体传力的另一面:水锤" data-en="the other face of liquid force: water hammer">液体传力的另一面:水锤</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x18243a, 18, 46);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
  scene.fog.color = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('帕斯卡液压机 · 一只手抬起一辆车', "Pascal's Press · One Hand Lifts a Car");
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setToggleBtns();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(8.5, 4.6, 11.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.4, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 26;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(4, 8, 6);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 地台 ================= */
const ground = new THREE.Mesh(new THREE.BoxGeometry(15, 0.5, 8), mat(0x39414d, { opacity: 1 }));
ground.position.y = -2.45;
scene.add(ground);

/* ================= 液压系统几何 ================= */
const A1 = 1e-3;                                        // 小活塞面积 10 cm²
const S1 = 0.20;                                        // 每冲程小活塞行程 0.2 m
const CAR_W = 1400 * 9.81;                              // 车重 N ≈ 13.7 kN
const LIFT_EXAG = 15;                                   // 大活塞举升显示放大
let ratio = clamp(qsFloat('r', 25), 1, 100);            // 面积比 A₂/A₁
let F1 = clamp(qsFloat('f', 200), 50, 500);             // N
let bubble = qsBool('bubble', false);
let release = false;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let spinOn = qsBool('spin', true);
let tGlob = 0, liftPhys = 0, pumpPh = 0;
const pOf = () => F1 / A1;                              // Pa
const A2of = () => A1 * ratio;
const F2of = () => pOf() * A2of();
const s2of = () => S1 * A1 / A2of();                    // m/冲程
const canLift = () => F2of() >= CAR_W;

/* 小油缸(玻璃)+ 小活塞 + 手柄 */
const cylGlass = new THREE.MeshStandardMaterial({ color: 0xa8c8e8, roughness: 0.12, metalness: 0.05,
  transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false });
const smallX = -3.2, bigX = 2.6;
const smallCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 3.0, 24), cylGlass);
smallCyl.position.set(smallX, -0.95, 0);
scene.add(smallCyl);
const smallPiston = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.31, 0.22, 24), mat(0xd8dee5, { opacity: 1, metalness: 0.7, roughness: 0.3 }));
scene.add(smallPiston);
const smallRod = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.3, 10), mat(0x9aa7b5, { opacity: 1, metalness: 0.7 }));
smallRod.position.y = 0.75;
smallPiston.add(smallRod);
const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.5, 12), mat(0xd29a3a, { opacity: 1 }));
handle.rotation.z = Math.PI / 2;
handle.position.y = 1.38;
smallPiston.add(handle);
/* 大油缸(玻璃,半径随比值重建)+ 大活塞 + 托架 */
const bigCyl = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1.35, 40), cylGlass);

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 18, padB = 22;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const fMax = 22;
  const xOf = r => pad + (W - 2 * pad) * (Math.log10(clamp(r, 1, 100))) / 2;
  const yOf = f => pad + (H - pad - padB) * (1 - clamp(f, 0, fMax) / fMax);
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - padB); ctx.lineTo(W - pad, H - padB); ctx.stroke();
  /* 可抬区 */
  const fy = yOf(CAR_W / 1000);
  ctx.fillStyle = 'rgba(105,219,124,.12)';
  ctx.fillRect(pad, pad, W - 2 * pad, fy - pad);
  /* F₂ 曲线 */
  ctx.strokeStyle = '#69db7c'; ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const r = Math.pow(10, i / 60 * 2);
    const f = F1 * r / 1000;
    const x = xOf(r), y = yOf(f);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* 车重线 */
  ctx.setLineDash([7, 5]);
  ctx.strokeStyle = '#ffa94d'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(pad, fy); ctx.lineTo(W - pad, fy); ctx.stroke();
  ctx.setLineDash([]);
  /* 当前点 */
  const cx = xOf(ratio), cy = yOf(F2of() / 1000);
  ctx.fillStyle = canLift() ? '#69db7c' : '#ff6b6b';
  ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '13px system-ui';
  ctx.fillText('A₂/A₁', W - pad - 42, H - 5);
  ctx.fillText('F₂ kN', pad + 2, pad + 14);
  ctx.fillStyle = '#ffa94d';
  ctx.fillText(L('车重', 'weight'), W - pad - 46, fy - 6);
  /* 对数刻度 */
  ctx.fillStyle = cTxt;
  for (const r of [1, 10, 100]) ctx.fillText('×' + r, xOf(r) - 8, H - 5);
}

/* ================= 泵油与举升动力学 ================= */
const PPS = 1.6;                                        // 泵速(冲程/秒,基准)
function updatePump(dt) {
  if (release) {
    liftPhys = Math.max(0, liftPhys - dt * 0.045);
    return;
  }
  if (!playing) return;
  pumpPh += dt * PPS;
  const pressing = Math.sin(pumpPh * Math.PI * 2) > 0;
  if (pressing && canLift()) {
    liftPhys += dt * (s2of() * PPS) * (bubble ? 0.12 : 1);
  }
}
const SMALL_TOP = -1.95, SMALL_TRAVEL = 0.6;            // 小活塞显示行程
const BIG_BASE = -0.28, BIG_MAX = 1.55;
function updatePoses(dt) {
  const frac = Math.max(0, Math.sin(pumpPh * Math.PI * 2));
  const pressDip = (playing && !release) ? frac * SMALL_TRAVEL : 0;
  smallPiston.position.set(smallX, SMALL_TOP + 0.15 + pressDip * (bubble ? 0.65 : 1), 0);
  smallFluid.scale.y = clamp(SMALL_TOP + 0.15 + pressDip - (-1.95), 0.15, 3);
  smallFluid.position.set(smallX, -1.95 + smallFluid.scale.y / 2, 0);
  const liftD = clamp(liftPhys * LIFT_EXAG, 0, BIG_MAX);
  bigPiston.position.set(bigX, BIG_BASE + liftD, 0);
  const rd = 0.34 * Math.sqrt(ratio);
  bigFluid.scale.y = clamp(BIG_BASE + liftD - (-1.95), 0.15, 3.25);
  bigFluid.position.set(bigX, -1.95 + bigFluid.scale.y / 2, 0);
  car.position.set(bigX, BIG_BASE + liftD + 0.24, 0);
  /* 气泡被压瘪 */
  const bScale = bubble ? clamp(1 - pOf() / 4e5 * (0.4 + 0.6 * frac), 0.25, 1) : 1;
  bubbleMesh.scale.setScalar(bubble ? bScale : 1);
  bubbleMesh.visible = bubble;
  /* 压强表指针 */
  const pK = pOf() / 1000 * (bubble ? 0.55 + 0.1 * Math.sin(tGlob * 13) : release ? 0.35 : 1);
  const ang = clamp(pK / 400, 0, 1) * 2.4 - 1.2;
  needle.rotation.z = lerp(needle.rotation.z, -ang, dt > 0 ? 0.2 : 1);
  /* 力箭头长度(对数) */
  const f1l = clamp(0.4 + 1.4 * (Math.log10(F1 / 50) / Math.log10(10)), 0.4, 1.8);
  arrF1.scale.y = lerp(arrF1.scale.y, f1l, 0.2);
  arrF1.position.y = smallPiston.position.y + 2.9;
  const f2k = F2of() * (bubble ? 0.15 : 1) / 1000;
  const f2l = clamp(0.4 + 1.6 * Math.log10(Math.max(f2k, 0.05) / 0.1) / Math.log10(300), 0.3, 2.2);
  arrF2.scale.y = lerp(arrF2.scale.y, f2l, 0.2);
  arrF2.position.y = BIG_BASE + liftD - f2l * 0.5 - 0.15;
  const wl = clamp(0.4 + 1.6 * Math.log10(13.7 / 0.1) / Math.log10(300), 0.3, 2.2);
  arrW.scale.y = lerp(arrW.scale.y, wl, 0.2);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * (playing ? speed : 0);
  tGlob += dt0;
  updatePump(dt);
  updatePoses(dt0);
  statsAcc += dt0;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stP.textContent = (pOf() * (bubble ? 0.3 : 1) / 1000).toFixed(0) + ' kPa';
    const f2k = F2of() * (bubble ? 0.15 : 1) / 1000;
    stF.textContent = f2k.toFixed(1) + ' kN';
    stF.className = 'v ' + (canLift() ? 'ok' : f2k > CAR_W / 20000 ? 'warn' : 'bad');
    stS.textContent = (s2of() * 1000).toFixed(1) + ' mm';
    stH.textContent = (liftPhys * 100).toFixed(1) + ' cm';
    stSt.textContent = bubble ? L('失灵 ⚠', 'FAILED ⚠')
      : release ? L('泄压降落', 'releasing')
      : canLift() ? (liftPhys > 0.005 ? L('举升中 ⬆', 'lifting ⬆') : L('待泵油', 'ready'))
      : L('力不够', 'too weak');
    stSt.className = 'v ' + (bubble ? 'bad' : canLift() ? 'ok' : 'warn');
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
