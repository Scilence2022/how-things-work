<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四季与黄赤交角 · 23.5° 把一年掰成四季</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.s { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.e { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.b { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="四季与黄赤交角:23.5° 把一年掰成四季" data-en="Seasons &amp; Tilt: 23.5° splits the year">四季与黄赤交角：23.5° 把一年掰成四季</h1>
  <div class="sub" data-zh="关键不是离太阳远近——而是 23.5° 倾角让同一地方的正午太阳高度与昼长都跟着变 · 空格播放/暂停" data-en="Not distance from the Sun — but the 23.5° tilt that swings local noon altitude and day length across the year · Space = play/pause">关键不是离太阳远近——而是 23.5° 倾角让同一地方的正午太阳高度与昼长都跟着变 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="当前月份" data-en="month">当前月份</span><span class="v g" id="stM" style="font-size:14px">—</span>
  <span class="k" data-zh="北半球昼长(h)" data-en="N day length">北半球昼长(h)</span><span class="v" id="stD">—</span>
  <span class="k" data-zh="正午太阳高度角" data-en="noon altitude">正午太阳高度角</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="地日距离" data-en="Sun distance">地日距离</span><span class="v" style="font-size:14px">1.5 亿 km</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.s" data-zh="太阳(黄,中心)" data-en="sun (yellow, centre)">太阳(黄,中心)</span>
    <span class="chip.e" data-zh="地球(蓝,绕日)" data-en="earth (blue, orbits Sun)">地球(蓝,绕日)</span>
    <span class="chip.b" data-zh="太阳直射点(红)" data-en="sun-subsolar point (red)">太阳直射点(红)</span>
  </div>
  <div class="row"><label data-zh="月份" data-en="month">月份</label><input id="month" type="range" min="0" max="11" step="1" value="2"><span class="val" id="monthVal">3 月</span></div>
  <div class="row"><label data-zh="轴倾角" data-en="obliquity">轴倾角</label><input id="tilt" type="range" min="0" max="1000" step="5" value="435"><span class="val" id="tiltVal">23.5°</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../orbital-mechanics/" data-zh="更基础:开普勒轨道" data-en="foundation: Kepler orbits">更基础:开普勒轨道</a>
    <a href="../moon-phases/" data-zh="另一支:月地系统" data-en="the other arm: lunar system">另一支:月地系统</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
function parseFloatSafe(k, d) {
  const v = parseFloat(k);
  return Number.isFinite(v) ? v : d;
}
const qsBool = (k, d) => { const v = k; return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xe0e9f3 : 0x05070d);
  starMat.opacity = THEME === 'dark' ? 0.6 : 0;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('四季与黄赤交角', 'Seasons & Tilt');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.5, 2.2, 7.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(5, 4, 4);
scene.add(key);

/* 星空 */
const starMat = new THREE.PointsMaterial({ color: 0x9fb0c3, size: 0.04, transparent: true, opacity: 0.6 });
{
  const g = new THREE.BufferGeometry();
  const N = 300, arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, r = 12 + Math.random() * 18;
    arr[i * 3] = Math.cos(a) * r; arr[i * 3 + 1] = (Math.random() - 0.3) * 14; arr[i * 3 + 2] = Math.sin(a) * r;
  }
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  scene.add(new THREE.Points(g, starMat));
}

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  sun: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  earth: mat(0x3a7ec0, { opacity: 1 }),
  continent: mat(0x2f6b4f, { opacity: 1 }),
  poleIce: mat(0xd8e8ff, { opacity: 0.9 }),
  ring: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.6 }),
  sunPoint: new THREE.MeshBasicMaterial({ color: 0xff6b6b, blending: THREE.AdditiveBlending, transparent: true }),
};

/* ================= 太阳(中心) ================= */
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 18), M.sun);
scene.add(sun);

/* 地球轨道 */
const earthOrbit = new THREE.Mesh(new THREE.TorusGeometry(3.6, 0.008, 6, 90),
  new THREE.MeshBasicMaterial({ color: 0x5a6a7a, transparent: true, opacity: 0.4 }));
scene.add(earthOrbit);

/* 地球组(轨道 + 自转轴) */
const earthSys = new THREE.Group();   // 沿轨道移动
scene.add(earthSys);
const earthTilt = new THREE.Group();   // 倾角
earthSys.add(earthTilt);
const earth = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 24), M.earth);
earthTilt.add(earth);
/* 大陆(几个绿色斑块) */
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.18 + Math.random() * 0.1, 12, 10), M.continent);
  const a = Math.random() * Math.PI * 2, b = (Math.random() - 0.3) * Math.PI * 0.8;
  m.position.set(Math.sin(b) * Math.cos(a) * 0.5, Math.cos(b) * 0.5, Math.sin(b) * Math.sin(a) * 0.5);
  earthTilt.add(m);
}
/* 极冠(随季节变化) */
const polarN = new THREE.Mesh(new THREE.SphereGeometry(0.52, 16, 12, 0, Math.PI * 2, 0, Math.PI / 3), M.poleIce);
polarN.position.y = 0.02;
earthTilt.add(polarN);
const polarS = new THREE.Mesh(new THREE.SphereGeometry(0.52, 16, 12, 0, Math.PI * 2, 0, Math.PI / 3), M.poleIce.clone());
polarS.position.y = -0.02;
earthTilt.add(polarS);

/* 自转轴杆 */
const axisRod = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1.4, 8),
  new THREE.MeshBasicMaterial({ color: 0x8a93a3 }));
earthTilt.add(axisRod);
/* 太阳直射点(红点) */
const sunPt = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), M.sunPoint);
scene.add(sunPt);

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let monthIdx = parseFloatSafe(qs.get('m'), 2);    // 0..11
let tiltDeg = parseFloatSafe(qs.get('t'), 23.5);
let tSim = 0;
const MONTHS = ['1 月', '2 月', '3 月', '4 月', '5 月', '6 月', '7 月', '8 月', '9 月', '10 月', '11 月', '12 月'];
const MONTHS_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblMonth = addLabel(() => {
  const m = MONTHS[Math.round(monthIdx) % 12];
  const e = MONTHS_EN[Math.round(monthIdx) % 12];
  const t = monthIdx - Math.round(monthIdx);
  if (Math.abs(t) < 0.05) return L(`当前:${m} — 太阳直射点决定了季节`, `Now: ${e} — subsolar point drives the season`);
  return L(`${m} 直射点滑到这`, `${e} subsolar here`);
}, new THREE.Vector3(0, 3.5, 0), 'g');
const lblNday = addLabel(() => {
  if (Math.abs(tiltDeg) < 0.5) return L('轴倾=0°:没有四季,同一纬度全年昼夜等长、太阳同高', 'tilt=0: no seasons — equal days, equal Sun, every latitude forever');
  if (monthIdx > 5.4 && monthIdx < 6.6) return L('6 月:北半球夏至——太阳直射北回归线,昼最长+23.5° 高度角', 'June: N summer solstice — Sun on the Tropic of Cancer, longest day + max altitude');
  if (monthIdx > 11.4 || monthIdx < 0.6) return L('12 月:北半球冬至——太阳直射南回归线,昼最短+最低高度角', 'December: N winter solstice — Sun on the Tropic of Capricorn, shortest day');
  if (Math.abs(monthIdx - 3) < 0.3 || Math.abs(monthIdx - 9) < 0.3) return L('3/9 月:春分秋分——太阳直射赤道,昼夜平分', 'Mar/Sep equinox — Sun on the equator, day = night');
  return '';
}, new THREE.Vector3(0, -1.6, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '距离其实不是关键', be: 'Distance isn\'t the point',
    d: '1 月地球离太阳最近(近日点),北半球却是冬——距离差 3.4%,日照差 6.8%,不足以解释夏热冬冷。关键在「地轴倾角」。',
    de: 'Earth is closest to the Sun in January — the Northern Hemisphere is then in winter. The 3.4% distance shift gives only 6.8% more sunlight, not enough for the seasons. The tilt is the key.',
    act: () => {} },
  { b: '23.5° 把全年掰成四季', be: '23.5° divides the year',
    d: '地轴倾斜→同一地点全年「中午太阳高度角」从 23.5°+90° 变到 23.5°-90°;同时「昼长」夏长冬短——两者合成夏热冬冷。',
    de: 'The tilt swings local noon Sun altitude from +23.5°-90° over the year while day length stretches in summer and shrinks in winter — together they make summer hot and winter cold.',
    act: () => {} },
  { b: '夏至/冬至/分点', be: 'Solstices & equinoxes',
    d: '6/12 月夏至/冬至:太阳直射 23.5° 纬度,那半球的昼达到最长/最短;3/9 月春分/秋分:直射赤道,全球昼夜各半。',
    de: 'June/December solstices: Sun at ±23.5° latitude, day max/min in that hemisphere. March/September equinoxes: Sun on the equator, day = night everywhere.',
    act: () => {} },
  { b: '23.5°→45°:四季加倍', be: '23.5° → 45°: seasons doubled',
    d: '把倾角拉到 45°,夏季直射变成天顶 + 昼长达 18h,冬季 6h——极端气候;拖到 0°:所有纬度全年一致,没有四季。',
    de: 'Push the tilt to 45°: summer Sun overhead and day 18 hours long, winter only 6. Drag to 0°: every latitude is steady all year — no seasons at all.',
    act: () => { document.getElementById('tilt').value = 900; document.getElementById('tilt').dispatchEvent(new Event('input')); } },
  { b: '行星的多样性', be: 'Why Mars is spiky',
    d: '火星倾角 25°(与地接近)却比地更极端——因为火星轨道偏心率 0.093,近日点附近夏季极热,远日点附近极冷。木星倾角 3°,几乎无季节。',
    de: 'Mars tilts 25° (close to Earth) but swings harder — its orbit is far more elliptical (0.093), so summer near perihelion is fierce, winter near aphelion bitter. Jupiter tilts 3° and barely has seasons.',
    act: () => {} },
];
function stepIndex() {
  if (Math.abs(tiltDeg) < 0.5) return 3;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elMonth = document.getElementById('month');
const elMonthVal = document.getElementById('monthVal');
const elTilt = document.getElementById('tilt');
const elTiltVal = document.getElementById('tiltVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elMonth.addEventListener('input', e => {
  monthIdx = parseInt(e.target.value);
  elMonthVal.textContent = MONTHS[monthIdx];
});
elTilt.addEventListener('input', e => {
  tiltDeg = parseInt(e.target.value) / 1000 * 60;
  elTiltVal.textContent = tiltDeg.toFixed(1) + '°';
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.textContent = r.text();
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
elMonthVal.textContent = MONTHS[monthIdx];
elTiltVal.textContent = tiltDeg.toFixed(1) + '°';

/* ================= 应用 ================= */
function apply() {
  /* 地球沿轨道位置:month 0..11 对应 0..2π */
  const a = (monthIdx + 0) / 12 * Math.PI * 2;
  const R = 3.6;
  earthSys.position.set(Math.cos(a) * R, 0, Math.sin(a) * R);
  /* 倾角 = 月位置相对夏至方向:夏至(6月)=月直指北 23.5° */
  const tiltAng = (monthIdx - 6) / 12 * Math.PI * 2;       // 月在轨道的位置
  const curTilt = tiltDeg * Math.PI / 180;
  earthTilt.rotation.z = curTilt;
  earthTilt.rotation.y = -tiltAng;
  /* 自转 */
  earth.rotation.y += 0.002;
  /* 太阳直射点(相对地球的位置):黄赤交角投影 */
  /* 当 tiltDeg > 0,直射点相对地心南北移动 cos(tiltAng)*tiltDeg */
  const declination = Math.sin(tiltAng) * curTilt;
  const subPoint = new THREE.Vector3(Math.sin(declination) * 1.0, 0, 0);  // 在地球表面
  const worldSub = earth.position.clone().add(subPoint);
  sunPt.position.copy(worldSub);
  sunPt.material.opacity = 0.7 + 0.3 * Math.sin(tSim * 3);
  /* 极冠大小随月份变化 */
  const ice = Math.cos(tiltAng) * 0.5 + 0.5;
  polarN.scale.y = 0.4 + ice * 0.8;
  polarS.scale.y = 0.4 + (1 - ice) * 0.8;
  polarN.material.opacity = 0.4 + ice * 0.5;
  polarS.material.opacity = 0.4 + (1 - ice) * 0.5;

  /* 北半球昼长:6月最长(约 14h),12月最短(约 10h),分点 12h */
  const dayLen = 12 + Math.sin(-tiltAng) * tiltDeg * 24 / 360 * 24;
  document.getElementById('stM').textContent = MONTHS[Math.round(monthIdx) % 12];
  document.getElementById('stD').innerHTML = dayLen.toFixed(1) + '<small> h(演示)</small>';
  /* 北半球正午太阳高度角:90 - |纬度 - 23.5*cos(tiltAng)| (假设北回归线 23.5°N) */
  /* 简化:北回归线上看 */
  const lat = 23.5 * Math.PI / 180;
  const alt = Math.PI / 2 - Math.abs(lat - declination);
  document.getElementById('stA').innerHTML = (alt * 180 / Math.PI).toFixed(0) + '<small>°(演示)</small>';
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  if (playing) {
    monthIdx = (monthIdx + dts * 0.05) % 12;
    document.getElementById('month').value = Math.round(monthIdx);
    elMonthVal.textContent = MONTHS[Math.round(monthIdx)];
  }
  apply();

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
