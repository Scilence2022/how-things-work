<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四季与黄赤交角 · 轴指北极星,与距离无关</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);

    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);

  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }

  .lbl.st { border-color: rgba(255,209,102,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; box-shadow: none; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { color: #9c6f00; }
  :root[data-theme="light"] .lbl.b { color: #0c7ba6; }
  :root[data-theme="light"] .lbl.r { color: #b03a26; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);

  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }

  #chartWrap { position: fixed; top: 60px; right: 18px; z-index: 4; width: 300px;

    padding: 6px 8px 4px; backdrop-filter: blur(6px); pointer-events: none; }
  #chart { width: 100%; height: 196px; display: block; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 396px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }

  .chip.e { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.b { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .chip.r { color: #ffc4b5; border-color: rgba(255,122,92,.7); }
  :root[data-theme="light"] .chip.s { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  :root[data-theme="light"] .chip.e { color: #0c7a52; border-color: rgba(20,150,100,.7); }
  :root[data-theme="light"] .chip.b { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.r { color: #b03a26; border-color: rgba(196,68,48,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;

  #steps li.on .n { background: var(--acc); color: #fff; }

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const TAU = Math.PI * 2, DEG = Math.PI / 180;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
const scene = new THREE.Scene();
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xe0e9f3 : 0x05070d);
  stars.visible = THEME === 'dark';
  halo1.material.opacity = THEME === 'dark' ? 0.9 : 0.5;
  halo2.material.opacity = THEME === 'dark' ? 0.5 : 0.25;
  photons.material.opacity = THEME === 'dark' ? 0.42 : 0.26;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('四季与黄赤交角 · 轴指北极星,与距离无关', 'Seasons & Tilt · axis locked on Polaris, not distance');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  updateFormula();
  syncDoyUI();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 140);
camera.position.set(4.6, 3.8, 6.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.1;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.3;

/* 平行日光:DirectionalLight 照向地球,晨昏线是真正的大圆 */
const sunLight = new THREE.DirectionalLight(0xfff2cc, 2.6);
scene.add(sunLight, sunLight.target);
scene.add(new THREE.HemisphereLight(0x9db4d6, 0x1c2026, 0.32));

/* 星空(InstancedMesh) */
const stars = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.05, 0),
  new THREE.MeshBasicMaterial({ color: 0xcfd8ea, transparent: true, opacity: 0.7 }), 260);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < 260; i++) {
    const a = Math.random() * TAU, b = Math.acos(2 * Math.random() - 1), r = 28 + Math.random() * 24;
    p.set(Math.sin(b) * Math.cos(a) * r, Math.cos(b) * r * 0.8, Math.sin(b) * Math.sin(a) * r);
    const k = 0.5 + Math.random() * 1.4;
    s.set(k, k, k);
    m.compose(p, q, s);
    stars.setMatrixAt(i, m);
  }
  scene.add(stars);
}

/* ================= 轨道物理:真开普勒方程 ================= */
const YEAR = 365.25, ECC = 0.0167, AU = 149.6;
const PERI_DOY = 3, PSI_PERI = 283 * DEG;          // 1/4 过近日点,近日点黄经 283°
const R_ORB = 3.6, R_E = 0.55;
const R_PERI = (AU * (1 - ECC)).toFixed(1);        // 147.1
const R_APH = (AU * (1 + ECC)).toFixed(1);         // 152.1
const KM_GAP = (2 * ECC * AU).toFixed(1);          // 5.0
const FLUX_PCT = (((1 + ECC) / (1 - ECC)) ** 2 - 1) * 100;   // 6.9
const keplerE = (Mx, e) => { let E = Mx; for (let i = 0; i < 8; i++) E -= (E - e * Math.sin(E) - Mx) / (1 - e * Math.cos(E)); return E; };
/* 日 d → 真近点角 ν 与向径 r(AU);ψ = 黄经(画面系:春分 0°,夏至 90°) */
function stateOf(d) {
  const E = keplerE(TAU * (((d - PERI_DOY) / YEAR % 1 + 1) % 1), ECC);
  const nu = 2 * Math.atan2(Math.sqrt(1 + ECC) * Math.sin(E / 2), Math.sqrt(1 - ECC) * Math.cos(E / 2));
  return { psi: PSI_PERI + nu, r: 1 - ECC * Math.cos(E) };
}
/* ψ 反解日期:tan(E/2)=√((1−e)/(1+e))·tan(ν/2),M=E−e·sinE */
function dOfPsi(psi) {
  let nu = (psi - PSI_PERI) % TAU;
  if (nu > Math.PI) nu -= TAU;
  if (nu < -Math.PI) nu += TAU;
  const E = 2 * Math.atan(Math.sqrt((1 - ECC) / (1 + ECC)) * Math.tan(nu / 2));

const chartWrap = document.getElementById('chartWrap');
const chart = document.getElementById('chart');
function drawChart() {
  const dpr = Math.min(devicePixelRatio, 2);
  const W = chart.clientWidth, H = chart.clientHeight;
  if (!W) return;
  if (chart.width !== Math.round(W * dpr)) { chart.width = Math.round(W * dpr); chart.height = Math.round(H * dpr); }
  const g = chart.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const Lm = 24, Rm = 26, Tm = 26, pw = W - Lm - Rm, MAIN = H - Tm - 54;
  const laneY = H - 34, laneH = 18, laneMid = laneY + laneH / 2;
  const X = d => Lm + d / YEAR * pw;
  const Ya = a => Tm + (1 - a / 90) * MAIN;
  const Yd = h => Tm + (1 - h / 24) * MAIN;
  const ink = THEME === 'dark' ? '#9fb0c3' : '#5b6b7d';
  const grid = THEME === 'dark' ? 'rgba(255,255,255,.14)' : 'rgba(15,25,40,.14)';
  g.font = '10px "PingFang SC", sans-serif';
  g.fillStyle = THEME === 'dark' ? '#c7d2de' : '#33414f';
  g.textAlign = 'left';
  g.fillText(L(`${latName()} · 倾角 ${tilt.toFixed(1)}°`, `${latName()} · tilt ${tilt.toFixed(1)}°`), Lm, 12);
  g.fillStyle = '#ffd166';
  g.fillText(L('— 正午高度°', '— noon alt°'), W - Rm - 104, 12);
  g.fillStyle = '#74c0fc';
  g.fillText(L('— 昼长h', '— day h'), W - Rm - 48, 12);
  g.strokeStyle = grid;
  g.fillStyle = ink;
  g.lineWidth = 1;
  for (const a of [30, 60, 90]) {
    g.beginPath(); g.moveTo(Lm, Ya(a)); g.lineTo(Lm + pw, Ya(a)); g.stroke();
    g.textAlign = 'right'; g.fillText(String(a), Lm - 4, Ya(a) + 3);
  }
  g.textAlign = 'left';
  for (const h of [6, 12, 18, 24]) g.fillText(String(h), Lm + pw + 4, Yd(h) + 3);
  g.strokeRect(Lm, Tm, pw, MAIN);
  g.setLineDash([3, 3]);
  g.strokeStyle = grid;
  g.textAlign = 'center';
  for (const q of QUARTERS) {
    g.beginPath(); g.moveTo(X(q.d), Tm); g.lineTo(X(q.d), Tm + MAIN); g.stroke();
    g.fillStyle = ink;
    g.fillText(L(q.zh, q.en), X(q.d), Tm + MAIN + 11);
  }
  g.setLineDash([]);
  const alts = [], days = [], irrs = [];
  for (let d = 0; d <= 364; d += 2) {
    const s = stateOf(d);
    alts.push(noonAlt(s.psi, lat));
    days.push(dayLen(s.psi, lat));
    irrs.push(1 / (s.r * s.r));
  }
  g.lineWidth = 1.6;
  g.strokeStyle = '#ffd166';
  g.fillStyle = '#ffd166';
  g.beginPath();
  g.beginPath();
  let pen = false;
  alts.forEach((a, i) => {
    const x = X(i * 2);
    if (a > 0) { const y = Ya(a); pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; }
    else {
      if (pen) { g.lineTo(x, Ya(0)); g.stroke(); g.beginPath(); pen = false; }
      g.beginPath(); g.arc(x, Ya(0), 1.4, 0, TAU); g.fill();
      g.beginPath();
    }
  });
  if (pen) { g.lineTo(X(364), Ya(Math.max(alts[alts.length - 1], 0))); g.stroke(); }
  g.strokeStyle = '#74c0fc';
  g.beginPath();
  days.forEach((h, i) => { const x = X(i * 2), y = Yd(h); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
  g.strokeStyle = grid;
  g.strokeRect(Lm, laneY, pw, laneH);
  g.setLineDash([2, 3]);
  g.beginPath(); g.moveTo(Lm, laneMid); g.lineTo(Lm + pw, laneMid); g.stroke();
  g.setLineDash([]);
  g.strokeStyle = THEME === 'dark' ? '#8a97a8' : '#71808f';
  g.lineWidth = 1.2;
  g.beginPath();
  irrs.forEach((f, i) => {
    const x = X(i * 2), y = laneMid - (f - 1) / FLUX_PCT * 100 * laneH * 0.42;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
  g.fillStyle = ink;
  g.textAlign = 'right';
  g.fillText(L('距离说:日光功率 ±6.9%', 'distance theory: ±6.9% flux'), Lm + pw, laneY - 3);
  g.textAlign = 'center';
  for (const m of [0, 3, 6, 9]) {
    const cum = MDAYS.slice(0, m).reduce((a, b) => a + b, 0);
    g.fillText(L(`${m + 1}月`, MON_EN[m]), X(cum), H - 4);
  }
  g.strokeStyle = THEME === 'dark' ? 'rgba(255,255,255,.65)' : 'rgba(15,25,40,.55)';
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(X(doy), Tm); g.lineTo(X(doy), laneY + laneH); g.stroke();
  const sNow = stateOf(doy);
  g.fillStyle = '#ffd166';
  g.beginPath(); g.arc(X(doy), Ya(Math.max(noonAlt(sNow.psi, lat), 0)), 3, 0, TAU); g.fill();
  g.fillStyle = '#74c0fc';
  g.beginPath(); g.arc(X(doy), Yd(dayLen(sNow.psi, lat)), 3, 0, TAU); g.fill();
}

const STEPS = [
  { b: '先打脸「距离说」', be: 'First, kill the distance theory',
    d: `1 月初近日点 ${R_PERI}M km,比 7 月远日点只近 ${KM_GAP}M km(3.3%,日光功率 +6.9%)——北半球却在隆冬;何况夏半年(${WARM.toFixed(0)} 天)比冬半年(${COLD.toFixed(0)} 天)还长。`,
    de: `Early-January perihelion is ${R_PERI}M km — just ${KM_GAP}M km (3.3%, +6.9% sunlight) closer than July — yet the north is deep in winter; the warm half (${WARM.toFixed(0)} d) is even longer than the cold one (${COLD.toFixed(0)} d).`,
    act: () => { setTilt(23.5); setLat(40); setDoy(PERI_DOY); camTo(0, 8.4, 7.6); } },
  { b: '轴指向不变:锁定北极星', be: 'The axis stays locked on Polaris',
    d: '公转全程地轴保持平行——四根金色幽灵轴(四个节气处的地轴)与虚线始终指同一颗北极星。正是这份「不变」,让北极六月倒向太阳、十二月背向太阳。',
    de: 'Through the whole orbit the axis stays parallel — the four golden ghost axes (one per season) and the dashed ray lock on the same Polaris. That constancy tips the pole toward the Sun in June, away in December.',
    act: () => { setTilt(23.5); setDoy(QUARTERS[0].d); camTo(7.6, 3.2, 5.4); playing = true; setPlayLabel(); } },
  { b: '夏至:直射北回归线', be: 'June solstice: Tropic of Cancer',
    d: `6 月 21 日(${mdStr(QUARTERS[1].d)})太阳直射 +23.5°,北半球正午最高、昼最长,北极圈内极昼;注意地球正滑向远日点。`,
    de: `On Jun 21 (${mdStr(QUARTERS[1].d)}) the Sun stands at +23.5°: highest noon, longest day, polar night north of the circle — while Earth glides toward aphelion.`,
    act: () => { setTilt(23.5); setLat(23.5); setDoy(QUARTERS[1].d); camEarth(QUARTERS[1].d); } },
  { b: '冬至:直射南回归线', be: 'December solstice: Tropic of Capricorn',
    d: `12 月 22 日(${mdStr(QUARTERS[3].d)})直射 −23.5°,北半球正午最低、昼最短、极夜——而两周后就是近日点:冬天离太阳最近。`,
    de: `On Dec 22 (${mdStr(QUARTERS[3].d)}) the Sun stands at −23.5°: lowest noon, shortest day, polar night — perihelion follows in two weeks: winter rides closest to the Sun.`,
    act: () => { setTilt(23.5); setLat(23.5); setDoy(QUARTERS[3].d); camEarth(QUARTERS[3].d); } },
  { b: '春秋分:昼夜平分', be: 'Equinoxes: day equals night',
    d: '直射点跨过赤道,全球昼夜各 12h——晨昏线正好扫过两极,曲线图上两条线同时过中点,每年两次。',
    de: 'The subsolar point crosses the equator and day equals night (12 h) worldwide — the terminator sweeps both poles and both curves cross their midlines, twice a year.',
    act: () => { setTilt(23.5); setLat(0); setDoy(QUARTERS[2].d); camEarth(QUARTERS[2].d); } },
  { b: '思想实验:0° 与 45°', be: 'Thought experiment: 0° and 45°',
    d: '把倾角拖到 0°:两条年曲线彻底拉平,四季蒸发;拉到 45°:回归线与极圈相遇在 ±45°,连 66.5° 都有极昼极夜——四季的深浅完全由倾角定价。',
    de: 'Drag tilt to 0°: both curves flatten and seasons vanish. Push to 45°: tropics and polar circles meet at ±45°, even 66.5° gets midnight sun — tilt alone prices the seasons.',
    act: () => { setTilt(45); setLat(66.5); setDoy(QUARTERS[1].d); camTo(5.0, 4.0, 6.8); } },
];
function stepIndex() {
  if (tilt < 0.6 || tilt > 42) return 5;
  if (nearCirc(doy, PERI_DOY, 16)) return 0;
  if (nearCirc(doy, QUARTERS[1].d, 16)) return 2;
  if (nearCirc(doy, QUARTERS[3].d, 16)) return 3;
  if (nearCirc(doy, QUARTERS[0].d, 11) || nearCirc(doy, QUARTERS[2].d, 11)) return 4;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elDoy = document.getElementById('doy'), elDoyVal = document.getElementById('doyVal');
const elLat = document.getElementById('lat'), elLatVal = document.getElementById('latVal');
const elTilt = document.getElementById('tilt'), elTiltVal = document.getElementById('tiltVal');
const elSpd = document.getElementById('spd'), elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels'), tglChart = document.getElementById('tglChart'),
  tglTerm = document.getElementById('tglTerm'), tglRotate = document.getElementById('tglRotate');
const btnTs = [document.getElementById('btnT0'), document.getElementById('btnT1'), document.getElementById('btnT2')];
const stepsEl = document.getElementById('steps');
const stDate = document.getElementById('stDate'), stAlt = document.getElementById('stAlt'),
  stDay = document.getElementById('stDay'), stDist = document.getElementById('stDist'),
  stDec = document.getElementById('stDec');
const formulaEl = document.getElementById('formula');
const PRESETS = [0, 23.5, 45];
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncDoyUI() {
  if (document.activeElement !== elDoy) elDoy.value = Math.min(364, Math.round(doy));
  elDoyVal.textContent = dateStr(doy);
}
function updateFormula() {
  const lim = Math.max(tilt, 0);
  formulaEl.innerHTML = L(
    `直射范围 <b>±${tilt.toFixed(1)}°</b> · 极圈 <b>±${(90 - lim).toFixed(1)}°</b>(倾角定价)　北半球夏半年 <b>${WARM.toFixed(0)} 天</b> / 冬半年 <b>${COLD.toFixed(0)} 天</b>——冬天近太阳、公转更快,夏天反而更长`,
    `subsolar range <b>±${tilt.toFixed(1)}°</b> · polar circles <b>±${(90 - lim).toFixed(1)}°</b> (set by tilt) — northern warm half <b>${WARM.toFixed(0)} d</b> vs cold half <b>${COLD.toFixed(0)} d</b>: faster near-perihelion orbit makes summer longer`);
}
elDoy.addEventListener('input', () => { doy = parseFloat(elDoy.value); elDoyVal.textContent = dateStr(doy); });
elLat.addEventListener('input', () => { lat = parseInt(elLat.value, 10) / 10; elLatVal.textContent = latName(); });
elTilt.addEventListener('input', () => {
  tilt = parseInt(elTilt.value, 10) / 10;
  elTiltVal.textContent = tilt.toFixed(1) + '°';
  btnTs.forEach((b, i) => b.classList.toggle('on', Math.abs(tilt - PRESETS[i]) < 0.01));
  updateFormula();
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
btnTs.forEach((b, i) => b.addEventListener('click', () => setTilt(PRESETS[i])));
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglChart.addEventListener('change', () => { chartWrap.style.display = tglChart.checked ? '' : 'none'; });
tglTerm.addEventListener('change', () => { termRing.visible = nightCap.visible = tglTerm.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 每帧应用 ================= */
const Y_AXIS = new THREE.Vector3(0, 1, 0), Z_AXIS = new THREE.Vector3(0, 0, 1);
const vS = new THREE.Vector3(), vT = new THREE.Vector3(), vF = new THREE.Vector3(), vA = new THREE.Vector3();
function apply() {
  const s = stateOf(doy), rv = s.r * R_ORB;
  orbitPos(doy, earthSys.position);
  earthTilt.rotation.x = tilt * DEG;
  earthSpin.rotation.y = spinAng;
  sunLight.position.copy(earthSys.position);
  vS.copy(earthSys.position).multiplyScalar(-1 / rv);
  termRing.quaternion.setFromUnitVectors(Z_AXIS, vS);
  vT.copy(vS).negate();
  nightCap.quaternion.setFromUnitVectors(Y_AXIS, vT);
  photons.quaternion.setFromUnitVectors(Z_AXIS, vS);
  const ph = (tSim * 0.9) % PH_CYC;
  const arr = phGeo.attributes.position.array;
  for (let i = 0; i < PH_N; i++) {
    const z0 = 2.3 - ph, z1 = z0 - PH_LEN;
    arr[i * 6] = PH_OFF[i][0]; arr[i * 6 + 1] = PH_OFF[i][1]; arr[i * 6 + 2] = z0;
    arr[i * 6 + 3] = PH_OFF[i][0]; arr[i * 6 + 4] = PH_OFF[i][1]; arr[i * 6 + 5] = z1;
  }
  phGeo.attributes.position.needsUpdate = true;
  photons.computeLineDistances();
  const phi = lat * DEG;
  latRing.scale.set(Math.cos(phi), 1, Math.cos(phi));
  latRing.position.y = Math.sin(phi) * R_E;
  const dec = declOf(s.psi);
  subRing.scale.set(Math.cos(dec), 1, Math.cos(dec));
  subRing.position.y = Math.sin(dec) * R_E;
  subDot.position.copy(vS).multiplyScalar(R_E);
  vF.set(Math.cos(phi), Math.sin(phi), 0);
  flagGrp.position.copy(vF).multiplyScalar(R_E);
  flagGrp.quaternion.setFromUnitVectors(Y_AXIS, vF);
  flagGrp.getWorldPosition(vT);
  flagDay = vT.sub(earthSys.position).dot(vS) > 0;
  flagMat.color.set(flagDay ? 0xffd166 : 0x46566e);
  vA.set(0, Math.cos(tilt * DEG), Math.sin(tilt * DEG));
  for (const g of ghosts) g.quaternion.setFromUnitVectors(Y_AXIS, vA);
  polaris.position.copy(vA).multiplyScalar(30);
  rayGeo.attributes.position.setXYZ(1, vA.x * 6, vA.y * 6, vA.z * 6);
  rayGeo.attributes.position.needsUpdate = true;
  ray.computeLineDistances();
  const t = termNear(doy);
  stDate.innerHTML = dateStr(doy) + (t ? `<small> · ${L(t.zh, t.en)}</small>` : '');
  const alt = noonAlt(s.psi, lat);
  stAlt.innerHTML = alt.toFixed(1) + '<small>°' + (alt < 0 ? L(' · 地平线下', ' · below horizon') : '') + '</small>';
  const dl = dayLen(s.psi, lat);
  stDay.innerHTML = dl.toFixed(1) + '<small> h' +
    (dl >= 23.99 ? L(' · 极昼', ' · midnight sun') : (dl <= 0.01 ? L(' · 极夜', ' · polar night') : '')) + '</small>';
  const dp = Math.min(Math.abs(doy - PERI_DOY), YEAR - Math.abs(doy - PERI_DOY));
  const da = Math.min(Math.abs(doy - APH_DOY), YEAR - Math.abs(doy - APH_DOY));
  stDist.innerHTML = (s.r * AU).toFixed(1) + '<small> M km' +
    (dp < 2.5 ? L(' · 近日点', ' · perihelion') : (da < 2.5 ? L(' · 远日点', ' · aphelion') : '')) + '</small>';
  const dDeg = dec / DEG;
  stDec.innerHTML = Math.abs(dDeg).toFixed(1) + '<small>°' +
    (Math.abs(dDeg) < 0.05 ? L(' 赤道', ' equator') : (dDeg > 0 ? 'N' : 'S')) + '</small>';
  syncDoyUI();
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1, raf = null;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) {
    const dts = dt * speed;
    tSim += dts;
    doy = (doy + dts * YEAR / 60) % YEAR;
    spinAng += dts * 1.5;
  }
  apply();
  if (tglChart.checked) drawChart();
  for (const r of labelReg) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...stepsEl.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
elDoy.value = Math.min(364, Math.round(doy)); elDoyVal.textContent = dateStr(doy);
elLat.value = Math.round(lat * 10); elLatVal.textContent = latName();
elTilt.value = Math.round(tilt * 10); elTiltVal.textContent = tilt.toFixed(1) + '°';
btnTs.forEach((b, i) => b.classList.toggle('on', Math.abs(tilt - PRESETS[i]) < 0.01));
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
if (!qsBool('labels', true)) { labelsOn = false; tglLabels.checked = false; }
if (!qsBool('chart', true)) { tglChart.checked = false; chartWrap.style.display = 'none'; }
if (!qsBool('term', true)) { tglTerm.checked = false; termRing.visible = nightCap.visible = false; }
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
applyTheme();
applyLang();
refreshLabels();
apply();
setPlayLabel();
start();
</script>
</body>
</html>
