<style>

  <h1 data-zh="光线追踪 · 从眼睛往回追,追出真实感" data-en="Ray Tracing · chase rays backward from the eye">光线追踪 · 从眼睛往回追,追出真实感</h1>
  <div class="sub" data-zh="光栅化问「每个三角形盖住哪些像素」,只算直接光照;光追反过来:每个像素发一根反向光线,求交最近的表面,再问光源「你被挡住了吗」,镜面继续反射弹射、玻璃按斯涅尔定律折射——倒影、透射弯折、阴影都是递归「免费」送的,代价是 每像素光线数 × 弹射深度 的算力。切换模式当场看镜中倒影与玻璃折射出现/消失;渲染完点屏幕上任意像素,看它的光线树 · 拖动旋转 / 空格运行/暂停" data-en="Rasterization asks “which pixels does each triangle cover” and only computes direct light; ray tracing flips it: every pixel fires one backward ray, finds the nearest hit, asks the light “are you blocked?”, mirror spheres keep bouncing by reflection, glass bends rays by Snell's law — reflections, transmission, shadows fall out of the recursion for free, at the cost of rays-per-pixel × bounce depth. Toggle modes and watch mirror reflections and glass refraction appear/vanish; when done, click any pixel to see its ray tree · drag to orbit / Space = run/pause">光栅化问「每个三角形盖住哪些像素」,只算直接光照;光追反过来:每个像素发一根反向光线,求交最近的表面,再问光源「你被挡住了吗」,镜面继续反射弹射、玻璃按斯涅尔定律折射——倒影、透射弯折、阴影都是递归「免费」送的,代价是 每像素光线数 × 弹射深度 的算力。切换模式当场看镜中倒影与玻璃折射出现/消失;渲染完点屏幕上任意像素,看它的光线树 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const el=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const qsFloat=(k,d)=>{const v=parseFloat(qs.get(k));return Number.isFinite(v)?v:d;};
const speedMul=clamp(qsFloat('speed',1),0.3,2.5);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
el('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,34,110);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,300);
camera.position.set(-3.5,5.2,14.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.4,1.5);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=90;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyL=new THREE.DirectionalLight(0xfff2dd,0.9);keyL.position.set(8,14,10);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-8,5,-6);scene.add(fillL);

/* ---- 被追踪的场景(与真实网格同源) ---- */
const SPH=[
 {p:[-1.85,1.05,0.15],r:1.05,mat:1,col:[0.90,0.94,1.00]},
 {p:[ 1.85,1.05,0.15],r:1.05,mat:2,col:[0.62,0.90,1.00]},
 {p:[ 0.00,1.05,-2.2],r:1.05,mat:0,col:[1.00,0.45,0.42]},
];
const VCAM={p:[0,1.85,8.0],t:[0,1.0,-0.6],fov:46};
let LD=[0,1,0];
function setLD(deg){
  const a=deg*Math.PI/180;
  LD=[Math.cos(a),1.15,Math.sin(a)];
  const l=Math.hypot(LD[0],LD[1],LD[2]);LD[0]/=l;LD[1]/=l;LD[2]/=l;
}
/* 虚拟相机基向量 */
const fwd=[0,0,0],right=[0,0,0],upv=[0,0,0];let tanH=0,tanV=0;
(function camInit(){
  const p=VCAM.p,t=VCAM.t;
  let fx=t[0]-p[0],fy=t[1]-p[1],fz=t[2]-p[2];
  const fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;
  let rx=-fz,ry=0,rz=fx;
  const rl=Math.hypot(rx,ry,rz)||1;rx/=rl;ry/=rl;rz/=rl;
  const ux=ry*fz-rz*fy,uy=rz*fx-rx*fz,uz=rx*fy-ry*fx;
  const ul=Math.hypot(ux,uy,uz)||1;
  fwd[0]=fx;fwd[1]=fy;fwd[2]=fz;
  right[0]=rx;right[1]=ry;right[2]=rz;
  upv[0]=ux/ul;upv[1]=uy/ul;upv[2]=uz/ul;
  tanH=Math.tan(VCAM.fov*Math.PI/360);
  tanV=tanH*30/48;
})();

/* ---- 真实求交 ---- */
let hT=1e9,hS=-1,isG=false;
function nearest(ox,oy,oz,dx,dy,dz){
  hT=1e9;hS=-1;isG=false;
  for(let i=0;i<3;i++){
    const s=SPH[i],lx=s.p[0]-ox,ly=s.p[1]-oy,lz=s.p[2]-oz;
    const tca=lx*dx+ly*dy+lz*dz;
    if(tca<=0)continue;
    const d2=lx*lx+ly*ly+lz*lz-tca*tca,r2=s.r*s.r;
    if(d2>r2)continue;
    const thc=Math.sqrt(r2-d2);
    let t=tca-thc;
    if(t<1e-3)t=tca+thc;
    if(t>1e-3&&t<hT){hT=t;hS=i;}
  }
  if(dy<-1e-6){
    const tg=-oy/dy;
    if(tg>1e-3&&tg<hT){hT=tg;hS=-1;isG=true;}
  }
}
function shadowed(px,py,pz){
  raysN++;
  for(let i=0;i<3;i++){
    const s=SPH[i],lx=s.p[0]-px,ly=s.p[1]-py,lz=s.p[2]-pz;
    const tca=lx*LD[0]+ly*LD[1]+lz*LD[2];
    if(tca<=0)continue;
    const d2=lx*lx+ly*ly+lz*lz-tca*tca;
    if(d2<s.r*s.r)return true;
  }
  return false;
}
function sky(dy,out){
  const u=clamp(dy*0.5+0.42,0,1);
  out[0]=0.74-0.50*u;out[1]=0.80-0.40*u;out[2]=0.88-0.16*u;
}
/* 光追:镜面反射 + 玻璃折射递归(深度=弹射次数) */
const RA=[0,1,2,3,4].map(()=>[0,0,0]),RB=[0,1,2,3,4].map(()=>[0,0,0]);
function trace(ox,oy,oz,dx,dy,dz,depth,out){
  raysN++;
  nearest(ox,oy,oz,dx,dy,dz);
  if(hS<0&&!isG){sky(dy,out);return;}
  const t=hT,px=ox+dx*t,py=oy+dy*t,pz=oz+dz*t;
  let nx=0,ny=1,nz=0;
  if(!isG){const s=SPH[hS];nx=(px-s.p[0])/s.r;ny=(py-s.p[1])/s.r;nz=(pz-s.p[2])/s.r;}
  const ndl=LD[0]*nx+LD[1]*ny+LD[2]*nz;
  if(isG){
    const ch=((Math.floor(px+16)+Math.floor(pz+16))&1)?0.30:0.82;
    const sh=shadowed(px+nx*2e-3,py+ny*2e-3,pz+nz*2e-3)?0:1;
    const li=ch*(0.30+0.75*Math.max(ndl,0)*sh);
    out[0]=li;out[1]=li;out[2]=li;
    return;
  }
  const s=SPH[hS],c=s.col;
  if(s.mat===0){
    const sh=shadowed(px+nx*2e-3,py+ny*2e-3,pz+nz*2e-3)?0:1;
    const li=0.26+0.85*Math.max(ndl,0)*sh;
    out[0]=c[0]*li;out[1]=c[1]*li;out[2]=c[2]*li;
    return;
  }
  const dn0=dx*nx+dy*ny+dz*nz;
  let nx2=nx,ny2=ny,nz2=nz,eta=1/1.5;
  if(dn0>0){nx2=-nx;ny2=-ny;nz2=-nz;eta=1.5;}
  const nd=-(dx*nx2+dy*ny2+dz*nz2);
  const F=0.04+0.96*Math.pow(1-nd,5);
  const rdn=dx*nx2+dy*ny2+dz*nz2;
  const rx=dx-2*rdn*nx2,ry=dy-2*rdn*ny2,rz=dz-2*rdn*nz2;
  let rr=0,rg=0,rb=0;
  if(depth<maxDepth){
    trace(px+rx*2e-3,py+ry*2e-3,pz+rz*2e-3,rx,ry,rz,depth+1,RA[depth]);
    rr=RA[depth][0];rg=RA[depth][1];rb=RA[depth][2];
  }
  let tr=0,tg=0,tb=0;
  const k=1-eta*eta*(1-nd*nd);
  if(k>=0&&depth<maxDepth){
    const a=eta*nd-Math.sqrt(k);
    const tx=eta*dx+a*nx2,ty=eta*dy+a*ny2,tz=eta*dz+a*nz2;
    trace(px+tx*2e-3,py+ty*2e-3,pz+tz*2e-3,tx,ty,tz,depth+1,RB[depth]);
    tr=RB[depth][0]*c[0];tg=RB[depth][1]*c[1];tb=RB[depth][2]*c[2];
  }
  if(k<0||depth>=maxDepth){out[0]=c[0]*0.18+rr;out[1]=c[1]*0.18+rg;out[2]=c[2]*0.18+rb;}
  else{out[0]=rr*F+tr*(1-F);out[1]=rg*F+tg*(1-F);out[2]=rb*F+tb*(1-F);}
}
/* 光栅化对照:只有直接光照,无阴影/反射/折射 */
function shadeRaster(ox,oy,oz,dx,dy,dz,out){
  raysN++;
  nearest(ox,oy,oz,dx,dy,dz);
  if(hS<0&&!isG){sky(dy,out);return;}
  const t=hT,px=ox+dx*t,py=oy+dy*t,pz=oz+dz*t;
  let nx=0,ny=1,nz=0;
  if(!isG){const s=SPH[hS];nx=(px-s.p[0])/s.r;ny=(py-s.p[1])/s.r;nz=(pz-s.p[2])/s.r;}
  const ndl=Math.max(LD[0]*nx+LD[1]*ny+LD[2]*nz,0);
  if(isG){
    const ch=((Math.floor(px+16)+Math.floor(pz+16))&1)?0.30:0.82;
    const li=ch*(0.35+0.75*ndl);
    out[0]=li;out[1]=li;out[2]=li;
  }else{
    const s=SPH[hS],c=s.col;
    if(s.mat===1){const li=0.45+0.35*ndl;out[0]=c[0]*li;out[1]=c[1]*li;out[2]=c[2]*li;}
    else if(s.mat===2){
      sky(dy,SK);
      out[0]=c[0]*0.5*(0.5+0.6*ndl)+SK[0]*0.38;
      out[1]=c[1]*0.5*(0.5+0.6*ndl)+SK[1]*0.38;
      out[2]=c[2]*0.5*(0.5+0.6*ndl)+SK[2]*0.38;
    }else{const li=0.32+0.8*ndl;out[0]=c[0]*li;out[1]=c[1]*li;out[2]=c[2]*li;}
  }
}
const SK=[0,0,0],D3=[0,0,0],OUT=[0,0,0];

/* ---- 渲染缓冲(逐行点亮) ---- */
const W=48,H=30,TOT=W*H,CS=0.15;
let mode='ray',maxDepth=2,rate=90,LA=35;
let scan=0,passDone=false,raysN=0,tms=0;

const scrFrame=new THREE.Mesh(new THREE.BoxGeometry(W*CS+0.5,H*CS+0.5,0.14),
  new THREE.MeshStandardMaterial({color:0x343a42,roughness:0.6,metalness:0.35}));
scrFrame.position.z=-0.1;screenG.add(scrFrame);
const pix=new THREE.InstancedMesh(new THREE.BoxGeometry(0.125,0.125,0.06),
  new THREE.MeshBasicMaterial({}),TOT);
const pm4=new THREE.Matrix4();
for(let i=0;i<TOT;i++){
  const c=i%W,r=(i/W)|0;
  pm4.identity();pm4.setPosition((c-(W-1)/2)*CS,((H-1)/2-r)*CS,0);
  pix.setMatrixAt(i,pm4);
}
screenG.add(pix);
function pixDir(idx,out){
  const r=(idx/W)|0,c=idx%W;
  const u=((c+0.5)/W*2-1)*tanH,v=(1-(r+0.5)/H*2)*tanV;
  const dx=fwd[0]+u*right[0]+v*upv[0],dy=fwd[1]+u*right[1]+v*upv[1],dz=fwd[2]+u*right[2]+v*upv[2];
  const l=Math.hypot(dx,dy,dz);
  out[0]=dx/l;out[1]=dy/l;out[2]=dz/l;
}
const tmpC=new THREE.Color();
function tracePixel(idx){
  pixDir(idx,D3);
  if(mode==='raster')shadeRaster(VCAM.p[0],VCAM.p[1],VCAM.p[2],D3[0],D3[1],D3[2],OUT);
  else trace(VCAM.p[0],VCAM.p[1],VCAM.p[2],D3[0],D3[1],D3[2],0,OUT);
  tmpC.setRGB(Math.sqrt(clamp(OUT[0],0,1)),Math.sqrt(clamp(OUT[1],0,1)),Math.sqrt(clamp(OUT[2],0,1)));
  pix.setColorAt(idx,tmpC);
}
function renderChunk(n){
  const t0=performance.now();
  let c=0;
  while(scan<TOT&&c<n){tracePixel(scan++);c++;}
  tms+=performance.now()-t0;
  pix.instanceColor.needsUpdate=true;
  if(scan>=TOT)passDone=true;
}
function resetPass(){
  scan=0;passDone=false;raysN=0;tms=0;
  tmpC.setHex(0x11151a);
  for(let i=0;i<TOT;i++)pix.setColorAt(i,tmpC);
  pix.instanceColor.needsUpdate=true;
  if(!playing)renderChunk(TOT);
}

/* ---- 像素放大镜:选中像素的光线树(真实重走) ---- */
const segs=[];
const SEGCOL={p:[1,1,1],s:[1,0.83,0.23],r:[0.45,0.75,1],t:[0.4,0.9,0.82]};
let heroIdx=-1,pathRays=0;
const pathGeo=new THREE.BufferGeometry();
const pathLine=new THREE.LineSegments(pathGeo,
  new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.95}));
scene.add(pathLine);pathLine.visible=false;
const heroBox=new THREE.Mesh(new THREE.BoxGeometry(0.19,0.19,0.1),
  new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true}));
screenG.add(heroBox);heroBox.visible=false;
function pathWalk(ox,oy,oz,dx,dy,dz,depth,kind){
  pathRays++;
  nearest(ox,oy,oz,dx,dy,dz);
  if(hS<0&&!isG){segs.push({a:[ox,oy,oz],b:[ox+dx*14,oy+dy*14,oz+dz*14],c:SEGCOL.p});return;}
  const t=hT,px=ox+dx*t,py=oy+dy*t,pz=oz+dz*t;
  segs.push({a:[ox,oy,oz],b:[px,py,pz],c:kind==='p'?SEGCOL.p:kind==='r'?SEGCOL.r:SEGCOL.t});
  let nx=0,ny=1,nz=0;
  if(!isG){const s=SPH[hS];nx=(px-s.p[0])/s.r;ny=(py-s.p[1])/s.r;nz=(pz-s.p[2])/s.r;}
  if(isG||(hS>=0&&SPH[hS].mat===0)){
    const blocked=shadowed(px+nx*2e-3,py+ny*2e-3,pz+nz*2e-3);
    segs.push({a:[px,py,pz],b:[px+LD[0]*3.2,py+LD[1]*3.2,pz+LD[2]*3.2],
      c:blocked?[1,0.35,0.3]:SEGCOL.s});
    return;
  }
  if(depth>=3)return;
  const s=SPH[hS];
  const dn0=dx*nx+dy*ny+dz*nz;
  let nx2=nx,ny2=ny,nz2=nz,eta=1/1.5;
  if(dn0>0){nx2=-nx;ny2=-ny;nz2=-nz;eta=1.5;}
  const nd=-(dx*nx2+dy*ny2+dz*nz2);
  const rdn=dx*nx2+dy*ny2+dz*nz2;
  const rx=dx-2*rdn*nx2,ry=dy-2*rdn*ny2,rz=dz-2*rdn*nz2;
  pathWalk(px+rx*2e-3,py+ry*2e-3,pz+rz*2e-3,rx,ry,rz,depth+1,'r');
  const k=1-eta*eta*(1-nd*nd);
  if(k>=0){
    const a=eta*nd-Math.sqrt(k);
    pathWalk(px+(eta*dx+a*nx2)*2e-3,py+(eta*dy+a*ny2)*2e-3,pz+(eta*dz+a*nz2)*2e-3,
      eta*dx+a*nx2,eta*dy+a*ny2,eta*dz+a*nz2,depth+1,'t');
  }
}
let magLblData=null;
function pathBuild(idx){
  segs.length=0;pathRays=0;
  const r=(idx/W)|0,c=idx%W;
  pixDir(idx,D3);
  heroBox.position.set((c-(W-1)/2)*CS,((H-1)/2-r)*CS,0.08);
  pathWalk(VCAM.p[0],VCAM.p[1],VCAM.p[2],D3[0],D3[1],D3[2],0,'p');
  const pos=new Float32Array(segs.length*6),col=new Float32Array(segs.length*6);
  segs.forEach((s,i)=>{
    pos.set([...s.a,...s.b],i*6);
    col.set([...s.c,...s.c],i*6);
  });
  pathGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  pathGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
  magLblData={
    n:segs.length,rays:pathRays,c,r,
    refl:segs.find(s=>s.c===SEGCOL.r),
    refr:segs.find(s=>s.c===SEGCOL.t),
    shad:segs.find(s=>s.c===SEGCOL.s),
  };
  placeMagLabels();
}
/* 弹跳光点(InstancedMesh)沿光线树移动 */
const DOTN=7;
const dotMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.075,10,8),
  new THREE.MeshBasicMaterial({color:0xffffff}),DOTN);
scene.add(dotMesh);dotMesh.visible=false;
const dm4=new THREE.Matrix4(),dv3=new THREE.Vector3();
function stepDots(dt){
  if(!magOn||segs.length===0){dotMesh.visible=false;return;}
  dotMesh.visible=true;
  let total=0;const cum=[0];
  for(const s of segs){total+=Math.hypot(s.b[0]-s.a[0],s.b[1]-s.a[1],s.b[2]-s.a[2]);cum.push(total);}
  for(let i=0;i<DOTN;i++){
    const d=(simT*3.2+i*total/DOTN)%total;
    let j=0;while(j<segs.length-1&&cum[j+1]<d)j++;
    const s=segs[j],f=(d-cum[j])/Math.max(1e-6,cum[j+1]-cum[j]);
    dv3.set(s.a[0]+(s.b[0]-s.a[0])*f,s.a[1]+(s.b[1]-s.a[1])*f,s.a[2]+(s.b[2]-s.a[2])*f);
    dm4.identity();dm4.setPosition(dv3);
    dotMesh.setMatrixAt(i,dm4);
  }
  dotMesh.instanceMatrix.needsUpdate=true;
}

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
let pDown=null;
renderer.domElement.addEventListener('pointerdown',e=>{pDown=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!pDown)return;
  const dx=e.clientX-pDown[0],dy=e.clientY-pDown[1];pDown=null;
  if(dx*dx+dy*dy>36)return;
  ptr.x=e.clientX/innerWidth*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObject(pix)[0];
  if(hit&&hit.instanceId!==undefined){
    heroIdx=hit.instanceId;
    setMag(true);
  }
});
function pickHero(){          // 默认选中:主光线离玻璃球心最近的像素
  const s=SPH[1];let best=1e9,bidx=0;
  for(let i=0;i<TOT;i++){
    pixDir(i,D3);
    const lx=s.p[0]-VCAM.p[0],ly=s.p[1]-VCAM.p[1],lz=s.p[2]-VCAM.p[2];
    const tca=lx*D3[0]+ly*D3[1]+lz*D3[2];
    if(tca<=0)continue;
    const d=Math.sqrt(Math.max(0,lx*lx+ly*ly+lz*lz-tca*tca));
    if(d<best){best=d;bidx=i;}
  }
  heroIdx=bidx;
}

  d:'深度调到 2:命中镜面球后,光线沿反射方向继续追下一层场景——地面棋盘格、旁边的球被真真切切地画进镜面里。倒影不是贴图,是递归算出来的。',de:'Depth 2: after hitting the mirror sphere the ray keeps going along the reflected direction — the checker ground and neighbouring spheres are genuinely rendered inside the mirror. Reflections are computed, not textures.',
  act:()=>{setMode('ray');setDepth(2);setRate(110);flyTo([-5.5,2.8,7],[-1.8,1.1,0.2]);}},
 {b:'玻璃折射:斯涅尔弯折',be:'Glass refraction: Snell bends the ray',
  d:'深度 3:玻璃球按 n₁sinθ₁=n₂sinθ₂ 折射,进出两次弯折、全内反射按菲涅尔分流——背景透过玻璃真的被「掰弯」了。深度越大,每像素光线越多。',de:'Depth 3: the glass sphere refracts by n₁sinθ₁=n₂sinθ₂, bending twice on entry and exit with Fresnel splitting — the background really bends through the glass. More depth, more rays per pixel.',
  act:()=>{setMode('ray');setDepth(3);setRate(130);flyTo([6,3.2,8],[1.8,1.1,0.2]);}},
 {b:'深度 × 光线数 = 真实感与算力',be:'Depth × rays = realism and compute',
  d:'渲染速度调慢,看进度条一行行爬:每像素均值光线数在 stats 里实时上涨——真实感是按光线数买来的。渲染完点屏幕任意像素,看它的光线树。',de:'Slow the fill rate and watch the progress crawl row by row: the rays-per-pixel average climbs in the stats — realism is bought with rays. When done, click any pixel to inspect its ray tree.',
  act:()=>{setMode('ray');setDepth(3);setRate(26);flyTo([-2,4.6,13.5],[0,2.6,4]);}},
];
let phaseIdx=0;
function buildSteps(){
  const ol=el('steps');ol.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{phaseIdx=i;STEPS[i].act();syncSteps();});
    ol.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===phaseIdx));}
function applyPhase(i){phaseIdx=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  el('stD').innerHTML=Math.round(scan/TOT*100)+'<small> %</small>';
  el('stR').textContent=raysN;
  el('stP').textContent=(raysN/Math.max(1,scan)).toFixed(1);
  el('stT').innerHTML=tms.toFixed(1)+'<small> ms</small>';
}
function updateFormula(){
  el('formula').innerHTML=L(
    `<b>光追 = 求交 × 递归:</b>每像素 1 主光线 + 命中点 1 阴影射线,镜面沿反射方向、玻璃按斯涅尔 n₁sinθ₁=n₂sinθ₂ 分裂成反射+折射两支<br>`+
    `<b>当前:</b>${mode==='ray'?`光追 深度 ${maxDepth}`:'光栅化对照(无阴影/反射/折射)'} · 玻璃 IOR=1.5 · 菲涅尔 Schlick F₀=0.04<br>`+
    `<b>算力 = 每像素光线数 × 弹射深度:</b>光栅化 1 条/像素;光追深度 3 的玻璃像素可达十几条——真实感按光线计价`,
    `<b>Trace = intersect × recurse:</b> 1 primary + 1 shadow ray per hit; mirrors continue along the reflected direction, glass splits into reflect+refract by Snell n₁sinθ₁=n₂sinθ₂<br>`+
    `<b>Now:</b> ${mode==='ray'?`ray trace, depth ${maxDepth}`:'raster baseline (no shadow/reflection/refraction)'} · glass IOR=1.5 · Schlick F₀=0.04<br>`+
    `<b>Compute = rays/pixel × depth:</b> raster costs 1 ray/pixel; a depth-3 glass pixel can cost a dozen — realism is priced in rays`);
}

/* ---- 主题 / 语言 / UI ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  el('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  scrFrame.material.color.setHex(dark?0x343a42:0x9aa3ad);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(e=>{
    if(e.tagName==='INPUT')return;
    e.textContent=LANG==='en'?(e.dataset.en||e.dataset.zh):e.dataset.zh;
  });
  el('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();setPlayLabel();updateFormula();
  if(magOn)placeMagLabels();
}
function setPlayLabel(){el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
el('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
el('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
el('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
el('tglRay').addEventListener('change',e=>setMode(e.target.checked?'ray':'raster'));
el('bRas').addEventListener('click',()=>setMode('raster'));
el('bFull').addEventListener('click',()=>{setMode('ray');setDepth(3);setRate(240);});
el('bMag').addEventListener('click',()=>{setMode('ray');setDepth(3);setMag(!magOn);});
el('sDepth').addEventListener('input',e=>setDepth(+e.target.value));
el('sRate').addEventListener('input',e=>setRate(+e.target.value));
el('sLA').addEventListener('input',e=>setLA(+e.target.value));
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();el('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=dt0*speedMul*(playing?1:0);
  simT+=dt0;
  if(dt>0&&!passDone)renderChunk(tglScanEl.checked?rate:TOT);
  stepDots(dt0);
  if(camTween){
    camTween.k=Math.min(1,camTween.k+dt0*1.5);
    const e=1-Math.pow(1-camTween.k,3);
    camera.position.lerpVectors(camTween.p0,camTween.p1,e);
    controls.target.lerpVectors(camTween.t0,camTween.t1,e);
    if(camTween.k>=1)camTween=null;
  }
  acc+=dt0;
  if(acc>0.12){acc=0;updateStats();updateFormula();}
  for(const r of labelReg){r.o.visible=el('tglLabels').checked&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
let labelsOn=qs.get('labels')!=='0';
el('tglLabels').checked=labelsOn;
setLD(35);updLightGiz();
applyTheme();
buildSteps();
applyLang();
const t0=Math.round(qsFloat('t',0));
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);
else applyPhase(1);
pickHero();
updateStats();updateFormula();setPlayLabel();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
