<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肥皂与胶束 · 一半亲水一半亲油</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.o { border-color: rgba(255,186,106,.9); color: #ffe0c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(9,110,180,.9); color: #0b6ea8; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #74c0fc; }
  #stats .v.o { color: #ffca8a; }
  #cmcCv { grid-column: 1 / 3; width: 230px; height: 60px; margin-top: 4px; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .chip.t { color: #ffe0c2; border-color: rgba(255,186,106,.7); }
  .chip.o { color: #ffd8a8; border-color: rgba(255,169,77,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xe4edf5 : 0x0e1622);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('肥皂与胶束', 'Soap & Micelles');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  drawCmc();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.2, 2.0, 6.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.45;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.07, transparent: true, ...opts });
}
const M = {
  head: mat(0x74c0fc, { roughness: 0.3 }),
  tail: mat(0xffca8a, { roughness: 0.35 }),
  water: new THREE.MeshPhysicalMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.07,
    roughness: 0.1, side: THREE.DoubleSide, depthWrite: false }),
  oil: mat(0xffa94d, { transparent: true, opacity: 0.5, roughness: 0.2, emissiveIntensity: 0.15 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.10,
    roughness: 0.15, side: THREE.DoubleSide, depthWrite: false }),
};

/* 水缸 */
const tank = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.4, 2.8, 40, 1, true), M.glass);
tank.position.y = 1.2;
scene.add(tank);
const tankB = new THREE.Mesh(new THREE.CircleGeometry(2.4, 40), M.glass.clone());
tankB.rotation.x = -Math.PI / 2;
tankB.position.y = -0.2;
scene.add(tankB);
const base = new THREE.Mesh(new THREE.CylinderGeometry(2.9, 3.1, 0.16, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.36;
scene.add(base);

/* ================= 状态(标签之前) ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let conc = qsFloat('c', 30);
let tSim = 0;
const CMC = 20;                 // 临界胶束浓度(分子数)
const MIC_N = 8;                // 每颗胶束的分子数
const OIL_SLOTS = 18;
const BOUND = 2.0;

/* 油污滴 */
const oil = { grp: null, present: false, r: 0.85, pos: new THREE.Vector3(0, 1.15, 0) };
function addOil() {
  if (oil.present) return;
  oil.present = true;
  oil.grp = new THREE.Mesh(new THREE.SphereGeometry(oil.r, 32, 24), M.oil);
  oil.grp.position.copy(oil.pos);
  oil.grp.scale.set(1, 0.82, 1);
  scene.add(oil.grp);
}
function clearOil() {
  oil.present = false;
  if (oil.grp) { scene.remove(oil.grp); oil.grp = null; }
}

/* ================= 两亲分子 ================= */
/* 分子:头(蓝) + 3 节尾(橙)。g 的 -Z 方向为头, +Z 为尾尖 */
const amph = [];   // {g, state:'free'|'oil'|'mic', slot:Vector3, mic:Group|null, idx}
function mkAmphiphile(pos) {
  const g = new THREE.Group();
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 12), M.head);
  head.position.z = -0.26;
  g.add(head);
  for (let i = 0; i < 3; i++) {
    const t = new THREE.Mesh(new THREE.SphereGeometry(0.085 - i * 0.012, 10, 8), M.tail);
    t.position.z = -0.05 + i * 0.13;
    g.add(t);
  }
  g.position.copy(pos);
  scene.add(g);
  const a = { g, state: 'free', slot: new THREE.Vector3(), mic: null, phase: Math.random() * 9 };
  amph.push(a);
  return a;
}
for (let i = 0; i < 60; i++) {
  const p = new THREE.Vector3((Math.random() - 0.5) * 4, 0.3 + Math.random() * 2.0, (Math.random() - 0.5) * 3.6);
  mkAmphiphile(p);
}
/* 油面槽位方向池 */
const oilDirs = [];
for (let i = 0; i < OIL_SLOTS; i++) {
  const u = Math.random() * 2 - 1, ph = Math.random() * Math.PI * 2;
  const s = Math.sqrt(1 - u * u);
  oilDirs.push(new THREE.Vector3(s * Math.cos(ph), u * 0.85, s * Math.sin(ph)).normalize());
}

/* 胶束管理:超过 CMC 的多余单体组成胶束 */
const micelles = [];   // {grp(空组), center:Vector3, members:[a], radius}
function micellePlan() {
  const active = amph.slice(0, Math.round(conc));
  const onOil = oil.present ? Math.min(active.length, OIL_SLOTS) : 0;
  const free = active.length - onOil;
  const excess = Math.max(0, free - CMC);
  return { active, onOil, excess, micN: Math.floor(excess / MIC_N), remain: excess % MIC_N };
}
function updateMembership() {
  const { active, onOil, micN } = micellePlan();
  /* 回收所有旧胶束 */
  for (const m of micelles) scene.remove(m.grp);
  micelles.length = 0;
  let k = 0;
  for (let i = 0; i < active.length; i++) {
    const a = active[i];
    if (i < onOil) {
      a.state = 'oil';
      a.slot.copy(oilDirs[i % oilDirs.length]).multiplyScalar(oil.r * 0.86).add(oil.pos);
    } else {
      const mi = Math.floor(k / MIC_N);
      if (mi < micN) {
        a.state = 'mic';
        if (k % MIC_N === 0) {
          const grp = new THREE.Group();
          const p = new THREE.Vector3(
            (Math.random() - 0.5) * 3.2, 0.65 + Math.random() * 1.5, (Math.random() - 0.5) * 2.6);
          grp.position.copy(p);
          scene.add(grp);
          micelles.push({ grp, center: p, members: [] });
        }
        const m = micelles[mi];
        m.members.push(a);
        a.mic = m;
        /* 球面槽位(头朝外) */
        const idx = k % MIC_N;
        const phi = Math.acos(1 - 2 * (idx + 0.5) / MIC_N);
        const th = Math.PI * (1 + Math.sqrt(5)) * idx;
        a.slot.set(Math.sin(phi) * Math.cos(th), Math.cos(phi), Math.sin(phi) * Math.sin(th))
          .multiplyScalar(0.42).add(m.center);
      } else {
        a.state = 'free';
      }
      k++;
    }
  }
  /* 未激活的分子沉底待机 */
  for (let i = active.length; i < amph.length; i++) {
    amph[i].state = 'free';
    amph[i].slot.set((i % 7 - 3) * 0.5, -0.02, -1.6 + Math.floor(i / 7) * 0.35);
  }
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblHead = addLabel(() => L('亲水头:愿意待在水里', 'hydrophilic head: happy in water'),
  new THREE.Vector3(0, 1.9, 0), 'g');
const lblOil = addLabel(() => oil.present
  ? L('油污:水拉不住它,唯有尾指油、头朝水的分子能把它抬走', 'grease: water can\'t hold it — only tails-in heads-out molecules lift it off')
  : L('滴一滴油污,看分子如何包裹它', 'drop grease and watch the molecules wrap it'),
  new THREE.Vector3(0, 0.35, 0), 'o');
const lblMic = addLabel(() => conc > CMC
  ? L(`浓度已过 CMC(${CMC}):多余的分子宁可抱成团——胶束自发成型`, `above CMC (${CMC}): excess molecules rather huddle — micelles self-assemble`)
  : L(`浓度低于 CMC(${CMC}):单体各自为战,表面张力只降不破`, `below CMC (${CMC}): lone monomers only; surface tension drops but never breaks`),
  new THREE.Vector3(0, 3.05, 0), 'st');

/* ================= 表面张力/CMC 小图 ================= */
const cmcCv = document.getElementById('cmcCv');
function drawCmc() {
  const ctx = cmcCv.getContext('2d');
  const W = cmcCv.width = cmcCv.clientWidth * 2;
  const H = cmcCv.height = cmcCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const pad = 24;
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.lineTo(W - pad / 2, H - pad); ctx.stroke();
  /* 表面张力:线性下降,CMC 后持平 */
  ctx.strokeStyle = '#74c0fc'; ctx.lineWidth = 3.5;
  ctx.beginPath();
  const xOf = c => pad + (W - pad - pad / 2) * c / 60;
  const yOf = g => pad + (H - pad - pad) * (1 - g);
  for (let c = 0; c <= 60; c += 2) {
    const g = c <= CMC ? 1 - 0.72 * c / CMC : 0.28;
    const x = xOf(c), y = yOf(g);
    c === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* CMC 竖线 */
  ctx.setLineDash([7, 6]);
  ctx.strokeStyle = '#ffd166';
  ctx.beginPath(); ctx.moveTo(xOf(CMC), pad); ctx.lineTo(xOf(CMC), H - pad); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '19px system-ui'; ctx.fillStyle = cTxt;
  ctx.fillText('CMC', xOf(CMC) - 18, pad - 6 + 12);
  /* 当前浓度点 */
  const g = conc <= CMC ? 1 - 0.72 * conc / CMC : 0.28;
  ctx.fillStyle = '#ffca8a';
  ctx.beginPath(); ctx.arc(xOf(conc), yOf(g), 7, 0, Math.PI * 2); ctx.fill();
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '两亲分子:一条链两种忠诚', be: 'Amphiphile: one chain, two loyalties',
    d: '肥皂 = 脂肪酸根:羧酸头被水分子簇拥(水合),烃尾却被水排挤——它天生就是水和油之间的翻译官。',
    de: 'Soap = a fatty-acid salt: the carboxyl head is courted by water, the hydrocarbon tail shunned — a born translator between oil and water.',
    act: () => setConc(10) },
  { b: '低浓度:排队站上油面', be: 'Low dose: queue at the oil surface',
    d: '滴入油污:头扎进水、尾插进油,分子在油滴表面排成一层「缓冲垫」——这就是为什么少量肥皂就能降低表面张力。',
    de: 'Add grease: heads dive into water, tails spear the oil — a cushion monolayer forms on the droplet. That is how a little soap slashes surface tension.',
    act: () => { addOil(); setConc(12); } },
  { b: 'CMC:自组装的开关', be: 'CMC: the self-assembly switch',
    d: '油面坐满了,继续加肥皂——超过临界胶束浓度(CMC)的瞬间,多余分子宁可尾对尾抱成团:胶束自发出现,表面张力曲线戛然走平。',
    de: 'Surface full, keep pouring: the instant you cross the critical micelle concentration, excess molecules huddle tails-in — micelles pop into being and the tension curve flattens.',
    act: () => setConc(28) },
  { b: '包裹油污:乳化', be: 'Swallow the grease: emulsification',
    d: '胶束遇到油滴直接把它整团围住:尾朝内咬住油、头朝外讨好水——油污被打包成可溶于水的「包裹」,搓洗即可带走。',
    de: 'A micelle swallows the droplet whole: tails bite the oil inside, heads charm the water outside — grease packaged waterborne, rinsed away.',
    act: () => { addOil(); setConc(45); } },
  { b: '为什么是球?熵说了算', be: 'Why spheres? Entropy decides',
    d: '尾聚在一起,原本被迫整齐排列的水分子重获自由(熵增)驱动;头在外保住水合——几何上几十个分子正好闭合成球。自组装不需要任何工人。',
    de: 'Clustering tails frees the ordered water caged around them (entropy pays); heads outside stay hydrated — 12–100 molecules close into a sphere. No workers needed.',
    act: () => setConc(55) },
];
function stepIndex() {
  if (conc > CMC + 12) return oil.present ? 3 : 4;
  if (conc > CMC) return 2;
  if (oil.present && conc <= CMC) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elConc = document.getElementById('conc');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setConc(v) {
  conc = clamp(Math.round(v), 0, 60);
  elConc.value = conc;
  document.getElementById('concVal').textContent = conc;
  updateMembership();
  document.getElementById('stST').innerHTML =
    (conc <= CMC ? 72 - 51.8 * conc / CMC : 20.2).toFixed(1) + '<small>mN/m</small>';
  drawCmc();
}
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elConc.addEventListener('input', e => setConc(parseInt(e.target.value)));
document.getElementById('btnOil').addEventListener('click', () => { addOil(); updateMembership(); });
document.getElementById('btnReset').addEventListener('click', () => { clearOil(); updateMembership(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 运动 ================= */
function keepInside(p) {
  const r = Math.hypot(p.x, p.z);
  const maxR = 2.05;
  if (r > maxR) { p.x *= maxR / r; p.z *= maxR / r; }
  p.y = clamp(p.y, 0.05, 2.4);
}
function motion(dt) {
  for (let i = 0; i < amph.length; i++) {
    const a = amph[i];
    if (a.state === 'oil' && oil.present) {
      /* 铺在油面:头朝外(水侧),尾插油里 */
      a.g.position.lerp(a.slot, clamp(dt * 2.2, 0, 1));
      const dir = new THREE.Vector3().subVectors(oil.pos, a.g.position).normalize();
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
      a.g.quaternion.slerp(q, clamp(dt * 3, 0, 1));
    } else if (a.state === 'mic' && a.mic) {
      a.g.position.lerp(a.slot, clamp(dt * 2.6, 0, 1));
      const dir = new THREE.Vector3().subVectors(a.mic.center, a.g.position).normalize().negate();
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
      a.g.quaternion.slerp(q, clamp(dt * 3, 0, 1));
    } else if (a.state === 'free') {
      /* 游向目标槽位(若有)或布朗 */
      const target = (i < Math.round(conc)) ? null : a.slot;
      if (target) {
        a.g.position.lerp(target, clamp(dt * 1.2, 0, 1));
      } else {
        a.g.position.x += Math.sin(tSim * 1.3 + a.phase) * dt * 0.5;
        a.g.position.y += Math.sin(tSim * 1.7 + a.phase * 2) * dt * 0.32;
        a.g.position.z += Math.cos(tSim * 1.1 + a.phase) * dt * 0.5;
        keepInside(a.g.position);
        a.g.rotation.y += dt * 0.7;
      }
    }
  }
  if (oil.grp) {
    oil.grp.rotation.y += dt * 0.15;
    oil.grp.position.y = oil.pos.y + Math.sin(tSim * 1.2) * 0.03;
  }
  for (const m of micelles) {
    m.grp.position.x += Math.sin(tSim * 0.8 + m.center.x) * dt * 0.12;
    m.grp.position.z += Math.cos(tSim * 0.9 + m.center.z) * dt * 0.12;
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  motion(dts);
  const plan = micellePlan();
  document.getElementById('stFree').textContent = plan.active.length - plan.onOil - plan.micN * MIC_N;
  document.getElementById('stSurf').textContent = oil.present ? plan.onOil : 0;
  document.getElementById('stMic').textContent = plan.micN;

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setConc(conc);
setPlayLabel();
requestAnimationFrame(frame);
</script>
