<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开普勒轨道 · 椭圆、等时面积与 T²∝a³</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffb74d;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(127,208,247,.9); color: #bfe4fb; }
  .lbl.p2 { border-color: rgba(244,143,177,.9); color: #f8c9da; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  :root[data-theme="light"] .lbl.g { color: #9c6f00; }
  :root[data-theme="light"] .lbl.b { color: #0c7ba6; }
  :root[data-theme="light"] .lbl.p2 { color: #b25976; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.sw { color: #ffb74d; }
  :root[data-theme="light"] #stats .v.sw { color: #9c6f00; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.p1 { color: #7fd0f7; border-color: rgba(127,208,247,.7); }
  .chip.p2 { color: #f48fb1; border-color: rgba(244,143,177,.7); }
  .chip.sw { color: #ffd166; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.p1 { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.p2 { color: #b25976; border-color: rgba(178,89,118,.7); }
  :root[data-theme="light"] .chip.sw { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,183,77,.12); color: var(--text); border: 1px solid rgba(255,183,77,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(127,208,247,.2); border-color: rgba(127,208,247,.6); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,183,77,.10); border-color: rgba(255,183,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.10); border-color: rgba(176,118,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffb74d; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xe0e9f3 : 0x05070d);
  starMat.opacity = THEME === 'dark' ? 0.75 : 0;
  halo1.material.opacity = THEME === 'dark' ? 0.85 : 0.45;
  halo2.material.opacity = THEME === 'dark' ? 0.45 : 0.22;
  planeGrid.material.opacity = THEME === 'dark' ? 0.5 : 0.35;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('开普勒轨道 · 椭圆、等时面积与 T²∝a³', 'Kepler Orbits · Ellipses, Equal Areas, T²∝a³');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(3.0, 4.6, 7.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.4));
/* 恒星光:行星被「太阳」照亮的那面朝向焦点 */
const sunLight = new THREE.PointLight(0xfff2cc, 1.6, 0, 0);
scene.add(sunLight);

/* 星空(InstancedMesh 粒子) */
const starMat = new THREE.MeshBasicMaterial({ color: 0xcfd8ea, transparent: true, opacity: 0.75 });
{
  const g = new THREE.IcosahedronGeometry(0.035, 0);
  const stars = new THREE.InstancedMesh(g, starMat, 260);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < 260; i++) {
    const a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1), r = 13 + Math.random() * 16;
    p.set(Math.sin(b) * Math.cos(a) * r, Math.cos(b) * r * 0.7, Math.sin(b) * Math.sin(a) * r);
    const k = 0.5 + Math.random() * 1.3;
    s.set(k, k, k);
    m.compose(p, q, s);
    stars.setMatrixAt(i, m);
  }
  scene.add(stars);
}

/* 轨道平面参考网格 */
const planeGrid = new THREE.PolarGridHelper(7, 12, 5, 48, 0x4a5c72, 0x2c3846);
planeGrid.material.transparent = true;
planeGrid.material.opacity = 0.5;
scene.add(planeGrid);

/* ---------------- 材质 ---------------- */
const M = {
  sun: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  p1: new THREE.MeshStandardMaterial({ color: 0x7fd0f7, roughness: 0.45, metalness: 0.1, emissive: 0x7fd0f7, emissiveIntensity: 0.25 }),
  p2: new THREE.MeshStandardMaterial({ color: 0xf48fb1, roughness: 0.45, metalness: 0.1, emissive: 0xf48fb1, emissiveIntensity: 0.25 }),
  orbit1: new THREE.LineBasicMaterial({ color: 0x7fd0f7, transparent: true, opacity: 0.55 }),
  orbit2: new THREE.LineBasicMaterial({ color: 0xf48fb1, transparent: true, opacity: 0.5 }),
  sweep: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false }),
  marker: new THREE.MeshBasicMaterial({ color: 0x8fa3b8 }),
  tail: new THREE.MeshBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
};

/* ================= 开普勒力学(解析解,纯函数) ================= */
const A1 = 2.4;                 // 行星 1 半长轴(世界单位)
const E2 = 0.2;                 // 行星 2 偏心率(原页固定 0.2)
let ecc = clamp(qsFloat('ecc', 0.5), 0, 0.8);
let a2m = clamp(qsFloat('a2', 1.5), 1.1, 1.8);
const bOf = e => Math.sqrt(1 - e * e);
const rOf = (e, nu) => (1 - e * e) / (1 + e * Math.cos(nu));   // a = 1,nu = 真近点角
/* 开普勒方程 M = E − e·sinE,牛顿迭代求偏近点角 */
function keplerE(Mx, e) {
  let E = Mx;
  for (let i = 0; i < 8; i++) E = E - (E - e * Math.sin(E) - Mx) / (1 - e * Math.cos(E));
  return E;
}
/* 真近点角与日心距(纯函数:相位 t∈[0,1) 一圈,可任意拖相位) */
function orbitState(t, e) {
  const Mx = t * Math.PI * 2;
  const E = keplerE(Mx, e);
  const nu = Math.atan2(Math.sqrt(1 - e * e) * Math.sin(E), Math.cos(E) - e);
  const r = rOf(e, nu);
  return { nu, r };
}
const T2 = () => Math.pow(a2m, 1.5);
/* 轨道上的世界坐标(a 缩放,近日点在 +x,恒星在原点焦点) */
function orbitPos(t, e, a, out) {
  const { nu, r } = orbitState(t, e);
  return out.set(a * r * Math.cos(nu), 0, -a * r * Math.sin(nu));
}

/* ================= 场景物体 ================= */
/* 恒星(焦点,发光) */
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.34, 28, 20), M.sun);
scene.add(sun);
function haloTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,220,130,1)');
  grd.addColorStop(0.35, 'rgba(255,190,90,.45)');
  grd.addColorStop(1, 'rgba(255,170,60,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const haloTex = haloTexture();
const halo1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85 }));
halo1.scale.set(2.2, 2.2, 1);
scene.add(halo1);
const halo2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.45 }));
halo2.scale.set(3.8, 3.8, 1);
scene.add(halo2);

/* 轨道线(LineLoop,e / a₂ 变化时重建) */
function buildOrbitLine(e, a, material) {
  const pts = [];
  for (let i = 0; i < 160; i++) {
    const nu = i / 160 * Math.PI * 2;
    const r = rOf(e, nu) * a;
    pts.push(new THREE.Vector3(r * Math.cos(nu), 0, -r * Math.sin(nu)));
  }
  return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), material);
}
const orbit1 = buildOrbitLine(ecc, A1, M.orbit1);
scene.add(orbit1);
const orbit2 = buildOrbitLine(E2, A1 * a2m, M.orbit2);
scene.add(orbit2);

/* 行星 */
const planet1 = new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 16), M.p1);
scene.add(planet1);
const planet2 = new THREE.Mesh(new THREE.SphereGeometry(0.095, 20, 16), M.p2);
scene.add(planet2);

/* 彗星尾(e ≥ 0.6 时出现,近日点附近变长,指向背日方向) */
const tailGeo = new THREE.ConeGeometry(0.06, 1, 10, 1, true);
tailGeo.translate(0, -0.5, 0);   // 顶点(细端)在行星中心,底面朝外
const tail = new THREE.Mesh(tailGeo, M.tail);
tail.visible = false;
planet1.add(tail);

/* 近日点 / 远日点标记 */
const periDot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), M.marker);
scene.add(periDot);
const aphDot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), M.marker);
scene.add(aphDot);

/* 等时面积扇形(金色三角扇,从恒星铺到行星,覆盖最近 12% 周期) */
const SW_N = 26, SW_SPAN = 0.12;
const swGeo = new THREE.BufferGeometry();
const swPos = new Float32Array((SW_N + 2) * 3);
swGeo.setAttribute('position', new THREE.BufferAttribute(swPos, 3));
{
  const idx = [];
  for (let i = 0; i < SW_N; i++) idx.push(0, i + 1, i + 2);
  swGeo.setIndex(idx);
}
const sweep = new THREE.Mesh(swGeo, M.sweep);
sweep.frustumCulled = false;
scene.add(sweep);

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let showLabels = qsBool('labels', true);
let showP2 = qsBool('p2', true);
let showSweep = qsBool('sweep', true);
let cometMode = false;
let prevEcc = 0.5;
let tSim = 0;
/* 连续相位(不取模,供周期实测);simT/sim2 为取模后的轨道相位 */
let ph1 = ((qsFloat('t', 0) % 1) + 1) % 1;
let ph2 = ph1 / T2();
let acc1 = 0, acc2 = 0, per1 = 0, per2 = 0;   // 周期实测

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
addLabel(() => L('恒星(焦点)', 'star (focus)'), new THREE.Vector3(0, 0.62, 0), 'g');
const lblPeri = addLabel(() => L(`近日点 r = ${(A1 * (1 - ecc)).toFixed(2)}`, `perihelion r = ${(A1 * (1 - ecc)).toFixed(2)}`),
  new THREE.Vector3(1, 0.34, 0), '');
const lblAph = addLabel(() => L(`远日点 r = ${(A1 * (1 + ecc)).toFixed(2)}`, `aphelion r = ${(A1 * (1 + ecc)).toFixed(2)}`),
  new THREE.Vector3(-1, 0.34, 0), '');
const lblV = addLabel(() => {
  const { r } = orbitState(ph1 % 1, ecc);
  const v = Math.sqrt(2 / r - 1);             // a = 1、T = 2π 归一化单位
  return L(`v ≈ ${v.toFixed(2)} (示意)`, `v ≈ ${v.toFixed(2)}`);
}, new THREE.Vector3(0, 0.3, 0), 'b', planet1);
const lblP2 = addLabel(() => L(`行星 2:a × ${a2m.toFixed(2)},T × ${T2().toFixed(2)}`, `planet 2: a × ${a2m.toFixed(2)}, T × ${T2().toFixed(2)}`),
  new THREE.Vector3(0, 0.28, 0), 'p2', planet2);
addLabel(() => L('M = E − e·sinE;r = a(1−e²)/(1+e·cosν) — 纯函数:任意相位瞬时求值',
  'M = E − e·sinE; r = a(1−e²)/(1+e·cosν) — pure functions: any phase evaluates instantly'),
  new THREE.Vector3(0, -1.35, 0), 'st');

/* ================= 讲解步骤 ================= */
function setPhase(p) {
  ph1 = p; ph2 = p / T2();
  acc1 = acc2 = 0; per1 = per2 = 0;
}
function setEcc(v) {
  document.getElementById('ecc').value = Math.round(v * 100);
  document.getElementById('ecc').dispatchEvent(new Event('input'));
}
const STEPS = [
  { b: '轨道是椭圆', be: 'Orbits are ellipses',
    d: '平方反比引力的轨迹必然是圆锥曲线——束缚轨道就是椭圆,恒星在其中一个焦点上(第一定律)。',
    de: 'An inverse-square orbit is a conic section — bound orbits are ellipses with the Sun at one focus (law 1).',
    act: () => setPhase(0) },
  { b: '第二定律:等时面积', be: 'Equal areas in equal times',
    d: '近日点跑得快、远日点走得慢,但「日心连线扫过的面积速率」恒定——金橙扇形每帧都在证明。',
    de: 'Fast at perihelion, slow at aphelion — yet the line to the Sun sweeps area at a constant rate (law 2). Watch the golden sector.',
    act: () => setPhase(0.15) },
  { b: '偏心率的把戏', be: 'The eccentricity trick',
    d: '拖高偏心率:轨道变扁,近日点贴着恒星飞驰——彗星就是这样;圆轨道 e = 0 只是特例。',
    de: 'Raise e and the orbit flattens — the perihelion dive is what comets do. A circle is just the e = 0 special case.',
    act: () => { setEcc(0.8); setPhase(0.02); } },
  { b: '第三定律:T² ∝ a³', be: 'Law 3: T² ∝ a³',
    d: '行星 2 的半长轴是行星 1 的 1.5 倍,周期就是 1.5^1.5 ≈ 1.84 倍——右上角的比值实测验证。',
    de: 'Planet 2\'s semi-major axis is 1.5×, so its period is 1.5^1.5 ≈ 1.84× — the ratio readout verifies it live.',
    act: () => setPhase(0) },
];
function stepIndex() {
  const t = ph1 % 1;
  if (t >= 0.9) return 3;
  if (ecc >= 0.3 && t > 0.2) return 2;
  if (t > 0.12) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elEcc = document.getElementById('ecc');
const elEccVal = document.getElementById('eccVal');
const elA2 = document.getElementById('a2');
const elA2Val = document.getElementById('a2Val');
const elPhase = document.getElementById('phase');
const elPhaseVal = document.getElementById('phaseVal');
const btnComet = document.getElementById('btnComet');
const tglLabels = document.getElementById('tglLabels');
const tglP2 = document.getElementById('tglP2');
const tglSweep = document.getElementById('tglSweep');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elEcc.addEventListener('input', () => {
  ecc = parseInt(elEcc.value, 10) / 100;
  elEccVal.textContent = ecc.toFixed(2);
  orbit1.geometry.dispose();
  orbit1.geometry = buildOrbitLine(ecc, A1, M.orbit1).geometry;
  if (cometMode && ecc < 0.6) { cometMode = false; btnComet.classList.remove('on'); }
});
elA2.addEventListener('input', () => {
  a2m = parseInt(elA2.value, 10) / 100;
  elA2Val.textContent = a2m.toFixed(2) + '×';
  orbit2.geometry.dispose();
  orbit2.geometry = buildOrbitLine(E2, A1 * a2m, M.orbit2).geometry;
  per2 = 0; acc2 = 0;
});
elPhase.addEventListener('input', () => { setPhase(parseInt(elPhase.value, 10) / 1000); });
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
btnComet.addEventListener('click', () => {
  cometMode = !cometMode;
  btnComet.classList.toggle('on', cometMode);
  if (cometMode) { prevEcc = ecc; setEcc(0.8); }
  else setEcc(prevEcc);
});
function applyLabelVis() { labelRenderer.domElement.style.display = showLabels ? '' : 'none'; }
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; applyLabelVis(); });
tglP2.addEventListener('change', () => { showP2 = tglP2.checked; });
tglSweep.addEventListener('change', () => { showSweep = tglSweep.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
/* 初始化控件为 URL 参数值 */
elEcc.value = Math.round(ecc * 100); elEccVal.textContent = ecc.toFixed(2);
elA2.value = Math.round(a2m * 100); elA2Val.textContent = a2m.toFixed(2) + '×';
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
tglLabels.checked = showLabels; applyLabelVis();
tglP2.checked = showP2;
tglSweep.checked = showSweep;
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;

/* ================= 应用 ================= */
const V1 = new THREE.Vector3();
function advance(dts) {
  const p1 = ph1, p2 = ph2;
  ph1 += dts / 10;                 // 行星 1 周期 = 10 s
  ph2 += dts / (10 * T2());        // 行星 2 周期 = 10·(a₂/a₁)^1.5 s
  acc1 += dts; acc2 += dts;
  if (Math.floor(ph1) > Math.floor(p1)) { per1 = acc1; acc1 = 0; }
  if (Math.floor(ph2) > Math.floor(p2)) { per2 = acc2; acc2 = 0; }
}
function apply() {
  const t1 = ph1 % 1, t2 = ((ph2 % 1) + 1) % 1;
  /* 行星沿空间椭圆轨道 */
  orbitPos(t1, ecc, A1, planet1.position);
  orbitPos(t2, E2, A1 * a2m, planet2.position);
  planet2.visible = showP2;
  orbit2.visible = showP2;
  lblP2.visible = showP2;
  /* 近日点 / 远日点标记与标签 */
  periDot.position.set(A1 * (1 - ecc), 0, 0);
  aphDot.position.set(-A1 * (1 + ecc), 0, 0);
  lblPeri.position.set(A1 * (1 - ecc), 0.34, 0);
  lblAph.position.set(-A1 * (1 + ecc), 0.34, 0);
  /* 彗星尾:e ≥ 0.6,越靠近近日点越长,指向背日 */
  if (ecc >= 0.6) {
    const r = orbitState(t1, ecc).r * A1;
    const k = clamp((A1 * (1 + ecc) - r) / (A1 * 2 * ecc), 0, 1);   // 0 远日点 → 1 近日点
    tail.visible = true;
    V1.copy(planet1.position).normalize();
    tail.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), V1.negate());
    tail.scale.set(0.6 + 0.5 * k, 0.3 + 1.6 * k, 0.6 + 0.5 * k);
    tail.material.opacity = 0.15 + 0.45 * k;
  } else tail.visible = false;
  /* 等时面积扇形:顶点在恒星,覆盖最近 12% 周期,过近日点后清除重铺 */
  sweep.visible = showSweep;
  if (showSweep) {
    const t0 = Math.max(0, t1 - SW_SPAN);
    swPos[0] = 0; swPos[1] = 0.015; swPos[2] = 0;
    for (let i = 0; i <= SW_N; i++) {
      orbitPos(lerp(t0, t1, i / SW_N), ecc, A1, V1);
      swPos[(i + 1) * 3] = V1.x; swPos[(i + 1) * 3 + 1] = 0.015; swPos[(i + 1) * 3 + 2] = V1.z;
    }
    swGeo.attributes.position.needsUpdate = true;
  }
  /* 相位滑块跟手 */
  if (document.activeElement !== elPhase) elPhase.value = Math.round(t1 * 1000);
  elPhaseVal.textContent = t1.toFixed(2);
  /* 读数 */
  document.getElementById('stA').innerHTML = (bOf(ecc) / 2).toFixed(2) +
    `<small> ${L('a²/单位时间(守恒)', 'a²/unit time (const.)')}</small>`;
  document.getElementById('stT').innerHTML = T2().toFixed(2) + '<small> = (a₂/a₁)^1.5</small>';
  document.getElementById('stTm').innerHTML = (per1 > 0 && per2 > 0)
    ? (per2 / per1).toFixed(2) + `<small> ${L('实测', 'measured')}</small>` : '—';
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let rafId = 0;
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;
  const tw = 0.9 + 0.1 * Math.sin(tSim * 2.4);
  halo1.scale.set(2.2 * tw, 2.2 * tw, 1);

  if (dts > 0) advance(dts);
  apply();

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { clock.getDelta(); rafId = requestAnimationFrame(frame); }
});

applyTheme();
applyLang();
apply();
setPlayLabel();
rafId = requestAnimationFrame(frame);
</script>
</body>
</html>
