<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开普勒轨道 · 椭圆、等时面积与 T²∝a³</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffb74d;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 420px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.sw { color: #ffb74d; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.p1 { color: #7fd0f7; border-color: rgba(127,208,247,.7); }
  .chip.p2 { color: #f48fb1; border-color: rgba(244,143,177,.7); }
  .chip.sw { color: #ffd166; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.p1 { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.p2 { color: #b25976; border-color: rgba(178,89,118,.7); }
  :root[data-theme="light"] .chip.sw { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 108px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: default;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(255,183,77,.10); border-color: rgba(255,183,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.10); border-color: rgba(176,118,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="开普勒轨道：椭圆、等时面积与 T²∝a³" data-en="Kepler orbits: ellipses, equal areas and T² ∝ a³">开普勒轨道：椭圆、等时面积与 T²∝a³</h1>
  <div class="sub" data-zh="近日点跑得快、远日点走得慢——但扫过的面积一样快;金橙扇形就是「等时面积」的现场 · 空格播放/暂停" data-en="Fast at perihelion, slow at aphelion — yet the swept area stays on schedule; the golden sector is equal-area in action · Space = play/pause">近日点跑得快、远日点走得慢——但扫过的面积一样快;金橙扇形就是「等时面积」的现场 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="面积速率 dA/dt" data-en="areal velocity dA/dt">面积速率 dA/dt</span><span class="v sw" id="stA">—<small> (守恒)</small></span>
  <span class="k" data-zh="行星 2 周期 / 行星 1" data-en="T₂ / T₁">行星 2 周期 / 行星 1</span><span class="v" id="stT">—<small> = (a₂/a₁)^1.5</small></span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip p1" data-zh="行星 1(偏心率可调)" data-en="planet 1 (eccentricity slider)">行星 1(偏心率可调)</span>
    <span class="chip p2" data-zh="行星 2(a 大 1.5 倍)" data-en="planet 2 (a × 1.5)">行星 2(a 大 1.5 倍)</span>
    <span class="chip sw" data-zh="等时扫过的扇形" data-en="equal-area sector">等时扫过的扇形</span>
  </div>
  <div class="row"><label data-zh="偏心率 e" data-en="Eccentricity e">偏心率 e</label><input id="ecc" type="range" min="0" max="80" step="2" value="50"><span class="val" id="eccVal">0.50</span></div>
  <div class="row"><label data-zh="对比行星 a₂" data-en="Planet 2 a₂">对比行星 a₂</label><input id="a2" type="range" min="110" max="180" step="5" value="150"><span class="val" id="a2Val">1.50×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停/播放</button>
    <label style="display:flex;gap:5px;align-items:center;font-size:12px;color:var(--text2)">
      <input id="tglSweep" type="checkbox" checked> <span data-zh="等时扇形" data-en="equal-area sector">等时扇形</span></label>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglTrail" type="checkbox" checked> <span data-zh="行星 2" data-en="planet 2">行星 2</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('开普勒轨道 · 椭圆、等时面积与 T²∝a³', 'Kepler Orbits · Ellipses, Equal Areas, T²∝a³');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

/* ================= 开普勒力学(解析解,纯函数) ================= */
let ecc = 0.5;              // 偏心率
let a2m = 1.5;              // 行星 2 半长轴倍数
let showLabels = true, showTrail = true, showSweep = true;
let simT = 0;               // 行星 1 的轨道相位(0..1)
let sim2 = 0;               // 行星 2 相位

/* 轨道几何:a=1,焦点在原点(恒星),近日点在 +x */
const bOf = e => Math.sqrt(1 - e * e);
const rOf = (e, nu) => (1 - e * e) / (1 + e * Math.cos(nu));   // nu = 真近点角
/* 开普勒方程 M = E − e·sinE,牛顿迭代求偏近点角 */
function keplerE(M, e) {
  let E = M;
  for (let i = 0; i < 8; i++) E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  return E;
}
/* 真近点角与日心距(纯函数:相位 t∈[0,1) 一圈) */
function orbitState(t, e) {
  const M = t * Math.PI * 2;
  const E = keplerE(M, e);
  const nu = Math.atan2(Math.sqrt(1 - e * e) * Math.sin(E), Math.cos(E) - e);
  const r = rOf(e, nu);
  return { nu, r };
}
const T2 = () => Math.pow(a2m, 1.5);

/* ================= 相位讲解 ================= */
const STEPS = [
  { at: 0, b: '轨道是椭圆', d: '平方反比引力的轨迹必然是圆锥曲线——束缚轨道就是椭圆,恒星在其中一个焦点上(第一定律)。',
    be: 'Orbits are ellipses', de: 'An inverse-square orbit is a conic section — bound orbits are ellipses with the Sun at one focus (law 1).' },
  { at: 40, b: '第二定律:等时面积', d: '近日点跑得快、远日点走得慢,但「日心连线扫过的面积速率」恒定——金橙扇形每帧都在证明。',
    be: 'Equal areas in equal times', de: 'Fast at perihelion, slow at aphelion — yet the line to the Sun sweeps area at a constant rate (law 2). Watch the golden sector.' },
  { at: 120, b: '偏心率的把戏', d: '拖高偏心率:轨道变扁,近日点贴着恒星飞驰——彗星就是这样;圆轨道 e = 0 只是特例。',
    be: 'The eccentricity trick', de: 'Raise e and the orbit flattens — the perihelion dive is what comets do. A circle is just the e = 0 special case.' },
  { at: 250, b: '第三定律:T² ∝ a³', d: '行星 2 的半长轴是行星 1 的 1.5 倍,周期就是 1.5^1.5 ≈ 1.84 倍——右上角的比值实测验证。',
    be: 'Law 3: T² ∝ a³', de: 'Planet 2\'s semi-major axis is 1.5×, so its period is 1.5^1.5 ≈ 1.84× — the ratio readout verifies it live.' },
];
function stepIndex() {
  let si = 0;
  STEPS.forEach((s, i) => { if (simT * 100 >= s.at || sim2 * 100 >= s.at * 0.7) si = i; });
  void STEPS;
  if (simT >= 0.98 || sim2 >= 0.98) si = 3;
  else if (ecc >= 0.3 && simT > 0.2) si = Math.max(si, 2);
  else if (simT > 0.15) si = Math.max(si, 1);
  return si;
}

/* ================= 绘制 ================= */
const CX = 700, CY = 450, SC = 300;
function drawOrbit(t) {
  const b = bOf(ecc), c = ecc;
  const ex = CX - c * SC;                        // 恒星(焦点)
  // 轨道线
  ctx.strokeStyle = 'rgba(127,208,247,.5)'; ctx.lineWidth = 1.8;
  ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const nu = i / 120 * Math.PI * 2;
    const r = rOf(ecc, nu) * SC;
    const x = ex + r * Math.cos(nu), y = CY + r * Math.sin(nu);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  // 恒星
  circle(CX, CY, 16, '#ffd166', null);
  if (showLabels) {
    text(L('恒星(焦点)', 'star (focus)'), CX + 26, CY - 16, 12, PAL.dim2);
    text(L('近日点', 'perihelion'), ex + (1 - ecc) * SC - 20, CY - 24, 11.5, PAL.dim2, 'center');
    text(L('远日点', 'aphelion'), ex - (1 + ecc) * SC, CY - 24, 11.5, PAL.dim2, 'center');
  }
  return { ex, b };
}
/* 行星位置(相位 t) */
function planetXY(t, e, ex, b) {
  const { nu, r } = orbitState(t, e);
  return { x: ex + r * SC * Math.cos(nu), y: CY + r * SC * Math.sin(nu), nu, r };
}
function drawSweep(t, ex) {
  if (!showSweep) return;
  const span = 0.12;                             // 扇形覆盖最近 12% 周期
  const t0 = Math.max(0, t - span);
  ctx.fillStyle = 'rgba(255,209,102,.28)';
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  const n = 26;
  for (let i = 0; i <= n; i++) {
    const p = planetXY(lerp(t0, t, i / n), ecc, ex, bOf(ecc));
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath(); ctx.fill();
}
function drawPlanets(t, ex) {
  const p1 = planetXY(t, ecc, ex, bOf(ecc));
  dot(p1.x, p1.y, 10, '#7fd0f7', 12);
  // 速度感:近日点快(用相同 dt 的位移大小表达)
  const p1b = planetXY((t + 0.004) % 1, ecc, ex, bOf(ecc));
  const sp = Math.hypot(p1b.x - p1.x, p1b.y - p1.y);
  if (showLabels) text(L(`v ≈ ${(sp / 0.004 / SC).toFixed(2)} (示意)`, `v ≈ ${(sp / 0.004 / SC).toFixed(2)}`),
    p1.x + 18, p1.y - 14, 11.5, '#7fd0f7', 'left', 700);
  // 行星 2(a2m 倍半长轴,e 取 0.2)
  if (showTrail) {
    const e2 = 0.2, ex2 = CX - e2 * SC * a2m * 0.9;
    ctx.strokeStyle = 'rgba(244,143,177,.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const nu = i / 100 * Math.PI * 2;
      const r = rOf(e2, nu) * SC * a2m * 0.9;
      const x = ex2 + r * Math.cos(nu), y = CY + r * Math.sin(nu);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    const p2 = planetXY((sim2) % 1, e2, ex2, bOf(e2));
    dot(p2.x, p2.y, 9, '#f48fb1', 10);
  }
  function dot(x, y, r, c, g) {
    if (g) { ctx.shadowColor = c; ctx.shadowBlur = g; }
    circle(x, y, r, c, null);
    ctx.shadowBlur = 0;
  }
}

/* ================= 计数 ================= */
const stA = document.getElementById('stA'), stT = document.getElementById('stT');
function updateStats() {
  // 面积速率 = a·b/2(守恒),示意单位
  const b = bOf(ecc);
  stA.innerHTML = (b / 2).toFixed(2) + '<small> a²/单位时间</small>';
  stT.innerHTML = T2().toFixed(2) + '<small> = (a₂/a₁)^1.5</small>';
}

/* ================= 主绘制 ================= */
function draw(t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  const { ex } = drawOrbit(t);
  drawSweep(t, ex);
  drawPlanets(t, ex);
  updateStats();
}

/* ================= UI / 主循环 ================= */
let playing = true, speed = 1;
let last = performance.now();
const elPlay = document.getElementById('play');
const elSteps = document.getElementById('steps');
const elEcc = document.getElementById('ecc');
const elEccVal = document.getElementById('eccVal');
const elA2 = document.getElementById('a2');
const elA2Val = document.getElementById('a2Val');
const tglLabels = document.getElementById('tglLabels');
const tglTrail = document.getElementById('tglTrail');
const tglSweep = document.getElementById('tglSweep');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elEcc.addEventListener('input', () => { ecc = parseInt(elEcc.value, 10) / 100; elEccVal.textContent = ecc.toFixed(2); });
elA2.addEventListener('input', () => { a2m = parseInt(elA2.value, 10) / 100; elA2Val.textContent = a2m.toFixed(2) + '×'; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglTrail.addEventListener('change', () => { showTrail = tglTrail.checked; });
tglSweep.addEventListener('change', () => { showSweep = tglSweep.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) {
    simT = (simT + dt * speed / 10) % 1;
    sim2 = (sim2 + dt * speed / (10 * T2())) % 1;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(simT);
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
requestAnimationFrame(frame);
</script>
</body>
