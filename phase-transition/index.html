<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相变 · 潜热藏在拆结构里</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#fa5252;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e03131;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.s { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.l { border-color: rgba(63,217,169,.9); color: #c3f5e5; }
  .lbl.g { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.s { border-color: rgba(25,113,194,.9); color: #1971c2; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: #ff8787; }
  #stats .v.b { color: #74c0fc; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.s { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.l { color: #c3f5e5; border-color: rgba(63,217,169,.7); }
  .chip.g { color: #ffc9c9; border-color: rgba(255,107,107,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(250,82,82,.10); border-color: rgba(250,82,82,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(224,49,49,.08); border-color: rgba(224,49,49,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffc9c9; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="相变：潜热藏在拆结构里" data-en="Phase Change: latent heat hides in the teardown">相变：潜热藏在拆结构里</h1>
  <div class="sub" data-zh="加热烧杯:固态晶格振动→熔化(温度停住,能量全在拆结构)→液态滑动→沸腾飞散——能量曲线在走,温度曲线在打坐 · 空格播放/暂停" data-en="Heat the beaker: lattice vibrates → melts (temperature stalls — energy all goes to teardown) → liquid slides → boil away · Space = play/pause">加热烧杯:固态晶格振动→熔化(温度停住,能量全在拆结构)→液态滑动→沸腾飞散——能量曲线在走,温度曲线在打坐 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="温度" data-en="temperature">温度</span><span class="v hot" id="stT">—</span>
  <span class="k" data-zh="相态" data-en="phase">相态</span><span class="v b" id="stP">—</span>
  <span class="k" data-zh="注入能量" data-en="energy in">注入能量</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="潜热占比" data-en="latent share">潜热占比</span><span class="v" id="stL">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.s" data-zh="固态(晶格)" data-en="solid (lattice)">固态(晶格)</span>
    <span class="chip.l" data-zh="液态(滑动)" data-en="liquid (sliding)">液态(滑动)</span>
    <span class="chip.g" data-zh="气态(自由)" data-en="gas (free)">气态(自由)</span>
  </div>
  <div class="row"><label data-zh="加热功率" data-en="heating power">加热功率</label><input id="pwr" type="range" min="10" max="100" step="5" value="60"><span class="val" id="pwrVal">60%</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="actions" style="margin-top:8px">
    <button class="abtn" id="btnReset" data-zh="倒回冰块重烧" data-en="rewind to ice">倒回冰块重烧</button>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../kinetic-theory/" data-zh="分子动理论:温度的真相" data-en="kinetic theory: what T means">分子动理论:温度的真相</a>
    <a href="../entropy/" data-zh="熵:结构越拆越乱" data-en="entropy: teardown pays">熵:结构越拆越乱</a>
    <a href="../hydrogen-bond/" data-zh="水的反常:氢键的账(规划中)" data-en="water's anomalies (planned)">水的反常:氢键的账(规划中)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('相变 · 潜热', 'Phase Change · latent heat');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.4, 2.4, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  beaker: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.14, roughness: 0.15, side: THREE.DoubleSide }),
  flame: mat(0xff922b, { emissive: 0xff922b, emissiveIntensity: 0.8 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
};

/* ================= 烧杯与分子 ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.16, 4.2), M.floor);
floor.position.y = -0.1;
scene.add(floor);
const beaker = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.1, 2.3, 36, 1, true), M.beaker);
beaker.position.y = 1.2;
scene.add(beaker);
const burner = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 0.16, 24), M.flame);
burner.position.y = 0.06;
scene.add(burner);
const stand = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 1.6), M.frame);
stand.position.y = 0.0;
scene.add(stand);
/* 分子 */
const MAXN = 64;
const molMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.075, 12, 10),
  new THREE.MeshStandardMaterial({ color: 0x74c0fc, roughness: 0.35, emissive: 0x74c0fc, emissiveIntensity: 0.15 }), MAXN);
scene.add(molMesh);
const m4 = new THREE.Matrix4();
const mols = [];
const HOME = [];       // 晶格基准位
function seed() {
  mols.length = 0;
  HOME.length = 0;
  const n = 4;
  for (let ix = 0; ix < n; ix++) for (let iy = 0; iy < n; iy++) for (let iz = 0; iz < n; iz++) {
    if (mols.length >= MAXN) break;
    const px = -0.66 + ix * 0.44, py = 0.35 + iy * 0.42, pz = -0.66 + iz * 0.44;
    mols.push({ home: new THREE.Vector3(px, py, pz), p: new THREE.Vector3(px, py, pz),
      v: new THREE.Vector3(rand(-0.2, 0.2), rand(-0.2, 0.2), rand(-0.2, 0.2)) });
    HOME.push(px, py, pz);
  }
}

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let power = 0.6;
let energy = 0;        // 归一化注入能量 0..1
let tSim = 0;
const E_MELT0 = 0.28, E_MELT1 = 0.44;      // 熔化平台
const E_BOIL0 = 0.68, E_BOIL1 = 0.90;      // 沸腾平台
function phaseOf(e) {
  if (e < E_MELT0) return 'solid';
  if (e < E_MELT1) return 'melting';
  if (e < E_BOIL0) return 'liquid';
  if (e < E_BOIL1) return 'boiling';
  return 'gas';
}
/* 温度曲线:平台处停住 */
function tempOf(e) {
  if (e < E_MELT0) return lerp(-20, 0, e / E_MELT0);
  if (e < E_MELT1) return 0;
  if (e < E_BOIL0) return lerp(0, 100, (e - E_MELT1) / (E_BOIL0 - E_MELT1));
  if (e < E_BOIL1) return 100;
  return lerp(100, 140, (e - E_BOIL1) / (1 - E_BOIL1));
}
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblBurner = addLabel(() => L('本生灯:持续注入能量', 'burner: steady energy in'), new THREE.Vector3(0, 0.0, 1.0), 'g');
const lblStatus = addLabel(() => {
  const ph = phaseOf(energy);
  if (ph === 'melting') return L('熔化平台:能量全在拆晶格,温度不动', 'melting plateau: energy tears the lattice, T holds');
  if (ph === 'boiling') return L('沸腾平台:能量全在挣脱抱团,温度不动', 'boiling plateau: energy frees molecules, T holds');
  if (ph === 'solid') return L('固态:晶格振动,温度爬升', 'solid: lattice vibrates, T climbs');
  if (ph === 'liquid') return L('液态:能滑动但抱团,温度爬升', 'liquid: slides but sticks, T climbs');
  return L('气态:彻底自由', 'gas: totally free');
}, new THREE.Vector3(0, 3.4, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '固态:晶格合唱', be: 'Solid: the lattice chorus',
    d: '分子被键锁在格点上,只能原地抖动——加热只是让抖动幅度变大,队伍不乱。',
    de: 'Bonds lock molecules to lattice sites; they jitter in place as heat grows the amplitude — order holds.',
    act: () => { energy = 0.1; document.getElementById('pwr').value = 60; power = 0.6; } },
  { b: '熔化:温度打坐', be: 'Melting: T meditates',
    d: '到 0°C 后继续加热,温度却停住——能量全数拿去拆晶格(潜热),一分都不给升温。拆完才继续涨。',
    de: 'At 0°C extra heat goes to tearing the lattice (latent heat), not to raising T — only after the teardown does it climb.',
    act: () => { energy = 0.35; } },
  { b: '液态:能滑能抱', be: 'Liquid: slide but stick',
    d: '键松了,分子能互相滑动、保持接触——液体会流动、有表面张力,但还没散伙。',
    de: 'Bonds loosen: molecules slide past each other yet stay in touch — it flows, holds surface tension, but has not left.',
    act: () => { energy = 0.55; } },
  { b: '沸腾:彻底散伙', be: 'Boiling: full freedom',
    d: '100°C 又一个平台:能量全用于挣脱彼此,分子飞进空气——潜热再次吞掉所有输入。',
    de: 'Another plateau at 100°C: energy buys total freedom — latent heat swallows every input again.',
    act: () => { energy = 0.8; } },
  { b: '平台的两面', be: 'The plateau cuts both ways',
    d: '反着放:蒸汽冷凝、水结冰,都会在平台温度把潜热原样吐出来——暖气片的「相变储热」就是这个原理。',
    de: 'Run it backwards: condensing steam and freezing water dump the same latent heat at the plateau — phase-change heating pads.',
    act: () => { energy = 0.3; } },
];
function stepIndex() {
  const ph = phaseOf(energy);
  if (ph === 'boiling') return 3;
  if (ph === 'liquid') return 2;
  if (ph === 'melting') return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elPwr = document.getElementById('pwr');
const elPwrVal = document.getElementById('pwrVal');
const btnReset = document.getElementById('btnReset');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stT = document.getElementById('stT'), stP = document.getElementById('stP'),
  stE = document.getElementById('stE'), stL = document.getElementById('stL');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPwr.addEventListener('input', () => { power = parseInt(elPwr.value, 10) / 100; elPwrVal.textContent = elPwr.value + '%'; });
btnReset.addEventListener('click', () => { energy = 0; seed(); });
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  const ph = phaseOf(energy);
  if (playing && energy < 1) energy = clamp(energy + dts * power * 0.022, 0, 1);
  const T = tempOf(energy);
  const vib = ph === 'solid' ? 0.03 + energy / E_MELT0 * 0.05 : 0;

  /* 分子行为:固态抖动 / 液态游动 / 气态飞散 */
  for (let i = 0; i < mols.length; i++) {
    const m = mols[i];
    if (ph === 'solid') {
      m.p.set(
        m.home.x + Math.sin(tSim * 6 + i * 1.7) * vib,
        m.home.y + Math.cos(tSim * 7 + i * 2.1) * vib,
        m.home.z + Math.sin(tSim * 5 + i * 2.7) * vib);
    } else if (ph === 'melting' || ph === 'liquid') {
      m.v.x += rand(-0.4, 0.4) * dts * (ph === 'melting' ? 0.6 : 1.2);
      m.v.y += rand(-0.4, 0.4) * dts * (ph === 'melting' ? 0.6 : 1.2) - (ph === 'liquid' ? m.v.y * 0.02 * dts * 60 : 0);
      m.v.z += rand(-0.4, 0.4) * dts * (ph === 'melting' ? 0.6 : 1.2);
      m.v.clampLength(0, ph === 'melting' ? 0.5 : 0.9);
      m.p.addScaledVector(m.v, dts);
      /* 约束在烧杯内液面下 */
      const rr = Math.hypot(m.p.x, m.p.z);
      if (rr > 1.0) { m.p.x *= 1.0 / rr; m.p.z *= 1.0 / rr; m.v.multiplyScalar(-0.4); }
      m.p.y = clamp(m.p.y, 0.28, 1.7 - energy * 0.4);
      m.v.y -= 0.2 * dts;
    } else {
      m.v.y += 0.25 * dts;
      m.p.addScaledVector(m.v, dts);
      if (m.p.y > 4.5 || Math.hypot(m.p.x, m.p.z) > 2.6) {
        m.p.set(rand(-0.3, 0.3), 1.0, rand(-0.3, 0.3));
        m.v.set(rand(-0.4, 0.4), rand(0.8, 1.6), rand(-0.4, 0.4));
      }
    }
  }
  mols.forEach((m, i) => {
    m4.makeScale(1, 1, 1);
    m4.setPosition(m.p);
    molMesh.setMatrixAt(i, m4);
  });
  molMesh.instanceMatrix.needsUpdate = true;
  /* 火苗脉动 */
  M.flame.emissiveIntensity = playing ? 0.5 + 0.5 * Math.abs(Math.sin(tSim * 9)) * power : 0.3;
  burner.scale.setScalar(0.9 + 0.12 * Math.sin(tSim * 12) * power);

  const latent = (energy >= E_MELT0 && energy <= E_MELT1) || (energy >= E_BOIL0 && energy <= E_BOIL1);
  stT.innerHTML = T.toFixed(0) + '<small> °C</small>';
  stP.textContent = ph === 'solid' ? L('固态', 'solid') : ph === 'melting' ? L('熔化中', 'melting')
    : ph === 'liquid' ? L('液态', 'liquid') : ph === 'boiling' ? L('沸腾中', 'boiling') : L('气态', 'gas');
  stE.innerHTML = (energy * 100).toFixed(0) + '<small> %</small>';
  stL.innerHTML = (latent ? 100 : Math.round(Math.min(energy / E_MELT1, 1) * 30)).toFixed(0) + '<small> %</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

seed();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
