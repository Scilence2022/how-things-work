<style>
  :root,:root[data-theme="dark"]{

  :root[data-theme="light"]{

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}

  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}

    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}

  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;

  #play:hover{filter:brightness(1.12)}

  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具与全局 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,f)=>a+(b-a)*f;
const QS=new URLSearchParams(location.search);
const htmlEl=document.documentElement,el=id=>document.getElementById(id);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
let playing=!QS.has('pause'),labelsOn=QS.get('labels')!=='0';
let timeScale=clamp(parseFloat(QS.get('speed'))||1,0.15,2);

/* ============ 气动数据（真实量级，FAA 结冰试飞研究的典型结果） =
   干净翼型：C_L=0.088(α+2°)，α_stall=15°，C_L,max≈1.50
   结冰翼型：C_L=0.082(α+3°)，α_stall≈8°，C_L,max≈0.90（−40%）
   附加阻力 ΔC_D0≈+0.045；冰厚 0-25 mm（%→mm 换算 ×0.25） */
const CL_CLEAN=a=>a<=15?0.088*(a+2):1.50-0.09*(a-15);
const CL_ICE =a=>a<=8 ?0.082*(a+3):0.90-0.075*(a-8);

/* ============ 翼型几何（NACA 对称，弦长 3） ============ */
const C=3;
function ytHalf(xi){ // 半厚度（弦长归一化）
  return 0.6*(0.2969*Math.sqrt(xi)-0.1260*xi-0.3516*xi*xi+0.2843*xi**3-0.1015*xi**4);
}
const surfY=xx=>{const xi=clamp(xx/C,0,1);return ytHalf(xi)*C;}; // 局部坐标 x∈[0,3]

/* ============ 渲染基础 ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
el('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x10161c,18,42);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(1.2,1.4,9.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.6,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
scene.add(new THREE.HemisphereLight(0xcfe0f2,0x14181e,0.9));
const key=new THREE.DirectionalLight(0xffffff,1.0);key.position.set(4,6,7);scene.add(key);

/* ============ 风洞 ============ */
const tunnel=new THREE.Group();scene.add(tunnel);
const wallM=new THREE.MeshStandardMaterial({color:0x1a232c,roughness:0.85,transparent:true,opacity:0.5,side:THREE.DoubleSide});
const wallG=new THREE.PlaneGeometry(16,6);
for(const s of[-2.1,2.1]){
  const w=new THREE.Mesh(wallG,wallM);w.position.set(2,0,s);tunnel.add(w);
}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,4.4),new THREE.MeshStandardMaterial({color:0x161e26,roughness:0.95}));
floor.rotation.x=-Math.PI/2;floor.position.set(2,-1.55,0);tunnel.add(floor);

/* ============ 机翼（绕 1/4 弦长转动） ============ */
const airG=new THREE.Group();scene.add(airG);           // 迎角旋转组
const foilG=new THREE.Group();airG.add(foilG);          // 内部：弦向偏移
foilG.position.x=-0.75;
(function buildFoil(){
  const N=34,pts=[];
  for(let i=N;i>=0;i--){const xi=Math.cos(i/N*Math.PI/2);pts.push(new THREE.Vector2(xi*C,surfY(xi*C)));}
  for(let i=1;i<=N;i++){const xi=1-Math.cos(i/N*Math.PI/2);pts.push(new THREE.Vector2(xi*C,-surfY(xi*C)));}
  const sh=new THREE.Shape();pts.forEach((p,i)=>i?sh.lineTo(p.x,p.y):sh.moveTo(p.x,p.y));
  sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:1.7,bevelEnabled:false});
  geo.translate(0,0,-0.85);
  foilG.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xb8c4ce,roughness:0.35,metalness:0.55})));
})();
/* 冰角：前缘上下表面一串球，随冰厚/云温长成角状 */
const iceG=new THREE.Group();foilG.add(iceG);
const iceM=new THREE.MeshStandardMaterial({color:0xcfe6f5,roughness:0.15,metalness:0.1,transparent:true,opacity:0.96});
const iceSpheres=[];
{
  const up=[0.02,0.05,0.09,0.14,0.20,0.27],lo=[0.02,0.05,0.09,0.13];
  up.forEach((xi,i)=>{
    const s=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),iceM);
    s.position.set(xi*C,surfY(xi*C)+0.01,0);iceG.add(s);
    iceSpheres.push({m:s,base:0.06+i*0.012,horn:i>0&&i<4?1.5:0.9,up:true,xi});
  });
  lo.forEach((xi,i)=>{
    const s=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),iceM);
    s.position.set(xi*C,-surfY(xi*C)-0.01,0);iceG.add(s);
    iceSpheres.push({m:s,base:0.045+i*0.008,horn:0.7,up:false,xi});
  });
}
function updateIce(thick,temp){
  const f=clamp(thick/100,0,1);
  const glac=clamp((temp-4)/16,0,1);            // 0=冷(雾凇) 1=暖(明冰)
  iceG.visible=f>0.005;
  for(const s of iceSpheres){
    const r=s.base*(0.4+1.1*f*s.horn*(0.5+0.5*glac));
    s.m.scale.setScalar(Math.max(r,0.001));
    s.m.scale.y*=1.25;
    if(s.up&&s.horn>1)s.m.position.x=s.xi*C+f*glac*0.12; // 明冰角向后延伸
  }
}
/* 分离点标记 */
const sepDot=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8),
  new THREE.MeshBasicMaterial({color:0xff6b6b}));
foilG.add(sepDot);

/* ============ 粒子：过冷水滴 / 流线示踪 / 冰屑 ============ */
const ND=320,NT=200,NK=18,PN=ND+NT+NK;
const pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3);
const pKind=new Uint8Array(PN),pLife=new Float32Array(PN),pSeed=new Float32Array(PN);
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pMat=new THREE.PointsMaterial({size:0.075,vertexColors:true,transparent:true,opacity:0.9,depthWrite:false});
const points=new THREE.Points(pGeo,pMat);points.frustumCulled=false;scene.add(points);
function setPColor(i){
  const dark=THEME==='dark';
  const c=pKind[i]===1?(dark?0x74c0fc:0x1864ab):pKind[i]===3?(dark?0xcfe6f5:0x7aa7c6):(dark?0x9fd8ff:0x4b93c8);
  pCol[i*3]=((c>>16)&255)/255;pCol[i*3+1]=((c>>8)&255)/255;pCol[i*3+2]=(c&255)/255;
}
function seedParticles(){
  let i=0;
  for(;i<ND;i++){ // 水滴：左侧均匀入场
    pKind[i]=0;pLife[i]=1;
    pPos[i*3]=-7.5+Math.random()*15;
    pPos[i*3+1]=(Math.random()-0.5)*4.6;
    pPos[i*3+2]=(Math.random()-0.5)*1.9;
  }
  for(;i<ND+NT;i++){ // 示踪流线
    pKind[i]=1;pLife[i]=1;
    pPos[i*3]=-7.5+Math.random()*15;
    pPos[i*3+1]=(Math.random()-0.5)*4.2;
    pPos[i*3+2]=(Math.random()-0.5)*0.4;
  }
  for(;i<PN;i++){pKind[i]=3;pLife[i]=0;pPos[i*3+1]=99;}
  for(let k=0;k<PN;k++)setPColor(k);
  pGeo.attributes.color.needsUpdate=true;
}
seedParticles();

/* ============ 状态 ============ */
let alpha=5,thick=0,autoIce=true,bootT=0,buffet=0,simT=0;
const UINF=12;
function iceFrac(){return clamp(thick/60,0,1);}
function stallAoA(){return lerp(15,8,iceFrac());}
function curCL(){
  const f=iceFrac();
  const a=alpha;
  return lerp(CL_CLEAN(a),CL_ICE(a),f);
}
function sepFrac(){ // 分离点位置（弦长分数，1=尾缘）
  const a=alpha,f=iceFrac();
  const clean=clamp(1-Math.pow(Math.max(a,0)/16,1.5)*0.92,0.04,1);
  const iced=clamp(1-Math.pow(Math.max(a,0)/8.5,1.4)*0.97,0.03,1);
  return lerp(clean,iced,f);
}

/* ============ 标签 ============ */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn,parent){
  const div=document.createElement('div');div.className='lbl '+cls;
  div.textContent=textFn();
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||scene).add(o);
  labelReg.push({o,text:textFn,vis:visFn||(()=>true)});
  return o;
}
addLabel(()=>L('前缘冰角：过冷水滴在此冻结','Ice horn: droplets freeze on impact'),new THREE.Vector3(-0.55,0.95,0),'o',()=>thick>4);
addLabel(()=>L('分离点前移 → 升力塌落','Separation moves forward → lift loss'),new THREE.Vector3(1.1,-0.85,0),'r',()=>thick>25);
addLabel(()=>L('抖振！气流拍打翼面','BUFFET! flow slaps the wing'),new THREE.Vector3(0.6,1.5,0),'r',()=>buffet>0.05);
  const sepPill=addLabel(()=>L('分离点','sep. point'),new THREE.Vector3(0,0,0),'r',()=>true);
/* ============ 步骤 ============ */
const STEPS=[
 {zh:'过冷水滴：云中 0°C 以下的液态水，撞上机翼瞬间冻结',en:'Supercooled droplets: liquid below 0°C, freezing on impact'},
 {zh:'冰角生长：驻点附近一格格长出冰角，翼型被悄悄改坏',en:'The horn grows drop by drop near stagnation, corrupting the airfoil'},
 {zh:'提前分离：冰脊扰乱边界层，同迎角下分离点大幅前移',en:'The ice ridge trips the boundary layer: separation jumps forward'},
 {zh:'升力塌落：C_L,max 跌约 40%，失速迎角 15°→8°',en:'C_L,max drops ~40%; stall AoA 15°→8°'},
 {zh:'抖振告警：分离气流拍打翼面，机头抖振——失速前兆',en:'Buffet: separated flow slaps the wing — the pre-stall warning'},
 {zh:'除冰带：充气胀破冰壳，冰屑吹落，升力曲线当场回弹',en:'Boots inflate, crack the ice off — the lift curve snaps back'},
];
let activeStep=0;
function buildSteps(){
  const o=el('steps');o.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();gotoStep(i);});
    o.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  playing=true;el('play').textContent=L('暂停','Pause');
  if(i<=1){thick=Math.min(thick,10);el('sIce').value=thick;}
  if(i===2){thick=55;alpha=6;}
  if(i===3){thick=80;alpha=7;}
  if(i===4){thick=70;alpha=9;}
  if(i===5){thick=70;alpha=5;doBoot();}
  syncSliders();
}
function syncSliders(){
  el('sAoA').value=alpha;el('sAoAVal').textContent=alpha.toFixed(1)+'°';
  el('sIce').value=Math.round(thick);el('sIceVal').textContent=(thick*0.25).toFixed(1)+' mm';
}

/* ============ 交互 ============ */
function doBoot(){
  if(bootT>0)return;
  bootT=0.9;
  // 冰屑飞落
  let k=0;
  for(let i=ND+NT;i<PN&&k<NK;i++,k++){
    pKind[i]=3;pLife[i]=1.4;pSeed[i]=Math.random()*1.5;
    pPos[i*3]=-0.2+Math.random()*0.5;
    pPos[i*3+1]=0.15+Math.random()*0.2;
    pPos[i*3+2]=(Math.random()-0.5)*1.6;
    setPColor(i);
  }
}
el('btnAuto').addEventListener('click',()=>{autoIce=!autoIce;el('btnAuto').classList.toggle('on',autoIce);});
el('btnBoot').addEventListener('click',doBoot);
el('btnStall').addEventListener('click',()=>{alpha=Math.min(18,stallAoA()+2);syncSliders();});
el('sAoA').addEventListener('input',e=>{alpha=+e.target.value;el('sAoAVal').textContent=alpha.toFixed(1)+'°';});
el('sIce').addEventListener('input',e=>{thick=+e.target.value;el('sIceVal').textContent=(thick*0.25).toFixed(1)+' mm';});
el('sTemp').addEventListener('input',e=>{el('sTempVal').textContent='−'+e.target.value+' °C';});
el('sLWC').addEventListener('input',e=>{el('sLWCVal').textContent=(+e.target.value/100).toFixed(2)+' g/m³';});
el('play').addEventListener('click',()=>{playing=!playing;el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
el('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
el('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
el('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
el('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();el('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ============ 主题 / 语言 ============ */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  el('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x10161c:0xdde7ee);
  scene.fog.color.setHex(dark?0x10161c:0xdde7ee);
  wallM.color.setHex(dark?0x1a232c:0x9db2c2);
  floor.material.color.setHex(dark?0x161e26:0xb4c4d0);
  for(let k=0;k<PN;k++)setPColor(k);
  pGeo.attributes.color.needsUpdate=true;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(e=>{
    if(e.tagName==='INPUT')return;
    e.textContent=LANG==='en'?(e.dataset.en||e.dataset.zh):e.dataset.zh;
  });
  el('langBtn').textContent=LANG==='en'?'ZH':'EN';
  el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps();
}

/* ============ 统计与 C_L-α 图 ============ */
function updateStats(){
  el('sv0').innerHTML=curCL().toFixed(2);
  el('sv1').innerHTML=stallAoA().toFixed(1)+'<small> °</small>';
  el('sv2').innerHTML='+'+(iceFrac()*0.045/0.02*100).toFixed(0)+'<small> %</small>';
  el('sv3').innerHTML=(thick*0.25).toFixed(1)+'<small> mm</small>';
  drawCL();
}
const cv=el('cvCL'),cx=cv.getContext('2d');
function drawCL(){
  const W=cv.width,H=cv.height,dark=THEME==='dark';
  cx.clearRect(0,0,W,H);
  cx.fillStyle=dark?'rgba(255,255,255,.04)':'rgba(15,25,40,.05)';
  cx.fillRect(0,0,W,H);
  const X=a=>(a+4)/(20+4)*(W-56)+42;
  const Y=cl=>10+(1-cl)/1.7*(H-26);
  cx.strokeStyle=dark?'#5b6b7d':'#8a99a9';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(42,8);cx.lineTo(42,Y(0));cx.lineTo(W-8,Y(0));cx.stroke();
  cx.fillStyle=dark?'#9fb0c3':'#5b6b7d';cx.font='10px sans-serif';
  cx.fillText(L('C_L–α 升力曲线','C_L–α lift curve'),46,18);
  cx.fillText('0',(40),H-14);cx.fillText('10°',(X(10)-8),H-14);cx.fillText('20°',(X(20)-10),H-14);
  const curve=(fn,col,dash)=>{
    cx.strokeStyle=col;cx.lineWidth=2;cx.setLineDash(dash);cx.beginPath();
    for(let a=-4;a<=20;a+=0.25){
      const y=Y(Math.max(fn(a),0.02));
      a===-4?cx.moveTo(X(a),y):cx.lineTo(X(a),y);
    }
    cx.stroke();cx.setLineDash([]);
  };
  curve(CL_CLEAN,'#74c0fc',[]);
  curve(a=>Math.max(CL_ICE(a),0.02),'#ffa94d',[4,3]);
  // 失速迎角标记
  const sa=stallAoA();
  cx.strokeStyle=dark?'rgba(255,107,107,.6)':'rgba(201,42,42,.6)';
  cx.setLineDash([2,3]);cx.beginPath();cx.moveTo(X(sa),8);cx.lineTo(X(sa),Y(0));cx.stroke();cx.setLineDash([]);
  // 当前点（带冰曲线）
  const cl=Math.max(curCL(),0.02);
  cx.fillStyle='#ff6b6b';cx.beginPath();cx.arc(X(alpha),Y(cl),4.5,0,7);cx.fill();
  cx.strokeStyle=dark?'#fff':'#16202c';cx.lineWidth=1;cx.stroke();
}

/* ============ 物理推进 ============ */
function stepSim(dt){
  simT+=dt;
  const temp=+el('sTemp').value,lwc=+el('sLWC').value/100;
  /* —— 云中结冰：厚度生长 ∝ 液态水含量 × 速度 —— */
  if(autoIce&&bootT<=0&&thick<100){
    thick=Math.min(100,thick+dt*lwc*9.5);          // 满冰约 19 s（LWC=1）
    el('sIce').value=Math.round(thick);el('sIceVal').textContent=(thick*0.25).toFixed(1)+' mm';
  }
  bootT=Math.max(0,bootT-dt);
  // 分离点标记跟随（sepPill 即 CSS2DObject）
  buffet+=((alpha>stallAoA()?1:0)-buffet)*Math.min(1,dt*4);
  airG.rotation.z=alpha*Math.PI/180+buffet*0.006*Math.sin(simT*43);
  updateIce(thick,temp);
  const sf=sepFrac();
  sepDot.position.set(sf*C,surfY(sf*C)+0.06,0);
  sepDot.visible=alpha>0.5;
  sepPill.visible=labelsOn&&alpha>0.5;
  if(sepPill.visible)sepPill.position.set(sf*C-0.75,surfY(sf*C)+0.5,0);
  /* —— 粒子 —— */
  const capR=0.45*(1+iceFrac()*1.3);              // 撞击捕获区随冰角变大
  for(let i=0;i<PN;i++){
    const i3=i*3;
    if(pKind[i]===3){ // 冰屑：重力下落
      if(pLife[i]>0){
        pLife[i]-=dt;
        pPos[i3]+=dt*1.5;pPos[i3+1]-=dt*(2.5+pSeed[i]);
        if(pLife[i]<=0)pPos[i3+1]=99;
      }
      continue;
    }
    const speed=pKind[i]===0?UINF:UINF*0.92;
    pPos[i3]+=speed*dt;
    // 机翼局部坐标（绕 1/4 弦点转 −α）
    const ca=Math.cos(-airG.rotation.z),sa2=Math.sin(-airG.rotation.z);
    const px=pPos[i3]-0,py=pPos[i3+1];
    const lx=px*ca-py*sa2+0.75,ly=px*sa2+py*ca;
    if(pKind[i]===0){ // 水滴：进入前缘捕获区→冻结
      if(pPos[i3]>-0.9&&pPos[i3]<-0.15&&Math.abs(py)<capR&&Math.abs(pPos[i3+2])<1.0){
        if(autoIce&&thick<100){thick=Math.min(100,thick+0.12*lwc);}
        pPos[i3]=-8;pPos[i3+1]=(Math.random()-0.5)*4.6;   // 回收重发
        continue;
      }
      // 轻微绕流偏转（驻点排开）
      if(lx>-0.3&&lx<0.5&&Math.abs(ly)<0.5)
        pPos[i3+1]+=Math.sign(ly||1)*(0.5-Math.abs(ly))*dt*6;
    }else{ // 示踪流线
      if(lx>0&&lx<C&&Math.abs(ly)<0.9){
        const sfL=sepFrac()*C;
        if(lx<sfL){ // 附着段：贴表面
          const tgt=(ly>0?1:-1)*(surfY(lx)+0.12);
          pPos[i3+1]+=(tgt-py)*dt*9;
        }else{      // 分离段：慢速死水区+下洗
          pPos[i3]+=speed*dt*0.42;
          pPos[i3+1]-=dt*(1.6+buffet*1.2*Math.sin(simT*30+i));
        }
      }else if(lx<=0&&Math.abs(ly)<0.45){ // 前缘驻点附近上下排开
        pPos[i3+1]+=Math.sign(ly||1)*(0.45-Math.abs(ly))*dt*7;
      }
    }
    // 出界回收
    if(pPos[i3]>8.5){
      pPos[i3]=-7.5-Math.random()*0.5;
      pPos[i3+1]=(Math.random()-0.5)*(pKind[i]===0?4.6:4.2);
      pPos[i3+2]=pKind[i]===1?(Math.random()-0.5)*0.4:pPos[i3+2];
    }
  }
  pGeo.attributes.position.needsUpdate=true;
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  if(playing){simT+=dt0*timeScale;stepSim(dt0*timeScale);}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSteps();
el('tglLabels').checked=labelsOn;
updateStats();start();
</script>
</body>
