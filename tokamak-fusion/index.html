<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核聚变与托卡马克 · 把恒星装进磁瓶</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.v { border-color: rgba(178,130,255,.9); color: #e4d4ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.v { color:#6741d9; }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }
  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="核聚变与托卡马克:把恒星装进磁瓶" data-en="Fusion & the Tokamak: Caging a Star in a Magnetic Bottle">核聚变与托卡马克:把恒星装进磁瓶</h1>
  <div class="sub" data-zh="两个氘核都带正电,库仑壁垒要求一亿度的高温;带电粒子绕磁力线打转,托卡马克把环向场+等离子体电流拧成螺旋磁场,一层层磁面把等离子体裹在环里;D-T 聚变每次放出 17.6 MeV——α 粒子留在里面自加热,中子飞出去产氚、带出能量;劳森三乘积够不上就熄火,磁面一破就是等离子体破裂 · 3D 交互演示 · 拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Two deuterons both carry positive charge — the Coulomb barrier demands ~100 million K; charged particles spiral around field lines, and the tokamak twists toroidal field plus plasma current into a helical field whose nested flux surfaces wrap the plasma ring; each D-T fusion releases 17.6 MeV — alphas stay inside and self-heat while neutrons escape to breed tritium and carry power; miss the Lawson triple product and it dies; break the surfaces and the whole plasma disrupts · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">核聚变与托卡马克:把恒星装进磁瓶</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="温度 T" data-en="Temp T">温度 T</span><span class="v warn" id="stT">—</span>
  <span class="k" data-zh="密度 n" data-en="Density n">密度 n</span><span class="v" id="stN">—</span>
  <span class="k" data-zh="约束时间 τ" data-en="Confinement τ">约束时间 τ</span><span class="v" id="stTau">—</span>
  <span class="k" data-zh="三乘积/劳森" data-en="Triple product">三乘积/劳森</span><span class="v" id="stTP">—</span>
  <span class="k" data-zh="Q 值 · 安全因子 q" data-en="Q · safety factor q">Q 值 · 安全因子 q</span><span class="v ok" id="stQ">—</span>
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v ok" id="stS">—</span>
</div>

<div id="plot">
  <h3 data-zh="聚变功率 vs 温度:D-T 反应率陡得吓人" data-en="Fusion power vs temperature: the D-T reactivity cliff">聚变功率 vs 温度:D-T 反应率陡得吓人</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="等离子体(色随温度)" data-en="plasma (colored by temperature)">等离子体(色随温度)</span>
    <span class="chip.b" data-zh="青管=螺旋磁力线/磁面" data-en="cyan tubes = helical field / flux surfaces">青管=螺旋磁力线/磁面</span>
    <span class="chip.g" data-zh="金点=α 自加热" data-en="gold = α self-heating">金点=α 自加热</span>
    <span class="chip.o" data-zh="白条=中子逃逸" data-en="white streaks = escaping neutrons">白条=中子逃逸</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnCut" data-zh="磁面剖面" data-en="flux-surface cutaway">磁面剖面</button>
    <button class="abtn brk" id="btnDisrupt" data-zh="触发破裂" data-en="trigger disruption">触发破裂</button>
    <button class="abtn" id="btnRestart" data-zh="重新点火" data-en="re-ignite">重新点火</button>
  </div>
  <div class="row"><label data-zh="等离子体电流 I_p" data-en="Plasma current I_p">等离子体电流 I_p</label><input id="ip" type="range" min="2" max="15" step="0.5" value="15"><span class="val" id="ipVal">15 MA</span></div>
  <div class="row"><label data-zh="环向磁场 B_t" data-en="Toroidal field B_t">环向磁场 B_t</label><input id="bt" type="range" min="1" max="12" step="0.5" value="5.3"><span class="val" id="btVal">5.3 T</span></div>
  <div class="row"><label data-zh="加热功率 P_heat" data-en="Heating power">加热功率 P_heat</label><input id="ph" type="range" min="0" max="100" step="1" value="50"><span class="val" id="phVal">50 MW</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../stellar-lifecycle/" data-zh="引力约束版:恒星核心" data-en="the gravity-confined version: a stellar core">引力约束版:恒星核心</a>
    <a href="../fission-chain/" data-zh="拆核放能:裂变对照" data-en="splitting nuclei: the fission contrast">拆核放能:裂变对照</a>
    <a href="../superconductivity/" data-zh="磁瓶的骨头:超导磁体" data-en="the bottle's skeleton: superconducting magnets">磁瓶的骨头:超导磁体</a>
    <a href="../nuclear-reactor/" data-zh="已商用的表亲:核电站" data-en="the commercial cousin: the fission plant">已商用的表亲:核电站</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x18243a, 26, 60);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
  scene.fog.color = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('核聚变与托卡马克 · 把恒星装进磁瓶', 'Fusion & the Tokamak · Caging a Star in a Magnetic Bottle');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(10, 7, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(6, 10, 8);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 物理状态 ================= */
const R_TOR = 4.2, A_TOR = 1.35;
let Ip = clamp(qsFloat('Ip', 15), 2, 15);
let Bt = clamp(qsFloat('B', 5.3), 1, 12);
let Pheat = clamp(qsFloat('Pheat', 50), 0, 100);
let Tk = 2e6;
let density = 1.0;
let cutaway = false;
let disruptT = -1;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let labelsOn = qsBool('labels', true);
let spinOn = qsBool('spin', true);

const qFactor = () => Math.max(0.4, 3 * (Bt / 5.3) * (15 / Ip));
const tauE = () => 1.5 * Math.pow(Ip / 15, 0.8) * (Pheat > 25 ? 1.8 : 1);
const react = () => Math.pow(Tk / 1e8, 3.4);
const Pfus = () => 300 * density * density * react() * (Tk > 3e7 ? 1 : Math.pow(Tk / 3e7, 3));
const tripleProduct = () => density * 1e20 * (Tk / 1000 / 11604) * tauE();
const LAWSON = 3e21;
let alphaHeat = 0;

/* ================= 场景 ================= */
const ground = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 0.4, 48), mat(0x39414d, { opacity: 1 }));
ground.position.y = -4.2;
scene.add(ground);

const vessel = new THREE.Mesh(new THREE.TorusGeometry(R_TOR, A_TOR + 0.25, 20, 80),
  mat(0x8a94a6, { opacity: 0.16, roughness: 0.25, metalness: 0.6, side: THREE.DoubleSide }));
scene.add(vessel);

const coils = new THREE.Group();
for (let i = 0; i < 12; i++) {

  ctx.fillStyle = cTxt;
  ctx.font = '15px sans-serif';
  ctx.fillText('10⁸ K', xOf(1e8) - 22, yOf(415));
  ctx.strokeStyle = 'rgba(255,169,77,.9)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const T = i / 60 * 2e8;
    const P = 300 * Math.pow(Math.max(T / 1e8, 0.02), 3.4);
    if (i === 0) ctx.moveTo(xOf(T), yOf(P));

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, statsAcc = 0;
const dummy = new THREE.Object3D(), tmpV = new THREE.Vector3();
function torusPos(phi, th, rho, out) {
  const c = Math.cos(phi) * R_TOR, s = Math.sin(phi) * R_TOR;
  out.set(c + Math.cos(phi) * rho * Math.cos(th), rho * Math.sin(th), s + Math.sin(phi) * rho * Math.cos(th));
  return out;
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const t = clock.elapsedTime;
  const dt = dt0 * (playing ? speed : 0);
  if (dt > 0) {
    /* 温度演化 */
    if (disruptT < 0) {
      const P = Pfus();
      alphaHeat = P * 0.2;
      const Ploss = Tk / 1e8 * 90 / tauE();
      const net = Pheat + (Pheat > 0 ? alphaHeat * clamp(Tk / 5e7, 0, 1) : 0) - Ploss;
      Tk = Math.max(2e6, Tk + net * dt * 3e6);
      if (qFactor() < 2 && Math.random() < dt * 0.25) triggerDisrupt();
    } else {
      disruptT += dt;
      Tk = Math.max(1e5, Tk - disruptT * 4e7);
      if (disruptT < 0.25) flashBall.material.opacity = 0.9 - disruptT * 3;
      else flashBall.material.opacity = Math.max(0, flashBall.material.opacity - dt);
      if (disruptT > 2.5) doRestart();
    }
    density = Pheat > 25 ? 1.15 : 1.0;
    /* 粒子沿磁力线走 */
    const q = qFactor();
    const instability = clamp((2.2 - q) / 2, 0, 1) + (disruptT >= 0 ? 1 : 0);
    const vphi = 0.5 + (Tk / 1e8) * 0.5;
    for (let i = 0; i < PN; i++) {
      const p = pState[i];
      p.phi += vphi * dt;
      p.th += vphi * dt / q;
      const wobA = 0.02 + instability * 0.3;
      let rho = p.rho + Math.sin(t * 3 + p.wob) * wobA * (p.rho / A_TOR);
      if (disruptT >= 0) rho += disruptT * 1.6 * (0.5 + p.wob % 1);
      rho = clamp(rho, 0.05, A_TOR + 0.5);
      torusPos(p.phi, p.th, rho, tmpV);
      if (cutaway && Math.sin(p.phi) > 0.25) { dummy.position.set(0, -99, 0); }
      else dummy.position.copy(tmpV);
      dummy.scale.setScalar(disruptT >= 0 ? 1.5 : 1);
      dummy.updateMatrix();
      plasma.setMatrixAt(i, dummy.matrix);
    }
    plasma.instanceMatrix.needsUpdate = true;
    const bucket = Math.floor(clamp(Tk / 1.5e8, 0, 1.4) * 8);
    if (bucket !== colBucket) {
      colBucket = bucket;
      cTmp.copy(plasmaColor());
      for (let i = 0; i < PN; i++) plasma.setColorAt(i, cTmp);
      if (plasma.instanceColor) plasma.instanceColor.needsUpdate = true;
    }
    /* α 粒子 */
    const aRate = Pfus() > 5 ? 1 : 0;
    for (let i = 0; i < AN; i++) {
      const a = aState[i];
      if (!a.on && Math.random() < dt * aRate * 0.6) a.on = true;
      if (a.on && disruptT < 0) {
        a.phi += 1.6 * dt;
        a.th += 1.6 * dt / q + 2.2 * dt;
        torusPos(a.phi, a.th, a.rho, tmpV);
      } else if (disruptT >= 0) {
        torusPos(a.phi, a.th, clamp(a.rho + disruptT * 2, 0, A_TOR + 1), tmpV);
      } else tmpV.set(0, -99, 0);
      dummy.position.copy(tmpV);
      dummy.updateMatrix();
      alphas.setMatrixAt(i, dummy.matrix);
    }
    alphas.instanceMatrix.needsUpdate = true;
    /* 中子 */
    const nRate = clamp(Pfus() / 300, 0, 1);
    for (let i = 0; i < NN; i++) {
      const n = nState[i];
      if (n.life < 0 && Math.random() < dt * nRate * 3) {
        const phi = Math.random() * 6.28, th = Math.random() * 6.28;
        torusPos(phi, th, Math.random() * A_TOR, n.p);
        n.d.copy(n.p).normalize();
        n.life = 1;
      }
      if (n.life >= 0) {
        n.life -= dt * 1.4;
        n.p.addScaledVector(n.d, dt * 9);
        dummy.position.copy(n.p);
        dummy.lookAt(tmpV.copy(n.p).add(n.d));
        dummy.updateMatrix();
        if (n.life < 0) { n.p.set(0, -99, 0); dummy.position.copy(n.p); }
      } else { dummy.position.set(0, -99, 0); dummy.updateMatrix(); }
      neutrons.setMatrixAt(i, dummy.matrix);
    }
    neutrons.instanceMatrix.needsUpdate = true;
    /* 中性束粒子 */
    const bOn = Pheat > 5 && disruptT < 0;
    beamMesh.visible = true;
    for (let i = 0; i < BN; i++) {
      const b = beamP[i];
      if (bOn) b.t += dt * 0.9;
      if (b.t > 1) b.t = 0;
      const lane = b.lane ? 1 : -1;
      tmpV.set(lerp(R_TOR - A_TOR - 1.6, R_TOR - A_TOR + 0.4, b.t), lane * 0.6 * (1 - b.t) + lane * 0.6 * b.t * 0.2, lane * 0.3 * Math.sin(b.t * Math.PI));
      dummy.position.copy(tmpV);
      dummy.lookAt(R_TOR, 0, 0);
      dummy.updateMatrix();
      beamMesh.setMatrixAt(i, dummy.matrix);
    }
    beamMesh.instanceMatrix.needsUpdate = true;
    labBeam.visible = Pheat > 5;
    labBlanket.visible = Pfus() > 5;
    labPlasma.visible = labCoil.visible = labSol.visible = labDiv.visible = true;
    refreshLabels();
    statsAcc += dt0;
    if (statsAcc > 0.15) {
      statsAcc = 0;
      const tp = tripleProduct();
      stT.innerHTML = (Tk / 1e8).toFixed(2) + '<small>×10⁸ K</small>';
      stN.innerHTML = density.toFixed(2) + '<small>×10²⁰ m⁻³</small>';
      stTau.innerHTML = tauE().toFixed(2) + '<small>s</small>';
      stTP.textContent = (tp / LAWSON * 100).toFixed(0) + '%';
      stTP.className = 'v ' + (tp >= LAWSON ? 'ok' : tp > LAWSON * 0.5 ? 'warn' : 'bad');
      const P = Pfus();
      const Q = Pheat > 1 ? P / Pheat : (P > 1 ? 999 : 0);
      stQ.innerHTML = (Q > 100 ? '∞' : Q.toFixed(1)) + ' · q=' + qFactor().toFixed(2);
      const [st, cls] = stateNow();
      stS.textContent = st;
      stS.className = 'v ' + cls;
      updateFormula();
      drawPlot();
    }
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

const ph0 = Math.round(qsFloat('phase', 0));
if (ph0 >= 1 && ph0 <= 6) STEPS[ph0 - 1].act();
else if (qsFloat('t', 0) > 0) Tk = clamp(qsFloat('t', 0) * 1.2e7, 2e6, 1.8e8);
setBtnCut();
applyTheme();
applyLang();
syncAll();
start();
function setBtnCut() { document.getElementById('btnCut').classList.toggle('on', cutaway); }
</script>
