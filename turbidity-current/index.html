<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>浊流 · 海底雪崩与断掉的电缆</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

  <div class="sub" data-zh="含沙浑水比清水重，g′=g·Δρ/ρ 驱动它贴底俯冲：蘑菇头前锋 8 m/s 级，沿途侵蚀挖掘海底峡谷；1929 年纽芬兰地震后跨洋电缆按距离-时间逐条断掉，人类据此第一次『测到』它 · 拖动旋转 / 空格运行/暂停" data-en="Sandy water is heavier than clear: g′=g·Δρ/ρ drives it downslope along the seabed, a mushroom head at up to ~8 m/s eroding submarine canyons; after the 1929 Grand Banks quake, transatlantic cables broke one by one with distance and time — our first 'measurement' of the flow · drag to orbit / Space = run/pause">含沙浑水比清水重，g′=g·Δρ/ρ 驱动它贴底俯冲：蘑菇头前锋 8 m/s 级，沿途侵蚀挖掘海底峡谷；1929 年纽芬兰地震后跨洋电缆按距离-时间逐条断掉，人类据此第一次『测到』它 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具与全局 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const QS=new URLSearchParams(location.search);
const htmlEl=document.documentElement,el=id=>document.getElementById(id);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
let playing=!QS.has('pause'),labelsOn=QS.get('labels')!=='0';
let timeComp=(clamp(parseFloat(QS.get('speed'))||1.2,0.3,2.4))*1000; // ?speed= → 快进倍率

/* ============ 尺度与物理模型（真实单位 m、s） ============
   水平 1 格 = 10 km，垂向夸大展示；前锋 ODE：
   dU/dt = 1.2·g′·sinθ − cD·U² ， g′=g·Δρ/ρ
   斜坡上 cD≈1e-4（卷吸供沙平衡），平底 cD≈1.2e-6
   （细颗粒自动悬浮使尾流以 ~8-12 m/s 长途奔袭——600 km 约 13-15 h，
   与 1929 年电缆距离-时间吻合；冲过坡脚、搬运能力骤降处落淤成扇） */
const G=9.81,X0=3,XS=44,XE=64;       // 场景格：闸门/坡脚/远端
const KMH=1e4;                        // 1 格 = 1e4 m
let slopeDeg=3,densPct=2.5;
function bedY(x){
  const drop=(slopeDeg/3)*5;
  if(x<=X0)return 2.6;
  if(x<=XS)return 2.6-(x-X0)/(XS-X0)*drop;
  return 2.6-drop;
}
function sinTheta(){return Math.sin(slopeDeg*Math.PI/180);}
function cDof(x){return x>XS?1.2e-6:1.0e-4;}

/* ============ 渲染基础 ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
el('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0a1622,50,140);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,300);
camera.position.set(30,13,36);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(30,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=120;
scene.add(new THREE.HemisphereLight(0xbfe0ff,0x0a0f14,0.8));
const key=new THREE.DirectionalLight(0xffffff,1.0);key.position.set(10,20,15);scene.add(key);

/* ============ 水槽与海床 ============ */
const tank=new THREE.Group();scene.add(tank);
const waterM=new THREE.MeshStandardMaterial({color:0x123a52,transparent:true,opacity:0.16,depthWrite:false});
const water=new THREE.Mesh(new THREE.BoxGeometry(XE-X0+6,7.6,9),waterM);
water.position.set((X0+XE)/2,0.9,0);tank.add(water);
let bedMesh=null;
const bedM=new THREE.MeshStandardMaterial({color:0x4a4034,roughness:1});
function buildBed(){
  if(bedMesh){tank.remove(bedMesh);bedMesh.geometry.dispose();}
  const pos=[],idx=[],NZ=4.4,NSEG=(XE-X0)|0;
  for(let i=0;i<=NSEG;i++){
    const x=X0+i,y=bedY(x);
    pos.push(x,y,-NZ, x,y,NZ);
  }
  for(let i=0;i<NSEG;i++){const a=i*2;idx.push(a,a+1,a+2, a+1,a+3,a+2);}
  const base=pos.length/3;
  for(let i=0;i<=NSEG;i++){
    const x=X0+i,y=bedY(x);
    pos.push(x,-5.2,-NZ, x,-5.2,NZ);
  }
  for(let i=0;i<NSEG;i++){const a=base+i*2;idx.push(a,a+2,a+1, a+1,a+2,a+3);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setIndex(idx);g.computeVertexNormals();
  bedMesh=new THREE.Mesh(g,bedM);tank.add(bedMesh);
}
buildBed();

/* ============ 粒子 ============ */
const NC=380,NB=170,NR=56,PN=NC+NB+NR;
const pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3);
const pKind=new Uint8Array(PN);      // 0 浊流 1 河床颗粒 2 上层回流
const role=new Uint8Array(PN);       // 0 体 1 头部卷
const pOff=new Float32Array(PN),pFr=new Float32Array(PN),pAng=new Float32Array(PN),pRr=new Float32Array(PN);
let pHead=0;
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pMat=new THREE.PointsMaterial({size:0.17,vertexColors:true,transparent:true,opacity:0.95,depthWrite:false});
const points=new THREE.Points(pGeo,pMat);points.frustumCulled=false;scene.add(points);
function setPColor(i){
  const dark=THEME==='dark';
  const c=pKind[i]===2?(dark?0x9fb8c8:0x5b7d8e):pKind[i]===1?(dark?0x8a6a40:0x6e5638):(dark?0xc98a4b:0x8a5a26);
  pCol[i*3]=((c>>16)&255)/255;pCol[i*3+1]=((c>>8)&255)/255;pCol[i*3+2]=(c&255)/255;
}
for(let i=0;i<PN;i++)setPColor(i);

/* ============ 沉积扇（平底上的淤高） ============ */
const NBIN=20,bins=new Float32Array(NBIN);
const depM=new THREE.MeshStandardMaterial({color:0x6b543a,roughness:1});
const depBoxes=[];
for(let i=0;i<NBIN;i++){
  const b=new THREE.Mesh(new THREE.BoxGeometry(1,0.1,6.5),depM);
  b.position.set(XS+0.5+i,-5.0,0);b.scale.y=0.01;
  scene.add(b);depBoxes.push(b);
}

/* ============ 浊流体与蘑菇头 ============ */
const mudM=new THREE.MeshStandardMaterial({color:0x7a5230,transparent:true,opacity:0.42,depthWrite:false});
const dome=new THREE.Mesh(new THREE.SphereGeometry(1,16,12,0,Math.PI*2,0,Math.PI*0.6),mudM);
dome.rotation.z=-Math.PI/2;dome.visible=false;scene.add(dome);
const bod=new THREE.Mesh(new THREE.CapsuleGeometry(0.85,1,6,14),mudM);
bod.rotation.z=Math.PI/2;bod.visible=false;scene.add(bod);

/* ============ 闸门与浑水水库 ============ */
const gateM=new THREE.MeshStandardMaterial({color:0x8a939e,roughness:0.4,metalness:0.6});
const gate=new THREE.Mesh(new THREE.BoxGeometry(0.22,7,9),gateM);
gate.position.set(X0,1,0);scene.add(gate);
const basin=new THREE.Mesh(new THREE.BoxGeometry(X0-0.4,6.4,8.6),mudM);
basin.position.set((X0-0.4)/2,0.2,0);scene.add(basin);

/* ============ 跨洋电缆（1929 事件） ============ */
const CABLES=[59,118,240,380,500,600];   // km，距震中
const cableObjs=[];
const cabM=new THREE.MeshStandardMaterial({color:0xc2ccd6,roughness:0.5,metalness:0.7});
function buildCables(){
  for(const c of cableObjs){scene.remove(c.mesh);c.lbl.o.visible=false;}
  cableObjs.length=0;
  for(const km of CABLES){
    const x=X0+km*1000/KMH;
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,8.6,6),cabM);
    m.rotation.x=Math.PI/2;m.position.set(x,bedY(x)+0.12,0);
    scene.add(m);
    const div=document.createElement('div');div.className='lbl b';
    div.textContent=km+' km';
    const o=new CSS2DObject(div);o.position.set(x,bedY(x)+1.1,0);scene.add(o);
    cableObjs.push({km,x,mesh:m,lbl:{o,div},cut:0});
  }
}

/* ============ 状态 ============ */
let released=false,X=0,U=0,tReal=0,gateY=0,autoFired=false,simT=0;
let flashT=0;
function relight(hard){
  released=false;X=0;U=0;tReal=0;gateY=0;
  gate.position.y=1;basin.visible=true;dome.visible=false;bod.visible=false;
  if(hard){bins.fill(0);depBoxes.forEach(b=>b.scale.y=0.01);}
  buildCables();
  // 布置粒子：浊流体→水库；河床颗粒→坡面；回流→表层
  let i=0;
  for(;i<NC;i++){
    pKind[i]=0;role[i]=Math.random()<0.35?1:0;
    pOff[i]=Math.random();pFr[i]=Math.random();pAng[i]=Math.random()*Math.PI*2;
    pRr[i]=0.5+Math.random()*1.4;
    pPos[i*3]=0.5+Math.random()*(X0-1);
    pPos[i*3+1]=bedY(1)+0.4+Math.random()*(3.4-bedY(1));
    pPos[i*3+2]=(Math.random()-0.5)*7.6;
  }
  for(;i<NC+NB;i++){
    pKind[i]=1;pPos[i*3]=X0+1+Math.random()*(XS-X0-2);
    pPos[i*3+1]=bedY(pPos[i*3])+0.1;
    pPos[i*3+2]=(Math.random()-0.5)*7.6;
  }
  for(;i<PN;i++){
    pKind[i]=2;pPos[i*3]=X0+Math.random()*(XE-X0);
    pPos[i*3+1]=3.2+Math.random()*0.8;
    pPos[i*3+2]=(Math.random()-0.5)*7.6;
  }
  for(let k=0;k<PN;k++)setPColor(k);
  pGeo.attributes.color.needsUpdate=true;
  pGeo.attributes.position.needsUpdate=true;
}
function fmtT(t){
  const h=Math.floor(t/3600),m=Math.floor(t%3600/60);
  return h+':'+String(m).padStart(2,'0');
}

/* ============ 标签 ============ */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn,parent){
  const div=document.createElement('div');div.className='lbl '+cls;
  div.textContent=textFn();
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||scene).add(o);
  labelReg.push({o,text:textFn,vis:visFn||(()=>true)});
  return o;
}
addLabel(()=>L('闸门：锁换实验开闸','Gate: the lock-exchange moment'),new THREE.Vector3(X0,4.6,0),'b',()=>!released);
addLabel(()=>L('清水上层回流补位','Clear water returns along the top'),new THREE.Vector3(30,4.4,0),'b',()=>released);
addLabel(()=>L('蘑菇头：卷吸清水、侵蚀河床','Mushroom head: entrains & erodes'),new THREE.Vector3(24,-2.2,0),'o',
  ()=>released&&X>0);
addLabel(()=>L('坡底落淤→深海扇','Toe deposition → deep-sea fan'),new THREE.Vector3(54,-4.6,0),'g',
  ()=>released&&X>XS*KMH);
const headLbl=()=>L(`前锋 ${ (X/1000).toFixed(0) } km · ${ fmtT(tReal) }`,`Head ${ (X/1000).toFixed(0) } km · ${ fmtT(tReal) }`);
const headPill=addLabel(headLbl,new THREE.Vector3(0,-1,0),'o',()=>released);
// 让 headPill 每帧跟随前锋（复用 labelReg 位置更新）
const headUpd=()=>{if(released)headPill.position.set(X0+X/KMH,bedY(X0+X/KMH)-1.6,0);};

/* ============ 步骤 ============ */
const STEPS=[
 {zh:'密度差是引擎：含沙浑水重于清水，g′=g·Δρ/ρ 驱动俯冲',en:'Density contrast is the engine: g′=g·Δρ/ρ drives the surge'},
 {zh:'开闸（锁换实验）：浑水贴底俯冲，清水上层回流补位',en:'Lock-exchange: the dense underflow dives, clear water returns on top'},
 {zh:'蘑菇头：前锋卷起蘑菇状头部，卷吸清水、越滚越大',en:'The mushroom head curls, entrains clear water and grows'},
 {zh:'侵蚀与挖掘：8 m/s 级前锋把河床颗粒一路卷走，刻出海底峡谷',en:'~8 m/s head plucks bed sediment — carving submarine canyons'},
 {zh:'割电缆：1929 纽芬兰地震后，电缆按距离-时间逐条断掉→反推流速',en:'1929: cables broke with distance-time order — the flow speed, deduced'},
 {zh:'末沉积：坡底减速，泥沙落淤，年复一年堆成深海扇',en:'At the toe it slows, drops its load — building the deep-sea fan'},
];
let activeStep=0;
function buildSteps(){
  const o=el('steps');o.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();gotoStep(i);});
    o.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  playing=true;el('play').textContent=L('暂停','Pause');
  if(i===0){relight(true);}
  if(i>=1&&i<=3){relight(true);release();}
  if(i===4){relight(true);release();el('sTC').value=24;el('sTCVal').textContent='2400×';timeComp=2400;}
  if(i===5){relight(true);release();}
}

/* ============ 交互 ============ */
function release(){if(released)return;released=true;flashT=1.2;}
el('btnGo').addEventListener('click',release);
el('btnReplay').addEventListener('click',()=>{relight(true);release();
  el('sTC').value=24;el('sTCVal').textContent='2400×';timeComp=2400;});
el('btnReset').addEventListener('click',()=>relight(true));
el('sDens').addEventListener('input',e=>{densPct=+e.target.value/10;el('sDensVal').textContent=densPct.toFixed(1)+' %';});
el('sSlope').addEventListener('input',e=>{slopeDeg=+e.target.value/10;el('sSlopeVal').textContent=slopeDeg.toFixed(1)+'°';buildBed();
  for(const c of cableObjs){c.mesh.position.y=bedY(c.x)+0.12;c.lbl.o.position.y=bedY(c.x)+1.1;}
  // 河床颗粒重新贴住新坡面
  for(let i=NC;i<NC+NB;i++)if(pKind[i]===1)pPos[i*3+1]=bedY(pPos[i*3])+0.1;
  pGeo.attributes.position.needsUpdate=true;});
el('sTC').addEventListener('input',e=>{timeComp=+e.target.value*100;el('sTCVal').textContent=timeComp+'×';});
el('play').addEventListener('click',()=>{playing=!playing;el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
el('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
el('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
el('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
el('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();el('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ============ 主题 / 语言 ============ */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  el('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0a1622:0xd8e6ee);
  scene.fog.color.setHex(dark?0x0a1622:0xd8e6ee);
  waterM.color.setHex(dark?0x123a52:0x8fc3dd);
  bedM.color.setHex(dark?0x4a4034:0x8d7f68);
  mudM.color.setHex(dark?0x7a5230:0xa5793f);
  for(let i=0;i<PN;i++)setPColor(i);
  pGeo.attributes.color.needsUpdate=true;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(e=>{
    if(e.tagName==='INPUT')return;
    e.textContent=LANG==='en'?(e.dataset.en||e.dataset.zh):e.dataset.zh;
  });
  el('langBtn').textContent=LANG==='en'?'ZH':'EN';
  el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps();
  // 电缆标签重设文本
  for(const c of cableObjs){
    c.lbl.div.textContent=c.cut?`${c.km} km · ${fmtT(c.cut)}`:c.km+' km';
  }
}

/* ============ 统计 ============ */
function updateStats(){
  el('sv0').innerHTML=U.toFixed(1)+'<small> m/s</small>';
  el('sv1').innerHTML=(X/1000).toFixed(0)+'<small> km</small>';
  el('sv2').textContent=released?fmtT(tReal):'0:00';
  el('sv3').textContent=cableObjs.filter(c=>c.cut>0).length+' / 6';
}

/* ============ 物理 ============ */
const XMH=KMH; // 每格米数
function stepSim(dt){
  simT+=dt;
  // 自动开闸：招牌画面 10 秒内必现
  if(!autoFired&&!released&&simT>0.9){autoFired=true;release();}
  if(!released)return;
  /* —— 闸门动画 —— */
  if(gateY<1){gateY=Math.min(1,gateY+dt*1.6);gate.position.y=1+gateY*6.2;basin.visible=gateY<0.5;}
  /* —— 前锋 ODE（真实单位，子步积分） —— */
  const gp=G*densPct/100;
  const nSub=4,dts=dt*timeComp/nSub;
  for(let s=0;s<nSub;s++){
    const xs=X0+X/KMH;
    const th=sinTheta()*(xs>XS?0:1);
    U+=dts*(1.2*gp*th-cDof(xs)*U*U);
    U=Math.max(U,0);X+=dts*U;
  }
  tReal+=dt*timeComp;
  const xsHead=X0+X/KMH;
  /* —— 电缆切断 —— */
  for(const c of cableObjs){
    if(!c.cut&&X>=c.km*1000){
      c.cut=tReal;
      c.lbl.div.textContent=`${c.km} km · ${fmtT(c.cut)}`;
      c.lbl.div.className='lbl r';
      c.m.rotation.z=0.5;c.m.position.y=bedY(c.x)-0.15;  // 简单表现：断落
      flashT=1.0;
    }
  }
  /* —— 浊流体/头部网格 —— */
  const vis=X>60;                    // 冲出闸门后再显示
  dome.visible=vis;bod.visible=vis;
  if(vis){
    const Lb=clamp((xsHead-X0)/5,1.2,16);
    dome.position.set(xsHead-0.5,bedY(xsHead)+0.35,0);
    dome.scale.set(1.6,1.15,1.3);
    dome.rotation.y=Math.sin(simT*3)*0.06;
    const mid=(xsHead+X0)/2;
    bod.position.set(clamp(mid,X0+Lb,xsHead-Lb*0.4),bedY(Math.min(mid,xsHead-1))-0.15,0);
    bod.scale.set(Lb,0.75,1.15);
  }
  /* —— 浊流粒子 —— */
  for(let i=0;i<NC;i++){
    const i3=i*3;
    if(role[i]===1){           // 头部蘑菇卷
      pAng[i]+=dt*(1.5+U*0.25);
      const R=pRr[i];
      pPos[i3]=xsHead-1.0+Math.cos(pAng[i])*R*1.5;
      pPos[i3+1]=bedY(xsHead)+0.3+Math.sin(pAng[i])*R*0.8;
    }else{                     // 体：贴底拖曳层
      const bx=xsHead-1.6-pOff[i]*Lb2(xsHead);
      pPos[i3]=bx;
      pPos[i3+1]=bedY(bx)-0.2-pFr[i]*0.8+Math.sin(simT*4+i)*0.06;
    }
    pPos[i3+2]+=Math.sin(simT*2.3+i*1.7)*0.01;
    // 冲过坡脚：流动展宽、搬运能力骤降 → 卸载落淤成扇（近端扇最厚）
    if(xsHead>XS+0.5&&pPos[i3+1]<bedY(pPos[i3])+0.1){
      const bin=clamp(Math.floor(pPos[i3]-XS),0,NBIN-1);
      bins[bin]=Math.min(bins[bin]+0.02,3.2);
      depBoxes[bin].scale.y=Math.max(bins[bin],0.02);
      depBoxes[bin].position.y=-5.2+bins[bin]/2;
      role[i]=0;pOff[i]=Math.random();pFr[i]=Math.random(); // 回收补供给
    }
  }
  /* —— 河床颗粒：前锋掠过被侵蚀卷入 —— */
  for(let i=NC;i<NC+NB;i++){
    const i3=i*3;
    if(pKind[i]===1){
      if(X>0&&(pPos[i3]-xsHead)*KMH<-300&&U>2){   // 前锋已过 → 卷起
        pKind[i]=0;role[i]=Math.random()<0.5?1:0;
        pOff[i]=Math.random();pFr[i]=Math.random();pRr[i]=0.5+Math.random()*1.3;
        pAng[i]=Math.random()*Math.PI*2;setPColor(i);
      }
    }else if(role[i]===1){
      pAng[i]+=dt*(1.5+U*0.25);
      const R=pRr[i];
      pPos[i3]=xsHead-1.0+Math.cos(pAng[i])*R*1.5;
      pPos[i3+1]=bedY(xsHead)+0.3+Math.sin(pAng[i])*R*0.8;
    }else{
      const bx=xsHead-1.6-pOff[i]*Lb2(xsHead);
      pPos[i3]=bx;
      pPos[i3+1]=bedY(bx)-0.2-pFr[i]*0.8;
    }
  }
  /* —— 上层回流 —— */
  for(let i=NC+NB;i<PN;i++){
    const i3=i*3;
    if(released&&gateY>0.5){pPos[i3]-=dt*1.4;if(pPos[i3]<X0)pPos[i3]=XE;}
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
  flashT=Math.max(0,flashT-dt);
}
function Lb2(xs){return clamp((xs-X0)/5,1.2,16);}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  if(playing)stepSim(dt0);
  headUpd();
  // 割缆闪烁
  pMat.opacity=flashT>0?1:0.95;
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  for(const c of cableObjs)c.lbl.o.visible=labelsOn;
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSteps();
el('tglLabels').checked=labelsOn;
el('sTC').value=Math.round(timeComp/100);el('sTCVal').textContent=timeComp+'×';
relight(true);updateStats();start();
</script>
</body>
</html>
