<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PID 控制 · 三个增益驯服一台机器</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }
  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="PID 控制:三个增益驯服一台机器" data-en="PID Control: Three Gains Tame the Machine">PID 控制:三个增益驯服一台机器</h1>
  <div class="sub" data-zh="误差 e=目标−实际驱动一切:P 项即时顶上去,但负载之下永远差一点;I 项把残余误差攒成劲,把稳态误差攒到零,可攒过头就是振荡;D 项盯着变化率提前刹车,压住超调;三个增益的配比决定响应是懒散、振荡还是干脆利落——全球 95% 的工业回路都是它 · 3D 交互演示 · 拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Error e = target − actual drives everything: P pushes instantly but under load always falls a little short; I saves up the leftover until the offset is gone — or oscillates if overdone; D watches the rate of change and brakes early, killing overshoot; the ratio of three gains decides whether the response is lazy, oscillatory, or crisp — 95% of industrial loops run on it · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">PID 控制:三个增益驯服一台机器</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="误差 e" data-en="Error e">误差 e</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="推力指令 u" data-en="Command u">推力指令 u</span><span class="v warn" id="stU">—</span>
  <span class="k" data-zh="超调" data-en="Overshoot">超调</span><span class="v" id="stO">—</span>
  <span class="k" data-zh="调节时间" data-en="Settling time">调节时间</span><span class="v" id="stTs">—</span>
  <span class="k" data-zh="稳态误差" data-en="Steady error">稳态误差</span><span class="v bad" id="stEss">—</span>
</div>

<div id="plot">
  <h3 data-zh="阶跃响应:目标 / 高度 / 推力" data-en="Step response: target, altitude, thrust">阶跃响应:目标 / 高度 / 推力</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="青环=目标高度" data-en="cyan ring = target altitude">青环=目标高度</span>
    <span class="chip.g" data-zh="白机=无人机(看推力箭头)" data-en="drone (watch thrust arrows)">白机=无人机(看推力箭头)</span>
    <span class="chip.r" data-zh="红=阵风扰动" data-en="red = gust disturbance">红=阵风扰动</span>
    <span class="chip.o" data-zh="橙=载荷(掉落即工厂变了)" data-en="orange = payload (plant change)">橙=载荷(掉落即工厂变了)</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnStep" data-zh="目标阶跃" data-en="step target">目标阶跃</button>
    <button class="abtn brk" id="btnGust" data-zh="阵风扰动" data-en="gust impulse">阵风扰动</button>
    <button class="abtn" id="btnPayload" data-zh="挂载载荷" data-en="attach payload">挂载载荷</button>
    <button class="abtn" id="btnTune" data-zh="预设:临界整定" data-en="preset: tuned">预设:临界整定</button>
  </div>
  <div class="row"><label data-zh="Kp 比例" data-en="Kp proportional">Kp 比例</label><input id="kp" type="range" min="0" max="20" step="0.5" value="4"><span class="val" id="kpVal">4.0</span></div>
  <div class="row"><label data-zh="Ki 积分" data-en="Ki integral">Ki 积分</label><input id="ki" type="range" min="0" max="10" step="0.1" value="0"><span class="val" id="kiVal">0.0</span></div>
  <div class="row"><label data-zh="Kd 微分" data-en="Kd derivative">Kd 微分</label><input id="kd" type="range" min="0" max="8" step="0.1" value="0"><span class="val" id="kdVal">0.0</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglAW" type="checkbox" checked> <span data-zh="抗饱和" data-en="anti-windup">抗饱和</span></label>
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../centrifugal-governor/" data-zh="第一个反馈控制器:飞锤调速器" data-en="the first feedback controller: flying balls">第一个反馈控制器:飞锤调速器</a>
    <a href="../thermostat/" data-zh="开关式控制的祖师爷" data-en="the on-off ancestor of control">开关式控制的祖师爷</a>
    <a href="../insulin-glucagon/" data-zh="生物版 PI:血糖双人舞" data-en="the biological PI duo: blood sugar">生物版 PI:血糖双人舞</a>
    <a href="../active-noise-cancelling/" data-zh="反馈环路的声学版" data-en="the acoustic cousin of the loop">反馈环路的声学版</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x18243a, 22, 55);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
  scene.fog.color = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('PID 控制 · 三个增益驯服一台机器', 'PID Control · Three Gains Tame the Machine');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(9, 6, 12);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 40;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(6, 12, 8);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.2,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 控制系统状态 ================= */
let Kp = clamp(qsFloat('kp', 4), 0, 20), Ki = clamp(qsFloat('ki', 0), 0, 10), Kd = clamp(qsFloat('kd', 0), 0, 8);
let target = 3, y = 1, vy = 0;
let integ = 0, dFilt = 0, prevY = 1;
let uCmd = 1;
let payload = false;
const G = 9.81, M0 = 1.2, M1 = 1.7, C_DRAG = 0.55;
let gustT = -1, antiWind = true;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let labelsOn = qsBool('labels', true);
let spinOn = qsBool('spin', true);
let osc = 0;

/* ================= 场景 ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(26, 0.4, 18), mat(0x39414d, { opacity: 1 }));
floor.position.y = -0.2;
scene.add(floor);
const grid = new THREE.GridHelper(26, 26, 0x51617a, 0x333f52);
grid.position.y = 0.01;
grid.material.transparent = true;
grid.material.opacity = 0.4;
scene.add(grid);
for (let i = 0; i < 6; i++) {
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 11, 14), mat(0x4a5568, { opacity: 0.9 }));
  col.position.set(-11 + (i % 3) * 11, 5.5, i < 3 ? -7.5 : 7.5);
  scene.add(col);
}

const drone = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.2, 0.62), mat(0xe9edf3, { opacity: 1, roughness: 0.3, metalness: 0.4 }));
  drone.add(body);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), mat(0x74c0fc, { opacity: 0.85 }));
  dome.position.y = 0.14;
  drone.add(dome);
}
const rotors = [];
for (const [dx, dz] of [[-0.42, -0.42], [0.42, -0.42], [-0.42, 0.42], [0.42, 0.42]]) {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.08), mat(0x5f7186, { opacity: 1 }));
  arm.position.set(dx * 0.65, 0, dz * 0.65);
  arm.rotation.y = Math.atan2(dz, dx);
  drone.add(arm);
  const rotor = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.02, 20),
    mat(0x9aa8bc, { opacity: 0.5, roughness: 0.2 }));
  rotor.position.set(dx, 0.1, dz);
  drone.add(rotor);
  rotors.push(rotor);
}
scene.add(drone);

const thrustArrows = [];
for (const [dx, dz] of [[-0.42, -0.42], [0.42, -0.42], [-0.42, 0.42], [0.42, 0.42]]) {
  const a = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.55, 10),
    new THREE.MeshBasicMaterial({ color: 0xffd43b, transparent: true, opacity: 0.85 }));
  a.position.set(dx, 0, dz);
  a.rotation.x = Math.PI;
  drone.add(a);
  thrustArrows.push(a);
}

const targetRing = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.035, 8, 48),
  new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.8 }));
targetRing.rotation.x = Math.PI / 2;
scene.add(targetRing);
const targetRing2 = targetRing.clone();
targetRing2.scale.setScalar(0.92);
targetRing2.material = targetRing.material.clone();
targetRing2.material.opacity = 0.3;
scene.add(targetRing2);

const payloadBox = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.34, 0.42), mat(0xffa94d, { opacity: 1 }));
const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.55, 6), mat(0xcfe4f7, { opacity: 0.9 }));
payloadBox.visible = rope.visible = false;
scene.add(payloadBox, rope);

const GN = 26;
const gustMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.9, 0.03, 0.03),
  new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0 }), GN);
gustMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(gustMesh);
const gP = [];
for (let i = 0; i < GN; i++) gP.push({ x: -8 - Math.random() * 4, y: 0.5 + Math.random() * 6, z: (Math.random() - 0.5) * 3, v: 7 + Math.random() * 4 });

/* 标签 */
const labelReg = [];
function addLabel(anchor, cls, text) {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls;
  const o = new CSS2DObject(el);
  anchor.add(o);
  labelReg.push({ o, text: () => LANG === 'en' ? text[1] : text[0] });
  o.element.textContent = LANG === 'en' ? text[1] : text[0];
}
const labTarget = new THREE.Object3D(); scene.add(labTarget);
addLabel(labTarget, 'b', ['目标高度 r(t)', 'target r(t)']);
const labDrone = new THREE.Object3D(); labDrone.position.set(0, 0.5, 0); drone.add(labDrone);
addLabel(labDrone, 'g', ['实际高度 y(t)', 'actual y(t)']);
const labErr = new THREE.Object3D(); labErr.position.set(1.6, 0, 0); drone.add(labErr);
addLabel(labErr, 'r', ['误差 e = r − y', 'error e = r − y']);
function refreshLabels() {
  for (const r of labelReg) r.o.visible = labelsOn;
}

/* ================= 历史 ================= */
const HN = 360;
const hist = { t: new Float32Array(HN), r: new Float32Array(HN), y: new Float32Array(HN), u: new Float32Array(HN), n: 0, head: 0 };
let simTime = 0;
function pushHist() {
  const k = hist.head;
  hist.t[k] = simTime; hist.r[k] = target; hist.y[k] = y; hist.u[k] = uCmd;
  hist.head = (hist.head + 1) % HN;
  hist.n = Math.min(HN, hist.n + 1);
}

/* ================= 指标 ================= */
let stepBase = 1, peak = 0, setT0 = 0, settled = null;
function resetMetrics() {
  stepBase = y;
  peak = 0;
  setT0 = simTime;
  settled = null;
}
function metrics() {
  const span = Math.abs(target - stepBase) || 1;
  const ov = Math.max(0, (peak - Math.max(stepBase, target)) / span * 100);
  const tail = Math.min(hist.n, 60);
  let ess = 0, c = 0;
  for (let i = 0; i < tail; i++) {
    const k = (hist.head - 1 - i + HN * 2) % HN;
    ess += target - hist.y[k];
    c++;
  }
  ess = c ? ess / c : 0;
  return [ov, settled !== null ? settled - setT0 : NaN, ess];
}

/* ================= 步骤 ================= */
function applyGains(p, i, d) {
  Kp = p; Ki = i; Kd = d;
  integ = 0;
  syncSliders();
}
const STEPS = [
  { b: '一切从误差开始', be: 'It all starts with the error',
    d: '传感器测高度 y,与目标 r 一比得出误差 e=r−y;控制器按 e 算出推力指令 u,电机执行,再测——环路每秒闭合几十次。点击「目标阶跃」,看误差如何驱动一切。',
    de: 'A sensor measures altitude y; comparing it with the target r yields the error e = r − y; the controller turns e into a thrust command u, the motors act, and the loop closes again — thousands of times a second. Hit "step target" and watch error drive everything.',
    act: () => { payload = false; payloadBox.visible = rope.visible = false; applyGains(4, 0, 0); target = 6; resetMetrics(); } },
  { b: 'P:即时顶,但永差一点', be: 'P acts now but always falls short',
    d: 'u=Kp·e:误差越大推力越大,响应立刻。但纯 P 的隐忧:要维持推力就得维持误差——挂上载荷(工厂变了),无人机会永远悬停在目标下方一点。加大 Kp,爬得快,却开始冲过头。',
    de: 'u = Kp·e: bigger error, bigger push, instantly. But pure P has a flaw: holding thrust requires holding error — attach a payload (the plant changed) and the drone hangs forever a little below target. Raise Kp and it climbs faster, then overshoots.',
    act: () => { payload = true; payloadBox.visible = rope.visible = true; applyGains(6, 0, 0); target = 6; resetMetrics(); } },
  { b: 'I:把残差攒成劲', be: 'I saves up the leftover',
    d: '积分项 Ki·∫e:只要误差还在,哪怕只剩 0.1 m,它也一点点把推力攒上去,直到稳态误差归零。Ki 太大则攒过头——超调拖着长尾振荡;积分饱和还会让刹车失效。',
    de: 'The integral Ki·∫e keeps banking thrust while any error remains — even 0.1 m — until the offset is exactly zero. Too much Ki over-banks: overshoot with a long ringing tail, and integrator windup delays the brake.',
    act: () => { applyGains(6, 2.5, 0); target = 6; resetMetrics(); } },
  { b: 'D:预判刹车', be: 'D brakes on the prediction',
    d: '微分项 Kd·ė 盯着接近速度:冲得越猛,反向推力越早介入——超调被按住。代价:D 放大传感器噪声,实际产品里都要先滤波。试试骤降目标,看 D 如何先于人反应。',
    de: 'The derivative Kd·ė watches the approach speed: the harder you charge, the earlier the counter-push — overshoot gets pinned down. The price: D amplifies sensor noise, so real products filter it first. Drop the target and watch D react before you do.',
    act: () => { applyGains(8, 2, 3.5); target = 3; resetMetrics(); } },
  { b: '整定:三者的配比', be: 'Tuning: the ratio of three',
    d: 'Ziegler–Nichols 的思路:推 Kp 直到等幅振荡(临界),再退回一半,配 Ki=Kp/T、Kd=Kp·T/4。三个增益配比决定:懒散爬坡 / 振荡发散 / 干脆利落的一条直线。拖滑块亲手扫一遍。',
    de: 'Ziegler–Nichols spirit: push Kp until it oscillates steadily (critical), back off to half, set Ki and Kd from the period. The ratio of three gains decides: lazy crawl, ringing oscillation, or one crisp line. Sweep the sliders yourself.',
    act: () => { applyGains(14, 1, 0); target = 6; resetMetrics(); } },
  { b: '无处不在的 PID', be: 'PID is everywhere',
    d: '定速巡航、3D 打印热床、胰岛素泵(生物版 PI)、相机云台、火箭姿控——工业回路 95% 是 PID。点「阵风扰动」:整定好的环路把突风压成一个小坑,几秒内抹平。',
    de: 'Cruise control, 3D-printer heaters, insulin pumps (a biological PI), camera gimbals, rocket attitude control — 95% of industrial loops are PID. Hit "gust": a well-tuned loop turns the shove into a small dip and erases it in seconds.',
    act: () => { applyGains(8, 2, 3.5); fireGust(); } },
];
function stepIndex() {
  if (gustT >= 0) return 5;
  if (Kd > 0) return 3;
  if (Ki > 0) return 2;
  if (payload) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  if (hist.n < 2) return;
  const pad = 14, padB = 20;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const t1 = simTime, t0 = Math.max(0, simTime - 12);
  const xOf = tt => pad + (tt - t0) / Math.max(0.1, t1 - t0) * (W - pad * 2);
  const yOf = h => 10 + (1 - clamp(h, 0, 9) / 9) * (H - padB - 10);
  const yOfU = uu => 10 + (1 - clamp(uu, -0.5, 2) / 2.5) * (H - padB - 10);
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  for (let i = 0; i < hist.n; i++) {
    const k = (hist.head - hist.n + i + HN) % HN;
    const x = xOf(hist.t[k]);
    i === 0 ? ctx.moveTo(x, yOf(hist.r[k])) : ctx.lineTo(x, yOf(hist.r[k]));
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,169,77,.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < hist.n; i++) {
    const k = (hist.head - hist.n + i + HN) % HN;
    const x = xOf(hist.t[k]);
    i === 0 ? ctx.moveTo(x, yOfU(hist.u[k])) : ctx.lineTo(x, yOfU(hist.u[k]));
  }
  ctx.stroke();
  ctx.strokeStyle = '#7bd88f';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < hist.n; i++) {
    const k = (hist.head - hist.n + i + HN) % HN;
    const x = xOf(hist.t[k]);
    i === 0 ? ctx.moveTo(x, yOf(hist.y[k])) : ctx.lineTo(x, yOf(hist.y[k]));
  }
  ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.font = '15px sans-serif';
  ctx.fillText(L('高度 m ↑', 'altitude m ↑'), pad, 24);
  ctx.fillText(L('推力 % · 右轴', 'thrust % (right)'), pad, 46);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elKp = document.getElementById('kp'), elKpVal = document.getElementById('kpVal');
const elKi = document.getElementById('ki'), elKiVal = document.getElementById('kiVal');
const elKd = document.getElementById('kd'), elKdVal = document.getElementById('kdVal');
const stE = document.getElementById('stE'), stU = document.getElementById('stU'), stO = document.getElementById('stO'),
  stTs = document.getElementById('stTs'), stEss = document.getElementById('stEss');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncSliders() {
  elKp.value = Kp; elKpVal.textContent = Kp.toFixed(1);
  elKi.value = Ki; elKiVal.textContent = Ki.toFixed(1);
  elKd.value = Kd; elKdVal.textContent = Kd.toFixed(1);
}
function fireGust() { gustT = 0; }
function updateFormula() {
  formulaEl.innerHTML = L(
    `u = Kp·e + Ki·∫e + Kd·ė = ${Kp.toFixed(1)}·e + ${Ki.toFixed(1)}·∫e + ${Kd.toFixed(1)}·ė = <b>${(uCmd * 100).toFixed(0)}%</b><br>` +
    `m·ÿ = u·g − g − c·ẏ + 扰动 · e = <b>${(target - y).toFixed(2)} m</b> · m = ${payload ? M1 : M0} kg`,
    `u = Kp·e + Ki·∫e + Kd·ė = ${Kp.toFixed(1)}·e + ${Ki.toFixed(1)}·∫e + ${Kd.toFixed(1)}·ė = <b>${(uCmd * 100).toFixed(0)}%</b><br>` +
    `m·ÿ = u·g − g − c·ẏ + disturbance · e = <b>${(target - y).toFixed(2)} m</b> · m = ${payload ? M1 : M0} kg`);
}
document.getElementById('btnStep').addEventListener('click', () => {
  target = target > 4.5 ? 3 : 6;
  resetMetrics();
  syncAll();
});
document.getElementById('btnGust').addEventListener('click', () => fireGust());
document.getElementById('btnPayload').addEventListener('click', e => {
  payload = !payload;
  payloadBox.visible = rope.visible = payload;
  e.currentTarget.classList.toggle('on', payload);
  resetMetrics();
  syncAll();
});
document.getElementById('btnTune').addEventListener('click', () => {
  applyGains(8, 2, 3.5);
  target = 6;
  resetMetrics();
  syncAll();
});
elKp.addEventListener('input', () => { Kp = +elKp.value; syncAll(); });
elKi.addEventListener('input', () => { Ki = +elKi.value; syncAll(); });
elKd.addEventListener('input', () => { Kd = +elKd.value; syncAll(); });
document.getElementById('tglAW').addEventListener('change', e => { antiWind = e.target.checked; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
controls.autoRotate = spinOn;
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});
function syncAll() { syncSliders(); updateFormula(); drawPlot(); }

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, statsAcc = 0, histAcc = 0;
const dummy = new THREE.Object3D();
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const t = clock.elapsedTime;
  const dt = dt0 * (playing ? speed : 0);
  if (dt > 0) {
    simTime += dt;
    /* PID */
    const e = target - y;
    integ += e * dt;
    if (antiWind) integ = clamp(integ, -2 / Math.max(Ki, 0.01), 2 / Math.max(Ki, 0.01));
    const dRaw = -(y - prevY) / Math.max(dt, 1e-4);
    dFilt += (dRaw - dFilt) * clamp(dt * 8, 0, 1);
    prevY = y;
    uCmd = clamp(Kp * e + Ki * integ + Kd * dFilt, -0.3, 2.2);
    /* 扰动 */
    let acc = (uCmd * G - G) - (C_DRAG * vy) / (payload ? M1 : M0);
    if (gustT >= 0) {
      gustT += dt;
      acc += 5.5 * Math.exp(-gustT * 1.6);
      if (gustT > 3) gustT = -1;
    }
    vy += acc * dt;
    y = clamp(y + vy * dt, 0.12, 10.5);
    if (y <= 0.12 || y >= 10.5) vy = 0;
    peak = Math.max(peak, y);
    if (settled === null && Math.abs(target - y) < 0.02 * Math.max(1, Math.abs(target - stepBase)) && simTime - setT0 > 0.4) settled = simTime;
    pushHist();
    histAcc += dt;
    if (histAcc > 1 / 30) { histAcc = 0; }
    /* 场景 */
    drone.position.y = y;
    const spin = 6 + uCmd * 22;
    for (const r of rotors) r.rotation.y += dt * spin;
    const thr = clamp(uCmd, 0, 2);
    for (const a of thrustArrows) { a.scale.set(1, clamp(thr, 0.1, 1.6), 1); a.material.opacity = 0.25 + 0.5 * clamp(thr / 1.5, 0, 1); }
    targetRing.position.y = targetRing2.position.y = target;
    targetRing.rotation.z += dt * 0.4;
    targetRing2.rotation.z -= dt * 0.3;
    payloadBox.position.set(0, y - 0.75, 0);
    rope.position.set(0, y - 0.45, 0);
    labTarget.position.set(2.2, target, 0);
    labErr.visible = Math.abs(target - y) > 0.12;
    const gustVis = gustT >= 0 ? clamp(1 - gustT / 2.5, 0, 1) : 0;
    gustMesh.material.opacity = gustVis * 0.8;
    for (let i = 0; i < GN; i++) {
      const g = gP[i];
      if (gustT >= 0) { g.x += g.v * dt; if (g.x > 9) g.x = -9 - Math.random() * 3; }
      dummy.position.set(g.x, g.y, g.z);
      dummy.updateMatrix();
      gustMesh.setMatrixAt(i, dummy.matrix);
    }
    gustMesh.instanceMatrix.needsUpdate = true;
    labDrone.visible = labTarget.visible = true;
    refreshLabels();
    statsAcc += dt0;
    if (statsAcc > 0.15) {
      statsAcc = 0;
      const [ov, ts, ess] = metrics();
      stE.innerHTML = (target - y).toFixed(2) + ' <small>m</small>';
      stU.textContent = (uCmd * 100).toFixed(0) + '%';
      stO.textContent = ov.toFixed(0) + '%';
      stO.className = 'v ' + (ov > 25 ? 'bad' : ov > 8 ? 'warn' : 'ok');
      stTs.textContent = isFinite(ts) ? ts.toFixed(1) + ' s' : '—';
      stEss.innerHTML = ess.toFixed(2) + ' <small>m</small>';
      stEss.className = 'v ' + (Math.abs(ess) > 0.15 ? 'bad' : 'ok');
      updateFormula();
      drawPlot();
    }
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

const ph0 = Math.round(qsFloat('phase', 0));
if (ph0 >= 1 && ph0 <= 6) STEPS[ph0 - 1].act();
else if (qsFloat('t', 0) > 0) { target = 6; resetMetrics(); }
applyTheme();
applyLang();
syncAll();
resetMetrics();
start();
</script>
</body>
</html>
