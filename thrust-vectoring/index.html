<style>

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);

  #app{position:fixed;inset:0}#app canvas{display:block}

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }

</style>

{
  const c1=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,2.2,10),arrM);c1.position.y=0.85;thrustArr.add(c1);

{

const dialFace=new THREE.Group();dial.add(dialFace);
{
  const rp=[];for(let i=0;i<=48;i++){const a=i/48*Math.PI*2;rp.push(new THREE.Vector3(Math.cos(a),Math.sin(a),0));}
  dialFace.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rp),
    new THREE.LineBasicMaterial({color:0x8a94a4,transparent:true,opacity:0.8})));
  const tp=[];
  for(let a=0;a<360;a+=15){const r1=0.88,r2=a%30?0.94:1.05,ar=a*DEG;
    tp.push(Math.cos(ar)*r1,Math.sin(ar)*r1,0,Math.cos(ar)*r2,Math.sin(ar)*r2,0);}
  const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.Float32BufferAttribute(tp,3));
  dialFace.add(new THREE.LineSegments(tg,new THREE.LineBasicMaterial({color:0x8a94a4,transparent:true,opacity:0.6})));
  dialFace.add(new THREE.Mesh(new THREE.CircleGeometry(0.05,16),new THREE.MeshBasicMaterial({color:0xc7d2de})));
}
const needleG=new THREE.Group();dialFace.add(needleG);
needleG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(0,0,0),new THREE.Vector3(0,0.84,0)]),
  new THREE.LineBasicMaterial({color:0xffb35c})));
const tgtG=new THREE.Group();dialFace.add(tgtG);
tgtG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(0,0,0),new THREE.Vector3(0,1.0,0)]),
  new THREE.LineBasicMaterial({color:0xd9822b})));
/* 阵风:一排风纹线,方向随瞬时阵风翻转 */
const windM=new THREE.MeshBasicMaterial({color:0x9fb0c3,transparent:true,opacity:0.2});
const winds=[];
for(let i=0;i<6;i++){
  const w=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.015,0.015),windM);
  w.position.set(-6+i*2.2,1.2+((i*0.83)%1)*4.4,0.9-((i*0.37)%1)*1.6);
  scene.add(w);winds.push(w);
}

/* 状态与俯仰动力学:θ'' = k(sin(阵风等效角) - sinδ),闭环 δ=clamp(Kp·e+Kd·ω) */
let mode='tvc',target=0,gustAmp=0,playing=true,labelsOn=true,slowMo=false,armOn=true;
let th=0,om=0,delta=0,simT=0;
const K=3.2,KP=1.0,KD=1.5,DMAX=12*DEG;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const gustFn=t=>0.55*Math.sin(2.0*t)+0.30*Math.sin(3.7*t+1.6)+0.15*Math.sin(6.3*t+0.8);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblCom=addLabel(()=>L('质心 · 力矩的支点','CoM · the pivot for torque'),new THREE.Vector3(0.62,0.3,0),'b',()=>true,rocketG);
const lblNoz=addLabel(()=>L('万向节喷管 · ±12°','Gimbaled nozzle · ±12°'),new THREE.Vector3(0.6,-0.32,0),'g',()=>true,gimG);
const lblThr=addLabel(()=>L('推力 F ≈ mg','Thrust F ≈ mg'),new THREE.Vector3(0.62,2.15,0),'r',()=>true,gimG);
const lblGrav=addLabel(()=>L('重力 mg · 过质心无力矩','Gravity mg · through CoM, no torque'),new THREE.Vector3(0.95,-1.45,0),'b',()=>true,rocketG);
const lblArm=addLabel(()=>L('力臂 = L·sinδ','Arm = L·sinδ'),new THREE.Vector3(0,0,0),'o',
  ()=>armOn&&Math.abs(delta)>0.5*DEG,rocketG);
const lblDial=addLabel(()=>L(`刻度盘 · 目标 ${target}°`,`Dial · target ${target}°`),new THREE.Vector3(0,-1.4,0),'y',()=>true,dialFace);

function setTarget(v){target=clamp(v,0,30);
  document.getElementById('sTarget').value=target;
  document.getElementById('sTargetVal').textContent=(+target.toFixed(1))+'°';
  lblDial.element.textContent=L(`刻度盘 · 目标 ${target}°`,`Dial · target ${target}°`);updateStats();}
function setGust(v){gustAmp=clamp(v,0,20);
  document.getElementById('sGust').value=gustAmp;
  document.getElementById('sGustVal').textContent=gustAmp.toFixed(0)+'°';
  windM.opacity=0.06+gustAmp*0.012;updateStats();}
function setMode(m){mode=m;
  document.getElementById('bTvc').classList.toggle('on',m==='tvc');
  document.getElementById('bFixed').classList.toggle('on',m==='fixed');
  updateStats();}

const STEPS=[
 {zh:'<b>推力过质心</b>:推力线穿过质心,发动机开到最大也只推不转——对质心力矩为零',
  en:'<b>Thrust through the CoM</b>: with the thrust line through the center of mass, full throttle pushes but never turns — zero torque',
  act(){setMode('tvc');setTarget(0);setGust(0);}},
 {zh:'<b>偏转喷管造力矩</b>:目标俯仰给到 15°,喷管偏 δ 让推力线歪出质心,τ=F·L·sinδ 把箭体推过去',
  en:'<b>Gimbal makes torque</b>: command 15° pitch — the deflected nozzle swings the thrust line off the CoM and τ=F·L·sinδ pushes the nose over',
  act(){setTarget(15);setGust(0);}},
 {zh:'<b>闭环回正</b>:目标回到 0°,陀螺仪测出误差,控制器反向打喷管,稳稳收住',
  en:'<b>Closed loop back to zero</b>: target back to 0° — the gyro senses the error and the controller counter-steers to a smooth stop',
  act(){setTarget(0);setGust(2);}},
 {zh:'<b>阵风:先歪再扶正</b>:阵风幅度拉满,箭体被吹歪,喷管实时对冲,姿态又被拽回来',
  en:'<b>Gust: tip then recover</b>: max gust blows the body over; the nozzle counters in real time and drags the attitude back',
  act(){setGust(16);}},
 {zh:'<b>固定喷管对照</b>:同样的阵风,喷管不能偏就没有任何力矩可用,箭体缓慢翻滚失控',
  en:'<b>Fixed-nozzle contrast</b>: same gust, but a frozen nozzle makes no torque at all — the stage slowly tumbles out of control',
  act(){setMode('fixed');setGust(9);}},
 {zh:'<b>着陆回收靠这几度</b>:猎鹰 9 垂直回收、战机矢量机动,同是 τ=F·L·sinδ 这几度的功夫',
  en:'<b>Landings live on these degrees</b>: Falcon 9 propulsive landings and vectored fighters ride the same τ=F·L·sinδ',
  act(){setMode('tvc');setGust(3);setTarget(4);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const p=norm180(th/DEG),r=om/DEG,d=delta/DEG;
  document.getElementById('stPitch').innerHTML=p.toFixed(1)+'<small> °</small>';
  document.getElementById('stRate').innerHTML=r.toFixed(1)+'<small> °/s</small>';
  document.getElementById('stNoz').innerHTML=d.toFixed(1)+'<small> °</small>';
  const e=Math.abs(norm180(target-th/DEG)),ev=document.getElementById('stErr');
  ev.innerHTML=e.toFixed(1)+'<small> °</small>';
  ev.className='v '+(e<2?'ok':(e>10?'warn':''));
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bTvc').addEventListener('click',()=>setMode('tvc'));
document.getElementById('bFixed').addEventListener('click',()=>setMode('fixed'));
document.getElementById('sTarget').addEventListener('input',e=>setTarget(+e.target.value));
document.getElementById('sGust').addEventListener('input',e=>setGust(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglArm').addEventListener('change',e=>{armOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();setTarget(target);setGust(gustAmp);
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 闭环 PD:姿态误差 → 喷管角;固定喷管模式 δ=0,只剩微小偏置力矩慢慢翻滚 */
  const g=gustFn(simT);
  if(mode==='tvc'){
    const err=target*DEG-th;
    delta=clamp(KP*err+KD*om,-DMAX,DMAX);
    om+=dts*K*(Math.sin(gustAmp*DEG*g)-Math.sin(delta));
  }else{
    delta=0;
    om+=dts*K*(Math.sin(gustAmp*DEG*g+0.5*DEG));
  }
  th+=om*dts;
  /* 箭体姿态与悬停呼吸 */
  rocketG.rotation.z=th;
  rocketG.position.y=COMY+0.05*Math.sin(simT*1.15);
  gimG.rotation.z=delta;
  plume.scale.set(1,0.9+0.16*Math.sin(simT*37)+0.08*Math.sin(simT*61),1);
  /* 力臂三角随 δ 重建 */
  updateArm();
  /* 刻度盘公告板 + 指针(黄=当前,橙=目标) */
  dialFace.lookAt(camera.position);
  needleG.rotation.z=th;tgtG.rotation.z=target*DEG;
  /* 风纹 */
  const wSpd=(0.9+gustAmp*0.12)*dts*(g>=0?1:-1);
  for(const w of winds){
    w.visible=gustAmp>0.4;
    w.position.x+=wSpd;
    if(w.position.x>6.2)w.position.x=-6.2;
    if(w.position.x<-6.2)w.position.x=6.2;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();updateArm();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(1);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
