<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滴定曲线 · 缓冲平台与等当点突跃</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ba68c8;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#9c4dab;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,209,102,.9); color: #ffe9b8; }
  .lbl.g { border-color: rgba(126,226,174,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(127,208,247,.9); color: #bde9ff; }
  .lbl.p { border-color: rgba(186,104,200,.9); color: #ecd5ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 11.5px; padding: 3px 7px; }
  :root[data-theme="light"] .lbl.o { color:#9c6f00; } :root[data-theme="light"] .lbl.g { color:#148a5c; }
  :root[data-theme="light"] .lbl.b { color:#0c7ba6; } :root[data-theme="light"] .lbl.p { color:#9c4dab; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 420px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.ph { color: #ba68c8; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.w  { color: #7ee2ae; border-color: rgba(67,209,124,.6); }
  .chip.s  { color: #7fd0f7; border-color: rgba(127,208,247,.6); }
  .chip.i  { color: #ffd166; border-color: rgba(255,209,102,.6); }
  :root[data-theme="light"] .chip.w  { color: #148a5c; border-color: rgba(20,138,92,.6); }
  :root[data-theme="light"] .chip.s  { color: #0c7ba6; border-color: rgba(12,123,166,.6); }
  :root[data-theme="light"] .chip.i  { color: #9c6f00; border-color: rgba(178,128,20,.6); }
  #indRow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #indRow .brl { font-size: 12px; color: var(--text2); }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 6px; text-align: center; font-size: 12px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(186,104,200,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(156,77,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: default;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(186,104,200,.10); border-color: rgba(186,104,200,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(156,77,171,.10); border-color: rgba(156,77,171,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="滴定曲线:缓冲平台与等当点突跃" data-en="Titration curve: the buffer plateau and the equivalence jump">滴定曲线:缓冲平台与等当点突跃</h1>
  <div class="sub" data-zh="半当量点 pH = pKa(缓冲溶液的家),等当点一滴定乾坤,pH 直线冲天——指示剂的窗口必须罩住突跃 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Half-equivalence pH = pKa (home of buffers); at equivalence one drop swings the pH sky-high — the indicator window must cover the jump · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">半当量点 pH = pKa(缓冲溶液的家),等当点一滴定乾坤,pH 直线冲天——指示剂的窗口必须罩住突跃 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="当前 pH" data-en="current pH">当前 pH</span><span class="v ph" id="stPh">—</span>
  <span class="k" data-zh="已滴体积" data-en="volume added">已滴体积</span><span class="v" id="stV">—<small> /25 mL</small></span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip w" data-zh="弱酸(HAc,pKa 4.76)" data-en="weak acid (HAc, pKa 4.76)">弱酸(HAc,pKa 4.76)</span>
    <span class="chip s" data-zh="强酸(HCl,对照虚线)" data-en="strong acid (HCl, dashed)">强酸(HCl,对照虚线)</span>
    <span class="chip i" data-zh="指示剂变色窗" data-en="indicator window">指示剂变色窗</span>
  </div>
  <div id="indRow">
    <span class="brl" data-zh="指示剂：" data-en="Indicator:">指示剂：</span>
    <button id="indPhe" class="bon on" data-zh="酚酞 8.2–10" data-en="phenolphthalein">酚酞 8.2–10</button>
    <button id="indMo" class="bon" data-zh="甲基橙 3.1–4.4" data-en="methyl orange">甲基橙 3.1–4.4</button>
    <button id="indLit" class="bon" data-zh="石蕊 4.5–8.3" data-en="litmus">石蕊 4.5–8.3</button>
  </div>
  <div class="row"><label data-zh="滴定进度" data-en="Progress">滴定进度</label><input id="prog" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="progVal">0 mL</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <label style="display:flex;gap:5px;align-items:center;font-size:12px;color:var(--text2)">
      <input id="tglWeak" type="checkbox" checked> <span data-zh="显示弱酸曲线" data-en="weak-acid curve">显示弱酸曲线</span></label>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglStrong" type="checkbox" checked> <span data-zh="强酸对照虚线" data-en="strong-acid dashed">强酸对照虚线</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

/* ---------------- 主题 / 语言(全站共享模式) ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
let grid = null;
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const lt = THEME === 'light';
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(lt ? 0xeef1f6 : 0x10141b);
  scene.fog = new THREE.Fog(lt ? 0xeef1f6 : 0x10141b, 22, 44);
  if (grid) {
    grid.material.color.set(lt ? 0x9aa7b8 : 0x3a4656);
    grid.material.opacity = lt ? 0.55 : 0.35;
  }
  axisMat.color.set(lt ? 0x3c4a5c : 0x6b7686);
  axisMat.opacity = lt ? 0.9 : 0.8;
  ribbon.material.color.set(lt ? 0x1f7a52 : 0x2b9f6e);
  weakEdgeMat.color.set(lt ? 0x148a5c : 0x7ee2ae);
  strongMat.color.set(lt ? 0x0c7ba6 : 0x7fd0f7);
  dotWeak.material.color.set(lt ? 0x0f9d63 : 0x7ee2ae);
  haloMat.color.set(lt ? 0x148a5c : 0x7ee2ae);
  dotStrong.material.color.set(lt ? 0x0c7ba6 : 0x7fd0f7);
  bandMat.color.set(lt ? 0xb2820a : 0xffd166);
  bandEdgeMat.color.set(lt ? 0x9c6f00 : 0xffd166);
  halfMat.color.set(lt ? 0x9c6f00 : 0xffd166);
  halfDot.material.color.set(lt ? 0x9c6f00 : 0xffd166);
  eqMat.color.set(lt ? 0x9c4dab : 0xba68c8);
  dropMat.color.set(lt ? 0x2f7fb8 : 0xa8dcf5);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('滴定曲线 · 缓冲平台与等当点突跃', 'Titration Curve · Plateau & the Jump');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(1.4, 4.8, 13.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.8, 1.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(3, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

/* 地面网格 */
grid = new THREE.GridHelper(34, 34, 0x3a4656, 0x3a4656);
grid.material.transparent = true;
grid.material.opacity = 0.35;
grid.position.set(0.8, 0, 0);
scene.add(grid);

/* ================= 滴定化学(0.1M 25mL 酸 + 0.1M NaOH,当量点 25 mL) ================= */
const PKA = 4.76, VE = 25;
/* pH(V) 精确近似 */
function pHweak(V) {
  if (V <= 0.01) return 2.9;                              // 0.1M HAc ≈ 2.9
  if (V < VE - 0.4) return PKA + Math.log10(V / (VE - V));
  if (V <= VE + 0.4) {                                    // 等当点附近:平滑过渡
    const k = clamp((V - (VE - 0.4)) / 0.8, 0, 1);
    return lerp(PKA + Math.log10((VE - 0.4) / 0.4), 11.1, ss(0, 1, k));
  }
  const oh = (V - VE) * 0.1 / (25 + V);
  return 14 - (-Math.log10(oh));
}
function pHstrong(V) {
  if (V < VE - 0.3) return -Math.log10((VE - V) * 0.1 / (25 + V));
  if (V <= VE + 0.3) return 7;
  const oh = (V - VE) * 0.1 / (25 + V);
  return 14 - (-Math.log10(oh));
}
const IND = {
  phe: { lo: 8.2, hi: 10.0, acid: 0xf2f5f9, base: 0xf48fb1, n: () => L('酚酞', 'phenolphthalein') },
  mo:  { lo: 3.1, hi: 4.4,  acid: 0xff8a80, base: 0xffe08a, n: () => L('甲基橙', 'methyl orange') },
  lit: { lo: 4.5, hi: 8.3,  acid: 0xff8a80, base: 0x7fd0f7, n: () => L('石蕊', 'litmus') },
};

/* ================= 布局常量 ================= */
const VX0 = -4.3, DXV = 0.172;            // V(mL) → x:V=0 在 -4.3,V=50 在 +4.3
const VX = V => VX0 + V * DXV;
const PY = p => p * 0.32;                 // pH 0..14 → y 0..4.48
const BX = 5.75, BZ = 0.35;               // 烧杯/滴定管中心
const LIQ0 = 0.62;                        // 25 mL 初始液高

/* ================= 状态 ================= */
let prog = 0;                             // 0..1000(滑块),对应 0..50 mL

{

function stepIndex() {
  const v = prog / 1000 * 50;
  if (v < 10) return 0;
  if (v < 44) return 1;
  if (v < 52) return 2;
  if (v < 60) return 3;
  return 4;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1;
const _col = new THREE.Color();
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) {
    prog = (prog + dt * speed * 140) % 1000;
    elProg.value = Math.round(prog);
  }
  const V = volOf();
  const pHW = pHweak(V), pHS = pHstrong(V);
  const x = VX(V);
  /* 曲线上的当前点 */
  dotWeak.position.set(x, PY(pHW), 0.18);
  halo.position.copy(dotWeak.position);
  dotStrong.position.set(x, PY(pHS), 0.18);
  lblPh.position.set(x + 0.15, PY(pHW) + 0.26, 0.18);
  /* 烧杯液面上升 + 指示剂显色 */
  const h = LIQ0 * (25 + V) / 25;
  liquid.scale.y = h;
  liquid.position.y = h / 2;
  liquidTop.position.y = h + 0.001;
  const cfg = IND[ind];
  const mix = clamp((pHW - cfg.lo) / (cfg.hi - cfg.lo), 0, 1);
  _col.lerpColors(indAcid, indBase, mix);
  liquidMat.color.copy(_col);
  liquidMat.emissive.copy(_col);
  liquidTopMat.color.copy(_col);
  liquidTopMat.emissive.copy(_col);
  /* 滴定管液柱下降 */
  const bh = Math.max(1 - V / 50, 0) * 1.05 + 0.02;
  naoh.scale.y = bh;
  naoh.position.y = 2.28 + bh / 2;
  /* 搅拌磁子 */
  if (playing) stir.rotation.y += dt * 7 * speed;
  /* 液滴 */
  if (playing && V < 49.5) {
    dropTimer -= dt;
    if (dropTimer <= 0) { spawnDrop(); dropTimer = 0.34 / speed; }
  }
  for (const d of drops) {
    if (!d.on) continue;
    d.vy += dt * 5.5;
    d.m.position.y -= d.vy * dt;
    if (d.m.position.y <= h + 0.04) { d.on = false; d.m.visible = false; }
  }
  /* 计数 */
  stPh.textContent = pHW.toFixed(2);
  stV.innerHTML = V.toFixed(1) + '<small> /25 mL(当量)</small>';
  elProgVal.textContent = V.toFixed(1) + ' mL';
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  refreshLabels();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
updateIndicator();
applyTheme();
applyLang();
setPlayLabel();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
