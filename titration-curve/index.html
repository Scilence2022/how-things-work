<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滴定曲线 · 缓冲平台与等当点突跃</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ba68c8;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#9c4dab;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 420px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.ph { color: #ba68c8; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.w  { color: #7ee2ae; border-color: rgba(67,209,124,.6); }
  .chip.s  { color: #7fd0f7; border-color: rgba(127,208,247,.6); }
  .chip.i  { color: #ffd166; border-color: rgba(255,209,102,.6); }
  :root[data-theme="light"] .chip.w  { color: #148a5c; border-color: rgba(20,138,92,.6); }
  :root[data-theme="light"] .chip.s  { color: #0c7ba6; border-color: rgba(12,123,166,.6); }
  :root[data-theme="light"] .chip.i  { color: #9c6f00; border-color: rgba(178,128,20,.6); }
  #indRow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #indRow .brl { font-size: 12px; color: var(--text2); }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 6px; text-align: center; font-size: 12px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(186,104,200,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(156,77,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: default;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(186,104,200,.10); border-color: rgba(186,104,200,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(156,77,171,.10); border-color: rgba(156,77,171,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="滴定曲线:缓冲平台与等当点突跃" data-en="Titration curve: the buffer plateau and the equivalence jump">滴定曲线:缓冲平台与等当点突跃</h1>
  <div class="sub" data-zh="半当量点 pH = pKa(缓冲溶液的家),等当点一滴定乾坤,pH 直线冲天——指示剂的窗口必须罩住突跃 · 空格播放/暂停" data-en="Half-equivalence pH = pKa (home of buffers); at equivalence one drop swings the pH sky-high — the indicator window must cover the jump · Space = play/pause">半当量点 pH = pKa(缓冲溶液的家),等当点一滴定乾坤,pH 直线冲天——指示剂的窗口必须罩住突跃 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="当前 pH" data-en="current pH">当前 pH</span><span class="v ph" id="stPh">—</span>
  <span class="k" data-zh="已滴体积" data-en="volume added">已滴体积</span><span class="v" id="stV">—<small> /25 mL</small></span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip w" data-zh="弱酸(HAc,pKa 4.76)" data-en="weak acid (HAc, pKa 4.76)">弱酸(HAc,pKa 4.76)</span>
    <span class="chip s" data-zh="强酸(HCl,对照虚线)" data-en="strong acid (HCl, dashed)">强酸(HCl,对照虚线)</span>
    <span class="chip i" data-zh="指示剂变色窗" data-en="indicator window">指示剂变色窗</span>
  </div>
  <div id="indRow">
    <span class="brl" data-zh="指示剂：" data-en="Indicator:">指示剂：</span>
    <button id="indPhe" class="bon on" data-zh="酚酞 8.2–10" data-en="phenolphthalein">酚酞 8.2–10</button>
    <button id="indMo" class="bon" data-zh="甲基橙 3.1–4.4" data-en="methyl orange">甲基橙 3.1–4.4</button>
    <button id="indLit" class="bon" data-zh="石蕊 4.5–8.3" data-en="litmus">石蕊 4.5–8.3</button>
  </div>
  <div class="row"><label data-zh="滴定进度" data-en="Progress">滴定进度</label><input id="prog" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="progVal">0 mL</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停/播放</button>
    <label style="display:flex;gap:5px;align-items:center;font-size:12px;color:var(--text2)">
      <input id="tglWeak" type="checkbox" checked> <span data-zh="显示弱酸曲线" data-en="weak-acid curve">显示弱酸曲线</span></label>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglStrong" type="checkbox" checked> <span data-zh="强酸对照虚线" data-en="strong-acid dashed">强酸对照虚线</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('滴定曲线 · 缓冲平台与等当点突跃', 'Titration Curve · Plateau & the Jump');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

/* ================= 滴定化学(0.1M 25mL 酸 + 0.1M NaOH,当量点 25 mL) ================= */
const PKA = 4.76, VE = 25;
let showLabels = true, showStrong = true, showWeak = true;
let playing = true, speed = 1;
let prog = 0;                 // 0..1000(滑块),对应 0..50 mL
let ind = 'phe';              // phe / mo / lit
const IND = {
  phe: { lo: 8.2, hi: 10.0, acid: '#f2f5f9', base: '#f48fb1', n: L('酚酞', 'phenolphthalein') },
  mo:  { lo: 3.1, hi: 4.4,  acid: '#ff8a80', base: '#ffe08a', n: L('甲基橙', 'methyl orange') },
  lit: { lo: 4.5, hi: 8.3,  acid: '#ff8a80', base: '#7fd0f7', n: L('石蕊', 'litmus') },
};
/* pH(V) 精确近似 */
function pHweak(V) {
  if (V <= 0.01) return 2.9;                              // 0.1M HAc ≈ 2.9
  if (V < VE - 0.4) return PKA + Math.log10(V / (VE - V));
  if (V <= VE + 0.4) {                                    // 等当点附近:平滑过渡
    const k = clamp((V - (VE - 0.4)) / 0.8, 0, 1);
    return lerp(PKA + Math.log10((VE - 0.4) / 0.4), 11.1, ss(0, 1, k));
  }
  const oh = (V - VE) * 0.1 / (25 + V);
  return 14 - (-Math.log10(oh));
}
function pHstrong(V) {
  if (V < VE - 0.3) return -Math.log10((VE - V) * 0.1 / (25 + V));
  if (V <= VE + 0.3) return 7;
  const oh = (V - VE) * 0.1 / (25 + V);
  return 14 - (-Math.log10(oh));
}
const volOf = () => prog / 1000 * 50;

/* ================= 相位讲解(按滴定进度点亮) ================= */
const STEPS = [
  { at: 0, b: '起点:酸的强度定 pH', d: '0.1M 强酸 pH ≈ 1;同浓度的弱酸(HAc)只电离一小部分,pH ≈ 2.9——起点就不同。',
    be: 'The starting pH', de: '0.1 M strong acid sits at pH ≈ 1; the same concentration of HAc only partly ionizes, pH ≈ 2.9.' },
  { at: 10, b: '缓冲平台', d: '滴到半当量点(12.5 mL)时 [A⁻] = [HA],pH = pKa = 4.76——这就是缓冲溶液的家,一段坡度极缓的平台。',
    be: 'The buffer plateau', de: 'At half-equivalence [A⁻] = [HA] so pH = pKa = 4.76 — the gentle plateau where buffer solutions live.' },
  { at: 44, b: '等当点:一滴定乾坤', d: '接近 25 mL 时 pH 在两三滴内从 4 冲到 10——曲线近乎垂直。酚酞的变色窗恰好罩住这里。',
    be: 'The equivalence jump', de: 'Near 25 mL the pH leaps from ~4 to ~10 within a couple of drops — a near-vertical wall, right where phenolphthalein changes.' },
  { at: 52, b: '指示剂:窗口罩住突跃', d: '指示剂只在自己的变色窗内变色:酚酞(8.2–10)罩得住弱酸突跃;甲基橙(3.1–4.4)只适合强酸滴定。',
    be: 'Pick the right indicator', de: 'An indicator only changes inside its window: phenolphthalein covers the weak-acid jump; methyl orange suits strong-acid runs.' },
  { at: 60, b: '弱 vs 强:平台与直冲', d: '弱酸有缓冲平台、等当点偏碱(pH ≈ 8.7);强酸没有平台、等当点 pH = 7。两条曲线对照着看。',
    be: 'Weak vs strong', de: 'Weak acid shows a buffer plateau and a basic equivalence (pH ≈ 8.7); strong acid has no plateau and pH = 7 at equivalence.' },
];
function stepIndex() {
  const v = prog / 1000 * 50;
  if (v < 10) return 0;
  if (v < 44) return 1;
  if (v < 52) return 2;
  if (v < 60) return 3;
  return 4;
}

/* ================= 绘制 ================= */
const AX0 = 170, AX1 = 1060, AY1 = 780, AY0 = 110;
const vx = V => lerp(AX0, AX1, V / 50);
const pyh = p => lerp(AY1, AY0, p / 14);
function drawAxes() {
  line(AX0, AY1, AX1 + 40, AY1, PAL.axis, 1.5);
  line(AX0, AY1, AX0, AY0 - 20, PAL.axis, 1.5);
  for (let p2 = 0; p2 <= 14; p2 += 2) {
    line(AX0 - 6, pyh(p2), AX0 + 6, pyh(p2), PAL.axis, 1);
    text(String(p2), AX0 - 14, pyh(p2) + 4, 11, PAL.dim2, 'right');
  }
  for (let v2 = 0; v2 <= 50; v2 += 10) {
    line(vx(v2), AY1 - 5, vx(v2), AY1 + 5, PAL.axis, 1);
    text(String(v2), vx(v2), AY1 + 24, 11, PAL.dim2, 'center');
  }
  text('pH', AX0 - 14, AY0 - 32, 13, PAL.dim2, 'center');
  text(L('NaOH 体积 (mL)', 'NaOH volume (mL)'), AX1 + 40, AY1 + 48, 13, PAL.dim2, 'center');
}
function drawCurves() {
  if (showWeak) {
    ctx.strokeStyle = '#7ee2ae'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i <= 300; i++) {
      const V = i / 300 * 50;
      const X = vx(V), Y = pyh(pHweak(V));
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.stroke();
  }
  if (showStrong) {
    ctx.strokeStyle = '#7fd0f7'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    for (let i = 0; i <= 300; i++) {
      const V = i / 300 * 50;
      const X = vx(V), Y = pyh(pHstrong(V));
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // 半当量点 & 等当点标线
  line(vx(12.5), pyh(PKA) - 6, vx(12.5), AY1, 'rgba(255,209,102,.45)', 1.5, [5, 4]);
  circle(vx(12.5), pyh(PKA), 5, '#ffd166');
  if (showLabels) text(L('半当量点:pH = pKa = 4.76(缓冲中心)', 'half-equivalence: pH = pKa = 4.76'),
    vx(12.5) - 10, pyh(PKA) + 26, 12, '#ffd166', 'center');
  line(vx(25), AY0 + 4, vx(25), AY1, 'rgba(186,104,200,.4)', 1.5, [5, 4]);
  if (showLabels) text(L('等当点 25 mL', 'equivalence: 25 mL'), vx(25), AY0 + 16, 12, '#d6c7ff', 'center');
  // 指示剂变色窗(纵向色带)
  const cfg = IND[ind];
  ctx.fillStyle = 'rgba(255,209,102,.16)';
  ctx.fillRect(vx(0) + 2, pyh(cfg.hi), vx(50) - vx(0) - 4, pyh(cfg.lo) - pyh(cfg.hi));
  line(vx(0), pyh(cfg.hi), vx(50), pyh(cfg.hi), 'rgba(255,209,102,.6)', 1.2, [4, 4]);
  line(vx(0), pyh(cfg.lo), vx(50), pyh(cfg.lo), 'rgba(255,209,102,.6)', 1.2, [4, 4]);
  if (showLabels) text(`${cfg.n} ${cfg.lo}–${cfg.hi}`, AX1 - 8, pyh(cfg.hi) - 6, 11.5, '#ffd166', 'right', 700);
}
function drawDropper(t) {
  const V = volOf();
  const X = vx(V), Y = pyh(pHweak(V)), Ys = pyh(pHstrong(V));
  // 滴管
  line(X, AY0 + 30, X, Y - 30, 'rgba(154,167,184,.5)', 2);
  circle(X, Y - 34, 6, '#9aa7b8');
  // 当前 pH 点(弱酸)
  circle(X, Y, 7.5, '#7ee2ae', PAL.axis, 1);
  if (showStrong) circle(X, Ys, 5.5, '#7fd0f7');
  if (showLabels) {
    text(L(`pH ${pHweak(V).toFixed(1)}`, `pH ${pHweak(V).toFixed(1)}`), X + 14, Y - 12, 12.5, '#7ee2ae', 'left', 700);
    if (V > 0.5) text(L('滴下的一滴 NaOH', 'a drop of NaOH'), X + 8, AY0 + 52, 11.5, PAL.dim2);
  }
  // 烧杯色块(指示剂变色)
  const cfg2 = IND[ind];
  const pHN = pHweak(V);
  const mix = clamp((pHN - cfg2.lo) / (cfg2.hi - cfg2.lo), 0, 1);
  const col = mixColor(cfg2.acid, cfg2.base, mix);
  rrect0(1180, 300, 190, 260, 18, 'rgba(154,167,184,.08)', PAL.axis, 2);
  ctx.fillStyle = col + '66';
  ctx.fillRect(1186, 300 + 80, 178, 174);
  text(L('烧杯(指示剂显色)', 'beaker (indicator color)'), 1275, 286, 12.5, PAL.dim2, 'center');
  text(`pH ${pHN.toFixed(1)}`, 1275, 300 + 200, 20, col, 'center', 700);
  function rrect0(a, b, c, d, e, f, g2, h2) {
    ctx.beginPath(); ctx.roundRect(a, b, c, d, e);
    if (f) { ctx.fillStyle = f; ctx.fill(); }
    if (g2) { ctx.strokeStyle = g2; ctx.lineWidth = h2; ctx.stroke(); }
  }
}
function mixColor(a, b, k) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(lerp(v, pb[i], k)).toString(16).padStart(2, '0')).join('');
}

/* ================= 计数 ================= */
const stPh = document.getElementById('stPh'), stV = document.getElementById('stV');
function updateStats() {
  const V = volOf();
  stPh.innerHTML = pHweak(V).toFixed(2);
  stV.innerHTML = V.toFixed(1) + '<small> /25 mL(当量)</small>';
}

/* ================= 主绘制 ================= */
function draw(t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawAxes();
  drawCurves();
  drawDropper(t);
}

/* ================= UI / 主循环 ================= */
let last = performance.now();
const elPlay = document.getElementById('play');
const elProg = document.getElementById('prog');
const elProgVal = document.getElementById('progVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglStrong = document.getElementById('tglStrong');
const tglWeak = document.getElementById('tglWeak');
const indPhe = document.getElementById('indPhe'), indMo = document.getElementById('indMo'), indLit = document.getElementById('indLit');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elProg.addEventListener('input', () => { prog = parseInt(elProg.value, 10); playing = false; setPlayLabel(); });
function setInd(ind2, btn) {
  ind = ind2;
  [indPhe, indMo, indLit].forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}
indPhe.addEventListener('click', () => setInd('phe', indPhe));
indMo.addEventListener('click', () => setInd('mo', indMo));
indLit.addEventListener('click', () => setInd('lit', indLit));
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglStrong.addEventListener('change', () => { showStrong = tglStrong.checked; });
tglWeak.addEventListener('change', () => { showWeak = tglWeak.checked; });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  if (playing) {
    prog = (prog + dt * speed * 140) % 1000;
    elProg.value = Math.round(prog);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(prog / 1000);
  updateStats();
  elProgVal.textContent = (prog / 1000 * 50).toFixed(1) + ' mL';
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
requestAnimationFrame(frame);
</script>
