<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>理想气体定律 · 一本账的三种记法</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="理想气体定律" data-en="The Ideal Gas Laws">理想气体定律</h1>
  <div class="sub" data-zh="压强是分子撞壁的账单:撞得越频、撞得越狠,压强越大——定温压缩是撞得更频,定容加热是撞得更狠,定压加热是活塞让路给撞得更多的次数;三条气体定律其实是同一本账的三种记法,合起来就是 PV=nRT · 拖动旋转 / 空格运行/暂停" data-en="Pressure is the bill molecules hand the walls: more frequent hits or harder hits, higher pressure — isothermal squeezing raises the frequency, constant-volume heating raises the force, constant-pressure heating lets the piston step aside for extra hits; three gas laws are one ledger written three ways, and together they read PV=nRT · drag to orbit / Space = run/pause">压强是分子撞壁的账单:撞得越频、撞得越狠,压强越大——定温压缩是撞得更频,定容加热是撞得更狠,定压加热是活塞让路给撞得更多的次数;三条气体定律其实是同一本账的三种记法,合起来就是 PV=nRT · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="体积" data-en="Volume">体积</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="温度" data-en="Temperature">温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="PV/(nT)" data-en="PV/(nT)">PV/(nT)</span><span class="v" id="stK">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bIsoth" data-zh="定温(锁 T)" data-en="Isothermal (lock T)">定温(锁 T)</button>
    <button class="abtn" id="bIsoch" data-zh="定容(锁 V)" data-en="Isochoric (lock V)">定容(锁 V)</button>
    <button class="abtn" id="bIsob" data-zh="定压(锁 P)" data-en="Isobaric (lock P)">定压(锁 P)</button>

    <span class="val" id="sTVal">300 K</span>
  </div>
  <div class="row">
    <label data-zh="体积 V" data-en="Volume V">体积 V</label>
    <input id="sV" type="range" min="4" max="30" step="0.5" value="14">

  </div>
  <div class="row">
    <label data-zh="物质的量 n" data-en="Amount n">物质的量 n</label>
    <input id="sN" type="range" min="1" max="2" step="0.05" value="1.5">
    <span class="val" id="sNVal">1.50 mol</span>

  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglTrail" type="checkbox" checked> <span data-zh="分子轨迹" data-en="Trails">分子轨迹</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../kinetic-theory/" data-zh="分子动理论" data-en="Kinetic Theory">分子动理论</a>
    <a href="../carnot-cycle/" data-zh="卡诺循环" data-en="The Carnot Cycle">卡诺循环</a>
    <a href="../joule-thomson/" data-zh="焦耳–汤姆逊效应" data-en="Joule–Thomson Effect">焦耳–汤姆逊效应</a>
    <a href="../supercritical-co2/" data-zh="超临界 CO₂" data-en="Supercritical CO2">超临界 CO₂</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.6,3.6,7.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=28;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const benchM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const bench=new THREE.Mesh(new THREE.BoxGeometry(8,0.5,2.4),benchM);
bench.position.y=0.25;scene.add(bench);

/* ===== 透明气缸 + 可动活塞(轴线沿 Y,底面 y≈0.62) ===== */
const cylR=1.15,R=1.05,LOB=0.64;
const HfromV=v=>0.7+(v-4)*0.127;
const wallM=new THREE.MeshStandardMaterial({color:0x9db4c8,roughness:0.12,metalness:0.1,transparent:true,opacity:0.16,side:THREE.DoubleSide,depthWrite:false});
const wall=new THREE.Mesh(new THREE.CylinderGeometry(cylR,cylR,4.6,48,1,true),wallM);
wall.position.y=2.8;scene.add(wall);
const capM=new THREE.MeshStandardMaterial({color:0x6b7787,roughness:0.4,metalness:0.6});
const baseCap=new THREE.Mesh(new THREE.CylinderGeometry(cylR+0.06,cylR+0.06,0.12,48),capM);
baseCap.position.y=0.56;scene.add(baseCap);
const piston=new THREE.Group();
const disk=new THREE.Mesh(new THREE.CylinderGeometry(cylR-0.04,cylR-0.04,0.16,48),
  new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85}));
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.3,12),capM);
rod.position.y=0.73;piston.add(disk,rod);scene.add(piston);
/* 分子(InstancedMesh,重击闪红) */
const NM=80;
const mol=new THREE.InstancedMesh(new THREE.SphereGeometry(0.075,10,8),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4,emissive:0x223344,emissiveIntensity:0.3}),NM);
mol.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(mol);
const mols=[];for(let i=0;i<NM;i++)mols.push({x:0,y:-9,z:0,dx:0,dy:1,dz:0,s:2,heat:0});
const col=new THREE.Color();
for(let i=0;i<NM;i++)mol.setColorAt(i,col.setRGB(0.62,0.72,0.85));
/* 分子轨迹(LineSegments) */
const trailPos=new Float32Array(NM*6);
const trails=new THREE.LineSegments(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.28}));
trails.geometry.setAttribute('position',new THREE.BufferAttribute(trailPos,3).setUsage(THREE.DynamicDrawUsage));
trails.frustumCulled=false;scene.add(trails);
const m4=new THREE.Matrix4();
/* 压强表(指针)与温度计 */
const gauge=new THREE.Group();gauge.position.set(2.7,3.5,0);scene.add(gauge);
gauge.add(new THREE.Mesh(new THREE.CircleGeometry(0.6,40),new THREE.MeshStandardMaterial({color:0x39414e,roughness:0.6})));
gauge.add(new THREE.Mesh(new THREE.TorusGeometry(0.6,0.045,10,44),new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.35,metalness:0.7})));
for(let i=0;i<=10;i++){const a=2.1-i*0.42;
  const tk=new THREE.Mesh(new THREE.BoxGeometry(0.03,i%5?0.07:0.13,0.01),new THREE.MeshStandardMaterial({color:0xd8dee8}));
  tk.position.set(Math.sin(a)*0.5,Math.cos(a)*0.5,0.012);tk.rotation.z=-a;gauge.add(tk);}
const needleG=new THREE.BoxGeometry(0.045,0.52,0.02);needleG.translate(0,0.21,0);
const needle=new THREE.Mesh(needleG,new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff6b6b,emissiveIntensity:0.4}));
needle.position.z=0.03;gauge.add(needle);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.05,16),new THREE.MeshStandardMaterial({color:0xd8a03c,metalness:0.6,roughness:0.3}));
hub.rotation.x=Math.PI/2;gauge.add(hub);
const gStand=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,3.0,10),capM);gStand.position.set(2.7,2.0,0);scene.add(gStand);
const thermo=new THREE.Group();thermo.position.set(-1.9,0,0.6);scene.add(thermo);
const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.9,16),wallM);tube.position.y=2.2;thermo.add(tube);
const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.19,18,14),new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.35}));
bulb.position.y=1.15;thermo.add(bulb);
const mercury=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.6,10),new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.3}));
thermo.add(mercury);
const tStand=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1.5,10),capM);tStand.position.set(-1.9,1.25,0.6);scene.add(tStand);

/* 状态 */
let mode='isoth',Tg=300,V=14,n=1.5,playing=true,labelsOn=true,slowMo=false,trailsOn=true;
let auto=null,simT=0,imp=0,hits=0,pSm=0,hr=0,measured=false,pExpS=0,Plock=350,Pshow=187,Kdisp=8.31;
const Rg=8.314,bEx=0.2;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const nBalls=()=>Math.round(n*40);
function seedMol(i){const a=Math.random()*Math.PI*2,rr=Math.random()*R*0.85,hi=0.5+HfromV(V)-0.12;
  const p=mols[i];p.x=Math.cos(a)*rr;p.z=Math.sin(a)*rr;p.y=LOB+0.05+Math.random()*Math.max(0.1,hi-LOB-0.1);
  const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
  p.dx=Math.sin(ph)*Math.cos(th);p.dy=Math.cos(ph);p.dz=Math.sin(ph)*Math.sin(th);
  p.s=2.6*Math.sqrt(Tg/300);p.heat=0;}
function scriptV(v0,v1,dur){auto={t:0,dur,v0,v1,t0:Tg,t1:Tg};}
function scriptT(q0,q1,dur){auto={t:0,dur,v0:V,v1:V,t0:q0,t1:q1};}
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const hitLbl=addLabel(()=>L(`分子撞击:${hr.toFixed(0)} 次/s,每次都推账单`,`Molecular hits: ${hr.toFixed(0)}/s, each one bills the wall`),new THREE.Vector3(0.4,1.5,1.35),'r',()=>true);
const pistLbl=addLabel(()=>L(`活塞:位置 = 体积 ${V.toFixed(1)} L`,`Piston: position = volume ${V.toFixed(1)} L`),new THREE.Vector3(1.5,2.7,0),'y',()=>true);
const thermLbl=addLabel(()=>L(`温度计:${Tg.toFixed(0)} K → 速度 ∝ √T`,`Thermometer: ${Tg.toFixed(0)} K → speed ∝ √T`),new THREE.Vector3(-1.9,3.45,0.6),'b',()=>true);
const gaugeLbl=addLabel(()=>L(`压强表:${Pshow.toFixed(0)} kPa(碰撞统计)`,`Gauge: ${Pshow.toFixed(0)} kPa (collision stats)`),new THREE.Vector3(2.7,4.35,0),'o',()=>true);
function syncT(){document.getElementById('sT').value=Tg;document.getElementById('sTVal').textContent=Tg.toFixed(0)+' K';}
function syncV(){document.getElementById('sV').value=V;document.getElementById('sVVal').textContent=V.toFixed(1)+' L';}
function syncN(){document.getElementById('sN').value=n;document.getElementById('sNVal').textContent=n.toFixed(2)+' mol';}
function setT(v){auto=null;Tg=clamp(v,150,900);syncT();updateStats();}
function setV(v){auto=null;V=clamp(v,4,30);syncV();updateStats();}
function setN(v){auto=null;n=clamp(v,1,2);syncN();updateStats();}
function setMode(m){mode=m;auto=null;if(m==='isob')Plock=350;
  document.getElementById('bIsoth').classList.toggle('on',m==='isoth');
  document.getElementById('bIsoch').classList.toggle('on',m==='isoch');
  document.getElementById('bIsob').classList.toggle('on',m==='isob');updateStats();}
function resetAll(){setMode('isoth');setT(300);setV(14);setN(1.5);}
const STEPS=[
 {zh:'分子撞壁:压强是撞出来的账',en:'Molecules hit the walls: pressure is a collision bill',act(){setMode('isoth');setT(300);setV(14);setN(1.5);}},
 {zh:'定温压缩:撞得更频,PV 不变',en:'Isothermal squeeze: hits more often, PV stays put',act(){setMode('isoth');setT(300);setN(1.5);setV(20);scriptV(20,8,7);}},
 {zh:'定容加热:撞得更狠,P∝T',en:'Constant volume: hits ever harder, P \u221D T',act(){setMode('isoch');setV(12);setN(1.5);setT(200);scriptT(200,800,7);}},
 {zh:'定压加热:活塞让路,V∝T',en:'Constant pressure: the piston yields, V \u221D T',act(){setMode('isob');setN(1.5);setT(200);setV(7.2);scriptT(200,800,8);}},
 {zh:'汇总:PV=nRT,恒量现身',en:'Put together: PV = nRT, the constant appears',act(){setMode('isoth');setT(300);setN(1.5);setV(12);scriptV(12,17,5);}},
 {zh:'真实气体:压得太狠,账目出错',en:'Real gas: squeeze too hard and the ledger bends',act(){setMode('isoth');setT(300);setN(2);setV(12);scriptV(12,4,6);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}
function updateStats(){
  const pEl=document.getElementById('stP');
  pEl.innerHTML=Pshow.toFixed(0)+'<small> kPa</small>';pEl.className='v '+(Pshow>1200?'warn':'');
  document.getElementById('stV').innerHTML=V.toFixed(1)+'<small> L</small>';
  const tEl=document.getElementById('stT');
  tEl.innerHTML=Tg.toFixed(0)+'<small> K</small>';tEl.className='v '+(Tg>850?'warn':'');
  const kEl=document.getElementById('stK');
  kEl.textContent=Kdisp.toFixed(2);
  kEl.className='v '+((Kdisp>9.1||Kdisp<7.7)?'warn':((Kdisp>8.1&&Kdisp<8.55)?'ok':''));
}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bIsoth').addEventListener('click',()=>setMode('isoth'));
document.getElementById('bIsoch').addEventListener('click',()=>setMode('isoch'));
document.getElementById('bIsob').addEventListener('click',()=>setMode('isob'));
document.getElementById('bReset').addEventListener('click',resetAll);
document.getElementById('sT').addEventListener('input',e=>setT(+e.target.value));
document.getElementById('sV').addEventListener('input',e=>{
  if(mode==='isob'){auto=null;V=clamp(+e.target.value,4,30);Plock=Math.max(50,n*Rg*Tg/Math.max(V,0.5));syncV();updateStats();}
  else setV(+e.target.value);});
document.getElementById('sN').addEventListener('input',e=>setN(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglTrail').addEventListener('change',e=>{trailsOn=e.target.checked;});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 自动演示脚本(点步骤重放;拖滑杆即取消) */
  if(auto&&dts>0){auto.t+=dts;const k=clamp(auto.t/auto.dur,0,1),e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    if(auto.v1!==auto.v0){V=auto.v0+(auto.v1-auto.v0)*e;syncV();}
    if(auto.t1!==auto.t0){Tg=auto.t0+(auto.t1-auto.t0)*e;syncT();}
    if(auto.t>=auto.dur)auto=null;}
  /* 定压:活塞自动让路,维持 P=Plock */
  if(mode==='isob'){const Vt=clamp(n*Rg*Tg/Plock,4,30);V+=(Vt-V)*Math.min(1,dts*1.4);syncV();}
  const H=HfromV(V),hiY=0.5+H-0.09;
  piston.position.y=0.5+H+0.08;
  pistLbl.position.set(1.5,piston.position.y+0.35,0);
  /* 分子运动 + 碰撞统计(压强的来历) */
  imp=0;hits=0;
  const sTgt=2.6*Math.sqrt(Tg/300),nB=nBalls();
  for(let i=0;i<NM;i++){const p=mols[i];
    if(i>=nB){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);mol.setMatrixAt(i,m4);continue;}
    if(dts===0)continue;
    if(p.y<-5)seedMol(i);
    p.s+=(sTgt-p.s)*Math.min(1,dts*1.5);
    p.x+=p.dx*p.s*dts;p.y+=p.dy*p.s*dts;p.z+=p.dz*p.s*dts;
    const rr=Math.hypot(p.x,p.z);
    if(rr>R){const nx=p.x/rr,nz=p.z/rr,vn=p.dx*nx+p.dz*nz;
      imp+=2*p.s*Math.abs(vn);hits++;if(Math.abs(vn)>0.75)p.heat=1;
      p.dx-=2*vn*nx;p.dz-=2*vn*nz;p.x=nx*R;p.z=nz*R;}
    if(p.y<LOB&&p.dy<0){imp+=2*p.s*Math.abs(p.dy);hits++;if(-p.dy>0.75)p.heat=1;p.dy=-p.dy;p.y=LOB;}
    if(p.y>hiY&&p.dy>0){imp+=2*p.s*p.dy;hits++;if(p.dy>0.75)p.heat=1;p.dy=-p.dy;p.y=hiY;}
    p.heat*=Math.exp(-3*dts);
    col.setRGB(0.62+0.38*p.heat,0.72-0.3*p.heat,0.85-0.43*p.heat);
    mol.setColorAt(i,col);
    m4.makeScale(1,1,1);m4.setPosition(p.x,p.y,p.z);mol.setMatrixAt(i,m4);
    if(trailsOn){const j=i*6;trailPos[j]=p.x;trailPos[j+1]=p.y;trailPos[j+2]=p.z;
      trailPos[j+3]=p.x-p.dx*p.s*0.1;trailPos[j+4]=p.y-p.dy*p.s*0.1;trailPos[j+5]=p.z-p.dz*p.s*0.1;}
  }
  mol.instanceMatrix.needsUpdate=true;
  if(mol.instanceColor)mol.instanceColor.needsUpdate=true;
  trails.visible=trailsOn;
  if(trailsOn&&dts>0)trails.geometry.attributes.position.needsUpdate=true;
  /* 压强=动量流统计 ÷ 理想期望;比值平滑后修正读数,防抖 */
  if(dts>0&&dt>1e-4){
    pExpS=nB*sTgt*sTgt/(3*Math.PI*R*R*Math.max(H,0.05));
    pSm+=(imp/dt-pSm)*clamp(dt*4,0,1);measured=true;
    hr+=(hits/dt-hr)*clamp(dt*2,0,1);
  }
  const r=measured&&pExpS>1e-6?clamp(pSm/pExpS,0.9,1.1):1;
  Pshow=clamp(n*Rg*Tg/Math.max(V-n*bEx,0.4)*r,0,2500);
  Kdisp=8.314*V/Math.max(V-n*bEx,0.3);
  /* 表盘与温度计 */
  needle.rotation.z=2.1-clamp(Math.sqrt(Pshow)/42,0,1)*4.2;
  const kT=clamp((Tg-150)/750,0,1);mercury.scale.y=0.08+0.92*kT;mercury.position.y=1.35+0.8*mercury.scale.y;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const rl of labelReg){rl.o.visible=labelsOn&&rl.vis();if(rl.o.visible)rl.o.element.textContent=rl.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
labelsOn=!(qs.get('labels')==='0');document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}else{applyPhase(0);}
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
