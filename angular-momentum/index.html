<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角动量守恒 · 收臂为什么转得更快</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#f06292;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c2185b;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.l { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.w { border-color: rgba(240,98,146,.9); color: #ffc2d4; }
  .lbl.m { border-color: rgba(127,208,247,.9); color: #bde9ff; }
  .lbl.g { border-color: rgba(67,209,124,.9); color: #c9f3da; font-size: 13px; padding: 6px 11px; }
  .lbl.zero { border-color: rgba(154,167,184,.9); color: var(--text3); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.l { border-color: rgba(178,128,20,.9); color: #9c6f00; }
  :root[data-theme="light"] .lbl.w { border-color: rgba(194,24,91,.9); color: #c2185b; }
  :root[data-theme="light"] .lbl.m { border-color: rgba(12,123,166,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(71,112,31,.9); color: #3f6d1c; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px 12px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.l { color: #ffd166; }
  #stats .v.w { color: #f06292; }
  #lbar { grid-column: 1 / 3; margin-top: 7px; }
  #lbar .cap { font-size: 11.5px; color: var(--text2); margin-bottom: 4px; }
  #lbar .bar { height: 13px; border-radius: 4px; overflow: hidden; background: rgba(128,140,155,.16); margin-bottom: 5px; }
  #lbar .bar i { display: block; height: 100%; transition: width .12s linear; }
  #lbar .bi { background: rgba(127,208,247,.75); }
  #lbar .bw { background: rgba(240,98,146,.75); }
  #lbar .tag { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text3); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #modeRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(240,98,146,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(194,24,91,.10); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(240,98,146,.10); border-color: rgba(240,98,146,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(194,24,91,.08); border-color: rgba(194,24,91,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffb7cd; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 56px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 44px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="角动量守恒：收臂为什么转得更快" data-en="Conservation of Angular Momentum: why tucking in spins you faster">角动量守恒：收臂为什么转得更快</h1>
  <div class="sub" data-zh="I = Σmr²:收臂 → I 变小 → ω 变大,乘积 L = Iω 纹丝不动;KE 还会上升(收臂在做功) · 空格播放/暂停" data-en="I = Σmr²: tuck in → I shrinks → ω grows, while L = Iω never moves; KE even rises (tucking does work) · Space = play/pause">I = Σmr²:收臂 → I 变小 → ω 变大,乘积 L = Iω 纹丝不动;KE 还会上升(收臂在做功) · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="转动惯量 I" data-en="moment of inertia I">转动惯量 I</span><span class="v" id="stI">—</span>
  <span class="k" data-zh="角速度 ω" data-en="angular velocity ω">角速度 ω</span><span class="v w" id="stW">—</span>
  <span class="k" data-zh="角动量 L = Iω" data-en="angular momentum L = Iω">角动量 L = Iω</span><span class="v l" id="stL">—<small> (恒定)</small></span>
  <span class="k" data-zh="动能 KE = ½Iω²" data-en="kinetic energy KE">动能 KE = ½Iω²</span><span class="v" id="stK">—</span>
  <div id="lbar">
    <div class="cap" data-zh="L = I × ω:一个变小,另一个就变大——乘积不变" data-en="L = I × ω: when one shrinks the other grows — the product holds">L = I × ω:一个变小,另一个就变大——乘积不变</div>
    <div class="bar"><i class="bi" id="barI" style="width:100%"></i></div>
    <div class="bar"><i class="bw" id="barW" style="width:33%"></i></div>
    <div class="tag"><span data-zh="I(转动惯量)">I</span><span data-zh="ω(角速度)">ω</span></div>
  </div>
</div>

<div id="panel">
  <div id="modeRow">
    <button id="btnSkater" class="bon on"><b data-zh="滑冰者" data-en="Figure skater">滑冰者</b><i data-zh="收臂 → I↓ → ω↑" data-en="tuck in → I↓ → ω↑">收臂 → I↓ → ω↑</i></button>
    <button id="btnCat" class="bon"><b data-zh="太空猫翻身" data-en="Falling cat">太空猫翻身</b><i data-zh="L = 0 也能转身" data-en="turning with L = 0">L = 0 也能转身</i></button>
    <button id="btnStar" class="bon"><b data-zh="中子星" data-en="Neutron star">中子星</b><i data-zh="坍缩 → 毫秒脉冲星" data-en="collapse → ms pulsar">坍缩 → 毫秒脉冲星</i></button>
  </div>
  <div class="row" id="skaterRow"><label data-zh="收臂" data-en="Tuck">收臂</label><input id="tuck" type="range" min="0" max="100" step="1" value="0"><span class="val" id="tuckVal">0%</span></div>
  <div class="row" id="starRow" style="display:none"><label data-zh="坍缩" data-en="Collapse">坍缩</label><input id="collapse" type="range" min="0" max="100" step="1" value="0"><span class="val" id="colVal">0%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label id="tglAutoWrap"><input id="tglAuto" type="checkbox" checked> <span data-zh="自动收展" data-en="auto tuck">自动收展</span></label>
    <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../orbital-mechanics/" data-zh="开普勒第二定律 = 同一条守恒律" data-en="Kepler's 2nd law = the same conservation law">开普勒第二定律 = 同一条守恒律</a>
    <a href="../gyroscopic-precession/" data-zh="角动量的方向也守恒(陀螺)" data-en="its direction is conserved too (gyro)">角动量的方向也守恒(陀螺)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
let mode = ['cat', 'star'].includes(qs.get('mode')) ? qs.get('mode') : 'skater';

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.ring.color.set(THEME === 'light' ? 0x9aa7b8 : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('角动量守恒 · 收臂为什么转得更快', 'Angular Momentum · Why Tucking Spins You Faster');
  for (const r of labelRegistry) r.o.element.textContent = L(r.zh, r.en);
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.4;
controls.maxDistance = 40;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  body: mat(0xf06292, { roughness: 0.5 }),
  skin: mat(0xffd9c4, { roughness: 0.6 }),
  suit: mat(0x2c3340, { roughness: 0.6 }),
  mass: mat(0x7fd0f7, { roughness: 0.35 }),
  metal: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  ring: new THREE.MeshBasicMaterial({ color: 0x39424f, transparent: true, opacity: 0.85 }),
  refRing: new THREE.LineBasicMaterial({ color: 0x9aa7b8, transparent: true, opacity: 0.4 }),
  tuckRing: new THREE.LineBasicMaterial({ color: 0xf06292, transparent: true, opacity: 0.45 }),
  lArrow: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.95 }),
  rLine: new THREE.LineBasicMaterial({ color: 0x7fd0f7, transparent: true, opacity: 0.85 }),
  star: mat(0xcfe4ff, { emissive: 0xbcd8ff, emissiveIntensity: 1.6, roughness: 0.3 }),
  beam: new THREE.MeshBasicMaterial({ color: 0xbcd8ff, transparent: true, opacity: 0.16,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
  leg: mat(0x7a5c48, { roughness: 0.6 }),
  fur: mat(0xd9a066, { roughness: 0.65 }),
};

/* ---------------- 地面与参考圈 ---------------- */
const floor = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 0.22, 48), M.floor);
floor.position.y = -0.11;
scene.add(floor);
function flatRing(radius, material, dashed) {
  if (dashed) {
    const pts = [];
    for (let i = 0; i <= 96; i++) {
      const a = i / 96 * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * radius, 0.006, Math.sin(a) * radius));
    }
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), material);
    scene.add(l);
    return l;
  }
  const l = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.012, 6, 96), material);
  l.rotation.x = Math.PI / 2;
  l.position.y = 0.006;
  scene.add(l);
  return l;
}
flatRing(3.1, M.ring, false);
flatRing(2.4, M.ring, false);
const decorRings = scene.children.filter(o => o.geometry && o.geometry.type === 'TorusGeometry').slice(-2);
const refOut = flatRing(1.15, M.refRing, true);
const refIn = flatRing(0.27, M.tuckRing, true);

/* ---------------- 通用箭头 ---------------- */
function makeArrow(material, r = 0.05) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 10), material);
  shaft.position.y = 0.5;
  g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(r * 2.4, r * 5.5, 12), material);
  tip.position.y = 1 + r * 2.6;
  g.add(tip);
  g.setV = (dir, len) => {
    g.scale.set(1, Math.max(len, 0.001), 1);
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  };
  return g;
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(zh, en, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.textContent = zh;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, zh, en });
  return o;
}

/* ================= 场景 1 · 滑冰者 ================= */
const skater = new THREE.Group();
scene.add(skater);
let armL, armR, lArrowS, rLine, lblR, lblOmega, lblL;
const SH_X = 0.17, ARM_LEN = 0.98, ARM_R = 0.042, MASS_R = 0.12;
function buildSkater() {
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.44, 0.1, 28), M.metal);
  stand.position.y = 0.05;
  skater.add(stand);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.19, 0.78, 6, 18), M.body);
  body.position.y = 0.62;
  skater.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 22, 16), M.skin);
  head.position.y = 1.28;
  skater.add(head);
  for (const sx of [-1, 1]) {
    const shoulder = new THREE.Group();
    shoulder.position.set(sx * SH_X, 1.0, 0);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(ARM_R, ARM_R, ARM_LEN, 12), M.suit);
    arm.rotation.z = -Math.PI / 2;
    arm.position.x = sx * ARM_LEN / 2;
    shoulder.add(arm);
    const dumb = new THREE.Mesh(new THREE.SphereGeometry(MASS_R, 18, 14), M.mass);
    dumb.position.x = sx * ARM_LEN;
    shoulder.add(dumb);
    skater.add(shoulder);
    if (sx < 0) armL = shoulder; else armR = shoulder;
  }
  lArrowS = makeArrow(M.lArrow, 0.05);
  lArrowS.position.y = 0.15;
  skater.add(lArrowS);
  rLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(), new THREE.Vector3(1, 0, 0)]), M.rLine);
  skater.add(rLine);
  lblR = addLabel('r', 'r', new THREE.Vector3(0.6, 1.62, 0), 'm', skater);
  lblOmega = addLabel('ω', 'ω', new THREE.Vector3(0, 1.86, 0), 'w', skater);
  lblL = addLabel('L', 'L', new THREE.Vector3(0, 0.62, 0), 'l', skater);
}
/* 物理:I(u) = Ib + 2m·r(u)²,r = SH_X + ARM_LEN·cos(1.5u) */
const IB = 0.35, MA = 0.325, U_MAX = 1.5, W_OUT = 0.9;
const rOf = u => SH_X + ARM_LEN * Math.cos(U_MAX * clamp(u, 0, 1));
const IOf = u => IB + 2 * MA * rOf(u) ** 2;
const L0 = IOf(0) * W_OUT;
const wOf = u => L0 / IOf(u);
function updateSkater(u, theta) {
  skater.rotation.y = theta;
  armL.rotation.z = U_MAX * u;
  armR.rotation.z = -U_MAX * u;
  const r = rOf(u);
  const p = rLine.geometry.attributes.position;
  p.setXYZ(0, 0, 1.0, 0);
  p.setXYZ(1, r, 1.0, 0);
  p.needsUpdate = true;
  lblR.position.set(r / 2, 1.12, 0);
  lArrowS.setV(new THREE.Vector3(0, 1, 0), 0.95);
  lblOmega.element.textContent = `ω = ${wOf(u).toFixed(2)} rad/s`;
  lblL.element.textContent = `L = ${L0.toFixed(2)} kg·m²/s`;
  refIn.scale.setScalar(Math.max(r, 0.02) / 0.27);
}

/* ================= 场景 2 · 太空猫 ================= */
const cat = new THREE.Group();
scene.add(cat);
const catFront = new THREE.Group(), catRear = new THREE.Group();
cat.add(catFront); cat.add(catRear);
const legFL = [], legFR = [], legRL = [], legRR = [];
let lblLf, lblLr, lblZero;
function catLeg(len, radius, list, x, z) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 0.85, len, 10), M.leg);
  m.position.y = -len / 2;
  g.add(m);
  const paw = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.4, 12, 10), M.fur);
  paw.position.y = -len;
  g.add(paw);
  g.position.set(x, -0.08, z);
  (list).push(g);
  return g;
}
function buildCat() {
  const torsoF = new THREE.Mesh(new THREE.CapsuleGeometry(0.21, 0.52, 6, 16), M.fur);
  torsoF.rotation.z = Math.PI / 2;
  torsoF.position.x = 0.34;
  catFront.add(torsoF);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 20, 14), M.fur);
  head.position.x = 0.78;
  catFront.add(head);
  catLeg(0.34, 0.055, legFL, 0.42, 0.19);
  catLeg(0.34, 0.055, legFR, 0.42, -0.19);
  catFront.add(legFL[0]); catFront.add(legFR[0]);
  const torsoR = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.5, 6, 16), M.fur);
  torsoR.rotation.z = Math.PI / 2;
  torsoR.position.x = -0.33;
  catRear.add(torsoR);
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.02, 0.6, 10), M.fur);
  tail.rotation.z = Math.PI / 2 + 0.55;
  tail.position.set(-0.76, 0.08, 0);
  catRear.add(tail);
  catLeg(0.36, 0.055, legRL, -0.42, 0.19);
  catLeg(0.36, 0.055, legRR, -0.42, -0.19);
  catRear.add(legRL[0]); catRear.add(legRR[0]);
  lblLf = addLabel('L₁ = +0', 'L₁ = +0', new THREE.Vector3(0.55, 0.72, 0), 'w', catFront);
  lblLr = addLabel('L₂ = −0', 'L₂ = −0', new THREE.Vector3(-0.55, 0.72, 0), 'm', catRear);
  lblZero = addLabel('ΣL = 0(恒定)', 'ΣL = 0 (constant)', new THREE.Vector3(0, 1.5, 0), 'zero', cat);
}
/* 一个周期 = 一次完整翻身(纯 t 的函数) */
const catFall = t => 1.25 - 2.7 * t;
const catArch = t => 0.32 * ss(0, 0.08, t) * (1 - ss(0.84, 0.96, t));
const catTuckF = t => ss(0.04, 0.12, t) * (1 - ss(0.42, 0.5, t));
const catTuckR = t => ss(0.44, 0.52, t) * (1 - ss(0.8, 0.88, t));
const catThF = t => (200 * ss(0.1, 0.42, t) - 24 * ss(0.5, 0.82, t)) * Math.PI / 180;
const catThR = t => (-32 * ss(0.1, 0.42, t) - 150 * ss(0.5, 0.82, t)) * Math.PI / 180;
function setLegTuck(legs, k) {
  for (const g of legs) g.rotation.x = k * 1.2;
}
function updateCat(t) {
  cat.position.y = catFall(t);
  catFront.rotation.x = catThF(t);
  catRear.rotation.x = catThR(t);
  cat.rotation.x = catArch(t);
  setLegTuck(legFL.concat(legFR), catTuckF(t));
  setLegTuck(legRL.concat(legRR), catTuckR(t));
  const e = 0.002;
  const wf = (catThF(Math.min(t + e, 1)) - catThF(Math.max(t - e, 0))) / (2 * e) / 11;
  const p = Math.abs(wf) * 2.6;
  lblLf.element.textContent = `L₁ = +${p.toFixed(2)}`;
  lblLr.element.textContent = `L₂ = −${p.toFixed(2)}`;
}

/* ================= 场景 3 · 中子星 ================= */
const star = new THREE.Group();
scene.add(star);
let starBall, beamGrp, starAxis, lblRad, lblPer, lblPulse;
function buildStar() {
  starAxis = new THREE.Group();
  starAxis.rotation.z = 0.42;
  star.add(starAxis);
  starBall = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), M.star);
  starAxis.add(starBall);
  const pt = new THREE.PointLight(0xbcd8ff, 40, 30, 1.5);
  starAxis.add(pt);
  beamGrp = new THREE.Group();
  starAxis.add(beamGrp);
  const beamA = new THREE.Mesh(new THREE.ConeGeometry(0.34, 4.6, 24, 1, true), M.beam);
  beamA.position.y = 2.3;
  beamGrp.add(beamA);
  const beamB = beamA.clone();
  beamB.rotation.z = Math.PI;
  beamB.position.y = -2.3;
  beamGrp.add(beamB);
  lblRad = addLabel('R', 'R', new THREE.Vector3(0, -1.9, 0), 'm', star);
  lblPer = addLabel('T', 'T', new THREE.Vector3(0, 2.7, 0), 'w', star);
  lblPulse = addLabel('脉冲星:磁轴≠自转轴,灯塔每扫过地球一次闪一下',
    'Pulsar: spin axis ≠ magnetic axis — one flash per sweep across Earth',
    new THREE.Vector3(0, -3.2, 0), 'zero', star);
}
/* R0=7×10⁵ km,T0=25 天 → Rmin=12 km,T≈0.9 ms(视觉比例示意) */
const R0_KM = 7e5, RMIN_KM = 12, T0_DAYS = 25;
const ROf = c => lerp(1, 0.16, c);
const realR = c => lerp(R0_KM, RMIN_KM, c);
const realT = c => T0_DAYS * 86400 * (realR(c) / R0_KM) ** 2;
function fmtT(s) {
  if (s > 7200) return (s / 86400).toFixed(1) + ' 天';
  if (s > 60) return (s / 60).toFixed(1) + ' 分';
  if (s > 0.01) return s.toFixed(2) + ' s';
  return (s * 1000).toFixed(1) + ' ms';
}
function updateStar(c, theta) {
  const R = ROf(c);
  starBall.scale.setScalar(Math.max(R, 0.02));
  beamGrp.scale.setScalar(0.3 + 0.7 * Math.max(R, 0.02));
  starAxis.rotation.y = theta;
  M.beam.opacity = 0.04 + 0.26 * c;
  const rr = realR(c);
  lblRad.element.textContent = `R = ${rr >= 1000 ? (rr / 1000).toFixed(0) + '×10³ km' : rr.toFixed(0) + ' km'}`;
  lblPer.element.textContent = `自转周期 T = ${fmtT(realT(c))}`;
  lblPulse.element.style.opacity = c > 0.55 ? 1 : 0;
}

/* ================= 模式与讲解 ================= */
const STEPS = {

      act: () => setTuck(0) },
    { b: '收臂:I 变小', be: 'Tucking: I shrinks',
      d: '质量块向轴靠拢,mr² 急剧缩小——转动惯量 I 下降。',
      de: 'The masses move toward the axis; mr² shrinks sharply and so does I.',
      act: () => setTuck(0.6) },
    { b: 'L = Iω 守恒 → ω 暴涨', be: 'L = Iω conserved → ω soars',

    { b: '动能从哪来?', be: 'Where does the KE come from?',

      act: () => setTuck(0.92) },
    { b: '同一条定律', be: 'The same law everywhere',
      d: '开普勒第二定律(近日点飞驰)、跳水团身、中子星坍缩——全是「无外力矩 → L 不变」。切到中子星看极端版。',
      de: "Kepler's 2nd law (fast at perihelion), the diver's tuck, collapsing neutron stars — all one rule. Try the star tab for the extreme.",
      act: () => setTuck(0.3) },
  ],
  cat: [
    { b: '自由落体:L = 0', be: 'Free fall: L = 0',
      d: '下落中没有任何外力矩——总角动量必须始终为零,猫不能「凭空」获得旋转。',

    { b: '前半蜷起:转得快', be: 'Tuck the front: it spins fast',

      de: 'Front legs tuck → small I for the front half, so a twist spins it quickly; the extended rear half barely counter-rotates.',

      d: '前后交换——后半身快速补完剩下的角度,前半身只被带回去一点。两段始终一正一负,L 严格为零。',
      de: 'Now the rear half spins fast to finish the turn while the front half counter-rotates a little. One plus, one minus — ΣL stays zero.',
      act: () => { tCat = 0.66; } },
    { b: '伸腿落地', be: 'Extend and land',
      d: '四腿伸开、四脚朝下。真实猫还会弯腰甩尾微调——核心就是这两步「惯性换挡」。',
      de: 'Legs extend, feet down. Real cats also arch and flick their tails — but the core trick is this two-step inertia gear-shift.',
      act: () => { tCat = 0.93; } },
  ],
  star: [
    { b: '坍缩之前:普通恒星核', be: 'Before: an ordinary core',
      d: '铁核约 7×10⁵ km,自转一圈 25 天——慢吞吞。',
      de: 'An iron core ~7×10⁵ km across, one turn per 25 days — lazy.',
      act: () => setCollapse(0) },
    { b: '引力坍缩:半径掉 4 个数量级', be: 'Collapse: radius drops ×40,000',
      d: '核燃料耗尽,引力碾压一切。R 缩小 4 万倍,I ∝ MR² 随之暴跌。',
      de: 'Fuel gone, gravity wins. R falls 40,000×, and I ∝ MR² collapses with it.',
      act: () => setCollapse(0.55) },
    { b: 'L 守恒 → 毫秒脉冲星', be: 'L conserved → millisecond pulsar',
      d: 'I 暴跌,ω 暴涨:25 天变成约 1 毫秒一圈——每秒几百圈,宇宙中最精密的「钟」。',
      de: 'I crashes, ω soars: 25 days become ~1 ms per turn — hundreds of turns a second, the most precise clocks in the universe.',
      act: () => setCollapse(0.97) },
    { b: '灯塔效应', be: 'The lighthouse effect',
      d: '磁轴与自转轴不重合,射电束随自转扫过宇宙——地球被扫到时,我们收到「脉冲」。',
      de: 'The magnetic axis is tilted, so the radio beam sweeps around — every sweep across Earth is one received "pulse".',
      act: () => setCollapse(1) },
  ],
};
const stepBuckets = {
  skater: u => (u <= 0.2 ? 0 : u <= 0.5 ? 1 : u <= 0.8 ? 2 : u <= 0.95 ? 3 : 4),
  cat: t => (t < 0.12 ? 0 : t < 0.44 ? 1 : t < 0.84 ? 2 : 3),
  star: c => (c < 0.3 ? 0 : c < 0.85 ? 1 : c < 0.99 ? 2 : 3),
};
const CAM = {
  skater: { pos: [4.6, 3.2, 6.2], tgt: [0, 1.55, 0] },
  cat: { pos: [4.2, 1.4, 5.6], tgt: [0, 0.2, 0] },
  star: { pos: [3.2, 2.0, 9.2], tgt: [0, 0, 0] },
};

/* ================= UI / 状态 ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.1, 3);
let tuck = clamp(qsFloat('tuck', 0) / 100, 0, 1);
let tuckEase = tuck;
let autoTuck = qsBool('auto', true);
let collapse = clamp(qsFloat('collapse', 0) / 100, 0, 1);
let tCat = 0;
let thetaS = 0, thetaStar = 0;
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elSteps = document.getElementById('steps');
const elTuck = document.getElementById('tuck');
const elTuckVal = document.getElementById('tuckVal');
const elCol = document.getElementById('collapse');
const elColVal = document.getElementById('colVal');
const tglLabels = document.getElementById('tglLabels');
const tglAuto = document.getElementById('tglAuto');
const tglRotate = document.getElementById('tglRotate');
const stI = document.getElementById('stI'), stW = document.getElementById('stW'),
  stL = document.getElementById('stL'), stK = document.getElementById('stK');
const barI = document.getElementById('barI'), barW = document.getElementById('barW');

function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function buildSteps() {
  elSteps.innerHTML = '';
  STEPS[mode].forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    elSteps.appendChild(li);
  });
}
function setTuck(v) {
  tuck = clamp(v, 0, 1);
  autoTuck = false;
  tglAuto.checked = false;
  elTuck.value = Math.round(tuck * 100);
  elTuckVal.textContent = Math.round(tuck * 100) + '%';
}
function setCollapse(c) {
  collapse = clamp(c, 0, 1);
  elCol.value = Math.round(collapse * 100);
  elColVal.textContent = Math.round(collapse * 100) + '%';
}
function setMode(m) {
  mode = m;
  document.getElementById('btnSkater').classList.toggle('on', m === 'skater');
  document.getElementById('btnCat').classList.toggle('on', m === 'cat');
  document.getElementById('btnStar').classList.toggle('on', m === 'star');
  skater.visible = m === 'skater';
  cat.visible = m === 'cat';
  star.visible = m === 'star';
  floor.visible = m !== 'star';
  for (const r of decorRings) r.visible = m !== 'star';
  refOut.visible = refIn.visible = (m === 'skater');
  document.getElementById('skaterRow').style.display = m === 'skater' ? '' : 'none';
  document.getElementById('starRow').style.display = m === 'star' ? '' : 'none';
  document.getElementById('tglAutoWrap').style.display = m === 'skater' ? '' : 'none';
  lblPulse.element.style.opacity = 0;
  camera.position.set(...CAM[m].pos);
  controls.target.set(...CAM[m].tgt);
  buildSteps();
}
document.getElementById('btnSkater').addEventListener('click', () => setMode('skater'));
document.getElementById('btnCat').addEventListener('click', () => setMode('cat'));
document.getElementById('btnStar').addEventListener('click', () => setMode('star'));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elTuck.addEventListener('input', () => setTuck(parseInt(elTuck.value, 10) / 100));
elCol.addEventListener('input', () => setCollapse(parseInt(elCol.value, 10) / 100));
tglAuto.addEventListener('change', () => { autoTuck = tglAuto.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function updateStats() {
  if (mode === 'skater') {
    const u = tuckEase, I = IOf(u), w = wOf(u);
    stI.textContent = I.toFixed(2);
    stW.textContent = w.toFixed(2) + ' rad/s';
    stL.innerHTML = L0.toFixed(2) + '<small> (恒定)</small>';
    stK.innerHTML = '×' + (IOf(0) / I).toFixed(2) + '<small> vs 展臂</small>';
    barI.style.width = clamp(I / IOf(0) * 100, 8, 100).toFixed(1) + '%';
    barW.style.width = clamp(w / wOf(1) * 100, 8, 100).toFixed(1) + '%';
  } else if (mode === 'cat') {
    stI.textContent = '—';
    stW.textContent = '±';
    stL.innerHTML = '0.00<small> (恒定)</small>';
    stK.textContent = '—';
    barI.style.width = '0%'; barW.style.width = '0%';
  } else {
    stI.textContent = (IOf(0) * (ROf(collapse) ** -2)).toExponential(1);
    stW.textContent = (2 * Math.PI / realT(collapse)).toExponential(1) + ' rad/s';
    stL.innerHTML = L0.toFixed(2) + '<small> (恒定)</small>';
    stK.textContent = '×' + Math.round(1 / ROf(collapse) ** 2);
    barI.style.width = '0%'; barW.style.width = '0%';
  }
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    if (mode === 'skater') {
      if (autoTuck) {
        tuck = 0.5 - 0.5 * Math.cos(performance.now() / 1000 * speed * Math.PI * 2 / 9);
        elTuck.value = Math.round(tuck * 100);
        elTuckVal.textContent = Math.round(tuck * 100) + '%';
      }
      tuckEase = lerp(tuckEase, tuck, 1 - Math.exp(-dts * 2.6));
      thetaS += dts * wOf(tuckEase);
    } else if (mode === 'cat') {
      tCat = (tCat + dts / 11) % 1;
    } else {
      thetaStar += dts * Math.min(0.55 / ROf(collapse) ** 2, 11);
    }
  }
  if (mode === 'skater') updateSkater(tuckEase, thetaS);
  else if (mode === 'cat') updateCat(tCat);
  else updateStar(collapse, thetaStar);

  const si = stepBuckets[mode](mode === 'skater' ? tuckEase : mode === 'cat' ? tCat : collapse);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  updateStats();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

buildSkater();
buildCat();
buildStar();
setMode(mode);
applyTheme();
applyLang();
setPlayLabel();
updateStats();
requestAnimationFrame(frame);
</script>
