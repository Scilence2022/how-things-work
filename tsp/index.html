<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="旅行商问题 · 2-opt 解环" data-en="Traveling Salesman · Untangling with 2-opt">旅行商问题 · 2-opt 解环</h1>
  <div class="sub" data-zh="8–16 座发光城市散布在桌面上,推销员要一条经每城恰一次、回到起点的最短回路。暴力要查 n! 条——10 城 3,628,800 条,15 城 1.3 万亿条,直接爆炸;最近邻贪心 O(n²) 秒出解,平均却超最优 ~25%,而且会自己打结;三角不等式保证:两条边一旦交叉,解开必更短——2-opt 拎起红 X、反转回路中段、落下两条不交叉的新边,长度计数器应声变小,阶梯式降到参考最优 5% 以内 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="8–16 glowing cities sit on the table; the salesman needs the shortest loop through each city once and back. Brute force checks n! tours — 10 cities: 3,628,800; 15: 1.3 trillion, an instant explosion; nearest-neighbor runs in O(n²) yet lands ~25% above optimal, tying knots as it goes; the triangle inequality guarantees a crossing is never optimal — 2-opt lifts the red X, reverses the middle of the loop, drops two uncrossed edges, the counter shrinks on the spot, stair-stepping to within ~5% of the reference best · 3D interactive demo · drag to orbit · Space = run/pause">旅行商问题 · 2-opt 解环</div>
</div>

<div id="tools">

<div id="plot">

</div>

<div id="panel">

  </div>

      <label><input id="tglCross" type="checkbox" checked> <span data-zh="交叉高亮" data-en="Crossings">交叉高亮</span></label>
      <label><input id="tglMatrix" type="checkbox"> <span data-zh="距离矩阵" data-en="Dist matrix">距离矩阵</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../shortest-path/" data-zh="最短路径:Dijkstra" data-en="shortest-path: Dijkstra">最短路径:Dijkstra</a>
    <a href="../a-star-search/" data-zh="A*:带引导的搜索" data-en="a-star-search: guided search">A*:带引导的搜索</a>

    <a href="../genetic-algorithm/" data-zh="遗传算法:进化出路线" data-en="genetic algorithm: evolve tours">遗传算法:进化出路线</a>

{

    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = k => 1 - Math.pow(1 - k, 3);
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function fact(n0) { let f = 1; for (let k = 2; k <= n0; k++) f *= k; return f; }
function fmtCount(f) { return f < 1e12 ? f.toLocaleString('en-US') : (f / 1e12).toFixed(2); }

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0f1116, 26, 80);
/* 主题相关的共享颜色(applyTheme 统一重设) */
const emitC = new THREE.Color(0x5c7cfa), edgeC = new THREE.Color(0x6f8dff), crossC = new THREE.Color(0xff6b6b),
  greenC = new THREE.Color(0x51cf66), salesC = new THREE.Color(0xffa94d);

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0f1116 : 0xdde5ee);
  scene.fog.color.setHex(dark ? 0x0f1116 : 0xdde5ee);
  scene.fog.near = dark ? 26 : 36;
  scene.fog.far = dark ? 80 : 100;
  groundM.color.setHex(dark ? 0x161a22 : 0xccd6e2);
  rimM.color.setHex(dark ? 0x2c3852 : 0xa3b2c6);
  pillBase.setHex(dark ? 0x3a4358 : 0x8fa0b6);
  capM.color.setHex(dark ? 0xdfe8ff : 0x27408b);
  emitC.setHex(dark ? 0x5c7cfa : 0x3b5bdb);
  edgeC.setHex(dark ? 0x6f8dff : 0x3b5bdb);
  crossC.setHex(dark ? 0xff6b6b : 0xe03131);
  greenC.setHex(dark ? 0x51cf66 : 0x2f9e44);
  salesC.setHex(dark ? 0xffa94d : 0xe8590c);
  xFlashM.color.copy(crossC);
  salesMat.color.copy(salesC);
  salesMat.emissive.copy(salesC);
  salesHaloM.color.copy(salesC);
  for (const c of cityObjs) { c.mat.color.copy(pillBase); c.mat.emissive.copy(emitC); }
  const blend = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
  for (const m of glowMats) { if (m.blending !== blend) { m.blending = blend; m.needsUpdate = true; } }
  haloM.opacity = dark ? 0.16 : 0.22;
  buildGrid(dark);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;

/* ---------------- 几何/算法工具 ---------------- */
const _up = new THREE.Vector3(0, 1, 0), _dir = new THREE.Vector3();
function setSeg(mesh, ax, ay, az, bx, by, bz) {
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const len = Math.hypot(dx, dy, dz);
  if (len < 1e-5) { mesh.visible = false; return; }
  mesh.position.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
  mesh.scale.set(1, len, 1);
  _dir.set(dx / len, dy / len, dz / len);
  mesh.quaternion.setFromUnitVectors(_up, _dir);
}
function segIntersect(p1, p2, p3, p4) {                  // 线段真交点(不含端点触碰)
  const d1x = p2.x - p1.x, d1z = p2.z - p1.z, d2x = p4.x - p3.x, d2z = p4.z - p3.z;
  const den = d1x * d2z - d1z * d2x;
  if (Math.abs(den) < 1e-12) return null;
  const t = ((p3.x - p1.x) * d2z - (p3.z - p1.z) * d2x) / den;
  const u = ((p3.x - p1.x) * d1z - (p3.z - p1.z) * d1x) / den;
  if (t > 1e-6 && t < 1 - 1e-6 && u > 1e-6 && u < 1 - 1e-6)
    return { x: p1.x + t * d1x, z: p1.z + t * d1z };
  return null;
}
function calcLen() {
  const m = tour.length;
  let s = 0;
  for (let k = 0; k < m; k++) s += D[tour[k]][tour[(k + 1) % m]];
  return s;
}
function recomputeCrossings() {
  crossSet = new Set(); crossCount = 0; crossPt = null; crossIJ = null;
  const m = tour.length;
  if (tourOpen || m < 4) return;
  for (let i = 0; i < m; i++) for (let j = i + 2; j < m; j++) {
    if (i === 0 && j === m - 1) continue;
    const a = cities0(tour[i]), b = cities0(tour[(i + 1) % m]), c = cities0(tour[j]), d = cities0(tour[(j + 1) % m]);
    const ip = segIntersect(a, b, c, d);
    if (ip) {
      crossCount++;
      crossSet.add(i); crossSet.add(j);
      if (!crossPt) { crossPt = new THREE.Vector3(ip.x, ROUTE_Y, ip.z); crossIJ = [i, j]; }
    }
  }
}
function cities0(i) { return cityObjs[i]; }
function greedyPath(start) {
  const n0 = citiesObjsLen(), used = new Array(n0).fill(false);
  const path = [start]; used[start] = true;
  let cur = start;
  for (let s = 1; s < n0; s++) {
    let bi = -1, bd = Infinity;
    for (let q = 0; q < n0; q++) if (!used[q] && D[cur][q] < bd) { bd = D[cur][q]; bi = q; }
    used[bi] = true; path.push(bi); cur = bi;
  }
  return path;
}
function citiesObjsLen() { return cityObjs.length; }
function twoOptLen(t) {                                  // 完整 2-opt 收敛后的长度(多起点参考用)
  const m = t.length;
  let imp = true;
  while (imp) {
    imp = false;
    for (let i = 0; i < m - 1; i++) for (let j = i + 2; j < m; j++) {
      if (i === 0 && j === m - 1) continue;
      const a = t[i], b = t[i + 1], c = t[j], d = t[(j + 1) % m];
      if (D[a][c] + D[b][d] - D[a][b] - D[c][d] < -1e-7) {
        const seg = t.slice(i + 1, j + 1).reverse();
        for (let q = 0; q < seg.length; q++) t[i + 1 + q] = seg[q];
        imp = true;
      }
    }
  }
  let s = 0;
  for (let k = 0; k < m; k++) s += D[t[k]][t[(k + 1) % m]];
  return s;
}
function calcBest() {                                    // 参考最优:每个起点贪心 + 40 次随机重启,全跑 2-opt 取最小
  let best = Infinity;
  for (let s = 0; s < n; s++) best = Math.min(best, twoOptLen(greedyPath(s).slice()));
  for (let r = 0; r < 40; r++) best = Math.min(best, twoOptLen(shuffle([...Array(n).keys()], Math.random)));
  return best;
}
function scanMoves() {                                   // 所有 Δ<0 的 2-opt 候选,标记是否为交叉对
  const mvs = [], m = tour.length;
  if (tourOpen || m < 4) return mvs;
  for (let i = 0; i < m - 1; i++) for (let j = i + 2; j < m; j++) {
    if (i === 0 && j === m - 1) continue;
    const a = tour[i], b = tour[i + 1], c = tour[j], d = tour[(j + 1) % m];
    const delta = D[a][c] + D[b][d] - D[a][b] - D[c][d];
    if (delta < -1e-7) {
      const ip = segIntersect(cityObjs[a], cityObjs[b], cityObjs[c], cityObjs[d]);
      mvs.push({
        i, j, delta, cross: !!ip,
        px: ip ? ip.x : (cityObjs[a].x + cityObjs[c].x) / 2,
        pz: ip ? ip.z : (cityObjs[a].z + cityObjs[c].z) / 2
      });
    }
  }
  return mvs;
}
function bestMove() {
  const mvs = scanMoves();
  if (!mvs.length) return null;
  const cr = mvs.filter(v => v.cross);
  const pool = cr.length ? cr : mvs;                     // 优先解交叉:那是招牌瞬间
  let mv = pool[0];
  for (const v of pool) if (v.delta < mv.delta) mv = v;
  return mv;
}

/* ---------------- 动画引擎(补间) ---------------- */
const tweens = [];
function tween(dur, fn, done) { tweens.push({ t: 0, dur: Math.max(0.016, dur), fn, done }); }
function stepTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const k = clamp(tw.t / tw.dur, 0, 1);
    tw.fn(k);
    if (k >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
  }
}
function hideTemps() { newA.visible = false; newB.visible = false; xFlash.visible = false; }
function growNew(msh, P, Q, k) {
  msh.visible = true;
  setSeg(msh, P.x, ROUTE_Y, P.z, lerp(P.x, Q.x, k), ROUTE_Y, lerp(P.z, Q.z, k));
  msh.material.opacity = 0.95;
}

/* ---------------- 三种算法 ---------------- */
function scatter(newSeed) {                              // 重新撒点:确定性种子 → 城市布局
  tweens.length = 0; busy = false;
  hideTemps();
  seed = newSeed;
  const rng = mulberry32((seed * 2654435761) % 4294967296);
  const pts = [];
  let guard = 0;
  while (pts.length < n && guard++ < 8000) {
    const a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * 5.5;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (pts.every(p => Math.hypot(p.x - x, p.z - z) > 1.5)) pts.push({ x, z });
  }
  while (pts.length < n) {
    const a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * 5.5;
    pts.push({ x: Math.cos(a) * r, z: Math.sin(a) * r });
  }
  buildCities(pts);
  D = pts.map((p, i) => pts.map((q, j) => Math.hypot(p.x - q.x, p.z - q.z)));
  cityState = new Array(n).fill('norm');
  tour = shuffle([...Array(n).keys()], rng);
  tourOpen = false;
  tourLen = calcLen(); lenRand = tourLen;
  algo = '随机'; optSteps = 0; lastDelta = null; greedyDone = false; greedyLen = NaN; tourS = 0;
  seriesRand = [[0, lenRand]]; seriesGreedy = []; seriesOpt = [];
  bestKnown = calcBest();
  eop.fill(1); lift.fill(0); flashK = 1; flashIdx = [];
  recomputeCrossings();
  buildMatrix();
  syncAll();
}
function runRandom(cb) {                                 // 随机基线:洗牌连环
  if (busy) return;
  busy = true;
  algo = '随机'; greedyDone = false; greedyLen = NaN; optSteps = 0; lastDelta = null;
  tour = shuffle([...Array(n).keys()], Math.random);
  tourOpen = false; tourS = 0;
  tourLen = calcLen(); lenRand = tourLen;
  seriesRand = [[0, lenRand]]; seriesGreedy = []; seriesOpt = [];
  recomputeCrossings();
  eop.fill(0);
  notify(`随机回路:L=${lenRand.toFixed(1)},交叉 ${crossCount} 处 —— 这是基线`, `random tour: L=${lenRand.toFixed(1)}, ${crossCount} crossings — the baseline`);
  tween(0.45 / SPD(), k => { eop.fill(ease(k)); }, () => { eop.fill(1); busy = false; syncAll(); if (cb) cb(); });
}
function runGreedy(cb) {                                 // 最近邻贪心:绿边逐条生长
  if (busy) return;
  busy = true;
  algo = '最近邻贪心'; greedyDone = false;
  const used = new Array(n).fill(false);
  let cur = 0; used[0] = true;
  tour = [0]; tourOpen = true; optSteps = 0; lastDelta = null; tourS = 0;
  seriesGreedy = []; seriesOpt = [];
  cityState = new Array(n).fill('dim'); cityState[0] = 'hot';
  recomputeCrossings();
  const stepNext = () => {
    let bi = -1, bd = Infinity;
    for (let q = 0; q < n; q++) if (!used[q] && D[cur][q] < bd) { bd = D[cur][q]; bi = q; }
    used[bi] = true;
    growNew(newA, cityObjs[cur], cityObjs[bi], 0);
    tween(0.16 / SPD(), k => growNew(newA, cityObjs[cur], cityObjs[bi], ease(k)), () => {
      tour.push(bi);
      cityState[cur] = 'norm'; cur = bi; cityState[cur] = 'hot';
      newA.visible = false;

      growNew(newA, cityObjs[cur], cityObjs[0], 0);      // 收尾:回到起点闭合成环
      tween(0.16 / SPD(), k => growNew(newA, cityObjs[cur], cityObjs[0], ease(k)), () => {

        newA.visible = false;

        seriesGreedy = [[0, lenRand], [1, greedyLen]];
        seriesOpt = [[1, greedyLen]];
        recomputeCrossings();
        const over = ((greedyLen / bestKnown - 1) * 100).toFixed(0);
        notify(`贪心完成:L=${greedyLen.toFixed(1)},超参考最优 ${over}%,交叉 ${crossCount} 处 —— 该解环了`, `greedy done: L=${greedyLen.toFixed(1)}, +${over}% over best, ${crossCount} crossings — time to untangle`);
        busy = false;

    });
  };

}
function animateOpt(mv, fast, cb) {                      // 招牌瞬间:拎起 X → 反转中段 → 新边落下
  busy = true;
  const { i, j, delta } = mv, m = tour.length;
  const A = cityObjs[tour[i]], B = cityObjs[tour[i + 1]], C = cityObjs[tour[j]], Dc = cityObjs[tour[(j + 1) % m]];
  const spd = fast ? 2.8 : 1;
  const prevLen = tourLen;
  lastDelta = delta;
  const ip = segIntersect(A, B, C, Dc);
  if (ip) {
    xFlash.position.set(ip.x, ROUTE_Y, ip.z);
    xFlash.visible = true;
    xFlash.scale.setScalar(0.3);
    xFlashM.opacity = 0.9;
  }
  /* 相位1:两条边被拎起,中段整体抬起,交点闪红 */
  tween(0.34 / spd, k => {
    const e = ease(k);
    lift[i] = 2.3 * e; lift[j] = 2.3 * e;
    for (let q = i + 1; q < j; q++) lift[q] = 1.05 * e;
    if (ip) xFlash.scale.setScalar(0.3 + 1.6 * e);
  }, () => {
    /* 相位2:旧边升走消隐,两条新边从端点长出 */

    growNew(newB, B, Dc, 0);
    tween(0.38 / spd, k => {
      const e = ease(k);
      growNew(newA, A, C, e);
      growNew(newB, B, Dc, e);
      lift[i] = 2.3 + 1.2 * e; lift[j] = 2.3 + 1.2 * e;
      eop[i] = 1 - e; eop[j] = 1 - e;
      if (ip) xFlashM.opacity = 0.9 * (1 - e);
    }, () => {
      /* 应用:回路中段 i+1…j 整体倒序 */
      const seg = tour.slice(i + 1, j + 1).reverse();
      for (let q = 0; q < seg.length; q++) tour[i + 1 + q] = seg[q];
      tourLen = calcLen();
      optSteps++;
      if (!seriesOpt.length) seriesOpt.push([1, prevLen]);
      seriesOpt.push([1 + optSteps, tourLen]);
      recomputeCrossings();
      hideTemps();
      eop.fill(1);
      lift[i] = 0; lift[j] = 0;
      flashIdx = [i, j]; flashK = 0;
      const mids = [];
      for (let q = i + 1; q < j; q++) mids.push([q, lift[q]]);
      notify(`2-opt:Δ=${delta.toFixed(2)} < 0,L ${prevLen.toFixed(1)} → ${tourLen.toFixed(1)}`, `2-opt: Δ=${delta.toFixed(2)} < 0, L ${prevLen.toFixed(1)} → ${tourLen.toFixed(1)}`);
      /* 相位3:中段回落,新边由绿定型为本色 */
      tween(0.26 / spd, k => {

        for (const md of mids) lift[md[0]] = md[1] * (1 - ease(k));

        if (cb) cb();

    });
  });
}
function doOptStep(fast, cb) {
  if (busy) return;
  const mv = bestMove();
  if (!mv) {
    notify('已无 Δ<0 的边对:到达 2-opt 局部最优', 'no Δ<0 move left: 2-opt local optimum reached');
    if (cb) cb();
    return;
  }
  algo = '2-opt';

}
function runOptAll(cb) {                                 // 2-opt 到底:连续解环直到收敛
  if (busy) { notify('动画进行中…', 'animation in progress…'); return; }
  if (!scanMoves().length) {
    notify('已无 Δ<0 边对:已是 2-opt 局部最优', 'no Δ<0 move: already a 2-opt local optimum');
    if (cb) cb();
    return;
  }
  algo = '2-opt';
  let s = 0;
  const step = () => {
    if (!scanMoves().length || s >= 120) {
      const g = greedyDone && tourLen < greedyLen ? `,较贪心缩短 ${((1 - tourLen / greedyLen) * 100).toFixed(1)}%` : '';
      notify(`2-opt 收敛:共 ${s} 步,L=${tourLen.toFixed(1)}${g}`, `2-opt converged: ${s} moves, L=${tourLen.toFixed(1)}${g ? ', −' + ((1 - tourLen / greedyLen) * 100).toFixed(1) + '% vs greedy' : ''}`);
      if (cb) cb();
      return;
    }
    s++;
    doOptStep(true, step);
  };

/* ================= 绘图:L vs 改进步 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const dark = THEME === 'dark';
  const cEdge = dark ? '#6f8dff' : '#3b5bdb';
  const cGreen = dark ? '#51cf66' : '#2f9e44';
  const cGray = dark ? '#8b98a8' : '#6b7a8c';
  const cBest = dark ? '#e9ecef' : '#343e4c';
  let lo = Infinity, hi = -Infinity;
  const push = v => { if (Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); } };
  push(bestKnown); push(lenRand);
  for (const p of seriesOpt) push(p[1]);
  for (const p of seriesGreedy) push(p[1]);
  if (!Number.isFinite(lo)) { lo = 0; hi = 1; }
  const span = Math.max(1e-6, hi - lo);
  lo -= span * 0.1; hi += span * 0.1;
  let xMax = 4;
  for (const p of seriesOpt) xMax = Math.max(xMax, p[0]);
  xMax = Math.max(4, xMax + 1);
  const padL = 46, padR = 48, padT = 12, padB = 24;
  const X = v => padL + (v / xMax) * (W - padL - padR);
  const Y = v => (H - padB) - ((v - lo) / (hi - lo)) * (H - padT - padB);
  const ln = (x0, y0, x1, y1) => { ctx.beginPath(); ctx.moveTo(X(x0), Y(y0)); ctx.lineTo(X(x1), Y(y1)); ctx.stroke(); };
  ctx.font = '11px system-ui';
  /* 轴 */
  ctx.strokeStyle = 'rgba(128,150,170,.3)';
  ctx.lineWidth = 1;
  ln(0, lo, xMax, lo);
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText(L('改进步 →', 'improvement step →'), padL + 4, H - 8);
  if (Number.isFinite(bestKnown)) ctx.fillText(bestKnown.toFixed(0), 8, Y(bestKnown) + 4);
  /* 参考最优(虚线) */
  if (Number.isFinite(bestKnown)) {
    ctx.setLineDash([7, 5]);
    ctx.strokeStyle = cBest;
    ctx.lineWidth = 1.6;
    ln(0, bestKnown, xMax, bestKnown);
    ctx.setLineDash([]);
    ctx.fillStyle = cBest;
    ctx.fillText(L('参考最优', 'best'), W - padR + 6, Y(bestKnown) + 4);
  }
  /* 随机平线 */
  if (Number.isFinite(lenRand)) {
    ctx.strokeStyle = cGray;
    ctx.lineWidth = 2;
    ln(0, lenRand, xMax, lenRand);
    ctx.fillStyle = cGray;
    ctx.fillText(L('随机', 'rand'), W - padR + 6, Y(lenRand) + 4);
  }
  /* 贪心一跃 */
  if (seriesGreedy.length === 2) {
    const g = seriesGreedy[1][1];
    ctx.strokeStyle = cGreen;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(X(0), Y(lenRand));
    ctx.lineTo(X(1), Y(g));
    ctx.lineTo(X(xMax), Y(g));
    ctx.stroke();
    ctx.fillStyle = cGreen;
    ctx.fillText(L('贪心', 'greedy'), W - padR + 6, Y(g) + (Number.isFinite(lenRand) && Math.abs(Y(g) - Y(lenRand)) < 14 ? 16 : 4));
  }
  /* 2-opt 阶梯 */
  if (seriesOpt.length) {
    ctx.strokeStyle = cEdge;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    seriesOpt.forEach((p, i) => i === 0 ? ctx.moveTo(X(p[0]), Y(p[1])) : ctx.lineTo(X(p[0]), Y(p[1])));
    ctx.stroke();
    const last = seriesOpt[seriesOpt.length - 1];
    ctx.fillStyle = cEdge;
    ctx.beginPath();
    ctx.arc(X(last[0]), Y(last[1]), 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillText('2-opt', W - padR + 6, Y(last[1]) - 6);
  }
}

const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;

const _c1 = new THREE.Color();
function drawTour() {
  const m = tour.length;
  const ne = tourOpen ? Math.max(0, m - 1) : m;
  for (let k = 0; k < edges.length; k++) {
    const e = edges[k];
    if (k >= ne || m < 2) { e.mesh.visible = false; continue; }
    const a = cityObjs[tour[k]], b = cityObjs[tour[(k + 1) % m]];
    const y = ROUTE_Y + lift[k];
    setSeg(e.mesh, a.x, y, a.z, b.x, y, b.z);
    e.mesh.visible = true;
    e.mat.opacity = eop[k];
    _c1.copy(crossOn && crossSet.has(k) ? crossC : (tourOpen ? greenC : edgeC));
    if (flashK < 1 && flashIdx.indexOf(k) >= 0) _c1.lerp(greenC, 1 - flashK);
    e.mat.color.copy(_c1);
  }
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  if (notifyT > 0) notifyT -= dt0;
  stepTweens(dt0);                                       // 算法动画不随暂停冻结,便于逐步讲解
  const dt = dt0 * (playing ? 1 : 0);
  simT += dt;
  /* 推销员沿回路巡游 */
  if (playing && !tourOpen && tour.length > 1 && cityObjs.length) {
    tourS = (tourS + dt * 1.6 * SPD()) % tour.length;
    const k = Math.floor(tourS), f = tourS - k;
    const a = cityObjs[tour[k % tour.length]], b = cityObjs[tour[(k + 1) % tour.length]];
    salesMesh.position.set(lerp(a.x, b.x, f), ROUTE_Y + 0.16 + 0.1 * Math.abs(Math.sin(simT * 6)), lerp(a.z, b.z, f));
  }
  /* 城市脉冲:贪心中当前城高亮、未访城变暗 */
  for (let i = 0; i < cityObjs.length; i++) {
    const st = cityState[i] || 'norm';
    cityObjs[i].mat.emissiveIntensity = st === 'hot' ? 1.6 + 0.6 * Math.sin(simT * 8)
      : (st === 'dim' ? 0.18 : 0.75 + 0.2 * Math.sin(simT * 2.2 + i * 1.7));
  }
  haloM.opacity = (THEME === 'dark' ? 0.13 : 0.18) + 0.04 * Math.sin(simT * 2);
  drawTour();
  /* 交叉标签跟随第一个交点 */
  if (crossPt) {
    lblCross.position.set(crossPt.x, 2.75, crossPt.z);
    lblTriangle.position.set(crossPt.x, 1.8, crossPt.z);
  }
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.15) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.15) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
scatter(seed);
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
