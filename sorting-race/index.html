<!DOCTYPE html>

<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);

  }
  :root[data-theme="light"] {
    color-scheme: light;

    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1.3; padding: 5px 10px; border-radius: 10px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); text-align: center; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl b { font-size: 12.5px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }

    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

  #stats .v.o { color: #ffa94d; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 372px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffd9a3; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  <div class="sub" data-zh="冒泡/选择/插入/快排/归并同屏开跑,白色闪=比较、红闪=写入;计数器见分晓:O(n²) 与 O(n log n) 的差距不是常数倍 · 空格播放/暂停" data-en="Bubble/selection/insertion/quick/merge race on the same array; white flash = compare, red = write; the counters settle O(n²) vs O(n log n) · Space = play/pause">冒泡/选择/插入/快排/归并同屏开跑,白色闪=比较、红闪=写入;计数器见分晓:O(n²) 与 O(n log n) 的差距不是常数倍 · 空格播放/暂停</div>

  <span class="k" data-zh="数组规模 n" data-en="array size n">数组规模 n</span><span class="v" id="stN">22</span>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('排序算法竞速', 'Sorting Race');
  for (const r of labelRegistry) r.o.element.innerHTML = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.5, 10.2, 10.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 12, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 4, -6);
scene.add(fill);

/* ---------------- 材质 ---------------- */
const M = {
  floor: new THREE.MeshStandardMaterial({ color: 0x1b212c, roughness: 0.9 }),
  bar: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.45, metalness: 0.05 }),
  lane: new THREE.MeshStandardMaterial({ color: 0x39424f, roughness: 0.7, transparent: true, opacity: 0.5 }),
};

/* ================= 赛道 ================= */
const N = 22;
const HUE = [0xff6b6b, 0xffa94d, 0x69db7c, 0x4dabf7, 0xb197fc];
const BAR_W = 0.082, GAP = 0.004, LANE_W = 2.1, LANE_Z = 2.5, H_MAX = 1.7;
const floor = new THREE.Mesh(new THREE.BoxGeometry(13, 0.2, 13.4), M.floor);
floor.position.y = -0.1;
scene.add(floor);
for (let i = 0; i < 5; i++) {
  const pad = new THREE.Mesh(new THREE.BoxGeometry(LANE_W + 0.3, 0.04, 1.4), M.lane);
  pad.position.set(0, 0.02, (i - 2) * LANE_Z);
  scene.add(pad);
}

/* 柱阵(一个 InstancedMesh,5×n) */
const bars = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), M.bar, 5 * N);
bars.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(bars);
const m4tmp = new THREE.Matrix4();
const cWhite = new THREE.Color(0xffffff), cRed = new THREE.Color(0xff4d4d),
  cDone = new THREE.Color(0x51cf66), cTmp = new THREE.Color(), cBase = new THREE.Color();

/* 标签 */
const labelRegistry = [];
function addLabel(getText, pos, cls = '') {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  o.text = getText;
  scene.add(o);
  labelRegistry.push({ o, text: getText });
  div.innerHTML = getText();
  return o;
}
function refreshLaneLabels() {
  for (const ln of lanes) ln.lbl.element.innerHTML = ln.lbl.text();
}

/* ================= 五个算法(生成器逐步驱动) ================= */
function* bubble(a) {
  for (let end = a.length - 1; end > 0; end--) {
    let sw = false;
    for (let i = 0; i < end; i++) {
      yield { t: 'c', i, j: i + 1 };
      if (a[i] > a[i + 1]) {
        [a[i], a[i + 1]] = [a[i + 1], a[i]];
        sw = true;
        yield { t: 'w', i, j: i + 1 };
      }
    }
    if (!sw) break;
  }
}
function* selection(a) {
  for (let i = 0; i < a.length - 1; i++) {
    let min = i;
    for (let j = i + 1; j < a.length; j++) {
      yield { t: 'c', i: min, j };
      if (a[j] < a[min]) min = j;
    }
    if (min !== i) {
      [a[i], a[min]] = [a[min], a[i]];
      yield { t: 'w', i, j: min };
    }
  }
}
function* insertion(a) {
  for (let i = 1; i < a.length; i++) {
    const key = a[i];
    let j = i - 1;
    while (j >= 0) {
      yield { t: 'c', i: j, j: j + 1 };
      if (a[j] > key) {
        a[j + 1] = a[j];
        yield { t: 'w', i: j + 1, j: -1 };
        j--;
      } else break;
    }
    a[j + 1] = key;
    yield { t: 'w', i: j + 1, j: -1 };
  }
}
function* quick(a, lo, hi) {
  if (lo >= hi) return;
  const p = a[hi];
  let i = lo;
  for (let j = lo; j < hi; j++) {
    yield { t: 'c', i: j, j: hi };
    if (a[j] < p) {
      if (i !== j) {
        [a[i], a[j]] = [a[j], a[i]];
        yield { t: 'w', i, j };
      }
      i++;
    }
  }
  if (i !== hi) {
    [a[i], a[hi]] = [a[hi], a[i]];
    yield { t: 'w', i, j: hi };
  }
  yield* quick(a, lo, i - 1);
  yield* quick(a, i + 1, hi);
}
function* mergeSort(a) {
  const aux = a.slice();
  for (let w = 1; w < a.length; w *= 2) {
    for (let lo = 0; lo + w < a.length; lo += 2 * w) {
      const mid = lo + w, hi = Math.min(lo + 2 * w, a.length);
      let i = lo, j = mid;
      for (let k = lo; k < hi; k++) {
        if (i < mid && j < hi) yield { t: 'c', i, j };
        if (i < mid && (j >= hi || a[i] <= a[j])) aux[k] = a[i++];
        else aux[k] = a[j++];
      }
      for (let k = lo; k < hi; k++) {
        a[k] = aux[k];
        yield { t: 'w', i: k, j: -1 };
      }
    }
  }
}
const ALGO = [
  { key: 'bubble', gen: bubble, zh: '冒泡', en: 'Bubble', o: 'O(n²)' },
  { key: 'selection', gen: selection, zh: '选择', en: 'Selection', o: 'O(n²)' },
  { key: 'insertion', gen: insertion, zh: '插入', en: 'Insertion', o: 'O(n²)' },
  { key: 'quick', gen: a => quick(a, 0, a.length - 1), zh: '快排', en: 'Quick', o: 'O(n log n)' },
  { key: 'merge', gen: mergeSort, zh: '归并', en: 'Merge', o: 'O(n log n)' },
];
const lanes = [];
function newShuffled() {
  const vals = [];
  for (let i = 0; i < N; i++) vals.push((i + 1) / N);
  for (let i = vals.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [vals[i], vals[j]] = [vals[j], vals[i]];
  }
  return vals;
}
function buildLanes() {
  const src = newShuffled();
  for (const ln of lanes) { scene.remove(ln.lbl); }
  lanes.length = 0;
  ALGO.forEach((al, li) => {
    const a = src.slice();
    const lane = {
      al, li, a,
      gen: al.gen(a),
      cmp: 0, writes: 0,
      hi: [-1, -1], hiT: 'c',
      done: false, rank: 0,
      lbl: null,
    };
    lane.lbl = addLabel(
      () => lane.done
        ? `<b style="color:#${HUE[li].toString(16).padStart(6, '0')}">${L(al.zh, al.en)} 🏁${lane.rank}</b><small>${L('比较', 'cmp')} ${lane.cmp} · ${L('写入', 'wr')} ${lane.writes}</small>`
        : `<b style="color:#${HUE[li].toString(16).padStart(6, '0')}">${L(al.zh, al.en)}</b><small>${L('比较', 'cmp')} ${lane.cmp} · ${L('写入', 'wr')} ${lane.writes} · ${al.o}</small>`,
      new THREE.Vector3(0, H_MAX + 0.55, (li - 2) * LANE_Z));
    lanes.push(lane);
  });
  rankNext = 1;
}
let rankNext = 1;
function stepLane(ln) {
  if (ln.done) return;
  const r = ln.gen.next();
  if (r.done) {
    ln.done = true;
    ln.rank = rankNext++;
    ln.hi = [-1, -1];
    return;
  }
  if (r.value.t === 'c') ln.cmp++;
  else ln.writes++;
  ln.hi = [r.value.i, r.value.j];
  ln.hiT = r.value.t;
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '同一起跑线', be: 'Same start',
    d: '五条赛道拿到同一组乱序数(柱高=值)。白色闪=一次比较,红闪=一次写入——算法的成本就记在这两个计数器上。',
    de: 'Five lanes get the same shuffle (bar height = value). White flash = one comparison, red = one write — those two counters are the cost.',
    act: () => { buildLanes(); elPlay.textContent = L('暂停', 'Pause'); playing = true; } },
  { b: 'O(n²) 三兄弟', be: 'The O(n²) trio',
    d: '冒泡两两换到没有逆序;选择每轮扫全表找最小;插入把新牌插进已排前缀——它们都老老实实做 ~n²/2 次比较。',
    de: 'Bubble swaps until no inversions; selection scans for each minimum; insertion slots each card — all honestly doing ~n²/2 comparisons.',
    act: () => { playing = true; elPlay.textContent = L('暂停', 'Pause'); } },
  { b: '分治二人组先撞线', be: 'Divide & conquer finishes first',
    d: '快排按基准一分为二、归并两两有序段合并——每层只摸一遍数据,一共 log n 层:n log n。n=22 时只有 ~95 步量级,对比 ~230。',
    de: 'Quick partitions, merge combines — one pass per level, log n levels: n log n. At n = 22 that is ~95-ish ops versus ~230.',
    act: () => { playing = true; elPlay.textContent = L('暂停', 'Pause'); } },
  { b: '读账本:差距随 n 拉开', be: 'Read the ledger',
    d: '计数器就是复杂度的实证。n 翻倍:平方组 ×4,n·log n 组只 ×2.2——十亿数据面前,这是「算得完」与「算不完」的区别。',
    de: 'The counters are complexity made visible. Double n: the quadratic lanes cost ×4, the n log n lanes only ×2.2 — at a billion items that is feasible vs never.',
    act: () => { playing = true; elPlay.textContent = L('暂停', 'Pause'); } },
];
function stepIndex() {
  const allDone = lanes.every(l => l.done);
  const anyDone = lanes.some(l => l.done);
  if (allDone) return 3;
  if (anyDone) return 2;
  if (lanes[0].cmp > 12) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let stepsPerFrame = Math.round(clamp(qsFloat('speed', 2), 1, 40));
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stN = document.getElementById('stN'), stC = document.getElementById('stC'),
  stW = document.getElementById('stW'), stR = document.getElementById('stR');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpd.value = stepsPerFrame;
elSpdVal.textContent = stepsPerFrame;
elSpd.addEventListener('input', () => { stepsPerFrame = parseInt(elSpd.value, 10); elSpdVal.textContent = elSpd.value; });
document.getElementById('btnRestart').addEventListener('click', () => { buildLanes(); playing = true; setPlayLabel(); });
document.getElementById('btnToEnd').addEventListener('click', () => {
  let guard = 4e5;
  while (lanes.some(l => !l.done) && guard-- > 0) for (const ln of lanes) stepLane(ln);
});
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 柱阵渲染 ================= */
function drawBars() {
  const t = performance.now() / 1000;
  for (let li = 0; li < 5; li++) {
    const ln = lanes[li];
    cBase.setHex(HUE[li]);
    const z0 = (li - 2) * LANE_Z;
    const x0 = -LANE_W / 2 + BAR_W / 2;
    for (let j = 0; j < N; j++) {
      const v = ln.a[j];
      const idx = li * N + j;
      m4tmp.makeScale(BAR_W, Math.max(v * H_MAX, 0.02), BAR_W);
      m4tmp.setPosition(x0 + j * (BAR_W + GAP), Math.max(v * H_MAX, 0.02) / 2, z0);
      bars.setMatrixAt(idx, m4tmp);
      let col;
      const isHi = (j === ln.hi[0] || j === ln.hi[1]) && !ln.done;
      if (isHi) {
        col = ln.hiT === 'w' ? cRed : cWhite;
      } else if (ln.done) {
        col = ln.rank === 1 ? cDone : cTmp.copy(cBase).lerp(cDone, 0.55);
      } else col = cBase;
      bars.setColorAt(idx, col);
    }
  }
  bars.instanceMatrix.needsUpdate = true;
  if (bars.instanceColor) bars.instanceColor.needsUpdate = true;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) {
    for (let s = 0; s < stepsPerFrame; s++) for (const ln of lanes) stepLane(ln);
  }
  drawBars();
  refreshLaneLabels();
  /* 统计 */
  const allDone = lanes.every(l => l.done);
  if (allDone) {
    const champ = lanes.reduce((a, b) => (a.cmp + a.writes <= b.cmp + b.writes ? a : b));
    const worst = lanes.reduce((a, b) => (a.cmp >= b.cmp ? a : b));
    stC.textContent = L(champ.al.zh, champ.al.en);
    stW.textContent = worst.cmp;
    stR.innerHTML = '×' + (worst.cmp / Math.max(champ.cmp, 1)).toFixed(1) + '<small> vs ' + L(champ.al.zh, champ.al.en) + '</small>';
  } else {
    stC.textContent = '—'; stW.textContent = '—'; stR.textContent = '—';
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

buildLanes();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
