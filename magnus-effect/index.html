<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>马格努斯效应 · 旋转的球把风带弯</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd43b;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b8860b;
    --bg:#f2f0ea; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #modes { display: flex; gap: 6px; margin-bottom: 10px; }
  .mbtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 6px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .mbtn:hover { border-color: var(--acc); color: var(--text); }
  .mbtn.on { border-color: rgba(255,212,59,.65); background: rgba(255,212,59,.12); color: var(--text); }
  :root[data-theme="light"] .mbtn.on { border-color: rgba(184,134,11,.55); background: rgba(184,134,11,.10); }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.kick { border-color: rgba(255,107,107,.55); color: #ff8787; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 108px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 76px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,212,59,.08); border-color: rgba(255,212,59,.4); }
  :root[data-theme="light"] #steps li.on { background: rgba(184,134,11,.08); border-color: rgba(184,134,11,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #23210c; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe9a3; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #23210c; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.1); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="马格努斯效应:旋转的球把风带弯" data-en="The Magnus Effect: A Spinning Ball Bends the Wind">马格努斯效应:旋转的球把风带弯</h1>
  <div class="sub" data-zh="转动的表面拖着贴壁空气一起跑——上表面顺着来流,空气被带快、压强变低(伯努利);下表面顶着来流,空气变慢、压强变高。压强差垂直于来流顶出来,就是马格努斯力 F=ρUΓ(库塔–儒可夫斯基)。三种现场:风洞旋转圆柱看流线与压差 · 香蕉球绕过人墙 · 没有帆的旋筒帆船 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A spinning surface drags the adjoining air along — where the surface moves with the flow the air speeds up and pressure drops (Bernoulli); where it opposes, flow slows and pressure rises. The pressure difference pushes sideways: the Magnus force F = ρUΓ (Kutta–Joukowski). Three arenas: a spinning cylinder in a wind tunnel, the banana kick around the wall, and the sailless rotor ship · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">马格努斯效应:旋转的球把风带弯</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="马格努斯力" data-en="Magnus force">马格努斯力</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="参考速度" data-en="Ref. speed">参考速度</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="旋转 ω" data-en="Spin ω">旋转 ω</span><span class="v" id="stW">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v ok" id="stS">—</span>

  <div id="modes">
    <button class="mbtn on" id="mWind" data-zh="① 风洞圆柱" data-en="① Wind tunnel">① 风洞圆柱</button>
    <button class="mbtn" id="mKick" data-zh="② 香蕉球" data-en="② Banana kick">② 香蕉球</button>

  <div id="legend"></div>

    <button class="abtn" id="btnAct"></button>
    <button class="abtn" id="btnPreset"></button>

  <div class="row"><label id="l1"></label><input id="s1" type="range"><span class="val" id="s1Val"></span></div>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../wing-lift/" data-zh="同族升力:机翼的环量" data-en="kin lift: wing circulation">同族升力:机翼的环量</a>
    <a href="../sailing-upwind/" data-zh="被马格努斯替代的帆:逆风行驶" data-en="the sail it replaces: sailing upwind">被马格努斯替代的帆:逆风行驶</a>
    <a href="../propeller/" data-zh="旋转产生推力:螺旋桨" data-en="spin makes thrust: propeller">旋转产生推力:螺旋桨</a>
    <a href="../reynolds-number/" data-zh="流场 背景:雷诺数" data-en="the flow backdrop: Reynolds">流场 背景:雷诺数</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x18243a, 26, 70);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x18243a : 0xd3e2ef);
  scene.fog.color = new THREE.Color(dark ? 0x18243a : 0xd3e2ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('马格努斯效应 · 旋转的球把风带弯', 'The Magnus Effect · A Spinning Ball Bends the Wind');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  syncSliderLabels();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
  drawPlot();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 400);
camera.position.set(9, 6.5, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 60;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 9, 7);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}
function arrowObj(color) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 1, 10), mat(color, { opacity: 1 }));
  shaft.position.y = 0.5;
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.38, 12), mat(color, { opacity: 1 }));
  head.position.y = 1.15;
  g.add(shaft, head);
  scene.add(g);
  g.visible = false;
  return g;
}
/* 设置箭头:from→to,长度 0 时隐藏 */
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
function setArrow(a, from, to, minLen = 0.05) {
  _v1.copy(from); _v2.copy(to);
  const len = _v1.distanceTo(_v2);
  if (len < minLen) { a.visible = false; return; }
  a.visible = true;
  a.position.copy(_v1);
  a.lookAt(_v2);
  a.rotateX(Math.PI / 2);
  a.scale.set(1, len, 1);
}

/* ================= 模式与全局状态 ================= */
let MODE = 'wind';                                  // wind | kick | ship
const RHO_AIR = 1.225;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let spinOn = qsBool('spin', true);
let tGlob = 0;
const setPlayLabel = () => { document.getElementById('play').textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); };

/* ================= 模式 A:风洞旋转圆柱 ================= */
const gWind = new THREE.Group();
scene.add(gWind);
const R_CYL = 0.8, H_CYL = 3.2;
let U_WIND = 16, US_SURF = 24;                      // 来流、表面线速(m/s)
let cylMesh = null, cylG = null;
{
  /* 条纹贴图:看得出旋转 */
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 64;
  const c = cv.getContext('2d');
  c.fillStyle = '#e03131'; c.fillRect(0, 0, 256, 64);
  c.fillStyle = '#fff5f5';
  for (let i = 0; i < 8; i++) c.fillRect(i * 32, 0, 12, 64);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping;
  cylG = new THREE.Group();
  cylG.rotation.x = Math.PI / 2;                    // 轴沿 z
  cylMesh = new THREE.Mesh(new THREE.CylinderGeometry(R_CYL, R_CYL, H_CYL, 40, 1, true),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.35, metalness: 0.4, transparent: true, opacity: 1 }));
  cylG.add(cylMesh);
  const capMat = mat(0xc22b2b, { opacity: 1 });
  const cap1 = new THREE.Mesh(new THREE.CircleGeometry(R_CYL, 36), capMat);
  cap1.position.z = -H_CYL / 2 - 0.01;
  const cap2 = new THREE.Mesh(new THREE.CircleGeometry(R_CYL, 36), capMat);

function fieldVel(x, y, out) {
  const r2 = x * x + y * y, r = Math.sqrt(r2);
  if (r < R_CYL * 1.02) { out.set(0, 0, 0); return false; }
  const th = Math.atan2(y, x), R2 = r2 / (R_CYL * R_CYL);
  const ur = U_WIND * (1 - 1 / R2) * Math.cos(th);
  const ut = -U_WIND * (1 + 1 / R2) * Math.sin(th) - gamma() / (2 * Math.PI * r);
  out.set(ur * Math.cos(th) - ut * Math.sin(th), ur * Math.sin(th) + ut * Math.cos(th), 0);

}
/* 流线粒子(尾迹偏摆:下游加一点垂直偏置,让尾迹弯起来) */
const F_N = 420;

  });

function stepWind(dt) {
  for (let i = 0; i < F_N; i++) {

    if (ok) {
      /* 下游尾迹偏摆:马格努斯把整股尾迹推开 */
      const wake = Math.max(0, f.x - 1) / 5;
      const bias = -Math.sign(US_SURF || 1) * clamp(Math.abs(US_SURF) / 40, 0, 1) * wake * 1.4;
      f.x += _fv.x * dt; f.y += (_fv.y + bias * U_WIND * 0.25) * dt;

      f.y = (Math.random() * 2 - 1) * 3;

    dummy.updateMatrix();
    flowIM.setMatrixAt(i, dummy.matrix);
    /* 压强染色:p−p∞ = ½ρ(U²−|v|²);白=常压,蓝=高压,红=低压 */
    const sp2 = _fv.x * _fv.x + _fv.y * _fv.y;
    const dp = 0.5 * RHO_AIR * (U_WIND * U_WIND - sp2);      // Pa,正=高压
    const frac = clamp(dp / (0.5 * RHO_AIR * U_WIND * U_WIND * 0.5), -1, 1);

    flowIM.setColorAt(i, _c);
  }
  flowIM.instanceMatrix.needsUpdate = true;
  flowIM.instanceColor.needsUpdate = true;

}

function kickReset() {
  /* 初速:朝 +z 偏 28°、仰角 13°——先射向人墙外侧,再靠马格努斯拐回球门 */
  const v = v0Kick;
  ballPos.set(0, BALL_R, 0);
  ballVel.set(v * Math.cos(EL_KICK) * Math.cos(AZ_KICK), v * Math.sin(EL_KICK), v * Math.cos(EL_KICK) * Math.sin(AZ_KICK));
  ghostPos.copy(ballPos);
  ghostVel.copy(ballVel);
  kickT = 0; kickState = 'fly';
  trailBall.geometry.setFromPoints([ballPos.clone()]);
  trailGhost.geometry.setFromPoints([ghostPos.clone()]);
  spinRateNow = spinY * 2 * Math.PI;
}
/* 旋比 S=ωr/v → 升力系数(线性后饱和) */
const cLOf = v => Math.min(Math.abs(spinRateNow) * BALL_R / Math.max(v, 1) * 1.05, 0.36);
const trailPts = g => {
  const p = g.attributes.position, a = [];
  if (p) for (let i = 0; i < p.count; i++) a.push(new THREE.Vector3().fromBufferAttribute(p, i));
  return a;
};
function stepKick(dt) {
  if (kickState !== 'fly') {
    /* 终局之后:球继续落体/滚动衰减,停在地面 */
    ballVel.y -= 9.81 * dt;
    ballPos.addScaledVector(ballVel, dt);
    if (ballPos.y < BALL_R) { ballPos.y = BALL_R; ballVel.set(ballVel.x * 0.92, 0, ballVel.z * 0.92); }
    ballMesh.position.copy(ballPos);
    return;
  }
  const sub = 4, h = dt / sub;
  for (let s = 0; s < sub && kickState === 'fly'; s++) {
    kickT += h;
    for (const [pos, vel, withSpin] of [[ballPos, ballVel, true], [ghostPos, ghostVel, false]]) {
      const v = vel.length();
      const drag = 0.5 * RHO_AIR * BALL_A * 0.25 * v;
      let ax = -drag * vel.x / BALL_M, ay = -drag * vel.y / BALL_M - 9.81, az = -drag * vel.z / BALL_M;
      if (withSpin && v > 1 && spinRateNow !== 0) {
        const fm = 0.5 * RHO_AIR * BALL_A * cLOf(v) * v * v;
        /* F ∝ ω×v(ω 竖直) → 侧向 */
        ax += fm * spinRateNow * vel.z / (Math.abs(spinRateNow) * v) / BALL_M;
        az += -fm * spinRateNow * vel.x / (Math.abs(spinRateNow) * v) / BALL_M;
      }
      vel.x += ax * h; vel.y += ay * h; vel.z += az * h;
      pos.x += vel.x * h; pos.y += vel.y * h; pos.z += vel.z * h;
    }
    /* 无旋虚影到门线即冻结 */
    if (ghostPos.x >= X_GOAL) { ghostPos.x = X_GOAL; ghostVel.set(0, 0, 0); }
    /* 人墙判定(只判真球) */
    if (ballPos.x > X_WALL - 0.15 && ballPos.x < X_WALL + 0.15 &&
        ballPos.y < WALL_H && ballPos.z > WALL_Z0 - 0.25 && ballPos.z < WALL_Z1 + 0.25) {
      kickState = 'blocked';
      ballVel.multiplyScalar(-0.25);
    }
    /* 球门平面 */
    if (ballPos.x >= X_GOAL) {
      kickState = (ballPos.y < 2.44 && Math.abs(ballPos.z) < 3.66) ? 'goal' : 'out';
      if (kickState === 'goal') ballVel.multiplyScalar(0.15);   // 进网减速
    }
    if (ballPos.y < BALL_R && ballVel.y < 0) {
      ballPos.y = BALL_R;
      ballVel.y *= -0.45; ballVel.x *= 0.72; ballVel.z *= 0.72;
      if (ballVel.length() < 1.2 && kickState === 'fly' && ballPos.x > X_GOAL - 4) kickState = 'down';
    }
  }
  ballMesh.position.copy(ballPos);
  ghostMesh.position.copy(ghostPos);
  bandMesh.rotation.z -= spinRateNow * dt * 0.5;
  trailBall.geometry.setFromPoints([...trailPts(trailBall.geometry), ballPos.clone()]);
  trailGhost.geometry.setFromPoints([...trailPts(trailGhost.geometry), ghostPos.clone()]);
}

function shipForces() {

  let fx = wz / (Va || 1), fz = -wx / (Va || 1);

  const Fm = RHO_AIR * Va * GAMMA * 2 * 9;          // 两根 ×9 m 高
  fx *= Fm; fz *= Fm;

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
const plotTitle = document.getElementById('plotTitle');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const pad = 20, padB = 24;
  ctx.strokeStyle = 'rgba(128,150,170,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, 8); ctx.lineTo(pad, H - padB); ctx.lineTo(W - 12, H - padB); ctx.stroke();
  ctx.font = '16px system-ui';
  if (MODE === 'wind') {
    plotTitle.textContent = L('升力 F/L vs 表面线速 u_s(来流 U 实时)', 'lift F per metre vs surface speed (at current U)');
    const xmax = 60, fmax = Math.max(1, RHO_AIR * U_WIND * 2 * Math.PI * R_CYL * xmax);
    const xOf = u => pad + (u + xmax) / (2 * xmax) * (W - pad - 12);
    const yOf = f => 8 + (1 - clamp(Math.abs(f) / fmax, 0, 1)) * (H - padB - 10);
    ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let u = -xmax; u <= xmax; u += 2) {
      const f = RHO_AIR * U_WIND * 2 * Math.PI * R_CYL * u;
      const x = xOf(u), y = yOf(f);
      u === -xmax ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = cTxt;
    ctx.fillText('-60', xOf(-xmax) - 6, H - 6); ctx.fillText('0', xOf(0) - 4, H - 6); ctx.fillText('+60 m/s', xOf(xmax) - 40, H - 6);
    const fNow = liftPerM();
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath(); ctx.arc(xOf(US_SURF), yOf(fNow), 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = cTxt;
    ctx.fillText(L(`现在 ${Math.round(fNow)} N/m`, `now ${Math.round(fNow)} N/m`), pad + 10, 26);
  } else if (MODE === 'kick') {
    plotTitle.textContent = L('俯视轨迹:黄=旋转球 · 灰=无旋虚影 · 顶=球门线', 'plan view: yellow = spin, grey = no-spin, top = goal line');
    const x0 = -2, x1 = X_GOAL + 1, z1 = 8;
    const xOf = x => pad + (x - x0) / (x1 - x0) * (W - pad - 12);
    const zOf = z => H / 2 + z / z1 * (H / 2 - 16);
    /* 门线与门柱 */
    ctx.strokeStyle = 'rgba(116,220,132,.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(xOf(X_GOAL), zOf(-3.66)); ctx.lineTo(xOf(X_GOAL), zOf(3.66)); ctx.stroke();
    /* 人墙 */
    ctx.fillStyle = 'rgba(255,107,107,.5)';
    ctx.fillRect(xOf(X_WALL) - 6, zOf(WALL_Z0), 12, zOf(WALL_Z1) - zOf(WALL_Z0));
    const drawTrail = (g, color) => {
      const p = g.attributes.position;
      if (!p || p.count < 2) return;
      ctx.strokeStyle = color; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < p.count; i++) ctx.lineTo(xOf(p.getX(i)), zOf(p.getZ(i)));
      ctx.stroke();
    };
    drawTrail(trailGhost, 'rgba(143,163,184,.9)');
    drawTrail(trailBall, '#ffd43b');
    ctx.fillStyle = cTxt;
    ctx.fillText(L('踢球点 →', 'kick →'), pad + 6, H - 8);
    ctx.fillText(L('z=8m', 'z=8m'), pad + 6, 22);
  } else {
    plotTitle.textContent = L('航速爬升 vs 时间(加速 ×8 演示)· 灰=0 节线', 'ship speed vs time (accel ×8) · grey = zero knot');
    const tMax = 40, vMax = 8;
    const tOf = t => pad + t / tMax * (W - pad - 12);
    const vOf = v => H - padB - clamp(v / vMax, 0, 1) * (H - padB - 10);
    ctx.strokeStyle = 'rgba(128,150,170,.5)'; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(pad, vOf(0)); ctx.lineTo(W - 12, vOf(0)); ctx.stroke();
    ctx.setLineDash([]);
    /* 当前 β 下的航速爬升(细步长积分,加速 ×8 场景时间) */
    let v = 0; const trace = [];
    for (let t = 0; t <= 40; t += 0.2) {
      const f = shipForcesAt(v);
      const drag = 900 * v * v + 3000;
      v = Math.max(0, v + (f.thrust - drag) / 150e3 * 0.2 * 8);
      trace.push([t, v]);
    }
    ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3;
    ctx.beginPath();
    trace.forEach(([t, vv], i) => i === 0 ? ctx.moveTo(tOf(t), vOf(vv)) : ctx.lineTo(tOf(t), vOf(vv)));
    ctx.stroke();
    ctx.fillStyle = cTxt;
    ctx.fillText(L(`β=${shipBeta}° 平衡 ${(trace[trace.length - 1][1] * 1.944).toFixed(1)} 节`, `β=${shipBeta}° settles at ${(trace[trace.length - 1][1] * 1.944).toFixed(1)} kn`), pad + 8, 26);
    ctx.fillText('s', W - 18, H - 6);
  }
}
function shipForcesAt(vGiven) {
  const save = shipV; shipV = vGiven;
  const f = shipForces();
  shipV = save;
  return f;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * (playing ? speed : 0);
  tGlob += dt0;
  if (MODE === 'wind') {
    if (dt > 0) stepWind(dt);
    updateWindArrows();
  } else if (MODE === 'kick') {
    if (dt > 0) stepKick(dt);
  } else {
    if (dt > 0) stepShip(dt);
    updateShipArrows();
  }
  statsAcc += dt0;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    if (MODE === 'wind') {
      stF.textContent = (liftPerM() * H_CYL / 1000).toFixed(1) + ' kN';
      stV.textContent = U_WIND.toFixed(1) + ' m/s';
      stW.textContent = (US_SURF / R_CYL * 60 / (2 * Math.PI)).toFixed(0) + ' rpm';
      stS.textContent = Math.abs(US_SURF) < 2 ? L('无旋:零升力', 'no spin: zero lift') : L('升力↕ 尾迹偏摆', 'lift ↕, wake deflected');
      stS.className = 'v ' + (Math.abs(US_SURF) < 2 ? 'warn' : 'ok');
    } else if (MODE === 'kick') {
      stF.textContent = kickState === 'fly' ? (0.5 * RHO_AIR * BALL_A * cLOf(ballVel.length()) * ballVel.length() ** 2).toFixed(1) + ' N' : '0 N';
      stV.textContent = ballVel.length().toFixed(1) + ' m/s';
      stW.textContent = spinY.toFixed(1) + ' rev/s';
      stS.textContent = kickState === 'fly' ? L('飞行中', 'in flight')
        : kickState === 'goal' ? L('进球!', 'GOAL!')
        : kickState === 'blocked' ? L('被墙挡出', 'blocked by the wall')
        : kickState === 'out' ? L('偏出', 'wide') : L('落地滚动', 'rolled to a stop');
      stS.className = 'v ' + (kickState === 'goal' ? 'ok' : kickState === 'fly' ? 'ok' : 'bad');
    } else {
      const f = shipForces();
      stF.textContent = (f.Fm / 1000).toFixed(0) + ' kN';
      stV.textContent = shipV.toFixed(1) + ' m/s';
      stW.textContent = '135 rpm';
      stS.textContent = shipV > 3 ? L('巡航(横风最猛)', 'cruising (beam wind)') : shipV > 0.3 ? L('加速中', 'building up') : L('几乎不动', 'barely moving');
      stS.className = 'v ' + (shipV > 0.3 ? 'ok' : 'warn');
    }
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
