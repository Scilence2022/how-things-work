<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>共价键与分子轨道 · 电子云把核拉在一起</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#7c5cff;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#5b3fd1;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(124,92,255,.6);background:rgba(124,92,255,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(91,63,209,.55);background:rgba(91,63,209,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(124,92,255,.10);border-color:rgba(124,92,255,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(91,63,209,.08);border-color:rgba(91,63,209,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#d4c8ff}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="共价键与分子轨道" data-en="Covalent Bonds &amp; Molecular Orbitals">共价键与分子轨道</h1>
  <div class="sub" data-zh="两原子靠近→波函数同相叠加=σ成键轨道:电子云灌进核间、能量低于分立原子,把两个核拉住→反相叠加=σ*反键轨道:核间出现节面、能量更高→净成键=莫尔斯曲线,平衡键长处最低:H₂ 0.074 nm、436 kJ/mol→σ 头碰头、π 肩并肩;双键的 π 挡住旋转——乙烯拧 90° 要赔掉约 270 kJ/mol · 拖动旋转 / 空格运行/暂停" data-en="Two atoms approach → in-phase superposition gives the bonding σ orbital: electron density pours between the nuclei, lowering the energy and pulling them together → out-of-phase gives σ*: a node between the nuclei raises the energy → the net is the Morse curve, lowest at equilibrium: H₂ at 0.074 nm, 436 kJ/mol → σ is head-on, π is side-by-side; a double bond's π blocks rotation — twisting ethylene 90° costs ≈270 kJ/mol · drag to orbit / Space = run/pause">两原子靠近→波函数同相叠加=σ成键轨道:电子云灌进核间、能量低于分立原子,把两个核拉住→反相叠加=σ*反键轨道:核间出现节面、能量更高→净成键=莫尔斯曲线,平衡键长处最低:H₂ 0.074 nm、436 kJ/mol→σ 头碰头、π 肩并肩;双键的 π 挡住旋转——乙烯拧 90° 要赔掉约 270 kJ/mol · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="势能" data-en="Potential">势能</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="键长" data-en="Bond length">键长</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="键级" data-en="Bond order">键级</span><span class="v" id="stOrd">—</span>
  <span class="k" data-zh="轨道重叠度" data-en="Overlap S">轨道重叠度</span><span class="v" id="stS">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bH2" data-zh="H₂ 单键 σ" data-en="H₂ single σ">H₂ 单键 σ</button>
    <button class="abtn" id="bO2" data-zh="O₂ 双键 σ+π" data-en="O₂ double σ+π">O₂ 双键 σ+π</button>
    <button class="abtn" id="bEth" data-zh="乙烯 C=C 阻旋" data-en="Ethylene C=C">乙烯 C=C 阻旋</button>
  </div>
  <div class="row">
    <label data-zh="核间距 r" data-en="Nuclear distance">核间距 r</label>
    <input id="sR" type="range" min="0.05" max="0.40" step="0.002" value="0.074">
    <span class="val" id="sRVal">0.074 nm</span>
  </div>
  <div class="row">
    <label data-zh="扭转角 φ" data-en="Twist angle φ">扭转角 φ</label>
    <input id="sPhi" type="range" min="0" max="180" step="1" value="0">
    <span class="val" id="sPhiVal">0°</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglAnti" type="checkbox"> <span data-zh="反键 σ* 视图" data-en="Show σ*">反键 σ* 视图</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../ionic-bond/" data-zh="离子键" data-en="Ionic Bond">离子键</a>
    <a href="../metallic-bond/" data-zh="金属键" data-en="Metallic Bond">金属键</a>
    <a href="../hydrogen-bond/" data-zh="氢键" data-en="Hydrogen Bond">氢键</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* LCAO:ψ± = φA ± φB。同相→σ 成键(核间电子密度↑,E↓);反相→σ*(节面,E↑)。
   净成键能:E(r)=De[(1−e^{−a(r−re)})²−1](Morse)。
   H₂: re=0.0744 nm, De=436 kJ/mol, a≈19.4 nm⁻¹;
   O₂: re=0.1207 nm, De=498, a≈13.8; C₂H₄ C=C: re=0.1339 nm, De≈614, a≈15;
   π 重叠 ∝ cosφ,扭转能量惩罚 Eπ≈270·sin²φ kJ/mol。
   长度单位:1 场景单位 = 0.05 nm(r_u = nm×20) */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0d0f14,10,34);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,200);
camera.position.set(3.4,1.7,6.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.1,0.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=18;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(4,7,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.35);fill.position.set(-6,4,-5);scene.add(fill);

const U=20;   /* 1 nm = 20 单位 */

/* ── 地台 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x14171d,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(12,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-2.1;scene.add(ground);

/* ── 原子核 ── */
const nucM_H=new THREE.MeshStandardMaterial({color:0xeef2f8,roughness:0.35,metalness:0.1,
  emissive:0x9fb4d8,emissiveIntensity:0.25});
const nucM_O=new THREE.MeshStandardMaterial({color:0xe05555,roughness:0.35,metalness:0.15,
  emissive:0xb03030,emissiveIntensity:0.35});
const nucM_C=new THREE.MeshStandardMaterial({color:0x39404c,roughness:0.4,metalness:0.5,
  emissive:0x1c2434,emissiveIntensity:0.4});
const nucA=new THREE.Mesh(new THREE.SphereGeometry(0.13,20,16),nucM_H);
const nucB=new THREE.Mesh(new THREE.SphereGeometry(0.13,20,16),nucM_H);
scene.add(nucA,nucB);
/* 乙烯的 4 个 H(挂在端组上) */
const ethGrpL=new THREE.Group(),ethGrpR=new THREE.Group();
scene.add(ethGrpL,ethGrpR);
const ethH=[];
{
  const hGeo=new THREE.SphereGeometry(0.1,16,12);
  for(const g of [ethGrpL,ethGrpR]){
    for(const s of [1,-1]){
      const h=new THREE.Mesh(hGeo,nucM_H);
      h.position.set(-0.42,0.73*s,0);
      g.add(h);ethH.push(h);
    }
  }
}
ethGrpL.visible=ethGrpR.visible=false;

/* ── 电子云点云 ── */
function gauss(){return (Math.random()+Math.random()+Math.random()-1.5)*0.8;}
function cloudPoints(n,color,size,op){
  const pos=new Float32Array(n*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({color,size,transparent:true,opacity:op,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const p=new THREE.Points(g,m);p.frustumCulled=false;scene.add(p);
  return p;
}
/* σ 成键:基形按 r=1.5u 构造,x 向缩放适配 */
const sigPts=cloudPoints(850,0x6fd4ff,0.05,0.5);
for(let i=0;i<850;i++){
  const x=clamp(gauss()*1.05,-1.35,1.35);
  const w=0.34*(1.15-0.25*Math.abs(x)/1.5);
  sigPts.geometry.attributes.position.setXYZ(i,x,gauss()*w,gauss()*w);
}
/* σ* 反键:两团叶瓣,中间节面 */
const astPts=cloudPoints(800,0xff8866,0.05,0.45);
for(let i=0;i<800;i++){
  const side=Math.random()<0.5?-1:1;
  const x=side*(0.78+Math.abs(gauss())*0.55);
  astPts.geometry.attributes.position.setXYZ(i,clamp(x,0.25,2.2),gauss()*0.3,gauss()*0.3);
}
astPts.visible=false;
/* 节面(σ*) */
const nodeM=new THREE.MeshBasicMaterial({color:0xff8866,transparent:true,opacity:0.16,side:THREE.DoubleSide,depthWrite:false});
const nodeP=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.5,1,1),nodeM);
nodeP.rotation.y=Math.PI/2;scene.add(nodeP);nodeP.visible=false;
/* π 轨道:上下两片肩并肩 */
const piT=cloudPoints(420,0x7ce38b,0.05,0.5);
const piB=cloudPoints(420,0x7ce38b,0.05,0.5);
for(const p of [piT,piB]){
  for(let i=0;i<420;i++){
    p.geometry.attributes.position.setXYZ(i,clamp(gauss()*0.7,-1.2,1.2),gauss()*0.16,gauss()*0.2);
  }
}
const piG=new THREE.Group();scene.add(piG);
piT.position.y=0.42;piB.position.y=-0.42;piG.add(piT,piB);
piG.visible=false;

/* ── 能量-距离曲线面板 ── */
const panelX=4.35,panelY=0.15,panelZ=-1.6;
function ex(r){return panelX-1.5+(r-0.04)/0.36*2.9;}
function ey(E){return panelY-1.45+clamp((E+700)/950,0,1)*2.6;}
const axM=new THREE.LineBasicMaterial({color:0x5a6474,transparent:true,opacity:0.7});
{
  const ax=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(ex(0.04),ey(-600),panelZ),new THREE.Vector3(ex(0.04),ey(220),panelZ),
    new THREE.Vector3(ex(0.40),ey(-600),panelZ)]);
  scene.add(new THREE.Line(ax,axM));
  const e0=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(ex(0.04),ey(0),panelZ),new THREE.Vector3(ex(0.40),ey(0),panelZ)]);

}

/* ── 状态 ── */
const MODES={
  h2:{re:0.0744,De:436,a:19.4,order:'1',pi:false,eth:false,nucA:nucM_H,nucB:nucM_H,rad:0.13},

let mode='h2',rNm=0.074,phi=0;
let playing=true,labelsOn=true,slowMo=false,anti=false;
let simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;

function morse(r,m){const d=(r-m.re)*m.a;return m.De*((1-Math.exp(-d))**2-1);}
let stat={E:0,S:0,order:'1'};

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblA=addLabel(()=>L('原子核 A','nucleus A'),new THREE.Vector3(0,0.42,0),'b',()=>true,nucA);
const lblB=addLabel(()=>L('原子核 B','nucleus B'),new THREE.Vector3(0,0.42,0),'b',()=>true,nucB);
const lblSig=addLabel(()=>L('σ 成键轨道 · 电子灌进核间','bonding σ · density between nuclei'),
  new THREE.Vector3(0,0.95,0),'g',()=>!anti);
const lblAst=addLabel(()=>L('σ* 反键轨道 · 核间节面','antibonding σ* · nodal plane'),new THREE.Vector3(0,0.95,0),'r',
  ()=>anti);
const lblNode=addLabel(()=>L('节面 · 电子密度=0','node · zero density'),new THREE.Vector3(0,-0.62,0),'r',
  ()=>anti);

const lblEq=addLabel(()=>L('平衡键长','equilibrium'),new THREE.Vector3(ex(0.0744),ey(-600)-0.16,panelZ),'y',()=>true);

function statText(){return `E=${stat.E.toFixed(0)} kJ/mol`;}
{ /* 平衡键长刻度跟随当前模式 */
  lblEq.position.set(ex(MODES[mode].re),ey(-600)-0.16,panelZ);
}

function setR(vv){rNm=clamp(vv,0.05,0.40);
  document.getElementById('sR').value=rNm;
  document.getElementById('sRVal').textContent=rNm.toFixed(3)+' nm';}
function setPhi(vv){phi=clamp(vv,0,180);
  document.getElementById('sPhi').value=phi;
  document.getElementById('sPhiVal').textContent=phi.toFixed(0)+'°';}
function setMode(k){mode=k;const m=MODES[k];
  document.getElementById('bH2').classList.toggle('on',k==='h2');
  document.getElementById('bO2').classList.toggle('on',k==='o2');
  document.getElementById('bEth').classList.toggle('on',k==='eth');
  nucA.material=m.nucA;nucB.material=m.nucB;
  nucA.geometry.dispose();nucB.geometry.dispose();
  nucA.geometry=new THREE.SphereGeometry(m.rad,20,16);
  nucB.geometry=new THREE.SphereGeometry(m.rad,20,16);
  ethGrpL.visible=ethGrpR.visible=m.eth;
  piG.visible=m.pi&&!anti;
  setR(m.re);setPhi(0);
  document.getElementById('sPhi').disabled=!m.eth;
  rebuildCurve();
}
function rebuildCurve(){
  const m=MODES[mode],a=curveG.attributes.position.array;
  for(let i=0;i<90;i++){
    const r=0.04+i/89*0.36;
    a[i*3]=ex(r);a[i*3+1]=ey(morse(r,m));a[i*3+2]=panelZ;
  }
  curveG.attributes.position.needsUpdate=true;
  lblEq.position.set(ex(m.re),ey(-600)-0.16,panelZ);
}

const STEPS=[
 {b:'靠近:波函数开始叠加',be:'Approach: wavefunctions overlap',
  d:'两个氢原子互相靠近,1s 波函数在核间区域交叠;交叠程度随核间距指数增长——这是化学键的原料。',

  act(){setMode('h2');setR(0.24);}},
 {b:'同相叠加 = σ 成键',be:'In phase: bonding σ',
  d:'波函数同相叠加,核间电子密度升高:电子同时被两个核吸引,体系能量降到分立原子之下——这份"能量差"就是键,σ 轨道头碰头最强。',
  de:'In-phase superposition piles electron density between the nuclei; each electron now attracts both nuclei and the energy drops below the separated atoms — that difference IS the bond. Head-on σ is the strongest overlap.',

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const m=MODES[mode];
  const phiR=phi*Math.PI/180;
  const sSig=Math.exp(-3*Math.max(0,rNm/m.re-1))*clamp(m.re/rNm,0,1);
  const ovS=Math.max(0,Math.cos(phiR));
  const S=clamp(mode==='h2'?sSig:sSig*(0.55+0.45*ovS*ovS),0,1);
  const E=morse(rNm,m)+(m.eth?270*Math.sin(phiR)**2:0);
  stat={E,S,order:m.order};
  const ev=document.getElementById('stE');
  ev.innerHTML=E.toFixed(0)+'<small> kJ/mol</small>';
  ev.className='v '+(E>-10?'warn':E>-150?'':'ok');
  document.getElementById('stR').innerHTML=(rNm*1000).toFixed(1)+'<small> pm</small>';
  document.getElementById('stOrd').textContent=m.order;
  const sv=document.getElementById('stS');
  sv.innerHTML=S.toFixed(2);
  sv.className='v '+(S>0.6?'ok':S>0.2?'':'warn');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}

document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0d0f14:0xe9e4dc);
  scene.fog.color.setHex(dark?0x0d0f14:0xe9e4dc);
  groundM.color.setHex(dark?0x14171d:0xd8d0c2);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const m=MODES[mode],rU=rNm*U,phiR=phi*Math.PI/180;
  /* ── 原子核与端组 ── */
  nucA.position.set(-rU/2,0,0);
  nucB.position.set(rU/2,0,0);
  ethGrpR.position.set(rU/2,0,0);
  ethGrpL.position.set(-rU/2,0,0);
  ethGrpL.rotation.x=-phiR;ethGrpR.rotation.x=0;
  /* ── 轨道云 ── */
  sigPts.visible=!anti;
  sigPts.scale.set(rU/1.5,1,1);
  astPts.visible=anti;
  astPts.scale.set(rU/1.5,1,1);
  nodeP.visible=anti;
  nodeP.position.set(0,0,0);
  nodeP.scale.set(rU/1.5,1,1);   /* 局部 x → 世界 z:薄片横跨核间方向 */
  piG.visible=m.pi&&!anti;
  piG.scale.set(clamp(rU/1.6,0.5,1.6),1,1);
  const ov=clamp(Math.cos(phiR),0,1);
  piT.material.opacity=0.15+0.4*ov;
  piB.material.opacity=0.15+0.4*ov;
  /* ── 能量曲线与工作点 ── */
  const E=morse(rNm,m)+(m.eth?270*Math.sin(phiR)**2:0);
  mark.position.set(ex(rNm),ey(E),panelZ+0.02);
  mark.scale.setScalar(1+0.25*Math.sin(simT*4));
  lblMark.position.set(ex(rNm)+0.12,ey(E)+0.18,panelZ);
  stat={E,S:clamp(Math.exp(-3*Math.max(0,rNm/m.re-1))*clamp(m.re/rNm,0,1)*(mode==='h2'?1:0.55+0.45*ov*ov),0,1),order:m.order};
  /* ── 微呼吸动画(表现涨落) ── */
  sigPts.material.opacity=0.42+0.1*Math.sin(simT*2.1);
  astPts.material.opacity=0.38+0.1*Math.sin(simT*2.6);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
