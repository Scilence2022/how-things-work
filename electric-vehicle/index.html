<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电动汽车能量流</title>
<style>
  :root,:root[data-theme="dark"]{color-scheme:dark;
    --acc:#74c0fc;--bg:#10141b;--panel:rgba(13,17,24,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;--hover:rgba(255,255,255,.05);
    --shadow:0 8px 30px rgba(0,0,0,.45);--tool:rgba(13,17,24,.78);--tool-border:rgba(255,255,255,.12);}
  :root[data-theme="light"]{color-scheme:light;
    --acc:#1971c2;--bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;--hover:rgba(15,25,40,.05);
    --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s;}
  #app{position:fixed;inset:0;}#app canvas{display:block;}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
    font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
    border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    gap:6px;text-decoration:none;backdrop-filter:blur(6px);transition:border-color .15s,color .15s,transform .15s;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:11px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
  #stats .k{font-size:12px;color:var(--text2);align-self:center;}
  #stats .v{font-size:19px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  #stats .v small{font-size:11.5px;color:var(--text2);font-weight:400;}#stats .v.g{color:var(--acc);}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:384px;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:14px;padding:14px 16px 12px;
    backdrop-filter:blur(6px);box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto;}
  #steps{list-style:none;margin-top:8px;}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start;}
  #steps li:hover{background:var(--hover);}
  #steps li.on{background:rgba(116,192,252,.10);border-color:rgba(116,192,252,.45);}
  :root[data-theme="light"] #steps li.on{background:rgba(25,113,194,.08);border-color:rgba(25,113,194,.4);}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;background:rgba(255,255,255,.12);color:var(--text3);}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
  #steps li.on .n{background:var(--acc);color:#fff;}
  #steps .t{font-size:12.5px;color:var(--text3);line-height:1.45;}#steps .t b{color:var(--text);}
  #steps li.on .t b{color:#bde9ff;}:root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
  .abtn{appearance:none;font:inherit;cursor:pointer;width:100%;background:var(--hover);
    color:var(--text2);border:1px solid var(--tool-border);border-radius:9px;
    padding:6px 10px;text-align:left;font-size:12.5px;margin-top:6px;
    transition:border-color .15s,color .15s,background .15s;}
  .abtn:hover{border-color:var(--acc);color:var(--text);}
  .abtn.on{border-color:var(--acc);color:var(--text);background:rgba(116,192,252,.10);}
  :root[data-theme="light"] .abtn.on{background:rgba(25,113,194,.08);}
  #btns{margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
  @media(max-width:900px){#stats{display:none;}}
  @media(max-width:760px){
    #panel{width:calc(100vw - 36px);max-height:55vh;}
    #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="title">
  <h1 data-zh="电动汽车能量流" data-en="Electric Vehicle Energy Flow">电动汽车能量流</h1>
  <div class="sub"
    data-zh="电池→逆变器→电机→传动→车轮：每一步的效率账单"
    data-en="Battery → inverter → motor → drivetrain → wheels — the efficiency ledger">
    电池→逆变器→电机→传动→车轮：每一步的效率账单</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn">EN</button>
  <button class="tbtn" id="themeBtn">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="SoC %" data-en="SoC %">SoC %</span><span class="v g" id="stSoc">100</span>
  <span class="k" data-zh="瞬时功率 kW" data-en="Power kW">瞬时功率 kW</span><span class="v" id="stPwr">0</span>
  <span class="k" data-zh="整体效率 %" data-en="Overall eff %">整体效率 %</span><span class="v g" id="stEff">91</span>
  <span class="k" data-zh="预计续航 km" data-en="Range km">预计续航 km</span><span class="v" id="stRange">375</span>
</div>
<div id="panel">
  <ol id="steps"></ol>
  <div id="btns">
    <button class="abtn" id="btnAccel" data-zh="全力加速 / Accelerate" data-en="全力加速 / Accelerate">全力加速 / Accelerate</button>
    <button class="abtn" id="btnRegen" data-zh="再生制动 / Regen brake" data-en="再生制动 / Regen brake">再生制动 / Regen brake</button>
    <button class="abtn" id="btnCharge" data-zh="DC 快充 / DC fast charge" data-en="DC 快充 / DC fast charge">DC 快充 / DC fast charge</button>
    <button class="abtn" id="btnCold" data-zh="寒冷模式 / Cold −20°C" data-en="寒冷模式 / Cold −20°C">寒冷模式 / Cold −20°C</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
let LANG  = localStorage.getItem('htw-lang')||'zh';
const L = (zh,en) => LANG==='en'?en:zh;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 4, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.target.set(0,0,0);
scene.add(new THREE.AmbientLight(0xffffff,0.8));
const dl = new THREE.DirectionalLight(0xffffff,1.3); dl.position.set(8,12,8); scene.add(dl);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME==='dark'?'☀':'☾';
  scene.background = new THREE.Color(THEME==='light'?0xeef1f6:0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{ el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh; });
  document.getElementById('langBtn').textContent = LANG==='en'?'中':'EN';
  document.title = L('电动汽车能量流','Electric Vehicle Energy Flow');
  buildSteps();
}
document.getElementById('themeBtn').addEventListener('click',()=>{ THEME=THEME==='dark'?'light':'dark'; localStorage.setItem('htw-theme',THEME); applyTheme(); });
document.getElementById('langBtn').addEventListener('click',()=>{ LANG=LANG==='zh'?'en':'zh'; localStorage.setItem('htw-lang',LANG); applyLang(); });

// ---- simulation state ----
let soc = 100, power = 0, mode = 'idle', coldMode = false;
const CAPACITY_KWH = 75, EFF_TOTAL = 0.91, EFF_REGEN = 0.70;
const ACCEL_RATE = 0.015, REGEN_RATE = 0.008, CHARGE_RATE = 0.012;

// ---- build powertrain scene ----
function box(w,h,d,color,x,y,z,op=1) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color,roughness:0.45,metalness:0.2,transparent:op<1,opacity:op})
  );
  m.position.set(x,y,z); scene.add(m); return m;
}
function cyl(rt,rb,h,color,x,y,z) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,20),
    new THREE.MeshStandardMaterial({color,roughness:0.4,metalness:0.35}));
  m.position.set(x,y,z); scene.add(m); return m;
}

// floor
box(22,0.15,6,0x1a2030,0,-1.05,0);
// battery pack (floor level)
const batBody = box(8,0.8,3.8,0x1565c0,-1,-.6,0);
const batFill = box(7.8,0.72,3.6,0x1e88e5,-1,-.58,0.01);
batFill.userData.isBatFill = true;
// battery label bg
box(7.8,0.08,3.6,0x0d47a1,-1,-0.2,0);

// inverter
const invBox = box(2,1.5,2,0x37474f,4.2,0.25,0);
box(1.8,1.3,1.8,0x455a64,4.2,0.25,0);
// motor
const motorBody = cyl(0.85,0.85,2.2,0x37474f,7,0.25,0);
motorBody.rotation.z = Math.PI/2;
// gear reduction
box(1,0.9,0.9,0x4a148c,9.2,0.25,0);
// axle + wheels
const wheelGeo = new THREE.TorusGeometry(0.7,0.18,12,24);
const wheelMat = new THREE.MeshStandardMaterial({color:0x263238,roughness:0.7,metalness:0.3});
const wFL = new THREE.Mesh(wheelGeo,wheelMat); wFL.position.set(-5,-.3,2.2); scene.add(wFL);
const wFR = new THREE.Mesh(wheelGeo,wheelMat); wFR.position.set(-5,-.3,-2.2); scene.add(wFR);

// connector pipes
function pipe(x1,x2,y,color) {
  const len=Math.abs(x2-x1);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,len,8),
    new THREE.MeshStandardMaterial({color,roughness:0.6}));
  m.rotation.z=Math.PI/2; m.position.set((x1+x2)/2,y,0); scene.add(m); return m;
}
pipe(2.8,3.3,0.25,0x546e7a);   // bat→inv
pipe(5.2,6.0,0.25,0x546e7a);   // inv→motor
pipe(8.1,8.7,0.25,0x7b1fa2);   // motor→gear
pipe(-5.5,-1.5,0.25,0x546e7a); // gear→wheels (simplified axle)
// ---- energy flow particles ----
const MAX_PARTS = 60;
const partPositions = new Float32Array(MAX_PARTS * 3);
const partGeo = new THREE.BufferGeometry();
partGeo.setAttribute('position', new THREE.BufferAttribute(partPositions, 3));
const partMat = new THREE.PointsMaterial({color:0xffe066, size:0.22, transparent:true, opacity:0.85});
const particles = new THREE.Points(partGeo, partMat);
scene.add(particles);

// heat particles (rising red)
const heatPositions = new Float32Array(MAX_PARTS * 3);
const heatGeo = new THREE.BufferGeometry();
heatGeo.setAttribute('position', new THREE.BufferAttribute(heatPositions, 3));
const heatMat = new THREE.PointsMaterial({color:0xff4444, size:0.15, transparent:true, opacity:0.55});
const heatParticles = new THREE.Points(heatGeo, heatMat);
scene.add(heatParticles);

// particle state arrays
const pState = Array.from({length:MAX_PARTS}, () => ({t:Math.random(), speed:0.4+Math.random()*0.3, active:false}));
const hState = Array.from({length:MAX_PARTS}, () => ({x:0, y:0, vy:0.01+Math.random()*0.02, life:0, maxLife:1+Math.random(), active:false}));

// component heat source positions
const HEAT_SOURCES = [
  {x:0.5, y:0.5},    // battery
  {x:4.2, y:1.2},    // inverter
  {x:7.0, y:1.2},    // motor
  {x:9.2, y:0.8},    // gearbox
];

function updateParticles(dt) {
  const isRegen = mode === 'regen';
  const isCharge = mode === 'charge';
  const active = mode !== 'idle';
  // drive path: bat(-1,0.25) → inv(4.2) → motor(7) → gear(9.2) → wheel(-5)
  const pathX = isRegen ? [-5, 9.2, 7, 4.2, -1] : (isCharge ? [-1, 4.2] : [-1, 4.2, 7, 9.2, -5]);
  const pathY = 0.25;

  for (let i = 0; i < MAX_PARTS; i++) {
    const p = pState[i];
    if (!active) { partPositions[i*3] = 0; partPositions[i*3+1] = -100; partPositions[i*3+2] = 0; continue; }
    p.active = true;
    p.t += dt * p.speed * (isRegen ? -0.5 : 0.5);
    if (p.t > 1) p.t -= 1;
    if (p.t < 0) p.t += 1;
    const seg = Math.floor(p.t * (pathX.length - 1));
    const frac = p.t * (pathX.length - 1) - seg;
    const s = Math.min(seg, pathX.length - 2);
    partPositions[i*3]   = pathX[s] + (pathX[s+1] - pathX[s]) * frac;
    partPositions[i*3+1] = pathY;
    partPositions[i*3+2] = (Math.random() - 0.5) * 0.3;
  }
  partGeo.attributes.position.needsUpdate = true;
  partMat.color.set(isRegen ? 0x69db7c : isCharge ? 0x74c0fc : 0xffe066);

  // heat particles
  const heatActive = mode !== 'idle';
  for (let i = 0; i < MAX_PARTS; i++) {
    const h = hState[i];
    if (!heatActive) { heatPositions[i*3+1] = -100; continue; }
    h.life += dt;
    if (h.life > h.maxLife) {
      const src = HEAT_SOURCES[i % HEAT_SOURCES.length];
      h.x = src.x + (Math.random()-0.5)*1.5; h.y = src.y; h.life = 0; h.vy = 0.008+Math.random()*0.015;
    }
    h.y += h.vy; h.x += (Math.random()-0.5)*0.01;
    heatPositions[i*3] = h.x; heatPositions[i*3+1] = h.y; heatPositions[i*3+2] = (Math.random()-0.5)*0.2;
  }
  heatGeo.attributes.position.needsUpdate = true;
}

// ---- SoC gauge update ----
function updateSoc(dt) {
  if (mode === 'accel') soc = Math.max(0, soc - ACCEL_RATE * 100 * dt * (coldMode ? 1.3 : 1));
  if (mode === 'regen') soc = Math.min(100, soc + REGEN_RATE * 100 * dt);
  if (mode === 'charge') soc = Math.min(100, soc + CHARGE_RATE * 100 * dt);
  const fill = Math.max(0, soc / 100);
  batFill.scale.x = fill; batFill.position.x = -1 - (1 - fill) * 3.9;
  batFill.material.color.set(soc > 30 ? 0x1e88e5 : 0xf44336);
  const pw = mode === 'accel' ? 150 : mode === 'regen' ? -60 : mode === 'charge' ? 120 : 0;
  power = pw;
  const eff = coldMode ? 78 : 91;
  const range = Math.round((soc / 100) * CAPACITY_KWH / 0.20 * (coldMode ? 0.75 : 1));
  document.getElementById('stSoc').textContent = soc.toFixed(1);
  document.getElementById('stPwr').textContent = Math.abs(pw);
  document.getElementById('stEff').textContent = eff;
  document.getElementById('stRange').textContent = range;
}
// ---- steps ----
const STEPS = [
  { b:'电池包', be:'Battery',
    d:'75 kWh 锂电池组，标称 400 V，内阻发热约 2%',
    de:'75 kWh Li-ion, 400V nominal, ~2% thermal loss from internal resistance' },
  { b:'逆变器', be:'Inverter',
    d:'DC 400V→三相交流，IGBT/SiC 开关，效率 ~98%',
    de:'DC 400V → 3-phase AC, IGBT/SiC switching, eff ~98%' },
  { b:'永磁同步电机', be:'PMSM',
    d:'定子旋转磁场追转子磁铁，效率 ~95%，铜损+铁损',
    de:'rotating stator field chases rotor magnets, eff ~95%, copper + iron losses' },
  { b:'单速减速', be:'Single-speed reduction',
    d:'约 9:1 减速比，效率 ~98%；无需换挡——电机扭矩曲线平坦',
    de:'~9:1, eff ~98%; no gearbox needed — motor torque curve is flat' },
  { b:'再生制动', be:'Regen braking',
    d:'减速时电机变发电机，动能→电能回收约 70%',
    de:'decelerating → motor becomes generator, ~70% kinetic energy recovered' },
  { b:'整体效率', be:'Overall efficiency',
    d:'整体效率 ~91%，约为内燃机的 3 倍；寒冷使电池内阻升高，续航缩短 10–30%',
    de:'Overall eff ~91% — ~3× better than ICE; cold increases battery resistance, reducing range 10–30%' },
];
function buildSteps() {
  const el = document.getElementById('steps'); el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click', () => { document.querySelectorAll('#steps li').forEach((x,j)=>x.classList.toggle('on',j===i)); });
    el.appendChild(li);
  });
}

function setMode(m) {
  mode = m;
  const stepMap = {accel:0, regen:4, charge:0, idle:5};
  const si = m==='regen'?4:m==='charge'?1:m==='accel'?2:5;
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===si));
  ['btnAccel','btnRegen','btnCharge','btnCold'].forEach(id=>document.getElementById(id).classList.remove('on'));
  if (m==='accel') document.getElementById('btnAccel').classList.add('on');
  if (m==='regen') document.getElementById('btnRegen').classList.add('on');
  if (m==='charge') document.getElementById('btnCharge').classList.add('on');
  setTimeout(()=>{ if (mode===m && m!=='charge') { mode='idle'; document.getElementById(`btn${m.charAt(0).toUpperCase()+m.slice(1)}`)?.classList.remove('on'); } }, 4000);
}

document.getElementById('btnAccel').addEventListener('click',()=>setMode('accel'));
document.getElementById('btnRegen').addEventListener('click',()=>setMode('regen'));
document.getElementById('btnCharge').addEventListener('click',()=>setMode('charge'));
document.getElementById('btnCold').addEventListener('click',()=>{
  coldMode = !coldMode;
  document.getElementById('btnCold').classList.toggle('on', coldMode);
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===5));
});

// ---- render loop ----
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateParticles(dt);
  updateSoc(dt);
  controls.update();
  renderer.render(scene, camera);
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

applyTheme(); applyLang(); frame();
</script>
</body></html>
