<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡尔文循环的原理 · CO₂ 如何变成糖（3D 动画）</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#5da45c;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --mint:#8fe3b0; --sky:#7dd3fc; --blue:#bfe9ff;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#388e3c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.88);
    --mint:#1e7a4a; --sky:#0369a1; --blue:#0b72b9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.st { font-size: 13px; padding: 6px 11px; border-color: rgba(125,211,166,.85); color: #c4e8b8; }
  .lbl.sub2 { font-size: 11.5px; color: var(--text2); }
  .lbl.g { border-color: rgba(232,176,74,.9); color: #ffd9a0; }
  .lbl.e { border-color: rgba(116,198,157,.85); color: #a9e8c4; }
  .lbl.teal { border-color: rgba(46,196,182,.9); color: #7fe8db; }
  .lbl.purp { border-color: rgba(167,139,250,.9); color: #d0bfff; }
  .lbl.amb { border-color: rgba(232,176,74,.9); color: #ffd9a0; }
  .lbl.a { border-color: rgba(253,230,138,.85); color: #fde68a; }
  .lbl.n { border-color: rgba(125,211,252,.85); color: #7dd3fc; }
  .lbl.spent { filter: grayscale(.95) brightness(.8); }
  :root[data-theme="light"] .lbl.st { color: #1e7a4a; }
  :root[data-theme="light"] .lbl.e { color: #1e7a4a; }
  :root[data-theme="light"] .lbl.g, :root[data-theme="light"] .lbl.amb { color: #9a6b12; }
  :root[data-theme="light"] .lbl.teal { color: #0d766e; }
  :root[data-theme="light"] .lbl.purp { color: #6d3fd4; }
  :root[data-theme="light"] .lbl.a { color: #a16207; }
  :root[data-theme="light"] .lbl.n { color: #0369a1; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 376px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.co2 { color: #8fe3b0; border-color: rgba(116,198,157,.6); }
  .chip.nrg { color: #fde68a; border-color: rgba(253,230,138,.5); }
  .chip.turn{ color: #b9c4d0; border-color: rgba(255,255,255,.22); }
  :root[data-theme="light"] .chip.co2 { color: #1e7a4a; border-color: rgba(30,122,74,.55); }
  :root[data-theme="light"] .chip.nrg { color: #a16207; border-color: rgba(161,98,7,.5); }
  :root[data-theme="light"] .chip.turn{ color: #46566a; border-color: rgba(15,25,40,.22); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(93,164,92,.14); border-color: rgba(93,164,92,.5); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #c4e8b8; }
  :root[data-theme="light"] #steps li.on .t b { color: #2f7d52; }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }

  /* ===== 碳账本（DOM HUD） ===== */
  #ledger { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 348px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 12px 16px; backdrop-filter: blur(6px); box-shadow: var(--shadow);
    transition: border-color .3s; }
  #ledger.hl { border-color: rgba(125,211,166,.85); }
  #ledger .lg-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
  .lrow { display: flex; gap: 9px; align-items: center; padding: 2.5px 0;
    font-size: 12.5px; color: var(--text2); opacity: .55; transition: opacity .3s; }
  .lrow .dot { flex: 0 0 9px; height: 9px; border-radius: 50%; background: var(--text2); opacity: .5; }
  .lrow.lit { opacity: 1; color: var(--text); }
  .lrow.lit .dot { background: var(--mint); opacity: 1; }
  .lrow.total.lit { color: var(--blue); font-weight: 600; }
  .lrow.total.lit .dot { background: var(--sky); }

  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #ledger { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="光合作用里 CO₂ 是怎么变成糖的？—— 卡尔文循环" data-en="How does CO₂ become sugar in photosynthesis? — The Calvin Cycle">光合作用里 CO₂ 是怎么变成糖的？—— 卡尔文循环</h1>
  <div class="sub" data-zh="碳固定 → 还原 → RuBP 再生 · 1 轮动画 = 3 CO₂ 总账（净得 1 G3P）· 3D 交互演示：鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Fixation → reduction → RuBP regeneration · one loop = the 3-CO₂ ledger (1 net G3P) · 3D interactive: drag to rotate / scroll to zoom · Space = play/pause">碳固定 → 还原 → RuBP 再生 · 1 轮动画 = 3 CO₂ 总账（净得 1 G3P）· 3D 交互演示：鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="ledger">
  <div class="lg-title" data-zh="碳账本（每固定 3 CO₂）" data-en="Carbon ledger (per 3 CO₂ fixed)">碳账本（每固定 3 CO₂）</div>
  <div id="lgRows"></div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip co2" data-zh="CO₂（绿球）" data-en="CO₂ (green spheres)">CO₂（绿球）</span>
    <span class="chip nrg" data-zh="ATP / NADPH（光反应供给）" data-en="ATP / NADPH (from light reactions)">ATP / NADPH（光反应供给）</span>
    <span class="chip turn" data-zh="球数 = 碳原子数" data-en="Each ball = 1 carbon atom">球数 = 碳原子数</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标注" data-en="Labels">标注</span></label>
    <label><input id="tglLedger" type="checkbox" checked> <span data-zh="碳账本" data-en="Carbon ledger">碳账本</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../photosynthesis-z-scheme/" data-zh="上游:光反应 Z 方案" data-en="upstream: light reactions (Z-scheme)">上游:光反应 Z 方案</a>
    <a href="../atp-synthase/" data-zh="ATP 从哪来:ATP 合酶" data-en="where ATP comes from: ATP synthase">ATP 从哪来:ATP 合酶</a>
    <a href="../krebs-cycle/" data-zh="另一个碳环:三羧酸循环" data-en="another carbon ring: the Krebs cycle">另一个碳环:三羧酸循环</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const D2R = Math.PI / 180;

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('卡尔文循环的原理 · CO₂ 如何变成糖（3D 动画）',
                     'Calvin Cycle · How CO₂ becomes sugar (3D animation)');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  buildLedger();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.2, 5.0, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const base = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.8, 0.14, 64),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.35;
scene.add(base);

/* ---------------- 标签注册表 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene, dyn = false) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn, dyn });
  div.textContent = textFn();
  return o;
}

/* ================= 循环环（叶绿体基质中的站位） ================= */
const R = 2.0, CYCLE = 20;
const cyc = new THREE.Group();
cyc.position.y = 0.8;
scene.add(cyc);
const polar = (deg, r = R) => new THREE.Vector3(Math.cos(deg * D2R) * r, 0, Math.sin(deg * D2R) * r);
function bez3(p0, c, p1, k) {
  const u = 1 - k;
  return new THREE.Vector3(
    u * u * p0.x + 2 * u * k * c.x + k * k * p1.x,
    u * u * p0.y + 2 * u * k * c.y + k * k * p1.y,
    u * u * p0.z + 2 * u * k * c.z + k * k * p1.z);
}
const midC = (a, b, lift = 0.8) => a.clone().add(b).multiplyScalar(0.5).add(new THREE.Vector3(0, lift, 0));

/* 底环 + 三段阶段弧（固定/还原/再生） */
const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(R, 0.045, 8, 96),
  mat(0x2a3646, { opacity: 0.55 }));
ringMesh.rotation.x = Math.PI / 2;
cyc.add(ringMesh);
class ArcCurve extends THREE.Curve {
  constructor(a0, a1) { super(); this.a0 = a0; this.a1 = a1; }
  getPoint(t, target = new THREE.Vector3()) {
    const a = (this.a0 + (this.a1 - this.a0) * t) * D2R;
    return target.set(Math.cos(a) * R, 0, Math.sin(a) * R);
  }
}
const STAGES = [
  { a0: -92, a1: -18, c: 0x2ec4b6, name: '碳固定（羧化）', ne: 'Carbon fixation' },
  { a0: -12, a1: 66,  c: 0xa78bfa, name: '还原',           ne: 'Reduction' },
  { a0: 84,  a1: 268, c: 0xe8b04a, name: 'RuBP 再生',      ne: 'RuBP regeneration' },
];
const stageMeshes = STAGES.map(s => {
  const m = new THREE.Mesh(new THREE.TubeGeometry(new ArcCurve(s.a0, s.a1), 40, 0.085, 10, false),
    mat(s.c, { opacity: 0.4, emissiveIntensity: 0.4 }));
  cyc.add(m);
  return m;
});
STAGES.forEach((s, i) => {
  const mid = (s.a0 + s.a1) / 2;
  addLabel(() => L(s.name, s.ne), polar(mid, R + 0.62).setY(0.3), ['teal', 'purp', 'amb'][i], cyc);
});
/* 方向箭头 ×2 */
for (const a of [-33, 176]) {
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.22, 10), mat(0x8b97a8, { opacity: 0.95 }));
  cone.position.copy(polar(a));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
    new THREE.Vector3(-Math.sin(a * D2R), 0, Math.cos(a * D2R)));
  cyc.add(cone);
}

/* 站位角度（与原 2D 布局一致） */
const A_RUBP = -90, A_RUB = -52, A_PGA = -2, A_G3P = 62, A_REG = 175;
const P_RUBP = polar(A_RUBP), P_RUB = polar(A_RUB), P_PGA = polar(A_PGA),
      P_G3P = polar(A_G3P), P_REG = polar(A_REG);

/* ================= 碳点分子卡片 ================= */
function makeCard(nC, accent, textFn, cls = '', dynLbl = false, dotR = 0.105) {
  const g = new THREE.Group();
  const pr = nC * 0.155 + 0.13;
  const plateM = mat(0x1c2531, { opacity: 0.92, roughness: 0.7, metalness: 0.1 });
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(pr, pr, 0.05, 28), plateM);
  g.add(plate);
  const rimM = mat(accent, { opacity: 0.95, emissiveIntensity: 0.55 });
  const rim = new THREE.Mesh(new THREE.TorusGeometry(pr, 0.02, 8, 44), rimM);
  rim.rotation.x = Math.PI / 2; rim.position.y = 0.028;
  g.add(rim);
  const dotM = mat(0x55677c, { roughness: 0.3, metalness: 0.2, emissiveIntensity: 0.08 });
  for (let i = 0; i < nC; i++) {
    const d = new THREE.Mesh(new THREE.SphereGeometry(dotR, 16, 12), dotM);
    d.position.set((i - (nC - 1) / 2) * (dotR * 2.45), dotR + 0.07, 0);
    g.add(d);
  }
  const lb = addLabel(textFn, new THREE.Vector3(0, 0.6, 0), cls, g, dynLbl);

/* ================= 每帧场景编排（纯函数 of t，可拖动相位） ================= */
function applyScene(t) {
  const si = stepIndex(t);
  /* 阶段弧高亮 */
  STAGES.forEach((s, i) => {
    const on = si >= 5 ||
      (i === 0 && si <= 1) || (i === 1 && (si === 2 || si === 3)) || (i === 2 && si === 4);
    stageMeshes[i].material.opacity = on ? 0.95 : 0.35;
    stageMeshes[i].material.emissiveIntensity = on ? 0.7 : 0.25;
  });
  /* RuBP：固定时被消耗，再生后回归 */
  const rA = clamp((1 - ss(0.10, 0.17, t)) + ss(0.88, 0.95, t), 0, 1);
  setCardAlpha(rubpCard, rA);
  rubpCard.rimM.color.set(t < 0.22 ? 0x2ec4b6 : 0xe8b04a);
  rubpCard.rimM.emissive.set(rubpCard.rimM.color);
  /* CO₂ 飞入 + 到达闪光 */
  let fFix = -1;
  for (const c of co2s) {
    const on = t >= c.a && t <= c.a + c.d + 0.02;
    c.m.visible = on;
    if (!on) { if (c.lb) c.lb.element.style.opacity = 0; continue; }
    const k = ss(c.a, c.a + c.d, t);
    c.m.position.copy(bez3(CO2_FROM, CO2_CTRL, P_RUB, k));
    const a = 1 - ss(c.a + c.d, c.a + c.d + 0.02, t);
    c.m.material.opacity = a;
    if (c.lb) c.lb.element.style.opacity = k < 0.7 ? 1 : 0;
    if (k >= 1) fFix = Math.max(fFix, ss(c.a + c.d, c.a + c.d + 0.02, t));
  }
  if (fFix >= 0 && fFix < 1) {
    flashFix.visible = true;
    flashFix.scale.setScalar(1 + 2.4 * fFix);
    flashFix.material.opacity = 0.8 * (1 - fFix);
  } else flashFix.visible = false;
  /* 分裂：Rubisco → 3-PGA 的两个 3C 小卡 */
  splitMinis.forEach((c, i) => {
    const on = t >= 0.12 && t < 0.24;
    if (!on) { setCardAlpha(c, 0); return; }
    const k = ss(0.12, 0.22, t);
    const p = bez3(P_RUB, midC(P_RUB, P_PGA, 0.55), P_PGA, k);
    const off = (i ? 1 : -1) * 0.22 * (1 - k);
    c.g.position.set(p.x + off, p.y, p.z - off * 0.4);
    setCardAlpha(c, 1 - ss(0.20, 0.24, t));
  });
  /* 3-PGA → G3P：还原期沿弧移动并换名 */
  const morphK = ss(0.44, 0.58, t);
  if (morphK > 0 || t < 0.44) {
    morphCard.g.position.copy(polar(lerp(A_PGA, A_G3P, morphK)));
    setCardAlpha(morphCard, ss(0.16, 0.24, t) * (1 - ss(0.70, 0.74, t)));
    morphCard.rimM.color.set(t >= 0.50 ? 0xa78bfa : 0x2ec4b6);
    morphCard.rimM.emissive.set(morphCard.rimM.color);
  } else setCardAlpha(morphCard, 0);
  /* 离场金卡 G3P ×1 */
  if (t >= 0.60 && t < 0.72) {
    exitCard.g.position.copy(bez3(P_G3P, EXIT_CTRL, EXIT_END, ss(0.60, 0.70, t)));
    setCardAlpha(exitCard, 1 - ss(0.70, 0.72, t));
  } else setCardAlpha(exitCard, 0);
  /* 再生：5 个 3C 小卡沿弧回到顶部 */
  regenMinis.forEach((c, i) => {
    const a = 0.72 + i * 0.025;
    const on = t >= a && t <= a + 0.17;
    if (!on) { setCardAlpha(c, 0); return; }
    const k = ss(a, a + 0.16, t);
    c.g.position.copy(polar(lerp(A_G3P, 270, k), R + (i % 2 ? 0.22 : -0.18)));
    setCardAlpha(c, 1 - ss(a + 0.15, a + 0.17, t));
  });
  /* 再生闪光 */
  if (t >= 0.88 && t < 0.97) {
    const f = ss(0.88, 0.97, t);
    flashReg.visible = true;
    flashReg.scale.setScalar(1 + 2.6 * f);
    flashReg.material.opacity = 0.8 * (1 - f);
  } else flashReg.visible = false;
  /* ATP / NADPH 芯片：飞出 → 到达 → 变灰折返 */
  for (const c of chips) {
    let vis = t >= c.outA, alpha = 1;
    let pos;
    if (!vis) pos = c.from;
    else if (t < c.backA) { pos = bez3(c.from, c.ctrl, c.to, ss(c.outA, c.outA + c.outD, t)); c.spent = false; }
    else {
      const kb = ss(c.backA, c.backA + c.backD, t);
      if (kb >= 1) vis = false;
      pos = bez3(c.to, c.ctrl, c.from, kb);
      c.spent = true; alpha = 1 - 0.3 * kb;
    }
    c.m.visible = vis;
    c.lb.element.style.opacity = vis ? alpha : 0;
    if (vis) {
      c.m.position.copy(pos);
      c.m.material.opacity = alpha;
      c.lb.element.classList.toggle('spent', c.spent);
    }
  }
  /* 公式字幕淡入淡出 */
  for (const c of CAPS)
    c.o.element.style.opacity = ss(c.a, c.a + 0.03, t) * (1 - ss(c.b - 0.03, c.b, t));
  /* 账本 */
  updateLedger(t);
}

let last = performance.now(), rafId = 0;
function frame(now) {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;
  if (playing) cycles += dt * speed / CYCLE;
  const t = cycles - Math.floor(cycles);
  tNow = t;

  applyScene(t);

  /* 基质颗粒缓慢漂移 */
  for (let i = 0; i < P_COUNT; i++) {
    const p = pBase[i];
    pDummy.position.set(p.x, p.y + Math.sin(tSim * p.sp + p.ph) * 0.15, p.z);
    pDummy.updateMatrix();
    parts.setMatrixAt(i, pDummy.matrix);
  }
  parts.instanceMatrix.needsUpdate = true;

  /* 动态标签文本刷新 */
  for (const r of labelRegistry) if (r.dyn) r.o.element.textContent = r.text();

  const si = stepIndex(t);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { last = performance.now(); rafId = requestAnimationFrame(frame); }
});

buildSteps();
buildLedger();
applyTheme();
applyLang();
setPlayLabel();
rafId = requestAnimationFrame(frame);
</script>
</body>
</html>
