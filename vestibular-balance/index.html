<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前庭与平衡 · 耳朵里的陀螺仪</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.v { border-color: rgba(178,130,255,.9); color: #e4d4ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.v { color:#6741d9; }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }
  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="前庭与平衡:耳朵里的陀螺仪" data-en="Vestibular & Balance: The Gyroscope in Your Ear">前庭与平衡:耳朵里的陀螺仪</h1>
  <div class="sub" data-zh="内耳三根互相垂直的半规管是一套生物陀螺仪:头一转,管壁跟着走、内淋巴因惯性赖着不走,壶腹嵴里的毛细胞被顶弯,放电率随角加速度变化;匀速转一会儿它又「习惯了」——所以急停之后内淋巴还在流,眼震与眩晕都是它的余波;耳石器官用碳酸钙小晶体称量重力与直线加速度;大脑把前庭+视觉+本体觉三路信号融合成平衡感 · 3D 交互演示 · 拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Three mutually perpendicular semicircular canals form a biological gyroscope: when the head turns, the canal walls move but the endolymph lags by inertia, bending the hair cells of the crista so their firing rate tracks angular acceleration; spin steadily and it 'adapts' — which is why after a sudden stop the fluid keeps flowing, and nystagmus with dizziness is its aftermath; the otolith organs weigh gravity and linear acceleration with tiny calcite crystals; the brain fuses vestibular + visual + proprioceptive signals into balance · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">前庭与平衡:耳朵里的陀螺仪</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="角速度 ω" data-en="Angular vel. ω">角速度 ω</span><span class="v" id="stW">—</span>
  <span class="k" data-zh="角加速度 α" data-en="Angular acc. α">角加速度 α</span><span class="v warn" id="stA">—</span>
  <span class="k" data-zh="壶腹嵴放电 L / R" data-en="Firing L / R">壶腹嵴放电 L / R</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="知觉旋转 / 实际" data-en="Perceived / actual">知觉旋转 / 实际</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="眼震慢相速度" data-en="Slow-phase vel.">眼震慢相速度</span><span class="v bad" id="stN">—</span>
</div>

<div id="plot">
  <h3 data-zh="放电率 vs 时间:起点爆发 → 适应 → 急停反冲" data-en="Firing rate vs time: onset burst → adaptation → stop rebound">放电率 vs 时间:起点爆发 → 适应 → 急停反冲</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="三管=三个正交平面" data-en="three canals = three orthogonal planes">三管=三个正交平面</span>
    <span class="chip.g" data-zh="金嵴=壶腹嵴毛细胞" data-en="gold crest = crista hair cells">金嵴=壶腹嵴毛细胞</span>
    <span class="chip.b" data-zh="青点=内淋巴(会赖着不走)" data-en="cyan dots = endolymph (it lags)">青点=内淋巴(会赖着不走)</span>
    <span class="chip.o" data-zh="白晶=耳石(称重力)" data-en="white crystals = otoliths (weigh gravity)">白晶=耳石(称重力)</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnSpin" data-zh="启动转椅" data-en="start spin">启动转椅</button>
    <button class="abtn" id="btnLift" data-zh="电梯升降" data-en="elevator ride">电梯升降</button>
    <button class="abtn" id="btnStop" data-zh="急停" data-en="sudden stop">急停</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="峰值角速度" data-en="Peak angular vel.">峰值角速度</label><input id="w" type="range" min="30" max="360" step="10" value="180"><span class="val" id="wVal">180°/s</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglEyes" type="checkbox" checked> <span data-zh="眼震叠加" data-en="eye overlay">眼震叠加</span></label>
      <label><input id="tglVision" type="checkbox" checked> <span data-zh="视觉在环" data-en="vision on">视觉在环</span></label>
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cochlea/" data-zh="隔壁的同款毛细胞:耳蜗" data-en="the neighboring hair cells: cochlea">隔壁的同款毛细胞:耳蜗</a>
    <a href="../gyroscopic-precession/" data-zh="物理版陀螺:进动" data-en="the physical gyroscope: precession">物理版陀螺:进动</a>
    <a href="../action-potential/" data-zh="放电如何编码强度" data-en="how spikes encode intensity">放电如何编码强度</a>
    <a href="../eye-vision/" data-zh="VOR 的另一半:眼睛" data-en="the other half of VOR: the eyes">VOR 的另一半:眼睛</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x18243a, 16, 40);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
  scene.fog.color = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('前庭与平衡 · 耳朵里的陀螺仪', 'Vestibular & Balance · The Gyroscope in Your Ear');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
camera.position.set(4.6, 3.4, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 26;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(5, 9, 7);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 生理模型 ================= */
const TAU_E = 6;
const OMEGA_REF = 60;
let wPeak = clamp(qsFloat('w', 180), 30, 360);
let omega = 0, omegaE = 0;
let headYaw = 0, linAcc = 0, netG = 1;
let mode = 'idle';
let modeT = 0;
let visionOn = true;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let labelsOn = qsBool('labels', true);
let spinOn = qsBool('spin', true);
let pupilX = 0, snapCooldown = 0;
const cupula = () => clamp((omega - omegaE) / OMEGA_REF, -1.5, 1.5);
const fireL = () => 70 + 40 * clamp(cupula(), -1, 1);
const fireR = () => 70 - 40 * clamp(cupula(), -1, 1);
const perceived = () => clamp(cupula(), -1.2, 1.2) * 120;

/* ================= 场景 ================= */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const boneBox = new THREE.Mesh(new THREE.SphereGeometry(2.5, 28, 20),
  mat(0xe8d8c4, { opacity: 0.1, roughness: 0.6 }));
boneBox.scale.set(1, 1.15, 1);
scene.add(boneBox);

const headGroup = new THREE.Group();
scene.add(headGroup);

const canals = [];
function makeCanal(orient, name) {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.09, 12, 60),
    mat(0x5ec8ff, { opacity: 0.55, roughness: 0.2 }));
  g.add(ring);
  const amp = new THREE.Mesh(new THREE.SphereGeometry(0.24, 18, 14),
    mat(0x8fd4ff, { opacity: 0.75 }));
  amp.position.set(0.95, 0, 0);
  g.add(amp);
  const cupula = new THREE.Mesh(new THREE.CircleGeometry(0.17, 20),
    mat(0xffd43b, { opacity: 0.95, side: THREE.DoubleSide, emissiveIntensity: 0.6 }));
  cupula.position.set(0.82, 0, 0);
  cupula.rotation.y = Math.PI / 2;
  g.add(cupula);
  if (orient === 'horiz') g.rotation.x = Math.PI / 2;
  else if (orient === 'ante') { g.rotation.z = -0.8; g.rotation.y = 0.4; }
  else if (orient === 'post') { g.rotation.z = 0.8; g.rotation.y = -0.4; }
  headGroup.add(g);
  canals.push({ g, cupula, orient, name });
  return g;
}

/* ================= 运动 ================= */
function startSpin() {
  mode = 'spin';
  modeT = 0;
}
function startLift() {
  mode = 'lift';
  modeT = 0;
}
function suddenStop() {
  omega = 0;
  mode = 'idle';
}
function resetAll() {
  mode = 'idle';
  omega = 0; omegaE = 0; headYaw = 0; linAcc = 0; netG = 1;
  pupilX = 0;
  hist.n = 0; hist.head = 0;
}
function profile() {
  if (mode === 'spin') {
    modeT += 0.016;
    const RAMP = 2, HOLD = 8;
    if (modeT < RAMP) omega = wPeak * modeT / RAMP;
    else if (modeT < RAMP + HOLD) omega = wPeak;
    else if (modeT < RAMP + HOLD + 2) omega = wPeak * (1 - (modeT - RAMP - HOLD) / 2);
    else { omega = 0; mode = 'idle'; }
  }
  if (mode === 'lift') {
    modeT += 0.016;
    const RAMP = 1.6, HOLD = 2.4;
    if (modeT < RAMP) linAcc = 2.0 * (modeT / RAMP);
    else if (modeT < RAMP + HOLD) linAcc = 0;
    else if (modeT < RAMP + HOLD + RAMP) linAcc = -2.0 * (modeT - RAMP - HOLD) / RAMP;
    else { linAcc = 0; mode = 'idle'; }
  }
}

/* ================= 步骤 ================= */

    act: () => { if (omega === 0) { startSpin(); modeT = 8.5; } suddenStop(); } },

function stepIndex() {
  if (mode === 'lift' || Math.abs(linAcc) > 0.05) return 5;
  if (omega === 0 && Math.abs(cupula()) > 0.12) return 4;
  if (omega > 0.9 * wPeak && Math.abs(cupula()) < 0.2) return 3;
  if (omega > 0) return 1;
  return 0;
}
function buildSteps() {

/* ================= 历史 & 曲线 ================= */
const HN = 450;
const hist = { w: new Float32Array(HN), p: new Float32Array(HN), fL: new Float32Array(HN), fR: new Float32Array(HN), n: 0, head: 0 };
function pushHist() {
  const k = hist.head;
  hist.w[k] = omega; hist.p[k] = perceived(); hist.fL[k] = fireL(); hist.fR[k] = fireR();
  hist.head = (hist.head + 1) % HN;
  hist.n = Math.min(HN, hist.n + 1);
}
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  if (hist.n < 2) return;
  const pad = 16, padB = 20;
  const mid = 10 + (H - padB - 10) / 2;
  const yOf = v => mid - clamp(v / 260, -1, 1) * (H - padB - 10) / 2;
  ctx.strokeStyle = 'rgba(138,154,178,.4)';
  ctx.beginPath();
  ctx.moveTo(pad, mid);
  ctx.lineTo(W - pad, mid);
  ctx.stroke();
  const lines = [
    [hist.w, 'rgba(255,255,255,.55)', 1.5],
    [hist.p, 'rgba(255,169,77,.9)', 2],
    [hist.fL, 'rgba(116,220,132,.9)', 2],
    [hist.fR, 'rgba(255,107,107,.9)', 2],
  ];
  for (const [arr, col, lw] of lines) {
    ctx.strokeStyle = col;
    ctx.lineWidth = lw;
    ctx.beginPath();
    for (let i = 0; i < hist.n; i++) {
      const k = (hist.head - hist.n + i + HN) % HN;
      const x = pad + i / (HN - 1) * (W - pad * 2);
      i === 0 ? ctx.moveTo(x, yOf(arr[k])) : ctx.lineTo(x, yOf(arr[k]));
    }
    ctx.stroke();
  }
  const css = getComputedStyle(document.documentElement);
  ctx.fillStyle = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  ctx.font = '14px sans-serif';
  ctx.fillText(L('白=实际ω 橙=知觉 绿/红=左右放电', 'white=actual ω amber=perceived green/red=L/R firing'), pad + 4, H - 6);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elW = document.getElementById('w'), elWVal = document.getElementById('wVal');
const stW = document.getElementById('stW'), stA = document.getElementById('stA'), stF = document.getElementById('stF'),
  stP = document.getElementById('stP'), stN = document.getElementById('stN');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncSliders() {
  elW.value = wPeak; elWVal.textContent = wPeak + '°/s';
}
function updateFormula() {
  const c = cupula();
  formulaEl.innerHTML = L(
    `dω<sub>e</sub>/dt = (ω − ω<sub>e</sub>)/τ, τ ≈ 6 s · 壶腹嵴信号 ∝ (ω−ω<sub>e</sub>) = <b>${(omega - omegaE).toFixed(0)} °/s²当量</b><br>` +
    `放电 = 70 ± 40·信号 → L <b>${fireL().toFixed(0)}</b> / R <b>${fireR().toFixed(0)}</b> spikes/s · 知觉旋转 <b>${perceived().toFixed(0)} °/s</b>(实际 ${omega.toFixed(0)})`,
    `dω<sub>e</sub>/dt = (ω − ω<sub>e</sub>)/τ, τ ≈ 6 s · cupula signal ∝ (ω−ω<sub>e</sub>) = <b>${(omega - omegaE).toFixed(0)} °/s²-eq</b><br>` +
    `firing = 70 ± 40·signal → L <b>${fireL().toFixed(0)}</b> / R <b>${fireR().toFixed(0)}</b> spikes/s · perceived <b>${perceived().toFixed(0)} °/s</b> (actual ${omega.toFixed(0)})`);
}
document.getElementById('btnSpin').addEventListener('click', () => startSpin());
document.getElementById('btnLift').addEventListener('click', () => startLift());
document.getElementById('btnStop').addEventListener('click', () => suddenStop());
document.getElementById('btnReset').addEventListener('click', () => { resetAll(); syncAll(); });
elW.addEventListener('input', () => { wPeak = +elW.value; syncAll(); });
document.getElementById('tglEyes').addEventListener('change', e => { eyes.visible = e.target.checked; });
document.getElementById('tglVision').addEventListener('change', e => { visionOn = e.target.checked; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });

controls.autoRotate = spinOn;
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});
function syncAll() { syncSliders(); updateFormula(); drawPlot(); }

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, statsAcc = 0, histAcc = 0;
const dummy = new THREE.Object3D();
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const t = clock.elapsedTime;
  const dt = dt0 * (playing ? speed : 0);
  if (dt > 0) {
    profile();
    omegaE += (omega - omegaE) * dt / TAU_E;
    headYaw += omega * Math.PI / 180 * dt;
    netG = 1 + linAcc / 9.81;
    const c = cupula();
    headGroup.rotation.y = headYaw;
    for (const cn of canals) cn.cupula.rotation.z = -c * 0.55;
    otolith.position.y = 0.42 + clamp((netG - 1) * 0.3, -0.18, 0.18);
    utricle.scale.setScalar(1 + Math.abs(c) * 0.04);
    for (let i = 0; i < CN; i++) {
      const p = eP[i];
      p.psi += (omega - omegaE) * Math.PI / 180 * dt * 0.55;
      const rr = p.canal === 0 ? p.rho + Math.sin(t * 2 + p.seed) * 0.05 : p.rho * 0.8;
      const yOff = p.canal === 0 ? Math.sin(t + p.seed) * 0.04 : 0.2 * (p.canal - 1);
      dummy.position.set(rr * Math.cos(p.psi), yOff + p.y, rr * Math.sin(p.psi));
      dummy.updateMatrix();
      endo.setMatrixAt(i, dummy.matrix);
    }
    endo.instanceMatrix.needsUpdate = true;
    /* VOR + 眼震 */
    const vorGain = visionOn ? 0.85 : 0;
    const slow = clamp(c * (1 - vorGain * 0.9), -1, 1);
    if (eyes.visible) {
      if (Math.abs(slow) > 0.08) {
        pupilX += slow * dt * 0.5;
        snapCooldown -= dt;
        if (Math.abs(pupilX) > 0.16 && snapCooldown <= 0) { pupilX = 0; snapCooldown = 0.18; }
      } else pupilX *= 1 - clamp(dt * 4, 0, 1);
      pupilX = clamp(pupilX, -0.22, 0.22);
      for (const p of pupils) p.position.x = pupilX * 1.6;
    }
    labWorld.visible = true;
    labH.visible = labAm.visible = labOto.visible = labA.visible = labEye.visible = true;
    refreshLabels();
    pushHist();
    histAcc += dt;
    if (histAcc > 1 / 30) histAcc = 0;
    statsAcc += dt0;
    if (statsAcc > 0.15) {
      statsAcc = 0;
      const alpha = (omega - omegaE) / Math.max(TAU_E, 0.1);
      stW.innerHTML = omega.toFixed(0) + '<small>°/s</small>';
      stA.innerHTML = alpha.toFixed(0) + '<small>°/s²</small>';
      stF.innerHTML = fireL().toFixed(0) + ' / ' + fireR().toFixed(0) + '<small>sp/s</small>';
      stP.innerHTML = perceived().toFixed(0) + ' / ' + omega.toFixed(0) + '<small>°/s</small>';
      stN.innerHTML = Math.abs(slow * 120).toFixed(0) + '<small>°/s</small>';
      updateFormula();
      drawPlot();
    }
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

const ph0 = Math.round(qsFloat('phase', 0));
if (ph0 >= 1 && ph0 <= 6) STEPS[ph0 - 1].act();
else if (qsFloat('t', 0) > 0) startSpin();
applyTheme();
applyLang();
syncAll();
start();
</script>
