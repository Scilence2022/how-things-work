<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜗杆自锁 · 升角小于摩擦角,谁也倒不了它</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#74c0fc;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1971c2;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.w { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.g { border-color: rgba(67,209,124,.9); color: #c9f3da; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.w { border-color: rgba(25,113,194,.9); color: #1971c2; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.b { color: #74c0fc; }
  #stats .v.lock { color: #43d17c; }
  #stats .v.open { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.w { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.g { color: #c9f3da; border-color: rgba(67,209,124,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #actions { display: flex; gap: 8px; margin: 8px 0 2px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(67,209,124,.6); background: rgba(67,209,124,.12); color: var(--text); }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(116,192,252,.10); border-color: rgba(116,192,252,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(25,113,194,.08); border-color: rgba(25,113,194,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #a5d8ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="蜗杆自锁：升角小于摩擦角，重物倒不了它" data-en="Worm Drive Self-Lock: lead angle vs friction angle">蜗杆自锁：升角小于摩擦角，重物倒不了它</h1>
  <div class="sub" data-zh="一根螺旋压着一枚齿轮:正转省力举重物;反向推蜗轮,升角 < 摩擦角时整体锁死——电梯和千斤顶的命根子 · 空格播放/暂停" data-en="A screw driving a gear: easy forward lift; back-drive it and, when lead angle < friction angle, everything locks — why elevators trust worms · Space = play/pause">一根螺旋压着一枚齿轮:正转省力举重物;反向推蜗轮,升角 < 摩擦角时整体锁死——电梯和千斤顶的命根子 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="升角 γ" data-en="lead angle γ">升角 γ</span><span class="v b" id="stL">—</span>
  <span class="k" data-zh="摩擦角 φ" data-en="friction φ">摩擦角 φ</span><span class="v" id="stF">—</span>
  <span class="k" data-zh="减速比" data-en="reduction">减速比</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="状态" data-en="state">状态</span><span class="v lock" id="stS">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip w" data-zh="蜗杆(输入/手轮)" data-en="worm (input/crank)">蜗杆(输入/手轮)</span>
    <span class="chip g" data-zh="蜗轮 + 卷筒 + 重物" data-en="wheel + drum + load">蜗轮 + 卷筒 + 重物</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnRev" data-zh="按住:从重物一侧反向摇(倒转测试)" data-en="hold: back-drive from the load side">按住:从重物一侧反向摇(倒转测试)</button>
  </div>
  <div class="row"><label data-zh="蜗杆升角 γ" data-en="lead angle γ">蜗杆升角 γ</label><input id="lead" type="range" min="4" max="240" step="4" value="24"><span class="val" id="leadVal">6.0°</span></div>
  <div class="row"><label data-zh="正转摇速" data-en="crank speed">正转摇速</label><input id="spd" type="range" min="10" max="100" step="5" value="45"><span class="val" id="spdVal">0.45×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../ratchet-pawl/" data-zh="棘轮:几何自锁的另一路" data-en="ratchet: geometric locking">棘轮:几何自锁的另一路</a>
    <a href="../planetary-gears/" data-zh="行星轮系:另一种变速哲学" data-en="planetary gears: another ratio play">行星轮系:另一种变速哲学</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.frame.color.set(THEME === 'light' ? 0x9aa4b2 : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('蜗杆自锁 · 升角 vs 摩擦角', 'Worm Drive · lead vs friction angle');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(5.6, 3.6, 7.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  frame: mat(0x39424f, { roughness: 0.7 }),
  worm: mat(0x74c0fc, { metalness: 0.6, roughness: 0.3 }),
  wheel: mat(0x51cf66, { metalness: 0.5, roughness: 0.4 }),
  steel: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  drum: mat(0x8a93a3, { metalness: 0.5, roughness: 0.5 }),
  rope: mat(0xb08a5f, { roughness: 0.8 }),
  load: mat(0xff9f28, { roughness: 0.6 }),
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  heat: new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.0, depthWrite: false }),
  crank: mat(0xffd166, { metalness: 0.4, roughness: 0.4 }),
};

/* ================= 场景 ================= */
/* 蜗杆(输入,水平,沿 x 轴) */
const WORM_Z = 20;              // 蜗轮 20 齿 → 单头蜗杆减速 20:1
const wormGrp = new THREE.Group();
wormGrp.position.set(-1.5, 1.7, 0.95);
scene.add(wormGrp);
const wormShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.6, 14), M.steel);
wormShaft.rotation.z = Math.PI / 2;
wormGrp.add(wormShaft);
const wormThread = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1.1, 20, 1, true),
  new THREE.MeshStandardMaterial({ color: 0x74c0fc, metalness: 0.6, roughness: 0.3, transparent: true, opacity: 0.55 }));
wormThread.rotation.z = Math.PI / 2;
wormGrp.add(wormThread);
/* 螺旋线(单头,升角可视化:螺距随升角变) */
let wormHelix = null;
function buildHelix(leadAngle) {
  if (wormHelix) { wormGrp.remove(wormHelix); wormHelix.geometry.dispose(); }
  const pts = [];
  const lead = Math.tan(leadAngle * Math.PI / 180) * Math.PI * 0.44;   // 每圈前进量
  const N = 90;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const a = t * Math.PI * 2 * 5;
    pts.push(new THREE.Vector3(-0.55 + t * 1.1, Math.sin(a) * 0.22, Math.cos(a) * 0.22));
  }
  void lead;
  const curve = new THREE.CatmullRomCurve3(pts);
  wormHelix = new THREE.Mesh(new THREE.TubeGeometry(curve, 140, 0.045, 8, false), M.worm);
  wormGrp.add(wormHelix);
}
/* 手轮(输入端) */
const crankGrp = new THREE.Group();
crankGrp.position.x = -1.45;
wormGrp.add(crankGrp);
const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.045, 10, 32), M.crank);
crankGrp.add(wheel);
const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.05), M.crank);
crankGrp.add(spoke);
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), M.load);
knob.position.x = 0.3;
crankGrp.add(knob);

/* 蜗轮(输出,竖轴) + 卷筒 + 重物 */
const wheelGrp = new THREE.Group();
wheelGrp.position.set(0.2, 1.7, 0);
scene.add(wheelGrp);
function gearTeethFlat(radius, teeth, thickness, toothH, material) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, thickness, 48), material);
  g.add(body);
  const toothW = Math.max(Math.PI * radius / teeth * 0.48, 0.05);
  const geo = new THREE.BoxGeometry(toothW, toothH, thickness * 0.9);
  for (let i = 0; i < teeth; i++) {
    const t = new THREE.Mesh(geo, material);
    const a = i / teeth * Math.PI * 2;
    t.position.set(Math.cos(a) * (radius + toothH / 2), 0, Math.sin(a) * (radius + toothH / 2));
    t.rotation.y = -a;
    g.add(t);
  }
  g.position.y = thickness / 2;
  return g;
}
const wGear = gearTeethFlat(0.72, WORM_Z, 0.3, 0.1, M.wheel);
wGear.position.y = -0.15;
wheelGrp.add(wGear);
const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.42, 24), M.drum);
drum.position.y = 0.35;
wheelGrp.add(drum);
const shaftV = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.6, 12), M.steel);
shaftV.position.y = 0.1;
wheelGrp.add(shaftV);
/* 吊绳与重物 */
const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1, 8), M.rope);
scene.add(rope);
const loadBox = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), M.load);
scene.add(loadBox);
/* 机架 */
const floor = new THREE.Mesh(new THREE.BoxGeometry(7, 0.18, 4), M.floor);
floor.position.y = -0.09;
scene.add(floor);
const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.15, 0.5), M.frame);
pillar.position.set(0.2, 0.55, -0.6);
scene.add(pillar);
const bearing = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.4), M.frame);
bearing.position.set(-1.5, 1.7, 0.95);
scene.add(bearing);
/* 摩擦热斑(自锁反推时显示) */
const heatMesh = new THREE.Mesh(new THREE.TorusGeometry(0.74, 0.05, 8, 40), M.heat);
heatMesh.rotation.x = Math.PI / 2;
heatMesh.position.y = 0.02;
wheelGrp.add(heatMesh);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let leadAngle = 6.0;                    // 度
const MU = 0.15;                        // 摩擦系数 → 摩擦角
const FRICTION_ANGLE = Math.atan(MU) * 180 / Math.PI;   // ≈8.53°
let crankOn = false;                    // 按住反向摇(倒转测试)
let thetaWorm = 0, thetaWheel = 0;
let wheelV = 0;
let loadH = 0.6;                        // 重物高度
let inputSpeed = 0.45;
const selfLocking = () => leadAngle < FRICTION_ANGLE;
const reduction = () => WORM_Z;         // 单头

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblWorm = addLabel(() => L(`蜗杆(单头,γ=${leadAngle.toFixed(1)}°)`, `worm (single-start, γ=${leadAngle.toFixed(1)}°)`),
  new THREE.Vector3(0, 0.55, 0), 'w', wormGrp);
const lblWheel = addLabel(() => L(`蜗轮 20 齿 → 20:1`, `wheel 20T → 20:1`), new THREE.Vector3(0.95, 0.5, 0), 'g', wheelGrp);
const lblLoad = addLabel(() => L('重物', 'load'), new THREE.Vector3(0.75, 0, 0), 'g', loadBox);
const lblStatus = addLabel(() => selfLocking()
  ? L(`自锁:γ ${leadAngle.toFixed(1)}° < 摩擦角 ${FRICTION_ANGLE.toFixed(1)}°——反向推不动`, `self-locking: γ ${leadAngle.toFixed(1)}° < φ ${FRICTION_ANGLE.toFixed(1)}°`)
  : L(`不锁:γ ${leadAngle.toFixed(1)}° > 摩擦角——重物能倒转蜗杆!`, `NOT locked: γ > φ — the load can back-drive!`),
  new THREE.Vector3(0, 3.7, 0), selfLocking() ? 'st' : 'bad');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '一根螺旋压着一枚齿轮', be: 'A screw against a wheel',
    d: '蜗杆转一圈,只能把蜗轮推过一个齿——单头蜗杆 20:1 减速,一级顶普通齿轮系三四级。',
    de: 'One worm turn advances the wheel a single tooth — 20:1 in one stage, where normal gears need three or four.',
    act: () => { leadAngle = 6; document.getElementById('lead').value = 24; syncLead(); } },
  { b: '正转:省力举重物', be: 'Forward: lift with ease',
    d: '手轮慢慢摇,重物稳稳升——大减速比把「小力慢摇」换成了「大力慢举」,杠杆换了个方向。',
    de: 'Crank slowly, the load rises steadily — big reduction trades fast hands for strong lift.',
    act: () => { leadAngle = 6; document.getElementById('lead').value = 24; syncLead(); } },
  { b: '反向推:纹丝不动', be: 'Back-drive: nothing moves',
    d: '从重物侧摇:蜗轮齿斜面把蜗杆往轴向顶,摩擦角兜住了它——升角小于摩擦角,机构几何自锁,只能发热不能转动。',
    de: 'Push from the load side: the tooth flank tries to slide the worm axially, but friction wins while lead angle < friction angle. Locked.',
    act: () => { crankOn = true; setTimeout(() => { crankOn = false; }, 2500); } },
  { b: '多头大升角:能倒转了', be: 'Multi-start: back-drivable',
    d: '把升角拉过摩擦角:螺旋变「陡」,反向推能顺着斜面滑下去——自锁失效,重物下坠反驱蜗杆。电梯不用这种。',
    de: 'Raise the lead past the friction angle and the flank slides back — self-lock lost, the load falls and spins the worm. Not for elevators.',
    act: () => { leadAngle = 22; document.getElementById('lead').value = 220; syncLead(); crankOn = true; setTimeout(() => { crankOn = false; }, 2500); } },
  { b: '谁在用这招', be: 'Who relies on this',
    d: '电梯曳引机、蜗轮千斤顶、闸阀手轮、机床分度头——「手动输入、绝不倒转」的地方,就有这条自锁不等式。',
    de: 'Elevator hoists, worm jacks, valve handwheels, dividing heads — anywhere "hand-driven, never back-driven" matters.',
    act: () => { leadAngle = 6; document.getElementById('lead').value = 24; syncLead(); } },
];
function stepIndex() {
  if (!selfLocking()) return 3;
  if (crankOn && selfLocking()) return 2;
  if (loadH > 1.2) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elLead = document.getElementById('lead');
const elLeadVal = document.getElementById('leadVal');
const btnRev = document.getElementById('btnRev');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stL = document.getElementById('stL'), stF = document.getElementById('stF'),
  stR = document.getElementById('stR'), stS = document.getElementById('stS');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncLead() {
  elLeadVal.textContent = leadAngle.toFixed(1) + '°';
  buildHelix(leadAngle);
  btnRev.classList.toggle('on', crankOn);
}
elLead.addEventListener('input', () => { leadAngle = parseInt(elLead.value, 10) / 10; syncLead(); });
elSpd.addEventListener('input', () => { inputSpeed = parseInt(elSpd.value, 10) / 100; elSpdVal.textContent = inputSpeed.toFixed(2) + '×'; });
btnRev.addEventListener('mousedown', () => { crankOn = true; btnRev.classList.add('on'); });
btnRev.addEventListener('mouseup', () => { crankOn = false; btnRev.classList.remove('on'); });
btnRev.addEventListener('mouseleave', () => { crankOn = false; btnRev.classList.remove('on'); });
btnRev.addEventListener('touchstart', () => { crankOn = true; btnRev.classList.add('on'); }, { passive: true });
btnRev.addEventListener('touchend', () => { crankOn = false; btnRev.classList.remove('on'); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let heat = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  const locked = selfLocking();

  if (playing) {
    if (crankOn) {
      /* 反向摇重物侧 */
      if (locked) {
        wheelV = 0;
        heat = Math.min(1, heat + dts * 2);
      } else {
        wheelV = lerp(wheelV, -1.1, 1 - Math.exp(-dts * 4));
      }
    } else {
      /* 正转:蜗杆匀速,蜗轮跟进(×6 视觉时基) */
      thetaWorm += inputSpeed * 6 * dts;
      wheelV = lerp(wheelV, inputSpeed * 6 / reduction(), 1 - Math.exp(-dts * 5));
      heat = Math.max(0, heat - dts * 2);
    }
    thetaWheel += wheelV * dts;
    thetaWorm += wheelV * reduction() * dts * (wheelV < 0 ? 1 : 0);
    loadH = clamp(0.35 + (thetaWheel / (Math.PI * 2)) * 0.5, 0.35, 2.3);
  }

  wormGrp.rotation.x = thetaWorm;
  crankGrp.rotation.x = thetaWorm;
  wheelGrp.rotation.y = thetaWheel;
  rope.scale.y = Math.max(loadH - 0.4, 0.05);
  rope.position.set(0.2, 0.55 + (loadH - 0.4) / 2, 0);
  loadBox.position.set(0.2, 0.55 + (loadH - 0.4) + 0.1, 0);
  M.heat.opacity = heat * 0.55;

  stL.textContent = leadAngle.toFixed(1) + '°';
  stF.textContent = FRICTION_ANGLE.toFixed(1) + '°';
  stR.textContent = reduction() + ' : 1';
  stS.textContent = locked ? L('自锁 ✓', 'SELF-LOCK ✓') : L('可倒转 ✗', 'back-drivable ✗');
  stS.className = 'v ' + (locked ? 'lock' : 'open');

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

leadAngle = clamp(qsFloat('lead', 6), 4, 24);
elLead.value = Math.round(leadAngle * 10);
syncLead();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
