<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吸积盘 · 把引力变成光</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="吸积盘 · 把引力变成光" data-en="Accretion Disk · Turning Gravity into Light">吸积盘 · 把引力变成光</h1>
  <div class="sub" data-zh="带角动量的气体落向黑洞,角动量守恒挡住直坠之路→只能绕转、摊成薄盘;差速旋转+磁湍流当刹车→角动量向外搬,质量向内螺旋→引力势能变热:T∝r^(−3/4),内缘白热上万 K、外区橙红→发光效率 ~6%,接近氢聚变 0.7% 的十倍——类星体因此是宇宙最亮 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Gas with angular momentum cannot fall straight into a black hole → it orbits and spreads into a thin disk; differential rotation plus magnetic turbulence act as brakes → angular momentum drifts outward, mass spirals inward → gravitational energy becomes heat: T ∝ r^(−3/4), a white-hot inner rim, orange outskirts → radiative efficiency ~6%, nearly ten times fusion's 0.7% — which is why quasars outshine everything · 3D interactive demo · drag to orbit · Space = run/pause">…</div>

  <span class="k" data-zh="内缘 ISCO" data-en="Inner edge ISCO">内缘 ISCO</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="发光效率 η" data-en="Efficiency η">发光效率 η</span><span class="v ok" id="stEff">—</span>
  <span class="k" data-zh="内区峰值温度" data-en="Peak temperature">内区峰值温度</span><span class="v warn" id="stT">—</span>
  <span class="k" data-zh="光度 L" data-en="Luminosity L">光度 L</span><span class="v" id="stL">—</span>

  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="白热内缘:发射 X 射线/紫外" data-en="white-hot rim: X-ray/UV">白热内缘:X 射线/紫外</span>
    <span class="chip.o" data-zh="橙红螺旋外盘:红外" data-en="orange spiral outskirts: infrared">橙红螺旋外盘:红外</span>
    <span class="chip.g" data-zh="磁湍流:角动量外流、质量内移" data-en="MRI turbulence: J out, mass in">磁湍流:角动量外流、质量内移</span>
    <span class="chip.r" data-zh="红色直落流:零角动量对照" data-en="red infall stream: zero-J control">红色直落流:零角动量对照</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnDef" data-zh="斜视" data-en="Oblique">斜视</button>
    <button class="abtn on" id="btnTop" data-zh="俯视(招牌)" data-en="Top-down (signature)">俯视(招牌)</button>
    <button class="abtn" id="btnSide" data-zh="侧视:薄盘" data-en="Edge-on: thin disk">侧视:薄盘</button>
    <button class="abtn" id="btnFall" data-zh="直落对照流" data-en="Infall control stream">直落对照流</button>
  </div>
  <div class="row"><label data-zh="黑洞自旋 a*" data-en="Black-hole spin a*">黑洞自旋 a*</label><input id="sSpin" type="range" min="-0.99" max="0.99" step="0.01" value="0.5"><span class="val" id="sSpinVal">+0.50</span></div>
  <div class="row"><label data-zh="质量 log₁₀(M/M☉)" data-en="Mass log₁₀(M/M☉)">质量 log₁₀(M/M☉)</label><input id="sMass" type="range" min="0.5" max="8.5" step="0.05" value="5.8"><span class="val" id="sMassVal">10^5.8</span></div>
  <div class="row"><label data-zh="供给率 ṁ(EDD)" data-en="Supply rate ṁ (Edd)">供给率 ṁ(EDD)</label><input id="sMd" type="range" min="0.02" max="3" step="0.01" value="0.4"><span class="val" id="sMdVal">0.40</span></div>

      <label><input id="tglChart" type="checkbox" checked> <span data-zh="温度曲线" data-en="T(r) plot">温度曲线</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢速 0.35×" data-en="Slow 0.35×">慢速 0.35×</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../black-hole-tides/" data-zh="黑洞潮汐" data-en="black-hole tides">黑洞潮汐</a>
    <a href="../angular-momentum/" data-zh="角动量守恒" data-en="angular momentum">角动量守恒</a>
    <a href="../stellar-lifecycle/" data-zh="恒星一生" data-en="stellar lifecycle">恒星一生</a>
    <a href="../spacetime-curvature/" data-zh="时空弯曲" data-en="spacetime curvature">时空弯曲</a>
    <a href="../gravitational-lensing/" data-zh="引力透镜" data-en="gravitational lensing">引力透镜</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 70, 320);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  starM.opacity = dark ? 0.9 : 0.5;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('吸积盘 · 把引力变成光', 'Accretion Disk · Turning Gravity into Light');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 900);
camera.position.set(0.01, 27, 0.01);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 220;
controls.autoRotateSpeed = 0.35;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.25);
scene.add(hemi);

/* ================= 物理常数与状态 ================= */
const Gc = 6.674e-11, Cc = 2.998e8, SB = 5.67e-8, MSUN = 1.9893e30, LSUN = 3.828e26, YR = 3.156e7;
let Mlog = clamp(qsFloat('m', 5.8), 0.5, 8.5);
let spin = clamp(qsFloat('a', 0.5), -0.99, 0.99);
let mdot = clamp(qsFloat('md', 0.4), 0.02, 3);
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let labelsOn = true, chartOn = true, slowMo = false, fallOn = false;
let phaseIdx = 0, camTween = null;
let M, rgM, xIn, xOut, horizonU, Ledd, Mdot, Tmax, eta, Lm, Porb, TnPk, xPk;
function rISCO(a) {
  const z1 = 1 + Math.cbrt(1 - a * a) * (Math.cbrt(1 + a) + Math.cbrt(1 - a));
  const z2 = Math.sqrt(3 * a * a + z1 * z1);
  return 3 + z2 - Math.sign(a || 1) * Math.sqrt((3 - z1) * (3 + z1 + 2 * z2));
}
function derive() {
  M = Math.pow(10, Mlog);                           /* 太阳质量数 */
  const Mkg = M * MSUN;
  rgM = 1477 * M;                                   /* r_g = GM/c²(每 M☉ 1477 m),米 */
  xIn = rISCO(spin);
  xOut = Math.max(14, xIn + 9);
  horizonU = 1 + Math.sqrt(1 - spin * spin);        /* 视界,单位 r_g */
  Ledd = 1.26e31 * M;                               /* 爱丁顿光度 W */
  Mdot = mdot * Ledd / (0.1 * Cc * Cc);             /* kg/s(约定 Ṁ_Edd = L_Edd/0.1c²) */
  xPk = 49 / 36 * xIn;

  Tmax = Math.pow(3 * Gc * Mkg * Mdot / (8 * Math.PI * SB * rPk ** 3), 0.25) * 0.6148;  /* 峰值有效温度 */

function fmtExp(x) {

  if (x !== 0 && (Math.abs(x) < 0.01 || Math.abs(x) >= 10000)) {
    const e = Math.floor(Math.log10(Math.abs(x)));
    const m = x / Math.pow(10, e);
    return m.toFixed(1) + '×10' + sup(e);
  }

}

const STOPS = [
  [0.00, [0.13, 0.03, 0.02]], [0.16, [0.36, 0.07, 0.02]], [0.34, [0.80, 0.22, 0.04]],
  [0.52, [1.00, 0.50, 0.13]], [0.70, [1.00, 0.76, 0.38]], [0.86, [1.00, 0.95, 0.80]], [1.00, [0.93, 0.97, 1.00]]
];
function ramp(t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const [t0, c0] = STOPS[i - 1], [t1, c1] = STOPS[i];
      const f = (t - t0) / (t1 - t0);
      return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];

  }
  return STOPS[STOPS.length - 1][1];
}

const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 52, padR = 14, padT = 16, padB = 24;
  const lg = x => Math.log10(x);
  const l0 = lg(xIn), l1 = lg(xOut);
  const tLo = Math.max(300, Tmax / 60), tHi = Tmax * 1.6;
  const xOf = x => padL + (lg(x) - l0) / (l1 - l0) * (W - padL - padR);
  const yOf = T => (H - padB) - (lg(clamp(T, tLo, tHi)) - lg(tLo)) / (lg(tHi) - lg(tLo)) * (H - padT - padB);
  ctx.font = '15px system-ui';
  ctx.fillStyle = cTxt;
  ctx.strokeStyle = 'rgba(128,150,170,.18)';
  for (let e = Math.floor(lg(tLo)); e <= Math.ceil(lg(tHi)); e++) {
    const T = Math.pow(10, e);
    if (T < tLo || T > tHi) continue;
    ctx.beginPath(); ctx.moveTo(padL, yOf(T)); ctx.lineTo(W - padR, yOf(T)); ctx.stroke();
    ctx.fillText('10' + sup(e), 6, yOf(T) + 5);
  }
  ctx.fillText('K', 6, padT + 2);
  ctx.fillText('r/r' + sup('g'), W - padR - 34, H - 6);
  /* ISCO 虚线 */
  ctx.strokeStyle = 'rgba(116,192,252,.8)';
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(xOf(xIn), padT); ctx.lineTo(xOf(xIn), H - padB); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(116,192,252,.9)';
  ctx.fillText('ISCO', xOf(xIn) + 4, padT + 12);
  /* 曲线:分段按黑体色 */
  const N = 64;
  for (let k = 0; k < N; k++) {
    const xa = xIn * Math.pow(xOut / xIn, k / N), xb = xIn * Math.pow(xOut / xIn, (k + 1) / N);
    const ci = clamp((k + 0.5) / N * 255 | 0, 0, 255);
    ctx.strokeStyle = lutCss[ci];
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(xOf(xa), yOf(Ttrue(xa)));
    ctx.lineTo(xOf(xb), yOf(Ttrue(xb)));
    ctx.stroke();
  }
  /* 峰值标记 */
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(xOf(xPk), yOf(Tmax), 3.5, 0, Math.PI * 2); ctx.fill();
}

  stP.textContent = fmtTime(Porb);
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>v = √(GM/r)</b>:ISCO 处约 ${(Math.sqrt(1 / xIn)).toFixed(2)} c;Ω∝r^(−3/2),差速剪切拉出螺旋<br>` +
    `<b>T(r) ∝ r^(−3/4)</b>:内区峰值 ${fmtExp(Tmax)} K(${band(Tmax)})→ 外区 ~${fmtExp(Ttrue(xOut))} K<br>` +
    `<b>η = 1−√(1−2/(3·r_ISCO/r_g))</b>:自旋 0 → 5.7%,极限 → 42%(当前 ${(eta * 100).toFixed(1)}%)vs 氢聚变 0.7%<br>` +
    `<b>L = η·Ṁc²</b>:当前 ${fmtExp(Lm / LSUN)} L☉ = ${(1000 * eta * mdot).toFixed(0)}% 爱丁顿光度`,
    `<b>v = √(GM/r)</b>: about ${(Math.sqrt(1 / xIn)).toFixed(2)} c at the ISCO; Ω ∝ r^(−3/2) shears out the spiral<br>` +
    `<b>T(r) ∝ r^(−3/4)</b>: peak ${fmtExp(Tmax)} K (${band(Tmax)}) at the rim → only ~${fmtExp(Ttrue(xOut))} K outside<br>` +
    `<b>η = 1−√(1−2/(3·r_ISCO/r_g))</b>: 5.7% at zero spin, 42% at the limit (now ${(eta * 100).toFixed(1)}%) vs fusion's 0.7%<br>` +
    `<b>L = η·Ṁc²</b>: now ${fmtExp(Lm / LSUN)} L☉ = ${(1000 * eta * mdot).toFixed(0)}% of Eddington`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
function applySpin() { derive(); rebuildInner(); buildLUT(); syncSliders(); updateStats(); updateFormula(); drawPlot(); }
elSpin.addEventListener('input', () => { spin = +elSpin.value; applySpin(); });
elMass.addEventListener('input', () => { Mlog = +elMass.value; derive(); syncSliders(); updateStats(); updateFormula(); drawPlot(); });
elMd.addEventListener('input', () => { mdot = +elMd.value; derive(); iscoRing.geometry.dispose(); iscoRing.geometry = new THREE.TorusGeometry(xIn * 0.995, 0.05 + 0.09 * Math.sqrt(mdot), 10, 96); syncSliders(); updateStats(); updateFormula(); drawPlot(); });
btnDef.addEventListener('click', () => { viewMode = 'def'; syncBtns(); flyTo(V_DEF, [0, 0, 0]); });
btnTop.addEventListener('click', () => { viewMode = 'top'; syncBtns(); flyTo(V_TOP, [0, 0, 0]); });
btnSide.addEventListener('click', () => { viewMode = 'side'; syncBtns(); flyTo(V_SIDE, [0, 0, 0]); });
btnFall.addEventListener('click', () => { fallOn = !fallOn; syncBtns(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglSlow').addEventListener('change', e => { slowMo = e.target.checked; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0;
controls.addEventListener('start', () => { camTween = null; });
const _M4 = new THREE.Matrix4(), _Q = new THREE.Quaternion(), _V = new THREE.Vector3(), _S = new THREE.Vector3(), _Qi = new THREE.Quaternion();
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * (slowMo ? 0.35 : 1) * (playing ? 1 : 0);
  if (texDirty) { texT += dt0; if (texT > 0.25) { drawUnderlayTex(); texT = 0; } }
  const gain = 0.32 + 1.5 * Math.pow(mdot, 0.6);
  for (let i = 0; i < NPX; i++) {
    let x = px[i];
    if (x > xIn) x -= VIN * Math.pow(mdot, 0.6) * Math.pow(xIn / x, 1.5) * pv[i] * dt;
    else x -= dt * (0.9 + 2.2 * (xIn - x));
    if (x < horizonU * 1.02) { respawn(i); x = px[i]; }
    px[i] = x;
    pp[i] += KW / Math.pow(Math.max(x, 1), 1.5) * dt;
    const r = x, y = py0[i] * (0.045 * x + 0.05);
    _V.set(Math.cos(pp[i]) * r, y, Math.sin(pp[i]) * r);
    const plunging = x <= xIn;
    const s = psize[i] * (plunging ? 0.75 : 1) * clamp(x / 2, 0.5, 2);
    _M4.compose(_V, _Qi, _S.set(s, s, s));
    disk.setMatrixAt(i, _M4);
    const li = plunging ? 0 : clamp((x - xIn) / (xOut - xIn), 0, 1) * 255 | 0;
    const g2 = gain * (plunging ? 1.7 * clamp((x - horizonU) / Math.max(xIn - horizonU, 0.01), 0.2, 1) : 1);
    _C.setRGB(lut[li * 3] * g2, lut[li * 3 + 1] * g2, lut[li * 3 + 2] * g2);
    disk.setColorAt(i, _C);
  }
  disk.instanceMatrix.needsUpdate = true;
  if (disk.instanceColor) disk.instanceColor.needsUpdate = true;
  /* 直落对照流 */
  stream.visible = fallOn;
  if (fallOn) {
    for (let i = 0; i < NRF; i++) {
      sr[i] -= sv[i] * dt * (1.5 + 0.35 * sr[i]);
      if (sr[i] < horizonU) { sr[i] = 12 + Math.random() * 14; sdir[i].randomDirection(); }
      _V.copy(sdir[i]).multiplyScalar(sr[i]);
      const s = 0.09 + 0.05 * Math.sin(i * 3.7);
      _M4.compose(_V, _Qi, _S.set(s, s, s));
      stream.setMatrixAt(i, _M4);
      const br = clamp(2.2 - sr[i] / 10, 0.25, 1.2);
      _C.setRGB(0.55 * br, 0.16 * br, 0.06 * br);
      stream.setColorAt(i, _C);
    }
    stream.instanceMatrix.needsUpdate = true;
    if (stream.instanceColor) stream.instanceColor.needsUpdate = true;
  }
  /* 亮度随供给率 */
  underlay.material.opacity = 0.16 + 0.34 * Math.pow(mdot, 0.5);
  glow.scale.setScalar(2.2 + 2.4 * Math.pow(mdot, 0.5));
  glow.material.opacity = 0.35 + 0.3 * Math.pow(mdot, 0.5);
  iscoRing.material.opacity = 0.4 + 0.3 * Math.pow(mdot, 0.5);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis() && r.text() !== '';
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
rebuildInner();
drawUnderlayTex();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
