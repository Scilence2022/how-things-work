<style>

  <h1 data-zh="大数定律与赌徒谬误" data-en="Law of Large Numbers &amp; the Gambler's Fallacy">大数定律与赌徒谬误</h1>
  <div class="sub" data-zh="单次结果不可预测→频率=正面次数/总次数,样本越多越收敛到概率 p,带宽像 1/√n 的漏斗收紧→但绝对偏差不保证变小:硬币没有记忆,连开 10 次正面后第 11 次仍是 50%→赌场把每个游戏的期望设成负(轮盘押红 47.37% vs 52.63%),大数定律替庄家把 5.26% 的抽水磨成稳定利润——「这次该轮到红了」正是把独立事件当成了会自我修正的序列 · 拖动旋转 / 空格运行/暂停" data-en="One flip is pure luck → frequency = heads/flips converges to the true p as n grows, squeezed by a 1/√n funnel → yet the absolute error need not shrink: the coin has no memory — after 10 heads the 11th flip is still 50/50 → casinos set every game's expectation negative (red hits 47.37% vs 52.63% on the wheel), and the law of large numbers grinds that 5.26% edge into steady profit — &quot;red is due&quot; treats independent events as a self-correcting sequence · drag to orbit / Space = run/pause">单次结果不可预测→频率=正面次数/总次数,样本越多越收敛到概率 p,带宽像 1/√n 的漏斗收紧→但绝对偏差不保证变小:硬币没有记忆,连开 10 次正面后第 11 次仍是 50%→赌场把每个游戏的期望设成负(轮盘押红 47.37% vs 52.63%),大数定律替庄家把 5.26% 的抽水磨成稳定利润——「这次该轮到红了」正是把独立事件当成了会自我修正的序列 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x10161a,14,46);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.1,200);
camera.position.set(0.4,2.6,8.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.9,1.1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=22;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:绿呢赌桌 + 抛掷硬币 + 记录板(频率曲线/漏斗/直方图) + 筹码堆 ── */
const feltM=new THREE.MeshStandardMaterial({color:0x14442a,roughness:0.95});
const felt=new THREE.Mesh(new THREE.CircleGeometry(12,56),feltM);
felt.rotation.x=-Math.PI/2;felt.position.y=0;scene.add(felt);
const railM=new THREE.MeshStandardMaterial({color:0x5c3a1e,roughness:0.6});
const rail=new THREE.Mesh(new THREE.TorusGeometry(11.4,0.35,12,72),railM);
rail.rotation.x=Math.PI/2;rail.position.y=0.18;scene.add(rail);

/* 硬币:侧面+正面(上)+反面(下),落地姿态由结果决定 */
const COIN_X=-1.6, COIN_Y=0.62;
const sideM=new THREE.MeshStandardMaterial({color:0xd9a53a,roughness:0.32,metalness:0.85});
const headM=new THREE.MeshStandardMaterial({color:0xf2c14e,roughness:0.25,metalness:0.9,
  emissive:0xffe9a8,emissiveIntensity:0.12});
const tailM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.3,metalness:0.85});
const coin=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.09,48),[sideM,headM,tailM]);
coin.position.set(COIN_X,COIN_Y,0);scene.add(coin);
/* 硬币投影环 */
const shadowM=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.3});
const cShadow=new THREE.Mesh(new THREE.CircleGeometry(0.55,32),shadowM);
cShadow.rotation.x=-Math.PI/2;cShadow.position.set(COIN_X,0.012,0);scene.add(cShadow);

/* 筹码堆:盈亏可视化 */
const chipM=new THREE.MeshStandardMaterial({color:0x51cf66,roughness:0.5,
  emissive:0x2f9e44,emissiveIntensity:0.15});
const chipGeo=new THREE.CylinderGeometry(0.34,0.34,0.055,28);
const chipStack=new THREE.Group();
for(let i=0;i<24;i++){
  const c=new THREE.Mesh(chipGeo,chipM);
  c.position.set((Math.random()-0.5)*0.05,0.028+i*0.056,(Math.random()-0.5)*0.05);
  c.rotation.y=Math.random()*Math.PI;chipStack.add(c);
}
chipStack.position.set(-0.1,0,1.35);scene.add(chipStack);

/* 记录板:上=频率收敛曲线+1/√n 漏斗;下=运行频率直方图 */
const CW=680,CH=440;
const cnv=document.createElement('canvas');cnv.width=CW;cnv.height=CH;
const cx=cnv.getContext('2d');
const tex=new THREE.CanvasTexture(cnv);tex.colorSpace=THREE.SRGBColorSpace;
const boardSide=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const boardFace=new THREE.MeshStandardMaterial({map:tex,roughness:0.85});
const board=new THREE.Mesh(new THREE.BoxGeometry(3.9,2.52,0.08),
  [boardSide,boardSide,boardSide,boardSide,boardFace,boardSide]);
board.position.set(3.55,1.5,-1.0);board.rotation.y=-0.3;scene.add(board);
for(const sx of[-1.5,1.5]){
  const post=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,1.6,10),boardSide);
  post.position.set(3.55+sx*0.95,0.8,-1.0-0.3*sx*0.3);scene.add(post);
}

/* ── 状态与统计 ── */
let mode='fair',bet=10,rate=80;
let n=0,wins=0,pl=0,lastRes=null,streak=0,streakPos=0;
let curve=[],sampleEvery=25,snapAcc=0;
let histBins=new Array(40).fill(0);
let playing=true,labelsOn=true,slowMo=false,funnelOn=true;
const pWin=()=>mode==='fair'?0.5:18/38;         /* 轮盘押红:18 红 / 38 格 */
const pNow=()=>pWin();
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const NMAX=10000;
const evPerBet=()=>mode==='fair'?0:(18-20)/38;   /* 每注期望(以注额为单位) */

function flipOne(){
  const r=Math.random()<pWin();
  wins+=r?1:0;n++;
  pl+=r?bet:-bet;
  if(r===lastRes)streak++;else{streak=1;lastRes=r;}
  snapAcc++;
  if(snapAcc>=sampleEvery){
    snapAcc=0;
    const f=wins/n;
    curve.push({n,f});
    histBins[clamp(Math.floor((f-0.2)/0.6*40),0,39)]++;
    if(curve.length>560){curve=curve.filter((_,i)=>i%2===0);sampleEvery*=2;}
  }
}
function batch(k){for(let i=0;i<k;i++)flipOne();}
function resetRun(){n=0;wins=0;pl=0;lastRes=null;streak=0;curve=[];sampleEvery=25;snapAcc=0;
  histBins=new Array(40).fill(0);updateStats();drawBoard();}

/* ── 标签 ── */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const resStr=r=>mode==='fair'?(r?'正面':'反面'):(r?'红':'黑');
const st={freq:0,dev:0};
const lblCoin=addLabel(()=>n===0?L('抛一枚硬币:结果纯属运气','Flip a coin: pure luck')
    :L(`最新:${resStr(lastRes)} · 连开 ${streak} 次`,`${resStr(lastRes)} · streak ${streak}`),
  new THREE.Vector3(COIN_X,1.75,0),'y');
const lblFall=addLabel(()=>L(`连开 ${streak} 次同面 → 下一次仍是 50/50:序列不会自我修正`,
    `streak of ${streak} → next flip still 50/50: no self-correction`),
  new THREE.Vector3(COIN_X,2.15,0),'o',()=>streak>=5);
const lblCurve=addLabel(()=>L('频率曲线 + 1/√n 置信漏斗','Frequency + 1/√n confidence funnel'),
  new THREE.Vector3(3.55,2.95,-0.35),'g');
const lblHist=addLabel(()=>L('运行频率的直方图:越抛越窄、收成钟形','Histogram of running frequency: narrows to a bell'),
  new THREE.Vector3(3.55,-0.1,0.5),'b');
const lblEV=addLabel(()=>mode==='fair'
    ?L('公平硬币:每注期望 EV = 0,长期≈不输不赢','Fair coin: EV = 0 per bet — long run ≈ break even')
    :L('押红 18/38:EV = −5.26%/注,大数定律替庄家上班','Red hits 18/38: EV = −5.26%/bet — the LLN works for the house'),
  new THREE.Vector3(-0.1,1.15,1.35),'r',()=>true);
const lblPL=addLabel(()=>L(`累计盈亏 ${pl>=0?'+':''}${Math.round(pl)} 枚`,`net ${pl>=0?'+':''}${Math.round(pl)} units`),
  new THREE.Vector3(-0.1,0.55,1.5),'o');

/* ── 记录板绘制 ── */
function drawBoard(){
  cx.fillStyle='#f7f4ec';cx.fillRect(0,0,CW,CH);
  cx.strokeStyle='#cfc8b8';cx.lineWidth=6;cx.strokeRect(3,3,CW-6,CH-6);
  const p=pNow();
  cx.fillStyle='#5b6b7d';cx.font='bold 18px sans-serif';cx.textAlign='left';
  cx.fillText(L('频率 f(n) 与 p±1.96·√(p(1−p)/n) 漏斗','f(n) with p±1.96·√(p(1−p)/n) funnel'),18,30);
  cx.textAlign='right';
  cx.fillText((mode==='fair'?L('p = 0.5','p = 0.5'):L('p = 18/38 = 0.4737','p = 18/38 = 0.4737')),CW-18,30);
  /* 上半:曲线区 x0..x1, y0..y1,f∈[0,1] */
  const x0=52,x1=CW-22,y0=46,y1=224;
  const nX=nn=>x0+Math.sqrt(clamp(nn,1,NMAX)/NMAX)*(x1-x0);
  const fY=f=>y1-clamp(f,0,1)*(y1-y0);
  cx.strokeStyle='#e0d9c8';cx.lineWidth=1.5;
  cx.strokeRect(x0,y0,x1-x0,y1-y0);
  /* 漏斗带 */
  if(funnelOn){
    cx.beginPath();
    for(let i=0;i<=160;i++){
      const nn=Math.max(1,NMAX*Math.pow(i/160,2));
      const hw=1.96*Math.sqrt(p*(1-p)/nn);
      const px=nX(nn),py=fY(p+hw);
      i===0?cx.moveTo(px,py):cx.lineTo(px,py);
    }
    for(let i=160;i>=0;i--){
      const nn=Math.max(1,NMAX*Math.pow(i/160,2));
      const hw=1.96*Math.sqrt(p*(1-p)/nn);
      cx.lineTo(nX(nn),fY(p-hw));
    }
    cx.closePath();
    cx.fillStyle='rgba(47,158,68,.16)';cx.fill();
    cx.strokeStyle='rgba(43,138,62,.5)';cx.lineWidth=1;cx.stroke();
  }
  /* p 参考线 */
  cx.setLineDash([7,5]);cx.strokeStyle='#c2255c';cx.lineWidth=1.6;
  cx.beginPath();cx.moveTo(x0,fY(p));cx.lineTo(x1,fY(p));cx.stroke();cx.setLineDash([]);
  /* 频率折线 */
  cx.strokeStyle='#1864ab';cx.lineWidth=2;
  cx.beginPath();
  for(let i=0;i<curve.length;i++){
    const px=nX(curve[i].n),py=fY(curve[i].f);
    i===0?cx.moveTo(px,py):cx.lineTo(px,py);
  }
  if(n>0){const px=nX(n),py=fY(wins/n);
    curve.length?cx.lineTo(px,py):cx.moveTo(px,py);}
  cx.stroke();
  cx.fillStyle='#8a94a4';cx.font='12px sans-serif';cx.textAlign='left';
  cx.fillText(L('n(平方根刻度)','n (square-root scale)'),x0+4,y1+15);
  cx.fillText('1.0',x0-22,y0+6);cx.fillText('0',x0-14,y1+4);
  /* 下半:直方图 */
  const hy0=268,hy1=CH-42;
  cx.fillStyle='#5b6b7d';cx.font='bold 15px sans-serif';
  cx.fillText(L('运行频率的分布(每 25 次记一个点)','Distribution of running freq (snapshot / 25 flips)'),18,hy0-14);
  const bw=(x1-x0)/40;
  let hmax=1;for(const c of histBins)hmax=Math.max(hmax,c);
  for(let i=0;i<40;i++){
    const h=histBins[i]/hmax*(hy1-hy0);
    const px=x0+i*bw+2;
    cx.fillStyle=histBins[i]?'rgba(47,158,68,.75)':'rgba(200,192,178,.35)';
    cx.fillRect(px,hy1-h,bw-3,h);
  }
  cx.strokeStyle='#e0d9c8';cx.lineWidth=1.5;cx.strokeRect(x0,hy0,x1-x0,hy1-hy0);
  const hp=x0+(p-0.2)/0.6*(x1-x0);
  if(hp>=x0&&hp<=x1){
    cx.setLineDash([7,5]);cx.strokeStyle='#c2255c';cx.lineWidth=1.4;
    cx.beginPath();cx.moveTo(hp,hy0);cx.lineTo(hp,hy1);cx.stroke();
    cx.setLineDash([]);
  }
  cx.fillStyle='#8a94a4';cx.font='12px sans-serif';
  cx.fillText('0.2',x0-6,hy1+16);cx.fillText('0.8',x1-24,hy1+16);
  cx.fillText(L('→ 钟形:这就是大数定律的脸','→ bell-shaped: the face of the LLN'),x1-232,hy1+16);
  tex.needsUpdate=true;
}

/* ── 滑杆与模式 ── */
function setBet(v){bet=clamp(Math.round(v),1,50);
  document.getElementById('sBet').value=bet;
  document.getElementById('sBetVal').textContent=bet;}
function setRate(v){rate=clamp(Math.round(v),5,200);
  document.getElementById('sRate').value=rate;
  document.getElementById('sRateVal').textContent=rate+' /s';}
function setMode(m){mode=m;
  document.getElementById('bFair').classList.toggle('on',m==='fair');
  document.getElementById('bRou').classList.toggle('on',m==='rou');
  const rou=m==='rou';
  headM.color.setHex(rou?0xe03131:0xf2c14e);
  headM.emissive.setHex(rou?0xff6b6b:0xffe9a8);
  tailM.color.setHex(rou?0x1a1c22:0x8a94a4);
  chipM.color.setHex(rou?0xff8787:0x51cf66);
  chipM.emissive.setHex(rou?0xc92a2a:0x2f9e44);
  resetRun();}

/* ── 步骤 ── */
const STEPS=[
 {zh:'<b>抛一次:纯运气</b>——单次结果完全不可预测,概率只对「大量重复」开口说话',
  en:'<b>One flip: pure luck</b> — a single outcome is unpredictable; probability only speaks over many repeats',
  act(){setMode('fair');setBet(10);setRate(80);resetRun();}},
 {zh:'<b>小样本疯涨疯跌</b>——前几十次里频率被运气拖着满场跑,0.3 与 0.7 都常见',
  en:'<b>Small samples swing wild</b> — over the first few dozen flips, luck drags the frequency between 0.3 and 0.7',
  act(){setMode('fair');setRate(80);resetRun();batch(40);}},
 {zh:'<b>收敛到 p</b>——跑够几千次,频率被 1/√n 漏斗夹进越来越窄的带,像被概率驯服',
  en:'<b>Converge to p</b> — after a few thousand flips the frequency is squeezed into a narrower and narrower 1/√n funnel',
  act(){setMode('fair');setRate(200);batch(3000);}},
 {zh:'<b>绝对偏差不保证变小</b>——漏斗是「大概率」,不是保证:第 10001 次抛掷仍可能把你推得更偏。硬币没有记忆',
  en:'<b>Absolute error need not shrink</b> — the funnel is likely, not guaranteed: flip #10001 can still push you further off. No memory',
  act(){batch(500);}},
 {zh:'<b>赌徒谬误</b>——连开 6 次正面后,「该出反面了」是错觉:独立事件没有账本,下一次仍是 50/50',
  en:'<b>The gambler\u2019s fallacy</b> — after 6 heads, &quot;tails is due&quot; is an illusion: independent events keep no ledger, next flip is still 50/50',
  act(){setMode('fair');let guard=0;while(streak<6&&guard++<4000)flipOne();}},
 {zh:'<b>把期望设成负</b>——轮盘 38 格只有 18 格红:押红胜率 47.37%,每注期望 EV = −5.26%',
  en:'<b>Set the expectation negative</b> — only 18 of 38 pockets are red: betting red wins 47.37% of the time, EV = −5.26% per bet',
  act(){setMode('rou');setBet(10);setRate(120);}},
 {zh:'<b>庄家的大数定律</b>——几千注之后,5.26% 的抽水从随机波动里析出,磨成稳定利润。你以为是手气,其实是 √n 在两边同时干活',
  en:'<b>The house\u2019s LLN</b> — after a few thousand bets the 5.26% edge precipitates out of the noise into steady profit. Luck fades; √n does not',
  act(){setMode('rou');setRate(200);batch(2500);}},
 {zh:'<b>加注不改变期望</b>——下注额放大盈亏的波动(方差 ∝ 注额²),每注期望仍是 −5.26%:加倍下注只会加速破产',
  en:'<b>Bigger bets don\u2019t change EV</b> — the stake scales the swings (variance ∝ stake²) while EV stays −5.26%: doubling down only speeds the ruin',
  act(){setMode('rou');setBet(50);resetRun();batch(600);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t">${LANG==='en'?s.en:s.zh}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();updateStats();drawBoard();}

function updateStats(){
  document.getElementById('stN').innerHTML=n.toLocaleString()+'<small> </small>';
  const f=n>0?wins/n:pNow();
  st.freq=f;st.dev=Math.abs(f-pNow());
  document.getElementById('stF').innerHTML=n>0?f.toFixed(4):'—';
  const dv=document.getElementById('stD');
  dv.innerHTML=n>0?st.dev.toFixed(4):'—';
  dv.className='v '+(n>200&&st.dev<0.02?'ok':'');
  const pv=document.getElementById('stPL');
  pv.innerHTML=(pl>=0?'+':'')+Math.round(pl)+'<small> </small>';
  pv.className='v '+(pl<0?'warn':pl>0?'ok':'');
}

/* ── 事件 ── */
document.getElementById('bFair').addEventListener('click',()=>setMode('fair'));
document.getElementById('bRou').addEventListener('click',()=>setMode('rou'));
document.getElementById('bAdd').addEventListener('click',()=>batch(100));
document.getElementById('bReset').addEventListener('click',()=>resetRun());
document.getElementById('sBet').addEventListener('input',e=>setBet(+e.target.value));
document.getElementById('sRate').addEventListener('input',e=>setRate(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglFun').addEventListener('change',e=>{funnelOn=e.target.checked;drawBoard();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x10161a:0xe9e4dc);
  scene.fog.color.setHex(dark?0x10161a:0xe9e4dc);
  feltM.color.setHex(dark?0x14442a:0x2f7d4f);
  railM.color.setHex(dark?0x5c3a1e:0x8a5a30);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();drawBoard();
}

/* ── 主循环 ── */
const clock=new THREE.Clock();
let raf=null;
let tossT=1e9,tossRes=0;   /* 硬币抛掷动画 */
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  /* 批量抛掷:按滑杆速率记账 */
  rateAcc+=rate*dts;
  const k=Math.floor(rateAcc);
  if(k>0){rateAcc-=k;batch(Math.min(k,400));}
  /* 硬币抛掷动画(≈2.2 次/s 的具象演示,账目由 batch 负责) */
  tossT+=dts;
  const TT=0.46;
  if(tossT>=TT+0.08){tossT=0;tossRes=Math.random()<pWin()?1:0;}
  if(tossT<TT){
    const u=smooth(tossT/TT);
    coin.position.y=COIN_Y+1.25*Math.sin(Math.PI*(tossT/TT));
    coin.rotation.x=u*Math.PI*4+(tossRes?0:Math.PI)*u;
  }else{
    coin.position.y=COIN_Y;
    coin.rotation.x=tossRes?0:Math.PI;
  }
  cShadow.scale.setScalar(clamp(1.3-coin.position.y*0.45,0.45,1.2));
  /* 筹码堆高度 = |盈亏| */
  const h=clamp(Math.abs(pl)/(bet*30),0.02,1);
  chipStack.scale.y=h;
  chipStack.position.y=0;
  chipM.emissiveIntensity=pl<0?0.3:0.15;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.14){frame.acc=0;updateStats();drawBoard();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
let rateAcc=0;
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
