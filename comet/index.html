<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彗星 · 脏雪球的近日点烟火</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="彗星 · 脏雪球的近日点烟火" data-en="Comets · A Dirty Snowball's Perihelion Fireworks">彗星 · 脏雪球的近日点烟火</h1>
  <div class="sub" data-zh="柯伊伯带来的冰+尘"脏雪球"→ 靠近太阳,冰升华成 coma → 两条尾分家:离子尾被太阳风+磁场"吹"成笔直背阳的蓝线,尘埃尾被辐射压推开、又被轨道惯性甩成弯曲金弧 → 每次回归掉一层皮,轨道上的尘埃带就是流星雨 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="A dirty snowball of ice and dust from the Kuiper Belt → near the sun, ice sublimates into a coma → the two tails split: the ion tail is blown by solar wind + magnetic field into a straight anti-sunward blue line, while radiation pressure and orbital inertia sweep the dust tail into a curved golden arc → each return sheds a skin, and the dust along the orbit becomes meteor showers · 3D interactive demo · drag to orbit · Space = run/pause">彗星 · 脏雪球的近日点烟火</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="日距" data-en="Sun distance">日距</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="飞行速度" data-en="Speed">飞行速度</span><span class="v warn" id="stV">—</span>
  <span class="k" data-zh="升华率(1/r²)" data-en="Sublimation">升华率(1/r²)</span><span class="v" id="stSub">—</span>
  <span class="k" data-zh="coma 直径" data-en="Coma width">coma 直径</span><span class="v" id="stComa">—</span>
  <span class="k" data-zh="离子尾长" data-en="Ion tail">离子尾长</span><span class="v" id="stIon">—</span>
  <span class="k" data-zh="回归周期" data-en="Period">回归周期</span><span class="v ok" style="font-size:14px" id="stP">76 年</span>
</div>

<div id="plot">
  <h3 data-zh="活动性随日距:升华 ∝ 1/r²,烟花只在近日点附近绽放" data-en="Activity vs sun distance: sublimation ∝ 1/r² — the fireworks only fire near perihelion">活动性随日距:升华 ∝ 1/r²,烟花只在近日点附近绽放</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="蓝直线:离子尾(太阳风吹直)" data-en="blue line: ion tail (blown straight by solar wind)">蓝直线:离子尾(太阳风吹直)</span>
    <span class="chip.o" data-zh="金弧线:尘埃尾(辐射压+惯性)" data-en="gold arc: dust tail (radiation pressure + inertia)">金弧线:尘埃尾(辐射压+惯性)</span>
    <span class="chip.g" data-zh="白晕:coma(升华冰大气)" data-en="white haze: the coma (sublimated atmosphere)">白晕:coma(升华冰大气)</span>
    <span class="chip.r" data-zh="流星雨:地球穿越尘埃带" data-en="meteors: Earth crossing the dust trail">流星雨:地球穿越尘埃带</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnWide" data-zh="全景视角" data-en="Wide view">全景视角</button>
    <button class="abtn" id="btnFollow" data-zh="跟随彗星" data-en="Follow comet">跟随彗星</button>
    <button class="abtn" id="btnEarth" data-zh="地球·流星雨" data-en="Earth · meteors">地球·流星雨</button>
    <button class="abtn" id="btnHalley" data-zh="哈雷模式(i=162°)" data-en="Halley mode (i=162°)">哈雷模式(i=162°)</button>
  </div>
  <div class="row"><label data-zh="日距 r" data-en="Distance r">日距 r</label><input id="sR" type="range" min="1.12" max="10.08" step="0.01" value="1.35"><span class="val" id="sRVal">—</span></div>
  <div class="row"><label data-zh="太阳风强度" data-en="Solar wind">太阳风强度</label><input id="sW" type="range" min="0" max="100" step="1" value="70"><span class="val" id="sWVal">70%</span></div>
  <div class="row"><label data-zh="轨道倾角" data-en="Inclination">轨道倾角</label><input id="sI" type="range" min="0" max="180" step="1" value="25"><span class="val" id="sIVal">25°</span></div>
  <div class="row"><label data-zh="动画速度" data-en="Speed">动画速度</label><input id="sSpd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="sSpdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="活动性图" data-en="Chart">活动性图</span></label>
      <label><input id="tglTrail" type="checkbox"> <span data-zh="尘埃带(轨道残留)" data-en="dust trail">尘埃带(轨道残留)</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../orbital-mechanics/" data-zh="轨道力学:速度即轨道" data-en="orbital mechanics: velocity is the orbit">轨道力学:速度即轨道</a>
    <a href="../aurora/" data-zh="极光:太阳风的另一场秀" data-en="aurora: the solar wind's other show">极光:太阳风的另一场秀</a>
    <a href="../moon-phases/" data-zh="月相:看角度不发光" data-en="moon phases: geometry, not glow">月相:看角度不发光</a>
    <a href="../hohmann-transfer/" data-zh="霍曼转移:椭圆的工程用法" data-en="Hohmann transfer: ellipses as engineering">霍曼转移:椭圆的工程用法</a>
    <a href="../roche-limit/" data-zh="洛希极限:被撕碎的另一端" data-en="Roche limit: torn apart instead">洛希极限:被撕碎的另一端</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x070a12, 34, 95);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x070a12 : 0xdde6f0);
  scene.fog.color = new THREE.Color(dark ? 0x070a12 : 0xdde6f0);
  starsMat.opacity = dark ? 0.9 : 0.32;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('彗星 · 脏雪球的近日点烟火', 'Comets · A Dirty Snowball\'s Perihelion Fireworks');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
camera.position.set(3, 9.5, 15.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.1;
controls.maxDistance = 60;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0x8fa8c8, 0x0a0d14, 0.35);
scene.add(hemi);
const sunLight = new THREE.PointLight(0xffe9c0, 1.7, 0, 0);
scene.add(sunLight);

/* 星空 */
let starsMat;
{
  const g = new THREE.BufferGeometry();
  const N = 900, arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(60 + Math.random() * 70);
    arr[i * 3] = v.x; arr[i * 3 + 1] = v.y; arr[i * 3 + 2] = v.z;
  }
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  starsMat = new THREE.PointsMaterial({ color: 0x9fb0c3, size: 0.22, transparent: true, opacity: 0.9 });
  scene.add(new THREE.Points(g, starsMat));
}

/* ---------------- 太阳 ---------------- */
function glowTexture(inner, outer) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, inner); g.addColorStop(0.35, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const sunGrp = new THREE.Group();
scene.add(sunGrp);
const sunCore = new THREE.Mesh(new THREE.SphereGeometry(0.72, 32, 24),

const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 40, padR = 14, padT = 12, padB = 26;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
  const X = r => x0 + (rAUof(r) - 0.5) / (rAUof(A * (1 + ECC)) - 0.5) * (x1 - x0);
  const Y = a => y1 - clamp(a, 0, 1) * (y1 - y0);
  ctx.font = '16px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const v of [0, 0.5, 1]) {
    const y = Y(v);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillText(String(v), x0 - 22, y + 5);
  }
  /* 升华率 (q/r)² 与活动性窗口 */
  ctx.strokeStyle = '#4dabf7';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i = 0; i <= 70; i++) {
    const r = lerp(A * (1 - ECC), A * (1 + ECC), i / 70);
    const a = clamp(Math.pow(A * (1 - ECC) / r, 2) / 3, 0, 1);
    i <= 0.01 ? ctx.moveTo(X(r), Y(a)) : ctx.lineTo(X(r), Y(a));
  }
  ctx.stroke();
  ctx.fillStyle = '#4dabf7';
  ctx.fillText(L('升华 (q/r)²', 'sublimation (q/r)²'), x0 + 8, y0 + 14);
  /* 彗星当前位置 */
  const rNow = _cPos.length();
  ctx.strokeStyle = 'rgba(255,169,77,.75)';
  ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(X(rNow), y0); ctx.lineTo(X(rNow), y1); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath(); ctx.arc(X(rNow), Y(activityOf(rNow)), 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = cTxt;
  ctx.fillText(L('日距 AU', 'distance AU'), x1 - 74, H - 8);
  for (const a of [1, 2, 3, 5]) ctx.fillText(String(a), X(a / rAUof(1)), H - 8);
}

  stIon.className = 'v ' + (ionAU > 0.4 ? 'warn' : '');
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>开普勒第二定律</b>:dA/dt = 常数 → 近日快远日慢;v=√(GM(2/r−1/a)),哈雷近日点 ~54.6 km/s<br>` +
    `<b>升华率 ∝ 1/r²</b>(日照强度):冰→coma(可达 10⁵ km)→两条尾;离子尾可拖 1 AU<br>` +
    `<b>离子尾</b>:太阳风(~400 km/s)+行星际磁场 → 永远背阳;<b>尘埃尾</b>:辐射压 β·∝1/r² + 轨道惯性 → 弯曲<br>` +
    `<b>每个近日点损失 ~1–3 m 表层</b>:轨道尘埃带=流星雨(猎户座等);哈雷周期 76 年,2061 年回归(示意轨道 e=0.80,哈雷实际 0.967)`,
    `<b>Kepler's 2nd law</b>: dA/dt = const → fast near, slow far; v=√(GM(2/r−1/a)) — Halley hits ~54.6 km/s at perihelion<br>` +
    `<b>Sublimation ∝ 1/r²</b> (sunlight): ice → coma (up to 10⁵ km) → two tails; the ion tail can stretch 1 AU<br>` +
    `<b>Ion tail</b>: solar wind (~400 km/s) + IMF → always anti-sunward; <b>dust tail</b>: radiation pressure ∝1/r² + orbital inertia → curved<br>` +
    `<b>~1–3 m of surface lost each return</b>: the orbital dust stream = meteor showers (Orionids...); Halley's period 76 yr, next 2061 (demo orbit e=0.80, Halley's real 0.967)`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateStats(); drawPlot();
  document.getElementById('tglTrail').checked = trailOn;
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elR.addEventListener('input', () => { setManualR(+elR.value); syncSliders(); });
elW.addEventListener('input', () => { setWind(+elW.value); syncSliders(); });
elI.addEventListener('input', () => { setInc(+elI.value); syncSliders(); });
elSpd.addEventListener('input', () => { speed = +elSpd.value; syncSliders(); });
btnWide.addEventListener('click', () => { followMode = 'wide'; syncBtns(); flyTo(...WIDE); });
btnFollow.addEventListener('click', () => { followMode = 'comet'; syncBtns(); });
btnEarth.addEventListener('click', () => { followMode = 'earth'; syncBtns(); trailOn = true; });
btnHalley.addEventListener('click', () => { setInc(162); setWind(80); trailOn = true; followMode = 'comet'; syncAll(); });
elPlay.addEventListener('click', () => { playing = !playing; manualHold = manualHold && !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglTrail').addEventListener('change', e => { trailOn = e.target.checked; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, camTween = null, simT = 0, sweepT = 0;
const followPrev = new THREE.Vector3();
controls.addEventListener('start', () => { camTween = null; followPrev.copy(controls.target); });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0);
  simT += dt0;
  /* 轨道推进(开普勒) */
  if (!manualHold && playing) M += dt * 2 * Math.PI / T_SIM;
  orbitPos(M, _cPos);
  orbitVel(M, _cVel).multiplyScalar(2 * Math.PI / T_SIM);
  cometGrp.position.copy(_cPos);
  const rNow = _cPos.length();
  const act = activityOf(rNow);
  nucleus.rotation.set(simT * 0.4, simT * 0.53, 0);
  /* coma / 发光 */
  const cs = 0.4 + act * 1.5;
  cometGlow.scale.setScalar(0.3 + act * 2.2);
  comaMats.forEach((c, i) => {
    c.m.opacity = c.op * act * (0.85 + 0.15 * Math.sin(simT * 2 + i));
    c.mesh.scale.setScalar(cs);
  });
  /* anti-sun 方向(轨道面局部:从太阳指向外) */
  _antiSun.copy(_cPos).divideScalar(rNow);
  /* 离子尾:笔直背阳 + 太阳风涟漪 */
  const ionL = act * (0.35 + 0.55 * windF) * 4.2;
  for (let i = 0; i < NI; i++) {
    const p = ionP[i];
    const u = p.u;
    const wob = windF * 0.16 * Math.sin(u * 9 - simT * 4 + p.ph) * u;
    const side = p.side * (0.05 + wob);
    _V.copy(_cPos).addScaledVector(_antiSun, u * ionL);
    _V.x += side * _antiSun.z; _V.z -= side * _antiSun.x;
    _Q.setFromUnitVectors(_Y, _antiSun);
    const s = (1 - u) * 0.9 + 0.1;
    _M4.compose(_V, _Q, _S.set(s * 0.7, (0.25 + ionL * 0.24) * s, s * 0.7));
    ionTail.setMatrixAt(i, _M4);
  }
  ionTail.instanceMatrix.needsUpdate = true;
  ionTail.visible = ionL > 0.06;
  ionMat.opacity = 0.25 + 0.55 * act;
  /* 尘埃尾:辐射压 + 惯性 → 自然弯曲 */
  dustAcc += dt * 34 * act;
  while (dustAcc >= 1) {
    dustAcc -= 1;
    const slot = dp.find(d => !d.on);
    if (slot) {
      slot.on = true;
      slot.pos.copy(_cPos).add(_V.copy(_cVel).setLength(0.1));
      slot.vel.copy(_cVel).multiplyScalar(0.72).add(_S.set((Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.06, (Math.random() - 0.5) * 0.1));
      slot.age = 0; slot.life = 4.5 + Math.random() * 2.5;
    }
  }
  let dustVisible = 0;
  for (let i = 0; i < ND; i++) {
    const d = dp[i];
    if (!d.on) { _M4.compose(_V.set(0, 0, 0), _Q.identity(), _S.set(0, 0, 0)); dustTail.setMatrixAt(i, _M4); continue; }
    d.age += dt;
    const rr = d.pos.length();
    d.vel.addScaledVector(_V.copy(d.pos).multiplyScalar(BETA / (rr * rr * rr)), dt);
    d.pos.addScaledVector(d.vel, dt);
    const k = clamp(d.age / d.life, 0, 1);
    if (d.age >= d.life || d.pos.length() > 14) { d.on = false; continue; }
    dustVisible++;
    const sc = 0.9 * (1 - k * 0.75);
    _M4.compose(d.pos, _Q.identity(), _S.set(sc, sc, sc));
    dustTail.setMatrixAt(i, _M4);
    cTmp.copy(cDust0).lerp(cDust1, k);
    dustTail.setColorAt(i, cTmp);
  }
  dustTail.instanceMatrix.needsUpdate = true;
  if (dustTail.instanceColor) dustTail.instanceColor.needsUpdate = true;
  /* 喷流(朝日面小喷泉) */
  const _sunDir = _V.copy(_antiSun).multiplyScalar(-1).clone();
  for (let i = 0; i < NJ; i++) {
    const p = jp[i];
    p.t += dt * p.v * (0.3 + act);
    if (p.t > 1) { p.t = 0; p.spread = (Math.random() - 0.5) * 0.9; p.roll = Math.random() * 6.28; }
    _Q.setFromUnitVectors(_Y, _sunDir);
    const dir = new THREE.Vector3(0, 1, 0).applyQuaternion(_Q);
    const side = new THREE.Vector3(-_sunDir.z, 0, _sunDir.x);
    dir.addScaledVector(side, Math.cos(p.roll) * p.spread).addScaledVector(_Y, Math.sin(p.roll) * p.spread * 0.7).normalize();
    _M4.compose(_S.set(dir.x * p.t * 0.55, dir.y * p.t * 0.55, dir.z * p.t * 0.55), _Q, _S.setScalar((1 - p.t) * 0.9));
    jets.setMatrixAt(i, _M4);
  }
  jets.instanceMatrix.needsUpdate = true;
  jets.visible = act > 0.04;
  /* 尘埃带(轨道残留) */
  trail.visible = trailOn;
  if (trailOn) {
    for (let i = 0; i < NTR; i++) {
      orbitPos(((M - 0.0045 * (i + 1)) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI), _V);
      _M4.compose(_V, _Q.identity(), _S.setScalar(0.8 + 0.4 * Math.sin(i * 3.7)));
      trail.setMatrixAt(i, _M4);
    }
    trail.instanceMatrix.needsUpdate = true;
  }
  /* 开普勒扫过面积扇形 */
  sweepT += dt;
  if (sweepT > 0.06) {
    sweepT = 0;
    for (let i = SWN - 1; i >= 1; i--) sweepPts[i].copy(sweepPts[i - 1]);
    sweepPts[0].copy(_cPos);
    let k = 0;
    for (let i = 0; i < SWN - 1; i++) {
      sweepArr[k++] = 0; sweepArr[k++] = 0; sweepArr[k++] = 0;
      sweepArr[k++] = sweepPts[i].x; sweepArr[k++] = sweepPts[i].y; sweepArr[k++] = sweepPts[i].z;
      sweepArr[k++] = sweepPts[i + 1].x; sweepArr[k++] = sweepPts[i + 1].y; sweepArr[k++] = sweepPts[i + 1].z;
    }
    sweepGeo.attributes.position.needsUpdate = true;
  }
  sweepMat.opacity = phaseIdx === 4 ? 0.28 : 0.1;
  /* 地球 + 流星 */
  earthAng += dt * 2 * Math.PI / 36;
  earthGrp.position.set(Math.cos(earthAng) * EARTH_R, 0, Math.sin(earthAng) * EARTH_R);
  earth.rotation.y += dt * 0.5;
  let nearTrail = false;
  if (trailOn) {
    for (let i = 0; i < NTR; i += 4) {
      orbitPos(((M - 0.0045 * (i + 1)) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI), _V);
      if (_V.distanceToSquared(earthGrp.position) < 2.6) { nearTrail = true; break; }
    }
  }
  meteorsOn = trailOn && nearTrail;
  meteorAcc += dt0;
  while (meteorsOn && meteorAcc > 0.04) {
    meteorAcc -= 0.04;
    const slot = mp.find(m => !m.on);
    if (slot) {
      slot.on = true; slot.age = 0; slot.life = 0.5 + Math.random() * 0.4;
      slot.pos.copy(earthGrp.position).add(new THREE.Vector3().randomDirection().multiplyScalar(0.55));
      orbitVel(M, _T1).multiplyScalar(2 * Math.PI / T_SIM).normalize();   /* 尘埃沿轨道方向撞地球 */
      slot.vel.copy(_T1).multiplyScalar(2.6).add(new THREE.Vector3().randomDirection().multiplyScalar(0.4));
    }
  }
  if (!meteorsOn) meteorAcc = 0;
  for (let i = 0; i < NM; i++) {
    const m = mp[i];
    if (!m.on) { _M4.compose(_V.set(0, -999, 0), _Q.identity(), _S.set(0.01, 0.01, 0.01)); meteors.setMatrixAt(i, _M4); continue; }
    m.age += dt0;
    if (m.age > m.life) { m.on = false; continue; }
    m.pos.addScaledVector(m.vel, dt0);
    _Q.setFromUnitVectors(_Y, _T1.copy(m.vel).normalize());
    _M4.compose(m.pos, _Q, _S.set(1, 3.2, 1));
    meteors.setMatrixAt(i, _M4);
  }
  meteors.instanceMatrix.needsUpdate = true;
  /* 太阳风 */
  windMat.opacity = 0.12 + 0.3 * windF;
  for (let i = 0; i < NW; i++) {
    const p = wp[i];
    p.r += p.v * dt0 * (0.3 + windF);
    if (p.r > 14) { p.r = 1.1; p.dir.randomDirection(); p.dir.y *= 0.4; p.dir.normalize(); }
    _M4.compose(_V.copy(p.dir).multiplyScalar(p.r), _Q.setFromUnitVectors(_Y, p.dir), _S.set(0.7, 2.4 + p.v * 0.2, 0.7));
    wind.setMatrixAt(i, _M4);
  }
  wind.instanceMatrix.needsUpdate = true;
  /* 标签位置(离子尾/尘埃尾中点) */
  lblIon.position.copy(_antiSun).multiplyScalar(ionL * 0.55).add(_V.set(0, 0.5, 0));
  const dustTip = _V.copy(_antiSun).add(_cVel.clone().multiplyScalar(-0.55)).normalize();
  lblDust.position.copy(dustTip).multiplyScalar(Math.min(2.2, 0.6 + act * 1.6));
  /* 相机跟随 */
  if (followMode === 'comet' && !camTween) {
    followPrev.copy(controls.target);
    controls.target.lerp(_cPos, Math.min(1, dt0 * 4));
    camera.position.add(_V.copy(controls.target).sub(followPrev));
  } else if (followMode === 'earth' && !camTween) {
    followPrev.copy(controls.target);
    controls.target.lerp(earthGrp.position, Math.min(1, dt0 * 4));
    camera.position.add(_V.copy(controls.target).sub(followPrev));
  }
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); drawPlot(); syncSliders(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
orbitPlane.rotation.x = inc * Math.PI / 180;
orbitPos(M, _cPos);
cometGrp.position.copy(_cPos);
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
