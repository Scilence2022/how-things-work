<title>贝塞尔曲线与样条 · 被控制点拉出的线</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;

  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="app"></div>

<div id="title">
  <h1 data-zh="贝塞尔曲线与样条 · 被控制点拉出的线" data-en="Bézier Curves & Splines · Pulled by Control Points">贝塞尔曲线与样条 · 被控制点拉出的线</h1>
  <div class="sub" data-zh="看 de Casteljau 逐层插值把控制多边形收缩成一个流动笔尖；拖任意控制点曲线实时跟手；打开曲率梳看两段样条接缝处的 G¹/C¹ 与曲率跳变 · 拖动旋转 / 空格运行/暂停" data-en="Watch de Casteljau interpolate layer by layer, collapsing the control polygon into a roaming pen tip; drag any control point and the curve follows; open the curvature comb to inspect the G¹/C¹ seam · drag to orbit / Space = run/pause">看 de Casteljau 逐层插值把控制多边形收缩成一个流动笔尖；拖任意控制点曲线实时跟手；打开曲率梳看两段样条接缝处的 G¹/C¹ 与曲率跳变 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============================================================
   Bézier = 伯恩斯坦多项式加权的控制点：B(t)=Σ C(n,i)·tⁱ(1-t)ⁿ⁻ⁱ·Pi
   de Casteljau：每层把相邻两点按 t 线性插值，n 层后剩一点即 B(t)
   ——逐层收缩的「套娃」就是算法本体。
   曲线只过 P0/Pn，被中间控制点「拉」但不过它们；越高阶越难控。
   分段：两段三次在接缝处拼长曲线，Q1 与 P2-P3 共线 → G¹（方向连续）
   ，长度也相等 → C¹（参数连续）；曲率连续还要 C²——曲率梳看得见。
   B 样条（均匀三次 De Boor）对照：逼近控制点，不过首尾。
   曲率 κ = |x'y''-y'x''| / (x'²+y'²)^{3/2}。
   ============================================================ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const qsBool=(k,d)=>{const v=qs.get(k);return v===null?d:(v!=='0'&&v!=='false');};

/* ---- renderer ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,34,90);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.4,3.4,27.5); /* 拉远并把视心左移，整个控制多边形躲开左侧面板 */
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-4.4,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=5;controls.maxDistance=50;

scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.85));
const keyL=new THREE.DirectionalLight(0xfff2dd,0.8);keyL.position.set(4,8,9);scene.add(keyL);

/* 底板 */
const boardM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const board=new THREE.Mesh(new THREE.BoxGeometry(26,0.24,15),boardM);
board.position.set(0,-3.4,0);scene.add(board);

/* ---- 静态物件 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}

const SEGS=110; // 每段采样数
/* 曲线管（两段各一根，dirty 时重建） */
const curveMat=new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.35,metalness:0.2,emissive:0xffa000,emissiveIntensity:0.25});
const bsMat=new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.9});
let curveTubes=[];
const bsLine=new THREE.Line(new THREE.BufferGeometry(),bsMat);
bsLine.visible=false;scene.add(bsLine);
/* 曲率梳（LineSegments，dirty 重建） */
const combMat=new THREE.LineBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.85});
const comb=new THREE.LineSegments(new THREE.BufferGeometry(),combMat);
comb.visible=false;scene.add(comb);

/* 控制点与多边形 */
const ptRoot=new THREE.Group();scene.add(ptRoot);
const polyG=new THREE.Group();scene.add(polyG);
const polyMat=new THREE.LineBasicMaterial({color:0x8b97a5,transparent:true,opacity:0.8});
let ptMeshes=[],ptLabels=[],polyLine=null;
const ptMat=()=>new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.3,metalness:0.3,emissive:0xffa000,emissiveIntensity:0.3});
const ptMat2=()=>new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.3,metalness:0.3,emissive:0x1864ab,emissiveIntensity:0.3});

/* de Casteljau 逐层构造线与点（动画中每帧重算位置） */
const lvlMats=[0xffa94d,0x74c0fc,0xb197ff].map(c=>new THREE.LineBasicMaterial({color:c,transparent:true,opacity:0.9}));
const lvlLines=[0,1,2].map(i=>{
  const l=new THREE.Line(new THREE.BufferGeometry(),lvlMats[i]);scene.add(l);return l;});
const dotGeo=new THREE.SphereGeometry(0.09,10,8);
const dotMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3,emissive:0xffffff,emissiveIntensity:0.4});
const lvlDots=[0,1,2].map(()=>{
  const g=new THREE.Group();g.visible=false;scene.add(g);return g;});
const tip=new THREE.Mesh(new THREE.SphereGeometry(0.17,14,12),
  new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.25,emissive:0xff4d4d,emissiveIntensity:0.9}));
scene.add(tip);

/* ---- 状态 ---- */
let order=3,multi=false,seamS=0,c1mode=false,showComb=false,showBs=false;
let pts=[];               // 控制点 {p:Vector3, seg, idx}
let tSweep=0,playing=true,speedT=0.12,labelsOn=true,simT=0;
let dirty=true,seamInfo={kl:0,kr:0,dang:0};
let Q1base=null;          // 第二段首柄的原始断角方向
const tangentDirOfSeg0=()=>pts[2].p.clone().sub(pts[1].p).normalize();

const PRESETS={
  '1s':[[ -5,0],[5,0]],
  '2s':[[ -5,-2.5],[0,3.2],[5,-2.5]],
  '3s':[[ -6.5,-2.5],[-2.5,3.2],[2.5,-3],[6.5,2.2]],
  /* 多段预设：seg 边界处重复接缝占位（i=0 时实际复用上一段末点） */
  '1m':[[ -8,0],[-1,0],[-1,0],[8,0]],
  '2m':[[ -8,-2.5],[-4,3.2],[0,-2.2],[0,-2.2],[3,2.4],[6.5,-1.5]],
  '3m':[[ -9,-2.5],[-5.5,3.2],[-2,-3],[1.5,1.6],[1.5,1.6],[4.5,-2],[7,2.6],[9.5,-1.5]],
};
function segCount(){return multi?2:1;}
function ptsPerSeg(){return order+1;}
function rebuildPoints(){
  const key=(multi?'m':'s');
  const pre=PRESETS[order+key];
  ptRoot.clear();polyG.clear();
  for(let j=labelReg.length-1;j>=0;j--)if(labelReg[j].pt)labelReg.splice(j,1);
  ptMeshes=[];ptLabels=[];pts=[];
  const nSeg=segCount();
  for(let s=0;s<nSeg;s++){
    for(let i=0;i<ptsPerSeg();i++){
      const isSeam=(s===1&&i===0);
      const src=pre[s*ptsPerSeg()+i];
      const p=new THREE.Vector3(src[0],src[1],0);
      if(isSeam)p.copy(pts[pts.length-1].p); // 与上一段末点重合
      pts.push({p,seg:s,idx:i});
      const m=new THREE.Mesh(new THREE.SphereGeometry(0.3,18,14),isSeam?ptMat2():ptMat());
      m.position.copy(p);ptRoot.add(m);ptMeshes.push(m);
    }
  }
  /* 标签 */
  for(let s=0;s<nSeg;s++)for(let i=0;i<ptsPerSeg();i++){
    const gi=s*ptsPerSeg()+i;
    const name=i===0&&s>0?L('接缝','seam'):`P${i}`;
    ptLabels.push(addLabel(()=>name,pts[gi].p.clone().add(new THREE.Vector3(0,0.55,0)),
      i===0&&s>0?'b':'',()=>true,ptRoot));
    labelReg[labelReg.length-1].pt=1;
  }
  /* 控制多边形 */
  const pl=[];
  pts.forEach(pt=>pl.push(pt.p.clone()));
  polyLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pl),polyMat);
  polyG.add(polyLine);
  /* 第二段首柄原始方向（接缝对齐滑块的基准断角） */
  if(multi){
    const gi=ptsPerSeg();
    Q1base=pts[gi].p.clone().sub(pts[gi-1].p);
  }else Q1base=null;
  if(multi)applySeam();
  dirty=true;
}
/* 接缝对齐：把第二段首柄绕接缝旋转，s=1 时与 P2→P3 共线；C¹ 再对齐长度 */
function applySeam(){
  if(!multi||order<1)return;
  const gi=ptsPerSeg();
  const seam=pts[gi-1].p,pPrev=pts[gi-2].p,q=pts[gi];
  const tanDir=seam.clone().sub(pPrev);
  const baseDir=Q1base.clone();
  const th0=Math.atan2(tanDir.x*baseDir.y-tanDir.y*baseDir.x,tanDir.dot(baseDir));
  const th=(1-seamS)*th0;
  const len=c1mode?tanDir.length():baseDir.length();
  const dir=tanDir.clone().normalize().applyAxisAngle(new THREE.Vector3(0,0,1),th);
  q.p.copy(seam).add(dir.multiplyScalar(len));
  ptMeshes[gi].position.copy(q.p);
  dirty=true;
}

/* ---- 贝塞尔 / de Casteljau ---- */
function bez(ptsArr,t){
  let tmp=ptsArr.map(p=>p.clone());
  while(tmp.length>1){
    for(let i=0;i<tmp.length-1;i++)tmp[i].lerp(tmp[i+1],t);
    tmp.pop();
  }
  return tmp[0];
}
function bezLevels(ptsArr,t){ // 返回每层插值点（不含原始控制点层）
  const levels=[];
  let tmp=ptsArr.map(p=>p.clone());
  while(tmp.length>1){
    for(let i=0;i<tmp.length-1;i++)tmp[i].lerp(tmp[i+1],t);
    tmp.pop();
    levels.push(tmp.map(p=>p.clone()));
  }
  return levels;
}
function bezDerivs(ptsArr,t,h=1e-3){ // 一二阶导（数值）
  const t0=clamp(t-h,0,1),t1=clamp(t+h,0,1);
  const p0=bez(ptsArr,t0),p1=bez(ptsArr,t1),p=bez(ptsArr,t);
  const d1=p1.clone().sub(p0).multiplyScalar(1/(t1-t0));
  const d2=p1.clone().add(p0).sub(p.clone().multiplyScalar(2)).multiplyScalar(1/(h*h));
  return{p,d1,d2};
}
function curvature(d1,d2){
  const cr=Math.abs(d1.x*d2.y-d1.y*d2.x);
  const sp=Math.pow(d1.x*d1.x+d1.y*d1.y,1.5);
  return sp>1e-9?cr/sp:0;
}

/* ---- 曲线重建（dirty 时） ---- */
function rebuildCurve(){
  while(curveTubes.length){const t=curveTubes.pop();scene.remove(t);t.geometry.dispose();}
  const nSeg=segCount();
  for(let s=0;s<nSeg;s++){
    const cp=pts.slice(s*ptsPerSeg(),(s+1)*ptsPerSeg()).map(o=>o.p);
    const framePts=[];
    for(let i=0;i<=SEGS;i++)framePts.push(bez(cp,i/SEGS));
    const curve=new THREE.CatmullRomCurve3(framePts);
    const geo=new THREE.TubeGeometry(curve,SEGS,0.05,8,false);
    const m=new THREE.Mesh(geo,curveMat);scene.add(m);curveTubes.push(m);
  }
  /* B 样条对照：均匀三次 De Boor，控制点=当前全部控制点 */
  if(showBs&&pts.length>=4){
    const P=pts.map(o=>o.p);
    const m=P.length-1,deg=3;
    const u0=deg,u1=m+1-1e-4; /* 均匀 B 样条定义域 [p, m+1] */
    const arr=[];
    for(let i=0;i<=140;i++){
      const u=u0+(u1-u0)*i/140;
      const k=Math.min(m,Math.floor(u));
      const d=[];
      for(let j=0;j<=deg;j++)d.push(P[k-deg+j].clone());
      for(let r=1;r<=deg;r++)for(let j=deg;j>=r;j--){
        const i0=k-deg+j;
        d[j]=d[j-1].clone().lerp(d[j],(u-i0)/(deg-r+1));
      }
      arr.push(d[deg]);
    }
    bsLine.geometry.dispose();
    bsLine.geometry=new THREE.BufferGeometry().setFromPoints(arr);
    bsLine.visible=true;
  }else bsLine.visible=false;
  /* 曲率梳 */
  if(showComb)rebuildComb();
  updateSeamStat();
}
function rebuildComb(){
  const arr=[];const SCALE=2.2,STEP=6;
  const nSeg=segCount();
  for(let s=0;s<nSeg;s++){
    const cp=pts.slice(s*ptsPerSeg(),(s+1)*ptsPerSeg()).map(o=>o.p);
    for(let i=0;i<=SEGS;i+=STEP){
      const{p,d1,d2}=bezDerivs(cp,i/SEGS);
      const k=curvature(d1,d2);
      const n2=new THREE.Vector3(-d1.y,d1.x,0).normalize();
      const len=clamp(k*SCALE,0,3.2);
      arr.push(p.clone(),p.clone().add(n2.multiplyScalar(len)));
    }
  }
  comb.geometry.dispose();
  comb.geometry=new THREE.BufferGeometry().setFromPoints(arr);
  comb.visible=true;
}
function updateSeamStat(){
  if(!multi||pts.length<2*ptsPerSeg()){seamInfo={kl:0,kr:0,dang:0};return;}
  const c1=pts.slice(0,ptsPerSeg()).map(o=>o.p);
  const c2=pts.slice(ptsPerSeg()).map(o=>o.p);
  const L1=bezDerivs(c1,1),R0=bezDerivs(c2,0);
  const kl=curvature(L1.d1,L1.d2),kr=curvature(R0.d1,R0.d2);
  const a1=Math.atan2(L1.d1.y,L1.d1.x),a2=Math.atan2(R0.d1.y,R0.d1.x);
  let da=Math.abs(a1-a2)*180/Math.PI;if(da>180)da=360-da;
  seamInfo={kl,kr,dang:da};
}

/* ---- de Casteljau 每帧动画（笔尖在哪一段，就展开那一段的套娃） ---- */
function updateConstruction(){
  const tmax=multi?2:1;
  const tt=clamp(tSweep,0,tmax);
  const s=multi?(tt<=1?0:1):0;
  const lt=multi&&s===1?tt-1:tt;
  const cp=pts.slice(s*ptsPerSeg(),(s+1)*ptsPerSeg()).map(o=>o.p);
  const levels=bezLevels(cp,lt);
  for(let li=0;li<3;li++){
    const line=lvlLines[li],dots=lvlDots[li],lv=levels[li];
    if(!lv){line.visible=false;dots.visible=false;continue;}
    const src=li===0?cp:levels[li-1];
    const pos=[];
    for(let i=0;i<lv.length;i++)pos.push(src[i].clone(),lv[i].clone());
    line.geometry.dispose();
    line.geometry=new THREE.BufferGeometry().setFromPoints(pos);
    line.visible=true;
    while(dots.children.length>lv.length)dots.remove(dots.children[dots.children.length-1]);
    while(dots.children.length<lv.length){const d=new THREE.Mesh(dotGeo,dotMat);dots.add(d);}
    dots.visible=true;
    dots.children.forEach((d,i)=>d.position.copy(lv[i]));
  }
  tip.position.copy(bez(cp,lt)).setZ(0.2);
  document.getElementById('stT').innerHTML=tt.toFixed(2)+'<small></small>';
}

/* ---- 统计 ---- */
function updateStats(){
  document.getElementById('stDeg').innerHTML=order+'<small> / '+(pts.length-1)+' 点</small>';
  const cp=pts.slice(0,ptsPerSeg()).map(o=>o.p);
  const{d1,d2}=bezDerivs(cp,clamp(tSweep,0,1));
  document.getElementById('stK').innerHTML=curvature(d1,d2).toFixed(3)+'<small> 1/u</small>';
  if(multi)document.getElementById('stSeam').innerHTML=
    seamInfo.kl.toFixed(2)+' / '+seamInfo.kr.toFixed(2)+'<small> '+seamInfo.dang.toFixed(1)+'°</small>';
  else document.getElementById('stSeam').innerHTML='—<small></small>';
}

/* ---- 拖拽控制点 ---- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),planeZ=new THREE.Plane(new THREE.Vector3(0,0,1),0);
let dragIdx=-1;
function pickPoint(e){
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=new THREE.Vector3();
  if(!ray.ray.intersectPlane(planeZ,hit))return -1;
  let best=-1,bd=1.1;
  pts.forEach((pt,i)=>{
    const d=hit.distanceTo(pt.p);
    if(d<bd){bd=d;best=i;}
  });
  return best;
}
addEventListener('pointerdown',e=>{
  if(e.target.closest('#panel,#tools'))return;
  const i=pickPoint(e);
  if(i>=0){dragIdx=i;controls.enabled=false;}
});
addEventListener('pointermove',e=>{
  if(dragIdx<0)return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=new THREE.Vector3();
  if(ray.ray.intersectPlane(planeZ,hit)){
    hit.z=0;hit.x=clamp(hit.x,-11,11);hit.y=clamp(hit.y,-6.5,6.5);
    const gi=ptsPerSeg();
    /* 拖接缝时整体平移第二段首柄，保持相对形状 */
    if(multi&&dragIdx===gi-1){
      const delta=hit.clone().sub(pts[dragIdx].p);
      pts[gi].p.add(delta);ptMeshes[gi].position.copy(pts[gi].p);
    }
    pts[dragIdx].p.copy(hit);
    ptMeshes[dragIdx].position.copy(hit);
    ptLabels[dragIdx].position.copy(hit).add(new THREE.Vector3(0,0.55,0));
    if(multi)applySeam();
    polyLine.geometry.dispose();
    polyLine.geometry=new THREE.BufferGeometry().setFromPoints(pts.map(pt=>pt.p.clone()));
    dirty=true;
  }
});
addEventListener('pointerup',()=>{dragIdx=-1;controls.enabled=true;});

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'Bernstein 加权：B(t)=Σ C(n,i)tⁱ(1-t)ⁿ⁻ⁱ·Pi，权重非负、和恒为 1 → 曲线必在控制点凸包内',en:'Bernstein weights: Σ C(n,i)tⁱ(1-t)ⁿ⁻ⁱPi are nonneg and sum to 1 → curve stays in the hull',
   act(){order=3;multi=false;syncUI();rebuildPoints();tSweep=0.3;playing=false;setPlayText();}},
  {zh:'de Casteljau：每层按 t 线性插值，多边形套娃式收缩，最后一个点就是笔尖',en:'de Casteljau: lerp each layer by t, polygon nests down to the pen tip',
   act(){order=3;multi=false;syncUI();rebuildPoints();tSweep=0;playing=true;setPlayText();}},
  {zh:'拖任意控制点：曲线被拉拽实时跟手，但只过首尾两个点',en:'Drag any control point: the curve follows but only passes the ends',
   act(){order=2;multi=false;syncUI();rebuildPoints();tSweep=0.55;playing=false;setPlayText();}},
  {zh:'两段样条：两段三次在接缝拼成长曲线；接缝折角时曲率梳当场张牙',en:'Two segments join at a seam; with a corner the comb splays open',
   act(){multi=true;order=3;seamS=0;c1mode=false;document.getElementById('sSeam').value=0;
     syncUI();rebuildPoints();showComb=true;document.getElementById('btnComb').classList.add('on');
     tSweep=0.4;playing=false;setPlayText();}},
  {zh:'滑到 G¹：Q1 转到切镜方向，切线连续；勾 C¹ 等长后方向+长度全对齐——曲率仍跳（要 C²）',en:'G¹: Q1 rotates onto the tangent; C¹ also matches length — curvature still jumps (needs C²)',
   act(){multi=true;order=3;seamS=1;c1mode=true;document.getElementById('sSeam').value=100;
     syncUI();rebuildPoints();showComb=true;document.getElementById('btnComb').classList.add('on');
     tSweep=0.4;playing=false;setPlayText();}},
  {zh:'B 样条对照：同批控制点，均匀三次 B 样条逼近、不过首尾——字体轮廓与 CSS 缓动都是分段低阶',en:'B-spline: same points, approximating (misses ends) — fonts & CSS easing use piecewise low degree',
   act(){order=3;multi=false;showBs=true;document.getElementById('btnBs').classList.add('on');
     syncUI();rebuildPoints();tSweep=0.7;playing=false;setPlayText();}},
];
let activeStep=0;
function syncUI(){
  [1,2,3].forEach(o=>document.getElementById('ord'+o).classList.toggle('on',o===order));
  document.getElementById('btnMulti').classList.toggle('on',multi);
  document.getElementById('btnComb').classList.toggle('on',showComb);
  document.getElementById('btnBs').classList.toggle('on',showBs);
  document.getElementById('tglC1').checked=c1mode;
}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();STEPS[i].act();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  boardM.color.setHex(dark?0x1c2027:0xc9c2b6);
  polyMat.color.setHex(dark?0x8b97a5:0x5b6b7d);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();rebuildPoints();
}

/* ---- 交互 ---- */
[1,2,3].forEach(o=>document.getElementById('ord'+o).addEventListener('click',()=>{
  order=o;rebuildPoints();syncUI();}));
document.getElementById('btnMulti').addEventListener('click',e=>{
  multi=!multi;e.currentTarget.classList.toggle('on',multi);rebuildPoints();});
document.getElementById('btnComb').addEventListener('click',e=>{
  showComb=!showComb;e.currentTarget.classList.toggle('on',showComb);dirty=true;
  comb.visible=showComb;if(showComb)rebuildCurve();});
document.getElementById('btnBs').addEventListener('click',e=>{
  showBs=!showBs;e.currentTarget.classList.toggle('on',showBs);dirty=true;rebuildCurve();});
document.getElementById('sSeam').addEventListener('input',e=>{
  seamS=+e.target.value/100;
  document.getElementById('sSeamVal').textContent=seamS<0.02?L('折角','corner'):
    (seamS>0.98?L('G¹ 对齐','G¹ aligned'):(seamS*100).toFixed(0)+'%');
  c1mode=document.getElementById('tglC1').checked;
  applySeam();dirty=true;
});
document.getElementById('tglC1').addEventListener('change',e=>{
  c1mode=e.target.checked;applySeam();dirty=true;
});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedT=+e.target.value/100;document.getElementById('sSpdVal').textContent=speedT.toFixed(2)+'/s';});
function setPlayText(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayText();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    tSweep+=dt*speedT;
    const tmax=multi?2:1;
    if(tSweep>tmax)tSweep=0;
    updateConstruction();
  }
  if(dirty){dirty=false;rebuildCurve();if(!playing)updateConstruction();}
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 启动 ---- */
applyTheme();buildSteps();applyLang();
rebuildPoints();syncUI();updateConstruction();
if(qs.get('pause')==='1'){playing=false;setPlayText();}
if(!qsBool('labels',true)){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(qs.get('speed')!==null){const v=clamp(parseFloat(qs.get('speed'))||0.12,0.03,0.4);
  speedT=v;document.getElementById('sSpd').value=Math.round(v*100);
  document.getElementById('sSpdVal').textContent=v.toFixed(2)+'/s';}
updateStats();start();
</script>
