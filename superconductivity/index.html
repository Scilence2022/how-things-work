<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超导与迈斯纳效应 · 零电阻 + 磁场驱逐</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10151c; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(21,128,163,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.r { border-color: rgba(200,60,60,.9); color: #b83232; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.b { color: var(--cold); }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.bad { color: var(--hot); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #ticks { position: relative; height: 13px; }
  #ticks i { position: absolute; font-size: 10px; color: var(--text2); font-style: normal;
    transform: translateX(-50%); }
  #ticks i.tc { color: var(--hot); }
  #rChart { width: 100%; height: 72px; display: block; margin-top: 5px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: flex; gap: 14px; align-items: center; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--panel-border); }
  #play { padding: 10px 18px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>

<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="超导与迈斯纳效应:零电阻 + 磁场驱逐" data-en="Superconductivity & the Meissner effect">超导与迈斯纳效应:零电阻 + 磁场驱逐</h1>
  <div class="sub" data-zh="降温跨过 Tc = 92 K:电子借晶格「牵线」结成库珀对并凝聚成单一量子态,电阻精确归零;迈斯纳表面环流把磁场彻底逐出体外,被压缩的场梯度托起磁体——II 型超导还能靠磁通钉扎锁在半空,倒挂也不掉 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Cool past Tc = 92 K: electrons pair through the lattice into Cooper pairs and condense — resistance drops exactly to zero; Meissner currents expel the field, and the squeezed gradient levitates the magnet — type-II pinning even holds it upside down · 3D interactive · drag to orbit / scroll to zoom · Space = play/pause">降温跨过 Tc = 92 K:电子借晶格「牵线」结成库珀对并凝聚成单一量子态,电阻精确归零;迈斯纳表面环流把磁场彻底逐出体外,被压缩的场梯度托起磁体——II 型超导还能靠磁通钉扎锁在半空,倒挂也不掉 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>

  <div class="row"><label data-zh="温度" data-en="Temperature">温度</label><input id="tS" type="range" min="0" max="300" step="1" value="300"><span class="val" id="tVal">300 K</span></div>

    <a href="../transformer/" data-zh="线圈与磁场的老故事" data-en="coils &amp; fields, the old story">线圈与磁场的老故事</a>
    <a href="../mri/" data-zh="超导磁体在哪里上班" data-en="where superconducting magnets work">超导磁体在哪里上班</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ss = x => { const t = clamp(x, 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const labelReg = [];
let labelsOn = true;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10151c);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.ped.color.set(THEME === 'light' ? 0xb9c2d0 : 0x39424f);
  drawRT();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('超导与迈斯纳效应', 'Superconductivity & the Meissner effect');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  drawRT();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(3.6, 2.3, 6.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  ped: mat(0x39424f, { roughness: 0.7 }),
  disc: mat(0x20242e, { roughness: 0.32, metalness: 0.1, transparent: true, opacity: 0.42,
    emissive: 0x1899b0, emissiveIntensity: 0.02, side: THREE.DoubleSide, depthWrite: false }),
  ion: mat(0xe0a35c, { roughness: 0.4, emissiveIntensity: 0.18 }),
  magN: mat(0xff5d5d, { roughness: 0.4 }),
  magS: mat(0x4cc9f0, { roughness: 0.4 }),
};
const eMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const cMat = new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.75, depthWrite: false });
const fluxMat = new THREE.LineBasicMaterial({ color: 0x7fd0f7, transparent: true, opacity: 0.5, depthWrite: false });
const arrMat = new THREE.MeshBasicMaterial({ color: 0x9adfff, transparent: true, opacity: 0.7,
  depthWrite: false, blending: THREE.AdditiveBlending });
const vtxMat = new THREE.MeshBasicMaterial({ color: 0x9adfff, transparent: true, opacity: 0.5,
  depthWrite: false, blending: THREE.AdditiveBlending });
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.0,
  depthWrite: false, blending: THREE.AdditiveBlending });
const dummy = new THREE.Object3D();
const upV = new THREE.Vector3(0, 1, 0), d3 = new THREE.Vector3();

/* ================= 状态与物理 ================= */
const TC = 92, RN = 46, HMAX = 1.15;
let T = 300, B = 1.0, pin = false;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let auto = true, phase = 0, pt = 0, burst = null;
let hVis = 0, hVel = 0, tSim = 0;
let E = 0, pairCnt = 0, pairPct = 0;
const ROf = t => t >= TC ? RN * t / 300 : 0;
function physStep(h) {
  if (burst) {
    const d = burst.tgt - T, st = burst.rate * h;
    T += Math.abs(d) <= st ? d : Math.sign(d) * st;
    if (T === burst.tgt) burst = null;
  } else if (auto) {
    if (phase === 0) { T -= 7.5 * h; if (T <= 0) { T = 0; phase = 1; pt = 0; } }
    else if (phase === 1) { pt += h; if (pt > 3) { phase = 2; pt = 0; } }
    else if (phase === 2) { T += 30 * h; if (T >= 300) { T = 300; phase = 3; pt = 0; } }
    else { pt += h; if (pt > 3) { phase = 0; pt = 0; } }
  }
}
function fastForward(sec) {
  const n = Math.min(Math.ceil(sec / 0.2), 4000);
  for (let i = 0; i < n; i++) physStep(0.2);
}

/* ================= 舞台:底座 + 超导盘 ================= */
const PLANE = 0.36, MAG_HH = 0.3, POLOFF = 0.22;
const floor = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 7.5, 0.14, 48), M.floor);
floor.position.y = -0.57;
scene.add(floor);
const ped = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 2.35, 0.5, 48), M.ped);
ped.position.y = -0.25;
scene.add(ped);
const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.55, 0.36, 48), M.disc);
disc.position.y = 0.18;
scene.add(disc);

/* ---------------- 晶格正离子(InstancedMesh,振动幅度 ∝ T) ---------------- */
const RINGS = [[0.32, 7], [0.66, 13], [1.0, 20], [1.32, 26]];
const ionBase = [];
for (const [r, n] of RINGS) for (let j = 0; j < n; j++) for (const yy of [0.1, 0.26]) {
  const a = j / n * Math.PI * 2 + r;
  ionBase.push(r * Math.cos(a), yy, r * Math.sin(a));
}
const NION = ionBase.length / 3;
const ions = new THREE.InstancedMesh(new THREE.SphereGeometry(0.042, 8, 6), M.ion, NION);
ions.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(ions);
const ionF = new Float32Array(NION), ionP = new Float32Array(NION * 3);
for (let i = 0; i < NION; i++) {
  ionF[i] = 5 + Math.random() * 7;
  for (let a = 0; a < 3; a++) ionP[i * 3 + a] = Math.random() * Math.PI * 2;
}

/* ---------------- 电子 + 库珀对(成对结对,弹簧相连,同相环流) ---------------- */
const NP = 40, NE = 80;
const pR = new Float32Array(NP), pY = new Float32Array(NP), pA = new Float32Array(NP), pTf = new Float32Array(NP);
for (let k = 0; k < NP; k++) {
  pR[k] = 0.42 + 0.94 * (k % 5) / 4 + (k * 0.173 % 1) * 0.05;
  pY[k] = 0.09 + 0.17 * (k % 2);
  pA[k] = k * 2.39996 + (k * 0.311 % 1) * 0.8;
  pTf[k] = 110 - 18 * k / (NP - 1);          // 逐对配对温度 110→92 K
}

/* ---------------- 磁感线:双磁荷模型 + 镜像磁荷(迈斯纳逐磁) ----------------
   E=0:纯磁偶极,场线直穿盘体;E=1:镜像把法向分量压零,场线被挤出、贴面绕行 */
const AZ = 8, ALPHAS = [0.63, 0.74, 0.88, 1.04], MAXP = 240, HS = 0.07;
const lineGeoArr = [];
for (let s = 0; s < ALPHAS.length; s++) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAXP * 3), 3));
  lineGeoArr.push(g);
  for (let a = 0; a < AZ; a++) {

const bOut = [0, 0];
function fieldAt(x, y, my, Ee) {
  let br = 0, by = 0, dr, dy, r2, r, f;
  dr = x; dy = y - (my + POLOFF); r2 = Math.max(dr * dr + dy * dy, 0.003);
  r = Math.sqrt(r2); f = 1 / (r2 * r); br += f * dr; by += f * dy;
  dr = x; dy = y - (my - POLOFF); r2 = Math.max(dr * dr + dy * dy, 0.003);
  r = Math.sqrt(r2); f = -1 / (r2 * r); br += f * dr; by += f * dy;
  if (Ee > 0) {
    dr = x; dy = y - (2 * PLANE - my - POLOFF); r2 = Math.max(dr * dr + dy * dy, 0.003);
    r = Math.sqrt(r2); f = -Ee / (r2 * r); br += f * dr; by += f * dy;
    dr = x; dy = y - (2 * PLANE - my + POLOFF); r2 = Math.max(dr * dr + dy * dy, 0.003);
    r = Math.sqrt(r2); f = Ee / (r2 * r); br += f * dr; by += f * dy;
  }
  bOut[0] = br; bOut[1] = by;
}
function traceShell(ai, my, Ee, g) {
  const arr = g.attributes.position.array;
  let x = 0.1 * Math.sin(ai), y = my + POLOFF + 0.1 * Math.cos(ai), n = 0;
  for (let i = 0; i < MAXP; i++) {
    fieldAt(x, y, my, Ee);
    let br = bOut[0], by = bOut[1], m = Math.hypot(br, by);
    if (m < 1e-8) break;
    fieldAt(x + br / m * HS * 0.5, y + by / m * HS * 0.5, my, Ee);
    br = bOut[0]; by = bOut[1]; m = Math.hypot(br, by);
    if (m < 1e-8) break;
    x += br / m * HS; y += by / m * HS;
    if (Ee > 0.35 && y < PLANE + 0.02) y = PLANE + 0.02;
    arr[n * 3] = x; arr[n * 3 + 1] = y; n++;
    if (Math.hypot(x, y - (my - POLOFF)) < 0.13) break;
    if (Ee <= 0.35 && y < -0.46) break;
    if (x > 3.4 || y > my + 4) break;
  }
  return n;
}
function updateFieldLines() {
  const my = magnet.position.y, Ee = E;
  let ai = 0;
  for (let s = 0; s < ALPHAS.length; s++) {
    const n = traceShell(ALPHAS[s], my, Ee, lineGeoArr[s]);
    lineGeoArr[s].setDrawRange(0, n);
    lineGeoArr[s].attributes.position.needsUpdate = true;
    if (n > 6) {
      const idx = clamp(Math.round(n * 0.35), 2, n - 2);
      const arr = lineGeoArr[s].attributes.position.array;
      const x = arr[idx * 3], y = arr[idx * 3 + 1];
      let dx = arr[(idx + 1) * 3] - arr[(idx - 1) * 3], dy = arr[(idx + 1) * 3 + 1] - arr[(idx - 1) * 3 + 1];
      const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
      for (let a = 0; a < AZ; a++) {
        const phi = a / AZ * Math.PI * 2, cp = Math.cos(phi), sp = Math.sin(phi);
        dummy.position.set(x * cp, y, x * sp);
        d3.set(dx * cp, dy, dx * sp).normalize();
        dummy.quaternion.setFromUnitVectors(upV, d3);
        dummy.scale.setScalar(1);
        dummy.updateMatrix();
        arrows.setMatrixAt(ai++, dummy.matrix);
      }
    } else ai += AZ;
  }
  arrows.instanceMatrix.needsUpdate = true;
}

function updateElectrons(h) {
  const om = 1.5, spd = 0.25 + 0.85 * clamp(T / 300, 0, 1);
  const scat = clamp(T / 300, 0, 1) * 7 + 0.4;
  pairCnt = 0;
  for (let k = 0; k < NP; k++) if (T < pTf[k]) pairCnt++;
  pairPct = Math.round(pairCnt / NP * 100);
  for (let e = 0; e < NE; e++) {
    const k = e >> 1, tgt = T < pTf[k] ? 1 : 0;
    eb[e] += (tgt - eb[e]) * (1 - Math.exp(-2.6 * h));
    const bb = eb[e] * eb[e] * (3 - 2 * eb[e]);
    let x = wp[e * 3], y = wp[e * 3 + 1], z = wp[e * 3 + 2];
    if (bb < 0.999) {
      if (Math.random() < scat * h) {
        const a = Math.random() * 6.283, c = Math.random() * 2 - 1, s = Math.sqrt(1 - c * c);
        wv[e * 3] = s * Math.cos(a) * spd; wv[e * 3 + 1] = c * spd * 0.7; wv[e * 3 + 2] = s * Math.sin(a) * spd;
      }
      x += wv[e * 3] * h; y += wv[e * 3 + 1] * h; z += wv[e * 3 + 2] * h;
      const rr = Math.hypot(x, z);
      if (rr > 1.36) { const fq = 1.36 / rr; x *= fq; z *= fq; wv[e * 3] *= -1; wv[e * 3 + 2] *= -1; }
      if (y < 0.05) { y = 0.05; wv[e * 3 + 1] = Math.abs(wv[e * 3 + 1]); }
      if (y > 0.31) { y = 0.31; wv[e * 3 + 1] = -Math.abs(wv[e * 3 + 1]); }
      wp[e * 3] = x; wp[e * 3 + 1] = y; wp[e * 3 + 2] = z;
    }
    const ang = pA[k] + (e % 2 ? 0.085 : -0.085) + om * tSim;
    x += (pR[k] * Math.cos(ang) - x) * bb;
    y += (pY[k] - y) * bb;
    z += (pR[k] * Math.sin(ang) - z) * bb;
    ep[e * 3] = x; ep[e * 3 + 1] = y; ep[e * 3 + 2] = z;
    dummy.position.set(x, y, z);
    dummy.quaternion.identity(); dummy.scale.setScalar(1);
    dummy.updateMatrix();
    els.setMatrixAt(e, dummy.matrix);
    els.setColorAt(e, eCol.setRGB(1, 0.82 + 0.09 * bb, 0.4 + 0.58 * bb));
  }
  els.instanceMatrix.needsUpdate = true;
  if (els.instanceColor) els.instanceColor.needsUpdate = true;
  for (let k = 0; k < NP; k++) {
    if ((eb[k * 2] + eb[k * 2 + 1]) * 0.5 > 0.35) {
      const ax = ep[k * 6], ay = ep[k * 6 + 1], az = ep[k * 6 + 2];
      const dx = ep[k * 6 + 3] - ax, dy = ep[k * 6 + 4] - ay, dz = ep[k * 6 + 5] - az;
      const len = Math.hypot(dx, dy, dz) || 0.001;
      dummy.position.set(ax + dx / 2, ay + dy / 2, az + dz / 2);
      d3.set(dx / len, dy / len, dz / len);
      dummy.quaternion.setFromUnitVectors(upV, d3);
      dummy.scale.set(1, len, 1);
    } else { dummy.position.set(0, -10, 0); dummy.quaternion.identity(); dummy.scale.setScalar(0.0001); }
    dummy.updateMatrix();
    cons.setMatrixAt(k, dummy.matrix);
  }
  cons.instanceMatrix.needsUpdate = true;
}
function updateIons() {
  const amp = 0.004 + 0.03 * clamp(T / 300, 0, 1);
  for (let i = 0; i < NION; i++) {
    const f = ionF[i] * tSim;
    dummy.position.set(
      ionBase[i * 3] + amp * Math.sin(f + ionP[i * 3]),
      ionBase[i * 3 + 1] + amp * 0.6 * Math.sin(f * 1.31 + ionP[i * 3 + 1]),
      ionBase[i * 3 + 2] + amp * Math.sin(f * 0.83 + ionP[i * 3 + 2]));
    dummy.quaternion.identity(); dummy.scale.setScalar(1);
    dummy.updateMatrix();
    ions.setMatrixAt(i, dummy.matrix);
  }
  ions.instanceMatrix.needsUpdate = true;
}
function updateMagnet(dts) {
  const Bn = clamp((B - 0.2) / 1.3, 0, 1);
  const hT = Math.pow(E, 0.75) * (0.3 + 0.7 * Bn) * HMAX;
  if (dts > 0) {
    hVel += (hT - hVis) * 26 * dts;
    hVel *= Math.exp(-4.6 * dts);
    hVis = clamp(hVis + hVel * dts, 0, 2.2);
  }
  const lock = pin ? 1 : 0;
  magnet.position.set(0.045 * (1 - lock) * E * Math.sin(tSim * 0.9), PLANE + 0.02 + hVis + MAG_HH, 0);
  magnet.rotation.z = 0.03 * (1 - lock) * E * Math.sin(tSim * 0.63);
  magnet.rotation.x = 0.02 * (1 - lock) * E * Math.sin(tSim * 0.47);
}

/* ================= R(T) 小图:Tc 处的悬崖 ================= */
function drawRT() {
  const cv = document.getElementById('rChart');
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  const W = cv.width = cv.clientWidth * 2, H = cv.height = cv.clientHeight * 2;
  if (!W || !H) return;
  const css = getComputedStyle(document.documentElement);
  const cT = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  ctx.clearRect(0, 0, W, H);
  const L0 = 42, R0 = 14, T0 = 16, B0 = 26;
  const xOf = t => L0 + (W - L0 - R0) * t / 300, yOf = r => H - B0 - (H - T0 - B0) * r / RN;
  ctx.strokeStyle = cT; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(L0, T0); ctx.lineTo(L0, H - B0); ctx.lineTo(W - R0, H - B0); ctx.stroke();
  ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(255,122,92,.85)';
  ctx.beginPath(); ctx.moveTo(xOf(TC), T0); ctx.lineTo(xOf(TC), H - B0); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = '#7bd88f'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(xOf(0), yOf(0)); ctx.lineTo(xOf(TC), yOf(0)); ctx.stroke();
  ctx.strokeStyle = '#ffd166';
  ctx.beginPath(); ctx.moveTo(xOf(TC), yOf(RN * TC / 300)); ctx.lineTo(xOf(300), yOf(RN)); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xOf(TC), yOf(RN * TC / 300)); ctx.lineTo(xOf(TC), yOf(0)); ctx.stroke();
  ctx.fillStyle = T >= TC ? '#ffd166' : '#7bd88f';
  ctx.beginPath(); ctx.arc(xOf(T), yOf(ROf(T)), 6, 0, 7); ctx.fill();
  ctx.font = '16px system-ui'; ctx.fillStyle = cT; ctx.textAlign = 'center';
  ctx.fillText('0', xOf(0), H - 8); ctx.fillText('92', xOf(TC), H - 8); ctx.fillText('300 K', xOf(300), H - 8);
  ctx.fillStyle = 'rgba(255,122,92,.95)'; ctx.fillText('Tc', xOf(TC), T0 - 3);
  ctx.textAlign = 'left'; ctx.fillStyle = cT;
  ctx.fillText('R/μΩ·cm', L0 - 34, T0 + 4);
}

      `Cool past <b>Tc = 92 K</b> → pair condensate + Meissner expulsion (steps 3–4)`);
  } else {
    const bin = pin && E > 0.5 ? (0.15 * 60 * B).toFixed(1) : '0';
    formulaEl.innerHTML = L(
      `<b>ρ = 0(精确归零)</b> · 库珀对 ${pairPct}% · e⁻–晶格–e⁻ 牵线配对,相位锁死<br>` +
      `<b>迈斯纳:B_in = ${bin} mT</b>${pin && E > 0.5 ? '(钉扎俘获)' : ''} · F ∝ ∇B²,h ≈ ${mm} mm`,
      `<b>ρ = 0 (exact)</b> · Cooper pairs ${pairPct}% · e⁻–lattice–e⁻ pairing, phase-locked<br>` +
      `<b>Meissner: B_in = ${bin} mT</b>${pin && E > 0.5 ? ' (pinned flux)' : ''} · F ∝ ∇B², h ≈ ${mm} mm`);
  }
}
elT.addEventListener('input', () => { T = +elT.value; auto = false; burst = null; elTVal.textContent = Math.round(T) + ' K'; });
elB.addEventListener('input', () => { B = +elB.value; elBVal.textContent = B.toFixed(2) + '×'; });
elSpd.addEventListener('input', () => { speed = +elSpd.value; elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; if (playing) { auto = true; burst = null; } setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
tglPin.addEventListener('change', () => { pin = tglPin.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawRT();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, acc = 1;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) { physStep(dts); tSim += dts; }
  E = ss((TC + 1.6 - T) / 4.8);
  updateMagnet(playing ? dts : 0);
  updateIons();
  updateElectrons(playing ? dts : 0);
  updateFieldLines();
  const Bn = clamp((B - 0.2) / 1.3, 0, 1);
  fluxMat.opacity = 0.14 + 0.34 * Bn;
  arrMat.opacity = 0.25 + 0.45 * Bn;
  vtxMat.opacity = pin ? ss(E * 1.25) * (0.3 + 0.5 * Bn) : 0;
  vtx.visible = pin && vtxMat.opacity > 0.02;
  ringMat.opacity = ss(E * 1.15) * (0.2 + 0.55 * Bn);
  M.disc.emissiveIntensity = 0.02 + E * 0.13;
  acc += dt;
  if (acc > 0.25) {
    acc = 0;
    updateStats(); updateFormula(); drawRT();
  }
  for (const r of labelReg) if (labelsOn && r.vis()) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
pin = qsBool('pin', false);
tglPin.checked = pin;
fastForward(clamp(qsFloat('t', 0), 0, 400));
elT.value = Math.round(T); elTVal.textContent = Math.round(T) + ' K';
elB.value = B; elBVal.textContent = B.toFixed(2) + '×';
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
applyTheme();
applyLang();
updateStats();
updateFormula();
start();
</script>
</body>
