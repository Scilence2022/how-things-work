<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酸雨 · 从烟囱到被蚀的大理石</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#5fb0e8;
    --bg:#0d1420; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --ok:#7bd88f;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1b6fa8;
    --bg:#e3ecf4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --ok:#1e8a4c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(111,232,111,.85); color: #c9f5c9; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(23,138,58,.85); color: #178a3a; }
  :root[data-theme="light"] .lbl.r { border-color: rgba(185,52,39,.9); color: #b93427; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v.ok { color: var(--ok); }
  #stats .v.bad { color: var(--hot); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 396px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.a { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .chip.d { color: #ffe0c2; border-color: rgba(255,169,120,.7); }
  .chip.h { color: #c9f5c9; border-color: rgba(111,232,111,.55); }
  :root[data-theme="light"] .chip.a { color: #1d5fa8; border-color: rgba(47,98,168,.75); }
  :root[data-theme="light"] .chip.d { color: #9a5410; border-color: rgba(185,110,40,.7); }
  :root[data-theme="light"] .chip.h { color: #178a3a; border-color: rgba(23,138,58,.6); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(95,176,232,.10); border-color: rgba(95,176,232,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(27,111,168,.08); border-color: rgba(27,111,168,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde1fb; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="酸雨:从烟囱到被蚀的大理石" data-en="Acid Rain: from smokestack to etched marble">酸雨:从烟囱到被蚀的大理石</h1>
  <div class="sub" data-zh="燃煤与尾气把 SO₂/NOx 抛进天空 → 云滴把它氧化成硫酸硝酸 → pH 从 5.6 滑到 4.3(每降 1,[H⁺]×10)→ 酸雨起泡溶蚀大理石、酸湖死鱼、森林枯黄;脱硫塔与三元催化可治 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Coal and tailpipes throw SO₂/NOx into the sky → cloud droplets oxidize it into sulfuric & nitric acid → pH slides 5.6→4.3 (each unit = ×10 H⁺) → rain fizzes marble, sours lakes, browns forests; scrubbers and catalytic converters fix it · 3D interactive · drag to orbit / scroll to zoom · Space = play/pause">燃煤与尾气把 SO₂/NOx 抛进天空 → 云滴把它氧化成硫酸硝酸 → pH 从 5.6 滑到 4.3(每降 1,[H⁺]×10)→ 酸雨起泡溶蚀大理石、酸湖死鱼、森林枯黄;脱硫塔与三元催化可治 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="云水 pH" data-en="cloud pH">云水 pH</span><span class="v ok" id="stPH">5.60</span>
  <span class="k" data-zh="H⁺ 倍率(vs 天然)" data-en="H⁺ × vs natural">H⁺ 倍率(vs 天然)</span><span class="v" id="stHX">×1.0</span>
  <span class="k" data-zh="雕像腐蚀" data-en="statue etched">雕像腐蚀</span><span class="v" id="stEt">0.00 mm</span>
  <span class="k" data-zh="湖水 pH" data-en="lake pH">湖水 pH</span><span class="v" id="stLK">7.20</span>
  <span class="k" data-zh="排放量" data-en="emissions">排放量</span><span class="v" id="stEM">1.4 kt/a</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip a" data-zh="SO₂(燃煤烟气)" data-en="SO₂ (coal flue gas)">SO₂(燃煤烟气)</span>
    <span class="chip d" data-zh="NOx(汽车尾气)" data-en="NOx (car exhaust)">NOx(汽车尾气)</span>
    <span class="chip h" data-zh="H⁺(强酸全电离)" data-en="H⁺ (full dissociation)">H⁺(强酸全电离)</span>
  </div>
  <div class="row"><label data-zh="排放强度" data-en="Emission">排放强度</label><input id="emi" type="range" min="0" max="100" step="1" value="65"><span class="val" id="emiVal">65%</span></div>
  <div class="row"><label data-zh="风向" data-en="Wind">风向</label><input id="wnd" type="range" min="-60" max="60" step="5" value="0"><span class="val" id="wndVal">0°</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglFix" type="checkbox"> <span data-zh="治理:脱硫+催化" data-en="Fix: scrubber + catalyst">治理:脱硫+催化</span></label>
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../buffer-solution/" data-zh="pH 与缓冲的语言" data-en="the language of pH & buffers">pH 与缓冲的语言</a>
    <a href="../ozone-depletion/" data-zh="另一场大气化学事故" data-en="another atmospheric chemistry accident">另一场大气化学事故</a>
    <a href="../cloud-formation/" data-zh="云滴从哪里来" data-en="where cloud droplets come from">云滴从哪里来</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const R2D = 180 / Math.PI;

/* ---------------- 化学刻度:pH = −log[H⁺] ----------------
   天然雨水:CO₂+H₂O⇌H₂CO₃ → [H⁺]=10⁻⁵·⁶;污染上限 pH 4.3;
   云中酸储存 C 以 9 s 输运延迟进入,湖水/森林/雕像再被雨水拖拽。 */
const HNAT = Math.pow(10, -5.6), MAXC = Math.pow(10, -4.3) - Math.pow(10, -5.6);
const HL0 = Math.pow(10, -7.2);
let C = 0, Lak = 0, Df = 0, etch = 0;
const pHc = () => -Math.log10(HNAT + Math.max(C, 0));
const pHl = () => -Math.log10(HL0 + Math.max(Lak, 0));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const bg = THEME === 'light' ? 0xe3ecf4 : 0x0d1420;
  scene.background = new THREE.Color(bg);
  scene.fog.color.setHex(bg);
  M.ground.color.setHex(THEME === 'light' ? 0x93aa7c : 0x2a3a26);
  M.water.color.setHex(THEME === 'light' ? 0x6fa3c2 : 0x2f5d7d);
  M.road.color.setHex(THEME === 'light' ? 0x8b929c : 0x363c44);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('酸雨:从烟囱到被蚀的大理石', 'Acid Rain: from smokestack to etched marble');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.fog = new THREE.Fog(0x0d1420, 15, 34);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.4, 3.6, 11.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.2, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(5, 9, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 4, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.06, ...opts });
}
const M = {
  ground: mat(0x2a3a26, { roughness: 0.95, emissiveIntensity: 0 }),
  road: mat(0x363c44, { roughness: 0.9, emissiveIntensity: 0 }),
  plant: mat(0x5b6470, { roughness: 0.7 }),
  dark: mat(0x2e353e, { roughness: 0.8 }),
  stack: mat(0x8a4a3a, { roughness: 0.85 }),
  scrub: mat(0x7a94a8, { roughness: 0.5 }),
  gypsum: mat(0xd8d4c8, { roughness: 0.9, transparent: true, opacity: 0 }),
  car: mat(0xb0483c, { roughness: 0.4, metalness: 0.3 }),
  tire: mat(0x1c1f24, { roughness: 0.9, emissiveIntensity: 0 }),
  marble: mat(0xe9e5da, { roughness: 0.5, metalness: 0.02 }),
  water: mat(0x2f5d7d, { roughness: 0.15, metalness: 0.1 }),
  cloud: new THREE.MeshBasicMaterial({ color: 0xe8eef4, transparent: true, opacity: 0.6, depthWrite: false }),
  drop: new THREE.MeshBasicMaterial({ color: 0xcfe3f2, transparent: true, opacity: 0.75 }),
  rain: new THREE.MeshBasicMaterial({ color: 0x7fb3dd, transparent: true, opacity: 0.62 }),
  so2: new THREE.MeshBasicMaterial({ color: 0xc9b38a, transparent: true, opacity: 0.5, depthWrite: false }),
  nox: new THREE.MeshBasicMaterial({ color: 0xb98a6a, transparent: true, opacity: 0.5, depthWrite: false }),
  bub: new THREE.MeshBasicMaterial({ color: 0xeaf6ff, transparent: true, opacity: 0.85, depthWrite: false }),
  fish: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }),
  trunk: mat(0x6b4a33, { roughness: 0.9, emissiveIntensity: 0 }),
  canopy: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }),
};

/* ================= 布景:左=电厂+车,中=云雨,右=雕像/湖/林 ================= */
const ground = new THREE.Mesh(new THREE.BoxGeometry(11.6, 0.24, 6.2), M.ground);
ground.position.y = -0.12;
scene.add(ground);
const road = new THREE.Mesh(new THREE.BoxGeometry(11.2, 0.02, 0.5), M.road);
road.position.set(0, 0.01, 1.55);
scene.add(road);

/* 电厂 + 脱硫塔 */
const plant = new THREE.Group();
plant.position.set(-4.2, 0, -0.6);
scene.add(plant);
const hall = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.72, 0.9), M.plant);
hall.position.set(-0.2, 0.36, 0.25);
plant.add(hall);
const stack = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, 1.7, 12), M.stack);
stack.position.set(-0.25, 0.85, -0.28);
plant.add(stack);
const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 1.05, 14), M.scrub);
tower.position.set(0.72, 0.52, -0.28);
plant.add(tower);
const duct = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.12), M.dark);
duct.position.set(0.25, 0.62, -0.28);
plant.add(duct);
const gypsum = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 8), M.gypsum);
gypsum.scale.set(1.3, 0.45, 1);
gypsum.position.set(0.78, 0.06, 0.35);
plant.add(gypsum);

/* 汽车 + 三元催化 */
const car = new THREE.Group();

const hist = new Float32Array(64);
const windV = new THREE.Vector3();
function setWind(deg) { windV.set(Math.cos(deg / R2D), 0, Math.sin(deg / R2D)).multiplyScalar(0.62); }
setWind(0);
const effE = () => E * (scrub ? 0.09 : 1);
function physStep(h) {
  acc += h;
  while (acc >= 0.25) { hist[hi] = effE(); hi = (hi + 1) & 63; acc -= 0.25; }
  const del = hist[(hi + 64 - 36) & 63];            // 9 s 输运延迟后到达云层
  const tau = scrub ? 26 : 48;
  C = Math.max(0, C + (MAXC / 48 * del - C / tau) * h);
  Lak = Math.max(0, Lak + (0.014 * C - Lak / 60) * h);
  const cK = C / MAXC;
  Df = clamp(Df + (0.025 * cK * (1 - Df) - (cK < 0.05 ? 0.012 * Df : 0)) * h, 0, 1);
  etch += 0.028 * clamp((5.6 - pHc()) / 1.3, 0, 1.6) * h;
}
function resetState() {
  tSim = 0; acc = 0; hi = 0; hist.fill(0);
  C = Lak = Df = etch = 0;
  absorbT1 = absorbT2 = bubAcc = so2Acc = noxAcc = 0;
  for (const s of so2P) s.life = 0;
  for (const s of noxP) s.life = 0;
  for (const s of bubP) s.life = 0;
}
function seedPlume() {
  for (const [pl, tip, up] of [[so2P, stackTip, 0.55], [noxP, tailPipe, 0.25]]) {
    for (const s of pl) {
      if (Math.random() < 0.45) continue;
      const k = Math.random();
      s.life = 14 * (1 - 0.8 * k);
      s.p.set(tip.x + windV.x * 9 * k + (Math.random() - 0.5) * 0.35,
        tip.y + (2.55 - tip.y) * Math.min(1, k * 1.5) + (Math.random() - 0.5) * 0.2,
        tip.z + windV.z * 9 * k + (Math.random() - 0.5) * 0.35);
      s.v.set(windV.x, up * (1 - k), windV.z);
    }
  }
}
function fastForward(sec) {
  const lim = tSim + sec;
  let g = 0;
  while (tSim < lim && g++ < 3000) { physStep(0.25); tSim += 0.25; }
  seedPlume();
}
function instantSim(sec) { resetState(); fastForward(sec); }

/* ---------------- 粒子推进 ---------------- */
function birth(s, tip, up) {
  s.life = 14;
  s.p.set(tip.x + (Math.random() - 0.5) * 0.08, tip.y, tip.z + (Math.random() - 0.5) * 0.08);
  s.v.set(windV.x + (Math.random() - 0.5) * 0.1, up + Math.random() * 0.25, windV.z + (Math.random() - 0.5) * 0.1);
}
function spawnPlume(dts) {
  so2Acc += 16 * effE() * dts;
  noxAcc += 10 * effE() * dts;
  for (const s of so2P) { if (so2Acc < 1) break; if (s.life <= 0) { birth(s, stackTip, 0.55); so2Acc -= 1; } }
  for (const s of noxP) { if (noxAcc < 1) break; if (s.life <= 0) { birth(s, tailPipe, 0.25); noxAcc -= 1; } }
}
function advect(pl, mesh, isSO2, dts) {
  let hit = false;
  for (let i = 0; i < pl.length; i++) {
    const s = pl[i];
    if (s.life > 0) {
      s.life -= dts;
      s.v.y += (0.06 - s.v.y) * Math.min(dts * 0.55, 1);
      s.p.addScaledVector(s.v, dts);
      s.p.x += Math.sin(tSim * 1.7 + s.ph) * 0.12 * dts;
      if (s.p.y > 2.35 && s.p.y < 3.95 && s.p.x > -1.5 && s.p.x < 2.8 && Math.abs(s.p.z) < 2.15) {
        s.life = 0; hit = true;                          // 进入云滴:被吸收氧化
      } else if (s.life <= 0 || s.p.x > 5.8 || Math.abs(s.p.z) > 3.2) s.life = 0;
    }
    if (s.life > 0) {
      dummy.position.copy(s.p);
      dummy.scale.setScalar(0.5 + 2.2 * (1 - clamp(s.life / 14, 0, 1)));
    } else {
      dummy.position.set(0, -9, 0);
      dummy.scale.setScalar(0.0001);
    }
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (hit) { if (isSO2) absorbT1 = 2.2; else absorbT2 = 2.2; }
}
const RX0 = 0.2, RX1 = 4.9, RZ0 = -1.9, RZ1 = 1.9;
function rainStep(dts) {
  const wx = windV.x * 0.35, wz = windV.z * 0.35;
  for (let i = 0; i < RAINN; i++) {
    const d = rainP[i];
    d.y -= 2.7 * dts;
    d.x += wx * dts;
    d.z += wz * dts;
    const near = Math.abs(d.x - SX) < 0.3 && Math.abs(d.z - SZ) < 0.3;
    if (d.y < (near ? 1.27 : 0.03)) {
      if (near && playing) bubAcc += 2 * clamp((5.6 - pHc()) / 1.3, 0, 1.6);
      d.y = 2.55 + Math.random() * 0.55;
      d.x = RX0 + Math.random() * (RX1 - RX0);
      d.z = RZ0 + Math.random() * (RZ1 - RZ0);
    }
    dummy.position.set(d.x, d.y, d.z);
    dummy.scale.setScalar(1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    rainI.setMatrixAt(i, dummy.matrix);
  }
  rainI.instanceMatrix.needsUpdate = true;
}
function bubStep(dts) {
  for (let i = 0; i < BUBN; i++) {
    const b = bubP[i];
    if (b.life > 0) {
      b.life -= dts;
      b.p.y += 0.22 * dts;
      dummy.position.copy(b.p);
      dummy.scale.setScalar(Math.max(0.25, b.life) * 1.1);
    } else {
      dummy.position.set(0, -9, 0);
      dummy.scale.setScalar(0.0001);
    }
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    bubI.setMatrixAt(i, dummy.matrix);
  }
  bubI.instanceMatrix.needsUpdate = true;
  bubAcc = Math.min(bubAcc, 6);
  for (const b of bubP) {
    if (bubAcc < 1) break;
    if (b.life > 0) continue;
    const a = Math.random() * Math.PI * 2;
    b.life = 0.6 + Math.random() * 0.5;
    b.p.set(SX + Math.cos(a) * 0.15, 0.45 + Math.random() * 0.85, SZ + Math.sin(a) * 0.15);
    bubAcc -= 1;
  }
}

/* ---------------- 外观更新 ---------------- */
const CLOUD0 = new THREE.Color(0xe8eef4), CLOUD1 = new THREE.Color(0x9aa89a);
const RAIN0 = new THREE.Color(0x7fb3dd), RAIN1 = new THREE.Color(0xa8b183);
const MARB0 = new THREE.Color(0xe9e5da), MARB1 = new THREE.Color(0x8f867a);
const GRN0 = new THREE.Color(0x3e7d3a), GRN1 = new THREE.Color(0x8a6a3a);
const FISH0 = new THREE.Color(0xe8934a), FISH1 = new THREE.Color(0x51606b);
const tmpC = new THREE.Color();
function updateVisuals(dt, dts) {
  const cK = clamp(C / MAXC, 0, 1);
  M.cloud.color.lerpColors(CLOUD0, CLOUD1, cK * 0.9);
  M.drop.color.lerpColors(CLOUD0, CLOUD1, cK * 0.7);
  M.rain.color.lerpColors(RAIN0, RAIN1, cK * 0.8);
  for (let i = 0; i < DROPN; i++) {
    const d = dropP[i];
    dummy.position.set(d.x, d.y + Math.sin(tSim * 0.6 + d.ph) * 0.04, d.z);
    dummy.scale.setScalar(0.8 + 0.4 * Math.sin(d.ph * 3));
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    cloudI.setMatrixAt(i, dummy.matrix);
  }
  cloudI.instanceMatrix.needsUpdate = true;
  const fK = clamp((5 - pHl()) / 1.3, 0, 1);
  for (let i = 0; i < FISHN; i++) {
    const f = fishP[i];
    const a = tSim * f.w + f.ph;
    dummy.position.set(LX + Math.cos(a) * f.r, 0.07 - fK * 0.03, LZ + Math.sin(a) * f.r * 0.6);
    dummy.rotation.set(0, -a, 0);
    dummy.scale.setScalar(1 - 0.4 * fK);
    dummy.updateMatrix();
    fishI.setMatrixAt(i, dummy.matrix);
    tmpC.lerpColors(FISH0, FISH1, clamp(fK * 1.25 - f.k * 0.25, 0, 1));
    fishI.setColorAt(i, tmpC);
  }
  fishI.instanceMatrix.needsUpdate = true;
  if (fishI.instanceColor) fishI.instanceColor.needsUpdate = true;
  for (let i = 0; i < TREES; i++) {
    const t = treeP[i];
    tmpC.lerpColors(GRN0, GRN1, clamp(Df * 1.35 - t.off, 0, 1));
    canopies.setColorAt(i, tmpC);
  }
  if (canopies.instanceColor) canopies.instanceColor.needsUpdate = true;
  const mK = clamp(etch / 3, 0, 1);
  M.marble.color.lerpColors(MARB0, MARB1, mK);
  bust.scale.setScalar(1 - 0.22 * mK);
  head.scale.setScalar(1 - 0.28 * mK);
  M.gypsum.opacity += ((scrub ? 0.95 : 0) - M.gypsum.opacity) * Math.min(dt * 2.5, 1);
  M.scrub.emissiveIntensity = scrub ? 0.3 : 0.06;
  absorbT1 = Math.max(0, absorbT1 - dts);
  absorbT2 = Math.max(0, absorbT2 - dts);
  lblCloud.o.element.className = 'lbl ' + (pHc() < 5 ? 'r' : 'st');
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    physStep(dts);
    tSim += dts;
    spawnPlume(dts);
  }
  updateVisuals(dt, dts);
  advect(so2P, so2I, true, dts);
  advect(noxP, noxI, false, dts);
  rainStep(dts);
  bubStep(dts);
  formulaAcc += dt;
  if (formulaAcc > 0.25) {                               // 读数 ~4 Hz
    formulaAcc = 0;
    const pc = pHc(), pl = pHl();
    stPH.textContent = pc.toFixed(2);
    stPH.className = 'v ' + (pc < 5 ? 'bad' : 'ok');
    const mult = (HNAT + Math.max(C, 0)) / HNAT;
    stHX.textContent = '×' + (mult >= 100 ? Math.round(mult) : mult.toFixed(1));
    stHX.className = 'v ' + (mult > 10 ? 'bad' : '');
    stEt.textContent = etch.toFixed(2) + ' mm';
    stEt.className = 'v ' + (etch > 0.05 ? 'bad' : '');
    stLK.textContent = pl.toFixed(2);
    stLK.className = 'v ' + (pl < 5 ? 'bad' : 'ok');
    stEM.textContent = (effE() * 24).toFixed(1) + ' kt/a';
    updateFormula();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.element.style.display = on ? '' : 'none';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
for (let i = 0; i < TREES; i++) {
  const t = treeP[i];
  dummy.position.set(t.x, 0.15 * t.s, t.z);
  dummy.rotation.set(0, Math.random() * 6, 0);
  dummy.scale.setScalar(t.s);
  dummy.updateMatrix();
  trunks.setMatrixAt(i, dummy.matrix);
  dummy.position.y = 0.63 * t.s;
  dummy.updateMatrix();
  canopies.setMatrixAt(i, dummy.matrix);
  canopies.setColorAt(i, GRN0);
}
trunks.instanceMatrix.needsUpdate = true;
canopies.instanceMatrix.needsUpdate = true;
instantSim(clamp(qsFloat('t', 0), 0, 600));
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
