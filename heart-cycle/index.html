<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心动周期 · 瓣膜与压力的合奏</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 340px; height: 230px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.a { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.v { color: #ffd8a8; border-color: rgba(255,169,77,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } }
  @media (max-width: 900px) { }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="心动周期:压力说了算的四扇门" data-en="The Cardiac Cycle: four valves ruled by pressure">心动周期:压力说了算的四扇门</h1>
  <div class="sub" data-zh="房压 > 室压 → 房室瓣开;室压 > 主动脉压 → 动脉瓣开——瓣膜从不「决定」开关,压力交叉点才是开关 · 空格播放/暂停" data-en="Atrial > ventricular pressure → AV valve opens; ventricular > aortic → semilunar opens — valves never decide; the pressure crossings do · Space = play/pause">房压 &gt; 室压 → 房室瓣开;室压 &gt; 主动脉压 → 动脉瓣开——瓣膜从不「决定」开关,压力交叉点才是开关 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="plot">
  <h3 data-zh="Wiggers 图:压力曲线与瓣膜时相" data-en="Wiggers: pressures &amp; valve phases">Wiggers 图:压力曲线与瓣膜时相</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.a" data-zh="左心(二尖瓣+主动脉瓣)" data-en="left heart (mitral + aortic)">左心(二尖瓣+主动脉瓣)</span>
    <span class="chip.v" data-zh="血液(单向,绝不倒流)" data-en="blood (one way, never back)">血液(单向,绝不倒流)</span>
  </div>
  <div class="row"><label data-zh="周期进度" data-en="cycle phase">周期进度</label><input id="scrub" type="range" min="0" max="1000" step="5" value="0"><span class="val" id="scrubVal">0%</span></div>
  <div class="row"><label data-zh="心率" data-en="heart rate">心率</label><input id="hr" type="range" min="40" max="150" step="1" value="70"><span class="val" id="hrVal">70 bpm</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../alveoli/" data-zh="上游:肺拿到的血" data-en="upstream: blood from the lungs">上游:肺拿到的血</a>
    <a href="../corrosion/" data-zh="工程对照:单向阀" data-en="engineering cousin: check valves">工程对照:单向阀</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('心动周期', 'The Cardiac Cycle');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.0, 1.6, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const M = {
  atria: mat(0xc0392b, { opacity: 0.55 }),
  vent: mat(0xe03131, { opacity: 0.5 }),
  aorta: mat(0x9aa7b8, { opacity: 0.6 }),
  leaf: mat(0xffe8cc, { opacity: 0.95 }),
  blood: mat(0xff6b6b, { emissiveIntensity: 0.3 }),
  bloodO: mat(0xffa94d, { emissiveIntensity: 0.35 }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.2, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.9;
scene.add(base);

/* ================= 心脏简化模型(左心为主角) ================= */
const heart = new THREE.Group();
scene.add(heart);
/* 左心房(上) / 左心室(下) / 主动脉(右上) */
const atrium = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 18), M.atria);
atrium.position.set(0, 1.55, 0);
heart.add(atrium);
const ventricle = new THREE.Mesh(new THREE.SphereGeometry(0.85, 26, 20), M.vent);
ventricle.position.set(0, 0.15, 0);
heart.add(ventricle);
const aorta = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.17, 12, 40, Math.PI * 0.75), M.aorta);
aorta.position.set(0.15, 1.15, 0);
aorta.rotation.z = 0.6;
heart.add(aorta);
/* 肺静脉 stub */
const pv = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.7, 10), M.aorta);
pv.position.set(-0.85, 1.75, 0);
pv.rotation.z = Math.PI / 2 - 0.5;
heart.add(pv);
/* 瓣膜:二尖瓣(房-室间) + 主动脉瓣(室-动脉间),开合角度动画 */
function mkValve(pos, r) {
  const g = new THREE.Group();
  const l1 = new THREE.Mesh(new THREE.CircleGeometry(r, 16, 0, Math.PI / 2), M.leaf);
  const l2 = new THREE.Mesh(new THREE.CircleGeometry(r, 16, Math.PI / 2, Math.PI / 2), M.leaf);
  l2.position.x = 0;
  g.add(l1, l2);
  g.position.copy(pos);
  heart.add(g);
  return g;
}
const mitral = mkValve(new THREE.Vector3(0, 0.95, 0), 0.3);
mitral.rotation.x = -Math.PI / 2;          // 水平放置
const aorticV = mkValve(new THREE.Vector3(0.62, 1.28, 0), 0.22);
aorticV.rotation.z = -0.6;
aorticV.rotation.x = Math.PI / 2;

/* 血液粒子 */
const bloods = [];
for (let i = 0; i < 20; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), M.blood);
  heart.add(m);
  bloods.push({ mesh: m, t: Math.random(), where: 'pv' });
}

/* ================= Wiggers 压力模型(纯函数) ================= */
function LV(t) {
  /* 左室压:舒张 ~5,收缩峰 120,t:0..1 周期 */
  if (t < 0.12) return lerp(8, 5, t / 0.12);                 // 充盈
  if (t < 0.2) return lerp(5, 8, (t - 0.12) / 0.08);         // 等容收缩
  if (t < 0.45) return lerp(8, 120, Math.pow((t - 0.2) / 0.25, 1.6));  // 射血升
  if (t < 0.55) return lerp(120, 60, (t - 0.45) / 0.1);      // 射血降
  return lerp(60, 5, (t - 0.55) / 0.45);                     // 等容舒张+充盈
}
function AORTA(t) {
  if (t < 0.2) return lerp(82, 80, t / 0.2);
  if (t < 0.45) return lerp(80, 122, Math.pow((t - 0.2) / 0.25, 1.4));
  if (t < 0.62) return lerp(122, 100, (t - 0.45) / 0.17);
  return lerp(100, 82, (t - 0.62) / 0.38);
}
function LA(t) {
  /* 左房压 2-12 mmHg:a 波(收缩前)、v 波(充盈) */
  if (t < 0.08) return lerp(5, 12, t / 0.08);
  if (t < 0.16) return lerp(12, 4, (t - 0.08) / 0.08);
  if (t < 0.55) return lerp(4, 6, (t - 0.16) / 0.39);
  if (t < 0.75) return lerp(6, 16, (t - 0.55) / 0.2);
  return lerp(16, 5, (t - 0.75) / 0.25);
}
const mitralOpen = (t) => LA(t) > LV(t);
const aorticOpen = (t) => LV(t) > AORTA(t);
const ventVol = (t) => {
  /* 容积 120→50 mL */
  if (t < 0.2) return lerp(60, 120, t / 0.2);
  if (t < 0.55) return lerp(120, 50, (t - 0.2) / 0.35);
  return 50 + lerp(0, 70, (t - 0.55) / 0.45) * 0.2 + lerp(0, 70, Math.max(0, (t - 0.62) / 0.38)) * 0.8;
};

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let hr = 70;
let cyc = 0;             // 周期相位 0..1
let tSim = 0;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = heart) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblA = addLabel(() => L('左心房:接肺静脉的富氧血', 'left atrium: receives oxygenated blood'),
  new THREE.Vector3(0, 0.85, 0), 'b', atrium);
const lblV = addLabel(() => L(`左心室:主泵,当前容积 ${ventVol(cyc).toFixed(0)} mL`, 
  `left ventricle: the main pump, ${ventVol(cyc).toFixed(0)} mL now`),
  new THREE.Vector3(0, 1.15, 0), 'o', ventricle);
const lblPhase = addLabel(() => {
  if (aorticOpen(cyc)) return L('射血期:主动脉瓣开,血冲向全身', 'ejection: aortic valve open, blood surges out');
  if (mitralOpen(cyc)) return L('充盈期:二尖瓣开,血从心房落入心室', 'filling: mitral valve open, blood falls into the ventricle');
  return LV(cyc) > 20 ? L('等容收缩:两瓣全关,压力憋到冲开主动脉瓣', 'isovolumic contraction: both shut, pressure builds to crack the aortic valve')
    : L('等容舒张:两瓣全关,压力跌到让二尖瓣弹开', 'isovolumic relaxation: both shut, pressure falls until the mitral pops open');
}, new THREE.Vector3(0, 2.5, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '充盈:房室瓣开', be: 'Filling: AV valve opens',
    d: '心房压略高于松弛的心室 → 二尖瓣被「压」开,血流进心室,容积 60→120 mL。心房只负责最后 20% 的加塞。',
    de: 'Atrial pressure edges above the relaxed ventricle → the mitral valve is pushed open; volume climbs 60→120 mL. The atrium only tops up the last 20%.',
    act: () => { cyc = 0.05; } },
  { b: '等容收缩:憋压', be: 'Isovolumic contraction: building pressure',
    d: '心室开始收缩,室内压瞬间超过房压 → 二尖瓣被「顶」关(第一心音 S1)。此时主动脉压还高,主动脉瓣也关——两扇门全关,容积不变、压力暴涨。',
    de: 'The ventricle contracts, pressure passes atrial → mitral slams shut (S1). Aortic pressure is still higher, so that valve stays shut too — both closed, volume fixed, pressure soaring.',
    act: () => { cyc = 0.18; } },
  { b: '射血:冲开主动脉瓣', be: 'Ejection: the aortic valve cracks open',
    d: '室内压冲过 80 mmHg(舒张压)→ 主动脉瓣被顶开,70 mL 血在 0.15 秒内射出;心室容积 120→50 mL。',
    de: 'Ventricular pressure passes 80 mmHg (diastolic) → the aortic valve blows open and 70 mL leaves in 0.15 s; volume 120→50 mL.',
    act: () => { cyc = 0.35; } },
  { b: '等容舒张:回声 S2', be: 'Isovolumic relaxation: the echo S2',
    d: '心室松弛,室内压跌破主动脉压 → 主动脉瓣「啪」地关上(第二心音 S2),防止血流倒灌;此时二尖瓣还没开——又是两门全关。',
    de: 'The ventricle relaxes, pressure dips below aortic → the aortic valve snaps shut (S2) blocking backflow; the mitral is still closed — both shut again.',
    act: () => { cyc = 0.6; } },
  { b: '瓣膜从不思考', be: 'Valves never think',
    d: '四扇门没有一块肌肉:开与关全由上下游压力差决定。这就是为什么压力曲线的交叉点=瓣膜音=时相边界——Wiggers 图把它们画在一行。',
    de: 'None of the four valves has muscle: pressure differences alone open and close them. That is why pressure crossings = heart sounds = phase borders — one row on the Wiggers diagram.',
    act: () => { cyc = 0.85; } },
];
function stepIndex() {
  if (aorticOpen(cyc)) return 2;
  if (!mitralOpen(cyc)) return LV(cyc) > 20 ? 1 : 3;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 瓣膜动画 ================= */
function applyValves() {
  const mo = mitralOpen(cyc), ao = aorticOpen(cyc);
  /* 开=瓣叶放平(转 80°),关=立起 */
  const moT = mo ? 1.4 : 0.12;
  const aoT = ao ? 1.4 : 0.12;
  mitral.children.forEach(l => { l.rotation.z = lerp(l.rotation.z, mo ? 1.35 : 0.1, 0.4); });
  void moT;
  aorticV.children.forEach(l => { l.rotation.z = lerp(l.rotation.z, ao ? 1.35 : 0.1, 0.4); });
  void aoT;
  mitral.children[0].material.opacity = 0.95;
  /* 心室收缩形变 */
  const contract = clamp((LV(cyc) - 8) / 112, 0, 1);
  ventricle.scale.set(1 + 0.12 * (1 - contract) - 0.1 * contract, 1 - 0.16 * contract, 1 + 0.08 * (1 - contract));
  atrium.scale.setScalar(1 + 0.06 * clamp((LA(cyc) - 5) / 11, 0, 1));
}

/* ================= Wiggers 图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 34, padR = 14;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const xOf = t => pad + (W - pad - padR) * t;
  const yOf = p => pad + (H - pad - pad) * (1 - clamp(p, 0, 130) / 130);
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.lineTo(W - padR, H - pad); ctx.stroke();
  /* 三条压力曲线 */
  const draw = (fn, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 3.5;
    ctx.beginPath();
    for (let i = 0; i <= 140; i++) {
      const t = i / 140;
      i === 0 ? ctx.moveTo(xOf(t), yOf(fn(t))) : ctx.lineTo(xOf(t), yOf(fn(t)));
    }
    ctx.stroke();
  };
  draw(AORTA, '#74c0fc');
  draw(LV, '#ff6b6b');
  draw(LA, '#63e6be');
  /* 瓣膜开合带 */
  ctx.globalAlpha = 0.25;
  for (let i = 0; i <= 140; i++) {
    const t = i / 140;
    if (mitralOpen(t)) { ctx.fillStyle = '#63e6be'; ctx.fillRect(xOf(t), H - pad - 14, (W - pad - padR) / 140 + 1, 10); }
    if (aorticOpen(t)) { ctx.fillStyle = '#74c0fc'; ctx.fillRect(xOf(t), H - pad - 28, (W - pad - padR) / 140 + 1, 10); }
  }
  ctx.globalAlpha = 1;
  /* 当前相位游标 */
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xOf(cyc), pad); ctx.lineTo(xOf(cyc), H - pad); ctx.stroke();
  /* 图例字 */
  ctx.font = '20px system-ui';
  ctx.fillStyle = '#ff6b6b'; ctx.fillText('LV', pad + 6, pad + 24);
  ctx.fillStyle = '#74c0fc'; ctx.fillText('Ao', pad + 46, pad + 24);
  ctx.fillStyle = '#63e6be'; ctx.fillText('LA', pad + 86, pad + 24);
  ctx.fillStyle = cTxt; ctx.font = '17px system-ui';
  ctx.fillText('mmHg', pad - 4, pad - 8);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elScrub.addEventListener('input', () => {
  playing = false;
  setPlayLabel();
  cyc = parseInt(elScrub.value, 10) / 1000;
  elScrubVal.textContent = Math.round(cyc * 100) + '%';
});
document.getElementById('hr').addEventListener('input', e => {
  hr = parseInt(e.target.value);
  document.getElementById('hrVal').textContent = hr + ' bpm';
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 血流粒子 ================= */
function bloodTick(dts) {
  for (const b of bloods) {
    if (mitralOpen(cyc) && b.where !== 'vent') {
      /* 房 → 室 */
      b.t += dts * 0.5;
      b.mesh.position.lerpVectors(new THREE.Vector3(-0.3, 1.55, 0.1), new THREE.Vector3((b.t * 2 - 1) * 0.4, 0.35, 0.1), clamp(b.t, 0, 1));
      if (b.t >= 1) { b.where = 'vent'; b.t = Math.random(); }
    } else if (aorticOpen(cyc) && b.where === 'vent') {
      /* 室 → 主动脉 */
      b.t += dts * 0.7;
      const a = Math.PI * 0.75 * clamp(b.t, 0, 1);
      b.mesh.position.set(0.15 + Math.cos(a - 0.6 + 1.1) * 0.85, 1.15 + Math.sin(a) * 0.6, 0.1);
      if (b.t >= 1) { b.where = 'aorta-out'; b.t = 0; }
    } else if (b.where === 'aorta-out') {
      b.mesh.position.x += dts * 0.8;
      b.mesh.position.y += dts * 0.15;
      if (b.mesh.position.x > 2.6) { b.where = 'pv'; b.mesh.position.set(-0.85, 1.75, 0.1); b.t = 0; }
    } else if (b.where === 'pv') {
      b.mesh.position.lerp(new THREE.Vector3(-0.3, 1.55, 0.1), clamp(dts * 2, 0, 1));
      if (mitralOpen(cyc)) { b.where = 'to-vent'; b.t = 0; }
    } else if (b.where === 'to-vent') {
      b.where = 'vent';
    }
    b.mesh.visible = true;
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let plotTick = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;
  cyc = (cyc + dts * hr / 60) % 1;
  elScrub.value = Math.round(cyc * 1000);
  elScrubVal.textContent = Math.round(cyc * 100) + '%';

  applyValves();
  bloodTick(dts);
  plotTick += dt;
  if (plotTick > 0.12) { plotTick = 0; drawPlot(); }

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
