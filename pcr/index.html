<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聚合酶链式反应 · 指数级分子复印机</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #seq { margin-top: 8px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #seq .sq { display: flex; gap: 8px; align-items: baseline; }
  #seq .sqk { color: var(--text2); font-size: 10.5px; flex: 0 0 58px; text-align: right; }
  #seq .letters { letter-spacing: 4px; font-weight: 700; font-size: 13px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="聚合酶链式反应 · 指数级分子复印机" data-en="PCR · The Exponential Molecular Photocopier">聚合酶链式反应 · 指数级分子复印机</h1>
  <div class="sub" data-zh="94 °C 变性:氢键断开,双链分开(共价骨架无恙)→ 55–65 °C 退火:引物靠 A-T / G-C 碱基互补落位到目标两端 → 72 °C 延伸:Taq 聚合酶从引物 3′ 端逐个添核苷酸 → 每循环模板数翻倍,N=2ⁿ:30 循环 ≈ 10.7 亿倍——从一根针找到一根针 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="94 °C denature: hydrogen bonds melt, strands part (backbones intact) → 55–65 °C anneal: primers dock onto the target ends by A-T / G-C base pairing → 72 °C extend: Taq polymerase adds nucleotides one by one from each primer's 3′ end → templates double every cycle, N = 2ⁿ: 30 cycles ≈ 1.07 billion-fold — finding one needle by building a mountain of needles · 3D interactive demo · drag to orbit · Space = run/pause">聚合酶链式反应 · 指数级分子复印机</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="温度" data-en="Temperature">温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="阶段" data-en="Stage">阶段</span><span class="v" id="stPh">—</span>
  <span class="k" data-zh="循环" data-en="Cycle">循环</span><span class="v" id="stCyc">—</span>
  <span class="k" data-zh="DNA 拷贝数 N=2ⁿ" data-en="Copies N=2ⁿ">DNA 拷贝数 N=2ⁿ</span><span class="v ok" id="stN">—</span>
  <span class="k" data-zh="管内时间" data-en="Tube time">管内时间</span><span class="v" id="stTime">—</span>
  <span class="k" data-zh="每循环耗时" data-en="Per cycle">每循环耗时</span><span class="v warn" id="stDbl">—</span>
</div>

<div id="plot">
  <h3 data-zh="指数律的两副面孔:对数坐标下 N=2ⁿ 是一条直线(每次循环向右走一格,高度翻倍)" data-en="Two faces of the exponential: on a log scale, N=2ⁿ is a perfect straight line — one step right doubles the height">指数律的两副面孔:对数坐标下 N=2ⁿ 是一条直线(每次循环向右走一格,高度翻倍)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="A—T:2 条氢键" data-en="A—T: 2 hydrogen bonds">A—T:2 条氢键</span>
    <span class="chip.g" data-zh="G—C:3 条氢键" data-en="G—C: 3 hydrogen bonds">G—C:3 条氢键</span>
    <span class="chip.o" data-zh="引物:人工合成短链,复制的起点" data-en="primers: short synthetic strands where copying starts">引物:人工合成短链,复制的起点</span>
    <span class="chip.b" data-zh="模板链:被复制的原件" data-en="template strand: the original being copied">模板链:被复制的原件</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnDen" data-zh="94 °C 变性" data-en="94 °C Denature">94 °C 变性</button>
    <button class="abtn" id="btnAnn" data-zh="58 °C 退火" data-en="58 °C Anneal">58 °C 退火</button>
    <button class="abtn" id="btnExt" data-zh="72 °C 延伸" data-en="72 °C Extend">72 °C 延伸</button>
    <button class="abtn on" id="btnLog" data-zh="对数坐标" data-en="Log scale">对数坐标</button>
  </div>
  <div class="row"><label data-zh="目标循环数" data-en="Target cycles">目标循环数</label><input id="sCyc" type="range" min="1" max="40" step="1" value="30"><span class="val" id="sCycVal">30</span></div>
  <div class="row"><label data-zh="模拟速度" data-en="Sim speed">模拟速度</label><input id="sSpd" type="range" min="0.25" max="3" step="0.05" value="1"><span class="val" id="sSpdVal">×1.0</span></div>
  <div id="seq">
    <div class="sq"><span class="sqk" data-zh="模板 3′←" data-en="Template 3′←">模板 3′←</span><span class="letters" id="seqT"></span></div>
    <div class="sq"><span class="sqk" data-zh="引物 5′→" data-en="Primer 5′→">引物 5′→</span><span class="letters" id="seqP"></span></div>
  </div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线图" data-en="Chart">曲线图</span></label>
      <label><input id="tglSeq" type="checkbox" checked> <span data-zh="配对序列" data-en="Pairing">配对序列</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../dna-replication/" data-zh="DNA 复制:细胞里的原版 PCR" data-en="DNA replication: the cell's original PCR">DNA 复制:细胞里的原版 PCR</a>
    <a href="../hydrogen-bond/" data-zh="氢键:变性断的就是它" data-en="hydrogen bonds: what denaturation breaks">氢键:变性断的就是它</a>
    <a href="../crispr-cas9/" data-zh="CRISPR:另一种分子找序列的本事" data-en="CRISPR: another way molecules find sequences">CRISPR:另一种分子找序列的本事</a>
    <a href="../transcription/" data-zh="转录:读 DNA 的另一种开法" data-en="transcription: the other way to read DNA">转录:读 DNA 的另一种开法</a>
    <a href="../protein-folding/" data-zh="蛋白质折叠:Taq 为什么不怕 94 °C" data-en="protein folding: why Taq survives 94 °C">蛋白质折叠:Taq 为什么不怕 94 °C</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
function fmtBig(x) {
  if (x < 1e6) return Math.round(x).toLocaleString('en-US');
  const e = Math.floor(Math.log10(x));
  const m = x / Math.pow(10, e);
  return m.toFixed(2) + '×10' + String(e).split('').map(c => SUP[+c]).join('');
}

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 14, 52);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('聚合酶链式反应 · 指数级分子复印机', 'PCR · The Exponential Molecular Photocopier');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 120);
camera.position.set(1.2, 1.6, 11.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.2, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(6, 8, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff, 0.3);
fill.position.set(-7, 5, -6);
scene.add(fill);

/* ================= 状态 ================= */
const STAGE_T = [94, 58, 72];           /* 变性 / 退火 / 延伸 */
const STAGE_DUR = [3, 2.5, 4];          /* 秒 @ ×1 */
let targetCyc = clamp(Math.round(qsFloat('cyc', 30)), 1, 40);
let speed = clamp(qsFloat('speed', 1), 0.25, 3);
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let labelsOn = true, chartOn = true, seqOn = true, logMode = true;
let stage = 0, stageT = 0, cycDone = 0, Tcur = 25, simT = 0;
let sep = 0, flashT = 0, phaseIdx = 0;

/* 双螺旋参数 */
const HELIX_H = 6, HELIX_R = 0.9, TURNS = 2.4;
function strandPos(t, phase, out) {
  const a = t * TURNS * Math.PI * 2 + phase;
  out.set(Math.cos(a) * HELIX_R, (t - 0.5) * HELIX_H, Math.sin(a) * HELIX_R);
  return out;
}
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

/* 模板链 A(蓝)+ B(橙),各带碱基 */
function buildStrand(phase, mat) {
  const grp = new THREE.Group();
  const pts = [];
  for (let i = 0; i <= 60; i++) pts.push(strandPos(i / 60, phase, new THREE.Vector3()));
  const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 90, 0.09, 10), mat);
  grp.add(tube);
  for (let i = 0; i < RUNGS; i++) {
    const t = (i + 0.5) / RUNGS;
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 10), baseMats[SEQ[i]]);
    strandPos(t, phase, b.position);
    b.position.multiplyScalar(0.5);          /* 碱基在骨架与中轴之间 */
    b.userData.rung = i;
    grp.add(b);
  }
  scene.add(grp);
  return grp;
}
const dnaA = buildStrand(0, backAM);
const dnaB = buildStrand(Math.PI, backBM);

/* 碱基对连杆(氢键,变性时隐去) */
const rods = [];
for (let i = 0; i < RUNGS; i++) {
  const t = (i + 0.5) / RUNGS;
  const a = strandPos(t, 0, new THREE.Vector3()).multiplyScalar(0.5);
  const b = strandPos(t, Math.PI, new THREE.Vector3()).multiplyScalar(0.5);
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1, 6), rodM);
  rod.position.copy(a).lerp(b, 0.5);
  _v3.copy(b).sub(a);
  rod.scale.y = _v3.length();
  rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), _v3.normalize());
  scene.add(rod);
  rods.push(rod);
}

/* 引物:两段短链,退火时飞向模板 A 两端 */
function buildPrimer(rungs, mat) {
  const grp = new THREE.Group();
  const pts = rungs.map(i => {
    const t = (i + 0.5) / RUNGS;
    return strandPos(t, 0, new THREE.Vector3());
  });
  const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 20, 0.1, 10), mat);
  grp.add(tube);
  rungs.forEach(i => {
    const t = (i + 0.5) / RUNGS;
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 10), baseMats[SEQ[i]]);
    strandPos(t, 0, b.position);
    b.position.multiplyScalar(0.5);
    grp.add(b);
  });
  scene.add(grp);
  return grp;
}

{

/* ================= 绘图:N=2ⁿ ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 46, padR = 16, padT = 14, padB = 26;
  const xOf = c => padL + c / targetCyc * (W - padL - padR);
  const yMaxLog = targetCyc * 0.30103;
  const yOfLog = c => (H - padB) - clamp(c * 0.30103 / yMaxLog, 0, 1) * (H - padB - padT);
  const yOfLin = c => (H - padB) - clamp(Math.pow(2, c - targetCyc), 0, 1) * (H - padB - padT);
  const yOf = logMode ? yOfLog : yOfLin;
  ctx.font = '15px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  if (logMode) {
    for (let e = 0; e <= yMaxLog; e += 3.0103) {
      const y = (H - padB) - e / yMaxLog * (H - padB - padT);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillText('10' + String(Math.round(e / 0.30103)).split('').map(ch => SUP[+ch]).join(''), 6, y + 5);
    }
  } else {
    for (const f of [0.25, 0.5, 0.75]) {
      const y = (H - padB) - f * (H - padB - padT);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillText((f * 100).toFixed(0) + '%', 8, y + 5);
    }
  }
  for (let c = 0; c <= targetCyc; c += targetCyc > 20 ? 10 : 5) {
    ctx.beginPath(); ctx.moveTo(xOf(c), padT); ctx.lineTo(xOf(c), H - padB); ctx.stroke();
    ctx.fillText(String(c), xOf(c) - 6, H - 8);
  }
  ctx.fillText(L('循环', 'cycle'), W - padR - 34, H - 26);
  /* 曲线 */
  ctx.strokeStyle = '#4dabf7';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let c = 0; c <= targetCyc; c += 0.25) {
    const x = xOf(c), y = yOf(c);
    c === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* 当前循环标记 */
  const cx = xOf(cycDone), cy = yOf(cycDone);
  ctx.strokeStyle = 'rgba(255,255,255,.4)';
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, H - padB); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#7bd88f';
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 7); ctx.fill();
  ctx.fillStyle = cTxt;
  ctx.fillText(logMode ? L('对数:指数=直线', 'log: exponential = straight line') : L('线性:指数=曲棍球杆', 'linear: exponential = hockey stick'), padL + 8, padT + 14);
  ctx.fillStyle = '#7bd88f';
  ctx.fillText(fmtBig(Math.pow(2, cycDone)), clamp(cx - 30, padL, W - padR - 90), clamp(cy - 12, padT + 16, H - padB));
}

btnAnn.addEventListener('click', () => { setStage(1); syncBtns(); });
btnExt.addEventListener('click', () => { setStage(2); syncBtns(); });
btnLog.addEventListener('click', () => { logMode = !logMode; syncBtns(); drawPlot(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglSeq').addEventListener('change', e => { seqOn = e.target.checked; document.getElementById('seq').style.display = e.target.checked ? '' : 'none'; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
const _M4 = new THREE.Matrix4(), _Q = new THREE.Quaternion(), _S = new THREE.Vector3(), _V = new THREE.Vector3();
const coldC = new THREE.Color(0x4dabf7), hotC = new THREE.Color(0xff5c5c);
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  /* 温度程序 */
  if (playing && cycDone < targetCyc) {
    simT += dt;
    stageT += dt / STAGE_DUR[stage];
    Tcur += clamp(STAGE_T[stage] - Tcur, -dt * 280, dt * 280);
    if (stageT >= 1) {
      stageT = 0; stage++;
      if (stage > 2) {
        stage = 0; cycDone++;
        flashT = 0.6;
        if (cycDone === targetCyc) { notifyT = 3.4; notifyZ = `程序结束:${targetCyc} 循环,${fmtBig(Math.pow(2, targetCyc))} 份拷贝`; notifyE = `program done: ${targetCyc} cycles, ${fmtBig(Math.pow(2, targetCyc))} copies`; }
      }
    }
  }
  /* 分离度 */
  const sepTarget = stage === 0 ? ease(clamp(stageT / 0.75, 0, 1)) : 1;
  sep = lerp(sep, sepTarget, Math.min(1, dt * 5 + dt0 * 1.2));
  const drift = Math.sin(performance.now() / 1700) * 0.12;
  dnaA.position.set(-sep * 2.0, drift * 0.3, 0);
  dnaB.position.set(sep * 2.0, -drift * 0.3, 0);
  dnaA.rotation.y = -sep * 1.1;
  dnaB.rotation.y = sep * 1.1;
  rodM.opacity = 0.5 * (1 - sep);
  /* 引物进/出:停靠目标 = 模板链 A 的当前位姿 */
  const prA = stage === 1 ? ease(clamp(stageT * 2.2, 0, 1)) : stage === 2 ? 1 : 0;
  const prB = stage === 1 ? ease(clamp(stageT * 2.2 - 0.5, 0, 1)) : stage === 2 ? 1 : 0;
  primer1.visible = prA > 0.01;
  primer2.visible = prB > 0.01;
  primer1.position.lerpVectors(OFF1, dnaA.position, prA);
  primer2.position.lerpVectors(OFF2, dnaA.position, prB);
  primer1.rotation.y = dnaA.rotation.y * prA;
  primer2.rotation.y = dnaA.rotation.y * prB;
  /* 新链生长:与模板 A 同位姿,碱基才能对上 */
  newStrand.position.copy(dnaA.position);
  newStrand.rotation.y = dnaA.rotation.y;
  newStrand.count = stage === 2 ? Math.max(1, Math.floor(ease(stageT) * NB)) : 0;
  /* dNTP 池漩涡 */
  const tNow = performance.now() / 1000;
  const swirl = (stage === 2 ? 2.2 : 0.9) * (playing ? 1 : 0);
  for (let i = 0; i < ND; i++) {
    const d = dSeed[i];
    const a = d.a + tNow * 0.35 * d.w * swirl;
    const r = d.r - (stage === 2 ? 0.5 + 0.4 * Math.sin(tNow * 1.7 + d.ph) : 0);
    _M4.compose(_V.set(Math.cos(a) * r, d.y + Math.sin(tNow * 0.7 * d.w + d.ph) * 0.3, Math.sin(a) * r), _Q.identity(), _S.set(1, 1, 1));
    dntp.setMatrixAt(i, _M4);
  }
  dntp.instanceMatrix.needsUpdate = true;
  /* 温度计 */
  const hg = Math.max(5.2 * Tcur / 100, 0.02);
  mercury.scale.y = hg;
  mercury.position.y = -2.75 + hg / 2;
  mercuryM.color.lerpColors(coldC, hotC, clamp(Tcur / 100, 0, 1));
  for (const z of zones) z.ring.material.emissiveIntensity = Math.abs(Tcur - z.T) < 6 ? 2.4 : 0.5;
  /* 完成光环 */
  if (flashT > 0) {
    flashT = Math.max(0, flashT - dt0 * 1.4);
    flashRing.visible = true;
    const u = 1 - flashT / 0.6;
    flashRing.scale.setScalar(0.5 + u * 6);
    flashRing.material.opacity = 0.85 * (1 - u);
  } else flashRing.visible = false;
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); syncBtns(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
buildSeq();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
