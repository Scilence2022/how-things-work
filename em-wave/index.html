<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电磁波 · E⊥B⊥传播,自己喂养自己</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.e { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.b { border-color: rgba(255,169,77,.9); color: #ffd9a3; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.e { border-color: rgba(25,113,194,.9); color: #1971c2; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.o { color: #ffa94d; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.e { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.b { color: #ffd9a3; border-color: rgba(255,169,77,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #spec { margin-top: 8px; }
  #spec .bar { height: 16px; border-radius: 5px; display: flex; overflow: hidden;
    border: 1px solid var(--tool-border); }
  #spec .bar i { flex: 1; display: block; }
  #spec .cap { display: flex; justify-content: space-between; font-size: 10px; color: var(--text2); margin-top: 3px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffd9a3; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="电磁波：E⊥B⊥传播，自己喂养自己" data-en="EM Waves: E⊥B⊥travel, self-sustaining">电磁波：E⊥B⊥传播，自己喂养自己</h1>
  <div class="sub" data-zh="变化的电场生磁场,变化的磁场再生电场——波自己喂养自己,以光速奔跑;光就是电磁波家族的一员 · 空格播放/暂停" data-en="Changing E makes B, changing B remakes E — the wave feeds itself at the speed of light; light is a member of this family · Space = play/pause">变化的电场生磁场,变化的磁场再生电场——波自己喂养自己,以光速奔跑;光就是电磁波家族的一员 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="视觉频率" data-en="visual frequency">视觉频率</span><span class="v o" id="stF">—</span>
  <span class="k" data-zh="波长(视觉)" data-en="wavelength (visual)">波长(视觉)</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="传播速度" data-en="speed">传播速度</span><span class="v o" id="stC">c</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.e" data-zh="E 场(竖直,蓝)" data-en="E field (vertical, blue)">E 场(竖直,蓝)</span>
    <span class="chip.b" data-zh="B 场(水平,橙)" data-en="B field (horizontal, orange)">B 场(水平,橙)</span>
  </div>
  <div class="row"><label data-zh="视觉频率" data-en="frequency">视觉频率</label><input id="fq" type="range" min="20" max="80" step="2" value="44"><span class="val" id="fqVal">—</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglB" type="checkbox" checked> <span data-zh="B 场" data-en="B field">B 场</span></label>
      <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
    </div>
  </div>
  <div id="spec">
    <div class="bar">
      <i style="background:#4263eb"></i><i style="background:#15aabf"></i><i style="background:#12b886"></i>
      <i style="background:#82c91e" id="specVis"></i><i style="background:#fab005"></i><i style="background:#fa5252"></i>
      <i style="background:#be4bdb"></i>
    </div>
    <div class="cap"><span data-zh="无线电" data-en="radio">无线电</span><span data-zh="微波" data-en="micro">微波</span><span data-zh="红外" data-en="IR">红外</span><span data-zh="可见光" data-en="visible">可见光</span><span data-zh="紫外" data-en="UV">紫外</span><span data-zh="X 射线" data-en="X-ray">X 射线</span><span data-zh="γ" data-en="γ">γ</span></div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../polarization/" data-zh="偏振:横波的证据" data-en="polarization: proof of transverse">偏振:横波的证据</a>
    <a href="../induction-motor/" data-zh="感应:法拉第定律的机械版" data-en="induction: Faraday in motion">感应:法拉第定律的机械版</a>
    <a href="../double-slit/" data-zh="干涉:电磁波也会" data-en="interference: EM waves do it too">干涉:电磁波也会</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('电磁波 · E⊥B⊥c', 'EM Waves · E⊥B⊥c');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.4, 2.6, 8.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.6, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  antenna: mat(0x8a93a3, { metalness: 0.6, roughness: 0.35 }),
  eMat: new THREE.MeshBasicMaterial({ color: 0x74c0fc }),
  bMat: new THREE.MeshBasicMaterial({ color: 0xffa94d }),
  eLine: new THREE.LineBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.85 }),
  bLine: new THREE.LineBasicMaterial({ color: 0xffa94d, transparent: true, opacity: 0.85 }),
  chargeP: new THREE.MeshBasicMaterial({ color: 0xff6b6b }),
  chargeN: new THREE.MeshBasicMaterial({ color: 0x4dabf7 }),
};

/* ================= 场景:天线 + 平面波 ================= */
const H = 1.5;
const floor = new THREE.Mesh(new THREE.BoxGeometry(11, 0.16, 4), M.floor);
floor.position.set(2, -0.4, 0);
scene.add(floor);
/* 偶极天线(竖直) */
const antenna = new THREE.Group();
antenna.position.set(-1.6, H, 0);
scene.add(antenna);
const rodA = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 10), M.antenna);
rodA.position.y = 0.4;
antenna.add(rodA);
const rodB = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 10), M.antenna);
rodB.position.y = -0.4;
antenna.add(rodB);
const gapB = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 0.08), M.antenna);
antenna.add(gapB);
/* 天线电荷点 */
const chP = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), M.chargeP);
const chN = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), M.chargeN);
antenna.add(chP); antenna.add(chN);
/* E/B 箭头串 */
const N_ARR = 16;
const X0 = -1.0, X1 = 7.0;
function mkArrow(material) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.05), material);
  shaft.position.y = 0.5;
  g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.2, 10), material);
  tip.position.y = 1.09;
  g.add(tip);
  g.scale.y = 0.001;
  scene.add(g);
  return g;
}
const eArrs = [], bArrs = [];
for (let i = 0; i < N_ARR; i++) {
  const x = X0 + (X1 - X0) * i / (N_ARR - 1);
  const e = mkArrow(M.eMat); e.position.set(x, H, 0);
  const b = mkArrow(M.bMat); b.position.set(x, H, 0); b.rotation.x = Math.PI / 2;
  eArrs.push(e); bArrs.push(b);
}
/* 两条正弦引导线 */
function mkCurve(material) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(120 * 3), 3));
  const l = new THREE.Line(g, material);
  scene.add(l);
  return l;
}
const eCurve = mkCurve(M.eLine);
const bCurve = mkCurve(M.bLine);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let freq = 44;          // 视觉频率
let tSim = 0;
const OMEGA = () => freq / 10;
const KK = () => freq / 28;
const specNames = [L('无线电波:广播', 'radio: broadcasts'), L('微波:Wi-Fi 与加热', 'micro: Wi-Fi & ovens'),
  L('红外:热成像', 'IR: thermal'), L('可见光:眼睛的窗口', 'visible: your window'),
  L('紫外:晒伤元凶', 'UV: sunburn'), L('X 射线:透视骨骼', 'X-ray: sees bones'), L('γ 射线:核级穿透', 'gamma: nuclear punch')];
function specIdx() { return clamp(Math.floor((freq - 20) / 60 * 7), 0, 6); }

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblAnt = addLabel(() => L('偶极天线:电荷上下振荡', 'dipole: charges oscillate'), new THREE.Vector3(-1.6, H + 1.0, 0), 'e');
const lblE = addLabel(() => L('E 场(竖直振荡)', 'E field (vertical)'), new THREE.Vector3(3.2, H + 1.6, 0), 'e');
const lblB = addLabel(() => L('B 场(水平振荡)', 'B field (horizontal)'), new THREE.Vector3(3.2, H - 1.5, 0), 'b', bArrs[0]);
const lblStatus = addLabel(() => `${specNames[specIdx()]}`,
  new THREE.Vector3(2.4, -0.05, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '天线:振荡的电荷', be: 'The antenna: oscillating charges',
    d: '电荷在偶极天线上下来回振荡——「变化的电荷」就是一切电磁波的出生证明。',
    de: 'Charges slosh up and down the dipole — oscillating charge is the birth certificate of every EM wave.',
    act: () => { freq = 44; document.getElementById('fq').value = 44; } },
  { b: '变化的 E 生 B', be: 'Changing E makes B',
    d: '麦克斯韦:空间里变化的电场会感生磁场——天线旁的交变 E 场于是「孵」出了同频的 B 场。',
    de: "Maxwell: a changing electric field induces a magnetic one — the oscillating E hatches a matching B.",
    act: () => { freq = 60; document.getElementById('fq').value = 60; } },
  { b: '变化的 B 再生 E:自己往前跑', be: 'Changing B remakes E: it runs itself',
    d: '新生的 B 又在更远处感生新的 E——两者互相喂养,波便自己往前奔跑,不需要介质,速度=光速。',
    de: 'The newborn B induces fresh E farther out — feeding each other, the wave runs itself at light speed, no medium needed.',
    act: () => { freq = 32; document.getElementById('fq').value = 32; } },
  { b: 'E⊥B⊥传播方向', be: 'E⊥B⊥propagation',
    d: 'E 竖直、B 水平、传播向前——三重垂直。这正是偏振能存在的根源:光真的有「方向偏好」。',
    de: 'E vertical, B horizontal, travel forward — triple perpendicularity. This is why polarization exists at all.',
    act: () => { freq = 52; document.getElementById('fq').value = 52; } },
  { b: '一种波,万种频率', be: 'One wave, all frequencies',
    d: '无线电、Wi-Fi、红外、可见光、X 射线——全是同一种波,只差频率。拖「视觉频率」看谱位移动。',
    de: 'Radio, Wi-Fi, IR, light, X-rays — one family, only frequency differs. Drag the slider to move along the spectrum.',
    act: () => { freq = 70; document.getElementById('fq').value = 70; } },
];
function stepIndex() {
  if (freq > 62) return 4;
  if (freq > 50) return 3;
  if (freq > 38) return 2;
  if (freq > 28) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elFq = document.getElementById('fq');
const elFqVal = document.getElementById('fqVal');
const tglLabels = document.getElementById('tglLabels');
const tglB = document.getElementById('tglB');
const tglRotate = document.getElementById('tglRotate');
const stF = document.getElementById('stF'), stL = document.getElementById('stL');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elFq.addEventListener('input', () => { freq = parseInt(elFq.value, 10); elFqVal.textContent = (freq / 10).toFixed(1) + ' Hz(视觉)'; });
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglB.addEventListener('change', () => { bArrs.forEach(a => a.visible = tglB.checked); bCurve.visible = tglB.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;
  const om = OMEGA(), k = KK();
  const A = 0.55;

  /* 电荷振荡 */
  const chY = 0.28 * Math.sin(tSim * om);
  chP.position.set(0, chY + 0.12, 0);
  chN.position.set(0, -chY - 0.12, 0);

  /* 箭头串:方向与幅值随 x、t */
  const lam = Math.PI * 2 / k;
  eArrs.forEach((a, i) => {
    const x = X0 + (X1 - X0) * i / (N_ARR - 1);
    const e = A * Math.sin(k * x - om * tSim);
    a.scale.y = Math.max(Math.abs(e), 0.001);
    a.rotation.z = e >= 0 ? 0 : Math.PI;
  });
  bArrs.forEach((a, i) => {
    const x = X0 + (X1 - X0) * i / (N_ARR - 1);
    const e = A * Math.sin(k * x - om * tSim);
    a.scale.y = Math.max(Math.abs(e), 0.001);
    a.rotation.x = Math.PI / 2;
    a.rotation.y = e >= 0 ? 0 : Math.PI;
  });
  /* 引导曲线 */
  const pe = eCurve.geometry.attributes.position;
  const pb = bCurve.geometry.attributes.position;
  for (let i = 0; i < 120; i++) {
    const x = X0 + (X1 - X0) * i / 119;
    const e = A * Math.sin(k * x - om * tSim);
    pe.setXYZ(i, x, H + e, 0);
    pb.setXYZ(i, x, H, e);
  }
  pe.needsUpdate = true;
  pb.needsUpdate = true;

  stF.textContent = (freq / 10).toFixed(1) + ' Hz(视觉)';
  stL.textContent = lam.toFixed(2);

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

elFqVal.textContent = (freq / 10).toFixed(1) + ' Hz(视觉)';
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
