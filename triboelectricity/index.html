<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>摩擦起电与静电 · 接触挪走电荷,一粒火花结账</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#845ef7;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#6741d9;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  .lbl.p{border-color:rgba(132,94,247,.9);color:#d0bfff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}:root[data-theme="light"] .lbl.p{color:#6741d9}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(132,94,247,.6);background:rgba(132,94,247,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(103,65,217,.55);background:rgba(103,65,217,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(132,94,247,.10);border-color:rgba(132,94,247,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(103,65,217,.08);border-color:rgba(103,65,217,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#d0bfff}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="摩擦起电与静电" data-en="Triboelectricity & Static Charge">摩擦起电与静电</h1>
  <div class="sub" data-zh="两样东西贴在一起,界面上的电荷就重新分配;再猛地扯开,一对异号电荷当场对峙:电压可以上万伏而电量少得可怜,一粒火花就把账结清 · 拖动旋转 / 空格运行/暂停" data-en="Press two materials together and charge reshuffles at the interface; rip them apart and opposite charges stand facing each other: tens of thousands of volts yet pathetically little charge — one spark settles the account · drag to orbit / Space = run/pause">两样东西贴在一起,界面上的电荷就重新分配;再猛地扯开,一对异号电荷当场对峙:电压可以上万伏而电量少得可怜,一粒火花就把账结清 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="电势差" data-en="Voltage">电势差</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="转移电荷" data-en="Charge moved">转移电荷</span><span class="v" id="stQ">—</span>
  <span class="k" data-zh="火花能量" data-en="Spark energy">火花能量</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="相对湿度" data-en="Humidity">相对湿度</span><span class="v" id="stH">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bRub" data-zh="摩擦!" data-en="Rub!">摩擦!</button>
    <button class="abtn" id="bSep" data-zh="分开对峙" data-en="Separate">分开对峙</button>
    <button class="abtn" id="bSpark" data-zh="放电!" data-en="Spark!">放电!</button>
  </div>
  <div class="row">
    <label data-zh="材料对" data-en="Material pair">材料对</label>
    <input id="sPair" type="range" min="0" max="2" step="1" value="0">
    <span class="val" id="sPairVal">毛皮/橡胶</span>
  </div>
  <div class="row">
    <label data-zh="摩擦次数" data-en="Rub strokes">摩擦次数</label>
    <input id="sRub" type="range" min="1" max="20" step="1" value="8">
    <span class="val" id="sRubVal">8</span>
  </div>
  <div class="row">
    <label data-zh="相对湿度" data-en="Humidity">相对湿度</label>
    <input id="sHum" type="range" min="10" max="90" step="5" value="35">
    <span class="val" id="sHumVal">35 %</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglField" type="checkbox" checked> <span data-zh="电场线" data-en="Field lines">电场线</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../lightning/" data-zh="闪电" data-en="Lightning">闪电</a>
    <a href="../xerography/" data-zh="静电复印" data-en="Xerography">静电复印</a>
    <a href="../capacitor-dielectric/" data-zh="电容器与介电材料" data-en="Capacitors & Dielectrics">电容器与介电材料</a>
    <a href="../faraday-cage/" data-zh="法拉第笼" data-en="The Faraday Cage">法拉第笼</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,48);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-3.4,2.6,7.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 实验台 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const benchM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const bench=new THREE.Mesh(new THREE.BoxGeometry(8,0.9,3.2),benchM);
bench.position.set(0,0.45,0);scene.add(bench);

/* ---- 两块材料(左 A 右 B) ---- */
const pairs=[
 {a:'毛皮',b:'橡胶棒',affA:1,affB:-1,chPer:6},
 {a:'玻璃',b:'丝绸',affA:1,affB:-1,chPer:4},
 {a:'聚酯',b:'铝(接地后不存)',affA:1,affB:0,chPer:8},
];
const PAIRN=['毛皮/橡胶','玻璃/丝绸','聚酯/金属'];
const matA=new THREE.MeshStandardMaterial({color:0xb08968,roughness:0.9});
const matB=new THREE.MeshStandardMaterial({color:0x495057,roughness:0.6,metalness:0.4});
const blockA=new THREE.Mesh(new THREE.BoxGeometry(1.9,1.1,1.3),matA);
blockA.position.set(-1.5,1.45,0);scene.add(blockA);
const blockB=new THREE.Mesh(new THREE.BoxGeometry(1.9,1.1,1.3),matB);
blockB.position.set(1.5,1.45,0);scene.add(blockB);
/* 表面电荷点 */
const NSC=26;
const scPos=[];for(let i=0;i<NSC;i++)scPos.push(Math.random()*2-1);
const chP=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff6b6b,emissiveIntensity:0.5});
const chN=new THREE.MeshStandardMaterial({color:0x4dabf7,emissive:0x4dabf7,emissiveIntensity:0.5});
const chAPos=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),chP,NSC);
const chANeg=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),chN,NSC);
const chBPos=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),chP,NSC);
const chBNeg=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),chN,NSC);
scene.add(chAPos);scene.add(chANeg);scene.add(chBPos);scene.add(chBNeg);
const m4=new THREE.Matrix4();

/* ---- 电场线 ---- */
const NLINES=14;
const lineM=new THREE.LineBasicMaterial({color:0xb197fc,transparent:true,opacity:0.6});
const lines=[];
for(let i=0;i<NLINES;i++){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(16*3),3));
  const l=new THREE.Line(geo,lineM);
  scene.add(l);lines.push(l);
}

/* ---- 火花(放电折线) ---- */
const sparkM=new THREE.LineBasicMaterial({color:0xffe066,transparent:true,opacity:0});
const sparkGeo=new THREE.BufferGeometry();
sparkGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(14*3),3));
const spark=new THREE.Line(sparkGeo,sparkM);
scene.add(spark);

/* ---- 起电序列(右侧小看板) ---- */
const seriesG=new THREE.Group();seriesG.position.set(4.6,2.4,0);seriesG.scale.setScalar(0.85);scene.add(seriesG);
const seriesM=new THREE.MeshStandardMaterial({color:0x232830,roughness:0.7});
const board=new THREE.Mesh(new THREE.BoxGeometry(0.12,3.4,1.9),seriesM);
seriesG.add(board);
const seq=['毛皮 +','玻璃 +','羊毛','丝绸','聚酯 −','橡胶 −','金属(导走)'];
const seqMats=[];
for(let i=0;i<seq.length;i++){
  const y=1.35-i*0.45;
  const m=new THREE.MeshStandardMaterial({color:0x868e96});
  const chip=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.3,1.4),m);
  chip.position.set(0.08,y,0);seriesG.add(chip);
  seqMats.push(m);
}
let hiPair=[0,4];
function highlightSeries(){
  seqMats.forEach((m,i)=>{
    m.color.setHex(hiPair.includes(i)?0xffa94d:0x868e96);
  });
}
highlightSeries();

/* ---- 状态 ---- */
let pairI=0,strokes=8,hum=35,playing=true,labelsOn=true,slowMo=false,fieldOn=true;
let state='touch';/* touch | apart | sparked */
let sepK=0;/* 0 贴合 → 1 分开 */
let chargeQ=0,volt=0,simT=0,rubAnim=0,sparkT=99;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function dampFactor(){return clamp(1-(hum-10)/80,0.1,1);}
function calcCharge(){return pairs[pairI].chPer*strokes*dampFactor();}/* 纳库 */
function calcVolt(){/* V ≈ Q/C,间隙拉大 C 变小 */
  const gap=0.05+3.0*sepK;
  const C=0.5e-12*(0.06/gap);/* 玩具模型 */
  return chargeQ*1e-9/C;}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`接触界面:电子从 ${pairs[pairI].a} 挪向 ${pairs[pairI].b}`,
    `Contact: electrons shift from ${pairs[pairI].a} to ${pairs[pairI].b}`),
  new THREE.Vector3(0,3.3,0),'y',()=>state==='touch'||sepK<0.2);
addLabel(()=>L(`A 带正电 +${chargeQ.toFixed(0)} nC`,`A sits positive +${chargeQ.toFixed(0)} nC`),
  new THREE.Vector3(-2.9,2.6,0),'r',()=>sepK>0.3&&chargeQ>0);
addLabel(()=>L(`B 带负电 −${chargeQ.toFixed(0)} nC`,`B sits negative −${chargeQ.toFixed(0)} nC`),
  new THREE.Vector3(2.9,2.6,0),'b',()=>sepK>0.3&&chargeQ>0);
addLabel(()=>L(`电压 ${volt.toFixed(1)} kV:空气快撑不住了`,`Voltage ${volt.toFixed(1)} kV: air is about to give up`),
  new THREE.Vector3(0,4.2,0),'p',()=>volt>4&&state!=='sparked');
addLabel(()=>L('水膜把电荷悄悄导走:湿度是静电的天敌','A water film bleeds the charge away: humidity is static\u0027s enemy'),
  new THREE.Vector3(-3.2,0.6,0),'g',()=>hum>60);

/* ---- 控件 ---- */
function setPair(v){pairI=clamp(v|0,0,2);
  document.getElementById('sPair').value=pairI;
  document.getElementById('sPairVal').textContent=PAIRN[pairI];
  hiPair=pairI===0?[0,5]:pairI===1?[1,3]:[4,6];
  highlightSeries();
  reset();updateStats();}
function setStrokes(v){strokes=clamp(v|0,1,20);
  document.getElementById('sRub').value=strokes;
  document.getElementById('sRubVal').textContent=strokes;updateStats();}
function setHum(v){hum=clamp(v,10,90);
  document.getElementById('sHum').value=hum;
  document.getElementById('sHumVal').textContent=hum.toFixed(0)+' %';updateStats();}
function reset(){state='touch';sepK=0;chargeQ=0;volt=0;sparkT=99;
  sparkM.opacity=0;updateStats();}
function doRub(){state='touch';rubAnim=2.2;chargeQ=calcCharge();sepK=0;
  sparkM.opacity=0;}
function doSep(){if(chargeQ<=0)doRub();state='apart';}
function doSpark(){
  if(volt<3)return;
  state='sparked';sparkT=0;
  updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'贴合:界面电子易位,双电层悄悄生成',en:'Contact: electrons swap at the interface — a double layer forms',
  act(){reset();doRub();}},
 {zh:'摩擦:接触面积与次数都在攒电荷',en:'Rubbing: area and strokes both bank charge',
  act(){doRub();setStrokes(16);doRub();}},
 {zh:'扯开:异号对峙,电压随间隙飙升',en:'Rip apart: opposite charges face off, voltage soars',
  act(){doRub();doSep();}},
 {zh:'放电:一粒火花把账结清',en:'Discharge: one spark settles the account',
  act(){doRub();setStrokes(20);doRub();doSep();setTimeout(()=>doSpark(),600);}},
 {zh:'起电序列:排位越远,转移越猛',en:'Triboelectric series: farther apart, stronger transfer',
  act(){setPair(1);doRub();}},
 {zh:'湿度:水膜导走电荷,冬天才有静电',en:'Humidity: the water film bleeds it — static is a winter sport',
  act(){setHum(80);doRub();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const vv=document.getElementById('stV');
  vv.innerHTML=(state==='sparked'&&sparkT>0.2?0:volt/1000).toFixed(1)+'<small> kV</small>';
  vv.className='v '+(volt>6?'warn':'');
  document.getElementById('stQ').innerHTML=chargeQ.toFixed(0)+'<small> nC</small>';
  const ev=document.getElementById('stE');
  const E=0.5*chargeQ*1e-9*(state==='sparked'&&sparkT>0.2?0:volt);
  ev.innerHTML=(E*1e6).toFixed(1)+'<small> µJ</small>';
  document.getElementById('stH').innerHTML=hum.toFixed(0)+'<small> %</small>';
}

/* ---- 事件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bRub').addEventListener('click',doRub);
document.getElementById('bSep').addEventListener('click',doSep);
document.getElementById('bSpark').addEventListener('click',doSpark);
document.getElementById('sPair').addEventListener('input',e=>setPair(+e.target.value));
document.getElementById('sRub').addEventListener('input',e=>setStrokes(+e.target.value));
document.getElementById('sHum').addEventListener('input',e=>setHum(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglField').addEventListener('change',e=>{fieldOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 布景刷新 ---- */
function layoutBlocks(dt){
  const targetSep=state==='touch'?0:1;
  sepK+=(targetSep-sepK)*Math.min(1,dt*2.2);
  const gap=0.05+3.0*sepK;
  /* 摩擦动画:贴合时来回搓 */
  let rub=0;
  if(rubAnim>0){rubAnim-=dt;rub=Math.sin(rubAnim*14)*0.35*Math.min(1,rubAnim);}
  blockA.position.set(-1.5-gap/2,1.45+0.0,rub*0.2);
  blockB.position.set(1.5+gap/2,1.45,rub*0.2);
  blockA.rotation.y=rub*0.1;blockB.rotation.y=-rub*0.1;
}
function layoutCharges(){
  const gap=0.05+3.0*sepK;
  const ax0=-1.5-gap/2,bx0=1.5+gap/2;
  const nShow=clamp(Math.round(chargeQ/6*NSC),0,NSC);
  /* A 正(失电子):蓝点隐藏,红点显示 */
  for(let i=0;i<NSC;i++){
    const y=1.0+1.0*scPos[i],z=(i%2?-1:1)*(0.35+0.2*scPos[(i+3)%NSC]);
    const s=1+0.08*Math.sin(simT*5+i);
    m4.makeScale(s,s,s);m4.setPosition(ax0-0.96,y,z);
    chAPos.setMatrixAt(i,m4);
    m4.makeScale(0.001,0.001,0.001);chANeg.setMatrixAt(i,m4);
    m4.makeScale(s,s,s);m4.setPosition(bx0+0.96,y,z);
    chBNeg.setMatrixAt(i,m4);
    m4.makeScale(0.001,0.001,0.001);chBPos.setMatrixAt(i,m4);
  }
  chAPos.count=nShow;chBNeg.count=nShow;
  chAPos.instanceMatrix.needsUpdate=true;chBNeg.instanceMatrix.needsUpdate=true;
  chANeg.instanceMatrix.needsUpdate=true;chBPos.instanceMatrix.needsUpdate=true;
}
function layoutField(){
  const vis=fieldOn&&sepK>0.15&&chargeQ>0&&!(state==='sparked'&&sparkT>0.15);
  lineM.opacity=vis?clamp(0.2+volt/20000,0.15,0.85):0;
  if(!vis)return;
  const gap=0.05+3.0*sepK;
  const x0=-1.5-gap/2+0.98,x1=1.5+gap/2-0.98;
  for(let li=0;li<NLINES;li++){
    const p=lines[li].geometry.attributes.position;
    const y0=0.95+(li/(NLINES-1))*1.1-0.55;
    for(let k=0;k<16;k++){
      const t=k/15;
      /* 弧形电场线:中间直线,上下弯曲 */
      const bow=Math.sin(t*Math.PI)*0.9*((li/(NLINES-1))-0.5)*2;
      p.setXYZ(k,x0+(x1-x0)*t,1.45+y0*0.9+bow,0.25*Math.sin(li*2.1));
    }
    p.needsUpdate=true;
  }
}
function layoutSpark(dt){
  sparkT+=dt;
  if(state==='sparked'&&sparkT<0.35){
    sparkM.opacity=1-sparkT/0.35;
    const gap=0.05+3.0*sepK;
    const x0=-1.5-gap/2+1.0,x1=1.5+gap/2-1.0;
    const p=sparkGeo.attributes.position;
    for(let k=0;k<14;k++){
      const t=k/13;
      const jag=k===0||k===13?0:(Math.random()-0.5)*0.5;
      p.setXYZ(k,x0+(x1-x0)*t,1.45+jag,0);
    }
    p.needsUpdate=true;
  }else sparkM.opacity=0;
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  volt=calcVolt();
  layoutBlocks(dts>0?dts:dt*0.2);
  layoutCharges();
  layoutField();
  layoutSpark(dt);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
