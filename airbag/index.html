<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全气囊 · 30 毫秒的化学与 60 升氮气</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff8787;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#f0efed; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,135,135,.6); background: rgba(255,135,135,.12); color: var(--text); }
  .abtn.crash { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(201,42,42,.55); background: rgba(201,42,42,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,135,135,.10); border-color: rgba(255,135,135,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="安全气囊:30 毫秒的化学与 60 升氮气" data-en="Airbag: 30 milliseconds of chemistry, 60 liters of nitrogen">安全气囊:30 毫秒的化学与 60 升氮气</h1>
  <div class="sub" data-zh="≥30 g 骤减速 → 10 ms 内判「生死」→ 灼热丝点燃叠氮化钠,2NaN₃→2Na+3N₂ → 60 升氮气 30 ms 灌满气囊 → 排气孔边压边泄吸收动能 → 气囊与安全带是一对 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Deceleration ≥30 g → judged within 10 ms → a hot wire fires sodium azide, 2NaN₃→2Na+3N₂ → 60 L of nitrogen fills the bag in 30 ms → vents bleed the gas as the head sinks in → bag and belt are a pair · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">≥30 g 骤减速 → 10 ms 内判「生死」→ 灼热丝点燃叠氮化钠,2NaN₃→2Na+3N₂ → 60 升氮气 30 ms 灌满气囊 → 排气孔边压边泄吸收动能 → 气囊与安全带是一对 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="时间" data-en="Time">时间</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="减速度" data-en="Decel">减速度</span><span class="v warn" id="stA">—</span>
  <span class="k" data-zh="气囊体积" data-en="Bag volume">气囊体积</span><span class="v ok" id="stV">—</span>
  <span class="k" data-zh="头部载荷" data-en="Head load">头部载荷</span><span class="v" id="stH">—</span>
  <span class="k" data-zh="头部前移" data-en="Head travel">头部前移</span><span class="v" id="stS">—</span>
</div>

<div id="plot">
  <h3 data-zh="减速度(红)· 气囊体积(绿,右值 60 L)· 竖线=当前时刻" data-en="Deceleration (red) · bag volume (green, 60 L full) · vertical line = now">减速度(红)· 气囊体积(绿,右值 60 L)· 竖线=当前时刻</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="氮气粒子 N₂" data-en="N₂ particles">氮气粒子 N₂</span>
    <span class="chip.g" data-zh="气囊" data-en="airbag">气囊</span>
    <span class="chip.r" data-zh="危险载荷 &gt;80 g" data-en="load &gt;80 g">危险载荷 &gt;80 g</span>
  </div>
  <div id="actions">
    <button class="abtn crash" id="btnCrash" data-zh="以 56 km/h 撞墙" data-en="wall at 56 km/h">以 56 km/h 撞墙</button>
    <button class="abtn" id="btnBump" data-zh="过坑 8 g(不点) " data-en="pothole 8 g (no fire)">过坑 8 g(不点)</button>
    <button class="abtn on" id="btnBelt" data-zh="系安全带" data-en="belt on">系安全带</button>
    <button class="abtn on" id="btnBag" data-zh="启用气囊" data-en="airbag on">启用气囊</button>
  </div>
  <div class="row"><label data-zh="时间轴" data-en="Timeline">时间轴</label><input id="tm" type="range" min="0" max="150" step="0.2" value="0"><span class="val" id="tmVal">0 ms</span></div>
  <div class="row"><label data-zh="慢放倍率" data-en="Slow-mo">慢放倍率</label><input id="spd" type="range" min="0.02" max="1" step="0.02" value="0.12"><span class="val" id="spdVal">0.12×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../kinetic-theory/" data-zh="气压是撞出来的" data-en="pressure is collisions">气压是撞出来的</a>
    <a href="../oxyhydrogen-combustion/" data-zh="另一种爆:爆鸣气" data-en="another bang: oxyhydrogen">另一种爆:爆鸣气</a>
    <a href="../abs-brakes/" data-zh="撞之前的 ABS" data-en="ABS, before the crash">撞之前的 ABS</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xf0efed : 0x0f1013);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('安全气囊 · 30 毫秒的化学与 60 升氮气', 'Airbag · 30 ms of chemistry, 60 L of nitrogen');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setToggleBtns();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 2.1, 7.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.3, 0.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3.5;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
/* 地面 */
const ground = new THREE.Mesh(new THREE.CylinderGeometry(8, 8.4, 0.12, 48),
  mat(0x23262c, { roughness: 0.95, emissive: 0x000000, opacity: 1 }));
ground.position.y = -0.06;
scene.add(ground);
/* 墙(左):车头以 56 km/h 撞上,20 g 脉冲只让车前进 ~0.9 m */
const wall = new THREE.Group();
wall.position.set(-1.78, 0, 0);
scene.add(wall);
const wallBody = new THREE.Mesh(new THREE.BoxGeometry(0.35, 2.1, 2.4), mat(0x3d434c, { roughness: 0.8, opacity: 1 }));
wallBody.position.y = 1.05;
wall.add(wallBody);
for (let i = 0; i < 5; i++) {
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, 0.42),
    new THREE.MeshBasicMaterial({ color: i % 2 ? 0xf2c14e : 0x24272c }));
  stripe.position.set(-0.21, 0.35 + i * 0.36, -0.8 + (i % 2) * 0.45);
  wall.add(stripe);
  const stripe2 = stripe.clone();
  stripe2.position.z = 0.4 + (i % 2) * 0.45;
  wall.add(stripe2);
}

/* ================= 车架(剖面台架) ================= */
const car = new THREE.Group();
scene.add(car);
const frameMat = mat(0x5b6672, { roughness: 0.5, metalness: 0.3, opacity: 1 });
const floor = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.1, 1.5), frameMat);
floor.position.y = 0.42;
car.add(floor);
for (const [dx, dz] of [[-1.4, 0.6], [-1.4, -0.6], [1.4, 0.6], [1.4, -0.6]]) {
  const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.2, 18), mat(0x1b1d20, { roughness: 0.85, opacity: 1 }));
  wheel.rotation.x = Math.PI / 2;
  wheel.position.set(dx, 0.28, dz);
  car.add(wheel);
}
/* 座椅 */
const seatCush = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.14, 1.0), mat(0x37404c, { opacity: 1 }));
seatCush.position.set(0.75, 0.62, 0);
car.add(seatCush);
const seatBack = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.85, 1.0), mat(0x37404c, { opacity: 1 }));
seatBack.position.set(1.06, 1.05, 0);
seatBack.rotation.z = 0.16;
car.add(seatBack);
/* 转向柱 + 方向盘(车头朝 -x) */
const column = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.75, 10), frameMat);
column.rotation.z = Math.PI / 2 - 0.5;
column.position.set(-0.15, 1.02, 0);
car.add(column);

const V0 = 56 / 3.6;                       // 15.56 m/s

const PULSE_MS = 80;
const BAG_DELAY = 15, BAG_FULL = 45, BAG_HOLD = 85, BAG_EMPTY = 140;
const S_BAG = 0.42, S_WHEEL = 0.55;        // 头到气囊 / 到方向盘圈的距离(米)
const CM_PER_UNIT = 100;                   // 头部前移显示换算(米→厘米)

const G = 9.81;

/* 车体运动:纯 t 函数 */
const carAcc = t => crashMode && t >= crashStart && t < crashStart + PULSE_MS ? -CRASH_DECEL : 0;
function carVel(t) {
  if (!crashMode || t < crashStart) return V0;
  if (t < crashStart + PULSE_MS) return V0 - CRASH_DECEL * (t - crashStart) / 1000;
  return 0;
}
function carX(t) {
  if (!crashMode || t < crashStart) return (t / 1000) * V0;
  const dt = (Math.min(t, crashStart + PULSE_MS) - crashStart) / 1000;
  return crashStart / 1000 * V0 + V0 * dt - CRASH_DECEL * dt * dt / 2;
}
function bagVolAt(relT) {                  // L
  if (!bagOn || !crashMode) return 0;
  if (relT < BAG_DELAY) return 0;
  if (relT < BAG_FULL) return 60 * ease((relT - BAG_DELAY) / (BAG_FULL - BAG_DELAY));
  if (relT < BAG_HOLD) return 60;
  return Math.max(2, 60 - 58 * (relT - BAG_HOLD) / (BAG_EMPTY - BAG_HOLD));

const bagVol = () => bagVolAt(tMs - crashStart);
/* 乘员相对运动:数值积分(0.1 ms 步长),从 0 积到 t。

function simulate(toT) {
  let s = 0, v = 0, load = 0, peak = 0;
  const h = 0.1;                            // ms
  for (let t = 0; t <= toT; t += h) {
    const rel = t - crashStart;
    const aRel = crashMode && rel >= 0 && rel < PULSE_MS ? CRASH_DECEL : 0;
    let aRest = 0;
    const fill = bagVolAt(rel) / 60;
    if (beltOn && s > 0.05) aRest += 30;
    if (fill > 0.12 && s > S_BAG - 0.15 * fill) aRest += (beltOn ? 520 : 850) * fill;
    if (!bagOn && s > S_WHEEL) aRest = 1250;

const plotCv = document.getElementById('plotCv');
let loadCache = null, loadCacheKey = '';
function loadCurve() {
  const key = `${beltOn}|${bagOn}|${crashMode}`;
  if (loadCache && loadCacheKey === key) return loadCache;
  loadCache = [];
  for (let t = 0; t <= 150; t += 1) loadCache.push(simulate(t).load);
  loadCacheKey = key;

}

  if (!crashMode) return t > crashStart && t < crashStart + 25 ? 8 : 0;

function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 14, padB = 18;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const xOf = t => pad + (W - 2 * pad) * clamp(t, 0, 150) / 150;
  const yG = v => pad + (H - pad - padB) * (1 - clamp(v, 0, 130) / 130);
  const yV = v => pad + (H - pad - padB) * (1 - clamp(v, 0, 60) / 60);
  /* 轴 */
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - padB); ctx.lineTo(W - pad, H - padB); ctx.stroke();
  /* 60 g 伤害线 */
  ctx.strokeStyle = 'rgba(255,107,107,.5)'; ctx.setLineDash([8, 7]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, yG(60)); ctx.lineTo(W - pad, yG(60)); ctx.stroke();
  ctx.setLineDash([]);
  /* 气囊体积 */
  ctx.strokeStyle = '#69db7c'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  let started = false;
  for (let t = 0; t <= 150; t += 1) {
    const v = crashMode && bagOn ? (t < crashStart + BAG_DELAY ? 0
      : t - crashStart < BAG_FULL ? 60 * ease((t - crashStart - BAG_DELAY) / (BAG_FULL - BAG_DELAY))
      : t - crashStart < BAG_HOLD ? 60
      : Math.max(2, 60 - 58 * (t - crashStart - BAG_HOLD) / (BAG_EMPTY - BAG_HOLD))) : 0;
    if (!started) { ctx.moveTo(xOf(t), yV(v)); started = true; } else ctx.lineTo(xOf(t), yV(v));
  }
  ctx.stroke();
  /* 头部载荷(缓存曲线) */
  const lc = loadCurve();
  ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let t = 0; t <= 150; t += 1) {
    t === 0 ? ctx.moveTo(xOf(t), yG(lc[t])) : ctx.lineTo(xOf(t), yG(lc[t]));
  }
  ctx.stroke();
  /* 当前时刻 */
  ctx.strokeStyle = cTxt; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(xOf(tMs), pad); ctx.lineTo(xOf(tMs), H - padB); ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '15px system-ui';
  ctx.fillText('60 g', pad + 2, yG(60) - 5);
  ctx.fillText('150 ms', W - pad - 52, H - 4);
}

/* ---------------- N₂ 粒子 ---------------- */
function updateN2(vis) {
  const fill = bagVol() / 60;
  const inflating = crashMode && bagOn && tMs > crashStart + BAG_DELAY && tMs < crashStart + BAG_FULL + 10;
  if (inflating) {
    for (let i = 0; i < N2_N; i++) {
      const s = n2State[i];
      if (s.t < 0 && Math.random() < 0.3) {
        s.t = 0;
        const a = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
        s.dir.set(Math.sin(ph) * Math.cos(a), Math.cos(ph), Math.sin(ph) * Math.sin(a));
      }
      if (s.t >= 0) s.t = Math.min(1, s.t + vis * 2.2);
    }
  }
  for (let i = 0; i < N2_N; i++) {
    const s = n2State[i];
    if (s.t >= 0 && fill > 0.03) {
      const rIn = BAG_R * fill * Math.cbrt(s.sc) * Math.min(1, 0.3 + s.t * 2.5);
      dummy.position.copy(bag.position).addScaledVector(s.dir, rIn);
      dummy.scale.setScalar(0.7);
      if (!inflating && fill < 0.35) {        // 泄气:粒子散逸
        dummy.position.addScaledVector(s.dir, 0.5 * (1 - fill));
        dummy.scale.setScalar(0.5 * fill * 2);
      }
    } else {
      dummy.position.set(0, -10, 0);
      dummy.scale.setScalar(0.001);
    }
    dummy.updateMatrix();
    n2IM.setMatrixAt(i, dummy.matrix);
  }
  n2IM.instanceMatrix.needsUpdate = true;
  n2IM.visible = bagOn && crashMode && fill > 0.02;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 1;
const carX0 = 0.75;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) {
    tMs += dt * 1000 * slowmo;
    if (tMs > 150) { tMs = 150; playing = false; setPlayLabel(); }
    syncTm();
  }
  /* 车体位置与姿态 */
  car.position.x = carX0 - carX(tMs);
  car.rotation.z = crashMode && tMs > crashStart && tMs < crashStart + 25 ? -0.015 * (1 - (tMs - crashStart) / 25) : 0;
  /* 气囊形变 */
  const fill = bagVol() / 60;
  bag.scale.setScalar(Math.max(fill, 0.001));
  bag.material.opacity = fill > 0.02 ? 0.96 : 0.0;
  bag.visible = bagOn && crashMode && fill > 0.005;
  wheelRim.visible = !(bagOn && crashMode && fill > 0.25);
  updateN2(dt);
  /* 乘员前移(随车) */
  const r = simAt(tMs);
  occ.position.x = 0.75 - r.s * M2U;
  torso.rotation.z = -0.12 - clamp(r.s * 0.5, 0, 0.3);
  statsAcc += dt;
  if (statsAcc > 0.1) {
    statsAcc = 0;
    stT.textContent = tMs.toFixed(0) + ' ms';
    const showDecel = decelAt(tMs);
    stA.textContent = showDecel.toFixed(0) + ' g';
    stA.className = 'v ' + (showDecel > 30 ? 'bad' : showDecel > 5 ? 'warn' : '');
    stV.textContent = bagVol().toFixed(0) + ' L';
    stH.textContent = r.load.toFixed(0) + ' g';
    stH.className = 'v ' + (r.load > 80 ? 'bad' : r.load > 55 ? 'warn' : 'ok');
    stS.textContent = (r.s * CM_PER_UNIT).toFixed(1) + ' cm';
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
tMs = clamp(qsFloat('t', 0), 0, 150);
slowmo = clamp(qsFloat('speed', 0.12), 0.02, 1);
beltOn = qsBool('belt', true);
bagOn = qsBool('bag', true);
if (qs.get('mode') === 'bump') crashMode = false;
elSpd.value = slowmo; elSpdVal.textContent = slowmo.toFixed(2) + '×';
setToggleBtns();
applyTheme();
applyLang();
syncAll();
setPlayLabel();
start();
</script>
