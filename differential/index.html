<!DOCTYPE html>

<head>

<title>汽车差速器 —— 转弯时两侧车轮为什么不一样快</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e63946;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(12,16,23,.78);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c21f2c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--cv-text); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.red   { border-color: rgba(230,57,70,.85);  color: #ffb3b9; }
  .lbl.blue  { border-color: rgba(47,111,237,.9);  color: #aecbff; }
  .lbl.amber { border-color: rgba(217,164,65,.9);  color: #ffe2a8; }
  :root[data-theme="light"] .lbl.red   { color: #c21f2c; }
  :root[data-theme="light"] .lbl.blue  { color: #1d4fc2; }
  :root[data-theme="light"] .lbl.amber { color: #8a5c10; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }

  /* ===== 工具条（全站共享模式） ===== */
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 376px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.red   { color: #ff9aa1; border-color: rgba(230,57,70,.7); }
  .chip.blue  { color: #a8c6ff; border-color: rgba(47,111,237,.7); }
  .chip.amber { color: #ffd28a; border-color: rgba(217,164,65,.7); }
  .chip.dim   { color: var(--text2); border-color: var(--tool-border); }
  :root[data-theme="light"] .chip.red   { color: #c21f2c; }
  :root[data-theme="light"] .chip.blue  { color: #1d4fc2; }
  :root[data-theme="light"] .chip.amber { color: #8a5c10; }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(230,57,70,.12); border-color: rgba(230,57,70,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right; }
  .row.wide { grid-column: 1 / 3; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 右上角转速读数面板 */
  #read { position: fixed; top: 58px; right: 18px; z-index: 5; width: 224px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); transition: border-color .3s; }
  #read .rh { font-size: 12px; color: var(--text2); margin-bottom: 8px; letter-spacing: .5px; }
  #read .rr { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text3);
    padding: 3px 0; }
  #read .rr b { margin-left: auto; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13.5px; color: var(--text); font-weight: 600; }
  #read .d { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }
  .dL { background: #e63946; } .dR { background: #2f6fed; }
  .dC { background: #9aa7b6; } .dS { background: #d9a441; }
  #req { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--panel-border);
    font-size: 12px; color: #9fe0b3; font-family: ui-monospace, Menlo, Consolas, monospace; }
  :root[data-theme="light"] #req { color: #1a7f45; }
  #read.hi { border-color: rgba(63,191,127,.6); }
  #read.hi #req { color: #c5ffce; }
  :root[data-theme="light"] #read.hi #req { color: #0e7a3d; }
</style>

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="汽车差速器 —— 转弯时两侧车轮为什么不一样快？" data-en="Car Differential — Why the Two Wheels Turn at Different Speeds">汽车差速器 —— 转弯时两侧车轮为什么不一样快？</h1>
  <div class="sub" data-zh="3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 行星锥齿轮的自转吸收左右轮转速差：n左 + n右 = 2n壳" data-en="Interactive 3D · drag to orbit / scroll to zoom · spider-gear spin absorbs the left/right wheel-speed difference: nL + nR = 2·nC">3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 行星锥齿轮的自转吸收左右轮转速差：n左 + n右 = 2n壳</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <div class="rh" data-zh="转速读数（r/min）" data-en="Shaft speeds (r/min)">转速读数（r/min）</div>

<div id="panel">

    <span class="chip red" data-zh="左半轴 · 左轮" data-en="Left axle · wheel">左半轴 · 左轮</span>
    <span class="chip blue" data-zh="右半轴 · 右轮" data-en="Right axle · wheel">右半轴 · 右轮</span>

    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>

    <label><input id="tglRead" type="checkbox" checked> <span data-zh="转速读数" data-en="Speed readout">转速读数</span></label>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数（调试/分享用） ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : (v !== '0' && v !== 'false'); };

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(PAL.bg);                       // 画布清屏底色
  groundMat.color.set(THEME === 'dark' ? 0x151a22 : 0xdde3ec);      // 地面随主题微调（浅色下深地面不可读）
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('汽车差速器 —— 转弯时两侧车轮为什么不一样快',
                     'Car Differential · Why the Two Wheels Turn at Different Speeds');
  buildSteps();
  setPlayLabel();
  applyLabelLang();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 常量：机构几何与运动学 ----------------
   坐标约定：半轴沿 X（左轮 +X 为车左侧），车头朝 +Z，地面 y=0。
   差速器中心 O = (0, AXLE_Y, 0)，所有锥齿轮节锥顶点共点于 O：
   - 齿圈(主减速从动)锥角 71.57°，主动小锥齿轮 18.43°，两者轴垂直 → 传动比 tan71.57° = 3:1
   - 半轴齿轮 / 行星齿轮均为 45° 锥角 → 行星轮相对自转 = (ω左−ω右)/2
   运动学恒等式：ω左 + ω右 = 2ω壳（由行星轮与两侧半轴齿轮同时纯滚动推出）      */
const CYCLE_SECONDS = 14;            // 一个相位周期（1× 速度）
const RPT = 7;                       // 每周期壳体(齿圈)转 7 圈
const RPM_CAGE = RPT * 60 / CYCLE_SECONDS;   // 30 r/min @1×（读数用）
const GEAR_RATIO = 3;                // 主减速比 N齿圈/N小齿轮 = 30/10
const AXLE_Y = 0.78;                 // 半轴中心高度（= 车轮半径，轮子接地）
const WHEEL_R = 0.78;
const HALF_X = 2.3;                  // 车轮离中心线的横向距离（轮距/2）
const TRACK_W = HALF_X * 2;

const D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const V2 = (x, y) => new THREE.Vector2(x, y);

/* ---------------- 相位讲解（5 步，可点击跳转） ----------------
   steer: 点击该步骤时预设的转向量（+1 左转最急 ... 0 直线 ... -1 右转最急） */
const STEPS = [
  { t0: 0.00, t1: 0.18, n: 1, steer: 0.00, b: '动力传入', be: 'Power enters',
    d: '发动机经传动轴驱动主动锥齿轮，从动大齿圈带着差速器壳体公转，行星轮随之绕半轴公转。',
    de: 'The engine drives the bevel pinion through the propeller shaft; the ring gear spins the differential cage, carrying the spider gears around the axle line.' },
  { t0: 0.18, t1: 0.42, n: 2, steer: 0.00, b: '直线行驶', be: 'Straight ahead',
    d: '左右车轮阻力相同，行星轮不自转，壳体+行星轮+半轴齿轮像一个刚体整体转动，左右转速相等。',
    de: 'With equal resistance on both wheels the spider gears do not spin: cage, spiders and side gears rotate as one rigid body, so both wheels turn at the same speed.' },
  { t0: 0.42, t1: 0.62, n: 3, steer: 0.50, b: '转弯', be: 'Turning',
    d: '外侧车轮走过的弧线更长，必须转得更快；行星轮开始自转，把两侧转速差“吸收”掉。',
    de: 'The outer wheel travels a longer arc and must spin faster; the spider gears start spinning on their own axes, absorbing the speed difference between the two sides.' },
  { t0: 0.62, t1: 0.82, n: 4, steer: 0.35, b: '转速关系', be: 'Speed relation',
    d: '无论怎么转向恒有 n左 + n右 = 2n壳，行星轮自转恰为转速差的一半。拖动“转向”滑块验证。',
    de: 'No matter the steering, nL + nR = 2·nC always holds, and the spider spin is exactly half the difference. Drag the Steer slider to verify.' },
  { t0: 0.82, t1: 1.00, n: 5, steer: 1.00, b: '极端情况 · 单侧悬空', be: 'Extreme case · one wheel airborne',
    d: '右轮悬空、左轮被制动：n左=0，悬空侧以 2 倍壳速空转，发动机动力全部从无阻力一侧流失。',
    de: 'Right wheel airborne, left wheel braked: nL = 0 and the free wheel idles at twice cage speed, so all engine power drains away through the resistance-free side.' },
];
function stepIndex(t) {
  if (t < 0.18) return 0;
  if (t < 0.42) return 1;
  if (t < 0.62) return 2;
  if (t < 0.82) return 3;
  return 4;
}

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();     // 背景由 applyTheme() 按 PAL.bg 设置

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.3, 2.5, 5.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, -0.3);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.6;
controls.maxDistance = 18;
controls.maxPolarAngle = 1.52;
controls.autoRotateSpeed = 0.6;

/* ---------------- 灯光 ---------------- */
scene.add(new THREE.HemisphereLight(0x9db4d6, 0x35322c, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(5, 9, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 8;  key.shadow.camera.bottom = -8;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

/* ---------------- 材质 ---------------- */

function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...(opts.pos ?? [0, 0, 0]));
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.parent) opts.parent.add(m); else scene.add(m);
  m.castShadow = !!opts.cast;
  m.receiveShadow = !!opts.recv;
  if (opts.order) m.renderOrder = opts.order;
  return m;
}

/* ---------------- 锥齿轮生成器（程序化） ----------------
   规范姿态：轴线 = 局部 +Y，锥顶在原点，锥面向 +Y 张开。
   k = tan(节锥角)，齿带在轴向 [y0,y1]（半径 = y·k），N 齿，phaseDeg 为齿相位。
   齿 = 沿锥面斜率的梯形截面沿切向拉伸，逐个绕轴摆放，周节在齿带中径处匹配。 */
function bevelGear({ k, y0, y1, N, phaseDeg = 0, toothH = 0.045, mat = M.steel }) {
  const g = new THREE.Group();
  const r0 = y0 * k, r1 = y1 * k;
  // 毛坯：旋转体锥面（略内收，让齿凸出锥面）
  const pts = [V2(0.03, y0), V2(Math.max(r0 - 0.012, 0.04), y0),
               V2(Math.max(r1 - 0.012, 0.04), y1), V2(0.03, y1)];
  mesh(new THREE.LatheGeometry(pts, 48), mat, { parent: g, cast: true });
  // 齿：梯形截面（轴向 × 径向），沿切向拉伸
  const rMid = 0.5 * (r0 + r1);
  const tangW = 2 * Math.PI * rMid / N * 0.42;
  const sh = new THREE.Shape();
  sh.moveTo(y0, r0 - 0.02); sh.lineTo(y1, r1 - 0.02);
  sh.lineTo(y1, r1 + toothH); sh.lineTo(y0, r0 + toothH);
  sh.closePath();
  const tg = new THREE.ExtrudeGeometry(sh, { depth: tangW, bevelEnabled: false });
  tg.translate(0, 0, -tangW / 2);
  const up = V3(0, 1, 0);
  for (let i = 0; i < N; i++) {
    const a = phaseDeg * D2R + i * 2 * Math.PI / N;
    const d = V3(Math.cos(a), 0, Math.sin(a));        // 径向
    const t = V3(-Math.sin(a), 0, Math.cos(a));       // 切向
    const m4 = new THREE.Matrix4().makeBasis(up, d, t.clone().negate());  // 右手系
    const tooth = new THREE.Mesh(tg, mat);
    tooth.quaternion.setFromRotationMatrix(m4);
    tooth.castShadow = true;
    g.add(tooth);
  }
  return g;
}

function makeWheel(markMat) {                 // 车轮：轮胎 + 轮辋 + 辐条 + 色块记号
  const outer = new THREE.Group();            // 定位（悬空时抬升）
  const spin = new THREE.Group();             // 自转（绕 X）
  outer.add(spin);
  mesh(new THREE.TorusGeometry(0.6, 0.18, 18, 48), M.tire, { parent: spin, rot: [0, Math.PI / 2, 0], cast: true });
  mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.2, 32), M.steel,
    { parent: spin, rot: [0, 0, Math.PI / 2], cast: true });
  for (let i = 0; i < 5; i++) {
    const a = i * 2 * Math.PI / 5;
    mesh(new THREE.BoxGeometry(0.045, 0.66, 0.07), M.dark,
      { parent: spin, pos: [0, 0.3 * Math.cos(a), 0.3 * Math.sin(a)], rot: [a, 0, 0], cast: true });
  }
  mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.3, 16), M.dark,
    { parent: spin, rot: [0, 0, Math.PI / 2], cast: true });
  mesh(new THREE.BoxGeometry(0.05, 0.1, 0.07), markMat,
    { parent: spin, pos: [0, 0.4, 0] });      // 轮辋上的色块：一眼看出转速差
  return { outer, spin };
}

function makeArcLine(mat) {                   // 半径变化时重建（虚线长度不随缩放变形）
  const line = new THREE.Line(new THREE.BufferGeometry(), mat);
  line.userData.r = -1;
  grpArcs.add(line);
  return line;
}
function updateCircle(line, R) {
  if (Math.abs(R - line.userData.r) < 0.01) return;
  line.userData.r = R;
  const old = line.geometry;
  const pts = [];
  const n = 180;
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2;
    pts.push(V3(R * Math.cos(a), 0.012, R * Math.sin(a)));
  }
  line.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  line.computeLineDistances();
  old.dispose();
}

  if (a < 0.12) return L('直线', 'Straight');
  const R = (TRACK_W / 2 / a).toFixed(1);
  return (s > 0 ? L('左转', 'Left') : L('右转', 'Right')) + ' · R=' + R;
}
function setSteer(v, fromScript) {
  sTarget = clamp(v, -1, 1);
  if (fromScript) elSteer.value = Math.round(-sTarget * 100);  // 滑块向左拖 = 左转
}

function buildSteps() {
  elSteps.innerHTML = '';
  for (const s of STEPS) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${s.n}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => {
      cycles = Math.floor(cycles) + s.t0 + 0.003;   // 跳相位（转角增量由帧循环按当前传动比吸收）
      setSteer(s.steer, true);
    });
    elSteps.appendChild(li);
  }
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
buildSteps();

function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
setPlayLabel();
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
elSteer.addEventListener('input', () => { setSteer(-parseInt(elSteer.value, 10) / 100, false); });

tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; for (const o of labelObjs) o.visible = labelsOn; });
tglCase.addEventListener('change', () => { caseShell.visible = tglCase.checked; });
tglTracks.addEventListener('change', () => { tracksOn = tglTracks.checked; });
tglRead.addEventListener('change', () => { elRead.style.display = tglRead.checked ? '' : 'none'; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });

// URL 参数 → 初始开关状态
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
if (!qsBool('case', true)) { tglCase.checked = false; tglCase.dispatchEvent(new Event('change')); }
if (!qsBool('tracks', true)) { tglTracks.checked = false; tglTracks.dispatchEvent(new Event('change')); }
if (!qsBool('read', true)) { tglRead.checked = false; tglRead.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
// 初始转向：?steer= 优先，否则用当前相位所属步骤的预设
{
  const si0 = stepIndex(cycles - Math.floor(cycles));
  const v = qs.get('steer') === null ? STEPS[si0].steer : clamp(qsFloat('steer', 0), -1, 1);
  setSteer(v, true);
  sDisp = sTarget;
  elSteps.children[si0].classList.add('on');
}
if (qs.get('top') === '1') {   // 调试机位：俯瞰行星轮啮合
  camera.position.set(0.9, 6.4, 1.0);
  controls.target.set(0, 0.7, 0);
}

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 每帧更新 ---------------- */
function updateWorld(t, cyc, dt) {
  const si = stepIndex(t);

  /* 转向量与悬空抬升的平滑过渡 */
  sDisp += (sTarget - sDisp) * (1 - Math.exp(-dt * 3.2));
  liftK += ((si === 4 ? 1 : 0) - liftK) * (1 - Math.exp(-dt * 3.0));

  /* 转角积分：把本帧 cycles 的增量按当前传动比分配到各轴。
     恒等式来源：revL 以 (1-s) 积分、revR 以 (1+s) 积分 → revL + revR = 2·revC 恒成立；
     行星轮相对壳体 revS 以 -s 积分 = (revL - revR)/2。 */
  const d = cyc - lastCyc; lastCyc = cyc;
  revC += d * RPT;
  revL += d * RPT * (1 - sDisp);
  revR += d * RPT * (1 + sDisp);
  revS += d * RPT * (-sDisp);

  const thC = revC * 2 * Math.PI;
  const thL = revL * 2 * Math.PI, thR = revR * 2 * Math.PI, thS = revS * 2 * Math.PI;

  cageGroup.rotation.x = thC;                    // 壳体+齿圈+行星轮架 公转
  pinionSpin.rotation.z = thC * GEAR_RATIO;      // 主动小锥齿轮 3×（相位已按啮合校准）
  sideLSpin.rotation.x = thL;                    // 半轴齿轮只自转、不公转
  sideRSpin.rotation.x = thR;
  spiderTopSpin.rotation.y = thS;                // 行星轮自转（相对壳体）
  spiderBotSpin.rotation.y = thS;
  wheelL.spin.rotation.x = thL;                  // 车轮滚动（1:1 半轴）
  wheelR.spin.rotation.x = thR;

  /* 步骤5：右轮悬空（右半轴绕 Z 微抬使外端升起 + 车轮升高，保持连接感） */
  const phi = 0.075 * liftK;
  shaftRGrp.rotation.z = -phi;                 // 右半轴朝 -X 伸出，取负号才使外端抬高
  wheelR.outer.position.y = 2.0 * Math.sin(phi);

  /* 地面轨迹：直线模式 / 弯道模式切换（转向很小近似直线，避免出现超大弧线） */
  const aS = Math.abs(sDisp);
  const arcsOn = aS >= 0.12;
  grpStraight.visible = tracksOn && !arcsOn;
  grpArcs.visible = tracksOn && arcsOn;
  if (tracksOn) {
    if (!arcsOn) {
      // 直线：光点位置 = 轮子累计滚过的距离（纯函数，暂停即停）
      const zL = ((revL * 2 * Math.PI * WHEEL_R) % 12 + 12) % 12 - 6;
      const zR = ((revR * 2 * Math.PI * WHEEL_R) % 12 + 12) % 12 - 6;
      dotSL.position.set(HALF_X, 0.02, zL);
      dotSR.position.set(-HALF_X, 0.02, zR);
    } else {
      // 弯道：转弯中心在转向侧，R = 轮距/2 / |s|；两光点以同一角速度绕中心前进，
      // 半径不同 → 弧线速度不同 —— 这正是内外轮转速差的原因
      const Rc = (TRACK_W / 2) / aS;
      const cx = Math.sign(sDisp) * Rc;
      const RL = Math.abs(cx - HALF_X), RR = Math.abs(cx + HALF_X);
      updateCircle(circleL, RL);
      updateCircle(circleR, RR);
      circleL.position.x = cx; circleR.position.x = cx;
      markCenter.position.set(cx, 0.015, 0);
      labelCenter.position.set(cx, 0.16, 0);
      const th = Math.sign(sDisp) * 2 * Math.PI * revC * WHEEL_R / Rc;
      const uL = Math.sign(HALF_X - cx) || 1, uR = Math.sign(-HALF_X - cx) || -1;
      dotL.position.set(cx + RL * uL * Math.cos(th), 0.02, -RL * uL * Math.sin(th));
      dotR.position.set(cx + RR * uR * Math.cos(th), 0.02, -RR * uR * Math.sin(th));
    }
  }

  /* 步骤指示：动力流箭头 / 发光脉冲 */
  const pulse = 0.5 + 0.5 * Math.sin(cyc * Math.PI * 12);
  matPinion.emissiveIntensity = si === 0 ? 0.22 + 0.5 * pulse : 0.10;
  matRing.emissiveIntensity = si === 0 ? 0.12 + 0.3 * pulse : 0.05;
  matSpider.emissiveIntensity = (si === 2 || si === 4) ? 0.22 + 0.45 * pulse : 0.10;
  matShaftL.emissiveIntensity = si === 1 ? 0.18 + 0.3 * pulse : 0.04;
  matShaftR.emissiveIntensity = si === 4 ? 0.25 + 0.55 * pulse : 0.04;

  grpFlow.visible = si === 0;
  if (grpFlow.visible) {
    for (let i = 0; i < 3; i++) {
      const f = ((revC * 0.85 + i / 3) % 1 + 1) % 1;
      flowCones[i].position.set(0, AXLE_Y + 0.18, -0.95 - f * 1.5);
    }
  }
  grpLeak.visible = si === 4 && liftK > 0.4;
  if (grpLeak.visible) {
    for (let i = 0; i < 3; i++) {
      const f = ((revR * 0.5 + i / 3) % 1 + 1) % 1;
      leakCones[i].position.set(-0.7 - f * 1.5, AXLE_Y + 0.16, 0);
    }
  }

  /* 动态标签可见性（覆盖 toggles 的批量设置） */
  labelCenter.visible = tracksOn && arcsOn && labelsOn;
  labelFlow.visible = si === 4 && liftK > 0.5 && labelsOn;

  /* 转速读数（反映当前传动状态；暂停时机构停但比例关系仍可拖转向验证） */
  const rpm = RPM_CAGE * speed;
  const nL = rpm * (1 - sDisp), nR = rpm * (1 + sDisp);
  elRL.textContent = nL.toFixed(1);
  elRR.textContent = nR.toFixed(1);
  elRC.textContent = rpm.toFixed(1);
  elRS.textContent = (-rpm * sDisp).toFixed(1);
  elReq.textContent = L(`n左 + n右 = ${(nL + nR).toFixed(1)} = 2 × n壳(${rpm.toFixed(1)}) ✓`,
                        `nL + nR = ${(nL + nR).toFixed(1)} = 2 × nC(${rpm.toFixed(1)}) ✓`);
  elRead.classList.toggle('hi', si === 3);

  elSteerVal.textContent = steerText(sDisp);
  return si;
}

/* ---------------- 循环 ---------------- */
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) cycles += dt * speed / CYCLE_SECONDS;
  const cyc = Math.floor(cycles), t = cycles - cyc;

  const si = updateWorld(t, cyc, dt);

  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
    setSteer(STEPS[si].steer, true);   // 播放越过步骤边界时，转向按剧本切换
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
applyTheme();
applyLang();
updateWorld(cycles - Math.floor(cycles), Math.floor(cycles), 1 / 60);
requestAnimationFrame(frame);
</script>
</body>
</html>
