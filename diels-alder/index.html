<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>狄尔斯–阿尔德反应 · 一圈电子闭合成环</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="狄尔斯–阿尔德反应 · 一圈电子闭合成环" data-en="The Diels–Alder Reaction · six electrons, one turn">狄尔斯–阿尔德反应 · 一圈电子闭合成环</h1>
  <div class="sub" data-zh="双烯 HOMO 倒进亲双烯体 LUMO:三个箭头同向转一圈,一步协同闭合成六元环,放热闪光;拉温度滑块跨活化能垒,切 endo/exo 看次级轨道重叠 · 拖动旋转 / 空格运行/暂停" data-en="Diene HOMO pours into the dienophile LUMO: three arrows spin one way and the ring closes in one concerted, exothermic step; raise T across the barrier, switch endo/exo to see secondary overlap · drag to orbit / Space = run/pause">双烯 HOMO 倒进亲双烯体 LUMO:三个箭头同向转一圈,一步协同闭合成六元环,放热闪光;拉温度滑块跨活化能垒,切 endo/exo 看次级轨道重叠 · 拖动旋转 / 空格运行/暂停</div>

    <button class="abtn" id="btnSub" data-zh="底物:丁二烯 ⇄ 环戊二烯" data-en="substrate: butadiene ⇄ cyclopentadiene">底物:丁二烯 ⇄ 环戊二烯</button>

    <label data-zh="温度" data-en="Temperature">温度</label>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- 工具 / 主题 / 语言 / URL 参数 ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---------- 渲染器 / 场景 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(0.5,0.7,7.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,-0.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.2;controls.maxDistance=22;
controls.autoRotateSpeed=0.6;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(4,6,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-6,2,-5);scene.add(fill);

/* ---------- 材质 ---------- */
const mC=new THREE.MeshStandardMaterial({color:0x51667c,roughness:0.35,metalness:0.55});
const mO=new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.35,metalness:0.2,emissive:0xff6b6b,emissiveIntensity:0.15});
const mBond=new THREE.MeshStandardMaterial({color:0x94a3b8,roughness:0.4,metalness:0.35});
/* 新生 σ 键:橙色发光 */
const mNew=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xff922b,emissiveIntensity:0.7,roughness:0.3,transparent:true,opacity:0});
/* π 电子云:半透明黄色环 */
const mPi=()=>new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const mArrow=new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0});
const mFlash=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
const mDash=new THREE.LineDashedMaterial({color:0x74c0fc,dashSize:0.12,gapSize:0.09,transparent:true,opacity:0.9});

/* ---------- 分子几何(骨架式,H 按惯例省略) ----------
   原子编号:0..3 = 双烯 C1..C4;4=C5、5=C6 = 亲双烯体;6 = CH₂ 桥(仅环戊二烯)
   反应物:两个 π 键 + 亲双烯体一个 π 键;产物:六元环,π 保留在 C2=C3
   物理注:Ea≈105 kJ/mol(丁二烯+乙烯),ΔH≈−167 kJ/mol,强放热 */
const R_BD=[[-0.9,-0.55,0],[-0.9,0.55,0],[0.9,0.55,0],[0.9,-0.55,0],[0.45,-1.78,0],[-0.45,-1.78,0]];
const P_BD=[[-0.9,0,0],[-0.45,0.9,0],[0.45,0.9,0],[0.9,0,0],[0.45,-0.9,0],[-0.45,-0.9,0]];
const R_CP=R_BD.concat([[0,-0.62,0.98]]), P_CP=P_BD.concat([[0,0.18,1.28]]);
/* [i,j,双键,是否新生 σ] */
const BONDS=[[0,1,1,0],[1,2,0,0],[2,3,1,0],[4,5,1,0],[0,5,0,1],[3,4,0,1],[0,6,0,0],[3,6,0,0]];
const PIS_R=[[0,1],[2,3],[4,5]], PIS_P=[[1,2]];

const molG=new THREE.Group();scene.add(molG);
const atoms=[];
for(let i=0;i<7;i++){
  const a=new THREE.Mesh(new THREE.SphereGeometry(i===6?0.2:0.24,24,18),mC);
  molG.add(a);atoms.push(a);
}
function mkCyl(m,r){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,10),m);}
const bonds=[];
for(const b of BONDS){
  const parts=[];
  parts.push(mkCyl(b[3]?mNew:mBond,0.055));molG.add(parts[0]);
  if(b[2]){parts.push(mkCyl(b[3]?mNew:mBond,0.055));molG.add(parts[1]);}
  bonds.push({i:b[0],j:b[1],dbl:b[2],isNew:b[3],parts});
}
function mkPi(i,j){
  const t=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.055,8,26),mPi());
  molG.add(t);return {i,j,t};
}
const piR=PIS_R.map(p=>mkPi(p[0],p[1]));
const piP=PIS_P.map(p=>mkPi(p[0],p[1]));
/* 亲双烯体上的吸电子基(-CO₂R):endo/exo 的主角 */
const ewg=[0,1].map(()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.17,18,14),mO);molG.add(e);return e;});
const ewgB=[0,1].map(()=>{const c=mkCyl(mBond,0.04);molG.add(c);return c;});
/* 次级轨道重叠虚线(仅 endo) */
const dashes=[0,1].map(()=>{
  const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  const l=new THREE.Line(g,mDash);l.computeLineDistances();molG.add(l);return l;
});
/* 三个协同弯箭头:同向旋转一圈 */
const arrowsG=new THREE.Group();arrowsG.position.set(0,0.12,0);scene.add(arrowsG);
const arrSubs=[];
for(let k=0;k<3;k++){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.TorusGeometry(1.18,0.045,8,26,0.85),mArrow));
  const tip=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.22,10),mArrow);
  tip.position.set(Math.cos(0.85)*1.18,Math.sin(0.85)*1.18,0);
  tip.rotation.z=0.85;
  g.add(tip);
  g.userData.base=k*Math.PI*2/3;
  arrowsG.add(g);arrSubs.push(g);
}
/* 闭环瞬间的放热闪光 */
const flash=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),mFlash);
flash.position.set(0,0.1,0);scene.add(flash);
let flashT=9;

/* ---------- 标签 ---------- */
const labelReg=[];
function addLabel(fn,pos,cls='',visFn){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,fn,vis:visFn||(()=>true)});return o;
}
addLabel(()=>L('双烯(富电子 HOMO)','Diene (electron-rich HOMO)'),new THREE.Vector3(-0.55,1.5,0),'b');
addLabel(()=>L('亲双烯体(缺电子 LUMO,带 -CO₂R)','Dienophile (electron-poor LUMO, -CO₂R)'),new THREE.Vector3(0.3,-2.75,0),'g');
addLabel(()=>L('吸电子基 -CO₂R','EWG -CO₂R'),new THREE.Vector3(1.15,-1.35,0),'r');
addLabel(()=>L('新 σ 键 ×2','2 new σ bonds'),new THREE.Vector3(1.35,-0.6,0.3),'o',()=>stage>0.62);
addLabel(()=>L('π 键保留在 C2=C3','π kept on C2=C3'),new THREE.Vector3(0,1.32,0),'o',()=>stage>0.62);
const lblStatus=addLabel(()=>{
  if(stage<0.05)return L('s-cis 双烯:先弯成 U 形','s-cis diene: fold into a U first');
  if(stage<0.3)return L('接近:两条 π 链像拉链一样相互旋转贴近','approach: two π chains zip toward each other');
  if(stage<0.5)return L('协同:三个箭头同向旋转,6 电子一次搬完','concerted: three arrows spin one way, 6 e⁻ move at once');
  if(stage<0.62)return L('闭环:六元环状过渡态,一瞬成型','closure: six-membered TS snaps shut');
  return L('完成:两个新 σ 键 + 保留一个 π,放热 ΔH≈−167 kJ/mol','done: 2 new σ + 1 kept π, ΔH≈−167 kJ/mol');
},new THREE.Vector3(0,2.35,0),'o');

/* ---------- 状态 ---------- */
let playing=!(qs.get('pause')==='1');
let speed=clamp(parseFloat(qs.get('speed'))||1,0.2,3);
let stage=0,reverse=false,hold=0,spin=0,prevStage=0;
let T=200,sub='bd',mode='endo',labelsOn=true;
/* 阿伦尼乌斯:以 200 °C 为基准的相对速率 k=exp[-Ea/R·(1/T−1/T₀)],Ea≈105 kJ/mol */
const EaR=105000/8.314;
const rateK=()=>Math.exp(-EaR*(1/(T+273.15)-1/473.15));

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('狄尔斯–阿尔德反应 · 一圈电子闭合成环','Diels–Alder Reaction');
  buildSteps();updateStats();
}

/* ---------- 步骤 ---------- */
const STEPS=[
 {b:'s-cis 双烯:先弯成 U 形',be:'s-cis diene folds into a U',
  d:'直链双烯两端够不着——必须绕 C–C 单键旋转到 s-cis,两个端碳才能同时碰到亲双烯体。',
  de:'The diene rotates about its single bond into s-cis so both termini reach the dienophile at once.',
  act:()=>{stage=0.06;reverse=false;}},
 {b:'电子匹配:HOMO → LUMO',be:'HOMO pours into LUMO',
  d:'给电子双烯的 HOMO 与吸电子亲双烯体的 LUMO 对称性匹配——电子从富的一侧流向缺的一侧。',
  de:'The electron-rich diene HOMO matches the electron-poor dienophile LUMO in symmetry.',
  act:()=>{stage=0.3;reverse=false;}},
 {b:'协同一圈:三箭头同转',be:'Concerted: three arrows, one turn',
  d:'三个弯箭头同向旋转——两个 π 键断、两个新 σ 键立、一个 π 移位,6 个电子一步搬完,没有中间体。',
  de:'Three curved arrows turn the same way: two π bonds break, two σ bonds form, one π shifts — no intermediate.',
  act:()=>{stage=0.44;reverse=false;}},
 {b:'一瞬闭环:放热闪光',be:'The ring snaps shut, exothermic',
  d:'六元环状过渡态一瞬通过:ΔH≈−167 kJ/mol, entropically 不利却焓强补偿——所以往往一加热就跑。',
  de:'The six-membered TS is crossed in one instant; ΔH≈−167 kJ/mol drives it despite the entropy cost.',
  act:()=>{stage=0.8;reverse=false;}},
 {b:'endo 规则:次级轨道重叠',be:'Endo rule: secondary overlap',
  d:'吸电子基朝向新生 π 一侧(endo)时,它的 π* 与双烯 C2=C3 有次级重叠——过渡态更稳,动力学占优;exo 是热力学产物。',
  de:'With the EWG tucked under the new π (endo), its π* secondary-overlaps C2=C3: lower TS, kinetic product.',
  act:()=>{mode='endo';stage=0.5;reverse=false;}},
 {b:'逆 D-A:加热开环',be:'Retro-Diels–Alder: heat to crack',
  d:'反应可逆:环戊二烯二聚体加热裂解成两分子环戊二烯,蒸出来立刻用——工业上就这样提纯。',
  de:'Reversible: dicyclopentadiene cracks on heating; distil it and use cyclopentadiene fresh.',
  act:()=>{stage=1;reverse=true;hold=0;}},
];
let activeStep=0;
function stepIndex(){
  if(reverse)return 5;
  if(mode==='endo'&&stage>0.48&&stage<0.62)return 4;
  if(stage<0.15)return 0;
  if(stage<0.38)return 1;
  if(stage<0.5)return 2;
  return 3;
}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps(true);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(manual){
  const si=manual?activeStep:stepIndex();
  if(!manual)activeStep=si;
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===si));
}

/* ---------- 统计 ---------- */
function updateStats(){
  document.getElementById('stT').innerHTML=T+'<small> °C</small>';
  const k=rateK()*(mode==='exo'?0.55:1);
  const ks=k>=100?k.toFixed(0):k>=1?k.toFixed(2):k.toExponential(1);
  document.getElementById('stK').innerHTML=ks+'<small> ×(200 °C)</small>';
  document.getElementById('stP').innerHTML=Math.round(stage*100)+'<small> %</small>';
  const prod=stage<0.62?'—':(sub==='bd'?L('环己烯','cyclohexene'):L('降冰片烯','norbornene'))
    +(mode==='endo'?L('(endo 内型)',' (endo)'):L('(exo 外型)',' (exo)'));
  document.getElementById('stPr').textContent=prod;
}

/* ---------- 每帧姿态 ---------- */
const v1=new THREE.Vector3(),v2=new THREE.Vector3(),vd=new THREE.Vector3(),vp=new THREE.Vector3(),va=new THREE.Vector3(),vb=new THREE.Vector3();
const UP=new THREE.Vector3(0,1,0);
function posOf(i,out){
  const R=sub==='cp'?R_CP:R_BD,P=sub==='cp'?P_CP:P_BD;
  const k=ss(0.45,0.62,stage);
  if(!R[i]){out.set(0,-50,0);return;}   // 桥原子仅在环戊二烯模式存在
  out.set(R[i][0],R[i][1],R[i][2]);
  if(i===4||i===5){
    out.y+=lerp(-0.8,0,ss(0.05,0.35,stage));
    /* 拉链感:亲双烯体绕环心旋转着贴近 */
    const ang=lerp(0.32,0,ss(0.05,0.35,stage)),c=Math.cos(ang),s=Math.sin(ang);
    const x=out.x*c-out.y*s,y=out.x*s+out.y*c;out.x=x;out.y=y;
  }
  vp.set(P[i][0],P[i][1],P[i][2]);
  out.lerp(vp,k);
}
function seg(mesh,a,b){
  vd.subVectors(b,a);const len=Math.max(vd.length(),0.001);
  mesh.scale.y=len;mesh.position.copy(a).addScaledVector(vd,0.5);
  vd.normalize();
  mesh.quaternion.setFromUnitVectors(UP,vd);
}
function updPi(o,op){
  posOf(o.i,v1);posOf(o.j,v2);
  vd.subVectors(v2,v1).normalize();
  o.t.position.addVectors(v1,v2).multiplyScalar(0.5);
  o.t.quaternion.setFromUnitVectors(vp.set(0,0,1),vd);
  o.t.material.opacity=op;
}
function updatePose(dt){
  /* 原子位置(双烯带微小反向旋转,拉链对咬) */
  const ang=-0.4*lerp(0.32,0,ss(0.05,0.35,stage)),c=Math.cos(ang),s=Math.sin(ang);
  for(let i=0;i<7;i++){
    posOf(i,v2);
    if(i<4){const x=v2.x*c-v2.y*s,y=v2.x*s+v2.y*c;v2.x=x;v2.y=y;}
    atoms[i].position.copy(v2);
  }
  /* 键 */
  for(const b of bonds){
    posOf(b.i,v1);posOf(b.j,v2);
    if(b.dbl){
      vd.subVectors(v2,v1);vp.set(-vd.y,vd.x,0).normalize().multiplyScalar(0.055);
      va.copy(v1).add(vp);vb.copy(v2).add(vp);seg(b.parts[0],va,vb);
      va.copy(v1).sub(vp);vb.copy(v2).sub(vp);seg(b.parts[1],va,vb);
    }else seg(b.parts[0],v1,v2);
  }
  /* 新生 σ 键点亮 */
  mNew.opacity=ss(0.5,0.66,stage)*0.95;
  /* π 云:反应物的散,产物的聚 */
  const fadeR=1-ss(0.45,0.6,stage),fadeP=ss(0.55,0.7,stage);
  for(const o of piR)updPi(o,0.5*fadeR);
  for(const o of piP)updPi(o,0.5*fadeP);
  /* 吸电子基:endo 朝新生 π 一侧(+z),exo 背离 */
  const ze=(mode==='endo'?1:-1)*lerp(1.0,0.55,ss(0.05,0.35,stage));
  posOf(4,v1);posOf(5,v2);
  ewg[0].position.set(v1.x,v1.y,v1.z+ze);ewg[1].position.set(v2.x,v2.y,v2.z+ze);
  seg(ewgB[0],v1,ewg[0].position);seg(ewgB[1],v2,ewg[1].position);
  /* endo 次级轨道重叠虚线:EWG π* ←→ C2=C3 π */
  const ovM=ss(0.2,0.32,stage)*(1-ss(0.5,0.6,stage))*(mode==='endo'?1:0);
  posOf(1,v1);posOf(2,v2);
  vp.addVectors(v1,v2).multiplyScalar(0.5);vp.z=0.42;
  dashes.forEach((dl,k)=>{
    dl.geometry.setFromPoints([ewg[k].position,vp]);
    dl.computeLineDistances();
    dl.visible=ovM>0.02;dl.material.opacity=ovM*0.9;
  });
  /* 三箭头同向旋转 */
  const av=ss(0.3,0.38,stage)*(1-ss(0.5,0.58,stage));
  mArrow.opacity=av;
  if(av>0.01)spin+=dt*4.5;
  for(const g of arrSubs)g.rotation.z=g.userData.base+spin;
  /* 桥(环戊二烯)显隐 */
  const cp=sub==='cp';
  atoms[6].visible=cp;
  bonds[6].parts.forEach(p=>p.visible=cp);bonds[7].parts.forEach(p=>p.visible=cp);
  /* 放热闪光 */
  if(!reverse&&prevStage<0.63&&stage>=0.63)flashT=0;
  prevStage=stage;
  if(flashT<0.7){
    flashT+=dt;
    flash.scale.setScalar(0.3+flashT*4.5);
    mFlash.opacity=Math.max(0,(1-flashT/0.7))*0.85;
  }else mFlash.opacity=0;
}

/* ---------- 交互 ---------- */
document.getElementById('btnEndo').addEventListener('click',e=>{
  mode=mode==='endo'?'exo':'endo';
  e.currentTarget.classList.toggle('on',mode==='exo');
});
document.getElementById('btnSub').addEventListener('click',()=>{
  sub=sub==='bd'?'cp':'bd';stage=0;reverse=false;hold=0;
});
document.getElementById('btnReplay').addEventListener('click',()=>{
  stage=0;reverse=false;hold=0;playing=true;setPlayLabel();
});
document.getElementById('btnRetro').addEventListener('click',()=>{
  stage=1;reverse=true;hold=0;playing=true;setPlayLabel();
});
document.getElementById('sT').addEventListener('input',e=>{
  T=+e.target.value;
  document.getElementById('sTVal').textContent=T+' °C';
});
const elSpd=document.getElementById('sSpd');
elSpd.value=Math.round(speed*100);
elSpd.addEventListener('input',e=>{
  speed=+e.target.value/100;
  document.getElementById('sSpdVal').textContent=speed.toFixed(1)+'×';
});
const elPlay=document.getElementById('play');
function setPlayLabel(){elPlay.textContent=playing?L('暂停','Pause'):L('运行','Run');}
elPlay.addEventListener('click',()=>{playing=!playing;setPlayLabel();});
const tglLabels=document.getElementById('tglLabels');
tglLabels.addEventListener('change',()=>{labelsOn=tglLabels.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{
  LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();
});
document.getElementById('themeBtn').addEventListener('click',()=>{
  THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();
});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();elPlay.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
if(qs.get('labels')==='0'){tglLabels.checked=false;labelsOn=false;}

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    if(!reverse){
      stage+=dt*rateK()*0.11*speed;
      if(stage>=1){stage=1;hold+=dt;if(hold>1.6){reverse=true;hold=0;}}
    }else{
      stage-=dt*0.4*speed;
      if(stage<=0){stage=0;reverse=false;}
    }
  }
  updatePose(dt);
  acc+=dt;if(acc>0.1){acc=0;updateStats();syncSteps();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.fn();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();setPlayLabel();
if(document.hidden)stop();else start();
</script>
</body>
</html>
