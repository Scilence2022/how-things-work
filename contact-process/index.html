<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>接触法制硫酸 · 让放热平衡一段一段烧到底</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#fcc419;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e67700;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe9a8}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="接触法制硫酸 · 让放热平衡一段一段烧到底" data-en="Contact Process · burning an exothermic equilibrium to the end, bed by bed">接触法制硫酸 · 让放热平衡一段一段烧到底</h1>
  <div class="sub" data-zh="2SO₂+O₂⇌2SO₃ 放热：低温平衡才靠右，可低温催化剂又太慢。工程答案权衡两者——V₂O₅ 多段床，每段放热升温后出床冷却再进下一段；一次转化 98%，中间吸走 SO₃ 再转一次（两转两吸），总转化率 99.7%，尾气才达标 · 拖动旋转 / 空格运行/暂停" data-en="2SO₂+O₂⇌2SO₃ is exothermic: only low T pushes equilibrium right, but catalyst crawls there. The engineering answer balances both — multiple V₂O₅ beds, cooling between each; ~98% after pass one, absorb the SO₃ and run again (double contact) for 99.7% total · drag to orbit / Space = run/pause">2SO₂+O₂⇌2SO₃ 放热：低温平衡才靠右，可低温催化剂又太慢。工程答案权衡两者——V₂O₅ 多段床，每段放热升温后出床冷却再进下一段；一次转化 98%，中间吸走 SO₃ 再转一次（两转两吸），总转化率 99.7%，尾气才达标 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(9.5,7.5,15);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 材质 ---- */
const shellM=new THREE.MeshStandardMaterial({color:0x8aa2b8,roughness:0.4,metalness:0.6,transparent:true,opacity:0.38});
const pipeM=new THREE.MeshStandardMaterial({color:0x9aa7b4,roughness:0.35,metalness:0.85});
const baseM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const catM=new THREE.MeshStandardMaterial({color:0xfcc419,emissive:0xe67700,emissiveIntensity:0.55,roughness:0.5});
const hotM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.7,roughness:0.4});
const towerM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4,metalness:0.3,transparent:true,opacity:0.4});
const acidM=new THREE.MeshStandardMaterial({color:0xf4b23e,transparent:true,opacity:0.75,roughness:0.2});
const so2M=new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1864ab,emissiveIntensity:0.5});
const o2M=new THREE.MeshStandardMaterial({color:0xff8787,emissive:0xc92a2a,emissiveIntensity:0.4});
const so3M=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xe67700,emissiveIntensity:0.7});
const mistM=new THREE.MeshStandardMaterial({color:0xffe066,transparent:true,opacity:0.5,emissive:0xe67700,emissiveIntensity:0.4});

/* ---- 厂房布置 ----
   布局（x 向右）：鼓风机 x=-8 → 转化器 x=-3（立式圆筒，4 层催化剂床）→
   中间吸收塔 x=3.2 → 回管进 4 段 → 尾气吸收塔 x=8.5。
   转化器半径 1.7，床面 y=2.2/3.4/4.6/5.8（自下而上），层间换热管。 */
const ground=new THREE.Mesh(new THREE.BoxGeometry(34,0.3,14),baseM);
ground.position.set(0,-0.15,0);scene.add(ground);
/* 转化器（剖开 60° 供观察） */
const CONV_X=-3,BEDS_Y=[2.2,3.4,4.6,5.8];
const convG=new THREE.Group();convG.position.set(CONV_X,0,0);scene.add(convG);
for(let i=0;i<4;i++){
  const bed=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.55,0.3,26,1,false,0,Math.PI*1.72),catM);
  bed.position.y=BEDS_Y[i];convG.add(bed);
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,0.55,26,1,true,0,Math.PI*1.72),shellM);
  ring.material=shellM;ring.position.y=BEDS_Y[i]+0.62;convG.add(ring);
}
const dome=new THREE.Mesh(new THREE.SphereGeometry(1.7,26,14,0,Math.PI*1.72,0,Math.PI/2),shellM);
dome.position.y=6.35;convG.add(dome);
const convBot=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,2.05,26,1,true,0,Math.PI*1.72),shellM);
convBot.position.y=1.17;convG.add(convBot);
/* 催化剂颗粒点缀 */
const grainG=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,6,6),catM,4*60);
{const m=new THREE.Matrix4();let k=0;
 for(let b=0;b<4;b++)for(let i=0;i<60;i++){
   const a=Math.random()*Math.PI*1.7,r=Math.sqrt(Math.random())*1.4;
   m.setPosition(CONV_X+Math.cos(a)*r,BEDS_Y[b]+0.15+Math.random()*0.12,Math.sin(a)*r);
   grainG.setMatrixAt(k++,m);}
 scene.add(grainG);}
/* 吸收塔 ×2 */
function tower(x,label){
  const g=new THREE.Group();g.position.set(x,0,0);scene.add(g);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,5.2,22,1,true),towerM);
  body.position.y=2.6;g.add(body);
  const top=new THREE.Mesh(new THREE.SphereGeometry(1.05,22,10,0,Math.PI*2,0,Math.PI/2),towerM);
  top.position.y=5.2;g.add(top);
  for(let i=0;i<3;i++){
    const tray=new THREE.Mesh(new THREE.CylinderGeometry(0.95,0.95,0.08,20),pipeM);
    tray.position.y=2.4+i*1.0;g.add(tray);
  }
  const pool=new THREE.Mesh(new THREE.CylinderGeometry(0.98,0.98,0.5,20),acidM);
  pool.position.y=0.35;g.add(pool);
  return g;
}
tower(3.2,'inter');tower(8.5,'final');
/* 鼓风机 */
const blower=new THREE.Group();blower.position.set(-8,0.9,0);scene.add(blower);
blower.add(new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,0.9,20),pipeM));
const fan=new THREE.Mesh(new THREE.TorusGeometry(0.6,0.08,8,24),pipeM);
fan.position.y=0.6;fan.rotation.x=Math.PI/2;blower.add(fan);
/* 管道（TubeGeometry 沿路径） */
function pipe(points,r=0.16,mat=pipeM){
  const curve=new THREE.CatmullRomCurve3(points);
  const t=new THREE.Mesh(new THREE.TubeGeometry(curve,48,r,10),mat);
  scene.add(t);return curve;
}
/* 主流程管线（随段数与两转两吸重建） */
let pathCurve=null,secondCurve=null,finalCurve=null,stageMarks=[];
function buildPipes(){
  for(const c of[pathCurve,secondCurve,finalCurve])if(c){for(const m of scene.children)if(m.isMesh&&m.userData.pipe===c){scene.remove(m);}}
  stageMarks.forEach(m=>scene.remove(m));stageMarks=[];
  const bedN=+document.getElementById('sBeds').value;
  const two=document.getElementById('bTwo').classList.contains('on');
  /* 进转化器 */
  pathCurve=pipe([new THREE.Vector3(-8,1.4,0),new THREE.Vector3(-6.4,1.6,0),new THREE.Vector3(CONV_X,0.8,0),new THREE.Vector3(CONV_X,1.0,0)]);
  pathCurve.userData={pipe:1};pathCurve.pipe=1;
  /* 段间：出床→冷却→下床（在筒内，用隐形直线路径表达） */
  const pts=[new THREE.Vector3(CONV_X,1.0,0)];
  for(let b=0;b<bedN;b++)pts.push(new THREE.Vector3(CONV_X,BEDS_Y[b],0));
  innerCurve=new THREE.CatmullRomCurve3(pts);
  /* 出口：末床 → 中间塔 →（两转两吸回 4 段）→ 尾气塔 */
  const lastY=BEDS_Y[bedN-1];
  const outPts=[new THREE.Vector3(CONV_X,lastY,0),new THREE.Vector3(CONV_X+1.4,lastY-0.3,0),
    new THREE.Vector3(1.2,1.2,0),new THREE.Vector3(3.2,1.2,0)];
  outCurve=new THREE.CatmullRomCurve3(outPts);
  if(two){
    const backPts=[new THREE.Vector3(3.2,1.2,0),new THREE.Vector3(0.5,0.6,0),new THREE.Vector3(CONV_X,0.6,0),new THREE.Vector3(CONV_X,BEDS_Y[3],0)];
    backCurve=new THREE.CatmullRomCurve3(backPts);
    const tailPts=[new THREE.Vector3(CONV_X,BEDS_Y[3],0),new THREE.Vector3(CONV_X+1.2,BEDS_Y[3]-0.4,0),new THREE.Vector3(6.4,1.2,0),new THREE.Vector3(8.5,1.2,0)];
    tailCurve=new THREE.CatmullRomCurve3(tailPts);
  }else{
    backCurve=null;
    tailCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(3.2,1.2,0),new THREE.Vector3(6.4,1.2,0),new THREE.Vector3(8.5,1.2,0)]);
  }
}
let innerCurve=null,outCurve=null,backCurve=null,tailCurve=null;

/* ---- 分子 ---- */
const NMOL=26;
const mols=[];
function makeMol(){
  const g=new THREE.Group();
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.14,10,10),so2M);g.add(s);
  g.visible=false;scene.add(g);
  return {g,mesh:s,state:'so2',seg:0,t:Math.random(),speed:0.10+Math.random()*0.05,alive:false};
}
for(let i=0;i<NMOL;i++)mols.push(makeMol());
function spawn(i){
  const m=mols[i];m.alive=true;m.seg=0;m.t=0;m.state='so2';
  m.g.visible=true;
  if(Math.random()<0.68){m.mesh.material=so2M;}
  else{m.mesh.material=o2M;m.state='o2';}
}

/* ---- 状态 ----
   转化率模型（可视化标定，量级取自工业四段转化器典型值）：
   段1 420→590°C 累计 68%；段2 440→495 92%；段3 435→455 96.5%；段4 425→432 98%；
   两转两吸（中间吸收后走段4）：99.7%。进床温度滑杆平移 these 值。 */
let playing=true,labelsOn=true,simT=0;
let TIN=420,bedN=4,twoPass=false;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
function bedTable(){
  const d=(TIN-420)/40;             // 进床温度偏移
  const beds=[
    {tin:TIN,tout:590-d*40,x:0.68+d*0.10},
    {tin:440+d*15,tout:495+d*10,x:0.925+d*0.03},
    {tin:435+d*10,tout:455+d*4,x:0.965+d*0.012},
    {tin:425+d*5,tout:432+d*2,x:0.982+d*0.005}];
  return beds;
}
function convNow(){
  const beds=bedTable();
  if(twoPass)return Math.min(0.9972,beds[3].x+0.0152);
  return beds[bedN-1].x;
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'放热平衡的两难：低温才高转化率，可低温下催化剂慢如蜗牛',en:'The dilemma: low T favors equilibrium but the catalyst crawls there'},
 {zh:'V₂O₅ 催化剂：只改快慢不改终点，450 °C 是速率与平衡的折中',en:'V₂O₅ catalyst: changes rate, not the endpoint — 450 °C is the compromise'},
 {zh:'单段床的死局：反应一放热，床层升温把自己推回逆方向',en:'Single-bed trap: the reaction heats its own bed and pushes itself backward'},
 {zh:'多段床+段间冷却：每段烧掉一部分，冷下来再烧一段',en:'Beds + intercooling: burn a fraction, cool, burn again'},
 {zh:'两转两吸：中间吸走 SO₃，产物离场让平衡再往前挪（勒夏特列）',en:'Double contact: inter-absorb SO₃ — removing product shifts the equilibrium again'},
 {zh:'总转化率 99.7%：尾气 SO₂ 达标，硫酸稳坐化工产量之王',en:'99.7% total: stack SO₂ complies, and sulfuric acid stays the king of chemicals'},
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  activeStep=i;
  if(i===0){setBeds(1);setPass(false);setTemp(420);}
  else if(i===1){setBeds(2);setPass(false);}
  else if(i===2){setBeds(1);setPass(false);}
  else if(i===3){setBeds(4);setPass(false);}
  else if(i===4){setBeds(4);setPass(true);}
  else {setBeds(4);setPass(true);}
  resetFlow();syncSteps();
}

/* ---- 读数 ---- */
function updateStats(){
  const beds=bedTable();
  const seg=twoPass?4:Math.min(bedN,4)-1;
  const b=beds[clamp(seg,0,3)];
  document.getElementById('stBed').textContent=twoPass?L('二转（段4）','pass 2 (bed4)'):(seg+1)+' / '+bedN;
  document.getElementById('stTin').innerHTML=b.tin.toFixed(0)+'<small> °C</small>';
  document.getElementById('stTout').innerHTML=b.tout.toFixed(0)+'<small> °C</small>';
  const x=convNow()*100;
  const elx=document.getElementById('stX');
  elx.innerHTML=x.toFixed(x<99?1:2)+'<small> %</small>';
  elx.className='v'+(x>=99.5?' ok':(x<90?' warn':''));
  const frac=(twoPass?0.9972:beds[bedN-1].x)*100;
  document.getElementById('stFrac').innerHTML=frac.toFixed(frac<99?1:2)+'<small> %</small>';
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('SO₂ + O₂ 鼓入','SO₂ + O₂ blown in'),new THREE.Vector3(-8,2.6,0),'b');
addLabel(()=>L('V₂O₅ 催化剂床 ×'+bedN,'V₂O₅ catalyst beds ×'+bedN),new THREE.Vector3(CONV_X-2.6,4.2,0),'y');
addLabel(()=>L('放热升温：每段出床更烫','Exothermic: each bed leaves hotter'),new THREE.Vector3(CONV_X,6.9,0),'r',()=>tglTempEl.checked);
addLabel(()=>L('中间吸收塔：吸走 SO₃','Inter absorber: strips SO₃'),new THREE.Vector3(3.2,6.0,0),'g',()=>twoPass);
addLabel(()=>L('剩余 SO₂ 回四段再转','Leftover SO₂ returns to bed 4'),new THREE.Vector3(0.2,0.1,0.6),'b',()=>twoPass);
addLabel(()=>L('尾气塔：SO₂<50 ppm 达标','Final absorber: SO₂<50 ppm'),new THREE.Vector3(8.5,6.0,0),'g',()=>activeStep===5);
addLabel(()=>L('段间冷却回到 420 °C','Intercooled back to 420 °C'),new THREE.Vector3(CONV_X+2.3,3.9,0),'b',
  ()=>bedN>1&&tglTempEl.checked);

/* ---- 事件 ---- */
function setTemp(t){TIN=t;document.getElementById('sTemp').value=t;
  document.getElementById('sTempVal').textContent=t.toFixed(0)+' °C';}
function setBeds(n){bedN=n;document.getElementById('sBeds').value=n;
  document.getElementById('sBedsVal').textContent=n+' '+L('段','beds');}
function setPass(v){
  twoPass=v;
  document.getElementById('bOne').classList.toggle('on',!v);
  document.getElementById('bTwo').classList.toggle('on',v);
}
document.getElementById('sTemp').addEventListener('input',e=>{setTemp(+e.target.value);});
document.getElementById('sBeds').addEventListener('input',e=>{setBeds(+e.target.value);buildPipes();resetFlow();});
document.getElementById('bOne').addEventListener('click',()=>{setPass(false);buildPipes();resetFlow();});
document.getElementById('bTwo').addEventListener('click',()=>{setPass(true);buildPipes();resetFlow();});
document.getElementById('btnReset').addEventListener('click',resetFlow);
const tglTempEl=document.getElementById('tglTemp');
tglTempEl.addEventListener('change',e=>{grainG.visible=!0;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglMol').addEventListener('change',e=>{
  for(const m of mols)m.g.visible=e.target.checked&&m.alive;
});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  baseM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 分子推进 ---- */
function molAdvance(m,dt){
  const speed=m.speed*1.6;
  if(m.seg===0){ /* 进气管 */
    m.t+=dt*speed*0.7;
    if(m.t>=1){m.seg=1;m.t=0;}
    else{m.g.position.copy(pathCurve.getPoint(m.t));return;}
  }
  if(m.seg===1){ /* 段间上行：途经床层变色 */
    m.t+=dt*speed*0.8;
    const beds=bedTable();
    const frac=twoPass?beds[3].x:beds[bedN-1].x;
    if(m.t>=1){m.seg=2;m.t=0;}
    else{
      const p=innerCurve.getPoint(m.t);
      m.g.position.copy(p);
      if(m.state!=='so3'){
        const passX=m.seg===1?(twoPass?frac:frac):frac;
        if(m.t>0.2&&m.mesh.material!==so3M&&Math.random()<dt*6){m.mesh.material=so3M;m.state='so3';}
      }
      return;
    }
  }
  if(m.seg===2){ /* 出段：去中间塔 */
    m.t+=dt*speed*0.7;
    if(m.t>=1){
      if(twoPass&&!m.returned){
        m.returned=true;m.seg=3;m.t=0;
        /* 未转化的 SO₂/O₂ 回四段；SO₃ 已被吸收→消失重生成 */
        if(m.state==='so3'){m.alive=false;m.g.visible=false;}
      }else{m.alive=false;m.g.visible=false;}
      return;
    }
    m.g.position.copy(outCurve.getPoint(m.t));return;
  }
  if(m.seg===3){ /* 回管上四段 */
    m.t+=dt*speed*0.7;
    if(m.t>=1){m.seg=4;m.t=0;return;}
    m.g.position.copy(backCurve.getPoint(m.t));
    if(m.state!=='so3'&&m.t>0.75&&Math.random()<dt*5){m.mesh.material=so3M;m.state='so3';}
    return;
  }
  if(m.seg===4){ /* 二段出→尾气塔 */
    m.t+=dt*speed*0.8;
    if(m.t>=1){m.alive=false;m.g.visible=false;return;}
    m.g.position.copy(tailCurve.getPoint(m.t));return;
  }
}
function resetFlow(){for(let i=0;i<NMOL;i++){mols[i].alive=false;mols[i].g.visible=false;mols[i].returned=false;}}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  fan.rotation.z+=dt*(playing?6:0.5);
  if(playing){
    /* 持续投放分子 */
    const alive=mols.filter(m=>m.alive).length;
    if(alive<NMOL*0.8&&Math.random()<dt*14){
      const idx=mols.findIndex(m=>!m.alive);
      if(idx>=0){spawn(idx);mols[idx].returned=false;}
    }
    for(const m of mols)if(m.alive)molAdvance(m,dt);
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化：招牌画面 = 四段床全流程 + 分子爬塔 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setBeds(4);setTemp(420);setPass(false);
buildPipes();resetFlow();
updateStats();syncPlayBtn();start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
