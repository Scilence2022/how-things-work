<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABS 防抱死刹车 · 抱死滑行 vs 点放钉峰</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#f06595;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c2255c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.e { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.g { border-color: rgba(56,217,169,.9); color: #b8f2df; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 12.5px; padding: 5px 10px; }
  .lbl.ok { border-color: rgba(56,217,169,.9); color: #c0f5e3; font-size: 12.5px; padding: 5px 10px; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.mk { font-size: 11px; padding: 3px 7px; opacity: .85; }
  :root[data-theme="light"] .lbl.e { border-color: rgba(25,113,194,.9); color: #1971c2; }
  :root[data-theme="light"] .lbl.g, :root[data-theme="light"] .lbl.ok { color: #0b7255; }
  :root[data-theme="light"] .lbl.bad { color: #c92a2a; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 340px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #curve { position: fixed; top: 60px; right: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 8px 10px 6px;
    backdrop-filter: blur(6px); }
  #cv { display: block; }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: #ff8787; }
  #stats .v.g { color: #38d9a9; }
  #stats .v.acc { color: var(--acc); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #modeRow, #roadRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px; }
  #roadRow { margin-bottom: 4px; }
  .gbtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 6px 4px; text-align: center; font-size: 12.5px; font-weight: 700;
    transition: border-color .15s, color .15s, background .15s; }
  .gbtn:hover { border-color: var(--acc); }
  .gbtn.on { border-color: var(--acc); color: var(--text); background: rgba(240,101,149,.14); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 62px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(240,101,149,.10); border-color: rgba(240,101,149,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(194,37,92,.08); border-color: rgba(194,37,92,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #fcc2d7; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1100px) { #curve { display: none; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="ABS 防抱死刹车:抱死滑行 vs 点放钉峰" data-en="ABS brakes: locked-wheel skid vs pulsing at the peak">ABS 防抱死刹车:抱死滑行 vs 点放钉峰</h1>
  <div class="sub" data-zh="μ-滑移率曲线的峰在 10–20% 滑移;抱死=100% 滑移,掉进动摩擦低谷还失去转向;ABS 电磁阀每秒点放 ~15 次,把滑移率钉在峰值区 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="The μ-slip curve peaks at 10–20% slip; a locked wheel = 100% slip, drops into the kinetic-friction valley and loses steering; ABS valves pulse ~15×/s to pin slip at the peak · 3D interactive · drag to orbit / scroll to zoom · Space = play/pause">μ-滑移率曲线的峰在 10–20% 滑移;抱死=100% 滑移,掉进动摩擦低谷还失去转向;ABS 电磁阀每秒点放 ~15 次,把滑移率钉在峰值区 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="curve"><canvas id="cv"></canvas></div>

<div id="stats">
  <span class="k" data-zh="ABS 车速" data-en="ABS speed">ABS 车速</span><span class="v g" id="sAv">—</span>
  <span class="k" data-zh="抱死车速" data-en="locked speed">抱死车速</span><span class="v hot" id="sLv">—</span>
  <span class="k" data-zh="ABS 滑移率" data-en="ABS slip">ABS 滑移率</span><span class="v g" id="sAs">—</span>
  <span class="k" data-zh="抱死滑移率" data-en="locked slip">抱死滑移率</span><span class="v hot" id="sLs">—</span>
  <span class="k" data-zh="ABS 距离" data-en="ABS distance">ABS 距离</span><span class="v g" id="sAd">—</span>
  <span class="k" data-zh="抱死距离" data-en="locked distance">抱死距离</span><span class="v hot" id="sLd">—</span>
  <span class="k" data-zh="距离差(抱死−ABS)" data-en="gap (locked − ABS)">距离差(抱死−ABS)</span><span class="v acc" id="sGap">—</span>
</div>

<div id="panel">
  <div id="modeRow">
    <button class="gbtn" id="mbRace" data-zh="实测对比" data-en="Race">实测对比</button>
    <button class="gbtn" id="mbLock" data-zh="单独抱死" data-en="Lock only">单独抱死</button>
    <button class="gbtn" id="mbAbs" data-zh="单独 ABS" data-en="ABS only">单独 ABS</button>
    <button class="gbtn" id="mbRoll" data-zh="纯滚动" data-en="Rolling">纯滚动</button>
  </div>
  <div id="roadRow">
    <button class="gbtn" id="rbDry" data-zh="干沥青" data-en="Dry asphalt">干沥青</button>
    <button class="gbtn" id="rbWet" data-zh="湿沥青" data-en="Wet asphalt">湿沥青</button>
    <button class="gbtn" id="rbSnow" data-zh="压实雪" data-en="Packed snow">压实雪</button>
  </div>
  <div class="row"><label data-zh="初速" data-en="initial speed">初速</label><input id="vRow" type="range" min="40" max="140" step="5" value="100"><span class="val" id="vVal">100 km/h</span></div>
  <div class="row"><label data-zh="方向盘" data-en="steering">方向盘</label><input id="steerRow" type="range" min="-100" max="100" step="5" value="0"><span class="val" id="steerVal">0</span></div>
  <div class="row"><label data-zh="速度" data-en="speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div class="row"><label data-zh="进度" data-en="progress">进度</label><input id="tBar" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="tVal">0.0 s</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox"> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
      <label><input id="tglSmoke" type="checkbox" checked> <span data-zh="烟尘" data-en="smoke">烟尘</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../clutch-gearbox/" data-zh="上游:离合器与变速箱" data-en="upstream: clutch & gearbox">上游:离合器与变速箱</a>
    <a href="../differential/" data-zh="下游:差速器分左右" data-en="downstream: the differential">下游:差速器分左右</a>
    <a href="../universal-joint/" data-zh="下游:万向节过角度" data-en="downstream: the universal joint">下游:万向节过角度</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const bg = THEME === 'light' ? 0xeef1f6 : 0x10141b;
  scene.background = new THREE.Color(bg);
  scene.fog.color.set(bg);
  M.road.color.set(THEME === 'light' ? 0x99a3b0 : 0x272e3a);
  M.edge.color.set(THEME === 'light' ? 0xd8dee7 : 0x4a5563);
  PAL.txt = THEME === 'light' ? '#33414f' : '#c7d2de';
  PAL.txt2 = THEME === 'light' ? '#5b6b7d' : '#9fb0c3';
  PAL.grid = THEME === 'light' ? 'rgba(15,25,40,.12)' : 'rgba(255,255,255,.09)';
}
const PAL = { txt: '#c7d2de', txt2: '#9fb0c3', grid: 'rgba(255,255,255,.09)',
  red: '#ff6b6b', green: '#38d9a9', acc: '#f06595' };

function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('ABS 防抱死刹车', 'ABS anti-lock brakes');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  syncModeBtns();
  syncRoadBtns();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.fog = new THREE.Fog(0x10141b, 45, 165);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 420);
camera.position.set(-26, 11, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-11, 0.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 90;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(6, 12, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-8, 5, -6);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  road: mat(0x272e3a, { roughness: 0.92, metalness: 0.05, emissiveIntensity: 0 }),
  edge: mat(0x4a5563, { roughness: 0.8, emissiveIntensity: 0 }),
  dash: new THREE.MeshBasicMaterial({ color: 0xd9dee6 }),
  tick: new THREE.MeshBasicMaterial({ color: 0xf0c46a }),
  start: new THREE.MeshBasicMaterial({ color: 0xf06595 }),
  bodyG: mat(0x2f9e77, { roughness: 0.4, metalness: 0.3 }),
  bodyR: mat(0xc0392b, { roughness: 0.4, metalness: 0.3 }),
  glass: mat(0x9fb8cc, { roughness: 0.15, metalness: 0.6, opacity: 0.85 }),
  tire: mat(0x22262e, { roughness: 0.85, metalness: 0.1 }),
  rim: mat(0xb7bec9, { metalness: 0.75, roughness: 0.3 }),
  ringR: new THREE.MeshBasicMaterial({ color: 0xff5252, transparent: true, opacity: 0 }),
  ringG: new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0 }),
  skid: new THREE.MeshBasicMaterial({ color: 0x0b0d11, transparent: true, opacity: 0.5, depthWrite: false }),
  smoke: new THREE.MeshBasicMaterial({ color: 0xb9bfc9, transparent: true, opacity: 0.22, depthWrite: false }),
  pole: new THREE.MeshBasicMaterial({ color: 0xcfd4dc }),
};

/* ================= 场景:双车道测试跑道 ================= */
const ROAD_LEN = 320, ROAD_W = 16;
const road = new THREE.Mesh(new THREE.BoxGeometry(ROAD_LEN, 0.1, ROAD_W), M.road);
road.position.set(ROAD_LEN / 2 - 30, -0.05, 0);
scene.add(road);
for (const s of [-1, 1]) {
  const e = new THREE.Mesh(new THREE.BoxGeometry(ROAD_LEN, 0.02, 0.14), M.edge);
  e.position.set(ROAD_LEN / 2 - 30, 0.012, s * (ROAD_W / 2 - 0.5));
  scene.add(e);
}
/* 中线虚线(实例化) */
{
  const n = 64, g = new THREE.BoxGeometry(2.4, 0.02, 0.14);
  const im = new THREE.InstancedMesh(g, M.dash, n);
  const d = new THREE.Object3D();
  for (let i = 0; i < n; i++) { d.position.set(-22 + i * 5.2, 0.012, 0); d.updateMatrix(); im.setMatrixAt(i, d.matrix); }
  scene.add(im);
}
/* 距离刻度线:刹车线 x=0 起,每 10 m 一道 */
{
  const n = 34, g = new THREE.BoxGeometry(0.16, 0.02, ROAD_W - 1);
  const im = new THREE.InstancedMesh(g, M.tick, n);
  const d = new THREE.Object3D();
  for (let i = 0; i < n; i++) { d.position.set(i * 10, 0.013, 0); d.updateMatrix(); im.setMatrixAt(i, d.matrix); }
  im.count = 34;
  scene.add(im);

const WR = 0.32, WHEELBASE = 2.7, TRACK = 0.78;
function makeCar(lane, isAbs) {
  const g = new THREE.Group();
  g.position.set(0, 0, lane);
  scene.add(g);
  const bodyM = isAbs ? M.bodyG : M.bodyR;
  const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.55, 1.7), bodyM);
  body.position.y = 0.68;
  g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.5, 1.5), M.glass);
  cabin.position.set(-0.25, 1.18, 0);
  g.add(cabin);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 1.4),
    new THREE.MeshBasicMaterial({ color: 0xff3b3b, transparent: true, opacity: 0.25 }));
  tail.position.set(-2.12, 0.78, 0);
  g.add(tail);
  /* 4 轮:转向组 → 自旋组 → 轮胎 */
  const wheels = [], steerG = [];
  for (const [wx, wz] of [[WHEELBASE / 2, TRACK], [WHEELBASE / 2, -TRACK], [-WHEELBASE / 2, TRACK], [-WHEELBASE / 2, -TRACK]]) {
    const sg = new THREE.Group();
    sg.position.set(wx, WR, wz);
    const sp = new THREE.Group();
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(WR, WR, 0.24, 22), M.tire);
    tire.rotation.x = Math.PI / 2;
    sp.add(tire);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(WR * 0.55, WR * 0.55, 0.25, 14), M.rim);
    rim.rotation.x = Math.PI / 2;
    sp.add(rim);
    const mark = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.5, 0.26), M.tire);
    sp.add(mark);
    sg.add(sp);
    g.add(sg);
    wheels.push(sp); steerG.push(sg);
  }
  /* 制动压力光环(前轮) */
  const ringM = isAbs ? M.ringG : M.ringR;
  for (const s of [1, -1]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(WR + 0.09, 0.035, 8, 32), ringM);
    ring.position.set(WHEELBASE / 2, WR, s * TRACK);
    g.add(ring);
  }
  /* 拖痕(两道,抱死后随滑行拉长) */
  const skids = [];
  for (const s of [1, -1]) {
    const q = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.24), M.skid);
    q.rotation.x = -Math.PI / 2;
    q.position.set(0, 0.016, lane + s * TRACK);
    q.scale.x = 0.001;
    q.renderOrder = 1;
    scene.add(q);
    skids.push(q);
  }
  /* 车顶标签 */
  const lbl = addLabel(() => carLabel(c), new THREE.Vector3(0, 2.15, 0), isAbs ? 'ok' : 'bad', g);
  const car = { g, wheels, steerG, tail, lane, abs: isAbs, skids, lbl,
    x: 0, z: 0, v: 0, vz: 0, lam: 0, p: 0, thW: 0, stopX: null, lockFrom: null };
  return car;
}

const SMOKE_N = 110;

/* ================= 物理模型 ================= */
const G = 9.81, GRACE = 0.8;
const ROADS = {
  dry:  { mp: 0.95, ms: 0.68, lp: 0.15 },
  wet:  { mp: 0.55, ms: 0.38, lp: 0.13 },
  snow: { mp: 0.28, ms: 0.18, lp: 0.20 },
};
const PULSE_HZ = 15;                       // ABS 点放频率(现代系统 10–20 次/秒,演示取 15)
let roadKey = 'dry';
let v0 = 100 / 3.6;
let steerIn = 0;
let mode = 'race';                         // race | lock | abs | roll
let tSim = 0;
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let scrubbing = false, peakPulse = 0;
const hist = [];                           // 压力轨迹 {t, a, l}

function muX(l) {
  const r = ROADS[roadKey];
  if (l <= 0) return 0;
  if (l <= r.lp) return r.mp * (1 - (1 - l / r.lp) ** 2);
  const k = (l - r.lp) / (1 - r.lp);
  return r.ms + (r.mp - r.ms) * (1 - k) ** 2;
}
const muYnorm = l => Math.pow(1 - l, 1.6);  // 侧向附着系数(归一化),抱死 → 0
function braking(c) {
  if (tSim < GRACE) return false;
  if (mode === 'race') return true;
  if (mode === 'lock') return !c.abs;
  if (mode === 'abs') return c.abs;
  return false;
}
function anyMoving() { return cars.some(c => c.v > 0.05); }

function resetRun() {
  tSim = 0;
  hist.length = 0;
  const sx = -v0 * GRACE;
  for (const c of cars) {
    c.x = sx; c.z = 0; c.v = v0; c.vz = 0; c.lam = 0; c.p = 0; c.thW = 0;
    c.stopX = null; c.lockFrom = null;
    c.g.position.set(sx, 0, c.lane);
    c.g.rotation.y = 0;
    for (const q of c.skids) q.scale.x = 0.001;
  }
  flagA.visible = flagL.visible = measure.visible = false;
  for (const p of parts) p.on = false;
  spawnAcc = 0;
  elTBar.max = String(Math.round((GRACE + v0 / (ROADS[roadKey].ms * G) + 1.4) * 100));
}

function physStep(dt) {
  tSim += dt;
  for (const c of cars) {
    const bk = braking(c);
    if (bk) {
      if (c.abs) {
        const ph = (tSim * PULSE_HZ) % 1;
        c.p = ph < 0.62 ? 1 : 0.12;                       // 保压 / 泄压
        const lamT = ROADS[roadKey].lp + (c.p > 0.5 ? 0.035 : -0.035);
        c.lam += (lamT - c.lam) * Math.min(1, dt / 0.02);
      } else {
        c.p = 1;
        c.lam += (1 - c.lam) * Math.min(1, dt / 0.05);    // 车轮在 ~0.15 s 内锁死
      }
    } else {
      c.p = 0;
      c.lam += (0 - c.lam) * Math.min(1, dt / 0.3);
    }
    if (c.v > 0) {
      const a = bk ? -muX(c.lam) * G : 0;
      c.v = Math.max(0, c.v + a * dt);
      c.x += c.v * dt;
      if (c.x > 308) { c.x = 308; c.v = 0; }
    }
    /* 转向:侧向附着随滑移率塌陷,抱死 ≈ 0 → 车头不动 */
    if (Math.abs(steerIn) > 0.01 && c.v > 1) {
      c.vz += steerIn * muYnorm(c.lam) * 5.5 * dt;
      c.z = clamp(c.z + c.vz * dt, -6.5, 6.5);
      c.g.rotation.y = Math.atan2(c.vz, Math.max(c.v, 2)) * 0.85;
    } else {
      c.vz *= Math.max(0, 1 - dt * 1.5);
    }
    c.thW += c.v * (1 - c.lam) / WR * dt;
    if (bk && c.v === 0 && c.stopX === null) c.stopX = c.x;
    if (!c.abs && c.lam > 0.5 && c.lockFrom === null) c.lockFrom = c.x;
  }
  /* 抱死车烟尘 */
  const cL = cLok;
  if (tglSmoke.checked && cL.lam > 0.6 && cL.v > 1.2) {
    spawnAcc += dt * 34;
    while (spawnAcc >= 1) {
      spawnAcc -= 1;
      const p = parts[partIdx = (partIdx + 1) % SMOKE_N];
      p.on = true; p.age = 0; p.life = 0.7 + Math.random() * 0.7;
      p.x = cL.x - 1.4 + (Math.random() - 0.5) * 0.6;
      p.y = 0.15; p.z = cL.lane + (Math.random() < 0.5 ? TRACK : -TRACK) + (Math.random() - 0.5) * 0.3;
      p.vx = -1 - Math.random() * 1.5; p.vy = 0.9 + Math.random() * 0.9; p.vz = (Math.random() - 0.5) * 0.8;
    }
  }
  for (const p of parts) {
    if (!p.on) continue;
    p.age += dt;
    if (p.age > p.life) { p.on = false; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vy *= Math.max(0, 1 - dt * 0.8);
  }
}
function advanceSim(T) {
  while (tSim < T - 1e-6) physStep(Math.min(0.016, T - tSim));
}

/* ---------------- μ-λ 曲线图 + 压力轨迹 ---------------- */
const cvs = document.getElementById('cv');
const cctx = cvs.getContext('2d');
const CW = 288, CH = 236;
{
  const d2 = Math.min(devicePixelRatio, 2);
  cvs.width = CW * d2; cvs.height = CH * d2;
  cvs.style.width = CW + 'px'; cvs.style.height = CH + 'px';
  cctx.scale(d2, d2);
}
function drawChart() {
  const r = ROADS[roadKey];
  cctx.clearRect(0, 0, CW, CH);
  const x0 = 30, y0 = 8, pw = CW - 38, ph = 116;
  const X = l => x0 + l * pw;
  const Y = mu => y0 + ph - Math.min(mu, 1.08) / 1.08 * ph;
  cctx.strokeStyle = PAL.grid; cctx.lineWidth = 1;
  for (let i = 1; i < 5; i++) { cctx.beginPath(); cctx.moveTo(X(i * 0.2), y0); cctx.lineTo(X(i * 0.2), y0 + ph); cctx.stroke(); }
  for (let i = 1; i < 4; i++) { cctx.beginPath(); cctx.moveTo(x0, Y(i * 0.25)); cctx.lineTo(x0 + pw, Y(i * 0.25)); cctx.stroke(); }
  /* 峰值区 10–20% */
  const pulse = peakPulse > 0 ? 0.5 + 0.5 * Math.sin(performance.now() / 150) : 0;
  cctx.fillStyle = peakPulse > 0 ? `rgba(240,101,149,${0.12 + pulse * 0.14})` : 'rgba(240,101,149,.12)';
  cctx.fillRect(X(0.10), y0, X(0.20) - X(0.10), ph);
  cctx.fillStyle = PAL.txt2;
  cctx.font = '10px "PingFang SC",system-ui,sans-serif';
  cctx.textAlign = 'center';
  cctx.fillText(L('峰值区', 'peak zone'), X(0.15), y0 + 10);
  /* 侧向附着(虚线,归一化到 μ 峰) */
  cctx.setLineDash([4, 3]);
  cctx.strokeStyle = PAL.txt2; cctx.lineWidth = 1.4;
  cctx.beginPath();
  for (let i = 0; i <= 60; i++) { const l = i / 60; const y = Y(muYnorm(l) * r.mp * 0.95); i ? cctx.lineTo(X(l), y) : cctx.moveTo(X(l), y); }
  cctx.stroke();
  cctx.setLineDash([]);
  /* 纵向 μ(λ) */
  cctx.strokeStyle = PAL.acc; cctx.lineWidth = 2.2;
  cctx.beginPath();
  for (let i = 0; i <= 120; i++) { const l = i / 120; const y = Y(muX(l)); i ? cctx.lineTo(X(l), y) : cctx.moveTo(X(l), y); }
  cctx.stroke();
  /* 两个工作点 */
  for (const [c, col] of [[cLok, PAL.red], [cAbs, PAL.green]]) {
    cctx.beginPath();
    cctx.arc(X(c.lam), Y(muX(c.lam)), 4.5, 0, Math.PI * 2);
    cctx.fillStyle = col; cctx.fill();
    cctx.strokeStyle = 'rgba(255,255,255,.85)'; cctx.lineWidth = 1.4; cctx.stroke();
    cctx.beginPath();
    cctx.moveTo(X(c.lam), Y(muX(c.lam)) + 5);
    cctx.lineTo(X(c.lam), y0 + ph);
    cctx.strokeStyle = col; cctx.lineWidth = 1; cctx.setLineDash([2, 3]); cctx.stroke();
    cctx.setLineDash([]);
  }
  /* 轴文字 */
  cctx.fillStyle = PAL.txt2; cctx.textAlign = 'center';
  cctx.fillText(L('滑移率 λ →', 'slip ratio λ →'), x0 + pw / 2, CH - 16);
  for (const [l, t] of [[0, '0'], [0.2, '20'], [0.4, '40'], [0.6, '60'], [0.8, '80'], [1, '100%']])
    cctx.fillText(t, X(l), y0 + ph + 11);
  cctx.save();
  cctx.translate(10, y0 + ph / 2); cctx.rotate(-Math.PI / 2);
  cctx.fillText('μ', 0, 0);
  cctx.restore();
  cctx.textAlign = 'left';
  cctx.fillStyle = PAL.txt;
  cctx.fillText(L('— 纵向 μ(λ)  ‑‑ 侧向附着', '— longitudinal μ(λ)  ‑‑ lateral grip'), x0 + 2, CH - 3);
  /* 制动压力轨迹 */
  const sy = y0 + ph + 22, rh = 12;
  cctx.fillStyle = PAL.txt2; cctx.textAlign = 'right';
  cctx.fillText(L('压力', 'press'), x0 - 4, sy + rh / 2 + 3);
  cctx.strokeStyle = PAL.grid;
  cctx.strokeRect(x0, sy - 2, pw, rh * 2 + 6);
  const t1 = tSim - 1.7;
  const tx = t => x0 + clamp((t - t1) / 1.7, 0, 1) * pw;
  for (const [key, col, off] of [['l', PAL.red, 0], ['a', PAL.green, rh + 4]]) {
    cctx.strokeStyle = col; cctx.lineWidth = 1.5;
    cctx.beginPath();
    let started = false;
    for (const h of hist) {
      if (h.t < t1) continue;
      const y = sy + off + (rh - h[key] * rh) * 0.9;
      started ? cctx.lineTo(tx(h.t), y) : cctx.moveTo(tx(h.t), y);
      started = true;
    }
    cctx.stroke();
  }
}

/* ================= 主循环 ================= */
const clk = new THREE.Clock();
let lastStep = -1, rafId = 0;
const fp = { x: -v0 * GRACE };
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = clamp(clk.getDelta(), 0, 0.05);
  peakPulse = Math.max(0, peakPulse - dt);
  if (playing) {
    const dts = dt * speed;
    const n = Math.min(24, Math.ceil(dts / 0.02));
    for (let i = 0; i < n; i++) physStep(dts / n);
  }
  hist.push({ t: tSim, a: cAbs.p, l: cLok.p });
  while (hist.length && hist[0].t < tSim - 1.8) hist.shift();

  /* 车辆位姿 */
  for (const c of cars) {
    c.g.position.x = c.x;
    c.g.position.z = c.lane + c.z;
    for (const w of c.wheels) w.rotation.z = -c.thW;
    for (let i = 0; i < 2; i++) c.steerG[i].rotation.y = steerIn * 0.42;
    c.tail.material.opacity = c.p > 0.05 ? 0.95 : 0.25;
    if (!c.abs && c.lockFrom !== null) {
      for (const q of c.skids) {
        const len = Math.max(0.001, c.x - c.lockFrom);
        q.scale.x = len;
        q.position.x = c.lockFrom + len / 2;
      }
    }
  }
  const ringPulse = 0.25 + 0.75 * cAbs.p;
  M.ringG.opacity = cAbs.v > 0.05 ? cAbs.p * ringPulse * (0.55 + 0.45 * Math.sin(clk.elapsedTime * 2 * Math.PI * PULSE_HZ)) : 0;
  M.ringR.opacity = cLok.v > 0.05 ? cLok.p * 0.85 : 0;
  /* 旗标与差距横杆 */
  if (cAbs.stopX !== null) { flagA.visible = true; flagA.position.set(cAbs.stopX, 0, cAbs.lane); }
  if (cLok.stopX !== null) { flagL.visible = true; flagL.position.set(cLok.stopX, 0, cLok.lane); }
  if (mode === 'race' && cAbs.stopX !== null && cLok.stopX !== null) {
    const a = cAbs.stopX, b = cLok.stopX;
    measure.visible = true;
    measure.scale.x = Math.max(0.01, b - a);
    measure.position.x = (a + b) / 2;
    measure.position.z = 0;
  }
  /* 烟尘矩阵 */
  for (let i = 0; i < SMOKE_N; i++) {
    const p = parts[i];
    if (p.on) {
      const k = p.age / p.life;
      smokeDummy.position.set(p.x, p.y + k * 0.4, p.z);
      smokeDummy.scale.setScalar((0.5 + 1.7 * k) * (tglSmoke.checked ? 1 : 0.0001));
    } else {
      smokeDummy.position.set(0, -5, 0);
      smokeDummy.scale.setScalar(0.0001);
    }
    smokeDummy.updateMatrix();
    smoke.setMatrixAt(i, smokeDummy.matrix);
  }
  smoke.instanceMatrix.needsUpdate = true;

  /* 相机跟随(只跟制动中的车) */
  const bs = cars.filter(c => braking(c) || c.stopX !== null);
  const refX = clamp(bs.length ? bs.reduce((s, c) => s + c.x, 0) / bs.length : (cAbs.x + cLok.x) / 2, -v0 * GRACE, 300);
  fp.x += (refX - fp.x) * Math.min(1, dt * 2.5);
  controls.target.x = fp.x;
  lblStatus.position.x = fp.x + 9;

  /* 读数 */
  const fmtV = c => c.v * 3.6 < 0.5 && braking(c) ? '0' : (c.v * 3.6).toFixed(0);
  sAv.innerHTML = fmtV(cAbs) + '<small> km/h</small>';
  sLv.innerHTML = fmtV(cLok) + '<small> km/h</small>';
  sAs.innerHTML = Math.round(cAbs.lam * 100) + '<small> %</small>';
  sLs.innerHTML = Math.round(cLok.lam * 100) + '<small> %</small>';
  const dS = braking(cAbs) ? cAbs.x : 0, dL = braking(cLok) ? cLok.x : 0;
  sAd.innerHTML = Math.max(0, dS).toFixed(1) + '<small> m</small>';
  sLd.innerHTML = Math.max(0, dL).toFixed(1) + '<small> m</small>';
  sGap.textContent = mode === 'race' && braking(cAbs) ? '+' + Math.max(0, cLok.x - cAbs.x).toFixed(1) + ' m' : '—';
  if (!scrubbing) elTBar.value = String(Math.round(tSim * 100));
  elTVal.textContent = tSim.toFixed(1) + ' s';

  drawChart();
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const lblOn = tglLabels.checked;
  lblFlagA.o.element.style.display = lblOn && flagA.visible ? '' : 'none';
  lblFlagL.o.element.style.display = lblOn && flagL.visible ? '' : 'none';
  lblMeasure.o.element.style.display = lblOn && measure.visible ? '' : 'none';
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* document.hidden 停 rAF */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { clk.getDelta(); rafId = requestAnimationFrame(frame); }
});

/* ================= 页面专属 URL 参数 ================= */
{
  const vq = qsFloat('v', NaN);
  if (Number.isFinite(vq)) { v0 = clamp(vq, 40, 140) / 3.6; elV.value = String(clamp(vq, 40, 140)); elVVal.textContent = elV.value + ' km/h'; }
  const rq = qs.get('road');
  if (rq && ROADS[rq]) roadKey = rq;
  const mq = qs.get('mode');
  if (mq && MODE_BTN[mq]) mode = mq;
  const sq = qsFloat('steer', NaN);
  if (Number.isFinite(sq)) { steerIn = clamp(sq, -1, 1); elSt.value = String(Math.round(steerIn * 100)); elStVal.textContent = steerIn === 0 ? '0' : (steerIn > 0 ? '右 ' : '左 ') + Math.abs(steerIn * 100).toFixed(0) + '%'; }
}
elSpd.value = String(speed);
elSpdVal.textContent = speed.toFixed(1) + '×';

/* ================= 启动 ================= */
resetRun();
syncModeBtns();
syncRoadBtns();
applyTheme();
applyLang();
setPlayLabel();
{
  const tq = qsFloat('t', 0);
  if (tq > 0) advanceSim(tq);
}
rafId = requestAnimationFrame(frame);
</script>
</body>
