<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斯特林发动机 · 外燃的封闭循环</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff9d45;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-dim:#77828f; --cv-dim2:#8b97a8; --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b06a15;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-dim:#8593a3; --cv-dim2:#6b7a8a; --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--cv-text); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.g { border-color: rgba(255,180,84,.9); color: #ffe0ae; }
  :root[data-theme="light"] .lbl.r { color: #b34232; }
  :root[data-theme="light"] .lbl.b { color: #17708f; }
  :root[data-theme="light"] .lbl.g { color: #8a5c0d; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.45); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; max-width: 600px;
    line-height: 1.5; text-shadow: 0 1px 4px rgba(0,0,0,.35); }

  /* ===== pV 图 + 读数(右下) ===== */
  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 356px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 12px 10px; box-shadow: var(--shadow); }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: 190px; display: block; }
  #stats { display: grid; grid-template-columns: auto auto; gap: 3px 16px;
    margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--panel-border); }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.ok { color: #7bd88f; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,157,69,.10); border-color: rgba(255,157,69,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,106,21,.08); border-color: rgba(176,106,21,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #plot { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

  <div class="sub" data-zh="置换器与动力活塞在同一根曲轴上保持 90° 相位差;回热器像「热蓄电池」一样把气体的热存下再原封还回——所以斯特林能逼近卡诺效率 · 燃烧在缸外,火焰/太阳能/余热都行 · 3D 交互演示 · 拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Displacer and power piston share one crankshaft at a 90° phase offset; the regenerator works as a heat battery, storing the gas's heat and handing it back untouched — which is why a Stirling can approach Carnot efficiency · combustion stays outside: flame, solar or waste heat · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">置换器与动力活塞在同一根曲轴上保持 90° 相位差;回热器像「热蓄电池」一样把气体的热存下再原封还回——所以斯特林能逼近卡诺效率 · 燃烧在缸外,火焰/太阳能/余热都行 · 3D 交互演示 · 拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141b);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(5.6, 3.1, 7.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.5, 1.05, 0.3);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 20;
controls.maxPolarAngle = 1.62;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x35322c, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4.5, 8, 3.5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);
const hotLight = new THREE.PointLight(0xff6a30, 0, 6, 1.6);
hotLight.position.set(-2.3, 1.0, 0.4);
scene.add(hotLight);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.5,
    emissive: color, emissiveIntensity: 0.05, ...opts });
}
const M = {
  dark:  mat(0x525a66, { metalness: 0.75, roughness: 0.5 }),
  steel: mat(0xc9ced6, { metalness: 0.9, roughness: 0.32 }),
  brass: mat(0xd9a441, { metalness: 0.85, roughness: 0.35 }),
  disp:  mat(0xd6dade, { metalness: 0.85, roughness: 0.3 }),
  fin:   mat(0x7fa8c8, { metalness: 0.8, roughness: 0.4, emissive: 0x1c6fbf, emissiveIntensity: 0.08 }),
  hotCap: mat(0xb0402a, { emissive: 0xff4a20, emissiveIntensity: 0.4, roughness: 0.5 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xa9c4dc, transparent: true, opacity: 0.13,
           depthWrite: false, metalness: 0.4, roughness: 0.35, side: THREE.DoubleSide }),
  tube:  new THREE.MeshStandardMaterial({ color: 0x9fb6cf, transparent: true, opacity: 0.28,
           depthWrite: false, roughness: 0.5, metalness: 0.2, side: THREE.DoubleSide }),
  regen: new THREE.MeshStandardMaterial({ color: 0xc98a3a, transparent: true, opacity: 0.20,
           depthWrite: false, roughness: 0.6, metalness: 0.3, side: THREE.DoubleSide }),
  wire:  mat(0xb8763a, { metalness: 0.8, roughness: 0.4, emissive: 0xff8c30, emissiveIntensity: 0.12 }),
};
const gasHotMat = new THREE.MeshBasicMaterial({ color: 0xff8a5c, transparent: true, opacity: 0.16, depthWrite: false });
const gasColdMat = new THREE.MeshBasicMaterial({ color: 0x5c9dff, transparent: true, opacity: 0.15, depthWrite: false });
const C_HOT = new THREE.Color(0xff6a3d), C_COLD = new THREE.Color(0x4da3ff), C_AMBER = new THREE.Color(0xffb454);

function mesh(geo, m, opts = {}) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(...(opts.pos ?? [0, 0, 0]));
  if (opts.rot) o.rotation.set(...opts.rot);
  if (opts.order) o.renderOrder = opts.order;
  o.castShadow = false;
  (opts.parent || scene).add(o);
  return o;
}

/* ---------------- 几何常量 ---------------- */
const AXY = 1.15;                 // 缸轴高度
const XC = 3.5;                   // 曲轴中心 x
const RD_D = 0.65, LD = 1.6;      // 置换器曲柄半径 / 连杆
const RD_P = 0.42, LP = 1.5;      // 动力活塞曲柄半径 / 连杆
const dOf = (r, l, a) => r * Math.cos(a) + Math.sqrt(l * l - r * r * Math.sin(a) ** 2);
const Y_UP = new THREE.Vector3(0, 1, 0), _v = new THREE.Vector3();
function setRod(m, a, b) {
  m.position.copy(a).add(b).multiplyScalar(0.5);
  _v.copy(b).sub(a);
  const len = Math.max(_v.length(), 0.001);
  m.scale.y = len;
  m.quaternion.setFromUnitVectors(Y_UP, _v.normalize());
}

/* ---------------- 底座 / 支承 ---------------- */
mesh(new THREE.BoxGeometry(9.8, 0.16, 4.8), M.dark, { pos: [0.5, -0.28, 0.45] });
for (const [x, z] of [[-1.3, 0], [1.3, 0], [1.9, 1.3]])
  mesh(new THREE.BoxGeometry(0.34, 0.85, 0.6), M.dark, { pos: [x, 0.22, z] });

/* ---------------- 主缸:热端 / 冷端 / 回热器套环 ---------------- */
const BORE = { x0: -2.2, x1: 2.2, r: 0.6 };
mesh(new THREE.CylinderGeometry(BORE.r, BORE.r, 4.4, 48, 1, true), M.glass,
  { pos: [0, AXY, 0], rot: [0, 0, Math.PI / 2], order: 4 });
mesh(new THREE.TorusGeometry(0.64, 0.04, 10, 40), M.steel, { pos: [-2.2, AXY, 0] }).rotation.y = Math.PI / 2;
mesh(new THREE.TorusGeometry(0.64, 0.04, 10, 40), M.steel, { pos: [2.2, AXY, 0] }).rotation.y = Math.PI / 2;
const hotCap = mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.14, 40), M.hotCap,
  { pos: [-2.3, AXY, 0], rot: [0, 0, Math.PI / 2] });
mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.14, 40), M.steel,
  { pos: [2.3, AXY, 0], rot: [0, 0, Math.PI / 2] });
for (let i = 0; i < 7; i++)
  mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.04, 40), M.fin,
    { pos: [2.42 + i * 0.1, AXY, 0], rot: [0, 0, Math.PI / 2] });

/* 回热器:套环 + 钢丝网(InstancedMesh) */
mesh(new THREE.CylinderGeometry(0.78, 0.78, 0.5, 36, 1, true), M.regen,
  { pos: [0.4, AXY, 0], rot: [0, 0, Math.PI / 2], order: 4 });
{
  const wires = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.008, 0.008, 0.5, 5), M.wire, 16);
  const d = new THREE.Object3D();
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * TAU;
    d.position.set(0.4, AXY + Math.cos(a) * 0.7, Math.sin(a) * 0.7);
    d.rotation.set(0, 0, Math.PI / 2);
    d.updateMatrix();
    wires.setMatrixAt(i, d.matrix);
  }
  scene.add(wires);
  for (const dx of [-0.18, 0, 0.18])
    mesh(new THREE.TorusGeometry(0.7, 0.011, 6, 40), M.wire, { pos: [0.4 + dx, AXY, 0] }).rotation.y = Math.PI / 2;
}
/* 回热器温度梯度条(12 段,充/放热时中段亮起) */
const BAR_N = 12;

/* ---------------- 热力学状态模型 ---------------- */
const TC = 300;                              // 冷腔 K
let ThSet = 650, ThGas = 650;                // 热源设定 / 热腔实际(缓变)
const NR = 0.1013, CV = 1.5 * NR;            // nR、Cv(kPa·L/K → J/K)
const VC = 0.30, VA = 0.105;                 // 平均容积 / 振幅(L)
let rpm = 45, speed = 1, cycles = 0, tWall = 0;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
speed = clamp(qsFloat('speed', 1), 0.2, 3);
rpm = clamp(qsFloat('rpm', 45), 15, 180);
ThSet = clamp(qsFloat('th', 650), 450, 900);
let srcMode = 0;
let wCyc = 10, qhCyc = 30, etaCyc = 0.2, integTh = 0;

const V1 = VC - VA, V2 = VC + VA, LNR = Math.log(V2 / V1);
const EPS = 0.9;                             // 回热器效率:缺口由热源补足 → η < 卡诺
const ss01 = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
function hdOf(f) {                           // 热侧气体占比(与置换器同相)
  if (f < 0.25) return 1;
  if (f < 0.5) return 1 - ss01((f - 0.25) * 4);
  if (f < 0.75) return 0;
  return ss01((f - 0.75) * 4);
}
function stateAt(f) {                        // 四段理想循环:等温/等容交替
  f -= Math.floor(f);
  let V, T, leg;
  if (f < 0.25)      { leg = 0; V = V1 + (V2 - V1) * ss01(f * 4);        T = ThGas; }
  else if (f < 0.5)  { leg = 1; V = V2;                                   T = lerp(ThGas, TC, ss01((f - 0.25) * 4)); }
  else if (f < 0.75) { leg = 2; V = V2 - (V2 - V1) * ss01((f - 0.5) * 4); T = TC; }
  else               { leg = 3; V = V1;                                   T = lerp(TC, ThGas, ss01((f - 0.75) * 4)); }
  return { hd: hdOf(f), V, T, p: NR * T / V, leg };
}
function integrateCycle() {                  // 闭式:W = nR·ΔT·lnr,Qₕ 含回热损失
  wCyc = NR * (ThGas - TC) * LNR;
  qhCyc = NR * ThGas * LNR + (1 - EPS) * CV * (ThGas - TC);
  etaCyc = wCyc / qhCyc;
  integTh = ThGas;
}
integrateCycle();

function drawPlot(f) {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const ML = 52, MR = 16, MT = 14, MB = 34;
  const V0 = VC - VA - 0.03, V1 = VC + VA + 0.03;
  const P0 = NR * TC / (VC + VA) * 0.8, P1 = NR * ThGas / (VC - VA) * 1.1;
  const px = v => ML + (W - ML - MR) * (v - V0) / (V1 - V0);
  const py = p => H - MB - (H - MT - MB) * (p - P0) / (P1 - P0);
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    const gx = ML + (W - ML - MR) * i / 5, gy = MT + (H - MT - MB) * i / 5;
    ctx.beginPath(); ctx.moveTo(gx, MT); ctx.lineTo(gx, H - MB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ML, gy); ctx.lineTo(W - MR, gy); ctx.stroke();
  }
  ctx.strokeStyle = PAL.axis; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(ML, H - MB); ctx.lineTo(W - MR + 6, H - MB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ML, H - MB); ctx.lineTo(ML, MT - 6); ctx.stroke();
  ctx.font = '500 18px system-ui'; ctx.fillStyle = PAL.dim2; ctx.textAlign = 'center';
  ctx.fillText(L('V (L)', 'V (L)'), W - MR - 36, H - MB + 28);
  ctx.fillText(L('p (kPa)', 'p (kPa)'), ML + 40, MT - 2);
  for (let leg = 0; leg < 4; leg++) {
    ctx.strokeStyle = SEG_COL[leg];
    ctx.lineWidth = leg % 2 ? 2.6 : 4;
    ctx.beginPath();
    for (let i = 0; i <= 50; i++) {
      const s = stateAt((leg + i / 50) * 0.25);
      i ? ctx.lineTo(px(s.V), py(s.p)) : ctx.moveTo(px(s.V), py(s.p));
    }
    ctx.stroke();
  }
  ctx.font = '600 17px system-ui';
  ctx.fillStyle = '#ff8a80'; ctx.textAlign = 'left';
  ctx.fillText(L('膨胀=做功', 'expansion = work'), px(VC) + 14, py(NR * ThGas / VC) + 34);
  ctx.fillStyle = '#7fd0f7';
  ctx.fillText(L('压缩=耗功(更省)', 'compression = costs less'), px(VC) + 14, py(NR * TC / VC) - 16);
  const s = stateAt(f % 1);
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(px(s.V), py(s.p), 7, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.font = '600 18px system-ui';
  ctx.fillText(L(...LEG_TXT[Math.min(3, Math.floor(f * 4))]), clamp(px(s.V) + 14, ML, W - MR - 150), clamp(py(s.p) - 12, MT + 14, H - MB));
}

/* ---------------- 每帧世界更新 ---------------- */
const dummy = new THREE.Object3D(), _c = new THREE.Color();
let prevHd = 1;
function updateWorld(f, dt) {
  const th = TAU * f;
  const hd = hdOf(f);
  let dh = hd - prevHd;                      // 移送速率(跨圈回绕修正)
  if (dh > 0.5) dh -= 1; else if (dh < -0.5) dh += 1;
  const hdRate = dt > 0 ? dh / dt : 0;
  const act = clamp(Math.abs(hdRate) / 2.2, 0, 1);      // 移送活跃度
  const hn = clamp((ThGas - TC) / 450, 0.05, 1.4);      // 温差强度

  /* 曲轴 / 飞轮(整体转 Θ,两销天然差 90°) */
  crankGrp.rotation.z = th;

  /* 置换器:曲柄滑块 → 缸内位置 */
  const chX = XC - dOf(RD_D, LD, th);
  dispGrp.position.x = chX - 1.75;
  setRod(rodD, new THREE.Vector3(dispGrp.position.x + 1.1, AXY, 0), new THREE.Vector3(chX, AXY, 0));
  headD.position.set(chX, AXY, 0);
  const pinD = new THREE.Vector3(XC + RD_D * Math.cos(th), AXY + RD_D * Math.sin(th), 0);
  setRod(rodBigD, new THREE.Vector3(chX, AXY, 0), pinD);

  /* 动力活塞(曲柄销相位 +90°) */
  const thP = th + Math.PI / 2;
  const px2 = XC - dOf(RD_P, LP, thP);
  powPiston.position.x = px2;
  const pinP = new THREE.Vector3(XC + RD_P * Math.cos(thP), AXY + RD_P * Math.sin(thP), 1.3);
  setRod(rodP, new THREE.Vector3(px2 + 0.28, AXY, 1.3), pinP);

  /* 气柱:热腔 / 冷腔 / 动力缸 */
  const dl = dispGrp.position.x - 1.1, dr = dispGrp.position.x + 1.1;
  gasHot.position.set((BORE.x0 + dl) / 2, AXY, 0);
  gasHot.scale.y = Math.max(dl - BORE.x0, 0.05);
  gasCold.position.set((dr + BORE.x1) / 2, AXY, 0);
  gasCold.scale.y = Math.max(BORE.x1 - dr, 0.05);
  gasHotMat.color.copy(C_COLD).lerp(C_HOT, clamp(hn / 1.2, 0, 1));
  const crown = px2 - 0.28;
  gasColP.position.set((1.15 + 0.05 + crown) / 2, AXY, 1.3);
  gasColP.scale.y = Math.max(crown - 1.2, 0.05);

  /* 粒子:整体随移送漂移,颜色随局部温度 */
  const vDrift = -hdRate * 2.2 / 4.3;
  for (let i = 0; i < N; i++) {
    const p = parts[i];
    p.u = ((p.u + vDrift * dt) % 1 + 1) % 1;
    const xx = -2.15 + p.u * 4.3;
    const a = p.a + tWall * 0.4 * (0.4 + hn) * (i % 2 ? 1 : -1);
    dummy.position.set(xx + 0.04 * Math.sin(tWall * p.w + p.s), AXY + p.r * Math.cos(a), p.r * Math.sin(a));
    dummy.scale.setScalar(p.j * 0.9);
    dummy.updateMatrix();
    pm.setMatrixAt(i, dummy.matrix);
    const loc = Math.pow(clamp(1 - (xx + 2.15) / 4.3, 0, 1), 1.15);
    _c.copy(C_COLD).lerp(C_HOT, clamp(loc * hn, 0, 1)).multiplyScalar(p.j);
    pm.setColorAt(i, _c);
  }
  pm.instanceMatrix.needsUpdate = true;
  pm.instanceColor.needsUpdate = true;

  /* 回热器梯度条:充热量 S = 1−hd(与气体的位置反相) */
  const S = 1 - hd;
  for (let i = 0; i < BAR_N; i++) {
    const g = i / (BAR_N - 1);
    _c.copy(C_COLD).lerp(C_HOT, Math.pow(g, 1.1)).lerp(C_AMBER, S * 0.75 * Math.pow(Math.sin(Math.PI * g), 0.8));
    bar.setColorAt(i, _c);
  }
  bar.instanceColor.needsUpdate = true;

  /* 回热器热流箭头(移送相位才出现) */
  const dir = hdRate < 0 ? 1 : -1;
  flowMat.opacity = act > 0.06 ? 0.25 + 0.6 * act : 0;
  for (let i = 0; i < FLOW_N; i++) {
    const fr = ((tWall * 1.3 * dir + i / FLOW_N) % 1 + 1) % 1;
    dummy.position.set(lerp(0.06, 0.74, fr), AXY + 0.5, (i % 2 ? 0.2 : -0.2));
    dummy.rotation.set(0, 0, dir > 0 ? -Math.PI / 2 : Math.PI / 2);
    dummy.scale.setScalar(0.7 + 0.7 * Math.sin(Math.PI * fr));
    dummy.updateMatrix();
    flowArrows.setMatrixAt(i, dummy.matrix);
  }
  flowArrows.instanceMatrix.needsUpdate = true;

  /* 外燃:火焰闪烁 / 热端辉光 / 冷端鳍片脉冲 */
  const flick = 0.75 + 0.35 * Math.sin(tWall * 7.3) + 0.18 * Math.sin(tWall * 13.7);
  for (let i = 0; i < FLAME_N; i++) {
    const b = flameBase[i];
    const sY = flick * (0.8 + 0.3 * Math.sin(i * 2.1));
    dummy.position.set(b[0] + 0.03 * Math.sin(tWall * 9 + i), b[1] + 0.17 * sY, b[2]);
    dummy.rotation.set(0, 0, 0.1 * Math.sin(tWall * 5 + i));
    dummy.scale.set(1, sY, 1);
    dummy.updateMatrix();
    flames.setMatrixAt(i, dummy.matrix);
  }
  flames.instanceMatrix.needsUpdate = true;
  hotCap.material.emissiveIntensity = 0.25 + 0.75 * hn + act * (hd > 0.5 ? 0.35 : 0);
  hotLight.intensity = 1.2 + 3.5 * hn;
  M.fin.emissiveIntensity = 0.06 + act * (hd < 0.5 ? 0.4 : 0.08);

  prevHd = hd;
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  tWall += dt;
  if (playing) cycles += dt * speed * rpm / 60;
  const f = cycles - Math.floor(cycles);
  ThGas += (ThSet - ThGas) * (1 - Math.exp(-dt * 0.9));

  updateWorld(f, dt);
  if (tglPlot.checked) drawPlot(f);

  const si = stepIndex(f);
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  stP.textContent = (wCyc * rpm / 60).toFixed(1) + ' W';
  stE.innerHTML = L(`${(etaCyc * 100).toFixed(1)}<small>% / 上限 ${(100 * (1 - TC / ThGas)).toFixed(0)}%</small>`,
                    `${(etaCyc * 100).toFixed(1)}<small>% / ceiling ${(100 * (1 - TC / ThGas)).toFixed(0)}%</small>`);
  stTh.textContent = ThGas.toFixed(0) + ' K';
  stTc.textContent = TC + ' K';
  stPh.textContent = Math.round(f * 360) + '°';
  formulaAcc += dt;
  if (formulaAcc > 0.25) {
    formulaAcc = 0;
    if (Math.abs(ThGas - integTh) > 2) integrateCycle();
    updateFormula();
  }
  if (camK < 1) {
    camK = clamp(camK + dt / 0.9, 0, 1);
    const e = camK * camK * (3 - 2 * camK);
    camera.position.lerpVectors(camP0, camP1, e);
    controls.target.lerpVectors(camT0, camT1, e);
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ---------------- 初始化(URL 参数) ---------------- */
applyTheme();
applyLang();
ThGas = ThSet;
integrateCycle();
cycles = clamp(qsFloat('t', 0), 0, 600) * rpm / 60;
updateWorld(cycles - Math.floor(cycles), 0.016);
if (tglPlot.checked) drawPlot(cycles - Math.floor(cycles));
start();
</script>
