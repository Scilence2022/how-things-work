<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悬索桥 · 每一分力的回家路</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#74c0fc;
    --bg:#0e1420; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1971c2;
    --bg:#e7edf4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(116,192,252,.6); background: rgba(116,192,252,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(25,113,194,.55); background: rgba(25,113,194,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(116,192,252,.10); border-color: rgba(116,192,252,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(25,113,194,.08); border-color: rgba(25,113,194,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #cfe8ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="悬索桥 · 每一分力的回家路" data-en="The Suspension Bridge · Every Force Finds Its Way Home">悬索桥 · 每一分力的回家路</h1>
  <div class="sub" data-zh="桥面把货车轮压交给吊索,吊索把它交给主缆;主缆像一条倒过来的拱,用纯拉力回应荷载:H = wL²/(8f),恒载 260 kN/m、主跨 1280 m、垂度 144 m 时两缆合计约 370 MN。塔顶把拉力折成竖向压力,塔底约 640 MN 压进基础墩;两岸锚碇用 6 万吨混凝土顶住每缆 185 MN 的水平拉。金门大桥主缆 Ø0.92 m、27,572 根钢丝,安全系数约 4 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="The deck hands wheel loads to the hangers, the hangers hand them to the main cable; like an upside-down arch, the cable answers with pure tension: H = wL²/(8f) — dead load 260 kN/m, span 1,280 m, sag 144 m gives about 370 MN across both cables. The tower tops fold tension into vertical compression, some 640 MN marching into the piers; the anchorages hold 185 MN of pull per cable with 60,000 t of concrete. Golden Gate cables: 0.92 m across, 27,572 wires each, safety factor about 4 · 3D interactive demo · drag to orbit · Space = run/pause">悬索桥 · 每一分力的回家路</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="吊索最大张力" data-en="Max hanger tension">吊索最大张力</span><span class="v" id="stHang">—</span>
  <span class="k" data-zh="塔顶竖向力(每塔)" data-en="Tower-top vertical">塔顶竖向力(每塔)</span><span class="v" id="stTop">—</span>
  <span class="k" data-zh="塔底轴力(每塔)" data-en="Tower-base axial">塔底轴力(每塔)</span><span class="v" id="stBase">—</span>
  <span class="k" data-zh="锚碇水平拉(每缆)" data-en="Anchor pull per cable">锚碇水平拉(每缆)</span><span class="v" id="stAnchor">—</span>
  <span class="k" data-zh="跨中挠度" data-en="Midspan deflection">跨中挠度</span><span class="v" id="stDefl">—</span>
  <span class="k" data-zh="主缆安全系数" data-en="Cable safety factor">主缆安全系数</span><span class="v" id="stSF">—</span>
</div>

<div id="plot">
  <h3 data-zh="主跨 1280 m 线形:灰=恒载抛物线,蓝=当前主缆,橙=桥面挠度(放大120×),竖线=活载位置" data-en="Main span 1,280 m: gray = dead-load parabola, blue = live cable, orange = deck deflection (120×), line = load position">主跨 1280 m 线形:灰=恒载抛物线,蓝=当前主缆,橙=桥面挠度(放大120×),竖线=活载位置</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="蓝:主缆与吊索(受拉)" data-en="blue: cable & hangers (tension)">蓝:主缆与吊索(受拉)</span>
    <span class="chip.o" data-zh="橙:桥塔与基础墩(受压)" data-en="orange: towers & piers (compression)">橙:桥塔与基础墩(受压)</span>
    <span class="chip.r" data-zh="红:锚碇(抗水平拉)" data-en="red: anchorages (hold the pull)">红:锚碇(抗水平拉)</span>
    <span class="chip.g" data-zh="绿:桥面加劲梁(分配荷载)" data-en="green: stiffening girder (spreads load)">绿:桥面加劲梁(分配荷载)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnTruck" data-zh="货车过桥" data-en="Truck crossing">货车过桥</button>
    <button class="abtn" id="btnRes" data-zh="共振激励" data-en="Resonance excitation">共振激励</button>
  </div>
  <div class="row"><label data-zh="活载大小" data-en="Live load">活载大小</label><input id="sLoad" type="range" min="0" max="2000" step="50" value="400"><span class="val" id="sLoadVal">400 kN</span></div>
  <div class="row"><label data-zh="活载位置" data-en="Load position">活载位置</label><input id="sPos" type="range" min="0" max="1280" step="10" value="640"><span class="val" id="sPosVal">640 m</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglPath" type="checkbox" checked> <span data-zh="载荷路径动画" data-en="Load-path flow">载荷路径动画</span></label>
      <label><input id="tglDead" type="checkbox" checked> <span data-zh="恒载显示" data-en="Dead load">恒载显示</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../concrete/" data-zh="混凝土:锚碇与墩的抗压本领" data-en="concrete: how anchors & piers take compression">混凝土:锚碇与墩的抗压本领</a>
    <a href="../vortex-street/" data-zh="涡街:风吹出的涡激振动" data-en="vortex street: wind-born vibration">涡街:风吹出的涡激振动</a>
    <a href="../standing-waves/" data-zh="驻波:共振的舞台" data-en="standing waves: the stage of resonance">驻波:共振的舞台</a>
    <a href="../harmonic-oscillator/" data-zh="谐振子:固有频率从哪来" data-en="harmonic oscillator: where natural frequency comes from">谐振子:固有频率从哪来</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1420);
scene.fog = new THREE.Fog(0x0e1420, 60, 210);
const waterM = new THREE.MeshStandardMaterial({ color: 0x0c1626, roughness: 0.25, metalness: 0.1 });
const landM = new THREE.MeshStandardMaterial({ color: 0x1a2129, roughness: 0.95 });
const towerM = new THREE.MeshStandardMaterial({ color: 0xb04a32, roughness: 0.55, metalness: 0.3 });
const cableM = new THREE.MeshStandardMaterial({ color: 0xb8573c, roughness: 0.45, metalness: 0.35, side: THREE.DoubleSide });
const deckM = new THREE.MeshStandardMaterial({ color: 0x333a44, roughness: 0.8 });
const trussM = new THREE.MeshStandardMaterial({ color: 0x272d36, roughness: 0.85 });
const railM = new THREE.MeshStandardMaterial({ color: 0x55606d, roughness: 0.6 });
const anchorM = new THREE.MeshStandardMaterial({ color: 0x4a515c, roughness: 0.92 });
const truckM = new THREE.MeshStandardMaterial({ color: 0xd8dee6, roughness: 0.5, metalness: 0.2 });
const cargoM = new THREE.MeshStandardMaterial({ color: 0xd8b13c, roughness: 0.6 });
const wheelM = new THREE.MeshStandardMaterial({ color: 0x14181d, roughness: 0.9 });
const deadArrowM = new THREE.MeshBasicMaterial({ color: 0x9fb3c8, transparent: true, opacity: 0.45, depthWrite: false });
const hangerBase = new THREE.Color(0x44586e), hangerHot = new THREE.Color(0xbfe9ff), hColTmp = new THREE.Color();

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  const bgc = dark ? 0x0e1420 : 0xd8e2ec;
  scene.background = new THREE.Color(bgc);
  scene.fog.color = new THREE.Color(bgc);
  scene.fog.near = dark ? 60 : 80; scene.fog.far = dark ? 210 : 260;
  waterM.color.setHex(dark ? 0x0c1626 : 0x8fb9d8);
  landM.color.setHex(dark ? 0x1a2129 : 0xcabd9e);
  towerM.color.setHex(dark ? 0xb04a32 : 0xc25c40);
  cableM.color.setHex(dark ? 0xb8573c : 0xc46a4d);
  deckM.color.setHex(dark ? 0x333a44 : 0x8b96a2);
  trussM.color.setHex(dark ? 0x272d36 : 0x6f7a86);
  railM.color.setHex(dark ? 0x55606d : 0xa5aeb8);
  anchorM.color.setHex(dark ? 0x4a515c : 0xb3bcc6);
  truckM.color.setHex(dark ? 0xd8dee6 : 0x3a4250);
  deadArrowM.color.setHex(dark ? 0x9fb3c8 : 0x5c7186);
  hangerBase.setHex(dark ? 0x44586e : 0x62798f);
  hangerHot.setHex(dark ? 0xbfe9ff : 0x1971c2);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('悬索桥 · 每一分力的回家路', 'The Suspension Bridge · Every Force Finds Its Way Home');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();

const wc = W_DEAD / 2;                                    // 每缆分摊恒载 130 kN/m
const V_TOP0 = 2 * (wc * SPAN / 2 + HC * 194 / SIDE + wc * SIDE / 2);  // ≈420 MN/塔

function liveXm() { return truckOn ? clamp(truckX, -SPAN / 2, SPAN / 2) : liveA - SPAN / 2; }
function modeAt(xm) { const t = (xm + SPAN / 2) / SPAN; return (t <= 0 || t >= 1) ? 0 : Math.sin(Math.PI * t); }
function deltaLive() {                            // 活载静挠度峰值 m(跨中影响线)
  const ae = clamp(liveXm(), -SPAN / 2, SPAN / 2);
  const tt = 0.5 - Math.abs(ae) / SPAN;
  return P * SPAN ** 3 / (48 * EI_EQ) * Math.max(0, 3 * tt - 4 * tt ** 3);
}
function deflM(xm) { return modeAt(xm) * (deltaLive() + q); }          // 桥面挠度 m
function deflVis(xm) { return deflM(xm) * EXAG * m2u; }                // 场景单位(放大)
function shareAt(xm) {                            // 吊索分摊活载 kN/m(加劲梁 ±100 m 摊配)
  const dd = Math.abs(xm - liveXm());
  return dd < 100 ? P * (1 - dd / 100) / 100 : 0;
}
function cablePoint(xm) {                         // 主缆线形:y 返回米,z 返回单位
  const ax = Math.abs(xm);
  if (ax <= SPAN / 2) return { y: 227 - SAG + SAG * (1 - (xm / 640) ** 2), z: 1.5 };
  const u = clamp((ax - 640) / SIDE, 0, 1.06);
  const y = 227 - 194 * u - 48 * u * (1 - u);
  const z = 1.5 + (u > 0.78 ? (u - 0.78) / 0.22 : 0) * 0.75;
  return { y, z };
}
function statsNow() {
  const a = liveXm(), ae = clamp(a, -640, 640), xl = ae + 640;
  const dH = P * Math.min(xl, SPAN - xl) / (2 * SAG) / 1000;   // ΔH = M中/f(两缆,MN)
  const Hc = HC + dH / 2, Tmax = Hc / COS_T;
  const Th = (wc + P / 100) * S_HANG / 1000;                   // 最紧吊索 MN
  const V = V_TOP0 + P * (1 - Math.abs(ae) / SPAN) / 1000;
  return { Hc, Tmax, Th, V, N: V + 218, dMid: deflM(0), sf: H_CAP / Tmax };
}

function cableVis(xm) { return cablePoint(xm).y * m2u - deflM(xm) * 0.5 * EXAG * m2u; }
function buildPaths() {
  const a = liveXm(), axu = clamp(a, -640, 640) * m2u, cy = cableVis(a);
  const s = a >= 0 ? 1 : -1, tx = s * TOW_X;
  const A = [V3(axu, DECK_Y + 0.05, 1.1), V3(axu, cy, 1.5)];
  for (let i = 1; i <= 4; i++) { const xm = a + (640 * s - a) * i / 4; A.push(V3(xm * m2u, cableVis(xm), 1.5)); }
  A.push(V3(tx, TOW_TOP + 0.1, 1.5), V3(tx, 0.5, 1.5));
  const mk = dir => {

    for (let i = 1; i <= 5; i++) { const xm = a + dir * (1000 - a) * i / 5; pp.push(V3(xm * m2u, cableVis(xm), cablePoint(xm).z)); }

function updateArrows() {

  const polys = buildPaths();
  polys.forEach((pts, pi) => {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
    const total = cum[cum.length - 1];
    if (total < 0.3) return;
    const pt = new THREE.Vector3(), pt2 = new THREE.Vector3();
    for (const a of pathArr) if (a.p === pi) {
      const dist = (((simT * 0.055) + a.ph) % 1) * total;
      let j = 1; while (j < cum.length - 1 && cum[j] < dist) j++;
      const f = clamp((dist - cum[j - 1]) / Math.max(cum[j] - cum[j - 1], 1e-6), 0, 1);
      a.mesh.position.lerpVectors(pts[j - 1], pts[j], f);
      pt2.lerpVectors(pts[j - 1], pts[j], clamp(f + 2.5 / Math.max(total, 1), 0, 1));
      pt.copy(pt2).sub(a.mesh.position);
      if (pt.lengthSq() > 1e-8) a.mesh.quaternion.setFromUnitVectors(UPV, pt.normalize());
      a.mesh.visible = true;
    }
  });
}

    d: '缆的平衡给出 y = M(x)/H:缆形就是「等代简支梁」的弯矩图除以水平拉力。恒载沿跨均布时弯矩图是抛物线,M中 = wL²/8 = H·f,故 H = wL²/(8f) = 260×1280²/(8×144) ≈ 370 MN(两缆)。只有缆只受自重时才是悬链线;桥面恒载远大于缆重,垂跨比 f/L≈1/9 的抛物线是极好的近似。',
    de: 'Cable equilibrium gives y = M(x)/H: the cable shape is the equivalent beam\'s moment diagram divided by the horizontal tension. Uniform dead load makes a parabolic moment diagram: M_mid = wL²/8 = H·f, so H = wL²/(8f) = 260×1280²/(8×144) ≈ 370 MN across both cables. A true catenary appears only under self-weight alone; with deck load dwarfing cable weight, the parabola (f/L ≈ 1/9) is excellent.',
    act: () => { flyTo([0, 10, 32], [0, 3.3, 0]); } },
  { b: '加劲梁:不是承重,是分配', be: 'The stiffening girder: not a carrier, a distributor',
    d: '40 t 货车若只压最近一根吊索,该索要独扛全部活载;7.6 m 深的加劲桁架把点荷载摊给前后约 ±100 m 的一串吊索,每根只多担约 1.5%。跨中挠度按 δ = PL³/(48EI) 计:金门满布活载的设计最大挠度约 3.3 m;本页画面放大 120 倍,你才看得见货车压出的凹坑。',
    de: 'A 40-t truck would overload the single nearest hanger; the 7.6 m stiffening truss spreads the point load over hangers within about ±100 m, so each gains just ~1.5%. Midspan deflection follows δ = PL³/(48EI) — the Golden Gate allows about 3.3 m under full live load; this page magnifies deflection 120× so you can see the truck\'s dip at all.',
    act: () => { flyTo([7, 3.2, 8], [2, 1.9, 0]); pulseT = 6; } },
  { b: '风与共振:塔科马的教训', be: 'Wind and resonance: the Tacoma lesson',
    d: '1940 年 11 月 7 日,主跨 853 m 的塔科马海峡桥在仅 19 m/s 的风里发生扭转颤振,桥面扭到 ±45°,开放仅 4 个月即坠毁——刚度太弱、扭转频率 0.2 Hz 与风的激励合拍。此后大跨悬索桥必过风洞:金门用深桁架加劲,基频约 0.12 Hz;涡激振动与共振是设计必须避开的禁区。',
    de: 'On Nov 7, 1940, the 853-m Tacoma Narrows Bridge fluttered torsionally in a mere 19 m/s wind, twisting ±45° and collapsing four months after opening — too little stiffness, and its 0.2 Hz torsional frequency matched the wind. Since then every long span must survive the wind tunnel: the Golden Gate uses a deep truss, fundamental frequency ≈ 0.12 Hz; vortex shedding and resonance are zones to avoid.',
    act: () => { flyTo([24, 6.5, 30], [0, 2.4, 0]); resOn = true; notify('共振激励:激振力对准固有频率,挠度被逐周期放大', 'resonance: driving at the natural frequency grows the swing cycle by cycle'); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:主缆线形 + 桥面挠度 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 40, padR = 48, padT = 12, padB = 22;
  const X = a => padL + a / SPAN * (W - padL - padR);
  const Y = el => (H - padB) - (el - 20) / 220 * (H - padT - padB);
  const Y2 = dv => (H - padB) - clamp(dv, 0, 70) / 70 * (H - padT - padB);
  ctx.font = '12px system-ui';
  /* 参考线:塔顶 227 m / 桥面 67 m */
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.setLineDash([5, 5]);
  for (const [el, lab] of [[227, '227 m'], [67, '67 m']]) {
    ctx.beginPath(); ctx.moveTo(padL, Y(el)); ctx.lineTo(W - padR, Y(el)); ctx.stroke();
    ctx.fillStyle = cTxt; ctx.fillText(lab, padL + 4, Y(el) - 4);
  }
  ctx.setLineDash([]);
  /* 恒载抛物线(灰,底) */
  ctx.strokeStyle = 'rgba(159,176,195,.55)'; ctx.lineWidth = 1.6;
  ctx.setLineDash([7, 5]);
  ctx.beginPath();
  for (let a = 0; a <= SPAN; a += 16) {
    const el = 83 + SAG * (1 - ((a - 640) / 640) ** 2);
    a <= 0 ? ctx.moveTo(X(a), Y(el)) : ctx.lineTo(X(a), Y(el));
  }
  ctx.stroke();
  ctx.setLineDash([]);
  /* 当前主缆(蓝,含活载微调) */
  ctx.strokeStyle = '#74c0fc'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let a = 0; a <= SPAN; a += 16) {
    const el = 83 + SAG * (1 - ((a - 640) / 640) ** 2) - deflM(a - 640) * 0.5 * EXAG;
    a <= 0 ? ctx.moveTo(X(a), Y(el)) : ctx.lineTo(X(a), Y(el));
  }
  ctx.stroke();
  /* 桥面挠度(橙,右轴,放大 120×) */
  ctx.strokeStyle = '#ffa94d'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let a = 0; a <= SPAN; a += 16) {
    const dv = Math.max(0, deflM(a - 640)) * EXAG;
    a <= 0 ? ctx.moveTo(X(a), Y2(dv)) : ctx.lineTo(X(a), Y2(dv));
  }
  ctx.stroke();
  /* 活载位置竖线 + 主缆动点 */
  const lx = liveXm() + 640;
  ctx.strokeStyle = 'rgba(255,107,107,.7)';
  ctx.beginPath(); ctx.moveTo(X(lx), padT); ctx.lineTo(X(lx), H - padB); ctx.stroke();
  ctx.fillStyle = '#74c0fc';
  ctx.beginPath();
  ctx.arc(X(lx), Y(83 + SAG * (1 - ((lx - 640) / 640) ** 2) - deflM(liveXm()) * 0.5 * EXAG), 5, 0, Math.PI * 2);
  ctx.fill();
  /* 轴与图例文字 */
  ctx.fillStyle = cTxt;
  ctx.fillText(L('1280 m 主跨', '1,280 m span'), padL, H - 6);
  ctx.fillText('0', W - padR + 4, Y2(0) + 4);
  ctx.fillText('70m×120', W - padR + 4, Y2(70) + 4);
  ctx.fillText(L('挠度', 'defl.'), W - padR + 4, Y2(35) + 4);
  ctx.fillStyle = 'rgba(116,192,252,.9)';
  ctx.fillText(L('— 当前主缆', '— live cable'), padL + 150, padT + 12);
  ctx.fillStyle = 'rgba(159,176,195,.9)';
  ctx.fillText(L('-- 恒载抛物线', '-- dead parabola'), padL + 150, padT + 28);
  ctx.fillStyle = 'rgba(255,169,77,.95)';
  ctx.fillText(L('— 桥面挠度', '— deck deflection'), padL + 150, padT + 44);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elLoad = document.getElementById('sLoad'), elLoadVal = document.getElementById('sLoadVal');
const elPos = document.getElementById('sPos'), elPosVal = document.getElementById('sPosVal');
const stHang = document.getElementById('stHang'), stTop = document.getElementById('stTop'),
  stBase = document.getElementById('stBase'), stAnchor = document.getElementById('stAnchor'),
  stDefl = document.getElementById('stDefl'), stSF = document.getElementById('stSF');
const formulaEl = document.getElementById('formula');
const btnTruck = document.getElementById('btnTruck'), btnRes = document.getElementById('btnRes');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elLoad.value = P; elLoadVal.textContent = `${P.toFixed(0)} kN`;
  elPos.value = clamp(liveXm() + 640, 0, 1280); elPosVal.textContent = `${(liveXm() + 640).toFixed(0)} m`;
}
function syncBtns() {
  btnTruck.classList.toggle('on', truckOn);
  btnRes.classList.toggle('on', resOn);
}
function updateStats() {
  const s = statsNow();
  stHang.innerHTML = `${s.Th.toFixed(2)}<small> MN</small>`;
  stHang.className = 'v' + (P > 1200 ? ' warn' : '');
  stTop.innerHTML = `${s.V.toFixed(0)}<small> MN</small>`;
  stBase.innerHTML = `${s.N.toFixed(0)}<small> MN</small>`;
  stAnchor.innerHTML = `${s.Hc.toFixed(1)}<small> MN</small>`;
  stDefl.innerHTML = `${Math.abs(s.dMid).toFixed(2)}<small> m</small>`;
  stDefl.className = 'v' + (Math.abs(s.dMid) > 0.7 ? ' bad' : Math.abs(s.dMid) > 0.3 ? ' warn' : '');
  stSF.innerHTML = s.sf.toFixed(2);
  stSF.className = 'v' + (s.sf > 3.5 ? ' ok' : s.sf > 2.5 ? ' warn' : ' bad');
}
function updateFormula() {
  const s = statsNow();
  formulaEl.innerHTML = L(
    `<b>抛物线近似:H = wL²/(8f)</b> = 260×1280²/(8×144) ≈ 370 MN(两缆合计,w≈260 kN/m 为恒载约值);每缆 H ≈ ${s.Hc.toFixed(0)} MN ≈ ${(s.Hc * 102).toFixed(0)} t 拉力<br>` +
    `<b>塔顶缆力最大:T = H/cosθ</b>,tanθ = 4f/L = 0.45 → T ≈ ${s.Tmax.toFixed(0)} MN/缆;吊索最大张力 ${s.Th.toFixed(2)} MN(恒载 ≈ 1.98 MN/根,间距 15.24 m)<br>` +
    `<b>金门主缆实桥数字</b>:Ø0.92 m · 27,572 根钢丝 · 钢积 ≈ 0.54 m² · 破断力 ≈ 840 MN/缆 → <b>安全系数 ${s.sf.toFixed(1)}</b><br>` +
    `<b>塔与锚碇分工</b>:塔顶竖向力 ≈ ${s.V.toFixed(0)} MN/塔(约 4.3 万 t),塔底轴力 ≈ ${s.N.toFixed(0)} MN(含塔自重 2.2 万 t);锚碇抗水平拉 ${s.Hc.toFixed(0)} MN/缆 × 2 缆,靠 6 万吨混凝土自重顶住<br>` +
    `<b>挠度 δ = PL³/(48EI)</b>:P = ${P.toFixed(0)} kN @ x = ${(liveXm() + 640).toFixed(0)} m → 跨中 δ ≈ ${Math.abs(s.dMid).toFixed(2)} m(画面放大 ${EXAG}×);金门满布活载设计限值 ≈ 3.3 m`,
    `<b>Parabola: H = wL²/(8f)</b> = 260×1280²/(8×144) ≈ 370 MN both cables (w ≈ 260 kN/m dead load, approx.); per cable H ≈ ${s.Hc.toFixed(0)} MN ≈ ${(s.Hc * 102).toFixed(0)} t of pull<br>` +
    `<b>Max cable tension at towers: T = H/cosθ</b>, tanθ = 4f/L = 0.45 → T ≈ ${s.Tmax.toFixed(0)} MN/cable; max hanger ${s.Th.toFixed(2)} MN (dead ≈ 1.98 MN each at 15.24 m spacing)<br>` +
    `<b>Golden Gate cable</b>: 0.92 m across · 27,572 wires · steel area ≈ 0.54 m² · breaking ≈ 840 MN/cable → <b>safety factor ${s.sf.toFixed(1)}</b><br>` +
    `<b>Towers vs anchors</b>: tower-top vertical ≈ ${s.V.toFixed(0)} MN (~43,000 t), base ≈ ${s.N.toFixed(0)} MN (incl. 22,000-t tower); anchors resist ${s.Hc.toFixed(0)} MN/cable × 2 with 60,000 t of concrete<br>` +
    `<b>δ = PL³/(48EI)</b>: P = ${P.toFixed(0)} kN @ x = ${(liveXm() + 640).toFixed(0)} m → midspan δ ≈ ${Math.abs(s.dMid).toFixed(2)} m (shown ${EXAG}×); Golden Gate limit ≈ 3.3 m`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elLoad.addEventListener('input', () => { P = +elLoad.value; syncSliders(); updateFormula(); });
elPos.addEventListener('input', () => { liveA = +elPos.value; truckOn = false; pulseT = 5; syncSliders(); syncBtns(); updateFormula(); });
btnTruck.addEventListener('click', () => {
  truckOn = true; truckX = -1020; pulseT = 8;
  notify('货车过桥:看吊索逐根被拉亮,主缆微调,力沿两条路径回家',
    'truck crossing: hangers light up in turn, the cable adjusts, the load walks both routes');
  syncBtns();
});
btnRes.addEventListener('click', () => {
  resOn = !resOn;
  notify(resOn ? '共振激励开启:激振力对准固有频率,振幅逐周期放大' : '共振激励关闭:阻尼让振幅衰减',
    resOn ? 'resonance on: driving at the natural frequency grows the swing' : 'resonance off: damping decays the swing');
  syncBtns();
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglPath').addEventListener('change', e => { pathOn = e.target.checked; });
document.getElementById('tglDead').addEventListener('change', e => { deadOn = e.target.checked; deadArr.visible = deadOn; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
const OMG = 2 * Math.PI * 0.45, ZETA = 0.05, DST = 0.075;    // 演示频率/阻尼/静挠标定
function stepRes(dt) {
  if (resOn) qv += (OMG * OMG * (DST * Math.sin(OMG * simT) - q) - 2 * ZETA * OMG * qv) * dt;
  else qv += (-OMG * OMG * q - 2 * ZETA * OMG * qv * 3) * dt;
  q = clamp(q + qv * dt, -0.55, 0.9);
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    simT += dt;
    if (truckOn) { truckX += TRUCK_V * dt; if (truckX > 1020) { truckOn = false; truckGrp.visible = false; syncBtns(); } }
    stepRes(dt);
    if (pulseT > 0) pulseT -= dt;
  }
  /* 桥面系随挠度弯曲 */
  for (const rb of ribbons) updateRibbon(rb);
  truckGrp.visible = truckOn;
  truckGrp.position.set(truckX * m2u, DECK_Y + 0.08 + deflVis(truckX), 0.75);
  /* 主缆形状微调(仅在挠度变化时重建) */
  const ck = `${(deltaLive() + q).toFixed(4)}|${liveXm().toFixed(1)}`;
  if (ck !== cableKey) { cableKey = ck; rebuildCable(); }
  updateHangers();
  if (deadOn) updateDead();
  updateArrows();
  lblLoad.position.set(clamp(liveXm(), -900, 900) * m2u, DECK_Y + 1.05 + deflVis(clamp(liveXm(), -640, 640)), 0);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
rebuildCable();
updateDead();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
