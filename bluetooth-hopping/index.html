<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>蓝牙跳频 · 79 条小巷躲干扰</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="蓝牙跳频" data-en="Bluetooth Frequency Hopping">蓝牙跳频</h1>
  <div class="sub" data-zh="2.4 GHz 是拥挤走廊:Wi-Fi、微波炉、邻居的耳机全在里面;蓝牙把频段切成 79 条小巷,主从设备按同一串伪随机序列每 625 µs 换巷子说话——单个干扰最多毁一个时隙;被反复打脏的信道被 AFH 记入黑名单,跳频图样当场重排,绕着干扰源继续通话 · 拖动旋转 / 空格运行/暂停" data-en="2.4 GHz is a crowded corridor: Wi-Fi, the microwave, the neighbor’s earbuds all live there; Bluetooth slices it into 79 alleys, and master and slave hop every 625 µs on the same pseudo-random sequence — one interferer ruins at most one slot; channels that keep getting dirty get blacklisted by AFH and the hopping map rewires around Wi-Fi’s turf · drag to orbit / Space = run/pause">2.4 GHz 是拥挤走廊:Wi-Fi、微波炉、邻居的耳机全在里面;蓝牙把频段切成 79 条小巷,主从设备按同一串伪随机序列每 625 µs 换巷子说话——单个干扰最多毁一个时隙;被反复打脏的信道被 AFH 记入黑名单,跳频图样当场重排,绕着干扰源继续通话 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="当前信道" data-en="Channel">当前信道</span><span class="v" id="stCh">—</span>
  <span class="k" data-zh="跳速" data-en="Hop rate">跳速</span><span class="v" id="stHop">—</span>
  <span class="k" data-zh="误码率" data-en="Bit error">误码率</span><span class="v" id="stBer">—</span>
  <span class="k" data-zh="黑名单信道" data-en="Blacklisted">黑名单信道</span><span class="v" id="stBad">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bClean" data-zh="无干扰" data-en="Quiet band">无干扰</button>
    <button class="abtn" id="bWifi" data-zh="Wi-Fi 干扰" data-en="Wi-Fi nearby">Wi-Fi 干扰</button>
    <button class="abtn" id="bMicro" data-zh="微波炉干扰" data-en="Microwave on">微波炉干扰</button>
  </div>
  <div class="row">
    <label data-zh="跳速" data-en="Hop rate">跳速</label>
    <input id="sHop" type="range" min="400" max="1600" step="100" value="1600">
    <span class="val" id="sHopVal">1600 /s</span>
  </div>
  <div class="row">
    <label data-zh="发射功率" data-en="TX power">发射功率</label>
    <input id="sPower" type="range" min="0" max="100" step="5" value="50">
    <span class="val" id="sPowerVal">50 %</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglAfh" type="checkbox" checked> <span data-zh="自适应跳频" data-en="Adaptive AFH">自适应跳频</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../wifi/" data-zh="Wi-Fi" data-en="Wi-Fi">Wi-Fi</a>
    <a href="../cellular-network/" data-zh="蜂窝网络" data-en="Cellular Network">蜂窝网络</a>
    <a href="../ir-remote/" data-zh="红外遥控与载波编码" data-en="IR Remote">红外遥控与载波编码</a>
    <a href="../packet-switching/" data-zh="分组交换" data-en="Packet Switching">分组交换</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.05);keyL.position.set(6,10,8);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-8,5,-6);scene.add(fillL);
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(24,64),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
/* ── 场景:2.4 GHz 频段走廊,79 条信道,跳频波束与干扰黑名单 ── */
const NCH=79,SP=0.082,X0=(NCH-1)/2;
const chM=new THREE.MeshStandardMaterial({color:0x39445a,roughness:0.6});
const chHotM=new THREE.MeshStandardMaterial({color:0xffb35c,emissive:0xd9822b,emissiveIntensity:0.9});
const chBadM=new THREE.MeshStandardMaterial({color:0x7a2a2a,roughness:0.5,emissive:0xff4444,emissiveIntensity:0.25});
const cols=[];
const caps=[];
const colG=new THREE.BoxGeometry(0.075,0.62,0.075);
const capG=new THREE.BoxGeometry(0.085,0.1,0.085);
for(let i=0;i<NCH;i++){
  const m=new THREE.Mesh(colG,chM);
  m.position.set((i-X0)*SP,0.75,0);scene.add(m);cols.push(m);
  const c=new THREE.Mesh(capG,chBadM.clone());
  c.position.set((i-X0)*SP,1.12,0);c.visible=false;scene.add(c);caps.push(c);
}
const railM=new THREE.MeshStandardMaterial({color:0x2c313b,roughness:0.8});
const rail=new THREE.Mesh(new THREE.BoxGeometry(NCH*SP+0.4,0.05,0.42),railM);
rail.position.y=0.44;scene.add(rail);
const rail2=rail.clone();rail2.position.y=1.05;scene.add(rail2);
/* 主从设备 */
const devM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.45,metalness:0.4});
const phone=new THREE.Mesh(new THREE.BoxGeometry(0.5,1.0,0.08),devM);
phone.position.set(-(X0*SP+1.15),1.35,0);scene.add(phone);
const bud=new THREE.Mesh(new THREE.CapsuleGeometry(0.18,0.3,6,14),devM);
bud.position.set(X0*SP+1.15,1.35,0);scene.add(bud);
const ledM=new THREE.MeshStandardMaterial({color:0x8ce99a,emissive:0x51cf66,emissiveIntensity:1.4});
const pled=new THREE.Mesh(new THREE.SphereGeometry(0.045,10,10),ledM.clone());
pled.position.set(-(X0*SP+1.15),1.72,0.06);scene.add(pled);
const bled=new THREE.Mesh(new THREE.SphereGeometry(0.045,10,10),ledM.clone());
bled.position.set(X0*SP+1.15,1.72,0.1);scene.add(bled);
/* 干扰带 */
const ifM=new THREE.MeshStandardMaterial({color:0xff6b6b,transparent:true,opacity:0.16,
  roughness:1,depthWrite:false});
const ifBox=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,0.5),ifM);
ifBox.position.y=0.8;ifBox.visible=false;scene.add(ifBox);
const ifEdge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1.5,0.5)),
  new THREE.LineBasicMaterial({color:0xff8787,transparent:true,opacity:0.5}));
ifEdge.position.y=0.8;ifEdge.visible=false;scene.add(ifEdge);
/* 数据包 */
const pkM=new THREE.MeshStandardMaterial({color:0x8ce99a,emissive:0x51cf66,emissiveIntensity:0.8});
const pkt=new THREE.Mesh(new THREE.SphereGeometry(0.085,12,12),pkM);
pkt.visible=false;scene.add(pkt);
const trailM=new THREE.LineBasicMaterial({color:0x51cf66,transparent:true,opacity:0.55});
const trailGeo=new THREE.BufferGeometry();
trailGeo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(3*24),3));
const trail=new THREE.Line(trailGeo,trailM);trail.visible=false;scene.add(trail);

/* 状态 */
let mode='clean',hopRate=1600,txPower=50,afh=true,playing=true,labelsOn=true,slowMo=false;
let seq=[],seqPos=0,blackset=new Set(),pktT=99,pktDur=0.5,pkOk=true,pkCh=0;
let fails=[],total=0,failN=0,microPhase=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 伪随机跳频序列:LFSR 折返全带 */
(function(){let s=0x2f;for(let i=0;i<400;i++){s=(s*1103515245+12345)>>>0;seq.push(s%NCH);}})();
function interfered(ch){
  if(mode==='wifi')return ch>=26&&ch<=58;
  if(mode==='micro'){const on=Math.sin(microPhase)>-0.25;return on;}
  return false;
}
function rebuildBlacklist(){
  blackset.clear();
  if(!afh)return;
  for(let c=0;c<NCH;c++)if(interfered(c))blackset.add(c);
}
function nextCh(){
  for(let k=0;k<60;k++){
    const c=seq[seqPos%seq.length];seqPos++;
    if(afh&&blackset.has(c))continue;
    return c;
  }
  return seq[seqPos++%seq.length];
}

const lblPh=addLabel(()=>L('主设备(手机)','Master (phone)'),phone.position.clone().add(new THREE.Vector3(0,0.75,0)),'b');
const lblBud=addLabel(()=>L('从设备(耳机)','Slave (earbud)'),bud.position.clone().add(new THREE.Vector3(0,0.55,0)),'g');
const lblIf=addLabel(()=>L('Wi-Fi 占用 20 MHz ≈ 1/3 频段','Wi-Fi takes 20 MHz — a third of the band'),
  new THREE.Vector3(0,2.15,0),'r',()=>mode==='wifi');
const lblIf2=addLabel(()=>L('微波炉:全频段脉冲扫射','Microwave: pulsing across the whole band'),
  new THREE.Vector3(0,2.15,0),'r',()=>mode==='micro');
const lblAfh=addLabel(()=>L(`AFH 黑名单:${blackset.size} 条信道被拉黑`,`AFH blacklist: ${blackset.size} channels benched`),
  new THREE.Vector3(0,1.55,0),'y',()=>afh&&blackset.size>0);

function setMode(m){mode=m;
  document.getElementById('bClean').classList.toggle('on',m==='clean');
  document.getElementById('bWifi').classList.toggle('on',m==='wifi');
  document.getElementById('bMicro').classList.toggle('on',m==='micro');
  rebuildBlacklist();
  ifBox.visible=(m!=='clean');ifEdge.visible=ifBox.visible;
  if(m==='wifi'){ifBox.scale.set(33*SP,1,1);ifBox.position.x=(42-X0)*SP;
    ifEdge.scale.copy(ifBox.scale);ifEdge.position.x=ifBox.position.x;}
  updateStats();}
function setHop(v){hopRate=clamp(v,400,1600);
  document.getElementById('sHop').value=hopRate;
  document.getElementById('sHopVal').textContent=hopRate.toFixed(0)+' /s';updateStats();}
function setPower(v){txPower=clamp(v,0,100);
  document.getElementById('sPower').value=txPower;
  document.getElementById('sPowerVal').textContent=txPower.toFixed(0)+' %';updateStats();}

const STEPS=[
 {zh:'<b>干净频段</b>:79 条小巷随意跳,包包都绿',en:'<b>A quiet band</b>: 79 free alleys, every packet lands green',
  act(){setMode('clean');setHop(1600);setPower(50);}},
 {zh:'<b>Wi-Fi 搬进隔壁</b>:20 MHz 占掉 1/3,跳进去的包当场变红',en:'<b>Wi-Fi moves in</b>: 20 MHz eats a third of the band — packets that hop in die red',
  act(){setMode('wifi');}},
 {zh:'<b>跳速即抗扰</b>:1600 /s 换巷,单个干扰最多毁一个 625 µs 时隙',en:'<b>Speed is armor</b>: 1600 hops/s — one interferer ruins at most one 625 µs slot',
  act(){setHop(1600);}},
 {zh:'<b>AFH 自适应跳频</b>:反复吃亏的信道进黑名单,图样当场重排',en:'<b>Adaptive hopping</b>: channels that keep getting dirty get blacklisted, the map rewires',
  act(){setMode('wifi');setHop(800);}},
 {zh:'<b>微波炉扫射</b>:全频段脉冲干扰,AFH 只能减伤不能免疫',en:'<b>Microwave blast</b>: pulsing wideband noise — AFH softens it, can\u2019t cure it',
  act(){setMode('micro');setHop(1600);}},
 {zh:'<b>功率太低</b>:信号弱到连干净信道都随机丢包',en:'<b>Too little power</b>: even clean channels drop packets at random',
  act(){setMode('clean');setPower(12);setHop(800);}},
];

function updateStats(){
  const ber=failN>0?failN/Math.max(total,1):0;
  document.getElementById('stCh').textContent=pkCh.toFixed(0);
  document.getElementById('stHop').innerHTML=hopRate.toFixed(0)+'<small> /s</small>';
  const bv=document.getElementById('stBer');
  bv.innerHTML=(ber*100).toFixed(0)+'<small> %</small>';
  bv.className='v '+(ber>0.15?'warn':ber>0.02?'':'ok');
  const dv=document.getElementById('stBad');
  dv.textContent=blackset.size.toFixed(0);
  dv.className='v '+(blackset.size>40?'warn':'');
}
document.getElementById('bClean').addEventListener('click',()=>setMode('clean'));
document.getElementById('bWifi').addEventListener('click',()=>setMode('wifi'));
document.getElementById('bMicro').addEventListener('click',()=>setMode('micro'));
document.getElementById('sHop').addEventListener('input',e=>setHop(+e.target.value));
document.getElementById('sPower').addEventListener('input',e=>setPower(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglAfh').addEventListener('change',e=>{afh=e.target.checked;rebuildBlacklist();updateStats();});

camera.position.set(-0.6,4.8,12.2);
controls.target.set(-1.6,0.85,0);

const m4=new THREE.Matrix4(),tmpC=new THREE.Color();
const ARC_H=3.1;
function tick(dts,dt){
  microPhase+=dts*5.2;
  if(mode==='micro'){ifBox.material.opacity=0.10+0.14*clamp(Math.sin(microPhase)+0.4,0,1);}
  cols.forEach((m,i)=>{
    const hot=i===pkCh&&pkt.visible;
    m.material=hot?chHotM:(blackset.has(i)?chBadM:chM);
    caps[i].visible=blackset.has(i);
  });
  /* 数据包生命周期 */
  pktT+=dts*(slowMo?0.3:1);
  if(pktT>=pktDur){
    pktT=0;pktDur=clamp(2.4/(hopRate/100),0.18,1.2);
    pkCh=nextCh();
    const weak=txPower<20&&Math.random()<(20-txPower)/22;
    pkOk=!(interfered(pkCh)&&!(afh&&mode==='micro'&&Math.sin(microPhase)<-0.55))&&!weak;
    if(mode==='micro'&&afh&&Math.sin(microPhase)>-0.25)pkOk=Math.random()<0.75;
    if(afh&&interfered(pkCh))pkOk=mode==='micro'?Math.random()<0.75:true;
    total++;if(!pkOk)failN++;
    if(total>60){total=1;failN=pkOk?0:1;}
    pkt.visible=true;trail.visible=true;
    pkM.color.setHex(pkOk?0x8ce99a:0xff6b6b);
    pkM.emissive.setHex(pkOk?0x51cf66:0xff4444);
    trailM.color.setHex(pkOk?0x51cf66:0xff6b6b);
    pled.material.emissiveIntensity=1.4;bled.material.emissiveIntensity=1.4;
  }
  const t=clamp(pktT/pktDur,0,1);
  const x0=phone.position.x,x1=bud.position.x;
  const xch=(pkCh-X0)*SP;
  const px=x0+(x1-x0)*t;
  const py=1.35+Math.sin(t*Math.PI)*(ARC_H-1.35)*(0.45+0.55*Math.abs(Math.cos(t*Math.PI*0.5)))+Math.sin(t*Math.PI)*0.4;
  const pz=0;
  pkt.position.set(px,py,pz);
  const posA=trail.geometry.attributes.position;
  for(let i=23;i>0;i--){posA.setXYZ(i,posA.getX(i-1),posA.getY(i-1),posA.getZ(i-1));}
  posA.setXYZ(0,px,py,pz);posA.needsUpdate=true;
  if(t>0.96){pkt.visible=false;trail.visible=false;
    pled.material.emissiveIntensity=0.25;bled.material.emissiveIntensity=0.25;}
  frame.acc2=(frame.acc2||0)+dt;
  if(frame.acc2>0.5){frame.acc2=0;updateStats();}
}
function themeExtra(dark){}

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();updateStats();}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  themeExtra(dark);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  tick(dts,dt);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
});
</script>
