  @media(max-width:900px){#stats{display:none}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 生物学注脚（真实量级，时间压缩 ×60：1 模拟秒 ≈ 1 真实分钟）：
   - 微管：13 根原丝组成的管，外径 ~25 nm；α/β-tubulin 二聚体 ~8 nm。
   - GTP-tubulin 只在正端加上（v+ ≈ 1–2 µm/min @10–20 µM，约正比于浓度）；
     埋进管壁后 GTP 水解为 GDP-tubulin（弯曲、易剥落）。末端保留 GTP 帽（~几十~几百个二聚体）
     就继续生长；帽丢失 → 灾变：GDP 管壁像香蕉皮一样剥落，解聚 ~10–15 µm/min（快约 10 倍）。
   - 塌缩途中偶尔重新加帽 = 拯救（rescue）。浓度越高→灾变越少、拯救越多。
   - 纺锤体正是靠这套“随机动态试错”搜索并捕获染色体（抓住后稳定化）。
   - 紫杉醇（Taxol）锁死管壁抑制解聚→纺锤体无法正常运转→分裂卡死（化疗）；
     秋水仙碱结合游离二聚体使其无法聚合→微管全面解体。 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
const Q=new URLSearchParams(location.search);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0a0d12,22,60);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(0,4.5,17);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=45;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14181e,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,0.9);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,4,-6);scene.add(fill);

/* ---- 材质 ---- */
const gdpM=new THREE.MeshStandardMaterial({color:0x4a6f8f,roughness:0.45,emissive:0x1c3a52,emissiveIntensity:0.5});
const gtpM=new THREE.MeshStandardMaterial({color:0xb2f2bb,emissive:0x40c057,emissiveIntensity:1.1,roughness:0.3});
const kintM=new THREE.MeshStandardMaterial({color:0xda77f2,emissive:0xae3ec9,emissiveIntensity:1.2,roughness:0.3});
const centroM=new THREE.MeshStandardMaterial({color:0x91a7b8,roughness:0.4,metalness:0.6});
const chromM=new THREE.MeshStandardMaterial({color:0xffa8a8,emissive:0xc92a2a,emissiveIntensity:0.35,roughness:0.4});
const peelM=new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.55,roughness:0.4,side:THREE.DoubleSide});
const tipGM=new THREE.MeshStandardMaterial({color:0xb2f2bb,emissive:0x40c057,emissiveIntensity:1.4});
const tipRM=new THREE.MeshStandardMaterial({color:0xff8787,emissive:0xc92a2a,emissiveIntensity:1.4});

/* ---- 中心体（两根中心粒垂直相扣） ---- */
const centro=new THREE.Group();centro.position.set(0,0.7,0);scene.add(centro);
const c1=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,1.3,16),centroM);
const c2=c1.clone();c2.rotation.x=Math.PI/2;
centro.add(c1,c2);

/* ---- 微管参数 ---- */
/* 比例：1 世界单位 = 2 µm；时间压缩 ×60（1 模拟秒 = 1 分钟） */
const SEGL=0.5, MAX_SEG=26, N_MT=6;
const ANGLES=[18,48,80,102,132,160].map(a=>a*Math.PI/180);
const gdpGeo=new THREE.CylinderGeometry(0.085,0.085,SEGL*0.94,8);
const peelGeo=new THREE.ConeGeometry(0.1,0.55,4,1,true);
const mts=[];

for(let i=0;i<N_MT;i++){
  const grp=new THREE.Group();grp.position.copy(centro.position);scene.add(grp);
  const segs=[];
  for(let j=0;j<MAX_SEG;j++){
    const m=new THREE.Mesh(gdpGeo,gdpM);
    m.visible=false;grp.add(m);segs.push(m);
  }
  /* 剥落“香蕉皮”：5 片锥瓣在正端散开 */
  const peel=new THREE.Group();scene.add(peel);
  const petals=[];
  for(let k=0;k<5;k++){
    const p=new THREE.Mesh(peelGeo,peelM);
    const a=k/5*Math.PI*2;
    p.position.set(Math.cos(a)*0.12,Math.sin(a)*0.12,0);
    p.rotation.y=Math.PI/2;p.rotation.z=-0.9;
    peel.add(p);petals.push(p);
  }
  peel.visible=false;
  const tip=new THREE.Mesh(new THREE.SphereGeometry(0.12,10,8),tipGM);scene.add(tip);
  mts.push({angle:ANGLES[i],dir:new THREE.Vector3(Math.cos(ANGLES[i]),Math.sin(ANGLES[i]),0),
    grp,segs,peel,petals,tip,
    len:1+Math.random()*3,state:1,captured:false});
}
/* 重新对齐微管朝向（搜索时角度抖动后调用） */
const YAXIS=new THREE.Vector3(0,1,0);
function retarget(m){
  m.dir.set(Math.cos(m.angle),Math.sin(m.angle),0);
  m.peel.rotation.z=m.angle-Math.PI/2;
}
/* 拯救/重生时微微换角度 → “随机搜索”的空间覆盖 */
function newSearch(m){
  m.angle+=(Math.random()-0.5)*0.5;
  retarget(m);
}

/* ---- 染色体（X 形，摆在某几根微管的搜索路径上，等着被捕获） ---- */
const chroms=[];
const chromPts=[new THREE.Vector3(-1.66,7.83,0),new THREE.Vector3(8.56,2.78,0)];
for(const cp of chromPts){
  const g=new THREE.Group();g.position.copy(cp);g.rotation.z=(Math.random()-0.5)*0.8;
  const arm=new THREE.CylinderGeometry(0.16,0.16,2.2,8);
  const a1=new THREE.Mesh(arm,chromM);a1.rotation.z=0.45;
  const a2=new THREE.Mesh(arm,chromM);a2.rotation.z=-0.45;
  const kt=new THREE.Mesh(new THREE.SphereGeometry(0.2,10,8),kintM); // 着丝点
  g.add(a1,a2,kt);scene.add(g);
  chroms.push({grp:g,captured:false,kt});
}

/* ---- 状态 ---- */
let playing=true,conc=14,simT=0,catCount=0;
let taxol=false,colch=false;
let labelsOn=!Q.has('labels')||Q.get('labels')!=='0';
const SPEED=1; // 时间倍率已在注释中固定 ×60

/* 动力学参数（每模拟秒的概率/速度，真实换算见页首注释） */
function vGrow(){return 0.06*conc;}          // µm/min = 0.12·C → 单位/模拟秒
function vShrink(){return 6.0;}              // ~12 µm/min
function pCat(){return taxol?0:0.10*Math.pow(12/Math.max(conc,1),1.5);} // 浓度高→灾变少
function pResc(){return colch?0:0.02+conc*0.003;}                        // 浓度高→易拯救

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('中心体（γ-TuRC 锚定负端）','Centrosome (γ-TuRC anchors −ends)'),new THREE.Vector3(0,-0.4,1.2),'b');
addLabel(()=>L('GTP 帽（亮绿）','GTP cap (bright)'),new THREE.Vector3(4.4,6.4,0),'g',
  ()=>mts.some(m=>m.state===1&&!m.captured));
addLabel(()=>L('灾变！GDP 管壁剥落','Catastrophe! GDP wall peels'),new THREE.Vector3(-4.8,6.2,0),'r',
  ()=>mts.some(m=>m.state===-1));
addLabel(()=>L('染色体（等着被捕获）','Chromosome (waiting)'),new THREE.Vector3(-1.66,9.1,0),'r',()=>!chroms[0].captured);
addLabel(()=>L('动点捕获：微管被稳住','Kinetochore capture: MT stabilized'),new THREE.Vector3(-1.66,9.8,0),'o',()=>chroms[0].captured);
addLabel(()=>L('染色体 2','Chromosome 2'),new THREE.Vector3(8.56,4.0,0),'r',()=>!chroms[1].captured);
addLabel(()=>L('搜索-捕获完成，纺锤体就位','Search-capture done, spindle ready'),new THREE.Vector3(0,10.8,0),'g',
  ()=>chroms.every(c=>c.captured));
addLabel(()=>L('紫杉醇：动力学卡死→有丝分裂停摆','Taxol: dynamics frozen → mitosis stalls'),new THREE.Vector3(0,11.8,0),'o',()=>taxol);
addLabel(()=>L('秋水仙碱：二聚体被扣，微管解体','Colchicine: dimers sequestered, MTs dissolve'),new THREE.Vector3(0,11.8,0),'r',()=>colch);

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0a0d12:0xe9e4dc);
  scene.fog.color.setHex(dark?0x0a0d12:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'GTP 帽：正端不断加 GTP-tubulin，帽在就长',en:'GTP cap: GTP-tubulin adds at the +end; while the cap holds, it grows',
   go(){drugs(false,false);conc=14;syncUI();}},
  {zh:'GTP 水解：埋进管壁的二聚体变成 GDP，埋下隐患',en:'GTP hydrolysis: buried dimers become GDP — a loaded spring',
   go(){drugs(false,false);conc=8;syncUI();}},
  {zh:'灾变：帽一丢，GDP 管壁像香蕉皮一样剥落塌缩',en:'Catastrophe: cap lost, GDP wall peels away like a banana',
   go(){drugs(false,false);conc=6;syncUI();mts.forEach(m=>{m.state=-1;});}},
  {zh:'拯救：塌缩途中偶尔重新加帽，掉头再长',en:'Rescue: occasionally a new cap forms mid-collapse — grow again',
   go(){drugs(false,false);conc=18;syncUI();mts.forEach(m=>{m.state=-1;m.len=Math.max(2,m.len);});}},
  {zh:'搜索-捕获：纺锤体靠随机试错找到染色体着丝点',en:'Search-and-capture: the spindle finds kinetochores by trial and error',
   go(){drugs(false,false);conc=20;syncUI();mts.forEach(m=>{m.captured=false;m.state=1;});
        chroms.forEach(c=>c.captured=false);}},
  {zh:'药物：紫杉醇锁死微管卡停分裂；秋水仙碱拆散全部微管（化疗原理）',en:'Drugs: taxol freezes dynamics (mitosis stalls); colchicine dissolves MTs — chemo',
   go(){taxol=true;colch=false;syncUI();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.go();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 按钮/滑块 ---- */
function drugs(t,c){taxol=t;colch=c;syncUI();}
function syncUI(){
  document.getElementById('btnTaxol').classList.toggle('on',taxol);
  document.getElementById('btnColch').classList.toggle('on',colch);
  document.getElementById('sConcVal').textContent=conc+' µM';
}
document.getElementById('btnTaxol').addEventListener('click',()=>{taxol=!taxol;if(taxol)colch=false;syncUI();});
document.getElementById('btnColch').addEventListener('click',()=>{colch=!colch;if(colch)taxol=false;syncUI();});
document.getElementById('btnClear').addEventListener('click',()=>drugs(false,false));
document.getElementById('btnReset').addEventListener('click',()=>{
  drugs(false,false);catCount=0;
  mts.forEach(m=>{m.len=1+Math.random()*3;m.state=1;m.captured=false;});
  chroms.forEach(c=>c.captured=false);
});
document.getElementById('sConc').addEventListener('input',e=>{conc=+e.target.value;syncUI();});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 统计 ---- */
function updateStats(){
  document.getElementById('stConc').innerHTML=(colch?0:conc)+'<small> µM</small>';
  const g=mts.filter(m=>m.state===1).length,s=mts.filter(m=>m.state===-1).length;
  document.getElementById('stCounts').textContent=g+' / '+s;
  const freq=simT>3?catCount/(simT/60):0;
  document.getElementById('stCat').innerHTML=freq.toFixed(1)+'<small> /min</small>';
  document.getElementById('stCap').textContent=chroms.filter(c=>c.captured).length+' / 2';
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05)*SPEED;
  if(playing){
    simT+=dt;
    const vG=colch?0:vGrow(),vS=vShrink();
    for(const m of mts){
      if(m.captured){/* 捕获后：着丝点微管被稳定，退出动态循环 */}
      else if(colch){
        // 秋水仙碱扣住游离二聚体：只拆不建
        m.state=-1;m.len=Math.max(0.5,m.len-vS*dt);
      }
      else if(taxol){
        // 紫杉醇：抑制解聚，灾变消失，微管只慢慢长
        m.state=1;m.len=Math.min(MAX_SEG,m.len+vG*0.3*dt);
      }else if(m.state===1){
        m.len+=vG*dt;
        if(m.len>=MAX_SEG){m.len=MAX_SEG;m.state=-1;catCount++;}
        else if(Math.random()<pCat()*dt){m.state=-1;catCount++;}
      }else{
        m.len-=vS*dt;
        if(m.len<=0.5){m.len=0.5;if(Math.random()<pResc()*dt*8){m.state=1;newSearch(m);}}
        else if(Math.random()<pResc()*dt){m.state=1;newSearch(m);}
      }
      /* 搜索-捕获判定 */
      if(!m.captured&&m.state===1){
        const tipPos=m.dir.clone().multiplyScalar(m.len*SEGL).add(centro.position);
        for(const c of chroms){
          if(!c.captured&&tipPos.distanceTo(c.grp.position)<1.05){
            m.captured=true;c.captured=true;m.state=0;
          }
        }
      }
    }
  }
  /* 视觉刷新（含暂停帧） */
  for(const m of mts){
    const n=Math.floor(m.len);
    const q=new THREE.Quaternion().setFromUnitVectors(YAXIS,m.dir);
    for(let j=0;j<MAX_SEG;j++){
      const seg=m.segs[j];
      seg.visible=j<n;
      if(j<n){
        seg.position.copy(m.dir).multiplyScalar((j+0.5)*SEGL);
        seg.quaternion.copy(q);
        const inCap=m.state===1&&(n-j)<=3;
        seg.material=m.captured?kintM:(inCap?gtpM:gdpM);
      }
    }
    const tipPos=m.dir.clone().multiplyScalar(m.len*SEGL).add(centro.position);
    m.tip.position.copy(tipPos);
    m.tip.material=m.captured?kintM:(m.state===1?tipGM:tipRM);
    m.peel.visible=m.state===-1&&m.len>1.2&&!m.captured;
    if(m.peel.visible){
      m.peel.rotation.z=m.angle-Math.PI/2;
      m.peel.position.copy(tipPos);
      const wob=Math.sin(simT*9+m.dir.x*7)*0.25;
      m.petals.forEach((p,k)=>{
        const a=k/5*Math.PI*2+wob;
        p.position.set(Math.cos(a)*0.14,Math.sin(a)*0.14,0);
        p.rotation.z=-0.9+wob;
        p.scale.setScalar(0.9+0.35*Math.sin(simT*12+k));
      });
    }
    m.tip.visible=!taxol||m.state!==0;
  }
  chroms.forEach((c,i)=>{
    c.grp.rotation.z+=Math.sin(simT*0.8+i*2)*0.0005;
    c.kt.material=kintM;
    c.grp.scale.setScalar(c.captured?1.06:1);
  });
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

/* ---- URL 参数与启动 ---- */
if(Q.get('pause')==='1'){playing=false;}
document.getElementById('tglLabels').checked=labelsOn;
syncUI();
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSteps();start();
</script>
</body>
</html>
