<!DOCTYPE html>

<style>

  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);

  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  :root[data-theme="light"] .lbl { text-shadow: none; }

  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#862e9c; }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool); color: var(--text3);
    font: inherit; font-size: 12.5px; font-weight: 600; min-width: 40px; height: 32px; padding: 0 12px;
    border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; text-decoration: none; backdrop-filter: blur(6px); transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 14px 16px 12px; backdrop-filter: blur(6px); box-shadow: var(--shadow);
    max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }

  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2d4; border-color: rgba(255,107,150,.7); }
  .chip.b { color: #ecd0fa; border-color: rgba(218,119,242,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c2255c; } :root[data-theme="light"] .chip.b { color:#862e9c; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%; background: var(--hover);
    color: var(--text2); border: 1px solid var(--tool-border); border-radius: 9px; padding: 7px 10px;
    font-size: 12.5px; font-weight: 600; transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(218,119,242,.6); background: rgba(218,119,242,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(156,54,181,.55); background: rgba(156,54,181,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(218,119,242,.10); border-color: rgba(218,119,242,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(156,54,181,.08); border-color: rgba(156,54,181,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(40,20,60,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ecd0fa; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center; cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="昆虫变态发育 · 两套身体一套基因" data-en="Insect Metamorphosis · Two Bodies, One Genome">昆虫变态发育 · 两套身体一套基因</h1>
  <div class="sub" data-zh="几丁质外骨骼不能渐长,只能换壳:脑 PTTH 命令前胸腺分泌蜕皮素 20E——它决定「何时蜕」;咽侧体分泌的保幼激素 JH 决定「变成谁」:峰来时 JH 高就还是幼虫,JH 归零才化蛹,蛹内 14 天旧组织溶解、成虫盘长成翅足触角,约 45% 干物质被拆解回收,最后一峰羽化成虫;成虫前胸腺退化,永不再蜕皮。拉动 JH 滑块,亲手把一只毛虫钉在幼虫态,或直接推向化蛹 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="A chitinous exoskeleton cannot grow gradually — it must be shed. Brain PTTH commands the prothoracic gland to release ecdysone 20E, deciding when to molt; juvenile hormone JH from the corpora allata decides what you become: a high JH peak re-makes a larva, zero JH makes a pupa. Inside the pupa, old tissue dissolves as imaginal discs build wings and legs, ~45% of dry mass is recycled, and the final peak yields the adult — whose prothoracic gland has degenerated, so it never molts again. Drag the JH slider to pin a caterpillar in larval form, or push it into metamorphosis · 3D interactive demo · drag to orbit · Space = run/pause">昆虫变态发育 · 两套身体一套基因</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="发育阶段" data-en="Stage">发育阶段</span><span class="v" id="stStage">—</span>
  <span class="k" data-zh="龄期" data-en="Instar">龄期</span><span class="v" id="stInstar">—</span>
  <span class="k" data-zh="体重" data-en="Mass">体重</span><span class="v" id="stMass">—</span>
  <span class="k" data-zh="蜕皮素 20E" data-en="Ecdysone 20E">蜕皮素 20E</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="保幼激素 JH" data-en="Juvenile hormone">保幼激素 JH</span><span class="v" id="stJH">—</span>
  <span class="k" data-zh="距下次蜕皮" data-en="Next molt">距下次蜕皮</span><span class="v" id="stNext">—</span>
</div>

<div id="plot">
  <h3 data-zh="内分泌谱:蜕皮素周期尖峰(紫)· JH 阶梯(绿)· 体重阶梯(琥珀),动点=当前时刻" data-en="Endocrine record: ecdysone spikes (violet) · JH steps (green) · mass staircase (amber); the dot marks now">内分泌谱:蜕皮素周期尖峰(紫)· JH 阶梯(绿)· 体重阶梯(琥珀),动点=当前时刻</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="橙:蜕皮素 20E(何时蜕)" data-en="orange: ecdysone 20E (when to molt)">橙:蜕皮素 20E(何时蜕)</span>
    <span class="chip.g" data-zh="绿:保幼激素 JH(变成谁)" data-en="green: juvenile hormone (what to become)">绿:保幼激素 JH(变成谁)</span>
    <span class="chip.r" data-zh="红:蛹内溶解与重建" data-en="red: pupal demolition & rebuild">红:蛹内溶解与重建</span>
    <span class="chip.b" data-zh="紫:成虫盘与新翅" data-en="violet: imaginal discs & new wings">紫:成虫盘与新翅</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnMolt" data-zh="触发蜕皮(注入 20E 峰)" data-en="Trigger molt (inject 20E peak)">触发蜕皮(注入 20E 峰)</button>
    <button class="abtn" id="btnReset" data-zh="重置生命周期" data-en="Reset life cycle">重置生命周期</button>
  </div>
  <div class="row"><label data-zh="下次蜕皮的 JH" data-en="JH at next molt">下次蜕皮的 JH</label><input id="sJH" type="range" min="0" max="100" step="5" value="80"><span class="val" id="sJHVal">80 %</span></div>
  <div class="row"><label data-zh="发育推进" data-en="Development rate">发育推进</label><input id="sRate" type="range" min="0" max="3" step="0.1" value="1"><span class="val" id="sRateVal">1.0 ×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglHorm" type="checkbox" checked> <span data-zh="激素滴度曲线" data-en="Titer curves">激素滴度曲线</span></label>
      <label><input id="tglInside" type="checkbox"> <span data-zh="蛹内成虫盘" data-en="Pupa interior">蛹内成虫盘</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../insulin-glucagon/" data-zh="胰岛素/胰高血糖素:拮抗的激素开关" data-en="insulin-glucagon: antagonistic hormone switches">胰岛素/胰高血糖素:拮抗的激素开关</a>
    <a href="../lac-operon/" data-zh="乳糖操纵子:基因的程序开关" data-en="lac-operon: a genetic program switch">乳糖操纵子:基因的程序开关</a>
    <a href="../transcription/" data-zh="转录:同一套基因的不同读法" data-en="transcription: reading one genome different ways">转录:同一套基因的不同读法</a>
    <a href="../mitosis/" data-zh="有丝分裂:成虫盘的扩张方式" data-en="mitosis: how imaginal discs expand">有丝分裂:成虫盘的扩张方式</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x121017, 22, 62);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x121017 : 0xefeaf4);
  scene.fog.color = new THREE.Color(dark ? 0x121017 : 0xefeaf4);
  groundM.color.setHex(dark ? 0x1b1524 : 0xbfb2ce);
  pedM.color.setHex(dark ? 0x251c31 : 0xb3a6c4);
  tlM.color.setHex(dark ? 0x5a4a72 : 0x8f7fa8);
  ringM.color.setHex(dark ? 0x7a6890 : 0x9a8ab2);
  dotM.color.setHex(dark ? 0xda77f2 : 0x9c36b5);
  leafM.color.setHex(dark ? 0x3f7a44 : 0x5d9a5f);
  eggM.color.setHex(dark ? 0x9a7bb0 : 0x8a68a3);
  headM.color.setHex(dark ? 0x8a6b3f : 0x9a7a4c);
  segM1.color.setHex(dark ? 0x6fae52 : 0x5d9a48);
  segM2.color.setHex(dark ? 0x517f3c : 0x497a38);
  cuticleM.color.setHex(dark ? 0xd9c9a8 : 0xcbbd9c);
  cocoonM.color.setHex(dark ? 0xe9e2d2 : 0xd8cfbc);
  pupaM.color.setHex(dark ? 0x7a5533 : 0x8a6440);
  discM.color.setHex(dark ? 0x6a3f85 : 0x5a2f75);
  discM.emissive.setHex(dark ? 0xda77f2 : 0x9c36b5);
  abdM.color.setHex(dark ? 0x5d4a6b : 0x6f5c80);
  antM.color.setHex(0x3a2f45);
  brainM.color.setHex(dark ? 0x7aa7ff : 0x4c6fd1);
  caM.color.setHex(dark ? 0x5cd68a : 0x2f9e5f);   caM.emissive.setHex(0x5cd68a);
  pgM.color.setHex(dark ? 0xffb45e : 0xe8892a);   pgM.emissive.setHex(0xffb45e);
  wingM1.userData.base = new THREE.Color(dark ? 0xbe70da : 0xa945c2);
  wingM2.userData.base = new THREE.Color(dark ? 0xe2a8ee : 0xc06ad8);
  hemi.color.setHex(dark ? 0xe8ddf5 : 0xffffff);
  hemi.groundColor.setHex(dark ? 0x1c1426 : 0xb7a8c9);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => { el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh; });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('昆虫变态发育 · 两套身体一套基因', 'Insect Metamorphosis · Two Bodies, One Genome');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

  const geo = new THREE.ShapeGeometry(sh, 10);
  geo.rotateX(-Math.PI / 2);

}

const PUPA_C = new THREE.Vector3(STX.pupa, 0.95, 0);

function countType(tp) { let n = 0; for (const p of parts) if (p.tp === tp) n++; return n; }
function stepParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.age += dt;
    if (p.age > p.life) { parts.splice(i, 1); continue; }
    if (p.tp === 0) { p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; }
    else if (p.tp === 1) {
      const dx = p.tx - p.x, dy = p.ty - p.y, dz = p.tz - p.z, d = Math.hypot(dx, dy, dz);
      if (d < 0.06) { parts.splice(i, 1); continue; }
      p.x += dx / d * 1.3 * dt; p.y += dy / d * 1.3 * dt; p.z += dz / d * 1.3 * dt;
    } else if (p.tp === 2) { p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; }
    else if (p.tp === 3) {
      p.ang += 2.2 * dt;
      p.x = p.cx + Math.cos(p.ang) * p.r;
      p.y = p.cy + Math.sin(p.ang * 1.3) * p.r * 0.6;
      p.z = p.cz + Math.sin(p.ang) * p.r * 0.5;
    } else {
      p.vy = 0.55 + 0.15 * Math.sin(p.age * 6);
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    }
  }
}
function drawParts() {
  for (let i = 0; i < P_MAX; i++) {
    if (i < parts.length) {
      const p = parts[i], c = P_COL[p.tp], f = 1 - p.age / p.life;
      pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.y; pPos[i * 3 + 2] = p.z;
      pCol[i * 3] = c.r * f; pCol[i * 3 + 1] = c.g * f; pCol[i * 3 + 2] = c.b * f;
    } else pPos[i * 3 + 1] = -999;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

function notify(z, e, t = 3.6) { notifyT = t; notifyZ = z; notifyE = e; }
function triggerMolt() {
  if (moltT > 0) return;
  ecdyEnv = 1; moltT = 1.7;
  recE.push({ t: devT, a: 1 });
  const jh = jhSet;
  if (stage === 'egg') {
    recJH.push({ t: devT, v: jh });
    recS.push({ t: devT, n: L('孵化', 'hatch') });
    stage = 'larva'; instar = 0; stageT = 0; massStart = 0.0005; popE = 0;
    notify(L('孵化:一龄幼虫出壳(0.5 mg),咽侧体开始大量分泌 JH', 'hatch: the first-instar larva exits (0.5 mg); corpora allata pour out JH'));
  } else if (stage === 'larva') {
    recJH.push({ t: devT, v: jh });
    if (jh >= 60) {
      const from = mass;
      instar = Math.min(instar + 1, 9);
      stageT = 0; massStart = from; popE = 0;
      recS.push({ t: devT, n: L(`第${instar + 1}龄`, `L${instar + 1}`) });
      if (instar > 4) notify(L(`超龄幼虫(第 ${instar + 1} 龄):JH 钉在 ${jh}%,蜕皮素峰只造出更大的毛虫`, `supernumerary instar ${instar + 1}: JH pinned at ${jh}%, the ecdysone peak just makes a bigger caterpillar`));
      else notify(L(`蜕皮素峰 + 高 JH(${jh}%)→ 仍是幼虫:进入第 ${instar + 1} 龄,体重 ×${(MASS_T[instar] / massStart).toFixed(1)}`, `ecdysone peak + high JH (${jh}%) → still a larva: instar ${instar + 1}, mass ×${(MASS_T[instar] / massStart).toFixed(1)}`));
    } else if (jh >= 25) {
      stage = 'inter'; stageT = 0; popE = 0;
      recS.push({ t: devT, n: L('过渡', 'inter') });
      notify(L(`JH ${jh}% 落在中间区 → 幼虫-蛹嵌合体:翅芽鼓起,幼虫表皮却还在`, `JH ${jh}% falls in the middle zone → larva-pupa mosaic: wing pads bulge while larval cuticle remains`));
    } else {
      pupaM0 = mass; stage = 'pupa'; stageT = 0; popE = 0;
      recS.push({ t: devT, n: L('化蛹', 'pupation') });
      notify(L(`JH ${jh}% < 25% → 程序切换:化蛹,旧组织开始溶解`, `JH ${jh}% < 25% → program switch: pupation, old tissue starts dissolving`));
    }
  } else if (stage === 'inter') {
    recJH.push({ t: devT, v: jh });
    if (jh < 25) {
      pupaM0 = mass; stage = 'pupa'; stageT = 0; popE = 0;
      recS.push({ t: devT, n: L('化蛹', 'pupation') });
      notify(L('嵌合体蜕皮时 JH 已归零 → 完成化蛹', 'the mosaic molts with JH now zero → pupation completes'));
    } else if (jh >= 60) {
      stage = 'larva'; stageT = 0; popE = 0; mass *= 1.3; massStart = mass;
      recS.push({ t: devT, n: L('退回幼虫', 'reverted') });
      notify(L('嵌合体蜕皮时 JH 又升高 → 退回幼虫态,蛹程序被再度压制', 'mosaic molt with JH high again → reverted to larva, pupal program suppressed once more'));
    } else {
      stageT = 0; mass *= 1.25;
      notify(L('JH 仍在中间区:再蜕一次,仍是嵌合体', 'JH still mid-zone: molting again, still a mosaic'));
    }
  } else if (stage === 'pupa') {
    recJH.push({ t: devT, v: jh });
    if (jh < 25) {
      stage = 'adult'; stageT = 0; adultT = 0; popE = 0; splitE = 0;
      recS.push({ t: devT, n: L('羽化', 'eclosion') });
      notify(L('蛹内 JH=0 + 最后一峰 20E → 羽化!翅充血淋巴展开;前胸腺已退化,永不再蜕皮', 'pupal JH = 0 + the last 20E peak → eclosion! Wings inflate with hemolymph; the prothoracic gland is gone — no more molts, ever'));
    } else {
      stageT = DUR.pupa * 0.4;
      notify(L(`蛹期 JH 仍 ${jh}%:蜕皮素峰只重复一次蛹态蜕皮,无成虫特征`, `pupal JH still ${jh}%: the peak repeats a pupal molt, no adult features form`));
    }
  } else {
    notify(L('成虫:前胸腺已退化凋亡,20E 断供——蜕皮机器已拆除,永不再蜕皮', 'adult: the prothoracic gland has degenerated, 20E supply is cut — the molting machine is dismantled'));
    moltT = 0; ecdyEnv = 0.4;
  }
}
function forceAdult() {
  if (stage === 'adult') return;
  stage = 'adult'; stageT = 0; adultT = 0; popE = 0; splitE = 0;
  ecdyEnv = 1; moltT = 0;
  recE.push({ t: devT, a: 1 });
  recJH.push({ t: devT, v: 0 });

}

/* ================= 绘图:滴度谱 + 体重阶梯 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 44, padR = 14, padT = 20, padB = 28;
  const tMax = Math.max(50, devT + 5);
  const xOf = t => padL + t / tMax * (W - padL - padR);
  const yOf = v => (H - padB) - clamp(v, 0, 100) / 100 * (H - padT - padB);
  ctx.font = '18px system-ui';
  /* JH 决策阈值虚线 */
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = 'rgba(128,150,170,.35)';
  ctx.lineWidth = 1.5;
  for (const v of [60, 25]) { ctx.beginPath(); ctx.moveTo(xOf(0), yOf(v)); ctx.lineTo(W - padR, yOf(v)); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.fillStyle = cTxt;
  ctx.fillText('60%', padL + 4, yOf(60) - 5);
  ctx.fillText('25%', padL + 4, yOf(25) - 5);
  /* 阶段刻度 */
  ctx.font = '16px system-ui';
  for (const s of recS) {
    ctx.strokeStyle = 'rgba(128,150,170,.3)';
    ctx.beginPath(); ctx.moveTo(xOf(s.t), padT); ctx.lineTo(xOf(s.t), padT + 8); ctx.stroke();
    if (s.n === L('化蛹', 'pupation') || s.n === L('羽化', 'eclosion')) { ctx.fillStyle = cTxt; ctx.fillText(s.n.slice(0, 2), xOf(s.t) - 10, padT - 4); }
  }
  /* 蜕皮素尖峰(高斯包络) */
  if (hormOn) {
    ctx.strokeStyle = '#da77f2'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    let started = false;
    const tEnd = Math.min(tMax, Math.max(devT, recE.length ? recE[recE.length - 1].t + 1.5 : 0));
    for (let t = 0; t <= tEnd; t += 0.12) {
      let v = 0;
      for (const s of recE) { const d = t - s.t; if (Math.abs(d) < 1.5) v += s.a * Math.exp(-(d * d) / 0.405); }
      started ? ctx.lineTo(xOf(t), yOf(v * 100)) : ctx.moveTo(xOf(t), yOf(v * 100));
      started = true;
    }
    ctx.stroke();
  }
  /* JH 阶梯(事件 + 当前值) */
  if (hormOn && recJH.length) {
    ctx.strokeStyle = '#5cd68a'; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let i = 0; i < recJH.length; i++) {
      const ev = recJH[i];
      const nx = i + 1 < recJH.length ? xOf(recJH[i + 1].t) : xOf(devT);
      ctx.lineTo(xOf(ev.t), yOf(ev.v));
      ctx.lineTo(Math.max(nx, xOf(ev.t)), yOf(ev.v));
    }
    ctx.stroke();
  }
  /* 体重阶梯(归一化) */
  let mMax = 5;
  for (const p of recM) mMax = Math.max(mMax, p.m);
  mMax = Math.max(mMax, mass);
  ctx.strokeStyle = '#ffb459'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < recM.length; i++) {
    const p = recM[i];
    i === 0 ? ctx.moveTo(xOf(p.t), yOf(p.m / mMax * 100)) : ctx.lineTo(xOf(p.t), yOf(p.m / mMax * 100));
  }
  ctx.lineTo(xOf(devT), yOf(mass / mMax * 100));
  ctx.stroke();
  /* 当前时刻扫描线 + 动点 */
  ctx.strokeStyle = 'rgba(200,180,220,.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(xOf(devT), padT); ctx.lineTo(xOf(devT), H - padB); ctx.stroke();
  const dots = [[mass / mMax * 100, '#ffb459']];
  if (hormOn) { dots.push([jhSet, '#5cd68a']); dots.push([ecdyEnv * 100, '#da77f2']); }
  for (const [v, c] of dots) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(xOf(devT), yOf(v), 5, 0, Math.PI * 2); ctx.fill(); }
  /* 坐标文字 */
  ctx.font = '17px system-ui';
  ctx.fillStyle = cTxt;
  ctx.fillText('100%', 6, yOf(100) + 5);
  ctx.fillText('0', 20, yOf(0) + 5);
  ctx.fillText(L('发育时间 d', 'time d'), W - 92, H - 10);
  ctx.fillText(L('滴度% / 体重(归一)', 'titer % / mass (norm)'), padL + 6, H - 10);
}

  formulaEl.innerHTML = L(
    `<b>核心开关:20E 定「何时蜕」· JH 定「变成谁」</b>——下一峰的结局:JH ≥ 60% → 幼虫;25–60% → 过渡态;< 25% → 蛹;蛹内峰 + JH=0 → 成虫<br>` +
    `<b>脑 PTTH(约 30 kDa 二聚体)→ 前胸腺 → α-蜕皮素 → 20-羟基蜕皮酮(20E,C27 甾体)</b>;1954 年 500 kg 蚕蛹仅提出 25 mg<br>` +
    `<b>咽侧体 → JH(C16–C18 倍半萜)</b>;当前设定 JH = <b>${jhSet.toFixed(0)}%</b> → 下次蜕皮:<b>${verdict()}</b><br>` +
    `<b>家蚕 @25 °C:卵 9 d + 幼虫 25 d(5 龄 4 蜕)+ 蛹 14 d ≈ 48 d</b>;体重 0.5 mg → ~5 g,增重约 1 万倍;蛹期干物质 ~45% 被消耗<br>` +
    `<b>成虫期前胸腺退化 → 20E 断供 → 永不再蜕皮</b>;咽侧体重启,转而分泌 JH 促卵黄发生`,
    `<b>Core switch: 20E says when to molt · JH says what to become</b> — next peak: JH ≥ 60% → larva; 25-60% → intermediate; < 25% → pupa; pupal peak + JH=0 → adult<br>` +
    `<b>Brain PTTH (~30 kDa dimer) → prothoracic gland → alpha-ecdysone → 20-hydroxyecdysone (20E, C27 steroid)</b>; 25 mg isolated from 500 kg pupae in 1954<br>` +
    `<b>Corpora allata → JH (C16-C18 sesquiterpenoid)</b>; currently set to <b>${jhSet.toFixed(0)}%</b> → next molt: <b>${verdict()}</b><br>` +
    `<b>Silkworm @25 °C: egg 9 d + larva 25 d (5 instars, 4 molts) + pupa 14 d ≈ 48 d</b>; mass 0.5 mg → ~5 g, a 10,000-fold gain; ~45% of pupal dry mass consumed<br>` +
    `<b>Adult: prothoracic gland degenerates → no 20E → never molts again</b>; the corpora allata restart, now making JH for vitellogenesis`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot(); applyView();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elJH.addEventListener('input', () => { jhSet = +elJH.value; syncSliders(); updateFormula(); });
elJH.addEventListener('change', () => {
  const last = recJH[recJH.length - 1];
  if (!last || devT - last.t > 0.15 || last.v !== jhSet) recJH.push({ t: devT, v: jhSet });
  drawPlot();
});
elRate.addEventListener('input', () => { rate = +elRate.value; syncSliders(); });
btnMolt.addEventListener('click', () => { triggerMolt(); syncAll(); });
btnReset.addEventListener('click', () => { resetLife(false); phaseIdx = 0; syncAll(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglHorm').addEventListener('change', e => { hormOn = e.target.checked; drawPlot(); });
document.getElementById('tglInside').addEventListener('change', e => { insideOn = e.target.checked; applyView(); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
let accJH = 0, accEC = 0, accD = 0, accB = 0, accH = 0;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dtA = dt0 * speedMul;
  const dtDays = dtA * rate * 0.9 * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  simT += dtA;
  /* 发育推进 */
  if (dtDays > 0) {
    devT += dtDays; stageT += dtDays;
    ecdyEnv = Math.max(0, ecdyEnv - dtDays * 1.1);
    if (moltT > 0) moltT = Math.max(0, moltT - dtA);
    if (stage === 'larva' && moltT <= 0) {
      const mT = instar < 5 ? MASS_T[instar] : massStart * 2.6;
      mass = massStart * Math.pow(mT / Math.max(massStart, 1e-6), Math.min(1, stageT / curDur()));
    }
    if (stage === 'pupa') mass = pupaM0 * (1 - 0.18 * Math.min(1, stageT / DUR.pupa));
    if (devT - lastM > 0.2) {
      recM.push({ t: devT, m: mass }); lastM = devT;
      if (recM.length > 900) recM = recM.filter((_, i) => i % 2 === 0);
    }
    if (playing && stage !== 'adult' && moltT <= 0 && stageT >= curDur()) triggerMolt();
  }
  /* 动画计时 */
  popE = Math.min(1, popE + dtA * 1.3);
  if (stage === 'adult') { splitE = Math.min(1, splitE + dtA * 0.7); adultT += dtA; }
  if (stage !== 'egg') eggE = Math.max(0.25, eggE - dtA * 0.5);
  /* 站点显隐与缩放 */
  applyStations();
  const popMul = 0.8 + 0.2 * ease(popE);
  const moltP = moltT > 0 ? 1 - moltT / 1.7 : 0;
  stLarva.scale.setScalar((0.8 + 0.13 * Math.min(instar, 7)) * popMul * (stage === 'larva' && moltT > 0 ? 1 + 0.08 * Math.sin(moltP * Math.PI) : 1));
  stInter.scale.setScalar(0.92 * popMul);
  stPupa.scale.setScalar(popMul);
  stAdult.scale.setScalar(popMul);
  eggsG.scale.setScalar(eggE);
  /* 幼虫蠕动 + 进食 + 蜕皮旧皮后移 */
  for (let i = 0; i < larva.segs.length; i++) {
    const s = larva.segs[i];
    s.position.y = 0.24 + 0.014 * Math.sin(simT * 6 - i * 0.7);
    const w = 1 + 0.05 * Math.sin(simT * 6 - i * 0.7);
    s.scale.set(w, 2 - w, w);
  }
  larva.head.position.y = 0.28 + 0.012 * Math.sin(simT * 5);
  larvaLeaf.scale.setScalar(stage === 'larva' ? 1 : 0.64);
  shellG.visible = stage === 'larva' && moltT > 0;
  if (shellG.visible) { shellG.position.x = -0.55 * moltP; cuticleM.opacity = 0.5 * (1 - moltP * 0.7); }
  /* 腺体辉光:JH 随滑块,20E 随峰 */
  const jhGlow = 0.4 + jhSet / 100 * 1.6, eGlow = 0.3 + ecdyEnv * 2.2;
  larva.ca.material = caM; inter.ca.material = caM;
  larva.pg.material = pgM; inter.pg.material = pgM;
  caM.emissiveIntensity = jhGlow; pgM.emissiveIntensity = eGlow;
  brainM.emissiveIntensity = 0.5;
  /* 蛹:成虫盘生长 + 茧壳裂开 */
  const pr = stage === 'pupa' ? Math.min(1, stageT / DUR.pupa) : 1;
  discG.scale.setScalar(0.35 + 0.65 * pr);
  discM.emissiveIntensity = 0.5 + 0.5 * Math.sin(simT * 3);
  cocoonL.rotation.y = 1.35 * ease(splitE);
  cocoonR.rotation.y = -1.35 * ease(splitE);
  /* 成虫:翅膀充液展开 + 扇动 + 悬浮 */
  const ex = clamp(adultT / 3.2, 0, 1);
  const wsc = 0.28 + 0.72 * ease(ex);
  const fold = (1 - ex) * 1.15;
  const flap = ex >= 1 ? 0.1 * Math.sin(simT * 3.4) : 0;
  for (const w of wings) {
    w.pivot.scale.setScalar(w.hind ? wsc * 0.8 : wsc);
    const base = w.mir ? 1 : -1;
    w.pivot.rotation.x = base * (fold + 0.14 + flap);
  }
  wingM1.color.lerpColors(wingM1.userData.dark, wingM1.userData.base, ease(ex));
  wingM2.color.lerpColors(wingM2.userData.dark, wingM2.userData.base, ease(ex));
  stAdult.position.y = 0.16 + (ex >= 1 ? 0.02 * Math.sin(simT * 2.2) : 0);
  /* 时间轴光点 */
  dot.position.x = timelineX(devT);
  dot.scale.setScalar(1 + 0.18 * Math.sin(simT * 4));
  /* 粒子 */
  if (webglOK) {
    if (stage === 'larva') {
      accJH += dtA * (jhSet / 100) * 6;
      while (accJH > 1) { if (countType(3) < 40) spawnJH(); accJH -= 1; }
    }
    accEC += dtA * ecdyEnv * 20;
    while (accEC > 1) { if (countType(4) < 50) spawnEC(); accEC -= 1; }
    if (stage === 'pupa') {
      if (pr < 0.45) { accD += dtA * 28; while (accD > 1) { if (countType(0) < 120) spawnDissolve(); accD -= 1; } }
      if (pr > 0.25) { accB += dtA * 28; while (accB > 1) { if (countType(1) < 120) spawnBuild(); accB -= 1; } }
    }
    if (stage === 'adult' && adultT > 0.4 && adultT < 3.2) {
      accH += dtA * 26;
      while (accH > 1) { if (countType(2) < 60) spawnHemo(); accH -= 1; }
    }
    stepParts(dtA);
    drawParts();
  }
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = ease(camTween.k);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); syncBtns(); }
  accPlot += dt0;
  if (accPlot > 0.25) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
resetLife(true);
buildSteps();
applyLang();
applyView();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
</html>
