<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>青霉素与细胞壁 · 假底物锁死缝纫工,细胞自己胀破</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#4dabf7;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1c7ed6;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(77,171,247,.6);background:rgba(77,171,247,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(28,126,214,.55);background:rgba(28,126,214,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(77,171,247,.10);border-color:rgba(77,171,247,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(28,126,214,.08);border-color:rgba(28,126,214,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#d0ebff}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="青霉素与细胞壁" data-en="Penicillin & the Cell Wall">青霉素与细胞壁</h1>
  <div class="sub" data-zh="转肽酶把糖链的肽尾切缝成网,细菌才扛得住几十个大气压的膨压:青霉素长得像 D-Ala-D-Ala 却让酶切不动——交联停摆,新壁漏风,细胞自己胀破 · 拖动旋转 / 空格运行/暂停" data-en="Transpeptidase stitches glycan strands into a mesh so the cell can hold tens of atmospheres of turgor: penicillin mimics D-Ala-D-Ala and jams the enzyme — cross-linking stalls, the new wall leaks, and the cell bursts from within · drag to orbit / Space = run/pause">转肽酶把糖链的肽尾切缝成网,细菌才扛得住几十个大气压的膨压:青霉素长得像 D-Ala-D-Ala 却让酶切不动——交联停摆,新壁漏风,细胞自己胀破 · 拖动旋转 / 空格运行/暂停</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,44);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.2,3.2,6.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 环境 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
/* 培养皿 */
const dishM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.5,metalness:0.3});
const dish=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.6,0.3,56),dishM);
dish.position.y=0.15;scene.add(dish);
const agarM=new THREE.MeshStandardMaterial({color:0x4a3f38,roughness:0.85});
const agar=new THREE.Mesh(new THREE.CylinderGeometry(3.25,3.25,0.14,56),agarM);
agar.position.y=0.32;scene.add(agar);

/* ---- 细菌(球菌剖面) ---- */
const CX=0,CY=1.9,RCELL=1.5;
const cellG=new THREE.Group();cellG.position.set(CX,CY,0);scene.add(cellG);
/* 质膜 */
const membM=new THREE.MeshStandardMaterial({color:0x862e9c,roughness:0.35,metalness:0.1});
const memb=new THREE.Mesh(new THREE.SphereGeometry(RCELL,42,30),membM);
cellG.add(memb);
/* 肽聚糖层:纬线糖链(环) */
const NGLY=12,NPEP=22;
const glyM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4});
const pepM=new THREE.MeshStandardMaterial({color:0x63e6be,roughness:0.4});
const glycs=new THREE.InstancedMesh(new THREE.TorusGeometry(1,0.035,8,64),glyM,NGLY);
cellG.add(glycs);
const peps=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.028,0.028,1,6),pepM,NGLY*NPEP);
cellG.add(peps);
const wallR=RCELL+0.09;
const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),v3=new THREE.Vector3(),vY=new THREE.Vector3(0,1,0);
function orientIn(im,i,x1,y1,z1,x2,y2,z2,scaleLen=1){
  v3.set(x2-x1,y2-y1,z2-z1);const len=Math.max(1e-4,v3.length()*scaleLen);v3.normalize();
  q.setFromUnitVectors(vY,v3);
  m4.compose(new THREE.Vector3((x1+x2)/2,(y1+y2)/2,(z1+z2)/2),q,new THREE.Vector3(1,len,1));
  im.setMatrixAt(i,m4);
}
/* 糖链环:纬线布置 */
const glyPar=[];
for(let i=0;i<NGLY;i++){
  const th=(i+0.5)/NGLY*Math.PI;
  glyPar.push(th);
}
/* 肽桥:每条糖链环上一圈短撑 */
const pepPos=[];
for(let i=0;i<NGLY;i++){
  const th=glyPar[i],rr=Math.sin(th)*wallR,yv=Math.cos(th)*wallR;
  const nring=Math.max(8,Math.round(Math.sin(th)*NPEP));
  for(let k=0;k<nring;k++){
    const a=k/nring*Math.PI*2;
    pepPos.push({x:rr*Math.cos(a),y:yv,z:rr*Math.sin(a),ring:nring,i,k,alive:1});
  }
}
peps.count=pepPos.length;
/* 细胞质内容:核糖体小点 */
const cytM=new THREE.MeshStandardMaterial({color:0x495c6e,roughness:0.6});
const cyto=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,8,6),cytM,60);
cellG.add(cyto);
for(let i=0;i<60;i++){
  const a=Math.random()*Math.PI*2,c=Math.random()*2-1,sc=Math.sqrt(1-c*c),r=0.72*RCELL;
  m4.makeTranslation(r*sc*Math.cos(a),r*c,r*sc*Math.sin(a));
  cyto.setMatrixAt(i,m4);
}

/* ---- 转肽酶(缝纫工) ---- */
const enzG=new THREE.Group();scene.add(enzG);
const enzM=new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.4,emissive:0xffd43b,emissiveIntensity:0.12});
const enzBody=new THREE.Mesh(new THREE.SphereGeometry(0.16,14,10),enzM);
enzBody.scale.set(1,0.75,1.25);enzG.add(enzBody);
const enzJaw=new THREE.Mesh(new THREE.TorusGeometry(0.09,0.03,8,20),enzM);
enzJaw.position.set(0,0.02,0.13);enzG.add(enzJaw);
/* 青霉素分子(楔形+β-内酰胺环) */
const penG=new THREE.Group();
const penM=new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.35,emissive:0xff6b6b,emissiveIntensity:0.25});
const penBody=new THREE.Mesh(new THREE.SphereGeometry(0.11,12,8),penM);
penG.add(penBody);
const penRing=new THREE.Mesh(new THREE.TorusGeometry(0.06,0.022,8,18),penM);
penRing.rotation.x=Math.PI/2;penRing.position.y=0.09;penG.add(penRing);
scene.add(penG);
/* β-内酰胺酶(耐药) */
const lactG=new THREE.Group();
const lactM=new THREE.MeshStandardMaterial({color:0xb197fc,roughness:0.4,emissive:0xb197fc,emissiveIntensity:0.15});
const lactBody=new THREE.Mesh(new THREE.SphereGeometry(0.14,12,10),lactM);
lactG.add(lactBody);
scene.add(lactG);

/* ---- 状态 ---- */
let drug=0,mode='heal',turg=25,playing=true,labelsOn=true,slowMo=false,cutaway=true;
let xl=1,jam=0,burst=false,burstT=0,bulge=0,simT=0,enzAngle=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function jamRate(){return mode==='resist'?drug*0.004:drug*0.02;}
function healRate(){return mode==='heal'?0.06:(mode==='resist'?0.045:0);}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('糖链(蓝)是骨架,肽桥(绿)是缝线','Glycan strands (blue) are the warp, peptide bridges (green) the stitches'),
  new THREE.Vector3(0,4.1,0),'b');
addLabel(()=>L('转肽酶:切掉 D-Ala,把两条链缝在一起','Transpeptidase: trims D-Ala, stitches two strands'),
  new THREE.Vector3(3.0,2.6,0),'y',()=>mode==='heal');
addLabel(()=>L('青霉素冒充 D-Ala-D-Ala,共价锁死酶','Penicillin poses as D-Ala-D-Ala and locks the enzyme'),
  new THREE.Vector3(-3.1,2.9,0),'r',()=>mode==='drug');
addLabel(()=>L('交联停摆:膜从网孔里鼓泡','Cross-linking stalled: the membrane bulges through the mesh'),
  new THREE.Vector3(-3.0,1.2,0),'p',()=>mode==='drug'&&xl<0.5&&!burst);
addLabel(()=>L('β-内酰胺酶:先一步水解青霉素','β-lactamase: hydrolyzes penicillin first'),
  new THREE.Vector3(3.0,1.0,0),'o',()=>mode==='resist');

/* ---- 控件 ---- */
function setDrug(v){drug=clamp(v,0,100);
  document.getElementById('sDrug').value=drug;
  document.getElementById('sDrugVal').textContent=drug.toFixed(0)+' %';
  if(drug>0&&mode==='heal')setMode('drug');
  if(drug===0&&mode==='drug')setMode('heal');
  updateStats();}
function setTurg(v){turg=clamp(v,10,40);
  document.getElementById('sTurg').value=turg;
  document.getElementById('sTurgVal').textContent=turg.toFixed(0)+' atm';updateStats();}
function setMode(m){mode=m;
  document.getElementById('bHeal').classList.toggle('on',m==='heal');
  document.getElementById('bDrug').classList.toggle('on',m==='drug');
  document.getElementById('bResist').classList.toggle('on',m==='resist');
  if(m==='heal'){drug=Math.min(drug,0);document.getElementById('sDrug').value=0;document.getElementById('sDrugVal').textContent='0 %';xl=1;jam=0;burst=false;bulge=0;memb.scale.set(1,1,1);}
  if(m==='drug')jam=0;
  updateStats();}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'糖链延伸,肽尾等着被缝合',en:'Glycan strands grow, peptide tails wait to be stitched',
  act(){setMode('heal');setTurg(25);}},
 {zh:'转肽酶切尾缝合,交联率 100%',en:'Transpeptidase stitches away — cross-links at 100%',
  act(){setMode('heal');setTurg(35);}},
 {zh:'青霉素假底物钻进活性中心,酶被锁死',en:'Penicillin wedges into the active site — enzyme jammed',
  act(){setMode('drug');setDrug(60);}},
 {zh:'交联停摆:新壁只有骨架没有缝线',en:'Stalling: new wall has warp but no weft',
  act(){setMode('drug');setDrug(90);}},
 {zh:'膨压冲顶:膜从网孔鼓出、胀破',en:'Turgor maxes out: bulges, then burst',
  act(){setMode('drug');setDrug(100);setTurg(40);}},
 {zh:'耐药对照:β-内酰胺酶拆药,缝纫照常',en:'Resistance: β-lactamase shreds the drug, stitching goes on',
  act(){setMode('resist');setDrug(100);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const xv=document.getElementById('stXl');
  xv.innerHTML=(100*xl).toFixed(0)+'<small> %</small>';
  xv.className='v '+(xl<0.5?'warn':'ok');
  const tv=document.getElementById('stTurg');
  const eff=burst?0:turg;
  tv.innerHTML=eff.toFixed(0)+'<small> atm</small>';
  tv.className='v '+(turg>32&&!burst?'warn':'');
  const jv=document.getElementById('stJam');
  jv.innerHTML=(100*jam).toFixed(0)+'<small> %</small>';
  jv.className='v '+(jam>0.5?'warn':'');
  const cv=document.getElementById('stCell');
  if(burst){cv.textContent=L('破裂!','LYSED');cv.className='v warn';}
  else{cv.textContent=L('完整','intact');cv.className='v ok';}
}

/* ---- 事件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bHeal').addEventListener('click',()=>setMode('heal'));
document.getElementById('bDrug').addEventListener('click',()=>{setMode('drug');setDrug(60);});
document.getElementById('bResist').addEventListener('click',()=>{setMode('resist');setDrug(100);});
document.getElementById('sDrug').addEventListener('input',e=>setDrug(+e.target.value));
document.getElementById('sTurg').addEventListener('input',e=>setTurg(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{
  cutaway=e.target.checked;
  cellG.rotation.x=cutaway?0.55:0;
  cellG.rotation.z=cutaway?0.35:0;
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 缝纫/锁酶动态 */
  if(!burst){
    if(mode==='heal'){xl+=(1-xl)*dts*healRate()*10;jam+=(0-jam)*dts*2;}
    else if(mode==='drug'){jam+=(1-jam)*dts*jamRate()*10;xl+=(0.12-xl)*dts*0.25;}
    else{/* resist: 酶把药拆了,锁不死 */
      jam+=(0.25-jam)*dts*0.8;xl+=(0.92-xl)*dts*0.4;}
    /* 胀破判定 */
    if(mode==='drug'&&xl<0.5&&turg>=32){
      bulge+=dts*(0.25+0.02*(turg-32));
      memb.scale.setScalar(1+bulge*0.16);
      if(bulge>1){burst=true;burstT=0;}
    }else bulge+=(0-bulge)*dts*2;
  }else{
    burstT+=dts;
    /* 破裂:膜弹开消隐,壁散架 */
    memb.scale.setScalar(1+bulge*0.16+burstT*1.2);
    memb.material.opacity=clamp(1-burstT*0.8,0,1);
    memb.material.transparent=true;
  }
  /* 壁交联可视化:未交联的肽桥缩没 */
  for(let i=0;i<pepPos.length;i++){
    const p=pepPos[i];
    const show=p.alive&&(i/pepPos.length<xl)?1:0.001;
    const rr=Math.sin(p.i/NGLY*Math.PI)*wallR;
    const yv=Math.cos(p.i/NGLY*Math.PI)*wallR;
    const a=p.k/p.ring*Math.PI*2+simT*0.05;
    const x1=rr*Math.cos(a),z1=rr*Math.sin(a);
    const x2=rr*1.13*Math.cos(a),z2=rr*1.13*Math.sin(a);
    orientIn(peps,i,x1,yv,z1,x2,yv,z2,show);
  }
  peps.instanceMatrix.needsUpdate=true;
  /* 糖链环(破裂时散开) */
  const scat=burst?burstT*0.8:0;
  for(let i=0;i<NGLY;i++){
    const th=glyPar[i];
    m4.makeRotationX(Math.PI/2);
    m4.setPosition(0,Math.cos(th)*(wallR+scat*(0.5+0.5*Math.sin(i*3))),0);
    const s=wallR*Math.sin(th)*(1+scat*0.4);
    m4.scale(new THREE.Vector3(s/1,s/1,s/1));
    glycs.setMatrixAt(i,m4);
  }
  glycs.instanceMatrix.needsUpdate=true;
  /* 缝纫工巡游:健康时沿壁巡视,药模式下停在原地震颤 */
  enzAngle+=dts*0.5;
  const ea=enzAngle;
  const ex=Math.sin(ea)*wallR*1.25,ez=Math.cos(ea)*wallR*1.25;
  enzG.position.set(CX+ex,CY+Math.sin(enzAngle*2.3)*0.5,ez);
  enzJaw.rotation.z=Math.sin(simT*9)*0.5*(mode==='heal'||mode==='resist'?1:0.15);
  enzM.emissiveIntensity=mode==='drug'?0.02+0.12*jam:0.2;
  enzM.color.setHex(mode==='drug'&&jam>0.6?0x868e96:0xffd43b);
  /* 青霉素分子:药物模式下围着细胞游荡 */
  if(mode!=='heal'){
    penG.visible=true;
    const pa=simT*0.8;
    penG.position.set(CX+Math.sin(pa)*wallR*1.7,CY+Math.cos(pa*1.3)*0.8,Math.cos(pa)*wallR*1.7);
    penRing.rotation.z+=dts*3;
  }else penG.visible=false;
  /* β-内酰胺酶 */
  if(mode==='resist'){
    lactG.visible=true;
    const la=simT*1.1;
    lactG.position.set(CX+Math.sin(la)*wallR*1.45,CY+Math.sin(la*2)*0.6,Math.cos(la)*wallR*1.45);
    lactG.rotation.y+=dts*2;
  }else lactG.visible=false;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
cellG.rotation.x=0.55;cellG.rotation.z=0.35;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
