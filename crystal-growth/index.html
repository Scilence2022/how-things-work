<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晶体生长 · 逐层砌起的秩序</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(99,230,190,.9); color: #c3f5e5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #63e6be; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.g { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.s { color: #d0bfff; border-color: rgba(177,151,252,.7); }
  .chip.k { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="晶体生长:逐层砌起的秩序" data-en="Crystal Growth: order, one layer at a time">晶体生长:逐层砌起的秩序</h1>
  <div class="sub" data-zh="过饱和驱动分子落座;台阶位(缺口)最容易被填,晶面因此恒速平整推进——晶格周期性就是晶面的规则 · 空格播放/暂停" data-en="Supersaturation drives molecules into place; kink sites fill first, so facets advance flat and steady — the lattice periodicity IS the crystal habit · Space = play/pause">过饱和驱动分子落座;台阶位(缺口)最容易被填,晶面因此恒速平整推进——晶格周期性就是晶面的规则 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="晶胞数" data-en="unit cells">晶胞数</span><span class="v g" id="stCells">—</span>
  <span class="k" data-zh="台阶生长位" data-en="kink sites">台阶生长位</span><span class="v" id="stKinks">—</span>
  <span class="k" data-zh="生长速率" data-en="growth rate">生长速率</span><span class="v" id="stRate">—</span>
  <span class="k" data-zh="表面空穴(缺陷)" data-en="vacancies (defects)">表面空穴(缺陷)</span><span class="v" id="stVac">0</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.g" data-zh="已落座晶胞" data-en="placed cells">已落座晶胞</span>
    <span class="chip.s" data-zh="溶液中的溶质" data-en="solute in solution">溶液中的溶质</span>
    <span class="chip.k" data-zh="高亮:台阶位(优先落座)" data-en="highlight: kink sites (fill first)">高亮:台阶位(优先落座)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnSeed" data-zh="重新成核" data-en="re-nucleate">重新成核</button>
  </div>
  <div class="row"><label data-zh="过饱和度" data-en="supersaturation">过饱和度</label><input id="sup" type="range" min="10" max="100" step="1" value="60"><span class="val" id="supVal">60%</span></div>
  <div class="row"><label data-zh="温度(缺陷源)" data-en="temperature (defects)">温度(缺陷源)</label><input id="temp" type="range" min="0" max="100" step="1" value="30"><span class="val" id="tempVal">30%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../phase-transition/" data-zh="相变:序何时取胜" data-en="phase change: when order wins">相变:序何时取胜</a>
    <a href="../hydrogen-bond/" data-zh="另一种晶格:冰" data-en="another lattice: ice">另一种晶格:冰</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  boxMat.opacity = THEME === 'dark' ? 0.10 : 0.16;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('晶体生长', 'Crystal Growth');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.6, 2.8, 4.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 14;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 溶液槽(玻璃箱) ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const boxMat = new THREE.MeshPhysicalMaterial({ color: 0x9db4d6, transparent: true, opacity: 0.10,
  roughness: 0.15, side: THREE.DoubleSide, depthWrite: false });
const box = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.6, 3.4), boxMat);
box.position.y = 1.0;
scene.add(box);
const boxEdge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(3.4, 2.6, 3.4)),
  new THREE.LineBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.3 }));
boxEdge.position.y = 1.0;
scene.add(boxEdge);
const base = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.8, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.4;
scene.add(base);

/* ================= 晶格 ================= */
const G = 11;                 // 每边格点
const SP = 0.26;              // 间距
const origin = new THREE.Vector3(-(G - 1) * SP / 2, 0.15, -(G - 1) * SP / 2);
const cellOf = (x, y, z) => origin.clone().add(new THREE.Vector3(x * SP, y * SP, z * SP));
const occ = new Set();        // "x,y,z" → 已落座
const key3 = (x, y, z) => `${x},${y},${z}`;
const cellMeshOf = new Map(); // key → mesh index

/* InstancedMesh 池 */
const MAXC = G * G * 4;       // 上限(够生长到中段)
const cellIM = new THREE.InstancedMesh(
  new THREE.BoxGeometry(SP * 0.96, SP * 0.96, SP * 0.96),
  new THREE.MeshStandardMaterial({ color: 0x63e6be, roughness: 0.35, metalness: 0.25,
    emissive: 0x63e6be, emissiveIntensity: 0.12, transparent: true, opacity: 0.96 }), MAXC);
cellIM.count = 0;
scene.add(cellIM);
/* 台阶位高亮(线框) */
const kinkIM = new THREE.InstancedMesh(
  new THREE.BoxGeometry(SP * 1.0, SP * 1.0, SP * 1.0),
  new THREE.MeshBasicMaterial({ color: 0xffd166, wireframe: true, transparent: true, opacity: 0.75 }), 900);
kinkIM.count = 0;
scene.add(kinkIM);

const m4 = new THREE.Matrix4();
function rebuildInstances() {
  let k = 0;
  cellMeshOf.clear();
  for (const key of occ) {
    const [x, y, z] = key.split(',').map(Number);
    m4.setPosition(cellOf(x, y, z));
    if (k < MAXC) { cellIM.setMatrixAt(k, m4); cellMeshOf.set(key, k); k++; }
  }
  cellIM.count = k;
  cellIM.instanceMatrix.needsUpdate = true;
  /* 台阶位:已占且 <6 邻(限顶层附近,数量上限) */
  let kn = 0;
  kinks.length = 0;
  for (const key of occ) {
    const [x, y, z] = key.split(',').map(Number);
    const nCount = nbrs(x, y, z).length;
    if (nCount < 6 && kn < 900) {
      m4.setPosition(cellOf(x, y, z));
      kinkIM.setMatrixAt(kn++, m4);
      kinks.push([x, y, z, nCount]);
    }
  }
  kinkIM.count = kn;
  kinkIM.instanceMatrix.needsUpdate = true;
}
function nbrs(x, y, z) {
  const out = [];
  if (occ.has(key3(x + 1, y, z))) out.push([x + 1, y, z]);
  if (occ.has(key3(x - 1, y, z))) out.push([x - 1, y, z]);
  if (occ.has(key3(x, y + 1, z))) out.push([x, y + 1, z]);
  if (occ.has(key3(x, y - 1, z))) out.push([x, y - 1, z]);
  if (occ.has(key3(x, y, z + 1))) out.push([x, y, z + 1]);
  if (occ.has(key3(x, y, z - 1))) out.push([x, y, z - 1]);
  return out;
}
/* 落座候选:空格 & 至少 1 邻 */
function candidates() {
  const cand = new Map();   // key → [x,y,z,nCount]
  for (const [x, y, z, n] of kinks) {
    const tryAdd = (cx, cy, cz) => {
      if (cx < 0 || cy < 0 || cz < 0 || cx >= G || cy >= G || cz >= G) return;
      const k = key3(cx, cy, cz);
      if (occ.has(k)) return;
      const nc = nbrs(cx, cy, cz).length;
      const prev = cand.get(k);
      if (!prev || prev[3] < nc) cand.set(k, [cx, cy, cz, nc]);
    };
    tryAdd(x + 1, y, z); tryAdd(x - 1, y, z);
    tryAdd(x, y + 1, z); tryAdd(x, y - 1, z);
    tryAdd(x, y, z + 1); tryAdd(x, y, z - 1);
  }
  return [...cand.values()];
}
function seed() {
  occ.clear();
  const mid = Math.floor(G / 2);
  for (let x = mid - 1; x <= mid + 1; x++)
    for (let z = mid - 1; z <= mid + 1; z++)
      occ.add(key3(x, 0, z));
  occ.add(key3(mid, 1, mid));
  rebuildInstances();
  lastCells = occ.size;
}

/* ================= 溶质粒子 ================= */
const solute = [];   // {mesh, v}
const SOLN = 46;
const soluteMat = new THREE.MeshStandardMaterial({ color: 0xb197fc, roughness: 0.3, metalness: 0.1,
  emissive: 0xb197fc, emissiveIntensity: 0.3, transparent: true, opacity: 0.9 });
for (let i = 0; i < SOLN; i++) {
  const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.075, 0), soluteMat);
  mesh.position.set((Math.random() - 0.5) * 3.0, 0.5 + Math.random() * 1.9, (Math.random() - 0.5) * 3.0);
  scene.add(mesh);
  solute.push({ mesh, v: new THREE.Vector3() });
}

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let sup = 0.6;
let temp = 0.3;
let tSim = 0;
let lastCells = 0;
let rateEMA = 0;
let growCD = 0;
const kinks = [];

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblSeed = addLabel(() => L('晶种:秩序的第一块砖', 'the seed: the first brick of order'),
  new THREE.Vector3(0, 0.05, 0.4), 'g');
const lblFacet = addLabel(() => L('黄色台阶位 = 三个面夹出的「凹角」:一次抓住三个方向的键,最容易被填——晶面因此平整推进', 
  'yellow kinks = concave corners grabbed from three sides at once — that is why facets advance flat'),
  new THREE.Vector3(0, 2.75, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '过饱和:秩序的势能', be: 'Supersaturation: order\'s potential',
    d: '溶解量超过平衡溶解度,溶质「想」析出——过饱和度是结晶的驱动力。没有过饱和,晶体不长也不溶。',
    de: 'More solute than solubility allows: the excess wants out. Supersaturation is the driving force — no driving force, no growth.',
    act: () => setSup(70) },
  { b: '成核:第一块砖', be: 'Nucleation: the first brick',
    d: '少数分子偶然聚成稳定小团(晶核)。核以下全溶解,核以上才生长——「欠钱要还」的能垒就是表面能。',
    de: 'A few molecules randomly form a stable cluster; below critical size it dissolves, above it grows. The barrier is surface energy.',
    act: () => document.getElementById('btnSeed').click() },
  { b: '台阶位最抢手', be: 'Kinks get grabbed first',
    d: '落在平台上的分子只牵 1 个键,容易被热运动踢走;凹角台阶位一次牵 3 个键,落座即稳——分子永远优先填缺口。',
    de: 'On a flat terrace one bond holds loosely; a kink grabs three — the newcomer locks in. Molecules always fill the notches first.',
    act: () => setTemp(10) },
  { b: '晶面恒速推进', be: 'Facets advance steadily',
    d: '台阶被填平 → 新台阶再生成 → 层层重复:每个晶面像一堵匀速砌起的墙。晶面的平直来自晶格的周期性。',
    de: 'Fill the step, a new step forms, repeat: each facet is a wall laid at constant rate — flat faces come straight from lattice periodicity.',
    act: () => setSup(90) },
  { b: '温度决定完美度', be: 'Temperature sets perfection',
    d: '高温下热运动偶尔把已落座的分子踢回溶液(还可能留下空穴缺陷);低温生长慢但近乎完美。区域熔炼提纯硅正靠这个——杂质被「拒绝」在晶格外。',
    de: 'Hot solutions occasionally kick residents back out, leaving vacancies; cold growth is slow but near-perfect. Zone refining of silicon exploits exactly this — impurities are rejected.',
    act: () => setTemp(85) },
];
function stepIndex() {
  if (temp > 0.7) return 4;
  if (occ.size > 140) return 3;
  if (occ.size > 40) return 2;
  if (occ.size > 10) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 物理 ================= */
function setSup(v) {
  sup = clamp(v / 100, 0.1, 1);
  document.getElementById('sup').value = sup * 100;
  document.getElementById('supVal').textContent = (sup * 100).toFixed(0) + '%';
}
function setTemp(v) {
  temp = clamp(v / 100, 0, 1);
  document.getElementById('temp').value = temp * 100;
  document.getElementById('tempVal').textContent = (temp * 100).toFixed(0) + '%';
}
function physics(dt) {
  /* 溶质布朗 + 被晶格吸引 */
  for (const s of solute) {
    s.v.x += (Math.random() - 0.5) * dt * 2.0;
    s.v.y += (Math.random() - 0.5) * dt * 1.4;
    s.v.z += (Math.random() - 0.5) * dt * 2.0;
    s.v.clampLength(0, 0.35 + sup * 0.4);
    s.mesh.position.addScaledVector(s.v, dt);
    const p = s.mesh.position;
    if (p.x < -1.5) { p.x = -1.5; s.v.x = Math.abs(s.v.x); }
    if (p.x > 1.5) { p.x = 1.5; s.v.x = -Math.abs(s.v.x); }
    if (p.z < -1.5) { p.z = -1.5; s.v.z = Math.abs(s.v.z); }
    if (p.z > 1.5) { p.z = 1.5; s.v.z = -Math.abs(s.v.z); }
    if (p.y < 0.2) { p.y = 0.2; s.v.y = Math.abs(s.v.y); }
    if (p.y > 2.2) { p.y = 2.2; s.v.y = -Math.abs(s.v.y); }
    s.mesh.rotation.y += dt * 1.2;
  }
  /* 生长:从台阶位候选中按过饱和概率落座 */
  growCD -= dt;
  if (growCD <= 0) {
    growCD = 0.05;
    const cands = occ.size < MAXC - 8 ? candidates() : [];
    if (cands.length) {
      /* 择优:邻数多的权重高(凹角) */
      let tot = 0;
      const w = cands.map(c => { const wt = Math.pow(2.2, c[3]); tot += wt; return wt; });
      let r = Math.random() * tot * sup * 1.4;
      for (let i = 0; i < cands.length; i++) {
        r -= w[i];
        if (r <= 0) {
          const [x, y, z] = cands[i];
          occ.add(key3(x, y, z));
          rebuildInstances();
          /* 消耗一颗近邻溶质(视觉) */
          const cell = cellOf(x, y, z);
          let best = null, bd = 1e9;
          for (const s of solute) {
            const d = s.mesh.position.distanceTo(cell);
            if (d < bd) { bd = d; best = s; }
          }
          if (best && bd < 0.9) {
            best.mesh.position.set(cell.x + (Math.random() - 0.5) * 2.4, 1.6 + Math.random() * 0.5, cell.z + (Math.random() - 0.5) * 2.4);
          }
          break;
        }
      }
    }
  }
  /* 高温缺陷:随机踢掉表面分子 */
  if (Math.random() < temp * dt * 1.2 && occ.size > 12) {
    const arr = [...occ];
    const [x, y, z] = arr[Math.floor(Math.random() * arr.length)].split(',').map(Number);
    if (nbrs(x, y, z).length < 5 && y > 0) {
      occ.delete(key3(x, y, z));
      rebuildInstances();
    }
  }
  /* 生长速率 */
  const dCells = occ.size - lastCells;
  lastCells = occ.size;
  rateEMA = lerp(rateEMA, dCells / Math.max(dt, 1e-4), 0.06);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
document.getElementById('sup').addEventListener('input', e => setSup(parseInt(e.target.value)));
document.getElementById('temp').addEventListener('input', e => setTemp(parseInt(e.target.value)));
document.getElementById('btnSeed').addEventListener('click', seed);
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  physics(dts);
  kinkIM.material.opacity = 0.45 + 0.3 * Math.sin(tSim * 4);
  document.getElementById('stCells').textContent = occ.size;
  document.getElementById('stKinks').textContent = kinks.length;
  document.getElementById('stRate').innerHTML = Math.max(0, rateEMA).toFixed(1) + '<small>格/s</small>';
  document.getElementById('stVac').textContent = temp > 0.25 ? Math.round(temp * 14) : 0;

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

seed();
applyTheme();
applyLang();
setSup(60);
setTemp(30);
setPlayLabel();
requestAnimationFrame(frame);
</script>
