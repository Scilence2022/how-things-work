<style>
  :root,:root[data-theme="dark"]{

  :root[data-theme="light"]{

    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;

  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}

    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }

  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-7.5,4.5,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ── 梁:沿 X 轴放置,中点在原点,中性轴高度 BEAM_Y ── */
const BEAM_Y=1.1,NS=26;
function makeSectionGeo(kind){
  const s=new THREE.Shape();
  if(kind==='rect'){s.moveTo(-0.13,-0.25);s.lineTo(0.13,-0.25);s.lineTo(0.13,0.25);s.lineTo(-0.13,0.25);s.closePath();}
  else if(kind==='i'){const a=0.15,b=0.25,f=0.08,w=0.05;
    s.moveTo(-a,-b);s.lineTo(a,-b);s.lineTo(a,-b+f);s.lineTo(w,-b+f);s.lineTo(w,b-f);s.lineTo(a,b-f);s.lineTo(a,b);s.lineTo(-a,b);s.lineTo(-a,b-f);s.lineTo(-w,b-f);s.lineTo(-w,-b+f);s.lineTo(-a,-b+f);s.closePath();}
  else{s.absarc(0,0,0.25,0,Math.PI*2,false);const h=new THREE.Path();h.absarc(0,0,0.155,0,Math.PI*2,true);s.holes.push(h);}
  const g=new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:false});
  g.rotateY(Math.PI/2);g.translate(-0.5,0,0);return g;
}
const segGeo={rect:makeSectionGeo('rect'),i:makeSectionGeo('i'),hollow:makeSectionGeo('hollow')};
const C_BASE=new THREE.Color(0xd8dee8),C_HOT=new THREE.Color(0xff6b6b),C_COLD=new THREE.Color(0x339af0),C_WHITE=new THREE.Color(0xf4f6f8);
const segs=[],segMats=[];
for(let i=0;i<NS;i++){
  const m=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.35,metalness:0.75});
  const mesh=new THREE.Mesh(segGeo.rect,m);scene.add(mesh);
  segs.push(mesh);segMats.push(m);
}
/* 支座(简支)与固定端墙(悬臂) */
const supM=new THREE.MeshStandardMaterial({color:0x6b7787,roughness:0.5,metalness:0.4});
const supA=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.85,0.9),supM);supA.position.set(-2,0.425,0);scene.add(supA);
const supB=supA.clone();supB.position.x=2;scene.add(supB);
const wallM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.55,metalness:0.35});
const wall=new THREE.Mesh(new THREE.BoxGeometry(0.5,2.1,1.5),wallM);wall.position.set(-2.25,1.05,0);wall.visible=false;scene.add(wall);
/* 荷载箭头 */
const arrM=new THREE.MeshStandardMaterial({color:0xd8a03c,roughness:0.35,metalness:0.5,emissive:0xd8a03c,emissiveIntensity:0.3});
const arrow=new THREE.Group();scene.add(arrow);
const arrRod=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.95,10),arrM);arrRod.position.y=0.62;arrow.add(arrRod);
const arrTip=new THREE.Mesh(new THREE.ConeGeometry(0.13,0.32,12),arrM);arrTip.rotation.x=Math.PI;arrow.add(arrTip);
/* 力流粒子:沿弯曲后的中性轴流动(画在梁前方以免被遮住) */
const NPF=36;
const flowM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4,emissive:0x74c0fc,emissiveIntensity:0.7});
const flow=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,8,8),flowM,NPF);
flow.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(flow);
const flowOff=[];for(let i=0;i<NPF;i++)flowOff.push(Math.random());
const m4=new THREE.Matrix4();
/* 应力截面展示卡:拉区红 / 压区蓝 / 中性轴白线 */
const card=new THREE.Group();card.position.set(0,3.0,2.3);scene.add(card);
const cardBack=new THREE.Mesh(new THREE.BoxGeometry(1.74,1.44,0.05),new THREE.MeshStandardMaterial({color:0x22262e,roughness:0.85}));
cardBack.position.z=-0.05;card.add(cardBack);
const NSLAB=11,slabs=[],slabGeo=new THREE.BoxGeometry(1,0.104,0.1);
for(let j=0;j<NSLAB;j++){
  const m=new THREE.MeshStandardMaterial({color:0xf4f6f8,roughness:0.5});
  const sl=new THREE.Mesh(slabGeo,m);sl.position.y=-0.55+j*0.11;card.add(sl);slabs.push(sl);
}
const naLine=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.026,0.14),new THREE.MeshBasicMaterial({color:0xffffff}));
card.add(naLine);
/* 卡片到梁中性轴的指示线 */
const lead=new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,1,6),new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:0.6}));
scene.add(lead);

/* 状态与玩具物理:挠度∝荷载×跨度⁴/惯性矩,应力∝荷载×跨度×远端距离/惯性矩 */
let mode='ss',section='rect',loadP=12,spanM=4,playing=true,labelsOn=true,slowMo=false,exag=true,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const SECT={rect:{I:1.0},i:{I:2.8},hollow:{I:1.6}};
function deflMM(){return loadP*Math.pow(spanM,4)/(128*SECT[section].I);}
function sigmaMax(){return loadP*spanM*3.0/SECT[section].I;}
function deflWorld(){return clamp(0.30*(loadP/10)*Math.pow(spanM/4,4)/SECT[section].I*(exag?1:0.16),0.02,spanM*0.32);}
function curveY(x){
  const xi=clamp(x/spanM+0.5,0,1);let f;
  if(mode==='ss')f=xi<=0.5?xi*(3-4*xi*xi):(1-xi)*(3-4*(1-xi)*(1-xi));
  else f=xi*xi*(3-2*xi)/2;
  return BEAM_Y-deflWorld()*f;
}
const segBaseY=new Float32Array(NS);
const segXi=i=>(i+0.5)/NS;
function xLoad(){return mode==='ss'?0:spanM/2;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblNA=addLabel(()=>L('中性轴:这一层不伸不缩','Neutral axis: neither stretched nor shortened'),
  new THREE.Vector3(-1.15,3.0,2.45),'b');
const lblTen=addLabel(()=>L('拉区:被拉长,σ>0','Tension side: stretched, σ>0'),
  new THREE.Vector3(-1.15,2.42,2.45),'r');
const lblCom=addLabel(()=>L('压区:被压短,σ<0','Compression side: shortened, σ<0'),
  new THREE.Vector3(-1.15,3.58,2.45),'g');
const lblLoad=addLabel(()=>L(`荷载 ${loadP.toFixed(0)} kN`,`Load ${loadP.toFixed(0)} kN`),
  new THREE.Vector3(0,2.9,0),'y');
const lblSup=addLabel(()=>L('支座','Support'),new THREE.Vector3(-2,0.5,0.75),'o');

function updateBeam(){
  const hw=spanM/2,segL=spanM/NS,xl=xLoad();
  for(let i=0;i<NS;i++){
    const xi=(i+0.5)/NS,x=(xi-0.5)*spanM,y=curveY(x);
    segBaseY[i]=y;
    segs[i].position.set(x,y,0);
    const xa=Math.max(x-0.05*spanM,-hw),xb=Math.min(x+0.05*spanM,hw);
    segs[i].rotation.z=Math.atan((curveY(xb)-curveY(xa))/(xb-xa));
    segs[i].scale.x=segL;segs[i].geometry=segGeo[section];
  }
  supA.visible=supB.visible=mode==='ss';
  supA.position.x=-hw;supB.position.x=hw;
  wall.visible=mode==='cant';wall.position.x=-hw-0.25;
  arrow.position.set(xl,curveY(xl)+0.18,0);
  arrow.scale.setScalar(clamp(0.75+loadP/40,0.7,1.5));
  lblLoad.position.set(xl,curveY(xl)+1.62,0);
  lblSup.position.set(mode==='ss'?-hw:-hw-0.55,mode==='ss'?0.5:1.6,0.75);
  /* 应力卡:拉红/压蓝,简支在下、悬臂在上 */
  const sign=mode==='ss'?-1:1;
  const bw=section==='rect'?0.66:section==='i'?0.80:1.30;
  for(let j=0;j<NSLAB;j++){
    const frac=-1+2*(j+0.5)/NSLAB;let wf=1;
    if(section==='i')wf=Math.abs(frac)>0.68?1:0.32;
    if(section==='hollow')wf=Math.sqrt(Math.max(0.02,1-frac*frac));
    slabs[j].scale.set(bw*wf,1,1);
    const s=frac*sign;
    slabs[j].material.color.copy(C_WHITE).lerp(s>0?C_HOT:C_COLD,clamp(Math.abs(s)*1.2,0,1));
  }
  lblTen.position.set(-1.15,sign<0?2.42:3.58,2.45);
  lblCom.position.set(-1.15,sign<0?3.58:2.42,2.45);
  /* 指示线:从中性轴中点连到卡片 */
  const a=new THREE.Vector3(0,curveY(0)+0.3,0),b=new THREE.Vector3(0,2.3,2.27),d=b.clone().sub(a);
  lead.position.copy(a).addScaledVector(d,0.5);lead.scale.set(1,d.length(),1);
  lead.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
}
function setLoad(v){loadP=clamp(v,1,40);
  document.getElementById('sLoad').value=loadP;
  document.getElementById('sLoadVal').textContent=loadP.toFixed(0)+' kN';updateBeam();updateStats();}
function setSpan(v){spanM=clamp(v,2,10);
  document.getElementById('sSpan').value=spanM;
  document.getElementById('sSpanVal').textContent=spanM.toFixed(1)+' m';updateBeam();updateStats();}
function setSection(k){section=k;
  document.getElementById('bRect').classList.toggle('on',k==='rect');
  document.getElementById('bI').classList.toggle('on',k==='i');
  document.getElementById('bHollow').classList.toggle('on',k==='hollow');
  updateBeam();updateStats();}
function setMode(m){mode=m;
  document.getElementById('bSS').classList.toggle('on',m==='ss');
  document.getElementById('bCant').classList.toggle('on',m==='cant');
  updateBeam();updateStats();}
function setExag(v){exag=v;
  document.getElementById('tglExag').checked=v;updateBeam();updateStats();}

const STEPS=[
 {zh:'简支梁中央受载:向下弯,下侧被拉长、上侧被压短',en:'Simply supported, load at mid: it sags — the bottom stretches, the top shortens',
  act(){setMode('ss');setSection('rect');setLoad(12);setSpan(4);setExag(true);}},
 {zh:'中性轴:梁的肚子里必有一层不伸不缩,应力在这里过零',en:'The neutral axis: one layer inside the beam neither stretches nor shortens — stress crosses zero there',
  act(){setMode('ss');setLoad(18);}},
 {zh:'离中性轴越远,应力越大:最外缘的纤维扛走全部脏活',en:'Stress climbs away from the axis: the outermost fibers do all the dirty work',
  act(){setLoad(30);}},
 {zh:'换工字截面:同样的材料搬到远处,惯性矩与刚度飙升',en:'Swap to the I-section: same material moved outward — inertia and stiffness jump',
  act(){setSection('i');setLoad(18);}},
 {zh:'跨度拉满:挠度按跨度的四次方暴涨,压得梁直不起腰',en:'Span to the max: deflection explodes with the fourth power of span',
  act(){setSection('rect');setSpan(10);setLoad(30);}},
 {zh:'空心圆截面:竹子把芯掏空,轻而刚,一个道理',en:'Hollow tube: bamboo empties its core — light yet stiff, same logic',
  act(){setSection('hollow');setSpan(6);setLoad(16);}},
 {zh:'悬臂对照:固定端弯矩最大,拉压两侧整个对调',en:'Cantilever contrast: the fixed end takes the worst moment, tension and compression swap sides',
  act(){setMode('cant');setSpan(4);setLoad(14);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stP').innerHTML=loadP.toFixed(0)+'<small> kN</small>';
  const s=sigmaMax(),d=deflMM();
  const sv=document.getElementById('stS');
  sv.innerHTML=s.toFixed(0)+'<small> MPa</small>';
  sv.className='v '+(s>320?'warn':'ok');
  const dv=document.getElementById('stD');
  dv.innerHTML=d>=1000?(d/1000).toFixed(2)+'<small> m</small>':d.toFixed(1)+'<small> mm</small>';
  dv.className='v '+(d>240?'warn':'ok');
  document.getElementById('stI').innerHTML='×'+SECT[section].I.toFixed(1);
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSS').addEventListener('click',()=>setMode('ss'));
document.getElementById('bCant').addEventListener('click',()=>setMode('cant'));
document.getElementById('bRect').addEventListener('click',()=>setSection('rect'));
document.getElementById('bI').addEventListener('click',()=>setSection('i'));
document.getElementById('bHollow').addEventListener('click',()=>setSection('hollow'));
document.getElementById('sLoad').addEventListener('input',e=>setLoad(+e.target.value));
document.getElementById('sSpan').addEventListener('input',e=>setSpan(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglExag').addEventListener('change',e=>{exag=e.target.checked;updateBeam();});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 梁段应力染色(热度∝弯矩)+ 受载微振 */
  const w=deflWorld();
  for(let i=0;i<NS;i++){
    const xi=segXi(i);
    const mFrac=mode==='ss'?1-Math.abs(xi-0.5)*2:(1-xi);
    const sF=clamp(loadP/40,0,1)*mFrac;
    const pulse=0.5+0.5*Math.sin(simT*3.5+i*0.55);
    segMats[i].emissive.setHex(0xd8a03c);
    segMats[i].emissiveIntensity=sF*0.5*pulse;
    segMats[i].color.copy(C_BASE).lerp(C_HOT,sF*0.45*(0.5+0.5*pulse));
    segs[i].position.y=segBaseY[i]+w*0.045*Math.sin(simT*7+xi*5)*mFrac;
  }
  /* 力流粒子沿弯曲的中性轴流动,速度随荷载 */
  for(let i=0;i<NPF;i++){
    const u=(simT*(0.05+loadP/260)+flowOff[i])%1;
    const x=(u-0.5)*spanM;
    m4.makeTranslation(x,curveY(x),0.34);
    flow.setMatrixAt(i,m4);
  }
  flow.instanceMatrix.needsUpdate=true;
  /* 荷载箭头呼吸 */
  arrow.position.y=curveY(arrow.position.x)+0.18+0.05*Math.sin(simT*3.2);
  arrM.emissiveIntensity=0.25+0.15*Math.sin(simT*3.2);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
