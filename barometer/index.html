<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大气压与真空 · 760 毫米的水银柱</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>

<div id="title">
  <h1 data-zh="大气压与真空 · 760 毫米的水银柱" data-en="Atmospheric Pressure &amp; Vacuum · The 760 mm Column">大气压与真空 · 760 毫米的水银柱</h1>
  <div class="sub" data-zh="大气有重量:海平面 ≈101.325 kPa,每平方厘米压着约 1 kg 空气(10 N/cm²)→托里拆利倒置水银管:柱高只有 760 mm,P=ρgh=13546×9.8×0.76≈101 kPa,管顶上方是真空;换成水要 10.33 m——虹吸管 10 m 天花板是同一笔账→海拔升高,气压按 p=p₀·e^(−h/8.4 km) 指数衰减,珠峰 8848 m 只剩 ≈35 kPa、约 1/3→沸点=环境压强下的饱和蒸气压:海平面 100 °C,4000 m 高原 ~87 °C,煮饭夹生,高压锅反着提高气压→马德堡半球:16 匹马对拉才分开——没有「吸力」,只有外面大气压在推;真空泵旋片压缩排气,「吸」的真相永远是大压差把物体推向低压侧 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Air has weight: ≈101.325 kPa at sea level, about 1 kg pressing on every cm² (10 N/cm²) → Torricelli inverted his mercury tube: only 760 mm stands, P=ρgh=13546×9.8×0.76≈101 kPa, vacuum above; water would need 10.33 m — the 10 m siphon ceiling is the same bill → pressure decays as p=p₀·e^(−h/8.4 km); Everest at 8848 m keeps ≈35 kPa, about one third → boiling point = vapor pressure at ambient: 100 °C at sea level, ~87 °C at 4000 m — rice stays raw, pressure cookers push back → Magdeburg hemispheres needed 16 horses — there is no suction, only outside air pushing; a pump just compresses gas out, and sucking is always a pressure difference pushing toward the low side · 3D interactive demo · drag to orbit · Space = run/pause">大气压与真空 · 760 毫米的水银柱</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 22, 80);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('大气压与真空 · 760 毫米的水银柱', 'Atmospheric Pressure & Vacuum · The 760 mm Column');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
  updateAtmo();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, glErr = '';
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) { glErr = (e && e.message) || String(e); }
if (renderer) {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} else {
  const err = document.createElement('div');
  err.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);color:#ff8787;font-size:14px;text-align:center;padding:30px;';
  err.textContent = L('WebGL 初始化失败,3D 视图已停用(左侧面板与图表仍可用):', 'WebGL failed to start; 3D disabled (panel and plot still work):') + ' ' + glErr;
  document.body.appendChild(err);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = renderer ? new THREE.PMREMGenerator(renderer) : null;
scene.environment = pmrem ? pmrem.fromScene(new RoomEnvironment(), 0.04).texture : null;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 260);
camera.position.set(4.2, 1.8, 5.6);
const controls = new OrbitControls(camera, renderer ? renderer.domElement : labelRenderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 90;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(6, 9, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff, 0.3);

    for (const p of [100, 50, 0]) {

    ctx.strokeStyle = '#4dabf7'; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let p = 2; p <= 101.5; p += 1) {
      const t = 100 + Math.log(p / P0) / KB;
      p === 2 ? ctx.moveTo(xOf(p), yOf(t)) : ctx.lineTo(xOf(p), yOf(t));
    }
    ctx.stroke();
    ctx.fillStyle = '#ffa94d';
    const p4k = P0 * Math.exp(-4000 / H_SCALE);
    ctx.beginPath(); ctx.arc(xOf(p4k), yOf(87), 5, 0, 6.29); ctx.fill();
    ctx.fillText(L('4000 m ~87 °C', '4000 m ~87 °C'), xOf(p4k) - 40, yOf(87) - 10);
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath(); ctx.arc(xOf(P()), yOf(TB()), 6, 0, 6.29); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.stroke();
  }
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elAlt = document.getElementById('sAlt'), elAltVal = document.getElementById('sAltVal');
const elVac = document.getElementById('sVac'), elVacVal = document.getElementById('sVacVal');
const stP = document.getElementById('stP'), stHg = document.getElementById('stHg'), stW = document.getElementById('stW'),
  stB = document.getElementById('stB'), stF = document.getElementById('stF');
const formulaEl = document.getElementById('formula');
const btnScA = document.getElementById('btnScA'), btnScB = document.getElementById('btnScB'), btnScC = document.getElementById('btnScC'),
  btnEverest = document.getElementById('btnEverest'), btnPump = document.getElementById('btnPump'), btnUnit = document.getElementById('btnUnit');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elAlt.value = Math.round(alt); elAltVal.textContent = Math.round(alt) + ' m';
  elVac.value = Math.round(vac * 100); elVacVal.textContent = Math.round(vac * 100) + ' %';
}
function syncBtns() {
  btnScA.classList.toggle('on', sceneIdx === 0);
  btnScB.classList.toggle('on', sceneIdx === 1);
  btnScC.classList.toggle('on', sceneIdx === 2);
  btnUnit.textContent = L('单位:' + UNITS[unitIdx], 'Unit: ' + UNITS[unitIdx]);
}
function updateStats() {
  const p = P(), mm = MM(), tb = TB();
  stP.textContent = unitIdx === 0 ? p.toFixed(1) + ' kPa' : unitIdx === 1 ? mm.toFixed(0) + ' mmHg' : (p / P0).toFixed(3) + ' atm';
  stP.className = 'v ' + (p > 90 ? 'ok' : p > 45 ? 'warn' : 'bad');
  stHg.textContent = mm.toFixed(0) + ' mm';
  stHg.className = 'v ' + (mm > 700 ? 'ok' : mm > 350 ? 'warn' : 'bad');
  stW.textContent = MW().toFixed(1) + ' m';
  stW.className = 'v warn';
  stB.textContent = tb.toFixed(1) + ' °C';
  stB.className = 'v ' + (tb > 97 ? 'ok' : tb > 80 ? 'warn' : 'bad');
  stF.textContent = FORCE() > 1000 ? (FORCE() / 1000).toFixed(1) + ' kN' : FORCE().toFixed(0) + ' N';
  stF.className = 'v ' + (FORCE() > 15000 ? 'bad' : FORCE() > 1000 ? 'warn' : '');
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>P=ρgh</b> = 13546 kg/m³ × 9.8 × 0.76 m ≈ 101 kPa;水柱等效 = p×1000/9.8(海平面 ≈ 10.33 m)<br>` +
    `<b>p = p₀·e^(−h/H)</b>,H≈8.4 km:珠峰 8848 m → ≈35 kPa ≈ 266 mmHg,只剩 1/3<br>` +
    `<b>沸点 = 环境压强下的饱和蒸气压</b>:海平面 100 °C · 4000 m ~87 °C · 珠峰 ~72 °C<br>` +
    `<b>F = Δp·A</b>,A=π×0.3²(演示模型):95% 真空 ≈ 2.7×10⁴ N——16 匹马都拉不开`,
    `<b>P=ρgh</b> = 13546 kg/m³ × 9.8 × 0.76 m ≈ 101 kPa; water column = p×1000/9.8 (≈10.33 m at sea level)<br>` +
    `<b>p = p₀·e^(−h/H)</b>, H≈8.4 km: Everest 8848 m → ≈35 kPa ≈ 266 mmHg, one third left<br>` +
    `<b>Boiling = vapor pressure at ambient</b>: 100 °C sea level · ~87 °C at 4000 m · ~72 °C on Everest<br>` +
    `<b>F = Δp·A</b>, A=π×0.3² (demo model): 95% vacuum ≈ 2.7×10⁴ N — beyond 16 horses`);
}
function updateAtmo() {
  const mm = MM();
  const f = mm / 760;
  colTopDisc.scale.y = Math.max(0.02, f);
  vacZone.scale.y = Math.max(0.03, (2.0 - COLH * f) / 1.0);
  vacZone.position.y = Y_SURF + COLH * f + (2.0 - COLH * f) / 2;
  lblCol.position.set(-0.45, Y_SURF + 0.12 + COLH * f, 0.2);
  /* 山地:登山者沿坡、锅跟随、对比柱 */
  const g = alt / 9000;
  climber.position.set(lerp2(-2.6, 2.38, g), lerp2(-2.5, 4.82, g), 1.7);
  pot.position.set(climber.position.x + 0.45, climber.position.y + 0.08, climber.position.z + 0.1);
  barHg.scale.y = Math.max(0.02, f * 2.2);
  barH2O.scale.y = Math.max(0.02, MW() / 10.33 * 2.2);
}
function lerp2(a, b, f) { return a + (b - a) * f; }
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot(); updateAtmo();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elAlt.addEventListener('input', () => { alt = +elAlt.value; altTgt = null; if (playing) { playing = false; setPlayLabel(); } syncSliders(); updateStats(); updateAtmo(); drawPlot(); });
elVac.addEventListener('input', () => { vac = +elVac.value / 100; pumpT = -1; syncSliders(); updateStats(); });
btnScA.addEventListener('click', () => setScene(0, [4.2, 1.8, 5.6], [0, -0.2, 0]));
btnScB.addEventListener('click', () => setScene(1, [1.5, 6.5, 14.5], [0, 1.5, 0]));
btnScC.addEventListener('click', () => setScene(2, [5.2, 2.4, 7.6], [0, -0.2, 0]));
btnEverest.addEventListener('click', () => { altTgt = 8848; });
btnPump.addEventListener('click', () => { if (pumpT < 0) pumpT = 0; });
btnUnit.addEventListener('click', () => { unitIdx = (unitIdx + 1) % 3; syncBtns(); updateStats(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglVac').addEventListener('change', e => { vacGlow = e.target.checked; vacZone.visible = vacGlow; });
document.getElementById('tglBP').addEventListener('change', e => { bpMode = e.target.checked; drawPlot(); document.getElementById('plot').querySelector('h3').dataset.zh = bpMode ? '沸点=环境压强下的饱和蒸气压:100 °C 只在海平面;动点=当前气压与沸点' : '气压随海拔指数衰减:珠峰(8848 m)只剩海平面约 1/3;动点=当前海拔'; document.getElementById('plot').querySelector('h3').dataset.en = bpMode ? 'boiling = vapor pressure at ambient: 100 °C only at sea level; dot = current pressure and boiling point' : 'pressure decays exponentially with altitude: Everest keeps about a third; dot = current altitude'; document.getElementById('plot').querySelector('h3').textContent = L(document.getElementById('plot').querySelector('h3').dataset.zh, document.getElementById('plot').querySelector('h3').dataset.en); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer && renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null, tm = 0;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dtA = dt0 * speedMul;
  tm += dtA;
  if (notifyT > 0) notifyT -= dt0;
  /* 海拔动画(珠峰预设/步骤/自动扫描) */
  if (altTgt !== null) {
    alt += (altTgt - alt) * Math.min(1, dtA * 3.2);
    if (Math.abs(altTgt - alt) < 8) { alt = altTgt; altTgt = null; }
    syncSliders(); updateStats(); updateAtmo();
  } else if (playing && pumpT < 0) {
    alt = (0.5 - 0.5 * Math.cos(tm * 2 * Math.PI / 26)) * 9000;
    syncSliders(); updateStats(); updateAtmo();
  }
  /* 抽气动画 */
  if (pumpT >= 0) {
    pumpT += dtA / 4.5;
    if (pumpT >= 1) { pumpT = -1; vac = 0.95; }
    else vac = ease(Math.min(1, pumpT)) * 0.95;
    syncSliders(); updateStats();
  }
  /* 抽气容器粒子 */
  if (sceneIdx === 2) {
    const nVis = Math.round(NP * (1 - vac * 0.96));
    for (let i = 0; i < NP; i++) {
      const s = seeds[i];
      if (i < nVis) {
        _V.set(s.p.x + 0.05 * Math.sin(tm * s.sp + s.ph), s.p.y + 0.05 * Math.sin(tm * s.sp * 1.3 + s.ph * 2), s.p.z + 0.05 * Math.cos(tm * s.sp + s.ph));
        _M4.compose(_V.add(PART_C), _Q.identity(), _S1);
      } else _M4.compose(_V.set(0, -99, 0), _Q.identity(), _S1.set(0.001, 0.001, 0.001));
      partMesh.setMatrixAt(i, _M4);
    }
    _S1.set(1, 1, 1);
    partMesh.instanceMatrix.needsUpdate = true;
    /* 半球间隙与马队发力 */
    const gap = Math.max(0, 0.55 * (1 - vac / 0.1));
    hemiL.position.x = -0.02 - gap / 2;
    hemiR.position.x = 0.02 + gap / 2;
    rimL.position.x = hemiL.position.x;
    rimR.position.x = hemiR.position.x;
    ropeL.position.x = -0.9 - gap / 2;
    ropeR.position.x = 0.9 + gap / 2;
    const strain = vac;
    for (const h of horses) {
      h.g.rotation.z = strain * 0.09 * Math.sin(tm * 4 + h.ph);
      h.g.rotation.x = strain * 0.06 * Math.sin(tm * 5 + h.ph * 2);
    }
    vacM.opacity = 0.13 + 0.05 * Math.sin(tm * 3);
  }
  if (sceneIdx === 0) vacZone.visible = vacGlow;
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.06) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
grpA.visible = sceneIdx === 0;
grpB.visible = sceneIdx === 1;
grpC.visible = sceneIdx === 2;
vacZone.visible = vacGlow;
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
