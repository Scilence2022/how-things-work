<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高原适应与 EPO · 缺氧如何造出更多红细胞</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffb454;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a06a12;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(255,180,84,.9); color: #ffe0ae; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 224px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 254px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: var(--acc); }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.p { color: #d0bfff; border-color: rgba(151,117,250,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,180,84,.6); background: rgba(255,180,84,.12); color: var(--text); }
  .abtn.dope { border-color: rgba(255,107,107,.55); color: #ff8787; }
  .abtn.dope.on { background: rgba(255,107,107,.16); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(160,106,18,.55); background: rgba(160,106,18,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #marks { display: flex; gap: 6px; margin-top: -2px; padding-left: 100px; flex-wrap: wrap; }
  #marks button { appearance: none; font: inherit; font-size: 10.5px; cursor: pointer;
    color: var(--text2); background: transparent; border: 1px dashed var(--tool-border);
    border-radius: 999px; padding: 1px 8px; }
  #marks button:hover { color: var(--acc); border-color: var(--acc); }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,180,84,.10); border-color: rgba(255,180,84,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(160,106,18,.08); border-color: rgba(160,106,18,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="高原适应与 EPO:缺氧信号如何造出更多红细胞" data-en="Altitude Acclimatization & the EPO Loop: how hypoxia builds more red cells">高原适应与 EPO:缺氧信号如何造出更多红细胞</h1>
  <div class="sub" data-zh="海拔升 → 吸入氧分压跌 → 血氧饱和度掉 → 肾脏 HIF 感知缺氧、泵出 EPO → 骨髓加班造红细胞 → 氧含量 = 饱和度 × 携带能力,追回平原 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Altitude up → inspired PO₂ falls → SpO₂ sags → kidney HIF senses hypoxia, pumps EPO → marrow ramps red-cell output → content = saturation × carrying capacity, sea level regained · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">海拔升 → 吸入氧分压跌 → 血氧饱和度掉 → 肾脏 HIF 感知缺氧、泵出 EPO → 骨髓加班造红细胞 → 氧含量 = 饱和度 × 携带能力,追回平原 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="动脉血氧饱和度" data-en="SpO₂">动脉血氧饱和度</span><span class="v ok" id="stSp">—</span>
  <span class="k" data-zh="氧含量" data-en="O₂ content">氧含量</span><span class="v" id="stCt">—</span>
  <span class="k" data-zh="EPO 速率" data-en="EPO rate">EPO 速率</span><span class="v" id="stEpo">—</span>
  <span class="k" data-zh="红细胞压积" data-en="hematocrit">红细胞压积</span><span class="v" id="stHct">—</span>
  <span class="k" data-zh="呼吸频率" data-en="resp. rate">呼吸频率</span><span class="v" id="stRr">—</span>
</div>

<div id="plot">
  <h3 data-zh="SpO₂(蓝)· 压积(橙)· EPO(紫)· 虚线=88% 缺氧线" data-en="SpO₂ (blue) · Hct (orange) · EPO (violet) · dashed = 88% hypoxia line">SpO₂(蓝)· 压积(橙)· EPO(紫)· 虚线=88% 缺氧线</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="SpO₂ 血氧饱和度" data-en="SpO₂ saturation">SpO₂ 血氧饱和度</span>
    <span class="chip.o" data-zh="压积 红细胞占比" data-en="Hct red-cell fraction">压积 红细胞占比</span>
    <span class="chip.p" data-zh="EPO 促红细胞生成素" data-en="EPO erythropoietin">EPO 促红细胞生成素</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnAcute" data-zh="急性(数小时)" data-en="acute (hours)">急性(数小时)</button>
    <button class="abtn" id="btnChronic" data-zh="慢性(数周)" data-en="chronic (weeks)">慢性(数周)</button>
    <button class="abtn dope" id="btnDope" data-zh="注射 EPO(兴奋剂)" data-en="inject EPO (doping)">注射 EPO(兴奋剂)</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="海拔" data-en="Altitude">海拔</label><input id="alt" type="range" min="0" max="5000" step="10" value="0"><span class="val" id="altVal">0 m</span></div>

    <button data-alt="0" data-zh="平原 0 m" data-en="sea 0 m">平原 0 m</button>
    <button data-alt="3650" data-zh="拉萨 3650 m" data-en="Lhasa 3650 m">拉萨 3650 m</button>
    <button data-alt="5000" data-zh="珠峰大本营 ~5000 m" data-en="Everest BC ~5000 m">珠峰大本营 ~5000 m</button>
  </div>
  <div class="row"><label data-zh="时间轴" data-en="Timeline">时间轴</label><input id="tm" type="range" min="0" max="30" step="0.02" value="0"><span class="val" id="tmVal">0 天</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>

  <div id="ctrl">
    <button id="play">暂停</button>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../hemoglobin-mwc/" data-zh="血红蛋白怎么装氧" data-en="how hemoglobin loads O₂">血红蛋白怎么装氧</a>
    <a href="../alveoli/" data-zh="氧分压从哪里来" data-en="where PO₂ comes from">氧分压从哪里来</a>
    <a href="../insulin-glucagon/" data-zh="同款负反馈环" data-en="same feedback loop, glucose edition">同款负反馈环</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.shell.color.set(THEME === 'light' ? 0xc99a9a : 0x8a5a5a);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('高原适应与 EPO', 'Altitude Acclimatization & the EPO Loop');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setModeBtns();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.3, 1.5, 7.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.12,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  shell: mat(0x8a5a5a, { opacity: 0.09, side: THREE.BackSide, depthWrite: false, emissiveIntensity: 0 }),
  lung: mat(0xd98a8a, { opacity: 0.5, roughness: 0.35 }),
  alv: mat(0xffe0b8, { opacity: 0.85, emissiveIntensity: 0.3 }),
  airway: mat(0xc4b5a0, { opacity: 0.8 }),
  heart: mat(0xc94f4f, { opacity: 0.92, roughness: 0.3 }),
  vessel: mat(0x8f2d3c, { opacity: 0.55, roughness: 0.25, emissiveIntensity: 0.05 }),
  kidney: mat(0x9c3a3a, { opacity: 0.95, roughness: 0.4 }),
  bone: mat(0xe8dfc8, { opacity: 0.95, roughness: 0.55, side: THREE.DoubleSide }),
  marrow: mat(0xd4562e, { opacity: 0.9, emissiveIntensity: 0.15 }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.6, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -1.05;
scene.add(base);

/* ================= 身体剖面:肺(上) 肾(左下) 骨髓(右) 血管环路 ================= */
const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), M.shell);
shell.scale.set(2.55, 2.15, 1.4);
shell.position.y = 0.95;
scene.add(shell);

const lungs = [];
for (const s of [-1, 1]) {
  const lung = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), M.lung);
  lung.scale.set(0.52, 0.82, 0.44);
  lung.position.set(s * 0.95, 2.05, -0.05);
  scene.add(lung);
  lungs.push(lung);
}
const trachea = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.85, 12), M.airway);
trachea.position.set(0, 2.7, 0);
scene.add(trachea);
for (const s of [-1, 1]) {
  const bron = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.7, 10), M.airway);

function nearestU(target) {
  let best = 0, bd = 1e9;
  for (let i = 0; i <= 600; i++) {
    const u = i / 600;
    const d = curve.getPointAt(u).distanceToSquared(target);
    if (d < bd) { bd = d; best = u; }

  return best;
}

/* ================= 状态与生理模型 ================= */
const DAY_RATE = 0.35;                 // speed 1 时每秒推进 0.35 模拟天
const pBaro = alt => 760 * Math.exp(-alt / 8400);
const pIO2 = alt => 0.209 * (pBaro(alt) - 47);
const satOf = pa => 1 / (1 + Math.pow(26.6 / Math.max(pa, 6), 2.7));
const P50 = 26.6, HILL_N = 2.7;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;

let mode = qs.get('mode') === 'acute' ? 'acute' : 'chronic';
let alt = clamp(qsFloat('alt', 0), 0, 5000);
let tSim = 0, respRate = 14, paCO2 = 40, epo = 1, hct = 45, doped = false;
let sampleAcc = 0, epoAcc = 0, newAcc = 0, o2Acc = 0;
const NSAMP = 240;
const histSp = [], histHct = [], histEpo = [];
const TMAX = () => mode === 'acute' ? 2 : 30;
const SAMPLE_DT = () => mode === 'acute' ? 0.02 : 0.125;

function pAO2() { return Math.max(8, pIO2(alt) - paCO2 * 1.05); }
function spO2() { return satOf(pAO2()); }
function content() { return 0.453 * hct * spO2() + 0.003 * pAO2(); }

function physStep(dd) {
  const sp = spO2();
  const rrTgt = 14 + 13 * clamp((92 - sp * 100) / 22, 0, 1);
  respRate += (rrTgt - respRate) * (1 - Math.exp(-dd / 0.08));
  const co2Tgt = 40 - 22 * clamp(alt / 5000, 0, 1) * (0.55 + 0.45 * clamp((95 - sp * 100) / 15, 0, 1));
  paCO2 += (co2Tgt - paCO2) * (1 - Math.exp(-dd / 0.6));
  const epoTgt = doped ? 9 : 1 + 11 * Math.pow(clamp((93 - sp * 100) / 12, 0, 1), 1.3);
  epo += (epoTgt - epo) * (1 - Math.exp(-dd / 0.15));
  hct = clamp(hct + (0.06 * (epo - 1) - 0.045 * Math.max(0, hct - 45.5)) * dd, 40, 68);
}
function pushSample() {
  histSp.push(spO2() * 100); histHct.push(hct); histEpo.push(epo);
  if (histSp.length > NSAMP) { histSp.shift(); histHct.shift(); histEpo.shift(); }
}
function resetState() {
  tSim = 0; respRate = 14; paCO2 = 40; epo = 1; hct = 45;
  sampleAcc = 0; histSp.length = histHct.length = histEpo.length = 0;
}
function fastForward(days) {
  const limit = tSim + days;
  let guard = 0;
  while (tSim < limit && guard++ < 9000) {
    physStep(0.01); tSim += 0.01;
    sampleAcc += 0.01;
    if (sampleAcc >= SAMPLE_DT()) { sampleAcc -= SAMPLE_DT(); pushSample(); }
  }
}
function instantSim(days, altOverride) {
  resetState();
  if (altOverride !== undefined) { alt = clamp(altOverride, 0, 5000); syncAltUI(); }
  fastForward(clamp(days, 0, TMAX()) - tSim);
}
function syncAltUI() {
  const el = document.getElementById('alt');
  el.value = Math.round(alt);
  document.getElementById('altVal').textContent = Math.round(alt) + ' m';
}

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 30, padR = 14;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const span = NSAMP * SAMPLE_DT();
  const xOf = i => pad + (W - pad - padR) * i / (NSAMP - 1);
  const yPct = v => pad + (H - pad - 10) * (1 - clamp(v, 0, 100) / 100);
  const yHct = v => yPct((v - 30) / 40 * 100);
  /* 88% 缺氧线 */
  ctx.strokeStyle = 'rgba(255,107,107,.55)'; ctx.lineWidth = 2; ctx.setLineDash([8, 7]);
  ctx.beginPath(); ctx.moveTo(pad, yPct(88)); ctx.lineTo(W - padR, yPct(88)); ctx.stroke();
  ctx.setLineDash([]);
  /* 轴 */
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - 10); ctx.lineTo(W - padR, H - 10); ctx.stroke();
  /* EPO 条 */
  for (let i = 0; i < histEpo.length; i++) {
    const h = clamp(histEpo[i] / 10, 0, 1) * (H - pad - 10) * 0.3;
    ctx.fillStyle = 'rgba(151,117,250,.55)';
    ctx.fillRect(xOf(i) - 1.5, H - 10 - h, 3, h);
  }
  /* Hct */
  ctx.strokeStyle = '#ffb454'; ctx.lineWidth = 3.5;
  ctx.beginPath();
  for (let i = 0; i < histHct.length; i++) { i ? ctx.lineTo(xOf(i), yHct(histHct[i])) : ctx.moveTo(xOf(i), yHct(histHct[i])); }
  ctx.stroke();
  /* SpO2 */
  ctx.strokeStyle = '#74c0fc'; ctx.lineWidth = 3.5;
  ctx.beginPath();
  for (let i = 0; i < histSp.length; i++) { i ? ctx.lineTo(xOf(i), yPct(histSp[i])) : ctx.moveTo(xOf(i), yPct(histSp[i])); }
  ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '18px system-ui';
  ctx.fillText('100%', pad - 34, pad + 4);
  ctx.fillText('88%', pad - 30, yPct(88) + 6);
  const t0 = L('最近 ', 'last ');
  ctx.fillText(t0 + (mode === 'acute' ? (span * 24).toFixed(0) + ' h' : span.toFixed(0) + L(' 天', ' d')), W - 150, H + 1);
}

  drawPlot();
});

/* ---------------- 粒子驱动 ---------------- */
const rbcState = Array.from({ length: 110 }, () => ({
  u: Math.random(), off: (Math.random() - 0.5) * 0.09, ph: Math.random() * Math.PI * 2, spd: 0.055 + Math.random() * 0.02 }));
const epoState = Array.from({ length: 44 }, () => ({ t: -1, seed: Math.random() }));
const newState = Array.from({ length: 26 }, () => ({ t: -1, seed: Math.random() }));
const o2State = Array.from({ length: 26 }, () => ({ t: -1, seed: Math.random() }));
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tan = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);
const Q0 = new THREE.Quaternion();
const rbcColor = new THREE.Color(), cVen = new THREE.Color(0x7a1f1f), cArt = new THREE.Color(0xe04545);

function updateParticles(dt, vis) {
  /* 红细胞沿环流 */
  for (let i = 0; i < 110; i++) {
    const r = rbcState[i];
    r.u = wrap(r.u + vis * r.spd * (0.7 + respRate / 45));
    curve.getPointAt(r.u, tmpA);
    curve.getTangentAt(r.u, tan);
    tmpB.copy(tan).cross(UP).normalize().multiplyScalar(r.off);
    tmpA.add(tmpB);
    tmpA.y += Math.sin(performance.now() / 700 + r.ph) * 0.012;
    dummy.position.copy(tmpA);
    dummy.quaternion.setFromUnitVectors(UP, tan);
    dummy.scale.set(1, 0.6, 0.45);
    dummy.updateMatrix();
    rbcIM.setMatrixAt(i, dummy.matrix);
    rbcIM.setColorAt(i, rbcColor);
  }
  rbcIM.instanceMatrix.needsUpdate = true;
  if (rbcIM.instanceColor) rbcIM.instanceColor.needsUpdate = true;
  /* EPO:肾 → 血管 → 随流去骨髓 */
  epoAcc += vis * (clamp(epo - 1, 0, 9) * 1.3 + (doped ? 9 : 0)) * 0.35;
  if (epoAcc >= 1) { epoAcc = 0; const s = epoState.find(x => x.t < 0); if (s) s.t = 0; }
  for (let i = 0; i < 44; i++) {
    const s = epoState[i];
    if (s.t >= 0) {
      s.t += vis * 0.4;
      if (s.t < 0.22) tmpA.lerpVectors(kidneyPos, curve.getPointAt(uKid, tmpB), s.t / 0.22);
      else if (s.t < 1) curve.getPointAt(wrap(uKid + (s.t - 0.22) / 0.78 * (wrap(uMar - uKid + 1))), tmpA);
      else s.t = -1;
      dummy.position.copy(s.t >= 0 ? tmpA : tmpB.set(0, -10, 0));
      dummy.quaternion.identity();
      dummy.scale.setScalar(s.t >= 0 ? 0.8 + 0.5 * Math.sin(Math.PI * clamp(s.t, 0, 1)) : 0.001);
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.001); dummy.quaternion.identity(); }
    dummy.updateMatrix();
    epoIM.setMatrixAt(i, dummy.matrix);
  }
  epoIM.instanceMatrix.needsUpdate = true;
  /* 新生红细胞:骨髓弹出 */
  newAcc += vis * clamp(epo - 1, 0, 9) * 0.5;
  if (newAcc >= 1) { newAcc = 0; const s = newState.find(x => x.t < 0); if (s) s.t = 0; }
  for (let i = 0; i < 26; i++) {
    const s = newState[i];
    if (s.t >= 0) {
      s.t += vis * 0.55;
      if (s.t < 0.35) tmpA.lerpVectors(marrowPos, curve.getPointAt(uMar, tmpB), s.t / 0.35);
      else if (s.t < 1) curve.getPointAt(wrap(uMar + (s.t - 0.35) / 0.65 * 0.08), tmpA);
      else s.t = -1;
      dummy.position.copy(s.t >= 0 ? tmpA : tmpB.set(0, -10, 0));
      dummy.quaternion.identity();
      dummy.scale.setScalar(s.t >= 0 ? 0.9 : 0.001);
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.001); dummy.quaternion.identity(); }
    dummy.updateMatrix();
    newIM.setMatrixAt(i, dummy.matrix);
  }
  newIM.instanceMatrix.needsUpdate = true;
  /* O₂:肺泡 → 血(下坡速度看分压差) */
  o2Acc += vis * clamp((pAO2() - 35) / 60, 0.08, 1) * 2.2;
  if (o2Acc >= 1) { o2Acc = 0; const s = o2State.find(x => x.t < 0); if (s) s.t = 0; }
  for (let i = 0; i < 26; i++) {
    const s = o2State[i];
    if (s.t >= 0) {
      s.t += vis * 0.5;
      if (s.t < 0.4) tmpA.lerpVectors(alvPos, curve.getPointAt(uAlv, tmpB), s.t / 0.4);
      else if (s.t < 1) curve.getPointAt(wrap(uAlv + (s.t - 0.4) / 0.6 * 0.05), tmpA);
      else s.t = -1;
      dummy.position.copy(s.t >= 0 ? tmpA : tmpB.set(0, -10, 0));
      dummy.quaternion.identity();
      dummy.scale.setScalar(s.t >= 0 ? 0.9 : 0.001);
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.001); dummy.quaternion.identity(); }
    dummy.updateMatrix();
    o2IM.setMatrixAt(i, dummy.matrix);
  }
  o2IM.instanceMatrix.needsUpdate = true;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 1, colorAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const vis = dt * speed;
  const dday = playing ? vis * DAY_RATE : 0;
  if (playing && dday > 0) {
    physStep(dday);
    tSim += dday;
    if (tSim > TMAX()) tSim = 0;
    sampleAcc += dday;
    while (sampleAcc >= SAMPLE_DT()) { sampleAcc -= SAMPLE_DT(); pushSample(); }
  }
  updateParticles(dt, vis);
  /* 呼吸 / 心跳 / 腺体脉动(视觉节奏,幅度随生理量) */
  const brAmp = 0.055 + 0.055 * clamp((respRate - 14) / 13, 0, 1);
  const brS = 1 + brAmp * Math.sin(performance.now() / 450);
  for (const l of lungs) l.scale.set(0.52 * brS, 0.82 * brS, 0.44 * brS);
  heart.scale.setScalar(1 + 0.09 * Math.sin(performance.now() / 260));
  alvGrp.scale.setScalar(1 + 0.08 * Math.sin(performance.now() / 450 + 0.5));
  kidney.material.emissiveIntensity = 0.08 + clamp(epo - 1, 0, 9) / 9 * 0.8;
  marrow.material.emissiveIntensity = 0.1 + clamp(epo - 1, 0, 9) / 9 * 0.6;
  /* 读数(约 4 Hz) */
  statsAcc += dt;
  if (statsAcc > 0.25) {
    statsAcc = 0;
    const spPct = spO2() * 100;
    stSp.textContent = spPct.toFixed(0) + ' %';
    stSp.className = 'v ' + (spPct >= 95 ? 'ok' : spPct >= 88 ? 'warn' : 'bad');
    stCt.innerHTML = content().toFixed(1) + ' <small>mL/dL</small>';
    stEpo.textContent = '×' + epo.toFixed(1);
    stEpo.className = 'v ' + (epo > 1.8 ? 'warn' : '');
    stHct.textContent = hct.toFixed(1) + ' %';
    stHct.className = 'v ' + (hct > 55 ? 'bad' : hct > 47.5 ? 'warn' : '');
    stRr.innerHTML = respRate.toFixed(0) + ' <small>/min</small>';
    updateFormula();
    rbcColor.lerpColors(cVen, cArt, clamp((spO2() - 0.6) / 0.38, 0, 1));
    for (let i = 0; i < 110; i++) rbcIM.setColorAt(i, rbcColor);
    if (rbcIM.instanceColor) rbcIM.instanceColor.needsUpdate = true;
    drawPlot();
    elTm.value = Math.min(tSim, TMAX());
    elTmVal.textContent = fmtTm(tSim);
  }
  for (const r of labelReg) if (labelsOn && r.vis()) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
instantSim(clamp(qsFloat('t', 0), 0, TMAX()), alt);
setModeBtns();
elTm.max = TMAX();
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
