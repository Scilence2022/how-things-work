<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN2 反应 · Walden 反转 3D 动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#29a3c9;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--cv-text); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.nu    { border-color: rgba(76,201,240,.9);  color: #bde9ff; }
  .lbl.x     { border-color: rgba(255,159,28,.9);  color: #ffd9a3; }
  .lbl.r     { border-color: rgba(255,255,255,.3); }
  .lbl.ts    { border-color: rgba(255,93,93,.9);   color: #ffc2c2; font-size: 12.5px; }
  .lbl.delta { background: rgba(60,20,20,.7); border-color: rgba(255,93,93,.7); color: #ff9d9d; }
  .lbl.inv   { border-color: rgba(144,190,109,.9); color: #d8f3c0; font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.nu    { border-color: rgba(12,123,166,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.x     { border-color: rgba(156,95,0,.9);   color: #9c5f00; }
  :root[data-theme="light"] .lbl.r     { border-color: rgba(15,25,40,.35); }
  :root[data-theme="light"] .lbl.ts    { border-color: rgba(200,60,60,.9);  color: #b83232; }
  :root[data-theme="light"] .lbl.delta { background: rgba(255,233,233,.85); border-color: rgba(200,60,60,.6); color: #b33535; }
  :root[data-theme="light"] .lbl.inv   { border-color: rgba(90,140,50,.9);  color: #3f6d1c; }

  /* ===== 工具条（全站共享模式） ===== */
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 360px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.nu  { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  .chip.x   { color: #ffd9a3; border-color: rgba(255,159,28,.7); }
  .chip.r   { color: #d8f3c0; border-color: rgba(144,190,109,.7); }
  .chip.dim { color: #b9c4d0; border-color: rgba(255,255,255,.22); }
  :root[data-theme="light"] .chip.nu  { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.x   { color: #9c5f00; border-color: rgba(156,95,0,.7); }
  :root[data-theme="light"] .chip.r   { color: #47701f; border-color: rgba(71,112,31,.7); }
  :root[data-theme="light"] .chip.dim { color: var(--text2); border-color: rgba(15,25,40,.25); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #c9efff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }

  /* 能量曲线（2D 覆盖层） */
  #energy { position: fixed; right: 20px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 8px 10px 4px;
    backdrop-filter: blur(6px); }
  #energy text { font-family: inherit; }
  @media (max-width: 900px) { #energy { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; overflow: auto; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="SN2 反应为什么会翻转构型？—— Walden 反转" data-en="Why does an SN2 reaction invert configuration? — The Walden inversion">SN2 反应为什么会翻转构型？—— Walden 反转</h1>
  <div class="sub" data-zh="3D 交互演示 · 亲核试剂只能从背面 180° 进攻 · 三个基团像雨伞一样被吹翻" data-en="Interactive 3D demo · the nucleophile attacks only from the back, 180° opposite the leaving group · three groups flip like an umbrella">3D 交互演示 · 亲核试剂只能从背面 180° 进攻 · 三个基团像雨伞一样被吹翻</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip nu" data-zh="Nu⁻ 亲核试剂" data-en="Nu⁻ nucleophile">Nu⁻ 亲核试剂</span>
    <span class="chip x" data-zh="Br 离去基团" data-en="Br leaving group">Br 离去基团</span>
    <span class="chip r" data-zh="R₁ R₂ R₃ 三个基团" data-en="R₁ R₂ R₃ groups">R₁ R₂ R₃ 三个基团</span>
    <span class="chip dim" data-zh="一步协同 · 无中间体" data-en="One concerted step · no intermediate">一步协同 · 无中间体</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglAxis" type="checkbox" checked> <span data-zh="180° 进攻轴" data-en="180° attack axis">180° 进攻轴</span></label>
    <label><input id="tglArrows" type="checkbox" checked> <span data-zh="电子流向箭头" data-en="Electron-flow arrows">电子流向箭头</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
  </div>
</div>

<div id="energy">
  <svg id="energySvg" width="292" height="182" viewBox="0 0 292 182"></svg>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数（调试/截图用） ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  if (scene.background) scene.background.set(PAL.bg); else scene.background = new THREE.Color(PAL.bg);
  M.bondC.color.set(THEME === 'light' ? 0x84909e : 0xcfd4dc);      // 浅色下银灰键加深一点
  M.bondC.emissive.set(THEME === 'light' ? 0x84909e : 0xcfd4dc);
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  paintEnergyTheme();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('SN2 反应 · Walden 反转 3D 动画', 'SN2 Reaction · Walden Inversion 3D Animation');
  buildSteps();
  buildEnergy();
  refreshStaticLabels();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 常量：反应几何与时序 ---------------- */
// 时间窗口（tt ∈ [-0.04, 0.96)，一个周期在 0.96 处打点复位）
const CYCLE_SECONDS = 9.0;
const T_APPROACH = [0.06, 0.30];   // Nu⁻ 从远处沿 -z 逼近
const T_TS       = [0.30, 0.50];   // 三角双锥过渡态保持
const T_INVERT   = [0.50, 0.72];   // Br⁻ 离去 + 伞式翻转
const T_HOLD     = 0.88;           // 产物停留至 0.88，随后淡出

const D2R = Math.PI / 180;
const THETA_SP3 = Math.acos(-1 / 3);        // 109.47°
const THETA_SP2 = Math.PI / 2;              // 90°（过渡态赤道面）
const THETA_INV = Math.acos(1 / 3);         // 70.53°（翻转后）
const PHI = [90 * D2R, 210 * D2R, 330 * D2R];   // 三个 R 的方位角
const L_R = 0.95;      // C–R 键长
const L_X0 = 1.15;     // C–Br 初键长
const L_XTS = 1.72;    // 过渡态 C···Br
const L_NU_TS = 1.55;  // 过渡态 Nu···C
const L_NU0 = 0.95;    // 产物 C–Nu
const NU_FAR = 3.8;    // Nu 起始距离

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();   // 背景色由 applyTheme() 按 PAL.bg 设置
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.1, 2.1, 4.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 14;
controls.autoRotateSpeed = 0.7;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 6, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.55);
fill.position.set(-5, 2, -4);
scene.add(fill);

/* ---------------- 材质（全部独立实例，供整周期淡入淡出） ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.05,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const fadeMats = [];   // 参与整周期淡入淡出的材质
function fade(m, baseOp = 1) { m.transparent = true; m.userData.baseOp = baseOp; fadeMats.push(m); return m; }

const M = {
  C:   fade(mat(0x5b6270, { roughness: 0.35, metalness: 0.3 })),
  Nu:  fade(mat(0x4cc9f0, { emissiveIntensity: 0.4 })),
  haloNu: fade(new THREE.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.16,
          depthWrite: false }), 0.16),
  X:   fade(mat(0xff9f1c, { emissiveIntensity: 0.3 })),
  haloX: fade(new THREE.MeshBasicMaterial({ color: 0xff9f1c, transparent: true, opacity: 0.0,
          depthWrite: false }), 0.0),
  R1:  fade(mat(0x90be6d)),
  R2:  fade(mat(0xc77dff)),
  R3:  fade(mat(0xff70a6)),
  bondC:  fade(mat(0xcfd4dc, { roughness: 0.3, metalness: 0.6 })),
  bondCX: fade(mat(0xd8b48a, { roughness: 0.3, metalness: 0.6 })),
  bondCNu: fade(mat(0x9adcf2, { roughness: 0.3, metalness: 0.6 })),
  dot:  fade(new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.9 })),
  arrow: fade(new THREE.MeshBasicMaterial({ color: 0xff5d5d, transparent: true, opacity: 0.95 })),
  axis: fade(new THREE.LineDashedMaterial({ color: 0x8899aa, dashSize: 0.14, gapSize: 0.1,
          transparent: true, opacity: 0.55 })),
};

/* ---------------- 分子对象 ---------------- */
const mol = new THREE.Group();
scene.add(mol);

function sphere(r, m, parent) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), m);
  parent.add(s); return s;
}
const C = sphere(0.30, M.C, mol);
const Nu = sphere(0.26, M.Nu, mol);
const haloNu = sphere(0.46, M.haloNu, mol);
const X = sphere(0.34, M.X, mol);
const haloX = sphere(0.5, M.haloX, mol);
const Rs = PHI.map((_, i) => sphere(0.22, [M.R1, M.R2, M.R3][i], mol));

// 实体键：单位圆柱（高 1，原点在中点），每帧摆位
function stick(m, r) {
  const g = new THREE.CylinderGeometry(r, r, 1, 14);
  const s = new THREE.Mesh(g, m);
  mol.add(s); return s;
}
const stickCX = stick(M.bondCX, 0.062);
const stickCNu = stick(M.bondCNu, 0.062);
const stickCR = PHI.map(() => stick(M.bondC, 0.055));

function placeStick(s, a, b) {
  const d = V3().subVectors(b, a);
  const len = d.length();
  if (len < 1e-4) { s.visible = false; return; }
  s.visible = true;
  s.position.copy(a).addScaledVector(d, 0.5);
  s.scale.set(1, len, 1);
  s.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize());
}
// 点状部分键（过渡态）
const dotGeo = new THREE.SphereGeometry(0.038, 10, 8);
function dottedBond(n = 4) {
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) g.add(new THREE.Mesh(dotGeo, M.dot));
  mol.add(g); return g;
}
const dotsNu = dottedBond(), dotsX = dottedBond();
function placeDots(g, a, b, op) {
  g.visible = op > 0.02;
  if (!g.visible) return;
  g.children.forEach((d, i) => {
    const k = (i + 1) / (g.children.length + 1);
    d.position.lerpVectors(a, b, k);
  });
}

/* ---------------- 进攻轴（180° 虚线） ---------------- */
const axisLine = (() => {
  const g = new THREE.BufferGeometry().setFromPoints([V3(0, 0, -3.6), V3(0, 0, 3.6)]);
  const l = new THREE.Line(g, M.axis);
  l.computeLineDistances();
  mol.add(l); return l;
})();

/* ---------------- 电子流向箭头（弯箭头，逐帧重建） ---------------- */
const dynGeoms = [], dynMeshes = [];
function clearDyn() {
  for (const g of dynGeoms) g.dispose();
  dynGeoms.length = 0;
  for (const m of dynMeshes) mol.remove(m);
  dynMeshes.length = 0;
}
function curvedArrow(p0, p1, p2, r = 0.028) {
  const curve = new THREE.QuadraticBezierCurve3(p0, p1, p2);
  const g = new THREE.TubeGeometry(curve, 24, r, 6, false);
  dynGeoms.push(g);
  const m = new THREE.Mesh(g, M.arrow);
  mol.add(m); dynMeshes.push(m);
  // 箭头锥
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.085, 0.2, 12), M.arrow);
  tip.position.copy(p2);
  tip.quaternion.setFromUnitVectors(V3(0, 1, 0), V3().subVectors(p2, p1).normalize());
  dynGeoms.push(tip.geometry);
  mol.add(tip); dynMeshes.push(tip);
}

/* ---------------- 相位讲解 ---------------- */
const STEPS = [
  { t0: 0.0,  b: '背面进攻', be: 'Backside attack',
    d: 'Nu⁻ 沿 C–Br 键延长线，从溴的正对面 180° 接近——正面被离去基团挡住，且只有背面才能与 σ*(C–Br) 反键轨道对齐。',
    de: 'Nu⁻ approaches along the extension of the C–Br bond, from directly opposite Br (180°) — the front side is blocked by the leaving group, and only the backside aligns with the σ*(C–Br) antibonding orbital.' },
  { t0: 0.30, b: '三角双锥过渡态', be: 'Trigonal-bipyramidal transition state',
    d: '碳上同时排着五个基团：Nu 与 Br 同一直线（轴向），三个 R 共面（赤道）。C–Nu 部分成键、C–Br 部分断裂，协同进行，没有中间体。',
    de: 'Carbon briefly carries five groups: Nu and Br collinear (axial), the three R groups coplanar (equatorial). C–Nu forms while C–Br breaks — one concerted step, no intermediate.' },
  { t0: 0.50, b: '伞式翻转', be: 'Umbrella inversion',
    d: 'Br⁻ 带着一对电子离开；三个 R 像被狂风吹翻的雨伞，经平面构型翻向另一侧——碳的骨架整个翻了过来。',
    de: 'Br⁻ departs with the electron pair; the three R groups flip like an umbrella in a gale, passing through planar and folding to the other side — the carbon skeleton turns inside out.' },
  { t0: 0.72, b: 'Walden 反转完成', be: 'Walden inversion complete',
    d: 'Nu 占据 Br 原来的对侧位置，产物构型与反应物互为镜像；若中心碳是手性碳，R/S 构型翻转。动力学：v = k[Nu⁻][R–Br]，二级反应。',
    de: 'Nu takes the position opposite to where Br was; product and reactant configurations are mirror images. At a chiral center the R/S configuration inverts. Kinetics: v = k[Nu⁻][R–Br], second order.' },
];
function stepIndex(tt) {
  if (tt < 0.30) return 0;
  if (tt < 0.50) return 1;
  if (tt < 0.72) return 2;
  return 3;
}

/* ---------------- 能量曲线（SVG；语言/主题切换时重建重着色） ---------------- */
const svg = document.getElementById('energySvg');
const NS = 'http://www.w3.org/2000/svg';
const E_R = 0.30, E_TS = 0.92, E_P = 0.12;   // 归一化能量
const energyOf = p => {
  const base = lerp(E_R, E_P, p);
  return base + (E_TS - base) * 4 * p * (1 - p);
};
let markerDot, markerLine;
const energyThemed = [];   // { el, attr, get() } — 由 paintEnergyTheme() 着色
function buildEnergy() {
  svg.innerHTML = '';
  energyThemed.length = 0;
  const X0 = 40, X1 = 280, Y0 = 158, Y1 = 16;
  const px = p => lerp(X0, X1, p);
  const py = e => lerp(Y0, Y1, e);
  const el = (tag, attrs, txt) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (txt) n.textContent = txt;
    svg.appendChild(n); return n;
  };
  const themed = (n, attr, get) => { energyThemed.push({ el: n, attr, get }); return n; };
  const axisCol  = () => PAL.axis;
  const dimCol   = () => PAL.dim;
  const curveCol = () => THEME === 'light' ? '#c79100' : '#ffd166';
  const refRCol  = () => THEME === 'light' ? '#2f9cc7' : '#4cc9f0';
  const refPCol  = () => THEME === 'light' ? '#6f9e44' : '#90be6d';
  const refRTxt  = () => THEME === 'light' ? '#17708f' : '#8fd4ee';
  const refPTxt  = () => THEME === 'light' ? '#4a7a22' : '#b5dba0';
  const tsTxt    = () => THEME === 'light' ? '#c23b3b' : '#ffb3b3';
  // 坐标轴
  themed(el('line', { x1: X0, y1: Y0, x2: X1, y2: Y0, 'stroke-width': 1 }), 'stroke', axisCol);
  themed(el('line', { x1: X0, y1: Y0, x2: X0, y2: Y1 - 6, 'stroke-width': 1 }), 'stroke', axisCol);
  themed(el('text', { x: X1 - 4, y: Y0 + 14, 'font-size': 11, 'text-anchor': 'end' },
         L('反应进程', 'Reaction progress')), 'fill', dimCol);
  themed(el('text', { x: X0 - 6, y: Y1 + 2, 'font-size': 11, 'text-anchor': 'middle' },
         L('能量', 'Energy')), 'fill', dimCol);
  // 曲线
  let d = '';
  for (let i = 0; i <= 60; i++) {
    const p = i / 60;
    d += (i ? 'L' : 'M') + px(p).toFixed(1) + ' ' + py(energyOf(p)).toFixed(1);
  }
  themed(el('path', { d, fill: 'none', 'stroke-width': 2 }), 'stroke', curveCol);
  // 参考水平线
  themed(el('line', { x1: X0, y1: py(E_R), x2: X1, y2: py(E_R), 'stroke-width': 0.7, 'stroke-dasharray': '4 4', opacity: 0.6 }), 'stroke', refRCol);
  themed(el('line', { x1: X0, y1: py(E_P), x2: X1, y2: py(E_P), 'stroke-width': 0.7, 'stroke-dasharray': '4 4', opacity: 0.6 }), 'stroke', refPCol);
  themed(el('text', { x: X0 + 2, y: py(E_R) - 4, 'font-size': 10.5 }, L('反应物', 'Reactants')), 'fill', refRTxt);
  themed(el('text', { x: X0 + 2, y: py(E_P) - 4, 'font-size': 10.5 }, L('产物', 'Product')), 'fill', refPTxt);
  themed(el('text', { x: px(0.5), y: py(E_TS) - 6, 'font-size': 10.5, 'text-anchor': 'middle' },
         L('唯一过渡态 ‡（无中间体）', 'Transition state ‡ (no intermediate)')), 'fill', tsTxt);
  // 游标
  markerLine = el('line', { x1: 0, y1: Y0, x2: 0, y2: 0, stroke: '#ff6b6b', 'stroke-width': 0.8, opacity: 0.5 });
  markerDot = el('circle', { cx: 0, cy: 0, r: 4.5, fill: '#ff6b6b' });
  svg._px = px; svg._py = py;
  if (PAL.bg) paintEnergyTheme();
}
function paintEnergyTheme() {
  for (const t of energyThemed) t.el.setAttribute(t.attr, t.get());
}
buildEnergy();

/* ---------------- 标签 ---------------- */
const labelObjs = [];
function addLabel(html, pos, cls = '', target = mol) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.innerHTML = html;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelObjs.push(o);
  return o;
}
const lblNu  = addLabel(L('Nu⁻ 亲核试剂', 'Nu⁻ nucleophile'), V3(0, 0.44, 0), 'nu', Nu);
const lblX   = addLabel(L('Br 离去基团', 'Br leaving group'), V3(0, 0.5, 0), 'x', X);
const lblC   = addLabel(L('中心碳', 'Central C'), V3(0, -0.46, 0), '', C);
const lblR   = Rs.map((r, i) => addLabel('R' + '₁₂₃'[i], V3(0.3, 0.26, 0), 'r', r));
const lblTS  = addLabel(L('三角双锥过渡态 [Nu···C···Br]‡', 'Trigonal-bipyramidal TS [Nu···C···Br]‡'), V3(0, 1.35, 0), 'ts');
const lblDeltaNu = addLabel('δ⁻', V3(0, 0.02, -0.55), 'delta');
const lblDeltaX  = addLabel('δ⁻', V3(0, 0.02, 0.55), 'delta');
const lblInv = addLabel(L('构型已翻转！(伞翻转)', 'Configuration inverted! (umbrella flip)'), V3(0, 1.3, 0), 'inv');
const lbl180 = addLabel('180°', V3(0, 0.05, -2.6), 'r');

function refreshStaticLabels() {   // lblNu/lblX 每帧用 L() 更新，这里刷新其余静态文案
  lblC.element.textContent = L('中心碳', 'Central C');
  lblTS.element.textContent = L('三角双锥过渡态 [Nu···C···Br]‡', 'Trigonal-bipyramidal TS [Nu···C···Br]‡');
  lblInv.element.textContent = L('构型已翻转！(伞翻转)', 'Configuration inverted! (umbrella flip)');
}

/* ---------------- 每帧更新 ---------------- */
function opOf(tt) {   // 整体淡入淡出（tt<0 表示新周期开头）
  return ss(-0.045, 0, tt) * (1 - ss(0.88, 0.945, tt));
}

function updateWorld(tt) {
  const op = opOf(tt);
  for (const m of fadeMats) m.opacity = m.userData.baseOp * op;

  /* --- Nu⁻ 位置 --- */
  let dNu;
  if (tt < T_APPROACH[0]) dNu = NU_FAR;
  else if (tt < T_APPROACH[1]) dNu = lerp(NU_FAR, L_NU_TS, ss(...T_APPROACH, tt));
  else if (tt < T_TS[1]) dNu = lerp(L_NU_TS, 1.5, ss(T_TS[0], T_TS[1], tt));
  else dNu = lerp(1.5, L_NU0, ss(T_INVERT[0], T_INVERT[1], tt));
  Nu.position.set(0, 0, -dNu);
  haloNu.position.copy(Nu.position);

  /* --- Br 位置 --- */
  let dX;
  if (tt < T_TS[0]) dX = L_X0;
  else if (tt < T_TS[1]) dX = lerp(L_X0, L_XTS, ss(...T_TS, tt));
  else if (tt < T_INVERT[1]) dX = lerp(L_XTS, 3.6, ss(T_INVERT[0], T_INVERT[1], tt));
  else dX = lerp(3.6, 5.4, ss(T_INVERT[1], T_HOLD, tt));
  X.position.set(0, 0, dX);
  haloX.position.copy(X.position);

  /* --- 三个 R：伞式翻转（极角 θ 随相位变化） --- */
  let theta;
  if (tt < 0.25) theta = THETA_SP3;
  else if (tt < T_TS[1]) theta = lerp(THETA_SP3, THETA_SP2, ss(0.25, T_TS[1], tt));
  else theta = lerp(THETA_SP2, THETA_INV, ss(T_INVERT[0], T_INVERT[1], tt));
  Rs.forEach((r, i) => {
    r.position.set(L_R * Math.sin(theta) * Math.cos(PHI[i]), L_R * Math.sin(theta) * Math.sin(PHI[i]), L_R * Math.cos(theta));
  });

  /* --- 键 --- */
  placeStick(stickCR[0], C.position, Rs[0].position);
  placeStick(stickCR[1], C.position, Rs[1].position);
  placeStick(stickCR[2], C.position, Rs[2].position);
  // C–X 实体键：离去阶段跟着拉长、变淡
  const xBondOp = tt < T_TS[1] ? 1 : clamp(1 - ss(T_INVERT[0], 0.62, tt), 0, 1);
  M.bondCX.opacity = M.bondCX.userData.baseOp * op * xBondOp;
  stickCX.visible = xBondOp > 0.02 && dX < 2.6;
  if (stickCX.visible) placeStick(stickCX, C.position, X.position);
  // C–Nu：过 TS 后成实体键
  const nuBondOp = tt < T_INVERT[0] ? 0 : ss(T_INVERT[0], 0.62, tt);
  M.bondCNu.opacity = M.bondCNu.userData.baseOp * op * nuBondOp;
  stickCNu.visible = nuBondOp > 0.02;
  if (stickCNu.visible) placeStick(stickCNu, C.position, Nu.position);
  // 部分键点串（只在过渡态窗口出现）
  const partOp = ss(T_TS[0] - 0.06, T_TS[0] + 0.04, tt) * (1 - ss(T_TS[1] - 0.02, T_TS[1] + 0.06, tt)) * op;
  M.dot.opacity = partOp * 0.9;
  placeDots(dotsNu, C.position, Nu.position, partOp);
  placeDots(dotsX, C.position, X.position, partOp);

  /* --- 电荷云 --- */
  M.haloNu.opacity = 0.16 * op * (1 - 0.6 * nuBondOp);
  const xHaloOp = tt < T_INVERT[0] ? 0 : ss(T_INVERT[0], T_INVERT[1], tt);
  M.haloX.opacity = 0.22 * op * xHaloOp;

  /* --- 电子流向箭头 --- */
  clearDyn();
  const a1 = ss(0.10, 0.18, tt) * (1 - ss(0.48, 0.56, tt)) * op;
  const a2 = ss(0.32, 0.4, tt) * (1 - ss(0.66, 0.76, tt)) * op;
  if (tglArrows.checked) {
    if (a1 > 0.02) {   // Nu 的孤对电子 → 中心碳
      M.arrow.opacity = Math.max(M.arrow.userData.baseOp * a1, 0);
      curvedArrow(Nu.position.clone().add(V3(0.16, 0.3, 0.14)),
                  V3(0.55, 0.62, 0.3), V3(0.14, 0.34, -0.1));
    }
    if (a2 > 0.02) {   // C–Br 成键电子对 → Br
      M.arrow.opacity = Math.max(M.arrow.userData.baseOp * a2, 0);
      curvedArrow(V3(0.06, 0.26, dX * 0.42), V3(0.34, 0.5, dX * 0.95), V3(0.12, 0.3, dX * 1.5));
    }
  }
  if (!tglArrows.checked || (a1 < 0.02 && a2 < 0.02)) M.arrow.opacity = 0;

  /* --- 进攻轴 --- */
  axisLine.visible = tglAxis.checked;
  M.axis.opacity = 0.55 * op;

  /* --- 整组淡入淡出时隐藏标签 --- */
  const lblOp = op;
  for (const o of labelObjs) o.element.style.opacity = lblOp;

  /* --- 标签内容 / 显隐 --- */
  lblX.element.innerHTML = tt < T_INVERT[0] ? L('Br 离去基团', 'Br leaving group') : L('Br⁻（已离去）', 'Br⁻ (departed)');
  lblTS.element.style.opacity = (tt > 0.26 && tt < 0.52 ? 1 : 0) * lblOp;
  lblDeltaNu.element.style.opacity = (tt > 0.24 && tt < 0.54 ? 1 : 0) * lblOp;
  lblDeltaX.element.style.opacity = (tt > 0.24 && tt < 0.54 ? 1 : 0) * lblOp;
  lblInv.element.style.opacity = (tt > 0.62 && tt < 0.86 ? 1 : 0) * lblOp;
  lbl180.element.style.opacity = (tt > 0.0 && tt < 0.34 ? 1 : 0) * lblOp;
  lblNu.element.textContent = tt > T_INVERT[1] ? L('Nu–（已成键）', 'Nu– (bonded)') : L('Nu⁻ 亲核试剂', 'Nu⁻ nucleophile');

  /* --- 能量游标 --- */
  const p = tt <= 0.5 ? 0.5 * clamp(tt / 0.5, 0, 1)
                      : 0.5 + 0.5 * clamp((tt - 0.5) / 0.25, 0, 1);
  const ex = svg._px(p), ey = svg._py(energyOf(p));
  markerDot.setAttribute('cx', ex); markerDot.setAttribute('cy', ey);
  markerLine.setAttribute('x1', ex); markerLine.setAttribute('x2', ex);
  markerLine.setAttribute('y1', svg._py(E_P) + 8); markerLine.setAttribute('y2', ey);
  markerDot.setAttribute('opacity', op);
  markerLine.setAttribute('opacity', 0.5 * op);

  return op;
}

/* ---------------- UI 接线 ---------------- */
let cycles = qsFloat('t', 0);
let playing = !qsBool('pause', false);
let speed = qsFloat('speed', 1);

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglAxis = document.getElementById('tglAxis');
const tglArrows = document.getElementById('tglArrows');
const tglRotate = document.getElementById('tglRotate');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000 * 0.96; });
tglLabels.addEventListener('change', () => { for (const o of labelObjs) o.element.style.display = tglLabels.checked ? '' : 'none'; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
if (qs.get('top') === '1') {   // 轴向机位：从 -z 正对进攻轴，检验 Nu–C–Br 共线
  camera.position.set(0, 0.4, -7.5);
  controls.target.set(0, 0, 0);
}

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let lastStep = -1;
// tt ∈ [-0.04, 0.96)：把 cycles 的相位映射到带复位窗口的时间轴
function phase(tt0) {
  const t = tt0 - Math.floor(tt0);
  return t < 0.96 ? t : t - 0.96;
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing) cycles += dt * speed / CYCLE_SECONDS;
  const tt = phase(cycles);

  scene.background.set(PAL.bg);   // 画布清屏色随主题
  updateWorld(tt);

  const si = stepIndex(tt);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(clamp(tt, 0, 0.96) / 0.96 * 1000);
  elScrubVal.textContent = Math.round(clamp(tt, 0, 0.96) / 0.96 * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
applyTheme();
applyLang();
updateWorld(phase(cycles));
requestAnimationFrame(frame);
</script>
