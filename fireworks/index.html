<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烟花 · 升空与爆开的化学</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

  <div class="sub" data-zh="一枚烟花是三段设计的串联:发射药黑火药(KNO₃ 75% + 木炭 15% + 硫 10%)在筒内爆燃,把弹体推上 100–300 m→延时引信一段慢燃药线,精确到顶点点燃爆药→爆药把数十至数百颗星体向四面八方同速抛出——动量均匀分布,壳就是球形;星体=金属盐+燃料+氧化剂+粘合剂的小丸,焰色来自电子跃迁:锶红 ~650 nm、钡绿 ~524 nm、铜蓝 ~430–460 nm、钠黄 589 nm、钙橙 ~620 nm;形状由星体在弹内的排布几何决定,铁粉/钛粉拖出火星穗,长余辉大颗粒缓降成柳树;冲击波以 343 m/s 传播,3 s/km——先看到光,3 秒后才听到 1 km 外的响 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="A firework is three stages in series: black-powder lift charge (KNO₃ 75% + charcoal 15% + sulfur 10%) deflagrates in the tube, throwing the shell 100–300 m up → a time-delay fuse burns slowly and lights the burst charge exactly at apex → the burst hurls dozens to hundreds of stars outward at equal speed — uniform momentum makes the shell spherical; each star is a pellet of metal salt + fuel + oxidizer + binder, and the flame color is electron jumps: Sr red ~650 nm, Ba green ~524 nm, Cu blue ~430–460 nm, Na yellow 589 nm, Ca orange ~620 nm; shape comes from the geometry of star packing, iron/titanium powder drags comet tails, long-persistence large grains sink slowly into a willow; the shockwave runs at 343 m/s, 3 s per km — you see the flash 3 seconds before the sound from 1 km away · 3D interactive demo · drag to orbit · Space = run/pause">烟花 · 升空与爆开的化学</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05070d, 26, 85);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x05070d : 0xb9c8d8);
  scene.fog.color = new THREE.Color(dark ? 0x05070d : 0xb9c8d8);
  skyM.opacity = dark ? 0.9 : 0.25;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('烟花 · 升空与爆开的化学', 'Fireworks · The Chemistry of the Burst');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, glFail = false;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (e) { glFail = true; }
if (glFail) {
  const err = document.createElement('div');
  err.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text2);font-size:14px;padding:24px;text-align:center;';
  err.textContent = L('WebGL 初始化失败:3D 视图已停用,面板、步骤与光谱图仍可用。', 'WebGL failed to start: 3D view disabled; panel, steps and spectra still work.');
  document.body.appendChild(err);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (!glFail) {
  try {
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  } catch (e) { /* 环境贴图失败不致命 */ }
}

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(8.5, 3.0, 14.5);
let controls = null;
if (!glFail) {
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.8, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 2;
  controls.maxDistance = 70;

function wl2rgb(wl) {
  let r = 0, g = 0, b = 0;
  if (wl >= 380 && wl < 440) { r = -(wl - 440) / 60; b = 1; }
  else if (wl < 490) { g = (wl - 440) / 50; b = 1; }
  else if (wl < 510) { g = 1; b = -(wl - 510) / 20; }
  else if (wl < 580) { r = (wl - 510) / 70; g = 1; }
  else if (wl < 645) { r = 1; g = -(wl - 645) / 65; }
  else if (wl <= 780) r = 1;
  return [r, g, b];
}

function gauss() {

}
const _n = new THREE.Vector3(0.18, 0.35, 1).normalize(), _u = new THREE.Vector3(), _w = new THREE.Vector3();

function starDir(i, out) {

const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 14, padR = 12, padB = 24, padT = 14;
  const wl0 = 380, wl1 = 780;
  const xOf = wl => padL + (wl - wl0) / (wl1 - wl0) * (W - padL - padR);
  /* 可见光带 */
  const bandY = H - padB;
  for (let px = padL; px <= W - padR; px += 2) {
    const wl = wl0 + (px - padL) / (W - padL - padR) * (wl1 - wl0);
    const c = wl2rgb(wl);
    ctx.fillStyle = `rgb(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0})`;
    ctx.fillRect(px, bandY, 2, 7);
  }
  ctx.font = '13px system-ui';
  ctx.fillStyle = cTxt;
  for (const wl of [400, 500, 600, 700]) ctx.fillText(wl, xOf(wl) - 10, bandY + 20);
  ctx.fillText('nm', W - padR - 22, bandY + 20);
  /* 发射线 */
  const els = ELEMENTS[elIdx];
  const dim = el => elIdx === el ? 1 : 0.22;
  ctx.lineWidth = 2.4;
  for (let e = 0; e < ELEMENTS.length; e++) {
    const cc = wl2rgb(ELEMENTS[e].lines[0]);
    ctx.strokeStyle = `rgba(${cc[0] * 255 | 0},${cc[1] * 255 | 0},${cc[2] * 255 | 0},${0.25 + 0.75 * dim(e)})`;
    ctx.globalAlpha = elIdx === e ? 1 : 0.28;
    let lastLab = -99;
    for (const ln of ELEMENTS[e].lines) {
      const x = xOf(ln);
      const hgt = (elIdx === e ? 1 : 0.3) * (H - padB - padT - 18);
      ctx.beginPath();
      ctx.moveTo(x, bandY);
      ctx.lineTo(x, bandY - hgt);
      ctx.stroke();
      if (elIdx === e && ln - lastLab > 3) {
        lastLab = ln;
        ctx.fillStyle = cTxt;
        ctx.fillText(String(ln), x - 14, bandY - hgt - 6);
      }
    }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = cTxt;
  ctx.fillText(L(`当前:${els.zhN} ${els.wl} nm`, `current: ${L(els.zhN, els.enN)} ${els.wl} nm`), padL + 6, 13);
}

const elPlay = document.getElementById('play');
const elH = document.getElementById('sH'), elHVal = document.getElementById('sHVal');
const stH = document.getElementById('stH'), stN = document.getElementById('stN'), stW = document.getElementById('stW'),
  stE = document.getElementById('stE'), stS = document.getElementById('stS');
const formulaEl = document.getElementById('formula');
const btnMetal = document.getElementById('btnMetal'), btnLaunch = document.getElementById('btnLaunch');
const elBtns = [...document.querySelectorAll('.elb')], arBtns = [...document.querySelectorAll('.arb')];
const AR_ZH = ['球面', '环', '心形'], AR_EN = ['sphere', 'ring', 'heart'];
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() { elH.value = Math.round(targetH); elHVal.textContent = Math.round(targetH) + ' m'; }
function syncBtns() {
  elBtns.forEach(b => b.classList.toggle('on', +b.dataset.el === elIdx));
  arBtns.forEach(b => b.classList.toggle('on', +b.dataset.ar === arIdx));
  btnMetal.classList.toggle('on', metalOn);
  btnMetal.textContent = metalOn ? L('金属粉:开', 'Metal powder: ON') : L('金属粉:关', 'Metal powder: OFF');
  document.getElementById('tglSlow').checked = slowOn;
}
function updateStats() {
  const els = ELEMENTS[elIdx];
  const hM = state === 'burst' ? apogeeM : Math.max(0, (shellY - GY) * 20);
  stH.textContent = (state === 'idle' ? '—' : hM.toFixed(0) + ' m');
  stH.className = 'v ' + (state === 'burst' ? 'ok' : state === 'idle' ? '' : 'warn');
  stN.textContent = N_STAR + ' ' + L('颗', 'pcs');
  stW.textContent = els.wl + ' nm';
  const c = wl2rgb(els.lines[0]);
  stW.style.color = `rgb(${Math.min(255, c[0] * 255 + 70) | 0},${Math.min(255, c[1] * 255 + 70) | 0},${Math.min(255, c[2] * 255 + 90) | 0})`;
  stE.textContent = '75 : 25';
  const delay = (state === 'burst' ? apogeeM : Math.max(0, (shellY - GY) * 20)) / 343;
  stS.textContent = state === 'idle' ? '—' : delay.toFixed(2) + ' s';
  stS.className = 'v ' + (delay > 1 ? 'warn' : '');
}
function updateFormula() {
  const els = ELEMENTS[elIdx];
  formulaEl.innerHTML = L(
    `<b>三段:发射药黑火药(KNO₃ 75%+木炭 15%+硫 10%)→ 延时引信 → 爆药同速抛星 = 球壳</b><br>` +
    `<b>焰色 = 量子跃迁</b>:锶 ~650 红 · 钡 ~524 绿 · 铜 ~430–460 蓝 · 钠 589 黄(双线)· 钙 ~620 橙<br>` +
    `<b>形状 = 排布几何</b>(球/环/心形模具);铁/钛粉 = 火星穗,长余辉大颗粒缓降 = 柳树<br>` +
    `<b>冲击波 343 m/s ≈ 3 s/km</b>:先见光后闻声;当前 ${els.zhN} ${els.wl} nm · 高度 ${Math.round(targetH)} m → 声延迟 ~${(targetH / 343).toFixed(2)} s`,
    `<b>Three stages: black powder lift (KNO₃ 75% + charcoal 15% + S 10%) → delay fuse → burst throws stars at equal speed = sphere</b><br>` +
    `<b>Flame color = quantum jumps</b>: Sr ~650 red · Ba ~524 green · Cu ~430–460 blue · Na 589 yellow (doublet) · Ca ~620 orange<br>` +
    `<b>Shape = packing geometry</b> (sphere/ring/heart molds); Fe/Ti powder = comet tails, long-persistence grains = willow<br>` +
    `<b>Shockwave 343 m/s ≈ 3 s/km</b>: light before sound; now ${L(els.zhN, els.enN)} ${els.wl} nm · ${Math.round(targetH)} m → delay ~${(targetH / 343).toFixed(2)} s`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elBtns.forEach(b => b.addEventListener('click', () => {
  elIdx = +b.dataset.el;
  recolor(); drawPlot(); updateFormula();
  notifyT = 2.6; notifyZ = `切到${ELEMENTS[elIdx].zhN}:电子跃迁波长 ${ELEMENTS[elIdx].wl} nm,整球当场换色`;
  notifyE = `switched to ${L(ELEMENTS[elIdx].zhN, ELEMENTS[elIdx].enN)}: jump wavelength ${ELEMENTS[elIdx].wl} nm, the whole sphere recolors instantly`;
}));
arBtns.forEach(b => b.addEventListener('click', () => {
  arIdx = +b.dataset.ar;
  if (state === 'burst' && starsAlive > 0) spawnStars(burstPos.x, burstPos.y, burstPos.z);
  syncAll();
  notifyT = 2.6; notifyZ = `排布几何:${AR_ZH[arIdx]}——星体在弹内的排布决定爆开图案`;
  notifyE = `packing geometry: ${L(AR_ZH[arIdx], AR_EN[arIdx])} — how stars sit in the shell decides the pattern`;
}));
btnMetal.addEventListener('click', () => { metalOn = !metalOn; recolor(); syncAll(); });
btnLaunch.addEventListener('click', () => launch());
elH.addEventListener('input', () => {
  targetH = +elH.value;
  syncSliders(); updateFormula(); updateStats();
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglSlow').addEventListener('change', e => { slowOn = e.target.checked; syncBtns(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
if (controls) controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null, idleT = 0, jetAcc = 0;
if (controls) controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0) * (slowOn ? 0.15 : 1);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    /* 状态机 */
    if (state === 'idle') {
      idleT += dt;
      if (playing && idleT > 1.4) { idleT = 0; launch(); }
    } else tS += dt;
    if (state === 'boost') {
      shellVy = v0Cur * clamp(tS / 0.38, 0.2, 1);
      shellY += shellVy * dt;
      shellGrp.position.y = shellY;
      flame.position.y = shellY - 0.45;
      flame.scale.setScalar(0.7 + Math.random() * 0.5);
      jetAcc += dt;
      while (jetAcc > 0.016) {
        jetAcc -= 0.016;
        spawnEmber((Math.random() - 0.5) * 0.14, shellY - 0.4, (Math.random() - 0.5) * 0.14,
          (Math.random() - 0.5) * 0.5, -2.2 - Math.random() * 1.4, (Math.random() - 0.5) * 0.5, 0.4 + Math.random() * 0.25);
      }
      if (tS > 0.38) { state = 'coast'; flame.visible = false; }
    } else if (state === 'coast') {
      shellVy -= G * dt;
      shellY += shellVy * dt;
      shellGrp.position.y = shellY;
      jetAcc += dt;
      while (jetAcc > 0.05) {
        jetAcc -= 0.05;
        spawnEmber(0.17, shellY + 0.1, 0, (Math.random() - 0.5) * 0.2, -0.3, (Math.random() - 0.5) * 0.2, 0.5);
      }
      if (shellVy <= 0.12 || shellY >= APEX() + 0.2) doBurst();
    } else if (state === 'burst') {
      flashM.opacity = Math.max(0, 0.95 - tS * 2.4);
      burstLight.intensity = Math.max(0, 14 * (1 - tS * 1.6));
      shock.scale.setScalar(0.2 + tS * 4.5);
      shockM.opacity = Math.max(0, 0.5 - tS * 0.55);
      if (flashM.opacity <= 0) flash.visible = false;
      if (shockM.opacity <= 0) shock.visible = false;
      if (tS > 6.5) { state = 'idle'; idleT = 0; }
    }
    /* 星体运动:同速抛出 + 重力 + 空气阻力 */
    starsAlive = 0;
    for (let i = 0; i < N_STAR; i++) {
      if (sLife[i] <= 0) { stars.setMatrixAt(i, HIDE); continue; }
      sLife[i] -= dt;
      if (sLife[i] <= 0) { stars.setMatrixAt(i, HIDE); continue; }
      const i3 = i * 3;
      sVel[i3 + 1] -= G * dt;
      const drag = 1 - 0.32 * dt;
      sVel[i3] *= drag; sVel[i3 + 1] *= drag; sVel[i3 + 2] *= drag;
      sPos[i3] += sVel[i3] * dt; sPos[i3 + 1] += sVel[i3 + 1] * dt; sPos[i3 + 2] += sVel[i3 + 2] * dt;
      if (sPos[i3 + 1] < GY + 0.05) { sPos[i3 + 1] = GY + 0.05; sVel[i3] = sVel[i3 + 1] = sVel[i3 + 2] = 0; }
      /* 拖尾余烬 */
      if (Math.random() < dt * 26) {
        const el = metalOn ? 1.7 : 0.55;
        spawnEmber(sPos[i3], sPos[i3 + 1], sPos[i3 + 2],
          sVel[i3] * 0.12 + (Math.random() - 0.5) * 0.25, sVel[i3 + 1] * 0.12, sVel[i3 + 2] * 0.12 + (Math.random() - 0.5) * 0.25, el * (0.7 + Math.random() * 0.6));
      }
      const b = clamp(sLife[i] / 1.2, 0, 1) * (0.8 + 0.25 * Math.sin(performance.now() / 90 + i));
      _V.set(sPos[i3], sPos[i3 + 1], sPos[i3 + 2]);
      _M4.compose(_V, _Q.identity(), _S.setScalar(0.6 + 0.7 * b));
      stars.setMatrixAt(i, _M4);
      starsAlive++;
    }
    stars.instanceMatrix.needsUpdate = true;
    /* 余烬 */
    for (let i = 0; i < N_EMB; i++) {
      if (eLife[i] <= 0) { embers.setMatrixAt(i, HIDE); continue; }
      eLife[i] -= dt;
      if (eLife[i] <= 0) { embers.setMatrixAt(i, HIDE); continue; }
      const i3 = i * 3;
      eVel[i3 + 1] -= G * 0.7 * dt;
      const d2 = 1 - 0.8 * dt;
      eVel[i3] *= d2; eVel[i3 + 1] *= d2; eVel[i3 + 2] *= d2;
      ePos[i3] += eVel[i3] * dt; ePos[i3 + 1] += eVel[i3 + 1] * dt; ePos[i3 + 2] += eVel[i3 + 2] * dt;
      if (ePos[i3 + 1] < GY + 0.03) { ePos[i3 + 1] = GY + 0.03; eVel[i3] = eVel[i3 + 1] = eVel[i3 + 2] = 0; }
      const sc = clamp(eLife[i] / eLife0[i], 0, 1) * (metalOn ? 1.7 : 1);
      _V.set(ePos[i3], ePos[i3 + 1], ePos[i3 + 2]);
      _M4.compose(_V, _Q.identity(), _S.setScalar(Math.max(0.05, sc)));
      embers.setMatrixAt(i, _M4);
    }
    embers.instanceMatrix.needsUpdate = true;
    if (state === 'boost' || state === 'coast') lblShell.position.set(1.5, shellY + 0.4, 0);
  } else if (state === 'idle' && playing) {
    idleT = 0;
  }
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    if (controls) controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.066) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  if (controls) controls.update();
  if (!glFail) {
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
recolor();
for (let i = 0; i < N_STAR; i++) stars.setMatrixAt(i, HIDE);
for (let i = 0; i < N_EMB; i++) embers.setMatrixAt(i, HIDE);
stars.instanceMatrix.needsUpdate = true;
embers.instanceMatrix.needsUpdate = true;
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
launch();
start();
</script>
</body>
</html>
