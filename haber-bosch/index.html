<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈伯法合成氨 · 热力学与动力学的交易</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="哈伯法合成氨 · 热力学与动力学的交易" data-en="Haber-Bosch · The Thermodynamics–Kinetics Bargain">哈伯法合成氨 · 热力学与动力学的交易</h1>
  <div class="sub" data-zh="N≡N 三键 945 kJ/mol,是自然界最难撬开的锁→铁催化剂解离吸附,把能垒砍到 1/3→反应放热 ΔH=−92 kJ/mol 且 4 分子变 2 分子:低温高压才高产→低温杀死速率、高温摧毁产率→400–450 °C + 20 MPa 是两条曲线的交点→再冷凝移除 NH₃ 打破平衡,让反应永远回不去 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="The N≡N triple bond (945 kJ/mol) is nature's toughest lock → an iron catalyst cleaves it by dissociative adsorption, slashing the barrier → the reaction releases ΔH = −92 kJ/mol and squeezes 4 molecules into 2: high yield wants low T, high P → low T kills the rate, high T wrecks the yield → 400–450 °C at 20 MPa is where the two curves cross → condense the ammonia out and equilibrium never settles · 3D interactive demo · drag to orbit · Space = run/pause">哈伯法合成氨 · 热力学与动力学的交易</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

</div>

<div id="stats">
  <span class="k" data-zh="温度" data-en="Temperature">温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="压强" data-en="Pressure">压强</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="平衡 NH₃ 产率" data-en="Eq. NH₃ yield">平衡 NH₃ 产率</span><span class="v ok" id="stY">—</span>
  <span class="k" data-zh="相对速率" data-en="Rel. rate">相对速率</span><span class="v warn" id="stR">—</span>
  <span class="k" data-zh="催化剂" data-en="Catalyst">催化剂</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="反应焓 ΔH" data-en="ΔH">反应焓 ΔH</span><span class="v" id="stH">—</span>
</div>

<div id="plot">
  <h3 data-zh="产率-温度的死结:绿线=平衡产率(热力学想要低温),橙线=相对速率(动力学想要高温),工业条件取两线交点附近" data-en="The yield–temperature dilemma: green = equilibrium yield (thermodynamics wants it cold), orange = relative rate (kinetics want it hot); industry operates near where the curves cross">产率-温度的死结:绿线=平衡产率(热力学想要低温),橙线=相对速率(动力学想要高温),工业条件取两线交点附近</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">

    <span class="chip.g" data-zh="NH₃:目标产物" data-en="NH₃: the product we want">NH₃:目标产物</span>

    <span class="chip.r" data-zh="能垒高墙:无催化剂时" data-en="barrier wall: with no catalyst">能垒高墙:无催化剂时</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnCat" data-zh="铁催化剂:开" data-en="Fe catalyst: ON">铁催化剂:开</button>
    <button class="abtn" id="btnRem" data-zh="冷凝移除 NH₃" data-en="Condense out NH₃">冷凝移除 NH₃</button>
    <button class="abtn" id="btnWide" data-zh="全景视角" data-en="Wide view">全景视角</button>
    <button class="abtn" id="btnMicro" data-zh="反应特写" data-en="Close-up">反应特写</button>
  </div>
  <div class="row"><label data-zh="温度" data-en="Temperature">温度</label><input id="sT" type="range" min="20" max="500" step="5" value="420"><span class="val" id="sTVal">420 °C</span></div>
  <div class="row"><label data-zh="压强" data-en="Pressure">压强</label><input id="sP" type="range" min="1" max="30" step="1" value="20"><span class="val" id="sPVal">20 MPa</span></div>
  <div class="row"><label data-zh="模拟速度" data-en="Sim speed">模拟速度</label><input id="sSpd" type="range" min="0.25" max="3" step="0.05" value="1"><span class="val" id="sSpdVal">×1.0</span></div>
  <div id="formula"></div>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线图" data-en="Chart">曲线图</span></label>
      <label><input id="tglEq" type="checkbox" checked> <span data-zh="平衡标记" data-en="Eq. marker">平衡标记</span></label>
    </div>

    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../le-chatelier/" data-zh="勒夏特列:平衡怎么挪" data-en="Le Chatelier: how equilibrium shifts">勒夏特列:平衡怎么挪</a>
    <a href="../activation-energy/" data-zh="活化能:催化剂砍的正是它" data-en="activation energy: what catalysts cut">活化能:催化剂砍的正是它</a>
    <a href="../nitrogen-cycle/" data-zh="氮循环:自然界的固氮" data-en="nitrogen cycle: nature's own fixation">氮循环:自然界的固氮</a>
    <a href="../catalytic-converter/" data-zh="催化转化器:催化剂的日常版" data-en="catalytic converter: catalysts in your car">催化转化器:催化剂的日常版</a>
    <a href="../michaelis-menten/" data-zh="米氏动力学:酶催化的速率律" data-en="Michaelis-Menten: the rate law of enzymes">米氏动力学:酶催化的速率律</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 18, 60);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('哈伯法合成氨 · 热力学与动力学的交易', 'Haber-Bosch · The Thermodynamics–Kinetics Bargain');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 120);
camera.position.set(6.5, 3.4, 9.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.0;
controls.maxDistance = 40;
controls.autoRotateSpeed = 0.35;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(6, 8, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff, 0.3);
fill.position.set(-7, 5, -6);
scene.add(fill);

/* ================= 状态 ================= */
let Tc = clamp(qsFloat('T', 420), 20, 500);      /* °C */
let Pm = clamp(qsFloat('P', 20), 1, 30);         /* MPa */
let catOn = qsBool('cat', true);
let remOn = qsBool('rem', false);
let speed = clamp(qsFloat('speed', 1), 0.25, 3);
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let labelsOn = true, chartOn = true, eqOn = true;
let phaseIdx = 0;
let notifyT = 0, notifyZ = '', notifyE = '';
let yieldPct = 0, ratePct = 0, xiEq = 0.5;
let eqCache = [];

/* ---------------- 化学模型(示教标定) ---------------- */
const RGAS = 8.314;
function kEq(TK) { const dG = -92400 + 0.1986 * TK; return Math.exp(-dG / (RGAS * TK)); }
function eqExtent(TK, P) {
  const K = kEq(TK), Pb = Math.max(P * 9.869, 1);
  const f = x => {
    const nT = 4 - 2 * x;
    const q = Math.pow(2 * x / nT, 2) / (((1 - x) / nT) * Math.pow(3 * (1 - x) / nT, 3) * Pb * Pb);
    return Math.log(Math.max(q, 1e-300)) - Math.log(K);
  };
  let lo = 1e-6, hi = 0.999999;
  if (f(lo) > 0) return lo;

      bondSet(bN[i], -0.34, y + off[0], ZC + off[1], 0.34, y + off[0], ZC + off[1], 0.035);
      bN[i].visible = true;
    }
    hideAll([...hS, ...h2b, ...nhb]);
    flashRing.visible = false;
    nMat.emissiveIntensity = 0.25;
  } else if (ct < 0.30) {
    const u = ease((ct - 0.14) / 0.16);
    const hs = lerp(0.34, 0.62, u);
    nA.position.set(-hs, ADY + 0.30, ZC); nB.position.set(hs, ADY + 0.30, ZC);
    for (let i = 0; i < 3; i++) {
      const off = [[0, 0.055], [0, -0.05], [0.052, 0]][i];
      bondSet(bN[i], -hs, ADY + 0.30 + off[0], ZC + off[1], hs, ADY + 0.30 + off[0], ZC + off[1], lerp(0.035, 0.018, u));
      bN[i].visible = true;
    }
    nMat.emissiveIntensity = 0.25 + u * 2.2;
    hideAll([...hS, ...h2b, ...nhb]);
    flashRing.visible = false;
  } else if (ct < 0.72) {
    nA.position.set(-0.62, ADY, ZC); nB.position.set(0.62, ADY, ZC);
    hideAll(bN);
    nMat.emissiveIntensity = 0.4;
    const fp = clamp((ct - 0.30) / 0.08, 0, 1);
    if (fp < 1) {
      flashRing.visible = true;
      flashRing.position.set(0, ADY + 0.3, ZC);
      const s = 0.5 + fp * 2.4;
      flashRing.scale.setScalar(s);
      flashRing.material.opacity = 0.9 * (1 - fp);
    } else flashRing.visible = false;
    for (let k = 0; k < 3; k++) {

      const hA = hS[2 * k], hB = hS[2 * k + 1], hb = h2b[k], nbA = nhb[2 * k], nbB = nhb[2 * k + 1];
      const aAx = -0.62 + ATT[k][0], aAz = ZC + ATT[k][1];
      const bAx = 0.62 - ATT[k][0], bAz = ZC - ATT[k][1];
      const aAy = ADY + 0.17, bAy = ADY + 0.17;
      if (ct < w0) { hA.visible = hB.visible = hb.visible = nbA.visible = nbB.visible = false; }
      else if (ct < wm) {
        const u = ease((ct - w0) / 0.063), side = k % 2 ? 1 : -1;
        const cx = lerp(side * 2.6, 0, u), cy = lerp(ADY + 1.1, ADY + 0.3, u);

      } else {
        hA.visible = hB.visible = true; hb.visible = false;
        hA.position.set(aAx, aAy, aAz); hB.position.set(bAx, bAy, bAz);
        nbA.visible = nbB.visible = true;
        bondSet(nbA, -0.62, ADY, ZC, aAx, aAy, aAz, 0.032);
        bondSet(nbB, 0.62, ADY, ZC, bAx, bAy, bAz, 0.032);

    const m = ease((ct - 0.72) / 0.12);

    const nAy = ADY + 0.12 * m;
    nA.visible = nB.visible = true;
    hideAll(bN); hideAll(h2b);
    for (let k = 0; k < 3; k++) {
      const hA = hS[2 * k], hB = hS[2 * k + 1], nbA = nhb[2 * k], nbB = nhb[2 * k + 1];

      const fx = -0.62 + ATT[k][0], fy = ADY + 0.17, fz = ZC + ATT[k][1];
      const pr = pyr(k);
      hA.position.set(lerp(fx, -0.62 + pr[0], m), lerp(fy, nAy + pr[1], m), lerp(fz, ZC + pr[2], m));
      const gx = 0.62 - ATT[k][0], gy = ADY + 0.17, gz = ZC - ATT[k][1];
      hB.position.set(lerp(gx, 0.62 - pr[0], m), lerp(gy, nAy + pr[1], m), lerp(gz, ZC - pr[2], m));

      bondSet(nbB, 0.62, nAy, ZC, hB.position.x, hB.position.y, hB.position.z, 0.032);
    }

    act: () => { phaseIdx = 0; catOn = true; Tc = 420; Pm = 20; syncAll(); flyTo([6.5, 3.4, 9.8], [0, 0.2, 0]); } },
  { b: '铁催化剂:解离吸附', be: 'The iron catalyst: dissociative adsorption',
    d: '在铁表面,N₂ 先被"挂"住,三键被拉伸、削弱、最后当场剪断——945 kJ/mol 的直拆变成两步便宜的表面反应,能垒砍到约 1/3。',
    de: 'On iron, N₂ first grabs on: the surface stretches, weakens and shears the triple bond — one brutal 945 kJ/mol snap becomes two cheap surface steps, the barrier cut to about a third.',
    act: () => { phaseIdx = 1; catOn = true; syncAll(); flyTo([1.4, 0.3, 3.8], [0, -0.9, 1.05]); } },
  { b: '热力学 vs 动力学', be: 'Thermodynamics vs kinetics',
    d: 'ΔH=−92 kJ/mol 放热:低温平衡产率超高,但反应慢到没法看;升温速率起飞,产率曲线却跳水——拖动温度滑杆,看两条曲线打架。',
    de: 'ΔH = −92 kJ/mol, exothermic: cold means a huge equilibrium yield but a crawl of a rate; heat speeds things up while the yield curve dives — drag the temperature slider and watch the two curves fight.',
    act: () => { phaseIdx = 2; catOn = true; Tc = 300; syncAll(); flyTo([7.6, 2.2, 7.2], [1.5, 0.2, 0]); } },
  { b: '高压:活塞压出产物', be: 'Pressure: the piston pushes out product',
    d: 'N₂+3H₂⇌2NH₃:4 个体积变 2 个。勒夏特列:加压,平衡往分子数少的那边跑——活塞压下去,黄色平衡标记肉眼可见右移。20 MPa 就是这么来的。',
    de: 'N₂+3H₂⇌2NH₃: four volumes become two. Le Chatelier: pressurize and equilibrium runs toward fewer molecules — press the piston down and the amber equilibrium marker visibly slides right. That is why industry runs at 20 MPa.',
    act: () => { phaseIdx = 3; catOn = true; Pm = 28; syncAll(); flyTo([3.6, 4.2, 6.4], [0, 1.6, 0]); } },
  { b: '移除氨:打破平衡', be: 'Removing NH₃: breaking the equilibrium',
    d: '平衡是"到站不停"的动态僵局。把 NH₃ 连续冷凝抽走,逆反应没了原料,平衡永远追不上——净转化率一路右移,这正是连续流程的精髓。',
    de: 'Equilibrium is a dynamic stalemate. Condense NH₃ out continuously and the back reaction loses its feed — equilibrium never catches up and net conversion keeps climbing. That is the whole trick of a continuous process.',
    act: () => { phaseIdx = 4; catOn = true; remOn = true; syncAll(); flyTo([4.8, 4.0, 5.2], [2.4, 2.2, 0]); } },
  { b: '工业折中:400–450 °C', be: 'The industrial compromise: 400–450 °C',
    d: '两条曲线的交点附近就是答案:400–450 °C + 15–25 MPa,单程转化率仅 ~15%,但循环压缩+移除氨让总收率超过 97%。代价:全球 ~2% 的能源,回报:喂饱一半人类。',
    de: 'Near where the curves cross lies the answer: 400–450 °C and 15–25 MPa give only ~15% per pass, but recycle compression plus NH₃ removal lifts total yield past 97%. The bill: ~2% of world energy; the payoff: it feeds half of humanity.',
    act: () => { phaseIdx = 5; catOn = true; Tc = 435; Pm = 20; remOn = false; syncAll(); flyTo([6.5, 3.4, 9.8], [0, 0.2, 0]); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:产率-温度死结 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 40, padR = 14, padT = 14, padB = 26;
  const xOf = T => padL + T / 500 * (W - padL - padR);
  const yOf = v => (H - padB) - clamp(v, 0, 100) / 100 * (H - padB - padT);
  ctx.font = '15px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const v of [25, 50, 75]) {
    ctx.beginPath(); ctx.moveTo(padL, yOf(v)); ctx.lineTo(W - padR, yOf(v)); ctx.stroke();
    ctx.fillText(String(v), padL - 30, yOf(v) + 5);
  }
  for (const T of [100, 200, 300, 400, 500]) {
    ctx.beginPath(); ctx.moveTo(xOf(T), padT); ctx.lineTo(xOf(T), H - padB); ctx.stroke();
    ctx.fillText(String(T), xOf(T) - 14, H - 8);
  }
  ctx.fillText('°C', W - padR - 24, H - 26);
  /* 工业窗口 380–500 °C */
  ctx.fillStyle = 'rgba(77,171,247,.08)';
  ctx.fillRect(xOf(380), padT, xOf(500) - xOf(380), H - padB - padT);
  ctx.fillStyle = cTxt;
  ctx.fillText(L('工业窗口', 'industrial window'), xOf(388), padT + 14);
  /* 平衡产率曲线 */
  ctx.strokeStyle = '#4dd0a2';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  eqCache.forEach((p, i) => { const x = xOf(p.T), y = yOf(p.y); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
  ctx.stroke();
  /* 相对速率曲线 */
  ctx.strokeStyle = '#ffa94d';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let T = 0; T <= 500; T += 8) {
    const y = yOf(rateRel(T));
    T === 0 ? ctx.moveTo(xOf(T), y) : ctx.lineTo(xOf(T), y);
  }
  ctx.stroke();
  ctx.fillStyle = '#4dd0a2';
  ctx.fillText(L('平衡产率 %', 'eq. yield %'), xOf(30), yOf(eqCache[0].y) + 16);
  ctx.fillStyle = '#ffa94d';
  ctx.fillText(catOn ? L('相对速率 %', 'rel. rate %') : L('无催化剂:速率≈0', 'no catalyst: rate ≈ 0'), xOf(240), yOf(catOn ? rateRel(240) : 2) - 8);
  /* 工作点 */
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 1.4;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(xOf(Tc), padT); ctx.lineTo(xOf(Tc), H - padB); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#4dd0a2';
  ctx.beginPath(); ctx.arc(xOf(Tc), yOf(yieldPct), 5.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath(); ctx.arc(xOf(Tc), yOf(ratePct), 5.5, 0, 7); ctx.fill();
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elT = document.getElementById('sT'), elTVal = document.getElementById('sTVal');
const elP = document.getElementById('sP'), elPVal = document.getElementById('sPVal');
const elSpd = document.getElementById('sSpd'), elSpdVal = document.getElementById('sSpdVal');
const stT = document.getElementById('stT'), stP = document.getElementById('stP'), stY = document.getElementById('stY'),
  stR = document.getElementById('stR'), stC = document.getElementById('stC'), stH = document.getElementById('stH');
const formulaEl = document.getElementById('formula');
const btnCat = document.getElementById('btnCat'), btnRem = document.getElementById('btnRem'),
  btnWide = document.getElementById('btnWide'), btnMicro = document.getElementById('btnMicro');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elT.value = Tc; elTVal.textContent = Tc.toFixed(0) + ' °C';
  elP.value = Pm; elPVal.textContent = Pm.toFixed(0) + ' MPa';
  elSpd.value = speed; elSpdVal.textContent = '×' + speed.toFixed(2);
}
function syncBtns() {
  btnCat.classList.toggle('on', catOn);
  btnCat.textContent = catOn ? L('铁催化剂:开', 'Fe catalyst: ON') : L('铁催化剂:关', 'Fe catalyst: OFF');
  btnRem.classList.toggle('on', remOn);
}
function updateStats() {
  stT.textContent = Tc.toFixed(0) + ' °C';
  stP.textContent = Pm.toFixed(0) + ' MPa';
  stY.textContent = yieldPct < 0.1 ? yieldPct.toExponential(1) + ' %' : yieldPct.toFixed(1) + ' %';
  stY.className = 'v ' + (yieldPct > 25 ? 'ok' : yieldPct > 8 ? 'warn' : 'bad');
  stR.textContent = ratePct < 0.01 ? '≈0 %' : ratePct.toFixed(1) + ' %';
  stR.className = 'v ' + (ratePct > 30 ? 'ok' : ratePct > 4 ? 'warn' : 'bad');
  stC.textContent = catOn ? L('α-Fe ✓', 'α-Fe ✓') : L('无 ✗', 'none ✗');
  stC.className = 'v ' + (catOn ? 'ok' : 'bad');
  stH.textContent = '−92 kJ/mol';
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>N₂ + 3H₂ ⇌ 2NH₃　ΔH = −92 kJ/mol</b>:放热且 4 分子变 2 分子 → 低温高压在热力学上占优(勒夏特列)<br>` +
    `<b>N≡N 键能 945 kJ/mol</b>:无催化剂 Ea≈230 kJ/mol(速率≈0);铁催化剂解离吸附,Ea≈68 kJ/mol——它只改速率,不动平衡点<br>` +
    `<b>当前平衡产率 ${yieldPct < 0.1 ? yieldPct.toExponential(1) : yieldPct.toFixed(1)} mol%</b>(范特霍夫:ln K 随 1/T 上升);工业 400–450 °C / 15–25 MPa,单程 ~15%,循环+移除氨 → 总收率 >97%`,
    `<b>N₂ + 3H₂ ⇌ 2NH₃　ΔH = −92 kJ/mol</b>: exothermic and 4 molecules → 2, so low T and high P win thermodynamically (Le Chatelier)<br>` +
    `<b>N≡N bond 945 kJ/mol</b>: uncatalyzed Ea ≈ 230 kJ/mol (rate ≈ 0); iron dissociative adsorption cuts Ea to ≈ 68 kJ/mol — a catalyst changes rate, never the equilibrium point<br>` +
    `<b>Equilibrium yield now ${yieldPct < 0.1 ? yieldPct.toExponential(1) : yieldPct.toFixed(1)} mol%</b> (van't Hoff: ln K climbs as 1/T); industry: 400–450 °C, 15–25 MPa, ~15% per pass, recycle + NH₃ removal → >97% overall`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elT.addEventListener('input', () => { Tc = +elT.value; computeEq(); syncSliders(); updateStats(); updateFormula(); drawPlot(); });
elP.addEventListener('input', () => { Pm = +elP.value; computeEq(); syncSliders(); updateStats(); updateFormula(); drawPlot(); });
elSpd.addEventListener('input', () => { speed = +elSpd.value; syncSliders(); });
btnCat.addEventListener('click', () => {
  catOn = !catOn; syncAll();
  if (!catOn) { notifyT = 2.6; notifyZ = '催化剂撤走:能垒高墙立起,分子撞墙即弹回'; notifyE = 'catalyst removed: the barrier wall rises — molecules bounce off'; }
});
btnRem.addEventListener('click', () => { remOn = !remOn; syncAll(); });
btnWide.addEventListener('click', () => flyTo([6.5, 3.4, 9.8], [0, 0.2, 0]));
btnMicro.addEventListener('click', () => flyTo([1.4, 0.3, 3.8], [0, -0.9, 1.05]));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglEq').addEventListener('change', e => { eqOn = e.target.checked; refreshLabels(); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0);
  heroClock += dt;
  if (notifyT > 0) notifyT -= dt0;
  /* 主角反应循环 */
  if (catOn) {
    cycT = (cycT + dt / 11) % 1;
    if (cycT < prevCyc && dt > 0) {
      for (let n = 0; n < 2; n++) {
        const p = pSeed.find(q => q.life <= 0);
        if (p) { p.life = 3; p.x = (Math.random() - 0.5) * 0.6; p.y = -0.6; p.z = ZC; p.vx = (Math.random() - 0.5) * 0.3; p.vy = 0.7 + Math.random() * 0.3; p.vz = (Math.random() - 0.5) * 0.2; }
      }
      bumpM.emissiveIntensity = 1.4;
    }
  }
  prevCyc = cycT;
  bumpM.emissiveIntensity = Math.max(0.12, bumpM.emissiveIntensity - dt0 * 2);
  heroUpdate(cycT);
  /* 背景气流 */
  const tNow = performance.now() / 1000;
  for (let i = 0; i < NG; i++) {
    const g = gSeed[i];
    const x = Math.cos(g.a + tNow * 0.12 * g.sp) * g.r + Math.sin(tNow * g.sp + g.ph) * 0.1;
    const z = Math.sin(g.a + tNow * 0.12 * g.sp) * g.r;
    const y = g.y + Math.sin(tNow * 0.5 * g.sp + g.ph) * 0.22 + (remOn ? 0.25 : 0);
    _M4.compose(_V.set(x, y, z), _Q.identity(), _S.set(1, 1, 1));
    gas.setMatrixAt(i, _M4);
  }
  gas.instanceMatrix.needsUpdate = true;
  /* 催化剂表面颗粒微闪 */
  for (let i = 0; i < NB; i++) {
    const b = bSeed[i];
    _M4.compose(_V.set(Math.cos(b.a) * b.r, -1.17, Math.sin(b.a) * b.r), _Q.identity(), _S.set(b.s, b.s * 0.7, b.s));
    bumps.setMatrixAt(i, _M4);
  }
  bumps.instanceMatrix.needsUpdate = true;
  /* 产物粒子:回收 or 回落(逆反应) */
  for (let i = 0; i < NP; i++) {
    const p = pSeed[i];
    if (p.life > 0) {
      p.life -= dt0;
      if (remOn) {
        _V.set(3.1 - p.x, 2.6 - p.y, -p.z);
        _V.normalize();
        p.vx = lerp(p.vx, _V.x * 1.6, dt0 * 2.5);
        p.vy = lerp(p.vy, _V.y * 1.6, dt0 * 2.5);
        p.vz = lerp(p.vz, _V.z * 1.6, dt0 * 2.5);
        if (Math.hypot(3.1 - p.x, 2.6 - p.y) < 0.45) p.life = 0;
      } else {
        p.vy = lerp(p.vy, p.life < 1.4 ? -0.5 : 0.25, dt0);
      }
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      _M4.compose(_V.set(p.x, p.y, p.z), _Q.identity(), _S.set(1, 1, 1));
      prods.setMatrixAt(i, _M4);
    } else {
      _M4.compose(_V.set(0, -10, 0), _Q.identity(), _S.set(0.001, 0.001, 0.001));
      prods.setMatrixAt(i, _M4);
    }
  }
  prods.instanceMatrix.needsUpdate = true;
  /* 活塞 / 平衡标记 / 墙 */
  const pTarget = lerp(2.05, 0.72, (Pm - 1) / 29);
  pistonGrp.position.y = lerp(pistonGrp.position.y, pTarget, Math.min(1, dt0 * 4));
  const eqX = lerp(-1.7, 1.7, xiEq);
  eqMarker.position.x = lerp(eqMarker.position.x, eqX, Math.min(1, dt0 * 4));
  eqMarker.visible = eqOn;
  wall.visible = !catOn;
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
