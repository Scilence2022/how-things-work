<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>p-n 结 · 一个滑块从 LED 滑到太阳能电池</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.p { border-color: rgba(255,138,128,.9); color: #ffc2c2; }
  .lbl.n { border-color: rgba(127,208,247,.9); color: #bde9ff; }
  .lbl.d { border-color: rgba(154,167,184,.9); }
  .lbl.f { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.st { border-color: rgba(67,209,124,.9); color: #c9f3da; font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.p { border-color: rgba(178,59,50,.9); color: #b23b32; }
  :root[data-theme="light"] .lbl.n { border-color: rgba(12,123,166,.9); color: #0c7ba6; }
  :root[data-theme="light"] .lbl.f { border-color: rgba(178,128,20,.9); color: #9c6f00; }
  :root[data-theme="light"] .lbl.st { border-color: rgba(71,112,31,.9); color: #3f6d1c; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 14px 12px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.i { color: #7fd0f7; }
  #ivwrap { grid-column: 1 / 3; margin-top: 6px; }
  #iv { display: block; border-radius: 8px; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.e  { color: #bde9ff; border-color: rgba(127,208,247,.7); }
  .chip.hh { color: #ffc2c2; border-color: rgba(255,138,128,.7); }
  .chip.ph { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.e  { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.hh { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.ph { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 112px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 50px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe4a3; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="p-n 结：一个滑块从 LED 滑到太阳能电池" data-en="The p-n junction: one slider from LED to solar cell">p-n 结：一个滑块从 LED 滑到太阳能电池</h1>
  <div class="sub" data-zh="扩散建耗尽层,内建电场把路拦住;正偏 → 复合发光(LED);反偏 + 光 → 光生载流子被拉开(太阳能电池) · 空格播放/暂停" data-en="Diffusion builds the depletion zone; forward bias → recombination emits light (LED); reverse bias + light → carriers torn apart (solar cell) · Space = play/pause">扩散建耗尽层,内建电场把路拦住;正偏 → 复合发光(LED);反偏 + 光 → 光生载流子被拉开(太阳能电池) · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="电流 I" data-en="current I">电流 I</span><span class="v i" id="stI">—<small> (示意)</small></span>
  <span class="k" data-zh="耗尽层宽度" data-en="depletion width">耗尽层宽度</span><span class="v" id="stD">—</span>
  <div id="ivwrap"><canvas id="iv" width="252" height="150"></canvas></div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip e"  data-zh="● 电子(n 区)" data-en="● electron (n-side)">● 电子(n 区)</span>
    <span class="chip hh" data-zh="● 空穴(p 区)" data-en="● hole (p-side)">● 空穴(p 区)</span>
    <span class="chip ph" data-zh="● 光子(发光/光照)" data-en="● photons (emit / light)">● 光子(发光/光照)</span>
  </div>
  <div class="row"><label data-zh="偏压 V(−反 +正)" data-en="Bias V (−rev +fwd)">偏压 V(−反 +正)</label><input id="vb" type="range" min="-200" max="100" step="5" value="0"><span class="val" id="vbVal">0.00 V</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <label style="display:flex;gap:5px;align-items:center;font-size:12px;color:var(--text2)">
      <input id="tglLight" type="checkbox" checked> <span data-zh="光照(反偏时发电)" data-en="illumination (power in reverse)">光照(反偏时发电)</span></label>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCarriers" type="checkbox" checked> <span data-zh="载流子" data-en="carriers">载流子</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../li-ion-battery/" data-zh="锂离子电池:离子/电子分路同款" data-en="Li-ion battery: the same ion/electron split">锂离子电池:离子/电子分路同款</a>
    <a href="../galvanic-cell/" data-zh="原电池:化学能→电能的另一种方式" data-en="galvanic cell: chemistry→electricity, differently">原电池:化学能→电能的另一种方式</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.base.color.set(THEME === 'light' ? 0xb9c2cf : 0x3a414d);
  M.lattice.color.set(THEME === 'light' ? 0x9aa7b8 : 0x565f6d);
  drawIV();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('p-n 结 · 从 LED 到太阳能电池', 'p-n Junction · from LED to Solar Cell');
  for (const r of labelRegistry) r.o.element.textContent = L(r.zh, r.en);
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(3.6, 2.9, 7.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  base: mat(0x3a414d, { roughness: 0.7 }),
  metal: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  pRegion: new THREE.MeshBasicMaterial({ color: 0xff8a80, transparent: true, opacity: 0.055, depthWrite: false }),
  nRegion: new THREE.MeshBasicMaterial({ color: 0x7fd0f7, transparent: true, opacity: 0.055, depthWrite: false }),
  dep: new THREE.MeshBasicMaterial({ color: 0x9aa7b8, transparent: true, opacity: 0.14, depthWrite: false }),
  lattice: mat(0x565f6d, { roughness: 0.8, emissive: 0x000000 }),
  electron: new THREE.MeshBasicMaterial({ color: 0x7fd0f7 }),
  hole: new THREE.MeshBasicMaterial({ color: 0xff8a80 }),
  ionM: mat(0xd95b52, { roughness: 0.5, emissiveIntensity: 0.25 }),
  ionP: mat(0x4c9fd8, { roughness: 0.5, emissiveIntensity: 0.25 }),
  wire: mat(0xcfd4dc, { metalness: 0.7, roughness: 0.3 }),
  battery: mat(0x90be6d, { roughness: 0.4 }),
  lamp: mat(0xfff2cc, { emissive: 0xffd166, emissiveIntensity: 0.05, roughness: 0.3 }),
  lampGlow: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.0, depthWrite: false }),
  mem: mat(0xd8c98f, { roughness: 0.6, transparent: true, opacity: 0.35 }),
  fieldArrow: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.9 }),
};

/* ---------------- 半导体板 ---------------- */
const SLAB_W = 6.4, SLAB_H = 2.0, SLAB_D = 0.9, SLAB_Y = 0.9;
const slabGrp = new THREE.Group();
scene.add(slabGrp);
const boxP = new THREE.Mesh(new THREE.BoxGeometry(SLAB_W / 2, SLAB_H, SLAB_D), M.pRegion);
boxP.position.set(-SLAB_W / 4, SLAB_Y, 0);
slabGrp.add(boxP);
const boxN = new THREE.Mesh(new THREE.BoxGeometry(SLAB_W / 2, SLAB_H, SLAB_D), M.nRegion);
boxN.position.set(SLAB_W / 4, SLAB_Y, 0);
slabGrp.add(boxN);
const slabEdge = new THREE.Mesh(
  new THREE.BoxGeometry(SLAB_W + 0.04, SLAB_H + 0.04, SLAB_D + 0.04),
  new THREE.MeshBasicMaterial({ color: 0x8b97a8, transparent: true, opacity: 0.08 }));
slabEdge.position.set(0, SLAB_Y, 0);
slabGrp.add(slabEdge);
const depBox = new THREE.Mesh(new THREE.BoxGeometry(1, SLAB_H, SLAB_D * 1.02), M.dep);
depBox.position.set(0, SLAB_Y, 0);
slabGrp.add(depBox);

/* 晶格点阵 */
{
  const nx = 16, ny = 5, nz = 2;
  const count = nx * ny * nz;
  const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(0.052, 8, 6), M.lattice, count);
  const m4 = new THREE.Matrix4();
  let k = 0;
  for (let ix = 0; ix < nx; ix++) for (let iy = 0; iy < ny; iy++) for (let iz = 0; iz < nz; iz++) {
    m4.setPosition(-3.0 + ix * 0.4, SLAB_Y - 0.8 + iy * 0.4, -0.22 + iz * 0.44);
    inst.setMatrixAt(k++, m4);
  }
  scene.add(inst);
}

/* ---------------- 载流子(InstancedMesh) ---------------- */
const N_E = 46, N_H = 46;
const eMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.075, 10, 8), M.electron, N_E);
const hMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.075, 10, 8), M.hole, N_H);
scene.add(eMesh); scene.add(hMesh);
const ePos = [], eVel = [], hPos = [], hVel = [];
function resetCarriers() {
  for (let i = 0; i < N_E; i++) {
    ePos.push(new THREE.Vector3(rand(0.5, 3.0), SLAB_Y + rand(-0.75, 0.75), rand(-0.3, 0.3)));
    eVel.push(new THREE.Vector3());
    hPos.push(new THREE.Vector3(rand(-3.0, -0.5), SLAB_Y + rand(-0.75, 0.75), rand(-0.3, 0.3)));
    hVel.push(new THREE.Vector3());
  }
}
resetCarriers();
const m4tmp = new THREE.Matrix4();
function drawCarriers(show) {
  for (let i = 0; i < N_E; i++) {
    m4tmp.makeScale(...(show ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4tmp.setPosition(ePos[i]);
    eMesh.setMatrixAt(i, m4tmp);
    m4tmp.setPosition(hPos[i]);
    hMesh.setMatrixAt(i, m4tmp);
  }
  eMesh.instanceMatrix.needsUpdate = true;
  hMesh.instanceMatrix.needsUpdate = true;
}

/* ---------------- 固定离子(耗尽层) ---------------- */
const N_ION = 22;
const ionMMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.085, 10, 8), M.ionM, N_ION);
const ionPMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.085, 10, 8), M.ionP, N_ION);
scene.add(ionMMesh); scene.add(ionPMesh);
function drawIons(width, show) {
  const n = Math.min(N_ION, Math.round(width * 16));
  let k = 0;
  for (let i = 0; i < n; i++) {
    const y = SLAB_Y - 0.8 + (i % 5) * 0.4, z = (i % 2 ? -0.22 : 0.22);
    const xm = -width + 0.14 + Math.floor(i / 5) * 0.22;
    m4tmp.makeScale(...(show ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4tmp.setPosition(xm, y, z);
    ionMMesh.setMatrixAt(k, m4tmp);
    const xp = width - 0.14 - Math.floor(i / 5) * 0.22;
    m4tmp.setPosition(xp, y, z);
    ionPMesh.setMatrixAt(k, m4tmp);
    k++;
  }
  for (let i = k; i < N_ION; i++) {
    m4tmp.makeScale(0.001, 0.001, 0.001);
    ionMMesh.setMatrixAt(i, m4tmp);
    ionPMesh.setMatrixAt(i, m4tmp);
  }
  ionMMesh.instanceMatrix.needsUpdate = true;
  ionPMesh.instanceMatrix.needsUpdate = true;
}

{

  return curve;
}

/* ---------------- 光子(Points 池) ---------------- */
const P_N = 90;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(P_N * 3), 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(P_N * 3), 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.1, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(points);
const photons = [];   // {p:Vector3, v:Vector3, life, kind}
for (let i = 0; i < P_N; i++) photons.push({ p: new THREE.Vector3(0, -99, 0), v: new THREE.Vector3(), life: 0, kind: 0 });
let pCursor = 0;
function spawnPhoton(pos, vel, kind, life) {
  const ph = photons[pCursor]; pCursor = (pCursor + 1) % P_N;
  ph.p.copy(pos); ph.v.copy(vel); ph.life = life; ph.kind = kind;
}
function updatePhotons(dt) {
  const pos = pGeo.attributes.position, col = pGeo.attributes.color;
  for (let i = 0; i < P_N; i++) {
    const ph = photons[i];
    if (ph.life > 0) {
      ph.life -= dt;
      ph.p.addScaledVector(ph.v, dt);
      ph.v.x += Math.sin(ph.life * 30 + i) * 0.35 * dt;
      if (ph.kind === 2 && ph.p.y < SLAB_Y + 0.55 && Math.abs(ph.p.x) < 1.2) {
        ph.life = 0;                       // 光照击中结区 → 生成电子-空穴对
        generatePair(ph.p.x);
      }
      if (ph.kind === 1 && ph.life <= 0) flash(ph.p);
      if (ph.p.y > 5.5 || ph.p.y < -1) ph.life = 0;
    }
    const a = Math.max(ph.life, 0) / (ph.kind === 2 ? 0.9 : 1.1);
    const c = ph.kind === 1 ? [1, 0.82, 0.4] : ph.kind === 2 ? [1, 0.9, 0.45] : [1, 0.82, 0.4];
    pos.setXYZ(i, ph.p.x, ph.p.y, ph.p.z);
    col.setXYZ(i, c[0] * a, c[1] * a, c[2] * a);
  }
  pos.needsUpdate = true;
  col.needsUpdate = true;
}
/* 复合闪光(Points 池复用 kind=0 静止衰减) */
function flash(p) { spawnPhoton(p.clone(), new THREE.Vector3(0, 0, 0), 0, 0.35); }

const labelRegistry = [];

}
const lblP = addLabel('p 型(多空穴)', 'p-type (holes)', new THREE.Vector3(-2.35, SLAB_Y + 1.35, 0), 'p');
const lblN = addLabel('n 型(多电子)', 'n-type (electrons)', new THREE.Vector3(2.35, SLAB_Y + 1.35, 0), 'n');
const lblDep = addLabel('耗尽层', 'depletion zone', new THREE.Vector3(0, SLAB_Y - 1.35, 0), 'd');
const lblField = addLabel('内建电场 E', 'built-in field E', new THREE.Vector3(0, SLAB_Y - 0.95, 0.48), 'f');
const lblIonM = addLabel('受主离子 −', 'acceptor ions −', new THREE.Vector3(-1.0, SLAB_Y + 1.05, 0), 'p');
const lblIonP = addLabel('施主离子 +', 'donor ions +', new THREE.Vector3(1.0, SLAB_Y + 1.05, 0), 'n');
const lblStatus = addLabel('平衡', 'equilibrium', new THREE.Vector3(0, 4.3, 0), 'st');
const lblBat = addLabel('电源', 'supply', new THREE.Vector3(-1.25, 3.62, 0), 'd');
const lblLamp = addLabel('灯', 'lamp', new THREE.Vector3(1.55, 3.68, 0), 'd');

/* ================= 物理与状态 ================= */
let vb = 0;                       // −2 .. +1
let lightOn = true;
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
function currentOf(v) {
  return Math.exp(v / 0.055) - 1 - (v < -0.05 && lightOn ? 0.85 : 0);
}
function depHalf(v) { return 0.34 + 0.62 * Math.sqrt(clamp(0.7 - v, 0.02, 2.7)); }
let tSim = 0;

/* 光生电子-空穴对 */
function generatePair(x) {
  /* 就近把一个 n 区电子传送进结区(被拉开),一个空穴送进结区 */
  for (let i = 0; i < N_E; i++) {
    if (ePos[i].x > 2.2) { ePos[i].set(clamp(x, -0.5, 0.5), SLAB_Y + rand(-0.5, 0.5), rand(-0.25, 0.25)); break; }
  }
  for (let i = 0; i < N_H; i++) {
    if (hPos[i].x < -2.2) { hPos[i].set(clamp(x, -0.5, 0.5), SLAB_Y + rand(-0.5, 0.5), rand(-0.25, 0.25)); break; }
  }
}
function updateCarriers(dt, I, w) {
  const show = tglCarriers.checked;
  for (let i = 0; i < N_E; i++) {
    const p = ePos[i], v = eVel[i];
    v.x += rand(-1, 1) * 2.2 * dt; v.y += rand(-1, 1) * 2.2 * dt;
    v.multiplyScalar(0.9);
    if (I > 0.05) {                       // 正偏:电子 n → p,在结区复合
      v.x -= 2.6 * dt;
      if (p.x < -0.45) {
        spawnPhoton(p.clone(), new THREE.Vector3(rand(-0.4, 0.4), rand(1.6, 2.6), rand(-0.4, 0.4)), 1, 1.1);
        p.set(rand(2.2, 3.0), SLAB_Y + rand(-0.75, 0.75), rand(-0.3, 0.3)); v.set(0, 0, 0);
      }
    } else if (I < -0.05) {               // 反偏:被内建场拉回 n 侧
      if (p.x < w + 0.05) v.x += 4.5 * dt;
      else v.x += 0.6 * dt;
      if (p.x > 3.05) p.x = rand(1.4, 2.6);
    } else {                              // 平衡:靠近结区被弹回
      if (p.x < w + 0.03 && v.x < 0) v.x += 3.2 * dt;
    }
    p.addScaledVector(v, dt);
    p.y = clamp(p.y, SLAB_Y - 0.85, SLAB_Y + 0.85);
    p.z = clamp(p.z, -0.32, 0.32);
  }
  for (let i = 0; i < N_H; i++) {
    const p = hPos[i], v = hVel[i];
    v.x += rand(-1, 1) * 2.2 * dt; v.y += rand(-1, 1) * 2.2 * dt;
    v.multiplyScalar(0.9);
    if (I > 0.05) {
      v.x += 2.6 * dt;
      if (p.x > 0.45) {
        p.set(rand(-3.0, -2.2), SLAB_Y + rand(-0.75, 0.75), rand(-0.3, 0.3)); v.set(0, 0, 0);
      }
    } else if (I < -0.05) {
      if (p.x > -w - 0.05) v.x -= 4.5 * dt;
      else v.x -= 0.6 * dt;
      if (p.x < -3.05) p.x = rand(-2.6, -1.4);
    } else {
      if (p.x > -w - 0.03 && v.x > 0) v.x -= 3.2 * dt;
    }
    p.addScaledVector(v, dt);
    p.y = clamp(p.y, SLAB_Y - 0.85, SLAB_Y + 0.85);
    p.z = clamp(p.z, -0.32, 0.32);
  }
  drawCarriers(show);
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '扩散 → 耗尽层', be: 'Diffusion → depletion zone',
    d: 'p 区空穴往 n 区扩散、电子反之,交界面留下不可移动的固定离子——耗尽层与内建电场就此诞生。',
    de: 'Holes diffuse toward n, electrons toward p, leaving fixed ions at the junction — the depletion zone and its built-in field are born.',

  { b: '零偏:闸门挡路', be: 'Zero bias: gate shut',

    de: 'Reverse bias widens the zone and kills the current — but light knocks out electron-hole pairs that the field tears apart: light into electricity.',

  { b: '互逆器件', be: 'One device, two lives',
    d: '同一颗二极管:正偏是 LED(电→光),反偏+光照是太阳能电池(光→电)。右下 I-V 曲线上的动点就是它的两种人生。',
    de: 'The same diode: forward = LED, reverse + light = solar cell. The dot on the I-V curve is its double life.',
    act: () => setBias(-0.9, true) },
];
function stepIndex(v) {
  if (v > 0.4) return 2;
  if (v < -0.05) return 3;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}
const elVb = document.getElementById('vb');
const elVbVal = document.getElementById('vbVal');
function setBias(v, light) {
  vb = clamp(v, -2, 1);
  elVb.value = Math.round(vb * 100);
  elVbVal.textContent = vb.toFixed(2) + ' V';

}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const tglLabels = document.getElementById('tglLabels');
const tglCarriers = document.getElementById('tglCarriers');
const tglLight = document.getElementById('tglLight');
const tglRotate = document.getElementById('tglRotate');
const stI = document.getElementById('stI'), stD = document.getElementById('stD');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elVb.addEventListener('input', () => setBias(parseInt(elVb.value, 10) / 100, undefined));
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
tglLight.addEventListener('change', () => { lightOn = tglLight.checked; });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= I-V 小图 ================= */
const ivCv = document.getElementById('iv');
const ivCtx = ivCv.getContext('2d');
function cssVar(name) { return getComputedStyle(htmlEl).getPropertyValue(name).trim(); }
function drawIV() {
  const W = ivCv.width, H = ivCv.height;
  const pal = { bg: cssVar('--cv-pill'), grid: 'rgba(128,140,155,.25)', axis: cssVar('--cv-axis') || 'rgba(128,140,155,.6)',
    dim: cssVar('--text2'), line: '#7fd0f7', dot: '#ffd166' };
  ivCtx.clearRect(0, 0, W, H);
  ivCtx.fillStyle = pal.bg;
  ivCtx.beginPath(); ivCtx.roundRect(0, 0, W, H, 8); ivCtx.fill();
  const gx0 = 46, gx1 = W - 14, gy0 = 26, gy1 = H - 30;
  ivCtx.strokeStyle = pal.axis; ivCtx.lineWidth = 1.2;
  ivCtx.beginPath(); ivCtx.moveTo(gx0, gy1); ivCtx.lineTo(gx1, gy1); ivCtx.stroke();
  ivCtx.beginPath(); ivCtx.moveTo(gx0, gy0); ivCtx.lineTo(gx0, gy1); ivCtx.stroke();
  const vToX = v => gx0 + ((v + 2) / 3.2) * (gx1 - gx0);
  const iToY = i => gy1 - clamp(i / 2.4, -0.25, 1) * (gy1 - gy0);
  ivCtx.strokeStyle = pal.grid; ivCtx.setLineDash([3, 3]);
  ivCtx.beginPath(); ivCtx.moveTo(vToX(0.7), gy0); ivCtx.lineTo(vToX(0.7), gy1); ivCtx.stroke();
  ivCtx.setLineDash([]);
  ivCtx.fillStyle = pal.dim; ivCtx.font = '10px system-ui'; ivCtx.textAlign = 'center';
  ivCtx.fillText('0.7V', vToX(0.7), gy1 + 12);
  ivCtx.fillText(L('V (正偏 →)', 'V (fwd →)'), (gx0 + gx1) / 2, H - 4);
  ivCtx.save(); ivCtx.translate(12, (gy0 + gy1) / 2); ivCtx.rotate(-Math.PI / 2);
  ivCtx.fillText('I', 0, 0); ivCtx.restore();
  ivCtx.strokeStyle = pal.line; ivCtx.lineWidth = 2;
  ivCtx.beginPath();
  for (let i = 0; i <= 110; i++) {
    const v = -2 + i / 110 * 3.2;
    const ii = Math.exp(v / 0.055) - 1 - (v < -0.05 && lightOn ? 0.85 : 0);
    const X = vToX(v), Y = iToY(ii);
    i ? ivCtx.lineTo(X, Y) : ivCtx.moveTo(X, Y);
  }
  ivCtx.stroke();
  const ii = currentOf(vb);
  ivCtx.fillStyle = pal.dot;
  ivCtx.beginPath(); ivCtx.arc(vToX(vb), iToY(ii), 4.5, 0, Math.PI * 2); ivCtx.fill();
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;
  const I = currentOf(vb);
  const w = depHalf(vb);

  /* 耗尽层宽度与电场 */
  depBox.scale.x = w * 2;
  const fStrength = clamp((0.7 - vb) / 0.7, 0.12, 1.35);
  for (const a of fieldArrows) { a.scale.setScalar(fStrength); a.position.x = w * 0.5; }
  drawIons(w, true);

  /* 载流子与光子 */
  updateCarriers(dts, I, w);
  if (I > 0.05 && playing) {              // LED:持续发射光子
    if (Math.random() < dts * (6 + 26 * clamp(I / 2.5, 0, 1))) {
      spawnPhoton(new THREE.Vector3(rand(-0.4, 0.4), SLAB_Y + 0.3, rand(-0.2, 0.2)),
        new THREE.Vector3(rand(-0.4, 0.4), rand(1.5, 2.4), rand(-0.3, 0.3)), 1, 1.1);
    }
  }
  if (I < -0.05 && lightOn && playing) {  // 光照入射
    if (Math.random() < dts * 7) {
      spawnPhoton(new THREE.Vector3(rand(-1.0, 1.0), 4.4, rand(-0.3, 0.3)),
        new THREE.Vector3(rand(-0.15, 0.15), -3.2, 0), 2, 0.9);
    }
  }
  updatePhotons(dts);

  /* 外电路 */
  const mag = clamp(Math.abs(I) / 2.4, 0, 1);
  const bright = I > 0.05 ? mag : (I < -0.05 && lightOn ? mag * 0.75 : 0);
  M.lamp.emissiveIntensity = 0.05 + bright * 1.8;
  M.lampGlow.opacity = bright * 0.4;
  junctionLight.intensity = bright * 5;
  const dir = I > 0.05 ? 1 : I < -0.05 ? -1 : 0;
  dots.forEach((d, i) => {
    if (dir === 0) { d.visible = false; return; }
    d.visible = true;
    const p = (tSim * (0.25 + 0.85 * mag) + i / dots.length) % 1;
    const pt = wireCurve.getPoint(dir > 0 ? p : 1 - p);
    d.position.copy(pt);
  });
  lblBat.element.textContent = L(dir < 0 ? '电源(被充电)' : '电源', dir < 0 ? 'supply (charging)' : 'supply');
  lblStatus.element.textContent =
    I > 0.05 ? L('LED:复合发光 · 电 → 光', 'LED: recombination · electricity → light')
    : I < -0.05 ? (lightOn ? L('太阳能电池:光照发电 · 光 → 电', 'solar cell: generating · light → electricity')
                          : L('反偏截止:闸门越拉越紧', 'reverse cutoff: the gate tightens'))
    : L('平衡:净电流为零', 'equilibrium: zero net current');

  /* 统计与步骤 */
  stI.innerHTML = (Math.abs(I) > 999 ? I.toExponential(1) : I.toFixed(2)) + '<small> (示意)</small>';
  stD.innerHTML = (w / depHalf(0)).toFixed(2) + '<small> × 平衡宽</small>';
  drawIV();
  const si = stepIndex(vb);
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
setBias(clamp(qsFloat('v', 0), -2, 1), qsBool('light', true));
requestAnimationFrame(frame);
