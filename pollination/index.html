<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>传粉与受精 · 花雇快递,精子自己游泳</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="传粉与受精 · 花雇快递,精子自己游泳" data-en="Pollination & Fertilization · the flower hires a courier, the sperm swim">传粉与受精 · 花雇快递,精子自己游泳</h1>
  <div class="sub" data-zh="花瓣的颜色与香味是广告,花蜜是工资;花粉落上同种柱头才萌发,花粉管沿花柱钻向胚珠,释放两个精子完成双受精:一个做胚(2n),一个做胚乳(3n);自花的花粉管会在半路被拦下 · 拖动旋转 / 空格运行/暂停" data-en="Petal color and scent are the ads, nectar is the wage; pollen germinates only on the right stigma, the pollen tube drills toward the ovule and releases two sperm for double fertilization: one makes the embryo (2n), one the endosperm (3n); a self-pollen tube is stopped halfway · drag to orbit / Space = run/pause">花瓣的颜色与香味是广告,花蜜是工资;花粉落上同种柱头才萌发,花粉管沿花柱钻向胚珠,释放两个精子完成双受精:一个做胚(2n),一个做胚乳(3n);自花的花粉管会在半路被拦下 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="柱头花粉" data-en="Pollen landed">柱头花粉</span><span class="v" id="stP">0</span>
  <span class="k" data-zh="花粉管长度" data-en="Tube length">花粉管长度</span><span class="v" id="stT">0<small> %</small></span>
  <span class="k" data-zh="受精胚珠" data-en="Ovules set">受精胚珠</span><span class="v" id="stO">0<small> / 5</small></span>
  <span class="k" data-zh="花蜜存量" data-en="Nectar left">花蜜存量</span><span class="v" id="stN">100<small> %</small></span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bCross" data-zh="异花受精" data-en="Cross-pollinate">异花受精</button>
    <button class="abtn" id="bSelf" data-zh="自花(不亲和)" data-en="Self (incompatible)">自花(不亲和)</button>
    <button class="abtn" id="bSlow" data-zh="双受精慢放" data-en="Slow-mo">双受精慢放</button>
  </div>
  <div class="row">
    <label data-zh="落粉量" data-en="Pollen load">落粉量</label>
    <input id="sLoad" type="range" min="4" max="30" step="1" value="14">
    <span class="val" id="sLoadVal">14</span>
  </div>
  <div class="row">
    <label data-zh="花粉管速度" data-en="Tube speed">花粉管速度</label>
    <input id="sGrow" type="range" min="0.3" max="2" step="0.1" value="1">
    <span class="val" id="sGrowVal">1.0×</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglBee" type="checkbox" checked> <span data-zh="传粉者" data-en="Bee">传粉者</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="子房剖面" data-en="Ovary cut">子房剖面</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../stomata-guard-cells/" data-zh="气孔与保卫细胞" data-en="Stomata">气孔</a>
    <a href="../transpiration/" data-zh="蒸腾作用" data-en="Transpiration">蒸腾作用</a>
    <a href="../mycorrhiza/" data-zh="菌根网络" data-en="Mycorrhiza">菌根网络</a>
    <a href="../waggle-dance/" data-zh="蜜蜂摇摆舞" data-en="Waggle dance">蜜蜂摇摆舞</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,80);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(3.6,5.4,14);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ---- 主花:茎+花萼+花瓣+雄蕊群+雌蕊 ---- */
const stemM=new THREE.MeshStandardMaterial({color:0x4e7a3a,roughness:0.8});
const leafM=new THREE.MeshStandardMaterial({color:0x56883f,roughness:0.85,side:THREE.DoubleSide});
const petalM=new THREE.MeshStandardMaterial({color:0xe28ba8,roughness:0.6,side:THREE.DoubleSide,
  emissive:0x5c1f36,emissiveIntensity:0.15});
const antherM=new THREE.MeshStandardMaterial({color:0xf2b338,roughness:0.5,emissive:0x6b4c07,emissiveIntensity:0.3});
function makeFlower(x,z,scale,h,petalColor){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);scene.add(g);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.09,h,10),stemM);
  stem.position.y=h/2;g.add(stem);
  const lf=new THREE.Mesh(new THREE.CircleGeometry(0.55,16),leafM);
  lf.position.set(0.42,h*0.45,0);lf.rotation.set(-Math.PI/2.4,0,0.6);g.add(lf);
  const lf2=lf.clone();lf2.position.set(-0.4,h*0.6,-0.2);lf2.rotation.set(-Math.PI/2.6,0,-0.7);g.add(lf2);
  const top=new THREE.Group();top.position.y=h;g.add(top);
  const pm=petalColor?petalM.clone():petalM;
  for(let i=0;i<6;i++){
    const p=new THREE.Mesh(new THREE.CircleGeometry(0.5,20),pm);
    p.scale.set(1,1.7,1);
    const a=i/6*Math.PI*2;
    p.position.set(Math.cos(a)*0.38,0.1,Math.sin(a)*0.38);
    p.rotation.set(-1.15,0,-a+Math.PI/2);
    top.add(p);
  }
  /* 雄蕊群:花丝+花药 */
  const stamens=new THREE.Group();top.add(stamens);
  for(let i=0;i<7;i++){
    const a=i/7*Math.PI*2;
    const fil=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.02,0.5,6),stemM);
    fil.position.set(Math.cos(a)*0.2,0.22,Math.sin(a)*0.2);
    fil.rotation.set(Math.sin(a)*0.35,0,-Math.cos(a)*0.35);
    stamens.add(fil);
    const an=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),antherM);
    an.position.set(Math.cos(a)*0.3,0.5,Math.sin(a)*0.3);
    an.scale.set(1,0.6,1.4);stamens.add(an);
  }
  /* 雌蕊:子房+花柱+柱头 */
  const pistil=new THREE.Group();top.add(pistil);
  const ovaryM=new THREE.MeshPhysicalMaterial({color:0x8fae62,roughness:0.5,transparent:true,opacity:0.55});
  const ovary=new THREE.Mesh(new THREE.SphereGeometry(0.28,18,14),ovaryM);
  ovary.position.y=0.12;ovary.scale.set(1,0.85,1);pistil.add(ovary);
  const style=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.06,1.15,10),stemM);
  style.position.y=1.15;pistil.add(style);
  const stigma=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,10),
    new THREE.MeshStandardMaterial({color:0xc9e06a,roughness:0.4,emissive:0x3d4d12,emissiveIntensity:0.4}));
  stigma.position.y=1.75;pistil.add(stigma);
  /* 花蜜腺(底部小碟) */
  const nectM=new THREE.MeshStandardMaterial({color:0xf7c948,roughness:0.3,emissive:0x8a6a0a,emissiveIntensity:0.4,
    transparent:true,opacity:0.9});
  const nectar=new THREE.Mesh(new THREE.TorusGeometry(0.14,0.035,8,20),nectM);
  nectar.rotation.x=Math.PI/2;nectar.position.y=0.34;pistil.add(nectar);
  return {g,top,pistil,ovary,ovaryM,style,stigma,nectar,nectM,h};
}
const flower=makeFlower(1.6,0,1.5,3.6);            // 主花
const flower2=makeFlower(-3.8,-1.4,1.0,2.2,0xd878c8); // 邻花(花粉来源)

/* ---- 胚珠(子房内 5 个) ---- */
const OV_N=5;
const ovuleM=new THREE.MeshStandardMaterial({color:0xd9e8a6,roughness:0.5});
const ovules=[];
const ovuleGrp=new THREE.Group();flower.pistil.add(ovuleGrp);
for(let i=0;i<OV_N;i++){
  const o=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),ovuleM.clone());
  o.scale.set(0.8,1.3,0.8);
  const a=i/OV_N*Math.PI*2;
  o.position.set(Math.cos(a)*0.13,0.12+((i%2)*0.06),Math.sin(a)*0.13);
  ovuleGrp.add(o);ovules.push(o);
}
/* 双受精闪光:胚(2n)绿 / 胚乳(3n)黄 */
const flashEgg=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,10),
  new THREE.MeshBasicMaterial({color:0x8ce99a,transparent:true,opacity:0}));
const flashEnd=flashEgg.clone();flashEnd.material=flashEgg.material.clone();
flashEnd.material.color.setHex(0xffd43b);
ovuleGrp.add(flashEgg);ovuleGrp.add(flashEnd);

/* ---- 花粉粒(柱头上)与花粉管 ---- */
const POLLEN_N=30;
const pollenGrainM=new THREE.MeshStandardMaterial({color:0xf7c948,roughness:0.4,emissive:0x7a5a08,emissiveIntensity:0.35});
const stPollen=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,8,8),pollenGrainM,POLLEN_N);
flower.top.add(stPollen);
/* 飘散花粉(蜂身上掉落的) */
const drift=new THREE.InstancedMesh(new THREE.SphereGeometry(0.028,6,6),
  new THREE.MeshBasicMaterial({color:0xf7c948,transparent:true,opacity:0.85}),40);
scene.add(drift);
const driftT=new Float32Array(40).fill(-1);
/* 花粉管:沿花柱的细管,生长=scale;两个精子核在管尖 */
const tubeM=new THREE.MeshStandardMaterial({color:0xe8f0b8,roughness:0.4,emissive:0x556018,emissiveIntensity:0.3});
const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,1,8),tubeM);
tube.visible=false;flower.pistil.add(tube);
const spermM=new THREE.MeshBasicMaterial({color:0xfff3bf});
const sp1=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,8),spermM);
const sp2=sp1.clone();
sp1.visible=sp2.visible=false;flower.pistil.add(sp1);flower.pistil.add(sp2);
/* 停摆标记(自花):管尖灰红闪 */
const blockM=new THREE.Mesh(new THREE.SphereGeometry(0.06,10,8),
  new THREE.MeshBasicMaterial({color:0xff8787,transparent:true,opacity:0}));
flower.pistil.add(blockM);

/* ---- 蜜蜂 ---- */
const beeG=new THREE.Group();scene.add(beeG);
const beeBodyM=new THREE.MeshStandardMaterial({color:0xd9a441,roughness:0.5});
const beeBody=new THREE.Mesh(new THREE.SphereGeometry(0.14,12,10),beeBodyM);
beeBody.scale.set(1.5,1,1);beeG.add(beeBody);
const stripeM=new THREE.MeshStandardMaterial({color:0x2b2b2b,roughness:0.6});
for(const dx of [-0.06,0.03,0.12]){
  const st=new THREE.Mesh(new THREE.TorusGeometry(0.115,0.02,6,14),stripeM);
  st.position.x=dx;st.rotation.y=Math.PI/2;beeG.add(st);
}
const wingM2=new THREE.MeshStandardMaterial({color:0xdfe8f2,transparent:true,opacity:0.5,side:THREE.DoubleSide});
const wl=new THREE.Mesh(new THREE.PlaneGeometry(0.28,0.12),wingM2);wl.position.set(0,0.12,0.1);beeG.add(wl);
const wr=wl.clone();wr.position.z=-0.1;beeG.add(wr);
beeG.visible=true;
/* 花粉篮(后腿黄团) */
const basket=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),pollenGrainM);
basket.position.set(-0.1,-0.1,0.09);beeG.add(basket);

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('广告:花瓣色与香味','Ads: petal color and scent'),new THREE.Vector3(1.6,7.6,0),'o');
addLabel(()=>L('工资:花蜜','Wage: nectar'),new THREE.Vector3(3.1,5.9,0),'y');
addLabel(()=>L('柱头:识别同种才放行','Stigma: only the right pollen germinates'),new THREE.Vector3(2.9,7.1,0),'g');
addLabel(()=>L('花粉管:两个精子乘管而下','Pollen tube: two sperm ride down'),new THREE.Vector3(0.2,5.6,0),'g',()=>tube.visible);
addLabel(()=>L('双受精:卵→胚 2n / 中央细胞→胚乳 3n','Double fertilization: egg→embryo 2n / center→endosperm 3n'),new THREE.Vector3(-0.6,4.7,0),'b',()=>fertilized>0||selfMode);
addLabel(()=>L('自交不亲和:管在半路停摆','Self-incompatible: the tube stalls halfway'),new THREE.Vector3(4.4,5.5,0),'r',()=>selfMode);

/* ---- 状态与流程 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let pollenLoad=14,growRate=1;
let landed=0,germinated=0,tubeLen=0,fertilized=0,nectar=100;
let selfMode=false,slowMo=false;
let phase='idle';        // idle→fly→pollinate→germinate→grow→fertilize→done
let phT=0,targetOvule=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function setLoad(v){pollenLoad=v;document.getElementById('sLoad').value=v;
  document.getElementById('sLoadVal').textContent=v;}
function setGrow(v){growRate=v;document.getElementById('sGrow').value=v;
  document.getElementById('sGrowVal').textContent=v.toFixed(1)+'×';}
function resetAll(){
  landed=0;germinated=0;tubeLen=0;fertilized=0;nectar=100;phT=0;
  tube.visible=false;sp1.visible=sp2.visible=false;
  flashEgg.material.opacity=0;flashEnd.material.opacity=0;blockM.material.opacity=0;
  tubeM.color.setHex(0xe8f0b8);
  ovules.forEach(o=>o.material.color.setHex(0xd9e8a6));
  phase='idle';
}
/* 柱头花粉摆放 */
function placePollen(){
  const m4=new THREE.Matrix4();
  for(let i=0;i<POLLEN_N;i++){
    if(i<landed){
      const a=i*2.4,r=0.07*Math.sqrt(i/POLLEN_N);
      m4.makeScale(1,1,1);
      m4.setPosition(r*Math.cos(a)*2.2,1.76+(i%3)*0.02,r*Math.sin(a)*2.2);
    }else m4.makeScale(0.001,0.001,0.001);
    stPollen.setMatrixAt(i,m4);
  }
  stPollen.instanceMatrix.needsUpdate=true;
}
/* 阶段推进 */
function setState(p){phase=p;phT=0;}
function stepFlow(dt){
  phT+=dt;
  if(phase==='idle'){
    if(phT>1.2){setState('fly');beeG.visible=document.getElementById('tglBee').checked;}
  }else if(phase==='fly'){
    if(phT>2.6){ // 到花取蜜完成,带上花粉
      nectar=Math.max(0,nectar-8);
      for(let i=0;i<40;i++)if(Math.random()<0.4)driftT[i]=0;
      setState('pollinate');
    }
  }else if(phase==='pollinate'){
    if(phT>1.0){
      landed=pollenLoad;placePollen();
      setState('germinate');
    }
  }else if(phase==='germinate'){
    if(phT>0.8){
      germinated=selfMode?Math.max(1,Math.round(pollenLoad*0.4)):pollenLoad;
      tube.visible=true;tubeLen=0.02;
      setState('grow');
    }
  }else if(phase==='grow'){
    tubeLen+=dt*0.11*growRate;
    const stop=selfMode?0.55:1.0;
    if(tubeLen>=stop){
      tubeLen=stop;
      if(selfMode){setState('blocked');}
      else{setState('fertilize');targetOvule=Math.floor(Math.random()*OV_N);}
    }
  }else if(phase==='fertilize'){
    if(phT>0.5&&fertilized===0){
      fertilized++;
      flashEgg.position.copy(ovules[targetOvule].position).add(new THREE.Vector3(0.02,0.06,0));
      flashEnd.position.copy(ovules[targetOvule].position).add(new THREE.Vector3(-0.02,0,0));
      ovules[targetOvule].material.color.setHex(0x9ee493);
    }
    if(phT>2.4){
      if(fertilized<OV_N&&!selfMode&&phT>2.4){targetOvule=(targetOvule+1)%OV_N;setState('grow');
        tubeLen=0.3;sp1.visible=sp2.visible=true;}
      else setState('done');
    }
  }else if(phase==='blocked'){
    if(phT>2.0)setState('done');
  }else if(phase==='done'){
    if(phT>3.0)resetAll();
  }
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'广告与工资:花瓣色香吸引,花蜜是报酬',en:'Ads and wages: color and scent attract, nectar pays',
  act(){resetAll();setLoad(14);setGrow(1);selfMode=false;document.getElementById('bCross').classList.add('on');document.getElementById('bSelf').classList.remove('on');}},
 {zh:'蜂取蜜:沾一身花粉,顺带把上一朵的花粉卸下',en:'The bee feeds: dusted with pollen, it delivers the previous flower\'s load',
  act(){setLoad(14);}},
 {zh:'落粉与识别:同种柱头才放行萌发',en:'Landing and recognition: only the right stigma says yes',
  act(){if(landed===0){landed=pollenLoad;placePollen();}setState('germinate');}},
 {zh:'花粉管萌发:沿花柱向胚珠一路生长',en:'Germination: the tube drills down the style toward the ovule',
  act(){selfMode=false;tube.visible=true;tubeLen=0.3;setState('grow');}},
 {zh:'双受精:一个精子做胚(2n),一个做胚乳(3n)',en:'Double fertilization: one sperm makes the embryo (2n), one the endosperm (3n)',
  act(){selfMode=false;tube.visible=true;tubeLen=1;sp1.visible=sp2.visible=true;slowMo=true;setGrow(0.5);setState('fertilize');}},
 {zh:'自交不亲和:自花花粉管半路停摆,保住异花优势',en:'Self-incompatible: a self tube stalls halfway, keeping the cross advantage',
  act(){selfMode=true;tube.visible=true;tubeLen=0.2;setState('grow');slowMo=false;setGrow(1);document.getElementById('bSelf').classList.add('on');document.getElementById('bCross').classList.remove('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  activeStep=i;
  if(i===4){slowMo=true;}else if(i!==5){slowMo=false;}
  STEPS[i].act();
  syncSteps();
}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stP').textContent=landed;
  document.getElementById('stT').innerHTML=(tubeLen*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stO').innerHTML=fertilized+'<small> / 5</small>';
  const n=document.getElementById('stN');
  n.innerHTML=nectar.toFixed(0)+'<small> %</small>';
  n.className='v'+(nectar<30?' warn':'');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bCross').addEventListener('click',()=>{
  selfMode=false;resetAll();
  document.getElementById('bCross').classList.add('on');
  document.getElementById('bSelf').classList.remove('on');
});
document.getElementById('bSelf').addEventListener('click',()=>{
  selfMode=true;resetAll();
  document.getElementById('bSelf').classList.add('on');
  document.getElementById('bCross').classList.remove('on');
});
document.getElementById('bSlow').addEventListener('click',()=>{
  selfMode=false;resetAll();slowMo=true;
  tube.visible=true;tubeLen=1;sp1.visible=sp2.visible=true;setState('fertilize');
});
document.getElementById('sLoad').addEventListener('input',e=>setLoad(+e.target.value));
document.getElementById('sGrow').addEventListener('input',e=>setGrow(+e.target.value));
document.getElementById('tglBee').addEventListener('change',e=>{beeG.visible=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{
  flower.ovaryM.opacity=e.target.checked?0.55:0.98;
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const rate=slowMo?0.35:1;
  const dts=dt*speedMul*(playing?1:0)*rate;
  simT+=dt;
  /* 流程推进 */
  stepFlow(dts);
  /* 花粉管与精子 */
  if(tube.visible){
    const y0=1.72,yEnd=0.24;      // 柱头到子房(花坐标系)
    const yTip=y0-(y0-yEnd)*tubeLen;
    const h=Math.max(0.01,y0-yTip);
    tube.scale.y=h;
    tube.position.y=yTip+h/2-0.03;
    const tipWorld=new THREE.Vector3(0,yTip,0);
    sp1.position.copy(tipWorld).add(new THREE.Vector3(0.02,0.02,0));
    sp2.position.copy(tipWorld).add(new THREE.Vector3(-0.02,-0.01,0));
    if(phase==='blocked'){
      blockM.position.copy(tipWorld);
      blockM.material.opacity=0.4+0.4*Math.sin(simT*8);
      tubeM.color.setHex(0x9a9080);
    }
  }
  /* 双受精闪光衰减 */
  flashEgg.material.opacity*=Math.exp(-dt*1.4);
  flashEnd.material.opacity*=Math.exp(-dt*1.4);
  if(flashEgg.material.opacity>0.05){
    flashEgg.scale.setScalar(1+(0.5-flashEgg.material.opacity)*2);
    flashEnd.scale.setScalar(1+(0.5-flashEnd.material.opacity)*2);
  }
  /* 蜜蜂:两朵花之间的 8 字巡逻(生长阶段停在你朵花上取蜜) */
  if(beeG.visible){
    let bx,by,bz;
    if(phase==='fly'||phase==='idle'){
      const t=simT*0.9;
      bx=-1.1+Math.sin(t)*2.6;by=5.6+Math.sin(t*2)*0.5;bz=Math.cos(t*0.7)*1.2;
    }else if(phase==='pollinate'){
      bx=1.6+0.2*Math.sin(simT*20);by=6.55;bz=0.1;
    }else{
      bx=1.6+Math.sin(simT*1.4)*0.06;by=6.3+Math.sin(simT*2)*0.05;bz=0.15;
    }
    beeG.position.set(bx,by,bz);
    beeG.rotation.y=Math.atan2(beeG.position.x-1.6>0?1:-1,0)+Math.sin(simT)*0.2;
    beeG.rotation.z=Math.sin(simT*1.3)*0.12;
    const wf=Math.sin(simT*60)*0.6;
    wl.rotation.x=wf;wr.rotation.x=-wf;
  }
  /* 飘散花粉 */
  {
    let n=0;
    for(let i=0;i<40;i++){
      if(driftT[i]>=0){
        driftT[i]+=dts*0.8;
        if(driftT[i]>1)driftT[i]=-1;
        else{
          const t=driftT[i];
          m4.makeScale(1,1,1);
          m4.setPosition(beeG.position.x+(i%7-3)*0.15*(1-t*0.3),
            beeG.position.y-0.2-t*2.2,(i%5-2)*0.12);
          drift.setMatrixAt(n++,m4);
        }
      }
    }
    drift.count=n;drift.instanceMatrix.needsUpdate=true;
  }
  /* 花朵呼吸微动 */
  flower.top.rotation.z=Math.sin(simT*0.8)*0.02;
  flower.nectar.scale.setScalar(0.9+0.1*Math.sin(simT*2)*clamp(nectar/100,0,1));
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
placePollen();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
