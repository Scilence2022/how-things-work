<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皂化反应</title>
<style>
  :root,:root[data-theme="dark"]{color-scheme:dark;
    --acc:#74c0fc;--bg:#10141b;--panel:rgba(13,17,24,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;--hover:rgba(255,255,255,.05);
    --shadow:0 8px 30px rgba(0,0,0,.45);--tool:rgba(13,17,24,.78);--tool-border:rgba(255,255,255,.12);}
  :root[data-theme="light"]{color-scheme:light;
    --acc:#1971c2;--bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;--hover:rgba(15,25,40,.05);
    --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s;}
  #app{position:fixed;inset:0;}#app canvas{display:block;}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
    font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
    border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    gap:6px;text-decoration:none;backdrop-filter:blur(6px);transition:border-color .15s,color .15s,transform .15s;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:11px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
  #stats .k{font-size:12px;color:var(--text2);align-self:center;}
  #stats .v{font-size:19px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  #stats .v small{font-size:11.5px;color:var(--text2);font-weight:400;}#stats .v.g{color:var(--acc);}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:384px;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:14px;padding:14px 16px 12px;
    backdrop-filter:blur(6px);box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto;}
  #steps{list-style:none;margin-top:8px;}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start;}
  #steps li:hover{background:var(--hover);}
  #steps li.on{background:rgba(116,192,252,.10);border-color:rgba(116,192,252,.45);}
  :root[data-theme="light"] #steps li.on{background:rgba(25,113,194,.08);border-color:rgba(25,113,194,.4);}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;background:rgba(255,255,255,.12);color:var(--text3);}
