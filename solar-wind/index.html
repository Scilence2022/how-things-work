<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>太阳风与日冕加热 · 为什么日冕比表面还热</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffd43b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;

  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b8860b;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="title">
  <h1 data-zh="太阳风与日冕加热" data-en="Solar Wind &amp; The Hot Corona">太阳风与日冕加热</h1>
  <div class="sub" data-zh="光球 5500 ℃,往上的日冕反而上百万度——这口「锅」靠磁场加热:磁重联与波耗散把能量倒进稀薄等离子体,粒子挣脱引力吹成太阳风,450 km/s 刮过整个太阳系,彗星的离子尾、地球的极光都是它签的名 · 拖动旋转 / 空格运行/暂停" data-en="The photosphere is 5,500 °C, yet the corona above it is over a million degrees — a pot heated by magnetic fields: reconnection and wave dissipation pour energy into the thin plasma; particles break free of gravity as the solar wind, sweeping the whole Solar System at 450 km/s — comet ion tails and Earth's auroras are its signatures · drag to orbit / Space = run/pause">光球 5500 ℃,往上的日冕反而上百万度——这口「锅」靠磁场加热:磁重联与波耗散把能量倒进稀薄等离子体,粒子挣脱引力吹成太阳风,450 km/s 刮过整个太阳系,彗星的离子尾、地球的极光都是它签的名 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0c1016,50,130);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,400);
camera.position.set(2,9,34);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=110;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x0a0c12,0.35));
const key=new THREE.DirectionalLight(0xfff0d8,1.3);key.position.set(-30,8,10);scene.add(key);
const fill=new THREE.DirectionalLight(0x88aaff,0.25);fill.position.set(14,6,-10);scene.add(fill);

/* ---- 黄道面与星野 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x11151d,roughness:1});
const ground=new THREE.Mesh(new THREE.CircleGeometry(60,64),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-7;scene.add(ground);
const m4=new THREE.Matrix4();
const NSG=420;
const starM=new THREE.MeshBasicMaterial({color:0xcfd8ea,transparent:true,opacity:0.9,fog:false});
const starfield=new THREE.InstancedMesh(new THREE.SphereGeometry(0.16,6,6),starM,NSG);
for(let i=0;i<NSG;i++){
  const d=new THREE.Vector3().randomDirection().multiplyScalar(95+Math.random()*35);
  const s=0.5+Math.random()*1.3;
  m4.makeScale(s,s,s);m4.setPosition(d.x,d.y,d.z);
  starfield.setMatrixAt(i,m4);
}
scene.add(starfield);

/* ---- 太阳:米粒组织光球 + 光晕 ---- */
const SUN=new THREE.Vector3(-13,0.8,0),SUNR=3.4,EARTH=new THREE.Vector3(15,1.6,3.5);
const UPV=new THREE.Vector3(0,1,0);
function granuleTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#e8650e';g.fillRect(0,0,512,256);
  for(let i=0;i<1500;i++){
    g.fillStyle=`hsla(${16+Math.random()*26},95%,${44+Math.random()*30}%,${0.22+Math.random()*0.45})`;
    g.beginPath();g.arc(Math.random()*512,Math.random()*256,2+Math.random()*7,0,7);g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function glowTexture(r,g,b){
  const c=document.createElement('canvas');c.width=c.height=128;
  const ctx=c.getContext('2d');
  const gr=ctx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.85)`);
  gr.addColorStop(0.35,`rgba(${r},${g},${b},0.26)`);
  gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const sunGroup=new THREE.Group();sunGroup.position.copy(SUN);scene.add(sunGroup);
const sunMesh=new THREE.Mesh(new THREE.SphereGeometry(SUNR,48,32),
  new THREE.MeshBasicMaterial({map:granuleTexture()}));
sunGroup.add(sunMesh);
const glowSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(255,190,90),
  blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.9,fog:false}));
glowSpr.scale.set(11,11,1);sunGroup.add(glowSpr);

/* ---- 日冕:双层壳 + 径向丝缕(缓慢流动) ---- */
const coronaGroup=new THREE.Group();sunGroup.add(coronaGroup);
const shell1M=new THREE.MeshBasicMaterial({color:0xffb84d,transparent:true,opacity:0.12,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false});
coronaGroup.add(new THREE.Mesh(new THREE.SphereGeometry(SUNR*1.4,40,28),shell1M));
const shell2M=new THREE.MeshBasicMaterial({color:0xffd27a,transparent:true,opacity:0.05,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false});
coronaGroup.add(new THREE.Mesh(new THREE.SphereGeometry(SUNR*1.85,40,28),shell2M));
const NF=46;
const filM=new THREE.MeshBasicMaterial({color:0xffc06a,transparent:true,opacity:0.36,
  blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
const filaments=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.02,0.12,1,5,1,true),filM,NF);
for(let i=0;i<NF;i++){
  const dir=new THREE.Vector3().randomDirection();
  const len=1.2+Math.random()*1.9;
  const q=new THREE.Quaternion().setFromUnitVectors(UPV,dir);
  const p=dir.clone().multiplyScalar(SUNR*1.02+len*0.5-0.25);
  filaments.setMatrixAt(i,new THREE.Matrix4().compose(p,q,new THREE.Vector3(1,len,1)));
}
coronaGroup.add(filaments);

/* ---- 磁力线:极区开放场线 + 赤道闭合环(随磁场强度缩放) ---- */
const fieldGroup=new THREE.Group();fieldGroup.position.copy(SUN);scene.add(fieldGroup);
const openM=new THREE.LineBasicMaterial({color:0x8ac2ff,transparent:true,opacity:0.32});
const loopM=new THREE.LineBasicMaterial({color:0xb28dff,transparent:true,opacity:0.26});
function openLine(th0,az0,len,sign){
  const pts=[];const r0=SUNR*1.06;
  for(let i=0;i<=24;i++){
    const s=i/24;
    const th=th0+(Math.PI/2-th0)*Math.pow(s,1.7)*0.6;
    const az=az0+sign*s*s*1.1;
    const r=r0+s*len;
    pts.push(new THREE.Vector3(r*Math.sin(th)*Math.cos(az),r*Math.cos(th),r*Math.sin(th)*Math.sin(az)));
  }
  return new THREE.BufferGeometry().setFromPoints(pts);
}
for(let k=0;k<12;k++){
  const north=k<6;
  const th0=north?0.28+Math.random()*0.35:Math.PI-0.28-Math.random()*0.35;
  fieldGroup.add(new THREE.Line(openLine(th0,Math.random()*Math.PI*2,8+Math.random()*7,k%2?1:-1),openM));
}
function loopLine(azm,beta,H){
  const pts=[];
  for(let i=0;i<=28;i++){
    const u=i/14-1;
    const az=azm+beta*u;
    const r=SUNR*(1.04+0.5*(1-u*u));
    pts.push(new THREE.Vector3(r*Math.cos(az),H*(1-u*u),r*Math.sin(az)));
  }
  return new THREE.BufferGeometry().setFromPoints(pts);
}
for(let k=0;k<7;k++)
  fieldGroup.add(new THREE.Line(loopLine(Math.random()*Math.PI*2,0.25+Math.random()*0.3,1.2+Math.random()*2.2),loopM));
const rcPos=new THREE.Vector3(3.1,0.9,1.4);
const flashM=new THREE.MeshBasicMaterial({color:0xfff3c0,transparent:true,opacity:0,
  blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
const flash=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,12),flashM);
flash.position.copy(rcPos);flash.visible=false;fieldGroup.add(flash);
/* 帕克螺旋导引线(随太阳自转) */
const helixGroup=new THREE.Group();helixGroup.position.copy(SUN);scene.add(helixGroup);
const helixM=new THREE.LineBasicMaterial({color:0x7fdcff,transparent:true,opacity:0.16});
for(let k=0;k<4;k++){
  const pts=[];const phi0=k*Math.PI/2;
  for(let r=5;r<=36;r+=1.2){
    const az=phi0-0.06*(r-5);
    pts.push(new THREE.Vector3(r*Math.cos(az),0.4,r*Math.sin(az)));
  }
  helixGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),helixM));
}

/* ---- 太阳风粒子:径向 + 帕克螺旋,撞上磁层被偏转 ---- */
const NW=520;
const windM=new THREE.MeshBasicMaterial({color:0x7fdcff,transparent:true,opacity:0.85,
  blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
const wind=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,6,6),windM,NW);
scene.add(wind);
const wR=new Float32Array(NW),wEl=new Float32Array(NW),wPh=new Float32Array(NW),
  wJit=new Float32Array(NW),wSz=new Float32Array(NW);
function seedWind(i){
  wR[i]=SUNR*1.12+Math.random()*0.9;
  wEl[i]=(Math.random()*2-1)*0.85;
  wPh[i]=Math.random()*Math.PI*2;
  wJit[i]=0.8+Math.random()*0.45;
  wSz[i]=0.7+Math.random()*0.9;
}
for(let i=0;i<NW;i++)seedWind(i);

/* ---- 地球磁层:弓形激波 + 磁尾 + 极光圈 ---- */
const earthEnv=new THREE.Group();earthEnv.position.copy(EARTH);scene.add(earthEnv);
const earthTilt=new THREE.Group();earthTilt.rotation.z=0.41;earthEnv.add(earthTilt);
const earthMesh=new THREE.Mesh(new THREE.SphereGeometry(0.8,32,24),
  new THREE.MeshStandardMaterial({color:0x3a76c4,roughness:0.7,metalness:0.05}));
earthTilt.add(earthMesh);
const aurM=new THREE.MeshBasicMaterial({color:0x74e39a,transparent:true,opacity:0.35,
  blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
const aurN=new THREE.Mesh(new THREE.TorusGeometry(0.46,0.075,8,40),aurM);
aurN.rotation.x=Math.PI/2;aurN.position.y=0.62;earthTilt.add(aurN);
const aurS=new THREE.Mesh(new THREE.TorusGeometry(0.46,0.075,8,40),aurM);
aurS.rotation.x=Math.PI/2;aurS.position.y=-0.62;earthTilt.add(aurS);
function shellPts(r0,y0,r1,y1){
  const pts=[];
  for(let i=0;i<=12;i++){
    const t=i/12;
    pts.push(new THREE.Vector2(r0+(r1-r0)*Math.sqrt(t),y0+(y1-y0)*t));
  }
  return pts;
}
const bow=new THREE.Mesh(new THREE.LatheGeometry(shellPts(0.15,1.75,1.45,-5.05),40),
  new THREE.MeshBasicMaterial({color:0x7fe3ff,transparent:true,opacity:0.09,
    side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
bow.rotation.z=Math.PI/2;earthEnv.add(bow);
const pausM=new THREE.Mesh(new THREE.LatheGeometry(shellPts(0.12,1.4,1.0,-4.2),40),
  new THREE.MeshBasicMaterial({color:0xa8c4ff,transparent:true,opacity:0.13,
    side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
pausM.rotation.z=Math.PI/2;earthEnv.add(pausM);
const tailM=new THREE.LineBasicMaterial({color:0x7fb2ff,transparent:true,opacity:0.28});
for(const s of[-1,1])for(const p of[-1,1]){
  const c=new THREE.CatmullRomCurve3([
    new THREE.Vector3(1.3,0.4*s,0.4*p),new THREE.Vector3(5,1.0*s,0.8*p),
    new THREE.Vector3(10.5,1.7*s,1.0*p)]);
  earthEnv.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(c.getPoints(24)),tailM));
}

/* ---- 彗星:核 + 彗发 + 离子尾(反日向)+ 弯曲尘埃尾 ---- */
const COMET_P0=new THREE.Vector3(27,8,-20),COMET_P1=new THREE.Vector3(-22,3,-6);
const motionDir=COMET_P1.clone().sub(COMET_P0).normalize();
const cometGroup=new THREE.Group();cometGroup.visible=false;scene.add(cometGroup);
const nucleus=new THREE.Mesh(new THREE.SphereGeometry(0.28,20,14),
  new THREE.MeshStandardMaterial({color:0x9aa7b8,roughness:0.9}));
cometGroup.add(nucleus);
const coma=new THREE.Mesh(new THREE.SphereGeometry(0.55,20,14),
  new THREE.MeshBasicMaterial({color:0xbfe9ff,transparent:true,opacity:0.22,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
cometGroup.add(coma);
const ionGeo=new THREE.ConeGeometry(0.55,6.5,14,1,true);ionGeo.translate(0,3.25,0);
const ionTail=new THREE.Mesh(ionGeo,new THREE.MeshBasicMaterial({color:0x6fb8ff,transparent:true,
  opacity:0.3,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
cometGroup.add(ionTail);
const dustCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,0,0),new THREE.Vector3(1.4,0.6,0),
  new THREE.Vector3(3.1,1.8,0),new THREE.Vector3(5.0,3.8,0)]);
const dustTail=new THREE.Mesh(new THREE.TubeGeometry(dustCurve,20,0.34,8,false),
  new THREE.MeshBasicMaterial({color:0xffe9c0,transparent:true,opacity:0.2,
    side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
cometGroup.add(dustTail);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false;
let heatingOn=true,heatPower=1,bVal=1,spiralOn=true;
let cometActive=false,cometT=0,reconnects=0,flashT=0,auroraGlow=0.35;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('日冕:百万度的「锅」','Corona: the million-degree pot'),new THREE.Vector3(SUN.x,SUN.y+6.8,SUN.z),'y');
addLabel(()=>L('磁重联:磁能倒进等离子体','Magnetic reconnection: field energy into plasma'),
  new THREE.Vector3(SUN.x+rcPos.x,SUN.y+rcPos.y+1.6,SUN.z+rcPos.z),'r',()=>heatingOn);
addLabel(()=>L('太阳风粒子','Solar-wind particles'),new THREE.Vector3(-1.5,4.2,5),'b');
const cometLbl=addLabel(()=>L('离子尾:总指向背离太阳','Ion tail: always anti-sunward'),
  new THREE.Vector3(0,0,0),'b',()=>cometActive);
addLabel(()=>L('极光圈:太阳风的签名','Aurora oval: the wind\'s signature'),
  new THREE.Vector3(EARTH.x,EARTH.y+2.0,EARTH.z),'g');

function setB(v){bVal=v;document.getElementById('sB').value=v;
  document.getElementById('sBVal').textContent=v.toFixed(2)+'×';}
function setHeat(v){heatPower=v;document.getElementById('sHeat').value=v;
  document.getElementById('sHeatVal').textContent=v.toFixed(2)+'×';}
function setHeating(on){heatingOn=on;
  document.getElementById('bHeat').classList.toggle('on',on);
  document.getElementById('bOff').classList.toggle('on',!on);}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'温度反常:离热源越远反而越热',en:'The temperature anomaly: the farther from the heat source, the hotter it gets',
  act(){setHeat(1.0);setB(1.0);setHeating(true);}},
 {zh:'磁场是热源:重联把磁能倒进等离子体',en:'Magnetic fields are the burner: reconnection dumps magnetic energy into the plasma',
  act(){setB(1.5);setHeat(1.05);setHeating(true);reconnects+=3;flashT=1;}},
 {zh:'波耗散:阿尔芬波把能量送到高空',en:'Wave dissipation: Alfvén waves carry energy up into the corona',
  act(){setHeat(1.4);setB(1.0);setHeating(true);}},
 {zh:'逃逸:外层粒子挣脱引力吹成风',en:'Escape: outer particles break free of gravity and blow into the wind',
  act(){setHeat(1.55);setB(1.1);setHeating(true);}},
 {zh:'帕克螺旋:太阳自转把径向风拧成旋臂',en:'Parker spiral: the Sun\'s rotation twists radial flow into spiral arms',
  act(){setHeating(true);spiralOn=true;document.getElementById('tglSpiral').checked=true;}},
 {zh:'到达地球:彗尾与极光',en:'Arrival at Earth: comet tails and auroras',
  act(){setHeating(true);setHeat(1.2);cometActive=true;cometT=0;
    cometGroup.visible=true;document.getElementById('bComet').classList.add('on');auroraGlow=1;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const tMK=heatingOn?0.85+0.95*heatPower*(0.7+0.3*bVal):0.02;
  document.getElementById('stT').innerHTML=tMK.toFixed(2)+'<small> ×10⁶ K</small>';
  const w=document.getElementById('stW');
  w.innerHTML=(heatingOn?Math.round(360+170*heatPower+60*(bVal-1)):0)+'<small> km/s</small>';
  w.className='v '+(heatingOn?'ok':'warn');
  document.getElementById('stR').textContent=reconnects;
  document.getElementById('stF').innerHTML=(heatingOn?(1.8+1.6*heatPower).toFixed(1):'0.0')+'<small> ×10⁸ cm⁻²s⁻¹</small>';
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bHeat').addEventListener('click',()=>setHeating(true));
document.getElementById('bOff').addEventListener('click',()=>setHeating(false));
document.getElementById('bComet').addEventListener('click',()=>{
  cometActive=!cometActive;cometT=0;cometGroup.visible=cometActive;
  document.getElementById('bComet').classList.toggle('on',cometActive);
});
document.getElementById('sB').addEventListener('input',e=>setB(+e.target.value));
document.getElementById('sHeat').addEventListener('input',e=>setHeat(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglSpiral').addEventListener('change',e=>{spiralOn=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0c1016:0xe9e4dc);
  scene.fog.color.setHex(dark?0x0c1016:0xe9e4dc);
  groundM.color.setHex(dark?0x11151d:0xd8d2c6);
  starM.opacity=dark?0.9:0.35;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const cometPos=new THREE.Vector3(),tailDir=new THREE.Vector3(),
  perpV=new THREE.Vector3(),swayV=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 太阳自转、日冕流动与塌缩 */
  sunMesh.rotation.y+=dts*0.05;
  coronaGroup.rotation.y-=dts*0.06;
  const corT=heatingOn?1:0.52;
  coronaGroup.scale.setScalar(coronaGroup.scale.x+(corT-coronaGroup.scale.x)*Math.min(1,dt*2.2));
  shell1M.opacity=(heatingOn?0.10+0.05*heatPower:0.02)*(1+0.15*Math.sin(simT*1.7));
  shell2M.opacity=heatingOn?0.05+0.03*heatPower:0.01;
  filM.opacity=heatingOn?0.30+0.14*heatPower:0.03;
  const gs=heatingOn?11+heatPower:8.2;
  glowSpr.scale.x+=(gs-glowSpr.scale.x)*Math.min(1,dt*2.2);
  glowSpr.scale.y=glowSpr.scale.x;
  /* 磁重联闪光与事件计数 */
  if(heatingOn&&Math.random()<dts*0.35*heatPower*(0.5+0.7*bVal)){reconnects++;flashT=1;}
  flashT=Math.max(0,flashT-dts*1.5);
  flash.visible=flashT>0.01;
  flash.scale.setScalar(0.25+flashT*1.6);
  flashM.opacity=flashT*0.85;
  /* 磁场随强度伸缩 */
  fieldGroup.scale.setScalar(0.55+0.42*bVal);
  openM.opacity=0.14+0.2*bVal;loopM.opacity=0.10+0.18*bVal;tailM.opacity=0.12+0.2*bVal;
  helixGroup.visible=spiralOn&&heatingOn;
  helixGroup.rotation.y=-0.12*simT;
  /* 太阳风粒子:径向流出 + 螺旋拧转,撞磁层被偏转 */
  const windV=heatingOn?clamp(1.5+1.4*heatPower+0.8*(bVal-1),0.8,4.6):0;
  windM.opacity+=((heatingOn?0.85:0.18)-windM.opacity)*Math.min(1,dt*3);
  let hits=0;
  for(let i=0;i<NW;i++){
    if(heatingOn){wR[i]+=windV*dts*wJit[i];if(wR[i]>42)seedWind(i);}
    const az=wPh[i]+0.12*simT-(spiralOn?0.06:0)*(wR[i]-SUNR*1.2);
    const ce=Math.cos(wEl[i]);
    let x=SUN.x+wR[i]*ce*Math.cos(az),y=SUN.y+wR[i]*Math.sin(wEl[i]),z=SUN.z+wR[i]*ce*Math.sin(az);
    const dx=x-EARTH.x,dy=y-EARTH.y,dz=z-EARTH.z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(d<2.7){const s=2.7/(d||1e-4);x=EARTH.x+dx*s;y=EARTH.y+dy*s;z=EARTH.z+dz*s;hits++;}
    const sc=wSz[i]*(heatingOn?1:0.55);
    m4.makeScale(sc,sc,sc);m4.setPosition(x,y,z);
    wind.setMatrixAt(i,m4);
  }
  wind.instanceMatrix.needsUpdate=true;
  /* 极光圈:撞击越密越亮 */
  auroraGlow=clamp(auroraGlow+hits*0.02,0,1);
  auroraGlow*=Math.max(0,1-dts*0.45);
  aurM.opacity=0.10+0.75*auroraGlow;
  const ap=1+0.12*Math.sin(simT*6)*auroraGlow;
  aurN.scale.setScalar(ap);aurS.scale.setScalar(ap);
  earthMesh.rotation.y+=dts*0.12;
  /* 彗星过境:双尾指向背离太阳,随日风摆动 */
  if(cometActive){
    cometT+=dts*0.013;
    if(cometT>=1){
      cometActive=false;cometGroup.visible=false;
      document.getElementById('bComet').classList.remove('on');
    }else{
      cometPos.lerpVectors(COMET_P0,COMET_P1,cometT);
      cometPos.y+=1.6*cometT*(1-cometT)*Math.sin(cometT*9);
      cometGroup.position.copy(cometPos);
      tailDir.copy(cometPos).sub(SUN).normalize();
      perpV.crossVectors(tailDir,UPV);
      if(perpV.lengthSq()<1e-4)perpV.set(1,0,0);
      perpV.normalize();
      swayV.copy(tailDir).addScaledVector(perpV,0.09*Math.sin(simT*1.7)).normalize();
      ionTail.quaternion.setFromUnitVectors(UPV,swayV);
      swayV.copy(tailDir).addScaledVector(motionDir,-0.38).normalize();
      dustTail.quaternion.setFromUnitVectors(UPV,swayV);
      const dSun=cometPos.distanceTo(SUN);
      const ts=clamp(1.55-dSun/32,0.5,1.35);
      ionTail.scale.set(ts,ts*1.05,ts);dustTail.scale.set(ts,ts,ts);
      nucleus.rotation.y+=dts*0.6;
      cometLbl.position.set(cometPos.x,cometPos.y+2.3,cometPos.z);
    }
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setB(1.0);setHeat(1.0);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
