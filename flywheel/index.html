<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞轮与能量回收 · 把刹车存起来再用一次</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff8787;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#f0efed; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,135,135,.6); background: rgba(255,135,135,.12); color: var(--text); }
  .abtn.crash { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(201,42,42,.55); background: rgba(201,42,42,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,135,135,.10); border-color: rgba(255,135,135,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="飞轮与能量回收:把刹车存起来再用一次" data-en="Flywheel & KERS: Banking Your Brakes">飞轮与能量回收:把刹车存起来再用一次</h1>
  <div class="sub" data-zh="刹车时电机变发电机,把 1 吨重的车的动能搬进一只 8 kg 的小飞轮——E=½Iω²,所以它要转到每分钟几万转;轮缘应力 σ=ρv² 给材料划下红线:钢到顶、碳纤维才放得下;再踩油门时整套能量原路放回车轮 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Braking turns the motor into a generator and banks a 1-tonne car's KE into an 8 kg flywheel — E=½Iω², so it spins at tens of thousands of rpm; hoop stress σ=ρv² draws a red line: steel tops out, carbon fiber holds; hit the throttle and it all flows back · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">刹车时电机变发电机,把 1 吨重的车的动能搬进一只 8 kg 的小飞轮——E=½Iω²,所以它要转到每分钟几万转;轮缘应力 σ=ρv² 给材料划下红线:钢到顶、碳纤维才放得下;再踩油门时整套能量原路放回车轮 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="车速" data-en="Car speed">车速</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="车动能" data-en="Car KE">车动能</span><span class="v b" id="stK">—</span>
  <span class="k" data-zh="飞轮转速" data-en="Flywheel rpm">飞轮转速</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="飞轮储能" data-en="Stored">飞轮储能</span><span class="v ok" id="stE">—</span>
  <span class="k" data-zh="累计热损" data-en="Heat lost">累计热损</span><span class="v warn" id="stH">—</span>
</div>

<div id="plot">
  <h3 data-zh="车速(蓝,km/h)· 飞轮储能(绿,kJ)· 累计热损(红,kJ)· 竖线=当前" data-en="Car speed (blue, km/h) · flywheel energy (green, kJ) · cumulative heat (red, kJ) · line = now">车速(蓝,km/h)· 飞轮储能(绿,kJ)· 累计热损(红,kJ)· 竖线=当前</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.g" data-zh="能量流:回收/助推" data-en="flow: recover / boost">能量流:回收/助推</span>
    <span class="chip.r" data-zh="刹车片热" data-en="friction heat">刹车片热</span>
    <span class="chip.b" data-zh="真空壳(剖开)" data-en="vacuum shell (cut)">真空壳(剖开)</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnKers" data-zh="KERS 飞轮回收" data-en="KERS flywheel">KERS 飞轮回收</button>
    <button class="abtn" id="btnFriction" data-zh="对照:纯刹车片" data-en="compare: brakes only">对照:纯刹车片</button>
    <button class="abtn crash" id="btnBurst" data-zh="超频到爆(慢放)" data-en="overrev → burst (slow-mo)">超频到爆(慢放)</button>
  </div>
  <div class="row"><label data-zh="时间轴" data-en="Timeline">时间轴</label><input id="tm" type="range" min="0" max="24" step="0.05" value="0"><span class="val" id="tmVal">0.0 s</span></div>
  <div class="row"><label data-zh="飞轮材料" data-en="Flywheel material">飞轮材料</label><input id="mat" type="range" min="0" max="2" step="1" value="0"><span class="val" id="matVal">钢</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../angular-momentum/" data-zh="角动量守恒" data-en="angular momentum">角动量守恒</a>
    <a href="../induction-motor/" data-zh="电机⇄发电机" data-en="motor ⇄ generator">电机⇄发电机</a>
    <a href="../li-ion-battery/" data-zh="另一种储能:电池" data-en="the other bank: batteries">另一种储能:电池</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xf0efed : 0x0f1013);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('飞轮与能量回收 · 把刹车存起来再用一次', 'Flywheel & KERS · Banking Your Brakes');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setToggleBtns();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.5, 1.9, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.15, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.4;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const ground = new THREE.Mesh(new THREE.CylinderGeometry(8, 8.4, 0.12, 48),
  mat(0x23262c, { roughness: 0.95, emissive: 0x000000, opacity: 1 }));
ground.position.y = -0.06;
scene.add(ground);
/* 滚动路面(循环条纹) */
const road = new THREE.Mesh(new THREE.BoxGeometry(9, 0.06, 2.2), mat(0x2c3036, { roughness: 0.9, opacity: 1 }));
road.position.set(0, 0.03, 0);
scene.add(road);
const stripes = [];
for (let i = 0; i < 12; i++) {
  const st = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.02, 0.14),
    new THREE.MeshBasicMaterial({ color: 0x55606d }));
  st.position.set(-4 + i * 0.75, 0.07, 0);
  scene.add(st);
  stripes.push(st);
}

/* ================= 小车(台架,车速=轮速) ================= */
const car = new THREE.Group();
car.position.set(-1.9, 0, 0);
scene.add(car);
const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.34, 0.9), mat(0xb0413e, { roughness: 0.45, opacity: 1 }));
body.position.y = 0.42;
car.add(body);
const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.26, 0.8), mat(0x8f2f2c, { roughness: 0.5, opacity: 1 }));
cabin.position.set(-0.1, 0.72, 0);
car.add(cabin);
const wheels = [];
for (const [dx, dz] of [[-0.62, 0.5], [-0.62, -0.5], [0.62, 0.5], [0.62, -0.5]]) {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.14, 20), mat(0x1b1d20, { roughness: 0.85, opacity: 1 }));
  w.rotation.x = Math.PI / 2;
  w.position.set(dx, 0.22, dz);
  car.add(w);
  wheels.push(w);
}
const brakeGlowMat = new THREE.MeshBasicMaterial({ color: 0xff5a2a, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
for (const [dx, dz] of [[0.62, 0.5], [0.62, -0.5]]) {
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.16, 16), brakeGlowMat);
  disc.rotation.x = Math.PI / 2;
  disc.position.set(dx, 0.22, dz);

/* ================= 状态与物理模型 ================= */
const M_CAR = 1000, I_FW = 0.02, R_RIM = 0.05;
const V0 = 25, V1 = 20;
const T_BRAKE0 = 6, T_BRAKE1 = 9, T_HOLD1 = 12, T_BOOST1 = 15, T_END = 24;
const ETA = 0.9;                           // 电机/发电机链路效率
const MATS = [
  { zh: '钢', en: 'steel', sigma: 500e6, rho: 7850, color: 0xcfd8e0 },
  { zh: '铝合金', en: 'aluminum', sigma: 550e6, rho: 2700, color: 0xdfe7ee },
  { zh: '碳纤维', en: 'carbon fiber', sigma: 1500e6, rho: 1600, color: 0x22262c },
];
const rimVmax = m => Math.sqrt(m.sigma / m.rho);
const rpmMax = m => rimVmax(m) / (2 * Math.PI * R_RIM) * 60;
const KE = v => 0.5 * M_CAR * v * v;       // J
const Eof = rpm => 0.5 * I_FW * Math.pow(rpm / 60 * 2 * Math.PI, 2);
const rpmOf = E => Math.sqrt(2 * Math.max(E, 0) / I_FW) / (2 * Math.PI) * 60;

let burstT = 0;
let spinOn = qsBool('spin', true);

function vAt(t) {                          // 车速曲线(两种模式同一驾驶需求)
  if (t < T_BRAKE0) return V0;
  if (t < T_BRAKE1) return V0 * (1 - easeIO((t - T_BRAKE0) / (T_BRAKE1 - T_BRAKE0)));
  if (t < T_HOLD1) return 0;
  if (t < T_BOOST1) return V1 * easeIO((t - T_HOLD1) / (T_BOOST1 - T_HOLD1));
  return V1;
}
/* 纯函数模拟:0 积到 t,返回 {E, heat}。超材料上限的部分直接进热。 */
const simCache = new Map();
function simulate(t, kers, mi) {
  const key = `${kers}|${mi}`;
  let arr = simCache.get(key);
  if (!arr) {
    arr = [];
    let E = 0, heat = 0, rpmCap = rpmMax(MATS[mi]);
    const h = 0.02;
    for (let s = 0; s <= T_END + 1e-9; s += h) {
      const v = vAt(s), dv = vAt(Math.max(0, s - h));
      const braking = s >= T_BRAKE0 && s < T_BRAKE1;
      const boosting = s >= T_HOLD1 && s < T_BOOST1;
      if (braking) {
        const dKE = KE(dv) - KE(v);
        if (kers) {
          const cap = Eof(rpmCap);
          const toStore = Math.min(dKE * ETA, Math.max(0, cap - E));
          E += toStore;
          heat += dKE - toStore;
        } else heat += dKE;
      }
      if (!braking && !boosting && E > 0) { const loss = E * 0.01 * h; E -= loss; heat += loss; }
      if (boosting) {
        const dKE = KE(v) - KE(dv);
        if (kers) {
          const take = Math.min(dKE / ETA, E);
          E -= take;
          heat += take * (1 - ETA);
        } else heat += dKE * 3;          // 燃油发动机 ~30% 效率:烧三倍热量
      }
      arr.push({ E, heat });
    }
    simCache.set(key, arr);
  }
  const idx = clamp(Math.round(t / 0.02), 0, arr.length - 1);
  return arr[idx];
}
const stAt = t => ({ v: vAt(t), ...simulate(t, kersOn, matIdx) });

const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 14, padB = 18;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const xOf = t => pad + (W - 2 * pad) * clamp(t, 0, T_END) / T_END;
  const yK = v => pad + (H - pad - padB) * (1 - clamp(v, 0, 100) / 100);
  const yE = e => pad + (H - pad - padB) * (1 - clamp(e, 0, 340000) / 340000);
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - padB); ctx.lineTo(W - pad, H - padB); ctx.stroke();
  /* 车速 */
  ctx.strokeStyle = '#74c0fc'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let t = 0; t <= T_END; t += 0.1) {
    const y = yK(vAt(t) * 3.6);
    t === 0 ? ctx.moveTo(xOf(t), y) : ctx.lineTo(xOf(t), y);
  }
  ctx.stroke();
  /* 飞轮储能 & 热损 */
  const series = (pick, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let t = 0; t <= T_END; t += 0.1) {
      const y = yE(pick(simulate(t, kersOn, matIdx)));
      t === 0 ? ctx.moveTo(xOf(t), y) : ctx.lineTo(xOf(t), y);
    }
    ctx.stroke();
  };
  series(s => s.E, '#69db7c');
  series(s => s.heat, '#ff6b6b');
  /* 材料上限线 */
  ctx.strokeStyle = 'rgba(255,169,77,.55)'; ctx.setLineDash([7, 6]); ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(pad, yE(Eof(rpmMax(MATS[matIdx])))); ctx.lineTo(W - pad, yE(Eof(rpmMax(MATS[matIdx])))); ctx.stroke();
  ctx.setLineDash([]);
  /* 当前时刻 */
  ctx.strokeStyle = cTxt; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(xOf(tS), pad); ctx.lineTo(xOf(tS), H - padB); ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '14px system-ui';
  ctx.fillText('24 s', W - pad - 40, H - 4);
  ctx.fillText('上限', pad + 2, yE(Eof(rpmMax(MATS[matIdx]))) - 5);
}

function startBurst() {
  burstState = 1; burstT = 0;
  const rpm = rpmOf(stAt(tS).E);
  const w = rpm / 60 * Math.PI * 2;
  const arc = Math.PI * 2 / SEG_N;
  for (let i = 0; i < SEG_N; i++) {
    const s = segs[i];
    flyG.remove(s.mesh);
    scene.add(s.mesh);
    const local = new THREE.Vector3(Math.cos(i * arc + arc / 2) * FW_R, Math.sin(i * arc + arc / 2) * FW_R, 0);
    s.mesh.position.copy(flyG.localToWorld(local.clone()));
    s.mesh.quaternion.copy(flyG.quaternion);
    const dir = s.mesh.position.clone().sub(flyG.position).setZ(0).normalize();
    s.vel.copy(dir).multiplyScalar(Math.max(w * R_RIM, 4) * 0.6)
      .add(new THREE.Vector3((Math.random() - 0.5) * 2, Math.random() * 2.5, (Math.random() - 0.5) * 2));
    s.rotV.set(Math.random() * 12 - 6, Math.random() * 12 - 6, Math.random() * 12 - 6);
    s.free = true;
  }
  updateFormula();
}
function restoreSegs() {
  for (const s of segs) {
    if (!s.free) continue;
    scene.remove(s.mesh);
    s.mesh.position.set(0, 0, 0);
    s.mesh.quaternion.identity();
    flyG.add(s.mesh);
    s.free = false;
  }
  burstMat.opacity = 0;
}
function updateSegs(dt) {
  if (burstState === 0) return;
  burstT += dt;
  burstMat.opacity = Math.max(0, 0.55 - burstT * 0.8);
  for (const s of segs) {
    if (!s.free) continue;
    s.vel.y -= 9.8 * dt * 0.6;
    s.mesh.position.addScaledVector(s.vel, dt);
    if (s.mesh.position.y < 0.1) { s.mesh.position.y = 0.1; s.vel.multiplyScalar(0.4); s.vel.y = Math.abs(s.vel.y) * 0.3; }
    s.mesh.rotation.x += s.rotV.x * dt;
    s.mesh.rotation.y += s.rotV.y * dt;
    s.mesh.rotation.z += s.rotV.z * dt;
  }
  if (burstT > 4) { burstState = 0; restoreSegs(); }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 1;
function frame() {
  raf = requestAnimationFrame(frame);
  const raw = clamp(clock.getDelta(), 0, 0.05);
  const dt = raw * (playing ? speed : 0);
  flowTime += raw;
  if (playing && burstState === 0) {
    tS += dt;
    if (tS > T_END) tS = 0;
    syncTm();
  }
  const s = stAt(tS);
  const Eeff = burstState > 0 ? 0 : s.E;
  /* 飞轮旋转与爆裂(视觉降速防频闪) */
  const rpmNow = burstState > 0 ? 0 : rpmOf(s.E);
  flyG.rotation.z -= clamp(rpmNow / 60 * 0.01, 0, 6) * Math.PI * 2 * dt;
  updateSegs(dt);
  /* 车轮与路面 */
  const wWheel = s.v / 0.22 * 0.15;
  wheels.forEach(w => w.rotation.z -= wWheel * dt);
  stripes.forEach(st => {
    st.position.x -= s.v * dt * 0.16;
    if (st.position.x < -4.4) st.position.x += 10.6;
  });
  /* 刹车热光:对照模式下制动时刹车盘亮红 */
  const braking = tS >= T_BRAKE0 && tS < T_BRAKE1 + 0.4;
  brakeGlowMat.opacity = braking ? (!kersOn ? 0.75 : 0.12) + Math.min(0.2, dt * 2) : Math.max(0, brakeGlowMat.opacity - raw * 1.5);
  /* 能量流箭头 */
  flowArrows(braking && kersOn ? 1 : (tS >= T_HOLD1 && tS < T_BOOST1 && kersOn ? -1 : 0));
  /* 车身俯仰 */
  car.rotation.z = braking ? 0.028 : (tS >= T_HOLD1 && tS < T_BOOST1 ? -0.022 : car.rotation.z * 0.9);
  statsAcc += raw;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stV.textContent = (s.v * 3.6).toFixed(0) + ' km/h';
    stK.textContent = (KE(s.v) / 1000).toFixed(0) + ' kJ';
    stR.textContent = (rpmNow / 1000).toFixed(1) + 'k rpm';
    stE.textContent = (Eeff / 1000).toFixed(0) + ' kJ';
    const m = MATS[matIdx];
    stE.className = 'v ' + (burstState > 0 ? 'bad' : rpmNow >= rpmMax(m) * 0.985 ? 'warn' : 'ok');
    stH.textContent = (s.heat / 1000).toFixed(0) + ' kJ';
    stH.className = 'v ' + (s.heat > 300000 ? 'bad' : 'warn');
    updateFormula();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
tS = clamp(qsFloat('t', 0), 0, T_END);
kersOn = qs.get('mode') === 'friction' ? false : qsBool('kers', true);
matIdx = clamp(Math.round(qsFloat('mat', 0)), 0, 2);
syncMat();
setToggleBtns();
applyTheme();
applyLang();
syncAll();
setPlayLabel();
start();
</script>
</body>
</html>
