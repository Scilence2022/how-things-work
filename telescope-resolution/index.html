<style>
  :root,:root[data-theme="dark"]{

  #app{position:fixed;inset:0}#app canvas{display:block}

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}

    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}

  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }

  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}

</style>

  <div class="sub" data-zh="光是波,孔径边缘必然衍射→点源永远成像为爱里斑而不是点,分辨极限 θ=1.22λ/D:λ=550 nm 时 D=10 cm→1.4″,口径翻倍、最小分辨角减半→超过 ~2×D(mm) 的放大率只是把爱里斑放大=无效放大→双星角距与 θ 角力:从粘连圆斑到一分为二→干涉阵列用基线 B 拼出口径 D=B 的分辨本领,把地球变成望远镜 · 拖动旋转 / 空格运行/暂停" data-en="Light is a wave and any aperture edge diffracts → a point source never images to a point but to an Airy pattern; the limit is θ=1.22λ/D: at λ=550 nm, D=10 cm gives 1.4″ — double the aperture, halve the angle → magnification beyond ~2×D(mm) just enlarges the blur: empty magnification → binary stars pit their separation against θ: merged blob, then split → interferometer arrays combine two scopes on baseline B with the resolving power of D=B, turning Earth into a telescope · drag to orbit / Space = run/pause">光是波,孔径边缘必然衍射→点源永远成像为爱里斑而不是点,分辨极限 θ=1.22λ/D:λ=550 nm 时 D=10 cm→1.4″,口径翻倍、最小分辨角减半→超过 ~2×D(mm) 的放大率只是把爱里斑放大=无效放大→双星角距与 θ 角力:从粘连圆斑到一分为二→干涉阵列用基线 B 拼出口径 D=B 的分辨本领,把地球变成望远镜 · 拖动旋转 / 空格运行/暂停</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0a0d14,22,60);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(2.2,3.4,11.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.3,3.1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0x9ab4d8,0x0a0c10,0.5));
const key=new THREE.DirectionalLight(0xcfe0f2,0.9);key.position.set(5,10,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x6a8ab8,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:星空 + 望远镜 + 目镜视场 + 波前 + 干涉阵列 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x11141c,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(20,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
/* 远景星空(随机点) */
{
  const pos=[];
  for(let i=0;i<260;i++){
    const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI*0.48;
    const R=55;
    pos.push(R*Math.cos(e)*Math.cos(a),8+R*Math.sin(e),R*Math.cos(e)*Math.sin(a));
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xcfe0f2,size:0.16,transparent:true,opacity:0.8})));
}
/* 目标双星(角距在天空被夸张显示) */
const starM=new THREE.MeshBasicMaterial({color:0xfff4d8});
const star1=new THREE.Mesh(new THREE.SphereGeometry(0.16,14,12),starM);
star1.position.set(-9.5,12.5,-8);scene.add(star1);
const star2=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,12),new THREE.MeshBasicMaterial({color:0xd8e8ff}));
star2.position.set(-8.7,13.1,-8);scene.add(star2);
const glowM=new THREE.MeshBasicMaterial({color:0xfff4d8,transparent:true,opacity:0.16,depthWrite:false});
const glow1=new THREE.Mesh(new THREE.SphereGeometry(0.5,12,10),glowM);glow1.position.copy(star1.position);scene.add(glow1);
const glow2=new THREE.Mesh(new THREE.SphereGeometry(0.42,12,10),new THREE.MeshBasicMaterial({color:0xd8e8ff,transparent:true,opacity:0.14,depthWrite:false}));
glow2.position.copy(star2.position);scene.add(glow2);
/* 望远镜(可复用:干涉阵列放第二台) */
function makeScope(){
  const g=new THREE.Group();
  const tg=new THREE.Group();g.add(tg);          /* 只有镜筒倾斜,脚架保持直立 */
  const tubeM=new THREE.MeshStandardMaterial({color:0x8a96a8,roughness:0.4,metalness:0.5});
  const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.2,1.8,20),tubeM);
  tube.position.y=1.05;tg.add(tube);
  const aptRing=new THREE.Mesh(new THREE.TorusGeometry(0.185,0.025,10,28),
    new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.3,metalness:0.8}));
  aptRing.rotation.x=Math.PI/2;aptRing.position.y=1.95;tg.add(aptRing);
  const obstr=new THREE.Mesh(new THREE.CircleGeometry(0.055,16),
    new THREE.MeshStandardMaterial({color:0x2a3140,roughness:0.6}));
  obstr.rotation.x=-Math.PI/2;obstr.position.y=1.93;tg.add(obstr);
  const back=new THREE.Mesh(new THREE.SphereGeometry(0.14,14,12),
    new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85}));
  back.position.y=0.18;tg.add(back);
  tg.rotation.z=0.62;                       /* 筒身指向左上方的双星 */
  const mount=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.34,0.3),
    new THREE.MeshStandardMaterial({color:0x3a4250,roughness:0.6,metalness:0.4}));
  mount.position.y=-0.12;g.add(mount);
  const legM=new THREE.MeshStandardMaterial({color:0x2e3540,roughness:0.7});
  for(let i=0;i<3;i++){
    const a=i/3*Math.PI*2+0.5;
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,1.7,8),legM);
    leg.position.set(Math.cos(a)*0.34,-0.95,Math.sin(a)*0.34);
    leg.rotation.z=Math.cos(a)*0.28;leg.rotation.x=-Math.sin(a)*0.28;g.add(leg);
  }
  g.userData.tube=tg;
  return g;
}
const scope1=makeScope();scope1.position.set(-0.4,1.9,0.8);scene.add(scope1);
/* 波前平面:从孔径涌入镜筒(挂在镜筒轴向) */
const waveM=new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.22,
  side:THREE.DoubleSide,depthWrite:false});
const waves=[];
const waveHost=scope1.userData.tube;
for(let i=0;i<3;i++){
  const w=new THREE.Mesh(new THREE.CircleGeometry(0.185,24),waveM);
  w.rotation.x=Math.PI/2;waveHost.add(w);waves.push(w);
}
const rimPulse=new THREE.Mesh(new THREE.TorusGeometry(0.185,0.035,8,28),
  new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.7}));
rimPulse.rotation.x=Math.PI/2;rimPulse.position.y=1.95;waveHost.add(rimPulse);
/* 目镜视场:黑盘+双爱里斑 */
const viewG=new THREE.Group();
viewG.position.set(4.9,3.4,0);viewG.rotation.y=-0.42;scene.add(viewG);
const rim=new THREE.Mesh(new THREE.TorusGeometry(1.06,0.055,12,48),
  new THREE.MeshStandardMaterial({color:0x5a6474,roughness:0.35,metalness:0.7}));
viewG.add(rim);
const viewDisc=new THREE.Mesh(new THREE.CircleGeometry(1.0,48),
  new THREE.MeshBasicMaterial({color:0x060910}));
viewG.add(viewDisc);
function airySpot(){
  const g=new THREE.Group();
  const coreM=new THREE.MeshBasicMaterial({color:0xfff8e8,transparent:true,opacity:0.95});
  const core=new THREE.Mesh(new THREE.CircleGeometry(1,24),coreM);g.add(core);
  const rings=[];
  for(let i=0;i<2;i++){
    const rm=new THREE.MeshBasicMaterial({color:0xcfe0f2,transparent:true,opacity:0.3-i*0.13});
    const r=new THREE.Mesh(new THREE.RingGeometry(1.5+i*0.9,1.58+i*0.9,40),rm);g.add(r);rings.push(r);
  }
  g.visible=true;viewG.add(g);
  return {g,core,coreM,rings};
}
const spotA=airySpot(),spotB=airySpot();
const blob=new THREE.Mesh(new THREE.CircleGeometry(1,24),
  new THREE.MeshBasicMaterial({color:0xfff8e8,transparent:true,opacity:0.9}));
viewG.add(blob);
/* 干涉阵列:第二台镜 + 合束器 + 连接光管 + 条纹面板 */
const scope2=makeScope();scene.add(scope2);
const combM=new THREE.MeshStandardMaterial({color:0x6e7a8c,roughness:0.45,metalness:0.55});
const combiner=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.26,0.26),combM);scene.add(combiner);
const combPier=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,1.2,10),
  new THREE.MeshStandardMaterial({color:0x2e3540,roughness:0.7}));scene.add(combPier);
const linkM=new THREE.MeshStandardMaterial({color:0x9aa6b6,roughness:0.4,metalness:0.6,transparent:true,opacity:0.7});
const link1=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,1,8),linkM);scene.add(link1);
const link2=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,1,8),linkM);scene.add(link2);
/* 条纹面板 */
const fringeG=new THREE.Group();
fringeG.position.set(4.9,0.75,0);fringeG.rotation.y=-0.42;scene.add(fringeG);
const frFrame=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.95,0.06),
  new THREE.MeshStandardMaterial({color:0x1a2130,roughness:0.6}));
fringeG.add(frFrame);
const frBright=[],frDark=[];
for(let i=0;i<9;i++){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(0.11,0.7),
    new THREE.MeshBasicMaterial({color:0xfff8e8,transparent:true,opacity:0.9}));
  m.position.x=-0.6+i*0.15;m.position.z=0.04;fringeG.add(m);frBright.push(m);

function setLink(mesh,a,b){
  const dir=new THREE.Vector3().subVectors(b,a);const len=dir.length();
  mesh.scale.set(1,len,1);
  mesh.position.copy(a).addScaledVector(dir,0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
}

/* 状态 */
let mode='single',Dcm=10,sepAs=2,mag=60,baseB=10;
let playing=true,labelsOn=true,slowMo=false,wavesOn=true;
let simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 物理:λ=550 nm,1 rad=206265″;θmin=1.22λ/D;干涉 θ=λ/B;有效放大上限≈2×D(mm) */
const LAMBDA=550e-9,ASC=206265;
const thMin=()=>1.22*LAMBDA/(Dcm/100)*ASC;         /* arcsec */
const thInt=()=>LAMBDA/baseB*ASC;                  /* arcsec */
const resolved=()=>sepAs>thMin();

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');
  div.className='lbl '+(typeof cls==='function'?cls():cls);
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn,cls});div.textContent=textFn();return o;
}
const fmtAs=v=>v>=1?v.toFixed(2)+'″':(v*1000).toFixed(1)+' mas';
const lblStars=addLabel(()=>L(`双星 · 角距 ${sepAs.toFixed(1)}″`,`binary pair · separation ${sepAs.toFixed(1)}″`),
  new THREE.Vector3(-9.2,13.4,-8),'y');
const lblScope=addLabel(()=>L(`口径 D=${Dcm} cm → θ=${thMin().toFixed(2)}″`,
    `aperture D=${Dcm} cm → θ=${thMin().toFixed(2)}″`),
  new THREE.Vector3(-1.6,4.6,0.8),'b');
const lblWave=addLabel(()=>L('平面波前在孔径边缘衍射','plane wavefronts diffract at the rim'),
  new THREE.Vector3(0.6,5.3,0),'g',()=>wavesOn);
const lblView=addLabel(()=>{
  return L(`目镜视场:${resolved()?'已分辨,两枚爱里斑':'未分辨,粘连成一团'}`,
    `eyepiece view: ${resolved()?'resolved — two Airy discs':'unresolved — one merged blob'}`);},
  new THREE.Vector3(4.9,4.75,0),()=>resolved()?'g':'r');
const lblMag=addLabel(()=>{
  const empty=mag>2*Dcm;
  return L(`放大率 ${mag.toFixed(0)}×${empty?' · 超过 2×D(mm),无效放大':' · 有效(≤2×D_mm)'}`,
    `${mag.toFixed(0)}×${empty?' · beyond 2×D(mm): empty magnification':' · usable (≤2×D in mm)'}`);},
  new THREE.Vector3(4.9,2.15,0),()=>mag>2*Dcm?'o':'b');
const lblIntf=addLabel(()=>L(`基线 B=${baseB} m → 干涉分辨 ${fmtAs(thInt())}`,
    `baseline B=${baseB} m → interferometric ${fmtAs(thInt())}`),
  new THREE.Vector3(3.4,1.4,0),'o',()=>mode==='interf');
const lblFringe=addLabel(()=>{
  const vis=Math.exp(-Math.pow(sepAs/thInt(),2)*0.8);
  return L(`条纹对比度 ${(vis*100).toFixed(0)}%:${vis>0.5?'双星被基线「看成」一点':'角距超过 λ/B,条纹被抹平'}`,
    `fringe contrast ${(vis*100).toFixed(0)}%: ${vis>0.5?'pair seen as one point by the baseline':'separation exceeds λ/B — fringes washed out'}`);},
  new THREE.Vector3(4.9,-0.05,0),()=>mode==='interf'?'y':'');
const lblSeeing=addLabel(()=>L('地表视宁度 ~1″:再大的口径也要自适应光学来救',
    'ground seeing ~1″: even big apertures need adaptive optics'),
  new THREE.Vector3(-4.5,1.0,1.2),'r',()=>thMin()<1);

function setD(v){Dcm=clamp(Math.round(v),5,40);
  document.getElementById('sD').value=Dcm;
  document.getElementById('sDVal').textContent=Dcm+' cm';updateStats();}
function setSep(v){sepAs=clamp(v,0.2,6);
  document.getElementById('sSep').value=sepAs;
  document.getElementById('sSepVal').textContent=sepAs.toFixed(1)+'″';updateStats();}
function setMag(v){mag=clamp(Math.round(v),20,300);
  document.getElementById('sMag').value=mag;
  document.getElementById('sMagVal').textContent=mag.toFixed(0)+'×';updateStats();}
function setB(v){baseB=clamp(Math.round(v),1,50);
  document.getElementById('sB').value=baseB;
  document.getElementById('sBVal').textContent=baseB+' m';updateStats();}
function setMode(m){mode=m;
  document.getElementById('bSingle').classList.toggle('on',m==='single');
  document.getElementById('bInterf').classList.toggle('on',m==='interf');
  scope2.visible=combiner.visible=combPier.visible=link1.visible=link2.visible=(m==='interf');
  fringeG.visible=(m==='interf');
  layoutInterf();updateStats();}
function layoutInterf(){
  const x2=2.6+Math.log10(baseB)*2.4;           /* 基线的对数视觉映射 */
  scope2.position.set(x2,1.9,0.8);
  combPier.position.set(1.1+x2/2-0.4,0.6,0.8);
  combiner.position.set(1.1+x2/2-0.4,1.32,0.8);
  setLink(link1,new THREE.Vector3(-0.35,3.55,0.8),combiner.position);
  setLink(link2,new THREE.Vector3(x2-0.35,3.55,0.8),combiner.position);
}

const STEPS=[
 {b:'点源永远不成像为点',be:'A point source never images to a point',
  d:'进入镜筒的是平面波前,孔径边缘把波前「剪」出衍射:像点散成中央亮斑+一圈圈细环——爱里斑,这是任何打磨都消不掉的波动性代价。',
  de:'A telescope collects plane wavefronts, and the aperture edge shears them into diffraction: the image of a point spreads into a bright disc ringed by faint circles — the Airy pattern, an unavoidable toll of wave nature.',

 {b:'θ=1.22λ/D',be:'θ = 1.22λ/D',

 {b:'双星分辨演示',be:'Splitting the double star',

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stRes').textContent=fmtAs(thMin());
  document.getElementById('stAiry').innerHTML=(2*thMin()*mag/60).toFixed(1)+'<small> ′</small>';
  const mEl=document.getElementById('stMag');
  mEl.innerHTML=mag+'<small> ×</small>';
  mEl.className='v '+(mag>2*Dcm?'warn':'ok');
  document.getElementById('stInt').textContent=fmtAs(thInt());
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSingle').addEventListener('click',()=>setMode('single'));
document.getElementById('bInterf').addEventListener('click',()=>setMode('interf'));
document.getElementById('sD').addEventListener('input',e=>setD(+e.target.value));
document.getElementById('sSep').addEventListener('input',e=>setSep(+e.target.value));
document.getElementById('sMag').addEventListener('input',e=>setMag(+e.target.value));
document.getElementById('sB').addEventListener('input',e=>setB(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglWave').addEventListener('change',e=>{wavesOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0a0d14:0xdfe3ea);
  scene.fog.color.setHex(dark?0x0a0d14:0xdfe3ea);
  groundM.color.setHex(dark?0x11141c:0xc4c9d2);
  viewDisc.material.color.setHex(dark?0x060910:0x10141c);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 目镜视场:爱里斑角径 × 放大率 → 视盘上的尺寸(视觉常数 800) */
  const airyR=clamp(thMin()/ASC*mag*800,0.06,0.92);
  const sepPx=sepAs/ASC*mag*800;
  const ok=resolved();
  spotA.g.visible=spotB.g.visible=ok;
  blob.visible=!ok;
  if(ok){
    for(const [sp,off] of [[spotA,-1],[spotB,1]]){
      sp.g.position.x=off*Math.min(sepPx/2,0.95);
      sp.core.scale.setScalar(Math.max(airyR,0.05));
      sp.rings.forEach((r,i)=>r.scale.setScalar(Math.max(airyR,0.05)));
    }
  }else{
    blob.scale.setScalar(Math.max(airyR*1.25,0.08));
    blob.material.opacity=0.85;
  }
  /* 干涉条纹 */
  if(mode==='interf'){
    const vis=Math.exp(-Math.pow(sepAs/thInt(),2)*0.8);
    const spacing=0.26-0.22*clamp(Math.log10(baseB)/1.7,0,1);
    const stride=clamp(spacing*1.4,0.055,0.165);
    frBright.forEach((m,i)=>{
      m.scale.x=clamp(spacing/0.15,0.3,1.6);
      m.position.x=(i-4)*stride;
      m.material.opacity=0.15+0.75*vis;
    });
  }
  /* 波前涌入 + 孔径边缘辉光脉动 */
  waves.forEach((w,i)=>{
    w.visible=wavesOn;
    const ph=((simT*0.4+i/3)%1);
    w.position.y=1.9-ph*1.6;
    w.material.opacity=0.26*(1-ph);
  });
  rimPulse.visible=wavesOn;
  rimPulse.material.opacity=0.35+0.3*Math.sin(simT*4);
  star1.scale.setScalar(1+0.12*Math.sin(simT*3.1));
  star2.scale.setScalar(1+0.12*Math.sin(simT*3.7+1));
  glow1.scale.setScalar(1+0.1*Math.sin(simT*2.4));
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on){
      r.o.element.textContent=r.text();
      if(typeof r.cls==='function')r.o.element.className='lbl '+r.cls();
    }
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
setD(10);setSep(2);setMag(60);setB(10);
setMode('single');
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
