<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>泛素-蛋白酶体系统 · 细胞的死亡标签流水线</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.bad{color:#ff6b6b}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="泛素-蛋白酶体系统" data-en="Ubiquitin–Proteasome System">泛素-蛋白酶体系统</h1>
  <div class="sub" data-zh="E1 用 ATP 激活泛素,E3 连接酶认出错误折叠蛋白并盖上 K48 多聚链——≥4 个泛素就是死亡标签;19S 盖帽认链、剥泛素、把蛋白拉直塞进 20S 空心筒,筒内蛋白酶把它剪成 3–25 肽回收 · 关掉 E3 或点「硼替佐米」堵筒看垃圾堆积,切自噬对照看大件回收 · 拖动旋转 / 空格运行/暂停" data-en="E1 activates ubiquitin with ATP; E3 ligases recognise misfolded proteins and stamp a K48 chain — ≥4 ubiquitins is a death tag. The 19S cap reads the chain, strips ubiquitin for reuse, unfolds the substrate and feeds it into the hollow 20S barrel, where proteases cut it into 3-25 residue peptides · switch E3 off or block the barrel with bortezomib to watch garbage pile up; autophagy handles the bulky waste · drag to orbit / Space = run/pause">E1 用 ATP 激活泛素,E3 连接酶认出错误折叠蛋白并盖上 K48 多聚链——≥4 个泛素就是死亡标签;19S 盖帽认链、剥泛素、把蛋白拉直塞进 20S 空心筒,筒内蛋白酶把它剪成 3–25 肽回收 · 关掉 E3 或点「硼替佐米」堵筒看垃圾堆积,切自噬对照看大件回收 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="泛素链长" data-en="Ub chain">泛素链长</span><span class="v" id="stUb">—</span>
  <span class="k" data-zh="已降解蛋白" data-en="Proteins degraded">已降解蛋白</span><span class="v" id="stDeg">—</span>
  <span class="k" data-zh="胞内错误折叠" data-en="Misfolded load">胞内错误折叠</span><span class="v" id="stMis">—</span>
  <span class="k" data-zh="短肽产出" data-en="Peptides">短肽产出</span><span class="v" id="stPep">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnE3" data-zh="关闭 E3 连接酶" data-en="E3 off">关闭 E3 连接酶</button>
    <button class="abtn" id="btnBtz" data-zh="硼替佐米堵筒" data-en="Bortezomib plug">硼替佐米堵筒</button>
    <button class="abtn" id="btnAuto" data-zh="自噬对照模式" data-en="Autophagy mode">自噬对照模式</button>
    <button class="abtn" id="btnReplay" data-zh="重播" data-en="Replay">重播</button>
  </div>
  <div class="row">
    <label data-zh="速度" data-en="Speed">速度</label>
    <input id="sSpd" type="range" min="30" max="220" step="5" value="100">
    <span class="val" id="sSpdVal">1.0×</span>
  </div>
  <div class="row">
    <label data-zh="链长阈值" data-en="Chain threshold">链长阈值</label>
    <input id="sChain" type="range" min="4" max="8" step="1" value="4">
    <span class="val" id="sChainVal">≥4 个</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../autophagy/" data-zh="自噬:大件回收" data-en="Autophagy: bulk recycling">自噬</a>
    <a href="../protein-folding/" data-zh="蛋白质折叠" data-en="Protein folding">蛋白质折叠</a>
    <a href="../cancer-p53/" data-zh="p53 与癌症" data-en="p53 and cancer">p53 与癌症</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 生物学锚点:26S 蛋白酶体=20S 空心筒(α7β7β7α7 四环)+两端 19S 调节颗粒;
   E1-E2-E3 三步接酶;K48 多聚泛素链 ≥4 个为 26S 识别信号;
   19S 的 6 种 ATPase 把底物去折叠;20S β 亚基苏氨酸蛋白酶切出 3–25 肽;
   硼替佐米=20S β5 抑制剂(多发性骨髓瘤药);错误折叠蛋白堆积=神经退行性疾病特征 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
const easeOut=p=>1-Math.pow(1-p,3);
const easeIO=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
const speedMul=clamp(parseFloat(qs.get('speed'))||1,0.25,3);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,50);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0.4,2.6,12.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.6,0.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.5;controls.maxDistance=40;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,9,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-7,5,-5);scene.add(fill);

/* ---- 材质 ---- */
const floorM=new THREE.MeshStandardMaterial({color:0x171b22,roughness:0.96});
const alphaM=new THREE.MeshStandardMaterial({color:0x3d5a80,roughness:0.35,metalness:0.45});
const betaM=new THREE.MeshStandardMaterial({color:0xd07b3e,roughness:0.35,metalness:0.4});
const capM=new THREE.MeshStandardMaterial({color:0x6d7f95,roughness:0.35,metalness:0.55});
const lidM=new THREE.MeshStandardMaterial({color:0x8fa3b8,roughness:0.3,metalness:0.6,emissive:0x223444,emissiveIntensity:0.4});
const ubM=new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.3,emissive:0x996b00,emissiveIntensity:0.55});
const misM=new THREE.MeshStandardMaterial({color:0xff8787,roughness:0.4,emissive:0x801f1f,emissiveIntensity:0.55});
const okM=new THREE.MeshStandardMaterial({color:0x74d892,roughness:0.4,emissive:0x1d5c2c,emissiveIntensity:0.3});
const pepM=new THREE.MeshStandardMaterial({color:0xc0eb75,roughness:0.35,emissive:0x4c6b12,emissiveIntensity:0.5});
const plugM=new THREE.MeshStandardMaterial({color:0xe03131,roughness:0.3,emissive:0x7a0d0d,emissiveIntensity:0.6});
const shellM=new THREE.MeshStandardMaterial({color:0x9fd8ff,transparent:true,opacity:0.14,roughness:0.2,side:THREE.DoubleSide});
const lysoM=new THREE.MeshStandardMaterial({color:0xc2574a,roughness:0.5,emissive:0x4a1009,emissiveIntensity:0.35});

/* ---- 胞质地面 ---- */
const floor=new THREE.Mesh(new THREE.CylinderGeometry(16,16,0.16,48),floorM);
floor.position.y=-3.6;scene.add(floor);

/* ---- 26S 蛋白酶体(轴向 x,进口在左) ---- */
const protG=new THREE.Group();scene.add(protG);
const ringGeo=new THREE.TorusGeometry(0.75,0.24,12,32);
[[-0.62,alphaM],[-0.21,betaM],[0.21,betaM],[0.62,alphaM]].forEach(([x,m])=>{
  const r=new THREE.Mesh(ringGeo,m);r.rotation.y=Math.PI/2;r.position.x=x;protG.add(r);
});
[[-1.42,capM],[1.42,capM]].forEach(([x,m])=>{
  const r=new THREE.Mesh(new THREE.TorusGeometry(0.6,0.15,10,28),m);
  r.rotation.y=Math.PI/2;r.position.x=x;protG.add(r);
});
/* 19S 盖帽六聚体(左进口,可开盖) */
const lids=[];
for(let i=0;i<6;i++){
  const a=i/6*Math.PI*2;
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.19,12,10),lidM);
  m.position.set(-1.72,Math.cos(a)*0.52,Math.sin(a)*0.52);
  protG.add(m);lids.push(m);
}
/* 硼替佐米塞子 */
const plug=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.42,0.5,16),plugM);
plug.rotation.z=Math.PI/2;plug.position.set(-1.95,0,0);plug.visible=false;scene.add(plug);

/* ---- 酶:E1 / E2 / E3 ---- */
const e1=new THREE.Mesh(new THREE.SphereGeometry(0.18,12,10),
  new THREE.MeshStandardMaterial({color:0xb197fc,roughness:0.3,emissive:0x5f3dc4,emissiveIntensity:0.5}));
e1.position.set(-5.4,2.4,0);scene.add(e1);
const e2=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,10),
  new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.3,emissive:0x1864ab,emissiveIntensity:0.5}));
e2.position.set(-4.4,1.5,0);scene.add(e2);
const e3=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.09,8,20),
  new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.3,emissive:0xa34e00,emissiveIntensity:0.55}));
e3.position.set(-3.3,0.55,0);e3.rotation.y=Math.PI/2;scene.add(e3);
const ATP=new THREE.Mesh(new THREE.OctahedronGeometry(0.09),
  new THREE.MeshBasicMaterial({color:0xffe08a}));
ATP.visible=false;scene.add(ATP);

/* ---- 主演示蛋白(错误折叠,8 球聚簇) ---- */
const starG=new THREE.Group();scene.add(starG);
const starS=[];
for(let i=0;i<8;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,8),misM);
  const off=v3((Math.random()*2-1)*0.16,(Math.random()*2-1)*0.16,(Math.random()*2-1)*0.16);
  m.position.copy(off);starG.add(m);starS.push({m,off});
}
starG.position.set(-6.8,0.7,0);
/* 解折叠后的一字队形(局部) */
const lineOffs=[];for(let i=0;i<8;i++)lineOffs.push(v3((3.5-i)*0.24,0,0));

/* ---- 泛素池:链 8 粒 + 飞行粒 2 粒 ---- */
const chain=[];
for(let i=0;i<8;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),ubM);
  m.visible=false;scene.add(m);chain.push(m);
}
const fly1=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),ubM);fly1.visible=false;scene.add(fly1);
const fly2=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),ubM);fly2.visible=false;scene.add(fly2);

/* ---- 胞内游离蛋白(背景 + 堆积演示) ---- */
const floaters=[];
for(let i=0;i<12;i++){
  const mis=i<9;   // 前 9 个可当错误折叠堆积体
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,8),mis?misM:okM);
  m.position.set(-6+Math.random()*7,(Math.random()*2-1)*2.2,(Math.random()*2-1)*1.6);
  m.userData={mis,v:v3((Math.random()-0.5)*0.4,(Math.random()-0.5)*0.3,(Math.random()-0.5)*0.3),ph:Math.random()*9};
  m.scale.setScalar(0.001);
  scene.add(m);floaters.push(m);
}
/* 被堵在盖帽前排队的带链蛋白 */
const queue=[];
for(let i=0;i<5;i++){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,8),misM);g.add(body);
  for(let k=0;k<4;k++){
    const u=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6),ubM);
    u.position.set(0.16+0.11*k,0.1*Math.sin(k*1.7),0.08*Math.cos(k*1.3));g.add(u);
  }
  g.visible=false;scene.add(g);queue.push(g);
}

/* ---- 短肽产物(实例化) ---- */
const PEPMAX=36;
const pepIM=new THREE.InstancedMesh(new THREE.OctahedronGeometry(0.06),pepM,PEPMAX);
scene.add(pepIM);
const peps=[];for(let i=0;i<PEPMAX;i++)peps.push({p:v3(),v:v3(),life:0});
const ZERO=new THREE.Matrix4().makeScale(0,0,0);
for(let i=0;i<PEPMAX;i++)pepIM.setMatrixAt(i,ZERO);
pepIM.instanceMatrix.needsUpdate=true;
function spawnPep(){
  for(let i=0;i<PEPMAX;i++){
    if(peps[i].life<=0){
      const p=peps[i];
      p.p.set(1.5,(Math.random()*2-1)*0.15,(Math.random()*2-1)*0.15);
      p.v.set(1.2+Math.random()*0.8,-0.5-Math.random()*0.6,(Math.random()-0.5)*0.8);
      p.life=1.6;return;
    }
  }
}

/* ---- 自噬对照件 ---- */
const aggrG=new THREE.Group();aggrG.position.set(3.6,-0.4,0);aggrG.visible=false;scene.add(aggrG);
for(let i=0;i<7;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.16+Math.random()*0.08,10,8),misM);
  m.position.set((Math.random()*2-1)*0.28,(Math.random()*2-1)*0.24,(Math.random()*2-1)*0.2);

}
const apG=new THREE.Group();apG.position.copy(aggrG.position);apG.visible=false;scene.add(apG);
apG.add(new THREE.Mesh(new THREE.SphereGeometry(1.05,26,20),shellM));
const apIn=new THREE.Mesh(new THREE.SphereGeometry(0.88,24,18),shellM.clone());
apIn.material.opacity=0.1;apG.add(apIn);
const lyso=new THREE.Mesh(new THREE.SphereGeometry(0.78,22,16),lysoM);
lyso.position.set(-5.0,-2.4,0);lyso.visible=false;scene.add(lyso);

/* ---- 状态(先于所有闭包引用声明,防 TDZ) ---- */
let phase=0,phaseT=0,chainLen=4,speedK=1;
let e3On=true,plugOn=false,autoMode=false;
let degCount=0,pepCount=0,misLoad=2,shownChain=0,lastEat=-1;
let notifyT=0,notifyZ='',notifyE='';

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('19S 调节盖帽:认链 · 剥泛素 · ATP 解折叠','19S cap: reads chain, strips Ub, unfolds'),v3(-2.3,1.7,0),'b');
addLabel(()=>L('20S 空心筒:β 亚基蛋白酶切肽','20S barrel: β-subunit proteases'),v3(0.55,1.05,0),'o');
addLabel(()=>L('短肽出口 → 氨基酸回收','peptide exit → amino-acid recycling'),v3(1.6,-0.95,0),'g');
addLabel(()=>L('E1 · E2 · E3 三步接酶','E1 · E2 · E3 cascade'),v3(-4.6,2.8,0),'b');
addLabel(()=>L(`K48 多聚泛素链 ≥${chainLen} = 死亡标签`,`K48 poly-Ub ≥${chainLen} = death tag`),v3(-2.4,1.6,0),'o',()=>phase>=2&&phase<4);
addLabel(()=>L('错误折叠蛋白:疏水残基外露','misfolded: hydrophobic residues exposed'),v3(-2.5,-1.5,0),'r',()=>phase<6);
addLabel(()=>L('蛋白酶体被堵:底物排队','proteasome blocked: queue forms'),v3(-2.9,1.9,0),'r',()=>plug.visible);
addLabel(()=>L('双膜自噬体:LC3 标记','autophagosome: LC3-labelled'),v3(3.6,1.6,0),'g',()=>phase===6);
addLabel(()=>L('溶酶体:酸性水解酶','lysosome: acid hydrolases'),v3(-5.0,-1.3,0),'r',()=>phase===6);
const lblNotify=addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',v3(0,3.6,0),'o');

/* ---- 状态机 ---- */
const PHASE_ZH=['E1 激活携带','E3 认错','死亡标签','投递解折叠','筒内剪切','回收','自噬对照'];
const PHASE_EN=['E1 activates','E3 recognition','Death tag','Dock & unfold','Barrel cleavage','Recycling','Autophagy contrast'];
const PHASE_DUR=[2.2,2.2,3.0,2.6,2.8,2.0,4.4];
let pulseT=1;const glow={e1:0,e2:0,e3:0};
function notify(zh,en){notifyT=3.4;notifyZ=zh;notifyE=en;}
function resetStar(){
  starG.visible=true;starG.position.set(-6.8,0.7,0);starG.scale.setScalar(1);
  starS.forEach(s=>{s.m.scale.setScalar(1);s.m.position.copy(s.off);});
  chain.forEach(m=>m.visible=false);shownChain=0;lastEat=-1;
  fly1.visible=fly2.visible=false;ATP.visible=false;
  queue.forEach(q=>q.visible=false);
}
function setPhase(i){
  phase=i;phaseT=0;
  if(i===0)resetStar();
  if(i<6){aggrG.visible=false;apG.visible=false;lyso.visible=false;}
  else{starG.visible=false;chain.forEach(m=>m.visible=false);
       aggrG.visible=true;aggrG.position.set(3.6,-0.4,0);aggrG.scale.setScalar(0.001);
       apG.visible=true;apG.position.copy(aggrG.position);apG.scale.setScalar(0.001);lyso.visible=true;}
  syncSteps();
}

/* ---- 相位驱动 ---- */
function updatePhase(dt0,dt){
  const t=phaseT;
  /* 酶发光 */
  const tg={e1:(phase===0?1:0),e2:(phase<=1?1:0),e3:(phase>=1&&phase<=3?1:0)};
  for(const k of ['e1','e2','e3']){
    glow[k]+=(tg[k]-glow[k])*Math.min(1,dt0*6);
    if(k==='e1')e1.material.emissiveIntensity=0.3+glow.e1*1.4;
    if(k==='e2')e2.material.emissiveIntensity=0.3+glow.e2*1.4;
    if(k==='e3')e3.material.emissiveIntensity=0.35+glow.e3*1.4;
  }
  /* 游离蛋白漂浮 + 堆积(E3 失效 / 堵筒时涨) */
  const target=(e3On&&!plugOn)?2:(plugOn?9:12);
  misLoad+=(target-misLoad)*Math.min(1,dt0*0.8);
  floaters.forEach((m,i)=>{
    const active=m.userData.mis&&i<Math.round(misLoad);
    m.scale.setScalar(m.scale.x+((active?1:0.001)-m.scale.x)*Math.min(1,dt0*3));
    m.position.addScaledVector(m.userData.v,dt0);
    ['x','y','z'].forEach(ax=>{if(Math.abs(m.position[ax])>(ax==='z'?1.8:3.4))m.userData.v[ax]*=-1;});
    if(active)m.position.y+=Math.sin(simT*3+m.userData.ph)*0.002;
  });
  /* 阶段演绎 */
  if(phase===0){
    const p=clamp(t/2.2,0,1);
    ATP.visible=true;
    ATP.position.lerpVectors(e1.position,e2.position,clamp(p*2,0,1));
    fly1.visible=p>0.35&&p<1;
    fly1.position.lerpVectors(e1.position,e2.position,clamp((p-0.35)/0.55,0,1));
    e2.position.lerpVectors(v3(-4.4,1.5,0),v3(-3.75,1.0,0),clamp((p-0.4)/0.6,0,1));
    starG.position.x=-6.8+easeOut(p)*1.6;             // 底物漂近
  }else if(phase===1){
    const p=easeOut(clamp(t/1.4,0,1));
    starG.position.lerpVectors(v3(-5.2,0.7,0),e3.position.clone().add(v3(0.55,0,0)),p);
    fly1.visible=p<0.6;
    fly1.position.lerpVectors(e2.position,starG.position.clone().add(v3(0.15,0.15,0)),clamp(p/0.6,0,1));
    ATP.visible=t<0.6;
  }else if(phase===2){
    ATP.visible=false;
    const n=clamp(Math.floor(t/0.5)+1,1,chainLen);
    shownChain=n;
    const head=starG.position.clone().add(v3(0.14,0.1,0));
    for(let i=0;i<chainLen;i++){
      chain[i].visible=i<n;
      chain[i].position.copy(head).add(v3(0.16+0.13*i,0.12*Math.sin(i*1.7+1),0.1*Math.cos(i*1.3)));
    }
    starG.position.x=-2.75+Math.sin(t*2)*0.03;        // E3 口就位微颤
  }else if(phase===3){
    const head=starG.position;
    const docked=easeOut(clamp(t/0.9,0,1));
    head.lerpVectors(v3(-2.75,0.55,0),v3(-1.5,0,0),docked);
    for(let i=0;i<chainLen;i++)chain[i].visible=i<shownChain-docked*chainLen; // 剥链回收
    const up=clamp((t-0.9)/1.0,0,1);                   // 解折叠
    starS.forEach((s,i)=>s.m.position.lerpVectors(s.off,lineOffs[i],easeIO(up)));
    if(!plugOn&&up>=1){                               // 喂进筒口
      const feed=clamp((t-1.9)/0.7,0,1)*3.0;
      starG.position.x=-1.5+feed;
      starS.forEach((s,i)=>{
        const wx=starG.position.x+lineOffs[i].x;
        s.m.scale.setScalar(wx>0.55?0.001:1);
      });
    }
    lids.forEach((m,i)=>{
      const a=i/6*Math.PI*2,open=easeOut(clamp(t/0.8,0,1));
      m.position.set(-1.72-0.3*open,Math.cos(a)*0.52,Math.sin(a)*0.52);
    });
  }else if(phase===4){
    starG.visible=false;
    const eat=clamp(Math.floor(t/0.4),0,8);           // 剪切事件→短肽
    while(lastEat<eat){lastEat++;spawnPep();spawnPep();}
    lids.forEach(m=>{m.position.x+=(-1.72-m.position.x)*Math.min(1,dt0*4);});
  }else if(phase===5){
    starG.visible=false;
  }else{ /* phase 6:自噬 */
    starG.visible=false;chain.forEach(m=>m.visible=false);
    const grow=easeOut(clamp(t/1.4,0,1));
    const travel=clamp((t-1.6)/2.0,0,1);
    const p=aggrG.position.clone().lerp(lyso.position,travel);
    apG.position.copy(p);aggrG.position.copy(p);
    aggrG.scale.setScalar(grow);
    apG.scale.setScalar(grow*(1-travel*0.85));        // 与溶酶体融合
    aggrG.visible=travel<0.97;
  }
  if(phase!==3&&phase!==4)lids.forEach(m=>{m.position.x+=(-1.72-m.position.x)*Math.min(1,dt0*4);});
  /* 堵筒排队 */
  if(plugOn&&phase>=2&&phase<6){
    queue.forEach((q,i)=>{
      q.visible=true;
      q.position.set(-2.5-0.62*i,0.35*Math.sin(i*1.9),0.15*Math.cos(i*1.4));
    });
  }else queue.forEach(q=>q.visible=false);
  /* 短肽运动 */
  for(let i=0;i<PEPMAX;i++){
    const p=peps[i];
    if(p.life>0){
      p.life-=dt0;p.v.y-=0.4*dt0;p.p.addScaledVector(p.v,dt0);
      const m=new THREE.Matrix4().setPosition(p.p);
      pepIM.setMatrixAt(i,m);
    }else pepIM.setMatrixAt(i,ZERO);
  }
  pepIM.instanceMatrix.needsUpdate=true;
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';

  htmlEl.lang=LANG==='en'?'en':'zh-CN';

    if(el.tagName==='INPUT')return;

  });

  document.title=L('泛素-蛋白酶体系统 · 细胞的死亡标签流水线','Ubiquitin–Proteasome System · the cell\'s death-tag assembly line');
  buildSteps();setPlayLabel();updateStats();
}

/* ---- 讲解步骤 ---- */
const STEPS=[
  {zh:'激活与携带:E1 以 ATP 激活泛素 C 端,交给 E2 载体',en:'Activation: E1 adenylates ubiquitin\'s C-tail with ATP, hands it to carrier E2'},
  {zh:'认错盖章:E3 连接酶专一识别错误折叠/氧化损伤的底物',en:'Recognition: the E3 ligase specifically binds misfolded or oxidised substrates'},
  {zh:'死亡标签:K48 多聚泛素链串到 ≥4 个,即成 26S 的提货单',en:'Death tag: a K48 poly-Ub chain of ≥4 ubiquitins is the 26S pickup ticket'},
  {zh:'投递解折叠:19S 盖帽认链、剥下泛素循环用,6 种 ATPase 把蛋白拉直',en:'Dock & unfold: the 19S cap reads the chain, strips Ub for reuse, and 6 AAA+ ATPases pull the chain straight'},
  {zh:'筒内剪切:底物进入 20S 空心筒,β 亚基把它剪成 3–25 肽',en:'Barrel cleavage: the substrate enters the hollow 20S core; β-subunits cut it into 3-25 residue peptides'},
  {zh:'回收:短肽漂出,水解为氨基酸再利用;人体每天翻新 ~1/3 蛋白',en:'Recycling: peptides diffuse out and hydrolyse to amino acids; the body turns over ~1/3 of its protein daily'},
  {zh:'大件走自噬:聚集体包进双膜自噬体,与溶酶体合并消化',en:'Bulky waste goes to autophagy: aggregates are wrapped in a double membrane and fused with lysosomes'},
];
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>setPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===phase));
}

/* ---- 统计 ---- */
function updateStats(){
  const n=(phase===2||phase===3)?Math.max(shownChain,phase===3?0:1):0;
  document.getElementById('stUb').innerHTML=n+'<small> / ≥'+chainLen+'</small>';
  document.getElementById('stDeg').innerHTML=degCount+'<small> 个</small>';
  const m=document.getElementById('stMis');
  m.innerHTML=Math.round(misLoad)+'<small> 个</small>';
  m.className='v'+((e3On&&!plugOn)?' ok':' bad');
  document.getElementById('stPep').innerHTML=pepCount+'<small> ×~45 肽</small>';
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=playing?dt0*speedK*speedMul:0;
  simT+=dt0;
  if(playing){
    phaseT+=dt;
    if(phaseT>=PHASE_DUR[phase]){
      phaseT=0;
      if(phase===4)degCount++;
      if(phase===5){pepCount+=8;resetStar();}          // 一条蛋白跑完,重开
      phase=phase===6?0:(phase+1)%7;
      if(phase===6){                                   // 进入自噬演示
        aggrG.visible=true;aggrG.position.set(3.6,-0.4,0);aggrG.scale.setScalar(0.001);
        apG.visible=true;apG.position.copy(aggrG.position);apG.scale.setScalar(0.001);lyso.visible=true;
      }else{                                           // 其余相位:流水线复位
        resetStar();aggrG.visible=false;apG.visible=false;lyso.visible=false;
      }
      syncSteps();
    }
  }
  if(notifyT>0)notifyT-=dt0;
  updatePhase(dt0,dt);
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    const t=r.text();const on=labelsOn&&r.vis()&&t!=='';
    r.o.visible=on;if(on)r.o.element.textContent=t;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

document.getElementById('tglLabels').checked=labelsOn;
resetStar();

degCount=3;pepCount=24;misLoad=2;
applyTheme();applyLang();setPlayLabel();
start();
