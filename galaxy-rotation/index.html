<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星系旋转曲线 · 90% 看不见的质量</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#b197fc;
    --bg:#0a0c13; --panel:rgba(13,15,22,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,15,22,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,15,22,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#7048e8;
    --bg:#e8edf4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.v { border-color: rgba(177,151,252,.9); color: #e5dbff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.v { color:#5f3dc4; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.v { color: #e5dbff; border-color: rgba(177,151,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  :root[data-theme="light"] .chip.v { color:#5f3dc4; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(177,151,252,.6); background: rgba(177,151,252,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(112,72,232,.55); background: rgba(112,72,232,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(177,151,252,.10); border-color: rgba(177,151,252,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(112,72,232,.08); border-color: rgba(112,72,232,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #e5dbff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="星系旋转曲线 · 90% 看不见的质量" data-en="Galaxy Rotation Curves · 90% Unseen">星系旋转曲线 · 90% 看不见的质量</h1>
  <div class="sub" data-zh="开普勒告诉我们:离太阳越远的行星转得越慢,因为几乎全部质量都聚在中心恒星身上;可星系不守这个规矩——把看得见的恒星与气体加起来,外缘速度本该一路坠落,实测却在几十 kpc 外依旧平坦,银河系约 220 km/s,M33 到 22 kpc 都不掉;要托平曲线,就必须有 M(r)∝r、ρ∝1/r² 的暗物质晕,把可见质量压到总质量的 ~15%;子弹星系团里,引力透镜称出的质量峰与 X 射线气体峰明显错位,构成暗物质存在的第二重独立证据 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Kepler taught us planets slow down with distance because nearly all the mass sits in the central star; galaxies refuse to obey — add up the visible stars and gas and the outer edge should fall away, yet measured curves stay flat past tens of kpc: ~220 km/s for the Milky Way, flat to 22 kpc for M33; flattening the curve demands a dark halo with M(r)∝r and ρ∝1/r², leaving visible matter only ~15% of the total; in the Bullet Cluster the lensing mass peak is clearly offset from the X-ray gas peak — a second, independent proof of dark matter · 3D interactive demo · drag to orbit · Space = run/pause">星系旋转曲线 · 90% 看不见的质量</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="v(15 kpc)处速度" data-en="Speed at 15 kpc">v(15 kpc)处速度</span><span class="v" id="stV15">—</span>
  <span class="k" data-zh="可见盘质量" data-en="Visible disk mass">可见盘质量</span><span class="v" id="stMv">—</span>
  <span class="k" data-zh="暗晕质量" data-en="Halo mass">暗晕质量</span><span class="v" id="stMh">—</span>
  <span class="k" data-zh="暗物质占比" data-en="Dark fraction">暗物质占比</span><span class="v" id="stFr">—</span>
  <span class="k" data-zh="外/内角速度比" data-en="Outer/inner ω">外/内角速度比</span><span class="v" id="stOm">—</span>
</div>

<div id="plot">
  <h3 data-zh="旋转曲线 v(r):灰虚线=只有可见质量的开普勒预期,亮线=当前模型(随滑块实时重画);叠加 M33 实测(TRINGS HI 21cm)到 ~22 kpc 仍平坦" data-en="Rotation curve v(r): gray dashed = Keplerian expectation with visible mass only, bright line = current model (redrawn live with the slider); M33 measured points (TRINGS HI 21cm) stay flat to ~22 kpc">旋转曲线 v(r):灰虚线=只有可见质量的开普勒预期,亮线=当前模型(随滑块实时重画);叠加 M33 实测(TRINGS HI 21cm)到 ~22 kpc 仍平坦</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="蓝白恒星:可见盘" data-en="blue-white stars: visible disk">蓝白恒星:可见盘</span>
    <span class="chip.o" data-zh="黄色核球:老年星" data-en="yellow bulge: old stars">黄色核球:老年星</span>
    <span class="chip.g" data-zh="淡青:外围气体盘" data-en="pale cyan: outer gas disk">淡青:外围气体盘</span>
    <span class="chip.v" data-zh="紫晕:暗物质(推断)" data-en="purple halo: dark matter (inferred)">紫晕:暗物质(推断)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnM33" data-zh="叠加 M33 实测点" data-en="Overlay M33 data">叠加 M33 实测点</button>
    <button class="abtn" id="btnOuter" data-zh="只看外圈恒星" data-en="Outer stars closeup">只看外圈恒星</button>
  </div>
  <div class="row"><label data-zh="暗物质比例" data-en="Dark fraction">暗物质比例</label><input id="sDM" type="range" min="0" max="90" step="1" value="85"><span class="val" id="sDMVal">85%</span></div>
  <div class="row"><label data-zh="时间加速" data-en="Time speed">时间加速</label><input id="sSpd" type="range" min="0.25" max="3" step="0.25" value="1"><span class="val" id="sSpdVal">×1.00</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglHalo" type="checkbox" checked> <span data-zh="暗物质晕" data-en="Dark halo">暗物质晕</span></label>
      <label><input id="tglPlot" type="checkbox" checked> <span data-zh="旋转曲线" data-en="Curve">旋转曲线</span></label>
      <label><input id="tglTrails" type="checkbox" checked> <span data-zh="恒星拖尾" data-en="Star trails">恒星拖尾</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../orbital-mechanics/" data-zh="轨道力学:开普勒的原版" data-en="orbital mechanics: Kepler's original">轨道力学:开普勒的原版</a>
    <a href="../spacetime-curvature/" data-zh="时空弯曲:质量怎么弯时空" data-en="spacetime curvature: how mass bends spacetime">时空弯曲:质量怎么弯时空</a>
    <a href="../gravitational-lensing/" data-zh="引力透镜:用引力称质量" data-en="gravitational lensing: weighing with gravity">引力透镜:用引力称质量</a>
    <a href="../cosmic-expansion/" data-zh="宇宙膨胀:另一个大谜" data-en="cosmic expansion: the other big puzzle">宇宙膨胀:另一个大谜</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0c13, 16, 46);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0a0c13 : 0xdde5ef);
  scene.fog.color = new THREE.Color(dark ? 0x0a0c13 : 0xdde5ef);
  starMat.color.setHex(dark ? 0xffffff : 0x54607a);
  gasMat.color.setHex(dark ? 0xffffff : 0x54607a);
  bulgeMat.color.setHex(dark ? 0xffffff : 0x6a6478);
  for (const t of tracers) t.line.material.color.setHex(dark ? 0xffffff : 0x5a6072);
  haloMat.opacity = (dark ? 0.09 : 0.16) * (0.3 + 0.7 * dmFrac / 0.9);
  haloMat2.opacity = haloMat.opacity * 0.6;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('星系旋转曲线 · 90% 看不见的质量', 'Galaxy Rotation Curves · 90% Unseen');
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 160);
camera.position.set(0, 10.8, 6.4);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 46;
controls.autoRotateSpeed = 0.25;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x14161f, 0.5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 0.8);
key.position.set(6, 12, 7);
scene.add(key);
const fillL = new THREE.DirectionalLight(0xbcd0ff, 0.25);
fillL.position.set(-8, 6, -6);
scene.add(fillL);

/* ================= 引力模型(真实单位) ================= */
const G_K = 4.302e-6;          // G: kpc·(km/s)²/M☉
const RD = 3, RS = 15;         // 盘标长 / 晕标长 kpc
const M_VIS = 5e10;            // 可见盘+气体总质量 M☉
const SC = 0.30;               // 场景单位/kpc
let dmFrac = 0.85, Mh = 0, spdMul = 1;
const mVis = r => { const x = r / RD; return M_VIS * (1 - Math.exp(-x) * (1 + x)); };
const mHalo = r => Mh * r * r / (r * r + RS * RS);
const vKep = r => Math.sqrt(G_K * mVis(Math.max(r, 0.4)) / Math.max(r, 0.4));
const vModel = r => Math.sqrt(G_K * (mVis(r) + mHalo(r)) / Math.max(r, 0.4));
const NV = 56, vTab = new Float32Array(NV);
function buildV() { for (let i = 0; i < NV; i++) vTab[i] = vModel(0.5 + i * 0.5); }
function vAt(r) {
  const x = clamp((r - 0.5) * 2, 0, NV - 1.001);
  const i = Math.min(NV - 2, x | 0), f = x - i;
  return vTab[i] * (1 - f) + vTab[i + 1] * f;
}
const OM0 = 1.26; // rad/s @ r=8 kpc(1 圈≈5 s)
const omegaAt = r => { const rr = Math.max(r, 0.6); return OM0 * (vAt(rr) / vAt(8)) * (8 / rr); };

/* ---------------- 状态 ---------------- */
let haloOn = true, trailsOn = true, chartOn = true, m33On = false;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;

/* ---------------- 材质 / 星系搭建 ---------------- */
const starMat = new THREE.PointsMaterial({ size: 0.055, vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false });
const gasMat = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, transparent: true, opacity: 0.7, depthWrite: false });
const bulgeMat = new THREE.PointsMaterial({ size: 0.045, vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false });
const haloMat = new THREE.MeshBasicMaterial({ color: 0x8c5bff, transparent: true, opacity: 0.09, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const haloMat2 = new THREE.MeshBasicMaterial({ color: 0x5b3fd1, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
function sampleR() {
  const u = Math.random();
  return clamp(-RD * Math.log(1 - u * (1 - Math.exp(-25 / RD))), 1.2, 25);
}
/* 盘 + 气体粒子(Points + BufferGeometry + vertexColors) */
const N_ARM = 2000, N_GAS = 650, N_TOT = N_ARM + N_GAS;
const sR = new Float32Array(N_TOT), sPhi = new Float32Array(N_TOT), sY = new Float32Array(N_TOT);
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(N_TOT * 3), sCol = new Float32Array(N_TOT * 3);
for (let i = 0; i < N_TOT; i++) {
  const gas = i >= N_ARM;
  let r, th;
  if (!gas) {
    r = sampleR();
    const arm = i % 2, inArm = Math.random() < 0.72;
    th = inArm ? arm * Math.PI + r * 0.42 + gauss() * 0.42 * (0.5 + r / 20) : Math.random() * Math.PI * 2;
    sY[i] = gauss() * 0.05 * (0.5 + r / 18);
    const b = 0.45 + 0.55 * Math.random(), warm = Math.random() < 0.18;
    const cr = warm ? 1.0 : 0.72 + 0.2 * Math.random(), cg = warm ? 0.8 : 0.8 + 0.12 * Math.random(), cb = 1.0;
    sCol[i * 3] = cr * b; sCol[i * 3 + 1] = cg * b; sCol[i * 3 + 2] = cb * b;
  } else {
    r = 6 + 19 * Math.pow(Math.random(), 0.85);
    th = Math.random() * Math.PI * 2;
    sY[i] = gauss() * 0.03;
    const b = 0.3 + 0.4 * Math.random();
    sCol[i * 3] = 0.5 * b; sCol[i * 3 + 1] = 0.85 * b; sCol[i * 3 + 2] = 0.95 * b;
  }
  sR[i] = r; sPhi[i] = th;
}
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
const stars = new THREE.Points(sGeo, starMat);
stars.frustumCulled = false;

/* 核球粒子 + 发光核 */

  bPos[i * 3] = rad * s * Math.cos(ph); bPos[i * 3 + 1] = rad * u * 0.75; bPos[i * 3 + 2] = rad * s * Math.sin(ph);
  const b = 0.55 + 0.45 * Math.random();
  bCol[i * 3] = 1.0 * b; bCol[i * 3 + 1] = 0.85 * b; bCol[i * 3 + 2] = 0.55 * b;
}

/* 拖尾示踪星(差速旋转可视化) */
const TR_R = [4, 7, 10, 13, 16, 19, 22], SEG = 22, TRAIL_T = 2.6;
const trailG = new THREE.Group();
scene.add(trailG);
const tracers = [];
for (const r of TR_R) for (let k = 0; k < 2; k++) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array((SEG + 1) * 3), col = new Float32Array((SEG + 1) * 3);
  for (let j = 0; j <= SEG; j++) {
    const f = 1 - j / SEG;
    col[j * 3] = 0.66 * f + 0.05; col[j * 3 + 1] = 0.55 * f + 0.05; col[j * 3 + 2] = 0.98 * f + 0.12;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.8 }));
  trailG.add(line);
  tracers.push({ r, phi: Math.random() * Math.PI * 2, geo, pos, line });
}

function setDM(f) {
  dmFrac = clamp(f, 0, 0.9);
  Mh = dmFrac / (1 - dmFrac + 1e-9) * M_VIS;
  buildV();
  haloG.visible = haloOn && dmFrac > 0.02 && webglOK;
  applyTheme();
}

function stepGal(dt) {
  for (let i = 0; i < N_TOT; i++) {
    sPhi[i] += omegaAt(sR[i]) * dt;
    const rr = sR[i] * SC;
    sPos[i * 3] = Math.cos(sPhi[i]) * rr; sPos[i * 3 + 1] = sY[i]; sPos[i * 3 + 2] = Math.sin(sPhi[i]) * rr;
  }
  sGeo.attributes.position.needsUpdate = true;
  if (dt > 0) bulge.rotation.y += omegaAt(1.2) * dt;
  sunMarkAng += omegaAt(8) * dt;
  sunMark.position.set(Math.cos(sunMarkAng) * 8 * SC, 0.03, Math.sin(sunMarkAng) * 8 * SC);
  for (const t of tracers) {
    t.phi += omegaAt(t.r) * dt;
    const span = omegaAt(t.r) * TRAIL_T, rr = t.r * SC;
    for (let j = 0; j <= SEG; j++) {
      const a = t.phi - span * (j / SEG);
      t.pos[j * 3] = Math.cos(a) * rr; t.pos[j * 3 + 1] = 0.01; t.pos[j * 3 + 2] = Math.sin(a) * rr;
    }
    t.geo.attributes.position.needsUpdate = true;
  }
}

/* ================= 绘图:旋转曲线 ================= */
const plotCv = document.getElementById('plotCv');
const M33 = [[0.6, 70], [1, 85], [1.5, 95], [2, 100], [3, 104], [4, 106], [5, 108], [6, 109], [8, 111], [10, 112], [12, 113], [14, 113.5], [16, 114], [18, 114.5], [20, 115], [22, 115]];
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const CW = plotCv.width = plotCv.clientWidth * 2;
  const CH = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, CW, CH);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const acc = css.getPropertyValue('--acc').trim() || '#b197fc';
  const padL = 40, padR = 12, padT = 26, padB = 22;
  const X = r => padL + r / 25 * (CW - padL - padR);
  const Y = v => (CH - padB) - clamp(v, 0, 300) / 300 * (CH - padT - padB);
  ctx.font = '12px system-ui';
  ctx.strokeStyle = 'rgba(150,160,180,.3)';
  ctx.setLineDash([2, 5]);
  ctx.beginPath(); ctx.moveTo(padL, Y(220)); ctx.lineTo(CW - padR, Y(220)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = cTxt;
  ctx.fillText('220', 6, Y(220) + 4);
  ctx.fillText('300', 6, Y(300) + 4);
  ctx.fillText('0', padL - 10, CH - padB + 14);
  ctx.fillText('r/kpc', CW - padR - 42, CH - 6);
  ctx.strokeStyle = 'rgba(150,160,175,.65)';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  for (let k = 0; k <= 60; k++) {
    const r = 0.8 + k / 60 * 24.2;
    k === 0 ? ctx.moveTo(X(r), Y(vKep(r))) : ctx.lineTo(X(r), Y(vKep(r)));
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = acc;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let k = 0; k <= 60; k++) {
    const r = 0.8 + k / 60 * 24.2;
    k === 0 ? ctx.moveTo(X(r), Y(vAt(r))) : ctx.lineTo(X(r), Y(vAt(r)));
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(180,160,255,.22)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(15), padT - 8); ctx.lineTo(X(15), CH - padB); ctx.stroke();
  ctx.fillStyle = acc;
  ctx.beginPath(); ctx.arc(X(15), Y(vAt(15)), 4, 0, 7); ctx.fill();
  if (m33On) {
    ctx.fillStyle = '#4dd8e6';
    for (const p of M33) { ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 3.4, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(150,160,175,.8)';
  ctx.fillText(L('开普勒预期', 'Kepler expect.'), padL + 6, padT - 8);
  ctx.fillStyle = acc;
  ctx.fillText(L('当前模型', 'current model'), padL + 96, padT - 8);
  if (m33On) {
    ctx.fillStyle = '#4dd8e6';
    ctx.fillText(L('M33 实测', 'M33 data'), padL + 180, padT - 8);
  }
}

  stOm.textContent = ratio.toFixed(2);
  stOm.className = 'v ' + (dmFrac > 0.6 ? 'ok' : 'warn');
}
function updateFormula() {
  const v15 = vAt(15), vk = vKep(15), ratio = omegaAt(22) / omegaAt(8);
  formulaEl.innerHTML = L(
    `<b>v² = G·M(r)/r</b>:取 r=15 kpc,当前 v = <b>${v15.toFixed(0)} km/s</b>(纯可见质量预期 ${vk.toFixed(0)} km/s)<br>` +
    `<b>开普勒预期:M(r)=M_vis(常数)⇒ v∝r^(−1/2)</b>,外缘必然下坠<br>` +
    `<b>平坦曲线 ⇒ M(r)∝r ⇒ ρ∝1/r²</b>(等温晕):M_h=${(Mh / 1e10).toFixed(0)}×10¹⁰ M☉,暗物质占比 ${Math.round(dmFrac * 100)}%<br>` +
    `<b>实测:银河系 v_flat≈220 km/s;M33(TRINGS HI)到 ~22 kpc 仍平坦</b><br>` +
    `<b>子弹星系团:透镜质量峰与 X 射线气体峰错位</b>——暗物质的第二重独立证据<br>` +
    `可见质量仅 ~15%(盘+气体);差速角速度比 ω(22)/ω(8)=${ratio.toFixed(2)}`,
    `<b>v² = G·M(r)/r</b>: at r=15 kpc the current v = <b>${v15.toFixed(0)} km/s</b> (visible-mass-only expectation ${vk.toFixed(0)} km/s)<br>` +
    `<b>Kepler expectation: M(r)=M_vis(const) ⇒ v∝r^(−1/2)</b> — the edge must fall<br>` +
    `<b>Flat curve ⇒ M(r)∝r ⇒ ρ∝1/r²</b> (isothermal halo): M_h=${(Mh / 1e10).toFixed(0)}×10¹⁰ M☉, dark fraction ${Math.round(dmFrac * 100)}%<br>` +
    `<b>Measured: Milky Way v_flat≈220 km/s; M33 (TRINGS HI) flat to ~22 kpc</b><br>` +
    `<b>Bullet Cluster: lensed mass peak offset from the X-ray gas peak</b> — a second independent proof<br>` +
    `Visible matter only ~15% (disk+gas); differential ratio ω(22)/ω(8)=${ratio.toFixed(2)}`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elDM.addEventListener('input', () => { setDM(+elDM.value / 100); syncSliders(); updateFormula(); updateStats(); drawPlot(); });
elSpd.addEventListener('input', () => { spdMul = +elSpd.value; syncSliders(); });
btnM33.addEventListener('click', () => { m33On = !m33On; syncBtns(); drawPlot(); });
btnOuter.addEventListener('click', () => {
  flyTo([9.5, 4.4, 6.2], [5.2, 0, 1.8]);
  notifyT = 4;
  notifyZ = '盯外圈:0% 拖尾滞后,85% 几乎同步';
  notifyE = 'Watch the edge: at 0% they trail, at 85% they keep pace';
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglHalo').addEventListener('change', e => { haloOn = e.target.checked; haloG.visible = haloOn && dmFrac > 0.02 && webglOK; });
document.getElementById('tglPlot').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglTrails').addEventListener('change', e => { trailsOn = e.target.checked; trailG.visible = trailsOn; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) stepGal(dt * spdMul);
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.12) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.15) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
setDM(0.85);
haloG.visible = haloOn && webglOK;
trailG.visible = trailsOn;
stepGal(0);
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
</html>
