<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>范德华力与分子间作用 · 微弱但数量取胜</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#38b2a3;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1f7f74;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(56,178,163,.6);background:rgba(56,178,163,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(31,127,116,.55);background:rgba(31,127,116,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}

    border:1px solid transparent;align-items:flex-start}

  #steps li.on{background:rgba(56,178,163,.10);border-color:rgba(56,178,163,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(31,127,116,.08);border-color:rgba(31,127,116,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#a8ede4}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="范德华力与分子间作用" data-en="Van der Waals Forces">范德华力与分子间作用</h1>
  <div class="sub" data-zh="电子云量子涨落→瞬时偶极→感应邻分子偶极:伦敦色散力 −C/r⁶→与泡利硬核排斥 1/r¹² 合成 Lennard-Jones 势阱,平衡位置 r₀=2^{1/6}σ 处最深(Ar 仅 ~1 kJ/mol,比共价键弱两个量级)→极性分子再叠加偶极-偶极(Keesom/Debye)→单点弱,数量大:壁虎靠亿万铲状绒毛凑出攀墙力,石墨层间靠它滑动剥离 · 拖动旋转 / 空格运行/暂停" data-en="Electron clouds fluctuate quantum-mechanically → instant dipoles induce partner dipoles: London dispersion −C/r⁶ → combined with Pauli hard-core repulsion 1/r¹² it forms the Lennard-Jones well, deepest at r₀=2^{1/6}σ (Ar ≈1 kJ/mol, two orders weaker than covalent) → polar molecules add dipole–dipole terms (Keesom/Debye) → weak per contact, huge in numbers: geckos climb on billions of spatula hairs, graphite slides because its layers hang on just this · drag to orbit / Space = run/pause">电子云量子涨落→瞬时偶极→感应邻分子偶极:伦敦色散力 −C/r⁶→与泡利硬核排斥 1/r¹² 合成 Lennard-Jones 势阱,平衡位置 r₀=2^{1/6}σ 处最深(Ar 仅 ~1 kJ/mol,比共价键弱两个量级)→极性分子再叠加偶极-偶极(Keesom/Debye)→单点弱,数量大:壁虎靠亿万铲状绒毛凑出攀墙力,石墨层间靠它滑动剥离 · 拖动旋转 / 空格运行/暂停</div>
</div>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="作用力" data-en="Force">作用力</span><span class="v" id="stF">—</span>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* Lennard-Jones:V(r)=4ε[(σ/r)¹²−(σ/r)⁶]。
   Ar 基准:σ=0.341 nm,ε/k_B=119.8 K→ε≈0.997 kJ/mol,r₀=2^{1/6}σ≈0.383 nm。
   极性叠加(近似的 Keesom+Debye):ε_eff=ε·(1+0.45μ²·300/T),σ_eff=σ(1+0.025μ)。
   力 F=−dV/dr;单位换算:1 (kJ/mol)/nm = 1.6605 pN/分子。
   壁虎:铲状绒毛单点 ~10–40 nN,有效接触 ~10⁸ → 合力数牛,能吊起体重。 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0e1216,10,36);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,200);
camera.position.set(3.2,1.9,7.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.2,0.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=20;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,8,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.35);fill.position.set(-6,4,-6);scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x14171d,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(13,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-2.3;scene.add(ground);

/* ── 模式一:分子对 ── */
const pairG=new THREE.Group();scene.add(pairG);
const coreM=new THREE.MeshStandardMaterial({color:0x9fb4c8,roughness:0.35,metalness:0.35});
const shellM1=new THREE.MeshStandardMaterial({color:0x6fd4c8,roughness:0.2,metalness:0.1,
  transparent:true,opacity:0.14,side:THREE.DoubleSide,depthWrite:false});
const shellM2=new THREE.MeshStandardMaterial({color:0x6fa8ff,roughness:0.2,metalness:0.1,
  transparent:true,opacity:0.08,side:THREE.DoubleSide,depthWrite:false});
function makeMolecule(){
  const g=new THREE.Group();
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.62,24,18),coreM);g.add(core);
  const s1=new THREE.Mesh(new THREE.SphereGeometry(0.92,24,18),shellM1);g.add(s1);
  const s2=new THREE.Mesh(new THREE.SphereGeometry(1.24,24,18),shellM2);g.add(s2);
  pairG.add(g);
  return {g,core,s1,s2};
}
const molA=makeMolecule(),molB=makeMolecule();
/* 偶极箭头:柱+锥,尾部 δ− 头部 δ+ */
function makeDipole(color){
  const g=new THREE.Group();
  const m=new THREE.MeshStandardMaterial({color,roughness:0.4,emissive:color,emissiveIntensity:0.5});
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.7,10),m);
  cyl.position.y=0.35;g.add(cyl);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.26,12),m);
  cone.position.y=0.83;g.add(cone);
  g.visible=false;pairG.add(g);
  return g;
}
const dipA=makeDipole(0xffa94d),dipB=makeDipole(0x74a8ff);
/* 分子对间力箭头 */
function makeForceArrow(){
  const g=new THREE.Group();
  const m=new THREE.MeshStandardMaterial({color:0x74dc84,roughness:0.4,emissive:0x74dc84,emissiveIntensity:0.5});
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1,10),m);
  cyl.position.y=0.5;g.add(cyl);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.11,0.24,12),m);
  cone.position.y=1.12;g.add(cone);
  scene.add(g);return g;
}
const fArr=makeForceArrow();

/* ── LJ 曲线面板 ── */
const panelZ=-2.4;
function ex(r){return 3.6-1.5+(r-0.25)/0.75*2.9;}
function ey(V){return 1.1-1.35+clamp((V+1.6)/4.6,0,1)*2.5;}
const axM=new THREE.LineBasicMaterial({color:0x5a6474,transparent:true,opacity:0.7});
{
  const ax=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(ex(0.25),ey(-1.6),panelZ),new THREE.Vector3(ex(0.25),ey(3.0),panelZ),
    new THREE.Vector3(ex(1.0),ey(-1.6),panelZ)]);
  scene.add(new THREE.Line(ax,axM));
  const e0=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(ex(0.25),ey(0),panelZ),new THREE.Vector3(ex(1.0),ey(0),panelZ)]);
  scene.add(new THREE.Line(e0,new THREE.LineBasicMaterial({color:0x5a6474,transparent:true,opacity:0.4})));
}
const curveG=new THREE.BufferGeometry();
curveG.setAttribute('position',new THREE.BufferAttribute(new Float32Array(110*3),3));
const curveLn=new THREE.Line(curveG,new THREE.LineBasicMaterial({color:0x8be0d6,transparent:true,opacity:0.95}));
curveLn.frustumCulled=false;scene.add(curveLn);
const mark=new THREE.Mesh(new THREE.SphereGeometry(0.06,12,10),new THREE.MeshBasicMaterial({color:0xffd27a}));
scene.add(mark);

/* ── 模式二:壁虎足垫 ── */
const geckoG=new THREE.Group();scene.add(geckoG);
const wall=new THREE.Mesh(new THREE.BoxGeometry(0.08,4.6,4.6),
  new THREE.MeshStandardMaterial({color:0x2a3138,roughness:0.8,metalness:0.2}));
wall.position.set(-1.9,0.4,0);geckoG.add(wall);
const padM=new THREE.MeshStandardMaterial({color:0x6f9e5a,roughness:0.6,metalness:0.1});
const pad=new THREE.Mesh(new THREE.BoxGeometry(0.24,1.5,1.5),padM);
geckoG.add(pad);

{

function buildLayer(){
  const g=new THREE.Group();
  const geo=new THREE.SphereGeometry(0.14,10,8);
  for(let j=0;j<4;j++){
    for(let i=0;i<6;i++){
      const cx=i*1.56,cz=j*1.35+(i%2?0.675:0);
      for(let v=0;v<6;v++){
        const a=v/6*Math.PI*2;
        const s=new THREE.Mesh(geo,layerM);
        s.position.set(cx+0.46*Math.cos(a),0,cz+0.46*Math.sin(a));
        g.add(s);
      }
    }
  }
  return g;
}

const SIG0=0.341,EP0=0.997,PN=1.6605;   /* kJ/mol/nm → pN */
function epsEff(){return EP0*(1+0.45*mu*mu*300/Temp);}
function sigEff(){return SIG0*(1+0.025*mu);}
function ljV(r){const s=sigEff()/r,s6=s**6;return 4*epsEff()*(s6*s6-s6);}
function ljF(r){ /* 返回 pN,负=吸引 */
  const s=sigEff(),x=s/r;
  const dv=4*epsEff()*(-12*Math.pow(x,12)/r+6*Math.pow(x,6)/r);   /* dV/dr (kJ/mol/nm) */
  return -dv*PN;
}

let activeStep=0;
function buildSteps(){

  STEPS.forEach((s,i)=>{

    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;

    el.appendChild(li);
  });

}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const rU=rNm*10;   /* 1 nm = 10 场景单位 */
  /* ── 瞬时偶极(涨落) ── */
  const flick=0.75+0.25*Math.sin(simT*6.3)+0.12*Math.sin(simT*17.1);
  const thA=1.1*Math.sin(simT*1.4)+0.5*Math.sin(simT*3.7+1.2);
  const muI=(mu>0?mu*0.9:0.18)*flick;
  stat.muI=muI;
  /* ── 分子对模式 ── */
  if(mode==='pair'){
    molA.g.position.set(-rU/2,0.6,0);
    molB.g.position.set(rU/2,0.6,0);
    const wob=1+0.05*Math.sin(simT*9+1)+0.04*Math.sin(simT*13.7);
    for(const mol of [molA,molB]){
      mol.s1.scale.setScalar(1+0.04*Math.sin(simT*7+(mol===molA?0:2)));
      mol.s2.scale.setScalar(wob);
    }
    /* 偶极箭头:瞬时偶极 → 感应偶极(同向) */
    dipA.visible=dipB.visible=true;
    const len=0.5+0.55*clamp(muI/2,0,1);
    dipA.scale.set(1,len,1);
    dipA.position.set(-rU/2,0.6,0.95);
    dipA.rotation.z=-thA;
    dipB.scale.set(1,len*0.62,1);
    dipB.position.set(rU/2,0.6,0.95);
    dipB.rotation.z=-thA;
    /* 分子间力箭头(沿轴线) */
    const F=ljF(rNm);
    fArr.visible=Math.abs(F)>0.02;
    if(fArr.visible){
      const attract=F<0;
      fArr.position.set(0,0.6,0.55);
      fArr.scale.set(1,clamp(Math.abs(F)*0.35,0.12,1.4),1);
      fArr.rotation.z=attract?Math.PI/2:-Math.PI/2;
      fArr.children.forEach(c=>{
        c.material.color.setHex(attract?0x74dc84:0xff7a7a);
        c.material.emissive.setHex(attract?0x74dc84:0xff7a7a);
      });
    }
    /* 曲线与工作点 */
    curveLn.visible=curveOn;mark.visible=curveOn;
    if(curveOn){
      const V=ljV(rNm);
      mark.position.set(ex(rNm),ey(V),panelZ+0.02);
    }
  }else{
    curveLn.visible=false;mark.visible=false;
    dipA.visible=dipB.visible=false;fArr.visible=false;
  }
  /* ── 壁虎模式 ── */
  if(mode==='gecko'){
    const gap=clamp((rNm-0.28)*1.6+0.06,0.05,1.1);
    pad.position.set(-1.9+0.04+gap+0.12,0.4,0);
    const f=40*Math.exp(-Math.pow((rNm-0.42)/0.13,2));   /* nN/点 */
    const engage=clamp(f/40,0,1);
    const pts=geckoG.userData.points;
    const col=pts.geometry.attributes.color.array;
    const cOn=geckoG.userData.cOn,cOff=geckoG.userData.cOff,th=geckoG.userData.th;
    const n=col.length/3;
    for(let i=0;i<n;i++){
      const c=th[i]<engage?cOn:cOff;
      col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    }
    pts.geometry.attributes.color.needsUpdate=true;
    const N=1.0e8*f*1e-9;
    adhArr.position.set(pad.position.x-0.25,0.4,0);
    adhArr.rotation.set(0,0,Math.PI/2);   /* 指向墙面:粘附把足垫往墙上拉 */
    adhArr.scale.set(1,clamp(N*0.4,0.1,1.6),1);
    adhArr.children.forEach(c=>{c.material.color.setHex(0x8bff9e);c.material.emissive.setHex(0x8bff9e);});
    gravArr.position.set(pad.position.x+0.35,1.2,0);
    gravArr.rotation.set(0,0,Math.PI);    /* 竖直向下 */
    gravArr.scale.set(1,0.7,1);
    gravArr.children.forEach(c=>{c.material.color.setHex(0x74a8ff);c.material.emissive.setHex(0x74a8ff);});
  }
  /* ── 石墨模式 ── */
  if(mode==='graph'){
    layTop.position.x=0.9*Math.sin(simT*0.9);
    graphG.position.y=-0.4;
  }
  /* ── 读数节流 ── */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

else{applyPhase(0);}

updateStats();syncPlayBtn();start();

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
