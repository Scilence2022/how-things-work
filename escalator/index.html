<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>自动扶梯 · 一条会走路的楼梯</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#4dabf7;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1971c2;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="自动扶梯 · 一条会走路的楼梯" data-en="Escalator · a staircase that walks">自动扶梯 · 一条会走路的楼梯</h1>
  <div class="sub" data-zh="几十级梯级首尾相接绕成一个闭合环：上段踏板翻平载客，两端转向轮处踏板翻立收进桁架底下空跑回来；驱动链拖动梯级链、扶手带同速跟上——快一点都不行，否则扶手"吃"乘客；倾斜 30°，一台 1 m/s 的扶梯一小时能送近万人 · 拖动旋转 / 空格运行/暂停" data-en="Dozens of steps close into a loop: flats carry riders on the upper run, then fold upright at the landings and ride back inside the truss; the drive chain pulls the step chain while the handrail tracks at exactly the same speed — even a small mismatch makes the rail "eat" passengers; at 30° and 1 m/s one escalator moves nearly 10,000 people an hour · drag to orbit / Space = run/pause">几十级梯级首尾相接绕成一个闭合环：上段踏板翻平载客，两端转向轮处踏板翻立收进桁架底下空跑回来；驱动链拖动梯级链、扶手带同速跟上——快一点都不行，否则扶手"吃"乘客；倾斜 30°，一台 1 m/s 的扶梯一小时能送近万人 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="带速" data-en="Belt speed">带速</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="梯级数" data-en="Visible steps">梯级数</span><span class="v" id="stN">—</span>
  <span class="k" data-zh="运送能力" data-en="Capacity">运送能力</span><span class="v" id="stCap">—</span>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>

    <label data-zh="带速 m/s" data-en="Speed m/s">带速 m/s</label>

    <label data-zh="乘客密度" data-en="Riders">乘客密度</label>

  <ol id="steps"></ol>

    <button id="play" data-zh="运行" data-en="Run">运行</button>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglTruss" type="checkbox" checked> <span data-zh="桁架剖面" data-en="Truss cutaway">桁架剖面</span></label>
      <label><input id="tglRiders" type="checkbox" checked> <span data-zh="乘客" data-en="Riders">乘客</span></label>

    <a href="../elevator/" data-zh="电梯与配重" data-en="Elevator">电梯</a>

    <a href="../belt-drive/" data-zh="带传动" data-en="Belt drive">带传动</a>
    <a href="../worm-drive/" data-zh="蜗杆自锁" data-en="Worm drive">蜗杆</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-3.2,5.6,17.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(6.2,2.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=80;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 页面场景 ---- */
/* 桁架（半透明剖开） */
const ANG=30*Math.PI/180;
const ESC_L=13,H=5.4;
const trussM=new THREE.MeshStandardMaterial({color:0x868e96,transparent:true,opacity:0.16,roughness:0.6,side:THREE.DoubleSide});
function trussSide(z){
  const sh=new THREE.Shape();
  sh.moveTo(0,0);sh.lineTo(ESC_L,H-ESC_L*Math.tan(ANG));sh.lineTo(ESC_L,H-ESC_L*Math.tan(ANG)-1.1);
  sh.lineTo(ESC_L-2.4,H-ESC_L*Math.tan(ANG)-1.1);sh.lineTo(ESC_L-2.4,H-ESC_L*Math.tan(ANG)-2.6);
  sh.lineTo(0,-1.1);sh.closePath();
  const g=new THREE.ExtrudeGeometry(sh,{depth:0.18,bevelEnabled:false});
  g.translate(0,0,z);
  return new THREE.Mesh(g,trussM);
}
const trussL=trussSide(-1.6),trussR=trussSide(1.42);
scene.add(trussL,trussR);
/* 梯级：每级 = 踏板+踢面+两侧轮 */
const stepFlat=new THREE.MeshStandardMaterial({color:0xc0c6cc,metalness:0.7,roughness:0.4});
const stepRise=new THREE.MeshStandardMaterial({color:0x9aa2ab,metalness:0.6,roughness:0.5});
const wheelM=new THREE.MeshStandardMaterial({color:0x2b2f33,roughness:0.7});
const NS=22,STEP_L=0.86,STEP_H=0.42;
const steps=[];
for(let i=0;i<NS;i++){
  const g=new THREE.Group();
  const tread=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.07,STEP_L),stepFlat);
  g.add(tread);
  const riser=new THREE.Mesh(new THREE.BoxGeometry(1.9,STEP_H,0.06),stepRise);
  riser.position.set(0,-STEP_H/2,-STEP_L/2+0.03);g.add(riser);
  for(const zz of[-0.8,0.8]){
    const w=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.1,10),wheelM);
    w.rotation.x=Math.PI/2;w.position.set(0,0,zz);g.add(w);
  }
  scene.add(g);steps.push(g);
}
/* 扶手带（上下两条环形带，用 Tube 闭环近似） */
const railM=new THREE.MeshStandardMaterial({color:0x1a1d20,roughness:0.35});
function railLoop(z,phase){
  const pts=[];
  const sL=1.35,sH=1.35;
  for(let i=0;i<=40;i++){
    const t=i/40;
    const x=t*ESC_L,zeta=Math.sin(t*Math.PI)*0+phase;
    const y=t*ESC_L*Math.tan(ANG)+sH*(1.0-0)*(t<0.06||t>0.94?1:1);
    pts.push(new THREE.Vector3(x,y,z));
  }
  const c=new THREE.CatmullRomCurve3(pts,false);
  const loop=new THREE.Mesh(new THREE.TubeGeometry(c,60,0.09,8),railM);
  scene.add(loop);return loop;
}
const railA=railLoop(-1.32,0),railB=railLoop(1.32,0);
/* 驱动端齿轮与链轮（上平台） */
const gearM=new THREE.MeshStandardMaterial({color:0xffd43b,metalness:0.6,roughness:0.35});
const driveGear=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.22,14),gearM);
driveGear.rotation.x=Math.PI/2;
const driveG=new THREE.Group();driveG.position.set(ESC_L-1.1,H-ESC_L*Math.tan(ANG)-0.4,0);driveG.add(driveGear);
scene.add(driveG);
const motor=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.6,0.8),
  new THREE.MeshStandardMaterial({color:0xc92a2a,roughness:0.5}));
motor.position.set(ESC_L-2.6,H-ESC_L*Math.tan(ANG)-0.75,0);scene.add(motor);
/* 回程链（梯级链示意：上下链条线） */
const chainM=new THREE.LineDashedMaterial({color:0xffd43b,dashSize:0.16,gapSize:0.1});
function chainLine(pts){
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const ln=new THREE.Line(geo,chainM);ln.computeLineDistances();scene.add(ln);return ln;
}
/* 乘客 */
const RN=12;
const riderG=new THREE.Group();scene.add(riderG);
const riders=[];
const bodyMats=[0xff8fab,0x74c0fc,0xb2f2bb,0xffd8a8,0xd0bfff].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:0.6}));
for(let i=0;i<RN;i++){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,0.42,4,10),bodyMats[i%5]);
  body.position.y=0.5;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,8),bodyMats[(i+2)%5]);
  head.position.y=0.95;g.add(head);
  g.visible=false;riderG.add(g);riders.push(g);
}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('驱动链轮+电机：整条环的唯一动力','Drive sprocket + motor: the loop\u2019s only muscle'),new THREE.Vector3(9.6,H-ESC_L*Math.tan(ANG)+1.6,0),'r');
addLabel(()=>L('梯级在两端翻立，钻进桁架底下空跑回来','Steps fold upright and ride back inside the truss'),new THREE.Vector3(1.2,H+1.4,0),'y',
  ()=>tglTrussEl.checked);
addLabel(()=>L('扶手带与梯级同速：差一点就"吃"人','Handrail matches the steps: any slip "eats" riders'),new THREE.Vector3(7.4,H-3.4,1.9),'o',
  ()=>Math.abs(slipPct)>0.5);
addLabel(()=>L('30° 倾角：楼梯与传送带的折中','30°: the compromise between stairs and conveyor'),new THREE.Vector3(5.2,1.6,-1.9),'b');

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0;
let v=0.6,slipPct=0,density=6;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
function setV(x){v=x;document.getElementById('sV').value=x;
  document.getElementById('sVVal').textContent=x.toFixed(2)+' m/s';}
function setSlip(s){slipPct=s;document.getElementById('sSlip').value=s;
  document.getElementById('sSlipVal').textContent=s.toFixed(1)+'%';}
function setDen(d){density=d;document.getElementById('sDen').value=d;
  document.getElementById('sDenVal').textContent=d.toFixed(0);}
/* 梯级参数化位置：u∈[0,1) 沿闭合环 */
function stepPos(u){
  const runL=ESC_L-2.6;
  const upper=runL, turnA=1.1, back=runL, turnB=1.1;
  const T=upper+turnA+back+turnB;
  let s=u*T;
  const yTop=ESC_L*Math.tan(ANG);
  if(s<upper){                     // 上行段
    const x=s;
    return new THREE.Vector3(x+1.3, yTop-x*Math.tan(ANG)+0.25, 0);
  }
  s-=upper;
  if(s<turnA){                     // 上端转向：翻立上收
    const k=s/turnA*Math.PI/2;
    const g=new THREE.Group();
    return new THREE.Vector3(ESC_L-1.3+Math.sin(k)*0.4, yTop+0.25+Math.sin(k)*0.9, 0).setY(yTop+0.25+k*0.5);
  }
  s-=turnA;
  if(s<back){                      // 回程段
    const x=ESC_L-1.3-s;
    return new THREE.Vector3(x, yTop-(x)*Math.tan(ANG)-1.5+0.1, 0);
  }
  s-=back;
  const k=s/turnB*Math.PI/2;       // 下端转向
  return new THREE.Vector3(1.3-Math.sin(k)*0.3, 0.25-k*0.2, 0);
}
function stepRot(u){
  const runL=ESC_L-2.6,T=runL+1.1+runL+1.1;let s=u*T;
  const rot=new THREE.Euler();
  if(s<runL){rot.set(0,0,ANG);return rot;}
  s-=runL;
  if(s<1.1){const k=s/1.1*Math.PI/2;rot.set(0,0,ANG+k);return rot;}
  s-=1.1;
  if(s<runL){rot.set(0,0,ANG+Math.PI/2);return rot;}
  s-=runL;
  const k=s/1.1*Math.PI/2;rot.set(0,0,ANG+Math.PI/2-k);return rot;
}
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'梯级 = 平台+踢面+四只轮，首尾铰接成闭合链环',en:'A step = tread + riser + four wheels, hinged into a closed chain'},
 {zh:'上段踏板翻平载客：一条会走路的楼梯',en:'On the upper run treads flatten and carry: a staircase that walks'},
 {zh:'两端转向：踏板翻立，钻进桁架底下空跑回来',en:'At the landings treads fold upright and ride back inside the truss'},
 {zh:'电机拖动链轮，链条拽着整队梯级走',en:'The motor turns the sprocket; the chain drags the whole step train'},
 {zh:'扶手带必须与梯级同速：滑差一点点都会把人往前推',en:'Handrail must match exactly: any slip shoves riders forward'},
 {zh:'0.5–1 m/s、30°：一台梯一小时送近万人',en:'0.5–1 m/s at 30°: nearly 10,000 riders an hour per escalator'}
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
activeStep=i;
  if(i===0){setV(0.35);}
  else if(i===1){setV(0.6);}
  else if(i===2){setV(0.6);}
  else if(i===3){setV(0.9);}
  else if(i===4){setSlip(4);setV(0.8);}
  else {setSlip(0);setV(1.0);}
 syncSteps();
}

/* ---- 读数 ---- */
function updateStats(){
document.getElementById('stV').innerHTML=v.toFixed(2)+'<small> m/s</small>';
  document.getElementById('stN').textContent=NS;
  document.getElementById('stCap').innerHTML=(v*3600*80/0.9/1000).toFixed(1)+'<small> k 人/h</small>';
  const se=document.getElementById('stSlip');
  se.innerHTML=(slipPct*v/100*100).toFixed(1)+'<small> cm/s</small>';
  se.className='v'+(Math.abs(slipPct)>1?' warn':' ok');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  if(typeof groundM!=='undefined')groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
/* 梯级循环 */
  const u0=(simT*v*0.42)%1;
  for(let i=0;i<NS;i++){
    const u=((i/NS)+u0)%1;
    const p=stepPos(u),rot=stepRot(u);
    steps[i].position.copy(p);
    steps[i].rotation.copy(rot);
    /* 回程段隐藏一半视觉杂乱 */
    steps[i].visible=true;
  }
  driveGear.rotation.z-=dt*v*2.2*(playing?1:0);
  /* 乘客：站在上段梯级上 */
  const T=1;
  let k=0;
  if(tglRidersEl.checked){
    for(let i=0;i<NS&&k<riders.length;i++){
      const u=((i/NS)+u0)%1;
      const runFrac=u*(NS*0.86);
      if(u<0.55&&Math.random()*10<density*0.35&&k<riders.length){
        const p=stepPos(u);
        riders[k].visible=true;
        riders[k].position.set(p.x,p.y+0.1,p.z+((k%3)-1)*0.5);
        riders[k].rotation.z=ANG;
        k++;
      }
    }
  }
  for(;k<riders.length;k++)riders[k].visible=false;
  /* 扶手速度差可视化：railB 相位漂移 */
  if(Math.abs(slipPct)>0.2){
    railA.position.z=-1.32+Math.sin(simT*2)*0.0;
    railB.position.z=1.32+Math.sin(simT*3+1)*slipPct*0.01*3;
  }else{railA.position.z=-1.32;railB.position.z=1.32;}
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const tglTrussEl=document.getElementById('tglTruss');
const tglRidersEl=document.getElementById('tglRiders');
document.getElementById('sV').addEventListener('input',e=>setV(+e.target.value));
document.getElementById('sSlip').addEventListener('input',e=>setSlip(+e.target.value));
document.getElementById('sDen').addEventListener('input',e=>setDen(+e.target.value));
document.getElementById('tglTruss').addEventListener('change',e=>{trussL.visible=trussR.visible=e.target.checked;});
document.getElementById('tglRiders').addEventListener('change',()=>{});
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setV(0.6);setSlip(0);setDen(6);
syncSteps();updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
