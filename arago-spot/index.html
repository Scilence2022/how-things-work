<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泊松亮斑 · 阴影正中央,反而最亮</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#c9a227;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#8f7413;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(201,162,39,.9); color: #f5e6b0; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(143,116,19,.9); color: #8f7413; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #e8c547; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.g { color: #f5e6b0; border-color: rgba(201,162,39,.7); }
  .chip.b { color: #c3ddf5; border-color: rgba(116,192,252,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(201,162,39,.65); background: rgba(201,162,39,.14); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(143,116,19,.55); background: rgba(143,116,19,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 4px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(201,162,39,.10); border-color: rgba(201,162,39,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(143,116,19,.08); border-color: rgba(143,116,19,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #f5e6b0; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="泊松亮斑:阴影正中央,反而最亮" data-en="Arago Spot: the brightest point is at the shadow's heart">泊松亮斑:阴影正中央,反而最亮</h1>
  <div class="sub" data-zh="盘缘各点到轴上等光程 → 同相叠加:圆盘影子正中必有亮斑;菲涅尔数 F = a²/(λz) ≈ 1 时最醒目,盘挡住前 k 个半波带,轴上振幅 ≈ 第 k+1 带的一半 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Every rim point is equidistant from the axis → in-phase sum: a bright spot must sit at the shadow's center; it peaks near F = a²/(λz) ≈ 1, with on-axis amplitude ≈ half of the first unblocked half-period zone · 3D demo · drag to orbit / scroll to zoom · Space = play/pause">盘缘各点到轴上等光程 → 同相叠加:圆盘影子正中必有亮斑;菲涅尔数 F = a²/(λz) ≈ 1 时最醒目,盘挡住前 k 个半波带,轴上振幅 ≈ 第 k+1 带的一半 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="菲涅尔数 F" data-en="Fresnel number F">菲涅尔数 F</span><span class="v g" id="stF">—</span>
  <span class="k" data-zh="被挡半波带 k" data-en="blocked zones k">被挡半波带 k</span><span class="v" id="stK">—</span>
  <span class="k" data-zh="屏中心强度" data-en="center intensity">屏中心强度</span><span class="v" id="stI">—</span>
  <span class="k" data-zh="亮斑半径" data-en="spot radius">亮斑半径</span><span class="v" id="stSpot">—</span>
  <span class="k" data-zh="已落光子" data-en="photons landed">已落光子</span><span class="v" id="stN">0</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip g" data-zh="金点 = 泊松亮斑 / 盘缘波源" data-en="gold dot = Arago spot / rim source">金点 = 泊松亮斑 / 盘缘波源</span>
    <span class="chip b" data-zh="蓝环 = 半波带(交替相位)" data-en="blue ring = half-period zone (alternating phase)">蓝环 = 半波带(交替相位)</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnDisc" data-zh="圆盘 → 泊松亮斑" data-en="disc → Arago spot">圆盘 → 泊松亮斑</button>
    <button class="abtn" id="btnAper" data-zh="对照:圆孔" data-en="contrast: aperture">对照:圆孔</button>
    <button class="abtn" id="btnPhoton" data-zh="逐光子累积" data-en="one photon at a time">逐光子累积</button>
    <button class="abtn" id="btnClear" data-zh="清屏重攒" data-en="clear screen">清屏重攒</button>
  </div>
  <div class="row"><label data-zh="盘半径 a" data-en="disc radius a">盘半径 a</label><input id="a" type="range" min="5" max="30" step="1" value="15"><span class="val" id="aVal">1.5 mm</span></div>
  <div class="row"><label data-zh="屏距 z" data-en="screen distance z">屏距 z</label><input id="z" type="range" min="5" max="40" step="1" value="20"><span class="val" id="zVal">2.0 m</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" style="grid-row:1/4">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="波场相位" data-en="wave phase">波场相位</label><input id="phase" type="range" min="0" max="1000" step="5" value="0"><span class="val" id="phaseVal">0%</span></div>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglWave" type="checkbox" checked> <span data-zh="波场" data-en="wave field">波场</span></label>
      <label><input id="tglZones" type="checkbox"> <span data-zh="半波带" data-en="half-period zones">半波带</span></label>
      <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../double-slit/" data-zh="双缝:光程差的另一场戏" data-en="double slit: another path-difference show">双缝:光程差的另一场戏</a>
    <a href="../diffraction-grating/" data-zh="光栅:把衍射排成阵列" data-en="grating: diffraction in array">光栅:把衍射排成阵列</a>
    <a href="../abbe-limit/" data-zh="阿贝极限:衍射定分辨率" data-en="Abbe limit: diffraction sets resolution">阿贝极限:衍射定分辨率</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.wall.color.set(THEME === 'light' ? 0x8a93a3 : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('泊松亮斑 · 阴影正中最亮', 'Arago Spot · bright heart of the shadow');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(-1.2, 2.7, 9.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2.8, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 26;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  wall: mat(0x39424f, { roughness: 0.7 }),
  frame: mat(0x1b212c, { roughness: 0.7 }),
  laser: mat(0x2f9e44, { roughness: 0.4 }),
  disc: mat(0x21262e, { roughness: 0.35, metalness: 0.5 }),
  rim: mat(0xc9a227, { emissiveIntensity: 0.7, roughness: 0.3, metalness: 0.4 }),
  screen: mat(0x0e1420, { roughness: 0.4 }),
  band: new THREE.MeshBasicMaterial({ color: 0xe8c547, transparent: true, opacity: 0.9, depthWrite: false }),
  wave: new THREE.MeshBasicMaterial({ color: 0xe8c547, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
  glow: new THREE.MeshBasicMaterial({ color: 0xffd43b, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, depthWrite: false }),
  zoneA: new THREE.MeshBasicMaterial({ color: 0xc9a227, transparent: true, opacity: 0.2,
    side: THREE.DoubleSide, depthWrite: false }),
  zoneB: new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.18,
    side: THREE.DoubleSide, depthWrite: false }),
};

/* ================= 布局:x 向右=传播;激光 x=-1.6;盘 x=1.4;屏随 z 滑块移动 ================= */
const X_SRC = -1.6, X_DISC = 1.4, H = 1.2;
const LAM_NM = 532;                    // 绿激光
const floor = new THREE.Mesh(new THREE.BoxGeometry(11.5, 0.16, 4), M.frame);
floor.position.set(2.6, -0.9, 0);
scene.add(floor);
/* 激光器 + 入射光束 */
const laser = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.7, 18), M.laser);
laser.rotation.z = Math.PI / 2;
laser.position.set(X_SRC, H, 0);
scene.add(laser);
const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, X_DISC - X_SRC, 10), M.wave);
beam.rotation.z = Math.PI / 2;
beam.position.set((X_SRC + X_DISC) / 2, H, 0);
scene.add(beam);
/* 圆盘(挡板)+ 金色盘缘(边缘次波源)+ 支杆 */
const discGrp = new THREE.Group();
discGrp.position.set(X_DISC, H, 0);
scene.add(discGrp);
const discMesh = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.05, 48), M.disc);
discMesh.rotation.z = Math.PI / 2;          // 圆柱轴 → 传播方向 x,盘面朝向波
discGrp.add(discMesh);
const rimMesh = new THREE.Mesh(new THREE.TorusGeometry(1, 0.022, 8, 60), M.rim);
rimMesh.rotation.y = Math.PI / 2;           // 盘缘环:法线沿 x
discGrp.add(rimMesh);
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1, 8), M.frame);
rod.position.set(X_DISC, 0, 0);
scene.add(rod);
/* 屏幕(随 z 移动) */
const screen = new THREE.Mesh(new THREE.BoxGeometry(0.07, 1.9, 2.0), M.screen);
scene.add(screen);
/* 泊松亮斑本体:屏中心一枚金色光球(招牌瞬间) */
const spotGlow = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), M.glow.clone());
scene.add(spotGlow);
/* 屏上强度带 */
const NB = 21;
const bands = [];
for (let i = 0; i < NB; i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.1, 0.13), M.band.clone());
  b.position.z = -1.0 + i / (NB - 1) * 2.0;
  screen.add(b);
  bands.push(b);
}
/* 半波带环(盘平面上被挡/露出的带) */
const zonesGrp = new THREE.Group();
zonesGrp.position.set(X_DISC + 0.045, H, 0);
scene.add(zonesGrp);
/* 波场点云:盘后空间的衍射场 */
const fieldN = 46;
const fieldGeo = new THREE.BufferGeometry();
fieldGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(fieldN * (fieldN - 4) * 3), 3));
const fColor = new Float32Array(fieldN * (fieldN - 4) * 3);
fieldGeo.setAttribute('color', new THREE.BufferAttribute(fColor, 3));
const fieldPts = new THREE.Points(fieldGeo, new THREE.PointsMaterial({
  size: 0.07, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false }));
scene.add(fieldPts);
/* 逐光子落屏点(InstancedMesh 小球) */
const PH_MAX = 400;
const phIM = new THREE.InstancedMesh(new THREE.SphereGeometry(0.03, 8, 6),
  new THREE.MeshBasicMaterial({ color: 0xf5e6b0, transparent: true, opacity: 0.95 }), PH_MAX);
phIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
phIM.count = 0;
phIM.frustumCulled = false;
phIM.visible = false;
scene.add(phIM);
const phDummy = new THREE.Object3D();
let phCount = 0;

/* ---------------- 状态 ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let tSim = qsFloat('t', 0) / 1000 * 12;          // ?t= 初始相位(0–1000 → 波场时间)
let aMM = 1.5;                                    // 盘半径(实尺度 mm)
let zM = 2.0;                                     // 屏距(实尺度 m)
let mode = 'disc';                                // disc | aper
let quantumMode = false;
let zonesOn = false;
const aVis = () => aMM * 0.5;                     // 盘半径(世界单位)
const zWorld = () => 1.4 + (zM - 0.5) / 3.5 * 4.2;
const fresnel = (am, zm) => am * am / (0.532 * zm);   // F = a²/(λz),λ=532 nm

/* 贝塞尔 J0(级数 + 远场渐近) */
function besselJ0(x) {
  const ax = Math.abs(x);
  if (ax < 8) {
    let sum = 1, term = 1;
    const h = ax * ax / 4;
    for (let m = 1; m <= 16; m++) {
      term *= -h / (m * m);
      sum += term;
      if (Math.abs(term) < 1e-9) break;
    }
    return sum;
  }
  return Math.sqrt(2 / (Math.PI * ax)) * (Math.cos(ax - Math.PI / 4) - Math.sin(ax - Math.PI / 4) / (8 * ax));
}
/* 菲涅尔衍射强度(圆盘=巴比涅补;圆孔=轴上 4sin²(πF/2) 的横向延拓) */
function intensity(rhoW, zwW) {
  const zr = Math.max(0.05, zM * zwW / zWorld());
  const Fp = fresnel(aMM, zr);
  const av = Math.max(0.05, aVis());
  const u = 2 * Math.PI * Fp * rhoW / av;
  const J = besselJ0(u);
  if (mode === 'disc') {
    const c = ss(0.15, 1.0, Fp);
    if (Math.abs(rhoW) < av) return lerp(1, 0.85 * J * J, c);
    return Math.max(0.02, 1 + 0.55 * J * Math.cos(Math.PI * Fp) * c);
  }
  const c = ss(0.1, 0.8, Fp);
  return Math.max(0.02, lerp(1, 1 + J * J - 2 * J * Math.cos(Math.PI * Fp), c));
}
const centerI = () => intensity(0, zWorld());
const spotRadiusMM = () => mode === 'disc' ? 0.383 * 0.532 * zM / aMM : 0.611 * 0.532 * zM / aMM;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblDisc = addLabel(() => L(`盘 a = ${aMM.toFixed(1)} mm · 挡住前 ${Math.max(1, Math.round(fresnel(aMM, zM)))} 个半波带`,
  `disc a = ${aMM.toFixed(1)} mm · blocks first ${Math.max(1, Math.round(fresnel(aMM, zM)))} half-period zones`),
  new THREE.Vector3(0, 0.95, 0), 'g', discGrp);
const lblScr = addLabel(() => mode === 'disc'
  ? L(`屏:影子中心 I = ${Math.round(centerI() * 100)}% 入射 · 亮斑半径 ≈ ${spotRadiusMM().toFixed(2)} mm`,
      `screen: shadow-center I = ${Math.round(centerI() * 100)}% of incident · spot radius ≈ ${spotRadiusMM().toFixed(2)} mm`)
  : L(`屏:圆孔中心 I = 4sin²(πF/2) = ${Math.round(centerI() * 100)}% 入射`,
      `screen: aperture center I = 4sin²(πF/2) = ${Math.round(centerI() * 100)}% of incident`),
  new THREE.Vector3(0, 1.35, 0), 'st', screen);
const lblStatus = addLabel(() => L('盘缘各点到轴上等光程 → 同相叠加:阴影正中永远亮(巴比涅:盘 = 全屏 − 圆孔)',
  'Every rim point is equidistant from the axis → in-phase sum: the shadow center always stays bright (Babinet: disc = full wave − aperture)'),
  new THREE.Vector3(2.6, -0.55, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '盘缘都是新波源', be: 'The rim is a ring of new sources',
    d: '惠更斯:波前被盘"剪"出的每一处边缘都发出次波——盘不是墙,是一圈 360° 同步发光的天线。',
    de: 'Huygens: every point of the wavefront clipped by the disc radiates anew — the disc is not a wall but a 360° ring antenna.',
    act: () => setMode('disc') },
  { b: '对称即同相 → 中心必亮', be: 'Symmetry = in phase → the center must glow',
    d: '轴上任一点到盘缘各点距离全相等:所有边缘次波走同一光程、同相叠加——阴影正中不是暗点,是全场最亮的焦点之一。',
    de: 'Any axis point is equidistant from every rim point: all edge wavelets share one path length and add in phase — the shadow center is among the brightest places.',
    act: () => { setMode('disc'); resetSliders(); } },
  { b: '半波带记账:F = a²/(λz)', be: 'Zone bookkeeping: F = a²/(λz)',
    d: '把波前切成半径 √(nλz) 的半波带:盘挡住前 k≈F 个带,轴上振幅 ≈ 第 k+1 带贡献的一半——总剩"下一个带",永不自消。',
    de: 'Slice the wavefront into half-period zones of radius √(nλz): the disc blocks the first k≈F zones, leaving on-axis amplitude ≈ half of zone k+1 — there is always a "next zone", never self-cancellation.',
    act: () => { zonesOn = true; document.getElementById('tglZones').checked = true; } },
  { b: '镜像对照:圆孔中心会闪', be: 'Mirror contrast: an aperture flickers',
    d: '圆孔中心 I = 4sin²(πF/2):k 为奇带 → 4× 亮,k 为偶带 → 0(正中反黑);圆盘挡掉前 k 带后中心永远亮——这正是巴比涅互补。',
    de: 'Aperture center I = 4sin²(πF/2): odd k → 4× brighter, even k → 0 (dark center!); a disc that blocks k zones keeps its center always bright — Babinet complementarity.',
    act: () => setMode('aper') },
  { b: '亮斑多大、多亮', be: 'How big, how bright',
    d: '亮斑半径 ≈ 0.38 λz/a:1.5 mm 盘、2 m 屏 → 约 0.27 mm 的金点;理想点光源下中心强度 ≈ 85–100% 入射,盘径越大斑越小越暗。',
    de: 'Spot radius ≈ 0.38 λz/a: a 1.5 mm disc at 2 m paints a ~0.27 mm gold dot; with a point source the center holds ≈85–100% of incident intensity — bigger discs shrink and dim it.',
    act: () => { setMode('disc'); resetSliders(); } },
  { b: '推远屏:亮斑淡出 + 1818 年判决', be: 'Push to far field + the verdict of 1818',
    d: 'F≪1 时盘小得"挡不住"波,影子糊掉、亮斑随之淡出。1818 年泊松用"中心有亮斑"讥讽波动说荒谬,阿拉果当场做出实验——亮斑就在那,菲涅尔赢了。',
    de: 'At F≪1 the disc is too small to block the wave: the shadow washes out and the spot fades. In 1818 Poisson mocked wave theory with this "absurd" spot — Arago produced it on the spot. Fresnel won.',
    act: () => { setMode('disc'); document.getElementById('z').value = 40; syncZ(); } },
];
function stepIndex() {
  if (zM > 3) return 5;
  if (mode === 'aper') return 3;
  if (zonesOn) return 2;
  if (Math.abs(aMM - 1.5) > 0.7 || Math.abs(zM - 2) > 1.2) return 4;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elA = document.getElementById('a'), elAVal = document.getElementById('aVal');
const elZ = document.getElementById('z'), elZVal = document.getElementById('zVal');
const tglLabels = document.getElementById('tglLabels');
const tglWave = document.getElementById('tglWave');
const tglZones = document.getElementById('tglZones');
const tglRotate = document.getElementById('tglRotate');
const stF = document.getElementById('stF'), stK = document.getElementById('stK'),
  stI = document.getElementById('stI'), stSpot = document.getElementById('stSpot'),
  stN = document.getElementById('stN');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setModeBtns() {
  document.getElementById('btnDisc').classList.toggle('on', mode === 'disc');
  document.getElementById('btnAper').classList.toggle('on', mode === 'aper');
  document.getElementById('btnPhoton').classList.toggle('on', quantumMode);
}
function setMode(m) { mode = m; setModeBtns(); }
function resetSliders() { elA.value = 15; elZ.value = 20; syncA(); syncZ(); }
function syncA() {
  aMM = parseInt(elA.value, 10) / 10;
  elAVal.textContent = aMM.toFixed(1) + ' mm';
  discMesh.scale.set(aVis(), 1, aVis());
  rimMesh.scale.setScalar(aVis());
  rod.scale.y = (H - aVis()) + 0.82;
  rod.position.y = ((H - aVis()) - 0.82) / 2;
  buildZones();
}
function syncZ() {
  zM = parseInt(elZ.value, 10) / 10;
  elZVal.textContent = zM.toFixed(1) + ' m';
  screen.position.set(X_DISC + zWorld(), H, 0);
  spotGlow.position.set(X_DISC + zWorld() + 0.06, H, 0);
  rebuildField();
  buildZones();
}
function rebuildField() {
  const pos = fieldGeo.attributes.position;
  let k = 0;
  const x0 = X_DISC + 0.15, x1 = X_DISC + zWorld() - 0.15;
  for (let ix = 0; ix < fieldN; ix++) {
    const x = x0 + (x1 - x0) * ix / (fieldN - 1);
    for (let iz = 2; iz < fieldN - 2; iz++) {
      const z = -1.0 + 2.0 * (iz - 2) / (fieldN - 5);
      pos.setXYZ(k++, x, H, z);
    }
  }
  pos.needsUpdate = true;
}
function buildZones() {
  zonesGrp.clear();
  if (!zonesOn) return;
  const F = fresnel(aMM, zM);
  const av = aVis();
  for (let n = 1; n <= 6; n++) {
    const r1 = av * Math.sqrt((n - 1) / Math.max(0.3, F));
    const r2 = av * Math.sqrt(n / Math.max(0.3, F));
    if (r1 > 2.2) break;
    const ring = new THREE.Mesh(new THREE.RingGeometry(r1, Math.min(r2, 2.2), 48),
      n % 2 === 1 ? M.zoneA : M.zoneB);
    ring.rotation.y = Math.PI / 2;
    zonesGrp.add(ring);
  }
}
elA.addEventListener('input', syncA);
elZ.addEventListener('input', syncZ);
document.getElementById('btnDisc').addEventListener('click', () => { setMode('disc'); });
document.getElementById('btnAper').addEventListener('click', () => { setMode('aper'); });
document.getElementById('btnPhoton').addEventListener('click', () => {
  quantumMode = !quantumMode;
  phIM.visible = quantumMode;
  setModeBtns();
});
document.getElementById('btnClear').addEventListener('click', () => { phCount = 0; phIM.count = 0; });
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
const elPh = document.getElementById('phase'), elPhVal = document.getElementById('phaseVal');
elPh.addEventListener('input', () => {
  tSim = parseInt(elPh.value, 10) / 1000 * 12;
  elPhVal.textContent = Math.round((tSim % 12) / 12 * 100) + '%';
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglWave.addEventListener('change', () => { fieldPts.visible = tglWave.checked; });
tglZones.addEventListener('change', () => { zonesOn = tglZones.checked; buildZones(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
const cTmp = new THREE.Color();
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing && !document.hidden) tSim += dts;
  if (document.activeElement !== elPh) {
    elPh.value = Math.round(((tSim % 12) + 12) % 12 / 12 * 1000);
    elPhVal.textContent = Math.round(((tSim % 12) + 12) % 12 / 12 * 100) + '%';
  }

  /* 波场点云:颜色 = 衍射强度 × 传播脉动 */
  const pos = fieldGeo.attributes.position;
  const col = fieldGeo.attributes.color;
  const zwTot = zWorld();
  let k = 0;
  for (let ix = 0; ix < fieldN; ix++) {
    const x = pos.getX(k);
    const zw = x - X_DISC;
    for (let iz = 2; iz < fieldN - 2; iz++) {
      const z = -1.0 + 2.0 * (iz - 2) / (fieldN - 5);
      const I = intensity(z, zw);
      const pulse = 0.55 + 0.45 * Math.sin(x * 7 - tSim * 6);
      cTmp.setRGB(0.95 * I * pulse + 0.02, 0.8 * I * pulse + 0.02, 0.25 * I * pulse);
      col.setXYZ(k, cTmp.r, cTmp.g, cTmp.b);
      k++;
    }
  }
  col.needsUpdate = true;

  /* 屏上强度带 */
  bands.forEach((b, i) => {
    const z = -1.0 + i / (NB - 1) * 2.0;
    const I = clamp(intensity(z, zwTot), 0, 4);
    b.material.opacity = 0.06 + I * 0.42;
    b.scale.y = clamp(0.5 + I * 0.55, 0.3, 2.2);
  });

  /* 泊松亮斑光球:阴影正中的金色亮点 */
  const F = fresnel(aMM, zM);
  spotGlow.material.opacity = mode === 'disc'
    ? 0.9 * ss(0.15, 1.0, F)
    : Math.sin(Math.PI * F / 2) ** 2 * 0.95 * ss(0.1, 0.8, F);
  spotGlow.scale.setScalar(0.8 + 0.25 * Math.sin(tSim * 3));

  /* 逐光子:按强度分布采样落屏 */
  if (quantumMode && playing && !document.hidden) {
    for (let n = 0; n < 2; n++) {
      if (phCount >= PH_MAX) break;
      let z;
      for (let tries = 0; tries < 40; tries++) {
        z = (Math.random() * 2 - 1) * 1.0;
        if (Math.random() * 4.2 < intensity(z, zwTot)) break;
      }
      const y = H + (Math.random() - 0.5) * 1.4;
      phDummy.position.set(X_DISC + zwTot + 0.05, y, z);
      phDummy.scale.setScalar(1);
      phDummy.updateMatrix();
      phIM.setMatrixAt(phCount, phDummy.matrix);
      phCount++;
      phIM.count = phCount;
      phIM.instanceMatrix.needsUpdate = true;
    }
  }

  /* stats + formula */
  const I0 = centerI();
  stF.textContent = F.toFixed(2);
  stK.textContent = Math.max(1, Math.round(F));
  stI.innerHTML = Math.round(I0 * 100) + '<small> %入射</small>';
  stI.className = 'v ' + (I0 > 0.5 ? 'g' : '');
  stSpot.innerHTML = spotRadiusMM().toFixed(2) + '<small> mm</small>';
  stN.textContent = quantumMode ? phCount : '—';
  formulaEl.innerHTML = L(
    `<b>F = a²/(λz)</b> = (${aMM.toFixed(1)} mm)² ÷ (532 nm × ${zM.toFixed(1)} m) ≈ <b>${F.toFixed(2)}</b> · ` +
    (mode === 'disc'
      ? `盘挡 k≈${Math.max(1, Math.round(F))} 带 → 中心振幅 ≈ 第 k+1 带之半 · I = ${Math.round(I0 * 100)}%`
      : `圆孔中心 I = 4sin²(πF/2) = ${Math.round(I0 * 100)}% 入射 · k 偶数时反黑`),
    `<b>F = a²/(λz)</b> = (${aMM.toFixed(1)} mm)² ÷ (532 nm × ${zM.toFixed(1)} m) ≈ <b>${F.toFixed(2)}</b> · ` +
    (mode === 'disc'
      ? `disc blocks k≈${Math.max(1, Math.round(F))} zones → axis amplitude ≈ half of zone k+1 · I = ${Math.round(I0 * 100)}%`
      : `aperture center I = 4sin²(πF/2) = ${Math.round(I0 * 100)}% of incident · dark when k is even`));

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

syncA();
syncZ();
setModeBtns();
elPh.value = Math.round(((tSim % 12) + 12) % 12 / 12 * 1000);
elPhVal.textContent = Math.round(((tSim % 12) + 12) % 12 / 12 * 100) + '%';
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
