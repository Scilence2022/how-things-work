<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消化道 · 把食物拆成能进血液的单体</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>

<div id="title">
  <h1 data-zh="消化道 · 把食物拆成能进血液的单体" data-en="The Digestive Tract · Breaking Food into Absorbable Units">消化道 · 把食物拆成能进血液的单体</h1>
  <div class="sub" data-zh="淀粉/蛋白/脂肪都是大分子,进不了血液,必须拆成单糖/氨基酸/脂肪酸+甘油——口腔里咀嚼放大表面积,唾液淀粉酶把淀粉剪成双糖(pH 7,停留秒级)→胃里盐酸 pH 1.5–3.5 杀菌、把蛋白变性展开,酸激活胃蛋白酶剪出肽段,蠕动搅拌 2–4 h→十二指肠 pH~8:胆汁(肝产、胆囊存)把大油滴乳化成微滴,表面积 ×约1000,胰淀粉酶/胰蛋白酶/脂肪酶总攻:双糖→单糖、肽→氨基酸、脂肪→脂肪酸+甘油→绒毛+微绒毛铺出 ~30 m² 吸收面,单糖/氨基酸入毛细血管、脂肪入乳糜管,停留 3–5 h→大肠回收水 ~1.5 L/天,菌群把纤维发酵成短链脂肪酸,停留 10 h–数天→拆不成单体的,从头到尾进不了血 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Starch, protein and fat are macromolecules the blood will never accept — they must become monosaccharides, amino acids, fatty acids plus glycerol — chewing multiplies surface area while salivary amylase clips starch into disaccharides (pH 7, seconds only) → gastric acid at pH 1.5–3.5 sterilizes and denatures protein, activating pepsin into peptides, churned for 2–4 h → in the duodenum at pH~8, bile (made in the liver, stored in the gallbladder) emulsifies fat globules ~1000-fold in surface area, and pancreatic amylase/trypsin/lipase finish the job: disaccharides→glucose, peptides→amino acids, fat→fatty acids plus glycerol → villi and microvilli unfold ~30 m² of absorbing surface, sugars and amino acids into capillaries, fat into lacteals, 3–5 h → the colon reclaims ~1.5 L of water a day while flora ferment fiber into short-chain fatty acids, 10 h to days → whatever never became a unit never enters the blood · 3D interactive demo · drag to orbit · Space = run/pause">消化道 · 把食物拆成能进血液的单体</div>
</div>

<div id="plot">
  <h3 data-zh="消化道纵览:pH 阶梯(橙:口 7→胃 2→肠 8)与累计吸收 %(绿)——竖线游标 = 食团当前位置" data-en="Tract overview: the pH staircase (orange: mouth 7→stomach 2→gut 8) and cumulative absorption % (green) — the cursor marks the bolus">消化道纵览:pH 阶梯(橙:口 7→胃 2→肠 8)与累计吸收 %(绿)——竖线游标 = 食团当前位置</h3>

    <span class="chip.r" data-zh="红 = 蛋白链→肽段→氨基酸" data-en="red = protein chain→peptides→amino acids">红 = 蛋白链→肽段→氨基酸</span>
    <span class="chip.b" data-zh="灰 = 脂肪滴:乳化后面积 ×1000" data-en="gray = fat: emulsified, area ×1000">灰 = 脂肪滴:乳化后面积 ×1000</span>
    <span class="chip.g" data-zh="绿点 = 已拆好的单体,正进入血管" data-en="green = finished units entering the bloodstream">绿点 = 已拆好的单体,正进入血管</span>

    </div>

  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const smooth = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 22, 58);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xdde5ec);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xdde5ec);
  groundM.color.setHex(dark ? 0x181b21 : 0xb4bfca);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('消化道 · 把食物拆成能进血液的单体', 'The Digestive Tract · Breaking Food into Absorbable Units');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateStats();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:#0f1013;color:#f2f5f9;font:15px system-ui;text-align:center;padding:30px';
  d.textContent = L('WebGL 初始化失败:当前浏览器不支持或已禁用 3D,无法显示本页演示。', 'WebGL failed to initialize: this browser does not support or has disabled 3D, so the demo cannot run.');
  document.body.appendChild(d);
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 140);
camera.position.set(4.5, 2.2, 16.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.2, -0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 60;

}

}

    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:pH 阶梯 + 累计吸收 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 40, padR = 14, padT = 14, padB = 24;
  const xOf = u => padL + clamp(u, 0, 1) * (W - padL - padR);
  const yPH = p => (H - padB) - clamp(p, 0, 10) / 10 * (H - padT - padB);
  const yAB = a => (H - padB) - clamp(a, 0, 1) * (H - padT - padB);
  ctx.font = '13px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const p of [0, 5, 10]) {
    ctx.beginPath(); ctx.moveTo(padL, yPH(p)); ctx.lineTo(W - padR, yPH(p)); ctx.stroke();
    ctx.fillText(String(p), padL - 24, yPH(p) + 5);
  }
  ctx.fillText('pH', 8, padT + 4);
  ctx.fillText('100%', W - padR - 10, padT + 4);
  for (const [u, name] of [[uStom0, L('胃', 'sto')], [uDuo0, L('十二', 'duo')], [uSi0, L('小肠', 'SI')], [uLi0, L('大肠', 'colon')]]) {
    ctx.strokeStyle = 'rgba(128,150,170,.30)';
    ctx.beginPath(); ctx.moveTo(xOf(u), padT); ctx.lineTo(xOf(u), H - padB); ctx.stroke();
    ctx.fillText(name, xOf(u) + 3, H - padB + 16);
  }
  ctx.strokeStyle = '#ffa94d';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let k = 0; k <= 140; k++) {
    const u = k / 140;
    k === 0 ? ctx.moveTo(xOf(u), yPH(phAt(u))) : ctx.lineTo(xOf(u), yPH(phAt(u)));
  }
  ctx.stroke();
  ctx.strokeStyle = '#69db7c';
  ctx.beginPath();
  for (let k = 0; k <= 140; k++) {
    const u = k / 140;
    k === 0 ? ctx.moveTo(xOf(u), yAB(fracAbs(u))) : ctx.lineTo(xOf(u), yAB(fracAbs(u)));
  }
  ctx.stroke();
  ctx.fillStyle = '#ffa94d';
  ctx.fillText('pH', padL + 8, padT + 14);
  ctx.fillStyle = '#69db7c';
  ctx.fillText(L('吸收%', 'absorbed %'), padL + 46, padT + 14);
  const cx = xOf(bolusU);
  ctx.strokeStyle = 'rgba(242,245,249,.85)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, H - padB); ctx.stroke();
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath(); ctx.arc(cx, yPH(phAt(bolusU)), 4.5, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#69db7c';
  ctx.beginPath(); ctx.arc(cx, yAB(fracAbs(bolusU)), 4.5, 0, 6.29); ctx.fill();
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const sProg = document.getElementById('sProg'), sProgVal = document.getElementById('sProgVal');
const sSpd = document.getElementById('sSpd'), sSpdVal = document.getElementById('sSpdVal');
const stSt = document.getElementById('stSt'), stPH = document.getElementById('stPH'), stSA = document.getElementById('stSA'),
  stPR = document.getElementById('stPR'), stFA = document.getElementById('stFA'), stAB = document.getElementById('stAB');
const formulaEl = document.getElementById('formula');
const btnMouth = document.getElementById('btnMouth'), btnStom = document.getElementById('btnStom'),
  btnSI = document.getElementById('btnSI'), btnLI = document.getElementById('btnLI'),
  btnBile = document.getElementById('btnBile'), btnMol = document.getElementById('btnMol');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  if (document.activeElement !== sProg) sProg.value = Math.round(bolusU * 1000);
  sProgVal.textContent = stationName(bolusU);
  sSpd.value = SPD; sSpdVal.textContent = '×' + SPD.toFixed(2);
}
function syncBtns() {
  btnBile.classList.toggle('on', bileOn);
  btnBile.textContent = bileOn ? L('胆汁乳化:开', 'Bile emulsify: ON') : L('胆汁乳化:关', 'Bile emulsify: OFF');
  btnMol.classList.toggle('on', molOn);
  btnMol.textContent = molOn ? L('分子:显示', 'Molecules: ON') : L('分子:隐藏', 'Molecules: OFF');
}
function updateStats() {
  stSt.textContent = stationName(bolusU);
  const ph = phAt(bolusU);
  stPH.textContent = ph.toFixed(1);
  stPH.className = 'v ' + (ph < 4 ? 'bad' : ph > 7.5 ? 'ok' : '');
  const fs = fracStarch(bolusU), fp = fracProt(bolusU), ff = fracFat(bolusU), fa = fracAbs(bolusU);
  stSA.textContent = Math.round(fs * 100) + ' %';
  stSA.className = 'v ' + (fs > 0.99 ? 'ok' : fs > 0 ? 'warn' : '');
  stPR.textContent = Math.round(fp * 100) + ' %';
  stPR.className = 'v ' + (fp > 0.99 ? 'ok' : fp > 0 ? 'warn' : '');
  stFA.textContent = Math.round(ff * 100) + ' %';
  stFA.className = 'v ' + (ff > 0.99 ? 'ok' : ff > 0.01 ? 'warn' : 'bad');
  stAB.textContent = Math.round(fa * 100) + ' %';
  stAB.className = 'v ' + (fa > 0.6 ? 'ok' : fa > 0.05 ? 'warn' : '');
  syncSliders();
}
function updateFormula() {
  const u = bolusU;
  formulaEl.innerHTML = L(
    `<b>乳化:S = 3V/r</b>:胆汁盐把 0.5–1 µm 油滴拆成 ~10 nm 微滴,r ↓~1000× → 总表面积 ×~1000,脂肪酶只在表面开工(与表面活性剂同原理)<br>` +
    `<b>三条拆解线</b>:淀粉 →(唾液/胰淀粉酶)双糖 → 葡萄糖;蛋白 →(胃蛋白酶/胰蛋白酶)肽 → 氨基酸;脂肪 →(脂肪酶)脂肪酸+甘油<br>` +
    `<b>吸收账本</b>:绒毛+微绒毛 ≈30 m²;单糖/氨基酸→毛细血管,脂肪→乳糜管;大肠回收水 ~1.5 L/天<br>` +
    `<b>当前</b>:${stationName(u)},pH ${phAt(u).toFixed(1)};淀粉 ${Math.round(fracStarch(u) * 100)}% · 蛋白 ${Math.round(fracProt(u) * 100)}% · 脂肪 ${Math.round(fracFat(u) * 100)}%(胆汁${bileOn ? '开' : '关'})`,
    `<b>Emulsification: S = 3V/r</b>: bile salts split 0.5–1 µm globules into ~10 nm droplets, r ↓~1000× → total surface ×~1000; lipase works only on the surface (same principle as surfactants)<br>` +
    `<b>Three cutting lines</b>: starch →(salivary/pancreatic amylase) disaccharides → glucose; protein →(pepsin/trypsin) peptides → amino acids; fat →(lipase) fatty acids + glycerol<br>` +
    `<b>Absorption ledger</b>: villi + microvilli ≈30 m²; sugars/amino acids→capillaries, fat→lacteal; colon reclaims ~1.5 L water/day<br>` +
    `<b>Now</b>: ${stationName(u)}, pH ${phAt(u).toFixed(1)}; starch ${Math.round(fracStarch(u) * 100)}% · protein ${Math.round(fracProt(u) * 100)}% · fat ${Math.round(fracFat(u) * 100)}% (bile ${bileOn ? 'ON' : 'OFF'})`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateStats(); updateFormula(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
function goStation(k) {
  const us = [0.004, uStomMid, uDuo0 + 0.008, uLiMid + 0.02];
  const ps = [1, 2, 3, 5];
  bolusU = us[k]; phaseIdx = ps[k];
  const cams = [[-5.6, 7.8, 5.4, -6.6, 7.5, 0], [-4.2, 3.8, 7.6, -5.15, 3.5, 0], [-2.6, 1.6, 6.2, -2.6, 1.0, -0.6], [1.2, 1.4, 14, 0, -0.4, 0]];
  flyTo(cams[k].slice(0, 3), cams[k].slice(3));
  syncAll();
}
btnMouth.addEventListener('click', () => goStation(0));
btnStom.addEventListener('click', () => goStation(1));
btnSI.addEventListener('click', () => goStation(2));
btnLI.addEventListener('click', () => goStation(3));
btnBile.addEventListener('click', () => {
  bileOn = !bileOn; syncBtns(); updateStats(); updateFormula();
  notify(bileOn ? '胆汁开:油滴散成微滴,面积 ×1000,脂肪酶提速' : '胆汁关:油滴重新聚拢,脂肪酶只能在表面啃',
    bileOn ? 'bile on: globule bursts into droplets, area ×1000, lipase speeds up' : 'bile off: droplets regroup, lipase reduced to nibbling');
});
btnMol.addEventListener('click', () => { molOn = !molOn; syncBtns(); });
sProg.addEventListener('input', () => { bolusU = +sProg.value / 1000; syncSliders(); updateStats(); });
sSpd.addEventListener('input', () => { SPD = +sSpd.value; syncSliders(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglVilli').addEventListener('change', e => { villiOn = e.target.checked; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
const _M4 = new THREE.Matrix4(), _Q = new THREE.Quaternion(), _S = new THREE.Vector3(), _V = new THREE.Vector3(), _N = new THREE.Vector3();
const UP = V(0, 1, 0);

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * SPD * (playing ? 1 : 0);
  time += dt0;
  if (notifyT > 0) notifyT -= dt0;
  /* 推进 */
  if (dt > 0) {
    bolusU += segRate[segIndex(bolusU)] * dt;
    if (bolusU >= 1) { bolusU = 0; notify('新一餐:又一轮拆解与吸收', 'new meal: another round of breakdown and absorption'); }
  }
  const p = posAt(bolusU, new THREE.Vector3());
  const tan = tanAt(bolusU, new THREE.Vector3()).normalize();
  const side = _N.set(0, 0, 1).cross(tan);
  if (side.lengthSq() < 0.01) side.set(1, 0, 0); else side.normalize();
  const perp = new THREE.Vector3().crossVectors(tan, side).normalize();
  /* 乳化进度 */
  const emulTarget = bileOn && bolusU > uDuo0 ? 1 : 0;
  emulsT += (emulTarget - emulsT) * Math.min(1, dt0 * 3.5);
  const chewF = 1 - smooth(bolusU / 0.05);
  const inStom = smooth((bolusU - uStom0) / 0.015) * (1 - smooth((bolusU - uDuo0) / 0.015));
  const clusterR = 0.3 + 0.55 * inStom;
  /* 淀粉 / 蛋白 / 脂肪 三组粒子 */
  const fS = fracStarch(bolusU), fP = fracProt(bolusU), fF = fracFat(bolusU);
  const showMol = molOn;
  starchI.visible = showMol; protI.visible = showMol; fatI.visible = showMol;
  if (showMol) {
    for (let i = 0; i < ST_N; i++) {
      const s = clamp(fS * ST_N - i, 0, 1);
      const a = (i - (ST_N - 1) / 2) * 0.055;
      _V.copy(p)
        .addScaledVector(tan, a)
        .addScaledVector(side, Math.sin(i * 1.9) * 0.07)
        .addScaledVector(perp, Math.cos(i * 1.3) * 0.07)
        .addScaledVector(rnd[i].v, 0.42 * s)
        .addScaledVector(side, Math.sin(time * 31 + i * 2.7) * 0.028 * chewF)
        .addScaledVector(perp, Math.cos(time * 27 + i * 1.9) * 0.028 * chewF);
      _Q.setFromUnitVectors(UP, tan);
      const len = lerp(1, 0.22, s);
      _M4.compose(_V, _Q, _S.set(1, len, 1));
      starchI.setMatrixAt(i, _M4);
    }
    starchI.instanceMatrix.needsUpdate = true;
    for (let i = 0; i < PR_N; i++) {
      const s = clamp(fP * PR_N - i, 0, 1);
      const a = (i - (PR_N - 1) / 2) * 0.048;
      _V.copy(p)
        .addScaledVector(tan, a)
        .addScaledVector(side, Math.sin(i * 2.3 + 1) * 0.09)
        .addScaledVector(perp, Math.cos(i * 1.7) * 0.09)
        .addScaledVector(rnd[50 + i].v, 0.45 * s)
        .addScaledVector(perp, Math.sin(time * 29 + i * 2.1) * 0.03 * chewF);
      const sc = lerp(1, 0.45, s);
      _M4.compose(_V, _Q.identity(), _S.set(sc, sc, sc));
      protI.setMatrixAt(i, _M4);
    }
    protI.instanceMatrix.needsUpdate = true;
    for (let i = 0; i < FA_N; i++) {
      let sc;
      if (i === 0) {
        sc = 2.3 * (1 - emulsT) * (1 - 0.55 * fF);
        _V.copy(p).add(V(0, 0.08, 0.12));
      } else {
        sc = emulsT * rnd[100 + i].b * (0.9 - 0.7 * fF);
        _V.copy(p)
          .addScaledVector(rnd[100 + i].v, 0.14 + 0.4 * emulsT)
          .addScaledVector(side, Math.sin(time * 2.2 + i) * 0.03 * emulsT);
      }
      sc = Math.max(sc, 0.001);
      _M4.compose(_V, _Q.identity(), _S.set(sc, sc, sc));
      fatI.setMatrixAt(i, _M4);
    }
    fatI.instanceMatrix.needsUpdate = true;
  }
  /* 吸收粒子:食团 → 血管/乳糜管 */
  const fA = fracAbs(bolusU);
  const absorbing = fA > prevAbs && fA < 0.999 && bolusU > uSi0 && bolusU < uLi0;
  if (absorbing && dt > 0) { spawnT -= dt; if (spawnT <= 0) { spawnT = 0.06; const d = nuPool.find(x => !x.on); if (d) { d.on = true; d.life = 0; d.u0 = bolusU; } } }
  prevAbs = fA;
  for (let i = 0; i < NU_N; i++) {
    const d = nuPool[i];
    let sc = 0.001;
    if (d.on) {
      d.life += dt * 1.3;
      if (d.life >= 1) { d.on = false; }
      else {
        const vT = clamp((d.u0 - uSi0) / (uLi0 - uSi0), 0, 1);
        if (d.life < 0.5) {
          const k = smooth(d.life / 0.5);
          _V.copy(posAt(d.u0, _N)).lerp(vesC.getPointAt(vT, _S), k);
        } else {
          vesC.getPointAt(clamp(vT + (d.life - 0.5) * 0.4, 0, 1), _V);
        }
        sc = 1 * (1 - smooth((d.life - 0.85) / 0.15));
      }
    }
    _M4.compose(_V, _Q.identity(), _S.set(sc, sc, sc));
    gluI.setMatrixAt(i, _M4);
  }
  gluI.instanceMatrix.needsUpdate = true;
  /* 绒毛摆动 */
  const villiVis = villiOn * smooth((bolusU - uSi0) / 0.02) * (1 - smooth((bolusU - uLi0) / 0.02));
  for (let i = 0; i < VI_N; i++) {
    const vd = villusData[i];
    const ang = Math.sin(time * 2.2 + vd.ph) * 0.32;
    _Q.setFromAxisAngle(vd.t, ang);
    _V.copy(vd.n).applyQuaternion(_Q);
    _N.copy(vd.q).addScaledVector(vd.n, 0.32);
    const sc = Math.max(0.001, (0.9 + 0.25 * Math.sin(time * 2 + vd.ph)) * villiVis);
    _M4.compose(_N, _Q.setFromUnitVectors(UP, _V), _S.set(sc, sc, sc));
    villiI.setMatrixAt(i, _M4);
  }
  villiI.instanceMatrix.needsUpdate = true;
  /* 大肠水回收 */
  const wVis = smooth((bolusU - uLi0 + 0.01) / 0.03);
  for (let i = 0; i < WA_N; i++) {
    const wd = waterData[i];
    const life = (time * 0.32 + wd.ph) % 1;
    _V.copy(wd.q).addScaledVector(wd.n, 0.3 + 1.25 * life);
    const sc = Math.max(0.001, Math.sin(life * Math.PI) * wVis);
    _M4.compose(_V, _Q.identity(), _S.set(sc, sc, sc));
    waterI.setMatrixAt(i, _M4);
  }
  waterI.instanceMatrix.needsUpdate = true;
  /* 胃酸雾 / 胆囊脉冲 / 吸收时血管亮度 */
  fogM.opacity = 0.34 * inStom * (phAt(bolusU) < 5 ? 1 : 0.2);
  sac.scale.setScalar(1).multiply(V(1.15, 0.95, 0.85)).multiplyScalar(1 + 0.035 * inStom * Math.sin(time * 3));
  const emulRate = Math.max(0, emulTarget - emulsT);
  gbM.emissiveIntensity = 0.5 + 3.2 * emulRate + 0.8 * emulsT * (bolusU > uDuo0 && bolusU < uLi0 ? 1 : 0);
  vesBm.emissiveIntensity = 1.2 + 1.6 * smooth((fA - 0.05) / 0.3) * (1 - smooth((fA - 0.92) / 0.08));
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); updateFormula(); }
  accPlot += dt0;
  if (accPlot > 0.06) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
