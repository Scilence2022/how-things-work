<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无线充电 · 一台「空气芯变压器」</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#43d17c;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#2f9e5c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(67,209,124,.9); color: #c9f3da; }
  .lbl.b { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(47,158,92,.9); color: #2f9e5c; }
  :root[data-theme="light"] .lbl.bad { border-color: rgba(200,60,60,.9); color: #b83232; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #43d17c; }
  #stats .v.hot { color: #ff8787; }
  #batt { grid-column: 1 / 3; margin-top: 6px; }
  #batt .bar { height: 14px; border-radius: 5px; background: rgba(128,140,155,.16); overflow: hidden; }
  #batt .bar i { display: block; height: 100%; background: rgba(67,209,124,.8); width: 0%; transition: width .2s; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,93,93,.7); background: rgba(255,93,93,.10); color: #ffc2c2; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(67,209,124,.10); border-color: rgba(67,209,124,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(47,158,92,.08); border-color: rgba(47,158,92,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #a9edc6; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="无线充电：一台「空气芯变压器」" data-en="Wireless Charging: an air-core transformer">无线充电：一台「空气芯变压器」</h1>
  <div class="sub" data-zh="发射线圈通交流生交变磁通,穿过接收线圈感生电流;对得越准、贴得越近,耦合越好;金属异物吃磁通发热——FoD 停机保护 · 空格播放/暂停" data-en="AC in the transmitter makes flux; whatever flux crosses the receiver becomes current — alignment is everything, and a stray coin will feast on the flux and get hot (FoD cuts off) · Space = play/pause">发射线圈通交流生交变磁通,穿过接收线圈感生电流;对得越准、贴得越近,耦合越好;金属异物吃磁通发热——FoD 停机保护 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="耦合系数 k" data-en="coupling k">耦合系数 k</span><span class="v g" id="stK">—</span>
  <span class="k" data-zh="接收功率" data-en="received power">接收功率</span><span class="v g" id="stP">—</span>
  <span class="k" data-zh="异物温度" data-en="foreign object temp">异物温度</span><span class="v hot" id="stT">—</span>
  <div id="batt">
    <div class="cap" style="font-size:11.5px;color:var(--text2);margin-bottom:4px" data-zh="手机电池" data-en="phone battery">手机电池</div>
    <div class="bar"><i id="battFill"></i></div>
  </div>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnCoin" data-zh="扔一枚硬币到充电板上" data-en="Drop a coin on the pad">扔一枚硬币到充电板上</button>
  </div>
  <div class="row"><label data-zh="左右偏移" data-en="X offset">左右偏移</label><input id="off" type="range" min="0" max="100" step="2" value="0"><span class="val" id="offVal">0.0 cm</span></div>
  <div class="row"><label data-zh="悬空间隙" data-en="air gap">悬空间隙</label><input id="gap" type="range" min="0" max="100" step="2" value="15"><span class="val" id="gapVal">6 mm</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglFlux" type="checkbox" checked> <span data-zh="磁通线" data-en="flux lines">磁通线</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../transformer/" data-zh="铁芯变压器:它的表亲" data-en="iron-core transformer: the cousin">铁芯变压器:它的表亲</a>
    <a href="../electromagnetic-induction/" data-zh="电磁感应:楞次定律" data-en="EM induction: Lenz's law">电磁感应:楞次定律</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('无线充电 · 空气芯变压器', 'Wireless Charging · air-core transformer');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.4, 4.2, 7.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  pad: mat(0x2c3340, { roughness: 0.55 }),
  coilTx: mat(0xc98b5f, { metalness: 0.65, roughness: 0.35 }),
  coilRx: mat(0x6fc2d8, { metalness: 0.65, roughness: 0.35 }),
  phone: new THREE.MeshPhysicalMaterial({ color: 0x39424f, roughness: 0.25, metalness: 0.4, transparent: true, opacity: 0.82 }),
  screen: new THREE.MeshBasicMaterial({ color: 0x0e1420, transparent: true, opacity: 0.9 }),
  flux: new THREE.MeshBasicMaterial({ color: 0x43d17c, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false }),
  coin: mat(0xd8b26a, { metalness: 0.85, roughness: 0.3 }),
  brick: mat(0x90be6d, { roughness: 0.4 }),
  bolt: new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.95 }),
};

/* ---------------- 场景:充电板 + 手机 ---------------- */
/* 平板螺旋线圈 */
function spiralCoil(radiusMax, turns, tubeR, material) {
  const pts = [];
  const N = turns * 26;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const r = radiusMax * (0.25 + 0.75 * t);
    const a = t * turns * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, N, tubeR, 8, false), material);
}
const floor2 = new THREE.Mesh(new THREE.BoxGeometry(12, 0.2, 7), M.floor);
floor2.position.y = -0.1;
scene.add(floor2);
const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.9, 0.18, 40), M.pad);
pad.position.y = 0.09;
scene.add(pad);
const coilTx = spiralCoil(1.25, 7, 0.045, M.coilTx);
coilTx.position.y = 0.19;
scene.add(coilTx);
const brick = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.4, 0.5), M.brick);
brick.position.set(2.6, 0.2, 0);
scene.add(brick);
/* 手机(悬在上方,位置由滑块控制) */
const phoneGrp = new THREE.Group();
const phoneBody = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.14, 3.1), M.phone);
phoneGrp.add(phoneBody);
const screen = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.02, 2.9), M.screen);
screen.position.y = 0.08;
phoneGrp.add(screen);
const coilRx = spiralCoil(0.62, 6, 0.04, M.coilRx);
coilRx.position.y = -0.09;
phoneGrp.add(coilRx);
phoneGrp.rotation.z = 0;
scene.add(phoneGrp);
/* 充电动画(屏幕闪电) */
const boltShape = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.4, 4), M.bolt);
boltShape.rotation.x = Math.PI / 2;
boltShape.visible = false;
phoneGrp.add(boltShape);
/* 硬币(异物) */
const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.05, 26), M.coin.clone());
coin.position.set(-0.85, 0.24, 0.4);
coin.visible = false;
scene.add(coin);

/* 磁通管(发射→接收的虚拟通量) */
const N_FLUX = 9;
const fluxLines = [];
for (let i = 0; i < N_FLUX; i++) {
  const a = i / N_FLUX * Math.PI * 2;
  const g = new THREE.Group();
  const curvePts = [];
  for (let k = 0; k <= 24; k++) {
    const t = k / 24;
    const bulge = Math.sin(t * Math.PI) * 0.9;
    curvePts.push(new THREE.Vector3(Math.cos(a) * (0.3 + bulge * 0.9), t * 1.2, Math.sin(a) * (0.3 + bulge * 0.9)));
  }
  const curve = new THREE.CatmullRomCurve3(curvePts);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.02, 6, false), M.flux.clone());
  g.add(mesh);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), M.bolt.clone());
  g.add(dot);
  g.userData = { curve, dot };
  scene.add(g);
  fluxLines.push(g);
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblTx = addLabel(() => L('发射线圈(通交流)', 'transmitter coil (AC)'), new THREE.Vector3(0, 0.5, 1.4), 'g');
const lblRx = addLabel(() => L('接收线圈(手机内)', 'receiver coil (in phone)'), new THREE.Vector3(0, 1.1, -1.6), 'b', phoneGrp);
const lblBrick = addLabel(() => L('高频逆变电源', 'HF inverter'), new THREE.Vector3(2.6, 0.75, 0), 'g');
const lblStatus = addLabel(() => '…', new THREE.Vector3(0, 4.4, 0), 'st');

/* ================= 状态 ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let offsetX = 0;          // 0..1.6(世界单位,≈cm)
let gapY = 0.5;           // 手机底部到板面 0.05..1.2
let coinOn = false;
let battery = 0.32;
let tSim = 0;
function coupling() {
  /* k 随偏移与间隙衰减 */
  const kOff = Math.exp(-Math.pow(offsetX / 1.15, 2));
  const kGap = Math.exp(-gapY / 0.85);
  return 0.86 * kOff * kGap;
}
function powerW() {
  const k = coupling();
  return coinOn ? 0 : clamp(k * k * 15, 0, 15);
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '发射线圈:通交流生磁通', be: 'Transmitter: AC makes flux',
    d: '充电板里的扁平线圈通上高频交流(~100 kHz),在周围空间激起了交变磁通——和变压器原边一模一样,只是没有铁芯。',
    de: 'The pad coil carries ~100 kHz AC, filling the space with alternating flux — a transformer primary with no core.',
    act: () => { coinOn = false; document.getElementById('btnCoin').classList.remove('on'); } },
  { b: '接收线圈:磁通生电流', be: 'Receiver: flux makes current',
    d: '手机背面的线圈泡在这片交变磁通里,感生电动势、整流后给电池充电——「空气芯变压器」的副边。',
    de: 'The phone\'s coil sits in that flux, induces EMF, rectifies, charges — the secondary of an air-core transformer.',
    act: () => { coinOn = false; document.getElementById('btnCoin').classList.remove('on'); } },
  { b: '谐振:把效率拉起来', be: 'Resonance: the efficiency trick',
    d: '两边线圈各配电容,调到同一谐振频率——品质因数 Q 把微弱耦合放大,隔空效率才能到 70–80%。',
    de: 'Both coils get capacitors tuned to the same resonance — the Q factor amplifies weak coupling to 70–80% efficiency.',
    act: () => { coinOn = false; document.getElementById('btnCoin').classList.remove('on'); } },
  { b: '对不准就白费', be: 'Alignment is everything',
    d: '耦合系数 k 随偏移和间隙指数衰减:k 掉一半,功率掉四分之——「随手一放充得慢」的物理根源。',
    de: 'k decays exponentially with offset and gap; halve k and power quarters — why casual placement charges slowly.',
    act: () => { offsetX = 1.2; gapY = 0.9; document.getElementById('off').value = Math.round(offsetX / 1.6 * 100); document.getElementById('gap').value = Math.round((gapY - 0.05) / 1.15 * 100); syncSliders(); } },
  { b: '异物检测:FoD', be: 'Foreign object detection',
    d: '硬币或回形针躺在磁通里,涡流把它当电热丝烧——Qi 充电板靠「功耗对不上」发现异物,立刻停机。',
    de: 'A coin in the flux becomes a heating element via eddy currents; the pad notices the power mismatch and shuts off (FoD).',
    act: () => { coinOn = !coinOn; document.getElementById('btnCoin').classList.toggle('on', coinOn); } },
];
function stepIndex() {
  if (coinOn && powerW() < 0.5) return 4;
  if (coupling() < 0.3) return 3;
  if (battery > 0.9) return 2;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elOff = document.getElementById('off');
const elOffVal = document.getElementById('offVal');
const elGap = document.getElementById('gap');
const elGapVal = document.getElementById('gapVal');
const tglLabels = document.getElementById('tglLabels');
const tglFlux = document.getElementById('tglFlux');
const tglRotate = document.getElementById('tglRotate');
const stK = document.getElementById('stK'), stP = document.getElementById('stP'),
  stT = document.getElementById('stT'), battFill = document.getElementById('battFill');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncSliders() {
  elOffVal.textContent = (offsetX * 10).toFixed(1) + ' cm';
  elGapVal.textContent = (gapY * 40).toFixed(0) + ' mm';
}
elOff.addEventListener('input', () => { offsetX = parseInt(elOff.value, 10) / 100 * 1.6; syncSliders(); });
elGap.addEventListener('input', () => { gapY = 0.05 + parseInt(elGap.value, 10) / 100 * 1.15; syncSliders(); });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
document.getElementById('btnCoin').addEventListener('click', () => {
  coinOn = !coinOn;
  document.getElementById('btnCoin').classList.toggle('on', coinOn);
});
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglFlux.addEventListener('change', () => {
  fluxLines.forEach(g => g.visible = tglFlux.checked);
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let coinTemp = 24;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;
  const ac = Math.sin(tSim * 2 * Math.PI * 1.1);
  const k = coupling();
  const p = powerW();

  /* 手机位置 */
  phoneGrp.position.set(offsetX, 0.18 + gapY + 0.07, 0);
  coin.visible = coinOn;

  /* 磁通线:亮度∝交流,到达高度∝k */
  const reach = 0.15 + k * 0.85;
  const visible = tglFlux.checked && !coinOn;
  fluxLines.forEach((g, i) => {
    g.visible = visible;
    const t = (tSim * 0.8 + i / fluxLines.length) % 1;
    const p0 = g.userData.curve.getPoint(clamp(t * reach, 0, 1));
    g.userData.dot.position.copy(p0);
    g.userData.dot.material.opacity = visible ? 0.35 + 0.6 * Math.abs(ac) : 0;
    g.children[0].material.opacity = visible ? 0.1 + 0.3 * Math.abs(ac) * (1 - t) : 0;
  });

  /* 充电与电池 */
  if (playing && p > 0.5) battery = Math.min(1, battery + dts * 0.012 * p / 8);
  boltShape.visible = p > 0.5 && Math.sin(tSim * 6) > 0;
  battFill.style.width = (battery * 100).toFixed(0) + '%';

  /* 硬币涡流发热 */
  if (coinOn) {
    const fluxDensity = Math.abs(ac) * Math.exp(-Math.abs(coin.position.x - offsetX) / 1.2);
    coinTemp += (24 + 260 * fluxDensity * fluxDensity * (p >= 0 ? 1 : 0) - coinTemp) * dts * 2;
    coin.material.emissive.setRGB(clamp((coinTemp - 24) / 300, 0, 1), 0.2, 0.1);
    coin.material.emissiveIntensity = clamp((coinTemp - 24) / 120, 0, 1.4);
  } else {
    coinTemp = 24;
    coin.material.emissiveIntensity = 0;
  }

  /* 状态 */
  lblStatus.element.textContent =
    coinOn && coinTemp > 120 ? L('⚠ FoD:检测到异物发热,停机保护!', '⚠ FoD: foreign object heating — shut off!')
    : coinOn ? L('硬币正在被涡流加热…', 'a coin is being eddy-current heated…')
    : p < 0.5 ? L('耦合太弱:基本没充进去', 'coupling too weak: barely charging')
    : `k = ${k.toFixed(2)} · P = ${p.toFixed(1)} W · ${L('充电中', 'charging')}`;
  lblStatus.element.className = 'lbl ' + (coinOn && coinTemp > 120 ? 'bad' : 'st');

  stK.textContent = k.toFixed(2);
  stP.innerHTML = coinOn ? '0.0<small> W(FoD)</small>' : p.toFixed(1) + '<small> W</small>';
  stT.innerHTML = coinOn ? Math.round(coinTemp) + '<small> °C</small>' : '—';

  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

offsetX = clamp(qsFloat('off', 0), 0, 1.6);
elOff.value = Math.round(offsetX / 1.6 * 100);
syncSliders();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
