<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电镀 · 付电费把腐蚀倒过来放</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.a { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  .lbl.c { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.a { border-color: rgba(201,42,42,.9); color: #c92a2a; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.c { color: #ffd166; }
  #stats .v.b { color: #4dabf7; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.cu { color: #ffc078; border-color: rgba(255,192,120,.7); }
  .chip.ion { color: #a5d8ff; border-color: rgba(116,192,252,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,107,107,.10); color: var(--text); border: 1px solid rgba(255,107,107,.5);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(255,93,93,.22); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="电镀：付电费，把腐蚀倒过来放" data-en="Electroplating: pay for power, run corrosion backwards">电镀：付电费，把腐蚀倒过来放</h1>
  <div class="sub" data-zh="电解池强迫电流:阳极铜溶解补液,Cu²⁺ 游到阴极还原成镀层;厚度 = 电流 × 时间;接反极性,镀件当场被蚀 · 空格播放/暂停" data-en="An electrolytic cell forces current: the anode dissolves to feed Cu²⁺, which plates onto the cathode; thickness = I × t; swap the poles and the workpiece dissolves · Space = play/pause">电解池强迫电流:阳极铜溶解补液,Cu²⁺ 游到阴极还原成镀层;厚度 = 电流 × 时间;接反极性,镀件当场被蚀 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="电流" data-en="current">电流</span><span class="v b" id="stI">—</span>
  <span class="k" data-zh="通电时间" data-en="elapsed">通电时间</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="镀层厚度" data-en="coat thickness">镀层厚度</span><span class="v c" id="stD">—</span>
  <span class="k" data-zh="转移铜量" data-en="Cu transferred">转移铜量</span><span class="v c" id="stM">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.cu" data-zh="● 铜层/铜阳极" data-en="● copper coat/anode">● 铜层/铜阳极</span>
    <span class="chip.ion" data-zh="● Cu²⁺(渡河的搬运工)" data-en="● Cu²⁺ (the ferry)">● Cu²⁺(渡河的搬运工)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnRev" data-zh="接反极性试试" data-en="Swap the polarity">接反极性试试</button>
  </div>
  <div class="row"><label data-zh="电流" data-en="current">电流</label><input id="cur" type="range" min="5" max="50" step="1" value="20"><span class="val" id="curVal">2.0 A</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCarriers" type="checkbox" checked> <span data-zh="离子/电子" data-en="ions/electrons">离子/电子</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../corrosion/" data-zh="腐蚀:自发版的同一反应" data-en="corrosion: the spontaneous twin">腐蚀:自发版的同一反应</a>
    <a href="../water-electrolysis/" data-zh="水电解:电解池家族开篇" data-en="water electrolysis: the family opener">水电解:电解池家族开篇</a>
    <a href="../li-ion-battery/" data-zh="锂电池:充电也是电解池" data-en="Li-ion: charging is electrolysis too">锂电池:充电也是电解池</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.frame.color.set(THEME === 'light' ? 0x9aa4b2 : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('电镀 · 把腐蚀倒过来放', 'Electroplating · corrosion in reverse');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(3.8, 3.2, 7.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  frame: mat(0x39424f, { roughness: 0.7 }),
  bath: new THREE.MeshPhysicalMaterial({ color: 0x2a6f9e, transparent: true, opacity: 0.34, roughness: 0.3 }),
  waterTint: new THREE.MeshBasicMaterial({ color: 0x2a6f9e, transparent: true, opacity: 0.2, depthWrite: false }),
  anode: mat(0xc07a3f, { metalness: 0.6, roughness: 0.45 }),
  spoon: mat(0x5b6675, { metalness: 0.55, roughness: 0.4 }),
  coat: mat(0xe0913f, { metalness: 0.8, roughness: 0.28, emissive: 0xe0913f, emissiveIntensity: 0.12 }),
  psu: mat(0x90be6d, { roughness: 0.4 }),
  wire: mat(0xcfd4dc, { metalness: 0.7, roughness: 0.3 }),
  ion: new THREE.MeshBasicMaterial({ color: 0x74c0fc }),
  eDot: new THREE.MeshBasicMaterial({ color: 0xffe066 }),
};

/* ================= 场景:镀槽 ================= */
const TANK_W = 5.2, TANK_H = 2.2, TANK_D = 2.2;
{
  const bottom = new THREE.Mesh(new THREE.BoxGeometry(TANK_W + 0.2, 0.14, TANK_D + 0.2), M.frame);
  bottom.position.y = -0.07;
  scene.add(bottom);
  for (const [x, z, w, d] of [
    [-TANK_W / 2, 0, 0.08, TANK_D], [TANK_W / 2, 0, 0.08, TANK_D],
    [0, -TANK_D / 2, TANK_W, 0.08], [0, TANK_D / 2, TANK_W, 0.08]]) {
    const glass = new THREE.Mesh(new THREE.BoxGeometry(w, TANK_H, d),
      new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.07, roughness: 0.15, side: THREE.DoubleSide, depthWrite: false }));
    glass.position.set(x, TANK_H / 2, z);
    scene.add(glass);
  }
  const liquid = new THREE.Mesh(new THREE.BoxGeometry(TANK_W - 0.08, TANK_H - 0.3, TANK_D - 0.08), M.waterTint);
  liquid.position.set(0, (TANK_H - 0.3) / 2, 0);
  scene.add(liquid);
}
/* 阳极:粗铜板(左) */
const anode = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.3, 1.3), M.anode);
anode.position.set(-1.6, 1.05, 0);
scene.add(anode);
const anodeHook = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.9, 8), M.wire);
anodeHook.position.set(-1.6, 2.1, 0);
scene.add(anodeHook);
/* 阴极:待镀件(勺子:碗+柄),初始是灰铁 */
const spoonGrp = new THREE.Group();
spoonGrp.position.set(1.6, 1.05, 0);
scene.add(spoonGrp);
const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 18, 0, Math.PI * 2, 0, Math.PI / 2), M.spoon);
bowl.rotation.x = Math.PI;
bowl.position.y = 0.1;
spoonGrp.add(bowl);
const handle = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.85, 0.03), M.spoon);
handle.position.set(0, 0.68, 0);
handle.rotation.z = 0.18;
spoonGrp.add(handle);
const spoonHook = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.9, 8), M.wire);
spoonHook.position.set(1.6, 2.1, 0);
scene.add(spoonHook);
/* 镀层(铜壳,厚度可长可缩) */
const coat = new THREE.Mesh(new THREE.SphereGeometry(0.355, 24, 18, 0, Math.PI * 2, 0, Math.PI / 2), M.coat);
coat.rotation.x = Math.PI;
coat.position.y = 0.1;
coat.scale.setScalar(0.001);
spoonGrp.add(coat);
/* 电源 */
const psu = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.75, 0.55), M.psu);
psu.position.set(0, 3.0, 0);
scene.add(psu);
const psuCapL = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.16, 0.3), mat(0xff6b6b, { roughness: 0.4 }));
psuCapL.position.set(-0.18, 3.46, 0);
scene.add(psuCapL);
const psuCapR = psuCapL.clone();
psuCapR.material = mat(0x4dabf7, { roughness: 0.4 });
psuCapR.position.x = 0.18;
scene.add(psuCapR);
/* 导线 */
function tube(points, m, r = 0.03) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, r, 8, false), m);
  scene.add(mesh);
  return curve;
}
const wireA = tube([
  new THREE.Vector3(-0.18, 3.45, 0), new THREE.Vector3(-0.9, 3.5, 0.3),
  new THREE.Vector3(-1.6, 2.55, 0.2)], M.wire);
const wireB = tube([
  new THREE.Vector3(0.18, 3.45, 0), new THREE.Vector3(0.9, 3.5, 0.3),
  new THREE.Vector3(1.6, 2.55, 0.2)], M.wire);

/* 载流子 */
const m4 = new THREE.Matrix4();
function makeInst(material, n, r) {
  const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 8, 6), material, n);
  for (let i = 0; i < n; i++) { m4.makeScale(0.001, 0.001, 0.001); inst.setMatrixAt(i, m4); }
  scene.add(inst);
  return inst;
}
const instIon = makeInst(M.ion, 30, 0.042);
const ionDots = [];
for (let i = 0; i < 30; i++) ionDots.push({ p: Math.random(), y: rand(0.35, 1.7), z: rand(-0.8, 0.8), sway: Math.random() * 9 });
const instE = makeInst(M.eDot, 12, 0.032);
const eDots = [];
for (let i = 0; i < 12; i++) eDots.push({ p: Math.random() });

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let current = 2.0;              // A
let reversed = false;
let minutes = 0;
let thicknessUm = 0;            // μm
let cuMass = 0;                 // g
/* 厚度 ∝ I·t:0.3 μm/(A·min) 视觉标定 */
function depositRate() { return 0.3 * current; }

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblAnode = addLabel(() => reversed
  ? L('现在 = 阳极:勺子被蚀!', 'now anodic: the spoon etches!')
  : L('阳极:粗铜板 Cu → Cu²⁺ + 2e⁻', 'anode: crude Cu → Cu²⁺ + 2e⁻'),
  new THREE.Vector3(reversed ? 1.6 : -1.6, 2.5, 0), reversed ? 'bad' : 'a');
const lblCathode = addLabel(() => reversed
  ? L('现在 = 阴极:铜板长回来', 'now cathodic: the slab grows')
  : L('阴极:Cu²⁺ + 2e⁻ → Cu 镀层', 'cathode: Cu²⁺ + 2e⁻ → Cu coat'),
  new THREE.Vector3(reversed ? -1.6 : 1.6, 2.5, 0), 'c');
const lblPsu = addLabel(() => reversed ? L('电源:极性已接反!', 'supply: polarity reversed!') : L('直流电源(强迫电流)', 'DC supply (forces current)'),
  new THREE.Vector3(0, 3.75, 0), reversed ? 'bad' : 'st');
const lblStatus = addLabel(() => reversed
  ? L('接反了:镀件当阳极,越「镀」越薄!', 'reversed: the workpiece etches thinner!')
  : L(`镀层生长中:厚度 ∝ I × t(法拉第定律)`, 'plating: thickness ∝ I × t (Faraday\'s law)'),
  new THREE.Vector3(0, -0.55, 0), reversed ? 'bad' : 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '电解池:花钱买电流', be: 'The cell: paying for current',
    d: '腐蚀是自发的原电池;电镀反过来——接上直流电源,强迫电流按我们要的方向走(非自发,电费就是代价)。',
    de: 'Corrosion runs itself; plating is the paid reverse — a DC supply forces the current where we want it.',
    act: () => setReversed(false) },
  { b: '阳极:粗铜溶解补液', be: 'Anode: crude copper feeds the bath',
    d: '电源把阳极的电子抽走,铜原子变成 Cu²⁺ 溶入电解液——阳极慢慢变薄,同时在给镀液「补货」。',
    de: 'The supply pulls electrons from the anode; copper leaves as Cu²⁺ — the slab thins while restocking the bath.',
    act: () => setReversed(false) },
  { b: '阴极:Cu²⁺ 还原成镀层', be: 'Cathode: Cu²⁺ becomes the coat',
    d: 'Cu²⁺ 游到待镀件,拿到电子还原成铜原子,一层层长在表面——勺子从此穿铜衣。',
    de: 'Cu²⁺ swims to the workpiece, grabs electrons, and stacks up as metal — the spoon gets its copper jacket.',
    act: () => setReversed(false) },
  { b: '法拉第定律:厚度 = I × t', be: 'Faraday: thickness = I × t',
    d: '每转移一份电荷就沉积固定质量的铜——镀层厚度正比于电流×时间,工厂就靠这两个旋钮控厚。拖「电流」试试。',
    de: 'Fixed charge, fixed copper: thickness tracks current × time — the two knobs every plating shop turns. Drag the current.',
    act: () => setReversed(false) },
  { b: '接反极性:当场翻车', be: 'Swap the poles: instant disaster',
    d: '勺子被接到阳极——它自己开始溶解,「镀层」越长越薄直到露底。电镀的第一铁律:待镀件必须接阴极。',
    de: 'Wire the spoon to the anode and it dissolves instead — rule one of plating: the workpiece goes on the cathode.',
    act: () => setReversed(!reversed) },
];
function stepIndex() {
  if (reversed) return 4;
  if (thicknessUm > 2) return 3;
  if (minutes > 1) return 2;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elCur = document.getElementById('cur');
const elCurVal = document.getElementById('curVal');
const btnRev = document.getElementById('btnRev');
const tglLabels = document.getElementById('tglLabels');
const tglCarriers = document.getElementById('tglCarriers');
const tglRotate = document.getElementById('tglRotate');
const stI = document.getElementById('stI'), stT = document.getElementById('stT'),
  stD = document.getElementById('stD'), stM = document.getElementById('stM');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setReversed(r) {
  reversed = r;
  btnRev.classList.toggle('on', r);
}
elCur.addEventListener('input', () => { current = parseInt(elCur.value, 10) / 10; elCurVal.textContent = current.toFixed(1) + ' A'; });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
btnRev.addEventListener('click', () => setReversed(!reversed));
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    minutes += dts * 0.25;
    if (!reversed) {
      thicknessUm += depositRate() * dts * 0.25;
      cuMass += current * dts * 0.25 * 0.02;
    } else {
      thicknessUm = Math.max(0, thicknessUm - depositRate() * dts * 0.25);
      cuMass = Math.max(0, cuMass - current * dts * 0.25 * 0.02);
    }
  }
  /* 几何:阳极板溶解变薄(左);镀层随厚度伸缩(右勺) */
  const anodeScale = clamp(1 - Math.min(thicknessUm, 45) / 130, 0.68, 1);
  anode.scale.x = reversed ? 1 : anodeScale;
  anode.position.x = -1.6 + (1 - anode.scale.x) * 0.5;
  anodeHook.position.x = anode.position.x;
  const coatK = clamp(thicknessUm / 40, 0.001, 1);
  coat.scale.setScalar(Math.max(coatK, 0.001));
  coat.visible = thicknessUm > 0.05;
  handle.material = thicknessUm > 12 && !reversed ? M.coat : M.spoon;

  /* 载流子 */
  const show = tglCarriers.checked;
  const dir = reversed ? -1 : 1;
  ionDots.forEach((d, i) => {
    d.p = (d.p + dts * (0.1 + 0.12 * current) * 0.4) % 1;
    const x = lerp(-1.45, 1.45, dir > 0 ? d.p : 1 - d.p);
    const y = d.y + Math.sin(d.p * 12 + d.sway) * 0.05;
    m4.makeScale(...(show ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4.setPosition(x, y, d.z);
    instIon.setMatrixAt(i, m4);
  });
  instIon.instanceMatrix.needsUpdate = true;
  eDots.forEach((e, i) => {
    e.p = (e.p + dts * (0.15 + 0.15 * current) * 0.5) % 1;
    const wire = i % 2 === 0 ? wireA : wireB;
    const t = dir > 0 ? (i % 2 === 0 ? e.p : 1 - e.p) : (i % 2 === 0 ? 1 - e.p : e.p);
    m4.makeScale(...(show ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4.setPosition(wire.getPoint(t));
    instE.setMatrixAt(i, m4);
  });
  instE.instanceMatrix.needsUpdate = true;

  /* 统计 */
  stI.textContent = current.toFixed(1) + ' A';
  stT.textContent = minutes.toFixed(1) + ' min';
  stD.innerHTML = reversed ? '—' : thicknessUm.toFixed(1) + '<small> μm</small>';
  stM.innerHTML = cuMass.toFixed(2) + '<small> g</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
setReversed(false);
elCurVal.textContent = current.toFixed(1) + ' A';
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
