<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分子动理论 · 压强是撞出来的</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#74c0fc;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1971c2;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(25,113,194,.9); color: #1971c2; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.b { color: #74c0fc; }
  #stats .v.g { color: #38d9a9; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(116,192,252,.12); color: var(--text); border: 1px solid rgba(116,192,252,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(116,192,252,.10); border-color: rgba(116,192,252,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(25,113,194,.08); border-color: rgba(25,113,194,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #a5d8ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="分子动理论：压强是撞出来的" data-en="Kinetic Theory: pressure is born of collisions">分子动理论：压强是撞出来的</h1>
  <div class="sub" data-zh="亿万个分子撞活塞,撞出来的是压强;温度=平均动能,体积压缩→撞得更密→压强升——pV=nRT 从统计里长出来 · 空格播放/暂停" data-en="Trillions of molecules pound the piston: that pounding IS pressure. Temperature is mean kinetic energy; squeeze the volume and pounding densifies — pV=nRT grows out of statistics · Space = play/pause">亿万个分子撞活塞,撞出来的是压强;温度=平均动能,体积压缩→撞得更密→压强升——pV=nRT 从统计里长出来 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="温度(平均动能)" data-en="temperature">温度(平均动能)</span><span class="v b" id="stT">—</span>
  <span class="k" data-zh="压强(碰撞率)" data-en="pressure">压强(碰撞率)</span><span class="v g" id="stP">—</span>
  <span class="k" data-zh="体积" data-en="volume">体积</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="pV 乘积" data-en="pV product">pV 乘积</span><span class="v b" id="stPV">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnFreeze" data-zh="冻结一瞬:看速度分布" data-en="freeze: see the speed distribution">冻结一瞬:看速度分布</button>
  </div>
  <div class="row"><label data-zh="温度" data-en="temperature">温度</label><input id="temp" type="range" min="10" max="100" step="5" value="50"><span class="val" id="tempVal">50%</span></div>
  <div class="row"><label data-zh="体积(拉活塞)" data-en="volume (piston)">体积(拉活塞)</label><input id="vol" type="range" min="35" max="100" step="5" value="100"><span class="val" id="volVal">100%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglColor" type="checkbox" checked> <span data-zh="按速度着色" data-en="color by speed">按速度着色</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../carnot-cycle/" data-zh="卡诺:热机的天花板" data-en="Carnot: the engine ceiling">卡诺:热机的天花板</a>
    <a href="../activation-energy/" data-zh="活化能:速度分布的另一用场" data-en="activation energy: another use of the distribution">活化能:速度分布的另一用场</a>
    <a href="../phase-transition/" data-zh="相变:分子开始抱团" data-en="phase transition: molecules team up">相变:分子开始抱团</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('分子动理论 · 压强是撞出来的', 'Kinetic Theory · pressure from collisions');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(3.4, 2.6, 6.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.6, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.07, roughness: 0.1, side: THREE.DoubleSide }),
  piston: mat(0x8a93a3, { metalness: 0.5, roughness: 0.4 }),
  rod: mat(0xcfd4dc, { metalness: 0.7, roughness: 0.3 }),
};

/* ================= 容器与活塞 ================= */
const BOX = { x0: -1.4, x1: 1.4, y0: 0.2, y1: 2.2, z0: -0.9, z1: 0.9 };
const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.18, 4.4), M.floor);
floor.position.set(0.6, -0.1, 0);
scene.add(floor);
/* 玻璃箱壁(除右侧面为活塞) */
function wall(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M.glass);
  m.position.set(x, y, z);
  scene.add(m);
}
wall(BOX.x1 - BOX.x0, 0.06, BOX.z1 - BOX.z0, 0, BOX.y0, 0);
wall(0.06, BOX.y1 - BOX.y0, BOX.z1 - BOX.z0, BOX.x0, (BOX.y0 + BOX.y1) / 2, 0);
wall(BOX.x1 - BOX.x0, BOX.y1 - BOX.y0, 0.06, 0, (BOX.y0 + BOX.y1) / 2, BOX.z0);
wall(BOX.x1 - BOX.x0, BOX.y1 - BOX.y0, 0.06, 0, (BOX.y0 + BOX.y1) / 2, BOX.z1);
wall(BOX.x1 - BOX.x0, 0.06, BOX.z1 - BOX.z0, 0, BOX.y1, 0);
/* 活塞(右侧面,可滑动) */
const pistonGrp = new THREE.Group();
scene.add(pistonGrp);
const pistonFace = new THREE.Mesh(new THREE.BoxGeometry(0.1, BOX.y1 - BOX.y0, BOX.z1 - BOX.z0), M.piston);
pistonGrp.add(pistonFace);
const pistonRod = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.4, 12), M.rod);
pistonRod.rotation.z = Math.PI / 2;
pistonGrp.add(pistonRod);
let volFrac = 1.0;            // 体积比例 0.35..1
function pistonX() { return BOX.x0 + (BOX.x1 - BOX.x0) * volFrac; }
function syncPiston() {
  const px = pistonX();
  pistonFace.position.set(px, (BOX.y0 + BOX.y1) / 2, 0);
  pistonRod.position.set(px + 0.7, (BOX.y0 + BOX.y1) / 2, 0);
}

/* ================= 分子(InstancedMesh,按速度着色) ================= */
const N = 150;
const molMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0xffffff }), N);
molMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);
scene.add(molMesh);
const m4 = new THREE.Matrix4();
const mols = [];
function speedFor(T) { return 0.6 + T * 1.9; }
function seedMolecules() {
  mols.length = 0;
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, b = Math.acos(Math.random() * 2 - 1);
    const sp = speedFor(temp) * (0.55 + Math.random() * 0.9);
    mols.push({
      p: new THREE.Vector3(rand(BOX.x0 + 0.1, pistonX() - 0.1), rand(BOX.y0 + 0.1, BOX.y1 - 0.1), rand(BOX.z0 + 0.1, BOX.z1 - 0.1)),
      v: new THREE.Vector3(Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a)).multiplyScalar(sp),
    });
  }
}
const rand = (a, b) => a + Math.random() * (b - a);
let temp = 0.5;

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let frozen = false;
let hitCount = 0, hitTimer = 0;
let tSim = 0;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblPiston = addLabel(() => L('活塞:被分子撞着往外推', 'piston: pounded outward by molecules'), new THREE.Vector3(-1.6, 2.6, 0), 'b');
const lblStatus = addLabel(() => frozen
  ? L('已冻结:红=快分子,蓝=慢分子——这就是温度的真相', 'frozen: red = fast, blue = slow — this IS temperature')
  : L('压强 = 单位时间的碰撞冲量总和', 'pressure = total collision impulse per unit time'),
  new THREE.Vector3(0.5, 3.0, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '压强是撞出来的', be: 'Pressure is pounded out',
    d: '亿万个分子不停地撞活塞——每一次撞击贡献一小份冲量,单位时间撞得越多越狠,压强就越大。',
    de: 'Molecules pound the piston nonstop; each hit donates a bit of impulse. More hits, harder hits — higher pressure.',
    act: () => { temp = 0.5; volFrac = 1; document.getElementById('temp').value = 50; document.getElementById('vol').value = 100; syncUI(); } },
  { b: '温度 = 平均动能', be: 'Temperature = mean kinetic energy',
    d: '拖高温度:分子整体变快(颜色转红)。「温度」不是热素,只是全体分子平均动能的别名。',
    de: 'Raise T: every molecule speeds up (turns red). Temperature is just the alias of mean kinetic energy.',
    act: () => { temp = 0.9; document.getElementById('temp').value = 90; syncUI(); } },
  { b: '压缩体积:撞得更密', be: 'Squeeze: denser pounding',
    d: '拉活塞把体积压小:同样的速度、更短的撞壁间隔——压强升高。这就是 pV = 常数的分子版证明。',
    de: 'Pull the piston in: same speeds, shorter gaps between wall hits — pressure rises. That is pV = const, from molecules up.',
    act: () => { volFrac = 0.5; document.getElementById('vol').value = 50; syncUI(); } },
  { b: '冻结:速度分布现形', be: 'Freeze: the distribution appears',
    d: '冻结一瞬并按速度着色:不是所有分子一样快——红的一小撮特别快,大部分居中,慢的也有。麦克斯韦分布的实景。',
    de: 'Freeze and color by speed: a fast red few, a large middling crowd, a slow tail — Maxwell\'s distribution, live.',
    act: () => { frozen = !frozen; document.getElementById('btnFreeze').classList.toggle('on', frozen); } },
  { b: 'pV 乘积:守着常数', be: 'The pV product: nearly constant',
    d: '同时拖温度与体积,盯着右下角 pV 乘积——它近似守恒。宏观定律,不过是统计的影子。',
    de: 'Drag T and volume while watching the pV readout — it nearly holds. Macroscopic law is the shadow of statistics.',
    act: () => { temp = 0.6; volFrac = 0.8; document.getElementById('temp').value = 60; document.getElementById('vol').value = 80; syncUI(); } },
];
function stepIndex() {
  if (frozen) return 3;
  if (volFrac < 0.6) return 2;
  if (temp > 0.7) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elTemp = document.getElementById('temp');
const elTempVal = document.getElementById('tempVal');
const elVol = document.getElementById('vol');
const elVolVal = document.getElementById('volVal');
const btnFreeze = document.getElementById('btnFreeze');
const tglLabels = document.getElementById('tglLabels');
const tglColor = document.getElementById('tglColor');
const tglRotate = document.getElementById('tglRotate');
const stT = document.getElementById('stT'), stP = document.getElementById('stP'),
  stV = document.getElementById('stV'), stPV = document.getElementById('stPV');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncUI() {
  elTempVal.textContent = Math.round(temp * 100) + '%';
  elVolVal.textContent = Math.round(volFrac * 100) + '%';
  seedMolecules();
}
btnFreeze.addEventListener('click', () => {
  frozen = !frozen;
  btnFreeze.classList.toggle('on', frozen);
});
elTemp.addEventListener('input', () => { temp = parseInt(elTemp.value, 10) / 100; syncUI(); });
elVol.addEventListener('input', () => { volFrac = parseInt(elVol.value, 10) / 100; syncUI(); });
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
const cCold = new THREE.Color(0x4dabf7), cMid = new THREE.Color(0xffd43b), cHot = new THREE.Color(0xff6b6b), cTmp = new THREE.Color();
let pressureAvg = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing && !frozen) tSim += dts;

  const px = pistonX();
  const sp = speedFor(temp);
  /* 分子运动 */
  if (!frozen) {
    let hits = 0;
    for (const m of mols) {
      m.p.addScaledVector(m.v, dts * 0.55);
      if (m.p.x < BOX.x0 + 0.05) { m.p.x = BOX.x0 + 0.05; m.v.x = Math.abs(m.v.x); hits++; }
      if (m.p.x > px - 0.05) { m.p.x = px - 0.05; m.v.x = -Math.abs(m.v.x); hits++; }
      if (m.p.y < BOX.y0 + 0.05) { m.p.y = BOX.y0 + 0.05; m.v.y = Math.abs(m.v.y); hits++; }
      if (m.p.y > BOX.y1 - 0.05) { m.p.y = BOX.y1 - 0.05; m.v.y = -Math.abs(m.v.y); hits++; }
      if (m.p.z < BOX.z0 + 0.05) { m.p.z = BOX.z0 + 0.05; m.v.z = Math.abs(m.v.z); hits++; }
      if (m.p.z > BOX.z1 - 0.05) { m.p.z = BOX.z1 - 0.05; m.v.z = -Math.abs(m.v.z); hits++; }
    }
    hitCount += hits;
    /* 温度缓慢松弛到目标 */
    const cur = mols.reduce((s, m) => s + m.v.length(), 0) / N / speedFor(temp);
    for (const m of mols) m.v.multiplyScalar(1 + (1 - cur) * dts * 0.8);
  }
  hitTimer += dts;
  if (hitTimer > 0.4) {
    pressureAvg = lerp(pressureAvg, hitCount / 0.4 / N * 100, 0.4);
    hitCount = 0; hitTimer = 0;
  }
  syncPiston();

  /* 渲染分子(按速度着色) */
  const vmax = speedFor(1.0);
  mols.forEach((m, i) => {
    m4.makeScale(1, 1, 1);
    m4.setPosition(m.p);
    molMesh.setMatrixAt(i, m4);
    const sp = m.v.length() / vmax;
    if (sp < 0.5) cTmp.lerpColors(cCold, cMid, sp / 0.5);
    else cTmp.lerpColors(cMid, cHot, (sp - 0.5) / 0.5);
    molMesh.setColorAt(i, tglColor.checked || frozen ? cTmp : cMid);
  });
  molMesh.instanceMatrix.needsUpdate = true;
  if (molMesh.instanceColor) molMesh.instanceColor.needsUpdate = true;

  stT.innerHTML = Math.round(temp * 300) + '<small> K(示意)</small>';
  stP.innerHTML = pressureAvg.toFixed(1) + '<small> (碰撞率)</small>';
  stV.innerHTML = (volFrac * 100).toFixed(0) + '<small> %</small>';
  stPV.innerHTML = (pressureAvg * volFrac).toFixed(1) + '<small> ≈ 常数</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

seedMolecules();
syncUI();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
