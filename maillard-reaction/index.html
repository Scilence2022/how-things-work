<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美拉德反应 · 煎烤为什么这么香</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffb454;
    --bg:#10151c; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a06a12;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,180,84,.9); color: #ffe0ae; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(160,106,18,.9); color: #8a5c0d; }
  .pop { display: inline-block; opacity: 0; }
  .pop.on { animation: pop .8s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(.3); opacity: 0; }
    22% { transform: scale(1.9); opacity: 1; }
    45% { transform: scale(1.15); }
    75% { opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.g { color: #7bd88f; }
  #stats .v.b { color: #d9a441; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,180,84,.6); background: rgba(255,180,84,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(160,106,18,.55); background: rgba(160,106,18,.10); }
  #legend { display: flex; gap: 7px; margin: 4px 0 6px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.r { color: #ffc4b5; border-color: rgba(255,122,92,.7); }
  .chip.p { color: #ffe0ae; border-color: rgba(255,180,84,.9); }
  .chip.f { color: #ffd9a3; border-color: rgba(255,159,28,.7); }
  .chip.t { color: #f0b9ae; border-color: rgba(214,90,66,.75); }
  :root[data-theme="light"] .chip.b { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.r { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.p { color: #8a5c0d; border-color: rgba(160,106,18,.9); }
  :root[data-theme="light"] .chip.f { color: #9c5f00; border-color: rgba(156,95,0,.7); }
  :root[data-theme="light"] .chip.t { color: #a83a28; border-color: rgba(168,58,40,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row.off { display: none; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .ticks { position: relative; height: 12px; margin: 0 60px 0 100px; }
  .ticks span { position: absolute; top: 0; font-size: 9.5px; color: var(--text2); transform: translateX(-50%); }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,180,84,.10); border-color: rgba(255,180,84,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(160,106,18,.08); border-color: rgba(160,106,18,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="美拉德反应:煎烤为什么这么香" data-en="The Maillard reaction: why seared food smells">美拉德反应:煎烤为什么这么香</h1>
  <div class="sub" data-zh="140 °C 是门槛:还原糖的羰基遇上氨基 → 脱水缩合 → Amadori 重排 → 裂解出数百种香气分子 → 聚成类黑精把表面染成金褐;水煮永远钉在 100 °C,所以煮得熟、香不了 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="140 °C is the gate: a reducing sugar's carbonyl meets an amino group → condensation → Amadori rearrangement → cracking into hundreds of aroma molecules → melanoidins stain the crust golden-brown; boiling is pinned at 100 °C — cooked, never fragrant · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">140 °C 是门槛:还原糖的羰基遇上氨基 → 脱水缩合 → Amadori 重排 → 裂解出数百种香气分子 → 聚成类黑精把表面染成金褐;水煮永远钉在 100 °C,所以煮得熟、香不了 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="表面温度" data-en="surface temp">表面温度</span><span class="v hot" id="stT">—</span>
  <span class="k" data-zh="反应速率 k_rel" data-en="rate k_rel">反应速率 k_rel</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="风味分子" data-en="flavor molecules">风味分子</span><span class="v g" id="stF">0</span>
  <span class="k" data-zh="褐变程度" data-en="browning">褐变程度</span><span class="v b" id="stB">0 %</span>
  <span class="k" data-zh="水分" data-en="water">水分</span><span class="v" id="stW">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn on" id="btnGrill" data-zh="煎烤" data-en="Sear">煎烤</button>
    <button class="abtn" id="btnBoil" data-zh="水煮" data-en="Boil">水煮</button>
    <button class="abtn" id="btnCaramel" data-zh="焦糖化" data-en="Caramelize">焦糖化</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="Reset">复位</button>
  </div>
  <div class="row"><label data-zh="锅温(设定)" data-en="Pan temp">锅温(设定)</label><input id="temp" type="range" min="25" max="250" step="5" value="200"><span class="val" id="tempVal">200 °C</span></div>
  <div class="ticks"><span style="left:33.3%">100</span><span style="left:51.1%;color:var(--hot);font-weight:700">140</span><span style="left:60%;color:var(--hot)">160</span></div>
  <div class="row"><label data-zh="水分(表面)" data-en="Surface water">水分(表面)</label><input id="water0" type="range" min="0" max="100" step="5" value="45"><span class="val" id="waterVal">45 %</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="legend">
    <span class="chip b" data-zh="氨基 –NH₂" data-en="amino –NH₂">氨基 –NH₂</span>
    <span class="chip r" data-zh="羰基 C=O" data-en="carbonyl C=O">羰基 C=O</span>
    <span class="chip p" data-zh="吡嗪=坚果" data-en="pyrazine = nutty">吡嗪=坚果</span>
    <span class="chip f" data-zh="呋喃=焦糖" data-en="furan = caramel">呋喃=焦糖</span>
    <span class="chip t" data-zh="噻吩=肉香" data-en="thiophene = meaty">噻吩=肉香</span>
  </div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
      <label><input id="tglPH" type="checkbox"> <span data-zh="碱性 pH(小苏打)" data-en="alkaline pH (baking soda)">碱性 pH(小苏打)</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../activation-energy/" data-zh="140 °C 门槛是什么:活化能" data-en="what the 140 °C gate is: activation energy">140 °C 门槛是什么:活化能</a>
    <a href="../conjugation-color/" data-zh="褐色从哪里来:共轭与颜色" data-en="where the brown comes from: conjugation &amp; color">褐色从哪里来:共轭与颜色</a>
    <a href="../radical-chain/" data-zh="裂解里的自由基:链式反应" data-en="radicals in cracking: chain reactions">裂解里的自由基:链式反应</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10151c);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('美拉德反应 · 煎烤为什么这么香', 'The Maillard Reaction · why searing smells');
  for (const r of labelReg) {
    if (r.span) r.span.textContent = r.text();
    else r.o.element.textContent = r.text();
  }
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.3, 2.1, 4.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xfff1e0, 2.0);
key.position.set(4, 8, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.05, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  pan: mat(0x2a2d33, { metalness: 0.7, roughness: 0.35, emissive: 0xff5a2a, emissiveIntensity: 0 }),
  handle: mat(0x39424f, { metalness: 0.5 }),
  meat: mat(0xb4574a, { roughness: 0.75, emissiveIntensity: 0.03 }),
  crust: mat(0xc9765f, { roughness: 0.65, emissiveIntensity: 0.04 }),
  film: new THREE.MeshStandardMaterial({ color: 0xbfe0ee, transparent: true, opacity: 0.28, roughness: 0.15, depthWrite: false }),
  rod: mat(0x8a93a3, { metalness: 0.4 }),
  C: mat(0x6b7480, { roughness: 0.4 }),
  O: mat(0xe2574a, { emissiveIntensity: 0.2 }),
  N: mat(0x4c9ef0, { emissiveIntensity: 0.2 }),
  H: mat(0xe8ecef, { roughness: 0.35 }),
  drop: new THREE.MeshBasicMaterial({ color: 0xcfe8f2, transparent: true, opacity: 0.5, depthWrite: false }),
  melS: mat(0x8a93a3, { metalness: 0.3 }),
  melD: mat(0xffd166, { emissiveIntensity: 0.3 }),
  melA: mat(0x4a3423, { roughness: 0.6 }),
};

/* ================= 布局:锅 + 牛排剖面 + 水膜 ================= */
const CRUST_TOP = 0.69, SURF = 0.78;
const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 5.4), M.floor);
floor.position.y = -0.1;
scene.add(floor);
const pan = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.14, 1.9), M.pan);
pan.position.y = 0.07;
scene.add(pan);

const T_ENV = 25, EA = 100e3, RG = 8.314, T140K = 413.15;
let mode = 'grill', Tpan = 200, water0 = 45, water = 45, Tsurf = T_ENV;

let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;

let crossed = false, contrastFlip = false;
const pending = [];
const dryF = () => mode === 'boil' ? 0 : clamp(1 - water / 25, 0, 1);
function rate() {
  if (mode === 'boil' || dryF() <= 0) return 0;

  else Tsurf += ((TpanE - Tsurf) * 0.3 - (Tsurf - T_ENV) * 0.012) * h;
  if (mode === 'boil') water = 65;
  else if (Tsurf > 96) water = Math.max(0, water - (0.4 + Math.max(0, TpanE - 100) * 0.02) * h);
  if (mode === 'boil') grey = Math.min(1, grey + h * 0.05);
  const r = rate();
  if (r > 0) browning = Math.min(1, browning + r * h * 0.012);
  if (!crossed && mode === 'grill' && Tsurf >= 140) { crossed = true; pending.push(-1); }
  spawnAcc += r * h * 0.5;
  while (spawnAcc >= 1) {
    spawnAcc -= 1;
    const n = 4 + (Math.random() * 5 | 0);
    flavorN += n;
    pending.push(n);
    if (pending.length > 8) pending.shift();
  }

  tSim += h;
}
const gateOK = r => mode === 'grill' && r > 0.15 && dryF() > 0.25;

    return;
  }
  if (!gateOK(r)) { stage = 'idle'; stageT = 0; return; }
  stageT += h * (0.7 + Math.min(r, 25) * 0.12);
  if (stage === 'approach' && stageT >= 1.4) { stage = 'condense'; stageT = 0; }
  else if (stage === 'condense') {

    if (stageT >= 1.8) { stage = 'amadori'; stageT = 0; }
  }
  else if (stage === 'amadori' && stageT >= 2.4) { stage = 'crack'; stageT = 0; }
  else if (stage === 'crack' && !vBroken && stageT >= 0.9) {
    vBroken = true;
    sugarG.visible = aminoG.visible = false;
    const n = 10 + (Math.random() * 8 | 0);
    flavorN += n;
    pending.push(n);
    browning = Math.min(1, browning + 0.03);

}

function resetState() {

      dummy.rotation.set(0, 0, 0);
    } else dummy.scale.setScalar(0.0001);
    dummy.updateMatrix();
    steam.setMatrixAt(i, dummy.matrix);
  }
  steam.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < 90; i++) {
    const s = flavorP[i];
    if (s.life > 0) {
      s.life -= dt * 1.1;
      s.v.y += 1.5 * dt;
      s.v.multiplyScalar(1 - 1.2 * dt);
      s.p.addScaledVector(s.v, dt);
      dummy.position.copy(s.p);
      dummy.scale.setScalar(Math.max(s.life, 0.001));
      dummy.rotation.set(s.life * 9, s.life * 7, s.life * 5);
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.0001); }
    dummy.updateMatrix();
    flavor.setMatrixAt(i, dummy.matrix);
  }
  flavor.instanceMatrix.needsUpdate = true;
  const hop = Tsurf >= 99 && water > 2;
  for (let i = 0; i < 36; i++) {
    const d = dropP[i];
    dummy.position.set(d.x, CRUST_TOP + 0.06 + (hop ? Math.abs(Math.sin(tSim * 5 + d.ph)) * 0.16 : 0) + Math.sin(tSim * 3 + d.ph) * 0.015, d.z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.setScalar(water > 2 ? 1 : 0.0001);
    dummy.updateMatrix();
    drops.setMatrixAt(i, dummy.matrix);
  }
  drops.instanceMatrix.needsUpdate = true;
}

/* ================= 讲解步骤 ================= */
function jump(fn) {
  resetState(); fn(); snapVisuals();
  elTemp.value = Tpan; elTempVal.textContent = Tpan + ' °C';
  elW.value = water0; elWVal.textContent = water0 + ' %';
}
const STEPS = [
  { b: '100 °C 以下:只有晃动', be: 'Below 100 °C: jiggle only',

    de: 'Molecules just shake harder. Boiling pins the surface at 100 °C — evaporation eats the heat, 140 °C never arrives: grey however long you boil.',
    act: () => { setMode('grill'); jump(() => { Tpan = 90; }); } },
  { b: '140 °C+:羰基遇上氨基', be: 'Past 140 °C: carbonyl meets amino',
    d: '表面一干、越过 ~140 °C,氨基 N 的孤对进攻还原糖的羰基 C → 脱去一分子水(看得见它飞走),缩合成 N-糖基胺。速率按 Arrhenius 指数上升。',
    de: 'Once dry and past ~140 °C, the amino lone pair attacks the sugar carbonyl C → one H₂O leaves (watch it fly) → N-substituted glycosylamine. Rate explodes Arrhenius-style.',
    act: () => { setMode('grill'); jump(() => { Tpan = 200; water = 0; Tsurf = 146; stage = 'approach'; stageT = 0; }); } },
  { b: 'Amadori 重排:翻成酮糖胺', be: 'Amadori rearrangement: ketosamine',
    d: 'N-糖基胺不稳定:糖环开裂、羰基从 C1 搬到 C2,分子内翻折成酮糖胺——所有后续风味和颜色的总仓库。',
    de: 'Glycosylamine is unstable: the ring opens, the carbonyl migrates C1 → C2, flipping into a ketosamine — the warehouse for all flavor and color to follow.',
    act: () => { setMode('grill'); jump(() => { Tpan = 200; water = 0; Tsurf = 152; stage = 'amadori'; stageT = 0; }); } },
  { b: '裂解:爆出数百种小分子', be: 'Cracking: hundreds of small molecules',
    d: '酮糖胺碎裂成上百条路径:吡嗪=坚果香、呋喃=焦糖香、噻吩=肉香……煎烤香气就是它;有些路径还经过自由基链式反应。',
    de: 'The ketosamine shatters along hundreds of routes: pyrazines = nutty, furans = caramel, thiophenes = meaty… the smell of searing; some routes run via radical chains.',
    act: () => { setMode('grill'); jump(() => { Tpan = 210; water = 0; Tsurf = 162; browning = 0.12; stage = 'crack'; stageT = 0.5; }); } },
  { b: '聚合成类黑精:共轭=褐色', be: 'Melanoidins: conjugation = brown',
    d: '小分子头尾相接聚成类黑精长链:共轭双键越连越长,吸收带拓宽进可见光——表面先金黄后深褐(同款物理见「共轭与颜色」)。',
    de: 'Small products link into melanoidin polymers: conjugated chains grow, absorption broadens into the visible — golden first, then deep brown (see Conjugation & Color).',
    act: () => { setMode('grill'); jump(() => { Tpan = 220; water = 0; Tsurf = 170; browning = 0.62; }); } },
  { b: '对照:水煮 & 焦糖化', be: 'Contrasts: boiling & caramelization',
    d: '水煮:100 °C 封顶,永远褐变不了;焦糖化:没有氨基,糖自己走另一条路,要 ~160 °C 才启动——颜色像,化学不同。碱性(pH↑,小苏打)会加速美拉德。',
    de: 'Boiled: capped at 100 °C, browning never starts. Caramelization: no amino group — sugar alone, only above ~160 °C. Similar colors, different chemistry. Alkaline pH (baking soda) speeds Maillard.',
    act: () => { contrastFlip = !contrastFlip; setMode(contrastFlip ? 'caramel' : 'boil'); jump(() => { Tpan = 230; }); } },
];
function stepIndex() {
  if (mode !== 'grill') return 5;
  if (browning > 0.45) return 4;
  if (stage === 'crack') return 3;
  if (stage === 'amadori') return 2;
  if (stage === 'approach' || stage === 'condense') return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elTemp = document.getElementById('temp'), elTempVal = document.getElementById('tempVal');
const elW = document.getElementById('water0'), elWVal = document.getElementById('waterVal');
const elSpd = document.getElementById('spd'), elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels'), tglRotate = document.getElementById('tglRotate'),
  tglPH = document.getElementById('tglPH');
const stT = document.getElementById('stT'), stR = document.getElementById('stR'), stF = document.getElementById('stF'),
  stB = document.getElementById('stB'), stW = document.getElementById('stW');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function updateFormula() {
  const r = rate();
  if (mode === 'grill') {
    formulaEl.innerHTML = L(
      `<b>k = A·e^(−Ea/RT)</b>,Ea ≈ 100 kJ/mol → k_rel ≈ <b>×${r.toFixed(1)}</b>(140 °C 为 ×1)${pH ? ' · pH 9(小苏打)×3.5' : ''}<br>` +
      (water > 2
        ? `表面还湿(水分 ${water.toFixed(0)}%):蒸发吸热把温度钉在 ~100 °C —— 先风干,才上色`
        : `表面已干 → 羰基 + 氨基脱水缩合;类黑精聚合让表面金黄 → 深褐`),
      `<b>k = A·e^(−Ea/RT)</b>, Ea ≈ 100 kJ/mol → k_rel ≈ <b>×${r.toFixed(1)}</b> (140 °C = ×1)${pH ? ' · pH 9 (baking soda) ×3.5' : ''}<br>` +
      (water > 2
        ? `surface still wet (${water.toFixed(0)}%): evaporation pins it at ~100 °C — dry first, brown later`
        : `dry surface → carbonyl + amino condense; melanoidins take it golden → deep brown`));
  } else if (mode === 'boil') {
    formulaEl.innerHTML = L(
      `水浴封顶:相变吸热把表面钉在 <b>100 °C</b>,永远到不了 140 °C —— 水煮肉只会变灰,不会变褐<br>` +
      `碱性(pH↑)会加速美拉德:碱水面包/小苏打浸泡使表皮上色更快`,
      `A water bath is capped by phase change: the surface pins at <b>100 °C</b> and never reaches 140 °C — no browning, only grey<br>` +
      `Alkaline pH speeds Maillard: pretzel / baking-soda dips brown their crusts faster`);
  } else {
    formulaEl.innerHTML = L(
      `焦糖化:<b>没有氨基</b> —— 糖自己脱水、裂解,约 <b>160 °C</b> 才明显启动;颜色像美拉德,化学是另一条路<br>` +
      `k_rel ≈ ×${r.toFixed(1)}(155 °C 为 ×1)`,
      `Caramelization: <b>no amino group</b> — sugar alone dehydrates and cracks, obvious only above ~<b>160 °C</b>; similar colors, different chemistry<br>` +
      `k_rel ≈ ×${r.toFixed(1)} (155 °C = ×1)`);
  }
}
function setMode(m) {
  mode = m;
  document.getElementById('btnGrill').classList.toggle('on', m === 'grill');
  document.getElementById('btnBoil').classList.toggle('on', m === 'boil');
  document.getElementById('btnCaramel').classList.toggle('on', m === 'caramel');
  resetState();
  refreshLabels();
  updateFormula();
}
elTemp.addEventListener('input', () => { Tpan = +elTemp.value; elTempVal.textContent = Tpan + ' °C'; });
elW.addEventListener('input', () => { water0 = +elW.value; water = water0; elWVal.textContent = water0 + ' %'; });
elSpd.addEventListener('input', () => { speed = +elSpd.value; elSpdVal.textContent = speed.toFixed(1) + '×'; });
tglPH.addEventListener('change', () => { pH = tglPH.checked; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
document.getElementById('btnGrill').addEventListener('click', () => setMode('grill'));
document.getElementById('btnBoil').addEventListener('click', () => setMode('boil'));
document.getElementById('btnCaramel').addEventListener('click', () => setMode('caramel'));
document.getElementById('btnReset').addEventListener('click', () => { resetState(); snapVisuals(); });
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    physStep(dts);
    if (water > 1 && Tsurf > 96) {
      steamAcc += dts * (1.4 + Math.max(0, Tpan - 80) * 0.018);
      while (steamAcc >= 1) { steamAcc -= 1; spawnSteam(); }
    }
  }
  while (pending.length) doBurst(pending.shift());
  pan.material.emissiveIntensity = clamp((Tpan - 90) / 160, 0, 1) * 0.45;
  crustColor();
  filmSync();
  applyVignette(dt);
  updateParticles(dt);
  updateMel();
  stT.textContent = Tsurf.toFixed(1) + ' °C';
  stT.className = 'v' + (Tsurf >= 140 ? ' hot' : '');
  statAcc += dt;
  if (statAcc > 0.25) {
    statAcc = 0;
    updateFormula();
    stR.innerHTML = '×' + rate().toFixed(1);
    stF.textContent = flavorN;
    stB.textContent = Math.round(browning * 100) + ' %';
    stW.textContent = Math.round(water) + ' %';
  }
  for (const r of labelReg) if (labelsOn && r.vis() && !r.span) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
elTemp.value = Tpan; elTempVal.textContent = Tpan + ' °C';
elW.value = water0; elWVal.textContent = water0 + ' %';
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
Tpan = clamp(qsFloat('temp', Tpan), 25, 250);
water0 = clamp(qsFloat('water', water0), 0, 100);
elTemp.value = Tpan; elTempVal.textContent = Tpan + ' °C';
elW.value = water0; elWVal.textContent = water0 + ' %';
const QMODE = qs.get('mode');
setMode(QMODE === 'boil' || QMODE === 'caramel' ? QMODE : 'grill');
instantSim(clamp(qsFloat('t', 0), 0, 600));
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
