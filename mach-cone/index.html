<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声爆与马赫锥 · 先看见,后听见</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="声爆与马赫锥" data-en="Sonic Boom &amp; the Mach Cone">声爆与马赫锥</h1>
  <div class="sub" data-zh="飞机追上自己的声音会怎样:亚音速时声波跑在前面,人先听见引擎再看见飞机;M=1 时波前在机头堆成一道墙——音障;M&gt;1 后无数波前包络出半角 μ=arcsin(1/M) 的马赫锥——锥面扫过哪里,哪里就是一声「砰」;越快锥越窄:先看见、后听见 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="What happens when a jet catches up with its own sound: subsonic, the waves run ahead — you hear the engine before you see the plane; at M=1 the wavefronts pile up at the nose into a wall — the sound barrier; past M&gt;1 they envelope into a Mach cone of half-angle μ=arcsin(1/M) — wherever the cone sweeps, there goes a bang; the faster, the narrower the cone: see first, hear later · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">声爆与马赫锥</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="马赫数 M" data-en="Mach number M">马赫数 M</span><span class="v" id="stM">—</span>
  <span class="k" data-zh="真空速 v" data-en="True airspeed v">真空速 v</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="马赫角 μ" data-en="Mach angle μ">马赫角 μ</span><span class="v warn" id="stMu">—</span>
  <span class="k" data-zh="飞临→听见延迟" data-en="Flyby→hear delay">飞临→听见延迟</span><span class="v ok" id="stD">—</span>
</div>

<div id="plot">
  <h3 data-zh="观察员时间线(12 s 窗口)· ▲ 飞临 · ● 听见 · 红色 N 形=声爆" data-en="Observer timeline (12 s window) · ▲ flyby · ● heard · red N = boom">观察员时间线</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="蓝=声波波前(球面)" data-en="blue = sound wavefronts (spherical)">蓝=声波波前(球面)</span>
    <span class="chip.r" data-zh="红=地面观察员" data-en="red = ground observer">红=地面观察员</span>
    <span class="chip.b" data-zh="锥=马赫锥包络" data-en="cone = Mach-cone envelope">锥=马赫锥包络</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnM05" data-zh="亚音速 M=0.5" data-en="Subsonic M=0.5">亚音速 M=0.5</button>
    <button class="abtn" id="btnM098" data-zh="逼近音障 M=0.98" data-en="Near barrier M=0.98">逼近音障 M=0.98</button>
    <button class="abtn" id="btnM14" data-zh="超音速 M=1.4" data-en="Supersonic M=1.4">超音速 M=1.4</button>
    <button class="abtn" id="btnM18" data-zh="快速 M=1.8" data-en="Fast M=1.8">快速 M=1.8</button>
    <button class="abtn" id="btnObs" data-zh="复位观察员" data-en="Reset observer">复位观察员</button>
  </div>
  <div class="row"><label data-zh="马赫数 M" data-en="Mach number M">马赫数 M</label><input id="mach" type="range" min="0.3" max="2" step="0.01" value="1.4"><span class="val" id="machVal">1.40</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../doppler-effect/" data-zh="亚音速版:多普勒效应" data-en="subsonic twin: the Doppler effect">亚音速版:多普勒效应</a>
    <a href="../jet-engine/" data-zh="把它推过音速:喷气发动机" data-en="what pushes it through: the jet engine">把它推过音速:喷气发动机</a>
    <a href="../lightning/" data-zh="自然界的巨响:闪电雷声" data-en="nature's boom: thunder">自然界的巨响:闪电雷声</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x18243a, 90, 320);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
  scene.fog.color = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('声爆与马赫锥 · 先看见,后听见', 'Sonic Boom & the Mach Cone · See First, Hear Later');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
  drawPlot();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);
camera.position.set(-10, 8.5, 21);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-3, -0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 110;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 12, 8);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 物理常数 / 状态 ================= */
const C0 = 3;               // 场景声速(单位/s),对应真实 340 m/s
const C_REAL = 340;         // m/s,海平面声速
const EMIT_DT = 0.18;       // 每 0.18 s 发射一个波前
const SHELL_MAX = 48;       // 最多 48 个波前
const SHELL_RMAX = 34;      // 半径超过 ~34 移除
const NOSE_X = 1.45;        // 机头位置(飞机固定在原点参考系)
const Z_OBS = 13;           // 观察员侧向距离
const X_START = 36, X_WRAP = -70, X_RESPAWN = 70;

let mach = clamp(qsFloat('m', 1.4), 0.3, 2);
let tSim = 0, tGlob = 0, emitAcc = 0, pillarOff = 0;
let obsId = 0, firstHeardT = null, abeamT = null, prevOx = X_START;
let boomT = -99, seeT = -99;
const events = [];          // {t, k: 0 飞临 | 1 听见 | 2 声爆}

/* ================= 几何布置 ================= */
const ground = new THREE.Mesh(new THREE.BoxGeometry(320, 0.4, 130),
  mat(0x39414d, { opacity: 1, roughness: 0.92, metalness: 0.04 }));
ground.position.y = -2.4;
scene.add(ground);

/* 两排细立柱标记物:整组随速度后移,按间距循环回绕 */
const pillarGroup = new THREE.Group();
scene.add(pillarGroup);
const P_GAP = 9, P_PER = 18, P_ROWS = 2;
const pilIM = new THREE.InstancedMesh(new THREE.BoxGeometry(0.12, 1.3, 0.12),
  new THREE.MeshStandardMaterial({ roughness: 0.7, metalness: 0.1 }), P_ROWS * P_PER);
pillarGroup.add(pilIM);
const dummy = new THREE.Object3D();
const _c = new THREE.Color();
{
  let k = 0;
  for (let r = 0; r < P_ROWS; r++) for (let i = 0; i < P_PER; i++) {
    dummy.position.set(-81 + i * P_GAP, -1.55, r === 0 ? -6.5 : 6.5);
    dummy.updateMatrix();
    pilIM.setMatrixAt(k, dummy.matrix);
    pilIM.setColorAt(k, _c.set(i % 5 === 0 ? 0xffa94d : 0x8a94a6));
    k++;
  }
  pilIM.instanceMatrix.needsUpdate = true;
  pilIM.instanceColor.needsUpdate = true;
}

/* 喷气机:机身 + 三角翼 + 尾翼,机头朝 +x,固定在原点 */
const jet = new THREE.Group();
{
  const body = mat(0x9aa7b8, { opacity: 1, roughness: 0.32, metalness: 0.65 });
  const fus = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 2.6, 6, 16), body);
  fus.rotation.z = Math.PI / 2;
  fus.position.x = -0.15;
  jet.add(fus);
  const canopy = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.62, 4, 10),
    mat(0x1d2c3d, { opacity: 1, roughness: 0.12, metalness: 0.4 }));
  canopy.rotation.z = Math.PI / 2;
  canopy.position.set(0.55, 0.3, 0);
  jet.add(canopy);
  const wshape = new THREE.Shape();
  wshape.moveTo(0.8, 1.7); wshape.lineTo(0.8, -1.7); wshape.lineTo(-1.25, 0); wshape.closePath();
  const wingGeo = new THREE.ShapeGeometry(wshape);
  wingGeo.rotateX(-Math.PI / 2);
  const wing = new THREE.Mesh(wingGeo, mat(0x8794a6, { opacity: 1, roughness: 0.4, metalness: 0.55, side: THREE.DoubleSide }));
  wing.position.y = -0.02;
  jet.add(wing);
  const tshape = new THREE.Shape();
  tshape.moveTo(-0.95, 0); tshape.lineTo(-1.8, 0); tshape.lineTo(-1.45, 0.62); tshape.closePath();
  const fin = new THREE.Mesh(new THREE.ShapeGeometry(tshape), mat(0xc0392b, { opacity: 1, roughness: 0.4, metalness: 0.4, side: THREE.DoubleSide }));
  fin.position.y = 0.12;
  jet.add(fin);
  const sshape = new THREE.Shape();
  sshape.moveTo(-1.15, 0.72); sshape.lineTo(-1.15, -0.72); sshape.lineTo(-1.62, 0); sshape.closePath();
  const stagGeo = new THREE.ShapeGeometry(sshape);
  stagGeo.rotateX(-Math.PI / 2);
  const stag = new THREE.Mesh(stagGeo, mat(0x8794a6, { opacity: 1, roughness: 0.4, metalness: 0.55, side: THREE.DoubleSide }));
  stag.position.y = 0.05;
  jet.add(stag);
  const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 0.62, 14),
    mat(0x4a5568, { opacity: 1, roughness: 0.35, metalness: 0.7 }));
  eng.rotation.z = Math.PI / 2;
  eng.position.set(-1.05, -0.28, 0);
  jet.add(eng);
}
scene.add(jet);

/* 马赫锥引导线:顶点在机头、向 −x 张开的半透明圆锥 */
const coneGeo = new THREE.ConeGeometry(1, 1, 48, 1, true);
coneGeo.translate(0, -0.5, 0);
const cone = new THREE.Mesh(coneGeo, new THREE.MeshBasicMaterial({
  color: 0x7ec8ff, transparent: true, opacity: 0.07, side: THREE.FrontSide, depthWrite: false }));
cone.rotation.z = -Math.PI / 2;
cone.position.set(NOSE_X, 0, 0);
cone.renderOrder = 2;
scene.add(cone);
function updateCone() {
  const sup = mach > 1.02;
  cone.visible = sup;
  if (sup) {
    const mu = Math.asin(1 / mach), len = 34;
    cone.scale.set(len, len * Math.tan(mu), len * Math.tan(mu));
    /* 锥越宽越淡,避免大迎角时整屏泛白 */
    cone.material.opacity = clamp(0.10 * Math.tan(mu) ** -0.7, 0.02, 0.1);
  }
}

/* 声波波前:球面壳池(循环复用) */
const shellGeo = new THREE.SphereGeometry(1, 24, 16);
const shells = [];
for (let i = 0; i < SHELL_MAX; i++) {
  const m = new THREE.Mesh(shellGeo, new THREE.MeshBasicMaterial({
    color: 0x7ec8ff, transparent: true, opacity: 0.3, depthWrite: false }));
  m.visible = false;
  m.renderOrder = 1;
  scene.add(m);
  shells.push({ m, on: false, t0: 0, x0: NOSE_X, v0: 0, heard: -1 });
}
let shellPtr = 0;
function emitShell() {
  const s = shells[shellPtr];
  shellPtr = (shellPtr + 1) % SHELL_MAX;
  s.on = true; s.t0 = tSim; s.x0 = NOSE_X; s.v0 = mach * C0; s.heard = -1;
  s.m.visible = true;
}

/* 地面观察员:小房子 + 旗杆,以 v 向 −x 移动 */
const obs = new THREE.Group();
scene.add(obs);
{
  const house = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.6, 0.8),
    mat(0xd8b28f, { opacity: 1, roughness: 0.85, metalness: 0 }));
  house.position.y = -1.9;
  obs.add(house);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.72, 0.5, 4), mat(0xb0563f, { opacity: 1, roughness: 0.7, metalness: 0.05 }));
  roof.position.y = -1.35;
  roof.rotation.y = Math.PI / 4;
  obs.add(roof);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.25, 8), mat(0x9aa3ad, { opacity: 1, roughness: 0.5, metalness: 0.4 }));
  pole.position.y = -0.5;
  obs.add(pole);
}
const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.27),
  new THREE.MeshBasicMaterial({ color: 0xff6b6b, side: THREE.DoubleSide }));
flag.position.set(0.24, -0.14, 0);
obs.add(flag);
const ringGeo = new THREE.TorusGeometry(0.6, 0.05, 8, 40);
const boomRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffa94d, transparent: true, opacity: 0, depthWrite: false }));
boomRing.rotation.x = Math.PI / 2;
boomRing.position.y = -1.35;
obs.add(boomRing);
const seeRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffd43b, transparent: true, opacity: 0, depthWrite: false }));
seeRing.rotation.x = Math.PI / 2;
seeRing.position.y = -1.35;
seeRing.scale.setScalar(0.6);
obs.add(seeRing);
function spawnObserver(x) {
  obs.position.x = x;
  prevOx = x;
  obsId++;
  firstHeardT = null;
  abeamT = null;
}
obs.position.set(X_START, 0, Z_OBS);

/* ---------------- 场景标签 ---------------- */
const labelReg = [];
let labelsOn = true;
function addLabel(textFn, pos, cls = '', vis = () => true, parent = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  parent.add(o);
  labelReg.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return o;
}
function refreshLabels() {
  for (const r of labelReg) r.o.visible = labelsOn && r.vis();
}
addLabel(() => L('机头:波前源 · 每 0.18 s 一发', 'nose: wavefront source · one every 0.18 s'),
  new THREE.Vector3(NOSE_X, 1.0, 0), 'b');
addLabel(() => L('音障:波前在机头堆成墙', 'sound barrier: wavefronts pile into a wall'),
  new THREE.Vector3(NOSE_X - 0.3, 1.8, 0), 'o', () => mach >= 0.94 && mach <= 1.03);
addLabel(() => L(`马赫锥 μ = ${(Math.asin(1 / mach) * 180 / Math.PI).toFixed(1)}°`, `Mach cone μ = ${(Math.asin(1 / mach) * 180 / Math.PI).toFixed(1)}°`),
  new THREE.Vector3(NOSE_X - 13, 0.4, 12.4), 'b', () => mach > 1.02);
addLabel(() => L('地面观察员', 'ground observer') + (tSim - boomT < 1.2 ? ' 💥' : ''),
  new THREE.Vector3(0, 0.55, 0), 'r', () => true, obs);
addLabel(() => tSim - boomT < 1.4 ? L('💥 听见声爆!', '💥 boom!') : '',
  new THREE.Vector3(0, 1.7, 0), 'o', () => true, obs);
addLabel(() => tSim - seeT < 1.2 ? L('👁 飞临(看见)', '👁 flyby (seen)') : '',
  new THREE.Vector3(0, 2.5, 0), 'g', () => true, obs);

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '亚音速:声音跑在前面', be: 'Subsonic: sound runs ahead',
    d: '波前一个比一个大、球心随飞机后退,但每个都能冲到飞机前面;地面的人先听见轰鸣再看见飞机,接近时音调还因多普勒升高。',
    de: 'Each wavefront grows while its centre drifts back with the jet, yet every one still outruns the aircraft; people on the ground hear the roar before they see it, and the pitch rises (Doppler) on approach.',
    act: () => { applyMach(0.5); } },
  { b: '音障:波前堆在机头', be: 'The sound barrier',
    d: 'M→1,飞机几乎与自己的波前并排,无数波前在机头叠加成「墙」;1947 年 Bell X-1 穿过的就是它。',

  { b: '先看见,后听见', be: 'See first, hear later',
    d: '观察员只有被锥面扫过才听到声音;闪光(光)即刻到,巨响等锥到——超音速飞机悄悄临头,boom 在头顶才炸响。',
    de: 'You only hear the jet when the cone sweeps over you; the flash of light is instant, the boom waits for the cone — a supersonic jet arrives in silence and the bang explodes overhead.',
    act: () => { applyMach(1.4); spawnObserver(X_START); } },
  { b: '越快,锥越窄', be: 'Faster = narrower',
    d: 'M=1.2→μ=56°,M=2→30°;声爆不止正下方,锥扫过的整条「boom carpet」都挨炸。',
    de: 'M=1.2 → μ=56°, M=2 → 30°. The boom is not just directly below: the entire strip the cone sweeps — the "boom carpet" — gets hit.',
    act: () => { applyMach(1.8); } },
  { b: '现实中的声爆', be: 'Booms in the wild',
    d: '鞭梢突破音速的「啪」是最小的马赫锥;协和号与战机禁在陆上超音速,因为 N 形双压跳能震碎玻璃。',
    de: 'The crack of a whip tip breaking the sound barrier is the tiniest Mach cone; Concorde and fighters are banned from supersonic flight over land because the N-shaped double pressure jump can shatter glass.',
    act: () => { applyMach(1.6); spawnObserver(X_START); } },
];
let stepOverride = -1;
function stepIndex() {
  if (stepOverride >= 0) return stepOverride;
  if (mach < 0.9) return 0;
  if (mach <= 1.02) return 1;
  if (mach < 1.3) return 2;
  if (mach <= 1.6) return 3;
  return 4;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { s.act(); stepOverride = i; syncSliders(); updateFormula(); });
    el.appendChild(li);
  });
}

/* ================= 曲线图:观察员时间线 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const pad = 16, W2 = W - pad * 2;
  const xOf = t => pad + (1 - (tSim - t) / 12) * W2;
  const yA = H * 0.30, yB = H * 0.62;
  ctx.strokeStyle = 'rgba(128,150,170,.28)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad, yA); ctx.lineTo(W - pad, yA);
  ctx.moveTo(pad, yB); ctx.lineTo(W - pad, yB);
  ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '14px system-ui';
  ctx.fillText(L('▲ 飞临', '▲ flyby'), pad, yA - 12);
  ctx.fillText(L('● 听见', '● heard'), pad, yB - 12);
  for (const [tt, lab] of [[tSim, L('现在', 'now')], [tSim - 6, '−6 s'], [tSim - 12, '−12 s']]) {
    ctx.fillText(lab, clamp(xOf(tt) - 14, pad, W - pad - 44), H - 6);
  }
  for (const e of events) {
    if (e.t < tSim - 12) continue;
    const x = xOf(e.t);
    if (e.k === 0) {
      ctx.fillStyle = '#ffd43b';
      ctx.beginPath();
      ctx.moveTo(x, yA - 10); ctx.lineTo(x - 7, yA + 6); ctx.lineTo(x + 7, yA + 6);
      ctx.closePath(); ctx.fill();
    } else if (e.k === 1) {
      ctx.fillStyle = '#7ec8ff';
      ctx.beginPath(); ctx.arc(x, yB, 4.5, 0, Math.PI * 2); ctx.fill();
    } else {
      const wpx = 0.4 / 12 * W2, amp = H * 0.17;
      ctx.strokeStyle = '#ff8787'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, yB); ctx.lineTo(x, yB - amp);
      ctx.lineTo(x + wpx, yB + amp * 0.8); ctx.lineTo(x + wpx, yB);
      ctx.stroke();
      ctx.fillStyle = '#ff8787';
      ctx.beginPath(); ctx.arc(x + wpx / 2, yB, 6, 0, Math.PI * 2); ctx.fill();
    }
  }
}

/* ================= 状态 / 动作 ================= */
function applyMach(m) {
  mach = clamp(m, 0.3, 2);
  stepOverride = -1;
  updateCone();
  markPreset();
}
function markPreset() {
  const ids = [['btnM05', 0.5], ['btnM098', 0.98], ['btnM14', 1.4], ['btnM18', 1.8]];
  for (const [id, val] of ids) {
    document.getElementById(id).classList.toggle('on', Math.abs(mach - val) < 0.005);
  }
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elMach = document.getElementById('mach'), elMachVal = document.getElementById('machVal');
const stM = document.getElementById('stM'), stV = document.getElementById('stV'),
  stMu = document.getElementById('stMu'), stD = document.getElementById('stD');
const formulaEl = document.getElementById('formula');
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let spinOn = qsBool('spin', true);
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncSliders() {
  elMach.value = mach;
  elMachVal.textContent = mach.toFixed(2);
}
function updateFormula() {
  const vr = mach * C_REAL;
  const sup = mach > 1.02;
  const mu = sup ? (Math.asin(1 / mach) * 180 / Math.PI).toFixed(1) + '°' : '—(M≤1)';
  let d = '—';
  if (firstHeardT !== null && abeamT !== null) {
    const dv = firstHeardT - abeamT;
    d = (dv >= 0 ? '+' : '−') + Math.abs(dv).toFixed(1) + ' s';
  }
  formulaEl.innerHTML = L(
    `v = M·c₀ = ${mach.toFixed(2)}×340 = <b>${vr.toFixed(0)} m/s</b>(${(vr * 3.6).toFixed(0)} km/h) · μ = arcsin(1/M) = <b>${mu}</b><br>` +
    `波前 0.18 s 一发:r = c·τ,球心 x = x₀ − v·τ · 延迟 Δt = t听 − t临 = <b>${d}</b>` + (d.startsWith('−') ? L('(先听见)', '(heard first)') : ''),
    `v = M·c₀ = ${mach.toFixed(2)}×340 = <b>${vr.toFixed(0)} m/s</b> (${(vr * 3.6).toFixed(0)} km/h) · μ = arcsin(1/M) = <b>${mu}</b><br>` +
    `one wavefront every 0.18 s: r = c·τ, centre x = x₀ − v·τ · delay Δt = t hear − t flyby = <b>${d}</b>` + (d.startsWith('−') ? ' (heard first)' : ''));
}
document.getElementById('btnM05').addEventListener('click', () => { applyMach(0.5); syncSliders(); updateFormula(); });
document.getElementById('btnM098').addEventListener('click', () => { applyMach(0.98); syncSliders(); updateFormula(); });
document.getElementById('btnM14').addEventListener('click', () => { applyMach(1.4); syncSliders(); updateFormula(); });
document.getElementById('btnM18').addEventListener('click', () => { applyMach(1.8); syncSliders(); updateFormula(); });
document.getElementById('btnObs').addEventListener('click', () => { spawnObserver(X_START); });
elMach.addEventListener('input', () => { applyMach(+elMach.value); syncSliders(); updateFormula(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = spinOn;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
function animRing(ring, age) {
  if (age >= 0 && age < 0.9) {
    ring.material.opacity = 0.85 * (1 - age / 0.9);
    ring.scale.setScalar(0.6 + age * 4);
  } else {
    ring.material.opacity = 0;
  }
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0);
  tGlob += dt0;
  if (dt > 0) {
    tSim += dt;
    const v = mach * C0;
    emitAcc += dt;
    while (emitAcc >= EMIT_DT) { emitAcc -= EMIT_DT; emitShell(); }
    /* 观察员后退,出界回绕成新观察员 */
    const nx = obs.position.x - v * dt;
    if (nx <= X_WRAP) {
      spawnObserver(X_RESPAWN);
    } else {
      if (prevOx > 0 && nx <= 0) {
        abeamT = tSim; seeT = tSim;
        events.push({ t: tSim, k: 0 });
      }
      obs.position.x = nx;
      prevOx = nx;
    }
    /* 波前:球心以 v 后退、半径 c·τ,触到观察员 → 听见 */
    const ox = obs.position.x;
    for (const s of shells) {
      if (!s.on) continue;
      const tau = tSim - s.t0, r = C0 * tau;
      if (r > SHELL_RMAX) { s.on = false; s.m.visible = false; continue; }
      s.m.position.set(s.x0 - s.v0 * tau, 0, 0);
      s.m.scale.setScalar(r);
      s.m.material.opacity = clamp(0.11 * (1 - r / SHELL_RMAX) + 0.012, 0.012, 0.12);
      if (s.heard !== obsId && r >= Math.hypot(s.m.position.x - ox, Z_OBS)) {
        s.heard = obsId;
        const boom = firstHeardT === null;
        if (boom) { firstHeardT = tSim; boomT = tSim; }
        events.push({ t: tSim, k: boom ? 2 : 1 });
        if (events.length > 240) events.shift();
      }
    }
    while (events.length && events[0].t < tSim - 13) events.shift();
    /* 立柱与观察员同速后退,按间距回绕 */
    pillarOff -= v * dt;
    if (pillarOff < -P_GAP) pillarOff += P_GAP;
    pillarGroup.position.x = pillarOff;
  }
  /* 观察员闪光圆环(用真实时间,暂停也能收尾) */
  animRing(boomRing, (tSim - boomT) * (playing ? speed : 1));
  animRing(seeRing, (tSim - seeT) * (playing ? speed : 1));
  flag.rotation.y = Math.sin(tGlob * 5) * 0.3;
  jet.position.y = Math.sin(tGlob * 1.7) * 0.04;
  jet.rotation.z = Math.sin(tGlob * 1.2) * 0.008;
  statsAcc += dt0;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stM.textContent = mach.toFixed(2);
    const vr = mach * C_REAL;
    stV.innerHTML = vr.toFixed(0) + ' m/s <small>' + (vr * 3.6).toFixed(0) + ' km/h</small>';
    stMu.textContent = mach > 1 ? (Math.asin(1 / mach) * 180 / Math.PI).toFixed(1) + '°' : '—';
    stMu.className = 'v ' + (mach > 1 ? 'warn' : '');
    if (firstHeardT !== null && abeamT !== null) {
      const d = firstHeardT - abeamT;
      stD.textContent = (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1) + ' s' + (d < 0 ? L(' · 先听见', ' · heard first') : '');
      stD.className = 'v ' + (d < 0 ? 'warn' : 'ok');
    } else {
      stD.textContent = '—';
      stD.className = 'v';
    }
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
spawnObserver(X_START);
updateCone();
syncSliders();
markPreset();
setPlayLabel();
buildSteps();
applyTheme();
applyLang();
start();
</script>
