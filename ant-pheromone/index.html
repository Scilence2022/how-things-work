<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>蚂蚁信息素与群体寻路 · 沉积加蒸发,群体走出最短路</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#f08c00;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,140,0,.6);background:rgba(255,140,0,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,140,0,.10);border-color:rgba(255,140,0,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe8cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="蚂蚁信息素与群体寻路" data-en="Ant Pheromones & Swarm Pathfinding">蚂蚁信息素与群体寻路</h1>
  <div class="sub" data-zh="每只蚂蚁只管沿信息素浓的方向走、走过就留痕:沉积加蒸发这道简单算式让蚁群在没有指挥的情况下收敛出最短路径——信息素本身就是写在地面上的群体记忆 · 拖动旋转 / 空格运行/暂停" data-en="Each ant just follows the strongest pheromone scent and leaves some behind: deposit plus evaporation is the whole algorithm, and the colony converges on the shortest path with no manager — the trail is the group's memory written on the ground · drag to orbit / Space = run/pause">每只蚂蚁只管沿信息素浓的方向走、走过就留痕:沉积加蒸发这道简单算式让蚁群在没有指挥的情况下收敛出最短路径——信息素本身就是写在地面上的群体记忆 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="信息素峰值" data-en="Pheromone peak">信息素峰值</span><span class="v" id="stPeak">—</span>
  <span class="k" data-zh="在途蚂蚁" data-en="Ants en route">在途蚂蚁</span><span class="v" id="stAnts">—</span>
  <span class="k" data-zh="短径占比" data-en="Short-bridge share">短径占比</span><span class="v" id="stShare">—</span>
  <span class="k" data-zh="运回食物" data-en="Food delivered">运回食物</span><span class="v" id="stFood">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bBridge" data-zh="双桥对照" data-en="Two bridges">双桥对照</button>
    <button class="abtn" id="bWall" data-zh="落下障碍改道" data-en="Drop a wall">落下障碍改道</button>
    <button class="abtn" id="bNoPh" data-zh="关信息素对照" data-en="No pheromone">关信息素对照</button>
  </div>
  <div class="row">
    <label data-zh="蚂蚁数" data-en="Ants">蚂蚁数</label>
    <input id="sN" type="range" min="50" max="400" step="10" value="200">
    <span class="val" id="sNVal">200</span>
  </div>
  <div class="row">
    <label data-zh="蒸发率" data-en="Evaporation">蒸发率</label>
    <input id="sEvap" type="range" min="0.05" max="2" step="0.05" value="0.5">
    <span class="val" id="sEvapVal">0.50 /s</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglHeat" type="checkbox" checked> <span data-zh="信息素热场" data-en="Heat map">信息素热场</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../waggle-dance/" data-zh="蜜蜂摇摆舞" data-en="The Waggle Dance">蜜蜂摇摆舞</a>
    <a href="../boids-flocking/" data-zh="鸟群与Boids" data-en="Boids & Flocking">鸟群与Boids</a>
    <a href="../shortest-path/" data-zh="最短路径" data-en="Shortest Path">最短路径</a>
    <a href="../predator-prey/" data-zh="捕食者与猎物" data-en="Predator & Prey">捕食者与猎物</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,60);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0,11,9.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,12,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面(沙地) ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x2a2620,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ---- 巢与食物 ---- */
const NEST=new THREE.Vector2(-5.5,0),FOOD=new THREE.Vector2(5.5,0);
const nestM=new THREE.MeshStandardMaterial({color:0x6b4f35,roughness:0.9});
const nest=new THREE.Mesh(new THREE.SphereGeometry(0.75,20,14),nestM);
nest.scale.y=0.5;nest.position.set(NEST.x,0.15,NEST.y);scene.add(nest);
const foodM=new THREE.MeshStandardMaterial({color:0x74c94f,roughness:0.6});
const food=new THREE.Mesh(new THREE.IcosahedronGeometry(0.55,1),foodM);
food.position.set(FOOD.x,0.35,FOOD.y);scene.add(food);

/* ---- 信息素热场:地面网格着色 ---- */
const GN=44;
const pher=new Float32Array(GN*GN);
const heatGeo=new THREE.PlaneGeometry(24,18,GN-1,GN-1);
const heatM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.5,
  vertexColors:true,depthWrite:false});
const heat=new THREE.Mesh(heatGeo,heatM);
heat.rotation.x=-Math.PI/2;heat.position.y=0.02;heat.visible=true;scene.add(heat);
/* 顶点色缓冲需手动补建(PlaneGeometry 默认无 color 属性) */
heatGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(heatGeo.attributes.position.count*3),3));
const heatCol=new THREE.Color();
function cellOf(x,z){
  const i=clamp(Math.round((z+9)/18*(GN-1)),0,GN-1);
  const j=clamp(Math.round((x+12)/24*(GN-1)),0,GN-1);
  return i*GN+j;
}
function pherAt(x,z){return pher[cellOf(x,z)];}
function deposit(x,z,amt){
  const c=cellOf(x,z);
  pher[c]=Math.min(pher[c]+amt,6);
  /* 扩散半格 */
  const i=Math.floor(c/GN),j=c%GN;
  for(const [di,dj] of [[0,1],[0,-1],[1,0],[-1,0]]){
    const ii=i+di,jj=j+dj;
    if(ii>=0&&ii<GN&&jj>=0&&jj<GN){
      const cc=ii*GN+jj;
      pher[cc]=Math.min(pher[cc]+amt*0.25,6);
    }
  }
}
function updateHeat(){
  const pos=heatGeo.attributes.position;
  const colA=heatGeo.attributes.color;
  for(let k=0;k<GN*GN;k++){
    const v=pher[k]/6;
    if(v>0.02){heatCol.setHSL(0.08-v*0.06,0.9,0.5*v+0.08);}
    else heatCol.setRGB(0,0,0);
    colA.setXYZ(k,heatCol.r,heatCol.g,heatCol.b);
  }
  colA.needsUpdate=true;
}

/* ---- 桥(双桥对照:短桥与长桥) & 障碍 ---- */
const bridgeM=new THREE.MeshStandardMaterial({color:0x7a6a52,roughness:0.85});
let wall=null;
function buildBridges(){
  for(const b of bridgeGroup)b.visible=false;
  bridgeGroup.length=0;
  /* 短桥:横跨中央 */
  const b1=new THREE.Mesh(new THREE.BoxGeometry(3.2,0.12,0.5),bridgeM);
  b1.position.set(0,0.35,0);scene.add(b1);bridgeGroup.push(b1);
  /* 长桥:绕外侧 */
  const b2=new THREE.Mesh(new THREE.BoxGeometry(5.6,0.12,0.5),bridgeM);
  b2.position.set(0,0.2,3.2);b2.rotation.y=0;scene.add(b2);bridgeGroup.push(b2);
}
const bridgeGroup=[];
buildBridges();
function dropWall(){
  if(wall){scene.remove(wall);wall=null;return false;}
  wall=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.2,7),bridgeM);
  wall.position.set(0,0.6,0);scene.add(wall);
  return true;
}

/* ---- 蚂蚁群 ---- */
const MAXANTS=400;
const antM=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.5});
const antsIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.07,8,6),antM,MAXANTS);
antsIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
antsIM.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAXANTS*3),3);
scene.add(antsIM);
const m4=new THREE.Matrix4();
function newAnt(){
  return {x:NEST.x+(Math.random()-0.5),z:NEST.y+(Math.random()-0.5),
    dir:Math.random()*Math.PI*2,carrying:false,alive:true,t:0};
}
let antN=200,ants=[];
for(let i=0;i<MAXANTS;i++)ants.push(newAnt());
/* 路径利用率统计(短桥=|z|<0.9 的过桥蚂蚁) */
let shareCnt=0,shareTot=0,foodCnt=0;

/* ---- 状态 ---- */
let evap=0.5,noPh=false,playing=true,labelsOn=true,slowMo=false,heatOn=true,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('巢:一切从这团土丘出发','Nest: everything starts from this mound'),
  new THREE.Vector3(NEST.x,1.5,NEST.y),'o');
addLabel(()=>L('食物源:侦察蚁的圣杯','Food: the scouts\u0027 holy grail'),
  new THREE.Vector3(FOOD.x,1.5,FOOD.y),'g');
addLabel(()=>L('信息素=地面上的群体记忆:走过就留,随时间蒸发','Pheromone = the colony\u0027s memory: laid by feet, fading with time'),
  new THREE.Vector3(0,2.2,0),'y',()=>!noPh);
addLabel(()=>L('信息素已关闭:群体失忆,乱作一团','Pheromones off: the colony goes blind'),
  new THREE.Vector3(0,2.2,0),'r',()=>noPh);

/* ---- 控件 ---- */
function setN(v){antN=clamp(v|0,50,400);
  document.getElementById('sN').value=antN;
  document.getElementById('sNVal').textContent=antN;updateStats();}
function setEvap(v){evap=clamp(v,0.05,2);
  document.getElementById('sEvap').value=evap;
  document.getElementById('sEvapVal').textContent=evap.toFixed(2)+' /s';updateStats();}
function reset(){
  pher.fill(0);foodCnt=0;shareCnt=0;shareTot=0;
  for(const a of ants){a.x=NEST.x+(Math.random()-0.5);a.z=NEST.y+(Math.random()-0.5);a.carrying=false;a.dir=Math.random()*Math.PI*2;}
  if(wall){scene.remove(wall);wall=null;}
  updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'侦察蚁随机撒网,找不到路也很正常',en:'Scouts fan out randomly — lost ants are the plan',
  act(){reset();setN(80);setEvap(0.9);}},
 {zh:'发现食物:回巢沿途每一脚都在加固',en:'Food found: every step home reinforces the trail',
  act(){reset();setN(200);setEvap(0.5);}},
 {zh:'双桥对比:短径往返快,沉积密',en:'Two bridges: the short one rounds trips faster',
  act(){reset();setN(260);setEvap(0.4);}},
 {zh:'正反馈收敛:群体锁定短径',en:'Positive feedback: the colony locks the short bridge',
  act(){reset();setN(260);setEvap(0.3);}},
 {zh:'障碍落下:旧径断,蒸发清场,新径长出',en:'A wall drops: the old trail fades, a detour grows',
  act(){reset();setN(260);setEvap(0.8);dropWall();}},
 {zh:'无信息素对照:没有记忆就没有路径',en:'No-pheromone control: no memory, no path',
  act(){reset();setN(200);noPh=true;document.getElementById('bNoPh').classList.add('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  let pk=0;for(let k=0;k<GN*GN;k++)if(pher[k]>pk)pk=pher[k];
  document.getElementById('stPeak').innerHTML=pk.toFixed(2)+'<small> rel</small>';
  document.getElementById('stAnts').textContent=antN;
  const sv=document.getElementById('stShare');
  const sh=shareTot>0?shareCnt/shareTot:0.5;
  sv.innerHTML=(100*sh).toFixed(0)+'<small> %</small>';
  sv.className='v '+(sh>0.7?'ok':'');
  document.getElementById('stFood').textContent=foodCnt;
}

/* ---- 事件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bBridge').addEventListener('click',()=>reset());
document.getElementById('bWall').addEventListener('click',()=>{dropWall();});
document.getElementById('bNoPh').addEventListener('click',()=>{
  noPh=!noPh;
  document.getElementById('bNoPh').classList.toggle('on',noPh);
  if(noPh)pher.fill(0);
});
document.getElementById('sN').addEventListener('input',e=>setN(+e.target.value));
document.getElementById('sEvap').addEventListener('input',e=>setEvap(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglHeat').addEventListener('change',e=>{heatOn=e.target.checked;heat.visible=heatOn&&!noPh;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x2a2620:0xd6c9ae);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 蚂蚁行为 ---- */
function stepAnts(dt){
  const v=1.5;
  for(let i=0;i<antN;i++){
    const a=ants[i];
    /* 朝向:随信息素梯度偏转 + 随机游走;关信息素=纯随机 */
    let ax=Math.cos(a.dir),az=Math.sin(a.dir);
    if(!noPh){
      /* 采样三个方向的传感器 */
      let best=a.dir,bv=-1;
      for(const off of [-0.6,0,0.6]){
        const sx=a.x+Math.cos(a.dir+off)*0.55,sz=a.z+Math.sin(a.dir+off)*0.55;
        const val=pherAt(sx,sz);
        if(val>bv){bv=val;best=a.dir+off;}
      }
      const steer=(best-a.dir);
      a.dir+=clamp(steer,-3,3)*dt*4;
    }
    a.dir+=(Math.random()-0.5)*dt*6;
    /* 目标吸引:未携带→食物,携带→巢 */
    const tx=a.carrying?NEST.x:FOOD.x;
    const tz=a.carrying?NEST.y:FOOD.y;
    const dTot=Math.hypot(tx-a.x,tz-a.z);
    if(dTot<0.4){/* 到达 */
      a.carrying=!a.carrying;
      a.dir=Math.atan2(a.z-tz,a.x-tx)+Math.PI;
      if(a.carrying)foodCnt++;
      continue;
    }
    /* 目标方向权重随距离增强,防止永久漂移 */
    const gDir=Math.atan2(tz-a.z,tx-a.x);
    const wTarget=clamp(1.6-dTot/9,0.2,1.4);
    let da=gDir-a.dir;
    while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
    a.dir+=da*dt*wTarget*(noPh?2.2:1);
    /* 前进 */
    a.x+=Math.cos(a.dir)*v*dt;
    a.z+=Math.sin(a.dir)*v*dt;
    a.x=clamp(a.x,-11.5,11.5);a.z=clamp(a.z,-8.5,8.5);
    /* 墙碰撞 */
    if(wall&&Math.abs(a.x-wall.position.x)<0.42&&Math.abs(a.z)<3.6){
      a.x-=Math.cos(a.dir)*v*dt;a.z-=Math.sin(a.dir)*v*dt;
      a.dir+=Math.PI*(0.6+Math.random()*0.8);
    }
    /* 信息素沉积:携带食物回巢的蚂蚁留痕 */
    if(!noPh&&a.carrying)deposit(a.x,a.z,dt*3.2);
    /* 过桥统计 */
    if(Math.abs(a.x)<1.8&&Math.abs(a.z)<3.8){
      shareTot++;
      if(Math.abs(a.z)<0.9)shareCnt++;
    }
  }
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,heatT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 蒸发 */
  if(!noPh&&dts>0){
    const k=Math.exp(-evap*dts);
    for(let i=0;i<GN*GN;i++)pher[i]*=k;
  }
  /* 蚂蚁 */
  const sub=dts>0?Math.min(3,Math.ceil(dts/0.02)):1;
  for(let s=0;s<sub;s++)stepAnts(dts/sub);
  /* 蚂蚁渲染 */
  const cHome=new THREE.Color(0x222222),cLoad=new THREE.Color(0xffa94d);
  for(let i=0;i<MAXANTS;i++){
    if(i<antN){
      const a=ants[i];
      const hop=0.06+0.02*Math.sin(simT*22+i);
      m4.makeTranslation(a.x,hop,a.z);
      antsIM.setMatrixAt(i,m4);
      antsIM.setColorAt(i,a.carrying?cLoad:cHome);
    }else{
      m4.makeScale(0.001,0.001,0.001);antsIM.setMatrixAt(i,m4);
    }
  }
  antsIM.instanceMatrix.needsUpdate=true;
  antsIM.instanceColor.needsUpdate=true;
  /* 热场刷新节流 */
  heatT+=dt;
  if(heatT>0.2){heatT=0;updateHeat();}
  heat.visible=heatOn&&!noPh;
  /* 食物微缩(被搬走的感觉) */
  food.rotation.y+=dts*0.7;
  food.position.y=0.35+0.04*Math.sin(simT*2);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.2){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
