{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 神经生理注脚（真实量级）：
   - 双通道：Aδ 有髓纤维 ~5–30 m/s（快痛：尖锐、定位准，先到）；C 无髓纤维 ~0.5–2 m/s
     （慢痛：弥散、烧灼，迟到但绵长）。按 1 m 路程计：Aδ ≈ 0.07 s，C ≈ 1 s。
   - 闸门控制（Melzack & Wall, 1965）：背角胶状质(SG)相当于闸门——粗的 Aβ 触觉纤维
     激活抑制性中间神经元，把闸门半关（所以揉一揉能止痛）；细的伤害感受纤维把闸门冲开。
   - 下行抑制：中脑导水管周围灰质(PAG)→延髓→背角释放内啡肽（内源性阿片），
     抑制伤害性传递，闸门全关——应激镇痛与吗啡的原理。
   - 简化闸门模型（页内演示用）：开度 = clamp(1.35·伤害输入 − 0.6·Aβ − 1.15·下行, 0, 1)。
   - 闸门常开 → 痛觉过敏/慢性痛；闸门失效（如 CIPA 先天无痛）→ 感觉不到骨折烫伤，极其危险。 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const htmlEl=document.documentElement;
const Q=new URLSearchParams(location.search);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0c1016,30,80);
const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,0.1,200);
camera.position.set(-1,5,17);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.5,4.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=5;controls.maxDistance=50;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14181e,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,0.95);key.position.set(5,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 材质 ---- */
const skinM=new THREE.MeshStandardMaterial({color:0xe8b08a,roughness:0.7});
const cordM=new THREE.MeshStandardMaterial({color:0xd8c7b8,roughness:0.6});
const hornM=new THREE.MeshStandardMaterial({color:0xc9a892,roughness:0.6});
const myA=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xe67700,emissiveIntensity:0.45,roughness:0.4}); // Aδ 髓鞘
const axM=new THREE.MeshStandardMaterial({color:0xff8787,emissive:0xc92a2a,emissiveIntensity:0.5,roughness:0.4}); // C 轴突
const myB=new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1864ab,emissiveIntensity:0.45,roughness:0.4}); // Aβ
const inhM=new THREE.MeshStandardMaterial({color:0x69db7c,emissive:0x2f9e44,emissiveIntensity:0.25,roughness:0.4});
const brainM=new THREE.MeshStandardMaterial({color:0xd8b4c8,roughness:0.55});
const pagM=new THREE.MeshStandardMaterial({color:0x8ce99a,emissive:0x2f9e44,emissiveIntensity:0.15,roughness:0.4});
const doorM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xe8590c,emissiveIntensity:0.5,roughness:0.35});
const pAD=new THREE.MeshStandardMaterial({color:0xffe066,emissive:0xf08c00,emissiveIntensity:1.4});
const pC=new THREE.MeshStandardMaterial({color:0xff8787,emissive:0xc92a2a,emissiveIntensity:1.4});
const pB=new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1864ab,emissiveIntensity:1.4});
const pE=new THREE.MeshStandardMaterial({color:0x8ce99a,emissive:0x2f9e44,emissiveIntensity:1.4});

/* ---- 场景搭建 ---- */
/* 皮肤 */
const skin=new THREE.Mesh(new THREE.BoxGeometry(4.6,0.5,2.4),skinM);
skin.position.set(-6.3,7.0,0);scene.add(skin);
const hot=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.1,20),
  new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.9}));
hot.position.set(-7.4,7.3,0);scene.add(hot);
const rubDisc=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.1,20),
  new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1864ab,emissiveIntensity:0.15}));
rubDisc.position.set(-5.2,7.3,0);scene.add(rubDisc);

/* 脊髓与背角 */
const cord=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,2.6,20),cordM);
cord.rotation.x=Math.PI/2;cord.position.set(0.2,1.5,0);scene.add(cord);
const horn=new THREE.Mesh(new THREE.TorusGeometry(2.1,0.55,10,24,1.7),hornM);
horn.position.set(-0.4,0.4,0);horn.rotation.z=1.35;scene.add(horn);

/* 脑与 PAG */
const brain=new THREE.Mesh(new THREE.SphereGeometry(1.35,24,16),brainM);
brain.position.set(6.2,9.2,0);scene.add(brain);
const pag=new THREE.Mesh(new THREE.SphereGeometry(0.42,14,10),pagM);
pag.position.set(5.4,8.5,0);scene.add(pag);

/* 抑制性中间神经元（胶状质 SG） */
const inh=new THREE.Mesh(new THREE.SphereGeometry(0.36,14,10),inhM);
inh.position.set(1.3,3.3,0);scene.add(inh);
for(let i=0;i<4;i++){
  const a=i/4*Math.PI*2;
  const d=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.02,0.5,6),inhM);
  d.position.set(1.3+Math.cos(a)*0.4,3.3+Math.sin(a)*0.4,0);
  d.rotation.z=-a-Math.PI/2;scene.add(d);
}

/* 闸门（两扇门板 + 门框，装在上行通路入口） */
const gateG=new THREE.Group();gateG.position.set(0.15,3.05,0);scene.add(gateG);
const gateFrame=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.07,8,20,Math.PI),doorM);
gateG.add(gateFrame);
const door1=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.09,0.16),doorM);
const door2=door1.clone();
door1.position.x=-0.45;door2.position.x=0.45;
gateG.add(door1,door2);

/* ---- 纤维路径 ---- */
function crv(pts){return new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));}
const cAD=crv([[-7.4,6.9,0],[-6.6,4.9,0.35],[-4.2,3.9,0.15],[-1.8,3.25,0],[-0.35,3.0,0]]);
const cC =crv([[-7.4,6.9,0],[-6.4,4.6,-0.45],[-4.0,3.7,-0.4],[-1.6,3.05,-0.25],[-0.1,2.95,0]]);
const cAB=crv([[-5.2,6.9,0],[-4.6,5.3,0.55],[-2.6,4.2,0.45],[0.4,3.55,0.25],[1.15,3.35,0]]);
const cUp=crv([[0.2,3.1,0],[0.7,4.6,0],[2.6,6.6,0],[5.0,8.5,0]]);
const cDn=crv([[5.3,8.4,0],[3.6,6.4,0],[1.6,4.4,0],[0.3,3.15,0]]);
for(const c of [cAD,cC,cAB,cUp,cDn])c.getLength();
/* 上行束用三根线加粗视觉 */
for(const dz of [-0.18,0,0.18]){
  const pts=cUp.getPoints(40).map(p=>new THREE.Vector3(p.x,p.y,p.z+dz));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.4})));
}
/* 下行束线 */
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(cDn.getPoints(40)),
  new THREE.LineBasicMaterial({color:0x51cf66,transparent:true,opacity:0.35})));

/* Aδ/Aβ：髓鞘节段（短粗圆柱沿切线）；C：细管+串珠 */
const YAX=new THREE.Vector3(0,1,0);
function myelinate(curve,n,rad,mat){
  for(let i=0;i<n;i++){
    const t=(i+0.5)/n,p=curve.getPointAt(t),tg=curve.getTangentAt(t);
    const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,curve.getLength()/n*0.55,8),mat);
    m.position.copy(p);
    m.quaternion.setFromUnitVectors(YAX,tg);
    scene.add(m);
  }
}
myelinate(cAD,9,0.09,myA);
myelinate(cAB,7,0.11,myB);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(cC,40,0.035,6),axM));
for(let i=0;i<12;i++){
  const p=cC.getPointAt((i+0.5)/12);
  const bead=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6),axM);
  bead.position.copy(p);scene.add(bead);
}

/* ---- 状态 ---- */
let playing=true,intensity=0.7,rub=false,endo=false,hyper=false,numb=false;
let gateCur=0.5,simT=0,ascCount=0,ascRate=0,ascWindow=0;
let labelsOn=!Q.has('labels')||Q.get('labels')!=='0';
const parts=[]; // {mesh,curve,p,speed,type,asc}
let spawnAcc=0,rubAcc=0,endAcc=0;

/* 闸门开度：开=伤害性信号可通过的比例（简化 Melzack-Wall） */
function gateTarget(){
  if(numb)return 0;
  let g=1.35*intensity-0.6*(rub?1:0)-1.15*(endo?1:0);
  if(hyper)g=Math.max(g,0.9); // 闸门常开：轻触也痛
  return clamp(g,0,1);
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('刺激点（伤害感受器）','Stimulus (nociceptor)'),new THREE.Vector3(-7.4,8.0,0),'r');
addLabel(()=>L('Aδ 有髓快纤维 ~15 m/s','Aδ myelinated fast ~15 m/s'),new THREE.Vector3(-5.6,4.9,0.5),'o');
addLabel(()=>L('C 无髓慢纤维 ~1 m/s','C unmyelinated slow ~1 m/s'),new THREE.Vector3(-5.0,4.2,-0.6),'r');
addLabel(()=>L('Aβ 粗触觉纤维（揉）','Aβ coarse touch (rub)'),new THREE.Vector3(-3.6,4.8,0.7),'b',()=>rub);
addLabel(()=>L('抑制性中间神经元 = 闸门','Inhibitory interneuron = gate'),new THREE.Vector3(2.3,3.3,0),'g');
addLabel(()=>L('PAG · 内啡肽下行抑制','PAG · endorphin descending'),new THREE.Vector3(6.2,10.4,0),'g',()=>endo);
addLabel(()=>L('上行至丘脑/脑','Ascending to thalamus/brain'),new THREE.Vector3(3.2,6.6,0.3),'o');
addLabel(()=>L('闸门半关：上行减半','Gate half-closed: ascending halved'),new THREE.Vector3(-0.5,4.0,0),'b',()=>rub&&!endo);
addLabel(()=>L('闸门全关','Gate shut'),new THREE.Vector3(-0.5,4.0,0),'g',()=>endo);
addLabel(()=>L('闸门常开 = 痛觉过敏！','Gate stuck open = hyperalgesia!'),new THREE.Vector3(1.8,2.0,0),'r',()=>hyper);
addLabel(()=>L('无痛觉：感觉不到骨折烫伤——危险！','No pain: fractures/burns unnoticed — dangerous!'),new THREE.Vector3(1.8,2.0,0),'r',()=>numb);

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0c1016:0xe9e4dc);
  scene.fog.color.setHex(dark?0x0c1016:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'双通道：Aδ 有髓 ~15 m/s 快痛先到；C 无髓 ~1 m/s 慢痛绵长',en:'Two channels: myelinated Aδ ~15 m/s arrives first; C ~1 m/s dull and lasting',
   go(){intensity=0.9;setMode(false,false,false,false);}},
  {zh:'冲开闸门：强刺激压过抑制，信号过闸上行到脑',en:'Bursting the gate: strong input outweights inhibition, signal ascends',
   go(){intensity=1.0;setMode(false,false,false,false);}},
  {zh:'揉一揉：Aβ 激活抑制性中间神经元，闸门半关，上行当场减半',en:'Rub it: Aβ fires the inhibitory interneuron, gate half-closes, ascending halves',
   go(){intensity=0.9;setMode(true,false,false,false);}},
  {zh:'下行抑制：PAG→内啡肽直达闸门，全关（内源性镇痛/吗啡原理）',en:'Descending: PAG → endorphins close the gate fully (endogenous analgesia/morphine)',
   go(){intensity=0.9;setMode(false,true,false,false);}},
  {zh:'闸门常开：慢性痛→痛觉过敏，轻触也痛',en:'Gate stuck open: chronic pain → hyperalgesia, a light touch hurts',
   go(){intensity=0.15;setMode(false,false,true,false);}},
  {zh:'闸门焊死：先天无痛(CIPA)，感觉不到骨折烫伤——危险',en:'Gate welded shut: CIPA, fractures and burns unnoticed — dangerous',
   go(){intensity=0.6;setMode(false,false,false,true);}},
];
let activeStep=0;
function setMode(r,e,h,n){
  rub=r;endo=e;hyper=h;numb=n;syncBtns();
  // 同步滑块显示
  document.getElementById('sInt').value=Math.round(intensity*100);
  document.getElementById('sIntVal').textContent=Math.round(intensity*100)+'%';
}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.go();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function syncBtns(){
  document.getElementById('btnRub').classList.toggle('on',rub);
  document.getElementById('btnEnd').classList.toggle('on',endo);
  document.getElementById('btnHyper').classList.toggle('on',hyper);
  document.getElementById('btnNumb').classList.toggle('on',numb);
}

/* ---- 按钮/滑块 ---- */
document.getElementById('btnRub').addEventListener('click',()=>{rub=!rub;syncBtns();});
document.getElementById('btnEnd').addEventListener('click',()=>{endo=!endo;syncBtns();});
document.getElementById('btnHyper').addEventListener('click',()=>{hyper=!hyper;if(hyper)numb=false;syncBtns();});
document.getElementById('btnNumb').addEventListener('click',()=>{numb=!numb;if(numb)hyper=false;syncBtns();});
document.getElementById('sInt').addEventListener('input',e=>{
  intensity=+e.target.value/100;
  document.getElementById('sIntVal').textContent=Math.round(intensity*100)+'%';
});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 粒子 ---- */
const pGeo=new THREE.SphereGeometry(0.1,8,6);
function spawn(curve,mat,speed,type){
  const m=new THREE.Mesh(pGeo,mat);scene.add(m);
  parts.push({mesh:m,curve,p:0,speed,type,asc:false,life:1});
}
function updateStats(){
  document.getElementById('stInt').innerHTML=Math.round(intensity*100)+'<small> %</small>';
  document.getElementById('stGate').innerHTML=Math.round(gateCur*100)+'<small> %</small>';
  document.getElementById('stArr').innerHTML='<small>0.07 / 1.0 </small>s';
  document.getElementById('stAsc').innerHTML=ascRate.toFixed(1)+'<small> /s</small>';
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    simT+=dt;
    /* 闸门开度平滑趋近 */
    gateCur+=(gateTarget()-gateCur)*Math.min(1,dt*5);
    /* 伤害性输入：Aδ 快、C 慢 */
    spawnAcc+=dt*(2.5*intensity);
    while(spawnAcc>1){spawnAcc-=1;
      spawn(cAD,pAD,cAD.getLength()/1.1,'AD');   // ~1.1 s 过全程（×15 快放）
      spawn(cC,pC,cC.getLength()/5.5,'C');       // C 明显慢 5 倍
    }
    /* Aβ：揉→粗纤维高频点亮 */
    rubAcc+=dt*(rub?5:0);
    while(rubAcc>1){rubAcc-=1;spawn(cAB,pB,cAB.getLength()/0.9,'AB');}
    /* 下行内啡肽 */
    endAcc+=dt*(endo?5:0);
    while(endAcc>1){endAcc-=1;spawn(cDn,pE,cDn.getLength()/0.8,'E');}
    /* 粒子推进与过闸判定 */
    ascWindow+=dt;
    for(let i=parts.length-1;i>=0;i--){
      const q=parts[i];
      q.p+=q.speed*dt/q.curve.getLength();
      if(q.asc){ // 已过闸：沿上行束
        if(q.p>=1){scene.remove(q.mesh);parts.splice(i,1);continue;}
      }else if(q.p>=1){
        if(q.type==='AD'||q.type==='C'){
          if(Math.random()<gateCur){ // 过闸：转上行
            q.asc=true;q.p=0;q.curve=cUp;q.speed=cUp.getLength()/0.9;ascCount++;
          }else{q.life-=dt*3;if(q.life<=0){scene.remove(q.mesh);parts.splice(i,1);continue;}}
        }else{scene.remove(q.mesh);parts.splice(i,1);continue;}
      }
      q.mesh.position.copy(q.curve.getPointAt(Math.min(1,q.p)));
      q.mesh.scale.setScalar(Math.max(0.2,q.life));
    }
    /* 上行速率统计（1 s 窗口） */
    if(ascWindow>=1){ascRate=ascCount/ascWindow;ascCount=0;ascWindow=0;}
  }
  /* 视觉状态 */
  const open=gateCur;
  door1.rotation.z=lerp(-0.06,1.25,open);  // 开=门板向外翻
  door2.rotation.z=lerp(0.06,-1.25,open);
  door1.material.emissiveIntensity=0.5+(1-open)*0.8;
  hot.material.emissiveIntensity=0.5+intensity*1.6+Math.sin(simT*9)*0.15;
  rubDisc.material.emissiveIntensity=rub?0.7+Math.sin(simT*10)*0.3:0.15;
  inh.material.emissiveIntensity=rub?0.9+Math.sin(simT*8)*0.35:0.2;
  pag.material.emissiveIntensity=endo?1.0+Math.sin(simT*8)*0.3:0.15;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

/* ---- URL 参数与启动 ---- */
if(Q.get('pause')==='1'){playing=false;}
document.getElementById('tglLabels').checked=labelsOn;
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();syncBtns();start();
</script>
</body>
</html>
