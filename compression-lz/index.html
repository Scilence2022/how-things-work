<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LZ77 无损压缩 · 滑动窗口</title>
<style>
:root,:root[data-theme="dark"]{color-scheme:dark;
  --acc:#4dabf7;--bg:#0f1214;--panel:rgba(15,18,20,.86);--panel-border:rgba(255,255,255,.09);
  --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;--hover:rgba(255,255,255,.05);
  --shadow:0 8px 30px rgba(0,0,0,.45);--tool:rgba(15,18,20,.78);--tool-border:rgba(255,255,255,.12);
  --cv-pill:rgba(15,18,20,.8);}
:root[data-theme="light"]{color-scheme:light;
  --acc:#1864ab;--bg:#eef2f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
  --text:#16202c;--text2:#5b6b7d;--text3:#33414f;--hover:rgba(15,25,40,.05);
  --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);
  --cv-pill:rgba(255,255,255,.85);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s;}
#app{position:fixed;inset:0;}
#app canvas{display:block;}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;}
.lbl{background:var(--cv-pill);border:1px solid var(--tool-border);
  color:var(--text3);font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;
  white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s;}
:root[data-theme="light"] .lbl{text-shadow:none;}
.lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2;}
.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2;}
.lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0;}
.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff;}
.lbl.st{border-color:rgba(154,167,184,.9);font-size:13px;padding:6px 11px;}
:root[data-theme="light"] .lbl.o{color:#a34e00;}:root[data-theme="light"] .lbl.r{color:#c92a2a;}
:root[data-theme="light"] .lbl.g{color:#2b8a3e;}:root[data-theme="light"] .lbl.b{color:#1864ab;}
#tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
.tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
  font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;text-decoration:none;backdrop-filter:blur(6px);transition:border-color .15s,color .15s,transform .15s;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
#title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
#title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
#title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5);}
#stats{position:fixed;right:18px;bottom:244px;z-index:4;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
  backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
#stats .k{font-size:12px;color:var(--text2);align-self:center;}
#stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
#stats .v small{font-size:11px;color:var(--text2);font-weight:400;}
#stats .v.ok{color:#7bd88f;}#stats .v.warn{color:#ffa94d;}
#panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
  background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
  padding:14px 16px 12px;backdrop-filter:blur(6px);box-shadow:var(--shadow);
  max-height:calc(100vh - 160px);overflow:auto;}
#legend{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid;}
.chip.b{color:#bde9ff;border-color:rgba(116,192,252,.7);}
.chip.g{color:#c8f5d0;border-color:rgba(116,220,132,.7);}
.chip.o{color:#ffe0ae;border-color:rgba(255,180,84,.7);}
.chip.y{color:#ffe98a;border-color:rgba(255,213,0,.7);}
:root[data-theme="light"] .chip.b{color:#1864ab;border-color:rgba(24,100,171,.7);}
:root[data-theme="light"] .chip.g{color:#2b8a3e;border-color:rgba(43,138,62,.7);}
:root[data-theme="light"] .chip.o{color:#a34e00;border-color:rgba(163,78,0,.7);}
:root[data-theme="light"] .chip.y{color:#8a6d00;border-color:rgba(160,125,0,.7);}
#actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;background:var(--hover);
  color:var(--text2);border:1px solid var(--tool-border);border-radius:9px;padding:7px 10px;
  font-size:12.5px;font-weight:600;transition:border-color .15s,color .15s,background .15s;}
.abtn:hover{border-color:var(--acc);color:var(--text);}
.abtn.on{border-color:rgba(77,171,247,.6);background:rgba(77,171,247,.12);color:var(--text);}
:root[data-theme="light"] .abtn.on{border-color:rgba(24,100,171,.55);background:rgba(24,100,171,.10);}
#formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);
  border-top:1px dashed var(--panel-border);padding-top:7px;}
#formula b{color:var(--text3);font-weight:600;}
#steps{list-style:none;margin-top:8px;}
#steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;align-items:flex-start;}
#steps li:hover{background:var(--hover);}
#steps li.on{background:rgba(77,171,247,.10);border-color:rgba(77,171,247,.45);}
:root[data-theme="light"] #steps li.on{background:rgba(24,100,171,.08);border-color:rgba(24,100,171,.4);}
#steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  background:rgba(255,255,255,.12);color:var(--text3);}
:root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
#steps li.on .n{background:var(--acc);color:#fff;}
#steps .t{font-size:12px;color:var(--text3);line-height:1.45;}
#steps .t b{color:var(--text);font-size:12px;}
#steps li.on .t b{color:#bde9ff;}
:root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
#ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
#play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
  background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer;}
#play:hover{filter:brightness(1.12);}
.row{display:flex;align-items:center;gap:8px;margin-top:4px;}
.row label{font-size:12px;color:var(--text2);flex:0 0 96px;}
.row .val{font-size:11.5px;color:var(--text3);flex:0 0 56px;text-align:right;font-variant-numeric:tabular-nums;}
input[type=range]{width:100%;accent-color:var(--acc);height:18px;}
#toggles{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap;}
#toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer;}
#toggles input{accent-color:var(--acc);}
@media(max-width:900px){#stats{display:none;}}
@media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh;}
  #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="LZ77 无损压缩" data-en="LZ77 Lossless Compression">LZ77 无损压缩</h1>
  <div class="sub" data-zh="滑动窗口找重复串，三元组取代副本——ZIP 与 PNG 的核心 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Sliding window finds repeats, triples replace copies — the core of ZIP and PNG · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">滑动窗口找重复串，三元组取代副本——ZIP 与 PNG 的核心 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="原始" data-en="Original">原始</span><span class="v" id="stOrig">— <small>ch</small></span>
  <span class="k" data-zh="压缩后" data-en="Compressed">压缩后</span><span class="v ok" id="stComp">— <small>tok</small></span>
  <span class="k" data-zh="压缩比" data-en="Ratio">压缩比</span><span class="v" id="stRatio">—</span>
  <span class="k" data-zh="令牌类型" data-en="Token type">令牌类型</span><span class="v" id="stTok">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip b" data-zh="滑动窗口" data-en="search window">滑动窗口</span>
    <span class="chip g" data-zh="字面令牌 (ch)" data-en="literal token (ch)">字面令牌 (ch)</span>
    <span class="chip o" data-zh="复制令牌 (offset,len)" data-en="copy token (offset,len)">复制令牌 (offset,len)</span>
    <span class="chip y" data-zh="匹配回指箭头" data-en="match back-pointer">匹配回指箭头</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnEncode" data-zh="逐步编码" data-en="Step encode">逐步编码</button>
    <button class="abtn" id="btnAuto"   data-zh="自动" data-en="Auto">自动</button>
    <button class="abtn" id="btnDecomp" data-zh="解压" data-en="Decompress">解压</button>
    <button class="abtn" id="btnChange" data-zh="换输入" data-en="Change input">换输入</button>
  </div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.3" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="窗口大小" data-en="Window size">窗口大小</label><input id="slW" type="range" min="8" max="32" step="1" value="16"><span class="val" id="slWVal">16</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言(全站共享模式) ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG  = localStorage.getItem('htw-lang')  || 'zh';
const L = (zh,en) => LANG==='en'?en:zh;

/* ---------------- LZ77 数据与算法(与 2D 版一致) ---------------- */
const INPUTS = [
  'abracadabra abracadabra',
  'aaaaaaaaaaaaaaa',
  'the cat sat on the mat',
  'banana bandana banana',
];
let inputIdx = 0;
let inputStr = INPUTS[inputIdx];
let windowSize = clamp(Math.round(qsFloat('w', 16)), 8, 32);

function lz77Encode(s, wSize){
  const tokens = []; let i = 0;
  while(i < s.length){
    const winStart = Math.max(0, i - wSize);
    const buf = s.slice(winStart, i);
    let bestOff = 0, bestLen = 0;
    for(let j = 0; j < buf.length; j++){
      let len = 0;
      while(i+len < s.length && buf[(j+len) % buf.length] === s[i+len]){ len++; if(len>=255)break; }
      if(len > bestLen){ bestLen = len; bestOff = buf.length - j; }
    }
    if(bestLen >= 3){ tokens.push({type:'copy',offset:bestOff,length:bestLen,pos:i}); i+=bestLen; }
    else { tokens.push({type:'lit',char:s[i],pos:i}); i++; }
  }
  return tokens;
}

let tokens = [], encodeStep = 0, cursorPos = 0;
let arcAnim = null, arcTok = null;
let decompStr = '', decompStep = 0, decompRunning = false;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.3, 3);
let encAcc = 0, decAcc = 0;
const STEP_DT = 0.38, DEC_DT = 0.26;   // 与 2D 版的 380ms / 260ms 节奏一致

/* ---------------- 渲染器 / 场景 ---------------- */
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(2.8, 4.6, 12.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(3, 7, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

const grid = new THREE.GridHelper(44, 44, 0xffffff, 0xffffff);
grid.material.transparent = true;
grid.position.y = -1.35;
scene.add(grid);

/* ---------------- 调色板(深/浅主题) ---------------- */
const PAL = {
  dark: { bg:0x0f1214, grid:0x3a4656, gridOp:0.32,
    cubeDef:0x1a2030, cubeDone:0x182818, cubeCopy:0x2d2200, cubeLit:0x001b2d,
    cardLit:0x1a2030, cardLitLast:0x1b3a55, cardCopy:0x1a1800, cardCopyLast:0x2d1e00,
    win:0x4dabf7, arc:0xffd500, litTxt:'#7bd88f', copyTxt:'#ffa94d' },
  light: { bg:0xeef2f6, grid:0x9aa7b8, gridOp:0.5,
    cubeDef:0xdde4ee, cubeDone:0xd0edd8, cubeCopy:0xfff4c0, cubeLit:0xc0e4ff,
    cardLit:0xdde4ee, cardLitLast:0xc5e8ff, cardCopy:0xfdf7e0, cardCopyLast:0xfff4c8,
    win:0x1864ab, arc:0xc99400, litTxt:'#1e6b3a', copyTxt:'#7a4e00' }
};
let P = PAL[THEME === 'light' ? 'light' : 'dark'];

/* ---------------- 布局常量 ---------------- */
const PITCH = 0.5;
const ROW_Y = { input: 2.3, token: 0.9, decomp: -0.5 };
const inputLeftX = () => -(inputStr.length - 1) / 2 * PITCH - 0.21;

/* ---------------- 字符纹理(按主题缓存;2D canvas 仅用于纹理) ---------------- */
const texCache = new Map();
function textTex(key2, text, color, fontPx, w, h){
  const k = THEME + '|' + key2 + '|' + text;
  if (texCache.has(k)) return texCache.get(k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.clearRect(0, 0, w, h);
  g.fillStyle = color;
  g.font = 'bold ' + fontPx + 'px ui-monospace, SFMono-Regular, Menlo, monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w / 2, h / 2 + 2);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  texCache.set(k, t);
  return t;
}
function charColorCss(ch){
  const h = (ch.charCodeAt(0) * 37) % 360;
  return THEME === 'dark' ? 'hsl(' + h + ',65%,68%)' : 'hsl(' + h + ',55%,38%)';
}
function charTex(ch){ return textTex('ch', ch, charColorCss(ch), 76, 128, 128); }
function tokTextOf(tok){ return tok.type === 'lit' ? tok.char : tok.offset + ',' + tok.length; }
function tokTex(tok){
  return tok.type === 'lit'
    ? textTex('lit', tok.char, P.litTxt, 76, 128, 128)
    : textTex('cp', tokTextOf(tok), P.copyTxt, 72, 320, 112);
}

/* ---------------- 字符方块 / 令牌卡片 ---------------- */
const inputG = new THREE.Group(); scene.add(inputG);
const tokenG = new THREE.Group(); scene.add(tokenG);
const decompG = new THREE.Group(); scene.add(decompG);
const cubeGeo = new THREE.BoxGeometry(0.42, 0.42, 0.42);
const charPlaneGeo = new THREE.PlaneGeometry(0.32, 0.32);
const cardGeo = new THREE.BoxGeometry(1, 0.44, 0.26);
let charCubes = [];    // {grp, body, txtMats, ch}
let tokenCards = [];   // {grp, body, txtMats, tok}
let decompCubes = [];  // {grp, body, txtMats, ch}
let tokX = 0;
const anims = [];      // 弹入动画 {o, t}

function clearGroup(g){
  [...g.children].forEach(c => {
    c.traverse(o => {
      if (o.geometry && o.geometry !== cubeGeo && o.geometry !== charPlaneGeo && o.geometry !== cardGeo) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
    g.remove(c);
  });
}
function popAnim(o){ o.scale.setScalar(0.01); anims.push({ o, t: 0 }); }
function easeOutBack(x){ const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

function makeCharCube(ch, x, y){
  const grp = new THREE.Group();
  const body = new THREE.Mesh(cubeGeo,
    new THREE.MeshStandardMaterial({ color: P.cubeDef, roughness: 0.5, metalness: 0.12 }));
  grp.add(body);
  const tm = new THREE.MeshBasicMaterial({ map: charTex(ch), transparent: true, toneMapped: false });
  const front = new THREE.Mesh(charPlaneGeo, tm);
  front.position.z = 0.212;
  grp.add(front);
  const back = new THREE.Mesh(charPlaneGeo, tm);
  back.position.z = -0.212; back.rotation.y = Math.PI;
  grp.add(back);
  grp.position.set(x, y, 0);
  return { grp, body, txtMats: [tm], ch };
}
function buildInputRow(){
  clearGroup(inputG); charCubes = [];
  const n = inputStr.length;
  for (let i = 0; i < n; i++){
    const c = makeCharCube(inputStr[i], (i - (n - 1) / 2) * PITCH, ROW_Y.input);
    inputG.add(c.grp);
    charCubes.push(c);
  }
}
function addTokenCard(tok){
  const w = tok.type === 'lit' ? 0.46 : 0.92;
  const grp = new THREE.Group();
  const body = new THREE.Mesh(cardGeo,
    new THREE.MeshStandardMaterial({ color: P.cardLit, roughness: 0.5, metalness: 0.1 }));
  body.scale.x = w;
  grp.add(body);
  const tm = new THREE.MeshBasicMaterial({ map: tokTex(tok), transparent: true, toneMapped: false });
  const pw = tok.type === 'lit' ? 0.3 : 0.84, ph = tok.type === 'lit' ? 0.3 : 0.30;
  const pg = new THREE.PlaneGeometry(pw, ph);
  const front = new THREE.Mesh(pg, tm);
  front.position.z = 0.135;
  grp.add(front);
  const back = new THREE.Mesh(pg, tm);
  back.position.z = -0.135; back.rotation.y = Math.PI;
  grp.add(back);
  grp.position.set(tokX + w / 2, ROW_Y.token, 0);
  tokX += w + 0.1;
  tokenG.add(grp);
  const card = { grp, body, txtMats: [tm], tok };
  tokenCards.push(card);
  restyleTokenCards();
  popAnim(grp);
  return card;
}
function restyleTokenCards(){
  tokenCards.forEach((c, i) => {
    const isLast = i === tokenCards.length - 1;
    c.body.material.color.set(
      c.tok.type === 'lit' ? (isLast ? P.cardLitLast : P.cardLit)
                           : (isLast ? P.cardCopyLast : P.cardCopy));
  });
}
function pushDecompCube(ch){
  const i = decompCubes.length;
  const c = makeCharCube(ch, (i - (inputStr.length - 1) / 2) * PITCH, ROW_Y.decomp);
  c.body.material.color.set(P.cubeDone);
  decompG.add(c.grp);
  decompCubes.push(c);
  popAnim(c.grp);
}

/* ---------------- 窗口框 / 游标 / 回指箭头 ---------------- */
const winMat = new THREE.MeshBasicMaterial({ color: P.win, transparent: true, opacity: 0.10, depthWrite: false, toneMapped: false });
const winEdgeMat = new THREE.LineBasicMaterial({ color: P.win, transparent: true, opacity: 0.55, toneMapped: false });
const winBox = new THREE.Group();
{
  const box = new THREE.Mesh(new THREE.BoxGeometry(1, 0.66, 0.62), winMat);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry), winEdgeMat);
  winBox.add(box); winBox.add(edges);
}
winBox.visible = false;
scene.add(winBox);

const cursor = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.74, 0.58),
  new THREE.MeshBasicMaterial({ color: 0xff6b6b, toneMapped: false }));
cursor.visible = false;
scene.add(cursor);

const ARC_SEG = 48, ARC_RAD = 6;
const ARC_IDX = ARC_SEG * ARC_RAD * 6;
const arcMat = new THREE.MeshBasicMaterial({ color: P.arc, transparent: true, opacity: 0.92, toneMapped: false });
const arcMesh = new THREE.Mesh(new THREE.TubeGeometry(
  new THREE.QuadraticBezierCurve3(new THREE.Vector3(), new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0)),
  ARC_SEG, 0.032, ARC_RAD, false), arcMat);
arcMesh.visible = false;
arcMesh.frustumCulled = false;
scene.add(arcMesh);
const arcCone = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.2, 10), arcMat);
arcCone.visible = false;
scene.add(arcCone);
function spawnArc(tok){
  const n = inputStr.length;
  const fromX = (tok.pos - tok.offset + Math.min(tok.length, tok.offset) / 2 - (n - 1) / 2) * PITCH;
  const toX   = (tok.pos + tok.length / 2 - (n - 1) / 2) * PITCH;
  const dist = Math.abs(toX - fromX);
  const curve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(fromX, ROW_Y.input + 0.24, 0.24),
    new THREE.Vector3((fromX + toX) / 2, ROW_Y.input + 0.95 + dist * 0.12, 0.9 + dist * 0.12),
    new THREE.Vector3(toX, ROW_Y.input + 0.24, 0.24));
  arcMesh.geometry.dispose();
  arcMesh.geometry = new THREE.TubeGeometry(curve, ARC_SEG, 0.032, ARC_RAD, false);
  arcMesh.geometry.setDrawRange(0, 0);
  arcMesh.visible = true;
  const tangent = curve.getTangent(1).normalize();
  arcCone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
  arcCone.position.copy(curve.getPoint(1)).addScaledVector(tangent, 0.08);
  arcCone.visible = false;
  arcTok = tok;
  lblArc.position.set((fromX + toX) / 2, ROW_Y.input + 1.05 + dist * 0.12, 0.9 + dist * 0.12);
  arcAnim = { tok, progress: 0 };
}

/* ---------------- 场景标签 ---------------- */
const labelReg = [];
let labelsOn = qsBool('labels', true);
function addLabel(textFn, pos, cls = '', vis = () => true){
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  labelReg.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return o;
}
function refreshLabels(){
  for (const r of labelReg) r.o.visible = labelsOn && r.vis() && r.text() !== '';
}
const lblInput = addLabel(() => L('输入字符串', 'Input string'), new THREE.Vector3(), 'b');
const lblWin = addLabel(() => L('搜索窗口', 'search window'), new THREE.Vector3(), 'b',
  () => winBox.visible);
const lblTok = addLabel(() => L('令牌流:字面 (ch) / 复制 (offset,len)', 'token stream: literal (ch) / copy (offset,len)'),
  new THREE.Vector3(), 'g', () => encodeStep > 0);
const lblDec = addLabel(() => L('解压输出:与原文逐字一致', 'decompress output: identical to the input'),
  new THREE.Vector3(), 'g', () => decompStr.length > 0);
const lblArc = addLabel(() => arcTok ? '(' + arcTok.offset + ', ' + arcTok.length + ')' : '',
  new THREE.Vector3(), 'o', () => !!arcTok && arcMesh.visible);
function layoutLabels(){
  const left = inputLeftX();
  lblInput.position.set(left - 0.55, ROW_Y.input + 0.55, 0);
  lblTok.position.set(left - 0.55, ROW_Y.token + 0.5, 0);
  lblDec.position.set(left - 0.55, ROW_Y.decomp + 0.55, 0);
}

/* ---------------- 3D 状态同步 ---------------- */
function refreshCubes(){
  const lastTok = encodeStep > 0 ? tokens[encodeStep - 1] : null;
  charCubes.forEach((c, i) => {
    let col = P.cubeDef;
    if (i < cursorPos) col = P.cubeDone;
    if (lastTok){
      if (lastTok.type === 'copy' && i >= lastTok.pos && i < lastTok.pos + lastTok.length) col = P.cubeCopy;
      if (lastTok.type === 'lit' && i === lastTok.pos) col = P.cubeLit;
    }
    c.body.material.color.set(col);
  });
}
function updateWindowCursor(){
  const n = inputStr.length;
  const winStart = Math.max(0, cursorPos - windowSize);
  const winLen = Math.min(windowSize, cursorPos);
  const showWin = encodeStep > 0 && winLen > 0;
  winBox.visible = showWin;
  if (showWin){
    const cx = (winStart + winLen / 2 - (n - 1) / 2) * PITCH;
    winBox.position.set(cx, ROW_Y.input, 0);
    winBox.scale.set(winLen * PITCH + 0.16, 1, 1);
    lblWin.position.set(cx, ROW_Y.input + 0.6, 0);
  }
  const showCur = encodeStep > 0 && encodeStep < tokens.length;
  cursor.visible = showCur;
  if (showCur) cursor.position.set((cursorPos - (n - 1) / 2) * PITCH - PITCH / 2, ROW_Y.input, 0);
}
function retextureAll(){
  charCubes.forEach(c => c.txtMats.forEach(m => { m.map = charTex(c.ch); m.needsUpdate = true; }));
  decompCubes.forEach(c => c.txtMats.forEach(m => { m.map = charTex(c.ch); m.needsUpdate = true; }));
  tokenCards.forEach(c => c.txtMats.forEach(m => { m.map = tokTex(c.tok); m.needsUpdate = true; }));
}

/* ---------------- 主题 / 语言 ---------------- */
function applyTheme(){
  htmlEl.setAttribute('data-theme', THEME);
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  P = PAL[THEME === 'light' ? 'light' : 'dark'];
  scene.background = new THREE.Color(P.bg);
  scene.fog = new THREE.Fog(P.bg, 24, 50);
  grid.material.color.set(P.grid);
  grid.material.opacity = P.gridOp;
  winMat.color.set(P.win); winEdgeMat.color.set(P.win);
  arcMat.color.set(P.arc);
  refreshCubes();
  restyleTokenCards();
  decompCubes.forEach(c => c.body.material.color.set(P.cubeDone));
  retextureAll();
}
function applyLang(){
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => { el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh; });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('LZ77 无损压缩 · 滑动窗口', 'LZ77 Lossless Compression · Sliding Window');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps(); updateFormula(); setPlayLabel(); updateStats(); refreshLabels();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 编码 / 解压逻辑 ---------------- */
function resetState(){
  tokens = lz77Encode(inputStr, windowSize);
  encodeStep = 0; cursorPos = 0;
  decompStr = ''; decompStep = 0; decompRunning = false;
  arcAnim = null; arcTok = null; encAcc = 0; decAcc = 0;
  playing = false;
  buildInputRow();
  clearGroup(tokenG); tokenCards = []; tokX = inputLeftX();
  clearGroup(decompG); decompCubes = [];
  arcMesh.visible = false; arcCone.visible = false;
  document.getElementById('btnDecomp').classList.remove('on');
  refreshCubes(); updateWindowCursor(); layoutLabels(); updateStats(); syncPlayUI();
}
function stepEncode(){
  if (encodeStep >= tokens.length){ playing = false; syncPlayUI(); return; }
  const tok = tokens[encodeStep];
  cursorPos = tok.pos + (tok.type === 'copy' ? tok.length : 1);
  if (tok.type === 'copy') spawnArc(tok);
  encodeStep++;
  addTokenCard(tok);
  refreshCubes(); updateWindowCursor(); updateStats();
  if (encodeStep >= tokens.length){ playing = false; syncPlayUI(); }
}
function stepDecomp(){
  if (decompStep >= tokens.length){
    decompRunning = false;
    document.getElementById('btnDecomp').classList.remove('on');
    return;
  }
  const tok = tokens[decompStep];
  if (tok.type === 'lit'){ decompStr += tok.char; pushDecompCube(tok.char); }
  else {
    const start = decompStr.length - tok.offset;
    for (let k = 0; k < tok.length; k++){
      const ch = decompStr[start + (k % tok.offset)] || '';
      decompStr += ch;
      pushDecompCube(ch);
    }
  }
  decompStep++;
  updateStats();
}
function updateStats(){
  document.getElementById('stOrig').innerHTML = inputStr.length + '<small> ch</small>';
  const compSize = tokens.slice(0, encodeStep).reduce((a, t) => a + (t.type === 'lit' ? 1 : 3), 0);
  document.getElementById('stComp').innerHTML = encodeStep + '<small> tok</small>';
  const ratio = compSize > 0 ? (inputStr.length / compSize).toFixed(2) : '—';
  document.getElementById('stRatio').textContent = ratio;
  const lastTok = encodeStep > 0 ? tokens[encodeStep - 1] : null;
  document.getElementById('stTok').textContent = lastTok ? (lastTok.type === 'lit' ? L('字面', 'lit') : L('复制', 'copy')) : '—';
}
function updateFormula(){
  document.getElementById('formula').innerHTML =
    '<b>' + L('格式', 'Format') + ':</b> ' + L('字面量', 'literal') + ' = (ch) | ' + L('复制令牌', 'copy') + ' = (offset, len)<br>' +
    '<b>' + L('窗口', 'Window') + ':</b> ' + windowSize + ' ' + L('字符', 'chars') + ' | ' +
    '<b>' + L('输入', 'Input') + ':</b> "' + (inputStr.length > 22 ? inputStr.slice(0, 22) + '…' : inputStr) + '"';
}

/* ---------------- 讲解步骤(与 2D 版一致) ---------------- */
const STEPS = [
  {zh:'滑动窗口：编码器在已编码内容中找最长匹配（窗口大小决定回看距离）',en:'Sliding window: encoder searches previously seen content for longest match'},
  {zh:'匹配搜索：从当前位置向窗口内找最长前缀，记录(偏移,长度)',en:'Match search: find longest prefix match then record (offset, length)'},
  {zh:'输出令牌：找到匹配→(偏移,长度)；否则→字面值',en:'Emit token: match found → (offset, length); no match → literal'},
  {zh:'解压：(偏移,长度)令牌→从已解压缓冲区回找偏移处复制',en:'Decompress: (offset,length) token → go back offset bytes, copy length chars'},
  {zh:'自引用复制：偏移<长度时，从自身新写输出延伸——(1,5) 从 a 变 aaaaaa',en:'Self-referential copy: offset<length extends from own output; (1,5) turns a into aaaaaa'},
  {zh:'DEFLATE：ZIP/PNG 用 LZ77 找重复串，再用霍夫曼编码压令牌',en:'DEFLATE: ZIP/PNG use LZ77 for matching, then Huffman-code the tokens'},
];
function buildSteps(){
  const ol = document.getElementById('steps'); ol.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    const txt = LANG === 'en' ? s.en : s.zh;
    const sep = txt.indexOf('：') !== -1 ? '：' : ':';
    const parts = txt.split(sep);
    li.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="t"><b>' + parts[0] + '</b>' + (parts.length > 1 ? '<br>' + parts.slice(1).join(sep) : '') + '</span>';
    li.addEventListener('click', () => { document.querySelectorAll('#steps li').forEach(x => x.classList.remove('on')); li.classList.add('on'); });
    ol.appendChild(li);
  });
}

/* ---------------- UI 绑定 ---------------- */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel(){ elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function syncPlayUI(){
  setPlayLabel();
  document.getElementById('btnAuto').classList.toggle('on', playing);
}
function togglePlay(){
  if (!playing && encodeStep >= tokens.length) resetState();   // 播完再播=重来
  playing = !playing;
  encAcc = 0;
  syncPlayUI();
}
document.getElementById('btnEncode').addEventListener('click', () => {
  playing = false; syncPlayUI();
  stepEncode();
});
document.getElementById('btnAuto').addEventListener('click', togglePlay);
document.getElementById('btnDecomp').addEventListener('click', () => {
  playing = false; syncPlayUI();
  encodeStep = tokens.length; cursorPos = inputStr.length;
  while (tokenCards.length < tokens.length) addTokenCard(tokens[tokenCards.length]);
  clearGroup(decompG); decompCubes = [];
  decompStr = ''; decompStep = 0; decompRunning = true; decAcc = 0;
  document.getElementById('btnDecomp').classList.add('on');
  refreshCubes(); updateWindowCursor(); updateStats();
});
document.getElementById('btnChange').addEventListener('click', () => {
  inputIdx = (inputIdx + 1) % INPUTS.length; inputStr = INPUTS[inputIdx];
  resetState(); updateFormula();
});
document.getElementById('slW').addEventListener('input', () => {
  windowSize = parseInt(document.getElementById('slW').value);
  document.getElementById('slWVal').textContent = windowSize;
  resetState(); updateFormula();
});
elPlay.addEventListener('click', togglePlay);
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => {
  speed = parseFloat(elSpeed.value);
  elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
});
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
tglLabels.checked = labelsOn;
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
document.getElementById('slW').value = windowSize;
document.getElementById('slWVal').textContent = windowSize;
addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let raf = null;
function frame(){
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing){
    encAcc += dt * speed;
    while (encAcc >= STEP_DT && playing){ encAcc -= STEP_DT; stepEncode(); }
  }
  if (decompRunning){
    decAcc += dt * speed;
    while (decAcc >= DEC_DT && decompRunning){ decAcc -= DEC_DT; stepDecomp(); }
  }
  if (arcAnim){
    arcAnim.progress = Math.min(1, arcAnim.progress + dt * 1.8);
    arcMesh.geometry.setDrawRange(0, Math.floor(arcAnim.progress * ARC_IDX));
    arcCone.visible = arcAnim.progress > 0.9;
    if (arcAnim.progress >= 1) arcAnim = null;
  }
  for (let i = anims.length - 1; i >= 0; i--){
    const a = anims[i];
    a.t += dt * 3.0;
    const k = Math.min(a.t, 1);
    a.o.scale.setScalar(Math.max(easeOutBack(k), 0.01));
    if (k >= 1) anims.splice(i, 1);
  }
  refreshLabels();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start(){ if (raf === null){ clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop(){ if (raf !== null){ cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ---------------- 初始化 ---------------- */
resetState();
playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
syncPlayUI();
applyTheme();
applyLang();
updateFormula();
refreshLabels();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '▴' : '▾';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
