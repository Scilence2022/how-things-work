<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活化能 · 麦克斯韦-玻尔兹曼分布与催化剂</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(255,255,255,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.f { color: #ff9f43; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h  { color: #ffaaa2; border-color: rgba(255,138,128,.7); }
  .chip.l  { color: #bde9ff; border-color: rgba(127,208,247,.7); }
  .chip.k  { color: #ffd166; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.h  { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.l  { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.k  { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: default;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="活化能：反应为什么慢？谁能翻过那座山？" data-en="Activation energy: why are reactions slow? Who clears the mountain?">活化能：反应为什么慢？谁能翻过那座山？</h1>
  <div class="sub" data-zh="分子能量服从麦克斯韦-玻尔兹曼分布;只有越过 Ea 阈值的才能反应。升温让曲线摊平右移,催化剂把山削低 · 空格播放/暂停" data-en="Molecular energies follow the Maxwell–Boltzmann distribution; only those beyond Ea react. Heat flattens the curve, catalysts lower the mountain · Space = play/pause">分子能量服从麦克斯韦-玻尔兹曼分布;只有越过 Ea 阈值的才能反应。升温让曲线摊平右移,催化剂把山削低 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="能反应分子比例" data-en="fraction able to react">能反应分子比例</span><span class="v f" id="stF">—</span>
  <span class="k" data-zh="相对速率(vs 基准)" data-en="relative rate (vs base)">相对速率(vs 基准)</span><span class="v" id="stR">—<small> ×300K 无催化</small></span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip h" data-zh="≥ Ea:能反应(红)" data-en="≥ Ea: reactive (red)">≥ Ea:能反应(红)</span>
    <span class="chip l" data-zh="&lt; Ea:翻不过山" data-en="&lt; Ea: can't climb">&lt; Ea:翻不过山</span>
    <span class="chip k" data-zh="催化剂:Ea 左移" data-en="catalyst: Ea shifts left">催化剂:Ea 左移</span>
  </div>
  <div class="row"><label data-zh="温度 T" data-en="Temperature T">温度 T</label><input id="temp" type="range" min="300" max="900" step="10" value="500"><span class="val" id="tempVal">500 K</span></div>
  <div class="row"><label data-zh="活化能 Ea" data-en="Activation energy Ea">活化能 Ea</label><input id="ea" type="range" min="4" max="12" step="1" value="8"><span class="val" id="eaVal">8 kJ/mol</span></div>
  <div class="row"><label data-zh="时间" data-en="Time">时间</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  <div id="ctrl">
    <button id="play">暂停/播放</button>
    <label><input id="tglCat" type="checkbox"> <span data-zh="加入催化剂(Ea 减半)" data-en="add catalyst (Ea halved)">加入催化剂(Ea 减半)</span></label>
  </div>
  <ol id="steps"></ol>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglMol" type="checkbox" checked> <span data-zh="分子样本" data-en="molecule sample">分子样本</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('活化能 · 麦克斯韦-玻尔兹曼分布', 'Activation Energy · Maxwell–Boltzmann');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function dot(x, y, r, color, glow) {
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  circle(x, y, r, color);
  ctx.shadowBlur = 0;
}

/* ================= 物理量 ================= */
let T = 500, EaK = 8;          // 温度(K) 与活化能(示意单位)
let catalyst = false;
let playing = true, speed = 1;
let showLabels = true, showMol = true;
let simT = 0;
const EMAX = 26;               // 能量轴上限(示意单位)

/* 麦克斯韦-玻尔兹曼(2D 形状近似):f(E) ∝ E·exp(−E/T'),T' 与滑块 T 成正比 */
const Tp = () => T / 25;
const fMB = (E, Tp2) => E * Math.exp(-E / Tp2);
/* 超过 Ea 的比例(数值积分,归一化) */
function fracAbove(ea, Tp2) {
  let tot = 0, above = 0;
  for (let i = 0; i < 400; i++) {
    const E = (i + 0.5) / 400 * EMAX;
    const f = fMB(E, Tp2);
    tot += f;
    if (E >= ea) above += f;
  }
  return above / tot;
}
const eaNow = () => catalyst ? EaK / 2 : EaK;
const kRel = () => {   // 相对速率 k ∝ exp(−Ea/T)(Arrhenius 示意),基准 = 300K 无催化
  const kk = Math.exp(-eaNow() / (T / 25));
  const k0 = Math.exp(-EaK / (300 / 25));
  return kk / k0;
};

/* ================= 相位讲解(按当前状态点亮) ================= */
const STEPS = [
  { id: 'dist', b: '分子能量:一条分布', d: '室温下的分子能量服从麦克斯韦-玻尔兹曼分布:大多数在中间,只有极少数「特别热」。',
    be: 'A distribution of energies', de: 'Molecular energies follow the Maxwell–Boltzmann distribution: most sit in the middle, only a rare few run hot.' },
  { id: 'temp', b: '升温:曲线摊平右移', d: '温度升高,曲线整体摊平右移——超过 Ea 的分子比例按指数暴涨(这就是为什么升温 10K 速率翻倍)。',
    be: 'Heat flattens the curve', de: 'Higher temperature flattens and spreads the curve — the fraction beyond Ea explodes exponentially (why +10 K can double rates).' },
  { id: 'ea', b: 'Ea:那座山', d: '活化能 Ea 是反应的门槛:能量 ≥ Ea 的碰撞才算数。把 Ea 线左右拖,看红色区域如何变化。',
    be: 'Ea: the mountain pass', de: 'Ea is the threshold: only collisions with E ≥ Ea count. Drag the Ea line and watch the red region change.' },
  { id: 'cat', b: '催化剂:把山削低', d: '催化剂开辟一条低 Ea 的新路径——终点(ΔE)不变,只是山变矮。酶就是生物催化剂。',
    be: 'Catalysts lower the pass', de: 'A catalyst opens a lower-Ea path — the destination (ΔE) is unchanged, only the mountain is shorter. Enzymes are biological catalysts.' },
  { id: 'arrh', b: 'Arrhenius:k = A·e^(−Ea/RT)', d: '速率常数与温度、Ea 的定量关系——面板上的「相对速率」就是这条公式在实时计算。',
    be: 'Arrhenius', de: 'The quantitative law tying rate to T and Ea — the panel\'s relative rate is this formula computing live.' },
];
function stepIndex() {
  if (catalyst) return 3;
  if (EaK <= 6) return 2;
  if (T >= 700) return 1;
  if (simT > 2) return 4;
  return 0;
}

/* ================= 绘制 ================= */
const AX0 = 150, AX1 = 1080, AY1 = 760, AY0 = 160;
const ex = E => lerp(AX0, AX1, E / EMAX);
const ey = f => lerp(AY1, AY0, clamp(f / 0.38, 0, 1));
function drawAxes() {
  line(AX0, AY1, AX1 + 40, AY1, PAL.axis, 1.5);
  line(AX0, AY1, AX0, AY0 - 20, PAL.axis, 1.5);
  text(L('分子动能 E', 'kinetic energy E'), AX1 + 40, AY1 + 30, 13, PAL.dim2, 'center');
  text(L('分子数', 'number of molecules'), AX0 - 14, AY0 - 32, 13, PAL.dim2, 'center');
}
function drawCurve() {
  const Tp2 = Tp();
  const peak = fMB(Tp2, Tp2);
  // 曲线
  ctx.strokeStyle = '#7fd0f7'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const E = i / 120 * EMAX;
    const X = ex(E), Y = ey(fMB(E, Tp2) / peak);
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.stroke();
  // ≥ Ea 阴影
  const ea = eaNow();
  if (ea < EMAX) {
    ctx.fillStyle = 'rgba(255,138,128,.25)';
    ctx.beginPath();
    ctx.moveTo(ex(ea), AY1);
    for (let i = 0; i <= 40; i++) {
      const E = ea + (EMAX - ea) * i / 40;
      ctx.lineTo(ex(E), ey(fMB(E, Tp2) / peak));
    }
    ctx.lineTo(AX1, AY1);
    ctx.closePath(); ctx.fill();
    line(ex(ea), AY1 - 6, ex(ea), AY0 + 6, '#ff8a80', 2.5, [6, 5]);
    text(L('Ea 活化能' + (catalyst ? '(催化后)' : ''), 'Ea' + (catalyst ? ' (catalyzed)' : '')),
      ex(ea) + 10, AY0 + 26, 12.5, '#ff8a80', 'left', 700);
    if (catalyst && ea !== EaK) {
      line(ex(EaK), AY1 - 6, ex(EaK), AY0 + 6, 'rgba(154,167,184,.5)', 2, [4, 5]);
      text(L('原 Ea', 'original Ea'), ex(EaK) + 10, AY0 + 52, 11.5, PAL.dim2);
    }
  }
  if (showLabels) {
    text(L('能反应(≥ Ea)', 'reactive (≥ Ea)'), (ex(ea) + AX1) / 2, AY1 + 30, 12.5, '#ff8a80', 'center', 700);
    text(L('翻不过山', 'cannot climb'), (AX0 + ex(ea)) / 2, AY1 + 30, 12.5, PAL.dim2, 'center');
  }
}
/* 分子样本:固定种子伪随机,分布贴合曲线(确定性) */
function rng(seed) {
  let s = seed;
  return () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
}
function drawMolecules(t) {
  if (!showMol) return;
  const Tp2 = Tp();
  const peak = fMB(Tp2, Tp2);
  const rnd = rng(42);
  const ea = eaNow();
  for (let i = 0; i < 90; i++) {
    // 按分布采样:拒绝法
    let E = 0;
    for (let tries = 0; tries < 40; tries++) {
      const cand = rnd() * EMAX;
      if (rnd() < fMB(cand, Tp2) / peak) { E = cand; break; }
    }
    const X = ex(E) + (rnd() - 0.5) * 10;
    const Y = AY1 - 24 - rnd() * (AY1 - ey(fMB(E, Tp2) / peak)) * 0.35;
    const hot = E >= ea;
    const tw = 0.6 + 0.4 * Math.sin(t * 3 + i);
    dot(X, clamp(Y, AY0 + 10, AY1 - 10), 5.5, hot ? `rgba(255,138,128,${tw})` : `rgba(127,208,247,${0.5 * tw})`, hot ? 8 : 0);
  }
  if (showLabels) text(L('每个点 = 一颗分子(红:能量 ≥ Ea)', 'each dot = one molecule (red: E ≥ Ea)'),
    (AX0 + AX1) / 2, AY1 + 62, 12, PAL.dim2, 'center');
}
function drawFormula(t) {
  const frac = fracAbove(eaNow(), Tp());
  const one = frac > 0 ? Math.max(1, Math.round(1 / frac)) : Infinity;
  if (showLabels) text(L(`能反应比例:${(frac * 100).toFixed(3)}%(约 1/${one})`, `reactive fraction: ${(frac * 100).toFixed(3)}% (≈ 1/${one})`),
    (AX0 + AX1) / 2, AY0 + 10, 14, '#ff9f43', 'center', 700);
  text('k = A·e^(−Ea/RT)', AX1 - 210, AY1 + 62, 13, '#ffd166', 'center', 700);
}

/* ================= 计数 ================= */
const stF = document.getElementById('stF'), stR = document.getElementById('stR');
function updateStats() {
  const frac = fracAbove(eaNow(), Tp());
  stF.innerHTML = (frac * 100).toFixed(3) + '<small>%</small>';
  stR.innerHTML = '×' + kRel().toFixed(2) + '<small> ×300K 无催化</small>';
}

/* ================= 主绘制 ================= */
function draw(t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawAxes();
  drawCurve();
  drawMolecules(t);
  drawFormula(t);
}

/* ================= UI / 主循环 ================= */
let last = performance.now();
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elTemp = document.getElementById('temp');
const elTempVal = document.getElementById('tempVal');
const elEa = document.getElementById('ea');
const elEaVal = document.getElementById('eaVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglMol = document.getElementById('tglMol');
const tglCat = document.getElementById('tglCat');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; simT += 2; });
elTemp.addEventListener('input', () => { T = parseInt(elTemp.value, 10); elTempVal.textContent = T + ' K'; });
elEa.addEventListener('input', () => { EaK = parseInt(elEa.value, 10); elEaVal.textContent = EaK + ' kJ/mol'; catalyst = false; tglCat.checked = false; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglMol.addEventListener('change', () => { showMol = tglMol.checked; });
tglCat.addEventListener('change', () => { catalyst = tglCat.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) simT += dt * speed;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(simT);
  updateStats();
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
requestAnimationFrame(frame);
</script>
</body>
</html>
