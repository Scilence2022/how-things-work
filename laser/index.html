<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>激光 · 光子复制机与谐振腔</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff6b6b;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e03131;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(224,49,49,.9); color: #e03131; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ff6b6b; }
  #stats .v.b { color: #74c0fc; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.a { color: #b3f0c2; border-color: rgba(104,211,145,.7); }
  .chip.e { color: #ffc9c9; border-color: rgba(255,107,107,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,107,107,.12); color: var(--text); border: 1px solid rgba(255,107,107,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(255,107,107,.28); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,107,107,.10); border-color: rgba(255,107,107,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(224,49,49,.08); border-color: rgba(224,49,49,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffc9c9; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="激光：光子复制机与谐振腔" data-en="Laser: the photon copier and its cavity">激光：光子复制机与谐振腔</h1>
  <div class="sub" data-zh="泵浦把原子抬上高能级,一个光子路过就触发受激辐射——克隆出同相同频的光子;两面镜子让它们来回滚雪球,部分透射镜漏出那束激光 · 空格播放/暂停" data-en="Pump the atoms up; one passing photon triggers stimulated emission — an exact clone; mirrors make them snowball, the output coupler leaks the beam · Space = play/pause">泵浦把原子抬上高能级,一个光子路过就触发受激辐射——克隆出同相同频的光子;两面镜子让它们来回滚雪球,部分透射镜漏出那束激光 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="腔内光子" data-en="cavity photons">腔内光子</span><span class="v g" id="stP">0</span>
  <span class="k" data-zh="激发原子" data-en="excited atoms">激发原子</span><span class="v b" id="stA">0</span>
  <span class="k" data-zh="输出功率" data-en="output power">输出功率</span><span class="v g" id="stO">—</span>
  <span class="k" data-zh="状态" data-en="state">状态</span><span class="v" id="stS">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.a" data-zh="激发态原子(泵浦点亮)" data-en="excited atom (pumped)">激发态原子(泵浦点亮)</span>
    <span class="chip.e" data-zh="光子(红色,克隆中)" data-en="photon (red, cloning)">光子(红色,克隆中)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnPump" data-zh="开泵浦(粒子数反转)" data-en="pump on (inversion)">开泵浦(粒子数反转)</button>
    <button class="abtn" id="btnSeed" data-zh="注入一枚种子光子" data-en="inject a seed photon">注入一枚种子光子</button>
  </div>
  <div class="row"><label data-zh="泵浦强度" data-en="pump power">泵浦强度</label><input id="pump" type="range" min="10" max="100" step="5" value="60"><span class="val" id="pumpVal">60%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../double-slit/" data-zh="相干性:双缝要的就是它" data-en="coherence: what the double slit needs">相干性:双缝要的就是它</a>
    <a href="../polarization/" data-zh="偏振:激光的又一特质" data-en="polarization: another laser trait">偏振:激光的又一特质</a>
    <a href="../radioactive-decay/" data-zh="能级跃迁的另一面(规划中)" data-en="transitions (planned)">能级跃迁的另一面(规划中)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('激光 · 光子复制机', 'Laser · the photon copier');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 2.8, 8.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.8, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  rod: new THREE.MeshPhysicalMaterial({ color: 0xff5d5d, transparent: true, opacity: 0.28, roughness: 0.15 }),
  mirror: mat(0xcfd4dc, { metalness: 0.85, roughness: 0.2 }),
  oc: mat(0x8fa3b8, { metalness: 0.6, roughness: 0.3, transparent: true, opacity: 0.6 }),
  lamp: mat(0xffd166, { emissive: 0xffd166, emissiveIntensity: 0.4 }),
  atomG: new THREE.MeshBasicMaterial({ color: 0x39506b }),
  atomE: new THREE.MeshBasicMaterial({ color: 0xff6b6b }),
  photon: new THREE.MeshBasicMaterial({ color: 0xff6b6b }),
  beam: new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.0, depthWrite: false }),
};

/* ================= 谐振腔 ================= */
const X_HR = -2.6, X_OC = 2.6, Y = 1.4;
const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.16, 3.4), M.floor);
floor.position.y = -0.1;
scene.add(floor);
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, X_OC - X_HR, 28), M.rod);
rod.rotation.z = Math.PI / 2;
rod.position.set((X_HR + X_OC) / 2, Y, 0);
scene.add(rod);
const mHR = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.1, 32), M.mirror);
mHR.rotation.z = Math.PI / 2;
mHR.position.set(X_HR - 0.06, Y, 0);
scene.add(mHR);
const mOC = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.08, 32), M.oc);
mOC.rotation.z = Math.PI / 2;
mOC.position.set(X_OC + 0.05, Y, 0);
scene.add(mOC);
/* 泵浦灯(上方) */
const pumpLamp = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, X_OC - X_HR - 0.4, 18), M.lamp);
pumpLamp.rotation.z = Math.PI / 2;
pumpLamp.position.set((X_HR + X_OC) / 2, Y + 0.85, 0);
scene.add(pumpLamp);
/* 输出光束 */
const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 4.2, 14), M.beam);
beam.rotation.z = -Math.PI / 2;
beam.position.set(X_OC + 2.15, Y, 0);
scene.add(beam);
/* 原子(instanced) */
const N_ATOM = 40;
const atomMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.055, 10, 8), M.atomG.clone(), N_ATOM);
scene.add(atomMesh);
const atomPos = [], atomState = [];
for (let i = 0; i < N_ATOM; i++) {
  atomPos.push(new THREE.Vector3(
    X_HR + 0.3 + Math.random() * (X_OC - X_HR - 0.6),
    Y + (Math.random() - 0.5) * 0.55,
    (Math.random() - 0.5) * 0.55));
  atomState.push(0);
}
const m4 = new THREE.Matrix4();
/* 腔内光子 */
const N_PH = 80;
const phMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.04, 8, 6), M.photon, N_PH);
scene.add(phMesh);
const photons = [];   // {p:0..1, dir:±1, alive}
for (let i = 0; i < N_PH; i++) photons.push({ p: 0.5, dir: 1, alive: false });
/* 输出光子(漏出后向右飞) */
const outMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.04, 8, 6), M.photon.clone(), 24);
scene.add(outMesh);
const outPh = [];
for (let i = 0; i < 24; i++) outPh.push({ x: X_OC, alive: false });

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let pumpOn = false;
let pumpPower = 0.6;
let tSim = 0;
let inversion = 0;         // 0..1
function excitedCount() { let k = 0; for (const s of atomState) k += s; return k; }

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblHR = addLabel(() => L('全反镜(弹回)', 'high reflector'), new THREE.Vector3(X_HR - 0.2, Y + 1.0, 0), 'b');
const lblOC = addLabel(() => L('部分透射镜(漏出输出)', 'output coupler (leaks the beam)'), new THREE.Vector3(X_OC + 0.3, Y + 1.0, 0), 'b');
const lblPump = addLabel(() => L('泵浦灯(抬升能级)', 'pump lamp (raises levels)'), new THREE.Vector3(0, Y + 1.5, 0), 'g');
const lblStatus = addLabel(() => {
  if (!pumpOn && excitedCount() === 0 && phCount() === 0) return L('关机:原子都在基态', 'off: all atoms in the ground state');
  if (phCount() > 10) return L('出光!同相同频的相干光束', 'LASING! coherent photons on the march');
  if (inversion < 0.4) return L('泵浦中:把原子抬上高能级…', 'pumping: raising atoms…');
  return L('粒子数反转达成:注入一粒种子光子', 'inversion ready: inject a seed photon');
}, new THREE.Vector3(0, 3.5, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '自发辐射 vs 受激辐射', be: 'Spontaneous vs stimulated',
    d: '激发态原子自己掉下来放光子,方向随机(自发);若恰有一个光子路过,原子会「跟着它」放出一枚克隆光子——同相同频同向(受激)。',
    de: 'An excited atom can drop on its own (random), or a passing photon can trigger it to emit an exact clone — same phase, frequency, direction.',
    act: () => { pumpOn = false; document.getElementById('btnPump').classList.remove('on'); } },
  { b: '泵浦:粒子数反转', be: 'Pumping: the inversion',
    d: '正常时基态原子占多数;泵浦灯强行把半数以上抬上高能级——「反转」是激光放大的入场券。',
    de: 'Normally ground-state atoms dominate; pumping pushes a majority up — inversion is the ticket to amplification.',
    act: () => { pumpOn = true; document.getElementById('btnPump').classList.add('on'); } },
  { b: '谐振腔:滚雪球', be: 'The cavity: snowball',
    d: '两面镜子让光子来回穿越增益介质,每穿一次克隆一批——几百个来回后,腔内全是步调一致的光子。',
    de: 'Two mirrors bounce photons through the medium again and again; each pass clones a batch — hundreds of rounds later, they all march in step.',
    act: () => { pumpOn = true; document.getElementById('btnPump').classList.add('on'); document.getElementById('btnSeed').click(); } },
  { b: '部分透射:输出', be: 'Output coupler: leaking the beam',
    d: '右镜故意留一点透射:腔内每撞一次漏出一部分,就成了那束方向笔直、颜色单一的激光。',
    de: 'The right mirror leaks a fraction per bounce — out comes the pencil-straight, single-color beam.',
    act: () => { pumpOn = true; document.getElementById('btnPump').classList.add('on'); } },
  { b: '相干性:激光的脾气', be: 'Coherence: the laser temper',
    d: '同相同频同向 = 相干性,双缝干涉用普通光要加缝,激光随手就能干涉;切割、测距、读写光盘全靠这份纪律。',
    de: 'In phase, in step, in line: coherence — why lasers interfere effortlessly and cut, range and read discs.',
    act: () => { pumpOn = true; document.getElementById('btnPump').classList.add('on'); document.getElementById('btnSeed').click(); } },
];
function stepIndex() {
  if (inversion > 0.4 && phCount() > 10) return 3;
  if (inversion > 0.4) return 2;
  if (pumpOn) return 1;
  return 0;
}
function phCount() { let k = 0; for (const p of photons) k += p.alive; return k; }
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elPump = document.getElementById('pump');
const elPumpVal = document.getElementById('pumpVal');
const btnPump = document.getElementById('btnPump');
const btnSeed = document.getElementById('btnSeed');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stP = document.getElementById('stP'), stA = document.getElementById('stA'),
  stO = document.getElementById('stO'), stS = document.getElementById('stS');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnPump.addEventListener('click', () => {
  pumpOn = !pumpOn;
  btnPump.classList.toggle('on', pumpOn);
});
btnSeed.addEventListener('click', () => {
  if (!pumpOn) { pumpOn = true; btnPump.classList.add('on'); }
  for (const p of photons) { if (!p.alive) { p.alive = true; p.p = 0.15; p.dir = 1; break; } }
});
elPump.addEventListener('input', () => { pumpPower = parseInt(elPump.value, 10) / 100; elPumpVal.textContent = elPump.value + '%'; });
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;

  /* 泵浦:激发原子(反转度) */
  if (playing && pumpOn) {
    inversion = clamp(inversion + dts * pumpPower * 0.5, 0, 1);
  } else {
    inversion = clamp(inversion - dts * 0.15, 0, 1);
  }
  const excTarget = Math.round(inversion * N_ATOM * 0.9);
  let exc = excitedCount();
  if (exc < excTarget) { atomState[exc] = 1; }
  else if (exc > excTarget) { atomState[exc - 1] = 0; }
  /* 原子着色 + 泵浦闪烁 */
  for (let i = 0; i < N_ATOM; i++) {
    m4.makeScale(1, 1, 1);
    m4.setPosition(atomPos[i]);
    atomMesh.setMatrixAt(i, m4);
    const mat = atomState[i] ? M.atomE : M.atomG;
    atomMesh.setColorAt(i, mat.color);
  }
  atomMesh.instanceMatrix.needsUpdate = true;
  if (atomMesh.instanceColor) atomMesh.instanceColor.needsUpdate = true;
  M.lamp.emissiveIntensity = pumpOn ? 0.3 + 0.5 * Math.abs(Math.sin(tSim * 8)) : 0.08;

  /* 光子传播;经过激发原子 → 克隆 */
  const span = X_OC - X_HR;
  if (playing) {
    let cloned = 0;
    for (const p of photons) {
      if (!p.alive) continue;
      p.p += p.dir * dts * 0.55;
      if (p.p >= 1) { p.p = 1; p.dir = -1; }
      if (p.p <= 0) { p.p = 0; p.dir = 1; }
      /* 克隆:路过激发原子且有种子 */
      if (inversion > 0.5 && cloned < 2) {
        for (let i = 0; i < N_ATOM; i++) {
          if (!atomState[i]) continue;
          const ax = (atomPos[i].x - X_HR) / span;
          if (Math.abs(ax - p.p) < 0.03) {
            atomState[i] = 0;
            const free = photons.find(q => !q.alive);
            if (free) { free.alive = true; free.p = p.p; free.dir = p.dir; cloned++; }
            break;
          }
        }
      }
    }
    /* 输出:撞 OC 漏出 */
    for (const p of photons) {
      if (p.alive && p.dir > 0 && p.p >= 1) {
        if (Math.random() < 0.3) {
          p.alive = false;
          const o = outPh.find(q => !q.alive);
          if (o) { o.alive = true; o.x = X_OC; }
        } else p.dir = -1;
      }
    }
  }
  /* 渲染光子 */
  photons.forEach((p, i) => {
    if (!p.alive) { m4.makeScale(0.001, 0.001, 0.001); }
    else {
      m4.makeScale(1, 1, 1);
      m4.setPosition(X_HR + p.p * span, Y, 0);
    }
    phMesh.setMatrixAt(i, m4);
  });
  phMesh.instanceMatrix.needsUpdate = true;
  outPh.forEach((o, i) => {
    if (o.alive && playing) { o.x += dts * 5; if (o.x > 9) o.alive = false; }
    m4.makeScale(...(o.alive ? [1, 1, 1] : [0.001, 0.001, 0.001]));
    m4.setPosition(o.x, Y, 0);
    outMesh.setMatrixAt(i, m4);
  });
  outMesh.instanceMatrix.needsUpdate = true;

  /* 输出光束亮度 */
  const nc = phCount();
  M.beam.opacity = clamp(nc / 40, 0, 0.55);
  stP.textContent = nc;
  stA.textContent = excitedCount();
  stO.innerHTML = (clamp(nc / 40, 0, 1) * 500).toFixed(0) + '<small> mW(示意)</small>';
  stS.textContent = !pumpOn && nc === 0 ? L('关机', 'off') : inversion < 0.4 ? L('泵浦中', 'pumping') : nc > 10 ? L('出光!相干光束', 'lasing!') : L('待种子', 'awaiting seed');
  stS.className = 'v ' + (nc > 10 ? 'g' : '');

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
