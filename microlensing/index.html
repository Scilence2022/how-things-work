<style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 微引力透镜(单透镜点质量 + 行星扰动的点透镜近似)
   爱因斯坦半径:θ_E=√(4GM/c² · D_LS/(D_L·D_S))
   透镜星 0.3 M☉ @ 4 kpc,源星 @ 8 kpc → θ_E≈0.55 mas,投影 r_E≈2.2 AU
   放大率:A=(u²+2)/(u√(u²+4)),u=源-透镜角距/θ_E;u₀=0.05 → 峰值 ≈20×
   像位置:y±=(u±√(u²+4))/2(沿源-透镜连线,大像同侧、小像对侧)
   行星扰动:窗函数 ∝ √q(行星爱因斯坦环半径 √q·θ_E),宽度 √q·t_E,
   幅度 ∝ √q × 局部放大率 —— 代替完整二透镜透镜方程的近似 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---------- 渲染器 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04050a);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,600);
/* 视轴右移:事件前半程源星/像 A 在世界 -x 侧,右移 4.2 让它们避开左下面板 */
camera.position.set(-4.2,-4,27);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-4.2,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=80;controls.autoRotateSpeed=0.35;

scene.add(new THREE.AmbientLight(0xaabbdd,0.7));
const key=new THREE.DirectionalLight(0xfff0dd,0.8);key.position.set(8,12,20);scene.add(key);

/* ---------- 背景星场(要盯住的"千万颗背景星") ---------- */
{
  const n=360,arr=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    arr[i*3]=(Math.random()-0.5)*70;arr[i*3+1]=(Math.random()-0.5)*44;arr[i*3+2]=-3-Math.random()*4;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x8fa8cc,size:1.7,sizeAttenuation:false,transparent:true,opacity:0.55})));
}

/* ---------- 爱因斯坦环(θ_E 场景半径 5 单位) ---------- */
const RE=5;
let ringMesh;
{
  const pts=[];
  for(let i=0;i<=160;i++){const a=i/160*2*Math.PI;pts.push(new THREE.Vector3(RE*Math.cos(a),RE*Math.sin(a),0));}
  ringMesh=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.85}));
  scene.add(ringMesh);
}
/* 行星轨道参考圈 r_E≈2.2 AU(冷行星的家) */
const coldRing=(()=>{const pts=[];const rr=RE*1.0;
  for(let i=0;i<=128;i++){const a=i/128*2*Math.PI;pts.push(new THREE.Vector3(rr*Math.cos(a),rr*Math.sin(a),0));}
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.3}));
  l.visible=false;scene.add(l);return l;})();

/* ---------- 透镜星 / 源星 / 行星 ---------- */
const lens=new THREE.Mesh(new THREE.SphereGeometry(0.42,24,16),new THREE.MeshStandardMaterial({color:0xffe9b0,emissive:0xffc860,emissiveIntensity:0.55}));
scene.add(lens);
const src=new THREE.Mesh(new THREE.SphereGeometry(0.3,24,16),new THREE.MeshStandardMaterial({color:0xfff6de,emissive:0xffe9a8,emissiveIntensity:1.0}));
scene.add(src);
const planet=new THREE.Group();
planet.add(new THREE.Mesh(new THREE.SphereGeometry(0.17,16,12),new THREE.MeshStandardMaterial({color:0x9db4d6,emissive:0x4a6fa5,emissiveIntensity:0.4})));
let planetRing;
{
  const pts=[];const rr=0.55;
  for(let i=0;i<=48;i++){const a=i/48*2*Math.PI;pts.push(new THREE.Vector3(rr*Math.cos(a),rr*Math.sin(a),0));}
  planetRing=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.9}));
  planet.add(planetRing);
}
scene.add(planet);
/* 源星轨迹虚线 */
const trackLine=(()=>{
  const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-3.4*RE,0,0),new THREE.Vector3(3.4*RE,0,0)]);
  const l=new THREE.Line(g,new THREE.LineDashedMaterial({color:0x4a5a75,dashSize:0.5,gapSize:0.35,transparent:true,opacity:0.8}));
  l.computeLineDistances();scene.add(l);return l;})();

/* ---------- 像弧(亮度∝放大率,位置沿源-透镜连线) ---------- */
function makeArc(color){
  const SEG=56;
  const pos=new Float32Array((SEG+1)*2*3);
  const idx=[];
  for(let i=0;i<SEG;i++){const a=i*2,b=a+1,c=a+2,d=a+3;idx.push(a,b,c,b,d,c);}
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setIndex(idx);
  const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.8,side:THREE.DoubleSide,depthWrite:false}));
  mesh.frustumCulled=false;
  scene.add(mesh);
  return {mesh,pos,
    set(rOut,rIn,centerAng,span){
      const rm=(rOut+rIn)/2,w=(rOut-rIn)/2;
      for(let i=0;i<=SEG;i++){
        const a=centerAng-span/2+span*i/SEG;
        const cx=Math.cos(a),cy=Math.sin(a);
        pos[i*6]=rm*cx+w*cx;pos[i*6+1]=rm*cy+w*cy;pos[i*6+2]=0;
        pos[i*6+3]=rm*cx-w*cx;pos[i*6+4]=rm*cy-w*cy;pos[i*6+5]=0;
      }
      geo.attributes.position.needsUpdate=true;
    }};
}
const imgA=makeArc(0xffd76e),imgB=makeArc(0x74c0fc);

/* ---------- 弯折光线(源→绕环→观测者,示意) ---------- */
function makeRay(color){
  const N=28;
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
  const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:0.4}));
  line.frustumCulled=false;scene.add(line);
  return {line,geo,N};
}
const rayA=makeRay(0xffd76e),rayB=makeRay(0x74c0fc);
const OBS=new THREE.Vector3(0,-15.5,0);
function updRay(ray,srcP,side){
  const mid=srcP.clone().multiplyScalar(0.45);
  const perp=new THREE.Vector3(-srcP.y,srcP.x,0).normalize().multiplyScalar(side*RE*0.85);
  mid.add(perp);
  for(let i=0;i<ray.N;i++){
    const t=i/(ray.N-1);
    const p=srcP.clone().multiplyScalar((1-t)*(1-t))
      .add(mid.clone().multiplyScalar(2*(1-t)*t))
      .add(OBS.clone().multiplyScalar(t*t));
    ray.geo.attributes.position.setXYZ(i,p.x,p.y,p.z);
  }
  ray.geo.attributes.position.needsUpdate=true;
}

/* ---------- 物理状态 ---------- */
const M_PL_EARTH=3.003e-6/0.3;      /* 1 M⊕ / 0.3 M☉ 透镜 → 质量比 q */
let u0=0.05,qMass=120,dSep=0.9,tE=30,speedDPS=2.5;
let simT=-15,playing=true,labelsOn=true;
let ANow=1,uNow=1,anomalyOn=false;
let playingInit=!(qs.get('pause')==='1');
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){const v=parseFloat(qs.get('speed'));if(Number.isFinite(v))speedDPS=clamp(v,0.5,6);}

const Aof=u=>(u*u+2)/(u*Math.sqrt(u*u+4));
const qOf=()=>qMass*M_PL_EARTH;
const sqq=()=>Math.sqrt(qOf());
/* 行星扰动(点透镜近似):幅度 ∝ √q×局部放大率,宽度 ∝ √q·t_E */
function bumpAt(u,up){
  const w=Math.max(1.1*sqq(),0.015);
  const amp=clamp(8*sqq(),0.03,0.7)*Aof(u);
  return amp*Math.exp(-Math.pow(up/w,4));
}
function totalA(t){
  const u=Math.sqrt(u0*u0+(t/tE)*(t/tE));
  const xp=t/tE;
  const up=Math.sqrt((xp-dSep)*(xp-dSep)+0.12*0.12);
  return Aof(u)+bumpAt(u,up);
}

/* ---------- 标签 ---------- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});
  div.textContent=textFn();
  return o;
}
addLabel(()=>L('前景透镜星 0.3 M☉ @ 4 kpc','Foreground lens 0.3 M☉ @ 4 kpc'),new THREE.Vector3(0,-1.1,0),'o');
addLabel(()=>L('爱因斯坦环 θ_E≈0.55 mas(r_E≈2.2 AU)','Einstein ring θ_E≈0.55 mas (r_E≈2.2 AU)'),new THREE.Vector3(0,RE+1.1,0),'o');
const srcLbl=addLabel(()=>L('背景源星 @ 8 kpc,亮度 ×'+ANow.toFixed(1),'Background source @ 8 kpc, brightness ×'+ANow.toFixed(1)),new THREE.Vector3(0,1,0),'b',()=>true,src);
const plLbl=addLabel(()=>L('行星 '+qMass+' M⊕ (q='+(qOf()*1e4).toFixed(2)+'×10⁻⁴)','Planet '+qMass+' M⊕ (q='+(qOf()*1e4).toFixed(2)+'×10⁻⁴)'),new THREE.Vector3(0,-0.9,0),'r',()=>true,planet);
addLabel(()=>L('观测者','Observer'),OBS.clone().add(new THREE.Vector3(1.6,0.5,0)),'g');
const imgALbl=addLabel(()=>L('像 A','Image A'),new THREE.Vector3(),'o',()=>ANow>1.05);
const imgBLbl=addLabel(()=>L('像 B','Image B'),new THREE.Vector3(),'b',()=>ANow>1.05);
addLabel(()=>L('事件是一次性的:同一颗星不会再次对齐','Events never repeat: this alignment happens once'),new THREE.Vector3(0,13.5,0),'r',()=>simT>tE*2.2);

/* ---------- 步骤 ---------- */
const STEPS=[
  {zh:'几何:源星、透镜星、观测者近乎一线——对准概率约百万分之一',en:'Geometry: source, lens, observer nearly aligned — odds ~1 in a million',
   act(){replay();}},
  {zh:'爱因斯坦环:θ_E 由质量与距离决定,星光被弯成环',en:'Einstein ring: θ_E set by mass and distances — starlight bent into a ring',
   act(){replay();simT=-tE*0.18;}},
  {zh:'对称光变:A=(u²+2)/(u√(u²+4)),u₀=0.05 → 峰值 20×',en:'Symmetric light curve: A=(u²+2)/(u√(u²+4)); u₀=0.05 → peak 20×',
   act(){replay();simT=-tE*0.02;playing=false;syncPlay();}},
  {zh:'行星尖峰:源星扫过行星自己的环(√q·θ_E),叠上几小时~几天的扰动',en:'Planetary spike: the source sweeps the planet\'s own ring (√q·θ_E) — an hours-to-days anomaly stacks on',
   act(){replay();simT=tE*(dSep-0.35);speedDPS=1.2;syncSpeed();}},
  {zh:'不重复:一颗星一生只对齐一次,所以盯住千万颗背景星',en:'No repeats: one alignment per star per lifetime — so watch millions of stars at once',
   act(){replay();simT=tE*2.0;playing=true;syncPlay();}},
  {zh:'冷行星猎手:对几 AU 外不发光、不凌星的冷行星最灵敏',en:'Cold-planet hunter: most sensitive to dim, non-transiting planets at several AU',
   act(){replay();coldRing.visible=!coldRing.visible;simT=-tE*0.3;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function syncPlay(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
function syncSpeed(){document.getElementById('sSpd').value=speedDPS;
  document.getElementById('sSpdVal').textContent=speedDPS.toFixed(1)+' '+L('天/秒','d/s');}
function syncSliders(){
  document.getElementById('sU0').value=u0;
  document.getElementById('sU0Val').textContent=u0.toFixed(2)+' θ_E';
  document.getElementById('sQ').value=qMass;
  document.getElementById('sQVal').textContent=qMass+' M⊕';
  document.getElementById('sD').value=dSep;
  document.getElementById('sDVal').textContent=dSep.toFixed(2)+' θ_E';
  document.getElementById('sTE').value=tE;
  document.getElementById('sTEVal').textContent=tE+' d';
  syncSpeed();
}
function replay(){simT=-tE*0.55;playing=true;syncPlay();}

/* ---------- 光变曲线 ---------- */
const plotCv=document.getElementById('plotCv');
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const acc=css.getPropertyValue('--acc').trim()||'#ffa94d';
  const cTxt=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const padL=44,padR=10,padT=10,padB=26;
  const AMAX=22;
  const xOf=t=>padL+(t/(3*tE)+0.5)*(W-padL-padR);
  const yOf=A=>(H-padB)-clamp((A-1)/(AMAX-1),0,1)*(H-padT-padB);
  /* 峰值区阴影 */
  ctx.fillStyle='rgba(255,169,77,.08)';
  ctx.fillRect(xOf(-0.3*tE),padT,xOf(0.3*tE)-xOf(-0.3*tE),H-padT-padB);
  /* 曲线 */
  ctx.strokeStyle=acc;ctx.lineWidth=2.6;
  ctx.beginPath();
  for(let i=0;i<=260;i++){
    const t=-3*tE+6*tE*i/260;
    const px=xOf(t),py=yOf(totalA(t));
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.stroke();ctx.lineWidth=1;
  /* 轴 */
  ctx.strokeStyle='rgba(128,150,170,.3)';
  ctx.beginPath();ctx.moveTo(padL,yOf(1));ctx.lineTo(W-padR,yOf(1));ctx.stroke();
  ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,H-padB);ctx.stroke();
  ctx.fillStyle=cTxt;ctx.font='12px system-ui';
  for(const m of [-2,-1,0,1,2])ctx.fillText((m>0?'+':'')+m+'t_E',xOf(m*tE)-14,H-padB+16);
  for(const a of [1,10,20])ctx.fillText(a+'×',12,yOf(a)+4);
  /* 动点 */
  ctx.fillStyle=anomalyOn?'#ff6b6b':'#7bd88f';
  ctx.beginPath();ctx.arc(xOf(simT),yOf(ANow),6,0,Math.PI*2);ctx.fill();
}

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();syncSliders();updateStats();drawPlot();
}
function updateStats(){
  const elA=document.getElementById('stA');
  elA.innerHTML=ANow.toFixed(2)+'<small> ×</small>';
  elA.className='v'+(anomalyOn?' bad':ANow>3?' ok':'');
  document.getElementById('stU').innerHTML=uNow.toFixed(3)+'<small> θ_E</small>';
  document.getElementById('stP').innerHTML=qMass+'<small> M⊕ · q='+(qOf()*1e4).toFixed(2)+'e-4</small>';
  document.getElementById('stW').innerHTML=(2*Math.max(1.1*sqq(),0.015)*tE*24).toFixed(1)+'<small> h</small>';
}

/* ---------- 事件 ---------- */
document.getElementById('sU0').addEventListener('input',e=>{u0=+e.target.value;
  document.getElementById('sU0Val').textContent=u0.toFixed(2)+' θ_E';});
document.getElementById('sQ').addEventListener('input',e=>{qMass=+e.target.value;
  document.getElementById('sQVal').textContent=qMass+' M⊕';});
document.getElementById('sD').addEventListener('input',e=>{dSep=+e.target.value;
  document.getElementById('sDVal').textContent=dSep.toFixed(2)+' θ_E';});
document.getElementById('sTE').addEventListener('input',e=>{tE=+e.target.value;
  document.getElementById('sTEVal').textContent=tE+' d';});
document.getElementById('sSpd').addEventListener('input',e=>{speedDPS=+e.target.value;
  document.getElementById('sSpdVal').textContent=speedDPS.toFixed(1)+' '+L('天/秒','d/s');});
document.getElementById('btnReplay').addEventListener('click',replay);
document.getElementById('btnPeak').addEventListener('click',()=>{simT=-tE*0.02;playing=false;syncPlay();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlay();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';
  localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
  drawPlot();
});

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0,accPlot=0;
if(!labelsOn)document.getElementById('tglLabels').checked=false;
if(!playingInit){playing=false;syncPlay();}

function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    simT+=dt*speedDPS;
    if(simT>2.6*tE)simT=-0.55*tE;   /* 演示循环;真实事件不重复 */
  }
  /* 源星位置:x=t/t_E(θ_E 单位),y=u₀ */
  const sx=simT/tE*RE,sy=u0*RE;
  src.position.set(sx,sy,0);
  const u=Math.sqrt(u0*u0+(simT/tE)*(simT/tE));
  uNow=u;
  const xp=simT/tE;
  const up=Math.sqrt((xp-dSep)*(xp-dSep)+0.12*0.12);
  const bump=bumpAt(u,up);
  anomalyOn=bump>0.03;
  ANow=Aof(u)+bump;
  /* 源星亮度与尺寸 */
  const glow=1+0.4*Math.sqrt(Math.max(0,ANow-1));
  src.scale.setScalar(glow);
  src.material.emissiveIntensity=clamp(0.6+0.25*ANow,0.6,4);
  srcLbl.position.set(sx,sy+1.0,0);
  trackLine.position.y=u0*RE;
  /* 行星位置与闪烁 */
  planet.position.set(dSep*RE,u0*RE+0.6,0);
  planetRing.material.opacity=anomalyOn?1:0.35;
  planet.scale.setScalar(anomalyOn?1.35:1);
  /* 像弧:y± 沿源-透镜连线 */
  const phi=Math.atan2(sy,sx);
  const r2=Math.sqrt(u*u+4);
  const yp=(u+r2)/2*RE,ym=(r2-u)/2*RE;
  const aA=clamp(0.15+Aof(u)/2/ANow*0.9+0.15,0.15,1);
  imgA.set(yp+0.3,yp-0.3,phi,2.4);
  imgB.set(ym+0.3,ym-0.3,phi+Math.PI,1.5);
  imgA.mesh.material.opacity=clamp(0.2+0.1*ANow,0.2,0.95);
  imgB.mesh.material.opacity=clamp(0.15+0.08*ANow,0.12,0.85);
  /* 像的位置标签跟随 */
  imgALbl.position.set(yp*Math.cos(phi),yp*Math.sin(phi)+0.7,0);
  imgBLbl.position.set(ym*Math.cos(phi+Math.PI),ym*Math.sin(phi+Math.PI)-0.7,0);
  /* 弯折光线 */
  updRay(rayA,src.position.clone().setZ(0),1);
  updRay(rayB,src.position.clone().setZ(0),-1);
  /* 峰值附近环加亮 */
  ringMesh.material.opacity=clamp(0.3+0.5*(ANow-1)/19,0.3,0.95);
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  accPlot+=dt;if(accPlot>0.12){accPlot=0;drawPlot();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();replay();start();
</script>
