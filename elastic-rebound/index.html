<style>

  :root[data-theme="light"]{

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;

  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;

  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
  /* 应力-时间记录（复发周期） */
  #plot{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:4;
    border:1px solid var(--panel-border);border-radius:10px;background:var(--panel);backdrop-filter:blur(6px)}
  @media(max-width:900px){#plot{display:none}}
</style>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="断层弹性回跳与地震周期 · 攒几十年的应变一瞬间释放" data-en="Elastic Rebound & the Seismic Cycle · Decades of Strain, Seconds of Rupture">断层弹性回跳与地震周期 · 攒几十年的应变一瞬间释放</h1>
  <div class="sub" data-zh="板块以每年几厘米推挤、断层被摩擦锁死→岩体像被拧的橡皮，跨断层道路逐年弯成 S 形；应力超过强度瞬间整段错动几米＝地震，道路折断、地震波荡开；快进时间轴，调断层强度看「小震频繁 vs 大震稀疏」 · 拖动旋转 / 空格运行/暂停" data-en="Plates push a few cm/yr while friction locks the fault → rock twists like a wound rubber band, roads bend into S curves; stress past strength = meters of slip in seconds: quake, broken road, seismic waves; fast-forward time and tune fault strength · drag to orbit / Space = run/pause">板块以每年几厘米推挤、断层被摩擦锁死→岩体像被拧的橡皮，跨断层道路逐年弯成 S 形；应力超过强度瞬间整段错动几米＝地震，道路折断、地震波荡开；快进时间轴，调断层强度看「小震频繁 vs 大震稀疏」 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================= 物理内核（Reid 弹性回跳 + 螺位错应变场） =================
   圣安德烈斯式走滑断层：板块速率 V=35mm/yr；断层锁死时远场位移全部变成
   断层附近的弹性弯曲 B，剪应力 σ=σ_resid+k·B，k≈2.5MPa/m（=剪切模量/ locks
   深度量级，真实量级）。σ ≥ 强度(每轮随机 ±25%) 瞬间整段错动：
   应力降 Δσ=σ−0.55σ_peak，平均错动 S=Δσ/k（真实强震 Δσ 1–10MPa、错动数米）。
   1906 旧金山 M7.9：错动约 6m，Reid 据此提出弹性回跳理论。
   显示的位移场用螺位错型剖面 u(x)∝sign(x)(1−e^{−|x|/W})，锁定宽度 W=2.2，
   错动台阶宽度 W_p=0.25；显示时减去 |x|=8m 处的远场值，画面保持居中。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const V=0.035, K=2.5, W=2.2, WP=0.25, SM=0.35; // m/yr、MPa/m、锁定宽度、台阶宽度、米→单位
let strength=30, strEff=30, speedYr=30;
let years=0, sig=10, O=0, events=0, lastSlip=0;
let quakeAnim=-1, qB=0, qO=0;      // 回跳动画：B→0、O→O+S
let intervals=[], lastQyr=0, flag1906=0;
let playing=true, labelsOn=true;
const sigMin=()=>0.5*strength;       // 显示/柱条基线
const sigRes=()=>0.55*strEff;        // 残余应力（震后水平，约为峰值的 55%）

const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,40,90);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,300);
camera.position.set(0,15,13);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=6; controls.maxDistance=60;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.65));
const key=new THREE.DirectionalLight(0xfff2dd,0.9); key.position.set(8,14,6); scene.add(key);

const world=new THREE.Group(); scene.add(world); // 震动抖这组
const groundM=new THREE.MeshStandardMaterial({color:0x27313b,roughness:0.95});
const rockM=new THREE.MeshStandardMaterial({color:0x2f3a33,roughness:0.95});
const postM=new THREE.MeshStandardMaterial({color:0xd9d2c5,roughness:0.8});
const faultM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.8});
const barF=new THREE.MeshStandardMaterial({color:0x39424d,roughness:0.6});
const barFillM=new THREE.MeshBasicMaterial({color:0x74c0fc});
const tickM=new THREE.MeshBasicMaterial({color:0xff6b6b});
const waveM=new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.8,side:THREE.DoubleSide});

const ground=new THREE.Mesh(new THREE.PlaneGeometry(46,26),groundM);
ground.rotation.x=-Math.PI/2; world.add(ground);
const faultLine=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.02,26),faultM);
faultLine.position.y=0.012; world.add(faultLine);
/* 应变场标记点：21 列 × 13 行，整列随 u(x) 沿 z 错动 */
const NX=21,NZ=13,dots=new THREE.InstancedMesh(new THREE.SphereGeometry(0.07,8,6),rockM,NX*NZ);
world.add(dots);
const dummy=new THREE.Object3D();
const NX0=10, NZ0=6;
/* 跨断层道路：33 根界桩 */
const NP=33, road=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.05,0.05,0.55,6),postM,NP);
world.add(road);
/* 应力柱 */
const barFrame=new THREE.Mesh(new THREE.BoxGeometry(0.5,3.2,0.12),barF);
barFrame.position.set(-13.5,1.6,-3); world.add(barFrame);
const barFill=new THREE.Mesh(new THREE.BoxGeometry(0.36,3.0,0.14),barFillM.clone());
barFill.geometry.translate(0,1.5,0); barFill.position.set(-13.5,0.1,-3); world.add(barFill);
const barTick=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.06,0.2),tickM); world.add(barTick);
/* 地震波环 */
const waves=[];
for(let i=0;i<6;i++){
  const r=new THREE.Mesh(new THREE.RingGeometry(0.9,1.0,48),waveM.clone());
  r.rotation.x=-Math.PI/2; r.position.y=0.03; r.visible=false; world.add(r);
  waves.push({m:r,t:1});
}
function spawnWaves(){
  waves.forEach((w,i)=>setTimeout(()=>{w.t=0;w.m.visible=true;w.m.position.set(0,0.03,0);},i*140));
}
/* ---- 位移场显示（相对远场归零） ---- */
function uDisp(x,B,Ov){
  const s=x<0?1:-1, ax=Math.abs(x);
  const bend=(B/2)*(Math.exp(-8/W)-Math.exp(-ax/W));
  const step=(Ov/2)*(Math.exp(-8/WP)-Math.exp(-ax/WP));
  return s*(bend+step)*SM;
}
let Bvis=0,Ovis=0; // 显示用（含回跳动画插值）
function updateField(){
  for(let i=0;i<NX;i++){
    const x=-NX0+2*NX0*i/(NX-1), dz=uDisp(x,Bvis,Ovis);
    for(let j=0;j<NZ;j++){
      const z=-NZ0+2*NZ0*j/(NZ-1);
      dummy.position.set(x,0.06,z+dz);
      dummy.updateMatrix();
      dots.setMatrixAt(i*NZ+j,dummy.matrix);
    }
  }
  dots.instanceMatrix.needsUpdate=true;
  for(let i=0;i<NP;i++){
    const x=-8+i*0.5, dz=uDisp(x,Bvis,Ovis);
    dummy.position.set(x,0.28,dz);
    dummy.rotation.set(0,0,dz*0.25); // 桩子随剪切歪斜
    dummy.updateMatrix();
    road.setMatrixAt(i,dummy.matrix);
  }
  road.instanceMatrix.needsUpdate=true;
}

/* ---- CSS2D 标签 ---- */
const labelReg=[];
function addLabel(fn,pos,cls,vis=()=>true,parent){
  const div=document.createElement('div');div.className='lbl '+(cls||'');
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||world).add(o);
  labelReg.push({o,fn,vis});div.textContent=fn();return o;
}
addLabel(()=>L('断层：摩擦锁死','Fault: friction locked'),new THREE.Vector3(0,0.4,7.5),'r');
addLabel(()=>L('跨断层道路：S 形=应变积累，折断=错动','Road: S-bend = strain, snap = slip'),new THREE.Vector3(7.5,0.4,3),'o');
addLabel(()=>L('板块拖曳 35 mm/yr（远处整体平移）','Plate drag 35 mm/yr (far field moves)'),new THREE.Vector3(-10.5,0.4,-7),'b');
addLabel(()=>L('≈1906 旧金山：M7.9，错动约 6 m','≈1906 San Francisco: M7.9, ~6 m slip'),new THREE.Vector3(0,0.5,-8.5),'g',()=>flag1906>0);
addLabel(()=>L('应力柱：红线=本轮强度','Stress bar: red tick = this cycle\'s strength'),new THREE.Vector3(-13.5,3.6,-3),'b');

/* ---- 主题/语言/步骤 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
  scene.fog.color.setHex(THEME==='dark'?0x101418:0xe9e4dc);
  refreshPlotColors();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}
const STEPS=[
 {zh:'板块以每年几厘米持续推挤——断层却被摩擦锁死',en:'Plates push a few cm per year — friction locks the fault'},
 {zh:'岩体像被拧的橡皮：跨断层的道路/围栏逐年弯成 S 形',en:'Rock twists like a wound rubber band: roads bend into S curves'},
 {zh:'应力逼近断层摩擦强度——应力柱绷红（几十年到上百年）',en:'Stress climbs toward fault strength — decades to centuries'},
 {zh:'瞬间整段错动几米：弹性回跳＝地震，道路当场折断',en:'Meters of slip in seconds: elastic rebound = the quake; the road snaps'},
 {zh:'地震波荡开；应力影转移给邻段，埋下下一次的种子',en:'Waves radiate; the stress shadow loads the next segment'},
 {zh:'复发周期：弱断层→小震频繁；强断层→大震稀疏',en:'Recurrence: weak fault = frequent small; strong = rare big'},
 {zh:'1906 旧金山：圣安德烈斯错动约 6 m，Reid 由此提出弹性回跳理论',en:'1906 SF: ~6 m offset on San Andreas; Reid founded elastic-rebound theory'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>gotoStep(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function gotoStep(i){
  activeStep=i;syncSteps();
  if(i===0){resetAll();speedYr=6;document.getElementById('sSpd').value=6;playing=true;}
  if(i===1){resetAll();sig=sigRes()+(strEff-sigRes())*0.5;playing=false;}
  if(i===2){resetAll();sig=strEff*0.97;playing=false;}
  if(i===3){sig=strEff*1.001;playing=true;}
  if(i===4){resetAll();sig=strEff*1.001;playing=true;}
  if(i===5){resetAll();strength=15;strEff=15;document.getElementById('sStr').value=15;playing=true;}
  if(i===6){resetAll();strength=45;strEff=45;document.getElementById('sStr').value=45;playing=true;}
  document.getElementById('sStrVal').textContent=strength+' MPa';
  document.getElementById('sSpdVal').textContent=speedYr+' 年/秒';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
}
function resetAll(){
  years=0;O=0;events=0;lastSlip=0;intervals=[];lastQyr=0;
  strEff=strength*(0.85+0.3*Math.random());
  sig=sigRes();quakeAnim=-1;hist.length=0;
}
function updateStats(){
  document.getElementById('stT').innerHTML=Math.round(years)+'<small> 年</small>';
  document.getElementById('stS').innerHTML=sig.toFixed(1)+'<small> MPa</small>';
  document.getElementById('stO').innerHTML=O.toFixed(1)+'<small> m</small>';
  document.getElementById('stN').textContent=events;
}

/* ---- 应力-时间记录 ---- */
const plot=document.getElementById('plot'),pctx=plot.getContext('2d');
const hist=[];
let PC={};
function refreshPlotColors(){
  PC={txt:THEME==='dark'?'#9fb0c3':'#5b6b7d',acc:THEME==='dark'?'#ffa94d':'#e8590c',
      red:THEME==='dark'?'#ff6b6b':'#c92a2a',grid:THEME==='dark'?'rgba(255,255,255,.10)':'rgba(15,25,40,.14)'};
}
function drawPlot(){
  const W=plot.width,H=plot.height,px=36,py=16,pw=W-px-10,ph=H-py-30;
  pctx.clearRect(0,0,W,H);
  pctx.font='11px sans-serif';pctx.fillStyle=PC.txt;
  const avg=intervals.length?(intervals.reduce((a,b)=>a+b,0)/intervals.length):0;
  const mx=intervals.length?Math.max(...intervals):0;
  pctx.fillText(L(`应力-时间记录：锯齿=地震循环（复发 平均 ${avg.toFixed(0)} yr / 最长 ${mx.toFixed(0)} yr）`,
                  `Stress vs time: sawtooth = quakes (recurrence avg ${avg.toFixed(0)} yr / max ${mx.toFixed(0)} yr)`),px,11);
  const SMAX=60;
  const Y=v=>py+ph*(1-v/SMAX);
  pctx.strokeStyle=PC.grid;pctx.strokeRect(px,py,pw,ph);
  hist.forEach((p,i)=>{
    const x=px+pw*i/(hist.length-1||1);
    if(p.q){pctx.strokeStyle=PC.red;pctx.beginPath();pctx.moveTo(x,py);pctx.lineTo(x,py+ph);pctx.stroke();}
  });
  pctx.strokeStyle=PC.acc;pctx.lineWidth=1.6;pctx.beginPath();
  hist.forEach((p,i)=>{
    const x=px+pw*i/(hist.length-1||1), y=Y(p.s);
    i?pctx.lineTo(x,y):pctx.moveTo(x,y);
  });
  pctx.stroke();pctx.lineWidth=1;
  pctx.fillStyle=PC.txt;pctx.fillText('MPa',4,py+8);
  pctx.fillText('时间 →',W-46,H-4);
}
/* ---- 破裂：应力降到残余(峰值×0.55)，应力降决定错动量 ---- */
let shake=0;
function quake(){
  const post=sigRes();                 // 震后残余应力
  const S=Math.max(0.5,(sig-post)/K);  // S=Δσ/k，真实量级：Δσ 几 MPa → 错动几米
  lastSlip=S;O+=S;events++;
  if(lastQyr>0)intervals.push(years-lastQyr);
  lastQyr=years;
  qB=Math.max(0,(sig-sigMin()))/K;     // 动画：弯曲 B → 残余弯曲，台阶 += S
  qO=S;quakeAnim=0;
  sig=post;
  strEff=strength*(0.75+0.5*Math.random()); // 每轮强度抖动 → 复发周期有涨落
  spawnWaves();shake=1;
  if(S>=5.5)flag1906=5;                // 1906 量级注脚
  hist.push({s:sig,q:true});if(hist.length>320)hist.shift();
}

/* ---- 交互 ---- */
document.getElementById('btnQuake').addEventListener('click',()=>{if(quakeAnim<0){sig=strEff*1.001;quake();}});
document.getElementById('btnReset').addEventListener('click',resetAll);
document.getElementById('sSpd').addEventListener('input',e=>{
  speedYr=+e.target.value;document.getElementById('sSpdVal').textContent=speedYr+' 年/秒';});
document.getElementById('sStr').addEventListener('input',e=>{
  strength=+e.target.value;strEff=strength;document.getElementById('sStrVal').textContent=strength+' MPa';});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1')playing=false;
if(qp.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(parseFloat(qp.get('speed'))>0){speedYr=clamp(parseFloat(qp.get('speed')),1,80);
  document.getElementById('sSpd').value=speedYr;document.getElementById('sSpdVal').textContent=speedYr+' 年/秒';}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0,accH=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    const dy=speedYr*dt;
    years+=dy;
    sig+=K*V*dy;                       // 板块拖曳 → 应力线性攒升
    if(sig>=strEff)quake();
    accH+=dy;
    if(accH>Math.max(0.5,speedYr*0.12)){accH=0;hist.push({s:sig,q:false});if(hist.length>320)hist.shift();}
  }
  /* 回跳动画：弯曲应变在 0.45s 内跳成台阶 */
  if(quakeAnim>=0){
    quakeAnim+=dt;
    const t=Math.min(1,quakeAnim/0.45);
    Bvis=qB*(1-t);
    Ovis=O-qO+qO*t;
    if(quakeAnim>0.6)quakeAnim=-1;
  }else{
    Bvis=Math.max(0,(sig-sigMin()))/K;
    Ovis=Math.min(O,12);               // 台阶显示封顶 12m，防跑出画面
  }
  updateField();
  /* 应力柱 */
  const span=Math.max(1,strEff*1.12-sigMin());
  barFill.scale.y=clamp((sig-sigMin())/span,0.02,1);
  const f=barFill.scale.y;
  barFillM.color.setHex(f>0.82?0xff6b6b:(f>0.55?0xffa94d:0x74c0fc));
  barTick.position.set(-13.5,0.1+(strEff-sigMin())/span*3.0,-3);
  /* 波纹 */
  waves.forEach(w=>{
    if(w.t<1){w.t=Math.min(1,w.t+dt*0.7);
      const s=0.8+w.t*13;
      w.m.scale.set(s,1,s);w.m.material.opacity=0.8*(1-w.t);
      w.m.visible=w.t<1;}
  });
  if(flag1906>0)flag1906-=dt;
  if(shake>0.01){world.position.set((Math.random()-0.5)*shake*0.6,0,(Math.random()-0.5)*shake*0.4);shake*=Math.pow(0.002,dt);}
  else world.position.set(0,0,0);
  acc+=dt;if(acc>0.1){acc=0;updateStats();drawPlot();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.fn();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();resetAll();buildSteps();activeStep=0;syncSteps();drawPlot();start();
</script>
</body>
