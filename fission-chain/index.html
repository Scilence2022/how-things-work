<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核裂变链式反应 · 一颗中子点燃的雪崩</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,169,77,.9); color: #ffe0ae; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(232,89,12,.9); color: #b34408; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(27,124,160,.9); color: #1b7ca0; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #alarm { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 6;
    display: none; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 999px;
    background: rgba(224,49,49,.16); border: 1px solid rgba(255,107,107,.75); color: #ffa8a8;
    font-size: 13px; font-weight: 700; letter-spacing: 1px; backdrop-filter: blur(6px);
    animation: blink 1s steps(2) infinite; }
  :root[data-theme="light"] #alarm { color: #c92a2a; }
  @keyframes blink { 50% { opacity: .55; } }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #69db7c; }
  #stats .v.b { color: #74c0fc; }
  #stats .v.r { color: #ff6b6b; }
  #stats .v.y { color: #ffd43b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,169,77,.6); background: rgba(255,169,77,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(232,89,12,.55); background: rgba(232,89,12,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 86px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="核裂变链式反应:一颗中子点燃的雪崩" data-en="Fission chain reaction: the avalanche lit by one neutron">核裂变链式反应:一颗中子点燃的雪崩</h1>
  <div class="sub" data-zh="一个中子被 U-235 俘获 → U-236* 激发振荡 → 裂成两块碎片 + 2~3 个新中子 → 1→3→9→27 代际雪崩;慢化剂把快中子刹成热中子,控制棒吃掉多余的中子,k=1 才自持 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A neutron captured by U-235 → excited U-236* wobbles → splits into two fragments + 2–3 fresh neutrons → a 1→3→9→27 generational avalanche; the moderator brakes fast neutrons, control rods eat the surplus, and only k=1 sustains · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">一个中子被 U-235 俘获 → U-236* 激发振荡 → 裂成两块碎片 + 2~3 个新中子 → 1→3→9→27 代际雪崩;慢化剂把快中子刹成热中子,控制棒吃掉多余的中子,k=1 才自持 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="alarm"></div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="代数" data-en="generation">代数</span><span class="v" id="stGen">—</span>
  <span class="k" data-zh="裂变率" data-en="fission rate">裂变率</span><span class="v y" id="stRate">—</span>
  <span class="k" data-zh="倍增系数 k_eff" data-en="k_eff">倍增系数 k_eff</span><span class="v g" id="stK">—</span>
  <span class="k" data-zh="自由中子" data-en="free neutrons">自由中子</span><span class="v" id="stN">0</span>
  <span class="k" data-zh="累计能量" data-en="cum. energy">累计能量</span><span class="v y" id="stE">0</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnIgnite" data-zh="点火 · 注入中子" data-en="ignite · inject neutron">点火 · 注入中子</button>
    <button class="abtn on" id="btnMod">慢化剂:开</button>
    <button class="abtn" id="btnReset" data-zh="重置" data-en="reset">重置</button>
  </div>
  <div class="row"><label data-zh="控制棒深度" data-en="Rod depth">控制棒深度</label><input id="ins" type="range" min="0" max="100" step="1" value="60"><span class="val" id="insVal">60%</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div class="row"><label data-zh="进度(快进,秒)" data-en="Fast-forward (s)">进度(快进,秒)</label><input id="prog" type="range" min="0" max="600" step="1" value="0"><span class="val" id="progVal">0 s</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../radioactive-decay/" data-zh="衰变:单个核的随机一生" data-en="decay: one nucleus's random life">衰变:单个核的随机一生</a>
    <a href="../nuclear-reactor/" data-zh="把 k 钉在 1 的工程" data-en="engineering that pins k at 1">把 k 钉在 1 的工程</a>
    <a href="../kinetic-theory/" data-zh="粒子碰撞的统计学" data-en="statistics of particle collisions">粒子碰撞的统计学</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rand = (a, b) => a + Math.random() * (b - a);
function randUnit() {
  const a = Math.random() * Math.PI * 2, b = Math.acos(Math.random() * 2 - 1);
  return new THREE.Vector3(Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a));
}

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1a202a);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('核裂变链式反应 · 一颗中子点燃的雪崩', 'Fission chain reaction · avalanche lit by one neutron');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  updateModBtn();
  updateFormula();
  drawDial();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.4, 3.9, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(4, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.2,
    emissive: color, emissiveIntensity: 0.05, ...opts });
}
const M = {
  floor: mat(0x1a202a, { roughness: 0.92, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  core: new THREE.MeshStandardMaterial({ color: 0x9db4d6, transparent: true, opacity: 0.045,
    roughness: 0.2, metalness: 0.6, side: THREE.DoubleSide, depthWrite: false }),
  rod: new THREE.MeshStandardMaterial({ color: 0x845ef7, roughness: 0.35, metalness: 0.5,
    emissive: 0x845ef7, emissiveIntensity: 0.22 }),
  mod: new THREE.MeshStandardMaterial({ color: 0x3bc9db, transparent: true, opacity: 0.07,
    roughness: 0.15, depthWrite: false }),
};

/* ================= 堆芯:U-235 晶格 6×6×4 ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.16, 6), M.floor);
floor.position.y = -0.08;
scene.add(floor);

const coreBox = new THREE.Mesh(new THREE.BoxGeometry(3.4, 3.4, 2.2), M.core);
coreBox.position.set(0, 1.7, 0);
scene.add(coreBox);
const coreEdge = new THREE.LineSegments(new THREE.EdgesGeometry(coreBox.geometry),
  new THREE.LineBasicMaterial({ color: 0x5b6b7d, transparent: true, opacity: 0.55 }));
coreEdge.position.copy(coreBox.position);
scene.add(coreEdge);

const NX = 6, NY = 6, NZ = 4, SP = 0.55, N_ALL = NX * NY * NZ;
const nucs = [];
for (let ix = 0; ix < NX; ix++) for (let iy = 0; iy < NY; iy++) for (let iz = 0; iz < NZ; iz++) {
  nucs.push({
    p: new THREE.Vector3((ix - (NX - 1) / 2) * SP, 1.7 + (iy - (NY - 1) / 2) * SP, (iz - (NZ - 1) / 2) * SP),
    st: 0, t: 0, willFis: false, gen: 0, seed: rand(0, 6.28), ft: -9, hc: new THREE.Color(),
  });
}
const nucMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.15, 12, 10),
  new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.55 }), N_ALL);
nucMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N_ALL * 3), 3);
scene.add(nucMesh);
const halo = new THREE.InstancedMesh(new THREE.SphereGeometry(0.22, 10, 8),
  new THREE.MeshBasicMaterial({ blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }), N_ALL);
halo.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N_ALL * 3), 3);
scene.add(halo);

/* 控制棒 3×3 + 驱动轭(随插入深度升降) */
const R_POS = [];
for (const x of [-0.825, 0, 0.825]) for (const z of [-0.825, 0, 0.825]) R_POS.push([x, z]);
const yoke = new THREE.Group();
const rodGeo = new THREE.CylinderGeometry(0.085, 0.085, 3.6, 10);
for (const [x, z] of R_POS) {
  const r = new THREE.Mesh(rodGeo, M.rod);
  r.position.set(x, 0, z);
  yoke.add(r);
}
const plate = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.12, 2.4), M.frame);
plate.position.y = 1.95;
yoke.add(plate);
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 8), M.frame);
shaft.position.y = 3.1;
yoke.add(shaft);
scene.add(yoke);

/* 慢化剂(水) */
const modBox = new THREE.Mesh(new THREE.BoxGeometry(3.3, 3.3, 2.1), M.mod);
modBox.position.set(0, 1.7, 0);
scene.add(modBox);

/* ---------------- 状态与物理参数 ---------------- */
/* 每个中子的归宿按概率表决定:理论 k = ν·p_f·(1 − 棒吸收 − 泄漏),实测 k = 每个死亡中子「子女」数的滑窗均值 */
const NU = 2.43, P_TWO = 0.565, P_FIS = 0.86, A_MAX = 0.94, LEAK = 0.12, F_LEAK = 0.60;
const rodWorth = u => u - Math.sin(2 * Math.PI * u) / (2 * Math.PI);      // 积分棒价值 S 曲线
const rodBottom = () => 3.45 * (1 - ins);                                  // 棒尖高度(从顶部插入)
const coverF = u => clamp((3.45 * u - 0.05) / 3.35, 0, 1);                 // 棒覆盖堆芯的份额
const aEff = (u, fast) => A_MAX * rodWorth(u) * coverF(u) * (fast ? 0.35 : 1);
const kTargetOf = u => NU * P_FIS * clamp(1 - aEff(u, !modOn) - (modOn ? LEAK : F_LEAK), 0, 2);
const kTarget = () => kTargetOf(ins);

const kbuf = new Float32Array(64); let kbi = 0, kbn = 0, kDisp = 0, kInit = false;
function pushK(c) { kbuf[kbi] = c; kbi = (kbi + 1) % kbuf.length; if (kbn < kbuf.length) kbn++; }
function kMeas() { if (!kbn) return kTarget(); let s = 0; for (let i = 0; i < kbn; i++) s += kbuf[i]; return s / kbn; }

/* ================= 事件:中子的归宿(k 的来源) ================= */
function nearestRod(p) {
  let best = R_POS[0], bd = 1e9;
  for (const [x, z] of R_POS) {
    const d = (p.x - x) ** 2 + (p.z - z) ** 2;
    if (d < bd) { bd = d; best = [x, z]; }
  }
  return best;
}
function nearestIntact(p) {
  let bi = -1, bd = 1.3 * 1.3;
  for (let i = 0; i < N_ALL; i++) {
    if (nucs[i].st !== 0) continue;
    const d = p.distanceToSquared(nucs[i].p);
    if (d < bd) { bd = d; bi = i; }
  }
  return bi;
}
function interact(n) {   // 返回 true = 中子被消耗
  const a = A_MAX * rodWorth(ins) * (n.fast ? 0.35 : 1) * (n.p.y > rodBottom() ? 1 : 0);
  const lk = n.fast ? F_LEAK : LEAK;
  const r = Math.random();
  if (r < a) {                            // 被控制棒吸收(灰闪,0 个子女)
    const [x, z] = nearestRod(n.p);
    n.p.x += (x - n.p.x) * 0.85; n.p.z += (z - n.p.z) * 0.85;
    spawnFx(n.p, 0x9aa5b1, 0.15, 0.5);
    pushK(0);
    return true;
  }
  if (r < a + lk) {                       // 泄漏出堆(0 个子女)
    n.leaving = true; n.life = 0.7;
    n.dir.set(n.p.x, rand(-0.2, 0.4), n.p.z).normalize();
    if (n.dir.lengthSq() < 0.01) n.dir.copy(randUnit());
    pushK(0);
    return false;
  }
  const ni = nearestIntact(n.p);
  if (ni < 0) {                           // 附近没有完好核 → 漏走
    n.leaving = true; n.life = 0.7;
    n.dir.copy(randUnit());
    pushK(0);
    return false;
  }
  const nuc = nucs[ni];                   // 俘获 → U-236* 激发态
  nuc.st = 1; nuc.t = 0.45; nuc.gen = n.gen;
  nuc.willFis = Math.random() < P_FIS;
  excitedCount++;
  spawnFx(nuc.p, 0xfff3bf, 0.11, 0.3);
  return true;
}
function doFission(nuc) {
  nuc.st = 2; nuc.t = rand(4, 6); nuc.ft = tSim;
  nuc.hc = genColor(nuc.gen);
  excitedCount--;
  spawnFx(nuc.p, 0xffffff, 0.5, 0.45);            // 能量白闪
  spawnFx(nuc.p, nuc.hc.getHex(), 0.34, 0.85);    // 该代的彩色光晕
  spawnFrags(nuc.p, nuc.gen);
  const j = Math.random() < P_TWO ? 2 : 3;        // ν̄ = 2.43
  for (let c = 0; c < j; c++) spawnNeu(nuc.p, nuc.gen + 1);
  fissionsT.push(tSim); fissionsTotal++; lastFis = tSim; energy += 200;
  pushK(j);
}
function settle(nuc) {                            // 辐射俘获:放 γ 退激(0 个子女)
  nuc.st = 0; excitedCount--;
  spawnFx(nuc.p, 0x91a7ff, 0.09, 0.35);
  pushK(0);
}

/* ================= 模拟一步(快进复用) ================= */
function simStep(dts) {
  tSim += dts;
  ins += clamp(insTarget - ins, -0.6 * dts, 0.6 * dts);
  if (neus.length === 0 && excitedCount === 0 && tSim - lastIgnite > 2.5) ignite(1);   // 循环演示
  for (const nuc of nucs) {
    if (nuc.st === 1) {
      nuc.t -= dts;
      if (nuc.t <= 0) { if (nuc.willFis) doFission(nuc); else settle(nuc); }
    } else if (nuc.st === 2) {
      nuc.t -= dts;
      if (nuc.t <= 0) nuc.st = 0;           // 「新燃料」补位,维持晶格
    }
  }
  for (let i = neus.length - 1; i >= 0; i--) {
    const n = neus[i];
    if (n.leaving) {
      n.p.addScaledVector(n.dir, 2.4 * dts);
      n.life -= dts;
      if (n.life <= 0) killNeu(i);
      continue;
    }
    if (!n.fast) n.dir.lerp(randUnit(), 0.08).normalize();
    n.p.addScaledVector(n.dir, (n.fast ? 3.4 : 1.0) * dts);
    if (modOn && n.fast && Math.random() < 1 - Math.exp(-3 * dts)) {   // 慢化剂碰撞:3 次后热化
      n.slow++;
      spawnFx(n.p, 0x66d9e8, 0.1 + 0.02 * n.slow, 0.4);
      if (n.slow >= 3) { n.fast = false; spawnFx(n.p, 0x66d9e8, 0.24, 0.55); }
    }
    const lam = n.fast ? 0.8 : 2.8;          // 热中子截面大 → 相互作用频繁
    if (Math.random() < 1 - Math.exp(-lam * dts)) {
      if (interact(n)) { killNeu(i); continue; }
    }
    if (!n.leaving) {                        // 堆芯壁反射
      if (n.p.x < -1.7) { n.p.x = -1.7; n.dir.x = Math.abs(n.dir.x); }
      if (n.p.x > 1.7) { n.p.x = 1.7; n.dir.x = -Math.abs(n.dir.x); }
      if (n.p.y < 0.06) { n.p.y = 0.06; n.dir.y = Math.abs(n.dir.y); }
      if (n.p.y > 3.34) { n.p.y = 3.34; n.dir.y = -Math.abs(n.dir.y); }
      if (n.p.z < -1.1) { n.p.z = -1.1; n.dir.z = Math.abs(n.dir.z); }
      if (n.p.z > 1.1) { n.p.z = 1.1; n.dir.z = -Math.abs(n.dir.z); }
    }
  }
}

function stepIndex() {
  if (neus.length === 0 && excitedCount === 0) return fissionsTotal > 0 ? 5 : 0;
  if (runawayG) return 5;
  if (excitedCount > 0) return 1;
  if (tSim - lastFis < 0.9) return 2;
  if (Math.abs(kShowG - 1) <= 0.04 && fissionsTotal > 2) return 4;
  if (modOn && thermalPresentG) return 3;
  if (fissionsTotal === 0) return 0;
  return kShowG < 0.97 ? 5 : 4;
}

const dial = document.createElement('canvas');
dial.width = 300; dial.height = 104;

document.getElementById('stats').appendChild(dial);
const dctx = dial.getContext('2d');
function drawDial() {
  const W = 300, H = 104, cx = 150, cy = 92, R = 72;
  dctx.clearRect(0, 0, W, H);
  dctx.fillStyle = getComputedStyle(htmlEl).getPropertyValue('--cv-pill').trim() || 'rgba(13,17,24,.8)';
  dctx.beginPath(); dctx.roundRect(0, 0, W, H, 8); dctx.fill();
  const ang = k => Math.PI * (1 - clamp(k, 0, 2) / 2);
  const arc = (k0, k1, color, w) => {
    dctx.strokeStyle = color; dctx.lineWidth = w;
    dctx.beginPath(); dctx.arc(cx, cy, R, -ang(k0), -ang(k1)); dctx.stroke();
  };
  arc(0, 0.9, 'rgba(116,192,252,.30)', 10);
  arc(0.9, 1.1, 'rgba(105,219,124,.55)', 10);
  arc(1.1, 2, 'rgba(255,107,107,.38)', 10);
  dctx.lineWidth = 1;
  dctx.font = '9px system-ui'; dctx.textAlign = 'center';
  for (const kv of [0, 1, 2]) {
    const a = ang(kv);
    dctx.strokeStyle = 'rgba(199,210,222,.6)';
    dctx.beginPath();
    dctx.moveTo(cx + Math.cos(a) * (R - 7), cy - Math.sin(a) * (R - 7));
    dctx.lineTo(cx + Math.cos(a) * (R + 7), cy - Math.sin(a) * (R + 7));
    dctx.stroke();
    dctx.fillStyle = 'rgba(199,210,222,.85)';
    dctx.fillText('k=' + kv, cx + Math.cos(a) * (R + 16), cy - Math.sin(a) * (R + 16) + 3);
  }
  const a = ang(kShowG);
  dctx.strokeStyle = '#ffd43b'; dctx.lineWidth = 2.5;
  dctx.beginPath(); dctx.moveTo(cx, cy); dctx.lineTo(cx + Math.cos(a) * (R - 11), cy - Math.sin(a) * (R - 11)); dctx.stroke();
  dctx.fillStyle = '#ffd43b';
  dctx.beginPath(); dctx.arc(cx, cy, 3.5, 0, 7); dctx.fill();
  dctx.fillStyle = 'rgba(199,210,222,.9)'; dctx.font = '10px system-ui';
  dctx.fillText(runawayG ? L('失控 RUNAWAY', 'RUNAWAY') : Math.abs(kShowG - 1) <= 0.03 ? L('临界 critical', 'critical')
    : kShowG < 1 ? L('次临界 subcritical', 'subcritical') : L('超临界 supercritical', 'supercritical'), cx, 15);
}

function updInsVal() { elInsVal.textContent = `${Math.round(insTarget * 100)}% · k≈${kTargetOf(insTarget).toFixed(2)}`; }
function updateModBtn() {
  btnMod.textContent = L(modOn ? '慢化剂:开' : '慢化剂:关', modOn ? 'moderator: on' : 'moderator: off');
  btnMod.classList.toggle('on', modOn);
}
function updateFormula() {
  const a = aEff(ins, !modOn), lk = modOn ? LEAK : F_LEAK;
  formulaEl.innerHTML = L(
    `<b>k = ν·p_f·(1 − a棒 − 泄漏)</b> = 2.43 × 0.86 × (1 − ${a.toFixed(2)} − ${lk.toFixed(2)}) ≈ <b>${kTarget().toFixed(2)}</b>　实测(滑窗均值) ${kbn >= 12 ? kDisp.toFixed(3) : '—'}<br>` +
    (modOn ? '慢化剂开:快中子 3 次碰撞 → 热中子,俘获截面 ×585' : '慢化剂关:快中子难以被俘获,大多漏失 → k 上限 ≈0.84'),
    `<b>k = ν·p_f·(1 − a_rods − leak)</b> = 2.43 × 0.86 × (1 − ${a.toFixed(2)} − ${lk.toFixed(2)}) ≈ <b>${kTarget().toFixed(2)}</b> · measured (sliding avg) ${kbn >= 12 ? kDisp.toFixed(3) : '—'}<br>` +
    (modOn ? 'moderator on: 3 collisions → thermal neutrons, capture ×585' : 'moderator off: fast neutrons rarely captured, mostly leak → k caps ≈0.84'));
}
function resetSim() {
  neus.length = 0; excitedCount = 0; energy = 0; fissionsTotal = 0;
  lastFis = -9; lastIgnite = tSim; fissionsT.length = 0;
  kbi = 0; kbn = 0; kInit = false;
  for (const n of nucs) { n.st = 0; n.t = 0; }
  for (const f of frags) f.life = 0;
}
function setIns(u) { insTarget = clamp(u, 0, 1); elIns.value = Math.round(insTarget * 100); updInsVal(); }
function setMod(b) { modOn = b; modBox.visible = b; updateModBtn(); refreshLabels(); updateFormula(); }
function setSpd(v) { speed = v; elSpd.value = v; elSpdVal.textContent = v.toFixed(1) + '×'; }

elIns.addEventListener('input', () => { insTarget = parseInt(elIns.value, 10) / 100; updInsVal(); });
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elProg.addEventListener('input', () => {
  const v = parseInt(elProg.value, 10);
  if (v > tSim) { let guard = 0; while (tSim < v && guard++ < 30000) simStep(0.05); }
  elProgVal.textContent = Math.round(tSim) + ' s';
});
btnIgnite.addEventListener('click', () => ignite(1));
btnMod.addEventListener('click', () => setMod(!modOn));
btnReset.addEventListener('click', () => { resetSim(); ignite(1); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0, thermalPresentG = false;
const dummy = new THREE.Object3D();
const m4 = new THREE.Matrix4(), qTmp = new THREE.Quaternion(), q0 = new THREE.Quaternion();
const vY = new THREE.Vector3(0, 1, 0), sElong = new THREE.Vector3(1, 1.9, 1), sOne = new THREE.Vector3(1, 1, 1);
const colFast = new THREE.Color(0xffa94d), colTh = new THREE.Color(0x66d9e8);
const colBase = new THREE.Color(0x7f9edb), colN = new THREE.Color(), colH = new THREE.Color();
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) simStep(dts);

  yoke.position.y = 5.25 - 3.45 * ins;

  /* 核:完好 / 激发(白炽+抖动) / 已裂变(暗缩,余晖=该代颜色) */
  for (let i = 0; i < N_ALL; i++) {
    const nc = nucs[i];
    dummy.position.copy(nc.p);
    dummy.rotation.set(0, 0, 0);
    let s = 1;
    if (nc.st === 1) {
      const w = Math.sin(tSim * 46 + nc.seed * 7);
      s = 1 + 0.3 * Math.abs(w);
      dummy.position.x += 0.02 * Math.sin(tSim * 61 + nc.seed);
      dummy.position.y += 0.02 * Math.sin(tSim * 53 + nc.seed * 3);
      colN.setRGB(1, 0.93, 0.72);
      colH.setRGB(0.9, 0.75, 0.5).multiplyScalar(0.35 + 0.6 * Math.abs(w));
    } else if (nc.st === 2) {
      s = 0.6;
      colN.setHex(0x232a38);
      colH.copy(nc.hc).multiplyScalar(1.5 * Math.exp(-(tSim - nc.ft) * 1.9));
    } else {
      colN.copy(colBase);
      colH.setRGB(0, 0, 0);
    }
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    nucMesh.setMatrixAt(i, dummy.matrix);
    nucMesh.setColorAt(i, colN);
    dummy.scale.setScalar(s * 1.7);
    dummy.updateMatrix();
    halo.setMatrixAt(i, dummy.matrix);
    halo.setColorAt(i, colH);
  }
  nucMesh.instanceMatrix.needsUpdate = true;
  nucMesh.instanceColor.needsUpdate = true;
  halo.instanceMatrix.needsUpdate = true;
  halo.instanceColor.needsUpdate = true;

  /* 中子 + 轨迹 */
  let k = 0, genLive = 0;
  thermalPresentG = false;
  for (const n of neus) {
    if (n.fast) {
      qTmp.setFromUnitVectors(vY, n.dir);
      m4.compose(n.p, qTmp, sElong);
      neuMesh.setColorAt(k, colFast);
    } else {
      m4.compose(n.p, q0, sOne);
      neuMesh.setColorAt(k, colTh);
      thermalPresentG = true;
    }
    neuMesh.setMatrixAt(k, m4);
    const tl = n.fast ? 0.55 : 0.16;
    trailPos[k * 6] = n.p.x; trailPos[k * 6 + 1] = n.p.y; trailPos[k * 6 + 2] = n.p.z;
    trailPos[k * 6 + 3] = n.p.x - n.dir.x * tl; trailPos[k * 6 + 4] = n.p.y - n.dir.y * tl; trailPos[k * 6 + 5] = n.p.z - n.dir.z * tl;
    const c = n.fast ? colFast : colTh;
    trailCol[k * 6] = c.r * 0.9; trailCol[k * 6 + 1] = c.g * 0.9; trailCol[k * 6 + 2] = c.b * 0.9;
    trailCol[k * 6 + 3] = c.r * 0.08; trailCol[k * 6 + 4] = c.g * 0.08; trailCol[k * 6 + 5] = c.b * 0.08;
    if (n.gen > genLive) genLive = n.gen;
    k++;
  }
  for (let i = k; i < MAXN; i++) { m4.makeScale(0.0001, 0.0001, 0.0001); neuMesh.setMatrixAt(i, m4); }
  neuMesh.instanceMatrix.needsUpdate = true;
  neuMesh.instanceColor.needsUpdate = true;
  trailGeo.setDrawRange(0, k * 2);
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;

  /* 碎片 */
  for (let i = 0; i < MAXF; i++) {
    const f = frags[i];
    if (f.life > 0) {
      if (playing) {
        f.life -= dts;
        f.p.addScaledVector(f.v, dts);
        f.v.multiplyScalar(Math.exp(-2.6 * dts));
      }
      dummy.position.copy(f.p);
      dummy.scale.setScalar(Math.max(f.s * clamp(f.life / 0.9, 0, 1), 0.001));
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.0001); }
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    fragMesh.setMatrixAt(i, dummy.matrix);
  }
  fragMesh.instanceMatrix.needsUpdate = true;

  /* 特效 */
  for (const f of fxPool) {
    if (!f.mesh.visible) continue;
    f.t -= dts;
    if (f.t <= 0) { f.mesh.visible = false; continue; }
    const u = 1 - f.t / f.dur;
    f.mesh.scale.setScalar(0.02 + f.s * u * 3.2);
    f.mesh.material.opacity = 0.85 * (1 - u) * (1 - u);
  }

  /* 读数 */
  while (fissionsT.length && fissionsT[0] < tSim - 2) fissionsT.shift();
  const rate = fissionsT.length / 2;
  if (kbn) { const km = kMeas(); kDisp = kInit ? kDisp + (km - kDisp) * Math.min(1, dt * 4) : km; kInit = true; }
  const kShow = kbn >= 12 ? kDisp : kTarget();
  kShowG = kShow;
  runawayG = kShow > 1.06 && neus.length > 14;
  stGen.textContent = neus.length ? genLive : '—';
  stRate.textContent = rate.toFixed(1) + ' /s';
  stK.textContent = kShow.toFixed(3);
  stK.className = 'v ' + (kShow > 1.03 ? 'r' : Math.abs(kShow - 1) <= 0.03 ? 'g' : 'b');
  stN.textContent = neus.length;
  stE.textContent = fmtE(energy);
  alarmEl.style.display = runawayG ? 'flex' : 'none';
  if (runawayG) alarmEl.textContent = L(`失控:k≈${kShow.toFixed(2)} > 1 · 中子代际爆炸`, `RUNAWAY: k≈${kShow.toFixed(2)} > 1 · neutron avalanche`);
  flashEl.style.opacity = runawayG ? 0.22 + 0.12 * Math.sin(tSim * 7) : 0;

  formulaAcc += dt;
  if (formulaAcc > 0.25) { formulaAcc = 0; updateFormula(); drawDial(); }
  elProg.value = Math.min(600, Math.round(tSim));
  elProgVal.textContent = Math.round(tSim) + ' s';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
ins = insTarget;
setIns(insTarget);
setMod(modOn);
setSpd(speed);
refreshLabels();
applyTheme();
applyLang();
setPlayLabel();
{ /* ?t= 快进到指定模拟秒 */
  const t0 = clamp(qsFloat('t', 0), 0, 600);
  let guard = 0;
  while (tSim < t0 && guard++ < 30000) simStep(0.05);
}
ignite(1);
start();
</script>
</body>
</html>
