<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电磁炉 · 锅自己就是发热体</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff6b6b;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  .lbl.b { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.f { border-color: rgba(255,159,40,.9); color: #ffd9a3; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(201,42,42,.9); color: #c92a2a; }
  :root[data-theme="light"] .lbl.f { border-color: rgba(156,95,0,.9); color: #9c5f00; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: #ff6b6b; }
  #stats .v.b { color: #4dabf7; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.f { color: #ffd9a3; border-color: rgba(255,159,40,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  #matRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(255,107,107,.12); }
  :root[data-theme="light"] .bon.on { background: rgba(201,42,42,.08); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 56px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,107,107,.10); border-color: rgba(255,107,107,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="电磁炉：锅自己就是发热体" data-en="Induction Cooktop: the pot IS the heater">电磁炉：锅自己就是发热体</h1>
  <div class="sub" data-zh="线圈通高频交流,磁通穿过锅底感生涡流,I²R 就地发热;铁磁锅聚磁又匹配,功率送得进去;铝锅铜锅白搭 · 空格播放/暂停" data-en="HF AC in the coil makes flux through the base; eddy currents heat it with I²R. Ferromagnetic pots focus flux and match the circuit — aluminum and copper just don't draw power · Space = play/pause">线圈通高频交流,磁通穿过锅底感生涡流,I²R 就地发热;铁磁锅聚磁又匹配,功率送得进去;铝锅铜锅白搭 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="功率输送" data-en="power transfer">功率输送</span><span class="v hot" id="stP">—</span>
  <span class="k" data-zh="锅底温度" data-en="base temp">锅底温度</span><span class="v hot" id="stT">—</span>
  <span class="k" data-zh="面板温度" data-en="glass temp">面板温度</span><span class="v b" id="stG">—</span>
  <span class="k" data-zh="涡流强度" data-en="eddy strength">涡流强度</span><span class="v b" id="stE">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip f" data-zh="磁通线" data-en="flux lines">磁通线</span>
    <span class="chip b" data-zh="锅底涡流" data-en="eddy currents">锅底涡流</span>
  </div>
  <div id="matRow">
    <button class="bon on" id="mSteel"><b data-zh="铁磁不锈钢锅" data-en="ferromagnetic steel">铁磁不锈钢锅</b><i data-zh="聚磁 + 匹配 → 高效" data-en="focus + match → efficient">聚磁 + 匹配 → 高效</i></button>
    <button class="bon" id="mAlu"><b data-zh="铝锅" data-en="aluminum">铝锅</b><i data-zh="不聚磁,功率送不进" data-en="no focus, power rejected">不聚磁,功率送不进</i></button>
    <button class="bon" id="mNone"><b data-zh="无锅" data-en="no pot">无锅</b><i data-zh="检锅停机,不空烧" data-en="detected: no fire">检锅停机,不空烧</i></button>
  </div>
  <div class="row"><label data-zh="火力" data-en="power">火力</label><input id="pwr" type="range" min="10" max="100" step="5" value="70"><span class="val" id="pwrVal">70%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglFlux" type="checkbox" checked> <span data-zh="磁通线" data-en="flux lines">磁通线</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../wireless-charging/" data-zh="无线充电:同款线圈换了个使命" data-en="wireless charging: same coil, new job">无线充电:同款线圈换了个使命</a>
    <a href="../electromagnetic-induction/" data-zh="楞次定律:涡流为什么反对变化" data-en="Lenz's law: why eddies resist">楞次定律:涡流为什么反对变化</a>
    <a href="../transformer/" data-zh="铁芯叠片:反用涡流防涡流" data-en="laminated cores: fighting eddies">铁芯叠片:反用涡流防涡流</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('电磁炉 · 锅自己就是发热体', 'Induction Cooktop · the pot is the heater');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(3.6, 4.0, 7.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  body: mat(0x2c3340, { roughness: 0.6 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x11151c, roughness: 0.12, metalness: 0.1, transparent: true, opacity: 0.92 }),
  coil: mat(0xc98b5f, { metalness: 0.65, roughness: 0.35 }),
  steel: mat(0x8a93a3, { metalness: 0.6, roughness: 0.4 }),
  alu: mat(0xd9dee6, { metalness: 0.85, roughness: 0.3 }),
  handle: mat(0x1b212c, { roughness: 0.7 }),
  flux: new THREE.MeshBasicMaterial({ color: 0xffa94d, transparent: true, opacity: 0.45,
    blending: THREE.AdditiveBlending, depthWrite: false }),
  eddy: new THREE.MeshBasicMaterial({ color: 0x4dabf7, transparent: true, opacity: 0.9 }),
  eddyDot: new THREE.MeshBasicMaterial({ color: 0xffe08a }),
};

/* ================= 场景 ================= */
/* 电磁炉本体 */
const floorSlab = new THREE.Mesh(new THREE.BoxGeometry(11, 0.2, 6.5), M.floor);
floorSlab.position.y = -0.1;
scene.add(floorSlab);
const body = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.34, 3.4), M.body);
body.position.y = 0.17;
scene.add(body);
const glassTop = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.06, 3.2), M.glass);
glassTop.position.y = 0.37;
scene.add(glassTop);
/* 线圈(板内扁平螺旋) */
function spiralCoil(radiusMax, turns, tubeR) {
  const pts = [];
  const N = turns * 26;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const r = radiusMax * (0.22 + 0.78 * t);
    const a = t * turns * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, N, tubeR, 8, false), M.coil);
}
const coil = spiralCoil(1.15, 8, 0.04);
coil.position.y = 0.24;
scene.add(coil);
/* 控制面板贴条 */
const strip = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.02, 0.4), mat(0x11151c, { roughness: 0.3 }));
strip.position.set(0, 0.41, 1.25);
scene.add(strip);

/* 锅(材质可换/可移除) */
const potGrp = new THREE.Group();
scene.add(potGrp);
const potBody = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.0, 0.9, 36, 1, true), M.steel);
potBody.position.y = 0.82;
potGrp.add(potBody);
const potBase = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.07, 36), M.steel);
potBase.position.y = 0.41;
potGrp.add(potBase);
const potRim = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.035, 8, 40), M.steel);
potRim.rotation.x = Math.PI / 2;
potRim.position.y = 1.27;
potGrp.add(potRim);
const handle = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.07, 0.14), M.handle);
handle.position.set(1.55, 1.2, 0);
potGrp.add(handle);
/* 水面(示意,受热冒泡) */
const water = new THREE.Mesh(new THREE.CylinderGeometry(1.08, 1.05, 0.06, 32), mat(0x7fc4e8, { transparent: true, opacity: 0.55 }));
water.position.y = 1.13;
potGrp.add(water);

/* 涡流环(锅底内的感应电流,左右两圈反向) */
const eddyRings = [];
for (let i = 0; i < 4; i++) {
  const r = 0.35 + i * 0.18;
  const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.016, 6, 48), M.eddy.clone());
  t.rotation.x = Math.PI / 2;
  t.position.y = 0.42;
  scene.add(t);
  eddyRings.push(t);
}
/* 涡流方向点(沿环跑) */
const eddyDots = [];
for (let i = 0; i < 12; i++) {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 6), M.eddyDot);
  scene.add(d);
  eddyDots.push(d);
}

/* 磁通管(从线圈向上穿入锅底) */
const N_FLUX = 8;
const fluxLines = [];
for (let i = 0; i < N_FLUX; i++) {
  const a = i / N_FLUX * Math.PI * 2;
  const pts = [];
  for (let k = 0; k <= 20; k++) {
    const t = k / 20;
    const rIn = 0.35 + 0.75 * (i % 2);
    const bulge = Math.sin(t * Math.PI) * 0.55;
    pts.push(new THREE.Vector3(Math.cos(a) * (rIn + (1 - Math.abs(0.5 - t) * 2) * 0.2), t * 1.05, Math.sin(a) * (rIn + bulge * 0.0)));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.018, 6, false), M.flux.clone());
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), M.eddyDot.clone());
  scene.add(mesh); scene.add(dot);
  fluxLines.push({ curve, mesh, dot, a });
}

/* ---------------- 状态(必须在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let power = 0.7;                 // 火力 0.1..1
let potMode = 'steel';           // steel | alu | none
let baseTemp = 24, glassTemp = 24;
let tSim = 0;
/* 功率输送率:铁磁锅聚磁+匹配 → 高;铝/铜耦合差 → 低;无锅 → 0 */
function transfer() {
  if (potMode === 'steel') return 0.92;
  if (potMode === 'alu') return 0.14;
  return 0;
}
function eddyStrength() {
  /* 涡流电流:低阻的铝反而电流更大,但发热更小(见步骤4) */
  if (potMode === 'steel') return 0.65 + 0.35 * power;
  if (potMode === 'alu') return 0.8 + 0.2 * power;
  return 0;
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblCoil = addLabel(() => L('高频线圈 ~25 kHz', 'HF coil ~25 kHz'), new THREE.Vector3(0, 0.55, 1.35), 'f');
const lblPot = addLabel(() => potMode === 'none' ? L('无锅', 'no pot')
  : potMode === 'steel' ? L('铁磁锅底:涡流 I²R 发热', 'ferromagnetic base: I²R heating')
  : L('铝底:涡流大,发热小', 'alu base: big current, little heat'), new THREE.Vector3(1.8, 1.35, 0), 'g');
const lblStatus = addLabel(() => potMode === 'none'
  ? L('检锅失败:不空烧(面板安全)', 'no pot detected: holding fire')
  : `${L('功率输送', 'power transfer')} ${(transfer() * 100).toFixed(0)}% · ${L('锅底', 'base')} ${Math.round(baseTemp)}°C · ${L('面板', 'glass')} ${Math.round(glassTemp)}°C`,
  new THREE.Vector3(0, 3.3, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '线圈:高频交流生磁通', be: 'The coil: HF AC makes flux',
    d: '玻璃面板下藏着一只扁平线圈,通上 ~25 kHz 交流——磁通每秒两万五千次换向,一路向上穿过锅底。',
    de: 'Under the glass hides a flat coil on ~25 kHz AC — flux reverses 25,000 times a second and sweeps up through the base.',
    act: () => setPot('steel') },
  { b: '锅底感生涡流', be: 'Eddies in the base',
    d: '交变磁通在锅底金属里感生出一圈圈旋涡电流(楞次:方向永远反对磁通变化)——蓝色圆环就是涡流的走向。',
    de: 'Changing flux induces swirling eddy currents in the metal base (Lenz: always opposing) — the blue rings trace them.',
    act: () => setPot('steel') },
  { b: '锅自己就是发热体', be: 'The pot IS the heater',
    d: '涡流在锅底电阻上做功 I²R,就地发热——火焰、电热丝都被跳过了;玻璃面板只透磁不导热,全程基本是凉的。',
    de: 'Eddies dissipate I²R right in the base — no flame, no heating element; the glass only passes flux, it stays cool.',
    act: () => setPot('steel') },
  { b: '为什么必须是铁磁锅', be: 'Why ferromagnetic only',
    d: '铁磁锅把磁通聚在锅底、等效电阻恰好匹配谐振电路,功率顺利送进去;铝/铜不聚磁、匹配差,功率送不进去——涡流虽大,能量来源有限。切一下材质对比。',
    de: 'Ferromagnetic bases focus flux and match the resonant circuit, so power flows; aluminum/copper neither focuses nor matches — big eddies, little energy. Toggle the material.',
    act: () => setPot('alu') },
  { b: '无锅不启动(注脚)', be: 'No pot, no fire (footnote)',
    d: '拿走锅,线圈电流立刻变小——控制板由此判断「无锅」,拒绝空烧。同一套涡流,在铁芯叠片和微波炉里是两副面孔:一个要防,一个正用。',
    de: 'Remove the pot and the coil current drops — the board reads "no pot" and refuses to fire. The same eddies are fought in transformer laminations and harnessed here.',
    act: () => setPot('none') },
];
function stepIndex() {
  if (potMode === 'none') return 4;
  if (potMode === 'alu') return 3;
  if (baseTemp > 60) return 2;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elPwr = document.getElementById('pwr');
const elPwrVal = document.getElementById('pwrVal');
const tglLabels = document.getElementById('tglLabels');
const tglFlux = document.getElementById('tglFlux');
const tglRotate = document.getElementById('tglRotate');
const stP = document.getElementById('stP'), stT = document.getElementById('stT'),
  stG = document.getElementById('stG'), stE = document.getElementById('stE');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setPot(m) {
  potMode = m;
  document.getElementById('mSteel').classList.toggle('on', m === 'steel');
  document.getElementById('mAlu').classList.toggle('on', m === 'alu');
  document.getElementById('mNone').classList.toggle('on', m === 'none');
  potGrp.visible = m !== 'none';
  potBody.material = m === 'steel' ? M.steel : M.alu;
  potRim.material = potBody.material;
}
elPwr.addEventListener('input', () => { power = parseInt(elPwr.value, 10) / 100; elPwrVal.textContent = elPwr.value + '%'; });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
document.getElementById('mSteel').addEventListener('click', () => setPot('steel'));
document.getElementById('mAlu').addEventListener('click', () => setPot('alu'));
document.getElementById('mNone').addEventListener('click', () => setPot('none'));
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;
  const ac = Math.sin(tSim * 2 * Math.PI * 1.3);
  const tr = transfer();
  const heatIn = tr * power;

  /* 温度模型:锅底向目标温度松弛;面板只吃一点点漏热 */
  const target = 24 + heatIn * 220;
  baseTemp += (target - baseTemp) * clamp(dts * 0.5, 0, 1);
  glassTemp += (24 + heatIn * 14 - glassTemp) * clamp(dts * 0.4, 0, 1);

  /* 锅底红热 */
  const glow = clamp((baseTemp - 60) / 260, 0, 1);
  const baseMat = potBase.material;
  baseMat.emissive.setRGB(1, 0.35, 0.1);
  baseMat.emissiveIntensity = glow * 1.5;
  water.material.opacity = 0.4 + glow * 0.25;

  /* 涡流环:亮度∝涡流强度,电流点沿环跑(方向随半周期翻转) */
  const es = eddyStrength() * (0.4 + 0.6 * Math.abs(ac));
  const dir = ac >= 0 ? 1 : -1;
  eddyRings.forEach((t, i) => {
    t.visible = potMode !== 'none';
    t.material.opacity = 0.15 + 0.75 * es;
  });
  eddyDots.forEach((d, i) => {
    d.visible = potMode !== 'none';
    const ring = eddyRings[i % eddyRings.length];
    const k = (tSim * (0.25 + 0.9 * es) * dir + i / eddyDots.length) % 1;
    const a = k * Math.PI * 2;
    const rr = ring.geometry.parameters.radius;
    d.position.set(Math.cos(a) * rr, 0.42, Math.sin(a) * rr);
  });

  /* 磁通线:亮度∝交流;铝锅/无锅时发散(不聚磁) */
  const focus = potMode === 'steel' ? 1 : potMode === 'alu' ? 0.35 : 0.15;
  const visF = tglFlux.checked;
  fluxLines.forEach((f, i) => {
    const t = (tSim * 0.9 + i / fluxLines.length) % 1;
    const p0 = f.curve.getPoint(t);
    f.mesh.visible = visF;
    f.dot.visible = visF;
    f.mesh.material.opacity = (0.08 + 0.4 * Math.abs(ac)) * focus;
    f.dot.material.opacity = (0.2 + 0.7 * Math.abs(ac)) * focus;
    const spread = potMode === 'steel' ? 1 : 1.6;
    f.mesh.position.set((p0.x - 0) * spread, 0, p0.z);
    f.dot.position.set(f.mesh.position.x + Math.cos(f.a) * 0.1, p0.y, f.mesh.position.z + Math.sin(f.a) * 0.1);
    void p0;
  });

  /* 统计 */
  stP.innerHTML = (tr * power * 2000).toFixed(0) + '<small> W(示意)</small>';
  stT.innerHTML = Math.round(baseTemp) + '<small> °C</small>';
  stG.innerHTML = Math.round(glassTemp) + '<small> °C</small>';
  stE.innerHTML = (eddyStrength() * 100).toFixed(0) + '<small> %</small>';
  for (const r of labelRegistry) r.o.element.textContent = r.text();

  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
setPot(potMode === 'alu' ? 'alu' : 'steel');
requestAnimationFrame(frame);
</script>
</body>
</html>
