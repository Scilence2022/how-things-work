<!DOCTYPE html>

<style>
  :root,:root[data-theme="dark"]{

  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }

  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }

  <h1 data-zh="挖掘机液压 · 一根油管怎么扛起二十吨" data-en="Excavator Hydraulics · How a Hose Lifts Twenty Tonnes">挖掘机液压 · 一根油管怎么扛起二十吨</h1>
  <div class="sub" data-zh="油几乎不可压缩,帕斯卡定理让压强原样传到每一处:油缸里 F = p·A,小小的截面积乘上 30 MPa 就是上百 kN;泵只管送流量 Q,缸速 v = Q/A;而系统的压力不由泵决定,由负载决定——负载变重压力表就爬升;爬过溢流阀整定值,油当场走泄油路,动作憋住,泵毫发无伤 · 拖动旋转 / 空格运行/暂停" data-en="Oil is incompressible, so Pascal's law carries the pressure everywhere intact: in the cylinder F = p·A — a modest piston area times 30 MPa is hundreds of kN; the pump only delivers flow Q, so the cylinder speed is v = Q/A; system pressure is set not by the pump but by the load — load it more and the gauge climbs; past the relief setting the oil spills straight back to tank and the motion stalls, leaving the pump unharmed · drag to orbit / Space = run/pause">油几乎不可压缩,帕斯卡定理让压强原样传到每一处:油缸里 F = p·A,小小的截面积乘上 30 MPa 就是上百 kN;泵只管送流量 Q,缸速 v = Q/A;而系统的压力不由泵决定,由负载决定——负载变重压力表就爬升;爬过溢流阀整定值,油当场走泄油路,动作憋住,泵毫发无伤 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const qsFloat=(k,d)=>{const v=parseFloat(qs.get(k));return Number.isFinite(v)?v:d;};
const speedMul=clamp(qsFloat('speed',1),0.3,2.5);

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(8.6,4.6,11.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.4,1.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 材质 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const darkM=new THREE.MeshStandardMaterial({color:0x2b3036,roughness:0.7,metalness:0.4});
const bodyM=new THREE.MeshStandardMaterial({color:0xd9a021,roughness:0.45,metalness:0.35});
const steelM=new THREE.MeshStandardMaterial({color:0x9aa3ae,roughness:0.35,metalness:0.85});
const chromeM=new THREE.MeshStandardMaterial({color:0xc9d2dc,roughness:0.18,metalness:0.95});
const glassM=new THREE.MeshStandardMaterial({color:0x9fc4d8,transparent:true,opacity:0.16,roughness:0.15,metalness:0.1,side:THREE.DoubleSide,depthWrite:false});
const oilM=new THREE.MeshStandardMaterial({color:0x3b9dd4,transparent:true,opacity:0.55,roughness:0.3,emissive:0x1864ab,emissiveIntensity:0.5});
const oilR=new THREE.MeshStandardMaterial({color:0xe8a33c,transparent:true,opacity:0.55,roughness:0.3,emissive:0xb35c00,emissiveIntensity:0.4});
const rockM=new THREE.MeshStandardMaterial({color:0x6b6f76,roughness:0.9});
const hardM=new THREE.MeshStandardMaterial({color:0x7d828a,roughness:0.85,emissive:0xff4d4d,emissiveIntensity:0});
const frameM=new THREE.MeshStandardMaterial({color:0x3d4654,roughness:0.55,metalness:0.6});
const springM=new THREE.MeshStandardMaterial({color:0xb0b8c4,roughness:0.4,metalness:0.8});
const ballM=new THREE.MeshStandardMaterial({color:0xffe066,roughness:0.25,metalness:0.7,emissive:0xffa94d,emissiveIntensity:0.3});
const warnM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.9});

/* ---- 地面与机体 ---- */
const ground=new THREE.Mesh(new THREE.CylinderGeometry(17,17,0.3,48),groundM);
ground.position.y=-0.15;scene.add(ground);
const tracks=new THREE.Group();scene.add(tracks);
for(const s of [-1,1]){
  const t=new THREE.Mesh(new THREE.BoxGeometry(2.7,0.55,0.52),darkM);
  t.position.set(-2.6,0.28,s*0.62);tracks.add(t);
}
const chassis=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.5,1.1),bodyM);
chassis.position.set(-2.6,0.82,0);scene.add(chassis);
const cab=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.8,0.95),bodyM);
cab.position.set(-2.2,1.55,0.1);scene.add(cab);
const win=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.4,0.97),darkM);
win.position.set(-2.15,1.62,0.1);scene.add(win);
const cw=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.65,1.2),darkM);
cw.position.set(-3.35,1.1,0);scene.add(cw);

/* ---- 动臂/斗杆/铲斗 ---- */
const PIVOT=new THREE.Vector2(-2.6,1.42);
const boomG=new THREE.Group();boomG.position.set(PIVOT.x,PIVOT.y,0);scene.add(boomG);
const boom=new THREE.Mesh(new THREE.BoxGeometry(3.3,0.38,0.3),bodyM);
boom.position.x=1.65;boomG.add(boom);
const stickG=new THREE.Group();stickG.position.set(3.25,0,0);stickG.rotation.z=-0.78;boomG.add(stickG);
const stick=new THREE.Mesh(new THREE.BoxGeometry(1.95,0.28,0.24),bodyM);
stick.position.x=0.975;stickG.add(stick);
const bucketG=new THREE.Group();bucketG.position.set(1.95,0,0);bucketG.rotation.z=-0.5;stickG.add(bucketG);
const bucket=new THREE.Mesh(new THREE.BoxGeometry(0.58,0.42,0.55),steelM);
bucket.position.set(0.26,-0.08,0);bucketG.add(bucket);
for(let i=0;i<4;i++){
  const th=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.14,0.07),chromeM);
  th.position.set(0.53,-0.24,-0.2+i*0.135);bucketG.add(th);
}
/* 石堆与硬石 */
const rocks=new THREE.Group();scene.add(rocks);
for(let i=0;i<7;i++){
  const r=0.16+Math.random()*0.2;
  const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),rockM);
  m.position.set(1.7+Math.random()*1.4,0.12+r*0.6,(Math.random()-0.5)*1.1);
  m.rotation.set(Math.random()*3,Math.random()*3,0);rocks.add(m);
}
const hardRock=new THREE.Mesh(new THREE.IcosahedronGeometry(0.42,1),hardM);
hardRock.position.set(2.15,0.4,0);rocks.add(hardRock);

/* ---- 液压缸几何(曲柄滑块式 IK) ---- */

const MLOC=new THREE.Vector2(1.05,-0.14);      /* 缸杆铰点(动臂坐标系) */

const baseAng=Math.atan2(CEND.y-PIVOT.y,CEND.x-PIVOT.x);
const offAng=Math.atan2(MLOC.y,MLOC.x);
function anchorDist(th){
  return Math.sqrt(d0*d0+aLen*aLen-2*d0*aLen*Math.cos(th+offAng-baseAng));
}

function angFromL(len){
  const c=clamp((d0*d0+aLen*aLen-len*len)/(2*d0*aLen),-1,1);
  return baseAng-offAng+Math.acos(c);
}

function pathLen(pts){let s=0;for(let i=1;i<pts.length;i++)s+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return s;}
function pathAt(pts,tt){
  const total=pathLen(pts);let d=clamp(tt,0,1)*total;
  for(let i=1;i<pts.length;i++){
    const seg=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    if(d<=seg||i===pts.length-1){
      const k=seg>1e-6?d/seg:0;
      return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k,pts[i][2]];
    }
    d-=seg;
  }
  return pts[0];
}

function cylForceReq(lx,h){return (mLoad*1000*9.81*lx+T0)/h;}
function updatePhysics(dt){
  const th=angFromL(Lmin+eExt*stroke);
  boomG.rotation.z=th;
  const c=Math.cos(th),s=Math.sin(th);
  const Mx=PIVOT.x+MLOC.x*c-MLOC.y*s,My=PIVOT.y+MLOC.x*s+MLOC.y*c;
  const Mc=new THREE.Vector2(Mx,My),Cc=new THREE.Vector2(CEND.x,CEND.y);
  const len=Mc.distanceTo(Cc);
  /* 缸轴线对动臂铰点的力臂 h;铲斗水平力臂 lx */
  const h=Math.abs((Mx-PIVOT.x)*(CEND.y-PIVOT.y)-(My-PIVOT.y)*(CEND.x-PIVOT.x))/len;
  const bx=PIVOT.x+4.55*c+1.345*s, lx=Math.max(1,bx-PIVOT.x);
  /* 缸总成摆位 */
  const ang=Math.atan2(My-CEND.y,Mx-CEND.x);
  cylG.position.set(CEND.x,CEND.y,0.42);cylG.rotation.z=ang;
  const px=0.06+eExt*0.70;
  piston.position.x=px;
  chBlue.scale.y=Math.max(0.02,px-0.08);chBlue.position.x=px/2+0.02;
  chAmb.scale.y=Math.max(0.02,LBARREL-0.1-px);chAmb.position.x=(px+LBARREL-0.1)/2+0.03;
  rod.scale.y=len-px+0.12;rod.position.x=px+(len-px+0.12)/2;
  /* 斗杆油缸装饰摆位 */
  const s2x=PIVOT.x+3.25*c, s2y=PIVOT.y+3.25*s;
  rod2.scale.y=Math.max(0.3,Math.hypot(s2x-(-2.2),s2y-0.9)-0.3);
  rod2.position.set((-2.2+s2x)/2,(0.9+s2y)/2,0.1);
  rod2.rotation.z=Math.atan2(s2y-0.9,s2x+2.2);
  cyl2.position.set(-2.2,0.9,0.1);cyl2.rotation.z=rod2.rotation.z;
  /* 压力/溢流:extend 承载,retract 空载 */
  const Freq=cylForceReq(lx,h);
  const pReq=Freq/A1;
  if(dir>0){
    spill=clamp((pReq-pSet)/2.2,0,1);
    pNow=Math.min(pReq,pSet);
    const vF=(pReq>pSet)?0:(1-0.85*spill);
    var v=disp*30e-6/A1*vF; /* m/s */
  }else{
    spill=0;pNow=0.5+disp*0.004;exhausted=0;
    var v=-disp*30e-6/A2;
  }
  if(playing){
    if(wait>0){wait-=dt;}
    else{
      eExt+=v/stroke*dt;
      if(eExt>=1){eExt=1;dir=-1;wait=0.5;}
      if(eExt<=0){eExt=0;dir=1;wait=0.35;}
    }
  }
  /* 溢流阀动画与硬石提示 */
  rBall.position.x=-0.55+spill*0.16;
  rSpring.forEach((t,i)=>{t.position.x=-0.44+i*0.055-spill*0.12;t.scale.y=1-spill*0.25;});
  tubeF.visible=spill>0.02;
  hardM.emissiveIntensity=spill>0.02?1.5+Math.sin(simT*10)*0.8:0;
  oilM.emissiveIntensity=0.3+pNow/31*1.3;
  needle.rotation.z=2.35-clamp(pNow,0,35)/35*4.7;
  return {th,lx,h,pReq};
}
function updateParticles(dt){
  let k=0;
  if(tglFlowEl.checked){
    const qf=0.5+disp/190*0.9;
    for(const f of flows){
      if(f.cond&&!f.cond())continue;
      for(let i=0;i<f.n;i++){
        f.t=(f.t+dt*f.sp*qf*(spill>0.02?1.3:1))%1;
        const p=pathAt(f.pts,(f.t+i/f.n)%1);
        dummy.position.set(p[0],p[1],p[2]);dummy.scale.setScalar(1);dummy.updateMatrix();
        pMesh.setMatrixAt(k,dummy.matrix);
        pMesh.setColorAt(k,f.col);k++;
      }
    }
  }
  pMesh.count=k;pMesh.instanceMatrix.needsUpdate=true;
  if(pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true;
}

let phaseIdx=0;

function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML='<span class="n">'+(i+1)+'</span><span class="t"><b>'+L(s.b,s.be)+'</b>　'+L(s.d,s.de)+'</span>';
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===phaseIdx));}
function applyPhase(i){
  phaseIdx=i;
  wait=0;
  STEPS[i].act();
  syncAll();
}

document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  rockM.color.setHex(dark?0x6b6f76:0x9a948a);
  hardM.color.setHex(dark?0x7d828a:0xa8a29a);
  frameM.color.setHex(dark?0x3d4654:0x8494a5);
  glassM.opacity=dark?0.16:0.28;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();syncPlayBtn();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  simT+=dt0;
  const dt=dt0*speedMul*(playing?1:0);
  if(notifyT>0)notifyT-=dt0;
  updatePhysics(dt);
  updateParticles(dt);
  if(camTween){
    camTween.k=Math.min(1,camTween.k+dt0*1.6);
    const ee=1-Math.pow(1-camTween.k,3);
    camera.position.lerpVectors(camTween.p0,camTween.p1,ee);
    controls.target.lerpVectors(camTween.t0,camTween.t1,ee);
    if(camTween.k>=1)camTween=null;
  }
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    const txt=r.text();
    r.o.visible=labelsOn&&r.vis()&&txt!=='';
    if(r.o.visible)r.o.element.textContent=txt;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
applyTheme();applyLang();
setQ(120);setW(0.8);setR(25);
const t0=Math.round(qsFloat('t',0));
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
syncPlayBtn();updateStats();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
