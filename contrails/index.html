<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>凝结尾迹 · 尾气在冰过饱和区里点冰</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#4dabf7;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1c7ed6;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(77,171,247,.6);background:rgba(77,171,247,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(28,126,214,.55);background:rgba(28,126,214,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(77,171,247,.10);border-color:rgba(77,171,247,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(28,126,214,.08);border-color:rgba(28,126,214,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#bde0fb}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="凝结尾迹" data-en="Contrails">凝结尾迹</h1>
  <div class="sub" data-zh="发动机烧煤油 → 排出 CO₂、水汽和烟尘核 → 高温湿排气沿「混合线」与 −50 ℃ 环境空气掺混,相对湿度一路窜升 → 穿过冰饱和线:水汽在烟尘核上凝华成冰晶,翼展后即见白线 → 环境未饱和:冰晶几秒内升华、尾迹消失;环境本就冰过饱和(ISSR):存留数小时、被风切撕成卷云 → 白天反射阳光降温、夜间截留红外增温,净效应增暖、夜航贡献更大 · 拖动旋转 / 空格运行/暂停" data-en="The engine burns kerosene → CO₂, water vapor and soot nuclei exit hot and humid → along the mixing line with −50 °C ambient air, relative humidity soars → crossing ice saturation, vapor deposits onto soot as ice crystals: the white line appears behind the wing → in subsaturated air the crystals sublimate in seconds; in an ice-supersaturated region (ISSR) the trail persists for hours and shears into cirrus → by day it reflects sunlight (cooling), by night it traps IR (warming) — net warming, and night flights contribute most · drag to orbit / Space = run/pause">发动机烧煤油 → 排出 CO₂、水汽和烟尘核 → 高温湿排气沿「混合线」与 −50 ℃ 环境空气掺混,相对湿度一路窜升 → 穿过冰饱和线:水汽在烟尘核上凝华成冰晶,翼展后即见白线 → 环境未饱和:冰晶几秒内升华、尾迹消失;环境本就冰过饱和(ISSR):存留数小时、被风切撕成卷云 → 白天反射阳光降温、夜间截留红外增温,净效应增暖、夜航贡献更大 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="巡航气温" data-en="Ambient temp">巡航气温</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="冰过饱和度" data-en="RH over ice">冰过饱和度</span><span class="v" id="stRH">—</span>
  <span class="k" data-zh="尾迹存留" data-en="Persistence">尾迹存留</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="辐射强迫" data-en="Rad. forcing">辐射强迫</span><span class="v" id="stRF">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bNight" data-zh="夜间辐射" data-en="Night radiance">夜间辐射</button>
    <button class="abtn" id="bDay" data-zh="白昼辐射" data-en="Day radiance">白昼辐射</button>
    <button class="abtn" id="bClean" data-zh="低烟尘燃烧室" data-en="Lean-soot combustor">低烟尘燃烧室</button>
  </div>
  <div class="row">
    <label data-zh="环境湿度(对冰)" data-en="RH over ice">环境湿度(对冰)</label>
    <input id="sRH" type="range" min="40" max="130" step="1" value="55">
    <span class="val" id="sRHVal">55 %</span>
  </div>
  <div class="row">
    <label data-zh="飞行高度" data-en="Altitude">飞行高度</label>
    <input id="sAlt" type="range" min="8.5" max="12.5" step="0.1" value="10.8">
    <span class="val" id="sAltVal">10.8 km</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglMix" type="checkbox" checked> <span data-zh="混合线图" data-en="Mixing chart">混合线图</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cloud-formation/" data-zh="云的形成" data-en="Cloud Formation">云的形成</a>
    <a href="../jet-engine/" data-zh="喷气发动机" data-en="Jet Engine">喷气发动机</a>
    <a href="../greenhouse-effect/" data-zh="温室效应" data-en="Greenhouse Effect">温室效应</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0a1220,50,160);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,400);
camera.position.set(14,5.5,22);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-2,1.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=80;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xbfd9ff,0x141a24,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(9,13,10);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.28);fill.position.set(-9,5,-8);scene.add(fill);

/* ── 高空环境:云海在下方,冰过饱和区是一方淡蓝空间 ── */
const seaM=new THREE.MeshStandardMaterial({color:0x223046,roughness:1});
const sea=new THREE.Mesh(new THREE.CircleGeometry(120,48),seaM);
sea.rotation.x=-Math.PI/2;sea.position.y=-16;scene.add(sea);
const issrM=new THREE.MeshStandardMaterial({color:0x4dabf7,transparent:true,opacity:0.045,
  side:THREE.BackSide,depthWrite:false});
const issr=new THREE.Mesh(new THREE.BoxGeometry(90,14,26),issrM);
issr.position.set(-26,1.4,0);scene.add(issr);

/* 客机(简化):机身沿 X,机头朝 +X,尾迹向 −X 展开 */
const jet=new THREE.Group();
const aluM=new THREE.MeshStandardMaterial({color:0xb8c4d4,roughness:0.35,metalness:0.7});
const fus=new THREE.Mesh(new THREE.CapsuleGeometry(0.5,4.6,8,16),aluM);
fus.rotation.z=Math.PI/2;fus.position.x=-0.6;jet.add(fus);
const nose=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,12),aluM);
nose.scale.set(1.5,1,1);nose.position.x=2.8;jet.add(nose);
const wingM=new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:0.4,metalness:0.6});
for(const s of [-1,1]){
  const wing=new THREE.Mesh(new THREE.BoxGeometry(2.3,0.09,2.6),wingM);
  wing.position.set(-0.5,-0.12,s*1.65);wing.rotation.y=s*0.16;jet.add(wing);
  const eng=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.3,1.05,16),
    new THREE.MeshStandardMaterial({color:0x6e7a8c,roughness:0.4,metalness:0.7}));
  eng.rotation.z=Math.PI/2;eng.position.set(-0.35,-0.62,s*1.35);jet.add(eng);
  const pylon=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.42,0.14),wingM);
  pylon.position.set(-0.3,-0.34,s*1.35);jet.add(pylon);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.08,1.15),wingM);
  tail.position.set(-4.3,-0.05,0);jet.add(tail);
  const fin=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.35,0.08),wingM);
  fin.position.set(-4.35,0.75,0);fin.rotation.z=0.3;jet.add(fin);
}
jet.position.set(0,1.4,0);scene.add(jet);
const engOut=[new THREE.Vector3(-1.0,0.78,1.35),new THREE.Vector3(-1.0,0.78,-1.35)];

/* 冰晶粒子池:实例化小球 */
const NP=520;
const iceGeo=new THREE.IcosahedronGeometry(0.09,0);
const iceM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.95});
const ice=new THREE.InstancedMesh(iceGeo,iceM,NP);
ice.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(ice);
const P=[];for(let i=0;i<NP;i++)P.push({alive:false,x:0,y:0,z:0,s:0,tg:1,age:0,dur:8,
  vy:0,vz:0,cryst:false});
let emitAcc=0;
const dummy=new THREE.Object3D();
const colIce=new THREE.Color(0xeaf6ff),colBg=new THREE.Color(0x0a1220),colTmp=new THREE.Color();

/* ── 两块仪表板:混合线相图 + 辐射收支 ── */
function makeBoard(w,h,pos,rotY){
  const c=document.createElement('canvas');c.width=560;c.height=340;
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const side=new THREE.MeshStandardMaterial({color:0x2a2f38,roughness:0.7});
  const face=new THREE.MeshStandardMaterial({map:t,roughness:0.85});
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.06),[side,side,side,side,face,side]);
  m.position.copy(pos);m.rotation.y=rotY;scene.add(m);
  for(const sx of[-w*0.38,w*0.38]){
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,2.4,10),side);
    post.position.set(pos.x+sx,pos.y-h/2-1.2,pos.z);scene.add(post);
  }
  return {c,g:c.getContext('2d'),t};
}
const mixB=makeBoard(3.4,2.1,new THREE.Vector3(6.5,3.4,-5),-0.55);
const radB=makeBoard(3.4,2.1,new THREE.Vector3(-10.5,3.4,-5),0.55);

/* ── 状态与大气物理 ── */
let rh=55,altKm=10.8,radiance='night',cleanSoot=false,playing=true,labelsOn=true,slowMo=false,mixOn=true;
let simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const ambT=()=>altKm<=11?15-6.5*altKm:-56.5;
/* Buck 饱和水汽压(hPa):冰面 / 水面 */
const esi=t=>6.1115*Math.exp((23.036-t/333.7)*t/(279.82+t));
const esw=t=>6.1121*Math.exp((18.678-t/234.5)*t/(257.14+t));
/* Schmidt-Appleman 判据:排气与环境在「水汽分压-温度」空间直线掺混,
   若这条混合线在中途越过冰饱和曲线 → 尾迹成核。排气 ~500 ℃、pH2O≈22 hPa */
const TEX=500,PEX=22;
let mixCache={ta:1e9,rh:-1,cross:false};
function mixCross(ta,rhv){
  if(mixCache.ta===ta&&mixCache.rh===rhv)return mixCache.cross;
  const pAmb=rhv*esi(ta)/100;
  let cross=false;
  for(let t=ta;t<=Math.min(ta+140,TEX);t+=0.25){
    const p=pAmb+(PEX-pAmb)*(t-ta)/(TEX-ta);
    if(p>esi(t)){cross=true;break;}
  }
  mixCache={ta,rh:rhv,cross};
  return cross;
}
const forms=()=>mixCross(ambT(),rh);
const persists=()=>rh>=100;
/* 真实存留时间(秒):欠饱和越少活得越久;≥100% 视为数小时 */
function realTau(){
  if(!forms())return 0;
  if(persists())return 6*3600;
  return clamp(2*Math.pow(100/Math.max(0.6,100-rh),1.5),2,2400);
}
function tauText(){
  const t=realTau();
  if(!forms())return L('不成核','no nucleation');
  if(persists())return L('数小时 → 卷云','hours → cirrus');
  if(t<90)return t.toFixed(0)+' s';
  if(t<3600)return (t/60).toFixed(1)+' min';
  return (t/3600).toFixed(1)+' h';
}
/* 辐射强迫(局地瞬时):持久尾迹夜间截留 IR 约 +6~8 W/m²,白天被反照率抵消 */
function radForcing(){
  let pf=persists()?1:(forms()?0.3:0);
  if(cleanSoot)pf*=0.25;
  const ir=6.8*pf;
  const alb=radiance==='day'?5.6*pf:0;
  return {ir,alb,net:ir-alb};
}

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

  st={T:ambT(),rh,tau:realTau(),rf:radForcing().net};

function drawMix(){
  const g=mixB.g,W=560,H=340;
  g.fillStyle=THEME==='dark'?'#141922':'#f4f2ee';g.fillRect(0,0,W,H);
  g.fillStyle=THEME==='dark'?'#9fb0c3':'#5b6b7d';g.font='13px system-ui';
  g.fillText(L('温-湿相图:混合线能否穿过冰饱和线','T–RH phase map: does the mixing line cross ice saturation?'),14,22);
  const x0=52,y0=H-42,Wd=W-80,Hd=H-70;
  const Tx=t=>x0+Wd*(t+70)/110;         /* -70..40 °C */
  const Ty=r=>y0-Hd*r/160;              /* 0..160 % */
  g.strokeStyle=THEME==='dark'?'#2c3542':'#d8d4cc';
  for(let t=-60;t<=40;t+=20){g.beginPath();g.moveTo(Tx(t),y0);g.lineTo(Tx(t),y0-Hd);g.stroke();
    g.fillStyle=THEME==='dark'?'#62748a':'#8a96a4';g.fillText(t+'°',Tx(t)-8,y0+16);}
  for(let r=0;r<=160;r+=40){g.beginPath();g.moveTo(x0,Ty(r));g.lineTo(x0+Wd,Ty(r));g.stroke();
    g.fillText(r+'%',x0-30,Ty(r)+4);}
  /* 冰饱和曲线(RH 对水计):冰面饱和水汽压低于水面 */
  const curve=t=>100*esi(t)/esw(t);
  g.strokeStyle='#74c0fc';g.lineWidth=2.5;g.beginPath();
  for(let t=-70;t<=50;t+=2){const r=Math.min(158,curve(t));
    t===-70?g.moveTo(Tx(t),Ty(r)):g.lineTo(Tx(t),Ty(r));}
  g.stroke();
  g.fillStyle='#74c0fc';g.font='12px system-ui';
  g.fillText(L('冰饱和线','ice saturation'),Tx(-16),Ty(Math.min(158,curve(-16)))-8);
  /* 混合线:以「水汽分压线性掺混」换算成 RH(T) 曲线(真实 Schmidt-Appleman 判据) */
  const ta=ambT(),pAmb=rh*esi(ta)/100;
  const mixRH=t=>(pAmb+(PEX-pAmb)*(t-ta)/(TEX-ta))/esw(t)*100;
  const cross=forms();
  g.strokeStyle=cross?'#51cf66':'#ff8787';g.lineWidth=3;
  g.beginPath();
  let first=true,tCross=null;
  for(let t=ta;t<=Math.min(ta+140,50);t+=1){
    if(t<-70)continue;
    const r=Math.min(158,mixRH(t));
    if(first){g.moveTo(Tx(t),Ty(r));first=false;}else g.lineTo(Tx(t),Ty(r));
  }
  g.stroke();
  for(let t=Math.max(ta,-70);t<=Math.min(ta+140,50);t+=0.5){
    if(mixRH(t)>=curve(t)){tCross=t;break;}
  }
  /* 环境点 */
  const Ra=Math.min(158,rh*esi(ta)/esw(ta)*100);
  g.fillStyle=cross?'#51cf66':'#ff8787';
  g.beginPath();g.arc(Tx(ta),Ty(Ra),5,0,7);g.fill();
  g.font='12px system-ui';
  g.fillText(L('环境','ambient'),Tx(ta)-16,Ty(Ra)-10);
  if(tCross!==null&&cross){
    g.fillStyle='#ffe066';
    g.beginPath();g.arc(Tx(tCross),Ty(Math.min(158,curve(tCross))),6,0,7);g.fill();
    g.fillText(L('成核点','nucleation point'),Tx(tCross)-22,Ty(Math.min(158,curve(tCross)))+20);
  }
  g.fillStyle='#ffa94d';g.font='12px system-ui';
  g.fillText(L('排气 500 ℃ →','exhaust 500 °C →'),W-136,H-52);
  if(cross){g.fillStyle='#51cf66';g.font='14px system-ui';
    g.fillText(L('✓ 穿线 → 成冰','✓ crosses → ice forms'),W-150,30);}
  else{g.fillStyle='#ff8787';g.font='14px system-ui';
    g.fillText(L('✗ 未穿线 → 无尾迹','✗ no crossing → no trail'),W-170,30);}
  mixB.t.needsUpdate=true;
}
function drawRad(){
  const g=radB.g,W=560,H=340;
  const day=radiance==='day';
  g.fillStyle=day?'#7db8e8':(THEME==='dark'?'#0c1119':'#1a2430');g.fillRect(0,0,W,H);
  g.font='13px system-ui';
  g.fillStyle=day?'#0b2949':'#c7d2de';
  g.fillText(day?L('白昼:反射 × 截留,两相抵消','Day: reflection vs trapping, near cancel')
               :L('夜间:无光可反,只剩纯增温','Night: nothing to reflect, pure warming'),14,24);
  /* 地表 */
  g.fillStyle=day?'#3d6b35':'#20262c';g.fillRect(40,H-70,W-80,34);
  /* 尾迹条 */
  g.fillStyle='#eaf6ff';g.fillRect(120,84,W-240,20);
  const f=radForcing();
  const arrow=(x,y0,y1,color,wd)=>{g.strokeStyle=color;g.lineWidth=wd||4;
    g.beginPath();g.moveTo(x,y0);g.lineTo(x,y1);g.stroke();
    const d=Math.sign(y1-y0);
    g.beginPath();g.moveTo(x-8,y1-d*12);g.lineTo(x,y1);g.lineTo(x+8,y1-d*12);g.stroke();};
  if(day){
    g.fillStyle='#ffd43b';g.beginPath();g.arc(90,52,16,0,7);g.fill();
    arrow(150,64,80,'#ffd43b');           /* 太阳入射 */
    arrow(280,80,32,'#ffd43b');           /* 反射回太空 */
    arrow(420,80,126,'#ff8787');          /* IR 下行被截 */
    g.fillStyle='#0b2949';g.font='12px system-ui';
    g.fillText(L(`反射阳光 −${f.alb.toFixed(1)}`,`reflected −${f.alb.toFixed(1)}`),216,44);
    g.fillText(L(`截留红外 +${f.ir.toFixed(1)}`,`trapped IR +${f.ir.toFixed(1)}`),392,150);
  }else{
    arrow(180,126,80,'#ff8787');          /* 地表 IR 上行 */
    arrow(330,80,126,'#ff8787');          /* 被尾迹弹回 */
    g.fillStyle='#ffc2c2';g.font='12px system-ui';
    g.fillText(L(`红外被截留 +${f.ir.toFixed(1)} W/m²`,`IR trapped +${f.ir.toFixed(1)} W/m²`),238,160);
  }
  g.fillStyle=day?'#0b2949':'#e9ecef';g.font='16px system-ui';
  g.fillText(L(`净辐射强迫 ${(f.net>=0?'+':'')+f.net.toFixed(1)} W/m²`,`net forcing ${(f.net>=0?'+':'')+f.net.toFixed(1)} W/m²`),170,H-22);
  radB.t.needsUpdate=true;
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 粒子发射与生命周期 ── */
  const R=2.6;               /* 世界 1 单位 ≈ 100 m,后掠速度 */
  emitAcc+=dts*14;
  while(emitAcc>1){emitAcc-=1;
    const p=P.find(q=>!q.alive);
    if(!p)break;
    const e=engOut[Math.random()<0.5?0:1];
    p.alive=true;p.age=0;p.x=jet.position.x+e.x;p.y=jet.position.y+e.y;p.z=jet.position.z+e.z;
    p.s=0.12;p.vy=0;p.vz=0;
    p.cryst=forms()&&(!cleanSoot||Math.random()<0.14);
    p.dur=2+clamp(realTau()/90,0.3,7)+Math.random()*1.5;
  }
  let maxA=0;
  for(let i=0;i<NP;i++){
    const p=P[i];
    if(!p.alive){dummy.position.set(0,-999,0);dummy.scale.setScalar(0.001);}
    else{
      p.age+=dts;
      p.x-=R*dts;
      const turb=Math.min(1,p.age/6);
      p.vy+=(Math.sin(simT*1.7+i*2.1)*0.06+p.vy*-0.15)*dts*8;
      p.vz+=(Math.cos(simT*1.3+i*1.7)*0.06+p.vz*-0.15)*dts*8;
      p.y+=p.vy*dts*turb*2.4;p.z+=p.vz*dts*turb*2.4;
      if(!p.cryst){          /* 未成核:隐没 */
        p.s=Math.max(0,p.s-dts*0.4);
        if(p.age>0.5)p.alive=false;
      }else if(persists()){  /* 存留:缓慢增长并铺展 */
        p.s=Math.min(0.75,p.s+dts*0.05);
      }else{                 /* 欠饱和:先撑一会再升华 */
        if(p.age>p.dur)p.s=Math.max(0.001,p.s-dts*0.28*(0.5+ (100-rh)*0.03));
        else p.s=Math.min(0.42,p.s+dts*0.06);
        if(p.s<=0.001&&p.age>p.dur)p.alive=false;
      }
      if(p.age>16)p.alive=false;
      maxA=Math.max(maxA,p.s);
      dummy.position.set(p.x,p.y,p.z);
      const fade=clamp(1.4-p.age*0.06,0.25,1);
      dummy.scale.setScalar(clamp(p.s,0.001,2));
      colTmp.copy(colIce).lerp(colBg,(1-fade)*0.55);
      ice.setColorAt(i,colTmp);
    }
    dummy.updateMatrix();ice.setMatrixAt(i,dummy.matrix);
    if(!p.alive)ice.setColorAt(i,colBg);
  }
  ice.instanceMatrix.needsUpdate=true;
  if(ice.instanceColor)ice.instanceColor.needsUpdate=true;
  issrM.opacity=0.02+0.05*smooth((rh-95)/15);
  jet.position.y=1.4+Math.sin(simT*0.9)*0.14;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();drawMix();drawRad();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on;
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
