<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具 / 主题 / 语言 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(0,13.5,9.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=50;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.85));
const keyL=new THREE.DirectionalLight(0xffffff,0.9);keyL.position.set(4,10,6);scene.add(keyL);

/* ============ 网格世界 ============ */
const GW=8,GH=6,CS=1.6,NS=GW*GH;
const START=GH-1,SC=0,GOALR=0,GOALC=GW-1;         // 左下出发，右上终点
const cellX=c=>(c-(GW-1)/2)*CS, cellZ=r=>(r-(GH-1)/2)*CS;
const idx=(r,c)=>r*GW+c;
const RC=s=>[Math.floor(s/GW),s%GW];
let walls=new Set(),traps=new Set();
/* 初始布局：两道留缺口的墙 + 两个陷阱 */
[[2,1],[2,2],[2,3],[2,4],[2,5],[4,2],[4,3],[4,4],[4,5],[4,6]].forEach(([r,c])=>walls.add(idx(r,c)));
[[3,3],[1,5]].forEach(([r,c])=>traps.add(idx(r,c)));

/* ============ Q 学习核心（真实表格型 Q-learning） ============ */
let Q=new Float32Array(NS*4);
let alpha=0.5,gamma=0.95,eps=0.2;
const STEP_R=-0.04,GOAL_R=1.0,TRAP_R=-1.0,MAX_STEPS=150;
let episodes=0,epLens=[],firstPath=null;
const isWall=s=>walls.has(s),isTrap=s=>traps.has(s),isGoal=s=>s===idx(GOALR,GOALC);
function nextState(s,a){
  const [r,c]=RC(s);
  const dr=[-1,0,1,0][a],dc=[0,1,0,-1][a];      // 0上 1右 2下 3左
  const nr=r+dr,nc=c+dc;
  if(nr<0||nr>=GH||nc<0||nc>=GW)return s;       // 撞界留原地
  const s2=idx(nr,nc);
  return isWall(s2)?s:s2;
}
const maxQ=s=>Math.max(Q[s*4],Q[s*4+1],Q[s*4+2],Q[s*4+3]);
const argQ=s=>{let b=0,m=Q[s*4];for(let a=1;a<4;a++)if(Q[s*4+a]>m){m=Q[s*4+a];b=a;}return b;};
function epsGreedy(s){
  if(Math.random()<eps)return Math.floor(Math.random()*4);
  return argQ(s);
}
function trainEpisode(){
  let s=idx(START,SC),steps=0;
  const path=[s];
  while(steps<MAX_STEPS){
    const a=epsGreedy(s);
    const s2=nextState(s,a);
    const r=isGoal(s2)?GOAL_R:isTrap(s2)?TRAP_R:STEP_R;
    const target=isGoal(s2)||isTrap(s2)?r:r+gamma*maxQ(s2);
    Q[s*4+a]+=alpha*(target-Q[s*4+a]);
    s=s2;path.push(s);steps++;
    if(isGoal(s2)||isTrap(s2))break;
  }
  episodes++;epLens.push(steps);if(epLens.length>40)epLens.shift();
  if(firstPath===null&&episodes===1)firstPath=path.slice();   // 记住第 1 回合的乱撞
  return path;
}
function greedyPath(){
  /* 纯贪心演示：ε=0；Q 未学到时可能原地打转（这正是 ε=0 的教训） */
  let s=idx(START,SC);const path=[s];const seen=new Set();
  for(let k=0;k<MAX_STEPS;k++){
    if(isGoal(s)||isTrap(s))break;
    if(seen.has(s*4+argQ(s)))return {path,looped:true};
    seen.add(s*4+argQ(s));
    s=nextState(s,argQ(s));path.push(s);
  }
  return {path,looped:false};
}

/* ============ 3D 场景 ============ */
const tileGeo=new THREE.BoxGeometry(CS*0.96,0.12,CS*0.96);
const wallGeo=new THREE.BoxGeometry(CS*0.96,0.9,CS*0.96);
const tiles=[],tileMeshes=[];
const C_BASE=new THREE.Color(0x27313c),C_HEAT=new THREE.Color(0xffa94d),
      C_WALL=new THREE.Color(0x5b6b7d),C_TRAP=new THREE.Color(0xc0392b),C_GOAL=new THREE.Color(0x2f9e44);
for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){
  const s=idx(r,c);
  const geo=isWall(s)?wallGeo:tileGeo;
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:C_BASE.clone()}));
  m.position.set(cellX(c),isWall(s)?0.45:0,cellZ(r));
  m.userData.cell=s;
  scene.add(m);tileMeshes.push(m);
  tiles.push({s,mesh:m,base:C_BASE.clone()});
}
/* 终点信标 */
const goalTile=tileMeshes.find(t=>t.userData.cell===idx(GOALR,GOALC));
goalTile.material.color.copy(C_GOAL);
const beacon=new THREE.Mesh(new THREE.ConeGeometry(0.28,0.7,16),new THREE.MeshBasicMaterial({color:0x51cf66}));
beacon.position.set(cellX(GOALC),0.65,cellZ(GOALR));scene.add(beacon);
/* agent */
const agent=new THREE.Mesh(new THREE.SphereGeometry(0.3,18,14),new THREE.MeshBasicMaterial({color:0x74c0fc}));
agent.position.set(cellX(SC),0.42,cellZ(START));scene.add(agent);
/* 策略箭头 */
const arrowIM=new THREE.InstancedMesh(new THREE.ConeGeometry(0.13,0.4,10),
  new THREE.MeshBasicMaterial({transparent:true,opacity:0.92}),NS);
arrowIM.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NS*3),3);
arrowIM.frustumCulled=false;scene.add(arrowIM);
/* 轨迹线 */
function makeLine(color){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array((MAX_STEPS+2)*3),3).setUsage(THREE.DynamicDrawUsage));
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:0.9}));
  l.frustumCulled=false;scene.add(l);return l;
}
const trailNow=makeLine(0xffa94d),trailFirst=makeLine(0xff6b6b);
trailFirst.visible=false;
function setLine(line,path){
  const p=line.geometry.attributes.position;
  path.forEach((s,i)=>{
    const [r,c]=RC(s);
    p.setXYZ(i,cellX(c),0.32,cellZ(r));
  });
  line.geometry.setDrawRange(0,path.length);
  p.needsUpdate=true;
}
const UP=new THREE.Vector3(0,1,0),DIRV=[new THREE.Vector3(0,0,-1),new THREE.Vector3(1,0,0),new THREE.Vector3(0,0,1),new THREE.Vector3(-1,0,0)];
const qTmp=new THREE.Quaternion(),mTmp=new THREE.Object3D();
function refreshVis(){
  /* 热图：maxQ 归一化 */
  let vmax=0;
  for(let s=0;s<NS;s++)if(!isWall(s))vmax=Math.max(vmax,Math.abs(maxQ(s)));
  for(const t of tiles){
    const s=t.s;
    if(isGoal(s)){t.mesh.material.color.copy(C_GOAL);}
    else if(isTrap(s)){t.mesh.material.color.copy(C_TRAP);}
    else if(isWall(s)){t.mesh.material.color.copy(C_WALL);}
    else{
      const tt=showHeat&&vmax>1e-6?clamp(maxQ(s)/vmax,0,1):0;
      t.mesh.material.color.copy(t.base).lerp(C_HEAT,tt*0.85);
    }
  }
  /* 箭头：argmax 方向，亮度=置信度 */
  for(let s=0;s<NS;s++){
    const [r,c]=RC(s);
    if(isWall(s)||isGoal(s)||isTrap(s)||vmax<1e-6){
      mTmp.position.set(0,-99,0);mTmp.scale.setScalar(0.001);
    }else{
      const a=argQ(s),tt=clamp(maxQ(s)/vmax,0,1);
      mTmp.position.set(cellX(c),0.28,cellZ(r));
      qTmp.setFromUnitVectors(UP,DIRV[a]);
      mTmp.quaternion.copy(qTmp);
      mTmp.scale.setScalar(0.45+0.75*tt);
      const col=new THREE.Color().setHSL(0.36-0.3*tt,0.7,0.55);
      arrowIM.setColorAt(s,col);
    }
    mTmp.updateMatrix();arrowIM.setMatrixAt(s,mTmp.matrix);
  }
  arrowIM.instanceMatrix.needsUpdate=true;
  if(arrowIM.instanceColor)arrowIM.instanceColor.needsUpdate=true;
  arrowIM.visible=showArrows;
}
let showHeat=true,showArrows=true;
const labelReg=[];
let labelsOn=true;
function addLabel(textFn,pos,cls=''){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn});div.textContent=textFn();return o;
}
addLabel(()=>L('起点','start'),new THREE.Vector3(cellX(SC),0.9,cellZ(START)+0.55),'b');
addLabel(()=>L('终点 +1','goal +1'),new THREE.Vector3(cellX(GOALC),1.35,cellZ(GOALR)),'g');
addLabel(()=>L('陷阱 −1','trap −1'),new THREE.Vector3(cellX(3),0.9,cellZ(3)),'r');
addLabel(()=>L('第 1 回合轨迹（红）','first episode (red)'),new THREE.Vector3(cellX(1),0.9,cellZ(0)-1.6),'r',);

/* ============ 训练 / 演示状态机 ============ */
let playing=true,training=true;      // playing=持续训练开关
let demo=null,demoIdx=0,demoTimer=0; // 贪心演示
let editMode='wall';
const sEp=document.getElementById('sEp'),sEps=document.getElementById('sEps');
function startDemo(){
  training=false;
  const {path,looped}=greedyPath();
  demo={path,looped};demoIdx=0;demoTimer=0;
  trailNow.visible=true;setLine(trailNow,path);
  curText=looped?L('贪心 agent 原地打转——Q 表还没学到 / ε=0 的卡死','greedy agent loops — Q not learned yet / ε=0 stuck')
    :L(`贪心路径 ${path.length-1} 步到达`,`greedy path reaches goal in ${path.length-1} steps`);
}
function stopDemo(){demo=null;agent.position.set(cellX(SC),0.42,cellZ(START));}
function resetQ(){
  Q.fill(0);episodes=0;epLens=[];firstPath=null;stopDemo();
  trailNow.geometry.setDrawRange(0,0);trailFirst.visible=false;
  refreshVis();
}

/* ============ 统计 / 公式 / 步骤 ============ */
let curText='';
const elEp=document.getElementById('stEp'),elEps=document.getElementById('stEps'),
      elLen=document.getElementById('stLen'),elAvg=document.getElementById('stAvg');
function updateStats(){
  elEp.textContent=episodes;
  elEps.textContent=eps.toFixed(2);
  const gp=greedyPath();
  elLen.innerHTML=gp.looped?'<small>打转</small>':(gp.path.length-1)+'<small> 步</small>';
  const avg=epLens.length?epLens.reduce((a,b)=>a+b,0)/Math.min(epLens.length,20):NaN;
  elAvg.textContent=Number.isNaN(avg)?'—':avg.toFixed(1);
}
const formulaEl=document.getElementById('formula');
function updateFormula(){
  formulaEl.innerHTML=L(
    `Q(s,a) ← Q(s,a) + <b>α</b>·[ r + <b>γ</b>·maxQ(s′) − Q(s,a) ]　·　α=${alpha.toFixed(2)}，γ=${gamma.toFixed(2)}`+
    `　·　奖励：每步 −0.04，终点 +1，陷阱 −1`,
    `Q(s,a) ← Q(s,a) + <b>α</b>·[ r + <b>γ</b>·maxQ(s′) − Q(s,a) ]　·　α=${alpha.toFixed(2)}, γ=${gamma.toFixed(2)}`+
    `　·　reward: step −0.04, goal +1, trap −1`);
}
const STEPS=[
  {zh:'瞎撞开局：ε-greedy 以概率 ε 随机试探，其余照 Q 表走',en:'Start flailing: ε-greedy explores with probability ε, else follows Q',
   act:()=>{resetQ();playing=true;training=true;syncPlay();curText=L('第 1 回合：纯粹乱撞','episode 1: pure flailing');}},
  {zh:'Bellman 更新：每步把奖励写回 Q(s,a)，误差乘 α',en:'Bellman update: write the reward back into Q(s,a), error × α',
   act:()=>{stopDemo();training=true;playing=true;syncPlay();curText=L('正在按 Bellman 方程逐格更新','updating cell by cell with Bellman');}},
  {zh:'价值回传：终点 +1 沿时间反方向一层层漫开',en:'Value backs up: the goal +1 floods outward backward in time',
   act:()=>{document.getElementById('btnTrain').click();}},
  {zh:'热图点亮：Q 值成为「路标」，离终点越近越亮',en:'Heatmap lights up: Q becomes signposts, brighter near the goal',
   act:()=>{document.getElementById('btnTrain').click();showHeat=true;document.getElementById('tglHeat').checked=true;}},
  {zh:'策略箭头：每格指向 argmax Q，箭头场汇向终点',en:'Policy arrows: argmax per cell — the field converges on the goal',
   act:()=>{document.getElementById('btnTrain').click();showArrows=true;document.getElementById('tglArrow').checked=true;}},
  {zh:'轨迹对比：第 1 回合乱撞（红）vs 训练后笔直绕开陷阱',en:'Before/after: flailing first episode (red) vs the straight trained path',
   act:()=>{document.getElementById('btnCompare').click();}},
  {zh:'探索-利用权衡：ε=0 容易卡死，ε=1 永不收敛——全在调节奏',en:'Explore vs exploit: ε=0 gets stuck, ε=1 never converges — tune the balance',
   act:()=>{sEps.value=100;sEps.dispatchEvent(new Event('input'));curText=L('ε=1：永远随机，热图永远糊的','ε=1: always random, heatmap stays muddy');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.zh,s.en)}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ============ UI ============ */
const playBtn=document.getElementById('play');
function syncPlay(){playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');}
playBtn.addEventListener('click',()=>{playing=!playing;syncPlay();if(playing){training=true;stopDemo();}});
document.getElementById('btnTrain').addEventListener('click',()=>{
  const k=+sEp.value;training=true;stopDemo();
  for(let i=0;i<k;i++)trainEpisode();
  const lp=trainEpisode();
  setLine(trailNow,lp);
  curText=L(`已训练 ${episodes} 回合，最新轨迹如橙线`,`trained ${episodes} episodes, latest path in orange`);
  refreshVis();
});
document.getElementById('btnDemo').addEventListener('click',()=>{startDemo();});
document.getElementById('btnCompare').addEventListener('click',()=>{
  stopDemo();training=false;
  const gp=greedyPath();
  setLine(trailNow,gp.path);
  if(firstPath){trailFirst.visible=true;setLine(trailFirst,firstPath);}
  curText=L(`红=第 1 回合乱撞，橙=现在贪心（${gp.path.length-1} 步）——同一张 Q 表的两副面孔`,
    `red = first episode, orange = greedy now (${gp.path.length-1} steps) — same Q-table, two faces`);
});
const edBtns={edWall:'wall',edTrap:'trap',edClear:'clear'};
for(const [id,m] of Object.entries(edBtns)){
  document.getElementById(id).addEventListener('click',()=>{
    editMode=m;Object.keys(edBtns).forEach(k=>document.getElementById(k).classList.toggle('on',k===id));
    curText=L('点击网格修改地形，Q 表会清空重学','click the grid to edit terrain — Q resets and relearns');
  });
}
document.getElementById('btnReset').addEventListener('click',()=>{resetQ();curText=L('Q 已清空：回到一无所知','Q cleared: back to knowing nothing');});
sEp.addEventListener('input',()=>{document.getElementById('sEpVal').textContent=sEp.value;});
sEps.addEventListener('input',()=>{eps=+sEps.value/100;document.getElementById('sEpsVal').textContent=eps.toFixed(2);});
document.getElementById('tglHeat').addEventListener('change',e=>{showHeat=e.target.checked;refreshVis();});
document.getElementById('tglArrow').addEventListener('change',e=>{showArrows=e.target.checked;refreshVis();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playBtn.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x0f1113:0xf1efec);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps();updateFormula();
}

/* ============ 点击编辑地形 ============ */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6)return;   // 拖拽视为旋转
  ptr.x=(e.clientX/innerWidth)*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(tileMeshes)[0];
  if(!hit)return;
  const s=hit.object.userData.cell;
  if(isGoal(s))return;
  if(editMode==='wall'){walls.add(s);traps.delete(s);hit.object.geometry=wallGeo;hit.object.position.y=0.45;}
  else if(editMode==='trap'){traps.add(s);walls.delete(s);hit.object.geometry=tileGeo;hit.object.position.y=0;}
  else{walls.delete(s);traps.delete(s);hit.object.geometry=tileGeo;hit.object.position.y=0;}
  resetQ();
  curText=L('世界变了：Q 清零重学','world changed: Q reset, relearning');
});

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing&&training){
    /* 持续训练：每帧 2 回合，肉眼可见地收敛 */
    let lp=null;
    for(let i=0;i<2;i++)lp=trainEpisode();
    if(showHeat||showArrows)refreshVis();
    setLine(trailNow,lp);
    trailNow.visible=true;
  }
  if(demo){
    demoTimer+=dt;
    const stepDur=0.22;
    while(demoTimer>stepDur&&demoIdx<demo.path.length-1){
      demoTimer-=stepDur;demoIdx++;
      const s=demo.path[demoIdx],[r,c]=RC(s);
      agent.position.set(cellX(c),0.42,cellZ(r));
      if(isGoal(s)){curText=L('到达终点！','goal reached!');demo=null;break;}
      if(isTrap(s)){curText=L('踩进陷阱……','fell into the trap…');demo=null;break;}
    }
  }
  /* 终点信标脉动 */
  beacon.scale.setScalar(1+0.15*Math.sin(performance.now()*0.004));
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg)r.o.visible=labelsOn;
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ============ 初始化 ============ */
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
applyTheme();applyLang();
refreshVis();
/* 开场：先盲跑 1 回合留底，再训练 250 回合，10 秒内看到「乱撞→最优」 */
trainEpisode();
for(let i=0;i<250;i++)trainEpisode();
setLine(trailNow,greedyPath().path);
curText=L('已预训练 250 回合——点「轨迹对比」看前后差别','pre-trained 250 episodes — hit "before/after" to compare');
start();
</script>
