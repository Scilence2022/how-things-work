<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>叠加态与测量 · 既上又下，直到被偷看</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="叠加态与测量" data-en="Superposition & Measurement">叠加态与测量</h1>
  <div class="sub" data-zh="看原子自旋的两个幽灵箭头按 cos²(θ/2) 坍缩成直方图；转动测量基分布跟着转，调高「环境偷看率」看量子分布熔回经典 · 拖动旋转 / 空格运行/暂停" data-en="Two ghost spin arrows collapse into a cos²(θ/2) histogram; rotate the measurement basis and the distribution rotates; raise the eavesdropping rate and watch quantum melt into classical · drag to orbit / Space = run/pause">看原子自旋的两个幽灵箭头按 cos²(θ/2) 坍缩成直方图；转动测量基分布跟着转，调高「环境偷看率」看量子分布熔回经典 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---- 工具 ---- */
const qs=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const D2R=Math.PI/180;
const rnd=(a,b)=>a+Math.random()*(b-a);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 / 场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,14,36);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,120);
camera.position.set(1.2,2.0,9.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.4,0.4,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=3; controls.maxDistance=40;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(4,7,6); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-6,4,-4); scene.add(fill);

/* ---- 玻色球（Bloch sphere）：中心原子 + 线框 + 轴 ---- */
const ORB=new THREE.Vector3(-1.6,0.4,0);
const R=1.25;
const wire=new THREE.Mesh(new THREE.SphereGeometry(R,24,16),
  new THREE.MeshBasicMaterial({color:0x51607a,wireframe:true,transparent:true,opacity:.35}));
wire.position.copy(ORB); scene.add(wire);
const core=new THREE.Mesh(new THREE.SphereGeometry(0.16,16,12),
  new THREE.MeshStandardMaterial({color:0xffd8a8,emissive:0xffa94d,emissiveIntensity:.7,roughness:.3}));
core.position.copy(ORB); scene.add(core);
/* 轴 */
const axisMat=new THREE.LineBasicMaterial({color:0x3a4a5e});
function axisLine(dir){
  const g=new THREE.BufferGeometry().setFromPoints([ORB.clone().addScaledVector(dir,-R*1.15),ORB.clone().addScaledVector(dir,R*1.15)]);
  scene.add(new THREE.Line(g,axisMat));
}
axisLine(new THREE.Vector3(1,0,0)); axisLine(new THREE.Vector3(0,1,0)); axisLine(new THREE.Vector3(0,0,1));

/* 箭头构造（默认指向 +y，用四元数转向） */
function makeArrow(color,len,r){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.55,transparent:true,roughness:.35});
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len*0.78,10),mat);
  shaft.position.y=len*0.39; g.add(shaft);
  const tip=new THREE.Mesh(new THREE.ConeGeometry(r*2.1,len*0.26,12),mat);
  tip.position.y=len*0.87; g.add(tip);
  g.userData.mat=mat; scene.add(g); return g;
}
function pointArrow(g,dir){
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
}
const upArrow=makeArrow(0x74c0fc,0.95,0.05);   // |↑⟩ 幽灵
const dnArrow=makeArrow(0xe599f7,0.95,0.05);   // |↓⟩ 幽灵
const psiArrow=makeArrow(0xffa94d,1.5,0.055);  // |ψ⟩ 态矢

/* 测量基圆环 + 结果端点 */
const ring=new THREE.Mesh(new THREE.TorusGeometry(R*1.18,0.035,10,64),
  new THREE.MeshStandardMaterial({color:0xffe8cc,emissive:0xffa94d,emissiveIntensity:.4,roughness:.4}));
scene.add(ring);
const dotPlus=makeArrow(0x69db7c,0.5,0.05);
const dotMinus=makeArrow(0x868e96,0.5,0.05);

/* ---- 环境光子（退相干） ---- */
const FN=14;
const fMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.06,8,6),
  new THREE.MeshStandardMaterial({color:0xffe066,emissive:0xf08c00,emissiveIntensity:.8,transparent:true,opacity:.85}),FN);
fMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(fMesh);
const zeroM=new THREE.Matrix4().makeScale(0,0,0), tmpM=new THREE.Matrix4();
const phots=[];
for(let i=0;i<FN;i++){ fMesh.setMatrixAt(i,zeroM); phots.push({on:false,p:new THREE.Vector3(),v:new THREE.Vector3(),t:0}); }
let photTimer=0;

/* ---- 直方图面板（canvas 纹理） ---- */
const cv=document.createElement('canvas'); cv.width=300; cv.height=300;
const c2=cv.getContext('2d');
const cvTex=new THREE.CanvasTexture(cv);
const histFrame=new THREE.Mesh(new THREE.BoxGeometry(3.9,3.9,0.06),
  new THREE.MeshStandardMaterial({color:0x161b22,roughness:.9}));
histFrame.position.set(4.0,0.6,-0.3); scene.add(histFrame);
const hist=new THREE.Mesh(new THREE.PlaneGeometry(3.7,3.7),
  new THREE.MeshBasicMaterial({map:cvTex,transparent:true,opacity:.97}));
hist.position.set(4.0,0.6,-0.26); scene.add(hist);

/* ---- 状态 ---- */
let playing=true, labelsOn=true, auto=true, autoAcc=0;
let theta=90, beta=0, gam=0;      // 角度单位：度
let D=0, nMeas=0, cntP=0, cntM=0, flashT=0, flashSign=1;
const ticks=[];
function pPlus(){
  const th=theta*D2R, be=beta*D2R;
  // 相干：p=cos²((θ−β)/2)=½[1+cos(θ−β)]；退相干 D 抹掉干涉项 sinθ·sinβ
  return clamp(0.5+0.5*(Math.cos(th)*Math.cos(be)+(1-D)*Math.sin(th)*Math.sin(be)),0,1);
}
function record(plus){
  nMeas++; if(plus)cntP++; else cntM++;
  ticks.push(plus?1:-1); if(ticks.length>96)ticks.shift();
  flashT=1; flashSign=plus?1:-1;
}
function clearStats(){ nMeas=0;cntP=0;cntM=0;ticks.length=0; }

function drawHist(){
  c2.clearRect(0,0,300,300);
  const tot=cntP+cntM;
  /* 经验占比柱（＋）与理论线 */
  const bx=34, bw=54, H=170, by=52;
  c2.strokeStyle='#3a4a5e'; c2.strokeRect(bx,by,bw,H); c2.strokeRect(bx+86,by,bw,H);
  const empP=tot?cntP/tot:0;
  c2.fillStyle='rgba(255,169,77,.85)'; c2.fillRect(bx,by+H*(1-empP),bw,H*empP);
  const empM=tot?cntM/tot:0;
  c2.fillStyle='rgba(229,153,247,.8)'; c2.fillRect(bx+86,by+H*(1-empM),bw,H*empM);
  const th=pPlus();
  c2.strokeStyle='#69db7c'; c2.setLineDash([5,4]); c2.beginPath();
  const ty=by+H*(1-th); c2.moveTo(bx-6,ty); c2.lineTo(bx+bw+92,ty); c2.stroke(); c2.setLineDash([]);
  c2.fillStyle='#9fb0c3'; c2.font='13px sans-serif'; c2.textAlign='center';
  c2.fillText('n='+(cntP+cntM),150,290);
  c2.fillText((empP*100).toFixed(0)+'%',bx+bw/2,by-8);
  c2.fillText((empM*100).toFixed(0)+'%',bx+86+bw/2,by-8);
  c2.fillStyle='#69db7c'; c2.fillText('理论 '+Math.round(th*100)+'%',210,ty-8);
  /* 结果纸带：最近 48 次 */
  const x0=34, y0=258, dx=232/48;
  for(let i=0;i<Math.min(ticks.length,48);i++){
    const t=ticks[ticks.length-1-i];
    c2.fillStyle=t>0?'#ffa94d':'#74c0fc';
    c2.beginPath(); c2.arc(x0+dx*i+(t>0?0:dx/2),t>0?y0:y0+13,3,0,6.29); c2.fill();
  }
  cvTex.needsUpdate=true;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>`|ψ⟩ = cos(${(theta/2).toFixed(0)}°)|↑⟩ + e^{iφ}·sin(${(theta/2).toFixed(0)}°)|↓⟩`,
  new THREE.Vector3(-1.6,2.35,0),'b',()=>true);
addLabel(()=>L('|↑⟩ 幽灵：权重 cos²(θ/2)','|↑⟩ ghost · weight cos²(θ/2)'),
  new THREE.Vector3(-1.6,1.45,0),'' );
addLabel(()=>L('|↓⟩ 幽灵：权重 sin²(θ/2)','|↓⟩ ghost · weight sin²(θ/2)'),
  new THREE.Vector3(-1.6,-1.15,0),'');
addLabel(()=>L('测量基（可旋转的环）','Measurement basis (rotatable ring)'),
  new THREE.Vector3(-1.6,-2.15,0),'o',()=>true);
addLabel(()=>L('环境光子：每次偷看都在泄漏相位','Environment photons: each peek leaks phase'),
  new THREE.Vector3(-3.4,2.6,0),'r',()=>gam>3);
addLabel(()=>L('直方图：每颗原子重新制备后测一次','Histogram: one fresh atom per measurement'),
  new THREE.Vector3(4.0,-1.55,-0.26),'g',()=>true);

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'叠加态 |ψ⟩=cos(θ/2)|↑⟩+e^{iφ}sin(θ/2)|↓⟩：两个幽灵箭头同时在场',en:'|ψ⟩=cos(θ/2)|↑⟩+e^{iφ}sin(θ/2)|↓⟩: both ghost arrows coexist'},
 {zh:'概率=系数模方：测得「上」的概率是 cos²(θ/2)',en:'Probability = |coefficient|²: P(up)=cos²(θ/2)'},
 {zh:'测量即坍缩：单次只出一个本征值，随机但偏置',en:'Measurement collapses: one eigenvalue, random yet biased'},
 {zh:'转动测量基 β：分布 cos²((θ−β)/2) 当场跟着转',en:'Rotate basis β: the distribution cos²((θ−β)/2) rotates with it'},
 {zh:'对照偏振：马吕斯定律 cos²θ 与自旋 cos²(θ/2) 同构（因子 2 来自自旋 1/2）',en:'Malus law cos²θ vs spin cos²(θ/2): factor 2 from spin-½'},
 {zh:'退相干：环境光子偷看抹掉干涉项 → 直方图熔回经典混合',en:'Decoherence: eavesdropping kills the interference term → classical mixture'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 读数 ---- */
function updateStats(){
  const tot=cntP+cntM;
  document.getElementById('stN').innerHTML=nMeas+'<small> 次</small>';
  document.getElementById('stEmp').innerHTML=(tot?Math.round(cntP/tot*100):0)+'<small> %</small>';
  document.getElementById('stTheo').innerHTML=Math.round(pPlus()*100)+'<small> %</small>';
  document.getElementById('stV').innerHTML=(100*(1-D)).toFixed(0)+'<small> %</small>';
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  histFrame.material.color.setHex(dark?0x161b22:0xdcd6cc); // 直方图面板随主题
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}

/* ---- 交互 ---- */
function setPlaying(v){
  playing=v;
  document.getElementById('play').textContent=v?L('暂停','Pause'):L('运行','Run');
}
document.getElementById('btnOne').addEventListener('click',()=>record(Math.random()<pPlus()));
document.getElementById('btnAuto').addEventListener('click',e=>{
  auto=!auto; e.currentTarget.classList.toggle('on',auto);
});
document.getElementById('btnClear').addEventListener('click',clearStats);
document.getElementById('sThe').addEventListener('input',e=>{
  theta=+e.target.value; document.getElementById('sTheVal').textContent=theta+'°';
});
document.getElementById('sBas').addEventListener('input',e=>{
  beta=+e.target.value; document.getElementById('sBasVal').textContent=beta+'°';
});
document.getElementById('sGam').addEventListener('input',e=>{
  gam=+e.target.value; document.getElementById('sGamVal').textContent=gam;
});
document.getElementById('play').addEventListener('click',()=>setPlaying(!playing));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 每帧更新 ---- */
function updateScene(dt){
  const th=theta*D2R, be=beta*D2R;
  /* 幽灵箭头：长度固定，透明度=权重；退相干时闪烁 */
  const wUp=Math.cos(th/2)**2, wDn=Math.sin(th/2)**2;
  const flick=1-0.25*D*Math.abs(Math.sin(simT*13));
  upArrow.userData.mat.opacity=wUp*flick;
  dnArrow.userData.mat.opacity=wDn*flick;
  upArrow.position.copy(ORB); dnArrow.position.copy(ORB);
  pointArrow(upArrow,new THREE.Vector3(0,1,0.18));
  pointArrow(dnArrow,new THREE.Vector3(0,-1,-0.18));
  /* 态矢 */
  const n=new THREE.Vector3(Math.sin(th),Math.cos(th),0);
  psiArrow.position.copy(ORB); pointArrow(psiArrow,n);
  /* 测量环：轴向 n̂β=(0,cosβ,sinβ)，绕 x 旋转 β−π/2 */
  ring.position.copy(ORB); ring.rotation.set(0,0,0);
  ring.rotation.x=be-Math.PI/2;
  const nB=new THREE.Vector3(0,Math.cos(be),Math.sin(be));
  dotPlus.position.copy(ORB).addScaledVector(nB,R*1.42);
  dotMinus.position.copy(ORB).addScaledVector(nB,-R*1.42);
  pointArrow(dotPlus,nB); pointArrow(dotMinus,nB.clone().negate());
  const fs=flashT>0?1+flashT*1.4:1;
  dotPlus.userData.mat.opacity=0.35+0.65*flashT*(flashSign>0?1:0.2);
  dotMinus.userData.mat.opacity=0.35+0.65*flashT*(flashSign<0?1:0.2);
  dotPlus.scale.setScalar(flashSign>0?fs:1);
  dotMinus.scale.setScalar(flashSign<0?fs:1);
  flashT=Math.max(0,flashT-dt*2.4);
  /* 环境光子 */
  photTimer+=dt*gam/100*7;
  while(photTimer>=1){
    photTimer-=1;
    for(const f of phots) if(!f.on){
      f.on=true; f.t=0;
      const d=new THREE.Vector3().randomDirection();
      f.p.copy(ORB).addScaledVector(d,3.2);
      f.v.copy(d).multiplyScalar(-rnd(1.6,2.6));
      f.v.x+=rnd(-0.4,0.4); break;
    }
  }
  for(let i=0;i<FN;i++){
    const f=phots[i];
    if(!f.on){ fMesh.setMatrixAt(i,zeroM); continue; }
    f.t+=dt; f.p.addScaledVector(f.v,dt);
    if(f.t>2||f.p.distanceTo(ORB)>4){ f.on=false; fMesh.setMatrixAt(i,zeroM); continue; }
    tmpM.makeScale(1,1,1).setPosition(f.p); fMesh.setMatrixAt(i,tmpM);
  }
  fMesh.instanceMatrix.needsUpdate=true;
  /* 退相干强度 D 平滑趋近 Γ */
  D+=(gam/100-D)*Math.min(1,dt*2.5);
  /* 连发测量：运行态自动慢节奏（约 0.35s 一次）；?pause=1 静止，手动按钮不受限 */
  if(auto&&playing){
    autoAcc+=dt;
    if(autoAcc>=0.35){ autoAcc=0; record(Math.random()<pPlus()); }
  }
}

/* ---- 主循环 ---- */
let simT=0;
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  updateScene(dt);
  acc+=dt;
  if(acc>0.1){acc=0;updateStats();drawHist();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis(); if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数 & 启动 ---- */
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
const qsTh=parseFloat(qs.get('theta'));
if(Number.isFinite(qsTh)){theta=clamp(qsTh,0,180);document.getElementById('sThe').value=theta;document.getElementById('sTheVal').textContent=theta+'°';}
const qsBe=parseFloat(qs.get('basis'));
if(Number.isFinite(qsBe)){beta=clamp(qsBe,0,180);document.getElementById('sBas').value=beta;document.getElementById('sBasVal').textContent=beta+'°';}
applyTheme(); applyLang(); drawHist();
document.getElementById('btnAuto').classList.add('on');
if(qs.get('pause')==='1') setPlaying(false);
start();
</script>
