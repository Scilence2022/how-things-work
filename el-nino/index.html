<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>厄尔尼诺-南方涛动 · 信风一松,太平洋翻脸</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff922b;
    --bg:#0d1218; --panel:rgba(13,18,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,18,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,18,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#eff1f4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.c { border-color: rgba(102,212,200,.9); color: #c3f5ef; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(104,212,124,.9); color: #c8f5d0; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.c { color:#0b7285; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 210px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 240px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #74c0fc; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }
  #stats .v.cool { color: #66d2c8; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,169,77,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.c { color: #c3f5ef; border-color: rgba(102,212,200,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  :root[data-theme="light"] .chip.c { color:#0b7285; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,146,43,.6); background: rgba(255,146,43,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(232,89,12,.55); background: rgba(232,89,12,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,146,43,.10); border-color: rgba(255,146,43,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="厄尔尼诺-南方涛动:信风一松,太平洋翻脸" data-en="El Niño–Southern Oscillation: slack the trades and the Pacific turns">厄尔尼诺-南方涛动:信风一松,太平洋翻脸</h1>
  <div class="sub" data-zh="信风把暖水堆向西 → 东太平洋冷舌上涌喂饱秘鲁渔场 → 信风一减弱,暖水回流、冷舌下沉 → 渔场塌、雨带搬家 → Bjerknes 正反馈放大 → 过冲回摆成拉尼娜 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Trades pile warm water west → the eastern cold tongue upwells and feeds Peru's fisheries → slack the trades and warm water sloshes back, sinking the tongue → fisheries collapse, rains relocate → the Bjerknes feedback amplifies → overshoot swings back to La Niña · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">信风把暖水堆向西 → 东太平洋冷舌上涌喂饱秘鲁渔场 → 信风一减弱,暖水回流、冷舌下沉 → 渔场塌、雨带搬家 → Bjerknes 正反馈放大 → 过冲回摆成拉尼娜 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="Nino3.4 距平" data-en="Niño3.4 anomaly">Nino3.4 距平</span><span class="v" id="stN">—</span>
  <span class="k" data-zh="信风强度" data-en="Trade winds">信风强度</span><span class="v" id="stW">—</span>
  <span class="k" data-zh="温跃层东端" data-en="East thermocline">温跃层东端</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="上升流" data-en="Upwelling">上升流</span><span class="v" id="stU">—</span>
  <span class="k" data-zh="渔获指数" data-en="Catch index">渔获指数</span><span class="v" id="stF">—</span>
</div>

<div id="plot">
  <h3 data-zh="Nino3.4 指数(15 年)· 虚线 ±0.5 °C = 厄尔尼诺/拉尼娜门槛" data-en="Niño3.4 index (15 yr) · dashed ±0.5 °C = event thresholds">Nino3.4 指数(15 年)· 虚线 ±0.5 °C = 厄尔尼诺/拉尼娜门槛</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="暖池 >29 °C" data-en="warm pool >29 °C">暖池 >29 °C</span>
    <span class="chip.b" data-zh="冷舌 ~24 °C" data-en="cold tongue ~24 °C">冷舌 ~24 °C</span>
    <span class="chip.c" data-zh="温跃层" data-en="thermocline">温跃层</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnPhase" data-zh="手动相位" data-en="manual phase">手动相位</button>
    <button class="abtn" id="btnTime" data-zh="时间轴播放" data-en="play timeline">时间轴播放</button>
    <button class="abtn" id="btnNormal" data-zh="设为正常年" data-en="set neutral">设为正常年</button>
    <button class="abtn" id="btnNino" data-zh="强厄尔尼诺" data-en="strong El Niño">强厄尔尼诺</button>
    <button class="abtn" id="btnNina" data-zh="强拉尼娜" data-en="strong La Niña">强拉尼娜</button>
  </div>
  <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="ph" type="range" min="-1" max="1" step="0.01" value="0"><span class="val" id="phVal">正常</span></div>
  <div class="row"><label data-zh="时间轴" data-en="Timeline">时间轴</label><input id="tm" type="range" min="0" max="15" step="0.02" value="0"><span class="val" id="tmVal">0 年</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../atmospheric-circulation/" data-zh="信风从哪里来" data-en="where the trades come from">信风从哪里来</a>
    <a href="../ocean-conveyor/" data-zh="海水的大搬运" data-en="the ocean's conveyor">海水的大搬运</a>
    <a href="../cloud-formation/" data-zh="对流怎么造雨" data-en="how convection makes rain">对流怎么造雨</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeff1f4 : 0x0d1218);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('厄尔尼诺-南方涛动 · 信风一松,太平洋翻脸', 'El Niño–Southern Oscillation · slack the trades');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setModeBtns();
  setPlayLabel();
  updateFormula();
  drawPlot();
  syncPhaseUI();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 5.0, 10.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.55, -0.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 9, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 4, -5);
scene.add(fill);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.08,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}

/* ================= 海盆:x=-4 西(印尼) … +4 东(秘鲁) ================= */
const BASIN = { x0: -4, x1: 4, z0: -1.6, z1: 1.6, y0: -1.55 };
const basin = new THREE.Mesh(new THREE.BoxGeometry(BASIN.x1 - BASIN.x0, 1.9, BASIN.z1 - BASIN.z0),
  mat(0x39424e, { opacity: 0.14, side: THREE.BackSide, depthWrite: false }));
basin.position.y = -0.65;
scene.add(basin);
const floor = new THREE.Mesh(new THREE.BoxGeometry(BASIN.x1 - BASIN.x0, 0.08, BASIN.z1 - BASIN.z0),
  mat(0x2a3038, { opacity: 0.95, emissive: 0x000000 }));
floor.position.y = BASIN.y0;
scene.add(floor);
/* 两侧陆地示意 */
const westLand = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.1, 3.2), mat(0x3e7a4c, { opacity: 0.9 }));
westLand.position.set(BASIN.x0 - 0.35, -0.15, 0);
scene.add(westLand);
const eastLand = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.1, 3.2), mat(0x8a6b42, { opacity: 0.9 }));
eastLand.position.set(BASIN.x1 + 0.35, -0.15, 0);
scene.add(eastLand);

/* 海面:顶点着色 SST 图 */
const SURF_W = 56, SURF_H = 18;
const surfGeo = new THREE.PlaneGeometry(BASIN.x1 - BASIN.x0, BASIN.z1 - BASIN.z0, SURF_W, SURF_H);
const surf = new THREE.Mesh(surfGeo, new THREE.MeshStandardMaterial({ vertexColors: true,
  roughness: 0.18, metalness: 0.25, transparent: true, opacity: 0.96 }));
surf.rotation.x = -Math.PI / 2;
surf.position.y = 0.62;
scene.add(surf);
const cWarm = new THREE.Color(0xff6b35), cMid = new THREE.Color(0x2e9ec7), cCold = new THREE.Color(0x274fa0);
const sCol = new THREE.Color();
surfGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(surfGeo.attributes.position.count * 3), 3));
function paintSurface(s) {
  const pos = surfGeo.attributes.position, col = surfGeo.attributes.color;
  const SSTw = 29.5 - 1.4 * s, SSTe = 23.8 + 3.8 * Math.max(s, 0) - 1.2 * Math.max(-s, 0);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const u = clamp((x - BASIN.x0) / (BASIN.x1 - BASIN.x0), 0, 1);
    const wedge = Math.pow(u, 1.7);                       // 冷舌贴着东缘楔入
    const edge = 1 - 0.5 * Math.pow(Math.abs(z) / ((BASIN.z1 - BASIN.z0) / 2), 3);
    const sst = lerp(SSTw, SSTe, wedge) + (1 - edge) * 1.2;
    const t = clamp((sst - 24) / 5.5, 0, 1);
    if (t > 0.5) sCol.lerpColors(cMid, cWarm, (t - 0.5) / 0.5);
    else sCol.lerpColors(cCold, cMid, t / 0.5);
    col.setXYZ(i, sCol.r, sCol.g, sCol.b);
  }
  col.needsUpdate = true;
}

function rebuildWalker(s) {
  const key = Math.round(s * 20);
  if (key === walkPhaseKey && walkMesh) return;
  walkPhaseKey = key;
  if (walkMesh) { walkGrp.remove(walkMesh); walkMesh.geometry.dispose(); }
  const xR = lerp(-2.4, 0.6, (s + 1) / 2);        // 上升支:暖池上空(厄时东移)
  const sink = clamp(xR + 3.2, 1.2, 3.4);          // 下沉支大致在东侧
  const pts = [];
  const amp = 0.55 + 0.5 * (1 - Math.abs(s) * 0.4);
  for (let i = 0; i <= 24; i++) {
    const u = i / 24;
    /* 闭合椭圆:表面回流(逆风) → 上升 → 高空东行 → 下沉 */
    let x, y;
    if (u < 0.5) { x = lerp(sink, xR, u / 0.5); y = 2.15 * amp + Math.sin(u / 0.5 * Math.PI) * 0.22; }
    else { x = lerp(xR, sink, (u - 0.5) / 0.5); y = 0.92 - Math.sin((u - 0.5) / 0.5 * Math.PI) * 0.62; }
    pts.push(new THREE.Vector3(x, Math.max(y, 0.78), 0.9 * Math.sin(u * Math.PI * 2) * 0.06 + 0.15));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true);
  walkMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.05, 6, true), walkMat);
  walkGrp.add(walkMesh);
}

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
const NSAMP = 300, SAMPLE_DT = 0.05;
const hist = [];
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 12, padB = 18;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const yOf = v => pad + (H - pad - padB) * (1 - clamp(v, -4, 4) / 8);
  /* 事件门槛 ±0.5 °C */
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2; ctx.setLineDash([8, 7]);
  ctx.beginPath(); ctx.moveTo(pad, yOf(0.5)); ctx.lineTo(W - pad, yOf(0.5)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, yOf(-0.5)); ctx.lineTo(W - pad, yOf(-0.5)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - padB); ctx.lineTo(W - pad, H - padB); ctx.stroke();
  /* 分段着色的指数曲线 */
  ctx.lineWidth = 2.6;
  for (let i = 1; i < hist.length; i++) {
    const v = hist[i];
    ctx.strokeStyle = v > 0.5 ? '#ff6b6b' : v < -0.5 ? '#74c0fc' : '#c7d2de';
    ctx.beginPath();
    ctx.moveTo(pad + (W - 2 * pad) * (i - 1) / (NSAMP - 1), yOf(hist[i - 1]));
    ctx.lineTo(pad + (W - 2 * pad) * i / (NSAMP - 1), yOf(v));
    ctx.stroke();
  }
  ctx.fillStyle = cTxt; ctx.font = '16px system-ui';
  ctx.fillText('+0.5', pad - 1, yOf(0.5) - 4);
  ctx.fillText('−0.5', pad - 1, yOf(-0.5) + 14);
}

/* ---------------- 粒子驱动 ---------------- */
const dummy = new THREE.Object3D();
function updateParticles(dt, vis, up, wind) {
  /* 上升流 */
  const upRate = vis * up * 0.09;
  for (let i = 0; i < UP_N; i++) {
    const st = upState[i];
    st.t += upRate * st.w;
    if (st.t > 1) st.t -= 1;
    const y = lerp(BASIN.y0 + 0.1, 0.56, st.t);
    const fade = Math.sin(Math.PI * clamp(st.t, 0, 1));
    dummy.position.set(3.35 - st.dx * (1 - st.t) * 1.4, y, st.z);
    dummy.scale.setScalar(0.6 + fade * 0.9);
    dummy.updateMatrix();
    upIM.setMatrixAt(i, dummy.matrix);
  }
  upIM.instanceMatrix.needsUpdate = true;
  upIM.visible = up > 8;
  /* 鱼群:数量与位置随上升流 */
  const nFish = Math.round(FISH_N * clamp(up / 110, 0, 1));
  const now = performance.now() / 1000;
  for (let i = 0; i < FISH_N; i++) {
    const st = fishState[i];
    if (i < nFish) {
      dummy.position.set(st.x + Math.sin(now * 1.4 + st.ph) * 0.18, 0.05 - clamp(up / 120, 0, 1) * 0.55 + Math.sin(now + st.ph) * 0.06, st.z);
      dummy.scale.setScalar(0.85);
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.001); }
    dummy.updateMatrix();
    fishIM.setMatrixAt(i, dummy.matrix);
  }
  fishIM.instanceMatrix.needsUpdate = true;
  /* 信风箭头 */
  windArrows.forEach((a, i) => {
    a.visible = wind > 14;
    a.setLength(0.95 * clamp(wind / 72, 0.12, 1.4), 0.26, 0.14);
    a.position.y = 1.12 + Math.sin(now * 2 + i) * 0.045;
  });
  /* 雨:暖柱下落 */
  const cloudX = lerp(-2.5, 0.8, (s + 1) / 2);
  for (const p of cloudGrp.children) {
    p.position.set(cloudX + p.userData.dx, 2.35 + p.userData.dy + Math.sin(now * 0.9 + p.userData.ph) * 0.06, p.userData.dx * 0.4);
    p.scale.setScalar(1 + 0.08 * Math.sin(now * 1.7 + p.userData.ph));
  }
  const rainRate = vis * 1.4;
  for (let i = 0; i < RAIN_N; i++) {
    const st = rainState[i];
    st.t += rainRate * (0.8 + st.dx * 0.2);
    if (st.t > 1) st.t -= 1;
    dummy.position.set(cloudX + st.dx, lerp(2.1, 0.68, st.t), st.dz);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    rainIM.setMatrixAt(i, dummy.matrix);
  }
  rainIM.instanceMatrix.needsUpdate = true;
  poolGlow.position.x = cloudX;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 1, sampleAcc = 1;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const vis = dt * speed;
  if (playing && timeMode) {
    tSim += vis * RATE_YR;
    if (tSim > 15) tSim -= 15;
    s = enso(tSim);
    sampleAcc += vis * RATE_YR;
    while (sampleAcc >= SAMPLE_DT) {
      sampleAcc -= SAMPLE_DT;
      hist.push(enso(tSim));
      if (hist.length > NSAMP) hist.shift();
    }
    syncPhaseUI();
  }
  const up = upwellPct(), wind = windPct();
  paintSurface(s);
  paintThermocline(s);
  rebuildWalker(s);
  walkMat.opacity = 0.25 + 0.6 * clamp(1 - Math.abs(s) * 0.7, 0, 1);
  waterGrp.rotation.z = -0.012 * (1 - s) * 0.5;
  waterGrp.position.y = 0;
  updateParticles(dt, vis, up, wind);
  statsAcc += dt;
  if (statsAcc > 0.25) {
    statsAcc = 0;
    stN.textContent = (nino34() >= 0 ? '+' : '') + nino34().toFixed(1) + ' °C';
    stN.className = 'v ' + (nino34() > 2 ? 'bad' : nino34() > 0.5 ? 'warn' : nino34() < -2 ? 'cool' : 'ok');
    stW.innerHTML = wind.toFixed(0) + ' <small>%</small>';
    stW.className = 'v ' + (wind < 40 ? 'bad' : 'ok');
    stT.innerHTML = thermE().toFixed(0) + ' <small>m</small>';
    stU.innerHTML = up.toFixed(0) + ' <small>%</small>';
    stF.innerHTML = catchIdx().toFixed(0) + ' <small>%</small>';
    stF.className = 'v ' + (catchIdx() < 40 ? 'bad' : catchIdx() < 80 ? 'warn' : 'ok');
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
if (!timeMode) {
  /* 手动相位:预填一条历史以便曲线非空 */
  for (let i = NSAMP - 1; i >= 0; i--) hist.push(enso(tSim - i * SAMPLE_DT));
} else {
  for (let i = NSAMP - 1; i >= 0; i--) hist.push(enso(tSim - i * SAMPLE_DT));
  s = enso(tSim);
}
paintSurface(s);
paintThermocline(s);
rebuildWalker(s);
setModeBtns();
applyTheme();
applyLang();
syncPhaseUI();
setPlayLabel();
start();
</script>
