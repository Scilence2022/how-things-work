<style>
  :root,:root[data-theme="dark"]{

  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 不完全齿轮机构（几何与运动学均按真实关系建模）
   - 主动轮：只有一段有齿（角宽 β = n₁·2π/z₁），其余为锁止弧，半径取 R₁（=主动轮节圆半径）。
   - 从动轮：全齿齿轮 z₂，在每个「停车位」挖出以主动轮轴心为圆心、半径 R₁+c 的锁止凹弧，
     凹弧恰好容纳旋转的锁止弧 → 停歇期从动轮被几何锁死（c 为间隙，滑块可调）。
   - 运动学：啮合期 θ₂ = θ₂₀ - (R₁/R₂)·ψ（ψ 为啮合内相位），每循环从动轮恰好转过
     n₁·(2π/z₂)（整数个齿距）→ 相位永远对齐；停歇期 ω₂ = 0。
   - 凹弧角半径由数值二分求得：cutR(ψ) = a·cosψ - √(Rc²-a²sin²ψ) 与齿顶圆相交处。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const TAU=Math.PI*2, R2D=180/Math.PI;
const wrap=a=>{a%=TAU;return a<-Math.PI?a+TAU:(a>=Math.PI?a-TAU:a);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0,2.4,11.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=40;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.65));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(4,7,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-6,4,-6);scene.add(fill);

/* ---- 材质 ---- */
const mDriver=new THREE.MeshStandardMaterial({color:0x4a7fa5,roughness:0.32,metalness:0.72});
const mDriven=new THREE.MeshStandardMaterial({color:0x3f9f78,roughness:0.32,metalness:0.7});
const mArc=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xff8c00,emissiveIntensity:0.8,roughness:0.3,side:THREE.DoubleSide});
const mLock=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.5,transparent:true,opacity:0.85,side:THREE.DoubleSide});
const mPin=new THREE.MeshStandardMaterial({color:0x3d4654,roughness:0.5,metalness:0.6});
const mPlate=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const mPtr=new THREE.MeshStandardMaterial({color:0xf1f3f5,emissive:0x8899aa,emissiveIntensity:0.4});

/* ---- 参数（1 世界单位 = 10 mm；模数 m=0.2 即 2 mm，示意梯形齿，真实为渐开线）---- */
const M=0.2, Z1=20, R1=M*Z1/2;
let n1=4, z2=16, cLock=0.016;
let R2,P2,A,RHO,BETA,HALFB,TH20,RC,Wpsi,recess=[];

/* 齿形：极角→半径（齿中心位于相位+k·齿距，梯形齿） */
function gearR(psi,z,rp,ph){
  const p=TAU/z;let u=((psi-ph)/p)%1;if(u<0)u+=1;
  const d=Math.min(u,1-u);
  const rt=rp+M,rr=rp-1.25*M,w=0.16,f=0.10;
  if(d<w)return rt;
  if(d<w+f)return rt+(rr-rt)*(d-w)/f;
  return rr;
}
/* 锁止凹弧：以主动轮轴(距从动轮轴 a)为圆心、半径 RC 的圆与从动轮某方向射线的近交点 */
function cutR(ps){const s=RC*RC-A*A*Math.sin(ps)*Math.sin(ps);if(s<=0)return 1e9;return A*Math.cos(ps)-Math.sqrt(s);}

function buildShape(radFn,n,depth){
  const pts=[];
  for(let i=0;i<n;i++){const g=i/n*TAU,r=radFn(g);pts.push(new THREE.Vector2(r*Math.cos(g),r*Math.sin(g)));}
  const sh=new THREE.Shape(pts);
  const geo=new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:false});
  geo.translate(0,0,-depth/2);
  return geo;
}

/* ---- 网格对象 ---- */
const meshD=new THREE.Mesh(new THREE.BufferGeometry(),mDriver);
const meshV=new THREE.Mesh(new THREE.BufferGeometry(),mDriven);
const driverG=new THREE.Group(),drivenG=new THREE.Group();
driverG.add(meshD);drivenG.add(meshV);scene.add(driverG,drivenG);
const pinD=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.6,14),mPin);
pinD.rotation.x=Math.PI/2;scene.add(pinD);
const pinV=pinD.clone();scene.add(pinV);
const ptr=new THREE.Mesh(new THREE.BoxGeometry(0.05,R2+0.02,0.05),mPtr);
ptr.position.set(0,(R2+0.02)/2,0.2);drivenG.add(ptr);   // 从动轮指针：停歇时肉眼可见「冻结」
const arcHi=new THREE.Mesh(new THREE.RingGeometry(1,1.1,48,1,0,1),mArc);
driverG.add(arcHi);                                     // 有齿段高亮（随主动轮转）
const lockHi=new THREE.Mesh(new THREE.RingGeometry(1,1.1,48,1,0,1),mLock);
scene.add(lockHi);                                      // 锁定窗高亮（固定于凹弧处）
const plate=new THREE.Mesh(new THREE.CircleGeometry(7.2,48),mPlate);
plate.position.z=-0.45;scene.add(plate);

let geoD=null,geoV=null;
function rebuild(){
  R2=M*z2/2;P2=TAU/z2;A=R1+R2;RHO=R1/R2;
  BETA=n1*(TAU/Z1);HALFB=BETA/2;
  TH20=Math.PI-P2/2;RC=R1+cLock;
  /* 凹弧半角：cutR(ψ)=齿顶圆 R2+M 处（二分） */
  let lo=0,hi=Math.asin(Math.min(0.999,RC/A))*0.999;
  for(let i=0;i<30;i++){const mid=(lo+hi)/2;if(cutR(mid)<R2+M)lo=mid;else hi=mid;}
  Wpsi=Math.max(lo*1.12,0.85*P2);
  /* 凹弧布局：第 k 个停车位的体角 = P2/2 + k·n1·P2（共 z2/n1 处） */
  const Mz=Math.round(z2/n1);recess=[];
  for(let k=0;k<Mz;k++)recess.push(((P2/2+k*n1*P2)%TAU+TAU)%TAU);
  function drivenR(psi){
    let r=gearR(psi,z2,R2,0);
    for(const al of recess){const d=Math.abs(wrap(psi-al));if(d<Wpsi){const cr=cutR(d);if(cr<r)r=cr;}}
    return r;
  }
  function driverR(phi){
    const a2=wrap(phi);
    if(Math.abs(a2)>HALFB)return R1;               // 锁止弧段（半径=R1）
    const s=a2+HALFB;let u=(s/(TAU/Z1))%1;if(u<0)u+=1;
    const d=Math.abs(u-0.5);
    const rt=R1+M,rr=R1-1.25*M,w=0.16,f=0.10;
    if(d<w)return rt;
    if(d<w+f)return rt+(rr-rt)*(d-w)/f;
    return rr;
  }
  if(geoD)geoD.dispose();if(geoV)geoV.dispose();
  geoD=buildShape(driverR,720,0.34);geoV=buildShape(drivenR,1440,0.34);
  meshD.geometry=geoD;meshV.geometry=geoV;
  driverG.position.set(-A/2,0,0);drivenG.position.set(A/2,0,0);
  pinD.position.set(-A/2,0,0);pinV.position.set(A/2,0,0);
  lockHi.position.set(A/2,0,0.18);
  arcHi.geometry.dispose();
  arcHi.geometry=new THREE.RingGeometry(R1+0.07,R1+0.17,48,1,-HALFB,BETA);
  lockHi.geometry.dispose();
  lockHi.geometry=new THREE.RingGeometry(R2+0.06,R2+0.2,48,1,Math.PI-Wpsi,2*Wpsi);
}
rebuild();

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent0(o,pos);
  labelReg.push({o,text:textFn,vis:visFn||(()=>true)});div.textContent=textFn();return o;
}
function parent0(o,pos){scene.add(o);}
addLabel(()=>L(`主动轮 · 有齿段 ${n1} 齿 = ${Math.round(BETA*R2D)}°`,`Driver · ${n1} teeth = ${Math.round(BETA*R2D)}°`),new THREE.Vector3(-A/2,2.6,0),'o');
addLabel(()=>L('锁止弧：光滑凸圆弧','Locking arc: smooth convex rim'),new THREE.Vector3(-A/2-R1-1.1,1.4,0),'b');
addLabel(()=>L(`从动轮 z=${z2} · 凹弧 ${Math.round(z2/n1)} 处`,`Driven z=${z2} · ${Math.round(z2/n1)} recesses`),new THREE.Vector3(A/2+0.3,2.4,0),'g');
addLabel(()=>L('啮合区 ω₂ = ω₁·R₁/R₂','Meshing: ω₂ = ω₁·R₁/R₂'),new THREE.Vector3(-0.3,1.95,0),'o',()=>engaged);
addLabel(()=>L('锁定窗：从动轮纹丝不动 ω=0','Lock window: driven held, ω=0'),new THREE.Vector3(A/2-R2-0.5,-2.0,0),'r',()=>dwell);
addLabel(()=>L('电影放映机取片机构就是这个','Movie-projector pull-down uses exactly this'),new THREE.Vector3(A/2+1.6,-1.1,0),'g',()=>dwell);

/* ---- 状态与运动学 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let speedK=1,slowK=1,th1=0,simT=0;
let engaged=true,dwell=false,w2Now=0,cycNow=0;
const w1Base=1.5;
rebuild();th1=-HALFB;
/* 预填一个完整循环的 ω₂/ω₁ 历史（与实时序列同公式），首屏即见方波+尖峰 */
function prefillBuf(){
  buf.length=0;
  for(let i=0;i<300;i++){
    const ps=i/300*TAU;
    const dB=ps<=BETA?Math.min(ps,BETA-ps):Math.min(ps-BETA,TAU-ps);
    buf.push((ps<=BETA?1:0)+0.3*Math.exp(-dB*26));
  }
}

const STEPS=[
 {zh:'主动轮连续转：只有一段有齿，其余是半径≈节圆的光滑锁止弧',en:'Driver turns continuously; only one arc has teeth, the rest is a smooth locking rim'},
 {zh:'有齿段啮合：从动轮被拨转 n₁ 个齿角，ω₂ = ω₁·R₁/R₂',en:'Toothed arc engages: driven advances n₁ tooth pitches at ω₂ = ω₁·R₁/R₂'},
 {zh:'齿退出瞬间：锁止弧滑入从动轮凹弧，从动轮被「咬住」',en:'Teeth exit: locking arc slips into the driven recess and bites it'},
 {zh:'锁定窗：主动轮照转，从动轮纹丝不动 —— ω 曲线归零成方波',en:'Lock window: driver keeps turning, driven frozen — square-wave output'},
 {zh:'转停比自由设计：改有齿段角度与从动轮齿数即可（间隙越小锁得越死）',en:'Dwell/move ratio is freely designable; smaller clearance = harder lock'},
 {zh:'家族：日内瓦机构（销入槽）、棘轮（单向）；放映机取片正是它',en:'Family: Geneva (pin-slot), ratchet (one-way); film pull-down uses this'},
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>setPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function setPhase(i){
  activeStep=i;
  if(i<=1){th1=-HALFB+BETA*(i===0?0.3:0.85);playing=false;}
  else if(i<=3){th1=-HALFB+BETA+(TAU-BETA)*(i===2?0.22:0.55);playing=false;}
  else{playing=true;}
  setPlayLabel();syncSteps();
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  mPlate.color.setHex(dark?0x1c2027:0xc9c2b6);
  mDriver.color.setHex(dark?0x4a7fa5:0x2c5f80);
  mDriven.color.setHex(dark?0x3f9f78:0x2b8a3e);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();setPlayLabel();
}
function setPlayLabel(){
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
}

/* ---- 示波器 ---- */
const plotCv=document.getElementById('plotCv');
const buf=[];
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const acc=css.getPropertyValue('--acc').trim()||'#ffa94d';
  const t2=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  ctx.strokeStyle='rgba(128,150,170,.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,H*0.5);ctx.lineTo(W,H*0.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,H*0.5-H*0.34);ctx.lineTo(W,H*0.5-H*0.34);ctx.stroke();
  ctx.fillStyle=t2;ctx.font='15px system-ui';
  ctx.fillText('ω₂/ω₁',8,22);
  ctx.fillText('1',W-18,H*0.5-H*0.34+6);ctx.fillText('0',W-18,H*0.5+6);
  ctx.fillText(L('锁定窗 = 零速平台','lock window = zero shelf'),12,H*0.5-H*0.34-8);
  if(buf.length>1){
    ctx.strokeStyle=acc;ctx.lineWidth=3;ctx.beginPath();
    for(let i=0;i<buf.length;i++){
      const x=i/299*W,y=H*0.5-clamp(buf[i],-0.12,1.4)*H*0.32;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();ctx.lineWidth=1;
  }
}

/* ---- 统计 ---- */
let statAcc=0;
function updateStats(){
  document.getElementById('stRpm').innerHTML=(w1Base*speedK*slowK*9.5493).toFixed(1)+'<small> rpm</small>';
  document.getElementById('stW2').innerHTML=(Math.abs(w2Now)*R2D).toFixed(0)+'<small> °/s</small>';
  document.getElementById('stDwell').innerHTML=((1-BETA/TAU)*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stCyc').innerHTML=cycNow;
}

/* ---- 事件 ---- */
const elN1=document.getElementById('sN1'),elZ2=document.getElementById('sZ2'),elC=document.getElementById('sC'),elSpd=document.getElementById('sSpd');
function snapZ2(){
  let v=Math.round(+elZ2.value/n1)*n1;
  v=clamp(v,12,24);
  if(v!==z2){z2=v;rebuild();}
  elZ2.value=z2;
  document.getElementById('sZ2Val').textContent='z='+z2;
}
elN1.addEventListener('input',()=>{
  n1=+elN1.value;
  document.getElementById('sN1Val').textContent=`${n1} ${L('齿','teeth')} · ${Math.round(n1*(TAU/Z1)*R2D)}°`;
  snapZ2();rebuild();
});
elZ2.addEventListener('input',()=>{snapZ2();rebuild();});
elC.addEventListener('input',()=>{
  cLock=+elC.value;
  document.getElementById('sCVal').textContent=(cLock*10).toFixed(2)+' mm';
  rebuild();
});
elSpd.addEventListener('input',()=>{
  speedK=+elSpd.value/60;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
});
document.getElementById('btnSlow').addEventListener('click',e=>{
  slowK=slowK===1?0.15:1;
  e.currentTarget.classList.toggle('on',slowK!==1);
});
document.getElementById('btnReset').addEventListener('click',()=>{
  th1=-HALFB;prefillBuf();playing=true;setPlayLabel();
});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
if(qs.get('speed')){
  speedK=clamp(+qs.get('speed')||1,0.2,2.5);
  elSpd.value=speedK*60;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
}
document.getElementById('tglLabels').checked=labelsOn;

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  const w1=w1Base*speedK*slowK;
  if(playing)th1+=w1*dt;
  const k=Math.floor((th1+HALFB)/TAU),ps1=th1+HALFB-k*TAU;
  let th2;
  if(ps1<=BETA){
    engaged=true;dwell=false;
    th2=TH20-k*RHO*BETA-RHO*ps1;
    w2Now=-RHO*w1;
  }else{
    engaged=false;dwell=true;
    th2=TH20-(k+1)*RHO*BETA;
    w2Now=0;
  }
  cycNow=k;
  driverG.rotation.z=th1;
  drivenG.rotation.z=th2;
  /* 冲击尖峰（示意）：进/出啮合边界的指数衰减脉冲 */
  const dB=ps1<=BETA?Math.min(ps1,BETA-ps1):Math.min(ps1-BETA,TAU-ps1);
  const val=(engaged?1:0)+0.3*Math.exp(-dB*26);
  buf.push(val);if(buf.length>300)buf.shift();
  /* 高亮与标签 */
  mArc.emissiveIntensity=engaged?0.9:0.25;
  mLock.opacity=0.6+0.3*Math.abs(Math.sin(simT*5));
  lockHi.visible=dwell;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  if(playing){const st=engaged?1:2;if(activeStep!==st){activeStep=st;syncSteps();}}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  drawPlot();
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();prefillBuf();updateStats();start();
</script>
</body>
