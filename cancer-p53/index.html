<style>

    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

  #steps{list-style:none;margin-top:8px}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;

  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 生物学注脚（真实量级）：
   - 人细胞周期 ~24 h（G1 ~11h, S ~8h, G2 ~4h, M ~1h）；本页压缩为 ~14 s，约 6000× 快放。
   - 正常 p53 半衰期 ~20 min（MDM2 不断泛素化降解它）；DNA 断链激活 ATM/ATR 磷酸化后
     p53 稳定并累积数百倍，作为四聚体转录因子启动 p21 → CDK2 抑制 → G1/S 停滞。
   - 抑癌基因符合“两击假说”（Knudson, 1971）：两个等位基因都失活才失去功能。
   - 放疗/化疗正是靠制造大剂量 DNA 损伤，把 p53 完好的细胞逼进凋亡；p53 缺失的肿瘤因此耐受。 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
const Q=new URLSearchParams(location.search);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0e141a,18,42);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(4,6.5,13);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=40;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14181e,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,4,-6);scene.add(fill);

/* ---- 材质 ---- */
const membM=new THREE.MeshPhysicalMaterial({color:0x5fb8e8,transparent:true,opacity:0.14,roughness:0.25,metalness:0});
const membDeathM=new THREE.MeshPhysicalMaterial({color:0xff6b6b,transparent:true,opacity:0.2,roughness:0.4});
const nucM=new THREE.MeshStandardMaterial({color:0x2c4a6e,transparent:true,opacity:0.3,roughness:0.6});
const dnaM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.35,metalness:0.1,emissive:0x1c4a6e,emissiveIntensity:0.4});
const dmgM=new THREE.MeshStandardMaterial({color:0xff5c5c,emissive:0xd6336c,emissiveIntensity:1.4,roughness:0.3});
const tetraM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xe8590c,emissiveIntensity:0.9,roughness:0.3});
const rainM=new THREE.MeshStandardMaterial({color:0xff8787,emissive:0xc92a2a,emissiveIntensity:1.0});
const cycleM=[0x74c0fc,0x69db7c,0xffd43b,0xff8787].map(c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:0.35,roughness:0.4}));
const markM=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:0.8});
const cpM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.4});

/* ---- 帮手 ---- */
function helixCurve(rx,rz,h,turns,phase){
  const pts=[],N=110;
  for(let i=0;i<=N;i++){const t=i/N,a=phase+turns*Math.PI*2*t;
    pts.push(new THREE.Vector3(rx*Math.cos(a),-h/2+h*t,rz*Math.sin(a)));}
  return new THREE.CatmullRomCurve3(pts);
}

/* ---- 细胞主体 ---- */
const cellG=new THREE.Group();scene.add(cellG);
const memb=new THREE.Mesh(new THREE.SphereGeometry(4.2,48,32),membM);cellG.add(memb);
const nuc=new THREE.Mesh(new THREE.SphereGeometry(2.3,40,26),nucM);cellG.add(nuc);

/* 双螺旋 DNA（两条互补链） */
const strandA=helixCurve(1.35,1.35,3.4,2.6,0), strandB=helixCurve(1.35,1.35,3.4,2.6,Math.PI);
cellG.add(new THREE.Mesh(new THREE.TubeGeometry(strandA,110,0.05,6),dnaM));
cellG.add(new THREE.Mesh(new THREE.TubeGeometry(strandB,110,0.05,6),dnaM));
/* 横档：碱基对 */
const rungM=new THREE.MeshStandardMaterial({color:0x4dabf7,transparent:true,opacity:0.6,roughness:0.5});
for(let i=0;i<20;i++){const t=i/20;
  const p1=strandA.getPoint(t),p2=strandB.getPoint(t);
  const rung=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,p1.distanceTo(p2),5),rungM);
  rung.position.copy(p1).add(p2).multiplyScalar(0.5);
  rung.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),p2.clone().sub(p1).normalize());
  cellG.add(rung);}

/* ---- 细胞周期环（G1/S/G2/M 四段弧） ---- */
const RING_R=5.1;
const FRAC=[0.30,0.25,0.25,0.20]; // G1,S,G2,M 占比（近似 11/8/4/1h 的简化）
const ringGrp=new THREE.Group();ringGrp.rotation.x=0;scene.add(ringGrp);
let arcStart=0;
FRAC.forEach((f,i)=>{
  const g=new THREE.TorusGeometry(RING_R,0.07,8,64,f*Math.PI*2);
  const m=new THREE.Mesh(g,cycleM[i]);
  m.rotation.set(Math.PI/2,0,arcStart*Math.PI*2); // 先绕 Z 起始角、再放平到 XZ 平面
  arcStart+=f;ringGrp.add(m);
});
const CHK=0.30; // G1/S 检查点位置
const chkMark=new THREE.Mesh(new THREE.OctahedronGeometry(0.22),cpM);
chkMark.position.set(RING_R*Math.cos(CHK*Math.PI*2),0.1,RING_R*Math.sin(CHK*Math.PI*2));
scene.add(chkMark);
const cycMark=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,10),markM);scene.add(cycMark);

/* ---- 状态 ---- */
let playing=true,speedK=1.0,dose=2.0,p53On=true,p53lvl=0,cycleT=0.08,arrested=false;
let cells=1,divisions=0,alleleHits=0,apoptT=0,apoptCount=0,simT=0;
let labelsOn=!Q.has('labels')||Q.get('labels')!=='0';
const sites=[];      // {mesh,t,repair}
const rains=[];      // 下落的损伤粒子
const tetras=[];     // p53 四聚体 {grp,target,site}
const clones=[];     // 子代克隆 {mesh,dist,dir,s}
let rainAcc=0;

/* ---- 损伤位点 ---- */
const dmgGeo=new THREE.IcosahedronGeometry(0.1);
function addSite(){
  if(sites.length>=14)return;
  const t=Math.random(),p=(Math.random()<0.5?strandA:strandB).getPoint(t);
  const mesh=new THREE.Mesh(dmgGeo,dmgM.clone());mesh.position.copy(p);cellG.add(mesh);
  sites.push({mesh,t,repair:0});
}
function clearSites(){for(const s of sites)cellG.remove(s.mesh);sites.length=0;
  for(const q of tetras)cellG.remove(q.grp);tetras.length=0;p53lvl=0;}

/* ---- p53 四聚体（4 个亚基，真实 p53 需四聚化才有转录活性） ---- */
const tetGeo=new THREE.SphereGeometry(0.09,10,8);
function spawnTetra(){
  if(tetras.length>=22||!sites.length)return;
  const g=new THREE.Group();
  for(let i=0;i<4;i++){const s=new THREE.Mesh(tetGeo,tetraM);
    s.position.set(Math.cos(i*Math.PI/2)*0.15,Math.sin(i*Math.PI/2)*0.15,0);g.add(s);}
  const a=Math.random()*Math.PI*2;
  g.position.set(2.3*Math.cos(a),1.4*Math.random()-0.7,2.3*Math.sin(a)); // 核内 random 起点
  cellG.add(g);
  const site=sites[Math.floor(Math.random()*sites.length)];
  tetras.push({grp:g,site});
}

/* ---- 克隆细胞 ---- */
const cloneGeo=new THREE.SphereGeometry(1.35,26,18);
function spawnClone(){
  cells++;divisions++;
  if(clones.length>=40)return; // 超过 40 只计数，不再画
  const dir=new THREE.Vector3(Math.random()-0.5,Math.random()*0.3,Math.random()-0.5).normalize();
  const mesh=new THREE.Mesh(cloneGeo,membM.clone());mesh.scale.setScalar(0.15);
  mesh.position.copy(dir).multiplyScalar(5.0);scene.add(mesh);
  clones.push({mesh,dir,dist:5.0,s:0.15});
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('细胞核 · DNA 双螺旋','Nucleus · DNA double helix'),new THREE.Vector3(0,3.0,0),'b');
addLabel(()=>L('p53 四聚体（4 亚基）','p53 tetramer (4 subunits)'),new THREE.Vector3(1.8,1.6,0.6),'o',()=>tetras.length>0);
addLabel(()=>L('G1/S 检查点 · 红灯','G1/S checkpoint · red light'),new THREE.Vector3(2.2,0.5,RING_R*0.9),'r',()=>arrested);
addLabel(()=>L('细胞周期进度环','Cell-cycle progress ring'),new THREE.Vector3(-RING_R-1.4,0.2,0),'b');
addLabel(()=>L('克隆扩张（刹车失灵）','Runaway clones (brakes gone)'),new THREE.Vector3(0,2.2,0),'r',
  ()=>clones.length>2&&apoptT===0,cellG);
addLabel(()=>L('凋亡！p53 判处死刑','Apoptosis! p53 orders self-destruct'),new THREE.Vector3(0,3.6,0),'r',()=>apoptT>0);

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0e141a:0xe9e4dc);
  scene.fog.color.setHex(dark?0x0e141a:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();syncBtns();
}

/* ---- 步骤（点击切相位） ---- */
const STEPS=[
  {zh:'油门与刹车：原癌基因 Ras/Myc 踩油门驱动周期；p53、Rb 是刹车',en:'Gas vs brakes: Ras/Myc drive the cycle; p53 & Rb are the brakes',
   go(){dose=0;ensureP53();clearSites();cycleT=0.1;}},
  {zh:'损伤来临：紫外线/化学物打断 DNA，ATM/ATR 激酶立刻磷酸化报警',en:'Damage: UV/chemicals break DNA; ATM/ATR kinases phosphorylate and alarm',
   go(){dose=5;ensureP53();}},
  {zh:'p53 积累：四聚体聚集核内，细胞被按停在 G1/S 检查点',en:'p53 accumulates: tetramers gather, cycle halts at the G1/S checkpoint',
   go(){dose=8;ensureP53();for(let i=0;i<6;i++)addSite();cycleT=0.24;}},
  {zh:'修复或凋亡：修得好就放行；修不好 p53 启动凋亡程序',en:'Repair or die: fixed → proceed; unfixable → p53 triggers apoptosis',
   go(){dose=10;ensureP53();for(let i=0;i<9;i++)addSite();cycleT=0.24;}},
  {zh:'两击假说：抑癌基因两个等位基因都失活，刹车才彻底失灵',en:'Two-hit rule: both alleles must die before the brake fails',
   go(){alleleHits=1;dose=6;ensureP53();for(let i=0;i<4;i++)addSite();}},
  {zh:'失控克隆：油门卡死+刹车失灵，突变细胞无视红灯分裂扩张',en:'Runaway: stuck gas + dead brakes, mutants ignore the red light',
   go(){alleleHits=2;p53On=false;dose=6;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.go();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function ensureP53(){if(alleleHits<2){p53On=true;syncBtns();}}

/* ---- 按钮/滑块 ---- */
function syncBtns(){
  const b=document.getElementById('btnP53');
  const dead=alleleHits>=2;
  b.textContent=dead?L('p53 已双敲失守','p53 knocked out (2 hits)')
    :(p53On?L('p53：开（点击关闭）','p53: ON (click to off)'):L('p53：关（点击开启）','p53: OFF (click on)'));
  b.classList.toggle('on',p53On&&!dead);
}
document.getElementById('btnP53').addEventListener('click',()=>{
  if(alleleHits>=2)return; // 两击后 p53 永久失守
  p53On=!p53On;syncBtns();
});
document.getElementById('btnRx').addEventListener('click',()=>{
  for(let i=0;i<10;i++)addSite(); // 放疗/化疗：一次性大剂量断链
});
document.getElementById('btnFix').addEventListener('click',()=>{clearSites();apoptT=0;activeStep=0;syncSteps();});
document.getElementById('btnReset').addEventListener('click',()=>{
  cells=1;divisions=0;alleleHits=0;clearSites();
  for(const c of clones)scene.remove(c.mesh);clones.length=0;
  memb.material=membM;cellG.scale.setScalar(1);syncBtns();activeStep=0;syncSteps();
});
document.getElementById('sDose').addEventListener('input',e=>{
  dose=+e.target.value;document.getElementById('sDoseVal').textContent=dose.toFixed(1);
});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/60;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 统计 ---- */
function phaseName(){
  if(apoptT>0)return L('凋亡','APOPTOSIS');
  if(arrested)return L('G1/S 停滞','ARREST');
  return cycleT<0.3?'G1':cycleT<0.55?'S':cycleT<0.8?'G2':'M';
}
function updateStats(){
  document.getElementById('stCells').textContent=cells;
  document.getElementById('stDmg').textContent=sites.length;
  document.getElementById('stP53').innerHTML=(p53On&&alleleHits<2?Math.round(p53lvl*100):0)+'<small> %</small>';
  const dead=alleleHits>=2;
  document.getElementById('stAllele').innerHTML=dead
    ?'<small>'+L('双击失守','2 hits ✗')+'</small>'
    :['●●','●○','○○'][alleleHits].replace('○','<small>○</small>');
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    simT+=dt;
    /* 1) 损伤粒子雨：剂量→断链速率 */
    rainAcc+=dt*dose*1.1;
    while(rainAcc>1){rainAcc-=1;
      const a=Math.random()*Math.PI*2,r=Math.random()*1.4;
      const m=new THREE.Mesh(new THREE.SphereGeometry(0.05,6,5),rainM);
      m.position.set(Math.cos(a)*r,6.5,Math.sin(a)*r);scene.add(m);
      rains.push({mesh:m,vy:4+Math.random()*2});
    }
    /* 2) p53 水平跟随损伤（ATM/ATR → 稳定化） */
    const tgt=(p53On&&alleleHits<2)?clamp(sites.length*0.2,0,1):0;
    p53lvl+=(tgt-p53lvl)*dt*2.2;
    if(p53lvl>0.15&&Math.random()<dt*(2+dose))spawnTetra();
    /* 3) 周期推进与检查点刹车 */
    arrested=p53On&&alleleHits<2&&sites.length>0&&p53lvl>0.18;
    if(!arrested){
      cycleT+=dt*speedK/14; // 一个周期 14 s ≈ 24 h 压缩
      if(cycleT>=1){cycleT=0;spawnClone();
        if((!p53On||alleleHits>=2)&&sites.length>0&&Math.random()<0.4&&alleleHits<2){
          alleleHits++;syncBtns(); // 带伤分裂：第二次击中的来源
        }
      }
    }
    /* 4) 凋亡判定：p53 在场 + 修不好的大量断链 */
    if(p53On&&alleleHits<2&&sites.length>=6){apoptT+=dt/2.5;}
    if(apoptT>=1){ // 执行：细胞清场重来
      apoptT=0;apoptCount++;clearSites();
      for(const c of clones)scene.remove(c.mesh);clones.length=0;
      cells=1;cycleT=0;memb.material=membM;cellG.scale.setScalar(1);
    }
    if(apoptT>0){
      cellG.scale.setScalar(1-0.75*apoptT+Math.sin(simT*30)*0.02*apoptT);
      memb.material=membDeathM;
    }
    /* 5) 四聚体押运到损伤点并修复 */
    for(let i=tetras.length-1;i>=0;i--){
      const q=tetras[i];
      if(!sites.includes(q.site)){cellG.remove(q.grp);tetras.splice(i,1);continue;}
      const p=q.grp.position,pT=q.site.mesh.position;
      p.lerp(pT,clamp(dt*1.6,0,1));
      q.grp.rotation.y+=dt*3;
      if(p.distanceTo(pT)<0.18){
        q.site.repair+=dt/2.8;      // 修复中：位点亮绿消退
        q.site.mesh.material.color.setHex(0x69db7c);
        q.site.mesh.material.emissive.setHex(0x2b8a3e);
        if(q.site.repair>=1){cellG.remove(q.site.mesh);sites.splice(sites.indexOf(q.site),1);cellG.remove(q.grp);tetras.splice(i,1);}
      }
    }
    /* 6) 克隆漂移外扩 */
    for(const c of clones){
      c.dist=Math.min(9.5,c.dist+dt*0.35);
      c.mesh.position.copy(c.dir).multiplyScalar(c.dist);
      if(c.s<1){c.s=Math.min(1,c.s+dt*0.5);c.mesh.scale.setScalar(c.s);}
    }
  }
  /* 视觉同步（暂停也刷新） */
  for(let i=rains.length-1;i>=0;i--){
    const r=rains[i];
    r.mesh.position.y-=r.vy*dt*(playing?1:0);
    if(r.mesh.position.y<1.6){scene.remove(r.mesh);rains.splice(i,1);if(playing)addSite();}
  }
  const a=cycleT*Math.PI*2;
  cycMark.position.set(RING_R*Math.cos(a),0.1,RING_R*Math.sin(a));
  chkMark.material.emissiveIntensity=arrested?1.6+Math.sin(simT*10)*0.6:0.35;
  chkMark.scale.setScalar(arrested?1.35:1);
  cellG.rotation.y=simT*0.12;
  dmgGeoScale();
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
/* 损伤位点脉冲 */
function dmgGeoScale(){const s=1+Math.sin(simT*6)*0.18;
  for(const st of sites)st.mesh.scale.setScalar(s*(1-st.repair*0.8));}

/* ---- URL 参数与启动 ---- */
if(Q.get('pause')==='1'){playing=false;}
document.getElementById('tglLabels').checked=labelsOn;
if(Q.get('speed')){
  const v=clamp(+Q.get('speed'),20,150);
  document.getElementById('sSpd').value=v;
  speedK=v/60;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSteps();start();
</script>
</body>
