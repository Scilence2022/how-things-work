const scene=new THREE.Scene();const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.getElementById('app').append(renderer.domElement);

const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,100);camera.position.set(6,4.5,8);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,2,0);orbit.enableDamping=true;orbit.dampingFactor=.08;orbit.minDistance=3;orbit.maxDistance=22;orbit.autoRotateSpeed=.35;
const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;scene.add(new THREE.HemisphereLight(0xbad7df,0x27332d,.8));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(4,8,5);scene.add(key);

const floor=new THREE.Mesh(new THREE.CircleGeometry(7,64),M.ground);floor.rotation.x=-Math.PI/2;scene.add(floor);const tower=new THREE.Mesh(new THREE.CylinderGeometry(.18,.42,4.6,24),M.tower);tower.position.y=2.3;scene.add(tower);const nacelle=new THREE.Group();nacelle.position.set(0,4.7,0);scene.add(nacelle);const body=new THREE.Mesh(new THREE.BoxGeometry(1.8,.7,.85),M.dark);body.position.z=-.25;nacelle.add(body);const gen=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.8,24),M.edge);gen.rotation.x=Math.PI/2;gen.position.z=.4;nacelle.add(gen);const hub=new THREE.Group();hub.position.z=.72;nacelle.add(hub);const rotor=new THREE.Group();hub.add(rotor);

let wind=clamp(num('t',8),2,25),pitch=clamp(num('p',2),-2,28),yaw=clamp(num('yaw',0),-45,45),sim=num('time',0),speed=clamp(num('speed',1),.2,3),playing=!bool('pause',false);if(matchMedia('(prefers-reduced-motion:reduce)').matches&&!q.has('pause'))playing=false;

const STEPS=[['来流','inflow','风把空气动量带入转子平面，箭头表示来流。','Wind brings momentum into the rotor plane; arrows show the inflow.'],['翼型升力','airfoil lift','叶片截面像机翼，升力垂直于相对气流；它的切向分量产生转矩。','A blade section is an airfoil. Lift is perpendicular to relative flow; its tangential part makes torque.'],['转子扭矩','rotor torque','三片叶片把气流的能量变成旋转动能，理想捕获受贝茨极限 59.3% 约束。','Three blades turn wind energy into rotation; ideal capture is bounded by the 59.3% Betz limit.'],['发电机','generator','转子轴带动发电机，电磁感应把机械功率变成电功率。','The shaft drives a generator; electromagnetic induction turns mechanical power into electricity.'],['额定风速变桨','pitch above rated','风速超过额定值后，控制器增大桨距角，主动减小升力，让功率削峰。','Above rated wind, the controller increases pitch to reduce lift and clip power.'],['偏航','yaw','偏航系统转动机舱，使转子正对风向，减小偏航损失。','The yaw system turns the nacelle into the wind and reduces yaw loss.']];
