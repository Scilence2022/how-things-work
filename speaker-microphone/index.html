<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扬声器 ⇄ 麦克风 · 同一只动圈头的两种身份</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#b197fc;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#7048e8;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(177,151,252,.9); color: #e5d9ff; }
  .lbl.b { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.n { border-color: rgba(255,93,93,.9); color: #ffc2c2; }
  .lbl.s { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.f { border-color: rgba(255,159,40,.9); color: #ffd9a3; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(112,72,232,.9); color: #7048e8; }
  :root[data-theme="light"] .lbl.n { border-color: rgba(200,60,60,.9); color: #b83232; }
  :root[data-theme="light"] .lbl.f { border-color: rgba(156,95,0,.9); color: #9c5f00; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 14px 12px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 16px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #b197fc; }
  #waveforms { grid-column: 1 / 3; margin-top: 6px; display: flex; gap: 10px; }
  #waveforms canvas { display: block; border-radius: 8px; }
  #waveforms .cap { font-size: 10.5px; color: var(--text2); margin-top: 3px; text-align: center; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.n { color: #ffc2c2; border-color: rgba(255,93,93,.7); }
  .chip.s { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  .chip.f { color: #ffd9a3; border-color: rgba(255,159,40,.7); }
  :root[data-theme="light"] .chip.n { color: #b83232; border-color: rgba(200,60,60,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(177,151,252,.12); color: var(--text); border: 1px solid rgba(177,151,252,.5);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: filter .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(177,151,252,.10); border-color: rgba(177,151,252,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(112,72,232,.08); border-color: rgba(112,72,232,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ddd0ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="扬声器 ⇄ 麦克风：同一只动圈头的两种身份" data-en="Speaker ⇄ Microphone: one moving-coil head, two identities">扬声器 ⇄ 麦克风：同一只动圈头的两种身份</h1>
  <div class="sub" data-zh="插上功放:音圈电流在磁场里受安培力,纸盆推空气=喇叭;接上话放:声波推纸盆,线圈切磁感线生电=话筒 · 空格播放/暂停" data-en="Feed it current: the coil feels F = BIL and the cone pushes air — a speaker. Let sound push the cone: the coil cuts flux and makes EMF — a mic · Space = play/pause">插上功放:音圈电流在磁场里受安培力,纸盆推空气=喇叭;接上话放:声波推纸盆,线圈切磁感线生电=话筒 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="驱动频率" data-en="drive frequency">驱动频率</span><span class="v g" id="stF">440 Hz</span>
  <span class="k" data-zh="输出/输入" data-en="output/input">输出/输入</span><span class="v" id="stA">—</span>
  <div id="waveforms">
    <div><canvas id="wf1" width="190" height="64"></canvas><div class="cap" id="cap1">输入(功放)</div></div>
    <div><canvas id="wf2" width="190" height="64"></canvas><div class="cap" id="cap2">输出(话筒)</div></div>
  </div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip n" data-zh="N 极" data-en="N pole">N 极</span>
    <span class="chip s" data-zh="S 极" data-en="S pole">S 极</span>
    <span class="chip f" data-zh="音圈受力/感应电流" data-en="coil force / induced current">音圈受力/感应电流</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnSwap" data-zh="角色互换:右边说,左边听" data-en="Swap: right speaks, left listens">角色互换:右边说,左边听</button>
  </div>
  <div class="row"><label data-zh="频率" data-en="frequency">频率</label><input id="freq" type="range" min="120" max="2000" step="20" value="440"><span class="val" id="freqVal">440 Hz</span></div>
  <div class="row"><label data-zh="音量" data-en="volume">音量</label><input id="amp" type="range" min="10" max="100" step="5" value="60"><span class="val" id="ampVal">60%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglWave" type="checkbox" checked> <span data-zh="声波" data-en="sound waves">声波</span></label>
    <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../motor-generator/" data-zh="互逆第一对:电动机⇄发电机" data-en="inverse pair 1: motor ⇄ generator">互逆第一对:电动机⇄发电机</a>
    <a href="../pn-junction/" data-zh="互逆第二对:LED⇄太阳能电池" data-en="inverse pair 2: LED ⇄ solar cell">互逆第二对:LED⇄太阳能电池</a>
    <a href="../standing-waves/" data-zh="声学:驻波与乐器(规划中)" data-en="acoustics: standing waves (planned)">声学:驻波与乐器(规划中)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
let swapped = false;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('扬声器 ⇄ 麦克风', 'Speaker ⇄ Microphone');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  refreshRoles();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 3.2, 11.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 17;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const M = {
  frame: mat(0x39424f, { roughness: 0.7 }),
  magnetN: mat(0xff5d5d, { roughness: 0.4 }),
  magnetS: mat(0x4cc9f0, { roughness: 0.4 }),
  magnetCore: mat(0x8a93a3, { metalness: 0.5, roughness: 0.4 }),
  cone: mat(0x3d4653, { roughness: 0.65, side: THREE.DoubleSide }),
  coneB: mat(0x5a4a63, { roughness: 0.65, side: THREE.DoubleSide }),
  coil: mat(0xd8b26a, { metalness: 0.6, roughness: 0.35 }),
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  amp: mat(0x90be6d, { roughness: 0.4 }),
  pre: mat(0x6fc2d8, { roughness: 0.4 }),
  wave: new THREE.MeshBasicMaterial({ color: 0xb197fc, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
  forceArrow: new THREE.MeshBasicMaterial({ color: 0xff9f28, transparent: true, opacity: 0.95 }),
  currentDot: new THREE.MeshBasicMaterial({ color: 0xffe08a }),
};

/* ---------------- 动圈头(可镜像) ---------------- */
const GAP = 6.4;                       // 两只头之间的距离
function buildDriver(side) {           // side: -1 左(朝右发声) / +1 右(朝左发声)
  const g = new THREE.Group();
  g.position.set(side * GAP / 2, 2.0, 0);
  g.rotation.y = side < 0 ? 0 : Math.PI;   // 左头朝右,右头朝左
  /* 磁路:中心柱(N) + 外环(S) */
  const back = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.3, 32), M.magnetS);
  back.rotation.x = Math.PI / 2;
  back.position.z = -0.42;
  g.add(back);
  const corePole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.62, 24), M.magnetN);
  corePole.rotation.x = Math.PI / 2;
  corePole.position.z = -0.16;
  g.add(corePole);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.16, 12, 36), M.magnetS);
  ring.position.z = -0.14;
  g.add(ring);
  /* 悬挂框架 */
  const frame = new THREE.Mesh(new THREE.TorusGeometry(0.86, 0.07, 10, 36), M.frame);
  frame.position.z = 0.3;
  g.add(frame);
  /* 音圈(圆柱,套在中心柱与外环的磁隙) */
  const coilGrp = new THREE.Group();
  g.add(coilGrp);
  const coilCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.34, 24, 1, true), M.coil);
  coilCyl.rotation.x = Math.PI / 2;
  coilGrp.add(coilCyl);
  /* 纸盆(锥) + 防尘帽 */
  const coneGrp = new THREE.Group();
  g.add(coneGrp);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.85, 0.55, 40, 1, true), side < 0 ? M.cone : M.coneB);
  cone.rotation.x = Math.PI / 2;
  cone.position.z = 0.28;
  coneGrp.add(cone);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), side < 0 ? M.cone : M.coneB);
  cap.rotation.x = Math.PI / 2;
  cap.position.z = 0.02;
  coneGrp.add(cap);
  /* 受力/感应箭头 */
  const arrow = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.6, 8), M.forceArrow);
  arrow.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.2, 10), M.forceArrow);
  tip.position.y = 0.4;
  arrow.add(tip);
  arrow.position.set(0, -0.85, 0);
  g.add(arrow);
  scene.add(g);
  return { g, coilGrp, coneGrp, arrow, side };
}
const drvA = buildDriver(-1);
const drvB = buildDriver(1);

/* 外接盒:功放(左) / 话放(右) */
const ampBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.6), M.amp);
ampBox.position.set(-GAP / 2 - 2.2, 1.35, 0);
scene.add(ampBox);
const preBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.6), M.pre);
preBox.position.set(GAP / 2 + 2.2, 1.35, 0);
scene.add(preBox);
/* 连线 */
function tube(points, m, r = 0.03) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, r, 8, false), m);
  scene.add(mesh);
  return curve;
}
const wireA = tube([
  new THREE.Vector3(-GAP / 2 - 1.75, 1.4, 0), new THREE.Vector3(-GAP / 2 - 0.8, 2.0, 0.3),
  new THREE.Vector3(-GAP / 2 - 0.86, 2.0, -0.2)], M.coil);
void wireA;
const wireB = tube([
  new THREE.Vector3(GAP / 2 + 0.86, 2.0, -0.2), new THREE.Vector3(GAP / 2 + 0.8, 2.0, 0.3),
  new THREE.Vector3(GAP / 2 + 1.75, 1.4, 0)], M.coil);
void wireB;
const floor = new THREE.Mesh(new THREE.BoxGeometry(14, 0.2, 5), M.floor);
floor.position.y = -0.1;
scene.add(floor);

/* 声波(扩张环) */
const waves = [];
for (let i = 0; i < 6; i++) {
  const w = new THREE.Mesh(new THREE.TorusGeometry(1, 0.016, 8, 48), M.wave.clone());
  w.rotation.y = Math.PI / 2;   // 环面朝向传播方向(x 轴)
  w.visible = false;
  scene.add(w);
  waves.push(w);
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblA = addLabel(() => swapped
  ? L('🎤 话筒:声→电', '🎤 mic: sound → electric')
  : L('🔊 扬声器:电→声', '🔊 speaker: electric → sound'),
  new THREE.Vector3(-GAP / 2, 3.45, 0), 'g', drvA.g);
const lblB = addLabel(() => swapped
  ? L('🔊 扬声器:电→声', '🔊 speaker: electric → sound')
  : L('🎤 话筒:声→电', '🎤 mic: sound → electric'),
  new THREE.Vector3(GAP / 2, 3.45, 0), 'g', drvB.g);
const lblAmp = addLabel(() => swapped ? L('话放(放大微弱感应)', 'mic preamp') : L('功放(送出驱动电流)', 'power amp'),
  new THREE.Vector3(-GAP / 2 - 2.2, 2.2, 0), 'g');
const lblPre = addLabel(() => swapped ? L('功放(送出驱动电流)', 'power amp') : L('话放(放大微弱感应)', 'mic preamp'),
  new THREE.Vector3(GAP / 2 + 2.2, 2.2, 0), 'g');
const lblStatus = addLabel(() => L('电 → 力 → 声 → 力 → 电:一条链走完', 'electric → force → sound → force → electric: one chain'),
  new THREE.Vector3(0, 4.6, 0), 'st');

/* ================= 状态 ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let freq = qsFloat('freq', 440);
let amp = 0.6;
let tSim = 0;
const WAVE_SPD = 5.5;                  // 声波视觉传播速度
const displacement = () => amp * 0.09;

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '动圈头:磁隙里的音圈', be: 'The moving-coil head',
    d: '永磁体撑出一条环形磁隙,音圈悬浮在磁隙里,前面糊一张纸盆——喇叭和话筒,硬件一模一样。',
    de: 'A permanent magnet frames a gap; a coil floats in it with a cone glued on front. Speaker and mic share this exact hardware.',
    act: () => { swapped = false; refreshRoles(); } },
  { b: '电→力:安培力推纸盆', be: 'Electric → force',
    d: '功放把音频电流灌进音圈,载流线圈在磁场中受安培力 F = BIL——电流正负交替,纸盆就前后推拉空气。',
    de: 'The amp pours audio current into the coil; F = BIL pushes it — the alternating sign makes the cone pump the air back and forth.',
    act: () => { swapped = false; refreshRoles(); } },
  { b: '声波:疏密交替的空气', be: 'Sound: alternating pressure',
    d: '纸盆前方,空气被推成密、拉成疏,一圈圈以声速扩散——频率越高,圈距越短。拖「频率」滑块看圈距变化。',
    de: 'The cone squeezes and stretches the air into compression waves spreading at sound speed — higher frequency, tighter rings.',
    act: () => { swapped = false; refreshRoles(); } },
  { b: '力→电:电磁感应', be: 'Force → electric',
    d: '对面话筒的纸盆被声波推着走,磁隙里的音圈跟着切磁感线——感应电动势 e = BLv,复刻了刚才的波形,只是微小得多。',
    de: 'Sound pushes the mic\'s cone; its coil cuts flux and induces e = BLv — the same waveform, but tiny.',
    act: () => { swapped = false; refreshRoles(); } },
  { b: '互逆器件第三对', be: 'Inverse pair No.3',
    d: '「角色互换」按一下:同一对头,右边发声左边收——硬件没变,只看你从哪头喂能量。与电动机⇄发电机、LED⇄太阳能同构。',
    de: 'Hit swap: the same pair, roles reversed — only the energy feed direction changed. Kin to motor⇄generator and LED⇄solar.',
    act: () => { swapped = !swapped; refreshRoles(); } },
];
function stepIndex() {
  void 0;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}
function refreshRoles() {
  document.getElementById('btnSwap').textContent = swapped
    ? L('角色互换:左边说,右边听', 'Swap: left speaks, right listens')
    : L('角色互换:右边说,左边听', 'Swap: right speaks, left listens');
  document.getElementById('cap1').textContent = swapped ? L('输入(右边发声)', 'input (right speaks)') : L('输入(功放)', 'input (power amp)');
  document.getElementById('cap2').textContent = swapped ? L('输出(左边收)', 'output (left listens)') : L('输出(话筒)', 'output (microphone)');
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elFreq = document.getElementById('freq');
const elFreqVal = document.getElementById('freqVal');
const elAmp = document.getElementById('amp');
const elAmpVal = document.getElementById('ampVal');
const tglLabels = document.getElementById('tglLabels');
const tglWave = document.getElementById('tglWave');
const tglRotate = document.getElementById('tglRotate');
const stF = document.getElementById('stF'), stA = document.getElementById('stA');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elFreq.value = freq; elFreqVal.textContent = freq + ' Hz';
elFreq.addEventListener('input', () => { freq = parseInt(elFreq.value, 10); elFreqVal.textContent = freq + ' Hz'; stF.textContent = freq + ' Hz'; });
elAmp.addEventListener('input', () => { amp = parseInt(elAmp.value, 10) / 100; elAmpVal.textContent = elAmp.value + '%'; });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
document.getElementById('btnSwap').addEventListener('click', () => { swapped = !swapped; refreshRoles(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* 波形小图 */
const wf1 = document.getElementById('wf1').getContext('2d');
const wf2 = document.getElementById('wf2').getContext('2d');
function drawWave(ctx2, phase, color) {
  const W = 190, H = 64;
  ctx2.clearRect(0, 0, W, H);
  ctx2.strokeStyle = 'rgba(128,140,155,.35)';
  ctx2.beginPath(); ctx2.moveTo(0, H / 2); ctx2.lineTo(W, H / 2); ctx2.stroke();
  ctx2.strokeStyle = color;
  ctx2.lineWidth = 1.8;
  ctx2.beginPath();
  for (let x = 0; x <= W; x++) {
    const cycles = 2.2;
    const t = x / W * cycles * Math.PI * 2 - phase;
    const y = H / 2 - Math.sin(t) * H * 0.36;
    x ? ctx2.lineTo(x, y) : ctx2.moveTo(x, y);
  }
  ctx2.stroke();
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
const speakerSrc = () => swapped ? drvB : drvA;
const micSrc = () => swapped ? drvA : drvB;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;
  /* 驱动相位(把音频频率压缩到可视节奏) */
  const visFreq = 0.5 + freq / 500;
  const phase = tSim * visFreq * Math.PI * 2;
  const disp = Math.sin(phase) * displacement();

  /* 发声侧:纸盆动 + 线圈箭头 */
  const spk = speakerSrc(), mic = micSrc();
  spk.coneGrp.position.z = disp;
  spk.coilGrp.position.z = disp * 0.8;
  spk.arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
    new THREE.Vector3(0, 0, Math.sign(disp) || 1));
  spk.arrow.scale.y = clamp(Math.abs(disp) / displacement() * 0.5, 0.15, 1.1) * (amp > 0.02 ? 1 : 0.001);
  /* 收声侧:纸盆被声波推动(滞后),感应电流点 */
  const micDisp = -Math.sin(phase - 0.9) * displacement() * 0.8;
  mic.coneGrp.position.z = micDisp;
  mic.coilGrp.position.z = micDisp * 0.8;
  mic.arrow.scale.y = clamp(Math.abs(micDisp) / displacement() * 0.5, 0.1, 1) * (amp > 0.02 ? 1 : 0.001);
  mic.arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
    new THREE.Vector3(0, 0, Math.sign(-micDisp) || 1));

  /* 声波:从发声侧扩张 */
  const gapWave = clamp(freq / 800, 0.4, 2.4);
  const origin = spk.g.position;
  waves.forEach((w, i) => {
    if (!tglWave.checked || amp < 0.03) { w.visible = false; return; }
    const p = ((tSim * 0.55 + i / waves.length) % 1);
    const r = 0.5 + p * GAP * 0.95;
    w.visible = r < GAP * 0.98;
    w.scale.setScalar(r);
    w.position.set(origin.x * (1 - r / (GAP + 0.2)), origin.y, 0);
    w.material.opacity = 0.26 * (1 - p) * amp;
  });
  stA.innerHTML = (0.18 + 0.6 * amp).toFixed(2) + '<small> ×(示意)</small>';

  drawWave(wf1, phase, '#b197fc');
  drawWave(wf2, phase - 0.9, '#4dabf7');

  /* 步骤高亮:默认停在「电→力」,角色互换后停「互逆对」 */
  const elSteps = document.getElementById('steps');
  const si = swapped ? 4 : 1;
  if (frame.lastSi !== si) {
    frame.lastSi = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
refreshRoles();
stF.textContent = freq + ' Hz';
requestAnimationFrame(frame);
</script>
