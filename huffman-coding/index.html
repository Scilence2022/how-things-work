<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈夫曼编码 · 高频短码,低频长码</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 12px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #stats { display: flex; flex-wrap: wrap; gap: 3px 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--panel-border); }
  #stats .st { font-size: 11.5px; color: var(--text2); }
  #stats .st b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 700; }
  #stats .st b.ok { color: #43d17c; }
  #legend { display: flex; gap: 8px; margin: 9px 0 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.c1 { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  .chip.c2 { color: #ffd98a; border-color: rgba(255,209,102,.65); }
  :root[data-theme="light"] .chip.c1 { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.c2 { color: #b26214; border-color: rgba(178,98,20,.7); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 5px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 7px 10px; align-items: center;
    margin-top: 8px; padding-top: 9px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 32px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #btnrow { grid-column: 2; display: flex; gap: 8px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: center; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s; }
  .bon:hover { border-color: var(--acc); color: var(--acc); }
  #toggles { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="哈夫曼编码：高频短码,低频长码" data-en="Huffman coding: short codes for frequent letters">哈夫曼编码：高频短码,低频长码</h1>
  <div class="sub" data-zh="频次决定合并顺序,合并顺序决定码长:同一句话,8-bit ASCII 要 232 bit,Huffman 只需 109 bit——省下的每一比特都是频次换来的 · 空格播放/暂停 · ←→ 单步" data-en="Frequency sets merge order; merge order sets code length. Same sentence: 232 bits as 8-bit ASCII, just 109 with Huffman — every bit saved was earned by frequency · Space = play/pause · ←→ = step">频次决定合并顺序,合并顺序决定码长:同一句话,8-bit ASCII 要 232 bit,Huffman 只需 109 bit——省下的每一比特都是频次换来的 · 空格播放/暂停 · ←→ 单步</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <div id="stats">
    <span class="st"><span data-zh="字符" data-en="chars">字符</span> <b id="stN">—</b></span>
    <span class="st"><span data-zh="符号" data-en="symbols">符号</span> <b id="stK">—</b></span>
    <span class="st">Huffman <b id="stH">—</b></span>
    <span class="st"><span data-zh="熵下限" data-en="entropy">熵下限</span> <b id="stEnt">—</b></span>
    <span class="st">ASCII <b id="stA">—</b></span>
    <span class="st"><span data-zh="压缩" data-en="saved">压缩</span> <b id="stSave">—</b></span>
    <span class="st"><span data-zh="前缀校验" data-en="prefix check">前缀校验</span> <b class="ok" id="stPf">—</b></span>
  </div>
  <div id="legend">
    <span class="chip c1" data-zh="圆越大频次越高" data-en="bigger circle = higher freq">圆越大频次越高</span>
    <span class="chip c2" data-zh="每轮拎出最小×2" data-en="pick two lightest each round">每轮拎出最小×2</span>
    <span class="chip c1" data-zh="左 0 右 1" data-en="left 0, right 1">左 0 右 1</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="4" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="进度" data-en="Time">进度</label><input id="seek" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="seekVal">0s</span></div>
    <div id="btnrow">
      <button id="stepBtn" class="bon" data-zh="单步 ▸" data-en="Step ▸">单步 ▸</button>
      <button id="replayBtn" class="bon" data-zh="重播 ↺" data-en="Replay ↺">重播 ↺</button>
    </div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglFreq" type="checkbox" checked> <span data-zh="频次表" data-en="Freq list">频次表</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../entropy/" data-zh="同族:熵——压缩的理论极限" data-en="related: entropy, the hard limit of compression">同族:熵——压缩的理论极限</a>
    <a href="../monty-hall-bayes/" data-zh="同族:信息如何改写概率" data-en="related: how information rewrites odds">同族:信息如何改写概率</a>
    <a href="../fourier-series/" data-zh="延伸:信号视角的压缩(JPEG/MP3)" data-en="related: compression via signals (JPEG/MP3)">延伸:信号视角的压缩(JPEG/MP3)</a>
  </div>
</div>

<script>
/* ================= 纯计算:频次 → 哈夫曼树 → 码表(无 DOM,可独立验证) ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eoc = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eoi = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const DEF_TEXT = 'this is an example of a huffman tree';

function huffmanOf(textStr) {
  const slots = [...textStr].map(ch => ({ ch, letter: /[a-z]/.test(ch) }));
  const freq = new Map();
  for (const s of slots) if (s.letter) freq.set(s.ch, (freq.get(s.ch) || 0) + 1);
  const letters = [...freq.entries()].map(([ch, f]) => ({ ch, f }))
    .sort((a, b) => b.f - a.f || (a.ch < b.ch ? -1 : 1));
  /* 建树:每轮取频次最小的两个(平局先入队者先),合并为新父节点 */
  let seq = 0;
  const Q = letters.map(o => ({ id: seq++, f: o.f, ch: o.ch, leaf: true }));
  const leaves = [...Q], merges = [];
  while (Q.length > 1) {
    Q.sort((a, b) => a.f - b.f || a.id - b.id);
    const a = Q.shift(), b = Q.shift();
    const p = { id: seq++, f: a.f + b.f, leaf: false, kids: [a, b], mi: merges.length };
    a.par = p; a.bit = '0'; b.par = p; b.bit = '1';
    Q.push(p); merges.push(p);
  }
  const root = Q[0];
  const n = slots.filter(s => s.letter).length, K = letters.length;
  const codes = {}, paths = {};
  let li = 0, maxD = 0;
  (function walk(nd, s, d, path) {
    nd.depth = d; if (d > maxD) maxD = d;
    if (nd.leaf) { nd.li = li++; codes[nd.ch] = s || '0'; paths[nd.ch] = path.concat(nd); return; }
    walk(nd.kids[0], s + '0', d + 1, path.concat(nd));
    walk(nd.kids[1], s + '1', d + 1, path.concat(nd));
  })(root, '', 0, []);
  /* 布局:叶子按中序落位在地上,内部节点升到其深度对应的高度 */
  const TX0 = 430, TX1 = 1140, BASE = 640;
  const leafW = (TX1 - TX0) / K;
  const rowH = maxD ? Math.min(86, (BASE - 50 - 240) / maxD) : 0;
  (function pos(nd) {
    if (nd.leaf) { nd.x = TX0 + (nd.li + 0.5) * leafW; nd.y = BASE; return; }
    pos(nd.kids[0]); pos(nd.kids[1]);
    nd.x = (nd.kids[0].x + nd.kids[1].x) / 2;
    nd.y = BASE - 50 - (maxD - nd.depth) * rowH;
  })(root);
  const rInner = nd => 6 + 4.2 * Math.sqrt(nd.f);
  const seqBits = slots.map(s => s.letter ? codes[s.ch] : null);
  const huffBits = seqBits.filter(Boolean).join('');
  const totalBits = huffBits.length;
  const asciiBits = n * 8;
  const fixedBits = n * Math.ceil(Math.log2(Math.max(K, 2)));
  let H = 0;
  for (const o of letters) { const p = o.f / n; H -= p * Math.log2(p); }
  const cl = Object.values(codes);
  let pf = true;
  outer: for (let i = 0; i < cl.length; i++) for (let j = 0; j < cl.length; j++)
    if (i !== j && cl[j].startsWith(cl[i])) { pf = false; break outer; }
  const table = letters.map(o => ({ ch: o.ch, f: o.f, code: codes[o.ch], len: codes[o.ch].length }))
    .sort((a, b) => a.len - b.len || b.f - a.f || (a.ch < b.ch ? -1 : 1));
  const occ = {}; for (const o of letters) occ[o.ch] = [];
  slots.forEach((s, i) => { if (s.letter) occ[s.ch].push(i); });
  const freqOf = {}, maxF = letters.length ? letters[0].f : 1;
  for (const o of letters) freqOf[o.ch] = o.f;
  /* 时间轴:数频次 → 一拍一拍建树 → 读码 → 编码 → 对比 */
  const COUNT_D = clamp(slots.length * 0.115, 2.6, 5.2);
  const BEAT = 1.05, MERGE_D = merges.length * BEAT, CODES_D = 4.6;
  const ENC_D = clamp(n * 0.115 + 0.5, 2.2, 5.6), CMP_D = 4.8;
  const SEGS = [
    { k: 'count', t0: 0, d: COUNT_D },
    { k: 'merge', t0: COUNT_D, d: MERGE_D },
    { k: 'codes', t0: COUNT_D + MERGE_D, d: CODES_D },
    { k: 'enc', t0: COUNT_D + MERGE_D + CODES_D, d: ENC_D },
    { k: 'cmp', t0: COUNT_D + MERGE_D + CODES_D + ENC_D, d: CMP_D },
  ];
  const TOTAL = SEGS[4].t0 + CMP_D;
  return { textStr, slots, letters, leaves, merges, root, codes, paths, table, occ, freqOf, maxF,
    n, K, maxD, leafW, TX0, TX1, BASE, rInner, seqBits, huffBits, totalBits, asciiBits, fixedBits,
    H, pf, SEGS, TOTAL, BEAT };
}

/* ================= DOM / 主题 / 语言(全站共享模式) ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

let TEXT = (qs.get('text') || DEF_TEXT).toLowerCase().replace(/[^a-z ]/g, ' ')
  .replace(/\s+/g, ' ').trim().slice(0, 44);
if (!/[a-z]/.test(TEXT)) TEXT = DEF_TEXT;
const D = huffmanOf(TEXT);
const SEGS = D.SEGS, BEAT = D.BEAT, TOTAL = D.TOTAL;
const SAVE = (100 * (1 - D.totalBits / D.asciiBits)).toFixed(1);
const CL2 = Math.ceil(Math.log2(Math.max(D.K, 2)));

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('哈夫曼编码 · 高频短码,低频长码', 'Huffman Coding · Short Codes for Frequent Letters');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布(1600×900 虚拟坐标) ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 绘制工具 ================= */
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
function text(str, x, y, size, color, align = 'left', weight = 500, fam = FONT) {
  ctx.font = `${weight} ${size}px ${fam}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke();
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function segOf(T) { for (let i = 4; i >= 0; i--) if (T >= SEGS[i].t0) return i; return 0; }
function litSlots(T) {
  return segOf(T) === 0 ? Math.floor(eoi(T / SEGS[0].d) * D.slots.length) : D.slots.length;
}
function encState(T) {
  const seg = segOf(T);
  if (seg < 3) return { cdf: 0, prog: 0 };
  const prog = seg > 3 ? 1 : clamp((T - SEGS[3].t0) / SEGS[3].d, 0, 1);
  return { cdf: prog * D.n, prog };
}
function appearOf(nd, T) {
  if (nd.leaf) return 1;
  const seg = segOf(T);
  if (seg < 1) return 0;
  if (seg > 1) return 1;
  const mF = (T - SEGS[1].t0) / BEAT;
  if (nd.mi < Math.floor(mF)) return 1;
  if (nd.mi > Math.floor(mF)) return 0;
  return clamp((mF - nd.mi - 0.3) / 0.7, 0, 1);
}
const leafR = (c2) => c2 ? 10 + 5 * Math.sqrt(c2) : 5;

/* ================= 例句条 ================= */
const SX0 = 60, SY = 112, TW = Math.min(32, (1450 - 3 * D.slots.length) / Math.max(D.slots.length, 1));
function drawStrip(T) {
  const seg = segOf(T), lit = litSlots(T), enc = encState(T);
  text(L('例句(仅统计字母)', 'sentence (letters counted)'), SX0, SY - 12, 11.5, PAL.dim);
  let x = SX0, li = 0;
  for (const s of D.slots) {
    const w = s.letter ? TW : TW * 0.45;
    if (s.letter) {
      const counted = D.slots.indexOf(s) < lit;
      const isCur = seg === 0 && D.slots.indexOf(s) === lit;
      const isEnc = seg >= 3 && li === Math.floor(enc.cdf) && enc.cdf < D.n;
      const yy = SY - (isCur ? 3 : 0);
      if (isCur || isEnc) { ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 10; }
      rrect(x, yy, w, 36, 7, counted ? 'rgba(76,201,240,.13)' : 'rgba(154,167,184,.07)',
        (isCur || isEnc) ? '#ffd166' : counted ? 'rgba(76,201,240,.45)' : 'rgba(154,167,184,.25)', 1.4);
      ctx.shadowBlur = 0;
      text(s.ch, x + w / 2, yy + 24, 15, counted ? PAL.text : PAL.dim2, 'center', 700);
      if (counted) {
        const f = D.freqOf[s.ch];
        ctx.fillStyle = `rgba(76,201,240,${0.25 + 0.75 * f / D.maxF})`;
        ctx.fillRect(x + 4, yy + 32, w - 8, 3);
      }
      li++;
    }
    x += w + 3;
  }
}

/* ================= 频次表(左上) + 公式 ================= */
const FLX = 48, FLY = 208, COLW = 172, ROWH = 28;
function drawFreqList(T) {
  if (!showFreq) return;
  const seg = segOf(T), lit = litSlots(T);
  ctx.save();
  ctx.globalAlpha = seg === 0 ? 1 : 0.42;
  text(L('字母频次(仅字母)', 'letter counts (letters only)'), FLX, FLY - 16, 11.5, PAL.dim);
  const perCol = Math.ceil(D.K / 2);
  D.letters.forEach((o, i) => {
    const col = Math.floor(i / perCol), row = i % perCol;
    const x = FLX + col * (COLW + 24), y = FLY + row * ROWH;
    const cnt = D.occ[o.ch].filter(si => si < lit).length;
    const bw = COLW - 52;
    text(o.ch, x, y + 4, 12.5, PAL.text, 'left', 700);
    rrect(x + 16, y - 6, bw, 12, 3, 'rgba(154,167,184,.10)');
    if (cnt > 0) rrect(x + 16, y - 6, Math.max(3, bw * cnt / D.maxF), 12, 3, 'rgba(76,201,240,.55)');
    text(String(cnt), x + 22 + bw, y + 4, 11.5, PAL.dim2, 'left');
  });
  const fy = FLY + perCol * ROWH + 20;
  text(L(`H = −Σ p·log₂p = ${D.H.toFixed(2)} bit/字(熵下限)`,
    `H = −Σ p·log₂ p = ${D.H.toFixed(2)} bits (entropy bound)`), FLX, fy, 11.5, PAL.dim2);
  text(L(`平均码长 L̄ = Σ p·ℓ = ${(D.totalBits / D.n).toFixed(2)} bit/字 ≥ H ✓`,
    `avg code length L̄ = ${(D.totalBits / D.n).toFixed(2)} bits ≥ H ✓`), FLX, fy + 18, 11.5, PAL.dim2);
  ctx.restore();
}

/* ================= 建树动画 ================= */
function drawTree(T) {
  const seg = segOf(T), TX0 = D.TX0, TX1 = D.TX1, BASE = D.BASE;
  line(TX0 - 16, BASE + 4, TX1 + 16, BASE + 4, PAL.axis, 1.5);
  const lit = litSlots(T);
  const mF = seg === 1 ? (T - SEGS[1].t0) / BEAT : D.merges.length;
  const mIdx = clamp(Math.floor(mF), 0, D.merges.length - 1);
  const sub = mF - Math.floor(mF);
  const curPair = seg === 1 ? D.merges[mIdx].kids : null;
  let lift = 0, glow = 0;
  if (curPair) {
    if (sub < 0.3) { lift = 12 * eoi(sub / 0.3); glow = 1; }
    else { lift = 12 * (1 - eoi((sub - 0.3) / 0.7)); glow = 1 - eoi((sub - 0.3) / 0.35); }
  }
  const kidY = nd => nd.leaf ? BASE - leafR(cntOf(nd, lit)) : nd.y;
  function cntOf(nd, lt) {
    let c2 = 0;
    for (const si of D.occ[nd.ch]) if (si < lt) c2++;
    return c2;
  }
  if (seg === 0 && showLabels) {
    text(L('森林:圆越大,频次越高;数完就开始合并', 'forest: bigger circle = higher freq; merging starts when counting ends'),
      (TX0 + TX1) / 2, BASE - 190, 13.5, PAL.dim, 'center');
  }
  /* 边 */
  for (const p of D.merges) {
    const ap = appearOf(p, T);
    if (ap <= 0) continue;
    const py = lerp(Math.min(kidY(p.kids[0]), kidY(p.kids[1])) - 22, p.y, eoc(ap));
    for (const kd of p.kids) {
      const ky2 = kidY(kd) - (curPair && curPair.includes(kd) ? lift : 0);
      ctx.globalAlpha = Math.min(1, ap * 2.5);
      line(p.x, py, lerp(p.x, kd.x, ap), lerp(py, ky2, ap), PAL.axis, 2);
      ctx.globalAlpha = 1;
    }
  }
  /* 内部节点 */
  for (const p of D.merges) {
    const ap = appearOf(p, T);
    if (ap <= 0) continue;
    const py = lerp(Math.min(kidY(p.kids[0]), kidY(p.kids[1])) - 22, p.y, eoc(ap));
    const r = D.rInner(p) * (0.5 + 0.5 * eoc(ap));
    const done = ap >= 1;
    if (!done && glow > 0) { ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 12; }
    circle(p.x, py, r, `rgba(76,201,240,${0.16 + 0.14 * ap})`,
      (p === D.root && done) ? '#ffd166' : 'rgba(76,201,240,.75)', 2);
    ctx.shadowBlur = 0;
    if (ap > 0.6 && showLabels) text(String(p.f), p.x, py + 4.5, 12.5, PAL.text, 'center', 700);
  }
  /* 叶子(初始森林) */
  for (const nd of D.leaves) {
    const c2 = cntOf(nd, lit), r = leafR(c2);
    const inPair = curPair && curPair.includes(nd);
    const cy = BASE - r - (inPair ? lift : 0);
    const claimed = nd.par && appearOf(nd.par, T) > 0;
    if (inPair && glow > 0) { ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 14 * glow; }
    circle(nd.x, cy, r, claimed ? 'rgba(76,201,240,.10)' : 'rgba(76,201,240,.20)',
      claimed ? 'rgba(76,201,240,.35)' : 'rgba(76,201,240,.8)', 1.8);
    ctx.shadowBlur = 0;
    if (c2 > 0) {
      text(nd.ch, nd.x, cy + 4.5, c2 >= 2 ? 13 : 11.5, PAL.text, 'center', 700);
      if (showLabels) text('×' + c2, nd.x, BASE + 18, 10, PAL.dim2, 'center');
    }
  }
  /* 当前合并标注 */
  if (seg === 1 && sub < 0.45 && showLabels) {
    const [ka, kb] = D.merges[mIdx].kids;
    text(L(`最小频次 ×2(合计 ${ka.f + kb.f})`, `two lightest (sum ${ka.f + kb.f})`),
      (ka.x + kb.x) / 2, Math.min(kidY(ka), kidY(kb)) - 48, 12.5, '#ffd166', 'center', 700);
  }
  /* 边上的 0/1 */
  if (seg >= 2 && showLabels) {
    const lt = T - SEGS[2].t0;
    for (const p of D.merges) {
      if (appearOf(p, T) < 1) continue;
      const a = clamp((lt - (0.2 + p.depth * 0.3)) / 0.35, 0, 1);
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      const ky0 = kidY(p.kids[0]);
      text('0', (p.x + p.kids[0].x) / 2 - 9, (p.y + ky0) / 2 + 4, 12, '#7fd0f7', 'center', 700);
      text('1', (p.x + p.kids[1].x) / 2 + 9, (p.y + kidY(p.kids[1])) / 2 + 4, 12, '#ffd166', 'center', 700);
      ctx.globalAlpha = 1;
    }
  }
}

/* ================= 码表 + 前缀注脚 ================= */
const TB = { x: 1160, w: 400, y: 196 };
function drawTable(T) {
  const seg = segOf(T);
  if (seg < 2) return;
  const local = T - SEGS[2].t0;
  const rowH = Math.min(27, (640 - TB.y - 46) / D.K), hh = 40;
  const stag = Math.min(0.22, 3 / D.K);
  rrect(TB.x, TB.y, TB.w, hh + D.K * rowH + 10, 12, PAL.pill, PAL.grid, 1);
  text(L('前缀码表', 'prefix-code table'), TB.x + 14, TB.y + 25, 13.5, PAL.text, 'left', 700);
  const okA = clamp((local - (0.35 + D.K * stag)) / 0.4, 0, 1);
  if (okA > 0) {
    ctx.globalAlpha = okA;
    text(L('✓ 无前缀歧义', '✓ prefix-free'), TB.x + TB.w - 14, TB.y + 25, 12, '#7ee2ae', 'right', 700);
    ctx.globalAlpha = 1;
  }
  D.table.forEach((r, i) => {
    const ft = local - (0.35 + i * stag);
    const a = clamp(ft / 0.3, 0, 1);
    if (a <= 0) return;
    const y = TB.y + hh + i * rowH;
    ctx.globalAlpha = a;
    if (i % 2) rrect(TB.x + 8, y - rowH + 6, TB.w - 16, rowH - 2, 5, 'rgba(154,167,184,.07)');
    text(r.ch, TB.x + 20, y - 7, 13, PAL.text, 'left', 700);
    text('×' + r.f, TB.x + 44, y - 7, 10.5, PAL.dim2);
    text(r.code.split('').join(' '), TB.x + 78, y - 7, 12.5, '#7fd0f7', 'left', 600, MONO);
    text(r.len + ' bit', TB.x + TB.w - 16, y - 7, 10.5, PAL.dim2, 'right');
    if (ft >= 0 && ft < 0.8) {
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3;
      ctx.globalAlpha = 0.85 * (1 - Math.abs(ft - 0.3) / 0.5);
      ctx.beginPath();
      D.paths[r.ch].forEach((nd, j2) => {
        const yy = nd.leaf ? D.BASE - leafR(D.freqOf[nd.ch]) : nd.y;
        j2 ? ctx.lineTo(nd.x, yy) : ctx.moveTo(nd.x, yy);
      });
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
  const fa = clamp((local - 1.2) / 0.6, 0, 1);
  if (fa > 0) {
    ctx.globalAlpha = fa;
    text(L('前缀码:任何码字都不是另一码字的开头', 'prefix code: no codeword starts with another'),
      TB.x + TB.w / 2, TB.y + hh + D.K * rowH + 28, 11, PAL.dim, 'center');
    text(L('→ 解码从左到右,永无歧义 ✓(本页已实时验证)', '→ decoding left-to-right is unambiguous ✓ (verified live)'),
      TB.x + TB.w / 2, TB.y + hh + D.K * rowH + 44, 11, PAL.dim, 'center');
    ctx.globalAlpha = 1;
  }
}

/* ================= 比特流 + 对比 ================= */
const HX = 430, HXW = 1130;
function drawBits(T) {
  const seg = segOf(T);
  if (seg < 3) return;
  const enc = encState(T);
  const cw = Math.min(11, HXW / D.totalBits), ch = 30, y1 = 702, y2 = 754;
  text(L(`Huffman ${D.totalBits} bit`, `Huffman ${D.totalBits} bits`), HX, y1 - 24, 11.5, '#7fd0f7', 'left', 700);
  for (let i = 0; i < D.totalBits; i++) {
    const x = HX + i * cw;
    const on = i + 1 <= enc.prog * D.totalBits;
    const part = !on ? clamp(enc.prog * D.totalBits - i, 0, 1) : 0;
    if (on || part > 0) {
      ctx.globalAlpha = on ? 1 : part;
      if (D.huffBits[i] === '1') rrect(x, y1, cw - 1.5, ch, 2.5, '#7fd0f7');
      else rrect(x, y1, cw - 1.5, ch, 2.5, null, 'rgba(127,208,247,.55)', 1.2);
      ctx.globalAlpha = 1;
    } else if (showLabels) rrect(x, y1, cw - 1.5, ch, 2.5, null, 'rgba(127,208,247,.14)', 1);
  }
  if (showLabels) {
    let acc = 0;
    for (const s of D.slots) {
      if (!s.letter) continue;
      text(s.ch, HX + (acc + D.seqBits[D.slots.indexOf(s)].length * cw) / 2, y1 - 2, 9.5, PAL.dim2, 'center');
      acc += D.seqBits[D.slots.indexOf(s)].length;
    }
  }
  const cw2 = Math.min(4.5, HXW / D.asciiBits);
  text(L(`定长 8-bit ASCII ${D.asciiBits} bit`, `fixed 8-bit ASCII ${D.asciiBits} bits`), HX, y2 - 8, 11.5, PAL.dim2, 'left', 700);
  for (let i = 0; i < D.asciiBits; i++) {
    const fr = clamp(enc.cdf - i / 8, 0, 1) * 3;
    if (fr <= 0) continue;
    ctx.globalAlpha = Math.min(1, fr);
    rrect(HX + i * cw2, y2, cw2 - 1, 20, 1.5, 'rgba(154,167,184,.45)');
    ctx.globalAlpha = 1;
  }
}
function drawCompare(T) {
  const seg = segOf(T);
  if (seg < 4) return;
  const local = T - SEGS[4].t0, MW = 960, b1y = 806, b2y = 838, bh = 20;
  text(L(`Huffman ${D.totalBits} bit · 平均 ${(D.totalBits / D.n).toFixed(2)} bit/字`,
    `Huffman ${D.totalBits} bits · ${(D.totalBits / D.n).toFixed(2)} avg`), HX, b1y - 7, 12, '#7fd0f7', 'left', 700);
  const w1 = eoc(local / 1.2) * MW * D.totalBits / D.asciiBits;
  rrect(HX, b1y, w1, bh, 5, 'rgba(76,201,240,.8)');
  const hx = HX + MW * D.H * D.n / D.asciiBits;
  line(hx, b1y - 3, hx, b1y + bh + 3, '#ffd166', 2);
  if (showLabels) text(L(`熵下限 ${(D.H * D.n).toFixed(1)} bit`, `entropy ${(D.H * D.n).toFixed(1)} bits`),
    hx, b1y - 20, 10.5, '#ffd166', 'center');
  text(L(`定长 8-bit ASCII ${D.asciiBits} bit · 8.00 bit/字`,
    `fixed 8-bit ASCII ${D.asciiBits} bits · 8.00 avg`), HX, b2y - 7, 12, PAL.dim2, 'left', 700);
  const w2 = eoc((local - 0.2) / 1.2) * MW;
  rrect(HX, b2y, w2, bh, 5, 'rgba(154,167,184,.4)');
  const ba = clamp((local - 1.35) / 0.35, 0, 1);
  if (ba > 0) {
    ctx.globalAlpha = ba;
    text(L(`省 ${SAVE}%`, `saved ${SAVE}%`), HX + w1 + 14, b1y + bh - 4, 16, '#7ee2ae', 'left', 700);
    ctx.globalAlpha = 1;
  }
  if (local > 2) text(L(`${D.K} 种符号的定长下限 ⌈log₂${D.K}⌉ = ${CL2} bit/字(${D.fixedBits} bit)——Huffman 的 ${D.totalBits} bit 连定长下限都打破了`,
    `fixed-length floor for ${D.K} symbols: ${CL2} bits (${D.fixedBits} bits) — Huffman's ${D.totalBits} beats even that`),
    HX, b2y + bh + 18, 11.5, PAL.dim);
}

/* ================= 步骤讲解 ================= */
const STEPS = [
  { b: '数频次', be: 'Count frequencies',
    d: '逐字扫描例句,数出每个字母出现的次数——频次就是它在算法里的「重量」。',
    de: 'Scan the sentence letter by letter — each letter\'s count is its weight in the algorithm.' },
  { b: '建树:合并最小的两个', be: 'Build: merge the two lightest',
    d: '每一步从森林里拎出频次最小的两个节点,合并成一个新父节点;最小的先合并,所以沉得最深。',
    de: 'Each step lifts the two least-frequent nodes out of the forest and merges them under a new parent — the lightest merge first, so they sink deepest.' },
  { b: '读出前缀码', be: 'Read off the prefix codes',
    d: '从根走到叶:向左记 0、向右记 1。高频字母离根近、码短;低频字母路径深、码长。',
    de: 'Walk root to leaf: left = 0, right = 1. Frequent letters sit shallow with short codes; rare ones get long paths.' },
  { b: '编码成比特流', be: 'Encode into a bitstream',
    d: `查表逐字替换,把原句写成 0/1 串——共 ${D.totalBits} bit,平均 ${(D.totalBits / D.n).toFixed(2)} bit/字。`,
    de: `Swap each letter for its code — ${D.totalBits} bits in total, ${(D.totalBits / D.n).toFixed(2)} per letter on average.` },
  { b: '与定长 ASCII 对比', be: 'Compare with fixed ASCII',
    d: `定长 8-bit 要 ${D.asciiBits} bit,Huffman 只要 ${D.totalBits} bit——省 ${SAVE}%,已贴近熵下限 ${(D.H * D.n).toFixed(1)} bit。`,
    de: `Fixed 8-bit ASCII costs ${D.asciiBits} bits; Huffman needs only ${D.totalBits} — ${SAVE}% saved, near the ${(D.H * D.n).toFixed(1)}-bit entropy bound.` },
];
const elSteps = document.getElementById('steps');
function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => seek(SEGS[i].t0));
    elSteps.appendChild(li);
  });
  syncSteps();
}
function syncSteps() {
  const i = segOf(T);
  [...elSteps.children].forEach((li, j) => li.classList.toggle('on', j === i));
}

/* ================= UI / 主循环 ================= */
let T = 0, playing = true, speed = 1;
let showLabels = true, showFreq = true;
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const elSeek = document.getElementById('seek'), elSeekVal = document.getElementById('seekVal');
const tglLabels = document.getElementById('tglLabels'), tglFreq = document.getElementById('tglFreq');

function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.addEventListener('input', () => {
  speed = parseFloat(elSpeed.value);
  elSpeedVal.textContent = speed.toFixed(1) + '×';
});
let scrub = false;
elSeek.addEventListener('pointerdown', () => { scrub = true; });
addEventListener('pointerup', () => { scrub = false; });
elSeek.addEventListener('input', () => seek(elSeek.value / 1000 * TOTAL));
function seek(t2) { T = clamp(t2, 0, TOTAL - 0.01); render(); }
const BOUNDS = [0, SEGS[1].t0];
for (let i = 1; i < D.merges.length; i++) BOUNDS.push(SEGS[1].t0 + i * BEAT);
for (let i = 2; i < 5; i++) BOUNDS.push(SEGS[i].t0);
function stepTo(dir) {
  playing = false; setPlayLabel();
  if (dir > 0) {
    const nx = BOUNDS.find(b => b > T + 1e-4);
    seek(nx === undefined ? 0 : nx);
  } else {
    const c = BOUNDS.filter(b => b < T - 1e-4);
    seek(c.length ? c[c.length - 1] : TOTAL - 0.01);
  }
}
document.getElementById('stepBtn').addEventListener('click', () => stepTo(1));
document.getElementById('replayBtn').addEventListener('click', () => { T = 0; playing = true; setPlayLabel(); render(); });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglFreq.addEventListener('change', () => { showFreq = tglFreq.checked; });
addEventListener('keydown', e => {
  const tg = e.target;
  if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'A')) return;
  if (tg && tg.tagName === 'BUTTON') tg.blur();
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); stepTo(1); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); stepTo(-1); }
});

function segLabel(T2) {
  const i = segOf(T2);
  const names = [L('数频次', 'count'), L('建树', 'build'), L('读码', 'codes'), L('编码', 'encode'), L('对比', 'compare')];
  let s = names[i];
  if (i === 1 && D.merges.length)
    s += ` ${Math.min(D.merges.length, Math.floor((T2 - SEGS[1].t0) / BEAT) + 1)}/${D.merges.length}`;
  return s;
}
function updateStats() {
  document.getElementById('stN').textContent = D.n;
  document.getElementById('stK').textContent = D.K;
  document.getElementById('stH').textContent = L(`${D.totalBits} bit · ${(D.totalBits / D.n).toFixed(2)}/字`,
    `${D.totalBits} bits · ${(D.totalBits / D.n).toFixed(2)}/char`);
  document.getElementById('stEnt').textContent = `${D.H.toFixed(2)}`;
  document.getElementById('stA').textContent = `${D.asciiBits} bit`;
  document.getElementById('stSave').textContent = `−${SAVE}%`;
  document.getElementById('stPf').textContent = D.pf ? '✓' : '✗';
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  drawFreqList(T);
  drawStrip(T);
  drawTree(T);
  drawTable(T);
  drawBits(T);
  drawCompare(T);
  updateStats();
  if (!scrub) elSeek.value = Math.round(T / TOTAL * 1000);
  elSeekVal.textContent = `${segLabel(T)} ${T.toFixed(0)}s`;
  syncSteps();
}
let last = performance.now(), rafId = 0, running = false;
function frame(now) {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) { T += dt * speed; if (T >= TOTAL) T -= TOTAL; }
  render();
}
function start() { if (!running) { running = true; last = performance.now(); rafId = requestAnimationFrame(frame); } }
function stop() { running = false; cancelAnimationFrame(rafId); }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
speed = clamp(qsFloat('speed', 1), 0.2, 4);
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
playing = !qsBool('pause', false);
if (!qs.get('pause') && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
