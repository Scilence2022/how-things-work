<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 纯计算:频次 → 哈夫曼树 → 码表(与 2D 版同一套算法) ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eoc = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eoi = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const DEF_TEXT = 'this is an example of a huffman tree';

function huffmanOf(textStr) {
  const slots = [...textStr].map(ch => ({ ch, letter: /[a-z]/.test(ch) }));
  const freq = new Map();
  for (const s of slots) if (s.letter) freq.set(s.ch, (freq.get(s.ch) || 0) + 1);
  const letters = [...freq.entries()].map(([ch, f]) => ({ ch, f }))
    .sort((a, b) => b.f - a.f || (a.ch < b.ch ? -1 : 1));
  /* 建树:每轮取频次最小的两个(平局先入队者先),合并为新父节点 */
  let seq = 0;
  const Q = letters.map(o => ({ id: seq++, f: o.f, ch: o.ch, leaf: true }));
  const leaves = [...Q], merges = [];
  while (Q.length > 1) {
    Q.sort((a, b) => a.f - b.f || a.id - b.id);
    const a = Q.shift(), b = Q.shift();
    const p = { id: seq++, f: a.f + b.f, leaf: false, kids: [a, b], mi: merges.length };
    a.par = p; a.bit = '0'; b.par = p; b.bit = '1';
    Q.push(p); merges.push(p);
  }
  const root = Q[0];
  const n = slots.filter(s => s.letter).length, K = letters.length;
  const codes = {}, paths = {};
  let li = 0, maxD = 0;
  (function walk(nd, s, d, path) {
    nd.depth = d; if (d > maxD) maxD = d;
    if (nd.leaf) { nd.li = li++; codes[nd.ch] = s || '0'; paths[nd.ch] = path.concat(nd); return; }
    walk(nd.kids[0], s + '0', d + 1, path.concat(nd));
    walk(nd.kids[1], s + '1', d + 1, path.concat(nd));
  })(root, '', 0, []);
  /* 3D 布局:叶子按中序排在地面(y=0),内部节点按深度向上悬浮生长 */
  const SPAN = Math.min(12.5, 1.2 + K * 0.74);
  const leafW = SPAN / K;
  const rowH = maxD ? Math.min(0.92, 3.3 / maxD) : 0;
  (function pos(nd) {
    if (nd.leaf) { nd.x = -SPAN / 2 + (nd.li + 0.5) * leafW; nd.y = 0; return; }
    pos(nd.kids[0]); pos(nd.kids[1]);
    nd.x = (nd.kids[0].x + nd.kids[1].x) / 2;
    nd.y = 0.85 + (maxD - nd.depth) * rowH;
  })(root);
  const rInner = nd => 0.085 + 0.05 * Math.sqrt(nd.f);
  const seqBits = slots.map(s => s.letter ? codes[s.ch] : null);
  const huffBits = seqBits.filter(Boolean).join('');
  const totalBits = huffBits.length;
  const asciiBits = n * 8;
  const fixedBits = n * Math.ceil(Math.log2(Math.max(K, 2)));
  let H = 0;
  for (const o of letters) { const p = o.f / n; H -= p * Math.log2(p); }
  const cl = Object.values(codes);
  let pf = true;
  outer: for (let i = 0; i < cl.length; i++) for (let j = 0; j < cl.length; j++)
    if (i !== j && cl[j].startsWith(cl[i])) { pf = false; break outer; }
  const table = letters.map(o => ({ ch: o.ch, f: o.f, code: codes[o.ch], len: codes[o.ch].length }))
    .sort((a, b) => a.len - b.len || b.f - a.f || (a.ch < b.ch ? -1 : 1));
  const occ = {}; for (const o of letters) occ[o.ch] = [];
  slots.forEach((s, i) => { if (s.letter) occ[s.ch].push(i); });
  const freqOf = {}, maxF = letters.length ? letters[0].f : 1;
  for (const o of letters) freqOf[o.ch] = o.f;
  /* 时间轴:数频次 → 一拍一拍建树 → 读码 → 编码 → 对比 */
  const COUNT_D = clamp(slots.length * 0.115, 2.6, 5.2);
  const BEAT = 1.05, MERGE_D = merges.length * BEAT, CODES_D = 4.6;
  const ENC_D = clamp(n * 0.115 + 0.5, 2.2, 5.6), CMP_D = 4.8;
  const SEGS = [
    { k: 'count', t0: 0, d: COUNT_D },
    { k: 'merge', t0: COUNT_D, d: MERGE_D },
    { k: 'codes', t0: COUNT_D + MERGE_D, d: CODES_D },
    { k: 'enc', t0: COUNT_D + MERGE_D + CODES_D, d: ENC_D },
    { k: 'cmp', t0: COUNT_D + MERGE_D + CODES_D + ENC_D, d: CMP_D },
  ];
  const TOTAL = SEGS[4].t0 + CMP_D;
  return { textStr, slots, letters, leaves, merges, root, codes, paths, table, occ, freqOf, maxF,
    n, K, maxD, SPAN, leafW, rowH, rInner, seqBits, huffBits, totalBits, asciiBits, fixedBits,
    H, pf, SEGS, TOTAL, BEAT };
}

/* ================= DOM / 主题 / 语言(全站共享模式) ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

let TEXT = (qs.get('text') || DEF_TEXT).toLowerCase().replace(/[^a-z ]/g, ' ')
  .replace(/\s+/g, ' ').trim().slice(0, 44);
if (!/[a-z]/.test(TEXT)) TEXT = DEF_TEXT;
const D = huffmanOf(TEXT);
const SEGS = D.SEGS, BEAT = D.BEAT, TOTAL = D.TOTAL;
const SAVE = (100 * (1 - D.totalBits / D.asciiBits)).toFixed(1);
const CL2 = Math.ceil(Math.log2(Math.max(D.K, 2)));

/* ================= 渲染器 / 场景 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(6.5, 5.4, 13.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.2, 1.4, -0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 32;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 7, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

const grid = new THREE.GridHelper(40, 40, 0x3a4656, 0x3a4656);
grid.material.transparent = true;
grid.material.opacity = 0.32;
scene.add(grid);

/* ================= 布局常量 ================= */
const STRIP_Z = 4.6;                       // 例句条(前)
const FREQ_Z = -0.95;                      // 频次条(树后)
const BITS_Z = -5.2;                       // 比特流(后)
const CMP_Z = -6.7;                        // 对比条(最后)
const TABLE_X = 7.5;                       // 码表(右侧悬浮)
const CBW = 12, CX0 = -6;                  // 对比条全长与起点
const leafS = c2 => c2 ? 0.24 + 0.125 * Math.sqrt(c2) : 0.15;

/* ================= 运行状态(标签回调注册即求值,须先于标签区声明) ================= */
let T = 0, playing = true, speed = 1;
let showLabels = true, showFreq = true;
let _seg = 0, _sub = 0, _curMerge = null, _okA = 0, _fa = 0, _saveA = 0, _floorOn = false;

/* ================= 场景标签(CSS2D) ================= */
const labelReg = [];                       // 受「标签」开关控制
const labelFixed = [];                     // 内容性标签(字母/码表/标题),不受开关控制
let labelsOn = true;
function addLabel(textFn, pos, cls = '', vis = () => true, fixed = false) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  const r = { o, text: textFn, vis, fixed, cur: null };
  (fixed ? labelFixed : labelReg).push(r);
  div.textContent = textFn();
  return r;
}
function refreshLabels() {
  for (const arr of [labelReg, labelFixed]) for (const r of arr) {
    const on = (r.fixed || labelsOn) && r.vis();
    const t = on ? r.text() : '';
    r.o.visible = on && t !== '';
    if (r.o.visible && t !== r.cur) { r.cur = t; r.o.element.textContent = t; }
  }
}

/* ================= 例句条(前,z=STRIP_Z) ================= */
const TW = Math.min(0.34, (12.6 - 0.1 * D.slots.length) / Math.max(D.slots.length, 1));
let stripW = 0;
for (const s of D.slots) stripW += (s.letter ? TW : TW * 0.45) + TW * 0.12;
stripW -= TW * 0.12;
const slotGeo = new THREE.BoxGeometry(1, 0.3, 0.34);
const slotMesh = [], slotMat = [], slotLbl = [];
{
  let cx = -stripW / 2;
  for (let i = 0; i < D.slots.length; i++) {
    const s = D.slots[i];
    const w = s.letter ? TW : TW * 0.45;
    s.px = cx + w / 2;
    cx += w + TW * 0.12;
    if (!s.letter) { slotMesh.push(null); slotMat.push(null); slotLbl.push(null); continue; }
    const mt = new THREE.MeshStandardMaterial({ color: 0x2e3844, roughness: 0.5, metalness: 0.1 });
    const m = new THREE.Mesh(slotGeo, mt);
    m.scale.x = w * 0.9;
    m.position.set(s.px, 0.56, STRIP_Z);
    scene.add(m);
    slotMesh.push(m); slotMat.push(mt);
    slotLbl.push(addLabel(() => s.ch, new THREE.Vector3(s.px, 0.56, STRIP_Z), 'plain ch', () => true, true));
  }
}
const shelfMat = new THREE.MeshStandardMaterial({ color: 0x1a2027, roughness: 0.8, transparent: true, opacity: 0.9 });
const shelf = new THREE.Mesh(new THREE.BoxGeometry(stripW + 0.6, 0.06, 0.7), shelfMat);
shelf.position.set(0, 0.38, STRIP_Z);
scene.add(shelf);
addLabel(() => L('例句(仅统计字母)', 'sentence (letters counted)'),
  new THREE.Vector3(0, 1.14, STRIP_Z), 'st', () => true, true);

/* ================= 哈夫曼树(中,z=0) ================= */
const leafGeo = new THREE.BoxGeometry(1, 1, 1);
const barGeo = new THREE.BoxGeometry(0.15, 1, 0.15).translate(0, 0.5, 0);
const sphGeo = new THREE.SphereGeometry(1, 20, 14);
const cylGeo = new THREE.CylinderGeometry(0.024, 0.024, 1, 6);
const freqG = new THREE.Group();
scene.add(freqG);
const edgeMats = [];
for (const nd of D.leaves) {
  const mt = new THREE.MeshStandardMaterial({ color: 0x2a6b80, roughness: 0.35, metalness: 0.1,
    transparent: true, opacity: 0.88, emissive: 0x4cc9f0, emissiveIntensity: 0.16 });
  const m = new THREE.Mesh(leafGeo, mt);
  scene.add(m);
  nd.mesh = m; nd.mat = mt; nd._c2 = 0; nd.cs = 0.15; nd.cy = 0.075;
  nd.lblCh = addLabel(() => nd.ch, new THREE.Vector3(nd.x, 0.2, 0), 'plain ch', () => true, true);
  nd.lblCnt = addLabel(() => '×' + nd._c2, new THREE.Vector3(nd.x, 0.14, 0.72), 'num', () => nd._c2 > 0);
  const bmt = new THREE.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.5, transparent: true,
    opacity: 0.9, emissive: 0x4cc9f0, emissiveIntensity: 0.15 });
  const bar = new THREE.Mesh(barGeo, bmt);
  freqG.add(bar);
  nd.bar = bar; nd.barMat = bmt;
  nd.lblFreq = addLabel(() => '×' + nd._c2, new THREE.Vector3(nd.x, 0.3, FREQ_Z), 'num', () => showFreq, true);
}
for (const p of D.merges) {
  const mt = new THREE.MeshStandardMaterial({ color: 0x2f7d99, roughness: 0.3, metalness: 0.1,
    transparent: true, opacity: 0.6, emissive: 0x4cc9f0, emissiveIntensity: 0.25 });
  const m = new THREE.Mesh(sphGeo, mt);
  scene.add(m);
  p.mesh = m; p.mat = mt; p._ap = 0; p._r = 0.1; p.cy = 0;
  p.edges = [];
  for (let k = 0; k < 2; k++) {
    const em = new THREE.MeshBasicMaterial({ color: 0x8b97a8, transparent: true, opacity: 0.9, toneMapped: false });
    edgeMats.push(em);
    const e = new THREE.Mesh(cylGeo, em);
    scene.add(e);
    p.edges.push(e);
  }
  p.lblF = addLabel(() => String(p.f), new THREE.Vector3(p.x, p.y + 0.3, 0), 'num', () => p._ap > 0.6);
}
/* 树上的地面参考线 */
const axisMat = new THREE.MeshBasicMaterial({ color: 0x8b97a8, transparent: true, opacity: 0.7, toneMapped: false });
const axisBar = new THREE.Mesh(new THREE.BoxGeometry(D.SPAN + 0.8, 0.025, 0.06), axisMat);
axisBar.position.set(0, 0.012, 0);
scene.add(axisBar);
/* 边上的 0/1(位置按最终布局静态) */
const topOf = kd => kd.leaf ? leafS(kd.f) : kd.y + D.rInner(kd) * 0.55;
for (const p of D.merges) {
  p._ba = 0;
  p.bitLbl = [
    addLabel(() => '0', new THREE.Vector3((p.x + p.kids[0].x) / 2 - 0.1, (p.y + topOf(p.kids[0])) / 2, 0.1),
      'bit0', () => _seg >= 2 && p._ba > 0),
    addLabel(() => '1', new THREE.Vector3((p.x + p.kids[1].x) / 2 + 0.1, (p.y + topOf(p.kids[1])) / 2, 0.1),
      'bit1', () => _seg >= 2 && p._ba > 0),
  ];
}
/* 森林提示 + 当前合并标注 */
addLabel(() => L('森林:方块越大,频次越高;数完就开始合并', 'forest: bigger cube = higher freq; merging starts when counting ends'),
  new THREE.Vector3(0, 4.5, 0), 'st', () => _seg === 0);
const lblMerge = addLabel(() => {
  if (!_curMerge) return '';
  const [ka, kb] = _curMerge.kids;
  return L(`最小频次 ×2(合计 ${ka.f + kb.f})`, `two lightest (sum ${ka.f + kb.f})`);
}, new THREE.Vector3(0, 2, 0), 'o', () => _seg === 1 && _sub < 0.45 && !!_curMerge);

/* ================= 频次公式(频次表的一部分) ================= */
const freqDim = [];
freqDim.push(addLabel(() => L(`H = −Σ p·log₂p = ${D.H.toFixed(2)} bit/字(熵下限)`,
    `H = −Σ p·log₂ p = ${D.H.toFixed(2)} bits (entropy bound)`),
  new THREE.Vector3(-7.5, 5.0, 0), 'st', () => showFreq, true));
freqDim.push(addLabel(() => L(`平均码长 L̄ = Σ p·ℓ = ${(D.totalBits / D.n).toFixed(2)} bit/字 ≥ H ✓`,
    `avg code length L̄ = ${(D.totalBits / D.n).toFixed(2)} bits ≥ H ✓`),
  new THREE.Vector3(-7.5, 4.62, 0), 'st', () => showFreq, true));

/* ================= 码表(右侧悬浮)+ 前缀注脚 + 路径飘带 ================= */
const stag = Math.min(0.22, 3 / D.K);
const rowHW = Math.min(0.34, 4.4 / D.K);
const tableTop = 4.95, tableBot = tableTop - (D.K - 1) * rowHW;
const panelMat = new THREE.MeshBasicMaterial({ color: 0x0d1118, transparent: true, opacity: 0,
  toneMapped: false, side: THREE.DoubleSide, depthWrite: false });
const panelMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 5.78 - (tableBot - 1.05)), panelMat);
panelMesh.position.set(TABLE_X, (5.78 + tableBot - 1.05) / 2, -0.18);
panelMesh.visible = false;
scene.add(panelMesh);
addLabel(() => L('前缀码表', 'prefix-code table'), new THREE.Vector3(TABLE_X, 5.52, 0), 'b',
  () => _seg >= 2, true);
const okLbl = addLabel(() => L('✓ 无前缀歧义', '✓ prefix-free'), new THREE.Vector3(TABLE_X, 5.2, 0), 'g',
  () => _seg >= 2 && _okA > 0, true);
const tableRows = [];
D.table.forEach((r, i) => {
  r._a = 0; r._i = i;
  const lbl = addLabel(() => `${r.ch} ×${r.f}   ${r.code.split('').join(' ')}   ${r.len} bit`,
    new THREE.Vector3(TABLE_X, tableTop - i * rowHW, 0), 'code', () => _seg >= 2 && r._a > 0, true);
  tableRows.push({ r, lbl });
});
const fn1 = addLabel(() => L('前缀码:任何码字都不是另一码字的开头', 'prefix code: no codeword starts with another'),
  new THREE.Vector3(TABLE_X, tableBot - 0.42, 0), 'st', () => _seg >= 2 && _fa > 0, true);
const fn2 = addLabel(() => L('→ 解码从左到右,永无歧义 ✓(本页已实时验证)', '→ decoding left-to-right is unambiguous ✓ (verified live)'),
  new THREE.Vector3(TABLE_X, tableBot - 0.76, 0), 'st', () => _seg >= 2 && _fa > 0, true);
/* 根→叶 金色路径飘带(码表逐行亮起时闪烁对应路径) */
const ribbonPos = new Float32Array(16 * 3);
const ribbonGeo = new THREE.BufferGeometry();
ribbonGeo.setAttribute('position', new THREE.BufferAttribute(ribbonPos, 3));
const ribbon = new THREE.Line(ribbonGeo,
  new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.85, toneMapped: false }));
ribbon.frustumCulled = false;
ribbon.visible = false;
scene.add(ribbon);

/* ================= 比特流(后,z=BITS_Z) ================= */
const bitsG = new THREE.Group();
scene.add(bitsG);
const hCW = Math.min(0.13, 13 / D.totalBits);
const aCW = Math.min(0.06, 13 / D.asciiBits);
const hX0 = -hCW * D.totalBits / 2, aX0 = -aCW * D.asciiBits / 2;
const _m = new THREE.Matrix4(), _v = new THREE.Vector3(), _s = new THREE.Vector3(), _q0 = new THREE.Quaternion();
const bitGeo = new THREE.BoxGeometry(1, 1, 1);
const huffIM = new THREE.InstancedMesh(bitGeo, new THREE.MeshBasicMaterial({ toneMapped: false }), D.totalBits);
for (let i = 0; i < D.totalBits; i++) {
  _m.compose(_v.set(hX0 + (i + 0.5) * hCW, 0.62, BITS_Z), _q0, _s.set(hCW * 0.8, 0.11, 0.16));
  huffIM.setMatrixAt(i, _m);
}
huffIM.count = 0;
huffIM.frustumCulled = false;
bitsG.add(huffIM);
const asciiIM = new THREE.InstancedMesh(bitGeo, new THREE.MeshBasicMaterial({ toneMapped: false }), D.asciiBits);
for (let i = 0; i < D.asciiBits; i++) {
  _m.compose(_v.set(aX0 + (i + 0.5) * aCW, 0.2, BITS_Z), _q0, _s.set(aCW * 0.75, 0.05, 0.09));
  asciiIM.setMatrixAt(i, _m);
}
asciiIM.count = 0;
asciiIM.frustumCulled = false;
bitsG.add(asciiIM);
const cursor = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
  new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.9, toneMapped: false }));
cursor.scale.set(hCW * 0.95, 0.17, 0.22);
cursor.visible = false;
bitsG.add(cursor);
bitsG.visible = false;
addLabel(() => L(`Huffman ${D.totalBits} bit`, `Huffman ${D.totalBits} bits`),
  new THREE.Vector3(0, 1.06, BITS_Z), 'b', () => _seg >= 3, true);
addLabel(() => L(`定长 8-bit ASCII ${D.asciiBits} bit`, `fixed 8-bit ASCII ${D.asciiBits} bits`),
  new THREE.Vector3(0, 0.4, BITS_Z), 'st', () => _seg >= 3, true);
{
  let acc = 0;
  for (let i = 0; i < D.slots.length; i++) {
    const s = D.slots[i];
    if (!s.letter) continue;
    const len = D.seqBits[i].length, ch = s.ch;
    addLabel(() => ch, new THREE.Vector3(hX0 + (acc + len / 2) * hCW, 0.85, BITS_Z), 'tick',
      () => _seg >= 3);
    acc += len;
  }
}

/* ================= 对比条(最后,z=CMP_Z) ================= */
const cmpG = new THREE.Group();
scene.add(cmpG);
const huffLenF = CBW * D.totalBits / D.asciiBits;
const hx = CX0 + CBW * D.H * D.n / D.asciiBits;
const cmpBarGeo = new THREE.BoxGeometry(1, 0.2, 0.32).translate(0.5, 0, 0);
const huffBarMat = new THREE.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.45, emissive: 0x4cc9f0, emissiveIntensity: 0.18 });
const huffBar = new THREE.Mesh(cmpBarGeo, huffBarMat);
huffBar.position.set(CX0, 1.1, CMP_Z);
cmpG.add(huffBar);
const asciiBarMat = new THREE.MeshStandardMaterial({ color: 0x6b7684, roughness: 0.6 });
const asciiBar = new THREE.Mesh(cmpBarGeo, asciiBarMat);
asciiBar.position.set(CX0, 0.6, CMP_Z);
cmpG.add(asciiBar);
const entTick = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.38, 0.38),
  new THREE.MeshBasicMaterial({ color: 0xffd166, toneMapped: false }));
entTick.position.set(hx, 1.1, CMP_Z);
cmpG.add(entTick);
cmpG.visible = false;
addLabel(() => L(`Huffman ${D.totalBits} bit · 平均 ${(D.totalBits / D.n).toFixed(2)} bit/字`,
    `Huffman ${D.totalBits} bits · ${(D.totalBits / D.n).toFixed(2)} avg`),
  new THREE.Vector3(CX0 + huffLenF / 2, 1.42, CMP_Z), 'b', () => _seg >= 4, true);
addLabel(() => L(`熵下限 ${(D.H * D.n).toFixed(1)} bit`, `entropy ${(D.H * D.n).toFixed(1)} bits`),
  new THREE.Vector3(hx, 1.68, CMP_Z), 'o', () => _seg >= 4);
addLabel(() => L(`定长 8-bit ASCII ${D.asciiBits} bit · 8.00 bit/字`, `fixed 8-bit ASCII ${D.asciiBits} bits · 8.00 avg`),
  new THREE.Vector3(0, 0.88, CMP_Z), 'st', () => _seg >= 4, true);
const saveLbl = addLabel(() => L(`省 ${SAVE}%`, `saved ${SAVE}%`),
  new THREE.Vector3(CX0 + huffLenF + 0.55, 1.1, CMP_Z), 'g', () => _seg >= 4 && _saveA > 0, true);
const floorLbl = addLabel(() => L(
    `${D.K} 种符号的定长下限 ⌈log₂${D.K}⌉ = ${CL2} bit/字(${D.fixedBits} bit)——Huffman 的 ${D.totalBits} bit 连定长下限都打破了`,
    `fixed-length floor for ${D.K} symbols: ${CL2} bits (${D.fixedBits} bits) — Huffman's ${D.totalBits} beats even that`),
  new THREE.Vector3(0, 0.24, CMP_Z), 'st', () => _seg >= 4 && _floorOn, true);

/* ================= 主题 / 语言 ================= */
const stripOffCol = new THREE.Color(0x2e3844), stripOnCol = new THREE.Color(0x24566b);
const bit1Col = new THREE.Color(), bit0Col = new THREE.Color(), asciiCol = new THREE.Color();
function applyTheme() {
  const dark = THEME === 'dark';
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = dark ? '☀' : '☾';
  const bg = dark ? 0x10141b : 0xeef1f6;
  scene.background = new THREE.Color(bg);
  scene.fog = new THREE.Fog(bg, 26, 56);
  grid.material.color.set(dark ? 0x3a4656 : 0x9aa7b8);
  grid.material.opacity = dark ? 0.32 : 0.5;
  stripOffCol.set(dark ? 0x2e3844 : 0xdde3ec);
  stripOnCol.set(dark ? 0x24566b : 0x9fd8ea);
  const ec = dark ? 0x8b97a8 : 0x66788c;
  for (const m of edgeMats) m.color.set(ec);
  axisMat.color.set(ec);
  shelfMat.color.set(dark ? 0x1a2027 : 0xffffff);
  shelfMat.opacity = dark ? 0.9 : 0.75;
  panelMat.color.set(dark ? 0x0d1118 : 0xffffff);
  huffBarMat.color.set(dark ? 0x4cc9f0 : 0x1580a3);
  huffBarMat.emissive.set(dark ? 0x4cc9f0 : 0x1580a3);
  asciiBarMat.color.set(dark ? 0x6b7684 : 0x9aa7b8);
  bit1Col.set(dark ? 0x7fd0f7 : 0x0e9ac0);
  bit0Col.set(dark ? 0x24485e : 0xa9cfe0);
  asciiCol.set(dark ? 0x6b7684 : 0x9aa7b8);
  for (let i = 0; i < D.totalBits; i++) huffIM.setColorAt(i, D.huffBits[i] === '1' ? bit1Col : bit0Col);
  if (huffIM.instanceColor) huffIM.instanceColor.needsUpdate = true;
  for (let i = 0; i < D.asciiBits; i++) asciiIM.setColorAt(i, asciiCol);
  if (asciiIM.instanceColor) asciiIM.instanceColor.needsUpdate = true;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('哈夫曼编码 · 高频短码,低频长码', 'Huffman Coding · Short Codes for Frequent Letters');
  for (const r of [...labelReg, ...labelFixed]) r.cur = null;
  buildSteps();
  setPlayLabel();
  refreshLabels();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 步骤讲解 ================= */
const STEPS = [
  { b: '数频次', be: 'Count frequencies',
    d: '逐字扫描例句,数出每个字母出现的次数——频次就是它在算法里的「重量」。',
    de: 'Scan the sentence letter by letter — each letter\'s count is its weight in the algorithm.' },
  { b: '建树:合并最小的两个', be: 'Build: merge the two lightest',
    d: '每一步从森林里拎出频次最小的两个节点,合并成一个新父节点;最小的先合并,所以沉得最深。',
    de: 'Each step lifts the two least-frequent nodes out of the forest and merges them under a new parent — the lightest merge first, so they sink deepest.' },
  { b: '读出前缀码', be: 'Read off the prefix codes',
    d: '从根走到叶:向左记 0、向右记 1。高频字母离根近、码短;低频字母路径深、码长。',
    de: 'Walk root to leaf: left = 0, right = 1. Frequent letters sit shallow with short codes; rare ones get long paths.' },
  { b: '编码成比特流', be: 'Encode into a bitstream',
    d: `查表逐字替换,把原句写成 0/1 串——共 ${D.totalBits} bit,平均 ${(D.totalBits / D.n).toFixed(2)} bit/字。`,
    de: `Swap each letter for its code — ${D.totalBits} bits in total, ${(D.totalBits / D.n).toFixed(2)} per letter on average.` },
  { b: '与定长 ASCII 对比', be: 'Compare with fixed ASCII',
    d: `定长 8-bit 要 ${D.asciiBits} bit,Huffman 只要 ${D.totalBits} bit——省 ${SAVE}%,已贴近熵下限 ${(D.H * D.n).toFixed(1)} bit。`,
    de: `Fixed 8-bit ASCII costs ${D.asciiBits} bits; Huffman needs only ${D.totalBits} — ${SAVE}% saved, near the ${(D.H * D.n).toFixed(1)}-bit entropy bound.` },
];
const elSteps = document.getElementById('steps');
function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => seek(SEGS[i].t0));
    elSteps.appendChild(li);
  });
  syncSteps();
}
function syncSteps() {
  const i = segOf(T);
  [...elSteps.children].forEach((li, j) => li.classList.toggle('on', j === i));
}

/* ================= 时间轴状态函数(与 2D 版一致) ================= */
function segOf(T) { for (let i = 4; i >= 0; i--) if (T >= SEGS[i].t0) return i; return 0; }
function litSlots(T) {
  return segOf(T) === 0 ? Math.floor(eoi(T / SEGS[0].d) * D.slots.length) : D.slots.length;
}
function encState(T) {
  const seg = segOf(T);
  if (seg < 3) return { cdf: 0, prog: 0 };
  const prog = seg > 3 ? 1 : clamp((T - SEGS[3].t0) / SEGS[3].d, 0, 1);
  return { cdf: prog * D.n, prog };
}
function appearOf(nd, T) {
  if (nd.leaf) return 1;
  const seg = segOf(T);
  if (seg < 1) return 0;
  if (seg > 1) return 1;
  const mF = (T - SEGS[1].t0) / BEAT;
  if (nd.mi < Math.floor(mF)) return 1;
  if (nd.mi > Math.floor(mF)) return 0;
  return clamp((mF - nd.mi - 0.3) / 0.7, 0, 1);
}

/* ================= UI / 主循环 ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const elSeek = document.getElementById('seek'), elSeekVal = document.getElementById('seekVal');
const tglLabels = document.getElementById('tglLabels'), tglFreq = document.getElementById('tglFreq');
const tglRotate = document.getElementById('tglRotate');

function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.addEventListener('input', () => {
  speed = parseFloat(elSpeed.value);
  elSpeedVal.textContent = speed.toFixed(1) + '×';
});
let scrub = false;
elSeek.addEventListener('pointerdown', () => { scrub = true; });
addEventListener('pointerup', () => { scrub = false; });
elSeek.addEventListener('input', () => seek(elSeek.value / 1000 * TOTAL));
function seek(t2) { T = clamp(t2, 0, TOTAL - 0.01); }
const BOUNDS = [0, SEGS[1].t0];
for (let i = 1; i < D.merges.length; i++) BOUNDS.push(SEGS[1].t0 + i * BEAT);
for (let i = 2; i < 5; i++) BOUNDS.push(SEGS[i].t0);
function stepTo(dir) {
  playing = false; setPlayLabel();
  if (dir > 0) {
    const nx = BOUNDS.find(b => b > T + 1e-4);
    seek(nx === undefined ? 0 : nx);
  } else {
    const c = BOUNDS.filter(b => b < T - 1e-4);
    seek(c.length ? c[c.length - 1] : TOTAL - 0.01);
  }
}
document.getElementById('stepBtn').addEventListener('click', () => stepTo(1));
document.getElementById('replayBtn').addEventListener('click', () => { T = 0; playing = true; setPlayLabel(); });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; labelsOn = showLabels; });
tglFreq.addEventListener('change', () => { showFreq = tglFreq.checked; freqG.visible = showFreq; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => {
  const tg = e.target;
  if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'A')) return;
  if (tg && tg.tagName === 'BUTTON') tg.blur();
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); stepTo(1); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); stepTo(-1); }
});

function segLabel(T2) {
  const i = segOf(T2);
  const names = [L('数频次', 'count'), L('建树', 'build'), L('读码', 'codes'), L('编码', 'encode'), L('对比', 'compare')];
  let s = names[i];
  if (i === 1 && D.merges.length)
    s += ` ${Math.min(D.merges.length, Math.floor((T2 - SEGS[1].t0) / BEAT) + 1)}/${D.merges.length}`;
  return s;
}
function updateStats() {
  document.getElementById('stN').textContent = D.n;
  document.getElementById('stK').textContent = D.K;
  document.getElementById('stH').textContent = L(`${D.totalBits} bit · ${(D.totalBits / D.n).toFixed(2)}/字`,
    `${D.totalBits} bits · ${(D.totalBits / D.n).toFixed(2)}/char`);
  document.getElementById('stEnt').textContent = `${D.H.toFixed(2)}`;
  document.getElementById('stA').textContent = `${D.asciiBits} bit`;
  document.getElementById('stSave').textContent = `−${SAVE}%`;
  document.getElementById('stPf').textContent = D.pf ? '✓' : '✗';
}

/* ================= 每帧布局(原 render() 的 3D 版) ================= */
const UP = new THREE.Vector3(0, 1, 0);
const _d = new THREE.Vector3();
function setCyl(m, x1, y1, z1, x2, y2, z2) {
  _d.set(x2 - x1, y2 - y1, z2 - z1);
  const len = _d.length() || 1e-6;
  m.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
  m.scale.set(1, len, 1);
  m.quaternion.setFromUnitVectors(UP, _d.multiplyScalar(1 / len));
}
let lastPartial = -1;
function layout() {
  const seg = segOf(T), lit = litSlots(T), enc = encState(T);
  _seg = seg;
  /* --- 例句条:逐字点亮 / 当前字金色 --- */
  let li2 = 0;
  for (let i = 0; i < D.slots.length; i++) {
    const s = D.slots[i];
    if (!s.letter) continue;
    const m = slotMesh[i], mt = slotMat[i];
    const counted = i < lit;
    const isCur = seg === 0 && i === lit;
    const isEnc = seg >= 3 && li2 === Math.floor(enc.cdf) && enc.cdf < D.n;
    m.position.y = 0.56 + (isCur ? 0.07 : 0);
    if (isCur || isEnc) { mt.emissive.setHex(0xffd166); mt.emissiveIntensity = 0.55; mt.color.setHex(0x5a4a22); }
    else if (counted) { mt.emissive.setHex(0x4cc9f0); mt.emissiveIntensity = 0.22; mt.color.copy(stripOnCol); }
    else { mt.emissive.setHex(0x000000); mt.emissiveIntensity = 0; mt.color.copy(stripOffCol); }
    slotLbl[i].o.position.y = m.position.y;
    li2++;
  }
  /* --- 建树:合并节拍 / 拎起当前最轻的两个 --- */
  const mF = seg === 1 ? (T - SEGS[1].t0) / BEAT : D.merges.length;
  const mIdx = clamp(Math.floor(mF), 0, Math.max(D.merges.length - 1, 0));
  const sub = mF - Math.floor(mF);
  _sub = sub;
  const curPair = (seg === 1 && D.merges.length) ? D.merges[mIdx].kids : null;
  _curMerge = (seg === 1 && D.merges.length) ? D.merges[mIdx] : null;
  let lift = 0, glow = 0;
  if (curPair) {
    if (sub < 0.3) { lift = 0.16 * eoi(sub / 0.3); glow = 1; }
    else { lift = 0.16 * (1 - eoi((sub - 0.3) / 0.7)); glow = 1 - eoi((sub - 0.3) / 0.35); }
  }
  const inPair = nd => curPair && curPair.includes(nd);
  /* 叶子方块:大小随已数频次生长 */
  for (const nd of D.leaves) {
    let c2 = 0;
    for (const si of D.occ[nd.ch]) if (si < lit) c2++;
    nd._c2 = c2;
    const s = leafS(c2);
    const lf = inPair(nd) ? lift : 0;
    nd.cs = s; nd.cy = s / 2 + lf;
    nd.mesh.scale.set(s, s, s * 0.6);
    nd.mesh.position.set(nd.x, nd.cy, 0);
    const claimed = nd.par && appearOf(nd.par, T) > 0;
    nd.mat.opacity = claimed ? 0.38 : 0.88;
    if (inPair(nd) && glow > 0) { nd.mat.emissive.setHex(0xffd166); nd.mat.emissiveIntensity = 0.75 * glow; }
    else { nd.mat.emissive.setHex(0x4cc9f0); nd.mat.emissiveIntensity = 0.16; }
    nd.lblCh.o.position.set(nd.x, nd.cy, 0);
    /* 频次条(频次表) */
    const h = Math.max(0.02, 1.5 * c2 / D.maxF);
    nd.bar.scale.y = h;
    nd.bar.position.set(nd.x, 0, FREQ_Z);
    nd.barMat.opacity = (seg === 0 ? 1 : 0.42) * 0.9;
    nd.lblFreq.o.position.set(nd.x, h + 0.16, FREQ_Z);
  }
  /* 内部节点球:合并时从两个孩子之间升起 */
  for (const p of D.merges) {
    const ap = appearOf(p, T);
    p._ap = ap;
    const vis = ap > 0;
    p.mesh.visible = vis;
    p.edges[0].visible = vis; p.edges[1].visible = vis;
    if (!vis) continue;
    const ka = p.kids[0], kb = p.kids[1];
    const kYa = ka.leaf ? ka.cs : ka.cy, kYb = kb.leaf ? kb.cs : kb.cy;
    const py = lerp(Math.min(kYa, kYb) - 0.32, p.y, eoc(ap));
    p.cy = py;
    const r = D.rInner(p) * (0.5 + 0.5 * eoc(ap));
    p._r = r;
    p.mesh.scale.setScalar(r);
    p.mesh.position.set(p.x, py, 0);
    const done = ap >= 1;
    if (!done && glow > 0 && p === _curMerge) { p.mat.emissive.setHex(0xffd166); p.mat.emissiveIntensity = 0.8 * glow; }
    else if (p === D.root && done) { p.mat.emissive.setHex(0xffd166); p.mat.emissiveIntensity = 0.45; }
    else { p.mat.emissive.setHex(0x4cc9f0); p.mat.emissiveIntensity = 0.25; }
    p.mat.opacity = 0.35 + 0.4 * ap;
    p.kids.forEach((kd, k) => {
      const kyTop = kd.leaf ? kd.cs + (inPair(kd) ? lift : 0) : kd.cy + (kd._r || 0) * 0.55;
      setCyl(p.edges[k], p.x, py, 0, lerp(p.x, kd.x, ap), lerp(py, kyTop, ap), 0);
      p.edges[k].material.opacity = Math.min(1, ap * 2.5) * 0.9;
    });
    p.lblF.o.position.set(p.x, py + r + 0.15, 0);
  }
  /* 当前合并标注位置 */
  if (_curMerge) {
    const [ka, kb] = _curMerge.kids;
    lblMerge.o.position.set((ka.x + kb.x) / 2,
      Math.max(ka.leaf ? ka.cs : ka.cy, kb.leaf ? kb.cs : kb.cy) + 0.55, 0);
  }
  /* --- 读码:0/1 边标签 + 码表逐行 + 路径飘带 --- */
  const lt2 = T - SEGS[2].t0;
  if (seg >= 2) {
    for (const p of D.merges) {
      p._ba = clamp((lt2 - (0.2 + p.depth * 0.3)) / 0.35, 0, 1);
      p.bitLbl[0].o.element.style.opacity = p._ba;
      p.bitLbl[1].o.element.style.opacity = p._ba;
    }
    panelMesh.visible = true;
    panelMat.opacity = (THEME === 'dark' ? 0.5 : 0.65) * clamp(lt2 / 0.4, 0, 1);
    let hot = null, hotA = 0;
    for (const { r, lbl } of tableRows) {
      const ft = lt2 - (0.35 + r._i * stag);
      r._a = clamp(ft / 0.3, 0, 1);
      lbl.o.element.style.opacity = r._a;
      if (ft >= 0 && ft < 0.8) { hot = r.ch; hotA = 0.85 * (1 - Math.abs(ft - 0.3) / 0.5); }
    }
    _okA = clamp((lt2 - (0.35 + D.K * stag)) / 0.4, 0, 1);
    okLbl.o.element.style.opacity = _okA;
    _fa = clamp((lt2 - 1.2) / 0.6, 0, 1);
    fn1.o.element.style.opacity = _fa;
    fn2.o.element.style.opacity = _fa;
    if (hot) {
      const pts = D.paths[hot];
      let n = 0;
      for (const nd of pts) {
        ribbonPos[n * 3] = nd.x;
        ribbonPos[n * 3 + 1] = nd.leaf ? nd.cs : nd.cy;
        ribbonPos[n * 3 + 2] = 0.12;
        n++;
      }
      ribbonGeo.attributes.position.needsUpdate = true;
      ribbonGeo.setDrawRange(0, n);
      ribbon.material.opacity = hotA;
      ribbon.visible = true;
    } else ribbon.visible = false;
  } else {
    for (const p of D.merges) p._ba = 0;
    for (const { r } of tableRows) r._a = 0;
    _okA = 0; _fa = 0;
    panelMesh.visible = false;
    ribbon.visible = false;
  }
  /* --- 编码:比特方块逐个长出 --- */
  if (seg >= 3) {
    bitsG.visible = true;
    const hf = enc.prog * D.totalBits;
    const full = Math.floor(hf + 1e-6);
    const partial = hf - full > 1e-3 && full < D.totalBits;
    huffIM.count = partial ? full + 1 : Math.min(full, D.totalBits);
    if (partial) {
      if (lastPartial !== full && lastPartial >= 0) {
        _m.compose(_v.set(hX0 + (lastPartial + 0.5) * hCW, 0.62, BITS_Z), _q0, _s.set(hCW * 0.8, 0.11, 0.16));
        huffIM.setMatrixAt(lastPartial, _m);
      }
      const fr = clamp(hf - full, 0.15, 1);
      _m.compose(_v.set(hX0 + (full + 0.5) * hCW, 0.62, BITS_Z), _q0, _s.set(hCW * 0.8 * fr, 0.11 * fr, 0.16 * fr));
      huffIM.setMatrixAt(full, _m);
      huffIM.instanceMatrix.needsUpdate = true;
      lastPartial = full;
      cursor.visible = true;
      cursor.position.set(hX0 + (full + 0.5) * hCW, 0.62, BITS_Z);
    } else {
      if (lastPartial >= 0) {
        _m.compose(_v.set(hX0 + (lastPartial + 0.5) * hCW, 0.62, BITS_Z), _q0, _s.set(hCW * 0.8, 0.11, 0.16));
        huffIM.setMatrixAt(lastPartial, _m);
        huffIM.instanceMatrix.needsUpdate = true;
        lastPartial = -1;
      }
      cursor.visible = seg === 3 && full < D.totalBits;
      if (cursor.visible) cursor.position.set(hX0 + (full + 0.5) * hCW, 0.62, BITS_Z);
    }
    asciiIM.count = clamp(Math.ceil(enc.cdf * 8 - 1e-6), 0, D.asciiBits);
  } else {
    bitsG.visible = false;
    huffIM.count = 0;
    asciiIM.count = 0;
    cursor.visible = false;
    lastPartial = -1;
  }
  /* --- 对比:两根 3D 条 + 熵刻度 --- */
  if (seg >= 4) {
    cmpG.visible = true;
    const local = T - SEGS[4].t0;
    huffBar.scale.x = Math.max(eoc(local / 1.2) * huffLenF, 1e-4);
    asciiBar.scale.x = Math.max(eoc((local - 0.2) / 1.2) * CBW, 1e-4);
    _saveA = clamp((local - 1.35) / 0.35, 0, 1);
    saveLbl.o.element.style.opacity = _saveA;
    _floorOn = local > 2;
  } else {
    cmpG.visible = false;
    _saveA = 0;
    _floorOn = false;
  }
  /* 频次表整体淡出 */
  const fd = seg === 0 ? 1 : 0.55;
  for (const r of freqDim) r.o.element.style.opacity = fd;
  /* --- HUD --- */
  updateStats();
  if (!scrub) elSeek.value = Math.round(T / TOTAL * 1000);
  elSeekVal.textContent = `${segLabel(T)} ${T.toFixed(0)}s`;
  syncSteps();
  refreshLabels();
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) { T += dt * speed; if (T >= TOTAL) T -= TOTAL; }
  layout();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 初始化(URL 参数) ================= */
speed = clamp(qsFloat('speed', 1), 0.2, 4);
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
playing = !qsBool('pause', false);
if (!qs.get('pause') && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
if (!qsBool('labels', true)) { showLabels = false; labelsOn = false; tglLabels.checked = false; }
if (!qsBool('freq', true)) { showFreq = false; tglFreq.checked = false; freqG.visible = false; }
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
T = qs.get('t') === 'end' ? TOTAL - 0.01 : clamp(qsFloat('t', 0), 0, TOTAL - 0.01);
applyTheme();
applyLang();
layout();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '▴' : '▾';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
