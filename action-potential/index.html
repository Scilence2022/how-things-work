<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动作电位的原理 · 去极化 / 复极化动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d9a441;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b8771e;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .lbl.duo { white-space: normal; text-align: center; line-height: 1.35; border-radius: 10px;
    max-width: 200px; }
  .lbl.y { border-color: rgba(230,184,0,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(100,168,232,.9); color: #bcd8ff; }
  .lbl.g-open { border-color: rgba(126,226,174,.9); color: #b8f0d2; }
  .lbl.g-closed { border-color: rgba(154,167,184,.65); color: var(--text3); }
  .lbl.g-inact { border-color: rgba(255,138,138,.9); color: #ffc2c2; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.25); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 384px; height: 268px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px;
    display: flex; justify-content: space-between; align-items: center; }
  #plot h3 #vmPill { font-size: 12.5px; font-weight: 700; color: #ffb545; }
  :root[data-theme="light"] #plot h3 #vmPill { color: #b8771e; }
  #plotCv { width: 100%; height: calc(100% - 22px); display: block; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 356px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.na { color: #e6b800; border-color: rgba(230,184,0,.65); }
  .chip.k  { color: #64a8e8; border-color: rgba(100,168,232,.65); }
  .chip.vm { color: #ffcf8a; border-color: rgba(255,181,69,.55); }
  :root[data-theme="light"] .chip.vm { color: #c07f14; border-color: rgba(192,127,20,.55); }
  .chip.vm b { font-weight: 700; }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 5px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(217,164,65,.13); border-color: rgba(217,164,65,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(184,119,30,.08); border-color: rgba(184,119,30,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.42; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1250px) { #plot { width: 310px; height: 230px; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
    #plot { display: none; }
  }
</style>

<div id="app"></div>

<div id="title">
  <h1 data-zh="神经为什么能「放电」？—— 动作电位的去极化与复极化" data-en="Why can neurons “fire”? — Depolarization & repolarization of the action potential">神经为什么能「放电」？—— 动作电位的去极化与复极化</h1>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= URL 参数 / 工具 ================= */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const near = (a, b, r) => Math.abs(a - b) < r;
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';

/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

const scene = new THREE.Scene();
const floorMat = new THREE.MeshStandardMaterial({ color: 0x161c26, roughness: .95, metalness: 0 });
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ grid:'--cv-grid', axis:'--cv-axis', cursor:'--cv-cursor',
      dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const bg = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  scene.background = bg;
  scene.fog = new THREE.Fog(bg, 13, 30);
  floorMat.color.set(THEME === 'light' ? 0xd7dee9 : 0x161c26);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('动作电位的原理 · 去极化 / 复极化动画',
                     'Action Potential · Depolarization / Repolarization Animation');
  for (const r of labelRegistry) r.o.element.innerHTML = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 渲染器 / 场景 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0, 2.5, 9.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.12, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3.5;
controls.maxDistance = 20;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

const floor = new THREE.Mesh(new THREE.CylinderGeometry(4.9, 4.9, 0.08, 64), floorMat);
floor.position.y = -1.62;
scene.add(floor);

/* ================= 标签工具 ================= */
const labelRegistry = [];
function addLabel(htmlFn, pos, cls = '', parent = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  parent.add(o);
  labelRegistry.push({ o, text: htmlFn });
  div.innerHTML = htmlFn();
  return o;
}
function setPill(o, txt, cls) {
  if (o._t !== txt) { o._t = txt; o.element.textContent = txt; }
  if (o._c !== cls) { o._c = cls; o.element.className = 'lbl ' + cls; }
}

/* ================= 时序：膜电位曲线与通道门控 ================= */
const CYCLE = 14;
const KEYS = [[0,-70],[0.10,-70],[0.16,-56],[0.20,-52],[0.24,-20],[0.30,10],[0.36,30],
  [0.42,36],[0.48,32],[0.55,-2],[0.62,-45],[0.68,-78],[0.74,-82],[0.84,-80],[0.92,-73],[1.00,-70]];
function vmAt(tau) {
  tau = clamp(tau, 0, 1);
  let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1][0] < tau) i++;
  const p0 = KEYS[Math.max(0, i - 1)], p1 = KEYS[i], p2 = KEYS[i + 1], p3 = KEYS[Math.min(KEYS.length - 1, i + 2)];
  const s = (tau - p1[0]) / ((p2[0] - p1[0]) || 1), s2 = s * s, s3 = s2 * s;
  return 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * s + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * s2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * s3);
}
const mOpen = u => ss(0.185, 0.23, u) * (1 - ss(0.60, 0.70, u));   // Na 激活门
const hBall = u => ss(0.42, 0.50, u) * (1 - ss(0.70, 0.86, u));    // Na 失活球
const kOpen = u => ss(0.44, 0.58, u) * (1 - ss(0.70, 0.88, u));    // K 延迟门

/* ================= 场景布局常量 ================= */
const CH = { naX: -0.87, kX: 1.08, klX: -1.78, nlX: 2.05, pumpX: 2.87, stimX: -2.77 };

/* ================= 状态（标签之前声明） ================= */
let cycles = qsFloat('t', 0);
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = qsFloat('speed', 1);
let showLabels = qsBool('labels', true);
let showCharge = qsBool('charge', true);
let showRefr = qsBool('refr', true);
let tSim = 0, lastStep = -1;

/* ================= 磷脂双层（InstancedMesh） ================= */
function gapAt(x, z) {
  if ((near(x, CH.naX, .30) || near(x, CH.kX, .30)) && Math.abs(z) < .42) return true;
  if ((near(x, CH.klX, .15) || near(x, CH.nlX, .15)) && Math.abs(z) < .24) return true;
  if (near(x, CH.pumpX, .34) && Math.abs(z) < .28) return true;
  return false;
}
const lipPts = [];
for (let x = -4.0; x <= 4.01; x += 0.16)
  for (let z = -1.26; z <= 1.27; z += 0.18)
    if (!gapAt(x, z)) lipPts.push([x, z]);
const headMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.048, 8, 6),
  new THREE.MeshStandardMaterial({ color: 0xb28a60, roughness: .55 }), lipPts.length * 2);
const tailMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.022, 0.022, 0.17, 6),
  new THREE.MeshStandardMaterial({ color: 0x9a7a55, roughness: .6, transparent: true, opacity: .45 }), lipPts.length);
const dummy = new THREE.Object3D();
lipPts.forEach(([x, z], i) => {
  dummy.rotation.set(0, 0, 0);
  dummy.position.set(x, 0.10, z); dummy.updateMatrix(); headMesh.setMatrixAt(i * 2, dummy.matrix);
  dummy.position.set(x, -0.10, z); dummy.updateMatrix(); headMesh.setMatrixAt(i * 2 + 1, dummy.matrix);
  dummy.position.set(x, 0, z); dummy.rotation.z = i % 2 ? 0.1 : -0.1;
  dummy.updateMatrix(); tailMesh.setMatrixAt(i, dummy.matrix);
});
scene.add(headMesh, tailMesh);

/* ================= 通道 / 泵 / 电极（几何） ================= */
function stdMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: .4, metalness: .1,
    emissive: color, emissiveIntensity: .08, transparent: true, ...opts });
}
function barrel(x, color, r = 0.17) {
  const g = new THREE.Group(); g.position.set(x, 0, 0);
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.6, 24, 1, true),
    stdMat(color, { opacity: .5, side: THREE.DoubleSide, depthWrite: false }));
  const pore = new THREE.Mesh(new THREE.CylinderGeometry(r * .62, r * .62, 0.62, 20, 1, true),
    stdMat(0x232a36, { opacity: .6, side: THREE.DoubleSide, depthWrite: false, emissiveIntensity: 0 }));
  const mkRing = y => {
    const t = new THREE.Mesh(new THREE.TorusGeometry(r + .015, .03, 10, 36), stdMat(0x55647a, { opacity: .95 }));
    t.position.y = y; return t;
  };
  g.add(tube, pore, mkRing(0.3), mkRing(-0.3));
  scene.add(g);
  return g;
}

function ionPool(count, color) {
  const im = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 10, 8),
    stdMat(color, { emissiveIntensity: .55, roughness: .3 }), count);
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  im.frustumCulled = false;
  scene.add(im);
  const arr = [];
  for (let i = 0; i < count; i++) arr.push({ on: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 });
  return { im, arr, dummy: new THREE.Object3D() };
}
const naPool = ionPool(110, 0xffd54f), kPool = ionPool(110, 0x64b5f6);
function spawn(pool, mk) {
  const p = pool.arr.find(o => !o.on);
  if (p) Object.assign(p, mk, { on: true });
}
function stepPool(pool, dt) {
  for (let i = 0; i < pool.arr.length; i++) {
    const p = pool.arr[i];
    if (p.on) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.y > 0.85 || p.y < -0.95) p.on = false;
    }
    const d = pool.dummy;
    d.position.set(p.x, p.y, p.z);
    d.scale.setScalar(p.on ? 1 : 0.0001);
    d.updateMatrix();
    pool.im.setMatrixAt(i, d.matrix);
  }
  pool.im.instanceMatrix.needsUpdate = true;
}

/* ================= 每帧世界更新 ================= */
function updateWorld(t, dt) {
  const V = vmAt(t), m = mOpen(t), h = hBall(t), k = kOpen(t);
  const gNa = m * (1 - h), gK = k;
  // Na 通道：激活门 + 失活球
  gateNa.position.y = lerp(-0.31, -0.50, m);
  gateNa.material.opacity = 1 - 0.55 * m;
  ball.position.set(lerp(CH.naX + 0.17, CH.naX, h), lerp(-0.52, -0.20, h), 0);
  ball.scale.setScalar(1 + 0.05 * Math.sin(tSim * 3));
  setChain(chainA, ball.position);
  // K 通道：延迟门
  gateK.position.y = lerp(-0.31, -0.50, k);
  gateK.material.opacity = 1 - 0.55 * k;
  // 状态胶囊
  setPill(pillNa, h > 0.6 ? L('失活', 'inactive') : m > 0.6 ? L('开放', 'open') : L('关闭', 'closed'),
    h > 0.6 ? 'g-inact' : m > 0.6 ? 'g-open' : 'g-closed');
  setPill(pillK, k > 0.5 ? L('开放', 'open') : L('关闭', 'closed'), k > 0.5 ? 'g-open' : 'g-closed');
  // 刺激电极
  const stim = ss(0.10, 0.125, t) * (1 - ss(0.18, 0.20, t));
  stimG.visible = stim > 0.01;
  boltMat.opacity = stim;
  const rp = (tSim * 1.4) % 1;
  stimRing.scale.setScalar(0.5 + rp * 1.6);
  ringMat.opacity = 0.55 * (1 - rp) * stim;
  lblStim.element.style.opacity = stim;
  // 膜电荷符号（去极化时内外翻转）
  const inPos = ss(-45, -15, V);
  topPlus.mat.opacity  = 0.28 + 0.4 * (1 - inPos);
  topMinus.mat.opacity = 0.28 + 0.4 * inPos;
  botPlus.mat.opacity  = 0.28 + 0.4 * inPos;
  botMinus.mat.opacity = 0.28 + 0.4 * (1 - inPos);
  lblOv.element.style.opacity = (t > 0.22 && t < 0.30 && showCharge) ? 1 - ss(0.26, 0.30, t) : 0;
  // 泵：3Na⁺出 / 2K⁺入（暂停时仍在循环 → 稳态通量保留）
  pumpNa.forEach((d, i) => { d.position.y = lerp(-0.5, 0.5, (tSim / 4 + i / 3) % 1); });
  pumpK.forEach((d, i) => { d.position.y = lerp(0.5, -0.5, (tSim / 4 + 0.5 + i / 2) % 1); });
  // 离子通量（暂停时按冻结的闸门状态继续 → 稳态通量保留）
  if (Math.random() < gNa * dt * 42)
    spawn(naPool, { x: CH.naX + rnd(-0.05, 0.05), y: rnd(0.5, 0.6), z: rnd(-0.06, 0.06), vx: 0, vy: -rnd(1.5, 1.9), vz: 0 });
  if (Math.random() < gK * dt * 40)
    spawn(kPool, { x: CH.kX + rnd(-0.05, 0.05), y: rnd(-0.6, -0.5), z: rnd(-0.06, 0.06), vx: 0, vy: rnd(1.5, 1.9), vz: 0 });
  if (Math.random() < dt * 7)
    spawn(kPool, { x: CH.klX + rnd(-0.03, 0.03), y: -0.55, z: rnd(-0.04, 0.04), vx: 0, vy: 0.51, vz: 0 });
  if (Math.random() < dt * 3.2)
    spawn(naPool, { x: CH.nlX + rnd(-0.03, 0.03), y: 0.55, z: rnd(-0.04, 0.04), vx: 0, vy: -0.32, vz: 0 });
  stepPool(naPool, dt);
  stepPool(kPool, dt);
  // HUD
  drawPlot(t);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let rafId = 0;
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);
  tSim += dt;
  if (playing) cycles += dt * speed / CYCLE;
  const t = cycles - Math.floor(cycles);

  updateWorld(t, dt);

  const si = stepIndex(t);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { clock.getDelta(); rafId = requestAnimationFrame(frame); }
});

applyTheme();
applyLang();
setPlayLabel();
rafId = requestAnimationFrame(frame);
</script>
