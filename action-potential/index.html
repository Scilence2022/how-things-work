<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动作电位的原理 · 去极化 / 复极化动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d9a441;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b8771e;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }

  /* ===== 工具条（全站共享模式） ===== */
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 356px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.na { color: #e6b800; border-color: rgba(230,184,0,.65); }
  .chip.k  { color: #64a8e8; border-color: rgba(100,168,232,.65); }
  .chip.vm { color: #ffcf8a; border-color: rgba(255,181,69,.55); }
  :root[data-theme="light"] .chip.vm { color: #c07f14; border-color: rgba(192,127,20,.55); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 5px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(217,164,65,.13); border-color: rgba(217,164,65,.5); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.42; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="神经为什么能「放电」？—— 动作电位的去极化与复极化" data-en="Why can neurons “fire”? — Depolarization & repolarization of the action potential">神经为什么能「放电」？—— 动作电位的去极化与复极化</h1>
  <div class="sub" data-zh="上：膜电位示波器　下：同一时刻膜上通道的闸门与离子流 · 相位完全同步 · 空格播放/暂停" data-en="Top: membrane-voltage oscilloscope. Bottom: channel gates and ion flows at the same instant, perfectly in phase · Space = play/pause">上：膜电位示波器　下：同一时刻膜上通道的闸门与离子流 · 相位完全同步 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip na" data-zh="Na⁺（内流·黄）" data-en="Na⁺ (influx · yellow)">Na⁺（内流·黄）</span>
    <span class="chip k" data-zh="K⁺（外流·蓝）" data-en="K⁺ (efflux · blue)">K⁺（外流·蓝）</span>
    <span class="chip vm" data-zh="膜电位 Vm" data-en="Membrane Vm">膜电位 Vm</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标注" data-en="Labels">标注</span></label>
    <label><input id="tglCharge" type="checkbox" checked> <span data-zh="膜电荷符号" data-en="Charge signs">膜电荷符号</span></label>
    <label><input id="tglRefr" type="checkbox" checked> <span data-zh="不应期标尺" data-en="Refractory bar">不应期标尺</span></label>
  </div>
</div>

<script>
'use strict';
/* ================= URL 参数 ================= */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('动作电位的原理 · 去极化 / 复极化动画',
                     'Action Potential · Depolarization / Repolarization Animation');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布 ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}

/* ================= 时序：膜电位曲线与通道门控 ================= */
const CYCLE = 14;
// Vm 关键帧（相位, mV）
const KEYS = [[0,-70],[0.10,-70],[0.16,-56],[0.20,-52],[0.24,-20],[0.30,10],[0.36,30],
  [0.42,36],[0.48,32],[0.55,-2],[0.62,-45],[0.68,-78],[0.74,-82],[0.84,-80],[0.92,-73],[1.00,-70]];
function vmAt(tau) {
  tau = clamp(tau, 0, 1);
  let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1][0] < tau) i++;
  const p0 = KEYS[Math.max(0, i - 1)], p1 = KEYS[i], p2 = KEYS[i + 1], p3 = KEYS[Math.min(KEYS.length - 1, i + 2)];
  const s = (tau - p1[0]) / ((p2[0] - p1[0]) || 1), s2 = s * s, s3 = s2 * s;
  return 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * s + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * s2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * s3);
}
// 门控状态
const mOpen = u => ss(0.185, 0.23, u) * (1 - ss(0.60, 0.70, u));   // Na 激活门
const hBall = u => ss(0.42, 0.50, u) * (1 - ss(0.70, 0.86, u));    // Na 失活球
const kOpen = u => ss(0.44, 0.58, u) * (1 - ss(0.70, 0.88, u));    // K 延迟门

/* ================= 相位讲解 ================= */
const STEPS = [
  { t0: 0.00, t1: 0.10, n: 1, b: '静息电位 −70 mV', d: '钠钾泵与漏通道维持「内负外正」的极化状态；Na⁺ 通道关闭待命。',
    be: 'Resting potential −70 mV', de: 'The Na⁺/K⁺ pump and leak channels keep the inside negative; Na⁺ channels are closed but ready.' },
  { t0: 0.10, t1: 0.20, n: 2, b: '阈上刺激 → 阈电位', d: '刺激电流使膜电位去极化；跨过 −55 mV 阈值的瞬间，正反馈被点燃。',
    be: 'Suprathreshold stimulus → threshold', de: 'Stimulus current depolarizes the membrane; the instant it crosses the −55 mV threshold, positive feedback ignites.' },
  { t0: 0.20, t1: 0.44, n: 3, b: '去极化 · Na⁺ 内流', d: '电压门控 Na⁺ 通道激活开放，Na⁺ 涌入使膜内变正，电位飙升至 +36 mV。',
    be: 'Depolarization · Na⁺ influx', de: 'Voltage-gated Na⁺ channels open; Na⁺ rushes in, driving the interior positive up to +36 mV.' },
  { t0: 0.44, t1: 0.56, n: 4, b: '峰值 · Na⁺ 失活', d: '失活球（球-链闸门）堵住 Na⁺ 通道；K⁺ 通道延迟开放，内流戛然而止。',
    be: 'Peak · Na⁺ inactivation', de: 'The inactivation ball (ball-and-chain gate) plugs Na⁺ channels; delayed K⁺ channels open and the influx stops.' },
  { t0: 0.56, t1: 0.72, n: 5, b: '复极化 · K⁺ 外流', d: 'K⁺ 顺浓度梯度涌出，膜电位迅速跌落，回到负值。',
    be: 'Repolarization · K⁺ efflux', de: 'K⁺ pours out down its gradient and the voltage quickly falls back below zero.' },
  { t0: 0.72, t1: 0.86, n: 6, b: '超极化（后电位）', d: 'K⁺ 通道关闭滞后，电位跌破静息至 −80 mV —— 进入相对不应期。',
    be: 'Hyperpolarization (after-potential)', de: 'K⁺ channels close late, undershooting to −80 mV — the relative refractory period.' },
  { t0: 0.86, t1: 1.00, n: 7, b: '回复静息 · 闸门复位', d: '失活球退回、激活门关闭；泵与漏通道慢慢恢复 Na⁺/K⁺ 梯度，可再次兴奋。',
    be: 'Back to rest · gates reset', de: 'The inactivation ball retracts and activation gates close; pump and leaks restore the Na⁺/K⁺ gradients for the next spike.' },
];
function stepIndex(t) {
  for (let i = 0; i < STEPS.length; i++) if (t >= STEPS[i].t0 && t < STEPS[i].t1) return i;
  return STEPS.length - 1;
}

/* ================= 状态 / UI ================= */
let cycles = qsFloat('t', 0);
let playing = !qsBool('pause', false);
let speed = qsFloat('speed', 1);
let showLabels = qsBool('labels', true);
let showCharge = qsBool('charge', true);
let showRefr = qsBool('refr', true);

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglCharge = document.getElementById('tglCharge');
const tglRefr = document.getElementById('tglRefr');

function buildSteps() {
  elSteps.innerHTML = '';
  for (const s of STEPS) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${s.n}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.002; });
    elSteps.appendChild(li);
  }
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglLabels.checked = showLabels; tglCharge.checked = showCharge; tglRefr.checked = showRefr;
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglCharge.addEventListener('change', () => { showCharge = tglCharge.checked; });
tglRefr.addEventListener('change', () => { showRefr = tglRefr.checked; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });

/* ================= 图形映射 ================= */
const GX0 = 96, GX1 = 1556, GY0 = 84, GY1 = 466;      // 示波器区域
const xT = u => lerp(GX0, GX1, u);
const yV = v => lerp(GY1, GY0, (v + 90) / 140);       // +50mV→GY0, -90mV→GY1

/* ================= 粒子（离子流） ================= */
const dots = [];
function spawnDot(ch, dt) {
  if (dots.length > 90) return;
  if (ch === 'naIn'  && Math.random() < gNaNow * dt * 42) dots.push({ x: 640 + Math.random() * 16 - 8, y: 622, vy: 300 + Math.random() * 90, c: 'na' });
  if (ch === 'kOut'  && Math.random() < gKNow * dt * 40)  dots.push({ x: 1000 + Math.random() * 16 - 8, y: 828, vy: -(300 + Math.random() * 90), c: 'k' });
  if (ch === 'kleak' && Math.random() < dt * 7)           dots.push({ x: 470 + Math.random() * 10 - 5, y: 828, vy: -95, c: 'k' });
  if (ch === 'naleak'&& Math.random() < dt * 3.2)         dots.push({ x: 1180 + Math.random() * 10 - 5, y: 622, vy: 60, c: 'na' });
}
function stepDots(dt) {
  for (let i = dots.length - 1; i >= 0; i--) {
    const d = dots[i]; d.y += d.vy * dt;
    if (d.y < 596 || d.y > 850) dots.splice(i, 1);
  }
}
let gNaNow = 0, gKNow = 0;

/* ================= 示波器 ================= */
function drawScope(t) {
  // 网格与参考线
  const refs = [[36, '+36'], [0, '0'], [-55, '−55'], [-70, '−70'], [-90, '−90']];
  for (const [v, lb] of refs) {
    const y = yV(v);
    if (v === -55) line(GX0, y, GX1, y, 'rgba(255,181,69,.5)', 1.4, [7, 7]);
    else if (v === -70) line(GX0, y, GX1, y, PAL.dim, 1.2, [3, 6]);
    else line(GX0, y, GX1, y, PAL.grid, 1);
    text(lb + (v === -55 ? L(' 阈', ' thr') : v === -70 ? L(' 静息', ' rest') : ''), GX0 - 8, y + 4, 11.5, v === -55 ? '#ffb545' : PAL.dim, 'right');
  }
  // 时间轴
  line(GX0, GY1, GX1 + 18, GY1, PAL.axis, 1.5);
  ctx.beginPath(); ctx.moveTo(GX1 + 18, GY1); ctx.lineTo(GX1 + 8, GY1 - 5); ctx.lineTo(GX1 + 8, GY1 + 5); ctx.closePath();
  ctx.fillStyle = PAL.axis; ctx.fill();
  text(L('时间 →（一个周期 = 一次动作电位）', 'time → (one cycle = one action potential)'), GX1 - 10, GY1 + 52, 12, PAL.dim, 'right');

  // 曲线区域底色（去极化区淡红 / 超极化区淡蓝）
  const baseY = yV(-70);
  const region = (fill, above) => {
    ctx.beginPath();
    for (let s = 0; s <= 400; s++) {
      const u = s / 400, x = xT(u), y = yV(vmAt(u));
      s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.lineTo(xT(1), baseY); ctx.lineTo(xT(0), baseY); ctx.closePath();
    ctx.save(); ctx.beginPath(); ctx.rect(GX0, above ? GY0 - 10 : baseY, GX1 - GX0 + 20, above ? baseY - GY0 + 10 : GY1 - baseY + 10);
    ctx.clip(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
  };
  region('rgba(255,110,84,.10)', true);
  region('rgba(96,165,250,.12)', false);

  // 幽灵全曲线 + 已扫描亮线
  ctx.beginPath();
  for (let s = 0; s <= 400; s++) { const u = s / 400, x = xT(u), y = yV(vmAt(u)); s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.strokeStyle = 'rgba(255,181,69,.15)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath();
  for (let s = 0; s <= 400 * t; s++) { const u = s / 400, x = xT(u), y = yV(vmAt(u)); s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.save(); ctx.shadowColor = 'rgba(255,181,69,.85)'; ctx.shadowBlur = 12;
  ctx.strokeStyle = '#ffb545'; ctx.lineWidth = 3.5; ctx.stroke(); ctx.restore();

  // 游标
  const cxp = xT(t), cyp = yV(vmAt(t)), V = vmAt(t);
  line(cxp, GY0 - 6, cxp, GY1, PAL.cursor, 1);
  ctx.beginPath(); ctx.arc(cxp, cyp, 5.5, 0, 7); ctx.fillStyle = '#ffb545'; ctx.fill();
  ctx.beginPath(); ctx.arc(cxp, cyp, 10 + 3 * Math.sin(performance.now() / 240), 0, 7);
  ctx.strokeStyle = 'rgba(255,181,69,.5)'; ctx.lineWidth = 1.6; ctx.stroke();
  text(`${V > 0 ? '+' : ''}${V.toFixed(0)} mV`, cxp + 12, cyp - 10, 13, '#ffd9a0', 'left', 600);

  // 阈值触发标记
  if (t > 0.18 && t < 0.30) {
    const a = 1 - ss(0.26, 0.30, t);
    ctx.beginPath(); ctx.arc(xT(0.20), yV(-55), 6 + 26 * ss(0.20, 0.26, t), 0, 7);
    ctx.strokeStyle = `rgba(255,181,69,${0.8 * a})`; ctx.lineWidth = 2; ctx.stroke();
    text(L('达到阈电位！', 'Threshold reached!'), xT(0.20) + 16, yV(-55) - 12, 12.5, `rgba(255,197,120,${a})`);
  }
  // 阶段标注
  if (showLabels) {
    text(L('去极化：Na⁺ 涌入', 'Depolarization: Na⁺ in'), xT(0.295), yV(16) - 46, 13, '#ffd0a0', 'center', 600);
    text(L('复极化：K⁺ 外流', 'Repolarization: K⁺ out'), xT(0.575), yV(-8) - 60, 13, '#a8ccf5', 'center', 600);
    text(L('超极化', 'Hyperpolarization'), xT(0.755), yV(-82) + 26, 12.5, PAL.dim2, 'center');
  }
  // 不应期标尺
  if (showRefr) {
    const Y = GY1 + 14, Hh = 18;
    rrect(xT(0.42), Y, xT(0.66) - xT(0.42), Hh, 9, 'rgba(255,93,93,.14)', 'rgba(255,93,93,.5)', 1);
    text(L('绝对不应期（Na⁺ 失活中）', 'Absolute refractory (Na⁺ inactivated)'), (xT(0.42) + xT(0.66)) / 2, Y + 13, 10.5, '#ff9d9d', 'center');
    rrect(xT(0.66), Y, xT(0.90) - xT(0.66), Hh, 9, 'rgba(255,181,69,.10)', 'rgba(255,181,69,.42)', 1);
    text(L('相对不应期（超极化）', 'Relative refractory (hyperpolarized)'), (xT(0.66) + xT(0.90)) / 2, Y + 13, 10.5, '#ffcf8a', 'center');
  }
}

/* ================= 膜片场景 ================= */
const MEM_T = 690, MEM_B = 740;
function drawMembrane() {
  for (let x = 60; x <= 1540; x += 26) {
    if (Math.abs(x - 640) < 34 || Math.abs(x - 1000) < 34 || Math.abs(x - 1330) < 62 || Math.abs(x - 470) < 16 || Math.abs(x - 1180) < 16) continue;
    ctx.beginPath(); ctx.arc(x, MEM_T + 8, 6.5, 0, 7); ctx.fillStyle = 'rgba(178,138,96,.7)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, MEM_B - 8, 6.5, 0, 7); ctx.fillStyle = 'rgba(178,138,96,.7)'; ctx.fill();
    for (const dx of [-2.5, 2.5]) {
      ctx.beginPath(); ctx.moveTo(x + dx, MEM_T + 18);
      for (let y = MEM_T + 18; y <= MEM_B - 18; y += 16) ctx.lineTo(x + dx + ((y / 16) % 2 ? 4 : -4), y + 8);
      ctx.strokeStyle = 'rgba(178,138,96,.26)'; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  text(L('细胞外（Na⁺ 高）', 'Extracellular (high Na⁺)'), 70, 620, 14, PAL.dim2, 'left', 600);
  text(L('细胞内（K⁺ 高 · 负）', 'Intracellular (high K⁺ · negative)'), 70, 862, 14, PAL.dim2, 'left', 600);
}
function barrel(cx, color = '#55647a') {
  rrect(cx - 31, 640, 13, 148, 6, color, 'rgba(255,255,255,.16)', 1.2);
  rrect(cx + 18, 640, 13, 148, 6, color, 'rgba(255,255,255,.16)', 1.2);
}
function gateBar(cx, open) {           // 底部滑门：关闭=横在孔道上，开放=滑下淡出
  const y = lerp(752, 796, open);
  ctx.globalAlpha = 1 - 0.55 * open;
  rrect(cx - 21, y, 42, 7, 3.5, '#c9d4e2', 'rgba(0,0,0,.4)', 1);
  ctx.globalAlpha = 1;
}
function statePill(cx, y, txt, color) {
  ctx.font = `700 11px ${FONT}`;
  const w = ctx.measureText(txt).width + 16;
  rrect(cx - w / 2, y - 13, w, 18, 9, PAL.pill, color + '88', 1);
  text(txt, cx, y, 11, color, 'center', 700);
}
function drawChannels(t, simT) {
  const m = mOpen(t), h = hBall(t), k = kOpen(t);
  gNaNow = m * (1 - h); gKNow = k;
  // --- Na 通道 ---
  barrel(640, '#6d5b7a');
  gateBar(640, m);
  // 失活球（球-链）
  const bx = lerp(640 + 30, 640, h), by = lerp(806, 716, h);
  ctx.beginPath(); ctx.moveTo(640 + 22, 784); ctx.quadraticCurveTo(640 + 30, 800, bx + 4, by + 8);
  ctx.strokeStyle = 'rgba(220,200,235,.55)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(bx, by, 9.5, 0, 7); ctx.fillStyle = '#c9a2e8'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.2; ctx.stroke();
  if (showLabels) {
    text(L('电压门控 Na⁺ 通道', 'Voltage-gated Na⁺ channel'), 640, 866, 12, PAL.text, 'center');
    text(L('激活门 m · 失活球 h', 'activation gate m · inactivation ball h'), 640, 884, 11, PAL.dim2, 'center');
  }
  if (h > 0.6) statePill(640, 630, L('失活', 'inactive'), '#ff8a8a');
  else if (m > 0.6) statePill(640, 630, L('开放', 'open'), '#7ee2ae');
  else statePill(640, 630, L('关闭', 'closed'), PAL.dim2);
  // --- K 通道 ---
  barrel(1000, '#4f6d8a');
  gateBar(1000, k);
  if (showLabels) {
    text(L('电压门控 K⁺ 通道', 'Voltage-gated K⁺ channel'), 1000, 866, 12, PAL.text, 'center');
    text(L('延迟开放（缓慢）', 'delayed opening (slow)'), 1000, 884, 11, PAL.dim2, 'center');
  }
  statePill(1000, 630, k > 0.5 ? L('开放', 'open') : L('关闭', 'closed'), k > 0.5 ? '#7ee2ae' : PAL.dim2);
  // --- 漏通道 ---
  barrel(470, '#46536a'); if (showLabels) text(L('K⁺ 漏通道', 'K⁺ leak channel'), 470, 866, 11.5, PAL.dim2, 'center');
  barrel(1180, '#46536a'); if (showLabels) text(L('Na⁺ 微漏', 'Na⁺ slight leak'), 1180, 866, 11.5, PAL.dim2, 'center');
  // --- 钠钾泵（常驻，维持梯度） ---
  const pg = ctx.createLinearGradient(0, 640, 0, 790);
  pg.addColorStop(0, '#41618f'); pg.addColorStop(1, '#31465f');
  rrect(1276, 646, 108, 140, [26, 26, 34, 34], pg, 'rgba(255,255,255,.2)', 1.5);
  for (let i = 0; i < 3; i++) {
    const f = (simT / 4 + i / 3) % 1;
    ctx.beginPath(); ctx.arc(1306, lerp(820, 610, f), 6.5, 0, 7);
    ctx.fillStyle = 'rgba(255,213,79,.85)'; ctx.fill();
  }
  for (let i = 0; i < 2; i++) {
    const f = (simT / 4 + 0.5 + i / 2) % 1;
    ctx.beginPath(); ctx.arc(1352, lerp(610, 820, f), 6.5, 0, 7);
    ctx.fillStyle = 'rgba(100,181,246,.85)'; ctx.fill();
  }
  if (showLabels) { text(L('Na⁺/K⁺ 泵', 'Na⁺/K⁺ pump'), 1330, 866, 12, PAL.text, 'center'); text(L('持续 3Na⁺出 / 2K⁺入', 'steady 3 Na⁺ out / 2 K⁺ in'), 1330, 884, 11, PAL.dim2, 'center'); }
  // --- 刺激电极 ---
  const stim = ss(0.10, 0.125, t) * (1 - ss(0.18, 0.20, t));
  if (stim > 0.01) {
    rrect(232, 636, 22, 40, 5, '#d9a441', 'rgba(0,0,0,.4)', 1.2);
    rrect(232, 754, 22, 40, 5, '#d9a441', 'rgba(0,0,0,.4)', 1.2);
    line(243, 676, 243, 754, 'rgba(217,164,65,.6)', 2.5);
    ctx.save(); ctx.globalAlpha = stim;
    ctx.beginPath(); ctx.moveTo(300, 634); ctx.lineTo(322, 686); ctx.lineTo(308, 690); ctx.lineTo(330, 736);
    ctx.lineTo(316, 738); ctx.lineTo(332, 780); ctx.lineTo(306, 742); ctx.lineTo(318, 738); ctx.lineTo(298, 692); ctx.lineTo(312, 688); ctx.closePath();
    ctx.fillStyle = '#ffe08a'; ctx.fill();
    const rp = (simT * 1.4) % 1;
    ctx.beginPath(); ctx.arc(300, 700, 30 + rp * 90, -0.9, 0.9);
    ctx.strokeStyle = `rgba(255,224,138,${0.55 * (1 - rp)})`; ctx.lineWidth = 3; ctx.stroke();
    text(L('阈上刺激', 'suprathreshold stimulus'), 340, 616, 13, '#ffe08a', 'left', 600);
    ctx.restore();
  }
  // --- 膜电荷符号 ---
  if (showCharge) {
    const V = vmAt(t);
    const inPos = ss(-45, -15, V);       // 膜内变正的程度
    for (let x = 420; x <= 1240; x += 46) {
      if (Math.abs(x - 640) < 40 || Math.abs(x - 1000) < 40) continue;
      ctx.globalAlpha = 0.28 + 0.4 * (1 - inPos);
      text('−', x, MEM_B + 42, 17, '#8fb6e8', 'center', 700);   // 内负
      ctx.globalAlpha = 0.28 + 0.4 * inPos;
      text('+', x, MEM_B + 42, 17, '#ffd54f', 'center', 700);   // 内正（去极化）
      ctx.globalAlpha = 0.28 + 0.4 * inPos;
      text('−', x, MEM_T - 14, 17, '#8fb6e8', 'center', 700);   // 外负（去极化时）
      ctx.globalAlpha = 0.28 + 0.4 * (1 - inPos);
      text('+', x, MEM_T - 14, 17, '#ffd54f', 'center', 700);
      ctx.globalAlpha = 1;
    }
    if (t > 0.22 && t < 0.30) text(L('反极化：内正外负！', 'Overshoot: inside positive!'), 830, 636, 12.5, `rgba(255,213,79,${1 - ss(0.26, 0.30, t)})`, 'center', 600);
  }
}

/* ================= 主绘制 ================= */
let simT = 0;
function draw(t, dt) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(800, 300, 60, 800, 400, 900);
  g.addColorStop(0, 'rgba(217,164,65,0.045)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  gNaNow = 0; gKNow = 0;
  drawMembrane();
  drawChannels(t, simT);
  spawnDot('naIn', dt); spawnDot('kOut', dt); spawnDot('kleak', dt); spawnDot('naleak', dt);
  stepDots(dt);
  for (const d of dots) {
    ctx.beginPath(); ctx.arc(d.x, d.y, 5, 0, 7);
    ctx.fillStyle = d.c === 'na' ? 'rgba(255,213,79,.9)' : 'rgba(100,181,246,.9)'; ctx.fill();
  }
  drawScope(t);
  text(L('膜片放大（与上方游标同步）', 'Membrane close-up (synced with the cursor above)'), 96, 592, 12.5, PAL.dim);
}

/* ================= 主循环 ================= */
let lastStep = -1, last = performance.now();
applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  simT += dt;
  if (playing) cycles += dt * speed / CYCLE;
  const t = cycles - Math.floor(cycles);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(t, dt);

  const si = stepIndex(t);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';
}
requestAnimationFrame(frame);
</script>
