<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核电站 · 可控链式反应,k 钉在 1</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#3bc9db;
    --bg:#0e1218; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0b7285;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.a { border-color: rgba(59,201,219,.9); color: #99e9f2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.bad { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  :root[data-theme="light"] .lbl.a { border-color: rgba(11,114,133,.9); color: #0b7285; }
  :root[data-theme="light"] .lbl.bad { border-color: rgba(224,49,49,.9); color: #e03131; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #alarm { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 6;
    display: none; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 999px;
    background: rgba(224,49,49,.16); border: 1px solid rgba(255,107,107,.75); color: #ffa8a8;
    font-size: 13px; font-weight: 700; letter-spacing: 1px; backdrop-filter: blur(6px);
    animation: blink 1s steps(2) infinite; }
  :root[data-theme="light"] #alarm { color: #c92a2a; }
  @keyframes blink { 50% { opacity: .55; } }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #69db7c; }
  #stats .v.b { color: #74c0fc; }
  #stats .v.r { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.f { color: #dee2e6; border-color: rgba(173,181,189,.7); }
  .chip.c { color: #d0bfff; border-color: rgba(177,151,252,.7); }
  .chip.n { color: #ffd8a8; border-color: rgba(255,169,77,.7); }
  .chip.t { color: #99e9f2; border-color: rgba(59,201,219,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(59,201,219,.12); color: var(--text); border: 1px solid rgba(59,201,219,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(59,201,219,.26); }
  .abtn.warn { background: rgba(224,49,49,.14); border-color: rgba(255,107,107,.65); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 68px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(59,201,219,.10); border-color: rgba(59,201,219,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(11,114,133,.08); border-color: rgba(11,114,133,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #99e9f2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="核电站:可控链式反应,k 钉在 1" data-en="Nuclear Reactor: a chain reaction pinned at k = 1">核电站:可控链式反应,k 钉在 1</h1>
  <div class="sub" data-zh="每次裂变放 2~3 个中子;慢化剂把它们刹到热速,控制棒吃掉多余的,让倍增系数 k 恰好=1 · 空格播放/暂停" data-en="Each fission frees 2–3 neutrons; the moderator brakes them, control rods eat the surplus, and the multiplication factor k sits exactly at 1 · Space = play/pause">每次裂变放 2~3 个中子;慢化剂把它们刹到热速,控制棒吃掉多余的,让倍增系数 k 恰好=1 · 空格播放/暂停</div>
</div>

<div id="alarm"></div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="实测倍增系数 k" data-en="measured k">实测倍增系数 k</span><span class="v g" id="stK">—</span>
  <span class="k" data-zh="堆内中子" data-en="neutrons in core">堆内中子</span><span class="v" id="stN">0</span>
  <span class="k" data-zh="链式功率" data-en="chain power">链式功率</span><span class="v" id="stP">0<small>%</small></span>
  <span class="k" data-zh="衰变热(停堆仍在)" data-en="decay heat (stays after scram)">衰变热(停堆仍在)</span><span class="v b" id="stD">0.0<small>%</small></span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.f" data-zh="燃料棒 UO₂" data-en="fuel rod UO₂">燃料棒 UO₂</span>
    <span class="chip.c" data-zh="控制棒 B₄C/Ag-In-Cd" data-en="control rod B₄C/Ag-In-Cd">控制棒 B₄C/Ag-In-Cd</span>
    <span class="chip.n" data-zh="快中子(~2 万 km/s)" data-en="fast neutron (~20,000 km/s)">快中子(~2 万 km/s)</span>
    <span class="chip.t" data-zh="热中子(2.2 km/s)" data-en="thermal neutron (2.2 km/s)">热中子(2.2 km/s)</span>
  </div>
  <div id="actions">
    <button class="abtn warn" id="btnScram" data-zh="SCRAM 停堆" data-en="SCRAM">SCRAM 停堆</button>
    <button class="abtn" id="btnSeek"></button>
    <button class="abtn" id="btnReset" data-zh="重置" data-en="Reset">重置</button>
  </div>
  <div class="row"><label data-zh="控制棒插入深度" data-en="Rod insertion">控制棒插入深度</label><input id="ins" type="range" min="0" max="100" step="1" value="48"><span class="val" id="insVal">48%</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div class="row"><label data-zh="进度(快进,秒)" data-en="Fast-forward (s)">进度(快进,秒)</label><input id="prog" type="range" min="0" max="600" step="1" value="0"><span class="val" id="progVal">0 s</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../radioactive-decay/" data-zh="上游:衰变·半衰期" data-en="upstream: decay · half-life">上游:衰变·半衰期</a>
    <a href="../radical-chain/" data-zh="同机制:链式分支与终止" data-en="same mechanism: branching chains">同机制:链式分支与终止</a>
    <a href="../carnot-cycle/" data-zh="下游:裂变热→汽轮机效率上限" data-en="downstream: heat → turbine, Carnot cap">下游:裂变热→汽轮机效率上限</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rand = (a, b) => a + Math.random() * (b - a);
function randUnit() {
  const a = Math.random() * Math.PI * 2, b = Math.acos(Math.random() * 2 - 1);
  return new THREE.Vector3(Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a));
}

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x0e1218);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1a202a);
  M.water.color.set(THEME === 'light' ? 0x74c0fc : 0x3bc9db);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('核电站 · 可控链式反应', 'Nuclear Reactor · controlled chain reaction');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(5.2, 4.6, 8.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 26;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(5, 9, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.2,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1a202a, { roughness: 0.92, emissive: 0x000000 }),
  fuel: mat(0x5c636e, { metalness: 0.55, roughness: 0.45 }),
  rod: new THREE.MeshStandardMaterial({ color: 0x845ef7, roughness: 0.35, metalness: 0.5,
    emissive: 0x845ef7, emissiveIntensity: 0.22, transparent: true, opacity: 0.96 }),
  water: new THREE.MeshStandardMaterial({ color: 0x3bc9db, transparent: true, opacity: 0.065,
    roughness: 0.15, metalness: 0, depthWrite: false }),
  vessel: new THREE.MeshStandardMaterial({ color: 0x868e96, transparent: true, opacity: 0.09,
    roughness: 0.25, metalness: 0.7, side: THREE.DoubleSide, depthWrite: false }),
};

/* ================= 堆芯几何 ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.16, 7), M.floor);
floor.position.y = -0.1;
scene.add(floor);

/* 压力容器(半透明圆筒 + 环箍) */
const vessel = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 3.4, 48, 1, true), M.vessel);
vessel.position.y = 1.6;
scene.add(vessel);
for (const y of [0.08, 3.12]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.24, 0.035, 8, 60), mat(0x495057, { metalness: 0.7 }));
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  scene.add(ring);
}
/* 顶盖(带孔暗示) */
const lid = new THREE.Mesh(new THREE.CylinderGeometry(2.24, 2.24, 0.1, 48),
  mat(0x495057, { metalness: 0.7, opacity: 0.35 }));
lid.position.y = 3.36;
scene.add(lid);

/* 慢化剂/冷却剂:水 */
const water = new THREE.Mesh(new THREE.CylinderGeometry(2.02, 2.02, 3.0, 40), M.water);
water.position.y = 1.55;
scene.add(water);
const surf = new THREE.Mesh(new THREE.CircleGeometry(2.02, 40),
  new THREE.MeshBasicMaterial({ color: 0x3bc9db, transparent: true, opacity: 0.12, depthWrite: false }));
surf.rotation.x = -Math.PI / 2;
surf.position.y = 3.06;
scene.add(surf);

/* 燃料棒 5×5(InstancedMesh) */
const F_POS = [];
for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) F_POS.push([i * 0.6, j * 0.6]);
const fuelGeo = new THREE.CylinderGeometry(0.085, 0.085, 3.0, 10);
const fuel = new THREE.InstancedMesh(fuelGeo, M.fuel, F_POS.length);
const glow = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.115, 0.115, 3.0, 10),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false }), F_POS.length);
glow.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(F_POS.length * 3), 3);
const m4 = new THREE.Matrix4();
const fuelGlow = new Float32Array(F_POS.length);
F_POS.forEach(([x, z], i) => {
  m4.identity(); m4.setPosition(x, 1.55, z);
  fuel.setMatrixAt(i, m4); glow.setMatrixAt(i, m4);
});
scene.add(fuel); scene.add(glow);

/* 控制棒 4×4 + 驱动机构(刚体组,随插入深度升降) */
const C_POS = [];
for (const i of [-0.9, -0.3, 0.3, 0.9]) for (const j of [-0.9, -0.3, 0.3, 0.9]) C_POS.push([i, j]);
const yoke = new THREE.Group();
const rodGeo = new THREE.CylinderGeometry(0.065, 0.065, 3.05, 10);
for (const [x, z] of C_POS) {
  const r = new THREE.Mesh(rodGeo, M.rod);
  r.position.set(x, 0, z);
  yoke.add(r);
}
const plate = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.12, 2.3), mat(0x495057, { metalness: 0.7 }));
plate.position.y = 1.62;
yoke.add(plate);

/* 物理标定:热中子的归宿按概率表决定,实测 k = 每颗中子死亡时"子女"数的滑动平均 */
const NU = 2.43, P_TWO = 0.565;          // ν̄=2.43:放 2 个概率 0.565,3 个 0.435
const LEAK = 0.13, P_FIS = 0.86, A_MAX = 0.94;
const K_ALL = (1 - LEAK) * P_FIS * NU;   // ≈1.82(控制棒全抽出)
const rodWorth = u => u - Math.sin(2 * Math.PI * u) / (2 * Math.PI);   // 积分棒价值 S 曲线
const aIns = u => A_MAX * rodWorth(u);                                   // 控制棒吸收概率
const kTarget = u => K_ALL * (1 - aIns(u));                              // 理论 k(插入深度),k=1 在插入 ~49%

const POWER_NOM = 30;                    // 满功率 = 30 次裂变/秒(视觉标定)
const kbuf = new Float32Array(64); let kbi = 0, kbn = 0;
let kDisp = 0, kInit = false;
function pushK(c) { kbuf[kbi] = c; kbi = (kbi + 1) % kbuf.length; if (kbn < kbuf.length) kbn++; }
function kMeas() { if (!kbn) return kTarget(ins); let s = 0; for (let i = 0; i < kbn; i++) s += kbuf[i]; return s / kbn; }
function powerFrac() {
  while (fissionsT.length && fissionsT[0] < tSim - 2.5) fissionsT.shift();
  return fissionsT.length / 2.5 / POWER_NOM;
}

function nearestAxis(pos, table) {
  let best = table[0], bd = 1e9;
  for (const [x, z] of table) {
    const d = (pos.x - x) * (pos.x - x) + (pos.z - z) * (pos.z - z);
    if (d < bd) { bd = d; best = [x, z]; }
  }
  return best;
}

/* ================= 事件:热中子归宿(概率表=k 的来源) ================= */
const delayedQ = [];   // {p, t} 延发中子
function thermalEvent(n) {
  const r = Math.random(), a = aIns(ins) * (1 - LEAK);   // 吸收按"泄漏后条件概率"计,保证实测 k=kTarget
  if (r < LEAK) {                       // 泄漏出堆
    n.leaving = true; n.life = 0.55;
    n.dir.set(n.p.x, 0, n.p.z).normalize();
    if (n.dir.lengthSq() < 0.01) n.dir.copy(randUnit());
    n.dir.y = rand(-0.2, 0.4); n.dir.normalize();
    n.kids = 0;
    return false;
  }
  if (r < LEAK + a) {                   // 被控制棒吸收(0 个子女)
    const [x, z] = nearestAxis(n.p, C_POS);
    n.p.x += (x - n.p.x) * 0.85; n.p.z += (z - n.p.z) * 0.85;
    spawnFx(n.p, 0xb197fc, 0.075, 0.5);
    pushK(0);
    return true;
  }
  const [x, z] = nearestAxis(n.p, F_POS);
  n.p.x += (x - n.p.x) * 0.8; n.p.z += (z - n.p.z) * 0.8;
  n.p.y = clamp(n.p.y, 0.2, 2.9);
  if (Math.random() >= P_FIS) {         // 辐射俘获(0 个子女)
    spawnFx(n.p, 0x9aa5b1, 0.06, 0.4);
    pushK(0);
    return true;
  }
  /* 裂变! */
  spawnFx(n.p, 0xffe08a, 0.16, 0.6);
  spawnFx(n.p, 0xff922b, 0.09, 0.85);
  fissionsT.push(tSim);
  const fi = nearestAxisIndex(n.p, F_POS);
  fuelGlow[fi] = Math.min(fuelGlow[fi] + 1.4, 2.4);
  const j = Math.random() < P_TWO ? 2 : 3;   // ν̄ = 2.43
  for (let c = 0; c < j; c++) {
    if (c === j - 1 && Math.random() < 0.22) {
      delayedQ.push({ p: n.p.clone(), t: tSim + rand(1.5, 4.5) });  // 延发中子(迟到)
      spawnFx(n.p, 0xb197fc, 0.07, 1.2);
    } else spawnNeu(n.p, true);
  }
  pushK(j);
  return true;
}
function nearestAxisIndex(pos, table) {
  let bi = 0, bd = 1e9;
  for (let i = 0; i < table.length; i++) {
    const d = (pos.x - table[i][0]) ** 2 + (pos.z - table[i][1]) ** 2;
    if (d < bd) { bd = d; bi = i; }
  }
  return bi;
}

/* ================= 模拟一步(快进复用) ================= */
function simStep(dts) {
  tSim += dts;
  /* 控制棒运动:SCRAM 时 ~1.5 s 全插(真实堆重力落棒 2~4 s) */
  const rate = scramAnim ? 0.9 : 0.35;
  ins += clamp(insTarget - ins, -rate * dts, rate * dts);
  if (scramAnim && Math.abs(insTarget - ins) < 0.002) scramAnim = false;
  /* 启动中子源:每 0.8 s 一颗 */
  srcT -= dts;
  if (srcT <= 0) {
    srcT = 0.8;
    spawnNeu(srcPos, true);
    spawnFx(srcPos, 0xb197fc, 0.05, 0.5);
  }
  /* 延发中子到点 */
  for (let i = delayedQ.length - 1; i >= 0; i--) {
    if (tSim >= delayedQ[i].t) { spawnNeu(delayedQ[i].p, true); delayedQ.splice(i, 1); }
  }
  /* 中子运动与事件 */
  for (let i = neus.length - 1; i >= 0; i--) {
    const n = neus[i];
    if (n.leaving) {
      n.p.addScaledVector(n.dir, 1.4 * dts);
      n.life -= dts;
      if (n.life <= 0) { pushK(0); killNeu(i); }
      continue;
    }
    if (n.fast) {
      /* 慢化剂弹性碰撞:每次交出一大份动能,3 次后热化 */
      if (Math.random() < 1 - Math.exp(-2.6 * dts)) {
        n.slow++;
        spawnFx(n.p, 0x66d9e8, 0.055 + 0.02 * n.slow, 0.45);
        spawnH(n.p);
        if (n.slow >= 3) { n.fast = false; spawnFx(n.p, 0x66d9e8, 0.13, 0.6); }
      }
      n.p.addScaledVector(n.dir, 3.3 * (1 - 0.28 * n.slow) * dts);
    } else {
      /* 热中子:漫步 + 等待相互作用 */
      n.dir.lerp(randUnit(), 0.10).normalize();
      n.p.addScaledVector(n.dir, 1.05 * dts);
      if (Math.random() < 1 - Math.exp(-1.5 * dts)) {
        if (thermalEvent(n)) { killNeu(i); continue; }
      }
    }
    /* 水池边界反射(泄漏中子除外) */
    if (!n.leaving) {
      const rl = Math.hypot(n.p.x, n.p.z);
      if (rl > 2.0) {
        const nx = n.p.x / rl, nz = n.p.z / rl;
        n.p.x = nx * 2.0; n.p.z = nz * 2.0;
        const d2 = n.dir.x * nx + n.dir.z * nz;
        n.dir.x -= 2 * d2 * nx; n.dir.z -= 2 * d2 * nz; n.dir.normalize();
      }
      if (n.p.y < 0.1) { n.p.y = 0.1; n.dir.y = Math.abs(n.dir.y); }
      if (n.p.y > 3.0) { n.p.y = 3.0; n.dir.y = -Math.abs(n.dir.y); }
    }
  }
  /* 衰变热:产额 ≈7% 额定功率,τ≈90 s(对应 Way-Wigner 律的视觉压缩) */
  D += (0.07 * powerFrac() - D / 90) * dts;
  if (D < 0) D = 0;
}
function killNeu(i) { neus[i] = neus[neus.length - 1]; neus.pop(); }

function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function updInsVal() {
  elInsVal.textContent = `${Math.round(insTarget * 100)}% · k≈${kTarget(insTarget).toFixed(2)}`;
}
elIns.addEventListener('input', () => {
  insTarget = parseInt(elIns.value, 10) / 100;
  if (insTarget < 1) scrammed = false;
  updInsVal();
});
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elProg.addEventListener('input', () => {
  const v = parseInt(elProg.value, 10);
  if (v > tSim) {
    let guard = 0;
    while (tSim < v && guard++ < 30000) simStep(0.05);
  }
  elProgVal.textContent = Math.round(tSim) + ' s';
});
btnScram.addEventListener('click', scramNow);
btnReset.addEventListener('click', () => { resetSim(); setIns(0.48); burst(5, false); });
/* 自动找临界:像真实现场一样反复微调棒位,直到实测 k≈1.000 */
let seeking = false, seekCool = 0;
function updateSeekBtn() {
  btnSeek.textContent = L(seeking ? '找临界中…' : '自动找临界', seeking ? 'seeking…' : 'Auto-find critical');
  btnSeek.classList.toggle('on', seeking);
}
btnSeek.addEventListener('click', () => {
  seeking = !seeking; seekCool = 0;
  if (seeking && scrammed) { scrammed = false; }
  updateSeekBtn();
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
/* document.hidden 停 rAF */
let rafId = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { clock.getDelta(); rafId = requestAnimationFrame(frame); }
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
const qTmp = new THREE.Quaternion(), vY = new THREE.Vector3(0, 1, 0);
const sElong = new THREE.Vector3(2.1, 1, 1), sOne = new THREE.Vector3(1, 1, 1), q0 = new THREE.Quaternion();
const colFast = new THREE.Color(0xffa94d), colTh = new THREE.Color(0x66d9e8);
const colGlow = new THREE.Color();
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) simStep(dts);

  /* 自动找临界伺服 */
  if (seeking && playing && kbn >= 40 && neus.length > 6) {
    const k = kMeas();
    if (Math.abs(k - 1) <= 0.008) {
      seekCool += dts;
      if (seekCool > 2) { seeking = false; updateSeekBtn(); }
    } else {
      seekCool = 0;
      insTarget = clamp(insTarget + (k > 1 ? 0.05 : -0.05) * dts, 0, 1);
      elIns.value = Math.round(insTarget * 100);
      updInsVal();
    }
  }

  /* 控制棒位置 */
  yoke.position.y = 4.695 - 3.25 * ins;

  /* 中子实例 */
  let k = 0;
  for (const n of neus) {
    if (n.fast) {
      qTmp.setFromUnitVectors(vY, n.dir);
      m4.compose(n.p, qTmp, sElong);
      neutrons.setColorAt(k, colFast);
    } else {
      m4.compose(n.p, q0, sOne);
      neutrons.setColorAt(k, colTh);
    }
    neutrons.setMatrixAt(k++, m4);
  }
  for (let i = k; i < MAXN; i++) { m4.makeScale(0.0001, 0.0001, 0.0001); neutrons.setMatrixAt(i, m4); }
  neutrons.instanceMatrix.needsUpdate = true;
  if (neutrons.instanceColor) neutrons.instanceColor.needsUpdate = true;

  /* 燃料辉光 = 链式功率 + 衰变热(停堆后仍亮) */
  const base = clamp(0.10 + powerFrac() * 0.42 + D * 3.2, 0.06, 1.35);
  for (let i = 0; i < F_POS.length; i++) {
    fuelGlow[i] *= Math.exp(-2.2 * dt);
    const g = base + fuelGlow[i] * 0.5;
    colGlow.setRGB(1.0 * g, 0.62 * g, 0.25 * g);
    glow.setColorAt(i, colGlow);
  }
  glow.instanceColor.needsUpdate = true;

  /* 特效 */
  for (const f of fxPool) {
    if (!f.mesh.visible) continue;
    f.t -= dts;
    if (f.t <= 0) { f.mesh.visible = false; continue; }
    const u = 1 - f.t / f.dur;
    f.mesh.scale.setScalar(0.02 + f.s * u * 3.2);
    f.mesh.material.opacity = 0.85 * (1 - u) * (1 - u);
  }
  for (const h of hPool) {
    if (!h.mesh.visible) continue;
    h.life -= dts;
    if (h.life <= 0) { h.mesh.visible = false; continue; }
    h.mesh.position.addScaledVector(h.v, dts);
    h.mesh.material.opacity = clamp(h.life / 0.55, 0, 1);
  }
  srcDot.material.color.setHSL(0.72, 0.7, 0.55 + 0.15 * Math.sin(tSim * 5));

  /* 读数 */
  if (kbn) { const km = kMeas(); kDisp = kInit ? kDisp + (km - kDisp) * Math.min(1, dt * 4) : km; kInit = true; }
  const kShow = kbn >= 12 ? kDisp : kTarget(ins);
  const pf = powerFrac();
  stK.innerHTML = kbn >= 12 ? kDisp.toFixed(3) : '—';
  stK.className = 'v ' + (kShow > 1.015 ? 'r' : Math.abs(kShow - 1) <= 0.015 ? 'g' : 'b');
  stN.textContent = neus.length;
  stP.innerHTML = Math.round(pf * 100) + '<small>%</small>';
  stP.className = 'v ' + (pf > 1.5 ? 'r' : '');
  stD.innerHTML = (D * 100).toFixed(1) + '<small>%</small>';
  /* 警报 */
  const alarm = kShow > 1.015 && kbn >= 12;
  alarmEl.style.display = alarm ? 'flex' : 'none';
  if (alarm) alarmEl.textContent = L('k > 1 · 功率指数攀升 —— 落棒!', 'k > 1 · exponential climb — insert rods!');
  /* 快进滑块位置同步 */
  elProg.value = Math.min(600, Math.round(tSim));
  elProgVal.textContent = Math.round(tSim) + ' s';

  drawChart();
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* ================= 启动 ================= */
ins = insTarget;
updInsVal();
if (qsBool('scram', false)) { scramNow(); D = 0.065; }   // 演示:打开即"刚停堆"状态
applyTheme();
applyLang();
setPlayLabel();
updateSeekBtn();
{ /* ?t= 快进到指定模拟秒 */
  const t0 = clamp(qsFloat('t', 0), 0, 600);
  let guard = 0;
  while (tSim < t0 && guard++ < 30000) simStep(0.05);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
