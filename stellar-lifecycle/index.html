<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恒星的一生 · 引力与核火的百年拉锯</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }
  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);

  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<div id="title">

  <div class="sub" data-zh="一团分子云只要足够冷、足够重,引力就赢——坍缩把核心加热到一千万度,质子-质子链点燃,辐射压与引力精确顶牛百亿年;氢烧完,氦核收缩、外壳膨胀成红巨星;大质量恒星一路套娃烧到铁——聚变铁不再放能,0.1 秒坍缩反弹成超新星,重元素在爆里锻造:我们都是星尘 · 3D 交互演示 · 拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A molecular cloud that is cold and heavy enough lets gravity win — collapse heats the core to 10 million K, the proton-proton chain ignites, and radiation pressure stands off gravity for ten billion years; when hydrogen runs out the helium core contracts and the envelope swells into a red giant; massive stars burn shell upon shell down to iron — fusing iron eats energy, the core collapses in 0.1 s and rebounds as a supernova forging heavy elements: we are all stardust · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">恒星的一生:引力与核火的百年拉锯</div>

    <span data-zh="相关:" data-en="Related:">相关:</span>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x070a12 : 0xd8e4f0);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('恒星的一生 · 引力与核火的百年拉锯', 'Life of a Star · Gravity vs the Nuclear Fire');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 400);
camera.position.set(0, 3.2, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 60;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0x8ea6c8, 0x1a2030, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(6, 10, 8);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 物理量 ================= */
let mass = clamp(qsFloat('mass', 1), 0.5, 40);
const tauMS = M => 10 * Math.pow(M, -2.5);
const lumMS = M => Math.pow(M, 3.5);
const tMS = M => 5780 * Math.pow(M, 0.5);
const STAGES = ['cloud', 'ignite', 'mainseq', 'giant', 'presn', 'sn', 'remnant'];
const STAGE_DUR = { cloud: 8, ignite: 5, mainseq: 10, giant: 8, presn: 4, sn: 3, remnant: 1e9 };
let stage = 'cloud', stageT = 0;
let showArrows = true, showOnion = false;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let labelsOn = qsBool('labels', true);
let spinOn = qsBool('spin', true);

const coreT = () => ({ cloud: 10, ignite: 1e7, mainseq: 1.5e7, giant: 1e8, presn: 3e9, sn: 1e11, remnant: 0 }[stage]);

/* ================= 场景 ================= */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const bgStars = new THREE.InstancedMesh(new THREE.SphereGeometry(0.03, 6, 4),
  new THREE.MeshBasicMaterial({ color: 0xcfe0ef, transparent: true, opacity: 0.7 }), 300);
{
  const rng = mulberry32(99), d = new THREE.Object3D();
  for (let i = 0; i < 300; i++) {
    const r = 60 + rng() * 60, th = rng() * Math.PI * 2, ph = Math.acos(2 * rng() - 1);
    d.position.set(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph) * 0.7, r * Math.sin(ph) * Math.sin(th));
    d.scale.setScalar(0.5 + rng() * 1.5);
    d.updateMatrix();
    bgStars.setMatrixAt(i, d.matrix);
  }
  scene.add(bgStars);
}

const starGroup = new THREE.Group();
starGroup.position.y = 0.6;
scene.add(starGroup);

const core = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28),
  new THREE.MeshStandardMaterial({ color: 0xffe0b0, emissive: 0xffb454, emissiveIntensity: 1.2, roughness: 0.4 }));
core.visible = false;
starGroup.add(core);
const env = new THREE.Mesh(new THREE.SphereGeometry(1.45, 40, 28),
  mat(0xffd9a0, { opacity: 0.32, roughness: 0.3, emissiveIntensity: 0.4 }));
env.visible = false;
starGroup.add(env);

function setStage(s) {
  stage = s;
  stageT = 0;
  if (s === 'cloud') {
    core.visible = env.visible = wd.visible = ns.visible = bh.visible = false;
    nebula.material.opacity = 0;
    flash.material.opacity = 0;
    shock.material.opacity = 0;
    for (const p of cloudP) p.disk = 0;
  }
  if (s === 'ignite') {
    cloud.visible = true;
    core.visible = true;
    env.visible = true;
  }
  if (s === 'remnant') spawnRemnant();
  syncAll();
}
function spawnRemnant() {
  core.visible = env.visible = false;
  onionC.visible = false;
  cloud.visible = false;
  wd.visible = ns.visible = bh.visible = false;
  if (mass < 8) { wd.visible = true; nebula.material.opacity = 0.3; }
  else if (mass < 20) ns.visible = true;
  else bh.visible = true;
}

const plotCv = document.getElementById('plotCv');
const MS_PTS = [[30000, 3e4], [20000, 2e3], [15000, 500], [9500, 30], [8500, 15], [7200, 4], [5700, 1], [4500, 0.25], [3200, 0.05], [2600, 0.01]];
function hrXY(T, Lm) {
  const padL = 34, padR = 12, padT = 12, padB = 26;
  const lt = Math.log10(clamp(T, 2500, 40000));
  const x = padL + (4.6 - lt) / (4.6 - Math.log10(2500)) * (330 * 2 - padL - padR);
  const ll = Math.log10(clamp(Lm, 1e-4, 1e6));
  const y = padT + (6 - ll) / 6 * (214 * 2 - padT - padB);
  return [x, y];
}
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  ctx.strokeStyle = 'rgba(116,192,252,.5)';
  ctx.lineWidth = 5;
  ctx.beginPath();
  MS_PTS.forEach(([T, Lm], i) => { const [x, y] = hrXY(T, Lm); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = 'rgba(255,107,107,.6)';
  ctx.beginPath();
  const gi = MS_PTS[5];
  let [gx, gy] = hrXY(gi[0], gi[1]);
  ctx.moveTo(gx, gy);
  [hrXY(4200, gi[1] * 40), hrXY(3600, gi[1] * 150)].forEach(([x, y]) => ctx.lineTo(x, y));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = cTxt;
  ctx.font = '15px sans-serif';
  ctx.fillText('T →(冷)', W / 2 - 30, H - 8);
  ctx.fillText('L ↑', 6, 22);
  const [T, Lm] = hrPos();
  const [x, y] = hrXY(T, Lm);
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath();
  ctx.arc(x, y, 7, 0, Math.PI * 2);
  ctx.fill();
}
function hrPos() {
  if (stage === 'cloud') return [3200, 1e-3];
  if (stage === 'ignite') return [3400, 0.5 * lumMS(mass) / 10];
  if (stage === 'mainseq') return [tMS(mass), lumMS(mass)];
  if (stage === 'giant') return [3600, lumMS(mass) * Math.min(150, 30 + mass * 6)];
  if (stage === 'presn') return [3600, lumMS(mass) * 200];
  if (stage === 'sn') return [20000, 1e9 * 0.99];
  if (mass < 8) return [15000, 1e-3];
  return [30000, 0.05];
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, statsAcc = 0, shakeT = 0;
const dummy = new THREE.Object3D(), tmpV = new THREE.Vector3();
function starRadius() {
  if (stage === 'cloud') return 0.05;
  if (stage === 'ignite') return 0.55 * Math.pow(mass, 0.4);
  if (stage === 'mainseq') return 0.55 * Math.pow(mass, 0.4);
  if (stage === 'giant' || stage === 'presn') return 0.55 * Math.pow(mass, 0.4) * 3.2;
  return 0.4;
}
function starColor() {
  if (stage === 'giant' || stage === 'presn') return 0xff8a5c;
  if (stage === 'sn') return 0xffffff;
  const T = tMS(mass);
  if (T > 15000) return 0x9fc4ff;
  if (T > 8000) return 0xcfe0ff;
  if (T > 5000) return 0xfff1c9;
  return 0xffb454;
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const t = clock.elapsedTime;
  const dt = dt0 * (playing ? speed : 0);
  if (dt > 0) {
    stageT += dt;
    if (stageT > STAGE_DUR[stage] && stage !== 'remnant') {
      const i = STAGES.indexOf(stage);
      let next = STAGES[i + 1];
      if (stage === 'giant' && mass < 8) next = 'remnant';
      if (stage === 'presn' && mass < 8) next = 'remnant';
      setStage(next);
    }
    const col = new THREE.Color(starColor());
    core.material.color = col;
    core.material.emissive = col;
    env.material.color = col;
    const R = starRadius();

    core.scale.setScalar(Math.max(0.02, R * 0.55));
    env.scale.setScalar(Math.max(0.02, R));
    core.visible = env.visible = (stage !== 'cloud' && stage !== 'remnant');
    env.material.opacity = stage === 'sn' ? 0.15 : 0.3;
    core.material.emissiveIntensity = stage === 'sn' ? 4 : stage === 'ignite' ? 1.8 : 1.2;
    /* 云粒子:坍缩→盘→隐去 */
    if (stage === 'cloud' || stage === 'ignite') {
      const pull = stage === 'cloud' ? 0.4 : 0.25;
      for (let i = 0; i < CN; i++) {
        const p = cloudP[i];
        tmpV.set(0, 0, 0).sub(p.p);
        const d = tmpV.length();
        p.p.addScaledVector(tmpV.normalize(), pull * dt * (0.4 + d * 0.25));
        if (stage === 'ignite' || d < 3.5) {
          p.p.y *= 1 - dt * 1.5;
          p.disk = Math.min(1, p.disk + dt);
        }
        p.p.x += Math.sin(t + p.seed) * 0.01;
        p.p.z += Math.cos(t + p.seed * 1.3) * 0.01;
        dummy.position.copy(p.p);
        dummy.scale.setScalar(p.disk > 0.5 ? 0.5 : 1);
        dummy.updateMatrix();
        cloud.setMatrixAt(i, dummy.matrix);
      }
      cloud.instanceMatrix.needsUpdate = true;
      cloud.visible = true;
    } else cloud.visible = false;
    /* 光子雨 */
    const photOn = stage === 'mainseq' || stage === 'ignite' || stage === 'giant';
    photons.visible = photOn;
    if (photOn) {
      for (let i = 0; i < FN; i++) {
        const p = photP[i];
        p.r += p.v * dt;
        if (p.r > 9) p.r = starRadius() + 0.3;
        dummy.position.set(p.r * Math.sin(p.ph) * Math.cos(p.th), p.r * Math.cos(p.ph), p.r * Math.sin(p.ph) * Math.sin(p.th));
        dummy.lookAt(0, 0, 0);
        dummy.updateMatrix();
        photons.setMatrixAt(i, dummy.matrix);
      }
      photons.instanceMatrix.needsUpdate = true;
    }
    /* 箭头 */
    const arrOn = showArrows && (stage === 'mainseq' || stage === 'giant' || stage === 'ignite');
    gravArrows.visible = presArrows.visible = arrOn;
    if (arrOn) {
      const s = starRadius() + 0.6;
      gravArrows.scale.setScalar(s / 2.6);
      presArrows.scale.setScalar(s / 2.6);
    }
    /* 洋葱 */
    onionC.visible = showOnion && (stage === 'presn' || stage === 'giant');
    if (onionC.visible) onionC.scale.setScalar(starRadius());
    /* 闪光与冲击波 */
    if (stage === 'ignite') flash.material.opacity = Math.max(0, 0.8 - stageT * 0.3);
    else if (stage === 'sn') {
      flash.material.opacity = Math.max(0, 1 - stageT * 0.7);
      shock.scale.setScalar(1 + stageT * 6);
      shock.material.opacity = Math.max(0, 0.9 - stageT * 0.22);
      shakeT = 0.4;
    } else { flash.material.opacity = Math.max(0, flash.material.opacity - dt * 2); shock.material.opacity = Math.max(0, shock.material.opacity - dt * 0.4); }
    nebula.material.opacity = stage === 'remnant' && mass < 8 ? 0.28 + 0.06 * Math.sin(t) : Math.max(0, nebula.material.opacity - dt * 0.1);
    if (stage === 'remnant') { wd.visible = mass < 8; ns.visible = mass >= 8 && mass < 20; bh.visible = mass >= 20; }
    if (ns.visible) ns.rotation.y += dt * 4;
    if (bh.visible) bh.rotation.y += dt * 1.2;
    if (shakeT > 0) {
      shakeT -= dt;
      starGroup.position.x = (Math.random() - 0.5) * 0.25;
      starGroup.position.z = (Math.random() - 0.5) * 0.25;
    } else { starGroup.position.x = 0; starGroup.position.z = 0; }
    labCloud.visible = stage === 'cloud';
    labCore.visible = stage === 'ignite' || stage === 'mainseq';
    labShell.visible = stage === 'giant' || stage === 'presn';
    labFe.visible = stage === 'presn';
    labShock.visible = stage === 'sn';
    refreshLabels();
    statsAcc += dt0;
    if (statsAcc > 0.15) {
      statsAcc = 0;
      stM.innerHTML = mass.toFixed(1) + ' <small>M☉</small>';
      const cT = coreT();
      stT.textContent = cT >= 1e6 ? (cT / 1e6).toFixed(cT >= 1e9 ? 0 : 1) + '×10⁶ K' : cT.toFixed(0) + ' K';
      stL.textContent = tauMS(mass) >= 1 ? tauMS(mass).toFixed(1) + ' Gyr' : (tauMS(mass) * 1000).toFixed(1) + ' Myr';
      stLum.textContent = lumMS(mass).toExponential(1) + ' L☉';
      stS.textContent = stageLabel();
      updateFormula();
      drawPlot();
    }
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

const ph0 = Math.round(qsFloat('phase', 0));
if (ph0 >= 1 && ph0 <= 6) STEPS[ph0 - 1].act();
else if (qsFloat('t', 0) > 0) setStage(STAGES[clamp(Math.floor(qsFloat('t', 0) / 6), 0, 6)]);
setStage('cloud');
applyTheme();
applyLang();
syncAll();
start();
</script>
