<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碳循环 · 一个碳原子的四条旅途</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#69db7c;
    --bg:#0e1318; --panel:rgba(13,18,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,18,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,18,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#2f9e44;
    --bg:#eef2f0; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.g { border-color: rgba(105,219,124,.9); color: #c6f6d3; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#8a4b00; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 224px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 254px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #69db7c; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.g { color: #c6f6d3; border-color: rgba(105,219,124,.7); }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(105,219,124,.6); background: rgba(105,219,124,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(47,158,68,.55); background: rgba(47,158,68,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11px; color: var(--text3); flex: 0 0 74px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(105,219,124,.10); border-color: rgba(105,219,124,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(47,158,68,.08); border-color: rgba(47,158,68,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #c6f6d3; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="碳循环:一个碳原子的四条旅途" data-en="The Carbon Cycle: one atom, four journeys">碳循环:一个碳原子的四条旅途</h1>
  <div class="sub" data-zh="化石燃烧+火山 → 大气 CO₂ → 留存一半在天上、四分之一溶进海洋(变酸)、四分之一被生物圈吃掉 → 净零后大气仍要几十年回落 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Fossil burning + volcanoes → atmospheric CO₂ → about half stays aloft, a quarter dissolves into the ocean (souring it), a quarter is eaten by the biosphere → even at net zero the sky takes decades to drain · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">化石燃烧+火山 → 大气 CO₂ → 留存一半在天上、四分之一溶进海洋(变酸)、四分之一被生物圈吃掉 → 净零后大气仍要几十年回落 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="年份" data-en="Year">年份</span><span class="v" id="stYr">—</span>
  <span class="k" data-zh="大气 CO₂" data-en="CO₂">大气 CO₂</span><span class="v warn" id="stPpm">—</span>
  <span class="k" data-zh="年排放" data-en="Emissions">年排放</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="大气净增" data-en="Net rise">大气净增</span><span class="v" id="stNet">—</span>
  <span class="k" data-zh="海表 pH" data-en="Ocean pH">海表 pH</span><span class="v" id="stPh">—</span>
</div>

<div id="plot">
  <h3 data-zh="大气 CO₂(橙)· 海表 pH(蓝)· 虚线=工业前 280 ppm" data-en="Atmospheric CO₂ (orange) · ocean pH (blue) · dashed = pre-industrial 280 ppm">大气 CO₂(橙)· 海表 pH(蓝)· 虚线=工业前 280 ppm</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="红点 CO₂ 分子" data-en="red = CO₂">红点 CO₂ 分子</span>
    <span class="chip.b" data-zh="蓝箭头 溶入海洋" data-en="blue = into ocean">蓝箭头 溶入海洋</span>
    <span class="chip.g" data-zh="绿箭头 光合固定" data-en="green = photosynthesis">绿箭头 光合固定</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnNat" data-zh="1750 自然平衡" data-en="1750 natural">1750 自然平衡</button>
    <button class="abtn" id="btnMod" data-zh="现代工业 1750→" data-en="industrial 1750→">现代工业 1750→</button>
    <button class="abtn" id="btnZero" data-zh="净零情景" data-en="net zero">净零情景</button>
    <button class="abtn" id="btnVolc" data-zh="火山喷发一次" data-en="erupt volcano">火山喷发一次</button>
  </div>
  <div class="row"><label data-zh="人为排放" data-en="Emissions">人为排放</label><input id="em" type="range" min="0" max="12" step="0.1" value="0"><span class="val" id="emVal">0 GtC/年</span></div>
  <div class="row"><label data-zh="时间轴" data-en="Timeline">时间轴</label><input id="yr" type="range" min="1750" max="2125" step="0.25" value="1750"><span class="val" id="yrVal">1750</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../greenhouse-effect/" data-zh="CO₂ 多了天怎么热" data-en="why more CO₂ heats the sky">CO₂ 多了天怎么热</a>
    <a href="../c4-cam-photosynthesis/" data-zh="生物圈怎么吃 CO₂" data-en="how plants eat CO₂">生物圈怎么吃 CO₂</a>
    <a href="../ocean-conveyor/" data-zh="海洋怎么搬运热量" data-en="how the ocean moves heat">海洋怎么搬运热量</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef2f0 : 0x0e1318);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('碳循环 · 一个碳原子的四条旅途', 'Carbon Cycle · one atom, four journeys');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setModeBtns();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.5, 4.8, 11.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.15, 1.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(5, 9, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 4, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.08,
    emissive: color, emissiveIntensity: 0.08, transparent: true, ...opts });
}
const base = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.4, 0.16, 56),
  mat(0x22281f, { roughness: 0.92, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.1;
scene.add(base);

/* 大气穹顶(储库,颜色随浓度) */
const domeMat = new THREE.MeshStandardMaterial({ color: 0x86b8e8, roughness: 0.25, metalness: 0,
  transparent: true, opacity: 0.13, side: THREE.DoubleSide, depthWrite: false });
const dome = new THREE.Mesh(new THREE.SphereGeometry(2.3, 40, 24, 0, Math.PI * 2, 0, Math.PI * 0.55), domeMat);
dome.position.y = 0.55;
scene.add(dome);

/* 海洋(左) */
const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1f6fae, roughness: 0.2, metalness: 0.1,
  transparent: true, opacity: 0.85, emissive: 0x0d3a5e, emissiveIntensity: 0.25 });
const ocean = new THREE.Mesh(new THREE.BoxGeometry(2.7, 1.05, 2.0), oceanMat);
ocean.position.set(-2.15, 0.42, 0.55);
scene.add(ocean);
const oceanGlass = new THREE.Mesh(new THREE.BoxGeometry(2.7, 1.05, 2.0),
  new THREE.MeshStandardMaterial({ color: 0x9fd4f5, transparent: true, opacity: 0.22, roughness: 0.05 }));
oceanGlass.position.copy(ocean.position);
scene.add(oceanGlass);

/* 森林(右) */
const forestGrp = new THREE.Group();
forestGrp.position.set(2.9, 0, 0.5);
scene.add(forestGrp);
const trunkMat = mat(0x7a5230, { roughness: 0.8 });
const leafMat = mat(0x2f9e44, { roughness: 0.6, emissiveIntensity: 0.12 });
const treePts = [[0, 0], [0.75, -0.45], [-0.7, -0.3], [0.3, -1.0]];
for (const [dx, dz] of treePts) {
  const h = 0.85 + Math.random() * 0.5;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.34, 8), trunkMat);
  trunk.position.set(dx, 0.17, dz);
  forestGrp.add(trunk);
  const crown = new THREE.Mesh(new THREE.ConeGeometry(0.34, h, 10), leafMat);
  crown.position.set(dx, 0.34 + h / 2, dz);
  forestGrp.add(crown);
}

/* 火电厂 + 化石碳层(右后) */
const plantGrp = new THREE.Group();
plantGrp.position.set(3.4, 0, -1.55);
scene.add(plantGrp);
const hall = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.6), mat(0x8b93a3, { roughness: 0.7 }));
hall.position.y = 0.25;
plantGrp.add(hall);

/* ================= 状态:箱式碳模型 ================= */
const GTC_PER_PPM = 2.12, PRE_PPM = 280;
const K_OC = 0.015, K_BIO = 0.022;        // 海洋 / 陆地汇(每 ppm 超额, GtC/年)
const NAT_IN = 0.2, WEATHER = 0.2;        // 火山+变质去气 / 风化埋藏(自然收支相抵)
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let mode = ['modern', 'netzero', 'natural'].includes(qs.get('mode')) ? qs.get('mode') : 'modern';
let year = clamp(qsFloat('t', 2024), 1750, 2125);
let emOverride = qs.get('em') !== null ? clamp(qsFloat('em', -1), 0, 12) : null;
let ppm = PRE_PPM;
let sampleAcc = 0;
const HIST_YEARS = 375, SAMPLE_DT = 0.25;
const NSAMP = Math.ceil(HIST_YEARS / SAMPLE_DT);
const hist = [];
const HIST_E = [[1750, 0], [1850, 0.5], [1900, 1.3], [1950, 3.3], [1980, 6.5], [2000, 8.2], [2010, 10.0], [2025, 11.2]];
function histE(y) {
  if (y <= HIST_E[0][0]) return HIST_E[0][1];
  for (let i = 1; i < HIST_E.length; i++) {
    if (y <= HIST_E[i][0]) {
      const [y0, e0] = HIST_E[i - 1], [y1, e1] = HIST_E[i];
      return lerp(e0, e1, (y - y0) / (y1 - y0));
    }
  }
  return 10.5;
}
function currentE() {
  if (mode === 'natural') return 0;
  if (emOverride !== null && mode !== 'netzero') return emOverride;
  if (mode === 'netzero') return year < 2025 ? histE(year) : 0;
  return histE(year);
}
const sinkOc = () => K_OC * Math.max(0, ppm - PRE_PPM);
const sinkBio = () => K_BIO * Math.max(0, ppm - PRE_PPM);
const oceanpH = () => 8.20 - 0.00075 * Math.max(0, ppm - PRE_PPM);
function carbonStep(dy) {
  const E = currentE();
  const Fnet = E + NAT_IN - WEATHER - sinkOc() - sinkBio();
  ppm = clamp(ppm + Fnet / GTC_PER_PPM * dy, 260, 800);
}
function pushSample() { hist.push(ppm); if (hist.length > NSAMP) hist.shift(); }
function fastForward(toYear) {
  const target = clamp(toYear, 1750, 2125);
  if (target < year) { year = 1750; ppm = PRE_PPM; hist.length = 0; sampleAcc = 0; }
  let guard = 0;
  while (year < target - 1e-6 && guard++ < 6000) {
    carbonStep(Math.min(SAMPLE_DT, target - year));
    year = Math.min(target, year + SAMPLE_DT);
    sampleAcc += SAMPLE_DT;
    if (sampleAcc >= SAMPLE_DT - 1e-9) { sampleAcc = 0; pushSample(); }
  }
}

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 34, padR = 12, padB = 22;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const xOf = i => pad + (W - pad - padR) * i / (NSAMP - 1);
  const yPpm = v => pad + (H - pad - padB) * (1 - clamp((v - 260) / 260, 0, 1));
  const yPh = v => pad + (H - pad - padB) * (1 - clamp((v - 7.95) / 0.35, 0, 1));
  /* 工业前基线 */
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2; ctx.setLineDash([8, 7]);
  ctx.beginPath(); ctx.moveTo(pad, yPpm(280)); ctx.lineTo(W - padR, yPpm(280)); ctx.stroke();
  ctx.setLineDash([]);
  /* 轴 */
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  /* 季节呼吸带(±3 ppm 半透明) + CO₂ 曲线 */
  if (hist.length > 40) {
    ctx.fillStyle = 'rgba(255,169,77,.22)';
    ctx.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const yr = year - (hist.length - 1 - i) * SAMPLE_DT;
      const v = hist[i] + (yr > 1800 ? 2.9 : 0);
      i ? ctx.lineTo(xOf(i), yPpm(v)) : ctx.moveTo(xOf(i), yPpm(v));
    }
    for (let i = hist.length - 1; i >= 0; i--) {
      const yr = year - (hist.length - 1 - i) * SAMPLE_DT;
      const v = hist[i] - (yr > 1800 ? 2.9 : 0);
      ctx.lineTo(xOf(i), yPpm(v));
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.strokeStyle = '#ffa94d'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i = 0; i < hist.length; i++) {
    i ? ctx.lineTo(xOf(i), yPpm(hist[i])) : ctx.moveTo(xOf(i), yPpm(hist[i]));
  }
  ctx.stroke();
  /* pH(右半区缩放) */
  ctx.strokeStyle = '#74c0fc'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i = 0; i < hist.length; i++) {
    const v = 8.20 - 0.00075 * Math.max(0, hist[i] - PRE_PPM);
    i ? ctx.lineTo(xOf(i), yPh(v)) : ctx.moveTo(xOf(i), yPh(v));
  }
  ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '17px system-ui';
  ctx.fillText('280', pad - 34, yPpm(280) + 5);
  ctx.fillText('8.20', pad - 38, yPh(8.20) + 5);
  ctx.fillText('1750', pad - 14, H - 6);
  ctx.fillText('2125', W - padR - 30, H - 6);
}

const tmpA = new THREE.Vector3();
function updateParticles(dt, vis) {
  /* 穹顶常驻分子:数量 ∝ 超额浓度 */
  const n = clamp(Math.round((ppm - 205) / 1.6), 16, 150);
  const now = performance.now() / 1000;
  for (let i = 0; i < 150; i++) {
    const b = domeBase[i];
    if (i < n) {
      dummy.position.set(b.x + Math.sin(now * b.sp + b.ph) * 0.14, b.y + Math.sin(now * b.sp * 1.3 + b.ph * 2) * 0.1, b.z + Math.cos(now * b.sp * 0.8 + b.ph) * 0.1);
      dummy.scale.setScalar(0.85 + 0.3 * Math.sin(now * 2 + b.ph));
    } else {
      dummy.position.set(0, -10, 0);
      dummy.scale.setScalar(0.001);
    }
    dummy.updateMatrix();
    domeIM.setMatrixAt(i, dummy.matrix);
  }
  domeIM.instanceMatrix.needsUpdate = true;
  /* 通量脉冲 */
  const Ex = currentE();
  flyAcc.resp += vis * 2.0;
  flyAcc.photo += vis * 2.0;
  flyAcc.ocIn += vis * (1.0 + clamp(sinkOc() * 0.45, 0, 2.2));
  flyAcc.ocOut += vis * 1.0;
  flyAcc.stack += vis * clamp(Ex * 0.42, 0, 5);
  flyAcc.volc += vis * (volcFlash > 0 ? 6 : 0.05);
  flyAcc.weath += vis * 0.18;
  flyAcc.bury += vis * 0.1;
  for (const k in flyAcc) {
    if (flyAcc[k] >= 1) { flyAcc[k] = 0; spawn(k, k === 'weath' || k === 'bury' ? 2.2 : 1.1 + Math.random() * 0.3); }
  }
  volcFlash = Math.max(0, volcFlash - vis);
  for (let i = 0; i < FLY_N; i++) {
    const s = flyState[i];
    if (s.t >= 0) {
      s.t += vis / s.dur;
      if (s.t >= 1) s.t = -1;
      else {
        bez(s.key, s.t, tmpA);
        tmpA.y += Math.sin(s.t * Math.PI * 3 + s.seed * 7) * 0.05;
        dummy.position.copy(tmpA);
        dummy.scale.setScalar(0.8 + 0.5 * Math.sin(Math.PI * s.t));
      }
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.001); }
    dummy.updateMatrix();
    flyIM.setMatrixAt(i, dummy.matrix);
    flyCol.setHex(s.t >= 0 ? FLY_COLORS[s.key] : 0x000000);
    flyIM.setColorAt(i, flyCol);
  }
  flyIM.instanceMatrix.needsUpdate = true;
  if (flyIM.instanceColor) flyIM.instanceColor.needsUpdate = true;
  crater.material.color.setHex(volcFlash > 0 ? 0xffd43b : 0xff5a2a);
  crater.scale.setScalar(volcFlash > 0 ? 1 + 0.6 * volcFlash : 1);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 1, volcFlash = 0;
const cAir = new THREE.Color(0x86b8e8), cHot = new THREE.Color(0xe8836b), cMix = new THREE.Color();
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const vis = dt * speed;
  if (playing) {
    const dy = vis * 6;                     // speed 1: 每秒 6 年
    carbonStep(dy);
    year += dy;
    if (year > 2125) { year = 1750; hist.length = 0; }
    sampleAcc += dy;
    while (sampleAcc >= SAMPLE_DT) { sampleAcc -= SAMPLE_DT; pushSample(); }
  }
  updateParticles(dt, vis);
  cMix.lerpColors(cAir, cHot, clamp(excess() / 240, 0, 1));
  domeMat.color.copy(cMix);
  oceanMat.emissiveIntensity = 0.22 + clamp(excess() / 160, 0, 1) * 0.25;
  statsAcc += dt;
  if (statsAcc > 0.25) {
    statsAcc = 0;
    const E = currentE(), Fnet = E + NAT_IN - WEATHER - sinkOc() - sinkBio();
    stYr.textContent = Math.floor(year);
    stPpm.textContent = ppm.toFixed(0);
    stPpm.className = 'v ' + (excess() > 130 ? 'bad' : excess() > 5 ? 'warn' : 'ok');
    stE.textContent = E.toFixed(1);
    stNet.textContent = (Fnet / GTC_PER_PPM >= 0 ? '+' : '') + (Fnet / GTC_PER_PPM).toFixed(2);
    stNet.className = 'v ' + (Fnet / GTC_PER_PPM > 0.3 ? 'bad' : 'ok');
    stPh.textContent = oceanpH().toFixed(2);
    stPh.className = 'v ' + (oceanpH() < 8.08 ? 'bad' : oceanpH() < 8.18 ? 'warn' : 'ok');
    updateFormula();
    drawPlot();
    syncUI();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
const targetYear = clamp(qsFloat('t', 2024), 1750, 2125);
year = 1750;
fastForward(targetYear);
if (emOverride !== null) elEm.value = emOverride;
setModeBtns();
applyTheme();
applyLang();
syncUI();
setPlayLabel();
start();
</script>
