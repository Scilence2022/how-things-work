<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多普勒效应 · 波前压缩、音障与马赫锥</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#7fd0f7;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.hi { color: #ff9f43; }
  #stats .v.lo { color: #7fd0f7; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.s  { color: #7ee2ae; border-color: rgba(67,209,124,.6); }
  .chip.w  { color: #bde9ff; border-color: rgba(127,208,247,.6); }
  .chip.mc { color: #ff9f9f; border-color: rgba(255,143,143,.7); }
  :root[data-theme="light"] .chip.s  { color: #148a5c; border-color: rgba(20,138,92,.6); }
  :root[data-theme="light"] .chip.w  { color: #0c7ba6; border-color: rgba(12,123,166,.6); }
  :root[data-theme="light"] .chip.mc { color: #b23b32; border-color: rgba(178,59,50,.7); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: default;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(127,208,247,.10); border-color: rgba(127,208,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #rewind { grid-column: 2; padding: 7px 10px; font-size: 12px; font-weight: 600;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; cursor: pointer; }
  #rewind:hover { border-color: var(--acc); color: var(--acc); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 108px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="多普勒效应：波前被压扁与拉长——直到冲破音障" data-en="The Doppler effect: wavefronts squeezed and stretched — until the sound barrier breaks">多普勒效应：波前被压扁与拉长——直到冲破音障</h1>
  <div class="sub" data-zh="音源逼近 → 波前压缩 → 音调变高;远离 → 拉长 → 变低。马赫 ≥ 1 时,所有波前叠成马赫锥 · 空格播放/暂停" data-en="Approaching → wavefronts bunch → pitch rises; receding → stretched → pitch falls. At Mach ≥ 1 every wavefront stacks into a Mach cone · Space = play/pause">音源逼近 → 波前压缩 → 音调变高;远离 → 拉长 → 变低。马赫 ≥ 1 时,所有波前叠成马赫锥 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="前方听到的频率" data-en="frequency ahead">前方听到的频率</span><span class="v hi" id="stHi">—</span>
  <span class="k" data-zh="后方听到的频率" data-en="frequency behind">后方听到的频率</span><span class="v lo" id="stLo">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip s" data-zh="音源(速度可调)" data-en="source (speed slider)">音源(速度可调)</span>
    <span class="chip w" data-zh="波前圆(半径 = c·t)" data-en="wavefronts (r = c·t)">波前圆(半径 = c·t)</span>
    <span class="chip mc" data-zh="马赫锥(M ≥ 1)" data-en="Mach cone (M ≥ 1)">马赫锥(M ≥ 1)</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="音源马赫数" data-en="Mach number">音源马赫数</label><input id="mach" type="range" min="0" max="160" step="5" value="60"><span class="val" id="machVal">M 0.60</span></div>
    <button id="rewind" data-zh="重放波前" data-en="Replay">重放波前</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCone" type="checkbox" checked> <span data-zh="马赫锥标注" data-en="Mach cone labels">马赫锥标注</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('多普勒效应 · 音障与马赫锥', 'Doppler Effect · Sound Barrier & Mach Cone');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}

/* ================= 物理量(世界坐标:像素≈米) ================= */
const CS = 220;            // 声速(虚拟 px/s)
const F0 = 2.2;            // 每秒发射 2.2 个波前(示意频率)
let mach = 0.6;            // 马赫数
let simT = 0, camX = 0;
let playing = true, speed = 1;
let showLabels = true, showCone = true;
let fronts = [];           // {x0, y0, birth}——发射时刻的音源位置
let lastEmit = -1;

const SRC_Y = 430;
const srcX = t => 300 + t * mach * CS;   // 音源世界坐标
function emitCount(t) { return Math.floor(t * F0); }

/* ================= 相位讲解(按马赫数点亮) ================= */
const STEPS = [
  { at: 0.0, b: '波前一圈圈扩散', d: '静止的音源每秒发出 2.2 个波前,每个都以声速 c 向四面八方扩——同心圆,均匀对称。',
    be: 'Wavefronts spread evenly', de: 'A still source emits 2.2 wavefronts per second, each expanding at sound speed c — concentric, symmetric circles.' },
  { at: 0.2, b: '亚音速:前压后疏', d: '音源边走边喊:前方的波前被追着压扁(波长变短 → 音调高),身后被拉长(音调低)。f′ = f·c/(c ∓ v)。',
    be: 'Subsonic: bunched ahead', de: 'A moving source chases its own wavefronts: ahead they bunch (shorter wavelength, higher pitch), behind they stretch. f′ = f·c/(c ∓ v).' },
  { at: 0.95, b: '音障:Mach = 1', d: '音源追平自己的波前——所有波前在同一位置叠成一道墙,阻力陡增,这就是「音障」。',
    be: 'Sound barrier: Mach 1', de: 'The source catches its own wavefronts — they all pile up into one wall of compressed air: the sound barrier.' },
  { at: 1.15, b: '超音速:马赫锥', d: '甩开波前后,波前再也追不上音源,叠成一个以音源为顶的锥——地面听到的「音爆」就是锥面扫过。',
    be: 'Supersonic: Mach cone', de: 'Outrunning its own wavefronts, they stack into a cone trailing the source — the sonic boom is that cone sweeping the ground.' },
  { at: 1.45, b: '锥角 = asin(1/M)', d: '马赫数越大,锥越尖:half-angle = asin(1/M)。M = 2 时只有 30°——所以超音速飞机的音爆带又窄又响。',
    be: 'Cone angle = asin(1/M)', de: 'Higher Mach, narrower cone: half-angle = asin(1/M). At M = 2 it is just 30° — that is why sonic booms come in narrow, loud bands.' },
];
function stepIndex() {
  let si = 0;
  STEPS.forEach((s, i) => { if (mach >= s.at) si = i; });
  return si;
}

/* ================= 绘制 ================= */
function drawFronts(t) {
  const nEmit = emitCount(t);
  const cam = camX;
  ctx.lineWidth = 2;
  for (let i = Math.max(0, nEmit - 46); i <= nEmit; i++) {
    const birth = i / F0;
    const age = t - birth;
    if (age < 0) continue;
    const r = age * CS;
    if (r > 2600) continue;
    const x0 = srcX(birth) - cam, y0 = SRC_Y;
    const fade = clamp(1 - r / 2600, 0.06, 1);
    ctx.strokeStyle = `rgba(127,208,247,${fade * 0.55})`;
    circle(x0, y0, r, null, null);
    ctx.stroke();
  }
}
function drawCone(t) {
  if (mach <= 1 || !showCone) return;
  const sx = srcX(t) - camX, sy = SRC_Y;
  const half = Math.asin(1 / mach);
  const L = 900;
  ctx.strokeStyle = 'rgba(255,143,143,.75)'; ctx.lineWidth = 2.5;
  for (const s of [-1, 1]) {
    line(sx, sy, sx - L * Math.cos(half), sy + s * L * Math.sin(half), 'rgba(255,143,143,.75)', 2.5);
  }
  if (showLabels) {
    text(L(`马赫锥 half-angle = asin(1/${mach.toFixed(2)}) = ${(half * 180 / Math.PI).toFixed(0)}°`,
      `Mach cone: asin(1/${mach.toFixed(2)}) = ${(half * 180 / Math.PI).toFixed(0)}°`),
      sx - 340, sy + 150 * Math.tan(half) + 40, 13, '#ff9f9f', 'center', 700);
    text(L('音爆:锥面扫过你时才听到', 'sonic boom: heard only when the cone sweeps you'),
      sx - 340, sy + 150 * Math.tan(half) + 64, 12, PAL.dim2, 'center');
  }
}
function drawSource(t) {
  const sx = srcX(t) - camX, sy = SRC_Y;
  dot(sx, sy, 13, '#7ee2ae', 16);
  ctx.strokeStyle = '#0d1117'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(sx - 6, sy - 2); ctx.lineTo(sx + 6, sy - 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(sx, sy + 4, 5, 0, Math.PI); ctx.stroke();
  if (showLabels) text(L('音源', 'source'), sx, sy - 26, 13, '#7ee2ae', 'center', 700);
  function dot(x, y, r, c, g) {
    if (g) { ctx.shadowColor = c; ctx.shadowBlur = g; }
    circle(x, y, r, c, null);
    ctx.shadowBlur = 0;
  }
}
function drawHUD(t) {
  // 地面参考线(随相机滚动,给出移动感)
  const off = -camX % 80;
  for (let x = off; x < W; x += 80) line(x, H - 60, x - 30, H - 40, 'rgba(154,167,184,.25)', 2);
  line(0, H - 60, W, H - 60, 'rgba(154,167,184,.3)', 2);
  // 马赫标尺
  text(L(`M = ${mach.toFixed(2)}`, `M = ${mach.toFixed(2)}`), 60, 80, 26, '#ffd166', 'left', 700);
  const names = [[0, '静止'], [0.2, '亚音速'], [1.0, '音障'], [1.15, '超音速 · 马赫锥']];
  names.forEach(([m, s], idx) => {
    const next = names[idx + 1];
    const on = mach >= m && (!next || mach < next[0]);
    text(L(s, s), 60, 112 + idx * 24, on ? 13 : 11.5, on ? '#ffd166' : PAL.dim2, 'left', on ? 700 : 500);
  });
}
function updateStats(t) {
  const c = CS, v = mach * CS;
  const hi = mach < 1 ? F0 * c / (c - v) : Infinity;
  const lo = F0 * c / (c + v);
  document.getElementById('stHi').innerHTML = mach >= 1 ? L('∞<small> 音爆</small>', '∞<small> boom</small>') : `×${(hi / F0).toFixed(2)}<small> (${hi.toFixed(1)} Hz)</small>`;
  document.getElementById('stLo').innerHTML = `×${(lo / F0).toFixed(2)}<small> (${lo.toFixed(1)} Hz)</small>`;
}

/* ================= 主绘制 ================= */
function draw(t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawFronts(t);
  drawCone(t);
  drawSource(t);
  drawHUD(t);
}

/* ================= UI / 主循环 ================= */
let last = performance.now();
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elMach = document.getElementById('mach');
const elMachVal = document.getElementById('machVal');
const elRewind = document.getElementById('rewind');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglCone = document.getElementById('tglCone');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elMach.addEventListener('input', () => { mach = parseInt(elMach.value, 10) / 100; elMachVal.textContent = 'M ' + mach.toFixed(2); });
elRewind.addEventListener('click', () => { simT = 0; fronts = []; lastEmit = -1; camX = 0; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglCone.addEventListener('change', () => { showCone = tglCone.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) {
    simT += dt * speed;
    camX = Math.max(0, srcX(simT) - 620);   // 相机跟随音源
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(simT);
  updateStats(simT);
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
requestAnimationFrame(frame);
</script>
</body>
</html>
