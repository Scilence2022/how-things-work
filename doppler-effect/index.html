<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多普勒效应 · 音障与马赫锥</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#7fd0f7;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --mach:#ffd166;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --mach:#b07d10;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.s  { border-color: rgba(67,209,124,.85); color: #7ee2ae; }
  .lbl.mc { border-color: rgba(255,143,143,.85); color: #ff9f9f; }
  .lbl.ob { border-color: rgba(255,169,77,.85); color: #ffd9a3; }
  .lbl.bm { border-color: rgba(255,80,80,.95); color: #ff6b6b; font-weight: 700; font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.s  { color: #148a5c; }
  :root[data-theme="light"] .lbl.mc { color: #b23b32; }
  :root[data-theme="light"] .lbl.ob { color: #b25d06; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }

  #hud { position: fixed; top: 96px; left: 22px; z-index: 4; pointer-events: none;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    padding: 10px 14px; backdrop-filter: blur(6px); }
  #mBig { font-size: 24px; font-weight: 700; color: var(--mach); font-variant-numeric: tabular-nums; }
  #regimes { margin-top: 6px; display: grid; gap: 2px; }
  #regimes span { font-size: 11.5px; color: var(--text2); transition: color .15s; }
  #regimes span.on { font-size: 13px; font-weight: 700; color: var(--mach); }
  #coneAng { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--panel-border);
    font-size: 12px; font-weight: 700; color: #ff9f9f; font-variant-numeric: tabular-nums; }
  :root[data-theme="light"] #coneAng { color: #b23b32; }
  #boomHint { margin-top: 3px; font-size: 11px; color: var(--text2); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.hi { color: #ff9f43; }
  #stats .v.lo { color: #7fd0f7; }
  :root[data-theme="light"] #stats .v.lo { color: #1580a3; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.s  { color: #7ee2ae; border-color: rgba(67,209,124,.6); }
  .chip.w  { color: #bde9ff; border-color: rgba(127,208,247,.6); }
  .chip.mc { color: #ff9f9f; border-color: rgba(255,143,143,.7); }
  .chip.ob { color: #ffd9a3; border-color: rgba(255,169,77,.65); }
  :root[data-theme="light"] .chip.s  { color: #148a5c; border-color: rgba(20,138,92,.6); }
  :root[data-theme="light"] .chip.w  { color: #0c7ba6; border-color: rgba(12,123,166,.6); }
  :root[data-theme="light"] .chip.mc { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.ob { color: #b25d06; border-color: rgba(178,93,6,.6); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(127,208,247,.10); border-color: rgba(127,208,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #rewind { grid-column: 2; padding: 7px 10px; font-size: 12px; font-weight: 600;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; cursor: pointer; }
  #rewind:hover { border-color: var(--acc); color: var(--acc); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row.wide { grid-column: 1 / -1; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 108px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 62px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats, #hud { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="多普勒效应:波前被压扁与拉长——直到冲破音障" data-en="The Doppler effect: wavefronts squeezed and stretched — until the sound barrier breaks">多普勒效应:波前被压扁与拉长——直到冲破音障</h1>
  <div class="sub" data-zh="音源逼近 → 波前压缩 → 音调变高;远离 → 拉长 → 变低。马赫 ≥ 1 时,所有波前叠成马赫锥 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Approaching → wavefronts bunch → pitch rises; receding → stretched → pitch falls. At Mach ≥ 1 every wavefront stacks into a Mach cone · 3D interactive · drag to orbit / scroll to zoom · Space = play/pause">音源逼近 → 波前压缩 → 音调变高;远离 → 拉长 → 变低。马赫 ≥ 1 时,所有波前叠成马赫锥 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="hud">
  <div id="mBig">M = 0.60</div>
  <div id="regimes"></div>
  <div id="coneAng">—</div>
  <div id="boomHint" data-zh="音爆:锥面扫过观察者时才听到" data-en="boom: heard only when the cone sweeps past">音爆:锥面扫过观察者时才听到</div>
</div>

<div id="stats">
  <span class="k" data-zh="前方听到的频率" data-en="frequency ahead">前方听到的频率</span><span class="v hi" id="stHi">—</span>
  <span class="k" data-zh="后方听到的频率" data-en="frequency behind">后方听到的频率</span><span class="v lo" id="stLo">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip s" data-zh="音源(速度可调)" data-en="source (speed slider)">音源(速度可调)</span>
    <span class="chip w" data-zh="波前球面(半径 = c·t)" data-en="wavefront shells (r = c·t)">波前球面(半径 = c·t)</span>
    <span class="chip mc" data-zh="马赫锥(M ≥ 1)" data-en="Mach cone (M ≥ 1)">马赫锥(M ≥ 1)</span>
    <span class="chip ob" data-zh="地面观察者" data-en="ground observer">地面观察者</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="音源马赫数" data-en="Mach number">音源马赫数</label><input id="mach" type="range" min="0" max="160" step="5" value="60"><span class="val" id="machVal">M 0.60</span></div>
    <button id="rewind" data-zh="重放波前" data-en="Replay">重放波前</button>
    <div class="row wide"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row wide"><label data-zh="相位" data-en="Phase">相位</label><input id="phase" type="range" min="0" max="60" step="0.1" value="0"><span class="val" id="phaseVal">t = 0.0 s</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCone" type="checkbox" checked> <span data-zh="马赫锥标注" data-en="Mach cone labels">马赫锥标注</span></label>
    <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../resonance-beats/" data-zh="共振与拍:声波叠加的另一面" data-en="resonance & beats: waves adding up">共振与拍:声波叠加的另一面</a>
    <a href="../refraction/" data-zh="折射:波前为什么会拐弯" data-en="refraction: wavefronts bending">折射:波前为什么会拐弯</a>
    <a href="../cochlea/" data-zh="耳蜗:把频率翻译成音高" data-en="cochlea: frequency → pitch">耳蜗:把频率翻译成音高</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 55, 190);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const bg = THEME === 'light' ? 0xeef1f6 : 0x10141b;
  scene.background = new THREE.Color(bg);
  scene.fog.color.set(bg);
  floor.material.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('多普勒效应 · 音障与马赫锥', 'Doppler Effect · Sound Barrier & Mach Cone');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);
camera.position.set(-13, 10, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(3, 2.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 150;
controls.maxPolarAngle = 1.53;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(4, 10, 6);
scene.add(key);

/* ================= 物理量(世界单位 ≈ 米) ================= */
const C = 6;               // 声速(视觉单位/s)
const F0 = 2.2;            // 每秒发射 2.2 个波前(示意频率)
const ALT = 3;             // 音源飞行高度
const RMAX = 80;           // 波前最大半径(淡出回收)
const POOL = 44;           // 波前池大小
const OBS = { x: 42, y: 0, z: 6 };               // 地面观察者(固定世界坐标,音源从它头顶飞过)
const DAX = Math.hypot(ALT, OBS.z);              // 观察者到航线的距离

let mach = clamp(qsFloat('mach', 0.6), 0, 1.6);
let simT = 0, srcPosX = 0;
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let showLabels = true, showCone = true;
let emitted = 0, ringT = 0, hitT = 0, boomT = 0, boomDone = false;

/* ================= 场景:地面 / 网格 ================= */
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(400, 0.2, 120),
  new THREE.MeshStandardMaterial({ color: 0x1b212c, roughness: 0.95, metalness: 0 })
);
floor.position.y = -0.1;
scene.add(floor);
const grid = new THREE.GridHelper(400, 80, 0x5a6a80, 0x39434f);
grid.material.transparent = true;
grid.material.opacity = 0.4;
scene.add(grid);

/* ================= 音源(小喷气机) ================= */
const jet = new THREE.Group();
scene.add(jet);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xaab6c6, metalness: 0.65, roughness: 0.3 });
const greenMat = new THREE.MeshStandardMaterial({ color: 0x43d17c, emissive: 0x2fbf71, emissiveIntensity: 0.8, roughness: 0.4 });
{
  const fus = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.9, 6, 12), bodyMat);
  fus.rotation.z = Math.PI / 2;
  jet.add(fus);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.45, 14), greenMat);
  nose.rotation.z = -Math.PI / 2;
  nose.position.x = 0.78;
  jet.add(nose);
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), greenMat);
  canopy.scale.set(1.5, 0.8, 0.9);
  canopy.position.set(0.22, 0.15, 0);
  jet.add(canopy);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.03, 1.8), bodyMat);
  wing.position.x = -0.08;
  jet.add(wing);
  const tailV = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.36, 0.03), bodyMat);
  tailV.position.set(-0.62, 0.18, 0);
  jet.add(tailV);
  const tailH = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.03, 0.72), bodyMat);
  tailH.position.set(-0.62, 0.05, 0);
  jet.add(tailH);
}
/* 发射节拍脉冲环 */
const ringMat = new THREE.MeshBasicMaterial({ color: 0x7ee2ae, transparent: true, opacity: 0 });
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.025, 8, 40), ringMat);
ring.rotation.y = Math.PI / 2;
jet.add(ring);

/* ================= 波前球壳池 ================= */
const frontGeo = new THREE.SphereGeometry(1, 28, 18);
const pool = [];
let ptr = 0;
for (let i = 0; i < POOL; i++) {
  const g = new THREE.Group();
  const shellMat = new THREE.MeshBasicMaterial({ color: 0x7fd0f7, transparent: true, opacity: 0, depthWrite: false });
  const wireMat = new THREE.MeshBasicMaterial({ color: 0x7fd0f7, wireframe: true, transparent: true, opacity: 0, depthWrite: false });
  g.add(new THREE.Mesh(frontGeo, shellMat));
  g.add(new THREE.Mesh(frontGeo, wireMat));
  g.visible = false;
  scene.add(g);
  pool.push({ g, shellMat, wireMat, active: false, birth: 0, x0: 0, prevS: 0 });
}
function emitFront(birth, x0) {
  const f = pool[ptr]; ptr = (ptr + 1) % POOL;
  f.active = true; f.birth = birth; f.x0 = x0; f.prevS = 0;
  f.g.position.set(x0, ALT, 0);
  f.g.scale.setScalar(0.001);
  f.g.visible = true;
}
function rebuildFronts() {
  for (const f of pool) { f.active = false; f.g.visible = false; }
  ptr = 0;
  const n = Math.floor(simT * F0);
  for (let i = Math.max(0, n - POOL + 1); i <= n; i++)
    emitFront(i / F0, srcPosX - (simT - i / F0) * mach * C);
  emitted = n;
}

/* ================= 马赫锥(M > 1) ================= */
const LC = 26;
const coneG = new THREE.Group();
scene.add(coneG);
const coneGeo = new THREE.ConeGeometry(1, 1, 48, 1, true);
const coneShellMat = new THREE.MeshBasicMaterial({ color: 0xff8f8f, transparent: true, opacity: 0.14, side: THREE.DoubleSide, depthWrite: false });
const coneWireMat = new THREE.MeshBasicMaterial({ color: 0xff8f8f, wireframe: true, transparent: true, opacity: 0.3, depthWrite: false });
const coneShell = new THREE.Mesh(coneGeo, coneShellMat);
const coneWire = new THREE.Mesh(coneGeo, coneWireMat);
for (const m of [coneShell, coneWire]) {
  m.rotation.z = -Math.PI / 2;   // 锥顶朝 +X(前进方向),开口拖在后方
  m.position.x = -LC / 2;
  coneG.add(m);
}

/* ================= 地面观察者 ================= */
const obsG = new THREE.Group();
obsG.position.set(OBS.x, 0, OBS.z);
scene.add(obsG);
const obsHeadMat = new THREE.MeshStandardMaterial({ color: 0xffa94d, emissive: 0xffa94d, emissiveIntensity: 0.2, roughness: 0.5 });
{
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.55, 6, 10),
    new THREE.MeshStandardMaterial({ color: 0xd08738, roughness: 0.6 }));
  body.position.y = 0.55;
  obsG.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), obsHeadMat);
  head.position.y = 1.1;
  obsG.add(head);
  const halo = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.45, 32),
    new THREE.MeshBasicMaterial({ color: 0xffa94d, transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
  halo.rotation.x = -Math.PI / 2;
  halo.position.y = 0.02;
  obsG.add(halo);
}

/* ================= 空气尘埃(InstancedMesh 粒子) ================= */
const DUST = 130;
const dust = new THREE.InstancedMesh(
  new THREE.TetrahedronGeometry(0.07),
  new THREE.MeshBasicMaterial({ color: 0x8a97a8, transparent: true, opacity: 0.45 }),
  DUST
);
const dustPos = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) {
  dustPos[i * 3] = -40 + Math.random() * 120;
  dustPos[i * 3 + 1] = 0.4 + Math.random() * 13;
  dustPos[i * 3 + 2] = -25 + Math.random() * 50;
}
scene.add(dust);
const dustDummy = new THREE.Object3D();

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const coneHalf = () => Math.asin(1 / Math.max(mach, 1.0001));
const lblSrc = addLabel(() => L(`音源 · M ${mach.toFixed(2)}`, `source · M ${mach.toFixed(2)}`),
  new THREE.Vector3(0, 1.2, 0), 's', jet);
const lblCone = addLabel(() => L(`马赫锥半角 asin(1/${mach.toFixed(2)}) = ${(coneHalf() * 180 / Math.PI).toFixed(0)}°`,
  `Mach half-angle asin(1/${mach.toFixed(2)}) = ${(coneHalf() * 180 / Math.PI).toFixed(0)}°`),
  new THREE.Vector3(-18, ALT + 6, 0), 'mc');
const lblObs = addLabel(() => boomT > 0 ? L('音爆!锥面扫过!', 'BOOM! the cone swept past!') : L('地面观察者', 'ground observer'),
  new THREE.Vector3(0, 1.8, 0), 'ob', obsG);

/* ================= 相位讲解(按马赫数点亮,点击跳转) ================= */
const STEPS = [
  { at: 0.0, setM: 0.0, b: '波前一圈圈扩散', d: '静止的音源每秒发出 2.2 个波前,每个都以声速 c 向四面八方扩——同心球面,均匀对称。',
    be: 'Wavefronts spread evenly', de: 'A still source emits 2.2 wavefronts per second, each expanding at sound speed c — concentric, symmetric shells.' },
  { at: 0.2, setM: 0.6, b: '亚音速:前压后疏', d: '音源边走边喊:前方的波前被追着压扁(波长变短 → 音调高),身后被拉长(音调低)。f′ = f·c/(c ∓ v)。',
    be: 'Subsonic: bunched ahead', de: 'A moving source chases its own wavefronts: ahead they bunch (shorter wavelength, higher pitch), behind they stretch. f′ = f·c/(c ∓ v).' },
  { at: 0.95, setM: 1.0, b: '音障:Mach = 1', d: '音源追平自己的波前——所有波前在同一位置叠成一道墙,阻力陡增,这就是「音障」。',
    be: 'Sound barrier: Mach 1', de: 'The source catches its own wavefronts — they all pile up into one wall of compressed air: the sound barrier.' },
  { at: 1.15, setM: 1.3, b: '超音速:马赫锥', d: '甩开波前后,波前再也追不上音源,叠成一个以音源为顶的锥——地面听到的「音爆」就是锥面扫过。',
    be: 'Supersonic: Mach cone', de: 'Outrunning its own wavefronts, they stack into a cone trailing the source — the sonic boom is that cone sweeping the ground.' },
  { at: 1.45, setM: 1.55, b: '锥角 = asin(1/M)', d: '马赫数越大,锥越尖:half-angle = asin(1/M)。M = 2 时只有 30°——所以超音速飞机的音爆带又窄又响。',
    be: 'Cone angle = asin(1/M)', de: 'Higher Mach, narrower cone: half-angle = asin(1/M). At M = 2 it is just 30° — that is why sonic booms come in narrow, loud bands.' },
];
function stepIndex() {
  let si = 0;
  STEPS.forEach((s, i) => { if (mach >= s.at) si = i; });
  return si;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => setMach(s.setM));
    el.appendChild(li);
  });
  [...el.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elMach = document.getElementById('mach');
const elMachVal = document.getElementById('machVal');
const elPhase = document.getElementById('phase');
const elPhaseVal = document.getElementById('phaseVal');
const elRewind = document.getElementById('rewind');
const tglLabels = document.getElementById('tglLabels');
const tglCone = document.getElementById('tglCone');
const tglRotate = document.getElementById('tglRotate');
const stHi = document.getElementById('stHi'), stLo = document.getElementById('stLo');
const mBig = document.getElementById('mBig'), coneAng = document.getElementById('coneAng');
const elRegimes = document.getElementById('regimes');
const REGIMES = [[0, '静止', 'at rest'], [0.2, '亚音速', 'subsonic'], [1.0, '音障', 'sound barrier'], [1.15, '超音速 · 马赫锥', 'supersonic · Mach cone']];
REGIMES.forEach(() => elRegimes.appendChild(document.createElement('span')));

function setMach(m) {
  mach = clamp(m, 0, 1.6);
  elMach.value = Math.round(mach * 100);
  elMachVal.textContent = 'M ' + mach.toFixed(2);
  boomDone = false;
}
function setSimTime(t, snap = true) {
  simT = Math.max(0, t);
  srcPosX = simT * mach * C;
  ringT = 0; hitT = 0; boomT = 0;
  boomDone = mach > 1 && srcPosX > OBS.x && Math.tan(coneHalf()) * (srcPosX - OBS.x) >= DAX;
  rebuildFronts();
  lblObs.element.classList.remove('bm');
  if (snap) {
    controls.target.set(srcPosX + 3, ALT * 0.9, 0);
    camera.position.set(srcPosX - 13, ALT + 7, 20);
  }
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elMach.addEventListener('input', () => setMach(parseInt(elMach.value, 10) / 100));
elRewind.addEventListener('click', () => setSimTime(0));
let phaseDrag = false;
elPhase.addEventListener('pointerdown', () => { phaseDrag = true; });
elPhase.addEventListener('pointerup', () => { phaseDrag = false; });
elPhase.addEventListener('input', () => setSimTime(parseFloat(elPhase.value), false));
tglLabels.addEventListener('change', () => {
  showLabels = tglLabels.checked;
  for (const r of labelRegistry) r.o.element.style.display = showLabels ? '' : 'none';
});
tglCone.addEventListener('change', () => { showCone = tglCone.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
if (!qsBool('cone', true)) { tglCone.checked = false; showCone = false; }
if (qsBool('spin', false)) { tglRotate.checked = true; controls.autoRotate = true; }
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function updateStats() {
  const v = mach * C;
  stHi.innerHTML = mach >= 1 ? L('∞<small> 音爆</small>', '∞<small> boom</small>')
    : `×${(C / (C - v)).toFixed(2)}<small> (${(F0 * C / (C - v)).toFixed(1)} Hz)</small>`;
  stLo.innerHTML = `×${(C / (C + v)).toFixed(2)}<small> (${(F0 * C / (C + v)).toFixed(1)} Hz)</small>`;
  mBig.textContent = `M = ${mach.toFixed(2)}`;
  [...elRegimes.children].forEach((el, i) => {
    const next = REGIMES[i + 1];
    const on = mach >= REGIMES[i][0] && (!next || mach < next[0]);
    el.classList.toggle('on', on);
    el.textContent = L(REGIMES[i][1], REGIMES[i][2]);
  });
  coneAng.textContent = mach > 1
    ? `asin(1/${mach.toFixed(2)}) = ${(coneHalf() * 180 / Math.PI).toFixed(0)}°`
    : L('asin(1/M) — 亚音速无锥', 'asin(1/M) — no cone subsonic');
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    simT += dts;
    srcPosX += mach * C * dts;
    /* 按节拍发射波前 */
    const targetN = Math.floor(simT * F0);
    while (emitted < targetN) {
      emitted++;
      emitFront(emitted / F0, srcPosX - (simT - emitted / F0) * mach * C);
      ringT = 1;
    }
  }
  ringT = Math.max(0, ringT - dt * 2.6);
  hitT = Math.max(0, hitT - dt);
  boomT = Math.max(0, boomT - dt);

  /* 音源 */
  jet.position.set(srcPosX, ALT, 0);
  ring.scale.setScalar(1 + (1 - ringT) * 1.8);
  ringMat.opacity = ringT * 0.75;

  /* 波前:扩散 + 淡出 + 观察者穿越检测 */
  for (const f of pool) {
    if (!f.active) continue;
    const r = (simT - f.birth) * C;
    if (r > RMAX) { f.active = false; f.g.visible = false; continue; }
    f.g.scale.setScalar(Math.max(r, 0.001));
    const fade = clamp(1 - r / RMAX, 0, 1);
    f.wireMat.opacity = 0.5 * fade;
    f.shellMat.opacity = 0.09 * fade;
    const d = Math.hypot(OBS.x - f.x0, OBS.y - ALT, OBS.z);
    const s = d > r ? 1 : -1;
    if (f.prevS !== 0 && s !== f.prevS && hitT <= 0) hitT = 0.22;
    f.prevS = s;
  }

  /* 马赫锥 */
  const coneOn = mach > 1 && showCone;
  coneG.visible = coneOn;
  if (coneOn) {
    const a = coneHalf(), R = LC * Math.tan(a);
    coneShell.scale.set(R, LC, R);
    coneWire.scale.set(R, LC, R);
    coneG.position.set(srcPosX, ALT, 0);
    lblCone.position.set(srcPosX - LC * 0.72, ALT + R * 0.72 + 0.8, 0);
    /* 音爆:锥面扫过地面观察者 */
    if (!boomDone && srcPosX > OBS.x && Math.tan(a) * (srcPosX - OBS.x) >= DAX) {
      boomDone = true;
      boomT = 1.6;
      lblObs.element.classList.add('bm');
    }
  }
  lblCone.element.style.display = showLabels && coneOn ? '' : 'none';
  if (boomT <= 0) lblObs.element.classList.remove('bm');

  /* 观察者受激闪烁 */
  obsHeadMat.emissive.set(boomT > 0 ? 0xff5040 : 0xffa94d);
  obsHeadMat.emissiveIntensity = 0.2 + boomT * 2 + hitT * 2.5;
  obsG.scale.setScalar(1 + boomT * 0.25);

  /* 尘埃粒子(InstancedMesh):慢漂移,跟随音源回绕 */
  for (let i = 0; i < DUST; i++) {
    let x = dustPos[i * 3];
    if (playing) x -= dts * 0.4;
    if (x < srcPosX - 45) x += 120;
    else if (x > srcPosX + 75) x -= 120;
    dustPos[i * 3] = x;
    dustDummy.position.set(x, dustPos[i * 3 + 1] + Math.sin(simT * 0.6 + i) * 0.15, dustPos[i * 3 + 2]);
    dustDummy.updateMatrix();
    dust.setMatrixAt(i, dustDummy.matrix);
  }
  dust.instanceMatrix.needsUpdate = true;

  /* 地面 / 网格跟随(按网格单元吸附避免滑动) */
  floor.position.x = srcPosX;
  grid.position.x = Math.round(srcPosX / 5) * 5;

  /* 相机跟随音源(保留用户环绕/缩放) */
  if (playing) {
    const d = new THREE.Vector3(srcPosX + 3, ALT * 0.9, 0).sub(controls.target).multiplyScalar(Math.min(1, dt * 2.5));
    controls.target.add(d);
    camera.position.add(d);
  }

  /* HUD / 标签 / 步骤 */
  updateStats();
  if (!phaseDrag) elPhase.value = Math.min(simT, 60);
  elPhaseVal.textContent = `t = ${simT.toFixed(1)} s`;
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* 标签页隐藏时停 rAF,回来再续 */
let raf = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else if (!raf) { clock.getDelta(); raf = requestAnimationFrame(frame); }
});

setMach(mach);
setSimTime(qsFloat('t', 0));
applyTheme();
applyLang();
setPlayLabel();
updateStats();
raf = requestAnimationFrame(frame);
</script>
</body>
</html>
