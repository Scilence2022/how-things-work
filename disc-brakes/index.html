<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>盘式刹车与热衰退 · 裸露在气流里的摩擦面</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e03131;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b02525;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(224,49,49,.6);background:rgba(224,49,49,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,37,37,.55);background:rgba(176,37,37,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(224,49,49,.10);border-color:rgba(224,49,49,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,37,37,.08);border-color:rgba(176,37,37,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffc9c9}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="盘式刹车与热衰退" data-en="Disc Brakes &amp; Brake Fade">盘式刹车与热衰退</h1>
  <div class="sub" data-zh="卡钳液压把摩擦片夹住旋转的通风盘 → 摩擦面完全裸露在气流里,散热远胜鼓式 → 盘内辐条被转成离心风扇,打孔/划线排出摩擦面气体与水膜 → 增益≈1:踩多少液压得多少力矩,线性稳定但要更大液压(与鼓式自增力相反)→ 热衰退两路:摩擦片高温析出气体垫开接触面=μ 掉;制动液沸腾=踏板变海绵 → 长下坡连续制动是最经典的衰退现场 · 拖动旋转 / 空格运行/暂停" data-en="Caliper hydraulics clamp the pads on a spinning vented rotor → friction faces fully exposed to airflow, cooling far better than drums → internal vanes spin into a centrifugal fan; drilled/slotted faces vent gas and water film → gain ≈ 1: torque tracks line pressure linearly and predictably, but needs higher pressure (the opposite of drum self-servo) → fade two ways: hot pads outgas a cushion that lifts the friction film (μ drops); brake fluid boils (pedal goes spongy) → dragging brakes down a long descent is the classic fade scene · drag to orbit / Space = run/pause">卡钳液压把摩擦片夹住旋转的通风盘 → 摩擦面完全裸露在气流里,散热远胜鼓式 → 盘内辐条被转成离心风扇,打孔/划线排出摩擦面气体与水膜 → 增益≈1:踩多少液压得多少力矩,线性稳定但要更大液压(与鼓式自增力相反)→ 热衰退两路:摩擦片高温析出气体垫开接触面=μ 掉;制动液沸腾=踏板变海绵 → 长下坡连续制动是最经典的衰退现场 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

<div id="stats">
  <span class="k" data-zh="制动力矩" data-en="Brake torque">制动力矩</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="盘温" data-en="Disc temp">盘温</span><span class="v" id="stTemp">—</span>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bVent" data-zh="打孔通风盘" data-en="Drilled vented">打孔通风盘</button>
    <button class="abtn" id="bSolid" data-zh="实心盘" data-en="Solid rotor">实心盘</button>

  <div class="row">
    <label data-zh="液压" data-en="Line pressure">液压</label>
    <input id="sP" type="range" min="0.5" max="6" step="0.1" value="3">

  <div class="row">
    <label data-zh="车速" data-en="Speed">车速</label>
    <input id="sV" type="range" min="20" max="100" step="5" value="60">
    <span class="val" id="sVVal">60 km/h</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="剖面视" data-en="Cutaway">剖面视</span></label>

    <span data-zh="相关:" data-en="Related:">相关:</span>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x111214,14,42);
const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,0.1,200);
camera.position.set(2.9,1.5,6.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=18;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-2.15;scene.add(ground);
const D2R=Math.PI/180;
const polar=(deg,r,z=0)=>new THREE.Vector3(r*Math.cos(deg*D2R),r*Math.sin(deg*D2R),z);

/* ── 旋转体:通风盘(前后板+辐条)+轮毂,轴线沿 Z ── */
const rotorG=new THREE.Group();scene.add(rotorG);
const rotM=new THREE.MeshStandardMaterial({color:0x9aa6b6,roughness:0.32,metalness:0.72,
  emissive:0xff2200,emissiveIntensity:0});
const rotFrontM=new THREE.MeshStandardMaterial({color:0xa6b2c2,roughness:0.3,metalness:0.72,
  transparent:true,opacity:0.48,emissive:0xff2200,emissiveIntensity:0,depthWrite:false});
const plateBack=new THREE.Mesh(new THREE.RingGeometry(0.62,1.5,72),rotM);
plateBack.position.z=-0.07;rotorG.add(plateBack);
const plateFront=new THREE.Mesh(new THREE.RingGeometry(0.62,1.5,72),rotFrontM);
plateFront.position.z=0.07;rotorG.add(plateFront);
const vaneM=new THREE.MeshStandardMaterial({color:0x76828f,roughness:0.5,metalness:0.6,
  emissive:0xff2200,emissiveIntensity:0});
const vanes=[];
for(let i=0;i<22;i++){
  const v=new THREE.Mesh(new THREE.BoxGeometry(0.82,0.145,0.028),vaneM);
  const a=i*(360/22);
  v.position.copy(polar(a,1.08,0));v.rotation.z=a*D2R;
  rotorG.add(v);vanes.push(v);
}
const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.44,0.62,0.34,40),
  new THREE.MeshStandardMaterial({color:0x8a96a8,roughness:0.4,metalness:0.7}));
neck.rotation.x=Math.PI/2;neck.position.z=-0.28;rotorG.add(neck);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.55,40),
  new THREE.MeshStandardMaterial({color:0x4a5462,roughness:0.45,metalness:0.6}));
hub.rotation.x=Math.PI/2;hub.position.z=-0.62;rotorG.add(hub);
const studM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.3,metalness:0.85});
for(let i=0;i<5;i++){
  const st=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.5,10),studM);
  st.rotation.x=Math.PI/2;st.position.copy(polar(i*72,0.64,-0.72));rotorG.add(st);
}
const mark=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.06,0.04),
  new THREE.MeshStandardMaterial({color:0xe03131,roughness:0.4,emissive:0xe03131,emissiveIntensity:0.6}));
mark.position.set(1.32,0,0.09);rotorG.add(mark);
/* 打孔 */
const holeM=new THREE.MeshStandardMaterial({color:0x14161a,roughness:0.9});
const holes=new THREE.Group();rotorG.add(holes);
for(let i=0;i<12;i++){
  const h=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.23,10),holeM);
  h.rotation.x=Math.PI/2;h.position.copy(polar(i*30,1.18,0));holes.add(h);
}
for(let i=0;i<8;i++){
  const h=new THREE.Mesh(new THREE.CylinderGeometry(0.024,0.024,0.23,10),holeM);
  h.rotation.x=Math.PI/2;h.position.copy(polar(i*45+22,1.38,0));holes.add(h);
}
/* ── 浮动卡钳:桥身跨过盘缘,单活塞压内片 ── */
const calM=new THREE.MeshStandardMaterial({color:0xb23a3a,roughness:0.42,metalness:0.35,
  transparent:true,opacity:0.92});
const calG=new THREE.Group();scene.add(calG);
const body=new THREE.Mesh(new THREE.BoxGeometry(0.62,1.06,0.86),calM);
body.position.copy(polar(90,1.72,0));calG.add(body);
const bridge=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.3,0.95),calM);
bridge.position.copy(polar(90,2.18,0));calG.add(bridge);
const fingerM=new THREE.MeshStandardMaterial({color:0x8a2f2f,roughness:0.5,metalness:0.3});
for(const sz of [-0.4,0.4]){
  const f=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.62,0.14),fingerM);
  f.position.copy(polar(90,1.62,sz));calG.add(f);
}
const pisM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.22,metalness:0.85});
const piston=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,0.16,26),pisM);
piston.rotation.x=Math.PI/2;piston.position.copy(polar(90,1.3,0.44));calG.add(piston);
/* ── 摩擦片(背板+衬片),轴向夹紧 ── */
function bandGeo(a0,a1,ro,ri,depth){
  const s=new THREE.Shape();
  s.absarc(0,0,ro,a0*D2R,a1*D2R,false);
  s.absarc(0,0,ri,a1*D2R,a0*D2R,true);
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:36});
  g.translate(0,0,-depth/2);return g;
}
const backM=new THREE.MeshStandardMaterial({color:0x5c6675,roughness:0.6,metalness:0.5});
const linHotM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.75,
  emissive:0xff3300,emissiveIntensity:0});
function makePad(){
  const grp=new THREE.Group();
  const back=new THREE.Mesh(bandGeo(56,124,1.5,1.02,0.045),backM);grp.add(back);
  const lin=new THREE.Mesh(bandGeo(56,124,1.44,1.08,0.05),linHotM);grp.add(lin);
  scene.add(grp);return grp;
}
const padIn=makePad(),padOut=makePad();
padIn.position.z=0.115;padOut.rotation.x=Math.PI;padOut.position.z=-0.115;
/* ── 液压管路 + 储液罐气泡 ── */
const lineCurve=new THREE.CatmullRomCurve3([
  polar(90,1.95,0.45),polar(115,2.3,0.5),polar(150,2.1,0.4),polar(185,1.4,0.2)]);
const lineMesh=new THREE.Mesh(new THREE.TubeGeometry(lineCurve,40,0.035,10),
  new THREE.MeshStandardMaterial({color:0x2f353d,roughness:0.6,transparent:true,opacity:0.85}));
scene.add(lineMesh);
const fluidPulse=[];
for(let i=0;i<4;i++){
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.045,10,8),
    new THREE.MeshStandardMaterial({color:0xffc04d,emissive:0xffc04d,emissiveIntensity:0.9}));
  scene.add(s);fluidPulse.push({m:s,t:i/4});
}
const resM=new THREE.MeshStandardMaterial({color:0xbfd4e2,roughness:0.2,transparent:true,opacity:0.4});
const reservoir=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.5,20),resM);
reservoir.position.copy(polar(188,1.65,0.15));scene.add(reservoir);
const bubble=new THREE.Mesh(new THREE.SphereGeometry(0.09,14,12),
  new THREE.MeshStandardMaterial({color:0xf1f7fb,roughness:0.1,transparent:true,opacity:0.85}));
bubble.position.copy(reservoir.position).add(new THREE.Vector3(0,0.1,0));scene.add(bubble);

/* ── 状态与热物理 ── */
let p=3,vKmh=60,vented=true,drag=false,playing=true,labelsOn=true,slowMo=false,cutaway=true;
let temp=25,v=16.7,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const A_PISTON=5e-4,R_EFF=0.105,R_W=0.28,M_VEH=1200,C_TH=3450;
function cycleEnv(t){const c=t%4.6;
  if(c<0.4)return smooth(c/0.4);
  if(c<3.0)return 1;
  if(c<3.4)return 1-smooth((c-3.0)/0.4);
  return 0;}
function muEff(){
  const k1=clamp((temp-80)/320,0,1);           /* 高温整体滑落 */
  const k2=clamp((temp-300)/150,0,1);          /* >300 ℃:析出气体垫开接触面 */
  return 0.42*(1-0.30*k1)*(1-0.22*k2);
}
let st={T:0,mu:0.42,decel:0,env:0,stroke:0};

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblPis=addLabel(()=>L(`活塞 ${st.env>0.05?p.toFixed(1)+' MPa 液压':'待命'}`,
    st.env>0.05?`piston @ ${p.toFixed(1)} MPa`:'piston idle'),
  new THREE.Vector3(0,1.95,0.75),'o');
const lblIn=addLabel(()=>L('内摩擦片:活塞直接压','inner pad: pushed by the piston'),
  new THREE.Vector3(1.35,1.25,0.55),'g');
const lblOut=addLabel(()=>L('外摩擦片:卡钳滑移反压','outer pad: clamped by caliper slide'),
  new THREE.Vector3(-1.7,0.9,-0.4),'b');
const lblVane=addLabel(()=>L('通风辐条 = 离心风扇:抽气带走热量','vented vanes = centrifugal fan pumping heat out'),
  new THREE.Vector3(-1.1,-1.55,0.2),'y',()=>vented);
const lblHole=addLabel(()=>L('打孔:排出气体/水膜,防衰退打滑','drillings: vent gas & water film, anti-fade'),
  new THREE.Vector3(0.4,-1.95,0.2),'g',()=>vented);
const lblFade=addLabel(()=>temp>300
    ?L(`高温 ${temp.toFixed(0)} ℃:衬片析出气体垫开接触面 → μ 崩`,`${temp.toFixed(0)} °C: pad outgas lifts the film — μ collapsing`)
    :L('衬片工作温度正常','pad temperature normal'),
  new THREE.Vector3(-2.3,-0.6,0.5),()=>temp>300?'r':'g',()=>temp>200);
const lblBubble=addLabel(()=>L(`储液罐${st.stroke>0.25?'沸腾气泡!踏板行程 +'+(st.stroke*100).toFixed(0)+'%':'油液正常'}`,
    st.stroke>0.25?`boiling bubbles! pedal +${(st.stroke*100).toFixed(0)}%`:'fluid healthy'),
  new THREE.Vector3(-1.95,-1.75,0.3),()=>st.stroke>0.25?'r':'b');

function setP(vv){p=clamp(vv,0.5,6);
  document.getElementById('sP').value=p;
  document.getElementById('sPVal').textContent=p.toFixed(1)+' MPa';}
function setV(vv){vKmh=clamp(vv,20,100);
  document.getElementById('sV').value=vKmh;
  document.getElementById('sVVal').textContent=vKmh.toFixed(0)+' km/h';}
function setVented(vv){vented=vv;
  document.getElementById('bVent').classList.toggle('on',vv);
  document.getElementById('bSolid').classList.toggle('on',!vv);
  holes.visible=vv;
  vanes.forEach(v=>v.visible=vv);
  rotFrontM.opacity=vv?(cutaway?0.48:0.92):0.92;}
function setDrag(dd){drag=dd;
  document.getElementById('bDrag').classList.toggle('on',dd);}

const STEPS=[
 {b:'液压经管路涌向卡钳',be:'Pressure surges down the line',
  d:'踩下踏板,主缸建立液压,管路里的油柱把压强原样传到卡钳——帕斯卡定律管路无增益, gain 从这里就是 1:多少压强,多少夹力。',
  de:'Pedal down, the master cylinder builds line pressure and the fluid column delivers it unchanged to the caliper — Pascal\'s law adds no gain here; gain starts at exactly 1: pressure in, clamp force out.',
  act(){setVented(true);setP(1.5);setV(40);}},
 {b:'单活塞压住内摩擦片',be:'One piston presses the inner pad',
  d:'卡钳壳体内的活塞把内摩擦片直接压向盘面:夹力=液压×活塞面积。盘式没有自增力,夹力全程正比于液压——这就是它「线性、稳定」的根源。',
  de:'The piston inside the caliper shoves the inner pad straight onto the disc: clamp = pressure × piston area. With no self-servo, clamp force tracks pressure perfectly — the root of the disc brake\'s linearity and stability.',
  act(){setP(3);}},
 {b:'浮动卡钳反压外片',be:'The floating caliper clamps the outer pad',
  d:'活塞推内片时,反作用力把整个卡钳壳体往回滑,外摩擦片被同步压向另一面——单活塞也能双侧均匀夹紧,还省掉一套液压缸。',
  de:'As the piston pushes the inner pad, the reaction force slides the whole caliper body backward, pressing the outer pad onto the far face — one piston clamps both sides evenly, no second cylinder needed.',
  act(){setP(3.5);}},
 {b:'通风盘:盘内的离心风扇',be:'Vented rotor: the internal fan',
  d:'两片摩擦盘之间的辐条随盘旋转,把热空气从中心抽向边缘——泵风量 ∝ 转速;摩擦面整个泡在气流里,同样下坡,盘式比鼓式温度低得多。',
  de:'Vanes between the two rotor plates spin with the disc, pumping hot air from hub to rim — flow scales with speed; the friction faces bathe in airflow, so on the same descent discs run far cooler than drums.',
  act(){setVented(true);setV(80);setP(2.5);}},
 {b:'打孔/划线:给摩擦面排气',be:'Drillings: venting the friction face',
  d:'高温下衬片会析出气体、雨天会有水膜——它们垫在接触面之间让摩擦「打滑」;穿孔给这些气体和水一条逃逸通道,同时刮拭盘面保持清洁。',
  de:'Hot pads outgas and wet roads leave a water film — both cushion the contact patch and make friction skate; drilled holes give gas and water an escape path while wiping the disc clean.',
  act(){setVented(true);setP(4);}},
 {b:'热衰退:μ 随温度崩塌',be:'Fade: μ collapses with temperature',
  d:'连续制动把盘推过 300 ℃,衬片树脂分解、析出气体垫开接触面,μ 从 0.42 一路掉到 0.2 以下——同样的液压,力矩只剩一半,越踩越「空」。',
  de:'Sustained braking pushes the rotor past 300 °C; the pad resin breaks down and outgas cushions the contact, μ sliding from 0.42 toward 0.2 — same pedal, half the torque, a pedal that feels emptier every stop.',
  act(){setDrag(true);setVented(true);setP(5);setV(90);}},
 {b:'制动液沸腾:踏板变海绵',be:'Fluid boils: the pedal goes spongy',
  d:'卡钳是最热的地方,油液局部沸腾产生气泡——气体可压缩,踏板行程变长、脚感像踩海绵(DOT4 干沸点约 230 ℃)。定期换油、不给气泡留机会,是盘式刹车的保命保养。',
  de:'The caliper runs hottest; fluid boils locally into vapor — and vapor compresses, so pedal travel grows and the pedal feels like a sponge (DOT4 dry boiling point ≈ 230 °C). Regular fluid changes keep the bubbles out; it is survival maintenance.',
  act(){setDrag(true);setVented(true);setP(6);setV(100);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stT').innerHTML=st.T.toFixed(0)+'<small> N·m</small>';
  const tv=document.getElementById('stTemp');
  tv.innerHTML=temp.toFixed(0)+'<small> °C</small>';
  tv.className='v '+(temp>300?'warn':temp<120?'ok':'');
  const mv=document.getElementById('stMu');
  mv.innerHTML=st.mu.toFixed(2);
  mv.className='v '+(st.mu<0.28?'warn':'ok');
  document.getElementById('stA').innerHTML=st.decel.toFixed(1)+'<small> m/s²</small>';
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bVent').addEventListener('click',()=>setVented(true));
document.getElementById('bSolid').addEventListener('click',()=>setVented(false));
document.getElementById('bDrag').addEventListener('click',()=>setDrag(!drag));
document.getElementById('sP').addEventListener('input',e=>setP(+e.target.value));
document.getElementById('sV').addEventListener('input',e=>setV(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{cutaway=e.target.checked;setVented(vented);});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x111214:0xe9e4dc);
  scene.fog.color.setHex(dark?0x111214:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 物理 ── */
  const env=drag?1:cycleEnv(simT);
  const F=p*500*env;                    /* N */
  const mE=muEff();
  const T=2*mE*F*R_EFF;                 /* 双面夹紧 */
  const vT=vKmh/3.6;
  v=Math.max(0.4,v+(-(4*T/(M_VEH*R_W))+(vT-v)*0.35)*dts);
  const om=v/R_W;
  const pBrake=T*om;
  const coolK=(vented?1.45:1)*(1+v*0.024);
  const pCool=coolK*13*(temp-25);
  temp=Math.max(25,temp+(pBrake-pCool)/C_TH*dts);
  const stroke=clamp((temp-205)/120,0,1);       /* 近沸点→踏板行程 */
  st={T,mu:mE,decel:4*T/(M_VEH*R_W),env,stroke};
  /* ── 可视化 ── */
  const heatK=clamp((temp-80)/340,0,1);
  const rotEm=heatK*0.85;
  rotM.emissiveIntensity=rotEm;vaneM.emissiveIntensity=rotEm*0.8;rotFrontM.emissiveIntensity=rotEm;
  linHotM.emissiveIntensity=0.10*env+heatK*0.75;
  /* 夹紧动作:内片推近,外片(浮动)推近,活塞缩回 */
  const cl=0.035*env;
  padIn.position.z=0.115-cl;
  padOut.position.z=-0.115+cl;
  piston.position.z=0.44-cl*2;
  rotorG.rotation.z-=om*dts*0.2;
  calG.position.z=cl*0.5;
  /* 液压脉冲 */
  fluidPulse.forEach(fp=>{
    fp.m.visible=env>0.05;
    if(fp.m.visible){
      fp.t=(fp.t+dts*0.9)%1;
      fp.m.position.copy(lineCurve.getPointAt(fp.t));
    }
  });
  bubble.position.y=reservoir.position.y-0.12+0.24*stroke+Math.sin(simT*7)*0.012*stroke;
  bubble.scale.setScalar(0.3+stroke*1.2);
  bubble.material.opacity=0.25+stroke*0.6;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on;
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
setVented(true);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
