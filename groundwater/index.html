<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>地下水与含水层 · 藏在地下的慢速河网</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.k{border-color:rgba(200,180,150,.9);color:#efe0c8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.k{color:#7a5c33}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 330px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.bad{color:#ff6b6b}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 8px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  .abtn.k.on{border-color:rgba(200,180,150,.7);background:rgba(200,180,150,.12)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 84px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);
    border-top:1px dashed var(--panel-border);padding-top:7px}
  #formula b{color:var(--text3);font-weight:600}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="地下水与含水层" data-en="Groundwater & Aquifers">地下水与含水层</h1>
  <div class="sub" data-zh="雨水渗过包气带抵达潜水面,砂砾含水层像海绵储水;达西定律 v=K·i 驱动慢流,黏土 K 小万倍成隔水层;抽水拉出降落漏斗,超采让水位逐年下降、黏土压密致地面沉降;承压层被顶托→自流井;污染物顺流弥散数十年难净 · 拖抽水量/补给率/时间倍率,按「泄漏染料」看运移 · 拖动旋转 / 空格运行/暂停" data-en="Rain percolates through the vadose zone to the water table; sandy aquifers store water like a sponge. Darcy's law v=K·i drives the crawl; clay, ten-thousand-fold less permeable, seals aquitards. Pumping carves a cone of depression; overdraft drains the water table year by year and compacts clay into subsidence. Confined layers under pressure feed artesian wells; contaminants creep and disperse for decades · drag pumping/recharge/time, hit &quot;spill dye&quot; to watch transport · drag to orbit / Space = run/pause">雨水渗过包气带抵达潜水面,砂砾含水层像海绵储水;达西定律 v=K·i 驱动慢流,黏土 K 小万倍成隔水层;抽水拉出降落漏斗,超采让水位逐年下降、黏土压密致地面沉降;承压层被顶托→自流井;污染物顺流弥散数十年难净 · 拖抽水量/补给率/时间倍率,按「泄漏染料」看运移 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="抽水量 Q" data-en="Pumping Q">抽水量 Q</span><span class="v" id="stQ">—</span>
  <span class="k" data-zh="井内降深 s" data-en="Drawdown s">井内降深 s</span><span class="v" id="stS">—</span>
  <span class="k" data-zh="达西流速 v" data-en="Darcy velocity">达西流速 v</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="水位年变化" data-en="Water-level trend">水位年变化</span><span class="v" id="stT">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn k on" id="btnSand" data-zh="中砂 K=8 m/d" data-en="Sand K=8">中砂 K=8 m/d</button>
    <button class="abtn k" id="btnGravel" data-zh="砾石 K=40 m/d" data-en="Gravel K=40">砾石 K=40 m/d</button>
    <button class="abtn k" id="btnFine" data-zh="细砂 K=1.5 m/d" data-en="Fine K=1.5">细砂 K=1.5 m/d</button>
    <button class="abtn" id="btnSpill" data-zh="泄漏染料" data-en="Spill dye">泄漏染料</button>
    <button class="abtn" id="btnReset" data-zh="重置水位" data-en="Reset levels">重置水位</button>
    <button class="abtn" id="btnRain" data-zh="下一场雨" data-en="Rain now">下一场雨</button>
  </div>
  <div class="row"><label data-zh="抽水量 Q" data-en="Pumping Q">抽水量 Q</label><input id="sQ" type="range" min="0" max="2400" step="20" value="600"><span class="val" id="sQVal">600 m³/d</span></div>
  <div class="row"><label data-zh="补给率" data-en="Recharge">补给率</label><input id="sR" type="range" min="0" max="1600" step="20" value="800"><span class="val" id="sRVal">800 m³/d</span></div>
  <div class="row"><label data-zh="时间倍率" data-en="Time ×">时间倍率</label><input id="sT" type="range" min="1" max="365" step="1" value="30"><span class="val" id="sTVal">×30</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../poiseuille/" data-zh="泊肃叶流:管中慢流" data-en="Poiseuille flow: slow in tubes">泊肃叶流</a>
    <a href="../karst-cave/" data-zh="喀斯特溶洞:水的雕刻" data-en="Karst cave: water's sculpture">喀斯特溶洞</a>
    <a href="../river-meander/" data-zh="河曲:地表水的故事" data-en="River meander: the surface twin">河曲</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 水文地质锚点(真实公式):
   达西定律 v=K·i,i=dh/dl 水头梯度;渗透系数 K:砾石 ~40 m/d,中砂 ~8,细砂 ~1.5,黏土 <1e-4(隔水);
   稳定井流 Thiem:s(r)=Q·ln(Re/r)/(2πT),T=K·b 导水系数;补给<抽水 → 区域水位持续下降;
   黏土压密 → 地面沉降(华北平原/墨西哥城实测数十 cm~数 m);
   承压水头高于地表 → 自流井;溶质顺流对流+水动力弥散,十年~百年尺度 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
const speedMul=clamp(parseFloat(qs.get('speed'))||1,0.25,3);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,64);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0.2,2.9,14.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-1.0,-0.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=45;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161a,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.25);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 材质 ---- */
const soilM=new THREE.MeshStandardMaterial({color:0x8a6f47,roughness:0.95});
const aqM=new THREE.MeshStandardMaterial({color:0xc9a86a,roughness:0.95,transparent:true,opacity:0.42});
const clayM=new THREE.MeshStandardMaterial({color:0x6b6157,roughness:0.98});
const confM=new THREE.MeshStandardMaterial({color:0x7fa8c9,roughness:0.9,transparent:true,opacity:0.5});
const rockM=new THREE.MeshStandardMaterial({color:0x3a4048,roughness:0.98});
const wtM=new THREE.MeshStandardMaterial({color:0x2f8fd8,transparent:true,opacity:0.85,roughness:0.25,side:THREE.DoubleSide});
const streamM=new THREE.MeshStandardMaterial({color:0x4aa8e8,roughness:0.3,transparent:true,opacity:0.85});
const pipeM=new THREE.MeshStandardMaterial({color:0xd8dde2,roughness:0.35,metalness:0.5});
const wellWaterM=new THREE.MeshStandardMaterial({color:0x3b9de8,roughness:0.3,transparent:true,opacity:0.9});
const rainM=new THREE.MeshBasicMaterial({color:0x9fd8ff,transparent:true,opacity:0.9});
const dyeM=new THREE.MeshBasicMaterial({color:0xff4d4d,transparent:true,opacity:0.9});
const artM=new THREE.MeshBasicMaterial({color:0x9fd8ff,transparent:true,opacity:0.85});

/* ---- 地形函数 ---- */
const XW=1.6;                                        // 抽水井位置
const ys=x=>2.2+0.9*Math.exp(-Math.pow((x+7)/3.2,2))
              +0.55*Math.exp(-Math.pow((x-8.5)/2.6,2))
              -0.35*Math.exp(-Math.pow((x-3.6)/1.4,2)); // 地表高程
const hBase=x=>Math.max(0.12,
  0.25+1.05*Math.exp(-Math.pow((x+6.5)/4.2,2))
      -0.55*Math.exp(-Math.pow((x-3.6)/1.6,2)));     // 无抽取时的潜水面

/* ---- 地层 ---- */
const soil=new THREE.Mesh(new THREE.BoxGeometry(21,3.0,2),aqM);
soil.position.set(0,0.2,0);scene.add(soil);           // -1.3..1.7 半透含水层主体,潜水面在内部可见
const clay=new THREE.Mesh(new THREE.BoxGeometry(21,0.55,2),clayM);
clay.position.set(0,-3.05,0);scene.add(clay);         // 黏土隔水层 -3.325..-2.775
const conf=new THREE.Mesh(new THREE.BoxGeometry(21,1.3,2),confM);
conf.position.set(0,-3.95,0);scene.add(conf);         // 承压含水层 -4.6..-3.3
const rock=new THREE.Mesh(new THREE.BoxGeometry(21,0.9,2),rockM);
rock.position.set(0,-5.05,0);scene.add(rock);
/* 地表:44 块梯形柱(实例化),沉降时可逐块下沉 */
const SN=44;
const surfIM=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,2),soilM,SN);
scene.add(surfIM);
const surfX=[],surfBase=[];
for(let i=0;i<SN;i++){
  const x=-10.75+i*0.5;
  surfX.push(x);
  const top=ys(x),bot=-0.4;
  surfBase.push({top,bot});
}
const ZERO_M=new THREE.Matrix4().makeScale(0,0,0);
function zeroIM(im){for(let i=0;i<im.count;i++)im.setMatrixAt(i,ZERO_M);im.instanceMatrix.needsUpdate=true;}
zeroIM(surfIM);
let subShown=-1;
function updateSurface(sub){
  if(Math.abs(sub-subShown)<0.002)return;
  subShown=sub;
  const m=new THREE.Matrix4();
  for(let i=0;i<SN;i++){
    const x=surfX[i];
    const s=sub*Math.exp(-Math.pow((x-XW)/2.5,2));   // 沉降漏斗贴着抽水井
    const top=surfBase[i].top-s,bot=surfBase[i].bot;
    const h=Math.max(0.05,top-bot);
    m.makeScale(0.52,h,1);
    m.setPosition(x,(top+bot)/2,0);
    surfIM.setMatrixAt(i,m);
  }
  surfIM.instanceMatrix.needsUpdate=true;
}
updateSurface(0);

/* ---- 潜水面(随时间变形的曲面) ---- */
const wtGeo=new THREE.PlaneGeometry(21,2,84,1);
wtGeo.rotateX(-Math.PI/2);
const wt=new THREE.Mesh(wtGeo,wtM);scene.add(wt);
function hAt(x){
  const s0=Math.min(2.3,Q*0.0011)*pumpRamp;
  const w=1.0+Q*0.0006;
  return clamp(hBase(x)-s0*Math.exp(-Math.pow((x-XW)/w,2))+dH,0.06,3.3);
}
function refreshWT(){
  const pos=wtGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i);
    pos.setY(i,hAt(x));
  }
  pos.needsUpdate=true;
}
/* 河流:排泄点 */
const stream=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.5,2),streamM);
stream.position.set(3.6,ys(3.6)-0.18,0);scene.add(stream);

/* ---- 井 ---- */
function makeWell(x,depth){
  const g=new THREE.Group();
  g.position.x=x;                                   // 井定位在 x
  const top=ys(x);
  const pipe=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,depth,10),pipeM);
  pipe.position.y=top-depth/2;g.add(pipe);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.12,12),pipeM);
  rim.position.y=top+0.06;g.add(rim);
  const water=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1,8),wellWaterM);
  g.add(water);
  g.userData={x,depth,top,water};
  scene.add(g);return g;
}
const wellP=makeWell(XW,3.9);                          // 抽水井:穿潜水面进含水层
const wellA=makeWell(7.0,6.4);                         // 自流井:打穿黏土进承压层
const artHead=new THREE.Group();artHead.position.set(7.0,ys(7.0)+0.1,0);scene.add(artHead);
const artJet=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),artM,10);
scene.add(artJet);zeroIM(artJet);
const artP=[];for(let i=0;i<10;i++)artP.push({t:Math.random(),a:Math.random()*Math.PI,vx:0.8+Math.random()*0.8});
/* 降落漏斗标注圈 */
const coneRing=new THREE.Mesh(new THREE.TorusGeometry(1.9,0.03,6,40),
  new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0.55}));
coneRing.rotation.x=Math.PI/2;scene.add(coneRing);

/* ---- 雨滴(补给)与水流(达西) ---- */
const RAIN=40;
const rainIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,6,5),rainM,RAIN);
scene.add(rainIM);zeroIM(rainIM);
const rainP=[];
for(let i=0;i<RAIN;i++)rainP.push({x:-9.5+Math.random()*6,y:2.5+Math.random()*0.5,st:0,z:0});
/* 染料 */
const DYE=36;
const dyeIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),dyeM,DYE);
scene.add(dyeIM);zeroIM(dyeIM);
const dyeP=[];for(let i=0;i<DYE;i++)dyeP.push({x:0,y:0,z:0,life:0});
let dyeActive=false,wellDirty=false;

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('补给区:高位入渗','recharge upland: infiltration'),v3(-7,ys(-7)+0.7,0),'b');
addLabel(()=>L('潜水面:以下全饱水','water table: saturated below'),v3(-3.2,-0.1,1.15),'b');
addLabel(()=>L('包气带(非饱和)','vadose zone (unsaturated)'),v3(-9.3,1.7,1.15),'k');
addLabel(()=>L('砂质含水层:孔隙储水如海绵','sandy aquifer: sponge of pores'),v3(0.2,-1.9,-1.15),'k');
addLabel(()=>L('黏土隔水层:K 小万倍','clay aquitard: 10⁴× tighter'),v3(-2.8,-3.05,1.15),'r');
addLabel(()=>L('承压含水层','confined aquifer'),v3(-8.5,-3.95,-1.15),'b');
addLabel(()=>L('抽水井:降落漏斗','pumping well: cone of depression'),v3(XW,ys(XW)+0.75,0),'o',()=>true);
addLabel(()=>L('自流井:承压水头高于地表','artesian well: head above ground'),v3(5.2,ys(7.0)+1.0,0),'g',()=>artFlow>0.05);
addLabel(()=>L('河流:含水层的排泄出口','stream: the discharge point'),v3(3.6,ys(3.6)+0.55,0),'b');
let notifyT=0,notifyZ='',notifyE='';
const lblNotify=addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',v3(0,4.6,0),'o');
function notify(zh,en){notifyT=3.6;notifyZ=zh;notifyE=en;}

/* ---- 水量平衡 ---- */
let Q=600,recharge=800,timeAcc=30,K=8,dH=0,pumpRamp=0,artFlow=0;
function rechargeOf(){return recharge;}               // m³/d
function artesian(){return 1.9+recharge*0.0009;}      // 承压水头(简化:随补给升高)
/* ---- 步骤 ---- */
const STEPS=[
  {zh:'补给:雨水渗过包气带(非饱和带),抵达潜水面进入饱水带',en:'Recharge: rain percolates through the unsaturated vadose zone to the water table'},
  {zh:'含水层:砂砾孔隙像海绵储水;潜水面以下是饱水带,随降水涨落',en:'Aquifer: pores store water like a sponge; everything below the water table is saturated'},
  {zh:'达西定律:v=K·i——流速=渗透系数×水头梯度;黏土 K 小万倍,即隔水层',en:'Darcy: v=K·i — flux = conductivity × head gradient; clay, 10⁴× tighter, makes the aquitard'},
  {zh:'抽水:井周水头被拉低成降落漏斗 s=Q·ln(Re/r)/(2πT),T=K·b',en:'Pumping: the cone of depression s=Q·ln(Re/r)/(2πT) with transmissivity T=K·b'},
  {zh:'超采:补给<抽水,水位逐年下降;黏土失水压密 → 地面沉降不可逆',en:'Overdraft: pumping > recharge drains the table yearly; clay compacts — subsidence is forever'},
  {zh:'承压水:隔水层之下承受静水压,补给区更高 → 井口自喷(自流井)',en:'Confined: pressurised below the aquitard; head from high recharge land → artesian flow'},
  {zh:'污染:溶质顺流对流+水动力弥散,数十年才到井,治理更慢——预防即一切',en:'Contamination: advection plus hydrodynamic dispersion — decades to the well; prevention is everything'},
];
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>setPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
let phase=0;
function setPhase(i){
  phase=i;syncSteps();
  if(i===3){document.getElementById('sQ').value=1800;Q=1800;notify('加大抽水:看漏斗当场凹陷','Pumping up: watch the cone deepen live');}
  if(i===4){Q=2200;recharge=400;document.getElementById('sQ').value=2200;document.getElementById('sR').value=400;
    notify('超采 20 年:水位持续下降,黏土压密 → 地面沉降','Two decades of overdraft: falling levels, compacting clay, sinking land');}
  if(i===5){recharge=1400;document.getElementById('sR').value=1400;
    notify('补给升高 → 承压水头抬过地表 → 自流井开喷','Recharge up → confined head rises past the surface → artesian flow');}
  if(i===6){spill();}
  if(i===0||i===1||i===2){Q=600;recharge=800;}
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===phase));
}
function spill(){
  dyeActive=true;
  for(let i=0;i<DYE;i++){
    dyeP[i].x=-1.8+(Math.random()*2-1)*0.3;
    dyeP[i].y=hAt(dyeP[i].x)-0.25-Math.random()*0.3;
    dyeP[i].z=(Math.random()*2-1)*0.7;
    dyeP[i].life=1;
  }
  notify('泄漏:染料顺流迁移+弥散,注意到达井口的用时','Spill: dye advects and disperses — time its arrival at the well');
}

/* ---- 统计 ---- */
function updateStats(){
  document.getElementById('stQ').innerHTML=Q+'<small> m³/d</small>';
  const s=Math.max(0,(hBase(XW)-hAt(XW)));
  document.getElementById('stS').innerHTML=s.toFixed(2)+'<small> m</small>';
  /* 达西流速:取含水层中断面平均 i≈(h(-6)-h(3))/9 */
  const i=(hAt(-6)-hAt(3))/9;
  const v=K*i;
  document.getElementById('stV').innerHTML=v.toFixed(3)+'<small> m/d</small>';
  const el=document.getElementById('stT');
  const net=(recharge-Q)*3.3e-4;
  el.innerHTML=(net>=0?'+':'')+net.toFixed(2)+'<small> m/yr</small>';
  el.className='v '+(net<-0.05?'bad':'ok');
  document.getElementById('formula').innerHTML=L(
    `<b>达西定律 v = K·i = ${K} × ${i.toFixed(3)} = ${v.toFixed(3)} m/d</b>(地下水以"天"计速)<br>` +
    `<b>降落漏斗 s = Q·ln(Re/r)/(2πT)</b>,T=K·b=${(K*2.2).toFixed(0)} m²/d;井壁降深 ${(hBase(XW)-hAt(XW)).toFixed(2)} m<br>` +
    `<b>水量平衡:${recharge-Q>=0?'+':''}${recharge-Q} m³/d → 水位 ${(net>=0?'+':'')+net.toFixed(2)} m/yr</b>;${recharge<Q?'超采中:黏土压密,地面沉降 '+subNow.toFixed(2)+' m':'收支平衡或盈余'}`,
    `<b>Darcy v = K·i = ${K} × ${i.toFixed(3)} = ${v.toFixed(3)} m/d</b> (groundwater counts speed in days)<br>` +
    `<b>Cone of depression s = Q·ln(Re/r)/(2πT)</b>, T=K·b=${(K*2.2).toFixed(0)} m²/d; drawdown at the well ${(hBase(XW)-hAt(XW)).toFixed(2)} m<br>` +
    `<b>Balance: ${recharge-Q>=0?'+':''}${recharge-Q} m³/d → table ${(net>=0?'+':'')+net.toFixed(2)} m/yr</b>; ${recharge<Q?'overdraft: clay compacts, land sinks '+subNow.toFixed(2)+' m':'balanced or in surplus'}`);
}

/* ---- UI ---- */
function setPlayLabel(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('btnSand').addEventListener('click',()=>{K=8;syncK();});
document.getElementById('btnGravel').addEventListener('click',()=>{K=40;syncK();});
document.getElementById('btnFine').addEventListener('click',()=>{K=1.5;syncK();});
function syncK(){
  document.getElementById('btnSand').classList.toggle('on',K===8);
  document.getElementById('btnGravel').classList.toggle('on',K===40);
  document.getElementById('btnFine').classList.toggle('on',K===1.5);
}
document.getElementById('btnSpill').addEventListener('click',spill);
document.getElementById('btnReset').addEventListener('click',()=>{
  dH=0;wellDirty=false;wellWaterM.color.setHex(0x3b9de8);dyeActive=false;
  for(let i=0;i<DYE;i++)dyeP[i].life=0;
  notify('水位重置到基准面','Water table reset to baseline');
});
document.getElementById('btnRain').addEventListener('click',()=>{
  rainP.forEach(r=>{r.x=-9.5+Math.random()*6;r.y=4.2+Math.random()*1.5;r.st=0;});
  recharge=Math.min(1600,recharge+200);document.getElementById('sR').value=recharge;
  notify('一场雨:补给率上调 200 m³/d','A rain event: recharge up 200 m³/d');
});
document.getElementById('sQ').addEventListener('input',e=>{Q=+e.target.value;document.getElementById('sQVal').textContent=Q+' m³/d';});
document.getElementById('sR').addEventListener('input',e=>{recharge=+e.target.value;document.getElementById('sRVal').textContent=recharge+' m³/d';});
document.getElementById('sT').addEventListener('input',e=>{timeAcc=+e.target.value;document.getElementById('sTVal').textContent='×'+timeAcc;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  soilM.color.setHex(dark?0x8a6f47:0xa88a5c);
  clayM.color.setHex(dark?0x6b6157:0x8d8175);
  rockM.color.setHex(dark?0x3a4048:0x9aa2ac);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('地下水与含水层 · 藏在地下的慢速河网','Groundwater & Aquifers · the slow river underground');
  buildSteps();setPlayLabel();updateStats();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0,simT=0,subNow=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=dt0*speedMul;
  simT+=dt0;
  if(playing){
    /* 水量平衡:补给-抽水 → 区域水位年变化(时间倍率快进) */
    const dyr=dt*timeAcc/365;
    dH=clamp(dH+(recharge-Q)*3.3e-4*dyr,-2.0,0.5);
    /* 降落漏斗响应 */
    pumpRamp+=((Q>0?1:0)-pumpRamp)*Math.min(1,dt*1.5);
    /* 沉降:累计亏空>0.8 m 后出现 */
    subNow=clamp((-dH-0.8)*0.15,0,0.45);
    updateSurface(subNow);
    /* 雨滴 */
    const m4=new THREE.Matrix4();
    for(let i=0;i<RAIN;i++){
      const r=rainP[i];
      if(r.st===0){
        r.y-=3*dt;
        if(r.y<=ys(r.x)+0.05)r.st=1;
      }else if(r.st===1){
        r.y-=0.35*dt;                              // 包气带入渗(慢)
        if(r.y<=hAt(r.x)-0.12){r.st=2;r.z=(Math.random()*2-1)*0.8;}
      }else{                                        // 含水层达西流
        const i2=clamp((hAt(r.x-0.4)-hAt(r.x+0.4))/0.8,0.005,0.12);
        r.x+=clamp(K*i2*0.25,0.25,3)*dt*(timeAcc/30);
        r.y=hAt(r.x)-0.14;
        if(r.x>3.42){r.x=-9.5+Math.random()*6;r.y=4.2+Math.random()*1.5;r.st=0;}
      }
      m4.setPosition(r.x,r.y,r.z||0);
      rainIM.setMatrixAt(i,m4);
    }
    rainIM.instanceMatrix.needsUpdate=true;
    /* 自流井 */
    const hF=artesian();
    artFlow=clamp((hF-ys(7.0))*2.2,0,1.6);
    artHead.visible=artFlow>0.02;
    for(let i=0;i<10;i++){
      const p=artP[i];
      if(artFlow>0.02){
        p.t+=dt*1.4;if(p.t>1)p.t=0;
        m4.setPosition(7.0+Math.cos(p.a)*p.vx*p.t*1.2,ys(7.0)+0.4+p.t*(1.4*artFlow)-1.1*p.t*p.t,Math.sin(p.a)*p.vx*p.t*0.6);
      }else m4.makeScale(0,0,0);
      artJet.setMatrixAt(i,m4);
    }
    artJet.instanceMatrix.needsUpdate=true;
    /* 染料运移 */
    for(let i=0;i<DYE;i++){
      const p=dyeP[i];
      if(p.life>0&&playing){
        const i2=clamp((hAt(p.x-0.4)-hAt(p.x+0.4))/0.8,0.005,0.12);
        p.x+=clamp(K*i2*0.25,0.2,3)*dt*(timeAcc/30);
        p.y=hAt(p.x)-0.22-0.15*Math.sin(p.x*2.1+i);
        p.z+=(Math.random()-0.5)*0.02*Math.sqrt(Math.max(0.1,p.x+1.8)); // 弥散随距离增长
        p.z=clamp(p.z,-0.9,0.9);
        if(p.x>XW-0.18&&p.x<XW+0.18&&!wellDirty){
          wellDirty=true;wellWaterM.color.setHex(0xff4d4d);
          notify('染料到达抽水井——这可能是十几年后的井水','Dye reached the well — that could be a decade of travel time');
        }
        if(p.x>3.4)p.life=0;
      }
      if(p.life>0)m4.setPosition(p.x,p.y,p.z);else m4.makeScale(0,0,0);
      dyeIM.setMatrixAt(i,m4);
    }
    dyeIM.instanceMatrix.needsUpdate=true;
  }
  /* 井内水位:抽水井随潜水面;自流井随承压水头(最高到井口) */
  const hp=hAt(XW);
  const wp=wellP.userData,wa=wellA.userData;
  wp.water.scale.y=Math.max(0.01,hp-(wp.top-wp.depth));
  wp.water.position.y=(hp+(wp.top-wp.depth))/2;
  const ha=Math.min(artesian(),wa.top+0.42);
  wa.water.scale.y=Math.max(0.01,ha-(wa.top-wa.depth));
  wa.water.position.y=(ha+(wa.top-wa.depth))/2;
  /* 降落漏斗标注圈随 s0 缩放 */
  const s0=Math.min(2.3,Q*0.0011)*pumpRamp;
  coneRing.position.set(XW,hp+0.02,0);
  coneRing.scale.set(1+s0*0.8,1,1+s0*0.8);
  coneRing.visible=s0>0.05;
  refreshWT();
  if(notifyT>0)notifyT-=dt0;
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    const t=r.text();const on=labelsOn&&r.vis()&&t!=='';
    r.o.visible=on;if(on)r.o.element.textContent=t;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
/* 预填:雨滴分布在补给区半空,首屏就有入渗过程 */
applyTheme();applyLang();setPlayLabel();
start();
</script>
