<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共振与拍 · 频率对了才给劲</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e599f7;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#9c36b5;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(229,153,247,.9); color: #f3d9fa; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(156,54,181,.9); color: #9c36b5; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #e599f7; }
  #stats .v.b { color: #74c0fc; }
  #chart { grid-column: 1 / 3; margin-top: 6px; }
  #chart canvas { display: block; border-radius: 8px; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #modeRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(229,153,247,.12); }
  :root[data-theme="light"] .bon.on { background: rgba(156,54,181,.08); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(229,153,247,.12); color: var(--text); border: 1px solid rgba(229,153,247,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(229,153,247,.10); border-color: rgba(229,153,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(156,54,181,.08); border-color: rgba(156,54,181,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #f3d9fa; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="共振与拍：频率对了才给劲" data-en="Resonance &amp; Beats: only the right frequency delivers">共振与拍：频率对了才给劲</h1>
  <div class="sub" data-zh="驱动频率扫过固有频率,振幅暴涨(塔科马桥);两支近频音叉叠加,合成波长出慢包络——拍频 = |f₁−f₂| · 空格播放/暂停" data-en="Sweep the drive past the natural frequency and amplitude explodes (Tacoma); two close forks weave a slow envelope — beat = |f₁−f₂| · Space = play/pause">驱动频率扫过固有频率,振幅暴涨(塔科马桥);两支近频音叉叠加,合成波长出慢包络——拍频 = |f₁−f₂| · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" id="k1" data-zh="驱动频率" data-en="drive freq">驱动频率</span><span class="v g" id="stD">—</span>
  <span class="k" id="k2" data-zh="固有频率" data-en="natural freq">固有频率</span><span class="v b" id="stN">—</span>
  <span class="k" id="k3" data-zh="当前振幅" data-en="amplitude">当前振幅</span><span class="v g" id="stA">—</span>
  <div id="chart"><canvas id="cvChart" width="310" height="120"></canvas></div>
</div>

<div id="panel">
  <div id="modeRow">
    <button class="bon on" id="mRes"><b data-zh="受迫共振" data-en="forced resonance">受迫共振</b><i data-zh="荡秋千:时机对了越荡越高" data-en="push the swing at its beat">荡秋千:时机对了越荡越高</i></button>
    <button class="bon" id="mBeat"><b data-zh="拍" data-en="beats">拍</b><i data-zh="两支近频音叉的慢包络" data-en="two close forks, one slow envelope">两支近频音叉的慢包络</i></button>
  </div>
  <div class="row" id="rowF"><label data-zh="驱动频率" data-en="drive freq">驱动频率</label><input id="dfq" type="range" min="10" max="190" step="2" value="60"><span class="val" id="dfqVal">—</span></div>
  <div class="row" id="rowB" style="display:none"><label data-zh="第二音叉" data-en="fork 2">第二音叉</label><input id="f2" type="range" min="60" max="90" step="1" value="87"><span class="val" id="f2Val">—</span></div>
  <div class="row"><label data-zh="阻尼" data-en="damping">阻尼</label><input id="dmp" type="range" min="5" max="60" step="5" value="20"><span class="val" id="dmpVal">0.20</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../standing-waves/" data-zh="驻波:另一种「挑频率」" data-en="standing waves: another frequency filter">驻波:另一种「挑频率」</a>
    <a href="../escapement/" data-zh="摆轮:靠谐振子计时" data-en="balance wheel: timing by oscillator">摆轮:靠谐振子计时</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
let mode = qs.get('mode') === 'beat' ? 'beat' : 'res';

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('共振与拍', 'Resonance & Beats');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 2.2, 8.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  ball: mat(0xe599f7, { roughness: 0.35 }),
  ballB: mat(0x74c0fc, { roughness: 0.35 }),
  rod: mat(0xcfd4dc, { metalness: 0.7, roughness: 0.3 }),
  wave1: new THREE.LineBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.7 }),
  wave2: new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.7 }),
  waveS: new THREE.LineBasicMaterial({ color: 0xe599f7 }),
  env: new THREE.LineBasicMaterial({ color: 0xff8787, transparent: true, opacity: 0.6 }),
};

/* ================= 模式 A:受迫共振(驱动摆 + 共振摆) ================= */
const resGrp = new THREE.Group();
scene.add(resGrp);
/* 驱动摆(左,手推的小摆) */
const drvPivot = new THREE.Group();
drvPivot.position.set(-2.6, 3.1, 0);
resGrp.add(drvPivot);
const drvRod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.4, 10), M.rod);
drvRod.position.y = -0.7;
drvPivot.add(drvRod);
const drvBall = new THREE.Mesh(new THREE.SphereGeometry(0.14, 18, 14), M.frame);
drvBall.position.y = -1.4;
drvPivot.add(drvBall);
/* 共振摆(右,主角) */
const resPivot = new THREE.Group();
resPivot.position.set(0.9, 3.1, 0);
resGrp.add(resPivot);
const resRod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.4, 10), M.rod);
resRod.position.y = -0.7;
resPivot.add(resRod);
const resBall = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 16), M.ball);
resBall.position.y = -1.4;
resPivot.add(resBall);
/* 固有频率(视觉) rad/s */
const W0 = 2.0 * Math.PI * 0.4;
/* 响应曲线画布 */
const chart = document.getElementById('cvChart').getContext('2d');

/* ================= 模式 B:拍(两叉 + 三条波) ================= */
const beatGrp = new THREE.Group();
scene.add(beatGrp);
function forkMesh(material) {
  const g = new THREE.Group();
  for (const s of [-1, 1]) {
    const prong = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.9, 0.06), material);
    prong.position.set(s * 0.09, 0.45, 0);
    g.add(prong);
  }
  const stem = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.3, 0.14), material);
  stem.position.y = -0.15;
  g.add(stem);
  return g;
}
const forkA = forkMesh(M.ball);
forkA.position.set(-1.4, 1.1, -0.6);
beatGrp.add(forkA);
const forkB = forkMesh(M.ballB);
forkB.position.set(0.6, 1.1, 0.4);
beatGrp.add(forkB);
/* 三条波线(空间曲线) */
function waveLine(n, material) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const l = new THREE.Line(g, material);
  scene.add(l);
  return { l, g };
}
const w1 = waveLine(140, M.wave1);
const w2 = waveLine(140, M.wave2);
const wS = waveLine(140, M.waveS);
const wEnv = waveLine(140, M.env);

const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.18, 4), M.floor);
floor.position.y = -0.1;
scene.add(floor);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let driveF = 60;                // 驱动频率(视觉,固有 = 80)
let fork2 = 87;                 // 第二音叉频率(f1 = 80)
let damping = 0.2;
let tSim = 0;
let amp = 0, ph = 0;            // 共振摆振幅/相位
const F1 = 80;                  // 两模式共同参考频率

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblDrv = addLabel(() => mode === 'res' ? L('驱动摆(节奏由你定)', 'driver: your tempo') : L('音叉 A:80 Hz', 'fork A: 80 Hz'),
  new THREE.Vector3(-2.6, 3.5, 0), 'g');
const lblRes = addLabel(() => mode === 'res' ? L('共振摆(固有 0.4 Hz)', 'resonant swing (0.4 Hz)') : L('音叉 B:可调', 'fork B: tunable'),
  new THREE.Vector3(0.9, 3.5, 0), 'g', resPivot);
const lblStatus = addLabel(() => mode === 'res'
  ? Math.abs(driveF - F1) < 6 ? L('共振!每次推都在正好的时机 → 振幅越滚越大', 'RESONANCE! every push lands perfectly — amplitude snowballs')
    : driveF > F1 ? L('推得太快:秋千还没回来你又推', 'pushing too fast: the swing has not come back yet')
    : L('推得太慢:时机全错过', 'pushing too slow: every push mistimed')
  : L(`拍频 = |f₁−f₂| = ${Math.abs(F1 - fork2)} Hz:忽强忽弱`, `beat = |f₁−f₂| = ${Math.abs(F1 - fork2)} Hz: loud-soft-loud`),
  new THREE.Vector3(0.6, 4.1, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS_RES = [
  { b: '荡秋千的秘诀', be: 'The swing secret',
    d: '在秋千最高点顺它一把,小小力气也能越荡越高——时机,而不是力气。',
    de: 'Push at the top of each arc and a tiny effort builds a huge swing — timing, not muscle.',
    act: () => { driveF = 80; document.getElementById('dfq').value = 80; document.getElementById('dfqVal').textContent = '80'; } },
  { b: '固有频率:结构的脾气', be: 'Natural frequency: the temper',
    d: '每个振子都有自己的固有频率(由长度/刚度决定,右下角 0.4 Hz)——外力只有踩上这个点才被持续加强。',
    de: 'Every oscillator has a natural frequency (length/stiffness set it) — only pushes at that rate accumulate.',
    act: () => { driveF = 80; document.getElementById('dfq').value = 80; document.getElementById('dfqVal').textContent = '80'; } },
  { b: '扫频看响应峰', be: 'Sweep for the peak',
    d: '拖「驱动频率」扫过固有值:响应曲线隆起一座峰——峰越窄(阻尼越小),挑频率越挑剔。',
    de: 'Sweep the drive across the natural value: the response rises into a peak — the less damping, the pickier it gets.',
    act: () => { driveF = 120; document.getElementById('dfq').value = 120; document.getElementById('dfqVal').textContent = '120'; } },
  { b: '塔科马桥:共振的复仇', be: 'Tacoma: the revenge of resonance',
    d: '1940 年塔科马海峡桥在风里找到固有频率,扭到散架——从此所有桥梁都要做风洞共振检查。',
    de: 'In 1940 the Tacoma Narrows bridge found its natural frequency in the wind and shook itself apart — every bridge since gets a resonance check.',
    act: () => { driveF = 78; document.getElementById('dfq').value = 78; document.getElementById('dfqVal').textContent = '78'; } },
  { b: '阻尼:峰的宽度', be: 'Damping: the peak width',
    d: '加阻尼,峰变矮变宽——挑频率不再苛刻,但也推不高了。收音机调台、核磁共振,都在这条峰上工作。',
    de: 'More damping flattens and widens the peak — less picky, less tall. Radio tuning and MRI both live on this curve.',
    act: () => { damping = 0.45; document.getElementById('dmp').value = 45; document.getElementById('dmpVal').textContent = '0.45'; } },
];
const STEPS_BEAT = [
  { b: '两支近频音叉', be: 'Two close forks',
    d: '同时敲响 80 Hz 与 87 Hz 的音叉——各自都在振,耳朵却听到「忽强忽弱」的单音。',
    de: 'Strike 80 Hz and 87 Hz together — both ring, yet the ear hears one tone swelling and fading.',
    act: () => { fork2 = 87; document.getElementById('f2').value = 87; document.getElementById('f2Val').textContent = '87 Hz'; } },
  { b: '拍:慢包络', be: 'Beats: the slow envelope',
    d: '两波有时同相相加(响),有时反相抵消(弱)——合成的红色波形长出一层慢包络。',
    de: 'In phase they add (loud), out of phase they cancel (soft) — the red sum grows a slow envelope.',
    act: () => { fork2 = 84; document.getElementById('f2').value = 84; document.getElementById('f2Val').textContent = '84 Hz'; } },
  { b: '拍频 = |f₁−f₂|', be: 'Beat = |f₁−f₂|',
    d: '包络每秒起伏的次数恰是频率差:调音师把拍听消失,琴弦就准了。',
    de: 'The envelope pulses at exactly the difference: a piano tuner tunes by making the beats vanish.',
    act: () => { fork2 = 81; document.getElementById('f2').value = 81; document.getElementById('f2Val').textContent = '81 Hz'; } },
  { b: ' applications', be: 'Where beats matter',
    d: '乐器调音、外差收音机、多普勒超声测血流——凡是两列相近波相遇,都有拍的影子。',
    de: 'Instrument tuning, heterodyne radios, Doppler ultrasound — wherever two close waves meet, beats appear.',
    act: () => { fork2 = 90; document.getElementById('f2').value = 90; document.getElementById('f2Val').textContent = '90 Hz'; } },
];
const STEPS = () => mode === 'res' ? STEPS_RES : STEPS_BEAT;
function stepIndex() {
  if (mode === 'res') {
    if (Math.abs(driveF - F1) < 6) return 0;
    if (damping > 0.4) return 4;
    if (driveF > F1) return 2;
    return 1;
  }
  const bf = Math.abs(F1 - fork2);
  if (bf <= 2) return 2;
  if (bf <= 5) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS().forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elDfq = document.getElementById('dfq');
const elDfqVal = document.getElementById('dfqVal');
const elF2 = document.getElementById('f2');
const elF2Val = document.getElementById('f2Val');
const elDmp = document.getElementById('dmp');
const elDmpVal = document.getElementById('dmpVal');
const btnRes = document.getElementById('mRes');
const btnBeat = document.getElementById('mBeat');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stD = document.getElementById('stD'), stN = document.getElementById('stN'),
  stA = document.getElementById('stA');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setMode(m) {
  mode = m;
  btnRes.classList.toggle('on', m === 'res');
  btnBeat.classList.toggle('on', m === 'beat');
  resGrp.visible = m === 'res';
  beatGrp.visible = m === 'beat';
  w1.l.visible = w2.l.visible = wS.l.visible = wEnv.l.visible = (m === 'beat');
  document.getElementById('rowF').style.display = m === 'res' ? '' : 'none';
  document.getElementById('rowB').style.display = m === 'beat' ? '' : 'none';
  const ks = m === 'res'
    ? [L('驱动频率', 'drive freq'), L('固有频率', 'natural freq'), L('当前振幅', 'amplitude')]
    : [L('音叉 A', 'fork A'), L('音叉 B', 'fork B'), L('拍频', 'beat freq')];
  document.querySelectorAll('#stats .k').forEach((k, i) => { k.dataset.zh = ks[i]; k.dataset.en = ks[i]; k.textContent = ks[i]; });
  buildSteps();
}
btnRes.addEventListener('click', () => setMode('res'));
btnBeat.addEventListener('click', () => setMode('beat'));
elDfq.addEventListener('input', () => { driveF = parseInt(elDfq.value, 10); elDfqVal.textContent = elDfq.value; });
elF2.addEventListener('input', () => { fork2 = parseInt(elF2.value, 10); elF2Val.textContent = elF2.value + ' Hz'; });
elDmp.addEventListener('input', () => { damping = parseInt(elDmp.value, 10) / 100; elDmpVal.textContent = damping.toFixed(2); });
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* 响应曲线图 */
function drawChart() {
  const W = 310, Hc = 120;
  chart.clearRect(0, 0, W, Hc);
  const pill = getComputedStyle(htmlEl).getPropertyValue('--cv-pill').trim() || 'rgba(13,17,24,.8)';
  chart.fillStyle = pill;
  chart.beginPath(); chart.roundRect(0, 0, W, Hc, 8); chart.fill();
  if (mode === 'res') {
    /* 共振峰 */
    const gy = (ampV) => Hc - 18 - ampV * (Hc - 40);
    chart.strokeStyle = 'rgba(128,140,155,.3)';
    chart.beginPath(); chart.moveTo(10, Hc - 18); chart.lineTo(W - 10, Hc - 18); chart.stroke();
    const g = damping * 2;
    chart.strokeStyle = '#e599f7'; chart.lineWidth = 2;
    chart.beginPath();
    for (let x = 10; x <= W - 10; x++) {
      const f = 10 + (x - 10) / (W - 20) * 180;
      const a = 1 / Math.sqrt((1 - (f / F1) ** 2) ** 2 + (g * f / F1) ** 2) * g;
      const y = gy(clamp(a, 0, 1.6) / 1.6);
      x === 10 ? chart.moveTo(x, y) : chart.lineTo(x, y);
    }
    chart.stroke();
    /* 固有频率竖线 */
    chart.strokeStyle = 'rgba(116,192,252,.5)'; chart.setLineDash([4, 4]);
    const x0 = 10 + (F1 - 10) / 180 * (W - 20);
    chart.beginPath(); chart.moveTo(x0, 10); chart.lineTo(x0, Hc - 18); chart.stroke();
    chart.setLineDash([]);
    /* 驱动点 */
    const xd = 10 + (driveF - 10) / 180 * (W - 20);
    chart.fillStyle = '#ffd166';
    chart.beginPath(); chart.arc(xd, gy(clamp(1 / Math.sqrt((1 - (driveF / F1) ** 2) ** 2 + (g * driveF / F1) ** 2) * g, 0, 1.6) / 1.6), 5, 0, 7); chart.fill();
    chart.fillStyle = 'rgba(199,210,222,.9)'; chart.font = '10px system-ui';
    chart.fillText(L('响应幅度 vs 驱动频率(虚线=固有)', 'response vs drive (dashed = natural)'), 14, 16);
  } else {
    /* 拍:三波对照 */
    const mid = Hc / 2 - 6;
    const drawW = (f, color, amp, phase) => {
      chart.strokeStyle = color; chart.lineWidth = 1.4;
      chart.beginPath();
      for (let x = 10; x <= W - 10; x++) {
        const t = (x - 10) / (W - 20) * 8 * Math.PI / 10;
        const y = mid - Math.sin(f / 10 * t * 10 + phase) * amp * 22;
        x === 10 ? chart.moveTo(x, y) : chart.lineTo(x, y);
      }
      chart.stroke();
    };
    drawW(F1, '#74c0fc', 0.4, 0);
    drawW(fork2, '#ffd166', 0.4, 0);
    /* 合成 + 包络 */
    chart.strokeStyle = '#e599f7'; chart.lineWidth = 2;
    chart.beginPath();
    for (let x = 10; x <= W - 10; x++) {
      const t = (x - 10) / (W - 20) * 8 * Math.PI / 10;
      const y = mid - (Math.sin(F1 / 10 * t * 10) + Math.sin(fork2 / 10 * t * 10)) * 11;
      x === 10 ? chart.moveTo(x, y) : chart.lineTo(x, y);
    }
    chart.stroke();
    const bf = Math.abs(F1 - fork2) / 10;
    chart.strokeStyle = '#ff8787'; chart.setLineDash([3, 3]);
    for (const sg of [1, -1]) {
      chart.beginPath();
      for (let x = 10; x <= W - 10; x++) {
        const t = (x - 10) / (W - 20) * 8 * Math.PI / 10;
        const y = mid - sg * Math.abs(Math.cos(bf / 2 * t * 10)) * 22;
        x === 10 ? chart.moveTo(x, y) : chart.lineTo(x, y);
      }
      chart.stroke();
    }
    chart.setLineDash([]);
    chart.fillStyle = 'rgba(199,210,222,.9)'; chart.font = '10px system-ui';
    chart.fillText(L('蓝 80Hz · 黄 f₂ · 紫合成 · 红包络', 'blue 80Hz · yellow f₂ · purple sum · red envelope'), 14, 14);
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;

  if (mode === 'res') {
    const wf = driveF / 100 * 2 * Math.PI * 0.4 * 2;   // 驱动角频率(视觉)
    /* 稳态幅值 + 一阶趋近 */
    const target = 1 / Math.sqrt((1 - (driveF / F1) ** 2) ** 2 + (damping * 2 * driveF / F1) ** 2) * damping * 2 * (driveF / F1);
    amp = lerp(amp, clamp(target, 0.05, 2.6), 1 - Math.exp(-dts * 0.8));
    ph += wf * dts;
    drvPivot.rotation.z = Math.sin(tSim * wf) * 0.18;
    resPivot.rotation.z = Math.sin(ph) * 0.1 * amp + Math.sin(tSim * wf) * 0.06 * amp;
    stD.textContent = driveF + ' (视觉)';
    stN.textContent = '0.4 Hz';
    stA.innerHTML = amp.toFixed(2) + '<small> ×</small>';
  } else {
    const t = tSim;
    /* 音叉振动 */
    forkA.children.forEach((pr, i) => {
      if (i < 2) pr.rotation.z = Math.sin(t * 10 * 8) * 0.12;
    });
    forkB.children.forEach((pr, i) => {
      if (i < 2) pr.rotation.z = Math.sin(t * 10 * fork2 / 10) * 0.12;
    });
    stD.textContent = F1 + ' Hz';
    stN.textContent = fork2 + ' Hz';
    stA.innerHTML = Math.abs(F1 - fork2) + '<small> Hz</small>';
  }
  drawChart();

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setMode(mode);
elDfqVal.textContent = driveF;
elF2Val.textContent = fork2 + ' Hz';
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
