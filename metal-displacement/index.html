<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>金属活动序与置换 · 铁树开花</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:396px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #series{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
  #series .m{font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--tool-border);color:var(--text3)}
  #series .m.anode{border-color:rgba(255,107,107,.8);color:#ffc2c2;background:rgba(255,107,107,.10)}
  #series .m.cathode{border-color:rgba(140,233,154,.8);color:#c8f5d0;background:rgba(140,233,154,.10)}
  :root[data-theme="light"] #series .m.anode{color:#c92a2a}
  :root[data-theme="light"] #series .m.cathode{color:#2b8a3e}
  #series .gt{font-size:11px;color:var(--text2)}
  #actions{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 6px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  #note{margin-top:8px;padding-top:7px;border-top:1px dashed var(--panel-border);font-size:11.5px;color:var(--text2);line-height:1.5}
  #note b{color:var(--text3)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="金属活动序与置换 · 铁树开花" data-en="The Activity Series · iron blooming copper">金属活动序与置换 · 铁树开花</h1>
  <div class="sub" data-zh="活动序=每个金属丢电子倾向的排行榜（E°：Al −1.66 → Ag +0.80 V）：铁钉入蓝液，Fe→Fe²⁺+2e⁻ 把 Cu²⁺ 压成红铜绒「长」在钉上、溶液转浅绿；ΔE=E°正极−E°负极>0 才自发，反向纹丝不动；铝先被氧化膜挡路 · 拖动旋转 / 空格运行/暂停" data-en="The activity series ranks each metal's tendency to lose electrons (E°: Al −1.66 → Ag +0.80 V): an iron nail in blue CuSO₄ turns Cu²⁺ into red copper fuzz while the solution fades to green; spontaneous only when ΔE=E°cathode−E°anode>0; aluminum hides behind its oxide film · drag to orbit / Space = run/pause">活动序=每个金属丢电子倾向的排行榜（E°：Al −1.66 → Ag +0.80 V）：铁钉入蓝液，Fe→Fe²⁺+2e⁻ 把 Cu²⁺ 压成红铜绒「长」在钉上、溶液转浅绿；ΔE=E°正极−E°负极>0 才自发，反向纹丝不动；铝先被氧化膜挡路 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="电池电动势 ΔE" data-en="Cell EMF ΔE">电池电动势 ΔE</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="吉布斯能 ΔG=−nFΔE" data-en="ΔG = −nFΔE">吉布斯能 ΔG=−nFΔE</span><span class="v" id="stG">—</span>
  <span class="k" data-zh="[盐金属离子]" data-en="[salt ion]">[盐金属离子]</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="析出质量" data-en="Deposited">析出质量</span><span class="v" id="stD">—</span>
</div>
<div id="panel">
  <div id="series"></div>
  <div id="actions">
    <button class="abtn on" data-m="Fe" data-zh="铁钉" data-en="Iron nail">铁钉</button>
    <button class="abtn" data-m="Zn" data-zh="锌粒" data-en="Zinc">锌粒</button>
    <button class="abtn" data-m="Cu" data-zh="铜丝" data-en="Copper">铜丝</button>
    <button class="abtn" data-m="Ag" data-zh="银丝" data-en="Silver">银丝</button>
    <button class="abtn" data-m="Al" data-zh="铝片" data-en="Aluminum">铝片</button>
    <button class="abtn" id="btnGrind" data-zh="打磨氧化膜" data-en="Grind oxide film">打磨氧化膜</button>
    <button class="abtn on" data-s="Cu" data-zh="CuSO₄ 蓝液" data-en="CuSO₄ blue">CuSO₄ 蓝液</button>
    <button class="abtn" data-s="Fe" data-zh="FeSO₄ 浅绿" data-en="FeSO₄">FeSO₄ 浅绿</button>
    <button class="abtn" data-s="Zn" data-zh="ZnSO₄ 近无色" data-en="ZnSO₄">ZnSO₄ 近无色</button>
    <button class="abtn" data-s="Ag" data-zh="AgNO₃ 无色" data-en="AgNO₃">AgNO₃ 无色</button>
    <button class="abtn" id="btnTrio" data-zh="三管对照 Zn/Fe/Ag" data-en="3-beaker Zn/Fe/Ag">三管对照 Zn/Fe/Ag</button>
    <button class="abtn" id="btnReset" data-zh="重置" data-en="Reset">重置</button>
  </div>
  <div class="row">
    <label data-zh="反应速率" data-en="Rate">反应速率</label>
    <input id="sSpd" type="range" min="20" max="200" step="10" value="100">
    <span class="val" id="sSpdVal">1.0×</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../galvanic-cell/" data-zh="原电池：把氧化还原分开" data-en="Galvanic cell: split the redox">原电池</a>
    <a href="../corrosion/" data-zh="腐蚀：同一化学的自毁" data-en="Corrosion: the same chemistry, self-inflicted">腐蚀</a>
    <a href="../nernst-equation/" data-zh="能斯特方程：浓度修正 ΔE" data-en="Nernst equation">能斯特方程</a>
  </div>
  <div id="note" data-zh="模型：0.1 L 溶液、0.5 mol/L 离子、速率∝ΔE·[离子]；析出量按摩尔质量换算。铝的致密 Al₂O₃ 膜需先破坏（打磨）。" data-en="Model: 0.1 L at 0.5 mol/L, rate ∝ ΔE·[ion]; deposit converted via molar mass. Aluminum's dense Al₂O₃ film must be broken (grinding) first.">模型：0.1 L 溶液、0.5 mol/L 离子、速率∝ΔE·[离子]；析出量按摩尔质量换算。铝的致密 Al₂O₃ 膜需先破坏（打磨）。</div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,42);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(-1.2,2.6,9.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(2.2,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=32;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(4,7,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-5,3,-5);scene.add(fill);

/* ---- 化学数据 ---- */
const E0={Al:-1.66,Zn:-0.76,Fe:-0.44,Cu:0.34,Ag:0.80};
const M_MASS={Cu:63.5,Fe:55.8,Zn:65.4,Ag:107.9};
const ION_COLOR={Cu:0x2247c8,Fe:0x6a9a58,Zn:0xb9cdc9,Ag:0xd9dee2};
const M_METAL={Cu:0xc9703a,Fe:0x9aa2ab,Zn:0xb8c4cc,Ag:0xe3e8ec,Al:0xd4dade};
const METAL_NAME={Al:'Al',Zn:'Zn',Fe:'Fe',Cu:'Cu',Ag:'Ag'};
const SALT_NAME={Cu:'CuSO₄',Fe:'FeSO₄',Zn:'ZnSO₄',Ag:'AgNO₃'};
const SALT_ION={Cu:'Cu²⁺',Fe:'Fe²⁺',Zn:'Zn²⁺',Ag:'Ag⁺'};
const C0=0.5,VOL=0.1;      // 0.5 mol/L，0.1 L

/* ---- 状态（先声明） ---- */
let playing=true,labelsOn=true,simT=0;
let metal='Fe',salt='Cu',frac=1,film=true,speedK=1.0,trio=false;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')){const v=clamp(+qs.get('speed'),20,200);document.getElementById('sSpd').value=v;speedK=v/100;}
function dE(){return E0[salt]-E0[metal];}
function reacting(){return dE()>0.02&&!(metal==='Al'&&film);}

/* ---- 材质 ---- */
const glassM=new THREE.MeshPhysicalMaterial({color:0xbcd8e8,roughness:0.08,transparent:true,opacity:0.15,side:THREE.DoubleSide,depthWrite:false});
const liquidM=new THREE.MeshStandardMaterial({color:0x2247c8,transparent:true,opacity:0.55,roughness:0.3});
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const rodM=new THREE.MeshStandardMaterial({color:0x8a939c,roughness:0.4,metalness:0.7});
const depositM=new THREE.MeshStandardMaterial({color:0xd06a35,roughness:0.45,metalness:0.5,emissive:0x7a2d05,emissiveIntensity:0.25});
const sparkM=new THREE.MeshBasicMaterial({color:0xffe066});
const ionSaltM=new THREE.MeshStandardMaterial({color:0x2247c8,roughness:0.35});
const ionProdM=new THREE.MeshStandardMaterial({color:0x6a9a58,roughness:0.35});

/* ---- 场景 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(20,0.3,9),groundM);
ground.position.set(2.2,-2.6,0);scene.add(ground);
const beakerG=new THREE.Group();scene.add(beakerG);
{
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,3.6,48,1,true),glassM);
  beakerG.add(wall);
  const bottom=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.5,0.12,48),glassM);
  bottom.position.y=-1.74;beakerG.add(bottom);
  const liquid=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,2.9,48),liquidM);
  liquid.position.y=-0.3;beakerG.add(liquid);
}
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,2.6,10),rodM);
rod.position.set(0,2.6,0);scene.add(rod);
/* 金属件 */
const pieceG=new THREE.Group();scene.add(pieceG);
let pieceMesh=null,sheath=null;
function buildPiece(){
  if(pieceMesh){pieceG.remove(pieceMesh);pieceMesh=null;}
  if(sheath){pieceG.remove(sheath);sheath=null;}
  const m=new THREE.Group();
  const col=M_METAL[metal];
  const mat=new THREE.MeshStandardMaterial({color:col,roughness:0.35,metalness:0.8});
  if(metal==='Fe'){
    const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.5,12),mat);m.add(sh);
    const tip=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.24,12),mat);tip.position.y=-0.87;m.add(tip);
    const hd=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.07,12),mat);hd.position.y=0.78;m.add(hd);
  }else if(metal==='Zn'){
    [[-0.2,-0.3],[0.18,-0.55],[0.02,-0.85]].forEach(p=>{
      const l=new THREE.Mesh(new THREE.IcosahedronGeometry(0.17,0),mat);l.position.set(p[0],p[1],0);m.add(l);
    });
  }else if(metal==='Cu'||metal==='Ag'){
    [0.2,-0.35].forEach(y=>{
      const t=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.06,10,28),mat);
      t.rotation.x=Math.PI/2;t.position.y=y;m.add(t);
    });
  }else{ // Al 板
    const p=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.4,0.07),mat);m.add(p);
    sheath=new THREE.Mesh(new THREE.BoxGeometry(0.78,1.48,0.15),
      new THREE.MeshStandardMaterial({color:0xeef2f6,transparent:true,opacity:0.28,roughness:0.6}));
    sheath.visible=film;m.add(sheath);
  }
  m.position.y=0.2;
  pieceMesh=m;pieceG.add(m);
}
buildPiece();
/* 离子云：盐离子 + 产物离子（InstancedMesh，未用实例零缩放） */
const NI=90;
function makeIonCloud(mat){
  const g=new THREE.InstancedMesh(new THREE.SphereGeometry(0.075,10,8),mat,NI);
  const z=new THREE.Matrix4().makeScale(0,0,0);
  for(let i=0;i<NI;i++)g.setMatrixAt(i,z);
  g.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(g);return g;
}
const cloudSalt=makeIonCloud(ionSaltM),cloudProd=makeIonCloud(ionProdM);
const ionSeed=[];
for(let i=0;i<NI;i++){
  const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*1.25;
  ionSeed.push({x:Math.cos(a)*r,y:-0.3+(Math.random()-0.5)*2.6,z:Math.sin(a)*r,
    p1:Math.random()*7,p2:Math.random()*7});
}
const tmpM=new THREE.Matrix4();
function updateClouds(){
  const nS=Math.round(frac*NI),nP=Math.round((1-frac)*NI);
  for(let i=0;i<NI;i++){
    const s=ionSeed[i];
    const wx=Math.sin(simT*0.7+s.p1)*0.16,wy=Math.sin(simT*0.5+s.p2)*0.14,wz=Math.cos(simT*0.6+s.p1)*0.16;
    tmpM.makeTranslation(s.x+wx,s.y+wy,s.z+wz);
    if(i<nS)cloudSalt.setMatrixAt(i,tmpM);
    else{tmpM.makeScale(0,0,0);cloudSalt.setMatrixAt(i,tmpM);}
    if(i<nP)cloudProd.setMatrixAt(i,tmpM.copy(tmpM).makeTranslation(s.x-wx,s.y+wy,s.z+wz));
    else{tmpM.makeScale(0,0,0);cloudProd.setMatrixAt(i,tmpM);}
  }
  cloudSalt.instanceMatrix.needsUpdate=true;
  cloudProd.instanceMatrix.needsUpdate=true;
}
/* 析出铜绒：InstancedMesh 八面体 */
const ND=140;
const dend=new THREE.InstancedMesh(new THREE.OctahedronGeometry(0.06,0),depositM,ND);
{
  const z=new THREE.Matrix4().makeScale(0,0,0);
  for(let i=0;i<ND;i++)dend.setMatrixAt(i,z);
  dend.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(dend);
}
const dendSeed=[];
for(let i=0;i<ND;i++){
  const a=Math.random()*Math.PI*2,y=(Math.random()-0.5)*1.4;
  const r=0.10+Math.random()*0.12;
  dendSeed.push({x:Math.cos(a)*r,y:y+0.2,z:Math.sin(a)*r,s:0.5+Math.random()*1.3,w:Math.random()*6});
}
function updateDendrites(){
  const dep=1-frac;
  const nD=Math.round(clamp(dep/0.9,0,1)*ND);
  for(let i=0;i<ND;i++){
    const d=dendSeed[i];
    if(i<nD){
      const s=d.s*(0.4+dep*1.1)*(0.85+0.15*Math.sin(simT*2+d.w));
      tmpM.makeScale(s,s,s);tmpM.setPosition(d.x*(1+dep*0.8),d.y,d.z*(1+dep*0.8));
    }else tmpM.makeScale(0,0,0);
    dend.setMatrixAt(i,tmpM);
  }
  dend.instanceMatrix.needsUpdate=true;
}
/* 电子火花 */
const sparks=[];
for(let i=0;i<7;i++){
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6),sparkM);
  s.visible=false;scene.add(s);sparks.push(s);
}
/* 三管对照 */
const trioG=new THREE.Group();trioG.visible=false;scene.add(trioG);
const trioData=[];
{
  const trioMk=[['Zn',1.10],['Fe',0.78],['Ag',-0.46]];
  trioMk.forEach((mk,i)=>{
    const g=new THREE.Group();g.position.set(4.4+i*1.7,0,0);trioG.add(g);
    const wall=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,1.6,32,1,true),glassM);g.add(wall);
    const liq=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,1.3,32),liquidM.clone());liq.position.y=-0.15;g.add(liq);
    const stick=new THREE.Mesh(new THREE.BoxGeometry(0.09,1.1,0.09),
      new THREE.MeshStandardMaterial({color:M_METAL[mk[0]],roughness:0.35,metalness:0.8}));
    stick.position.y=0.25;g.add(stick);
    const dots=[];
    for(let d=0;d<5;d++){
      const dot=new THREE.Mesh(new THREE.OctahedronGeometry(0.06,0),depositM.clone());
      dot.position.set((Math.random()-0.5)*0.16,0.0-d*0.16,0.08);
      dot.scale.setScalar(0.001);g.add(dot);dots.push(dot);
    }
    trioData.push({f:1,dots,liq,name:mk[0],dE:mk[1]});
  });
}
/* 标签 */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>SALT_NAME[salt]+' '+L('溶液','solution'),new THREE.Vector3(1.0,1.95,0),'b');
addLabel(()=>METAL_NAME[metal]+' '+L('金属件','piece'),new THREE.Vector3(0,1.05,0.75),'o');
const lblNo=addLabel(()=>L('ΔE<0：不反应——活动序排后面','ΔE<0: no reaction — lower in the series'),new THREE.Vector3(0,-2.25,0),'r',()=>!reacting()&&dE()<=0.02&&trio===false);
addLabel(()=>L('红铜析出','copper depositing'),new THREE.Vector3(0,-1.2,1.4),'g',()=>reacting()&&salt==='Cu'&&frac<0.97);
const lblFilm=addLabel(()=>L('致密 Al₂O₃ 膜挡住反应','dense Al₂O₃ film blocks it'),new THREE.Vector3(0,-2.25,0),'r',
  ()=>metal==='Al'&&film);
addLabel(()=>L('e⁻ 转移：M→Mⁿ⁺+ne⁻','e⁻ transfer: M→Mⁿ⁺+ne⁻'),new THREE.Vector3(1.0,0.2,1.5),'g',
  ()=>reacting()&&frac>0.03);
/* 三管标签 */
const trioLbls=trioData.map((td,i)=>{
  const o=addLabel(()=>td.name+' ΔE='+(td.dE>0?'+':'')+td.dE.toFixed(2)+'V',
    new THREE.Vector3(4.4+i*1.7,1.35,0),td.dE>0?'g':'r',()=>trio);
  return o;
});

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'排行榜：丢电子倾向 Al(−1.66)>Zn(−0.76)>Fe(−0.44)>Cu(+0.34)>Ag(+0.80)',en:'Ranking: Al(−1.66)>Zn(−0.76)>Fe(−0.44)>Cu(+0.34)>Ag(+0.80) in electron-donating tendency'},
 {zh:'铁钉入蓝液：Fe→Fe²⁺+2e⁻，Cu²⁺+2e⁻→Cu——氧化还原在表面同时发生',en:'Nail into blue: Fe→Fe²⁺+2e⁻ while Cu²⁺+2e⁻→Cu — redox at the surface'},
 {zh:'现象：红铜绒「长」在钉上，溶液由蓝转浅绿（铁树开花）',en:'Red copper fuzz grows on the nail as the blue fades to green'},
 {zh:'判据：ΔE=E°正极−E°负极>0 自发；ΔG=−nFΔE 立即可算',en:'Criterion: ΔE=E°cathode−E°anode>0; ΔG=−nFΔE follows at once'},
 {zh:'反向不行：铜丝丢进 FeSO₄——ΔE<0，纹丝不动',en:'Reverse fails: copper in FeSO₄ has ΔE<0 — nothing happens'},
 {zh:'铝的例外：致密 Al₂O₃ 膜先挡路，打磨后剧烈置换',en:'Aluminum exception: the dense Al₂O₃ film blocks first — grind to unleash'},
 {zh:'化学本质=原电池：把氧化与还原分开，就是铜锌电池',en:'It is a battery in disguise: split the half-reactions → Daniell cell'},
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  if(i===0){setPair('Fe','Cu');frac=1;playing=false;}
  else if(i===1){setPair('Fe','Cu');frac=1;playing=true;}
  else if(i===2){frac=0.55;playing=false;}
  else if(i===3){frac=0.55;playing=false;}
  else if(i===4){setPair('Cu','Fe');frac=1;playing=false;}
  else if(i===5){setPair('Al','Cu');film=true;playing=true;}
  else {setPair('Zn','Cu');frac=1;playing=false;}
  syncSteps();syncPlayBtn();updateStats();refreshSeries();
}

/* ---- 读数与着色 ---- */
function updateStats(){
  const e=dE();
  const elE=document.getElementById('stE');
  elE.innerHTML=(e>0?'+':'')+e.toFixed(2)+'<small> V</small>';
  elE.className='v'+(e>0.02?' ok':' warn');
  document.getElementById('stG').innerHTML=e>0?(-2*96485*e/1000).toFixed(0)+'<small> kJ/mol</small>':'—';
  document.getElementById('stC').innerHTML=(C0*frac).toFixed(2)+'<small> mol/L</small>';
  const mol=(C0*(1-frac))*VOL;
  document.getElementById('stD').innerHTML=reacting()?(mol*M_MASS[salt]*1000).toFixed(0)+'<small> mg '+METAL_NAME[salt]+'</small>':'—';
  /* 溶液颜色：盐离子色 → 产物离子色 */
  const c1=new THREE.Color(ION_COLOR[salt]),c2=new THREE.Color(ION_COLOR[metal]);
  liquidM.color.copy(c1).lerp(c2,1-frac);
  ionSaltM.color.copy(c1);ionProdM.color.copy(c2);
  depositM.color.setHex(M_METAL[salt]);
}
function refreshSeries(){
  const order=['Al','Zn','Fe','Cu','Ag'];
  const el=document.getElementById('series');el.innerHTML='';
  order.forEach((m,i)=>{
    if(i>0){const gt=document.createElement('span');gt.className='gt';gt.textContent='>';el.appendChild(gt);}
    const s=document.createElement('span');
    s.className='m'+(m===metal?' anode':(m===salt?' cathode':''));
    s.textContent=m+' ('+E0[m].toFixed(2)+'V)';
    el.appendChild(s);
  });
}

/* ---- 事件 ---- */
function setPair(m,s){metal=m;salt=s;frac=1;film=true;
  const gb=document.getElementById('btnGrind');
  gb.classList.remove('on');gb.textContent=L('打磨氧化膜','Grind oxide film');
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  buildPiece();refreshSeries();
}
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{setPair(b.dataset.m,salt);updateStats();}));
document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{setPair(metal,b.dataset.s);updateStats();}));
document.getElementById('btnGrind').addEventListener('click',e=>{
  film=false;if(sheath)sheath.visible=false;
  e.target.classList.add('on');e.target.textContent=L('已打磨 ✓','ground ✓');
});
document.getElementById('btnTrio').addEventListener('click',e=>{
  trio=!trio;trioG.visible=trio;e.target.classList.toggle('on',trio);
  beakerG.visible=!trio;rod.visible=!trio;pieceG.visible=!trio;
  cloudSalt.visible=!trio;cloudProd.visible=!trio;dend.visible=!trio;
  sparks.forEach(s=>s.visible=false);
  trioData.forEach(td=>{td.f=1;});
});
document.getElementById('btnReset').addEventListener('click',()=>{frac=1;trioData.forEach(td=>td.f=1);updateStats();});
document.getElementById('sSpd').addEventListener('input',e=>{speedK=+e.target.value/100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();updateStats();refreshSeries();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    if(trio){
      for(const td of trioData){
        if(td.dE>0.02)td.f=Math.max(0,td.f-0.05*td.dE*td.f*speedK*dt*3);
        const dep=1-td.f;
        td.dots.forEach((dot,i)=>{const s=dep>0.05?clamp(dep*6-i*0.4,0,1.4)*0.09:0.001;dot.scale.setScalar(Math.max(s,0.001));});
        td.liq.material.opacity=0.55-0.3*dep;
      }
    }else{
      if(reacting()){
        const k=0.05*(metal==='Al'?1.5:1);
        frac=Math.max(0,frac-k*dE()*frac*speedK*dt*2);
      }
    }
  }
  if(!trio){updateClouds();updateDendrites();
    /* 电子火花闪烁 */
    sparks.forEach((s,i)=>{
      const on=reacting()&&frac>0.02&&Math.sin(simT*9+i*2.4)>0.55;
      s.visible=on;
      if(on){
        const a=simT*3+i*0.9;
        s.position.set(Math.cos(a)*0.14,0.2+Math.sin(simT*5+i)*0.7,Math.sin(a)*0.14);
      }
    });
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化：首屏即演示（铁钉+蓝液，转化率预置） ---- */
applyTheme();applyLang();
setPair('Fe','Cu');frac=0.82;
updateClouds();updateDendrites();updateStats();syncPlayBtn();start();
</script>
