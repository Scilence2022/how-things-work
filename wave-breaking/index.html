<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

  :root[data-theme="light"]{

    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;

  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);

    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);

    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

  :root[data-theme="light"] #stats .v.warn{color:#d98f00}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;

  #play:hover{filter:brightness(1.12)}

    display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 波浪浅化与破碎(1 场景单位 = 1 m,横截面真实尺度)
   色散关系:ω²=g·k·tanh(kh)(每列数值求解,频率守恒)
   浅化:能量通量守恒 → H∝1/√(c_g),c_g=c/2·(1+2kh/sinh2kh)
   破碎判据:McCowan H/h≈0.78 —— 波峰水质点速度 ≳ 波相速,波峰前倾卷落
   形态:Iribarren Ir=tanβ/√(H₀/L₀),L₀=gT²/2π:
        Ir<0.5 溢散 spilling;0.5~3.3 卷跃 plunging;>3.3 崩塌 surging
   简化:破碎区按 H=0.78h 的均匀滚波处理,卷舌用翻卷环面示意 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---------- 渲染器 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0d1420,90,320);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,600);
/* 默认视轴右移 8:左侧标签(深水/浅化)避开左下面板 */
camera.position.set(14,8.5,52);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(58,1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=200;controls.autoRotateSpeed=0.3;

function applySky(){
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0d1420:0xbfd6e4);
  scene.fog.color.setHex(dark?0x0d1420:0xbfd6e4);
}
scene.add(new THREE.HemisphereLight(0xcfe4f5,0x1a2530,0.85));
const sun=new THREE.DirectionalLight(0xfff0d8,1.15);sun.position.set(-40,55,-25);scene.add(sun);

/* ---------- 地形参数 ---------- */
const LEN=220,NC=221,NW=24,G=9.8;
let beta=0.07,H0=1.6,T=7.0,slowK=0.35;
let playing=true,labelsOn=true,driftOn=true,foamOn=true;
let playingInit=!(qs.get('pause')==='1');
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){const v=parseFloat(qs.get('speed'));if(Number.isFinite(v))slowK=clamp(v,0.05,1);}
/* 每列数组:x / 水深 h / 底高 zb / 波数 k / 群速 cg / 波高 H / 相位累加 */
const xs=new Float32Array(NC),hb=new Float32Array(NC),zb=new Float32Array(NC),
      kk=new Float32Array(NC),cg=new Float32Array(NC),HH=new Float32Array(NC),ph=new Float32Array(NC);
let xBrk=60,omega=2*Math.PI/T,L0=0,Ir=0,wType='plunging',curlF=0.6;
const hBrk={h:0,H:0};

function solveK(h){ /* 二分解色散关系 ω²=g·k·tanh(kh) */
  let lo=1e-4,hi=3;
  for(let i=0;i<42;i++){
    const mid=(lo+hi)/2;
    (G*mid*Math.tanh(mid*h)<omega*omega)?lo=mid:hi=mid;
  }
  return (lo+hi)/2;
}
function recompute(){
  omega=2*Math.PI/T;L0=G*T*T/(2*Math.PI);
  Ir=Math.tan(beta)/Math.sqrt(Math.max(1e-6,H0/L0));
  wType=Ir<0.5?'spilling':(Ir<3.3?'plunging':'surging');
  curlF=wType==='surging'?0:clamp((Ir-0.35)/0.9,0,1);
  ph[0]=0;
  const hRef=6;                     /* 入端水深 6 m */
  const k0=solveK(hRef),c0=omega/k0;
  const cg0=c0/2*(1+2*k0*hRef/Math.sinh(2*k0*hRef));
  xBrk=LEN-1;
  for(let i=0;i<NC;i++){
    xs[i]=i;
    zb[i]=-(6-beta*i);              /* 底高程:入端 -6 m,岸线处 0 */
    hb[i]=Math.max(0.05,-zb[i]);
    const hEff=Math.min(hb[i],hRef);
    kk[i]=solveK(hEff);
    const c=omega/kk[i];
    cg[i]=c/2*(1+2*kk[i]*hEff/Math.sinh(2*kk[i]*hEff));
    HH[i]=Math.min(H0*Math.sqrt(cg0/Math.max(0.25,cg[i])),0.78*hb[i]);
    if(i>0)ph[i]=ph[i-1]+kk[i];     /* 1 m 一列,∫k dx */
    if(H0*Math.sqrt(cg0/cg[i])>0.78*hb[i]&&i<xBrk&&hb[i]>0.3)xBrk=i;  /* 首个超临界的列 */
  }
  hBrk.h=hb[xBrk];hBrk.H=Math.max(HH[xBrk],0.78*hb[xBrk]);
  buildBed();buildFoam();buildDrifters();
}

/* ---------- 水面网格 ---------- */
const surfGeo=new THREE.PlaneGeometry(LEN,NW,NC-1,8);
surfGeo.rotateX(-Math.PI/2);surfGeo.translate(LEN/2,0,0);
const surfM=new THREE.MeshStandardMaterial({color:0x15618f,roughness:0.24,metalness:0.08,transparent:true,opacity:0.88});
const surf=new THREE.Mesh(surfGeo,surfM);scene.add(surf);
const sp=surfGeo.attributes.position;
/* 海床 */
const bedGeo=new THREE.PlaneGeometry(LEN,NW+30,NC-1,4);
bedGeo.rotateX(-Math.PI/2);bedGeo.translate(LEN/2,-0.02,0);
const bedM=new THREE.MeshStandardMaterial({color:0x8a7a5c,roughness:0.95});
const bed=new THREE.Mesh(bedGeo,bedM);scene.add(bed);
function buildBed(){
  const p=bedGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i)+LEN/2;
    p.setY(i,-(6-beta*Math.min(x,6/beta+30)));
  }
  p.needsUpdate=true;bedGeo.computeVertexNormals();
}

/* ---------- 泡沫粒子(破碎卷气) ---------- */
const NF=460;
const foamGeo=new THREE.BufferGeometry();
const foamPos=new Float32Array(NF*3),foamVel=new Float32Array(NF*3),foamLife=new Float32Array(NF);
foamGeo.setAttribute('position',new THREE.BufferAttribute(foamPos,3));
const foam=new THREE.Points(foamGeo,new THREE.PointsMaterial({color:0xeef6ff,size:0.28,transparent:true,opacity:0.9,depthWrite:false}));
foam.frustumCulled=false;scene.add(foam);
for(let i=0;i<NF;i++){foamLife[i]=-1;foamPos[i*3+1]=-99;}
function spawnFoam(x,y,z,n,spx){
  for(let i=0;i<NF&&n>0;i++){
    if(foamLife[i]>=0)continue;
    n--;
    foamLife[i]=1.2+Math.random()*0.9;
    foamPos[i*3]=x+(Math.random()-0.5)*2.5;
    foamPos[i*3+1]=y+Math.random()*0.7;
    foamPos[i*3+2]=z+(Math.random()-0.5)*(NW-6);
    foamVel[i*3]=spx*(0.5+Math.random()*0.8);
    foamVel[i*3+1]=1.5+Math.random()*3.4;
    foamVel[i*3+2]=(Math.random()-0.5)*1.6;
  }
}
/* 白沫带(破碎区表面的滞留泡沫点) */
const NFP=150;
const fpatchGeo=new THREE.BufferGeometry();
const fpatchPos=new Float32Array(NFP*3),fpatchX=new Float32Array(NFP),fpatchZ=new Float32Array(NFP);
fpatchGeo.setAttribute('position',new THREE.BufferAttribute(fpatchPos,3));
const fpatch=new THREE.Points(fpatchGeo,new THREE.PointsMaterial({color:0xdff0ff,size:0.34,transparent:true,opacity:0.55,depthWrite:false}));
fpatch.frustumCulled=false;scene.add(fpatch);
function buildFoam(){
  for(let i=0;i<NFP;i++){
    fpatchX[i]=xBrk+Math.random()*16;
    fpatchZ[i]=(Math.random()-0.5)*(NW-4);
  }
}

/* ---------- 示踪粒子(轨道运动→破碎后净漂移) ---------- */
const ND=26;
const driftM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.1,8,6),
  new THREE.MeshBasicMaterial({color:0xffd43b}),ND);
driftM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(driftM);
const dX0=new Float32Array(ND);
const zeroM=new THREE.Matrix4().makeScale(0,0,0);
const tmpM=new THREE.Matrix4(),tmpQ=new THREE.Quaternion(),tmpS=new THREE.Vector3(),tmpP=new THREE.Vector3();
function buildDrifters(){
  for(let i=0;i<ND;i++){
    dX0[i]=8+i*4.2+Math.random()*1.5;
    driftM.setMatrixAt(i,zeroM);   /* 未用满的实例置零缩放 */
  }
  driftM.instanceMatrix.needsUpdate=true;
}

/* ---------- 卷舌(卷跃破碎的浪舌) ---------- */
const curl=new THREE.Mesh(
  new THREE.TorusGeometry(1,0.24,10,26,Math.PI*1.15),
  new THREE.MeshStandardMaterial({color:0x9fd4f0,roughness:0.2,transparent:true,opacity:0.9}));
curl.visible=false;scene.add(curl);
/* 崩塌型爬高水楔 */
const swash=new THREE.Mesh(new THREE.BoxGeometry(1,0.22,NW-8),
  new THREE.MeshStandardMaterial({color:0x9fd4f0,roughness:0.3,transparent:true,opacity:0.7}));
swash.visible=false;scene.add(swash);

/* ---------- 水面剖面 ---------- */
let simT=0;
function surfY(x,t){
  const i=clamp(Math.round(x),0,NC-1);
  if(hb[i]<=0.06)return zb[i]+0.02;
  const a=HH[i]/2;
  if(a<=0.005)return 0.01;
  const phi=omega*t-ph[i];
  const s2=0.5*Math.pow(HH[i]/(0.78*hb[i]+1e-6),2)*curlF*0.9;
  return a*Math.cos(phi)+0.5*s2*a*(Math.cos(2*phi)-0.35);
}
function updateSurface(t){
  for(let i=0;i<sp.count;i++){
    sp.setY(i,surfY(sp.getX(i),t));
  }
  sp.needsUpdate=true;
  surfGeo.computeVertexNormals();
}

/* ---------- 标签 ---------- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});
  div.textContent=textFn();
  return o;
}
addLabel(()=>L('深水:水质点画圆,波形对称','Deep water: circular orbits, near-symmetric wave'),new THREE.Vector3(22,5.0,0),'b');
addLabel(()=>L('浅化:触底减速,波高被顶起 H∝h^(-1/4)','Shoaling: slowing on the bed, height grows H∝h^(-1/4)'),new THREE.Vector3(42,4.6,0),'b');
addLabel(()=>L('破碎点:H/h→0.78,波峰快过波相速','Break point: H/h→0.78, crest outruns the phase speed'),new THREE.Vector3(0,4.6,0),'o',()=>curl.visible,curl);
const curlLbl=addLabel(()=>L('卷舌:波峰前倾卷落,卷气成白沫','The tongue pitches over, entraining air into foam'),new THREE.Vector3(0,3.2,0),'o',()=>curl.visible,curl);
const surgeLbl=addLabel(()=>L('崩塌:浪不卷,直接爬上陡滩','Surging: no curl — the wave runs up the steep face'),new THREE.Vector3(0,3.2,0),'g',()=>swash.visible,swash);
addLabel(()=>L('破碎区:湍流耗散,白沫带;骑浪要骑没破的那段','Surf zone: turbulent dissipation; surfers ride the unbroken face'),new THREE.Vector3(0,2.6,14),'g');

/* ---------- 步骤 ---------- */
const camTween={k:1};
function flyTo(px,py,pz,tx,ty,tz){camTween.p0=camera.position.clone();camTween.p1=new THREE.Vector3(px,py,pz);
  camTween.t0=controls.target.clone();camTween.t1=new THREE.Vector3(tx,ty,tz);camTween.k=0;}
function preset(sp_,b,h0,t){beta=b;H0=h0;T=t;recompute();flyTo(sp_[0],sp_[1],sp_[2],sp_[3],0,0);
  document.querySelectorAll('.abtn').forEach(x=>x.classList.remove('on'));
  document.getElementById(sp_[4]==='spill'?'pSpill':sp_[4]==='plunge'?'pPlunge':'pSurge').classList.add('on');
  syncSlidersVal();}
function syncSlidersVal(){
  document.getElementById('sBeta').value=beta;document.getElementById('sBetaVal').textContent=beta.toFixed(3);
  document.getElementById('sH0').value=H0;document.getElementById('sH0Val').textContent=H0.toFixed(1)+' m';
  document.getElementById('sT').value=T;document.getElementById('sTVal').textContent=T.toFixed(1)+' s';
}
const STEPS=[
  {zh:'深水涌浪:水质点画圆,波速 c=√(gL₀/2π)/2·(1+…)——动能势能对半',en:'Deep swell: water particles trace circles, energy split half kinetic half potential',
   act(){preset([2,6,44,18],'spill',0.02,1.2,6);slowK=0.35;syncSlow();}},
  {zh:'浅化:能量通量守恒,波高被顶起 H∝1/√(c_g),波长变短',en:'Shoaling: energy flux conserved — H∝1/√(c_g), wavelength shrinks',
   act(){preset([16,7,46,46],'plunge',0.075,1.6,7);slowK=0.35;syncSlow();}},
  {zh:'临界:H/h→0.78(McCowan 判据),波峰变尖、前坡变陡',en:'Critical: H/h→0.78 (McCowan), crest sharpens, front face steepens',
   act(){preset([30,6,44,52],'plunge',0.075,1.8,8);slowK=0.2;syncSlow();}},
  {zh:'卷跃破碎:波峰水质点快过波相速,浪舌卷成管子砸下',en:'Plunging: crest particles outrun the phase speed — the tongue curls into a barrel',
   act(){preset([46,4.5,30,54],'plunge',0.075,1.6,7);slowK=0.12;syncSlow();}},
  {zh:'三形态由 Ir=tanβ/√(H₀/L₀) 定:缓坡溢散、中坡卷跃、陡坡崩塌',en:'Ir=tanβ/√(H₀/L₀) picks the type: gentle spilling, mid plunging, steep surging',
   act(){preset([30,7,48,58],'spill',0.018,1.6,6.5);slowK=0.3;syncSlow();}},
  {zh:'破碎区:湍流耗散、卷气成白沫;冲浪者骑的是还没破碎的那段浪面',en:'Surf zone: turbulent dissipation and white foam; surfers ride the still-unbroken face',
   act(){preset([54,5,26,66],'plunge',0.09,2.0,9);slowK=0.25;syncSlow();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function syncSlow(){document.getElementById('sSlow').value=slowK;
  document.getElementById('sSlowVal').textContent=slowK.toFixed(2)+'×';}
function updateStats(){
  document.getElementById('stH').innerHTML=hBrk.h.toFixed(2)+'<small> m</small>';
  document.getElementById('stB').innerHTML=hBrk.H.toFixed(2)+'<small> m</small>';
  const elR=document.getElementById('stR');
  const ratio=hBrk.h>0.05?hBrk.H/hBrk.h:0;
  elR.innerHTML=ratio.toFixed(2);
  elR.className='v'+(ratio>0.74?' bad':'');
  const elI=document.getElementById('stIr');
  elI.innerHTML=Ir.toFixed(2)+'<small> '+
    (wType==='spilling'?L('溢散','spilling'):wType==='plunging'?L('卷跃','plunging'):L('崩塌','surging'))+'</small>';
  elI.className='v'+(wType==='plunging'?' ok':'');
}

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  applySky();
  const dark=THEME==='dark';
  bedM.color.setHex(dark?0x8a7a5c:0xc9b892);
  surfM.color.setHex(dark?0x15618f:0x2b8ac2);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('sBetaVal').textContent=beta.toFixed(3);
  document.getElementById('sH0Val').textContent=H0.toFixed(1)+' m';
  document.getElementById('sTVal').textContent=T.toFixed(1)+' s';
  syncSlow();buildSteps();updateStats();
}

/* ---------- 事件 ---------- */
document.getElementById('sBeta').addEventListener('input',e=>{beta=+e.target.value;
  document.getElementById('sBetaVal').textContent=beta.toFixed(3);recompute();});
document.getElementById('sH0').addEventListener('input',e=>{H0=+e.target.value;
  document.getElementById('sH0Val').textContent=H0.toFixed(1)+' m';recompute();});
document.getElementById('sT').addEventListener('input',e=>{T=+e.target.value;
  document.getElementById('sTVal').textContent=T.toFixed(1)+' s';recompute();});
document.getElementById('sSlow').addEventListener('input',e=>{slowK=+e.target.value;
  document.getElementById('sSlowVal').textContent=slowK.toFixed(2)+'×';});
document.getElementById('pSpill').addEventListener('click',()=>preset([2,6,44,26],'spill',0.018,1.6,6.5));
document.getElementById('pPlunge').addEventListener('click',()=>preset([40,4.5,32,52],'plunge',0.075,1.6,7));
document.getElementById('pSurge').addEventListener('click',()=>preset([64,6,36,76],'surge',0.15,0.6,13.5));
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglDrift').addEventListener('change',e=>{driftOn=e.target.checked;});
document.getElementById('tglFoam').addEventListener('change',e=>{foamOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';
  localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0,lastCyc=0;
if(!labelsOn)document.getElementById('tglLabels').checked=false;
if(!playingInit){playing=false;document.getElementById('play').textContent=L('运行','Run');}

function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=dt0*slowK*(playing?1:0);
  simT+=dt;
  /* 相机飞行 */
  if(camTween.k<1){
    camTween.k=Math.min(1,camTween.k+dt0*1.6);
    const e=1-Math.pow(1-camTween.k,3);
    camera.position.lerpVectors(camTween.p0,camTween.p1,e);
    controls.target.lerpVectors(camTween.t0,camTween.t1,e);
  }
  updateSurface(simT);
  /* 破碎循环相位:波峰到达破碎点 */
  const cyc=((omega*simT-ph[xBrk])/(2*Math.PI)%1+1)%1;
  const breaking=wType!=='surging'&&curlF>0.08;
  /* 卷舌:伸舌→卷落→消失 */
  if(breaking&&cyc<0.42){
    const grow=clamp(cyc/0.14,0,1);
    const fall=clamp((cyc-0.2)/0.2,0,1);
    curl.visible=true;
    const RR=hBrk.H*0.5;
    curl.scale.set(RR,RR,RR);
    curl.position.set(xBrk+1.2+RR*0.5*Math.sin(cyc*14),hBrk.H*0.62-RR*0.7,0);
    curl.rotation.z=0.55*curlF-1.85*fall*fall;
    curl.material.opacity=0.95*(1-fall*0.85);
    /* 卷落溅起泡沫 */
    if(cyc>0.26&&lastCyc<=0.26){
      spawnFoam(xBrk+2.5,0.3,0,26,Math.max(1.5,omega/kk[xBrk]*0.55));
    }
  }else curl.visible=false;
  lastCyc=cyc;
  /* 溢散型:波峰前坡持续淌下小泡沫 */
  if(playing&&wType==='spilling'&&Math.random()<dt*22){
    spawnFoam(xBrk+1+Math.random()*4,HH[xBrk]*0.4,0,3,1.2);
  }
  /* 泡沫粒子积分 */
  for(let i=0;i<NF;i++){
    if(foamLife[i]<0)continue;
    foamLife[i]-=dt;
    if(foamLife[i]<=0){foamLife[i]=-1;foamPos[i*3+1]=-99;continue;}
    foamVel[i*3+1]-=6.5*dt;
    foamPos[i*3]+=foamVel[i*3]*dt;
    foamPos[i*3+1]+=foamVel[i*3+1]*dt;
    foamPos[i*3+2]+=foamVel[i*3+2]*dt;
    const gy=surfY(foamPos[i*3],simT);
    if(foamPos[i*3+1]<gy+0.05){foamPos[i*3+1]=gy+0.05;foamVel[i*3+1]=0;foamVel[i*3]*=0.94;}
  }
  foamGeo.attributes.position.needsUpdate=true;
  foam.visible=foamOn;
  /* 白沫带贴着水面 */
  for(let i=0;i<NFP;i++){
    fpatchPos[i*3]=fpatchX[i];
    fpatchPos[i*3+1]=surfY(fpatchX[i],simT)+0.06;
    fpatchPos[i*3+2]=fpatchZ[i];
  }
  fpatchGeo.attributes.position.needsUpdate=true;
  fpatch.visible=foamOn&&wType!=='surging';
  /* 示踪粒子:轨道椭圆 + 破碎后净漂移 */
  if(driftOn){
    for(let i=0;i<ND;i++){
      let x0=dX0[i];
      if(x0>xBrk)x0=xBrk+((dX0[i]+simT*0.55*3)%26);   /* 破碎区向岸净漂移 */
      const i2=clamp(Math.round(x0),0,NC-1);
      const a=HH[i2]/2;
      const phi=omega*simT-ph[i2];
      const y0=-0.35;
      const Ahoz=a/Math.tanh(Math.max(0.3,kk[i2]*hb[i2]));
      const Avt=a*Math.sinh(Math.max(0.2,kk[i2]*(y0+hb[i2])))/Math.sinh(Math.max(0.2,kk[i2]*hb[i2]));
      tmpP.set(x0+Ahoz*Math.cos(phi),Math.max(-hb[i2]+0.12,y0+Avt*Math.sin(phi)),0);
      tmpM.compose(tmpP,tmpQ,tmpS.set(1,1,1));
      driftM.setMatrixAt(i,tmpM);
    }
    driftM.instanceMatrix.needsUpdate=true;
  }else{
    for(let i=0;i<ND;i++)driftM.setMatrixAt(i,zeroM);
    driftM.instanceMatrix.needsUpdate=true;
  }
  driftM.visible=driftOn;
  /* 崩塌型爬高 */
  if(wType==='surging'){
    swash.visible=true;
    const shore=6/beta;
    const sw=4+3.4*Math.sin(omega*simT-ph[clamp(Math.round(shore),0,NC-1)]);
    swash.scale.set(Math.max(1,sw),1,1);
    swash.rotation.z=Math.atan(beta);
    swash.position.set(shore+sw*0.5*Math.cos(Math.atan(beta))+0.5,
      -(6-beta*shore)+sw*0.5*Math.sin(Math.atan(beta))+0.15,0);
  }else swash.visible=false;
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();recompute();start();
</script>
