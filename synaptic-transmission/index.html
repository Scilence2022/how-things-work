<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>突触传递 · 电信号→化学信号→电信号 3D</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#c9622f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#9c4a1f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.b { border-color: rgba(127,208,247,.9); color: #c9e9ff; }
  .lbl.o { border-color: rgba(255,159,67,.9); color: #ffd8ae; }
  .lbl.r { border-color: rgba(244,143,177,.9); color: #ffcbdd; }
  .lbl.g { border-color: rgba(144,190,109,.9); color: #d3ecb8; }
  .lbl.p { border-color: rgba(203,174,232,.9); color: #e2d5f5; }
  .lbl.c { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.hot { border-color: rgba(255,93,93,.9); color: #ff8a80; font-weight: 700; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 344px; height: 210px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.ach { color: #ffc188; border-color: rgba(255,159,67,.7); }
  .chip.ca  { color: #d5c6f2; border-color: rgba(179,157,219,.7); }
  .chip.na  { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  :root[data-theme="light"] .chip.ach { color: #b26214; border-color: rgba(178,98,20,.7); }
  :root[data-theme="light"] .chip.ca  { color: #6a4fa3; border-color: rgba(106,79,163,.7); }
  :root[data-theme="light"] .chip.na  { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(201,98,47,.12); border-color: rgba(201,98,47,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(156,74,31,.10); border-color: rgba(156,74,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #toggles label.hot { color: #ff8a80; font-weight: 600; }
  :root[data-theme="light"] #toggles label.hot { color: #b23b32; }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="突触传递：电信号 → 化学信号 → 电信号" data-en="Synaptic transmission: electrical → chemical → electrical">突触传递：电信号 → 化学信号 → 电信号</h1>
  <div class="sub" data-zh="动作电位抵达 → Ca²⁺ 点火 → 囊泡融合释放递质 → 受体开门 Na⁺ 内流 → 酶水解灭场——20 nm 间隙里的翻译现场 · 3D 交互演示：鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="AP arrives → Ca²⁺ trigger → vesicle fusion releases transmitter → receptors open to Na⁺ → enzymes clear the stage — the 20 nm translation site · 3D interactive: drag to orbit / scroll to zoom · Space = play/pause">动作电位抵达 → Ca²⁺ 点火 → 囊泡融合释放递质 → 受体开门 Na⁺ 内流 → 酶水解灭场——20 nm 间隙里的翻译现场 · 3D 交互演示：鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="plot">
  <h3 data-zh="突触后电位 EPSP(后膜电位)" data-en="Postsynaptic potential (EPSP)">突触后电位 EPSP(后膜电位)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip ach" data-zh="ACh 乙酰胆碱(递质)" data-en="ACh (transmitter)">ACh 乙酰胆碱(递质)</span>
    <span class="chip ca" data-zh="Ca²⁺ 点火" data-en="Ca²⁺ trigger">Ca²⁺ 点火</span>
    <span class="chip na" data-zh="Na⁺ 内流 = EPSP" data-en="Na⁺ in = EPSP">Na⁺ 内流 = EPSP</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label class="hot"><input id="tglBotox" type="checkbox"> <span data-zh="肉毒毒素:剪断 SNARE" data-en="Botulinum: snips SNARE">肉毒毒素:剪断 SNARE</span></label>
    <label class="hot"><input id="tglOp" type="checkbox"> <span data-zh="有机磷:抑制 AChE" data-en="Organophosphate: blocks AChE">有机磷:抑制 AChE</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../action-potential/" data-zh="上游:动作电位怎么来" data-en="upstream: how the AP fires">上游:动作电位怎么来</a>
    <a href="../sodium-potassium-pump/" data-zh="Na⁺ 梯度从哪来(钠钾泵)" data-en="where the Na⁺ gradient comes from">Na⁺ 梯度从哪来(钠钾泵)</a>
    <a href="../enzyme-induced-fit/" data-zh="AChE 是台酶:诱导契合" data-en="AChE is an enzyme: induced fit">AChE 是台酶:诱导契合</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('突触传递 · 电信号→化学信号→电信号 3D',
                     'Synaptic Transmission · Electrical → Chemical → Electrical 3D');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.6, 2.6, 7.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.9, 0.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 18;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 常量:布局与时序(与 2D 版一致) ---------------- */
const CYCLE = 12;
const COL_ACH = 0xff9f43, COL_CA = 0xcbaee8, COL_NA = 0x4cc9f0;
const COL_V = 0xffd166, COL_SPARK = 0xffe08a, COL_SNARE = 0x90be6d, COL_ACHE = 0x4dd0e1;
const COL_PINK = 0xf48fb1, COL_FRAG = 0x9aa7b8;
/* 2D 画布坐标 → 世界坐标映射 */
const wx = ox => (ox - 800) / 150, wy = oy => (430 - oy) / 150;
const MEM_Y = wy(400);                       // 突触前膜底 0.2
const POST_Y = wy(460);                      // 突触后膜顶 -0.2
const DOCK = new THREE.Vector3(0, wy(352), 0);
const V0 = new THREE.Vector3(wx(420), wy(180), 0.4);
const V1 = new THREE.Vector3(wx(540), wy(170), -0.7);
const CA_POS = [{ x: wx(720), z: 0.35 }, { x: wx(790), z: -0.3 }, { x: wx(860), z: 0.4 }];
const ACH_LAND = [[520, 445, 0.25], [560, 432, -0.2], [600, 448, 0.3], [648, 436, -0.3], [688, 446, 0.2], [726, 430, -0.15]]
  .map(p => new THREE.Vector3(wx(p[0]), wy(p[1]), p[2]));
const RCH = [{ x: wx(750), z: 0.3 }, { x: wx(830), z: -0.35 }, { x: wx(910), z: 0.35 }];
const ACH_X = [[510, 438, 0.35], [598, 442, -0.3], [682, 440, 0.3]]
  .map(p => new THREE.Vector3(wx(p[0]), wy(p[1]), p[2]));
const ACH_EAT = [[505, 432, 0.35], [600, 428, -0.35], [690, 434, 0.2]]
  .map(p => new THREE.Vector3(wx(p[0]), wy(p[1]), p[2]));
const TRA = new THREE.Vector3(wx(480), 0.12, -0.4);
const SPRAY_T = [0.44, 0.46, 0.48, 0.50, 0.52, 0.54];
const CA_T = Array.from({ length: 12 }, (_, i) => 0.14 + i * 0.011);
const NA_T = Array.from({ length: 10 }, (_, i) => 0.58 + i * 0.014);
const SPLIT_T = [0.72, 0.75, 0.78, 0.81];

/* ---------------- 相位讲解(与 2D 版一致) ---------------- */
const STEPS = [
  { t0: 0.00, b: '动作电位抵达', d: '电脉冲沿轴突传到末梢,末端膜去极化——电信号的「到站铃声」。',
    be: 'AP arrives', de: 'The pulse races down the axon into the terminal and depolarizes its membrane — the doorbell of the electrical signal.' },
  { t0: 0.12, b: 'Ca²⁺ 点火', d: '去极化打开电压门控 Ca²⁺ 通道,Ca²⁺ 涌入胞内——这是融合的扳机,没有钙,就没有释放。',
    be: 'Ca²⁺ trigger', de: 'Depolarization opens voltage-gated Ca²⁺ channels; Ca²⁺ floods in — the trigger for fusion. No calcium, no release.' },
  { t0: 0.28, b: '融合 · 释放', d: 'SNARE 像拉链一样把囊泡拽上突触前膜,融合孔打开,乙酰胆碱倾泻进 ~20 nm 的间隙——电信号换装成化学信号。',
    be: 'Fusion · release', de: 'SNAREs zipper the vesicle onto the presynaptic membrane; the fusion pore opens and acetylcholine pours into the ~20 nm cleft — the signal changes costume.' },
  { t0: 0.52, b: '受体开门 · EPSP', d: 'ACh 结合配体门控受体,通道开门放 Na⁺ 内流——后膜去极化产生 EPSP,化学信号翻译回电信号。',
    be: 'Receptors open · EPSP', de: 'ACh binds ligand-gated receptors; gates open to Na⁺, depolarizing the post cell — the EPSP translates chemistry back into electricity.' },
  { t0: 0.70, b: 'AChE 水解 · 回收', d: 'AChE 把 ACh 切成乙酸 + 胆碱,信号即刻清场;胆碱被转运体回收回末梢——快,是突触的全部美德。',
    be: 'AChE clears the stage', de: 'AChE splits ACh into acetate + choline, wiping the signal instantly; choline is re-uptaken. Speed is the synapse\'s whole virtue.' },
  { t0: 0.88, b: '再装填', d: '回收的胆碱重新合成 ACh 装入囊泡,备用囊泡补位——周而复始,每秒可达上百次。',
    be: 'Refill', de: 'Recycled choline is rebuilt into ACh and reloaded; a spare vesicle takes position — hundreds of times per second.' },
];
function stepIndex(t) {
  if (t < 0.12) return 0;
  if (t < 0.28) return 1;
  if (t < 0.52) return 2;
  if (t < 0.70) return 3;
  if (t < 0.88) return 4;
  return 5;
}

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}

/* ================= 静态场景 ================= */
/* 突触前末梢(膨大) */
const preMat = new THREE.MeshPhysicalMaterial({ color: 0x7fd0f7, transparent: true, opacity: 0.13,
  roughness: 0.3, side: THREE.DoubleSide, depthWrite: false });
const terminal = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), preMat);
terminal.scale.set(3.27, 1.12, 1.5);
terminal.position.set(-1.27, 1.31, 0);
scene.add(terminal);
/* 轴突 */
const axonCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-8.5, 3.7, 0), new THREE.Vector3(-6, 2.9, 0),
  new THREE.Vector3(-4.5, 2.0, 0), new THREE.Vector3(-3.6, 1.5, 0)]);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(axonCurve, 32, 0.5, 12, false), preMat));
/* 活性区(突触前膜底) */
const preMem = new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.06, 2.6),
  mat(0x7fd0f7, { opacity: 0.22, emissiveIntensity: 0.05 }));
preMem.position.set(-1.27, MEM_Y, 0);
scene.add(preMem);
/* 间隙带 ~20 nm */
const cleftBand = new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.4, 2.6),
  mat(COL_ACH, { opacity: 0.06, emissive: 0x000000, depthWrite: false }));
cleftBand.position.set(-1.27, 0, 0);

/* ================= 场景更新(全部由相位 t 决定) ================= */
const tmpV = new THREE.Vector3();
function updateScene(t) {
  /* 动作电位光点 */
  if (t < 0.12) {
    const k = ss(0.01, 0.10, t);
    const a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k;
    spark.position.set(
      a * SP_P0.x + b * SP_PC.x + c * SP_P1.x,
      a * SP_P0.y + b * SP_PC.y + c * SP_P1.y,
      a * SP_P0.z + b * SP_PC.z + c * SP_P1.z);
    spark.visible = true;
    sparkGlow.scale.setScalar(1 + 0.3 * Math.sin(t * 200));
    sparkLbl.o.position.copy(spark.position).add(tmpV.set(0.28, 0.2, 0));
  } else spark.visible = false;

  /* Ca²⁺ 通道 */
  const caOpen = ss(0.13, 0.18, t) * (1 - ss(0.28, 0.33, t));
  for (const g of caChannels) {
    g.userData.flap.rotation.z = -caOpen * 1.2;
    g.userData.pore.material.emissiveIntensity = 0.12 + caOpen * 0.9;
  }
  /* 受体 */
  const anyBound = !botox && t >= 0.52;
  const rcOpen = !anyBound ? 0 : (op ? 1 : 1 - ss(0.86, 0.94, t));
  receptors.forEach((g, i) => {
    g.userData.flap.rotation.z = -clamp(rcOpen, 0, 1) * 1.2;
    const bound = i < 2 && anyBound && (op || t < 0.86);
    g.userData.pore.material.emissiveIntensity = 0.12 + (bound ? 0.8 : rcOpen * 0.4);
  });
  /* 囊泡 */
  const dock = ss(0.28, 0.40, t);
  const released = !botox && t >= 0.46;
  vesicle.position.lerpVectors(V0, DOCK, dock);
  const fade = released ? clamp(1 - ss(0.46, 0.56, t), 0, 1) : 1;
  vesicle.visible = fade > 0.01;
  vesicle.traverse(o => { if (o.material) o.material.opacity = o.userData.baseOp * fade; });
  vesLbl.o.position.copy(vesicle.position).add(tmpV.set(-0.1, 0.55, 0));
  /* SNARE */
  const docked = t >= 0.34;
  const zipped = botox ? 0.4 : ss(0.36, 0.44, t);
  snares.forEach(c2 => {
    const len = 0.05 + zipped * 0.14;
    c2.visible = docked;
    c2.scale.y = len;
    c2.position.y = MEM_Y + len / 2;
    c2.rotation.z = botox ? 0.45 : 0;
  });
  /* 融合孔 */
  const pk = (!botox && t >= 0.42) ? ss(0.42, 0.46, t) : 0;
  fusionPore.visible = pk > 0;
  fusionPore.material.opacity = pk * 0.7;
  /* 备用囊泡补位 */
  spare.visible = t >= 0.88;
  if (spare.visible) {
    const k = ss(0.88, 0.96, t);
    spare.position.lerpVectors(V1, tmpV.set(wx(700), wy(260), 0), k);
    spareLbl.o.position.copy(spare.position).add(tmpV.set(0, 0.5, 0));
  }

  /* ---- 粒子 ---- */
  for (let i = 0; i < 12; i++) {                     // Ca²⁺ 内流
    const k = ss(CA_T[i], CA_T[i] + 0.05, t);
    if (k <= 0 || k >= 1) { hideDot(i); continue; }
    setDot(i, CA_POS[i % 3].x + (i % 2 ? 0.047 : -0.047),
      lerp(wy(448), wy(330 + (i % 4) * 8), k), CA_POS[i % 3].z, 0.055);
  }
  for (let i = 0; i < 6; i++) {                      // ACh 喷涌 → 受体
    const idx = 12 + i, k = ss(SPRAY_T[i], SPRAY_T[i] + 0.08, t);
    if (k <= 0 || botox) { hideDot(idx); continue; }
    const lp = ACH_LAND[i];
    if (k < 1 || i >= 2) {
      setDot(idx, lerp(DOCK.x, lp.x, k), lerp(DOCK.y - 0.2, lp.y, k) - 0.05 * Math.sin(k * Math.PI),
        lerp(0, lp.z, k), 0.06);
      continue;
    }
    const b = ss(0.50, 0.58, t);
    if (b < 1) setDot(idx, lerp(lp.x, RCH[i].x, b), lerp(lp.y, wy(482), b), lerp(lp.z, RCH[i].z, b), 0.06);
    else if (op || t < 0.86) setDot(idx, RCH[i].x, wy(482), RCH[i].z, 0.06);
    else hideDot(idx);
  }
  for (let i = 0; i < 3; i++) {                      // 间隙 ACh → AChE 水解
    const p = ACH_X[i];
    const sp = op ? 0 : ss(SPLIT_T[i], SPLIT_T[i] + 0.05, t);
    if (sp <= 0 || sp >= 1) {
      setDot(18 + i, p.x, p.y, p.z, 0.06); hideDot(21 + i); hideDot(24 + i);
    } else {
      hideDot(18 + i);
      setDot(21 + i, p.x - 0.08 * sp, p.y - 0.04 * sp, p.z, 0.045);   // 乙酸
      setDot(24 + i, p.x + 0.08 * sp, p.y - 0.067 * sp, p.z, 0.045);  // 胆碱
    }
  }
  for (let i = 0; i < 3; i++) {                      // 胆碱回收
    const idx = 27 + i;
    const k = op ? 0 : ss(SPLIT_T[i] + 0.10, SPLIT_T[i] + 0.18, t);
    if (k <= 0 || k >= 1) { hideDot(idx); continue; }
    const p = ACH_X[i];
    setDot(idx, lerp(p.x + 0.08, wx(486), k), lerp(p.y - 0.067, 0.12, k), lerp(p.z, TRA.z, k), 0.045);
  }
  for (let i = 0; i < 3; i++) {                      // 再装填
    const idx = 30 + i;
    const k = (t < 0.9 || op) ? 0 : ss(0.90 + i * 0.02, 0.94 + i * 0.02, t);
    if (k <= 0 || k >= 1) { hideDot(idx); continue; }
    setDot(idx, lerp(wx(480), wx(700), k), lerp(0.12, wy(250), k), lerp(TRA.z, 0.2, k), 0.055);
  }
  for (let i = 0; i < 10; i++) {                     // Na⁺ 内流
    const idx = 33 + i, f = NA_T[i];
    if (t < f || botox) { hideDot(idx); continue; }
    const k = clamp((t - f) / 0.2, 0, 1);
    setDot(idx, RCH[i % 3].x + (i % 2 ? 0.067 : -0.067),
      lerp(wy(490), wy(610 + (i % 4) * 20), k), RCH[i % 3].z, 0.06 * (1 - 0.35 * k));
  }
  for (let i = 0; i < 6; i++) {                      // 有机磷:持续内流
    const idx = 43 + i;
    if (!(op && t > 0.72)) { hideDot(idx); continue; }
    const k = ((t - 0.72) * 2.2 + i / 6) % 1;
    setDot(idx, RCH[i % 3].x + (i % 2 ? 0.08 : -0.08), lerp(wy(494), wy(650), k), RCH[i % 3].z, 0.06);
  }
  dots.instanceMatrix.needsUpdate = true;
}

/* ================= EPSP 示波小卡(HUD) ================= */
const plotCv = document.getElementById('plotCv');
function mvt(tt) {
  if (botox) return -70;
  const rise = 25 * ss(0.56, 0.70, tt);
  const decay = op ? 0 : 25 * ss(0.74, 0.92, tt);
  return -70 + rise - decay;
}
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(htmlEl);
  const cDim = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const cDim2 = css.getPropertyValue('--text3').trim() || '#c7d2de';
  const cGrid = css.getPropertyValue('--panel-border').trim() || 'rgba(255,255,255,.1)';
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
  const gx0 = 76, gx1 = W - 24, gy0 = 14, gy1 = H - 52;
  const yOf = v => gy1 - (v + 70) / 25 * (gy1 - gy0 - 26);
  ctx.strokeStyle = cDim; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(gx0, gy1); ctx.lineTo(gx1, gy1); ctx.moveTo(gx0, gy0); ctx.lineTo(gx0, gy1); ctx.stroke();
  ctx.strokeStyle = cGrid; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(gx0, yOf(-45)); ctx.lineTo(gx1, yOf(-45)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = `500 20px ${FONT}`; ctx.fillStyle = cDim2; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('-70 mV', gx0 - 10, gy1 + 4);
  ctx.fillText('-45 mV', gx0 - 10, yOf(-45) + 4);
  ctx.fillText(L('时间', 'time'), gx1, gy1 + 34);
  ctx.strokeStyle = '#4cc9f0'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= 80; i++) {
    const tt = i / 80, px = lerp(gx0, gx1, tt), py = yOf(mvt(tt));
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
  if (t01 > 0.5) {
    const v = mvt(t01), mx = lerp(gx0, gx1, t01), my = yOf(v);
    ctx.fillStyle = '#4cc9f0';
    ctx.beginPath(); ctx.arc(mx, my, 7, 0, Math.PI * 2); ctx.fill();
    ctx.font = `700 22px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText(Math.round(v) + ' mV', Math.min(mx + 14, gx1 - 90), my - 12);
  }
}

});
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglBotox.addEventListener('change', () => { botox = tglBotox.checked; applyToxins(); });
tglOp.addEventListener('change', () => { op = tglOp.checked; applyToxins(); });
tglBotox.checked = botox; tglOp.checked = op;
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) { clock.getDelta(); return; }
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) cycles += dt * speed / CYCLE;
  t01 = cycles - Math.floor(cycles);

  updateScene(t01);
  drawPlot();

  for (const r of labelRegistry) {
    r.o.element.textContent = r.text();
    r.o.element.style.display = (showLabels && (!r.vis || r.vis())) ? '' : 'none';
  }
  const si = stepIndex(t01);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t01 * 1000);
  elScrubVal.textContent = Math.round(t01 * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyToxins();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
