<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>突触传递 · 电信号→化学信号→电信号 动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#c9622f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#9c4a1f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.ach { color: #ffc188; border-color: rgba(255,159,67,.7); }
  .chip.ca  { color: #d5c6f2; border-color: rgba(179,157,219,.7); }
  .chip.na  { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  :root[data-theme="light"] .chip.ach { color: #b26214; border-color: rgba(178,98,20,.7); }
  :root[data-theme="light"] .chip.ca  { color: #6a4fa3; border-color: rgba(106,79,163,.7); }
  :root[data-theme="light"] .chip.na  { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(201,98,47,.12); border-color: rgba(201,98,47,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(156,74,31,.10); border-color: rgba(156,74,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #toggles label.hot { color: #ff8a80; font-weight: 600; }
  :root[data-theme="light"] #toggles label.hot { color: #b23b32; }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="突触传递：电信号 → 化学信号 → 电信号" data-en="Synaptic transmission: electrical → chemical → electrical">突触传递：电信号 → 化学信号 → 电信号</h1>
  <div class="sub" data-zh="动作电位抵达 → Ca²⁺ 点火 → 囊泡融合释放递质 → 受体开门 Na⁺ 内流 → 酶水解灭场——20 nm 间隙里的翻译现场 · 空格播放/暂停" data-en="AP arrives → Ca²⁺ trigger → vesicle fusion releases transmitter → receptors open to Na⁺ → enzymes clear the stage — the 20 nm translation site · Space = play/pause">动作电位抵达 → Ca²⁺ 点火 → 囊泡融合释放递质 → 受体开门 Na⁺ 内流 → 酶水解灭场——20 nm 间隙里的翻译现场 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip ach" data-zh="ACh 乙酰胆碱(递质)" data-en="ACh (transmitter)">ACh 乙酰胆碱(递质)</span>
    <span class="chip ca" data-zh="Ca²⁺ 点火" data-en="Ca²⁺ trigger">Ca²⁺ 点火</span>
    <span class="chip na" data-zh="Na⁺ 内流 = EPSP" data-en="Na⁺ in = EPSP">Na⁺ 内流 = EPSP</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label class="hot"><input id="tglBotox" type="checkbox"> <span data-zh="肉毒毒素:剪断 SNARE" data-en="Botulinum: snips SNARE">肉毒毒素:剪断 SNARE</span></label>
    <label class="hot"><input id="tglOp" type="checkbox"> <span data-zh="有机磷:抑制 AChE" data-en="Organophosphate: blocks AChE">有机磷:抑制 AChE</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('突触传递 · 电信号→化学信号→电信号动画',
                     'Synaptic Transmission · Electrical → Chemical → Electrical');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function dot(x, y, r, color, glow) {
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  circle(x, y, r, color);
  ctx.shadowBlur = 0;
}

/* ================= 常量:突触布局与时序 ================= */
const CYCLE = 12;
const PRE = { x: 120, y: 70, w: 980, h: 330 };      // 突触前末梢
const CLEFT_Y = 400, POST_Y = 460;                  // 间隙带 400..460,后膜 460..486
const CA_X = [720, 790, 860];                        // 电压门控 Ca²⁺ 通道
const DOCK = { x: 800, y: 352 };                     // 囊泊融合位
const V0 = { x: 420, y: 180 }, V1 = { x: 540, y: 170 }; // 囊泡 / 备用囊泡
const ACH_LAND = [[520, 445], [560, 432], [600, 448], [648, 436], [688, 446], [726, 430]];
const RCH = [750, 830, 910];                         // 受体位置
const ACH_X = [[510, 438], [598, 442], [682, 440]];  // 停留在间隙的 ACh(可被水解的 3 颗)
const ACH_EAT = [[505, 432], [600, 428], [690, 434]]; // AChE 位置
const TRA = { x: 480, y: 396 };                      // 转运体(胆碱回收)
const SPRAY_T = [0.44, 0.46, 0.48, 0.50, 0.52, 0.54];
const CA_T = Array.from({ length: 12 }, (_, i) => 0.14 + i * 0.011);
const NA_T = Array.from({ length: 10 }, (_, i) => 0.58 + i * 0.014);
const SPLIT_T = [0.72, 0.75, 0.78, 0.81];
const COL_ACH = '#ff9f43', COL_CA = '#cbaee8', COL_NA = '#4cc9f0';
const COL_V = '#ffd166', COL_SPARK = '#ffe08a', COL_SNARE = '#90be6d', COL_ACHE = '#4dd0e1';
const COL_H2O = '#4dd0e1';

/* ================= 相位讲解 ================= */
const STEPS = [
  { t0: 0.00, t1: 0.12, n: 1, b: '动作电位抵达', d: '电脉冲沿轴突传到末梢,末端膜去极化——电信号的「到站铃声」。',
    be: 'AP arrives', de: 'The pulse races down the axon into the terminal and depolarizes its membrane — the doorbell of the electrical signal.' },
  { t0: 0.12, t1: 0.28, n: 2, b: 'Ca²⁺ 点火', d: '去极化打开电压门控 Ca²⁺ 通道,Ca²⁺ 涌入胞内——这是融合的扳机,没有钙,就没有释放。',
    be: 'Ca²⁺ trigger', de: 'Depolarization opens voltage-gated Ca²⁺ channels; Ca²⁺ floods in — the trigger for fusion. No calcium, no release.' },
  { t0: 0.28, t1: 0.52, n: 3, b: '融合 · 释放', d: 'SNARE 像拉链一样把囊泡拽上突触前膜,融合孔打开,乙酰胆碱倾泻进 ~20 nm 的间隙——电信号换装成化学信号。',
    be: 'Fusion · release', de: 'SNAREs zipper the vesicle onto the presynaptic membrane; the fusion pore opens and acetylcholine pours into the ~20 nm cleft — the signal changes costume.' },
  { t0: 0.52, t1: 0.70, n: 4, b: '受体开门 · EPSP', d: 'ACh 结合配体门控受体,通道开门放 Na⁺ 内流——后膜去极化产生 EPSP,化学信号翻译回电信号。',
    be: 'Receptors open · EPSP', de: 'ACh binds ligand-gated receptors; gates open to Na⁺, depolarizing the post cell — the EPSP translates chemistry back into electricity.' },
  { t0: 0.70, t1: 0.88, n: 5, b: 'AChE 水解 · 回收', d: 'AChE 把 ACh 切成乙酸 + 胆碱,信号即刻清场;胆碱被转运体回收回末梢——快,是突触的全部美德。',
    be: 'AChE clears the stage', de: 'AChE splits ACh into acetate + choline, wiping the signal instantly; choline is re-uptaken. Speed is the synapse\'s whole virtue.' },
  { t0: 0.88, t1: 1.00, n: 6, b: '再装填', d: '回收的胆碱重新合成 ACh 装入囊泡,备用囊泡补位——周而复始,每秒可达上百次。',
    be: 'Refill', de: 'Recycled choline is rebuilt into ACh and reloaded; a spare vesicle takes position — hundreds of times per second.' },
];
function stepIndex(t) {
  if (t < 0.12) return 0;
  if (t < 0.28) return 1;
  if (t < 0.52) return 2;
  if (t < 0.70) return 3;
  if (t < 0.88) return 4;
  return 5;
}

/* ================= 状态 ---------------- */
let showLabels = true, botox = qsBool('botox', false), op = qsBool('op', false);
let t01 = 0;

/* ================= 静态场景 ================= */
function drawScene() {
  // 轴突 + 末梢
  rrect(170, 0, 130, 100, 30, 'rgba(127,208,247,.08)');
  rrect(PRE.x, PRE.y, PRE.w, PRE.h, 56, 'rgba(127,208,247,.08)', 'rgba(154,167,184,.5)', 2);
  // 间隙带与后膜
  ctx.fillStyle = 'rgba(255,159,67,.05)'; ctx.fillRect(0, CLEFT_Y, W, POST_Y - CLEFT_Y);
  line(0, CLEFT_Y, W, CLEFT_Y, PAL.grid, 1);
  rrect(120, POST_Y, 980, 26, 12, 'rgba(244,143,177,.14)', 'rgba(244,143,177,.5)', 2);
  ctx.fillStyle = 'rgba(244,143,177,.04)'; ctx.fillRect(0, POST_Y + 26, W, H);
  if (showLabels) {
    text(L('突触前末梢(轴突末梢)', 'Presynaptic terminal'), 150, 108, 13.5, PAL.dim2);
    text(L('突触间隙 ~20 nm', 'Synaptic cleft ~20 nm'), 150, CLEFT_Y + 36, 13.5, PAL.dim2);
    text(L('突触后膜(树突 / 肌纤维)', 'Postsynaptic membrane'), 150, POST_Y + 48, 13.5, PAL.dim2);
  }
}
function drawChannels(t) {
  const openK = ss(0.13, 0.18, t) * (1 - ss(0.28, 0.33, t));
  CA_X.forEach((x, i) => {
    rrect(x - 14, 392, 28, 36, 7, 'rgba(203,174,232,.16)', '#cbaee8', 1.5);
    const flap = 8 + openK * 12;
    line(x - 14 + 4, 396 + flap, x + 14 - 4, 396 + flap, '#cbaee8', 2.5);
    if (openK > 0.5) dot(x, 392, 4, COL_CA, 8);
  });
  if (showLabels) text(L('电压门控 Ca²⁺ 通道', 'Voltage-gated Ca²⁺ channels'), 790, 444 - 0, 12, '#cbaee8', 'center');
}
function drawReceptors(t) {
  const anyBound = !botox && t >= 0.52;                              // 有递质才有门可开
  const openK = !anyBound ? 0 : (op ? 1 : 1 - ss(0.86, 0.94, t));
  RCH.forEach((x, i) => {
    rrect(x - 16, POST_Y - 2, 32, 40, 6, 'rgba(244,143,177,.16)', '#f48fb1', 1.5);
    const flap = 6 + clamp(openK, 0, 1) * 12;
    line(x - 12, POST_Y + 4 + flap, x + 12, POST_Y + 4 + flap, '#f48fb1', 2.5);
    if (i < 2 && anyBound && (op || t < 0.86)) dot(x, POST_Y + 22, 6, COL_ACH);
  });
  if (showLabels) text(L('配体门控受体(阳离子通道)', 'Ligand-gated receptors (cation channels)'), 830, POST_Y + 70, 12, '#f48fb1', 'center');
}
function drawAchE() {
  ACH_EAT.forEach(([x, y]) => {
    if (op) { ctx.globalAlpha = 0.35; }
    circle(x, y, 13, '#4dd0e12b', op ? '#ff8a80' : COL_ACHE, 1.6);
    text('AChE', x, y + 4, 9.5, op ? '#ff8a80' : '#0d1117', 'center', 700);
    ctx.globalAlpha = 1;
  });
  if (showLabels) text(L('AChE 乙酰胆碱酯酶(快速清场)', 'AChE (fast cleanup)'), 560, CLEFT_Y + 16, 12, op ? '#ff8a80' : COL_ACHE, 'center');
}
function drawTransporter() {
  rrect(TRA.x - 14, TRA.y, 28, 34, 7, 'rgba(144,190,109,.16)', COL_SNARE, 1.5);
  if (showLabels) text(L('胆碱转运体', 'choline transporter'), TRA.x, TRA.y + 50, 11.5, COL_SNARE, 'center');
}

/* ================= 动画元素 ================= */
function drawSpark(t) {
  if (t > 0.12) return;
  const k = ss(0.01, 0.10, t);
  const x0 = 235, y0 = 100, cx = 720, cy = 120, x1 = 790, y1 = 372;
  const px2 = lerp(lerp(x0, cx, k), lerp(cx, x1, k), k);
  const py2 = lerp(lerp(y0, cy, k), lerp(cy, y1, k), k);
  dot(px2, py2, 12, COL_SPARK, 20);
  if (showLabels) text(L('动作电位', 'action potential'), px2 + 24, py2 - 8, 12.5, COL_SPARK, 'center', 700);
}
function drawVesicle(t) {
  const dock = botox ? ss(0.28, 0.40, t) : ss(0.28, 0.40, t);
  const released = !botox && t >= 0.46;
  const x = lerp(V0.x, DOCK.x, dock), y = lerp(V0.y, DOCK.y, dock);
  if (!released) {
    circle(x, y, 38, COL_V + '24', COL_V, 2);
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + 0.4;
      dot(x + Math.cos(a) * 18, y + Math.sin(a) * 18, 5.5, COL_ACH);
    }
    if (showLabels && dock < 1) text(L('突触囊泡(装满 ACh)', 'Synaptic vesicle (full of ACh)'), x - 10, y - 52, 12, COL_V, 'center');
  } else {
    ctx.globalAlpha = clamp(1 - ss(0.46, 0.56, t), 0, 1);
    circle(x, y + 6, 34, COL_V + '18', COL_V, 1.4);
    ctx.globalAlpha = 1;
  }
  // 备用囊泡滑向补位(再装填)
  if (t >= 0.88) {
    const k = ss(0.88, 0.96, t);
    const sx = lerp(V1.x, 700, k), sy = lerp(V1.y, 260, k);
    circle(sx, sy, 34, COL_V + '1c', COL_V, 1.5);
    if (showLabels && k > 0.2) text(L('备用囊泡补位', 'spare vesicle moves in'), sx, sy - 46, 11.5, PAL.dim2, 'center');
  }
}
function drawSnare(t) {
  const docked = t >= 0.34;
  if (!docked) return;
  const zipped = botox ? 0.4 : ss(0.36, 0.44, t);
  for (let i = 0; i < 4; i++) {
    const zx = DOCK.x - 30 + i * 20;
    const zz = zipped * 14;
    line(zx, DOCK.y + 30 + 8, zx, DOCK.y + 38 - zz + 8, COL_SNARE, 3);
  }
  if (botox) {
    text('✕ 剪断', DOCK.x + 52, DOCK.y + 34, 13, '#ff5d5d', 'center', 700);
    rrect(DOCK.x - 120, DOCK.y + 56, 260, 40, 10, 'rgba(255,93,93,.12)', 'rgba(255,93,93,.75)', 1.4);
    text(L('肉毒毒素:SNARE 被剪,囊泡无法融合,递质出不去 → 松弛性麻痹',
      'Botulinum snips SNARE: no fusion, no release → flaccid paralysis'),
      DOCK.x + 10, DOCK.y + 82, 12.5, '#ff8a80', 'center', 700);
  } else if (showLabels && t < 0.5) {
    text(L('SNARE 拉链', 'SNARE zipper'), DOCK.x + 66, DOCK.y + 40, 12, COL_SNARE, 'center');
  }
  // 融合孔
  if (!botox && t >= 0.42) {
    const k = ss(0.42, 0.46, t);
    ctx.globalAlpha = k;
    rrect(DOCK.x - 10, DOCK.y + 22, 20, 26, 8, 'rgba(255,209,102,.5)', COL_V, 1.5);
    ctx.globalAlpha = 1;
  }
}
function drawCa(t) {
  CA_T.forEach((f, i) => {
    const k = ss(f, f + 0.05, t);
    if (k <= 0 || k >= 1) return;
    const x = CA_X[i % 3] + (i % 2 ? 7 : -7);
    hdot2(x, lerp(448, 330 + (i % 4) * 8, k), COL_CA);
  });
  const n = CA_T.filter(f => t > f + 0.05).length;
  if (showLabels && n > 0 && t < 0.3) text(L('Ca²⁺ 内流 ×' + n, 'Ca²⁺ in ×' + n), 920, 330, 12.5, COL_CA, 'center', 700);
}
function hdot2(x, y, col, r = 6.5) {
  dot(x, y, r, col);
  text(col === COL_CA ? '2+' : '+', x, y + 4, 8.5, '#0d1117', 'center', 700);
}
function drawAch(t) {
  SPRAY_T.forEach((f, i) => {
    const k = ss(f, f + 0.08, t);
    if (k <= 0 || botox) return;
    const [tx, ty] = ACH_LAND[i];
    const x = lerp(DOCK.x, tx, k), y = lerp(DOCK.y + 30, ty, k) + 8 * Math.sin(k * Math.PI);
    if (k < 1 || i >= 2) dot(x, y, 6.5, COL_ACH, 8);
    // 前 2 颗随后奔向受体
    if (k >= 1 && i < 2) {
      const b = ss(0.50, 0.58, t);
      const rx = RCH[i], bx = lerp(tx, rx, b), by = lerp(ty, POST_Y + 22, b);
      if (b < 1) dot(bx, by, 6.5, COL_ACH, 8);
    }
  });
  // 停留间隙的 3 颗:水解 / 或因有机磷滞留
  ACH_X.forEach(([ax, ay], i) => {
    const sp = op ? 0 : ss(SPLIT_T[i], SPLIT_T[i] + 0.05, t);
    if (sp <= 0 || sp >= 1) {
      dot(ax, ay, 6.5, COL_ACH, op ? 10 : 0);
    } else {
      dot(ax - 12 * sp, ay + 6 * sp, 4.5, COL_H2O);   // 乙酸片段
      dot(ax + 12 * sp, ay + 10 * sp, 4.5, '#9aa7b8');// 胆碱片段
    }
  });
  // 胆碱回收
  SPLIT_T.forEach((f, i) => {
    if (op) return;
    const k = ss(f + 0.10, f + 0.18, t);
    if (k <= 0 || k >= 1) return;
    const [ax, ay] = ACH_X[i];
    const x = lerp(ax + 12, TRA.x + 6, k), y = lerp(ay + 10, TRA.y + 16, k);
    dot(x, y, 4.5, '#9aa7b8');
  });
}
function drawNa(t) {
  const gate = botox ? 0 : 1;
  NA_T.forEach((f, i) => {
    if (t < f || gate === 0) return;
    const k = clamp((t - f) / 0.2, 0, 1);
    const x = RCH[i % 3] + (i % 2 ? 10 : -10);
    const y = lerp(POST_Y + 30, POST_Y + 150 + (i % 4) * 20, k);
    ctx.globalAlpha = 1 - k * 0.55;
    hdot2(x, y, COL_NA);
    ctx.globalAlpha = 1;
  });
  if (op && t > 0.72) {   // 有机磷:持续内流
    for (let i = 0; i < 6; i++) {
      const k = ((t - 0.72) * 2.2 + i / 6) % 1;
      const x = RCH[i % 3] + (i % 2 ? 12 : -12);
      hdot2(x, lerp(POST_Y + 34, POST_Y + 190, k), COL_NA);
    }
    if (showLabels) text(L('受体持续开门:持续去极化 → 抽搐', 'receptors stuck open → persistent depolarization → convulsions'),
      830, POST_Y + 235, 12.5, '#ff8a80', 'center', 700);
  }
  if (showLabels && !botox && t > 0.60 && t < 0.72) text(L('Na⁺ 内流 = EPSP', 'Na⁺ in = EPSP'), 830, POST_Y + 130, 12.5, COL_NA, 'center', 700);
  if (showLabels && botox && t > 0.5) text(L('后膜静默:没有递质,没有 EPSP', 'post cell silent: no transmitter, no EPSP'), 830, POST_Y + 130, 12.5, PAL.dim2, 'center', 700);
}
function drawRefill(t) {
  if (t < 0.9 || op) return;
  SPLIT_T.forEach((f, i) => {
    const k = ss(0.90 + i * 0.02, 0.94 + i * 0.02, t);
    if (k <= 0 || k >= 1 || i >= 3) return;
    dot(lerp(TRA.x, 700, k), lerp(TRA.y, 250, k), 5.5, COL_ACH);
  });
  if (showLabels && t > 0.94) text(L('回收胆碱 → 重新合成 ACh', 'recycled choline → new ACh'), 700, 200, 12, COL_ACH, 'center');
}

/* ================= EPSP 示波小卡 ================= */
function drawEpsp(t) {
  const X = 1230, Y = 58, Wd = 344, Ht = 210;
  rrect(X, Y, Wd, Ht, 14, PAL.pill, PAL.grid, 1);
  text(L('突触后电位 EPSP', 'Postsynaptic potential (EPSP)'), X + 16, Y + 26, 13, PAL.dim);
  const gx0 = X + 46, gx1 = X + 320, gy0 = Y + 46, gy1 = Y + 178;
  line(gx0, gy1, gx1, gy1, PAL.axis, 1);
  line(gx0, gy0, gx0, gy1, PAL.axis, 1);
  line(gx0, gy1 - 20, gx1, gy1 - 20, PAL.grid, 1, [4, 4]);
  text('-70 mV', gx0 - 6, gy1 - 2, 10, PAL.dim2, 'right');
  text('-45 mV', gx0 - 6, gy1 - 18, 10, PAL.dim2, 'right');
  text(L('时间', 'time'), gx1, gy1 + 16, 10.5, PAL.dim2, 'right');
  const mvt = tt => {
    if (botox) return -70;
    const rise = 25 * ss(0.56, 0.70, tt);
    const decay = op ? 0 : 25 * ss(0.74, 0.92, tt);
    return -70 + rise - decay;
  };
  ctx.strokeStyle = COL_NA; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 80; i++) {
    const tt2 = i / 80, v = mvt(tt2);
    const px2 = lerp(gx0, gx1, tt2), py2 = gy1 - (v + 70) / 25 * 20;
    i ? ctx.lineTo(px2, py2) : ctx.moveTo(px2, py2);
  }
  ctx.stroke();
  const v = mvt(t), mx = lerp(gx0, gx1, t), my = gy1 - (v + 70) / 25 * 20;
  if (t > 0.5) { dot(mx, my, 5, COL_NA, 10); text(Math.round(v) + ' mV', mx + 10, my - 8, 11, COL_NA, 'center', 700); }
}

/* ================= 主绘制 ================= */
function draw(t) {
  drawScene();
  drawAchE();
  drawTransporter();
  drawChannels(t);
  drawReceptors(t);
  drawSnare(t);
  drawVesicle(t);
  drawSpark(t);
  drawCa(t);
  drawAch(t);
  drawNa(t);
  drawRefill(t);
  drawEpsp(t);
}

/* ================= UI / 主循环 ================= */
let cycles = (() => { const v = parseFloat(qs.get('t')); return Number.isFinite(v) ? v : 0; })();
let playing = !qsBool('pause', false);
let speed = (() => { const v = parseFloat(qs.get('speed')); return Number.isFinite(v) ? v : 1; })();

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglBotox = document.getElementById('tglBotox');
const tglOp = document.getElementById('tglOp');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglBotox.addEventListener('change', () => { botox = tglBotox.checked; });
tglOp.addEventListener('change', () => { op = tglOp.checked; });
tglBotox.checked = botox; tglOp.checked = op;
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

let lastStep = -1, last = performance.now();
applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (playing) cycles += dt * speed / CYCLE;
  t01 = cycles - Math.floor(cycles);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(t01);

  const si = stepIndex(t01);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t01 * 1000);
  elScrubVal.textContent = Math.round(t01 * 100) + '%';
}
requestAnimationFrame(frame);
</script>
