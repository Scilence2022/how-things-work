<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BZ 振荡反应 · 化学里也有心跳</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#8ce99a;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#2b8a3e;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);

    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}

  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-3.2,4.3,8.3);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.2,1.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 桌面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const table=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,0.18,48),
  new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8}));
table.position.y=-0.09;scene.add(table);

/* ---- 培养皿 ---- */
const DISH_R=2.15,DISH_H=0.5;
const glassM=new THREE.MeshPhysicalMaterial({color:0xdfe8f2,roughness:0.08,transparent:true,opacity:0.24,side:THREE.DoubleSide});
const dishWall=new THREE.Mesh(new THREE.CylinderGeometry(DISH_R,DISH_R,DISH_H,64,1,true),glassM);
dishWall.position.y=DISH_H/2;scene.add(dishWall);
const dishBottom=new THREE.Mesh(new THREE.CircleGeometry(DISH_R,64),glassM.clone());
dishBottom.rotation.x=-Math.PI/2;dishBottom.position.y=0.02;scene.add(dishBottom);
const dishFloor=new THREE.Mesh(new THREE.CircleGeometry(DISH_R-0.02,64),
  new THREE.MeshStandardMaterial({color:0x10151b,roughness:0.6}));
dishFloor.rotation.x=-Math.PI/2;dishFloor.position.y=0.035;scene.add(dishFloor);
const dishRim=new THREE.Mesh(new THREE.TorusGeometry(DISH_R,0.028,10,64),
  new THREE.MeshStandardMaterial({color:0xbfc9d4,roughness:0.3}));
dishRim.rotation.x=Math.PI/2;dishRim.position.y=DISH_H;scene.add(dishRim);

/* ---- 反应场:40×40 格子,双变量振荡器 + 扩散 ---- */
const GN=40,NC=GN*GN;
const cells=new THREE.InstancedMesh(new THREE.BoxGeometry(0.096,1,0.096),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4}),NC);
cells.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(cells);
const u=new Float32Array(NC),v=new Float32Array(NC),u2=new Float32Array(NC),v2=new Float32Array(NC);
const cellX=new Float32Array(NC),cellZ=new Float32Array(NC),cellVis=new Uint8Array(NC),cellR2=new Float32Array(NC);
{
  const sp=0.105;let i=0;
  for(let gz=0;gz<GN;gz++)for(let gx=0;gx<GN;gx++){
    const x=(gx-(GN-1)/2)*sp,z=(gz-(GN-1)/2)*sp;
    cellX[i]=x;cellZ[i]=z;cellR2[i]=x*x+z*z;cellVis[i]=cellR2[i]<4.0?1:0;i++;
  }
  const c0=new THREE.Color(0xe8590c);
  for(let i=0;i<NC;i++)cells.setColorAt(i,c0);
  cells.instanceColor.setUsage(THREE.DynamicDrawUsage);
  u.fill(-1.9);v.fill(0.5);
}
/* ---- Ce⁴⁺ 历史带(3D 条形) ---- */
const NH=44;
const hist=new Float32Array(NH).fill(0.15),barX=new Float32Array(NH);
const histBand=new THREE.InstancedMesh(new THREE.BoxGeometry(0.085,1,0.085),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.35}),NH);
histBand.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(histBand);
for(let j=0;j<NH;j++)barX[j]=-2.55+j*(5.1/(NH-1));

/* ---- 磁力搅拌器 + 溴酸盐瓶 ---- */
const stirBox=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.4,0.7),
  new THREE.MeshStandardMaterial({color:0x2b3038,roughness:0.5,metalness:0.35}));
stirBox.position.set(3.05,0.2,0.9);scene.add(stirBox);
const ledM=new THREE.MeshStandardMaterial({color:0x51cf66,emissive:0x2b8a3e,emissiveIntensity:1.2});
const led=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,10),ledM);
led.position.set(3.28,0.43,0.72);scene.add(led);
const bar=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.04,0.08),
  new THREE.MeshStandardMaterial({color:0xe9ecef,roughness:0.3}));
bar.position.set(0,0.17,0);scene.add(bar);
const flaskM=new THREE.MeshPhysicalMaterial({color:0xdfe8f2,roughness:0.06,transparent:true,opacity:0.3,side:THREE.DoubleSide});
const flask=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.42,0.62,24),flaskM);
flask.position.set(-3.15,0.31,-0.55);scene.add(flask);
const flaskLiq=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.32,0.24,24),
  new THREE.MeshStandardMaterial({color:0x3b5bdb,roughness:0.3}));
flaskLiq.position.set(-3.15,0.16,-0.55);scene.add(flaskLiq);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.28,16),flaskM);
neck.position.set(-3.15,0.74,-0.55);scene.add(neck);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let slowMo=false;
let temp=25,br=0.6,stir=true,waveMode='uniform';
let gu=-1.9,gv=0.5,meanU=-1.9,meanV=0.5,prevGu=-1.9,prevMeanU=-1.9;
let simClock=0,lastCross=-1,periodSim=0,stepAcc=0,histAcc=0,barSpin=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* FitzHugh–Nagumo 型双变量振荡器:u=Ce⁴⁺(氧化),v=Br⁻(闸门) */
const RD_DT=0.22,Du=0.35,Dv=0.12;
function rdStep(dt,tau){
  for(let gz=0;gz<GN;gz++)for(let gx=0;gx<GN;gx++){
    const i=gz*GN+gx;
    const l=gx>0?i-1:i,r=gx<GN-1?i+1:i,d=gz>0?i-GN:i,up=gz<GN-1?i+GN:i;
    const lu=u[l]+u[r]+u[d]+u[up]-4*u[i],lv=v[l]+v[r]+v[d]+v[up]-4*v[i];
    u2[i]=u[i]+dt*(u[i]-u[i]*u[i]*u[i]/3-v[i]+Du*lu);
    v2[i]=v[i]+dt*((u[i]+0.2-0.8*v[i])/tau+Dv*lv);
  }
  u.set(u2);v.set(v2);
}
function oscStep(dt,tau){
  const nu=gu+dt*(gu-gu*gu*gu/3-gv);
  gv=gv+dt*((gu+0.2-0.8*gv)/tau);gu=nu;
}
function reseed(kind){
  waveMode=kind;
  for(let i=0;i<NC;i++){
    if(!cellVis[i]){u[i]=-1.25;v[i]=-0.5;continue;}
    if(kind==='spiral'){
      v[i]=-0.75+(cellX[i]+2.05)/4.1*0.9+(Math.random()-0.5)*0.08;
      u[i]=(cellX[i]<0.05&&cellR2[i]<3.6)?1.6:-1.25;
    }else{
      const r=Math.sqrt(cellR2[i]);
      u[i]=r<0.42?1.6:-1.25;v[i]=-0.3-r*0.18;
    }
  }
}
function setTemp(t){temp=t;document.getElementById('sTemp').value=t;
  document.getElementById('sTempVal').textContent=t+' ℃';}
function setBr(b){br=b;document.getElementById('sBrO3').value=b;
  document.getElementById('sBrO3Val').textContent=b.toFixed(2)+' M';}
function setStir(s){
  if(s===stir)return;
  if(s){gu=clamp((meanU+1.6)/3.2,-1,1)*3.2-1.6;gv=meanV;waveMode='uniform';}
  else reseed('spiral');
  stir=s;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const brPct=()=>clamp((meanV+0.667)/1.334,0,1);
addLabel(()=>L(`Br⁻ 闸门:${brPct()>0.5?'关(反应闸住)':'开(自催化点火)'}`,
  `Br⁻ gate: ${brPct()>0.5?'closed (blocked)':'open (firing)'}`),new THREE.Vector3(2.55,1.15,0.9),'r');
addLabel(()=>L(`Ce³⁺ ⇌ Ce⁴⁺ 信使:Ce⁴⁺ ${(clamp((meanU+1.6)/3.2,0,1)*100).toFixed(0)}%`,
  `Ce³⁺ ⇌ Ce⁴⁺ shuttle: Ce⁴⁺ ${(clamp((meanU+1.6)/3.2,0,1)*100).toFixed(0)}%`),new THREE.Vector3(0,2.5,0),'b');
addLabel(()=>{const gdu=gu-gu*gu*gu/3-gv,gain=1+clamp(gdu,0,3)*2;
  return L(`自催化支路:HBrO₂/Ce⁴⁺ 增益 ×${gain.toFixed(1)}`,
  `Autocatalytic branch: HBrO₂/Ce⁴⁺ gain ×${gain.toFixed(1)}`);},new THREE.Vector3(-2.85,1.8,-0.55),'g');

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'还原态:Br⁻ 高,反应被闸住',en:'Reduced state: Br⁻ high, the reaction is gated shut',
  act(){setStir(true);setTemp(25);setBr(0.6);gu=-1.9;gv=0.5;
    document.getElementById('bStir').classList.add('on');document.getElementById('bSpiral').classList.remove('on');
    document.getElementById('bCool').classList.remove('on');}},
 {zh:'自催化爆发:BrO₃⁻ 把 Ce³⁺ 氧化的支路被自己点火',en:'Autocatalytic burst: the BrO₃⁻ → Ce⁴⁺ branch ignites itself',
  act(){setStir(true);setBr(0.9);gu=-0.9;gv=-0.5;}},
 {zh:'氧化波扫过:颜色整片翻蓝',en:'Oxidation wave sweeps across: the whole dish flips blue',
  act(){setStir(false);setBr(0.6);
    document.getElementById('bSpiral').classList.add('on');document.getElementById('bStir').classList.remove('on');}},
 {zh:'Br⁻ 回升复位:催化 restart',en:'Br⁻ rebuilds and resets: the catalyst restarts',
  act(){setStir(false);reseed('rings');}},
 {zh:'循环成极限环:周期锁定',en:'The loop closes into a limit cycle: the period locks in',
  act(){setStir(true);setTemp(25);setBr(0.6);gu=-1.9;gv=0.5;
    document.getElementById('bStir').classList.add('on');document.getElementById('bSpiral').classList.remove('on');}},
 {zh:'搅拌 vs 不搅拌:均匀振荡与螺旋波的两个世界',en:'Stirred vs unstirred: the two worlds of uniform oscillation and spiral waves',
  act(){setStir(false);setTemp(30);reseed('spiral');
    document.getElementById('bSpiral').classList.add('on');document.getElementById('bStir').classList.remove('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stT').innerHTML=periodSim>0?(periodSim*4.5).toFixed(1)+'<small> s</small>':'—';
  document.getElementById('stCe').innerHTML=(clamp((meanU+1.6)/3.2,0,1)*100).toFixed(0)+'<small> %</small>';
  const closed=brPct()>0.5;
  const g=document.getElementById('stGate');
  g.textContent=closed?L('关 · 闸住','closed · blocked'):L('开 · 点火','open · firing');
  g.className='v '+(closed?'warn':'ok');
  const m=document.getElementById('stMode');
  m.textContent=stir?L('均匀振荡','uniform'):L(waveMode==='rings'?'靶环波':'螺旋波',waveMode==='rings'?'target rings':'spiral');
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bStir').addEventListener('click',()=>{
  setStir(true);
  document.getElementById('bStir').classList.add('on');
  document.getElementById('bSpiral').classList.remove('on');
});
document.getElementById('bSpiral').addEventListener('click',()=>{
  setStir(false);
  document.getElementById('bSpiral').classList.add('on');
  document.getElementById('bStir').classList.remove('on');
});
document.getElementById('bCool').addEventListener('click',()=>{
  setTemp(20);
  document.getElementById('bCool').classList.add('on');
});
document.getElementById('sTemp').addEventListener('input',e=>{setTemp(+e.target.value);document.getElementById('bCool').classList.remove('on');});
document.getElementById('sBrO3').addEventListener('input',e=>setBr(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglHist').addEventListener('change',e=>{histBand.visible=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
const tmpC=new THREE.Color();
const cRed=new THREE.Color(0xe8590c),cBlue=new THREE.Color(0x3b5bdb);
function writeHist(){
  for(let j=0;j<NH;j++){
    const val=hist[j],h=0.05+val*1.25;
    m4.makeScale(1,h,1);m4.setPosition(barX[j],2.75+h/2,-2.75);
    histBand.setMatrixAt(j,m4);
    tmpC.lerpColors(cRed,cBlue,val);histBand.setColorAt(j,tmpC);
  }
  histBand.instanceMatrix.needsUpdate=true;
  if(histBand.instanceColor)histBand.instanceColor.needsUpdate=true;
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const q=Math.pow(2,(temp-25)/12),tau=3*(1.35-0.7*br);
  stepAcc+=dts*3.2*q;
  let n=0;
  while(stepAcc>=RD_DT&&n<6){rdStep(RD_DT,tau);oscStep(RD_DT,tau);stepAcc-=RD_DT;n++;}
  /* 搅拌:所有格子被拽向同一个极限环 → 整皿同色呼吸 */
  if(stir&&dts>0){const k=Math.min(1,dts*5);
    for(let i=0;i<NC;i++){u[i]+=(gu-u[i])*k;v[i]+=(gv-v[i])*k;}}
  /* 靶环起搏器:整体每点火一次,中心先燃 → 持续外传的同心环 */
  if(!stir&&waveMode==='rings'&&prevGu<0&&gu>=0){
    for(let i=0;i<NC;i++)if(cellVis[i]&&cellR2[i]<0.12){u[i]=1.7;v[i]=-0.75;}
  }
  prevGu=gu;
  let su=0,sv=0;for(let i=0;i<NC;i++){su+=u[i];sv+=v[i];}
  meanU=su/NC;meanV=sv/NC;
  simClock+=dts;
  if(prevMeanU<0&&meanU>=0){
    if(lastCross>=0&&simClock-lastCross>0.4)periodSim=simClock-lastCross;
    lastCross=simClock;
  }
  prevMeanU=meanU;
  /* 写格子:红=还原态(Ce³⁺/Br⁻ 高),蓝=氧化态(Ce⁴⁺ 高) */
  const ceVal=clamp((meanU+1.6)/3.2,0,1);
  for(let i=0;i<NC;i++){
    if(!cellVis[i]){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);cells.setMatrixAt(i,m4);continue;}
    const t=clamp((u[i]+1.6)/3.2,0,1),sc=0.035+0.075*t;
    m4.makeScale(1,sc,1);m4.setPosition(cellX[i],0.05+sc/2,cellZ[i]);
    cells.setMatrixAt(i,m4);
    tmpC.lerpColors(cRed,cBlue,t);cells.setColorAt(i,tmpC);
  }
  cells.instanceMatrix.needsUpdate=true;
  if(cells.instanceColor)cells.instanceColor.needsUpdate=true;
  /* 搅拌子与指示灯 */
  barSpin+=dts*(stir?11:1.2);bar.rotation.y=barSpin;
  ledM.color.setHex(stir?0x51cf66:0xff6b6b);ledM.emissive.setHex(stir?0x2b8a3e:0x8f1d1d);
  /* Ce⁴⁺ 历史带:每 0.12 s 采一次均值 */
  histAcc+=dts;
  if(histAcc>0.12){histAcc=0;hist.copyWithin(0,1);hist[NH-1]=ceVal;writeHist();}
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setTemp(25);setBr(0.6);writeHist();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
