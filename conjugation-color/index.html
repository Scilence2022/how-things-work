<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共轭与颜色 · 链越长越红</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(176,118,31,.9); color: #9c6f00; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #spectrum { position: fixed; left: 50%; transform: translateX(-50%); top: 16px; z-index: 4;
    width: min(560px, calc(100vw - 420px)); height: 44px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--panel-border); }
  #spectrum .band { position: absolute; top: 0; bottom: 0; }
  #spectrum .absorb { position: absolute; top: 0; bottom: 0; background: rgba(0,0,0,.72);
    border-left: 2px dashed #fff; border-right: 2px dashed #fff; transition: left .3s, width .3s; }
  #spectrum .tick { position: absolute; top: 100%; font-size: 10.5px; color: var(--text2);
    transform: translateX(-50%); margin-top: 3px; }
  #specLabel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,.9); text-shadow: 0 1px 3px rgba(0,0,0,.8); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }
  #swatch { width: 100%; height: 22px; border-radius: 7px; margin-top: 5px;
    border: 1px solid var(--panel-border); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.g { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.c { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.b { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } #spectrum { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="共轭与颜色:链越长,越红" data-en="Conjugation &amp; Color: longer chain, redder">共轭与颜色:链越长,越红</h1>
  <div class="sub" data-zh="交替单双键把 π 电子串成一条走廊,走廊越长 HOMO-LUMO 阶梯越矮——吸收往长波红移,看到的补色从无色一路走到红 · 空格播放/暂停" data-en="Alternating bonds string π electrons into a corridor: the longer it is, the smaller the HOMO-LUMO gap — absorption shifts red, the complement deepens from colorless to red · Space = play/pause">交替单双键把 π 电子串成一条走廊,走廊越长 HOMO-LUMO 阶梯越矮——吸收往长波红移,看到的补色从无色一路走到红 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="spectrum">
  <div id="specLabel"></div>
</div>

<div id="stats">
  <span class="k" data-zh="共轭双键数" data-en="conjugated C=C">共轭双键数</span><span class="v g" id="stN">3</span>
  <span class="k" data-zh="吸收峰 λ" data-en="absorption λ">吸收峰 λ</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="HOMO-LUMO 间隙" data-en="HOMO-LUMO gap">HOMO-LUMO 间隙</span><span class="v" id="stGap">—</span>
  <div id="swatch"></div>

<div id="panel">
  <div id="legend">
    <span class="chip.c" data-zh="碳链" data-en="carbon chain">碳链</span>
    <span class="chip.g" data-zh="π 电子波(粒子在盒中)" data-en="π wave (particle-in-box)">π 电子波(粒子在盒中)</span>
    <span class="chip.b" data-zh="LUMO(虚线)" data-en="LUMO (dashed)">LUMO(虚线)</span>
  </div>
  <div class="row"><label data-zh="共轭双键数 n" data-en="conjugated C=C n">共轭双键数 n</label><input id="nC" type="range" min="1" max="11" step="1" value="3"><span class="val" id="nCVal">3</span></div>
  <div class="row"><label data-zh="链动画" data-en="chain animation">链动画</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../aromaticity/" data-zh="环形版:苯的甜甜圈" data-en="ring version: benzene donut">环形版:苯的甜甜圈</a>
    <a href="../atomic-structure/" data-zh="能级差决定光子" data-en="energy gaps make photons">能级差决定光子</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('共轭与颜色', 'Conjugation & Color');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  buildSpectrum();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0, 1.6, 6.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 物理模型:自由电子盒(PPlatt / Kuhn) ----------------
   N 个双键 → 2N 个 π 电子填 N 个成键轨道;跃迁 HOMO(N)→LUMO(N+1)。
   盒长 L ≈ (2N+2)·1.40 Å(每对双键加一节),能级 E_k ∝ k²/L²。
   λ = 8·m·c·L²·N / ((2N+1)·h) ... 直接用 Kuhn 公式:
   λ(nm) ≈ 63.7 · L²/(N+1),L 单位 Å,L=(2N+2)*1.40? 简化取实验拟合:
   λ(N) = 1.40*(2N+2)^2 /(N+1) ... 用简化:λ(nm)= (2N+2)^2 *1.9/(N+1)* ... */
function lambdaOf(N) {
  /* 多烯经验值:乙烯 171nm,每个共轭双键 +~30nm;N=11 ≈ 474nm(番茄红素) */
  return clamp(171 + 30.3 * (N - 1), 171, 760);
}
function gapOf(N) { return 1239.84 / lambdaOf(N); }        // eV

/* 波长→RGB(近似) */
function wl2rgb(wl) {
  let r = 0, g = 0, b = 0;
  if (wl < 380) return [0.55, 0, 0.55];
  if (wl < 440) { r = -(wl - 440) / 60; b = 1; }
  else if (wl < 490) { g = (wl - 440) / 50; b = 1; }
  else if (wl < 510) { g = 1; b = -(wl - 510) / 20; }
  else if (wl < 580) { r = (wl - 510) / 70; g = 1; }
  else if (wl < 645) { r = 1; g = -(wl - 645) / 65; }
  else if (wl <= 760) { r = 1; }
  else return [0.55, 0, 0.55];
  return [r, g, b];
}
/* 补色:把吸收色从白光里减掉 */
function complement(wl) {
  const [r, g, b] = wl2rgb(wl);
  return [1 - r, 1 - g, 1 - b];
}

/* ---------------- 场景搭建 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}
const M = {
  C: mat(0x63e6be, { metalness: 0.35, roughness: 0.35 }),
  bond1: mat(0x8a93a3, { metalness: 0.4 }),
  bond2: mat(0xffd166, { metalness: 0.4 }),
  cloud: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.0,
    blending: THREE.AdditiveBlending, depthWrite: false }),
};

const mol = new THREE.Group();
mol.position.y = 0.6;
scene.add(mol);
const STEP = 0.55;                 // C-C spacing
const MAXN = 11;
const atoms = [];                  // sphere meshes (pool)
const bonds = [];                  // {m1, m2} cylinders (pool, 2*MAXN)
const cloudSegs = [];              // π cloud tube segments (pool 2*MAXN)
const wire = new THREE.MeshBasicMaterial({ color: 0x74c0fc, wireframe: true, transparent: true, opacity: 0.75 });
const lumoTubeMat = new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending, depthWrite: false });

for (let i = 0; i < 2 * MAXN + 2; i++) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.17, 20, 16), M.C);
  s.visible = false;
  mol.add(s);
  atoms.push(s);
}
for (let i = 0; i < 2 * MAXN + 1; i++) {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1, 10), M.bond1);
  b.visible = false;
  mol.add(b);
  bonds.push(b);
}
for (let i = 0; i < 2 * MAXN + 2; i++) {
  const t = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.045, 8, 18), i % 2 ? lumoTubeMat : M.cloud.clone());
  t.rotation.x = Math.PI / 2;     // 竖直面内?改为水平放:绕竖直轴的环
  t.visible = false;
  mol.add(t);
  cloudSegs.push(t);
}
/* 波函数曲线:HOMO 用 line,LUMO 用虚线(小段) */
const hGeo = new THREE.BufferGeometry();
hGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(128 * 3), 3));
const homoLine = new THREE.Line(hGeo, new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.95 }));
mol.add(homoLine);
const lGeo = new THREE.BufferGeometry();
lGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(128 * 3), 3));
const lumoLine = new THREE.Line(lGeo, new THREE.LineBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.55 }));
mol.add(lumoLine);

/* 光子小球(吸收瞬间从 HOMO 跳 LUMO) */
const photon = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10),
  new THREE.MeshBasicMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending, transparent: true }));
mol.add(photon);
let photonT = 1;

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let N = Math.round(qsFloat('n', 3));
let tSim = 0;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = mol) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblName = addLabel(() => {
  const names = { 1: L('乙烯:无色(紫外区吸收)', 'ethene: colorless (UV absorption)'),
    2: L('丁二烯:无色', 'butadiene: colorless'),
    3: L('己三烯:无色(吸收刚进紫外边缘)', 'hexatriene: colorless (edge of UV)'),
    5: L('类胡萝卜素前体:淡黄', 'carotenoid precursor: pale yellow'),
    11: L('番茄红素/β-胡萝卜素:橙红', 'lycopene / β-carotene: orange-red') };
  return names[N] || (N >= 8 ? L('长链共轭:深橙红', 'long conjugation: deep orange-red')
    : N >= 6 ? L('多烯:黄色', 'polyene: yellow') : L('短共轭:无色/淡', 'short: colorless/pale'));
}, new THREE.Vector3(0, 1.5, 0), 'g');
const lblPhysics = addLabel(() => {
  const lam = lambdaOf(N).toFixed(0);
  return L(`n=${N}:吸收 ${lam} nm(间隙 ${gapOf(N).toFixed(2)} eV)→ 呈现其补色`,
    `n=${N}: absorbs ${lam} nm (${gapOf(N).toFixed(2)} eV gap) → shows the complement`);
}, new THREE.Vector3(0, -0.75, 0), 'st');

/* ================= 光谱条 ================= */
const spectrumEl = document.getElementById('spectrum');
function buildSpectrum() {
  spectrumEl.querySelectorAll('.band,.tick,.absorb').forEach(e => e.remove());
  for (let wl = 380; wl < 750; wl += 10) {
    const b = document.createElement('div');
    b.className = 'band';
    const [r, g, bl] = wl2rgb(wl);
    b.style.left = ((wl - 380) / 370 * 100) + '%';
    b.style.width = (10 / 370 * 100 + 0.6) + '%';
    b.style.background = `rgb(${r * 255 | 0},${g * 255 | 0},${bl * 255 | 0})`;
    spectrumEl.appendChild(b);
  }
  for (const wl of [450, 500, 550, 600, 650, 700]) {
    const t = document.createElement('div');
    t.className = 'tick';
    t.style.left = ((wl - 380) / 370 * 100) + '%';
    t.textContent = wl;
    spectrumEl.appendChild(t);
  }
  const ab = document.createElement('div');
  ab.className = 'absorb';
  ab.id = 'absorbBand';
  spectrumEl.appendChild(ab);
}
function updateSpectrum() {
  const lam = lambdaOf(N);
  const ab = document.getElementById('absorbBand');
  if (lam < 380) { ab.style.display = 'none'; }
  else {
    ab.style.display = '';
    const c0 = clamp(lam - 30, 380, 750), c1 = clamp(lam + 30, 380, 750);
    ab.style.left = ((c0 - 380) / 370 * 100) + '%';
    ab.style.width = (Math.max(0, (c1 - c0) / 370 * 100)) + '%';
  }
  document.getElementById('specLabel').textContent = L(
    `吸收带 ${lam < 380 ? '<380(紫外,看不见)' : lam.toFixed(0) + ' nm'}`,
    `absorbs ${lam < 380 ? '<380 nm (UV, invisible)' : lam.toFixed(0) + ' nm'}`);
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '交替单双键 = 共轭', be: 'Alternating bonds = conjugation',
    d: 'p 轨道肩并肩一路排下去,π 电子不再属于某个双键,而是属于整条链——像走廊而不是一间间小屋。',
    de: 'p orbitals overlap down the whole chain: π electrons belong to the entire chain, a corridor instead of separate rooms.',
    act: () => setN(1) },
  { b: '电子在盒中驻波', be: 'Electron standing waves in a box',
    d: '链就是一维势阱:π 电子只能取特定驻波(HOMO 是第 N 个波腹)。黄色波=HOMO,蓝色虚波=LUMO。',
    de: 'The chain is a 1-D box: only certain standing waves fit. Yellow = HOMO (Nth), blue dashed = LUMO (N+1th).',
    act: () => setN(3) },
  { b: '链越长,间隙越小', be: 'Longer chain, smaller gap',
    d: '盒变长,能级挤得更密,HOMO-LUMO 间隙变小——需要的光子能量更低,吸收向长波红移。',
    de: 'A longer box packs levels closer: the gap shrinks, so lower-energy (redder) photons get absorbed.',
    act: () => setN(6) },
  { b: '吸收什么,看到补色', be: 'Absorb one color, see its complement',
    d: '番茄红素 n=11 吸收绿蓝光,剩下的红光进入眼睛——所以番茄是红的;β-胡萝卜素少一点共轭,呈橙黄。',
    de: 'Lycopene (n=11) absorbs green-blue, so tomatoes look red; β-carotene with slightly less conjugation looks orange.',
    act: () => setN(11) },
  { b: '经验规律:每加一个双键红移 ~30nm', be: 'Rule of thumb: +30 nm per C=C',
    d: ' Woodward-Fieser 规则:同系物每增加一个共轭双键,λmax 增加约 30 nm——从无色到红只需约十一个双键。',
    de: 'Woodward-Fieser: each extra conjugated C=C red-shifts λmax ~30 nm — about eleven bonds from colorless to red.',
    act: () => setN(9) },
];
function stepIndex() { return N >= 11 ? 3 : N >= 6 ? 2 : N >= 3 ? 1 : 0; }
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 重建分子 ================= */
function setN(n) {
  N = clamp(Math.round(n), 1, MAXN);
  document.getElementById('nC').value = N;
  document.getElementById('nCVal').textContent = N;
  rebuild();
}
function rebuild() {
  const natoms = 2 * N;
  const width = (natoms - 1) * STEP;
  const lam = lambdaOf(N);
  const [cr, cg, cb] = complement(lam);
  /* 摆原子 */
  atoms.forEach((a, i) => {
    if (i < natoms) {
      a.visible = true;
      a.position.set(i * STEP - width / 2, Math.sin(i * 2.1) * 0.07, 0);
      const [r, g, b] = complement(lam);
      a.material = M.C;
    } else a.visible = false;
  });
  /* 键:交替单/双 */
  bonds.forEach((b, i) => {
    if (i < natoms - 1) {
      b.visible = true;
      const p1 = atoms[i].position, p2 = atoms[i + 1].position;
      const d = new THREE.Vector3().subVectors(p2, p1);
      b.position.copy(p1).addScaledVector(d, 0.5);
      b.scale.set(1, d.length(), 1);
      b.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
      b.material = i % 2 === 0 ? M.bond2 : M.bond1;
      if (i % 2 === 0) b.position.y += 0.0;
    } else b.visible = false;
  });
  /* π 云环:每个双键一个环 */
  cloudSegs.forEach((t, i) => {
    if (i < natoms && i % 2 === 0) {
      t.visible = true;
      t.position.copy(atoms[i].position).add(atoms[i + 1].position).multiplyScalar(0.5);
      const [r, g, b] = wl2rgb(clamp(lam, 380, 750));
      t.material.color.setRGB(r, g, b);
      t.material.opacity = lam < 380 ? 0.0 : 0.35;
    } else t.visible = false;
  });
  lumoTubeMat.opacity = lam < 380 ? 0.0 : 0.22;
  updateSpectrum();
  /* 波函数曲线 */
  updateWaves();
  /* 统计与补色 */
  document.getElementById('stN').textContent = N;
  document.getElementById('stL').innerHTML = lam < 380
    ? `< ${lam.toFixed(0)} <small>nm(紫外)</small>`
    : `${lam.toFixed(0)} <small>nm</small>`;
  document.getElementById('stGap').textContent = gapOf(N).toFixed(2) + ' eV';
  const sw = document.getElementById('swatch');
  sw.style.background = `rgb(${cr * 255 | 0},${cg * 255 | 0},${cb * 255 | 0})`;
}
function updateWaves() {
  const natoms = 2 * N;
  const half = (natoms - 1) * STEP / 2;
  const hp = hGeo.attributes.position.array;
  const lp = lGeo.attributes.position.array;
  for (let i = 0; i < 128; i++) {
    const x = -half + (i / 127) * (2 * half);
    const u = (x / half + 1) / 2;                      // 0..1
    const yh = Math.sin((N + 0) * Math.PI * u) * 0.4;  // HOMO = 第 N+1? HOMO 序号 N(1-based)
    const yl = Math.sin((N + 1) * Math.PI * u) * 0.4;
    hp[i * 3] = x; hp[i * 3 + 1] = 0.55 + yh; hp[i * 3 + 2] = 0;
    lp[i * 3] = x; lp[i * 3 + 1] = -0.55 + yl; lp[i * 3 + 2] = 0;
  }
  hGeo.attributes.position.needsUpdate = true;
  lGeo.attributes.position.needsUpdate = true;
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const nC = document.getElementById('nC');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
nC.addEventListener('input', () => setN(parseInt(nC.value)));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) tSim += dt * speed;

  /* 云环呼吸 */
  for (const t of cloudSegs) {
    if (t.visible) {
      const s = 1 + 0.12 * Math.sin(tSim * 3 - t.position.x * 4);
      t.scale.setScalar(s);
      t.rotation.z = tSim * 0.6;
    }
  }
  /* 光子:周期性从 HOMO 打上 LUMO(表现吸收) */
  const period = 2.2;
  const ph = (tSim % period) / period;
  if (ph < 0.25 && lambdaOf(N) > 200) {
    const k = ph / 0.25;
    photon.visible = true;
    const lam = lambdaOf(N);
    const [r, g, b] = lam < 380 ? [0.7, 0, 1] : wl2rgb(clamp(lam, 380, 760));
    photon.material.color.setRGB(r, g, b);
    const x0 = Math.sin(tSim * 0.7) * 1.2;
    photon.position.set(x0, lerp(-0.55, 0.55, k), 0.4);
    photon.material.opacity = Math.sin(k * Math.PI);
  } else photon.visible = false;
  /* HOMO/LUMO 曲线微微波动 */
  homoLine.material.opacity = 0.75 + 0.2 * Math.sin(tSim * 2.2);
  lumoLine.material.opacity = 0.4 + 0.15 * Math.sin(tSim * 2.2 + 1.5);

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

buildSpectrum();
rebuild();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
