<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================= 物理内核 =================
   泡利不相容：费米子的四量子数 (n,l,m_l,m_s) 不允许全同 → 每个轨道最多 2 个
   自旋相反的电子，壳层容量 2n²（K=2, L=8, M=18, N=32）。
   构造原理(Aufbau)：按能级 1s<2s<2p<3s<3p<4s<3d<4p 逐个填充（4s 先于 3d）。
   电离能/半径取实验与 Clementi 计算值，锯齿=壳层结构的周期性。
   电子简并压（白矮星的支撑）与化学周期性同源：都是不相容原理的直接后果。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const NAMES_ZH=['氢','氦','锂','铍','硼','碳','氮','氧','氟','氖','钠','镁','铝','硅','磷','硫','氯','氩','钾','钙','钪','钛','钒','铬','锰','铁','钴','镍','铜','锌','镓','锗','砷','硒','溴','氪'];
const NAMES_EN=['Hydrogen','Helium','Lithium','Beryllium','Boron','Carbon','Nitrogen','Oxygen','Fluorine','Neon','Sodium','Magnesium','Aluminium','Silicon','Phosphorus','Sulfur','Chlorine','Argon','Potassium','Calcium','Scandium','Titanium','Vanadium','Chromium','Manganese','Iron','Cobalt','Nickel','Copper','Zinc','Gallium','Germanium','Arsenic','Selenium','Bromine','Krypton'];
const SYMB=['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Ge','As','Se','Br','Kr'];
const IE=[1312,2372,520,900,801,1087,1402,1314,1681,2081,496,738,578,787,1012,1007,1256,1521,419,590,633,659,651,653,717,762,758,737,906,1012,579,762,947,941,1140,1351]; // kJ/mol
const RAD=[53,31,167,112,87,67,56,48,42,38,190,145,118,111,98,88,79,71,243,194,184,176,171,166,161,156,152,149,145,142,136,125,114,103,94,88]; // pm (Clementi)
const FLAME={3:'#d6336c',11:'#ffd43b',19:'#b197fc',20:'#ff922b',29:'#51cf66'}; // 实测焰色
/* 亚壳层填充顺序：[名, 壳层索引(n-1), 容量] */
const ORDER=[['1s',0,2],['2s',1,2],['2p',1,6],['3s',2,2],['3p',2,6],['4s',3,2],['3d',2,10],['4p',3,6]];
const RING=[1.5,2.4,3.3,4.2];
function fillShells(z){ // 返回各壳层电子数（聚合 3d→M 等，真实排布）
  let left=z;const sub=ORDER.map(o=>[o[0],o[1],o[2],0]);
  for(const s of sub){const t=Math.min(left,s[2]);s[3]=t;left-=t;if(!left)break;}
  const shells=[0,0,0,0];
  sub.forEach(s=>shells[s[1]]+=s[3]);
  return {shells,sub};
}
function category(z){
  if([2,10,18,36].includes(z))return ['稀有气体','noble gas'];
  if([3,11,19].includes(z))return ['碱金属','alkali metal'];
  if([4,12,20].includes(z))return ['碱土金属','alkaline earth'];
  if(z>=21&&z<=30)return ['过渡金属','transition metal'];
  if([9,17,35].includes(z))return ['卤素','halogen'];
  if([5,14,32,33].includes(z))return ['类金属','metalloid'];
  if([13,31].includes(z))return ['后过渡金属','post-transition'];
  return ['非金属','nonmetal'];
}
let Z=1, speedK=1.0, autoInc=true, playing=true, labelsOn=true, zT=0;

const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,60);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0,1.2,14.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.6,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=40;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,0.9); key.position.set(4,8,9); scene.add(key);

const atomG=new THREE.Group(); atomG.position.y=0.6; scene.add(atomG);
const eGroup=new THREE.Group(); atomG.add(eGroup); // 电子+壳层圈整体缓慢公转
const nucM=new THREE.MeshStandardMaterial({color:0xff8787,roughness:0.35,emissive:0x882222,emissiveIntensity:0.4});
const nuc=new THREE.Mesh(new THREE.SphereGeometry(0.34,24,18),nucM); atomG.add(nuc);
/* 壳层圈 */
const ringM=new THREE.LineBasicMaterial({color:0x5b6b7d,transparent:true,opacity:0.55});
RING.forEach(r=>{
  const pts=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;pts.push(new THREE.Vector3(r*Math.cos(a),r*Math.sin(a),0));}
  const c=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),ringM);
  c.rotation.x=-0.42; eGroup.add(c);
});
/* 电子（最多 36 个，逐个生成） */
const eM_inner=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.3,emissive:0x1864ab,emissiveIntensity:0.35});
const eM_val=new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.3,emissive:0xa05000,emissiveIntensity:0.45});
const eGeo=new THREE.SphereGeometry(0.115,14,10);
const electrons=[]; // {m, slot:{s,i,c}}
function targetPos(sl){
  const a=(sl.i/sl.c)*Math.PI*2+sl.s*0.7;
  return new THREE.Vector3(RING[sl.s]*Math.cos(a),RING[sl.s]*Math.sin(a),0.15*Math.sin(sl.s*2.1+a));
}
/* 焰色光晕 */
const haloM=new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.14,side:THREE.BackSide});
const halo=new THREE.Mesh(new THREE.SphereGeometry(4.9,32,24),haloM); halo.visible=false; eGroup.add(halo);

/* ---- CSS2D 标签 ---- */
const labelReg=[];
function addLabel(fn,pos,cls,vis=()=>true,parent){
  const div=document.createElement('div');div.className='lbl '+(cls||'');
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||atomG).add(o);
  labelReg.push({o,fn,vis});div.textContent=fn();return o;
}
const elLbl=addLabel(()=>L(SYMB[Z-1]+' '+NAMES_ZH[Z-1]+' · '+category(Z)[0],SYMB[Z-1]+' '+NAMES_EN[Z-1]+' · '+category(Z)[1]),new THREE.Vector3(0,-5.0,0),'o');
const nobleLbl=addLabel(()=>L('满壳 · 慵懒（几乎不反应）','Full shell · inert (barely reacts)'),new THREE.Vector3(0,4.9,0),'g',()=>[2,10,18,36].includes(Z));
const shellLbl=addLabel(()=>{const s=fillShells(Z).shells.filter(v=>v);return L('壳层排布 ','Shells ')+s.join('·')+'（最外 '+s[s.length-1]+'）';},new THREE.Vector3(0,5.6,0),'b');
const flameLbl=addLabel(()=>L('焰色','Flame'),new THREE.Vector3(4.6,-3.6,0),'r',()=>!!FLAME[Z]);
/* 满壳瞬间闪光 */
const flash=new THREE.Mesh(new THREE.SphereGeometry(4.6,32,24),new THREE.MeshBasicMaterial({color:0x74f5b0,transparent:true,opacity:0}));
eGroup.add(flash); let flashT=1;

/* ---- 主题/语言/步骤 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
  scene.fog.color.setHex(THEME==='dark'?0x101418:0xe9e4dc);
  refreshPlotColors();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}
const STEPS=[
 {zh:'泡利不相容：两个费米子不能共享同一量子态——(n,l,m,s) 四个数至少一个不同',en:'Pauli exclusion: no two fermions share a quantum state (n,l,m,s)'},
 {zh:'壳层容量 2n²：K=2、L=8、M=18……电子按能量从低到高逐个填入',en:'Shell capacity 2n²: K=2, L=8, M=18… filled bottom-up by energy'},
 {zh:'能级交错：4s 先于 3d 填入——过渡金属与副族的来源',en:'4s fills before 3d — the origin of transition metals'},
 {zh:'周期性：最外层电子数周期重复 → 碱金属(最外1个)暴躁、稀有气体满壳慵懒',en:'Periodicity: valence count repeats → alkali fiery, noble gas lazy'},
 {zh:'锯齿铁证：电离能与原子半径随 Z 锯齿起伏——不相容的直接后果',en:'Sawtooth ionization energy & radius vs Z — direct proof of the exclusion'},
 {zh:'白矮星：电子简并压同样源自泡利不相容，撑住一整颗恒星的重量',en:'White dwarfs: electron degeneracy pressure, same principle, holds up a star'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>gotoStep(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function gotoStep(i){
  activeStep=i;syncSteps();
  const zmap=[1,10,26,19,18,2];
  setZ(zmap[i],true);
}
function setZ(nz,flashIfNoble){
  nz=clamp(nz,1,36);
  const wasN=[2,10,18,36].includes(Z);
  Z=nz;document.getElementById('sZ').value=nz;
  document.getElementById('sZVal').textContent=nz;
  while(electrons.length<nz){ // 新电子从核里跳出
    const m=new THREE.Mesh(eGeo,eM_inner);
    m.position.set(0,0,0);eGroup.add(m);
    electrons.push({m,slot:{s:0,i:0,c:1}});
  }
  while(electrons.length>nz){const e=electrons.pop();eGroup.remove(e.m);}
  const {shells}=fillShells(Z);
  let k=0;
  shells.forEach((c,s)=>{for(let i=0;i<c;i++)electrons[k++].slot={s,i,c};});
  const occ=shells.map((c,s)=>c>0?s:-1).filter(s=>s>=0);
  const lastS=occ[occ.length-1];
  electrons.forEach(e=>{e.m.material=e.slot.s===lastS?eM_val:eM_inner;}); // 最外层=价电子
  nuc.scale.setScalar(0.85+Z*0.012);
  const fc=FLAME[Z];
  halo.visible=!!fc;
  if(fc){haloM.color.set(fc);flameLbl.o.element.style.color=fc;flameLbl.o.element.style.borderColor=fc;}
  const isN=[2,10,18,36].includes(Z);
  if(isN&&!wasN&&flashIfNoble!==false)flashT=0;   // 跨过满壳的瞬间亮一下
  updateStats();
}
function updateStats(){
  document.getElementById('stZ').textContent=Z;
  document.getElementById('stEl').textContent=LANG==='en'?SYMB[Z-1]+' '+NAMES_EN[Z-1]:NAMES_ZH[Z-1]+'('+SYMB[Z-1]+')';
  const sh=fillShells(Z).shells.filter(v=>v);
  document.getElementById('stVal').textContent=sh[sh.length-1];
  document.getElementById('stIE').innerHTML=IE[Z-1]+'<small> kJ/mol</small>';
}

/* ---- 轨道能级图 + 电离能/半径曲线（canvas） ---- */
const plot=document.getElementById('plot'),pctx=plot.getContext('2d');
let PC={};
function refreshPlotColors(){
  PC={txt:THEME==='dark'?'#9fb0c3':'#5b6b7d',acc:THEME==='dark'?'#ffa94d':'#e8590c',
      red:THEME==='dark'?'#ff6b6b':'#c92a2a',blue:THEME==='dark'?'#74c0fc':'#1864ab',
      grid:THEME==='dark'?'rgba(255,255,255,.10)':'rgba(15,25,40,.14)'};
}
function drawPlot(){ /* 右半：电离能(橙)与半径(蓝)随 Z 的锯齿 */
  const W=plot.width,H=plot.height;
  const cx0=300,cw=W-300-14,cy0=30,ch=H-52;
  pctx.font='11px sans-serif';pctx.fillStyle=PC.txt;
  pctx.fillText(L('电离能 / 原子半径 ~ Z：锯齿=周期性','Ionization energy / radius ~ Z: sawtooth = periodicity'),cx0,16);
  pctx.strokeStyle=PC.grid;
  pctx.strokeRect(cx0,cy0,cw,ch);
  const X=i=>cx0+cw*(i/35),Yie=v=>cy0+ch*(1-v/2400),Yr=v=>cy0+ch*(1-v/250);
  pctx.strokeStyle=PC.acc;pctx.lineWidth=1.6;pctx.beginPath();
  for(let i=0;i<Z;i++){const x=X(i),y=Yie(IE[i]);i?pctx.lineTo(x,y):pctx.moveTo(x,y);}
  pctx.stroke();
  pctx.strokeStyle=PC.blue;pctx.beginPath();
  for(let i=0;i<Z;i++){const x=X(i),y=Yr(RAD[i]);i?pctx.lineTo(x,y):pctx.moveTo(x,y);}
  pctx.stroke();pctx.lineWidth=1;
  for(let i=0;i<Z;i++){
    pctx.fillStyle=PC.acc;pctx.fillRect(X(i)-1.5,Yie(IE[i])-1.5,3,3);
    pctx.fillStyle=PC.blue;pctx.fillRect(X(i)-1.5,Yr(RAD[i])-1.5,3,3);
  }
  pctx.strokeStyle=PC.red;pctx.beginPath();pctx.moveTo(X(Z-1),cy0);pctx.lineTo(X(Z-1),cy0+ch);pctx.stroke();
  pctx.fillStyle=PC.acc;pctx.fillText('电离能 kJ/mol',cx0+4,cy0+12);
  pctx.fillStyle=PC.blue;pctx.fillText('半径 pm',cx0+82,cy0+12);
  pctx.fillStyle=PC.red;pctx.fillText('Z='+Z,X(Z-1)-12,cy0+ch+13);
}
/* 左半：轨道能级图（构造原理顺序，↑↓=自旋相反的一对） */
function drawOrbital(){
  pctx.font='11px sans-serif';pctx.fillStyle=PC.txt;
  pctx.fillText(L('轨道能级图（泡利：一格最多 ↑↓ 两个）','Orbital diagram (Pauli: max ↑↓ per box)'),14,16);
  const rows=[[0],[1,2],[3,4,6],[5,7]];
  let left=Z;
  const bw=20,bh=20,gap=5;
  rows.forEach((row,ri)=>{
    let x=14;const y=28+ri*40;
    row.forEach(oi=>{
      const [name,,cap]=ORDER[oi];
      for(let b=0;b<cap/2;b++){
        const got=Math.min(2,left);left-=got;
        pctx.strokeStyle=got?PC.acc:PC.grid;
        pctx.strokeRect(x,y,bw,bh);
        pctx.fillStyle=PC.txt;pctx.font='10px sans-serif';
        pctx.fillText(name,x+2,y-3);
        if(got>0)spinArrow(x+6,y+bh-3);
        if(got>1)spinArrow(x+14,y+bh-3);
        x+=bw+gap;
      }
      x+=8;
    });
  });
}
function spinArrow(x,y){
  pctx.strokeStyle=PC.acc;pctx.beginPath();
  pctx.moveTo(x,y);pctx.lineTo(x,y-11);pctx.stroke();
  pctx.beginPath();pctx.moveTo(x-3,y-7);pctx.lineTo(x,y-12);pctx.lineTo(x+3,y-7);pctx.stroke();
}

/* ---- 交互 ---- */
document.getElementById('btnAuto').addEventListener('click',()=>{
  autoInc=!autoInc;
  document.getElementById('btnAuto').classList.toggle('on',autoInc);
  document.getElementById('btnAuto').textContent=L(autoInc?'自动递增 开':'自动递增 关',autoInc?'Auto Z+1 ON':'Auto Z+1 OFF');
});
document.getElementById('btnNoble').addEventListener('click',()=>{
  setZ([2,10,18,36].find(n=>n>=Z)||36,true);});
document.getElementById('btnAlkali').addEventListener('click',()=>{
  setZ([3,11,19].find(n=>n>=Z)||19,true);});
document.getElementById('btnReset').addEventListener('click',()=>setZ(1,true));
document.getElementById('sZ').addEventListener('input',e=>setZ(+e.target.value,false));
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1')playing=false;
if(qp.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(parseFloat(qp.get('speed'))>0){speedK=clamp(parseFloat(qp.get('speed')),0.2,3);
  document.getElementById('sSpd').value=speedK*100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing&&autoInc){
    zT+=dt*speedK;
    if(zT>1.1){zT=0;setZ(Z%36+1,true);}
  }
  /* 电子沿壳层缓慢公转 + 跳入动画 */
  electrons.forEach(e=>{
    e.m.position.lerp(targetPos(e.slot),1-Math.exp(-dt*5));
    e.m.rotation.y+=dt;
  });
  eGroup.rotation.z-=dt*0.12;
  nuc.rotation.y+=dt*0.4;
  if(flashT<1){flashT=Math.min(1,flashT+dt*1.4);flash.material.opacity=0.5*(1-flashT);}
  acc+=dt;if(acc>0.1){acc=0;updateStats();
    pctx.clearRect(0,0,plot.width,plot.height);drawPlot();drawOrbital();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.fn();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();setZ(1,false);buildSteps();activeStep=0;syncSteps();drawPlot();drawOrbital();start();
</script>
