<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>除颤器 · 不是重启,是集体归零</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff8787;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#f0efed; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,135,135,.6); background: rgba(255,135,135,.12); color: var(--text); }
  .abtn.crash { border-color: rgba(255,107,107,.55); color: #ff8787; }
  .abtn.shock { border-color: rgba(116,192,252,.55); color: #74c0fc; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(201,42,42,.55); background: rgba(201,42,42,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,135,135,.10); border-color: rgba(255,135,135,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="title">

  <div class="sub" data-zh="室颤=几百万心肌细胞各跳各的,泵血归零;除颤不「电醒」心脏,而是用一次大电流让全场同时去极化——所有波一起清零,窦房结才有机会重新发令 · E=½CV²,150 J 就是 1732 V · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="VF = millions of cardiac cells firing on their own, pumping nothing; defibrillation does not kick-start the heart — one big pulse depolarizes every cell at once, clearing all waves so the sinus node can call the beats again · E=½CV², 150 J is 1732 V · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">室颤=几百万心肌细胞各跳各的,泵血归零;除颤不「电醒」心脏,而是用一次大电流让全场同时去极化——所有波一起清零,窦房结才有机会重新发令 · E=½CV²,150 J 就是 1732 V · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xf0efed : 0x0f1013);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('除颤器 · 不是重启,是集体归零', 'Defibrillator · Not a Restart, a Global Reset');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setToggleBtns();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.2, 0.5, 4.9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 14;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(3, 6, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 2, -4);
scene.add(fill);

/* ================= 心肌网格(可激发细胞自动机) ================= */
let geo = mergeVertices(new THREE.SphereGeometry(1.05, 44, 30), 1e-4);
{ /* 捏出心形:整体拉长 + 心尖收细 + 轻微倾斜 */
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    y *= 1.18;
    const dn = clamp(-y / 1.25, 0, 1);
    const taper = 1 - 0.42 * Math.pow(dn, 1.6);       // 心尖收窄
    x *= taper; z *= taper;
    pos.setXYZ(i, x, y, z);
  }
  geo.computeVertexNormals();
}
const heart = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.55, metalness: 0.05, transparent: true, opacity: 0.98 }));
heart.rotation.z = -0.28;
scene.add(heart);
/* 两只心房(装饰) */
const atriaMat = new THREE.MeshStandardMaterial({ color: 0x5a2430, roughness: 0.6, transparent: true, opacity: 0.92 });
for (const [dx, dz] of [[-0.42, 0.1], [0.45, -0.05]]) {
  const a = new THREE.Mesh(new THREE.SphereGeometry(0.3, 18, 14), atriaMat);
  a.scale.set(1, 0.72, 1);
  a.position.set(dx, 1.05, dz);
  heart.add(a);
}
/* 邻接表(从索引三角形抽取边) */
const N = geo.attributes.position.count;
const nbrs = Array.from({ length: N }, () => []);
{
  const idx = geo.index.array;
  const link = (a, b) => {
    if (!nbrs[a].includes(b)) nbrs[a].push(b);
    if (!nbrs[b].includes(a)) nbrs[b].push(a);
  };
  for (let i = 0; i < idx.length; i += 3) { link(idx[i], idx[i + 1]); link(idx[i + 1], idx[i + 2]); link(idx[i + 2], idx[i]); }
}
/* 细胞状态:0 静息,1 兴奋,2 不应期,3 灼伤 */
const state = new Uint8Array(N);
const timer = new Float32Array(N);
const burnFlag = new Uint8Array(N);
const colors = new Float32Array(N * 3);
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const C_REST = [0.48, 0.15, 0.20], C_EXC = [1.0, 0.88, 0.40], C_REF = [0.33, 0.10, 0.24], C_BURN = [0.08, 0.05, 0.06];
/* 起搏灶 */
let foci = [];                                         // {i, period, phase}
function addFocus(i, period, phase = 0) { foci.push({ i, period, phase }); }
function findNear(x, y, z) {                           // 找最近顶点
  let best = 0, bd = 1e9;
  const p = geo.attributes.position;
  for (let i = 0; i < N; i++) {
    const d = (p.getX(i) - x) ** 2 + (p.getY(i) - y) ** 2 + (p.getZ(i) - z) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function excite(i) { if (state[i] === 0 || state[i] === 2) { state[i] = 1; timer[i] = 0.045 * (0.85 + Math.random() * 0.3); } }
function setSinus() {
  foci = [];
  const top = findNear(0.25, 1.25, 0.15);              // 窦房结位置(右上)
  addFocus(top, 0.8);
}
function setVF(n = 6) {
  foci = [];
  const p = geo.attributes.position;
  for (let k = 0; k < n; k++) {
    const i = Math.floor(Math.random() * N);
    addFocus(i, 0.18 + Math.random() * 0.2, Math.random() * 0.2);
  }
}
/* 除颤 */
const CAP_C = 100e-6;                                  // 100 µF
let targetE = clamp(qsFloat('en', 150), 30, 360);
let storedE = 0, charging = 0;                         // charging: 0 无,>0 充电进度
let rhythm = 'sinus';                                  // sinus | vf | asystole
let shockFlash = 0, shockLock = 0, refibQueue = 0, burnCount = 0;
function deliverShock() {
  if (storedE < targetE * 0.98) return;
  const E = storedE;
  storedE = 0;
  shockFlash = 0.16;
  shockLock = 0.55;                                    // 全场去极化+不应期
  drawZig();
  for (let i = 0; i < N; i++) if (state[i] !== 3) { state[i] = 2; timer[i] = 0.5 + Math.random() * 0.1; }
  if (rhythm === 'sinus') {                            // 电击一颗正常心脏 → R-on-T 诱发室颤
    refibQueue = 0.9;
    rhythm = 'vf';
    return;
  }
  if (E < 70) { refibQueue = 0.7; rhythm = 'vf'; }     // 能量不足:复颤
  else {
    rhythm = 'asystole';
    if (E > 300) {                                     // 过大:灼伤
      let n = Math.round((E - 300) / 6) + 30;
      for (let k = 0; k < n; k++) { const i = Math.floor(Math.random() * N); state[i] = 3; burnFlag[i] = 1; }
      burnCount += n;
    }
    setTimeoutSafe(() => { if (rhythm === 'asystole') setSinus(); rhythm = 'sinus'; }, 0.9);
  }
}
const timeouts = [];
function setTimeoutSafe(fn, t) { timeouts.push({ fn, t }); }
/* 传播步进:波前走二跳邻接,匹配真实「0.5 秒扫完全心」 */
const STEP = 0.024;
let acc = 0;
const nbrs2 = nbrs.map((nb, i) => {
  const s = new Set(nb);
  for (const j of nb) for (const k of nbrs[j]) s.add(k);
  s.delete(i);
  return [...s];
});
function propagate() {
  const fire = [];
  for (let i = 0; i < N; i++) {
    if (state[i] !== 0) continue;
    const nb = nbrs2[i];
    for (let k = 0; k < nb.length; k++) {
      if (state[nb[k]] === 1) { fire.push(i); break; }
    }
  }
  for (const i of fire) excite(i);
}
function stepCA(dt) {
  acc += dt;
  while (acc >= STEP) {
    acc -= STEP;
    propagate();
  }
  for (let i = 0; i < N; i++) {
    if (state[i] === 1) {                       // 兴奋结束 → 进入不应期(防止折返)
      timer[i] -= dt;
      if (timer[i] <= 0) { state[i] = 2; timer[i] = 0.5 + Math.random() * 0.08; }
    } else if (state[i] === 2) {
      timer[i] -= dt;
      if (timer[i] <= 0) { state[i] = 0; timer[i] = 0; }
    }
  }
  for (const f of foci) {
    f.phase += dt;
    if (f.phase >= f.period) { f.phase = 0; f.period = f.period * (0.95 + Math.random() * 0.1); excite(f.i); }
  }
  for (const t of timeouts) t.t -= dt;
  for (let i = timeouts.length - 1; i >= 0; i--) if (timeouts[i].t <= 0) { const fn = timeouts[i].fn; timeouts.splice(i, 1); fn(); }
  if (refibQueue > 0) {
    refibQueue -= dt;
    if (refibQueue <= 0) { refibQueue = 0; if (rhythm === 'vf') setVF(3 + Math.floor(Math.random() * 3)); }
  }
}

/* ================= 电极板与放电弧 ================= */
function pad(x, y, z, txt) {
  const g = new THREE.Group();
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.05, 26),
    new THREE.MeshStandardMaterial({ color: 0x2f4f6f, roughness: 0.4, metalness: 0.5 }));
  g.add(disc);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 0.26, 14), mat2(0x37414c));
  handle.position.y = 0.22;
  g.add(handle);
  g.position.set(x, y, z);
  g.lookAt(0, 0.1, 0);
  g.rotateX(Math.PI / 2);
  scene.add(g);
  return g;
}
function mat2(color) { return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3 }); }
const padA = pad(-1.75, 0.55, 0.75, '−'), padB = pad(1.75, 0.15, 0.7, '+');
/* 放电弧线 */
const zigGeo = new THREE.BufferGeometry();
const zigLine = new THREE.Line(zigGeo, new THREE.LineBasicMaterial({ color: 0xcfe8ff, transparent: true, opacity: 0 }));
scene.add(zigLine);
function drawZig() {
  const a = padA.position, b = padB.position;
  const pts = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14;
    const p = new THREE.Vector3().lerpVectors(a, b, t);
    if (i > 0 && i < 14) p.add(new THREE.Vector3((Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3));
    pts.push(p);
  }
  zigGeo.setFromPoints(pts);
}

/* ---------------- 场景标签 ---------------- */
const labelReg = [];
let labelsOn = true;
function addLabel(textFn, pos, cls = '', vis = () => true) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  labelReg.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return o;
}
function refreshLabels() {
  for (const r of labelReg) r.o.visible = labelsOn && r.vis();
}
const lblRhythm = addLabel(() => rhythm === 'sinus' ? L('窦性节律:一位指挥,全场同步', 'sinus: one conductor, all in sync')
  : rhythm === 'vf' ? L('室颤:多个野灶各自起搏,波互相撞碎', 'VF: rogue pacemakers, waves crashing')
  : L('归零/停搏:安静的等待窗', 'reset / asystole: the silent window'),
  new THREE.Vector3(0, -1.75, 0), rhythm === 'sinus' ? 'g' : rhythm === 'vf' ? 'r' : 'b');
addLabel(() => L('窦房结:天然起搏器 60–100 次/分', 'sinus node: the natural pacemaker'),
  new THREE.Vector3(0.6, 1.55, 0), 'g', () => rhythm === 'sinus');
addLabel(() => L('兴奋波:去极化自己滚成螺旋', 'the wave: depolarization rolling on its own'),
  new THREE.Vector3(-1.35, -0.85, 0.5), 'o', () => rhythm === 'vf');
addLabel(() => L(`双相波 ${targetE} J:让全场同时去极化`, `biphasic ${targetE} J: depolarize everything at once`),
  new THREE.Vector3(1.55, 0.9, 0.6), 'b');
const lblWarn = addLabel(() => {
  if (refibQueue > 0 && storedE === 0 && targetE < 70 && rhythm === 'vf') return L('能量不足 → 复颤!', 'not enough energy → re-fib!');
  if (burnCount > 0) return L(`灼伤点 ×${burnCount}:能量过大的代价`, `burn marks ×${burnCount}: the price of too much`);
  return '';
}, new THREE.Vector3(0, 1.85, 0), 'r', () => (refibQueue > 0 && targetE < 70 && rhythm === 'vf') || burnCount > 0);
addLabel(() => L('电影误区:心脏停跳(一条直线)不电击——电的是「颤」', 'movie myth: flatline is NOT shocked — you shock fibrillation'),
  new THREE.Vector3(0, -2.1, 0), 'st', () => rhythm === 'asystole');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '窦性:一位指挥', be: 'Sinus: one conductor',
    d: '窦房结每 0.8 秒发一次令,去极化波从心房滚到心尖再折返——全场步调一致,先收缩再舒张,泵血 100%。',
    de: 'The sinus node calls every 0.8 s; the depolarization wave rolls from atria to apex and back — everyone in step, pump output 100%.',

  { b: '室颤:一群叛乱指挥', be: 'VF: a mob of rogue conductors',

    de: 'The brief flatline is the waiting room; once everything is rested, the one true conductor fires first and a single clean wave takes over — output restored.',
    act: () => { resetAll('vf'); storedE = targetE; deliverShock(); } },

    de: 'Under 70 J fails to clear → re-fib; over 300 J burns muscle (watch the burn counter). And a flatline is never shocked — there is nothing to defibrillate; that\'s CPR and adrenaline.',
    act: () => { targetE = 50; document.getElementById('en').value = 50; document.getElementById('enVal').textContent = '50 J'; resetAll('vf'); storedE = 50; deliverShock(); } },

function stepIndex() {
  if (burnCount > 0 || (refibQueue > 0 && targetE < 70)) return 5;
  if (rhythm === 'asystole') return 4;
  if (shockFlash > 0 || shockLock > 0.3) return 3;
  if (storedE >= targetE * 0.98) return 2;
  if (rhythm === 'vf') return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 曲线图(滚动心电图) ================= */
const plotCv = document.getElementById('plotCv');
const ecgBuf = [];
let ecgAcc = 0;
function fracExcited() {
  let c = 0;
  for (let i = 0; i < N; i++) if (state[i] === 1) c++;
  return c / N;
}
let fracSm = 0;
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 12;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  ctx.strokeStyle = cTxt; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(pad, H / 2); ctx.lineTo(W - pad, H / 2); ctx.stroke();
  ctx.strokeStyle = '#69db7c'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  const n = ecgBuf.length;
  for (let i = 0; i < n; i++) {
    const x = pad + (W - 2 * pad) * i / (240 - 1);
    const y = H / 2 - ecgBuf[i] * H * 0.42;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '14px system-ui';
  ctx.fillText(L('4 s 窗口', '4 s window'), W - pad - 64, pad + 14);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elEn = document.getElementById('en'), elEnVal = document.getElementById('enVal');
const stRy = document.getElementById('stRy'), stA = document.getElementById('stA'), stP = document.getElementById('stP'),
  stV = document.getElementById('stV'), stE = document.getElementById('stE');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setToggleBtns() {
  document.getElementById('btnCharge').classList.toggle('on', charging > 0 || storedE > 0);
  document.getElementById('btnShock').classList.toggle('on', storedE >= targetE * 0.98);
}
function syncSliders() { elEn.value = targetE; elEnVal.textContent = targetE + ' J'; }
function syncAll() { syncSliders(); setToggleBtns(); }
function updateFormula() {
  const V = Math.sqrt(2 * storedE / CAP_C);
  formulaEl.innerHTML = L(
    `E = ½CV² → 已充 <b>${storedE.toFixed(0)} J</b> = <b>${V.toFixed(0)} V</b>(C=100 µF)· 双相波 ~150 A、8 ms<br>` +
    (rhythm === 'vf' ? L('室颤中:泵血≈0,每延迟一分钟存活率掉 ~10%', 'VF: output≈0, survival drops ~10% per minute')
      : rhythm === 'asystole' ? L('归零窗:全场不应期,等窦房结先开口', 'reset window: everyone refractory, waiting for the sinus node')
      : L('窦性:规整的 P-QRS-T', 'sinus: tidy P-QRS-T')),
    `E = ½CV² → stored <b>${storedE.toFixed(0)} J</b> = <b>${V.toFixed(0)} V</b> (C=100 µF) · biphasic ~150 A, 8 ms<br>` +
    (rhythm === 'vf' ? 'VF: output≈0, survival −10%/min' : rhythm === 'asystole' ? 'reset window: all refractory' : 'sinus: tidy P-QRS-T'));
}
function startCharge() { charging = 0.0001; }
function resetAll(mode) {
  state.fill(0); timer.fill(0); burnFlag.fill(0);
  burnCount = 0; refibQueue = 0; shockFlash = 0; shockLock = 0;
  timeouts.length = 0; acc = 0;
  rhythm = mode;
  if (mode === 'sinus') setSinus(); else if (mode === 'vf') setVF(6); else foci = [];
  syncAll(); updateFormula();
}
document.getElementById('btnVF').addEventListener('click', () => { resetAll('vf'); });
document.getElementById('btnCharge').addEventListener('click', () => { charging = 0.0001; });
document.getElementById('btnShock').addEventListener('click', () => deliverShock());
document.getElementById('btnSinus').addEventListener('click', () => { resetAll('sinus'); });
elEn.addEventListener('input', () => { targetE = +elEn.value; elEnVal.textContent = targetE + ' J'; updateFormula(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 颜色与主循环 ================= */
function updateColors() {
  for (let i = 0; i < N; i++) {
    let c = C_REST, k = 0;
    if (state[i] === 3) c = C_BURN;
    else if (state[i] === 1) { c = C_EXC; }
    else if (state[i] === 2) { c = C_REF; k = clamp(timer[i] / 0.5, 0, 1); }
    const o = i * 3;
    colors[o] = lerp(c[0], C_REST[0], k * 0.5);
    colors[o + 1] = lerp(c[1], C_REST[1], k * 0.5);
    colors[o + 2] = lerp(c[2], C_REST[2], k * 0.5);
    if (shockFlash > 0) { colors[o] = lerp(colors[o], 1, 0.85); colors[o + 1] = lerp(colors[o + 1], 1, 0.85); colors[o + 2] = lerp(colors[o + 2], 1, 0.85); }
  }
  geo.attributes.color.needsUpdate = true;
}
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05) * (playing ? speed : 0);
  if (charging > 0) {
    charging = Math.min(1, charging + dt / 1.8);
    storedE = targetE * charging;
    if (charging >= 1) charging = 0;
    setToggleBtns(); updateFormula();
  }
  stepCA(dt);
  if (shockFlash > 0) {
    shockFlash -= dt;
    zigLine.material.opacity = clamp(shockFlash * 8, 0, 1);
  } else zigLine.material.opacity = 0;
  if (shockLock > 0) shockLock -= dt;
  /* 收缩:兴奋面积驱动;室颤加抖动 */
  const frac = fracExcited();
  fracSm = lerp(fracSm, frac, 0.25);
  let sc = 1 + fracSm * 0.22;
  if (rhythm === 'vf') sc += Math.sin(performance.now() * 0.05) * 0.012;
  heart.scale.setScalar(sc);
  updateColors();
  /* 心电采样 */
  ecgAcc += dt;
  while (ecgAcc >= 0.0167) {
    ecgAcc -= 0.0167;
    const jit = rhythm === 'vf' ? (Math.random() - 0.5) * 0.25 : 0;
    ecgBuf.push(clamp((frac - 0.16) * 2.6 + jit, -0.6, 1));
    if (ecgBuf.length > 240) ecgBuf.shift();
  }
  statsAcc += dt;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stRy.textContent = rhythm === 'sinus' ? L('窦性', 'sinus') : rhythm === 'vf' ? L('室颤 ⚠', 'VF ⚠') : L('归零', 'reset');
    stRy.className = 'v ' + (rhythm === 'vf' ? 'bad' : rhythm === 'asystole' ? 'warn' : 'ok');
    stA.textContent = (frac * 100).toFixed(0) + ' %';
    stP.textContent = rhythm === 'sinus' ? '100 %' : rhythm === 'vf' ? (5 + Math.random() * 8).toFixed(0) + ' %' : '0 %';
    stP.className = 'v ' + (rhythm === 'sinus' ? 'ok' : 'bad');
    stV.textContent = Math.sqrt(2 * storedE / CAP_C).toFixed(0) + ' V';
    stE.textContent = storedE.toFixed(0) + ' / ' + targetE + ' J';
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
syncSliders();
applyTheme();
applyLang();
resetAll(qs.get('mode') === 'vf' ? 'vf' : 'sinus');
setPlayLabel();
start();
