<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灭火器 · 隔氧、降温、断链,三管齐下</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff6b6b;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,107,107,.6); background: rgba(255,107,107,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,169,77,.55); color: #ffa94d; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(201,42,42,.55); background: rgba(201,42,42,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,107,107,.10); border-color: rgba(255,107,107,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="灭火器 · 隔氧、降温、断链,三管齐下" data-en="Fire Extinguisher · Smother, Cool, and Break the Chain">灭火器 · 隔氧、降温、断链,三管齐下</h1>
  <div class="sub" data-zh="压把下压顶开阀杆,钢瓶里 1.4 MPa 的氮气把 4 kg 干粉沿虹吸管(进气口在瓶底)压出喷嘴;对准火焰根部,粉雾几秒内把局部氧浓度从 21% 砸到 15% 以下、把燃面温度拉离燃点——这是窒息加冷却;磷酸铵盐熔成玻璃膜还顺手捕获 H· 与 OH· 自由基,把链式反应从中间掐断,这是 CO₂ 做不到的;燃烧三角拆掉任意一条边火就灭,拆两条边几秒内必灭;压力表指针留在绿区,才叫「随时能用」 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Squeeze the handle, the valve stem opens, and 1.4 MPa of nitrogen drives 4 kg of powder up the siphon tube (intake at the cylinder bottom) out of the horn; aimed at the base, the cloud pulls local oxygen below 15% and drags the fuel surface off its ignition point — smothering plus cooling; the monoammonium phosphate melts into a glassy film and captures H· and OH· radicals, cutting the chain reaction mid-loop, which CO₂ cannot do; remove any one side of the fire triangle and the fire dies, remove two and it dies in seconds; the gauge must rest in the green to count as ready · 3D interactive demo · drag to orbit · Space = run/pause">灭火器 · 隔氧、降温、断链,三管齐下</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="筒内压力" data-en="Cylinder pressure">筒内压力</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="剩余药剂" data-en="Agent left">剩余药剂</span><span class="v" id="stMed">—</span>
  <span class="k" data-zh="火焰强度" data-en="Flame intensity">火焰强度</span><span class="v bad" id="stFire">—</span>
  <span class="k" data-zh="根部温度" data-en="Base temp">根部温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="局部氧浓度" data-en="Local O₂">局部氧浓度</span><span class="v" id="stO2">—</span>
  <span class="k" data-zh="阶段" data-en="Phase">阶段</span><span class="v" id="stPhase">—</span>
</div>

<div id="plot">
  <h3 data-zh="火焰强度与局部氧浓度-时间(实时仿真):覆盖断氧、降温离开燃点,强度跌破零线即熄灭" data-en="Flame intensity & local O₂ vs time (live sim): the blanket cuts oxygen and cooling leaves ignition range; the flame dies when intensity hits zero">火焰强度与局部氧浓度-时间(实时仿真):覆盖断氧、降温离开燃点,强度跌破零线即熄灭</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="黄雾:ABC 干粉" data-en="yellow cloud: ABC dry powder">黄雾:ABC 干粉</span>
    <span class="chip.b" data-zh="白雾:CO₂(不断链)" data-en="white cloud: CO₂ (no chain-break)">白雾:CO₂(不断链)</span>
    <span class="chip.r" data-zh="燃烧三角:任缺一边即灭" data-en="fire triangle: lose any side, out it goes">燃烧三角:任缺一边即灭</span>
    <span class="chip.g" data-zh="压力表:绿区=备用" data-en="gauge: green = ready">压力表:绿区=备用</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnPin" data-zh="拔保险销" data-en="Pull the pin">拔保险销</button>
    <button class="abtn on" id="btnPress" data-zh="压下压把(按住喷射)" data-en="Squeeze handle (hold to spray)">压下压把(按住喷射)</button>
    <button class="abtn on" id="btnPowder" data-zh="药剂:ABC 干粉" data-en="Agent: ABC powder">药剂:ABC 干粉</button>
    <button class="abtn" id="btnCO2" data-zh="药剂:CO₂" data-en="Agent: CO₂">药剂:CO₂</button>
    <button class="abtn brk" id="btnRelight" data-zh="重新点火" data-en="Relight fire">重新点火</button>
    <button class="abtn" id="btnRecharge" data-zh="重充并复位" data-en="Recharge & reset">重充并复位</button>
  </div>
  <div class="row"><label data-zh="喷嘴瞄准" data-en="Nozzle aim">喷嘴瞄准</label><input id="sAim" type="range" min="-25" max="25" step="1" value="0"><span class="val" id="sAimVal">0°</span></div>
  <div class="row"><label data-zh="扫射幅度" data-en="Sweep width">扫射幅度</label><input id="sSweep" type="range" min="0" max="30" step="1" value="12"><span class="val" id="sSweepVal">12°</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Plot">曲线</span></label>
      <label><input id="tglTri" type="checkbox" checked> <span data-zh="燃烧三角" data-en="Triangle">燃烧三角</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../oxyhydrogen-combustion/" data-zh="氢氧燃烧:链式反应的极端版" data-en="oxyhydrogen combustion: chain reaction at full throttle">氢氧燃烧:链式反应的极端版</a>
    <a href="../smoke-detector/" data-zh="烟感:火情最早的报信人" data-en="smoke detector: the first whistle-blower">烟感:火情最早的报信人</a>
    <a href="../pressure-cooker/" data-zh="高压锅:压力如何改写沸点" data-en="pressure cooker: pressure rewrites boiling">高压锅:压力如何改写沸点</a>
    <a href="../flame-spectra/" data-zh="火焰光谱:焰色里的元素指纹" data-en="flame spectra: element fingerprints in the flame">火焰光谱:焰色里的元素指纹</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 20, 66);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
  tankM.color.setHex(dark ? 0xc9302c : 0xd64545);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('灭火器 · 隔氧、降温、断链,三管齐下', 'Fire Extinguisher · Smother, Cool, and Break the Chain');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 140);
camera.position.set(3.4, 2.8, 8.8);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0.3, 1.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 0.95);
key.position.set(6, 9, 7);
scene.add(key);
const fireLight = new THREE.PointLight(0xff7b3d, 1.4, 12, 1.6);

const P_MAX = 320;

const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_MAX * 3), pCol = new Float32Array(P_MAX * 3);

const cPowderJet = new THREE.Color(0xffe066), cCo2Jet = new THREE.Color(0xd0ebfc);
function spawn(kind, col, pos, vel, life) {
  if (parts.length >= P_MAX) return;
  parts.push({ kind, col, pos: pos.clone(), vel: vel.clone(), life, max: life });
}
function hornTip() {
  const aim = -aimDeg * Math.PI / 180;
  const base = new THREE.Vector3(1.36, 1.26, 0.33);
  const dir = new THREE.Vector3(Math.sin(1.1), -0.35, 0).normalize();
  dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), aim * 0.35);
  return base.add(dir.multiplyScalar(0.42));
}
function jetTarget() {
  const aim = aimDeg / 25;
  return new THREE.Vector3(FIRE.x + aim * 1.15, 0.2, FIRE.z + (Math.random() - 0.5) * 0.3);
}
function stepParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.kind === 'jet') {
      const u = 1 - p.life / p.max;
      const a = p.p0, b = p.p1, c = p.p2;
      const w = (1 - u) * (1 - u), q = 2 * (1 - u) * u, r = u * u;
      p.pos.set(w * a.x + q * b.x + r * c.x, w * a.y + q * b.y + r * c.y, w * a.z + q * b.z + r * c.z);
    } else {
      p.pos.addScaledVector(p.vel, dt);
      if (p.kind === 'spark') p.vel.y -= 1.2 * dt;
    }
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function drawParts() {
  const n = parts.length;
  for (let i = 0; i < P_MAX; i++) {
    if (i < n) {
      const p = parts[i];
      const f = clamp(p.life / p.max, 0, 1);
      pPos[i * 3] = p.pos.x; pPos[i * 3 + 1] = p.pos.y; pPos[i * 3 + 2] = p.pos.z;
      pCol[i * 3] = p.col.r * f; pCol[i * 3 + 1] = p.col.g * f; pCol[i * 3 + 2] = p.col.b * f;
    } else pPos[i * 3 + 1] = -999;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

/* ---------------- 物理推进 ================= */
function valveOpen() { return pinPulled && pressed && mPowder > 0.02 && P > 0.25e6; }
function pullPin() {
  pinPulled = true;
  notifyT = 2.2;
  notifyZ = '保险销拔出:压把现在可以下压,阀杆才能顶开';
  notifyE = 'pin pulled: the handle can now squeeze and open the valve stem';
}
function relight() {
  I = 1.0; Tfire = 620; O2 = 20.9; fireOut = false;
  notifyT = 2;
  notifyZ = '火已重燃:燃烧三角重新凑齐';
  notifyE = 'fire relit: the triangle is complete again';
}
function recharge() {
  mPowder = M0; P = P0; pressed = false;
  relight();
  notifyT = 2;
  notifyZ = '重新充装:压力回 1.4 MPa,药剂回 100%';
  notifyE = 'recharged: 1.4 MPa, agent back to 100%';
}
function simStep(dt) {
  simT += dt;
  pinK = clamp(pinK + (pinPulled ? dt * 4 : -dt * 4), 0, 1);
  squeezeK = clamp(squeezeK + (pressed ? dt * 5 : -dt * 5), 0, 1);
  /* 排放:等温气推 P=P0·Vg0/Vg,质量流量∝P */
  const mdot = valveOpen() ? 0.3 * (P / 1e6) * 1.05 : 0;
  if (mdot > 0) {
    mPowder = Math.max(0, mPowder - mdot * dt);
    const Vg = VG0 + (M0 - mPowder) / RHO;
    P = P0 * VG0 / Vg;
    if (mPowder <= 0.02 || P < 0.25e6) {
      marks.push({ t: simT, k: 'empty' });
      notifyT = 2.4;
      notifyZ = '压力/药剂耗尽:喷射停止,必须重充并再充压';
      notifyE = 'pressure/agent spent: discharge stops, recharge and re-pressurize';
    }
  }
  /* 覆盖率:瞄准 + 扫射 + 喷射衰减 */
  const offC = Math.abs(aimDeg) > 25 ? 0 : 1 - Math.abs(aimDeg) / 25;
  const covT = mdot > 0 ? offC * clamp(0.4 + sweep / 40, 0, 1) : 0;
  cov += (covT - cov) * clamp(dt * 2.2, 0, 1);
  /* 局部氧浓度:干粉盖 9 / CO₂ 挤 12 个百分点 */
  const cut = agent === 'powder' ? 9 : 12;
  const o2T = 20.9 - cov * cut;
  O2 += (o2T - O2) * clamp(dt * 1.8, 0, 1);
  /* 火焰强度:I' = I·(a − b) */
  const fO2 = clamp((O2 - 12) / 8, 0, 1);
  const fT = clamp((Tfire - 250) / 300, 0, 1);
  const lam = agent === 'powder' ? 0.45 : 1.0;
  const aRate = 1.15 * fO2 * lam * fT;
  const kExt = agent === 'powder' ? 1.3 : 0.9;
  const bRate = kExt * cov;
  if (!fireOut) {
    I = Math.min(1, I * Math.exp((aRate - bRate) * dt));
    if (I <= 0.02) {
      I = 0; fireOut = true;
      marks.push({ t: simT, k: 'out' });
      notifyT = 3;
      notifyZ = '火焰熄灭:氧与温度两条边同时被拆,干粉还断了链';
      notifyE = 'fire out: oxygen and heat sides removed at once — and the powder broke the chain';
    }
  } else if (cov < 0.1 && O2 > 18 && Tfire > 380) {
    relight();
    notifyT = 2;
    notifyZ = '复燃:燃面温度还在燃点以上,火自己站了起来';
    notifyE = 'rekindled: the surface was still above ignition, the fire stood back up';
  }
  /* 温度:燃烧加热 vs 粉雾/CO₂ 汽化冷却 */
  const coolK = agent === 'powder' ? 1.2 : 1.8;
  Tfire += (0.8 * (620 * clamp(I, 0, 1) + 22 - Tfire) - coolK * cov * (Tfire - 25)) * dt;
  Tfire = clamp(Tfire, 22, 900);
  O2 = clamp(O2, 8, 21);
  /* 粒子生成 */
  if (mdot > 0 && Math.random() < mdot * dt * 42) {
    const p0 = hornTip(), p2 = jetTarget();
    const p1 = p0.clone().lerp(p2, 0.45); p1.y += 0.3;
    spawn('jet', agent === 'powder' ? cPowderJet : cCo2Jet, p0, new THREE.Vector3(), 0.32 + Math.random() * 0.1);
    parts[parts.length - 1].p0 = p0; parts[parts.length - 1].p1 = p1; parts[parts.length - 1].p2 = p2;
  }
  if (!fireOut && I > 0.04) {
    if (Math.random() < I * dt * 60) spawn('spark', Math.random() < 0.5 ? cSpark1 : cSpark2,
      new THREE.Vector3(FIRE.x + (Math.random() - 0.5) * 0.6, 0.4 + Math.random() * 0.5, FIRE.z + (Math.random() - 0.5) * 0.5),
      new THREE.Vector3((Math.random() - 0.5) * 0.4, 0.9 + Math.random() * 1.1, (Math.random() - 0.5) * 0.4), 0.55 + Math.random() * 0.3);
    if (Math.random() < I * dt * 18) spawn('smoke', cSmoke,
      new THREE.Vector3(FIRE.x + (Math.random() - 0.5) * 0.5, 1.3, FIRE.z + (Math.random() - 0.5) * 0.4),
      new THREE.Vector3((Math.random() - 0.5) * 0.15, 0.5, (Math.random() - 0.5) * 0.15), 1.8 + Math.random());
  }
  /* 采样 */
  if (buf.length === 0 || simT - buf[buf.length - 1].t > 0.08) {
    buf.push({ t: simT, fire: I * 100, o2: O2 });
    while (buf.length && simT - buf[0].t > 40) buf.shift();
  }
  while (marks.length && simT - marks[0].t > 40) marks.shift();
  return mdot;
}

const STEPS = [
  { b: '燃烧三角:三边缺一即灭', be: 'The fire triangle: lose one side, lose the fire',
    d: '燃烧同时需要三样:可燃物、够高的温度、按 21% 供应的氧。灭火不是「打败火」,而是拆三角:搬走可燃物太难,实用手段都是拆温度与氧气这两条边——三角图上任意一条边暗掉,火就进入倒计时。',
    de: 'Fire needs three things at once: fuel, enough heat, and oxygen at about 21%. Extinguishing is not fighting the flame but dismantling the triangle: removing fuel is rarely practical, so the heat and oxygen sides are the ones to attack — dim any one edge and the fire is on borrowed time.',
    act: () => { phaseIdx = 0; flyTo([4.4, 3.6, 7.4], [2.3, 2.4, 0]); } },
  { b: '拔销、压把:氮气待命', be: 'Pin out, handle down: nitrogen standing by',
    d: '保险销锁住压把,防止误喷;压把下压,顶针推开阀杆,钢瓶内 1.4 MPa 的氮气立即待命——stored-pressure 结构里,驱动气与干粉同瓶共存,不需要外接气瓶。',
    de: 'The pin locks the handle against accidental discharge; squeeze it and the stem opens, putting 1.4 MPa of nitrogen instantly on standby — in a stored-pressure unit the driver gas lives in the same cylinder as the powder, no external cartridge needed.',
    act: () => { phaseIdx = 1; flyTo([-2.6, 3.0, 4.6], [-1.9, 2.2, 0]); } },
  { b: '虹吸管:气压把粉送全程', be: 'Siphon tube: gas pressure delivers the powder',
    d: '虹吸管一直插到瓶底,进气口就在粉床里:阀门一开,氮气压在液面上,把粉沿管子整段推上去——它就是一根用气压驱动的提升管,瓶倒过来喷是它的失职,不是特性。',
    de: 'The siphon tube reaches the cylinder bottom with its intake inside the powder bed: open the valve and nitrogen pressing on the bed pushes powder up the whole tube — a gas-lift pipe; spraying upside-down is a failure mode, not a feature.',
    act: () => { phaseIdx = 2; flyTo([-1.4, 1.6, 4.2], [-1.7, 1.1, 0]); } },
  { b: '瞄根部:窒息 + 冷却', be: 'Aim at the base: smothering + cooling',
    d: '火在燃面上,不在火舌上:粉雾盖住燃面,几秒内把局部氧浓度从 21% 压到 15% 以下,同时磷酸铵盐熔成玻璃膜把燃面温度拉离燃点——两条边一起拆,I′=I·(a−b) 里 b 压过 a,强度指数衰减。',
    de: 'The fire is on the fuel surface, not the tongue: the blanket pushes local oxygen from 21% below 15% within seconds while the phosphate melts into a glassy film dragging the surface off its ignition point — two sides attacked at once, b beats a in I′=I·(a−b) and intensity decays exponentially.',
    act: () => { phaseIdx = 3; pinPulled = true; pressed = true; aimDeg = 0; flyTo([1.0, 2.2, 6.6], [1.6, 0.9, 0]); } },
  { b: '自由基捕获:干粉的独门绝技', be: 'Radical capture: the powder party trick',
    d: '干粉(磷酸铵盐/碳酸氢钠)受热分解,捕走 H· 与 OH· 两个关键自由基,链式反应的传递步骤被掐断——同一覆盖度下熄火更快;CO₂ 只有窒息+冷却,没有这一手,切到 CO₂ 模式对比熄灭时间。',
    de: 'Dry chemical decomposes in the flame, scavenging the two radicals that carry the chain — H· and OH· — snapping the propagation step, so it knocks the fire down faster at the same coverage; CO₂ only smothers and cools. Switch to CO₂ and compare the knockdown time.',
    act: () => { phaseIdx = 4; flyTo([3.2, 2.8, 6.2], [2.3, 2.0, 0]); } },
  { b: '压力表:绿区才是「随时能用」', be: 'The gauge: green zone means ready',
    d: '压力表是灭火器的体检单:指针落绿区(约 1.0–1.6 MPa)才是备用状态;漏气降压、喷过不充装,指针掉出绿区,灭火器就只剩铁皮价值——每月看一眼表,比火场里发现便宜得多。',
    de: 'The gauge is the extinguisher\'s health check: only with the needle in the green (about 1.0–1.6 MPa) is it ready; a slow leak or an unfired-but-unrecharged unit is scrap iron — glance at it monthly, far cheaper than discovering it in a fire.',
    act: () => { phaseIdx = 5; flyTo([-2.9, 3.1, 3.9], [-2.2, 2.4, 0]); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:火焰强度与氧浓度-时间 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 40, padR = 46, padT = 16, padB = 26;
  const VIEW = 40;
  const t1 = Math.max(simT, VIEW), t0 = t1 - VIEW;
  const xOf = t => padL + clamp((t - t0) / VIEW, 0, 1) * (W - padL - padR);
  const yF = v => (H - padB) - clamp(v, 0, 100) / 100 * (H - padT - padB);
  const yO = v => (H - padB) - clamp(v, 8, 21) / 13 * (H - padT - padB);
  ctx.font = '13px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const v of [0, 50, 100]) {
    ctx.beginPath(); ctx.moveTo(padL, yF(v)); ctx.lineTo(W - padR, yF(v)); ctx.stroke();
    ctx.fillText(String(v), 8, yF(v) + 4);
  }
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = 'rgba(116,220,132,.55)';
  ctx.beginPath(); ctx.moveTo(padL, yO(15)); ctx.lineTo(W - padR, yO(15)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#7bd88f';
  ctx.fillText('O₂ 15%', 8, yO(15) - 4);
  ctx.fillText('火%', 8, padT + 2);
  ctx.fillText('O₂%', W - padR + 4, padT + 2);
  ctx.fillText(`${t0.toFixed(0)}s`, padL, H - padB + 18);
  ctx.fillText('now', W - padR - 22, H - padB + 18);
  if (buf.length > 1) {
    const line = (key, ymap, col, lw) => {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath();
      let started = false;
      for (const p of buf) {
        if (p.t < t0) continue;
        const px = xOf(p.t), py = ymap(p[key]);
        started ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        started = true;
      }
      ctx.stroke();
    };
    line('o2', yO, 'rgba(116,192,252,.85)', 2);
    line('fire', yF, '#ff6b6b', 2.6);
    for (const m of marks) {
      if (m.t < t0) continue;
      ctx.fillStyle = m.k === 'out' ? '#7bd88f' : '#ffa94d';
      ctx.fillText(m.k === 'out' ? '熄灭' : '耗尽', xOf(m.t) + 2, padT + 10);
    }
  }
  ctx.fillStyle = '#ff6b6b';
  ctx.fillText(L('火焰强度', 'intensity'), padL + 8, padT + 26);
  ctx.fillStyle = 'rgba(116,192,252,.95)';
  ctx.fillText(L('局部氧浓度', 'local O₂'), padL + 84, padT + 26);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elAim = document.getElementById('sAim'), elAimVal = document.getElementById('sAimVal');
const elSweep = document.getElementById('sSweep'), elSweepVal = document.getElementById('sSweepVal');
const stP = document.getElementById('stP'), stMed = document.getElementById('stMed'),
  stFire = document.getElementById('stFire'), stT = document.getElementById('stT'),
  stO2 = document.getElementById('stO2'), stPhase = document.getElementById('stPhase');
const formulaEl = document.getElementById('formula');
const btnPin = document.getElementById('btnPin'), btnPress = document.getElementById('btnPress'),
  btnPowder = document.getElementById('btnPowder'), btnCO2 = document.getElementById('btnCO2'),
  btnRelight = document.getElementById('btnRelight'), btnRecharge = document.getElementById('btnRecharge');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elAim.value = aimDeg; elAimVal.textContent = `${aimDeg.toFixed(0)}°`;
  elSweep.value = sweep; elSweepVal.textContent = `${sweep.toFixed(0)}°`;
}
function syncBtns() {
  btnPin.classList.toggle('on', pinPulled);
  btnPress.classList.toggle('on', pressed);
  btnPowder.classList.toggle('on', agent === 'powder');
  btnCO2.classList.toggle('on', agent === 'co2');
}
function phaseName() {
  if (fireOut) return L('火焰熄灭', 'fire out');
  if (mPowder <= 0.02 || P < 0.25e6) return L('药剂耗尽', 'agent spent');
  if (valveOpen()) return L('喷射中', 'discharging');
  if (cov > 0.1) return L('观察火情', 'watching');
  if (pinPulled) return L('已拔销待命', 'pinned & ready');
  return L('待机(销未拔)', 'idle (pin in)');
}
function updateStats() {
  const pMPa = P / 1e6;
  stP.innerHTML = `${pMPa.toFixed(2)}<small> MPa</small>`;
  stP.className = 'v ' + (pMPa >= 1.0 && pMPa <= 1.6 ? 'ok' : pMPa > 0.25 ? 'warn' : 'bad');
  stMed.innerHTML = `${(mPowder / M0 * 100).toFixed(0)}<small> %</small>`;
  stMed.className = 'v ' + (mPowder / M0 > 0.9 ? 'ok' : mPowder > 0.02 ? 'warn' : 'bad');
  stFire.innerHTML = `${(I * 100).toFixed(0)}<small> %</small>`;
  stFire.className = 'v ' + (I > 0.5 ? 'bad' : I > 0.02 ? 'warn' : 'ok');
  stT.innerHTML = `${Tfire.toFixed(0)}<small> °C</small>`;
  stT.className = 'v ' + (Tfire > 400 ? 'bad' : Tfire > 250 ? 'warn' : 'ok');
  stO2.innerHTML = `${O2.toFixed(1)}<small> %</small>`;
  stO2.className = 'v ' + (O2 > 17 ? 'bad' : O2 > 15 ? 'warn' : 'ok');
  stPhase.textContent = phaseName();
}
function updateFormula() {
  const mdot = valveOpen() ? 0.3 * (P / 1e6) * 1.05 : 0;
  const tLeft = mdot > 0.001 ? mPowder / mdot : mPowder > 0 ? M0 / (0.3 * 1.47) : 0;
  const lam = agent === 'powder' ? 0.45 : 1.0;
  const kExt = agent === 'powder' ? 1.3 : 0.9;
  formulaEl.innerHTML = L(
    `<b>驱动气(等温):P = P₀·V_g0/V_g</b> = 1.40×0.0054/${(VG0 + (M0 - mPowder) / RHO).toFixed(4)} = ${(P / 1e6).toFixed(2)} MPa<br>` +
    `<b>质量流量:ṁ = k·P</b> = 0.315×${(P / 1e6).toFixed(2)} = ${mdot.toFixed(2)} kg/s,剩余约 ${tLeft.toFixed(0)} s<br>` +
    `<b>窒息:O₂ = 20.9 − 覆盖×${agent === 'powder' ? '9' : '12'}</b> = ${O2.toFixed(1)}%(燃性下限≈15%)<br>` +
    `<b>熄灭方程:I′ = I·(1.15·f_O₂·λ·f_T − ${kExt}·覆盖)</b>,λ:干粉 ${lam}(断链)/ CO₂ 1.0<br>` +
    `<b>指针绿区 1.0–1.6 MPa</b>:落出即失效,须重充`,
    `<b>Driver gas (isothermal): P = P₀·V_g0/V_g</b> = 1.40×0.0054/${(VG0 + (M0 - mPowder) / RHO).toFixed(4)} = ${(P / 1e6).toFixed(2)} MPa<br>` +
    `<b>Mass flow: ṁ = k·P</b> = 0.315×${(P / 1e6).toFixed(2)} = ${mdot.toFixed(2)} kg/s, about ${tLeft.toFixed(0)} s left<br>` +
    `<b>Smothering: O₂ = 20.9 − coverage×${agent === 'powder' ? '9' : '12'}</b> = ${O2.toFixed(1)}% (limit≈15%)<br>` +
    `<b>Knockdown: I′ = I·(1.15·f_O₂·λ·f_T − ${kExt}·coverage)</b>, λ: powder ${lam} (chain-break) / CO₂ 1.0<br>` +
    `<b>Gauge green 1.0–1.6 MPa</b>: outside it, the unit is dead until recharged`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elAim.addEventListener('input', () => { aimDeg = +elAim.value; syncSliders(); });
elSweep.addEventListener('input', () => { sweep = +elSweep.value; syncSliders(); });
btnPin.addEventListener('click', () => { pullPin(); syncBtns(); });
btnPress.addEventListener('click', () => {
  if (!pinPulled) { notifyT = 2.2; notifyZ = '保险销没拔,压把压不下去'; notifyE = 'pin still in, the handle will not squeeze'; return; }
  pressed = !pressed;
  if (pressed && fireOut) relight();
  syncBtns();
});
btnPowder.addEventListener('click', () => { agent = 'powder'; hornFrost.visible = false; syncBtns(); updateFormula(); });
btnCO2.addEventListener('click', () => { agent = 'co2'; hornFrost.visible = true; syncBtns(); updateFormula(); });
btnRelight.addEventListener('click', () => { relight(); syncAll(); });
btnRecharge.addEventListener('click', () => { recharge(); syncAll(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglTri').addEventListener('change', e => { triOn = e.target.checked; triGroup.visible = triOn; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  const mdot = dt > 0 ? simStep(dt) : 0;
  if (dt > 0) stepParts(dt);
  /* 灭火器布局 */
  layoutContents();
  layoutCloud();
  pinGroup.position.x = 0.12 + pinK * 0.34;
  leverPivot.rotation.z = -squeezeK * 0.42;
  handleM.emissiveIntensity = pressed ? 0.55 : 0.05;
  horn.rotation.y = -aimDeg * Math.PI / 180 * 0.5;
  needle.rotation.z = lerp(2.1, -2.1, clamp(P / 2.5e6, 0, 1));
  /* 火焰 */
  const flick = 0.82 + 0.18 * Math.sin(performance.now() / 47);
  flames.forEach(c => {
    const s = clamp(I * flick * (1 + 0.25 * Math.sin(performance.now() / 61 + c.userData.ph)), 0, 1.3);
    c.scale.set(0.4 + s * 0.8, 0.25 + s * 1.6, 0.4 + s * 0.8);
    c.visible = I > 0.02;
    c.position.y = 0.3 + s * 0.55;
  });
  crate.children.forEach(m => {
    m.material = I > 0.02 ? woodM : charM;
  });
  fireLight.intensity = I * 2.2 * flick;
  /* 三角边亮度 */
  triHeat.material.opacity = 0.15 + 0.85 * clamp((Tfire - 100) / 500, 0, 1);
  triHeat.material.emissiveIntensity = 0.6 * clamp((Tfire - 100) / 500, 0, 1);
  triO2.material.opacity = 0.15 + 0.85 * clamp((O2 - 11) / 10, 0, 1);
  triO2.material.emissiveIntensity = 0.6 * clamp((O2 - 11) / 10, 0, 1);
  triFuel.material.opacity = mPowder > 0.02 ? 0.95 : 0.4;
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  drawParts();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
layoutContents();
layoutCloud();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
</html>
