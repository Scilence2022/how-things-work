<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>缩放仪与平行连杆 · 相似三角形的模拟计算机</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;

  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}

    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;

  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;

  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}

  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play:hover{filter:brightness(1.12)}

  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  #note{margin-top:8px;font-size:11.5px;color:var(--text2);line-height:1.55;border-top:1px dashed var(--panel-border);padding-top:7px}
  #note b{color:var(--text3)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

  <div id="note" data-zh="注：电车主受电弓（pantograph）与本页缩放仪同名不同物——前者是从接触网取流的铰接杆系，后者是纯几何的缩放复制机构，用于制图、雕花机与 CNC 触发式测头。" data-en="Note: a railway pantograph shares the name but is a current-collecting linkage — the drafting pantograph here is a pure-geometry scaling copier used in drafting, engraving machines and CNC touch probes.">注：电车主受电弓（pantograph）与本页缩放仪同名不同物——前者是从接触网取流的铰接杆系，后者是纯几何的缩放复制机构，用于制图、雕花机与 CNC 触发式测头。</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(1.5,8.5,13.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(2.2,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(4,9,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.28);fill.position.set(-6,5,-5);scene.add(fill);

/* ---- 材质（主题可变色） ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const armM=new THREE.MeshStandardMaterial({color:0x6b7280,roughness:0.4,metalness:0.6});
const longM=new THREE.MeshStandardMaterial({color:0x4a7fa5,roughness:0.35,metalness:0.65});
const shortM=new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.4,metalness:0.45});
const hingeM=new THREE.MeshStandardMaterial({color:0x9aa8b5,roughness:0.3,metalness:0.8});
const tplM=new THREE.LineDashedMaterial({color:0x74c0fc,dashSize:0.22,gapSize:0.14,transparent:true,opacity:0.75});
const guideM=new THREE.LineDashedMaterial({color:0xff6b6b,dashSize:0.18,gapSize:0.1,transparent:true,opacity:0.9});
const trTrailM=new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.9});
const penTrailM=new THREE.LineBasicMaterial({color:0xffd43b,transparent:true,opacity:0.95});
const tracerM=new THREE.MeshStandardMaterial({color:0x74dca0,emissive:0x2f9e44,emissiveIntensity:0.7,roughness:0.3});
const penM=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xf08c00,emissiveIntensity:0.8,roughness:0.3});
const PEN_COLORS=[0xffd43b,0x66d9e8,0xff6b6b];

/* ---- 缩放仪几何（可验证的构型） ----
   O 固定枢轴在"短杆1"延长线上：杆件 O—X—W 共线（|OX|=R, |XW|=q）
   长杆1 X—Y（长 p）；短杆2 Y—Z（长 q）；长杆2 W—Z 并延长到 E（|WE|=p+p/k）
   四杆两两平行。取 T_in=距 O 较近的点：Y=T_in，可证 E=(1+1/k)·T_in
   于是 E 恰好落在距 O 较远的那个工作点上：ρ>1 时 E=画笔F=ρD；ρ<1 时 E=描迹针D */
const P_BAR=5.0;                     // 长杆长度（世界单位）
let rho=2.0,k=1.0,R=2.4,q=2.4;       // ρ 缩放比；k=1/(ρ-1) 或 ρ/(1-ρ)；R=kq 枢轴臂
let D=new THREE.Vector2(5.1,0);      // 描迹针
let F=new THREE.Vector2(10.2,0);     // 画笔 F=ρ·D（O 为原点）

function setRho(r){
  if(Math.abs(r-1)<0.05) r=r<1?0.95:1.05;   // ρ=1 退化为纯转动，跳过
  rho=r;
  k=rho>1?1/(rho-1):rho/(1-rho);
  // 可达域约束：所有模板点需满足 |T_in| ∈ [|R-P|, R+P]
  const Dmin=4.05,Dmax=6.15;
  const tmin=(rho<1?rho*Dmin:Dmin),tmax=(rho<1?rho*Dmax:Dmax);
  R=clamp(k*2.4,Math.max(1.2,P_BAR-tmin+0.1),Math.min(P_BAR+tmin-0.1,11));
  q=R/k;
}

/* ---- 场景物件 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(20,0.3,10),groundM);
ground.position.set(2.5,-1.55,0);scene.add(ground);
const mount=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.14,1.35,12),hingeM);
mount.position.set(0,-0.85,0);scene.add(mount);     // O 的立柱
function makeBar(mat,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(1,0.16,0.13),mat);
  m.position.z=z;scene.add(m);return m;
}
const barA=makeBar(armM,0.34),barB=makeBar(longM,0.17),barC=makeBar(shortM,0.34),barD=makeBar(longM,0.17);
const hinges=[0,1,2,3].map(()=>{const m=new THREE.Mesh(new THREE.SphereGeometry(0.11,14,10),hingeM);m.position.z=0.44;scene.add(m);return m;});
const hingeO=new THREE.Mesh(new THREE.SphereGeometry(0.15,16,12),hingeM);hingeO.position.set(0,0,0.44);scene.add(hingeO);
/* 模板：五角星路径（虚线）与直线段 */
let tplCenter=new THREE.Vector2(5.1,0);
const STAR_V=[];for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;STAR_V.push(new THREE.Vector2(1.05*Math.cos(a),1.05*Math.sin(a)));}
let tplPts=[];   // 五角星折线（世界坐标）
const LINE_A=new THREE.Vector2(4.1,-1.0),LINE_B=new THREE.Vector2(5.9,1.3);
function rebuildTemplate(){
  tplPts=[];for(let i=0;i<=5;i++){const v=STAR_V[(i*2)%5];tplPts.push(new THREE.Vector3(tplCenter.x+v.x,tplCenter.y+v.y,0.05));}
  tplLine.geometry.dispose();
  tplLine.geometry=new THREE.BufferGeometry().setFromPoints(tplPts);
  tplLine.computeLineDistances();
  lineLine.geometry.dispose();
  lineLine.geometry=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(LINE_A.x,LINE_A.y,0.05),new THREE.Vector3(LINE_B.x,LINE_B.y,0.05)]);
  lineLine.computeLineDistances();
}
const tplLine=new THREE.Line(new THREE.BufferGeometry(),tplM);scene.add(tplLine);          // 空几何不能先 computeLineDistances（读 position.count），rebuildTemplate() 里补
const lineLine=new THREE.Line(new THREE.BufferGeometry(),tplM.clone());lineLine.visible=false;scene.add(lineLine);
/* 共线辅助虚线 O—D—F */
const guideGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()]);
const guideLine=new THREE.Line(guideGeo,guideM);guideLine.computeLineDistances();guideLine.visible=false;scene.add(guideLine);
/* 轨迹线：预分配缓冲 */
const TRAIL_N=1600;
function makeTrail(mat){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(TRAIL_N*3),3));
  g.setDrawRange(0,0);
  const ln=new THREE.Line(g,mat);scene.add(ln);
  return {ln,n:0,arr:g.attributes.position.array,last:new THREE.Vector2(1e9,1e9)};
}
const trTrail=makeTrail(trailMFactory(0x74c0fc,0.85)),penTrail=makeTrail(penTrailM);
function trailMFactory(c,op){return new THREE.LineBasicMaterial({color:c,transparent:true,opacity:op});}
function pushTrail(t,p){
  if(p.distanceTo(t.last)<0.035)return;
  if(t.n>=TRAIL_N){t.arr.copyWithin(0,(TRAIL_N/2)*3);t.n=TRAIL_N/2;}
  t.arr[t.n*3]=p.x;t.arr[t.n*3+1]=p.y;t.arr[t.n*3+2]=0.06;t.n++;
  t.last.copy(p);t.ln.geometry.setDrawRange(0,t.n);t.ln.geometry.attributes.position.needsUpdate=true;
}
function clearTrails(){for(const t of [trTrail,penTrail]){t.n=0;t.last.set(1e9,1e9);t.ln.geometry.setDrawRange(0,0);}}
/* 针与笔标记 */
const tracerTip=new THREE.Group();
const tCone=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.3,10),tracerM);tCone.rotation.x=Math.PI;tCone.position.y=-0.15;tracerTip.add(tCone);
const tDot=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),tracerM);tDot.position.z=0.12;tracerTip.add(tDot);scene.add(tracerTip);
const penDot=new THREE.Mesh(new THREE.SphereGeometry(0.12,14,10),penM);penDot.position.z=0.3;scene.add(penDot);
const penShaft=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.75,8),hingeM);penShaft.position.z=0.3;scene.add(penShaft);

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('固定枢轴 O','Fixed pivot O'),new THREE.Vector3(0,0.55,0.5),'r');
const lblT=addLabel(()=>L('描迹针','Tracer'),new THREE.Vector3(0,0,0.5),'g',()=>mode!=='pause');
const lblP=addLabel(()=>L('画笔 ρ×','Pencil ρ×'),new THREE.Vector3(0,0,0.5),'o');
const lblTpl=addLabel(()=>L('模板','Template'),new THREE.Vector3(0,0,0.5),'b');

/* ---- 状态 ---- */
let playing=true,labelsOn=true,mode='star',simT=0,traceLen=0;
let pathS=0,speedK=0.8,dirSign=1;      // 模板路径进度（星:段参数；直线:0-1 往复）
let penIdx=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')){const v=clamp(+qs.get('speed'),20,200);document.getElementById('sSpd').value=v;}

/* ---- 机构求解：由 T_in 反解平行四边形 ---- */
const sol={X:new THREE.Vector2(),vhat:new THREE.Vector2(),uhat:new THREE.Vector2(),Y:new THREE.Vector2(),W:new THREE.Vector2(),Z:new THREE.Vector2(),E:new THREE.Vector2()};
function solve(tin){
  const d=Math.max(tin.length(),1e-6);
  const dx=tin.x/d,dy=tin.y/d;
  let a=(R*R+d*d-P_BAR*P_BAR)/(2*d);
  a=clamp(a,-R,R);
  const h=Math.sqrt(Math.max(0,R*R-a*a));
  sol.X.set(a*dx-h*dy,a*dy+h*dx);           // 固定分支，避免杆系翻转
  sol.vhat.copy(sol.X).multiplyScalar(1/R); // 单位向量 O→X
  sol.uhat.set(tin.x-sol.X.x,tin.y-sol.X.y).multiplyScalar(1/P_BAR); // X→Y 单位向量
  sol.Y.copy(tin);
  sol.W.copy(sol.X).addScaledVector(sol.vhat,q);
  sol.Z.copy(sol.Y).addScaledVector(sol.vhat,q);
  sol.E.copy(sol.Z).addScaledVector(sol.uhat,P_BAR/k); // =(1+1/k)·T_in
}
function updateBars(){
  const bar=(m,p1,p2)=>{
    m.position.set((p1.x+p2.x)/2,(p1.y+p2.y)/2,m.position.z);
    m.scale.x=Math.max(p1.distanceTo(p2),0.01);
    m.rotation.z=Math.atan2(p2.y-p1.y,p2.x-p1.x);
  };
  bar(barA,new THREE.Vector2(0,0),sol.W);
  bar(barB,sol.X,sol.Y);
  bar(barC,sol.Y,sol.Z);
  bar(barD,sol.W,sol.E);
  hinges[0].position.set(sol.X.x,sol.X.y,0.44);
  hinges[1].position.set(sol.Y.x,sol.Y.y,0.44);
  hinges[2].position.set(sol.Z.x,sol.Z.y,0.44);
  hinges[3].position.set(sol.W.x,sol.W.y,0.44);
}

/* ---- 模板路径 ---- */
function pathPoint(s){
  if(mode==='star'){
    const seg=Math.floor(s)%5,t=s-Math.floor(s);
    const p1=tplPts[seg%5],p2=tplPts[(seg+1)%5];
    return new THREE.Vector2(p1.x+(p2.x-p1.x)*t,p1.y+(p2.y-p1.y)*t);
  }
  const t=s<0?0:(s>1?1:s);
  return new THREE.Vector2(LINE_A.x+(LINE_B.x-LINE_A.x)*t,LINE_A.y+(LINE_B.y-LINE_A.y)*t);
}
function setMode(m){
  mode=m;pathS=(m==='star')?(pathS%5):0;traceLen=0;
  clearTrails();
  tplLine.visible=m==='star';lineLine.visible=m==='line';
  document.getElementById('btnStar').classList.toggle('on',m==='star');
  document.getElementById('btnLine').classList.toggle('on',m==='line');
  if(m==='line')playing=true,syncPlayBtn();
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'平行四边形杆系：四杆两两平行等长，可整体自由摆动变形',en:'Four bars form a deformable parallelogram, free to flex as a whole'},
 {zh:'固定枢轴 O 在短杆延长线上：O、画笔、描迹针三点永远共线',en:'Fixed pivot O on a short-bar extension keeps O, pencil and tracer collinear'},
 {zh:'相似三角形：OF/OD=ρ 恒定——所有杆长只在两点间定比例',en:'Similar triangles fix OF/OD=ρ at every pose of the linkage'},
 {zh:'描五角星：针贴模板走，笔同步画出 ρ 倍的同位相似图形',en:'Trace the star: the pencil draws a similar copy scaled by ρ in real time'},
 {zh:'反向即放大：ρ<1 时针与笔角色互换，几何完全不变',en:'Swap roles for enlargement: ρ<1 trades tracer and pencil, geometry unchanged'},
 {zh:'应用：制图、雕花机、CNC 触发式测头；电车受电弓同名不同物',en:'Used in drafting, engraving, CNC touch probes; railway pantograph is a namesake'},
];
let activeStep=3;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  guideLine.visible=(i===1||i===2);
  if(i===0){setMode('star');pathS=2.3;playing=false;}
  else if(i===1){playing=false;}
  else if(i===2){playing=false;}
  else if(i===3){setMode('star');pathS=0;playing=true;}
  else if(i===4){document.getElementById('sRho').value=0.5;setRho(0.5);document.getElementById('sRhoVal').textContent='0.5×';setMode('star');pathS=0;playing=true;}
  else {playing=false;}
  syncPlayBtn();
}

/* ---- 读数 ---- */
let vDsm=0,vFsm=0;
const prevD=new THREE.Vector2(5.1,0),prevF=new THREE.Vector2(10.2,0);
function updateStats(){
  document.getElementById('stRho').innerHTML=rho.toFixed(2)+'<small> ×</small>';
  document.getElementById('stOD').innerHTML=D.length().toFixed(2);
  document.getElementById('stOF').innerHTML=F.length().toFixed(2);
  document.getElementById('stLen').innerHTML=(traceLen*10).toFixed(1)+'<small> cm</small>';
}

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });

  buildSteps();
}
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}

/* ---- 事件 ---- */
document.getElementById('sRho').addEventListener('input',e=>{

});
document.getElementById('sAng').addEventListener('input',e=>{

});
document.getElementById('sSpd').addEventListener('input',e=>{

});
document.getElementById('btnStar').addEventListener('click',()=>setMode('star'));
document.getElementById('btnLine').addEventListener('click',()=>setMode('line'));
document.getElementById('btnClear').addEventListener('click',clearTrails);
document.getElementById('btnColor').addEventListener('click',()=>{
  penIdx=(penIdx+1)%PEN_COLORS.length;
  penTrailM.color.setHex(PEN_COLORS[penIdx]);penM.color.setHex(PEN_COLORS[penIdx]);
});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    if(mode==='star'){
      const prev=pathPoint(pathS);
      pathS=(pathS+speedK*1.35*dt)%5;
      D.copy(pathPoint(pathS));
      traceLen+=prev.distanceTo(D);
    }else{
      const prev=pathPoint(pathS);
      pathS+=dirSign*speedK*0.42*dt;
      if(pathS>1){pathS=1;dirSign=-1;}if(pathS<0){pathS=0;dirSign=1;}
      D.copy(pathPoint(pathS));
      traceLen+=prev.distanceTo(D);
    }
    F.set(D.x*rho,D.y*rho);                 // O 为原点：F=ρ·D，共线且比值恒定
  }
  const tin=(rho>=1)?D:F;                   // 距 O 较近者做内顶点 Y
  solve(tin);
  updateBars();
  pushTrail(trTrail,D);pushTrail(penTrail,F);
  tracerTip.position.set(D.x,D.y,0.1);
  penDot.position.set(F.x,F.y,0.42);
  penShaft.position.set(F.x,F.y,0.62);
  lblT.position.set(D.x,D.y,0.62);
  lblP.position.set(F.x,F.y,1.05);
  lblTpl.position.set(tplCenter.x,tplCenter.y+1.45,0.5);
  if(guideLine.visible){
    guideGeo.attributes.position.setXYZ(0,0,0,0.5);
    guideGeo.attributes.position.setXYZ(1,D.x,D.y,0.5);
    guideGeo.attributes.position.setXYZ(2,F.x,F.y,0.5);
    guideGeo.attributes.position.needsUpdate=true;guideLine.computeLineDistances();
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化：预描一小段轨迹，避免首屏空白 ---- */
setRho(2);rebuildTemplate();
{ // 预演：无声推进 1.6 秒的星形路径
  const s0=pathS;let ss=0;
  const p0=pathPoint(0).clone();
  for(let i=0;i<100;i++){
    ss+=1.35*0.016;D.copy(pathPoint(ss%5));
    F.set(D.x*rho,D.y*rho);pushTrail(trTrail,D);pushTrail(penTrail,F);
  }
  pathS=s0;D.copy(p0);F.set(D.x*rho,D.y*rho);traceLen=0;
}
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();applyLang();syncPlayBtn();start();
</script>
