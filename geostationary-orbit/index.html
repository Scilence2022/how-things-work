/* 地面轨迹小窗绘制:经度窗 ±30°(以地面站为中心),纬度窗 ±24°
   另画一条解析的单日星下点曲线(倾斜时即「8」字),运行轨迹点叠加其上 */
function drawTrack(curLon,curLat){
  const W=256,H=160,c=trkCtx,SPAN=10*Math.PI/180,LAT=24*Math.PI/180;
  c.clearRect(0,0,W,H);
  c.fillStyle='rgba(10,16,26,0.92)';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(90,120,160,.35)';c.lineWidth=1;
  for(let d=-10;d<=10;d+=5){const x=(d/10+0.5)*W;c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
  for(let la=-24;la<=24;la+=12){const y=H/2-(la/24)*(H/2-10);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  c.strokeStyle='rgba(127,168,201,.8)';c.beginPath();c.moveTo(0,H/2);c.lineTo(W,H/2);c.stroke();
  c.strokeStyle='rgba(116,192,252,.75)';c.setLineDash([4,3]);
  c.beginPath();c.moveTo(W/2,0);c.lineTo(W/2,H);c.stroke();c.setLineDash([]);
  const yOf=lat=>clamp(H/2-(lat/LAT)*(H/2-10),5,H-5);
  const iR=inc*Math.PI/180,drift=Math.abs(driftOf(alt));
  if(iR>0.008||drift<=45){
    const ns=2*Math.PI/periodOf(alt),dN=ns-2*Math.PI/SID;
    c.strokeStyle='rgba(255,179,92,.55)';c.lineWidth=1.2;c.beginPath();
    let pen=false,lp=null;
    for(let k=0;k<=720;k++){
      const t=k/720*SID,th=ns*t,la=Math.asin(Math.sin(iR)*Math.sin(th));
      const A=wrapPi(Math.atan2(Math.sin(th)*Math.cos(iR),Math.cos(th))-th);
      const dl=wrapPi(A+(ns-2*Math.PI/SID)*t);
      if(lp!==null&&Math.abs(dl-lp)>Math.PI)pen=false;
      lp=dl;
      for(const s of [-2*SPAN,0,2*SPAN]){
        const x=(dl+s)/SPAN*(W/2)+W/2;
        if(x<-4||x>W+4)continue;
        if(!pen){c.moveTo(x,yOf(la));pen=true;}
        c.lineTo(x,yOf(la));
      }
    }
    c.stroke();
  }
  c.strokeStyle='#ffb35c';c.lineWidth=1.8;c.beginPath();
  let pen=false;
  for(let i=1;i<trkN;i++){
    let d0=wrapPi(trkLon[i-1]-stPhi),d1=wrapPi(trkLon[i]-stPhi);
    if(Math.abs(d1-d0)>Math.PI)continue;
    for(const s of [-2*SPAN,0,2*SPAN]){
      const x0=(d0+s)/SPAN*(W/2)+W/2,x1=(d1+s)/SPAN*(W/2)+W/2;
      if(x1<0||x1>W){pen=false;continue;}
      if(!pen){c.moveTo(x0,yOf(trkLat[i-1]));pen=true;}
      c.lineTo(x1,yOf(trkLat[i]));
    }
  }
  c.stroke();
  let dc=wrapPi(curLon-stPhi);
  if(dc>SPAN)dc-=2*SPAN;if(dc<-SPAN)dc+=2*SPAN;
  c.fillStyle='#ff6b6b';c.beginPath();c.arc(dc/SPAN*(W/2)+W/2,yOf(curLat),3.4,0,7);c.fill();
  trkTex.needsUpdate=true;
}

const clock=new THREE.Clock();
let raf=null;
const DOWN=new THREE.Vector3(0,-1,0),beamDir=new THREE.Vector3();
const CAP=1.23096,RAD2=2.05,HALFBEAM=Math.tan(8.55*Math.PI/180);
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simSec+=dts*TSCALE;
  thE+=dts*TSCALE*2*Math.PI/SID;
  thS+=dts*TSCALE*2*Math.PI/periodOf(alt);
  earthSpin.rotation.y=thE;
  /* 卫星(轨道面内)+ 幽灵三星 */
  const R=sceneR(alt);
  satG.position.set(R*Math.cos(thS),0,-R*Math.sin(thS));satG.lookAt(0,0,0);
  satWorld(satW);stationWorld(stW);
  ghosts.forEach((g,i)=>{
    g.position.set(R*Math.cos(thS+(i?1:-1)*2.0944),0,-R*Math.sin(thS+(i?1:-1)*2.0944));
    g.lookAt(0,0,0);
  });
  /* 波束锥+覆盖圈 */
  beams.forEach((b,i)=>{
    if(!b.visible)return;
    satWorld(v1,i?((i===1)?-2.0944:2.0944):0);
    b.position.copy(v1);b.scale.set(v1.length()*HALFBEAM,v1.length()-RE,v1.length()*HALFBEAM);
    beamDir.copy(v1).negate().normalize();b.quaternion.setFromUnitVectors(DOWN,beamDir);
  });
  if(covRing.visible){
    v2.copy(satW).normalize();
    covCapG.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v2);
    const e1=v1.copy(v2).cross(new THREE.Vector3(0,1,0)).normalize(),
          e2=new THREE.Vector3().crossVectors(v2,e1),arr=[];
    for(let k=0;k<=36;k++){const b=k/36*Math.PI*2;
      arr.push((Math.cos(CAP)*v2.x+Math.sin(CAP)*(Math.cos(b)*e1.x+Math.sin(b)*e2.x))*RAD2,
               (Math.cos(CAP)*v2.y+Math.sin(CAP)*(Math.cos(b)*e1.y+Math.sin(b)*e2.y))*RAD2,
               (Math.cos(CAP)*v2.z+Math.sin(CAP)*(Math.cos(b)*e1.z+Math.sin(b)*e2.z))*RAD2);}
    covGeo.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  }
  /* 信号弧 + 下行脉冲 */
  arcCurve.v0.copy(stW).y+=0.25;
  v1.copy(stW).add(satW).multiplyScalar(0.5);
  arcCurve.v1.copy(v1).setLength(Math.max(RE*1.25,v1.length()*1.22));
  arcCurve.v2.copy(satW);
  const pts=[];for(let k=0;k<=32;k++){arcCurve.getPoint(k/32,v1);pts.push(v1.x,v1.y,v1.z);}
  arcGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  pulse.position.copy(arcCurve.getPoint(1-(simSec*0.25)%1,v1));
  /* 地面轨迹:星下点经纬度 */
  const lat=Math.asin(clamp(satW.y/satW.length(),-1,1));
  const lon=wrapPi(Math.atan2(-satW.z,satW.x)-thE);
  if(playing)trkPush(lon,lat);
  drawTrack(lon,lat);
  /* 标尺标记 + 标签 */
  ladMark.position.y=alt*LAD;
  lblSat.position.set(satW.x,satW.y+0.85,satW.z);
  lblBeam.position.copy(satW).multiplyScalar(0.38).add(new THREE.Vector3(0,0.55,0));
  lblStat.element.className='lbl '+(Math.abs(driftOf(alt))<1?'g':'r');
  trkG.lookAt(camera.position);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();setAlt(35786);setInc(0);setBeam(true);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(3);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
