<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伽尔顿板 · 正态从随机里长出来</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d9784a;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b35a31;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe08a; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(178,128,20,.9); color: #9c6f00; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.b { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  .chip.g { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.b { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.g { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(217,120,74,.12); border-color: rgba(217,120,74,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(179,90,49,.10); border-color: rgba(179,90,49,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #reset { grid-column: 2; padding: 7px 10px; font-size: 12px; font-weight: 600;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; cursor: pointer; }
  #reset:hover { border-color: var(--acc); color: var(--acc); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 44px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="伽尔顿板：正态分布不是画出来的，是长出来的" data-en="Galton board: the normal distribution grows, it isn't drawn">伽尔顿板：正态分布不是画出来的，是长出来的</h1>
  <div class="sub" data-zh="每颗钉一次 50/50,谁也预测不了单颗球;但几百颗球落完,钟形自己浮现——中心极限定理 · 3D 交互演示：鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Each peg flips a coin and no one can predict one ball; yet after a few hundred, the bell emerges — the central limit theorem · 3D demo: drag to orbit, scroll to zoom · Space = play/pause">每颗钉一次 50/50,谁也预测不了单颗球;但几百颗球落完,钟形自己浮现——中心极限定理 · 3D 交互演示：鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="已落球" data-en="Balls dropped">已落球</span><span class="v" id="stN">0<small> 颗</small></span>
  <span class="k" data-zh="均值 x̄" data-en="Mean x̄">均值 x̄</span><span class="v" id="stM">—<small> /11 档</small></span>
  <span class="k" data-zh="标准差 σ" data-en="Std σ">标准差 σ</span><span class="v" id="stS">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip b" data-zh="小球(每排一次随机)" data-en="balls (one coin per row)">小球(每排一次随机)</span>
    <span class="chip g" data-zh="理论正态曲线" data-en="theoretical normal">理论正态曲线</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="4" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <button id="reset" data-zh="重置钉板" data-en="Reset board">重置钉板</button>
    <div class="row"><label data-zh="偏心 p" data-en="Bias p">偏心 p</label><input id="p" type="range" min="15" max="85" step="5" value="50"><span class="val" id="pVal">0.50</span></div>
    <div class="row"><label data-zh="进度" data-en="Phase">进度</label><input id="prog" type="range" min="0" max="700" step="5" value="0"><span class="val" id="progVal">0</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCurve" type="checkbox" checked> <span data-zh="理论正态曲线" data-en="Theoretical normal">理论正态曲线</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../radioactive-decay/" data-zh="同族:大数定律(指数版)" data-en="same family: law of large numbers">同族:大数定律(指数版)</a>
    <a href="../random-walk/" data-zh="同族:随机游走,单步无序" data-en="same family: random walk">同族:随机游走,单步无序</a>
    <a href="../monty-hall-bayes/" data-zh="延伸:另一种概率直觉" data-en="related: another probability intuition">延伸:另一种概率直觉</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xeef1f6);
  M.board.color.set(dark ? 0x1b212c : 0xdde3ec);
  M.floor.color.set(dark ? 0x232a36 : 0xcfd7e2);
  M.frame.color.set(dark ? 0x39424f : 0xa7b3c2);
  M.peg.color.set(dark ? 0x9aa7b8 : 0x76839a);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('伽尔顿板 · 正态从随机里长出来', 'Galton Board · the Normal Emerges from Chance');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.8, 3.8, 9.9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 22;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(4, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xbfd4ff, 0.5);
fill.position.set(-4, 4, 7);
scene.add(fill);

/* ---------------- 材质 ---------------- */
const M = {
  board: new THREE.MeshStandardMaterial({ color: 0x1b212c, roughness: 0.9, metalness: 0.05 }),
  floor: new THREE.MeshStandardMaterial({ color: 0x232a36, roughness: 0.85, metalness: 0.05 }),
  frame: new THREE.MeshStandardMaterial({ color: 0x39424f, roughness: 0.6, metalness: 0.2 }),
  peg: new THREE.MeshStandardMaterial({ color: 0x9aa7b8, roughness: 0.3, metalness: 0.75 }),
  bar: new THREE.MeshBasicMaterial({ color: 0x43d17c, transparent: true, opacity: 0.2, depthWrite: false }),
  dash: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  ball: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.32, metalness: 0.05 }),
};

/* ---------------- 板体几何 ---------------- */
const R = 11;                       // 钉板排数 → 12 个档位
const DX = 0.46, DY = 0.40;         // 排/列间距(原 46px/40px ÷100)
const ROW0_Y = 5.30;                // 第一排钉高度
const LEAD = 0.14, SEG = 0.16, DROP = 0.30;   // 漏斗段 / 每排飞行 / 末段落槽(秒)
const CAP = 700;                    // 最多落球数
const CURVE_H = 1.5, CURVE_Z = 0.34;
const rowY = r => ROW0_Y - r * DY;
const binX = j => (j - R / 2) * DX;

const m4 = new THREE.Matrix4();
function box(w, h, d, mat, x, y, z, rz = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.z = rz;
  scene.add(m);
  return m;
}
box(6.1, 7.4, 0.1, M.board, 0, 3.55, -0.33);          // 背板
box(6.0, 0.06, 0.56, M.floor, 0, -0.03, 0);           // 槽底
box(6.4, 0.14, 0.8, M.floor, 0, -0.13, 0);            // 底座
for (let k = -5; k <= 5; k++) box(0.024, 1.14, 0.5, M.frame, k * DX, 0.57, 0);   // 槽隔板
box(0.024, 1.14, 0.5, M.frame, -2.76, 0.57, 0);       // 外侧壁
box(0.024, 1.14, 0.5, M.frame, 2.76, 0.57, 0);
box(0.82, 0.05, 0.34, M.frame, -0.41, 6.09, 0, -0.75);   // 漏斗左壁
box(0.82, 0.05, 0.34, M.frame, 0.41, 6.09, 0, 0.75);     // 漏斗右壁

/* 圆柱钉:三角形阵列,带厚度地立在背板前 */
const pegGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.2, 10);
pegGeo.rotateX(Math.PI / 2);
const pegs = new THREE.InstancedMesh(pegGeo, M.peg, R * (R + 1) / 2);
pegs.frustumCulled = false;
{
  let n = 0;
  for (let r = 0; r < R; r++) for (let j = 0; j <= r; j++) {
    m4.makeTranslation((j - r / 2) * DX, rowY(r), 0);
    pegs.setMatrixAt(n++, m4);
  }
}
scene.add(pegs);

/* ---------------- 槽内绿色直方图条(背板薄片) ---------------- */
const barGeo = new THREE.BoxGeometry(0.40, 1, 0.012);
const bars = [];
for (let j = 0; j <= R; j++) {
  const m = new THREE.Mesh(barGeo, M.bar);
  m.position.set(binX(j), 0, -0.242);
  m.scale.y = 0.001;
  scene.add(m);
  bars.push({ m, h: 0 });
}

/* ---------------- 理论正态 N(μ,σ²) 金色虚线(叠加在槽前) ---------------- */
const DASH_N = 48;
const dashMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.062, 0.016, 0.016), M.dash, DASH_N);
dashMesh.frustumCulled = false;
scene.add(dashMesh);
let p = 0.5;
const cpA = new THREE.Vector3(), cpB = new THREE.Vector3();
function curvePt(j, mu, sg, out) {
  const h = Math.exp(-((j - mu) ** 2) / (2 * sg * sg));
  return out.set((j - R / 2) * DX, 0.05 + CURVE_H * h, CURVE_Z);
}
function buildCurve() {
  const mu = R * p, sg = Math.sqrt(R * p * (1 - p));      // μ = R·p, σ = √(Rp(1-p))
  for (let i = 0; i < DASH_N; i++) {
    curvePt(i / DASH_N * R, mu, sg, cpA);
    curvePt((i + 1) / DASH_N * R, mu, sg, cpB);
    m4.makeRotationZ(Math.atan2(cpB.y - cpA.y, cpB.x - cpA.x));
    m4.setPosition((cpA.x + cpB.x) / 2, (cpA.y + cpB.y) / 2, CURVE_Z);
    dashMesh.setMatrixAt(i, m4);
  }
  dashMesh.instanceMatrix.needsUpdate = true;
  lblCurve.o.position.set(clamp((mu - R / 2) * DX + 0.55, -2.7, 2.7), 1.58, CURVE_Z);
}

/* ---------------- 小球(共享几何体 + InstancedMesh) ---------------- */
const BALL_CAP = CAP + 20;
const PALETTE = ['#4cc9f0', '#f48fb1', '#ffd166', '#7ee2a0', '#cbaee8', '#ff9f43'];
const COLORS = PALETTE.map(c => new THREE.Color(c));
const ballMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.045, 12, 8), M.ball, BALL_CAP);
ballMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(BALL_CAP * 3), 3);
ballMesh.frustumCulled = false;
scene.add(ballMesh);

let playing = true, speed = 1, showLabels = true, showCurve = true;
let balls = [], counts = new Array(R + 1).fill(0), spc = new Array(R + 1).fill(0);
let simT = 0, nextSpawn = 0.2;
let landedTotal = 0, sumX = 0, sumX2 = 0;
let dirtyFrom = 0;
const v3 = new THREE.Vector3();

const colAt = (path, k) => { let c = 0; for (let i = 0; i < k; i++) c += path[i]; return c; };
function slotOf(j, s) {              // 槽内堆叠:每层 4×5 = 20 颗,层层长高
  const layer = (s / 20) | 0, ix = s % 4, iz = ((s / 4) | 0) % 5;
  return new THREE.Vector3(
    binX(j) + (ix - 1.5) * 0.105 + (Math.random() - 0.5) * 0.012,
    0.048 + layer * 0.094 + (Math.random() - 0.5) * 0.010,
    (iz - 2) * 0.092 + (Math.random() - 0.5) * 0.010);
}
function newBall(landed) {
  const path = [...Array(R)].map(() => Math.random() < p ? 1 : -1);
  const col = colAt(path, R), j = (col + R) / 2, s = spc[j]++;
  balls.push({ birth: simT, path, col, j, stackI: s, slot: slotOf(j, s),
    col3: (Math.random() * PALETTE.length) | 0,
    jx: (Math.random() - 0.5) * 0.68, z0: (Math.random() - 0.5) * 0.10,
    zw: Math.random() < 0.5 ? -1 : 1, landed });
}
function spawnBall() { newBall(false); dirtyFrom = balls.length - 1; }
function land(b) {
  b.landed = true;
  counts[b.j]++; landedTotal++;
  sumX += b.col; sumX2 += b.col * b.col;
}
function instantSim(n) {             // 相位跳转:瞬间预落 n 颗
  balls = []; counts.fill(0); spc.fill(0);
  landedTotal = 0; sumX = 0; sumX2 = 0;
  for (let i = 0; i < n; i++) { newBall(true); const b = balls[balls.length - 1];
    counts[b.j]++; landedTotal++; sumX += b.col; sumX2 += b.col * b.col; }
  nextSpawn = simT + 0.07;
  lastN = -1; dirtyFrom = 0;
}
function tick(dt) {
  if (playing && landedTotal < CAP) {
    simT += dt;
    while (simT >= nextSpawn && landedTotal < CAP) { spawnBall(); nextSpawn += 0.07; }
  }
  const total = LEAD + R * SEG + DROP;
  for (const b of balls) if (!b.landed && simT - b.birth >= total) land(b);
}
function ballPos(b, out) {
  if (b.landed) return out.copy(b.slot);
  const age = simT - b.birth;
  if (age <= 0) return out.set(b.jx, 6.30, b.z0);
  const rowEnd = LEAD + R * SEG;
  if (age < LEAD) {                  // 漏斗 → 第一排
    const k = age / LEAD;
    return out.set(lerp(b.jx, 0, k), lerp(6.30, ROW0_Y, k * k), lerp(b.z0, 0, k));
  }
  if (age < rowEnd) {                // 逐排弹跳:每排一次 50/50
    const t = age - LEAD, k = Math.min((t / SEG) | 0, R - 1), kk = (t - k * SEG) / SEG;
    const c0 = colAt(b.path, k), c1 = colAt(b.path, k + 1);
    return out.set(lerp((c0 - k / 2) * DX, (c1 - (k + 1) / 2) * DX, kk),
      lerp(rowY(k), rowY(k + 1), kk * kk) + Math.sin(kk * Math.PI) * 0.03,
      Math.sin(kk * Math.PI) * 0.03 * b.zw);
  }
  const k2 = clamp((age - rowEnd) / DROP, 0, 1);   // 末段:坠入槽内落位
  return out.set(lerp((b.col - R / 2) * DX, b.slot.x, k2),
    lerp(rowY(R), b.slot.y, k2 * k2), lerp(0, b.slot.z, k2));
}
function renderBalls() {
  for (let i = 0; i < balls.length; i++) {
    ballPos(balls[i], v3);
    m4.makeTranslation(v3.x, v3.y, v3.z);
    ballMesh.setMatrixAt(i, m4);
  }
  for (let i = balls.length; i < BALL_CAP; i++) { m4.makeScale(0.0001, 0.0001, 0.0001); ballMesh.setMatrixAt(i, m4); }
  ballMesh.instanceMatrix.needsUpdate = true;
  if (dirtyFrom < balls.length) {
    for (let i = Math.max(dirtyFrom, 0); i < balls.length; i++) ballMesh.setColorAt(i, COLORS[balls[i].col3]);
    ballMesh.instanceColor.needsUpdate = true;
    dirtyFrom = Infinity;
  }
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', vis = null) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  labelRegistry.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return { o };
}
addLabel(() => L('漏斗(球从中间落下)', 'hopper (balls drop center)'), new THREE.Vector3(0, 6.62, 0));
addLabel(() => L('每颗钉 = 一次 50/50', 'each peg = one 50/50'), new THREE.Vector3(-3.1, 4.5, 0));
addLabel(() => L('档位(按落点计数)', 'bins (counted by landing)'), new THREE.Vector3(3.15, 0.55, 0));
const lblCurve = addLabel(() => L('理论正态 N(μ, σ²)', 'theoretical normal N(μ, σ²)'),
  new THREE.Vector3(0, 1.58, CURVE_Z), 'g', () => landedTotal > 25);
addLabel(() => L(`钟心 ≈ 第 ${Math.round(R * p)} 档(μ = R·p)`, `bell center ≈ bin ${Math.round(R * p)} (μ = R·p)`),
  new THREE.Vector3(-2.95, 0.85, 0.2), '', () => landedTotal >= 320);

/* ================= 讲解(按已落球数点亮,点击跳相位) ================= */
const STEPS = [
  { at: 0, b: '每颗钉:一次抛硬币', d: '小球每碰到一颗钉,就 50/50(或 p)弹向左/右——单颗球走哪条路,谁也预测不了。',
    be: 'Each peg: a coin flip', de: 'At every peg the ball bounces left/right 50-50 (or p). No one can predict a single path.' },
  { at: 30, b: '一条路径 = 11 次相加', d: '一颗球最终落进哪格,是 11 次独立随机选择的「和」——随机,但可以被相加。',
    be: 'One path = 11 additions', de: 'Where a ball lands is the sum of 11 independent coin flips — random, yet addable.' },
  { at: 120, b: '中间的塔先长高', d: '落到中间的路径组合数最多,两侧最少——直方图开始鼓出钟形轮廓。',
    be: 'The middle tower rises', de: 'Middle bins collect the most paths, edges the fewest — the histogram bulges into a bell.' },
  { at: 320, b: '中心极限定理', d: '大量独立随机相加,分布趋向正态;p 只会让钟平移/变瘦,不会破坏形状。单次无规律,总体有规律。',
    be: 'Central limit theorem', de: 'Sum enough independent randomness and the distribution tends normal; p only shifts or narrows the bell. Order out of chance.' },
  { at: 650, b: '动手试', d: '拖「偏心 p」看钟平移;按「重置钉板」清空重跑——每次的轮廓都略有不同,但都是同一口钟。',
    be: 'Try it yourself', de: 'Drag the bias p to shift the bell; reset to rerun — every run differs a little, yet it is the same bell.' },
];
function stepIndex() {
  let si = 0;
  STEPS.forEach((s, i) => { if (landedTotal >= s.at) si = i; });
  return si;
}
const stepsEl = document.getElementById('steps');
function buildSteps() {
  stepsEl.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => instantSim(s.at));
    stepsEl.appendChild(li);
  });
  [...stepsEl.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}

/* ================= 统计 ================= */
const stN = document.getElementById('stN'), stM = document.getElementById('stM'), stS = document.getElementById('stS');
let lastN = -1;
function updateStats() {
  if (landedTotal === lastN) return;
  lastN = landedTotal;
  stN.innerHTML = landedTotal + '<small> ' + L('颗', 'balls') + '</small>';
  if (landedTotal > 0) {
    const m_pm = sumX / landedTotal;                       // ±11 记法
    const mean = (m_pm + R) / 2;                           // 换算成 0..11 档位
    const varr = Math.max((sumX2 / landedTotal - m_pm * m_pm) / 4, 0);
    stM.innerHTML = mean.toFixed(1) + '<small> ' + L('/11 档', '/11 bins') + '</small>';
    stS.textContent = Math.sqrt(varr).toFixed(2);
  } else {
    stM.innerHTML = '—<small> ' + L('/11 档', '/11 bins') + '</small>';
    stS.textContent = '—';
  }
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elReset = document.getElementById('reset');
const elP = document.getElementById('p');
const elPVal = document.getElementById('pVal');
const progEl = document.getElementById('prog');
const progVal = document.getElementById('progVal');
const tglLabels = document.getElementById('tglLabels');
const tglCurve = document.getElementById('tglCurve');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elReset.addEventListener('click', () => { simT = 0; nextSpawn = 0.2; instantSim(0); });
elP.addEventListener('input', () => {
  p = parseInt(elP.value, 10) / 100;
  elPVal.textContent = p.toFixed(2);
  buildCurve();
});
let progHeld = false;
progEl.addEventListener('pointerdown', () => { progHeld = true; });
addEventListener('pointerup', () => { progHeld = false; });
progEl.addEventListener('input', () => instantSim(parseInt(progEl.value, 10)));
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglCurve.addEventListener('change', () => { showCurve = tglCurve.checked; });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环(页面隐藏时自动停 rAF) ================= */
let raf = null, lastT = 0, lastStep = -1;
function loop(now) {
  raf = requestAnimationFrame(loop);
  const dt = clamp((now - lastT) / 1000, 0, 0.05);
  lastT = now;
  tick(dt * speed);
  renderBalls();
  const maxC = Math.max(...counts, 1);
  for (let j = 0; j <= R; j++) {           // 绿色直方图条平滑生长
    const bar = bars[j], target = counts[j] / maxC * CURVE_H;
    bar.h += (target - bar.h) * Math.min(1, dt * 6);
    bar.m.scale.y = Math.max(bar.h, 0.001);
    bar.m.position.y = bar.h / 2;
  }
  dashMesh.visible = showCurve && landedTotal > 25;
  updateStats();
  if (!progHeld) { progEl.value = landedTotal; progVal.textContent = landedTotal; }
  for (const r of labelRegistry) {
    r.o.element.textContent = r.text();
    r.o.element.style.display = showLabels && (!r.vis || r.vis()) ? '' : 'none';
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...stepsEl.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { lastT = performance.now(); raf = requestAnimationFrame(loop); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
speed = clamp(qsFloat('speed', 1), 0.2, 4);
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
const p0 = Math.round(clamp(qsFloat('p', 50), 15, 85));
elP.value = p0; p = p0 / 100; elPVal.textContent = p.toFixed(2);
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
if (!qsBool('curve', true)) { tglCurve.checked = false; showCurve = false; }
playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
buildCurve();
instantSim(Math.round(clamp(qsFloat('t', 0), 0, CAP)));
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
</body>
