<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伽尔顿板 · 正态从随机里长出来</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d9784a;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b35a31;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.b { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  .chip.g { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.b { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.g { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: default;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(217,120,74,.12); border-color: rgba(217,120,74,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(179,90,49,.10); border-color: rgba(179,90,49,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #reset { grid-column: 2; padding: 7px 10px; font-size: 12px; font-weight: 600;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; cursor: pointer; }
  #reset:hover { border-color: var(--acc); color: var(--acc); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 44px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="伽尔顿板：正态分布不是画出来的，是长出来的" data-en="Galton board: the normal distribution grows, it isn't drawn">伽尔顿板：正态分布不是画出来的，是长出来的</h1>
  <div class="sub" data-zh="每颗钉一次 50/50,谁也预测不了单颗球;但几百颗球落完,钟形自己浮现——中心极限定理 · 空格播放/暂停" data-en="Each peg flips a coin and no one can predict one ball; yet after a few hundred, the bell emerges — the central limit theorem · Space = play/pause">每颗钉一次 50/50,谁也预测不了单颗球;但几百颗球落完,钟形自己浮现——中心极限定理 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="已落球" data-en="Balls dropped">已落球</span><span class="v" id="stN">0<small> 颗</small></span>
  <span class="k" data-zh="均值 x̄" data-en="Mean x̄">均值 x̄</span><span class="v" id="stM">—<small> /11 档</small></span>
  <span class="k" data-zh="标准差 σ" data-en="Std σ">标准差 σ</span><span class="v" id="stS">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip b" data-zh="小球(每排一次随机)" data-en="balls (one coin per row)">小球(每排一次随机)</span>
    <span class="chip g" data-zh="理论正态曲线" data-en="theoretical normal">理论正态曲线</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="4" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <button id="reset" data-zh="重置钉板" data-en="Reset board">重置钉板</button>
    <div class="row"><label data-zh="偏心 p" data-en="Bias p">偏心 p</label><input id="p" type="range" min="15" max="85" step="5" value="50"><span class="val" id="pVal">0.50</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCurve" type="checkbox" checked> <span data-zh="理论正态曲线" data-en="Theoretical normal">理论正态曲线</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('伽尔顿板 · 正态从随机里长出来', 'Galton Board · the Normal Emerges from Chance');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function dot(x, y, r, color, glow) {
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  circle(x, y, r, color);
  ctx.shadowBlur = 0;
}

/* ================= 常量 ================= */
const R = 11;                      // 钉板排数 → 12 个档位
const CX = 800, TOP = 190, DY = 40, DX = 46;
const FLOOR = TOP + R * DY + 90;   // 桶底
const BALL_R = 9;
const SEG = 0.16;                  // 每排间隔的飞行时长(秒)
const DROP = 0.30;                 // 最后一落
const PALETTE = ['#4cc9f0', '#f48fb1', '#ffd166', '#7ee2a0', '#cbaee8', '#ff9f43'];
let p = 0.5;
let balls = [];                    // {birth, path:[R], col, landed, stackI, colX}
let counts = new Array(R + 1).fill(0);
let simT = 0, nextSpawn = 0.2;
let playing = true, speed = 1;
let showLabels = true, showCurve = true;
let landedTotal = 0, sumX = 0, sumX2 = 0;
const CAP = 700;

/* ================= 讲解(按已落球数点亮) ================= */
const STEPS = [
  { at: 0, b: '每颗钉:一次抛硬币', d: '小球每碰到一颗钉,就 50/50(或 p)弹向左/右——单颗球走哪条路,谁也预测不了。',
    be: 'Each peg: a coin flip', de: 'At every peg the ball bounces left/right 50-50 (or p). No one can predict a single path.' },
  { at: 30, b: '一条路径 = 11 次相加', d: '一颗球最终落进哪格,是 11 次独立随机选择的「和」——随机,但可以被相加。',
    de2: '', be: 'One path = 11 additions', de: 'Where a ball lands is the sum of 11 independent coin flips — random, yet addable.' },
  { at: 120, b: '中间的塔先长高', d: '落到中间的路径组合数最多,两侧最少——直方图开始鼓出钟形轮廓。',
    be: 'The middle tower rises', de: 'Middle bins collect the most paths, edges the fewest — the histogram bulges into a bell.' },
  { at: 320, b: '中心极限定理', d: '大量独立随机相加,分布趋向正态;p 只会让钟平移/变瘦,不会破坏形状。单次无规律,总体有规律。',
    be: 'Central limit theorem', de: 'Sum enough independent randomness and the distribution tends normal; p only shifts or narrows the bell. Order out of chance.' },
  { at: 650, b: '动手试', d: '拖「偏心 p」看钟平移;按「重置钉板」清空重跑——每次的轮廓都略有不同,但都是同一口钟。',
    be: 'Try it yourself', de: 'Drag the bias p to shift the bell; reset to rerun — every run differs a little, yet it is the same bell.' },
];
function stepIndex() {
  let si = 0;
  STEPS.forEach((s, i) => { if (landedTotal >= s.at) si = i; });
  return si;
}

/* ================= 小球生命周期 ================= */
function spawnBall() {
  const path = [...Array(R)].map(() => (Math.random() < p ? 1 : -1));
  balls.push({ birth: simT, path, landed: false, col: 0, stackI: 0, colX: 0 });
}
function colAt(path, k) {          // 走完 k 排后的列偏移(0..k)
  let c = 0;
  for (let i = 0; i < k; i++) c += path[i];
  return c;
}
function tick(dt) {
  if (playing && landedTotal < CAP) {
    simT += dt * speed;
    while (simT >= nextSpawn && landedTotal < CAP) { spawnBall(); nextSpawn += 0.07; }
  }
  for (const b of balls) {
    if (b.landed) continue;
    const age = simT - b.birth;
    const total = R * SEG + DROP;
    if (age >= total) {
      b.landed = true;
      b.col = colAt(b.path, R);
      const adj = (b.col - R / 2) * DX;
      b.colX = CX + adj;
      b.stackI = counts[b.col];
      counts[b.col]++;
      landedTotal++; sumX += b.col; sumX2 += b.col * b.col;
    }
  }
}

/* 位置插值:第 k 排 → 第 k+1 排 */
function ballPos(b) {
  const age = simT - b.birth;
  if (age >= R * SEG + DROP) return null;   // 已落地
  if (age < 0) return null;
  const k = Math.min(Math.floor(age / SEG), R - 1);
  const kk = ss(0, 1, (age - k * SEG) / SEG);
  const c0 = colAt(b.path, k), c1 = colAt(b.path, k + 1);
  const x0 = CX + (c0 - k / 2) * DX, x1 = CX + (c1 - (k + 1) / 2) * DX;
  const y0 = TOP + k * DY, y1 = TOP + (k + 1) * DY;
  return { x: lerp(x0, x1, kk), y: lerp(y0, y1, kk * kk) };
}

/* ================= 绘制 ================= */
function drawBoard(t) {
  // 漏斗
  ctx.strokeStyle = PAL.axis; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(CX - 70, 84); ctx.lineTo(CX - 12, 138); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX + 70, 84); ctx.lineTo(CX + 12, 138); ctx.stroke();
  // 钉
  for (let r = 0; r < R; r++) {
    for (let j = 0; j <= r; j++) {
      const x = CX + (j - r / 2) * DX, y = TOP + r * DY;
      circle(x, y, 4.5, 'rgba(154,167,184,.75)');
    }
  }
  // 桶隔板
  for (let j = 0; j <= R; j++) {
    const x = CX + (j - R / 2) * DX + DX / 2;
    line(x, FLOOR - 130, x, FLOOR, 'rgba(154,167,184,.4)', 2);
  }
  line(CX - (R / 2 + 1) * DX, FLOOR, CX + (R / 2 + 1) * DX, FLOOR, PAL.axis, 2);
  if (showLabels) {
    text(L('漏斗(球从中间落下)', 'hopper'), CX - 90, 66, 12.5, PAL.dim2, 'center');
    text(L('每颗钉 = 一次 50/50', 'each peg = one 50/50'), CX - (R / 2 + 1) * DX - 40, TOP + 2 * DY, 12.5, PAL.dim2, 'center');
    text(L('档位(按落点计数)', 'bins (counted by landing)'), CX + (R / 2 + 1) * DX + 30, FLOOR - 8, 12.5, PAL.dim2, 'center');
  }
}
function drawBalls(t) {
  for (const b of balls) {
    const c = PALETTE[Math.abs(b.col + b.birth * 10 | 0) % PALETTE.length];
    if (b.landed) {
      const y = FLOOR - (b.stackI % 13) * 19 - BALL_R - 2;
      const x = b.colX + Math.floor(b.stackI / 13) * 15 * (b.stackI % 2 ? 1 : -1);
      circle(x, y, BALL_R - 2, c + 'b0');
    } else {
      const pos = ballPos(b);
      if (pos) dot(pos.x, pos.y, BALL_R - 2.5, c, 6);
    }
  }
  void t;
}
function drawHist(t) {
  const maxC = Math.max(...counts, 1);
  for (let j = 0; j <= R; j++) {
    const x = CX + (j - R / 2) * DX;
    const h = counts[j] / maxC * 150;
    ctx.fillStyle = 'rgba(67,209,124,.14)';
    ctx.fillRect(x - DX / 2 + 4, FLOOR - h, DX - 8, h);
  }
  // 理论正态(二项近似):μ = Rp, σ = √(Rp(1-p)),期望根数 = N·P(j)
  if (showCurve && landedTotal > 25) {
    const mu = R * p, sg = Math.sqrt(R * p * (1 - p));
    const expect = j => landedTotal * Math.exp(-((j - mu) ** 2) / (2 * sg * sg)) / (sg * Math.sqrt(2 * Math.PI));
    const maxE = expect(mu);
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.5;
    ctx.setLineDash([7, 5]);
    ctx.beginPath();
    for (let k = 0; k <= 60; k++) {
      const j = k / 60 * R;
      const x = CX + (j - R / 2) * DX;
      const y = FLOOR - expect(j) / maxE * 150;
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    if (showLabels) text(L('理论正态 N(μ, σ²)', 'theoretical normal N(μ, σ²)'), CX + (R / 2 + 1) * DX + 30, FLOOR - 150, 12.5, '#ffd166', 'center', 700);
  }
  void t;
}
function drawNotes(t) {
  if (!showLabels) return;
  if (landedTotal >= 320) {
    const mu = (R * p).toFixed(1);
    text(L(`钟心 ≈ 第 ${Math.round(R * p)} 档(μ = R·p)`, `bell center ≈ bin ${Math.round(R * p)} (μ = R·p)`),
      CX - (R / 2 + 1) * DX - 40, FLOOR - 40, 12.5, PAL.dim, 'center');
  }
}

/* ================= 计数 ================= */
const stN = document.getElementById('stN'), stM = document.getElementById('stM'), stS = document.getElementById('stS');
let lastN = -1;
function updateStats() {
  if (landedTotal === lastN) return;
  lastN = landedTotal;
  stN.innerHTML = landedTotal + '<small> 颗</small>';
  if (landedTotal > 0) {
    const m_pm = sumX / landedTotal;                       // ±11 记法
    const mean = (m_pm + R) / 2;                           // 换算成 0..11 档位
    const varr = Math.max((sumX2 / landedTotal - m_pm * m_pm) / 4, 0);
    stM.innerHTML = mean.toFixed(1) + '<small> /11 档</small>';
    stS.innerHTML = Math.sqrt(varr).toFixed(2);
  } else {
    stM.innerHTML = '—<small> /11 档</small>';
    stS.innerHTML = '—';
  }
}

/* ================= 主绘制 ================= */
function draw(t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawBoard(t);
  drawHist(t);
  drawBalls(t);
  drawNotes(t);
}

/* ================= UI / 主循环 ================= */
let last = performance.now();
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elReset = document.getElementById('reset');
const elP = document.getElementById('p');
const elPVal = document.getElementById('pVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglCurve = document.getElementById('tglCurve');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de || s.de2 || '')}</span>`;
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elReset.addEventListener('click', () => {
  balls = []; counts = new Array(R + 1).fill(0);
  simT = 0; nextSpawn = 0.2; landedTotal = 0; sumX = 0; sumX2 = 0; lastN = -1;
});
elP.addEventListener('input', () => {
  p = parseInt(elP.value, 10) / 100;
  elPVal.textContent = p.toFixed(2);
});
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglCurve.addEventListener('change', () => { showCurve = tglCurve.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  tick(dt);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(simT);
  updateStats();
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
requestAnimationFrame(frame);
</script>
</body>
