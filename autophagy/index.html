<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>细胞自噬 · 细胞如何吃掉自己</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="细胞自噬" data-en="Autophagy">细胞自噬</h1>
  <div class="sub" data-zh="看双层膜像袋子一样一圈圈裹住受损线粒体、与溶酶体对接、货物拆成氨基酸运出；调低营养松开 mTOR 刹车，或看损伤过重时改走凋亡 · 拖动旋转 / 空格运行/暂停" data-en="A double membrane bags a damaged mitochondrion, docks with the lysosome, and the cargo is recycled into amino acids; lower nutrients to release the mTOR brake — or watch apoptosis take over · drag to orbit / Space = run/pause">看双层膜像袋子一样一圈圈裹住受损线粒体、与溶酶体对接、货物拆成氨基酸运出；调低营养松开 mTOR 刹车，或看损伤过重时改走凋亡 · 拖动旋转 / 空格运行/暂停</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <span class="k" data-zh="mTOR 活性" data-en="mTOR activity">mTOR 活性</span><span class="v" id="stMtor">—</span>
  <span class="k" data-zh="包裹进度" data-en="Enclosure">包裹进度</span><span class="v" id="stWrap">—</span>
  <span class="k" data-zh="已回收氨基酸" data-en="Amino acids recycled">已回收氨基酸</span><span class="v" id="stAA">—</span>
  <span class="k" data-zh="命运" data-en="Fate">命运</span><span class="v" id="stFate">—</span>

  <div id="actions">
    <button class="abtn" id="btnDrop" data-zh="投放受损线粒体" data-en="Drop damaged mito.">投放受损线粒体</button>
    <button class="abtn" id="btnStarve" data-zh="饥饿（营养→5）" data-en="Fasting (nutr→5)">饥饿（营养→5）</button>
    <button class="abtn" id="btnRapa" data-zh="雷帕霉素（松刹车）" data-en="Rapamycin (release brake)">雷帕霉素（松刹车）</button>
    <button class="abtn" id="btnApop" data-zh="凋亡对照（损伤 85）" data-en="Apoptosis demo (dmg 85)">凋亡对照（损伤 85）</button>

  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>

    <span data-zh="相关:" data-en="Related:">相关:</span>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---- 工具 ---- */
const qs=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=f=>{f=clamp(f,0,1);return f*f*(3-2*f);};
const lerp=(a,b,f)=>a+(b-a)*f;
const rnd=(a,b)=>a+Math.random()*(b-a);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 / 场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,14,36);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,120);
camera.position.set(-0.4,2.4,13.2); // 左移拉远：投放点/包裹/溶酶体全链入画
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-1.2,-0.6,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=40;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(4,7,6); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-6,4,-4); scene.add(fill);

/* ---- 货物组：受损线粒体 + 双层膜自噬体 ---- */
const cargoG=new THREE.Group(); cargoG.position.set(-5.5,0.3,0); scene.add(cargoG);

/* 线粒体 */
const mitoG=new THREE.Group(); cargoG.add(mitoG);
const mitoMat=new THREE.MeshStandardMaterial({color:0xc4673f,roughness:.5,metalness:.05,
  emissive:0xff2200,emissiveIntensity:0,transparent:true});
const mitoBody=new THREE.Mesh(new THREE.CapsuleGeometry(0.55,1.3,8,18),mitoMat);
mitoBody.rotation.z=Math.PI/2; mitoG.add(mitoBody);
const cristaMat=new THREE.MeshStandardMaterial({color:0xe08b5a,roughness:.6});
for(let i=0;i<3;i++){
  const c=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.06,8,18,Math.PI*1.2),cristaMat);
  c.position.set(-0.45+i*0.45,0,0); c.rotation.y=Math.PI/2; c.rotation.z=0.4; mitoG.add(c);
}
const crackMat=new THREE.MeshStandardMaterial({color:0x3a0d0d,roughness:.9});
const cracks=[];
for(let i=0;i<2;i++){
  const c=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.05,0.05),crackMat);
  c.position.set(-0.3+i*0.6,0.52,0.1); c.rotation.z=(i?-1:1)*0.5; mitoG.add(c); cracks.push(c);
}

/* 双层膜：drawRange 自北极帽向下生长，rotation.x=π 后从底部起囊、向上封口 */
const sphGeo=new THREE.SphereGeometry(1,48,28);
const IDX_TOTAL=sphGeo.index.count;
const shellOut=new THREE.Mesh(sphGeo.clone(),new THREE.MeshStandardMaterial({
  color:0x74c0fc,roughness:.3,metalness:.05,transparent:true,opacity:.34,side:THREE.DoubleSide,depthWrite:false}));
const shellIn=new THREE.Mesh(sphGeo.clone(),new THREE.MeshStandardMaterial({
  color:0xa5d8ff,roughness:.3,transparent:true,opacity:.24,side:THREE.DoubleSide,depthWrite:false}));
shellOut.rotation.x=Math.PI; shellIn.rotation.x=Math.PI;
shellOut.scale.setScalar(1.5); shellIn.scale.setScalar(1.24);
shellOut.visible=shellIn.visible=false;
cargoG.add(shellOut,shellIn);

/* LC3 锚定点（fibonacci 球面分布，按 θ 排序） */
const LC3N=40, lc3Dirs=[];
{ const ga=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<LC3N;i++){
    const y=1-2*(i+0.5)/LC3N, r=Math.sqrt(1-y*y), th=i*ga;
    lc3Dirs.push({v:new THREE.Vector3(r*Math.cos(th),y,r*Math.sin(th)),theta:Math.acos(clamp(y,-1,1))});
  }
  lc3Dirs.sort((a,b)=>a.theta-b.theta);
}
const lc3Mesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.06,8,6),
  new THREE.MeshStandardMaterial({color:0x51cf66,emissive:0x2b8a3e,emissiveIntensity:.5}),LC3N);
lc3Mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
cargoG.add(lc3Mesh);
const zeroM=new THREE.Matrix4().makeScale(0,0,0);
for(let i=0;i<LC3N;i++) lc3Mesh.setMatrixAt(i,zeroM);
const tmpM=new THREE.Matrix4();

/* 溶酶体 */
const LYS=new THREE.Vector3(5.7,-0.2,0);
const lyso=new THREE.Mesh(new THREE.SphereGeometry(1.6,36,26),
  new THREE.MeshStandardMaterial({color:0x845ef7,roughness:.35,transparent:true,opacity:.5}));
lyso.position.copy(LYS); scene.add(lyso);
const lysoCore=new THREE.Mesh(new THREE.SphereGeometry(1.25,24,18),
  new THREE.MeshStandardMaterial({color:0x5f3dc4,roughness:.6,transparent:true,opacity:.4}));
lysoCore.position.copy(LYS); scene.add(lysoCore);
const ENZN=24, enzBase=[];
const enzMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,8,6),
  new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xe67700,emissiveIntensity:.6}),ENZN);
enzMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(enzMesh);
for(let i=0;i<ENZN;i++){
  const v=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(0.1,1.1));
  enzBase.push(v.multiplyScalar(1.15)); enzMesh.setMatrixAt(i,zeroM);
}

/* 氨基酸回收粒子 */
const AAN=60, aaVel=[], aaLife=[];
const aaMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.075,8,6),
  new THREE.MeshStandardMaterial({color:0xffe066,emissive:0xf08c00,emissiveIntensity:.55}),AAN);
aaMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(aaMesh);
for(let i=0;i<AAN;i++){ aaVel.push(new THREE.Vector3()); aaLife.push(0); aaMesh.setMatrixAt(i,zeroM); }
function emitAA(p){
  for(let i=0;i<AAN;i++) if(aaLife[i]<=0){
    aaMesh.setMatrixAt(i,new THREE.Matrix4().setPosition(p));
    aaVel[i].set(rnd(-1.6,0.6),rnd(-0.4,1.2),rnd(-0.8,0.8));
    aaLife[i]=rnd(1.8,2.8); aaCount++; return;
  }
}
/* 细胞色素 c（凋亡） */
const CCN=30, ccVel=[], ccLife=[];
const ccMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.07,8,6),
  new THREE.MeshStandardMaterial({color:0xff4d4d,emissive:0xc92a2a,emissiveIntensity:.8}),CCN);
ccMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(ccMesh);
for(let i=0;i<CCN;i++){ ccVel.push(new THREE.Vector3()); ccLife.push(0); ccMesh.setMatrixAt(i,zeroM); }
function burstCC(p){
  for(let i=0;i<CCN;i++){
    ccMesh.setMatrixAt(i,new THREE.Matrix4().setPosition(p));
    ccVel[i].set(rnd(-1,1),rnd(-0.5,1.4),rnd(-1,1)).normalize().multiplyScalar(rnd(1.5,3.2));
    ccLife[i]=rnd(1.6,2.6);
  }
}

/* mTOR 刹车指示物 */
const mtor=new THREE.Mesh(new THREE.OctahedronGeometry(0.34),
  new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:.5,roughness:.35}));
mtor.position.set(-3.6,2.3,0); scene.add(mtor);
/* ULK1 启动复合物 */
const ulk=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12),
  new THREE.MeshStandardMaterial({color:0x69db7c,emissive:0x2b8a3e,emissiveIntensity:.5}));
ulk.visible=false; cargoG.add(ulk);
/* 融合闪光 */
const fuseFlash=new THREE.Mesh(new THREE.SphereGeometry(0.3,14,10),
  new THREE.MeshBasicMaterial({color:0xffe8cc,transparent:true,opacity:0}));
fuseFlash.position.set(LYS.x-2.9,LYS.y,0); scene.add(fuseFlash);

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('mTORC1 营养刹车','mTORC1 nutrient brake'),
  new THREE.Vector3(0,0.62,0),'r',()=>true,mtor);
addLabel(()=>L('溶酶体 pH≈4.8 · 酸性水解酶','Lysosome pH≈4.8 · acid hydrolases'),
  new THREE.Vector3(0,1.95,0),'b',()=>true,lyso);
addLabel(()=>L('受损线粒体','Damaged mitochondrion'),
  new THREE.Vector3(0,-0.85,0),'r',()=>mitoAlive&&phase<10,mitoG);
addLabel(()=>L('ULK1 启动成核','ULK1 nucleation'),
  new THREE.Vector3(0.2,0.75,0),'g',()=>phase===1,ulk);
addLabel(()=>L('双层膜伸长 · LC3 锚定','Phagophore elongates · LC3 anchored'),
  new THREE.Vector3(0,1.95,0),'b',()=>phase===2||phase===3,cargoG);
addLabel(()=>L('自噬体封口 → 对接溶酶体','Autophagosome seals → docks lysosome'),
  new THREE.Vector3(0,1.95,0),'o',()=>phase===4,cargoG);
addLabel(()=>L('水解：货物 → 氨基酸','Hydrolysis: cargo → amino acids'),
  new THREE.Vector3(0,-2.15,0),'g',()=>phase===5||phase===6,cargoG);
addLabel(()=>L('细胞色素 c 释放 → 凋亡（自杀程序）','Cytochrome c released → apoptosis'),
  new THREE.Vector3(0,2.2,0),'r',()=>phase===10,cargoG);

/* ---- 状态机 ---- */
/* 相位: 0 等待/漂移 · 1 ULK1 成核 · 2 伸长 · 3 封口 · 4 对接 · 5 水解 · 6 回收 · 10 凋亡 */
let phase=0, pt=0, apop=false, apopBurst=false, mitoAlive=true;
let playing=true, nutrient=20, damage=65, rapa=false, aaCount=0, labelsOn=true;
const DUR={1:1.6,2:4.2,3:0.9,4:2.2,5:2.6,6:2.8,10:2.6};
const HOME=new THREE.Vector3(0,0.2,0), SPAWN=new THREE.Vector3(-4.4,0.5,0);
const DOCK=new THREE.Vector3(LYS.x-2.95,LYS.y,0);

function mTORact(){ return rapa?0:nutrient; }

function applyDamageLook(){
  const d=damage/100;
  mitoMat.color.setHex(0xc4673f).lerp(new THREE.Color(0x7a1f1f),d);
  mitoMat.emissiveIntensity=d*0.35;
  cracks.forEach(c=>c.visible=d>0.5);
}
function spawnMito(reset=true){
  mitoAlive=true; apop=false; apopBurst=false; ulk.visible=false;
  cargoG.position.copy(SPAWN); mitoG.scale.setScalar(1);
  shellOut.visible=shellIn.visible=false;
  sphGeoDraw(0); lc3Hide();
  if(reset){ phase=0; pt=0; }
}
function sphGeoDraw(f){
  const n=Math.floor(IDX_TOTAL*clamp(f,0,1)/6)*6;
  shellOut.geometry.setDrawRange(0,n); shellIn.geometry.setDrawRange(0,n);
  shellOut.visible=shellIn.visible=f>0.012;
}
function lc3Hide(){ for(let i=0;i<LC3N;i++) lc3Mesh.setMatrixAt(i,zeroM); lc3Mesh.instanceMatrix.needsUpdate=true; }
function lc3Show(f){
  const thMax=f*Math.PI+0.18;
  for(let i=0;i<LC3N;i++){
    const d=lc3Dirs[i];
    if(d.theta<=thMax&&f>0.03){
      const p=d.v.clone(); p.set(p.x,-p.y,p.z).multiplyScalar(1.64);
      tmpM.makeScale(1,1,1).setPosition(p); lc3Mesh.setMatrixAt(i,tmpM);
    }else lc3Mesh.setMatrixAt(i,zeroM);
  }
  lc3Mesh.instanceMatrix.needsUpdate=true;
}

function update(dt){
  const act=mTORact();
  /* mTOR 指示物 */
  mtor.material.emissiveIntensity=0.25+0.5*(act/100);
  mtor.material.color.setHex(act>30?0xff6b6b:0x868e96);
  mtor.rotation.y+=dt*(0.4+act/60);
  /* 溶酶体酶抖动 */
  const jw=phase===5?3.2:1.1;
  for(let i=0;i<ENZN;i++){
    const b=enzBase[i];
    tmpM.makeScale(1,1,1).setPosition(
      LYS.x+b.x+0.07*Math.sin(simT*jw+i*1.7),
      LYS.y+b.y+0.07*Math.sin(simT*jw*1.3+i*2.3),
      LYS.z+b.z+0.07*Math.sin(simT*jw*0.8+i));
    enzMesh.setMatrixAt(i,tmpM);
  }
  enzMesh.instanceMatrix.needsUpdate=true;
  lyso.scale.setScalar(1+0.015*Math.sin(simT*2.2));
  /* 氨基酸 / 细胞色素 c 粒子 */
  for(let i=0;i<AAN;i++) if(aaLife[i]>0){
    aaLife[i]-=dt;
    const m=new THREE.Matrix4(); aaMesh.getMatrixAt(i,m);
    const p=new THREE.Vector3().setFromMatrixPosition(m);
    p.addScaledVector(aaVel[i],dt); aaVel[i].y-=0.35*dt;
    const s=clamp(aaLife[i]/0.8,0,1);
    tmpM.makeScale(s,s,s).setPosition(p); aaMesh.setMatrixAt(i,tmpM);
  }
  aaMesh.instanceMatrix.needsUpdate=true;
  for(let i=0;i<CCN;i++) if(ccLife[i]>0){
    ccLife[i]-=dt;
    const m=new THREE.Matrix4(); ccMesh.getMatrixAt(i,m);
    const p=new THREE.Vector3().setFromMatrixPosition(m);
    p.addScaledVector(ccVel[i],dt); ccVel[i].multiplyScalar(1-1.2*dt);
    const s=clamp(ccLife[i]/0.8,0,1);
    tmpM.makeScale(s,s,s).setPosition(p); ccMesh.setMatrixAt(i,tmpM);
  }
  ccMesh.instanceMatrix.needsUpdate=true;

  if(!playing) return;
  pt+=dt;
  /* 相位推进 */
  if(phase===0){
    if(!mitoAlive){ if(pt>1.4) spawnMito(); }
    else{
      cargoG.position.lerpVectors(SPAWN,HOME,smooth(pt/1.3));
      if(act<30&&pt>1.6){ phase=1; pt=0; apop=damage>75; ulk.visible=!apop; }
    }
  }else if(phase===1){
    ulk.scale.setScalar(0.4+0.6*smooth(pt/0.7));
    ulk.position.set(-0.9,0.7,0.2);
    if(pt>=DUR[1]){ phase=apop?10:2; pt=0; if(apop)ulk.visible=false; }
  }else if(phase===2){
    sphGeoDraw(smooth(pt/DUR[2])); lc3Show(smooth(pt/DUR[2]));
    if(pt>=DUR[2]){ phase=3; pt=0; }
  }else if(phase===3){
    sphGeoDraw(1); lc3Show(1);
    if(pt>=DUR[3]){ phase=4; pt=0; }
  }else if(phase===4){
    sphGeoDraw(1); lc3Show(1);
    cargoG.position.lerpVectors(HOME,DOCK,smooth(pt/DUR[4]));
    if(pt>=DUR[4]){ phase=5; pt=0; }
  }else if(phase===5){
    sphGeoDraw(1); lc3Show(1);
    mitoG.scale.setScalar(Math.max(0.04,1-smooth(pt/(DUR[5]*0.8))));
    if(pt<0.15) fuseFlash.material.opacity=0.9;
    if(Math.random()<dt*22) emitAA(new THREE.Vector3(LYS.x-2.6+rnd(-0.4,0.4),LYS.y+rnd(-0.3,0.4),rnd(-0.3,0.3)));
    if(pt>=DUR[5]){ phase=6; pt=0; }
  }else if(phase===6){
    sphGeoDraw(1); lc3Show(1);
    if(pt>=DUR[6]){ mitoAlive=false; phase=0; pt=0; sphGeoDraw(0); lc3Hide(); }
  }else if(phase===10){
    mitoG.scale.setScalar(1+0.25*Math.sin(pt*9)*smooth(pt/0.5));
    mitoMat.emissiveIntensity=0.8+0.7*Math.sin(pt*14);
    if(!apopBurst&&pt>0.35){ apopBurst=true; burstCC(cargoG.position); }
    if(pt>=DUR[10]){ mitoAlive=false; phase=0; pt=0; mitoMat.emissiveIntensity=damage/100*0.35; mitoG.scale.setScalar(1); }
  }
  fuseFlash.material.opacity=Math.max(0,fuseFlash.material.opacity-dt*1.4);
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'营养充足 → mTOR 按下刹车，自噬沉默',en:'Fed state: mTOR holds the brake, autophagy stays silent'},
 {zh:'饥饿/运动 → mTOR 失活，ULK1 启动双层膜成核',en:'Fasting/exercise: mTOR off, ULK1 nucleates the phagophore'},
 {zh:'双层膜杯(phagophore)沿货物伸长，LC3 锚定膜上',en:'The phagophore elongates around cargo, LC3 anchored'},
 {zh:'膜沿货物边缘封口：自噬体完成，货物被双层膜隔离',en:'The membrane seals: autophagosome isolates the cargo'},
 {zh:'与溶酶体对接融合，酸性水解酶注入（pH≈4.8）',en:'Fusion with lysosome injects acid hydrolases (pH≈4.8)'},
 {zh:'货物水解为氨基酸，运出回收再利用（糖/蛋白/脂都可再生）',en:'Cargo hydrolyzed to amino acids and recycled'},
 {zh:'修不好走另一条路：损伤过重 → 细胞色素 c 释放 → 凋亡',en:'Beyond repair: cytochrome c release → apoptosis'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>gotoStep(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  activeStep=i; syncSteps(); setPlaying(false);
  spawnMito(false);
  if(i===0){ phase=0; pt=0; }
  else if(i===1){ nutrient=5; document.getElementById('sNut').value=5; document.getElementById('sNutVal').textContent='5'; cargoG.position.copy(HOME); phase=1; pt=0; ulk.visible=true; }
  else if(i===2){ phase=2; pt=1.8; cargoG.position.copy(HOME); sphGeoDraw(smooth(pt/DUR[2])); lc3Show(smooth(pt/DUR[2])); }
  else if(i===3){ phase=3; pt=0.2; cargoG.position.copy(HOME); sphGeoDraw(1); lc3Show(1); }
  else if(i===4){ phase=4; pt=1.1; cargoG.position.copy(HOME); sphGeoDraw(1); lc3Show(1); }
  else if(i===5){ phase=5; pt=1.2; cargoG.position.copy(DOCK); sphGeoDraw(1); lc3Show(1); }
  else if(i===6){ damage=85; document.getElementById('sDmg').value=85; document.getElementById('sDmgVal').textContent='85'; applyDamageLook(); cargoG.position.copy(HOME); phase=1; pt=0; apop=true; ulk.visible=false; }
}

/* ---- 读数 ---- */
function updateStats(){
  const act=mTORact();
  document.getElementById('stMtor').innerHTML=act.toFixed(0)+'<small> %</small>';
  const wrap=phase>=3?100:phase===2?Math.round(smooth(pt/DUR[2])*100):0;
  document.getElementById('stWrap').innerHTML=wrap+'<small> %</small>';
  document.getElementById('stAA').innerHTML=aaCount*3+'<small> 个</small>';
  const fate=phase===10||apop?L('凋亡','Apoptosis'):(phase>=5?L('自噬回收','Recycled'):phase===0&&act>=30?L('刹车中','Braked'):L('自噬','Autophagy'));
  document.getElementById('stFate').textContent=fate;
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}

/* ---- 交互 ---- */
function setPlaying(v){
  playing=v;
  document.getElementById('play').textContent=v?L('暂停','Pause'):L('运行','Run');
}
document.getElementById('btnDrop').addEventListener('click',()=>{spawnMito();});
document.getElementById('btnStarve').addEventListener('click',()=>{
  nutrient=5; document.getElementById('sNut').value=5; document.getElementById('sNutVal').textContent='5';
});
document.getElementById('btnRapa').addEventListener('click',e=>{
  rapa=!rapa; e.currentTarget.classList.toggle('on',rapa);
});
document.getElementById('btnApop').addEventListener('click',()=>{
  damage=85; document.getElementById('sDmg').value=85; document.getElementById('sDmgVal').textContent='85';
  applyDamageLook(); spawnMito(); nutrient=Math.max(nutrient,10);
});
document.getElementById('sNut').addEventListener('input',e=>{
  nutrient=+e.target.value; document.getElementById('sNutVal').textContent=nutrient;
});
document.getElementById('sDmg').addEventListener('input',e=>{
  damage=+e.target.value; document.getElementById('sDmgVal').textContent=damage; applyDamageLook();
});
document.getElementById('play').addEventListener('click',()=>setPlaying(!playing));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
let simT=0;
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  update(dt);
  if(playing){
    // 步骤自动跟随
    let st=0;
    if(phase===10) st=6;
    else if(phase===0) st=0;
    else st=clamp(phase,1,6);
    if(st!==activeStep){ activeStep=st; syncSteps(); }
  }
  acc+=dt; if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis(); if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数 & 启动 ---- */
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
const qsNut=parseFloat(qs.get('nut'));
if(Number.isFinite(qsNut)){nutrient=clamp(qsNut,0,100);document.getElementById('sNut').value=nutrient;document.getElementById('sNutVal').textContent=nutrient.toFixed(0);}
applyDamageLook(); spawnMito(); applyTheme(); applyLang();
if(qs.get('pause')==='1') setPlaying(false);
start();
</script>
