<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #10141b;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: rgba(12,16,23,.78); border: 1px solid rgba(255,255,255,.16);
    color: #e6ecf3; font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.red   { border-color: rgba(230,57,70,.85);  color: #ffb3b9; }
  .lbl.cyan  { border-color: rgba(120,200,255,.85); color: #bfe6ff; }
  .lbl.small { font-size: 10.5px; padding: 3px 7px; opacity: .9; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; }
  #title h1 { font-size: 20px; font-weight: 700; color: #f2f5f9; letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: #9fb0c3; margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 348px;
    background: rgba(13,17,24,.86); border: 1px solid rgba(255,255,255,.09);

    box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #legend { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.red    { color: #ff9aa1; border-color: rgba(239,69,80,.75); }
  .chip.yellow { color: #ffd98a; border-color: rgba(245,184,51,.75); }
  .chip.blue   { color: #a8c6ff; border-color: rgba(63,125,255,.75); }

  #laws { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }

    background: rgba(255,255,255,.05); color: #c7d2de; border: 1px solid rgba(255,255,255,.16); }
  .lawBtn:hover { background: rgba(255,255,255,.1); }
  .lawBtn.on { background: #e63946; border-color: #ff8d96; color: #fff; font-weight: 600; }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: rgba(255,255,255,.05); }
  #steps li.on { background: rgba(230,57,70,.12); border-color: rgba(230,57,70,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: #dfe6ee; }
  #steps li.on .n { background: #e63946; color: #fff; }
  #steps .t { font-size: 12.5px; color: #c7d2de; line-height: 1.45; }
  #steps .t b { color: #f2f5f9; font-size: 12.5px; }
  #steps li.on .t b { color: #ffd7da; }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px;
    background: #e63946; color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { background: #f04b58; }
  input[type=range] { width: 100%; accent-color: #e63946; height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: #9fb0c3; flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: #c7d2de; flex: 0 0 38px; text-align: right; }

    cursor: pointer; }
  #toggles input { accent-color: #e63946; }
  @media (max-width: 760px) { #panel { width: calc(100vw - 36px); } #title h1 { font-size: 16px; } }

  #chart { position: fixed; top: 18px; right: 18px; z-index: 5; width: 452px;
    background: rgba(13,17,24,.86); border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px; padding: 12px 14px 10px; backdrop-filter: blur(6px);
    box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #chartHead { display: flex; justify-content: space-between; align-items: baseline;
    gap: 8px; margin-bottom: 6px; }
  #chartHead .ct { font-size: 13px; font-weight: 600; color: #dfe7f0; }
  #chartHead .cv { font-size: 12px; color: #9fb0c3; font-variant-numeric: tabular-nums;
    white-space: nowrap; }
  #chartSvg { display: block; width: 100%; }
  #chartFoot { display: flex; justify-content: flex-end; margin-top: 4px; }
  #chartFoot label { font-size: 12px; color: #b9c4d0; display: flex; gap: 5px;
    align-items: center; cursor: pointer; }
  #chartFoot input { accent-color: #3f7dff; }
  @media (max-width: 1180px) { #chart { width: 360px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1>凸轮如何推动从动件？—— 从轮廓到位移曲线</h1>
  <div class="sub">3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 滚子中心轨迹 = 理论轮廓，位移线图就是轮廓的"展开图"</div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip red">升程</span>
    <span class="chip yellow">远休</span>
    <span class="chip blue">回程</span>
    <span class="chip gray">近休</span>
    <span class="chip gray">凸轮逆时针 · 360°/周</span>
  </div>
  <div id="laws">
    <span>运动规律</span>
    <button class="lawBtn" data-law="harm">简谐</button>
    <button class="lawBtn" data-law="cyc">摆线</button>
    <button class="lawBtn" data-law="vel">等速</button>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label>速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label>相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> 部件标签</label>
    <label><input id="tglFrame" type="checkbox" checked> 机架·导套</label>
    <label><input id="tglRotate" type="checkbox" checked> 自动环绕</label>
  </div>
</div>

<div id="chart">
  <div id="chartHead">
    <span class="ct">位移线图 s(α) —— 轮廓的"展开图"</span>
    <span class="cv" id="chartVal">α = 0.0° · s = 0.00</span>
  </div>
  <svg id="chartSvg" viewBox="0 0 420 268"></svg>
  <div id="chartFoot">
    <label><input id="tglVel" type="checkbox"> 叠加速度曲线 v(α)（虚线，独立比例）</label>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数（调试/截图用） ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 常量：机构几何 / 时序 / 运动规律 ---------------- */
const D2R = Math.PI / 180;
const R0 = 1.0;            // 基圆半径
const SMAX = 0.6;          // 最大升程
const CAM_T = 0.4;         // 凸轮厚度
const ROLLER_R = 0.18;     // 滚子半径
const CYCLE_SECONDS = 8.0; // 凸轮转一圈的时长（1× 速度）

// 区段（凸轮转角 α）：升程 0–150°，远休 150–200°，回程 200–330°，近休 330–360°
const SEG = [
  { key: 'rise', name: '升',   full: '升程', a0: 0,   a1: 150, three: 0xef4550, css: '#ef4550' },
  { key: 'fdw',  name: '远休', full: '远休', a0: 150, a1: 200, three: 0xf5b833, css: '#f5b833' },
  { key: 'ret',  name: '回',   full: '回程', a0: 200, a1: 330, three: 0x3f7dff, css: '#3f7dff' },
  { key: 'ndw',  name: '近休', full: '近休', a0: 330, a1: 360, three: 0x97a1af, css: '#97a1af' },
];

// 三种运动规律：p 为升/回段内归一化进度
const LAWS = {
  harm: { name: '简谐（无冲击·柔性）', f: p => 0.5 * (1 - Math.cos(Math.PI * p)) },
  cyc:  { name: '摆线（无冲击）',       f: p => p - Math.sin(2 * Math.PI * p) / (2 * Math.PI) },
  vel:  { name: '等速（刚性冲击！）',   f: p => p },
};
let lawKey = ['harm', 'cyc', 'vel'].includes(qs.get('law')) ? qs.get('law') : 'harm';

const wrap360 = a => ((a % 360) + 360) % 360;
function segOf(a) { a = wrap360(a); return a < 150 ? 0 : a < 200 ? 1 : a < 330 ? 2 : 3; }
// 位移 s(α)
function disp(a) {
  a = wrap360(a);
  const f = LAWS[lawKey].f;
  if (a < 150) return SMAX * f(a / 150);
  if (a < 200) return SMAX;
  if (a < 330) return SMAX * (1 - f((a - 200) / 130));
  return 0;
}
// 数值微分求速度 v = ds/dα
function dVdA(a) { const h = 0.5; return (disp(a + h) - disp(a - h)) / (2 * h); }

const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141b);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(3.2, 2.9, 7.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.3, 1.28, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 16;
controls.maxPolarAngle = 1.64;
controls.autoRotateSpeed = 0.7;

/* ---------------- 灯光 ---------------- */
scene.add(new THREE.HemisphereLight(0x9db4d6, 0x35322c, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4.5, 8, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 7;  key.shadow.camera.bottom = -6;
key.shadow.camera.far = 25;
key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

/* ---------------- 材质 ---------------- */
const M = {
  steel:  new THREE.MeshStandardMaterial({ color: 0xc9ced6, metalness: 0.9,  roughness: 0.32 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x525a66, metalness: 0.75, roughness: 0.45 }),
  brass:  new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 0.85, roughness: 0.35 }),
  plate:  new THREE.MeshStandardMaterial({ color: 0xaab2bd, metalness: 0.85, roughness: 0.4 }),
  ghost:  new THREE.MeshStandardMaterial({ color: 0x93a1b5, transparent: true, opacity: 0.13,
            depthWrite: false, side: THREE.DoubleSide, metalness: 0.1, roughness: 0.8 }),
  red:    new THREE.MeshStandardMaterial({ color: 0xe63946, emissive: 0xe63946,
            emissiveIntensity: 0.65, roughness: 0.4, depthTest: false }),
  camFace:new THREE.MeshStandardMaterial({ color: 0x828c9c, metalness: 0.82, roughness: 0.45 }),
  camSide:new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true,
            metalness: 0.72, roughness: 0.42 }),
  thLine: new THREE.LineBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.62 }),
  acLine: new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.26 }),
};

/* ---------------- 固定机架（ghost）+ 凸轮轴 ---------------- */
const frameGrp = new THREE.Group();
scene.add(frameGrp);
function ghostBox(w, h, d, pos) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M.ghost);
  m.position.set(...pos); m.renderOrder = 6;
  frameGrp.add(m); return m;
}
ghostBox(2.1, 2.1, 0.06, [0, 0.2, -0.46]);   // 凸轮背后的机架板
ghostBox(2.7, 0.24, 1.6, [0, -1.95, 0]);     // 底座
ghostBox(0.62, 0.24, 0.68, [0, 3.0, 0]);     // 下导套（固定）
ghostBox(0.62, 0.24, 0.68, [0, 3.55, 0]);    // 上导套（固定）
{ // 弹簧上端固定座（装在机架下导套下面）
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.05, 32), M.dark);
  m.position.set(0, 2.855, 0); frameGrp.add(m);
}
{ // 凸轮轴（固定不转，凸轮绕它旋转）+ 前端轴承盖
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.3, 24), M.dark);
  shaft.rotation.x = Math.PI / 2; shaft.position.z = 0;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.09, 24), M.plate);
  cap.rotation.x = Math.PI / 2; cap.position.z = 0.27;
  frameGrp.add(shaft, cap);
}

/* ---------------- 凸轮（实际轮廓 + 理论轮廓提示线） ---------------- */
const camGroup = new THREE.Group();   // 绕 Z 轴逆时针旋转，α=0 在正上方
scene.add(camGroup);
let camMesh = null, thLoop = null, acLoop = null;

// 理论轮廓（滚子中心轨迹，体坐标系）：与体角 β 处接触的凸轮转角 αc = 90° − β
function pitchRho(betaRad) { return R0 + disp(90 - betaRad / D2R); }

function rebuildCam() {
  for (const o of [camMesh, thLoop, acLoop]) {
    if (o) { o.geometry.dispose(); camGroup.remove(o); }
  }
  const N = 360;
  const th = [], ac = [];
  for (let i = 0; i <= N; i++) {
    const b = i / N * Math.PI * 2;
    const rho = pitchRho(b);
    th.push(new THREE.Vector2(rho * Math.cos(b), rho * Math.sin(b)));
  }
  // 实际轮廓 = 理论轮廓沿法向内缩一个滚子半径（等距曲线，保证滚子严格相切）
  for (let i = 0; i <= N; i++) {
    const p = th[i];
    const p0 = th[Math.max(0, i - 1)], p1 = th[Math.min(N, i + 1)];
    const tx = p1.x - p0.x, ty = p1.y - p0.y;
    const L = Math.hypot(tx, ty) || 1;
    let nx = ty / L, ny = -tx / L;                 // 候选法向
    if (nx * p.x + ny * p.y < 0) { nx = -nx; ny = -ny; }   // 取指向外侧的一支
    ac.push(new THREE.Vector2(p.x - ROLLER_R * nx, p.y - ROLLER_R * ny));
  }
  const shape = new THREE.Shape(ac);
  const g = new THREE.ExtrudeGeometry(shape, { depth: CAM_T, bevelEnabled: false });
  g.translate(0, 0, -CAM_T / 2);
  // 轮缘按区段着色：体角 β 处对应凸轮转角 αc = 90° − β
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const beta = Math.atan2(pos.getY(i), pos.getX(i));
    c.set(SEG[segOf(90 - beta / D2R)].three);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  camMesh = new THREE.Mesh(g, [M.camFace, M.camSide]);
  camMesh.castShadow = camMesh.receiveShadow = true;
  camGroup.add(camMesh);
  // 理论轮廓：半透明细线 ring（滚子中心轨迹）
  const lg = new THREE.BufferGeometry().setFromPoints(th.map(p => v3(p.x, p.y, CAM_T / 2 + 0.03)));
  thLoop = new THREE.LineLoop(lg, M.thLine);
  camGroup.add(thLoop);
  // 实际轮廓前缘描线（弱）
  const ag = new THREE.BufferGeometry().setFromPoints(ac.map(p => v3(p.x, p.y, CAM_T / 2 + 0.03)));
  acLoop = new THREE.LineLoop(ag, M.acLine);
  camGroup.add(acLoop);
}

/* ---------------- 滚子中心高度参考线（近休 / 远休位置） ---------------- */
function refLine(y) {
  const g = new THREE.BufferGeometry().setFromPoints([v3(0, y, 0.3), v3(0, y, 0.95)]);
  const l = new THREE.Line(g, new THREE.LineDashedMaterial({
    color: 0x7d8aa0, transparent: true, opacity: 0.75, dashSize: 0.055, gapSize: 0.04 }));
  l.computeLineDistances();
  scene.add(l);
}
refLine(R0);
refLine(R0 + SMAX);

/* ---------------- 从动件：滚子 + 推杆 + 从动盘 + 追踪点 ---------------- */
const rollerGrp = new THREE.Group();   // 滚子（含追踪点），中心高度 y = R0 + s(α)
scene.add(rollerGrp);
{
  const roller = new THREE.Mesh(new THREE.CylinderGeometry(ROLLER_R, ROLLER_R, CAM_T + 0.05, 40), M.steel);
  roller.rotation.x = Math.PI / 2; roller.castShadow = true;
  const track = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), M.red);  // 追踪点（滚子中心）
  track.renderOrder = 12;
  rollerGrp.add(roller, track);
}
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 2.8, 16), M.steel);   // 推杆
rod.castShadow = true; scene.add(rod);
const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.09, 24), M.dark);  // 弹簧下端挡圈
scene.add(collar);
const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.08, 32), M.plate);   // 从动盘
disc.castShadow = true; scene.add(disc);

/* ---------------- 弹簧（螺旋管，每帧按压缩量重建） ---------------- */
class Helix extends THREE.Curve {
  constructor(y0, y1, r, coils) { super(); this.y0 = y0; this.y1 = y1; this.r = r; this.coils = coils; }
  getPoint(u, target = new THREE.Vector3()) {
    const a = this.coils * 2 * Math.PI * u;
    return target.set(Math.cos(a) * this.r, this.y0 + (this.y1 - this.y0) * u, Math.sin(a) * this.r);
  }
}
const spring = new THREE.Mesh(new THREE.BufferGeometry(), M.brass);
spring.castShadow = true; scene.add(spring);
function rebuildSpring(yBot, yTop) {
  const g = new THREE.TubeGeometry(new Helix(yBot, yTop, 0.155, 7), 260, 0.028, 8, false);
  spring.geometry.dispose();
  spring.geometry = g;
}

/* ---------------- 部件标签 ---------------- */
const labelObjs = [];
function addLabel(text, pos, cls = '') {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.textContent = text;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  labelObjs.push(o);
  return o;
}
addLabel('凸轮（绕固定轴逆时针转动）', v3(-1.15, -2.05, 0.3));
addLabel('实际轮廓', v3(1.78, -0.95, 0.3));
addLabel('理论轮廓（滚子中心轨迹）', v3(1.42, 1.8, 0.3), 'cyan');
addLabel('滚子 · 红点=中心追踪点', v3(-0.95, -0.02, 0.3), 'red');
rollerGrp.add(labelObjs[labelObjs.length - 1]);          // 滚子标签跟随升降
labelObjs[labelObjs.length - 1].position.set(-0.95, -0.02, 0.3);
addLabel('推杆', v3(0.52, 2.5, 0.2));
addLabel('弹簧（保持接触）', v3(-0.78, 2.45, 0.2));
addLabel('导套（固定）', v3(0.88, 3.3, 0.25));
addLabel('从动盘', v3(0.72, 4.15, 0));
addLabel('R₀', v3(0.38, 1.0, 0.95), 'small');
addLabel('R₀+smax', v3(0.38, 1.6, 0.95), 'small');

/* ---------------- 右侧位移线图（SVG HUD） ---------------- */
const CW = 420, CH = 268, ML = 46, MR = 12, MT = 30, MB = 30;
const PW = CW - ML - MR, PH = CH - MT - MB;
const X = a => ML + a / 360 * PW;
const Y = s => MT + PH - s / SMAX * PH;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('chartSvg');
const chartVal = document.getElementById('chartVal');
function el(tag, at, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in at) e.setAttribute(k, at[k]);
  parent.appendChild(e);
  return e;
}
let scanLine, movDot, hDash, dotLbl, velPath, velZero, impGroup;
const curvePaths = [];
function buildChart() {
  const defs = el('defs', {});
  const clip = el('clipPath', { id: 'plotClip' }, defs);
  el('rect', { x: ML, y: MT, width: PW, height: PH }, clip);
  // 区段背景 + 顶部标注
  for (const sg of SEG) {
    el('rect', { x: X(sg.a0), y: MT, width: X(sg.a1) - X(sg.a0), height: PH,
      fill: sg.css, opacity: 0.08 });
    const t = el('text', { x: (X(sg.a0) + X(sg.a1)) / 2, y: MT - 8, fill: sg.css,
      'font-size': 10.5, 'text-anchor': 'middle' });
    t.textContent = sg.name;
  }
  // 网格与坐标
  for (const sv of [0.2, 0.4, 0.6]) {
    el('line', { x1: ML, x2: ML + PW, y1: Y(sv), y2: Y(sv), stroke: '#232b35', 'stroke-width': 1 });
    const t = el('text', { x: ML - 6, y: Y(sv) + 3.5, fill: '#8b96a5', 'font-size': 10, 'text-anchor': 'end' });
    t.textContent = sv.toFixed(1);
  }
  const t0 = el('text', { x: ML - 6, y: Y(0) + 3.5, fill: '#8b96a5', 'font-size': 10, 'text-anchor': 'end' });
  t0.textContent = '0';
  for (const av of [0, 90, 180, 270, 360]) {
    el('line', { x1: X(av), x2: X(av), y1: Y(0), y2: Y(0) + 4, stroke: '#39424f' });
    const t = el('text', { x: X(av), y: Y(0) + 15, fill: '#8b96a5', 'font-size': 10, 'text-anchor': 'middle' });
    t.textContent = av;
  }
  el('line', { x1: ML, x2: ML + PW, y1: Y(0), y2: Y(0), stroke: '#39424f', 'stroke-width': 1.2 });
  el('line', { x1: ML, x2: ML, y1: MT, y2: Y(0), stroke: '#39424f', 'stroke-width': 1.2 });
  const yl = el('text', { x: 8, y: MT + 4, fill: '#9fb0c3', 'font-size': 11 });
  yl.textContent = 's';
  const xl = el('text', { x: ML + PW - 4, y: Y(0) + 27, fill: '#9fb0c3', 'font-size': 11, 'text-anchor': 'end' });
  xl.textContent = 'α(°)';
  // 速度曲线层（虚线，裁剪在绘图区内）
  velZero = el('line', { x1: ML, x2: ML + PW, y1: Y(0), y2: Y(0), stroke: '#4a5561',
    'stroke-width': 1, 'stroke-dasharray': '2 3', visibility: 'hidden' });
  velPath = el('path', { fill: 'none', stroke: '#8fe3c8', 'stroke-width': 1.4,
    'stroke-dasharray': '5 4', 'clip-path': 'url(#plotClip)', visibility: 'hidden' });
  impGroup = el('g', { 'clip-path': 'url(#plotClip)' });
  // 位移曲线（按区段着色）
  for (const sg of SEG) {
    curvePaths.push(el('path', { fill: 'none', stroke: sg.css, 'stroke-width': 2.6, 'stroke-linejoin': 'round' }));
  }
  // 扫描线 / 轮廓顶高虚线 / 动点 / 数值
  hDash = el('line', { x1: ML, x2: ML, y1: Y(0), y2: Y(0), stroke: '#ffffff', opacity: 0.55,
    'stroke-width': 1, 'stroke-dasharray': '4 3' });
  scanLine = el('line', { x1: ML, x2: ML, y1: MT, y2: Y(0), stroke: '#ffffff', opacity: 0.32, 'stroke-width': 1 });
  movDot = el('circle', { cx: ML, cy: Y(0), r: 4.2, fill: '#ffffff', stroke: SEG[0].css, 'stroke-width': 2 });
  dotLbl = el('text', { x: ML + 8, y: Y(0) - 8, fill: '#ffffff', 'font-size': 11,
    'font-weight': 600, 'paint-order': 'stroke', stroke: 'rgba(10,14,20,.85)', 'stroke-width': 3 });
}
buildChart();

function updateImp() {
  impGroup.replaceChildren();
  if (lawKey !== 'vel' || !velOn) return;
  for (const b of [0, 150, 200, 330]) {
    el('line', { x1: X(b), x2: X(b), y1: Y(0) - PH * 0.46, y2: Y(0) + PH * 0.46,
      stroke: '#ff5d66', 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0.9 }, impGroup);
    el('circle', { cx: X(b), cy: Y(0) - PH * 0.46, r: 2.4, fill: '#ff5d66' }, impGroup);
    el('circle', { cx: X(b), cy: Y(0) + PH * 0.46, r: 2.4, fill: '#ff5d66' }, impGroup);
  }
  const w = el('text', { x: X(150) + 6, y: Y(0) - PH * 0.46 + 2, fill: '#ff8d93', 'font-size': 10 }, impGroup);
  w.textContent = '速度突变 → 刚性冲击';
}

function rebuildCurve() {
  for (let si = 0; si < 4; si++) {
    const sg = SEG[si];
    const n = (si === 0 || si === 2) ? 90 : 2;
    let d = '';
    for (let i = 0; i <= n; i++) {
      const a = sg.a0 + (sg.a1 - sg.a0) * i / n;
      d += (i ? 'L' : 'M') + X(a).toFixed(1) + ' ' + Y(disp(a)).toFixed(1);
    }
    curvePaths[si].setAttribute('d', d);
  }
  // 速度曲线（数值微分，独立归一化）
  let vmax = 1e-9;
  const vs = [];
  for (let a = 0; a <= 360; a++) { const v = dVdA(a); vs.push(v); vmax = Math.max(vmax, Math.abs(v)); }
  let d = '';
  vs.forEach((v, i) => {
    const y = Y(0) - v / vmax * PH * 0.46;
    d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + y.toFixed(1);
  });
  velPath.setAttribute('d', d);
  updateImp();
}

function updateChart(alpha, s) {
  const x = X(alpha), y = Y(s);
  scanLine.setAttribute('x1', x); scanLine.setAttribute('x2', x);
  movDot.setAttribute('cx', x); movDot.setAttribute('cy', y);
  hDash.setAttribute('x2', x); hDash.setAttribute('y1', y); hDash.setAttribute('y2', y);
  const flip = x > CW - 84;
  dotLbl.setAttribute('x', flip ? x - 9 : x + 9);
  dotLbl.setAttribute('text-anchor', flip ? 'end' : 'start');
  dotLbl.setAttribute('y', y - 9 < MT + 10 ? y + 17 : y - 9);
  dotLbl.textContent = `s = ${s.toFixed(2)}`;
  chartVal.textContent = `α = ${alpha.toFixed(1)}° · s = ${s.toFixed(2)}`;
}

/* ---------------- 分步讲解 ---------------- */
const STEPS = [
  { t0: 0.8 / 360, n: 1, b: '升程 0–150°',
    d: '轮缘半径从 R₀ 渐增到 R₀+smax，凸轮推滚子上升，推杆顶着从动盘上行，弹簧被压缩。' },
  { t0: 150.8 / 360, n: 2, b: '远休 150–200°',
    d: '轮缘是等半径圆弧（基圆 + smax），从动件停在高处不动——位移曲线在此为水平段。' },
  { t0: 200.8 / 360, n: 3, b: '回程 200–330°',
    d: '轮缘半径逐渐减小，被压缩的弹簧把推杆压回来，从动件下降（弹簧力封闭）。' },
  { t0: 330.8 / 360, n: 4, b: '近休 330–360° · 总结',
    d: '半径最小圆弧，从动件停在最低处。位移曲线就是轮廓的"展开图"；等速规律在区段起止点速度突变（刚性冲击），简谐/摆线速度连续、无冲击。' },
];
function stepIndex(t) {
  const a = wrap360(t * 360);
  return segOf(a);
}

/* ---------------- 状态与 UI ---------------- */
let cycles = qsFloat('t', 0);
let playing = !qsBool('pause', false);
let speed = qsFloat('speed', 1);
let velOn = qsBool('vc', false);

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglFrame = document.getElementById('tglFrame');
const tglRotate = document.getElementById('tglRotate');
const tglVel = document.getElementById('tglVel');

for (const s of STEPS) {
  const li = document.createElement('li');
  li.innerHTML = `<span class="n">${s.n}</span><span class="t"><b>${s.b}</b>　${s.d}</span>`;
  li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0; });
  elSteps.appendChild(li);
}

elPlay.textContent = playing ? '暂停' : '播放';
elPlay.addEventListener('click', () => { playing = !playing; elPlay.textContent = playing ? '暂停' : '播放'; });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglLabels.addEventListener('change', () => { for (const o of labelObjs) o.visible = tglLabels.checked; });
tglFrame.addEventListener('change', () => { frameGrp.visible = tglFrame.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
tglVel.addEventListener('change', () => {
  velOn = tglVel.checked;
  velPath.setAttribute('visibility', velOn ? 'visible' : 'hidden');
  velZero.setAttribute('visibility', velOn ? 'visible' : 'hidden');
  updateImp();
});

function setLaw(k) {
  lawKey = k;
  document.querySelectorAll('.lawBtn').forEach(b => b.classList.toggle('on', b.dataset.law === k));
  rebuildCam();      // 轮廓实时重建
  rebuildCurve();    // 曲线同步重建
}
document.querySelectorAll('.lawBtn').forEach(b => b.addEventListener('click', () => setLaw(b.dataset.law)));

if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
if (!qsBool('frame', true)) { tglFrame.checked = false; tglFrame.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
if (qs.get('front') === '1') {   // 调试机位：正对观众，核对滚子与轮廓贴合
  camera.position.set(0.3, 1.28, 8.6);
  controls.target.set(0.3, 1.28, 0);
}
if (velOn) { tglVel.checked = true; tglVel.dispatchEvent(new Event('change')); }
setLaw(lawKey);

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 每帧更新 ---------------- */
function updateWorld(tFrac) {
  const alpha = wrap360(tFrac * 360);
  const s = disp(alpha);
  const yc = R0 + s;                       // 滚子中心高度 = 理论轮廓向径
  camGroup.rotation.z = alpha * D2R;       // 逆时针
  rollerGrp.position.y = yc;
  rod.position.y = yc + 1.4;
  collar.position.y = yc + 0.5;
  disc.position.y = yc + 2.8;
  rebuildSpring(yc + 0.545, 2.83);         // 上端固定、下端随推杆，升程越大压得越紧
  updateChart(alpha, s);
}

const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing) cycles += dt * speed / CYCLE_SECONDS;
  const t = cycles - Math.floor(cycles);

  updateWorld(t);

  const si = stepIndex(t);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
updateWorld(cycles - Math.floor(cycles));
frame();
</script>
