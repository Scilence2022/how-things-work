<!DOCTYPE html>

<style>
  :root,:root[data-theme="dark"]{

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="格氏试剂 · 极性反转的魔法" data-en="The Grignard Reaction · polarity flipped">格氏试剂 · 极性反转的魔法</h1>
  <div class="sub" data-zh="镁条把电子塞进 C–Br,碳从 δ+ 当场翻成 δ−;碳负端扑向羰基长出 C–C 键,酸解得醇(甲醛→伯/醛→仲/酯→叔);水一滴就报废 · 拖动旋转 / 空格运行/暂停" data-en="Mg pushes electrons into C–Br: carbon flips δ+→δ−; the carbanion pounces on C=O to grow a C–C bond; acid workup gives the alcohol (1°/2°/3° by substrate); one drop of water kills it · drag to orbit / Space = run/pause">镁条把电子塞进 C–Br,碳从 δ+ 当场翻成 δ−;碳负端扑向羰基长出 C–C 键,酸解得醇(甲醛→伯/醛→仲/酯→叔);水一滴就报废 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- 工具 / 主题 / 语言 / URL 参数 ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---------- 渲染器 / 场景 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(0.2,1.1,8.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.2,0.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.2;controls.maxDistance=22;controls.autoRotateSpeed=0.55;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(4,6,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-6,2,-5);scene.add(fill);

/* ---------- 材质 ---------- */
const mC=new THREE.MeshStandardMaterial({color:0x51667c,roughness:0.35,metalness:0.55});
/* 反应碳:颜色随极性翻转 红(δ+)→蓝(δ−) */
const mC2=new THREE.MeshStandardMaterial({color:0xc0392b,roughness:0.35,metalness:0.5,emissive:0xc0392b,emissiveIntensity:0.12});
const mDead=new THREE.MeshStandardMaterial({color:0x6b7280,roughness:0.6,metalness:0.2});
const mO=new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.35,metalness:0.15,emissive:0xff6b6b,emissiveIntensity:0.15});
const mBr=new THREE.MeshStandardMaterial({color:0xa61e4d,roughness:0.35,metalness:0.3});
const mMg=new THREE.MeshStandardMaterial({color:0xb8c4d0,roughness:0.25,metalness:0.9});
const mH=new THREE.MeshStandardMaterial({color:0xe9ecef,roughness:0.5});
const mBond=new THREE.MeshStandardMaterial({color:0x94a3b8,roughness:0.4,metalness:0.35});
/* 会变透明度的键各自独立材质,避免互相覆盖 */
const mTBr=new THREE.MeshStandardMaterial({color:0x94a3b8,roughness:0.4,metalness:0.35,transparent:true,opacity:1});
const mTMg=new THREE.MeshStandardMaterial({color:0x94a3b8,roughness:0.4,metalness:0.35,transparent:true,opacity:0});
const mTOe=new THREE.MeshStandardMaterial({color:0x94a3b8,roughness:0.4,metalness:0.35,transparent:true,opacity:1});
const mNew=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xff922b,emissiveIntensity:0.7,roughness:0.3,transparent:true,opacity:0});
const mNewA=mNew.clone(),mNewB=mNew.clone();
const mPi=()=>new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const mFlash=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
const mElec=new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:1});

/* ---------- 布景 ---------- */
const UP=new THREE.Vector3(0,1,0);
const v1=new THREE.Vector3(),v2=new THREE.Vector3(),vd=new THREE.Vector3(),vp=new THREE.Vector3(),va=new THREE.Vector3(),vb=new THREE.Vector3();
function mkCyl(m,r){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,10),m);}
function seg(mesh,a,b){
  vd.subVectors(b,a);const len=Math.max(vd.length(),0.001);
  mesh.scale.y=len;mesh.position.copy(a).addScaledVector(vd,0.5);
  vd.normalize();mesh.quaternion.setFromUnitVectors(UP,vd);
}
function atom(r,m){return new THREE.Mesh(new THREE.SphereGeometry(r,22,16),m);}
/* 镁条与无水乙醚液面 */
const strip=new THREE.Mesh(new THREE.BoxGeometry(0.5,1.7,0.16),mMg);
strip.position.set(-2.7,-0.15,0);scene.add(strip);
const ether=new THREE.Mesh(new THREE.BoxGeometry(9,0.1,3.2),
  new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.16,roughness:0.1}));
ether.position.set(0,-1.5,0);scene.add(ether);
/* EtBr → 格氏试剂:C1(CH₃)、C2(反应碳,独立材质)、Br、插入的 Mg 原子 */
const C1=atom(0.24,mC),C2=atom(0.24,mC2),Br=atom(0.3,mBr),MgA=atom(0.26,mMg);
const bC12=mkCyl(mBond,0.05),bC2Br=mkCyl(mTBr,0.05),bC2Mg=mkCyl(mTMg,0.05),bMgBr=mkCyl(mTMg,0.05);
const bondCC=mkCyl(mNewA,0.05);scene.add(bondCC);
[C1,C2,Br,MgA,bC12,bC2Br,bC2Mg,bMgBr].forEach(o=>scene.add(o));
MgA.visible=false;
/* SET 电子流两颗 */
const eles=[0,1].map(()=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.06,10,8),mElec);e.visible=false;scene.add(e);return e;});
const flash=new THREE.Mesh(new THREE.SphereGeometry(0.5,18,14),mFlash);
flash.visible=false;scene.add(flash);
let flashT=9;

/* 羰基底物(按底物显隐) */
const carbG=new THREE.Group();scene.add(carbG);
const Cc=atom(0.24,mC),Oc=atom(0.24,mO),H1=atom(0.11,mH),H2=atom(0.11,mH),C3=atom(0.24,mC),Oe=atom(0.2,mO),Cme=atom(0.24,mC);
const bCcO=mkCyl(mBond,0.05),bCcO2=mkCyl(mBond,0.05);          // C=O 双键两根
const bCcH1=mkCyl(mBond,0.035),bCcH2=mkCyl(mBond,0.035),bCcC3=mkCyl(mBond,0.05),bCcOe=mkCyl(mTOe,0.05),bOeCme=mkCyl(mBond,0.045);
const piCO=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.055,8,26),mPi());
[Cc,Oc,H1,H2,C3,Oe,Cme,bCcO,bCcO2,bCcH1,bCcH2,bCcC3,bCcOe,bOeCme,piCO].forEach(o=>carbG.add(o));
/* 酯的第二刀 Et₂ */
const Et2=atom(0.24,mC2);Et2.visible=false;scene.add(Et2);
const bEt2=mkCyl(mNewB,0.05);scene.add(bEt2);
/* 酸解 H⁺ 液滴与 O 上的 H */
const drop=atom(0.12,new THREE.MeshStandardMaterial({color:0xbde9ff,roughness:0.3,emissive:0x74c0fc,emissiveIntensity:0.4}));
drop.visible=false;scene.add(drop);
const hOnO=atom(0.1,mH);hOnO.visible=false;scene.add(hOnO);
/* 事件用分子:水 与 CO₂ */
const wO=atom(0.2,mO),wH1=atom(0.1,mH),wH2=atom(0.1,mH),flyH=atom(0.1,mH);
[wO,wH1,wH2,flyH].forEach(o=>{o.visible=false;scene.add(o);});
const co2C=atom(0.22,mC),co2O1=atom(0.18,mO),co2O2=atom(0.18,mO),bCOe1=mkCyl(mBond,0.04),bCOe2=mkCyl(mBond,0.04);
const bondCO2=mkCyl(mNew,0.05);
[co2C,co2O1,co2O2,bCOe1,bCOe2,bondCO2].forEach(o=>{o.visible=false;scene.add(o);});

/* ---------- 坐标 ---------- */
const P={ // [x,y,z]
 C1r:[-0.7,0.45,0],C2r:[0.1,0.7,0],Brr:[0.9,1.0,0],            // EtBr 反应物
 C1g:[-1.0,0.3,0],C2g:[-0.2,0.5,0],Brg:[1.3,0.55,0],Mgg:[0.55,0.4,0], // Et-Mg-Br
 Cc:[1.9,0.5,0],Oc:[1.9,1.3,0],H1:[1.42,0.08,0],H2:[2.38,0.08,0],
 C3:[2.45,0.05,0],Oe:[2.55,0.2,0],Cme:[3.2,0.42,0],
 Oalk:[2.38,1.62,0.35],                                         // 烷氧 O⁻ 位置
 C2a:[1.34,-0.08,0.2],C1a:[0.6,-0.34,0.1],                      // Et 进攻后落点
 Et2s:[-1.6,-1.2,0.2],Et2e:[2.5,-0.22,0.3]                      // 第二刀 Et 起点/落点
};
const ARR=a=>new THREE.Vector3(a[0],a[1],a[2]);

/* ---------- 标签 ---------- */
const labelReg=[];
function addLabel(fn,pos,cls='',visFn){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,fn,vis:visFn||(()=>true),cls});return o;
}

let activeStep=0;
function stepIndex(){
  if(evtWater)return 2;if(evtCO2)return 6;
  if(stage<0.2)return 0;
  if(stage<0.4)return 1;
  if(stage<0.8)return sub==='ester'&&stage>0.62?5:3;
  if(stage<0.9)return 4;
  return sub==='ester'?5:4;
}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps(true);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(manual){
  const si=manual?activeStep:stepIndex();
  if(!manual)activeStep=si;
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===si));
}

function setSub(s){
  sub=s;

  C3.visible=(s==='cho'||s==='ester');
  Oe.visible=Cme.visible=(s==='ester');
  bCcH1.visible=H1.visible;bCcH2.visible=H2.visible;
  bCcC3.visible=C3.visible;bCcOe.visible=bOeCme.visible=Oe.visible;
  Et2.visible=false;bEt2.visible=false;hOnO.visible=false;drop.visible=false;
  document.querySelectorAll('#actions .abtn').forEach(b=>b.classList.remove('on'));

/* ---------- 统计 ---------- */
function updateStats(){
  let st,pr='—',ncc;
  if(evtWater){st=L('淬灭事件','quench');pr=L('乙烷 + Mg(OH)Br(报废)','ethane + Mg(OH)Br');ncc=0;}
  else if(evtCO2){st=L('增碳事件','carboxylation');pr=L('丙酸(羧酸)','propanoic acid');ncc=1;}
  else{
    st=stage<0.18?L('① 接近镁条','approach'):stage<0.26?L('② SET 电子转移','SET'):
      stage<0.36?L('③ 极性反转·插入','flip & insert'):stage<0.5?L('④ 格氏试剂就绪','reagent ready'):
      stage<0.8?L('⑤ 进攻羰基','attack'):stage<0.9?L('⑥ 酸解','workup'):L('⑦ 完成','done');
    pr=stage>0.9?prodName():'—';
    ncc=stage>0.8?(sub==='ester'?2:1):0;
  }
  document.getElementById('stS').textContent=st;
  const f=flip();
  document.getElementById('stP').innerHTML=evtWater?L('报废','dead'):
    (f<0.5?L('C δ+','C δ+'):f<1?L('翻转中…','flipping…'):L('C δ−','C δ−'));
  document.getElementById('stB').textContent=ncc;
  document.getElementById('stPr').textContent=pr;
}

/* ---------- 每帧姿态 ---------- */
function setP(mesh,x,y,z){mesh.position.set(x,y,z);}
function updateMain(dt){
  const f=flip();
  mC2.color.lerpColors(new THREE.Color(0xc0392b),new THREE.Color(0x1971c2),f);
  mC2.emissive.copy(mC2.color);
  const appr=ss(0.02,0.18,stage),ins=ss(0.26,0.36,stage);
  /* 接近偏移 → 插入后归位 */
  const xo=lerp(0.9,0,appr),yo=lerp(1.25,0,appr);
  const mix=(r,g,k)=>[lerp(r[0]+xo,g[0],k),lerp(r[1]+yo,g[1],k),lerp(r[2],g[2],k)];
  /* 进攻位移(仅 Et 的两个碳) */
  const atk=ss(0.5,0.62,stage);
  const aC2=ARR(P.C2a);
  let pC1,pC2;
  if(stage<0.5){pC1=mix(P.C1r,P.C1g,ins);pC2=mix(P.C2r,P.C2g,ins);}
  else{pC2=[lerp(P.C2g[0],aC2.x,atk),lerp(P.C2g[1],aC2.y,atk),lerp(0,aC2.z,atk)];
       pC1=[lerp(P.C1g[0],P.C1a[0],atk),lerp(P.C1g[1],P.C1a[1],atk),0.1*atk];}
  C1.position.set(...pC1);C2.position.set(...pC2);
  Br.position.set(...mix(P.Brr,P.Brg,ins));
  /* Mg 原子滑入 */
  MgA.visible=stage>0.22;
  MgA.position.set(lerp(-2.45,P.Mgg[0],ins),lerp(0.65,P.Mgg[1],ins),0);
  seg(bC12,C1.position,C2.position);
  bC2Br.material.opacity=1-ss(0.24,0.3,stage);
  if(bC2Br.material.opacity>0.01)seg(bC2Br,C2.position,Br.position);
  const mgBo=ss(0.28,0.34,stage);
  bC2Mg.material.opacity=mgBo;bMgBr.material.opacity=mgBo;
  if(mgBo>0.01){seg(bC2Mg,C2.position,MgA.position);seg(bMgBr,MgA.position,Br.position);}
  /* SET 电子流 */
  const setv=ss(0.18,0.24,stage),setf=1-ss(0.24,0.28,stage);
  eles.forEach((e,i)=>{
    e.visible=setv>0&&setf>0;
    if(e.visible){
      vp.set(lerp(-2.45,C2.position.x,setv)+i*0.15,lerp(0.65,C2.position.y,setv)+i*0.12,0.1);
      e.position.copy(vp);mElec.opacity=setf;
    }
  });
  if(stage>=0.26&&stage<0.3){flash.visible=true;flash.position.copy(C2.position);flash.scale.setScalar(1+ss(0.26,0.3,stage)*2);mFlash.opacity=0.7*(1-ss(0.26,0.3,stage));}
  else flash.visible=false;
  /* 羰基底物 */
  let alk; // 0=π 完好,1=烷氧负离子
  if(sub!=='ester')alk=ss(0.56,0.62,stage);
  else{
    if(stage<0.6)alk=ss(0.56,0.6,stage);
    else if(stage<0.62)alk=1;
    else if(stage<0.66)alk=1-ss(0.62,0.66,stage);
    else if(stage<0.78)alk=0;
    else alk=ss(0.78,0.82,stage);
  }
  Oc.position.set(P.Oc[0]+alk*0.48,P.Oc[1]+alk*0.32,alk*0.35);
  Cc.position.set(...P.Cc);
  seg(bCcO,Cc.position,Oc.position);seg(bCcO2,Cc.position,Oc.position);
  /* 双键两根圆柱错开 */
  vd.subVectors(Oc.position,Cc.position);vp.set(-vd.y,vd.x,0).normalize().multiplyScalar(0.05);
  va.copy(Cc.position).add(vp);vb.copy(Oc.position).add(vp);seg(bCcO,va,vb);
  va.copy(Cc.position).sub(vp);vb.copy(Oc.position).sub(vp);seg(bCcO2,va,vb);
  piCO.position.addVectors(Cc.position,Oc.position).multiplyScalar(0.5);
  piCO.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),vd.normalize());
  piCO.material.opacity=0.5*(1-alk);
  H1.position.set(...P.H1);H2.position.set(...P.H2);C3.position.set(...P.C3);
  seg(bCcH1,Cc.position,H1.position);seg(bCcH2,Cc.position,H2.position);seg(bCcC3,Cc.position,C3.position);
  /* 酯:OMe 离去 + 第二刀 */
  if(sub==='ester'){
    const off=ss(0.62,0.72,stage);
    Oe.position.set(P.Oe[0]+off*0.7,P.Oe[1]-off*0.8,off*0.25);
    Cme.position.set(P.Cme[0]+off*0.7,P.Cme[1]-off*0.8,off*0.25);
    seg(bOeCme,Oe.position,Cme.position);
    bCcOe.material.opacity=1-ss(0.62,0.68,stage);
    if(bCcOe.material.opacity>0.01)seg(bCcOe,Cc.position,Oe.position);
    const a2=ss(0.66,0.78,stage);
    Et2.visible=a2>0;
    if(Et2.visible){
      Et2.position.set(lerp(P.Et2s[0],P.Et2e[0],a2),lerp(P.Et2s[1],P.Et2e[1],a2),lerp(P.Et2s[2],P.Et2e[2],a2));
      bEt2.material.opacity=ss(0.72,0.8,stage);
      if(bEt2.material.opacity>0.01)seg(bEt2,Et2.position,Cc.position);
    }else bEt2.material.opacity=0;
  }
  /* 新 C–C 键(C2–Cc):橙色点亮,一直保留 */
  mNewA.opacity=0.95*(sub==='ester'?ss(0.56,0.62,stage):ss(0.56,0.64,stage));
  if(mNewA.opacity>0.01)seg(bondCC,C2.position,Cc.position);
  /* 酸解:液滴 + O–H */
  const wp=ss(0.82,0.88,stage);
  drop.visible=wp>0&&wp<1&&alk>0.5;
  if(drop.visible)drop.position.set(lerp(1.9,Oc.position.x,wp),lerp(2.6,Oc.position.y,wp),0.2);
  hOnO.visible=wp>=0.99&&alk>0.5;
  if(hOnO.visible)hOnO.position.set(Oc.position.x+0.2,Oc.position.y+0.12,0.1);
  mO.emissiveIntensity=0.15+(hOnO.visible?0.25+0.2*Math.sin(simT*6):0);
  /* 动态标签 */
  lblC2.position.set(C2.position.x,C2.position.y+0.45,C2.position.z);
  lblBr.position.set(Br.position.x,Br.position.y+0.45,Br.position.z);
  lblO.position.set(Oc.position.x,Oc.position.y+0.4,Oc.position.z);
}

/* ---------- 事件:滴水 / CO₂ ---------- */
function startWater(){
  if(evtWater||evtCO2)return;
  playing=false;setPlayLabel();
  stage=0.4; // 回到试剂就绪态
  evtWater={t:0};
  wO.visible=wH1.visible=wH2.visible=true;
  C1.material=mDead;C2.material=mDead;
}
function startCO2(){
  if(evtWater||evtCO2)return;
  playing=false;setPlayLabel();
  stage=0.4;
  evtCO2={t:0};
  co2C.visible=co2O1.visible=co2O2.visible=bCOe1.visible=bCOe2.visible=true;
}
function updateEvents(dt){
  if(evtWater){
    const e=evtWater;e.t+=dt*0.35;
    const fall=ss(0,0.4,e.t);
    wO.position.set(-0.2,lerp(2.9,1.0,fall),0.4);
    wH1.position.set(wO.position.x-0.18,wO.position.y+0.16,0.4);
    wH2.position.set(wO.position.x+0.18,wO.position.y+0.16,0.4);
    const jump=ss(0.45,0.58,e.t);
    flyH.visible=jump>0;
    if(flyH.visible)flyH.position.set(lerp(wO.position.x,C2.position.x,jump),lerp(wO.position.y,C2.position.y,jump),0.4);
    const drift=ss(0.58,0.9,e.t);
    if(drift>0){
      C2.position.set(lerp(P.C2g[0],1.6,drift),lerp(P.C2g[1],2.2,drift),lerp(0,0.5,drift));
      C1.position.set(lerp(P.C1g[0],0.85,drift),lerp(P.C1g[1],2.0,drift),lerp(0,0.5,drift));
      flyH.position.copy(C2.position);
      seg(bC12,C1.position,C2.position);
    }
    const ohm=ss(0.6,0.85,e.t);
    wO.position.set(lerp(-0.2,0.3,ohm),lerp(1.0,1.05,ohm),lerp(0.4,0.15,ohm));
    if(e.t>=1){
      evtWater=null;
      [wO,wH1,wH2,flyH].forEach(o=>o.visible=false);
      C1.material=mC;C2.material=mC2;
      stage=0.4;playing=true;setPlayLabel();
    }
  }
  if(evtCO2){
    const e=evtCO2;e.t+=dt*0.3;
    const fly=ss(0,0.35,e.t);
    co2C.position.set(lerp(3.6,2.3,fly),lerp(2.7,1.4,fly),0.2);
    co2O1.position.set(co2C.position.x-0.5,co2C.position.y,0.2);
    co2O2.position.set(co2C.position.x+0.5,co2C.position.y,0.2);
    seg(bCOe1,co2C.position,co2O1.position);seg(bCOe2,co2C.position,co2O2.position);
    const atk=ss(0.4,0.6,e.t);
    C2.position.set(lerp(P.C2g[0],co2C.position.x-0.5,atk),lerp(P.C2g[1],co2C.position.y-0.4,atk),0.3);
    C1.position.set(C2.position.x-0.75,C2.position.y-0.22,0.2);
    seg(bC12,C1.position,C2.position);
    bondCO2.visible=true;
    bondCO2.material.opacity=ss(0.55,0.65,e.t);
    if(bondCO2.material.opacity>0.01)seg(bondCO2,C2.position,co2C.position);
    const wp=ss(0.75,0.9,e.t);
    drop.visible=wp>0&&wp<1;
    if(drop.visible)drop.position.set(lerp(2.3,co2O2.position.x,wp),lerp(2.8,co2O2.position.y,wp),0.2);
    hOnO.visible=wp>=0.99;
    if(hOnO.visible)hOnO.position.set(co2O2.position.x+0.18,co2O2.position.y+0.14,0.2);
    if(e.t>=1){
      evtCO2=null;mNew.opacity=0;
      [co2C,co2O1,co2O2,bCOe1,bCOe2,drop,hOnO,bondCO2].forEach(o=>o.visible=false);
      C2.position.set(...P.C2g);C1.position.set(...P.C1g);
      stage=0.4;playing=true;setPlayLabel();
    }
  }
}

  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
if(qs.get('labels')==='0'){tglLabels.checked=false;labelsOn=false;}

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing&&!evtWater&&!evtCO2){
    stage+=dt*0.13*speed;
    if(stage>1)stage=1;
  }
  updateMain(dt);
  updateEvents(dt);
  acc+=dt;if(acc>0.1){acc=0;updateStats();syncSteps();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible){
      r.o.element.textContent=r.fn();
      if(r.cls)r.o.element.className='lbl '+r.cls;
    }
  }
  /* 极性标签变色:C δ+ 红 / C δ− 蓝 */
  const f=flip();
  lblC2.element.className='lbl '+(f<0.5?'r':'b');
  lblC2.element.textContent=f<0.5?L('C δ+','C δ+'):f<1?L('翻转中…','flipping…'):L('C δ−(亲核!)','C δ− (nucleophile!)');
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();setSub('hcho');setPlayLabel();
if(document.hidden)stop();else start();
</script>
</body>
</html>
