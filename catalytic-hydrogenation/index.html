<title>催化加氢 · 表面把高墙换成台阶</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(255,224,102,.9);color:#fff3bf}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 340px)}

  #stats .k{font-size:12px;color:var(--text2);align-self:center}

  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}

    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}

  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="催化加氢 · 表面把高墙换成台阶" data-en="Catalytic Hydrogenation · The Surface Trades a Wall for Stairs">催化加氢 · 表面把高墙换成台阶</h1>
  <div class="sub" data-zh="H₂ 本身很懒：直接气相加氢要翻 ≈170 kJ/mol 的高墙；落到 Pt/Ni 表面先解离成吸附 H，烯烃 π 键平躺吸附，两个 H 从金属同侧加上去（顺式加成）—— 看 H₂ 落面分裂的白光瞬间，再滴毒物让一切停摆 · 拖动旋转 / 空格运行/暂停" data-en="H2 is lazy: direct gas-phase hydrogenation faces a ~170 kJ/mol wall; on Pt/Ni it dissociates into adsorbed H, the alkene lies flat, and two H add from the metal side (syn) — watch H2 split in a white flash, then poison the surface · drag to orbit / Space = run/pause">H₂ 本身很懒：直接气相加氢要翻 ≈170 kJ/mol 的高墙；落到 Pt/Ni 表面先解离成吸附 H，烯烃 π 键平躺吸附，两个 H 从金属同侧加上去（顺式加成）—— 看 H₂ 落面分裂的白光瞬间，再滴毒物让一切停摆 · 拖动旋转 / 空格运行/暂停</div>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 催化加氢表面化学（数量级真实）
   - 速率因子：Arrhenius r∝exp[-Ea/R·(1/T-1/T₀)]，取 Ea≈20 kJ/mol（表面步骤）；
     氢压线性加速 H₂ 落面；毒物 CO 占位按 (1-1.6θCO) 折减。
   - 直接气相加氢壁垒 ~170 kJ/mol（无催化剂常温几乎不反应）；
     表面路径：吸附(放热)→H₂解离(~10-15)→逐氢转移(~45)→脱附，最高约 45。
   - 两个 H 从金属同侧转移 = 顺式(syn)加成。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const TAU=Math.PI*2;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(0.5,3.2,6.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=25;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.7));
const key=new THREE.DirectionalLight(0xfff2dd,1.15);key.position.set(4,7,5);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.35);fill.position.set(-5,4,-5);scene.add(fill);

/* ---- 材质 ---- */
const mSlab=new THREE.MeshStandardMaterial({color:0x37414d,roughness:0.55,metalness:0.6});
const mPt=new THREE.MeshStandardMaterial({color:0xc3ccd6,roughness:0.3,metalness:0.9});
const mNi=new THREE.MeshStandardMaterial({color:0xb3a99a,roughness:0.35,metalness:0.85});
const mH=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xbcd4ee,emissiveIntensity:0.85,roughness:0.2});
const mC=new THREE.MeshStandardMaterial({color:0x2f353c,roughness:0.35,metalness:0.3});
const mCO=new THREE.MeshStandardMaterial({color:0x555f6a,roughness:0.4,metalness:0.4});
const mOO=new THREE.MeshStandardMaterial({color:0xe8590c,roughness:0.35,metalness:0.2});
const mBond=new THREE.MeshStandardMaterial({color:0x9aa3ad,roughness:0.4,metalness:0.3});
const mGround=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const mFlash=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,side:THREE.DoubleSide});

/* ---- 表面 ---- */
const NX=8,NZ=5,SP=0.78,SITEY=0.16;
const sites=[];
const metalMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.24,16,12),mPt,NX*NZ);
{
  const m4=new THREE.Matrix4();
  let i=0;
  for(let ix=0;ix<NX;ix++)for(let iz=0;iz<NZ;iz++){
    const x=(ix-(NX-1)/2)*SP,z=(iz-(NZ-1)/2)*SP;
    sites.push({x,z,free:true});
    m4.makeTranslation(x,SITEY-0.1,z);
    metalMesh.setMatrixAt(i++,m4);
  }
}
scene.add(metalMesh);
const slab=new THREE.Mesh(new THREE.BoxGeometry(NX*SP+0.9,0.3,NZ*SP+0.9),mSlab);
slab.position.y=-0.18;scene.add(slab);
const ground=new THREE.Mesh(new THREE.BoxGeometry(14,0.1,10),mGround);
ground.position.set(0,-0.4,0);scene.add(ground);
/* 吸附 H 池（实例未用满 → 全部先置零缩放） */
const HP=26;
const hMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.1,10,8),mH,HP);
hMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const zeroM=new THREE.Matrix4().makeScale(0,0,0),tmpM=new THREE.Matrix4();
for(let i=0;i<HP;i++)hMesh.setMatrixAt(i,zeroM);
scene.add(hMesh);
hMesh.frustumCulled=false;
/* 解离闪光 */
const flash=new THREE.Mesh(new THREE.RingGeometry(0.3,0.4,28),mFlash);
flash.rotation.x=-Math.PI/2;scene.add(flash);
let flashT=0;

/* ---- H₂ / 烯烃 / CO ---- */
function makeH2(){
  const g=new THREE.Group();
  const s1=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,8),mH);
  const s2=s1.clone();s1.position.x=-0.17;s2.position.x=0.17;
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.22,8),mBond);
  b.rotation.z=Math.PI/2;g.add(s1,s2,b);g.visible=false;scene.add(g);
  return g;
}
const h2=makeH2();
/* 乙烯：平面分子（局部 xy 平面，之后放倒） */
const ethG=new THREE.Group();
{
  const c1=new THREE.Mesh(new THREE.SphereGeometry(0.2,14,12),mC);
  const c2=c1.clone();c1.position.set(-0.3,0,0);c2.position.set(0.3,0,0);
  const hh=[[-0.66,0.24],[-0.66,-0.24],[0.66,0.24],[0.66,-0.24]].map(p=>{
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8),mH);s.position.set(p[0],p[1],0);return s;});
  const bb=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.42,8),mBond);
  bb.rotation.z=Math.PI/2;
  ethG.add(c1,c2,bb,...hh);
  ethG.rotation.x=-Math.PI/2;        // 放倒成水平
  ethG.visible=false;scene.add(ethG);
}
/* CO 毒物 */
const coList=[];
function addCO(){
  const free=sites.filter(s=>s.free);
  if(!free.length||coList.length>=18)return;
  const s=free[Math.floor(Math.random()*free.length)];
  s.free=false;
  const g=new THREE.Group();
  const c=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,8),mCO);
  const o=new THREE.Mesh(new THREE.SphereGeometry(0.12,10,8),mOO);
  c.position.set(0,0,0);o.position.set(0,0.24,0);
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.24,8),mBond);
  g.add(c,o,b);
  g.position.set(s.x,SITEY+0.22,s.z);
  g.userData.site=s;g.scale.setScalar(0.01);
  scene.add(g);coList.push(g);
}
function removeCO(){
  if(!coList.length)return;
  const g=coList.pop();
  g.userData.site.free=true;
  scene.remove(g);
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn,parent){
  const div=document.createElement('div');div.className='lbl '+(cls||'');
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||scene).add(o);
  labelReg.push({o,text:textFn,vis:visFn||(()=>true)});div.textContent=textFn();return o;
}
addLabel(()=>L('Pt / Ni 表面： 提供「位点」','Pt/Ni surface: provides sites'),new THREE.Vector3(0,0.62,1.7),'b');
addLabel(()=>L('H₂ 落面 → 解离成 2 个吸附 H','H2 lands → splits into 2 adsorbed H'),new THREE.Vector3(0,2.6,0),'y',()=>stage<=3);
addLabel(()=>L('烯烃 π 键平躺吸附 → 双 C 各占一位','Alkene π lies flat, one C per site'),new THREE.Vector3(0,2.6,0),'g',()=>stage>=4&&stage<=8);
addLabel(()=>L('同侧转移 = 顺式加成','Same-side transfer = syn addition'),new THREE.Vector3(0,2.2,0),'o',()=>stage===7||stage===8);
addLabel(()=>L('CO 占住位点 → 中毒停摆','CO blocks sites → poisoned'),new THREE.Vector3(0,2.2,0),'r',()=>coList.length>6);

/* ---- 状态 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let Tk=320,pBar=1.0,speedK=1,mat='Pt',poisonOn=false,autoLoop=true;
let stage=0,stageT=0,simT=0,hAds=0,doneN=0,flashStage=-1;
let pair=null,hPos=[null,null];   // 本轮使用的两个位点
const events=[];
const coAcc={t:0};
function arr(){return Math.exp(-20000/8.314*(1/Tk-1/320));}
function rateF(){
  const thCO=coList.length/sites.length;
  return clamp(pBar*arr()*(mat==='Pt'?1:0.8)*Math.max(0.05,1-1.6*thCO),0.05,4);
}
function pickPair(){
  for(let t=0;t<40;t++){
    const s=sites[Math.floor(Math.random()*sites.length)];
    const ix=sites.indexOf(s);
    const cand=[ix+1,ix-1,ix+NX,ix-NX].filter(i=>i>=0&&i<sites.length&&
      !(ix%NX===NX-1&&i===ix+1)&&!(ix%NX===0&&i===ix-1));
    const s2s=cand.map(i=>sites[i]).filter(q=>q.free);
    if(s.free&&s2s.length){
      const s2=s2s[Math.floor(Math.random()*s2s.length)];
      s.free=false;s2.free=false;
      pair=[s,s2];return;
    }
  }
  pair=null;
}
function releasePair(){if(pair){pair[0].free=true;pair[1].free=true;pair=null;}}
function stageDur(i){
  const r=rateF();
  const D=[1.7,0.9,0.8/r,0.7,1.6,1.0,0.6,0.9/r,0.9/r,1.1];
  return D[i];
}
function advance(){
  if(stage===0&&!pair){pickPair();if(!pair){stageT=-0.3;return;}}  // 中毒无空位 → 停摆
  stageT=0;stage=(stage+1)%10;
  if(stage===0){
    flashStage=-1;
    if(hPos[0]&&hPos[1])hPos=[null,null];
    releasePair();pickPair();
  }
  if(stage===3)hAds+=2;
  if(stage===7||stage===8)hAds=Math.max(0,hAds-1);
  if(stage===9){doneN++;events.push(simT);}
}
const STEPS=[
 {zh:'H₂ 很懒：气相直接加氢要翻 ≈170 kJ/mol 的高墙，常温几乎不反应',en:'H2 is inert: direct gas-phase addition faces ~170 kJ/mol, near-zero at RT'},
 {zh:'吸附：H₂ 落到表面，σ 键被金属 d 电子拉开',en:'Adsorption: H2 lands, its σ bond stretched by metal d-electrons'},
 {zh:'解离：H₂ 分成两个吸附 H 原子（白光瞬间）—— 全反应的第一道难关被拆掉',en:'Dissociation: H2 splits into two adsorbed H (white flash) — the hard part is done'},
 {zh:'烯烃 π 键平躺吸附：两个 C 各占一个相邻位点',en:'The alkene π bond lies flat: each C takes one adjacent site'},
 {zh:'第一个 H 从金属同侧转移到一个 C 上',en:'First H transfers from the metal side onto one carbon'},
 {zh:'第二个 H 转移 → 乙烷弹出脱附，表面复原：催化剂只换路、不耗己',en:'Second H transfers → ethane desorbs, surface restored: changed route, not consumed'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
const stepOfStage=[0,1,2,2,3,3,3,4,5,5];

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
  mGround.color.setHex(THEME==='dark'?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();setPlayLabel();
}
function setPlayLabel(){
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
}

/* ---- 能量图 ---- */
const plotCv=document.getElementById('plotCv');
const CAT=[[0,0],[0.08,-12],[0.16,14],[0.24,4],[0.4,-8],[0.52,45],[0.62,16],[0.74,45],[0.86,6],[1,0]];
const DIRECT=[[0,0],[0.5,170],[1,0]];
const stageX=[0.02,0.1,0.2,0.28,0.44,0.52,0.58,0.72,0.84,0.95];
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const t2=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const yOf=v=>H-26-(clamp(v,-20,180)+20)/200*(H-40);
  ctx.strokeStyle='rgba(128,150,170,.3)';
  ctx.beginPath();ctx.moveTo(0,yOf(0));ctx.lineTo(W,yOf(0));ctx.stroke();
  ctx.fillStyle=t2;ctx.font='13px system-ui';
  ctx.fillText(L('反应物','reactants'),4,yOf(0)+16);
  ctx.fillText(L('反应坐标 →','reaction coord →'),W-120,yOf(0)+16);
  ctx.fillText('170 kJ/mol',W/2-40,yOf(170)-6);
  const line=(pts,col,wid)=>{
    ctx.strokeStyle=col;ctx.lineWidth=wid;ctx.beginPath();
    pts.forEach((p,i)=>{const x=p[0]*W,y=yOf(p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.stroke();
  };
  line(DIRECT,'rgba(255,107,107,.8)',3);
  line(CAT,'#ffa94d',3);
  /* 当前步骤动点 */
  const cx=stageX[stage]*W;
  let cy=0;
  for(let i=1;i<CAT.length;i++)if(stageX[stage]<=CAT[i][0]){
    const f=(stageX[stage]-CAT[i-1][0])/(CAT[i][0]-CAT[i-1][0]);
    cy=CAT[i-1][1]+(CAT[i][1]-CAT[i-1][1])*f;break;
  }
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,yOf(cy),5,0,7);ctx.fill();
  ctx.strokeStyle='#ffa94d';ctx.beginPath();ctx.arc(cx,yOf(cy),8,0,7);ctx.stroke();
  ctx.lineWidth=1;
}

/* ---- 统计 ---- */
let statAcc=0;
function updateStats(){
  document.getElementById('stH').innerHTML=hAds;
  document.getElementById('stDone').innerHTML=doneN;
  document.getElementById('stCO').innerHTML=(coList.length/sites.length*100).toFixed(0)+'<small> %</small>';
  while(events.length&&simT-events[0]>10)events.shift();
  document.getElementById('stRate').innerHTML=(events.length/10).toFixed(2)+'<small> /s</small>';
}

/* ---- 每帧：推进与可视化 ---- */
const ease=f=>f*f*(3-2*f);
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
function siteV(s,y){return V3(s.x,SITEY+y,s.z);}
let hIdx=0;   // 吸附H 实例游标
function putH(i,pos){
  tmpM.makeTranslation(pos.x,pos.y,pos.z);
  hMesh.setMatrixAt(i,tmpM);
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05)*speedK;
  simT+=dt;
  if(playing){
    stageT+=dt;
    /* 毒物投放/解除 */
    if(poisonOn){coAcc.t+=dt;if(coAcc.t>1.1&&coList.length<18){coAcc.t=0;addCO();}}
    else{coAcc.t+=dt;if(coAcc.t>0.4&&coList.length){coAcc.t=0;removeCO();}}
    if(stageT>=stageDur(stage))advance();
  }
  const frac=clamp(stageT/stageDur(stage),0,1);
  /* --- 可视化（声明式：由 stage+frac 完全决定） --- */
  for(let i=0;i<HP;i++)hMesh.setMatrixAt(i,zeroM);
  hIdx=0;
  if(!pair&&stage!==0){releasePair();}
  if(!pair&&stage===0&&stageT>=0)pickPair();
  const c1=pair?siteV(pair[0],0):V3(0,0,0),c2=pair?siteV(pair[1],0):V3(0,0,0);
  const mid=pair?c1.clone().add(c2).multiplyScalar(0.5):V3(0,0,0);
  /* H₂ 各阶段 */
  h2.visible=stage===1||stage===2;
  if(stage===1){
    const p=mid.clone();p.y=3.0+(SITEY+0.55-3.0)*ease(frac);
    h2.position.copy(p);h2.rotation.y=simT*2;
  }else if(stage===2){
    h2.position.set(mid.x,SITEY+0.55+0.04*Math.sin(simT*9),mid.z);
  }
  if(stage===3){
    if(flashStage!==3){flashStage=3;flashT=0.45;flash.position.set(mid.x,SITEY+0.12,mid.z);}
    const e=ease(frac);
    hPos[0]=mid.clone().lerp(c1.clone().add(V3(0,0.3,0)),e);
    hPos[1]=mid.clone().lerp(c2.clone().add(V3(0,0.3,0)),e);
    h2.visible=false;
  }
  if(stage>=4&&hPos[0]&&hPos[1]){
    if(stage<=6){
      /* 已解离的两个 H 停在位点上 */
      hPos[0]=c1.clone().add(V3(0,0.3,0));
      hPos[1]=c2.clone().add(V3(0,0.3,0));
    }else{
      /* stage 7/8 依次转移到 C 上(同侧)，stage 9 随乙烷一起升空 */
      const rise=stage===9?ease(frac)*2.3:0;
      const e7=stage===7?ease(frac):1,e8=stage===8?ease(frac):1;
      hPos[0]=c1.clone().add(V3(0,0.3,0)).lerp(V3(mid.x-0.16,SITEY+0.78+rise,mid.z),e7);
      hPos[1]=c2.clone().add(V3(0,0.3,0)).lerp(V3(mid.x+0.16,SITEY+0.78+rise,mid.z),e8);
    }
  }
  if(hPos[0]){putH(hIdx++,hPos[0]);}
  if(hPos[1]){putH(hIdx++,hPos[1]);}
  hMesh.instanceMatrix.needsUpdate=true;
  /* 乙烯/乙烷各阶段 */
  ethG.visible=stage>=5&&stage<=9;
  if(stage===5){
    const p=mid.clone();p.y=3.0+(SITEY+0.75-3.0)*ease(frac);
    ethG.position.copy(p);ethG.rotation.y=simT*1.2;
  }else if(stage===6){
    ethG.position.set(mid.x,SITEY+0.72,mid.z);ethG.rotation.y=0;
  }else if(stage>=7&&stage<=9){
    ethG.position.set(mid.x,SITEY+0.72,mid.z);
    if(stage===9){
      const e=ease(frac);
      ethG.position.y=SITEY+0.72+e*2.3;
      ethG.rotation.y=e*2.5;
      ethG.scale.setScalar(Math.max(0.01,1-e*0.55));
    }else ethG.scale.setScalar(1);
  }
  /* H 转移的瞬间位姿已并入上方 stage7/8 插值 */
  /* 闪光衰减 */
  if(flashT>0){
    flashT-=dt;
    flash.material.opacity=Math.max(0,flashT)*1.8;
    flash.scale.setScalar(1+(0.45-Math.max(0,flashT))*7);
  }else flash.material.opacity=0;
  /* CO 生长动画 */
  coList.forEach(g=>{g.scale.setScalar(Math.min(1,g.scale.x+dt*3));});
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  if(playing&&autoLoop){const st=stepOfStage[stage];if(activeStep!==st){activeStep=st;syncSteps();}}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  drawPlot();
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
const clock=new THREE.Clock();
let raf=null,acc=0;

/* ---- 事件 ---- */
document.getElementById('sT').addEventListener('input',e=>{
  Tk=+e.target.value;
  document.getElementById('sTVal').textContent=Tk+' K';
});
document.getElementById('sP').addEventListener('input',e=>{
  pBar=+e.target.value/10;
  document.getElementById('sPVal').textContent=pBar.toFixed(1)+' bar';
});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(2)+'×';
});
document.getElementById('btnStep').addEventListener('click',()=>{advance();});
document.getElementById('btnAuto').addEventListener('click',e=>{
  autoLoop=!autoLoop;e.currentTarget.classList.toggle('on',autoLoop);
});
document.getElementById('btnPoison').addEventListener('click',e=>{
  poisonOn=!poisonOn;
  e.currentTarget.classList.toggle('on',poisonOn);
});
document.getElementById('btnMetal').addEventListener('click',e=>{
  mat=mat==='Pt'?'Ni':'Pt';
  metalMesh.material=mat==='Pt'?mPt:mNi;
  e.currentTarget.textContent=L(mat==='Pt'?'表面: Pt':'表面: Ni',mat==='Pt'?'Surface: Pt':'Surface: Ni');
});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
if(qs.get('speed')){
  speedK=clamp(+qs.get('speed')||1,0.25,2);
  document.getElementById('sSpd').value=speedK*100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(2)+'×';
}
document.getElementById('tglLabels').checked=labelsOn;

applyTheme();applyLang();updateStats();pickPair();
if(playing){stage=1;stageT=0.5;}   // 加载即有 H₂ 在途：~1 秒落面解离、数秒内走完加氢-脱附
start();
</script>
