<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>风筝与系留飞行 · 被绳索拴住的机翼</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const D2R=Math.PI/180;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const QS=new URLSearchParams(location.search);
let playing=true, labelsOn=true;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,110);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,400);
camera.position.set(4.5,3.2,12.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.2,2.8,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=2; controls.maxDistance=60;

scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,0.95); key.position.set(6,10,7); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-7,5,-6); scene.add(fill);

/* ---- 地面与锚点 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.BoxGeometry(80,0.2,40),groundM);
ground.position.y=-0.1; scene.add(ground);
const grid=new THREE.GridHelper(80,80,0x3a4656,0x27303c);
grid.position.y=0.01; scene.add(grid);
const stake=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.5,10),new THREE.MeshStandardMaterial({color:0x8a7358,roughness:0.7}));
stake.rotation.x=Math.PI; stake.position.set(0,0.25,0); scene.add(stake);
const drum=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.3,14),new THREE.MeshStandardMaterial({color:0x788795,roughness:0.5,metalness:0.5}));
drum.rotation.z=Math.PI/2; drum.position.set(0.3,0.16,0); scene.add(drum);

/* ---- 物理模型（平板机翼 + 三力闭合）----
   平板升力 CL≈1.5·sin2α（α>15° 气流分离、衰减），CD=0.12+1.4·sin²α+失速增量；
   q=½ρU²，L=qS·CL，D=qS·CD，W=mg（S=0.55 m²，m=0.28 kg）。
   平衡（张力必沿绳）：T·cosθ=D，T·sinθ=L−W
     → θ=atan((L−W)/D)，T=√(D²+(L−W)²)，飞高 h=ℓ·sinθ。
   阵风=瞬间抽线：U 骤增 + 攻角 +5° → L 暴涨、张力尖峰（与帆船收帆同源）。
   发电风筝：crosswind 绕圈让视风 U_app≈E·U（E≈5）；巨型翼（S=300 m²）
     T≈½ρ·U_app²·S·√(CL²+CD²)，收线功率 P=T·v_收线（v≈5 m/s）——张力就是油门。 */
const RHO=1.225, S_KITE=0.55, MASS=0.28, GRAV=9.81;
const W_KITE=MASS*GRAV;
let U=6, Llen=60, alphaDeg=10;        // 风速 m/s / 线长 m / 迎角 °
let mode='single';                    // single | stunt | power
let vecOn=true, gustT=0, phT=0, reelT=0;
const KV=0.085;                       // 线长视觉比例：1 m → 0.085 世界单位
const FSC=0.22;                       // 力箭头比例：1 N → 0.22 单位
function aero(u,aDeg){
  const a=aDeg*D2R, stall=Math.max(0,aDeg-15);
  const cl=1.5*Math.sin(2*a)*Math.exp(-Math.pow(stall/12,4));
  const cd=0.12+1.4*Math.sin(a)*Math.sin(a)+1.2*stall/15;
  const q=0.5*RHO*u*u;
  return {L:q*S_KITE*cl, D:q*S_KITE*cd, cl, cd};
}
function gustEnv(){
  return gustT>0?Math.sin(Math.min(gustT/1.6,1)*Math.PI):0;
}

/* ---- 风筝（菱形：两根骨架 + 半透明帆 + 尾巴）---- */
const kiteG=new THREE.Group(); scene.add(kiteG);
{
  const sailShape=new THREE.Shape();
  sailShape.moveTo(0,0.68); sailShape.lineTo(0.42,0); sailShape.lineTo(0,-0.68); sailShape.lineTo(-0.42,0);
  sailShape.closePath();
  const sail=new THREE.Mesh(new THREE.ShapeGeometry(sailShape),
    new THREE.MeshStandardMaterial({color:0xff7043,side:THREE.DoubleSide,roughness:0.5,
      transparent:true,opacity:0.88,emissive:0xff5a1e,emissiveIntensity:0.12}));
  kiteG.add(sail);
  const sparM=new THREE.MeshStandardMaterial({color:0x4a3a2c,roughness:0.6});
  const sv=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,1.38,8),sparM); kiteG.add(sv);
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.013,0.013,0.86,8),sparM);
  sh.rotation.z=Math.PI/2; kiteG.add(sh);
}
const tail=[];
for(let i=0;i<6;i++){
  const b=new THREE.Mesh(new THREE.TorusGeometry(0.05,0.016,6,12),
    new THREE.MeshBasicMaterial({color:0xffd43b}));
  kiteG.add(b); tail.push(b);
}
/* ---- 系绳（带垂度：线有自重，张力越小垂得越多）---- */
const NLIN=24;
const lineGeo=new THREE.BufferGeometry();
const linePos=new Float32Array(NLIN*3);
lineGeo.setAttribute('position',new THREE.BufferAttribute(linePos,3));
const tether=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0xcfd8e6,transparent:true,opacity:0.75}));
scene.add(tether);
const line2Geo=new THREE.BufferGeometry();
const line2Pos=new Float32Array(NLIN*3);
line2Geo.setAttribute('position',new THREE.BufferAttribute(line2Pos,3));
const tether2=new THREE.Line(line2Geo,new THREE.LineBasicMaterial({color:0xffe0b0,transparent:true,opacity:0.75}));
tether2.visible=false; scene.add(tether2);
function bendLine(arr,ax,ay,az,bx,by,bz,sag){
  for(let i=0;i<NLIN;i++){
    const t=i/(NLIN-1), o=i*3;
    arr[o]  =ax+(bx-ax)*t;
    arr[o+1]=ay+(by-ay)*t - sag*4*t*(1-t);   // 抛物垂度
    arr[o+2]=az+(bz-az)*t;
  }
}
/* ---- 8 字轨迹尾迹 ---- */
const NTR=180;
const trGeo=new THREE.BufferGeometry();
const trPos=new Float32Array(NTR*3);
trGeo.setAttribute('position',new THREE.BufferAttribute(trPos,3));
trGeo.setDrawRange(0,0);
const trail=new THREE.Line(trGeo,new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.6}));
trail.visible=false; scene.add(trail);
let trN=0;
function pushTrail(x,y,z){
  if(trN<NTR){ for(let i=trN;i>0;i--){trPos[i*3]=trPos[(i-1)*3];trPos[i*3+1]=trPos[(i-1)*3+1];trPos[i*3+2]=trPos[(i-1)*3+2];} trN++; }
  else{ for(let i=NTR-1;i>0;i--){trPos[i*3]=trPos[(i-1)*3];trPos[i*3+1]=trPos[(i-1)*3+1];trPos[i*3+2]=trPos[(i-1)*3+2];} }
  trPos[0]=x; trPos[1]=y; trPos[2]=z;
  trGeo.attributes.position.needsUpdate=true;
  trGeo.setDrawRange(0,trN);
}
/* ---- 力三角形（三支箭首尾相接：R→W→T 回到风筝）---- */
const arrR=new THREE.ArrowHelper(new THREE.Vector3(0,1,0),new THREE.Vector3(),1,0xffa94d,0.22,0.12);
const arrW=new THREE.ArrowHelper(new THREE.Vector3(0,-1,0),new THREE.Vector3(),1,0xff6b6b,0.22,0.12);
const arrT=new THREE.ArrowHelper(new THREE.Vector3(0,-1,0),new THREE.Vector3(),1,0x74c0fc,0.22,0.12);
scene.add(arrR,arrW,arrT);
/* ---- 风迹 ---- */
const NW=54;
const dummy=new THREE.Object3D();                // 实例矩阵工作对象（提前声明）
const windMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(0.7,0.012,0.012),
  new THREE.MeshBasicMaterial({color:0x9fb0c3,transparent:true,opacity:0.3}),NW);
scene.add(windMesh);
const windP=[];
for(let i=0;i<NW;i++) windP.push({x:(Math.random()-0.5)*20,y:0.2+Math.random()*7.5,z:-3+Math.random()*5,s:0.7+Math.random()*0.7});
{                                                // 预填实例矩阵（?pause=1 时不至于堆在原点）
  for(let i=0;i<NW;i++){ dummy.position.set(windP[i].x,windP[i].y,windP[i].z); dummy.scale.setScalar(windP[i].s); dummy.updateMatrix(); windMesh.setMatrixAt(i,dummy.matrix); }
  windMesh.instanceMatrix.needsUpdate=true;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
const lbKite=addLabel(()=>L('风筝=被绳拴住的机翼','A kite is a wing on a leash'),
  new THREE.Vector3(0,0,0),'o',()=>mode==='single');
const lbForce=addLabel(()=>L('力三角形：R→W→T 首尾闭合，把风筝钉在空中','Force triangle: R→W→T closes and pins the kite'),
  new THREE.Vector3(0,0,0),'b',()=>vecOn&&mode==='single');
const lbGround=addLabel(()=>L('升力<重力——风筝趴地：加大迎角或等风','Lift < weight — grounded: more AoA or more wind'),
  new THREE.Vector3(1.6,1.0,0),'r',()=>grounded);
const lbStunt=addLabel(()=>L('两线长短差→迎角差→俯冲、旋转、画 8 字','Line-length difference → AoA difference → dives, spins, eights'),
  new THREE.Vector3(0,6.6,0),'o',()=>mode!=='single');
const lbGust=addLabel(()=>L('阵风=瞬间抽线：攻角骤增、张力尖峰（与帆船收帆同源）','A gust yanks the line: AoA spikes, tension spikes (same as sheeting in)'),
  new THREE.Vector3(0,7.3,0),'r',()=>gustT>0);
const lbPower=addLabel(()=>L('',''),new THREE.Vector3(0,5.9,0),'g',()=>mode==='power');

/* ---- 状态与解算 ---- */
let grounded=false, curT=0, curTh=0, curH=0, uEff=0;
let Tbig=0, Pgen=0, Uapp=0;
let demoGust=true, demoT=0;                      // 开机 1.5 s 自动来一次阵风（招牌瞬间）
function solve(){
  const g=gustEnv();
  uEff=U*(1+0.55*g);
  const aEff=alphaDeg+5*g;
  const A=aero(uEff,aEff);
  if(A.L<=W_KITE*1.02){ grounded=true; curT=0; curTh=8*D2R; curH=0; return A; }
  grounded=false;
  curTh=Math.atan((A.L-W_KITE)/A.D);
  curT=Math.sqrt(A.D*A.D+(A.L-W_KITE)*(A.L-W_KITE));
  curH=Llen*Math.sin(curTh);
  return A;
}
function solveBig(){                            // 发电风筝：巨型翼 crosswind
  const A=aero(alphaDeg,alphaDeg);
  Uapp=Math.sqrt(uEff*uEff+Math.pow(5*uEff,2)); // E≈5：绕圈速度叠加正交风
  const q=0.5*RHO*Uapp*Uapp;
  Tbig=q*300*Math.sqrt(A.cl*A.cl+A.cd*A.cd)*0.85;
  Pgen=Tbig*5/1000;                             // 收线 5 m/s
}
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'三力平衡：升力、重力、张力——三矢量首尾闭合，风筝被「钉」在空中',en:'Three-force balance: lift, weight, tension close tip-to-tail and pin the kite'},
  {zh:'迎角自己定：风强→平衡迎角与线角上移——风筝飞得更高更紧',en:'The bridle self-selects AoA: more wind lifts the equilibrium — higher and tauter'},
  {zh:'张力沿绳分解：T=√(D²+(L−W)²)，θ=atan((L−W)/D)——线长定飞高',en:'Tension along the line: T=√(D²+(L−W)²), θ=atan((L−W)/D) — line length sets height'},
  {zh:'阵风=瞬间抽线：攻角骤增→升力暴涨→张力尖峰（与帆船收帆同源）',en:'A gust yanks the line: AoA spikes → lift surges → tension spike (like sheeting in)'},
  {zh:'四线特技：两线长短差改两侧迎角——俯冲、旋转、画 8 字',en:'4-line stunt: left/right line lengths skew AoA — dives, spins, figure-eights'},
  {zh:'发电风筝：crosswind 绕圈把视风放大 E≈5 倍，绳张力做功=发电机油门',en:'Power kite: crosswind circles boost apparent wind ×5 — rope tension is the throttle'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;gotoStep(i);syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  gustT=0;
  if(i===0){U=6;Llen=60;alphaDeg=10;mode='single';}
  else if(i===1){U=11;Llen=60;alphaDeg=10;mode='single';}
  else if(i===2){U=7;Llen=100;alphaDeg=8;mode='single';}
  else if(i===3){mode='single';gustT=1.6;}
  else if(i===4){U=7;mode='stunt';}
  else if(i===5){U=9;mode='power';}
  trailClear();
  syncUI();
}
function trailClear(){trN=0;trGeo.setDrawRange(0,0);}

/* ---- 读数与 UI ---- */
function updateStats(){
  document.getElementById('stU').innerHTML=uEff.toFixed(1)+'<small> m/s</small>';
  const T=mode==='power'?Tbig:curT;
  document.getElementById('stT').innerHTML=T>=1000?(T/1000).toFixed(1)+'<small> kN</small>'
    :(T>=100?Math.round(T)+'<small> N</small>':T.toFixed(1)+'<small> N</small>');
  document.getElementById('stTh').innerHTML=(curTh/D2R).toFixed(1)+'<small> °</small>';
  document.getElementById('stH').innerHTML=(mode==='single'?curH:(kiteG.position.y-0.1)/KV).toFixed(0)+'<small> m</small>';
}
function syncUI(){
  document.getElementById('sU').value=U*10;
  document.getElementById('sUVal').textContent=U.toFixed(1)+' m/s';
  document.getElementById('sLVal').textContent=Math.round(Llen)+' m';
  document.getElementById('sAVal').textContent=alphaDeg.toFixed(1)+'°';
  document.getElementById('btnStunt').classList.toggle('on',mode==='stunt');
  document.getElementById('btnPower').classList.toggle('on',mode==='power');
  document.getElementById('btnVec').classList.toggle('on',vecOn);
}
document.getElementById('sU').addEventListener('input',e=>{U=+e.target.value/10;syncUI();});
document.getElementById('sL').addEventListener('input',e=>{Llen=+e.target.value;syncUI();});
document.getElementById('sA').addEventListener('input',e=>{alphaDeg=+e.target.value;syncUI();});
document.getElementById('btnGust').addEventListener('click',()=>{gustT=1.6;});
document.getElementById('btnStunt').addEventListener('click',()=>{mode=mode==='stunt'?'single':'stunt';trailClear();syncUI();});
document.getElementById('btnPower').addEventListener('click',()=>{mode=mode==='power'?'single':'power';trailClear();syncUI();});
document.getElementById('btnVec').addEventListener('click',()=>{vecOn=!vecOn;syncUI();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, statAcc=0;
const v3=new THREE.Vector3();
const ANCHOR=new THREE.Vector3(0,0.1,0);
let fx=0, fy=4.4, fdx=0, fdy=0;                  // 特技/发电轨迹状态
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(demoGust){demoT+=dt; if(demoT>1.5){gustT=1.6;demoGust=false;}}
  if(gustT>0)gustT-=dt;
  solve(); solveBig();                           // 暂停时也随滑块实时重算读数
  if(playing){
    const g=gustEnv();
    if(mode==='single'){
      // 平衡位形 + 轻微喘动（阵风时上窜）
      const th=grounded?8*D2R:curTh+0.02*Math.sin(clock.elapsedTime*1.7)+g*0.12;
      const r=Llen*KV;
      kiteG.position.set(ANCHOR.x+Math.cos(th)*r, ANCHOR.y+Math.sin(th)*r, Math.sin(clock.elapsedTime*0.7)*0.25);
      kiteG.rotation.z=th-Math.PI/2+0.03*Math.sin(clock.elapsedTime*2.3);
      kiteG.rotation.x=0.05*Math.sin(clock.elapsedTime*1.3);
    }else{
      // 四线特技 / 发电风筝：∞ 字横摆（crosswind 绕圈）
      phT+=dt*(mode==='power'?1.9:1.25);
      const ax=mode==='power'?3.1:2.6, ay=mode==='power'?1.7:1.4, cy=mode==='power'?4.6:4.3;
      const nx=Math.cos(phT)*ax, ny=cy+Math.sin(2*phT)*ay;
      fdx=(nx-fx)/Math.max(dt,1e-4); fdy=(ny-fy)/Math.max(dt,1e-4);
      fx=nx; fy=ny;
      kiteG.position.set(fx,fy,Math.sin(phT*0.5)*0.3);
      const sp=Math.hypot(fdx,fdy);
      kiteG.rotation.z=(sp>1e-3?Math.atan2(fdy,fdx):0)-Math.PI/2+0.4*Math.sin(phT*2); // 机身随速度俯仰
      kiteG.rotation.z=clamp(kiteG.rotation.z,-1.2,1.2);
      kiteG.rotation.x=0.35*Math.sin(phT*2+1);   // 特技翻滚感
      pushTrail(fx,fy,kiteG.position.z);
    }
    trail.visible=mode!=='single';
    // 尾巴：随动作摆动
    for(let i=0;i<tail.length;i++){
      tail[i].position.set(0.14*Math.sin(clock.elapsedTime*3+i*0.9),-0.78-i*0.16,0.05*Math.sin(clock.elapsedTime*2+i));
      tail[i].rotation.x=clock.elapsedTime*2+i;
    }
    // 系绳（单线或双线，垂度随张力）
    const sag=clamp(0.55*W_KITE/Math.max(curT,0.5),0.02,0.5)*Llen*KV;
    if(mode!=='single'){
      tether2.visible=true;
      bendLine(line2Pos,-0.35,0.1,0,kiteG.position.x-0.12,kiteG.position.y,kiteG.position.z,sag*0.7);
      line2Geo.attributes.position.needsUpdate=true;
    }else tether2.visible=false;
    bendLine(linePos,ANCHOR.x,ANCHOR.y,ANCHOR.z,kiteG.position.x,kiteG.position.y,kiteG.position.z,mode==='single'?sag:sag*0.4);
    lineGeo.attributes.position.needsUpdate=true;
    // 力三角形：R→W→T 首尾相接
    const A=aero(uEff,alphaDeg+5*gustEnv());
    arrR.visible=arrW.visible=arrT.visible=vecOn&&!grounded;
    if(vecOn&&!grounded){
      if(mode==='single'){
        const L=A.L, D=A.D;
        const rmag=Math.sqrt(L*L+D*D)*FSC;
        v3.set(D,L,0).normalize();
        arrR.position.copy(kiteG.position);
        arrR.setDirection(v3); arrR.setLength(rmag,Math.min(0.3,rmag*0.35),Math.min(0.16,rmag*0.18));
        // 链式首尾相接：风筝 +R → +W → +T 恰好回到风筝（三力平衡=三角形闭合）
        const wTip=kiteG.position.clone().add(new THREE.Vector3(D*FSC,L*FSC,0));
        arrW.position.copy(wTip);
        arrW.setDirection(new THREE.Vector3(0,-1,0)); arrW.setLength(W_KITE*FSC,0.16,0.09);
        const bTip=wTip.clone().add(new THREE.Vector3(0,-W_KITE*FSC,0));
        arrT.position.copy(bTip);
        const tvec=kiteG.position.clone().sub(bTip);
        arrT.setDirection(tvec.normalize()); arrT.setLength(tvec.length(),0.16,0.09);
        lbForce.position.copy(kiteG.position).add(new THREE.Vector3(D*FSC*0.5,-0.7,0));   // lbForce 即 CSS2DObject
      }else{
        // 特技/发电：载荷因子 n≈1.6，张力沿绳指向锚点（发电为千牛级，箭头定长示意）
        const n=1.6+0.5*Math.sin(phT*2);
        const visLen=mode==='power'?2.6:curT*n*FSC;
        v3.copy(ANCHOR).sub(kiteG.position).normalize();
        arrR.position.copy(kiteG.position);
        arrR.setDirection(v3); arrR.setLength(visLen,0.25,0.13);
        arrW.visible=false; arrT.visible=false;
      }
    }
    lbKite.position.copy(kiteG.position).add(new THREE.Vector3(0,0.75,0));
    // 发电：绞盘与读数
    if(mode==='power'){
      reelT+=dt;
      const cyc=reelT%20, reel=cyc<14?cyc/14:1-(cyc-14)/6;   // 放线14s、收线6s
      drum.rotation.x+=dt*(cyc<14?4:-2);
      lbPower.position.set(kiteG.position.x,5.6,kiteG.position.z);
      lbPower.element.innerHTML=LANG==='en'
        ?`S=300 m² · U_app ${Uapp.toFixed(0)} m/s → T ${(Tbig/1000).toFixed(0)} kN · P≈${(Pgen*(cyc<14?1:0.2)).toFixed(0)} kW`
        :`S=300 m² · 视风 ${Uapp.toFixed(0)} m/s → T ${(Tbig/1000).toFixed(0)} kN · P≈${(Pgen*(cyc<14?1:0.2)).toFixed(0)} kW`;
      lbPower.element.className='lbl g';
    }
    // 风迹
    for(let i=0;i<NW;i++){
      const p=windP[i];
      p.x+=dt*uEff*0.4*p.s;
      if(p.x>11)p.x=-11;
      dummy.position.set(p.x,p.y,p.z);
      dummy.scale.setScalar(p.s);
      dummy.updateMatrix(); windMesh.setMatrixAt(i,dummy.matrix);
    }
    windMesh.instanceMatrix.needsUpdate=true;
  }
  statAcc+=dt; if(statAcc>0.1){statAcc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible&&r.text()!=='')r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
if(QS.get('pause')==='1')playing=false;
if(QS.get('labels')==='0')labelsOn=false;
const qSpd=QS.get('speed'); if(qSpd){U=clamp(+qSpd||6,1,14);document.getElementById('sU').value=U*10;}
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
document.getElementById('tglLabels').checked=labelsOn;
solve(); solveBig(); syncUI();
applyTheme(); applyLang(); buildSteps(); updateStats(); start();
</script>
