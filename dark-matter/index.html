<style>
  :root,:root[data-theme="dark"]{color-scheme:dark;

  :root[data-theme="light"]{color-scheme:light;
    --acc:#1971c2;--bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;--hover:rgba(15,25,40,.05);
    --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);}
  *{margin:0;padding:0;box-sizing:border-box;}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
let LANG  = localStorage.getItem('htw-lang')||'zh';
const L = (zh,en) => LANG==='en'?en:zh;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 6, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.target.set(0,0,0);
scene.add(new THREE.AmbientLight(0xffffff,0.5));
scene.add(new THREE.DirectionalLight(0xffffff,0.8));

let currentScene = 'rotation'; // 'rotation' | 'bullet' | 'cmb'
let dmFraction = 27; // 0-40 %
let t = 0;

// ---- 2D overlay chart canvas ----
const chart2 = document.getElementById('chartCanvas2');
const ctx2 = chart2.getContext('2d');

// ===== SCENE OBJECTS =====

// --- shared star background ---
const bgStarPos = new Float32Array(1200*3);
for(let i=0;i<1200;i++){
  const r=90+Math.random()*60, phi=Math.random()*Math.PI*2, th=Math.random()*Math.PI;
  bgStarPos[i*3]=r*Math.sin(th)*Math.cos(phi); bgStarPos[i*3+1]=r*Math.sin(th)*Math.sin(phi); bgStarPos[i*3+2]=r*Math.cos(th);
}
const bgStarGeo = new THREE.BufferGeometry();
bgStarGeo.setAttribute('position', new THREE.BufferAttribute(bgStarPos,3));
const bgStarMesh = new THREE.Points(bgStarGeo, new THREE.PointsMaterial({color:0xffffff,size:0.14,transparent:true,opacity:0.6}));
scene.add(bgStarMesh);

// ===== MODE 1: ROTATION =====
// Spiral galaxy top-down: 500 stars in spiral arms
const STAR_COUNT = 500;
const galaxyStarPos = new Float32Array(STAR_COUNT*3);
const galaxyAngles = new Float32Array(STAR_COUNT);
const galaxyRadii  = new Float32Array(STAR_COUNT);
const galaxyColors = new Float32Array(STAR_COUNT*3);
for(let i=0;i<STAR_COUNT;i++){
  const arm = Math.floor(Math.random()*2);
  const r = 0.5 + Math.random()*3.5;
  const baseAngle = arm * Math.PI + r * 1.2 + (Math.random()-0.5)*0.5;
  galaxyRadii[i] = r;
  galaxyAngles[i] = baseAngle;
  galaxyStarPos[i*3]   = r * Math.cos(baseAngle);
  galaxyStarPos[i*3+1] = (Math.random()-0.5)*0.12;
  galaxyStarPos[i*3+2] = r * Math.sin(baseAngle);
  const brightness = 0.7 + Math.random()*0.3;
  const warmth = Math.random()*0.15;
  galaxyColors[i*3]=brightness; galaxyColors[i*3+1]=brightness-warmth*0.5; galaxyColors[i*3+2]=brightness-warmth;
}
const galaxyGeo = new THREE.BufferGeometry();
galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyStarPos.slice(),3));
galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors,3));
const galaxyMesh = new THREE.Points(galaxyGeo, new THREE.PointsMaterial({size:0.07,vertexColors:true,transparent:true,opacity:0.95}));
scene.add(galaxyMesh);

// DM halo sphere (rotation mode)
const haloGeo = new THREE.SphereGeometry(5,32,32);
const haloMat = new THREE.MeshStandardMaterial({color:0x3366ff,transparent:true,opacity:0.06,side:THREE.DoubleSide});
const haloMesh = new THREE.Mesh(haloGeo,haloMat);
scene.add(haloMesh);
// ===== MODE 2: BULLET CLUSTER =====
// Two galaxy groups moving toward each other
const CLUSTER_COUNT = 100;
const clusterAPos = new Float32Array(CLUSTER_COUNT*3);
const clusterBPos = new Float32Array(CLUSTER_COUNT*3);
for(let i=0;i<CLUSTER_COUNT;i++){
  clusterAPos[i*3]   = -3.5+(Math.random()-0.5)*1.2;
  clusterAPos[i*3+1] = (Math.random()-0.5)*0.8;
  clusterAPos[i*3+2] = (Math.random()-0.5)*1.2;
  clusterBPos[i*3]   =  3.5+(Math.random()-0.5)*1.2;
  clusterBPos[i*3+1] = (Math.random()-0.5)*0.8;
  clusterBPos[i*3+2] = (Math.random()-0.5)*1.2;
}
const clusterAGeo = new THREE.BufferGeometry();
clusterAGeo.setAttribute('position', new THREE.BufferAttribute(clusterAPos.slice(),3));
const clusterBGeo = new THREE.BufferGeometry();
clusterBGeo.setAttribute('position', new THREE.BufferAttribute(clusterBPos.slice(),3));
const clusterAMesh = new THREE.Points(clusterAGeo, new THREE.PointsMaterial({color:0xffeedd,size:0.08,transparent:true,opacity:0}));
const clusterBMesh = new THREE.Points(clusterBGeo, new THREE.PointsMaterial({color:0xddeeff,size:0.08,transparent:true,opacity:0}));
scene.add(clusterAMesh); scene.add(clusterBMesh);

// X-ray gas blobs (two orange ellipsoids)
const gasGeoA = new THREE.SphereGeometry(0.9,24,24);
const gasMatA = new THREE.MeshStandardMaterial({color:0xff6600,emissive:0xff3300,emissiveIntensity:0.6,transparent:true,opacity:0});
const gasGeoB = new THREE.SphereGeometry(0.9,24,24);
const gasMatB = new THREE.MeshStandardMaterial({color:0xff8800,emissive:0xff5500,emissiveIntensity:0.6,transparent:true,opacity:0});
const gasMeshA = new THREE.Mesh(gasGeoA,gasMatA); gasMeshA.scale.set(1.2,0.5,1);
const gasMeshB = new THREE.Mesh(gasGeoB,gasMatB); gasMeshB.scale.set(1.2,0.5,1);
scene.add(gasMeshA); scene.add(gasMeshB);

// DM halos (two blue wireframe spheres, pass through each other)
const dmHaloAGeo = new THREE.SphereGeometry(1.8,20,20);
const dmHaloBGeo = new THREE.SphereGeometry(1.8,20,20);
const dmHaloAMat = new THREE.MeshBasicMaterial({color:0x3366ff,wireframe:true,transparent:true,opacity:0});
const dmHaloBMat = new THREE.MeshBasicMaterial({color:0x6699ff,wireframe:true,transparent:true,opacity:0});
const dmHaloA = new THREE.Mesh(dmHaloAGeo,dmHaloAMat);
const dmHaloB = new THREE.Mesh(dmHaloBGeo,dmHaloBMat);
scene.add(dmHaloA); scene.add(dmHaloB);

let bulletPhase = 0; // 0=approaching, 1=colliding, 2=separated

// ===== CMB MODE: uses 2D overlay only (hide 3D objects) =====

function drawCMBChart(dmFrac) {
  ctx2.clearRect(0,0,220,110);
  ctx2.fillStyle=THEME==='dark'?'rgba(10,14,22,0.95)':'rgba(238,241,246,0.95)';
  ctx2.fillRect(0,0,220,110);
  // Approximate CMB acoustic power spectrum with 3 peaks
  // Peak positions: l1=200, l2=540, l3=800
  // DM affects odd/even peak ratio: more DM → higher odd peaks relative to even
  const dm = dmFrac / 40; // 0-1
  const p1 = 0.65 + dm * 0.30; // first peak height
  const p2 = 0.35 - dm * 0.12; // second peak (even, suppressed by DM)
  const p3 = 0.40 + dm * 0.15; // third peak
  const lMax = 1000, W=210, H=95;
  ctx2.strokeStyle=THEME==='dark'?'rgba(116,192,252,0.9)':'rgba(25,113,194,0.9)';
  ctx2.lineWidth=1.8;
  ctx2.beginPath();
  for(let px=0;px<W;px++){
    const l=px/W*lMax;
    const s1=Math.exp(-((l-200)**2/(2*70**2)))*p1;
    const s2=Math.exp(-((l-540)**2/(2*80**2)))*p2;
    const s3=Math.exp(-((l-800)**2/(2*70**2)))*p3;
    const val=(s1+s2+s3);
    const y=H-val*H*0.85-5;
    px===0?ctx2.moveTo(px+5,y):ctx2.lineTo(px+5,y);
  }
  ctx2.stroke();
  // Best-fit annotation
  if(Math.abs(dmFrac-27)<4){
    ctx2.fillStyle='rgba(116,192,252,0.7)'; ctx2.font='9px monospace';
    ctx2.textAlign='left'; ctx2.fillText('Planck best fit ~27%',8,H+10);
  }
  // Axes label
  ctx2.fillStyle=THEME==='dark'?'rgba(160,180,200,0.6)':'rgba(60,90,120,0.6)';
  ctx2.font='8px monospace'; ctx2.textAlign='right';
  ctx2.fillText('l=1000',215,H-2);
  ctx2.textAlign='left'; ctx2.fillText('P(l)',6,10);
}

function drawRotationChart(dmFrac) {
  ctx2.clearRect(0,0,220,110);
  ctx2.fillStyle=THEME==='dark'?'rgba(10,14,22,0.95)':'rgba(238,241,246,0.95)';
  ctx2.fillRect(0,0,220,110);
  const W=210, H=95;
  // Keplerian: v = sqrt(GM/r) ~ 1/sqrt(r), normalised
  ctx2.strokeStyle='rgba(220,80,80,0.85)'; ctx2.lineWidth=1.5; ctx2.setLineDash([4,3]);
  ctx2.beginPath();
  for(let px=1;px<W;px++){
    const r=px/W*4+0.3;
    const v=Math.min(1.0, 1.0/Math.sqrt(r))*0.7;
    const y=H-v*H*0.8-5;
    px===1?ctx2.moveTo(px+5,y):ctx2.lineTo(px+5,y);
  }
  ctx2.stroke(); ctx2.setLineDash([]);
  // Flat (observed): v ~ constant, with slight rise then flat
  const dm=dmFrac/40;
  ctx2.strokeStyle='rgba(200,220,255,0.9)'; ctx2.lineWidth=1.8;
  ctx2.beginPath();
  for(let px=1;px<W;px++){
    const r=px/W*4+0.3;
    const vKep=Math.min(1.0,1.0/Math.sqrt(r))*0.7;
    const vFlat=0.55+dm*0.12;
    const v=vKep*(1-dm)+vFlat*dm;
    const y=H-v*H*0.9-5;
    px===1?ctx2.moveTo(px+5,y):ctx2.lineTo(px+5,y);
  }
  ctx2.stroke();
  ctx2.fillStyle='rgba(220,80,80,0.7)'; ctx2.font='9px monospace'; ctx2.textAlign='left';
  ctx2.fillText('Keplerian',8,12);
  ctx2.fillStyle='rgba(180,210,255,0.8)'; ctx2.fillText('Observed',8,24);
  ctx2.fillStyle=THEME==='dark'?'rgba(140,160,180,0.5)':'rgba(60,90,120,0.5)';
  ctx2.fillText('r →',200,H);
}
// ===== SCENE VISIBILITY HELPERS =====
function setRotationMode() {
  currentScene='rotation';
  galaxyMesh.visible=true; haloMesh.visible=true;
  clusterAMesh.visible=false; clusterBMesh.visible=false;
  gasMeshA.visible=false; gasMeshB.visible=false;
  dmHaloA.visible=false; dmHaloB.visible=false;
  document.getElementById('stScene').textContent='rotation';
  document.getElementById('miniChart2').style.display='';
  drawRotationChart(dmFraction);
}
function setBulletMode() {
  currentScene='bullet';
  galaxyMesh.visible=false; haloMesh.visible=false;
  clusterAMesh.visible=true; clusterBMesh.visible=true;
  clusterAMesh.material.opacity=0.9; clusterBMesh.material.opacity=0.9;
  gasMeshA.visible=true; gasMeshB.visible=true;
  gasMeshA.material.opacity=0.55; gasMeshB.material.opacity=0.55;
  gasMeshA.position.set(-3.5,0,0); gasMeshB.position.set(3.5,0,0);
  dmHaloA.visible=true; dmHaloB.visible=true;
  dmHaloA.material.opacity=0.18; dmHaloB.material.opacity=0.18;
  dmHaloA.position.set(-3.5,0,0); dmHaloB.position.set(3.5,0,0);
  bulletPhase=0; t=0;
  document.getElementById('stScene').textContent='bullet';
  document.getElementById('miniChart2').style.display='none';
}
function setCMBMode() {
  currentScene='cmb';
  galaxyMesh.visible=false; haloMesh.visible=false;
  clusterAMesh.visible=false; clusterBMesh.visible=false;
  gasMeshA.visible=false; gasMeshB.visible=false;
  dmHaloA.visible=false; dmHaloB.visible=false;
  document.getElementById('stScene').textContent='cmb';
  document.getElementById('miniChart2').style.display='';
  drawCMBChart(dmFraction);
}

// ===== UPDATE FUNCTIONS =====
function updateRotation(dt) {
  const dm = dmFraction / 40;
  const posArr = galaxyGeo.attributes.position.array;
  for(let i=0;i<STAR_COUNT;i++){
    const r = galaxyRadii[i];
    const vKep = Math.min(2.5, 1.5/Math.sqrt(Math.max(r,0.3)));
    const vFlat = 2.2;
    const v = vKep*(1-dm) + vFlat*dm;
    const omega = v / Math.max(r, 0.3);
    galaxyAngles[i] += omega * dt * 0.2;
    posArr[i*3]   = r * Math.cos(galaxyAngles[i]);
    posArr[i*3+2] = r * Math.sin(galaxyAngles[i]);
  }
  galaxyGeo.attributes.position.needsUpdate = true;
  haloMesh.visible = dm > 0.05;
  haloMesh.material.opacity = dm * 0.10;
  const vDisplay = Math.round(150 + dm * 140);
  document.getElementById('stV').textContent = vDisplay;
  document.getElementById('stDM').textContent = dmFraction;
  const fit = Math.round(100 - Math.abs(dmFraction - 27) * 2.5);
  document.getElementById('stFit').textContent = Math.max(0, fit);
}

function updateBullet(dt) {
  t += dt;
  const speed = 0.8;
  // Phase 0: approach (0 to 4s)
  // Phase 1: post-collision separation (4s+)
  const approach = Math.min(1, t / 4.0);
  // Stars move toward each other and pass through
  const clusterSep = 3.5 - approach * 4.5; // goes negative (pass through)
  const posA = clusterGeo_offsetX(-clusterSep);
  const posB = clusterGeo_offsetX( clusterSep);
  clusterAMesh.position.set(-Math.max(-2.5, clusterSep),0,0);
  clusterBMesh.position.set( Math.max(-2.5, clusterSep),0,0);
  // DM halos pass through each other (collisionless)
  const dmSep = Math.abs(clusterSep) + (t>4 ? (t-4)*0.5 : 0);
  dmHaloA.position.set(-Math.max(0.5, Math.abs(clusterSep)),0,0);
  dmHaloB.position.set( Math.max(0.5, Math.abs(clusterSep)),0,0);
  // Gas blobs slow and pile up near center (EM drag)
  const gasX = Math.max(0, Math.abs(clusterSep) - 1.5) * Math.sign(clusterSep);
  gasMeshA.position.set(-Math.max(0.2, gasX)*0.6,0,0);
  gasMeshB.position.set( Math.max(0.2, gasX)*0.6,0,0);
  document.getElementById('stDM').textContent = dmFraction;
  document.getElementById('stV').textContent = '—';
}
function clusterGeo_offsetX(x){ return x; } // placeholder used via position.set

function updateCMB() {
  document.getElementById('stDM').textContent = dmFraction;
  document.getElementById('stV').textContent = '—';
  const fit = Math.round(100 - Math.abs(dmFraction - 27) * 2.5);
  document.getElementById('stFit').textContent = Math.max(0, fit);
}
// ===== STEPS =====
const STEPS = [
  { b:'旋转异常', be:'Rotation Anomaly',
    d:'星系外缘恒星速度不随距离下降，说明有不可见质量',
    de:'Stars at outskirts orbit too fast — unseen mass required' },
  { b:'暗物质晕', be:'DM Halo',
    d:'球对称晕 M(r)∝r 解释平坦旋转曲线',
    de:'Spherical M(r)∝r halo explains flat rotation curve' },
  { b:'引力透镜', be:'Gravitational Lensing',
    d:'背景星系光线弯曲量超出可见物质预测',
    de:'Background galaxies bent more than visible mass predicts' },
  { b:'子弹星系团', be:'Bullet Cluster',
    d:'碰撞使气体（电磁阻力）与暗物质（无碰撞）分离——最直接证据',
    de:'Collision separates X-ray gas (drag) from DM (collisionless) — most direct proof' },
  { b:'CMB 声学峰', be:'CMB Peaks',
    d:'暗物质量影响奇偶峰之比，Planck 测得约 27%',
    de:'DM fraction tunes odd/even peak ratio; Planck best fit → ~27%' },
  { b:'候选粒子', be:'Candidates',
    d:'WIMP、轴子、惰性中微子——至今未直接探测到',
    de:'WIMPs, axions, sterile neutrinos — none directly detected yet' },
];

function buildSteps() {
  const el = document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{ document.querySelectorAll('#steps li').forEach((x,j)=>x.classList.toggle('on',j===i)); });
    el.appendChild(li);
  });
}

function applyTheme() {
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='light'?0xeef1f6:0x10141b);
  if(currentScene==='rotation') drawRotationChart(dmFraction);
  else if(currentScene==='cmb') drawCMBChart(dmFraction);
}
function applyLang() {
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{ el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh; });
  document.getElementById('langBtn').textContent=LANG==='en'?'中':'EN';
  document.title=L('暗物质的间接证据','Dark Matter — Indirect Evidence');
  buildSteps();
}
document.getElementById('themeBtn').addEventListener('click',()=>{ THEME=THEME==='dark'?'light':'dark'; localStorage.setItem('htw-theme',THEME); applyTheme(); });
document.getElementById('langBtn').addEventListener('click',()=>{ LANG=LANG==='zh'?'en':'zh'; localStorage.setItem('htw-lang',LANG); applyLang(); });

function setBtn(id) {
  ['btnRot','btnBullet','btnCMB'].forEach(b=>document.getElementById(b).classList.toggle('on',b===id));
}
document.getElementById('btnRot').addEventListener('click',()=>{ setRotationMode(); setBtn('btnRot'); document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===0)); });
document.getElementById('btnBullet').addEventListener('click',()=>{ setBulletMode(); setBtn('btnBullet'); document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===3)); });
document.getElementById('btnCMB').addEventListener('click',()=>{ setCMBMode(); setBtn('btnCMB'); document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===4)); });

document.getElementById('dmSlider').addEventListener('input', e => {
  dmFraction = parseInt(e.target.value);
  document.getElementById('stDM').textContent = dmFraction;
  if(currentScene==='rotation') drawRotationChart(dmFraction);
  else if(currentScene==='cmb') drawCMBChart(dmFraction);
});

// ===== RENDER LOOP =====
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  if(currentScene==='rotation') updateRotation(dt);
  else if(currentScene==='bullet') updateBullet(dt);
  else if(currentScene==='cmb') updateCMB();
  controls.update();
  renderer.render(scene, camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

applyTheme(); applyLang(); setRotationMode(); frame();
</script>
</body></html>
