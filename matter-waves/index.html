<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电子衍射与物质波 · λ=h/p 的铁证</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 330px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #plot{position:fixed;right:18px;bottom:18px;z-index:4;width:330px;height:210px;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    backdrop-filter:blur(6px);padding:8px 10px 6px}
  #plot h3{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:2px;line-height:1.35}
  #plotCv{width:100%;height:calc(100% - 20px);display:block}
  #stats{position:fixed;right:18px;bottom:240px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.bad{color:#ff6b6b}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 8px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 96px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 84px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="电子衍射与物质波" data-en="Electron Diffraction & Matter Waves">电子衍射与物质波</h1>
  <div class="sub" data-zh="德布罗意 λ=h/p:电子也有波长,λ=1.226/√V nm(含相对论修正);一颗颗电子落在屏上,斑点从随机累积出干涉条纹——概率波的统计显影;切晶体看多晶环(汤姆孙),开 which-path 探测条纹立即消失(费曼之问) · 拖加速电压看条纹间距实时变化 · 拖动旋转 / 空格运行/暂停" data-en="de Broglie: λ=h/p — electrons have wavelengths too, λ=1.226/√V nm (relativistically corrected). Electrons land one by one; random dots accumulate into interference fringes — statistics make the wave visible. Switch to the crystal for powder rings (Thomson); switch on which-path detection and the fringes vanish (Feynman's question) · drag the accelerating voltage to watch fringe spacing change live · drag to orbit / Space = run/pause">德布罗意 λ=h/p:电子也有波长,λ=1.226/√V nm(含相对论修正);一颗颗电子落在屏上,斑点从随机累积出干涉条纹——概率波的统计显影;切晶体看多晶环(汤姆孙),开 which-path 探测条纹立即消失(费曼之问) · 拖加速电压看条纹间距实时变化 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="plot">
  <h3 data-zh="屏上落点直方图 → 反差 V=(Imax−Imin)/(Imax+Imin);which-path 一开反差归零" data-en="Landing histogram → visibility V=(Imax−Imin)/(Imax+Imin); which-path on → zero">屏上落点直方图 → 反差 V=(Imax−Imin)/(Imax+Imin);which-path 一开反差归零</h3>
  <canvas id="plotCv"></canvas>
</div>
<div id="stats">
  <span class="k" data-zh="波长 λ" data-en="Wavelength λ">波长 λ</span><span class="v" id="stLam">—</span>
  <span class="k" data-zh="电子计数" data-en="Electron count">电子计数</span><span class="v" id="stN">—</span>
  <span class="k" data-zh="条纹间距" data-en="Fringe spacing">条纹间距</span><span class="v" id="stDy">—</span>
  <span class="k" data-zh="反差 V" data-en="Visibility">反差 V</span><span class="v" id="stVis">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn on" id="btnSlits" data-zh="双缝" data-en="Double slit">双缝</button>
    <button class="abtn" id="btnCrystal" data-zh="多晶薄膜" data-en="Crystal foil">多晶薄膜</button>
    <button class="abtn" id="btnPath" data-zh="which-path 探测" data-en="Which-path detector">which-path 探测</button>
    <button class="abtn" id="btnBurst" data-zh="束流模式" data-en="Beam mode">束流模式</button>
    <button class="abtn" id="btnSingle" data-zh="单发" data-en="Fire one">单发</button>
    <button class="abtn" id="btnClear" data-zh="清屏" data-en="Clear">清屏</button>
  </div>
  <div class="row">
    <label data-zh="加速电压" data-en="Voltage">加速电压</label>
    <input id="sV" type="range" min="50" max="5000" step="10" value="600">
    <span class="val" id="sVVal">600 V</span>
  </div>
  <div class="row">
    <label data-zh="发射率" data-en="Rate">发射率</label>
    <input id="sRate" type="range" min="1" max="40" step="1" value="8">
    <span class="val" id="sRateVal">8 e/s</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../double-slit/" data-zh="光的双缝:同款实验" data-en="Double slit: the photon version">光的双缝</a>
    <a href="../heisenberg-uncertainty/" data-zh="不确定性原理" data-en="Uncertainty principle">不确定性原理</a>
    <a href="../diffraction-grating/" data-zh="衍射光栅" data-en="Diffraction grating">衍射光栅</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 物理锚点(全部真实公式):
   λ = h/√(2mₑeV(1+eV/(2mₑc²))),写成经验式 λ(nm)=1.226/√(V·(1+V/1.022e6));
   双缝:Δy=λL/d(L=1.0 m,d=250 nm 缝心距,a=60 nm 缝宽),屏上按比例放大显示;
   晶体:2d·sinθ=nλ,d=0.20 nm(金膜),多晶 → 德拜-谢乐环;
   which-path 探测:纠缠光子标记路径 → 相干性丢失,I(z)=I₁+I₂,无 cos² 项 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
const speedMul=clamp(parseFloat(qs.get('speed'))||1,0.25,3);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(0.8,1.5,12.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.2,0.35,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=40;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.45));
const key=new THREE.DirectionalLight(0xfff2dd,0.9);key.position.set(4,7,6);scene.add(key);

/* ---- 材质 ---- */
const benchM=new THREE.MeshStandardMaterial({color:0x1a1e25,roughness:0.96});
const gunM=new THREE.MeshStandardMaterial({color:0x5b6a78,roughness:0.35,metalness:0.7});
const barM=new THREE.MeshStandardMaterial({color:0x313842,roughness:0.5,metalness:0.3});
const slitEdgeM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xa35500,emissiveIntensity:0.6});
const detM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0x801f1f,emissiveIntensity:0.7});
const eM=new THREE.MeshBasicMaterial({color:0x9fe8ff});
const latticeM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.3,metalness:0.5,emissive:0x1c5f9e,emissiveIntensity:0.4});
const standM=new THREE.MeshStandardMaterial({color:0x2c333c,roughness:0.7});

/* ---- 光具座 ---- */
const bench=new THREE.Mesh(new THREE.BoxGeometry(14,0.18,3),benchM);
bench.position.y=-1.7;scene.add(bench);
function stand(x){const s=new THREE.Mesh(new THREE.BoxGeometry(0.12,1.2,0.12),standM);s.position.set(x,-1.1,0);scene.add(s);}
stand(-4.4);stand(-0.5);stand(5.4);

/* 电子枪 */
const gun=new THREE.Group();gun.position.set(-4.4,0.4,0);scene.add(gun);
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.2,1.1,16),gunM);
barrel.rotation.z=-Math.PI/2;gun.add(barrel);
const muzzle=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.13,0.3,12),gunM);
muzzle.rotation.z=-Math.PI/2;muzzle.position.x=0.68;gun.add(muzzle);
const hot=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6),new THREE.MeshBasicMaterial({color:0xffa94d}));
hot.position.x=-0.5;gun.add(hot);

/* 双缝屏障(x=-0.5):缝距 d、缝宽 a 随显示波长缩放,几何固定 */
const barrier=new THREE.Group();barrier.position.set(-0.5,0.4,0);scene.add(barrier);
const SEG=[[-2.0,-0.78],[-0.72,0.72],[0.78,2.0]];   // z 区间:中间块与两侧块之间留两条缝
const barParts=SEG.map(([z1,z2])=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.07,1.7,z2-z1),barM);
  m.position.set(0,0,(z1+z2)/2);barrier.add(m);return m;
});
const slitEdges=[];
[-0.72,-0.78,0.72,0.78].forEach(z=>{
  const e=new THREE.Mesh(new THREE.BoxGeometry(0.075,1.7,0.06),slitEdgeM);
  e.position.set(0,0,z);barrier.add(e);slitEdges.push(e);
});
/* 多晶薄膜(金膜格点) */
const foil=new THREE.Group();foil.position.copy(barrier.position);foil.visible=false;scene.add(foil);
const latPts=[];
for(let i=0;i<9;i++)for(let j=0;j<7;j++)for(let k=0;k<3;k++){
  const x=(i-4)*0.09,y=(j-3)*0.09,z=(k-1)*0.09;
  if(x*x+y*y+z*z<0.23)latPts.push([x,y,z]);
}
const latGeo=new THREE.BufferGeometry();
latGeo.setAttribute('position',new THREE.Float32BufferAttribute(latPts.flat(),3));
foil.add(new THREE.Points(latGeo,new THREE.PointsMaterial({color:0x74c0fc,size:0.05})));
const foilRim=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.045,8,32),gunM);
foil.rotation.y=Math.PI/2;foil.add(foilRim);

/* 探测屏(canvas 贴图,x=5.4) */
const scrW=512,scrH=384;
const scrCv=document.createElement('canvas');scrCv.width=scrW;scrCv.height=scrH;
const sctx=scrCv.getContext('2d');
sctx.fillStyle='#0b0e12';sctx.fillRect(0,0,scrW,scrH);
const scrTex=new THREE.CanvasTexture(scrCv);
const screen=new THREE.Mesh(new THREE.PlaneGeometry(3.9,2.9),
  new THREE.MeshStandardMaterial({map:scrTex,roughness:0.85}));
screen.rotation.y=-Math.PI/2;screen.position.set(5.4,0.4,0);scene.add(screen);
const frameBox=new THREE.Mesh(new THREE.BoxGeometry(0.08,3.05,4.05),standM);
frameBox.position.set(5.56,0.4,0);scene.add(frameBox);

/* which-path 探测器(缝后两个小灯) */
const detectors=[-1,1].map(s=>{
  const d=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),detM);
  d.position.set(-0.5,0.4,s*0.5);d.visible=false;scene.add(d);return d;
});

/* ---- 物理状态 ---- */
let volt=600,rate=8,mode='slit',pathDet=false,burst=true;
let N=0,vis=1,speedK=1;
const L_TUBE=5.9;                       // 枪到屏(x:-4.4→5.4) 场景距离
const dScene=1.44;                      // 双缝缝距(场景单位,对应 d=250 nm)
const ZMAX=1.85;                        // 屏半高(场景)
/* 波长:λ(nm)=1.226/√(V(1+V/1.022e6)) */
function lambdaNM(V){return 1.226/Math.sqrt(V*(1+V/1.022e6));}
/* 屏上条纹:显示波长 λd=λ0·√(600/V),λ0 调到默认 9 条亮纹 */
function fringeK(){return 7.5*Math.sqrt(volt/600);}          // cos²(π k z) 的 k
function intenSlit(z){                                        // 相对强度
  const env0=Math.PI*clamp(z,-ZMAX,ZMAX)/1.9;                 // 缝宽包络:±1.9 处一阶零点
  const env=env0===0?1:Math.pow(Math.sin(env0)/env0,2);
  const fr=pathDet?1:Math.pow(Math.cos(Math.PI*fringeK()*z),2);
  return env*fr;
}
function intenCrystal(z,y){                                   // 德拜环:亮环位置
  const k1=1.05*Math.sqrt(600/volt);                          // 一阶环半径 ∝ λ
  let s=0;
  for(let m=1;m<=3;m++){
    const r=m*k1;
    const dd=Math.abs(Math.hypot(z,y)-r);
    s+=Math.exp(-dd*dd/0.006)/(1+0.7*(m-1));
  }
  return s+0.02;
}
function sampleLanding(){
  for(let i=0;i<80;i++){
    const z=(Math.random()*2-1)*ZMAX,y=(Math.random()*2-1)*1.32;
    const I=mode==='slit'?intenSlit(z):intenCrystal(z,y);
    if(Math.random()<I)return{z,y};
  }
  return{z:0,y:0};
}
function stamp(z,y,col,alpha){
  const px=(z/ZMAX*0.5+0.5)*scrW,py=(0.5-y/1.32*0.5)*scrH;
  sctx.globalAlpha=alpha;
  sctx.fillStyle=col;
  sctx.beginPath();sctx.arc(px,py,2.2,0,Math.PI*2);sctx.fill();
  sctx.globalAlpha=1;scrTex.needsUpdate=true;
}

/* ---- 飞行电子 ---- */
const EGEO=new THREE.SphereGeometry(0.045,10,8);
const electrons=[];
for(let i=0;i<7;i++){
  const m=new THREE.Mesh(EGEO,eM);m.visible=false;scene.add(m);
  electrons.push({m,t:-1,zl:0,yl:0,zs:0});
}
let emitAcc=0;
function fire(){
  for(const e of electrons){
    if(e.t<0){
      e.t=0;
      const sl=sampleSlit();
      e.zs=sl;                                  // 穿过的缝
      const land=sampleLanding();
      e.zl=land.z;e.yl=land.y;
      e.m.visible=true;
      return true;
    }
  }
  return false;
}
function sampleSlit(){                          // 穿过哪条缝(等概率)
  return (Math.random()<0.5?-1:1)*(dScene/2+0.03);
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`电子枪:加速电压 ${volt} V → λ=${lambdaNM(volt).toFixed(4)} nm`,
               `gun: ${volt} V → λ=${lambdaNM(volt).toFixed(4)} nm`),v3(-4.4,2.45,0),'o');
addLabel(()=>mode==='slit'?L(`双缝:d=250 nm,Δy=λL/d`, `double slit: d=250 nm, Δy=λL/d`)
                          :L('多晶金膜:2d·sinθ=nλ,d=0.20 nm','polycrystalline Au foil: 2d·sinθ=nλ, d=0.20 nm'),
  v3(-0.5,1.65,0),'b');
addLabel(()=>L('荧光屏:斑点累积 → 条纹显影','screen: dots accumulate → fringes develop'),v3(5.4,2.2,0),'g');
addLabel(()=>L('which-path 探测:路径已知 → 相干性湮灭,条纹消失','which-path: path known → coherence destroyed'),
  v3(-0.5,-0.7,0.5),'r',()=>pathDet);
addLabel(()=>L('电子一维的概率波','electron probability wave'),v3(2.2,1.2,0),'b',()=>pathDet===false&&mode==='slit');
let notifyT=0,notifyZ='',notifyE='';
const lblNotify=addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',v3(0,2.9,0),'o');
function notify(zh,en){notifyT=3.4;notifyZ=zh;notifyE=en;}

/* ---- 直方图与反差 ---- */
const BINS=84;
const binCnt=new Array(BINS).fill(0);
function drawPlot(){
  const cv=document.getElementById('plotCv');
  const ctx=cv.getContext('2d');
  const W=cv.width=cv.clientWidth*2,H=cv.height=cv.clientHeight*2;
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const acc=css.getPropertyValue('--acc').trim()||'#ffa94d';
  const txt=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const padL=10,padR=10,padT=8,padB=20;
  const maxC=Math.max(1,...binCnt);
  const bw=(W-padL-padR)/BINS;
  for(let i=0;i<BINS;i++){
    const h=(H-padT-padB)*binCnt[i]/maxC;
    ctx.fillStyle=pathDet?'rgba(255,107,107,.75)':acc;
    ctx.fillRect(padL+i*bw,H-padB-h,bw-1,h);
  }
  ctx.strokeStyle='rgba(128,150,170,.3)';
  ctx.beginPath();ctx.moveTo(padL,H-padB);ctx.lineTo(W-padR,H-padB);ctx.stroke();
  ctx.fillStyle=txt;ctx.font='18px system-ui';
  ctx.fillText('-1.85 m',padL,H-4);ctx.fillText('+1.85 m(屏坐标,显示放大)',W-230,H-4);
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'德布罗意假说:λ=h/p,电子也是波——1927 年戴维森-革末用镍晶体验证',en:'de Broglie: λ=h/p — electrons are waves too; Davisson-Germer proved it with a nickel crystal in 1927'},
  {zh:'电压定波长:V 越高动量越大,λ=1.226/√V nm,5 kV 时仅 0.017 nm',en:'Voltage sets λ: higher V, shorter λ=1.226/√V nm — only 0.017 nm at 5 kV'},
  {zh:'双缝:一颗颗电子落点随机,斑点累积出 cos² 条纹——概率波的统计显影',en:'Double slit: random dots, one electron at a time, accumulate into cos² fringes — statistics reveal the wave'},
  {zh:'单电子也干涉:不与别的电子相干,波函数自己与自己干涉',en:'Self-interference: no other electron needed — the wavefunction interferes with itself'},
  {zh:'晶体衍射:晶面间距当三维光栅,2d·sinθ=nλ;多晶给同心环(汤姆孙)',en:'Crystal: lattice planes as a 3D grating, 2d·sinθ=nλ; powder → concentric rings (Thomson)'},
  {zh:'费曼之问:which-path 一旦可知,相干性丢失,条纹立即变双缝包络',en:'Feynman\'s question: know the path and coherence is lost — fringes vanish instantly'},
  {zh:'电镜的底牌:电子波比可见光短十万倍,才能看清原子列(0.1 nm 级)',en:'TEM\'s ace: electron waves are ~10⁵× shorter than light — enough to resolve atomic columns'},
];
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>setPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
let phase=0;
function setPhase(i){
  phase=i;syncSteps();
  if(i===4){mode='crystal';syncBtns();notify('切多晶薄膜:同心德拜环,环半径∝λ','Crystal foil: concentric Debye rings, radius ∝ λ');}
  if(i===5){pathDet=true;syncBtns();notify('which-path 探测开启:条纹消失(可以自己关掉试试)','Which-path on: fringes gone (toggle to compare)');}
  if(i===2||i===3){mode='slit';pathDet=false;syncBtns();}
  if(i===0||i===1){mode='slit';pathDet=false;syncBtns();}
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===phase));
}
function syncBtns(){
  document.getElementById('btnSlits').classList.toggle('on',mode==='slit');
  document.getElementById('btnCrystal').classList.toggle('on',mode==='crystal');
  document.getElementById('btnPath').classList.toggle('on',pathDet);
  document.getElementById('btnBurst').classList.toggle('on',burst);
}

/* ---- 统计 ---- */
function updateStats(){
  document.getElementById('stLam').innerHTML=lambdaNM(volt).toFixed(4)+'<small> nm</small>';
  document.getElementById('stN').innerHTML=N+'<small> e⁻</small>';
  /* 真实条纹间距:Δy=λL/d,L=1 m,d=250 nm */
  const dy=lambdaNM(volt)*1e-9/250e-9*1.0;
  document.getElementById('stDy').innerHTML=(dy*1e6).toFixed(0)+'<small> µm</small>';
  const el=document.getElementById('stVis');
  el.innerHTML=Math.round(vis*100)+'<small> %</small>';
  el.className='v '+(pathDet?'bad':'ok');
}

/* ---- UI ---- */
document.getElementById('btnSlits').addEventListener('click',()=>{mode='slit';syncBtns();
  notify('双缝模式:cos² 干涉条纹','Double slit: cos² fringes');});
document.getElementById('btnCrystal').addEventListener('click',()=>{mode='crystal';syncBtns();
  notify('多晶金膜:德拜-谢乐环','Au foil: Debye-Scherrer rings');});
document.getElementById('btnPath').addEventListener('click',e=>{
  pathDet=!pathDet;syncBtns();
  notify(pathDet?'探测开启:每颗电子被光子标记路径 → 反差归零':'探测关闭:相干性恢复,条纹回来',
         pathDet?'Detector on: each electron tagged → visibility dies':'Detector off: coherence restored, fringes return');
});
document.getElementById('btnBurst').addEventListener('click',()=>{burst=!burst;syncBtns();});
document.getElementById('btnSingle').addEventListener('click',()=>{burst=false;syncBtns();fire();});
document.getElementById('btnClear').addEventListener('click',()=>{
  sctx.fillStyle='#0b0e12';sctx.fillRect(0,0,scrW,scrH);scrTex.needsUpdate=true;
  N=0;binCnt.fill(0);drawPlot();
});
document.getElementById('sV').addEventListener('input',e=>{
  volt=+e.target.value;
  document.getElementById('sVVal').textContent=volt+' V';
});
document.getElementById('sRate').addEventListener('input',e=>{
  rate=+e.target.value;
  document.getElementById('sRateVal').textContent=rate+' e/s';
});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
  drawPlot();
});
function setPlayLabel(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  benchM.color.setHex(dark?0x1a1e25:0xcdc6ba);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('电子衍射与物质波 · λ=h/p 的铁证','Electron Diffraction & Matter Waves · proof of λ=h/p');
  buildSteps();setPlayLabel();updateStats();drawPlot();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0,accVis=0,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  simT+=dt0;
  if(playing){
    /* 发射 */
    if(burst){
      emitAcc+=dt0*rate*speedMul;
      while(emitAcc>=1){emitAcc-=1;fire();}
    }
    hot.material.color.setHSL(0.08,1,0.55+0.15*Math.sin(simT*20));
  }
  /* 电子飞行 */
  for(const e of electrons){
    if(e.t<0)continue;
    if(playing)e.t+=dt0*speedMul*0.55;
    const x=-4.4+e.t*L_TUBE;
    if(e.t<0.35){                              // 枪→缝:直线
      const f=e.t/0.35;
      e.m.position.set(x,0.4,0);
      if(f>=0.35)e.m.position.z=e.zs;
    }else if(e.t<1){                           // 缝→屏:展开到落点
      const f=(e.t-0.35)/0.65;
      e.m.position.set(x,0.4,e.zs+(e.zl-e.zs)*f);
      e.m.position.y=0.4+e.yl*f;
      if(e.t>=1){                              // 落屏:盖章
        e.t=-1;e.m.visible=false;
        stamp(e.zl,e.yl,pathDet?(e.zs>0?'#ff6b6b':'#74c0fc'):'#ffe08a',0.85);
        N++;
        const bin=clamp(Math.floor((e.zl/ZMAX*0.5+0.5)*BINS),0,BINS-1);
        binCnt[bin]++;
      }
    }
  }
  /* 探测器闪烁 */
  detectors.forEach((d,i)=>{d.visible=pathDet;d.material.emissiveIntensity=0.4+0.4*Math.sin(simT*7+i*2.4);});
  barrier.visible=mode==='slit';foil.visible=mode==='crystal';
  if(notifyT>0)notifyT-=dt0;
  /* 反差计算(每 0.4 s) */
  accVis+=dt0;
  if(accVis>0.4){accVis=0;
    let mx=0,mn=1e9,mi=0;
    for(let i=8;i<BINS-8;i++){
      mi+=binCnt[i];if(i%2){if(binCnt[i]>mx)mx=binCnt[i];}else if(binCnt[i]<mn)mn=binCnt[i];
    }
    const mean=mi/(BINS-16)||1;
    vis=clamp((mx-mn)/(mx+mn+1e-6),0,1);
    if(N<60)vis=1;
  }
  acc+=dt0;if(acc>0.12){acc=0;updateStats();}
  for(const r of labelReg){
    const t=r.text();const on=labelsOn&&r.vis()&&t!=='';
    r.o.visible=on;if(on)r.o.element.textContent=t;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
/* 预填:1500 颗电子的历史落点,首屏即有条纹(规则 6/7) */
for(let i=0;i<1500;i++){
  const l=sampleLanding();
  stamp(l.z,l.y,pathDet?'#ff6b6b':'#ffe08a',0.5);
  N++;
  const bin=clamp(Math.floor((l.z/ZMAX*0.5+0.5)*BINS),0,BINS-1);
  binCnt[bin]++;
}
scrTex.needsUpdate=true;
drawPlot();syncBtns();
applyTheme();applyLang();setPlayLabel();
start();
</script>
