<!DOCTYPE html>

<head>

<style>

  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}

  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  @media(max-width:1020px){#plot{display:none}}

  <div class="sub" data-zh="两种双官能单体头尾缩合，每成一根键甩出一个水分子——X̄n=1/(1-p)，分子量靠转化率一点点推高；两相界面处尼龙连续生成、一拉成绳；配比偏离 1:1 当场封顶，不除水反应就往回走 · 拖动旋转 / 空格运行/暂停" data-en="Two bifunctional monomers condense head-to-tail, ejecting one water per bond — X̄n=1/(1-p): molar mass creeps up with conversion; nylon forms continuously at the interface and pulls out as a rope; off-stoichiometry caps it, and without water removal hydrolysis runs backwards · drag to orbit / Space = run/pause">两种双官能单体头尾缩合，每成一根键甩出一个水分子——X̄n=1/(1-p)，分子量靠转化率一点点推高；两相界面处尼龙连续生成、一拉成绳；配比偏离 1:1 当场封顶，不除水反应就往回走 · 拖动旋转 / 空格运行/暂停</div>

    <a href="../vulcanization/" data-zh="硫化：交联橡胶" data-en="Vulcanization">硫化</a>

  <div id="note" data-zh="界面法用二酰氯+二胺、副产物为 HCl；工业熔融缩聚（己二酸+己二胺 → 尼龙-66）副产物才是水。右侧分子台与分布图按逐步缩合演示。" data-en="The interfacial trick uses diacid chloride + diamine (byproduct HCl); industrial melt polycondensation of adipic acid + hexamethylenediamine → nylon-66 releases water. The bench and distribution show step-growth." data-en="The interfacial trick uses diacid chloride + diamine (byproduct HCl); industrial melt polycondensation (adipic acid + hexamethylenediamine → nylon-66) releases water.">界面法用二酰氯+二胺、副产物为 HCl；工业熔融缩聚（己二酸+己二胺 → 尼龙-66）副产物才是水。右侧分子台与分布图按逐步缩合演示。</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,46);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(2.0,3.6,14);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(3.3,1.1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=34;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(4,8,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-5,4,-5);scene.add(fill);

/* ---- 材质 ---- */
const glassM=new THREE.MeshPhysicalMaterial({color:0xbcd8e8,roughness:0.08,metalness:0,transparent:true,opacity:0.16,side:THREE.DoubleSide,depthWrite:false});
const waterM=new THREE.MeshStandardMaterial({color:0x3b6fd4,transparent:true,opacity:0.55,roughness:0.25});
const oilM=new THREE.MeshStandardMaterial({color:0xc98a2e,transparent:true,opacity:0.5,roughness:0.3});
const filmM=new THREE.MeshStandardMaterial({color:0xe9f5ee,emissive:0x74dca0,emissiveIntensity:0.7,transparent:true,opacity:0.85,roughness:0.4});
const ropeM=new THREE.MeshStandardMaterial({color:0xe8d8b8,roughness:0.6});
const spoolM=new THREE.MeshStandardMaterial({color:0x6b7683,roughness:0.4,metalness:0.7});
const monoAM=new THREE.MeshStandardMaterial({color:0x4dabf7,roughness:0.35});   // 二胺(蓝)
const monoBM=new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.35});   // 二酸/酰氯(橙)
const bondM=new THREE.MeshStandardMaterial({color:0xadb5bd,roughness:0.4});
const dropM=new THREE.MeshStandardMaterial({color:0x66d9e8,transparent:true,opacity:0.9,roughness:0.2});
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});

/* ---- 状态（先声明再使用） ---- */
let playing=true,labelsOn=true,simT=0;
let mode='cond';          // cond=缩合 add=加成对照
let ratio=1.0,pConv=0.55,waterMol=1.1;   // 起始 p 预热分布图
let removeWater=true,drawK=1.0,spoolPhi=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')){const v=clamp(+qs.get('speed'),20,200);document.getElementById('sSpd').value=v;drawK=v/100;}
function xN(){return (1+ratio)/(1+ratio-2*ratio*pConv);}   // Carothers
function pCap(){return removeWater?0.995:0.78;}            // 勒夏特列：除水推高转化率

/* ---- 场景 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(20,0.3,9),groundM);
ground.position.set(2,-3.1,0);scene.add(ground);
/* 烧杯与两相（整体右移避开左下控制面板） */
const beakerG=new THREE.Group();beakerG.position.x=1.4;scene.add(beakerG);
{
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,4.2,48,1,true),glassM);
  wall.position.y=0;beakerG.add(wall);
  const bottom=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.42,0.12,48),glassM);
  bottom.position.y=-2.08;beakerG.add(bottom);
  const water=new THREE.Mesh(new THREE.CylinderGeometry(1.44,1.44,1.7,48),waterM);
  water.position.y=-1.25;beakerG.add(water);
  const oil=new THREE.Mesh(new THREE.CylinderGeometry(1.44,1.44,1.9,48),oilM);
  oil.position.y=0.55;beakerG.add(oil);
}
const film=new THREE.Mesh(new THREE.CylinderGeometry(1.45,1.45,0.045,48),filmM);
film.position.y=-0.4;scene.add(film);
/* 绕线轴 */
const spoolG=new THREE.Group();
{
  const drum=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.5,24),spoolM);
  drum.rotation.x=Math.PI/2;spoolG.add(drum);
  [-0.33,0.33].forEach(z=>{
    const f=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,0.06,24),spoolM);
    f.rotation.x=Math.PI/2;f.position.z=z;spoolG.add(f);
  });
  const arm=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.6,0.1),spoolM);
  arm.position.y=0.9;spoolG.add(arm);
}
spoolG.position.set(3.2,3.6,0);scene.add(spoolG);
/* 尼龙绳：24 段圆柱池 */
const NSEG=24,curvePts=[];
for(let i=0;i<=NSEG;i++)curvePts.push(new THREE.Vector3());
const ropeSegs=[];
for(let i=0;i<NSEG;i++){
  const s=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,1,8),ropeM);
  scene.add(s);ropeSegs.push(s);
}
const tmpA=new THREE.Vector3(),tmpB=new THREE.Vector3(),UP=new THREE.Vector3(0,1,0);
function updateRope(t){
  const spoolRim=tmpA.set(spoolG.position.x+0.5*Math.cos(spoolPhi),spoolG.position.y+0.5*Math.sin(spoolPhi),0);
  const sway=Math.sin(t*1.2)*0.22;
  for(let i=0;i<=NSEG;i++){
    const f=i/NSEG;
    const p=curvePts[i];
    p.set(1.4+0.3*f*f*2.6+sway*f*(1-f)*2.0, -0.4+f*(spoolG.position.y+0.5+0.4), 0.35*Math.sin(t*0.9+f*3.0)*f);
    if(f>0.75){const w=(f-0.75)/0.25;p.lerp(spoolRim,w);}
  }
  for(let i=0;i<NSEG;i++){
    const a=curvePts[i],b=curvePts[i+1];
    ropeSegs[i].position.copy(a).add(b).multiplyScalar(0.5);
    const d=tmpB.copy(b).sub(a);const len=Math.max(d.length(),0.02);
    ropeSegs[i].scale.set(1,len,1);
    ropeSegs[i].quaternion.setFromUnitVectors(UP,d.normalize());
  }
}
/* 绳上的重复单元珠 */
const beads=[];
for(let i=0;i<9;i++){
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.11,14,10),i%2?monoAM:monoBM);
  scene.add(b);beads.push(b);
}
/* 分子台：14 个单体槽位 */
const CHN=14;
const chainMono=[],chainBond=[];
for(let i=0;i<CHN;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.26,20,14),i%2?monoAM:monoBM);
  m.position.set(5.6+i*0.52,0.4,0);scene.add(m);chainMono.push(m);
}
for(let i=0;i<CHN-1;i++){
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.22,8),bondM);
  b.rotation.z=Math.PI/2;b.position.set(5.6+0.26+i*0.52,0.4,0);
  b.scale.y=0.001;scene.add(b);chainBond.push(b);
}
/* 水副产物液滴池 */
const drops=[];
for(let i=0;i<12;i++){
  const d=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),dropM.clone());
  d.visible=false;scene.add(d);
  drops.push({m:d,v:new THREE.Vector3(),life:0});
}
function spawnDrop(x,y){
  const d=drops.find(d=>d.life<=0);if(!d)return;
  d.life=1.1;d.m.visible=true;d.m.position.set(x,y,0);
  d.v.set((Math.random()-0.5)*0.6,1.4,0);
  d.m.material.opacity=0.9;
}
/* 标签 */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('二胺水溶液（下层）','diamine aq. (bottom)'),new THREE.Vector3(1.6,-1.9,1.5),'b');
addLabel(()=>L('二酰氯有机相（上层）','diacid chloride (top)'),new THREE.Vector3(1.6,1.05,1.5),'o');
addLabel(()=>L('界面：尼龙连续生成（副产物 HCl）','interface: nylon forms (HCl out)'),new THREE.Vector3(1.6,-0.05,1.55),'g',()=>mode==='cond');
addLabel(()=>L('尼龙绳 → 绕线轴','nylon rope → winder'),new THREE.Vector3(3.2,4.65,0),'g');
addLabel(()=>L('分子视角：一根键一个水分子','zoom: one bond, one H₂O'),new THREE.Vector3(6.9,-0.65,0),'b',()=>mode==='cond');
addLabel(()=>L('加成模式：无双副产物，链瞬间到位','addition: no byproduct, chains instantly'),new THREE.Vector3(6.9,-0.65,0),'g',()=>mode==='add');
addLabel(()=>L('水解回退！','hydrolysis reverses!'),new THREE.Vector3(6.9,1.5,0),'r',()=>!removeWater&&mode==='cond'&&pConv>0.6);

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'双官能单体：二胺+二酸，每个分子两头都能成键',en:'Bifunctional monomers: diamine + diacid, both ends reactive'},
 {zh:'逐步缩合：每成一根键甩出一个水分子——没有链式增长',en:'Step-growth: every new bond ejects one water molecule'},
 {zh:'界面聚合：尼龙在两相界面连续生成，一拉成绳（绳魔法）',en:'Interfacial polymerization: nylon forms at the interface, pulled as rope'},
 {zh:'Carothers：X̄n = 1/(1-p)——分子量靠转化率一点点推高',en:'Carothers: X̄n = 1/(1-p) — molar mass creeps up with conversion'},
 {zh:'配比封顶：r 偏离 1:1，X̄n 上限 = (1+r)/(1-r)，少量失调即报废',en:'Stoichiometry cap: X̄n ≤ (1+r)/(1-r) — slight imbalance kills MW'},
 {zh:'勒夏特列：不除水反应往回走（水解）；PET 酯交换同理需抽真空',en:'Le Chatelier: without water removal hydrolysis reverses; PET glycolysis alike'},
 {zh:'对照加成：自由基链式几秒到高分子量，分布窄、无副产物',en:'Contrast addition: radical chains hit high MW in seconds, narrow, no byproduct'},
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  if(i===0){pConv=0.05;waterMol=pConv*2;playing=false;}
  else if(i===1){pConv=0.45;playing=true;}
  else if(i===2){playing=true;}
  else if(i===3){removeWater=true;document.getElementById('btnVac').classList.add('on');playing=true;}
  else if(i===4){ratio=0.7;document.getElementById('sR').value=70;document.getElementById('sRVal').textContent='0.70';playing=true;}
  else if(i===5){removeWater=false;document.getElementById('btnVac').classList.remove('on');playing=true;}
  else {setMode('add');playing=true;}
  syncSteps();syncPlayBtn();updateStats();drawPlot();
}

/* ---- 分布图 ---- */
const cv=document.getElementById('plotCv'),ctx=cv.getContext('2d');
function drawPlot(){
  const dark=THEME==='dark';
  const W=cv.width,Hh=cv.height,pl=40,pb=26;
  ctx.clearRect(0,0,W,Hh);
  ctx.fillStyle=dark?'rgba(16,20,24,0.5)':'rgba(255,255,255,0.5)';
  ctx.fillRect(0,0,W,Hh);
  ctx.strokeStyle=dark?'rgba(255,255,255,.18)':'rgba(15,25,40,.2)';
  ctx.beginPath();ctx.moveTo(pl,10);ctx.lineTo(pl,Hh-pb);ctx.lineTo(W-8,Hh-pb);ctx.stroke();
  ctx.font='11px system-ui';ctx.fillStyle=dark?'#9fb0c3':'#5b6b7d';
  ctx.fillText(L('链长 n →','chain length n →'),W-96,Hh-8);
  ctx.save();ctx.translate(12,Hh/2+26);ctx.rotate(-Math.PI/2);
  ctx.fillText(L('质量分数','mass fraction'),0,0);ctx.restore();
  if(mode==='add'){
    const bx=W-pl-30;
    for(let i=0;i<10;i++){
      const h=90*Math.exp(-Math.pow(i-4.5,2)/6);
      ctx.fillStyle='#8ce99a';
      ctx.fillRect(bx-24+i*5,Hh-pb-h,4,h);
    }
    ctx.fillStyle='#8ce99a';
    ctx.fillText(L('n≈120，分布极窄（瞬间到位）','n≈120, razor-sharp'),bx-120,Hh-pb-100);
    return;
  }
  const N=24;
  let maxF=0.0001;
  const fr=[];
  for(let n=1;n<=N;n++){
    const m=n*Math.pow(1-pConv,2)*Math.pow(pConv,n-1);
    fr.push(m);if(m>maxF)maxF=m;
  }
  const bw=(W-pl-16)/N;
  fr.forEach((m,idx)=>{
    const h=(Hh-pb-16)*m/maxF;
    ctx.fillStyle=idx%2?'#4dabf7':'#ffa94d';
    ctx.fillRect(pl+idx*bw+1,Hh-pb-h,bw-2,h);
  });
  ctx.fillStyle=dark?'#ffd8a8':'#a34e00';
  ctx.fillText('p='+pConv.toFixed(2)+'  峰位 n*≈'+Math.max(1,Math.round(1/(1-pConv))),pl+4,Hh-pb-6);
}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stP').innerHTML=(pConv*100).toFixed(1)+'<small> %</small>';
  const x=xN();
  const elX=document.getElementById('stX');
  elX.innerHTML=x.toFixed(1)+(ratio<0.99&&pConv>0.9?'<small> (封顶)</small>':'');
  elX.className='v'+(x>=80?' ok':(x<10?' warn':''));
  document.getElementById('stR').textContent=ratio.toFixed(2);
  document.getElementById('stW').innerHTML=mode==='add'?'—':waterMol.toFixed(2)+'<small> mol '+L('水','H₂O')+'</small>';
}

/* ---- 事件 ---- */
function setMode(m){
  mode=m;
  document.getElementById('btnCond').classList.toggle('on',m==='cond');
  document.getElementById('btnAdd').classList.toggle('on',m==='add');
}
document.getElementById('btnCond').addEventListener('click',()=>{setMode('cond');updateStats();drawPlot();});
document.getElementById('btnAdd').addEventListener('click',()=>{setMode('add');updateStats();drawPlot();});
document.getElementById('btnVac').addEventListener('click',e=>{
  removeWater=!removeWater;e.target.classList.toggle('on',removeWater);
  updateStats();
});
document.getElementById('btnReset').addEventListener('click',()=>{pConv=0.12;waterMol=pConv*2;ratio=1;document.getElementById('sR').value=100;document.getElementById('sRVal').textContent='1.00';updateStats();drawPlot();});
document.getElementById('sR').addEventListener('input',e=>{ratio=+e.target.value/100;document.getElementById('sRVal').textContent=ratio.toFixed(2);updateStats();});
document.getElementById('sSpd').addEventListener('input',e=>{drawK=+e.target.value/100;document.getElementById('sSpdVal').textContent=drawK.toFixed(1)+'×';});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  drawPlot();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();updateStats();drawPlot();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    /* 转化率演化：除水→推向 0.995；不除水→平衡在 0.78（水解回退） */
    const target=pCap();
    pConv+=(target-pConv)*(mode==='add'?2.4:0.10*drawK)*dt;
    pConv=clamp(pConv,0.01,0.998);
    waterMol=pConv*2;
    /* 缩合：成键进度 → 分子台；过阈值时喷水滴 */
    for(let i=0;i<CHN-1;i++){
      const th=(i+1)/(CHN)*(mode==='add'?1.02:1.0);
      const b=chainBond[i];
      const on=pConv>=(i+1)/(CHN+1)*0.99;
      b.scale.y+=(((pConv>=(i+1)/(CHN+0.5))?1:0.001)-b.scale.y)*Math.min(1,dt*(mode==='add'?14:5));
      if(b.scale.y>0.5&&b.userData.wet!==true){
        b.userData.wet=true;
        if(mode==='cond')spawnDrop(b.position.x,b.position.y+0.22);
      }else if(b.scale.y<0.05){b.userData.wet=false;}
    }
  }
  /* 液滴物理 */
  for(const d of drops){
    if(d.life<=0)continue;
    d.life-=dt;
    d.v.y-=2.6*dt;
    d.m.position.addScaledVector(d.v,dt);
    if(d.m.position.y<-2.0)d.life=0;
    d.m.material.opacity=clamp(d.life,0,0.9);
    if(d.life<=0)d.m.visible=false;
  }
  /* 界面微光脉动 */
  filmM.emissiveIntensity=0.55+0.3*Math.sin(simT*3);
  /* 绳与绕轴 */
  spoolPhi+=dt*2.4*drawK;
  spoolG.rotation.z=spoolPhi;
  updateRope(simT);
  beads.forEach((b,i)=>{
    const f=(simT*0.11*drawK+i/9)%1;
    const idx=Math.min(NSEG-1,Math.floor(f*NSEG));
    const a=curvePts[idx],b2=curvePts[idx+1];
    b.position.lerpVectors(a,b2,(f*NSEG)%1);
  });
  acc+=dt;if(acc>0.1){acc=0;updateStats();drawPlot();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化：预填分布与成键（避免首屏空图） ---- */
applyTheme();buildSteps();
for(let i=0;i<CHN-1;i++)chainBond[i].scale.y=pConv>=(i+1)/(CHN+0.5)?1:0.001;
drawPlot();updateStats();syncPlayBtn();start();
</script>
