<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熵与混合 · 均匀的排法压倒性多</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#74c0fc;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1971c2;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.a { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.b { border-color: rgba(255,169,77,.9); color: #ffd9a3; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.a { border-color: rgba(25,113,194,.9); color: #1971c2; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #74c0fc; }
  #mixmeter { grid-column: 1 / 3; margin-top: 6px; }
  #mixmeter .bar { height: 13px; border-radius: 5px; background: rgba(128,140,155,.16); overflow: hidden; }
  #mixmeter .bar i { display: block; height: 100%; background: rgba(116,192,252,.8); width: 0%; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(116,192,252,.12); color: var(--text); border: 1px solid rgba(116,192,252,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.warn { background: rgba(255,169,77,.12); border-color: rgba(255,169,77,.5); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(116,192,252,.10); border-color: rgba(116,192,252,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(25,113,194,.08); border-color: rgba(25,113,194,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #a5d8ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="熵与混合：均匀的排法压倒性多" data-en="Entropy: the mixed-up ways outnumber everything">熵与混合：均匀的排法压倒性多</h1>
  <div class="sub" data-zh="抽掉隔板,两种气体自动混匀、从不自动分开——不是力,是计数:微观态数多的宏观态压倒性胜出 · 空格播放/暂停" data-en="Pull the partition and the gases mix, never un-mix — not a force, just counting: mixed microstates outnumber all else · Space = play/pause">抽掉隔板,两种气体自动混匀、从不自动分开——不是力,是计数:微观态数多的宏观态压倒性胜出 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="混合熵 S" data-en="mixing entropy S">混合熵 S</span><span class="v g" id="stS">—</span>
  <span class="k" data-zh="左侧 A 占比" data-en="A on left">左侧 A 占比</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="已模拟步数" data-en="steps">已模拟步数</span><span class="v" id="stT">0</span>
  <div id="mixmeter">
    <div class="bar"><i id="mixFill"></i></div>
  </div>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnPull" data-zh="抽掉隔板!" data-en="pull the partition!">抽掉隔板!</button>
    <button class="abtn warn" id="btnRewind" data-zh="时间反演实验" data-en="time-reverse test">时间反演实验</button>
  </div>
  <div class="row"><label data-zh="粒子数" data-en="particles">粒子数</label><input id="pn" type="range" min="40" max="240" step="20" value="120"><span class="val" id="pnVal">120</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.5" max="4" step="0.5" value="1.5"><span class="val" id="spdVal">1.5×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../galton-board/" data-zh="伽尔顿板:随机长出规律" data-en="Galton board: randomness → law">伽尔顿板:随机长出规律</a>
    <a href="../kinetic-theory/" data-zh="分子动理论:热是什么" data-en="kinetic theory: what heat is">分子动理论:热是什么</a>
    <a href="../carnot-cycle/" data-zh="卡诺:熵的天花板" data-en="Carnot: entropy's ceiling">卡诺:熵的天花板</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('熵与混合', 'Entropy & Mixing');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 1.6, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.4, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.07, roughness: 0.1, side: THREE.DoubleSide }),
  partA: new THREE.MeshBasicMaterial({ color: 0x74c0fc }),
  partB: new THREE.MeshBasicMaterial({ color: 0xffa94d }),
  partition: mat(0xffd166, { metalness: 0.4, roughness: 0.4 }),
};

/* ================= 容器与粒子 ================= */
const BOX = { x0: -1.6, x1: 2.6, y0: 0.2, y1: 2.4, z0: -0.8, z1: 0.8 };
const MID = 0.5;
const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.16, 4), M.floor);
floor.position.set(0.5, -0.1, 0);
scene.add(floor);
for (const [w, h, d, x, y, z] of [
  [BOX.x1 - BOX.x0, 0.05, BOX.z1 - BOX.z0, 0, BOX.y0, 0],
  [BOX.x1 - BOX.x0, 0.05, BOX.z1 - BOX.z0, 0, BOX.y1, 0],
  [0.05, BOX.y1 - BOX.y0, BOX.z1 - BOX.z0, BOX.x0, (BOX.y0 + BOX.y1) / 2, 0],
  [0.05, BOX.y1 - BOX.y0, BOX.z1 - BOX.z0, BOX.x1, (BOX.y0 + BOX.y1) / 2, 0],
  [BOX.x1 - BOX.x0, BOX.y1 - BOX.y0, 0.05, 0, (BOX.y0 + BOX.y1) / 2, BOX.z0],
  [BOX.x1 - BOX.x0, BOX.y1 - BOX.y0, 0.05, 0, (BOX.y0 + BOX.y1) / 2, BOX.z1]]) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M.glass);
  m.position.set(x, y, z);
  scene.add(m);
}
/* 隔板 */
const partition = new THREE.Mesh(new THREE.BoxGeometry(0.05, BOX.y1 - BOX.y0, BOX.z1 - BOX.z0), M.partition);
partition.position.set(MID, (BOX.y0 + BOX.y1) / 2, 0);
scene.add(partition);

/* 粒子(instanced,双色) */
let N = 120;
const meshA = new THREE.InstancedMesh(new THREE.SphereGeometry(0.055, 10, 8), M.partA, 240);
const meshB = new THREE.InstancedMesh(new THREE.SphereGeometry(0.055, 10, 8), M.partB, 240);
scene.add(meshA); scene.add(meshB);
const m4 = new THREE.Matrix4();
const parts = [];
function seed() {
  parts.length = 0;
  const half = N / 2;
  for (let i = 0; i < N; i++) {
    const left = i < half;
    parts.push({
      p: new THREE.Vector3(left ? rand(BOX.x0 + 0.12, MID - 0.12) : rand(MID + 0.12, BOX.x1 - 0.12), rand(BOX.y0 + 0.12, BOX.y1 - 0.12), rand(BOX.z0 + 0.12, BOX.z1 - 0.12)),
      v: new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(0.85),
      kind: left ? 0 : 1,     // 0=A(左蓝) 1=B(右橙)
    });
  }
}

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let spd = 1.5;
let pulled = false;
let rewinding = false;
let steps = 0;
let tSim = 0;
function mixingFrac() {
  /* 混合度:处于「对方一侧」的粒子比例 */
  let cross = 0;
  for (const p of parts) {
    if (p.kind === 0 && p.p.x > MID) cross++;
    if (p.kind === 1 && p.p.x < MID) cross++;
  }
  return cross / parts.length * 2;   // 0..1
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblA = addLabel(() => L('A 气体(蓝)', 'gas A (blue)'), new THREE.Vector3(-1.0, 2.85, 0), 'a');
const lblB = addLabel(() => L('B 气体(橙)', 'gas B (orange)'), new THREE.Vector3(1.8, 2.85, 0), 'b');
const lblStatus = addLabel(() => pulled
  ? rewinding ? L('时间反演中:所有粒子正在精确倒带…', 'time reversed: every particle rewinding exactly…')
  : L('混匀了?再等多久它也不会自己分开', 'mixed? wait forever — it will not un-mix')
  : L('两侧各自撞来撞去,隔板挡着不串门', 'each side bounces within its own half'),
  new THREE.Vector3(0.5, 3.2, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '两侧各自为政', be: 'Two halves, separate lives',
    d: '隔板挡着,蓝橙互不串门——每种排法都是允许的,暂时。',
    de: 'The partition keeps blue and orange apart — every arrangement is allowed, for now.',
    act: () => { pulled = false; partition.visible = true; partition.position.y = (BOX.y0 + BOX.y1) / 2; seed(); rewinding = false; steps = 0; } },
  { b: '抽掉隔板:扩散', be: 'Pull the partition: diffusion',
    d: '隔板一撤,粒子带着速度自由穿梭——没有谁「推」它们混,纯粹是自由运动的结果。',
    de: 'Partition gone, particles wander freely — nothing pushes them to mix; it is just free motion.',
    act: () => { pulled = true; partition.visible = false; rewinding = false; } },
  { b: '熵只升不降', be: 'Entropy only climbs',
    d: '混合度计量表冲向高位就停在那里:「均匀」的微观排法数量压倒性多——回归分区的概率小到宇宙年龄等不起。',
    de: 'The meter slams high and stays: mixed arrangements outnumber ordered ones so hard that un-mixing would outwait the universe.',
    act: () => { pulled = true; partition.visible = false; rewinding = false; } },
  { b: '时间反演实验', be: 'The time-reverse test',
    d: '让所有粒子速度精确反向:物理定律不反对它「分开」——但概率小得荒谬。热力学第二定律是统计的,不是禁令。',
    de: 'Reverse every velocity exactly: the laws allow un-mixing — the odds are simply absurd. The second law is statistics, not a ban.',
    act: () => { if (pulled) { rewinding = true; pulled = true; } } },
  { b: '第二定律的实用面', be: 'The second law, practical side',
    d: '热量自发从热流向冷、气体自发扩散、墨水自发混匀——全都因为「结局的排法更多」。卡诺效率的天花板也站在这条律上。',
    de: 'Heat flows hot→cold, gases spread, ink mixes — all because endings outnumber beginnings. Carnot\'s ceiling stands on this law too.',
    act: () => { pulled = true; partition.visible = false; rewinding = false; } },
];
function stepIndex() {
  if (rewinding) return 3;
  if (mixingFrac() > 0.75) return 2;
  if (pulled) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elPn = document.getElementById('pn');
const elPnVal = document.getElementById('pnVal');
const btnPull = document.getElementById('btnPull');
const btnRewind = document.getElementById('btnRewind');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stS = document.getElementById('stS'), stL = document.getElementById('stL'),
  stT = document.getElementById('stT');
const mixFill = document.getElementById('mixFill');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnPull.addEventListener('click', () => {
  pulled = true;
  partition.visible = false;
  rewinding = false;
});
btnRewind.addEventListener('click', () => {
  if (!pulled) return;
  rewinding = true;
  for (const p of parts) p.v.multiplyScalar(-1);
});
elPn.addEventListener('input', () => { N = parseInt(elPn.value, 10); elPnVal.textContent = elPn.value; seed(); });
elSpd.value = spd;
elSpdVal.textContent = spd.toFixed(1) + '×';
elSpd.addEventListener('input', () => { spd = parseFloat(elSpd.value); elSpdVal.textContent = spd.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * spd;
  if (playing) tSim += dts;

  if (playing) {
    steps++;
    for (const p of parts) {
      p.p.addScaledVector(p.v, dts * 0.9);
      if (p.p.x < BOX.x0 + 0.06) { p.p.x = BOX.x0 + 0.06; p.v.x = Math.abs(p.v.x); }
      if (p.p.x > BOX.x1 - 0.06) { p.p.x = BOX.x1 - 0.06; p.v.x = -Math.abs(p.v.x); }
      if (p.p.y < BOX.y0 + 0.06) { p.p.y = BOX.y0 + 0.06; p.v.y = Math.abs(p.v.y); }
      if (p.p.y > BOX.y1 - 0.06) { p.p.y = BOX.y1 - 0.06; p.v.y = -Math.abs(p.v.y); }
      if (p.p.z < BOX.z0 + 0.06) { p.p.z = BOX.z0 + 0.06; p.v.z = Math.abs(p.v.z); }
      if (p.p.z > BOX.z1 - 0.06) { p.p.z = BOX.z1 - 0.06; p.v.z = -Math.abs(p.v.z); }
      /* 未抽隔板时中间不可穿越 */
      if (!pulled) {
        if (p.kind === 0 && p.p.x > MID - 0.08) { p.p.x = MID - 0.08; p.v.x = -Math.abs(p.v.x); }
        if (p.kind === 1 && p.p.x < MID + 0.08) { p.p.x = MID + 0.08; p.v.x = Math.abs(p.v.x); }
      }
    }
    if (rewinding && mixingFrac() < 0.03) rewinding = false;
  }

  /* 渲染:kind=0 → meshA,kind=1 → meshB */
  let ia = 0, ib = 0;
  for (const p of parts) {
    m4.makeScale(1, 1, 1);
    m4.setPosition(p.p);
    if (p.kind === 0) meshA.setMatrixAt(ia++, m4);
    else meshB.setMatrixAt(ib++, m4);
  }
  for (let i = ia; i < 240; i++) { m4.makeScale(0.001, 0.001, 0.001); meshA.setMatrixAt(i, m4); }
  for (let i = ib; i < 240; i++) { m4.makeScale(0.001, 0.001, 0.001); meshB.setMatrixAt(i, m4); }
  meshA.instanceMatrix.needsUpdate = true;
  meshB.instanceMatrix.needsUpdate = true;

  const mix = mixingFrac();
  stS.innerHTML = (mix * 100).toFixed(0) + '<small> %(最大混合)</small>';
  stL.innerHTML = Math.round(mixingFrac() * 50) + '<small> %</small>';
  stT.textContent = steps;
  mixFill.style.width = (mix * 100).toFixed(1) + '%';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

seed();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
