<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑洞与潮汐撕扯 · 事件视界与面条化</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffb454;
    --bg:#10151c; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a06a12;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,180,84,.9); color: #ffe0ae; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(160,106,18,.9); color: #8a5c0d; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: var(--hot); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,180,84,.6); background: rgba(255,180,84,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(160,106,18,.55); background: rgba(160,106,18,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,180,84,.10); border-color: rgba(255,180,84,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(160,106,18,.08); border-color: rgba(160,106,18,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="黑洞与潮汐撕扯:引力梯度把星拉成面条" data-en="Black hole & spaghettification: the gradient pulls a noodle">黑洞与潮汐撕扯:引力梯度把星拉成面条</h1>
  <div class="sub" data-zh="引力按 1/r² 衰减,头脚受力之差却按 1/r³ 爆炸——逼近黑洞,星体被拉长压扁成面条;视界 r=2GM/c² 处逃逸速度达光速,小黑洞视界外先撕碎、大黑洞先穿后撕 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Gravity falls as 1/r², but the head-to-foot force difference explodes as 1/r³ — near a black hole a star is stretched and squeezed into a noodle; at the horizon r=2GM/c² escape speed hits light speed; small holes shred first, giants let you cross · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">引力按 1/r² 衰减，头脚受力之差却按 1/r³ 爆炸——逼近黑洞，星体被拉长压扁成面条；视界 r=2GM/c² 处逃逸速度达光速，小黑洞视界外先撕碎、大黑洞先穿后撕 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="潮汐加速度差 Δa" data-en="tidal Δa">潮汐加速度差 Δa</span><span class="v hot" id="stDa" style="font-size:14px">—</span>
  <span class="k" data-zh="径向拉伸比" data-en="radial stretch">径向拉伸比</span><span class="v" id="stSt">—</span>
  <span class="k" data-zh="到视界 r−rs" data-en="to horizon r−rs">到视界 r−rs</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="红移因子 1+z" data-en="redshift 1+z">红移因子 1+z</span><span class="v" id="stZ">—</span>
  <span class="k" data-zh="固有时 τ / 坐标时 t" data-en="proper τ / coord t">固有时 τ / 坐标时 t</span><span class="v" id="stTt" style="font-size:13px">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn on" id="btnM1" data-zh="恒星级 10 M☉" data-en="stellar 10 M☉">恒星级 10 M☉</button>
    <button class="abtn" id="btnM6" data-zh="超大质量 10⁶ M☉" data-en="supermassive 10⁶ M☉">超大质量 10⁶ M☉</button>
    <button class="abtn on" id="btnVO" data-zh="外部视角" data-en="outside view">外部视角</button>
    <button class="abtn" id="btnVI" data-zh="坠落者视角" data-en="infaller view">坠落者视角</button>
    <button class="abtn on" id="btnBS" data-zh="落体:恒星" data-en="body: star">落体:恒星</button>
    <button class="abtn" id="btnBA" data-zh="落体:宇航员" data-en="body: astronaut">落体:宇航员</button>
    <button class="abtn" id="btnRst" data-zh="重新释放" data-en="release again">重新释放</button>
  </div>
  <div class="row"><label data-zh="释放距离" data-en="Release distance">释放距离</label><input id="r0" type="range" min="3.5" max="16" step="0.5" value="9"><span class="val" id="r0Val">9 rs</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../tides/" data-zh="同款梯度:月球拉出两个潮峰" data-en="same gradient: the Moon raises two bulges">同款梯度:月球拉出两个潮峰</a>
    <a href="../spacetime-curvature/" data-zh="网格下陷与测地线" data-en="dented mesh & geodesics">网格下陷与测地线</a>
    <a href="../time-dilation/" data-zh="视界旁的钟慢" data-en="clocks slow near the horizon">视界旁的钟慢</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
function sci(x) {
  if (!isFinite(x)) return '∞';
  if (x <= 0) return '0';
  const e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
  const es = String(e).split('').map(c => c === '-' ? '⁻' : SUP[+c]).join('');
  return m.toFixed(1) + '×10' + es;
}

/* ---------------- 物理常数 ---------------- */
const G = 6.674e-11, C = 2.998e8, MSUN = 1.989e30;
const RB = 3.2;                       // 自由落体速率标定(场景单位)
const KM_ST = 0.5, KM_SMB = 0.03;     // 潮汐形变强度:视界处 ∝ 1/M²(10⁶ M☉ 弱 10¹⁰ 倍)

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0x1a2230 : 0x040608);
  M.grid.color.set(THEME === 'light' ? 0x7c94b8 : 0x3d6ea8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('黑洞与潮汐撕扯', 'Black Hole & Spaghettification');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 300);
camera.position.set(3.0, 2.5, 9.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.5, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.8;
controls.maxDistance = 40;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(5, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.35);
fill.position.set(-6, 3, -5);
scene.add(fill);
const glow = new THREE.PointLight(0xff9a4d, 1.2, 14);
scene.add(glow);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  grid: new THREE.MeshBasicMaterial({ color: 0x3d6ea8, wireframe: true, transparent: true, opacity: 0.4 }),
  hole: new THREE.MeshBasicMaterial({ color: 0x000000 }),
  horizon: new THREE.MeshBasicMaterial({ color: 0xff7a5c, transparent: true, opacity: 0.7 }),
  photon: new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.35,
    blending: THREE.AdditiveBlending, depthWrite: false }),
  diskIn: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.55,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }),
  diskOut: new THREE.MeshBasicMaterial({ color: 0xff8a3d, transparent: true, opacity: 0.22,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }),
  star: mat(0xffe9b0, { emissiveIntensity: 1.1, roughness: 0.35 }),
  astro: mat(0xd8e2ea, { emissiveIntensity: 0.35, roughness: 0.4 }),
  foot: new THREE.MeshBasicMaterial({ color: 0xff7a5c, transparent: true, opacity: 0.95 }),
  head: new THREE.MeshBasicMaterial({ color: 0xffb454, transparent: true, opacity: 0.8 }),
  squeeze: new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.75 }),
  pack: new THREE.MeshBasicMaterial({ color: 0xfff2b0, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false }),
};

/* ================= 时空网格(下陷) ================= */
const GRIDN = 44;
const grid = new THREE.Mesh(new THREE.PlaneGeometry(30, 30, GRIDN, GRIDN).rotateX(-Math.PI / 2), M.grid);
grid.position.y = 0;
scene.add(grid);
function updateGrid() {
  const pos = grid.geometry.attributes.position;
  const sig = 1.15 * rsVis, dip = MASS === 'smb' ? 3.4 : 2.6;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const r2 = (x * x + z * z) / (2 * sig * sig);
    pos.setY(i, Math.max(-5.4, -2.0 - dip * Math.exp(-r2)));
  }
  pos.needsUpdate = true;
}

/* ================= 黑洞:黑球 + 视界环 + 光子球 + 吸积盘 ================= */
const RS_BASE = 0.55;                 // 场景基准 rs;恒星级=1×,超大质量=2.27×
let rsVis = RS_BASE;
const bhGroup = new THREE.Group();
scene.add(bhGroup);
const hole = new THREE.Mesh(new THREE.SphereGeometry(0.53, 48, 32), M.hole);
const horizonRing = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.014, 8, 96).rotateX(Math.PI / 2), M.horizon);
const photonRing = new THREE.Mesh(new THREE.TorusGeometry(0.825, 0.008, 6, 96).rotateX(Math.PI / 2), M.photon);
const diskTilt = new THREE.Group();
diskTilt.rotation.x = -Math.PI / 2 + 0.42;
diskTilt.rotation.z = 0.12;
const diskSpin = new THREE.Group();
const diskIn = new THREE.Mesh(new THREE.RingGeometry(0.69, 1.1, 72), M.diskIn);
const diskOut = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.85, 72), M.diskOut);
diskSpin.add(diskIn, diskOut);
diskTilt.add(diskSpin);
bhGroup.add(hole, horizonRing, photonRing, diskTilt);

/* ---------------- 状态 ---------------- */
let MASS = qsFloat('mass', 10) >= 1e5 ? 'smb' : 'st';
let VIEW = qs.get('view') === 'in' ? 'in' : 'out';
let BODY = qs.get('body') === 'astro' ? 'astro' : 'star';
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let r0N = 9, rN = 9, tau = 0, tC = 0;
let frozen = false, dead = false, alpha = 1;
let labelsOn = true;
const massSolar = () => MASS === 'smb' ? 1e6 : 10;
const kM = () => MASS === 'smb' ? KM_SMB : KM_ST;
const rsMeters = () => 2 * G * massSolar() * MSUN / (C * C);
const Lbody = () => BODY === 'star' ? 1.4e9 : 4;
const stretchE = () => kM() / (rN * rN * rN);
const stretchS = () => 1 + 4.5 * Math.min(stretchE(), 1.35);

/* ---------------- 落体:恒星 / 宇航员舱(顶点形变) ---------------- */
const starG = new THREE.Group();
scene.add(starG);
const starGeo = new THREE.SphereGeometry(0.17, 28, 20);
const astroGeo = new THREE.CapsuleGeometry(0.05, 0.14, 4, 12).rotateZ(Math.PI / 2);
const starMesh = new THREE.Mesh(starGeo, M.star);
const astroMesh = new THREE.Mesh(astroGeo, M.astro);
starG.add(starMesh, astroMesh);
const baseStar = starGeo.attributes.position.array.slice();
const baseAstro = astroGeo.attributes.position.array.slice();
function deform(geo, base, S, Ss) {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setXYZ(i, base[i * 3] * S, base[i * 3 + 1] * Ss, base[i * 3 + 2] * Ss);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

/* ---------------- 力差箭头:脚 > 头 + 横向挤压 ---------------- */
function cone(colorMat) {
  const g = new THREE.ConeGeometry(0.045, 1, 8);
  g.translate(0, 0.5, 0);
  const m = new THREE.Mesh(g, colorMat);
  scene.add(m);
  return m;
}
const footArr = cone(M.foot), headArr = cone(M.head);
footArr.rotation.z = Math.PI / 2; headArr.rotation.z = Math.PI / 2;   // 指向 −x(黑洞)
const sqT = cone(M.squeeze), sqB = cone(M.squeeze);                   // 横向挤压

/* ---------------- 光子包(InstancedMesh) ---------------- */
const NPACK = 42;
const packs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.035, 6, 5), M.pack, NPACK);
packs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(packs);
const packP = Array.from({ length: NPACK }, () => ({ alive: false, pr: 1, py: 0, pz: 0 }));
const dummy = new THREE.Object3D();
let packAcc = 0;
function spawnPack() {
  const s = packP.find(x => !x.alive);
  if (!s) return;
  s.alive = true;
  s.pr = Math.max(rN - 0.31 * stretchS() - 0.04, 0.06);
  s.py = (Math.random() - 0.5) * 0.09;
  s.pz = (Math.random() - 0.5) * 0.09;
}
function updatePacks(dtc) {
  for (let i = 0; i < NPACK; i++) {
    const s = packP[i];
    if (s.alive) {
      s.pr += 1.3 * (1 - 1 / s.pr) * dtc;          // 光速爬升:视界内自动折返坠落
      if (s.pr > 19 || s.pr < 0.05) s.alive = false;
      const dim = Math.pow(clamp(1 - 1 / s.pr, 0.02, 1), 0.7);
      dummy.position.set(s.pr * rsVis, s.py, s.pz);
      dummy.scale.setScalar(s.alive ? Math.max(dim, 0.02) : 0.0001);
    } else { dummy.position.set(0, -60, 0); dummy.scale.setScalar(0.0001); }
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    packs.setMatrixAt(i, dummy.matrix);
  }
  packs.instanceMatrix.needsUpdate = true;
}

/* ---------------- 物理推进 ---------------- */
function advance(h) {
  const f = Math.sqrt(Math.max(0, 1 - 1 / rN));
  let dtau, dtc;
  if (VIEW === 'out') { dtau = h * f; dtc = h; } else { dtau = h; dtc = h / Math.max(f, 1e-3); }
  const v = RB * Math.sqrt(Math.max(0, 1 / rN - 1 / r0N));
  rN = Math.max(0.02, rN - v * dtau);
  tau += dtau; tC += dtc;
  if (VIEW === 'out' && rN - 1 < 0.004) frozen = true;
}
function release() {
  r0N = +elR0.value;
  elR0Val.textContent = r0N + ' rs';
  rN = r0N; tau = 0; tC = 0;
  frozen = false; dead = false; alpha = 1;
  for (const s of packP) s.alive = false;
  playing = true; setPlayLabel();
}
function ffTime(sec) {
  let g = 0, acc = 0;
  while (acc < sec && g++ < 20000) { advance(0.03); acc += 0.03; }
}
function ffTo(target) {
  let g = 0;
  while (rN > target && g++ < 15000) advance(0.04);
}

function stepIndex() {
  if (VIEW === 'out' && frozen) return 5;
  if (MASS === 'smb' && rN < 1.5) return 4;
  if (rN < 1.25) return 3;
  if (rN < 3.4) return 2;
  if (rN < 6.5) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;

function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function updateFormula() {
  const da = 2 * G * massSolar() * MSUN * Lbody() / Math.pow(rN * rsMeters(), 3);

}

/* ---------------- 相机过渡 ---------------- */
const camP0 = new THREE.Vector3(), camT0 = new THREE.Vector3(), camP1 = new THREE.Vector3(), camT1 = new THREE.Vector3();
let camK = 1;

/* ---------------- 图形更新 ---------------- */
const tmpC1 = new THREE.Color(0xffe9b0), tmpC2 = new THREE.Color(0xff5136);
function updateVisuals(dt, dtau) {
  const S = stretchS(), Ss = Math.max(1 / Math.sqrt(S), 0.3);
  starG.position.set(rN * rsVis, 0, 0);
  deform(starGeo, baseStar, S, Ss);
  deform(astroGeo, baseAstro, S, Ss);
  /* 冻结/坠亡淡出 */
  if (frozen || dead) { alpha = Math.max(0, alpha - dt * 0.45); }
  else if (VIEW === 'in' && rN < 0.35) alpha = clamp(rN / 0.35, 0, 1);
  else alpha = 1;
  M.star.opacity = M.astro.opacity = alpha;
  M.foot.opacity = 0.95 * alpha; M.head.opacity = 0.8 * alpha; M.squeeze.opacity = 0.75 * alpha;
  /* 红移变色与变暗(外部视角) */
  if (VIEW === 'out') {
    const z = rN > 1.000001 ? Math.min(1 / (1 - 1 / rN), 30) : 30;
    M.star.color.copy(tmpC1).lerp(tmpC2, clamp((z - 1) / 11, 0, 1));
    const dim = Math.pow(clamp(1 - 1 / rN, 0.02, 1), 1.5);
    M.star.emissiveIntensity = 0.15 + 0.95 * dim;
    M.astro.emissiveIntensity = 0.05 + 0.3 * dim;
  } else {
    M.star.color.copy(tmpC1);
    M.star.emissiveIntensity = 1.1; M.astro.emissiveIntensity = 0.35;
  }
  /* 力差箭头 */
  const show = alpha > 0.1 && rN < 9;
  footArr.visible = headArr.visible = sqT.visible = sqB.visible = show;
  if (show) {
    const offN = 0.31 * S, rF = Math.max(rN - offN, 0.06), rH = rN + offN;
    const len = ri => clamp(kM() * 40 / (ri * ri), 0.12, 1.5);
    footArr.position.set(rF * rsVis, 0, 0);
    footArr.scale.set(1, len(rF), 1);
    headArr.position.set(rH * rsVis, 0, 0);
    headArr.scale.set(1, len(rH), 1);
    const ls = clamp(0.6 * (S - 1) * 2, 0.04, 0.9);
    sqT.position.set(rN * rsVis, 0.17 * Ss, 0);
    sqT.rotation.z = Math.PI;
    sqT.scale.set(1, ls, 1);
    sqB.position.set(rN * rsVis, -0.17 * Ss, 0);
    sqB.rotation.z = 0;
    sqB.scale.set(1, ls, 1);
  }
  /* 光子包 */
  if (playing && alpha > 0.3 && rN < 14) {
    packAcc += dtau;
    while (packAcc > 0.1) { packAcc -= 0.1; spawnPack(); }
  }
  updatePacks(dtau);
  /* 视界环脉冲 / 吸积盘旋转 / 中心辉光 */
  M.horizon.opacity = 0.55 + 0.3 * Math.sin(performance.now() / 300) + (rN < 1.3 && !frozen ? 0.15 : 0);
  diskSpin.rotation.z += dt * (playing ? 0.25 : 0.06);
  glow.intensity = 1.0 + 0.3 * Math.sin(performance.now() / 500);
  /* 坠落者视角相机跟随 */
  if (VIEW === 'in' && !dead && rN > 0.25) {
    const desired = new THREE.Vector3((rN + 1.5) * rsVis, 0.5, 1.2);
    const k = 1 - Math.exp(-dt * 4);
    camera.position.lerp(desired, k);
    controls.target.lerp(starG.position, k);
  }
  /* 相机过渡(外部) */
  if (VIEW === 'out' && camK < 1) {
    camK = clamp(camK + dt / 0.9, 0, 1);
    const e = camK * camK * (3 - 2 * camK);
    camera.position.lerpVectors(camP0, camP1, e);
    controls.target.lerpVectors(camT0, camT1, e);
  }
  controls.autoRotate = tglRotate.checked && VIEW === 'out' && !frozen;
}

function updateReadouts() {
  const da = 2 * G * massSolar() * MSUN * Lbody() / Math.pow(rN * rsMeters(), 3);
  const z = rN > 1.000001 ? 1 / (1 - 1 / rN) : Infinity;
  document.getElementById('stDa').innerHTML = sci(da) + '<small> m/s²</small>';
  document.getElementById('stSt').innerHTML = '×' + stretchS().toFixed(2);
  const dR = Math.max(rN - 1, 0), dKm = dR * rsMeters() / 1e3;
  document.getElementById('stR').innerHTML = dR.toFixed(2) + ' rs' +
    `<small>(${dKm < 1000 ? dKm.toFixed(0) : sci(dKm)} km)</small>`;
  document.getElementById('stZ').textContent = rN > 1.000001 ? (z < 1000 ? z.toFixed(1) : '∞') : '∞';
  document.getElementById('stTt').textContent = tau.toFixed(1) + ' s / ' + (tC < 1e4 ? tC.toFixed(1) + ' s' : sci(tC) + ' s');

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    advance(dts);
    if (VIEW === 'in' && rN <= 0.1 && !dead) { dead = true; playing = false; setPlayLabel(); }
  }
  updateVisuals(dt, dts);
  for (const r of labelReg) r.o.element.textContent = r.text();
  throttleText();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function throttleText() {
  formulaAcc += 1;
  if (formulaAcc >= 15) { formulaAcc = 0; updateReadouts(); updateFormula(); }
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
