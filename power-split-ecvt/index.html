<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>混合动力功率分流 · 行星杠杆上的 e-CVT</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(255,224,102,.9);color:#fff3bf}.lbl.c{border-color:rgba(102,217,232,.9);color:#c5f6fa}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 340px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #flash{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:7;pointer-events:none;
    background:var(--panel);border:1px solid var(--acc);color:var(--text);font-size:15px;font-weight:700;
    padding:10px 20px;border-radius:999px;opacity:0;transition:opacity .3s}
  #plot{position:fixed;right:18px;bottom:18px;z-index:4;width:330px;height:214px;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;backdrop-filter:blur(6px);padding:8px 10px 6px}
  #plot h3{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:2px}
  #plotCv{width:100%;height:calc(100% - 20px);display:block}
  #stats{position:fixed;right:18px;bottom:244px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);

  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 丰田 THS 型功率分流（真实关系式）
   行星轮：太阳轮 Zs=30(接MG1)、齿圈 Zr=78(接MG2/减速器)、行星架(接发动机)。
   转速杠杆定律：Zs·ωs + Zr·ωr = (Zs+Zr)·ωc → 三转速共线于一根杠杆，
   杠杆上行星架位于距太阳轮 Zr/(Zs+Zr)=0.722 处。
   转矩(准静态)：Ts = -Tc·Zs/(Zs+Zr)，Tr = -Tc·Zr/(Zs+Zr)
   → MG1 发电功率 P1 = 0.2778·Te·ωs（ωs>0 时发电），
     MG2 需补齿圈转矩 Tmg2 = Tneed - 0.7222·Te。
   电池功率 = 发电 − 用电，SoC 随之积分；车速→齿圈：ωr = v/(2πr)·60×G，
   G=4.11、车轮半径 0.31 m。MG1 过 ~6300 rpm 限速会强制启动发动机。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const TAU=Math.PI*2;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0.5,1.4,13.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.2,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=40;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.7));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(5,8,9);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.35);fill.position.set(-7,4,-6);scene.add(fill);

/* ---- 材质 ---- */
const mSun=new THREE.MeshStandardMaterial({color:0xd6b34a,roughness:0.3,metalness:0.75});
const mPlanet=new THREE.MeshStandardMaterial({color:0x9aa8b5,roughness:0.35,metalness:0.7});
const mRing=new THREE.MeshStandardMaterial({color:0x5f7d95,roughness:0.3,metalness:0.75});
const mCarrier=new THREE.MeshStandardMaterial({color:0xc44b2a,roughness:0.4,metalness:0.55});
const mEng=new THREE.MeshStandardMaterial({color:0x8a5a2a,roughness:0.5,metalness:0.5,emissive:0x000000});
const mMotor=new THREE.MeshStandardMaterial({color:0x3d6a8a,roughness:0.5,metalness:0.5});
const mBatt=new THREE.MeshStandardMaterial({color:0x2a5a3a,roughness:0.5,metalness:0.3});
const mFill=new THREE.MeshStandardMaterial({color:0x74d69c,emissive:0x2b8a3e,emissiveIntensity:0.5});
const mWheel=new THREE.MeshStandardMaterial({color:0x1a1d22,roughness:0.85});
const mLine=o=>new THREE.LineBasicMaterial({transparent:true,opacity:o});

/* ---- 行星轮系 ---- */
const MV=0.045,RS=0.675,RP=0.54,RR=RS+2*RP;
function gearR(psi,z,rp,ph){
  const p=TAU/z;let u=((psi-ph)/p)%1;if(u<0)u+=1;
  const d=Math.min(u,1-u),rt=rp+MV,rr=rp-1.25*MV,w=0.17,f=0.10;
  if(d<w)return rt;if(d<w+f)return rt+(rr-rt)*(d-w)/f;return rr;
}
function buildGear(z,rp,depth){
  const pts=[];
  for(let i=0;i<420;i++){const g=i/420*TAU,r=gearR(g,z,rp,0);pts.push(new THREE.Vector2(r*Math.cos(g),r*Math.sin(g)));}
  const geo=new THREE.ExtrudeGeometry(new THREE.Shape(pts),{depth,bevelEnabled:false});
  geo.translate(0,0,-depth/2);return geo;
}
const sunG=new THREE.Group();scene.add(sunG);
sunG.add(new THREE.Mesh(buildGear(30,RS,0.22),mSun));
const planetGeo=buildGear(24,RP,0.2);
const planets=[],planetSpin=[];
const carrierG=new THREE.Group();scene.add(carrierG);   // 行星架先声明，行星轮挂到它上面
for(let i=0;i<3;i++){
  const g=new THREE.Group();
  g.position.set((RS+RP)*Math.cos(Math.PI/2+i*TAU/3),(RS+RP)*Math.sin(Math.PI/2+i*TAU/3),0.06);
  g.add(new THREE.Mesh(planetGeo,mPlanet));
  const pin=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.4,10),mCarrier);
  pin.rotation.x=Math.PI/2;g.add(pin);
  carrierG.add(g);planets.push(g);planetSpin.push(0);
}
const ringG=new THREE.Group();scene.add(ringG);
(function(){
  const sh=new THREE.Shape();sh.absarc(0,0,RR+0.16,0,TAU,false);
  const hole=new THREE.Path();const n=520;
  for(let i=0;i<=n;i++){
    const g=i/n*TAU,p=TAU/78;let u=(g/p)%1;if(u<0)u+=1;
    const d=Math.min(u,1-u),tip=RR-MV*0.9,root=RR+MV*1.05;
    const r=d<0.16?tip:(d<0.26?tip+(root-tip)*(d-0.16)/0.10:root);
    const x=r*Math.cos(g),y=r*Math.sin(g);
    i?hole.lineTo(x,y):hole.moveTo(x,y);
  }
  sh.holes.push(hole);
  const geo=new THREE.ExtrudeGeometry(sh,{depth:0.3,bevelEnabled:false});
  geo.translate(0,0,-0.15);ringG.add(new THREE.Mesh(geo,mRing));
})();
for(let i=0;i<3;i++){
  const arm=new THREE.Mesh(new THREE.BoxGeometry(RS+RP,0.1,0.12),mCarrier);
  const a=Math.PI/2+i*TAU/3;
  arm.position.set((RS+RP)/2*Math.cos(a),(RS+RP)/2*Math.sin(a),-0.14);
  arm.rotation.z=a;carrierG.add(arm);
}
carrierG.add(new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.5,12),mCarrier).rotateX(Math.PI/2));

/* ---- 周边设备 ---- */
const eng=new THREE.Mesh(new THREE.BoxGeometry(1.15,0.75,0.75),mEng);eng.position.set(0,3.0,-0.1);scene.add(eng);
const mg1=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.62,16),mMotor);
mg1.rotation.z=Math.PI/2;mg1.position.set(-2.55,0.85,0);scene.add(mg1);
const mg2=mg1.clone();mg2.position.set(2.75,-0.25,0);scene.add(mg2);
const batt=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.85,0.7),mBatt);batt.position.set(0.6,-2.25,0);scene.add(batt);
const battFill=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.65,0.74),mFill);
battFill.position.set(0.6,-2.25,0.02);battFill.scale.y=0.6;battFill.position.y=-2.25+(0.6-1)*0.325;scene.add(battFill);
const wheel=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.2,12,26),mWheel);
wheel.position.set(3.9,-1.35,0);scene.add(wheel);

/* ---- 杠杆模拟器 ---- */
const leverG=new THREE.Group();leverG.position.set(6.3,0.6,0);scene.add(leverG);

function dot(col,r){const m=new THREE.Mesh(new THREE.SphereGeometry(r||0.13,12,10),new THREE.MeshBasicMaterial({color:col}));leverG.add(m);return m;}
const dSun=dot(0xffe066),dCar=dot(0xff6b6b),dRing=dot(0x66d9e8);

/* ---- 功率流粒子 ---- */
const PATHS=[
 {pts:[[0,2.6,0],[0,1.15,0]],col:0xffa94d},                                   // 发动机→行星架
 {pts:[[1.15,0.45,0],[2.6,-0.2,0],[3.9,-1.1,0]],col:0x74d69c},                // 齿圈→车轮
 {pts:[[-0.8,0.4,0],[-2.55,0.85,0],[-0.4,-1.85,0]],col:0xffe066},             // MG1发电→电池
 {pts:[[1.35,-2.1,0],[2.75,-0.3,0],[1.5,0.25,0]],col:0x66d9e8},               // 电池→MG2→齿圈
 {pts:[[-0.15,-1.9,0],[-2.55,0.85,0],[-0.75,0.4,0]],col:0xff8787},            // 电池→MG1→拖发动机
];
const pathLens=PATHS.map(p=>{
  let L0=0;const cum=[0];
  for(let i=1;i<p.pts.length;i++){L0+=Math.hypot(p.pts[i][0]-p.pts[i-1][0],p.pts[i][1]-p.pts[i-1][1]);cum.push(L0);}
  return {cum,len:L0};
});
PATHS.forEach(p=>{
  const pts=p.pts.map(q=>new THREE.Vector3(q[0],q[1],q[2]));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mLine(0.22)));
});
const P_MAX=110;
const pMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,8,6),new THREE.MeshBasicMaterial({color:0xffffff}),P_MAX);
pMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const zeroM=new THREE.Matrix4().makeScale(0,0,0);
const tmpC=new THREE.Color();
for(let i=0;i<P_MAX;i++){pMesh.setMatrixAt(i,zeroM);pMesh.setColorAt(i,tmpC.setHex(0xffffff));}
scene.add(pMesh);
pMesh.frustumCulled=false;
const pCols=PATHS.map(p=>new THREE.Color(p.col));
let parts=[],spawnAcc=[0,0,0,0,0],rates=[0,0,0,0,0];
function samplePath(pi,t){
  const {cum,len}=pathLens[pi],d=t*len;
  let i=1;while(i<cum.length-1&&cum[i]<d)i++;
  const f=(d-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]);
  const a=PATHS[pi].pts[i-1],b=PATHS[pi].pts[i];
  return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,0.15];
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'杠杆定律：Zs·ωs + Zr·ωr = (Zs+Zr)·ωc —— 三个转速被锁死在杠杆上，看右侧杠杆实时联动',en:'Lever law Zs·ωs+Zr·ωr=(Zs+Zr)·ωc locks three speeds onto one lever — watch it tilt live'},
 {zh:'起步：发动机关闭，电池→MG2 单独驱动；MG1 被倒拖反转（-2.6× 车速转速）',en:'Launch: engine off, battery→MG2 drives alone; MG1 back-spun negative (-2.6× road speed)'},
 {zh:'发动机启动：MG1 电动拖动曲轴，转速穿过 0 的瞬间即「过零点」——杠杆扫过水平',en:'Engine start: MG1 cranks the engine; the instant MG1 crosses 0 rpm is the zero-crossing'},
 {zh:'巡航：发动机转速无级自选，功率分流——机械直驱车轮 + MG1 发电',en:'Cruise: engine rpm freely chosen; power splits into direct mechanical drive + MG1 generation'},
 {zh:'电池只管差值：发电多→充电(SoC↑)，需求大→放电；低电自动点火充电',en:'Battery balances only the difference: surplus charges, deficit discharges; low SoC force-starts the engine'},
 {zh:'没有任何摩擦换挡元件与钢带 —— 靠转速约束调速，所以叫 e-CVT（与钢带 CVT 完全不同）',en:'No clutches, no belt — speed control by kinematic constraint alone: hence e-CVT, unrelated to belt CVTs'},
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>setPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function setMode(m){
  mode=m;
  document.getElementById('mLaunch').classList.toggle('on',m==='launch');
  document.getElementById('mCruise').classList.toggle('on',m==='cruise');
  document.getElementById('mSport').classList.toggle('on',m==='sport');
  if(m==='launch'){vTgt=8;throttle=0.4;}
  if(m==='cruise'){vTgt=60;throttle=0.42;}
  if(m==='sport'){vTgt=95;throttle=1.0;}
  document.getElementById('sV').value=vTgt;
  document.getElementById('sT').value=throttle*100;
  document.getElementById('sVVal').textContent=vTgt.toFixed(0)+' km/h';
  document.getElementById('sTVal').textContent=(throttle*100).toFixed(0)+' %';
}
function setPhase(i){
  activeStep=i;engMode='auto';
  document.getElementById('btnEng').textContent=L('发动机:自动','Engine: auto');
  if(i===1){setMode('launch');vTgt=8;}
  else if(i===2){setMode('cruise');vTgt=25;throttle=0.5;engRPM=0;state='off';}
  else if(i===3){setMode('cruise');vTgt=60;}
  else if(i===4){setMode('cruise');vTgt=70;throttle=0.75;soc=48;}
  else if(i===5){setMode('sport');}
  document.getElementById('sV').value=vTgt;
  document.getElementById('sT').value=throttle*100;
  document.getElementById('sVVal').textContent=vTgt.toFixed(0)+' km/h';
  document.getElementById('sTVal').textContent=(throttle*100).toFixed(0)+' %';
  playing=true;setPlayLabel();syncSteps();
}

/* ---- 功率账本图 ---- */
const plotCv=document.getElementById('plotCv');
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const t2=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const acc=css.getPropertyValue('--acc').trim()||'#ffa94d';
  const rows=[
    [L('发动机','engine'),Peng/1000,'#ffa94d'],
    [L('机械直驱','mech direct'),Pwheel/1000,'#74d69c'],
    [L('MG1 电','MG1 elec'),P1e/1000,'#ffe066'],
    [L('MG2 电','MG2 elec'),P2e/1000,'#66d9e8'],
    [L('电池±','battery±'),Pbatt/1000,'#ff8787'],
  ];
  const cx=86,mid=W*0.62,bw=W-mid-14;
  ctx.font='15px system-ui';
  rows.forEach((r,i)=>{
    const y=20+i*(H-30)/5;
    ctx.fillStyle=t2;ctx.fillText(r[0],4,y+13);
    ctx.strokeStyle='rgba(128,150,170,.3)';
    ctx.beginPath();ctx.moveTo(mid,y);ctx.lineTo(mid,y+16);ctx.stroke();
    const v=clamp(r[1]/45,-1,1);
    ctx.fillStyle=r[2];
    if(v>=0)ctx.fillRect(mid+1,y+2,Math.max(0,v*bw),13);
    else ctx.fillRect(mid-1+v*bw,y+2,-v*bw,13);
    ctx.fillStyle=t2;
    ctx.fillText(r[1].toFixed(1),mid+6+(v>0?v*bw:0),y+13);
  });
  ctx.fillStyle=t2;ctx.fillText('kW',W-30,14);
  ctx.fillStyle=acc;ctx.fillText(L('右=驱动/充电 左=回馈/放电','right=drive/charge left=regen'),mid-150,H-6);
}

let statAcc=0;
function updateStats(){

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
let Peng=0,Pwheel=0,P1e=0,P2e=0,Pbatt=0,Tmg2=0,Te=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    /* 车速趋近目标 */
    vCur+=clamp(vTgt-vCur,-8*dt*Math.max(2,Math.abs(vTgt-vCur)),8*dt*Math.max(2,Math.abs(vTgt-vCur)));
    if(Math.abs(vTgt-vCur)<0.05)vCur=vTgt;
    wheelRPM=vCur/3.6/RW*9.5493;
    ringRPM=wheelRPM*GFIN;
    /* 发动机策略（含 SoC 与 MG1 超速保护） */
    let wantOn;
    if(engMode==='forceOn')wantOn=true;
    else if(engMode==='forceOff')wantOn=vCur>78;
    else wantOn=mode==='launch'?(throttle>0.85):(vCur>12||throttle>0.8);
    if(soc<45)wantOn=true;
    if(soc>78&&mode!=='sport')wantOn=wantOn&&vCur>78;
    sunRPM=((ZS+ZR)*engRPM-ZR*ringRPM)/ZS;
    if(state==='off'&&sunRPM<-6300){wantOn=true;flash(L('MG1 超速 → 强制启动发动机','MG1 overspeed → engine force-started'));}
    if(wantOn&&state==='off')state='crank';
    if(!wantOn&&state!=='off'){state='off';if(soc>78)flash(L('电池满 → 发动机停机','Battery full → engine stopped'));}
    if(state==='crank'){
      engRPM+=680*dt;
      if(engRPM>=IDLE){state='on';flash(L('发动机点火','Engine fired'));}
    }else if(state==='on'){
      let tgt=IDLE+throttle*(mode==='sport'?2450:1950);
      tgt=Math.min(tgt,(6300*ZS+ZR*ringRPM)/(ZS+ZR));   // MG1 限速约束
      engRPM+=clamp(tgt-engRPM,-3200*dt,3200*dt);
    }else{
      engRPM=Math.max(0,engRPM-1500*dt);
    }
    sunRPM=((ZS+ZR)*engRPM-ZR*ringRPM)/ZS;
    /* MG1 过零检测（招牌瞬间） */
    if((state==='crank'||state==='on')&&prevSun<0&&sunRPM>=0)
      flash(L('★ MG1 反转过零 —— 发动机转速从此自由','★ MG1 crosses zero — engine speed now free'));
    prevSun=sunRPM;
    /* 需求与功率分配 */
    const vms=vCur/3.6,ws=Math.max(0,ringRPM*TAU/60),weng=engRPM*TAU/60;
    const Froad=147+0.343*vms*vms;
    const aCmd=clamp((vTgt-vCur)*0.45,-2,1.2+throttle*1.6);
    const Twheel=Math.max(0,(Froad+MASS*aCmd)*RW/0.95);
    const Tneed=Twheel/GFIN;
    Te=state==='on'?throttle*(85+60*Math.min(1,engRPM/2200)):0;
    Tmg2=state==='on'?Tneed-0.7222*Te:Tneed;
    Tmg2=clamp(Tmg2,-260,300);
    Peng=Te*weng;
    Pwheel=Tneed*ws;
    P1e=state==='on'?0.2778*Te*sunRPM*TAU/60:(state==='crank'?-(38*weng+400):-300);
    P2e=Tmg2*ws;P2e=P2e>0?P2e/0.92:P2e*0.92;
    Pbatt=(P1e>0?P1e*0.92:P1e/0.92)-P2e;
    soc=clamp(soc+Pbatt*dt/4.68e4*100,35,85);
    /* 粒子速率 */
    rates[0]=clamp(Peng/6000,0,12);
    rates[1]=clamp(Pwheel/6000,0,12);
    rates[2]=clamp(Math.max(0,P1e)/4500,0,12);
    rates[3]=clamp(Math.max(0,P2e)/4500,0,12);
    rates[4]=clamp(Math.max(0,-P1e)/4500,0,12);
    /* 相位步进 */
    thS+=sunRPM*kVis*TAU/60*dt;thC+=engRPM*kVis*TAU/60*dt;
    thR+=ringRPM*kVis*TAU/60*dt;thW+=wheelRPM*TAU/60*dt*0.05;
    thM1+=sunRPM*TAU/60*dt*0.05;
  }
  sunG.rotation.z=thS;carrierG.rotation.z=thC;ringG.rotation.z=thR;
  wheel.rotation.z=thW;mg1.rotation.x=thM1;
  for(let i=0;i<3;i++){
    const wP=(thC*(RS+RP)-thS*RS)/RP;      // 行星轮自转(与载体坐标一致的绝对角)
    planets[i].rotation.z=wP-thC;
  }
  /* 电池填充与发动机发光 */
  battFill.scale.y=clamp((soc-30)/55,0.05,1);
  battFill.position.y=-2.25-0.325+0.325*battFill.scale.y;
  mEng.emissive.setHex(state==='on'?0x8a3a00:0x111111);
  mEng.emissiveIntensity=state==='on'?0.55+0.2*Math.sin(simT*14):0.2;
  /* 杠杆联动 */
  const hy=r=>clamp(r/3400,-1.15,1.15)*1.15;
  const ys=hy(sunRPM),yr=hy(ringRPM);
  dSun.position.set(-1.65,ys,0);dRing.position.set(1.65,yr,0);
  dCar.position.set(-1.65+3.3*XF,ys+(yr-ys)*XF,0);
  barMesh.position.set(0,(ys+yr)/2,0);
  barMesh.rotation.z=Math.atan2(yr-ys,3.3);
  /* 粒子 */
  for(let i=0;i<5;i++){
    spawnAcc[i]+=rates[i]*dt;
    while(spawnAcc[i]>=1&&parts.length<P_MAX){spawnAcc[i]--;parts.push({p:i,t:0,sp:0.5+Math.random()*0.45});}
    if(spawnAcc[i]>2)spawnAcc[i]=2;
  }
  parts=parts.filter(pt=>(pt.t+=pt.sp*dt)<1);
  const m4=new THREE.Matrix4();
  parts.forEach((pt,i)=>{
    const q=samplePath(pt.p,pt.t);
    m4.makeTranslation(q[0],q[1],q[2]);
    pMesh.setMatrixAt(i,m4);pMesh.setColorAt(i,pCols[pt.p]);
  });
  for(let i=parts.length;i<P_MAX;i++)pMesh.setMatrixAt(i,zeroM);
  pMesh.instanceMatrix.needsUpdate=true;
  if(pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true;
  /* 闪烁提示 */
  if(flashT>0){flashT-=dt;if(flashT<=0)flashEl.style.opacity=0;}
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  if(playing){
    const st=state==='on'?(Math.abs(P1e)>800?4:3):(state==='crank'?2:1);
    if(activeStep!==st&&activeStep!==0&&activeStep!==5){activeStep=st;syncSteps();}
  }
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  drawPlot();
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

});

  e.currentTarget.textContent=L(['发动机:自动','发动机:强制开','发动机:强制关'],['Engine: auto','Engine: force ON','Engine: force OFF'][
    engMode==='auto'?0:engMode==='forceOn'?1:2]);
});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
if(qs.get('speed')){
  const sp=clamp(+qs.get('speed')||1,0.2,2.5);
  document.getElementById('sV').value=Math.round(sp*52);
  vTgt=Math.round(sp*52);
  document.getElementById('sVVal').textContent=vTgt.toFixed(0)+' km/h';
}
document.getElementById('tglLabels').checked=labelsOn;

applyTheme();applyLang();updateStats();start();
</script>
