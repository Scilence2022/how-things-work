  @media(max-width:900px){#stats{display:none}}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 欧拉公式：T1/T2 = e^(μθ)。松边预紧 T0 固定时打滑条件：ΔT > T0·(e^(μθ)−1)
   弹性滑动：滑差 ≈ (T1−T2)/EA（紧边应变大于松边）。几何：包角由张紧轮位置真实解出 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const R2D=180/Math.PI, D2R=Math.PI/180;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,60);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0,1.5,13.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.3,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=50;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(6,9,8); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-7,4,-6); scene.add(fill);

/* ---- 几何参数 ---- */
const RD=1.25, RR=1.25, RI=0.45;
const CD=new THREE.Vector2(-3.2,0), CN=new THREE.Vector2(3.2,0);
let yI=1.7;                         // 张紧轮中心高度（决定包角）
let idlerOn=true, vBelt=false, slowMo=false;
let rpm=60, load=0.6;               // load 单位 N·m（显示即模型值）

/* ---- 材质 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const frameM=new THREE.MeshStandardMaterial({color:0x2e3a47,roughness:0.5,metalness:0.55});
const pulM =new THREE.MeshStandardMaterial({color:0x788795,roughness:0.35,metalness:0.75});
const pulM2=new THREE.MeshStandardMaterial({color:0x6baed6,roughness:0.35,metalness:0.7});
const idleM=new THREE.MeshStandardMaterial({color:0xb085f5,roughness:0.4,metalness:0.5});
const springM=new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.9});

/* ---- 场景 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(34,0.3,9),groundM);
ground.position.set(0,-2.7,0); scene.add(ground);
/* 机架 */
for(const px of [-3.2,3.2]){
  const post=new THREE.Mesh(new THREE.BoxGeometry(0.3,2.6,0.3),frameM);
  post.position.set(px,-1.3,0); scene.add(post);
}
/* 带轮（含辐条以观察转动） */
function makePulley(r,mat){
  const g=new THREE.Group();
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(r,r,0.44,44),mat);
  disc.rotation.x=Math.PI/2; g.add(disc);
  for(let i=0;i<4;i++){
    const sp=new THREE.Mesh(new THREE.BoxGeometry(r*1.7,0.09,0.46),frameM);
    sp.rotation.z=i*Math.PI/4; g.add(sp);
  }
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.7,14),frameM);
  hub.rotation.x=Math.PI/2; g.add(hub);
  return g;
}
const pulleyD=makePulley(RD,pulM); pulleyD.position.set(CD.x,CD.y,0); scene.add(pulleyD);
const pulleyN=makePulley(RR,pulM2); pulleyN.position.set(CN.x,CN.y,0); scene.add(pulleyN);
/* 张紧轮 + 导轨 + 弹簧 */
const idlerG=new THREE.Group(); scene.add(idlerG);
const idlerWheel=makePulley(RI,idleM); idlerG.add(idlerWheel);
const rail=new THREE.Mesh(new THREE.BoxGeometry(0.1,6.6,0.1),frameM);
rail.position.set(0,2.0,-0.55); scene.add(rail);
const springLine=new THREE.Line(new THREE.BufferGeometry(),springM); scene.add(springLine);
function updateSpring(){
  const top=new THREE.Vector2(0,5.1), bot=new THREE.Vector2(0,yI);
  const n=14, arr=new Float32Array((n+1)*3);
  for(let i=0;i<=n;i++){
    const t=i/n, x=(i%2===0?0.09:-0.09)*(i>0&&i<n?1:0);
    arr[i*3]=x; arr[i*3+1]=top.y+(bot.y-top.y)*t; arr[i*3+2]=-0.55;
  }
  springLine.geometry.setAttribute('position',new THREE.BufferAttribute(arr,3));
}
/* 电机块（主动轮后） */
const motor=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.1,1.1),frameM);
motor.position.set(CD.x,-1.0,-0.9); scene.add(motor);
/* 制动载荷（从动轮上的加载杆） */
const brake=new THREE.Mesh(new THREE.BoxGeometry(0.22,1.5,0.22),frameM);
brake.position.set(CN.x+0.55,-0.9,0); scene.add(brake);
const weight=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.5,0.7),pulM);
weight.position.set(CN.x+0.55,-1.85,0); scene.add(weight);

/* ---- 带路径：真解切线，两 branch（张紧轮在带外=凸；压入=凹 S 弯） ---- */
function wrapOf(yI){
  /* 由张紧轮高度求从动轮包角（弧度） */
  if(yI>1.7){ // 凸：外切线 (Cn−Ci)·u2 = RR−RI
    const dx=3.2, dy=-yI, d=Math.hypot(dx,dy);
    const phi=Math.atan2(dy,dx), psi=Math.acos(clamp((RR-RI)/d,-1,1));
    return phi+psi+Math.PI/2;
  }
  // 凹：内切线 3.2·cosθ − yI·sinθ = −(RR+RI)，θ∈(90°,180°) 二分
  const f=t=>3.2*Math.cos(t)-yI*Math.sin(t)+(RR+RI);
  let a=Math.PI/2, b=Math.PI;
  for(let i=0;i<44;i++){const m=(a+b)/2; (f(m)>0)?a=m:b=m;}
  return b+Math.PI/2;
}
/* 预扫描 yI→wrap 反查表 */
const LUT=[];
for(let y=5.0;y>=-0.75;y-=0.02) LUT.push([y,wrapOf(y)]);
function yIforWrap(wrap){
  for(let i=0;i<LUT.length-1;i++){
    if(wrap<=LUT[i][1]&&wrap>=LUT[i+1][1]){
      const t=(wrap-LUT[i][1])/(LUT[i+1][1]-LUT[i][1]);
      return LUT[i][0]+t*(LUT[i+1][0]-LUT[i][0]);
    }
  }
  return wrap>LUT[0][1]?LUT[0][0]:LUT[LUT.length-1][0];
}
/* 构造带中心线折线（采样点 + 每点张力标记 0=松边 1=紧边） */
const PATH_N=420;
let pathPts=[], pathLen=[], pathTotal=0;
function buildPath(){
  pathPts=[]; pathLen=[]; pathTotal=0;
  const yIu=idlerOn?yI:null;
  let u1,u2, iP1,iP2, branch;
  if(!idlerOn){
    u1=Math.PI/2; u2=Math.PI/2; branch='flat';
  }else if(yIu>1.7){ // 凸 branch
    branch='bump';
    const dx=3.2, dy=-yIu, d=Math.hypot(dx,dy);
    const phi=Math.atan2(dy,dx), psi=Math.acos(clamp((RR-RI)/d,-1,1));
    u2=phi+psi;
    const dx1=-3.2, dy1=-yIu;
    const phi1=Math.atan2(dy1,dx1), psi1=Math.acos(clamp((RR-RI)/d,-1,1));
    u1=phi1-psi1;
  }else{ // 凹 branch（S 弯，带压在张紧轮下缘）
    branch='dent';
    const f2=t=>3.2*Math.cos(t)-yIu*Math.sin(t)+(RR+RI);
    let a2=Math.PI/2,b2=Math.PI;
    for(let i=0;i<44;i++){const m=(a2+b2)/2;(f2(m)>0)?a2=m:b2=m;}
    u2=b2;
    const f1=t=>3.2*Math.cos(t)+yIu*Math.sin(t)-(RR+RI);
    let a1=0,b1=Math.PI/2;
    for(let i=0;i<44;i++){const m=(a1+b1)/2;(f1(m)>0)?a1=m:b1=m;}
    u1=a1;
  }
  const push=(x,y,tense)=>{ pathPts.push([x,y,tense]); };
  const arc=(cx,cy,r,a0,a1ccw,tense,n)=>{
    for(let i=0;i<=n;i++){const a=a0+(a1ccw-a0)*i/n; push(cx+r*Math.cos(a),cy+r*Math.sin(a),tense);}
  };
  if(branch==='bump'){
    arc(CN.x,CN.y,RR,-Math.PI/2,u2,1,40);                 // 从动轮：紧边恒 T1
    push(CN.x+RR*Math.cos(u2),CN.y+RR*Math.sin(u2),1);
    push(RI*Math.cos(u2),yIu+RI*Math.sin(u2),0);          // 切线到张紧轮（外缘）
    arc(0,yIu,RI,u2,u1,0,24);                             // 张紧轮外缘
    push(RI*Math.cos(u1),yIu+RI*Math.sin(u1),0);
    push(CD.x+RD*Math.cos(u1),CD.y+RD*Math.sin(u1),0);    // 切线到主动轮
    arc(CD.x,CD.y,RD,u1,1.5*Math.PI,1,40);                // 主动轮：T2→T1 过渡
  }else if(branch==='dent'){
    arc(CN.x,CN.y,RR,-Math.PI/2,u2,1,40);
    push(CN.x+RR*Math.cos(u2),CN.y+RR*Math.sin(u2),1);
    push(-RI*Math.cos(u2),yIu-RI*Math.sin(u2),0);         // S 弯到张紧轮下缘
    arc(0,yIu,RI,u2+Math.PI,u1+Math.PI,0,20);             // 逆向短弧
    push(-RI*Math.cos(u1),yIu-RI*Math.sin(u1),0);
    push(CD.x+RD*Math.cos(u1),CD.y+RD*Math.sin(u1),0);
    arc(CD.x,CD.y,RD,u1,1.5*Math.PI,1,40);
  }else{
    arc(CN.x,CN.y,RR,-Math.PI/2,Math.PI/2,1,40);
    push(CN.x,RR,1);
    push(CD.x,RD,0);
    arc(CD.x,CD.y,RD,Math.PI/2,1.5*Math.PI,1,40);
  }
  push(pathPts[0][0],pathPts[0][1],pathPts[0][2]);        // 闭合
  /* 累计弧长（末段张力过渡在主动轮弧上已按 0→1 处理） */
  let acc=0; pathLen.push(0);
  for(let i=1;i<pathPts.length;i++){
    const dx=pathPts[i][0]-pathPts[i-1][0], dy=pathPts[i][1]-pathPts[i-1][1];
    acc+=Math.hypot(dx,dy); pathLen.push(acc);
  }
  pathTotal=acc;
  /* 主动轮弧上张力从松到紧线性过渡：重写该段 tense */
  buildTensionField();
}
function buildTensionField(){
  /* 找主动轮弧段（tense 由 0→1），把过渡铺进采样 */
  for(let i=1;i<pathPts.length;i++){
    if(pathPts[i][2]===1&&pathPts[i-1][2]===0){
      const s0=pathLen[i-1], s1=pathLen[i];
      for(let k=1;k<12;k++){
        const ss=s0+(s1-s0)*k/12;
        insertSample(ss,k/12);
      }
      break;
    }
  }
}
function insertSample(s,tense){
  for(let i=1;i<pathPts.length;i++){
    if(pathLen[i]>=s){
      const t=(s-pathLen[i-1])/(pathLen[i]-pathLen[i-1]);
      const x=pathPts[i-1][0]+(pathPts[i][0]-pathPts[i-1][0])*t;
      const y=pathPts[i-1][1]+(pathPts[i][1]-pathPts[i-1][1])*t;
      pathPts.splice(i,0,[x,y,tense]); pathLen.splice(i,0,s);
      return;
    }
  }
}
function pointAt(s){ // s∈[0,pathTotal)
  s=((s%pathTotal)+pathTotal)%pathTotal;
  let lo=0,hi=pathLen.length-1;
  while(lo<hi){const m=(lo+hi)>>1; (pathLen[m]<s)?lo=m+1:hi=m;}
  const i=Math.max(1,lo);
  const t=(s-pathLen[i-1])/Math.max(1e-9,pathLen[i]-pathLen[i-1]);
  return {
    x:pathPts[i-1][0]+(pathPts[i][0]-pathPts[i-1][0])*t,
    y:pathPts[i-1][1]+(pathPts[i][1]-pathPts[i-1][1])*t,
    tense:pathPts[i-1][2]+(pathPts[i][2]-pathPts[i-1][2])*t
  };
}

/* 带实例化渲染 */
const BELT_N=170;
const beltGeo=new THREE.BoxGeometry(1,1,0.36);
const beltMesh=new THREE.InstancedMesh(beltGeo,new THREE.MeshStandardMaterial({roughness:0.6,metalness:0.1}),BELT_N);
beltMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(beltMesh);
const cLo=new THREE.Color(0x4a7fa5), cHi=new THREE.Color(0xffa94d), cTmp=new THREE.Color();
const m4=new THREE.Matrix4(), q4=new THREE.Quaternion(), v3=new THREE.Vector3(), s3=new THREE.Vector3();
const eul=new THREE.Euler();
function updateBelt(travel,thick){
  for(let i=0;i<BELT_N;i++){
    const s0=travel+i*pathTotal/BELT_N, s1=s0+pathTotal/BELT_N*1.25;
    const p0=pointAt(s0), p1=pointAt(s1);
    const dx=p1.x-p0.x, dy=p1.y-p0.y, len=Math.hypot(dx,dy)||1e-4;
    eul.set(0,0,Math.atan2(dy,dx)); q4.setFromEuler(eul);
    v3.set((p0.x+p1.x)/2,(p0.y+p1.y)/2,0);
    s3.set(len,thick,1);
    m4.compose(v3,q4,s3);
    beltMesh.setMatrixAt(i,m4);
    cTmp.copy(cLo).lerp(cHi,clamp(p0.tense,0,1));
    beltMesh.setColorAt(i,cTmp);
  }
  beltMesh.instanceMatrix.needsUpdate=true;
  if(beltMesh.instanceColor) beltMesh.instanceColor.needsUpdate=true;
}

/* ---- 标签 ---- */
const labelReg=[];
let labelsOn=true;
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('主动轮（电机）','Drive pulley (motor)'),new THREE.Vector3(CD.x,1.95,0),'o');
addLabel(()=>L('从动轮（负载）','Driven pulley (load)'),new THREE.Vector3(CN.x,1.95,0),'b');
addLabel(()=>L('紧边 T1','Tight side T1'),new THREE.Vector3(0,-1.75,0),'o',
  ()=>true);
addLabel(()=>L('松边 T2','Slack side T2'),new THREE.Vector3(idlerOn?1.6:0,2.15,0),'b',
  ()=>!idlerOn);
addLabel(()=>L('张紧轮：增包角 + 提预紧','Tensioner: +wrap, +preload'),new THREE.Vector3(0.3,yI+0.75,0),'g',
  ()=>idlerOn);
addLabel(()=>L('✕ 打滑：轮转带不转 → 烧带','✕ SLIPPING: pulley spins, belt stalls'),new THREE.Vector3(CN.x,-2.15,0),'r',
  ()=>slipping);
addLabel(()=>L('弹性滑动 ~1%：紧边伸长多','Creep ~1%: tight side stretches more'),new THREE.Vector3(CD.x-0.2,-2.15,0),'b',
  ()=>!slipping);

/* ---- 状态与动力学 ---- */
let playing=true, thetaD=0, thetaN=0, simT=0;
let slipping=false, heat=0, travel=0;
const EA=300;
function tensioner(){
  const T0=idlerOn?4.4:3.2;                  // 松边预紧（张紧轮提高 T0）
  const mu=vBelt?0.9:0.4;                    // V 带 μ_eff=μ/sin(φ/2) 楔增效应
  const th=wrapOf(idlerOn?yI:Math.PI/2);
  const eu=Math.exp(mu*th);                  // 红线 T1/T2 = e^(μθ)
  const dTreq=load/RR;                       // 从动轮所需 ΔT
  const dTcap=T0*(eu-1);                     // 欧拉极限（指数本钱）
  const dT=Math.min(dTreq,dTcap);
  return {T0,mu,th,eu,dTreq,dTcap,dT,T1:T0+dT,T2:T0};
}
function stepPhysics(dt){
  const {T1,T2,eu,dTreq,dTcap}=tensioner();
  const creep=(T1-T2)/EA;                    // 弹性滑动应变差
  const wD=rpm/60*2*Math.PI;
  const wSync=wD*RD/RR*(1-creep);
  if(!slipping){
    if(dTreq>dTcap) slipping=true;
    thetaN+=(wSync-thetaN)*Math.min(1,dt*8);
  }else{
    if(dTreq<dTcap*0.93) slipping=false;
    thetaN+=(0-thetaN)*Math.min(1,dt*2.5);   // 制动拖住：轮停带转
  }
  thetaD+=wD*dt;
  travel+=wD*RD*dt;
  heat+= ((slipping?1:0)-heat)*Math.min(1,dt*3);
}

/* ---- 统计 ---- */
function updateStats(){
  const {T1,T2,th,eu}=tensioner();
  const wD=rpm/60*2*Math.PI;
  const slipPct=Math.abs(wD*RD-thetaN*RR)/Math.max(1e-6,wD*RD)*100;
  document.getElementById('stWrap').innerHTML=(th*R2D).toFixed(0)+'<small> °</small>';
  const rEl=document.getElementById('stRatio');
  rEl.innerHTML=(T1/Math.max(1e-6,T2)).toFixed(2);
  rEl.style.color=(T1/T2>eu*0.97)?'#ff8787':'';
  const eEl=document.getElementById('stEuler');
  eEl.innerHTML=eu.toFixed(2);
  eEl.style.color=(T1/T2>eu*0.97)?'#ff8787':'';
  const sEl=document.getElementById('stSlip');
  sEl.innerHTML=slipPct.toFixed(1)+'<small> %</small>';
  sEl.style.color=slipping?'#ff8787':'';
}
function setLoad(v){ load=v;
  document.getElementById('sLoadVal').textContent=v.toFixed(1)+' N·m'; }
function setWrap(w){ document.getElementById('sWrapVal').textContent=w.toFixed(0)+'°'; }

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  frameM.color.setHex(dark?0x2e3a47:0x6b7d8e);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'带轮靠摩擦传扭：紧边 T1、松边 T2，欧拉公式 T1/T2 = e^(μθ)',
   en:'Friction carries the torque: tight T1, slack T2, Euler T1/T2 = e^(μθ)', do:()=>{setLoad(2);}},
  {zh:'包角是指数本钱：θ 从 112° 加到 220°，红线 e^(μθ) 连翻两番',
   en:'Wrap is exponential capital: 112°→220° squares the e^(μθ) limit', do:()=>{setWrapUI(220);}},
  {zh:'张紧轮双管齐下：既增大包角，又提高预紧 T0（吃掉垂度）',
   en:'The tensioner does double duty: more wrap AND higher preload T0', do:()=>{setIdler(true); setWrapUI(205);}},
  {zh:'弹性滑动：带是弹性体，紧边伸长多、松边短，~1% 滑差不可避免',
   en:'Creep: an elastic belt runs faster on the tight side — ~1% slip is inherent', do:()=>{setLoad(3); setWrapUI(180);}},
  {zh:'过载打滑：T1/T2 撞上 e^(μθ) 红线，轮转带不转——烧带保机器',
   en:'Overload: T1/T2 hits the e^(μθ) red line — pulley spins inside a stalled belt', do:()=>{setLoad(22);}},
  {zh:'V 带：楔形槽 μ_eff ≈ μ/sin(φ/2)，同样的包角承载约 ×5',
   en:'V-belt: the groove wedges μ_eff ≈ μ/sin(φ/2) — about 5× capacity at same wrap', do:()=>{setV(true); setLoad(14);}},
];
let activeStep=0;
function setWrapUI(w){ document.getElementById('sWrap').value=w; applyWrap(w); }
function applyWrap(w){ yI=yIforWrap(w*D2R); idlerG.position.set(0,yI,0); updateSpring(); buildPath(); setWrap(w); }
function setIdler(on){
  idlerOn=on; idlerG.visible=on; rail.visible=on; springLine.visible=on;
  document.getElementById('btnIdler').classList.toggle('on',on);
  document.getElementById('btnIdler').textContent=on?L('张紧轮：开','Tensioner: on'):L('张紧轮：关','Tensioner: off');
  buildPath();
}
function setV(v){
  vBelt=v;
  document.getElementById('btnV').classList.toggle('on',v);
  document.getElementById('btnV').textContent=v?L('V 带（平带切换）','V-belt (flat)'):L('平带（V带切换）','Flat belt (V-belt)');
}
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((stp,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?stp.en:stp.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i; syncSteps(); STEPS[i].do();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- UI ---- */
document.getElementById('sLoad').addEventListener('input',e=>setLoad(+e.target.value));
document.getElementById('sWrap').addEventListener('input',e=>applyWrap(+e.target.value));
document.getElementById('sSpd').addEventListener('input',e=>{rpm=+e.target.value;
  document.getElementById('sSpdVal').textContent=rpm+' rpm';});
document.getElementById('btnIdler').addEventListener('click',()=>setIdler(!idlerOn));
document.getElementById('btnV').addEventListener('click',()=>setV(!vBelt));
document.getElementById('btnSlow').addEventListener('click',e=>{
  slowMo=!slowMo; e.target.classList.toggle('on',slowMo);});
document.getElementById('btnZero').addEventListener('click',()=>{setLoad(0);
  document.getElementById('sLoad').value=0;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh'; localStorage.setItem('htw-lang',LANG); applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark'; localStorage.setItem('htw-theme',THEME); applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  let dt=clamp(clock.getDelta(),0,0.05);
  if(slowMo) dt*=0.25;
  simT+=dt;
  let info=null;
  if(playing){ info=stepPhysics(dt); }
  pulleyD.rotation.z=-thetaD;      // 俯视 CCW → 屏面 z 轴反向
  pulleyN.rotation.z=-thetaN;
  idlerWheel.rotation.z=-travel/RI;
  const thick=vBelt?0.16:0.1;
  pulM2.emissive.setHex(0xff3300); pulM2.emissiveIntensity=heat*0.55;
  updateBelt(travel,thick);
  acc+=dt; if(acc>0.1){acc=0; updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis(); if(r.o.visible) r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta(); raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf); raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数与初始化 ---- */
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1') playing=false;
if(qp.get('labels')==='0') labelsOn=false;
if(qp.get('speed')){ rpm=clamp(+qp.get('speed')||60,20,160); document.getElementById('sSpd').value=rpm;
  document.getElementById('sSpdVal').textContent=rpm+' rpm'; }
document.getElementById('tglLabels').checked=labelsOn;
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
idlerG.position.set(0,yI,0); updateSpring(); buildPath();
applyTheme(); applyLang(); buildSteps(); start();
</script>
