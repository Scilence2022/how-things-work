<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恒星核合成</title>
<style>
:root,:root[data-theme="dark"]{
  color-scheme:dark;--acc:#ffa94d;
  --bg:#0a0e18;--panel:rgba(10,14,24,.90);--panel-border:rgba(255,255,255,.09);
  --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
  --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.5);
  --tool:rgba(10,14,24,.82);--tool-border:rgba(255,255,255,.12);
}
:root[data-theme="light"]{
  color-scheme:light;--acc:#e8590c;
  --bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
  --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
  --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
  --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  transition:background .25s;}
#app{position:fixed;inset:0;}
#tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
.tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
  color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;
  min-width:40px;height:32px;padding:0 12px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  text-decoration:none;backdrop-filter:blur(6px);
  transition:border-color .15s,color .15s,transform .15s;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
#title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;
  max-width:calc(100vw - 320px);}
#title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;
  text-shadow:0 2px 8px rgba(0,0,0,.6);}
#title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;
  text-shadow:0 1px 4px rgba(0,0,0,.5);}
:root[data-theme="light"] #title h1,:root[data-theme="light"] #title .sub{text-shadow:none;}
#stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:12px;padding:11px 16px;
  backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
#stats .k{font-size:12px;color:var(--text2);align-self:center;}
#stats .v{font-size:19px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
#stats .v.g{color:var(--acc);}
#panel{position:fixed;left:18px;bottom:18px;z-index:5;width:384px;
  background:var(--panel);border:1px solid var(--panel-border);
  border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
  box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto;}
#steps{list-style:none;margin-top:8px;}
#steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;align-items:flex-start;}
#steps li:hover{background:var(--hover);}
#steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45);}
:root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4);}
#steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  background:rgba(255,255,255,.12);color:var(--text3);}
:root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
#steps li.on .n{background:var(--acc);color:#fff;}
#steps .t{font-size:12.5px;color:var(--text3);line-height:1.45;}
#steps .t b{color:var(--text);}
#steps li.on .t b{color:#ffd8a0;}
:root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
#abtnRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--panel-border);}
.abtn{appearance:none;font:inherit;font-size:12px;cursor:pointer;flex:1;min-width:80px;
  background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
  border-radius:9px;padding:6px 8px;text-align:center;
  transition:border-color .15s,color .15s,background .15s;}
.abtn:hover{border-color:var(--acc);color:var(--acc);}
.abtn.on{border-color:var(--acc);color:var(--text);background:rgba(255,169,77,.12);}
@media(max-width:900px){#stats{display:none;}}
@media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh;}
  #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="title">
  <h1 data-zh="恒星核合成" data-en="Stellar Nucleosynthesis">恒星核合成</h1>
  <div class="sub" data-zh="从氢到铁在恒星中烧成，铁以上的重元素在超新星与中子星并合中锻造" data-en="Hydrogen to iron forged in stars; elements beyond iron forged in supernovae and neutron star mergers">从氢到铁在恒星中烧成，铁以上的重元素在超新星与中子星并合中锻造</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn">EN</button>
  <button class="tbtn" id="themeBtn">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="当前阶段" data-en="Current stage">当前阶段</span><span class="v g" id="stStage">主序星</span>
  <span class="k" data-zh="恒星质量 M☉" data-en="Mass M☉">恒星质量 M☉</span><span class="v" id="stMass">1.0</span>
  <span class="k" data-zh="核心温度 ×10⁸K" data-en="Core temp ×10⁸K">核心温度 ×10⁸K</span><span class="v" id="stTemp">0.15</span>
  <span class="k" data-zh="已合成元素数" data-en="Elements synthesized">已合成元素数</span><span class="v" id="stElem">2</span>
</div>
<div id="panel">
  <ol id="steps"></ol>
  <div id="abtnRow">
    <button class="abtn on" id="btnSolar" data-zh="太阳质量演化" data-en="Solar evolution">太阳质量演化</button>
    <button class="abtn" id="btnMassive" data-zh="大质量恒星" data-en="Massive star">大质量恒星</button>
    <button class="abtn" id="btnMerger" data-zh="中子星并合" data-en="NS merger">中子星并合</button>
    <button class="abtn" id="btnOrigins" data-zh="元素起源图" data-en="Element origins">元素起源图</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 8, 26);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 10; controls.maxDistance = 60;

scene.add(new THREE.AmbientLight(0xffffff, 0.2));
const starLight = new THREE.PointLight(0xffdd88, 6, 40);
starLight.position.set(0,0,0); scene.add(starLight);
const fillL = new THREE.DirectionalLight(0x4466ff, 0.3);
fillL.position.set(-10, 8, -10); scene.add(fillL);

// starfield background
const starCount = 800;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPositions[i] = (Math.random() - 0.5) * 260;
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18 })));

// central star
const starMat = new THREE.MeshStandardMaterial({ color: 0xffee88, emissive: 0xffbb44, emissiveIntensity: 1.2, roughness: 0.8 });
const starMesh = new THREE.Mesh(new THREE.SphereGeometry(2.5, 32, 32), starMat);
scene.add(starMesh);

// concentric shells (H, He, C, Ne, O, Si, Fe from outer to inner)
const SHELLS = [
  { label:'H', color:0x4499ff, r:10.0, opacity:0.13 },
  { label:'He', color:0xffdd44, r:8.0,  opacity:0.14 },
  { label:'C',  color:0x88ff88, r:6.2,  opacity:0.16 },
  { label:'Ne', color:0xff88cc, r:4.8,  opacity:0.17 },
  { label:'O',  color:0xff8833, r:3.8,  opacity:0.18 },
  { label:'Si', color:0xaaddff, r:3.0,  opacity:0.20 },
  { label:'Fe', color:0xcc2222, r:2.2,  opacity:0.30 },
];
const shellMeshes = SHELLS.map(s => {
  const mat = new THREE.MeshStandardMaterial({ color: s.color, transparent: true, opacity: 0, side: THREE.FrontSide, roughness: 0.9, emissive: s.color, emissiveIntensity: 0.08 });
  const m = new THREE.Mesh(new THREE.SphereGeometry(s.r, 32, 32), mat);
  m.visible = false; scene.add(m); return { mesh: m, mat, target: 0 };
});

// gold r-process particles
const MAX_GOLD = 200;
const goldGeo = new THREE.BufferGeometry();
const goldPos = new Float32Array(MAX_GOLD * 3);
goldGeo.setAttribute('position', new THREE.BufferAttribute(goldPos, 3));
const goldPoints = new THREE.Points(goldGeo, new THREE.PointsMaterial({ color: 0xffd700, size: 0.25, transparent: true, opacity: 0.9 }));
goldPoints.visible = false; scene.add(goldPoints);
const goldVels = Array.from({length: MAX_GOLD}, () => new THREE.Vector3());
let goldActive = false;
function launchGold(cx, cy, cz, spread) {
  goldActive = true; goldPoints.visible = true;
  for (let i = 0; i < MAX_GOLD; i++) {
    goldPos[i*3] = cx; goldPos[i*3+1] = cy; goldPos[i*3+2] = cz;
    const a = Math.random()*Math.PI*2, e = (Math.random()-0.5)*Math.PI;
    const sp = spread * (0.5 + Math.random());
    goldVels[i].set(Math.cos(a)*Math.cos(e)*sp, Math.sin(e)*sp, Math.sin(a)*Math.cos(e)*sp);
  }
  goldGeo.attributes.position.needsUpdate = true;
}

// supernova shockwave ring
const swaveMat = new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0, wireframe: true });
const swaveMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 24), swaveMat);
scene.add(swaveMesh); let swaveR = 0, swaveActive = false;

// NS merger: two small spheres
const nsMat = new THREE.MeshStandardMaterial({ color: 0xaaccff, emissive: 0x3366ff, emissiveIntensity: 0.8 });
const ns1 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), nsMat);
const ns2 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), nsMat);
ns1.visible = ns2.visible = false;
scene.add(ns1); scene.add(ns2);
// --- simulation state ---
let evolMode = 'solar'; // solar | massive | merger | origins
let evolPhase = 0; // 0..1 within current mode
let tSim = 0;
let elemCount = 2;
const stageNames = { zh: ['主序星','红巨星','碳燃烧','超新星','中子星并合'], en: ['Main seq','Red giant','C burning','Supernova','NS merger'] };
let stageIdx = 0;

function setMode(m) {
  evolMode = m; evolPhase = 0; tSim = 0; stageIdx = 0;
  ['btnSolar','btnMassive','btnMerger','btnOrigins'].forEach(id => document.getElementById(id).classList.remove('on'));
  const map = { solar:'btnSolar', massive:'btnMassive', merger:'btnMerger', origins:'btnOrigins' };
  if (map[m]) document.getElementById(map[m]).classList.add('on');
  // hide all shells, gold, ns
  shellMeshes.forEach(s => { s.mesh.visible = false; s.target = 0; });
  goldActive = false; goldPoints.visible = false;
  swaveActive = false; swaveMat.opacity = 0; swaveR = 0;
  ns1.visible = ns2.visible = false;
  starMesh.scale.setScalar(1);
  starMat.color.set(0xffee88); starMat.emissive.set(0xffbb44);
  if (m === 'solar') { elemCount = 2; stageIdx = 0; }
  if (m === 'massive') { elemCount = 2; stageIdx = 0; }
  if (m === 'merger') { elemCount = 26; stageIdx = 4; ns1.visible = true; ns2.visible = true; }
  if (m === 'origins') { elemCount = 92; stageIdx = 4; showAllShells(); }
}
function showAllShells() {
  shellMeshes.forEach(s => { s.mesh.visible = true; s.target = s.mat.opacity === 0 ? SHELLS[shellMeshes.indexOf(s)].opacity : s.mat.opacity; });
  // force-set targets
  shellMeshes.forEach((s, i) => { s.target = SHELLS[i].opacity; s.mesh.visible = true; });
}

// --- theme / lang ---
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x0a0e18);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('恒星核合成','Stellar Nucleosynthesis');
  buildSteps();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME); applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG); applyLang();
});

const STEPS = [
  { b:'宇宙大爆炸',be:'Big Bang',d:'宇宙大爆炸只产生氢、氦和极少量锂——其余一切在恒星中诞生',de:'Big Bang made only H, He, trace Li — all heavier elements were forged in stars' },
  { b:'p-p 链',be:'p-p chain',d:'主序星将 4 个氢聚变为氦-4，释放 26.7 MeV',de:'4H → He-4 + 26.7 MeV — the Sun\'s energy source' },
  { b:'三阿尔法',be:'Triple-alpha',d:'红巨星氦核聚变 3 He-4→C-12，再+He-4→O-16',de:'3×He-4 → C-12; then C-12 + He-4 → O-16 in red giant cores' },
  { b:'洋葱层',be:'Onion shells',d:'大质量恒星 C→Ne→O→Si 依次燃烧直至铁核，铁-56 是聚变的终点',de:'Massive star onion: C→Ne→O→Si burning layers until Fe-56 core — peak binding energy stops fusion' },
  { b:'超新星 r 过程',be:'r-process',d:'铁核坍缩→中子→快速俘获合成金、铀等重元素',de:'Core collapse → neutron flood → rapid capture → gold, uranium, heavy elements' },
  { b:'中子星并合',be:'NS merger',d:'GW170817 千新星光谱中探测到金的谱线，确认并合是重元素的另一来源',de:'Kilonova GW170817 showed gold spectral lines — confirming mergers as a heavy element factory' },
];
function buildSteps() {
  const el = document.getElementById('steps'); el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b> ${L(s.d,s.de)}</span>`;
    el.appendChild(li);
  });
}
document.getElementById('btnSolar').addEventListener('click',()=>setMode('solar'));
document.getElementById('btnMassive').addEventListener('click',()=>setMode('massive'));
document.getElementById('btnMerger').addEventListener('click',()=>setMode('merger'));
document.getElementById('btnOrigins').addEventListener('click',()=>setMode('origins'));
// --- animation loop ---
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  tSim += dt;

  if (evolMode === 'solar') {
    // phase 0-1: H shell glows, 1-2: He shell, 2-3: red giant expansion
    evolPhase += dt * 0.06;
    const ph = evolPhase % 3;
    shellMeshes[0].mesh.visible = true; shellMeshes[0].target = 0.18;
    if (ph > 1) { shellMeshes[1].mesh.visible = true; shellMeshes[1].target = 0.18; }
    if (ph > 2) { starMesh.scale.setScalar(1 + (ph-2)*2.5); starMat.color.set(0xff8844); starMat.emissive.set(0xff6622); }
    else { starMesh.scale.setScalar(1); starMat.color.set(0xffee88); starMat.emissive.set(0xffbb44); }
    elemCount = ph > 1 ? 6 : 2;
    stageIdx = ph < 1 ? 0 : ph < 2 ? 1 : 2;
  }

  if (evolMode === 'massive') {
    evolPhase += dt * 0.04;
    const ph = evolPhase % 7;
    // progressively reveal shells
    for (let i = 0; i < shellMeshes.length; i++) {
      if (ph > i * 0.8) { shellMeshes[i].mesh.visible = true; shellMeshes[i].target = SHELLS[i].opacity * 1.4; }
    }
    elemCount = Math.min(26, 2 + Math.floor(ph * 4));
    if (ph > 5.5) {
      // supernova
      if (!swaveActive) { swaveActive = true; swaveR = 2.2; launchGold(0,0,0,6); }
      stageIdx = 3;
    } else { stageIdx = Math.min(2, Math.floor(ph * 0.6)); }
    // Fe core pulse
    if (ph > 4) { shellMeshes[6].mat.emissiveIntensity = 0.3 + Math.sin(tSim*4)*0.2; }
  }

  if (evolMode === 'merger') {
    evolPhase += dt * 0.5;
    const ph = evolPhase;
    const orbit = Math.max(0.4, 8 - ph * 2.5);
    const angle = ph * 3.5;
    ns1.position.set(Math.cos(angle)*orbit, 0, Math.sin(angle)*orbit);
    ns2.position.set(-Math.cos(angle)*orbit, 0, -Math.sin(angle)*orbit);
    if (orbit <= 0.41 && !goldActive) launchGold(0,0,0,8);
    if (goldActive) elemCount = Math.min(92, 26 + Math.floor(evolPhase*30));
    stageIdx = 4;
  }

  if (evolMode === 'origins') {
    stageIdx = 4; elemCount = 92;
    const t = tSim * 0.3;
    shellMeshes.forEach((s,i) => { s.mat.emissiveIntensity = 0.08 + Math.sin(t + i*0.8)*0.06; });
  }

  // smooth shell opacity
  shellMeshes.forEach(s => { s.mat.opacity += (s.target - s.mat.opacity) * dt * 2; });

  // shockwave expand
  if (swaveActive) {
    swaveR += dt * 4;
    swaveMesh.scale.setScalar(swaveR);
    swaveMat.opacity = Math.max(0, 0.6 - swaveR * 0.04);
    if (swaveR > 18) swaveActive = false;
  }

  // gold particles drift
  if (goldActive) {
    for (let i = 0; i < MAX_GOLD; i++) {
      goldPos[i*3]   += goldVels[i].x * dt;
      goldPos[i*3+1] += goldVels[i].y * dt;
      goldPos[i*3+2] += goldVels[i].z * dt;
    }
    goldGeo.attributes.position.needsUpdate = true;
  }

  // star pulse
  starLight.intensity = 5.5 + Math.sin(tSim*1.3)*0.5;

  // stats
  const stageNamesArr = LANG === 'en' ? stageNames.en : stageNames.zh;
  document.getElementById('stStage').textContent = stageNamesArr[Math.min(stageIdx, stageNamesArr.length-1)];
  document.getElementById('stMass').textContent = evolMode === 'massive' ? '20' : evolMode === 'merger' ? '1.4+1.4' : '1.0';
  const coreTemps = [0.15, 0.2, 0.8, 2.0, 50];
  document.getElementById('stTemp').textContent = coreTemps[Math.min(stageIdx, coreTemps.length-1)].toFixed(2);
  document.getElementById('stElem').textContent = elemCount;

  // highlight step
  const si = Math.min(stageIdx, 5);
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li,i) => li.classList.toggle('on', i === si));
  }

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

applyTheme(); applyLang(); buildSteps();
setMode('solar');
requestAnimationFrame(frame);
</script>
</body>
</html>
