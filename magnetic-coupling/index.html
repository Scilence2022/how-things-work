<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>磁力联轴器 · 隔壁传扭矩与打滑保护</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,107,107,.6);background:rgba(255,107,107,.14);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(201,42,42,.55);background:rgba(201,42,42,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="title">
  <h1 data-zh="磁力联轴器 · 隔壁传扭矩与打滑保护" data-en="Magnetic Coupling · torque through a wall, slip as fuse">磁力联轴器 · 隔壁传扭矩与打滑保护</h1>
  <div class="sub" data-zh="内外转子各镶一圈永磁体，隔着密封壁「隔空咬合」，泵轴不穿壁→零泄漏；负载超过最大磁扭矩的瞬间脱耦打滑，是天然过载保护 · 试堵转：抓住从动转子看磁体一格格跳 · 拖动旋转 / 空格运行/暂停" data-en="Two magnet rings bite through the seal wall — the pump shaft never pierces it, so zero leakage; overload beyond peak magnetic torque breaks synchronism and slips, a built-in fuse · try the stall test: grab the driven rotor · drag to orbit / Space = run/pause">内外转子各镶一圈永磁体，隔着密封壁「隔空咬合」，泵轴不穿壁→零泄漏；负载超过最大磁扭矩的瞬间脱耦打滑，是天然过载保护 · 试堵转：抓住从动转子看磁体一格格跳 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 模型：s = p·δ 为电角度，τ = τmax·sin(s)，τmax ∝ p/d³（磁偶极耦合量级）
   动力学：J·dω/dt = τ − τload − c·ω；s 越过 ±π/2（每 2π 一格）即脱耦滑步 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const R2D=180/Math.PI;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,22,60);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(5.5,3.4,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.4,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=3; controls.maxDistance=50;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(6,9,7); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-7,4,-6); scene.add(fill);

/* ---- 材质 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const steelM=new THREE.MeshStandardMaterial({color:0x8b98a5,roughness:0.35,metalness:0.8});
const darkM =new THREE.MeshStandardMaterial({color:0x2e3a47,roughness:0.45,metalness:0.6});
const discM =new THREE.MeshStandardMaterial({color:0xd9730d,roughness:0.4,metalness:0.55});
const discM2=new THREE.MeshStandardMaterial({color:0x4a7fa5,roughness:0.4,metalness:0.55});
const nM    =new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0x992222,emissiveIntensity:0.25,roughness:0.4});
const sM    =new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1c4f7c,emissiveIntensity:0.25,roughness:0.4});
const shellM=new THREE.MeshStandardMaterial({color:0x74e0d0,transparent:true,opacity:0.18,roughness:0.15,metalness:0.1,side:THREE.DoubleSide});
const bladeM=new THREE.MeshStandardMaterial({color:0xc7d2de,roughness:0.3,metalness:0.75});
const motorM=new THREE.MeshStandardMaterial({color:0x3a4552,roughness:0.5,metalness:0.5});
const lineM =new THREE.LineBasicMaterial({color:0xffd43b,transparent:true,opacity:0.75});
const lineM2=new THREE.LineBasicMaterial({color:0x74e0d0,transparent:true,opacity:0.75});

/* ---- 场景 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(30,0.3,10),groundM);
ground.position.set(0,-2.5,0); scene.add(ground);

let pPairs=4, gap=0.6;
const R_MAG=1.05;
/* 主动转子（左，电机侧） */
const rotorD=new THREE.Group(); scene.add(rotorD);
const shaftD=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,4.4,14),steelM);
shaftD.rotation.z=Math.PI/2; shaftD.position.x=-1.6; rotorD.add(shaftD);
const motor=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,1.3,24),motorM);
motor.rotation.z=Math.PI/2; motor.position.x=-3.1; scene.add(motor);
/* 从动转子（右，泵侧） */
const rotorN=new THREE.Group(); scene.add(rotorN);
const shaftN=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,3.6,14),steelM);
shaftN.rotation.z=Math.PI/2; shaftN.position.x=1.7; rotorN.add(shaftN);
/* 泵壳与叶轮 */
const volute=new THREE.Mesh(new THREE.TorusGeometry(0.85,0.3,14,36),darkM);
volute.rotation.y=Math.PI/2; volute.position.x=2.9; scene.add(volute);
const impeller=new THREE.Group(); impeller.position.x=2.9; scene.add(impeller);
for(let i=0;i<4;i++){
  const a=i*Math.PI/2;
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.55,0.2),bladeM);
  b.position.set(0,0.32*Math.cos(a),0.32*Math.sin(a));
  b.rotation.x=a;                 // 叶片长轴指向半径方向（轴沿 X）
  impeller.add(b);
}
/* 密封隔离套（静止、不转） */
const shell=new THREE.Mesh(new THREE.CylinderGeometry(1.38,1.38,1.15,40,1,true),shellM);
shell.rotation.z=Math.PI/2; scene.add(shell);
const rimA=new THREE.Mesh(new THREE.TorusGeometry(1.38,0.05,10,40),darkM);
rimA.rotation.y=Math.PI/2; rimA.position.x=-0.58; scene.add(rimA);
const rimB=rimA.clone(); rimB.position.x=0.58; scene.add(rimB);

/* 磁体与转子盘（随对数/气隙重建） */
const magnetsD=new THREE.Group(), magnetsN=new THREE.Group();
rotorD.add(magnetsD); rotorN.add(magnetsN);
let discD=null, discN=null;
function buildMagnets(){
  magnetsD.clear(); magnetsN.clear();
  if(discD){rotorD.remove(discD); rotorN.remove(discN);}
  const xD=-(gap/2+0.10), xN=gap/2+0.10;
  discD=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.16,40),discM);
  discD.rotation.z=Math.PI/2; discD.position.x=xD-0.14; rotorD.add(discD);
  discN=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.16,40),discM2);
  discN.rotation.z=Math.PI/2; discN.position.x=xN+0.14; rotorN.add(discN);
  for(let j=0;j<2*pPairs;j++){
    const a=j*Math.PI/pPairs;
    const md=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.42,0.3),j%2===0?nM:sM);
    md.position.set(xD,R_MAG*Math.cos(a),R_MAG*Math.sin(a)); md.rotation.x=a;
    magnetsD.add(md);
    const mn=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.42,0.3),j%2===0?sM:nM); // 对齐时异性相对
    mn.position.set(xN,R_MAG*Math.cos(a),R_MAG*Math.sin(a)); mn.rotation.x=a;
    magnetsN.add(mn);
  }
  buildLines();
}
/* 磁力线：每对极一条，从主动 N 极弧跨气隙到从动 S 极，滞后角 s/p 扭斜 */
const fieldGroup=new THREE.Group(); scene.add(fieldGroup);
let lines=[];
function buildLines(){
  fieldGroup.clear(); lines=[];
  for(let k=0;k<pPairs;k++){
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(14*3),3));
    const l=new THREE.Line(geo,(k%2===0)?lineM:lineM2);
    fieldGroup.add(l); lines.push(l);
  }
}
function updateLines(sLag,thetaD){
  if(!lines.length) return;
  const xD=-(gap/2+0.02), xN=gap/2+0.02;
  for(let k=0;k<pPairs;k++){
    const aD=thetaD+k*2*Math.PI/pPairs;                    // 主动 N 极
    const aN=thetaD-sLag/pPairs+2*k*Math.PI/pPairs;        // 从动 S 极（滞后 s/p 扭斜）
    const rMid=R_MAG+0.32;
    const aMid=(aD+aN)/2;
    const p0=new THREE.Vector3(xD,R_MAG*Math.cos(aD),R_MAG*Math.sin(aD));
    const p2=new THREE.Vector3(xN,R_MAG*Math.cos(aN),R_MAG*Math.sin(aN));
    const p1=new THREE.Vector3(0,rMid*Math.cos(aMid),rMid*Math.sin(aMid));
    const arr=lines[k].geometry.attributes.position.array;
    for(let i=0;i<14;i++){
      const t=i/13, w=1-t;
      arr[i*3]  =w*w*p0.x+2*w*t*p1.x+t*t*p2.x;
      arr[i*3+1]=w*w*p0.y+2*w*t*p1.y+t*t*p2.y;
      arr[i*3+2]=w*w*p0.z+2*w*t*p1.z+t*t*p2.z;
    }
    lines[k].geometry.attributes.position.needsUpdate=true;
  }
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('主动转子（电机侧）','Drive rotor (motor)'),new THREE.Vector3(-2.2,1.9,0),'o');
addLabel(()=>L('从动转子（泵侧）','Driven rotor (pump)'),new THREE.Vector3(2.0,1.9,0),'b');
addLabel(()=>L('密封隔离套 · 轴不穿壁 = 零泄漏','Seal shell · no shaft penetration = zero leak'),new THREE.Vector3(0,-1.85,0),'g');
addLabel(()=>L('气隙 d','Air gap d'),new THREE.Vector3(0,1.0,0),'',()=>true);
addLabel(()=>L('磁力线扭曲 = 传递的扭矩','Twisted field lines = transmitted torque'),new THREE.Vector3(-0.2,2.35,0),'o',
  ()=>fieldOn&&slipCount===0);
addLabel(()=>L('✕ 脱耦打滑：磁体一格格跳','✕ DECOUPLED: magnets skipping poles'),new THREE.Vector3(0,-2.15,0),'r',
  ()=>slipCount>0||stall);

/* ---- 状态与动力学 ---- */
let playing=true, labelsOn=true, fieldOn=true, stall=false, simT=0;
let thetaD=0, thetaN=0, s=0, slipCount=0, flash=0, rpm=48;
let loadSet=0.6;                       // 滑块设定的负载（模型单位）
const J=0.06, C=0.10;
function tauMax(){ return 0.5*pPairs*Math.pow(0.6/gap,3); }   // τmax ∝ p/d³
let lastK=0;
function stepPhysics(dt){
  const load=stall?99:loadSet;
  const tm=tauMax();
  const tq=tm*Math.sin(s);
  if(!stall){
    /* J·dω/dt = τ − τload − c·ω */
    omegaN+=((tq-load)-C*omegaN)/J*dt;
    thetaN+=omegaN*dt;
  }else{
    omegaN=0;                    // 堵转：从动转子被抓住
  }
  s=pPairs*(thetaD-thetaN);      // 电角度滞后
  /* 滑步计数：s 每越过 ±π/2 一个整 2π 记一格（一格 = 一个极距） */
  const k=Math.floor((s+Math.PI/2)/(2*Math.PI));
  if(k!==lastK){ slipCount+=Math.abs(k-lastK); flash=1; lastK=k; }
}
let omegaN=0;

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  darkM.color.setHex(dark?0x2e3a47:0x6b7d8e);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'内外转子各镶一圈永磁体，隔着密封壁异性相吸、自动对齐（δ≈0）',
   en:'Two permanent-magnet rings attract through the seal wall and self-align (δ≈0)', do:()=>{stall=false; syncStallBtn(); setLoad(0.6); setGap(0.06);}},
  {zh:'主动转子转动，磁场像一组看不见的齿轮，拖动从动转子同步旋转',
   en:'The field acts like an invisible gear set, dragging the driven rotor in sync', do:()=>{setLoad(0.4);}},
  {zh:'负载加大 → 转差角 δ 拉开，磁力线被扭斜，τ = τmax·sin(pδ)',
   en:'More load widens the lag angle and skews the field lines; τ = τmax·sin(pδ)', do:()=>{setLoad(1.35);}},
  {zh:'负载超过 τmax 的瞬间脱耦：磁体一格格跳步打滑——天然过载保护',
   en:'Past τmax the coupling breaks: magnets skip pole by pole — a natural overload fuse', do:()=>{stall=true; syncStallBtn();}},
  {zh:'松开负载：从动转子追回同步，转差角收敛前小幅振荡（整步抖动）',
   en:'Release: the rotor catches up, hunting briefly before the lag settles', do:()=>{stall=false; syncStallBtn(); setLoad(0.5);}},
  {zh:'泵轴不穿壁→零泄漏（化工泵/血泵）；气隙 d 翻倍，τmax 掉到 1/8',
   en:'No shaft through the wall = zero leakage; double the gap and τmax drops to 1/8', do:()=>{setGap(0.095); setLoad(0.8);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((stp,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?stp.en:stp.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i; syncSteps(); STEPS[i].do();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 统计 ---- */
function updateStats(){
  const tm=tauMax()*12;
  const tq=Math.sin(s)*tauMax()*12;
  const lag=((s/pPairs)%(2*Math.PI/pPairs)+2*Math.PI/pPairs)%(2*Math.PI/pPairs);
  document.getElementById('stLag').innerHTML=(lag*R2D).toFixed(0)+'<small> °</small>';
  const tqEl=document.getElementById('stTq');
  tqEl.innerHTML=tq.toFixed(1)+'<small> N·m</small>';
  tqEl.style.color=Math.abs(tq)>tm*0.92?'#ff8787':'';
  document.getElementById('stMax').innerHTML=tm.toFixed(1)+'<small> N·m</small>';
  document.getElementById('stSlip').innerHTML=slipCount.toString();
}
function setLoad(v){
  loadSet=v;
  document.getElementById('sLoad').value=Math.round(v*100);
  document.getElementById('sLoadVal').textContent=(v*12).toFixed(1)+' N·m';
}
function setPairs(n){ pPairs=n; buildMagnets();
  document.getElementById('sPairsVal').textContent=n+' 对'; }
function setGap(v){ gap=v; buildMagnets();
  document.getElementById('sGapVal').textContent=Math.round(v*100)+' mm'; }
function syncStallBtn(){
  const b=document.getElementById('btnStall');
  b.classList.toggle('on',stall);
  b.textContent=stall?L('松开从动转子','Release driven rotor'):L('堵转测试：抓住从动转子','Stall test: grab driven rotor');
}

/* ---- UI ---- */
document.getElementById('sLoad').addEventListener('input',e=>setLoad(+e.target.value/100));
document.getElementById('sPairs').addEventListener('input',e=>setPairs(+e.target.value));
document.getElementById('sGap').addEventListener('input',e=>setGap(+e.target.value/100));
document.getElementById('btnStall').addEventListener('click',()=>{stall=!stall; syncStallBtn();
  if(!stall){ lastK=Math.floor((s+Math.PI/2)/(2*Math.PI)); }});
document.getElementById('btnZero').addEventListener('click',()=>{stall=false; syncStallBtn(); setLoad(0);});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglField').addEventListener('change',e=>{fieldOn=e.target.checked; fieldGroup.visible=fieldOn;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh'; localStorage.setItem('htw-lang',LANG); applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark'; localStorage.setItem('htw-theme',THEME); applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    thetaD+=rpm/60*2*Math.PI*dt;
    stepPhysics(dt);
    flash*=Math.exp(-5*dt);
  }
  rotorD.rotation.x=thetaD;
  rotorN.rotation.x=thetaN;
  impeller.rotation.x=thetaN*1.4;
  updateLines(s,thetaD);
  lineM.opacity=0.75+flash*0.25; lineM2.opacity=0.75+flash*0.25;
  acc+=dt; if(acc>0.1){acc=0; updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis(); if(r.o.visible) r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta(); raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf); raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数与初始化 ---- */
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1') playing=false;
if(qp.get('labels')==='0') labelsOn=false;
if(qp.get('speed')){ rpm=clamp(+qp.get('speed')||48,10,120); }
document.getElementById('tglLabels').checked=labelsOn;
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
setPairs(4); setGap(0.06); setLoad(0.6);
applyTheme(); applyLang(); buildSteps(); start();
</script>
</body>
</html>
