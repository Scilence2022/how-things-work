<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减数分裂 · 交叉互换,兄弟姐妹为什么不同</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.f { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.m { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="减数分裂:交叉互换,兄弟姐妹为什么不同" data-en="Meiosis: crossing over — why siblings differ">减数分裂：交叉互换，兄弟姐妹为什么不同</h1>
  <div class="sub" data-zh="同源染色体配对联会 → 四分体上交叉点物理交换片段 → 两次分裂 2n→n——重组不是洗牌,是换段 · 空格播放/暂停" data-en="Homologs pair up → chiasmata physically swap segments → two divisions take 2n to n — recombination is not shuffling, it is trading · Space = play/pause">同源染色体配对联会 → 四分体上交叉点物理交换片段 → 两次分裂 2n→n——重组不是洗牌，是换段 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="时期" data-en="phase">时期</span><span class="v" id="stPh" style="font-size:14px">—</span>
  <span class="k" data-zh="染色体数" data-en="chromosomes">染色体数</span><span class="v g" id="stN">2n</span>
  <span class="k" data-zh="交叉点" data-en="crossovers">交叉点</span><span class="v" id="stX">—</span>
  <span class="k" data-zh="重组注脚" data-en="combos">重组注脚</span><span class="v" style="font-size:14px">2²³ ≈ 840 万</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.f" data-zh="父源(红)" data-en="paternal (red)">父源(红)</span>
    <span class="chip.m" data-zh="母源(蓝)" data-en="maternal (blue)">母源(蓝)</span>
  </div>
  <div class="row"><label data-zh="分裂进度" data-en="progress">分裂进度</label><input id="scrub" type="range" min="0" max="1000" step="5" value="0"><span class="val" id="scrubVal">0%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../dna-replication/" data-zh="上游:复制" data-en="upstream: replication">上游:复制</a>
    <a href="../telomeres/" data-zh="末端问题" data-en="the end problem">末端问题</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('减数分裂', 'Meiosis');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.5, 1.8, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const M = {
  F: mat(0xff6b6b),       // 父源
  Mt: mat(0x74c0fc),      // 母源
  cell: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.10,
    roughness: 0.15, side: THREE.DoubleSide, depthWrite: false }),
  chiasma: new THREE.MeshBasicMaterial({ color: 0xffd166, blending: THREE.AdditiveBlending, transparent: true }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.6, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -1.0;
scene.add(base);

/* ================= 染色体珠链 ================= */
/* 染色体 = 一串珠。父源红、母源蓝;交换后混色。珠数 14,交换区 5-9 */
const NBEAD = 14, X0 = 4, X1 = 10;
const root = new THREE.Group();
root.position.y = 0.7;
scene.add(root);
function beadColor(i, origin) {
  if (origin === 'F') return i < X0 || i >= X1 ? 0xff6b6b : 0xffd166;   // 父源换入蓝段显示金?简化:换入段用对方色
  return i < X0 || i >= X1 ? 0x74c0fc : 0xff6b6b;
}
function mkChrom(grp, origin) {
  const beads = [];
  for (let i = 0; i < NBEAD; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 10), mat(beadColor(i, origin)));
    m.position.set((i - (NBEAD - 1) / 2) * 0.24, 0, 0);
    grp.add(m);
    beads.push(m);
  }
  return beads;
}
/* 父源在左,母源在右(配对时靠拢) */
const chrF = new THREE.Group(); root.add(chrF);
const chrM = new THREE.Group(); root.add(chrM);
const beadsF = mkChrom(chrF, 'F');
const beadsM = mkChrom(chrM, 'M');

/* 细胞膜(两个阶段显示) */
const cellA = new THREE.Mesh(new THREE.SphereGeometry(2.5, 32, 24), M.cell);
cellA.position.y = 0.7;
root.add(cellA);
const cellsB = [];       // 减 I 后两细胞
const cellsC = [];       // 减 II 后四细胞
for (const dx of [-1.6, 1.6]) {
  const c = new THREE.Mesh(new THREE.SphereGeometry(1.35, 26, 20), M.cell.clone());
  c.position.set(dx, 0.7, 0);
  c.visible = false;
  root.add(c);
  cellsB.push(c);
}
for (const [dx, dz] of [[-1.5, -1.2], [1.5, -1.2], [-1.5, 1.2], [1.5, 1.2]]) {
  const c = new THREE.Mesh(new THREE.SphereGeometry(0.85, 22, 16), M.cell.clone());
  c.position.set(dx, 0.7, dz);
  c.visible = false;
  root.add(c);
  cellsC.push(c);
}

/* 交叉点标记 */
const chiasma = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.035, 8, 24), M.chiasma);
root.add(chiasma);

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let ph = 0;              // 0..1 总进度
let tSim = 0;
/* 位置布局函数(随相位) */
function layout() {
  /* 阶段:
     0-0.22 联会靠拢  0.22-0.40 交叉互换(中段换色+互换动画)  0.40-0.62 减I(同源分离→两细胞)
     0.62-0.82 减II(姐妹分离)  0.82-1.0 四个配子 */
  const pair = ss(0, 0.2, ph);
  const cross = ss(0.22, 0.42, ph);
  const meiosis1 = ss(0.44, 0.62, ph);
  const meiosis2 = ss(0.66, 0.84, ph);
  const gametes = ss(0.86, 1.0, ph);
  const sep = Math.max(meiosis1, meiosis2);

  chrF.position.x = lerp(-1.05, -0.34, pair) - sep * 1.3;
  chrM.position.x = lerp(1.05, 0.34, pair) + sep * 1.3;
  chrF.position.y = -sep * 0.5 + meiosis2 * 0.2;
  chrM.position.y = -sep * 0.5 + meiosis2 * 0.2;
  /* 姐妹分离:减 II 时两链各自劈半错开 */
  chrF.rotation.z = meiosis2 * 0.25;
  chrM.rotation.z = -meiosis2 * 0.25;

  /* 交叉互换:5-9 号珠换色 */
  if (cross > 0.02) {
    for (let i = X0; i < X1; i++) {
      beadsF[i].material = cross > 0.5 ? M.Mt : M.F;
      beadsM[i].material = cross > 0.5 ? M.F : M.Mt;
    }
  } else {
    for (let i = 0; i < NBEAD; i++) {
      beadsF[i].material = M.F;
      beadsM[i].material = M.Mt;
    }
  }
  /* 交叉点标记 */
  chiasma.visible = ph > 0.2 && ph < 0.5;
  chiasma.position.set(0, -0.05 + Math.sin(tSim * 3) * 0.05, 0);
  chiasma.rotation.x = tSim * 1.5;
  /* 细胞膜 */
  cellA.visible = ph < 0.55;
  cellA.scale.setScalar(1 - meiosis1 * 0.25);
  cellsB.forEach(c => c.visible = ph >= 0.5 && ph < 0.86);
  cellsC.forEach(c => c.visible = ph >= 0.84);
  return { pair, cross, meiosis1, meiosis2, gametes, sep };
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = root) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblChr = addLabel(() => L('父源(红)与母源(蓝):同一对同源染色体', 'paternal (red) and maternal (blue): one homologous pair'),
  new THREE.Vector3(0, 1.7, 0), 'st');
const lblStage = addLabel(() => {
  if (ph < 0.2) return L('联会:同源染色体精确配对——一条来自父,一条来自母,基因座对基因座', 'synapsis: homologs pair precisely — one from dad, one from mom, locus to locus');
  if (ph < 0.44) return L('交叉互换:四分体上交叉点处,非姐妹染色单体的片段「物理换段」——不是洗牌,是换段!', 'crossing over: at the chiasma, non-sister chromatids physically trade segments — not shuffling, trading!');
  if (ph < 0.62) return L('减数第一次分裂:同源染色体分离(姐妹不分)——2n → n,染色体数目减半', 'meiosis I: homologs separate (sisters stay) — 2n → n, the number halves');
  if (ph < 0.84) return L('减数第二次分裂:姐妹染色单体分离——与有丝分裂相同,但已经没有同源对了', 'meiosis II: sister chromatids separate — like mitosis, but with no homolog pairs left');
  return L('四个配子:每套单倍体基因都混有父段与母段——这就是兄弟姐妹各不相同的原因', 'four gametes: every haploid set mixes paternal and maternal segments — why siblings differ');
}, new THREE.Vector3(0, -1.35, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '联会:精确配对', be: 'Synapsis: precise pairing',
    d: '每对同源染色体肩并肩锁在一起(四分体)。配对靠的是序列同源性——错一个位置都会被修正机器揪出来。',
    de: 'Homologs lock shoulder to shoulder into a tetrad. Pairing is sequence-driven — a single misalignment gets caught by repair machinery.',
    act: () => { ph = 0.18; apply(true); } },
  { b: '交叉互换:换段', be: 'Crossing over: trade segments',
    d: '交叉点处两条非姐妹染色单体断裂再重接——中间一整段红蓝互换。注意看:珠子的颜色在交叉区互换了。',
    de: 'At the chiasma two non-sister chromatids break and rejoin — a whole middle segment swaps. Watch the beads change color in the crossover zone.',
    act: () => { ph = 0.4; apply(true); } },
  { b: '减 I:同源分离', be: 'Meiosis I: homologs split',
    d: '第一次分裂把「成对」拆开:每个子细胞拿到一条父源或母源(已重组)——染色体数 2n→n,姐妹着丝粒还没分。',
    de: 'The first division splits the PAIR: each cell gets one recombinant homolog — 2n → n, sister centromeres still intact.',
    act: () => { ph = 0.62; apply(true); } },
  { b: '减 II:姐妹分离', be: 'Meiosis II: sisters split',
    d: '第二次分裂拆「姐妹」:与有丝分裂同款,但此时已无同源对——最终四个单倍体配子。',
    de: 'The second division splits SISTERS — mitosis mechanics, but no homolog pairs remain: four haploid gametes.',
    act: () => { ph = 0.85; apply(true); } },
  { b: '为什么兄弟姐妹不同', be: 'Why siblings differ',
    d: '三重抽奖:交叉互换换段(本页)+ 同源分离时父/母随机分配(2²³)+ 受精随机配对。同一对父母,组合空间约 840 万×2。',
    de: 'Triple lottery: crossing over (this page) + random homolog assortment (2²³) + random fertilization. Same parents, ~8.4 million×2 combos.',
    act: () => { ph = 1; apply(true); } },
];
function stepIndex() {
  if (ph >= 0.86) return 4;
  if (ph >= 0.66) return 3;
  if (ph >= 0.44) return 2;
  if (ph >= 0.22) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 相位应用 ================= */
let fired = new Set();
function apply(reset) {
  if (reset) fired = new Set();
  document.getElementById('stPh').textContent =
    ph < 0.2 ? L('联会', 'synapsis') : ph < 0.44 ? L('交叉互换', 'crossing over')
    : ph < 0.62 ? L('减数第一次分裂', 'meiosis I') : ph < 0.84 ? L('减数第二次分裂', 'meiosis II') : L('四个配子', 'four gametes');
  document.getElementById('stN').textContent = ph < 0.62 ? '2n' : 'n';
  document.getElementById('stX').textContent = ph > 0.22 ? '1-2 处' : '—';
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elScrub.addEventListener('input', () => {
  playing = false;
  setPlayLabel();
  ph = parseInt(elScrub.value, 10) / 1000;
  elScrubVal.textContent = Math.round(ph * 100) + '%';
  apply(true);
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  if (playing) {
    const pb = Math.floor(ph * 1000);
    ph = clamp(ph + dts * 0.04, 0, 1);
    elScrub.value = Math.round(ph * 1000);
    elScrubVal.textContent = Math.round(ph * 100) + '%';
    if (Math.floor(ph * 1000) !== pb) apply(false);
  }
  layout();
  /* 染色体轻微扭动 */
  chrF.rotation.y = Math.sin(tSim * 0.8) * 0.08 * (ph < 0.44 ? 1 : 0.3);
  chrM.rotation.y = -Math.sin(tSim * 0.8) * 0.08 * (ph < 0.44 ? 1 : 0.3);

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

apply(true);
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
