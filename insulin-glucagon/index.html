<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>血糖双人舞 · 胰岛素与胰高血糖素</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 220px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.gl { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.i { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(255,107,107,.2); border-color: rgba(255,107,107,.6); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="血糖双人舞:胰岛素降,胰高血糖素升" data-en="The Glucose Duet: insulin down, glucagon up">血糖双人舞：胰岛素降，胰高血糖素升</h1>
  <div class="sub" data-zh="饭后血糖飙 → β 细胞放胰岛素 → 细胞开门收糖;空腹血糖跌 → α 细胞放胰高血糖素 → 肝脏放糖——双闸负反馈 · 空格播放/暂停" data-en="A meal spikes glucose → β cells release insulin → cells open gates; fasting drops it → α cells release glucagon → the liver pours — a two-gate negative feedback · Space = play/pause">饭后血糖飙 → β 细胞放胰岛素 → 细胞开门收糖；空腹血糖跌 → α 细胞放胰高血糖素 → 肝脏放糖——双闸负反馈 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="plot">
  <h3 data-zh="血糖曲线(目标带 70–110 mg/dL)" data-en="Glucose trace (target band 70–110 mg/dL)">血糖曲线(目标带 70–110 mg/dL)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="stats">
  <span class="k" data-zh="血糖" data-en="glucose">血糖</span><span class="v g" id="stTx">—</span>
  <span class="k" data-zh="激素状态" data-en="hormones">激素状态</span><span class="v" id="stEnz" style="font-size:14px">—</span>
  <span class="k" data-zh="对侧激素" data-en="counter">对侧激素</span><span class="v" id="stLac" style="font-size:14px">—</span>
  <span class="k" data-zh="区间" data-en="zone">区间</span><span class="v" id="stState" style="font-size:14px">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.gl" data-zh="葡萄糖(黄球)" data-en="glucose (yellow)">葡萄糖(黄球)</span>
    <span class="chip.i" data-zh="胰岛素(蓝)/胰高血糖素(红)" data-en="insulin (blue) / glucagon (red)">胰岛素(蓝)/胰高血糖素(红)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnMeal" data-zh="吃一顿大餐" data-en="eat a big meal">吃一顿大餐</button>
    <button class="abtn" id="btnFast" data-zh="空腹运动" data-en="fast + exercise">空腹运动</button>
  </div>
  <div class="row"><label data-zh="糖尿病模式" data-en="diabetes mode">糖尿病模式</label><input id="diab" type="range" min="0" max="100" step="1" value="0"><span class="val" id="diabVal">0%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../centrifugal-governor/" data-zh="工程版:负反馈调速" data-en="the engineering version">工程版:负反馈调速</a>
    <a href="../glycolysis/" data-zh="糖的去处:糖酵解" data-en="where sugar goes: glycolysis">糖的去处:糖酵解</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('血糖双人舞', 'The Glucose Duet');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 1.8, 7.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const M = {
  glucose: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  insulin: new THREE.MeshBasicMaterial({ color: 0x74c0fc }),
  glucagon: new THREE.MeshBasicMaterial({ color: 0xff6b6b }),
  pancreas: mat(0xb197fc, { opacity: 0.6 }),
  liver: mat(0xc0392b, { opacity: 0.55 }),
  cell: mat(0x63e6be, { opacity: 0.5 }),
  gate: new THREE.MeshBasicMaterial({ color: 0x2b3040 }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.6, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -1.0;
scene.add(base);

/* 场景:胰(左上) 血管(中) 细胞(右) 肝(左下) */
const pancreas = new THREE.Mesh(new THREE.SphereGeometry(0.5, 22, 16), M.pancreas);
pancreas.position.set(-2.6, 2.0, 0);
scene.add(pancreas);
const liver = new THREE.Mesh(new THREE.SphereGeometry(0.62, 22, 16), M.liver);
liver.position.set(-2.5, -0.4, 0);
liver.scale.set(1.2, 0.8, 0.9);
scene.add(liver);
/* 体细胞(带糖门) */
const bodyCells = [];
for (let i = 0; i < 4; i++) {
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.SphereGeometry(0.44, 20, 16), M.cell);
  g.add(c);
  const gate = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.06), M.gate);
  gate.position.set(0.42, 0, 0);
  g.add(gate);
  g.position.set(2.3 + (i % 2) * 0.4, 0.5 + Math.floor(i / 2) * 0.9 - 0.3, (i % 2 ? 0.5 : -0.5));
  scene.add(g);
  bodyCells.push({ g, gate, open: 0 });
}

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let glucose = 90;          // mg/dL
let insulin = 0, glucagon = 0;
let diabetes = 0;          // 0..1 胰岛素效力
let tSim = 0;
let intake = 0;            // 外源糖摄入流
let drawdown = 0;          // 运动消耗
const hist = [];           // 血糖历史
const parts = [];          // {mesh, kind, t, from, to}

function spawnPart(kind, from, to) {
  const mm = { glu: M.glucose, ins: M.insulin, gluca: M.glucagon }[kind];
  const m = new THREE.Mesh(new THREE.SphereGeometry(kind === 'glu' ? 0.06 : 0.08, 10, 8), mm);
  m.position.copy(from);
  scene.add(m);
  parts.push({ mesh: m, kind, t: 0, from: from.clone(), to: to.clone() });
}

function eat() { intake += 55; }
function exercise() { drawdown += 45; }

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblPan = addLabel(() => insulin > glucagon + 0.05
  ? L('β 细胞:血糖高!放胰岛素——「全体开门收糖,肝脏存糖」', 'β cells: glucose high! Insulin out — "everyone open gates; liver, store it"')
  : glucagon > insulin + 0.05
    ? L('α 细胞:血糖低!放胰高血糖素——「肝脏,把糖原拆成糖放出来」', 'α cells: glucose low! Glucagon out — "liver, crack glycogen back into glucose"')
    : L('胰岛:双闸静默,血糖在舒适区', 'islets: both gates quiet, glucose in the comfort zone'),
  new THREE.Vector3(-2.6, 2.75, 0), insulin > glucagon ? 'g' : 'r');
const lblCell = addLabel(() => diabetes > 0.5
  ? L('细胞:门口有胰岛素(蓝点在敲),但门锁生锈——糖进不去(2 型糖尿病)', 
      'cells: insulin at the door (blue dots knocking), but the lock is rusty — sugar cannot enter (type 2 diabetes)')
  : bodyCells.some(c => c.open > 0.5)
    ? L('细胞:糖门大开,葡萄糖涌入烧能/存糖原', 'cells: gates open, glucose floods in to burn or store')
    : L('细胞:糖门紧闭(没有胰岛素信号)', 'cells: gates shut (no insulin signal)'),
  new THREE.Vector3(2.6, -0.55, 0), 'st');
const lblLiver = addLabel(() => glucagon > insulin
  ? L('肝脏:拆糖原,放葡萄糖回血', 'liver: cracking glycogen, pouring glucose back')
  : L('肝脏:收糖存糖原(仓库模式)', 'liver: taking glucose in, stocking glycogen (warehouse mode)'),
  new THREE.Vector3(-2.5, 0.5, 0), 'r');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '饭后:血糖飙升', be: 'After a meal: the spike',
    d: '一碗饭变出大量葡萄糖涌入血管——血糖冲破 140 mg/dL。糖本身是燃料,但在血里泡久了就是毒(糖化蛋白)。',
    de: 'A meal dumps glucose into blood past 140 mg/dL. Sugar is fuel, but soaking in blood too long poisons (glycated proteins).',
    act: () => eat() },
  { b: '胰岛素:全体开门', be: 'Insulin: everyone open up',
    d: 'β 细胞感知高糖,放胰岛素;胰岛素敲细胞的「糖门」受体——门开,糖进细胞烧掉或存成糖原,血糖回落。',
    de: 'β cells sense the spike and release insulin; it knocks on cell glucose-gates — they open, sugar burns or stores as glycogen, and blood levels fall.',
    act: () => eat() },
  { b: '空腹:胰高血糖素救场', be: 'Fasting: glucagon to the rescue',
    d: '几个小时不吃饭,血糖滑向 70 以下——α 细胞放胰高血糖素,肝脏把糖原拆回葡萄糖放血,血糖托底。脑只有糖能吃,绝不能断。',
    de: 'Hours without food slide glucose toward 70 — α cells release glucagon, the liver cracks glycogen back into blood. The brain runs on glucose alone; the line must hold.',
    act: () => exercise() },
  { b: '双闸负反馈', be: 'Two-gate negative feedback',
    d: '升了有降闸、降了有升闸——血糖被夹在 70-110 mg/dL 窄带。与瓦特调速器、恒温器同一数学:偏差→响应→回归。',
    de: 'Rise triggers the down-gate, fall triggers the up-gate — glucose pinned to a 70-110 mg/dL band. Same math as Watt\'s governor and the thermostat: error → response → return.',
    act: () => eat() },
  { b: '糖尿病:闸门失灵', be: 'Diabetes: the gate fails',
    d: '2 型:受体生锈(胰岛素抵抗),门打不开——血糖高位徘徊,β 细胞过劳衰竭。拖「糖尿病模式」看闸门失灵的曲线。',
    de: 'Type 2: receptors rust (insulin resistance), gates won\'t open — glucose loiters high and β cells burn out. Drag the diabetes slider to watch the curve fail.',
    act: () => { document.getElementById('diab').value = 70; document.getElementById('diab').dispatchEvent(new Event('input')); eat(); } },
];
function stepIndex() {
  if (diabetes > 0.5) return 4;
  if (glucagon > insulin + 0.05) return 2;
  if (insulin > 0.15) return 1;
  return 3;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 曲线 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 30, padR = 12;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const yOf = g => pad + (H - pad - pad) * (1 - clamp(g, 40, 260) / 260);
  /* 目标带 */
  ctx.fillStyle = 'rgba(99,230,190,.15)';
  ctx.fillRect(pad, yOf(110), W - pad - padR, yOf(70) - yOf(110));
  /* 轴 */
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.lineTo(W - padR, H - pad); ctx.stroke();
  /* 曲线 */
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3.5;
  ctx.beginPath();
  for (let i = 0; i < hist.length; i++) {
    const x = pad + (W - pad - padR) * i / 300;
    const y = yOf(hist[i]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* 激素带:胰岛素蓝/胰高血糖素红(底部) */
  for (let i = 0; i < hist.length; i++) {
    const x = pad + (W - pad - padR) * i / 300;
    if (hist[i] > 125) { ctx.fillStyle = 'rgba(116,192,252,.8)'; ctx.fillRect(x, H - pad - 8, 3, 6); }
    if (hist[i] < 78) { ctx.fillStyle = 'rgba(255,107,107,.8)'; ctx.fillRect(x, H - pad - 8, 3, 6); }
  }
  ctx.fillStyle = cTxt; ctx.font = '18px system-ui';
  ctx.fillText('70', pad - 26, yOf(70) + 6);
  ctx.fillText('mg/dL', pad - 10, pad - 8);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const btnMeal = document.getElementById('btnMeal');
const btnFast = document.getElementById('btnFast');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnMeal.addEventListener('click', eat);
btnFast.addEventListener('click', exercise);
document.getElementById('diab').addEventListener('input', e => {
  diabetes = parseInt(e.target.value) / 100;
  document.getElementById('diabVal').textContent = e.target.value + '%';
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 生理节拍 ================= */
let gluCD = 0;
function physio(dts) {
  /* 摄入/消耗 */
  glucose += intake * dts * 1.1;
  glucose -= drawdown * dts * 0.8;
  intake = Math.max(0, intake - dts * 30);
  drawdown = Math.max(0, drawdown - dts * 30);
  /* 基础耗糖 */
  glucose -= dts * 2.2;
  /* 激素:连续比例控制(偏差→响应),像调速器一样平滑 */
  insulin = lerp(insulin, clamp((glucose - 98) / 45, 0, 1), clamp(dts * 2.2, 0, 1));
  glucagon = lerp(glucagon, clamp((80 - glucose) / 22, 0, 1), clamp(dts * 2.2, 0, 1));
  insulin = clamp(insulin, 0, 1);
  glucagon = clamp(glucagon, 0, 1);
  /* 胰岛素降糖(细胞开门收糖),糖尿病削弱 */
  const eff = insulin * (1 - diabetes * 0.85);
  glucose -= eff * dts * 14;
  bodyCells.forEach(c => c.open = lerp(c.open, clamp(eff * 1.4, 0, 1), clamp(dts * 3, 0, 1)));
  /* 胰高血糖素升糖 */
  glucose += glucagon * dts * 10;
  glucose = clamp(glucose, 40, 320);
  /* 粒子 */
  gluCD -= dts;
  if (gluCD <= 0) {
    gluCD = 0.22;
    /* 葡萄糖从肠道(左中)进血管 */
    if (intake > 2) spawnPart('glu', new THREE.Vector3(-1.2, 0.9, 0.6), new THREE.Vector3((Math.random() - 0.5) * 3.5, 0.9 + (Math.random() - 0.5) * 1.4, (Math.random() - 0.5)));
    /* 激素 */
    if (insulin > 0.12 && Math.random() < 0.7) spawnPart('ins', pancreas.position.clone(), new THREE.Vector3(2.2 + Math.random(), 0.6 + Math.random() * 0.6, (Math.random() - 0.5)));
    if (glucagon > 0.12 && Math.random() < 0.7) spawnPart('gluca', pancreas.position.clone(), liver.position.clone().add(new THREE.Vector3(0.3, 0.2, 0)));
    if (glucagon > 0.3 && Math.random() < 0.8) spawnPart('glu', liver.position.clone().add(new THREE.Vector3(0.3, 0.1, 0)), new THREE.Vector3((Math.random() - 0.5) * 2.5, 0.9 + (Math.random() - 0.5), 0));
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dts * 1.1;
    p.mesh.position.lerpVectors(p.from, p.to, clamp(p.t, 0, 1));
    if (p.t >= 1) {
      /* 到门:糖是否进细胞取决于门开 */
      scene.remove(p.mesh);
      parts.splice(i, 1);
    }
  }
  hist.push(glucose);
  if (hist.length > 300) hist.shift();
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let plotTick = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  physio(dts);
  /* 门开合动画 */
  bodyCells.forEach(c => {
    c.gate.scale.y = lerp(c.gate.scale.y, 1 + c.open * 2.2, clamp(dts * 4, 0, 1));
    c.gate.material.color.setHSL(0.45, 0.7, 0.15 + c.open * 0.35);
  });
  document.getElementById('stTx').textContent = glucose.toFixed(0);
  document.getElementById('stTx').className = 'v ' + (glucose > 140 || glucose < 65 ? 'r' : 'g');
  document.getElementById('stEnz').textContent = L(`胰岛素 ${(insulin * 100).toFixed(0)}%`, `insulin ${(insulin * 100).toFixed(0)}%`);
  document.getElementById('stLac').textContent = L(`胰高糖 ${(glucagon * 100).toFixed(0)}%`, `glucagon ${(glucagon * 100).toFixed(0)}%`);
  document.getElementById('stState').textContent = glucose > 140 ? L('高血糖!', 'HYPER') : glucose < 65 ? L('低血糖!', 'HYPO') : L('目标带内', 'in band');

  plotTick += dt;
  if (plotTick > 0.2) { plotTick = 0; drawPlot(); }
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
