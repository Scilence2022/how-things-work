<style>

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);

  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,22,60);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,200);
camera.position.set(0.15,3.1,17.0);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.15,2.05,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:左=透明粒子箱,右=速率直方图+理论曲线+Ea 竖线 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const KB=1.38049e-23,NA=6.02214e23,RG=8.314;
const BW=4.8,BH=3.8,BD=0.7,BX0=-2.9,BY0=0;          /* 粒子箱 */
const AW=4.6,AH=3.8,AX0=2.7,AY0=0.12,VAX=2600,NBIN=36;/* 直方图板,速度轴 0..2600 m/s */
const NP=300,PR=0.075,KW=0.0047;                      /* 300 分子,SI 速度→世界速度比例 */
const colM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const baseA=new THREE.Mesh(new THREE.BoxGeometry(BW+0.3,0.1,BD+0.3),colM);
baseA.position.set(BX0+BW/2,0.05,0);scene.add(baseA);
const baseB=new THREE.Mesh(new THREE.BoxGeometry(AW+0.3,0.12,BD+0.35),colM);
baseB.position.set(AX0+AW/2,0.06,0);scene.add(baseB);
/* 玻璃箱:半透明壳+亮边框 */
const glassM=new THREE.MeshStandardMaterial({color:0x9fc8e8,transparent:true,opacity:0.07,
  roughness:0.15,metalness:0.1,side:THREE.DoubleSide,depthWrite:false});
const boxShell=new THREE.Mesh(new THREE.BoxGeometry(BW,BH,BD),glassM);
boxShell.position.set(BX0+BW/2,BY0+BH/2,0);scene.add(boxShell);
const edgeM=new THREE.LineBasicMaterial({color:0x8fd0e8,transparent:true,opacity:0.7});
boxShell.add(new THREE.LineSegments(new THREE.EdgesGeometry(boxShell.geometry),edgeM));
/* 直方图板:背板+边框+基线 */
const boardG=new THREE.Group();boardG.position.set(AX0,AY0,0);scene.add(boardG);
const boardM=new THREE.MeshStandardMaterial({color:0x141a22,transparent:true,opacity:0.34,
  roughness:0.6,side:THREE.DoubleSide,depthWrite:false});
const board=new THREE.Mesh(new THREE.PlaneGeometry(AW,AH),boardM);
board.position.set(AW/2,AH/2,0);boardG.add(board);
boardG.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(AW,AH)),edgeM));
const axisM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.4,metalness:0.6});
const axisBar=new THREE.Mesh(new THREE.BoxGeometry(AW,0.03,0.05),axisM);
axisBar.position.set(AW/2,0,0.05);boardG.add(axisBar);
/* 直方图柱:InstancedMesh,超 Ea 的柱染橙 */
const barGeo=new THREE.BoxGeometry(1,1,1);barGeo.translate(0,0.5,0);
const bars=new THREE.InstancedMesh(barGeo,new THREE.MeshStandardMaterial({roughness:0.55,metalness:0.2}),NBIN);
bars.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NBIN*3),3);
boardG.add(bars);
/* 理论麦氏曲线:亮色管 */
const curveMat=new THREE.MeshStandardMaterial({color:0xffb35c,emissive:0xd9822b,emissiveIntensity:0.7,roughness:0.4});
let curveMesh=null;
const MOL={He:{m:0.004,zh:'氦气',en:'Helium'},N2:{m:0.028,zh:'氮气',en:'Nitrogen'},Ar:{m:0.040,zh:'氩气',en:'Argon'}};
/* ── Ea 竖线(可拖)与 vp 虚线 ── */
const eaM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff6b6b,emissiveIntensity:0.8,roughness:0.4});
const eaLine=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,AH+0.3,8),eaM);
eaLine.position.y=(AH+0.3)/2-0.15;
const eaG=new THREE.Group();eaG.add(eaLine);eaG.position.z=0.34;boardG.add(eaG);
const vpG=new THREE.Group();vpG.position.z=0.08;boardG.add(vpG);
const vpMat=new THREE.LineDashedMaterial({color:0xffc425,dashSize:0.09,gapSize:0.07,transparent:true,opacity:0.95});
const vpLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(0,0,0),new THREE.Vector3(0,AH,0)]),vpMat);
vpLine.computeLineDistances();vpG.add(vpLine);
/* 粒子:InstancedMesh,3D 速度(SI),2D 位置;超 Ea 尾巴染橙 */
const pGeo=new THREE.SphereGeometry(PR,10,8);
const pMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.45,metalness:0.3});
const dots=new THREE.InstancedMesh(pGeo,pMat,NP);
dots.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NP*3),3);
scene.add(dots);
const px=new Float32Array(NP),py=new Float32Array(NP),pv=new Float32Array(NP*3);
const COL_BASE=new THREE.Color(0x6f9cc0),COL_TAIL=new THREE.Color(0xff9a4d),COL_DIM=new THREE.Color(0x46586c),COL_BIN=new THREE.Color(0xc97a2e);

/* ── 状态 ── */
let gas='N2',TEMP=300,EA=10,playing=true,labelsOn=true,slowMo=false,tailOn=true;
let simT=0,fracNow=0,vEa=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const mkg=()=>MOL[gas].m/NA;
const vRms=()=>Math.sqrt(3*KB*TEMP/mkg());
const vpOf=()=>Math.sqrt(2*KB*TEMP/mkg());
const vEaOf=()=>Math.sqrt(2*EA*1000/MOL[gas].m);
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function seed(g){ /* g=true 均衡高斯;false 同速冷束(看碰撞洗牌) */
  const sig=Math.sqrt(KB*TEMP/mkg()),s=g?vRms()/Math.sqrt(3):0.35*vRms();
  for(let i=0;i<NP;i++){
    px[i]=BX0+PR+(BW-2*PR)*Math.random();py[i]=BY0+PR+(BH-2*PR)*Math.random();
    if(g){pv[i*3]=gauss()*s;pv[i*3+1]=gauss()*s;pv[i*3+2]=gauss()*s;}
    else{const a=Math.random()*Math.PI*2;
      pv[i*3]=Math.cos(a)*s;pv[i*3+1]=Math.sin(a)*s;pv[i*3+2]=gauss()*0.2*sig;}
  }
}

/* ── 曲线/标记重建:温度或气体变化时 ── */
function rebuildCurve(){
  const m=mkg(),f=new Float32Array(121);
  let fmax=0;
  for(let j=0;j<=120;j++){
    const v=j/120*VAX,a=m/(2*Math.PI*KB*TEMP);
    f[j]=4*Math.PI*v*v*Math.pow(a,1.5)*Math.exp(-m*v*v/(2*KB*TEMP));
    if(f[j]>fmax)fmax=f[j];
  }
  const pts=[];
  for(let j=0;j<=120;j++)
    pts.push(new THREE.Vector3(j/120*AW,f[j]/fmax*(AH-0.35)+0.08,0.3));
  if(curveMesh){curveMesh.geometry.dispose();boardG.remove(curveMesh);}
  curveMesh=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),120,0.022,6),curveMat);
  boardG.add(curveMesh);
  vpG.position.x=vpOf()/VAX*AW;
  vEa=vEaOf();
  layoutEa();
}
function layoutEa(){
  eaG.position.x=clamp(vEaOf()/VAX,0,1)*AW;
  lblEa.position.x=Math.min(0,AW-0.75-eaG.position.x);
}

/* ── 控件 ── */
function snapT(){ /* 暂停时立即按新温度重标定速度,静态画面也不失真 */
  if(playing)return;
  let s2=0;for(let i=0;i<NP*3;i++)s2+=pv[i]*pv[i];
  const vr=Math.sqrt(s2/(NP*3));if(vr<1e-6)return;
  const f=vRms()/Math.sqrt(3)/vr;for(let i=0;i<NP*3;i++)pv[i]*=f;}
function setGas(g){gas=g;
  document.getElementById('bHe').classList.toggle('on',g==='He');
  document.getElementById('bN2').classList.toggle('on',g==='N2');
  document.getElementById('bAr').classList.toggle('on',g==='Ar');
  rebuildCurve();snapT();updateStats();}
function setTemp(v){TEMP=clamp(v,100,1200);
  document.getElementById('sT').value=TEMP;
  document.getElementById('sTVal').textContent=TEMP.toFixed(0)+' K';
  rebuildCurve();snapT();updateStats();}
function setEa(v){EA=clamp(v,5,40);
  document.getElementById('sEa').value=EA;
  document.getElementById('sEaVal').textContent=EA.toFixed(0)+' kJ/mol';
  layoutEa();updateStats();}
function setTail(v){tailOn=v;document.getElementById('tglTail').checked=v;}
function setShuffle(){seed(false);}

function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){

/* ── Ea 竖线拖拽:窗口捕获阶段拦截,避免 OrbitControls 抢事件 ── */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),hitP=new THREE.Vector3();
const planeZ=new THREE.Plane(new THREE.Vector3(0,0,1),-0.36);
let dragging=false;
function boardHit(e){
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  return ray.ray.intersectPlane(planeZ,hitP)?hitP:null;
}
addEventListener('pointerdown',e=>{
  if(e.target!==renderer.domElement)return;
  const p=boardHit(e);
  if(p&&p.x>AX0-0.15&&p.x<AX0+AW+0.15&&p.y>AY0-0.2&&p.y<AY0+AH+0.4&&
     Math.abs(p.x-(AX0+eaG.position.x))<0.3){
    dragging=true;controls.enabled=false;e.stopPropagation();
  }
},true);
addEventListener('pointermove',e=>{
  if(!dragging)return;
  const p=boardHit(e);
  if(p){
    const vv=clamp((p.x-AX0)/AW,0,1)*VAX;
    setEa(clamp(0.5*MOL[gas].m*vv*vv/1000,5,40));
  }
});

/* ── 物理步进:2D 位置 + 3D 速度;壁、两两弹性碰撞、恒温浴 ── */
const counts=new Float32Array(NBIN);
const M4=new THREE.Matrix4(),Q0=new THREE.Quaternion(),S1=new THREE.Vector3(1,1,1),P3=new THREE.Vector3();
function stepSim(dt){
  const sig=Math.sqrt(KB*TEMP/mkg());
  const x0=BX0+PR,x1=BX0+BW-PR,y0=BY0+PR,y1=BY0+BH-PR,zl=BD/2-PR,esc=2*zl;
  for(let i=0;i<NP;i++){
    const i3=i*3;
    px[i]+=pv[i3]*KW*dt;py[i]+=pv[i3+1]*KW*dt;
    if(px[i]<x0&&pv[i3]<0){px[i]=x0;pv[i3]=-pv[i3];}
    if(px[i]>x1&&pv[i3]>0){px[i]=x1;pv[i3]=-pv[i3];}
    if(py[i]<y0&&pv[i3+1]<0){py[i]=y0;pv[i3+1]=-pv[i3+1];}
    if(py[i]>y1&&pv[i3+1]>0){py[i]=y1;pv[i3+1]=-pv[i3+1];}
    /* 薄箱前后壁:按飞抵频率反弹,vz 从 1D 麦氏重采样(恒温壁给 z 自由度供热) */
    if(Math.random()*esc<Math.abs(pv[i3+2])*KW*dt)
      pv[i3+2]=(Math.random()<0.5?-1:1)*Math.abs(gauss())*sig;
  }
  /* 两两弹性碰撞:2D 重叠检测,沿法线交换 3D 速度的法向分量(动量与动能严格守恒) */
  const D=2*PR,D2=D*D;
  for(let i=0;i<NP;i++){
    const a=i*3;
    for(let j=i+1;j<NP;j++){
      const dx=px[j]-px[i],dy=py[j]-py[i];
      if(dx>D||dx<-D||dy>D||dy<-D)continue;
      const d2=dx*dx+dy*dy;
      if(d2>=D2||d2<1e-12)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,b=j*3;
      const rel=(pv[a]-pv[b])*nx+(pv[a+1]-pv[b+1])*ny;
      if(rel<=0)continue;
      pv[a]-=rel*nx;pv[a+1]-=rel*ny;pv[b]+=rel*nx;pv[b+1]+=rel*ny;
      const ov=(D-d)/2;px[i]-=nx*ov;py[i]-=ny*ov;px[j]+=nx*ov;py[j]+=ny*ov;
    }
  }
  /* 恒温浴:温和地把整体 rms 拉回目标——只改尺度,不改分布形状 */
  let s2=0;
  for(let i=0;i<NP*3;i++)s2+=pv[i]*pv[i];
  const vr=Math.sqrt(s2/(NP*3)),vt=vRms()/Math.sqrt(3);
  if(vr>1e-6){
    const f=1+clamp(vt/vr-1,-1,1)*Math.min(1,2.5*dt);
    for(let i=0;i<NP*3;i++)pv[i]*=f;
  }
}
/* 直方图 + 尾巴染色 + 粒子摆放 */
function updateVis(){
  counts.fill(0);let nTail=0;
  for(let i=0;i<NP;i++){
    const i3=i*3,sp=Math.sqrt(pv[i3]*pv[i3]+pv[i3+1]*pv[i3+1]+pv[i3+2]*pv[i3+2]);
    counts[Math.min(NBIN-1,Math.floor(sp/VAX*NBIN))]++;
    const tail=sp>vEa;
    if(tail)nTail++;
    P3.set(px[i],py[i],0);M4.compose(P3,Q0,S1);dots.setMatrixAt(i,M4);
    dots.setColorAt(i,tailOn&&tail?COL_TAIL:COL_BASE);
  }
  fracNow=nTail/NP*100;
  dots.instanceMatrix.needsUpdate=true;dots.instanceColor.needsUpdate=true;
  let cmax=1;for(let i=0;i<NBIN;i++)if(counts[i]>cmax)cmax=counts[i];
  for(let i=0;i<NBIN;i++){
    const h=Math.max(counts[i]/cmax*(AH-0.3),0.012);
    M4.makeScale(0.72*AW/NBIN,h,0.42);
    M4.setPosition((i+0.5)*AW/NBIN,0.02,0.16);
    bars.setMatrixAt(i,M4);
    bars.setColorAt(i,(i+0.5)/NBIN*VAX>vEa?COL_BIN:COL_DIM);
  }
  bars.instanceMatrix.needsUpdate=true;bars.instanceColor.needsUpdate=true;
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  if(dts>0){
    const sub=clamp(Math.ceil(vRms()*KW*dts/0.045),1,8);
    for(let k=0;k<sub;k++)stepSim(dts/sub);
  }
  updateVis();
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();seed(true);rebuildCurve();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);else applyPhase(1);
updateVis();updateStats();syncPlayBtn();start();
window.__mb=(g,t)=>{if(g)setGas(g);if(t)setTemp(t);
let s2=0,mx=0,n2=0;for(let i=0;i<NP*3;i++)s2+=pv[i]*pv[i];
for(let i=0;i<NP;i++){const i3=i*3,sp=Math.sqrt(pv[i3]**2+pv[i3+1]**2+pv[i3+2]**2);if(sp>mx)mx=sp;if(sp>2000)n2++;}
return {gas,TEMP,vr3:Math.sqrt(s2/NP).toFixed(0),vRms:vRms().toFixed(0),max:mx.toFixed(0),over2000:n2};};

</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
