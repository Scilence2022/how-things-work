<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电网频率与调频 · 全网一个旋转体</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #plot{position:fixed;right:18px;bottom:18px;z-index:4;width:330px;height:200px;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;backdrop-filter:blur(6px);padding:8px 10px 6px}
  #plot h3{font-size:11.5px;color:var(--text2);font-weight:600;margin-bottom:2px;line-height:1.35}
  #plotCv{width:100%;height:calc(100% - 30px);display:block}
  #stats{position:fixed;right:18px;bottom:230px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.warn{color:#ffd43b}#stats .v.bad{color:#ff6b6b}
  :root[data-theme="light"] #stats .v.warn{color:#d98f00}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<div id="app"></div>

<div id="title">
  <h1 data-zh="电网频率与调频 · 全网一个旋转体" data-en="Grid Frequency &amp; Balancing · One Great Rotor">电网频率与调频 · 全网一个旋转体</h1>
  <div class="sub" data-zh="全网同步发电机被电网「焊」成一个旋转体：频率 50 Hz 就是发电-用电平衡的实时天平。负荷突增 → 转子动能被抽走 → 频率跌，调速器秒级一次调频（有差），AGC 分钟级二次调频（无差）；惯量越低，同扰动跌得越深越快 · 拖动旋转 / 空格运行/暂停" data-en="All synchronous machines are locked into one great rotor: 50 Hz is the live balance of generation vs load. A load step steals rotor kinetic energy and frequency sags; governors respond in seconds (droop, with offset), AGC in minutes (restoring); less inertia = deeper, faster dips · drag to orbit / Space = run/pause">全网同步发电机被电网「焊」成一个旋转体：频率 50 Hz 就是发电-用电平衡的实时天平。负荷突增 → 转子动能被抽走 → 频率跌，调速器秒级一次调频（有差），AGC 分钟级二次调频（无差）；惯量越低，同扰动跌得越深越快 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============ 工具 / 主题 / 语言 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const el=id=>document.getElementById(id);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const speedMul=clamp(parseFloat(qs.get('speed'))||1,0.25,3);

/* ============ 渲染器 / 场景 ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,50,140);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,300);
camera.position.set(6,10,24);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-2,2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=90;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(10,20,12);scene.add(key);

/* ============ 电力系统模型（摇摆方程，标幺基值 1000 MW） ============
   2H·df0/dt = ΔP_pu → df/dt = (Pgen-Pload)/S × f0 / (2H)   [Hz/s]
   H = 5.2 × 同步机占比（风电/光伏经变流器并网，不提供惯量与一次调频）
   一次调频：ΔP = -(Δf/f0)/R × 额定容量，R=下垂%，火 τ≈4s 水 τ≈1.5s
   二次调频 AGC：ΔP = kI·∫Δf dt（演示压缩 ~6×），把频率拉回 50.00（无差） */
const F0=50,S=1000;
let share=0.85,droop=0.04,agcOn=true,playing=!qs.get('pause');
let load=700,wander=0,lastLoad=700;
let df=0,dfdt=0,agcI=0,agcP=0;
const gov={thermo:0,hydro:0};
let lastEvent=+35,trace=[],ghost=null,tEvent=0;
const plants=[
  {key:'thermo',capF:0.75,headF:0.12,tau:4.0,col:0xff6b6b},
  {key:'hydro', capF:0.25,headF:0.20,tau:1.5,col:0x74c0fc},
  {key:'wind',  capF:0.60,headF:0.00,tau:0.0,col:0xb197fc,conv:true},
  {key:'solar', capF:0.40,headF:0.00,tau:0.0,col:0xffd43b,conv:true},
];
function capOf(p){return S*(p.conv?1-share:share)*p.capF;}
function baseOf(p){return load*p.capF*(p.conv?1-share:share);}
function inertia(){return Math.max(1.6,5.2*share);}
function genTotal(){
  let g=0;for(const p of plants)g+=baseOf(p)+(p.key==='thermo'?gov.thermo:p.key==='hydro'?gov.hydro:0);
  return g+agcP;
}
function fireEvent(dLoad){
  ghost=trace.map(p=>[p[0],p[1]]);
  trace=[];tEvent=0;lastEvent=dLoad;load+=dLoad;
}
function simStep(dt){
  /* 负荷小幅游走 */
  wander=clamp(wander+(Math.random()-0.5)*8*dt,-6,6);
  const loadNow=load+wander;
  /* 一次调频：调速器一阶滞后 */
  const heads={thermo:capOf(plants[0])*plants[0].headF,hydro:capOf(plants[1])*plants[1].headF};
  const tgt={thermo:0,hydro:0};
  for(const k of ['thermo','hydro']){
    const cap=capOf(plants[k==='thermo'?0:1]);
    tgt[k]=clamp(-(df/F0)/droop*cap,-cap*0.5,heads[k]);
    gov[k]+=(tgt[k]-gov[k])*Math.min(1,dt/plants[k==='thermo'?0:1].tau);
  }
  /* 二次调频 AGC（积分，时间压缩 ×6） */
  if(agcOn){
    agcI+=df*dt*6;
    const head=heads.thermo+heads.hydro;
    agcP=clamp(agcI*22,-head,head);
  }else{agcP=0;agcI=0;}
  /* 摇摆方程 */
  const imbalance=genTotal()-loadNow-1.5*df/F0*loadNow; // 1.5pu 负荷频率效应
  dfdt=imbalance/S*F0/(2*inertia());
  df+=dfdt*dt;
  df=clamp(df,-1.2,1.2);
  tEvent+=dt;
  trace.push([tEvent,50+df]);
  if(trace.length>2400)trace.shift();
  if(ghost)ghost.push([tEvent,ghost[ghost.length-1][1]]);
  if(ghost&&ghost.length>2400)ghost.shift();
}

/* ============ 场景搭建 ============ */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const steelM=new THREE.MeshStandardMaterial({color:0x546074,roughness:0.4,metalness:0.6});
const busM=new THREE.MeshStandardMaterial({color:0x8a93a5,roughness:0.35,metalness:0.75});
const cityM=new THREE.MeshStandardMaterial({color:0x37424f,roughness:0.7});
const ground=new THREE.Mesh(new THREE.BoxGeometry(70,0.3,40),groundM);
ground.position.set(-2,-0.15,0);scene.add(ground);

/* 母线 */
const bus=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,30,10),busM);
bus.rotation.z=Math.PI/2;bus.position.set(-3,2.6,0);scene.add(bus);

/* 中央等效转子：大飞轮（转速视觉夸大） */
const flyG=new THREE.Group();flyG.position.set(0,4.6,0);scene.add(flyG);
flyG.add(new THREE.Mesh(new THREE.CylinderGeometry(2.7,2.7,0.4,48),steelM));
const stripe=new THREE.Mesh(new THREE.BoxGeometry(4.9,0.42,0.5),
  new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xf08c00,emissiveIntensity:0.5}));
flyG.add(stripe);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.9,20),
  new THREE.MeshStandardMaterial({color:0x2b3138,roughness:0.5,metalness:0.5}));
flyG.add(hub);
const pillar=new THREE.Mesh(new THREE.BoxGeometry(1.2,3.4,1.2),steelM);
pillar.position.set(0,-2.2,0);flyG.add(pillar);

/* 四类电源 + 负荷城市 */
const plantG=[],plantRotors=[],plantBars=[];
plants.forEach((p,i)=>{
  const g=new THREE.Group();
  g.position.set(-15+i*6.2,0,i%2===0?4.2:-4.2);
  scene.add(g);
  const ped=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.0,1.6),steelM);
  ped.position.y=0.5;g.add(ped);
  const rot=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,1.3,18),steelM);
  rot.rotation.z=Math.PI/2;rot.position.y=1.7;g.add(rot);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(1.0,1,1.0),
    new THREE.MeshStandardMaterial({color:p.col,emissive:p.col,emissiveIntensity:0.35,roughness:0.4}));
  bar.position.y=1.0;g.add(bar);
  plantG.push(g);plantRotors.push(rot);plantBars.push(bar);
});

/* ============ 标签 ============ */
const labelReg=[];

addLabel(()=>L('全网等效转子：频率就是它的转速（转速已视觉夸大）','equivalent system rotor: its speed IS the frequency (exaggerated)'),

addLabel(()=>L('风电 '+plantPw(2)+' MW · 变流器并网无惯量','wind '+plantPw(2)+' MW, converter, no inertia'),new THREE.Vector3(0,3.4,0),'b',()=>true,plantG[2]);
addLabel(()=>L('光伏 '+plantPw(3)+' MW · 变流器并网无惯量','solar '+plantPw(3)+' MW, converter, no inertia'),new THREE.Vector3(0,3.4,0),'b',()=>true,plantG[3]);
addLabel(()=>L('城市负荷 '+(load+wander).toFixed(0)+' MW','city load '+(load+wander).toFixed(0)+' MW'),new THREE.Vector3(2.2,4.2,-3.4),'g');
function plantPw(i){
  const p=plants[i];
  return (baseOf(p)+(i===0?gov.thermo:i===1?gov.hydro:0)).toFixed(0);
}

/* ============ 步骤 ============ */
let camTween=null;
function flyTo(p,t){camTween={p0:camera.position.clone(),p1:new THREE.Vector3(...p),t0:controls.target.clone(),t1:new THREE.Vector3(...t),k:0};}
const STEPS=[
  {zh:'同步联网：所有同步发电机被电网焊成一个旋转体，同频共存——频率全网唯一',
   en:'Interconnection: all synchronous machines lock into one rotor; one frequency grid-wide',
   act:()=>{flyTo([6,10,24],[-2,3,0]);}},
  {zh:'频率=天平：Pgen=Pload ⇔ 50.00 Hz；多发则升频、少发则降频',
   en:'Frequency = the balance: Pgen=Pload at 50.00 Hz; surplus raises it, deficit sags it',
   act:()=>{flyTo([16,7,14],[11,2,0]);}},
  {zh:'负荷突增：转子动能被抽走 → 频率跌；ROCOF 由惯量 H 决定',
   en:'Load step: kinetic energy leaves the rotor → f drops; ROCOF set by inertia H',
   act:()=>{fireEvent(0.12*700);flyTo([4,8,16],[0,4,0]);}},
  {zh:'一次调频：调速器按下垂 % 秒级增出力，有差调节——稳在 49.9x 回不到 50',
   en:'Primary: governors add output in seconds per droop % — with offset, settling at 49.9x',
   act:()=>{fireEvent(0.05*700);flyTo([-9,6,12],[-9,2,0]);}},
  {zh:'二次调频 AGC：积分器分钟级追平失衡（演示压缩 6×），频率无差回到 50.00',
   en:'Secondary AGC: an integrator catches the imbalance in minutes (6x compressed), restoring 50.00',
   act:()=>{agcOn=true;el('tglAGC').checked=true;fireEvent(0.05*700);}},
  {zh:'低惯量对照：调低同步机占比再重放同扰动——跌得更深、更快，新能源不背惯量',
   en:'Low-inertia A/B: lower sync share, replay the same event — deeper, faster dip',
   act:()=>{share=0.35;el('sShare').value=35;syncUI();fireEvent(lastEvent);flyTo([4,8,16],[0,4,0]);}},
];
let activeStep=0;
function buildSteps(){
  const ol=el('steps');ol.innerHTML='';
  STEPS.forEach((s,i)=>{
    const zh2=s.zh.split('：'),en2=s.en.split(':');
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(zh2[0],en2[0])}</b>　${L(zh2.slice(1).join('：'),en2.slice(1).join(':'))}</span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    ol.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

/* ============ 频率曲线 ============ */
const plotCv=el('plotCv');
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const cTxt=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const acc=css.getPropertyValue('--acc').trim()||'#ffa94d';
  const padL=44,padR=10,padT=8,padB=22;
  const TMAX=40,FMID=50,FSPAN=0.7;
  const xOf=t=>padL+clamp(t/TMAX,0,1)*(W-padL-padR);
  const yOf=f=>(H-padB)-(f-(FMID-FSPAN))/(2*FSPAN)*(H-padT-padB);
  ctx.font='20px system-ui';
  /* 网格与限额线 */
  ctx.strokeStyle='rgba(128,150,170,.2)';
  for(const f of [49.5,50,50.5]){ctx.beginPath();ctx.moveTo(padL,yOf(f));ctx.lineTo(W-padR,yOf(f));ctx.stroke();}
  ctx.strokeStyle='rgba(255,107,107,.55)';ctx.setLineDash([8,6]);
  for(const f of [49.9,50.1]){ctx.beginPath();ctx.moveTo(padL,yOf(f));ctx.lineTo(W-padR,yOf(f));ctx.stroke();}
  ctx.setLineDash([]);
  ctx.fillStyle=cTxt;
  for(const f of [49.5,50,50.5])ctx.fillText(f.toFixed(1),6,yOf(f)+6);
  ctx.fillText('t/s',W-46,H-6);
  /* 灰色 ghost = 上次扰动 */
  const drawTrace=(tr,col,wid)=>{
    if(!tr||tr.length<2)return;
    ctx.strokeStyle=col;ctx.lineWidth=wid;ctx.beginPath();
    for(let i=0;i<tr.length;i++){
      const px=xOf(tr[i][0]),py=yOf(clamp(tr[i][1],FMID-FSPAN,FMID+FSPAN));
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.stroke();ctx.lineWidth=1;
  };
  drawTrace(ghost,'rgba(159,176,195,.45)',3);
  drawTrace(trace,acc,4);
  /* 当前频率点 */
  const f=50+df;
  ctx.fillStyle=acc;
  ctx.beginPath();ctx.arc(xOf(tEvent),yOf(f),6,0,Math.PI*2);ctx.fill();
}

/* ============ 主题 / 语言 / UI ============ */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  el('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  steelM.color.setHex(dark?0x546074:0x8f9aa8);
  cityM.color.setHex(dark?0x37424f:0x9aa6b2);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(e=>{
    if(e.tagName==='INPUT')return;
    e.textContent=LANG==='en'?(e.dataset.en||e.dataset.zh):e.dataset.zh;
  });
  el('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();syncUI();setPlayLabel();drawPlot();
}
function syncUI(){
  el('sShareVal').textContent=(share*100).toFixed(0)+'%';
  el('sDroopVal').textContent=(droop*100).toFixed(1)+' %';
}
function setPlayLabel(){el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
function updateStats(){
  const f=50+df;
  el('stF').innerHTML=f.toFixed(2)+'<small> Hz</small>';
  el('stF').className='v '+(Math.abs(df)<0.05?'ok':Math.abs(df)<0.15?'warn':'bad');
  el('stR').innerHTML=(dfdt>=0?'+':'')+dfdt.toFixed(2)+'<small> Hz/s</small>';
  el('stR').className='v '+(Math.abs(dfdt)<0.1?'ok':Math.abs(dfdt)<0.5?'warn':'bad');
  const imb=genTotal()-load-wander;
  el('stP').innerHTML=(imb>=0?'+':'')+imb.toFixed(0)+'<small> MW</small>';
  el('stH').innerHTML=inertia().toFixed(1)+'<small> s</small>';
  drawPlot();
}
el('btnE5').addEventListener('click',()=>fireEvent(0.05*700));
el('btnE12').addEventListener('click',()=>fireEvent(0.12*700));
el('btnCut').addEventListener('click',()=>fireEvent(-0.08*700));
el('btnReplay').addEventListener('click',()=>fireEvent(lastEvent));
el('sShare').addEventListener('input',e=>{share=+e.target.value/100;syncUI();});
el('sDroop').addEventListener('input',e=>{droop=+e.target.value/100;syncUI();});
el('tglAGC').addEventListener('change',e=>{agcOn=e.target.checked;if(!agcOn){agcP=0;agcI=0;}});
el('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
el('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
el('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
el('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
el('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();el('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
  drawPlot();
});
let labelsOn=qs.get('labels')!=='0';
if(!labelsOn)el('tglLabels').checked=false;

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,accT=0,ang=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=dt0*speedMul*(playing?1:0);
  if(dt>0){
    simStep(dt);
    /* 转子视觉：50 Hz→0.5 圈/s，偏差放大 1.8 倍（近停转=频率崩） */
    const omega=Math.max(0.08,0.5+df*1.8);
    ang+=omega*2*Math.PI*dt;
    flyG.rotation.y=ang;
    plantRotors[0].rotation.x=ang*1.3;
    plantRotors[1].rotation.x=ang*1.5;
    plantRotors[2].rotation.x+=1.2*Math.PI*dt;   // 变流器解耦：各自转速
    plantRotors[3].rotation.x+=1.4*Math.PI*dt;
    /* 功率条 */
    plants.forEach((p,i)=>{
      const cap=Math.max(capOf(p),1);
      const pw=baseOf(p)+(i===0?gov.thermo:i===1?gov.hydro:0);
      const h=clamp(pw/cap,0.05,1)*2.4;
      plantBars[i].scale.y=h;plantBars[i].position.y=1.0+h/2;
    });
    const lh=clamp((load+wander)/1000,0.05,1)*2.4;
    loadBar.scale.y=lh;loadBar.position.y=lh/2;
  }
  if(camTween){
    camTween.k=Math.min(1,camTween.k+dt0*1.4);
    const e=1-Math.pow(1-camTween.k,3);
    camera.position.lerpVectors(camTween.p0,camTween.p1,e);
    controls.target.lerpVectors(camTween.t0,camTween.t1,e);
    if(camTween.k>=1)camTween=null;
  }
  accT+=dt0;if(accT>0.12){accT=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ============ 初始化 ============ */
applyTheme();
applyLang();
syncUI();
setPlayLabel();
drawPlot();
start();
</script>
