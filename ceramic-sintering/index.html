<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>陶瓷烧结 · 表面积缩下去,致密度长上来</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#e05537;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b03418;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(224,85,55,.6);background:rgba(224,85,55,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,52,24,.55);background:rgba(176,52,24,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(224,85,55,.10);border-color:rgba(224,85,55,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,52,24,.08);border-color:rgba(176,52,24,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#f6d9cf}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="陶瓷烧结" data-en="Ceramic Sintering">陶瓷烧结</h1>
  <div class="sub" data-zh="粉体生坯在 0.5~0.8 倍熔点下烧结:表面能(表面积缩小)是唯一驱动力——颗粒接触处颈部生长、晶界迁移把气孔沿通道排出、坯体线收缩 10~20% 致密化,全程不经过整块熔化;液相烧结让助剂熔化润湿颗粒、传质走高速路;但晶粒长得太快会把气孔封死在晶粒内——过烧反而掉密度 · 拖动旋转 / 空格运行/暂停" data-en="A powder compact sinters at 0.5–0.8 of its melting point: surface energy (shrinking surface area) is the only driver — necks grow at particle contacts, grain boundaries sweep pores out along channels, the body shrinks 10–20% linearly to densify, never melting as a whole; liquid-phase sintering melts additives to wet the grains so mass transport takes the highway; but grains that grow too fast seal pores inside — over-firing lowers density instead · drag to orbit / Space = run/pause">粉体生坯在 0.5~0.8 倍熔点下烧结:表面能(表面积缩小)是唯一驱动力——颗粒接触处颈部生长、晶界迁移把气孔沿通道排出、坯体线收缩 10~20% 致密化,全程不经过整块熔化;液相烧结让助剂熔化润湿颗粒、传质走高速路;但晶粒长得太快会把气孔封死在晶粒内——过烧反而掉密度 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const mix=(a,b,t)=>a+(b-a)*t;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const $=id=>document.getElementById(id);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
$('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,12,38);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,200);
camera.position.set(0.4,3.9,9.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.25,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 窑炉台面与地面 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const plateM=new THREE.MeshStandardMaterial({color:0x3a3f46,roughness:0.9});
const plate=new THREE.Mesh(new THREE.CylinderGeometry(3.1,3.3,0.3,48),plateM);
plate.position.y=0.15;scene.add(plate);
const ringM=new THREE.MeshStandardMaterial({color:0x442211,emissive:0xff7a33,emissiveIntensity:0.5,roughness:0.6});
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.62,0.07,10,64),ringM);
ring.rotation.x=Math.PI/2;ring.position.y=0.1;scene.add(ring);
const kilnLight=new THREE.PointLight(0xff7a33,0,9);kilnLight.position.set(0,1.6,0);scene.add(kilnLight);
/* 原始包络线框:对照线收缩 */
const envGeo=new THREE.EdgesGeometry(new THREE.CylinderGeometry(2.02,2.02,1.55,28,1,true));
const env=new THREE.LineSegments(envGeo,new THREE.LineBasicMaterial({color:0x8899aa,transparent:true,opacity:0.16}));
env.position.set(0,1.08,0);scene.add(env);

/* ── 粉粒生坯 ── */
const N=72,NP=26,NADD=9,PCAP=240;
const Cb=new THREE.Vector3(0,0.3,0);                    /* 收缩基准:底面中心 */
const p0=[],rs=[],pores=[],adds=[],pairs=[];
const matPart=new THREE.MeshStandardMaterial({color:0xd8cfc4,roughness:0.65,emissive:0x1a0500,emissiveIntensity:0});
const partIM=new THREE.InstancedMesh(new THREE.SphereGeometry(1,16,12),matPart,N);
partIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(partIM);
const neckM=new THREE.MeshStandardMaterial({color:0xcfc4b4,roughness:0.72});
const neckIM=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,10),neckM,PCAP);
neckIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);neckIM.frustumCulled=false;scene.add(neckIM);
const poreLoM=new THREE.MeshStandardMaterial({color:0x2a2f36,transparent:true,opacity:0.5,roughness:0.9});
const poreHiM=new THREE.MeshStandardMaterial({color:0xff5544,transparent:true,opacity:0.62,
  roughness:0.7,emissive:0x881510,emissiveIntensity:0.5,depthTest:false});
const poreIM=new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,10),poreLoM,NP);
poreIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);poreIM.renderOrder=5;scene.add(poreIM);
const addM=new THREE.MeshStandardMaterial({color:0x8fd8b8,roughness:0.5,transparent:true,opacity:1});
const addMeshes=[];
for(let i=0;i<NADD;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.11,14,10),addM);
  m.visible=false;scene.add(m);addMeshes.push(m);}
function randInBody(out,rMin){
  for(let t=0;t<200;t++){
    const a=Math.random()*6.283,rr=Math.sqrt(Math.random())*1.72;
    out.set(Math.cos(a)*rr,0.5+Math.random()*1.32,Math.sin(a)*rr);
    let ok=true;
    for(let i=0;i<p0.length;i++)if(out.distanceTo(p0[i])<rs[i]+rMin){ok=false;break;}
    if(ok)return true;
  }
  return false;
}
function buildBody(){
  p0.length=0;rs.length=0;
  let guard=0;
  while(p0.length<N&&guard<5000){guard++;
    const a=Math.random()*6.283,rr=Math.sqrt(Math.random())*1.92;
    const v=new THREE.Vector3(Math.cos(a)*rr,0.55+Math.random()*1.32,Math.sin(a)*rr);
    const r=0.17+Math.random()*0.09;
    let ok=v.y>0.3+r;
    for(let i=0;i<p0.length&&ok;i++)if(v.distanceTo(p0[i])<(rs[i]+r)*0.9)ok=false;
    if(ok){p0.push(v);rs.push(r);}
  }
  for(let it=0;it<40;it++){                              /* 松弛:推开重叠 + 收进模腔 */
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const d=p0[i].distanceTo(p0[j]),min=(rs[i]+rs[j])*0.98;
      if(d<min&&d>1e-4){
        const tV=new THREE.Vector3().subVectors(p0[i],p0[j]).multiplyScalar((min-d)/2/d);
        p0[i].add(tV);p0[j].sub(tV);
      }}
    for(let i=0;i<N;i++){
      const rad=Math.hypot(p0[i].x,p0[i].z),maxR=2.0-rs[i];
      if(rad>maxR){p0[i].x*=maxR/rad;p0[i].z*=maxR/rad;}
      p0[i].y=clamp(p0[i].y,0.3+rs[i],1.95);
    }
  }
  /* 气孔标记:藏在颗粒间隙里 */
  pores.length=0;
  const pv=new THREE.Vector3();
  while(pores.length<NP){
    if(!randInBody(pv,0.18))break;
    pores.push({p:pv.clone(),r:0.09+Math.random()*0.07,lockT:0.15+Math.random()*0.7});
  }
  /* 接触对:预筛会接触的颗粒 */
  pairs.length=0;
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
    const d=p0[i].distanceTo(p0[j]);
    if(d<rs[i]+rs[j]+0.55)pairs.push({a:i,b:j,d});
  }
  pairs.sort((u,v)=>u.d-v.d);
  if(pairs.length>PCAP)pairs.length=PCAP;
  neckIM.count=pairs.length;
  /* 助剂颗粒:落在空隙,记住最近的接触对 */
  adds.length=0;
  for(let i=0;i<NADD;i++){
    if(!randInBody(pv,0.22))break;
    let best=0,bd=1e9;
    for(let k=0;k<pairs.length;k++){
      const pr=pairs[k],mid=new THREE.Vector3().addVectors(p0[pr.a],p0[pr.b]).multiplyScalar(0.5);
      const dd=mid.distanceTo(pv);
      if(dd<bd){bd=dd;best=k;}
    }
    adds.push({p:pv.clone(),pair:best});
  }
}

/* ── 标签 ── */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('生坯:颗粒 + 30~40% 气孔','Green body: particles + 30–40% pores'),
  new THREE.Vector3(2.75,2.4,0),'b',()=>tHold<3);
addLabel(()=>L('颈部生长 · 表面积缩小(表面能驱动)','Neck growth · surface area ↓ (surface-energy driven)'),
  new THREE.Vector3(1.55,2.2,0.9),'o',()=>tHold>1.2&&grain<1.15);
addLabel(()=>L('晶界迁移 · 气孔沿晶界通道排出','Boundaries sweep · pores escape along channels'),
  new THREE.Vector3(-2.75,1.95,0.5),'y',()=>tHold>4&&grain<1.15);
addLabel(()=>L('线收缩 10~20%','Linear shrink 10–20%'),
  new THREE.Vector3(0,2.78,0),'g',()=>Deff>0.85);
addLabel(()=>L('液相:助剂熔融润湿 · 传质走高速路','Liquid: additive melts, wets · mass transport highway'),
  new THREE.Vector3(-2.9,1.35,1.0),'g',()=>mode==='liquid'&&T>1150&&wt>0);
addLabel(()=>L('过烧:晶粒疯长封死气孔','Over-fired: runaway grains trap pores'),
  new THREE.Vector3(2.8,2.82,0),'r',()=>grain>1.15);
addLabel(()=>L('T ≈ 0.7~0.8 Tm(Al₂O₃ 2054 °C)','T ≈ 0.7–0.8 Tm (Al₂O₃ 2054 °C)'),
  new THREE.Vector3(3.4,0.72,0),'o',()=>true);

/* ── 状态 ── */
let mode='solid',T=1400,wt=0,tHold=0,grain=1,cycT=0;
let playing=true,labelsOn=true,slowMo=false,poresHi=true;
let simT=0,dwell=0,D=0.62,Deff=0.62,lockF=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null)t0=parseInt(qs.get('t'))||0;
const TIME_RATE=1.4,TMAX=20;
const Dmax=()=>mode==='liquid'?0.985:0.965;
const kRate=()=>0.10*Math.exp((T-1400)/150)*(mode==='liquid'?1+wt*0.16:1);
const shrinkS=()=>clamp(Math.pow(0.62/Deff,1/3),0.8,1);

function setMode(m){mode=m;
  $('bSolid').classList.toggle('on',m==='solid');
  $('bLiquid').classList.toggle('on',m==='liquid');
  updateStats();}
function setT(v){T=clamp(v,800,1600);
  $('sTemp').value=T;$('sTempVal').textContent=T.toFixed(0)+' °C';updateStats();}
function setTime(v){tHold=clamp(v,0,100)/100*TMAX;cycT=0;
  $('sTime').value=clamp(v,0,100);$('sTimeVal').textContent=clamp(v,0,100).toFixed(0)+' %';updateStats();}
function setWt(v){wt=clamp(v,0,8);
  $('sWt').value=wt;$('sWtVal').textContent=wt.toFixed(1)+' wt%';updateStats();}
function setPores(v){poresHi=v;$('tglPores').checked=v;
  poreIM.material=v?poreHiM:poreLoM;}
function setPlay(v){playing=v;syncPlayBtn();}

const STEPS=[
 {zh:'<b>生坯</b>:粉粒松堆,30~40% 体积是气孔,相对密度只有 ~62%',en:'<b>Green body</b>: loosely stacked powder — 30–40% of the volume is pores, relative density only ~62%',
  act(){setMode('solid');setT(800);setTime(0);setWt(0);setPores(true);}},
 {zh:'<b>升温</b>:到 0.7~0.8 Tm,表面能开始驱动传质——整块并不熔化',en:'<b>Heat up</b>: to 0.7–0.8 Tm, surface energy starts driving mass transport — the body never melts',
  act(){setT(1400);setTime(0);setPores(false);}},
 {zh:'<b>颈部生长</b>:接触处物质扩散填凹,表面积缩小就是驱动力',en:'<b>Neck growth</b>: matter diffuses into each contact — shrinking surface area is the driving force',
  act(){setT(1450);setTime(0);setPores(false);}},
 {zh:'<b>晶界迁移</b>:晶界扫过坯体,气孔沿晶界通道连通排出',en:'<b>Boundary migration</b>: grain boundaries sweep the body; pores link up and escape along channels',
  act(){setT(1450);setTime(40);setPores(true);}},
 {zh:'<b>致密化</b>:气孔消失,坯体线收缩 10~20%,强度飙升',en:'<b>Densification</b>: pores vanish, the body shrinks 10–20% linearly, strength soars',
  act(){setT(1450);setTime(72);setPores(false);}},
 {zh:'<b>液相烧结</b>:助剂熔化润湿颗粒,传质走高速路,更快更致密',en:'<b>Liquid-phase sintering</b>: additives melt and wet the grains — mass transport takes the highway, faster and denser',
  act(){setMode('liquid');setWt(5);setT(1450);setTime(30);setPores(false);}},
 {zh:'<b>过烧</b>:温度太高晶粒疯长,气孔被封死在晶粒内,致密度反而下降',en:'<b>Over-firing</b>: too hot — runaway grains seal pores inside themselves; density drops instead',
  act(){setT(1600);setTime(70);setPores(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=$('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;dwell=0;STEPS[i].act();syncSteps();}

function updateStats(){
  const dv=$('stD');
  dv.innerHTML=(Deff*100).toFixed(1)+'<small> %</small>';
  dv.className='v '+(Deff>=0.92?'ok':lockF>0.35?'warn':'');
  $('stPore').innerHTML=(2+42*clamp((1-Deff)/0.38,0,1)+14*lockF).toFixed(1)+'<small> µm</small>';
  $('stSh').innerHTML=((1-Math.pow(0.62/Deff,1/3))*100).toFixed(1)+'<small> %</small>';
  $('stT').innerHTML=T.toFixed(0)+'<small> °C</small>';
}

$('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){$('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
$('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
$('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
$('bSolid').addEventListener('click',()=>setMode('solid'));
$('bLiquid').addEventListener('click',()=>setMode('liquid'));
$('sTemp').addEventListener('input',e=>setT(+e.target.value));
$('sTime').addEventListener('input',e=>setTime(+e.target.value));
$('sWt').addEventListener('input',e=>setWt(+e.target.value));
$('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
$('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
$('tglPores').addEventListener('change',e=>setPores(e.target.checked));

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  $('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  plateM.color.setHex(dark?0x3a3f46:0xb8b0a2);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  $('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();let raf=null;
const DWELL=7;                                          /* 分步播放:每步停留 7s 自动推进 */
const dummy=new THREE.Object3D(),UP=new THREE.Vector3(0,1,0),dirV=new THREE.Vector3();
const emi1=new THREE.Color(0x1a0500),emi2=new THREE.Color(0x7a1e00),
      emi3=new THREE.Color(0xd84d10),emi4=new THREE.Color(0xff8a28),tmpC=new THREE.Color();
function tempGlow(t){
  let f,i;
  if(t<=900){tmpC.copy(emi1);i=0;}
  else if(t<=1250){f=(t-900)/350;tmpC.lerpColors(emi1,emi2,f);i=f*0.35;}
  else if(t<=1500){f=(t-1250)/250;tmpC.lerpColors(emi2,emi3,f);i=0.35+f*0.25;}
  else{f=clamp((t-1500)/100,0,1);tmpC.lerpColors(emi3,emi4,f);i=0.6+f*0.25;}
  matPart.emissive.copy(tmpC);matPart.emissiveIntensity=i;
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 分步播放:高亮同步推进 */
  if(playing){dwell+=dts;if(dwell>DWELL)applyPhase((activeStep+1)%STEPS.length);}
  /* 保温推进;保温到头停留后重新制坯 */
  if(playing&&tHold<TMAX)tHold=Math.min(TMAX,tHold+dts*TIME_RATE);
  if(tHold>=TMAX){cycT+=dts;if(cycT>1.6){cycT=0;tHold=0;grain=1;buildBody();}}
  /* 致密化模型:D=ρ0+(ρmax-ρ0)(1-e^-kt);过烧封孔则打折 */
  D=0.62+(Dmax()-0.62)*(1-Math.exp(-kRate()*tHold));
  if(T>=1500)grain=Math.min(1.7,grain+dts*0.12*clamp((T-1450)/150,0.2,1.2));
  lockF=clamp((grain-1.05)/0.45,0,1);
  Deff=D*(1-0.12*lockF);
  const ss=shrinkS(),gs=grain;
  /* 颗粒:重心靠拢 + 过烧长大 */
  for(let i=0;i<N;i++){
    dummy.position.copy(p0[i]).sub(Cb).multiplyScalar(ss).add(Cb);
    dummy.scale.setScalar(rs[i]*gs);
    dummy.quaternion.identity();dummy.updateMatrix();
    partIM.setMatrixAt(i,dummy.matrix);
  }
  partIM.instanceMatrix.needsUpdate=true;
  /* 颈部:接触即长桥,靠近越粗 */
  for(let k=0;k<pairs.length;k++){
    const pr=pairs[k];
    const pa=new THREE.Vector3().copy(p0[pr.a]).sub(Cb).multiplyScalar(ss).add(Cb);
    const pb=new THREE.Vector3().copy(p0[pr.b]).sub(Cb).multiplyScalar(ss).add(Cb);
    const d=pa.distanceTo(pb),surf=(rs[pr.a]+rs[pr.b])*gs;
    if(d<surf+0.3&&tHold>0.2){
      const len=Math.max(0.02,d-surf*0.9);
      const nr=(rs[pr.a]+rs[pr.b])*gs*0.17*clamp(tHold/5,0.12,1)
        *clamp((surf+0.3-d)/0.5,0,1)*(mode==='liquid'?1.25:1);
      dirV.subVectors(pb,pa).normalize();
      dummy.position.addVectors(pa,pb).multiplyScalar(0.5);
      dummy.quaternion.setFromUnitVectors(UP,dirV);
      dummy.scale.set(nr,len,nr);
    }else dummy.scale.set(0.0001,0.0001,0.0001);
    dummy.updateMatrix();neckIM.setMatrixAt(k,dummy.matrix);
  }
  neckIM.instanceMatrix.needsUpdate=true;
  /* 气孔:随致密化缩小;过烧锁死的不再缩小、被晶粒包住 */
  for(let i=0;i<pores.length;i++){
    const po=pores[i],locked=lockF>po.lockT;
    const cs=locked?mix(ss,1,0.75):ss;
    dummy.position.copy(po.p).sub(Cb).multiplyScalar(cs).add(Cb);
    let sc=po.r*Math.pow(clamp((1-Deff)/0.38,0.04,1),0.7);
    if(locked)sc=Math.max(sc,po.r*0.45);
    dummy.scale.setScalar(sc);dummy.quaternion.identity();dummy.updateMatrix();
    poreIM.setMatrixAt(i,dummy.matrix);
  }
  poreIM.count=pores.length;poreIM.instanceMatrix.needsUpdate=true;
  /* 助剂:液相下熔成润湿膜、流向接触颈 */
  const melted=mode==='liquid'&&T>1150&&wt>0;
  const nAdd=melted?Math.min(NADD,Math.max(1,Math.round(wt*1.1))):0;
  addM.color.setHex(melted?0xcfeee0:0x8fd8b8);
  addM.roughness=melted?0.08:0.5;addM.opacity=melted?0.45:1;
  for(let i=0;i<NADD;i++){
    const m=addMeshes[i];
    if(i>=nAdd||i>=adds.length){m.visible=false;continue;}
    m.visible=true;
    const ad=adds[i],pr=pairs[ad.pair];
    if(melted&&pr){
      const mid=new THREE.Vector3().copy(p0[pr.a]).sub(Cb).multiplyScalar(ss).add(Cb)
        .add(new THREE.Vector3().copy(p0[pr.b]).sub(Cb).multiplyScalar(ss).add(Cb)).multiplyScalar(0.5);
      ad.p.lerp(mid,1-Math.exp(-1.4*dts));
    }
    m.position.copy(ad.p);
  }
  /* 窑温发光 */
  tempGlow(T);
  const glow=clamp((T-900)/700,0,1);
  kilnLight.intensity=glow*2.0;
  ringM.emissiveIntensity=0.15+glow*1.2;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();
    if(document.activeElement!==$('sTime')){
      const pc=clamp(tHold/TMAX*100,0,100);
      $('sTime').value=pc;$('sTimeVal').textContent=pc.toFixed(0)+' %';}}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
$('tglLabels').checked=labelsOn;
applyTheme();buildSteps();buildBody();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
