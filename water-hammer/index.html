<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水锤效应 · 猛关阀门,水把管子敲响</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff8787;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#f0efed; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,135,135,.6); background: rgba(255,135,135,.12); color: var(--text); }
  .abtn.crash { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(201,42,42,.55); background: rgba(201,42,42,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,135,135,.10); border-color: rgba(255,135,135,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 7;
    transition: opacity .5s; }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="flash"></div>

<div id="title">
  <h1 data-zh="水锤效应:猛关阀门,水把管子敲响" data-en="Water Hammer: Slam the Valve, the Water Strikes Back">水锤效应:猛关阀门,水把管子敲响</h1>
  <div class="sub" data-zh="一整管流动的水都带着动能;阀门猛地关上,最前面的水被顶停,压强瞬间飙到 Δp=ρcΔv(2 m/s 就是 24 个大气压);这道压力波以 c≈1.2 km/s 在管里来回撞,4L/c 一个周期;慢关让反射波回来救场,空气室给冲击一个软垫——家里水管的砰砰声就是它 · 时间放慢 ×1/60 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A whole pipe of moving water carries kinetic energy; slam the valve and the front water is stopped dead — pressure spikes to Δp=ρcΔv (2 m/s is 24 atmospheres); the wave rattles at c≈1.2 km/s, one period per 4L/c; slow closing lets the reflected wave rescue the front, and an air tank cushions the blow — it's the bang in your walls · time slowed ×1/60 · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">水锤效应:猛关阀门,水把管子敲响</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="理论 Δp=ρcΔv" data-en="Δp=ρcΔv">理论 Δp=ρcΔv</span><span class="v" id="stDp">—</span>
  <span class="k" data-zh="阀前压强" data-en="Valve pressure">阀前压强</span><span class="v bad" id="stP">—</span>
  <span class="k" data-zh="相长 4L/c" data-en="Period 4L/c">相长 4L/c</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="关阀进度" data-en="Closure">关阀进度</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v ok" id="stS">—</span>
</div>

<div id="plot">
  <h3 data-zh="阀前压强-时间(模拟时间 ms)· 虚线=ρcΔv 理论峰" data-en="Valve pressure vs time (sim ms) · dashed = ρcΔv peak">阀前压强-时间(模拟时间 ms)· 虚线=ρcΔv 理论峰</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="水色=压强(蓝低压/红高压)" data-en="water color = pressure">水色=压强(蓝低压/红高压)</span>
    <span class="chip.r" data-zh="管壁鼓包=高压波" data-en="pipe bulge = pressure wave">管壁鼓包=高压波</span>
    <span class="chip.g" data-zh="空气室缓冲" data-en="air chamber">空气室缓冲</span>
  </div>
  <div id="actions">
    <button class="abtn crash" id="btnSlam" data-zh="猛关阀门!" data-en="slam it shut!">猛关阀门!</button>
    <button class="abtn" id="btnSlow" data-zh="缓关 1.5 s" data-en="close slowly 1.5 s">缓关 1.5 s</button>
    <button class="abtn" id="btnChamber" data-zh="接入空气室" data-en="hook up air chamber">接入空气室</button>
    <button class="abtn" id="btnReset" data-zh="复位开水流" data-en="reset flow">复位开水流</button>
  </div>
  <div class="row"><label data-zh="初始流速 v₀" data-en="Initial speed">初始流速 v₀</label><input id="v0" type="range" min="0.5" max="3" step="0.1" value="2"><span class="val" id="v0Val">2.0 m/s</span></div>
  <div class="row"><label data-zh="关阀时间 T" data-en="Closure time">关阀时间 T</label><input id="tc" type="range" min="0.001" max="2" step="0.001" value="1.5"><span class="val" id="tcVal">1.50 s</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../earthquake-waves/" data-zh="同款来回反射:地震波" data-en="the same bouncing reflection: seismic waves">同款来回反射:地震波</a>
    <a href="../sonar-ultrasound/" data-zh="压力波的应用:声呐" data-en="pressure waves at work: sonar">压力波的应用:声呐</a>
    <a href="../blood-pressure/" data-zh="血管里的压力波:血压计" data-en="pressure waves in arteries: blood pressure">血管里的压力波:血压计</a>
    <a href="../venturi-flow/" data-zh="平稳流动的另一面:文丘里管" data-en="the calm side of pipe flow: Venturi">平稳流动的另一面:文丘里管</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x18243a, 22, 60);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
  scene.fog.color = new THREE.Color(dark ? 0x18243a : 0xcfe0ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('水锤效应 · 猛关阀门,水把管子敲响', 'Water Hammer · Slam the Valve, the Water Strikes Back');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setToggleBtns();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
camera.position.set(10, 7.5, 15);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 9, 7);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 几何布置 ================= */
const ground = new THREE.Mesh(new THREE.BoxGeometry(34, 0.5, 9), mat(0x39414d, { opacity: 1 }));
ground.position.y = -3.2;
scene.add(ground);
/* 物理管:长 14 m,显示 1:1 */
const L_PIPE = 14, R_PIPE = 0.55;
const pipeAxisY = -0.6;
const x0 = -L_PIPE / 2;

/* 水箱(水库) */
const tankG = new THREE.Group();
scene.add(tankG);
{
  const glass = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.4, 2.6),
    new THREE.MeshStandardMaterial({ color: 0xa8c8e8, roughness: 0.15, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false }));
  glass.position.set(x0 - 1.6, pipeAxisY + 0.6, 0);
  tankG.add(glass);
  const wt = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.2, 2.4),
    new THREE.MeshBasicMaterial({ color: 0x3b82c4, transparent: true, opacity: 0.55 }));
  wt.position.set(x0 - 1.6, pipeAxisY + 0.2, 0);
  tankG.add(wt);
}
/* 玻璃管壁 */
{
  const g = new THREE.CylinderGeometry(R_PIPE, R_PIPE, L_PIPE, 36, 1, true);
  const tube = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xa8c8e8, roughness: 0.12, metalness: 0.05,
    transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false }));
  tube.rotation.z = Math.PI / 2;
  tube.position.y = pipeAxisY;
  scene.add(tube);
}
/* 压力鼓包壳(顶点随压强径向缩放) */
const SHEATH_SEG = 120, SHEATH_RAD = 20;
const sheathGeo = new THREE.CylinderGeometry(R_PIPE, R_PIPE, L_PIPE, SHEATH_RAD, SHEATH_SEG, true);
const sheath = new THREE.Mesh(sheathGeo, new THREE.MeshBasicMaterial({
  color: 0xff6b6b, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false,
  blending: THREE.AdditiveBlending }));
sheath.rotation.z = Math.PI / 2;
sheath.position.y = pipeAxisY;
scene.add(sheath);
const sheathBase = sheathGeo.attributes.position.array.slice();

/* ================= 一维水击求解器 ================= */
const RHO = 1000, C_WAVE = 1200;                         // 波速 m/s(钢管水)
const N = 140;                                           // 压强节点
const dx = L_PIPE / (N - 1);
const pArr = new Float64Array(N);                        // 表压 Pa
const vArr = new Float64Array(N - 1);                    // 格心速度 m/s
let v0 = clamp(qsFloat('v', 2), 0.5, 3);
let tClose = clamp(qsFloat('tc', 1.5), 0.001, 2);        // 关阀时间(模拟秒)
let chamberOn = qsBool('ch', false);
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let spinOn = qsBool('spin', true);
let tGlob = 0;                                           // 显示秒
let tSim = 0;                                            // 模拟秒
let valveOpen = 1;                                       // 0..1
let closing = false, closeT0 = 0;
let chWaterVol = 0;                                      // 空气室进水(相对量)
const dpThe = () => RHO * C_WAVE * v0;                   // 焦寇斯基理论峰 Pa
const period = () => 4 * L_PIPE / C_WAVE;                // 相长 s
const SUB_DT = 3e-5;
function resetFlow() {
  pArr.fill(0);
  for (let i = 0; i < N - 1; i++) vArr[i] = v0;
  valveOpen = 1; closing = false; tSim = 0; chWaterVol = 0;
  trace.length = 0;
}
function simSub() {
  /* 速度更新:压力梯度 + 摩擦 */
  for (let i = 0; i < N - 1; i++) {
    const jp = Math.min(i + 1, N - 1), jm = Math.max(i, 0);
    vArr[i] += -(pArr[jp] - pArr[jm]) / (RHO * dx) * SUB_DT;
    vArr[i] -= vArr[i] * 1.2 * SUB_DT;                   // 保守摩擦,让波动几轮后平息
  }
  /* 压强更新:连续方程(内部节点中心差分,阀端单侧差分+边界速度) */
  for (let j = 1; j < N - 1; j++) {
    pArr[j] += -RHO * C_WAVE * C_WAVE * (vArr[j] - vArr[j - 1]) / dx * SUB_DT;
  }
  pArr[N - 1] += -RHO * C_WAVE * C_WAVE * (v0 * valveOpen - vArr[N - 2]) / (dx / 2) * SUB_DT;
  pArr[0] = 0;                                           // 水箱恒压
  /* 阀门边界:末格速度被 κ 钳住 */
  vArr[N - 2] = v0 * valveOpen;
  /* 空气室:阀前泄压进罐 */
  if (chamberOn) {
    const j = N - 4;
    const bleed = Math.max(0, pArr[j] - 5e4) * 3e-9;     // 超 0.5 bar 才进罐
    const dpCut = bleed * RHO * C_WAVE * C_WAVE * SUB_DT * 8;
    pArr[j] -= dpCut;
    chWaterVol = clamp(chWaterVol + dpCut / 1e6, 0, 1);
  }
}
function simStep(dtSim) {
  let acc = dtSim;
  while (acc > 0) {
    const h = Math.min(SUB_DT, acc);
    /* 阀门开度 */
    if (closing) {
      valveOpen = clamp(1 - (tSim - closeT0) / tClose, 0, 1);
      if (valveOpen <= 0) closing = false;
    }
    simSub();
    tSim += h;
    acc -= h;
  }
}

/* ================= 阀板关阀动画/鼓包更新/粒子 ================= */
function updateSheath() {
  const pos = sheathGeo.attributes.position.array;
  const pMax = Math.max(dpThe() * 1.2, 1e5);
  for (let i = 0; i < pos.length; i += 3) {
    const bx = sheathBase[i], by = sheathBase[i + 1], bz = sheathBase[i + 2];
    const yc = by;                                       // cylinder 轴向是 y(旋转前)
    const frac = clamp((yc + L_PIPE / 2) / L_PIPE, 0, 1);
    const j = Math.round(frac * (N - 1));
    const pr = clamp(pArr[j] / pMax, -0.4, 1);
    const s = 1 + Math.max(0, pr) * 0.22 - Math.max(0, -pr) * 0.06;
    pos[i] = bx * s; pos[i + 1] = by; pos[i + 2] = bz * s;
  }
  sheathGeo.attributes.position.needsUpdate = true;
  sheath.material.opacity = clamp(pArrMax() / Math.max(dpThe() * 1.2, 1e5), 0, 1) * 0.3 + 0.04;
}
function pArrMax() {
  let m = 0;
  for (let j = 0; j < N; j++) if (pArr[j] > m) m = pArr[j];
  return m;
}
function updateWaters(dtReal) {
  for (let i = 0; i < W_N; i++) {
    const w = waters[i];
    const frac = clamp((w.x - x0) / L_PIPE, 0, 1);
    const vi = vArr[clamp(Math.floor(frac * (N - 1)), 0, N - 2)];
    w.x += vi * dtReal;                                  // 管 1:1,粒子按真实速度爬(暂停即停)
    if (w.x > L_PIPE / 2) { w.x = x0; w.r = Math.sqrt(Math.random()) * 0.85; w.th = Math.random() * Math.PI * 2; }
    if (w.x < x0) w.x = x0 + 0.05;
    const j = clamp(Math.round(frac * (N - 1)), 0, N - 1);
    const pr = clamp(pArr[j] / Math.max(dpThe(), 1e5), -0.5, 1);
    dummy.position.set(w.x, pipeAxisY + Math.sin(w.th) * R_PIPE * w.r, Math.cos(w.th) * R_PIPE * w.r);
    dummy.updateMatrix();
    waterIM.setMatrixAt(i, dummy.matrix);
    _c.setHSL(clamp(0.58 - pr * 0.62, 0, 0.65), 0.85, clamp(0.5 + pr * 0.12, 0.3, 0.66));
    waterIM.setColorAt(i, _c);
  }
  waterIM.instanceMatrix.needsUpdate = true;
  waterIM.instanceColor.needsUpdate = true;
}

}

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 18, padB = 22;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const T = 120;                                         // 显示 120 模拟 ms 窗口
  const pMax = Math.max(dpThe() * 1.35, 2e5);
  const xOf = t => pad + (W - 2 * pad) * clamp(t / T, 0, 1);
  /* 零线在中点偏下,高压向上,负压留一点空间 */
  const yz = pad + (H - pad - padB) * 0.62;
  const yOf2 = p => yz - p / pMax * (H - pad - padB) * 0.55;
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - padB); ctx.lineTo(W - pad, H - padB); ctx.stroke();
  /* 零线 */
  ctx.setLineDash([4, 4]); ctx.strokeStyle = cTxt; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, yz); ctx.lineTo(W - pad, yz); ctx.stroke();
  ctx.setLineDash([]);
  /* ρcΔv 理论线 */
  ctx.setLineDash([7, 5]); ctx.strokeStyle = '#ffa94d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, yOf2(dpThe())); ctx.lineTo(W - pad, yOf2(dpThe())); ctx.stroke();
  ctx.setLineDash([]);
  /* 轨迹 */
  if (trace.length > 1) {
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2.4;
    ctx.beginPath();
    trace.forEach((s, i) => {
      const x = xOf(s.t * 1000), y = yOf2(s.p);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  ctx.fillStyle = cTxt; ctx.font = '13px system-ui';
  ctx.fillText('ms', W - pad - 18, H - 5);
  ctx.fillStyle = '#ffa94d';
  ctx.fillText('ρcΔv', pad + 4, yOf2(dpThe()) - 6);
  ctx.fillStyle = cTxt;
  ctx.fillText('0', pad + 4, yz - 5);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0, traceAcc = 0, wasPeak = false;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * (playing ? speed : 0);
  tGlob += dt0;
  if (dt > 0) {
    const dtSim = dt / 60;                               // 显示放慢 ×1/60
    simStep(dtSim);
    traceAcc += dtSim;
    if (traceAcc > 0.0004) {                             // 每 0.4 模拟 ms 采样
      traceAcc = 0;
      trace.push({ t: tSim, p: pArr[N - 1] });
      if (trace.length > 700) trace.shift();
    }
  }
  /* 手轮/阀板动画:关阀时手轮反转 */
  handwheel.rotation.y = lerp(handwheel.rotation.y, valveOpen * Math.PI * 1.2, dt0 > 0 ? 0.1 : 0);
  updateSheath();
  updateWaters(dt);
  /* 空气室水位 */
  chWater.scale.y = clamp(0.4 + chWaterVol * 1.6, 0.05, 2.2);
  chWater.position.y = -1.2 + chWater.scale.y / 2;
  /* 压强表指针 */
  const pK = pArr[N - 1] / 1e5;
  needle.rotation.z = lerp(needle.rotation.z, -(clamp(pK / Math.max(dpThe() / 1e5 * 1.3, 2), 0, 1) * 2.4 - 1.2), dt0 > 0 ? 0.25 : 0);
  /* 猛关白闪 */
  const peak = pArr[N - 1] > dpThe() * 0.85 && !chamberOn;
  if (peak && !wasPeak) {
    const f = document.getElementById('flash');
    f.style.transition = 'none'; f.style.opacity = '0.45';
    requestAnimationFrame(() => { f.style.transition = 'opacity .5s'; f.style.opacity = '0'; });
  }
  wasPeak = peak;
  statsAcc += dt0;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stDp.textContent = (dpThe() / 1e5).toFixed(1) + ' bar';
    stP.textContent = (pArr[N - 1] / 1e5).toFixed(1) + ' bar';
    stP.className = 'v ' + (pArr[N - 1] > dpThe() * 0.8 ? 'bad' : pArr[N - 1] > 1e5 ? 'warn' : 'ok');
    stT.textContent = (period() * 1000).toFixed(0) + ' ms';
    stC.textContent = ((1 - valveOpen) * 100).toFixed(0) + ' %';
    stS.textContent = valveOpen > 0 ? (tClose > 2 * L_PIPE / C_WAVE ? L('流动/缓关中', 'flow / slow close') : L('流动', 'flowing'))
      : (pArrMax() > 1e4 ? L('波来回敲打 ⚠', 'waves banging ⚠') : L('已关死', 'shut'));
    stS.className = 'v ' + (valveOpen <= 0 && pArrMax() > 1e4 ? 'bad' : 'ok');
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
v0 = clamp(qsFloat('v', 2), 0.5, 3);
tClose = clamp(qsFloat('tc', 1.5), 0.001, 2);
chamberOn = qsBool('ch', false);
chamberG.visible = chamberOn;
syncSliders();
setToggleBtns();
buildSteps();
applyTheme();
applyLang();
resetFlow();
start();
</script>
