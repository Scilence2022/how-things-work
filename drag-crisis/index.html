<style>

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}

    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

  #panelToggle { display: flex; align-items: center; justify-content: center;

  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(u,c0,c1)=>{const t=clamp((u-c0)/(c1-c0),0,1);return t*t*(3-2*t);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景（风洞：气流 +x 方向，球在原点） ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,72);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(6.4,3.4,11.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(2.0,0.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.5;controls.maxDistance=45;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(4,8,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-6,4,-5);scene.add(fill);

/* ---- 物理模型（代表级数值：钝体经典 Cd-Re 曲线，临界区取圆柱经典值 1.2→0.3；
   光滑体临界 Re≈2e5~5e5，凹坑体提前到 ≈4e4~1e5；分离角 80°→120°） ---- */
const R=1.1, NU=1.5e-5;                 // 球半径(场景单位)、空气运动粘度 m²/s
let D=0.22;                             // 球径(物理, m)，滑杆可调
let U=1.1, Re=1.6e4, uL=Math.log10(Re); // 来流速度、雷诺数、log10(Re)
let tt=0;                               // 转捩进度 0=层流 1=湍流
let thS=80*Math.PI/180;                 // 分离角(从前驻点量起)
let Cd=1.2;                             // 阻力系数
let gRow=0.30*R, wakeLen=7.0;           // 尾流扩张率、尾流长度
let dimpled=false;                      // 凹坑球开关
const C0=()=>dimpled?4.60:5.30, C1=()=>dimpled?4.98:5.72, CDLOW=()=>dimpled?0.25:0.30;
function cdOf(u,dim){                   // Cd(log10Re)：低 Re 高台 1.2 → 临界跳水 → 超临界回升
  const c0=dim?4.60:5.30,c1=dim?4.98:5.72,lo=dim?0.25:0.30;
  let base=1.2-(u<4.4?0.10*(4.4-u):0);
  let cd=lerp(base,lo,smooth(u,c0,c1));
  if(u>c1)cd=lo+Math.min(0.32,(u-c1)*0.22);
  return cd;
}
function deriveState(){
  U=Math.pow(10,-0.05+2.4*(+document.getElementById('sU').value)/1000);
  D=+document.getElementById('sD').value;
  Re=U*D/NU;uL=Math.log10(Re);
  tt=smooth(uL,C0(),C1());
  thS=(80+40*tt)*Math.PI/180;
  Cd=cdOf(uL,dimpled);
  gRow=lerp(0.30,0.05,tt)*R;wakeLen=lerp(7.0,4.2,tt);
}
const xsep=()=>-R*Math.cos(thS);        // 分离点 x
const hw0=()=>R*Math.sin(thS);          // 分离处尾流半宽
function hwAt(x){const w=hw0()+gRow*(x-xsep());   // 尾流包络（末端圆整）
  const Lend=xsep()+wakeLen,f=clamp((Lend-x)/1.15,0,1);
  return w*Math.sqrt(Math.max(0,1-(1-f)*(1-f)));}
function wakeW(x,y){                    // 在尾流包络内的混合权重
  if(x<=xsep())return 0;const ay=Math.abs(y);
  return clamp((hwAt(x)+0.25-ay)/0.5,0,1);}

/* ---- 球体（凹坑球：斐波那契凹点阵把顶点内推，代码构几何） ---- */
const ballM=new THREE.MeshStandardMaterial({color:0xdfe5ea,roughness:0.5,metalness:0.05,
  emissive:0x155e8f,emissiveIntensity:0.5});
const ballG=new THREE.Group();scene.add(ballG);
let ballMesh=null;
function buildBall(dim){
  if(ballMesh){ballG.remove(ballMesh);ballMesh.geometry.dispose();}
  let geo;
  if(dim){
    geo=new THREE.SphereGeometry(R,96,64);
    const pa=geo.attributes.position,K=160,cent=[];
    for(let i=0;i<K;i++){const yy=1-2*(i+0.5)/K,rr=Math.sqrt(Math.max(0,1-yy*yy)),ph=i*2.39996;
      cent.push([rr*Math.cos(ph),yy,rr*Math.sin(ph)]);}
    const v=new THREE.Vector3(),depth=0.055,w=0.085;
    for(let i=0;i<pa.count;i++){
      v.fromBufferAttribute(pa,i).normalize();
      let dmax=0;
      for(const c of cent){
        const a=Math.acos(clamp(v.x*c[0]+v.y*c[1]+v.z*c[2],-1,1));
        if(a<w){const d=depth*0.5*(1+Math.cos(Math.PI*a/w));if(d>dmax)dmax=d;}
      }
      if(dmax>0)pa.setXYZ(i,v.x*(R-dmax),v.y*(R-dmax),v.z*(R-dmax));
    }
    geo.computeVertexNormals();
  }else geo=new THREE.SphereGeometry(R,48,32);
  ballMesh=new THREE.Mesh(geo,ballM);ballG.add(ballMesh);
}
/* 分离点标记（上/下两个橙锥，随分离角后移） */
const sepM=new THREE.MeshStandardMaterial({color:0xff922b,emissive:0xb85c00,emissiveIntensity:0.8,roughness:0.4});
const sepTop=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.26,10),sepM);
const sepBot=sepTop.clone();scene.add(sepTop,sepBot);
const upv=new THREE.Vector3(0,1,0);
/* 尾流泡（红色半透明回转体，LatheGeometry 代码生成） */
const wakeGrp=new THREE.Group();scene.add(wakeGrp);
let wakeMesh=null,builtThS=0,builtDim=null;
function rebuildWake(){
  if(wakeMesh){wakeGrp.remove(wakeMesh);wakeMesh.geometry.dispose();}
  const pts=[],x0=xsep()+0.05;
  pts.push(new THREE.Vector2(hw0()*0.94,x0));
  for(let k=0;k<=26;k++){const x=x0+(wakeLen-0.1)*k/26;pts.push(new THREE.Vector2(Math.max(0.02,hwAt(x)),x));}
  const geo=new THREE.LatheGeometry(pts,48);geo.rotateZ(-Math.PI/2);
  wakeMesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xff5252,transparent:true,
    opacity:0.13,depthWrite:false,side:THREE.DoubleSide}));
  wakeGrp.add(wakeMesh);
}

/* ---- 流场（位势绕流 + 尾流回流涡 + 湍流抖动；无量纲后乘视觉速度） ---- */
let simT=0;
function velBase(x,y,guide){             // guide=true: 无涡无抖动（流线用）
  const r=Math.hypot(x,y);
  if(r<R*1.005)return[0,0];
  const th=Math.atan2(y,x),ct=Math.cos(th),st=Math.sin(th),f=R*R/(r*r);
  const ur=(1-f)*ct,ut=-(1+f)*st;
  let vx=ur*ct-ut*st,vy=ur*st+ut*ct;
  const w=wakeW(x,y);
  if(w>0){
    const drift=0.16+0.10*tt;
    vx=vx*(1-w)+drift*w;vy*=(1-w);
    if(!guide){
      const cx=xsep()+1.6,G=lerp(0.20,0.09,tt),cyy=0.55*hw0();
      let dx=x-cx,dy=y-cyy,rr=dx*dx+dy*dy+0.18;
      vx+=dy*G/rr;vy+=-dx*G/rr;                 // 上涡顺时针
      dy=y+cyy;rr=dx*dx+dy*dy+0.18;
      vx+=-dy*G/rr;vy+=dx*G/rr;                 // 下涡逆时针
      if(tt>0.02){                              // 湍流尾流抖动
        vy+=0.30*tt*Math.sin(x*3.1-simT*11+y*2.7);
        vx+=0.10*tt*Math.sin(x*2.3+simT*13);
      }else{                                    // 层流尾流缓慢摆动
        vy+=0.06*Math.sin(x*1.4-simT*2.2);
      }
    }
  }
  return[vx,vy];
}

/* ---- 流线（沿自身速度场步进生成，随分离角/凹坑重建） ---- */
const flowGrp=new THREE.Group();scene.add(flowGrp);
const lineM=new THREE.LineBasicMaterial({color:0x86b9e0,transparent:true,opacity:0.30});
let builtLineThS=0;
function streamPts(h){
  const pts=[],ds=0.07,Rb=R+0.09;
  let p=new THREE.Vector3(-6.9,h,0),mode='field',dir=new THREE.Vector3(1,0,0);
  for(let k=0;k<270;k++){
    pts.push(p.clone());
    let d;
    if(mode==='field'){const v=velBase(p.x,p.y,true);d=new THREE.Vector3(v[0],v[1],0);
      if(d.lengthSq()<1e-4)d.set(1,0,0);}
    else d=dir.clone();
    p.addScaledVector(d.normalize(),ds);
    if(mode==='field'){
      const r=Math.hypot(p.x,p.y);
      if(r<Rb){
        const ph=Math.atan2(p.y,p.x);
        if(Math.PI-ph>=thS){                    // 越过分离角 → 沿剪切层脱体
          const phs=Math.PI-thS;
          p.set(Rb*Math.cos(phs),Rb*Math.sin(phs),0);
          dir.set(Math.sin(phs),-Math.cos(phs),0);mode='free';
        }else{
          p.set(Rb*Math.cos(ph),Rb*Math.sin(ph),0);
          dir.set(Math.sin(ph),-Math.cos(ph),0);
        }
      }
    }else dir.lerp(new THREE.Vector3(1,0.03+0.13*(1-tt),0),0.05).normalize();
    if(p.x>7.4)break;
  }
  return pts;
}
function rebuildLines(){
  for(const c of flowGrp.children){c.geometry.dispose();flowGrp.remove(c);}
  const HS=[0.34,0.7,1.1,1.55,2.05,2.6];
  for(const h of HS)for(const s of[1,-1]){
    const g=new THREE.BufferGeometry().setFromPoints(streamPts(h*s));
    flowGrp.add(new THREE.Line(g,lineM));
  }
  builtLineThS=thS;
}

/* ---- 主循环 ---- */
function fmtU(u){return u>=10?u.toFixed(0):u.toFixed(1);}
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    if(demo===0&&simT>1.0)demo=1;                 // 开局自动演示：扫过临界点
    if(demo===1){
      let u=Math.log10(Re)+dt*0.30;
      if(u>=5.95){u=5.95;demo=2;}
      setU(u);
    }
    if(crisisAnim>0){                             // 「临界一跃」：快速扫过转捩区
      let u=Math.log10(Re)+dt*0.42;
      if(u>=5.90){u=5.90;crisisAnim=0;}
      setU(u);
    }
  }
  deriveState();
  document.getElementById('sUVal').textContent=fmtU(U)+' m/s';
  document.getElementById('sDVal').textContent=D.toFixed(3)+' m';
  /* 尺寸相关几何按需重建（分离角变化 / 凹坑切换） */
  if(Math.abs(thS-builtThS)>0.012||dimpled!==builtDim){rebuildWake();builtThS=thS;builtDim=dimpled;}
  if(Math.abs(thS-builtLineThS)>0.03)rebuildLines();
  /* 球面色 = 边界层状态：蓝(层流) → 橙(湍流) */
  const c=new THREE.Color(0x155e8f).lerp(new THREE.Color(0xc2570a),tt);
  ballM.emissive.copy(c);
  ballM.color.setHex(dimpled?0xf2f4f6:0xdfe5ea);
  /* 分离点标记与标签 */
  const phs=Math.PI-thS,xs=xsep(),ys=R*Math.sin(thS);
  sepTop.position.set(R*Math.cos(phs),ys,0);sepBot.position.set(R*Math.cos(phs),-ys,0);
  sepTop.quaternion.setFromUnitVectors(upv,new THREE.Vector3(Math.cos(phs),Math.sin(phs),0));
  sepBot.quaternion.setFromUnitVectors(upv,new THREE.Vector3(Math.cos(phs),-Math.sin(phs),0));
  sepLblObj.position.set(R*Math.cos(phs)*0.9,ys*1.55,0);
  /* 箭头：来流（长度∝U）与压差阻力（长度∝Cd，同速对比） */
  const Uvis=1.1+2.3*clamp((uL-4.0)/2.0,0,1);
  for(let k=0;k<3;k++)updArrow(flowAs[k],1.7-1.4*k,0.5+Uvis*0.45);
  arrUp.position.set(-0.2,2.1,0);arrUp.setLength(clamp(0.4+1.9*(Cd/1.35),0.4,2.4),0.26,0.14);
  /* 粒子平流 + 染色 */
  if(playing){
    for(let i=0;i<NP;i++){
      let x=pPos[3*i],y=pPos[3*i+1];
      const v=velBase(x,y,false);
      x+=v[0]*Uvis*1.25*dt;y+=v[1]*Uvis*1.25*dt;
      pAge[i]+=dt;
      const r=Math.hypot(x,y);
      if(x>7.6||x<-7.6||Math.abs(y)>4.4||Math.abs(pPos[3*i+2])>2.0||r<R*1.03||pAge[i]>11){
        respawn(i);continue;
      }
      pPos[3*i]=x;pPos[3*i+1]=y;
    }
  }
  for(let i=0;i<NP;i++){
    const x=pPos[3*i],y=pPos[3*i+1],r=Math.hypot(x,y),w=wakeW(x,y);
    let cr,cg,cb;
    if(w>0.35){cr=1.0;cg=0.36;cb=0.30;}                       // 尾流=红
    else if(r<R*1.32&&r>R*1.02){                              // 边界层带
      if(tt>0.5){cr=1.0;cg=0.62;cb=0.26;}else{cr=0.30;cg=0.63;cb=1.0;}
    }else{cr=0.42;cg=0.70;cb=0.95;}                           // 自由流
    pCol[3*i]=cr;pCol[3*i+1]=cg;pCol[3*i+2]=cb;
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
  /* Cd-Re 游标 */
  const cx=pxu(uL),cy=pyc(Cd),cp=curGeo.attributes.position.array;
  cp[0]=cx;cp[1]=0;cp[2]=0;cp[3]=cx;cp[4]=cy;cp[5]=0;
  curGeo.attributes.position.needsUpdate=true;
  curDot.position.set(cx,cy,0);
  acc+=dt;if(acc>0.12){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化：低 Re 层流宽尾流起步，1 秒后自动扫过临界点，8 秒内看到 Cd 跳水 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
buildBall(false);styleCurves();
deriveState();rebuildWake();builtDim=dimpled;rebuildLines();
plotGrp.visible=document.getElementById('tglCurve').checked;
flowGrp.visible=document.getElementById('tglFlow').checked;
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
