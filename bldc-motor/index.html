<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无刷直流电机 · 电子换相六步曲</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#38d9a9;
    --bg:#0f1213; --panel:rgba(15,18,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,18,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,18,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0ca678;
    --bg:#eef2f4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(56,217,169,.9); color: #c9f7ea; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#0b7253; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #38d9a9; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #c9f7ea; border-color: rgba(56,217,169,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#0b7253; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(56,217,169,.6); background: rgba(56,217,169,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(12,166,120,.55); background: rgba(12,166,120,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(56,217,169,.10); border-color: rgba(56,217,169,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,166,120,.08); border-color: rgba(12,166,120,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #c9f7ea; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="无刷直流电机 · 电子换相六步曲" data-en="Brushless DC Motor · Six-Step Electronic Commutation">无刷直流电机 · 电子换相六步曲</h1>
  <div class="sub" data-zh="定子磁场必须跑在转子前面,转子才能持续受力:无刷电机用 6 个 MOSFET 组成三相桥,按 +A−B→+A−C→+B−C→+B−A→+C−A→+C−B 六步轮流通电,让合成磁场每步跳进 60° 电角度、转子永磁体追着转;霍尔传感器或悬空相反电动势过零告诉控制器何时换相,PWM 占空比调速。本页电机 KV≈130 rpm/V、12 V 母线、效率可达 90%+;转子画面按上限慢放,数值为真实值 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="The stator field must lead the rotor for torque to flow: a brushless motor switches six MOSFETs in the order +A−B → +A−C → +B−C → +B−A → +C−A → +C−B, jumping the resultant field 60 electrical degrees per step while the rotor magnets chase it; Hall sensors (or floating-phase back-EMF zero crossings) tell the controller when to commutate, and PWM duty sets the speed. This motor: KV≈130 rpm/V, 12 V bus, up to 90%+ efficiency; rotor animation is time-dilated, numbers are true · 3D interactive demo · drag to orbit · Space = run/pause">无刷直流电机 · 电子换相六步曲</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="转速" data-en="Speed">转速</span><span class="v" id="stRpm">—</span>
  <span class="k" data-zh="当前步" data-en="Step">当前步</span><span class="v" id="stStep">—</span>
  <span class="k" data-zh="转矩" data-en="Torque">转矩</span><span class="v" id="stTq">—</span>
  <span class="k" data-zh="母线电流" data-en="Bus current">母线电流</span><span class="v" id="stBus">—</span>
  <span class="k" data-zh="换相频率" data-en="Commut. freq">换相频率</span><span class="v" id="stFreq">—</span>
  <span class="k" data-zh="效率" data-en="Efficiency">效率</span><span class="v" id="stEff">—</span>
</div>

<div id="plot">
  <h3 data-zh="三相电流梯形波(真实时基)· 竖线 = 换相点,数字 = 步序" data-en="Three-phase trapezoidal currents (true time base) · lines = commutations, digits = step no.">三相电流梯形波(真实时基)· 竖线 = 换相点,数字 = 步序</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="青绿辉光:当前电流路径(每步换道)" data-en="teal glow: live current path (rerouted each step)">青绿辉光:当前电流路径(每步换道)</span>
    <span class="chip.r" data-zh="红/蓝块:转子 N/S 极(2 对极)" data-en="red/blue: rotor N/S poles (2 pole pairs)">红/蓝块:转子 N/S 极(2 对极)</span>
    <span class="chip.g" data-zh="绿色箭头:定子合成磁场(+60°/步)" data-en="green arrow: stator field (+60° elec./step)">绿色箭头:定子合成磁场(+60°/步)</span>
    <span class="chip.b" data-zh="铜色:三相绕组 A/B/C,亮=通电" data-en="copper: phase windings A/B/C, lit = energized">铜色:三相绕组 A/B/C,亮=通电</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnStep" data-zh="单步换相(暂停自动)" data-en="Step once (pause auto)">单步换相(暂停自动)</button>
    <button class="abtn on" id="btnRun6" data-zh="六步连转(恢复自动)" data-en="Auto six-step (resume)">六步连转(恢复自动)</button>
  </div>
  <div class="row"><label data-zh="负载转矩" data-en="Load torque">负载转矩</label><input id="sLoad" type="range" min="0" max="150" step="5" value="60"><span class="val" id="sLoadVal">60 mN·m</span></div>
  <div class="row"><label data-zh="指令转速" data-en="Cmd speed">指令转速</label><input id="sCmd" type="range" min="200" max="1500" step="50" value="800"><span class="val" id="sCmdVal">800 rpm</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglPath" type="checkbox" checked> <span data-zh="电流路径" data-en="Current path">电流路径</span></label>
      <label><input id="tglArrow" type="checkbox" checked> <span data-zh="磁场箭头" data-en="Field arrows">磁场箭头</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../motor-generator/" data-zh="发电机:同一台机反着用" data-en="motor-generator: the same machine, reversed">发电机:同一台机反着用</a>
    <a href="../induction-motor/" data-zh="感应电机:无需永磁体的旋转" data-en="induction motor: spin without magnets">感应电机:无需永磁体的旋转</a>
    <a href="../maglev/" data-zh="磁悬浮:磁场托举与推进" data-en="maglev: levitation & propulsion">磁悬浮:磁场托举与推进</a>
    <a href="../reaction-wheel/" data-zh="反作用轮:靠动量守恒转向" data-en="reaction wheel: steering by momentum">反作用轮:靠动量守恒转向</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod = (x, m) => ((x % m) + m) % m;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);
const D2R = Math.PI / 180, R2D = 180 / Math.PI;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x101418, 20, 58);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x101418 : 0xdde5ec);
  scene.fog.color = new THREE.Color(dark ? 0x101418 : 0xdde5ec);
  groundM.color.setHex(dark ? 0x15171c : 0xb9c3cd);
  houseM.color.setHex(dark ? 0x9fb4c8 : 0x51606f);
  houseM.opacity = dark ? 0.16 : 0.22;
  bellM.color.setHex(dark ? 0x39404a : 0x9aa7b4);
  coreM.color.setHex(dark ? 0x2e3742 : 0x7d8b99);
  toothM.color.setHex(dark ? 0x3a4450 : 0x8b98a6);
  yokeM.color.setHex(dark ? 0x232830 : 0x6b7885);
  pcbM.color.setHex(dark ? 0x14503f : 0x1d6b52);
  tickM.color.setHex(dark ? 0x3a4149 : 0x8a96a3);
  ringM.color.setHex(dark ? 0x3a4149 : 0x8a96a3);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('无刷直流电机 · 电子换相六步曲', 'Brushless DC Motor · Six-Step Electronic Commutation');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 160);
camera.position.set(7.4, 5.6, 9.2);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(1.1, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 34;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 0.95);
key.position.set(8, 12, 9);
scene.add(key);
const fillL = new THREE.DirectionalLight(0xcfeee2, 0.35);
fillL.position.set(-9, 6, -7);
scene.add(fillL);

/* ================= 电机参数与状态(真实数值) =================
   小型 4 极 BLDC:KV≈130 rpm/V,R=0.35 Ω,母线 12 V
   Ke = Kt = 9.549/KV ≈ 0.0735(V·s/rad 与 N·m/A)                 */

    de: 'A brushed motor commutates mechanically with brushes: sparking and EMI, brush wear limits life to ~1,000–5,000 h, efficiency ~75–80%, speed capped by the commutator. Brushless commutates with MOSFETs: life set by bearings (10,000–30,000 h), 85–95% efficiency, and hobby motors easily exceed 30,000 rpm. The price is a required controller — the commutator removed from the motor reappears as six transistors on the driver board.',
    act: () => { flyTo([-2.6, 3.4, 7.6], [0, 1.1, 0]); } },
  { b: '调速:PWM 斩波,效率不掉', be: 'Speed control: PWM chopping without losing efficiency',
    d: '控制器以 20 kHz 以上频率快速开关,占空比 D 决定平均电压 D×12 V;KV≈130 rpm/V 的电机空载转速 ≈ KV×电压,12 V 满压约 1560 rpm。相比串联电阻降压,PWM 的开关损耗极小(毫欧级导通电阻),配合反电动势换相,这就是小型无刷电机能保持 85~95% 效率、从 5 g 空心杯到千瓦级航模动力的原因。',
    de: 'The controller switches above 20 kHz and the duty cycle D sets the average voltage D×12 V; a KV≈130 rpm/V motor spins at ≈KV×volts unloaded — about 1,560 rpm on 12 V. Unlike a series resistor, PWM wastes almost nothing (milliohm on-resistance), and with back-EMF commutation that is how small BLDCs hold 85–95% efficiency from 5 g coreless actuators to kilowatt drone powertrains.',
    act: () => { flyTo([6.8, 4.6, 8.4], [2.0, 0.9, 0]); notify('拖动左侧滑块:看母线电流、占空比与效率如何响应', 'drag the sliders: watch bus current, duty and efficiency respond'); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 物理:六步换相 + 转速/电流闭环 ================= */
function physStep(dt) {
  let Icmd;
  if (auto) {
    const err = cmdRpm * 0.10472 - wm;                   // rad/s
    integ = clamp(integ + err * dt, -1.6, 1.6);
    const Tcmd = clamp(0.006 * err + 0.16 * integ, 0, 0.3);
    Icmd = Tcmd / KT;
  } else {
    integ = 0;
    Icmd = 0.55;                                         // 单步模式:小电流牵引
  }
  I += (Icmd - I) * Math.min(1, dt / 0.02);
  const eDeg = mod(thM * P_PAIRS * R2D, 360);
  if (auto) {
    const sp = stepFromE(eDeg);
    if (sp !== stepPhys) { stepPhys = sp; markFlag = sp; }
  }
  const d = (fieldEdeg(stepPhys) - eDeg) * D2R;          // 磁场超前角(电角度)
  const Tm = KT * I * Math.sin(d);
  wm += ((Tm - 0.00008 * wm - loadNm) / JT) * dt;
  if (!auto) wm *= Math.exp(-1.1 * dt);
  wm = clamp(wm, -1, 400);
  thM += wm * dt;
  duty = clamp((KT * wm + Math.abs(I) * RES) / VBUS, 0, 1);
}
function effPct() {
  const pmech = (loadNm + 0.00008 * wm) * Math.max(0, wm);
  const p0 = 0.1 + 0.0015 * wm;
  return pmech > 0.01 ? clamp(pmech / (pmech + I * I * RES + p0) * 100, 0, 97) : 0;
}
function trap(thDeg, off) {
  const u = mod(thDeg - off, 360);
  const edge = x => x < 15 ? x / 15 : x > 105 ? (120 - x) / 15 : 1;
  if (u < 120) return edge(u);
  if (u < 180) return 0;
  if (u < 300) return -edge(u - 180);
  return 0;
}

/* ================= 绘图:三相电流梯形波 ================= */
const plotCv = document.getElementById('plotCv');
const samples = [];
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 34, padR = 10, padT = 10, padB = 18;
  const t1 = simT, t0 = t1 - 0.45;
  const xOf = t => padL + (t - t0) / 0.45 * (W - padL - padR);
  const yOf = val => (H - padB + padT) / 2 - clamp(val, -2.6, 2.6) / 2.6 * ((H - padT - padB) / 2);
  ctx.font = '11px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  for (const g of [2, 0, -2]) {
    ctx.beginPath(); ctx.moveTo(padL, yOf(g)); ctx.lineTo(W - padR, yOf(g)); ctx.stroke();
  }
  ctx.fillStyle = cTxt;
  ctx.fillText('+2A', 4, yOf(2) + 4);
  ctx.fillText('0', 14, yOf(0) - 3);
  ctx.fillText('-2A', 4, yOf(-2) + 4);
  const vis = [];
  for (const s of samples) if (s.t >= t0) vis.push(s);
  const marks = vis.filter(s => s.m > 0);
  const stride = marks.length > 26 ? Math.ceil(marks.length / 26) : 1;
  ctx.strokeStyle = 'rgba(200,220,235,.30)';
  marks.forEach((s, i) => {
    if (i % stride) return;
    const x = xOf(s.t);
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, H - padB); ctx.stroke();
    if (stride === 1) { ctx.fillStyle = cTxt; ctx.fillText(String(s.m), x + 2, padT + 9); }
  });
  const cols = ['#38d9a9', '#ffa94d', '#74c0fc'];
  const keys = ['a', 'b', 'c'];
  for (let k = 0; k < 3; k++) {
    ctx.strokeStyle = cols[k];
    ctx.lineWidth = 2;
    ctx.beginPath();
    let started = false;
    for (const s of vis) {
      const x = xOf(s.t), y = yOf(s[keys[k]]);
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
    if (vis.length) {
      const lastS = vis[vis.length - 1];
      ctx.fillStyle = cols[k];
      ctx.fillRect(xOf(lastS.t) - 2, yOf(lastS[keys[k]]) - 2, 4, 4);
    }
  }
  ctx.lineWidth = 1;
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elLoad = document.getElementById('sLoad'), elLoadVal = document.getElementById('sLoadVal');
const elCmd = document.getElementById('sCmd'), elCmdVal = document.getElementById('sCmdVal');
const stRpm = document.getElementById('stRpm'), stStep = document.getElementById('stStep'),
  stTq = document.getElementById('stTq'), stBus = document.getElementById('stBus'),
  stFreq = document.getElementById('stFreq'), stEff = document.getElementById('stEff');
const formulaEl = document.getElementById('formula');
const btnStep = document.getElementById('btnStep'), btnRun6 = document.getElementById('btnRun6');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elLoad.value = loadNm * 1000;
  elLoadVal.textContent = `${(loadNm * 1000).toFixed(0)} mN·m`;
  elCmd.value = cmdRpm;
  elCmdVal.textContent = `${cmdRpm.toFixed(0)} rpm`;
}
function syncBtns() {
  btnRun6.classList.toggle('on', auto);
  btnStep.classList.toggle('on', !auto);
}
function updateStats() {
  const rpm = Math.max(0, wm * 9.5493);
  stRpm.innerHTML = `${rpm.toFixed(0)}<small> rpm</small>`;
  stRpm.className = 'v' + (auto && duty > 0.985 ? ' warn' : '');
  stStep.textContent = `${stepIdx} / 6 · ${STEP_TXT[stepIdx - 1]}`;
  stTq.innerHTML = `${(KT * Math.abs(I) * 1000).toFixed(0)}<small> mN·m</small>`;
  const ibus = duty * Math.abs(I);
  stBus.innerHTML = `${ibus.toFixed(2)}<small> A</small>`;
  stBus.className = 'v' + (ibus > 2.5 ? ' warn' : '');
  stFreq.innerHTML = `${(rpm * 0.2).toFixed(0)}<small> Hz</small>`;
  const eff = effPct();
  stEff.innerHTML = `${eff.toFixed(0)}<small> %</small>`;
  stEff.className = 'v ' + (eff >= 85 ? 'ok' : eff < 40 ? 'bad' : 'warn');
}
function updateFormula() {
  const ttZh = STEP_TXT.map((t, i) => i + 1 === stepIdx ? `【${t}】` : t).join('→');
  const ttEn = STEP_TXT.map((t, i) => i + 1 === stepIdx ? `[${t}]` : t).join('→');
  const emf = KT * wm, cur = Math.abs(I), eff = effPct();
  formulaEl.innerHTML = L(
    `<b>反电动势:E = Ke·ω</b>,Ke = 9.55/KV = ${KT.toFixed(4)} V·s/rad(KV≈130 rpm/V)→ E = ${emf.toFixed(2)} V<br>` +
    `<b>转矩:T = Kt·I</b>,Kt ≈ Ke = ${KT.toFixed(4)} N·m/A → T = ${(KT * cur * 1000).toFixed(0)} mN·m,I = ${I.toFixed(2)} A<br>` +
    `<b>六步真值表:${ttZh}</b> · 每步 +60° 电角度 = 30° 机械角(2 对极),每转换相 12 次<br>` +
    `<b>换相判据:霍尔 ×3(120° 一只)读扇区;无传感器:悬空相反电动势过零,延迟 30° 电角度再换相</b><br>` +
    `<b>PWM 调速:D = ${(duty * 100).toFixed(0)}% → 平均电压 ${(VBUS * duty).toFixed(1)} V</b> · 铜损 I²R = ${(cur * cur * RES).toFixed(2)} W · η = ${eff.toFixed(0)} %(小型 BLDC 典型 85~95%)`,
    `<b>Back-EMF: E = Ke·ω</b>, Ke = 9.55/KV = ${KT.toFixed(4)} V·s/rad (KV≈130 rpm/V) → E = ${emf.toFixed(2)} V<br>` +
    `<b>Torque: T = Kt·I</b>, Kt ≈ Ke = ${KT.toFixed(4)} N·m/A → T = ${(KT * cur * 1000).toFixed(0)} mN·m at I = ${I.toFixed(2)} A<br>` +
    `<b>Six-step table: ${ttEn}</b> · +60° elec. = 30° mech (2 pole pairs), 12 commutations per rev<br>` +
    `<b>Timing: 3 Halls (120° apart) read the sector; sensorless: floating-phase back-EMF zero + 30° elec. delay</b><br>` +
    `<b>PWM: D = ${(duty * 100).toFixed(0)}% → ${(VBUS * duty).toFixed(1)} V average</b> · copper loss = ${(cur * cur * RES).toFixed(2)} W · η = ${eff.toFixed(0)}% (small BLDC typ. 85–95%)`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elLoad.addEventListener('input', () => { loadNm = +elLoad.value / 1000; syncSliders(); updateFormula(); });
elCmd.addEventListener('input', () => { cmdRpm = +elCmd.value; syncSliders(); updateFormula(); });
btnStep.addEventListener('click', () => {
  auto = false;
  syncBtns();
  stepIdx = stepIdx % 6 + 1;
  stepPhys = stepIdx;
  flash = 1;
  notify(`单步换相 → 第 ${stepIdx} 步(${STEP_TXT[stepIdx - 1]}):磁场跳进 60°,转子被牵引跟进`, `manual step → #${stepIdx} (${STEP_TXT[stepIdx - 1]}): the field jumps 60° and pulls the rotor after it`);
  updateFormula();
});
btnRun6.addEventListener('click', () => {
  auto = true;
  syncBtns();
  notify('六步连转:控制器按转子位置自动连续换相', 'auto six-step: the controller keeps commutating from rotor position');
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglPath').addEventListener('change', e => { pathOn = e.target.checked; });
document.getElementById('tglArrow').addEventListener('change', e => { arrOn = e.target.checked; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    simT += dt;
    physStep(dt);
  }
  /* 慢放可视角度:低速忠实,高速按上限慢放(数值仍为真实值) */
  thVis += (wm / (1 + Math.abs(wm) / 3)) * dt;
  if (auto) {
    const vs = stepFromE(mod(thVis * P_PAIRS * R2D, 360));
    if (vs !== stepIdx) { stepIdx = vs; flash = 1; updateFormula(); }
  }
  if (flash > 0) flash = Math.max(0, flash - dt0 * 3.2);
  /* 转子与磁场箭头 */
  rotorG.rotation.y = -thVis;
  const fa = fieldEdeg(stepIdx) / 2 * D2R;
  fieldArr.rotation.y = -fa;
  fieldArr.visible = arrOn;
  rotArrow.visible = arrOn;
  lblField.position.set(Math.cos(fa) * 2.75, 0.62, Math.sin(fa) * 2.75);
  /* 电流路径 / 线圈 / FET / 霍尔 */
  for (let s = 1; s <= 6; s++) paths[s - 1].visible = pathOn && s === stepIdx;
  pathM.opacity = clamp(0.5 + 0.2 * Math.sin(simT * 6) + flash * 0.45, 0, 1);
  const amp = clamp(Math.abs(I) / 1.2, 0.15, 1.2);
  for (let k = 0; k < 6; k++) coilM[k].emissiveIntensity = Math.abs(CUR[stepIdx - 1][PHC[k]]) * amp * (0.55 + 0.25 * Math.sin(simT * 9 + k));
  const hiF = SEQ[stepIdx - 1][0], loF = SEQ[stepIdx - 1][1] + 3;
  for (let f = 0; f < 6; f++) fetM[f].emissiveIntensity = (f === hiF || f === loF) ? Math.min(1.6, 0.9 + flash) : 0;
  for (let h = 0; h < 3; h++) {
    const act = Math.sin(fieldEdeg(stepIdx) * D2R - HALL_A[h] * 2) > 0 ? 0.9 : 0.04;
    hallM[h].emissiveIntensity += (act - hallM[h].emissiveIntensity) * Math.min(1, dt0 * 12);
  }
  starM.emissiveIntensity = 0.15 + flash * 2.2;
  /* 采样示波曲线 */
  if (dt > 0) {
    const eDeg = mod(thM * P_PAIRS * R2D, 360);
    samples.push({ t: simT, a: I * trap(eDeg, TRAP_OFF[0]), b: I * trap(eDeg, TRAP_OFF[1]), c: I * trap(eDeg, TRAP_OFF[2]), m: markFlag });
    markFlag = 0;
    while (samples.length && samples[0].t < simT - 0.5) samples.shift();
  }
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
