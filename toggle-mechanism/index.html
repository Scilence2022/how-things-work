<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>肘杆增力机构 · 近死点力放大趋于无穷</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.big{color:#74c0fc}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="labels"></div>
<div id="title">
  <h1 data-zh="肘杆增力机构 · 近死点力放大趋于无穷" data-en="Toggle Mechanism · Force → ∞ Near Dead Center">肘杆增力机构 · 近死点力放大趋于无穷</h1>
  <div class="sub" data-zh="两杆折叠角 θ → 0°：F输出/F输入 = 1/(2sinθ)；θ=5° 倍增 5.7×，θ→0° 趋于无穷；冲床夹具用此原理实现「小力锁死」· 拖动旋转 / 空格运行/暂停" data-en="Two links at angle θ: F_out/F_in = 1/(2sinθ); θ=5° gives 5.7×, θ→0° gives ∞; presses and clamps exploit this geometry · drag to orbit / Space = run/pause">两杆折叠角 θ → 0°：F输出/F输入 = 1/(2sinθ)；θ=5° 倍增 5.7×，θ→0° 趋于无穷；冲床夹具用此原理实现「小力锁死」· 拖动旋转 / 空格运行/暂停</div>

  <div id="actions">
    <button class="abtn" id="btnPress" data-zh="压下夹紧" data-en="Press &amp; Clamp">压下夹紧</button>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const D2R=Math.PI/180, R2D=180/Math.PI;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(0,4,18);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=50;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const hemi=new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5); scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff2dd,1.1); key.position.set(6,10,7);
key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-7,5,-5); scene.add(fill);

/* materials */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.9});
const frameM=new THREE.MeshStandardMaterial({color:0x3a4450,roughness:0.4,metalness:0.7});
const link1M=new THREE.MeshStandardMaterial({color:0x7b9cba,roughness:0.3,metalness:0.75});
const link2M=new THREE.MeshStandardMaterial({color:0x5a7e9c,roughness:0.32,metalness:0.72});
const driverM=new THREE.MeshStandardMaterial({color:0x9ab8cf,roughness:0.35,metalness:0.65});
const anvilM=new THREE.MeshStandardMaterial({color:0x2c3540,roughness:0.6,metalness:0.5});
const workM=new THREE.MeshStandardMaterial({color:0xd4a843,roughness:0.4,metalness:0.3});
const pivotM=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xff8c00,emissiveIntensity:0.4,roughness:0.25,metalness:0.8});
const finM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff2020,emissiveIntensity:0.7,roughness:0.2});
const foutM=new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1971c2,emissiveIntensity:0.8,roughness:0.2});
const thetaArcM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xff8c00,emissiveIntensity:0.6,roughness:0.3,transparent:true,opacity:0.9});

/* ---- scene geometry ---- */
const LINK_LEN=2.5, LINK_R=0.12, PIN_R=0.15, LINK_W=0.28;
const ground=new THREE.Mesh(new THREE.BoxGeometry(18,0.25,6),groundM);
ground.position.y=-4.5; ground.receiveShadow=true; scene.add(ground);

/* frame: fixed top pivot */
const frameTop=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.6,1.0),frameM);
frameTop.position.set(0,3.8,0); frameTop.castShadow=true; scene.add(frameTop);

/* pin at top */
const pinTop=new THREE.Mesh(new THREE.CylinderGeometry(PIN_R,PIN_R,LINK_W*1.5,16),pivotM);
pinTop.rotation.z=Math.PI/2; pinTop.position.set(0,3.8,0); scene.add(pinTop);

/* link 1 (upper) and link 2 (lower) */
function makeLink(len,mat){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(LINK_R,LINK_R,len,14),mat);
  body.castShadow=true;
  g.add(body);
  const p0=new THREE.Mesh(new THREE.CylinderGeometry(PIN_R*1.1,PIN_R*1.1,LINK_W*1.4,14),pivotM);
  p0.rotation.z=Math.PI/2; p0.position.y=len/2; g.add(p0);
  const p1=new THREE.Mesh(new THREE.CylinderGeometry(PIN_R*1.1,PIN_R*1.1,LINK_W*1.4,14),pivotM);
  p1.rotation.z=Math.PI/2; p1.position.y=-len/2; g.add(p1);
  return g;
}
const link1G=makeLink(LINK_LEN,link1M);
const link2G=makeLink(LINK_LEN,link2M);
scene.add(link1G,link2G);

/* driver slider (horizontal actuator) */
const driverG=new THREE.Group();
const driverBar=new THREE.Mesh(new THREE.CylinderGeometry(LINK_R*0.8,LINK_R*0.8,3.5,12),driverM);
driverBar.rotation.z=Math.PI/2; driverG.add(driverBar);
const driverHead=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.4,0.7),driverM);
driverG.add(driverHead);
scene.add(driverG);

/* anvil (fixed surface) */
const anvil=new THREE.Mesh(new THREE.BoxGeometry(3.5,0.35,1.2),anvilM);
anvil.position.set(0,-4.0,0); anvil.castShadow=true; anvil.receiveShadow=true; scene.add(anvil);

/* workpiece */
const workpiece=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.35,0.9),workM);
workpiece.position.set(0,-3.65,0); workpiece.castShadow=true; scene.add(workpiece);

/* output force arrow (pointing down) */
const foutArrow=new THREE.Group(); scene.add(foutArrow);
const foutShaft=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1,8),foutM);
foutShaft.position.y=-0.5; foutArrow.add(foutShaft);
const foutTip=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.28,8),foutM);
foutTip.position.y=-1.15; foutArrow.add(foutTip);

/* input force arrow (horizontal) */
const finArrow=new THREE.Group(); scene.add(finArrow);
const finShaft=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.8,8),finM);
finShaft.rotation.z=Math.PI/2; finShaft.position.x=0.4; finArrow.add(finShaft);
const finTip=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.24,8),finM);
finTip.rotation.z=-Math.PI/2; finTip.position.x=0.9; finArrow.add(finTip);

/* theta angle arc */
const arcPts=[];
for(let i=0;i<=32;i++){const a=-Math.PI/2+i/32*Math.PI/6; arcPts.push(new THREE.Vector3(Math.cos(a)*0.7,Math.sin(a)*0.7,0));}
const thetaArc=new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcPts),new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.8}));
scene.add(thetaArc);

/* ---- labels ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('固定支点','Fixed pivot'),new THREE.Vector3(0.9,3.8,0),'b');
addLabel(()=>L('上连杆','Upper link'),new THREE.Vector3(1.8,1.8,0),'b');
addLabel(()=>L('下连杆','Lower link'),new THREE.Vector3(1.8,-1.2,0),'g');
const lblAmp=addLabel(()=>L(`放大倍数 = ${ampDisp}×`,`Amplification = ${ampDisp}×`),new THREE.Vector3(-3,0,0),'o');
const lblFin=addLabel(()=>L('驱动力 F_in →','Drive F_in →'),new THREE.Vector3(0,0,0),'r');
const lblFout=addLabel(()=>L('夹紧力 F_out ↓','Clamp F_out ↓'),new THREE.Vector3(0.8,-2.5,0),'b');
const lblTheta=addLabel(()=>L(`θ = ${thetaDeg.toFixed(1)}°`,`θ = ${thetaDeg.toFixed(1)}°`),new THREE.Vector3(0.9,-0.2,0),'o');

/* ---- state ---- */
let playing=true, thetaDeg=20, thetaTarget=20, finForce=100;
let autoMode=false, slowMode=false, pressing=false, releasing=false;
let ampDisp='—', labelsOn=true, simT=0;

/* ---- geometry update ---- */
function updateMechanism(){
  const th=thetaDeg*D2R;
  // top fixed pivot at (0, 3.8)
  // knee joint at (0, 3.8 - L1*cos(th/2)*2) wait... simplify:
  // layout: top pivot Y=3.8; link1 goes down-left at angle (PI/2+th) from vertical
  // link2 goes down-right at angle (PI/2-th) from vertical
  // knee is at Y = 3.8 - LINK_LEN*cos(th), X = 0
  // (for symmetric toggle: both links hinge at knee, driver pushes knee horizontally)
  const kY=3.8-LINK_LEN*Math.cos(th);
  const kX=0;
  const outY=kY-LINK_LEN*Math.cos(th);
  // link1: from top (0,3.8) to knee (kX,kY)
  // midpoint of link1
  const l1mx=(0+kX)/2, l1my=(3.8+kY)/2;
  const l1ang=Math.atan2(kY-3.8,kX-0); // angle of link1 axis
  link1G.position.set(l1mx,l1my,0);
  link1G.rotation.z=l1ang;
  // link2: from knee (kX,kY) to output (0, outY)
  const l2mx=(kX+0)/2, l2my=(kY+outY)/2;
  const l2ang=Math.atan2(outY-kY,0-kX);
  link2G.position.set(l2mx,l2my,0);
  link2G.rotation.z=l2ang;
  // driver slider at knee position
  driverG.position.set(kX-2.5,kY,0);
  finArrow.position.set(kX-1.2,kY,0.3);
  // output force arrow at output end
  foutArrow.position.set(0,outY,0.3);
  const amp=1/(2*Math.sin(Math.max(th,0.01)));
  const scaleOut=clamp(amp/5,0.4,4.5);
  foutArrow.scale.set(scaleOut,scaleOut,scaleOut);
  finArrow.scale.set(1,1,1);
  // theta arc at knee
  thetaArc.position.set(kX,kY,0.4);
  // workpiece compression: squeeze when outY approaches anvil top
  const anvilTop=-3.825+0.35/2;
  const gap=outY-anvilTop-0.35;
  if(gap<0){
    workpiece.scale.y=Math.max(0.3,1+gap*0.5);
    workpiece.position.y=anvilTop+workpiece.scale.y*0.175;
  } else {
    workpiece.scale.y=1; workpiece.position.y=-3.65;
  }
  // label positions
  lblFin.position.set(kX-1.8,kY+0.4,0);
  lblFout.position.set(0.8,outY-0.6,0);
  lblTheta.position.set(kX+0.8,kY-0.3,0);
  const dispAmp=amp>999?'∞':amp.toFixed(1);
  ampDisp=dispAmp;
  lblAmp.element.textContent=L(`放大倍数 = ${dispAmp}×`,`Amplification = ${dispAmp}×`);
  lblTheta.element.textContent=L(`θ = ${thetaDeg.toFixed(1)}°`,`θ = ${thetaDeg.toFixed(1)}°`);
}

function updateStats(){
  const th=thetaDeg*D2R;
  const amp=1/(2*Math.sin(Math.max(th,0.001)));
  const fout=finForce*amp;
  document.getElementById('stFin').innerHTML=finForce.toFixed(0)+'<small> N</small>';
  const foutDisp=fout>99999?'∞':fout.toFixed(0);
  document.getElementById('stFout').innerHTML=foutDisp+'<small> N</small>';
  const ampDisp2=amp>999?'∞':amp.toFixed(1);
  document.getElementById('stAmp').textContent=ampDisp2+'×';
  document.getElementById('stTheta').innerHTML=thetaDeg.toFixed(1)+'<small> °</small>';
  const ampEl=document.getElementById('stAmp');
  ampEl.className='v '+(amp>10?'big':amp>5?'warn':'');
}

/* ---- steps ---- */
const STEPS=[
  {zh:'肘杆原理：两杆折叠成角 θ，小横向力经几何放大成大纵向力',en:'Two links at angle θ: small side force becomes large clamping force'},
  {zh:'放大倍数：F输出/F输入 = 1/(2sinθ)，θ越小倍数越大',en:'Amplification = 1/(2sinθ) — smaller θ = more force'},
  {zh:'死点：θ=0° 时理论无穷大，实际受摩擦与弹性变形限制',en:'Dead center: θ=0° → ∞ (limited by friction/deformation)'},
  {zh:'冲床应用：曲柄旋转带动肘杆，工件被冲出前恰好过死点',en:'Press: crank drives toggle through dead center at maximum force'},
  {zh:'自锁特性：过死点后夹具自锁，松开需反向驱动',en:'Self-lock past dead center — needs reverse drive to release'},
  {zh:'效率代价：力增大的代价是行程缩小（功守恒）',en:'Trade-off: force amplified, stroke shortened (power conserved)'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i; syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- theme / lang ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  frameM.color.setHex(dark?0x3a4450:0x7d8b99);
  link1M.color.setHex(dark?0x7b9cba:0x3d6080);
  link2M.color.setHex(dark?0x5a7e9c:0x2e5570);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); updateStats();
}

/* ---- UI events ---- */
document.getElementById('btnPress').addEventListener('click',()=>{pressing=true;releasing=false;slowMode=false;autoMode=false;document.getElementById('btnAuto').classList.remove('on');});
document.getElementById('btnRelease').addEventListener('click',()=>{releasing=true;pressing=false;slowMode=false;autoMode=false;document.getElementById('btnAuto').classList.remove('on');});
document.getElementById('btnSlow').addEventListener('click',()=>{slowMode=!slowMode;pressing=true;releasing=false;autoMode=false;document.getElementById('btnSlow').classList.toggle('on',slowMode);document.getElementById('btnAuto').classList.remove('on');});
document.getElementById('btnAuto').addEventListener('click',()=>{autoMode=!autoMode;document.getElementById('btnAuto').classList.toggle('on',autoMode);pressing=false;releasing=false;});
document.getElementById('sTheta').addEventListener('input',e=>{thetaDeg=+e.target.value;thetaTarget=thetaDeg;document.getElementById('sThetaVal').textContent=thetaDeg+'°';updateMechanism();updateStats();});
document.getElementById('sFin').addEventListener('input',e=>{finForce=+e.target.value;document.getElementById('sFinVal').textContent=finForce+' N';updateStats();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- main loop ---- */
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    const speed=slowMode?3:18;
    if(autoMode){
      // oscillate theta between 3 and 40 degrees
      thetaTarget=20+17*Math.sin(simT*0.6);
      const diff=thetaTarget-thetaDeg;
      thetaDeg=clamp(thetaDeg+diff*dt*2.5,2,45);
      document.getElementById('sTheta').value=thetaDeg.toFixed(0);
      document.getElementById('sThetaVal').textContent=thetaDeg.toFixed(0)+'°';
    } else if(pressing){
      thetaDeg=Math.max(2,thetaDeg-speed*dt);
      thetaTarget=thetaDeg;
      document.getElementById('sTheta').value=thetaDeg.toFixed(0);
      document.getElementById('sThetaVal').textContent=thetaDeg.toFixed(0)+'°';
      if(thetaDeg<=2) pressing=false;
    } else if(releasing){
      thetaDeg=Math.min(45,thetaDeg+speed*dt);
      thetaTarget=thetaDeg;
      document.getElementById('sTheta').value=thetaDeg.toFixed(0);
      document.getElementById('sThetaVal').textContent=thetaDeg.toFixed(0)+'°';
      if(thetaDeg>=45) releasing=false;
    }
    updateMechanism();
  }
  acc+=dt; if(acc>0.1){acc=0; updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis(); if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme(); applyLang(); buildSteps(); updateMechanism(); updateStats(); start();
</script>
</body>
