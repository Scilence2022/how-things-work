<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>液晶与 LCD · 电控光闸</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(176,118,31,.9); color: #9c6f00; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.p { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.r { color: #d0bfff; border-color: rgba(177,151,252,.7); }
  .chip.l { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(255,209,102,.26); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="液晶与 LCD:电压控制的百叶窗" data-en="Liquid Crystals &amp; LCD: a voltage-driven blind">液晶与 LCD:电压控制的百叶窗</h1>
  <div class="sub" data-zh="90° 扭曲的向列相把偏振面拧着转,光穿过正交偏振片;加电压棒棒立正、拧不成了,光被锁死——每个像素就是一扇这样的百叶窗 · 空格播放/暂停" data-en="A 90°-twisted nematic rotates the polarization plane so light slips through crossed polarizers; apply voltage, the rods stand up, the twist dies, light is locked out — every pixel is one such blind · Space = play/pause">90° 扭曲的向列相把偏振面拧着转,光穿过正交偏振片;加电压棒棒立正、拧不成了,光被锁死——每个像素就是一扇这样的百叶窗 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="电压" data-en="voltage">电压</span><span class="v g" id="stV">0.0<small>V</small></span>
  <span class="k" data-zh="扭曲角" data-en="twist angle">扭曲角</span><span class="v" id="stTw">90<small>°</small></span>
  <span class="k" data-zh="透射率" data-en="transmission">透射率</span><span class="v" id="stT">100<small>%</small></span>
  <span class="k" data-zh="像素状态" data-en="pixel">像素状态</span><span class="v" id="stPix" style="font-size:14px">亮</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.p" data-zh="偏振片(栅栏方向箭头)" data-en="polarizer (axis arrow)">偏振片(栅栏方向箭头)</span>
    <span class="chip.r" data-zh="液晶棒(向列相)" data-en="LC rods (nematic)">液晶棒(向列相)</span>
    <span class="chip.l" data-zh="光子(拖偏振方向标记)" data-en="photons (with polarization tags)">光子(拖偏振方向标记)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnV" data-zh="开/关像素电压" data-en="toggle pixel voltage">开/关像素电压</button>
  </div>
  <div class="row"><label data-zh="电压细调" data-en="fine voltage">电压细调</label><input id="volt" type="range" min="0" max="100" step="1" value="0"><span class="val" id="voltVal">0.0V</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../polarization/" data-zh="偏振:这一切的地基" data-en="polarization: the foundation">偏振:这一切的地基</a>
    <a href="../crystal-growth/" data-zh="固体的另一种秩序" data-en="another order of solids">固体的另一种秩序</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('液晶与 LCD', 'Liquid Crystals & LCD');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.8, 1.7, 5.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 15;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  rod: new THREE.MeshStandardMaterial({ color: 0xb197fc, roughness: 0.3, metalness: 0.15,
    emissive: 0xb197fc, emissiveIntensity: 0.22, transparent: true, opacity: 0.95 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.10,
    roughness: 0.12, metalness: 0, side: THREE.DoubleSide, depthWrite: false }),
  metal: mat(0x8a93a3, { metalness: 0.6, roughness: 0.35 }),
  pol1: new THREE.MeshPhysicalMaterial({ color: 0x63e6be, transparent: true, opacity: 0.30,
    roughness: 0.25, side: THREE.DoubleSide, depthWrite: false }),
  pol2: new THREE.MeshPhysicalMaterial({ color: 0xffa8a8, transparent: true, opacity: 0.30,
    roughness: 0.25, side: THREE.DoubleSide, depthWrite: false }),
  photon: null,
};

/* 光轴:z 轴从左到右 */
const zP1 = -2.0, zCell0 = -0.9, zCell1 = 0.9, zP2 = 2.0, zScr = 2.8;
const CY = 1.0;

/* 偏振片(半透明板 + 栅栏条纹) */
function mkPolarizer(z, colorMat, axisDeg) {
  const g = new THREE.Group();
  const plate = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.6, 0.05), colorMat);
  g.add(plate);
  /* 栅栏线条:沿偏振轴方向 */
  const lineGeo = new THREE.BoxGeometry(0.025, 2.5, 0.07);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 });
  const im = new THREE.InstancedMesh(lineGeo, lineMat, 13);
  const m4 = new THREE.Matrix4();
  for (let i = 0; i < 13; i++) {
    m4.setPosition(-1.2 + i * 0.2, 0, 0);
    im.setMatrixAt(i, m4);
  }
  g.add(im);
  g.position.set(0, CY, z);
  g.rotation.z = axisDeg * Math.PI / 180;    // 轴方向:0°=竖直条纹?条纹画成竖线,旋转 group 使其沿轴
  scene.add(g);
  return g;
}
/* P1:轴竖直(允许竖直偏振通过) P2:轴水平 */
mkPolarizer(zP1, M.pol1, 0);
mkPolarizer(zP2, M.pol2, 90);

/* 液晶盒玻璃 */
const cellGlass = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.4, zCell1 - zCell0), M.glass);
cellGlass.position.set(0, CY, 0);
scene.add(cellGlass);

/* 屏幕像素板 */
const screen = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.9 }));
screen.position.set(0, CY, zScr);
scene.add(screen);
const scrFrame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.4, 2.4)),
  new THREE.LineBasicMaterial({ color: 0x8a93a3 }));
screen.add(scrFrame);

/* ================= 液晶棒 ================= */
const RODS = 96;
const rodIM = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.028, 0.34, 4, 8), M.rod, RODS);
scene.add(rodIM);
const rodSlots = [];
{
  let k = 0;
  for (let ix = 0; ix < 8; ix++) for (let iy = 0; iy < 6; iy++) for (let iz = 0; iz < 2; iz++) {
    if (k >= RODS) break;
    rodSlots.push({
      x: -1.05 + ix * 0.3 + (iz ? 0.15 : 0),
      y: CY - 0.75 + iy * 0.3 + (iz ? 0.15 : 0),
      zf: (iz + 0.5) / 2,      // 0..1 盒内深度
    });
    k++;
  }
}
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), one = new THREE.Vector3(1, 1, 1);
function updateRods(twistDeg, phase) {
  const twist = twistDeg * Math.PI / 180;
  for (let i = 0; i < RODS; i++) {
    const s = rodSlots[i];
    const jitter = 0.12 * Math.sin(phase * 2 + i * 2.1);
    const ang = twist * s.zf;
    e.set(0, 0, ang);
    q.setFromEuler(e);
    m4.compose(new THREE.Vector3(s.x + jitter * 0.3, s.y + jitter, zCell0 + s.zf * (zCell1 - zCell0)),
      q, one);
    rodIM.setMatrixAt(i, m4);
  }
  rodIM.instanceMatrix.needsUpdate = true;
}

/* ================= 光子 ================= */
const PH_N = 26;
const photons = [];
for (let i = 0; i < PH_N; i++) {
  const g = new THREE.Group();
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xfff3bf, blending: THREE.AdditiveBlending, transparent: true }));
  g.add(dot);
  /* 偏振方向标记:小棒(白色) */
  const tag = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.02, 0.02),
    new THREE.MeshBasicMaterial({ color: 0xffffff }));
  g.add(tag);
  g.visible = false;
  scene.add(g);
  photons.push({ g, tag, t: 0, alive: false, y: 0, x: 0, passed: false });
}

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let volt = 0;                 // 0..1 (0-6V)
let tSim = 0;
const VSAT = 0.72;            // 饱和电压(归一)

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblP1 = addLabel(() => L('起偏器 P1:轴竖直,只放竖直偏振', 'polarizer P1: axis vertical — passes vertical'),
  new THREE.Vector3(0, 2.55, zP1), 'g');
const lblCell = addLabel(() => volt < VSAT
  ? L('液晶盒:分子沿 90° 螺旋排队,像旋转楼梯——偏振面被「拧」着跟转(绝热跟随)', 
      'LC cell: rods queue in a 90° spiral, like a staircase — the polarization is twisted along (adiabatic following)')
  : L('电压超过阈值:分子全部立正指向电极,螺旋消失——偏振面不再被旋转',
      'above threshold: rods all stand up along the field, the spiral dies — polarization no longer rotates'),
  new THREE.Vector3(0, 2.55, 0), volt < VSAT ? 'b' : 'st');
const lblP2 = addLabel(() => L('检偏器 P2:轴水平(与 P1 正交)', 'analyzer P2: axis horizontal (crossed with P1)'),
  new THREE.Vector3(0, 2.55, zP2), 'g');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '两片正交偏振片=黑暗', be: 'Two crossed polarizers = darkness',
    d: 'P1 只放竖直偏振,P2 轴转 90° 只放水平——竖直光到 P2 无一幸免。单放这两片,背后永远是黑的。',
    de: 'P1 passes vertical; P2 (rotated 90°) passes horizontal — vertical light dies at P2. Alone, the screen stays black.',
    act: () => setVolt(1) },
  { b: '扭曲向列相:旋光楼梯', be: 'Twisted nematic: the spiral staircase',
    d: '液晶盒里分子被玻璃表面的沟槽「扶着」逐层转向,90° 螺旋排开。偏振面跟着分子走(绝热跟随)——进盒时竖直,出盒时已被拧成水平!',
    de: 'Surface grooves coax the rods layer by layer through 90°. The polarization follows the molecules — vertical in, horizontal out!',
    act: () => setVolt(0) },
  { b: '亮态:光被楼梯送出去', be: 'Bright state: the staircase delivers',
    d: '拧成水平的偏振恰好对上 P2 的轴——光通过,像素亮。这是笔记本屏幕的「白」。',
    de: 'The rotated polarization now matches P2\'s axis — light passes, the pixel glows. This is a laptop screen\'s "white".',
    act: () => setVolt(0.1) },
  { b: '加电压:百叶窗合拢', be: 'Apply voltage: the blind snaps shut',
    d: '电压超过阈值(~1V),棒是极性分子,集体转向电场立正——螺旋消失,偏振不再被拧,竖直光在 P2 全军覆没——像素变黑。',
    de: 'Past threshold the polar rods all align with the field; the twist dies, the polarization stays vertical, and P2 blocks everything — the pixel goes black.',
    act: () => setVolt(0.85) },
  { b: '灰阶:电压即亮度', be: 'Gray scale: voltage = brightness',
    d: '中间电压拧一半,部分透过——256 级灰阶由此而来。每个像素配一片薄膜晶体管(TFT)单独开关,百万扇百叶窗织成一块屏。',
    de: 'Intermediate voltages half-twist the cell for partial transmission — that is your 256 grays. One thin-film transistor per pixel flips a million blinds into one display.',
    act: () => setVolt(0.45) },
];
function stepIndex() {
  if (volt > 0.7) return 3;
  if (volt > 0.25 && volt < 0.7) return 4;
  if (volt < 0.05) return 1;
  return 2;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 电压与光学 ================= */
function twistNow() {
  /* 扭曲角:低于阈值 90°;高于阈值平滑压到 0 */
  const t = clamp((volt - VSAT * 0.4) / (VSAT - VSAT * 0.4), 0, 1);
  return 90 * (1 - t);
}
function transmission() {
  /* 绝热跟随:T = sin²(出盒偏振角),P2 轴水平=90° */
  const th = twistNow() * Math.PI / 180;
  return Math.pow(Math.sin(th), 2);
}
function setVolt(f) {
  volt = clamp(f, 0, 1);
  document.getElementById('volt').value = volt * 100;
  document.getElementById('voltVal').textContent = (volt * 6).toFixed(1) + 'V';
  document.getElementById('btnV').classList.toggle('on', volt > 0.5);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
document.getElementById('volt').addEventListener('input', e => setVolt(parseInt(e.target.value) / 100));
document.getElementById('btnV').addEventListener('click', () => setVolt(volt > 0.5 ? 0 : 0.9));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let spawnCD = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  const tw = twistNow();
  const T = transmission();
  updateRods(tw, tSim);

  /* 光子发射 */
  spawnCD -= dts;
  if (spawnCD <= 0) {
    spawnCD = 0.16;
    const ph = photons.find(p => !p.alive);
    if (ph) {
      ph.alive = true;
      ph.t = 0;
      ph.x = (Math.random() - 0.5) * 1.6;
      ph.y = CY + (Math.random() - 0.5) * 1.6;
      ph.passed = false;
      ph.g.visible = true;
      ph.g.position.set(ph.x, ph.y, zP1 - 0.4);
      ph.tag.rotation.z = 0;      // 竖直偏振?标记棒初始竖直
      ph.tag.rotation.z = Math.PI / 2;   // 用与 z 轴的横向角表示偏振角(视觉:白色小棒)
    }
  }
  /* 光子行进:P1 → 盒(拧) → P2(检) → 屏 */
  for (const ph of photons) {
    if (!ph.alive) continue;
    ph.t += dts * 1.6;
    const z = zP1 - 0.4 + ph.t * (zScr - zP1 + 0.8);
    ph.g.position.set(ph.x, ph.y, z);
    /* 盒内:偏振标记跟 twist(z) 旋转 */
    if (z > zCell0 && z < zCell1) {
      const f = clamp((z - zCell0) / (zCell1 - zCell0), 0, 1);
      ph.tag.rotation.z = Math.PI / 2 + f * tw * Math.PI / 180;
    } else if (z >= zCell1) {
      ph.tag.rotation.z = Math.PI / 2 + tw * Math.PI / 180;
    }
    /* P1 过滤:所有光子都设定为竖直(通过) */
    /* P2 检偏:出盒偏振角 tw;P2 轴水平(90°):通过幅度 sin²(tw) */
    if (z >= zP2 && !ph.passed) {
      ph.passed = true;
      if (Math.random() > T) {
        ph.alive = false;
        ph.g.visible = false;
      } else {
        ph.g.children[0].material.color.setHex(0xffffff);
      }
    }
    if (z > zScr) {
      ph.alive = false;
      ph.g.visible = false;
    }
  }
  /* 屏幕亮度 */
  const lum = Math.round(T * 255);
  screen.material.color.setRGB(lum / 255, lum / 255, lum / 255 * 0.98);
  screen.material.opacity = 0.25 + T * 0.65;

  document.getElementById('stV').innerHTML = (volt * 6).toFixed(1) + '<small>V</small>';
  document.getElementById('stTw').innerHTML = tw.toFixed(0) + '<small>°</small>';
  document.getElementById('stT').innerHTML = (T * 100).toFixed(0) + '<small>%</small>';
  document.getElementById('stPix').textContent = T > 0.6 ? L('亮', 'ON') : T > 0.15 ? L('灰', 'gray') : L('暗', 'OFF');

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setVolt(0);
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
