<style>

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}

  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
  /* ΔxΔp 乘积条 / 原子动能表 */
  #plot{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:4;
    border:1px solid var(--panel-border);border-radius:10px;background:var(--panel);backdrop-filter:blur(6px)}
  @media(max-width:900px){#plot{display:none}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================= 物理内核 =================
   1) 单缝：缝内波函数≈宽 a 的矩形 → Δx=a/√12；远场第一极小 sinθ₁=λ/a，
      光子动量 p=h/λ，横向弥散粗估 Δp≈p·sinθ₁=h/a → ΔxΔp≈h/√12≈1.8ħ ≥ ħ/2。
   2) 高斯波包：ψ∝exp(−x²/4σ²) 是最小不确定态，Δx=σ、Δp=ħ/2σ，乘积恒=ħ/2；
      自由电子展宽 τ=2mσ₀²/ħ（σ₀=1nm → τ≈17fs，Δx 真实按此计算）。
   3) 限域估计：压到 Δx=r 需要 p~ħ/r，E_kin≈ħ²/2m·(1/r)²；库仑 E_pot=−1.44eV·nm/r；
      总能量在 r=a₀=52.9pm 处最低（−13.6eV）→ 原子不塌缩。全部为标准量子力学结论。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const HBAR=1.0546e-34,M_E=9.109e-31,A0=52.9;      // ħ、电子质量、玻尔半径 pm
let mode=0;                                        // 0=单缝 1=高斯 2=原子
let aNM=1200, sig0=1.0, rPM=200, speedK=1.0;
let phase=0, gT=0, playing=true, labelsOn=true;    // 相位、高斯演化时间(fs)
const LW=0.35, CX=-3.5, SCREEN_X=7, Ldist=10.5;    // 世界波长、缝位、屏位、缝屏距
const aw=()=>clamp(aNM/300,0.5,4.5);               // 缝宽→世界单位
const th1=()=>Math.asin(Math.min(1,LW/aw()));      // 第一极小半角

const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,70);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0,1.2,17);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.5,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=5; controls.maxDistance=45;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,0.9); key.position.set(4,8,9); scene.add(key);

const gSlit=new THREE.Group(), gGauss=new THREE.Group(), gAtom=new THREE.Group();
scene.add(gSlit,gGauss,gAtom);

/* ---- 单缝场景 ---- */
const waveM=new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.5});
const waves=[];
for(let i=0;i<13;i++){
  const w=new THREE.Mesh(new THREE.BoxGeometry(0.03,9.4,0.05),waveM);
  gSlit.add(w); waves.push(w);
}
const barM=new THREE.MeshStandardMaterial({color:0x39424d,roughness:0.5,metalness:0.4});
const barTop=new THREE.Mesh(new THREE.BoxGeometry(0.5,1,0.7),barM);
const barBot=new THREE.Mesh(new THREE.BoxGeometry(0.5,1,0.7),barM);
gSlit.add(barTop,barBot);
const edgeM=new THREE.MeshBasicMaterial({color:0xffa94d});
const eTop=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.14,0.8),edgeM);
const eBot=eTop.clone(); gSlit.add(eTop,eBot);
const dashM=new THREE.LineDashedMaterial({color:0xffa94d,dashSize:0.22,gapSize:0.14,transparent:true,opacity:0.75});
function makeBeam(){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));const l=new THREE.Line(g,dashM);gSlit.add(l);return l;}
const beam1=makeBeam(),beam2=makeBeam();
/* 惠更斯弧：3 道弧逐帧按半径重画 */
const arcM=new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.55});
const arcs=[];
for(let i=0;i<3;i++){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(41*3),3));
  const l=new THREE.Line(g,arcM); gSlit.add(l); arcs.push(l);
}
/* 屏 + 强度棒 + 光子点 */
const screen=new THREE.Mesh(new THREE.BoxGeometry(0.18,9.6,0.5),new THREE.MeshStandardMaterial({color:0x2c333c,roughness:0.6}));
screen.position.x=SCREEN_X; gSlit.add(screen);
const NB=41, ibars=[];
const ibarM=new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.85});
for(let i=0;i<NB;i++){
  const b=new THREE.Mesh(new THREE.BoxGeometry(1,0.15,0.15),ibarM);
  b.geometry.translate(-0.5,0,0);
  b.position.set(SCREEN_X-0.12,-4.5+9*i/(NB-1),0);
  gSlit.add(b); ibars.push(b);
}
const PMAX=260, pPos=new Float32Array(PMAX*3);
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const photons=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xffe066,size:0.14,transparent:true,opacity:0.9}));
gSlit.add(photons);
let pCount=0,pIdx=0,pAcc=0;
function addPhoton(){
  let y=0;
  for(let t=0;t<24;t++){ // 按强度分布拒绝采样
    y=(Math.random()*2-1)*4.5;
    const s=y/Math.hypot(y,Ldist), x=Math.PI*aw()/LW*s;
    if(Math.random()<=Math.pow(Math.sin(x)/Math.max(1e-6,x),2))break;
  }
  pPos[pIdx*3]=SCREEN_X-0.05;pPos[pIdx*3+1]=y;pPos[pIdx*3+2]=0.31;
  pIdx=(pIdx+1)%PMAX;pCount=Math.min(PMAX,pCount+1);
}
function updateSlitGeom(){
  const g=aw()/2,B=5.2;
  barTop.scale.y=B-g; barTop.position.y=(B+g)/2;
  barBot.scale.y=B-g; barBot.position.y=-(B+g)/2;
  eTop.position.set(CX,g,0); eBot.position.set(CX,-g,0);
  [[beam1,1],[beam2,-1]].forEach(([bm,s])=>{
    const p=bm.geometry.attributes.position.array;
    p[0]=CX;p[1]=s*g;p[2]=0; p[3]=SCREEN_X;p[4]=s*(g+Ldist*Math.tan(th1()));p[5]=0;
    bm.geometry.attributes.position.needsUpdate=true;
    bm.geometry.computeBoundingSphere(); bm.computeLineDistances();
  });
  /* 强度棒 sinc²(π a sinθ/λ) */
  ibars.forEach(b=>{
    const y=b.position.y,s=y/Math.hypot(y,Ldist),x=Math.PI*aw()/LW*s;
    const I=Math.pow(Math.sin(x)/Math.max(1e-6,x),2);
    b.scale.x=Math.max(0.02,I*4.6);
  });
}

/* ---- 高斯波包场景 ---- */
const GN=140,gx=[];
for(let i=0;i<GN;i++)gx.push(-8+16*i/(GN-1));
const psiM=new THREE.LineBasicMaterial({color:0xffa94d});
const envM=new THREE.LineBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.7});
const momM=new THREE.LineBasicMaterial({color:0x74c0fc});
function makeCurve(n,mat,parent,y0){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  const l=new THREE.Line(g,mat); l.position.y=y0; parent.add(l); return l;
}
const psiLine=makeCurve(GN,psiM,gGauss,0.8);
const envT=makeCurve(GN,envM,gGauss,0.8), envB=makeCurve(GN,envM,gGauss,0.8);
const momLine=makeCurve(90,momM,gGauss,-3.2);
const axisM=new THREE.LineBasicMaterial({color:0x5b6b7d,transparent:true,opacity:0.6});
const xAxis=makeCurve(2,axisM,gGauss,0.8), pAxis=makeCurve(2,axisM,gGauss,-3.2);
{
  const p=xAxis.geometry.attributes.position.array;
  p[0]=-8;p[1]=0;p[2]=0;p[3]=8;p[4]=0;p[5]=0;
  xAxis.geometry.attributes.position.needsUpdate=true;
  const q=pAxis.geometry.attributes.position.array;
  q[0]=-8;q[1]=0;q[2]=0;q[3]=8;q[4]=0;q[5]=0;
  pAxis.geometry.attributes.position.needsUpdate=true;
}
function updateGauss(){
  const t=gT, tau=2*M_E*Math.pow(sig0*1e-9,2)/HBAR/1e-15; // fs
  const sig=sig0*Math.sqrt(1+(t/tau)*(t/tau));             // nm，真实演化
  const amp=1.05/Math.sqrt(sig), A=2*sig*sig;              // 归一化包络
  for(let i=0;i<GN;i++){
    const x=gx[i],d=x*x/A,e=Math.exp(-d);
    psiLine.geometry.attributes.position.array[i*3+1]=amp*e*Math.cos(x*12-gT*1.4);
    envT.geometry.attributes.position.array[i*3+1]=amp*e;
    envB.geometry.attributes.position.array[i*3+1]=-amp*e;
  }
  [psiLine,envT,envB].forEach(l=>l.geometry.attributes.position.needsUpdate=true);
  /* 动量空间：宽度∝1/σ₀（不随时间变） */
  const sw=0.55/sig0;
  for(let i=0;i<90;i++){
    const p=-8+16*i/89;
    momLine.geometry.attributes.position.array[i*3+1]=2.6*Math.exp(-p*p/(2*sw*sw))*0.35;
  }
  momLine.geometry.attributes.position.needsUpdate=true;
  return sig;
}

{

const ekEv=r=>13.6*Math.pow(A0/r,2);            // ħ²/2m·(1/r)²，a₀ 处恰为 13.6 eV
const epEv=r=>-1.44/(r/1000);                   // e²/4πε₀=1.44 eV·nm

/* ---- 主题/语言/步骤 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
  scene.fog.color.setHex(THEME==='dark'?0x101418:0xe9e4dc);
  refreshPlotColors();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}
const STEPS=[
 {zh:'波粒二象性的代价：粒子没有轨迹，只有波包——位置与动量天生互相制约',en:'No trajectories, only wave packets — position and momentum constrain each other'},
 {zh:'压窄波包＝叠加更多波长：Δx 越小，波长谱越宽 → Δp 越大',en:'Squeezing the packet superposes more wavelengths: small Δx → big Δp'},
 {zh:'单缝衍射就是它：缝越窄，屏上光斑越摊宽（sinθ₁=λ/a）',en:'Single-slit diffraction: narrower slit, wider fan (sinθ₁=λ/a)'},
 {zh:'高斯波包是最小不确定态：ΔxΔp=ħ/2 恰好压线；自由传播仍会展宽',en:'Gaussian = minimum-uncertainty state: product pinned at ħ/2, yet it spreads'},
 {zh:'原子不塌缩：把电子压进核尺度，动能∝1/Δx² 暴涨顶住库仑吸引',en:'Why atoms do not collapse: E_kin∝1/Δx² blows up and resists Coulomb pull'},
 {zh:'平衡点在玻尔半径 a₀=53pm：E_total 最低 → 原子有尺寸、物质有形状',en:'Minimum of E_total at a₀=53 pm → atoms have size, matter has shape'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>gotoStep(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function setMode(m){
  mode=m; gSlit.visible=m===0; gGauss.visible=m===1; gAtom.visible=m===2;
  document.getElementById('rowA').style.display=m===0?'':'none';
  document.getElementById('rowSig').style.display=m===1?'':'none';
  document.getElementById('rowR').style.display=m===2?'':'none';
  [['btnSlit',0],['btnGauss',1],['btnAtom',2]].forEach(([id,v])=>
    document.getElementById(id).classList.toggle('on',m===v));
}
function gotoStep(i){
  activeStep=i;syncSteps();
  if(i<=2)setMode(0);
  if(i===0){aNM=2000;document.getElementById('sA').value=2000;}
  if(i===1){aNM=700;document.getElementById('sA').value=700;}
  if(i===2){aNM=520;document.getElementById('sA').value=520;}
  if(i===3){setMode(1);sig0=1;document.getElementById('sSig').value=1;gT=0;playing=true;}
  if(i===4){setMode(2);rPM=300;document.getElementById('sR').value=100;}
  if(i===5){setMode(2);rPM=53;document.getElementById('sR').value=79.4;}
  if(i<=2){document.getElementById('sAVal').textContent=aNM+' nm';updateSlitGeom();}
  if(i>=4)document.getElementById('sRVal').textContent=Math.round(rPM)+' pm';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
}
function updateStats(){
  const f=(x,n=2)=>x.toFixed(n);
  if(mode===0){
    const dx=aNM/Math.sqrt(12)/1000, dp=6.626e-34/(aNM*1e-9);
    document.getElementById('stX').innerHTML=f(dx)+'<small> nm</small>';
    document.getElementById('stP').innerHTML=f(dp*1e27)+'<small> ×10⁻²⁷</small>';
    document.getElementById('stProd').innerHTML=f(dx*dp/HBAR)+'<small> ħ</small>';
    document.getElementById('stEk').textContent='—';
  }else if(mode===1){
    const tau=2*M_E*Math.pow(sig0*1e-9,2)/HBAR/1e-15;
    const dx=sig0*Math.sqrt(1+(gT/tau)*(gT/tau)), dp=HBAR/(2*sig0*1e-9);
    document.getElementById('stX').innerHTML=f(dx)+'<small> nm</small>';
    document.getElementById('stP').innerHTML=f(dp*1e25)+'<small> ×10⁻²⁵</small>';
    document.getElementById('stProd').innerHTML='0.500<small> ħ</small>';
    document.getElementById('stEk').textContent='—';
  }else{
    const dx=rPM/1000, dp=HBAR/(rPM*1e-12);
    document.getElementById('stX').innerHTML=f(dx)+'<small> nm</small>';
    document.getElementById('stP').innerHTML=f(dp*1e24)+'<small> ×10⁻²⁴</small>';
    document.getElementById('stProd').innerHTML='~1.0<small> ħ</small>';
    const ek=ekEv(rPM);
    document.getElementById('stEk').innerHTML=ek>=1000?(ek/1000).toFixed(1)+'<small> keV</small>':ek.toFixed(1)+'<small> eV</small>';
  }
}

/* ---- 乘积条 / 原子能级条（canvas） ---- */
const plot=document.getElementById('plot'),pctx=plot.getContext('2d');
let PC={};
function refreshPlotColors(){
  PC={txt:THEME==='dark'?'#9fb0c3':'#5b6b7d',acc:THEME==='dark'?'#ffa94d':'#e8590c',
      red:THEME==='dark'?'#ff6b6b':'#c92a2a',blue:THEME==='dark'?'#74c0fc':'#1864ab',
      grid:THEME==='dark'?'rgba(255,255,255,.10)':'rgba(15,25,40,.14)'};
}
function drawPlot(){
  const W=plot.width,H=plot.height;
  pctx.clearRect(0,0,W,H);
  pctx.font='11px sans-serif';
  if(mode<2){ /* Δx·Δp 乘积条，量程 0–7ħ */
    const prod=mode===0?(aNM/Math.sqrt(12)*1e-9)*(6.626e-34/(aNM*1e-9))/HBAR:0.5;
    const sc=7,bx=8,bw=W-16,by=H/2+8,bh=18;
    pctx.fillStyle=PC.grid;pctx.fillRect(bx,by,bw,bh);
    pctx.fillStyle=prod>0.52?PC.acc:PC.red;
    pctx.fillRect(bx,by,clamp(prod/sc,0,1)*bw,bh);
    const rx=bx+0.5/sc*bw; // ħ/2 红线
    pctx.strokeStyle=PC.red;pctx.lineWidth=2;
    pctx.beginPath();pctx.moveTo(rx,by-6);pctx.lineTo(rx,by+bh+4);pctx.stroke();
    pctx.lineWidth=1;pctx.fillStyle=PC.txt;
    pctx.fillText(L('Δx·Δp 乘积条（红线=ħ/2 下限）','Δx·Δp meter (red line = ħ/2 bound)'),8,16);
    pctx.fillStyle=PC.red;pctx.fillText('ħ/2',rx-12,by-9);
    pctx.fillStyle=PC.acc;pctx.font='13px sans-serif';
    pctx.fillText(prod.toFixed(2)+' ħ',W-70,by-9);
  }else{ /* 原子模式：动能/势能/总能 对数条 */
    const ek=ekEv(rPM),ep=epEv(rPM),et=ek+ep;
    const rows=[[L('动能 E_kin','E_kin'),ek,PC.red],[L('势能 E_pot','E_pot'),-ep,PC.blue],[L('总能量 E_tot','E_tot'),et,PC.acc]];
    pctx.fillStyle=PC.txt;
    pctx.fillText(L('压缩电子 → 动能∝1/Δx² 暴涨（对数条，|E|满格=1 MeV）','Squeeze → E_kin∝1/Δx² (log bars, full = 1 MeV)'),8,14);
    rows.forEach((r,i)=>{
      const y=22+i*24;
      pctx.fillStyle=PC.txt;pctx.fillText(r[0],8,y+13);
      const bx=78,bw=W-160;
      pctx.fillStyle=PC.grid;pctx.fillRect(bx,y,bw,14);
      const w=clamp((Math.log10(Math.abs(r[1]))+1)/6,0,1)*bw;
      pctx.fillStyle=r[2];pctx.fillRect(bx,y,w,14);
      pctx.fillStyle=PC.txt;pctx.font='11.5px sans-serif';
      pctx.fillText(fmtE(r[1]),W-72,y+13);pctx.font='11px sans-serif';
    });
  }
}
function fmtE(v){
  const a=Math.abs(v);
  if(a>=1e6)return (v/1e6).toFixed(1)+' MeV';
  if(a>=1e3)return (v/1e3).toFixed(1)+' keV';
  if(a>=1)return v.toFixed(1)+' eV';
  if(a>=0.01)return v.toFixed(2)+' eV';
  return v.toExponential(1)+' eV';
}

const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1')playing=false;
if(qp.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(parseFloat(qp.get('speed'))>0){speedK=clamp(parseFloat(qp.get('speed')),0.2,3);
  document.getElementById('sSpd').value=speedK*100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    if(mode===0){
      phase+=dt*2.2*speedK;
      pAcc+=dt*speedK;
      while(pAcc>0.12){pAcc-=0.12;addPhoton();}
    }
    if(mode===1)gT+=dt*2*speedK;      // 每真实秒 ≈ 2 fs
  }
  if(mode===0){
    waves.forEach((w,i)=>{
      const x=-8.4+((phase+i*0.35)%5.0);
      w.position.set(x,0,0);w.visible=x<CX-0.3;
    });
    const t=phase%1;
    arcs.forEach((l,i)=>{
      const r=0.25+((phase*0.8+i*0.33)%1)*6.3, p=l.geometry.attributes.position.array;
      for(let k=0;k<=40;k++){
        const a=-th1()+2*th1()*k/40;
        p[k*3]=CX+r*Math.cos(a);p[k*3+1]=r*Math.sin(a);p[k*3+2]=0;
      }
      l.geometry.attributes.position.needsUpdate=true;
      l.material.opacity=0.55*(1-r/6.6);
    });
  }
  if(mode===1)updateGauss();
  if(mode===2){
    const r=cloudR();
    cloud.scale.setScalar(r);cloud2.scale.setScalar(r*1.03);
    const hot=clamp((Math.log10(ekEv(rPM))+1)/6,0,1); // 动能越高云越红
    cloudM.color.setHex(hot>0.6?0xff8787:0x74c0fc);
    nuc.rotation.y+=dt*0.5;
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();drawPlot();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.fn();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();updateSlitGeom();setMode(0);buildSteps();activeStep=2;syncSteps();drawPlot();start();
</script>
