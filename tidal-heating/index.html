<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>潮汐加热 · 木星把木卫一揉出火山</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}

  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}

  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const TAU=Math.PI*2;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const qsFloat=(k,d)=>{const v=parseFloat(qs.get(k));return Number.isFinite(v)?v:d;};
const wrapPi=x=>{x%=TAU;if(x>Math.PI)x-=TAU;if(x<-Math.PI)x+=TAU;return x;};

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,45,190);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
camera.position.set(0,11,18);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=120;
scene.add(new THREE.AmbientLight(0xdfe8f2,0.5));
const jupLight=new THREE.PointLight(0xfff4dd,1.5,0,0);scene.add(jupLight);
const key=new THREE.DirectionalLight(0x9ab8ff,0.25);key.position.set(-10,8,-6);scene.add(key);

/* ---- 星空 ---- */
const starMat=new THREE.PointsMaterial({color:0x9fb0c3,size:0.18,transparent:true,opacity:0.85});
{
  const N=550,arr=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const v=new THREE.Vector3().randomDirection().multiplyScalar(95+Math.random()*60);
    arr[i*3]=v.x;arr[i*3+1]=v.y;arr[i*3+2]=v.z;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  scene.add(new THREE.Points(g,starMat));
}

/* ---- 木星 ---- */
const jup=new THREE.Mesh(new THREE.SphereGeometry(1.7,40,28),
  new THREE.MeshStandardMaterial({color:0xd8b184,roughness:0.85}));
scene.add(jup);
const bandMat=new THREE.MeshBasicMaterial({color:0xa8845c,transparent:true,opacity:0.55});
for(const [rr,yy] of [[1.45,0.55],[1.5,0.0],[1.35,-0.6]]){
  const b=new THREE.Mesh(new THREE.TorusGeometry(rr,0.075,8,64),bandMat);
  b.rotation.x=Math.PI/2;b.position.y=yy;scene.add(b);
}

/* ---- 三颗卫星(1:2:4 拉普拉斯共振) ----
   a_display ∝ 真实半长轴(421.7/671.1/1070.4 千km);e 用真实值,
   轨道椭圆按 10× 偏心率绘制(肉眼可见);潮汐功率 P=P0·(e/e0)²。 */
const MOON=[
 {zh:'木卫一 Io',en:'Io',a:4.4,R:0.42,T:1.769,col:0xe0c46a,e0:0.0041,P0:100,dr0:100,plume:true},
 {zh:'木卫二 Europa',en:'Europa',a:7.0,R:0.37,T:3.551,col:0xe6eef5,e0:0.009,P0:1.6,dr0:30,plume:false},
 {zh:'木卫三 Ganymede',en:'Ganymede',a:11.2,R:0.5,T:7.155,col:0xb3a88f,e0:0.0013,P0:0.06,dr0:5,plume:false}
];
const nRad=MOON.map(m=>TAU/m.T);   /* rad / Io-day */
let hero=0,e=0.0041,eT=0.0041,resonance=true,cutaway=false;
let dps=0.15,speedMul=clamp(qsFloat('speed',1),0.3,2.5);
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let tD=0,simT=0;
const lam=[0,0,0];
const moonG=[],moonMat=[],coreMat=[],circLines=[];
for(let i=0;i<3;i++){
  const m=MOON[i];
  const g=new THREE.Group();scene.add(g);
  const mat=new THREE.MeshStandardMaterial({color:m.col,roughness:0.8});
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(m.R,28,20),mat);
  g.add(mesh);
  const cm=new THREE.MeshStandardMaterial({color:0x3a1a10,emissive:0xff4d1a,emissiveIntensity:0.5,roughness:0.6});
  const core=new THREE.Mesh(new THREE.SphereGeometry(m.R*0.58,20,14),cm);
  core.visible=false;g.add(core);
  moonG.push(g);moonMat.push(mat);coreMat.push(cm);
  const pts=[];
  for(let k=0;k<=96;k++){const a=k/96*TAU;pts.push(new THREE.Vector3(Math.cos(a)*m.a,0,Math.sin(a)*m.a));}
  const cl=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0x3a5a78,transparent:true,opacity:0.45}));
  scene.add(cl);circLines.push(cl);
}

/* 木卫一火山羽:InstancedMesh 粒子,挂在 Io 组上 */
const NHOT=3,NPP=12;
const plumeM=new THREE.MeshBasicMaterial({color:0xff7b2e,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false});
const plume=new THREE.InstancedMesh(new THREE.SphereGeometry(1,6,5),plumeM,NHOT*NPP);
plume.instanceMatrix.setUsage(THREE.DynamicDrawUsage);plume.frustumCulled=false;
moonG[0].add(plume);
const hotDir=[new THREE.Vector3(0.85,0.3,0.42).normalize(),
  new THREE.Vector3(-0.55,0.35,0.76).normalize(),
  new THREE.Vector3(0.1,-0.42,-0.9).normalize()];

/* 会合闪光 */
const flashM=new THREE.SpriteMaterial({color:0xff7b4d,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
const flash=new THREE.Sprite(flashM);flash.scale.setScalar(1.6);scene.add(flash);

/* 主角轨道椭圆(10× e)+ 近木点标记 */
const ellGeo=new THREE.BufferGeometry();
ellGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(97*3),3));
const ellLine=new THREE.Line(ellGeo,new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.7}));
ellLine.frustumCulled=false;scene.add(ellLine);
const periM=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.4,10),new THREE.MeshBasicMaterial({color:0xff6b6b}));
periM.rotation.z=-Math.PI/2;scene.add(periM);

function keplerE(M,ec){
  let E=M;
  for(let k=0;k<5;k++)E-=(E-ec*Math.sin(E)-M)/(1-ec*Math.cos(E));
  return E;
}
function updEllipse(){
  const m=MOON[hero],ed=Math.max(1e-5,e*10);
  const pos=ellGeo.attributes.position;
  for(let i=0;i<=96;i++){
    const th=i/96*TAU;
    const rr=m.a*(1-ed*ed)/(1+ed*Math.cos(th));
    pos.setXYZ(i,rr*Math.cos(th),0,rr*Math.sin(th));
  }
  pos.needsUpdate=true;
  periM.position.set(m.a*(1-ed),0.1,0);
}
function applyCut(){
  for(let i=0;i<3;i++){
    const on=i===hero&&cutaway;
    moonMat[i].transparent=on;moonMat[i].opacity=on?0.45:1;
    moonMat[i].depthWrite=!on;moonMat[i].needsUpdate=true;
    moonG[i].children[1].visible=on;
  }
}
function setHero(i){
  hero=i;
  for(let k=0;k<3;k++)circLines[k].visible=k!==hero;
  plume.visible=i===0;
  applyCut();
  document.getElementById('bIo').classList.toggle('on',i===0);
  document.getElementById('bEu').classList.toggle('on',i===1);
}
function setRes(v){resonance=v;document.getElementById('tglRes').checked=v;}
function setCut(v){cutaway=v;document.getElementById('tglCut').checked=v;applyCut();}
function setE(v){eT=clamp(v,0,0.012);document.getElementById('sE').value=eT;
  document.getElementById('sEVal').textContent=eT.toFixed(4);}
function setDps(v){dps=clamp(v,0.05,0.6);document.getElementById('sSpd').value=dps;
  document.getElementById('sSpdVal').textContent=dps.toFixed(2)+(LANG==='en'?' d/s':' 天/s');}
function heatOf(){
  const m=MOON[hero];
  const rh=moonG[hero].position.length()||1e-6;
  return clamp(Math.abs(m.a/rh-1)*160,0.03,1);
}
function tidalW(){const m=MOON[hero];return m.P0*Math.pow(e/m.e0,2);}   /* ×10¹² W */

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>applyPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- UI ---- */
const elPlay=document.getElementById('play');
const tglLabelsEl=document.getElementById('tglLabels');
function syncPlayBtn(){elPlay.textContent=playing?L('暂停','Pause'):L('运行','Run');}
function updateStats(){
  const m=MOON[hero],heat=heatOf(),P=tidalW();
  document.getElementById('stP').innerHTML=(P>=10?P.toFixed(1):P.toFixed(2))+'<small> ×10¹² W</small>';
  const eE=document.getElementById('stE');
  eE.innerHTML=e.toFixed(4);
  eE.className='v'+(e<m.e0*0.3?' warn':'');
  document.getElementById('stD').innerHTML='±'+(m.dr0*e/m.e0).toFixed(0)+'<small> m</small>';
  document.getElementById('stH').innerHTML=(m.plume?Math.round(350*heat):0)+'<small> km</small>';
  document.getElementById('formula').innerHTML=L(
    `<b>潮汐力 ∝ M/r³</b>;同步自转锁定隆起指向;偏心 → 每圈揉捏一次<br>`+
    `<b>潮汐功率 P=P₀(e/e₀)²</b> = ${MOON[hero].zh} ${ (P>=10?P.toFixed(0):P.toFixed(2)) } ×10¹² W(木卫一真实 ~10¹⁴ W)<br>`+
    `<b>拉普拉斯关系 λ_I−2λ_E+λ_G≈180°</b>:${resonance?'锁定中:会合经度恒定':'已解除:e 指数衰减,轨道圆化'}`,
    `<b>Tide ∝ M/r³</b>; synchronous rotation locks the bulge; eccentricity → one knead per orbit<br>`+
    `<b>Tidal power P=P₀(e/e₀)²</b> = ${MOON[hero].en}: ${(P>=10?P.toFixed(0):P.toFixed(2))} ×10¹² W (Io real ~10¹⁴ W)<br>`+
    `<b>Laplace λ_I−2λ_E+λ_G≈180°</b>: ${resonance?'locked: fixed conjunction longitude':'released: e decays, orbit circularizes'}`);
}

  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';

  document.querySelectorAll('[data-zh]').forEach(el=>{

    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();syncPlayBtn();setDps(dps);updateStats();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
const _M4=new THREE.Matrix4(),_V=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  simT+=dt0;
  const dd=dt0*speedMul*dps*(playing?1:0);
  if(dd>0){
    tD+=dd;
    lam[0]+=nRad[0]*dd;
    lam[1]+=(resonance?nRad[1]:nRad[1]*1.08)*dd;
    lam[2]+=(resonance?nRad[2]:nRad[2]*1.16)*dd;
    if(resonance){
      lam[1]+=wrapPi(lam[0]/2-lam[1])*Math.min(1,dd*12);
      lam[2]+=wrapPi(lam[0]/4-lam[2])*Math.min(1,dd*12);
    }
  }
  if(resonance)e+=(eT-e)*Math.min(1,dt0*2.5);
  else e=Math.max(2e-4,e*Math.exp(-dt0/2.5));
  /* 卫星位置与潮汐隆起 */
  let rh=MOON[hero].a;
  for(let i=0;i<3;i++){
    const m=MOON[i],g=moonG[i];
    if(i===hero){
      const ed=Math.max(1e-5,e*10),M=((lam[i]%TAU)+TAU)%TAU;
      const E=keplerE(M,ed);
      const px=m.a*(Math.cos(E)-ed),pz=m.a*Math.sqrt(1-ed*ed)*Math.sin(E);
      g.position.set(px,0,pz);
      rh=Math.hypot(px,pz)||1e-6;
    }else{
      g.position.set(m.a*Math.cos(lam[i]),0,m.a*Math.sin(lam[i]));
    }
    g.lookAt(0,0,0);
    const k=clamp(0.16*Math.pow(m.a/Math.hypot(g.position.x,g.position.z),3),0.04,0.30)*(i===hero?1+0.5*heatOf():1);
    g.scale.set(1-k*0.45,1-k*0.45,1+k);
    const cm=coreMat[i];
    cm.emissiveIntensity=0.3+2.4*heatOf()*(0.9+0.2*Math.sin(simT*7));
  }
  const heat=heatOf();
  updEllipse();
  /* 会合闪光:主角与相邻卫星经度重合 */
  const partner=hero===0?1:2;
  if(Math.abs(wrapPi(lam[hero]-lam[partner]))<0.14){
    flash.position.set(Math.cos(lam[hero])*rh*1.18,0.3,Math.sin(lam[hero])*rh*1.18);
    flashM.opacity=1;
  }
  flashM.opacity=Math.max(0,flashM.opacity-dt0*1.4);
  /* 火山羽粒子 */
  plume.visible=hero===0&&MOON[0].plume&&heat>0.05;
  if(plume.visible){
    let idx=0;
    for(let h=0;h<NHOT;h++){
      const dir=hotDir[h];
      for(let j=0;j<NPP;j++){
        const t=(simT*(0.35+h*0.07)+j/NPP+h*0.31)%1;
        const ph=0.15+heat*1.1;
        _V.copy(dir).multiplyScalar(MOON[0].R+t*ph);
        _V.x+=Math.sin(j*2.4+h)*t*0.12;_V.y+=Math.cos(j*1.7)*t*0.1;_V.z+=Math.cos(j*2.1+h)*t*0.12;
        const s=(1-t)*0.07+0.018;
        _M4.compose(_V,new THREE.Quaternion(),_V2.set(s,s,s));
        plume.setMatrixAt(idx++,_M4);
      }
    }
    plume.instanceMatrix.needsUpdate=true;
  }
  acc+=dt0;
  if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */

applyTheme();
applyLang();
setHero(0);setE(0.0041);setDps(0.15);
tglLabelsEl.checked=labelsOn;
document.getElementById('tglRes').checked=resonance;
document.getElementById('tglCut').checked=cutaway;
syncPlayBtn();
{const t0=Math.round(qsFloat('t',-1));
 if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);else applyPhase(0);}
updateStats();
start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
