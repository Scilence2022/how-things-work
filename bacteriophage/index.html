<style>

  #app{position:fixed;inset:0}#app canvas{display:block}

  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}

</style>

  <div class="sub" data-zh="T4 先用六条尾腿认出大肠杆菌外膜的受体,锁稳才收缩尾鞘、把 DNA 注入——认错受体就白跑一趟;走裂解路线,半小时在菌内量产约百枚子代、破壁喷出,菌苔上的噬斑一轮轮指数扩大;走溶原路线,DNA 整合进染色体随宿主一分为二垂直遗传,UV 一闪就切离转裂解,而细菌的 CRISPR 正是历次入侵留下的记录 · 拖动旋转 / 空格运行/暂停" data-en="T4 first matches receptors on the E. coli outer membrane with its six tail fibers — only a firm lock triggers the sheath contraction that injects DNA; the lytic route mass-produces ~100 progeny in half an hour, bursts the cell, and plaques on the lawn widen exponentially round by round; the lysogenic route integrates the DNA into the chromosome, inherited vertically as the cell splits — a flash of UV switches dormancy back to lysis, and bacterial CRISPR is precisely the record of past invasions · drag to orbit / Space = run/pause">T4 先用六条尾腿认出大肠杆菌外膜的受体,锁稳才收缩尾鞘、把 DNA 注入——认错受体就白跑一趟;走裂解路线,半小时在菌内量产约百枚子代、破壁喷出,菌苔上的噬斑一轮轮指数扩大;走溶原路线,DNA 整合进染色体随宿主一分为二垂直遗传,UV 一闪就切离转裂解,而细菌的 CRISPR 正是历次入侵留下的记录 · 拖动旋转 / 空格运行/暂停</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,42);
const camera=new THREE.PerspectiveCamera(33,innerWidth/innerHeight,0.1,200);
camera.position.set(-0.5,10.0,11.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.35,0.55,-0.2);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:培养皿俯视 45°,琼脂表面铺菌苔,中央放大展示大肠杆菌 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const dishM=new THREE.MeshStandardMaterial({color:0x272c36,roughness:0.55,metalness:0.15});
const dish=new THREE.Mesh(new THREE.CylinderGeometry(5.25,5.25,0.46,64),dishM);
dish.position.y=0.23;scene.add(dish);
const agarM=new THREE.MeshStandardMaterial({color:0x3a4030,roughness:0.9});
const agar=new THREE.Mesh(new THREE.CylinderGeometry(4.98,4.98,0.14,64),agarM);
agar.position.y=0.52;scene.add(agar);
const rimM=new THREE.MeshStandardMaterial({color:0x3f4654,roughness:0.4,metalness:0.5});
const rim=new THREE.Mesh(new THREE.TorusGeometry(5.14,0.13,12,72),rimM);
rim.rotation.x=Math.PI/2;rim.position.y=0.5;scene.add(rim);
/* 菌苔:数百只半透明绿色胶囊铺满琼脂(中央留给放大的展示菌) */
const lawnM=new THREE.MeshStandardMaterial({color:0x55b96e,roughness:0.6,transparent:true,opacity:0.72});
const lawn=new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.05,0.11,4,8),lawnM,620);
{
  const dum=new THREE.Object3D();
  for(let i=0;i<620;i++){
    const r=Math.sqrt(1.7*1.7+(4.8*4.8-1.7*1.7)*Math.random()),a=Math.random()*Math.PI*2;
    dum.position.set(r*Math.cos(a),0.645,r*Math.sin(a));
    dum.rotation.set(0,Math.random()*Math.PI*2,Math.PI/2);
    dum.updateMatrix();lawn.setMatrixAt(i,dum.matrix);
  }
}
scene.add(lawn);
/* 放大的大肠杆菌:半透明菌壁 + 内部拟核 DNA 环 */
const ecolGeo=new THREE.CapsuleGeometry(0.34,0.9,6,18);
const ecolM=new THREE.MeshStandardMaterial({color:0x5fc97a,roughness:0.35,transparent:true,opacity:0.5,depthWrite:false});
const heroM=ecolM.clone();
const chroM=new THREE.MeshStandardMaterial({color:0xbfe3ff,roughness:0.4,emissive:0x3d6ea8,emissiveIntensity:0.5,transparent:true,opacity:0.95});
const prophM=new THREE.MeshStandardMaterial({color:0xd2b3ff,roughness:0.3,emissive:0x9d6bff,emissiveIntensity:1.5});
const heroG=new THREE.Group();heroG.position.set(0,0.93,0);scene.add(heroG);
const heroMesh=new THREE.Mesh(ecolGeo,heroM);heroMesh.rotation.z=Math.PI/2;heroG.add(heroMesh);
const chro=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.02,10,42),chroM);
chro.rotation.y=Math.PI/2;heroG.add(chro);
const plasmid=new THREE.Mesh(new THREE.TorusGeometry(0.07,0.012,8,24),chroM);
plasmid.rotation.x=Math.PI/2;plasmid.position.set(0.16,0.05,0.08);heroG.add(plasmid);
const proph=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.055,10,16,1.1),prophM);
proph.rotation.y=Math.PI/2;proph.visible=false;heroG.add(proph);
for(const[p,ry]of[[2.45,0.7],[-2.35,-0.45]]){
  const g=new THREE.Group();g.position.set(p,0.93,p>0?1.5:-1.25);g.rotation.y=ry;scene.add(g);
  const m=new THREE.Mesh(ecolGeo,ecolM);m.rotation.z=Math.PI/2;g.add(m);
  const c=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.02,10,42),chroM);c.rotation.y=Math.PI/2;g.add(c);
}
/* 二分裂的子代(溶原路线用) */
const dGeo=new THREE.CapsuleGeometry(0.34,0.72,6,18);
const daughters=[];
for(const s of[-1,1]){
  const g=new THREE.Group();g.visible=false;g.position.set(s*0.6,0.93,0);scene.add(g);
  const m=new THREE.Mesh(dGeo,ecolM);m.rotation.z=Math.PI/2;g.add(m);
  const a=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.055,10,16,1.1),prophM);
  a.rotation.y=Math.PI/2;g.add(a);
  daughters.push(g);
}
/* ── T4 噬菌体:二十面体头 + 收缩尾鞘 + 六条尾腿 ── */
const phageHeadM=new THREE.MeshStandardMaterial({color:0x9db8e8,roughness:0.3,metalness:0.35});
const sheathM=new THREE.MeshStandardMaterial({color:0xd9822b,roughness:0.4,emissive:0x5a3410,emissiveIntensity:0.5});
const fiberM=new THREE.MeshStandardMaterial({color:0xc9d2e0,roughness:0.35,metalness:0.6});
function makePhage(s=1){
  const g=new THREE.Group();
  const headG=new THREE.Group();g.add(headG);
  const head=new THREE.Mesh(new THREE.IcosahedronGeometry(0.24,0),phageHeadM);
  head.scale.y=1.25;head.position.y=0.66;headG.add(head);
  const collar=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.05,12),fiberM);
  collar.position.y=0.42;headG.add(collar);
  const sheath=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.4,10),sheathM);
  sheath.position.y=0.2;g.add(sheath);
  const plate=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.045,6),fiberM);
  plate.position.y=-0.02;g.add(plate);
  for(let i=0;i<6;i++){
    const fg=new THREE.Group();fg.rotation.y=i/6*Math.PI*2;fg.position.y=-0.03;g.add(fg);
    const f=new THREE.Mesh(new THREE.CylinderGeometry(0.013,0.013,0.36,6),fiberM);
    f.position.set(0.11,-0.15,0);f.rotation.z=0.55;fg.add(f);
  }
  g.scale.setScalar(s);return{g,headG,sheath};
}
const hovers=[];
for(let i=0;i<8;i++){
  const ph=makePhage(1.05),a=i/8*Math.PI*2;

const DNA_DIR=DNA_E.clone().sub(DNA_S),DNA_LEN=DNA_DIR.length();DNA_DIR.normalize();

/* 裂解爆闪 / UV 紫外闪光 */

let plaqueBase=0;

/* 状态 */
let mode='lytic',stage=2,moi=1,nutri=0.8,playing=true,labelsOn=true,slowMo=false,lawnOn=true;
let simT=0,animT=0,cycleAcc=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;

/* 菌群统计:量级对齐 T4 真实参数(潜伏 ~30 min、裂解量 ~100-200、burst 随营养折算) */
const NB0=2.0e6;let nb=NB0,nv=1e5,nl=0,nPlq=0;
function tick(){
  const burst=Math.round(40+90*nutri);
  if(mode==='lytic'){
    const inf=Math.min(nb,Math.round(nv*0.65));
    nb=Math.max(0,Math.round(nb-inf+nb*0.1*nutri));
    nv=Math.round(nv-inf+inf*burst);
    nPlq+=Math.max(1,Math.round(nPlq*0.7));
  }else if(mode==='lysogenic'){
    const newly=Math.min(Math.round(nv),Math.round(nb*0.04));
    nv=Math.round(nv*0.35);nl+=newly;
    const g=1+0.28*nutri;nb=Math.round(nb*g);nl=Math.round(nl*g);
  }else{
    const induced=Math.round(nl*0.85);
    if(induced>0){nv+=induced*burst;nl-=induced;nb=Math.max(0,nb-Math.round(induced*0.6));}
    else{
      const inf=Math.min(nb,Math.round(nv*0.65));
      nb=Math.max(0,nb-inf);nv=Math.round(nv-inf+inf*burst);
    }
    nPlq+=Math.max(1,Math.round(nPlq*0.8));
  }
}
function fmt(n){n=Math.max(0,n);
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';
  if(n>=1e3)return(n/1e3).toFixed(n>=1e4?0:1)+'k';
  return''+Math.round(n);}

const STEPS=[
 {zh:'<b>吸附与注射</b>:六条尾腿认出外膜受体,锁稳后尾鞘收缩,像注射器把 DNA 推进菌体',

const clock=new THREE.Clock();
let raf=null;
const EASE=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;animT+=dts;
  /* 统计节拍:一个回合 ≈ 一次潜伏期(压缩演示) */
  cycleAcc+=dts;if(cycleAcc>2.2){cycleAcc=0;tick();}
  /* 悬浮噬菌体群:数量随 MOI */
  const nH=clamp(Math.round(1.6+moi*1.4),2,8);
  hovers.forEach((ph,i)=>{
    ph.g.visible=i<nH&&mode!=='uv';
    ph.g.position.y=2.5+0.45*(i%3)+0.09*Math.sin(simT*2+i*1.7);
    ph.g.rotation.y=simT*0.4+i;
  });
  /* 主角噬菌体:吸附→收缩→注射 */
  const landing=(mode==='lytic'&&stage===1)||(mode==='lysogenic'&&stage===1);
  const contract=(mode==='lytic'&&stage>=3)||(mode==='lysogenic'&&stage>=2)?1:
    ((mode==='lytic'&&stage===2)||(mode==='lysogenic'&&stage===1))?clamp(animT/0.8,0,1):0;
  const postBurst=(mode==='lytic'&&stage>=5)||(mode==='uv'&&animT>2.2);
  actor.g.visible=(mode!=='uv')&&!(mode==='lytic'&&stage>=5&&animT>0.9)&&!(mode==='lysogenic'&&stage>=3);
  actor.g.position.y=landing?2.3-1.0*EASE(clamp(animT/1.0,0,1)):1.3;
  actor.headG.position.y=-0.235*contract;
  actor.sheath.scale.y=1-0.58*contract;actor.sheath.position.y=0.2-0.07*contract;
  /* DNA 注入线 */
  const dnaOn=((mode==='lytic'&&stage>=2&&stage<5)||(mode==='lytic'&&stage===5&&animT<0.5)||(mode==='lysogenic'&&stage===1));
  dna.visible=dnaOn&&!(mode==='lytic'&&stage>=5);
  if(dna.visible){
    const len=(mode==='lysogenic'&&stage===1)?clamp((animT-0.8)/0.9,0,1):
      ((mode==='lytic'&&stage===2)?clamp((animT-0.6)/0.9,0,1):1);
    dna.scale.y=Math.max(DNA_LEN*len,0.001);
  }
  /* 裂解:复制位点 → 组装子代 → 喷出 */
  const spray=mode==='lytic'?(stage===5?clamp(animT/1.4,0,1):stage>=6?1:0):
    (mode==='uv'&&animT>2.2?clamp((animT-2.2)/1.4,0,1):0);
  dots.forEach((d,i)=>{
    d.visible=(mode==='lytic'&&stage===3);
    if(d.visible)d.scale.setScalar(0.4+0.9*clamp(animT/2.2,0,1)+0.12*Math.sin(simT*6+i));
  });
  minis.forEach((m,i)=>{
    m.visible=(mode==='lytic'&&stage===4)||(spray>0);
    const p=dots[i].position;
    if(spray>0){m.position.copy(p).addScaledVector(miniDir[i],spray*2.1);}
    else m.position.copy(p);
    m.rotation.y=simT*0.8+i;
  });
  heroM.opacity=postBurst?0.13:0.5;
  const showFlash=spray>0&&spray<0.55;
  flash.visible=showFlash;
  if(showFlash){const fs=0.4+2.6*(spray/0.55);flash.scale.setScalar(fs);flashM.opacity=0.75*(1-spray/0.55);}
  /* 溶原:整合 + 二分裂 */
  proph.visible=(mode==='lysogenic'&&stage>=2)||(mode==='uv'&&animT>1.0&&animT<2.2);
  if(mode==='lysogenic'&&stage>=3){
    const t=clamp(animT/3.6,0,1);
    if(t<0.45){heroG.visible=true;heroG.scale.x=1+1.05*(t/0.45);daughters.forEach(d=>d.visible=false);}
    else{
      heroG.visible=false;heroG.scale.x=1;
      const s=(t-0.45)/0.55,sep=0.62+0.85*s;
      daughters.forEach((d,i)=>{d.visible=true;d.position.x=(i?1:-1)*sep;d.scale.setScalar(0.72+0.28*s);});
    }
  }else{
    heroG.visible=true;heroG.scale.x=1;daughters.forEach(d=>d.visible=false);
  }
  /* UV:闪光 + 切离 */
  const uvT=mode==='uv'?animT:99;
  if(uvT<1.2){
    const f=Math.sin(Math.PI*uvT/1.2);
    uvLight.intensity=9*f;uvRing.visible=true;
    uvRing.scale.setScalar(0.3+3.2*uvT/1.2);uvRingM.opacity=0.7*f;
  }else{uvLight.intensity=0;uvRing.visible=false;}
  if(proph.visible&&mode==='uv'){proph.position.y=0.28*clamp((animT-1.2)/1.0,0,1);proph.scale.setScalar(1-0.4*clamp((animT-1.6)/0.6,0,1));}
  else{proph.position.y=0;proph.scale.setScalar(1);}
  /* 噬斑扩大 */
  const plaqueOn=(mode==='lytic'&&stage>=5)||(mode==='uv'&&animT>2.6);
  if(plaqueOn&&playing)plaqueBase+=dts*0.13*(0.4+nutri);
  plaques.forEach((pl,i)=>{
    const r=Math.min(pl.mx,plaqueBase*(0.55+0.28*i));
    pl.g.visible=r>0.03;pl.g.scale.setScalar(Math.max(r,0.001));
  });
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();setLawn(true);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
animT=[1.6,2.2,2.2,1.0,4.6,3.4][activeStep]||0;   /* 初始即呈现该步的成熟状态 */
if(mode==='uv')plaqueBase=Math.max(plaqueBase,0.9);
updateStats();syncPlayBtn();start();

  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
