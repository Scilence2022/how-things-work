<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电磁感应 · 楞次定律:来拒去留</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.m  { color: #ffc2c2; border-color: rgba(255,93,93,.7); }
  .chip.i  { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.l  { color: #7ee2ae; border-color: rgba(67,209,124,.6); }
  :root[data-theme="light"] .chip.m  { color: #b83232; border-color: rgba(200,60,60,.7); }
  :root[data-theme="light"] .chip.i  { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  :root[data-theme="light"] .chip.l  { color: #148a5c; border-color: rgba(20,138,92,.6); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="电磁感应：磁铁插拔线圈——楞次定律「来拒去留」" data-en="Electromagnetic induction: push or pull, the coil always opposes">电磁感应：磁铁插拔线圈——楞次定律「来拒去留」</h1>
  <div class="sub" data-zh="磁通变化 → 感应电动势 e = −dΦ/dt → 感应电流的磁场永远「反对」变化:插入时排斥、拔出时吸引 · 空格播放/暂停" data-en="Changing flux → induced EMF e = −dΦ/dt → the induced current always opposes the change: repel on entry, attract on exit · Space = play/pause">磁通变化 → 感应电动势 e = −dΦ/dt → 感应电流的磁场永远「反对」变化:插入时排斥、拔出时吸引 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip m" data-zh="条形磁铁(N 红/S 蓝)" data-en="bar magnet (N red / S blue)">条形磁铁(N 红/S 蓝)</span>
    <span class="chip i" data-zh="感应电流(方向随 dΦ/dt)" data-en="induced current (∝ dΦ/dt)">感应电流(方向随 dΦ/dt)</span>
    <span class="chip l" data-zh="楞次:来拒去留" data-en="Lenz: oppose the change">楞次:来拒去留</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="磁速" data-en="Mag speed">磁速</label><input id="mvel" type="range" min="0.3" max="3" step="0.1" value="1"><span class="val" id="mvelVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglFlip" type="checkbox"> <span data-zh="翻转磁极(S 端朝右)" data-en="Flip magnet (S facing)">翻转磁极(S 端朝右)</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('电磁感应 · 楞次定律:来拒去留', 'Electromagnetic Induction · Lenz\'s Law');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function dot(x, y, r, color, glow) {
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  circle(x, y, r, color);
  ctx.shadowBlur = 0;
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

/* ================= 时序与状态 ================= */
const CYCLE = 12;
const COIL_X = 640, COIL_Y = 430;
const X_OUT = 250, X_IN = 610;
let mVel = 1, flip = false;
let showLabels = true;
let t01 = 0;

/* 磁铁位置(纯函数)与速度符号 */
function magX(t) {
  if (t < 0.25) return lerp(X_OUT, X_IN, ss(0, 0.25, t));
  if (t < 0.40) return X_IN;
  if (t < 0.65) return lerp(X_IN, X_OUT, ss(0.40, 0.65, t));
  return X_OUT;
}
function magVelSign(t) {          // +1 = 向右插入, -1 = 向左拔出, 0 = 静止
  if (t < 0.25) return 1;
  if (t < 0.40) return 0;
  if (t < 0.65) return -1;
  return 0;
}

/* ================= 相位讲解 ================= */
const STEPS = [
  { t0: 0.00, t1: 0.25, n: 1, b: '插入:磁通增加', d: 'N 端冲向线圈,穿过线圈的磁通 Φ 越来越大——变化的磁通就是感应的源头。',
    be: 'Inserting: flux rising', de: 'The N pole charges toward the coil; the flux Φ through it grows — changing flux is the source of induction.' },
  { t0: 0.25, t1: 0.40, n: 2, b: '静止:无感应', d: '磁铁停在内部,Φ 很大但不再变化——dΦ/dt = 0,感应电流消失。变化的「快慢」才重要。',
    be: 'Still: no induction', de: 'The magnet rests inside; Φ is large but constant — dΦ/dt = 0 and the induced current vanishes. Only change matters.' },
  { t0: 0.40, t1: 0.65, n: 3, b: '拔出:磁通减少', d: '拔出的瞬间 Φ 减小,感应电动势 e = −dΦ/dt 反号——电流掉头,指针摆向另一边。',
    be: 'Withdrawing: flux falling', de: 'On the way out Φ falls; the EMF e = −dΦ/dt flips sign — the current reverses and the needle swings the other way.' },
  { t0: 0.65, t1: 0.85, n: 4, b: '楞次:来拒去留', d: '感应电流的磁场永远反对变化:N 来 → 线圈左端变 N 排斥它;N 走 → 左端变 S 拉住它。',
    be: 'Lenz: oppose the change', de: 'The induced field always opposes the change: N coming → the coil\'s face turns N to repel; N leaving → it turns S to hold on.' },
  { t0: 0.85, t1: 1.00, n: 5, b: '更快 = 更强', d: 'e 正比于磁通变化的快慢:插得越快,指针摆得越狠。发电机、变压器、无线充电,全是这一条的子孙。',
    be: 'Faster = stronger', de: 'EMF scales with how fast flux changes: faster insertion, bigger kick. Generators, transformers and wireless charging are all descendants of this line.' },
];
function stepIndex(t) {
  if (t < 0.25) return 0;
  if (t < 0.40) return 1;
  if (t < 0.65) return 2;
  if (t < 0.85) return 3;
  return 4;
}

/* ================= 绘制 ================= */
function drawCoil(t) {
  // 线圈(侧视 9 匝)
  const turns = 9;
  for (let i = 0; i < turns; i++) {
    const x = COIL_X - 90 + i * 22;
    ctx.strokeStyle = 'rgba(203,174,232,.8)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(x, COIL_Y, 16, 105, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // 接线柱 → 检流计
  line(COIL_X + 100, COIL_Y - 60, 1010, 240, 'rgba(154,167,184,.6)', 3);
  line(COIL_X + 100, COIL_Y + 60, 1010, 400, 'rgba(154,167,184,.6)', 3);
  if (showLabels) text(L('线圈', 'coil'), COIL_X, COIL_Y + 145, 13, PAL.dim2, 'center');
}
function drawMagnet(t) {
  const x = magX(t);
  const vh = (flip ? -1 : 1);          // 磁极朝向:1 = N 朝右
  const w = 150, h = 56;
  const y = COIL_Y;
  // 左半(S 蓝)/右半(N 红) 或翻转
  const leftIsN = vh < 0;
  rrect(x - w / 2, y - h / 2, w / 2, h, 6, '#4cc9f0cc');
  rrect(x, y - h / 2, w / 2, h, 6, '#ff5d5dcc');
  text(leftIsN ? 'N' : 'S', x - w / 4, y + 6, 17, '#10141b', 'center', 700);
  text(leftIsN ? 'S' : 'N', x + w / 4, y + 6, 17, '#10141b', 'center', 700);
  if (showLabels) text(L('条形磁铁', 'bar magnet'), x, y - h / 2 - 12, 12.5, PAL.dim2, 'center');
  // 指向箭头(运动方向)
  const vs = magVelSign(t);
  if (vs !== 0) {
    const dir = vs;   // +1 → 右
    const ax = x + dir * (w / 2 + 26);
    line(ax - dir * 22, y, ax, y, '#ffd166', 3);
    ctx.beginPath(); ctx.moveTo(ax, y);
    ctx.lineTo(ax - dir * 10, y - 7); ctx.lineTo(ax - dir * 10, y + 7);
    ctx.closePath(); ctx.fillStyle = '#ffd166'; ctx.fill();
  }
  return { x, vs, vh };
}
/* 线圈端极性 + 楞次箭头 */
function drawLenz(t) {
  const vs = magVelSign(t);
  if (vs === 0) return;
  const m = drawMagnet(t);
  const leadingN = (m.vh > 0 ? vs > 0 : vs < 0);   // N 端正在逼近?
  const faceCol = leadingN ? '#ff5d5d' : '#4cc9f0';
  const faceLab = leadingN ? 'N' : 'S';
  circle(COIL_X - 108, COIL_Y, 21, faceCol + 'cc', faceCol, 2);
  text(faceLab, COIL_X - 108, COIL_Y + 7, 18, '#10141b', 'center', 700);
  // 来拒 / 去留 箭头(一对反向箭头或吸引箭头)
  if (leadingN) {
    line(COIL_X - 150, COIL_Y - 55, COIL_X - 172, COIL_Y - 55, '#7ee2ae', 3);
    text(L('拒', 'repel'), COIL_X - 178, COIL_Y - 48, 13, '#7ee2ae', 'right', 700);
  } else {
    line(COIL_X - 150, COIL_Y - 55, COIL_X - 120, COIL_Y - 55, '#7ee2ae', 3);
    text(L('留', 'attract'), COIL_X - 178, COIL_Y - 48, 13, '#7ee2ae', 'right', 700);
  }
  if (showLabels) text(L('线圈左端感应出', 'coil face becomes'), COIL_X - 108, COIL_Y - 42, 11.5, PAL.dim2, 'center');
}
function drawGauge(t) {
  const gx = 1090, gy = 320, r = 130;
  circle(gx, gy, r, PAL.pill, PAL.axis, 2);
  // 刻度
  for (let i = -5; i <= 5; i++) {
    const a = -Math.PI / 2 + (i / 5) * (Math.PI / 3);
    line(gx + Math.cos(a) * (r - 14), gy + Math.sin(a) * (r - 14),
         gx + Math.cos(a) * (r - 26), gy + Math.sin(a) * (r - 26), PAL.dim, 2);
  }
  text('0', gx, gy + r - 26, 12, PAL.dim2, 'center');
  text('+', gx + r * 0.52, gy - r * 0.42, 15, '#ff8a80', 'center', 700);
  text('−', gx - r * 0.52, gy - r * 0.42, 15, '#7fd0f7', 'center', 700);
  // 磁通变化率 → 指针偏角
  const vs = magVelSign(t);
  const emf = -vs * mVel * (flip ? -1 : 1);         // e = −dΦ/dt
  const ang = -Math.PI / 2 + clamp(emf, -1, 1) * (Math.PI / 3);
  line(gx, gy, gx + Math.cos(ang) * (r - 34), gy + Math.sin(ang) * (r - 34), '#ffd166', 4);
  circle(gx, gy, 8, '#ffd166');
  if (showLabels) text(L('检流计', 'galvanometer'), gx, gy + r + 34, 13, PAL.dim2, 'center');
  // 感应电流沿导线的方向点
  const n = 8, flow = Math.sign(emf);
  if (flow !== 0) {
    for (let i = 0; i < n; i++) {
      const k = (t01 * (1.5 + 2.5 * Math.abs(emf)) * 2 + i / n) % 1;
      let x, y;
      if (k < 0.5) {
        const kk = k * 2;
        x = lerp(COIL_X + 100, 1010, kk); y = lerp(COIL_Y - 60, 240, kk) - 4 * Math.sin(kk * Math.PI);
      } else {
        const kk = (k - 0.5) * 2;
        x = lerp(1010, COIL_X + 100, kk); y = lerp(400, COIL_Y + 60, kk) - 4 * Math.sin(kk * Math.PI);
      }
      dot(x, y, 5, '#ffd166', 6);
    }
    if (showLabels) {
      text(L(flow > 0 ? '感应电流 ⏴(沿导线)' : '感应电流 ⏵(沿导线)', flow > 0 ? 'induced current ⏴' : 'induced current ⏵'),
        COIL_X + 560, COIL_Y - 70, 12.5, '#ffd166', 'center', 700);
    }
  }
  return emf;
}
function drawNotes(t) {
  if (!showLabels) return;
  const vs = magVelSign(t);
  if (vs === 0 && t > 0.25 && t < 0.40) {
    text(L('Φ 不变 → e = 0:变化停止,感应消失', 'Φ constant → e = 0: change stops, induction stops'),
      COIL_X + 40, COIL_Y - 190, 14, PAL.dim, 'center', 700);
  }
  if (t > 0.85) {
    text(L('e = −dΦ/dt:法拉第定律(负号就是楞次)', 'e = −dΦ/dt: Faraday\'s law (the minus sign IS Lenz)'),
      W / 2 + 180, H - 46, 15, '#ffd166', 'center', 700);
  }
}

/* ================= 主绘制 ================= */
function draw(t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawCoil(t);
  drawGauge(t);
  drawMagnet(t);
  drawLenz(t);
  drawNotes(t);
}

/* ================= UI / 主循环 ================= */
let cycles = 0, playing = true, speed = 1;
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elMvel = document.getElementById('mvel');
const elMvelVal = document.getElementById('mvelVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglFlip = document.getElementById('tglFlip');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex(t01)));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elMvel.addEventListener('input', () => { mVel = parseFloat(elMvel.value); elMvelVal.textContent = mVel.toFixed(1) + '×'; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglFlip.addEventListener('change', () => { flip = tglFlip.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

let lastStep = -1, last = performance.now();
applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) cycles += dt * speed / CYCLE;
  t01 = cycles - Math.floor(cycles);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(t01);

  const si = stepIndex(t01);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
}
requestAnimationFrame(frame);
</script>
