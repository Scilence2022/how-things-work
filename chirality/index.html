<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手性 · 镜像分子,无法重叠</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#63e6be;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0ca678;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(99,230,190,.9); color: #c3f5e5; }
  .lbl.m { border-color: rgba(255,159,40,.9); color: #ffd9a3; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(12,166,120,.9); color: #0ca678; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #63e6be; }
  #stats .v.m { color: #ffa94d; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.g { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.m { color: #ffd9a3; border-color: rgba(255,159,40,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(99,230,190,.12); color: var(--text); border: 1px solid rgba(99,230,190,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(99,230,190,.26); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(99,230,190,.10); border-color: rgba(99,230,190,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,166,120,.08); border-color: rgba(12,166,120,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #c3f5e5; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="手性：镜像分子，无法重叠" data-en="Chirality: mirror images that never overlap">手性：镜像分子，无法重叠</h1>
  <div class="sub" data-zh="碳连着四个不同基团,镜像就是另一种分子:旋光相反、气味不同、药性天差地别——生命只认一边 · 空格播放/暂停" data-en="A carbon with four different groups has a mirror twin: opposite rotation, different smell, different drug effect — life picks one side · Space = play/pause">碳连着四个不同基团,镜像就是另一种分子:旋光相反、气味不同、药性天差地别——生命只认一边 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="分子" data-en="molecules">分子</span><span class="v g" id="stM">R / S</span>
  <span class="k" data-zh="旋光方向" data-en="rotation">旋光方向</span><span class="v m" id="stO">+ / −</span>
  <span class="k" data-zh="镜像重叠" data-en="superimposable">镜像重叠</span><span class="v" id="stS">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.g" data-zh="左:R 构型(顺时针)" data-en="left: R (clockwise)">左:R 构型(顺时针)</span>
    <span class="chip.m" data-zh="右:S 构型(镜像)" data-en="right: S (mirror)">右:S 构型(镜像)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnMirror" data-zh="推动镜像面(穿墙看右边)" data-en="push through the mirror">推动镜像面(穿墙看右边)</button>
    <button class="abtn" id="btnSwap" data-zh="交换两个基团(变回镜像)" data-en="swap two groups (back to mirror)">交换两个基团(变回镜像)</button>
  </div>
  <div class="row"><label data-zh="同步旋转" data-en="rotation">同步旋转</label><input id="spin" type="range" min="0" max="100" step="5" value="35"><span class="val" id="spinVal">0.35×</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglMirror" type="checkbox" checked> <span data-zh="镜像面" data-en="mirror plane">镜像面</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../sn1-mechanism/" data-zh="SN1:外消旋化来源" data-en="SN1: where racemates come from">SN1:外消旋化来源</a>
    <a href="../sn2-walden/" data-zh="SN2:构型翻转" data-en="SN2: Walden inversion">SN2:构型翻转</a>
    <a href="../electrophilic-addition/" data-zh="加成:两侧进攻的来源" data-en="addition: attack from both faces">加成:两侧进攻的来源</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.mirrorPlane.opacity = tglMirror.checked ? 0.16 : 0;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('手性 · 镜像分子', 'Chirality · mirror molecules');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 1.4, 8.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  C: mat(0x63e6be, { metalness: 0.35, roughness: 0.35 }),
  Cl: mat(0x63e6be, { roughness: 0.35 }),
  F: mat(0x74c0fc, { roughness: 0.35 }),
  Br: mat(0xa61e4d, { roughness: 0.35 }),
  I: mat(0xffd166, { metalness: 0.4, roughness: 0.35 }),
  bond: mat(0x8a93a3, { metalness: 0.4, roughness: 0.4 }),
  mirrorPlane: new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.16,
    side: THREE.DoubleSide, depthWrite: false }),
  frame: mat(0x1b212c, { roughness: 0.7 }),
};

/* ================= 手性四面体(CHFClBr) ================= */
function buildChiral(mirrored) {
  const g = new THREE.Group();
  const center = atom(0.26, M.C, g, 0, 0, 0);
  /* 四个不同基团,四面体方向 */
  const dirs = [
    new THREE.Vector3(0, 1.0, 0.25),        // Cl 上
    new THREE.Vector3(0.75, -0.45, 0.4),    // F
    new THREE.Vector3(-0.75, -0.35, 0.45),  // Br
    new THREE.Vector3(0, -0.25, -0.85),     // I
  ];
  const mats = [M.Cl, M.F, M.Br, M.I];
  const names = ['Cl', 'F', 'Br', 'I'];
  dirs.forEach((d, i) => {
    const dd = d.clone().normalize().multiplyScalar(0.95);
    const a = atom(0.19 + i * 0.02, mats[i], g, dd.x, dd.y, dd.z);
    const dLine = new THREE.Vector3().subVectors(a.position, center.position);
    const bondM = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, dLine.length(), 10), M.bond);
    bondM.position.copy(center.position).addScaledVector(dLine, 0.5);
    bondM.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dLine.clone().normalize());
    g.add(bondM);
    if (mirrored) {
      /* 镜像:x 分量取反 */
      a.position.x = -a.position.x;
      bondM.position.x = -bondM.position.x;
      bondM.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
        new THREE.Vector3().subVectors(a.position, center.position).normalize());
    }
  });
  return g;
}
function atom(r, m, parent, x, y, z) {
  const a = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 16), m);
  a.position.set(x, y, z);
  parent.add(a);
  return a;
}
/* 左:R;右:S(镜像) */
const molR = buildChiral(false);
molR.position.set(-1.9, 1.35, 0);
scene.add(molR);
const molS = buildChiral(true);
molS.position.set(1.9, 1.35, 0);
scene.add(molS);
/* 镜像面 */
const mirrorPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.02, 3.4), M.mirrorPlane);
mirrorPlane.position.set(0, 1.35, 0);
scene.add(mirrorPlane);
const floor = new THREE.Mesh(new THREE.BoxGeometry(8, 0.16, 4), M.floor);
floor.position.y = -0.3;
scene.add(floor);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let spinRate = 0.35;
let swapped = false;
let wallX = 0;
let tSim = 0;
let thetaR = 0.7, thetaS = 0.7;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblR = addLabel(() => L('R 构型:顺时针序(Cl→Br→F)', 'R: clockwise order (Cl→Br→F)'),
  new THREE.Vector3(-1.9, 2.7, 0), 'g', molR);
const lblS = addLabel(() => L('S 构型:它的镜像', 'S: its mirror twin'),
  new THREE.Vector3(1.9, 2.7, 0), 'm', molS);
const lblStatus = addLabel(() => swapped
  ? L('交换任意两个基团 → 变回镜像!手性中心一换,手性即翻', 'swap any two groups → mirror again! one swap flips chirality')
  : L('尝试旋转重叠:无论怎么转,Br 和 F 总对不上——手性分子不可重叠', 'try to overlap: Br and F never align — chiral molecules never superimpose'),
  new THREE.Vector3(0, 3.5, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '四面体:四个不同基团', be: 'A tetrahedron, four different groups',
    d: '碳的四根键伸向四面体四角。连上 Cl、Br、F、I 四个互不相同的基团——这颗碳就是「手性中心」。',
    de: 'Four bonds point to the corners of a tetrahedron. With Cl, Br, F, I all different, this carbon is a chirality center.',
    act: () => { swapped = false; applySwap(); } },
  { b: '镜像:另一种分子', be: 'The mirror: a different molecule',
    d: '镜面右侧是它的镜像 S 构型。两面看起来一模一样,但无论怎么旋转,四个基团总有两个对不上——不可重叠。',
    de: 'The right side mirrors it into the S form. They look identical, yet however you rotate, two groups never align — non-superimposable.',
    act: () => { swapped = false; applySwap(); } },
  { b: '旋光:一左一右', be: 'Optical rotation: opposite spins',
    d: '偏振光穿过手性分子会被旋转方向:R 转右,S 转左,等量混合(外消旋)则抵消为零——测旋光就是称手性。',
    de: 'Chiral molecules rotate plane-polarized light: R right, S left, racemic equal mix cancels — polarimetry weighs chirality.',
    act: () => { swapped = false; applySwap(); } },
  { b: '生命只认一边', be: 'Life picks one side',
    d: '氨基酸是 L 型、糖是 D 型——受体的结合口袋本身就是手性的,错误的那边可能无效甚至有害(沙利度胺悲剧)。',
    de: 'Amino acids are L, sugars are D — receptor pockets are chiral themselves; the wrong twin can be inert or harmful (thalidomide).',
    act: () => { swapped = false; applySwap(); } },
  { b: '交换两个基团=镜像', be: 'Swap two groups = mirror',
    d: '按「交换两个基团」:任意两基团互换,R 就变成 S——单次交换翻转手性,这正是 SN2 Walden 翻转的本质。',
    de: 'Press swap: exchanging any two groups flips R into S — one swap inverts chirality, the heart of the SN2 Walden inversion.',
    act: () => { swapped = !swapped; applySwap(); } },
];
function stepIndex() {
  if (swapped) return 4;
  return 1;
}
function applySwap() {
  /* swapped 时右分子换回与左完全相同的取向(重叠) */
  if (swapped) {
    molS.children.forEach((c, i) => {
      if (molR.children[i]) {
        c.position.copy(molR.children[i].position);
        c.position.x += 3.8;
      }
    });
  } else {
    molS.children.forEach((c, i) => {
      if (molR.children[i]) {
        c.position.set(
          -molR.children[i].position.x + 3.8,
          molR.children[i].position.y,
          molR.children[i].position.z);
      }
    });
  }
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((st, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(st.b, st.be)}</b>　${L(st.d, st.de)}</span>`;
    li.addEventListener('click', () => st.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elSpin = document.getElementById('spin');
const elSpinVal = document.getElementById('spinVal');
const btnMirror = document.getElementById('btnMirror');
const btnSwap = document.getElementById('btnSwap');
const tglLabels = document.getElementById('tglLabels');
const tglMirror = document.getElementById('tglMirror');
const stM = document.getElementById('stM'), stO = document.getElementById('stO'),
  stS = document.getElementById('stS');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnMirror.addEventListener('click', () => {
  wallX = wallX > -1 ? -3.6 : 0;
  mirrorPlane.position.x = wallX * 0.45;
});
btnSwap.addEventListener('click', () => { swapped = !swapped; applySwap(); });
elSpin.addEventListener('input', () => { spinRate = parseInt(elSpin.value, 10) / 100; elSpinVal.textContent = spinRate.toFixed(2) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglMirror.addEventListener('change', () => {
  mirrorPlane.visible = tglMirror.checked;
  applyTheme();
});
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    tSim += dts;
    thetaR += spinRate * dts;
    thetaS -= spinRate * dts;      // 镜像反向旋转
    molR.rotation.y = thetaR;
    molS.rotation.y = -thetaS + (swapped ? Math.PI : 0) * 0 + (swapped ? thetaR * 2 : 0);
    if (swapped) molS.rotation.y = thetaR;
  }
  stS.textContent = swapped ? L('已重叠(S→R)', 'superimposed (S→R)') : L('不可重叠 ✗', 'non-superimposable ✗');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
