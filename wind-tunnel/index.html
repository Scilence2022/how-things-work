<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>风洞与相似准则 · 把真实尺度塞进试验段</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#4dabf7;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1c7ed6;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="风洞与相似准则" data-en="Wind Tunnels & Dynamic Similarity">风洞与相似准则</h1>
  <div class="sub" data-zh="模型缩小十倍,风就得吹快十倍、或搬进高压舱——雷诺数 Re=ρvL/μ 相等,两个流场才互为镜像:风洞是台「时间机器」,把真实尺度塞进试验段的窗口;烟流线一拉,分离涡、尾流与失速当场现形 · 拖动旋转 / 空格运行/暂停" data-en="Shrink the model tenfold and the wind must blow ten times faster — or move into a pressurized rig. Only when Re = ρvL/μ matches do the two flow fields mirror each other: a wind tunnel is a time machine that squeezes full-scale flight into the test-section window; pull the smoke streamlines and separation, wakes and stall appear on the spot · drag to orbit / Space = run/pause">模型缩小十倍,风就得吹快十倍、或搬进高压舱——雷诺数 Re=ρvL/μ 相等,两个流场才互为镜像:风洞是台「时间机器」,把真实尺度塞进试验段的窗口;烟流线一拉,分离涡、尾流与失速当场现形 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <span class="k" data-zh="试验段风速" data-en="Test-section speed">试验段风速</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="雷诺数 Re" data-en="Reynolds number">雷诺数 Re</span><span class="v" id="stRe">—</span>
  <span class="k" data-zh="攻角" data-en="Angle of attack">攻角</span><span class="v" id="stA">—</span>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bCruise" data-zh="巡航吹风" data-en="Cruise run">巡航吹风</button>
    <button class="abtn" id="bStall" data-zh="失速攻角" data-en="Stall AoA">失速攻角</button>
    <button class="abtn" id="bCyl" data-zh="圆柱涡街" data-en="Cylinder street">圆柱涡街</button>
  </div>
  <div class="row">
    <label data-zh="试验段风速" data-en="Wind speed">试验段风速</label>
    <input id="sV" type="range" min="5" max="90" step="1" value="45">
    <span class="val" id="sVVal">45 m/s</span>
  </div>
  <div class="row">
    <label data-zh="模型缩比" data-en="Model scale">模型缩比</label>

  <div id="ctrl">

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>

  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../reynolds-number/" data-zh="雷诺数" data-en="Reynolds number">雷诺数</a>
    <a href="../boundary-layer/" data-zh="边界层" data-en="Boundary layer">边界层</a>
    <a href="../flow-separation/" data-zh="流动分离" data-en="Flow separation">流动分离</a>

  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-7.2,4.8,11.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.9,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=45;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与支架 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const standM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8,metalness:0.2});
for(const sx of[-2.2,2.2]){
  const st=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.55,2.8),standM);
  st.position.set(sx,0.275,0);scene.add(st);
}

/* ---- 风洞壳体:收缩段(喇叭口)- 试验段 - 扩压段,半透明剖视 ---- */
const shellM=new THREE.MeshPhysicalMaterial({color:0x9fb6c8,transparent:true,opacity:0.09,
  roughness:0.2,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const testS=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,7,30,1,true),shellM);
testS.rotation.z=-Math.PI/2;testS.position.set(0,2,0);scene.add(testS);
const contrPts=[];
for(let i=0;i<=16;i++){const t=i/16;
  contrPts.push(new THREE.Vector2(1.5+1.5*Math.pow(1-t,2.2),-9.2+t*5.7));}
const contr=new THREE.Mesh(new THREE.LatheGeometry(contrPts,36),shellM);
contr.rotation.z=-Math.PI/2;scene.add(contr);
const diff=new THREE.Mesh(new THREE.CylinderGeometry(2.6,1.5,5.5,30,1,true),shellM);
diff.rotation.z=-Math.PI/2;diff.position.set(6.25,2,0);scene.add(diff);
/* 法兰与加强箍 */
const hoopM=new THREE.MeshStandardMaterial({color:0x55606e,roughness:0.5,metalness:0.6});
for(const hx of[-9.2,-3.5,3.5,9.1]){
  const hr=hx===-9.2?3.02:(hx===9.1?2.62:1.52);
  const hp=new THREE.Mesh(new THREE.TorusGeometry(hr,0.05,8,44),hoopM);
  hp.rotation.y=Math.PI/2;hp.position.set(hx,2,0);scene.add(hp);
}
for(const hx of[-1.8,0,1.8]){
  const hp=new THREE.Mesh(new THREE.TorusGeometry(1.52,0.028,8,44),hoopM);
  hp.rotation.y=Math.PI/2;hp.position.set(hx,2,0);scene.add(hp);
}
/* 驱动风扇(扩压段末端) */
const fanG=new THREE.Group();fanG.position.set(8.6,2,0);scene.add(fanG);
fanG.add(new THREE.Mesh(new THREE.SphereGeometry(0.28,14,12),hoopM));
const fanBladeM=new THREE.MeshStandardMaterial({color:0x7f8ea0,roughness:0.4,metalness:0.5});
for(let i=0;i<6;i++){
  const bl=new THREE.Mesh(new THREE.BoxGeometry(0.06,1.95,0.3),fanBladeM);
  bl.position.y=1.05;bl.rotation.x=0.5;
  const holder=new THREE.Group();holder.rotation.x=i*Math.PI/3;holder.add(bl);fanG.add(holder);
}

/* ---- 试验段模型:机翼 / 轿车 / 圆柱(可切换) ---- */
const modelG=new THREE.Group();modelG.position.set(0,2,0);scene.add(modelG);
const afShape=new THREE.Shape();
afShape.moveTo(-0.8,0);afShape.quadraticCurveTo(-0.3,0.17,0.8,-0.02);
afShape.quadraticCurveTo(-0.3,-0.075,-0.8,0);
const afGeo=new THREE.ExtrudeGeometry(afShape,{depth:0.95,bevelEnabled:false,curveSegments:14});
afGeo.translate(0,0,-0.475);
const metalM=new THREE.MeshStandardMaterial({color:0xdde3ea,roughness:0.35,metalness:0.45});
const foil=new THREE.Mesh(afGeo,metalM);modelG.add(foil);
const sting=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,1.3,10),hoopM);
sting.position.set(0,1.25,0);scene.add(sting);
const carG=new THREE.Group();modelG.add(carG);carG.visible=false;
const carBody=new THREE.Mesh(new THREE.BoxGeometry(1.75,0.32,0.74),
  new THREE.MeshStandardMaterial({color:0xc2584c,roughness:0.35,metalness:0.3}));
carBody.position.y=0.1;carG.add(carBody);
const carCab=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.26,0.62),
  new THREE.MeshStandardMaterial({color:0x2b3540,roughness:0.2,metalness:0.4}));
carCab.position.set(-0.18,0.39,0);carG.add(carCab);
for(const wx of[0.58,-0.58])for(const wz of[0.4,-0.4]){
  const wh=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.09,16),
    new THREE.MeshStandardMaterial({color:0x15181c,roughness:0.7}));
  wh.rotation.x=Math.PI/2;wh.position.set(wx,-0.05,wz);carG.add(wh);
}
const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,1.15,26),metalM);
cyl.rotation.x=Math.PI/2;modelG.add(cyl);cyl.visible=false;

/* ---- 烟流线:26 条 × 9 粒,势流偏折 + 分离判据 ---- */
const NL=26,NP=9,NSM=NL*NP;
const smoke=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,8),
  new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),NSM);
smoke.frustumCulled=false;scene.add(smoke);
const sPX=new Float32Array(NSM),sPY=new Float32Array(NSM),sPZ=new Float32Array(NSM);
const sY0=new Float32Array(NL),sZ0=new Float32Array(NL);
for(let l=0;l<NL;l++){
  const a=l*2.399963,rr=0.14+0.82*Math.sqrt((l*0.618034)%1);
  sY0[l]=Math.sin(a)*rr*0.85;sZ0[l]=Math.cos(a)*rr*0.85;
}
for(let i=0;i<NSM;i++){
  const l=(i/NP)|0,k=i%NP,off=(l*0.37)%1;
  sPX[i]=-9.0+((k+off)/NP)*17.8;
  sPY[i]=2+sY0[l]*2;sPZ[i]=sZ0[l]*2;
  smoke.setColorAt(i,new THREE.Color(0.32,0.7,1));
}
/* 卡门涡街涡团标记(圆柱模式) */
const NV=12;
const vortexG=new THREE.InstancedMesh(new THREE.TorusGeometry(0.15,0.045,8,20),
  new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),NV);
vortexG.frustumCulled=false;scene.add(vortexG);
for(let j=0;j<NV;j++)vortexG.setColorAt(j,new THREE.Color(j%2?0xffb35c:0x5ce8d8));

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false;
let windV=45,scaleS=1,alpha=6,alphaT=6,mode='foil';
const RHO=1.225,MU=1.81e-5,CHORD=0.5,VREF=40,DEG=Math.PI/180;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('收缩段:流管收窄,气流增压加速','Contraction: area narrows — the flow speeds up'),new THREE.Vector3(-5.2,4.8,0),'b');
addLabel(()=>L(`试验段:${mode==='foil'?'机翼':mode==='car'?'轿车':'圆柱'}模型`,
              `Test section: ${mode==='foil'?'wing':mode==='car'?'car':'cylinder'} model`),
  new THREE.Vector3(0,3.8,0),'y');
addLabel(()=>L('分离点:逆压梯度撕开边界层','Separation point: adverse gradient peels the boundary layer'),
  new THREE.Vector3(-0.4,3.0,0),'r',()=>mode==='foil'&&alpha>15);
addLabel(()=>L('尾涡街:上下交替脱涡','Vortex street: vortices shed alternately'),
  new THREE.Vector3(3.4,3.5,0),'g',()=>mode==='cyl');
addLabel(()=>L(`Re 不足:等效真实风速仅 ${(windV/scaleS).toFixed(0)} m/s(巡航 ${VREF})`,
              `Low Re: equivalent full-scale speed only ${(windV/scaleS).toFixed(0)} m/s (cruise ${VREF})`),
  new THREE.Vector3(5.8,5.0,0),'y',()=>windV/scaleS<VREF);
addLabel(()=>L(`Re 与真实巡航 ${VREF} m/s 匹配`,`Re matches full-scale cruise at ${VREF} m/s`),
  new THREE.Vector3(5.8,5.0,0),'g',()=>windV/scaleS>=VREF);

function refreshScaleVal(){
  document.getElementById('sScaleVal').textContent=`1:${scaleS} · ${(windV/scaleS).toFixed(0)}m/s`;}
function setV(v){windV=clamp(v,5,90);document.getElementById('sV').value=windV;
  document.getElementById('sVVal').textContent=windV.toFixed(0)+' m/s';refreshScaleVal();}
function setScale(s){scaleS=clamp(Math.round(s),1,10);document.getElementById('sScale').value=scaleS;refreshScaleVal();}
function setAlpha(a){alphaT=clamp(a,0,20);}
function setMode(m){mode=m;foil.visible=m==='foil';carG.visible=m==='car';cyl.visible=m==='cyl';}
function markButtons(onId){
  for(const id of['bCruise','bStall','bCyl'])
    document.getElementById(id).classList.toggle('on',id===onId);
}
function cruise(a){setMode('foil');setAlpha(a);markButtons('bCruise');}
function stallRun(){setMode('foil');setAlpha(18);markButtons('bStall');}
function streetRun(){setMode('cyl');markButtons('bCyl');}
function carRun(){setMode('car');markButtons('bCyl');}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'风洞三段:收缩段加速、试验段测量、扩压段回收压力',en:'Three sections: the contraction accelerates, the test section measures, the diffuser recovers pressure',
  act(){cruise(6);setV(45);setScale(1);}},
 {zh:'烟流线贴体:层流绕流,流线光滑地抱住物面',en:'Smoke streamlines stay attached: laminar flow wraps smoothly around the body',
  act(){cruise(4);setV(25);setScale(1);}},
 {zh:'Re=ρvL/μ:相似的第一张门票——惯性对黏性之比',en:'Re = ρvL/μ, inertia over viscosity: the first ticket to dynamic similarity',
  act(){cruise(5);setV(15);setScale(1);}},
 {zh:'缩比十倍,风速就要十倍——不够就搬进高压舱',en:'Tenfold smaller model demands tenfold wind speed — or a pressurized rig',
  act(){cruise(6);setV(90);setScale(10);}},
 {zh:'攻角过大:翼背逆压梯度撕开流线,分离、失速、翻卷成尾涡',en:'Too much AoA: the adverse gradient peels the upper streamlines — separation, stall, a rolling wake',
  act(){stallRun();setV(28);setScale(1);}},
 {zh:'从莱特兄弟到全机:风洞是航空的产房',en:'From the Wright brothers to full aircraft: the wind tunnel is aviation\'s cradle',
  act(){cruise(8);setV(60);setScale(5);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stV').innerHTML=windV.toFixed(0)+'<small> m/s</small>';
  const veq=windV/scaleS,re=RHO*windV*CHORD/MU;
  const reTxt=re>=1e6?(re/1e6).toFixed(2)+'e6':(re/1e3).toFixed(0)+'e3';
  const stRe=document.getElementById('stRe');
  stRe.innerHTML=reTxt+(veq<VREF?L('<small> 不足</small>','<small> low</small>'):'');
  stRe.className='v '+(veq<VREF?'warn':'ok');
  document.getElementById('stA').innerHTML=alpha.toFixed(0)+'<small>°</small>';
  document.getElementById('stS').textContent='1:'+scaleS;
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bCruise').addEventListener('click',()=>{cruise(6);});
document.getElementById('bStall').addEventListener('click',()=>{stallRun();});
document.getElementById('bCyl').addEventListener('click',()=>{
  if(mode==='foil')streetRun();else if(mode==='cyl')carRun();else streetRun();
});
document.getElementById('sV').addEventListener('input',e=>setV(+e.target.value));
document.getElementById('sScale').addEventListener('input',e=>setScale(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglSmoke').addEventListener('change',e=>{smoke.visible=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4(),tv=new THREE.Vector3(),sv=new THREE.Vector3();
const tq=new THREE.Quaternion(),te=new THREE.Euler(),tc=new THREE.Color();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  alpha+=(alphaT-alpha)*Math.min(1,dts*2.5);
  foil.rotation.z=mode==='foil'?-alpha*DEG:0;
  fanG.rotation.x+=dts*(2+windV*0.09);
  const uMag=windV*0.085;
  const stall=mode==='foil'&&alpha>15;
  const R=mode==='foil'?0.6:(mode==='car'?0.58:0.42);
  const R2=R*R,aRad=alpha*DEG;
  if(smoke.visible){
    for(let i=0;i<NSM;i++){
      const l=(i/NP)|0;
      let px=sPX[i],py=sPY[i],pz=sPZ[i];
      let dy=py-2,dz=pz,u=uMag,vdy=0,vdz=0;
      if(px>-3.5&&px<3.5){
        const r2=px*px+dy*dy+dz*dz;
        if(r2<R*1.08*(R*1.08)){const ss=R*1.08/Math.sqrt(Math.max(r2,1e-6));dy*=ss;dz*=ss;py=2+dy;pz=dz;}
        const dd=dy*dy+dz*dz,rq2=px*px+dd,r4=rq2*rq2;
        u=uMag*(1-R2*(px*px-dd)/r4);
        vdy=-uMag*2*R2*px*dy/r4;
        vdz=-uMag*2*R2*px*dz/r4;
        if(mode==='foil'&&!stall&&px>0.2){const fw=clamp((px-0.2)/1.5,0,1);vdy-=uMag*Math.sin(aRad)*0.6*fw;}
        if(stall&&dy>0.02&&px>-0.7&&px<2.6&&Math.abs(dz)<0.7&&dy<0.85){
          u*=0.32;
          vdy+=uMag*(0.55*Math.sin(simT*11+i*2.13)+0.32*Math.sin(simT*23+i*1.71));
          vdz+=uMag*0.3*Math.sin(simT*17+i*2.9);
        }
        if(mode==='cyl'&&px>0.6){const env=clamp((px-0.6)/1.3,0,1);
          vdy+=uMag*Math.sin(px*2.2-simT*6.5+(dy>0?0:Math.PI))*0.55*env;u*=1-0.22*env;}
      }else if(px<=-3.5){
        const tt=clamp((px+9.2)/5.7,0,1),os=1+Math.pow(1-tt,2.2);
        const dop=-2.2*Math.pow(1-tt,1.2)/5.7;
        vdy=u*(dy/os)*dop;vdz=u*(dz/os)*dop;
      }else{
        const os2=1+0.7333*clamp((px-3.5)/5.5,0,1);
        vdy=u*dy*0.1333/os2;vdz=u*dz*0.1333/os2;
      }
      px+=u*dts;py+=vdy*dts;pz+=vdz*dts;
      if(px>9.3){px=-9.0;py=2+sY0[l]*2+(Math.random()-0.5)*0.06;pz=sZ0[l]*2+(Math.random()-0.5)*0.06;}
      const ny=py-2,nz=pz,rq3=ny*ny+nz*nz;
      if(rq3>1.32*1.32){const ss=1.32/Math.sqrt(rq3);py=2+ny*ss;pz=nz*ss;}
      sPX[i]=px;sPY[i]=py;sPZ[i]=pz;
      const turb=stall&&px>-0.7&&px<2.6&&py-2>0.02;
      if(turb)tc.setRGB(1,0.45,0.4);
      else if(mode==='cyl'&&px>0.7)tc.setRGB(0.4,0.92,0.85);
      else tc.setRGB(0.32,0.7,1);
      smoke.setColorAt(i,tc);
      const sc=turb?1.5:1;
      m4.makeScale(sc,sc,sc);m4.setPosition(px,py,pz);
      smoke.setMatrixAt(i,m4);
    }
    smoke.instanceMatrix.needsUpdate=true;
    if(smoke.instanceColor)smoke.instanceColor.needsUpdate=true;
  }
  /* 涡街涡团 */
  vortexG.visible=smoke.visible&&mode==='cyl';
  if(vortexG.visible){
    const shed=uMag/9;
    for(let j=0;j<NV;j++){
      const p=(simT*shed+j/NV)%1;
      const xx=0.55+p*7.2;
      const yy=2+(j%2?1:-1)*(0.3+0.42*Math.min(1,p*2.2))*(1-0.25*p);
      te.set(0,0,simT*7+j*2.1);tq.setFromEuler(te);
      m4.compose(tv.set(xx,yy,0),tq,sv.setScalar(0.4+2.6*p*(1-p)));
      vortexG.setMatrixAt(j,m4);
    }
    vortexG.instanceMatrix.needsUpdate=true;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setV(45);setScale(1);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
