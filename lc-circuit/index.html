<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电感与 LC 回路 · 电场⇄磁场以 ω=1/√(LC) 荡秋千</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#20c997;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#0ca678;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(32,201,151,.6);background:rgba(32,201,151,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(12,166,120,.55);background:rgba(12,166,120,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(32,201,151,.10);border-color:rgba(32,201,151,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(12,166,120,.08);border-color:rgba(12,166,120,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#c3fae8}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="电感与 LC 回路" data-en="The Inductor & LC Tank">电感与 LC 回路</h1>
  <div class="sub" data-zh="电感是电流的飞轮:电流想变它就用反电动势顶回去;把充电电容接上电感,电场能和磁场能就荡起秋千,ω=1/√(LC)——全世界的收音机靠它选台 · 拖动旋转 / 空格运行/暂停" data-en="An inductor is the flywheel of current: try to change it and the back-EMF pushes back; wire a charged capacitor to a coil and field energy swings between them at ω=1/√(LC) — every radio dial in the world tunes this way · drag to orbit / Space = run/pause">电感是电流的飞轮:电流想变它就用反电动势顶回去;把充电电容接上电感,电场能和磁场能就荡起秋千,ω=1/√(LC)——全世界的收音机靠它选台 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="电容电压" data-en="Cap voltage">电容电压</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="回路电流" data-en="Current">回路电流</span><span class="v" id="stI">—</span>
  <span class="k" data-zh="磁场储能占比" data-en="Energy in L">磁场储能占比</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="振荡频率" data-en="Frequency">振荡频率</span><span class="v" id="stF">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bCharge" data-zh="充电电容" data-en="Charge cap">充电电容</button>
    <button class="abtn" id="bClose" data-zh="接通电感!" data-en="Close to coil!">接通电感!</button>
    <button class="abtn" id="bSweep" data-zh="扫频看谐振峰" data-en="Sweep">扫频看谐振峰</button>
  </div>
  <div class="row">
    <label data-zh="电感 L" data-en="Inductance L">电感 L</label>
    <input id="sL" type="range" min="0.2" max="5" step="0.1" value="1">
    <span class="val" id="sLVal">1.0 mH</span>
  </div>
  <div class="row">
    <label data-zh="电容 C" data-en="Capacitance C">电容 C</label>
    <input id="sC" type="range" min="0.2" max="5" step="0.1" value="1">
    <span class="val" id="sCVal">1.0 nF</span>
  </div>
  <div class="row">
    <label data-zh="电阻 R" data-en="Resistance R">电阻 R</label>
    <input id="sR" type="range" min="0" max="10" step="0.1" value="0.5">
    <span class="val" id="sRVal">0.5 Ω</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCurve" type="checkbox" checked> <span data-zh="波形曲线" data-en="Waveform">波形曲线</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../electromagnetic-induction/" data-zh="电磁感应" data-en="Electromagnetic Induction">电磁感应</a>
    <a href="../transformer/" data-zh="变压器" data-en="The Transformer">变压器</a>
    <a href="../buck-converter/" data-zh="开关电源" data-en="The Buck Converter">开关电源</a>
    <a href="../resonance-beats/" data-zh="共振与拍" data-en="Resonance & Beats">共振与拍</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,52);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.8,3.4,7.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=35;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 实验台 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const benchM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const bench=new THREE.Mesh(new THREE.BoxGeometry(7,0.7,2.6),benchM);
bench.position.set(0,0.35,0);scene.add(bench);

/* ---- 电容(两块极板+介质) ---- */
const CAPX=-1.9;
const plateM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.2,metalness:0.85});
const pl1=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,0.06),plateM);
pl1.position.set(CAPX,1.5,-0.22);scene.add(pl1);
const pl2=pl1.clone();pl2.position.z=0.22;scene.add(pl2);
const dielM=new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.18});
const diel=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,0.44),dielM);
diel.position.set(CAPX,1.5,0);scene.add(diel);
/* 极板电荷点 */
const qP=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xff6b6b,emissiveIntensity:0.5});
const qN=new THREE.MeshStandardMaterial({color:0x4dabf7,emissive:0x4dabf7,emissiveIntensity:0.5});
const NPQ=14;
const chTop=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),qP,NPQ);
const chBot=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),qN,NPQ);
scene.add(chTop);scene.add(chBot);
const m4=new THREE.Matrix4();

/* ---- 电感(螺旋线圈) ---- */
const INDx=1.9;
function coilGeo(R,r,turns,seg){
  const pts=[];
  for(let i=0;i<=seg;i++){
    const t=i/seg;
    const a=t*turns*Math.PI*2;
    pts.push(new THREE.Vector3(R*Math.cos(a),R*0.9*Math.sin(a),-0.55+t*1.1));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),seg*2,r,10);
}
const coilM=new THREE.MeshStandardMaterial({color:0xb08968,roughness:0.3,metalness:0.7});
const coil=new THREE.Mesh(coilGeo(0.55,0.07,6,120),coilM);
coil.position.set(INDx,1.5,0);scene.add(coil);
/* 磁场环(电流通过时亮起) */
const fluxM=new THREE.MeshBasicMaterial({color:0x20c997,transparent:true,opacity:0,
  side:THREE.DoubleSide,depthWrite:false});
const fluxRings=[];
for(let i=0;i<5;i++){
  const fr=new THREE.Mesh(new THREE.TorusGeometry(0.75,0.015,8,40),fluxM);
  fr.position.set(INDx,1.5,-0.44+i*0.22);
  scene.add(fr);fluxRings.push(fr);
}

/* ---- 导线回路 ---- */
const wireM=new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:0.35,metalness:0.6});
const wirePts=[
  new THREE.Vector3(CAPX,0.8,-0.22),new THREE.Vector3(CAPX,0.6,-1.0),
  new THREE.Vector3(INDx,0.6,-1.0),new THREE.Vector3(INDx,0.8,-0.55)];
const w1=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(wirePts),24,0.035,8),wireM);
scene.add(w1);
const wirePts2=[
  new THREE.Vector3(CAPX,0.8,0.22),new THREE.Vector3(CAPX,0.6,1.0),
  new THREE.Vector3(INDx,0.6,1.0),new THREE.Vector3(INDx,0.8,0.55)];
const w2=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(wirePts2),24,0.035,8),wireM);
scene.add(w2);
/* 开关(闭合动画) */
const swG=new THREE.Group();swG.position.set(0,0.6,-1.0);scene.add(swG);
const swBar=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.08,0.12),plateM);
swBar.position.set(-0.6,0.06,0);swBar.geometry.translate(0.6,0,0);
swG.add(swBar);
/* 电阻(阻尼模式可见) */
const resM=new THREE.MeshStandardMaterial({color:0xc92a2a,roughness:0.5});
const resistor=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.5,12),resM);
resistor.rotation.z=Math.PI/2;resistor.position.set(0,0.6,1.0);scene.add(resistor);

/* ---- 电流粒子(沿回路跑) ---- */
const NPART=26;
const partM=new THREE.MeshStandardMaterial({color:0xffe066,emissive:0xffe066,emissiveIntensity:0.7});
const parts=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),partM,NPART);
parts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(parts);
const loopCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(CAPX,0.8,0.22),new THREE.Vector3(CAPX,0.6,1.0),
  new THREE.Vector3(0,0.6,1.15),new THREE.Vector3(INDx,0.6,1.0),
  new THREE.Vector3(INDx,0.8,0.55),new THREE.Vector3(INDx,2.2,0),
  new THREE.Vector3(INDx,0.8,-0.55),new THREE.Vector3(INDx,0.6,-1.0),
  new THREE.Vector3(0,0.6,-1.15),new THREE.Vector3(CAPX,0.6,-1.0),
  new THREE.Vector3(CAPX,0.8,-0.22),new THREE.Vector3(CAPX,2.2,0)
],true);

/* ---- 能量柱(电场/磁场) ---- */
const barE=new THREE.Mesh(new THREE.BoxGeometry(0.5,1,0.5),
  new THREE.MeshStandardMaterial({color:0xff6b6b,transparent:true,opacity:0.6}));
barE.position.set(CAPX,3.2,0);scene.add(barE);
const barM=new THREE.Mesh(new THREE.BoxGeometry(0.5,1,0.5),
  new THREE.MeshStandardMaterial({color:0x20c997,transparent:true,opacity:0.6}));
barM.position.set(INDx,3.2,0);scene.add(barM);

/* ---- 状态与物理 ---- */
let Lc=1.0,Cc=1.0,Rc=0.5,V0=5,playing=true,labelsOn=true,slowMo=false,curveOn=true;
let mode='charge';/* charge | run | sweep */
let Q=V0*1e-9,I=0,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function omega(){return 1/Math.sqrt(Lc*1e-3*Cc*1e-9);}/* rad/s */
function f0(){return omega()/(2*Math.PI);}
/* 数值积分(RLC):dQ/dt=I, dI/dt=(-Q/C - I·R)/L */

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('电容:电场能仓库 ½CV²','Capacitor: the electric-field bank, ½CV²'),
  new THREE.Vector3(CAPX,2.6,0),'r');
addLabel(()=>L('电感:电流的飞轮,反电动势顶住变化','Inductor: the current flywheel, back-EMF resists change'),
  new THREE.Vector3(INDx,2.6,0),'g');
addLabel(()=>{const fE=0.5*Q*Q/(Cc*1e-9),fM=0.5*Lc*1e-3*I*I,tt=fE+fM;
  return L(`磁场占比 ${tt>0?(100*fM/tt).toFixed(0):0} %`,`Magnetic share ${tt>0?(100*fM/tt).toFixed(0):0} %`);},
  new THREE.Vector3(0,4.0,0),'y',()=>mode!=='charge');
addLabel(()=>L(`f₀ = 1/(2π√(LC)) = ${f0().toFixed(2)} MHz`,`f₀ = 1/(2π√(LC)) = ${f0().toFixed(2)} MHz`),
  new THREE.Vector3(0,4.6,0),'b');

/* ---- 控件 ---- */
function setL(v){Lc=clamp(v,0.2,5);
  document.getElementById('sL').value=Lc;
  document.getElementById('sLVal').textContent=Lc.toFixed(1)+' mH';updateStats();}
function setC(v){Cc=clamp(v,0.2,5);
  document.getElementById('sC').value=Cc;
  document.getElementById('sCVal').textContent=Cc.toFixed(1)+' nF';updateStats();}
function setR(v){Rc=clamp(v,0,10);
  document.getElementById('sR').value=Rc;
  document.getElementById('sRVal').textContent=Rc.toFixed(1)+' Ω';
  resistor.visible=Rc>0.01;updateStats();}
function doCharge(){mode='charge';Q=V0*1e-9;I=0;
  document.getElementById('bCharge').classList.add('on');
  document.getElementById('bClose').classList.remove('on');
  document.getElementById('bSweep').classList.remove('on');updateStats();}
function doRun(){mode='run';
  document.getElementById('bClose').classList.add('on');
  document.getElementById('bCharge').classList.remove('on');updateStats();}
let sweepT=0;
function doSweep(){mode='sweep';sweepT=0;doRun();
  document.getElementById('bSweep').classList.add('on');updateStats();}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'给电容充电:电场能就位',en:'Charge the capacitor: field energy on standby',
  act(){doCharge();setL(1);setC(1);setR(0.5);}},
 {zh:'接通电感:电压推着电流爬,磁场储能',en:'Close to the coil: voltage drives current, the field banks it',
  act(){doRun();setR(0.2);}},
 {zh:'过零反转:电感顶着电流反充电容',en:'Zero crossing: the inductor drives current back, re-charging C',
  act(){doRun();}},
 {zh:'LC 秋千:电场⇄磁场,相位差 90°',en:'The LC swing: field to field, 90° out of phase',
  act(){doRun();setR(0.05);}},
 {zh:'加电阻:每次过零都掉一层,阻尼衰减',en:'Add resistance: every pass sheds a layer — damping',
  act(){doRun();setR(4);}},
 {zh:'扫频:谐振峰立在 f₀ 上,选台就靠它',en:'Sweep: the resonance spike stands on f₀ — how radios tune',
  act(){doSweep();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stV').innerHTML=(Q/1e-9).toFixed(2)+'<small> V</small>';
  document.getElementById('stI').innerHTML=Math.abs(I*1000).toFixed(1)+'<small> mA</small>';
  const fE=0.5*Q*Q/(Cc*1e-9),fM=0.5*Lc*1e-3*I*I,tt=fE+fM;
  const ev=document.getElementById('stE');
  ev.innerHTML=(tt>0?(100*fM/tt).toFixed(0):0)+'<small> %</small>';
  ev.className='v '+(tt>0&&fM/tt>0.5?'ok':'');
  document.getElementById('stF').innerHTML=f0().toFixed(2)+'<small> MHz</small>';
}

/* ---- 事件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bCharge').addEventListener('click',doCharge);
document.getElementById('bClose').addEventListener('click',doRun);
document.getElementById('bSweep').addEventListener('click',doSweep);
document.getElementById('sL').addEventListener('input',e=>setL(+e.target.value));
document.getElementById('sC').addEventListener('input',e=>setC(+e.target.value));
document.getElementById('sR').addEventListener('input',e=>setR(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCurve').addEventListener('change',e=>{curveOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,visT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 数值积分(RLC) */
  if(mode!=='charge'){
    const C=Cc*1e-9,Lh=Lc*1e-3;
    const sub=8;
    for(let s=0;s<sub;s++){
      const h=dts/sub;
      const dI=(-Q/C-I*Rc)/Lh;
      I+=dI*h;Q+=I*h;
    }
  }
  const vCap=Q/1e-9;
  /* 开关角度 */
  swBar.rotation.y+=(mode==='charge'?-1.1:0-swBar.rotation.y)*Math.min(1,dt*6);
  /* 电流可视化:粒子沿环路跑,方向与幅值随 I */
  const iNorm=clamp(I/(3e-3),-1,1);
  for(let i=0;i<NPART;i++){
    const t=(i/NPART+simT*0.12*Math.sign(iNorm)*(0.25+0.75*Math.abs(iNorm)))%1;
    const tt=(t+1)%1;
    const p=loopCurve.getPointAt(tt);
    const s=(mode!=='charge'&&Math.abs(iNorm)>0.02)?1:0.001;
    m4.makeScale(s,s,s);m4.setPosition(p);
    parts.setMatrixAt(i,m4);
  }
  parts.instanceMatrix.needsUpdate=true;
  partM.opacity=1;
  /* 磁场环亮度 */
  const mFlux=clamp(Math.abs(iNorm),0,1);
  fluxM.opacity=0.05+0.4*mFlux*(mode!=='charge'?1:0);
  for(const [k,fr] of fluxRings.entries()){
    fr.scale.setScalar(1+0.06*Math.sin(simT*3+k));
  }
  /* 电容极板电荷点 */
  const nShow=clamp(Math.round(Math.abs(vCap)/V0*NPQ),0,NPQ);
  const sgn=vCap>=0?1:-1;
  for(let i=0;i<NPQ;i++){
    const x=CAPX-0.45+(i%7)*0.15,y=1.0+Math.floor(i/7)*0.24;
    m4.makeScale(1,1,1);m4.setPosition(x,y,-0.28*sgn);
    chTop.setMatrixAt(i,m4);
    m4.setPosition(x,y,0.28*sgn);
    chBot.setMatrixAt(i,m4);
  }
  chTop.count=nShow;chBot.count=nShow;
  chTop.instanceMatrix.needsUpdate=true;chBot.instanceMatrix.needsUpdate=true;
  /* 能量柱 */
  const fE=0.5*Q*Q/(Cc*1e-9),fM=0.5*Lc*1e-3*I*I;
  const eMax=0.5*V0*V0*1e-9/1;
  barE.scale.y=clamp(fE/eMax,0.03,1);barE.position.y=2.7+barE.scale.y/2;
  barM.scale.y=clamp(fM/eMax,0.03,1);barM.position.y=2.7+barM.scale.y/2;
  /* 扫频模式:外部信号源扫频,LC 上电压响应 */
  if(mode==='sweep'){
    sweepT+=dts;
    const fs=0.2+3.8*((sweepT/6)%1);
    const wT=2*Math.PI*fs;
    /* 受迫响应幅值(玩具洛伦兹) */
    const w0=omega();
    const resp=1/Math.sqrt(Math.pow(1-Math.pow(wT/w0,2),2)+Math.pow(wT*w0*2e-12*Rc/Lc,2)+1e-9);
    Q=1e-9*clamp(resp,0.05,6)*Math.sin(wT*simT*4)*V0/3;
    if(sweepT>6)sweepT-=6;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.1){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
resistor.visible=Rc>0.01;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
