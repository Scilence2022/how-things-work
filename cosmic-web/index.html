<style>

  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}

  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;

  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;

  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #play:hover{filter:brightness(1.12)}

  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- renderer ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,600);
camera.position.set(58,42,58);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(16,16,16); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=8; controls.maxDistance=220;
scene.add(new THREE.AmbientLight(0xffffff,0.7));

/* ---- 物理模型：Zel'dovich 近似 ----
   初始涨落 δ0 ~ 光滑随机场；解 ∇²Φ=δ0 得位移势，
   x(t) = q + D(t)·ψ(q)，ψ=-∇Φ。EdS 近似 D(t)=a(t)=(t/t0)^{2/3}。
   演示把 σ8（涨落幅度）做成滑块：0 → 永远均匀（对照），>1 → 提前成网。
   粒子流进 caustic（无限薄吸积面）= 现实中的纤维/节点。 */
const NG=32, NP=NG*NG*NG; // 32768 颗粒子 = 32³ 网格
let seedA=20240914, seedB=7;
const rnd=()=>{seedA=(seedA*1664525+1013904223)>>>0;return seedA/4294967296;};
let phi=new Float32Array(NP), phi2=new Float32Array(NP);
let psix=new Float32Array(NP), psiy=new Float32Array(NP), psiz=new Float32Array(NP);
function idx(i,j,k){return (i*NG+j)*NG+k;}
function buildField(){
  /* 1) 白噪声 2) 三次盒式滤波 → 光滑势 Φ 3) 中心差分 → 位移场 ψ */
  for(let n=0;n<NP;n++)phi[n]=rnd()*2-1;
  for(let it=0;it<3;it++){
    for(let i=0;i<NG;i++)for(let j=0;j<NG;j++)for(let k=0;k<NG;k++){
      const c=idx(i,j,k);
      const xp=idx((i+1)%NG,j,k),xm=idx((i-1+NG)%NG,j,k);
      const yp=idx(i,(j+1)%NG,k),ym=idx(i,(j-1+NG)%NG,k);
      const zp=idx(i,j,(k+1)%NG),zm=idx(i,j,(k-1+NG)%NG);
      phi2[c]=(phi[c]*2+phi[xp]+phi[xm]+phi[yp]+phi[ym]+phi[zp]+phi[zm])/8;
    }
    [phi,phi2]=[phi2,phi];
  }
  let rms=0;
  for(let i=0;i<NG;i++)for(let j=0;j<NG;j++)for(let k=0;k<NG;k++){
    const c=idx(i,j,k);
    psix[c]=-(phi[idx((i+1)%NG,j,k)]-phi[idx((i-1+NG)%NG,j,k)])*0.5;
    psiy[c]=-(phi[idx(i,(j+1)%NG,k)]-phi[idx(i,(j-1+NG)%NG,k)])*0.5;
    psiz[c]=-(phi[idx(i,j,(k+1)%NG)]-phi[idx(i,j,(k-1+NG)%NG)])*0.5;
    rms+=psix[c]*psix[c]+psiy[c]*psiy[c]+psiz[c]*psiz[c];
  }
  rms=Math.sqrt(rms/(NP*3));
  const s=0.62/Math.max(rms,1e-6); // 归一化：RMS 位移 ≈ 0.62 格，峰区 ~3 格 → 末期 caustic
  for(let n=0;n<NP;n++){psix[n]*=s;psiy[n]*=s;psiz[n]*=s;}
}
buildField();

/* ---- 3D 场景 ---- */
const worldG=new THREE.Group(); scene.add(worldG);
const boxH=new THREE.Box3Helper(new THREE.Box3(new THREE.Vector3(0,0,0),new THREE.Vector3(NG,NG,NG)),0x33506b);
worldG.add(boxH);
const fullPos=new Float32Array(NP*3), fullCol=new Float32Array(NP*3);
/* 切片粒子（z∈[15,16) 的两层） */
const sliceIdx=[];
for(let i=0;i<NG;i++)for(let j=0;j<NG;j++)for(let k=15;k<17;k++)sliceIdx.push(idx(i,j,k));
const slicePos=new Float32Array(sliceIdx.length*3), sliceCol=new Float32Array(sliceIdx.length*3);
const fullGeo=new THREE.BufferGeometry();
fullGeo.setAttribute('position',new THREE.BufferAttribute(fullPos,3));
fullGeo.setAttribute('color',new THREE.BufferAttribute(fullCol,3));
const fullPts=new THREE.Points(fullGeo,new THREE.PointsMaterial({size:0.17,vertexColors:true,sizeAttenuation:true}));
worldG.add(fullPts);
const sliceGeo=new THREE.BufferGeometry();
sliceGeo.setAttribute('position',new THREE.BufferAttribute(slicePos,3));
sliceGeo.setAttribute('color',new THREE.BufferAttribute(sliceCol,3));
const slicePts=new THREE.Points(sliceGeo,new THREE.PointsMaterial({size:0.24,vertexColors:true,sizeAttenuation:true}));
slicePts.visible=false; worldG.add(slicePts);
/* 点亮节点（星系）——加色橙点 */
const MAXN=220;
const nodePos=new Float32Array(MAXN*3);
const nodeGeo=new THREE.BufferGeometry();
nodeGeo.setAttribute('position',new THREE.BufferAttribute(nodePos,3));
nodeGeo.setDrawRange(0,0);
const nodePts=new THREE.Points(nodeGeo,new THREE.PointsMaterial({size:0.55,color:0xffb35c,transparent:true,opacity:0.95,
  blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
worldG.add(nodePts);
const nodeGlow=new THREE.Points(nodeGeo,nodePts.material.clone());
nodeGlow.material.size=1.1;nodeGlow.material.opacity=0.28;worldG.add(nodeGlow);

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);worldG.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblNode=new THREE.Vector3(), lblFil=new THREE.Vector3(), lblVoid=new THREE.Vector3();
addLabel(()=>L('节点 · 星系团在引力井底','Node · clusters sink in gravity wells'),lblNode,'o',()=>annOn&&nodes.length>0);
addLabel(()=>L('纤维 · 物质沿丝流进节点','Filament · matter streams along strands'),lblFil,'g',()=>annOn&&nodes.length>1);
addLabel(()=>L('空洞 · 被引力掏空的气泡','Void · evacuated by gravity'),lblVoid,'b',()=>annOn&&nodes.length>1);

/* ---- 状态 ---- */
const Q=new URLSearchParams(location.search);
let playing=!Q.has('pause');
let simT=0.3, gain=1.0, rate=1.9; // Gyr 播放速率
let sliceOn=false, annOn=false, labelsOn=Q.get('labels')!=='0';
if(Q.get('speed'))rate*=Math.max(0.1,Math.min(20,+Q.get('speed')||1));
const dens=new Float32Array(NP);
let nodes=[], dmax=1, clumped=0;

const Dof=t=>Math.pow(Math.max(t,1e-3)/13.8,2/3); // EdS 生长因子

/* ---- 每帧演化：位置 = q + gain·D·ψ；沉积密度 → 着色/找节点 ---- */
function evolve(){
  const D=gain*Dof(simT);
  for(let i=0;i<NG;i++)for(let j=0;j<NG;j++)for(let k=0;k<NG;k++){
    const c=idx(i,j,k),p=c*3;
    fullPos[p]  =i+D*psix[c];
    fullPos[p+1]=j+D*psiy[c];
    fullPos[p+2]=k+D*psiz[c];
  }
  fullGeo.attributes.position.needsUpdate=true;
  for(let n=0;n<sliceIdx.length;n++){
    const c=sliceIdx[n],p=c*3,q=n*3;
    slicePos[q]=fullPos[p];slicePos[q+1]=fullPos[p+1];slicePos[q+2]=fullPos[p+2];
    sliceCol[q]=fullCol[p];sliceCol[q+1]=fullCol[p+1];sliceCol[q+2]=fullCol[p+2];
  }
  sliceGeo.attributes.position.needsUpdate=true;
  sliceGeo.attributes.color.needsUpdate=true;
}
function deposit(){
  dens.fill(0);dmax=1;let clumpCnt=0;
  for(let n=0;n<NP;n++){
    const p=n*3;
    const x=clamp(fullPos[p]|0,0,NG-1),y=clamp(fullPos[p+1]|0,0,NG-1),z=clamp(fullPos[p+2]|0,0,NG-1);
    dens[idx(x,y,z)]++;
  }
  for(let c=0;c<NP;c++){
    const d=dens[c];if(d>dmax)dmax=d;if(d>=4)clumpCnt++;
    const p=c*3;
    if(d===0){fullCol[p]=0.07;fullCol[p+1]=0.13;fullCol[p+2]=0.26;}
    else if(d===1){fullCol[p]=0.30;fullCol[p+1]=0.40;fullCol[p+2]=0.58;}
    else if(d===2){fullCol[p]=0.62;fullCol[p+1]=0.68;fullCol[p+2]=0.78;}
    else if(d<=4){fullCol[p]=0.92;fullCol[p+1]=0.90;fullCol[p+2]=0.85;}
    else if(d<=12){fullCol[p]=1.0;fullCol[p+1]=0.72;fullCol[p+2]=0.40;}
    else{fullCol[p]=1.0;fullCol[p+1]=0.42;fullCol[p+2]=0.18;}
  }
  fullGeo.attributes.color.needsUpdate=true;
  clumped=clumpCnt/NP;
}
function findNodes(){
  /* 局部极大且密度高 → 点亮为星系；彼此间隔 ≥3 格 */
  const cand=[];
  for(let i=1;i<NG-1;i++)for(let j=1;j<NG-1;j++)for(let k=1;k<NG-1;k++){
    const d=dens[idx(i,j,k)];
    if(d<14)continue;
    let mx=true;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++)
      if(dens[idx(i+dx,j+dy,k+dz)]>d){mx=false;break;}
    if(mx)cand.push([i,j,k,d]);
  }
  cand.sort((a,b)=>b[3]-a[3]);
  const out=[];
  for(const c of cand){
    if(out.some(o=>Math.hypot(o[0]-c[0],o[1]-c[1],o[2]-c[2])<3.2))continue;
    out.push(c);if(out.length>=MAXN)break;
  }
  nodes=out;
  for(let n=0;n<out.length;n++){
    nodePos[n*3]=out[n][0];nodePos[n*3+1]=out[n][1];nodePos[n*3+2]=out[n][2];
  }
  nodeGeo.setDrawRange(0,out.length);
  nodeGeo.attributes.position.needsUpdate=true;
  /* 标注位置：最强节点 / 两强节点间（纤维） / 最空区域（空洞） */
  if(out.length){
    const a=out[0],b=out[1]||out[0];
    lblNode.set(a[0],a[1],a[2]);
    lblFil.set((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);
    /* 找最低密度胞 */
    let best=1e9,bi=[16,16,16];
    for(let i=3;i<NG-3;i+=2)for(let j=3;j<NG-3;j+=2)for(let k=3;k<NG-3;k+=2){
      let s=0;
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++)s+=dens[idx(i+dx,j+dy,k+dz)];
      if(s<best){best=s;bi=[i,j,k];}
    }
    lblVoid.set(bi[0],bi[1],bi[2]);
  }
}

/* ---- UI ---- */
const STEPS=[
 {zh:'初始涨落：CMB 里 ±10⁻⁵ 的密度涟漪——宇宙近乎均匀，但不完全均匀',en:'Initial ripples: ±10⁻⁵ density fluctuations in the CMB — nearly uniform, not quite',
  act(){setT(0.3);}},
 {zh:'引力放大：过密区引力更强，吸走周围物质；δ 滚雪球，D(t)∝t^{2/3} 增长',en:'Gravitational amplification: overdense regions pull harder; δ snowballs, D∝t^{2/3}',
  act(){setT(2.5);}},
 {zh:'Zel\'dovich 塌缩：x = q + D·ψ(q)——粒子最先压成「薄饼」状的墙',en:"Zel'dovich collapse: x = q + D·ψ(q) — matter first flattens into pancakes",
  act(){setT(6);}},
 {zh:'织成网：墙相交成纤维，纤维拧成节点；稀处被掏空成巨大空洞',en:'The web: walls cross into filaments, filaments braid into nodes; voids hollow out',
  act(){setT(10);}},
 {zh:'暗物质骨架点亮：气体沿丝流进引力井，点燃恒星成为星系与星系团',en:'Lighting the skeleton: gas streams down filaments into wells, igniting galaxies',
  act(){setT(13.8);annOn=true;}},
 {zh:'巡天印证：SDSS / DESI 切片图与数值模拟同构——这张网是引力「算」出来的',en:'Surveys agree: SDSS/DESI slices match simulations — the web is computed by gravity',
  act(){setT(13.8);annOn=true;sliceOn=true;}}
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();STEPS[i].act();applyUI();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function setT(t){simT=t;document.getElementById('sT').value=t;
  document.getElementById('sTVal').textContent=t.toFixed(2)+' Gyr';}
function updateStats(){
  document.getElementById('stT').innerHTML=simT.toFixed(2)+'<small> Gyr</small>';
  document.getElementById('stD').innerHTML=(gain*Dof(simT)).toFixed(2)+'<small> ×</small>';
  document.getElementById('stDm').innerHTML=dmax+'<small> ×均密</small>';
  document.getElementById('stN').innerHTML=nodes.length+'<small> / '+MAXN+'</small>';
}
function applyUI(){
  document.getElementById('btnSlice').classList.toggle('on',sliceOn);
  document.getElementById('btnAnn').classList.toggle('on',annOn);
  fullPts.visible=!sliceOn;slicePts.visible=sliceOn;
  document.getElementById('sAVal').textContent=gain.toFixed(2)+'×';
  document.getElementById('sTVal').textContent=simT.toFixed(2)+' Gyr';
}
document.getElementById('sT').addEventListener('input',e=>{simT=+e.target.value;applyUI();});
document.getElementById('sA').addEventListener('input',e=>{gain=+e.target.value;applyUI();});
document.getElementById('btnSlice').addEventListener('click',()=>{
  sliceOn=!sliceOn;
  if(sliceOn){camera.position.set(16,16,86);controls.target.set(16,16,16);}
  else{camera.position.set(58,42,58);}
  applyUI();});
document.getElementById('btnAnn').addEventListener('click',()=>{annOn=!annOn;applyUI();});
document.getElementById('btnSeed').addEventListener('click',()=>{buildField();evolve();deposit();findNodes();});
document.getElementById('btnFast').addEventListener('click',()=>{playing=true;syncPlay();});
function syncPlay(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlay();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';
  localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x07090c:0xdde6ee);
  boxH.material.color.setHex(THEME==='dark'?0x33506b:0x8aa5bd);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();syncPlay();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0,nacc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    simT+=dt*rate;
    if(simT>=13.8){simT=13.8;playing=false;syncPlay();}
    document.getElementById('sT').value=simT;
    document.getElementById('sTVal').textContent=simT.toFixed(2)+' Gyr';
  }
  evolve();
  nacc+=dt;
  if(nacc>0.12||simT<1){nacc=0;deposit();if(simT>4)findNodes();else nodes=[];}
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
applyTheme();applyLang();applyUI();
evolve();deposit();updateStats();
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
start();
</script>
