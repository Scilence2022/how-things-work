<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自由基聚合 · 从单体到塑料</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(176,118,31,.9); color: #9c6f00; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.m { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.y { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(255,209,102,.26); }
  .abtn.danger { background: rgba(255,107,107,.12); border-color: rgba(255,107,107,.5); }
  .abtn:disabled { opacity: 0.4; cursor: default; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="自由基聚合:从单体到塑料" data-en="Free-Radical Polymerization: monomer → plastic">自由基聚合:从单体到塑料</h1>
  <div class="sub" data-zh="引发剂劈开成自由基 → 抓住乙烯基单体 → 链式生长到几千个单元 → 两链相撞或歧化终止 · 空格播放/暂停" data-en="Initiator splits into radicals → grabs vinyl monomers → chain grows to thousands of units → terminates on collision or disproportionation · Space = play/pause">引发剂劈开成自由基 → 抓住乙烯基单体 → 链式生长到几千个单元 → 两链相撞或歧化终止 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="活性链" data-en="active chains">活性链</span><span class="v g" id="stAlive">0</span>
  <span class="k" data-zh="平均聚合度" data-en="avg degree (n)">平均聚合度</span><span class="v" id="stDP">—</span>
  <span class="k" data-zh="已消耗单体" data-en="monomers used">已消耗单体</span><span class="v" id="stUsed">0</span>
  <span class="k" data-zh="材料性质" data-en="material">材料性质</span><span class="v" id="stMat" style="font-size:14px">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.m" data-zh="乙烯基单体" data-en="vinyl monomer">乙烯基单体</span>
    <span class="chip.r" data-zh="自由基(活性端)" data-en="radical (live end)">自由基(活性端)</span>
    <span class="chip.y" data-zh="引发剂" data-en="initiator">引发剂</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnInit" data-zh="投引发剂(加热)" data-en="add initiator (heat)">投引发剂(加热)</button>
    <button class="abtn danger" id="btnStop" data-zh="终止(淬灭)" data-en="quench (terminate)">终止(淬灭)</button>
  </div>
  <div class="row"><label data-zh="单体浓度" data-en="monomer feed">单体浓度</label><input id="feed" type="range" min="0" max="100" step="1" value="60"><span class="val" id="feedVal">60%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../radical-chain/" data-zh="同款自由基:氯代链反应" data-en="same radicals: chlorination">同款自由基:氯代链反应</a>
    <a href="../electrophilic-addition/" data-zh="双键打开的另一种方式" data-en="another way to open a C=C">双键打开的另一种方式</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  flaskGlow.visible = THEME === 'dark';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('自由基聚合', 'Free-Radical Polymerization');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 1.2, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.45;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}
const M = {
  C: mat(0x63e6be), H: mat(0xe9ecef, { roughness: 0.4 }),
  bond: mat(0x8a93a3, { metalness: 0.4 }),
  bondD: mat(0xffd166, { metalness: 0.4 }),
  init: mat(0xffd166, { emissiveIntensity: 0.5 }),
  rad: new THREE.MeshBasicMaterial({ color: 0xff6b6b, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.9 }),
  dead: mat(0x9aa7b8, { opacity: 0.85 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.12,
    roughness: 0.15, metalness: 0, side: THREE.DoubleSide, depthWrite: false }),
};

/* 反应器(烧杯) */
const flask = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.3, 3.0, 40, 1, true), M.glass);
flask.position.y = 1.2;
scene.add(flask);
const flaskBottom = new THREE.Mesh(new THREE.CircleGeometry(2.3, 40), M.glass.clone());
flaskBottom.rotation.x = -Math.PI / 2;
flaskBottom.position.y = -0.3;
scene.add(flaskBottom);
const flaskGlow = new THREE.Mesh(new THREE.CylinderGeometry(2.55, 2.25, 3, 40, 1, true),
  new THREE.MeshBasicMaterial({ color: 0x3a5a8a, transparent: true, opacity: 0.12, side: THREE.BackSide }));
flaskGlow.position.y = 1.2;
scene.add(flaskGlow);
const base = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 3.0, 0.2, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.45;
scene.add(base);
/* 加热线圈 */
const coil = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.035, 8, 60),
  new THREE.MeshBasicMaterial({ color: 0xff6b3d, blending: THREE.AdditiveBlending, transparent: true, opacity: 0 }));
coil.rotation.x = Math.PI / 2;
coil.position.y = -0.2;
scene.add(coil);
let heatT = 0;

/* ================= 实体系统 ================= */
/* 单体:两个小球+双键横杠;链节:珠串;自由基端:红光球 */
const species = [];    // {g:Group, kind:'mono'|'chain'|'init', v:Vec3, target, n:number|链节数, alive, lbl}
const pool = [];
const BOUND = 2.15;    // 烧杯内半径

function rndInFlask() {
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * (BOUND - 0.35);
  return new THREE.Vector3(Math.cos(a) * r, 0.25 + Math.random() * 2.2, Math.sin(a) * r);
}
function mkMonomer(pos) {
  const g = new THREE.Group();
  const c1 = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), M.C);
  const c2 = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), M.C);
  c1.position.set(-0.15, 0, 0); c2.position.set(0.15, 0, 0);
  const db = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.045, 0.045), M.bondD);
  db.position.set(0, 0.02, 0.1);
  g.add(c1, c2, db);
  g.position.copy(pos || rndInFlask());
  g.rotation.y = Math.random() * Math.PI * 2;
  scene.add(g);
  const s = { g, kind: 'mono', alive: true, phase: Math.random() * 9 };
  species.push(s);
  return s;
}
function mkInitiator(pos) {
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 1), M.init);
  g.add(core);
  g.position.copy(pos || new THREE.Vector3(0, 0.4, 0));
  scene.add(g);
  const s = { g, kind: 'init', alive: true, phase: 0 };
  species.push(s);
  return s;
}
function mkRadicalDot(parent, offset) {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), M.rad.clone());
  d.position.copy(offset);
  parent.add(d);
  return d;
}
/* 链:给 n 个链节,末端红光 = 自由基 */
function mkChain(pos, n) {
  pos = pos || rndInFlask();
  n = Math.max(1, n || 1);
  const g = new THREE.Group();
  const beads = [];
  for (let i = 0; i < n; i++) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.15, 14, 10), M.C);
    const a = i * 0.85;
    b.position.set(Math.cos(a) * 0.26, i * 0.19, Math.sin(a) * 0.26);
    g.add(b);
    beads.push(b);
    if (i > 0) {
      const p1 = beads[i - 1].position, p2 = b.position;
      const d = new THREE.Vector3().subVectors(p2, p1);
      const bond = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1, 8), M.bond);
      bond.position.copy(p1).addScaledVector(d, 0.5);
      bond.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
      bond.scale.y = d.length();
      g.add(bond);
    }
  }
  const radDot = mkRadicalDot(g, beads[n - 1].position.clone().add(new THREE.Vector3(0, 0.22, 0)));
  g.position.copy(pos || rndInFlask());
  g.rotation.y = Math.random() * Math.PI * 2;
  scene.add(g);
  const s = { g, kind: 'chain', alive: true, n, beads, radDot, phase: Math.random() * 9 };
  species.push(s);
  return s;
}
function killChain(s) {
  s.alive = false;
  s.kind = 'deadChain';
  s.radDot.material = M.dead;
  s.radDot.scale.setScalar(0.5);
}
let monomersUsed = 0;
let aliveChains = [];
const MAXMONO = 90;

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let feed = 0.6;
let tSim = 0;
let phase = 0;      // 0 未引发 1 增长中 2 已淬灭
let lastFeedMono = 0;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblTop = addLabel(() => phase === 0
  ? L('反应器已装料:乙烯基单体 + 待投引发剂', 'reactor loaded: vinyl monomers + initiator ready')
  : phase === 1
    ? L('链式增长中:自由基端每撞上一个单体就长一节', 'growing: each radical end grabs a monomer and grows by one unit')
    : L('已淬灭:所有活性端两两结合/歧化,聚合停止', 'quenched: active ends combined or disproportionated — growth stopped'),
  new THREE.Vector3(0, 3.4, 0), 'st');
const lblHeat = addLabel(() => heatT > 0 ? L('Δ 加热中……引发剂分解', 'Δ heating… initiator splitting')
  : L('引发剂:过氧化物 R-O-O-R,O-O 键很弱,受热断成两个 R-O·', 'initiator: peroxide R-O-O-R, weak O-O bond splits into 2 R-O· on heating'),
  new THREE.Vector3(0, 0.15, 2.6), 'g');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '单体:带双键的小分子', be: 'Monomers: small molecules with C=C',
    d: '乙烯基单体 CH₂=CHX(氯乙烯→PVC、苯乙烯→PS)在烧杯里游荡,双键是它的「抓手」。',
    de: 'Vinyl monomers CH₂=CHX (vinyl chloride→PVC, styrene→PS) drift in the flask; the C=C is their handle.',
    act: () => loadReactor() },
  { b: '引发:加热断 O-O 键', be: 'Initiation: heat splits O-O',
    d: '过氧化物里 O-O 键只有 ~150 kJ/mol(正常共价键的一半),加热就断——两个自由基诞生,红色活性端。',
    de: 'The O-O bond in peroxides (~150 kJ/mol, half a normal bond) snaps on heat — two radicals are born, shown as red ends.',
    act: () => doInit() },
  { b: '增长:自由基抓单体', be: 'Propagation: radicals grab monomers',
    d: '自由基攻击双键,π 键打开变成新的 σ 键,自由基搬到链尾——每 10⁻³ 秒加一个,几百毫秒就能长到 1000 节。',
    de: 'The radical adds across C=C, π opens into σ and the radical relocates to the chain end — one unit per ~ms, 1000 units in a blink.',
    act: () => { phase = 1; } },
  { b: '链长决定一切', be: 'Chain length sets everything',
    d: '几十节=蜡状软;几百节=普通塑料瓶;几千节=高强纤维。聚合度就是材料的命运。',
    de: 'A few dozen units = waxy; hundreds = bottles; thousands = strong fiber. Degree of polymerization is destiny.',
    act: () => setFeed(100) },
  { b: '终止:相遇即熄灭', be: 'Termination: meet and die',
    d: '两活性端相撞就结合成一条死链,或歧化各拿一个氢;自由基消失,分子量锁定——淬灭按钮就是干这个的。',
    de: 'Two radical ends couple into one dead chain or disproportionate; radicals vanish, molecular weight locks — that is the quench button.',
    act: () => doQuench() },
];
function stepIndex() { return phase === 0 ? 0 : phase === 1 ? (aliveChains.length && avgDP() > 60 ? 3 : 2) : 4; }
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 反应逻辑 ================= */
function avgDP() {
  const all = species.filter(s => (s.kind === 'chain' || s.kind === 'deadChain'));
  if (!all.length) return 0;
  return all.reduce((a, s) => a + s.n, 0) / all.length;
}
function loadReactor() {
  /* 清空重建 */
  for (const s of species) scene.remove(s.g);
  species.length = 0;
  aliveChains = [];
  monomersUsed = 0;
  phase = 0;
  heatT = 0;
  coil.material.opacity = 0;
  for (let i = 0; i < 55; i++) mkMonomer();
}
function doInit() {
  if (phase !== 0) return;
  heatT = 1;
  phase = 1;
  /* 生成 4 条初始链(引发剂劈成 2 自由基 → 简化为直接长出 4 条 1 节链) */
  for (let i = 0; i < 4; i++) aliveChains.push(mkChain());
}
function doQuench() {
  if (phase !== 1) return;
  /* 两两配对结合 */
  const pool2 = aliveChains.slice();
  while (pool2.length >= 2) {
    const a = pool2.pop(), b = pool2.pop();
    a.n += b.n;
    killChain(a);
    scene.remove(b.g);
    const idx = species.indexOf(b);
    if (idx >= 0) species.splice(idx, 1);
  }
  if (pool2.length === 1) killChain(pool2[0]);
  aliveChains = [];
  phase = 2;
}
function setFeed(v) {
  feed = clamp(v, 0, 1) * 1.0;
  document.getElementById('feed').value = feed * 100;
  document.getElementById('feedVal').textContent = (feed * 100).toFixed(0) + '%';
}
function growthTick(dt) {
  if (phase !== 1) return;
  aliveChains = aliveChains.filter(s => s.alive);
  /* 单体补充:按 feed 概率生成(上限) */
  const monoCount = species.filter(s => s.kind === 'mono').length;
  if (monoCount < MAXMONO && Math.random() < dt * feed * 14 && monomersUsed < 900) {
    mkMonomer();
  }
  /* 增长:每条活性链以速度抓最近单体 */
  for (const ch of aliveChains) {
    if (!ch.alive) continue;
    ch.grabT = (ch.grabT || 0) - dt;
    if (ch.grabT > 0) continue;
    /* 找最近单体 */
    let best = null, bd = 1e9;
    for (const s of species) {
      if (s.kind !== 'mono') continue;
      const d = s.g.position.distanceTo(ch.g.position);
      if (d < bd) { bd = d; best = s; }
    }
    if (!best) continue;
    if (bd < 0.5) {
      /* 吞并:链长+1,更新珠串(简化:重建链,但保留位置) */
      ch.n += 1;
      monomersUsed += 1;
      scene.remove(best.g);
      const idx = species.indexOf(best);
      if (idx >= 0) species.splice(idx, 1);
      const newPos = ch.g.position.clone();
      scene.remove(ch.g);
      const idx2 = species.indexOf(ch);
      if (idx2 >= 0) species.splice(idx2, 1);
      const nc = mkChain(newPos, Math.min(ch.n, 40));
      nc.n = ch.n;
      aliveChains[aliveChains.indexOf(ch)] = nc;
      ch.grabT = 0.25;
    } else {
      /* 吸过去 */
      best.g.position.lerp(ch.g.position, clamp(dt * 2.2, 0, 1));
      ch.grabT = 0.05;
    }
  }
  /* 自发终止:偶发两链相撞 */
  if (aliveChains.length > 10 && Math.random() < dt * 0.25) doQuench();
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const btnInit = document.getElementById('btnInit');
const btnStop = document.getElementById('btnStop');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
document.getElementById('feed').addEventListener('input', e => setFeed(parseInt(e.target.value) / 100));
btnInit.addEventListener('click', doInit);
btnStop.addEventListener('click', doQuench);
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) tSim += dt * speed;

  /* 加热线圈 */
  if (heatT > 0) heatT = Math.max(0, heatT - dt * 0.5);
  coil.material.opacity = 0.25 + 0.75 * heatT;
  coil.material.color.setHSL(0.05, 1, 0.5 + 0.2 * Math.sin(tSim * 6));
  flaskGlow.material.opacity = 0.1 + 0.1 * heatT;

  /* 单体布朗漂移 */
  for (const s of species) {
    if (s.kind === 'mono') {
      s.g.position.x += Math.sin(tSim * 1.3 + s.phase) * dt * 0.35;
      s.g.position.y += Math.sin(tSim * 1.7 + s.phase * 2) * dt * 0.28;
      s.g.position.z += Math.cos(tSim * 1.1 + s.phase) * dt * 0.35;
      keepInside(s.g.position);
      s.g.rotation.y += dt * 0.8;
    } else if (s.kind === 'chain') {
      s.g.position.x += Math.sin(tSim * 0.9 + s.phase) * dt * 0.18;
      s.g.position.z += Math.cos(tSim * 1.2 + s.phase) * dt * 0.18;
      keepInside(s.g.position);
      s.g.rotation.y += dt * 0.3;
      s.radDot.material.opacity = 0.6 + 0.4 * Math.sin(tSim * 7 + s.phase);
    }
  }
  growthTick(dt * speed * (playing ? 1 : 0));

  /* 统计 */
  const dp = avgDP();
  document.getElementById('stAlive').textContent = aliveChains.length;
  document.getElementById('stUsed').textContent = monomersUsed;
  document.getElementById('stDP').innerHTML = dp > 0 ? dp.toFixed(0) + ' <small>节</small>' : '—';
  const m = document.getElementById('stMat');
  if (dp === 0) m.textContent = '—';
  else if (dp < 30) m.textContent = L('蜡状(软、低熔点)', 'waxy (soft, low mp)');
  else if (dp < 300) m.textContent = L('通用塑料(瓶、膜)', 'commodity plastic (bottle, film)');
  else m.textContent = L('高强材料(纤维、工程件)', 'high-strength (fiber, engineering)');

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function keepInside(p) {
  const r = Math.hypot(p.x, p.z);
  const maxR = BOUND - 0.25;
  if (r > maxR) { p.x *= maxR / r; p.z *= maxR / r; }
  p.y = clamp(p.y, 0.15, 2.55);
}

loadReactor();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
