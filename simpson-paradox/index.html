<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>辛普森悖论 · 分层全赢,合计却输</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#a83a5c;
    --bg:#10141b;--panel:rgba(13,17,24,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(13,17,24,.82);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#862e49;
    --bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.88);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,122,148,.9);color:#ffc2ce}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(242,193,78,.9);color:#ffe9b0}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c23a55}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#8a6a00}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 430px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.f{color:#ff8fa8}:root[data-theme="light"] #stats .v.f{color:#862e49}
  #stats .v.bad{color:#ff7a90;font-size:14px}:root[data-theme="light"] #stats .v.bad{color:#c22540}
  #stats .v.ok{color:#7ed8a0;font-size:14px}:root[data-theme="light"] #stats .v.ok{color:#0f7a44}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:396px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #legend{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid}
  .chip.s{color:#ff9fb6;border-color:rgba(224,81,122,.7)}
  .chip.t{color:#9ecbff;border-color:rgba(91,150,232,.7)}
  .chip.n{color:var(--text2);border-color:var(--tool-border)}
  :root[data-theme="light"] .chip.s{color:#a83a5c;border-color:rgba(168,58,92,.7)}
  :root[data-theme="light"] .chip.t{color:#2f639f;border-color:rgba(47,99,159,.7)}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(168,58,92,.65);background:rgba(168,58,92,.16);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(134,46,73,.55);background:rgba(134,46,73,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 118px;line-height:1.25}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(168,58,92,.12);border-color:rgba(168,58,92,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(134,46,73,.08);border-color:rgba(134,46,73,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#f2a9bc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:flex;flex-direction:column;gap:6px;margin-top:10px;
    padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{padding:9px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.15)}
  .crow{display:flex;align-items:center;gap:8px}
  .crow label{font-size:12px;color:var(--text2);flex:0 0 30px}
  .crow .val{font-size:11.5px;color:var(--text3);flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="辛普森悖论 · 分层全赢,合计却输" data-en="Simpson's Paradox · Win Every Stratum, Lose the Total">辛普森悖论 · 分层全赢,合计却输</h1>
  <div class="sub" data-zh="A 组 62%>56%、34%>28%,层层都赢;把人加总却成 41%<49%,反输——混杂变量藏在权重里,推滑块越过临界点 46.4%,合计胜者当场易主 · 拖动旋转 / 空格运行/暂停" data-en="A wins 62%>56% and 34%>28% in both strata, yet loses 41%<49% overall — the confounder hides in the weights; push the slider past the 46.4% critical point and the winner flips live · drag to orbit / Space = run/pause">A 组 62%>56%、34%>28%,层层都赢;把人加总却成 41%<49%,反输——混杂变量藏在权重里,推滑块越过临界点 46.4%,合计胜者当场易主 · 拖动旋转 / 空格运行/暂停</div>
</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

</div>

  <span class="k" id="kA">A 组合计</span><span class="v" id="stA">—</span>
  <span class="k" id="kB">B 组合计</span><span class="v" id="stB">—</span>
  <span class="k" data-zh="权重差(严层)" data-en="Weight gap">权重差(严层)</span><span class="v" id="stW">—</span>
  <span class="k" data-zh="反转指示" data-en="Verdict">反转指示</span><span class="v" id="stV" style="font-size:14px">—</span>

    <span class="chip t" id="chipB" data-zh="B 组 · 被录取" data-en="Group B · admitted">B 组 · 被录取</span>
    <span class="chip n" data-zh="灰块 · 被拒" data-en="gray · rejected">灰块 · 被拒</span>

  </div>
  <div class="row"><label id="labA">A 组在严层的占比</label><input id="sldA" type="range" min="5" max="95" step="1" value="75"><span class="val" id="sldAVal">75%</span></div>
  <div class="row"><label id="labB">B 组在严层的占比</label><input id="sldB" type="range" min="5" max="95" step="1" value="25"><span class="val" id="sldBVal">25%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="crow"><label data-zh="进度" data-en="Phase">进度</label><input id="prog" type="range" min="0" max="5.99" step="0.01" value="0"><span class="val" id="progVal">1/6</span></div>
    <div class="crow"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
    <div id="toggles">
      <label><input id="tglStrat" type="checkbox"> <span data-zh="分层对比" data-en="Stratified view">分层对比</span></label>
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../bayes-screening/" data-zh="贝叶斯筛查" data-en="Bayes screening">贝叶斯筛查</a>

    <a href="../decision-tree/" data-zh="决策树" data-en="Decision tree">决策树</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============================================================
   辛普森悖论:分层比较与合计比较同时成立且方向相反。
   模型:两组申请者 A/B × 两个分层(宽层/严层);
   层内录取率固定,只有"各组落在严层的占比"(权重)在变——
   合计率被权重拖着走,推过临界点胜者当场易主。
   真实预设:Berkeley 1973 研究生录取(A 院+F 院切片)、
   肾结石疗法 1986(开放手术 vs 经皮取石)。
   ============================================================ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const qsFloat=(k,d)=>{const v=parseFloat(qs.get(k));return Number.isFinite(v)?v:d;};
const qsBool=(k,d)=>{const v=qs.get(k);return v===null?d:(v!=='0'&&v!=='false');};

/* ---- 渲染器 / 相机 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x10141b,80,190);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,500);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=8;controls.maxDistance=150;
controls.maxPolarAngle=Math.PI*0.495;
controls.autoRotateSpeed=0.8;

scene.add(new THREE.HemisphereLight(0xeef2fa,0x1a1d24,0.95));
const keyL=new THREE.DirectionalLight(0xffffff,1.15);keyL.position.set(18,32,14);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0xdfe6f0,0.35);fillL.position.set(-16,18,-12);scene.add(fillL);

/* ---- 场地:两个分层平台 + 前方合计讲台 ---- */
const matGround=new THREE.MeshStandardMaterial({color:0x161a21,roughness:0.97});
const ground=new THREE.Mesh(new THREE.CircleGeometry(65,64),matGround);
ground.rotation.x=-Math.PI/2;ground.position.y=-1.22;scene.add(ground);
const grid=new THREE.GridHelper(110,55,0x39424e,0x39424e);
grid.position.y=-1.21;grid.material.vertexColors=false;grid.material.transparent=true;
grid.material.opacity=0.55;scene.add(grid);
const PX=[-11.5,11.5];
const matPlat=[new THREE.MeshStandardMaterial({color:0x27303b,roughness:0.9}),
               new THREE.MeshStandardMaterial({color:0x1f2630,roughness:0.9})];
const matEdge=[new THREE.MeshStandardMaterial({color:0x3a4552,roughness:0.8}),
               new THREE.MeshStandardMaterial({color:0x313b47,roughness:0.8})];
for(let s=0;s<2;s++){
  const p=new THREE.Mesh(new THREE.BoxGeometry(10.4,1.2,7.4),matPlat[s]);
  p.position.set(PX[s],-0.6,0);scene.add(p);
  const e=new THREE.Mesh(new THREE.BoxGeometry(10.9,0.14,7.9),matEdge[s]);
  e.position.set(PX[s],-0.05,0);scene.add(e);
}
const matPod=new THREE.MeshStandardMaterial({color:0x232a34,roughness:0.9});
const podSlab=new THREE.Mesh(new THREE.BoxGeometry(9,0.5,4.6),matPod);
podSlab.position.set(0,-0.25,8.6);scene.add(podSlab);
const barA=new THREE.Mesh(new THREE.BoxGeometry(1.9,1,1.9),
  new THREE.MeshStandardMaterial({color:0xe0517a,roughness:0.4,transparent:true,
    emissive:0xe0517a,emissiveIntensity:0.14}));
const barB=new THREE.Mesh(new THREE.BoxGeometry(1.9,1,1.9),
  new THREE.MeshStandardMaterial({color:0x5b96e8,roughness:0.4,transparent:true,
    emissive:0x5b96e8,emissiveIntensity:0.14}));
barA.position.set(-2.1,0,8.6);barB.position.set(2.1,0,8.6);
scene.add(barA);scene.add(barB);
const crown=new THREE.Mesh(new THREE.OctahedronGeometry(0.62),
  new THREE.MeshStandardMaterial({color:0xf2c14e,emissive:0xf2c14e,emissiveIntensity:0.75,roughness:0.3}));
scene.add(crown);

/* ---- 申请者方块:InstancedMesh(亮=录取,灰=被拒) ---- */
const MAXI=420;
const cubeGeo=new THREE.BoxGeometry(0.78,0.78,0.78);
const admMat=new THREE.MeshStandardMaterial({roughness:0.38,metalness:0.05});
const rejMat=new THREE.MeshStandardMaterial({roughness:0.92});
const admMesh=new THREE.InstancedMesh(cubeGeo,admMat,MAXI);
const rejMesh=new THREE.InstancedMesh(cubeGeo,rejMat,MAXI);
admMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
rejMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
admMesh.count=0;rejMesh.count=0;
scene.add(admMesh);scene.add(rejMesh);
for(let i=0;i<MAXI;i++){admMesh.setColorAt(i,new THREE.Color(1,1,1));rejMesh.setColorAt(i,new THREE.Color(1,1,1));}
const cur={adm:new Float32Array(MAXI*3),rej:new Float32Array(MAXI*3)};
const tgt={adm:new Float32Array(MAXI*3),rej:new Float32Array(MAXI*3)};
const phase=new Float32Array(MAXI);
for(let i=0;i<MAXI;i++)phase[i]=Math.random()*Math.PI*2;
const dummy=new THREE.Object3D();

/* ---- 模型状态 ---- */
const COL={A:{dark:0xe0517a,light:0xa83a5c},B:{dark:0x5b96e8,light:0x2f639f},
           R:{dark:0x3a424c,light:0xb6bdc6}};

const M={tA:0,tB:0,paradox:false,winner:0,crit:50};
function compute(){
  M.tA=(100-D.wA)/100*D.rLA+D.wA/100*D.rSA;
  M.tB=(100-D.wB)/100*D.rLB+D.wB/100*D.rSB;
  M.winner=M.tA>=M.tB?0:1;
  M.paradox=(D.rLA>D.rLB&&D.rSA>D.rSB&&M.tB>M.tA)||(D.rLA<D.rLB&&D.rSA<D.rSB&&M.tA>M.tB);
  M.crit=D.rLA!==D.rSA?clamp((D.rLA-M.tB)/(D.rLA-D.rSA)*100,0,100):50;
}

/* ---- 方块布局:权重一变,方块在两层之间搬迁 ---- */
const STACK_DX=[-2.9,-1.1,1.1,2.9];
function rebuildLayout(animate=true){
  const oldA=admMesh.count,oldR=rejMesh.count;
  let ia=0,ir=0;
  const cA=new THREE.Color(COL.A[THEME]),cB=new THREE.Color(COL.B[THEME]),cR=new THREE.Color(COL.R[THEME]);
  const tops=[0,0,0,0];
  const ranges=[];
  for(let s=0;s<2;s++)for(let g=0;g<2;g++){
    const w=g===0?D.wA:D.wB,N=g===0?D.NA:D.NB;
    const count=Math.round(N*(s===1?w/100:(100-w)/100));
    const rate=s===0?(g===0?D.rLA:D.rLB):(g===0?D.rSA:D.rSB);
    const adm=Math.round(count*rate/100);
    for(let kind=0;kind<2;kind++){
      const n=kind===0?adm:count-adm;
      const rows=n<=0?0:Math.max(1,Math.ceil(n/(D.unit*2)));
      const x=PX[s]+STACK_DX[g*2+kind];
      const mesh=kind===0?admMesh:rejMesh;
      const T=kind===0?tgt.adm:tgt.rej;
      const col=kind===0?(g===0?cA:cB):cR;
      const start=kind===0?ia:ir;
      for(let r=0;r<rows;r++)for(let c=0;c<2;c++){
        const i=kind===0?ia:ir;
        if(i>=MAXI)break;
        T[i*3]=x;T[i*3+1]=0.42+r*0.9;T[i*3+2]=c===0?-0.62:0.62;
        mesh.setColorAt(i,col);
        if(kind===0)ia++;else ir++;
      }
      const end=kind===0?ia:ir;
      if(end>start)ranges.push({kind,from:start,to:end,s,g});
      tops[s*2+g]=Math.max(tops[s*2+g],0.42+rows*0.9);
    }
  }
  admMesh.count=ia;rejMesh.count=ir;
  for(const rg of ranges){
    const T=rg.kind===0?tgt.adm:tgt.rej;
    const C=rg.kind===0?cur.adm:cur.rej;
    const old=rg.kind===0?oldA:oldR;
    const srcX=PX[1-rg.s]+STACK_DX[rg.g*2+rg.kind];
    for(let i=rg.from;i<rg.to;i++){
      if(!animate){C[i*3]=T[i*3];C[i*3+1]=T[i*3+1];C[i*3+2]=T[i*3+2];}
      else if(i>=old){C[i*3]=srcX;C[i*3+1]=0.42;C[i*3+2]=-0.62;}
    }
  }
  admMesh.instanceColor.needsUpdate=true;rejMesh.instanceColor.needsUpdate=true;
  for(let s=0;s<2;s++)for(let g=0;g<2;g++){
    const midX=PX[s]+(STACK_DX[g*2]+STACK_DX[g*2+1])/2;
    stackLbl[g][s].position.set(midX,tops[s*2+g]+0.8,0);
  }
  writeInstances(wall);
}
function writeInstances(time){
  for(let i=0;i<admMesh.count;i++){
    dummy.position.set(cur.adm[i*3],cur.adm[i*3+1]+0.045*Math.sin(time*1.7+phase[i]),cur.adm[i*3+2]);
    dummy.updateMatrix();admMesh.setMatrixAt(i,dummy.matrix);
  }
  admMesh.instanceMatrix.needsUpdate=true;
  for(let i=0;i<rejMesh.count;i++){
    dummy.position.set(cur.rej[i*3],cur.rej[i*3+1],cur.rej[i*3+2]);
    dummy.updateMatrix();rejMesh.setMatrixAt(i,dummy.matrix);
  }
  rejMesh.instanceMatrix.needsUpdate=true;
}
function stepCubes(dt){
  const k=1-Math.exp(-4.5*dt);
  let n=admMesh.count*3;
  for(let i=0;i<n;i++)cur.adm[i]+=(tgt.adm[i]-cur.adm[i])*k;
  n=rejMesh.count*3;
  for(let i=0;i<n;i++)cur.rej[i]+=(tgt.rej[i]-cur.rej[i])*k;
}

/* ---- 讲台:合计率柱 + 王冠(胜者易主当场跳槽) ---- */
const hopFrom=new THREE.Vector3(0,2,8.6);
let hopT=1,lastWinner=-1,flash=1;
function syncVisual(rdt,time){
  const hA=Math.max(0.4,M.tA*0.13),hB=Math.max(0.4,M.tB*0.13);
  barA.scale.y=hA;barA.position.y=hA/2;
  barB.scale.y=hB;barB.position.y=hB/2;
  const dim=D.showStrat;
  barA.material.opacity=dim?0.16:1;barB.material.opacity=dim?0.16:1;
  flash=Math.max(0,flash-rdt*1.2);
  barA.material.emissiveIntensity=0.14+flash*(M.winner===0?0.9:0);
  barB.material.emissiveIntensity=0.14+flash*(M.winner===1?0.9:0);
  if(M.winner!==lastWinner){hopFrom.copy(crown.position);hopT=0;lastWinner=M.winner;flash=1;}
  hopT=Math.min(1,hopT+rdt/0.7);
  const bx=M.winner===0?-2.1:2.1,by=(M.winner===0?hA:hB)+1.15;
  let cx,cy;
  if(hopT<1){
    cx=lerp(hopFrom.x,bx,hopT);
    cy=lerp(Math.max(hopFrom.y,1),by,hopT)+Math.sin(Math.PI*hopT)*3.2;
  }else{cx=bx;cy=by+0.14*Math.sin(time*2.1);}
  crown.position.set(cx,cy,8.6);
  crown.visible=!dim;
  crown.rotation.y=time*0.9;
  podLblA.position.set(-2.1,hA+0.9,8.6);
  podLblB.position.set(2.1,hB+0.9,8.6);
  winLbl.position.set(cx,cy+1.25,8.6);
}

const elSteps=document.getElementById('steps');
function buildSteps(){
  elSteps.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b(),s.be())}</b>　${s.d()}</span>`;
    li.addEventListener('click',()=>{jumpStep(i);});
    elSteps.appendChild(li);

}

].map(c=>({p:new THREE.Vector3(...c.p),t:new THREE.Vector3(...c.t)}));
camera.position.copy(CAMS[0].p);
controls.target.copy(CAMS[0].t);
let camK=0;
function goCam(i){camK=2.2;}
controls.addEventListener('start',()=>{camK=0;});
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const rdt=clamp(clock.getDelta(),0,0.05);
  const dt=rdt*speedK;
  wall+=dt;
  if(playing){
    tR+=dt/TSTEP;
    if(tR>=NSTEPS)tR-=NSTEPS;
    const f=Math.floor(tR);
    if(f!==activeStep){activeStep=f;STEPS[f].act();syncSteps();goCam(f);setProgUI();}
    progEl.value=tR;
  }
  stepCubes(dt);
  writeInstances(wall);
  syncVisual(rdt,wall);
  if(camK>0){
    camK-=rdt;
    const k=1-Math.exp(-2.5*rdt);
    camera.position.lerp(CAMS[activeStep].p,k);
    controls.target.lerp(CAMS[activeStep].t,k);
  }
  acc+=rdt;
  if(acc>0.12){acc=0;updateStats();}
  for(const r of labelReg){
    const v=r.vis();r.o.visible=v;
    if(v)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- URL 参数与启动:?t=<步骤> &pause=1 &speed= &labels=0 &preset= &wA= &wB= ---- */
applyTheme();applyLang();
applyPreset(PRESETS[qs.get('preset')]?qs.get('preset'):'toy');
tR=clamp(qsFloat('t',0),0,NSTEPS-1);
if(tR>0){activeStep=Math.floor(tR);STEPS[activeStep].act();syncSteps();goCam(activeStep);}
if(qs.get('wA')!==null)D.wA=clamp(qsFloat('wA',D.wA),5,95);
if(qs.get('wB')!==null)D.wB=clamp(qsFloat('wB',D.wB),5,95);
onParam();
speedK=clamp(qsFloat('speed',1),0.2,3);
spdEl.value=speedK;spdVal.textContent=speedK.toFixed(1)+'×';
labelsOn=qsBool('labels',true);tglLabels.checked=labelsOn;
playing=!qsBool('pause',false);
if(qs.get('pause')===null&&matchMedia('(prefers-reduced-motion: reduce)').matches)playing=false;
setPlayText();syncTgl();setProgUI();syncSteps();
updateStats();start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
