<style>
  :root,:root[data-theme="dark"]{

    transition:border-color .15s,color .15s,transform .15s}

    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 大碰撞假说(演示标度:1 单位 = 2124 km,原地球半径 3 单位)
   忒伊亚:火星大小 ≈ 0.1 M⊕、半径 0.53 R⊕;斜撞 45° 左右、速度略高于互逃逸速度
   碎屑盘:铁沉底、硅酸盐溅入轨道;洛希极限(硅酸盐密度)≈ 2.9 R⊕,盘外吸积成月
   潮汐演化:月球从 ~3.8 R⊕ 被潮汐推到今天 60 R⊕,地球日从 ~5 h 拉长到 24 h
   粒子动力学:中心引力 μ=324 + 简化圆化项(代替真实自碰撞耗散) */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---------- 渲染器 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04050a);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,2000);
camera.position.set(14,13,26);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=5;controls.maxDistance=500;controls.autoRotateSpeed=0.4;

scene.add(new THREE.AmbientLight(0x8890b0,0.4));
const key=new THREE.DirectionalLight(0xffe8cc,1.25);key.position.set(28,34,18);scene.add(key);
const rim=new THREE.DirectionalLight(0x6f86ff,0.3);rim.position.set(-24,10,-18);scene.add(rim);

/* ---------- 背景星空 ---------- */
{
  const n=420,arr=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const u=Math.random()*2-1,ph=Math.random()*2*Math.PI,r=500;
    const s=Math.sqrt(1-u*u);
    arr[i*3]=r*s*Math.cos(ph);arr[i*3+1]=r*u;arr[i*3+2]=r*s*Math.sin(ph);
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x9db4d6,size:1.6,sizeAttenuation:false,transparent:true,opacity:0.8})));
}

/* ---------- 原地球 / 忒伊亚 ---------- */
const R_E=3;
const earthMat=new THREE.MeshStandardMaterial({color:0x8a3d20,roughness:0.5,metalness:0.1,emissive:0xd44a10,emissiveIntensity:0.32});
const earth=new THREE.Mesh(new THREE.SphereGeometry(R_E,48,32),earthMat);
scene.add(earth);
/* 忒伊亚:火星大小 r=0.53 R⊕ */
const theia=new THREE.Group();
theia.add(new THREE.Mesh(new THREE.SphereGeometry(1.59,36,24),new THREE.MeshStandardMaterial({color:0x9a6a45,roughness:0.6,emissive:0x5a2008,emissiveIntensity:0.25})));
const theiaCore=new THREE.Mesh(new THREE.SphereGeometry(0.78,20,14),new THREE.MeshStandardMaterial({color:0x4a3838,roughness:0.4,metalness:0.6,emissive:0xff5522,emissiveIntensity:0.5}));
scene.add(theiaCore);theiaCore.visible=false;
scene.add(theia);

/* 洛希极限圈:2.9 R⊕(硅酸盐密度) */
const rocheGrp=new THREE.Group();
{
  const pts=[];const rr=2.9*R_E;
  for(let i=0;i<=128;i++){const a=i/128*2*Math.PI;pts.push(new THREE.Vector3(rr*Math.cos(a),0,rr*Math.sin(a)));}
  rocheGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.7})));
}
scene.add(rocheGrp);

/* 月球(胚胎) */
const moon=new THREE.Mesh(new THREE.SphereGeometry(0.3,24,16),new THREE.MeshStandardMaterial({color:0xb9b2a6,roughness:0.9}));
moon.visible=false;scene.add(moon);
/* 当前月轨参考圈 */
const orbRing=new THREE.Line(new THREE.BufferGeometry().setFromPoints((()=>{const p=[];for(let i=0;i<=128;i++){const a=i/128*2*Math.PI;p.push(new THREE.Vector3(Math.cos(a),0,Math.sin(a)));}return p;})()),
  new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.25}));
orbRing.visible=false;scene.add(orbRing);

/* ---------- 碎屑粒子(InstancedMesh) ---------- */
const NP=760;
const pGeo=new THREE.SphereGeometry(0.16,6,5);
const pMesh=new THREE.InstancedMesh(pGeo,new THREE.MeshStandardMaterial({roughness:0.55,metalness:0.05}),NP);
pMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(pMesh);
const parts=[];
for(let i=0;i<NP;i++){
  parts.push({alive:false,iron:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,mode:0,rc:0,s:0.6+Math.random()*0.7});
  /* 未用满的实例先置零缩放,避免初始出现残影 */
  const m=new THREE.Matrix4().makeScale(0,0,0);
  pMesh.setMatrixAt(i,m);
}
pMesh.instanceMatrix.needsUpdate=true;
const cSilA=new THREE.Color(0xffd9a0),cSilB=new THREE.Color(0xc98a4b),cIron=new THREE.Color(0x8a4a3a),cIronHi=new THREE.Color(0xff5030);
pMesh.setColorAt(0,cSilA);pMesh.instanceColor.needsUpdate=true;
const zeroM=new THREE.Matrix4().makeScale(0,0,0);
const tmpM=new THREE.Matrix4(),tmpQ=new THREE.Quaternion(),tmpS=new THREE.Vector3(),tmpP=new THREE.Vector3();

/* ---------- 状态 ---------- */
const MU=324;                       /* 引力参数:v_circ(9)=6 单位/s */
const V_ESC=Math.sqrt(2*MU/R_E);    /* 表面逃逸速度 ≈ 14.7(演示单位) */
let simT=0,speedMul=1,playing=true,labelsOn=true,ironHi=false;
let angDeg=45,velK=1.05;
let nSpawn=0,nDisk=0,nFall=0,nEsc=0,nMoon=0,moonR=0.22;
let earthSpin=0.55,earthR=R_E;
let userHold=0;
let playingInit=!(qs.get('pause')==='1');
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){const v=parseFloat(qs.get('speed'));if(Number.isFinite(v))speedMul=clamp(v,0.2,3);}

/* 撞击几何:速度与径向夹角 α,撞点在 XZ 平面,瞄准线偏移 b=r_c·sinα */
const R_CON=R_E+1.59;
function aimOffset(){return R_CON*Math.sin(angDeg*Math.PI/180);}
function contactX(){const b=aimOffset();return Math.sqrt(Math.max(0.2,R_CON*R_CON-b*b));}

function spawnDebris(dtSim){
  /* 生成率:接触窗 0.9 s(模拟时)内出 720 个 */
  const rate=800;
  spawnAcc+=rate*dtSim;
  while(spawnAcc>=1&&nSpawn<NP-4){
    spawnAcc--;nSpawn++;
    const p=parts[nSpawn-1];
    p.alive=true;
    /* 命运配额:掠射+合适速度 → 成盘;正对/低速 → 落回;过速 → 逃逸 */
    const fEsc=0.03+0.35*Math.max(0,velK-1.15);
    const fOrb=clamp(2.2*Math.pow(Math.sin(angDeg*Math.PI/180),2)*(1.3-Math.abs(velK-1.05)*0.9),0.02,0.8);
    const u=Math.random();
    let fate=u<fEsc?'esc':(u<fEsc+fOrb?'disk':'fall');
    const isIron=Math.random()<0.2;
    p.iron=isIron;
    if(isIron&&Math.random()<0.8)fate='fall';   /* 铁核材料大多沉入地核 */
    /* 撞点附近生成 */
    const cx=contactX(),b=aimOffset();
    const px=cx+(Math.random()-0.5)*1.6,py=(Math.random()-0.5)*1.2,pz=b+(Math.random()-0.5)*1.6;
    const pr=Math.sqrt(px*px+py*py+pz*pz);
    const rx=px/pr,ry=py/pr,rz=pz/pr;
    /* 顺行切向(与月球轨道同向,+y 角动量) */
    let tx=-rz,tz=rx;const tl=Math.sqrt(tx*tx+tz*tz)||1;tx/=tl;tz/=tl;
    let vr,vt,vy;
    if(fate==='esc'){vr=6+4*Math.random();vt=8+4*Math.random();vy=(Math.random()-0.5)*3;}
    else if(fate==='fall'){vr=isIron?-4-Math.random()*3:0.5+Math.random()*2.5;vt=0.5+Math.random()*2.2;
      vy=Math.abs(Math.random())*(1.5+3.2*Math.cos(angDeg*Math.PI/180));}
    else{vr=1.5+2.5*Math.random();vt=4.5+2.6*Math.random();vy=(Math.random()-0.5)*(0.4+3.0*Math.cos(angDeg*Math.PI/180));}
    p.x=px;p.y=py;p.z=pz;
    p.vx=rx*vr+tx*vt;p.vy=ry*vr+vy;p.vz=rz*vr+tz*vt;
    p.mode=0;p.rc=0;
    /* 颜色:铁 深红褐 / 硅酸盐 炽热浅橙 */
    const col=isIron?(ironHi?cIronHi:cIron):cSilA.clone().lerp(cSilB,Math.random());
    pMesh.setColorAt(nSpawn-1,col);
  }
  if(pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true;
}
let spawnAcc=0;

function stepParticles(dt){
  const diskPhase=simT>7.6,accPhase=simT>9.5;
  /* 月球胚胎轨道角速度 */
  const seedR=11.4,seedW=Math.sqrt(MU/(seedR*seedR*seedR));
  const sx=seedR*Math.cos(seedW*simT*0.5),sz=seedR*Math.sin(seedW*simT*0.5);
  nDisk=0;
  for(let i=0;i<nSpawn;i++){
    const p=parts[i];
    if(!p.alive)continue;
    const r=Math.sqrt(p.x*p.x+p.y*p.y+p.z*p.z);
    if(r<R_E*1.02){p.alive=false;nFall++;continue;}
    if(r>70){p.alive=false;nEsc++;continue;}
    const g=-MU/(r*r);
    let ax=g*p.x/r,ay=g*p.y/r,az=g*p.z/r;
    if(diskPhase&&p.mode===0&&r>4.6&&r<16){p.mode=1;p.rc=clamp(r,5.5,13.5);}
    if(p.mode===1){
      /* 简化圆化项:半径弹簧 + 切向速度校正 + 垂直阻尼(代替自碰撞耗散) */
      ax+=(p.rc-r)*0.8*p.x/r;ay+=(p.rc-r)*0.8*p.y/r;az+=(p.rc-r)*0.8*p.z/r;
      let tx=-p.z/r,tz=p.x/r;const vt=p.vx*tx+p.vz*tz;
      const vC=Math.sqrt(MU/p.rc);
      const dv=(vC-vt)*1.2;
      ax+=tx*dv;az+=tz*dv;
      p.vy*=Math.exp(-1.6*dt);ay-=p.y*0.8;
      if(accPhase){
        /* 盘扩散:洛希极限内向外的被推向种胚,外侧的被拉回 */
        if(p.rc<2.9*R_E){ax+=0.34*p.x/r;az+=0.34*p.z/r;}
        else{const dx=sx-p.x,dz=sz-p.z,dl=Math.sqrt(dx*dx+dz*dz)||1;
          ax+=dx/dl*0.55;az+=dz/dl*0.55;
          if(dl<1.25+moonR*0.5){p.alive=false;nMoon++;
            moonR=0.22+0.68*Math.pow(Math.min(1,nMoon/300),1/3);continue;}}
      }
    }
    p.vx+=ax*dt;p.vy+=ay*dt;p.vz+=az*dt;
    const sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy+p.vz*p.vz);
    if(sp>22){p.vx*=22/sp;p.vy*=22/sp;p.vz*=22/sp;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    nDisk++;
  }
  return {sx,sz,seedR,seedW};
}

/* ---------- 标签 ---------- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});
  div.textContent=textFn();
  return o;
}
let notifyT=0,notifyZ='',notifyE='';
addLabel(()=>L('原地球(岩浆洋)','Proto-Earth (magma ocean)'),new THREE.Vector3(0,4.4,0),'b',()=>true,earth);
const theiaLbl=addLabel(()=>L('忒伊亚:火星大小 ≈ 0.1 M⊕','Theia: Mars-sized ≈ 0.1 M⊕'),new THREE.Vector3(0,2.4,0),'o',()=>theia.visible,theia);
addLabel(()=>L('铁核并入地核','Iron core merges into Earth\'s'),new THREE.Vector3(0,1.6,0),'r',()=>theiaCore.visible,theiaCore);
addLabel(()=>L('硅酸盐幔碎屑溅入轨道','Silicate mantle splashes into orbit'),new THREE.Vector3(0,1.8,-13),'o',()=>simT>4.2&&simT<16);
addLabel(()=>L('洛希极限 2.9 R⊕:内侧撕碎、外侧聚月','Roche limit 2.9 R⊕: shredded inside, accretes outside'),new THREE.Vector3(10.4,1.2,0),'r',()=>rocheGrp.visible);
const moonLbl=addLabel(()=>simT<12?L('月球胚胎(吸积中)','Moon embryo (accreting)'):L('月球','Moon'),new THREE.Vector3(0,1.6,0),'g',()=>moon.visible,moon);
addLabel(()=>L('月球 3.8 R⊕ → 60 R⊕,日长 5 h → 24 h','Moon 3.8 R⊕ → 60 R⊕, day 5 h → 24 h'),new THREE.Vector3(0,7,0),'g',()=>simT>=16);
addLabel(()=>L('证据 1:月密度 3.34 g/cm³,没有大铁核','Evidence 1: lunar density 3.34 g/cm³ — no big iron core'),new THREE.Vector3(-15,9.5,0),'b',()=>simT>13&&simT<16.5);
addLabel(()=>L('证据 2:氧/钛同位素与地幔一致','Evidence 2: O/Ti isotopes match Earth\'s mantle'),new THREE.Vector3(15,9.5,0),'b',()=>simT>13&&simT<16.5);
addLabel(()=>L('证据 3:地月角动量恰好一次斜撞的量','Evidence 3: Earth–Moon angular momentum fits one oblique blow'),new THREE.Vector3(0,11,0),'b',()=>simT>13&&simT<16.5);
addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',new THREE.Vector3(0,14,0),'r');

/* ---------- 阶段与步骤 ---------- */
function phaseOf(t){return t<3.0?0:t<4.6?1:t<7.6?2:t<9.5?3:t<15.5?4:5;}
const STEPS=[
  {zh:'45 亿年前:原地球与忒伊亚(火星大小)相向而来',en:'4.5 Gya: proto-Earth and Theia (Mars-sized) close in',
   act(){replay();}},
  {zh:'斜撞:铁核并入地核,硅酸盐幔碎屑热溅射进轨道',en:'Oblique impact: iron sinks to the core, silicate mantle splashes into orbit',
   act(){replay();simT=2.6;}},
  {zh:'碎屑盘:洛希极限 2.9 R⊕ 内外,命运分岔',en:'Debris disk: fates split at the 2.9 R⊕ Roche limit',
   act(){replay();simT=6.0;fastDisk();}},
  {zh:'吸积成月:极限外的物质在种胚上聚成月球',en:'Accretion: matter beyond the limit snowballs onto the embryo',
   act(){replay();simT=8.0;fastDisk();}},
  {zh:'三条证据:低密度 · 同位素指纹 · 角动量预算',en:'Three proofs: low density · isotope fingerprints · angular momentum',
   act(){replay();simT=9.5;fastDisk();moonR=0.62;nMoon=210;}},
  {zh:'潮汐演化:月球被从 3.8 R⊕ 推到 60 R⊕,地球日变长',en:'Tidal evolution: the Moon pushed from 3.8 R⊕ to 60 R⊕ as Earth\'s day lengthens',
   act(){replay();simT=16.0;fastDisk();moonR=0.9;nMoon=330;}},
];
function fastDisk(){ /* 跳播:直接摆好一圈盘粒子 */
  let placed=0;
  for(let i=0;i<NP&&placed<560;i++,placed++){
    const p=parts[i];p.alive=true;p.iron=Math.random()<0.16;p.mode=1;
    const r=6.5+Math.random()*6.5,a=Math.random()*2*Math.PI;
    p.x=r*Math.cos(a);p.z=r*Math.sin(a);p.y=(Math.random()-0.5)*0.8;
    const vC=Math.sqrt(MU/r)*(0.95+Math.random()*0.1);
    p.vx=-Math.sin(a)*vC;p.vz=Math.cos(a)*vC;p.vy=(Math.random()-0.5)*0.4;
    p.rc=r;p.s=0.6+Math.random()*0.7;
    const col=p.iron?(ironHi?cIronHi:cIron):cSilA.clone().lerp(cSilB,Math.random());
    pMesh.setColorAt(i,col);
  }
  nSpawn=placed;nDisk=placed;
  if(pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true;
  simT=Math.max(simT,7.7);
}
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function updateStats(){
  document.getElementById('stAng').innerHTML=angDeg.toFixed(0)+'<small> °</small>';
  const dEl=document.getElementById('stDisk');
  dEl.innerHTML=(nDisk*100/Math.max(1,nSpawn)).toFixed(0)+'<small> %</small>';
  dEl.className='v'+(nDisk>Math.max(120,nSpawn*0.45)?' ok':nSpawn>200&&nDisk<80?' bad':' warn');
  document.getElementById('stOrb').innerHTML=(moonPosR()/R_E).toFixed(1)+'<small> R⊕</small>';
  document.getElementById('stL').innerHTML=Ltot().toFixed(2)+'<small> ×10³⁴</small>';
}
function moonPosR(){return simT<16?(moon.visible?11.4:0):11.4*Math.pow(180/11.4,Math.min(1,(simT-16)/13));}
/* 角动量读数:轨道项(粒子+月球)+ 自转项(演示标度,总量近似守恒) */
function Ltot(){
  let Lo=0;
  for(let i=0;i<nSpawn;i++){const p=parts[i];if(p.alive)Lo+=p.z*p.vx-p.x*p.vz;}
  if(simT>=9.5)Lo+=moonPosR()*Math.sqrt(MU/Math.max(1,moonPosR()))*nMoon;
  return Lo*3.9e-5+earthSpin*5.2;
}

/* ---------- 重播 ---------- */
function replay(){
  simT=0;spawnAcc=0;nSpawn=0;nDisk=0;nFall=0;nEsc=0;nMoon=0;moonR=0.22;
  earthSpin=0.55;earthR=R_E;
  earth.scale.setScalar(1);
  for(let i=0;i<NP;i++){parts[i].alive=false;pMesh.setMatrixAt(i,zeroM);}
  pMesh.instanceMatrix.needsUpdate=true;
  theia.visible=true;theiaCore.visible=false;theiaCore.scale.setScalar(1);
  moon.visible=false;orbRing.visible=false;
  notifyT=0;
}

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('sAngVal').textContent=angDeg+'°';
  document.getElementById('sVelVal').textContent=velK.toFixed(2)+' v_esc';
  document.getElementById('sTmVal').textContent=speedMul.toFixed(1)+'×';
  buildSteps();
}

/* ---------- 事件 ---------- */
document.getElementById('sAng').addEventListener('input',e=>{angDeg=+e.target.value;
  document.getElementById('sAngVal').textContent=angDeg+'°';});
document.getElementById('sVel').addEventListener('input',e=>{velK=+e.target.value;
  document.getElementById('sVelVal').textContent=velK.toFixed(2)+' v_esc';});
document.getElementById('sTm').addEventListener('input',e=>{speedMul=+e.target.value;
  document.getElementById('sTmVal').textContent=speedMul.toFixed(1)+'×';});
document.getElementById('sAng').addEventListener('change',()=>{replay();notify(L('参数已改,重新演一遍撞击','parameters changed — replaying the impact'));});
document.getElementById('sVel').addEventListener('change',()=>{replay();notify(L('参数已改,重新演一遍撞击','parameters changed — replaying the impact'));});
document.getElementById('btnReplay').addEventListener('click',()=>replay());
document.getElementById('btnIron').addEventListener('click',()=>{
  ironHi=!ironHi;
  document.getElementById('btnIron').classList.toggle('on',ironHi);
  for(let i=0;i<nSpawn;i++){const p=parts[i];
    if(p.alive&&p.iron)pMesh.setColorAt(i,ironHi?cIronHi:cIron);}
  if(pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true;
});
document.getElementById('btnRoche').addEventListener('click',()=>{
  rocheGrp.visible=!rocheGrp.visible;
  document.getElementById('btnRoche').classList.toggle('on',rocheGrp.visible);
});
document.getElementById('btnTidal').addEventListener('click',()=>{simT=16.2;});
function notify(z,e){notifyT=3.2;notifyZ=z;notifyE=e;}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
controls.addEventListener('start',()=>{userHold=3;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';
  localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0;
if(!labelsOn)document.getElementById('tglLabels').checked=false;
if(!playingInit){playing=false;document.getElementById('play').textContent=L('运行','Run');}
rocheGrp.visible=true;document.getElementById('btnRoche').classList.add('on');

function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  if(notifyT>0)notifyT-=dt0;
  if(userHold>0)userHold-=dt0;
  /* 接触窗慢放 */
  let slow=(simT>2.9&&simT<4.8)?0.35:1;
  const dt=dt0*speedMul*slow*(playing?1:0);
  simT+=dt;
  const ph=phaseOf(simT);
  if(playing&&ph!==activeStep&&simT<17){activeStep=ph;syncSteps();}
  /* 忒伊亚进场(直线,瞄准线偏移 b,由 simT 参数化) */
  if(simT<3.0){
    const b=aimOffset();
    const cx=contactX();
    const startX=cx-30;
    const xNow=startX+ (simT/3.0)*(cx-startX);
    theia.position.set(xNow,0,b);
    theia.rotation.y+=dt0*0.4;
  }else if(simT<4.6){
    /* 接触:压缩、下潜 */
    const k=(simT-3.0)/1.6;
    theia.visible=k<0.55;
    theia.scale.set(1-0.5*k,1-0.4*k,1-0.5*k);
    theia.position.x=contactX()-(theia.scale.x*1.59)*k*0.8;
    earth.scale.setScalar(1+0.035*k);
    earthR=R_E*(1+0.035*k);
    theiaCore.visible=true;
    const ck=clamp((simT-3.1)/1.3,0,1);
    theiaCore.position.set(contactX()*(1-ck),0,aimOffset()*(1-ck));
    spawnDebris(dt);
  }else{
    theia.visible=false;
    if(simT<4.9){theiaCore.visible=true;theiaCore.position.multiplyScalar(Math.exp(-3*dt0));}
    else theiaCore.visible=false;
  }
  earth.scale.setScalar(earthR/R_E);
  /* 粒子(大步长时拆两半,保积分稳定) */
  const nSub=dt>0.06?2:1;
  let sd=null;
  for(let s=0;s<nSub;s++)sd=stepParticles(Math.max(dt/nSub,1e-5));
  /* 月球 */
  if(simT>=9.5&&nMoon>4){
    moon.visible=true;
    const mr=simT<16?11.4:11.4*Math.pow(180/11.4,Math.min(1,(simT-16)/13));
    const w=Math.sqrt(MU/(mr*mr*mr));
    const ma=w*simT*0.5;
    moon.position.set(mr*Math.cos(ma),0,mr*Math.sin(ma));
    moon.scale.setScalar(moonR/0.3);
    orbRing.visible=true;
    orbRing.scale.set(mr,mr,mr);
  }
  /* 潮汐演化:自转减慢 */
  if(simT>=16){earthSpin=0.55*Math.pow(0.1/0.55,Math.min(1,(simT-16)/13));}
  earth.rotation.y+=earthSpin*dt0*(playing?1:0);
  /* 粒子实例矩阵(死粒子保持零缩放,不出现残影) */
  for(let i=0;i<NP;i++){
    const p=parts[i];
    if(!p.alive){pMesh.setMatrixAt(i,zeroM);continue;}
    tmpP.set(p.x,p.y,p.z);
    tmpQ.identity();
    tmpS.set(p.s,p.s,p.s);
    tmpM.compose(tmpP,tmpQ,tmpS);
    pMesh.setMatrixAt(i,tmpM);
  }
  pMesh.instanceMatrix.needsUpdate=true;
  /* 相机:潮汐段温和拉远(用户拖动时暂停 3 s) */
  if(simT>=16&&userHold<=0){
    const need=moon.position.length()*1.35+8;
    const cur=camera.position.distanceTo(controls.target);
    if(cur<need){
      const dir=camera.position.clone().sub(controls.target).normalize();
      camera.position.copy(controls.target).add(dir.multiplyScalar(cur+(need-cur)*0.02));
    }
  }
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();replay();start();
</script>
