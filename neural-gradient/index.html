<title>神经网络 · 梯度下降:小球怎么滚向最小损失</title>
<style>
  :root, :root[data-theme="dark"] {

  :root[data-theme="light"] {

    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);

  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;

  :root[data-theme="light"] .lbl { text-shadow: none; }

  .lbl.min { border-color: rgba(67,209,124,.9); color: #c9f3da; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(130,60,190,.9); color: #7a2fb0; }
  :root[data-theme="light"] .lbl.min { border-color: rgba(71,112,31,.9); color: #3f6d1c; }
  :root[data-theme="light"] .lbl.bad { border-color: rgba(200,60,60,.9); color: #b83232; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;

  #actions { display: flex; gap: 8px; margin-bottom: 6px; }

  .abtn:hover { border-color: var(--acc); color: var(--text); }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }

  #steps li.on { background: rgba(203,108,229,.10); border-color: rgba(203,108,229,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(138,43,226,.08); border-color: rgba(138,43,226,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #e3b8f5; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;

  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.wire.color.set(THEME === 'light' ? 0xffffff : 0x39424f);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('神经网络 · 梯度下降', 'Neural Nets · Gradient Descent');
  for (const r of labelRegistry) r.o.element.textContent = L(r.zh, r.en);
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(6.6, 5.8, 8.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 9, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-6, 3, -6);
scene.add(fill);

/* ---------------- 材质 ---------------- */
const M = {
  wire: new THREE.MeshBasicMaterial({ color: 0x39424f, wireframe: true, transparent: true, opacity: 0.1 }),
  ball: new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffd166, emissiveIntensity: 0.55, roughness: 0.35 }),
  arrow: new THREE.MeshBasicMaterial({ color: 0xff5d5d, transparent: true, opacity: 0.95 }),
  minMark: new THREE.MeshBasicMaterial({ color: 0x43d17c, transparent: true, opacity: 0.9 }),
  trail: new THREE.MeshBasicMaterial({ color: 0xcb6ce5, transparent: true, opacity: 0.85 }),
};

/* ================= 损失曲面:f = a(x²+b·y²) + c·sin x·cos y ================= */
const A = 0.14, B = 1.3, C = 1.35, H = 0.92, EXT = 4.2;
const f = (x, y) => A * (x * x + B * y * y) + C * Math.sin(x) * Math.cos(y);
const gx = (x, y) => 2 * A * x + C * Math.cos(x) * Math.cos(y);
const gy = (x, y) => 2 * A * B * y - C * Math.sin(x) * Math.sin(y);
const toWorld = (x, y, out) => out.set(x, f(x, y) * H, y);

/* 全局最小(粗网格搜索) */
let gmin = { x: 0, y: 0, f: 1e9 };
for (let ix = -40; ix <= 40; ix++) for (let iy = -40; iy <= 40; iy++) {
  const x = ix / 10, y = iy / 10;
  const v = f(x, y);
  if (v < gmin.f) gmin = { x, y, f: v };
}

/* 曲面网格 + 顶点着色 */
const SEG = 110;
const surfGeo = new THREE.PlaneGeometry(EXT * 2, EXT * 2, SEG, SEG);
surfGeo.rotateX(-Math.PI / 2);
{
  const pos = surfGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const lo = gmin.f, hi = f(EXT, EXT);
  const cLow = new THREE.Color(0x2ecf8f), cMid = new THREE.Color(0x4c9fd8), cHigh = new THREE.Color(0xe06a5a);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const v = f(x, z);
    pos.setY(i, v * H);
    const t = clamp((v - lo) / (hi - lo), 0, 1);
    if (t < 0.45) tmp.lerpColors(cLow, cMid, t / 0.45);
    else tmp.lerpColors(cMid, cHigh, (t - 0.45) / 0.55);
    colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  surfGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  surfGeo.computeVertexNormals();
}
const surf = new THREE.Mesh(surfGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.75, metalness: 0.05, transparent: true, opacity: 0.96 }));
scene.add(surf);
scene.add(new THREE.Mesh(surfGeo, M.wire));

/* 全局最小标记 */
const minMark = new THREE.Group();
{
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.03, 8, 28), M.minMark);
  ring.rotation.x = Math.PI / 2;
  minMark.add(ring);
  const pin = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.3, 10), M.minMark);
  pin.position.y = 0.18;
  minMark.add(pin);
}
toWorld(gmin.x, gmin.y, minMark.position);
minMark.position.y += 0.03;
scene.add(minMark);

/* 小球 + 轨迹 */
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 18), M.ball);
scene.add(ball);
const TRAIL_N = 400;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
trailGeo.setDrawRange(0, 0);
const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xcb6ce5, transparent: true, opacity: 0.9 }));
scene.add(trail);
let trailLen = 0;

/* −∇L 箭头 */
const gradArrow = new THREE.Group();
{
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1, 8), M.arrow);
  shaft.rotation.z = Math.PI / 2;
  shaft.position.x = 0.5;
  gradArrow.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.2, 10), M.arrow);
  tip.rotation.z = Math.PI / 2;
  tip.position.x = 1.08;
  gradArrow.add(tip);
}
scene.add(gradArrow);

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(zh, en, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.textContent = zh;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, zh, en });
  return o;
}
const lblMin = addLabel('全局最小', 'global minimum', new THREE.Vector3(0, 0.42, 0), 'min', minMark);
const lblBall = addLabel('θ', 'θ', new THREE.Vector3(0, 0.35, 0), 'g', ball);
const lblStatus = addLabel('点击曲面放置小球', 'click the surface to drop the ball', new THREE.Vector3(0, 4.1, 0), 'st');

/* ================= 状态 ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
const LR0 = 0.006, LR1 = 0.9;
let lr = clamp(qsFloat('lr', 0.09), LR0, LR1);
let mom = clamp(qsFloat('mom', 0), 0, 0.95);
const pos = new THREE.Vector2(2.9, 2.4);
const vel = new THREE.Vector2(0, 0);
let steps = 0;
let diverged = 0;
function lrOf(s) { return LR0 * Math.pow(LR1 / LR0, s / 100); }
function placeBall(x, y) {
  pos.set(clamp(x, -EXT + 0.1, EXT - 0.1), clamp(y, -EXT + 0.1, EXT - 0.1));
  vel.set(0, 0);
  steps = 0;
  diverged = 0;
  trailLen = 0;
  trailGeo.setDrawRange(0, 0);
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '曲面 = 损失景观', be: 'The loss landscape',
    d: '曲面上每个点是一组参数 θ,高度是损失 L(θ)——训练就是找低洼处。点击曲面任意位置放下小球。',
    de: 'Every point is a parameter setting θ; height is the loss L(θ). Training means finding the basins. Click anywhere to drop the ball.',
    act: () => { placeBall(2.9, 2.4); setLr(0.09); setMom(0); } },
  { b: '负梯度 = 最陡下山', be: '−∇L = steepest downhill',
    d: '红箭头指向 −∇L:坡最陡的下山方向。每一步 θ ← θ − η·∇L——求导就是问「往哪边走更低」。',
    de: 'The red arrow points along −∇L, the steepest descent. Each step: θ ← θ − η·∇L — the derivative just says which way is down.',
    act: () => { placeBall(2.9, 2.4); setLr(0.09); setMom(0); } },
  { b: '学习率:一步多大', be: 'Learning rate: step size',
    d: 'η 太小:磨蹭到天荒地老;η 合适:稳步滑向谷底;η 太大:在谷壁间之字弹跳,甚至发散飞出曲面——把滑块拉到最右试试。',
    de: 'Tiny η crawls forever; good η glides to the basin; huge η bounces valley wall to wall or explodes off the edge — drag the slider to the max.',
    act: () => { placeBall(2.9, 2.4); setLr(0.62); setMom(0); } },
  { b: '动量:滚过小坑谷', be: 'Momentum: roll through valleys',
    d: 'β 把历史速度攒起来:小坑谷拦不住,一路冲向更低处;但也可能冲过头——局部极小 vs 全局最小,就是曲线这里的两个洼。',
    de: 'Momentum accumulates velocity: small dips no longer trap the ball. But it can overshoot — local vs global minimum are the two basins here.',
    act: () => { placeBall(-2.6, 2.5); setLr(0.16); setMom(0.9); } },
  { b: '反向传播 = 链式法则', be: 'Backprop = chain rule',
    d: '深网几十层,∇L 怎么算?从输出层出发,链式法则逐层把「误差的锅」乘回每一层——一次反向遍历,全部参数的梯度到手。',
    de: 'How do you get ∇L across dozens of layers? Start at the output and multiply the error back through each layer by the chain rule — one backward pass grades every parameter.',
    act: () => { placeBall(3.4, -2.2); setLr(0.12); setMom(0.5); } },
];
function stepIndex() {
  if (mom >= 0.8) return 3;
  if (lr > 0.45) return 2;
  if (steps > 0) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elLr = document.getElementById('lr');
const elLrVal = document.getElementById('lrVal');
const elMom = document.getElementById('mom');
const elMomVal = document.getElementById('momVal');
const tglLabels = document.getElementById('tglLabels');
const tglArrow = document.getElementById('tglArrow');
const tglTrail = document.getElementById('tglTrail');
const tglRotate = document.getElementById('tglRotate');
const stL = document.getElementById('stL'), stG = document.getElementById('stG'),
  stN = document.getElementById('stN'), stS = document.getElementById('stS');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setLr(v) {
  lr = v;
  elLr.value = Math.round(100 * Math.log(v / LR0) / Math.log(LR1 / LR0));
  elLrVal.textContent = v.toFixed(3);
}
function setMom(v) {
  mom = v;
  elMom.value = Math.round(v * 100);
  elMomVal.textContent = v.toFixed(2);
}
elLr.addEventListener('input', () => setLr(lrOf(parseInt(elLr.value, 10))));
elMom.addEventListener('input', () => setMom(parseInt(elMom.value, 10) / 100));
document.getElementById('btnReset').addEventListener('click', () => placeBall(2.9, 2.4));
document.getElementById('btnRidge').addEventListener('click', () => placeBall(-2.6, 2.5));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglArrow.addEventListener('change', () => { gradArrow.visible = tglArrow.checked; });
tglTrail.addEventListener('change', () => { trail.visible = tglTrail.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* 点击曲面放置小球(与拖拽旋转区分) */
const ray = new THREE.Raycaster();
let downXY = null;
renderer.domElement.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  downXY = null;
  if (moved > 6) return;
  const ndc = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(surf, false)[0];
  if (hit) placeBall(hit.point.x, hit.point.z);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let stepAcc = 0;
const wp = new THREE.Vector3(), gdir = new THREE.Vector3(), gv = new THREE.Vector2();
const STEP_RATE = 45;   // 每秒 GD 步数
function stepDescent(dts) {
  if (diverged > 0) { diverged -= dts; if (diverged <= 0) placeBall(2.9, 2.4); return; }
  stepAcc += dts * STEP_RATE;
  let n = Math.min(Math.floor(stepAcc), 300);
  stepAcc -= n;
  for (let i = 0; i < n; i++) {
    gv.set(gx(pos.x, pos.y), gy(pos.x, pos.y));
    vel.multiplyScalar(mom);
    vel.addScaledVector(gv, -lr);
    pos.addScaledVector(vel, 1);
    steps++;
    if (pos.length() > EXT * 1.25 || !Number.isFinite(pos.x)) { diverged = 1.6; break; }
  }
}
function pushTrail(x, y, z) {
  const a = trailGeo.attributes.position;
  if (trailLen >= TRAIL_N) {
    a.array.copyWithin(0, 3);
    a.setXYZ(TRAIL_N - 1, x, y, z);
  } else {
    a.setXYZ(trailLen, x, y, z);
    trailLen++;
  }
  a.needsUpdate = true;
  trailGeo.setDrawRange(0, trailLen);
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) stepDescent(dts);

  toWorld(pos.x, pos.y, wp);
  ball.position.copy(wp);
  ball.position.y += 0.13;
  if (diverged > 0) {
    ball.position.y += 1.2;
    M.ball.emissiveIntensity = 1.4;
  } else M.ball.emissiveIntensity = 0.55;

  /* 轨迹 */
  if (playing && diverged <= 0) {
    pushTrail(wp.x, wp.y + 0.06, wp.z);
  }

  /* 梯度箭头 */
  const g = new THREE.Vector2(gx(pos.x, pos.y), gy(pos.x, pos.y));
  const gl = g.length();
  if (tglArrow.checked && gl > 0.02 && diverged <= 0) {
    gdir.set(-g.x / gl, 0, -g.y / gl);
    gradArrow.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), gdir);
    gradArrow.position.copy(wp);
    gradArrow.position.y += 0.28;
    gradArrow.scale.set(clamp(gl * 0.55, 0.3, 1.6), 1, 1);
    gradArrow.visible = true;
  } else gradArrow.visible = false;

  /* 状态 */
  const converged = gl < 0.035 && vel.length() < 0.02 && diverged <= 0;
  const isGlobal = converged && Math.abs(f(pos.x, pos.y) - gmin.f) < 0.06;
  lblStatus.element.textContent =
    diverged > 0 ? L('η 太大:发散飞出曲面!自动重置…', 'η too large: diverged! resetting…')
    : isGlobal ? L('收敛:全局最小!', 'converged: global minimum!')
    : converged ? L('收敛:局部极小(试试动量冲出去)', 'converged: local minimum (try momentum)')
    : `L = ${f(pos.x, pos.y).toFixed(3)} · 步数 ${steps}`;
  lblStatus.element.className = 'lbl ' + (diverged > 0 ? 'bad' : isGlobal || converged ? 'min' : 'st');
  stL.textContent = f(pos.x, pos.y).toFixed(3);
  stG.textContent = gl.toFixed(3);
  stN.textContent = diverged > 0 ? '—' : steps;
  stS.textContent = diverged > 0 ? L('发散', 'diverged') : converged ? (isGlobal ? L('全局最小', 'global min') : L('局部极小', 'local min')) : L('下降中', 'descending');

  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setLr(lr);
setMom(mom);
placeBall(2.9, 2.4);
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
