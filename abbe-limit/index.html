<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#91a7ff;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);

  :root[data-theme="light"]{

    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;

  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}

    border:1px solid transparent;align-items:flex-start}

  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="阿贝衍射极限" data-en="The Abbe Diffraction Limit">阿贝衍射极限</h1>
  <div class="sub" data-zh="显微镜不是放大镜,是衍射仪器:物镜只接得住样品散射光里有限的几级,两点的像就是两团艾里斑,斑一粘连细节就糊——d=λ/2NA 划下红线;油浸把 NA 抬到 1.4、紫外把 λ 砍半,再往后只能换电子 · 拖动旋转 / 空格运行/暂停" data-en="A microscope is not a magnifying glass — it is a diffraction instrument: the objective catches only a few orders of the light scattered by the sample, two points image as two Airy disks, and once the disks overlap the detail smears out — d = λ/2NA draws the red line; oil immersion lifts NA to 1.4, ultraviolet halves λ, and beyond that you switch to electrons · drag to orbit / Space = run/pause">显微镜不是放大镜,是衍射仪器:物镜只接得住样品散射光里有限的几级,两点的像就是两团艾里斑,斑一粘连细节就糊——d=λ/2NA 划下红线;油浸把 NA 抬到 1.4、紫外把 λ 砍半,再往后只能换电子 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,28,85);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(7.4,4.9,11.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.4,2.8,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const daisM=new THREE.MeshStandardMaterial({color:0x242a34,roughness:0.85});
const dais=new THREE.Mesh(new THREE.CylinderGeometry(8.5,8.5,0.16,64),daisM);
dais.position.y=-0.08;scene.add(dais);

/* ---- 载物台与载玻片 ---- */
const metalM=new THREE.MeshStandardMaterial({color:0x2b3038,metalness:0.85,roughness:0.35});
const pedestal=new THREE.Mesh(new THREE.BoxGeometry(1.7,1.12,1.5),metalM);
pedestal.position.set(0,0.56,0);scene.add(pedestal);
const slideM=new THREE.MeshPhysicalMaterial({color:0xdfe8f2,roughness:0.05,transparent:true,opacity:0.3,side:THREE.DoubleSide});
const slide=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.07,2.4),slideM);
slide.position.set(0,1.155,0);scene.add(slide);

/* ---- 物镜:镜筒+多层透镜组+鼻锥+支架 ---- */
const objG=new THREE.Group();scene.add(objG);
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.34,1.5,32),metalM);
barrel.position.y=4.15;objG.add(barrel);
const knurl1=new THREE.Mesh(new THREE.TorusGeometry(0.49,0.03,8,36),metalM);
knurl1.rotation.x=Math.PI/2;knurl1.position.y=4.6;objG.add(knurl1);
const knurl2=knurl1.clone();knurl2.position.y=4.35;objG.add(knurl2);
const glassM=new THREE.MeshPhysicalMaterial({color:0xa5d8ff,roughness:0.05,transparent:true,opacity:0.4,side:THREE.DoubleSide});
[[0.30,3.62],[0.27,3.44],[0.24,3.26],[0.20,3.10]].forEach(d=>{
  const lens=new THREE.Mesh(new THREE.CylinderGeometry(d[0],d[0],0.06,28),glassM);
  lens.position.y=d[1];objG.add(lens);
});
const nose=new THREE.Mesh(new THREE.CylinderGeometry(0.20,0.09,0.4,24),metalM);
nose.position.y=2.9;objG.add(nose);
const arm=new THREE.Mesh(new THREE.BoxGeometry(0.14,2.4,0.14),metalM);
arm.position.set(0,5.9,-0.45);objG.add(arm);
const head=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.28,0.6),metalM);
head.position.set(0,7.0,-0.45);objG.add(head);

/* ---- 样品:两个点光源(间距随时间摆动)+ 光锥 ---- */
const ptM=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x69db7c,emissiveIntensity:2.2,roughness:0.4});
const pt1=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8),ptM);scene.add(pt1);
const pt2=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8),ptM.clone());scene.add(pt2);
const coneGeo=new THREE.CylinderGeometry(1,0.012,1,24,1,true);
const coneMat=new THREE.MeshBasicMaterial({color:0x69db7c,transparent:true,opacity:0.13,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
const cone1=new THREE.Mesh(coneGeo,coneMat);cone1.position.y=1.21+1.83/2;scene.add(cone1);
const cone2=new THREE.Mesh(coneGeo,coneMat.clone());cone2.position.y=1.21+1.83/2;scene.add(cone2);

/* ---- 像面:面板 + 两团艾里斑(同心环纹理)+ STED 耗散环 ---- */
const imageG=new THREE.Group();scene.add(imageG);
const imgPanel=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.04,1.6),slideM.clone());
imgPanel.material.opacity=0.12;imgPanel.position.y=5.6;imageG.add(imgPanel);
function airyTexture(){
  const S=256,c=document.createElement('canvas');c.width=c.height=S;
  const ctx=c.getContext('2d');const img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const dx=(x-S/2)/(S/2),dy=(y-S/2)/(S/2),r=Math.hypot(dx,dy);
    const I=Math.exp(-r*11)+0.055*Math.exp(-Math.pow((r-0.62)*22,2))
      +0.03*Math.exp(-Math.pow((r-0.85)*26,2))+0.018*Math.exp(-Math.pow((r-1.0)*30,2));
    const o=(y*S+x)*4;
    img.data[o]=255;img.data[o+1]=255;img.data[o+2]=255;img.data[o+3]=Math.round(clamp(I,0,1)*255);
  }
  ctx.putImageData(img,0,0);
  return new THREE.CanvasTexture(c);
}
const airyTex=airyTexture();
const airyMat1=new THREE.MeshBasicMaterial({map:airyTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,color:0x69db7c});
const airyMat2=airyMat1.clone();
const disk1=new THREE.Mesh(new THREE.CircleGeometry(0.5,40),airyMat1);disk1.position.y=5.78;imageG.add(disk1);
const disk2=new THREE.Mesh(new THREE.CircleGeometry(0.5,40),airyMat2);disk2.position.y=5.78;imageG.add(disk2);
const stedMat=new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false});
const stedR1=new THREE.Mesh(new THREE.TorusGeometry(0.36,0.03,8,40),stedMat);stedR1.position.y=5.78;stedR1.visible=false;imageG.add(stedR1);
const stedR2=new THREE.Mesh(new THREE.TorusGeometry(0.36,0.03,8,40),stedMat.clone());stedR2.position.y=5.78;stedR2.visible=false;imageG.add(stedR2);

/* ---- 光栅样品架:三块条纹板(粗/中/细)+ 像面条纹 ---- */
const RACKX=4.15,ZC=0.35;
const plates=[
  {y:1.45,P:1600,w:0.10,per:0.16},
  {y:1.90,P:800,w:0.055,per:0.13},
  {y:2.35,P:400,w:0.028,per:0.08}
];
const boardM=new THREE.MeshStandardMaterial({color:0x14181e,roughness:0.7});
const imgBoardM=new THREE.MeshStandardMaterial({color:0x0c0f13,roughness:0.9});
plates.forEach(p=>{
  const b=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.04,0.55),boardM);
  b.position.set(RACKX,p.y,ZC);scene.add(b);
  const ib=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.03,0.5),imgBoardM);
  ib.position.set(RACKX,p.y,ZC+0.55);scene.add(ib);
});
[[3.5,0.35],[4.8,0.35]].forEach(px=>{
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,2.6,10),metalM);
  rod.position.set(px[0],1.3,px[1]);scene.add(rod);
});
const NS=21;
const srcMat=new THREE.MeshBasicMaterial({color:0x69db7c});
const srcStripes=new THREE.InstancedMesh(new THREE.BoxGeometry(1.3,0.018,1),srcMat,NS);
scene.add(srcStripes);
const imgMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9});
const imgStripes=new THREE.InstancedMesh(new THREE.BoxGeometry(1.3,0.014,1),imgMat,NS);
scene.add(imgStripes);
const m4b=new THREE.Matrix4(),cTmp=new THREE.Color();

/* ---- 油浸层 ---- */
const oilDrop=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.5,1.72,24),
  new THREE.MeshPhysicalMaterial({color:0xffe8a3,roughness:0.1,transparent:true,opacity:0.22,side:THREE.DoubleSide}));
oilDrop.position.set(0,2.06,0);oilDrop.visible=false;scene.add(oilDrop);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let lam=550,theta=41,oil=false,sted=false,demoRate=0.9,slowMo=false;
let curNA=0.65,curD=419,diskScale=1,imgSep=1.0;
const cTmp2=new THREE.Color();
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 波长→颜色(约 400nm 紫 → 550nm 绿 → 700nm 红;UV 深紫) */
function wlColor(l,out){
  if(l<390){out.setHex(0x845ef7);return out;}
  let h;
  if(l<=550)h=0.72-(l-400)/150*0.39;
  else h=0.33-(l-550)/150*0.33;
  out.setHSL(clamp(h,0,0.75),0.85,0.62);
  return out;
}
function setLam(l,fromSlider){
  lam=clamp(l,248,700);
  sted=false;demoRate=0.9;
  if(lam>=400)document.getElementById('sL').value=lam;
  document.getElementById('sLVal').textContent=Math.round(lam)+' nm'+(lam<400?' · UV':'');
  refreshOptics();
}
function setTheta(t){
  theta=clamp(t,20,70);sted=false;
  document.getElementById('sTheta').value=theta;
  document.getElementById('sThetaVal').textContent=theta.toFixed(0)+'°';
  refreshOptics();
}
function setOil(o){oil=o;sted=false;refreshOptics();}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`物镜孔径半角 θ = ${theta}°,NA = n·sinθ = ${curNA.toFixed(2)}`,
  `Objective half-angle θ = ${theta}°, NA = n·sinθ = ${curNA.toFixed(2)}`),
  new THREE.Vector3(2.7,3.1,0),'b');
addLabel(()=>L(`像面:两团艾里斑${imgSep>1.05*disk1.scale.x*0.5*2.2?'可分辨':'粘连,细节糊掉'}(Rayleigh)`,
  `Image plane: the Airy disks ${imgSep>1.05*disk1.scale.x*0.5*2.2?'resolve':'fuse — detail lost'} (Rayleigh)`),
  new THREE.Vector3(2.5,5.9,0),'b',()=>document.getElementById('tglAiry').checked);
addLabel(()=>L('光栅样品:周期比 d 细的条纹,像面一片模糊','Grating: periods finer than d blur out in the image'),
  new THREE.Vector3(RACKX,3.05,ZC),'g');
addLabel(()=>L('油浸层 n=1.515:把大角度散射光接进物镜','Immersion oil n=1.515: catches wide-angle scattered light'),
  new THREE.Vector3(1.7,2.3,0),'y',()=>oil);

function refreshOptics(){
  const n=oil?1.515:1.0;
  curNA=Math.min(1.45,n*Math.sin(theta*Math.PI/180));
  curD=lam/(2*curNA);
  const baseR=Math.min(2.4,Math.tan(theta*Math.PI/180)*1.83);
  cone1.scale.set(baseR,1.83,baseR);cone2.scale.set(baseR,1.83,baseR);
  oilDrop.visible=oil;
  wlColor(lam,cTmp);
  coneMat.color.copy(cTmp);cone2.material.color.copy(cTmp);
  ptM.emissive.copy(cTmp);pt2.material.emissive.copy(cTmp);
  airyMat1.color.copy(cTmp);airyMat2.color.copy(cTmp);
  srcMat.color.copy(cTmp);
  diskScale=clamp(curD/420,0.4,1.3);
  /* 光栅像面:周期 P 相对 d 的模糊度 */
  for(let p=0;p<3;p++){
    const pl=plates[p],bf=clamp(curD/pl.P,0,1);
    const wImg=pl.w*(bf>0.9?4.2:1+2.6*bf);
    for(let j=0;j<7;j++){
      const z=ZC+(j-3)*pl.per+pl.per/2;
      m4b.makeScale(1,1,pl.w);m4b.setPosition(RACKX,pl.y+0.02,z);
      srcStripes.setMatrixAt(p*7+j,m4b);
      m4b.makeScale(1,1,Math.min(wImg,pl.per*0.98));m4b.setPosition(RACKX,pl.y+0.015,ZC+0.55+(j-3)*pl.per+pl.per/2);
      imgStripes.setMatrixAt(p*7+j,m4b);
      cTmp.copy(wlColor(lam,cTmp2)).multiplyScalar(bf>0.9?0.16:1-bf*0.75);
      imgStripes.setColorAt(p*7+j,cTmp);
    }
  }
  srcStripes.instanceMatrix.needsUpdate=true;
  imgStripes.instanceMatrix.needsUpdate=true;
  if(imgStripes.instanceColor)imgStripes.instanceColor.needsUpdate=true;
  updateStats();
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'两点靠近:像斑粘连,细节糊掉',en:'Two points creep closer: the Airy spots fuse and the detail is gone',
  act(){setLam(550);setOil(false);setTheta(41);demoRate=0.16;}},
 {zh:'阿贝判据:d=λ/2NA',en:'The Abbe criterion: d = λ/2NA',
  act(){setLam(550);setOil(false);setTheta(41);demoRate=0.55;}},
 {zh:'NA = n·sinθ:孔径角与介质折射率',en:'NA = n·sinθ: aperture angle times the refractive index of the medium',
  act(){setLam(550);setOil(false);setTheta(66);}},
 {zh:'油浸把 NA 推到 1.4',en:'Oil immersion pushes NA to 1.4',
  act(){setLam(550);setOil(true);setTheta(68);}},
 {zh:'短波长=高分辨:电子显微镜的底层逻辑',en:'Shorter wavelength, higher resolution: the logic behind the electron microscope',
  act(){setLam(248);setOil(false);setTheta(41);}},
 {zh:'超越极限:荧光受激辐射损耗的“作弊”',en:'Beating the limit: STED fluorescence "cheats" past the barrier',
  act(){setLam(560);setOil(true);setTheta(68);sted=true;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stD').innerHTML=curD.toFixed(0)+'<small> nm</small>';
  document.getElementById('stNA').innerHTML=curNA.toFixed(2);
  document.getElementById('stLam').innerHTML=lam.toFixed(0)+'<small> nm</small>';
  document.getElementById('stLP').innerHTML=(500000/curD).toFixed(0)+'<small> lp/mm</small>';
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function presetBtn(id){['bDry','bOil','bUV'].forEach(b=>document.getElementById(b).classList.toggle('on',b===id));}
document.getElementById('bDry').addEventListener('click',()=>{setLam(550);setOil(false);setTheta(41);presetBtn('bDry');});
document.getElementById('bOil').addEventListener('click',()=>{setLam(550);setOil(true);setTheta(68);presetBtn('bOil');});
document.getElementById('bUV').addEventListener('click',()=>{setLam(248);setOil(false);setTheta(41);presetBtn('bUV');});
document.getElementById('sL').addEventListener('input',e=>setLam(+e.target.value,true));
document.getElementById('sTheta').addEventListener('input',e=>setTheta(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglAiry').addEventListener('change',e=>{imageG.visible=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  daisM.color.setHex(dark?0x242a34:0xbfb8ac);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 两点间距摆动:靠近→粘连→分开,循环演示 */
  const sep=0.55+0.5*Math.sin(simT*demoRate);
  imgSep=sep*1.35;
  pt1.position.set(-sep/2,1.21,0);pt2.position.set(sep/2,1.21,0);
  cone1.position.x=pt1.position.x;cone2.position.x=pt2.position.x;
  const pulse=0.11+0.03*Math.sin(simT*7);
  coneMat.opacity=pulse;cone2.material.opacity=pulse;
  /* 艾里斑:位置、缩放、轻微浮动;STED 时斑变小并套上耗散环 */
  const sTgt=diskScale*(sted?0.55:1);
  disk1.scale.setScalar(disk1.scale.x+(sTgt-disk1.scale.x)*Math.min(1,dt*4));
  disk2.scale.copy(disk1.scale);
  disk1.position.set(-imgSep/2,5.78+0.03*Math.sin(simT*1.3),0);
  disk2.position.set(imgSep/2,5.78+0.03*Math.sin(simT*1.3+0.5),0);
  stedR1.visible=stedR2.visible=sted;
  if(sted){
    stedR1.position.copy(disk1.position);stedR2.position.copy(disk2.position);
    stedR1.rotation.z=simT*1.5;stedR2.rotation.z=-simT*1.5;
    const o=0.45+0.35*Math.sin(simT*6);
    stedMat.opacity=o;stedR2.material.opacity=o;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setLam(550);setTheta(41);setOil(false);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
