<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>夸克与强相互作用 · 弦势、禁闭与渐近自由</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#be4bdb;
    --bg:#100b14;--panel:rgba(16,11,20,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(16,11,20,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(16,11,20,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#9c36b5;
    --bg:#f1ecf2;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}.lbl.p{border-color:rgba(212,124,232,.9);color:#f2d7fa}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}:root[data-theme="light"] .lbl.p{color:#9c36b5}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(190,75,219,.6);background:rgba(190,75,219,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(156,54,181,.55);background:rgba(156,54,181,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(190,75,219,.10);border-color:rgba(190,75,219,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(156,54,181,.08);border-color:rgba(156,54,181,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#efdcf7}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

  <h1 data-zh="夸克与强相互作用" data-en="Quarks &amp; the Strong Force">夸克与强相互作用</h1>
  <div class="sub" data-zh="质子=上上下、中子=上下下,三个色荷夸克被胶子弦捆住→弦势不松劲:拉远夸克力不衰减反而线性增长(~1 GeV/fm,张力≈14 吨)→能量攒到 ~2 GeV 弦当场崩断,断口生出正反夸克对——新强子诞生(夸克禁闭,自由夸克从未现身)→极短距上胶子自相互作用使色力减弱=渐近自由(1973 格罗斯-波利策-维尔切克)→质子 938 MeV 里夸克静质量只占 ~1%,其余 99% 是胶子场能与夸克动能 · 拖动旋转 / 空格运行/暂停" data-en="Proton = up-up, neutron = up-down-down: three color-charged quarks bound by gluonic flux tubes → the string potential never sags: pull quarks apart and the force grows linearly instead of fading (~1 GeV/fm, tension ≈ 14 tons) → once the stored energy reaches ~2 GeV the string snaps on the spot, spawning a quark-antiquark pair — new hadrons are born (confinement: a free quark has never been seen) → at sub-fm distances gluon self-interaction weakens the color force = asymptotic freedom (Gross, Politzer, Wilczek 1973) → of the proton's 938 MeV, bare quark masses are ~1%; the other 99% is gluon field energy and quark kinetic energy · drag to orbit / Space = run/pause">质子=上上下、中子=上下下,三个色荷夸克被胶子弦捆住→弦势不松劲:拉远夸克力不衰减反而线性增长(~1 GeV/fm,张力≈14 吨)→能量攒到 ~2 GeV 弦当场崩断,断口生出正反夸克对——新强子诞生(夸克禁闭,自由夸克从未现身)→极短距上胶子自相互作用使色力减弱=渐近自由(1973 格罗斯-波利策-维尔切克)→质子 938 MeV 里夸克静质量只占 ~1%,其余 99% 是胶子场能与夸克动能 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x100b14,12,34);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,200);
camera.position.set(0.2,1.7,7.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=18;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xe0d0f0,0x140a18,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,0.95);key.position.set(5,8,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.35);fill.position.set(-7,5,-6);scene.add(fill);

/* ── 场景:三色夸克 + 胶子弦管 + 断裂对产生 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x181020,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-1.4;scene.add(ground);
const CTR=new THREE.Vector3(0,1.5,0);
/* 核子边界(半透明) */
const shellM=new THREE.MeshStandardMaterial({color:0xc79ae0,roughness:0.4,transparent:true,
  opacity:0.10,side:THREE.DoubleSide,depthWrite:false});
const shell=new THREE.Mesh(new THREE.SphereGeometry(1.45,32,24),shellM);
shell.position.copy(CTR);scene.add(shell);
/* 拉断阈值圈(≈2.35 fm) */
const R_BREAK=2.35;
const breakRingM=0.5+R_BREAK*0.42;
const breakRing=new THREE.Mesh(new THREE.TorusGeometry((0.5+R_BREAK*0.42)*0.577*2,0.012,8,64),
  new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.4,emissive:0xff6b6b,emissiveIntensity:0.4,
    transparent:true,opacity:0.45}));
breakRing.position.copy(CTR);scene.add(breakRing);
/* 三夸克:红/绿/蓝,呈三角形 */
const qCols=[0xff5a5a,0x69db7c,0x74a8ff];
const quarks=[];
for(let i=0;i<3;i++){
  const mat=new THREE.MeshStandardMaterial({color:qCols[i],roughness:0.3,
    emissive:qCols[i],emissiveIntensity:0.75});
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.17,18,14),mat);
  scene.add(m);quarks.push({m,mat});
}
/* 胶子弦管:连接三对夸克,单位圆柱按需缩放 */
const tubeGeo=new THREE.CylinderGeometry(1,1,1,10);
const tubes=[];
for(let i=0;i<3;i++){
  const mat=new THREE.MeshStandardMaterial({color:0xf8c8ff,roughness:0.35,
    emissive:0xd86ae0,emissiveIntensity:0.4,transparent:true,opacity:0.85});
  const m=new THREE.Mesh(tubeGeo,mat);
  scene.add(m);tubes.push({m,mat});
}
function setTube(t,a,b,rad){
  const dir=new THREE.Vector3().subVectors(b,a);const len=dir.length();
  t.m.scale.set(rad,len,rad);
  t.m.position.copy(a).addScaledVector(dir,0.5);
  t.m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
}
/* 胶子(沿弦往返的小亮点) */
const gluons=[];
for(let i=0;i<9;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,8),
    new THREE.MeshBasicMaterial({color:0xffffff}));
  m.visible=false;scene.add(m);
  gluons.push({m,t:Math.random(),pair:Math.floor(Math.random()*3),dir:Math.random()<0.5?1:-1});
}
/* 断裂闪光 + 新生正反夸克对(介子) */
const flashes=[];
for(let i=0;i<3;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.3,14,12),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0}));
  m.visible=false;scene.add(m);flashes.push(m);
}
const mesons=[];
for(let i=0;i<3;i++){
  const g=new THREE.Group();
  const qa=new THREE.Mesh(new THREE.SphereGeometry(0.14,14,12),
    new THREE.MeshStandardMaterial({color:qCols[i],roughness:0.3,emissive:qCols[i],emissiveIntensity:0.7}));
  const qb=new THREE.Mesh(new THREE.SphereGeometry(0.12,14,12),
    new THREE.MeshStandardMaterial({color:0x99e9f2,roughness:0.3,emissive:0x99e9f2,emissiveIntensity:0.7}));
  g.add(qa);g.add(qb);g.visible=false;scene.add(g);
  mesons.push({g,qa,qb,dir:new THREE.Vector3(),mid:new THREE.Vector3()});
}

/* 状态 */
let rFm=0.55,config='p',state='string',resetT=0,gluonsOn=true;
let playing=true,labelsOn=true,slowMo=false;
let simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 物理:κ≈0.9 GeV/fm(张力≈14 t);V=κr−(4/3)αsħc/r;ħc=0.197 GeV·fm */
const HBARC=0.197,KAPPA=0.9;
const alphaS=()=>0.30*Math.pow(clamp(rFm/1.0,0.22,1),0.25);
const potV=()=>Math.max(0,KAPPA*rFm-(4/3)*alphaS()*HBARC/rFm);
const qTri=()=>(0.5+rFm*0.42)*0.577*2;
const FLAV={
 p:{zh:['u +⅔','u +⅔','d −⅓'],en:['u +2/3','u +2/3','d −1/3'],tot:'+1e'},
 n:{zh:['u +⅔','d −⅓','d −⅓'],en:['u +2/3','d −1/3','d −1/3'],tot:'0'}};

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblQ=[];
for(let i=0;i<3;i++){
  lblQ.push(addLabel(()=>{
    const f=FLAV[config];
    return L(f.zh[i],f.en[i]);},
    new THREE.Vector3(0,0,0),['r','g','b'][i]));
}
const lblHad=addLabel(()=>{
  return L(`核子:${config==='p'?'质子 uud':'中子 udd'} · 总电荷 ${FLAV[config].tot} · 色荷 R+G+B=白`,
    `nucleon: ${config==='p'?'proton uud':'neutron udd'} · total charge ${FLAV[config].tot} · color R+G+B=white`);},
  new THREE.Vector3(0,3.6,0),'p');
const lblString=addLabel(()=>L('胶子弦:张力恒定 ≈14 吨,拉得越远储存能量越多',
    'gluonic string: constant tension ≈14 tons — the farther you pull, the more energy it stores'),
  new THREE.Vector3(-2.9,2.6,0),'y',()=>state==='string'&&rFm>0.8);
const lblAsym=addLabel(()=>L('小于 ~0.1 fm:胶子自作用削弱色力 = 渐近自由',
    'below ~0.1 fm: gluon self-interaction weakens the color force = asymptotic freedom'),
  new THREE.Vector3(-2.9,0.6,0),'b',()=>rFm<0.35);
const lblBreak=addLabel(()=>L('势能攒够 2 GeV → 弦断!断口生出 q q̄ 对 → 新强子当场诞生',
    'potential reaches ~2 GeV → the string snaps! A q q̄ pair pops out — new hadrons on the spot'),
  new THREE.Vector3(0,3.0,0),'r',()=>state==='broken');
const lblMeson=addLabel(()=>L('π 介子 = q q̄ 束缚态:强子家族里最小的单元',
    'pion = a q q̄ bound state: the smallest unit of the hadron family'),
  new THREE.Vector3(-2.9,1.6,0),'o',()=>state==='broken');
const lblMass=addLabel(()=>L('夸克静质量 ~9 MeV ÷ 质子 938 MeV ≈ 1%,其余 99% 是胶子场能+动能',
    'bare quark masses ~9 MeV of 938 MeV ≈ 1%; the other 99% is gluon field + kinetic energy'),

function setR(v){rFm=clamp(v,0.15,3.2);
  document.getElementById('sR').value=rFm;
  document.getElementById('sRVal').textContent=rFm.toFixed(2)+' fm';updateStats();}
function setConfig(c){config=c;
  document.getElementById('bProton').classList.toggle('on',c==='p');
  document.getElementById('bNeutron').classList.toggle('on',c==='n');
  updateStats();}
function doBreak(){
  if(state!=='string')return;
  state='broken';resetT=0;
  const pos=qPositions();
  const pairs=[[0,1],[1,2],[2,0]];
  pairs.forEach((pr,i)=>{
    const mid=new THREE.Vector3().addVectors(pos[pr[0]],pos[pr[1]]).multiplyScalar(0.5);
    flashes[i].position.copy(mid);flashes[i].visible=true;flashes[i].scale.setScalar(0.3);
    const me=mesons[i];
    me.mid.copy(mid);
    me.dir.copy(mid).sub(CTR).normalize();
    me.g.visible=true;me.g.position.copy(mid);me.g.scale.setScalar(1);
  });
  tubes.forEach(t=>t.m.visible=false);
  gluons.forEach(g=>g.m.visible=false);
  shellM.opacity=0.04;
  updateStats();
}
function resetString(){
  state='string';
  flashes.forEach(f=>f.visible=false);
  mesons.forEach(me=>me.g.visible=false);
  tubes.forEach(t=>t.m.visible=true);
  setR(0.55);
  shellM.opacity=0.10;
  updateStats();
}

 {b:'色荷与胶子',be:'Color charge & gluons',

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;syncSteps();
  if(state==='broken')resetString();
  STEPS[i].act();}

function updateStats(){
  document.getElementById('stR').innerHTML=rFm.toFixed(2)+'<small> fm</small>';
  const v=potV();
  const vEl=document.getElementById('stV');
  vEl.innerHTML=v.toFixed(2)+'<small> GeV</small>';
  vEl.className='v '+(v>1.6?'warn':'');
  document.getElementById('stF').innerHTML='1.4×10⁵<small> N ≈ 14 t</small>';
  const hEl=document.getElementById('stHad');
  if(state==='broken'){hEl.textContent=L('π 介子 ×3','3 pions');hEl.className='v warn';}
  else{
    hEl.textContent=config==='p'?L('质子 uud','proton uud'):L('中子 udd','neutron udd');
    hEl.className='v ok';
  }
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bProton').addEventListener('click',()=>setConfig('p'));
document.getElementById('bNeutron').addEventListener('click',()=>setConfig('n'));
document.getElementById('bSnap').addEventListener('click',()=>doBreak());
document.getElementById('sR').addEventListener('input',e=>setR(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglGluon').addEventListener('change',e=>{gluonsOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x100b14:0xe9e2ec);
  scene.fog.color.setHex(dark?0x100b14:0xe9e2ec);
  groundM.color.setHex(dark?0x181020:0xd2c4d8);
  if(state==='string')shellM.opacity=dark?0.10:0.08;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
const qPos=[new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()];
function qPositions(){
  const R=qTri(),ang=[90,210,330];
  for(let i=0;i<3;i++){
    const a=ang[i]*Math.PI/180;
    qPos[i].set(CTR.x+R*Math.cos(a),CTR.y+R*Math.sin(a),CTR.z+(i-1)*0.06);
  }
  return qPos;
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const pos=qPositions();
  /* 夸克抖动(量子零点) */
  quarks.forEach((q,i)=>{
    q.m.position.copy(pos[i]);
    q.m.position.x+=0.028*Math.sin(simT*6.3+i*2.1);
    q.m.position.y+=0.028*Math.cos(simT*5.1+i*1.7);
  });
  /* 弦管:随间距变细变亮 */
  const pairs=[[0,1],[1,2],[2,0]];
  if(state==='string'){
    const rad=clamp(0.075/(0.45+rFm*0.42),0.016,0.09);
    const glow=0.35+0.9*(rFm/R_BREAK);
    pairs.forEach((pr,i)=>{
      setTube(tubes[i],quarks[pr[0]].m.position,quarks[pr[1]].m.position,rad);
      tubes[i].mat.emissiveIntensity=Math.min(glow,1.6);
    });
    shell.scale.setScalar(clamp(0.55+rFm*0.55,0.6,1.25));
    shellM.opacity=clamp(0.13-rFm*0.03,0.04,0.13);
    /* 胶子沿弦往返 */
    gluons.forEach(g=>{
      g.m.visible=gluonsOn&&state==='string';
      if(!g.m.visible)return;
      g.t+=dts*(0.9+0.4*Math.sin(simT+g.pair));
      if(g.t>=1){g.t=0;g.dir*=-1;g.pair=Math.floor(Math.random()*3);}
      const pr=pairs[g.pair];
      const a=quarks[pr[0]].m.position,b=quarks[pr[1]].m.position;
      g.m.position.lerpVectors(a,b,g.dir>0?g.t:1-g.t);
    });
    /* 过阈值 → 崩断 */
    if(rFm>=R_BREAK&&playing)doBreak();
  }else{
    /* 断裂动画:闪光 + 介子飞散,2.6 s 后重置 */
    resetT+=dts;
    flashes.forEach(f=>{
      const s=Math.min(1,resetT/0.45);
      f.scale.setScalar(0.3+s*1.6);
      f.material.opacity=Math.max(0,0.9*(1-resetT/0.6));
      if(resetT>0.6)f.visible=false;
    });
    mesons.forEach(me=>{
      me.g.position.copy(me.mid).addScaledVector(me.dir,resetT*1.15);
      me.qa.position.set(0.14*Math.sin(resetT*9),0.14*Math.cos(resetT*9),0);
      me.qb.position.set(-0.14*Math.sin(resetT*9),-0.14*Math.cos(resetT*9),0);
      if(resetT>1.6)me.g.scale.setScalar(Math.max(0.05,1-(resetT-1.6)));
    });
    if(resetT>2.6)resetString();
  }
  /* 标签跟随夸克 */
  lblQ.forEach((lb,i)=>{
    lb.position.copy(quarks[i].m.position);lb.position.y+=0.34;
  });
  breakRing.material.opacity=state==='string'?clamp(0.15+0.5*(rFm/R_BREAK-0.5),0.12,0.6):0.1;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
setR(0.55);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
