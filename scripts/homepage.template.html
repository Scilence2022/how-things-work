<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Things Work · 万物原理 — 原理展示动画合集</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1219; --bg-soft: #151b25;
    --card: rgba(255,255,255,.045); --card-border: rgba(255,255,255,.09);
    --text: #eef3f9; --text2: #9fb0c3; --text3: #c7d2de;
    --acc: #e63946;
    --tool: rgba(255,255,255,.06); --tool-border: rgba(255,255,255,.12);
    --shadow: 0 10px 32px rgba(0,0,0,.40);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f6f9; --bg-soft: #ffffff;
    --card: #ffffff; --card-border: rgba(15,25,40,.10);
    --text: #16202c; --text2: #5b6b7d; --text3: #33414f;
    --acc: #d7263d;
    --tool: #ffffff; --tool-border: rgba(15,25,40,.14);
    --shadow: 0 10px 28px rgba(30,45,70,.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    padding: 40px 20px 64px; transition: background .25s, color .25s; }
  .wrap { max-width: 1120px; margin: 0 auto; }

  /* ===== 顶栏 ===== */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: .4px; color: var(--text2);
    display: flex; align-items: center; gap: 9px; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc);
    box-shadow: 0 0 10px var(--acc); }
  #tools { display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  /* ===== 首屏 ===== */
  .hero { margin: 54px 0 10px; }
  .hero h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800; letter-spacing: .5px;
    line-height: 1.15; }
  .hero h1 .hl { color: var(--acc); }
  .hero .en { font-size: clamp(14px, 2vw, 18px); color: var(--text2); font-weight: 600;
    letter-spacing: 2.5px; text-transform: uppercase; margin-top: 10px; }
  .hero .sub { color: var(--text2); font-size: 14.5px; margin-top: 16px; line-height: 1.8;
    max-width: 760px; }

  /* ===== 领域索引 ===== */
  html { scroll-behavior: smooth; }
  .domnav { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 4px; }
  .domnav a { display: inline-flex; align-items: baseline; gap: 6px; text-decoration: none;
    color: var(--text2); font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--card-border); background: var(--card);
    padding: 5px 13px; border-radius: 999px;
    transition: border-color .15s, color .15s, transform .15s; }
  .domnav a:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  .domnav a .n { font-size: 11px; font-weight: 400; opacity: .7; font-variant-numeric: tabular-nums; }
  h2[id] { scroll-margin-top: 20px; }

  /* ===== 分区与卡片 ===== */
  h2 { font-size: 16px; margin: 44px 0 16px; color: var(--text);
    display: flex; align-items: baseline; gap: 10px; }
  h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px;
    background: var(--acc); align-self: center; }
  h2 .en { font-size: 11.5px; color: var(--text2); font-weight: 600;
    letter-spacing: 1.6px; text-transform: uppercase; }
  h2 .cnt { margin-left: auto; font-size: 12px; color: var(--text2); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  a.card { position: relative; display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 16px 18px 15px; overflow: hidden;
    transition: border-color .18s, transform .18s, box-shadow .18s; }
  a.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--acc); opacity: 0; transition: opacity .18s; }
  a.card:hover { border-color: var(--acc); transform: translateY(-3px); box-shadow: var(--shadow); }
  a.card:hover::before { opacity: 1; }
  .card .t { font-size: 15px; font-weight: 700; color: var(--text); }
  .card .te { font-size: 11px; color: var(--text2); margin-top: 3px; letter-spacing: .3px; }
  .card .d { font-size: 12.5px; color: var(--text2); margin-top: 9px; line-height: 1.6; }
  .card .go { display: inline-block; margin-top: 12px; font-size: 12px; font-weight: 600;
    color: var(--acc); opacity: .85; transition: opacity .15s, transform .15s; }
  a.card:hover .go { opacity: 1; transform: translateX(2px); }

  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--card-border);
    font-size: 12.5px; color: var(--text2); line-height: 1.8; }
  footer a { color: var(--acc); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>how-things-work</div>
    <div id="tools">
      <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
      <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
    </div>
  </header>

  <section class="hero">
    <h1><span data-zh="把「看不见的原理」" data-en="How invisible principles">把「看不见的原理」</span><br><span class="hl" data-zh="用动画讲清楚" data-en="actually work, animated">用动画讲清楚</span></h1>
    <div class="en">How Things Work · Animated Principles</div>
    <p class="sub" data-zh="机械机构怎么传动、化学键怎么断裂与形成、生命过程怎么一步步发生——每个动画都支持分步播放、暂停与逐帧回看。点击卡片进入。" data-en="How mechanisms transmit motion, how chemical bonds break and form, how life unfolds step by step — every animation supports step-through playback, pause and frame-by-frame scrubbing. Click a card to enter.">机械机构怎么传动、化学键怎么断裂与形成、生命过程怎么一步步发生——每个动画都支持分步播放、暂停与逐帧回看。点击卡片进入。</p>
  </section>

<!-- @NAV -->

<!-- @SECTIONS -->

  <footer>
    <span data-zh="原理与因果链优先 · 单文件自包含 · 支持 中文/English 与深色/浅色切换" data-en="Principles and causal chains first · single-file self-contained · 中文/English and dark/light themes supported">原理与因果链优先 · 单文件自包含 · 支持 中文/English 与深色/浅色切换</span><br>
    <span data-zh="源码见 " data-en="Source: ">源码见 </span><a href="https://github.com/Scilence2022/how-things-work">GitHub</a>（<span data-zh="README 内含每个动画的详细说明与调试参数" data-en="the README documents every animation and its debug parameters">README 内含每个动画的详细说明与调试参数</span>）
  </footer>

<script>
'use strict';
/* ===== 主题 / 语言（全站共享模式，子页面同构） ===== */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  document.getElementById('themeBtn').setAttribute('aria-label', THEME === 'dark' ? 'switch to light theme' : 'switch to dark theme');
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = LANG === 'en'
    ? 'How Things Work · Animated Principles'
    : 'How Things Work · 万物原理 — 原理展示动画合集';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});
applyTheme();
applyLang();
</script>
</body>
</html>
