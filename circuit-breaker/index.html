<style>

  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;

    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);

  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }

  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);

  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }

    #panel { width: calc(100vw - 36px); max-height: 55vh; }

</style>

<div id="title">

  <div class="sub" data-zh="电流从进线端串过电磁线圈、触头对与双金属片回到出线端;过载 1.45×In(23 A)双金属一小时内弯到顶开锁扣,短路 5×In(80 A)以上线圈吸力∝(NI)² 瞬间吸动衔铁、约 10 ms 猛拉触头;触头一分开电弧燃起,弧角把它拉上 11 片钢片切成 11 段短弧,弧压升至约 340 V 反超 230 V 电源,电流被强制压向过零而熄灭 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Current flows from LINE through the solenoid, the contact pair and the bimetal back to LOAD; at 1.45×In (23 A) the bimetal bends within an hour to trip the latch, above 5×In (80 A) the coil pull ∝(NI)² snaps the armature and yanks the contacts open in ~10 ms; the arc ignites at once — runners lift it onto 11 steel plates that slice it into 11 series segments, arc voltage climbs to ~340 V, beats the 230 V supply and forces the current to zero · 3D interactive demo · drag to orbit · Space = run/pause">断路器 · 热磁双判官与灭弧室</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const damp = (c, t, k, dt) => c + (t - c) * Math.min(1, dt * k);
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);
/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 14, 42);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x191c22 : 0xb2bec9);
  caseM.color.setHex(dark ? 0x2c3138 : 0x8794a1);
  edgeM.color.setHex(dark ? 0x59616b : 0x7f8c99);
  handleM.color.setHex(dark ? 0xff6b6b : 0xe03131);
  cableM.color.setHex(dark ? 0x22262b : 0x3d4650);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('断路器 · 热磁双判官与灭弧室', 'Circuit Breaker · Thermal + Magnetic Judges & the Arc Chute');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});
/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);
if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 160);
camera.position.set(7.0, 4.6, 9.2);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 1.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 32;
controls.autoRotateSpeed = 0.3;
const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(7, 10, 8);
scene.add(key);
const fillL = new THREE.DirectionalLight(0xffd8a8, 0.25);
fillL.position.set(-8, 5, -6);
scene.add(fillL);
const arcLight = new THREE.PointLight(0x9fc4ff, 0, 6, 2);
arcLight.position.set(-0.6, 2.3, 0.5);
scene.add(arcLight);
/* ================= 物理状态(C16:In = 16 A) ================= */
const IN = 16, TAU = 160, KTH = 2.1, MAG = 5, PLATES = 11, U_SEG = 27, U_COL = 40;
const CLOSE_A = 2.60, OPEN_A = 1.98, ON_X = -0.38, OFF_X = 0.38;

const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const cAcc = css.getPropertyValue('--acc').trim() || '#ff6b6b';
  const padL = 40, padR = 12, padT = 12, padB = 24;
  const lx0 = 0, lx1 = Math.log10(16), lt0 = Math.log10(0.005), lt1 = Math.log10(20000);
  const xOf = I => padL + (Math.log10(clamp(I, 1, 16)) - lx0) / (lx1 - lx0) * (W - padL - padR);
  const yOf = t => (H - padB) - (Math.log10(clamp(t, 0.005, 20000)) - lt0) / (lt1 - lt0) * (H - padT - padB);
  ctx.font = '11px system-ui';
  /* 网格与刻度 */
  ctx.strokeStyle = 'rgba(128,150,170,.18)';
  ctx.fillStyle = cTxt;
  for (const I of [1, 2, 5, 10]) {
    ctx.beginPath(); ctx.moveTo(xOf(I), padT); ctx.lineTo(xOf(I), H - padB); ctx.stroke();
    ctx.fillText(I + '', xOf(I) - 4, H - padB + 14);
  }
  for (const t of [0.01, 0.1, 1, 10, 60, 600, 3600]) {
    ctx.beginPath(); ctx.moveTo(padL, yOf(t)); ctx.lineTo(W - padR, yOf(t)); ctx.stroke();
    const lab = t < 1 ? t + 's' : t < 60 ? t + 's' : t < 3600 ? (t / 60) + 'min' : '1h';
    ctx.fillText(lab, 4, yOf(t) + 4);
  }
  /* 认证边界:1 h 虚线 + 1.13/1.45 标记 */
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = 'rgba(159,176,195,.5)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(3600)); ctx.lineTo(W - padR, yOf(3600)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = cTxt;
  ctx.fillText('1.13', xOf(1.13) - 10, yOf(3600) - 6);
  ctx.fillText('1.45', xOf(1.45) + 4, yOf(tPred(1.45)) - 8);
  ctx.strokeStyle = cTxt;
  for (const [mi, mt] of [[1.13, 3600], [1.45, tPred(1.45)]]) {
    ctx.beginPath(); ctx.arc(xOf(mi), yOf(mt), 4, 0, Math.PI * 2); ctx.stroke();
  }
  /* 热脱扣 I²t 双曲线 */
  ctx.strokeStyle = '#ff9f4d'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i = 0; i <= 70; i++) {
    const I = 1.452 + i / 70 * (5 - 1.452);
    const px = xOf(I), py = yOf(tPred(I));
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.fillStyle = '#ff9f4d';
  ctx.fillText(L('热脱扣 I²t', 'thermal I²t'), xOf(2.1) + 6, yOf(tPred(2.1)) + 14);
  /* 磁脱扣竖直跳变 */
  ctx.strokeStyle = '#4dabf7'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(xOf(5), yOf(tPred(5))); ctx.lineTo(xOf(5), yOf(0.01)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xOf(5), yOf(0.01)); ctx.lineTo(W - padR, yOf(0.01)); ctx.stroke();
  ctx.fillStyle = '#4dabf7';
  ctx.fillText(L('磁脱扣 ≤0.1 s', 'magnetic ≤0.1 s'), xOf(5.15), yOf(0.03));
  /* 动点 */
  let dx, dy, filled = true;
  if (st !== 'closed' && tripI > 0) {
    dx = xOf(tripI); dy = yOf(tripMode === 'mag' ? 0.01 : Math.max(heatT, 0.005));
  } else {
    const tp = tPred(Iset);
    dx = xOf(Iset); dy = Number.isFinite(tp) ? yOf(tp) : H - padB;
    filled = Number.isFinite(tp);
  }
  ctx.fillStyle = cAcc;
  ctx.beginPath(); ctx.arc(dx, dy, 5, 0, Math.PI * 2); ctx.fill();
  if (!filled) { ctx.fillStyle = cTxt; ctx.fillText(L('不动作区', 'no-trip zone'), dx - 20, dy - 10); }
}
