<!DOCTYPE html>

<style>
:root, :root[data-theme="dark"] { color-scheme: dark; --acc:#a9e34b; --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09); --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de; --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45); --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12); --cv-pill:rgba(15,16,20,.8);

}
* { margin: 0; padding: 0; box-sizing: border-box; }

#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

:root[data-theme="light"] .lbl.g { color:#0b725c; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

.tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool); color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600; min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; backdrop-filter: blur(6px); transition: border-color .15s, color .15s, transform .15s; }
.tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
#title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; max-width: calc(100vw - 320px); }
#title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }

#panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px); box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }

.chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }

:root[data-theme="light"] .chip.g { color:#0b725c; } :root[data-theme="light"] .chip.b { color:#1864ab; }

.abtn:hover { border-color: var(--acc); color: var(--text); }
.abtn.on { border-color: rgba(169,227,75,.6); background: rgba(169,227,75,.12); color: var(--text); }
.abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
:root[data-theme="light"] .abtn.on { border-color: rgba(92,148,13,.55); background: rgba(92,148,13,.10); }
.row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
.row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }

#formula b { color: var(--text3); font-weight: 600; }

#steps li:hover { background: var(--hover); }
#steps li.on { background: rgba(169,227,75,.10); border-color: rgba(169,227,75,.45); }

#steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px; display: flex; align-items: center; justify-content: center; margin-top: 1px; background: rgba(255,255,255,.12); color: var(--text3); }
:root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
#steps li.on .n { background: var(--acc); color: #16240a; }
:root[data-theme="light"] #steps li.on .n { color: #fff; }
#steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
#steps .t b { color: var(--text); font-size: 12px; }
#steps li.on .t b { color: #dcf5ae; }

#ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
#play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600; background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
:root[data-theme="dark"] #play { color: #16240a; }
#play:hover { filter: brightness(1.12); }
#toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
#toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center; cursor: pointer; }
#toggles input { accent-color: var(--acc); }
#rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#rel span { font-size: 11.5px; color: var(--text2); }
#rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border); border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
#rel a:hover { color: var(--acc); border-color: var(--acc); }
@media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
@media (max-width: 900px) { #stats { display: none; } }
@media (max-width: 760px) {
#panel { width: calc(100vw - 36px); max-height: 55vh; }
#title { max-width: calc(100vw - 200px); }
#title h1 { font-size: 16px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="遗传算法 · 在适应度地形上爬山" data-en="Genetic Algorithm · Hill-Climbing on a Fitness Landscape">遗传算法 · 在适应度地形上爬山</h1>
  <div class="sub" data-zh="基因在这里就是坐标 (x,z),适应度就是海拔:地形只告诉你「多高」,不告诉你「往哪边」。轮盘赌按 P=fᵢ/Σf 抽亲代,交叉让子代落在两亲代之间;变异让球随机跳步、偶有整球重采样——60 个个体、μ=8% 时每代约 9 个基因跳步、2.3 颗球重采样。低适应球每代暗淡退场,种群像潮水一样漫向高峰;把 μ 调到 0,它们会被锁死在 f=0.66 的局部峰,而 f=1.00 的全局峰遥遥可见——恢复变异,一颗重采样的球越过山谷落在全局峰坡上,种群再度爬升:这就是探索与收敛的权衡 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Genes here are coordinates (x,z) and fitness is altitude: the landscape tells you how high, never which way. The roulette wheel draws parents with P=fᵢ/Σf, crossover puts children between two parents; mutation hops randomly and occasionally resamples a whole ball — with 60 individuals and μ=8%, about 9 genes hop and 2.3 balls resample per generation. Low-fitness balls fade out each generation as the population floods toward the peaks; set μ=0 and it locks onto the f=0.66 local peak while f=1.00 stays out of reach — restore mutation and one resampled ball crosses the valley onto the global slope, and the population climbs again: the exploration-convergence trade-off · 3D interactive demo · drag to orbit · Space = run/pause">遗传算法 · 在适应度地形上爬山</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="世代" data-en="Generation">世代</span><span class="v" id="stGen">0</span>
  <span class="k" data-zh="最佳适应度" data-en="Best fitness">最佳适应度</span><span class="v" id="stBest">—</span>
  <span class="k" data-zh="平均适应度" data-en="Avg fitness">平均适应度</span><span class="v" id="stAvg">—</span>
  <span class="k" data-zh="多样性 σ" data-en="Diversity σ">多样性 σ</span><span class="v" id="stDiv">—</span>
  <span class="k" data-zh="当前峰" data-en="Current peak">当前峰</span><span class="v" id="stPeak">—</span>
  <span class="k" data-zh="找到全局峰?" data-en="Found global?">找到全局峰?</span><span class="v" id="stFound">—</span>
</div>
<div id="plot">
  <h3 data-zh="左:最佳/平均适应度 vs 世代,虚线=全局峰 f=1.00;右:多样性 σ 衰减——变异把它托住,μ=0 则归零锁死" data-en="Left: best/avg fitness vs generation, dashed = global peak f=1.00; right: diversity σ decay — mutation props it up, μ=0 lets it collapse">左:最佳/平均适应度 vs 世代,虚线=全局峰 f=1.00;右:多样性 σ 衰减——变异把它托住,μ=0 则归零锁死</h3>
  <canvas id="plotCv"></canvas>
</div>
<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="个体球:亮度=适应度" data-en="balls: brightness = fitness">个体球:亮度=适应度</span>
    <span class="chip.r" data-zh="变异:闪光+跳步" data-en="mutation: flash + hop">变异:闪光+跳步</span>
    <span class="chip.g" data-zh="亲代连线:交叉配对" data-en="parent links: crossover pairs">亲代连线:交叉配对</span>
    <span class="chip.b" data-zh="地形:亮度=海拔=适应度" data-en="terrain: brightness = altitude = fitness">地形:亮度=海拔=适应度</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnStep" data-zh="单步一代" data-en="Step one generation">单步一代</button>
    <button class="abtn" id="btnReset" data-zh="重置种群" data-en="Reset population">重置种群</button>
    <button class="abtn" id="btnExp" data-zh="变异率=0 实验" data-en="μ=0 experiment">变异率=0 实验</button>
  </div>
  <div class="row"><label data-zh="变异率 μ" data-en="Mutation μ">变异率 μ</label><input id="sMu" type="range" min="0" max="30" step="0.5" value="8"><span class="val" id="sMuVal">8.0 %</span></div>
  <div class="row"><label data-zh="种群规模 N" data-en="Population N">种群规模 N</label><input id="sPop" type="range" min="10" max="100" step="2" value="60"><span class="val" id="sPopVal">60</span></div>
  <div class="row"><label data-zh="交叉强度" data-en="Crossover">交叉强度</label><input id="sCross" type="range" min="0" max="100" step="5" value="40"><span class="val" id="sCrossVal">40 %</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglContour" type="checkbox" checked> <span data-zh="等高线" data-en="Contours">等高线</span></label>
      <label><input id="tglLinks" type="checkbox" checked> <span data-zh="亲代连线" data-en="Parent links">亲代连线</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../simulated-annealing/" data-zh="模拟退火:也靠随机跳逃离局部峰" data-en="simulated annealing: random jumps escape local peaks too">模拟退火:也靠随机跳逃离局部峰</a>
    <a href="../neural-gradient/" data-zh="神经网络:有梯度时的下山法" data-en="neural nets: gradient descent when a gradient exists">神经网络:有梯度时的下山法</a>
    <a href="../monte-carlo/" data-zh="蒙特卡洛:纯随机采样对照" data-en="Monte Carlo: pure random sampling for comparison">蒙特卡洛:纯随机采样对照</a>
    <a href="../shortest-path/" data-zh="最短路:有精确解的另一类问题" data-en="shortest path: problems with exact solutions">最短路:有精确解的另一类问题</a>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);
let gauss2 = null;
function gauss() {                             // Box-Muller 标准正态
  if (gauss2 !== null) { const g = gauss2; gauss2 = null; return g; }
  let u = 0; while (u === 0) u = Math.random();
  const v = Math.random(), r = Math.sqrt(-2 * Math.log(u));
  gauss2 = r * Math.sin(2 * Math.PI * v);
  return r * Math.cos(2 * Math.PI * v);
}
/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d1210, 26, 68);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0d1210 : 0xe3e9dc);
  scene.fog.color.setHex(dark ? 0x0d1210 : 0xe3e9dc);
  groundM.color.setHex(dark ? 0x141a12 : 0xccd5c4);
  contourM.color.setHex(dark ? 0x9fc94f : 0x5c940d); contourM.opacity = dark ? 0.30 : 0.38;
  beaconM.color.setHex(dark ? 0xa9e34b : 0x5c940d); beaconM.opacity = dark ? 0.8 : 0.6;
  ringM.color.setHex(dark ? 0xd7ffa0 : 0x5c940d); ringM.opacity = dark ? 0.85 : 0.6;
  escRingM.color.setHex(dark ? 0xe9ffc0 : 0x5c940d);
  linkM.color.setHex(dark ? 0x5ee6bc : 0x0c7a5f); linkM.opacity = dark ? 0.8 : 0.7;
  glowPM.opacity = dark ? 0.5 : 0.15;
  ghostFadeC.setHex(dark ? 0x000000 : 0xe3e9dc);
  hemi.color.setHex(dark ? 0xdfe8f2 : 0xffffff); hemi.groundColor.setHex(dark ? 0x1a2016 : 0xb5c0ab);
  key.intensity = dark ? 0.9 : 1.15;
  updateTerrainColors();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('遗传算法 · 在适应度地形上爬山', 'Genetic Algorithm · Hill-Climbing on a Fitness Landscape');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  updateFormula();
  updateStats();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});
/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);
if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 160);
camera.position.set(11.5, 8.8, 13);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;

/* ================= 绘图:左 适应度 vs 世代 · 右 多样性 σ ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const acc = css.getPropertyValue('--acc').trim() || '#a9e34b';
  ctx.font = '11px system-ui';
  const padT = 16, padB = 24, gap = 30, midW = (W - gap) / 2;
  const L0 = 8, L1 = midW - 4, R0 = midW + gap, R1 = W - 8, pT = padT, pB = H - padB;
  const yL = v => pB - clamp(v, 0, 1) * (pB - pT);
  /* 左:适应度 */
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.strokeRect(L0, pT, L1 - L0, pB - pT);
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(L0, yL(1)); ctx.lineTo(L1, yL(1)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = cTxt;
  ctx.fillText('f=1.00', L0 + 5, yL(1) - 5);
  const n = histBest.length;
  if (n > 1) {
    const xOf = i => L0 + 3 + (i / (n - 1)) * (L1 - L0 - 6);
    const line = (arr, col, w) => {
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath();
      for (let i = 0; i < n; i++) { const x = xOf(i), y = yL(arr[i]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    };
    line(histAvg, cTxt, 1.6);
    line(histBest, acc, 2.4);
    ctx.fillStyle = acc;
    ctx.beginPath(); ctx.arc(xOf(n - 1), yL(histBest[n - 1]), 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(L0 + 6, pT + 5, 9, 3);
    ctx.fillStyle = cTxt;
    ctx.fillText(L('最佳', 'best'), L0 + 19, pT + 11);
    ctx.fillRect(L0 + 62, pT + 6, 9, 1.6);
    ctx.fillText(L('平均', 'avg'), L0 + 75, pT + 11);
  } else {
    ctx.fillStyle = cTxt;
    ctx.fillText(L('等待世代数据…', 'waiting for generations…'), L0 + 18, (pT + pB) / 2);
  }
  ctx.fillStyle = cTxt;
  ctx.fillText(L('代', 'gen'), L1 - 20, H - 8);
  /* 右:多样性 σ */
  let mx = 0.6;
  for (const v of histDiv) if (v > mx) mx = v;
  const yR = v => pB - clamp(v / mx, 0, 1) * (pB - pT);
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.strokeRect(R0, pT, R1 - R0, pB - pT);
  ctx.fillStyle = cTxt;
  ctx.fillText('σ max ' + mx.toFixed(1), R0 + 5, pT + 11);
  if (histDiv.length > 1) {
    ctx.strokeStyle = '#e8890c'; ctx.lineWidth = 2.2; ctx.beginPath();
    for (let i = 0; i < histDiv.length; i++) {
      const x = R0 + 3 + (i / (histDiv.length - 1)) * (R1 - R0 - 6), y = yR(histDiv[i]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  ctx.fillStyle = cTxt;
  ctx.fillText(L('多样性', 'diversity'), R0 + 5, H - 8);
}

function syncBalls(dtV) {
  const dark = THEME === 'dark';
  const bStops = dark ? BALL_D : BALL_L;
  for (let i = 0; i < IND_MAX; i++) {
    if (i < pop.length) {
      const p = pop[i], v = vis[i];
      const gl = Math.min(1, dtV * 3.0);
      v.px += (p.x - v.px) * gl; v.pz += (p.z - v.pz) * gl;
      if (v.scale < 1) v.scale = Math.min(1, v.scale + dtV * 2.6);
      let hop = 0;
      if (v.hop > 0) { v.hop = Math.max(0, v.hop - dtV * 2.0); hop = Math.sin(Math.PI * (1 - v.hop)) * 0.5; }
      const y = terrainY(v.px, v.pz) + 0.14 + hop;
      dummy.position.set(v.px, y, v.pz);
      dummy.scale.setScalar(Math.max(0.001, v.scale * (p.elite ? 1.18 : 1)));
      dummy.updateMatrix();
      ballsIM.setMatrixAt(i, dummy.matrix);
      rampColor(cTmp, p.fit, bStops);
      if (p.elite) cTmp.lerp(cWhite, 0.3);
      ballsIM.setColorAt(i, cTmp);
      haloPos[i * 3] = v.px; haloPos[i * 3 + 1] = y + 0.03; haloPos[i * 3 + 2] = v.pz;
      haloCol[i * 3] = cTmp.r; haloCol[i * 3 + 1] = cTmp.g; haloCol[i * 3 + 2] = cTmp.b;
    } else {
      dummy.position.set(0, -999, 0); dummy.scale.setScalar(0.001); dummy.updateMatrix();
      ballsIM.setMatrixAt(i, dummy.matrix);
      haloPos[i * 3 + 1] = -999;
    }
  }
  ballsIM.instanceMatrix.needsUpdate = true;
  if (ballsIM.instanceColor) ballsIM.instanceColor.needsUpdate = true;
  glowGeo.attributes.position.needsUpdate = true;
  glowGeo.attributes.color.needsUpdate = true;
  for (let i = 0; i < IND_MAX; i++) {
    if (i < ghosts.length) {
      const g = ghosts[i], k = clamp(g.t / 0.7, 0, 1);
      rampColor(cTmp, g.fit, dark ? BALL_D : BALL_L);
      cTmp.lerp(ghostFadeC, k);
      dummy.position.set(g.x, terrainY(g.x, g.z) + 0.14, g.z);
      dummy.scale.setScalar(Math.max(0.001, 1 - k * 0.6));
      dummy.updateMatrix();
      ghostsIM.setMatrixAt(i, dummy.matrix);
      ghostsIM.setColorAt(i, cTmp);
    } else {
      dummy.position.set(0, -999, 0); dummy.scale.setScalar(0.001); dummy.updateMatrix();
      ghostsIM.setMatrixAt(i, dummy.matrix);
    }
  }
  ghostsIM.instanceMatrix.needsUpdate = true;
  if (ghostsIM.instanceColor) ghostsIM.instanceColor.needsUpdate = true;
  let li = 0;
  if (linksOn && linkTTL > 0) {
    for (const pr of pairs) {
      if (li >= LINK_MAX) break;
      linkPos[li * 6] = pr[0]; linkPos[li * 6 + 1] = terrainY(pr[0], pr[1]) + 0.25; linkPos[li * 6 + 2] = pr[1];
      linkPos[li * 6 + 3] = pr[2]; linkPos[li * 6 + 4] = terrainY(pr[2], pr[3]) + 0.25; linkPos[li * 6 + 5] = pr[3];
      li++;
    }
  }
  for (let k = li; k < LINK_MAX; k++) { linkPos[k * 6 + 1] = -999; linkPos[k * 6 + 4] = -999; }
  linkGeo.attributes.position.needsUpdate = true;
}
/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  const dtV = dt0 * speedMul;
  if (notifyT > 0) notifyT -= dt0;
  simT += dt0;
  if (escT > 0) escT -= dt0;
  if (escCd > 0) escCd -= dt0;
  if (linkTTL > 0) linkTTL -= dt0;
  if (dt > 0) {
    genTimer += dt;
    if (genTimer >= (exp.on ? 0.75 : 1.7)) evolve();
    if (exp.on && exp.phase === 1 && gen - exp.gen0 >= 22) {
      exp.phase = 2;
      mu = exp.prevMu;
      syncSliders(); updateFormula();
      notify(`恢复变异率 μ=${(mu * 100).toFixed(1)}%:等一次罕见的大变异跳下山谷`, `mutation restored to μ=${(mu * 100).toFixed(1)}%: waiting for one rare large jump across the valley`, 4.5);
    }
    if (exp.on && exp.phase === 2 && gen - exp.gen0 >= 44) finishExp(false);
  }
  for (const g of ghosts) g.t += dtV;
  ghosts = ghosts.filter(g => g.t < 0.7);
  stepSparks(dtV);
  syncBalls(dtV);
  /* 全局峰光环脉动 + 逃逸高亮环 */
  summitRing.scale.setScalar(1 + 0.1 * Math.sin(simT * 2.6));
  if (escT > 0) {
    escRing.visible = true;
    escRing.position.copy(escPos);
    const k = 1 - escT / 3.2;
    escRing.scale.setScalar(0.6 + 2.2 * k);
    escRingM.opacity = 0.9 * (1 - k);
  } else escRing.visible = false;
  /* 种群标签跟随质心 */
  lblPop.position.set(cenX, terrainY(cenX, cenZ) + 1.15, cenZ);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.3) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
/* ================= 初始化 ================= */
applyTheme();
resetPop();
buildSteps();
applyLang();
contourLines.visible = contoursOn;
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
