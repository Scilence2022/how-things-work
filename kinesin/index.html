<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>驱动蛋白 · 8 纳米一步的步行者</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.e { border-color: rgba(99,230,190,.9); color: #c3f5e5; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.f { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.m { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(255,209,102,.26); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="驱动蛋白:8 纳米一步的步行者" data-en="Kinesin: the 8-nanometer walker">驱动蛋白:8 纳米一步的步行者</h1>
  <div class="sub" data-zh="两条腿沿微管交替前行:ATP 结合 → 颈部链摆动 → 后脚甩 16nm 越过前脚——一袋 ATP 走一步,把货物送到细胞任何角落 · 空格播放/暂停" data-en="Two legs alternate along a microtubule: ATP binds → the neck linker swings → the rear foot slings 16 nm past the front — one ATP per step, cargo delivered anywhere in the cell · Space = play/pause">两条腿沿微管交替前行：ATP 结合 → 颈部链摆动 → 后脚甩 16nm 越过前脚——一袋 ATP 走一步，把货物送到细胞任何角落 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="步数" data-en="steps">步数</span><span class="v g" id="stSteps">0</span>
  <span class="k" data-zh="消耗 ATP" data-en="ATP spent">消耗 ATP</span><span class="v" id="stATP">0</span>
  <span class="k" data-zh="步行速度" data-en="speed">步行速度</span><span class="v" id="stSpd">—</span>
  <span class="k" data-zh="步幅" data-en="stride">步幅</span><span class="v" style="font-size:14px">8 nm(重心)/ 16 nm(脚)</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.f" data-zh="ATP(黄球,一袋一步)" data-en="ATP (yellow, one bag per step)">ATP(黄球,一袋一步)</span>
    <span class="chip.m" data-zh="微管(+ 端朝右)" data-en="microtubule (+ end right)">微管(+ 端朝右)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnSlow" data-zh="慢动作(看清一条腿)" data-en="slow motion">慢动作(看清一条腿)</button>
  </div>
  <div class="row"><label data-zh="ATP 供给率" data-en="ATP supply">ATP 供给率</label><input id="sup" type="range" min="10" max="100" step="1" value="60"><span class="val" id="supVal">60%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cross-bridge-cycle/" data-zh="表亲:肌球蛋白横桥" data-en="cousin: the myosin cross-bridge">表亲:肌球蛋白横桥</a>
    <a href="../atp-synthase/" data-zh="ATP 从哪来" data-en="where the ATP comes from">ATP 从哪来</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('驱动蛋白', 'Kinesin');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 1.6, 5.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 14;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.2,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const M = {
  tubule: mat(0x63e6be, { opacity: 0.85 }),
  leg: mat(0xb197fc),
  body: mat(0xd0bfff, { emissiveIntensity: 0.2 }),
  cargo: mat(0xffa94d, { opacity: 0.85, emissiveIntensity: 0.2 }),
  atp: new THREE.MeshBasicMaterial({ color: 0xffd166, blending: THREE.AdditiveBlending, transparent: true }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.4, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -1.1;
scene.add(base);

/* ================= 微管(原型纤维条纹的圆柱) ================= */
const MT_R = 0.42;
const mtGrp = new THREE.Group();
mtGrp.position.y = 0.35;
scene.add(mtGrp);
const mtCore = new THREE.Mesh(new THREE.CylinderGeometry(MT_R, MT_R, 14, 28), M.tubule);
mtCore.rotation.z = Math.PI / 2;
mtGrp.add(mtCore);
/* 原纤维条纹(纵向细条) */
for (let i = 0; i < 13; i++) {
  const a = i / 13 * Math.PI * 2;
  if (Math.sin(a) < -0.2) continue;         // 只贴上表面
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(14, 0.02, 0.05),
    new THREE.MeshStandardMaterial({ color: 0x2f9e81, roughness: 0.5, transparent: true, opacity: 0.8 }));
  stripe.rotation.z = Math.PI / 2;
  stripe.position.set(0, Math.cos(a) * (MT_R + 0.005), Math.sin(a) * (MT_R + 0.005));
  mtGrp.add(stripe);
}
/* 结合位点刻度(每 0.42 = 8nm) */
const sites = [];
for (let i = -14; i <= 14; i++) {
  const tick = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
  tick.position.set(i * 0.42, MT_R + 0.02, 0.15);
  mtGrp.add(tick);
  sites.push(i * 0.42);
}

/* ================= 驱动蛋白 ================= */
/* 结构:两个头(脚)+ 柄 + 货物。脚间距 0.84(2 格) */
const kinesin = new THREE.Group();
scene.add(kinesin);
const Y = MT_R + 0.35;
/* 柄(螺旋卷杆) */
const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.9, 8), M.leg);
stalk.position.y = Y + 0.45;
kinesin.add(stalk);
/* 货物(泡) */
const cargo = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 18), M.cargo);
cargo.position.y = Y + 1.18;
kinesin.add(cargo);
/* 两条腿:grouproot at 茎底;每腿 = 大腿+小腿+脚 */
function mkLeg() {
  const g = new THREE.Group();
  const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.42, 8), M.leg);
  thigh.position.y = -0.21;
  g.add(thigh);
  const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.03, 0.3, 8), M.leg);
  shin.position.y = -0.55;
  g.add(shin);
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 10), mat(0xffd166, { emissiveIntensity: 0.3 }));
  foot.position.y = -0.72;
  g.add(foot);
  kinesin.add(g);
  return { g, foot };
}
const legA = mkLeg();
const legB = mkLeg();
legA.g.position.set(-0.1, Y, 0);
legB.g.position.set(0.1, Y, 0);

/* ATP 小球飞行 */
const atps = [];   // {mesh, t, to}
function flyATP(to) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), M.atp);
  m.position.set((Math.random() - 0.5) * 1.5, Y + 2.0, (Math.random() - 0.5) * 1.0);
  scene.add(m);
  atps.push({ mesh: m, t: 0, to: to.clone() });
}

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let supply = 0.6;
let slowmo = false;
let tSim = 0;
let steps = 0, atpSpent = 0;
/* 步态状态机:0 前脚A后脚B → ATP→neck linker 摆→B 甩到前面 */
let walkT = 0;           // 一步的相位 0..1
let leadIsA = false;     // 当前在前面的脚
let spdEMA = 0;
let lastStepT = 0;
const STEP_PERIOD = 1.1; // 满供给时一步秒数

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblMT = addLabel(() => L('微管:细胞内的「公路」,轨道蛋白一格 8nm,+ 端朝右', 
  'microtubule: the cell\'s highway; one docking site per 8 nm, plus-end to the right'),
  new THREE.Vector3(0, -0.15, 0), 'e');
const lblWalk = addLabel(() => {
  const ph = walkT;
  if (ph < 0.2) return L('等待 ATP:后脚松开微管,准备迈步', 'waiting for ATP: the rear foot lets go, ready to swing');
  if (ph < 0.5) return L('ATP 结合 → 颈部链摆动:把后腿甩过前腿', 'ATP binds → the neck linker swings, slinging the rear leg forward');
  if (ph < 0.8) return L('前脚落位(+方向一格),ADP 释放,抓紧轨道', 'the leg lands one site toward the plus end, ADP released, grip locked');
  return L('恢复站立:两脚等距,水解释放能量维持紧张', 'standing tall: legs split, hydrolysis keeps the tension');
}, new THREE.Vector3(0, 2.9, 0), 'st');
const lblCargo = addLabel(() => L('货物囊泡:膜蛋白「地址签」被驱动蛋白识别', 'cargo vesicle: membrane address tags recognized by kinesin'),
  cargo.position.clone().add(new THREE.Vector3(0, 0.55, 0)), 'g', kinesin);

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '公路与卡车', be: 'Highway and truck',
    d: '微管是细胞骨架中的公路网,驱动蛋白是用 ATP 的卡车:从细胞中心向外的单行道(+ 端),运神经递质前体、线粒体……',
    de: 'Microtubules are the skeleton\'s highways; kinesin is the ATP-burning truck, one-way outward (+ end), hauling neurotransmitter precursors, mitochondria…',
    act: () => {} },
  { b: '一步一袋 ATP', be: 'One ATP per step',
    d: 'ATP 结合到后脚 → 颈部链接区「锁定」产生摆动力 → 后脚以 16nm 弧线甩过前脚。脚移 16nm,重心只前进 8nm——完美踩在下一格。',
    de: 'ATP binds the rear foot → the neck linker docks and swings → the rear foot slings 16 nm past. The foot moves 16 nm but the body advances 8 — landing exactly on the next site.',
    act: () => { supply = 1; document.getElementById('sup').value = 100; } },
  { b: '永不脱轨', be: 'Never lets go',
    d: '两条腿总有一只抓着轨道(握手-放手交替)——细胞浆是狂风暴雨的分子世界,双手轮流握才不迷路。',
    de: 'At least one foot always grips (hand-over-hand) — the cytoplasm is a molecular storm; alternating grip is how it never gets lost.',
    act: () => {} },
  { b: '百步穿 nanometer', be: '100 steps a second, 8 nm each',
    d: '最快 ~100 步/秒 ≈ 0.8 µm/s;一个细胞宽 20 µm,横穿要 25 秒——神经元里从胞体到末梢 1 米长,走完要按天计!',
    de: 'Up to ~100 steps/s ≈ 0.8 µm/s; a 20 µm cell takes 25 s to cross — but a 1-meter axon takes days! That is why nerves need fast axonal transport.',
    act: () => { supply = 0.3; document.getElementById('sup').value = 30; } },
  { b: '分子马达三部曲', be: 'The motor trilogy',
    d: 'ATP 合酶旋转、肌球蛋白划桨、驱动蛋白步行——三种把 ATP 化学能变成机械功的方案,生命把「用电」玩成了艺术。',
    de: 'ATP synthase rotates, myosin rows, kinesin walks — three ways to turn ATP chemistry into mechanical work. Life plays energy like an art form.',
    act: () => {} },
];
function stepIndex() {
  if (slowmo) return 1;
  if (steps > 12) return 3;
  if (steps > 2) return 2;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 步态 ================= */
function poseWalk(t) {
  /* t:0..1 一步相位。lead 脚在前(+0.42),trail 在后;在 t=0.5 交换 */
  const swT = ss(0.15, 0.55, t);           // 甩腿窗口
  const leadX = 0.42, trailX = -0.42;
  /* 两脚 x 相对 kinesin 根部 */
  const frontLeg = leadIsA ? legA : legB;
  const backLeg = leadIsA ? legB : legA;
  const bodyX = steps * 0.42;
  /* 身体位置:随步相位平滑前进半格 */
  kinesin.position.x = bodyX - 0.42 + ss(0, 1, t) * 0.42;
  /* 前脚固定 */
  placeLeg(frontLeg, leadX, 0, 0);
  /* 后脚:0.15-0.55 抬起甩到 +0.42 前方 */
  if (t < 0.15) placeLeg(backLeg, trailX, 0, 0);
  else if (t < 0.55) {
    const k = ss(0.15, 0.55, t);
    const x = lerp(trailX, leadX + 0.84, k);
    const lift = Math.sin(k * Math.PI) * 0.5;
    placeLeg(backLeg, x, lift, Math.sin(k * Math.PI) * 0.7);
  } else {
    /* 交换 lead */
    if (!swappedThisStep) { leadIsA = !leadIsA; swappedThisStep = true; steps++; atpSpent++; lastStepT = tSim; }
    placeLeg(leadIsA ? legA : legB, -leadX + 0.84, 0, 0);
    placeLeg(leadIsA ? legB : legA, leadX, 0, 0);
  }
}
let swappedThisStep = false;
function placeLeg(leg, x, lift, rot) {
  leg.g.position.set(lerp(leg.g.position.x, x, 0.5), Y, 0);
  leg.g.rotation.z = rot;
  leg.foot.position.y = -0.72 - lift;
  leg.foot.material.emissiveIntensity = lift > 0.05 ? 0.8 : 0.3;
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const btnSlow = document.getElementById('btnSlow');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnSlow.addEventListener('click', () => {
  slowmo = !slowmo;
  btnSlow.classList.toggle('on', slowmo);
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
document.getElementById('sup').addEventListener('input', e => {
  supply = parseInt(e.target.value) / 100;
  document.getElementById('supVal').textContent = e.target.value + '%';
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let atpCD = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0) * (slowmo ? 0.22 : 1);
  tSim += dts;

  /* 步进 */
  const period = STEP_PERIOD / clamp(supply, 0.15, 1);
  const prev = walkT;
  if (playing) walkT += dts / period;
  if (walkT >= 1) { walkT = walkT % 1; swappedThisStep = false; }
  /* ATP 补给:每步消耗一袋 */
  atpCD -= dts;
  if (atpCD <= 0 && walkT < 0.2 && prev >= 0.2) {
    atpCD = period * 1.2;
  }
  if (playing && Math.floor(walkT / 0.16) !== Math.floor(prev / 0.16) && walkT < 0.3) {
    flyATP(new THREE.Vector3(legA.g.position.x, Y - 0.4, 0));
  }
  poseWalk(walkT);
  /* 货物漂浮 */
  cargo.position.y = Y + 1.18 + Math.sin(tSim * 2.2) * 0.03;
  cargo.rotation.y += dts * 0.3;

  /* ATP 飞行 */
  for (let i = atps.length - 1; i >= 0; i--) {
    const a = atps[i];
    a.t += dts * 1.5;
    a.mesh.position.lerp(a.to, ss(0, 1, a.t));
    if (a.t >= 1) { scene.remove(a.mesh); atps.splice(i, 1); }
  }
  /* 镜头跟随(轻推) */
  const targetX = kinesin.position.x;
  controls.target.x = lerp(controls.target.x, targetX, clamp(dt * 1.2, 0, 1));
  camera.position.x = lerp(camera.position.x, targetX + 0.6, clamp(dt * 1.2, 0, 1));

  spdEMA = lerp(spdEMA, steps - steps === 0 ? 0 : 0, 0);   // 占位
  const spd = (tSim - 0 > 0 && steps > 0) ? steps * 0.42 / Math.max(tSim - 0, 1) : 0;
  document.getElementById('stSteps').textContent = steps;
  document.getElementById('stATP').textContent = atpSpent;
  document.getElementById('stSpd').innerHTML = (spd * 10).toFixed(2) + '<small> nm/s×10³(演示)</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
