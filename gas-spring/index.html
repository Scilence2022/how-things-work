<style>
  :root,:root[data-theme="dark"]{

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);

  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}

  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<div id="title">
  <h1 data-zh="气弹簧与阻尼铰链 · 撑得住，也收得住" data-en="Gas Spring &amp; Damped Hinge · Hold It, Close It Gently">气弹簧与阻尼铰链 · 撑得住，也收得住</h1>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 气弹簧门模型（量级取自真实气弹簧/阻尼铰链）
   - 门：m=14 kg，质心 Lc=0.575 m，转动惯量 I=mL²/3=6.17 kg·m²。
     重力矩 τg = -m·g·Lc·cosθ（闭合位附近最大 → 这正是必须加阻尼的原因）。
   - 气弹簧：密封氮气等温 pV≈常数：F = p₀·A·Lg/(Lg-x)·(T/293)，
     活塞面积 A=1.13e-4 m²(Ø12)，气柱 Lg=0.34 m，行程 x=ℓmax-ℓ。
     力臂 = a·b·sinψ/ℓ（a、b 为铰链到两端支点的距离，ψ 为两支点对铰链的张角）。
   - 阻尼：末端 15° 油液挤孔，c = C·(1.5/d)²·(293/T)（小孔阻尼∝1/d²，油随温度变稀）。
   - 撞底：反弹系数 e=0.38；|ω|<0.55 rad/s 时落锁。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const D2R=Math.PI/180,R2D=180/Math.PI;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(2.7,1.35,5.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.75,0.8,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=25;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.7));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(3,6,5);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.35);fill.position.set(-4,3,-4);scene.add(fill);

/* ---- 材质 ---- */
const mDoor=new THREE.MeshStandardMaterial({color:0x4a7fa5,roughness:0.35,metalness:0.6});
const mDoor2=new THREE.MeshStandardMaterial({color:0x3f9f78,roughness:0.35,metalness:0.6});
const mFrame=new THREE.MeshStandardMaterial({color:0x2e3a47,roughness:0.6,metalness:0.5});
const mCylin=new THREE.MeshStandardMaterial({color:0x8a5a2a,roughness:0.35,metalness:0.65});
const mRod=new THREE.MeshStandardMaterial({color:0xc8ccd2,roughness:0.25,metalness:0.85});
const mGround=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const mFlash=new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0});
const mPush=new THREE.MeshStandardMaterial({color:0xc44b2a,roughness:0.5,metalness:0.4});

/* ---- 物理常数 ---- */
const MG=14*9.8*0.575, IT=14*1.15*1.15/3, AP=1.13e-4, LG=0.34;
const A0=new THREE.Vector2(0.16,-0.10), BLEN=0.30, BB=12*D2R;
const THMAX=100*D2R, LMAX=(()=>{const b=new THREE.Vector2(BLEN*Math.cos(THMAX+BB),BLEN*Math.sin(THMAX+BB));return b.distanceTo(A0);})();
const E_REST=0.38, LATCH=0.55, DAMP0=200, DAMP_TH=15*D2R;
let p0=0.6e6, dOr=1.5, Tair=293, speedK=1;

/* 铰链力矩：返回 {ts, arm, F, p} */
function strut(th){
  const B=new THREE.Vector2(BLEN*Math.cos(th+BB),BLEN*Math.sin(th+BB));
  const AB=B.clone().sub(A0), l=AB.length();
  const angA=Math.atan2(A0.y,A0.x), angB=Math.atan2(B.y,B.x);
  let psi=angB-angA; if(psi<0)psi+=Math.PI*2;
  const arm=A0.length()*BLEN*Math.sin(psi)/l;
  const x=Math.max(0,LMAX-l);
  const pAbs=(p0+1.01e5)*LG/(LG-x)*(Tair/293);  // 密封气绝压：pV≈常数、p∝T
  const F=(pAbs-1.01e5)*AP;                     // 有效推力（对大气作差）
  return {ts:F*arm,arm,F,p:pAbs,x};
}
function dampC(){return DAMP0*Math.pow(1.5/dOr,2)*(293/Tair);}

/* ---- 场景搭建：两扇门 ---- */
function makeDoor(z,mat){
  const g=new THREE.Group();g.position.set(0,0,z);
  const door=new THREE.Mesh(new THREE.BoxGeometry(1.15,0.5,0.06),mat);
  door.position.set(0.575,0,0);g.add(door);
  const post=new THREE.Mesh(new THREE.BoxGeometry(0.09,1.75,0.12),mFrame);
  post.position.set(-0.05,0.86,0);scene.add(post.clone());
  scene.add(g);
  const cylin=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,1,10),mCylin);
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1,8),mRod);
  scene.add(cylin,rod);
  const flash=new THREE.Mesh(new THREE.RingGeometry(0.1,0.16,20),mFlash.clone());
  scene.add(flash);
  return {g,cylin,rod,flash,th:95*D2R,w:0,latched:false,bounces:0,flashT:0,curve:[],impacts:[],softT:0,softRun:false,t:0};
}
const dL=makeDoor(-0.95,mDoor), dR=makeDoor(0.95,mDoor2);
const pusher=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.06,0.24),mPush);
pusher.visible=false;scene.add(pusher);
const ground=new THREE.Mesh(new THREE.BoxGeometry(5,0.1,4),mGround);
ground.position.set(1.4,-0.31,0);scene.add(ground);
/* 合页与止点 */
[-0.95,0.95].forEach(z=>{
  const stop=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.1),mFrame);
  stop.position.set(1.18,-0.22,z);scene.add(stop);
});

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn,parent){
  const div=document.createElement('div');div.className='lbl '+(cls||'');
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||scene).add(o);
  labelReg.push({o,text:textFn,vis:visFn||(()=>true)});div.textContent=textFn();return o;
}
addLabel(()=>L('无阻尼弹簧：只有气压弹性','Undamped: gas elasticity only'),new THREE.Vector3(0.6,1.85,-0.95),'r');
addLabel(()=>L('阻尼铰链：末端油液挤孔','Damped hinge: oil squeezed through orifice'),new THREE.Vector3(0.6,1.85,0.95),'g');
addLabel(()=>L('气弹簧 F = p·A，压得越短推得越狠','Gas spring F = p·A, stronger when compressed'),new THREE.Vector3(0.3,0.35,-0.95),'o');
addLabel(()=>L('「砰！」','SLAM!'),new THREE.Vector3(1.3,0.25,-0.95),'r',()=>dL.flashT>0);
addLabel(()=>L('优雅缓降…','soft close…'),new THREE.Vector3(1.0,0.3,0.95),'g',()=>dR.th<DAMP_TH&&!dR.latched&&dR.w<0);

/* ---- 状态 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let simT=0,pushT=-1,slowK=1;
const STEPS=[
 {zh:'密封缸里的氮气：F = p·A，等温 pV≈常数 —— 压得越短推力越大（看压力读数）',en:'Sealed nitrogen: F = p·A with pV ≈ const — shorter stroke, stronger push (watch pressure)'},
 {zh:'力臂几何：气弹簧撑得住开门（90° 附近力矩>0），却拦不住关门的重力',en:'Geometry: the strut holds the door open but cannot resist gravity on the way down'},
 {zh:'自由段：只有气压弹性，重力把门越加越快 —— 能量全部来自势能',en:'Free zone: gas elasticity only; gravity accelerates the door all the way'},
 {zh:'末端 15°：油液挤过阻尼孔，阻尼∝速度、∝1/d² —— 「砰」变「缓缓」',en:'Last 15°: oil forced through orifice, damping ∝ speed and ∝ 1/d² — slam becomes soft'},
 {zh:'对照：无阻尼门撞底反弹（被压缩的氮气把门弹回来），阻尼门一次落锁',en:'Contrast: undamped door bounces on compressed gas; damped door latches in one go'},
 {zh:'温度升高 → 压力增大（p∝T）且油变稀：夏天更弹、冬天更沉',en:'Higher T → higher pressure (p∝T) and thinner oil: livelier in summer, heavier in winter'},
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
  mGround.color.setHex(THEME==='dark'?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();setPlayLabel();
}
function setPlayLabel(){
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
}

/* ---- 物理步进 ---- */
function stepDoor(d,c,dt){
  if(d.latched)return;
  d.t+=dt;
  const ts=strut(d.th);
  const cg=-MG*Math.cos(d.th);
  const cd=(d.th<DAMP_TH)?-c*d.w:0;
  const dw=(cg+ts.ts+cd)/IT;
  d.w+=dw*dt;
  const th0=d.th;
  d.th+=d.w*dt;
  /* 上止点 */
  if(d.th>THMAX){d.th=THMAX;d.w=Math.min(0,d.w)*-0.25;}
  /* 撞底与落锁 */
  if(d.th<=0){
    d.th=0;
    if(d.w<0){
      const imp=-d.w;
      d.impacts.push({t:d.t,w:imp});
      d.flashT=0.5;d.flash.position.set(1.15,0.02,d===dL?-0.95:0.95);
      d.flash.scale.setScalar(1);
      if(c>0)d.softRun=false;
      if(imp<LATCH||d.bounces>=3){d.latched=true;d.w=0;}
      else{d.w=imp*E_REST;d.bounces++;}
    }
  }
  /* 缓降段计时 */
  if(c>0){
    if(th0>DAMP_TH&&d.th<=DAMP_TH)d.softRun=true;
    if(d.softRun&&!d.latched&&d.th>0)d.softT+=dt;
  }
  d.curve.push([d.t,d.th*R2D]);
  if(d.curve.length>1400)d.curve.shift();
}

/* ---- 开门动画（把门压过平衡点再松手）---- */
function startClose(){
  [dL,dR].forEach(d=>{
    d.th=95*D2R;d.w=0;d.latched=false;d.bounces=0;d.curve=[];d.impacts=[];d.softT=0;d.softRun=false;d.t=0;
  });
  pushT=0;playing=true;setPlayLabel();
}
/* 初始化预演：无头跑一遍完整开-合循环，先把两条 θ(t) 曲线、
   撞击记录与缓降用时填进缓冲，再开始首绘（同 scotch-yoke 预填思路） */
function prefillCurves(){
  [dL,dR].forEach(d=>{
    d.th=95*D2R;d.w=0;d.latched=false;d.bounces=0;
    d.curve=[];d.impacts=[];d.softT=0;d.softRun=false;d.t=0;
  });
  for(let i=0;i<=40;i++){                       // 推杆段：95°→70°（不记录曲线）
    const f=i/40,e=f*f*(3-2*f);
    [dL,dR].forEach(d=>{d.th=95*D2R-25*D2R*e;d.w=-0.63;});
  }
  const c=dampC();let t=0;
  while(t<6&&(!dL.latched||!dR.latched)){       // 动力学段直至双门落锁
    stepDoor(dL,0,0.008);stepDoor(dR,c,0.008);t+=0.008;
  }
  [dL,dR].forEach(d=>{d.flashT=0;d.flash.material.opacity=0;});  // 清掉预演末尾的撞击闪光
}

/* ---- 示波器 ---- */
const plotCv=document.getElementById('plotCv');
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const t2=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const TWIN=4.5,YMAX=100;
  const xOf=t=>t/TWIN*W, yOf=a=>H-10-(a/YMAX)*(H-30);
  ctx.strokeStyle='rgba(128,150,170,.25)';
  for(const a of [0,25,50,75,100]){
    ctx.beginPath();ctx.moveTo(0,yOf(a));ctx.lineTo(W,yOf(a));ctx.stroke();
    ctx.fillStyle=t2;ctx.font='13px system-ui';ctx.fillText(a+'°',4,yOf(a)-3);
  }
  const draw=(d,col)=>{
    if(d.curve.length<2)return;
    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();
    d.curve.forEach((p,i)=>{const x=xOf(p[0]),y=yOf(p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.stroke();
    const last=d.curve[d.curve.length-1];
    if(!d.latched){ctx.fillStyle=col;ctx.beginPath();ctx.arc(xOf(last[0]),yOf(last[1]),5,0,7);ctx.fill();}
    ctx.fillStyle=col;ctx.font='13px system-ui';
    d.impacts.forEach(m=>{ctx.fillText('×',xOf(m.t)-4,yOf(0)-4);});
  };
  draw(dL,'#ff6b6b');draw(dR,'#74d69c');
  ctx.lineWidth=1;
}

/* ---- 统计 ---- */
let statAcc=0;
function updateStats(){
  document.getElementById('stImp').innerHTML=dL.impacts.length?
    dL.impacts[0].w.toFixed(2)+'<small> rad/s</small>':'—';
  document.getElementById('stW').innerHTML=Math.abs(dR.w).toFixed(2)+'<small> rad/s</small>';
  document.getElementById('stP').innerHTML=(strut(dR.th).p/1e6).toFixed(2)+'<small> MPa</small>';
  document.getElementById('stSoft').innerHTML=dR.softT>0?dR.softT.toFixed(2)+'<small> s</small>':'—';
}

/* ---- 几何更新 ---- */
function updateDoorVisual(d){
  d.g.rotation.z=d.th;
  const B=new THREE.Vector2(BLEN*Math.cos(d.th+BB),BLEN*Math.sin(d.th+BB));
  const dir=B.clone().sub(A0),l=dir.length();dir.normalize();
  const lo=0.62*l,li=0.46*l;
  d.cylin.scale.y=lo;
  d.cylin.position.set(A0.x+dir.x*lo/2,A0.y+dir.y*lo/2,0);
  d.cylin.rotation.z=Math.atan2(dir.y,dir.x)-Math.PI/2;
  d.rod.scale.y=li;
  d.rod.position.set(B.x-dir.x*li/2,B.y-dir.y*li/2,0);
  d.rod.rotation.z=d.cylin.rotation.z;
  if(d.flashT>0){
    d.flashT-=1/60;
    d.flash.material.opacity=Math.max(0,d.flashT)*1.6;
    d.flash.scale.setScalar(1+(0.5-Math.max(0,d.flashT))*6);
  }else d.flash.material.opacity=0;
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05)*speedK*(slowK===0.25?0.25:1);
  simT+=dt;
  if(playing){
    if(pushT>=0&&pushT<0.7){          // 推杆把门压到 70° 再松手
      pushT+=dt;
      const f=clamp(pushT/0.7,0,1),e=f*f*(3-2*f);
      [dL,dR].forEach(d=>{
        const thNew=95*D2R-25*D2R*e;
        d.w=(thNew-d.th)/Math.max(dt,1e-4);
        d.th=thNew;
      });
      const m=dL;
      pusher.visible=true;
      pusher.position.set(0.9*Math.cos(m.th),0.9*Math.sin(m.th)+0.09,(m.g.position.z+dR.g.position.z)/2);
      if(pushT>=0.7){pusher.visible=false;activeStep=2;syncSteps();}
    }else{
      const c=dampC();
      const sub=2,h=dt/sub;
      for(let i=0;i<sub;i++){stepDoor(dL,0,h);stepDoor(dR,c,h);}
    }
  }
  updateDoorVisual(dL);updateDoorVisual(dR);
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  drawPlot();
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 事件 ---- */
document.getElementById('btnGo').addEventListener('click',startClose);
document.getElementById('btnSlow').addEventListener('click',e=>{
  slowK=slowK===1?0.25:1;
  e.currentTarget.classList.toggle('on',slowK!==1);
});
document.getElementById('sP').addEventListener('input',e=>{
  p0=+e.target.value*1e6;
  document.getElementById('sPVal').textContent=(+e.target.value).toFixed(2)+' MPa';
});
document.getElementById('sD').addEventListener('input',e=>{
  dOr=+e.target.value;
  document.getElementById('sDVal').textContent=dOr.toFixed(2)+' mm';
});
document.getElementById('sT').addEventListener('input',e=>{
  Tair=+e.target.value;
  document.getElementById('sTVal').textContent=Tair+' K';
});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(2)+'×';
});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
if(qs.get('speed')){
  speedK=clamp(+qs.get('speed')||1,0.25,1.5);
  document.getElementById('sSpd').value=speedK*100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(2)+'×';
}
document.getElementById('tglLabels').checked=labelsOn;

applyTheme();applyLang();prefillCurves();updateStats();start();
</script>
