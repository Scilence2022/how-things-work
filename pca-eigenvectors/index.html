<style>

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}

  <div class="sub" data-zh="想「压缩」一云散点,先找方差最大的方向——它恰好是协方差矩阵的特征向量;幂迭代 v←Cv/|Cv| 让箭头自己旋到位,PC2 垂直补位;砍掉 PC2 二维压一维,丢掉的只是最扁的方向 · 拖相关度滑块看椭圆转起来,点「投影重建」看丢了多少信息 · 拖动旋转 / 空格运行/暂停" data-en="To compress a scatter cloud, first find the direction of maximum variance — it is exactly an eigenvector of the covariance matrix; power iteration v←Cv/|Cv| swings the arrow into place, PC2 fills in orthogonally; drop PC2 and 2-D collapses to 1-D, losing only the flattest direction · drag the correlation slider, then project &amp; rebuild to see what is lost · drag to orbit / Space = run/pause">想「压缩」一云散点,先找方差最大的方向——它恰好是协方差矩阵的特征向量;幂迭代 v←Cv/|Cv| 让箭头自己旋到位,PC2 垂直补位;砍掉 PC2 二维压一维,丢掉的只是最扁的方向 · 拖相关度滑块看椭圆转起来,点「投影重建」看丢了多少信息 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const R2D=180/Math.PI;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let simT=0,notifyT=0,notifyZ='',notifyE='';

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,60);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(4.8,7.4,9.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,-0.3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,9,6);scene.add(key);

/* ---- 材质 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const dotM=new THREE.MeshStandardMaterial({color:0x9fc5e8,roughness:0.4,emissive:0x1b3a55,emissiveIntensity:0.5});
const pc1M=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xffa000,emissiveIntensity:0.8,roughness:0.3});
const pc2M=new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1864ab,emissiveIntensity:0.7,roughness:0.3});
const resM=new THREE.LineBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.85});
const ellM=new THREE.LineBasicMaterial({color:0xffd43b,transparent:true,opacity:0.8});
const projLineM=new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.35});

/* ================= 数据与统计 ================= */
const NP=140;
let z1=[],z2=[];
function resampleNoise(){          // 固定一批标准正态噪声(新数据按钮重抽)
  z1=[];z2=[];
  for(let i=0;i<NP;i++){
    const u=Math.random()||1e-12,v=Math.random();
    const r=Math.sqrt(-2*Math.log(u));
    const a=2*Math.PI*v;
    z1.push(r*Math.cos(a));z2.push(r*Math.sin(a));
  }
}
let rho=0.75;
const dx=new Float64Array(NP),dy=new Float64Array(NP);
let Cxx=1,Cyy=1,Cxy=0,mx=0,my=0;
function regen(){
  for(let i=0;i<NP;i++){
    dx[i]=2.2*z1[i];
    dy[i]=rho*dx[i]+Math.sqrt(Math.max(0,1-rho*rho))*1.1*z2[i];
  }
  mx=0;my=0;
  for(let i=0;i<NP;i++){mx+=dx[i];my+=dy[i];}
  mx/=NP;my/=NP;
  Cxx=0;Cyy=0;Cxy=0;
  for(let i=0;i<NP;i++){
    const ax=dx[i]-mx,ay=dy[i]-my;
    Cxx+=ax*ax;Cyy+=ay*ay;Cxy+=ax*ay;
  }
  const f=1/(NP-1);
  Cxx*=f;Cyy*=f;Cxy*=f;
  updateAll3D();
}
/* 幂迭代状态 */
let vx=0.8,vy=0.6,iters=0,dispAng=0,autoIter=false,autoT=0;
let lam1=1,lam2=1,pc1x=1,pc1y=0,pc2x=0,pc2y=1;
function trueAngle(){return 0.5*Math.atan2(2*Cxy,Cxx-Cyy);}   // 解析主轴角(对照)
function powerStep(){
  const wx=Cxx*vx+Cxy*vy,wy=Cxy*vx+Cyy*vy;
  const n=Math.hypot(wx,wy)||1e-12;
  let nx=wx/n,ny=wy/n;
  if(nx*vx+ny*vy<0){nx=-nx;ny=-ny;}     // 保持方向连续,避免翻转
  vx=nx;vy=ny;iters++;
  pc1x=vx;pc1y=vy;pc2x=-vy;pc2y=vx;     // 二维对称矩阵:PC2 恰是垂直方向
  lam1=pc1x*(Cxx*pc1x+Cxy*pc1y)+pc1y*(Cxy*pc1x+Cyy*pc1y);
  lam2=pc2x*(Cxx*pc2x+Cxy*pc2y)+pc2y*(Cxy*pc2x+Cyy*pc2y);
  const err=Math.abs(((angOf(vx,vy)-trueAngle()+Math.PI)%(Math.PI))-Math.PI/2);
  updateAll3D();updateFormula();
  return err;
}
const angOf=(x,y)=>Math.atan2(y,x);
const ease=t=>t*t*(3-2*t);

/* ================= 场景 ================= */
const ground=new THREE.Mesh(new THREE.BoxGeometry(30,0.3,30),groundM);
ground.position.y=-0.4;scene.add(ground);
const gridH=new THREE.GridHelper(13,13,0x4a5462,0x333b46);
gridH.material.transparent=true;gridH.material.opacity=0.4;gridH.position.y=0.001;scene.add(gridH);
/* 散点:140 个实例全部使用 */
const dots=new THREE.InstancedMesh(new THREE.SphereGeometry(0.07,10,8),dotM,NP);
scene.add(dots);
const m4=new THREE.Matrix4(),q0=new THREE.Quaternion(),v1c=new THREE.Vector3(1,1,1);
/* 残差线段:原点→投影点 */
const resGeo=new THREE.BufferGeometry();
const resPos=new Float32Array(NP*2*3);
resGeo.setAttribute('position',new THREE.BufferAttribute(resPos,3));
const resLines=new THREE.LineSegments(resGeo,resM);
resLines.visible=false;scene.add(resLines);
/* 1σ 椭圆(协方差的特征椭圆) */
const ellGeo=new THREE.BufferGeometry();
const ellipse=new THREE.LineLoop(ellGeo,ellM);scene.add(ellipse);
/* PC1 投影直线(过质心) */
const projGeo=new THREE.BufferGeometry();
const projLine=new THREE.Line(projGeo,projLineM);scene.add(projLine);
/* 主成分箭头 */
function makeArrow(mat){
  const g=new THREE.Group();
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,1,10),mat);
  cyl.rotation.z=-Math.PI/2;g.add(cyl);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.24,12),mat);
  cone.rotation.z=-Math.PI/2;g.add(cone);
  g.userData.cyl=cyl;g.userData.cone=cone;
  scene.add(g);return g;
}
const arrow1=makeArrow(pc1M),arrow2=makeArrow(pc2M);
function setArrow(g,dxv,dyv,len,y0){
  g.rotation.y=-Math.atan2(dyv,dxv);
  g.position.set(mx,y0,my);
  g.userData.cyl.scale.y=len;g.userData.cyl.position.x=len/2;   /* 圆柱经 -90° z 旋转后长度轴在本地 y,scale.x 会把「粗细」拉成长条方块 */
  g.userData.cone.position.x=len;
}
/* 质心标记 */
const centroid=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),
  new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x888888,emissiveIntensity:0.4}));
scene.add(centroid);

/* ---- 投影重建动画 ---- */
let projPhase='idle',projT=0,holdT=0;   // idle|collapse|hold|restore
function writeDots(){
  const cx=pc1x,cy=pc1y;
  for(let i=0;i<NP;i++){
    const ox=dx[i],oy=dy[i];
    const t=(ox-mx)*cx+(oy-my)*cy;      // 到 PC1 的投影系数
    const pxq=mx+t*cx,pyq=my+t*cy;
    const x=ox+(pxq-ox)*ease(projT),z=oy+(pyq-oy)*ease(projT);
    m4.compose(v1c.set(x,0.07,z),q0,v1c);
    dots.setMatrixAt(i,m4);
    resPos[i*6]=pxq;resPos[i*6+1]=0.07;resPos[i*6+2]=pyq;
    resPos[i*6+3]=ox;resPos[i*6+4]=0.07;resPos[i*6+5]=oy;
  }
  dots.instanceMatrix.needsUpdate=true;
  resGeo.attributes.position.needsUpdate=true;
}
function updateAll3D(){
  const s1=Math.sqrt(Math.max(lam1,0.0001)),s2=Math.sqrt(Math.max(lam2,0.0001));
  setArrow(arrow1,pc1x,pc1y,1.1+1.9*s1/(s1+s2)*2,0.12);
  setArrow(arrow2,pc2x,pc2y,0.5+1.5*s2/(s1+s2)*2,0.12);
  /* 椭圆:c + √λ₁cosθ·u₁ + √λ₂sinθ·u₂ */
  const pts=[];
  for(let i=0;i<=72;i++){
    const t=i/72*Math.PI*2,c=Math.cos(t),s=Math.sin(t);
    pts.push(new THREE.Vector3(
      mx+s1*c*pc1x+s2*s*pc2x,0.12,my+s1*c*pc1y+s2*s*pc2y));
  }
  ellGeo.setFromPoints(pts);
  /* PC1 直线 */
  const R=7;
  projGeo.setFromPoints([
    new THREE.Vector3(mx-R*pc1x,0.06,my-R*pc1y),
    new THREE.Vector3(mx+R*pc1x,0.06,my+R*pc1y)]);
  centroid.position.set(mx,0.12,my);
  writeDots();
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,p,cls='',visFn=()=>true,parentObj=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(p);parentObj.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>`PC1 · ${lam1.toFixed(2)} (${(100*lam1/(lam1+lam2)).toFixed(0)}%)`,new THREE.Vector3(0,0.75,0),'o',()=>true,arrow1);
addLabel(()=>`PC2 · ${lam2.toFixed(2)} (${(100*lam2/(lam1+lam2)).toFixed(0)}%)`,new THREE.Vector3(0,0.75,0),'b',()=>projPhase!=='hold',arrow2);
addLabel(()=>L('残差 = 被丢掉的信息(垂直于 PC1)','residual = the information you dropped'),new THREE.Vector3(0,1.6,0),'r',()=>projPhase!=='idle');
const lblNotify=addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',new THREE.Vector3(0,3.0,0),'g');

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'数据的形状:散点云沿某方向被拉长,方差最大的方向藏着最多信息',en:'Shape of data: the cloud stretches one way — max variance hides the most info'},
  {zh:'协方差矩阵 C:一个 2×2 矩阵完整描述椭圆的取向与胖瘦',en:'Covariance C: one 2×2 matrix fully describes the ellipse'},
  {zh:'特征向量=主轴:Cv=λv,特征值 λ = 该方向的方差',en:'Eigenvectors = axes: Cv=λv, eigenvalue = variance along it'},
  {zh:'幂迭代:v←Cv/|Cv| 反复相乘,箭头自己旋向最大特征值方向',en:'Power iteration: multiply by C repeatedly — the arrow swings itself into place'},
  {zh:'降维:把点投影到 PC1,二维压成一维,保留最大的那条轴',en:'Dimensionality reduction: project onto PC1, 2-D becomes 1-D'},
  {zh:'重建与残差:沿 PC1 还原,红线是丢失的信息 = PC2 上的分量',en:'Rebuild: red residuals are exactly what was lost — the PC2 component'},
  {zh:'数据长出的基:ρ=0 时圆对称,没有主导方向;傅里叶用的是固定基',en:'A basis grown from data: at ρ=0 no direction dominates; Fourier uses a fixed basis'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();stepAct(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function stepAct(i){
  if(i===0){rho=0.75;regen();resetIter();notify('椭圆斜放:长轴就是方差最大的方向','the ellipse is tilted: its long axis is the max-variance direction',3.2);}
  if(i===1){notify(`C = [[${Cxx.toFixed(2)}, ${Cxy.toFixed(2)}], [${Cxy.toFixed(2)}, ${Cyy.toFixed(2)}]] — 对角=方差,副对角=协方差`,`C = [[${Cxx.toFixed(2)}, ${Cxy.toFixed(2)}], [${Cxy.toFixed(2)}, ${Cyy.toFixed(2)}]] — diagonal = variance, off = covariance`,4.5);}
  if(i===2){resetIter();for(let k=0;k<6;k++)powerStep();notify('Cv=λv:特征向量方向乘 C 只变长短不改方向','Cv=λv: along an eigenvector, C only rescales',3.6);}
  if(i===3){resetIter();autoIter=true;btnAuto.classList.add('on');notify('随机箭头被 C 反复拉向主轴','a random arrow, repeatedly pulled onto the principal axis',3.2);}
  if(i===4){startProj();notify('投影到 PC1:一条直线装下了大部分故事','projected onto PC1: one line carries most of the story',3.2);}
  if(i===5){startProj();notify(`信息损失 = λ₂/(λ₁+λ₂) = ${(100*lam2/(lam1+lam2)).toFixed(1)} %`,`information lost = λ₂/(λ₁+λ₂) = ${(100*lam2/(lam1+lam2)).toFixed(1)} %`,3.6);}
  if(i===6){document.getElementById('sRho').value=0;rho=0;regen();resetIter();
    notify('ρ=0:圆对称,两个方向一样重要——PCA 无话可说','ρ=0: isotropic — no direction dominates, PCA has nothing to say',3.6);}
}
function notify(z,e,t=3.0){notifyT=t;notifyZ=z;notifyE=e;}
function resetIter(){
  const a=Math.random()*Math.PI*2;
  vx=Math.cos(a);vy=Math.sin(a);iters=0;
  pc1x=vx;pc1y=vy;pc2x=-vy;pc2y=vx;
  lam1=pc1x*(Cxx*pc1x+Cxy*pc1y)+pc1y*(Cxy*pc1x+Cyy*pc1y);
  lam2=pc2x*(Cxx*pc2x+Cxy*pc2y)+pc2y*(Cxy*pc2x+Cyy*pc2y);
  autoIter=false;btnAuto.classList.remove('on');
  updateAll3D();updateFormula();
}
function startProj(){
  if(projPhase!=='idle')return;
  projPhase='collapse';projT=0;
}

/* ---- 绘图:方差解释比条形图 ---- */
const plotCv=document.getElementById('plotCv');
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const cTxt=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const acc=css.getPropertyValue('--acc').trim()||'#ffa94d';
  const base=H-30,top=16;
  const p1=100*lam1/(lam1+lam2),p2=100-p1;
  const bw=90,x1=(W-2*bw-60)/2,x2=x1+bw+60;
  ctx.font='13px system-ui';
  ctx.fillStyle=cTxt;ctx.strokeStyle='rgba(128,150,170,.3)';
  ctx.beginPath();ctx.moveTo(24,base);ctx.lineTo(W-24,base);ctx.stroke();
  ctx.fillStyle=acc;ctx.fillRect(x1,base-(base-top)*p1/100,bw,(base-top)*p1/100);
  ctx.fillStyle='rgba(116,192,252,.8)';ctx.fillRect(x2,base-(base-top)*p2/100,bw,(base-top)*p2/100);
  ctx.fillStyle=cTxt;
  ctx.fillText(`PC1 ${p1.toFixed(1)}%`,x1+6,base-(base-top)*p1/100-8);
  ctx.fillText(`PC2 ${p2.toFixed(1)}%`,x2+6,base-(base-top)*p2/100-8);
  ctx.fillText(`λ₁=${lam1.toFixed(2)}`,x1+6,base+18);
  ctx.fillText(`λ₂=${lam2.toFixed(2)}`,x2+6,base+18);
}

/* ---- 公式 ---- */
function updateFormula(){
  document.getElementById('formula').innerHTML=L(
    `<b>样本协方差</b> C = [[${Cxx.toFixed(2)}, ${Cxy.toFixed(2)}], [${Cxy.toFixed(2)}, ${Cyy.toFixed(2)}]](N=${NP})<br>`+
    `<b>幂迭代</b>:v←Cv/|Cv|,每次迭代误差 ×|λ₂/λ₁|,几何收敛<br>`+
    `<b>特征值=方差</b>:λ₁=${lam1.toFixed(2)},λ₂=${lam2.toFixed(2)},和=trace=${(Cxx+Cyy).toFixed(2)}<br>`+
    `<b>降维损失</b>:砍掉 PC2 只丢 ${(100*lam2/(lam1+lam2)).toFixed(1)}% 的方差;解析主轴角 ${(trueAngle()*R2D).toFixed(1)}° 可对照`,
    `<b>Sample covariance</b> C = [[${Cxx.toFixed(2)}, ${Cxy.toFixed(2)}], [${Cxy.toFixed(2)}, ${Cyy.toFixed(2)}]] (N=${NP})<br>`+
    `<b>Power iteration</b>: v←Cv/|Cv|, error ×|λ₂/λ₁| per step, geometric convergence<br>`+
    `<b>Eigenvalues = variances</b>: λ₁=${lam1.toFixed(2)}, λ₂=${lam2.toFixed(2)}, sum=trace=${(Cxx+Cyy).toFixed(2)}<br>`+
    `<b>Loss</b>: dropping PC2 discards only ${(100*lam2/(lam1+lam2)).toFixed(1)}% of variance; exact axis ${(trueAngle()*R2D).toFixed(1)}° for comparison`);
}

/* ---- 统计 ---- */
function updateStats(){
  let a=angOf(pc1x,pc1y)*R2D;a=((a%180)+180)%180;
  document.getElementById('stAng').innerHTML=a.toFixed(1)+'<small> °</small>';
  document.getElementById('stL1').textContent=lam1.toFixed(2);
  document.getElementById('stVar').innerHTML=(100*lam1/(lam1+lam2)).toFixed(1)+'<small> %</small>';
  document.getElementById('stIt').textContent=iters;
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  dotM.color.setHex(dark?0x9fc5e8:0x3b6e96);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('主成分与特征向量 · 数据长出的基','PCA & Eigenvectors · A Basis Grown from Data');
  updateFormula();buildSteps();updateStats();drawPlot();
}

/* ---- UI ---- */
const btnAuto=document.getElementById('btnAuto');
document.getElementById('btnStep').addEventListener('click',()=>{powerStep();});
btnAuto.addEventListener('click',()=>{
  autoIter=!autoIter;btnAuto.classList.toggle('on',autoIter);
  if(autoIter&&iters===0)notify('看箭头如何一步步旋到位','watch the arrow swing into place',2.6);
});
document.getElementById('btnProj').addEventListener('click',()=>{startProj();});
document.getElementById('btnNew').addEventListener('click',()=>{resampleNoise();regen();notify('同一 ρ,另一批抽样:C 只会微微挪动','same ρ, new sample: C barely moves — the structure is real',3.0);});
document.getElementById('sRho').addEventListener('input',e=>{
  rho=+e.target.value/100;
  document.getElementById('sRhoVal').textContent=rho.toFixed(2);
  regen();updateFormula();drawPlot();
});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let raf=null,acc=0,accPlot=0,autoStartT=1.2;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(notifyT>0)notifyT-=dt;
  if(playing){
    /* 加载 1.2s 后自动开始幂迭代:招牌瞬间不等按钮 */
    if(autoStartT>0){autoStartT-=dt;if(autoStartT<=0){autoIter=true;btnAuto.classList.add('on');}}
    if(autoIter){
      autoT+=dt;
      if(autoT>0.5){autoT=0;
        const err=powerStep()*R2D;
        if(err<0.3||iters>=40){autoIter=false;btnAuto.classList.remove('on');
          if(iters<40)notify(`收敛:PC1=${(angOf(pc1x,pc1y)*R2D).toFixed(1)}°,与解析解一致`,`converged: PC1=${(angOf(pc1x,pc1y)*R2D).toFixed(1)}°, matches the analytic axis`,3.0);}
      }
    }
    /* 投影重建动画 */
    if(projPhase==='collapse'){
      projT+=dt/1.1;
      if(projT>=1){projT=1;projPhase='hold';holdT=0.9;}
    }else if(projPhase==='hold'){
      holdT-=dt;if(holdT<=0)projPhase='restore';
    }else if(projPhase==='restore'){
      projT-=dt/1.1;
      if(projT<=0){projT=0;projPhase='idle';}
    }
  }
  /* 箭头角平滑 + 全部 3D 元素 */
  const target=angOf(pc1x,pc1y);
  let d=((target-dispAng+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  dispAng+=d*(1-Math.exp(-8*dt));
  const s1=Math.sqrt(Math.max(lam1,0.0001)),s2=Math.sqrt(Math.max(lam2,0.0001));
  setArrow(arrow1,Math.cos(dispAng),Math.sin(dispAng),1.1+3.8*s1/(s1+s2),0.12);
  setArrow(arrow2,-Math.sin(dispAng),Math.cos(dispAng),0.5+3.0*s2/(s1+s2),0.12);
  resLines.visible=projT>0.02;
  writeDots();
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  accPlot+=dt;if(accPlot>0.25){accPlot=0;drawPlot();}
  for(const r of labelReg){
    const txt=r.text();
    r.o.visible=labelsOn&&r.vis()&&txt!=='';
    if(r.o.visible)r.o.element.textContent=txt;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ================= 初始化 ================= */
resampleNoise();
regen();          // 会调用 updateAll3D
resetIter();
applyTheme();
buildSteps();
applyLang();
if(!playing)document.getElementById('play').textContent=L('运行','Run');
updateStats();drawPlot();
start();
</script>
</body>
</html>
