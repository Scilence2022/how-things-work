<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光钟与时间膨胀 · 运动的光必须走斜线</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1.45; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl b { color: var(--text); font-weight: 600; }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { color: #9c6f00; }
  :root[data-theme="light"] .lbl.b { color: #0c7ba6; }
  :root[data-theme="light"] .lbl.r { color: #b03a26; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    max-width: 640px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 16px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }
  :root[data-theme="light"] #stats .v.g { color: var(--acc); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.y { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.b { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .chip.r { color: #ffc4b5; border-color: rgba(255,122,92,.7); }
  :root[data-theme="light"] .chip.y { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  :root[data-theme="light"] .chip.b { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.r { color: #b03a26; border-color: rgba(176,58,38,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; white-space: nowrap; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,209,102,.6); background: rgba(255,209,102,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(176,118,31,.55); background: rgba(176,118,31,.10); }
  #actions2 { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 58px; text-align: right;
    font-variant-numeric: tabular-nums; }
  .row.off { opacity: .38; pointer-events: none; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; transition: opacity .15s; }
  #toggles label.off { opacity: .38; pointer-events: none; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="光钟与时间膨胀:运动的光必须走斜线" data-en="Light Clocks &amp; Time Dilation: moving light must go diagonal">光钟与时间膨胀:运动的光必须走斜线</h1>
  <div class="sub" data-zh="光速对谁都相同 → 运动钟的光被迫走斜线,斜边 = γ×竖边 → 滴答慢 γ 倍;0.995c 的 μ 子因此活到地面,GPS 卫星钟每天快 38 μs · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Constant c for everyone → a moving clock's light must take the diagonal, γ× longer → ticks γ× slower; that's how 0.995c muons reach the ground and GPS gains 38 µs a day · drag to orbit / scroll to zoom · Space = play/pause">光速对谁都相同 → 运动钟的光被迫走斜线,斜边 = γ×竖边 → 滴答慢 γ 倍;0.995c 的 μ 子因此活到地面,GPS 卫星钟每天快 38 μs · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" id="k1">—</span><span class="v g" id="s1">—</span>
  <span class="k" id="k2">—</span><span class="v" id="s2">—</span>
  <span class="k" id="k3">—</span><span class="v" id="s3">—</span>
  <span class="k" id="k4">—</span><span class="v" id="s4">—</span>
  <span class="k" id="k5">—</span><span class="v" id="s5">—</span>
</div>

<div id="panel">
  <div id="legend"></div>
  <div id="actions">
    <button class="abtn" id="mdClock" data-zh="双光钟" data-en="light clocks">双光钟</button>
    <button class="abtn" id="mdMuon" data-zh="μ 子" data-en="muons">μ 子</button>
    <button class="abtn" id="mdGps" data-zh="GPS" data-en="GPS">GPS</button>
  </div>
  <div id="actions2"></div>
  <div class="row" id="rowV"><label data-zh="速度 β = v/c" data-en="speed β = v/c">速度 β = v/c</label><input id="v" type="range" min="0" max="995" step="5" value="900"><span class="val" id="vVal">0.900</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglTrail" type="checkbox" checked> <span data-zh="光子轨迹" data-en="photon trails">光子轨迹</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../gps/" data-zh="应用:GPS 为什么必须修钟" data-en="applied: why GPS must correct its clocks">应用:GPS 为什么必须修钟</a>
    <a href="../spacetime-curvature/" data-zh="+45 μs 的出处:时空弯曲" data-en="where the +45 µs comes from: spacetime curvature">+45 μs 的出处:时空弯曲</a>
    <a href="../black-hole-tides/" data-zh="极限:视界上时间冻结" data-en="extreme: time frozen at the horizon">极限:视界上时间冻结</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
const bgCol = new THREE.Color();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  bgCol.set(THEME === 'light' ? 0xe9eef5 : 0x070a12);
  scene.background = bgCol;
  M.ground.color.set(THEME === 'light' ? 0xdde3ec : 0x161d29);
  M.board.color.set(THEME === 'light' ? 0xe3e9f1 : 0x141b26);
  M.atm.opacity = THEME === 'light' ? 0.16 : 0.11;
  triOutline.material.color.set(THEME === 'light' ? 0xb0761f : 0xffd166);
  triHyp.material.color.set(THEME === 'light' ? 0x8a5c0d : 0xffe9a8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('光钟与时间膨胀 · 运动的光必须走斜线', 'Light Clocks & Time Dilation · moving light must go diagonal');
  for (const r of labelReg) r.o.element.innerHTML = r.text();
  buildSteps(); renderActions(); renderLegend(); setPlayLabel(); updateStats();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.0, 2.9, 11.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.8, 1.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 26;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 8, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.2,
    emissive: color, emissiveIntensity: 0.08, ...opts });
}
const M = {
  ground: mat(0x161d29, { roughness: 0.9, metalness: 0, emissive: 0x000000 }),
  board: mat(0x141b26, { roughness: 0.95, metalness: 0, emissive: 0x000000 }),
  frame: mat(0x9aa7b3, { metalness: 0.6, roughness: 0.35 }),
  mirror: mat(0xdfe6ee, { metalness: 0.85, roughness: 0.2 }),
  mirrorM: mat(0xbfe0ff, { metalness: 0.85, roughness: 0.2 }),
  photon: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  trainBody: mat(0x74c0fc, { metalness: 0.4, roughness: 0.4 }),
  shell: new THREE.MeshStandardMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.13,
    roughness: 0.4, metalness: 0.2, side: THREE.DoubleSide, depthWrite: false }),
  rail: mat(0x6b7887, { metalness: 0.7, roughness: 0.4 }),
  atm: new THREE.MeshStandardMaterial({ color: 0x6fb7ff, transparent: true, opacity: 0.11,
    roughness: 1, metalness: 0, side: THREE.DoubleSide, depthWrite: false }),
  detector: mat(0x525e6e, { metalness: 0.5, roughness: 0.5, emissive: 0xffd166, emissiveIntensity: 0 }),
  earth: mat(0x3f7fbf, { roughness: 0.7, metalness: 0.05, emissive: 0x1a3a5c, emissiveIntensity: 0.35 }),
  sat: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.3 }),
  panelM: mat(0x2a4d8f, { metalness: 0.6, roughness: 0.35, emissive: 0x16305e, emissiveIntensity: 0.4 }),
  barSR: new THREE.MeshBasicMaterial({ color: 0x74c0fc }),
  barGR: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  barNet: new THREE.MeshBasicMaterial({ color: 0x7bd88f }),
  orbit: new THREE.LineBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.4 }),
  drift: new THREE.LineBasicMaterial({ color: 0xff7a5c }),
  band: new THREE.LineDashedMaterial({ color: 0xff7a5c, dashSize: 0.12, gapSize: 0.08, transparent: true, opacity: 0.8 }),
};
function haloTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,220,130,1)');
  grd.addColorStop(0.4, 'rgba(255,190,90,.4)');
  grd.addColorStop(1, 'rgba(255,170,60,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const haloTex = haloTexture();

/* ================= 双光钟场景 ================= */
const H = 2.2, Y0 = 0.35, Y1 = Y0 + H;
const C = 1.6;
const XS = -2.0, XMIN = -1.2, XMAX = 10.8, XSTART = 1.8, WRAP = XMAX - XMIN;
const clockGrp = new THREE.Group();
scene.add(clockGrp);
const ground = new THREE.Mesh(new THREE.BoxGeometry(WRAP + 3, 0.12, 10), M.ground);
ground.position.set((XMIN + XMAX) / 2, -0.06, 0);
scene.add(ground);

function mkClockBody(parent, mirrorMat) {
  const bot = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.06, 0.5), mirrorMat);
  bot.position.y = Y0;
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.06, 0.5), mirrorMat);
  top.position.y = Y1;
  parent.add(bot, top);
  for (const dz of [-0.22, 0.22]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, H, 8), M.frame);
    p.position.set(-0.33, Y0 + H / 2, dz);
    parent.add(p);
  }
}
const stillGrp = new THREE.Group();
stillGrp.position.x = XS;
clockGrp.add(stillGrp);
mkClockBody(stillGrp, M.mirror);
{
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.1, 0.7), M.frame);
  base.position.y = 0.05;
  stillGrp.add(base);
}
const train = new THREE.Group();
clockGrp.add(train);

/* ================= γ 对齐三角形更新 ================= */
function updateTriangle() {
  let show = alignFreeze && beta > 0.02;
  if (show) {
    const g = gamma();
    const k = Math.round(tSim * C / (H * g));
    if (k < 1) show = false;
    else {
      const x0 = trainX((k - 1) * H * g / C), x1 = trainX(tSim);
      if (x1 - x0 < 0.1) show = false;
      else {
        const up = (k - 1) % 2 === 0;
        const yA = up ? Y0 : Y1, yB = up ? Y1 : Y0;
        triFaceGeo.attributes.position.array.set([x0, yA, 0, x0, yB, 0, x1, yB, 0]);
        triFaceGeo.attributes.position.needsUpdate = true;
        triOutlineGeo.attributes.position.array.set([x0, yA, 0, x0, yB, 0, x1, yB, 0]);
        triOutlineGeo.attributes.position.needsUpdate = true;
        triHypGeo.attributes.position.array.set([x0, yA, 0, x1, yB, 0]);
        triHypGeo.attributes.position.needsUpdate = true;
        lblLegV.o.position.set(x0 - 0.18, (yA + yB) / 2, 0);
        lblLegH.o.position.set((x0 + x1) / 2, yB + (up ? 0.2 : -0.2), 0);
        lblLegC.o.position.set((x0 + x1) / 2 + 0.3, (yA + yB) / 2 + 0.12, 0);
      }
    }
  }
  triFace.visible = triOutline.visible = triHyp.visible = show;
}

const elSpd = document.getElementById('spd'), elSpdVal = document.getElementById('spdVal');
function setBeta(b) {
  beta = clamp(b, 0, 0.995);
  elV.value = Math.round(beta * 1000);
  elVVal.textContent = beta.toFixed(3);
  if (alignFreeze) {
    const g = gamma();
    const k = Math.max(1, Math.round(tSim * C / (H * g)));
    tSim = k * H * g / C;
    prevTL = prevTR = 0;
  }
  trailDirty = true;
  if (mode === 'muon') muonReset();
}
const STEPS = [
  { b: '光速不变:铁律', be: 'Constant c: the law',
    d: '真空光速对谁都一样:c = 299,792.458 km/s,与光源运动无关。把 β 拉到 0:两只钟完全同步——接下来唯一能变的,只有路径与时间。',
    de: 'Light in vacuum goes one speed for everyone: c = 299,792.458 km/s, whatever the source does. At β = 0 the clocks agree perfectly — only paths and times may differ.',
    act: () => { setMode('clock'); setBeta(0); resetClock(); playing = true; setPlayLabel(); } },
  { b: '斜线更长 → 滴答更慢', be: 'Longer diagonal → slower ticks',
    d: '火车里的光子随车横移,地面看它走斜线:斜边 = γ × 竖边。速率同为 c 而路程更长,每个滴答必然更久——看两个滴答计数与渐隐轨迹分道扬镳。',
    de: 'Riding the train, the photon traces diagonals in the ground frame: hypotenuse = γ × vertical. Same speed, longer path — every tick takes longer. Watch the counters part ways.',
    act: () => { setMode('clock'); setBeta(0.9); resetClock(); playing = true; setPlayLabel(); } },
  { b: 'γ 因子:停在对齐时刻', be: 'The γ factor: frozen at alignment',
    d: 'γ = 1/√(1−β²):β=0.995 时 γ≈10。定格后:静止钟走了 10.0 滴答,运动钟才 1 滴答;金色三角形现场演勾股 c²Δt² = v²Δt² + c²Δt′²,拖动滑块三角形随之伸缩。',
    de: 'γ = 1/√(1−β²): at β=0.995, γ≈10. Frozen here, the still clock has ticked 10.0 times, the moving one just once; the gold triangle performs Pythagoras live — drag the slider and watch it stretch.',
    act: () => { setMode('clock'); setBeta(0.995); resetClock(); jumpAlign(); } },
  { b: 'μ 子:两种账,一个结果', be: 'Muons: two ledgers, one answer',
    d: '0.995c 的 μ 子穿越 10 km 要 33.5 μs,本征寿命仅 2.2 μs。地面账:寿命膨胀 ×10 → 存活 ~22%;μ 子账:大气收缩 ÷10 → 同样 ~22%。它们真的到得了地面。',
    de: 'A 0.995c muon needs 33.5 µs to cross 10 km of air yet lives only 2.2 µs. Ground ledger: lifetime stretched ×10 → ~22% survive; muon ledger: air contracted ÷10 → the same ~22%. They really do arrive.',
    act: () => { dilOn = true; setMode('muon'); playing = true; setPlayLabel(); } },
  { b: '对照:关掉膨胀', be: 'Control: dilation off',
    d: '把膨胀关掉:2.2 μs 寿命只够飞 ~660 m,μ 子本该全军覆没在大气中途——现实里它们成群到达探测器,正是时间膨胀最直接的铁证。',
    de: 'Switch dilation off: a 2.2 µs lifetime buys only ~660 m of flight and the shower should die mid-air — yet real muons reach detectors in droves, the cleanest proof of time dilation.',
    act: () => { dilOn = false; setMode('muon'); playing = true; setPlayLabel(); } },
  { b: 'GPS:星钟每天快 38 μs', be: 'GPS: clocks gain 38 µs a day',
    d: '2 万 km 高空引力弱,星钟每天快 45.7 μs;高速运动又让它慢 7.2 μs——净快 38.5 μs。不修正,定位每天漂 ~11.5 km:GPS 天生活在相对论里。',
    de: 'Weaker gravity at 20,200 km speeds the satellite clock +45.7 µs/day; its speed costs −7.2 µs — net +38.5 µs. Uncorrected, fixes drift ~11.5 km every day: GPS lives on relativity.',
    act: () => { setMode('gps'); gpsDays = 0; playing = true; setPlayLabel(); } },
];
function stepIndex() {
  if (mode === 'gps') return 5;
  if (mode === 'muon') return dilOn ? 3 : 4;
  if (alignFreeze || beta > 0.975) return 2;
  if (beta < 0.02) return 0;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= 模式 / 相机 ================= */
const CAMS = {
  clock: { p: [2.0, 2.9, 11.0], t: [1.8, 1.35, 0] },
  muon: { p: [0.3, 2.1, 7.3], t: [0, 1.6, 0] },
  gps: { p: [1.1, 2.3, 5.9], t: [-0.55, 0.75, 0] },
};
let camAnim = null;
function setMode(m) {
  mode = m;
  if (m !== 'clock') alignFreeze = false;
  const c = CAMS[m];
  camAnim = { k: 0, p0: camera.position.clone(), p1: V3(...c.p), t0: controls.target.clone(), t1: V3(...c.t) };
  controls.autoRotate = false;
  clockGrp.visible = m === 'clock';
  muonGrp.visible = m === 'muon';
  gpsGrp.visible = m === 'gps';
  ground.visible = m !== 'gps';
  if (m === 'muon') setBeta(0.995);
  for (const [id, mm] of [['mdClock', 'clock'], ['mdMuon', 'muon'], ['mdGps', 'gps']])
    document.getElementById(id).classList.toggle('on', mm === m);
  syncPanel(); renderActions(); renderLegend(); refreshLabels(); updateStats();
}
function syncPanel() {
  document.getElementById('rowV').classList.toggle('off', mode !== 'clock');
  document.getElementById('tglTrail').closest('label').classList.toggle('off', mode !== 'clock');
}

/* ================= 情境按钮 / 图例 ================= */
function renderActions() {
  const box = document.getElementById('actions2');
  box.innerHTML = '';
  const mk = (html, on, cb) => {
    const b = document.createElement('button');
    b.className = 'abtn' + (on ? ' on' : '');
    b.innerHTML = html;
    b.addEventListener('click', cb);
    box.appendChild(b);
  };
  if (mode === 'clock') {
    mk(L('⏸ 停在 γ 对齐', '⏸ freeze at γ-alignment'), alignFreeze, jumpAlign);
    mk(L('↺ 重置滴答', '↺ reset ticks'), false, resetClock);
  } else if (mode === 'muon') {
    mk(dilOn ? L('时间膨胀:开', 'dilation: ON') : L('时间膨胀:关!', 'dilation: OFF!'), dilOn,
      () => { dilOn = !dilOn; muonReset(); renderActions(); });
    mk(L('↺ 重置计数', '↺ reset counts'), false, muonReset);
  } else {
    mk(L('↺ 重置天数', '↺ reset days'), false, () => { gpsDays = 0; });
  }
}
function renderLegend() {
  const el = document.getElementById('legend');
  const chip = (cls, zh, en) => `<span class="chip ${cls}">${L(zh, en)}</span>`;
  if (mode === 'clock') el.innerHTML =
    chip('y', '光子(金)· 速率恒为 c', 'photon (gold) · always at c') +
    chip('b', '运动火车 · 车内光仍竖直', 'moving train · light still vertical onboard') +
    chip('r', '渐隐轨迹:竖直 vs 斜线', 'fading trails: vertical vs diagonal');
  else if (mode === 'muon') el.innerHTML =
    chip('y', 'μ 子(变暗 = 衰老)', 'muons (dimming = ageing)') +
    chip('b', '10 km 大气层', '10 km of atmosphere') +
    chip('r', '红线:不膨胀的衰变带 ~660 m', 'red line: decay band ~660 m without dilation');
  else el.innerHTML =
    chip('b', 'GPS 卫星(每天 2 圈)', 'GPS satellite (2 orbits/day)') +
    chip('y', '星载钟 vs 地面钟', 'satellite vs ground clock') +
    chip('r', '未修正定位漂移(×60)', 'uncorrected position drift (×60)');
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const tglLabels = document.getElementById('tglLabels');
const tglTrail = document.getElementById('tglTrail');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elV.addEventListener('input', () => setBeta(parseInt(elV.value, 10) / 1000));
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; if (playing) alignFreeze = false; setPlayLabel(); renderActions(); });
document.getElementById('mdClock').addEventListener('click', () => setMode('clock'));
document.getElementById('mdMuon').addEventListener('click', () => setMode('muon'));
document.getElementById('mdGps').addEventListener('click', () => setMode('gps'));
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglTrail.addEventListener('change', () => { trailOn = tglTrail.checked; trailDirty = true; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 读数(全部实时计算) ================= */
const kEls = [1, 2, 3, 4, 5].map(i => document.getElementById('k' + i));
const sEls = [1, 2, 3, 4, 5].map(i => document.getElementById('s' + i));
function row(i, k, vHtml) { kEls[i].textContent = k; sEls[i].innerHTML = vHtml; }
function updateStats() {
  const g = gamma();
  if (mode === 'clock') {
    const lag = tSim * C / H - tSim * C / (H * g);
    row(0, L('速度 β', 'speed β'), beta.toFixed(3) + '<small> c</small>');
    row(1, L('膨胀因子 γ', 'γ factor'), g.toFixed(3));
    row(2, L('静止钟滴答', 'still ticks'), String(tickL()));
    row(3, L('运动钟滴答', 'moving ticks'), String(tickR()));
    row(4, L('累积时差', 'accrued lag'), lag.toFixed(1) +
      `<small> ${L('滴答', 'ticks')} · ${L('动钟慢', 'slow by')} ${((1 - 1 / g) * 100).toFixed(1)}%</small>`);
  } else if (mode === 'muon') {
    const pTh = Math.exp(-muCross() / muTau()), pNo = Math.exp(-muCross() / 2.2);
    row(0, L('μ 子速度 β', 'muon β'), beta.toFixed(3) + '<small> c</small>');
    row(1, L('膨胀因子 γ', 'γ factor'), g.toFixed(2));
    row(2, L('到达 / 发射', 'arrived / born'), `${muArrived} / ${muSpawned}`);
    row(3, L('存活率 实测 / 理论', 'survival meas/theory'),
      (muSpawned > 50 ? (100 * muArrived / muSpawned).toFixed(1) + '%' : '—') + `<small> / ${(100 * pTh).toFixed(1)}%</small>`);
    row(4, L('若关掉膨胀(理论)', 'without dilation (theory)'), pNo.toExponential(1));
  } else {
    row(0, L('卫星速度', 'satellite speed'), '3.87<small> km/s</small>');
    row(1, L('狭义:γ − 1', 'SR: γ − 1'), (0.5 * (3.87 / 299792.458) ** 2).toExponential(1) +
      `<small> → −7.2 ${L('μs/天', 'µs/day')}</small>`);
    row(2, L('经过天数', 'days elapsed'), gpsDays.toFixed(1) + '<small> d</small>');
    row(3, L('星钟累计偏移', 'sat clock offset'), '+' + (gpsDays * GPS_NET).toFixed(1) + '<small> μs</small>');
    row(4, L('未修正定位漂移', 'uncorrected drift'), (gpsDays * GPS_DRIFT).toFixed(1) + '<small> km</small>');
  }
}

/* ================= GPS 每帧更新 ================= */
const gpsV1 = new THREE.Vector3(), gpsV2 = new THREE.Vector3();
function updateGps() {
  const th = gpsDays * Math.PI * 4;
  sat.position.set(RO * Math.sin(th), 0, RO * Math.cos(th));
  sat.rotation.y = th;
  earthGrp.rotation.y = gpsDays * Math.PI * 2;
  const arc = Math.min(gpsDays * GPS_DRIFT / 6371 * 60, Math.PI / 2);
  const arr = driftGeo.attributes.position.array;
  for (let i = 0; i <= DR_N; i++) {
    const a = i / DR_N * arc;
    arr[i * 3] = (RE + 0.015) * Math.sin(a);
    arr[i * 3 + 1] = 0;
    arr[i * 3 + 2] = (RE + 0.015) * Math.cos(a);
  }
  driftGeo.attributes.position.needsUpdate = true;
  driftGeo.setDrawRange(0, gpsDays > 0.02 ? DR_N + 1 : 1);
  driftPt.visible = gpsDays > 0.02;
  driftPt.position.set((RE + 0.02) * Math.sin(arc), 0, (RE + 0.02) * Math.cos(arc));
  sat.getWorldPosition(gpsV1);
  marker.getWorldPosition(gpsV2);
  signalGeo.attributes.position.array.set([gpsV1.x, gpsV1.y, gpsV1.z, gpsV2.x, gpsV2.y, gpsV2.z]);
  signalGeo.attributes.position.needsUpdate = true;
  signal.computeLineDistances();
  lblGndClk.o.element.textContent = L(`地面钟 ${fmtClk(43200e6 + gpsDays * 86400e6)}`,
    `ground ${fmtClk(43200e6 + gpsDays * 86400e6)}`);
  lblSatClk.o.element.textContent = L(`星载钟 ${fmtClk(43200e6 + gpsDays * (86400e6 + GPS_NET))}`,
    `satellite ${fmtClk(43200e6 + gpsDays * (86400e6 + GPS_NET))}`);
}
function fmtClk(us) {
  const s = Math.floor(us / 1e6) % 86400;
  return `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}.${String(Math.floor(us % 1e6)).padStart(6, '0')}`;
}

/* ================= 主循环 ================= */
const clk = new THREE.Clock();
let raf = null, lastStep = -1;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clk.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);

  if (dts > 0) {
    if (mode === 'clock') {
      tSim += dts;
      const tl = tickL(), tr = tickR();
      if (tl > prevTL) flashL = 1;
      if (tr > prevTR) flashR = 1;
      prevTL = tl; prevTR = tr;
    } else if (mode === 'muon') muonStep(dts, false);
    else gpsDays += dts * 0.5;
  }
  flashL = Math.max(0, flashL - dt * 3.5);
  flashR = Math.max(0, flashR - dt * 3.5);
  detFlash = Math.max(0, detFlash - dt * 3);

  if (camAnim) {
    camAnim.k = Math.min(1, camAnim.k + dt / 0.9);
    const e = camAnim.k * camAnim.k * (3 - 2 * camAnim.k);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.k >= 1) { camAnim = null; controls.autoRotate = tglRotate.checked; }
  }

  if (mode === 'clock') {
    posStill(tSim, tmpV); pStill.position.copy(tmpV);
    posMoving(tSim, tmpV); pMoving.position.copy(tmpV);
    train.position.x = trainX(tSim);
    arrow.visible = beta > 0.01;
    arrow.scale.x = 0.4 + beta * 1.3;
    M.mirror.emissiveIntensity = 0.08 + flashL * 2.2;
    M.mirrorM.emissiveIntensity = 0.08 + flashR * 2.2;
    trailS.visible = trailM.visible = trailOn;
    if (trailOn && (dts > 0 || trailDirty)) {
      updTrail(trailS, posStill);
      updTrail(trailM, posMoving);
      trailDirty = false;
    }
    updateTriangle();
    lblTickL.o.element.innerHTML = L(`${tickL()} 滴答`, `${tickL()} ticks`);
    lblTickR.o.element.innerHTML = L(`${tickR()} 滴答`, `${tickR()} ticks`);
  } else if (mode === 'muon') {
    muonDraw();
  } else {
    updateGps();
  }

  for (const r of labelReg) if (!r.dynamic) r.o.element.innerHTML = r.text();
  refreshLabels();
  updateStats();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clk.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
elV.value = Math.round(beta * 1000); elVVal.textContent = beta.toFixed(3);
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
tglLabels.checked = labelsOn;
tglTrail.checked = trailOn;
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
applyTheme();
setMode(mode);
applyLang();
setPlayLabel();
start();
</script>
