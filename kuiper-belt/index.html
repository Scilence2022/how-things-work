<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x070a12,60,200);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,400);
camera.position.set(0,33,24);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=110;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.28));
const key=new THREE.DirectionalLight(0xfff2dd,0.85);key.position.set(5,12,3);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.2);fill.position.set(-8,4,-6);scene.add(fill);

/* 星空:随机点云(非贴图) */
const NSTAR=900,starPos=new Float32Array(NSTAR*3);
for(let i=0;i<NSTAR;i++){const r=95+Math.random()*55,a=Math.random()*Math.PI*2,c=2*Math.random()-1,s=Math.sqrt(1-c*c);
  starPos[i*3]=r*s*Math.cos(a);starPos[i*3+1]=r*c;starPos[i*3+2]=r*s*Math.sin(a);}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
const starMat=new THREE.PointsMaterial({color:0xcfd8ea,size:1.1,transparent:true,opacity:0.9,fog:false});
scene.add(new THREE.Points(starGeo,starMat));
/* 太阳:自发光小球 + 程序生成光晕 */
const glowTex=(()=>{
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const rg=g.createRadialGradient(64,64,4,64,64,64);
  rg.addColorStop(0,'rgba(255,216,150,0.95)');rg.addColorStop(0.4,'rgba(255,180,90,0.35)');rg.addColorStop(1,'rgba(255,160,60,0)');
  g.fillStyle=rg;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
glow.scale.set(4.5,4.5,1);scene.add(glow);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.5,24,18),new THREE.MeshBasicMaterial({color:0xffd27a})));
scene.add(new THREE.PointLight(0xffe2b0,2.4,90,1.1));
/* 距离标尺:径向压缩 r→2√r,兼顾 0.4 AU 内行星与 50 AU 外缘 */
const AU=u=>2.0*Math.sqrt(u);
const V1=new THREE.Vector3();
function radScale(v){const l=v.length();if(l>1e-6)v.multiplyScalar(2*Math.sqrt(l)/l);return v;}
const matReg=[],orbitLines=[];
function circleLine(r,dc,lc,op){
  const pts=[];for(let i=0;i<=128;i++){const a=i/128*Math.PI*2;pts.push(new THREE.Vector3(r*Math.cos(a),0,r*Math.sin(a)));}
  const m=new THREE.LineBasicMaterial({color:dc,transparent:true,opacity:op});
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),m);
  scene.add(ln);orbitLines.push(ln);matReg.push({m:m,dc:dc,lc:lc});return ln;
}
/* 内侧四颗行星(视觉周期下限 3 yr 防频闪)+ 海王星 */
const PLANETS=[{au:0.39,c:0x9aa0a8,r:0.09},{au:0.72,c:0xe0c48f,r:0.13},{au:1.0,c:0x74c0fc,r:0.14},{au:1.52,c:0xd9884a,r:0.11}];
const bodies=[];
PLANETS.forEach(p=>{
  circleLine(AU(p.au),0x445060,0x9aa2ad,0.45);
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(p.r,14,10),new THREE.MeshStandardMaterial({color:p.c,roughness:0.6,emissive:p.c,emissiveIntensity:0.3}));
  scene.add(mesh);bodies.push({mesh:mesh,r:AU(p.au),om:2*Math.PI/3,ph:Math.random()*7});});
const NEP_R=AU(30),NEP_T=165;
circleLine(NEP_R,0x4f8fd0,0x2a5a90,0.6);
const nep=new THREE.Mesh(new THREE.SphereGeometry(0.26,18,12),new THREE.MeshStandardMaterial({color:0x4f8fd0,roughness:0.55,emissive:0x1c4a80,emissiveIntensity:0.5}));scene.add(nep);
/* 柯伊伯带:4200 颗冰点(InstancedMesh),30 AU 内缘、50 AU 悬崖,开普勒差速 */
const NB=4200;
const beltM=new THREE.MeshStandardMaterial({color:0xbfd0e0,roughness:1,metalness:0});
const belt=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.05,0),beltM,NB);
belt.instanceMatrix.setUsage(THREE.DynamicDrawUsage);belt.frustumCulled=false;scene.add(belt);
const bR=new Float32Array(NB),bTh=new Float32Array(NB),bOm=new Float32Array(NB),bY=new Float32Array(NB),bS=new Float32Array(NB);
for(let i=0;i<NB;i++){
  const u=Math.random(),au=u<0.94?30+Math.random()*17:(u<0.995?47+Math.random()*3:50.2+Math.random()*2.5);
  bR[i]=AU(au);bTh[i]=Math.random()*Math.PI*2;bOm[i]=2*Math.PI/Math.pow(au,1.5);
  bY[i]=(Math.random()+Math.random()-1)*0.5;bS[i]=0.6+Math.random()*1.1;
}
/* 离散盘(第 6 步亮出) */
const NSC=110;
const scatM=new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:1,emissive:0x30363f,emissiveIntensity:0.4});
const scat=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.045,0),scatM,NSC);
scat.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scat.frustumCulled=false;scat.visible=false;scene.add(scat);
const sR=new Float32Array(NSC),sTh=new Float32Array(NSC),sOm=new Float32Array(NSC),sY=new Float32Array(NSC),sS=new Float32Array(NSC);
for(let i=0;i<NSC;i++){
  const au=52+Math.random()*42;
  sR[i]=AU(au);sTh[i]=Math.random()*Math.PI*2;sOm[i]=2*Math.PI/Math.pow(au,1.5);
  sY[i]=(Math.random()+Math.random()-1)*2.6;sS[i]=0.7+Math.random()*0.9;
}
const m4=new THREE.Matrix4();
/* 冥王星:椭圆 e=0.25、倾角 17°;与海王星精确 2:3(165/247.5)锁相 */
const PL={a:39.5,e:0.25,T:247.5,inc:17*Math.PI/180,w:1.9,Om:1.1};
let plE=0.25,tiltEx=1;
const plM=new THREE.MeshStandardMaterial({color:0xd8a03c,roughness:0.5,emissive:0xd8a03c,emissiveIntensity:0.55});
const pluto=new THREE.Mesh(new THREE.SphereGeometry(0.17,16,12),plM);scene.add(pluto);
const plArr=new Float32Array(129*3),plGeo=new THREE.BufferGeometry();
plGeo.setAttribute('position',new THREE.BufferAttribute(plArr,3));
const plLineM=new THREE.LineBasicMaterial({color:0xff8787,transparent:true,opacity:0.85});
const plOrbit=new THREE.Line(plGeo,plLineM);scene.add(plOrbit);orbitLines.push(plOrbit);matReg.push({m:plLineM,dc:0xff8787,lc:0xc23a3a});
function keplerE(M,e){let E=M;for(let k=0;k<5;k++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));return E;}
function ellPoint(au,e,inc,w,Om,E,out){
  const px=au*(Math.cos(E)-e),pz=au*Math.sqrt(Math.max(0,1-e*e))*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),si=Math.sin(inc),ci=Math.cos(inc);
  const x1=px*cw-pz*sw,z1=px*sw+pz*cw,y2=z1*si,z2=z1*ci,cO=Math.cos(Om),sO=Math.sin(Om);
  return out.set(x1*cO-z2*sO,y2,x1*sO+z2*cO);
}
function rebuildPlutoOrbit(){
  for(let i=0;i<=128;i++){ellPoint(PL.a,plE,PL.inc*tiltEx,PL.w,PL.Om,i/128*Math.PI*2,V1);radScale(V1);
    plArr[i*3]=V1.x;plArr[i*3+1]=V1.y;plArr[i*3+2]=V1.z;}
  plGeo.attributes.position.needsUpdate=true;
  ellPoint(PL.a,plE,PL.inc*tiltEx,PL.w,PL.Om,0,V1);radScale(V1);resMk.position.copy(V1);
}
/* 共振连线(海王星↔冥王星)+ 近日点共振标记 */
const resGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
const resLine=new THREE.Line(resGeo,new THREE.LineBasicMaterial({color:0x8ce99a,transparent:true,opacity:0.75}));resLine.visible=false;scene.add(resLine);
const resMk=new THREE.Mesh(new THREE.SphereGeometry(0.14,12,8),new THREE.MeshBasicMaterial({color:0x8ce99a}));resMk.visible=false;scene.add(resMk);rebuildPlutoOrbit();

/* 矮行星名单:冥王星/阋神星/鸟神星/妊神星(选中才显形) */
const DWARFS=[
 {n:'冥王星',en:'Pluto',au:39.5,e:0.25,inc:17,T:247.5,w:1.9,Om:1.1,M0:0,c:0xd8a03c},
 {n:'阋神星',en:'Eris',au:67.8,e:0.44,inc:44,T:558,w:2.6,Om:0.4,M0:2.1,c:0xe8e6df},
 {n:'鸟神星',en:'Makemake',au:45.4,e:0.16,inc:29,T:306,w:4.4,Om:2.2,M0:4.0,c:0xc9a227},
 {n:'妊神星',en:'Haumea',au:43.1,e:0.19,inc:28,T:283,w:0.7,Om:3.9,M0:1.2,c:0x9fd8e8}];let dwarfSel=-1;
DWARFS.forEach((d,idx)=>{
  if(idx===0){d.mesh=pluto;return;}
  const arr=new Float32Array(129*3),geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
  for(let i=0;i<=128;i++){ellPoint(d.au,d.e,d.inc*Math.PI/180,d.w,d.Om,i/128*Math.PI*2,V1);radScale(V1);
    arr[i*3]=V1.x;arr[i*3+1]=V1.y;arr[i*3+2]=V1.z;}
  geo.attributes.position.needsUpdate=true;
  const lm=new THREE.LineBasicMaterial({color:0xc9b98a,transparent:true,opacity:0.6});
  const ln=new THREE.Line(geo,lm);ln.visible=false;scene.add(ln);matReg.push({m:lm,dc:0xc9b98a,lc:0x8a7a4a});
  d.mesh=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,10),new THREE.MeshStandardMaterial({color:d.c,roughness:0.5,emissive:d.c,emissiveIntensity:0.45}));
  d.mesh.visible=false;scene.add(d.mesh);d.line=ln;
});

/* 状态 */
let timeScale=3,playing=true,labelsOn=true,slowMo=false,orbitsOn=true,resOn=false;
let simT=0,simY=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
function mkLbl(cls){const d=document.createElement('div');d.className='lbl '+cls;return new CSS2DObject(d);}
/* 海王星标签(挂到移动的行星上) */
const nepLbl=mkLbl('b');nepLbl.position.set(0,0.55,0);nep.add(nepLbl);
labelReg.push({o:nepLbl,vis:()=>true,text:()=>L('海王星:30 AU 的最后一个巨行星','Neptune: last giant at 30 AU')});
/* 共振连线读数(挂到冥王星上,实时角距) */
function sepDeg(){const a1=Math.atan2(pluto.position.z,pluto.position.x),a2=Math.atan2(nep.position.z,nep.position.x),d=Math.abs(a1-a2)*180/Math.PI;return Math.min(d,360-d);}
const sepLbl=mkLbl('g');sepLbl.position.set(0,0.5,0);pluto.add(sepLbl);
labelReg.push({o:sepLbl,vis:()=>resOn,
  text:()=>L(`与海王星角距 ${sepDeg().toFixed(0)}°:永不相撞`,`Elongation from Neptune ${sepDeg().toFixed(0)}°: no collision`)});
addLabel(()=>L('柯伊伯带:30–50 AU 的冰质残片带','Kuiper Belt: icy debris, 30-50 AU'),
  new THREE.Vector3(0,0.9,-AU(40)),'y');
addLabel(()=>L('冥王星轨道:e=0.25,i=17°',"Pluto\u0027s orbit: e=0.25, i=17°"),
  resMk.position.clone().add(new THREE.Vector3(0.4,0.75,0)),'r');
addLabel(()=>L('2:3 共振点:冥王星每次都在这里过近日点','2:3 resonance: Pluto crosses perihelion right here'),
  resMk.position.clone().add(new THREE.Vector3(-0.4,-0.85,0)),'g',()=>resOn);
/* 矮行星名单标签 */
DWARFS.forEach((d,idx)=>{
  const lb=mkLbl('g');lb.position.set(0,0.45,0);d.mesh.add(lb);
  labelReg.push({o:lb,vis:()=>dwarfSel===idx,
    text:()=>L(`${d.n}:a=${d.au} AU i=${d.inc}°`,`${d.en}: a=${d.au} AU, i=${d.inc}°`)});});

/* 相机 tween */
const HOME_P=new THREE.Vector3(0,33,24),ORG=new THREE.Vector3(0,0,0);
let tw=null;const easeK=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function flyTo(p1,q1,dur){tw={p0:camera.position.clone(),q0:controls.target.clone(),p1:p1.clone(),q1:q1.clone(),t:0,dur:dur||1.4};}
function setTime(v){timeScale=clamp(v,0.2,10);document.getElementById('sTime').value=timeScale;
  document.getElementById('sTimeVal').textContent='×'+timeScale.toFixed(1);updateStats();}
function setTilt(v){tiltEx=clamp(v,1,6);document.getElementById('sTilt').value=tiltEx;
  document.getElementById('sTiltVal').textContent='×'+tiltEx.toFixed(1);rebuildPlutoOrbit();updateStats();}
function setE(v){plE=clamp(v,0.05,0.35);document.getElementById('sE').value=plE;
  document.getElementById('sEVal').textContent='e='+plE.toFixed(2);rebuildPlutoOrbit();updateStats();}
function setRes(v){resOn=v;document.getElementById('bRes').classList.toggle('on',v);
  resLine.visible=v;resMk.visible=v;updateStats();}
function setDwarf(k){dwarfSel=k;
  DWARFS.forEach((d,idx)=>{if(d.line){const on=dwarfSel===idx;d.mesh.visible=on;d.line.visible=on&&orbitsOn;}});updateStats();}
function setOrbits(v){orbitsOn=v;document.getElementById('tglOrbits').checked=v;
  orbitLines.forEach(l=>l.visible=v);
  DWARFS.forEach((d,idx)=>{if(d.line)d.line.visible=v&&dwarfSel===idx;});}

const STEPS=[
 {zh:'太阳系的冰箱:30–50 AU 的冰质残片带',en:'The solar deep-freeze: icy debris at 30-50 AU',act(){setOrbits(true);setRes(false);setDwarf(-1);setTilt(1);setE(0.25);setTime(3);flyTo(HOME_P,ORG,1.3);}},
 {zh:'行星的失败作:胚胎被巨行星甩出,冻在原地',en:'Where planets failed: embryos flung out, frozen in place',act(){flyTo(new THREE.Vector3(0,10,8),ORG,1.4);setTime(4);}},
 {zh:'冥王星住这里:偏心 0.25、倾角 17°',en:'Pluto lives here: e=0.25, i=17 degrees',act(){setTilt(2.5);setE(0.25);flyTo(new THREE.Vector3(7,8,14),new THREE.Vector3(0,0,-3),1.4);}},
 {zh:'2:3 共振:和海王星永不错拍',en:'The 2:3 resonance: never out of step with Neptune',act(){setRes(true);setTilt(1);setTime(8);flyTo(HOME_P,ORG,1.2);}},
 {zh:'矮行星:清不干净邻居的住户',en:'Dwarf planets: residents who never cleared the neighborhood',act(){setDwarf(0);setTime(4);flyTo(new THREE.Vector3(9,14,15),ORG,1.3);}},
 {zh:'50 AU 悬崖之外:离散盘的散兵',en:'Beyond the 50 AU cliff: strays of the scattered disk',act(){setDwarf(1);setTime(5);flyTo(new THREE.Vector3(0,30,24),ORG,1.4);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const aAU=Math.pow(pluto.position.length()/2,2),dv=document.getElementById('stD'); /* 逆径向标尺 units→AU */
  dv.innerHTML=aAU.toFixed(1)+'<small> AU</small>';dv.className='v '+(aAU<30?'warn':'ok');
  document.getElementById('stT').innerHTML=simY.toFixed(0)+'<small> yr</small>';
  const iv=document.getElementById('stI');iv.innerHTML='17<small>°</small>';iv.className='v ok';
  const rv=document.getElementById('stR');rv.textContent='2 : 3';rv.className='v ok';
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bRes').addEventListener('click',()=>setRes(!resOn));
document.getElementById('bDwarf').addEventListener('click',()=>{let k=(dwarfSel+1)%5;if(k===4)k=-1;setDwarf(k);});
document.getElementById('bResetView').addEventListener('click',()=>flyTo(HOME_P,ORG,1.2));
document.getElementById('sTime').addEventListener('input',e=>setTime(+e.target.value));
document.getElementById('sTilt').addEventListener('input',e=>setTilt(+e.target.value));
document.getElementById('sE').addEventListener('input',e=>setE(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglOrbits').addEventListener('change',e=>{setOrbits(e.target.checked);});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x070a12:0xdde6ee);
  scene.fog.color.setHex(dark?0x070a12:0xdde6ee);
  starMat.opacity=dark?0.9:0.3;
  beltM.color.setHex(dark?0xbfd0e0:0x55606e);scatM.color.setHex(dark?0x9fb0c3:0x4a5560);
  matReg.forEach(o=>o.m.color.setHex(dark?o.dc:o.lc));
  key.intensity=dark?0.85:1.0;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;simY+=dts*timeScale*1.2;
  /* 内行星 + 海王星(2:3 锁相:冥王星过近日点时,海王星错过 90°,永不照面) */
  bodies.forEach(b=>{const a=b.ph+b.om*simY;b.mesh.position.set(b.r*Math.cos(a),0,b.r*Math.sin(a));});
  const lamN=2*Math.PI*simY/NEP_T+PL.w+PL.Om+Math.PI/2;
  nep.position.set(NEP_R*Math.cos(lamN),0,NEP_R*Math.sin(lamN));
  const Mp=(2*Math.PI*simY/PL.T)%(2*Math.PI);
  ellPoint(PL.a,plE,PL.inc*tiltEx,PL.w,PL.Om,keplerE(Mp,plE),pluto.position);radScale(pluto.position);
  if(resOn){
    const pa=resGeo.attributes.position.array;
    pa[0]=nep.position.x;pa[1]=nep.position.y;pa[2]=nep.position.z;
    pa[3]=pluto.position.x;pa[4]=pluto.position.y;pa[5]=pluto.position.z;
    resGeo.attributes.position.needsUpdate=true;
  }
  /* 柯伊伯带:开普勒差速,整体极缓公转 */
  for(let i=0;i<NB;i++){const th=bTh[i]+bOm[i]*simY;
    m4.makeScale(bS[i],bS[i],bS[i]);m4.setPosition(bR[i]*Math.cos(th),bY[i],bR[i]*Math.sin(th));belt.setMatrixAt(i,m4);}
  belt.instanceMatrix.needsUpdate=true;
  /* 离散盘:第 6 步或选中阋神星时亮出 */
  scat.visible=(activeStep===5)||dwarfSel===1;
  if(scat.visible){
    for(let i=0;i<NSC;i++){const th=sTh[i]+sOm[i]*simY;
      m4.makeScale(sS[i],sS[i],sS[i]);m4.setPosition(sR[i]*Math.cos(th),sY[i],sR[i]*Math.sin(th));scat.setMatrixAt(i,m4);}
    scat.instanceMatrix.needsUpdate=true;
  }
  DWARFS.forEach((d,idx)=>{
    if(idx===0||!d.mesh.visible)return;
    const M=(d.M0+2*Math.PI*simY/d.T)%(2*Math.PI);
    ellPoint(d.au,d.e,d.inc*Math.PI/180,d.w,d.Om,keplerE(M,d.e),d.mesh.position);radScale(d.mesh.position);});
  if(tw){
    tw.t+=dt/tw.dur;const k=easeK(Math.min(1,tw.t));
    camera.position.lerpVectors(tw.p0,tw.p1,k);
    controls.target.lerpVectors(tw.q0,tw.q1,k);
    if(tw.t>=1)tw=null;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
