<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电容器与介电材料 · C=κC₀ 的极化账本</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}

  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 330px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #plot{position:fixed;right:18px;bottom:18px;z-index:4;width:330px;height:212px;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    backdrop-filter:blur(6px);padding:8px 10px 6px}
  #plot h3{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:2px;line-height:1.35}
  #plotCv{width:100%;height:calc(100% - 20px);display:block}
  #stats{position:fixed;right:18px;bottom:242px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.bad{color:#ff6b6b}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 8px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 96px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 78px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);
    border-top:1px dashed var(--panel-border);padding-top:7px}
  #formula b{color:var(--text3);font-weight:600}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="电容器与介电材料" data-en="Capacitors & Dielectrics">电容器与介电材料</h1>
  <div class="sub" data-zh="两块极板夹绝缘介质:C=ε₀κA/d;介质分子被电场极化,束缚电荷部分抵消板间场,让同一电压塞下 κ 倍电荷;断电插入介质电压掉到 V₀/κ,带电插入则电荷补足 κ 倍;τ=RC 定充放快慢,场强超介质耐受即击穿 · 拖 d/A/κ 滑块,切充放电看灯泡与曲线 · 拖动旋转 / 空格运行/暂停" data-en="Two plates sandwich an insulator: C=ε₀κA/d. The field polarises the dielectric; bound charges partially cancel the field, so the same voltage stores κ× more charge. Insert with battery off → voltage sags to V₀/κ; with battery on → charge tops up κ×. τ=RC sets the pace; exceed the dielectric strength and it sparks · drag d/A/κ, switch charge/discharge and watch the bulb and curve · drag to orbit / Space = run/pause">两块极板夹绝缘介质:C=ε₀κA/d;介质分子被电场极化,束缚电荷部分抵消板间场,让同一电压塞下 κ 倍电荷;断电插入介质电压掉到 V₀/κ,带电插入则电荷补足 κ 倍;τ=RC 定充放快慢,场强超介质耐受即击穿 · 拖 d/A/κ 滑块,切充放电看灯泡与曲线 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="plot">
  <h3 data-zh="V–t 曲线:τ=RC 充放电指数(电路时间放慢 ×2000 演示)" data-en="V–t trace: exponential charge/discharge, τ=RC (circuit time slowed ×2000)">V–t 曲线:τ=RC 充放电指数(电路时间放慢 ×2000 演示)</h3>
  <canvas id="plotCv"></canvas>
</div>
<div id="stats">
  <span class="k" data-zh="电容 C" data-en="Capacitance C">电容 C</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="板间电压" data-en="Voltage V">板间电压</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="电荷 Q" data-en="Charge Q">电荷 Q</span><span class="v" id="stQ">—</span>
  <span class="k" data-zh="场强 E" data-en="Field E">场强 E</span><span class="v" id="stE">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnChg" data-zh="接电池充电" data-en="Charge">接电池充电</button>
    <button class="abtn on" id="btnOff" data-zh="断开" data-en="Open">断开</button>
    <button class="abtn" id="btnDis" data-zh="接灯泡放电" data-en="Discharge">接灯泡放电</button>
    <button class="abtn" id="btnIn" data-zh="插入介质" data-en="Insert slab">插入介质</button>
    <button class="abtn" id="btnOut" data-zh="抽出介质" data-en="Remove slab">抽出介质</button>
    <button class="abtn" id="btnReset" data-zh="放电复位" data-en="Reset">放电复位</button>
  </div>
  <div class="row"><label data-zh="板间距 d" data-en="Gap d">板间距 d</label><input id="sD" type="range" min="0.4" max="3" step="0.05" value="1"><span class="val" id="sDVal">1.00 mm</span></div>
  <div class="row"><label data-zh="极板边长 a" data-en="Plate size a">极板边长 a</label><input id="sA" type="range" min="4" max="14" step="0.5" value="8"><span class="val" id="sAVal">8.0 cm</span></div>
  <div class="row"><label data-zh="介电常数 κ" data-en="Constant κ">介电常数 κ</label><input id="sK" type="range" min="1" max="8" step="0.1" value="4"><span class="val" id="sKVal">4.0</span></div>
  <div class="row"><label data-zh="电池电压" data-en="Battery">电池电压</label><input id="sVb" type="range" min="0" max="2000" step="10" value="100"><span class="val" id="sVbVal">100 V</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglDip" type="checkbox" checked> <span data-zh="显示分子偶极" data-en="Dipoles">显示分子偶极</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../touch-screen/" data-zh="触摸屏:人体当介质" data-en="Touchscreen: your finger as dielectric">触摸屏</a>
    <a href="../buck-converter/" data-zh="Buck 变换器:电容稳压" data-en="Buck converter: caps steady the rail">Buck 变换器</a>
    <a href="../pn-junction/" data-zh="PN 结:耗尽层也是电容" data-en="PN junction: a depletion-layer cap">PN 结</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 物理锚点(全部按真实单位算,动画时间放慢 ×2000):
   C = ε₀·κ·A/d,ε₀=8.854 pF/m;A=(a/100)² m²,d 换算 m;
   充电回路 R=10 MΩ,泄放电阻 R=2 MΩ → τ=RC(ms 级);V=Q/C;
   E=V/d,V/mm=kV/m;空气击穿 ~3 kV/mm,有机玻璃类介质 ~20 kV/mm;
   储能 E=½CV²;断电插介质 Q 不变→V=Q/C 掉到 V₀/κ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
const easeOut=p=>1-Math.pow(1-p,3);
const EPS0=8.854e-12, R_CHG=10e6, R_DIS=2e6, TAU_SCALE=2e-3; // 动画 1 s = 电路 2 ms
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
const speedMul=clamp(parseFloat(qs.get('speed'))||1,0.25,3);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,14,40);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(-0.55,1.3,10.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.55,0.85,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=30;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(4,7,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-5,4,-5);scene.add(fill);

/* ---- 材质 ---- */
const benchM=new THREE.MeshStandardMaterial({color:0x1a1e25,roughness:0.95});
const wireM=new THREE.MeshStandardMaterial({color:0x9aa5ae,roughness:0.4,metalness:0.6});
const plateM=new THREE.MeshStandardMaterial({color:0xc9a227,roughness:0.25,metalness:0.9,emissive:0x662200,emissiveIntensity:0});
const plateM2=new THREE.MeshStandardMaterial({color:0x4a7fa5,roughness:0.25,metalness:0.9,emissive:0x001133,emissiveIntensity:0});
const slabM=new THREE.MeshStandardMaterial({color:0x74d8e8,transparent:true,opacity:0.3,roughness:0.15});
const batM=new THREE.MeshStandardMaterial({color:0x3d4654,roughness:0.5,metalness:0.4});
const batCapM=new THREE.MeshStandardMaterial({color:0xff8787,roughness:0.4});
const batCapM2=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4});
const bulbM=new THREE.MeshStandardMaterial({color:0xffe08a,emissive:0xffa000,emissiveIntensity:0,roughness:0.3});
const fieldM=new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.75});
const sparkM=new THREE.LineBasicMaterial({color:0xfff3bf,transparent:true,opacity:1});
const dipP=new THREE.MeshStandardMaterial({color:0xff8787,roughness:0.35});
const dipN=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.35});

/* ---- 电路几何 ---- */
const bench=new THREE.Mesh(new THREE.BoxGeometry(12,0.2,5),benchM);
bench.position.y=-1.35;scene.add(bench);
function seg(x1,y1,x2,y2,w=0.045,z=0){       // 一段导线
  const len=Math.hypot(x2-x1,y2-y1);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,len,w),wireM);
  m.position.set((x1+x2)/2,(y1+y2)/2,z);
  if(Math.abs(x2-x1)>Math.abs(y2-y1))m.rotation.z=Math.PI/2;
  scene.add(m);return m;
}
/* 主回路(四段):顶线 y=2.6,底线 y=-0.75,左立柱 x=-2.9,右侧随极板 */
seg(-2.4,2.6,1.9,2.6);seg(-2.4,-0.75,-2.4,2.6);seg(-2.4,-0.75,2.2,-0.75);   // 底线延长,右极板接线柱落在其上
/* 电池(在左立柱上) */
const batG=new THREE.Group();batG.position.set(-2.4,1.2,0);scene.add(batG);
batG.add(new THREE.Mesh(new THREE.BoxGeometry(0.4,0.7,0.3),batM));
const bp=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.1,0.26),batCapM);bp.position.y=0.42;batG.add(bp);
const bp2=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.1,0.26),batCapM2);bp2.position.y=-0.42;batG.add(bp2);
/* 开关(铰链) */
const swG=new THREE.Group();swG.position.set(-2.4,0.15,0);scene.add(swG);
const lever=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.62,0.12),wireM);
lever.position.y=0.31;swG.add(lever);
seg(-2.4,-0.45,-2.4,-0.75);
/* 灯泡 */
const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.17,16,12),bulbM);
bulb.position.set(-2.4,-0.75,0);scene.add(bulb);
seg(-2.4,-0.3,-2.4,0.15);
const bulbLight=new THREE.PointLight(0xffc078,0,6);bulbLight.position.set(-2.4,-0.6,0.6);scene.add(bulbLight);

/* ---- 极板与介质 ---- */
let dMM=1,aCM=8,kappa=4,vBat=100;         // 滑块状态(真实单位)
let slabFrac=0,slabTgt=0;                  // 介质插入程度
let sw='off';                              // off | chg | dis
let Q=0;                                   // 库仑
let sparkT=0,autoDemo=0,userTouched=false;
const plateCenY=0.9,PLX=0.75;              // 左极板中心 x
const plateL=new THREE.Mesh(new THREE.BoxGeometry(0.09,1,1),plateM);
const plateR=new THREE.Mesh(new THREE.BoxGeometry(0.09,1,1),plateM2);
scene.add(plateL,plateR);
/* 介质板 + 分子偶极 */
const slabG=new THREE.Group();scene.add(slabG);
const slab=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),slabM);
slabG.add(slab);
const dipoles=[];
for(let i=0;i<12;i++){
  const g=new THREE.Group();

/* ---- 物理量 ---- */
function calcC(){
  const gap=dMM*0.42+0.12;
  const fillK=1+(kappa-1)*slabFrac*0.86;   // 部分插入:κ_eff 线性插值
  return EPS0*fillK*(aCM/100)*(aCM/100)/(dMM/1000);
}
function kEff(){return 1+(kappa-1)*slabFrac*0.86;}
function V(){return Q/calcC();}         // V = Q/C(C 随 κ 实时变)

/* ---- RC 曲线 ---- */
const plotCv=document.getElementById('plotCv');
const hist=[];
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const acc=css.getPropertyValue('--acc').trim()||'#ffa94d';
  const txt=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const padL=34,padR=10,padT=10,padB=22;
  const vmax=Math.max(vBat,1);
  ctx.strokeStyle='rgba(128,150,170,.25)';
  ctx.beginPath();ctx.moveTo(padL,H-padB);ctx.lineTo(W-padR,H-padB);ctx.stroke();
  ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,H-padB);ctx.stroke();
  ctx.fillStyle=txt;ctx.font='20px system-ui';
  ctx.fillText('0',padL-18,H-padB+4);ctx.fillText(vmax.toFixed(0)+' V',padL-30,padT+10);
  /* τ 参考线(每 τ 一格) */
  ctx.strokeStyle='rgba(128,150,170,.18)';
  for(let i=1;i<=4;i++){const x=padL+(W-padL-padR)*i/5;
    ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,H-padB);ctx.stroke();}
  /* 曲线 */
  ctx.strokeStyle=acc;ctx.lineWidth=3;ctx.beginPath();
  const N=hist.length;
  for(let i=0;i<N;i++){
    const x=padL+(W-padL-padR)*i/259;
    const y=(H-padB)-(H-padB-padT)*clamp(hist[i]/vmax,0,1);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();ctx.lineWidth=1;
  ctx.fillText('t→ 1τ 2τ 3τ 4τ',padL+6,H-6);
}
function pushHist(){hist.push(V());if(hist.length>260)hist.shift();}

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'结构与电容:两块极板夹介质,C=ε₀κA/d——板大、距近、κ 高,存电多',en:'Anatomy: two plates sandwich a dielectric; C=ε₀κA/d — bigger plates, smaller gap, higher κ store more'},
  {zh:'充电:电子堆上负极板,电流按 e^(-t/τ) 衰减,τ=RC 定快慢',en:'Charging: electrons pile onto the negative plate; current decays as e^(-t/τ), τ=RC'},
  {zh:'极化:介质分子电子云偏移、极性分子转向,表面出现束缚电荷',en:'Polarisation: electron clouds shift, polar molecules rotate — bound charge appears on the faces'},
  {zh:'退极化场:束缚电荷抵消部分板间场,同电压下塞进 κ 倍电荷,C=κC₀',en:'Depolarising field: bound charges cancel part of E, so κ× more charge fits: C=κC₀'},
  {zh:'断电插入:Q 无处可走,Q 不变 → V=Q/C 掉到 V₀/κ',en:'Insert, battery off: Q is trapped — voltage sags to V₀/κ'},
  {zh:'带电插入:电池稳住 V,Q 被 κ 倍补足——电容器储能 ½CV² 也随之涨',en:'Insert, battery on: the battery holds V and tops Q up κ× — stored energy ½CV² rises too'},
  {zh:'击穿:场强超介质耐受(空气 ~3 kV/mm)即火花导通,电荷泄光',en:'Breakdown: beyond dielectric strength (air ~3 kV/mm) the gap sparks and dumps the charge'},
];
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{setPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
let phase=0;
function setPhase(i){
  phase=i;syncSteps();
  if(i===0){sw='off';slabTgt=0;syncBtns();}
  if(i===1){sw='chg';slabTgt=0;syncBtns();notify('合闸:电流 I=(Vb−V)/R 指数衰减,τ=RC','Switch closed: I=(Vb−V)/R decays exponentially, τ=RC');}
  if(i===2||i===3){slabTgt=1;syncBtns();notify('介质滑入:分子极化,电场线被"吃掉"一截','Slab in: molecules polarise, field lines get eaten');}
  if(i===4){slabTgt=1;if(sw!=='off'){sw='off';syncBtns();}notify('断电插入:Q 不变,V=Q/C 掉到 V₀/κ','Insert with battery off: Q frozen, V sags to V₀/κ');}
  if(i===5){slabTgt=1;sw='chg';syncBtns();notify('带电插入:电池把电荷补足 κ 倍','Insert with battery on: the battery tops charge up κ×');}
  if(i===6){slabTgt=0;userTouched=true;autoDemo=99;}
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===phase));
}

/* ---- 统计 ---- */
function updateStats(){
  const C=calcC(),v=V(),e=Math.abs(v)/(dMM);
  document.getElementById('stC').innerHTML=(C*1e12).toFixed(1)+'<small> pF</small>';
  document.getElementById('stV').innerHTML=v.toFixed(1)+'<small> V</small>';
  document.getElementById('stQ').innerHTML=(Q*1e9).toFixed(2)+'<small> nC</small>';
  const el=document.getElementById('stE');
  el.innerHTML=(e/1000).toFixed(2)+'<small> kV/mm</small>';
  const eb=slabFrac>0.7?20:3;
  el.className='v'+(e/1000>eb*0.85?' bad':(e/1000>eb*0.5?'':' ok'));
  document.getElementById('formula').innerHTML=L(
    `<b>C = ε₀·κ_eff·A/d = ${(C*1e12).toFixed(1)} pF</b>(κ_eff=${kEff().toFixed(2)},A=${(aCM/100*aCM/100*1e4).toFixed(0)} cm²,d=${dMM.toFixed(2)} mm)<br>` +
    `<b>τ充 = R·C = ${(R_CHG*C*1e3).toFixed(2)} ms</b>,τ放 = ${(R_DIS*C*1e3).toFixed(2)} ms(时间放慢 ×2000)<br>` +
    `<b>Q = C·V = ${(Q*1e9).toFixed(2)} nC</b>,E = V/d = ${(e/1000).toFixed(2)} kV/mm(击穿阈:空气 3 / 介质 20)<br>` +
    `<b>储能 E = ½CV² = ${(0.5*C*v*v*1e6).toFixed(2)} µJ</b>;电容快充快放,电池才是能量库`,
    `<b>C = ε₀·κ_eff·A/d = ${(C*1e12).toFixed(1)} pF</b> (κ_eff=${kEff().toFixed(2)}, A=${(aCM/100*aCM/100*1e4).toFixed(0)} cm², d=${dMM.toFixed(2)} mm)<br>` +
    `<b>τ_chg = R·C = ${(R_CHG*C*1e3).toFixed(2)} ms</b>, τ_dis = ${(R_DIS*C*1e3).toFixed(2)} ms (time slowed ×2000)<br>` +
    `<b>Q = C·V = ${(Q*1e9).toFixed(2)} nC</b>, E = V/d = ${(e/1000).toFixed(2)} kV/mm (air breaks at 3, slab 20)<br>` +
    `<b>Energy = ½CV² = ${(0.5*C*v*v*1e6).toFixed(2)} µJ</b>; caps trade speed for meagre storage`);
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){

  const dark=THEME==='dark';

  });

  buildSteps();setPlayLabel();updateStats();drawPlot();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0,accHist=0,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  simT+=dt0;
  const dtC=dt0*TAU_SCALE*speedMul;        // 电路时间(秒)
  if(playing){
    /* RC 电路 */
    const C=calcC();
    if(sw==='chg')Q+=((vBat-V())/R_CHG)*dtC;
    else if(sw==='dis')Q-=((V())/R_DIS)*dtC;
    if(Q<0)Q=0;
    /* 介质滑入滑出 */
    const prev=slabFrac;
    slabFrac+=(slabTgt-slabFrac)*Math.min(1,dt0*2.2);
    if(Math.abs(slabTgt-slabFrac)<0.005)slabFrac=slabTgt;
    if(prev!==slabFrac)updateGeom();
    /* 击穿判定 */
    const eb=slabFrac>0.7?20:3;
    if(Math.abs(V())/dMM/1000>eb&&vBat>0){
      if(sparkT<=0)notify('击穿!场强超介质耐受,火花导通','Breakdown! E exceeds dielectric strength — it sparks');
      sparkT=0.7;Q*=Math.exp(-dtC/1e-6);
    }
    if(sparkT>0){sparkT-=dt0;
      if(Q>1e-15&&sw!=='chg')Q*=Math.exp(-dtC/5e-6);
    }
    spark.visible=sparkT>0;
    if(spark.visible){
      const gap=dMM*0.42+0.12,pts=[];
      for(let i=0;i<=8;i++){
        const f=i/8;
        pts.push(v3(PLX+0.05+gap*f,plateCenY+(i===0||i===8?0:(Math.random()*2-1)*0.12),0));
      }
      sparkGeo.setFromPoints(pts);
      sparkLight.position.set(PLX+gap/2,plateCenY,0.5);
      sparkLight.intensity=sparkT*8;
    }else sparkLight.intensity=0;
    /* 自动演示:2 s 插介质,6.5 s 抽出(未被用户打断时) */
    autoDemo+=dt0;
    if(!userTouched){
      if(autoDemo>2&&slabTgt===0&&slabFrac<0.01){slabTgt=1;syncBtns();}
      if(autoDemo>6.5&&slabTgt===1){slabTgt=0;syncBtns();autoDemo=0;userTouched=true;}
    }
  }
  /* 灯泡与开关 */
  const v=V();
  bulbM.emissiveIntensity=clamp(v*v/(vBat*vBat+1)*1.6,0,1.6)*(sw==='dis'?1:0.15);
  bulbLight.intensity=clamp(v*v/(vBat*vBat+1)*3,0,3)*(sw==='dis'?1:0.1);
  swG.rotation.z=(sw==='off'?-0.7:0);
  batG.visible=sw!=='dis';
  /* 电场线长度 ∝ 场内 E */
  const eIn=Math.abs(v)/dMM/1000/kEff();   // 介质内 E=E0/κ_eff(kV/mm)
  const eRatio=clamp(0.2+0.8*eIn/3,0.15,1);
  fieldLines.forEach(ln=>{ln.scale.x=(dMM*0.42)*0.96*eRatio;ln.visible=Math.abs(v)>1;});
  /* 极化:偶极转向对齐电场 */
  const align=clamp(Math.abs(v)/400,0,1)*slabFrac;
  dipoles.forEach((d,i)=>{
    const target=(Math.abs(v)>2&&slabFrac>0.2)?0:(Math.sin(simT*0.4+i)*1.8);
    d.rotation.z+=(target-d.rotation.z)*Math.min(1,dt0*(0.4+align*5));
  });
  /* 极板电荷辉光 */
  plateM.emissiveIntensity=clamp(Q/(calcC()*vBat+1e-12),0,1)*0.9;
  plateM2.emissiveIntensity=clamp(Q/(calcC()*vBat+1e-12),0,1)*0.9;
  /* 曲线采样 */
  accHist+=dt0;
  if(accHist>0.05){accHist=0;pushHist();drawPlot();}
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  if(notifyT>0)notifyT-=dt0;
  for(const r of labelReg){
    const t=r.text();const on=labelsOn&&r.vis()&&t!=='';
    r.o.visible=on;if(on)r.o.element.textContent=t;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
sw='chg';                                   // 首屏:充电完成态,曲线有历史
{ /* 预演一次完整充电,填满历史缓冲 */
  const C=calcC();
  let q=0;
  for(let i=0;i<260;i++){q+=(vBat-q/C)/R_CHG*(R_CHG*C/60);hist.push(q/C);}
  Q=q;
}
updateGeom();syncBtns();
applyTheme();applyLang();setPlayLabel();
start();
</script>
