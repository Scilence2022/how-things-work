<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卷积神经网络 · 从像素到识别</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="卷积神经网络 · 从像素到识别" data-en="Convolutional Networks · From Pixels to Recognition">卷积神经网络 · 从像素到识别</h1>
  <div class="sub" data-zh="照片在计算机里只是像素矩阵:全连接把它拉平接 100 个神经元 = 78,400 个参数,而且换个位置就失灵→卷积换思路:一个 3×3 核只带 9 个权重扫过全图,权重共享+局部感受野,边缘在哪都认得出→响应图过 ReLU 截负 = 非线性,再 2×2 max 池化:特征图减半,平移容差 +1→层层堆叠:L1 看边缘、L2 认纹理与角、L3 拼部件、L4 成物体——猫视皮层的层级假说是它的原型→输出层给 0–9 置信度;训练不过是用反向传播+梯度下降把那些核学出来 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="An image is just a matrix of pixels: flatten it into 100 neurons and you need 78,400 parameters, and it breaks if the pattern shifts → convolution flips the idea: one 3×3 kernel with only 9 weights sweeps the whole image — weight sharing plus a local receptive field, edges recognized wherever they are → responses pass ReLU (clip negatives = nonlinearity), then 2×2 max pooling halves the map and buys +1 pixel of translation tolerance → stack the layers: L1 sees edges, L2 textures and corners, L3 parts, L4 objects — the cat-visual-cortex hierarchy is its prototype → the output layer scores 0–9 confidence; training is nothing more than backprop + gradient descent learning those kernels · 3D interactive demo · drag to orbit · Space = run/pause">卷积神经网络 · 从像素到识别</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="参数量(全连 : 卷积)" data-en="Params (FC : conv)">参数量(全连 : 卷积)</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="特征图尺寸" data-en="Feature map">特征图尺寸</span><span class="v" id="stSz">—</span>
  <span class="k" data-zh="激活 %(>0.05)" data-en="Active % (>0.05)">激活 %(>0.05)</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="当前层" data-en="Current layer">当前层</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="Top-1 置信度" data-en="Top-1 confidence">Top-1 置信度</span><span class="v" id="stC">—</span>
</div>

<div id="plot">
  <h3 data-zh="输出层 0–9 置信度:手工核只给一片模糊的响应;切到学习核链,正确数字一柱独起——特征决定识别力" data-en="Output layer 0–9 confidence: hand kernels give a mush of responses; switch to the learned chain and one bar rises — features decide recognition">输出层 0–9 置信度:手工核只给一片模糊的响应;切到学习核链,正确数字一柱独起——特征决定识别力</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="全连接:78,400 个参数,位置盲" data-en="fully connected: 78,400 params, position-blind">全连接:78,400 个参数,位置盲</span>
    <span class="chip.b" data-zh="3×3 核:9 个权重扫全图=权重共享" data-en="3×3 kernel: 9 weights over the whole image = shared">3×3 核:9 个权重扫全图=权重共享</span>
    <span class="chip.g" data-zh="特征图:卷积响应经 ReLU 截负" data-en="feature map: conv response clipped by ReLU">特征图:卷积响应经 ReLU 截负</span>
    <span class="chip.o" data-zh="max 池化:4 取 1,平移容差 +1" data-en="max pool: 4→1, +1 px translation tolerance">max 池化:4 取 1,平移容差 +1</span>
  </div>
  <div id="actions">
    <button class="abtn kn" data-k="0" data-zh="边缘V" data-en="Edge V">边缘V</button>
    <button class="abtn kn" data-k="1" data-zh="边缘H" data-en="Edge H">边缘H</button>
    <button class="abtn kn" data-k="2" data-zh="Sobel" data-en="Sobel">Sobel</button>
    <button class="abtn kn" data-k="3" data-zh="模糊" data-en="Blur">模糊</button>
    <button class="abtn kn" data-k="4" data-zh="锐化" data-en="Sharpen">锐化</button>
    <button class="abtn kn" data-k="5" data-zh="学习核链" data-en="Learned chain">学习核链</button>
    <button class="abtn" id="btnLayer" data-zh="逐层推进" data-en="Advance layer">逐层推进</button>
    <button class="abtn pn" data-p="0" data-zh="输入 0" data-en="Input 0">输入 0</button>
    <button class="abtn pn" data-p="1" data-zh="输入 7" data-en="Input 7">输入 7</button>
    <button class="abtn pn" data-p="2" data-zh="输入 X" data-en="Input X">输入 X</button>
    <button class="abtn pn" data-p="3" data-zh="输入 方波" data-en="Input square">输入 方波</button>
  </div>
  <div class="row"><label data-zh="扫描速度" data-en="Scan speed">扫描速度</label><input id="sSv" type="range" min="20" max="300" step="5" value="100"><span class="val" id="sSvVal">×1.0</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="置信度图" data-en="Confidence">置信度图</span></label>
      <label><input id="tglPool" type="checkbox" checked> <span data-zh="池化" data-en="Pooling">池化</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../neural-gradient/" data-zh="训练引擎:反向传播+梯度下降" data-en="the training engine: backprop + gradient descent">训练引擎:反向传播+梯度下降</a>
    <a href="../camera-sensor/" data-zh="像素的上游:传感器怎么成像" data-en="camera sensor: where pixels come from">像素的上游:传感器怎么成像</a>
    <a href="../fourier-series/" data-zh="卷积的频域亲戚" data-en="Fourier series: convolution's frequency cousin">卷积的频域亲戚</a>
    <a href="../information-entropy/" data-zh="下游编码:特征之后怎么压" data-en="information entropy: encoding after features">下游编码:特征之后怎么压</a>
    <a href="../sorting-race/" data-zh="算法同族:复杂度的竞赛" data-en="sorting race: algorithms of the same family">算法同族:复杂度的竞赛</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b1020, 20, 60);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0b1020 : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x0b1020 : 0xd9e2ea);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('卷积神经网络 · 从像素到识别', 'Convolutional Networks · From Pixels to Recognition');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, glFail = false;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (e) { glFail = true; }
if (glFail) {
  const err = document.createElement('div');
  err.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text2);font-size:14px;padding:24px;text-align:center;';
  err.textContent = L('WebGL 初始化失败:3D 视图已停用,面板、步骤与置信度图仍可用。', 'WebGL failed to start: 3D view disabled; panel, steps and confidence chart still work.');
  document.body.appendChild(err);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (!glFail) {
  try {
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  } catch (e) { /* 环境贴图失败不致命 */ }
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 140);
camera.position.set(2.5, 6.5, 13.5);
let controls = null;
if (!glFail) {
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0.8, 0, 0.3);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 2;
  controls.maxDistance = 55;
  controls.autoRotateSpeed = 0.3;
}

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x141a24, 0.6);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 0.9);

/* ================= 绘图:0–9 置信度 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 16, padB = 26, padT = 16;
  const bw = (W - padL - 12) / NB;
  ctx.font = '14px system-ui';
  for (let d = 0; d < NB; d++) {
    const x = padL + d * bw + bw * 0.12, w = bw * 0.76;
    const h = clamp(dispConf[d], 0, 1) * (H - padB - padT);
    ctx.fillStyle = d === top1 ? '#4dabf7' : dispConf[d] > 0.12 ? '#3b6a94' : 'rgba(120,140,165,.4)';
    ctx.fillRect(x, H - padB - h, w, h);
    ctx.fillStyle = cTxt;
    ctx.fillText(String(d), x + w / 2 - 5, H - 8);
    if (d === top1 && dispConf[d] > 0.02) {
      ctx.fillStyle = '#4dabf7';
      ctx.fillText((dispConf[d] * 100).toFixed(0) + '%', x + w / 2 - 16, H - padB - h - 6);
    }
  }
  ctx.strokeStyle = 'rgba(128,150,170,.3)';
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - 10, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText(L(`输入:${L(PATTERNS[pIdx].zh, PATTERNS[pIdx].en)} · ${KERNELS[kIdx].learn ? L('学习核链', 'learned chain') : L('手工核 ' + KERNELS[kIdx].zh, 'manual ' + KERNELS[kIdx].en)}`, `input: ${L(PATTERNS[pIdx].zh, PATTERNS[pIdx].en)} · ${KERNELS[kIdx].learn ? 'learned chain' : 'manual ' + KERNELS[kIdx].en}`), padL + 4, 13);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSv = document.getElementById('sSv'), elSvVal = document.getElementById('sSvVal');
const stP = document.getElementById('stP'), stSz = document.getElementById('stSz'), stA = document.getElementById('stA'),
  stL = document.getElementById('stL'), stC = document.getElementById('stC');
const formulaEl = document.getElementById('formula');
const btnLayer = document.getElementById('btnLayer');
const knBtns = [...document.querySelectorAll('.kn')], pnBtns = [...document.querySelectorAll('.pn')];
const LAY_ZH = ['L1 边缘', 'L2 纹理', 'L3 部件', 'L4 物体'], LAY_EN = ['L1 edges', 'L2 textures', 'L3 parts', 'L4 object'];
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elSv.value = Math.round(sv * 100); elSvVal.textContent = '×' + sv.toFixed(1);
}
function syncBtns() {
  knBtns.forEach(b => b.classList.toggle('on', +b.dataset.k === kIdx));
  pnBtns.forEach(b => b.classList.toggle('on', +b.dataset.p === pIdx));
  document.getElementById('tglPool').checked = poolOn;
}
function updateStats() {
  const K = KERNELS[kIdx];
  const pc = K.learn ? 72 : 9;
  stP.textContent = '78,400 : ' + pc;
  stP.className = 'v ' + (K.learn ? 'ok' : 'warn');
  stSz.textContent = K.learn ? '16→8→4→2→1' : (poolOn ? '16×16 → 8×8' : '16×16');
  stSz.className = 'v';
  stA.textContent = actPct.toFixed(0) + ' %';
  stA.className = 'v ' + (actPct > 3 && actPct < 60 ? 'ok' : 'warn');
  stL.textContent = K.learn ? L(LAY_ZH[stage], LAY_EN[stage]) : (!poolOn ? L('卷积', 'conv') : scanT < PH_A ? L('卷积扫描', 'conv scan') : scanT < PH_B ? L('max 池化', 'max pool') : L('就绪', 'done'));
  stC.textContent = `${top1} · ${(confT[top1] * 100).toFixed(0)}%`;
  stC.className = 'v ' + (KERNELS[kIdx].learn && confT[top1] > 0.5 ? 'ok' : confT[top1] > 0.3 ? 'warn' : 'bad');
}
function updateFormula() {
  const K = KERNELS[kIdx];
  formulaEl.innerHTML = L(
    `<b>全连接:28×28 = 784 输入 × 100 神经元 = 78,400 参数</b>,换个位置就失灵<br>` +
    `<b>卷积:3×3 核 = 9 参数扫全图</b>:权重共享+局部感受野,位置无关<br>` +
    `<b>ReLU 截负 = 非线性;max 池化 2×2 取 1</b>:特征图减半,平移容差 +1<br>` +
    `<b>层级:L1 边缘 → L2 纹理/角 → L3 部件 → L4 物体</b>(猫视皮层层级假说);训练 = 反向传播学权重<br>` +
    `<b>当前:${K.learn ? L('学习核链', 'learned chain') : L('手工核', 'manual kernel') + ' ' + L(K.zh, K.en)} · Top-1 = ${top1}(${(confT[top1] * 100).toFixed(0)}%)</b>`,
    `<b>Fully connected: 28×28 = 784 inputs × 100 neurons = 78,400 params</b>, broken by any shift<br>` +
    `<b>Convolution: 3×3 kernel = 9 params over the whole image</b>: weight sharing + local receptive fields<br>` +
    `<b>ReLU clips negatives = nonlinearity; 2×2 max pool</b>: map halves, +1 px translation tolerance<br>` +
    `<b>Hierarchy: L1 edges → L2 textures/corners → L3 parts → L4 object</b> (cat-cortex hypothesis); training = backprop<br>` +
    `<b>Now: ${K.learn ? 'learned chain' : 'manual ' + K.en} · Top-1 = ${top1} (${(confT[top1] * 100).toFixed(0)}%)</b>`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
knBtns.forEach(b => b.addEventListener('click', () => {
  kIdx = +b.dataset.k;
  if (kIdx === 5) { stage = 0; stageT = 0; }
  paintKern();
  computeAll(); syncAll();
}));
pnBtns.forEach(b => b.addEventListener('click', () => { pIdx = +b.dataset.p; scanT = 0; poolT = 0; computeAll(); syncAll(); }));
btnLayer.addEventListener('click', () => {
  if (KERNELS[kIdx].learn) { stageT = (Math.floor(stageT / 3) + 1) * 3; stage = Math.floor(stageT / 3) % 4; }
  else { scanT = 0; poolT = 0; }
  updateStats(); updateFormula();
});
elSv.addEventListener('input', () => { sv = +elSv.value / 100; syncSliders(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglPool').addEventListener('change', e => { poolOn = e.target.checked; computeAll(); syncAll(); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
if (controls) controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
let scanT = 5.2, poolT = 63, stageT = 0;
const PH_A = 4.16, PH_B = 5.2, PH_C = 6.0;
if (controls) controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * sv * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    scanT += dt;
    if (scanT > PH_C) scanT = 0;
    if (KERNELS[kIdx].learn) {
      stageT += dt;
      if (stageT > 12) stageT = 0;
      stage = Math.floor(stageT / 3) % 4;
    }
    poolT = scanT < PH_A ? -1 : Math.min(63, Math.floor((scanT - PH_A) / (PH_B - PH_A) * 64));
  }
  const manual = !KERNELS[kIdx].learn;
  const scanIdx = manual ? (scanT < PH_A ? Math.floor(scanT / PH_A * 256) : 255) : 255;
  /* 输入平面恒亮 */
  paintIn();
  /* 卷积特征平面(手动模式逐格显现) */
  if (manual) {
    paintGrid(gFeat, featN, 1, scanIdx);
    gFeat.m.visible = true;
  } else {
    /* 学习模式:feat 平面显示 L1 密集边缘图 */
    const dimNow = stage === 0 ? 1 : 0.25;
    paintGrid(gFeat, chain.l1d, dimNow, null);
  }
  /* 池化平面 */
  gPool.m.visible = manual && poolOn;
  if (manual && poolOn) paintGrid(gPool, pooled, 1, poolT);
  /* 学习链平面 */
  const learnVis = !!chain;
  gL2.m.visible = gL3.m.visible = gL4.m.visible = learnVis;
  if (learnVis) {
    paintGrid(gL2, chain.l2p, stage === 1 ? 1 : stage < 1 ? 0.25 : 0.55);
    paintGrid(gL3, chain.l3p, stage === 2 ? 1 : stage < 2 ? 0.25 : 0.55);
    paintGrid(gL4, chain.l4p, stage === 3 ? 1 : 0.3);
  }
  /* 核块位置 */
  const bob = Math.sin(performance.now() / 700) * 0.08;
  if (manual) {
    const px = scanIdx % N, py = Math.floor(scanIdx / N);
    kernGrp.position.set(-5.6, gIn.half - py * gIn.sp + 0.55 + bob, gIn.half - px * gIn.sp);
  } else {
    const kx = [-2.8, 0.2, 2.9, 5.0][Math.min(stage, 3)];
    kernGrp.position.set(kx, 1.1 + bob, 0);
  }
  kernGrp.visible = true;
  /* 输出柱动画 */
  for (let d = 0; d < NB; d++) dispConf[d] += (confT[d] - dispConf[d]) * Math.min(1, dt0 * 6);
  for (let d = 0; d < NB; d++) {
    const h = 0.22 + dispConf[d] * 2.7;
    _V.set(BAR_X, h / 2, (NB - 1) * BAR_SP / 2 - d * BAR_SP);
    _M4.compose(_V, _Q.identity(), _S.set(0.4, h, 0.4));
    bars.setMatrixAt(d, _M4);
    bars.setColorAt(d, d === top1 ? _C.setRGB(0.3, 0.67, 0.97) : _C.setRGB(0.28, 0.36, 0.45));
  }
  bars.instanceMatrix.needsUpdate = true;
  bars.instanceColor.needsUpdate = true;
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    if (controls) controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.066) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  if (controls) controls.update();
  if (!glFail) {
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
computeAll();
paintKern();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
</html>
