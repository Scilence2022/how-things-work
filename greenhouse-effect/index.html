<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温室效应 · 短波进,长波出不去</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,120,80,.9); color: #ffc9b2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.s { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.l { color: #ffb3b3; border-color: rgba(255,143,143,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(99,230,190,.2); border-color: rgba(99,230,190,.6); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="温室效应:短波进,长波出不去" data-en="The Greenhouse Effect: shortwave in, longwave trapped">温室效应：短波进，长波出不去</h1>
  <div class="sub" data-zh="阳光短波畅通入射 → 地表变热发长波红外 → CO₂/CH₄ 截胡再向下回辐射——同一太阳,金星 464°C、火星 −63°C · 空格播放/暂停" data-en="Sunlight streams in as shortwave → the surface reradiates infrared → CO₂/CH₄ catch it and beam it back down — same sun, Venus 464°C, Mars −63°C · Space = play/pause">阳光短波畅通入射 → 地表变热发长波红外 → CO₂/CH₄ 截胡再向下回辐射——同一太阳，金星 464°C、火星 −63°C · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="聚焦行星" data-en="focused planet">聚焦行星</span><span class="v" id="stPl" style="font-size:14px">—</span>
  <span class="k" data-zh="无温室温(黑体)" data-en="no-GH (blackbody)">无温室温(黑体)</span><span class="v" id="stNo">—</span>
  <span class="k" data-zh="实际表面温" data-en="actual surface">实际表面温</span><span class="v g" id="stYes">—</span>
  <span class="k" data-zh="长波逃逸率" data-en="IR escaping">长波逃逸率</span><span class="v" id="stEsc">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.s" data-zh="短波(可见光,畅通)" data-en="shortwave (visible, passes)">短波(可见光,畅通)</span>
    <span class="chip.l" data-zh="长波红外(被温室气体截胡)" data-en="longwave IR (caught by GHGs)">长波红外(被温室气体截胡)</span>
  </div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div class="row"><label data-zh="聚焦行星" data-en="planet">聚焦行星</label><input id="planet" type="range" min="0" max="2" step="1" value="1"><span class="val" id="planetVal">地球</span></div>
  <div class="row"><label data-zh="温室气体倍数" data-en="GHG multiplier">温室气体倍数</label><input id="gh" type="range" min="0" max="200" step="1" value="100"><span class="val" id="ghVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../atomic-structure/" data-zh="分子为何挑波长:能级" data-en="why molecules pick wavelengths">分子为何挑波长:能级</a>
    <a href="../em-wave/" data-zh="短波与长波的本体" data-en="what short/long waves are">短波与长波的本体</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x0a0e14);
  starMat.opacity = THEME === 'dark' ? 0.7 : 0;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('温室效应', 'The Greenhouse Effect');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  setPlanet(planetIdx);
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.2, 1.6, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(5, 4, 6);
scene.add(key);

/* 星空 */
const starMat = new THREE.PointsMaterial({ color: 0x9fb0c3, size: 0.05, transparent: true, opacity: 0.7 });
{
  const g = new THREE.BufferGeometry();
  const N = 400, arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, r = 12 + Math.random() * 20;
    arr[i * 3] = Math.cos(a) * r; arr[i * 3 + 1] = (Math.random() - 0.3) * 20; arr[i * 3 + 2] = Math.sin(a) * r;
  }
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  scene.add(new THREE.Points(g, starMat));
}

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  sun: new THREE.MeshBasicMaterial({ color: 0xffd166 }),
  venus: mat(0xe8c47a, { opacity: 1 }),
  earth: mat(0x4d8ac0, { opacity: 1 }),
  mars: mat(0xc1663d, { opacity: 1 }),
  atmo: (c, o) => new THREE.MeshPhysicalMaterial({ color: c, transparent: true, opacity: o,
    roughness: 0.3, side: THREE.DoubleSide, depthWrite: false }),
  sw: new THREE.MeshBasicMaterial({ color: 0xfff3bf, blending: THREE.AdditiveBlending, transparent: true }),
  lw: new THREE.MeshBasicMaterial({ color: 0xff6b6b, blending: THREE.AdditiveBlending, transparent: true }),
};

/* 太阳 */
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 18), M.sun);
sun.position.set(-4.6, 1.4, 0);
scene.add(sun);
const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 18),
  new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending }));
sunGlow.position.copy(sun.position);
scene.add(sunGlow);

/* ================= 三行星 ================= */
const PLANETS = [
  { zh: '金星', en: 'Venus', color: 0xe8c47a, gh0: 6.5, tNo: -41, tYes: 464, atmoC: 0xe8d9a8, atmoO: 0.5,
    note: L('CO₂ 92 bar 超浓:失控温室的终点站', '92 bar of CO₂: runaway greenhouse, final stop') },
  { zh: '地球', en: 'Earth', color: 0x4d8ac0, gh0: 1.0, tNo: -18, tYes: 15, atmoC: 0x9ac8f0, atmoO: 0.32,
    note: L('恰到好处:33°C 的温柔加成,液态水得以常存', 'just right: a gentle +33°C keeps water liquid') },
  { zh: '火星', en: 'Mars', color: 0xc1663d, gh0: 0.02, tNo: -63, tYes: -60, atmoC: 0xd8a080, atmoO: 0.12,
    note: L('大气只剩 0.006 bar:几乎没有温室,冷得干脆', 'only 0.006 bar of air: barely any greenhouse, honestly cold') },
];
let planetIdx = clamp(Math.round(qsFloat('p', 1)), 0, 2);
const glMat = { Venus: M.venus, Earth: M.earth, Mars: M.mars };
const glEn = { Venus: 'Venus', Earth: 'Earth', Mars: 'Mars' };
const planets = PLANETS.map((p, i) => {
  const g = new THREE.Group();
  g.position.set(0, 0.8, (i - 1) * 2.6);
  const globe = new THREE.Mesh(new THREE.SphereGeometry(0.72, 36, 28), mat(p.color, { opacity: 1 }));
  g.add(globe);
  const atmo = new THREE.Mesh(new THREE.SphereGeometry(0.92, 36, 28), M.atmo(p.atmoC, p.atmoO));
  g.add(atmo);
  scene.add(g);
  /* 温度标签 */
  const div = document.createElement('div');
  div.className = 'lbl st';
  const lb = new CSS2DObject(div);
  lb.position.set(0, 1.5, 0);
  g.add(lb);
  return { g, globe, atmo, div, p, i };
});

/* 光子 */
const photons = [];   // {mesh, kind:'sw'|'lw', t, from, to, planet, fate}
function spawnPhoton(planetG, kind) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), kind === 'sw' ? M.sw : M.lw);
  const pa = planets[planetIdx];
  if (kind === 'sw') {
    m.position.set(sun.position.x + 0.6, pa.g.position.y + (Math.random() - 0.5) * 0.8, pa.g.position.z + (Math.random() - 0.5) * 1.2);
    scene.add(m);
    photons.push({ mesh: m, kind, t: 0, target: planetIdx, stage: 0 });
  } else {
    m.position.set(pa.g.position.x + (Math.random() - 0.5) * 0.7, pa.g.position.y - 0.55, pa.g.position.z + (Math.random() - 0.5) * 0.7);
    scene.add(m);
    photons.push({ mesh: m, kind, t: 0, target: planetIdx, stage: 1 });
  }
}

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let tSim = 0;
let ghMul = 1;
let escFrac = 0.5;
function ghOf(p) { return clamp(p.gh0 * ghMul, 0, 12); }
function escOf(p) { return clamp(1 / (1 + ghOf(p) * 0.9), 0.05, 1); }
function tSurfOf(p) {
  const esc = escOf(p);
  return Math.round(p.tNo + (p.tYes - p.tNo) * (1 - esc) / (1 - 1 / (1 + p.gh0 * 0.9)) * 0.999);
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblMech = addLabel(() => L('关键不对称:大气对短波(可见光)几乎透明,对地表发的长波红外却处处设卡', 
  'the key asymmetry: air is nearly transparent to shortwave, but blocks longwave IR from the surface'),
  new THREE.Vector3(0, 3.3, 0), 'st');
const lblPlanet = addLabel(() => PLANETS[planetIdx].note, new THREE.Vector3(0, -1.35, 0), 'g');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '短波畅通入射', be: 'Shortwave streams in',
    d: '太阳 5500°C,辐射集中在可见光与近红外——大气(N₂/O₂)对它们几乎透明,阳光直达地表。',
    de: 'The sun at 5500°C radiates visible and near-IR; the air (N₂/O₂) barely touches them — sunlight lands on the ground.',
    act: () => {} },
  { b: '地表变热,发长波', be: 'The surface warms and reradiates',
    d: '地表只有 ~15°C,按维恩位移只能发 10 µm 左右的长波红外——正好撞进 CO₂/H₂O 的吸收带。',
    de: 'A ~15°C surface reradiates ~10 µm infrared — straight into the absorption bands of CO₂ and H₂O.',
    act: () => {} },
  { b: '截胡与回辐射', be: 'Caught and beamed back',
    d: '温室气体吸收长波后向四面八方再辐射——一半向上逃走,一半向下回给地表。地表收到「太阳+毯子」双份供暖。',
    de: 'GHGs re-emit in all directions: half escapes up, half comes back down. The surface gets sun plus blanket.',
    act: () => {} },
  { b: '三星同日不同温', be: 'One sun, three temperatures',
    d: '金星 CO₂ 92 bar → +482°C 加成;地球刚好 +33°C;火星大气稀薄 → 几乎白给。同一太阳,大气的答案不同。',
    de: 'Venus: +482°C bonus; Earth: a comfortable +33°C; Mars: nearly nothing. Same sun, different answers from the air.',
    act: () => {} },
  { b: '加浓一档试试', be: 'Turn up the blanket',
    d: '拖「温室气体倍数」:毯子变厚,逃逸率下降,平衡温度上移——这就是人类正在对地球做的事(不是造热,是减散热)。',
    de: 'Drag the GHG multiplier: thicker blanket, less escape, higher equilibrium — exactly what we are doing to Earth (not adding heat, blocking cooling).',
    act: () => { const g = document.getElementById('gh'); g.value = 200; g.dispatchEvent(new Event('input')); } },
];
function stepIndex() {
  if (ghMul > 1.5) return 4;
  if (planetIdx === 0 || planetIdx === 2) return 3;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setPlanet(i) {
  PLANETS.forEach((p, k) => {
    planets[k].g.position.z = (k === i ? 0 : (k < i ? -1 : 1) * 2.4);
    planets[k].g.position.x = k === i ? 0 : (k < i ? -1.6 : 1.6);
    planets[k].atmo.material.opacity = k === i ? p.atmoO : p.atmoO * 0.4;
    planets[k].div.textContent = `${L(p.zh, glEn[p.zh])} ${k === i ? '◄' : ''}`;
    planets[k].div.style.opacity = k === i ? '1' : '0.55';
  });
  const p = PLANETS[i];
  document.getElementById('stPl').textContent = L(p.zh, glEn[p.zh]);
  document.getElementById('stNo').innerHTML = p.tNo + '<small>°C</small>';
  const ts = tSurfOf(p);
  document.getElementById('stYes').innerHTML = ts + '<small>°C</small>';
  escFrac = escOf(p);
  document.getElementById('stEsc').innerHTML = (escFrac * 100).toFixed(0) + '<small>% 逃逸</small>';
  document.getElementById('planetVal').textContent = L(p.zh, glEn[p.zh]);
}
document.getElementById('planet').addEventListener('input', e => {
  planetIdx = clamp(parseInt(e.target.value), 0, 2);
  setPlanet(planetIdx);
});
document.getElementById('gh').addEventListener('input', e => {
  ghMul = parseInt(e.target.value) / 100;
  document.getElementById('ghVal').textContent = ghMul.toFixed(1) + '×';
  setPlanet(planetIdx);
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let phCD = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  const pa = planets[planetIdx];
  planets.forEach(p => { p.globe.rotation.y += dts * 0.2; });
  /* 地表发光温度可视化 */
  const heat = clamp((tSurfOf(pa.p) - pa.p.tNo) / Math.max(1, pa.p.tYes - pa.p.tNo), 0, 1.4);
  pa.globe.material.emissiveIntensity = 0.05 + heat * 0.3;

  /* 光子生成 */
  phCD -= dts;
  if (phCD <= 0 && photons.length < 60) {
    phCD = 0.1;
    spawnPhoton(pa.g, 'sw');
    spawnPhoton(pa.g, 'lw');
  }
  for (let i = photons.length - 1; i >= 0; i--) {
    const ph = photons[i];
    ph.t += dts * 1.1;
    const g = planets[ph.target].g;
    if (ph.kind === 'sw') {
      /* 短波:直线打向行星 */
      ph.mesh.position.lerp(new THREE.Vector3(g.position.x, g.position.y, g.position.z), clamp(dts * 1.6, 0, 1));
      if (ph.mesh.position.distanceTo(g.position) < 0.78) {
        scene.remove(ph.mesh);
        photons.splice(i, 1);
      }
    } else {
      /* 长波:升到大气层,按逃逸率决定走或回落 */
      const r = Math.hypot(ph.mesh.position.x - g.position.x, ph.mesh.position.y - g.position.y);
      if (ph.stage === 1 && r > 0.92) {
        if (Math.random() < escFrac) ph.stage = 2;
        else { ph.stage = 3; ph.back = g.position.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.6, -0.5, (Math.random() - 0.5) * 0.6)); }
      }
      if (ph.stage === 1 || ph.stage === 2) ph.mesh.position.y += dts * 1.0;
      else if (ph.stage === 3) {
        ph.mesh.position.lerp(ph.back, clamp(dts * 1.4, 0, 1));
        if (ph.mesh.position.distanceTo(ph.back) < 0.1) { scene.remove(ph.mesh); photons.splice(i, 1); continue; }
      }
      if (ph.stage === 2 && ph.mesh.position.y > g.position.y + 4) { scene.remove(ph.mesh); photons.splice(i, 1); }
    }
  }

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setPlanet(planetIdx);
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
