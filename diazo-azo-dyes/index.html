<style>

    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}

  @media(max-width:1150px){#plot{display:none}#stats{bottom:18px}}

  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 重氮化-偶氮偶联演示（化学关系真实）
   ① Ar-NH₂ + NaNO₂/HCl（0–5 °C）→ Ar-N₂⁺（重氮盐；>5 °C 分解放 N₂ 报废）
   ② Ar-N₂⁺ 作亲电试剂 + 活化芳环（酚/芳胺对位）→ Ar-N=N-Ar'
   ③ 偶氮基把两段 π 系统连成更长共轭链：HOMO-LUMO 间隙 ΔE=hc/λ 收窄，
      λmax 按各组分的实测数量级取值（435/375/480 nm，酸性质子化再红移），
      表观颜色 = 吸收色的补色；pH 改变给电子基能力 → 指示剂变色。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const TAU=Math.PI*2;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(-0.75,0.6,8.2);   // 相机左移：避免左侧标签（Ar-NH₂ 苯胺等）被控制面板切掉
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.75,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=25;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.75));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(4,6,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.35);fill.position.set(-5,3,-5);scene.add(fill);

/* ---- 分子搭建 ---- */
const mBond=new THREE.MeshStandardMaterial({color:0x9aa3ad,roughness:0.4,metalness:0.3});
const EL={C:{c:0x3a3f46,r:0.17},H:{c:0xf1f3f5,r:0.09},N:{c:0x4d78c9,r:0.18},O:{c:0xe8590c,r:0.16}};
const atomGeo={},atomMat={};
for(const k in EL){
  atomGeo[k]=new THREE.SphereGeometry(EL[k].r,14,12);
  atomMat[k]=new THREE.MeshStandardMaterial({color:EL[k].c,roughness:0.35,metalness:0.25});
}
function bond(a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.042,0.042,len,8),mBond);
  m.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,0);
  m.rotation.z=Math.atan2(dy,dx)-Math.PI/2;
  return m;
}
function makeMol(atoms,bonds){
  const g=new THREE.Group();
  bonds.forEach(([i,j])=>g.add(bond(atoms[i],atoms[j])));
  atoms.forEach(([el,x,y])=>{
    const s=new THREE.Mesh(atomGeo[el],atomMat[el]);
    s.position.set(x,y,0);g.add(s);
  });
  return g;
}
/* 苯环：6C + 6H，顶点角 90°+k·60°（保证有正上/正下顶点便于接取代基） */
function benzene(cx,cy){
  const a=[],b=[],idx=[];
  for(let k=0;k<6;k++){
    const g=Math.PI/2+k*TAU/6;
    idx.push(a.length);
    a.push(['C',cx+0.55*Math.cos(g),cy+0.55*Math.sin(g)]);
    a.push(['H',cx+0.88*Math.cos(g),cy+0.88*Math.sin(g)]);
  }
  for(let k=0;k<6;k++){b.push([idx[k],idx[k]+1]);b.push([idx[k],idx[(k+1)%6]]);}
  return {a,b,idx};
}
const RINGY=-1.15;                       // 主环(被重氮化的芳胺)世界纵坐标
function buildAniline(){
  const {a,b,idx}=benzene(0,RINGY);
  const n=a.length;
  a.push(['N',0,RINGY-0.93],['H',-0.19,RINGY-1.12],['H',0.19,RINGY-1.12]);
  b.push([idx[3],n],[n,n+1],[n,n+2]);   // 底顶点接氨基
  return makeMol(a,b);
}
function buildDiazo(){
  const {a,b,idx}=benzene(0,RINGY);
  const n=a.length;
  a.push(['N',0,RINGY-0.93],['N',0,RINGY-1.36]);
  b.push([idx[3],n],[n,n+1]);
  return makeMol(a,b);
}
/* 偶联组分：局部坐标（环心在原点，给电子基在正上方） */
function buildComp(ci){
  if(ci===2){                            // 2-萘酚：两环稠合
    const r1=benzene(0,0),r2=benzene(0.9526,0);
    const a=[...r1.a,...r2.a],b=[...r1.b,...r2.b.map(p=>[p[0]+12,p[1]+12])];
    const n=a.length;
    a.push(['O',0.9526,0.93],['H',1.17,1.13]);
    b.push([12,n],[n,n+1]);
    return makeMol(a,b);
  }
  const {a,b,idx}=benzene(0,0);
  const n=a.length;
  if(ci===0){                            // N,N-二甲基苯胺
    a.push(['N',0,0.93],['C',0.39,1.13],['C',-0.39,1.13]);
    b.push([idx[0],n],[n,n+1],[n,n+2]);
  }else{                                 // 苯酚
    a.push(['O',0,0.93],['H',0.22,1.14]);
    b.push([idx[0],n],[n,n+1]);
  }
  return makeMol(a,b);
}
/* 产物：Ar-N=N-Ar′，局部坐标 ring1 在原点，ring2 在上方，给电子基在最上 */
function buildProduct(ci){
  const {a,b,idx}=benzene(0,0);
  const n=a.length;
  a.push(['N',0,0.93],['N',0,1.36]);
  b.push([idx[0],n],[n,n+1]);           // 顶顶点接 N=N
  const y2=2.28;
  let off;
  if(ci===2){                            // 产物 = 苯基偶氮-2-萘酚
    const r2=benzene(0,y2),r2b=benzene(0.9526,y2);
    off=a.length;
    a.push(...r2.a,...r2b.a);
    b.push(...r2.b,...r2b.b.map(p=>[p[0]+12,p[1]+12]));
    b.push([n,off+3]);                  // N2 接萘环底顶点
    const m=a.length;
    a.push(['O',0.9526,y2+0.93],['H',1.17,y2+1.13]);
    b.push([off+12,m],[m,m+1]);
  }else{
    const r2=benzene(0,y2);
    off=a.length;
    a.push(...r2.a);b.push(...r2.b.map(p=>[p[0]+off,p[1]+off]));
    b.push([n,off+3]);
    const m=a.length;
    if(ci===0){
      a.push(['N',0,y2+0.93],['C',0.39,y2+1.13],['C',-0.39,y2+1.13]);
      b.push([off+4,m],[m,m+1],[m,m+2]);
    }else{
      a.push(['O',0,y2+0.93],['H',0.22,y2+1.14]);
      b.push([off+4,m],[m,m+1]);
    }
  }
  return makeMol(a,b);
}

/* ---- 场景对象 ---- */
const gAniline=buildAniline(),gDiazo=buildDiazo();
let compIdx=0;

gAniline.position.set(0,0,0);

/* 溶液平台（颜色=当前表观色） */

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn,parent){
  const div=document.createElement('div');div.className='lbl '+(cls||'');
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||scene).add(o);

addLabel(()=>L('Ar-NH₂ 苯胺','Ar-NH2 aniline'),new THREE.Vector3(-1.9,RINGY-0.6,0),'b',()=>phase===0);
addLabel(()=>L('Ar-N₂⁺ 重氮盐（0–5 °C 保存！）','Ar-N2+ diazonium (keep 0–5 °C!)'),new THREE.Vector3(-2.2,RINGY-0.9,0),'r',()=>phase>=1&&phase<=3);
addLabel(()=>L('NaNO₂ + HCl，冰浴 0–5 °C','NaNO2 + HCl, ice bath 0–5 °C'),new THREE.Vector3(0,-3.15,0),'o',()=>phase===0);
addLabel(()=>L('活化芳环（富电子对位）','Activated ring (electron-rich para)'),new THREE.Vector3(3.5,RINGY+2.7,0),'g',()=>phase===2||phase===3);
addLabel(()=>L('Ar-N=N-Ar′ 偶氮染料','Ar-N=N-Ar′ azo dye'),new THREE.Vector3(2.6,RINGY+1.4,0),'p',()=>phase>=4);
addLabel(()=>L('共轭链越长 → HOMO-LUMO 间隙越小 → 吸收越红移','longer conjugation → smaller gap → redder absorption'),new THREE.Vector3(0,-2.05,0),'b');

/* ---- 颜色物理 ---- */
function wl2rgb(w){
  w=clamp(w,380,700);
  let r=0,g=0,b=0,att=1;
  if(w<440){r=(440-w)/60;g=0;b=1;}
  else if(w<490){r=0;g=(w-440)/50;b=1;}
  else if(w<510){r=0;g=1;b=(510-w)/20;}
  else if(w<580){r=(w-510)/70;g=1;b=0;}
  else if(w<645){r=1;g=(645-w)/65;b=0;}
  else{r=1;g=0;b=0;}
  if(w<420)att=0.5+0.5*(w-380)/40;
  if(w>645)att=0.6+0.4*(700-w)/55;
  const f=v=>Math.round(255*Math.pow(clamp(v,0,1)*att,0.8));
  return [f(r),f(g),f(b)];
}
function compColor(lam){                 // 表观色 = 补色（向白掺一点更像染料）
  const [r,g,b]=wl2rgb(lam);
  const m=v=>Math.round(v*0.72+255*0.28);
  return [m(255-r),m(255-g),m(255-b)];
}
const COMPS=[
  {zh:'N,N-二甲基苯胺',en:'N,N-dimethylaniline',base:435,shift:75},
  {zh:'苯酚',en:'phenol',base:375,shift:30},
  {zh:'2-萘酚',en:'2-naphthol',base:480,shift:25},
];
let lambdaVis=285;                        // 当前显示的 λmax
function targetLambda(){
  const c=COMPS[compIdx];
  const acid=1/(1+Math.exp((pH-3.8)*2.2)); // 酸性质子化 → 红移
  return c.base+c.shift*acid;
}

/* ---- 状态 ---- */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let Tc=0,pH=7,phase=0,phaseT=0,decT=0,simT=0,flashT=0;
const STEPS=[
 {zh:'芳胺 + NaNO₂/HCl，冰浴 0–5 °C 重氮化 → Ar-N₂⁺',en:'Ar-NH2 + NaNO2/HCl at 0–5 °C → diazonium salt Ar-N2+'},
 {zh:'温度红线：>5 °C 重氮盐分解放出 N₂，当场报废（拖温度滑块试试）',en:'Above 5 °C the diazonium decomposes, bubbling off N2 — try the slider'},
 {zh:'重氮盐是缺电子亲电试剂，进攻活化芳环（酚/芳胺）的富电子对位',en:'The diazonium is an electrophile attacking the electron-rich para position'},
 {zh:'偶联成 Ar-N=N-Ar′：两截共轭系统被 -N=N- 桥接成一条长链',en:'Coupling gives Ar-N=N-Ar′: the bridge joins two π systems into one long chain'},
 {zh:'共轭变长 → HOMO-LUMO 间隙收窄 → 吸收右移进可见光 → 补色当场出现',en:'Longer conjugation narrows HOMO-LUMO gap; absorption enters visible; complement appears'},
 {zh:'pH 改变推电子基能力 → 指示剂变色（甲基橙红↔黄）；刚果红、苏丹红同族',en:'pH tunes donor strength → indicator color (methyl orange red↔yellow); Congo red, Sudan dyes'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>setPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function resetReaction(){
  phase=0;phaseT=0;decT=0;
  gAniline.visible=true;gDiazo.visible=false;gProduct.visible=false;gComp.visible=false;
  gDiazo.scale.setScalar(1);
  lambdaVis=285;
  activeStep=0;syncSteps();
}
function setPhase(i){
  if(i===0){resetReaction();}
  else{
    if(phase===0){gAniline.visible=false;gDiazo.visible=true;}
    phase=i;phaseT=0;decT=0;
    if(i>=2&&!gDiazo.visible)gDiazo.visible=true;
    if(i===2){gProduct.visible=false;gComp.visible=true;gComp.position.set(4.3,RINGY+1.4,0);}
    if(i===3){gComp.visible=true;gComp.position.set(2.3,RINGY+1.4,0);gProduct.visible=false;}
    if(i>=4){gProduct.visible=true;gComp.visible=false;gDiazo.visible=false;}
  }
  playing=true;setPlayLabel();syncSteps();
}
function flash(msg){
  flashEl.textContent=msg;flashEl.style.opacity=1;flashT=2.2;
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();setPlayLabel();
  document.getElementById('c0').classList.toggle('on',compIdx===0);
  document.getElementById('c1').classList.toggle('on',compIdx===1);
  document.getElementById('c2').classList.toggle('on',compIdx===2);
}
function setPlayLabel(){
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
}

/* ---- 吸收谱图 ---- */
const plotCv=document.getElementById('plotCv');
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const t2=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const L0=300,L1=720;
  const xOf=l=>(l-L0)/(L1-L0)*W;
  const yOf=a=>H-24-a*(H-40);
  /* 可见光区底色（轴线下的窄条） */
  for(let l=L0;l<L1;l+=4){
    const [r,g,b]=wl2rgb(l);
    ctx.fillStyle=`rgba(${r},${g},${b},0.25)`;
    ctx.fillRect(xOf(l),yOf(0)+2,xOf(l+4)-xOf(l)+1,5);
  }
  ctx.strokeStyle='rgba(128,150,170,.3)';
  ctx.beginPath();ctx.moveTo(0,yOf(0));ctx.lineTo(W,yOf(0));ctx.stroke();
  ctx.fillStyle=t2;ctx.font='13px system-ui';
  ctx.fillText('300',xOf(300)-8,yOf(0)+16);ctx.fillText('500',xOf(500)-8,yOf(0)+16);
  ctx.fillText('700 nm',xOf(700)-34,yOf(0)+16);
  ctx.fillText(L('可见光','visible'),xOf(400),yOf(0)+16);
  const gauss=(lam,c,wd)=>Math.exp(-0.5*Math.pow((lam-c)/wd,2));
  /* 偶联前（紫外，灰） */
  ctx.strokeStyle='rgba(150,160,175,.55)';ctx.lineWidth=2;ctx.beginPath();
  for(let l=L0;l<=L1;l+=4){const y=yOf(gauss(l,285,40));l===L0?ctx.moveTo(xOf(l),y):ctx.lineTo(xOf(l),y);}
  ctx.stroke();
  /* 产物（蓝） */
  ctx.strokeStyle='#4d78c9';ctx.lineWidth=3;ctx.beginPath();
  for(let l=L0;l<=L1;l+=4){const y=yOf(gauss(l,lambdaVis,lambdaVis<380?46:58));l===L0?ctx.moveTo(xOf(l),y):ctx.lineTo(xOf(l),y);}
  ctx.stroke();
  /* λmax 竖线 */
  ctx.strokeStyle='rgba(77,120,201,.6)';ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(xOf(lambdaVis),yOf(0));ctx.lineTo(xOf(lambdaVis),yOf(1));ctx.stroke();
  ctx.setLineDash([]);ctx.lineWidth=1;
  ctx.fillStyle=t2;
  ctx.fillText(`λmax ${lambdaVis.toFixed(0)} nm`,clamp(xOf(lambdaVis)-30,4,W-120),yOf(0.94));
}

/* ---- 统计 ---- */
let statAcc=0;
function colorName(lam){
  if(lam<385)return L('近无色(紫外)','colorless (UV)');
  if(lam<450)return L('黄色系','yellowish');
  if(lam<505)return L('橙色系','orange');
  if(lam<575)return L('红色系','red');
  return L('紫红/蓝紫系','purple');
}
function updateStats(){
  document.getElementById('stT').innerHTML=Tc.toFixed(0)+'<small> °C</small>';
  document.getElementById('stPH').innerHTML=pH.toFixed(1);
  document.getElementById('stLm').innerHTML=lambdaVis.toFixed(0)+'<small> nm</small>';
  const cc=compColor(lambdaVis);
  document.getElementById('stCol').innerHTML=
    `<span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:rgb(${cc});vertical-align:-2px"></span> ${colorName(lambdaVis)}`;
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    phaseT+=dt;
    if(phase===0){
      if(phaseT>2.0){
        gAniline.visible=false;gDiazo.visible=true;
        const s=clamp((phaseT-2.0)/0.3,0,1);
        gDiazo.scale.setScalar(0.6+0.4*s);
      }
      if(phaseT>2.5){phase=1;phaseT=0;activeStep=1;syncSteps();}
    }else if(phase===1){
      if(Tc>5){                                // 分解事件
        decT+=dt;bubbles.visible=true;
        if(decT>1.4){
          resetReaction();
          flash(L('重氮盐分解放出 N₂，报废！重做——','Diazonium decomposed (N2 off). Redo—'));
          bubbles.visible=false;
        }
      }else{
        decT=Math.max(0,decT-dt);bubbles.visible=false;
        if(phaseT>1.2){phase=2;phaseT=0;activeStep=2;syncSteps();
          gComp.visible=true;gComp.position.set(4.3,RINGY+1.4,0);}
      }
    }else if(phase===2){
      if(Tc>5){decT+=dt;bubbles.visible=true;
        if(decT>1.4){resetReaction();flash(L('重氮盐分解报废！','Diazonium decomposed!'));bubbles.visible=false;}}
      else{
        bubbles.visible=false;
        gComp.position.x=4.3+(2.3-4.3)*clamp(phaseT/1.5,0,1);
        if(phaseT>1.6){phase=3;phaseT=0;activeStep=3;syncSteps();}
      }
    }else if(phase===3){
      const f=clamp(phaseT/1.15,0,1),e=f*f*(3-2*f);
      gComp.position.set(2.3*(1-e),RINGY+1.4+0.88*e,0);
      if(phaseT>1.15){                         // 招牌瞬间：N=N 桥接合
        gComp.visible=false;gProduct.visible=true;gDiazo.visible=false;
        snapMat.opacity=0.95;snap.scale.setScalar(0.4);
        flash(L('偶联成功！共轭链贯通，颜色出现','Coupled! Conjugation complete, color appears'));
        phase=4;phaseT=0;activeStep=4;syncSteps();
      }
    }
    if(snapMat.opacity>0){
      snapMat.opacity=Math.max(0,snapMat.opacity-dt*1.4);
      snap.scale.multiplyScalar(1+dt*4);
    }
  }
  /* λmax 与颜色（pH 实时起作用） */
  const lamT=phase>=4?targetLambda():285;
  lambdaVis+=(lamT-lambdaVis)*clamp(dt*5,0,1);
  const cc=compColor(lambdaVis);
  const pale=phase>=4?1:0.25;
  liquidMat.color.setRGB(cc[0]/255*pale+0.86*(1-pale),cc[1]/255*pale+0.89*(1-pale),cc[2]/255*pale+0.92*(1-pale));
  conj.scale.x+=((phase>=4?1.55:0.62)-conj.scale.x)*clamp(dt*3.5,0,1);
  /* 气泡上浮 */
  if(bubbles.visible){
    const p=bubGeo.attributes.position;
    for(let i=0;i<40;i++){
      let y=p.getY(i)+dt*(0.7+0.4*Math.sin(i));
      if(y>1.6)y=-2.4;
      p.setY(i,y);
    }
    p.needsUpdate=true;
  }
  gDiazo.rotation.y=simT*0.15;gAniline.rotation.y=simT*0.15;
  gProduct.rotation.y=simT*0.15;gComp.rotation.y=simT*0.15;
  if(flashT>0){flashT-=dt;if(flashT<=0)flashEl.style.opacity=0;}
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  drawPlot();
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 事件 ---- */
document.getElementById('sT').addEventListener('input',e=>{
  Tc=+e.target.value;
  document.getElementById('sTVal').textContent=Tc.toFixed(0)+' °C';
});
document.getElementById('sPH').addEventListener('input',e=>{
  pH=+e.target.value;
  document.getElementById('sPHVal').textContent=pH.toFixed(1);
});
function setComp(i){
  compIdx=i;
  document.getElementById('c0').classList.toggle('on',i===0);
  document.getElementById('c1').classList.toggle('on',i===1);
  document.getElementById('c2').classList.toggle('on',i===2);
  scene.remove(gComp,gProduct);
  gComp=buildComp(i);gProduct=buildProduct(i);
  gProduct.visible=phase>=4;gComp.visible=phase===2||phase===3;
  gComp.position.set(4.3,RINGY+1.4,0);
  scene.add(gComp,gProduct);
  flash(L('换偶联组分：λmax 与颜色随之改变','New coupling partner: λmax and color change'));
}
document.getElementById('c0').addEventListener('click',()=>setComp(0));
document.getElementById('c1').addEventListener('click',()=>setComp(1));
document.getElementById('c2').addEventListener('click',()=>setComp(2));
document.getElementById('btnRedo').addEventListener('click',resetReaction);
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('tglLabels').checked=labelsOn;

applyTheme();applyLang();updateStats();start();
</script>
