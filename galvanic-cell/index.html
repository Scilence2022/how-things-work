<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原电池 · 电子与离子迁移路径 3D 动画</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #10141b;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: rgba(12,16,23,.78); border: 1px solid rgba(255,255,255,.16);
    color: #e6ecf3; font-size: 12px; line-height: 1.35; padding: 4px 9px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.big { border-radius: 12px; text-align: center; }
  .lbl.big b { font-size: 12.5px; }
  .lbl.zn { border-color: rgba(185,193,203,.8); color: #e6ecf3; }
  .lbl.cu { border-color: rgba(216,142,74,.9); color: #ffd9ac; }
  .lbl.e  { border-color: rgba(255,214,110,.9); color: #ffe9ad; }
  .lbl.i  { border-color: rgba(79,143,217,.8);  color: #b9d7f5; }
  .lbl.k  { border-color: rgba(176,127,224,.9); color: #e3ccff; }
  .lbl.cl { border-color: rgba(116,196,118,.9); color: #c9f0ca; }
  .lbl.ion { border-color: rgba(255,255,255,.3); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; }
  #title h1 { font-size: 20px; font-weight: 700; color: #f2f5f9; letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: #9fb0c3; margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 372px;
    max-height: calc(100vh - 110px); overflow: auto;
    background: rgba(13,17,24,.86); border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px; padding: 13px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #legend { display: flex; gap: 7px; margin-bottom: 9px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.zn { color: #e6ecf3; border-color: rgba(185,193,203,.6); }
  .chip.cu { color: #ffd9ac; border-color: rgba(216,142,74,.7); }
  .chip.e  { color: #ffe9ad; border-color: rgba(255,214,110,.6); }
  .chip.br { color: #e3ccff; border-color: rgba(176,127,224,.6); }
  .chip.dim { color: #b9c4d0; border-color: rgba(255,255,255,.22); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 5px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: rgba(255,255,255,.05); }
  #steps li.on { background: rgba(47,158,99,.12); border-color: rgba(47,158,99,.5); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: #dfe6ee; }
  #steps li.on .n { background: #2f9e63; color: #fff; }
  #steps .t { font-size: 12.5px; color: #c7d2de; line-height: 1.45; }
  #steps .t b { color: #f2f5f9; font-size: 12.5px; }
  #steps li.on .t b { color: #c2ecd4; }

  #eq { font-size: 12.5px; color: #ffd9ac; background: rgba(216,142,74,.08);
    border: 1px solid rgba(216,142,74,.35); border-radius: 9px; padding: 6px 10px;
    margin-top: 8px; line-height: 1.6; text-align: center; }

  #ctrl { display: flex; gap: 14px; align-items: center; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.08); }
  #play { padding: 8px 16px; font-size: 13.5px; background: #2f9e63; color: #fff; border: 0;
    border-radius: 10px; cursor: pointer; }
  #play:hover { background: #3bb273; }
  .row { display: flex; align-items: center; gap: 8px; flex: 1; }
  .row label { font-size: 12px; color: #9fb0c3; flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: #c7d2de; flex: 0 0 38px; text-align: right; }
  input[type=range] { width: 100%; accent-color: #2f9e63; height: 18px; }
  #toggles { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: #b9c4d0; display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: #2f9e63; }
  @media (max-width: 760px) { #panel { width: calc(100vw - 36px); } #title h1 { font-size: 16px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1>原电池里的电子和离子怎么走？—— 铜锌原电池</h1>
  <div class="sub">3D 交互演示 · 外电路：电子 Zn → Cu · 内电路：离子经溶液与盐桥迁移 · 两路合起来才是闭合回路</div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip zn">Zn 电极（负极）</span>
    <span class="chip cu">Cu 电极（正极）</span>
    <span class="chip e">e⁻ 电子</span>
    <span class="chip br">盐桥 K⁺ / Cl⁻</span>
    <span class="chip dim">一个循环 = 转移 2 个电子</span>
  </div>
  <ol id="steps"></ol>
  <div id="eq">负极：Zn − 2e⁻ → Zn²⁺　　正极：Cu²⁺ + 2e⁻ → Cu<br>总反应：Zn + Cu²⁺ → Zn²⁺ + Cu</div>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label>速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> 标签</label>
    <label><input id="tglRotate" type="checkbox"> 自动环绕</label>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- 场景基础 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141b);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.8, 3.6, 8.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3.5;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.7;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 7, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

/* ---------------- 材质 ---------------- */
const M = {
  glass: new THREE.MeshPhysicalMaterial({ color: 0xaebfd0, transparent: true, opacity: 0.17,
    roughness: 0.12, metalness: 0, depthWrite: false, side: THREE.DoubleSide }),
  zn:   new THREE.MeshStandardMaterial({ color: 0xb9c1cb, metalness: 0.8, roughness: 0.35,
          emissive: 0xb9c1cb, emissiveIntensity: 0 }),
  cu:   new THREE.MeshStandardMaterial({ color: 0xd08a4a, metalness: 0.75, roughness: 0.4,
          emissive: 0xd08a4a, emissiveIntensity: 0 }),
  wire: new THREE.MeshStandardMaterial({ color: 0x4a5160, metalness: 0.7, roughness: 0.4 }),
  table: new THREE.MeshStandardMaterial({ color: 0x252b34, metalness: 0.2, roughness: 0.85 }),
  gel:  new THREE.MeshStandardMaterial({ color: 0xd9cba8, transparent: true, opacity: 0.5,
          depthWrite: false }),
  znSolution: new THREE.MeshStandardMaterial({ color: 0xaebfd0, transparent: true, opacity: 0.22,
          depthWrite: false }),
  cuSolution: new THREE.MeshStandardMaterial({ color: 0x2f6fde, transparent: true, opacity: 0.5,
          depthWrite: false }),
  znIoin: new THREE.MeshStandardMaterial({ color: 0xd7e4f2, roughness: 0.4,
          emissive: 0xd7e4f2, emissiveIntensity: 0.25, transparent: true }),
  cuIoin: new THREE.MeshStandardMaterial({ color: 0x3f74e8, roughness: 0.4,
          emissive: 0x3f74e8, emissiveIntensity: 0.35, transparent: true }),
  kIoin: new THREE.MeshStandardMaterial({ color: 0xb07fe0, roughness: 0.4,
          emissive: 0xb07fe0, emissiveIntensity: 0.3, transparent: true }),
  clIoin: new THREE.MeshStandardMaterial({ color: 0x74c476, roughness: 0.4,
          emissive: 0x74c476, emissiveIntensity: 0.3, transparent: true }),
};

/* ---------------- 烧杯 / 溶液 / 电极 ---------------- */
const ZN_X = -2.3, CU_X = 2.3, SOL_TOP = 1.18;
function beaker(cx) {
  const g = new THREE.Group();
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, 1.9, 48, 1, true), M.glass);
  wall.position.y = 0.95; wall.renderOrder = 3;
  const bottom = new THREE.Mesh(new THREE.CircleGeometry(1.05, 48), M.glass);
  bottom.rotation.x = -Math.PI / 2; bottom.position.y = 0.015; bottom.renderOrder = 3;
  g.add(wall, bottom);
  g.position.x = cx;
  scene.add(g);
}
beaker(ZN_X); beaker(CU_X);

const solZn = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 0.98, 1.12, 48), M.znSolution);
solZn.position.set(ZN_X, 0.62, 0); solZn.renderOrder = 1; scene.add(solZn);
const solCu = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 0.98, 1.12, 48), M.cuSolution);
solCu.position.set(CU_X, 0.62, 0); solCu.renderOrder = 1; scene.add(solCu);

// 电极板：几何原点移到底部，便于从底向上缩放（溶解 / 析出）
function electrode(cx, m) {
  const geo = new THREE.BoxGeometry(0.14, 1.55, 0.5);
  geo.translate(0, 0.775, 0);
  const plate = new THREE.Mesh(geo, m);
  plate.position.set(cx + Math.sign(cx) * 0.48, 0.28, 0);
  plate.castShadow = true;
  scene.add(plate);
  const tab = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.5, 0.28), m);
  tab.position.set(plate.position.x, 2.08, 0);
  scene.add(tab);
  return { plate, tab, x: plate.position.x };
}
const elZn = electrode(ZN_X, M.zn);
const elCu = electrode(CU_X, M.cu);

// 桌面
{
  const table = new THREE.Mesh(new THREE.BoxGeometry(7.8, 0.18, 3.0), M.table);
  table.position.set(0, -0.09, 0);
  scene.add(table);
}

/* ---------------- 导线与灯泡（外电路） ---------------- */
const wirePath = new THREE.CatmullRomCurve3([
  V3(elZn.x, 2.28, 0), V3(elZn.x, 2.95, 0), V3(-2.0, 3.5, 0), V3(-0.85, 3.82, 0),
  V3(0, 3.86, 0),
  V3(0.85, 3.82, 0), V3(2.0, 3.5, 0), V3(elCu.x, 2.95, 0), V3(elCu.x, 2.28, 0),
], false, 'centripetal', 0.5);
{
  const wire = new THREE.Mesh(new THREE.TubeGeometry(wirePath, 100, 0.035, 10, false), M.wire);
  scene.add(wire);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.2, 16),
    new THREE.MeshStandardMaterial({ color: 0x8a929c, metalness: 0.6, roughness: 0.4 }));
  base.position.set(0, 3.94, 0);
  scene.add(base);
}
const bulbGlass = new THREE.Mesh(new THREE.SphereGeometry(0.34, 28, 22),
  new THREE.MeshPhysicalMaterial({ color: 0xfff8e8, transparent: true, opacity: 0.18, roughness: 0.05, depthWrite: false }));
bulbGlass.position.set(0, 4.22, 0); bulbGlass.renderOrder = 3;
scene.add(bulbGlass);
const filament = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0xffc36b, emissive: 0xffc36b, emissiveIntensity: 0.7 }));
filament.position.set(0, 4.16, 0);
scene.add(filament);
const bulbLight = new THREE.PointLight(0xffc36b, 1.2, 5, 2);
bulbLight.position.set(0, 4.2, 0);
scene.add(bulbLight);

/* ---------------- 盐桥（内电路的离子通道） ---------------- */
const bridgePath = new THREE.CatmullRomCurve3([
  V3(ZN_X, 0.75, -0.8), V3(ZN_X, 2.1, -0.85), V3(-1.4, 2.72, -0.95), V3(0, 2.92, -1.05),
  V3(1.4, 2.72, -0.95), V3(CU_X, 2.1, -0.85), V3(CU_X, 0.75, -0.8),
], false, 'centripetal', 0.5);
{
  const outer = new THREE.Mesh(new THREE.TubeGeometry(bridgePath, 80, 0.15, 12, false), M.glass);
  outer.renderOrder = 4;
  scene.add(outer);
  const gel = new THREE.Mesh(new THREE.TubeGeometry(bridgePath, 80, 0.105, 10, false), M.gel);
  gel.renderOrder = 2;
  scene.add(gel);
}

/* ---------------- 电子（沿导线移动的光点） ---------------- */
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,240,180,1)');
  g.addColorStop(0.4, 'rgba(255,214,110,.55)');
  g.addColorStop(1, 'rgba(255,214,110,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const eTex = glowTexture();
const electrons = [];
for (let i = 0; i < 6; i++) {
  const g = new THREE.Group();
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: eTex, color: 0xffd76b,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  spr.scale.setScalar(0.3);
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xfff3c4 }));
  g.add(spr, core);
  g.userData.offset = V3((Math.random() - .5) * 0.09, (Math.random() - .5) * 0.09, (Math.random() - .5) * 0.09);
  scene.add(g);
  electrons.push({ grp: g, s: i / 6 });
}

/* ---------------- 溶液中的离子 ---------------- */
const znIons = [], cuIons = [];
function spawnZnIon() {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 12), M.znIoin.clone());
  m.position.set(elZn.x + 0.12, 0.45 + Math.random() * 0.55, (Math.random() - .5) * 0.4);
  scene.add(m);
  znIons.push({ m, vel: V3(0.5 + Math.random() * 0.4, (Math.random() - .5) * 0.3, (Math.random() - .5) * 0.3),
    age: 0, absorbing: null });
}
for (let i = 0; i < 4; i++) spawnZnIon();
function spawnCuIon() {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.085, 14, 12), M.cuIoin.clone());
  m.position.set(CU_X - 0.4 + Math.random() * 1.0, 0.4 + Math.random() * 0.6, (Math.random() - .5) * 0.9);
  scene.add(m);
  cuIons.push({ m, vel: V3((Math.random() - .5) * 0.3, (Math.random() - .5) * 0.2, (Math.random() - .5) * 0.3),
    age: 0, absorbing: 0 });
}
for (let i = 0; i < 7; i++) spawnCuIon();
let cuRespawnAt = Infinity;

/* ---------------- 盐桥中的离子（K⁺ → 铜半电池，Cl⁻ → 锌半电池） ---------------- */
const bridgeIons = [];
for (let i = 0; i < 3; i++) bridgeIons.push({ m: (() => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.062, 12, 10), M.kIoin.clone());
    scene.add(m); return m; })(), u: 0.2 + i * 0.22, dir: 1, type: 'K' });
for (let i = 0; i < 3; i++) bridgeIons.push({ m: (() => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.062, 12, 10), M.clIoin.clone());
    scene.add(m); return m; })(), u: 0.8 - i * 0.22, dir: -1, type: 'Cl' });

/* ---------------- 标签 ---------------- */
function addLabel(html, pos, cls = '') {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.innerHTML = html;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  return o;
}
const labelObjs = [
  addLabel('<b>负极（氧化）</b><br>Zn − 2e⁻ → Zn²⁺', V3(ZN_X - 0.4, 2.75, 0.9), 'big zn'),
  addLabel('<b>正极（还原）</b><br>Cu²⁺ + 2e⁻ → Cu', V3(CU_X + 0.4, 2.75, 0.9), 'big cu'),
  addLabel('e⁻ 电子流向 ⟶', V3(-1.55, 4.05, 0.15), 'e'),
  addLabel('⟵ 电流方向 I', V3(1.55, 4.32, 0.15), 'i'),
  addLabel('<b>盐桥</b>（维持电中性）<br>K⁺ ⟶ 铜半电池　⟵ Cl⁻ 锌半电池', V3(0, 3.5, -1.1), 'big k'),
  addLabel('Zn²⁺（进入溶液）', V3(0, 0.26, 0), 'ion'),
  addLabel('Cu²⁺（移向正极）', V3(0, 0.26, 0), 'ion'),
  addLabel('K⁺', V3(0, 0.2, 0), 'k'),
  addLabel('Cl⁻', V3(0, 0.2, 0), 'cl'),
];
const lblZnIon = labelObjs[5], lblCuIon = labelObjs[6], lblK = labelObjs[7], lblCl = labelObjs[8];

/* ---------------- 相位讲解 ---------------- */
const STEPS = [
  { b: '负极 · 氧化', d: '锌片表面的 Zn 失去 2 个电子变成 Zn²⁺ 进入溶液，锌片慢慢溶解（Zn − 2e⁻ → Zn²⁺）；电子留在锌片上，沿导线寻找出口。' },
  { b: '外电路 · 电子流动', d: '电子沿导线从锌片流向铜片，途中点亮灯泡——化学能在这里转化为电能。电流方向与电子流向相反（Cu → Zn）。' },
  { b: '正极 · 还原', d: '溶液中的 Cu²⁺ 向铜片迁移，在表面得到电子析出金属铜（Cu²⁺ + 2e⁻ → Cu）；CuSO₄ 溶液的蓝色随 Cu²⁺ 消耗而变浅。' },
  { b: '内电路 · 盐桥离子迁移', d: '锌半电池 Zn²⁺ 增多 → Cl⁻ 从盐桥移入补负电；铜半电池 Cu²⁺ 减少 → K⁺ 移入补正电。离子定向移动构成内电路，两溶液保持电中性，电流才可持续。' },
];
const elSteps = document.getElementById('steps');
STEPS.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${s.b}</b>　${s.d}</span>`;
  li.addEventListener('click', () => { cycles = Math.floor(cycles) + [0.02, 0.3, 0.52, 0.8][i]; });
  elSteps.appendChild(li);
});
function stepIndex(t) {
  if (t < 0.3) return 0;
  if (t < 0.52) return 1;
  if (t < 0.8) return 2;
  return 3;
}

/* ---------------- UI ---------------- */
let cycles = qsFloat('t', 0);
let playing = !qsBool('pause', false);
let speed = qsFloat('speed', 1);
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
elPlay.textContent = playing ? '暂停' : '播放';
elPlay.onclick = () => { playing = !playing; elPlay.textContent = playing ? '暂停' : '播放'; };
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.oninput = () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; };
tglLabels.onchange = () => { for (const o of labelObjs) o.element.style.display = tglLabels.checked ? '' : 'none'; };
tglRotate.onchange = () => { controls.autoRotate = tglRotate.checked; };
controls.autoRotate = qsBool('spin', false);
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }

addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 每帧更新 ---------------- */
const tmpV = new THREE.Vector3();
let lastStep = -1, prevT = cycles - Math.floor(cycles);

// 周期事件的"越过检测"（t ∈ [0,1) 环）
function crossed(a, t0, t1) {
  if (t0 === t1) return false;
  if (t0 < t1) return t0 < a && a <= t1;
  return a > t0 || a <= t1;   // 跨越 1→0
}

function updateWorld(dt) {
  const cyc = Math.floor(cycles);
  const t = cycles - cyc;

  /* --- 周期事件 --- */
  if (crossed(0.06, prevT, t)) {   // 锌溶解：吐出一个 Zn²⁺
    spawnZnIon();
    M.zn.emissiveIntensity = 0.55;
  }
  if (crossed(0.52, prevT, t)) {   // 铜析出：吸附最近的 Cu²⁺
    let best = null, bd = 1e9;
    for (const c of cuIons) {
      if (c.absorbing) continue;
      const d = Math.abs(elCu.x - c.m.position.x);
      if (d < bd) { bd = d; best = c; }
    }
    if (best) best.absorbing = 0.001;
    cuRespawnAt = simTime + 1.6;
    M.cu.emissiveIntensity = 0.55;
  }

  /* --- 电子沿导线流动 --- */
  const pulse = { v: 0 };
  for (const e of electrons) {
    e.s = (e.s + dt / 2.6) % 1;
    const p = wirePath.getPointAt(e.s);
    e.grp.position.copy(p).add(e.grp.userData.offset);
    const a = Math.pow(Math.sin(Math.PI * e.s), 0.7);
    e.grp.children[0].material.opacity = a;
    e.grp.visible = a > 0.02;
    const d = Math.abs(e.s - 0.5);
    if (d < 0.09) pulse.v += (1 - d / 0.09);
  }
  filament.material.emissiveIntensity = 0.7 + pulse.v * 2.2;
  bulbLight.intensity = 1.2 + pulse.v * 5;

  /* --- Zn²⁺：进入溶液后扩散、慢慢淡去 --- */
  for (let i = znIons.length - 1; i >= 0; i--) {
    const z = znIons[i];
    z.age += dt;
    if (!z.absorbing) {
      z.vel.x += (Math.random() - .5) * 0.25 * dt;
      z.vel.y += (Math.random() - .5) * 0.25 * dt;
      z.vel.z += (Math.random() - .5) * 0.25 * dt;
      z.vel.clampLength(0.15, 0.75);
      z.m.position.addScaledVector(z.vel, dt);
      const p = z.m.position;
      if (p.x > ZN_X + 0.85) { p.x = ZN_X + 0.85; z.vel.x *= -1; }
      if (p.x < ZN_X - 0.7)  { p.x = ZN_X - 0.7;  z.vel.x *= -1; }
      if (p.y < 0.3) { p.y = 0.3; z.vel.y *= -1; }
      if (p.y > 1.05) { p.y = 1.05; z.vel.y *= -1; }
      if (Math.abs(p.z) > 0.55) { p.z = Math.sign(p.z) * 0.55; z.vel.z *= -1; }
    }
    z.m.material.opacity = clamp((8 - z.age) / 1.5, 0, 1) * 0.95;
    if (z.age > 8) { scene.remove(z.m); znIons.splice(i, 1); }
  }

  /* --- Cu²⁺：向正极漂移，被吸附后"析出" --- */
  for (let i = cuIons.length - 1; i >= 0; i--) {
    const c = cuIons[i];
    c.age += dt;
    if (c.absorbing > 0) {
      c.absorbing += dt;
      const k = clamp(c.absorbing / 0.45, 0, 1);
      c.m.position.lerp(tmpV.set(elCu.x - 0.14, c.m.position.y, c.m.position.z), Math.min(dt * 7, 1));
      c.m.material.opacity = 1 - k;
      if (k >= 1) { scene.remove(c.m); cuIons.splice(i, 1); }
      continue;
    }
    c.vel.x += 0.05 * dt;   // 电场：阳离子向正极（+x）漂移
    c.vel.x += (Math.random() - .5) * 0.3 * dt;
    c.vel.y += (Math.random() - .5) * 0.3 * dt;
    c.vel.z += (Math.random() - .5) * 0.3 * dt;
    c.vel.clampLength(0.1, 0.5);
    c.m.position.addScaledVector(c.vel, dt);
    const p = c.m.position;
    if (p.x > CU_X + 0.7) { p.x = CU_X + 0.7; c.vel.x *= -1; }
    if (p.x < CU_X - 0.85) { p.x = CU_X - 0.85; c.vel.x *= -1; }
    if (p.y < 0.3) { p.y = 0.3; c.vel.y *= -1; }
    if (p.y > 1.05) { p.y = 1.05; c.vel.y *= -1; }
    if (Math.abs(p.z) > 0.55) { p.z = Math.sign(p.z) * 0.55; c.vel.z *= -1; }
  }
  if (simTime > cuRespawnAt && cuIons.filter(c => !c.absorbing).length < 7) {
    spawnCuIon(); cuRespawnAt = Infinity;
  }

  /* --- 盐桥离子 --- */
  for (const b of bridgeIons) {
    b.u += b.dir * dt / 6;
    if (b.u > 0.92) b.u = 0.08;
    if (b.u < 0.08) b.u = 0.92;
    const p = bridgePath.getPointAt(b.u);
    b.m.position.copy(p);
    b.m.material.opacity = ss(0.08, 0.2, b.u) * (1 - ss(0.8, 0.92, b.u));
  }

  /* --- 电极消长 / 溶液颜色（随周期数缓慢变化） --- */
  const prog = Math.min(cyc / 40, 1);
  elZn.plate.scale.y = 1 - 0.055 * prog;
  elCu.plate.scale.y = 1 + 0.05 * prog;
  M.cuSolution.color.lerpColors(new THREE.Color(0x2f6fde), new THREE.Color(0x9db8dd), prog);
  M.cuSolution.opacity = 0.5 - 0.22 * prog;

  /* --- 电极闪光衰减 --- */
  M.zn.emissiveIntensity = Math.max(0, M.zn.emissiveIntensity - dt * 1.4);
  M.cu.emissiveIntensity = Math.max(0, M.cu.emissiveIntensity - dt * 1.4);

  /* --- 标签跟随 --- */
  const zNew = znIons[znIons.length - 1];
  lblZnIon.visible = !!zNew; if (zNew) lblZnIon.position.copy(zNew.m.position).add(tmpV.set(0, 0.24, 0));
  const cRef = cuIons.find(c => !c.absorbing);
  lblCuIon.visible = !!cRef; if (cRef) lblCuIon.position.copy(cRef.m.position).add(tmpV.set(0, 0.26, 0));
  const kRef = bridgeIons.find(b => b.type === 'K');
  lblK.visible = !!kRef; if (kRef) lblK.position.copy(kRef.m.position).add(tmpV.set(0, 0.2, 0));
  const clRef = bridgeIons.find(b => b.type === 'Cl');
  lblCl.visible = !!clRef; if (clRef) lblCl.position.copy(clRef.m.position).add(tmpV.set(0, 0.2, 0));

  prevT = t;
  return t;
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let simTime = 0;
function frame() {
  requestAnimationFrame(frame);
  const rawDt = Math.min(clock.getDelta(), 0.05);
  const dt = playing ? rawDt * speed : 0;
  simTime += dt;
  cycles += dt / 6;

  const t = updateWorld(dt);

  const si = stepIndex(t);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
frame();
</script>
</body>
