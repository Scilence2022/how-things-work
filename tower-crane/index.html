<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔吊 · 一台力矩天平</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd43b;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8); }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e67700;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px); transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px; backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffd43b; }
  :root[data-theme="light"] #stats .v.warn { color: #d98f00; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px); box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600; transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,212,59,.6); background: rgba(255,212,59,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(230,119,0,.55); background: rgba(230,119,0,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2); border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,212,59,.10); border-color: rgba(255,212,59,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(230,119,0,.08); border-color: rgba(230,119,0,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px; background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #fff3c4; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600; background: var(--acc); color: #22262e; border: 0; border-radius: 10px; cursor: pointer; }
  :root[data-theme="light"] #play { color: #fff; }
  #play:hover { filter: brightness(1.08); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center; cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border); border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) { #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="塔吊 · 一台力矩天平" data-en="Tower Crane · A Moment Balance">塔吊 · 一台力矩天平</h1>
  <div class="sub" data-zh="吊重 m 挂在幅度 R 处,力矩 M=m·g·R 就是塔吊的全部力学:4 t × 25 m = 980 kN·m,恰好被挂在轴后 10 m 力臂上的 10 t 配重对消;额定力矩 1000 kN·m 把允许吊重压成一条双曲线——56 m 臂端只剩 1.8 t,12.8 m 以内才可吊满 8 t;把小车拉远或加大吊重,净力矩击穿额定值,塔身色带转红、整机前倾或后仰失稳——超载先坏的是受压弦杆(Euler 屈曲,裕度最低),而不是安全系数 5–6 的钢丝绳 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="A load m at radius R creates the moment M = m·g·R that rules everything: 4 t x 25 m = 980 kN·m, cancelled by 10 t of ballast on a 10 m arm behind the axis; the rated moment of 1000 kN·m bends the load chart into a hyperbola — only 1.8 t at the 56 m tip, 8 t flat inside 12.8 m. Push the trolley out or add weight and the net moment breaks the rating: the mast bands go red and the machine tilts — failure comes by buckling of the compressed chords (Euler, the thinnest margin), not by the hoist rope (safety factor 5–6) · 3D interactive demo · drag to orbit · Space = run/pause">塔吊 · 一台力矩天平</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="吊重力矩" data-en="Load moment">吊重力矩</span><span class="v" id="stML">—</span>
  <span class="k" data-zh="配重力矩" data-en="CW moment">配重力矩</span><span class="v" id="stMC">—</span>
  <span class="k" data-zh="净力矩" data-en="Net moment">净力矩</span><span class="v" id="stNet">—</span>
  <span class="k" data-zh="塔身应力" data-en="Mast stress">塔身应力</span><span class="v" id="stSig">—</span>
  <span class="k" data-zh="幅度 · 吊重" data-en="Radius · load">幅度 · 吊重</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v" id="stSt">—</span>
</div>

<div id="plot">
  <h3 data-zh="起重特性曲线:允许吊重 = min(8 t, 1000/(9.8R)) 双曲衰减,红区为超限,动点=当前工况" data-en="Load chart: allowed load = min(8 t, 1000/(9.8R)) — hyperbolic decay; red = overload zone; dot = current state">起重特性曲线:允许吊重 = min(8 t, 1000/(9.8R)) 双曲衰减,红区为超限,动点=当前工况</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="起重侧:吊重×幅度的力矩" data-en="load side: hook moment m·g·R">起重侧:吊重×幅度的力矩</span>
    <span class="chip.r" data-zh="报警:超额定 / 后倾超限" data-en="alarm: beyond rated / tail-heavy">报警:超额定 / 后倾超限</span>
    <span class="chip.g" data-zh="平衡侧:配重的反向力矩" data-en="balance side: counterweight moment">平衡侧:配重的反向力矩</span>
    <span class="chip.b" data-zh="塔身:净力矩→弯曲应力" data-en="mast: net moment → bending stress">塔身:净力矩→弯曲应力</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnHoist" data-zh="起吊" data-en="Hoist">起吊</button>
    <button class="abtn" id="btnSlew" data-zh="回转 90°" data-en="Slew 90°">回转 90°</button>
  </div>
  <div class="row"><label data-zh="小车幅度 R" data-en="Radius R">小车幅度 R</label><input id="sR" type="range" min="3" max="56" step="0.5" value="25"><span class="val" id="sRVal">25 m</span></div>
  <div class="row"><label data-zh="吊重 m" data-en="Load m">吊重 m</label><input id="sM" type="range" min="0.5" max="12" step="0.1" value="4"><span class="val" id="sMVal">4.0 t</span></div>
  <div class="row"><label data-zh="配重质量" data-en="Ballast mass">配重质量</label><input id="sCw" type="range" min="4" max="18" step="0.5" value="10"><span class="val" id="sCwVal">10 t</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglStress" type="checkbox" checked> <span data-zh="应力可视化" data-en="Stress map">应力可视化</span></label>
      <label><input id="tglPend" type="checkbox" checked> <span data-zh="拉杆" data-en="Pendants">拉杆</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../lever-pulley/" data-zh="杠杆滑轮:力矩鼻祖" data-en="lever & pulley: the original balance">杠杆滑轮:力矩鼻祖</a>
    <a href="../chain-hoist/" data-zh="环链葫芦:减速增矩" data-en="chain hoist: gears trade speed for force">环链葫芦:减速增矩</a>
    <a href="../elevator/" data-zh="电梯:对重的另一半" data-en="elevator: the counterweight's half">电梯:对重的另一半</a>
    <a href="../pascal-press/" data-zh="帕斯卡压机:液压放大" data-en="pascal press: hydraulic force gain">帕斯卡压机:液压放大</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);
const U = 3;                                            // 1 场景单位 = 3 m

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 55, 230);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xdde5ec);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xdde5ec);
  groundM.color.setHex(dark ? 0x191d23 : 0xb6c1cb);
  foundM.color.setHex(dark ? 0x3a3f46 : 0x9aa4ae);
  steelM.color.setHex(dark ? 0xcf9f2c : 0xa87d20);
  cabM.color.setHex(dark ? 0x2b3138 : 0x7f8a95);
  glassM.color.setHex(dark ? 0x9fd8ff : 0x5aa7d9);
  glassM.emissive.setHex(dark ? 0x9fd8ff : 0x5aa7d9);
  ropeM.color.setHex(dark ? 0x8b939c : 0x5f6a74);
  hookM.color.setHex(dark ? 0x22262b : 0x565f68);
  cwM.color.setHex(dark ? 0x4a4f57 : 0x97a1ab);
  propM.color.setHex(dark ? 0x23272e : 0xa8b2bc);
  ringMat.color.setHex(dark ? 0x6b7683 : 0x7c8894);
  ringCurMat.color.setHex(dark ? 0xffd43b : 0xb25c00);
  bendMat.color.setHex(dark ? 0xff5a4a : 0xd64534);
  updateLoadColor();
  updateStress();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('塔吊 · 一台力矩天平', 'Tower Crane · A Moment Balance');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
camera.position.set(27, 15, 31);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(2.5, 8.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 130;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.1);
key.position.set(40, 60, 30);
scene.add(key);
const fillL = new THREE.DirectionalLight(0xffe9b8, 0.35);
fillL.position.set(-35, 25, -30);

/* ================= 物理模型(真实数值) ================= */

const BOX = new THREE.BoxGeometry(1, 1, 1);
function member(a, b, w) {                              // a→b 两点间一根方杆
  const g = BOX.clone();
  const dir = new THREE.Vector3().subVectors(b, a);
  const q = new THREE.Quaternion().setFromUnitVectors(v3(0, 1, 0), dir.clone().normalize());
  const m = new THREE.Matrix4().compose(
    new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5), q, v3(w, dir.length(), w));
  g.applyMatrix4(m);
  return g;
}
function mergeGeos(list) {
  const pos = [], nor = [], uv = [];
  for (const g0 of list) {
    const g = g0.index ? g0.toNonIndexed() : g0;
    const p = g.attributes.position.array, n = g.attributes.normal.array;
    const uc = g.attributes.uv ? g.attributes.uv.array : new Float32Array(p.length / 3 * 2);
    for (let i = 0; i < p.length; i++) pos.push(p[i]);
    for (let i = 0; i < n.length; i++) nor.push(n[i]);
    for (let i = 0; i < uc.length; i++) uv.push(uc[i]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

function mastSectionGeo(h) {                            // 一节标准节:4 弦杆 + 横撑 + 斜腹杆

const calmDark = new THREE.Color(0x4a5462), calmLight = new THREE.Color(0x9aa6b2);
const warmC = new THREE.Color(0xe0a92e), hotC = new THREE.Color(0xe8442f);
const tmpC = new THREE.Color();
function updateStress() {                               // 弯矩沿塔身线性增大:根部最热
  const mag = Math.abs(netCur);
  const calm = THEME === 'dark' ? calmDark : calmLight;
  for (let i = 0; i < NM; i++) {
    const f = (i + 0.5) / NM;
    const t = stressOn ? clamp(mag * f / 1100, 0, 1) : 0;
    if (t < 0.55) tmpC.copy(calm).lerp(warmC, t / 0.55);
    else tmpC.copy(warmC).lerp(hotC, (t - 0.55) / 0.45);
    mastMats[i].color.copy(tmpC);
    mastMats[i].emissive.setHex(0xff3018).multiplyScalar(t * t * 0.22);
  }
}
function updateBend() {
  bendWrap.rotation.y = slewCur;
  const show = stressOn && Math.abs(netCur) > 80;
  bendLine.visible = show;
  if (!show) return;
  const d = clamp(netCur / 1200, -1, 1) * 0.6;
  const posA = bendGeo.attributes.position;
  for (let i = 0; i < BEND_N; i++) {
    const f = i / (BEND_N - 1);
    posA.setXYZ(i, d * f * f, f * 14, 0);
  }
  posA.needsUpdate = true;
}

}

    d: '回转启动或制动时,几十米外的吊重因惯性仍走直线,吊绳偏离铅垂、吊物来回游摆,司机要提前回摆点位;风对臂架的阻力矩与吊重力矩同向叠加,规范规定 6 级风(≥10.8 m/s)必须停止吊装,台风前还要松开回转制动,让整机顺风自由旋转卸掉风矩。',
    de: 'Starting or braking the slew, the load far out keeps going straight — the rope leaves vertical and the load swings back. Wind adds a moment in the same direction as the load: at force 6 (≥10.8 m/s) lifting must stop, and before a typhoon the slew brake is released so the crane weathervanes and sheds the wind moment.',
    act: () => { mTgt = 2; rTgt = 32; slewTgt += Math.PI / 2; flyTo([24, 19, 7], [0, 12, 0]); } },
  { b: '顶升加节:楼长一寸,塔长一节', be: 'Climbing: the building grows, so does the tower',
    d: '塔吊能自己长高:套架围住塔顶,液压缸顶起上部结构 3 m,空出的位置从侧面引入一节新标准节,螺栓固定后回落,一天可顶升数节;超过约 40 m 独立高度后,每 20 m 左右加一道附墙与建筑相连;拆塔时反向操作,逐节下降回到地面。',
    de: 'A tower crane raises itself: a climbing frame grips the top, hydraulic rams lift the upper works 3 m, a new section slides in from the side and is bolted, then the rams retract — several sections a day. Above ~40 m free-standing, anchor ties to the building are added every ~20 m; dismantling runs the same loop in reverse.',
    act: () => { flyTo([8, 13.8, 8], [0, 13.4, 0]); notify('顶升加节:套架液压缸顶起上部 3 m,引入新标准节', 'climbing: rams lift the upper works 3 m, a new section slides in'); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:起重特性曲线 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const acc = css.getPropertyValue('--acc').trim() || '#ffd43b';
  const padL = 40, padR = 12, padT = 12, padB = 26;
  const RMAX = 60, MMAX = 12;
  const xOf = r => padL + r / RMAX * (W - padL - padR);
  const yOf = m => (H - padB) - m / MMAX * (H - padT - padB);
  const allowed = r => Math.min(M_CAP, M_RATED / (G0 * r));
  ctx.font = '12px system-ui';
  /* 超限红区(曲线之上) */
  const rEdge = M_RATED / (G0 * M_CAP);
  ctx.beginPath();
  ctx.moveTo(xOf(0), yOf(M_CAP));
  for (let r = rEdge; r <= RMAX; r += 1) ctx.lineTo(xOf(r), yOf(allowed(r)));
  ctx.lineTo(xOf(RMAX), yOf(MMAX));
  ctx.lineTo(xOf(0), yOf(MMAX));
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,80,70,.15)';
  ctx.fill();
  /* 8 t 封顶竖直虚线 */
  ctx.strokeStyle = 'rgba(150,160,175,.5)';
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(xOf(rEdge), yOf(MMAX)); ctx.lineTo(xOf(rEdge), yOf(0)); ctx.stroke();
  ctx.setLineDash([]);
  /* 特性曲线 */
  ctx.strokeStyle = acc;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let r = 1.2; r <= RMAX; r += 0.6) {
    const px = xOf(r), py = yOf(allowed(r));
    r <= 1.3 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.lineWidth = 1;
  /* 坐标轴与刻度 */
  ctx.strokeStyle = 'rgba(128,150,170,.25)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(0)); ctx.lineTo(W - padR, yOf(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt;
  for (const [r, lab] of [[0, '0'], [20, '20'], [40, '40'], [56, '56']]) ctx.fillText(lab, xOf(r) - 6, H - padB + 16);
  for (const m of [4, 8, 12]) ctx.fillText(`${m}`, 22, yOf(m) + 4);
  ctx.fillText(L('幅度 R/m', 'radius R/m'), W - padR - 62, H - padB + 16);
  ctx.fillText(L('吊重 t', 'load t'), padL + 6, padT + 12);
  ctx.fillText(L('超限区', 'overload'), xOf(44), yOf(6.2));
  /* 当前工况动点 */
  const mNow = mCur * hf;
  const bad = lastSt && lastSt.alarm === 'F';
  ctx.fillStyle = bad ? '#ff6b6b' : '#7bd88f';
  ctx.beginPath();
  ctx.arc(xOf(clamp(rCur, 0, RMAX)), yOf(clamp(mNow, 0, MMAX)), 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillText(`(${rCur.toFixed(0)}, ${mNow.toFixed(1)})`, xOf(rCur) + 9, yOf(mNow) - 6);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elR = document.getElementById('sR'), elRVal = document.getElementById('sRVal');
const elM = document.getElementById('sM'), elMVal = document.getElementById('sMVal');
const elCw = document.getElementById('sCw'), elCwVal = document.getElementById('sCwVal');
const stML = document.getElementById('stML'), stMC = document.getElementById('stMC'),
  stNet = document.getElementById('stNet'), stSig = document.getElementById('stSig'),
  stR = document.getElementById('stR'), stSt = document.getElementById('stSt');
const formulaEl = document.getElementById('formula');
const btnHoist = document.getElementById('btnHoist'), btnSlew = document.getElementById('btnSlew');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elR.value = rTgt; elRVal.textContent = `${rTgt.toFixed(1)} m`;
  elM.value = mTgt; elMVal.textContent = `${mTgt.toFixed(1)} t`;
  elCw.value = cwTgt; elCwVal.textContent = `${cwTgt.toFixed(1)} t`;
}
function syncBtns() {
  btnHoist.textContent = hoistTgt > 0.5 ? L('放下', 'Lower') : L('起吊', 'Hoist');
  btnHoist.classList.toggle('on', hoistTgt > 0.5);
}
function updateStats() {
  const st = calcState();
  lastSt = st;
  netCur = st.net;
  stML.innerHTML = `${st.Ml.toFixed(0)}<small> kN·m</small>`; stML.className = 'v' + (st.alarm === 'F' ? ' bad' : st.Ml > 800 ? ' warn' : '');
  stMC.innerHTML = `${st.Mc.toFixed(0)}<small> kN·m</small>`;
  const sig = Math.abs(st.net) / 7.7;
  stNet.innerHTML = `${st.net >= 0 ? '+' : ''}${st.net.toFixed(0)}<small> kN·m</small>`; stNet.className = 'v' + (Math.abs(st.net) > 1100 ? ' bad' : Math.abs(st.net) > 700 ? ' warn' : '');
  stSig.innerHTML = `${sig.toFixed(0)}<small> MPa</small>`; stSig.className = 'v' + (sig > 140 ? ' bad' : sig > 90 ? ' warn' : '');
  stR.innerHTML = `${rCur.toFixed(1)}<small> m · </small>${(mCur * hf).toFixed(1)}<small> t</small>`;
  stSt.textContent = st.alarm === '' ? L('安全', 'safe') : L('超限', 'overload'); stSt.className = 'v ' + (st.alarm === '' ? 'ok' : 'bad');
}
function updateFormula() {
  const Ml = mTgt * hoistTgt * G0 * rTgt;
  const Mc = cwTgt * G0 * D_CW;
  const net = Ml - Mc;
  const sig = (Math.abs(net) / 7.7).toFixed(0);
  const netS = (net >= 0 ? '+' : '') + net.toFixed(0);
  formulaEl.innerHTML = L(
    `<b>天平两侧:M_load = m·g·R = ${mTgt.toFixed(1)} × 9.8 × ${rTgt.toFixed(1)} = ${Ml.toFixed(0)} kN·m</b>;配重 M_cw = ${cwTgt.toFixed(1)} t × 9.8 × 10 m = ${Mc.toFixed(0)} kN·m<br>` +
    `<b>净力矩 M_net = M_load − M_cw = ${netS} kN·m(前倾为正)</b> → 塔身根部弯曲应力 σ = M_net/W ≈ ${sig} MPa(W ≈ 0.0077 m³)<br>` +
    `<b>额定力矩 1000 kN·m → 允许吊重 m ≤ min(8, 1000/(9.8R)) t</b>:56 m 臂端 1.8 t,12.8 m 以内封顶 8 t<br>` +
    `<b>超载为何弯塔身不断绳</b>:钢丝绳安全系数 5–6;一侧弦杆受压接近 ~200 MPa 即触发 Euler 失稳,屈曲突发、几乎无预警<br>` +
    `<b>简化与实况</b>:演示忽略自重与风载;实机 6 级风(≥10.8 m/s)停工,力矩限制器约在 110% 额定力矩时报警断起升`,
    `<b>Two pans: M_load = m·g·R = ${mTgt.toFixed(1)} x 9.8 x ${rTgt.toFixed(1)} = ${Ml.toFixed(0)} kN·m</b>; ballast M_cw = ${cwTgt.toFixed(1)} t x 9.8 x 10 m = ${Mc.toFixed(0)} kN·m<br>` +
    `<b>Net moment M_net = ${netS} kN·m (nose-heavy positive)</b> → mast-base bending stress σ = M/W ≈ ${sig} MPa (W ≈ 0.0077 m³)<br>` +
    `<b>Rated moment 1000 kN·m → allowed m ≤ min(8, 1000/(9.8R)) t</b>: 1.8 t at the 56 m tip, capped at 8 t inside 12.8 m<br>` +
    `<b>Why the mast fails first, not the rope</b>: rope safety factor is 5–6; chord compression nearing ~200 MPa triggers Euler buckling — sudden, no warning<br>` +
    `<b>Simplifications</b>: self-weight and wind ignored; real cranes stop at force 6 wind (≥10.8 m/s) and the moment limiter trips near 110% of rating`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot(); applyView();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elR.addEventListener('input', () => { rTgt = +elR.value; syncSliders(); updateFormula(); });
elM.addEventListener('input', () => { mTgt = +elM.value; syncSliders(); updateFormula(); });
elCw.addEventListener('input', () => { cwTgt = +elCw.value; syncSliders(); updateFormula(); });
btnHoist.addEventListener('click', () => {
  hoistTgt = hoistTgt > 0.5 ? 0 : 1;
  notify(hoistTgt > 0.5
    ? L('起吊:吊重离地,力矩 m·g·R 随幅度加载到塔身', 'hoisting: the load leaves the ground, moment m·g·R loads the mast')
    : L('放下:吊重回地,起重侧力矩卸载', 'lowering: the load is grounded, the load moment unloads'));
  syncBtns();
});
btnSlew.addEventListener('click', () => {
  slewTgt += Math.PI / 2;
  notify(L('回转 90°:整台天平绕塔身轴旋转,平衡与方位无关', 'slewing 90°: the whole balance rotates about the mast axis — balance is azimuth-free'));
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglStress').addEventListener('change', e => { stressOn = e.target.checked; applyView(); });
document.getElementById('tglPend').addEventListener('change', e => {
  pendantOn = e.target.checked;
  applyView();
  notify(pendantOn
    ? L('拉杆复位:塔尖三角悬挂把悬臂吊平', 'pendants on: the A-frame hang stiffens the jib')
    : L('拆下拉杆:悬臂失去上支撑,臂尖下垂', 'pendants off: no upper support, the jib tip droops'));
});
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
const tmpV = new THREE.Vector3();
const leanAxis = phi => v3(-Math.sin(phi), 0, -Math.cos(phi));
function springStep(s, target, dt) {
  s.v += ((target - s.x) * 9 - s.v * 2.4) * dt;
  s.x += s.v * dt;
}
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  simT += dt;
  /* 状态平滑(滑杆拖动即时可见) */
  const kf = 1 - Math.exp(-6 * dt0);
  const rPrev = rCur;
  rCur += (rTgt - rCur) * kf;
  mCur += (mTgt - mCur) * kf;
  cwCur += (cwTgt - cwCur) * kf;
  if (dt > 0) {
    hf += clamp(hoistTgt - hf, -dt * 0.45, dt * 0.45);
    const sPrev = slewCur;
    slewCur += clamp(slewTgt - slewCur, -dt * 0.55, dt * 0.55);
    const rVel = (rCur - rPrev) / Math.max(dt, 1e-4);
    const sVel = (slewCur - sPrev) / Math.max(dt, 1e-4);
    springStep(swR, clamp(-rVel * 0.09, -0.3, 0.3) + 0.012 * Math.sin(simT * 0.9), dt);
    springStep(swT, clamp(sVel * 0.15, -0.35, 0.35), dt);
  }
  /* 工况与报警沿 */
  const st = calcState();
  netCur = st.net;
  if (st.alarm !== prevAlarm) {
    if (st.alarm === 'F') notify(`力矩超限:M_load = ${st.Ml.toFixed(0)} kN·m > 1000,弦杆受压接近失稳`, `overload: M = ${st.Ml.toFixed(0)} kN·m > 1000, chords near buckling`, 3.4);
    if (st.alarm === 'B') notify('后倾超限:配重净矩 > 1100 kN·m,整机后仰', 'tail-heavy: net counter moment > 1100 kN·m, leaning back', 3.4);
    prevAlarm = st.alarm;
  }
  /* 位姿:回转 / 小车 / 吊绳 / 吊重 */
  slewGrp.rotation.y = slewCur;
  trolley.position.x = rCur / U;
  const s = loadSize();
  const lenDown = 14.13 - s;
  const ropeLen = lenDown + (2.3 - lenDown) * hf;
  ropeGrp.rotation.z = swR.x;
  ropeGrp.rotation.x = swT.x;
  ropeMesh.scale.y = ropeLen; ropeMesh.position.y = -ropeLen / 2;
  hookGrp.position.y = -ropeLen;
  loadMesh.scale.setScalar(s); loadMesh.position.y = -ropeLen - 0.15 - s / 2;
  /* 倾覆:净力矩→朝臂侧/配重侧的刚性倾斜 + 超限摆动 */
  const leanTgt = clamp(netCur / 1400, -1, 1) * 0.05 + (st.alarm ? 0.009 * Math.sin(simT * 3.1) : 0);
  leanCur += (leanTgt - leanCur) * (1 - Math.exp(-3.5 * dt0));
  leanGrp.quaternion.setFromAxisAngle(leanAxis(slewCur), leanCur);
  /* 拉杆拆掉后臂尖下垂 */
  jibGrp.rotation.z += ((pendantOn ? 0 : -0.06) - jibGrp.rotation.z) * (1 - Math.exp(-4 * dt0));
  /* 应力带 / 挠度线 / 吊重颜色 / 当前幅度圈 */
  updateStress(); updateBend(); updateLoadColor(st);
  hookGrp.getWorldPosition(tmpV);
  ringCur.position.set(tmpV.x, 0.03, tmpV.z); ringCur.scale.set(rCur / U, 1, rCur / U);
  /* 配重块高度 */
  cwBlock.scale.y = 0.25 + cwCur / 18 * 1.05; cwBlock.position.y = 0.4 + cwBlock.scale.y / 2;
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
applyView();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
</html>
