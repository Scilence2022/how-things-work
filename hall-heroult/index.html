  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; transition: background .25s; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);

  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;

  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }

  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);

  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) { #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); } #title h1 { font-size: 16px; } }
</style>

<div id="title">
  <h1 data-zh="霍尔–埃鲁法电解铝 · 铝是电出来的" data-en="Hall–Héroult Cells · Aluminum Is Won by Electricity">霍尔–埃鲁法电解铝 · 铝是电出来的</h1>
  <div class="sub" data-zh="氧化铝的 Al–O 键太顽固:铁矿石 800 °C 就被 CO 卸氧,而碳直接还原 Al₂O₃ 要 2000 °C 以上还生成 Al₄C₃——铝等不来自己的高炉。1886 年霍尔与埃鲁把 Al₂O₃ 溶进 960 °C 冰晶石熔盐通大电流:Al³⁺ 在阴极得 3e⁻ 变铝水沉底,O²⁻ 游向阳极交出电子、顺手把碳阳极烧成 CO₂,碳以约 0.42 kg/kg 铝的速度自我牺牲;槽压 4.0–4.2 V 中约 3/4 是欧姆热,吨铝直流电耗 13–15 MWh,全球电解铝年耗电近 1 万亿度——铁靠化学还原,铝靠电解 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="The Al–O bond in alumina is stubborn: iron ore yields to CO at 800 °C, but carbothermic Al₂O₃ needs over 2000 °C and forms Al₄C₃ — aluminum never got its blast furnace. In 1886 Hall and Héroult dissolved Al₂O₃ in 960 °C molten cryolite and passed huge current: Al³⁺ gains 3e⁻ at the cathode and pools as liquid metal; O²⁻ swims to the anode, hands over electrons and burns the carbon into CO₂ — the anode sacrifices itself at ~0.42 kg C per kg Al; of the 4.0–4.2 V cell voltage about 3/4 is ohmic heat, 13–15 MWh DC per tonne, nearly 1,000 TWh a year worldwide — iron by chemistry, aluminum by electricity · 3D interactive demo · drag to orbit · Space = run/pause">霍尔–埃鲁法电解铝 · 铝是电出来的</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x14101d, 22, 72);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x14101d : 0xe7e2f1);
  scene.fog.color = new THREE.Color(dark ? 0x14101d : 0xe7e2f1);
  groundM.color.setHex(dark ? 0x1b1622 : 0xc8c0da); shellM.color.setHex(dark ? 0x4c4658 : 0x9d95ad);
  insulM.color.setHex(dark ? 0x5c4536 : 0xb59a82); cathM.color.setHex(dark ? 0x2d2d33 : 0x7c7c85);
  anodeM.color.setHex(dark ? 0x38383f : 0x84848d); crustM.color.setHex(dark ? 0x8c8779 : 0xcdc8ba);
  bathM.color.setHex(dark ? 0xbdaaf0 : 0xa48ce8); metalM.color.setHex(dark ? 0xe2e6f0 : 0xb6bdcd);
  busM.color.setHex(dark ? 0xb3b9c6 : 0x8e95a3); stemM.color.setHex(dark ? 0x6f7787 : 0x9aa2b0);
  ladleM2.color.setHex(dark ? 0x312c3d : 0x968fa6); hopM.color.setHex(dark ? 0x504a5e : 0x9c94ac);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('霍尔–埃鲁法电解铝 · 铝是电出来的', 'The Hall–Héroult Process · Aluminum Is Won by Electricity');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.localClippingEnabled = true;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);

const IONS = 170, N_AL = 85;
const ionGeo = new THREE.BufferGeometry();

const C_AL = new THREE.Color(0xb9a4ff), C_OX = new THREE.Color(0xff6a4a);
const ionP = [];
function respawnIon(p, alu) {
  p.age = Math.random() * 10; p.seed = Math.random() * 6;
  p.x = (Math.random() * 2 - 1) * 2.9;
  p.z = (Math.random() * 2 - 1) * 1.0;
  p.y = 1.25 + Math.random() * (2.45 - 1.25);
  if (alu) { p.tx = (Math.random() * 2 - 1) * 2.9; p.tz = (Math.random() * 2 - 1) * 0.95; }
  else {
    const a = anodes[(Math.random() * anodes.length) | 0];
    p.ai = a; p.tx = a.x + (Math.random() * 2 - 1) * 0.5; p.tz = a.z + (Math.random() * 2 - 1) * 0.3;
  }
}
for (let i = 0; i < IONS; i++) {
  const p = { tp: i < N_AL ? 0 : 1, x: 0, y: 0, z: 0, tx: 0, tz: 0, ty: 0, ai: null, age: 0, seed: 0 };
  respawnIon(p, p.tp === 0);
  ionP.push(p);
}
function stepIons(dt) {
  if (!ionOn) return;
  const mTop = metalTop() + 0.03;
  for (const p of ionP) {
    p.age += dt;
    if (p.tp === 0) {
      const dx = p.tx - p.x, dz = p.tz - p.z, dy = mTop - p.y;
      const d = Math.hypot(dx, dy, dz) || 1;
      const sp = (0.55 + 0.25 * Math.sin(p.age * 2 + p.seed)) * dt;
      p.x += dx / d * sp; p.y += dy / d * sp; p.z += dz / d * sp;
      if (dy < 0.02) respawnIon(p, true);            // 得 3e⁻ 并入铝层
    } else {
      const a = p.ai;
      const ty = anodeBottom(a) + 0.03;
      const dx = p.tx - p.x, dz = p.tz - p.z, dy = ty - p.y;
      const d = Math.hypot(dx, dy, dz) || 1;
      const sp = (0.5 + 0.22 * Math.sin(p.age * 2 + p.seed)) * dt;
      p.x += dx / d * sp; p.y += dy / d * sp; p.z += dz / d * sp;
      if (d < 0.07) {                                 // 交 4e⁻,烧碳出 CO₂
        if (!anodeEff && Math.random() < 0.45) spawnFx(p.x, ty, p.z, 1);
        respawnIon(p, false);
      }
    }
  }
}
function drawIons() {
  for (let i = 0; i < IONS; i++) {
    const p = ionP[i], c = p.tp === 0 ? C_AL : C_OX;
    if (!ionOn) { ionPos[i * 3 + 1] = -999; continue; }
    ionPos[i * 3] = p.x; ionPos[i * 3 + 1] = p.y; ionPos[i * 3 + 2] = p.z;
    ionCol[i * 3] = c.r; ionCol[i * 3 + 1] = c.g; ionCol[i * 3 + 2] = c.b;
  }
  ionGeo.attributes.position.needsUpdate = true;
  ionGeo.attributes.color.needsUpdate = true;
}
/* 通用特效粒子:tp 0=电弧火花 1=CO₂气泡 2=出铝流 3=氧化铝尘 */
const FX_MAX = 220;
const fxGeo = new THREE.BufferGeometry();
const fxPos = new Float32Array(FX_MAX * 3), fxCol = new Float32Array(FX_MAX * 3);
fxGeo.setAttribute('position', new THREE.BufferAttribute(fxPos, 3));
fxGeo.setAttribute('color', new THREE.BufferAttribute(fxCol, 3));
const fxPoints = new THREE.Points(fxGeo, new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
fxPoints.frustumCulled = false;

const fx = [];
const C_ARC = new THREE.Color(0xc4ffd6), C_BUB = new THREE.Color(0xdde4f0), C_STR = new THREE.Color(0xffd9a0), C_DUST = new THREE.Color(0xf2ecff);
function spawnFx(x, y, z, tp) {
  if (fx.length >= FX_MAX) return;
  const p = { x, y, z, tp, age: 0, life: 1 };
  if (tp === 0) { p.vx = (Math.random() - 0.5) * 2.4; p.vy = 1.2 + Math.random() * 2.0; p.vz = (Math.random() - 0.5) * 1.6; p.life = 0.3 + Math.random() * 0.45; }
  else if (tp === 1) { p.vx = 0; p.vy = 0.5 + Math.random() * 0.35; p.vz = 0; p.life = 4; }
  else if (tp === 2) { p.vx = 1.43; p.vy = 0.9; p.vz = 1.14; p.life = 0.72; }
  else { p.vx = (Math.random() - 0.5) * 0.2; p.vy = -0.5 - Math.random() * 0.3; p.vz = (Math.random() - 0.5) * 0.2; p.life = 2; }
  fx.push(p);
}
let bubAcc = 0, arcAcc = 0, dustAcc = 0;
function stepFx(dt) {
  if (ionOn && !anodeEff) {
    bubAcc += dt * 4.5 * (I_kA / 300);
    while (bubAcc > 1) { bubAcc -= 1; const a = anodes[(Math.random() * anodes.length) | 0]; spawnFx(a.x + (Math.random() * 2 - 1) * 0.5, anodeBottom(a) + 0.02, a.z + (Math.random() * 2 - 1) * 0.3, 1); }
  }
  if (anodeEff) {
    arcAcc += dt * 90;
    while (arcAcc > 1) { arcAcc -= 1; const a = anodes[(Math.random() * anodes.length) | 0]; spawnFx(a.x + (Math.random() * 2 - 1) * 0.62, anodeBottom(a) + 0.04, a.z + (Math.random() * 2 - 1) * 0.4, 0); }
  }
  if (feedT > 0) {
    dustAcc += dt * 26;
    while (dustAcc > 1) { dustAcc -= 1; spawnFx(0.95 + (Math.random() - 0.5) * 0.12, 2.82, (Math.random() - 0.5) * 0.12, 3); }
  }
  if (tapT > 0) for (let k = 0; k < 3; k++) spawnFx(LX / 2 + 0.62, 1.04, 0.15, 2);
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    p.age += dt;
    if (p.tp === 0) { p.vy -= 5.5 * dt; }
    else if (p.tp === 2) { p.vy -= 2.0 * dt; }
    else if (p.tp === 1) { p.vx = 0.12 * Math.sin(p.age * 6 + p.x * 5); p.vz = 0.1 * Math.cos(p.age * 5 + p.z * 5); }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    const dead = p.age > p.life
      || (p.tp === 1 && p.y > 2.52)
      || (p.tp === 3 && p.y < 2.45)
      || (p.tp === 2 && p.age > 0.7)
      || (p.tp === 0 && p.y < 1.0);
    if (dead) { fx[i] = fx[fx.length - 1]; fx.pop(); }
  }
}
function drawFx() {
  for (let i = 0; i < FX_MAX; i++) {
    if (i < fx.length) {
      const p = fx[i];
      const c = p.tp === 0 ? C_ARC : p.tp === 1 ? C_BUB : p.tp === 2 ? C_STR : C_DUST;
      fxPos[i * 3] = p.x; fxPos[i * 3 + 1] = p.y; fxPos[i * 3 + 2] = p.z;
      fxCol[i * 3] = c.r; fxCol[i * 3 + 1] = c.g; fxCol[i * 3 + 2] = c.b;
    } else fxPos[i * 3 + 1] = -999;
  }
  fxGeo.attributes.position.needsUpdate = true;
  fxGeo.attributes.color.needsUpdate = true;
}

function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:槽压构成堆叠图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#a89fc0';
  const accC = css.getPropertyValue('--acc').trim() || '#b197fc';
  const padL = 64, padR = 64, padT = 10, padB = 40;
  const cur = vComp(I_kA, acd, alumina, anodeEff);
  const ref = vComp(300, 4.5, 2.5, false);
  const vMax = anodeEff ? 40 : 5;
  ctx.font = '11px system-ui';
  /* 轴 */
  ctx.strokeStyle = 'rgba(140,130,170,.3)';
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt;
  const ticks = anodeEff ? [0, 10, 20, 30, 40] : [0, 1, 2, 3, 4, 5];
  for (const t of ticks) {
    ctx.fillText(t + 'V', padL - 26, H - padB - (t / vMax) * (H - padT - padB) + 4);
    ctx.beginPath(); ctx.moveTo(padL, H - padB - (t / vMax) * (H - padT - padB));
    ctx.lineTo(W - padR, H - padB - (t / vMax) * (H - padT - padB));
    ctx.strokeStyle = 'rgba(140,130,170,.12)'; ctx.stroke();
  }
  const bars = [
    { c: cur, y: padT + 6, name: L('当前', 'now') },
    { c: ref, y: padT + (H - padT - padB) / 2 + 14, name: L('基准', 'base') }
  ];
  const segs = s => [
    [s.dec, '#74c0fc', L('分解', 'decomp')],
    [s.ano, '#ffa94d', L('过电位', 'overpot')],
    [s.ohm, accC, L('欧姆', 'ohmic')],
    [s.oth, '#8d8598', L('其他', 'other')],
    [s.arc, '#ff6b6b', L('电弧', 'arc')]
  ];
  for (const b of bars) {
    const bh = 34;
    let x = padL;
    for (const [v, col, lab] of segs(b.c)) {
      if (v <= 0.001) continue;
      const x1 = padL + clamp((x - padL + v) / vMax, 0, 1) * (W - padL - padR);
      ctx.fillStyle = col;
      ctx.fillRect(x, b.y, x1 - x, bh);
      if (x1 - x > 30) {
        ctx.fillStyle = '#1c1526';
        ctx.fillText(v.toFixed(v >= 10 ? 0 : 2), x + (x1 - x) / 2 - 10, b.y + bh / 2 + 4);
      }
      x = x1;
    }
    ctx.fillStyle = cTxt;
    ctx.fillText(b.name, padL - 40, b.y + bh / 2 + 4);
    ctx.fillText('Σ ' + (b.c.dec + b.c.ano + b.c.ohm + b.c.oth + b.c.arc).toFixed(anodeEff && b.c === cur ? 0 : 2) + ' V', x + 6, b.y + bh / 2 + 4);
  }
  /* 图例 */
  const ly = H - padB + 14;
  let lx = padL;
  for (const [v, col, lab] of segs(cur)) {
    ctx.fillStyle = col;
    ctx.fillRect(lx, ly - 8, 10, 10);
    ctx.fillStyle = cTxt;
    ctx.fillText(lab, lx + 13, ly + 1);
    lx += 24 + ctx.measureText(lab).width * 1.15;
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function stepSim(dt) {
  /* 电解产铝:法拉第 + 电流效率 */
  metalLvl = clamp(metalLvl + I_kA * 9e-6 * ceEff() * dt, 0.08, 0.4);
  /* 阳极消耗:~0.42 kg C/kg Al(演示加速) */
  for (const a of anodes) {
    a.consumed += I_kA * 2.1e-5 * dt * (anodeEff ? 1.5 : 1);
    if (a.consumed > 0.62) a.consumed = 0.001;
  }
  /* 打壳下料:周期补氧化铝 */
  feedAcc -= dt;
  if (feedAcc <= 0) { feedAcc = 2.6; feedT = 0.4; }
  if (feedT > 0) feedT -= dt;
  /* 阳极效应逻辑:浓度 <1.4% 自动触发,>1.8% 自动解除,强制触发需手动解除 */
  if (!anodeEff && alumina < 1.4) {
    aeTimer += dt;
    if (aeTimer > 1.0) {
      anodeEff = true; aeForced = false; aeTimer = 0;
      notify('氧化铝浓度跌破 1.4%,阳极效应自动触发', 'alumina fell below 1.4%: anode effect auto-triggered');
      syncBtns();
    }
  } else if (!anodeEff) aeTimer = 0;
  if (anodeEff && !aeForced && alumina > 1.8) {
    anodeEff = false;
    notify('氧化铝浓度回升,效应解除,槽压回落', 'alumina restored: effect cleared, voltage falls back');
    syncBtns();
  }
  /* 出铝 */
  if (tapT > 0) {
    tapT -= dt;
    metalLvl = clamp(metalLvl - dt * 0.09, 0.08, 0.4);
  } else ladleHot.visible = false;
}
function syncLevels() {
  const bh = BATH_TOP - metalTop();
  metalBody.scale.y = metalLvl;
  metalBody.position.y = CATH_Y + metalLvl / 2;
  bathBody.scale.y = bh / 1.55;
  bathBody.position.y = metalTop() + bh / 2;
  hammer.position.y = feedT > 0 ? 2.86 - 0.16 * Math.abs(Math.sin(feedT * 22)) : 2.86;
  bathLight.intensity = anodeEff ? 2.0 : (heatOn ? 1.2 + 0.15 * Math.sin(simT * 3) : 0.25);
  if (anodeEff) {
    const fl = 0.6 + 0.4 * Math.sin(simT * 23) + 0.2 * Math.random();
    aeLight.intensity = 4 + 5 * fl;
    bathM.emissiveIntensity = heatOn ? 0.55 + 0.3 * fl : 0.15;
  } else {
    aeLight.intensity = 0;
    bathM.emissiveIntensity = heatOn ? 0.4 : 0.08;
  }
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    simT += dt;
    stepSim(dt);
    stepIons(dt);
    stepFx(dt);
  }
  drawIons();
  drawFx();
  syncAnodes();
  syncLevels();
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.15) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
syncAnodes();
syncLevels();
syncAll();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
