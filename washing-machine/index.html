<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滚筒洗衣机 · 先过共振,再谈脱水</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#9775fa;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#7048e8;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(151,117,250,.9); color: #e5dbff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#7048e8; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.b { color: #e5dbff; border-color: rgba(151,117,250,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  :root[data-theme="light"] .chip.b { color:#7048e8; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.o { color:#a34e00; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(151,117,250,.6); background: rgba(151,117,250,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(112,72,232,.55); background: rgba(112,72,232,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(151,117,250,.10); border-color: rgba(151,117,250,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(112,72,232,.08); border-color: rgba(112,72,232,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #e5dbff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 20, 66);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
  shellM.color.setHex(dark ? 0xdfe3e8 : 0xcfd6dd);
  frameM.color.setHex(dark ? 0x454d59 : 0x9aa5b1);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('滚筒洗衣机 · 先过共振,再谈脱水', 'Drum Washer · Cross Resonance Before You Spin');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 140);
camera.position.set(5.6, 3.4, 9.4);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(6, 9, 7);

function helixGeo(turns, h, r) {

  for (let i = 0; i <= n; i++) {

    pts.push(new THREE.Vector3(Math.cos(t * turns * 2 * Math.PI) * r, -t * h, Math.sin(t * turns * 2 * Math.PI) * r));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), n, 0.045, 6, false);
}

/* ---------------- 物理推进 ================= */
function retune() {
  mass = 30 + waterL * 0.55;
  cDamp = 2 * zeta * Math.sqrt(kTot * mass);
  wn = Math.sqrt(kTot / mass);
  wnRpm = wn / RPM2RAD;
}
function setMode(m) {
  mode = m;
  if (m === 'redistribute') { redisT = 0; }
  if (m === 'spin') aboveT = 0;
}
function startSpin() {
  attempts = 0;
  setMode('spin');
  notifyT = 2.2;
  notifyZ = `升速目标 ${rpmTarget} rpm:先以小加速度爬过共振区`;
  notifyE = `spin target ${rpmTarget} rpm: climb gently through resonance first`;
}
function startWash() {
  setMode('wash');
  notifyT = 2;
  notifyZ = '滚揉:60 rpm 正反转,把衣物抛起再摔下';
  notifyE = 'tumble wash: 60 rpm, reversing, tossing the load';
}
function clumpLoad() {
  meKg = Math.max(meKg, 0.45);
  lump.a = Math.random() * 6.28;
  setMode('wash');
  notifyT = 2.6;
  notifyZ = '衣物抱团:红色偏载团贴在筒壁,试试把它拖到别的位置';
  notifyE = 'load clumped: the red lump sticks to the drum wall — drag it around';
}
function redistribute() {
  setMode('redistribute'); syncSliders(); syncBtns();
  notifyT = 2.2;
  notifyZ = '降速翻滚:偏心质量散开,不平衡量 m·r 归零';
  notifyE = 'slow re-tumble: the clump spreads out, imbalance m·r collapses';
}
function simStep(dt) {
  retune();
  /* 目标转速与模式逻辑 */
  let wTarget = 0, ramp = 3.2;
  if (mode === 'spin') {
    wTarget = rpmTarget * RPM2RAD;
    ramp = omega < wn * 1.35 ? 2.4 : 7;
  } else if (mode === 'wash') {
    washT += dt;
    if (washT > 3.2) { washT = 0; washDir *= -1; }
    wTarget = washDir * 6.3; ramp = 4;
  } else if (mode === 'redistribute') {
    redisT += dt;
    wTarget = 6.3; ramp = 5;
    meKg = Math.max(0.06, meKg - dt * 0.28);
    blobs.forEach((b, i) => { b.a = lerp(b.a, i * Math.PI / 2 + 0.4, dt * 1.4); });
    lump.a = lerp(lump.a, blobs[3].a + 1.4, dt * 1.4);
    if (meKg <= 0.061 && redisT > 2.6) {
      setMode(attempts < 3 ? 'spin' : 'limited');
      if (attempts < 3) { attempts++; notifyT = 2; notifyZ = '分布均匀,第 ' + attempts + ' 次爬升'; notifyE = 'load even, climb #' + attempts; }
      else { notifyT = 2.6; notifyZ = '仍不平衡:限制在低速甩干,不再冲击共振区'; notifyE = 'still unbalanced: held at low-speed spin, resonance avoided'; }
    }
  } else if (mode === 'limited') {
    wTarget = 400 * RPM2RAD; ramp = 2;
  }
  omega += clamp(wTarget - omega, -ramp * dt * 2, ramp * dt);
  if (Math.abs(omega) < 0.02 && wTarget === 0) omega = 0;
  theta += omega * dt;
  /* 离心力激励(旋转矢量) */
  const exc = theta + lump.a;
  fNow = meKg * ECC_R * omega * omega;
  const fx = -fNow * Math.cos(exc), fy = -fNow * Math.sin(exc);
  /* 双自由度悬挂:半隐式欧拉子步 */
  const n = 8, h = dt / n;
  const kB = 3.2e5; // 行程限位缓冲 N/m(±35 mm 后)
  for (let i = 0; i < n; i++) {
    const kx = x > 0.035 ? kB * (x - 0.035) : x < -0.035 ? kB * (x + 0.035) : 0;
    const ky = y > 0.035 ? kB * (y - 0.035) : y < -0.035 ? kB * (y + 0.035) : 0;
    vx += (fx / mass - (kTot * x + kx + cDamp * vx) / mass) * h;
    vy += (fy / mass - (kTot * y + ky + cDamp * vy) / mass) * h;
    x += vx * h; y += vy * h;
  }
  x = clamp(x, -0.055, 0.055); y = clamp(y, -0.055, 0.055);
  /* 峰值包络 + 不平衡保护 */
  env = Math.max(Math.abs(y) * 1000, env - env * 1.4 * dt);
  if (mode === 'spin') {
    if (env > AMP_LIMIT && omega > wTarget * 0.3) aboveT += dt;
    else aboveT = Math.max(0, aboveT - dt * 0.6);
    if (aboveT > TRIP_HOLD) {
      aboveT = 0;
      marks.push({ t: simT, k: 'trip' });
      notifyT = 2.8;
      notifyZ = `振幅 ${env.toFixed(0)} mm 超限持续 ${TRIP_HOLD}s:传感器触发,退回重新分布`;
      notifyE = `amplitude ${env.toFixed(0)} mm over limit for ${TRIP_HOLD}s: sensor trips, back to re-tumble`;
      setMode('redistribute');
      syncSliders(); syncBtns();
    }
    if (omega >= wTarget * 0.995 && !marks.some(m => m.k === 'ok' && simT - m.t < 30)) marks.push({ t: simT, k: 'ok' });
  }
  /* 衣物团运动 */
  const spinPin = Math.abs(omega) > 22;
  for (const b of [...blobs, lump]) {
    if (spinPin) {
      b.falling = false; b.fy = 0;
    } else if (!b.falling) {
      b.a += omega * dt;
      if (b.a > 1.95) { b.falling = true; b.fy = 0; b.px = Math.cos(1.95) * (DR - b.r - 0.1); }
    } else {
      b.fy -= 9.8 * dt * 0.45;
      if (b.fy < -(DR - b.r - 0.12)) { b.falling = false; b.fy = 0; b.a = -Math.PI / 2 + (Math.random() - 0.5) * 0.4; }
    }
  }
  /* 采样 */
  if (buf.length === 0 || simT - buf[buf.length - 1].t > 0.06) {
    simT += dt;
    buf.push({ t: simT, amp: env, rpm: Math.abs(omega) / RPM2RAD });
    while (buf.length && simT - buf[0].t > 40) buf.shift();
  } else simT += dt;
  while (marks.length && simT - marks[0].t > 40) marks.shift();
}

    d: '外壳位移就是传感器:振幅峰值连续 0.9 s 超过 12 mm 且转速已上目标三成,判为不平衡——撤掉升速目标、退回 60 rpm 翻滚,把抱团的衣物抖散;连续三次失败后转为受限低速甩干,不再硬闯共振区。',
    de: 'Case motion is the sensor: if peak amplitude exceeds 12 mm for 0.9 s while speed is past 30% of target, the load is judged unbalanced — the target is dropped, the drum re-tumbles at 60 rpm to shake the clump apart; after three failures it settles for a restricted low-speed spin instead of forcing resonance.',
    act: () => { phaseIdx = 4; zeta = 0.12; meKg = 0.6; startSpin(); flyTo([5.2, 3.0, 8.4], [0, 0.9, 0]); } },
  { b: '重分布后:平稳通过共振区', be: 'Redistributed: smooth pass through resonance',
    d: '衣物抖匀后不平衡量 m·r 只剩 0.06·0.2=0.012 kg·m,同一共振区激励缩到 1/8,振幅只剩 2-3 mm——第二次爬升几乎无感穿过,直上 1200 rpm;水位自始至终由气管静压 p=ρgh 读出,没有一根浮子。',
    de: 'Once spread, the imbalance m·r is 0.06×0.2=0.012 kg·m — an eighth of the excitation at the same resonance, amplitude just 2-3 mm — the second climb slips through almost unnoticed straight to 1200 rpm; the water level is read the whole time from air-tube pressure p=ρgh, no float anywhere.',
    act: () => { phaseIdx = 5; zeta = 0.18; redistribute(); flyTo([3.6, 2.4, 7.0], [0, 0.8, 0]); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:振幅与转速-时间 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 40, padR = 46, padT = 16, padB = 26;
  const VIEW = 40;
  const t1 = Math.max(simT, VIEW), t0 = t1 - VIEW;
  const xOf = t => padL + clamp((t - t0) / VIEW, 0, 1) * (W - padL - padR);
  const yA = v => (H - padB) - clamp(v, 0, 40) / 40 * (H - padT - padB);
  const yR = v => (H - padB) - clamp(v, 0, 1400) / 1400 * (H - padT - padB);
  ctx.font = '13px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const v of [0, 20, 40]) {
    ctx.beginPath(); ctx.moveTo(padL, yA(v)); ctx.lineTo(W - padR, yA(v)); ctx.stroke();
    ctx.fillText(String(v), 8, yA(v) + 4);
  }
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = 'rgba(255,107,107,.55)';
  ctx.beginPath(); ctx.moveTo(padL, yA(AMP_LIMIT)); ctx.lineTo(W - padR, yA(AMP_LIMIT)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ff8787';
  ctx.fillText('12mm', 8, yA(AMP_LIMIT) - 4);
  ctx.fillText('mm', 8, padT + 2);
  ctx.fillText('rpm', W - padR + 4, padT + 2);
  for (const v of [wnRpm]) {
    ctx.setLineDash([3, 5]);
    ctx.strokeStyle = 'rgba(151,117,250,.5)';
    ctx.beginPath(); ctx.moveTo(xOf(t0), yR(v)); ctx.lineTo(W - padR, yR(v)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#b197fc';
    ctx.fillText(`ωn=${v.toFixed(0)}`, W - padR - 58, yR(v) - 4);
  }
  ctx.fillText(`${t0.toFixed(0)}s`, padL, H - padB + 18);
  ctx.fillText('now', W - padR - 22, H - padB + 18);
  if (buf.length > 1) {
    const line = (key, ymap, col, lw) => {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath();
      let started = false;
      for (const p of buf) {
        if (p.t < t0) continue;
        const px = xOf(p.t), py = ymap(p[key]);
        started ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        started = true;
      }
      ctx.stroke();
    };
    line('rpm', yR, 'rgba(116,192,252,.8)', 2);
    line('amp', yA, '#9775fa', 2.6);
    for (const m of marks) {
      if (m.t < t0) continue;
      ctx.fillStyle = m.k === 'trip' ? '#ff6b6b' : '#7bd88f';
      ctx.fillText(m.k === 'trip' ? '触发' : '达标', xOf(m.t) + 2, padT + 10);
    }
  }
  ctx.fillStyle = '#9775fa';
  ctx.fillText(L('振幅峰值', 'amplitude'), padL + 8, padT + 26);
  ctx.fillStyle = 'rgba(116,192,252,.9)';
  ctx.fillText(L('转速', 'speed'), padL + 78, padT + 26);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elRpm = document.getElementById('sRpm'), elRpmVal = document.getElementById('sRpmVal');
const elZeta = document.getElementById('sZeta'), elZetaVal = document.getElementById('sZetaVal');
const elMe = document.getElementById('sMe'), elMeVal = document.getElementById('sMeVal');
const elWater = document.getElementById('sWater'), elWaterVal = document.getElementById('sWaterVal');
const stRpm = document.getElementById('stRpm'), stAmp = document.getElementById('stAmp'),
  stImb = document.getElementById('stImb'), stF = document.getElementById('stF'),
  stZeta = document.getElementById('stZeta'), stPhase = document.getElementById('stPhase');
const formulaEl = document.getElementById('formula');
const btnSpin = document.getElementById('btnSpin'), btnWash = document.getElementById('btnWash'),
  btnLump = document.getElementById('btnLump'), btnFix = document.getElementById('btnFix');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elRpm.value = rpmTarget; elRpmVal.textContent = `${rpmTarget} rpm`;
  elZeta.value = zeta; elZetaVal.textContent = zeta.toFixed(2);
  elMe.value = meKg; elMeVal.textContent = `${meKg.toFixed(2)} kg`;
  elWater.value = waterL; elWaterVal.textContent = `${waterL} L`;
}
function syncBtns() {
  btnSpin.classList.toggle('on', mode === 'spin');
  btnWash.classList.toggle('on', mode === 'wash');
  btnFix.classList.toggle('on', mode === 'redistribute');
}
function phaseName() {
  if (mode === 'wash') return L('滚揉 60 rpm', 'tumble 60 rpm');
  if (mode === 'redistribute') return L('重新分布中', 'redistributing');
  if (mode === 'limited') return L('受限低速', 'restricted low speed');
  if (mode === 'spin') {
    if (omega < wn * 0.85) return L('升速(未到共振)', 'ramping (below ωn)');
    if (omega <= wn * 1.25) return L('过共振区', 'crossing resonance');
    return env > AMP_LIMIT * 0.6 ? L('升速(振幅偏高)', 'ramping (amplitude high)') : L('平稳脱水', 'smooth spin');
  }
  return L('待机', 'idle');
}
function updateStats() {
  stRpm.textContent = `${(Math.abs(omega) / RPM2RAD).toFixed(0)} rpm`;
  stAmp.innerHTML = `${env.toFixed(1)}<small> mm</small>`;
  stAmp.className = 'v ' + (env > AMP_LIMIT ? 'bad' : env > AMP_LIMIT * 0.5 ? 'warn' : 'ok');
  stImb.textContent = `${(meKg * ECC_R * 1000).toFixed(0)} g·m`;
  stF.innerHTML = `${fNow.toFixed(0)}<small> N</small>`;
  stF.className = 'v ' + (fNow > kTot * AMP_LIMIT / 1000 ? 'bad' : fNow > 100 ? 'warn' : '');
  stZeta.textContent = zeta.toFixed(2);
  stPhase.textContent = phaseName();
}
function updateFormula() {
  const fn = meKg * ECC_R * wn * wn;
  const aRes = fn / (kTot * 2 * zeta) * 1000;
  const h = waterL * 1e-3 / (Math.PI * 0.235 * 0.235);
  formulaEl.innerHTML = L(
    `<b>离心激励:F = m·r·ω²</b> = ${meKg.toFixed(2)}×0.20×${(Math.abs(omega)).toFixed(1)}² = ${fNow.toFixed(0)} N(1200 rpm 满偏心时 1422 N)<br>` +
    `<b>固有频率:ωn = √(k/M)</b> = √(${kTot}/${mass.toFixed(0)}) = ${wn.toFixed(1)} rad/s = ${wnRpm.toFixed(0)} rpm,注水越重越低<br>` +
    `<b>共振峰值:A ≈ F(ωn)/(k·2ζ)</b> = ${aRes.toFixed(1)} mm;阻尼比 ζ = c/(2√(kM)) = ${zeta.toFixed(2)}<br>` +
    `<b>保护逻辑:</b>振幅 > 12 mm 持续 0.9 s → 降速重分布;水位靠气管静压 p = ρgh = ${(h * 9.8).toFixed(2)} kPa<br>` +
    `<span style="opacity:.75">(画面位移放大 ${VIS_AMP} 倍显示)</span>`,
    `<b>Centrifugal drive: F = m·r·ω²</b> = ${meKg.toFixed(2)}×0.20×${(Math.abs(omega)).toFixed(1)}² = ${fNow.toFixed(0)} N (1422 N at full eccentricity, 1200 rpm)<br>` +
    `<b>Natural frequency: ωn = √(k/M)</b> = √(${kTot}/${mass.toFixed(0)}) = ${wn.toFixed(1)} rad/s = ${wnRpm.toFixed(0)} rpm, lower when water-loaded<br>` +
    `<b>Resonant peak: A ≈ F(ωn)/(k·2ζ)</b> = ${aRes.toFixed(1)} mm; damping ζ = c/(2√(kM)) = ${zeta.toFixed(2)}<br>` +
    `<b>Protection:</b> amplitude > 12 mm for 0.9 s → slow down and redistribute; level via p = ρgh = ${(h * 9.8).toFixed(2)} kPa<br>` +
    `<span style="opacity:.75">(on-screen displacement ×${VIS_AMP})</span>`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elRpm.addEventListener('input', () => { rpmTarget = +elRpm.value; syncSliders(); updateFormula(); });
elZeta.addEventListener('input', () => { zeta = +elZeta.value; syncSliders(); updateFormula(); });
elMe.addEventListener('input', () => { meKg = +elMe.value; syncSliders(); updateFormula(); });
elWater.addEventListener('input', () => { waterL = +elWater.value; layoutTubWater(); syncSliders(); updateFormula(); });
btnSpin.addEventListener('click', () => { startSpin(); syncBtns(); });
btnWash.addEventListener('click', () => { startWash(); syncBtns(); });
btnLump.addEventListener('click', () => { clumpLoad(); syncBtns(); });
btnFix.addEventListener('click', () => { redistribute(); syncBtns(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglForce').addEventListener('change', e => { forceOn = e.target.checked; fArrow.visible = forceOn && fNow > 4; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* --- 拖动偏载团 --- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let dragOn = false;
function pickLump(e) {
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  return ray.intersectObject(lumpMesh, false).length > 0;
}
function dragLump(e) {
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -(lump.z + tub.position.z));
  const hit = new THREE.Vector3();
  if (ray.ray.intersectPlane(plane, hit)) {
    lump.a = Math.atan2(hit.y - tub.position.y, hit.x - tub.position.x);
    lump.z = clamp(hit.z - tub.position.z, -DL / 2 + 0.3, DL / 2 - 0.3);
  }
}
if (webglOK) {
  renderer.domElement.addEventListener('pointerdown', e => { if (pickLump(e)) { dragOn = true; controls.enabled = false; dragLump(e); } });
  addEventListener('pointermove', e => { if (dragOn) dragLump(e); });
  addEventListener('pointerup', () => { if (dragOn) { dragOn = false; controls.enabled = true; } });
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null, simT = 0;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) simStep(dt);
  /* 场景同步:滚筒与位移(放大 VIS_AMP 倍显示) */
  const wx = x * VIS_AMP, wy = y * VIS_AMP;
  tub.position.set(wx, 0.85 + wy, 0.1);
  tub.rotation.z = -theta;
  fArrow.position.set(wx, 0.85 + wy, DL / 2 + 0.4);
  fArrow.visible = forceOn && fNow > 4;
  if (fArrow.visible) {
    const exc = theta + lump.a;
    fArrow.setDirection(new THREE.Vector3(Math.cos(exc), Math.sin(exc), 0));
    fArrow.setLength(clamp(0.5 + fNow / 900, 0.5, 3.2), 0.3, 0.16);
  }
  /* 弹簧/阻尼随位移伸缩 */
  springs.forEach((s, i) => {
    const anch = springAnchors[i];
    const tx = anch[0] * 0.84 + wx, ty = 1.6 + wy;
    const dx = tx - anch[0], dy = ty - anch[1];
    const len = Math.sqrt(dx * dx + dy * dy);
    s.g.rotation.z = Math.atan2(dx, -dy);
    s.coil.scale.y = len / SPR_L0;
    springTails[i].position.set(tx, ty, anch[2]);
  });
  dampers.forEach((d, i) => {
    const base = damperDefs[i];
    const topX = base[0] * 0.55 + wx, topY = -0.35 + wy;
    const dx = topX - base[0], dy = topY - base[1];
    const len = Math.sqrt(dx * dx + dy * dy);
    d.g.position.set(base[0], base[1], base[2]);
    d.g.rotation.z = Math.atan2(-dx, dy);
    d.rod.scale.y = Math.max(0.1, len - 0.7);
  });
  /* 衣物团位置 */
  const spinPin = Math.abs(omega) > 22;
  const place = (b, mesh) => {
    let px, py;
    if (spinPin) {
      const a = b.a + theta;
      px = Math.cos(a) * (DR - b.r - 0.06);
      py = Math.sin(a) * (DR - b.r - 0.06);
    } else if (b.falling) {
      px = b.px ?? Math.cos(1.95) * (DR - b.r - 0.1);
      py = Math.sin(1.95) * (DR - b.r - 0.1) + b.fy;
    } else {
      px = Math.cos(b.a) * (DR - b.r - 0.06);
      py = Math.sin(b.a) * (DR - b.r - 0.06);
    }
    mesh.position.set(px, py, b.z);
    mesh.rotation.z = spinPin ? b.a + theta : 0;
  };
  blobs.forEach((b, i) => place(b, blobMeshes[i]));
  place(lump, lumpMesh);
  /* 电机亮度随负载 */
  motorM.emissiveIntensity = 0.15 + Math.min(0.7, fNow / 2000) + (Math.abs(omega) > 1 ? 0.15 : 0);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
retune();
layoutTubWater();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
