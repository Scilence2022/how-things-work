<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>剪叉式升降机构 · 相似三角形放大的行程</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="剪叉式升降机构" data-en="The Scissor Lift">剪叉式升降机构</h1>
  <div class="sub" data-zh="一根液压缸顶在剪叉臂中点销上,推程被相似三角形放大 n 倍行程、力也按同一杠杆比换算:平台只能沿竖直导轨平移,负载全由臂内轴力扛——行程是白赚的,刚度与压杆稳定才是本钱 · 拖动旋转 / 空格运行/暂停" data-en="One hydraulic ram pushes the pin at the midpoint of the first arm pair: similar triangles amplify its stroke n-fold, and force converts through the same lever ratio; the platform only translates along vertical guides while the load rides entirely on axial force inside the arms — travel comes free, stiffness and buckling capacity are what you pay for · drag to orbit / Space = run/pause">一根液压缸顶在剪叉臂中点销上,推程被相似三角形放大 n 倍行程、力也按同一杠杆比换算:平台只能沿竖直导轨平移,负载全由臂内轴力扛——行程是白赚的,刚度与压杆稳定才是本钱 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="平台高度" data-en="Platform height">平台高度</span><span class="v" id="stH">—</span>
  <span class="k" data-zh="缸行程" data-en="Ram stroke">缸行程</span><span class="v" id="stS">—</span>
  <span class="k" data-zh="力放大比 负载/缸推力" data-en="Force ratio load/ram">力放大比 负载/缸推力</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="缸压" data-en="Ram pressure">缸压</span><span class="v" id="stP">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bEmpty" data-zh="三级空载" data-en="No load">三级空载</button>
    <button class="abtn" id="bFull" data-zh="三级满载" data-en="Full load">三级满载</button>
    <button class="abtn" id="bBleed" data-zh="快速泄压下降" data-en="Bleed down">快速泄压下降</button>
  </div>
  <div class="row">
    <label data-zh="液压缸行程" data-en="Ram stroke">液压缸行程</label>
    <input id="sStroke" type="range" min="0" max="1" step="0.01" value="0.15">
    <span class="val" id="sStrokeVal">0.08 m</span>
  </div>
  <div class="row">
    <label data-zh="载重" data-en="Payload">载重</label>
    <input id="sLoad" type="range" min="0" max="2000" step="50" value="0">
    <span class="val" id="sLoadVal">0 kg</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglTri" type="checkbox" checked> <span data-zh="辅助三角" data-en="Similar Δ">辅助三角</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../screw-jack/" data-zh="螺旋千斤顶" data-en="Screw jack">螺旋千斤顶</a>
    <a href="../toggle-mechanism/" data-zh="肘节机构" data-en="Toggle mechanism">肘节机构</a>
    <a href="../lever-pulley/" data-zh="杠杆与滑轮" data-en="Lever & pulley">杠杆与滑轮</a>
    <a href="../excavator-hydraulics/" data-zh="挖掘机液压" data-en="Excavator hydraulics">挖掘机液压</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-5.6,4.6,9.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.1,2.9,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面与基座 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const baseM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8});
const baseSlab=new THREE.Mesh(new THREE.BoxGeometry(5.1,0.2,2.1),baseM);
baseSlab.position.set(1.15,0.1,0);scene.add(baseSlab);
const footA=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.1,0.7),baseM);
footA.position.set(0,0.25,0);scene.add(footA);
const footB=footA.clone();footB.position.set(2.3,0.25,0);scene.add(footB);
const postM=new THREE.MeshStandardMaterial({color:0x55606e,roughness:0.55,metalness:0.35});
const aPost=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.36,0.26),postM);
aPost.position.set(2.3,0.32,0);scene.add(aPost);

/* ---- 剪叉几何与力学参数 ---- */
const BASE=0.3, HALF=1.15, AANC=2.3, YA=0.5, TH0=20, TH1=58, D2R=Math.PI/180;
const ARMZ=0.45, BORE=0.14, SELF=280;
let strokeF=0.15, targetF=0.15, load=0, auto=true, fastBleed=false, swayAmp=0, bleedActive=false;
function geom(thDeg){
  const th=thDeg*D2R, c=Math.cos(th), sn=Math.sin(th);
  const x=HALF*c, y=HALF*sn;
  const s=Math.hypot(AANC-x,BASE+y-YA);
  const sMin=Math.hypot(AANC-HALF*Math.cos(TH0*D2R),BASE+HALF*Math.sin(TH0*D2R)-YA);
  const num=(AANC-x)*(HALF*sn)+(BASE+y-YA)*(HALF*c);
  const ratio=num/(6.9*c*s);
  const W=(load+SELF)*9.81;
  const Fax=ratio>1e-4?W/ratio:W*40;
  const p=Fax/(Math.PI*BORE*BORE/4)/1e6;
  return {x,y,h:BASE+6*y,s,stroke:Math.max(0,s-sMin),ratio,Fax,p,W};
}
const thOf=f=>TH0+(TH1-TH0)*clamp(f,0,1);
let cur=geom(thOf(strokeF));

/* ---- 剪叉臂(双面各6根,实例化)+ 铰点销 ---- */
const armM=new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:0.35,metalness:0.6});
const arms=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.045,0.045,1,12),armM,12);
arms.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(arms);
const pinM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3,metalness:0.5});
const pins=new THREE.InstancedMesh(new THREE.SphereGeometry(0.06,12,10),pinM,23);
pins.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(pins);
const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),v3=new THREE.Vector3(),vY=new THREE.Vector3(0,1,0);
function orientInst(im,i,x1,y1,z1,x2,y2,z2){
  v3.set(x2-x1,y2-y1,z2-z1);const len=Math.max(1e-4,v3.length());v3.normalize();
  q.setFromUnitVectors(vY,v3);
  m4.compose(new THREE.Vector3((x1+x2)/2,(y1+y2)/2,(z1+z2)/2),q,new THREE.Vector3(1,len,1));
  im.setMatrixAt(i,m4);
}
const ACC=new THREE.Color(0xffa94d),GRY=new THREE.Color(0xcfd8e3);
for(let i=0;i<23;i++)pins.setColorAt(i,GRY);
for(const i of [8,9,10,19,20,21])pins.setColorAt(i,ACC);
pins.instanceColor.needsUpdate=true;

/* ---- 竖直导轨 + 平台 + 货箱 ---- */
const railM=new THREE.MeshStandardMaterial({color:0x6b7787,roughness:0.4,metalness:0.5});
for(const rx of [-0.35,2.65]){
  const rail=new THREE.Mesh(new THREE.BoxGeometry(0.07,6.6,0.07),railM);
  rail.position.set(rx,3.6,0.62);scene.add(rail);
  const rail2=rail.clone();rail2.position.z=-0.62;scene.add(rail2);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.1,0.3),baseM);
  foot.position.set(rx,0.35,0.62);scene.add(foot);
  const foot2=foot.clone();foot2.position.z=-0.62;scene.add(foot2);
}
const platG=new THREE.Group();scene.add(platG);
const platM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.35});
const plat=new THREE.Mesh(new THREE.BoxGeometry(3.3,0.09,1.5),platM);platG.add(plat);
/* 导轨滑块:platG 原点在 x=1.15,局部 ±1.5 才对齐世界导轨 x=∓0.35/2.65(原误用世界值导致滑块悬空) */
for(const px of [-1.5,1.5])for(const pz of [0.62,-0.62]){
  const blk=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.18,0.14),postM);
  blk.position.set(px,-0.1,pz);platG.add(blk);
}
const cargoM=new THREE.MeshStandardMaterial({color:0xb0813f,roughness:0.65});
const cargo=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.62,0.72),cargoM);scene.add(cargo);
const padM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.4,metalness:0.5});
const pads=[];
for(const px of [0,1])pads.push(new THREE.Mesh(new THREE.BoxGeometry(0.18,0.08,1.15),padM));
pads.forEach(p=>scene.add(p));
const roller=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.1,0.55),padM);
scene.add(roller);

/* ---- 液压缸(套筒+活塞杆)+ 中点销横梁 ---- */
const cylM=new THREE.MeshStandardMaterial({color:0xd8a03c,roughness:0.3,metalness:0.7});
const rodM=new THREE.MeshStandardMaterial({color:0xdde5ee,roughness:0.15,metalness:0.85});
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,1,16),cylM);scene.add(barrel);
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.038,0.038,1,12),rodM);scene.add(rod);
function orientMesh(mesh,x1,y1,z1,x2,y2,z2){
  v3.set(x2-x1,y2-y1,z2-z1);const len=Math.max(1e-4,v3.length());v3.normalize();
  mesh.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  mesh.quaternion.setFromUnitVectors(vY,v3);mesh.scale.set(1,len,1);
}
const yoke=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.3,10),postM);
yoke.rotation.x=Math.PI/2;yoke.scale.y=1.3;scene.add(yoke);

/* ---- 相似三角形辅助叠加(3级) ---- */
const triShape=new THREE.Shape();triShape.moveTo(0,0);triShape.lineTo(1,0);triShape.lineTo(0.5,1);triShape.closePath();
const triGeo=new THREE.ShapeGeometry(triShape);
const triM=new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0.13,side:THREE.DoubleSide,depthWrite:false});
const triEdgeM=new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.55});
const auxGroup=new THREE.Group();scene.add(auxGroup);
for(let i=0;i<3;i++){
  const t=new THREE.Mesh(triGeo,triM);auxGroup.add(t);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(triGeo),triEdgeM);auxGroup.add(e);
}

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1,slowMo=false;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('液压缸:伸缩筒推动中点销','Hydraulic ram: telescoping barrel drives the mid-pin'),
  new THREE.Vector3(2.75,1.0,0),'y');
addLabel(()=>L('相似放大 ×3:行程与力同一杠杆比','Similar-triangle gain ×3: travel and force share one lever ratio'),
  new THREE.Vector3(-1.15,3.6,0),'o',()=>auxGroup.visible);
addLabel(()=>L('竖直导轨约束:平台只平移','Vertical guide rails: pure translation'),
  new THREE.Vector3(-0.35,5.9,0.62),'b');
addLabel(()=>L(`载重 W = ${load.toFixed(0)} kg`,`Load W = ${load.toFixed(0)} kg`),
  new THREE.Vector3(1.15,7.4,0),'r',()=>load>0);

function setStroke(f){
  auto=false;fastBleed=false;
  targetF=clamp(f,0,1);
  document.getElementById('sStroke').value=targetF;
  document.getElementById('sStrokeVal').textContent=(geom(thOf(targetF)).stroke).toFixed(2)+' m';
}
function setLoad(m){
  load=clamp(m,0,2000);
  document.getElementById('sLoad').value=load;
  document.getElementById('sLoadVal').textContent=load.toFixed(0)+' kg';
  document.getElementById('bEmpty').classList.toggle('on',load===0);
  document.getElementById('bFull').classList.toggle('on',load>=2000);
}
function triggerBleed(){auto=false;fastBleed=true;
  document.getElementById('bBleed').classList.add('on');
  document.getElementById('bEmpty').classList.remove('on');
  document.getElementById('bFull').classList.remove('on');}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'液压缸推中点销,活塞伸长',en:'The ram pushes the mid-pin; the piston extends',
  act(){setStroke(0.75);document.getElementById('bBleed').classList.remove('on');}},
 {zh:'相似三角形:臂长比决定行程放大 n 倍',en:'Similar triangles: the arm ratio multiplies travel n-fold',
  act(){setStroke(0.9);document.getElementById('tglTri').checked=true;auxGroup.visible=true;}},
 {zh:'虚功原理:省行程的杠杆反过来要大推力',en:'Virtual work: the stroke-saving lever demands a huge ram force',
  act(){setStroke(0.06);}},
 {zh:'载重加大,缸压按杠杆比实时抬高',en:'Add load: ram pressure climbs by the same lever ratio',
  act(){setLoad(2000);setStroke(0.5);}},
 {zh:'泄压下降:重力做功把油挤回油箱',en:'Bleed down: gravity does work, pushing oil back to tank',
  act(){setStroke(0.0);triggerBleed();}},
 {zh:'偏载与摆动:剪叉的水平晃动与导轨约束',en:'Eccentric loads: scissor sway and the guide-rail constraint',
  act(){setLoad(1200);setStroke(0.85);triggerBleed();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  cur=geom(thOf(strokeF));
  document.getElementById('stH').innerHTML=cur.h.toFixed(2)+'<small> m</small>';
  document.getElementById('stS').innerHTML=cur.stroke.toFixed(2)+'<small> m</small>';
  const r=document.getElementById('stR');
  r.textContent='×'+cur.ratio.toFixed(2);
  r.className='v '+(cur.ratio<0.1?'warn':'');
  document.getElementById('stP').innerHTML=cur.p.toFixed(1)+'<small> MPa</small>';
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;if(playing)auto=true;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bEmpty').addEventListener('click',()=>{setLoad(0);});
document.getElementById('bFull').addEventListener('click',()=>{setLoad(2000);});
document.getElementById('bBleed').addEventListener('click',()=>{document.getElementById('sStroke').value=0;triggerBleed();});
document.getElementById('sStroke').addEventListener('input',e=>{
  targetF=+e.target.value;auto=false;fastBleed=false;
  document.getElementById('sStrokeVal').textContent=geom(thOf(targetF)).stroke.toFixed(2)+' m';
  document.getElementById('bBleed').classList.remove('on');
});
document.getElementById('sLoad').addEventListener('input',e=>setLoad(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglTri').addEventListener('change',e=>{auxGroup.visible=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  triM.color.setHex(dark?0xffa94d:0xe8590c);
  triEdgeM.color.setHex(dark?0xffa94d:0xe8590c);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  if(auto&&playing){
    targetF=0.5-0.5*Math.cos(simT*0.33);
    document.getElementById('sStroke').value=targetF;
  }
  if(fastBleed)targetF=0;
  const rate=fastBleed?2.6:(auto?1.2:0.9);
  strokeF+=clamp(targetF-strokeF,-rate*dts,rate*dts);
  if(fastBleed&&strokeF<=0.001){fastBleed=false;document.getElementById('bBleed').classList.remove('on');}
  document.getElementById('sStrokeVal').textContent=geom(thOf(strokeF)).stroke.toFixed(2)+' m';
  bleedActive=fastBleed&&strokeF>0.002;
  swayAmp+=((bleedActive?0.05:0)-swayAmp)*Math.min(1,dt*3);
  const sway=Math.sin(simT*8)*swayAmp;
  /* 微液压脉动,保证运行态每帧有推进 */
  const ripple=playing?0.0035*Math.sin(simT*2.3):0;
  cur=geom(thOf(clamp(strokeF+ripple,0,1)));
  const {x,y}=cur, topY=BASE+6*y;
  /* 剪叉臂与铰点(两侧) */
  let ai=0,pi=0;
  for(const z of [ARMZ,-ARMZ]){
    for(let i=0;i<3;i++){
      const y0=BASE+2*i*y;
      orientInst(arms,ai++,0,y0,z,2*x,y0+2*y,z);
      orientInst(arms,ai++,2*x,y0,z,0,y0+2*y,z);
    }
    const cs=[[0,BASE],[2*x,BASE],[0,BASE+2*y],[2*x,BASE+2*y],[0,BASE+4*y],[2*x,BASE+4*y],[0,topY],[2*x,topY],[x,BASE+y],[x,BASE+3*y],[x,BASE+5*y]];
    for(const c of cs){m4.makeTranslation(c[0],c[1],z);pins.setMatrixAt(pi++,m4);}
  }
  m4.makeTranslation(AANC,YA,0);pins.setMatrixAt(pi,m4);
  arms.instanceMatrix.needsUpdate=true;pins.instanceMatrix.needsUpdate=true;
  /* 液压缸:锚点 → 中点销 */
  const pinY=BASE+y;
  const bl=cur.s*0.6;
  const ux=(x-AANC)/cur.s, uy=(pinY-YA)/cur.s;
  orientMesh(barrel,AANC,YA,0,AANC+ux*bl,YA+uy*bl,0);
  orientMesh(rod,AANC+ux*(bl-0.08),YA+uy*(bl-0.08),0,x,pinY,0);
  yoke.position.set(x,pinY,0);
  /* 平台、滑块、垫块、货箱 */
  platG.position.set(1.15+sway,topY+0.105,0);
  platG.rotation.z=sway*0.25;
  pads[0].position.set(0,topY+0.03,0);pads[1].position.set(2*x,topY+0.03,0);
  roller.position.set(2*x,BASE-0.05,0);
  cargo.position.set(1.15+sway*1.6,topY+0.105+0.045+0.31,0);
  cargo.rotation.z=-sway*1.1;
  /* 相似三角形叠加 */
  for(let i=0;i<3;i++){
    const y0=BASE+2*i*y, t=auxGroup.children[i*2], e=auxGroup.children[i*2+1];
    t.scale.set(2*x,y,1);t.position.set(0,y0,0);
    e.scale.set(2*x,y,1);e.position.set(0,y0,0);
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
auxGroup.visible=document.getElementById('tglTri').checked;
applyTheme();buildSteps();
setLoad(0);
strokeF=0.15;targetF=0.15;
document.getElementById('sStrokeVal').textContent=geom(thOf(strokeF)).stroke.toFixed(2)+' m';
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);auto=true;}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
