<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>液压刹车与制动回路 · 帕斯卡管到底</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="液压刹车与制动回路" data-en="Hydraulic Brakes & the Brake Circuit">液压刹车与制动回路</h1>
  <div class="sub" data-zh="脚踩踏板推总泵活塞,刹车油把同样的压强送到四只分泵——帕斯卡定律是整条油路的宪法;油路做成 X 型双回路,断一路还剩对角一半;真空助力器借发动机负压放大脚力;真正要命的是油沸腾:气泡可压缩,脚感瞬间变棉花——换油的日历不是仪式,是保命 · 拖动旋转 / 空格运行/暂停" data-en="The pedal shoves the master-cylinder piston and brake fluid hands the same pressure to all four calipers — Pascal's law is the constitution of the circuit; the lines cross in an X, so one failed loop still leaves the diagonal half; a vacuum booster borrows intake manifold suction to amplify your foot; the real killer is boiling fluid — vapor compresses, the pedal goes to mush — and the brake-fluid calendar is survival, not ritual · drag to orbit / Space = run/pause">脚踩踏板推总泵活塞,刹车油把同样的压强送到四只分泵——帕斯卡定律是整条油路的宪法;油路做成 X 型双回路,断一路还剩对角一半;真空助力器借发动机负压放大脚力;真正要命的是油沸腾:气泡可压缩,脚感瞬间变棉花——换油的日历不是仪式,是保命 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="踏板力" data-en="Pedal force">踏板力</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="管路压力" data-en="Line pressure">管路压力</span><span class="v" id="stMPa">—</span>
  <span class="k" data-zh="制动力矩" data-en="Brake torque">制动力矩</span><span class="v" id="stTq">—</span>
  <span class="k" data-zh="油温" data-en="Fluid temp">油温</span><span class="v" id="stOil">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bOk" data-zh="双回路正常" data-en="Both circuits">双回路正常</button>
    <button class="abtn" id="bFail" data-zh="X 断一路" data-en="X, one cut">X 断一路</button>
    <button class="abtn" id="bBoost" data-zh="真空助力:开" data-en="Booster: on">真空助力:开</button>
  </div>
  <div class="row">
    <label data-zh="踏板力" data-en="Pedal force">踏板力</label>
    <input id="sPed" type="range" min="0" max="500" step="5" value="200">
    <span class="val" id="sPedVal">200 N</span>
  </div>
  <div class="row">
    <label data-zh="车速" data-en="Car speed">车速</label>
    <input id="sSpd" type="range" min="0" max="120" step="5" value="80">
    <span class="val" id="sSpdVal">80 km/h</span>
  </div>
  <div class="row">
    <label data-zh="连续重刹" data-en="Ride the brake">连续重刹</label>
    <input id="sHold" type="range" min="0" max="10" step="0.5" value="0">
    <span class="val" id="sHoldVal">0 s</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="半剖视" data-en="Cutaway">半剖视</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../abs-brakes/" data-zh="ABS 防抱死" data-en="ABS Anti-lock Brakes">ABS 防抱死</a>
    <a href="../pascal-press/" data-zh="帕斯卡与液压机" data-en="Pascal & the Hydraulic Press">帕斯卡与液压机</a>
    <a href="../esp-stability/" data-zh="车身电子稳定系统" data-en="ESP Stability Control">车身电子稳定系统</a>
    <a href="../seatbelt/" data-zh="安全带" data-en="The Seatbelt">安全带</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,52);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-3.4,3.4,9.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.6,1.5,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=28;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const benchM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const bench=new THREE.Mesh(new THREE.BoxGeometry(9,0.45,3.0),benchM);
bench.position.y=0.22;scene.add(bench);

/* 踏板(杠杆)+ 总泵 */
const steelM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85});
const darkM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.5,metalness:0.4});
const pedalG=new THREE.Group();pedalG.position.set(-3.6,1.2,0);scene.add(pedalG);
const pedalArm=new THREE.Mesh(new THREE.BoxGeometry(0.16,1.3,0.16),darkM);
pedalArm.position.y=-0.4;pedalG.add(pedalArm);
const padM=new THREE.MeshStandardMaterial({color:0x22262e,roughness:0.9});
const pedalPad=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.5,0.5),padM);
pedalPad.position.set(0,-1.05,0.1);pedalG.add(pedalPad);
/* 总泵:水平缸+活塞+油壶 */
const mstG=new THREE.Group();mstG.position.set(-2.2,1.35,0);scene.add(mstG);
const mstBody=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,1.1,18),darkM);
mstBody.rotation.z=Math.PI/2;mstG.add(mstBody);
const mstFluidM=new THREE.MeshStandardMaterial({color:0xd9b23c,roughness:0.3,transparent:true,opacity:0.85});
const mstPiston=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.2,18),steelM);
mstPiston.rotation.z=Math.PI/2;mstPiston.position.x=-0.45;mstG.add(mstPiston);
const reservoir=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4),mstFluidM.clone());
reservoir.position.set(-0.2,0.45,0);mstG.add(reservoir);
/* 真空助力器(圆盘) */
const boostM=new THREE.MeshStandardMaterial({color:0x2b3038,roughness:0.6});
const booster=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.3,24),boostM);
booster.rotation.z=Math.PI/2;booster.position.x=-0.85;mstG.add(booster);

/* 两只车轮单元:盘+卡钳 */
function wheelUnit(x){
  const g=new THREE.Group();g.position.set(x,1.15,0);scene.add(g);
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.85,0.14,36),steelM.clone());
  disc.rotation.x=Math.PI/2;g.add(disc);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.5,18),darkM);
  hub.rotation.x=Math.PI/2;g.add(hub);
  for(let i=0;i<5;i++){
    const bolt=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.54,8),padM);
    bolt.rotation.x=Math.PI/2;bolt.position.y=0;
    const a=i/5*Math.PI*2;
    bolt.position.set(Math.cos(a)*0.34,Math.sin(a)*0.34,0);
    g.add(bolt);
  }
  const calM=new THREE.MeshStandardMaterial({color:0xd94848,roughness:0.4,metalness:0.3});
  const cal=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.16,10,20,Math.PI*0.7),calM);
  cal.position.z=0;cal.rotation.z=Math.PI*0.65;g.add(cal);
  const pad1=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.36,0.06),padM);
  pad1.position.set(0.0,0.88,0.14);g.add(pad1);
  const pad2=pad1.clone();pad2.position.z=-0.14;g.add(pad2);
  return {g,disc,hub,pad1,pad2,calM};
}
const wL=wheelUnit(1.2),wR=wheelUnit(4.2);

/* 油管:X 双回路:回路A(蓝)→左轮,回路B(橙)→右轮 */
function line(points,color,r){
  const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),48,r,8),
    new THREE.MeshStandardMaterial({color,roughness:0.4,metalness:0.3,transparent:true,opacity:0.9}));
  scene.add(m);return m;
}
const lineA=line([new THREE.Vector3(-1.6,1.35,0),new THREE.Vector3(-0.6,0.7,0.5),
  new THREE.Vector3(0.4,0.7,0.7),new THREE.Vector3(1.2,1.15,0.55)],0x4a7fd6,0.035);
const lineB=line([new THREE.Vector3(-1.6,1.35,0),new THREE.Vector3(-0.6,0.9,-0.5),
  new THREE.Vector3(2.2,0.75,-0.75),new THREE.Vector3(4.2,1.15,-0.55)],0xd9822b,0.035);
/* 气泡(油沸腾) */
const NBUB=26;
const bubM=new THREE.MeshBasicMaterial({color:0xf2e8c9,transparent:true,opacity:0.9});
const bubs=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,6,6),bubM,NBUB);
bubs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(bubs);
const bubD=[];for(let i=0;i<NBUB;i++)bubD.push({t:Math.random(),line:Math.random()<0.5?lineA:lineB,off:(Math.random()-0.5)*0.05});

/* 压力波亮点沿管跑 */
const NWAV=20;
const wavM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.95});
const wavs=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,6,6),wavM,NWAV);
wavs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(wavs);
const wavD=[];for(let i=0;i<NWAV;i++)wavD.push({t:Math.random(),ln:i%2});

/* 状态 */
let pedF=200,carSpd=80,holdT=0,failX=false,boost=true,cut=true;
let playing=true,labelsOn=true,slowMo=false,oilT=25,simT=0,pedalTravel=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const m4=new THREE.Matrix4();
function linePoint(ln,t){/* 取管上一点 */
  const curve=ln.geometry.parameters.path;
  return curve.getPoint(clamp(t,0,1));
}
function circuits(){return failX?1:2;}
function boostK(){return boost?3.5:1;}
function pressMPa(){
  const vapor=vaporF();
  return clamp(pedF*boostK()*0.0095,0,11.5)*(failX?0.52:1)*(1-vapor*0.45);
}
function torqueNm(){return pressMPa()*7.5*2*(failX?0.5:1)*(1-vaporF()*0.4);}
function vaporF(){return clamp((oilT-205)/60,0,1);}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('踏板:杠杆把脚力递给总泵','Pedal: a lever handing your foot to the master'),
  new THREE.Vector3(-3.6,3.1,0),'y');
addLabel(()=>L('总泵+油壶:力的户口所在地','Master + reservoir: where the force signs in'),
  new THREE.Vector3(-2.2,2.5,0),'b');
addLabel(()=>L('真空助力器:借负压放大 '+boostK().toFixed(1)+' 倍','Booster: amplifying ×'+boostK().toFixed(1)+' on suction'),
  new THREE.Vector3(-3.1,2.1,-1.2),'o',()=>boost);
addLabel(()=>L('X 双回路:断一路剩对角一半','X-split: one cut still leaves half'),
  new THREE.Vector3(1.0,0.2,1.3),failX?'r':'o');
addLabel(()=>L('卡钳夹盘:动能变热','Caliper squeezes disc: motion becomes heat'),
  new THREE.Vector3(4.2,2.6,0),'g');
addLabel(()=>L('油沸腾!气泡可压缩,脚感变棉花','Fluid boiling! vapor compresses, pedal goes mushy'),
  new THREE.Vector3(2.2,0.15,-1.6),'r',()=>vaporF()>0.05);

function setPed(v){pedF=clamp(v,0,500);
  document.getElementById('sPed').value=pedF;
  document.getElementById('sPedVal').textContent=pedF+' N';updateStats();}
function setSpd(v){carSpd=clamp(v,0,120);
  document.getElementById('sSpd').value=carSpd;
  document.getElementById('sSpdVal').textContent=carSpd+' km/h';}
function setHold(v){holdT=clamp(v,0,10);
  document.getElementById('sHold').value=holdT;
  document.getElementById('sHoldVal').textContent=holdT.toFixed(1)+' s';}
function setFail(f){failX=f;
  document.getElementById('bOk').classList.toggle('on',!f);
  document.getElementById('bFail').classList.toggle('on',f);
  lineA.material.color.setHex(f?0x555b66:0x4a7fd6);
  updateStats();}
function setBoost(b){boost=b;
  document.getElementById('bBoost').classList.toggle('on',b);
  document.getElementById('bBoost').textContent=L(b?'真空助力:开':'真空助力:关',b?'Booster: on':'Booster: off');
  updateStats();}

const STEPS=[
 {zh:'踏板推活塞:力进油路',en:'Pedal pushes piston: force enters the fluid',
  act(){setFail(false);setBoost(true);setPed(200);setSpd(80);setHold(0);}},
 {zh:'帕斯卡:压强人人平等',en:'Pascal: same pressure for everyone',
  act(){setPed(350);}},
 {zh:'卡钳夹盘:动能变热',en:'Caliper clamps: motion becomes heat',
  act(){setPed(500);setSpd(120);setHold(2);}},
 {zh:'X 型双回路:断一路剩一半',en:'X-split: cut one, keep the diagonal half',
  act(){setFail(true);setPed(500);}},
 {zh:'真空助力:借负压放大脚力',en:'Vacuum booster: foot force on loan',
  act(){setFail(false);setBoost(false);setPed(120);}},
 {zh:'气阻:油一沸腾,刹车失语',en:'Vapor lock: boil the fluid, the brakes go mute',
  act(){setFail(false);setBoost(true);setPed(500);setSpd(100);setHold(8);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stP').innerHTML=(pedF*boostK()).toFixed(0)+'<small> N</small>';
  const p=document.getElementById('stMPa');
  p.innerHTML=pressMPa().toFixed(1)+'<small> MPa</small>';
  p.className='v '+(vaporF()>0.3?'warn':'');
  document.getElementById('stTq').innerHTML=torqueNm().toFixed(0)+'<small> N·m</small>';
  const o=document.getElementById('stOil');
  o.innerHTML=oilT.toFixed(0)+'<small> °C</small>';
  o.className='v '+(oilT>205?'warn':(oilT>160?'':'ok'));
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bOk').addEventListener('click',()=>setFail(false));
document.getElementById('bFail').addEventListener('click',()=>setFail(true));
document.getElementById('bBoost').addEventListener('click',()=>setBoost(!boost));
document.getElementById('sPed').addEventListener('input',e=>setPed(+e.target.value));
document.getElementById('sSpd').addEventListener('input',e=>setSpd(+e.target.value));
document.getElementById('sHold').addEventListener('input',e=>setHold(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{
  cut=e.target.checked;
  wL.pad1.visible=wL.pad2.visible=cut;
  wR.pad1.visible=wR.pad2.visible=cut;
  mstPiston.visible=cut;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  benchM.color.setHex(dark?0x3a3f4b:0xb8ac9c);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null,wheelAng=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const pressing=pedF>1;
  const tq=torqueNm();
  /* 车速:制动减速,松刹滑行微降 */
  const decel=tq*2/(1400*0.31);/* m/s² 玩具标度 */
  let v=carSpd/3.6;
  if(pressing)v=Math.max(0,v-decel*dts);
  v=Math.max(0,v-0.15*dts);
  carSpd=v*3.6;
  document.getElementById('sSpd').value=clamp(carSpd,0,120);
  document.getElementById('sSpdVal').textContent=carSpd.toFixed(0)+' km/h';
  /* 车轮转 */
  wheelAng+=dts*v/0.31;
  wL.disc.rotation.y=wheelAng;wR.disc.rotation.y=wheelAng;
  wL.hub.rotation.y=wheelAng;wR.hub.rotation.y=wheelAng;
  /* 踏板角与总泵活塞 */
  const travel=clamp(pedF/500,0,1)*(vaporF()>0.3?1.5:1);
  pedalG.rotation.x=-travel*0.42;
  mstPiston.position.x=-0.45+travel*0.75;
  /* 卡钳夹紧:pad 靠近盘面 */
  const grip=clamp(pressMPa()/11.5,0,1);
  [wL,wR].forEach(w=>{
    w.pad1.position.z=0.14-grip*0.075;
    w.pad2.position.z=-0.14+grip*0.075;
    const heat=clamp((oilT-60)/160,0,1);
    w.disc.material.emissive=new THREE.Color(0xff4400);
    w.disc.material.emissiveIntensity=pressing?heat*0.55:0.04;
  });
  /* 油温:制动功率升温,自然降温 */
  const pHeat=pressing?grip*(carSpd/120)*9:0;
  oilT+=(pHeat-0.5)*(oilT-18>0?1:0)*dts*(2.6+holdT*0.4);
  oilT=Math.max(18,Math.min(320,oilT));
  /* 压力波沿线跑 */
  const press=pressMPa();
  for(let i=0;i<NWAV;i++){
    const d=wavD[i];
    d.t+=dts*(0.4+press*0.22);
    if(d.t>1)d.t-=1;
    const ln=d.ln===0?lineA:lineB;
    const dim=(d.ln===0&&failX)||!pressing;
    const p=linePoint(ln,d.t);
    const s=dim?0.001:1;
    m4.makeScale(s,s,s);m4.setPosition(p.x,p.y,p.z);
    wavs.setMatrixAt(i,m4);
  }
  wavs.instanceMatrix.needsUpdate=true;
  wavM.opacity=clamp(press/6,0.15,0.95);
  /* 气泡 */
  const vf=vaporF();
  for(let i=0;i<NBUB;i++){
    const d=bubD[i];
    d.t+=dts*(0.5+vf);
    if(d.t>1)d.t-=1;
    const p=linePoint(d.line,d.t);
    p.y+=Math.sin(i*9+d.t*20)*d.off+0.03;
    const s=vf*Math.sin(d.t*Math.PI);
    m4.makeScale(Math.max(s,0.001),Math.max(s,0.001),Math.max(s,0.001));
    m4.setPosition(p.x,p.y,p.z);
    bubs.setMatrixAt(i,m4);
  }
  bubs.instanceMatrix.needsUpdate=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
