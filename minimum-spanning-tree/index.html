<style>

    color-scheme:light;--acc:#2b8a3e;

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;

  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}

  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}

  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}

  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="最小生成树 · Kruskal 一次次挑最便宜又不成环的边" data-en="Minimum Spanning Tree · Kruskal keeps the cheapest edges that make no loop">最小生成树 · Kruskal 一次次挑最便宜又不成环的边</h1>
  <div class="sub" data-zh="把 n 个村庄连成一张网，总电缆最短怎么铺？Kruskal 把边按权重排序，从最便宜的开始拿：两端不在同一连通块就要，成环就扔——并查集一步判断"是否已连"；n−1 条边收手，MST 完成。Prim 是同一目标的另一种长法：从一棵树向外逐步勾最短的邻边 · 拖动旋转 / 空格运行/暂停" data-en="Wire n villages with the least cable: Kruskal sorts edges by weight and takes them cheapest-first — keep an edge if its ends are in different components (one union-find find), drop it if it closes a loop; stop after n−1 edges. Prim grows the same tree outward, always hooking the cheapest frontier edge · drag to orbit / Space = run/pause">把 n 个村庄连成一张网，总电缆最短怎么铺？Kruskal 把边按权重排序，从最便宜的开始拿：两端不在同一连通块就要，成环就扔——并查集一步判断"是否已连"；n−1 条边收手，MST 完成。Prim 是同一目标的另一种长法：从一棵树向外逐步勾最短的邻边 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-6.5,4.6,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.9,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=80;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 页面场景 ---- */
/* 地面 + 村庄节点 + 边 */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.BoxGeometry(20,0.4,13),groundM);
ground.position.y=-0.3;scene.add(ground);
const NODE_N=11;
const nodeG=new THREE.Group();scene.add(nodeG);
const nodeM=new THREE.MeshStandardMaterial({color:0xd0bfff,roughness:0.4,emissive:0x6741d9,emissiveIntensity:0.25});
const nodeMST=new THREE.MeshStandardMaterial({color:0x69db7c,emissive:0x2b8a3e,emissiveIntensity:0.7});
const posts=[];
for(let i=0;i<NODE_N;i++){
  const g=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.12,1.15,8),
    new THREE.MeshStandardMaterial({color:0x9aa7b4,roughness:0.4,metalness:0.7}));
  pole.position.y=0.57;g.add(pole);
  const hut=new THREE.Mesh(new THREE.ConeGeometry(0.32,0.5,7),nodeM.clone());
  hut.position.y=1.35;g.add(hut);
  nodeG.add(g);posts.push(g);
}
/* 边：每条边一个发光圆管 + 权重标签挂点 */
const edgeM=new THREE.MeshStandardMaterial({color:0x67707c,roughness:0.5,metalness:0.5,transparent:true,opacity:0.4});
const edgeMSTm=new THREE.MeshStandardMaterial({color:0x69db7c,emissive:0x2b8a3e,emissiveIntensity:0.8,roughness:0.35});
const edgeBadM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.55,transparent:true,opacity:0.45});
const edgeCur=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xe67700,emissiveIntensity:0.9});
const edges=[];   // {a,b,w,tube,label}
const EDGES_DEF=[[0,1],[0,2],[1,3],[2,4],[3,4],[1,2],[4,5],[3,5],[5,6],[4,7],[6,8],[7,8],[7,9],[8,10],[9,10],[2,3],[6,7],[0,5],[9,10]];
function layoutNodes(seed){
  let s=seed;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  const pts=[];
  for(let i=0;i<NODE_N;i++){
    let x,z,ok=false;
    while(!ok){
      x=(rnd()-0.5)*16;z=(rnd()-0.5)*9.5;ok=true;
      for(const p of pts)if((p[0]-x)**2+(p[1]-z)**2<6.5)ok=false;
    }
    pts.push([x,z]);
  }
  pts.forEach((p,i)=>posts[i].position.set(p[0],0,p[1]));
  return pts;
}
let nodePos=layoutNodes(7);
function edgeMid(a,b){return new THREE.Vector3().addVectors(posts[a].position,posts[b].position).multiplyScalar(0.5).setY(1.45);}
function rebuildEdges(){
  for(const e of edges){nodeG.remove(e.tube);if(e.lbl)nodeG.remove(e.lbl.o);}
  edges.length=0;
  for(const [a,b] of EDGES_DEF){
    const pa=posts[a].position.clone().setY(1.3),pb=posts[b].position.clone().setY(1.3);
    const len=pa.distanceTo(pb);
    const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,len,6),edgeM);
    tube.position.copy(pa).add(pb).multiplyScalar(0.5);
    tube.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),pb.clone().sub(pa).normalize());
    nodeG.add(tube);
    const div=document.createElement('div');div.className='lbl';
    const lbl=new CSS2DObject(div);
    lbl.position.copy(edgeMid(a,b));
    nodeG.add(lbl);
    edges.push({a,b,w:Math.round(len*10)/10,tube,lbl:{o:lbl,el:div}});
  }
}
rebuildEdges();
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('按权重排序：从最便宜的开始问','Sort edges: ask cheapest first'),new THREE.Vector3(-7.5,2.6,0),'y');
addLabel(()=>L('并查集：两端已连通？→ 扔','Union-find: already connected? → drop'),new THREE.Vector3(7.6,2.6,0),'r',
  ()=>dropped>0);
addLabel(()=>L('不成环就收进树','No loop → into the tree'),new THREE.Vector3(0,3.4,0),'g',
  ()=>kept>0);

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0;
let algo='kruskal',order=[],oi=0,kept=0,dropped=0,totalW=0,anim=0;
let mstSet=new Set(),uf=new Array(NODE_N).fill(0).map((_,i)=>i);
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
function find(x){while(uf[x]!==x){uf[x]=uf[uf[x]];x=uf[x];}return x;}
function union(x,y){uf[find(x)]=find(y);}
function setSpeed(v){document.getElementById('sSpeedVal').textContent=v+'×';}
function resetRun(){
  uf=new Array(NODE_N).fill(0).map((_,i)=>i);
  mstSet=new Set();oi=0;kept=0;dropped=0;totalW=0;anim=0;
  for(const e of edges){
    e.tube.material=edgeM;e.tube.scale.set(1,1,1);
    e.lbl.el.textContent=e.w.toFixed(1);
    e.lbl.el.className='lbl';
    e.lbl.o.visible=true;
  }
  posts.forEach(p=>p.children[1].material=nodeM);
}
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'n 个村庄、一堆可能的路，要总长最小的连通网',en:'n villages, many possible roads — want the smallest total that connects all'},
 {zh:'Kruskal：边按权重从小到大排队',en:'Kruskal: queue the edges cheapest first'},
 {zh:'并查集一步：两端已连通→成环，扔',en:'Union-find in one step: ends already joined → cycle, drop it'},
 {zh:'不连通→收下并合并两个集合',en:'Not joined → keep it and merge the two sets'},
 {zh:'收够 n−1 条即停：MST 必然无环且最小',en:'Stop at n−1 edges: MST is acyclic and minimal by exchange argument'},
 {zh:'Prim 换个长法：从一点起每次勾最短的邻边，殊途同归',en:'Prim grows from one root, hooking the cheapest frontier edge — same tree'}
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
activeStep=i;resetRun();
  if(i===4){autoTo=Math.min(999,edges.length);}
 syncSteps();
}

/* ---- 读数 ---- */
function updateStats(){
document.getElementById('stStep').textContent=oi;
  document.getElementById('stKept').innerHTML=kept+'<small> / '+(NODE_N-1)+'</small>';
  const dd=document.getElementById('stDrop');
  dd.textContent=dropped;
  dd.className='v'+(dropped>0?' warn':'');
  document.getElementById('stW').innerHTML=totalW.toFixed(1)+'<small> km</small>';
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  if(typeof groundM!=='undefined')groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
/* Kruskal / Prim 推进 */
  if(playing&&oi<order.length){
    anim+=dt*(+document.getElementById('sSpeed').value);
    if(anim>=1){
      anim=0;
      const e=edges[order[oi]];oi++;
      if(algo==='kruskal'){
        if(find(e.a)!==find(e.b)){
          union(e.a,e.b);kept++;totalW+=e.w;
          e.tube.material=edgeMSTm;e.tube.scale.set(2.2,1,2.2);
          e.lbl.el.className='lbl g';
          posts[e.a].children[1].material=nodeMST;posts[e.b].children[1].material=nodeMST;
        }else{
          dropped++;
          e.tube.material=edgeBadM;e.tube.scale.set(0.6,1,0.6);
          e.lbl.el.className='lbl r';
          if(!tglDiscardEl.checked){e.lbl.o.visible=false;e.tube.visible=false;}
        }
      }
      if(kept===NODE_N-1&&algo==='kruskal'){playing=false;syncPlayBtn();}
    }
  }
  /* 当前考察边高亮 */
  if(oi<order.length){
    for(const e of edges)e.tube.material=(algo==='kruskal'&&e.tube.material===edgeCur)?edgeM:e.tube.material;
    const ce=edges[order[oi]];
    if(algo==='kruskal')ce.tube.material=edgeCur;
  }
  /* 权重标签 */
  for(const e of edges)e.lbl.o.visible=tglWeightsEl.checked&&e.tube.visible!==false;
  for(const e of edges)if(e.lbl.o.visible)e.lbl.el.textContent=e.w.toFixed(1);
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const tglWeightsEl=document.getElementById('tglWeights');
const tglDiscardEl=document.getElementById('tglDiscard');
function buildOrder(){
  resetRun();
  if(algo==='kruskal'){
    order=edges.map((e,i)=>i).sort((a,b)=>edges[a].w-edges[b].w);
  }else{
    /* Prim：从 0 号开始，order 记录加入顺序（简化演示按前沿最短边扩张） */
    order=[];const inT=new Set([0]);
    while(inT.size<NODE_N){
      let best=-1,bw=1e9;
      edges.forEach((e,i)=>{
        const ina=inT.has(e.a),inb=inT.has(e.b);
        if(ina!==inb&&e.w<bw){bw=e.w;best=i;}
      });
      if(best<0)break;
      order.push(best);inT.add(edges[best].a);inT.add(edges[best].b);
    }
  }
}
document.getElementById('bKruskal').addEventListener('click',()=>{algo='kruskal';
  document.getElementById('bKruskal').classList.add('on');
  document.getElementById('bPrim').classList.remove('on');buildOrder();playing=true;syncPlayBtn();});
document.getElementById('bPrim').addEventListener('click',()=>{algo='prim';
  document.getElementById('bPrim').classList.add('on');
  document.getElementById('bKruskal').classList.remove('on');buildOrder();
  /* Prim 演示也走同样的推进循环 */
  uf=new Array(NODE_N).fill(0).map((_,i)=>i);kept=0;dropped=0;totalW=0;oi=0;
  for(const e of edges){e.tube.material=edgeM;e.tube.visible=true;}
  playing=true;syncPlayBtn();});
document.getElementById('btnReset').addEventListener('click',()=>{buildOrder();playing=true;syncPlayBtn();});
document.getElementById('btnShuffle').addEventListener('click',()=>{
  nodePos=layoutNodes(Math.floor(Math.random()*1000)+3);
  rebuildEdges();buildOrder();playing=true;syncPlayBtn();});
document.getElementById('sSpeed').addEventListener('input',e=>setSpeed(+e.target.value));
document.getElementById('tglWeights').addEventListener('change',()=>{});
document.getElementById('tglDiscard').addEventListener('change',()=>{});
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
buildOrder();setSpeed(4);
syncSteps();updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
