<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

  :root[data-theme="light"]{

    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}

  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;

  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
  /* σ-ε 实时曲线 */
  #plot{position:fixed;top:70px;right:18px;z-index:4;
    border:1px solid var(--panel-border);border-radius:10px;background:var(--panel);backdrop-filter:blur(6px)}
  @media(max-width:1200px){#plot{display:none}}
</style>

<div id="app"></div>

<div id="title">
  <h1 data-zh="应力应变与材料强度 · 一条曲线读懂拉伸破坏" data-en="Stress, Strain & Strength · One Curve Reads the Whole Story">应力应变与材料强度 · 一条曲线读懂拉伸破坏</h1>
  <div class="sub" data-zh="弹性区键当弹簧（卸载回零）→屈服点位错滑移（永久变形）→应变硬化→颈缩→断裂；切换钢/铝/玻璃/橡胶，看韧性与脆性的天壤之别；试棒拉过屈服就再也回不去，颈缩缩腰、断口发亮 · 拖动旋转 / 空格运行/暂停" data-en="Elastic: bonds as springs (unload returns) → yield: dislocations slip (permanent) → hardening → necking → fracture; switch steel/aluminum/glass/rubber for ductile vs brittle; past yield the bar never returns — watch the waist form and the fracture glow · drag to orbit / Space = run/pause">弹性区键当弹簧（卸载回零）→屈服点位错滑移（永久变形）→应变硬化→颈缩→断裂；切换钢/铝/玻璃/橡胶，看韧性与脆性的天壤之别；试棒拉过屈服就再也回不去，颈缩缩腰、断口发亮 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================= 材料模型（真实工程数据，工程应力-应变） =================
   σ=F/A₀, ε=ΔL/L₀。低碳钢: E≈200GPa σy≈250MPa σu≈450MPa 均匀应变~15% 断裂~26%；
   6061-T6 铝: E≈70GPa σy≈270MPa σu≈310MPa 延伸率~12%；钠钙玻璃: E≈70GPa，
   抗拉≈50MPa 脆断(无塑性)；橡胶: neo-Hookean σ=G(λ−1/λ²)+有限伸展硬化，G≈2MPa，
   断裂应变≈650%。韧性=曲线下面积(MPa=MJ/m³)。卸载沿 E 斜率回零、留永久应变 εp
   （橡胶为超弹性，沿原路返回）。颈缩后局部半径按高斯腰收窄。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const MATS={
 steel:{zh:'低碳钢',en:'Mild steel',E:200,sy:250,su:450,eu:15,ef:26,metal:true,ratef:1.8,color:0x9aa8b5,op:1},
 alu:{zh:'铝合金',en:'Aluminum',E:70,sy:270,su:310,eu:8,ef:12,metal:true,ratef:1.2,color:0xc2ccd6,op:1},
 glass:{zh:'玻璃',en:'Glass',E:70,sy:50,su:50,eu:0.07,ef:0.07,metal:false,brittle:true,ratef:0.045,color:0x9fd8e8,op:0.55},
 rubber:{zh:'橡胶',en:'Rubber',E:0.006,sy:2,su:16,eu:400,ef:650,metal:false,rubber:true,ratef:60,color:0x3a4652,op:1},
};
let mat=MATS.steel, rate=1.0;
let eps=0, sig=0, ep=0, u=0, phase='load', broken=false;
let playing=true, labelsOn=true;
const VIS=0.12; // 橡胶 3D 伸长按 8:1 视觉压缩（曲线仍为真实值）

const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

function curve(e){ // ε 用 %，σ 用 MPa
  if(mat.rubber){
    const lam=1+e/100;
    return 2*(lam-1/(lam*lam))+0.24*Math.pow(Math.max(0,lam-4),2);
  }
  const ey=mat.sy/(mat.E*1000)*100;
  if(e<=ey)return mat.E*1000*e/100;
  if(e<=mat.eu)return mat.sy+(mat.su-mat.sy)*Math.sin(Math.PI/2*(e-ey)/(mat.eu-ey));
  if(e<=mat.ef)return mat.su*(1-0.18*(e-mat.eu)/(mat.ef-mat.eu));
  return 0;
}
const yieldEps=()=>mat.rubber?mat.sy/(3*2)*100*0.02:(mat.metal?mat.sy/(mat.E*1000)*100:mat.ef); // 屈服应变%

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,64);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(3.5,0.8,13.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=45;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(5,8,8); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-6,3,-6); scene.add(fill);

/* ---- 拉伸机 ---- */
const frameM=new THREE.MeshStandardMaterial({color:0x333c46,roughness:0.6,metalness:0.5});
const gripM=new THREE.MeshStandardMaterial({color:0x4a5560,roughness:0.5,metalness:0.6});
const specM=new THREE.MeshStandardMaterial({color:0x9aa8b5,roughness:0.35,metalness:0.7});
const glowM=new THREE.MeshBasicMaterial({color:0xff7b4a,transparent:true,opacity:0.9});
const base=new THREE.Mesh(new THREE.BoxGeometry(9,0.5,4),frameM); base.position.y=-5.4; scene.add(base);
const topPlate=new THREE.Mesh(new THREE.BoxGeometry(9,0.5,4),frameM); topPlate.position.y=4.0; scene.add(topPlate);
[-2.6,2.6].forEach(x=>{
  const col=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,9.9,12),frameM);
  col.position.set(x,-0.7,0); scene.add(col);
});
const gripT=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.9,1.3),gripM); gripT.position.y=3.55; scene.add(gripT);
const gripB=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.9,1.3),gripM); scene.add(gripB);
/* 试棒：旋转体，标距段 6 单位 */
let spec=null, specGeo=null, neck=0;
function profile(neckAmt,y0,y1){
  const pts=[];
  for(let i=0;i<=36;i++){
    const y=y0+(y1-y0)*i/36;
    const t=clamp((Math.abs(y)-1.6)/0.8,0,1);
    let r=0.42+0.2*t*t;
    r*=1-neckAmt*Math.exp(-Math.pow(y/0.9,2)); // 颈缩腰
    pts.push(new THREE.Vector2(Math.max(0.05,r),y));
  }
  return pts;
}
function buildSpecimen(){
  if(spec){scene.remove(spec);specGeo.dispose();}
  specGeo=new THREE.LatheGeometry(profile(neck,-3,3),26);
  spec=new THREE.Mesh(specGeo,specM);
  scene.add(spec);
  applyStrain();
}
function applyStrain(){
  if(!spec)return;
  const st=1+eps*(mat.rubber?VIS:1);
  spec.scale.y=st;
  spec.position.y=-3*(st-1);     // 顶端固定：底端下移 6·ε
  gripB.position.y=3-6*st-0.55;
}
/* 断口两半 + 火花 */
let halves=[],sparks=null,spVel=[],spT=1;
function fractureFX(){
  const st=1+eps*(mat.rubber?VIS:1), yc=-3*(st-1); // 断在中间
  [[0,3,1],[-3,0,-1]].forEach(([a,b,dir],i)=>{
    const pts=profile(neck,a,b);
    const m=new THREE.Mesh(new THREE.LatheGeometry(pts,22),specM);
    m.scale.y=st; m.position.y=yc; m.userData={dir};
    scene.add(m); halves.push(m);
    const rFace=(dir>0?pts[0]:pts[pts.length-1]).x; // 断口面半径
    const disc=new THREE.Mesh(new THREE.CircleGeometry(rFace,20),glowM.clone());
    disc.rotation.x=dir>0?-Math.PI/2:Math.PI/2;
    disc.position.y=yc+dir*0.02;
    disc.userData={dir,glow:true};
    scene.add(disc); halves.push(disc);
  });
  spec.visible=false;
  gripB.position.y=3-6*st-0.55;
  const spG=new THREE.BufferGeometry();
  spG.setAttribute('position',new THREE.BufferAttribute(new Float32Array(18*3),3));
  sparks=new THREE.Points(spG,new THREE.PointsMaterial({color:0xffd43b,size:0.14,transparent:true}));
  sparks.position.set(0,yc,0); scene.add(sparks); spT=0;
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2;
    spVel.push(new THREE.Vector3(Math.cos(a)*(1+Math.random()*2),Math.random()*2.5,Math.sin(a)*(1+Math.random()*2)));
  }
}
/* ---- 晶格视图（弹性=键伸长，塑性=位错滑过） ---- */
const latG=new THREE.Group(); latG.position.set(-5.6,0.2,-1.2); scene.add(latG);
const atomM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4,emissive:0x1864ab,emissiveIntensity:0.3});
const atomM2=new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.4,emissive:0xa05000,emissiveIntensity:0.3});
const LAT_C=6,LAT_R=4,LSP=0.55;
const lats=[];
for(let r=0;r<LAT_R;r++)for(let c=0;c<LAT_C;c++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),r<2?atomM2:atomM);
  latG.add(m); lats.push({m,r,c});
}
const bondGeo=new THREE.BufferGeometry();
bondGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(((LAT_C-1)*LAT_R+(LAT_R-1)*LAT_C)*2*3),3));
const bonds=new THREE.LineSegments(bondGeo,new THREE.LineBasicMaterial({color:0x5b6b7d,transparent:true,opacity:0.7}));
latG.add(bonds);
function updateLattice(){
  const ee=Math.max(0,eps-ep);              // 弹性应变
  const st=clamp(1+ee*1.5,1,1.3);           // 键伸长（放大显示）
  const fd=clamp(ep/2,0,1)*LAT_C;           // 位错前沿（塑性滑移传播）
  const b=LSP*st;
  const pos=[];
  lats.forEach(a=>{
    const x0=(a.c-(LAT_C-1)/2)*b, y0=((LAT_R-1)/2-a.r)*LSP;
    let x=x0;
    if(a.r<2){ // 滑移面上方原子整体错移一个晶格
      const f=clamp(fd-a.c,0,1);
      x=x0+f*b*0.92;
    }
    a.m.position.set(x,y0,0);
  });
  lats.forEach(a=>{
    if(a.c<LAT_C-1){const nb=lats.find(o=>o.r===a.r&&o.c===a.c+1);
      pos.push(a.m.position.x,a.m.position.y,0,nb.m.position.x,nb.m.position.y,0);}
    if(a.r<LAT_R-1){const nb=lats.find(o=>o.r===a.r+1&&o.c===a.c);
      pos.push(a.m.position.x,a.m.position.y,0,nb.m.position.x,nb.m.position.y,0);}
  });
  bondGeo.attributes.position.array.set(pos);
  bondGeo.attributes.position.needsUpdate=true;
}

/* ---- CSS2D 标签 ---- */
const labelReg=[];
function addLabel(fn,pos,cls,vis=()=>true,parent){
  const div=document.createElement('div');div.className='lbl '+(cls||'');
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||scene).add(o);
  labelReg.push({o,fn,vis});div.textContent=fn();return o;
}
addLabel(()=>L('上夹头（固定）','Upper grip (fixed)'),new THREE.Vector3(0,4.35,0),'b');
addLabel(()=>L(mat.zh+' 试棒 · 标距 6',' '+mat.en+' bar · gauge 6'),new THREE.Vector3(2.2,1.6,0),'o',()=>!broken);
addLabel(()=>L('下夹头（拉伸）','Lower grip (pulls)'),new THREE.Vector3(0,-4.6,0),'g',()=>!broken);
addLabel(()=>L('位错在滑移面上推进 → 永久变形','Dislocation glides → permanent strain'),new THREE.Vector3(-5.6,2.1,-1.2),'r',()=>latG.visible);

/* ---- 主题/语言/步骤 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
  scene.fog.color.setHex(THEME==='dark'?0x101418:0xe9e4dc);
  refreshPlotColors();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}
const STEPS=[
 {zh:'应力 σ=F/A₀、应变 ε=ΔL/L₀：一条曲线就是材料的传记',en:'σ=F/A₀, ε=ΔL/L₀: the curve is the material\'s biography'},
 {zh:'弹性区：原子间距被拉长、键当弹簧——卸载沿原路返回零点',en:'Elastic: bonds as springs — unloading retraces to zero'},
 {zh:'屈服：位错成排滑移，卸载回不到零 → 永久变形（塑性）',en:'Yield: dislocations glide; unload leaves permanent strain'},
 {zh:'应变硬化→颈缩：继续拉，局部缩腰，工程应力转降',en:'Hardening → necking: a waist forms, engineering stress turns down'},
 {zh:'断裂：脆性(玻璃)从弹性直接弹断；韧性(钢)靠大塑性区吸能',en:'Fracture: brittle glass snaps elastically; ductile steel absorbs energy'},
 {zh:'安全系数=强度/工作应力：设计永远待在弹性区，远离屈服',en:'Safety factor = strength / working stress: stay elastic, far from yield'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>gotoStep(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function gotoStep(i){
  activeStep=i;syncSteps();
  setMat(i===4?'glass':'steel');
  reset();
  if(i===1){eps=yieldEps()*0.4;playing=false;}
  if(i===2){eps=yieldEps()*1.8;ep=eps-yieldEps();playing=false;}
  if(i===3){eps=mat.eu;ep=mat.eu-curve(mat.eu)/mat.E*10;neck=0.01;playing=false;}
  if(i===4){eps=mat.ef*0.7;playing=true;}
  if(i===5){eps=yieldEps()*0.55;playing=false;}
  if(i===0||i===4)playing=true;
  rebuild();syncState();
}
function setMat(key){
  mat=MATS[key];
  ['mSteel','mAlu','mGlass','mRubber'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById({steel:'mSteel',alu:'mAlu',glass:'mGlass',rubber:'mRubber'}[key]).classList.add('on');
  specM.color.setHex(mat.color);specM.opacity=mat.op;specM.transparent=mat.op<1;
}
function reset(){
  eps=0;sig=0;ep=0;u=0;phase='load';broken=false;neck=0;
  halves.forEach(h=>{scene.remove(h);});halves=[];spVel=[];
  if(sparks){scene.remove(sparks);sparks=null;}
  if(spec)spec.visible=true;
}
function rebuild(){neck=broken?neck:clamp((eps-mat.eu)/Math.max(1e-6,mat.ef-mat.eu),0,1)*0.55*(mat.metal?1:0);buildSpecimen();}
function syncState(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
function phaseName(){
  if(broken)return L('断裂','FRACTURE');
  if(phase==='unload')return L('卸载中','UNLOAD');
  const ey=yieldEps();
  if(eps<ey)return L('弹性','ELASTIC');
  if(eps<mat.eu)return L('屈服·硬化','YIELD·HARD');
  return L('颈缩','NECKING');
}
function updateStats(){
  document.getElementById('stS').innerHTML=sig.toFixed(1)+'<small> MPa</small>';
  document.getElementById('stE').innerHTML=eps.toFixed(2)+'<small> %</small>';
  document.getElementById('stPh').textContent=phaseName();
  document.getElementById('stU').innerHTML=u.toFixed(0)+'<small> MJ/m³</small>';
}

/* ---- σ-ε 曲线 canvas ---- */
const plot=document.getElementById('plot'),pctx=plot.getContext('2d');
let PC={};
function refreshPlotColors(){
  PC={txt:THEME==='dark'?'#9fb0c3':'#5b6b7d',acc:THEME==='dark'?'#ffa94d':'#e8590c',
      red:THEME==='dark'?'#ff6b6b':'#c92a2a',green:THEME==='dark'?'#74d094':'#2b8a3e',
      blue:THEME==='dark'?'#74c0fc':'#1864ab',
      grid:THEME==='dark'?'rgba(255,255,255,.10)':'rgba(15,25,40,.14)'};
}
function drawPlot(){
  const W=plot.width,H=plot.height,px=44,py=18,pw=W-px-12,ph=H-py-34;
  const ex=mat.ef*1.06,sx=mat.su*1.18;
  const X=e=>px+pw*e/ex, Y=s=>py+ph*(1-s/sx);
  pctx.clearRect(0,0,W,H);
  pctx.font='11px sans-serif';pctx.fillStyle=PC.txt;
  pctx.fillText(L('应力-应变曲线（动点实时走）','Stress-strain curve (live dot)'),px,12);
  /* 区域着色：弹性/塑性/颈缩 */
  const ey=yieldEps();
  pctx.fillStyle='rgba(116,208,148,.10)';pctx.fillRect(X(0),Y(sx),X(Math.min(ey,ex))-X(0),ph);
  if(mat.metal&&!mat.rubber){pctx.fillStyle='rgba(255,169,77,.10)';pctx.fillRect(X(ey),Y(sx),X(mat.eu)-X(ey),ph);
    pctx.fillStyle='rgba(255,107,107,.10)';pctx.fillRect(X(mat.eu),Y(sx),X(ex)-X(mat.eu),ph);}
  pctx.strokeStyle=PC.grid;
  for(let i=0;i<=4;i++){pctx.beginPath();pctx.moveTo(px,py+ph*i/4);pctx.lineTo(px+pw,py+ph*i/4);pctx.stroke();}
  pctx.strokeRect(px,py,pw,ph);
  /* 曲线 */
  pctx.strokeStyle=PC.acc;pctx.lineWidth=2;pctx.beginPath();
  for(let i=0;i<=120;i++){const e=ex*i/120,s=curve(Math.min(e,mat.ef));i?pctx.lineTo(X(e),Y(Math.min(s,sx))):pctx.moveTo(X(e),Y(Math.min(s,sx)));}
  pctx.stroke();pctx.lineWidth=1;
  /* 卸载线（永久应变 εp） */
  if(phase!=='load'&&ep>0.01){
    pctx.strokeStyle=PC.blue;pctx.setLineDash([5,4]);pctx.beginPath();
    pctx.moveTo(X(eps),Y(Math.min(Math.max(sig,0),sx)));pctx.lineTo(X(ep),Y(0));pctx.stroke();pctx.setLineDash([]);
    pctx.fillStyle=PC.blue;pctx.fillText(L('永久应变','permanent'),X(ep)-24,H-8);
  }
  /* 关键点标记 */
  pctx.fillStyle=PC.green;pctx.fillText('σy',X(ey)+2,Y(mat.sy)+3);
  if(mat.metal){pctx.fillStyle=PC.red;pctx.fillText('σu',X(mat.eu)+2,Y(mat.su)-4);}
  /* 动点 */
  pctx.fillStyle=PC.red;pctx.beginPath();
  pctx.arc(X(clamp(eps,0,ex)),Y(clamp(sig,0,sx)),4.5,0,7);pctx.fill();
  pctx.fillStyle=PC.txt;
  pctx.fillText('σ/MPa',4,py+8);
  pctx.fillText('ε/%',W-30,H-8);
}
/* ---- 交互 ---- */
['steel','alu','glass','rubber'].forEach(k=>{
  document.getElementById('m'+k[0].toUpperCase()+k.slice(1)).addEventListener('click',()=>{
    setMat(k);reset();rebuild();});
});
document.getElementById('btnUnload').addEventListener('click',()=>{
  if(broken||phase!=='load'||eps<=yieldEps()*1.02)return;
  phase='unload';
  if(mat.rubber){ep=0;}else{ep=eps-curve(eps)/(mat.E*1000)*100;} // 沿 E 斜率回零
});
document.getElementById('btnFast').addEventListener('click',()=>{
  if(broken)return;
  eps=Math.min(mat.eu*1.02,mat.ef*0.98);ep=eps-yieldEps();neck=0.02;
  rebuild();sig=curve(eps);
});
document.getElementById('btnReset').addEventListener('click',()=>{reset();rebuild();});
document.getElementById('sRate').addEventListener('input',e=>{
  rate=+e.target.value/100;document.getElementById('sRateVal').textContent=rate.toFixed(1)+'×';});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;if(playing&&phase==='unload'&&sig<=0)phase='load';syncState();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglLattice').addEventListener('change',e=>{latG.visible=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1')playing=false;
if(qp.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(parseFloat(qp.get('speed'))>0){rate=clamp(parseFloat(qp.get('speed')),0.2,3);
  document.getElementById('sRate').value=rate*100;document.getElementById('sRateVal').textContent=rate.toFixed(1)+'×';}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing&&!broken){
    if(phase==='load'){
      const de=rate*dt*(mat.ratef||1.8); // %每秒：钢 1.8%/s → 断裂约14s
      const de2=Math.min(de,mat.ef-eps);
      u+=curve(eps+de2/2)*de2/100;          // 曲线下面积（韧性）
      eps+=de2;sig=curve(eps);
      if(!mat.rubber)ep=Math.max(ep,eps-curve(eps)/(mat.E*1000)*100); // 塑性应变
      neck=clamp((eps-mat.eu)/Math.max(1e-6,mat.ef-mat.eu),0,1)*0.55*(mat.metal?1:0);
      if(neck!==spec.userData_neck){spec.userData_neck=neck;
        scene.remove(spec);specGeo.dispose();
        specGeo=new THREE.LatheGeometry(profile(neck,-3,3),26);
        spec=new THREE.Mesh(specGeo,specM);scene.add(spec);}
      if(eps>=mat.ef-1e-6){broken=true;sig=0;fractureFX();}
    }else{ // 卸载：金属沿 E 斜率回零留 εp；橡胶超弹性沿原路返回
      eps-=rate*dt*6;
      if(mat.rubber){
        if(eps<=0){eps=0;sig=0;phase='idle';playing=false;syncState();}
        else sig=curve(eps);
      }else{
        eps=Math.max(ep,eps);
        sig=Math.max(0,mat.E*1000*(eps-ep)/100);
        if(eps<=ep+1e-6){sig=0;phase='idle';playing=false;syncState();}
      }
    }
    if(!broken)applyStrain();
  }
  /* 断口两半回弹 + 火花 */
  if(spT<1){
    spT=Math.min(1,spT+dt*1.6);
    halves.forEach(h=>{
      if(h.userData&&h.userData.dir)h.position.y+=h.userData.dir*dt*2.2*(1-spT);
      if(h.userData&&h.userData.glow)h.material.opacity=0.9*(1-spT); // 断口发亮渐熄
    });
    if(sparks){
      const p=sparks.geometry.attributes.position.array;
      for(let i=0;i<18;i++){
        spVel[i].y-=9.8*dt*0.4;
        p[i*3]+=spVel[i].x*dt;p[i*3+1]+=spVel[i].y*dt;p[i*3+2]+=spVel[i].z*dt;
      }
      sparks.geometry.attributes.position.needsUpdate=true;
      sparks.material.opacity=1-spT;
    }
  }
  updateLattice();
  acc+=dt;if(acc>0.1){acc=0;updateStats();drawPlot();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.fn();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSpecimen();buildSteps();activeStep=1;syncSteps();drawPlot();start();
</script>
