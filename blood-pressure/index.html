<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>血压计 · 一条压扁的动脉报出两个数</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff8787;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#f0efed; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,135,135,.6); background: rgba(255,135,135,.12); color: var(--text); }
  .abtn.crash { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(201,42,42,.55); background: rgba(201,42,42,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,135,135,.10); border-color: rgba(255,135,135,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="血压计:一条压扁的动脉报出两个数" data-en="Blood Pressure Monitor: Two Numbers from a Squeezed Artery">血压计:一条压扁的动脉报出两个数</h1>
  <div class="sub" data-zh="袖带充气压过收缩压,肱动脉被压扁、血流中断;每秒 3 mmHg 缓缓放气,脉冲峰刚好顶开动脉的瞬间,湍流撞出柯氏音、袖带里荡起振荡;振荡包络的峰=平均压,起落两端读出收缩压/舒张压 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Inflate past systolic and the brachial artery flattens, flow stops; bleed 3 mmHg per second and each pulse peak cracks it open — turbulence knocks Korotkoff sounds and ripples the cuff; the peak of the oscillation envelope is MAP, its shoulders read systolic/diastolic · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">袖带充气压过收缩压,肱动脉被压扁、血流中断;每秒 3 mmHg 缓缓放气,脉冲峰刚好顶开动脉的瞬间,湍流撞出柯氏音、袖带里荡起振荡;振荡包络的峰=平均压,起落两端读出收缩压/舒张压 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="袖带压" data-en="Cuff pressure">袖带压</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="动脉内压(瞬)" data-en="Arterial (inst.)">动脉内压(瞬)</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="动脉开度" data-en="Artery opening">动脉开度</span><span class="v" id="stO">—</span>
  <span class="k" data-zh="测量结果" data-en="Reading">测量结果</span><span class="v ok" id="stR">—</span>
  <span class="k" data-zh="阶段" data-en="Phase">阶段</span><span class="v" id="stP">—</span>
</div>

<div id="plot">
  <h3 data-zh="袖带压(蓝,含放大振荡)· 动脉压(红)· 振荡包络(橙虚线)· 竖线=检出" data-en="Cuff (blue, ripples exaggerated) · arterial (red) · oscillation envelope (amber dashes) · lines = detections">袖带压(蓝,含放大振荡)· 动脉压(红)· 振荡包络(橙虚线)· 竖线=检出</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.r" data-zh="血流/柯氏音" data-en="flow / Korotkoff">血流/柯氏音</span>
    <span class="chip.b" data-zh="袖带与气囊" data-en="cuff & bladder">袖带与气囊</span>
    <span class="chip.o" data-zh="振荡包络" data-en="oscillation envelope">振荡包络</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnMeas" data-zh="开始测量(自动充放气)" data-en="start measurement">开始测量(自动充放气)</button>
    <button class="abtn" id="btnStop" data-zh="泄气归零" data-en="deflate to zero">泄气归零</button>
  </div>
  <div class="row"><label data-zh="血压设定(收缩)" data-en="Systolic">血压设定(收缩)</label><input id="sys" type="range" min="90" max="180" step="2" value="120"><span class="val" id="sysVal">120</span></div>
  <div class="row"><label data-zh="舒张" data-en="Diastolic">舒张</label><input id="dia" type="range" min="50" max="120" step="2" value="80"><span class="val" id="diaVal">80</span></div>
  <div class="row"><label data-zh="时间" data-en="Time">时间</label><input id="tm" type="range" min="0" max="40" step="0.1" value="0"><span class="val" id="tmVal">0 s</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../heart-cycle/" data-zh="血压从哪来" data-en="where the pressure comes from">血压从哪来</a>
    <a href="../sonar-ultrasound/" data-zh="多普勒测血流" data-en="Doppler blood flow">多普勒测血流</a>
    <a href="../defibrillator/" data-zh="心律的另一课" data-en="rhythm, another lesson">心律的另一课</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xf0efed : 0x0f1013);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('血压计 · 一条压扁的动脉报出两个数', 'Blood Pressure Monitor · Two Numbers from a Squeezed Artery');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setToggleBtns();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 1.35, 4.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.8;
controls.maxDistance = 14;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(3, 6, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 2, -4);
scene.add(fill);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const ground = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 7, 0.12, 48),
  mat(0x23262c, { roughness: 0.95, emissive: 0x000000, opacity: 1 }));
ground.position.y = -0.35;
scene.add(ground);
/* V 形支托 */
for (const dx of [-0.85, 0.85]) {
  const stand = new THREE.Group();
  stand.position.set(dx, 0, 0);
  scene.add(stand);
  for (const rz of [0.6, -0.6]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 1.1), mat(0x3a4048, { roughness: 0.6, metalness: 0.3, opacity: 1 }));
    leg.rotation.z = rz;
    leg.position.y = 0.16;
    stand.add(leg);
  }
}

/* ================= 手臂(剖面) ================= */
const ARM_R = 0.62, ARM_Y = 0.72;
const armG = new THREE.Group();
armG.position.y = ARM_Y;
scene.add(armG);
/* 皮肤(半透明,能看进去) */
const skin = new THREE.Mesh(new THREE.CylinderGeometry(ARM_R, ARM_R, 2.9, 40, 1, true),
  new THREE.MeshStandardMaterial({ color: 0xe0b48e, roughness: 0.65, transparent: true, opacity: 0.24, side: THREE.DoubleSide, depthWrite: false }));
skin.rotation.z = Math.PI / 2;
armG.add(skin);
/* 肱骨(下后方) */
const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.13, 2.6, 16), mat(0xf2ead8, { roughness: 0.5, opacity: 1 }));
bone.rotation.z = Math.PI / 2;
bone.position.set(0, -0.22, -0.2);
armG.add(bone);
/* 肌肉 */
const muscle = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), mat(0xa84a44, { roughness: 0.6, opacity: 1 }));
muscle.scale.set(2.4, 0.72, 0.7);
muscle.position.set(-0.3, -0.12, 0.05);
armG.add(muscle);

/* 肱动脉:可形变管(沿 X,前侧偏上) */
const ART_R = 0.085, ART_LEN = 2.8, ART_Y = 0.06, ART_Z = 0.14;
const artGeo = new THREE.CylinderGeometry(ART_R, ART_R, ART_LEN, 20, 36, true);
artGeo.rotateZ(Math.PI / 2);
const artBase = artGeo.attributes.position.array.slice();
const artery = new THREE.Mesh(artGeo, new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.45, transparent: true, opacity: 0.95 }));

/* ================= 状态与模型 ================= */
let sys = clamp(qsFloat('sys', 120), 90, 180);
let dia = clamp(qsFloat('dia', 80), 50, Math.min(sys - 10, 120));
const MAPv = () => dia + (sys - dia) / 3;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);

let Pc = 0;                                    // 袖带压
let cuffMode = 'idle';                         // idle | inflate | hold | deflate | done
let holdT = 0;
let heartPhase = 0;
const HR = 70, HP = 60 / HR;                   // 心动周期 s
let beatCount = 0;
let recordings = [];                           // 每拍 {pc, amp, tPeak, fPeak}
let sysMeas = 0, mapMeas = 0, diaMeas = 0;

let lastOpenState = false;
let ampMaxSeen = 0;
let korotEvents = [];                          // 时间点(画图)
/* 心动脉搏波:主峰 + 重搏切迹 */
function pulseWave(ph) {
  const a = Math.exp(-Math.pow((ph - 0.14) / 0.085, 2)) * 0.92;
  const b = Math.exp(-Math.pow((ph - 0.42) / 0.16, 2)) * 0.30;
  return clamp(a + b, 0, 1.1);
}
const Pin = () => dia + (sys - dia) * pulseWave(heartPhase);
/* 振荡包络:非对称高斯 × 血流闸门(动脉只在 sys 下方裂开、dia 下方全开) */
function envAmp(pc) {
  const map = MAPv();
  const g = pc > map ? Math.exp(-Math.pow((pc - map) / 26, 2)) : Math.exp(-Math.pow((map - pc) / 13, 2)) * 0.95;
  const gate1 = clamp((sys - pc) / 3, 0, 1);   // 高于收缩压:完全压闭,无振荡
  const gate2 = clamp((pc - dia) / 3, 0, 1);   // 低于舒张压:全开,振荡消失
  return g * gate1 * gate2;
}
/* 动脉开度(跨壁压) */
function openness(pin) {
  const tm = pin - Pc;
  return tm >= 0 ? 1 : Math.exp(tm / 16);
}

function stepIndex() {

  if (cuffMode === 'deflate') return 2;
  if (cuffMode === 'inflate') return 1;
  return 0;
}

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
const hist = [];                              // {t, pc, pin}
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 14, padB = 18;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const T0 = Math.max(0, tS - 30);
  const xOf = t => pad + (W - 2 * pad) * (t - T0) / 30;
  const yOf = p => pad + (H - pad - padB) * (1 - clamp(p, 0, 200) / 200);
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - padB); ctx.lineTo(W - pad, H - padB); ctx.stroke();
  /* 收缩/舒张参考线 */
  ctx.setLineDash([5, 6]);
  ctx.strokeStyle = 'rgba(255,107,107,.4)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(pad, yOf(sys)); ctx.lineTo(W - pad, yOf(sys)); ctx.stroke();
  ctx.strokeStyle = 'rgba(116,192,252,.4)';
  ctx.beginPath(); ctx.moveTo(pad, yOf(dia)); ctx.lineTo(W - pad, yOf(dia)); ctx.stroke();
  ctx.setLineDash([]);
  /* 历史曲线 */
  const line = (pick, color, w) => {
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath();
    let started = false;
    for (const h of hist) {
      if (h.t < T0) continue;
      const x = xOf(h.t), y = yOf(pick(h));
      started ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), started = true);
    }
    ctx.stroke();
  };
  line(h => h.pin, '#ff6b6b', 1.6);
  /* 振荡包络(放大 60 mmHg 显示) */
  ctx.setLineDash([6, 5]);
  ctx.strokeStyle = 'rgba(255,169,77,.85)'; ctx.lineWidth = 2;
  ctx.beginPath();
  let envStarted = false;
  for (const h of hist) {
    if (h.t < T0) continue;
    const x = xOf(h.t), y = yOf(envAmp(h.pcr) * 60);
    envStarted ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), envStarted = true);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  line(h => h.pc, '#74c0fc', 2.6);
  /* 检出竖线 */
  for (const e of korotEvents) {
    if (e.t < T0) continue;
    ctx.strokeStyle = e.kind === 'sys' ? 'rgba(255,107,107,.8)' : e.kind === 'dia' ? 'rgba(116,192,252,.8)' : 'rgba(255,169,77,.8)';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(xOf(e.t), pad); ctx.lineTo(xOf(e.t), H - padB); ctx.stroke();
    ctx.fillStyle = cTxt; ctx.font = '13px system-ui';
    ctx.fillText(e.tag, clamp(xOf(e.t) - 18, pad, W - pad - 60), pad + 12 + (e.kind === 'map' ? 16 : 0));
  }
  ctx.fillStyle = cTxt; ctx.font = '14px system-ui';
  ctx.fillText('200', pad - 10, pad + 12);
  ctx.fillText('mmHg', W - pad - 52, H - 4);
}

/* ================= 动脉形变 / 粒子 / 袖带 ================= */
function updateArtery(dt) {
  const pin = Pin();
  const f = openness(pin);
  const pos = artGeo.attributes.position.array;
  for (let i = 0; i < pos.length; i += 3) {
    const x = artBase[i], y0 = artBase[i + 1], z0 = artBase[i + 2];
    const w = Math.exp(-Math.pow(x / 0.42, 2));            // 只在袖带下方塌陷
    const sy = 1 - (1 - clamp(0.1 + 0.9 * f, 0, 1)) * w;   // 纵向压扁
    const sz = 1 + (1 - f) * 0.5 * w;                      // 横向鼓出(体积守恒感)
    pos[i] = x;
    pos[i + 1] = y0 * sy;
    pos[i + 2] = z0 * sz;
  }
  artGeo.attributes.position.needsUpdate = true;
  artGeo.computeVertexNormals();
  /* 血流粒子 */
  const turb = f > 0.05 && f < 0.85 ? (1 - f) * 0.6 : 0;   // 半开=湍流
  const step = 0.15 + 2.6 * (f > 0.02 ? f : 0);
  for (let i = 0; i < PART_N; i++) {
    const p = parts[i];
    p.x += step * dt;
    if (p.x > 1.45) p.x = -1.45;
    const rMax = ART_R * (0.3 + 0.7 * clamp(f, 0.1, 1));
    p.y = Math.sin(p.ph + tS * 6) * rMax * (turb > 0 ? Math.random() * turb + 0.3 : 0.55);
    p.z = Math.cos(p.ph * 1.3 + tS * 5) * rMax * (turb > 0 ? Math.random() * turb + 0.3 : 0.55);
    dummy.position.set(p.x, ART_Y + p.y, ART_Z + p.z);
    dummy.scale.setScalar(f > 0.02 ? 1 : 0.4);
    dummy.updateMatrix();
    partIM.setMatrixAt(i, dummy.matrix);
  }
  partIM.instanceMatrix.needsUpdate = true;
  return f;
}
function updateCuff() {
  const pr = clamp(Pc / 220, 0, 1);
  const r = ARM_R + 0.075 + 0.055 * pr;
  cuffShell.scale.set(r, 1, r);
  for (const s of cuffG.children) if (s.geometry.type === 'TorusGeometry') s.scale.setScalar(r);
  cuffShell.material.opacity = 0.55 + 0.3 * pr;
  /* 压力表指针:300 mmHg 满量程 */
  needle.rotation.z = lerp(2.4, -2.4, clamp(Pc / 300, 0, 1));
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0, histAcc = 0, prevHeart = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05) * (playing ? speed : 0);
  tS += dt;
  /* 袖带状态机 */
  if (cuffMode === 'inflate') {
    Pc += 30 * dt;
    if (Pc >= sys + 30) { Pc = sys + 30; cuffMode = 'hold'; holdT = 0; }
  } else if (cuffMode === 'hold') {
    holdT += dt;
    if (holdT > 0.6) cuffMode = 'deflate';
  } else if (cuffMode === 'deflate') {
    Pc -= 3 * dt;
    if (Pc <= 40) {
      Pc = Math.max(Pc, 40);
      cuffMode = 'done';
      if (!mapMeas && recordings.length) {                 // 兜底:取记录中幅度最大的一拍
        let best = recordings[0];
        for (const r of recordings) if (r.amp > best.amp) best = r;
        mapMeas = Math.round(best.pc);
        korotEvents.push({ t: tS, kind: 'map', tag: 'MAP' });
      }
    }
  } else if (cuffMode === 'idle' && Pc > 0) {
    Pc = Math.max(0, Pc - 40 * dt);
  }
  /* 心搏 */
  prevHeart = heartPhase;
  heartPhase = (heartPhase + dt / HP) % 1;
  if (heartPhase < prevHeart) beatFired();
  /* 场景更新 */
  const f = updateArtery(dt);
  updateCuff();
  /* 柯氏音检测:开度从 <0.2 跃升到 ≥0.2 的瞬间 */
  const openNow = f >= 0.2;
  if (openNow && !lastOpenState && cuffMode === 'deflate') {
    korotkoff = 0.3;
    const ticks = korotEvents.filter(e => e.kind === 'tick');
    if (ticks.length >= 4) korotEvents.splice(korotEvents.indexOf(ticks[0]), 1);
    korotEvents.push({ t: tS, kind: 'tick', tag: '' });
  }
  lastOpenState = openNow;
  if (korotkoff > 0) korotkoff -= dt;
  /* 历史记录 */
  histAcc += dt;
  if (histAcc >= 0.03) {
    histAcc = 0;
    const osc = envAmp(Pc) * pulseWave(heartPhase) * 5;    // 振荡视觉放大 ×5
    hist.push({ t: tS, pc: Pc + osc, pcr: Pc, pin: Pin() });
    if (hist.length > 2200) hist.shift();
  }
  elTm.value = tS % 40;
  elTmVal.textContent = (tS % 40).toFixed(0) + ' s';
  statsAcc += dt;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    stC.textContent = Pc.toFixed(0) + ' mmHg';
    stA.textContent = Pin().toFixed(0) + ' mmHg';
    stO.textContent = (f * 100).toFixed(0) + ' %';
    stO.className = 'v ' + (f > 0.9 ? 'ok' : f > 0.1 ? 'warn' : 'bad');
    stR.textContent = sysMeas > 0 ? `${sysMeas}/${diaMeas}` : '—';
    stP.textContent = phaseName();
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
/* 每次心搏峰值:记录袖带振荡幅度,实时跑示波法判据 */
function beatFired() {
  beatCount++;
  if (cuffMode !== 'deflate') return;
  const amp = envAmp(Pc);
  recordings.push({ pc: Pc, amp });
  const maxRef = 1;                                        // envAmp 归一化峰值为 1
  if (!sysMeas && amp >= 0.1 * maxRef && Pc < sys) {       // 高压侧爬过阈值 ≈ 收缩压
    sysMeas = Math.round(Pc);
    korotEvents.push({ t: tS, kind: 'sys', tag: 'SYS' });
  }
  ampMaxSeen = Math.max(ampMaxSeen, amp);
  if (!mapMeas && amp >= 0.9 * maxRef) {
    mapMeas = Math.round(Pc);
    korotEvents.push({ t: tS, kind: 'map', tag: 'MAP' });
  }
  // 低压侧跌出阈值 ≈ 舒张压(必须确认包络已过峰,否则会在高压侧误触发)
  if (!diaMeas && ampMaxSeen >= 0.9 * maxRef && Pc < MAPv() && amp < 0.15 * maxRef) {
    diaMeas = Math.round(Pc);
    korotEvents.push({ t: tS, kind: 'dia', tag: 'DIA' });
  }
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
sys = clamp(qsFloat('sys', 120), 90, 180);
dia = clamp(qsFloat('dia', 80), 50, Math.min(sys - 10, 120));
if (qsBool('auto', false)) cuffMode = 'inflate';
syncSliders();
applyTheme();
applyLang();
syncAll();
setPlayLabel();
start();
</script>
