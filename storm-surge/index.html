<title>风暴潮 · 台风抽海水的两根管子</title>
<style>

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

</style>
</head>

  <div class="sub" data-zh="台风抽海水有两根管子:低压把海面吸高——逆气压计效应,每低 1 hPa 海面抬 ≈1 cm(Δh=Δp/ρg);风应力再把表层水整层推向岸边,浅水处无处可去只能堆高,大陆架与喇叭口把增水放大数倍;北半球右前象限风与移速同向、堆积最凶,再撞上天文大潮,灾害等级就此定型 · 拖动旋转 / 空格运行/暂停" data-en="A typhoon pumps the sea through two pipes: low pressure sucks the surface up — the inverse barometer lifts the sea ≈1 cm per hPa (Δh=Δp/ρg); wind stress then drives the surface layer shoreward where shallow water has nowhere to go but up, amplified severalfold by shelves and funnel bays; in the Northern Hemisphere the right-front quadrant, wind aligned with storm motion, piles highest — land it on a spring high tide and the disaster grade is set · drag to orbit / Space = run/pause">台风抽海水有两根管子:低压把海面吸高——逆气压计效应,每低 1 hPa 海面抬 ≈1 cm(Δh=Δp/ρg);风应力再把表层水整层推向岸边,浅水处无处可去只能堆高,大陆架与喇叭口把增水放大数倍;北半球右前象限风与移速同向、堆积最凶,再撞上天文大潮,灾害等级就此定型 · 拖动旋转 / 空格运行/暂停</div>

{const xs=[-4.5,-10,-15.5,-20.5],zs=[-11.5,-8,-4.8,-1.6,1.6,4.8,8,11.5];
 for(const x of xs)for(const z of zs)arrPos.push([x,z]);}
const m4=new THREE.Matrix4();

/* 状态 */
let mode='both',pc=965,U=42,az=35,playing=true,labelsOn=true,slowMo=false,tideOn=true;
let simT=0,yLevel=0,vy=0,tideNow=0,prox=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const DEG=Math.PI/180;
/* 物理常数:逆气压计 Δh=Δp/ρg≈1 cm/hPa;风应力 setup=τL/(ρ g h) */
const RHOA=1.15,CD=2.2e-3,RHOW=1025,G=9.81,LSH=40000,HDEP=12;
function azRad(){return az*DEG;}
function uOn(){return mode==='wind'||mode==='both'?U*(0.30+0.70*Math.cos(azRad()))*1.15:0;}
function baroM(){return mode==='pres'||mode==='both'?(1013-pc)*0.00995:0;}
function windM(){const u=uOn();if(u<=0)return 0;
  const tau=RHOA*CD*u*u;
  return tau*LSH/(RHOW*G*HDEP);}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblStorm=addLabel(()=>L(`台风中心 ${pc.toFixed(0)} hPa`,`Typhoon core ${pc.toFixed(0)} hPa`),
  new THREE.Vector3(0,4.3,0),'b');
stormG.add(lblStorm);lblStorm.position.set(0,1.5,0);
const lblBaro=addLabel(()=>L(`气压增水 ${baroM().toFixed(2)} m`,`Baro setup ${baroM().toFixed(2)} m`),
  new THREE.Vector3(-6.5,1.8,-9),'o',()=>mode!=='wind');
const lblWind=addLabel(()=>L('风应力:表层水被整层推向岸','Wind stress: the surface layer is driven shoreward'),
  new THREE.Vector3(-11,2.4,7),'y',()=>mode!=='pres');
const lblShelf=addLabel(()=>L('浅海大陆架:水浅无处可去,只能堆高','Shallow shelf: nowhere to go but up'),
  new THREE.Vector3(-15,-0.6,-10),'g');
const lblTide=addLabel(()=>L(`天文潮 ${tideNow>=0?'+':''}${tideNow.toFixed(2)} m`,
    `Tide ${tideNow>=0?'+':''}${tideNow.toFixed(2)} m`),
  new THREE.Vector3(1.6,2.6,10),'b',()=>tideOn);
const lblLevel=addLabel(()=>L(`岸边总增水 ${yLevel.toFixed(2)} m`,`Coastal level +${yLevel.toFixed(2)} m`),
  new THREE.Vector3(-1.6,3.9,-6),'r',()=>yLevel>0.15);
const lblRF=addLabel(()=>L('右前象限:风与移速同向,堆积最凶','Right-front quadrant: wind + motion aligned'),
  new THREE.Vector3(2.2,1.2,-12),'r',()=>mode!=='pres'&&az<45);
const lblReb=addLabel(()=>L('风暴过境:水体回摆振荡','After landfall: the water swings back'),
  new THREE.Vector3(-7,2.2,4),'y',()=>Math.abs(vy)>0.28&&prox<0.4);

function setMode(m){mode=m;
  document.getElementById('bPres').classList.toggle('on',m==='pres');
  document.getElementById('bWind').classList.toggle('on',m==='wind');
  document.getElementById('bBoth').classList.toggle('on',m==='both');
  updateStats();}
function setP(v){pc=clamp(v,950,1000);
  document.getElementById('sP').value=pc;
  document.getElementById('sPVal').textContent=pc.toFixed(0)+' hPa';updateStats();}
function setU(v){U=clamp(v,20,60);
  document.getElementById('sU').value=U;
  document.getElementById('sUVal').textContent=U.toFixed(0)+' m/s';updateStats();}
function setAz(v){az=clamp(v,0,90);
  document.getElementById('sAz').value=az;
  document.getElementById('sAzVal').textContent=az.toFixed(0)+'°';updateStats();}

const STEPS=[
 {zh:'<b>低压吸管</b>:逆气压计效应,每低 1 hPa 海面抬 ≈1 cm,Δh=Δp/ρg',en:'<b>The suction pipe</b>: inverse barometer — ≈1 cm per hPa, Δh=Δp/ρg',
  act(){setMode('pres');setP(955);setU(30);}},
 {zh:'<b>风应力推水</b>:τ=ρ_a C_D U² 把表层水整层推向岸,setup=τL/(ρgh)',en:'<b>The wind pipe</b>: τ=ρ_a C_D U² drives the layer shoreward, setup=τL/(ρgh)',
  act(){setMode('wind');setU(45);setAz(20);}},
 {zh:'<b>右前象限最险</b>:路径垂直指岸,风与移速同向,风暴潮最凶',en:'<b>Right-front quadrant</b>: track aimed at the coast, wind and motion align',
  act(){setMode('both');setAz(0);setU(50);setP(965);}},
 {zh:'<b>浅海放大</b>:水深 h 变浅、坡缓的大陆架让增水翻倍',en:'<b>Shelf amplification</b>: shallow water makes the setup pile twice as high',
  act(){setAz(30);setU(55);}},
 {zh:'<b>喇叭口海湾</b>:湾口收窄,能量汇聚,水位再抬一级',en:'<b>Funnel bay</b>: the mouth narrows, energy converges, the level steps up again',
  act(){setU(58);setP(955);setAz(15);}},
 {zh:'<b>撞上天文大潮</b>:增水叠加朔望高潮,灾害等级就此定型',en:'<b>Hitting the spring tide</b>: surge atop a spring high sets the disaster grade',
  act(){tideOn=true;document.getElementById('tglTide').checked=true;setP(950);setU(58);}},
 {zh:'<b>过境回摆</b>:风暴离开,堆积的水体回流,岸边水位振荡衰减',en:'<b>The swing-back</b>: the storm leaves, piled water returns, the level rings down',
  act(){setP(992);setU(24);setAz(70);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const bm=baroM();
  document.getElementById('stBaro').innerHTML=(bm*100).toFixed(0)+'<small> cm</small>';
  const wm=windM();
  document.getElementById('stWind').innerHTML=wm.toFixed(2)+'<small> m</small>';
  const tv=document.getElementById('stTot');
  tv.innerHTML=yLevel.toFixed(2)+'<small> m</small>';
  tv.className='v '+(yLevel>2?'warn':'');
  const td=document.getElementById('stTide');
  td.innerHTML=(tideOn?tideNow:0).toFixed(2)+'<small> m</small>';
  td.className='v '+(tideOn&&tideNow>1.2?'warn':'');
}

document.getElementById('bPres').addEventListener('click',()=>setMode('pres'));
document.getElementById('bWind').addEventListener('click',()=>setMode('wind'));
document.getElementById('bBoth').addEventListener('click',()=>setMode('both'));
document.getElementById('sP').addEventListener('input',e=>setP(+e.target.value));
document.getElementById('sU').addEventListener('input',e=>setU(+e.target.value));
document.getElementById('sAz').addEventListener('input',e=>setAz(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglTide').addEventListener('change',e=>{tideOn=e.target.checked;updateStats();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  landM.color.setHex(dark?0x253028:0x9db894);
  headM.color.setHex(dark?0x2a3a30:0x8fae86);
  cityM.color.setHex(dark?0x54607a:0x8d99ad);
  dikeM.color.setHex(dark?0x8d97a1:0xa9b2bc);
  seaM.color.setHex(dark?0x14608a:0x5fa8c8);
  paintFloor(dark);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

camera.position.set(13.5,9.5,16.5);
controls.target.set(-4,0.8,0);

const clock=new THREE.Clock();
let raf=null;
const seaPos=seaGeo.attributes.position;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 台风路径:靠近—过境—远离 */
  const D=7+13*(0.5-0.5*Math.cos(simT*0.13));
  const b=azRad()*0.6;
  const sx=-2-D*Math.cos(b)*0.9;
  const sz=clamp(D*Math.sin(b)*0.55-1,-11,11);
  prox=Math.exp(-((D-7)/8)*((D-7)/8));
  /* 水位:阻尼弹簧趋向目标,过境后自然回摆振荡 */
  const target=(baroM()+windM())*prox;
  vy+=((target-yLevel)*2.1-vy*1.15)*dts;
  yLevel+=vy*dts;
  if(!isFinite(yLevel)){yLevel=0;vy=0;}
  tideNow=tideOn?1.4*Math.sin(simT*Math.PI*2/16):0;
  /* 海面起伏 */
  for(let i=0;i<seaPos.count;i++){
    const x=seaPos.getX(i),z=seaPos.getZ(i);
    const amp=Math.exp(x/13);
    seaPos.setY(i,tideNow+yLevel*amp
      +0.05*Math.sin(0.5*x+simT*2.1)+0.035*Math.sin(0.85*z+1.3-simT*1.6));
  }
  seaPos.needsUpdate=true;
  flood.visible=yLevel>1.02;
  if(flood.visible)flood.position.y=yLevel-0.04;
  /* 台风图形 */
  stormG.position.set(sx,0.35+tideNow*0.5+yLevel*Math.exp(sx/13)*0.9,sz);
  spiral.rotation.y+=dts*2.4;
  const rs=2.2+(1013-pc)*0.05;
  ring1.scale.set(rs,1,rs);ring2.scale.set(rs*1.75,1,rs*1.75);
  ring1M.opacity=0.15+clamp((1013-pc)/63,0,1)*0.5;
  ring2M.opacity=0.08+clamp((1013-pc)/63,0,1)*0.28;
  /* 风应力箭头 */
  const showA=mode!=='pres';
  arrows.visible=showA;
  if(showA){
    const len=clamp(uOn()/45,0.15,1.6);
    for(let i=0;i<NA;i++){
      m4.makeScale(len,1,1);
      m4.setPosition(arrPos[i][0],0.5,arrPos[i][1]);
      arrows.setMatrixAt(i,m4);
    }
    arrows.instanceMatrix.needsUpdate=true;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
