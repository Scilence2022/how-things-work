<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>行星环与牧羊卫星 · 洛希极限内的碎屑海</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="行星环与牧羊卫星" data-en="Planetary Rings &amp; Shepherd Moons">行星环与牧羊卫星</h1>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const QS=new URLSearchParams(location.search);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,60,180);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,400);
camera.position.set(0,24,16);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=3; controls.maxDistance=90;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.1); key.position.set(6,12,4); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.25); fill.position.set(-8,4,-6); scene.add(fill);

/* ---- 物理常数与换算（土星真实数据）----
   引力参数 GM=3.7931e16 m^3/s^2；主环 74,500–140,200 km。
   世界坐标 r∈[2,9] 线性映射该环带；轨道周期 T=2π√(r³/GM)。
   开普勒差速：ω∝r^(-3/2) —— 内圈 5.8 h 一圈，外圈 14.9 h。 */
const GM=3.7931e16, KM0=74500, KM1=140200, R0=2, R1=9;
const kmOfW=w=>KM0+(w-R0)/(R1-R0)*(KM1-KM0);
const wOfKm=k=>R0+(k-KM0)/(KM1-KM0)*(R1-R0);
const Tsec=km=>2*Math.PI*Math.sqrt(Math.pow(km*1000,3)/GM);
let speedK=1;                       // 时间倍速
const HOURS_PER_S=2.2;              // 1× 时 1 现实秒 = 2.2 模拟小时
const OMEGA_C=2*Math.PI*3600*HOURS_PER_S;   // ω_world = OMEGA_C / T_sec(km)
const omegaOf=w=>OMEGA_C/Tsec(kmOfW(w));

/* ---- 土星本体（canvas 画条纹贴图）---- */
const satTex=(()=>{
  const c=document.createElement('canvas'); c.width=64; c.height=256;
  const g=c.getContext('2d');
  const bands=['#a08654','#c8ab77','#8d7448','#d6bd8e','#b09562','#c2a672','#96804f','#dcc79a','#a88c5b','#c8ab77','#8d7448','#cdb384'];
  bands.forEach((col,i)=>{ g.fillStyle=col; g.fillRect(0,i*256/bands.length,64,256/bands.length+1); });
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
})();
const saturnM=new THREE.MeshStandardMaterial({map:satTex,roughness:0.9});
const saturn=new THREE.Mesh(new THREE.SphereGeometry(1.15,48,32),saturnM);
saturn.scale.y=0.9; scene.add(saturn);

/* ---- 环粒子（InstancedMesh）----
   真实环粒子是 cm–m 级冰块，图中放大 10^6 量级；厚度仅 ~10 m–1 km，图示夸大。 */
const N=3800, N_DYE=170;
const ringGeo=new THREE.SphereGeometry(1,6,5);
const ringMat=new THREE.MeshStandardMaterial({roughness:0.65});
const ring=new THREE.InstancedMesh(ringGeo,ringMat,N);
ring.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(ring);
const pr=new Float32Array(N),pth=new Float32Array(N),py=new Float32Array(N),psz=new Float32Array(N);
const pEdge=new Float32Array(N);    // 距最近缝缘的距离（压波纹用）
let sizeK=1;
const dummy=new THREE.Object3D();
function spawnAll(){
  for(let i=0;i<N;i++){
    let a,b;
    if(i<N_DYE){ a=R0; b=R1; }          // 染色线粒子：t=0 摆在同一条放射线上
    else{
      const x=Math.random();
      if(x<0.14){a=2;b=3.4;}            // C 环：暗
      else if(x<0.56){a=3.4;b=6.2;}     // B 环：最亮最密
      else if(x<0.585){a=6.2;b=6.9;}    // 卡西尼缝：极稀
      else{a=6.9;b=9;}                  // A 环
    }
    pr[i]=a+Math.random()*(b-a);
    pth[i]=(i<N_DYE)?0:Math.random()*Math.PI*2;
    py[i]=((Math.random()+Math.random()+Math.random())-1.5)/1.5*0.03;
    psz[i]=0.018+Math.random()*0.03;
    pEdge[i]=9;
  }
  ring.instanceMatrix.needsUpdate=true;
}
/* 上色：真彩模式按环带；结构模式按半径渐变；染色线始终橙色 */
const _c=new THREE.Color();
function recolor(){
  for(let i=0;i<N;i++){
    if(i<N_DYE){ ring.setColorAt(i,_c.setHex(0xffa94d)); continue; }
    const r=pr[i];
    if(colorMode==='real'){
      if(r<3.4)_c.setHex(0x776a58);
      else if(r<6.2)_c.setHex(0xe9dcbf);
      else if(r<6.9)_c.setHex(0x4a443a);
      else _c.setHex(0xd6c19c);
      const j=0.85+0.3*Math.random(); _c.multiplyScalar(j);
    }else{
      _c.setHSL(0.05+((r-R0)/(R1-R0))*0.6,0.7,0.55);
    }
    ring.setColorAt(i,_c);
  }
  ring.instanceColor.needsUpdate=true;
}

/* ---- 卫星与标记环 ---- */
const moonMatA=new THREE.MeshStandardMaterial({color:0xb8c2cc,roughness:0.5});
const moonMatB=new THREE.MeshStandardMaterial({color:0xd9c8a8,roughness:0.5});
const moon1=new THREE.Mesh(new THREE.SphereGeometry(0.26,20,14),moonMatA); scene.add(moon1);
const moon2a=new THREE.Mesh(new THREE.SphereGeometry(0.16,16,12),moonMatB); scene.add(moon2a);
const moon2b=new THREE.Mesh(new THREE.SphereGeometry(0.16,16,12),moonMatB); scene.add(moon2b);
function dashCircle(color,op){
  const pts=[]; for(let i=0;i<=160;i++){const a=i/160*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a),0,Math.sin(a)));}
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineDashedMaterial({color,dashSize:0.28,gapSize:0.2,transparent:true,opacity:op}));
  ln.computeLineDistances(); scene.add(ln); return ln;
}
const orbCirc=dashCircle(0x74c0fc,0.55);   // 主牧羊卫星轨道
const orb2Circ=dashCircle(0xd9c8a8,0.4);   // F 环牧羊对轨道
const resCirc=dashCircle(0xff6b6b,0.7);    // 2:1 共振位置
const rocheCirc=dashCircle(0xff6b6b,0.5);  // 洛希极限 ~2.4 R_S

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('土星','Saturn'),new THREE.Vector3(0,1.5,0),'b');
addLabel(()=>L('环粒子：冰块 cm–m 级（图中放大）','Ring particles: cm–m ice (enlarged)'),new THREE.Vector3(4.6,0.4,2),'g');
addLabel(()=>L('染色线：t=0 同相位粒子 → 被差速剪切成螺旋','Dyed line: same-phase particles → sheared into spiral'),new THREE.Vector3(-5,0.5,3),'o',()=>simHours>0.3);
addLabel(()=>L('牧羊卫星（质量可调）','Shepherd moon (mass slider)'),new THREE.Vector3(0,0.55,0),'o',()=>m1.on,moon1);
addLabel(()=>L('与卫星 2:1 共振：每两圈扰动累积一次 → 卡西尼缝','2:1 resonance: perturbation stacks every 2 orbits → Cassini Div.'),new THREE.Vector3(0,0.5,0),'r',()=>{const r=resRadius();return m1.on&&r>R0+0.2&&r<R1-0.2;},resCirc);
addLabel(()=>L('洛希极限 ≈2.4 Rₛ：内侧碎屑永远聚不成卫星','Roche limit ≈2.4 Rₛ: debris inside never accretes'),new THREE.Vector3(0,0.6,0),'r',()=>showRoche,rocheCirc);
addLabel(()=>L('F 环环带：被两只牧羊犬夹成细线','F ring: pinched into a ribbon by two shepherds'),new THREE.Vector3(0,0.45,0),'g',()=>m2.on);
addLabel(()=>L('环厚仅 ~10 m–1 km（图示夸大）','Ring only ~10 m–1 km thick (exaggerated)'),new THREE.Vector3(6,0.3,-5),'g',()=>showThick);

/* ---- 状态 ---- */
let playing=true, labelsOn=true, simHours=0, colorMode='real';
let showRoche=false, showThick=false, autoRamp=true;
const m1={on:true,r:13.8,m:0.08,th:0};
const m2={on:false,r:8.15,m:0.3,th:2.1};
let camGoal=null;

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  saturnM.color.setHex(dark?0xffffff:0xd8cdb8);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); syncUI();
}
function resRadius(){ return m1.r*Math.pow(0.5,2/3); }

/* ---- 缝隙清单：卫星自身轨道清缝 + 2:1 共振弱清缝 ---- */
function gapList(){
  const g=[];
  if(m1.on){
    g.push({r:m1.r,half:0.15+0.45*Math.cbrt(m1.m),k:1});
    const rr=resRadius();
    if(rr>R0+0.2&&rr<R1-0.2) g.push({r:rr,half:0.22+0.30*Math.cbrt(m1.m),k:0.3});
  }
  if(m2.on){
    g.push({r:m2.r,half:0.10+0.28*Math.cbrt(m2.m),k:1});
    g.push({r:m2.r+1.0,half:0.10+0.28*Math.cbrt(m2.m),k:1});
  }
  return g;
}

/* ---- 步骤相位 ---- */
const STEPS=[
  {zh:'洛希极限：潮汐力随距离骤增，环内碎屑靠不拢，永远聚不成卫星',en:'Roche limit: tides grow too steep for debris to accrete into a moon'},
  {zh:'开普勒差速：内圈快外圈慢，一条放射状的染色线几年内被剪成螺旋',en:'Keplerian shear: inner laps outer — a radial dyed line winds into a spiral'},
  {zh:'碰撞摊薄：频繁碰撞耗掉上下速度，环被摊成 7 万 km 宽、几十米薄',en:'Collisions damp vertical motion: 70,000 km wide, tens of meters thin'},
  {zh:'牧羊清缝：卫星引力把近旁粒子踢走，缝宽随卫星质量 cbrt(M) 增大',en:'Shepherding: moon kicks nearby particles out; gap ∝ moon mass^(1/3)'},
  {zh:'共振犁缝：卡西尼缝在与土卫一 2:1 共振处——每两圈相遇，扰动累积',en:'Cassini Division sits at Mimas’ 2:1 resonance — kicks stack every 2 orbits'},
  {zh:'F 环双牧羊：内侧土卫十六、外侧土卫十七把环带夹成百公里细线',en:'F ring: Prometheus inside + Pandora outside pinch a narrow ribbon'},
  {zh:'年龄问题：环如此明亮洁白，理应年轻——或许正被“环雨”缓慢掏空',en:'So bright it must be young — the rings may be slowly raining away'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;gotoStep(i);syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  camGoal=null;
  if(i===0){ showRoche=true; m1.on=true; m2.on=false; activeStep=0; }
  else if(i===1){ resetDye(); showThick=false; }
  else if(i===2){ showThick=true; camGoal=new THREE.Vector3(9,1.6,6); }
  else if(i===3){ m1.on=true; m1.r=7.4; m1.m=1.0; m2.on=false; camGoal=new THREE.Vector3(6,7,9); }
  else if(i===4){ m1.on=true; m1.r=13.8; m1.m=1.0; m2.on=false; }
  else if(i===5){ m2.on=true; m2.r=8.15; m2.m=0.3; }
  else if(i===6){ showRoche=true; }
  autoRamp=false; syncUI();
}

/* ---- 统计读数 ---- */
function updateStats(){
  document.getElementById('stT').innerHTML=simHours.toFixed(1)+'<small> h</small>';
  // 剪切角 = 内外圈转角差（染色线缠绕程度）
  const sh=((omegaOf(R0)-omegaOf(R1))*simHours)%(Math.PI*2)*180/Math.PI;
  document.getElementById('stShear').innerHTML=sh.toFixed(0)+'<small> °</small>';
  const gapKm=(0.44+0.60*Math.cbrt(m1.m))*(KM1-KM0)/(R1-R0);  // 共振缝全宽≈2×half 的等效值
  document.getElementById('stGap').innerHTML=gapKm.toFixed(0)+'<small> km</small>';
  document.getElementById('stMass').innerHTML=m1.m.toFixed(2)+'<small> ×土卫一</small>';
}

/* ---- 交互 ---- */
function syncUI(){
  document.getElementById('sMass').value=m1.m;
  document.getElementById('sMassVal').textContent=m1.m.toFixed(2)+' Mima';
  document.getElementById('sOrb').value=m1.r;
  document.getElementById('sOrbVal').textContent=(kmOfW(m1.r)/1000).toFixed(0)+'k km';
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
  document.getElementById('sSizeVal').textContent=sizeK.toFixed(1)+'×';
  document.getElementById('btnMode').classList.toggle('on',colorMode==='struct');
  document.getElementById('btnRoche').classList.toggle('on',showRoche);
  document.getElementById('btnF').classList.toggle('on',m2.on);
}
function resetDye(){ for(let i=0;i<N_DYE;i++) pth[i]=0; }
document.getElementById('btnCassini').addEventListener('click',()=>{m1.on=true;m1.r=13.8;m1.m=1.0;m2.on=false;autoRamp=false;activeStep=4;syncSteps();syncUI();});
document.getElementById('btnF').addEventListener('click',()=>{m2.on=!m2.on;m2.r=8.15;m2.m=0.3;autoRamp=false;activeStep=5;syncSteps();syncUI();});
document.getElementById('btnInRing').addEventListener('click',()=>{m1.on=true;m1.r=7.4;m1.m=1.0;m2.on=false;autoRamp=false;activeStep=3;syncSteps();syncUI();});
document.getElementById('btnDye').addEventListener('click',()=>{resetDye();});
document.getElementById('btnMode').addEventListener('click',()=>{colorMode=colorMode==='real'?'struct':'real';recolor();syncUI();});
document.getElementById('btnRoche').addEventListener('click',()=>{showRoche=!showRoche;syncUI();});
document.getElementById('sMass').addEventListener('input',e=>{m1.m=+e.target.value;autoRamp=false;syncUI();});
document.getElementById('sOrb').addEventListener('input',e=>{m1.r=+e.target.value;autoRamp=false;syncUI();});
document.getElementById('sSize').addEventListener('input',e=>{sizeK=+e.target.value/100;syncUI();});
document.getElementById('sSpd').addEventListener('input',e=>{speedK=+e.target.value/100;syncUI();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
controls.addEventListener('start',()=>{camGoal=null;});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, acc=0, statAcc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const sdt=playing?dt*speedK:0;
  simHours+=sdt*HOURS_PER_S;
  // 开场 4 秒：卫星质量从 0.08 涨到 1.0——看缝隙被当场犁开
  if(autoRamp){ m1.m=Math.min(1,0.08+simHours/ (4*HOURS_PER_S) *0.92); if(m1.m>=1)autoRamp=false; if(Math.random()<0.1)syncUI(); }
  // 卫星沿自身轨道开普勒转动
  if(m1.on) m1.th+=omegaOf(m1.r)*sdt;
  if(m2.on) m2.th+=omegaOf(m2.r)*sdt;
  const gaps=gapList();
  // 粒子：开普勒推进 + 缝缘动力学
  for(let i=0;i<N;i++){
    pth[i]+=omegaOf(pr[i])*sdt;
    let edge=9;
    for(const g of gaps){
      const d=pr[i]-g.r, ad=Math.abs(d);
      if(ad<g.half){
        pr[i]+=Math.sign(d)*g.k*(1-ad/g.half)*0.55*sdt;          // 被推出缝外
        pr[i]+=(Math.random()-0.5)*0.06*sdt;                      // 随机走：质量调小后缝会重新填上
      }
      const e=ad-g.half; if(e<edge)edge=e;
    }
    pEdge[i]=edge;
    pr[i]=clamp(pr[i],R0,R1);
  }
  // 写实例矩阵
  for(let i=0;i<N;i++){
    const w=pr[i], th=pth[i];
    let rr=w;
    if(pEdge[i]<0.09) rr+=0.028*Math.sin(w*38-simHours*1.4);      // 缝缘挤压出密度波纹
    dummy.position.set(rr*Math.cos(th),py[i],-rr*Math.sin(th));
    dummy.scale.setScalar(psz[i]*sizeK);
    dummy.updateMatrix();
    ring.setMatrixAt(i,dummy.matrix);
  }
  ring.instanceMatrix.needsUpdate=true;
  // 卫星与标记环
  moon1.visible=m1.on;
  if(m1.on){
    moon1.position.set(m1.r*Math.cos(m1.th),0.12,-m1.r*Math.sin(m1.th));
    orbCirc.visible=true; orbCirc.scale.setScalar(m1.r);
    const rr=resRadius();
    resCirc.visible=rr>R0*0.8&&rr<R1*1.4; resCirc.scale.setScalar(rr);
  }else{ orbCirc.visible=false; resCirc.visible=false; }
  moon2a.visible=moon2b.visible=m2.on;
  orb2Circ.visible=m2.on;
  if(m2.on){
    moon2a.position.set(m2.r*Math.cos(m2.th),0.1,-m2.r*Math.sin(m2.th));
    moon2b.position.set((m2.r+1)*Math.cos(m2.th+0.5),0.1,-(m2.r+1)*Math.sin(m2.th+0.5));
    orb2Circ.scale.setScalar(m2.r+0.5);
  }
  rocheCirc.visible=showRoche; rocheCirc.scale.setScalar(wOfKm(147000));
  // 相机平滑过渡（点步骤时）
  if(camGoal){ camera.position.lerp(camGoal,1-Math.exp(-2.5*dt)); if(camera.position.distanceTo(camGoal)<0.05)camGoal=null; }
  statAcc+=dt; if(statAcc>0.1){statAcc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
if(QS.get('pause')==='1'){playing=false;}
if(QS.get('labels')==='0'){labelsOn=false;}
const qSpd=QS.get('speed'); if(qSpd){speedK=clamp(+qSpd||1,0.25,4);document.getElementById('sSpd').value=speedK*100;}
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
document.getElementById('tglLabels').checked=labelsOn;
spawnAll(); recolor(); syncUI();
applyTheme(); applyLang(); buildSteps(); updateStats(); start();
</script>
