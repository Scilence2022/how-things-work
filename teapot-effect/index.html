<style>
  :root,:root[data-theme="dark"]{

  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);

  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;

  input[type=range]{width:100%;accent-color:var(--acc);height:18px}

    border:1px solid transparent;align-items:flex-start}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}

  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;

  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

    pointer-events: none; opacity: 0; transition: opacity .2s;

  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }

  @media(max-width:900px){#stats{display:none}}

  <h1 data-zh="茶壶效应 · 水为什么总挂壶嘴不下来" data-en="The Teapot Effect · why the stream hugs the spout">茶壶效应 · 水为什么总挂壶嘴不下来</h1>
  <div class="sub" data-zh="附着力让液流贴着壶嘴走:慢斟时重力拉不断液丝,它就绕过壶嘴的曲率爬上外壁,挂住、聚珠、滴落;倒快一点惯性把流线甩离壁面;疏水涂层让液丝无处可挂 · 拖动旋转 / 空格运行/暂停" data-en="Adhesion makes the stream hug the spout: poured slowly, gravity can\'t snap the filament, which curls over the rim onto the outer wall, hangs, gathers, drips; pour faster and inertia flings it clear; a hydrophobic coating leaves it nothing to cling to · drag to orbit / Space = run/pause">附着力让液流贴着壶嘴走:慢斟时重力拉不断液丝,它就绕过壶嘴的曲率爬上外壁,挂住、聚珠、滴落;倒快一点惯性把流线甩离壁面;疏水涂层让液丝无处可挂 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-2.5,3.6,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.6,1.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 桌面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const table=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,0.18,48),
  new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8}));
table.position.y=-0.09;scene.add(table);

/* ---- 茶壶:壶身+壶嘴+把手+盖 ---- */
const potG=new THREE.Group();potG.position.set(-1.4,0,0);scene.add(potG);
const pourPivot=new THREE.Group();pourPivot.position.set(-0.6,0.6,0);potG.add(pourPivot);
const bodyM=new THREE.MeshStandardMaterial({color:0x7c5cbf,roughness:0.35,metalness:0.05});
const body=new THREE.Mesh(new THREE.SphereGeometry(0.95,32,24),bodyM);
body.scale.set(1.15,0.82,1);body.position.y=0.8;pourPivot.add(body);
const lid=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.46,0.14,24),bodyM);
lid.position.y=1.62;pourPivot.add(lid);
const knob=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),
  new THREE.MeshStandardMaterial({color:0x241f33,roughness:0.4}));
knob.position.y=1.76;pourPivot.add(knob);
/* 壶嘴:内流线(茶水走的路)与外沿(液丝爬的路) */
const spoutInCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.55,0.95,0),new THREE.Vector3(1.15,1.25,0),
  new THREE.Vector3(1.5,1.75,0),new THREE.Vector3(1.62,2.15,0)]);
const spoutM=new THREE.MeshStandardMaterial({color:0x6a4fa8,roughness:0.35});
const spout=new THREE.Mesh(new THREE.TubeGeometry(spoutInCurve,32,0.14,14),spoutM);
pourPivot.add(spout);
/* 壶嘴口(剖面环) */
const lip=new THREE.Mesh(new THREE.CircleGeometry(0.14,16),
  new THREE.MeshStandardMaterial({color:0x2c2340,roughness:0.5}));
lip.position.set(1.62,2.15,0);lip.rotation.x=Math.PI/2;lip.rotation.y=0.5;pourPivot.add(lip);
/* 外沿路径:液丝挂壁时爬的滑道(壶嘴外下缘 → 滴点) */
const clingCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(1.66,2.10,0),new THREE.Vector3(1.70,1.92,0),
  new THREE.Vector3(1.60,1.66,0),new THREE.Vector3(1.38,1.50,0)]);
/* 把手 */
const handleCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.9,1.25,0),new THREE.Vector3(-1.5,1.5,0),
  new THREE.Vector3(-1.55,0.95,0),new THREE.Vector3(-1.05,0.55,0)]);
const handle=new THREE.Mesh(new THREE.TubeGeometry(handleCurve,24,0.07,10),
  new THREE.MeshStandardMaterial({color:0x241f33,roughness:0.5}));
pourPivot.add(handle);

/* ---- 茶杯(接茶) ---- */
const cupG=new THREE.Group();cupG.position.set(1.15,0,0.0);scene.add(cupG);
const cupM=new THREE.MeshPhysicalMaterial({color:0xdfe8f2,roughness:0.1,transparent:true,opacity:0.45,side:THREE.DoubleSide});
const cup=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.34,0.7,24,1,true),cupM);
cup.position.y=0.35;cupG.add(cup);
const teaM=new THREE.MeshStandardMaterial({color:0x9a5a2e,roughness:0.25});
const tea=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.02,24),teaM);
tea.position.y=0.1;cupG.add(tea);

/* ---- 液流粒子(壶内 → 壶嘴 → 自由抛体 / 挂壁路径) ---- */
const NS=64;
const streamM=new THREE.MeshStandardMaterial({color:0xb07a3a,roughness:0.15,metalness:0.1,
  emissive:0x3a2005,emissiveIntensity:0.3});
const stream=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,8),streamM,NS);
scene.add(stream);
/* 挂壁聚珠 */
const drop=new THREE.Mesh(new THREE.SphereGeometry(0.01,14,12),streamM.clone());
drop.visible=false;scene.add(drop);
/* 滴落的珠(记录若干飞行的) */
const ND=8;
const drips=new THREE.InstancedMesh(new THREE.SphereGeometry(0.06,10,10),streamM,ND);
scene.add(drips);
const dripT=new Float32Array(ND).fill(-1);
const dripX=new Float32Array(ND);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let pourV=1.2,theta=40,slowMo=false;
let pouring=true,tilt=0.32;
let clinging=false,dropR=0,dribble=0,cupFill=0.1,dropY0=1.2;
const G=3.4;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('壶嘴曲率 R:液丝的滑道','Spout curvature R: the filament\'s slide'),new THREE.Vector3(1.62,3.0,0),'o');
addLabel(()=>L(`接触角 θ = ${theta.toFixed(0)}°(越大越疏水)`,`Contact angle θ = ${theta.toFixed(0)}° (larger = more hydrophobic)`),new THREE.Vector3(-2.6,2.6,0),'g');
addLabel(()=>L('挂壁滴液点','Drip point'),new THREE.Vector3(1.38,1.1,0),'r',()=>clinging);
addLabel(()=>L('快倒:惯性甩离壁面','Fast pour: inertia flings it clear'),new THREE.Vector3(2.6,2.2,0),'b',()=>!clinging&&pouring);

function vcrit(){
  /* v_c ∝ √(γ·sinθ_c / ρR):接触角越大越难挂,曲率越小越难挂 */
  return 1.9*Math.sqrt(Math.max(0.05,Math.sin(theta*Math.PI/180)))/0.9;
}
function setV(v){pourV=v;document.getElementById('sV').value=v;
  document.getElementById('sVVal').textContent=v.toFixed(1);}
function setTheta(t){theta=t;document.getElementById('sTheta').value=t;
  document.getElementById('sThetaVal').textContent=t.toFixed(0)+'°';}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'附着力:液流总贴着壶嘴内壁走',en:'Adhesion: the stream always hugs the spout wall',
  act(){setV(1.2);setTheta(40);slowMo=false;document.getElementById('tglSlow').checked=false;
    document.getElementById('bSlow').classList.add('on');document.getElementById('bCoat').classList.remove('on');pouring=true;}},
 {zh:'慢斟:出口速度低于临界 v_c,重力拉不断液丝',en:'Slow pour: exit speed below v-critical, gravity can\'t snap the filament',
  act(){setV(1.0);}},
 {zh:'液丝绕过壶嘴曲率,爬上外壁挂住',en:'The filament curls over the rim and clings to the outer wall',
  act(){setV(1.0);setTheta(30);}},
 {zh:'聚珠:挂到够重才滴落,茶渍就是这么留的',en:'Gathering: it drips only when heavy enough — that\'s the stain under the spout',
  act(){setV(0.8);setTheta(30);}},
 {zh:'快倒:惯性把流线甩离壁面,干净断流',en:'Fast pour: inertia flings the stream clear — a clean break',
  act(){setV(2.6);document.getElementById('bFast').classList.add('on');document.getElementById('bSlow').classList.remove('on');}},
 {zh:'疏水涂层:接触角变大,液丝无处可挂',en:'Hydrophobic coating: bigger contact angle, nothing to cling to',
  act(){setTheta(110);setV(1.0);document.getElementById('bCoat').classList.add('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stV').innerHTML=(pourV*9.5).toFixed(0)+'<small> cm/s</small>';
  document.getElementById('stVc').innerHTML=(vcrit()*9.5).toFixed(0)+'<small> cm/s</small>';
  const f=document.getElementById('stF');
  const clingingNow=clinging&&pouring;
  f.textContent=clingingNow?L('挂丝','clinging'):L('断流','clean break');
  f.className='v '+(clingingNow?'warn':'ok');
  document.getElementById('stD').innerHTML=dribble.toFixed(0)+'<small> mg</small>';
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSlow').addEventListener('click',()=>{
  setV(1.0);setTheta(40);
  document.getElementById('bSlow').classList.add('on');
  document.getElementById('bFast').classList.remove('on');
  document.getElementById('bCoat').classList.remove('on');
});
document.getElementById('bFast').addEventListener('click',()=>{
  setV(2.6);setTheta(40);
  document.getElementById('bFast').classList.add('on');
  document.getElementById('bSlow').classList.remove('on');
  document.getElementById('bCoat').classList.remove('on');
});
document.getElementById('bCoat').addEventListener('click',()=>{
  setTheta(110);
  document.getElementById('bCoat').classList.add('on');
});
document.getElementById('sV').addEventListener('input',e=>setV(+e.target.value));
document.getElementById('sTheta').addEventListener('input',e=>setTheta(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglStream').addEventListener('change',e=>{stream.visible=e.target.checked;drips.visible=e.target.checked;drop.visible=e.target.checked&&clinging;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
const lipPos=new THREE.Vector3(),lipDir=new THREE.Vector3();
const tmpV=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 倾斜:速度越低倾得越缓,倾角随之 */
  tilt+=((pourV<2.0?0.30:0.42)-tilt)*Math.min(1,dts*2);
  pourPivot.rotation.z=tilt;
  /* 壶嘴口世界坐标(随倾斜动) */
  lipPos.set(1.62,2.15,0);pourPivot.localToWorld(lipPos);
  lipDir.set(Math.cos(-tilt)*1,-0.55,-0).normalize();
  /* 判定挂丝:速度 < 临界 且 接触角 < 90° */
  clinging=(pourV<vcrit())&&theta<90;
  drop.visible=clinging&&document.getElementById('tglStream').checked;
  /* 液流粒子:前 40% 沿壶嘴内流线,后段按状态走 */
  const NIN=40;
  if(stream.visible){
    for(let i=0;i<NS;i++){
      const t=((simT*pourV*0.9+i/NS)%1);
      let x,y,z=0;
      if(i<NS*0.6){
        /* 壶内到壶嘴口:沿内流线 */
        const s=t*1.15;
        tmpV.copy(spoutInCurve.getPoint(Math.min(1,s)));
        pourPivot.localToWorld(tmpV);
        x=tmpV.x;y=tmpV.y;z=tmpV.z;
      }else if(!clinging){
        /* 自由流:参数弧线从壶嘴口落进杯子,快倒弧更低更直 */
        const s2=clamp((t-0.6)/0.4,0,1);
        const bump=0.85-pourV*0.18;
        x=lipPos.x+(1.15-lipPos.x)*s2;
        y=lipPos.y+(0.55-lipPos.y)*s2+4*bump*s2*(1-s2);
        z=Math.sin(i*3.1)*0.03;
      }else{
        /* 挂壁:沿外沿曲线爬,慢 */
        const s=clamp((t-0.6)/0.4,0,1)*0.92;
        tmpV.copy(clingCurve.getPoint(s));
        pourPivot.localToWorld(tmpV);
        x=tmpV.x;y=tmpV.y;z=tmpV.z;
      }
      const sc=clinging&&i>=NS*0.6?0.7:1;
      m4.makeScale(sc,sc,sc);m4.setPosition(x,y,z);
      stream.setMatrixAt(i,m4);
    }
    stream.instanceMatrix.needsUpdate=true;
  }
  /* 聚珠与滴落 */
  if(clinging&&pouring){
    dropR+=dts*0.05*(2-pourV*0.5);
    dribble+=dts*14;
    const dp=new THREE.Vector3();clingCurve.getPoint(0.92,dp);pourPivot.localToWorld(dp);
    drop.position.copy(dp);
    drop.scale.setScalar(clamp(dropR*10,0.3,1.6));
    if(dropR>0.16){
      dropR=0;
      for(let i=0;i<ND;i++)if(dripT[i]<0){dripT[i]=0;dripX[i]=dp.x;dropY0=dp.y;break;}
    }
  }else{
    dropR=Math.max(0,dropR-dts*0.2);
    drop.scale.setScalar(clamp(dropR*10,0.001,1.6));
  }
  {
    let n=0;
    for(let i=0;i<ND;i++){
      if(dripT[i]>=0){
        dripT[i]+=dts*1.6;
        if(dripT[i]>1)dripT[i]=-1;
        else{
          const T=dripT[i]*1.1;
          const y=Math.max(0.06,dropY0-0.5*G*T*T);
          m4.makeScale(1,1,1);
          m4.setPosition(dripX[i],y,0);
          drips.setMatrixAt(n++,m4);
        }
      }else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-99,0);drips.setMatrixAt(n++,m4);}
    }
    drips.instanceMatrix.needsUpdate=true;
  }
  /* 杯中茶水上涨:断流时快,滴落时几乎不涨 */
  if(pouring){
    cupFill+=dts*(clinging?0.004:0.05);
    cupFill=Math.min(0.5,cupFill);
    tea.scale.y=Math.max(0.02,cupFill/0.02);
    tea.position.y=0.1+cupFill/2;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setV(1.2);setTheta(40);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
