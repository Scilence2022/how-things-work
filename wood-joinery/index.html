<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>榫卯与木构互锁 · 越拉越紧的几何</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.localClippingEnabled=true;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,24,58);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-3.4,5.2,9.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(1.2,0.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(4,8,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-6,4,-5);scene.add(fill);

/* ---- 材质（剖面裁剪：保留 x<1.8 的后半，露出榫舌截面） ---- */
const cutPlane=new THREE.Plane(new THREE.Vector3(-1,0,0),1e6);
const woodM=new THREE.MeshStandardMaterial({color:0xb08a5e,roughness:0.75,clippingPlanes:[cutPlane]});
const woodEndM=new THREE.MeshStandardMaterial({color:0xd2ab7c,roughness:0.85,clippingPlanes:[cutPlane]});
const woodTenM=new THREE.MeshStandardMaterial({color:0x9a7145,roughness:0.7,clippingPlanes:[cutPlane]});
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const arrM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.55,roughness:0.4});
const normM=new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1864ab,emissiveIntensity:0.55,roughness:0.4});

/* ---- 几何：滑入式榫卯（x=滑动/插接方向，y=抬起锁定方向，z=板厚方向）
   燕尾：下板上的梯形榫舌(下宽上窄) + 上板底的燕尾槽(口窄肚宽， undercut)
   抬拉：槽的窄口卡住榫舌的宽根 → 锁死；平推 x：自由滑动 = 装配方向 */
const RAIL_L=2.0,RAIL_H=0.42;
function railShape(dove){  // 榫舌截面 (z,y)：底宽/顶宽
  const s=new THREE.Shape();
  if(dove){s.moveTo(-0.42,0);s.lineTo(0.42,0);s.lineTo(0.26,RAIL_H);s.lineTo(-0.26,RAIL_H);}
  else{s.moveTo(-0.27,0);s.lineTo(0.27,0);s.lineTo(0.27,RAIL_H);s.lineTo(-0.27,RAIL_H);}
  s.closePath();return s;
}
function buildBottom(type){ // 底板 + 榫舌；group 原点=榫舌根中点
  const g=new THREE.Group();
  const board=new THREE.Mesh(new THREE.BoxGeometry(5.6,0.5,1.4),woodM);
  board.position.set(0.4,-0.25,0);g.add(board);
  const geo=new THREE.ExtrudeGeometry(railShape(type==='dove'),{depth:RAIL_L,bevelEnabled:false});
  geo.rotateY(Math.PI/2);            // 挤出 z→x，截面 → (z,y)
  geo.translate(-RAIL_L/2,0,0);      // 榫舌 x∈[-1,1]
  g.add(new THREE.Mesh(geo,woodTenM));
  return g;
}
function grooveOutline(dove){        // 上板截面（含底部开口的燕尾槽，口窄肚宽）
  const s=new THREE.Shape();
  s.moveTo(-1.3,0.52);s.lineTo(1.3,0.52);s.lineTo(1.3,0);
  if(dove){s.lineTo(0.29,0);s.lineTo(0.45,0.44);s.lineTo(-0.45,0.44);s.lineTo(-0.29,0);}
  else{s.lineTo(0.285,0);s.lineTo(0.285,0.44);s.lineTo(-0.285,0.44);s.lineTo(-0.285,0);}
  s.lineTo(-1.3,0);s.closePath();return s;
}
function buildTop(type){   // 带槽上板；group 原点=槽口中心
  const g=new THREE.Group();
  const geo=new THREE.ExtrudeGeometry(grooveOutline(type==='dove'),{depth:2.6,bevelEnabled:false});
  geo.rotateY(Math.PI/2);geo.translate(-1.3,0,0);
  g.add(new THREE.Mesh(geo,woodM));
  const cap=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.03,1.4),woodEndM);
  cap.position.y=0.535;g.add(cap);
  return g;
}
function buildScarf(){     // 斜搭接：侧影轮廓挤出（45° 斜面重合）
  const gL=new THREE.Group(),gR=new THREE.Group();
  const shL=new THREE.Shape(),shR=new THREE.Shape();
  shL.moveTo(-2.6,-0.8);shL.lineTo(0,-0.8);shL.lineTo(1.6,0.8);shL.lineTo(-2.6,0.8);shL.closePath();
  shR.moveTo(0,-0.8);shR.lineTo(4.6,-0.8);shR.lineTo(4.6,0.8);shR.lineTo(1.6,0.8);shR.closePath();
  const geoL=new THREE.ExtrudeGeometry(shL,{depth:1.4,bevelEnabled:false});geoL.translate(0,0,-0.7);
  const geoR=new THREE.ExtrudeGeometry(shR,{depth:1.4,bevelEnabled:false});geoR.translate(0,0,-0.7);
  gL.add(new THREE.Mesh(geoL,woodM));gR.add(new THREE.Mesh(geoR,woodM));
  return {gL,gR};
}

/* ---- 场景组装 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(18,0.3,9),groundM);
ground.position.set(0.6,-1.2,0);scene.add(ground);
const root=new THREE.Group();root.position.y=-0.2;scene.add(root);
let bottom=null,topB=null,scarf=null;
function buildJoint(type){
  if(bottom){root.remove(bottom);bottom=null;}
  if(topB){root.remove(topB);topB=null;}
  if(scarf){root.remove(scarf.gL);root.remove(scarf.gR);scarf=null;}
  if(type==='scarf'){scarf=buildScarf();root.add(scarf.gL,scarf.gR);}
  else{bottom=buildBottom(type);topB=buildTop(type);root.add(bottom,topB);}
}
/* 箭头（可伸缩） */
function makeArrow(mat){
  const g=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,1,10),mat);g.add(shaft);
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.32,12),mat);head.position.y=0.6;g.add(head);
  g.visible=false;scene.add(g);return g;
}
const arrUp=makeArrow(arrM),arrX=makeArrow(arrM);
const nArrA=makeArrow(normM),nArrB=makeArrow(normM);
function setArrow(g,from,to){
  const d=to.clone().sub(from),len=d.length();
  if(len<0.12){g.visible=false;return;}
  g.visible=true;g.position.copy(from);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  g.scale.set(1,len,1);
}

/* ---- 状态 ----
   载荷模型（代表性量级，注释说明）：直榫抬拉只有摩擦+胶 ≈60N 即拔出；
   燕尾抬拉为几何自锁（600N 内锁死，木料剪切极限在 kN 量级）；
   斜搭接轴向被斜面挡住，但斜面尖端剪面积小，≈150N 剪坏——所以实际必须加胶/销。 */
let playing=true,labelsOn=true,simT=0;
let joint='dove';let insertion=0,phase='insert';
let force=0,pullDir=0;      // 0=抬拉(锁向) 1=平推(装配向)
let humidity=12,slideOff=0,autoTest=0,userForce=false;
const F_HOLD={butt:60,scarf:150};
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;

function resetJoint(p){
  buildJoint(joint);
  insertion=0;slideOff=0;force=0;autoTest=0;
  document.getElementById('sForce').value=0;
  document.getElementById('sForceVal').textContent='0 N';
  phase='insert';if(p==='seated'){insertion=1;phase='seated';}
}
function setForce(f,run){
  force=f;document.getElementById('sForce').value=f;
  document.getElementById('sForceVal').textContent=f.toFixed(0)+' N';
  if(insertion>0.98)phase='pull';
  if(run!==undefined){playing=run;}
  syncPlayBtn();
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'木头不能焊不能铸：抗拉抗剪只能靠几何互锁，胶只起密封与辅助',en:'No welding or casting for wood: interlock is geometric, glue assists only'},
 {zh:'榫舌滑入燕尾槽：装配方向(x)自由滑动，抗剪靠接触面',en:'Tongue slides into the socket: free along x, shear carried by the faces'},
 {zh:'燕尾楔紧：抬拉力沿梯形斜面分解为正压力 N=F/(2cos21°)，越拉咬得越紧',en:'Wedge lock: lift resolves into flank normals N=F/(2cos21°) — pull tightens it'},
 {zh:'反向即自由：燕尾只锁抬拉方向，沿槽平推就能滑开',en:'One-way lock: lift is seized, a push along the groove slides free'},
 {zh:'直榫对照：截面无倒钩，只有摩擦与胶 ≈60N 即拔出',en:'Rect tenon contrast: no undercut — friction and glue slip at ≈60N'},
 {zh:'伸缩缝：木材横纹湿胀干缩（弦向≈0.3%/1%MC），榫卯必须留余量',en:'Movement gap: cross-grain swing ≈0.3%/1%MC demands clearance'},
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  if(i===0){resetJoint('seated');setForce(0,false);}
  else if(i===1){resetJoint('insert');playing=true;}
  else if(i===2){setJoint('dove');resetJoint('seated');pullDir=0;document.getElementById('sDir').value=0;document.getElementById('sDirVal').textContent=L('抬拉','lift');setForce(260,true);}
  else if(i===3){setJoint('dove');resetJoint('seated');pullDir=1;document.getElementById('sDir').value=1;document.getElementById('sDirVal').textContent=L('平推','slide');setForce(90,true);}
  else if(i===4){setJoint('butt');resetJoint('seated');pullDir=0;document.getElementById('sDir').value=0;document.getElementById('sDirVal').textContent=L('抬拉','lift');setForce(140,true);}
  else {resetJoint('seated');humidity=6;document.getElementById('sHum').value=6;document.getElementById('sHumVal').textContent='6%';setForce(0,false);}
  syncSteps();syncPlayBtn();
}

/* ---- 读数 ---- */
const THETA=21*Math.PI/180;   // 燕尾斜面半角（0.16/0.42）
function stateText(){
  if(insertion<0.98)return L('插合中…','inserting…');
  if(joint==='dove'){
    if(pullDir===1)return force>10?L('滑动方向：自由滑开','slide dir: free'):L('静置','seated');
    return force>15?L('自锁：越拉越紧','self-locked (wedges)'):L('静置','seated');
  }
  const hold=joint==='butt'?F_HOLD.butt:F_HOLD.scarf;
  if(slideOff>0.3)return L('已失效','failed');
  if(force>hold)return L('滑移/剪坏中…','slipping/shearing…');
  return L('静置','seated');
}
function updateStats(){
  const elF=document.getElementById('stF');
  elF.innerHTML=force.toFixed(0)+'<small> N</small>';
  const failing=(joint==='dove')?(pullDir===1&&force>10):(force>F_HOLD[joint]&&insertion>0.98);
  elF.className='v'+(failing?' warn':'');
  const st=document.getElementById('stState');st.textContent=stateText();
  st.className='v'+((stateText().indexOf('锁')>=0||stateText().indexOf('wedge')>=0)?' ok':(stateText().indexOf('脱')>=0||stateText().indexOf('slip')>=0||stateText().indexOf('shear')>=0?' warn':''));
  const n=(joint==='dove'&&pullDir===0)?force/(2*Math.cos(THETA)):0;
  document.getElementById('stN').innerHTML=n.toFixed(0)+'<small> N</small>';
  const w=140*(1+0.003*(humidity-12));
  document.getElementById('stW').innerHTML=w.toFixed(1)+'<small> mm</small>';
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('燕尾榫舌（下宽上窄）','Dovetail tongue'),new THREE.Vector3(0.8,-0.85,0),'o',()=>joint!=='scarf');
addLabel(()=>L('燕尾槽：口窄肚宽','Socket: narrow mouth'),new THREE.Vector3(1.8,1.15,0),'b',()=>joint!=='scarf');
addLabel(()=>L('斜面正压力 N —— 越拉越大','Flank normal N grows with pull'),new THREE.Vector3(-0.6,1.7,0),'g',
  ()=>joint==='dove'&&pullDir===0&&force>40&&insertion>0.95);
addLabel(()=>L('窄口卡住宽根：抬拉被锁死','Narrow mouth traps the wide root'),new THREE.Vector3(3.6,0.4,0),'r',
  ()=>joint==='dove'&&pullDir===0&&force>80&&insertion>0.95);
addLabel(()=>L('滑动方向自由（装配向）','Slide direction free (assembly)'),new THREE.Vector3(0,-1.5,0),'b',
  ()=>joint==='dove'&&pullDir===1&&force>10);
addLabel(()=>L('干缩让出伸缩缝','Shrinkage opens the movement gap'),new THREE.Vector3(1.8,-1.0,0),'g',
  ()=>humidity<=9&&insertion>0.95&&joint!=='scarf');

/* ---- 事件 ---- */
function setJoint(t){
  joint=t;
  document.getElementById('jDove').classList.toggle('on',t==='dove');
  document.getElementById('jButt').classList.toggle('on',t==='butt');
  document.getElementById('jScarf').classList.toggle('on',t==='scarf');
}
document.getElementById('jDove').addEventListener('click',()=>{setJoint('dove');resetJoint('insert');playing=true;syncPlayBtn();});
document.getElementById('jButt').addEventListener('click',()=>{setJoint('butt');resetJoint('insert');playing=true;syncPlayBtn();});
document.getElementById('jScarf').addEventListener('click',()=>{setJoint('scarf');resetJoint('insert');playing=true;syncPlayBtn();});
document.getElementById('btnTest').addEventListener('click',()=>{if(insertion<1){resetJoint('seated');}autoTest=1;phase='pull';playing=true;syncPlayBtn();});
document.getElementById('btnReset').addEventListener('click',()=>{resetJoint('insert');playing=true;syncPlayBtn();});
document.getElementById('sForce').addEventListener('input',e=>{autoTest=0;userForce=true;setForce(+e.target.value);});
document.getElementById('sDir').addEventListener('input',e=>{
  pullDir=+e.target.value;slideOff=0;
  document.getElementById('sDirVal').textContent=pullDir===0?L('抬拉','lift'):L('平推','slide');
});
document.getElementById('sHum').addEventListener('input',e=>{
  humidity=+e.target.value;document.getElementById('sHumVal').textContent=humidity+'%';
});
document.getElementById('tglCut').addEventListener('change',e=>{cutPlane.constant=e.target.checked?1.8:1e6;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('sDirVal').textContent=pullDir===0?L('抬拉','lift'):L('平推','slide');
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0,seatedT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    if(phase==='insert'){
      insertion=Math.min(1,insertion+dt*0.30);
      if(insertion>=1){phase='seated';seatedT=0;}
    }else if(phase==='seated'){
      if(autoTest===0&&!userForce){seatedT+=dt;if(seatedT>1.2){autoTest=1;phase='pull';}}  // 自动触发首次拉力演示
    }else if(phase==='pull'){
      if(autoTest>0){
        force=Math.min(600,force+dt*70);
        document.getElementById('sForce').value=force;
        document.getElementById('sForceVal').textContent=force.toFixed(0)+' N';
      }
      const act=force;
      if(joint==='dove'){
        if(pullDir===1)slideOff+=force*0.0016*dt;   // 平推=装配向：自由滑动
        /* 抬拉=锁紧向：几何自锁，无滑移 */
      }else{
        const hold=F_HOLD[joint];
        if(act>hold&&insertion>0.98)slideOff+=(act-hold)*0.006*dt;
      }
    }
  }
  /* 位置更新 */
  const gap=(humidity<12&&insertion>0.95)?(12-humidity)*0.007:0;   // 干缩缝
  if(joint==='scarf'&&scarf){
    scarf.gL.position.set(-slideOff*0.5,0,0);
    scarf.gR.position.set((1-insertion)*2.6+slideOff*0.5,0,0);
  }else if(bottom){
    // 燕尾抬拉：几何锁死，只显弹性微抬；直榫/斜接：超过承载即滑移抬起
    const liftY=(joint==='dove'&&pullDir===0)?0.02*Math.min(force/300,1):slideOff*0.8;
    topB.position.set((1-insertion)*2.8+(pullDir===1?slideOff:0),liftY+gap,0);
  }
  /* 箭头 */
  arrUp.visible=arrX.visible=false;
  if(force>10&&insertion>0.5&&joint!=='scarf'){
    if(pullDir===0){
      const x0=topB.position.x;
      setArrow(arrUp,new THREE.Vector3(x0-0.9,1.5,0),new THREE.Vector3(x0-0.9,1.5+1.1*Math.min(force/300,1),0));
      setArrow(arrX,new THREE.Vector3(x0+0.9,1.5,0),new THREE.Vector3(x0+0.9,1.5-1.1*Math.min(force/300,1),0));
    }else{
      const x0=topB.position.x;
      setArrow(arrUp,new THREE.Vector3(x0-0.9,1.0,0),new THREE.Vector3(x0-1.2-force*0.002,1.0,0));
    }
  }
  if(joint==='scarf'&&scarf&&force>10){
    setArrow(arrUp,new THREE.Vector3(scarf.gL.position.x-2.3,0,0),new THREE.Vector3(scarf.gL.position.x-2.3-1.1*Math.min(force/300,1),0,0));
    setArrow(arrX,new THREE.Vector3(scarf.gR.position.x+4.3,0,0),new THREE.Vector3(scarf.gR.position.x+4.3+1.1*Math.min(force/300,1),0,0));
  }
  /* 燕尾斜面法向力箭头 */
  const nOn=joint==='dove'&&pullDir===0&&force>15&&insertion>0.95;
  if(nOn){
    const k=Math.min(force/400,1)*0.9;
    const cx=topB.position.x,y0=topB.position.y+0.30;
    setArrow(nArrA,new THREE.Vector3(cx,y0,0.36),new THREE.Vector3(cx,y0-0.35*k,0.36+0.95*k));
    setArrow(nArrB,new THREE.Vector3(cx,y0,-0.36),new THREE.Vector3(cx,y0-0.35*k,-0.36-0.95*k));
  }else{nArrA.visible=nArrB.visible=false;}
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化：自动插合并加力，招牌画面 8 秒内出现 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setJoint('dove');resetJoint('insert');
if(!playing){insertion=1;phase='seated';}
updateStats();syncPlayBtn();start();
</script>
</body>
</html>
