<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恒温器与居里点开关 · 不用芯片的温度控制</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffb454;
    --bg:#10151c; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a06a12;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,180,84,.9); color: #ffe0ae; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(160,106,18,.9); color: #8a5c0d; }
  .pop { display: inline-block; opacity: 0; }
  .pop.on { animation: pop .8s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(.3); opacity: 0; }
    22% { transform: scale(1.9); opacity: 1; }
    45% { transform: scale(1.15); }
    75% { opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.bad { color: var(--hot); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,180,84,.6); background: rgba(255,180,84,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(160,106,18,.55); background: rgba(160,106,18,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row.off { display: none; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,180,84,.10); border-color: rgba(255,180,84,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(160,106,18,.08); border-color: rgba(160,106,18,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="恒温器与居里点开关:不用芯片控温" data-en="Thermostat & Curie switch: control without a chip">恒温器与居里点开关:不用芯片控温</h1>
  <div class="sub" data-zh="双金属片受热弯曲,到设定点「咔」弹开断电,冷却回弯复通——回差区间让它不频繁打火;电饭锅的感温磁钢在水烧干、锅底冲上居里点 103 °C 时失磁跳闸 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Two metals bend until the contacts snap open at the setpoint, then re-close on cooling — the hysteresis band stops chatter; in a rice cooker the sensor magnet lets go when the dry pot races past the 103 °C Curie point · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">双金属片受热弯曲,到设定点「咔」弹开断电,冷却回弯复通——回差区间让它不频繁打火;电饭锅的感温磁钢在水烧干、锅底冲上居里点 103 °C 时失磁跳闸 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="温度" data-en="temperature">温度</span><span class="v hot" id="stT">—</span>
  <span class="k" data-zh="触点" data-en="contacts">触点</span><span class="v ok" id="stC">—</span>
  <span class="k" id="kX" data-zh="弯曲偏转" data-en="deflection">弯曲偏转</span><span class="v" id="stX">—</span>
  <span class="k" id="kP" data-zh="开关周期" data-en="cycle period">开关周期</span><span class="v" id="stP">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn on" id="btnBI" data-zh="双金属片" data-en="bimetal">双金属片</button>
    <button class="abtn" id="btnCurie" data-zh="居里磁钢" data-en="Curie magnet">居里磁钢</button>
    <button class="abtn" id="btnPress" data-zh="按下煮饭" data-en="press cook">按下煮饭</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row" id="rowSet"><label data-zh="设定温度" data-en="Setpoint">设定温度</label><input id="set" type="range" min="60" max="110" step="1" value="75"><span class="val" id="setVal">75 °C</span></div>
  <div class="row" id="rowHyst"><label data-zh="回差区间" data-en="Hysteresis">回差区间</label><input id="hyst" type="range" min="1" max="15" step="1" value="7"><span class="val" id="hystVal">7 °C</span></div>
  <div class="row"><label data-zh="加热功率" data-en="Heater power">加热功率</label><input id="power" type="range" min="0.4" max="2" step="0.1" value="1"><span class="val" id="powerVal">1.0×</span></div>
  <div class="row"><label data-zh="进度" data-en="Progress">进度</label><input id="prog" type="range" min="0" max="600" step="1" value="0"><span class="val" id="progVal">0 s</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="温度曲线" data-en="Chart">温度曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../centrifugal-governor/" data-zh="反馈家族:离心调速器" data-en="feedback family: Watt governor">反馈家族:离心调速器</a>
    <a href="../phase-transition/" data-zh="水沸 100 °C:相变钉温" data-en="boiling 100 °C: pinned by phase change">水沸 100 °C:相变钉温</a>
    <a href="../heat-pump/" data-zh="热是搬运的:热泵" data-en="heat is moved, not made: heat pump">热是搬运的:热泵</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10151c);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.board.color.set(THEME === 'light' ? 0xe3e9f1 : 0x151c26);
  M.water.color.set(THEME === 'light' ? 0xcfc0a0 : 0xd9c9a4);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('恒温器与居里点开关', 'Thermostat & Curie-point switch');
  snapWord = L('咔!', 'Click!');
  for (const r of labelReg) {
    if (r.span) r.span.textContent = snapWord;
    else r.o.element.textContent = r.text();
  }
  refreshLabels();
  buildSteps();
  setStatKeys();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 2.7, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.3, 1.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  board: mat(0x151c26, { roughness: 0.95, emissive: 0x000000 }),
  brass: mat(0xd5a34c, { metalness: 0.75, roughness: 0.3 }),
  invar: mat(0x9fb0c3, { metalness: 0.7, roughness: 0.35 }),
  steel: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  ceramic: mat(0xe8e2d6, { roughness: 0.6, metalness: 0.05 }),
  heater: mat(0xb04a30, { emissive: 0xff5a2a, emissiveIntensity: 0.1 }),
  ferrite: mat(0x4a5560, { roughness: 0.5 }),
  mag: mat(0xc0392b, { roughness: 0.4 }),
  water: mat(0xd9c9a4, { roughness: 0.25, metalness: 0.05 }),
  pot: mat(0x8a93a0, { metalness: 0.6, roughness: 0.35 }),
};

/* ================= 布局:左=双金属片恒温器,右=电饭锅,后=温度记录板 ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 5.4), M.floor);
floor.position.y = -0.1;
scene.add(floor);

/* ---------------- 温度记录板(滚动曲线,真实采样) ---------------- */
const Y_FOR = T => 1.78 + (clamp(T, 20, 130) - 20) / 110 * 1.62;   // 20..130 °C
const CX0 = -2.1, CW = 4.2, CZ = -2.35;
const board = new THREE.Mesh(new THREE.BoxGeometry(CW + 0.55, 2.05, 0.06), M.board);
board.position.set(0, 2.62, CZ - 0.05);
scene.add(board);
const NSAMP = 200;
const chartArr = new Float32Array(NSAMP * 3);
const chartGeo = new THREE.BufferGeometry();
chartGeo.setAttribute('position', new THREE.BufferAttribute(chartArr, 3));
const chartLine = new THREE.Line(chartGeo, new THREE.LineBasicMaterial({ color: 0xffb454 }));
chartLine.frustumCulled = false;
scene.add(chartLine);
function thresholdLine(color, dash) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const m = dash ? new THREE.LineDashedMaterial({ color, dashSize: 0.07, gapSize: 0.05 })
                 : new THREE.LineBasicMaterial({ color });
  const ln = new THREE.Line(g, m);
  ln.frustumCulled = false;
  scene.add(ln);
  return ln;
}
const lnSet = thresholdLine(0x7bd88f, true);
const lnHyst = thresholdLine(0x74c0fc, true);
const lnCurie = thresholdLine(0xff7a5c, true);
const lnBoil = thresholdLine(0x74c0fc, true);
function setLine(ln, y) {
  const p = ln.geometry.attributes.position;
  p.setXYZ(0, CX0, y, CZ); p.setXYZ(1, CX0 + CW, y, CZ);
  p.needsUpdate = true;
  if (ln.material.isLineDashedMaterial) ln.computeLineDistances();
}
function updateChartLines() {
  setLine(lnSet, Y_FOR(set));
  setLine(lnHyst, Y_FOR(set - hyst));
  setLine(lnCurie, Y_FOR(103));
  setLine(lnBoil, Y_FOR(100));
}

/* ---------------- 标签 ---------------- */
const labelReg = [];
let labelsOn = true;
function addLabel(textFn, pos, cls = '', vis = () => true, target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelReg.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return o;
}
function refreshLabels() {
  for (const r of labelReg) r.o.element.style.display = labelsOn && r.vis() ? '' : 'none';
}

function updateParticles(dt) {
  for (let i = 0; i < 60; i++) {
    const s = steamP[i];
    if (s.life > 0) {
      s.life -= dt * 0.6;
      s.p.addScaledVector(s.v, dt);
      s.p.x += Math.sin(s.life * 9 + s.s) * 0.15 * dt;
      dummy.position.copy(s.p);
      const sc = 0.7 + 0.6 * Math.sin(Math.PI * clamp(s.life, 0, 1));
      dummy.scale.setScalar(Math.max(s.life > 0 ? sc : 0, 0.001));
    } else dummy.scale.setScalar(0.0001);
    dummy.updateMatrix();
    steam.setMatrixAt(i, dummy.matrix);
  }
  steam.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < 40; i++) {
    const s = sparkP[i];
    if (s.life > 0) {
      s.life -= dt * 2.4;
      s.v.y -= 4 * dt;
      s.p.addScaledVector(s.v, dt);
      dummy.position.copy(s.p);
      dummy.scale.setScalar(Math.max(s.life, 0.001));
      dummy.rotation.set(s.life * 9, s.life * 7, 0);
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.0001); }
    dummy.updateMatrix();
    spark.setMatrixAt(i, dummy.matrix);
  }
  spark.instanceMatrix.needsUpdate = true;
}

const T_ENV = 24, SAMPLE_DT = 0.25, WATER0 = 55, T_CURIE = 103;
const DA = 17.8e-6, H_TH = 0.0015, EXAG = 1;          // κ = 3Δα·ΔT/2h;实物条 62 mm×1.5 mm,δ_real ≈ κ·L²/2
const L_REAL = 0.062;
const HEAT_B = 8.0, LOSS_B = 0.12, HEAT_C = 10.0, LOSS_C = 0.05, EVAP = 4.2;
let MODE = qs.get('mode') === 'curie' ? 'curie' : 'bi';
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let set = clamp(qsFloat('set', 75), 60, 110);
let hyst = clamp(qsFloat('hyst', 7), 1, 15);
let power = clamp(qsFloat('power', 1), 0.4, 2);
let T = T_ENV, water = WATER0, contacts = true, latched = false, tripped = false;
let tSim = 0, snaps = 0, period = null, lastOpenT = null, sampleAcc = 0;
let chartN = 0, bendVis = 0, snapK = 0, leverA = 0.42, leverV = 0, boilGlow = 0;
const chart = [];

function onOpen() {
  if (lastOpenT !== null) period = tSim - lastOpenT;
  lastOpenT = tSim;
  snaps++;
  fireSnap(snapBI);
  burst(new THREE.Vector3(biGrp.position.x + 0.27, 1.33, 0.06), 10);
}
function onTrip() {
  tripped = true;
  leverV = 7;
  fireSnap(snapCU);
  burst(new THREE.Vector3(cuGrp.position.x + 0.42, 0.32, 0.12), 14);
}
function resetState() {
  tSim = 0; T = T_ENV; snaps = 0; period = null; lastOpenT = null;
  sampleAcc = 0; chartN = 0; chart.length = 0; tripped = false;
  if (MODE === 'curie') { water = WATER0; latched = true; leverA = 0; leverV = 0; }
  else { contacts = true; snapK = 0; }
}
function physStep(h) {
  if (MODE === 'bi') {
    T += ((contacts ? HEAT_B * power : 0) - LOSS_B * (T - T_ENV)) * h;
    if (contacts && T >= set) { contacts = false; onOpen(); }
    else if (!contacts && T <= set - hyst) { contacts = true; }
  } else {
    if (latched) {
      if (water > 0 && T >= 99.7) {          // 沸腾:相变吸热,温度钉在 100 °C
        T = 100;
        water = Math.max(0, water - EVAP * power * h);
      } else {
        T += (HEAT_C * power - LOSS_C * (T - T_ENV)) * h;
      }
      if (T >= T_CURIE) { latched = false; onTrip(); }
    } else {
      T += (0 - LOSS_C * (T - T_ENV)) * h;
    }
  }
}
function pushSample() { chart.push(T); if (chart.length > NSAMP) chart.shift(); chartN = chart.length; }
function fastForward(sec, stopFn) {
  const limit = tSim + sec;
  let guard = 0;
  while (tSim < limit && guard++ < 6000 && !(stopFn && stopFn())) {
    physStep(0.2); tSim += 0.2; sampleAcc += 0.2;
    if (sampleAcc >= SAMPLE_DT) { sampleAcc -= SAMPLE_DT; pushSample(); }
  }
}
function instantSim(sec) {
  resetState();
  fastForward(clamp(sec, 0, 600) - tSim, null);
  snapVisualsToState();
}
function snapVisualsToState() {
  leverA = latched ? 0 : 0.42; leverV = 0;
  snapK = MODE === 'bi' && !contacts ? 1 : 0;
  boilGlow = MODE === 'curie' && latched && water > 0 && T >= 99.7 ? 1 : 0;
  updateChartLineGeo();
}

  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd'), elSpdVal = document.getElementById('spdVal');
const elSet = document.getElementById('set'), elSetVal = document.getElementById('setVal');
const elHyst = document.getElementById('hyst'), elHystVal = document.getElementById('hystVal');
const elPow = document.getElementById('power'), elPowVal = document.getElementById('powerVal');
const elProg = document.getElementById('prog'), elProgVal = document.getElementById('progVal');
const tglLabels = document.getElementById('tglLabels'), tglChart = document.getElementById('tglChart'), tglRotate = document.getElementById('tglRotate');
const stT = document.getElementById('stT'), stC = document.getElementById('stC'),
  stX = document.getElementById('stX'), stP = document.getElementById('stP');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setStatKeys() {
  document.getElementById('kX').textContent = MODE === 'bi' ? L('弯曲偏转', 'deflection') : L('水量', 'water');
  document.getElementById('kP').textContent = MODE === 'bi' ? L('开关周期', 'cycle period') : L('距跳闸', 'to trip');
}
function deflMM() {   // 实物条(62 mm)的真实挠度
  return 3 * DA * Math.max(0, T - T_ENV) / (2 * H_TH) * L_REAL * L_REAL / 2 * 1000;
}
function updateFormula() {
  if (MODE === 'bi') {
    const dT = Math.max(0, T - T_ENV), k = 3 * DA * dT / (2 * H_TH), dm = deflMM();
    formulaEl.innerHTML = L(
      `<b>ΔL = α·L₀·ΔT</b>　κ = 3Δα·ΔT / 2h = ${k.toFixed(3)} m⁻¹　δ = κL²/2 ≈ ${dm.toFixed(2)} mm(62 mm 条,实物值;画面按比例放大)<br>` +
      `触点断开 <b>${set} °C</b> · 复位 <b>${set - hyst} °C</b>(回差 ${hyst} °C)——类似施密特触发`,
      `<b>ΔL = α·L₀·ΔT</b>, κ = 3Δα·ΔT/2h = ${k.toFixed(3)} m⁻¹, δ = κL²/2 ≈ ${dm.toFixed(2)} mm (62 mm strip, real scale; scene exaggerated)<br>` +
      `opens <b>${set} °C</b> · resets <b>${set - hyst} °C</b> (band ${hyst} °C) — a Schmitt trigger in brass`);
  } else {
    const dTrip = Math.max(0, T_CURIE - T);
    formulaEl.innerHTML = L(
      `水沸吸热:温度钉在 <b>100 °C</b>,直到水干(相变是天然恒温器)<br>` +
      `T ≥ <b>103 °C</b>(感温磁钢居里点):铁磁 → 顺磁,吸力消失,弹簧跳闸;重新吸合需 T &lt; 90 °C · 距跳闸 ${dTrip.toFixed(1)} K`,
      `Boiling pins the pot at <b>100 °C</b> until dry (phase change = a natural thermostat)<br>` +
      `T ≥ <b>103 °C</b> (Curie point): ferro → paramagnetic, hold force gone, spring trips; re-latch needs T &lt; 90 °C · ${dTrip.toFixed(1)} K to trip`);
  }
}
function setMode(m, animate = true) {
  MODE = m;
  biGrp.visible = m === 'bi';
  cuGrp.visible = m === 'curie';
  document.getElementById('btnBI').classList.toggle('on', m === 'bi');
  document.getElementById('btnCurie').classList.toggle('on', m === 'curie');
  document.getElementById('rowSet').classList.toggle('off', m !== 'bi');
  document.getElementById('rowHyst').classList.toggle('off', m !== 'bi');
  lnSet.visible = lnHyst.visible = m === 'bi';
  lnCurie.visible = lnBoil.visible = m === 'bi';
  chartLine.visible = tglChart.checked;
  board.visible = tglChart.checked;
  setStatKeys();
  updateFormula();
  updateChartLines();
  const p1 = m === 'bi' ? new THREE.Vector3(-1.2, 2.4, 5.6) : new THREE.Vector3(2.5, 2.3, 5.4);
  const t1 = m === 'bi' ? new THREE.Vector3(-1.6, 1.05, 0) : new THREE.Vector3(1.85, 0.95, 0);
  if (animate) { camP0.copy(camera.position); camT0.copy(controls.target); camP1.copy(p1); camT1.copy(t1); camK = 0; }
  else { camera.position.copy(p1); controls.target.copy(t1); }
}
const camP0 = new THREE.Vector3(), camT0 = new THREE.Vector3(), camP1 = new THREE.Vector3(), camT1 = new THREE.Vector3();
let camK = 1;

elSet.value = set; elSetVal.textContent = set + ' °C';
elHyst.value = hyst; elHystVal.textContent = hyst + ' °C';
elPow.value = power; elPowVal.textContent = power.toFixed(1) + '×';
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
elSet.addEventListener('input', () => { set = +elSet.value; elSetVal.textContent = set + ' °C'; updateChartLines(); });
elHyst.addEventListener('input', () => { hyst = +elHyst.value; elHystVal.textContent = hyst + ' °C'; updateChartLines(); });
elPow.addEventListener('input', () => { power = +elPow.value; elPowVal.textContent = power.toFixed(1) + '×'; });
elSpd.addEventListener('input', () => { speed = +elSpd.value; elSpdVal.textContent = speed.toFixed(1) + '×'; });
let scrubbing = false;
elProg.addEventListener('pointerdown', () => scrubbing = true);
addEventListener('pointerup', () => scrubbing = false);
elProg.addEventListener('input', () => { instantSim(+elProg.value); elProgVal.textContent = elProg.value + ' s'; });
document.getElementById('btnBI').addEventListener('click', () => { setMode('bi'); instantSim(0); });
document.getElementById('btnCurie').addEventListener('click', () => { setMode('curie'); instantSim(0); });
document.getElementById('btnReset').addEventListener('click', () => { resetState(); snapVisualsToState(); });
document.getElementById('btnPress').addEventListener('click', () => {
  if (MODE !== 'curie') setMode('curie');
  if (latched) return;
  if (T >= T_CURIE) { fireSnap(snapCU); return; }        // 仍高于居里点:吸不住
  if (T > 90) { fireSnap(snapCU); return; }
  latched = true; tripped = false; leverV = -4;
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglChart.addEventListener('change', () => {
  const on = tglChart.checked;
  chartLine.visible = on; board.visible = on;
  for (const o of [lblChartT, lblAxLo, lblAxHi]) o.visible = on;
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; refreshLabels(); }
if (!qsBool('chart', true)) { tglChart.checked = false; tglChart.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 图形更新 ---------------- */
function updateChartLineGeo() {
  for (let i = 0; i < chartN; i++) {
    chartArr[i * 3] = CX0 + i / (NSAMP - 1) * CW;
    chartArr[i * 3 + 1] = Y_FOR(chart[i]);
    chartArr[i * 3 + 2] = CZ;
  }
  chartGeo.setDrawRange(0, chartN);
  chartGeo.attributes.position.needsUpdate = true;
}
function updateVisuals(dt) {
  /* 双金属片弯曲(连续) + 快跳(在阈值瞬间完成) */
  const dT = Math.max(0, T - T_ENV);
  bendVis = MODE === 'bi' ? clamp(3 * DA * dT / (2 * H_TH) * STRIP_L * STRIP_L / 2 * EXAG, 0, 0.24) : bendVis;
  const snapTgt = MODE === 'bi' && !contacts ? 1 : 0;
  snapK += (snapTgt - snapK) * (1 - Math.exp(-dt * 14));
  /* 条端上翘量 bendVis → 弧段总转角 θ = 2δ/L,逐节分配 */
  const per = 2 * (bendVis + snapK * 0.05) / (STRIP_L * SEGN);
  for (const j of joints) j.rotation.z = per;                        // 黄铜在下,受热自由端上翘
  /* 快跳拨杆:设定温度越高,拨杆装得越高(校准螺钉),被条端顶过死点即翻转 */
  const armY = 1.40 + 0.0012 * (set - 60);
  armPiv.position.y = armY;
  armPiv.rotation.z = -0.3 + snapK * 0.55;
  const cy = armY - 0.133;
  cPost.scale.y = Math.max(cy - 0.15, 0.01);
  cPost.position.set(0.24, (cy + 0.15) / 2, 0);
  fixedContact.position.set(0.24, cy, 0);
  screw.position.set(0.24, 0.19, 0);
  screw.rotation.y = set * 0.35;
  heaterPlate.material.emissiveIntensity = contacts ? 0.55 + power * 0.35 : 0.06 + boilGlow * 0.2;
  for (const c of coils) c.material.emissiveIntensity = heaterPlate.material.emissiveIntensity;
  /* 电饭锅 */
  waterMesh.scale.y = Math.max(water / 100, 0.001) * 0.3;
  waterMesh.position.y = 0.28 + waterMesh.scale.y / 2;
  waterMesh.visible = water > 0.5;
  pot.material.emissive.setHex(0xff5a2a);
  pot.material.emissiveIntensity = MODE === 'curie' && latched ? clamp((T - 60) / 45, 0, 1) * 0.5 : 0.02;
  hotplate.material.emissiveIntensity = MODE === 'curie' && latched ? 0.5 + power * 0.4 : 0.08;
  leverA += leverV * dt;
  leverV += ((latched ? 0 : 0.42) - leverA) * 130 * dt;
  leverV *= Math.exp(-dt * 7);
  leverA = clamp(leverA, -0.05, 0.6);
  leverPiv.rotation.z = leverA;
  plunger.position.y = 0.5 + (latched ? 0.02 : 0);
  ferrite.position.y = 0.78 + (latched ? 0.02 : 0);
  const springStretch = latched ? 1.25 : 1;
  spring.scale.y = springStretch;
  spring.position.y = 0.62;
  leverSpring.scale.y = latched ? 0.24 : 0.3;
  leverSpring.position.set(0.1, (0.95 - leverA * 0.42 + 0.66) / 2, 0);
  arcMat.opacity = MODE === 'curie' && latched ? clamp((T_CURIE - T) / 15, 0, 1) * 0.55 : 0;
  lampCook.material.emissiveIntensity = latched && MODE === 'curie' ? 1.4 : 0.12;
  lampWarm.material.emissiveIntensity = tripped ? 1.2 : 0.08;
  lid.rotation.z = Math.sin(performance.now() / 180) * 0.012 * boilGlow;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    physStep(dts);
    tSim += dts;
    sampleAcc += dts;
    while (sampleAcc >= SAMPLE_DT) { sampleAcc -= SAMPLE_DT; pushSample(); }
    if (MODE === 'curie' && latched && water > 0 && T >= 99.7) {
      boilGlow = 1;
      if (Math.random() < dts * 22) spawnSteam();
    } else boilGlow = Math.max(0, boilGlow - dts * 2);
  }
  /* 相机过渡 */
  if (camK < 1) {
    camK = clamp(camK + dt / 0.9, 0, 1);
    const e = camK * camK * (3 - 2 * camK);
    camera.position.lerpVectors(camP0, camP1, e);
    controls.target.lerpVectors(camT0, camT1, e);
  }
  updateVisuals(dt);
  updateParticles(dt);
  updateChartLineGeo();
  /* 读数 */
  stT.textContent = T.toFixed(1) + ' °C';
  stC.textContent = MODE === 'bi' ? (contacts ? L('闭合', 'closed') : L('断开', 'open')) : (latched ? L('闭合', 'closed') : L('断开', 'open'));
  stC.className = 'v ' + ((MODE === 'bi' ? contacts : latched) ? 'ok' : 'bad');
  stX.textContent = MODE === 'bi' ? deflMM().toFixed(2) + ' mm' : water.toFixed(0) + ' %';
  stP.textContent = MODE === 'bi' ? (period !== null ? period.toFixed(1) + ' s' : '—')
                                  : Math.max(0, T_CURIE - T).toFixed(1) + ' K';
  formulaAcc += dt;
  if (formulaAcc > 0.25) { formulaAcc = 0; updateFormula(); }
  if (!scrubbing) { elProg.value = Math.min(tSim, 600); }
  elProgVal.textContent = Math.floor(tSim) + ' s';
  for (const r of labelReg) if (labelsOn && r.vis() && !r.span) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
setMode(MODE, false);
instantSim(clamp(qsFloat('t', 0), 0, 600));
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
</body>
