<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹子锁 · 剪切线</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e8b04b;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --ok:#7bd88f;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a2690f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --ok:#1d8a4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,180,84,.9); color: #ffe0ae; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(160,106,18,.9); color: #8a5c0d; }
  .pop { display: inline-block; opacity: 0; }
  .pop.on { animation: pop .8s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(.3); opacity: 0; }
    22% { transform: scale(1.9); opacity: 1; }
    45% { transform: scale(1.15); }
    75% { opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.ok { color: var(--ok); }
  #stats .v.bad { color: var(--hot); }
  #stats .v.acc { color: var(--acc); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,180,84,.6); background: rgba(255,180,84,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(160,106,18,.55); background: rgba(160,106,18,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,180,84,.10); border-color: rgba(255,180,84,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(160,106,18,.08); border-color: rgba(160,106,18,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="弹子锁:剪切线上的五道缝" data-en="Pin-tumbler lock: five gaps on one shear line">弹子锁:剪切线上的五道缝</h1>
  <div class="sub" data-zh="弹簧把上弹子压得骑在锁芯/锁体的分界线上,锁芯转不动;对的钥匙把每条缝隙精确顶回这条线——五缝对齐,锁芯才转 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Springs hold each driver pin straddling the plug/housing boundary so the core cannot turn; the right key lifts every gap exactly onto that line — all five align, the plug turns · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">弹簧把上弹子压得骑在锁芯/锁体的分界线上,锁芯转不动;对的钥匙把每条缝隙精确顶回这条线——五缝对齐,锁芯才转 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="已对齐弹子" data-en="gaps aligned">已对齐弹子</span><span class="v acc" id="stA">—</span>
  <span class="k" data-zh="剪切线" data-en="shear line">剪切线</span><span class="v bad" id="stS">—</span>
  <span class="k" data-zh="弹簧压缩" data-en="spring squeeze">弹簧压缩</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="可旋转" data-en="rotatable">可旋转</span><span class="v bad" id="stR">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnIn" data-zh="插对钥匙" data-en="right key">插对钥匙</button>
    <button class="abtn" id="btnWrong" data-zh="插错钥匙" data-en="wrong key">插错钥匙</button>
    <button class="abtn" id="btnOut" data-zh="拔出" data-en="remove key">拔出</button>
    <button class="abtn" id="btnTurn" data-zh="试转" data-en="try turn">试转</button>
    <button class="abtn" id="btnDemo" data-zh="开锁演示" data-en="auto demo">开锁演示</button>
  </div>
  <div class="row"><label data-zh="弹子数" data-en="Pin count">弹子数</label><input id="npin" type="range" min="3" max="6" step="1" value="5"><span class="val" id="npinVal">5</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
      <label><input id="tglSec" type="checkbox"> <span data-zh="异形弹子" data-en="security pins">异形弹子</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../ratchet-pawl/" data-zh="几何锁定:棘轮棘爪" data-en="geometry locking: ratchet &amp; pawl">几何锁定:棘轮棘爪</a>
    <a href="../escapement/" data-zh="精密小机械:擒纵机构" data-en="precision mechanics: escapement">精密小机械:擒纵机构</a>
    <a href="../rsa-crypto/" data-zh="另一种锁:RSA(数学的)" data-en="another lock: RSA (math)">另一种锁:RSA(数学的)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.slotDark.color.set(THEME === 'light' ? 0x3a4250 : 0x0c0f14);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('弹子锁 · 剪切线', 'Pin-tumbler lock · shear line');
  for (const r of labelReg) {
    if (r.span) r.span.textContent = r.text();
    else r.o.element.textContent = r.text();
  }
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.7, 2.1, 7.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.1, 0.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.75));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
keyLight.position.set(4, 8, 6);
scene.add(keyLight);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -4);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  house: mat(0x39424f, { roughness: 0.62, metalness: 0.55, side: THREE.DoubleSide }),
  plug: mat(0xb98a3e, { roughness: 0.38, metalness: 0.7, side: THREE.DoubleSide }),
  plugFace: mat(0xa87c37, { roughness: 0.45, metalness: 0.6 }),
  slotDark: mat(0x0c0f14, { roughness: 1, metalness: 0.1, emissive: 0x000000 }),
  brass: mat(0xd8b26a, { metalness: 0.75, roughness: 0.3 }),
  pinBad: mat(0xd8b26a, { metalness: 0.75, roughness: 0.3, emissive: 0xff2d20, emissiveIntensity: 0.55 }),
  steel: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  drvSteel: mat(0x9aa7b5, { metalness: 0.8, roughness: 0.3 }),
  keyBrass: mat(0xe6bd6a, { metalness: 0.85, roughness: 0.26, emissiveIntensity: 0.1 }),
  acc: new THREE.MeshBasicMaterial({ color: 0xffd166, toneMapped: false, transparent: true, opacity: 0.9 }),
};
const mkDim = new THREE.MeshBasicMaterial({ color: 0x55606e, toneMapped: false });
const mkAcc = new THREE.MeshBasicMaterial({ color: 0xffd166, toneMapped: false });
const mkRed = new THREE.MeshBasicMaterial({ color: 0xff5d5d, toneMapped: false });
const mkGreen = new THREE.MeshBasicMaterial({ color: 0x7bd88f, toneMapped: false });
const mkAmber = new THREE.MeshBasicMaterial({ color: 0xffb454, toneMapped: false });

/* ================= 布局:剖视弹子锁,轴线沿 X,弹子列在 12 点方向 ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(12, 0.2, 5), M.floor);
floor.position.y = -1.46;
scene.add(floor);
const skirt = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.34, 1.4), M.house);
skirt.position.set(-0.05, -1.2, 0);
scene.add(skirt);

/* ---- 锁体(静):背面半管壳 + 端面半环 + 剖切面(带锁芯孔) + 弹子孔窗 ---- */
const houseGrp = new THREE.Group();
scene.add(houseGrp);
{
  const sh = new THREE.Shape();
  sh.moveTo(-1.95, -1.06); sh.lineTo(1.95, -1.06); sh.lineTo(1.95, 1.06); sh.lineTo(-1.95, 1.06); sh.closePath();
  const hole = new THREE.Path();
  hole.moveTo(-1.51, -0.56); hole.lineTo(1.51, -0.56); hole.lineTo(1.51, 0.56); hole.lineTo(-1.51, 0.56); hole.closePath();
  sh.holes.push(hole);
  const face = new THREE.Mesh(new THREE.ShapeGeometry(sh, 4), M.house);
  face.position.z = 0.012;
  houseGrp.add(face);
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(1.06, 1.06, 3.9, 56, 1, true, Math.PI / 2, Math.PI), M.house);
  shell.rotation.z = Math.PI / 2;
  houseGrp.add(shell);
  const capR = new THREE.Mesh(new THREE.RingGeometry(0.57, 1.06, 48, 1, -Math.PI / 2, Math.PI), M.house);
  capR.rotation.y = Math.PI / 2; capR.position.x = 1.95;
  houseGrp.add(capR);
  const capL = new THREE.Mesh(new THREE.RingGeometry(0.57, 1.06, 48, 1, Math.PI / 2, Math.PI), M.house);
  capL.rotation.y = -Math.PI / 2; capL.position.x = -1.95;
  houseGrp.add(capL);
}
/* 剪切线辉光条(锁芯/锁体分界) */
const shearGlow = new THREE.Mesh(new THREE.BoxGeometry(3.08, 0.02, 0.02), M.acc);
shearGlow.position.set(0, 0.55, 0.03);
scene.add(shearGlow);

/* ---- 锁芯(转子):半管壳 + 半圆端盖 + 剖切面 + 钥匙槽/弹子孔暗槽 + 凸轮 ---- */
const rotor = new THREE.Group();
scene.add(rotor);
{
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 3.0, 48, 1, true, Math.PI / 2, Math.PI), M.plug);
  shell.rotation.z = Math.PI / 2;
  rotor.add(shell);
  const capR = new THREE.Mesh(new THREE.CircleGeometry(0.55, 40, -Math.PI / 2, Math.PI), M.plug);
  capR.rotation.y = Math.PI / 2; capR.position.x = 1.5;
  rotor.add(capR);
  const capL = new THREE.Mesh(new THREE.CircleGeometry(0.55, 40, Math.PI / 2, Math.PI), M.plug);

function springGeoMake() {
  const pts = [], N = 140, coils = 7.5, r = 0.052;
  for (let i = 0; i <= N; i++) {
    const t = i / N, a = t * coils * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * r, t, Math.sin(a) * r));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 200, 0.0105, 6, false);

function buildKey(kind) {
  if (keyGrp) { rotor.remove(keyGrp); keyGrp = null; }
  const s = new THREE.Shape();
  const shX = 0.42, yBot = -0.38;
  const half = Math.min(0.115, 0.95 / nPins - 0.055), ramp = Math.min(0.05, half * 0.45);
  s.moveTo(TIP_X, yBot);
  s.lineTo(TIP_X + 0.3, YB - 0.02);
  s.lineTo(TIP_X + 0.34, YB);
  for (const p of pins) {
    const dip = p.dip - (kind === 'wrong' && pins.indexOf(p) === wIdx ? 0.07 : 0);
    const fl = YB - dip;
    s.lineTo(p.x - half - ramp, YB);
    s.lineTo(p.x - half, fl);
    s.lineTo(p.x + half, fl);
    s.lineTo(p.x + half + ramp, YB);
  }
  s.lineTo(shX, YB);
  s.lineTo(shX, yBot);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.12, bevelEnabled: false });
  geo.translate(0, 0, -0.06);
  keyGrp = new THREE.Group();
  keyGrp.add(new THREE.Mesh(geo, M.keyBrass));

  neck.position.set(shX + 0.34, -0.01, 0);

function burst(worldPos, n) {
  let k = 0;
  for (const s of sparkP) {
    if (s.life > 0) continue;
    s.life = 1;
    s.p.copy(worldPos);
    s.v.set((Math.random() - 0.5) * 1.8, Math.random() * 1.6 + 0.4, (Math.random() - 0.5) * 1.4);
    if (++k >= n) break;
  }

function updateParticles(dt) {
  for (let i = 0; i < 26; i++) {
    const s = sparkP[i];
    if (s.life > 0) {
      s.life -= dt * 2.2;
      s.v.y -= 3.5 * dt;
      s.p.addScaledVector(s.v, dt);
      dummy.position.copy(s.p);
      dummy.scale.setScalar(Math.max(s.life, 0.001));
      dummy.rotation.set(s.life * 9, s.life * 7, 0);
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.0001); }
    dummy.updateMatrix();
    spark.setMatrixAt(i, dummy.matrix);
  }
  spark.instanceMatrix.needsUpdate = true;
}

let secPins = false;
let keyKind = null, keyX = KEY_OUT;
let rotorA = 0, rotorTarget = 0, openK = 0, openKTgt = 0, open = false;
let jamPin = -1, falsePin = -1, wIdx = 1;
let pickOn = false, wrenchOn = false, pickTip = 1.2, pickIdx = -1, pickK = 0, bindA = 0.05;
let tSim = 0;

function alignedCount() {
  if (keyKind && keyX < 0.3) {
    let c = 0;
    for (const p of pins) if (Math.abs(REST_B + p.lift + p.len - S) < 0.03) c++;
    return c;
  }
  let c = 0;
  for (const p of pins) if (p.set) c++;
  return c;
}
function allAligned() {
  return keyKind === 'right' && keyX < 0.3 &&
    pins.every(p => Math.abs(REST_B + p.lift + p.len - S) < 0.03);
}
function rotatable() {
  return open || allAligned() || pins.every(p => p.set);
}
function maxComp() {
  let m = 0;
  for (const p of pins) {
    const dTop = (p.set ? S : REST_B + p.lift + p.len) + DRV;
    m = Math.max(m, REST_B + p.len + DRV - dTop);
  }
  return m;
}
function statusText() {
  if (open) return L('已开:五缝都在线上,锁芯转过,锁舌退出', 'OPEN: all gaps on the line, plug turned, bolt withdrawn');
  if (pickOn || pickIdx >= 0) {

    return L(`单钩中:${c}/${nPins} 根已「设」`, `picking: ${c}/${nPins} pins set`);
  }
  if (keyKind === 'wrong') return L('错的钥匙:哪怕一根骑线,锁芯卡死', 'wrong key: one pin riding the line jams everything');
  if (keyKind === 'right') return allAligned() ? L('五缝对齐 → 试转!', 'all five gaps aligned → turn it!')
    : L('钥匙插入:齿峰逐排顶起弹子', 'inserting: peaks raise the stacks one by one');

}

/* ---------------- 剧本引擎 ---------------- */
let seq = [], seg = null, segT = 0;
function runScript(list) { seq = list.slice(); seg = null; nextSeg(); }
function nextSeg() { seg = seq.shift() || null; segT = 0; curName = seg ? seg.name : 'idle'; if (seg && seg.enter) seg.enter(); }
function seqTick(dt) {
  if (!seg) return;
  segT += dt;
  const k = Math.min(segT / seg.dur, 1);
  if (seg.tick) seg.tick(k, dt);
  if (k >= 1) { if (seg.exit) seg.exit(); nextSeg(); }
}
function segHold(dur) { return { name: 'hold', dur }; }
function keyInSeg(kind) {
  return { name: 'keyin', dur: 2.6,
    enter() { keyKind = kind; jamPin = -1; buildKey(kind); keyX = KEY_OUT; },
    tick(k) { keyX = KEY_OUT * (1 - ease(k)); } };
}
function turnSeg() {
  return { name: 'turn', dur: 2.0,
    tick(k) {
      rotorTarget = 1.66 * ease(clamp((k - 0.15) / 0.85, 0, 1));
      openKTgt = clamp((k - 0.35) / 0.5, 0, 1);
      if (k > 0.93 && !open) {
        open = true;
        fireSnap(snapOpen, L('开!', 'OPEN!'));
        burst(new THREE.Vector3(-2.1, 0, 0.2), 12);
      }
    } };
}
function jiggleSeg() {
  let jt = 0;
  return { name: 'jiggle', dur: 1.9,
    enter() {
      jt = 0;
      if (keyKind === 'wrong' && keyX < 0.3) {
        snapJam.o.position.set(pins[wIdx].x, 1.25, 0.2);
        fireSnap(snapJam, L('卡!', 'JAM!'));
      }
    },
    tick(k, dt) { jt += dt; rotorTarget = 0.02 + 0.05 * Math.sin(jt * 22) * Math.exp(-jt * 3.2); },
    exit() { rotorTarget = 0; } };
}
function keyOutSeg() {
  return { name: 'keyout', dur: 1.5,
    tick(k) {
      keyX = KEY_OUT * ease(k);
      if (open) {
        rotorTarget = 1.66 * (1 - Math.min(1, k / 0.5));
        openKTgt = 1 - Math.min(1, k / 0.5);
      }
    },
    exit() {
      keyKind = null;
      if (keyGrp) { rotor.remove(keyGrp); keyGrp = null; }
      if (open) {
        open = false; rotorTarget = 0; openKTgt = 0;
        for (const p of pins) p.set = false;
      }
    } };
}
function pickChain() {
  const list = [];
  let prev = 1.0;
  list.push({ name: 'pick', dur: 0.7,
    enter() { wrenchOn = true; pickOn = true; pickTip = 1.0; bindA = 0.05; },
    tick(k) { pickTip = 1.0 - 0.1 * k; } });
  for (const b of BIND_ORDER.filter(i => i < nPins)) {
    const x = pins[b].x + 0.1;
    list.push({ name: 'pick', dur: 0.5, tick(k) { pickTip = prev + (x - prev) * k; } });
    const sec = secPins && pins[b].sec;
    list.push({ name: 'pick', dur: sec ? 1.0 : 0.9, enter() { pickIdx = b; pickK = 0; }, tick(k) { pickK = k; } });
    if (sec) {
      list.push({ name: 'pick', dur: 0.4,
        enter() { falsePin = b; snapFalse.o.position.set(pins[b].x, 1.5, 0.2); fireSnap(snapFalse, L('假设…', 'false set…')); },
        tick() { pickK = 1; } });
      list.push({ name: 'pick', dur: 0.5, tick(k) { pickK = 1 - 0.95 * k; }, exit() { falsePin = -1; } });
      list.push({ name: 'pick', dur: 0.8, tick(k) { pickK = 0.05 + 0.95 * k; } });
    }
    list.push({ name: 'pick', dur: 0.05,
      enter() {
        pins[b].set = true; pickIdx = -1; pickK = 0; bindA += 0.02;
        snapPin.o.position.set(pins[b].x, 1.28, 0.2);
        fireSnap(snapPin, L('设!', 'SET!'));
        burst(new THREE.Vector3(pins[b].x, 0.55, 0.2), 8);
      } });
    list.push({ name: 'pick', dur: 0.3, tick(k) { pickTip = x + 0.25 * k; } });
    prev = x + 0.25;
  }
  list.push({ name: 'pick', dur: 0.5, exit() { pickOn = false; wrenchOn = false; pickTip = 1.2; } });
  list.push(turnSeg());
  return list;
}
function demoChain() {
  return [{ name: 'idle', dur: 1.1 }, keyInSeg('right'), segHold(0.9), turnSeg(), segHold(1.4),
    keyOutSeg(), keyInSeg('wrong'), jiggleSeg(), keyOutSeg(),
    ...pickChain(), segHold(2.5)];
}
function resetEmpty() {
  seq = []; seg = null; curName = 'idle';
  keyKind = null; keyX = KEY_OUT; jamPin = -1; falsePin = -1; pickIdx = -1; pickK = 0;
  pickOn = false; wrenchOn = false; pickTip = 1.2;
  open = false; rotorTarget = 0; rotorA = 0; openKTgt = 0; openK = 0; bindA = 0.05;
  if (keyGrp) { rotor.remove(keyGrp); keyGrp = null; }
  for (const p of pins) p.set = false;
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '无钥匙:上弹子骑线,锁芯卡死', be: 'No key: drivers straddle the line',
    d: '弹簧把每列弹子往下压:下弹子顶到孔底,上弹子恰好横跨锁芯与锁体的分界线(剪切线)。没有一条缝隙在线上,锁芯转不动。',
    de: 'Springs push every stack down: key pins hit bore bottom, drivers land across the plug/housing boundary (the shear line). No gap on the line, no rotation.',
    act: () => { resetEmpty(); playing = true; setPlayLabel(); } },
  { b: '插钥匙:齿峰逐排顶起弹子', be: 'Insert: teeth raise the stacks one by one',
    d: '钥匙齿槽深浅不一。滑入时,每个齿槽抵达对应弹子下方,把下弹子顶到由齿深决定的高度——弹子一排接一排升起。',
    de: 'Each cut has its own depth. As the key slides in, every cut arrives under its pin and lifts the key pin to that depth — stacks rise one after another.',
    act: () => { resetEmpty(); playing = true; runScript([keyInSeg('right'), segHold(1e9)]); setPlayLabel(); } },
  { b: '对的钥匙:五条缝隙全部落上剪切线', be: 'Right key: all five gaps land on the line',
    d: '齿形与弹子长度一一配对:每列下弹子顶恰好停在线上,缝隙(下/上弹子分界)全部对齐剪切线——不再有任何弹子骑线,锁芯终于能转,凸轮把锁舌拉开。',
    de: 'Cuts match pin lengths: every key-pin top stops exactly on the line, all pin gaps align with the shear line — nothing rides it, the plug turns and the cam throws the bolt.',
    act: () => { resetEmpty(); playing = true; runScript([keyInSeg('right'), segHold(0.7), turnSeg(), segHold(1e9)]); setPlayLabel(); } },
  { b: '错的钥匙:一根没对齐=全线卡死', be: 'Wrong key: one misaligned gap jams all',
    d: '只要一个齿深差一点,那一列弹子仍骑在线上——其余四列对齐也没用。转动只扭出一点点弹性间隙,立刻被顶回:锁是 AND 逻辑,一根否决全部。',
    de: 'One off-depth cut leaves its stack riding the line — the other four aligning means nothing. Torque just winds a hair and bounces back: the lock is AND logic, one veto blocks all.',
    act: () => { resetEmpty(); playing = true; runScript([keyInSeg('wrong'), jiggleSeg(), segHold(1e9)]); setPlayLabel(); } },
  { b: '单钩开锁:逐根弹子「设」上剪切线', be: 'Picking: set pins one by one',
    d: '张力扳手给锁芯一点转矩,弹子孔错位后被「卡住」的那根先受力。单钩把它提到线上:缝隙一到线,锁芯多转一丝,上弹子被台阶挡在线上(设),下弹子落回。逐根设满,锁就开了——同一套剪切线逻辑,被一根根骗过。',
    de: 'A wrench applies slight torque; the binding pin catches first. The pick lifts it until its gap reaches the line: the plug rotates a hair and traps the driver above (set), the key pin falls. Set all five and it opens — same shear-line logic, defeated stack by stack.',
    act: () => { resetEmpty(); playing = true; runScript(pickChain()); setPlayLabel(); } },
  { b: '安防:弹子数与异形弹子', be: 'Security: more pins & security pins',
    d: '弹子越多,猜测组合呈指数变难;葫芦形/蘑菇形「异形弹子」会在单钩上提时先给出「假设」——缝隙看似到线又弹回,必须再提一次,让逐根开锁变得又慢又吵。勾选「异形弹子」再看一次演示。',
    de: 'More pins mean exponentially more combinations; spool/mushroom security pins hand the pick a false set — the gap seems to reach the line then drops back, forcing a second lift, making picking slow and noisy. Tick "security pins" and watch again.',
    act: () => { secPins = true; document.getElementById('tglSec').checked = true; syncSec();
      resetEmpty(); playing = true; runScript(pickChain()); setPlayLabel(); } },
];
function stepIndex() {
  if (pickOn || pickIdx >= 0) return secPins ? 5 : 4;
  if (keyKind === 'wrong') return 3;
  if (open) return 2;
  if (keyKind === 'right') return allAligned() ? 2 : 1;
  if (keyKind) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd'), elSpdVal = document.getElementById('spdVal');
const elNpin = document.getElementById('npin'), elNpinVal = document.getElementById('npinVal');
const tglLabels = document.getElementById('tglLabels'), tglRotate = document.getElementById('tglRotate'),
  tglSec = document.getElementById('tglSec');
const stA = document.getElementById('stA'), stS = document.getElementById('stS'),
  stC = document.getElementById('stC'), stR = document.getElementById('stR');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function updateFormula() {
  const ac = alignedCount(), mc = (maxComp() * 10).toFixed(1);
  formulaEl.innerHTML = L(
    `<b>对齐判据</b>:每列 |g<sub>i</sub>| = |下弹子顶 − 剪切线| &lt; 0.02,全对齐才可转 · 现 <b>${ac}/${nPins}</b> 根 · 一根不齐 = 全卡(AND 逻辑)<br>` +
    `弹簧压缩 x = C − y<sub>顶</sub>,现最大 <b>${mc} mm</b> · 异形弹子(葫芦/蘑菇)先给「假设」,再提一次才真「设」`,
    `<b>Shear criterion</b>: per stack |g<sub>i</sub>| = |key-pin top − shear line| &lt; 0.02; turns only if all align · now <b>${ac}/${nPins}</b> · one off = all jam (AND logic)<br>` +
    `Spring squeeze x = C − y<sub>top</sub>, max now <b>${mc} mm</b> · spool/mushroom pins give a false set first; lift again to truly set`);
}
function startScript(list) { playing = true; setPlayLabel(); runScript(list); }
document.getElementById('btnIn').addEventListener('click', () => { resetEmpty(); startScript([keyInSeg('right'), segHold(1e9)]); });
document.getElementById('btnWrong').addEventListener('click', () => { resetEmpty(); startScript([keyInSeg('wrong'), jiggleSeg(), segHold(1e9)]); });
document.getElementById('btnOut').addEventListener('click', () => {
  if (keyKind) startScript([keyOutSeg(), segHold(1e9)]); else resetEmpty();
});
document.getElementById('btnTurn').addEventListener('click', () => {
  if (open) return;
  if (rotatable()) startScript([turnSeg(), segHold(1e9)]);
  else startScript([jiggleSeg(), segHold(1e9)]);
});
document.getElementById('btnDemo').addEventListener('click', () => { resetEmpty(); startScript(demoChain()); });
elNpin.value = nPins; elNpinVal.textContent = nPins;
elNpin.addEventListener('input', () => {
  nPins = +elNpin.value; elNpinVal.textContent = nPins;
  wIdx = Math.min(2, nPins - 2);
  resetEmpty(); buildPins();
});
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = +elSpd.value; elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
tglSec.addEventListener('change', () => { secPins = tglSec.checked; resetEmpty(); syncSec(); });
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 状态 → 场景 ---------------- */
function liftTarget(i) {
  const p = pins[i];
  if (p.set) return 0;
  if (i === pickIdx) return Math.max(0, pickK * (0.24 - p.dip) - 0.004 * pickK);
  if (!keyKind) return 0;
  const f = clamp(((p.x - 0.18) - (TIP_X + keyX)) / 0.34, 0, 1);
  const dip = p.dip - (keyKind === 'wrong' && i === wIdx ? 0.07 : 0);
  return f > 0 ? Math.max(0, f * (0.24 - dip) - 0.004 * f) : 0;
}
function mkFor(p, i) {
  if (jamPin === i) return mkRed;
  if (falsePin === i) return mkAmber;
  if (p.set) return mkGreen;
  if (keyKind && keyX < 0.3 && Math.abs(REST_B + p.lift + p.len - S) < 0.03) return mkAcc;
  return mkDim;
}
const TORQ_PICK = new THREE.Vector3(1.45, -1.02, 0.14);
const TORQ_KEY = new THREE.Vector3(2.55, -0.85, 0.15);
function updState(dt) {
  const kk = Math.min(1, dt * 14);
  if (pickOn) rotorTarget = bindA;
  rotorA += (rotorTarget - rotorA) * kk;
  rotor.rotation.x = rotorA;
  openK += (openKTgt - openK) * kk;
  bolt.position.x = -2.28 + 0.5 * openK;
  jamPin = (keyKind === 'wrong' && keyX < 0.3) ? wIdx : -1;
  for (let i = 0; i < nPins; i++) {
    const p = pins[i];
    p.lift += (liftTarget(i) - p.lift) * Math.min(1, dt * 16);
    const kpBot = p.set ? REST_B : REST_B + p.lift;
    p.kpG.position.y = kpBot;
    p.kp.material = jamPin === i ? M.pinBad : M.brass;
    const drvB = p.set ? S : REST_B + p.lift + p.len;
    p.dvG.position.y = drvB;
    const dTop = drvB + DRV, gap = Math.max(C_TOP - dTop, 0.05);
    p.spring.scale.y = gap;
    p.spring.position.y = dTop;
    p.mk.position.y = p.set ? S : kpBot + p.len;
    p.mk.material = mkFor(p, i);
  }
  if (keyGrp) keyGrp.position.x = keyX;
  wrench.visible = wrenchOn;
  pickGrp.visible = pickOn;
  if (pickOn) {
    const hx = clamp(pickTip, -1.4, 1.45);
    pickRod.scale.x = Math.max(1.55 - hx, 0.05);
    pickRod.position.set((1.55 + hx) / 2, -0.18, 0.06);
    pickKnob.position.set(1.62, -0.18, 0.06);
    const topY = REST_B + (pickIdx >= 0 ? pins[pickIdx].lift : 0) - 0.01;
    const len = Math.max(topY + 0.2, 0.08);
    pickHook.scale.y = len;
    pickHook.position.set(hx, -0.2 + len / 2, 0.06);
  }
  torq.visible = wrenchOn || curName === 'jiggle';
  torq.position.copy(wrenchOn || !keyGrp ? TORQ_PICK : TORQ_KEY);
  if (jamPin >= 0) lblJam.position.x = pins[jamPin].x;
  shearGlow.material.opacity = 0.55 + 0.3 * Math.sin(performance.now() / 300);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) { seqTick(dts); tSim += dts; }
  updState(dt);
  updateParticles(dt);
  stA.textContent = alignedCount() + '/' + nPins;
  stS.textContent = rotatable() ? L('通', 'clear') : L('卡', 'jammed');
  stS.className = 'v ' + (rotatable() ? 'ok' : 'bad');
  stC.innerHTML = (maxComp() * 10).toFixed(1) + '<small> mm</small>';
  stR.textContent = open ? L('已开', 'open') : rotatable() ? L('可', 'yes') : L('不可', 'no');
  stR.className = 'v ' + (open ? 'acc' : rotatable() ? 'ok' : 'bad');
  formulaAcc += dt;
  if (formulaAcc > 0.25) { formulaAcc = 0; updateFormula(); }
  for (const r of labelReg) if (labelsOn && r.vis() && !r.span) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ---------------- 初始化(URL 参数) ---------------- */
wIdx = Math.min(2, nPins - 2);
buildPins();
function fastForward(sec) {
  const lim = tSim + clamp(sec, 0, 180);
  let guard = 0;
  while (tSim < lim && guard++ < 8000) {
    seqTick(0.05 * speed);
    updState(0.05);
    tSim += 0.05;
  }
}
fastForward(qsFloat('t', 0));
applyTheme();
applyLang();
refreshLabels();
start();
</script>
</body>
