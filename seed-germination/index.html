<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>种子萌发与赤霉素 · GA 敲门,淀粉开仓,胚根破壳</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#66a80f;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#5c940d;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(102,168,15,.6);background:rgba(102,168,15,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(92,148,13,.55);background:rgba(92,148,13,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(102,168,15,.10);border-color:rgba(102,168,15,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(92,148,13,.08);border-color:rgba(92,148,13,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#e9fac5}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="种子萌发与赤霉素" data-en="Seed Germination & Gibberellin">种子萌发与赤霉素</h1>
  <div class="sub" data-zh="干种子是上锁的粮仓:吸胀唤醒胚,胚放出赤霉素敲糊粉层的门,α-淀粉酶涌出把淀粉水解成糖——粮仓开仓,胚根顶破种皮;ABA 在旁按着锁 · 拖动旋转 / 空格运行/暂停" data-en="A dry seed is a locked granary: imbibition wakes the embryo, gibberellin knocks on the aleurone door, α-amylase floods out to hydrolyze starch into sugar — the granary opens, the radicle breaks the coat; ABA holds the lock in the corner · drag to orbit / Space = run/pause">干种子是上锁的粮仓:吸胀唤醒胚,胚放出赤霉素敲糊粉层的门,α-淀粉酶涌出把淀粉水解成糖——粮仓开仓,胚根顶破种皮;ABA 在旁按着锁 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="含水率" data-en="Water content">含水率</span><span class="v" id="stWater">—</span>
  <span class="k" data-zh="GA 浓度" data-en="GA level">GA 浓度</span><span class="v" id="stGA">—</span>
  <span class="k" data-zh="淀粉余量" data-en="Starch left">淀粉余量</span><span class="v" id="stStarch">—</span>
  <span class="k" data-zh="胚根长度" data-en="Radicle">胚根长度</span><span class="v" id="stRad">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bSow" data-zh="💧 浇水播种" data-en="💧 Sow">💧 浇水播种</button>
    <button class="abtn" id="bABA" data-zh="ABA 休眠对照" data-en="ABA dormancy">ABA 休眠对照</button>
    <button class="abtn" id="bLight" data-zh="需光种子" data-en="Light-seeker">需光种子</button>
  </div>
  <div class="row">
    <label data-zh="土壤湿度" data-en="Moisture">土壤湿度</label>
    <input id="sMoist" type="range" min="0" max="100" step="5" value="60">
    <span class="val" id="sMoistVal">60 %</span>
  </div>
  <div class="row">
    <label data-zh="温度" data-en="Temperature">温度</label>
    <input id="sTemp" type="range" min="5" max="40" step="1" value="22">
    <span class="val" id="sTempVal">22 °C</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="种内剖面" data-en="Cutaway">种内剖面</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../pollination/" data-zh="传粉与受精" data-en="Pollination & Fertilization">传粉与受精</a>
    <a href="../gravitropism/" data-zh="向重力性" data-en="Gravitropism">向重力性</a>
    <a href="../phototropism/" data-zh="向光性" data-en="Phototropism">向光性</a>
    <a href="../stomata-guard-cells/" data-zh="气孔与保卫细胞" data-en="Stomata & Guard Cells">气孔与保卫细胞</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-3.2,3.4,7.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=30;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
/* 土壤块(剖开) */
const soilM=new THREE.MeshStandardMaterial({color:0x5d4a38,roughness:1});
const soil=new THREE.Mesh(new THREE.BoxGeometry(8,2.4,4.6),soilM);
soil.position.y=-1.2;scene.add(soil);
const soilCut=new THREE.MeshStandardMaterial({color:0x6e5943,roughness:1});
const soilFace=new THREE.Mesh(new THREE.BoxGeometry(7.6,2.3,0.1),soilCut);
soilFace.position.set(0,-1.2,2.28);scene.add(soilFace);

/* 种子剖面(放大 8 倍展示):种皮+胚乳(淀粉粒)+糊粉层+胚 */
const seedG=new THREE.Group();seedG.position.set(0,0.9,1.4);seedG.scale.setScalar(1.6);scene.add(seedG);
const coatM=new THREE.MeshStandardMaterial({color:0x8a6a4a,roughness:0.7});
const coat=new THREE.Mesh(new THREE.SphereGeometry(1.05,28,20),coatM);
coat.scale.set(1.5,1,1);seedG.add(coat);
const endoM=new THREE.MeshStandardMaterial({color:0xe8dcc0,roughness:0.8});
const endo=new THREE.Mesh(new THREE.SphereGeometry(0.92,26,18),endoM);
endo.scale.set(1.45,0.95,0.95);seedG.add(endo);
/* 淀粉粒(白点阵) */
const NST=60;
const starchM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5});
const starch=new THREE.InstancedMesh(new THREE.SphereGeometry(0.06,8,6),starchM,NST);
seedG.add(starch);
const stD=[];for(let i=0;i<NST;i++){
  const a=Math.random()*Math.PI*2,c=Math.random()*1.4-0.7;
  stD.push({x:-0.85+c*1.1,y:(Math.random()-0.5)*0.7,z:(Math.random()-0.5)*0.7,s:0.6+Math.random()*0.7});
}
const m4=new THREE.Matrix4();
/* 糊粉层(外圈细环) */
const aleuroneM=new THREE.MeshStandardMaterial({color:0xc9a86a,roughness:0.6,emissive:0xc9a86a,emissiveIntensity:0});
const aleurone=new THREE.Mesh(new THREE.SphereGeometry(0.97,26,18),aleuroneM);
aleurone.scale.set(1.47,0.98,0.98);aleurone.material.side=THREE.DoubleSide;seedG.add(aleurone);
/* 胚(下部小芽) */
const embM=new THREE.MeshStandardMaterial({color:0x8ce99a,roughness:0.5,emissive:0x2b8a3e,emissiveIntensity:0.15});
const embryo=new THREE.Mesh(new THREE.CapsuleGeometry(0.22,0.3,4,10),embM);
embryo.position.set(0.75,-0.45,0);embryo.rotation.z=-0.6;seedG.add(embryo);
const embryoTip=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.3,8),embM);
embryoTip.position.set(1.0,-0.72,0);embryoTip.rotation.z=-2.2;seedG.add(embryoTip);
/* GA 信号粒子(胚→糊粉层) */
const NGA=14;
const gaM=new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0.9});
const ga=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),gaM,NGA);
ga.instanceMatrix.setUsage(THREE.DynamicDrawUsage);seedG.add(ga);
const gaD=[];for(let i=0;i<NGA;i++)gaD.push({t:Math.random()});
/* α-淀粉酶粒子(糊粉层→胚乳) */
const NAM=18;
const amM=new THREE.MeshBasicMaterial({color:0xff922b,transparent:true,opacity:0.9});
const amyl=new THREE.InstancedMesh(new THREE.SphereGeometry(0.04,8,6),amM,NAM);
amyl.instanceMatrix.setUsage(THREE.DynamicDrawUsage);seedG.add(amyl);
const amD=[];for(let i=0;i<NAM;i++)amD.push({t:Math.random()});
/* 糖粒子(淀粉→胚) */
const NSG=16;
const sgM=new THREE.MeshBasicMaterial({color:0x69db7c,transparent:true,opacity:0.9});
const sugar=new THREE.InstancedMesh(new THREE.SphereGeometry(0.04,8,6),sgM,NSG);
sugar.instanceMatrix.setUsage(THREE.DynamicDrawUsage);seedG.add(sugar);
const sgD=[];for(let i=0;i<NSG;i++)sgD.push({t:Math.random()});
/* 真苗(萌发后长出) */
const sprout=new THREE.Group();sprout.position.set(0.2,-0.35,0);sprout.visible=false;seedG.add(sprout);
const stemM=new THREE.MeshStandardMaterial({color:0x94d82d,roughness:0.5});
const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,1.4,8),stemM);
stem.position.y=0.7;sprout.add(stem);
const leafM=new THREE.MeshStandardMaterial({color:0xa9e34b,roughness:0.5,side:THREE.DoubleSide});
for(const s of [-1,1]){
  const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.6,4),leafM);
  leaf.position.set(s*0.18,1.35,0);leaf.rotation.z=s*1.2;sprout.add(leaf);
}
/* 水滴(浇水) */
const dropM=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.1,metalness:0.1,transparent:true,opacity:0.85});
const drop=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),dropM);
drop.visible=false;scene.add(drop);

/* 状态 */
let moist=60,tempC=22,aba=false,lightNeed=false,lightOn=false,playing=true,labelsOn=true,slowMo=false,cut=true;
let water=0,gaL=0,amylL=0,starchLeft=1,radicle=0,sproutH=0,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function germRate(){/* 温度窗口与水分决定酶活 */
  const t=Math.exp(-Math.pow(tempC-24,2)/90);
  return t*clamp(moist/60,0,1)*(aba?0.12:1)*((lightNeed&&!lightOn)?0.08:1);}
function sown(){water=moist/100*0.4;gaL=0;amylL=0;starchLeft=1;radicle=0;sproutH=0;
  sprout.visible=false;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('吸胀:干种子喝水,酶活醒来','Imbibition: the dry seed drinks and its enzymes wake'),
  new THREE.Vector3(-2.6,2.6,1.4),'b',()=>water>0.05);
addLabel(()=>L('胚 → 赤霉素 GA:开仓的敲门声','Embryo → gibberellin: the knock on the granary door'),
  new THREE.Vector3(2.6,1.6,1.4),'y',()=>gaL>0.1);
addLabel(()=>L('糊粉层 → α-淀粉酶:水解大军进场','Aleurone → α-amylase: the hydrolysis crew moves in'),
  new THREE.Vector3(-2.4,0.2,1.4),'o',()=>amylL>0.1);
addLabel(()=>L('淀粉 → 糖:粮仓开仓喂胚','Starch → sugar: the granary feeds the embryo'),
  new THREE.Vector3(2.6,-0.2,1.4),'g',()=>starchLeft<0.9);
addLabel(()=>L('ABA 按着锁:休眠不撤,浇水也没用','ABA holds the lock: dormancy overrides water'),
  new THREE.Vector3(-2.6,-0.9,1.4),'r',()=>aba);
addLabel(()=>L('胚根破壳:优先向下找水(向重力性)','Radicle breaks out — down first, chasing water'),
  new THREE.Vector3(2.6,0.9,1.4),'g',()=>radicle>0.05);

function setMoist(v){moist=clamp(v,0,100);
  document.getElementById('sMoist').value=moist;
  document.getElementById('sMoistVal').textContent=moist.toFixed(0)+' %';}
function setTemp(v){tempC=clamp(v,5,40);
  document.getElementById('sTemp').value=tempC;
  document.getElementById('sTempVal').textContent=tempC.toFixed(0)+' °C';}

const STEPS=[
 {zh:'干种子:含水 8%,一切按暂停',en:'Dry seed: 8% water, everything paused',
  act(){aba=false;setMoist(5);setTemp(22);sown();}},
 {zh:'浇水吸胀:水一到,酶就醒',en:'Water it: imbibition wakes the enzymes',
  act(){aba=false;setMoist(65);sown();}},
 {zh:'胚分泌 GA:信号撞上糊粉层',en:'GA out: the signal hits the aleurone',
  act(){aba=false;setMoist(70);setTemp(24);sown();}},
 {zh:'α-淀粉酶进场:淀粉仓开仓',en:'α-amylase moves in: the granary opens',
  act(){aba=false;setMoist(75);setTemp(26);sown();}},
 {zh:'胚根破壳:先向下找水,再向上找光',en:'Radicle out: down for water first, up for light',
  act(){aba=false;setMoist(80);setTemp(25);sown();}},
 {zh:'ABA 对照:锁没开,浇再多也不萌发',en:'ABA control: the lock holds — water changes nothing',
  act(){aba=true;setMoist(90);sown();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stWater').innerHTML=(8+water*55).toFixed(0)+'<small> %</small>';
  document.getElementById('stGA').innerHTML=(gaL*100).toFixed(0)+'<small> rel</small>';
  const sv=document.getElementById('stStarch');
  sv.innerHTML=(100*starchLeft).toFixed(0)+'<small> %</small>';
  sv.className='v '+(starchLeft<0.3?'ok':'');
  document.getElementById('stRad').innerHTML=(radicle*20).toFixed(1)+'<small> mm</small>';
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSow').addEventListener('click',()=>{aba=false;setMoist(70);sown();
  drop.visible=true;drop.position.set(0,4.2,1.4);});
document.getElementById('bABA').addEventListener('click',()=>{aba=true;setMoist(90);sown();});
document.getElementById('bLight').addEventListener('click',()=>{lightNeed=true;lightOn=!lightOn;
  aba=false;setMoist(70);sown();});
document.getElementById('sMoist').addEventListener('input',e=>setMoist(+e.target.value));
document.getElementById('sTemp').addEventListener('input',e=>setTemp(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{
  cut=e.target.checked;
  coat.visible=cut;
  seedG.rotation.y=cut?0.55:0;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  soilM.color.setHex(dark?0x5d4a38:0x8a7258);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  const r=germRate();
  /* 吸水 */
  water=clamp(water+(moist/100*0.5-water)*dts*0.8,0,1);
  coat.scale.set(1.5*(1+water*0.06),1*(1+water*0.06),1*(1+water*0.06));
  /* GA → 淀粉酶 → 水解 链条 */
  gaL=clamp(gaL+(water>0.3?r*0.8:-0.5)*dts*0.6,0,1);
  amylL=clamp(amylL+(gaL>0.35?r*0.9:-0.5)*dts*0.6,0,1);
  const hydro=amylL*r;
  starchLeft=clamp(starchLeft-hydro*dts*0.16,0,1);
  /* 淀粉粒消失 */
  const visible=Math.round(NST*starchLeft);
  for(let i=0;i<NST;i++){
    const s=i<visible?stD[i].s:0.001;
    m4.makeScale(s,s,s);
    m4.setPosition(stD[i].x,stD[i].y,stD[i].z);
    starch.setMatrixAt(i,m4);
  }
  starch.instanceMatrix.needsUpdate=true;
  /* 胚根与苗 */
  if(starchLeft<0.75)radicle=clamp(radicle+r*dts*0.5,0,1);
  if(radicle>0.4)sproutH=clamp(sproutH+(starchLeft<0.4?r*dts*0.8:0),0,1);
  sprout.visible=sproutH>0.02;
  sprout.scale.y=Math.max(sproutH,0.02);
  embryoTip.position.y=-0.72-radicle*0.5;
  embryo.position.y=-0.45-radicle*0.2;
  /* 粒子链动画 */
  for(let i=0;i<NGA;i++){
    const g=gaD[i];
    g.t+=dts*(gaL>0.1?0.7:0);
    if(g.t>1)g.t-=1;
    const t=g.t;
    const x=0.7-(t)*1.15,y=-0.42+t*0.75;
    const s=gaL>0.1?1:0.001;
    m4.makeScale(s,s,s);m4.setPosition(x,y,0);
    ga.setMatrixAt(i,m4);
  }
  ga.instanceMatrix.needsUpdate=true;
  ga.visible=gaL>0.1;
  for(let i=0;i<NAM;i++){
    const a=amD[i];
    a.t+=dts*(amylL>0.1?0.8:0);
    if(a.t>1)a.t-=1;
    const x=-0.85+a.t*1.5,y=(i%2?0.4:-0.3)*Math.sin(a.t*Math.PI);
    const s=amylL>0.1?1:0.001;
    m4.makeScale(s,s,s);m4.setPosition(x,y,0.1);
    amyl.setMatrixAt(i,m4);
  }
  amyl.instanceMatrix.needsUpdate=true;
  amyl.visible=amylL>0.1;
  for(let i=0;i<NSG;i++){
    const g=sgD[i];
    g.t+=dts*(starchLeft<0.95?0.7:0);
    if(g.t>1)g.t-=1;
    const x=0.2+g.t*0.55,y=-0.1-g.t*0.25;
    const s=starchLeft<0.95?1:0.001;
    m4.makeScale(s,s,s);m4.setPosition(x,y,0);
    sugar.setMatrixAt(i,m4);
  }
  sugar.instanceMatrix.needsUpdate=true;
  sugar.visible=starchLeft<0.95;
  /* 浇水滴下落 */
  if(drop.visible){
    drop.position.y-=dts*2.2;
    if(drop.position.y<1.2)drop.visible=false;
  }
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
seedG.rotation.y=0.55;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
