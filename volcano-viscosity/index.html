<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火山与粘度 · 温柔盾状 vs 猛爆层状</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,120,80,.9); color: #ffc9b2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.l { color: #ffc9b2; border-color: rgba(255,120,80,.7); }
  .chip.g2 { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="火山与粘度:温柔盾状 vs 猛爆层状" data-en="Volcanoes &amp; Viscosity: gentle shields vs explosive strato">火山与粘度：温柔盾状 vs 猛爆层状</h1>
  <div class="sub" data-zh="硅多则粘,粘则憋压:夏威夷玄武岩质温柔溢流,维苏威安山岩质猛爆喷柱——一切取决于岩浆有多「稠」 · 空格播放/暂停" data-en="More silica, more viscosity, more pressure: Hawaiian basalt flows gently, Vesuvius andesite explodes — it all hinges on how thick the magma is · Space = play/pause">硅多则粘，粘则憋压：夏威夷玄武岩质温柔溢流，维苏威安山岩质猛爆喷柱——一切取决于岩浆有多「稠」 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="岩浆类型" data-en="magma type">岩浆类型</span><span class="v g" id="stType" style="font-size:14px">—</span>
  <span class="k" data-zh="相对粘度" data-en="viscosity">相对粘度</span><span class="v" id="stVis">—</span>
  <span class="k" data-zh="气体逃逸" data-en="gas escape">气体逃逸</span><span class="v" id="stGas" style="font-size:14px">—</span>
  <span class="k" data-zh="喷发样式" data-en="eruption style">喷发样式</span><span class="v" id="stStyle" style="font-size:14px">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.l" data-zh="熔岩(温度≈1200°C)" data-en="lava (~1200°C)">熔岩(温度≈1200°C)</span>
    <span class="chip.g2" data-zh="气泡(溶解的 CO₂/H₂O)" data-en="bubbles (dissolved CO₂/H₂O)">气泡(溶解的 CO₂/H₂O)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnErupt" data-zh="开始喷发" data-en="start erupting">开始喷发</button>
  </div>
  <div class="row"><label data-zh="SiO₂ 含量→粘度" data-en="SiO₂ → viscosity">SiO₂ 含量→粘度</label><input id="vis" type="range" min="0" max="100" step="1" value="20"><span class="val" id="visVal">玄武岩质</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../plate-tectonics/" data-zh="岩浆从哪来" data-en="where magma comes from">岩浆从哪来</a>
    <a href="../cloud-formation/" data-zh="火山灰如何造云冷夏" data-en="how ash cools summers">火山灰如何造云冷夏</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xdfe4ec : 0x11151d);
  skyFog.visible = THEME === 'dark';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('火山与粘度', 'Volcanoes & Viscosity');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 2.2, 7.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.35);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  rock: mat(0x4a4038, { opacity: 1 }),
  lava: mat(0xff5a2a, { emissiveIntensity: 1.4, opacity: 1 }),
  lavaCool: mat(0x8a3320, { emissiveIntensity: 0.4, opacity: 1 }),
  ash: new THREE.MeshBasicMaterial({ color: 0x4a4a52, transparent: true, opacity: 0.55 }),
  bubble: new THREE.MeshBasicMaterial({ color: 0xffd166, blending: THREE.AdditiveBlending, transparent: true }),
  skyFogM: new THREE.MeshBasicMaterial({ color: 0x2a2f3a, transparent: true, opacity: 0.25 }),
};
const skyFog = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 16), M.skyFogM);
scene.add(skyFog);
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.8, 0.3, 48),
  mat(0x2c3328, { opacity: 1, roughness: 0.9 }));
base.position.y = -0.15;
scene.add(base);

/* ================= 火山体(可变坡度) ================= */
const ventY = 1.4;
const cone = new THREE.Mesh(new THREE.ConeGeometry(2.2, 2.6, 40, 1, true), M.rock);
cone.position.y = 1.3;
scene.add(cone);
/* 火山口 */
const crater = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 0.16, 24),
  mat(0x33261f, { emissive: 0xff5a2a, emissiveIntensity: 0.6 }));
crater.position.y = ventY + 0.02;
scene.add(crater);

/* 熔岩粒子系统:低粘=沿坡流远,高粘=堵在口部 */
const lavas = [];   // {mesh, v:Vector3, life}
const ashes = [];   // {mesh, v:Vector3, life}
const bubbles = []; // {mesh, life}
function spawnLava() {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.07 + Math.random() * 0.05, 10, 8), M.lava);
  m.position.set(0, ventY, 0);
  scene.add(m);
  /* 初速:沿随机坡向 */
  const a = Math.random() * Math.PI * 2;
  lavas.push({ mesh: m, v: new THREE.Vector3(Math.cos(a) * 0.55, 0.05, Math.sin(a) * 0.55), life: 0 });
}
function spawnAsh() {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.09 + Math.random() * 0.07, 8, 6), M.ash);
  m.position.set((Math.random() - 0.5) * 0.3, ventY + 0.1, (Math.random() - 0.5) * 0.3);
  scene.add(m);
  ashes.push({ mesh: m, v: new THREE.Vector3((Math.random() - 0.5) * 0.5, 1.4 + Math.random() * 0.9, (Math.random() - 0.5) * 0.5), life: 0 });
}
function spawnBubble() {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.05 + Math.random() * 0.06, 8, 6), M.bubble);
  m.position.set((Math.random() - 0.5) * 0.2, ventY - 0.1, (Math.random() - 0.5) * 0.2);
  scene.add(m);
  bubbles.push({ mesh: m, life: 0 });
}

/* ---------------- 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let vis = 0.2;             // 0=玄武岩(流) 1=流纹岩(堵)
let erupting = false;
let tSim = 0;
let spawnCD = 0;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblCone = addLabel(() => vis < 0.4
  ? L('盾状火山:稀薄玄武岩熔岩一路流 10+ km,坡度只有 ~5°(莫纳罗亚、冰岛)', 
      'shield volcano: runny basalt flows 10+ km, slopes barely 5° (Mauna Loa, Iceland)')
  : vis > 0.7
    ? L('层状火山:粘稠熔岩堵住火山口,气压顶到天花板——维苏威、圣海伦斯的猛爆', 
        'stratovolcano: sticky lava plugs the vent; pressure builds to the ceiling — Vesuvius, St. Helens')
    : L('过渡型:安山岩质,流一段、堵一阵、喷一下', 
        'intermediate: andesitic — flows a bit, plugs a bit, pops a bit'),
  new THREE.Vector3(0, 3.4, 0), 'st');
const lblKey = addLabel(() => L('同一颗星球,同样的气体:唯一变量是岩浆的「稠度」——硅链越长越难流动', 
  'same planet, same gases: the only variable is magma thickness — longer silica chains resist flow'),
  new THREE.Vector3(0, -0.7, 0), 'g');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '粘度从哪来', be: 'Where viscosity comes from',
    d: '岩浆里的硅氧四面体连成长链:硅越多(SiO₂ 45%→75%),链越长越缠,越难流动——蜂蜜 vs 水的差别。',
    de: 'Silica tetrahedra chain up in the melt: more SiO₂ (45%→75%), longer chains, harder flow — honey versus water.',
    act: () => { document.getElementById('vis').value = 20; document.getElementById('vis').dispatchEvent(new Event('input')); } },
  { b: '稀薄=温柔(玄武岩)', be: 'Thin = gentle (basalt)',
    d: '玄武岩质岩浆粘度低:气泡咕嘟咕嘟自由逃逸,熔岩安静地流成盾状——夏威夷游客站在旁边看喷泉。',
    de: 'Low-viscosity basalt lets bubbles blither out freely; lava flows quietly into shields — Hawaii tourists watch fountains up close.',
    act: () => { document.getElementById('vis').value = 10; document.getElementById('vis').dispatchEvent(new Event('input')); document.getElementById('btnErupt').click(); } },
  { b: '粘稠=憋压(流纹岩)', be: 'Thick = pressure cooker (rhyolite)',
    d: '高硅岩浆把气泡锁在体内:上升减压,气泡急速膨胀——整座山像摇过的香槟,盖子一开就是猛爆。',
    de: 'High-silica magma traps its bubbles; rising drops the pressure, bubbles explode outward — the whole peak is shaken champagne, and the cork is coming.',
    act: () => { document.getElementById('vis').value = 95; document.getElementById('vis').dispatchEvent(new Event('input')); } },
  { b: '压力锅:堵住才猛', be: 'The pressure cooker: plugged before the bang',
    d: '粘稠熔岩在火山口冷凝成「塞子」;下面继续供气,压力累积数千倍大气压——塞子崩开的一瞬就是普林尼式喷发。',
    de: 'Sticky lava freezes into a plug at the vent; gas keeps pumping below until pressure hits thousands of atmospheres — the plug fails in a Plinian blast.',
    act: () => { document.getElementById('vis').value = 90; document.getElementById('vis').dispatchEvent(new Event('input')); document.getElementById('btnErupt').click(); } },
  { b: '中间档:安山岩', be: 'The middle child: andesite',
    d: '安山岩质(俯冲带特产)介于两者之间:流一段堵一段,周期性爆喷——环太平洋的火山大多是它。',
    de: 'Andesite (the subduction-zone special) sits between: flows, plugs, pops on a cycle — most Pacific Ring volcanoes.',
    act: () => { document.getElementById('vis').value = 55; document.getElementById('vis').dispatchEvent(new Event('input')); } },
];
function stepIndex() {
  if (vis > 0.7) return 3;
  if (vis > 0.4) return 4;
  if (vis < 0.35) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elVis = document.getElementById('vis');
const btnErupt = document.getElementById('btnErupt');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elVis.addEventListener('input', e => {
  vis = parseInt(e.target.value) / 100;
  elVisVal.textContent = vis < 0.35 ? L('玄武岩质', 'basaltic') : vis > 0.7 ? L('流纹岩质', 'rhyolitic') : L('安山岩质', 'andesitic');
  /* 锥形坡度:低粘=宽缓盾状,高粘=陡层状 */
  cone.scale.set(lerp(1.5, 0.8, vis), 1, lerp(1.5, 0.8, vis));
  cone.material.color.set(lerp(0x5a4a3a, 0x3a3340, vis));
});
const elVisVal = document.getElementById('visVal');
btnErupt.addEventListener('click', () => {
  erupting = !erupting;
  btnErupt.classList.toggle('on', erupting);
});
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 喷发 ================= */
function eruptTick(dts) {
  if (!erupting) return;
  spawnCD -= dts;
  if (spawnCD <= 0) {
    spawnCD = 0.06;
    spawnBubble();
    if (vis < 0.5 || Math.random() < 0.4) spawnLava();
    if (vis > 0.45 && Math.random() < 0.8) spawnAsh();
  }
  /* 熔岩:沿坡流动,冷却变暗 */
  for (let i = lavas.length - 1; i >= 0; i--) {
    const l = lavas[i];
    l.life += dts;
    const mobility = lerp(1.0, 0.06, vis);
    l.mesh.position.addScaledVector(l.v, dts * mobility * 2.4);
    l.mesh.position.y = Math.max(-0.02, l.mesh.position.y - dts * 0.22);
    const c = clamp(l.life * 0.3, 0, 1);
    l.mesh.material = c < 0.4 ? M.lava : M.lavaCool;
    if (l.life > 7) { scene.remove(l.mesh); lavas.splice(i, 1); }
  }
  /* 灰柱 */
  for (let i = ashes.length - 1; i >= 0; i--) {
    const a = ashes[i];
    a.life += dts;
    a.mesh.position.addScaledVector(a.v, dts);
    a.v.y = Math.max(0.4, a.v.y - dts * 0.3);
    a.v.x += Math.sin(tSim * 2 + i) * dts * 0.15;
    a.mesh.material.opacity = clamp(0.6 - a.life * 0.08, 0, 0.6);
    a.mesh.scale.multiplyScalar(1 + dts * 0.35);
    if (a.life > 6) { scene.remove(a.mesh); ashes.splice(i, 1); }
  }
  /* 气泡 */
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.life += dts;
    b.mesh.position.y += dts * 0.5;
    b.mesh.scale.multiplyScalar(1 + dts * 0.5);
    if (b.life > 1.2) { scene.remove(b.mesh); bubbles.splice(i, 1); }
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  eruptTick(dts);
  crater.material.emissiveIntensity = 0.4 + (erupting ? 0.5 + 0.3 * Math.sin(tSim * 7) : 0.1 * Math.sin(tSim * 2));
  document.getElementById('stType').textContent = vis < 0.35 ? L('玄武岩质(45-52%)', 'basaltic (45-52%)')
    : vis > 0.7 ? L('流纹岩质(>68%)', 'rhyolitic (>68%)') : L('安山岩质(53-68%)', 'andesitic (53-68%)');
  document.getElementById('stVis').innerHTML = '×' + Math.round(lerp(1, 100000, vis)) + '<small>(演示)</small>';
  document.getElementById('stGas').textContent = vis < 0.4 ? L('自由逃逸', 'free escape') : vis > 0.7 ? L('被锁到爆', 'locked till boom') : L('断续喷逸', 'intermittent');
  document.getElementById('stStyle').textContent = vis < 0.4 ? L('溢流喷发(温和)', 'effusive (gentle)')
    : vis > 0.7 ? L('普林尼式(猛爆)', 'Plinian (explosive)') : L('斯特龙博利式', 'Strombolian');

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
