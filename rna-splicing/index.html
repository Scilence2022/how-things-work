<style>
  :root,:root[data-theme="dark"]{

    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}

  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="labels"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---- 工具 ---- */
const qs=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=f=>{f=clamp(f,0,1);return f*f*(3-2*f);};
const lerp=(a,b,f)=>a+(b-a)*f;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 / 场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,38);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,120);
camera.position.set(-1.3,3.0,14.8); // 左移拉远：E1 与蛋白对比卡避开左下面板
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-1.7,-1.1,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=40;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(4,7,6); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-6,4,-4); scene.add(fill);

const grid=new THREE.GridHelper(30,30,0x2a3644,0x1b232e);
grid.position.y=-3.9; grid.material.transparent=true; grid.material.opacity=0.25;
scene.add(grid);

/* ---- 转录本布局：E1 I1 E2 I2 E3 I3 E4（宽度∝编码长度） ---- */
const EXW=[1.2,2.4,2.1,1.5], EXAA=[45,110,95,60];
const EXCOL=[0x4dabf7,0x51cf66,0xffd43b,0xe599f7];
const INW=[1.0,1.0,1.0];
const X0=-5.1;
const segsDef=[];
{ let acc=0;
  for(let i=0;i<4;i++){
    segsDef.push({t:'e',i,x0:X0+acc,w:EXW[i]}); acc+=EXW[i];
    if(i<3){ segsDef.push({t:'i',i,x0:X0+acc,w:INW[i]}); acc+=INW[i]; }
  }
}

/* ---- 外显子 / 内含子网格 ---- */
const exonMeshes=EXW.map((w,i)=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(1,0.55,0.55),
    new THREE.MeshStandardMaterial({color:EXCOL[i],roughness:.35,metalness:.08,transparent:true}));
  m.userData={xc0:0,w,rotOff:0,intron:false,mat:m.material};
  scene.add(m); return m;
});
const intronMeshes=INW.map((w,i)=>{
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1,10),
    new THREE.MeshStandardMaterial({color:0x8a97a5,roughness:.6,metalness:.15,transparent:true}));
  m.userData={xc0:0,w,rotOff:-Math.PI/2,intron:true,mat:m.material};
  scene.add(m); return m;
});
/* 每段的静置中心 x（后续全部由 xc0+全局位移 定位；须在网格声明之后执行） */
segsDef.forEach(sd=>{
  const m=sd.t==='e'?exonMeshes[sd.i]:intronMeshes[sd.i];
  m.userData.xc0=sd.x0+sd.w/2;
});

/* 5′ 帽子与 poly-A 尾 */
const capMesh=new THREE.Mesh(new THREE.SphereGeometry(0.17,14,12),
  new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xffa000,emissiveIntensity:.5,roughness:.3}));
capMesh.position.set(X0-0.2,0,0); scene.add(capMesh);
const polyG=new THREE.Group(); scene.add(polyG);
const polyMat=new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:.4});
for(let i=0;i<5;i++){
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),polyMat);
  b.position.set(X0+10.2+0.18+i*0.22,0,0); polyG.add(b);
}

/* ---- 蛋白条带对照板（组成型 vs 当前剪接） ---- */
const stripPanel=new THREE.Mesh(new THREE.BoxGeometry(9.6,1.6,0.1),
  new THREE.MeshStandardMaterial({color:0x161b22,roughness:.9,transparent:true,opacity:.82}));
stripPanel.position.set(0,-2.3,1.25); scene.add(stripPanel);
const KAA=0.02, SX0=-3.05;
const stripRows=[[],[]];
for(let r=0;r<2;r++){
  for(let i=0;i<4;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(1,0.2,0.2),
      new THREE.MeshStandardMaterial({color:EXCOL[i],roughness:.4,emissive:EXCOL[i],emissiveIntensity:r===0?0.15:0.05}));
    stripRows[r].push(m); scene.add(m);
  }
}
function layoutRow(r,idx){
  let x=SX0;
  for(let i=0;i<4;i++){
    const m=stripRows[r][i], on=idx.includes(i);
    m.visible=on;
    if(on){ m.scale.set(EXAA[i]*KAA,1,1); m.position.set(x+EXAA[i]*KAA/2,r===0?-1.87:-2.65,1.42); x+=EXAA[i]*KAA+0.08; }
  }
}
function retIdx(){ const r=[]; for(let i=0;i<4;i++) if(!(i===1&&skipE2)&&!(i===2&&skipE3)) r.push(i); return r; }
function retAA(){ return retIdx().reduce((s,i)=>s+EXAA[i],0); }

/* ---- 剪接体粒子池（3 组）---- */
function snrnp(r,c,e){
  return new THREE.Mesh(new THREE.SphereGeometry(r,18,14),
    new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e,roughness:.35}));
}
const u1Pool=[],u2Pool=[],u5Pool=[],seamPool=[];
for(let i=0;i<3;i++){
  const a=snrnp(0.24,0xffa94d,.45); a.visible=false; scene.add(a); u1Pool.push(a);
  const b=snrnp(0.21,0x69db7c,.4); b.visible=false; scene.add(b); u2Pool.push(b);
  const c=snrnp(0.32,0x9775fa,.4); c.visible=false; scene.add(c); u5Pool.push(c);
  const s=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.62,0.62),
    new THREE.MeshStandardMaterial({color:0xffe8cc,emissive:0xffa94d,emissiveIntensity:1.4,transparent:true,opacity:.95}));
  s.visible=false; scene.add(s); seamPool.push(s);
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
let groups=[], skipE2=false, skipE3=false;
const exonInGroup=[false,false,false,false];
addLabel(()=>L('5′ 帽子','5′ cap'),new THREE.Vector3(0,0.5,0),'o',()=>true,capMesh);
addLabel(()=>L('poly-A 尾','poly-A tail'),new THREE.Vector3(0.35,0.5,0),'b',()=>true,polyG);
for(let i=0;i<4;i++){
  addLabel(()=>`${L('外显子','Exon')} E${i+1} · ${EXAA[i]} aa`,
    new THREE.Vector3(0,0.62,0), i%2?'g':'b', ()=>true, exonMeshes[i]);
}
for(let i=0;i<3;i++){
  addLabel(()=>`${L('内含子','Intron')} I${i+1}`,
    new THREE.Vector3(0,0.34,0),'',()=>i<groups.length&&(T-groups[i].S)>0.2&&(T-groups[i].S)<6.0, intronMeshes[i]);
}
for(let i=0;i<3;i++){
  addLabel(()=>L('U1 · 认 5′ GU','U1 · 5′ GU'),new THREE.Vector3(0,0.42,0),'o',
    ()=>i<groups.length&&T>groups[i].S&&T<groups[i].S+6.8, u1Pool[i]);
  addLabel(()=>L('U2 · 认分支点 A','U2 · branch A'),new THREE.Vector3(0,-0.5,0),'g',
    ()=>i<groups.length&&T>groups[i].S&&T<groups[i].S+6.8, u2Pool[i]);
  addLabel(()=>L('U4/U6·U5','U4/U6.U5'),new THREE.Vector3(0,0.48,0),'b',
    ()=>i<groups.length&&T>groups[i].S+1.6&&T<groups[i].S+6.8, u5Pool[i]);
  addLabel(()=>L('接缝封合 · 磷酸二酯键','seam sealed · phosphodiester'),new THREE.Vector3(0,0.75,0),'o',
    ()=>i<groups.length&&T>groups[i].S+5.4&&T<groups[i].S+7.6, seamPool[i]);
}
const lblMature=addLabel(()=>L('成熟 mRNA → 输出核孔','Mature mRNA → export'),new THREE.Vector3(0,1.2,0),'g',()=>T>=total&&total>0);
addLabel(()=>`${L('组成型剪接 →','Constitutive →')} ${EXAA.reduce((a,b)=>a+b,0)} aa`,
  new THREE.Vector3(SX0,-1.45,1.6),'g');
addLabel(()=>`${L('当前剪接 →','Current splice →')} ${retAA()} aa`,
  new THREE.Vector3(SX0,-2.2,1.6),'o');

/* ---- 时间线状态 ---- */
let T=0, playing=true, speedK=1, labelsOn=true, total=0;
const GDUR=9; // 每个剪接组微时间线：0-2 组装 · 2-3.5 催化中心 · 3.5-5.5 套索 · 5.5-7 切割连接 · 7-9 释放

function buildGroups(){
  groups=[];
  exonInGroup.fill(false);
  const ret=retIdx();
  for(let k=0;k<ret.length-1;k++){
    const a=ret[k], b=ret[k+1];
    const dA=segsDef.find(s=>s.t==='e'&&s.i===a), dB=segsDef.find(s=>s.t==='e'&&s.i===b);
    const x0=dA.x0+dA.w, x1=dB.x0;
    const segs=[];
    for(const sd of segsDef)
      if(sd.x0>=x0-1e-6&&sd.x0+sd.w<=x1+1e-6){
        segs.push(sd.t==='e'?exonMeshes[sd.i]:intronMeshes[sd.i]);
        if(sd.t==='e') exonInGroup[sd.i]=true;
      }
    const len=x1-x0, xA=x1-clamp(0.3*len,0.24,0.55);
    const gi=groups.length;
    groups.push({S:gi*GDUR,x0,x1,xA,len,segs,
      u1:u1Pool[gi],u2:u2Pool[gi],u5:u5Pool[gi],seam:seamPool[gi]});
  }
  total=groups.length*GDUR+1.2;
}
function resetSim(){
  T=0;
  for(const m of exonMeshes){ m.visible=true; m.userData.mat.opacity=1; m.rotation.z=0; m.position.y=0; }
  for(const m of intronMeshes){ m.visible=true; m.userData.mat.opacity=1; m.position.y=0; }
  for(const p of [...u1Pool,...u2Pool,...u5Pool,...seamPool]) p.visible=false;
  polyG.position.x=0; layoutRow(0,[0,1,2,3]); layoutRow(1,retIdx());
  stripRows[1].forEach(m=>m.material.emissiveIntensity=0.05);
}
/* 全局左移量：所有已完成切割的左侧剪接组把右侧内容拉向左 */
function shiftOf(x){
  let s=0;
  for(const g of groups) if(g.x1<=x+1e-6) s+=g.len*smooth((T-g.S-5.5)/1.5);
  return s;
}
const wx=x=>x+shiftOf(x);

function update(){
  const pulse=1.1+0.8*Math.sin(simT*6);
  const mature=T>=total;
  const bob=mature?0.06*Math.sin(simT*2):0;
  /* 保留外显子每帧定位（被跳过的外显子归套索分支管） */
  for(let i=0;i<4;i++) if(!exonInGroup[i]){
    const m=exonMeshes[i];
    m.position.set(wx(m.userData.xc0),bob,0);
    m.rotation.z=0;
  }
  for(let g=0;g<groups.length;g++){
    const Gp=groups[g], t=T-Gp.S;
    const sh=shiftOf(Gp.x0);
    /* snRNP 球入场 */
    const show=t>0&&t<7.2;
    Gp.u1.visible=Gp.u2.visible=show;
    Gp.u5.visible=show&&t>1.6;
    if(show){
      const f=smooth(t/1.6);
      Gp.u1.position.set(Gp.x0+sh,lerp(2.8,0.85,f),0.12);
      Gp.u2.position.set(Gp.xA+sh,lerp(2.8,-0.85,f),-0.12);
      Gp.u5.position.set((Gp.x0+Gp.xA)/2+sh,lerp(3.4,1.7,smooth((t-1.6)/1.4)),0);
    }
    /* 套索弯曲 + 释放 */
    const bend=t<3.5?0:smooth((t-3.5)/2);
    const rel=smooth((t-5.5)/1.5);
    const a=(Gp.xA-Gp.x0)/2, La=Gp.xA-Gp.x0, cxp=Gp.x0+sh+a;
    const bb=(0.55+0.3*La)*bend;
    let acc=0;
    for(const m of Gp.segs){
      const w=m.userData.w, c=acc+w/2; acc+=w;
      const mat=m.userData.mat;
      if(t<=0||bend<=0){ // 静置在原始位置
        m.position.set(wx(m.userData.xc0),0,0); m.rotation.z=m.userData.rotOff;
        mat.opacity=1;
      }else{
        const dy=rel*1.5;
        if(c<La){ // 套索环：椭圆弧 π→0
          const s=clamp(c/La,0,1), th=Math.PI*(1-s);
          m.position.set(cxp+a*Math.cos(th),bb*Math.sin(th)+dy,0);
          m.rotation.z=Math.atan2(-bb*Math.cos(th),a*Math.sin(th))+m.userData.rotOff;
        }else{ // 尾段（分支点→3′位）原位漂移
          m.position.set(wx(m.userData.xc0),dy,0);
          m.rotation.z=m.userData.rotOff;
        }
        mat.opacity=1-rel;
      }
      if(t>8.4) m.visible=false;
    }
    /* 接缝发光 */
    Gp.seam.visible=t>5.3;
    if(Gp.seam.visible){
      Gp.seam.position.set(Gp.x0+sh,0,0);
      Gp.seam.material.emissiveIntensity=rel>=1?0.55:pulse;
    }
  }
  /* 成熟后整链轻微起伏 */
  polyG.position.x=shiftOf(X0+10.2);
  lblMature.position.y=1.2+bob*3;
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'前体 mRNA：外显子（编码区）与内含子（间隔区）交替排列',en:'Pre-mRNA: exons (coding) alternate with introns (spacers)'},
 {zh:'U1 snRNP 识别 5′ 剪接位点 GU；U2 识别分支点 A（2′-OH）',en:'U1 binds the 5′ GU site; U2 binds the branch-point A'},
 {zh:'U4/U6·U5 三聚 snRNP 加入，剪接体催化中心成形',en:'U4/U6.U5 tri-snRNP joins: the catalytic core forms'},
 {zh:'第一步转酯：分支点 A 的 2′-OH 攻击 5′ 位点，内含子弯成套索',en:'1st transesterification: 2′-OH attacks 5′ site, lariat forms'},
 {zh:'第二步转酯：5′ 外显子 3′-OH 攻击 3′ 位点，接缝封合',en:'2nd transesterification: exons ligate, the seam is sealed'},
 {zh:'套索释放降解；选择性剪接让一个基因拼出多种蛋白（人类 ~95% 基因）',en:'Lariat released; alternative splicing yields multiple proteins (~95% of human genes)'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{ gotoStep(i); });
    el.appendChild(li);
  });
  syncSteps();
}
function gotoStep(i){
  activeStep=i; syncSteps();
  const bounds=[0,0.3,2.4,3.8,5.8,Math.max(total,0.01)];
  T=bounds[i]; setPlaying(false); resetFadeState();
}
/* 点击步骤直接落位：把已过期的组直接置为完成态 */
function resetFadeState(){
  for(let g=0;g<groups.length;g++){
    const Gp=groups[g], t=T-Gp.S;
    const done=t>=8.4||T>=total;
    for(const m of Gp.segs){
      m.visible=!done; m.userData.mat.opacity=done?0:1;
      if(t<3.5&&!done){ m.position.set(wx(m.userData.xc0),0,0); m.rotation.z=m.userData.rotOff; }
    }
    Gp.u1.visible=Gp.u2.visible=Gp.u5.visible=!done&&t>0&&t<7.2;
    Gp.seam.visible=t>5.3&&!done;
  }
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}

/* ---- 读数 ---- */
function phaseName(){
  if(T<=0.01) return L('前体 mRNA','Pre-mRNA');
  if(T>=total) return L('成熟 mRNA','Mature mRNA');
  const g=Math.min(groups.length-1,Math.floor(T/GDUR)), t=T-g*GDUR;
  return t<2?L('剪接体组装','Assembly'):t<3.5?L('催化中心','Catalytic core')
    :t<5.5?L('套索形成','Lariat'):t<7?L('转酯连接','Ligation'):L('释放','Release');
}
function updateStats(){
  document.getElementById('stPhase').textContent=phaseName();
  const done=groups.filter(g=>T-g.S>=8.4||T>=total).length;
  document.getElementById('stIntron').innerHTML=done+'<small> /'+groups.length+'</small>';
  document.getElementById('stMrna').innerHTML=retAA()+'<small> aa</small>';
  document.getElementById('stProt').innerHTML=(retAA()*0.11).toFixed(1)+'<small> kDa</small>';
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  stripPanel.material.color.setHex(dark?0x161b22:0xdcd6cc);
  grid.material.opacity=dark?0.25:0.35;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}

/* ---- 交互 ---- */
function setPlaying(v){
  playing=v;
  document.getElementById('play').textContent=v?L('暂停','Pause'):L('运行','Run');
}
function onSkipChange(){
  buildGroups(); resetSim(); syncSkipBtns(); updateStats();
}
function syncSkipBtns(){
  document.getElementById('btnSkipE2').classList.toggle('on',skipE2);
  document.getElementById('btnSkipE3').classList.toggle('on',skipE3);
}
document.getElementById('btnSkipE2').addEventListener('click',()=>{skipE2=!skipE2;onSkipChange();});
document.getElementById('btnSkipE3').addEventListener('click',()=>{skipE3=!skipE3;onSkipChange();});
document.getElementById('btnSingle').addEventListener('click',()=>{
  // 单步：推进到下一个微相位边界
  const bs=[];
  for(let g=0;g<groups.length;g++) [0.05,2,3.5,5.5,8.6].forEach(b=>bs.push(g*GDUR+b));
  bs.push(total);
  const nx=bs.find(b=>b>T+0.02);
  if(nx!==undefined){ T=nx; setPlaying(false); resetFadeState(); }
});
document.getElementById('btnReset').addEventListener('click',()=>{resetSim();setPlaying(false);});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
});
document.getElementById('play').addEventListener('click',()=>setPlaying(!playing));
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
let simT=0;
const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing&&total>0){
    T=Math.min(T+dt*speedK,total+2);
    // 跟随时间线高亮步骤
    let st=0;
    if(T>0.01){
      if(T>=total) st=5;
      else{ const t=T-Math.floor(T/GDUR)*GDUR;
        st=T/GDUR>=groups.length?5:(t<2?1:t<3.5?2:t<5.5?3:4); }
    }
    if(st!==activeStep){ activeStep=st; syncSteps(); }
  }
  update();
  acc+=dt; if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis(); if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- URL 参数 & 启动 ---- */
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
const qsSpd=parseFloat(qs.get('speed'));
if(Number.isFinite(qsSpd)){speedK=clamp(qsSpd,0.2,2);document.getElementById('sSpd').value=speedK*100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';}
buildGroups(); resetSim(); applyTheme(); applyLang();
if(qs.get('pause')==='1') setPlaying(false);
start();
</script>
