<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深海热泉 · 无光世界的食物链</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#f783ac;
    --bg:#070b12; --panel:rgba(10,14,22,.86); --panel-border:rgba(255,255,255,.09);
    --text:#eef3f8; --text2:#93a7bc; --text3:#c6d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.5);
    --tool:rgba(10,14,22,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(10,14,22,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c2255c;
    --bg:#e6edf4; --panel:rgba(255,255,255,.9); --panel-border:rgba(15,25,40,.10);
    --text:#14202c; --text2:#56677a; --text3:#31404f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.88);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; } .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; } .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; } #stats .v.warn { color: #ffa94d; } #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); } .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); } .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(247,131,172,.6); background: rgba(247,131,172,.12); color: var(--text); } .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(194,37,92,.55); background: rgba(194,37,92,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; } .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(247,131,172,.10); border-color: rgba(247,131,172,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(194,37,92,.08); border-color: rgba(194,37,92,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffd0e0; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center; cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border); border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="深海热泉 · 无光世界的食物链" data-en="Hydrothermal Vents · A Food Chain Without Sunlight">深海热泉 · 无光世界的食物链</h1>
  <div class="sub" data-zh="海水沿裂隙下渗,在岩浆房顶被加热到 350–400 °C,把岩石里的金属与硫淋滤成 H₂S 一路上喷;冲进 2 °C 冷海水,几秒内骤冷析出微米级硫化物颗粒——黑烟不是烟,是矿物雾。2500 m 无光,细菌改用 CO₂+O₂+4H₂S→CH₂O+4S+3H₂O 固碳,硫化氢就是这里的太阳;管虫没有口和肠,干脆把化能菌养在体内。这里 25 MPa、2 °C,生物量却可达周围深海的万倍 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Seawater sinks through cracks, is baked to 350–400 °C on a magma-chamber roof, and rises loaded with leached metals and H₂S; slamming into 2 °C seawater it quenches within seconds, precipitating micron-scale sulfide grains — the black smoke is mineral fog, not soot. At 2,500 m with no sunlight, bacteria fix CO₂ via CO₂+O₂+4H₂S→CH₂O+4S+3H₂O, and hydrogen sulfide is their sun; tube worms have no mouth or gut and simply farm the microbes. At 25 MPa and 2 °C, life here packs up to ten thousand times the biomass of the surrounding deep sea · 3D interactive demo · drag to orbit · Space = run/pause">深海热泉 · 无光世界的食物链</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="喷口温度" data-en="Vent temp">喷口温度</span><span class="v" id="stVent">—</span>
  <span class="k" data-zh="环境水温" data-en="Ambient">环境水温</span><span class="v" id="stAmb">—</span>
  <span class="k" data-zh="深度" data-en="Depth">深度</span><span class="v" id="stDepth">—</span>
  <span class="k" data-zh="烟囱高度" data-en="Chimney">烟囱高度</span><span class="v" id="stChim">—</span>
  <span class="k" data-zh="H₂S 浓度(示意)" data-en="H₂S (approx.)">H₂S 浓度(示意)</span><span class="v" id="stH2S">—</span>
  <span class="k" data-zh="群落密度" data-en="Community">群落密度</span><span class="v" id="stComm">—</span>
</div>

<div id="plot">
  <h3 data-zh="温度–距离混合曲线:热液冲进 2 °C 海水骤冷,阴影为硫化物析出窗口,动点为一团流体" data-en="Temperature vs distance: vent fluid quenching into 2 °C seawater; shaded band = sulfide precipitation window; the dot is one parcel">温度–距离混合曲线:热液冲进 2 °C 海水骤冷,阴影为硫化物析出窗口,动点为一团流体</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="橙:热液与烟囱矿物" data-en="orange: vent fluid & chimney minerals">橙:热液与烟囱矿物</span> <span class="chip.r" data-zh="红:H₂S 能量与生物羽冠" data-en="red: H₂S energy & plumes">红:H₂S 能量与生物羽冠</span>
    <span class="chip.g" data-zh="绿:化能合成群落" data-en="green: the chemosynthetic community">绿:化能合成群落</span> <span class="chip.b" data-zh="蓝:冷海水回路与骤冷" data-en="blue: cold seawater loop & quench">蓝:冷海水回路与骤冷</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnVent" data-zh="熄灭热液" data-en="Extinguish vent">熄灭热液</button>
  </div>
  <div class="row"><label data-zh="热液温度" data-en="Vent temp">热液温度</label><input id="sVent" type="range" min="300" max="400" step="5" value="380"><span class="val" id="sVentVal">380 °C</span></div>
  <div class="row"><label data-zh="时间加速" data-en="Time lapse">时间加速</label><input id="sTime" type="range" min="1" max="200" step="1" value="20"><span class="val" id="sTimeVal">20 ×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label> <label><input id="tglPart" type="checkbox" checked> <span data-zh="粒子" data-en="Particles">粒子</span></label>
      <label><input id="tglLoop" type="checkbox" checked> <span data-zh="回路箭头" data-en="Loop arrows">回路箭头</span></label> <label><input id="tglLamp" type="checkbox" checked> <span data-zh="探索灯" data-en="Lamp">探索灯</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../photosynthesis-z-scheme/" data-zh="光合 Z 方案:有光世界的固碳" data-en="Z-scheme: carbon fixation with sunlight">光合 Z 方案:有光世界的固碳</a> <a href="../bioluminescence/" data-zh="生物发光:深海里的光语" data-en="bioluminescence: deep-sea light talk">生物发光:深海里的光语</a>
    <a href="../volcano-viscosity/" data-zh="岩浆黏度:热液的地质引擎" data-en="magma viscosity: the geological engine">岩浆黏度:热液的地质引擎</a> <a href="../ocean-conveyor/" data-zh="大洋传送带:另一场环流" data-en="ocean conveyor: another great loop">大洋传送带:另一场环流</a>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)); const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x070b12, 16, 52);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x070b12 : 0xd8e4ee);
  scene.fog.color = new THREE.Color(dark ? 0x070b12 : 0xd8e4ee);
  scene.fog.near = dark ? 16 : 20;
  scene.fog.far = dark ? 52 : 64;
  scene.environmentIntensity = dark ? 0.12 : 0.6;
  floorM.color.setHex(dark ? 0x1a1f26 : 0x9dabb9); floorM.opacity = dark ? 0.86 : 0.94;
  rockM.color.setHex(dark ? 0x232830 : 0x8494a4); baseM.color.setHex(dark ? 0x33383f : 0x77828e);
  sulfM.color.setHex(dark ? 0x3a3f46 : 0x5a636e); anhyM.color.setHex(dark ? 0x707a80 : 0xa9b5bf);
  crackM.color.setHex(dark ? 0x0f4a66 : 0x0b5e86); crackM.opacity = dark ? 0.8 : 0.5;
  magmaM.color.setHex(dark ? 0xff6a2a : 0xd94f16); magmaM.opacity = dark ? 0.5 : 0.38;
  coldTubeM.color.setHex(dark ? 0x4aa8d8 : 0x1878b0); hotTubeM.color.setHex(dark ? 0xff7a3a : 0xc4551f);
  coldPtsM.color.setHex(dark ? 0x7fd0f2 : 0x1878b0); hotPtsM.color.setHex(dark ? 0xffa86a : 0xc4551f);
  wormTubeM.color.setHex(dark ? 0xe9e2d4 : 0xcfc6b4); wormPlumeM.color.setHex(dark ? 0xc43b3b : 0xa82828);
  clamM.color.setHex(dark ? 0xd9d0c0 : 0xb6ab96); shrimpM.color.setHex(dark ? 0xd8b4a0 : 0xb08a78);
  matM.color.setHex(dark ? 0xdfe6df : 0xbfccbf); matGlowM.color.setHex(dark ? 0xaef0cc : 0x187a3a);
  snowM.color.setHex(dark ? 0x8fa0b5 : 0x5f7286); plumeM.opacity = dark ? 0.55 : 0.62;
  C_HOT.setHex(dark ? 0x554637 : 0x40352a);
  C_SMOKE.setHex(dark ? 0x4b535f : 0x39414c);
  C_FALL.setHex(dark ? 0x97a1ac : 0x5e6873);
  glowM.color.setHex(dark ? 0xffa257 : 0xe8742a);
  lampConeM.opacity = dark ? 0.05 : 0.025;
  hemi.intensity = dark ? 0.3 : 1.0; hemi.color.setHex(dark ? 0x33465e : 0xe8f1fa);
  hemi.groundColor.setHex(dark ? 0x05070c : 0x93a5b5); keyL.intensity = dark ? 0.1 : 0.35;
  applyLamp();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('深海热泉 · 无光世界的食物链', 'Hydrothermal Vents · A Food Chain Without Sunlight');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);

function spawnPlume() {

function stepPlume(dt) {
  if (partOn && ventAlive) {
    spawnAcc += dt * (15 + (ventT - 300) * 0.12);
    while (spawnAcc > 1 && plumes.length < P_MAX) { spawnPlume(); spawnAcc -= 1; }
  }
  for (let i = plumes.length - 1; i >= 0; i--) {
    const p = plumes[i];
    p.age += dt;
    const lT = 2 + (ventT - 2) * Math.exp(-p.age * 0.9);   // 团块局部温度
    if (p.st === 0) {                                      // 浮力段:沿轴上升
      const tvy = plumeRise() * (0.75 + 0.25 * Math.sin(simT * 4 + p.ph));
      p.vy += (tvy - p.vy) * dt * 2;
      p.vx += -p.x * 0.2 * dt; p.vz += -p.z * 0.2 * dt;
      if (lT < 95) {                                       // 失浮:绽放,径向散开
        p.st = 1; p.bt = p.age;
        const rr = Math.hypot(p.x, p.z) + 0.001, k = 0.25 + Math.random() * 0.35;
        p.vx = (p.x / rr) * k + (Math.random() - 0.5) * 0.1;
        p.vz = (p.z / rr) * k + (Math.random() - 0.5) * 0.1;
        p.vy *= 0.3;
      }
    } else if (p.st === 1) {                               // 翻滚扩散段
      p.vy *= (1 - dt * 1.2);
      p.vx += 0.18 * Math.sin(simT * 3.1 + p.ph) * dt;
      p.vz += 0.18 * Math.cos(simT * 2.7 + p.ph) * dt;
      if (p.age > p.bt + 1.3) { p.st = 2; p.vy = -0.1; }
    } else {                                               // 硫化物析出:缓缓沉落
      p.vy += (-0.16 - p.vy) * dt * 1.5;
      p.vx *= (1 - dt * 0.8); p.vz *= (1 - dt * 0.8);
      p.x += 0.06 * dt;
      if (p.y < 0.06) { plumes.splice(i, 1); continue; }
    }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.age > 16 || Math.hypot(p.x, p.z) > 7.5) { plumes.splice(i, 1); continue; }
  }
  for (let i = 0; i < P_MAX; i++) {
    if (i < plumes.length) {
      const p = plumes[i];
      const c = p.st === 0 ? C_HOT : (p.st === 1 ? C_SMOKE : C_FALL);
      const v = 0.85 + 0.3 * ((p.ph * 7.3) % 1);
      pv.copy(c).multiplyScalar(v);
      pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.y; pPos[i * 3 + 2] = p.z;

}

function buildSteps() {
  const el = document.getElementById('steps');

/* ================= 绘图:温度–距离骤冷曲线 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#93a7bc';
  const acc = css.getPropertyValue('--acc').trim() || '#f783ac';
  const padL = 46, padR = 14, padT = 16, padB = 26;
  const xOf = d => padL + d / 250 * (W - padL - padR);
  const yOf = t => (H - padB) - clamp(t, 0, 420) / 420 * (H - padT - padB);
  ctx.font = '12px system-ui';
  /* 环境水温线 */
  ctx.strokeStyle = 'rgba(120,160,200,.5)'; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(padL, yOf(2)); ctx.lineTo(W - padR, yOf(2)); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle = cTxt;
  ctx.fillText(L('2 °C 环境海水', '2 °C ambient'), padL + 8, yOf(2) - 6);
  /* 硫化物析出窗口(喷口温度→100 °C 区段) */
  const x100 = Math.min(250, xAtT(100)), bw = Math.max(3, xOf(x100) - padL);
  ctx.fillStyle = 'rgba(247,131,172,.16)';
  ctx.fillRect(padL, yOf(ventT), bw, yOf(100) - yOf(ventT));
  ctx.fillStyle = '#e8896a';
  ctx.fillText(L('硫化物析出窗口', 'sulfide window'), padL + bw / 2 - 52, yOf(100) + 15);
  /* 坐标 */
  ctx.strokeStyle = 'rgba(128,150,170,.25)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(0)); ctx.lineTo(W - padR, yOf(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText('400°C', 4, yOf(400) + 4); ctx.fillText('200°C', 4, yOf(200) + 4); ctx.fillText('100°C', 4, yOf(100) + 4);
  ctx.fillText('0 m', padL - 6, H - padB + 16); ctx.fillText('100', xOf(100) - 10, H - padB + 16); ctx.fillText('200 m', xOf(200) - 10, H - padB + 16);
  /* 骤冷曲线 */
  ctx.strokeStyle = acc; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let d = 0; d <= 250; d += 2.5) {
    const px = xOf(d), py = yOf(Tdist(d));
    d <= 0.01 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.lineWidth = 1;
  ctx.fillStyle = acc;
  ctx.fillText(`${ventT.toFixed(0)}°C`, padL + 4, yOf(ventT) - 6);
  /* 一团流体的动点 */
  const xd = (simT * 20) % 250;
  ctx.fillStyle = '#ff8787';
  ctx.beginPath();
  ctx.arc(xOf(xd), yOf(Tdist(xd)), 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillText(L('一团热液', 'a parcel'), xOf(xd) + 8, yOf(Tdist(xd)) - 8);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, accF = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  /* 存活度平滑 & 群落密度 */
  const target = ventAlive ? 1 : 0;
  ventFade += (target - ventFade) * Math.min(1, dt * 0.7);
  if (dt > 0) {
    simT += dt;
    if (ventAlive) {
      const yr = dt * timeAcc * 0.006;                    // 时间加速:年/秒
      simYears += yr;
      chimneyM = Math.min((1 + SEG * SEG_H) * UNITS, chimneyM + growRate() * yr);
      density = Math.min(100, density + dt * 0.9);
    } else {
      density = Math.max(4, density - dt * 2.2);
    }
    stepPlume(dt);
    stepSnow(dt);
    stepLoopFlow(dt);
    updateChimney();
  }
  /* 烟囱辉光与喷口光 */
  const gi = glowI() * ventFade;
  const pulse = 1 + 0.15 * Math.sin(simT * 6);
  glowO.scale.setScalar(pulse); glowO.material.opacity = 0.12 + 0.55 * gi;
  ventLight.intensity = (0.9 + 0.25 * Math.sin(simT * 5.3)) * gi * 1.6;
  miniGlow.scale.setScalar(0.8 + 0.2 * Math.sin(simT * 4.2 + 1)); miniGlow.material.opacity = 0.1 + 0.3 * gi;
  /* 群落动态 */
  C_RED.lerpColors(C_PLUME_R, C_GRAY, 1 - ventFade);
  C_TUB.lerpColors(C_TUBE, C_TUBE_D, 1 - ventFade);
  wormPlumeM.color.copy(C_RED); wormTubeM.color.copy(C_TUB);
  for (const w of worms) {
    w.g.rotation.z = 0.055 * Math.sin(simT * 1.15 + w.ph) * ventFade;
    w.g.rotation.x = 0.05 * Math.cos(simT * 0.9 + w.ph) * ventFade;
    w.pl.scale.setScalar(0.06 + 0.94 * ventFade);
  }
  for (const c of clams) {
    const open = 0.06 + 0.5 * (0.5 + 0.5 * Math.sin(simT * 0.35 + c.ph)) * ventFade;
    c.top.rotation.x = -open;
  }
  for (const s of shrimps) {
    const flee = 1 + (1 - ventFade) * 2.4;
    const a = simT * s.sp + s.ph;
    s.m.position.set(
      s.cx + Math.cos(a) * s.rad * flee,
      s.y0 + 0.08 * Math.sin(simT * 2 + s.ph),
      s.cz + Math.sin(a * 1.3) * s.rad * flee);
    const k = clamp(ventFade * 1.6 - 0.2, 0.001, 1);
    s.m.scale.set(0.8 * k, 0.34 * k, 0.34 * k);
  }
  matM.emissiveIntensity = 0.08 + 0.3 * ventFade * (0.5 + 0.5 * Math.sin(simT * 2.4)); matGlowM.opacity = ventFade * (0.1 + 0.08 * Math.sin(simT * 2.4));
  /* 化能合成标签呼吸点亮 */
  lblChemo.element.style.opacity = (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(simT * 2.6))) * ventFade;
  /* 标签跟随烟囱生长 */
  lblVent.position.set(0.55, unitsH() + 0.5, 0.25);
  lblSmoke.position.set(1.45, unitsH() + 2.3, 0.5);
  lblChimney.position.set(1.15, Math.max(0.9, unitsH() * 0.55), 0.6);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; drawPlot(); }
  accF += dt0;
  if (accF > 0.6) { accF = 0; updateFormula(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on && r !== lblChemo) r.o.element.textContent = r.text();
