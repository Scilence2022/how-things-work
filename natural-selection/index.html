<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>自然选择 · 环境替种群做筛选</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa8a8;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#c92a2a;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="自然选择 · 环境替种群做筛选" data-en="Natural Selection · the environment does the filtering">自然选择 · 环境替种群做筛选</h1>
  <div class="sub" data-zh="变异是随机的,筛选不是:与树皮反差大的椒花蛾先被鸟吃掉,幸存者把体色整体推移;树皮从地衣白变成烟熏黑,选择方向当场反转——关掉捕食者,频率就只剩随机漂变 · 拖动旋转 / 空格运行/暂停" data-en="Mutation is random, selection is not: peppered moths contrasting most with the bark get eaten first, and survivors shift the population wholesale; when soot turns the bark dark, selection reverses on the spot — remove the bird and only drift remains · drag to orbit / Space = run/pause">变异是随机的,筛选不是:与树皮反差大的椒花蛾先被鸟吃掉,幸存者把体色整体推移;树皮从地衣白变成烟熏黑,选择方向当场反转——关掉捕食者,频率就只剩随机漂变 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="世代" data-en="Generation">世代</span><span class="v" id="stGen">0</span>
  <span class="k" data-zh="平均体色" data-en="Mean color">平均体色</span><span class="v" id="stMean">—</span>
  <span class="k" data-zh="深色基因频率" data-en="Dark allele">深色基因频率</span><span class="v" id="stFreq">—</span>
  <span class="k" data-zh="表型方差" data-en="Variance">表型方差</span><span class="v" id="stVar">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bLight" data-zh="地衣白树皮" data-en="Lichen bark">地衣白树皮</button>
    <button class="abtn" id="bDark" data-zh="工业黑化" data-en="Industrial soot">工业黑化</button>
    <button class="abtn" id="bNone" data-zh="无捕食对照" data-en="No predator">无捕食对照</button>
  </div>
  <div class="row">
    <label data-zh="捕食强度" data-en="Predation">捕食强度</label>
    <input id="sPred" type="range" min="0" max="1" step="0.05" value="0.7">
    <span class="val" id="sPredVal">0.70</span>
  </div>
  <div class="row">
    <label data-zh="突变率 σ" data-en="Mutation σ">突变率 σ</label>
    <input id="sMut" type="range" min="0" max="0.08" step="0.005" value="0.02">
    <span class="val" id="sMutVal">0.020</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglBird" type="checkbox" checked> <span data-zh="捕食者" data-en="Predator">捕食者</span></label>
      <label><input id="tglHist" type="checkbox" checked> <span data-zh="体色直方图" data-en="Histogram">体色直方图</span></label>
      <label><input id="tglCurve" type="checkbox" checked> <span data-zh="频率曲线" data-en="Freq. curve">频率曲线</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../predator-prey/" data-zh="捕食者与猎物" data-en="Predator–prey">捕食者与猎物</a>
    <a href="../genetic-algorithm/" data-zh="遗传算法" data-en="Genetic algorithm">遗传算法</a>
    <a href="../antibiotic-resistance/" data-zh="抗生素耐药性" data-en="Antibiotic resistance">抗生素耐药性</a>
    <a href="../monte-carlo/" data-zh="蒙特卡洛" data-en="Monte Carlo">蒙特卡洛</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,90);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-7.5,5.2,13.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.6,2.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 场景:树干 + 地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;scene.add(ground);
/* 主树干:斜立圆柱,蛾子停在表面 */
const trunkG=new THREE.Group();trunkG.rotation.z=0.10;trunkG.rotation.y=0.35;scene.add(trunkG);
const barkM=new THREE.MeshStandardMaterial({color:0x9a917f,roughness:0.9});
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.45,11,28),barkM);
trunk.position.y=5.2;trunkG.add(trunk);
/* 两根分枝 */
const br1=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.42,4.6,14),barkM);
br1.position.set(1.15,8.6,0);br1.rotation.z=-0.7;trunkG.add(br1);
const br2=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,3.6,12),barkM);
br2.position.set(-1.2,9.3,0.1);br2.rotation.z=0.75;trunkG.add(br2);
/* 树冠:几团深绿球,给场景一点层次 */
const leafM=new THREE.MeshStandardMaterial({color:0x2c4a2e,roughness:0.95});
[[2.2,10.6,-0.4,2.1],[-1.9,10.9,0.5,1.8],[0.4,11.8,0.9,1.6],[-0.6,9.6,-1.6,1.4]].forEach(p=>{
  const s=new THREE.Mesh(new THREE.IcosahedronGeometry(p[3],1),leafM);
  s.position.set(p[0],p[1],p[2]);s.scale.y=0.75;scene.add(s);
});

/* ---- 蛾群:InstancedMesh,体色即表型 ---- */
const POP=60;
const mothGeo=new THREE.PlaneGeometry(0.34,0.22);
const mothM=new THREE.MeshStandardMaterial({roughness:0.7,side:THREE.DoubleSide});
const moths=new THREE.InstancedMesh(mothGeo,mothM,POP);
moths.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(POP*3),3);
scene.add(moths);
/* 每只蛾:树干表面参数位 (角度θ, 高度y) + 当前表型 c(0=白 1=黑) */
const mothsData=[];
function trunkPoint(th,y){  // 树干局部坐标(半径随高度收细,随 trunkG 旋转)
  const r=1.45-((y+0.3)/11)*0.40+0.05+0.02*Math.sin(y*2.1+th*3.0);
  return new THREE.Vector3(r*Math.cos(th),y,r*Math.sin(th));
}
function resetPop(mean=0.5,sd=0.13){
  mothsData.length=0;
  for(let i=0;i<POP;i++){
    let c=clamp(mean+(Math.random()+Math.random()+Math.random()-1.5)*sd*2,0.01,0.99);
    mothsData.push({th:Math.random()*Math.PI*2,y:2.2+Math.random()*7.0,c,
      wob:Math.random()*6.28});
  }
}
const cWhite=new THREE.Color(0xf3efe4),cBlack=new THREE.Color(0x2a2a30),tmpC=new THREE.Color();
function mothColor(c){return tmpC.copy(cWhite).lerp(cBlack,c);}
const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),
      v3=new THREE.Vector3(),s3=new THREE.Vector3(1,1,1);
function placeMoths(t){
  for(let i=0;i<POP;i++){
    const m=mothsData[i];
    const p=trunkPoint(m.th,m.y);
    v3.copy(p);trunkG.localToWorld(v3);
    e.set(Math.PI/2*0.92+0.18*Math.sin(m.wob+t*1.3),m.th+Math.PI/2+t*0.2,0.12*Math.cos(t*0.9+m.wob));
    q.setFromEuler(e);
    s3.setScalar(1);
    m4.compose(v3,q,s3);
    moths.setMatrixAt(i,m4);
    tmpC.copy(cWhite).lerp(cBlack,m.c);
    moths.setColorAt(i,tmpC);
  }
  moths.instanceMatrix.needsUpdate=true;
  if(moths.instanceColor)moths.instanceColor.needsUpdate=true;
}

/* ---- 捕食者:一只俯冲的鸟 ---- */
const birdG=new THREE.Group();scene.add(birdG);
const birdBody=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.62,8),
  new THREE.MeshStandardMaterial({color:0x6b5a44,roughness:0.6}));
birdBody.rotation.x=Math.PI/2;birdG.add(birdBody);
const wingM=new THREE.MeshStandardMaterial({color:0x8a765a,roughness:0.6,side:THREE.DoubleSide});
const wl=new THREE.Mesh(new THREE.PlaneGeometry(0.55,0.22),wingM);wl.position.set(-0.3,0,0);birdG.add(wl);
const wr=wl.clone();wr.position.x=0.3;birdG.add(wr);
birdG.visible=false;
/* 捕食状态机:idle → dive(扑向目标) → strike → back */
let bird={state:'off',t:0,target:-1,from:new THREE.Vector3(),to:new THREE.Vector3()};

/* ---- 直方图板:12 档体色分布 ---- */
function makeBoard(w,h,pos,rotY){
  const g=new THREE.Group();g.position.copy(pos);g.rotation.y=rotY;
  const bd=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.06),
    new THREE.MeshStandardMaterial({color:0x070b10,roughness:0.75,transparent:true,opacity:0.92}));
  g.add(bd);scene.add(g);return g;
}
const histBoard=makeBoard(4.6,2.3,new THREE.Vector3(5.6,4.6,-1.2),-0.5);
const BINS=12;
const histGeo=new THREE.BoxGeometry(0.3,1,0.12);
const histM=new THREE.MeshBasicMaterial({transparent:true,opacity:0.95});
const histBars=new THREE.InstancedMesh(histGeo,histM,BINS);
histBoard.add(histBars);
const histHeights=new Float32Array(BINS),histTargets=new Float32Array(BINS);
function layoutHist(){
  for(let i=0;i<BINS;i++){
    const x=-1.95+i*0.355;
    const h=Math.max(0.02,histHeights[i]*1.9);
    m4.makeScale(1,h,1);m4.setPosition(x,-0.95+h/2,0.06);
    histBars.setMatrixAt(i,m4);
    tmpC.copy(cWhite).lerp(cBlack,(i+0.5)/BINS);
    histBars.setColorAt(i,tmpC);
  }
  histBars.instanceMatrix.needsUpdate=true;
  if(histBars.instanceColor)histBars.instanceColor.needsUpdate=true;
}
/* 直方图坐标轴刻度线 */
(function(){
  const gm=new THREE.LineBasicMaterial({color:0x3a4656});
  const pts=[new THREE.Vector3(-2.1,-0.95,0.06),new THREE.Vector3(-2.1,0.95,0.06),new THREE.Vector3(2.1,0.95,0.06)];
  histBoard.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gm));
})();

/* ---- 频率曲线板:深色基因频率随世代 ---- */
const curveBoard=makeBoard(4.6,2.3,new THREE.Vector3(-4.4,4.9,-2.6),0.55);
curveBoard.visible=true;
const CURVE_N=70;
const freqHist=new Float32Array(CURVE_N).fill(0.5);
let freqHead=0,freqCount=0;
const curveLine=new THREE.Line(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({color:0xffa8a8}));
curveLine.position.z=0.06;curveBoard.add(curveLine);
const midLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(-2.1,0,0.055),new THREE.Vector3(2.1,0,0.055)]),
  new THREE.LineBasicMaterial({color:0x3a4656}));
curveBoard.add(midLine);
function drawCurve(){
  const pts=[];
  for(let j=0;j<freqCount;j++){
    const idx=((freqHead-freqCount+j)%CURVE_N+CURVE_N)%CURVE_N;
    pts.push(new THREE.Vector3(-2.0+j/(CURVE_N-1)*4.0,(freqHist[idx]-0.5)*1.8,0.06));
  }
  curveLine.geometry.setFromPoints(pts);
}

/* ---- 背景切换:地衣白 ⇄ 烟熏黑 ---- */
const envLight={bg:new THREE.Color(0x39434e),fog:0x39434e,bark:0x9a917f,ground:0x232830};
const envDark ={bg:new THREE.Color(0x17181c),fog:0x17181c,bark:0x3d3a37,ground:0x14161a};
let bgMix=0,bgTarget=0;  // 0=浅 1=深
function applyEnv(){
  const e1=envLight,e2=envDark,t=bgMix;
  scene.background=new THREE.Color().copy(e1.bg).lerp(e2.bg,t);
  scene.fog.color.copy(scene.background);
  barkM.color.setHex(e1.bark).lerp(new THREE.Color(e2.bark),t);
  groundM.color.setHex(e1.ground).lerp(new THREE.Color(e2.ground),t);
}
function setBark(dark){
  bgTarget=dark?1:0;
  document.getElementById('bLight').classList.toggle('on',!dark);
  document.getElementById('bDark').classList.toggle('on',dark);
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`树皮反差基准 B = ${bgTarget?0.85:0.15}`,`Bark reference B = ${bgTarget?0.85:0.15}`),
  new THREE.Vector3(0,10.6,0),'b');
addLabel(()=>L('捕食者先吃反差最大的','the bird eats the most contrasty first'),
  new THREE.Vector3(2.6,8.9,0.8),'r',()=>birdOn);
addLabel(()=>L('体色直方图:每代整体挪动','color histogram: the whole dist. moves'),
  new THREE.Vector3(5.6,6.0,-1.2),'y',()=>tglHistEl.checked);
addLabel(()=>L('深色基因频率曲线','dark-allele frequency curve'),
  new THREE.Vector3(-4.4,6.3,-2.6),'g',()=>tglCurveEl.checked);

/* ---- 状态与遗传模型 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let predation=0.7,mutRate=0.02,generation=0,birdOn=true;
let genTimer=0;const GEN_PERIOD=3.2;
let meanC=0.5,varC=0.02,freqDark=0.5;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

function statsNow(){
  let s=0,s2=0,dark=0;
  for(const m of mothsData){s+=m.c;s2+=m.c*m.c;if(m.c>0.5)dark++;}
  meanC=s/POP;varC=Math.max(1e-4,s2/POP-meanC*meanC);
  freqDark=dark/POP;
}
function offspring(c){
  let nc=c+(Math.random()+Math.random()+Math.random()-1.5)*mutRate*1.6;
  return clamp(nc,0.01,0.99);
}
/* 一代:先按反差捕杀 k 只,再由幸存者按适应度加权重生 */
function runGeneration(){
  statsNow();
  const B=bgTarget?0.85:0.15;
  const kills=Math.round(POP*0.30*predation*(birdOn?1:0));
  const order=[...mothsData].sort((a,b)=>Math.abs(b.c-B)-Math.abs(a.c-B));
  const killed=new Set();
  for(let i=0;i<kills;i++)killed.add(order[i]);
  for(const m of mothsData)if(killed.has(m)){}
  /* 亲本池:幸存者,权重=适应度(反差小权重高) */
  const parents=[],w=[];
  for(const m of mothsData)if(!killed.has(m)){parents.push(m);w.push(1/(0.06+Math.abs(m.c-B)));}
  let wsum=0;for(const x of w)wsum+=x;
  /* 被吃掉的格子由后代补齐 */
  let ki=0;
  for(let i=0;i<POP&&ki<POP;i++){
    const m=mothsData[i];
    if(killed.has(m)){
      let r=Math.random()*wsum,pi=0;
      while(pi<w.length-1&&r>w[pi]){r-=w[pi];pi++;}
      m.c=offspring(parents[pi].c);m.dead=0;
      ki++;
    }
  }
  generation++;
  statsNow();
  freqHist[freqHead]=freqDark;freqHead=(freqHead+1)%CURVE_N;
  freqCount=Math.min(CURVE_N,freqCount+1);
  /* 直方图目标 */
  histTargets.fill(0);
  for(const m of mothsData){const b=Math.min(BINS-1,Math.floor(m.c*BINS));histTargets[b]++;}
  for(let i=0;i<BINS;i++)histTargets[i]/=POP;
  drawCurve();
  /* 鸟出动动画 */
  if(birdOn&&kills>0&&bird.state==='off'){
    bird.state='dive';bird.t=0;
    bird.from.set(4.5,9.5,4.0);
    const tgt=order[0];const p=trunkPoint(tgt.th,tgt.y);trunkG.localToWorld(p);
    bird.to.copy(p);bird.target=mothsData.indexOf(tgt);
    birdG.visible=true;
  }
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'变异随机:蛾群体色连续分布,中心在灰',en:'Random variation: colors spread continuously around gray',
  act(){setBark(false);setPred(0.35);setMut(0.02);resetPop(0.5,0.13);generation=0;freqCount=0;statsNow();syncHist(true);}},
 {zh:'捕食开始:鸟专挑与树皮反差大的个体',en:'Predation: the bird picks the most contrasting moths',
  act(){setBark(false);setPred(0.7);setMut(0.02);}},
 {zh:'一代代过去:频率向适应值偏移,直方图挪动',en:'Generations pass: frequencies shift toward fitness',
  act(){setBark(false);setPred(0.8);setMut(0.02);fastForward(10);}},
 {zh:'工业黑化:烟熏把树皮染黑,B 从 0.15 → 0.85',en:'Industrial soot: bark darkens, B jumps 0.15 → 0.85',
  act(){setBark(true);setPred(0.8);}},
 {zh:'选择反转:浅色个体成了显眼目标,种群回摆',en:'Selection reverses: pale moths stand out, population swings back',
  act(){setBark(true);setPred(0.85);fastForward(30);}},
 {zh:'关掉捕食者:没有筛子,频率只漂不移',en:'Predator off: no sieve, frequencies only drift',
  act(){setPred(0);birdOn=false;document.getElementById('tglBird').checked=false;}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  activeStep=i;
  if(i!==5){birdOn=true;document.getElementById('tglBird').checked=true;}
  STEPS[i].act();
  syncSteps();
}
function fastForward(n){
  for(let i=0;i<n;i++)runGenerationFast();
}
/* 快进版:不做鸟动画,只算数 */
function runGenerationFast(){
  statsNow();
  const B=bgTarget?0.85:0.15;
  const kills=Math.round(POP*0.30*predation*(birdOn?1:0));
  const order=[...mothsData].sort((a,b)=>Math.abs(b.c-B)-Math.abs(a.c-B));
  const killed=new Set(order.slice(0,kills));
  const parents=[],w=[];
  for(const m of mothsData)if(!killed.has(m)){parents.push(m);w.push(1/(0.06+Math.abs(m.c-B)));}
  let wsum=0;for(const x of w)wsum+=x;
  let ki=0;
  for(let i=0;i<POP;i++){
    const m=mothsData[i];
    if(killed.has(m)){
      let r=Math.random()*wsum,pi=0;
      while(pi<w.length-1&&r>w[pi]){r-=w[pi];pi++;}
      m.c=offspring(parents[pi].c);
    }
  }
  generation++;
  statsNow();
  freqHist[freqHead]=freqDark;freqHead=(freqHead+1)%CURVE_N;
  freqCount=Math.min(CURVE_N,freqCount+1);
  for(const m of mothsData){const b=Math.min(BINS-1,Math.floor(m.c*BINS));histTargets[b]++;}
  for(let i=0;i<BINS;i++)histTargets[i]/=POP;
  drawCurve();
}
function syncHist(instant){
  for(let i=0;i<BINS;i++)histTargets[i]=0;
  for(const m of mothsData){const b=Math.min(BINS-1,Math.floor(m.c*BINS));histTargets[b]++;}
  for(let i=0;i<BINS;i++)histTargets[i]/=POP;
  if(instant)for(let i=0;i<BINS;i++)histHeights[i]=histTargets[i];
  drawCurve();
}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stGen').textContent=generation;
  const me=document.getElementById('stMean');
  me.innerHTML=meanC.toFixed(2);
  me.style.color=mothColor(meanC).getStyle();
  document.getElementById('stFreq').innerHTML=(freqDark*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stVar').textContent=varC.toFixed(3);
}

/* ---- 控件 ---- */
function setPred(v){predation=v;document.getElementById('sPred').value=v;
  document.getElementById('sPredVal').textContent=v.toFixed(2);}
function setMut(v){mutRate=v;document.getElementById('sMut').value=v;
  document.getElementById('sMutVal').textContent=v.toFixed(3);}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bLight').addEventListener('click',()=>{setBark(false);});
document.getElementById('bDark').addEventListener('click',()=>{setBark(true);});
document.getElementById('bNone').addEventListener('click',()=>{
  setPred(0);birdOn=false;document.getElementById('tglBird').checked=false;});
document.getElementById('sPred').addEventListener('input',e=>setPred(+e.target.value));
document.getElementById('sMut').addEventListener('input',e=>setMut(+e.target.value));
document.getElementById('tglBird').addEventListener('change',e=>{birdOn=e.target.checked;
  if(!birdOn){bird.state='off';birdG.visible=false;}});
document.getElementById('tglHist').addEventListener('change',e=>{histBoard.visible=e.target.checked;});
document.getElementById('tglCurve').addEventListener('change',e=>{curveBoard.visible=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  applyEnv();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0);
  simT+=dts;
  /* 背景过渡 */
  if(Math.abs(bgMix-bgTarget)>0.001){
    bgMix+=Math.sign(bgTarget-bgMix)*Math.min(dt*1.2,Math.abs(bgTarget-bgMix));
    applyEnv();
  }
  /* 代际计时 */
  genTimer+=dts;
  if(genTimer>=GEN_PERIOD){genTimer=0;runGeneration();}
  /* 蛾群摆放 + 微颤 */
  placeMoths(simT);
  /* 鸟状态机 */
  if(bird.state==='dive'){
    bird.t+=dt*1.6;
    const p=bird.from.clone().lerp(bird.to,Math.min(1,bird.t));
    p.y+=Math.sin(bird.t*Math.PI)*1.2*(1-bird.t);
    birdG.position.copy(p);
    birdG.lookAt(bird.to);
    const tw=Math.sin(bird.t*30)*0.5;
    wl.rotation.z=tw;wr.rotation.z=-tw;
    if(bird.t>=1){bird.state='back';bird.t=0;}
  }else if(bird.state==='back'){
    bird.t+=dt*1.2;
    const p=bird.to.clone().lerp(bird.from,Math.min(1,bird.t));
    p.y+=bird.t*1.5;
    birdG.position.copy(p);
    const tw=Math.sin(simT*18)*0.4;
    wl.rotation.z=tw;wr.rotation.z=-tw;
    if(bird.t>=1){bird.state='off';birdG.visible=false;}
  }
  /* 直方图缓动 */
  let dirty=false;
  for(let i=0;i<BINS;i++){
    const d=histTargets[i]-histHeights[i];
    if(Math.abs(d)>0.001){histHeights[i]+=d*Math.min(1,dt*3);dirty=true;}
  }
  if(dirty)layoutHist();
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;
    statsNow();updateStats();
  }
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const tglHistEl=document.getElementById('tglHist');
const tglCurveEl=document.getElementById('tglCurve');
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();applyEnv();buildSteps();
resetPop(0.5,0.13);statsNow();syncHist(true);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
