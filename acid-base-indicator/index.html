<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>酸碱指示剂 · 分子自己的平衡替你量 pH</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#da77f2;
    --bg:#14101b;--panel:rgba(20,16,27,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f4f0fa;--text2:#a89ac0;--text3:#d0c6e2;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(20,16,27,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(20,16,27,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#9c36b5;
    --bg:#f2edf5;--panel:rgba(255,255,255,.88);--panel-border:rgba(40,15,60,.10);
    --text:#231631;--text2:#6f5f83;--text3:#3d2f4f;
    --hover:rgba(40,15,60,.05);--shadow:0 8px 26px rgba(60,30,90,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(40,15,60,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(218,119,242,.6);background:rgba(218,119,242,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(156,54,181,.55);background:rgba(156,54,181,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(218,119,242,.10);border-color:rgba(218,119,242,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(156,54,181,.08);border-color:rgba(156,54,181,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(40,15,60,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#f3d9ff}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="酸碱指示剂 · 分子自己的平衡替你量 pH" data-en="Acid–Base Indicator · a molecular equilibrium that reads pH for you">酸碱指示剂 · 分子自己的平衡替你量 pH</h1>
  <div class="sub" data-zh="指示剂本身是弱酸 HIn ⇌ H⁺ + In⁻：酸式/碱式共轭结构不同→颜色不同；[In⁻]/[HIn]=Ka/[H⁺]，pH 每变 1 比例变 10 倍，变色区间=pKa±1——选指示剂=让区间落进滴定突跃 · 拖 pH 滑杆看烧杯变色与分子开环 / 拖动旋转 / 空格运行暂停" data-en="An indicator is itself a weak acid HIn ⇌ H⁺ + In⁻: acid/base conjugate structures differ → colors differ; [In⁻]/[HIn]=Ka/[H⁺], ratio shifts 10× per pH unit, range=pKa±1 — picking an indicator means matching its range to the titration jump · drag the pH slider / drag to orbit / Space = run/pause">指示剂本身是弱酸 HIn ⇌ H⁺ + In⁻：酸式/碱式共轭结构不同→颜色不同；[In⁻]/[HIn]=Ka/[H⁺]，pH 每变 1 比例变 10 倍，变色区间=pKa±1——选指示剂=让区间落进滴定突跃 · 拖 pH 滑杆看烧杯变色与分子开环 / 拖动旋转 / 空格运行暂停</div>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x14101b);
scene.fog=new THREE.Fog(0x14101b,20,64);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(0.4,5.2,12.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.2,2.1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xe6dcf5,0x1a1622,0.5));
const key=new THREE.DirectionalLight(0xfff0e0,1.05);key.position.set(4,9,6);scene.add(key);
const fill=new THREE.DirectionalLight(0xc09aff,0.35);fill.position.set(-6,4,-5);scene.add(fill);

/* ---- 化学数据：三种指示剂（pKa 与酸/碱式颜色为文献代表值） ---- */
const IND={
  mo :{pKa:3.4,acid:0xe03131,base:0xfcc419},   // 甲基橙 红→黄
  btb:{pKa:7.1,acid:0xfcc419,base:0x1971c2},   // 溴百里酚蓝 黄→蓝
  pp :{pKa:9.6,acid:0xcfc9da,base:0xe64980},   // 酚酞 无色→红(品红)
};
let cur=IND.pp;
/* 万用 pH 色带锚点颜色 */
const PHC=[[0,0xe03131],[2,0xf76707],[4,0xfcc419],[6,0xa9e34b],[7,0x51cf66],
           [8,0x38d9a9],[9,0x22b8cf],[11,0x1c7ed6],[13,0x6741d9],[14,0x9c36b5]];
const _c2=new THREE.Color();
function phColor(p,out){
  for(let i=1;i<PHC.length;i++){
    if(p<=PHC[i][0]){
      const t=clamp((p-PHC[i-1][0])/(PHC[i][0]-PHC[i-1][0]),0,1);
      return out.setHex(PHC[i-1][1]).lerp(_c2.setHex(PHC[i][1]),t);
    }
  }
  return out.setHex(PHC[PHC.length-1][1]);
}
/* 亨德森-哈塞尔巴尔赫：[In⁻]/[HIn]=Ka/[H⁺]=10^(pH-pKa) → 碱式占比 */
const fracIn=()=>1/(1+Math.pow(10,cur.pKa-pH));

/* ---- 场景：地面 + pH 色带 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x221c2c,roughness:0.95});
const ground=new THREE.Mesh(new THREE.BoxGeometry(20,0.3,6),groundM);
ground.position.set(0,-0.15,0);scene.add(ground);
const ribbonGrp=new THREE.Group();scene.add(ribbonGrp);
const stripGeo=new THREE.PlaneGeometry(12.6,0.62,126,1);stripGeo.rotateX(-Math.PI/2);
{
  const pos=stripGeo.attributes.position,col=[],c=new THREE.Color();
  for(let i=0;i<pos.count;i++){phColor(7+pos.getX(i)/0.9,c);col.push(c.r,c.g,c.b);}
  stripGeo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
}
const strip=new THREE.Mesh(stripGeo,new THREE.MeshBasicMaterial({vertexColors:true}));
strip.position.set(0,0.021,2.2);ribbonGrp.add(strip);
const rangeHi=new THREE.Mesh(new THREE.PlaneGeometry(1.8,0.78).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.28}));
rangeHi.position.set(0,0.035,2.2);ribbonGrp.add(rangeHi);
const markerMat=new THREE.MeshBasicMaterial({color:0xda77f2});
const marker=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.34,0.8),markerMat);
marker.position.set(0,0.17,2.2);ribbonGrp.add(marker);

/* ---- 场景：烧杯 + 滴定管（半透明玻璃） ---- */
const glassMat=new THREE.MeshPhysicalMaterial({color:0xbfe3ef,transparent:true,opacity:0.14,
  roughness:0.06,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const liqMat=new THREE.MeshStandardMaterial({color:0xe64980,transparent:true,opacity:0.85,
  roughness:0.25,emissive:0xe64980,emissiveIntensity:0.2});
const liqC=new THREE.Color(),acidC=new THREE.Color(),baseC=new THREE.Color();
const BX=-3.1,LIQ_TOP=1.57;
const beaker=new THREE.Group();beaker.position.set(BX,0,0);scene.add(beaker);
{
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(1.28,1.28,2.2,36,1,true),glassMat);
  wall.position.y=1.1;beaker.add(wall);
  const bot=new THREE.Mesh(new THREE.CylinderGeometry(1.28,1.28,0.07,36),glassMat);
  bot.position.y=0.035;beaker.add(bot);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(1.28,0.032,8,40),glassMat);
  rim.rotation.x=Math.PI/2;rim.position.y=2.2;beaker.add(rim);
  const liq=new THREE.Mesh(new THREE.CylinderGeometry(1.14,1.14,1.5,32),liqMat);
  liq.position.y=0.82;beaker.add(liq);
}
const burette=new THREE.Group();burette.position.set(BX,0,0);scene.add(burette);
{
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,2.9,24,1,true),glassMat);
  wall.position.y=5.0;burette.add(wall);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.03,8,28),glassMat);
  rim.rotation.x=Math.PI/2;rim.position.y=6.45;burette.add(rim);
  const liq=new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.27,2.5,20),liqMat);
  liq.position.y=5.15;burette.add(liq);
  const cock=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.2,0.28),
    new THREE.MeshStandardMaterial({color:0x8d7ba8,roughness:0.5}));
  cock.position.y=3.45;burette.add(cock);
  const tipGeo=new THREE.CylinderGeometry(0.03,0.12,0.4,14);
  const tip=new THREE.Mesh(tipGeo,glassMat);tip.position.y=3.2;burette.add(tip);
}
/* 滴落液滴粒子 */
const drops=[];
{
  const dg=new THREE.SphereGeometry(0.075,10,10);
  for(let i=0;i<6;i++){
    const m=new THREE.Mesh(dg,liqMat);scene.add(m);
    drops.push({m,y:LIQ_TOP+Math.random()*(2.95-LIQ_TOP),wait:Math.random()*0.4,j:(Math.random()-0.5)*0.1});
  }
}

/* ---- 场景：分子视窗（酚酞简化模型）----
   闭合内酯：两环扭离平面、中心环闭合、灰白无共轭；
   开环醌式：环转平、桥链拉长、中心环张开、发光变红（共轭变长→吸收红移） */
const C_GRAY=new THREE.Color(0xcac4d0),C_RED=new THREE.Color(0xff6b6b);
const bodyMat=new THREE.MeshStandardMaterial({color:0xcac4d0,roughness:0.38,metalness:0.05,
  emissive:0xe03131,emissiveIntensity:0.05});
const molGrp=new THREE.Group();molGrp.position.set(3.6,1.9,0);scene.add(molGrp);
const platM=new THREE.MeshStandardMaterial({color:0x2a2338,roughness:0.9});
const plat=new THREE.Mesh(new THREE.CylinderGeometry(1.75,1.9,0.08,40),platM);
plat.position.set(3.6,0.04,0);scene.add(plat);
function benzene(){           // 苯环样圆盘：薄盘 + 环沿 + 6 个"碳原子"凸点
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.52,0.52,0.055,24),bodyMat));
  const rim=new THREE.Mesh(new THREE.TorusGeometry(0.52,0.075,10,30),bodyMat);
  rim.rotation.x=Math.PI/2;g.add(rim);
  for(let k=0;k<6;k++){
    const a=k*Math.PI/3,at=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,10),bodyMat);
    at.position.set(Math.cos(a)*0.52,0,Math.sin(a)*0.52);g.add(at);
  }
  return g;
}
const ringL=benzene(),ringR=benzene();molGrp.add(ringL,ringR);
const hub=new THREE.Mesh(new THREE.SphereGeometry(0.27,16,16),bodyMat);molGrp.add(hub);
function bridge(side){        // 桥链：可伸缩的键 + 链节小球
  const g=new THREE.Group();molGrp.add(g);
  const rodGeo=new THREE.CylinderGeometry(0.085,0.085,1,10);rodGeo.rotateZ(Math.PI/2);
  const rod=new THREE.Mesh(rodGeo,bodyMat);g.add(rod);
  const mid=new THREE.Mesh(new THREE.SphereGeometry(0.135,12,12),bodyMat);
  mid.position.z=0.17;g.add(mid);
  g.userData={side,rod,mid};return g;
}
const briL=bridge(-1),briR=bridge(1);
const capMat=new THREE.MeshStandardMaterial({color:0xd8d2e0,roughness:0.4,transparent:true,opacity:0.95});
const cap=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.07,10,24),capMat);
cap.position.set(0,0.38,0.5);cap.rotation.x=0.45;molGrp.add(cap);      // 闭合内酯环
const oxy=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,10),
  new THREE.MeshStandardMaterial({color:0xff8787,emissive:0xc0392b,emissiveIntensity:0.3,transparent:true,opacity:0.95}));
oxy.position.set(0,0.52,0.68);molGrp.add(oxy);                          // 羰基 O
const arcMat=new THREE.MeshStandardMaterial({color:0xd8d2e0,roughness:0.4,transparent:true,
  opacity:0.95,emissive:0xe03131,emissiveIntensity:0.05});
const arc=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.06,8,20,Math.PI),arcMat);
molGrp.add(arc);                                                        // 中心环另一半（开环时摆开）
function updateMol(f){
  const tilt=lerp(0.95,0.05,f),D=lerp(1.5,1.95,f);   // 扭离平面 → 共面；桥链拉长
  ringL.rotation.set(0.1*(1-f),-tilt,0);ringR.rotation.set(0.1*(1-f),tilt,0);
  ringL.position.x=-D;ringR.position.x=D;
  for(const b of [briL,briR]){
    const s=b.userData.side,Lb=D-0.45;
    b.userData.rod.scale.x=Lb;b.userData.rod.position.x=s*Lb/2;b.userData.mid.position.x=s*Lb/2;
  }
  capMat.opacity=(1-f)*0.95;oxy.material.opacity=(1-f)*0.95;   // 内酯环消隐=开环
  cap.scale.setScalar(1-0.25*f);
  arcMat.opacity=(1-f)*0.95;arc.rotation.z=lerp(0.15,1.5,f);
  bodyMat.color.copy(C_GRAY).lerp(C_RED,f);                     // 共轭变长→红移发光
  bodyMat.emissiveIntensity=0.05+0.85*f;
}

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0;
let pH=12.2,rate=1,titOn=true,sweepDir=-1;
let molOn=true,ribbonOn=true;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;

function setPH(v){pH=clamp(v,0,14);
  document.getElementById('sPH').value=pH;
  document.getElementById('sPHVal').textContent=pH.toFixed(2);}
function titSet(on){titOn=on;document.getElementById('tglTit').checked=on;}
function molSet(on){molOn=on;document.getElementById('tglMol').checked=on;}
function setIndicator(id){
  cur=IND[id];
  document.getElementById('iMO').classList.toggle('on',id==='mo');
  document.getElementById('iBTB').classList.toggle('on',id==='btb');
  document.getElementById('iPP').classList.toggle('on',id==='pp');
  rangeHi.position.x=(cur.pKa-7)*0.9;   // 变色区间高亮 = pKa±1
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'指示剂自己也是酸碱对：弱酸 HIn ⇌ H⁺ + In⁻，同样服从平衡移动',en:'The indicator is itself an acid–base pair: weak acid HIn ⇌ H⁺ + In⁻'},
 {zh:'酸式 HIn 与碱式 In⁻ 共轭结构不同 → 吸收不同 → 颜色不同',en:'HIn and In⁻ have different conjugated structures → different absorption → different colors'},
 {zh:'[In⁻]/[HIn] = Ka/[H⁺] = 10^(pH−pKa)：pH 每变 1，两型比例变 10 倍',en:'[In⁻]/[HIn] = Ka/[H⁺] = 10^(pH−pKa): each pH unit shifts the ratio 10×'},
 {zh:'肉眼在 1/10 ~ 10 倍之间分辨过渡：变色区间 = pKa ± 1',en:'The eye resolves ratios between 1/10 and 10: transition range = pKa ± 1'},
 {zh:'选指示剂 = 选区间：变色区间须落在滴定突跃内，终点才准',en:'Choosing an indicator = choosing a range: it must sit inside the titration jump'},
 {zh:'分子现场：酚酞碱式开环成醌式，共轭变长、吸收红移 → 显红',en:'At the molecule: base form opens to a quinoid — longer conjugation, red-shifted absorption → red'},
];
let activeStep=5;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
  if(i===0){setIndicator('btb');titSet(false);setPH(7.1);molSet(true);playing=true;}     // pKa 处 1:1
  else if(i===1){setIndicator('mo');titSet(false);setPH(1.4);playing=true;}              // 酸式为主
  else if(i===2){setIndicator('btb');titSet(false);setPH(6.1);playing=true;}             // pKa-1 → 1/10
  else if(i===3){setIndicator('pp');titSet(false);setPH(8.6);playing=true;}              // 区间下缘
  else if(i===4){setIndicator('mo');setPH(1.0);titSet(true);playing=true;}               // 滴定突跃演示
  else {setIndicator('pp');titSet(false);setPH(11.5);molSet(true);playing=true;}         // 开环现场
  syncSteps();syncPlayBtn();
}

/* ---- 读数 ---- */
function updateStats(){
  const f=fracIn();
  document.getElementById('stPH').textContent=pH.toFixed(2);
  document.getElementById('stHIn').textContent=((1-f)*100).toFixed(1)+'%';
  document.getElementById('stIn').textContent=(f*100).toFixed(1)+'%';
  const st=document.getElementById('stState');
  st.textContent=f<0.1?L('酸色 HIn 为主','acid (HIn)'):f>0.9?L('碱色 In⁻ 为主','base (In⁻)'):L('过渡：两型共存','transition: mixed');
  st.className='v'+(f>=0.1&&f<=0.9?' ok':'');
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const mkLbl=addLabel(()=>`pH ${pH.toFixed(2)}`,new THREE.Vector3(0,0.62,2.35),'',()=>ribbonOn);
const rgLbl=addLabel(()=>L(`变色区间 pKa±1 · pKa=${cur.pKa}`,`range pKa±1 · pKa=${cur.pKa}`),
  new THREE.Vector3(0,1.0,2.3),'o',()=>ribbonOn);
addLabel(()=>L('滴定管','Burette'),new THREE.Vector3(BX,6.85,0),'b');
addLabel(()=>L('烧杯：颜色随 pH 连续插值','Beaker: color interpolates with pH'),new THREE.Vector3(-5.3,0.5,1.3),'o');
addLabel(()=>L('[In⁻]/[HIn] = Ka/[H⁺] = 10^(pH−pKa)','[In⁻]/[HIn] = Ka/[H⁺] = 10^(pH−pKa)'),
  new THREE.Vector3(3.6,4.35,0),'b',()=>molOn);
addLabel(()=>L('HIn 酸式 · 闭合内酯（无长共轭）','HIn acid · closed lactone (short conjugation)'),
  new THREE.Vector3(3.6,3.55,0),'g',()=>molOn&&fracIn()<0.45);
addLabel(()=>L('In⁻ 碱式 · 开环醌式：共轭变长 → 显红','In⁻ base · ring-open quinoid: longer conjugation → red'),
  new THREE.Vector3(3.6,3.55,0),'r',()=>molOn&&fracIn()>0.6);
addLabel(()=>L('0','0'),new THREE.Vector3(-6.3,0.12,3.15),'b',()=>ribbonOn);
addLabel(()=>L('7','7'),new THREE.Vector3(0,0.12,3.15),'b',()=>ribbonOn);
addLabel(()=>L('14','14'),new THREE.Vector3(6.3,0.12,3.15),'b',()=>ribbonOn);

/* ---- 事件 ---- */
document.getElementById('iMO').addEventListener('click',()=>{setIndicator('mo');activeStep=4;titSet(true);playing=true;syncSteps();syncPlayBtn();});
document.getElementById('iBTB').addEventListener('click',()=>{setIndicator('btb');activeStep=0;titSet(false);setPH(cur.pKa);playing=true;syncSteps();syncPlayBtn();});
document.getElementById('iPP').addEventListener('click',()=>{setIndicator('pp');activeStep=5;titSet(false);setPH(11.5);molSet(true);playing=true;syncSteps();syncPlayBtn();});
document.getElementById('sPH').addEventListener('input',e=>{setPH(+e.target.value);titSet(false);});
document.getElementById('sRate').addEventListener('input',e=>{rate=+e.target.value;
  document.getElementById('sRateVal').textContent=rate.toFixed(1)+'×';});
document.getElementById('tglMol').addEventListener('change',e=>{molOn=e.target.checked;});
document.getElementById('tglRibbon').addEventListener('change',e=>{ribbonOn=e.target.checked;ribbonGrp.visible=ribbonOn;});
document.getElementById('tglTit').addEventListener('change',e=>{titOn=e.target.checked;});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background.setHex(dark?0x14101b:0xefe9f3);
  scene.fog.color.setHex(dark?0x14101b:0xefe9f3);
  groundM.color.setHex(dark?0x221c2c:0xd9d0de);
  platM.color.setHex(dark?0x2a2338:0xcfc4dc);
  markerMat.color.setHex(dark?0xda77f2:0x9c36b5);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  syncPlayBtn();buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  /* 滴定演示：pH 三角波来回扫 */
  if(titOn&&playing){
    pH+=sweepDir*dt*1.1*rate;
    if(pH>13.6){pH=13.6;sweepDir=-1;}
    if(pH<0.4){pH=0.4;sweepDir=1;}
    document.getElementById('sPH').value=pH;
    document.getElementById('sPHVal').textContent=pH.toFixed(2);
  }
  const f=fracIn();
  /* 液体颜色随 pH 连续插值（烧杯+滴定管+液滴共用材质） */
  acidC.setHex(cur.acid);baseC.setHex(cur.base);
  liqC.copy(acidC).lerp(baseC,Math.pow(f,0.9));
  liqMat.color.copy(liqC);liqMat.emissive.copy(liqC).multiplyScalar(0.55);
  /* 液滴 */
  for(const d of drops){
    if(playing){
      if(d.wait>0){d.wait-=dt;if(d.wait<=0)d.y=2.95;}
      else{d.y-=dt*2.7;if(d.y<=LIQ_TOP)d.wait=0.12+Math.random()*0.55/rate;}
    }
    d.m.visible=d.wait<=0&&d.y>LIQ_TOP;
    d.m.position.set(BX+d.j,d.y,0);
  }
  /* 分子形变与自转 */
  updateMol(f);
  molGrp.rotation.y=Math.sin(simT*0.5)*0.5;
  molGrp.position.y=1.9+Math.sin(simT*1.2)*0.06;
  /* 色带标记跟随 */
  marker.position.x=(pH-7)*0.9;
  rangeHi.position.x=(cur.pKa-7)*0.9;
  mkLbl.position.set((pH-7)*0.9,0.62,2.35);
  rgLbl.position.set((cur.pKa-7)*0.9,1.0,2.3);
  acc+=dt;if(acc>0.12){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化：酚酞+高 pH 开环红显、滴定自动下扫，招牌画面立即出现 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setIndicator('pp');setPH(12.2);
molSet(true);ribbonOn=true;document.getElementById('tglRibbon').checked=true;
if(!playing)titSet(false);
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
