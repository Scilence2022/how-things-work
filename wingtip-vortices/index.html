<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{

    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;

  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}

  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}

  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);

  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.warn{color:#ffd43b}#stats .v.bad{color:#ff6b6b}
  :root[data-theme="light"] #stats .v.warn{color:#d98f00}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}

  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 翼尖涡与尾流(风洞系:机翼静止,气流 +x;1 单位 ≈ 5.5 m)
   环量(椭圆翼展向峰值):Γ₀=4L/(ρ·V·π·b);进近 C_L≈1.6
   诱导阻力:C_Di=C_L²/(π·e·AR),e=0.80(装小翼 ≈0.88),D_i=q·S·C_Di
   涡对下沉速率:w≈Γ₀/(2π·0.8b) —— 重型机 ≈1.5~2 m/s
   涡强标度:Γ∝W/(V·b):重、慢、短翼的飞机尾涡最猛;寿命静空 2~3 min
   尾涡间隔:ICAO 进近 3–6 nm(按前/后机型组合) */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---------- 渲染器 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0c1118,60,180);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,400);
camera.position.set(-9,5.5,17);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(6,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=90;controls.autoRotateSpeed=0.3;

scene.add(new THREE.HemisphereLight(0xcfe0f2,0x141a22,0.8));
const key=new THREE.DirectionalLight(0xfff0d8,1.0);key.position.set(-15,22,14);scene.add(key);
const fill=new THREE.DirectionalLight(0x8fb0ff,0.3);fill.position.set(20,10,-16);scene.add(fill);

/* ---------- 状态 ---------- */
const RHO=1.225,V=75,S_AREA=428;      /* 空气密度 / 进近速度 / 机翼面积 m² */
let AR=9.8,weight=250,slowK=0.35,wingletsOn=false;
let playing=true,labelsOn=true,flowOn=true;
let bScene=11.7,chScene=1.2,CL=1.6,G0=526,CDi=0.105,Di=155,wSink=1.61,lifeS=120;
let playingInit=!(qs.get('pause')==='1');
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){const v=parseFloat(qs.get('speed'));if(Number.isFinite(v))slowK=clamp(v,0.05,1);}
function calcAero(){
  const b=Math.sqrt(AR*S_AREA);          /* 翼展 m */
  bScene=b*0.18;chScene=S_AREA/b*0.18;
  const q=0.5*RHO*V*V;
  CL=weight*1000*9.81/(q*S_AREA);
  const e=wingletsOn?0.88:0.80;
  CDi=CL*CL/(Math.PI*e*AR);
  Di=q*S_AREA*CDi/1000;                  /* kN */
  G0=4*weight*1000*9.81/(RHO*V*Math.PI*b);
  wSink=G0/(2*Math.PI*0.8*b);
  lifeS=90+120*G0/530;
}
function applyWing(){
  wing.scale.set(chScene,0.22,bScene);
  wingLt.position.z=bScene/2;wingRt.position.z=-bScene/2;
  wingLt.visible=wingRt.visible=wingletsOn;
  calcAero();
}

/* ---------- 机翼 ---------- */
const wingMat=new THREE.MeshStandardMaterial({color:0x9aa8b8,roughness:0.35,metalness:0.65});
const wing=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),wingMat);
wing.position.y=0.3;wing.rotation.z=0.06;scene.add(wing);
const tipMat=new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.4,metalness:0.5,emissive:0x662200,emissiveIntensity:0.4});
const wingLt=new THREE.Mesh(new THREE.BoxGeometry(chScene*0.5,1.1,0.14),tipMat);
const wingRt=new THREE.Mesh(new THREE.BoxGeometry(chScene*0.5,1.1,0.14),tipMat);
wingLt.position.set(0,0.75,0);wingRt.position.set(0,0.75,0);
scene.add(wingLt,wingRt);

/* ---------- 气流粒子(含下洗/上洗偏转) ---------- */
const NA=520;
const flowGeo=new THREE.BufferGeometry();
const flowPos=new Float32Array(NA*3);
for(let i=0;i<NA;i++){
  flowPos[i*3]=-25+Math.random()*70;
  flowPos[i*3+1]=(Math.random()-0.5)*13;
  flowPos[i*3+2]=(Math.random()-0.5)*34;
}
flowGeo.setAttribute('position',new THREE.BufferAttribute(flowPos,3));
const flow=new THREE.Points(flowGeo,new THREE.PointsMaterial({color:0x9fc4e8,size:0.1,transparent:true,opacity:0.55}));
flow.frustumCulled=false;scene.add(flow);

/* ---------- 涡核螺旋线(烟雾线示意) ---------- */
const NH=130;
function makeHelix(color){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NH*3),3));
  const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:0.85}));
  line.frustumCulled=false;scene.add(line);
  return {geo,pos:geo.attributes.position};
}
const helixR=makeHelix(0xffa94d),helixL=makeHelix(0xffa94d);
/* 尾涡粒子 */
const NV=640;
const vortGeo=new THREE.BufferGeometry();
const vortPos=new Float32Array(NV*3),vortCol=new Float32Array(NV*3);
const vSt=[];
for(let i=0;i<NV;i++)vSt.push({x:-99,y:0,z:0,ph:Math.random()*6.28,side:1,r:0.2});
vortGeo.setAttribute('position',new THREE.BufferAttribute(vortPos,3));
vortGeo.setAttribute('color',new THREE.BufferAttribute(vortCol,3));
const vort=new THREE.Points(vortGeo,new THREE.PointsMaterial({size:0.16,vertexColors:true,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
vort.frustumCulled=false;scene.add(vort);
let vSpawnAcc=0;

/* ---------- 剖面:双涡环 + 上下洗箭头 ---------- */
const cutGrp=new THREE.Group();scene.add(cutGrp);
const XCUT=14;
const ringR=new THREE.Mesh(new THREE.TorusGeometry(1,0.07,10,36),new THREE.MeshBasicMaterial({color:0xffa94d}));
const ringL=new THREE.Mesh(new THREE.TorusGeometry(1,0.07,10,36),new THREE.MeshBasicMaterial({color:0xffa94d}));
ringR.rotation.y=Math.PI/2;ringL.rotation.y=Math.PI/2;
cutGrp.add(ringR,ringL);
function makeArrow(color){
  const g=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.3,8),new THREE.MeshBasicMaterial({color}));
  g.add(shaft);
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.42,10),new THREE.MeshBasicMaterial({color}));
  head.position.y=-0.85;g.add(head);
  return g;
}
const dwArr=makeArrow(0x74c0fc);
dwArr.position.set(XCUT,0,0);
cutGrp.add(dwArr);
const uwArr1=makeArrow(0x74c0fc),uwArr2=makeArrow(0x74c0fc);
uwArr1.rotation.z=Math.PI;uwArr2.rotation.z=Math.PI;   /* 上洗箭头朝上 */
cutGrp.add(uwArr1,uwArr2);

/* ---------- 后机(纸飞机) ---------- */
const follow=new THREE.Group();
{
  const wm=new THREE.MeshStandardMaterial({color:0xd6e4f5,roughness:0.4,metalness:0.3,side:THREE.DoubleSide});
  const a=new THREE.Mesh(new THREE.ConeGeometry(0.16,1.5,4),wm);
  a.rotation.z=-Math.PI/2;a.scale.set(1,1,0.35);
  follow.add(a);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.04,1.1),wm);
  tail.position.x=0.5;follow.add(tail);
}
follow.visible=false;scene.add(follow);
let followT=-1,rollAng=0;

/* ---------- 标签 ---------- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});
  div.textContent=textFn();
  return o;
}
addLabel(()=>L('机翼:升力=下表面高压 + 上表面低压','Wing: high pressure below, low above'),new THREE.Vector3(0,1.6,0),'b');
addLabel(()=>L('翼尖涡:高压绕尖卷向低压,反向旋转','Tip vortex: flow curls from below, counter-rotating pair'),new THREE.Vector3(0.6,2.6,bScene/2+0.6),'o');
addLabel(()=>L('下洗:两涡之间气流被拖向下','Downwash: flow between the pair is dragged down'),new THREE.Vector3(XCUT,-1.4,0),'b');
addLabel(()=>L('上洗:涡系外侧反而向上','Upwash: outboard of the pair, flow rises'),new THREE.Vector3(XCUT,2.2,bScene/2+3.4),'b');
addLabel(()=>L('涡核下沉 ~'+wSink.toFixed(1)+' m/s,逐渐扩散衰减','Cores sink ~'+wSink.toFixed(1)+' m/s, diffusing as they age'),new THREE.Vector3(20,-2.4,0),'o',()=>true);
const notifyLbl=addLabel(()=>followT>=0&&followT<1?L('后机撞入尾涡:滚转扰动!','Follower hits the wake: roll upset!'):'',new THREE.Vector3(0,6,0),'r');

/* ---------- 步骤 ---------- */
function flyTo(px,py,pz,tx,ty,tz){camTween.p0=camera.position.clone();camTween.p1=new THREE.Vector3(px,py,pz);
  camTween.t0=controls.target.clone();camTween.t1=new THREE.Vector3(tx,ty,tz);camTween.k=0;}
const camTween={k:1};
const STEPS=[
  {zh:'升力的代价:下表面高压绕过翼尖卷向上表面低压',en:'The price of lift: high pressure below curls around the tip into the low above',
   act(){flyTo(-4,2.2,bScene/2+4,0,0.4,bScene/2-1);}},
  {zh:'两条反向涡带:卷起、下沉、扩散衰减',en:'Two counter-rotating trails: roll up, sink, diffuse',
   act(){flyTo(16,4,20,14,0,0);}},
  {zh:'诱导阻力 C_Di=C_L²/(πeAR):能量就耗在这对涡里',en:'Induced drag C_Di=C_L²/(πeAR): the energy spent spinning this pair',
   act(){AR=5.5;syncSliders();applyWing();flyTo(2,3,14,4,0,0);}},
  {zh:'重、慢、短翼 = 强涡:Γ∝W/(V·b),尾涡掀得动后机',en:'Heavy, slow, stubby = fierce: Γ∝W/(V·b) — wake strong enough to roll a follower',
   act(){weight=300;AR=7;syncSliders();applyWing();triggerFollow();flyTo(20,5,22,16,0,0);}},
  {zh:'尾流间隔:重型机尾涡存活 2~3 分钟,进近间隔 3–6 nm',en:'Wake spacing: a heavy\'s wake lives 2–3 min — hence 3–6 nm approach spacing',
   act(){weight=280;syncSliders();applyWing();triggerFollow();flyTo(30,8,26,20,-0.5,0);}},
  {zh:'对策:高展弦比、翼梢小翼、前机重型以上加间隔',en:'Countermeasures: high aspect ratio, winglets, extra spacing behind heavies',
   act(){AR=11.5;wingletsOn=true;syncSliders();syncWingletBtn();applyWing();flyTo(4,3,-16,8,0,0);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function syncSliders(){
  document.getElementById('sAR').value=AR;
  document.getElementById('sARVal').textContent=AR.toFixed(1);
  document.getElementById('sW').value=weight;
  document.getElementById('sWVal').textContent=weight+' t';
  document.getElementById('sSlow').value=slowK;
  document.getElementById('sSlowVal').textContent=slowK.toFixed(2)+'×';
}
function syncWingletBtn(){document.getElementById('btnWinglet').classList.toggle('on',wingletsOn);}
function triggerFollow(){followT=0;follow.visible=true;rollAng=0;}
function updateStats(){
  document.getElementById('stAR').innerHTML=AR.toFixed(1);
  const elD=document.getElementById('stDi');
  elD.innerHTML=CDi.toFixed(3)+'<small> · '+Di.toFixed(0)+' kN</small>';
  elD.className='v'+(wingletsOn?' ok':'');
  document.getElementById('stG').innerHTML=G0.toFixed(0)+'<small> m²/s</small>';
  document.getElementById('stW').innerHTML=wSink.toFixed(1)+'<small> m/s · '+
    (lifeS/60).toFixed(1)+L(' min',' min')+'</small>';
}

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0c1118:0xdde6ee);
  scene.fog.color.setHex(dark?0x0c1118:0xdde6ee);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  syncSliders();buildSteps();updateStats();
}

/* ---------- 事件 ---------- */
document.getElementById('sAR').addEventListener('input',e=>{AR=+e.target.value;applyWing();
  document.getElementById('sARVal').textContent=AR.toFixed(1);});
document.getElementById('sW').addEventListener('input',e=>{weight=+e.target.value;applyWing();
  document.getElementById('sWVal').textContent=weight+' t';});
document.getElementById('sSlow').addEventListener('input',e=>{slowK=+e.target.value;
  document.getElementById('sSlowVal').textContent=slowK.toFixed(2)+'×';});
document.getElementById('btnFollow').addEventListener('click',triggerFollow);
document.getElementById('btnWinglet').addEventListener('click',()=>{wingletsOn=!wingletsOn;
  syncWingletBtn();applyWing();});
document.getElementById('btnSpan').addEventListener('click',()=>flyTo(30,8,26,20,-0.5,0));
document.getElementById('btnTip').addEventListener('click',()=>flyTo(-4,2.2,bScene/2+4,0,0.4,bScene/2-1));
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglFlow').addEventListener('change',e=>{flowOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';
  localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0,phase=0;
if(!labelsOn)document.getElementById('tglLabels').checked=false;
if(!playingInit){playing=false;document.getElementById('play').textContent=L('运行','Run');}
const VVIS=13.5;                      /* 75 m/s 的场景速度 */

function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=dt0*slowK*(playing?1:0);
  phase+=dt;
  if(camTween.k<1){
    camTween.k=Math.min(1,camTween.k+dt0*1.6);
    const e=1-Math.pow(1-camTween.k,3);
    camera.position.lerpVectors(camTween.p0,camTween.p1,e);
    controls.target.lerpVectors(camTween.t0,camTween.t1,e);
  }
  const wingletK=wingletsOn?0.82:1;
  const sinkU=wSink*0.18;              /* 下沉 → 场景单位/s */
  const spreadU=0.055;                 /* 涡核扩散(示意,夸大) */
  const coreR0=0.16;
  /* 涡核位置(沿 x 的下沉轨迹,从翼尖高度起步) */
  const coreY=x=>0.15-sinkU*(x/VVIS)*3.2;
  /* 螺旋线:绕下沉核心的涡线 */
  function updHelix(h,zt,side,seed){
    for(let i=0;i<NH;i++){
      const x=0.8+i*(42/NH);
      const tau=x/VVIS;
      const r=coreR0+spreadU*tau*2.4;
      const th=seed+side*(6.0*tau*wingletK);
      const y=coreY(x)+r*Math.cos(th)*0.9;
      const z=zt+r*Math.sin(th)*0.9;
      h.pos.setXYZ(i,x,Math.max(y,-6),z);
    }
    h.pos.needsUpdate=true;
  }
  updHelix(helixR,bScene/2,1,phase*1.2);
  updHelix(helixL,-bScene/2,-1,phase*1.2+2.4);
  /* 涡粒子:从翼尖持续卷入 */
  vSpawnAcc+=dt*(120+180*G0/530);
  while(vSpawnAcc>1){
    vSpawnAcc--;
    for(let i=0;i<NV;i++){
      if(vSt[i].x>=0)continue;
      vSt[i].x=0.9;
      vSt[i].side=Math.random()<0.5?1:-1;
      vSt[i].ph=Math.random()*6.28;
      vSt[i].r=coreR0*(0.6+Math.random()*0.8);
      vSt[i].y=0;
      vSt[i].z=vSt[i].side*bScene/2;
      break;
    }
  }
  for(let i=0;i<NV;i++){
    const s=vSt[i];
    if(s.x<0){vortPos[i*3+1]=-99;vortCol[i*3]=vortCol[i*3+1]=vortCol[i*3+2]=0;continue;}
    s.x+=dt*VVIS*0.72;
    if(s.x>42){s.x=-99;continue;}
    const tau=s.x/VVIS;
    s.r+=dt*spreadU*2.2;
    s.ph+=dt*sideOmega(s.side)*wingletK;
    const fade=clamp(1-tau/3.4,0,1)*0.9;
    vortPos[i*3]=s.x;
    vortPos[i*3+1]=Math.max(coreY(s.x)+s.r*Math.cos(s.ph)*0.9,-6);
    vortPos[i*3+2]=s.side*bScene/2+s.r*Math.sin(s.ph)*0.9;
    vortCol[i*3]=1.0*fade;vortCol[i*3+1]=0.62*fade;vortCol[i*3+2]=0.25*fade;
  }
  vortGeo.attributes.position.needsUpdate=true;
  vortGeo.attributes.color.needsUpdate=true;
  function sideOmega(side){return side*(9.0/Math.max(0.6,G0/530));}
  /* 气流粒子:自由流 + 下洗/上洗 */
  if(flowOn){
    for(let i=0;i<NA;i++){
      let x=flowPos[i*3],y=flowPos[i*3+1],z=flowPos[i*3+2];
      x+=dt*VVIS;
      if(x>0.8){
        const az=Math.abs(z);
        if(az<bScene/2-0.4)y-=dt*(0.55*CL/1.6)*wingletK*1.2;
        else if(az<bScene/2+3.2)y+=dt*(0.3*CL/1.6)*wingletK*1.2;
      }
      if(x>45){x=-25;y=(Math.random()-0.5)*13;z=(Math.random()-0.5)*34;}
      if(y<-7)y=-7;if(y>7)y=7;
      flowPos[i*3]=x;flowPos[i*3+1]=y;flowPos[i*3+2]=z;
    }
    flowGeo.attributes.position.needsUpdate=true;
  }
  flow.visible=flowOn;
  /* 剖面环随涡核位置 */
  const yR=coreY(XCUT);
  ringR.position.set(XCUT,yR,bScene/2);
  ringL.position.set(XCUT,yR,-bScene/2);
  ringR.scale.setScalar(1+spreadU*XCUT/VVIS*2.4);
  ringL.scale.setScalar(1+spreadU*XCUT/VVIS*2.4);
  ringR.rotation.x+=dt*8;ringL.rotation.x-=dt*8;
  dwArr.position.set(XCUT,yR+0.6,0);
  uwArr1.position.set(XCUT,yR+1.6,bScene/2+2.6);
  uwArr2.position.set(XCUT,yR+1.6,-bScene/2-2.6);
  /* 后机穿越 */
  if(followT>=0){
    followT+=dt*0.9;
    const fx=-32+followT*64;
    follow.position.set(fx,0.3,bScene/2-0.3);
    const inWake=fx>4&&fx<26;
    if(inWake)rollAng+=dt*2.6*(G0/530)*(wingletsOn?0.7:1);
    else rollAng*=Math.exp(-1.6*dt0);
    follow.rotation.x=clamp(rollAng,-1.2,1.2);
    if(followT>1.6){followT=-1;follow.visible=false;}
  }
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis()&&r.text()!=='';   /* 空文案不渲染胶囊 */
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

calcAero();applyWing();applyTheme();applyLang();start();
</script>
