<style>

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp = (x,a,b) => Math.min(b,Math.max(a,x));
const D2R = Math.PI/180, R2D = 180/Math.PI;
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh,en) => LANG==='en'?en:zh;

/* ---- renderer ---- */
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x101418,20,55);
const camera = new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(0,7,22);
const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.5,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=3; controls.maxDistance=60;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key = new THREE.DirectionalLight(0xfff2dd,1.0); key.position.set(5,9,7); scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff,0.28); fill.position.set(-7,5,-5); scene.add(fill);

/* ---- materials (mutable for theme) ---- */
const groundM = new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const rackBodyM = new THREE.MeshStandardMaterial({color:0x2e3a47,roughness:0.35,metalness:0.7});
const rackToothM = new THREE.MeshStandardMaterial({color:0x3d5063,roughness:0.3,metalness:0.75});
const pinionM = new THREE.MeshStandardMaterial({color:0x4a7fa5,roughness:0.3,metalness:0.72});
const pinionToothM = new THREE.MeshStandardMaterial({color:0x6baed6,roughness:0.28,metalness:0.65});
const meshingM = new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xffa000,emissiveIntensity:0.6,roughness:0.2});
const tieRodM = new THREE.MeshStandardMaterial({color:0x788795,roughness:0.5,metalness:0.6});
const knuckleM = new THREE.MeshStandardMaterial({color:0xc44b2a,roughness:0.4,metalness:0.55});
const pitchLinM = new THREE.LineDashedMaterial({color:0x74c0fc,dashSize:0.18,gapSize:0.12,transparent:true,opacity:0.8});
const pitchCircM = new THREE.LineDashedMaterial({color:0x74c0fc,dashSize:0.18,gapSize:0.12,transparent:true,opacity:0.8});
const pressureM = new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xffa000,emissiveIntensity:0.9,roughness:0.2});

/* ---- geometry helpers ---- */
const ALPHA = 20*D2R;
const M_MOD = 0.2; // module in world units (2mm * 0.1 scale)
const Z_PIN = 12;
const RACK_LEN = 10, RACK_H = 0.5, RACK_W = 0.35;
const R_PITCH = M_MOD*Z_PIN/2; // pitch radius
const R_BASE = R_PITCH*Math.cos(ALPHA);
const R_TIP = R_PITCH + M_MOD;
const R_ROOT = R_PITCH - 1.25*M_MOD;
const TOOTH_PITCH = Math.PI*M_MOD; // = π·m

/* build involute pinion shape */
function pinionShape() {
  const half = Math.PI/(2*Z_PIN);
  const invA = Math.tan(ALPHA)-ALPHA;
  const inv = t => t - Math.atan(t);
  const tOf = rr => Math.sqrt(Math.max(0,rr*rr/(R_BASE*R_BASE)-1));
  const t0 = tOf(Math.max(R_ROOT,R_BASE*1.001)), t1 = tOf(R_TIP);
  const pts = [];
  const flank = (g,sgn,rev) => {
    for(let j=0;j<=8;j++){
      const i=rev?8-j:j, t=t0+(t1-t0)*i/8;
      const ang=g+sgn*(half+invA-inv(t));
      const rr=R_BASE*Math.sqrt(1+t*t);
      pts.push([rr*Math.cos(ang),rr*Math.sin(ang)]);
    }
  };
  for(let k=0;k<Z_PIN;k++){
    const g=k*2*Math.PI/Z_PIN, dTip=half+invA-inv(t1), dRoot=half+invA-inv(t0);
    flank(g,-1,false);
    for(let i=1;i<5;i++) pts.push([R_TIP*Math.cos(g-dTip+2*dTip*i/5),R_TIP*Math.sin(g-dTip+2*dTip*i/5)]);
    flank(g,1,true);
    const a0=g+dRoot, a1=g+2*Math.PI/Z_PIN-dRoot;
    for(let i=1;i<6;i++){const a=a0+(a1-a0)*i/6; pts.push([R_ROOT*Math.cos(a),R_ROOT*Math.sin(a)]);}
  }
  const sh = new THREE.Shape();
  pts.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));
  sh.closePath(); return sh;
}

/* rack tooth profile shape (one tooth) at x offset */
function rackToothGeom(n) {
  const hw = M_MOD*0.8, ht = M_MOD*1.0, addend = M_MOD;
  const geo = new THREE.BoxGeometry(hw*1.4,ht+addend,RACK_W*0.9);
  return geo;
}

/* ---- build scene objects ---- */
const ground = new THREE.Mesh(new THREE.BoxGeometry(28,0.28,8),groundM);
ground.position.set(0,-0.8,0); scene.add(ground);

/* rack body */
const rackG = new THREE.Group();
const rackBody = new THREE.Mesh(new THREE.BoxGeometry(RACK_LEN,RACK_H,RACK_W),rackBodyM);
rackG.add(rackBody);
/* rack teeth */
const N_TEETH = Math.floor(RACK_LEN/TOOTH_PITCH);
for(let i=0;i<N_TEETH;i++){
  const tx = -RACK_LEN/2 + TOOTH_PITCH*(i+0.5);
  const tooth = new THREE.Mesh(new THREE.BoxGeometry(M_MOD*0.9,M_MOD*2.2,RACK_W*0.88),rackToothM);
  tooth.position.set(tx,RACK_H/2+M_MOD*0.6,0);
  rackG.add(tooth);
}
rackG.position.set(0,-R_PITCH-RACK_H/2,0);
scene.add(rackG);

/* pinion */
const pinionG = new THREE.Group();
const pinionGeo = new THREE.ExtrudeGeometry(pinionShape(),{depth:RACK_W,bevelEnabled:false});
pinionGeo.translate(0,0,-RACK_W/2);
pinionG.add(new THREE.Mesh(pinionGeo,pinionM));
/* hub */
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,RACK_W*1.5,14),new THREE.MeshStandardMaterial({color:0x3d4654,roughness:0.5,metalness:0.6}));
hub.rotation.x=Math.PI/2; pinionG.add(hub);
pinionG.position.set(0,0,0);
scene.add(pinionG);

/* meshing highlight dot - shows contact point */
const meshDot = new THREE.Mesh(new THREE.SphereGeometry(0.06,12,10),meshingM);
scene.add(meshDot);

/* pitch circle overlay */
const pitchCircPts = [];
for(let i=0;i<=72;i++){const a=i/72*Math.PI*2; pitchCircPts.push(new THREE.Vector3(R_PITCH*Math.cos(a),R_PITCH*Math.sin(a),0));}
const pitchCircLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pitchCircPts),pitchCircM);
pitchCircLine.computeLineDistances(); pitchCircLine.visible=false;
scene.add(pitchCircLine);

/* pitch line on rack */
const pitchLinePts = [new THREE.Vector3(-RACK_LEN/2,0,0),new THREE.Vector3(RACK_LEN/2,0,0)];
const pitchLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pitchLinePts),pitchLinM);
pitchLine.computeLineDistances(); pitchLine.visible=false;
pitchLine.position.y = -R_PITCH;
scene.add(pitchLine);

/* pressure line arrow */
const pressArr = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,2.0,8),pressureM);
pressArr.rotation.z = ALPHA - Math.PI/2;
pressArr.visible=false;
scene.add(pressArr);

/* steering tie rods and knuckles */
const RACK_HALF = 3.5, TIE_LEN = 2.8;
const steeringG = new THREE.Group();
scene.add(steeringG);
function buildKnuckle(side){
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.TorusGeometry(0.55,0.18,12,28),new THREE.MeshStandardMaterial({color:0x1a1d22,roughness:0.85}));
  tire.rotation.y=Math.PI/2; g.add(tire);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.12,20),new THREE.MeshStandardMaterial({color:0x9aa8b5,roughness:0.3,metalness:0.8}));
  rim.rotation.z=Math.PI/2; g.add(rim);
  const pivot = new THREE.Mesh(new THREE.SphereGeometry(0.12,10,8),knuckleM);
  g.add(pivot);
  return g;
}
const kLeft=buildKnuckle(-1), kRight=buildKnuckle(1);
steeringG.add(kLeft,kRight);
kLeft.position.set(-RACK_HALF-TIE_LEN,0,-1.8);
kRight.position.set( RACK_HALF+TIE_LEN,0,-1.8);

function makeTieRod(){
  const g=new THREE.Group();
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,1,10),tieRodM);
  rod.rotation.z=Math.PI/2; g.add(rod); return g;
}
const trLeft=makeTieRod(), trRight=makeTieRod();
steeringG.add(trLeft,trRight);
steeringG.position.set(0,-R_PITCH-RACK_H/2,0);

/* ---- labels ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn}); div.textContent=textFn(); return o;
}
addLabel(()=>L('小齿轮  z=12, m=2mm','Pinion  z=12, m=2mm'),new THREE.Vector3(0,1.6,0),'b');
addLabel(()=>L('齿条（转向架）','Rack (steering)'),new THREE.Vector3(0,-2.2,0),'g');
addLabel(()=>L('接触点沿压力线滑行 20°','Contact slides along 20° pressure line'),new THREE.Vector3(2.5,0.8,0),'o',()=>showPitch);
addLabel(()=>L('节圆  r = m·z/2','Pitch circle r = m·z/2'),new THREE.Vector3(R_PITCH+0.3,0.2,0),'b',()=>showPitch);

/* ---- state ---- */
let playing=true, pinionAngle=0, rackX=0, autoMode=false, showPitch=false;
let steerTarget=0, steerCurrent=0, speedK=1.0, phaseDir=1;
let simT=0, labelsOn=true;

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  rackBodyM.color.setHex(dark?0x2e3a47:0x6b7d8e);
  pinionM.color.setHex(dark?0x4a7fa5:0x2c5f80);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT') return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps(); updateStats();
}

const STEPS=[
  {zh:'节圆与节线：小齿轮节圆半径 r=m×z/2，节线是齿条的节距线',en:'Pitch circle r=mz/2 rolls without slip on pitch line of rack'},
  {zh:'传动比：节圆每转一圈，位移恰好等于节圆周长 πd',en:'One revolution = πd = π·m·z linear displacement'},
  {zh:'渐开线啮合：接触点沿公切线滑行，压力角恒为 20°',en:'Involute contact: meshing point travels along common tangent at 20°'},
  {zh:'转向架构：两端推拉拉杆，轮胎随齿条平移转向',en:'Steering: rack pushes tie rods, wheels pivot left/right'},
  {zh:'齿隙与误差：正常传动齿隙 ~0.1mm；齿隙过大导致打齿声与转向模糊',en:'Backlash ~0.1mm; excess causes clunk and vague steering'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i; syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function updateStats(){
  const disp=(rackX*10).toFixed(1);
  const ang=(pinionAngle*R2D%360+360)%360;
  const steer=Math.abs(steerCurrent)*R2D;
  const vel=Math.abs(speedK*R_PITCH*60)*10;
  document.getElementById('stDisp').innerHTML=disp+'<small> mm</small>';
  document.getElementById('stAngle').innerHTML=ang.toFixed(0)+'<small> °</small>';
  document.getElementById('stSteer').innerHTML=steer.toFixed(1)+'<small> °</small>';
  document.getElementById('stVel').innerHTML=vel.toFixed(0)+'<small> mm/s</small>';
}

/* tie rod geometry update */
function updateSteering(rx){
  const clampedRX=clamp(rx,-RACK_HALF+0.2,RACK_HALF-0.2);
  // rack end positions
  const lx=clampedRX-RACK_HALF, rx2=clampedRX+RACK_HALF;
  // knuckle pivot points (fixed in space relative to chassis)
  const kLx=-RACK_HALF-TIE_LEN, kRx=RACK_HALF+TIE_LEN;
  // tie rod angle
  const angL=Math.atan2(0,kLx-lx); // simplified
  const steerL=Math.atan2(lx-kLx,TIE_LEN)*1.2;
  const steerR=Math.atan2(rx2-kRx,TIE_LEN)*1.2;
  steerCurrent=(steerL+steerR)*0.5;
  kLeft.rotation.y=steerL; kRight.rotation.y=steerR;
  // update tie rod position/length
  function updateRod(rod,ax,bx){
    const mx=(ax+bx)/2, len=Math.abs(bx-ax);
    rod.position.set(mx,0,0);
    rod.children[0].scale.x=len;
  }
  updateRod(trLeft,lx,kLx+RACK_HALF);
  updateRod(trRight,rx2,kRx-RACK_HALF);
}

/* meshing dot position */
function updateMeshDot(){
  const cx=rackX, cy=-R_PITCH;
  const meshX=cx;
  const meshY=cy+R_PITCH;
  meshDot.position.set(meshX,0,0);
  pitchCircLine.position.set(0,0,0);
  pitchLine.position.y=-R_PITCH;
}

document.getElementById('btnLeft').addEventListener('click',()=>{steerTarget=Math.PI/6; autoMode=false; document.getElementById('btnAuto').classList.remove('on');});
document.getElementById('btnRight').addEventListener('click',()=>{steerTarget=-Math.PI/6; autoMode=false; document.getElementById('btnAuto').classList.remove('on');});
document.getElementById('btnAuto').addEventListener('click',()=>{autoMode=!autoMode; document.getElementById('btnAuto').classList.toggle('on',autoMode);});
document.getElementById('btnPitch').addEventListener('click',()=>{
  showPitch=!showPitch;
  pitchCircLine.visible=showPitch; pitchLine.visible=showPitch; pressArr.visible=showPitch;
  document.getElementById('btnPitch').classList.toggle('on',showPitch);
});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/60;
  document.getElementById('sSpdVal').textContent=(speedK/1.0).toFixed(1)+'×';
});
document.getElementById('play').addEventListener('click',()=>{playing=!playing; document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh'; localStorage.setItem('htw-lang',LANG); applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark'; localStorage.setItem('htw-theme',THEME); applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

const clock=new THREE.Clock();
let raf=null, acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing){
    if(autoMode){
      steerTarget=Math.sin(simT*0.5)*Math.PI/5.5;
    }
    // smoothly steer toward target
    const steerDiff=steerTarget-pinionAngle/(Z_PIN*0.5);
    const dAngle=clamp(steerDiff*2,-speedK*dt*4,speedK*dt*4);
    pinionAngle+=dAngle*20*dt*speedK;
    pinionAngle=clamp(pinionAngle,-Math.PI/2.5,Math.PI/2.5);
    // rack displacement = -pinionAngle * R_PITCH (rolling without slip)
    rackX=-pinionAngle*R_PITCH;
  }
  pinionG.rotation.z=pinionAngle;
  rackG.position.x=rackX;
  pitchCircLine.rotation.z=pinionAngle;
  updateMeshDot();
  updateSteering(rackX);
  // pressure line angle
  pressArr.rotation.z=ALPHA-Math.PI/2+pinionAngle;
  pressArr.position.set(rackX,0,0.2);
  acc+=dt; if(acc>0.1){acc=0; updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis(); if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta(); raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf); raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme(); applyLang(); buildSteps(); start();
</script>
</body>
