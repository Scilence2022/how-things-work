<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>光催化分解水 · 一颗光子劈开水</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #band{width:100%;height:140px;display:block;border:1px solid var(--panel-border);border-radius:8px;margin-top:8px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="光催化分解水 · 一颗光子劈开水" data-en="Photocatalytic Water Splitting · one photon, one electron-hole pair">光催化分解水 · 一颗光子劈开水</h1>
  <div class="sub" data-zh="光子能量≥带隙才吸收:电子跳上导带、空穴留在价带,分奔两岸——电子还原 H⁺ 出 H₂,空穴氧化水出 O₂(2:1);没接站就复合白干,Z 体系双光子接力 · 拖动旋转 / 空格运行/暂停" data-en="Photons with energy ≥ the band gap excite e⁻ up and leave h⁺ behind; they part to opposite shores — e⁻ reduces H⁺ to H₂, h⁺ oxidizes water to O₂ (2:1); without sinks they recombine; the Z-scheme relays two photons · drag to orbit / Space = run/pause">光子能量≥带隙才吸收:电子跳上导带、空穴留在价带,分奔两岸——电子还原 H⁺ 出 H₂,空穴氧化水出 O₂(2:1);没接站就复合白干,Z 体系双光子接力 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="光子能量" data-en="Photon energy">光子能量</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="吸收?" data-en="Absorbed?">吸收?</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="H₂ : O₂ 气泡" data-en="H₂ : O₂ bubbles">H₂ : O₂ 气泡</span><span class="v" id="stB">—</span>
  <span class="k" data-zh="复合损耗" data-en="Recombination loss">复合损耗</span><span class="v" id="stL">—</span>

<div id="panel">
  <div id="actions">
    <button class="abtn on" id="btnCoCat" data-zh="助催化剂 Pt/CoOₓ:开" data-en="cocatalyst Pt/CoOₓ: on">助催化剂 Pt/CoOₓ:开</button>
    <button class="abtn" id="btnZ" data-zh="单颗粒 ⇄ Z 体系" data-en="single ⇄ Z-scheme">单颗粒 ⇄ Z 体系</button>
    <button class="abtn" id="btnBurst" data-zh="打一束光 ▶" data-en="light burst ▶">打一束光 ▶</button>
  </div>
  <div class="row">
    <label data-zh="波长" data-en="Wavelength">波长</label>
    <input id="sWL" type="range" min="250" max="700" step="5" value="365">
    <span class="val" id="sWLVal">365 nm</span>
  </div>
  <div class="row">
    <label data-zh="速度" data-en="Speed">速度</label>
    <input id="sSpd" type="range" min="20" max="300" step="5" value="100">
    <span class="val" id="sSpdVal">1.0×</span>
  </div>
  <canvas id="band" width="356" height="140"></canvas>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../pn-junction/" data-zh="PN 结:同样的载流子分离" data-en="PN junction: same carrier separation">PN 结</a>
    <a href="../photosynthesis-z-scheme/" data-zh="光合作用:生物版 Z 体系" data-en="Photosynthesis: nature's Z-scheme">光合 Z 体系</a>
    <a href="../fuel-cell/" data-zh="氢燃料电池:把 H₂ 用回来" data-en="Fuel cell: using the H₂ back">氢燃料电池</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- 工具 / 主题 / 语言 / URL 参数 ----------
   物理注:E(eV)=1240/λ(nm);TiO₂ Eg=3.2 eV(λ≤387 nm 才吸收)
   BiVO₄ Eg=2.4 eV(λ≤517 nm);水的氧化/还原电位:O₂/H₂O +1.23 V,H⁺/H₂ 0 V(vs NHE)
   TiO₂:CB≈−0.3 V,VB≈+2.9 V;BiVO₄:CB≈+0.2 V,VB≈+2.6 V */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);

/* ---------- 渲染器 / 场景 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(2.2,1.15,10.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(2.0,0.55,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=24;controls.autoRotateSpeed=0.5;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(4,6,8);scene.add(key);

/* ---------- 材料与布景 ---------- */
const water=new THREE.Mesh(new THREE.BoxGeometry(11,4,3),
  new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.07,roughness:0.1}));
water.position.set(1.4,0.7,0);scene.add(water);
function slabMat(){return new THREE.MeshStandardMaterial({color:0x4c6ef5,transparent:true,opacity:0.3,roughness:0.2});}
function dotMat(){return new THREE.MeshStandardMaterial({color:0xc0c8d4,roughness:0.25,metalness:0.85,emissive:0x2288aa,emissiveIntensity:0.15});}
const slab1=new THREE.Group();scene.add(slab1);   // TiO₂
const slab2=new THREE.Group();scene.add(slab2);   // BiVO₄(Z 体系)
function buildSlab(g){
  const s=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.6,0.5),slabMat());g.add(s);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(s.geometry),
    new THREE.LineBasicMaterial({color:0x91a7ff,transparent:true,opacity:0.8}));
  g.add(e);
  for(let i=0;i<3;i++){ // 左岸助催化剂点(电子站)
    const d=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),dotMat());
    d.position.set(-1.25,-0.5+i*0.5,0.3);g.add(d);
  }
  for(let i=0;i<3;i++){ // 右岸助催化剂点(空穴站)
    const d=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),dotMat());
    d.position.set(1.25,-0.5+i*0.5,0.3);g.add(d);
  }
}
buildSlab(slab1);buildSlab(slab2);
slab2.visible=false;

/* 光子 / 载流子 / 气泡 / 闪光池 */
const mPhot=()=>new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0.95});
const photons=[];for(let i=0;i<10;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),mPhot());
  m.visible=false;scene.add(m);
  photons.push({m,on:false});
}
const mE=new THREE.MeshStandardMaterial({color:0x4dabf7,emissive:0x1971c2,emissiveIntensity:0.9,roughness:0.3});
const mH=new THREE.MeshStandardMaterial({color:0xff8787,emissive:0xc92a2a,emissiveIntensity:0.9,roughness:0.3});
const carriers=[];for(let i=0;i<24;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.085,10,8),mE);
  m.visible=false;scene.add(m);
  carriers.push({m,on:false,type:'e',relay:false,x:0,y:0,z:0,tx:0,ty:0,tz:0,gx:0});
}
const mB1=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.75,roughness:0.1});
const mB2=new THREE.MeshStandardMaterial({color:0x63e6be,transparent:true,opacity:0.75,roughness:0.1});
const bubbles=[];for(let i=0;i<14;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),mB1);
  m.visible=false;scene.add(m);
  bubbles.push({m,on:false,x:0,y:0});
}
const mFlash=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
const flashes=[];for(let i=0;i<6;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.3,12,10),mFlash.clone());
  m.visible=false;scene.add(m);
  flashes.push({m,t:9});
}

/* ---------- 标签 ---------- */
const labelReg=[];
let labelsOn=true;
function addLabel(fn,pos,cls='',visFn){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,fn,vis:visFn||(()=>true)});return o;
}
addLabel(()=>L('水溶液','aqueous solution'),new THREE.Vector3(-3.6,2.35,0),'b');
const lblTi=addLabel(()=>L('TiO₂(Eg 3.2 eV,只吃紫外)','TiO₂ (Eg 3.2 eV, UV only)'),new THREE.Vector3(slab1.position.x,2.0,0),'b');
const lblPt=addLabel(()=>L('Pt:接住电子 → 析 H₂','Pt: catches e⁻ → H₂'),new THREE.Vector3(slab1.position.x-1.8,0.2,0),'g');
const lblNi=addLabel(()=>L('NiO:收走空穴','NiO: takes h⁺'),new THREE.Vector3(slab1.position.x+1.8,0.2,0),'o',()=>!zMode);
addLabel(()=>L('BiVO₄(Eg 2.4 eV,可见光)','BiVO₄ (Eg 2.4 eV, visible)'),new THREE.Vector3(3.4,2.0,0),'g',()=>zMode);
addLabel(()=>L('CoOₓ:收空穴 → 产 O₂','CoOₓ: takes h⁺ → O₂'),new THREE.Vector3(5.4,0.2,0),'o',()=>zMode);
addLabel(()=>L('Z 接力:BiVO₄ 的 e⁻ 与 TiO₂ 的 h⁺ 复合,好复合!','Z relay: BiVO₄ e⁻ meets TiO₂ h⁺ — the good kind'),new THREE.Vector3(1.9,1.7,0),'o',()=>zMode&&relayShow>0);
const lblStatus=addLabel(()=>{
  if(!cocat)return L('没有助催化剂:e⁻ 与 h⁻ 相遇复合,发光发热白干','no cocatalyst: e⁻ and h⁺ recombine — light and heat, nothing else');
  return L('助催化剂接站:载流子分奔两岸,气泡 2:1 冒出','cocatalysts at work: carriers part to both shores, bubbles 2:1');
},new THREE.Vector3(1.4,3.0,0),'o');

/* ---------- 状态 ---------- */
let playing=!(qs.get('pause')==='1');
let speed=clamp(parseFloat(qs.get('speed'))||1,0.2,3);
let WL=365,cocat=true,zMode=false,simT=0;
let eCount=0,hCount=0,recN=0,absN=0,lastAbs=null;
let photonAcc=0,relayE=null,relayH=null,relayShow=0;
let bandAnim={t:9,side:0};
const EG1=3.2,EG2=2.4;
const photonE=()=>1240/WL;

/* 波长→颜色(近似) */
function wlColor(w){
  let r=0,g=0,b=0;
  if(w<440){r=-(w-440)/60;b=1;}
  else if(w<490){g=(w-440)/50;b=1;}
  else if(w<510){g=1;b=-(w-510)/20;}
  else if(w<580){r=(w-510)/70;g=1;}
  else if(w<645){r=1;g=-(w-645)/65;}
  else{r=1;g=0.15;}
  return new THREE.Color(clamp(r,0,1),clamp(g,0,1),clamp(b,0,1));
}

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
  drawBand();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('光催化分解水 · 一颗光子劈开水','Photocatalytic Water Splitting');
  buildSteps();updateStats();drawBand();
}

/* ---------- 步骤 ---------- */
const STEPS=[
 {b:'光子≥带隙才被吃下',be:'Only photons ≥ the gap get absorbed',
  d:'E=1240/λ(eV):TiO₂ 带隙 3.2 eV,只有 λ≤387 nm 的紫外能把它从价带打到导带;红光直接穿过去。',
  de:'E=1240/λ: TiO₂ needs λ≤387 nm; redder photons pass straight through.',
  act:()=>{setWL(365);}},
 {b:'电子上导带,空穴留价带',be:'e⁻ up to CB, h⁺ left in VB',
  d:'一颗光子激发出一对载流子:电子(蓝)在导带,空穴(红)在价带——它们天生互相吸引。',
  de:'One photon, one pair: the electron (blue) and hole (red) are born attracted to each other.',
  act:()=>{burst(3);}},
 {b:'分奔两岸:还原与氧化',be:'They part: reduction vs oxidation',
  d:'电子跑向还原位把 H⁺ 还原成 H₂;空穴跑向氧化位把 H₂O 氧化成 O₂——总反应 2H₂O→2H₂+O₂,气泡 2:1。',
  de:'e⁻ reduces H⁺ to H₂ at one shore; h⁺ oxidizes water to O₂ at the other — 2H₂O → 2H₂+O₂.',
  act:()=>{cocat=true;syncBtns();burst(4);}},
 {b:'天敌:电子-空穴复合',be:'The enemy: recombination',
  d:'没有接站,电子空穴几纳秒内复合,能量变成光和热——这是光催化效率低的头号原因。',
  de:'With no sinks, the pair recombines in nanoseconds into light and heat — the No.1 efficiency killer.',
  act:()=>{cocat=false;syncBtns();burst(4);}},
 {b:'助催化剂:给载流子接站',be:'Cocatalysts: depots for carriers',
  d:'Pt 费米能级低,接走电子;CoOₓ/NiO 接走空穴——把载流子「运出」颗粒,复合被掐断。',
  de:'Pt sinks electrons, CoOₓ sinks holes: carriers are shipped out of the particle before they can recombine.',
  act:()=>{cocat=true;syncBtns();burst(5);}},
 {b:'Z 体系:双光子接力',be:'Z-scheme: two photons, one relay',
  d:'两个较窄带隙接力:BiVO₄ 的电子与 TiO₂ 的空穴在中间「好复合」,留下最强的电子产 H₂、最强的空穴产 O₂。',
  de:'Two narrow gaps relay: BiVO₄ e⁻ recombines with TiO₂ h⁺ (the good recombination), leaving the strongest carriers for water.',
  act:()=>{zMode=true;syncBtns();cocat=true;burst(6);}},
];
let activeStep=0;
function stepIndex(){
  if(zMode)return 5;
  if(!cocat)return 3;
  return (eCount+hCount)>2?2:1;
}
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps(true);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(manual){
  const si=manual?activeStep:stepIndex();
  if(!manual)activeStep=si;
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===si));
}
function syncBtns(){
  document.getElementById('btnCoCat').classList.toggle('on',cocat);
  document.getElementById('btnZ').classList.toggle('on',zMode);
}
function setWL(w){
  WL=w;
  document.getElementById('sWL').value=w;
  document.getElementById('sWLVal').textContent=w+' nm';
}
function burst(n){for(let i=0;i<n;i++)spawnPhoton(i*0.12);}

/* ---------- 光子 ---------- */
function spawnPhoton(delay){
  const p=photons.find(p=>!p.on);if(!p)return;
  p.on=true;p.delay=delay||0;p.pass=0;
  p.x=-4.6;p.y=1.9-Math.random()*1.6;p.z=(Math.random()*2-1)*0.4;
  p.m.material.opacity=0.95;
  p.target=zMode?(photons.indexOf(p)%2===0?slab1:slab2):slab1;
}
function photonUpdate(dt){
  for(const p of photons){
    if(!p.on)continue;
    if(p.delay>0){p.delay-=dt;continue;}
    const tx=p.target.position.x,ty=0.7;
    const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
    const v=4.6*dt*speed;
    if(d<v+0.32){
      /* 到达颗粒:按带隙判吸收 */
      const Eg=p.target===slab1?EG1:EG2;
      if(photonE()>=Eg){
        p.on=false;p.m.visible=false;
        absN++;lastAbs=true;
        bandAnim={t:0,side:p.target===slab1?0:1};
        excite(p.target);
      }else{
        lastAbs=false;
        p.pass=(p.pass||0)+1;
        if(p.pass>2){p.on=false;p.m.visible=false;}
        p.x+=dx/d*v;p.y+=dy/d*v; // 直接穿过去
        p.m.position.set(p.x,p.y,p.z);
        p.m.material.opacity=Math.max(0,0.95-p.pass*0.3);
      }
      continue;
    }
    p.x+=dx/d*v;p.y+=dy/d*v;
    p.m.position.set(p.x,p.y,p.z);
  }
}

/* ---------- 载流子 ----------
   goal=true:奔向指定岸口;relay:Z 接力,等配对后一起冲向中间点;
   其余(无助催化剂/接力缺伴)在颗粒内游荡,碰上异类就复合 */
function excite(slab){
  const sx=slab.position.x;
  const mk=(type)=>{const c=carriers.find(c=>!c.on);if(!c)return null;
    c.on=true;c.type=type;c.relay=false;c.goal=false;
    c.m.material=type==='e'?mE:mH;c.m.visible=true;
    c.x=sx+(Math.random()*2-1)*0.7;c.y=0.7+(Math.random()*2-1)*0.5;c.z=0.1;
    c.gx=sx;return c;};
  const e=mk('e'),h=mk('h');
  if(!e||!h)return;
  if(!cocat)return; // 无接站:原地游荡,等复合
  if(!zMode){
    e.goal=true;e.tx=sx-1.35;e.ty=0.7+(Math.random()*2-1)*0.5;
    h.goal=true;h.tx=sx+1.35;h.ty=0.7+(Math.random()*2-1)*0.5;
  }else if(slab===slab1){
    e.goal=true;e.tx=sx-1.35;e.ty=0.7;
    if(!relayH){h.relay=true;relayH=h;}
  }else{
    h.goal=true;h.tx=sx+1.35;h.ty=0.7;
    if(!relayE){e.relay=true;relayE=e;}
  }
}
function carrierUpdate(dt){
  const relayX=(slab1.position.x+1.35+slab2.position.x-1.35)/2; // Z 接力点
  const relayActive=zMode&&cocat&&relayE&&relayH&&relayE.on&&relayH.on;
  if(relayActive){
    relayE.tx=relayX;relayE.ty=0.7;relayH.tx=relayX;relayH.ty=0.7;
    relayShow=1;
  }else relayShow=Math.max(0,relayShow-dt);
  const v=1.7*dt*speed;
  for(const c of carriers){
    if(!c.on)continue;
    const wander=!cocat||(c.relay&&!relayActive)||(!c.relay&&!c.goal);
    if(wander){
      c.x+=(Math.random()-0.5)*dt*2.4;c.y+=(Math.random()-0.5)*dt*2.0;
      c.x=clamp(c.x,c.gx-1.0,c.gx+1.0);c.y=clamp(c.y,0.05,1.4);
    }else{
      const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);
      if(d<v&&!c.relay){
        c.on=false;c.m.visible=false;
        if(c.type==='e'){eCount++;if(eCount%2===0)spawnBubble('h2',c.tx);}
        else{hCount++;if(hCount%4===0)spawnBubble('o2',c.tx);}
        continue;
      }
      if(d>0.001){c.x+=dx/d*Math.min(v,d);c.y+=dy/d*Math.min(v,d);}
    }
    c.m.position.set(c.x,c.y,c.z);
  }
  /* 游荡载流子相遇:复合(损耗) */
  for(let i=0;i<carriers.length;i++)for(let j=i+1;j<carriers.length;j++){
    const a=carriers[i],b=carriers[j];
    if(!a.on||!b.on||a.type===b.type)continue;
    const aW=!cocat||(a.relay&&!relayActive)||(!a.relay&&!a.goal);
    const bW=!cocat||(b.relay&&!relayActive)||(!b.relay&&!b.goal);
    if(!aW||!bW)continue;
    if(Math.hypot(a.x-b.x,a.y-b.y)<0.2){
      a.on=b.on=false;a.m.visible=b.m.visible=false;
      recN++;flashAt((a.x+b.x)/2,(a.y+b.y)/2);
    }
  }
  /* Z 接力:好复合(不算损耗) */
  if(relayActive&&Math.hypot(relayE.x-relayH.x,relayE.y-relayH.y)<0.22){
    relayE.on=relayH.on=false;
    relayE.m.visible=relayH.m.visible=false;
    flashAt(relayX,0.7);
    relayE=relayH=null;
  }
}

/* ---------- 气泡 / 闪光 ---------- */
function spawnBubble(kind,x){
  const b=bubbles.find(b=>!b.on);if(!b)return;
  b.on=true;b.m.visible=true;
  b.m.material=kind==='h2'?mB1:mB2;
  b.m.scale.setScalar(kind==='h2'?0.8:1.0);
  b.x=x+(Math.random()*2-1)*0.15;b.y=0.6;
  b.m.position.set(b.x,b.y,0.35);
}
function bubbleUpdate(dt){
  for(const b of bubbles){
    if(!b.on)continue;
    b.y+=dt*0.9*speed;b.x+=Math.sin(simT*5+b.y*4)*dt*0.12;
    b.m.position.set(b.x,b.y,0.35);
    if(b.y>2.5){b.on=false;b.m.visible=false;}
  }
}
function flashAt(x,y){
  const f=flashes.find(f=>f.t>1);if(!f)return;
  f.t=0;f.m.visible=true;f.m.position.set(x,y,0.4);
}
function flashUpdate(dt){
  for(const f of flashes){
    if(f.t>1)continue;
    f.t+=dt*2.2;
    f.m.scale.setScalar(0.4+f.t*3);
    f.m.material.opacity=Math.max(0,0.85*(1-f.t));
    if(f.t>=1)f.m.visible=false;
  }
}

/* ---------- 统计 ---------- */
function updateStats(){
  document.getElementById('stE').innerHTML=photonE().toFixed(2)+'<small> eV('+WL+' nm)</small>';
  const Eg=zMode?EG2:EG1;
  const stA=document.getElementById('stA');
  stA.textContent=lastAbs===null?'—':lastAbs?L('吸收 ✓','absorbed ✓'):L('透过(能量不够)','passes (too weak)');
  stA.style.color=lastAbs===false?'#ff6b6b':'';
  document.getElementById('stB').textContent=(eCount/2|0)+' : '+(hCount/4|0);
  const tot=eCount+hCount+recN;
  document.getElementById('stL').innerHTML=(tot?(recN/tot*100).toFixed(0):0)+'<small> %</small>';
}

/* ---------- 能带图(2D canvas,与场景联动) ---------- */
const band=document.getElementById('band'),bx=band.getContext('2d');
function drawBand(){
  const W=band.width,H=band.height,dark=THEME==='dark';
  bx.clearRect(0,0,W,H);
  bx.fillStyle=dark?'rgba(255,255,255,.04)':'rgba(15,25,40,.05)';
  bx.fillRect(0,0,W,H);
  const yv=V=>12+(V+0.8)/4.1*(H-30); // 电位 V → y(负能位在上)
  const txt=(s,x,y,c)=>{bx.fillStyle=c||(dark?'#9fb0c3':'#5b6b7d');bx.font='10px sans-serif';bx.textAlign='left';bx.fillText(s,x,y);};
  /* 氧化还原电位虚线 */
  bx.setLineDash([4,3]);
  bx.strokeStyle=dark?'rgba(255,255,255,.35)':'rgba(15,25,40,.4)';
  bx.beginPath();bx.moveTo(30,yv(0));bx.lineTo(W-10,yv(0));bx.stroke();
  bx.beginPath();bx.moveTo(30,yv(1.23));bx.lineTo(W-10,yv(1.23));bx.stroke();
  bx.setLineDash([]);
  txt('H⁺/H₂  0 V',W-92,yv(0)-3);txt('O₂/H₂O  +1.23 V',W-122,yv(1.23)-3);
  function drawCol(x0,name,cb,vb,eg,col){
    bx.strokeStyle=col;bx.lineWidth=3;
    bx.beginPath();bx.moveTo(x0,yv(cb));bx.lineTo(x0+74,yv(cb));bx.stroke();
    bx.strokeStyle=col==='#4dabf7'?'#c92a2a':'#e8890c';
    bx.beginPath();bx.moveTo(x0,yv(vb));bx.lineTo(x0+74,yv(vb));bx.stroke();
    txt(name+' CB '+cb.toFixed(1)+' V',x0,yv(cb)-4);
    txt(name+' VB +'+vb.toFixed(1)+' V',x0,yv(vb)+11);
    txt('Eg='+eg.toFixed(1)+' eV',x0+16,(yv(cb)+yv(vb))/2+3);
  }
  const x1=zMode?26:120,x2=226;
  drawCol(x1,'TiO₂',-0.3,2.9,3.2,'#4dabf7');
  if(zMode){
    drawCol(x2,'BiVO₄',0.2,2.6,2.4,'#51cf66');
    /* Z 中笔:BiVO₄ CB 电子 → TiO₂ VB 空穴 */
    bx.strokeStyle='#ffa94d';bx.lineWidth=2;
    bx.beginPath();bx.moveTo(x2+4,yv(0.2));bx.lineTo(x1+70,yv(2.9));bx.stroke();
    txt('接力复合(好复合)',(x1+x2)/2-16,yv(1.55)+3,'#ffa94d');
  }
  /* 光子跃迁箭头动画 */
  if(bandAnim.t<1){
    const t=bandAnim.t,side=bandAnim.side;
    const x0=(side===0?x1:x2)+37;
    const vTop=side===0?-0.3:0.2,vBot=side===0?2.9:2.6;
    bx.strokeStyle='#ffd43b';bx.lineWidth=2;
    bx.beginPath();bx.moveTo(x0,yv(vBot)-(yv(vBot)-yv(vTop))*t);
    bx.lineTo(x0,yv(vBot)-(yv(vBot)-yv(vTop))*t-8);bx.stroke();
  }
  txt('电位 vs NHE ↑',8,H-6);
}

/* ---------- 交互 ---------- */
document.getElementById('sWL').addEventListener('input',e=>{
  WL=+e.target.value;
  document.getElementById('sWLVal').textContent=WL+' nm';
});
document.getElementById('btnCoCat').addEventListener('click',()=>{
  cocat=!cocat;syncBtns();
  document.getElementById('btnCoCat').textContent=cocat?L('助催化剂 Pt/CoOₓ:开','cocatalyst Pt/CoOₓ: on'):L('助催化剂:关(看复合!)','cocatalyst: off (watch recombination!)');
});
document.getElementById('btnZ').addEventListener('click',()=>{
  zMode=!zMode;slab2.visible=zMode;
  slab1.position.x=zMode?0.2:1.6;
  for(const c of carriers){c.on=false;c.m.visible=false;}
  relayE=relayH=null;
  document.getElementById('btnZ').textContent=zMode?L('Z 体系:开','Z-scheme: on'):L('单颗粒 ⇄ Z 体系','single ⇄ Z-scheme');
  syncBtns();
});
document.getElementById('btnBurst').addEventListener('click',()=>burst(5));
const elSpd=document.getElementById('sSpd');
elSpd.value=Math.round(speed*100);
elSpd.addEventListener('input',e=>{
  speed=+e.target.value/100;
  document.getElementById('sSpdVal').textContent=speed.toFixed(1)+'×';
});
const elPlay=document.getElementById('play');
function setPlayLabel(){elPlay.textContent=playing?L('暂停','Pause'):L('运行','Run');}
elPlay.addEventListener('click',()=>{playing=!playing;setPlayLabel();});
const tglLabels=document.getElementById('tglLabels');
tglLabels.addEventListener('change',()=>{labelsOn=tglLabels.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{
  LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();
});
document.getElementById('themeBtn').addEventListener('click',()=>{
  THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();
});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();elPlay.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
if(qs.get('labels')==='0'){tglLabels.checked=false;labelsOn=false;}

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  bandAnim.t+=dt*1.4;
  if(playing){
    photonAcc+=dt*speed;
    if(photonAcc>0.55){photonAcc=0;spawnPhoton(0);}
    photonUpdate(dt);
    carrierUpdate(dt);
    bubbleUpdate(dt);
  }
  flashUpdate(dt);
  /* 光子颜色随波长 */
  const pc=wlColor(WL);
  for(const p of photons)if(p.on&&p.delay<=0&&!p.pass)p.m.material.color.copy(pc);
  acc+=dt;if(acc>0.1){acc=0;updateStats();syncSteps();drawBand();}
  /* 跟随 TiO₂ 颗粒位置的标签 */
  lblTi.position.x=slab1.position.x;
  lblPt.position.x=slab1.position.x-1.8;
  lblNi.position.x=slab1.position.x+1.8;
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.fn();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();syncBtns();updateStats();setPlayLabel();
if(document.hidden)stop();else start();
</script>
