<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肺泡与呼吸膜 · 一口气走多远</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }
  #stats .v.b { color: #74c0fc; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffccb8; border-color: rgba(255,169,120,.7); }
  .chip.c { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="肺泡与呼吸膜:0.5 微米厚的换气站" data-en="Alveoli &amp; the Respiratory Membrane: a 0.5 µm exchange">肺泡与呼吸膜:0.5 微米厚的换气站</h1>
  <div class="sub" data-zh="3 亿个肺泡摊开 70 m²;气体只走「下坡」——分压差从肺泡指向血液;表面活性物质像洗洁精防止小泡被吸瘪 · 空格播放/暂停" data-en="300 million alveoli spread 70 m²; gas only flows downhill — partial pressure gradients point from alveolus to blood; surfactant works like detergent to keep the small sacs open · Space = play/pause">3 亿个肺泡摊开 70 m²;气体只走「下坡」——分压差从肺泡指向血液;表面活性物质像洗洁精防止小泡被吸瘪 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="呼吸节律" data-en="breath cycle">呼吸节律</span><span class="v g" id="stBr">—</span>
  <span class="k" data-zh="O₂ 分压:肺泡→血" data-en="pO₂ alv→blood">O₂ 分压:肺泡→血</span><span class="v" id="stPO2">—</span>
  <span class="k" data-zh="CO₂ 分压:血→肺泡" data-en="pCO₂ blood→alv">CO₂ 分压:血→肺泡</span><span class="v" id="stPCO2">—</span>
  <span class="k" data-zh="血氧装载" data-en="O₂ loaded">血氧装载</span><span class="v b" id="stLoad">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="O₂(橙,下坡进血)" data-en="O₂ (orange, downhill to blood)">O₂(橙,下坡进血)</span>
    <span class="chip.c" data-zh="CO₂(绿,反向排出)" data-en="CO₂ (green, back out)">CO₂(绿,反向排出)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnAlt" data-zh="切到高原(肺泡 pO₂↓)" data-en="switch to altitude (low pO₂)">切到高原(肺泡 pO₂↓)</a>
  </div>
  <div class="row"><label data-zh="呼吸频率" data-en="breath rate">呼吸频率</label><input id="rate" type="range" min="8" max="30" step="1" value="14"><span class="val" id="rateVal">14/min</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../hemoglobin-mwc/" data-zh="下游:血红蛋白装货" data-en="downstream: hemoglobin loads up">下游:血红蛋白装货</a>
    <a href="../random-walk/" data-zh="扩散的物理:随机游走" data-en="the physics: random walks">扩散的物理:随机游走</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  tissue.material.opacity = THEME === 'dark' ? 0.16 : 0.26;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('肺泡与呼吸膜', 'Alveoli & Gas Exchange');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.4, 1.8, 6.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  alv: mat(0xffd8a8, { opacity: 0.55, roughness: 0.3 }),
  cap: mat(0xff6b6b, { opacity: 0.8 }),
  blood: mat(0xc92a2a, { opacity: 0.6 }),
  o2: new THREE.MeshBasicMaterial({ color: 0xffa94d, blending: THREE.AdditiveBlending, transparent: true }),
  co2: new THREE.MeshBasicMaterial({ color: 0x63e6be, blending: THREE.AdditiveBlending, transparent: true }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.4, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.5;
scene.add(base);
/* 组织背景板 */
const tissue = new THREE.Mesh(new THREE.BoxGeometry(5.4, 3.4, 3.6),
  new THREE.MeshBasicMaterial({ color: 0x8a3b3b, transparent: true, opacity: 0.16, side: THREE.BackSide }));
tissue.position.y = 1.2;
scene.add(tissue);

/* ================= 肺泡簇 ================= */
const alveoli = [];
const ALV = 9;
for (let i = 0; i < ALV; i++) {
  const a = i / ALV * Math.PI * 2;
  const pos = new THREE.Vector3(Math.cos(a) * 1.25, 1.15 + Math.sin(i * 2.3) * 0.55, Math.sin(a) * 1.05);
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.52, 24, 18), M.alv);
  m.position.copy(pos);
  m.scale.set(1, 0.9, 1);
  scene.add(m);
  alveoli.push(m);
}
/* 毛细血管网(围绕肺泡的管道环) */
const capTubes = [];
for (let i = 0; i < ALV; i++) {
  const pts = [];
  for (let k = 0; k <= 12; k++) {
    const a = k / 12 * Math.PI * 2;
    const p = alveoli[i].position.clone().add(new THREE.Vector3(Math.cos(a) * 0.75, Math.sin(a) * 0.55, 0));
    pts.push(p);
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.075, 8, true), M.cap);
  scene.add(tube);
  capTubes.push(tube);
}
/* 血流小红球 */
const rbc = [];
for (let i = 0; i < 22; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), M.blood);
  scene.add(m);
  rbc.push({ mesh: m, pipe: i % ALV, t: Math.random() });
}

/* ================= 状态(标签之前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let rate = 14;              // 每分钟
let tSim = 0;
let breathT = 0;            // 0..1 呼吸相位
let altitude = false;
let o2Loaded = 0;           // 统计装载 O₂ 数
const alive = [];           // 气体粒子 {mesh, kind, dir, from, to, t}

function pAlvO2() { return altitude ? 45 : 100; }    // mmHg
function pAlvCO2() { return 40; }
function pBloodO2() { return altitude ? 30 : 40; }
function pBloodCO2() { return 45; }

/* 气体粒子 */
function spawnGas(kind) {
  const alv = alveoli[Math.floor(Math.random() * ALV)];
  const side = new THREE.Vector3((Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.6, 0.1);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), kind === 'o2' ? M.o2 : M.co2);
  mesh.position.copy(alv.position).add(side);
  scene.add(mesh);
  const g = { mesh, kind, t: 0, from: mesh.position.clone(), to: null, alv };
  /* O₂:肺泡→血(只有存在下坡才走);CO₂:血→肺泡 */
  if (kind === 'o2' && pAlvO2() > pBloodO2()) g.to = alv.position.clone().add(side.clone().multiplyScalar(2.1));
  if (kind === 'co2' && pBloodCO2() > pAlvCO2()) {
    g.from = alv.position.clone().add(side.clone().multiplyScalar(2.1));
    g.mesh.position.copy(g.from);
    g.to = alv.position.clone().add(side);
  }
  if (!g.to) { scene.remove(mesh); return; }
  alive.push(g);
}

/* ================= 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblAlv = addLabel(() => L('肺泡簇:吸气时胀大,3 亿个摊开 70 m²(一个羽毛球场)', 
  'alveolar cluster: sacs inflate on inhale; 300 million spread 70 m² (a badminton court)'),
  new THREE.Vector3(0, 2.65, 0), 'o');
const lblMem = addLabel(() => L('呼吸膜 ≈ 0.5 µm:肺泡上皮 + 基膜 + 毛细血管内皮——气体靠分压差「下坡」自由扩散', 
  'respiratory membrane ≈ 0.5 µm: alveolar epithelium + basement membrane + capillary endothelium — gases diffuse freely down their pressure gradients'),
  new THREE.Vector3(0, 0.1, 1.6), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '3 亿个小气囊', be: '300 million little sacs',
    d: '肺不是两个大气球,而是 3 亿个 0.2mm 的肺泡——把表面积摊平有 70 m²,交换效率靠「面积」,不靠「力气」。',
    de: 'The lung is not two balloons but 300 million 0.2 mm alveoli — flattened to 70 m². Exchange efficiency comes from area, not effort.',
    act: () => {} },
  { b: '吸气:膈肌拉大容积', be: 'Inhale: the diaphragm widens the box',
    d: '膈肌下压→胸腔容积变大→肺内压降到比大气低 1-2 mmHg→空气自己「灌」进来。呼气只是放松回弹。',
    de: 'The diaphragm drops, chest volume grows, alveolar pressure dips 1-2 mmHg below ambient — air pours itself in. Exhaling is just elastic recoil.',
    act: () => {} },
  { b: '分压差:气体只走下坡', be: 'Partial pressure: gases only flow downhill',
    d: '肺泡 pO₂ 100 mmHg > 静脉血 40 → O₂ 进血;pCO₂ 45 > 40 → CO₂ 出血。0.5 µm 的呼吸膜让扩散只需 0.25 秒。',
    de: 'Alveolar pO₂ 100 mmHg > venous 40 → O₂ in; pCO₂ 45 > 40 → CO₂ out. Across the 0.5 µm membrane diffusion takes 0.25 s.',
    act: () => {} },
  { b: '表面活性物质:防塌陷的洗洁精', be: 'Surfactant: the anti-collapse detergent',
    d: '小泡的表面张力想把泡吸瘪(拉普拉斯定律:越小越狠)。II 型细胞分泌的表面活性物质把张力砍到 1/10——早产儿缺它,肺泡打不开。',
    de: 'Surface tension wants small sacs collapsed (Laplace: smaller is deadlier). Type II cells secrete surfactant cutting tension to 1/10 — premature babies without it can\'t open their lungs.',
    act: () => {} },
  { b: '高原模式:下坡变缓', be: 'Altitude: the hill flattens',
    d: '切到高原,肺泡 pO₂ 只有 45:坡度减半、氧装载变慢——身体靠加快呼吸与多造红细胞(几天到几周)代偿。',
    de: 'At altitude alveolar pO₂ drops to 45: half the slope, slower loading — the body compensates with faster breathing and more red cells over days to weeks.',
    act: () => document.getElementById('btnAlt').click() },
];
function stepIndex() {
  if (altitude) return 4;
  const phase = breathT % 1;
  if (phase < 0.15) return 1;
  if (o2Loaded > 6) return 2;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const btnAlt = document.getElementById('btnAlt');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setAlt(v) {
  altitude = v;
  btnAlt.textContent = altitude ? L('切回平原(恢复 pO₂)', 'back to sea level') : L('切到高原(肺泡 pO₂↓)', 'switch to altitude (low pO₂)');
}
btnAlt.addEventListener('click', () => setAlt(!altitude));
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
document.getElementById('rate').addEventListener('input', e => {
  rate = parseInt(e.target.value);
  document.getElementById('rateVal').textContent = rate + '/min';
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let gasCD = 0;
let loadWindow = [];
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;
  breathT += dts * rate / 60;

  /* 呼吸缩放 */
  const phase = breathT % 1;
  const s = 1 + 0.18 * Math.sin(phase * Math.PI * 2);
  for (const a of alveoli) a.scale.set(s, s * 0.9, s);

  /* 气体生成 */
  gasCD -= dts;
  if (gasCD <= 0) {
    gasCD = 0.12;
    if (alive.length < 40) {
      spawnGas('o2');
      spawnGas('co2');
    }
  }
  /* 气体飞行 */
  for (let i = alive.length - 1; i >= 0; i--) {
    const g = alive[i];
    g.t += dts * 1.1;
    g.mesh.position.lerpVectors(g.from, g.to, clamp(g.t, 0, 1));
    g.mesh.material.opacity = Math.sin(clamp(g.t, 0, 1) * Math.PI);
    if (g.t >= 1) {
      scene.remove(g.mesh);
      alive.splice(i, 1);
      if (g.kind === 'o2') { o2Loaded++; loadWindow.push(tSim); }
    }
  }
  /* RBC 沿毛细血管环流 */
  for (const r of rbc) {
    r.t = (r.t + dts * 0.05 * (0.7 + rate / 20)) % 1;
    const pts = [];
    void pts;
    const alv = alveoli[r.pipe];
    const a = r.t * Math.PI * 2;
    r.mesh.position.copy(alv.position).add(new THREE.Vector3(Math.cos(a) * 0.75, Math.sin(a) * 0.55, 0));
    r.mesh.material.color.setHSL(0, 0.75, altitude ? 0.32 : 0.42 + 0.1 * Math.sin(a));
  }
  loadWindow = loadWindow.filter(t => tSim - t < 3);

  document.getElementById('stBr').innerHTML = rate + '<small>/min</small>';
  document.getElementById('stPO2').innerHTML = `${pAlvO2()} <small>→</small> ${pBloodO2()} <small>mmHg</small>`;
  document.getElementById('stPCO2').innerHTML = `${pBloodCO2()} <small>→</small> ${pAlvCO2()} <small>mmHg</small>`;
  document.getElementById('stLoad').innerHTML = (loadWindow.length / 3).toFixed(0) + '<small> /s</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
