<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const TAU=Math.PI*2;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- renderer ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,2000);
camera.position.set(0,20,22);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=2; controls.maxDistance=400;
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const key=new THREE.PointLight(0xfff2dd,180,300); scene.add(key);

/* ---- 模式与状态 ----
   单位：AU、年。GM☉=4π²。木星 a=5.2 AU，P=11.86 yr。
   共振=会合每次发生在同一轨道相位：摄动相干叠加。
   演示把真实木星质量乘以「扰动增益」：真实时间尺度 10⁴–10⁶ 年，
   增益 G 等效于把混沌扩散加速 ~G 倍（柯克伍德空隙数万年内成形）。 */
const GMS=4*Math.PI*2, MJ=9.5458e-4, AJ=5.2, NJ=TAU/11.862;
let mode='belt', gain=200, ratio=2.0, rateYr=8, simYr=0;
let playing=true, labelsOn=true;
const Q=new URLSearchParams(location.search);
playing=!Q.has('pause');
labelsOn=Q.get('labels')!=='0';
if(Q.get('speed'))rateYr=clamp(+Q.get('speed')||8,0.5,60);

const AU=2.2; // 场景缩放：1 AU = 2.2 单位

/* ---- 太阳与木星 ---- */
const sun=new THREE.Mesh(new THREE.SphereGeometry(0.9,24,18),new THREE.MeshBasicMaterial({color:0xffd97a}));
scene.add(sun);
const jup=new THREE.Mesh(new THREE.SphereGeometry(0.45,20,16),new THREE.MeshBasicMaterial({color:0xd9a066}));
scene.add(jup);
const beltGroup=new THREE.Group(), ioGroup=new THREE.Group(), plutoGroup=new THREE.Group();
scene.add(beltGroup,ioGroup,plutoGroup);

/* ---- 柯克伍德空隙：小行星带 N 体 ---- */
const NB=420;
const bx=new Float32Array(NB),by=new Float32Array(NB),bvxE=new Float32Array(NB),bvy=new Float32Array(NB);
const alive=new Uint8Array(NB);
let beltPos,beltGeo,beltPts;
{
  const p=new Float32Array(NB*3),c=new Float32Array(NB*3);
  for(let i=0;i<NB;i++){c[i*3]=0.82;c[i*3+1]=0.84;c[i*3+2]=0.9;}
  beltGeo=new THREE.BufferGeometry();
  beltGeo.setAttribute('position',new THREE.BufferAttribute(p,3));
  beltGeo.setAttribute('color',new THREE.BufferAttribute(c,3));
  beltPts=new THREE.Points(beltGeo,new THREE.PointsMaterial({size:0.09,vertexColors:true,sizeAttenuation:true}));
  beltGroup.add(beltPts);beltPos=p;
}
function beltInit(){
  for(let i=0;i<NB;i++){
    const a=2.05+1.5*Math.random(),e=0.08*Math.random(),th=Math.random()*TAU;
    const r=a*(1-e*e)/(1+e*Math.cos(th));
    const v=Math.sqrt(GMS/a); // 近圆轨道
    bx[i]=r*Math.cos(th);by[i]=r*Math.sin(th);
    const h=Math.sqrt(GMS*r); // 角动量（近圆）
    bvxE[i]=-h*by[i]/(r*r);bvy[i]=h*bx[i]/(r*r);
    alive[i]=1;
  }
  beltGeo.attributes.color.needsUpdate=true;
}
/* 演示小行星（高亮）+ 尾迹 */
let dx=0,dy=0,dvx=0,dvy=0,demoE=0,demoEj=0;
const trailPts=[];
const trailLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3()]),
  new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.85}));
beltGroup.add(trailLine);
const demoDot=new THREE.Mesh(new THREE.SphereGeometry(0.22,14,12),new THREE.MeshBasicMaterial({color:0xffa94d}));
beltGroup.add(demoDot);
function demoPlace(){
  const a=AJ*Math.pow(ratio,-2/3);
  const th=Math.atan2(dy||0.5,dx||1);
  dx=a*Math.cos(th);dy=a*Math.sin(th);
  const h=Math.sqrt(GMS*a);
  dvx=-h*Math.sin(th)/(a*a);dvy=h*Math.cos(th)/(a*a);
  trailPts.length=0;demoE=0;
}
function beltStep(h){
  const gj=GMS*MJ*gain, thJ=NJ*simYr;
  const jx=AJ*Math.cos(thJ),jy=AJ*Math.sin(thJ);
  /* 木星对带内小行星的引力（含增益），太阳为主项 */
  for(let i=0;i<NB;i++){
    if(!alive[i])continue;
    let ax=0,ay=0;
    const r2=bx[i]*bx[i]+by[i]*by[i];
    const f=-GMS/Math.pow(r2+0.002,1.5);
    ax+=f*bx[i];ay+=f*by[i];
    let ddx=jx-bx[i],ddy=jy-by[i];
    const f2=gj/Math.pow(ddx*ddx+ddy*ddy+0.0036,1.5);
    ax+=f2*ddx;ay+=f2*ddy;
    bvxE[i]+=ax*h;bvy[i]+=ay*h;
  }
  for(let i=0;i<NB;i++){
    if(!alive[i])continue;
    bx[i]+=bvxE[i]*h;by[i]+=bvy[i]*h;
    const r=Math.hypot(bx[i],by[i]);
    /* 近圆化判据：用能量算 a，再用 a,r 算 e */
    const v2=bvxE[i]*bvxE[i]+bvy[i]*bvy[i];
    const eps=v2/2-GMS/r;
    const a=-GMS/(2*eps);
    const hAng=bx[i]*bvy[i]-by[i]*bvxE[i];
    const e=Math.sqrt(Math.max(0,1+hAng*hAng*eps*2/(GMS*GMS)));
    if(a<1.8||a>4.6||e>0.5||r>14){alive[i]=0;beltPos[i*3+1]=9999;}
  }
  /* 演示小行星同样积分 */
  {
    let ax=0,ay=0;
    const r2=dx*dx+dy*dy;
    const f=-GMS/Math.pow(r2+0.002,1.5);
    ax+=f*dx;ay+=f*dy;
    const ddx=jx-dx,ddy=jy-dy;
    const f2=gj/Math.pow(ddx*ddx+ddy*ddy+0.0036,1.5);
    ax+=f2*ddx;ay+=f2*ddy;
    dvx+=ax*h;dvy+=ay*h;
    dx+=dvx*h;dy+=dvy*h;
    const r=Math.hypot(dx,dy);
    const v2=dvx*dvx+dvy*dvy;
    const eps=v2/2-GMS/r;
    const a=-GMS/(2*eps);
    const hAng=dx*dvy-dy*dvx;
    demoE=Math.sqrt(Math.max(0,1+hAng*hAng*eps*2/(GMS*GMS)));
    demoA=a;
    if((a<1.8||a>4.6||demoE>0.5||r>14)&&simYr-demoLastEj>1.5){
      demoEj++;demoLastEj=simYr;demoPlace(); // 甩出后按滑块 a 重新放回
    }
  }
}
/* 每帧把模拟状态写进渲染几何 */
function beltSync(){
  for(let i=0;i<NB;i++){
    if(!alive[i])continue;
    beltPos[i*3]=bx[i]*AU;beltPos[i*3+1]=0;beltPos[i*3+2]=by[i]*AU;
  }
  beltGeo.attributes.position.needsUpdate=true;
  trailPts.push(new THREE.Vector3(dx*AU,0,dy*AU));
  if(trailPts.length>500)trailPts.shift();
  trailLine.geometry.setFromPoints(trailPts);
  demoDot.position.set(dx*AU,0,dy*AU);
  demoLblPos.set(dx*AU,0.6,dy*AU);
}

/* 三颗轨道圈 */
function ringLine(parent,rad,col,op){
  const pts=[];for(let i=0;i<=90;i++){const a=i/90*TAU;pts.push(new THREE.Vector3(rad*Math.cos(a),0,rad*Math.sin(a)));}
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op}));
  parent.add(l);return l;
}

}

/* ---- 图表 ---- */
const pcv=document.getElementById('plotCv'),pctx=pcv.getContext('2d');
function sizeCanvas(){pcv.width=pcv.clientWidth*2;pcv.height=pcv.clientHeight*2;}
const histBins=new Array(40).fill(0), histInit=new Array(40).fill(0);
const heatLog=new Array(120).fill(0);
const conjLog=[];
function drawPlot(){
  const W2=pcv.width,H2=pcv.height;
  const dk=THEME==='dark';
  const cAxis=dk?'#5b6b7d':'#8494a5',cTxt=dk?'#9fb0c3':'#5b6b7d';
  pctx.clearRect(0,0,W2,H2);
  const mL=40,mR=12,mT=14,mB=30;
  const X=u=>mL+u*(W2-mL-mR),Y=v=>H2-mB-v*(H2-mT-mB);
  pctx.strokeStyle=cAxis;pctx.lineWidth=1;
  pctx.beginPath();pctx.moveTo(mL,mT-4);pctx.lineTo(mL,H2-mB);pctx.lineTo(W2-mR,H2-mB);pctx.stroke();
  pctx.fillStyle=cTxt;pctx.font='15px system-ui';
  if(mode==='belt'){
    pctx.textAlign='center';
    for(let a=2; a<=3.6;a+=0.4){const x=X((a-2)/1.6);pctx.fillText(a.toFixed(1),x,H2-mB+16);}
    pctx.fillText('a / AU',(mL+W2-mR)/2,H2-4);
    /* 共振线 */
    for(const [r,lab] of [[2.502,'3:1'],[2.825,'5:2'],[3.279,'2:1']]){
      const x=X((r-2)/1.6);
      pctx.strokeStyle='rgba(255,107,107,.7)';pctx.beginPath();pctx.moveTo(x,mT);pctx.lineTo(x,H2-mB);pctx.stroke();
      pctx.fillStyle='#ff6b6b';pctx.fillText(lab,x,mT+8);
    }
    const mx=Math.max(1,...histBins,...histInit);
    for(let i=0;i<40;i++){
      const x=X(i/40),w=W2-mL-mR;
      pctx.fillStyle=dk?'rgba(255,255,255,.06)':'rgba(15,25,40,.06)';
      pctx.fillRect(x,Y(histInit[i]/mx),w/40-1,H2-mB-Y(histInit[i]/mx));
      pctx.fillStyle='#ffa94d';
      const hh=Y(histBins[i]/mx);
      pctx.fillRect(x,hh,w/40-1,H2-mB-hh);
    }
  }else if(mode==='io'){
    pctx.textAlign='right';
    pctx.fillText('×2',mL-4,Y(1)+4);pctx.fillText('0',mL-4,H2-mB+4);
    pctx.textAlign='center';pctx.fillText(L('加热脉冲（每次会合同一点）','Heating pulses (same spot each pass)'),(mL+W2-mR)/2,mT+10);
    pctx.strokeStyle='#ff7b2e';pctx.lineWidth=2.5;pctx.beginPath();
    heatLog.forEach((v,i)=>{const x=X(i/(heatLog.length-1)),y=Y(clamp(v,0,1));
      i?pctx.lineTo(x,y):pctx.moveTo(x,y);});
    pctx.stroke();
  }else{
    pctx.textAlign='right';
    pctx.fillText('50',mL-4,Y(1)+4);pctx.fillText('30 AU',mL-4,Y((30.1-24)/(52-24))+4);
    pctx.textAlign='center';pctx.fillText(L('每次会合时冥王星的日心距','Pluto heliocentric distance at each conjunction'),(mL+W2-mR)/2,mT+10);
    /* 海王星轨道半径线 */
    pctx.strokeStyle='rgba(111,159,242,.8)';pctx.setLineDash([6,5]);
    pctx.beginPath();pctx.moveTo(mL,Y((30.1-24)/28));pctx.lineTo(W2-mR,Y((30.1-24)/28));pctx.stroke();
    pctx.setLineDash([]);
    pctx.fillStyle='#6f9ff2';pctx.textAlign='left';pctx.fillText(L('海王星轨道 30.1 AU','Neptune orbit 30.1 AU'),mL+6,Y((30.1-24)/28)-6);
    pctx.fillStyle='#ffa94d';
    conjLog.forEach((v,i)=>{const x=X(i/Math.max(conjLog.length-1,1)),y=Y(clamp((v-24)/28,0,1));
      pctx.beginPath();pctx.arc(x,y,4,0,TAU);pctx.fill();});
  }
}

function updateStats(){
  const eR=document.getElementById('stR'),eP=document.getElementById('stPhi'),
        eD=document.getElementById('stDemo'),eS=document.getElementById('stStab');
  if(mode==='belt'){
    const a=demoA||AJ*Math.pow(ratio,-2/3);
    eR.innerHTML=(Math.pow(AJ/a,1.5)).toFixed(3);
    /* 共振角 φ=2λ_木-λ_a-ϖ（2:1 情形示意，泛指共振相位） */
    const lam=Math.atan2(dy,dx), lamJ=NJ*simYr;
    const rvx=dvx,dvy2=dvy;
    const r=Math.hypot(dx,dy),v2=rvx*rvx+dvy2*dvy2;
    const ex=(v2-GMS/r)*dx/GMS-(dx*rvx+dy*dvy2)*rvx/GMS;
    const ey=(v2-GMS/r)*dy/GMS-(dx*rvx+dy*dvy2)*dvy2/GMS;
    let phi=(2*lamJ-lam-Math.atan2(ey,ex))*180/Math.PI;
    phi=((phi%360)+360)%360;
    eP.innerHTML=phi.toFixed(0)+'<small> °</small>';
    eD.innerHTML='e = '+demoE.toFixed(2)+(demoEj?' <small>已甩 '+demoEj+' 次</small>':'');
    eS.innerHTML=alive.reduce((s,x)=>s+x,0)+'<small> / '+NB+'</small>';
  }else if(mode==='io'){
    eR.innerHTML='4 : 2 : 1';
    eP.innerHTML='180°<small> 锁定</small>';
    eD.innerHTML='潮汐热 '+(ioHeat*100).toFixed(0)+'<small> %</small>';
    eS.innerHTML=volc.filter(v=>v.material.opacity>0.5).length+'<small> 火山亮</small>';
  }else{
    eR.innerHTML='3 : 2';
    eP.innerHTML='180°<small> 天平动</small>';
    eD.innerHTML='q = '+(AP*(1-EP)).toFixed(1)+'<small> AU</small>';
    eS.innerHTML=conjDist?(conjDist.toFixed(1)+'<small> AU 会合</small>'):'—';
  }
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0,pacc=0,hacc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    if(mode==='belt'){
      const yrs=dt*rateYr;let rem=yrs;
      while(rem>1e-6){const h=Math.min(rem,0.004);simYr+=h;beltStep(h);rem-=h;}
      beltSync();
      const thJ=NJ*simYr;
      jup.position.set(AJ*AU*Math.cos(thJ),0,AJ*AU*Math.sin(thJ));
      jupLblPos.copy(jup.position).add(new THREE.Vector3(0,1,0));
    }else if(mode==='io'){
      simYr+=dt*rateYr;
      const lam1=simYr*TAU,lam2=lam1/2,lam3=lam1/4;
      ioM[0].position.set(ioR[0]*Math.cos(lam1),0,ioR[0]*Math.sin(lam1));
      ioM[1].position.set(ioR[1]*Math.cos(lam2),0,ioR[1]*Math.sin(lam2));
      ioM[2].position.set(ioR[2]*Math.cos(lam3),0,ioR[2]*Math.sin(lam3));
      /* 会合：λ1≡λ2（mod 2π）→ 每两次 Io 轨道一次，经度恒为 0 */
      const syn=lam1%TAU;
      const nearConj=Math.abs(syn)<0.35||Math.abs(syn-TAU)<0.35;
      ioHeat+=( (nearConj?1:0.15)-ioHeat )*dt*6;
      ioGlow.position.copy(ioM[0].position);
      ioGlow.material.opacity=0.25+0.55*ioHeat;
      ioGlow.scale.setScalar(1.2+1.6*ioHeat);
      conjMark.position.set(ioR[1]*0.9,0,0);
      conjMark.material.opacity=0.35+0.5*ioHeat;
      volc.forEach((v,i)=>{v.material.opacity=clamp(ioHeat-0.35-i*0.1,0,0.9);});
      hacc+=dt;
      if(hacc>0.08){hacc=0;heatLog.push(ioHeat);heatLog.shift();}
    }else{
      simYr+=dt*rateYr;
      const lamN=simYr*TAU*0.5, lamP=lamN*2/3+Math.PI/3; // 3:2，φ=180°
      nep.position.set(AN*SC*Math.cos(lamN),0,AN*SC*Math.sin(lamN));
      const thP=lamP;
      const rP=AP*(1-EP*EP)/(1+EP*Math.cos(thP));
      plu.position.set(rP*SC*Math.cos(thP),0,rP*SC*Math.sin(thP));
      /* 会合：λN≡λP（mod 2π）→ t 使二者相等：发生在远日点 */
      const d=(lamP-lamN)%TAU;
      const k=Math.round((lamP-lamN)/TAU);
      if(k!==lastConjK){lastConjK=k;
        conjDist=rP;conjLog.push(rP);if(conjLog.length>24)conjLog.shift();
        conjFlash.position.copy(plu.position);conjFlash.material.opacity=1;}
      conjFlash.material.opacity=Math.max(0,conjFlash.material.opacity-dt*1.4);
      conjFlash.scale.setScalar(3);
    }
  }
  pacc+=dt;
  if(pacc>0.4){pacc=0;
    if(mode==='belt'){
      histBins.fill(0);
      for(let i=0;i<NB;i++){if(!alive[i])continue;
        const r=Math.hypot(bx[i],by[i]),v2=bvxE[i]*bvxE[i]+bvy[i]*bvy[i];
        const eps=v2/2-GMS/r,a=-GMS/(2*eps);
        const bi=clamp(Math.floor((a-2.05)/1.5*40),0,39);histBins[bi]++;}
      beltGeo.attributes.position.needsUpdate=true;
    }
    drawPlot();
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

  histInit[clamp(Math.floor((a-2.05)/1.5*40),0,39)]++;
}
