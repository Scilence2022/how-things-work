<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>ATP 合酶 · 旋转催化 3D 动画</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #10141b;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: rgba(12,16,23,.78); border: 1px solid rgba(255,255,255,.16);
    color: #e6ecf3; font-size: 12px; line-height: 1.3; padding: 4px 9px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .3s; }
  .lbl.h      { border-color: rgba(83,216,251,.85);  color: #bdeeff; }
  .lbl.m      { border-color: rgba(83,216,251,.4);   color: #8fb6c4; }
  .lbl.rotor  { border-color: rgba(176,129,217,.9);  color: #e3d2f5; }
  .lbl.stator { border-color: rgba(154,165,177,.85); color: #c3cfdd; }
  .lbl.mem    { border-color: rgba(217,178,106,.85); color: #f0d9a8; }
  .lbl.gam    { border-color: rgba(116,198,157,.9);  color: #c4ecd8; }
  .lbl.state  { border-color: rgba(141,111,227,.9);  color: #dcc9ff; font-size: 12.5px; padding: 5px 10px; }
  .lbl.atp    { border-color: rgba(255,77,109,.9);   color: #ffb9c4; font-size: 13.5px; font-weight: 600;
                padding: 5px 12px; font-variant-numeric: tabular-nums; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; }
  #title h1 { font-size: 20px; font-weight: 700; color: #f2f5f9; letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: #9fb0c3; margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    max-height: calc(100vh - 110px); overflow: auto;
    background: rgba(13,17,24,.86); border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px; padding: 13px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #legend { display: flex; gap: 7px; margin-bottom: 9px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h     { color: #9fe2f8; border-color: rgba(83,216,251,.65); }
  .chip.rotor { color: #dcc9f2; border-color: rgba(176,129,217,.65); }
  .chip.stat  { color: #c3cfdd; border-color: rgba(154,165,177,.6); }
  .chip.mol   { color: #ffb9c4; border-color: rgba(255,77,109,.6); }
  .chip.dim   { color: #b9c4d0; border-color: rgba(255,255,255,.22); }

  #stats { display: flex; gap: 18px; margin-bottom: 9px; }
  #stats .cell { font-size: 11.5px; color: #9fb0c3; }
  #stats .cell b { display: block; font-size: 14.5px; color: #f2f5f9; font-weight: 600;
    font-variant-numeric: tabular-nums; }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 5px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: rgba(255,255,255,.05); }
  #steps li.on { background: rgba(70,179,213,.12); border-color: rgba(70,179,213,.5); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: #dfe6ee; }
  #steps li.on .n { background: #46b3d5; color: #fff; }
  #steps .t { font-size: 12.5px; color: #c7d2de; line-height: 1.45; }
  #steps .t b { color: #f2f5f9; font-size: 12.5px; }
  #steps li.on .t b { color: #c9ecf8; }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,.08); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px;
    background: #2e9fbf; color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { background: #3bb1d1; }
  input[type=range] { width: 100%; accent-color: #46b3d5; height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: #9fb0c3; flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: #c7d2de; flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: #b9c4d0; display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: #46b3d5; }
  @media (max-width: 760px) { #panel { width: calc(100vw - 36px); } #title h1 { font-size: 16px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1>ATP 合酶为什么会旋转？—— 旋转催化合成 ATP</h1>
  <div class="sub">3D 交互演示 · 质子流驱动 c 环与 γ 轴旋转，三个 β 亚基被依次挤压，把 ADP+Pi 合成 ATP</div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip h">H⁺ 质子（青）</span>
    <span class="chip rotor">c 环 + γ 轴（旋转）</span>
    <span class="chip stat">α₃β₃ + 定子（不转）</span>
    <span class="chip mol">ADP 蓝 · Pi 黄 · ATP 红</span>
    <span class="chip dim">一圈 = 9 H⁺ = 3 ATP</span>
  </div>

  <div id="stats">
    <div class="cell">已释放 ATP<b id="atpN">0</b></div>
    <div class="cell">本圈已结合 H⁺<b id="hN">1 / 9</b></div>
    <div class="cell">γ 轴角度<b id="gammaDeg">0°</b></div>
  </div>

  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label>速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label>相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> 部件标签</label>
    <label><input id="tglProtons" type="checkbox" checked> H⁺ 粒子</label>
    <label><input id="tglStates" type="checkbox" checked> β 构象标签</label>
    <label><input id="tglHighlight" type="checkbox" checked> β 状态高亮</label>
    <label><input id="tglMembrane" type="checkbox" checked> 半透明膜</label>
    <label><input id="tglRotate" type="checkbox" checked> 自动环绕</label>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数（调试/截图用） ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 常量：几何与时序 ----------------
   一个周期 t ∈ [0,1) = γ 轴（与 c 环刚性同步）转 360°。
   c 环 9 个亚基：每流过 1 个 H⁺ 前进 40°，每圈 9 个 H⁺，释放 3 个 ATP。
   坐标约定：膜在 y=0 水平铺开；上方 y>0 为膜间隙（H⁺ 高），下方为基质（H⁺ 低）。
   “世界角 ψ” 指 (x,z) 平面内 atan2(z,x) 的方位角。 ------------------------------------------ */
const CYCLE_SECONDS = 9.0;      // 一圈（360°）的时长（1× 速度）
const N_C       = 9;            // c 亚基数量
const STEP_DEG  = 360 / N_C;    // 40°：每流过 1 个 H⁺ 转子前进的角度
const T_SLOW    = 0.10;         // 步骤1（观察梯度）结束的相位
const TH_SLOW   = 9;            // 步骤1 内转子缓慢进给的角度
const OPEN_MAX  = 0.60;         // β 亚基完全开放时的张开角（rad）
const R_SITE    = 1.02;         // c 亚基质子结合位点半径
const PSI_IN    = 120;          // a 亚基入口半通道的世界角（°）
const PSI_OUT   = 160;          // 出口半通道的世界角（°）
const RIDE_DEG  = 320;          // 质子结合在 c 亚基上随环转过的角度（约一圈）
const R_PIVOT   = 1.06;         // F1 中 β 亚基铰点半径
const Y_PIVOT   = 1.78;         // β 亚基铰点高度
const D2R = Math.PI / 180;
const STATE_COL = { O: 0x37d67a, L: 0xffa94d, T: 0xff5d5d };   // 构象高亮色（L 用橙色，避免与 Pi 黄混淆）
const COL_ADP = new THREE.Color(0x4f8ef7), COL_PI = new THREE.Color(0xffd23f),
      COL_ATP = new THREE.Color(0xff4d6d);

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const mod = (x, m) => ((x % m) + m) % m;
const frac = x => x - Math.floor(x);
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// 转子角 θ(t)：步骤1 极慢漂移（看清梯度），之后匀速转满 360°
function thetaDeg(t) {
  if (t < T_SLOW) return TH_SLOW * ss(0, T_SLOW, t);
  return TH_SLOW + (360 - TH_SLOW) * (t - T_SLOW) / (1 - T_SLOW);
}

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141b);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.2, 2.6, 5.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 18;
controls.maxPolarAngle = 1.62;
controls.autoRotateSpeed = 0.6;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.62));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(4, 7, 4.5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-4.5, 2.5, -3.5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
const M = {
  lipid:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0,
            transparent: true, opacity: 0.55, depthWrite: false }),
  slab:   new THREE.MeshStandardMaterial({ color: 0xd9b26a, transparent: true, opacity: 0.07,
            depthWrite: false, side: THREE.DoubleSide, roughness: 0.9 }),
  c1:     new THREE.MeshStandardMaterial({ color: 0xb081d9, roughness: 0.5, emissive: 0xb081d9, emissiveIntensity: 0.12 }),
  c2:     new THREE.MeshStandardMaterial({ color: 0x9a6cc9, roughness: 0.5, emissive: 0x9a6cc9, emissiveIntensity: 0.12 }),
  hub:    new THREE.MeshStandardMaterial({ color: 0x6b4b8a, roughness: 0.55 }),
  aSub:   new THREE.MeshStandardMaterial({ color: 0x5d7290, transparent: true, opacity: 0.42,
            roughness: 0.55, depthWrite: false }),
  chan:   new THREE.MeshStandardMaterial({ color: 0x53d8fb, transparent: true, opacity: 0.35,
            emissive: 0x53d8fb, emissiveIntensity: 0.5, depthWrite: false }),
  bArm:   new THREE.MeshStandardMaterial({ color: 0x9aa5b1, metalness: 0.55, roughness: 0.45 }),
  alpha:  new THREE.MeshStandardMaterial({ color: 0x6f8db4, roughness: 0.5, emissive: 0x6f8db4, emissiveIntensity: 0.08 }),
  gamma:  new THREE.MeshStandardMaterial({ color: 0x74c69d, roughness: 0.45, emissive: 0x74c69d, emissiveIntensity: 0.15 }),
  gammaD: new THREE.MeshStandardMaterial({ color: 0x52a675, roughness: 0.45 }),
  hUp:    new THREE.MeshStandardMaterial({ color: 0x53d8fb, emissive: 0x53d8fb, emissiveIntensity: 0.95, roughness: 0.4 }),
  hDown:  new THREE.MeshStandardMaterial({ color: 0x3f8ba6, emissive: 0x53d8fb, emissiveIntensity: 0.22,
            transparent: true, opacity: 0.55, roughness: 0.5 }),
  stick:  new THREE.MeshStandardMaterial({ color: 0xcfd8e3, roughness: 0.4, transparent: true }),
  floor:  new THREE.MeshStandardMaterial({ color: 0x141a24, roughness: 0.95, metalness: 0 }),
  arrow:  new THREE.MeshStandardMaterial({ color: 0x53d8fb, emissive: 0x53d8fb, emissiveIntensity: 0.4,
            transparent: true, opacity: 0.55 }),
};
// β 亚基：每个克隆一份材质（构象高亮要逐个调 emissive）

/* ---------------- 小工具 ---------------- */
function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...(opts.pos ?? [0, 0, 0]));
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.order) m.renderOrder = opts.order;
  scene.add(m);
  return m;
}
// 在 a、b 两点间摆放一根单位圆柱（细棒 / 化学键）
function placeStickBetween(st, a, b) {
  const d = V3().subVectors(b, a);
  const len = d.length();
  if (len < 1e-4) { st.visible = false; return; }
  st.visible = true;
  st.position.copy(a).addScaledVector(d, 0.5);
  st.scale.set(1, len, 1);
  st.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize());
}

/* ---------------- 磷脂双分子层（双层粒子排 + 半透明薄板） ---------------- */
const membraneParts = [];
{
  // 两层脂质头基粒子：留出 r>1.5 的蛋白质区，向外的圆盘上按黄金角铺开
  const geo = new THREE.SphereGeometry(0.05, 8, 6);
  for (const [y, count] of [[0.21, 150], [-0.21, 150]]) {
    const inst = new THREE.InstancedMesh(geo, M.lipid, count);
    const m4 = new THREE.Matrix4(), col = new THREE.Color();
    for (let j = 0; j < count; j++) {
      const a = j * 2.39996 + (y > 0 ? 0 : 1.1);
      const r = 1.5 + 4.3 * Math.sqrt((j + 0.5) / count);
      m4.setPosition(r * Math.cos(a), y + (j % 5 - 2) * 0.008, r * Math.sin(a));
      inst.setMatrixAt(j, m4);
      inst.setColorAt(j, col.setHex(j % 2 ? 0xd9b26a : 0xc79a4e));
    }
    inst.renderOrder = 1;
    scene.add(inst);
    membraneParts.push(inst);
  }
  // 半透明脂质薄板（中间挖孔给蛋白质），交代“膜是一片”的空间感
  const sh = new THREE.Shape(); sh.absarc(0, 0, 6.4, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absarc(0, 0, 1.35, 0, Math.PI * 2, true);
  sh.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.52, bevelEnabled: false, curveSegments: 48 });
  const m = new THREE.Mesh(g, M.slab);
  m.rotation.x = -Math.PI / 2; m.position.y = -0.26; m.renderOrder = 1;
  scene.add(m);
  membraneParts.push(m);
}
// 基质侧底盘（空间参照）
mesh(new THREE.CylinderGeometry(6.4, 6.6, 0.08, 48), M.floor, { pos: [0, -1.7, 0] });

/* ---------------- 转子：c 环 + γ 轴（刚性同步旋转） ---------------- */
const rotor = new THREE.Group();
scene.add(rotor);
const dotMats = [];                 // 每个结合位点的发光点材质
for (let s = 0; s < N_C; s++) {
  const phi = s * STEP_DEG * D2R;
  // c 亚基主体（楔形块，切向宽 0.58 恰好围成密排圆环）＋伸向轮毂的“发夹内腿”
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.44, 0.58), s % 2 ? M.c1 : M.c2);
  body.position.set(0.86 * Math.cos(phi), 0, 0.86 * Math.sin(phi));
  body.rotation.y = -phi;
  rotor.add(body);
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.34, 0.3), s % 2 ? M.c1 : M.c2);
  leg.position.set(0.6 * Math.cos(phi), -0.03, 0.6 * Math.sin(phi));
  leg.rotation.y = -phi;
  rotor.add(leg);
  // 质子结合位点（ outer 面上的小点，被 H⁺ 占据时发亮）
  const dm = new THREE.MeshStandardMaterial({ color: 0x53d8fb, emissive: 0x53d8fb, emissiveIntensity: 0.12 });
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), dm);
  dot.position.set(R_SITE * Math.cos(phi), 0.02, R_SITE * Math.sin(phi));
  rotor.add(dot);
  dotMats.push(dm);
}
// 轮毂耦合盘（ε 亚基的示意，连接 c 环与 γ 轴）
{
  const web = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.09, 28), M.hub);
  web.position.y = 0.02; rotor.add(web);
}
// γ 轴：中央柄 → 弯肘（曲柄臂，指向局部 180° 方向）→ 偏心 upper 杆
{
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.2, 14), M.gamma);
  foot.position.y = 0.14; rotor.add(foot);
  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 1.45, 14), M.gamma);
  stalk.position.y = 0.78; rotor.add(stalk);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), M.gammaD);
  ball.position.set(-0.17, 1.52, 0); rotor.add(ball);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.36, 12), M.gammaD);
  arm.rotation.z = Math.PI / 2;                       // 臂沿局部 x 方向（曲柄）
  arm.position.set(-0.17, 1.56, 0); rotor.add(arm);
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.1, 12), M.gamma);
  rod.position.set(-0.34, 2.15, 0); rotor.add(rod);   // 偏心 upper 杆，在 β 环内公转
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 10), M.gamma);
  top.position.set(-0.34, 2.72, 0); rotor.add(top);
}

/* ---------------- 定子：a 亚基 + 两条半通道 + b 亚基二聚体臂（全部不动） ---------------- */
{
  // a 亚基：110°–170° 的环扇块（半透明，能看见内部通道）；Shape 角 = −世界角
  const sh = new THREE.Shape();
  sh.absarc(0, 0, 1.45, -170 * D2R, -110 * D2R, false);
  sh.lineTo(0.95 * Math.cos(-110 * D2R), 0.95 * Math.sin(-110 * D2R));
  sh.absarc(0, 0, 0.95, -110 * D2R, -170 * D2R, true);
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.95, bevelEnabled: false, curveSegments: 24 });
  const m = new THREE.Mesh(g, M.aSub);
  m.rotation.x = -Math.PI / 2; m.position.y = -0.475; m.renderOrder = 2;
  scene.add(m);
  // 入口半通道（从膜间隙下来）与出口半通道（通向基质）：发光细管 + 管口圆环
  const pin = V3(R_SITE * Math.cos(PSI_IN * D2R), 0.295, R_SITE * Math.sin(PSI_IN * D2R));
  const pout = V3(R_SITE * Math.cos(PSI_OUT * D2R), -0.29, R_SITE * Math.sin(PSI_OUT * D2R));
  const chIn = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.55, 10), M.chan);
  chIn.position.copy(pin); chIn.renderOrder = 1; scene.add(chIn);
  const chOut = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.62, 10), M.chan);

/* ---------------- 催化货物：ADP（2 球，蓝）+ Pi（1 球，黄）→ ATP（3 球，红） ---------------- */
const CARGO_A = [V3(-0.04, 0.05, 0), V3(0.07, -0.04, 0.02), V3(0.17, 0.06, -0.02)]; // 三个磷/腺苷位
const CARGO_S = V3(0.85, -1.15, 0.25);   // 底物飞入起点（β 局部坐标：外侧下方）
function buildCargo(betaGrp) {
  const g = new THREE.Group();
  g.position.set(-0.6, -0.2, 0);        // 活性位点：β 瓣内缘
  const mats = [];
  const spheres = [];
  const radii = [0.065, 0.05, 0.055];
  for (let j = 0; j < 3; j++) {
    const base = j < 2 ? COL_ADP : COL_PI;
    const m = new THREE.MeshStandardMaterial({ color: base.clone(), roughness: 0.4,
      emissive: base.clone(), emissiveIntensity: 0.25, transparent: true });
    const s = new THREE.Mesh(new THREE.SphereGeometry(radii[j], 14, 10), m);
    g.add(s); spheres.push(s); mats.push(m);
  }
  const stMat = M.stick.clone();
  const st1 = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 1, 6), stMat);
  const st2 = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 1, 6), stMat);
  g.add(st1, st2);
  betaGrp.add(g);
  return { grp: g, spheres, sticks: [st1, st2], mats };
}
for (const b of BETA) b.cargo = buildCargo(b.grp);

// 每个位点的化学时序（u = 该位点的个人相位角，°）：
// [5,45) 底物飞入（只进开放态） → [45,150) 夹住并挤压 → [152,180) 缩合成 ATP（变红）
// → [180,260) 紧握 → [260,320) 弹出释放并淡出 → 其余为空等下一轮
function updateCargo(c, u) {
  const g = c.grp;
  if (u < 5 || u >= 320) { g.visible = false; return '空'; }
  g.visible = true;
  let atpMix = 0, q = 1, pop = 0, op = 1;
  if (u < 45) {
    op = ss(5, 16, u);                              // 飞入时淡入
  } else {
    q = 1 - 0.55 * ss(90, 150, u);                  // 挤压：三个球聚拢
    atpMix = ss(152, 180, u);                       // 缩合：颜色变红
    if (u >= 260) { pop = ss(260, 315, u); op = 1 - ss(288, 320, u); }  // 释放：向外弹出
  }
  const k = ss(5, 45, u);
  for (let j = 0; j < 3; j++) {
    const s = c.spheres[j];
    if (u < 45) s.position.lerpVectors(CARGO_S, CARGO_A[j], k);
    else s.position.copy(CARGO_A[j]).multiplyScalar(q);
    s.position.x += pop * 0.55;                     // 局部 +x = 离开中轴向外
    s.position.y += pop * 0.30;
  }
  c.mats[0].color.lerpColors(COL_ADP, COL_ATP, atpMix);
  c.mats[1].color.lerpColors(COL_ADP, COL_ATP, atpMix);
  c.mats[2].color.lerpColors(COL_PI, COL_ATP, atpMix);
  for (const m of c.mats) { m.opacity = op; m.emissive.copy(m.color); m.emissiveIntensity = 0.25; }
  placeStickBetween(c.sticks[0], c.spheres[0].position, c.spheres[1].position);   // ADP 的既有键
  c.sticks[0].material.opacity = op * 0.9;
  c.sticks[1].visible = atpMix > 0.15;                                           // 缩合新生成的键
  if (c.sticks[1].visible) placeStickBetween(c.sticks[1], c.spheres[1].position, c.spheres[2].position);
  // 货物文案:缩合前 ADP+Pi,缩合中过渡,T 态持有 ATP;开口释放阶段标注「释放中」,避免与步骤文案「L 夹住底物」矛盾
  return u < 152 ? 'ADP+Pi' : (u < 180 ? 'ADP+Pi→ATP' : (u < 245 ? 'ATP' : 'ATP 释放中'));
}

/* ---------------- ATP 计数：释放事件在 θ = 270−120i（i=0,1,2） ---------------- */
function atpCount(cyc, th) {
  let extra = 0;
  for (let i = 0; i < 3; i++) if (th >= mod(270 - 120 * i, 360)) extra++;
  return 3 * Math.floor(cyc + 1e-9) + extra;
}

/* ---------------- 每帧更新 ---------------- */
const pTmp = V3();
function updateWorld(t, cyc) {
  const th = thetaDeg(t);
  rotor.rotation.y = th * D2R;                 // c 环与 γ 轴刚性同步旋转

  /* --- β 亚基构象：由 γ 转角机械决定 v=(1−cos u)/2，u=θ+120i --- */
  const states = [], sins = [];
  let hotI = 0, hotS = -1;
  for (let i = 0; i < 3; i++) {
    const u = mod(th + i * 120, 360);
    const v = (1 - Math.cos(u * D2R)) / 2;     // 0=开放 O，1=紧密 T
    /* 构象字母与货物共用一条时间线:前半圈(合拢)讲 O→L→T(载 ADP+Pi,缩合),
       后半圈(回摆)只讲 T→O(持 ATP 并释放)——避免「L · ATP」这类与步骤文案矛盾的组合 */
    const closing = u < 180;
    const st = closing
      ? (v > 0.78 ? 'T' : v < 0.22 ? 'O' : 'L')
      : (v > 0.78 ? 'T' : 'O');
    states.push(st);
    const s = Math.abs(Math.sin(u * D2R));     // 构象变化速率 ∝ |sin u|
    sins.push(s);
    if (s > hotS) { hotS = s; hotI = i; }
    BETA[i].grp.rotation.z = (1 - v) * OPEN_MAX;   // 曲柄压到正对时完全夹紧
    const content = updateCargo(BETA[i].cargo, u);
    let cargo;
    if (u < 152) cargo = 'ADP+Pi';
    else if (u < 180) cargo = 'ADP+Pi→ATP';
    else if (u < 236) cargo = 'ATP';
    else if (u < 320) cargo = 'ATP 释放中';
    else cargo = '';                            // 等待下一轮 ADP+Pi 进入
    BETA[i].lbl.element.textContent = cargo ? `β${i + 1} · ${st} · ${cargo}` : `β${i + 1} · ${st}`;
  }
  for (let i = 0; i < 3; i++) {
    const m = BETA[i].mat;
    if (tglHighlight.checked) {                // 状态着色 + 当前变化最快的 β 加亮
      m.emissive.setHex(STATE_COL[states[i]]);
      m.emissiveIntensity = i === hotI ? 0.22 + 0.5 * sins[i] : 0.10;
    } else {
      m.emissive.setHex(0xe07b39);
      m.emissiveIntensity = 0.06;
    }
  }

  /* --- H⁺ 通量：每个粒子 dθ=θ−40k，纯函数驱动（入口→结合随环→出口→基质） --- */
  const showH = tglProtons.checked;
  for (let k = 0; k < N_C; k++) {
    const raw = mod(th - k * STEP_DEG, 360);
    const dth = raw < 342 ? raw : raw - 360;   // 折回负区间承载“接近”段
    const s = flux[k];
    if (!showH || (dth >= -18 && dth < -16)) { s.visible = false; continue; }
    s.visible = true;
    let op = 1;
    if (dth < 0) {                             // 接近 + 沿入口半通道下行
      if (dth < -2) pTmp.lerpVectors(APPROACH[k], INLET_MOUTH, ss(-16, -2, dth));
      else pTmp.lerpVectors(INLET_MOUTH, INLET_PORT, ss(-2, 0, dth));
      op = ss(-16, -13, dth);
    } else if (dth < RIDE_DEG) {               // 结合在位点 s=(k+3)%9 上，随环转过 320°
      const psi = (PSI_IN - dth) * D2R;
      pTmp.set(R_SITE * Math.cos(psi), 0.02, R_SITE * Math.sin(psi));
    } else if (dth < 332) {                    // 到达出口角，沿出口半通道下行
      pTmp.lerpVectors(OUTLET_PORT, OUTLET_EXIT, ss(320, 332, dth));
    } else {                                   // 进入基质，扩散淡出
      pTmp.lerpVectors(OUTLET_EXIT, DRIFT[k], ss(332, 342, dth));
      op = 1 - ss(335, 342, dth);
    }
    s.position.copy(pTmp);
    s.material.opacity = op;
  }
  // 结合位点发光：位点 s 上是否有质子（k=(s−3)%9 的粒子处于结合段）
  for (let sI = 0; sI < N_C; sI++) {
    const k = (sI + N_C - 3) % N_C;
    const occupied = mod(th - k * STEP_DEG, 360) < RIDE_DEG;
    dotMats[sI].emissiveIntensity = showH && occupied ? 1.5 : 0.12;
  }
  // 环境 H⁺：确定性抖动（拖动相位也不会跳变错乱）
  for (const a of ambient) {
    a.m.visible = showH;
    if (!showH) continue;
    a.m.position.set(
      a.bx + 0.15 * Math.sin(cyc * a.f1 + a.p1),
      a.by + 0.10 * Math.sin(cyc * a.f2 + a.p2),
      a.bz + 0.15 * Math.cos(cyc * a.f3 + a.p3));
  }

  /* --- 状态与统计 --- */
  const nATP = atpCount(cyc, th);
  elAtp.textContent = nATP;
  elH.textContent = Math.min(N_C, 1 + Math.floor(th / STEP_DEG)) + ' / ' + N_C;
  elDeg.textContent = Math.round(th) + '°';
  lblCounter.element.textContent = '已释放 ATP:' + nATP;
  lblRing.element.textContent = 'β 构象:' + states.join(' · ');
  return th;
}

  const li = document.createElement('li');
  li.innerHTML = `<span class="n">${STEPS.indexOf(s) + 1}</span><span class="t"><b>${s.b}</b>　${s.d}</span>`;
  li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
  elSteps.appendChild(li);
}

elPlay.textContent = playing ? '暂停' : '播放';
elPlay.addEventListener('click', () => { playing = !playing; elPlay.textContent = playing ? '暂停' : '播放'; });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglLabels.addEventListener('change', () => { for (const o of labelObjs) o.element.style.display = tglLabels.checked ? '' : 'none'; });
tglProtons.addEventListener('change', () => { if (!tglProtons.checked) for (const s of flux) s.visible = false; });
tglStates.addEventListener('change', () => {
  const on = tglStates.checked;
  for (const b of BETA) b.lbl.element.style.display = on ? '' : 'none';
  lblRing.element.style.display = on ? '' : 'none';
});
tglMembrane.addEventListener('change', () => { for (const p of membraneParts) p.visible = tglMembrane.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });

// URL 参数 → 开关初始状态
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
if (!qsBool('protons', true)) { tglProtons.checked = false; tglProtons.dispatchEvent(new Event('change')); }
if (!qsBool('states', true)) { tglStates.checked = false; tglStates.dispatchEvent(new Event('change')); }
if (!qsBool('highlight', true)) { tglHighlight.checked = false; tglHighlight.dispatchEvent(new Event('change')); }
if (!qsBool('membrane', true)) { tglMembrane.checked = false; tglMembrane.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
if (qs.get('top') === '1') {   // 调试机位：俯瞰 F1，检查曲柄-β 同步
  camera.position.set(0.4, 8.2, 1.2);
  controls.target.set(0, 1.0, 0);
}

addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing) cycles += dt * speed / CYCLE_SECONDS;
  const t = cycles - Math.floor(cycles);

  updateWorld(t, cycles);

  const si = stepIndex(t);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
updateWorld(cycles - Math.floor(cycles), cycles);
frame();
</script>
</body>
</html>
