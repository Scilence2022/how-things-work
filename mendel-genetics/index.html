<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孟德尔遗传 · 3:1 与 9:3:3:1 从哪里来</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4aa860;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#398a4c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(74,168,96,.9); }
  .lbl.y { border-color: rgba(226,177,60,.9); }
  .lbl.c { border-color: rgba(90,208,240,.9); }
  .lbl.p { border-color: rgba(228,111,178,.9); }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: var(--acc); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.g { border-color: rgba(74,168,96,.7); }
  .chip.y { border-color: rgba(226,177,60,.7); }
  .chip.n { border-color: var(--tool-border); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(74,168,96,.10); border-color: rgba(74,168,96,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(57,138,76,.08); border-color: rgba(57,138,76,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #b5e6c0; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="孟德尔遗传:3:1 与 9:3:3:1 从哪里来" data-en="Mendelian genetics: where 3:1 and 9:3:3:1 come from">孟德尔遗传：3:1 与 9:3:3:1 从哪里来</h1>
  <div class="sub" data-zh="AA×aa → F1 全 Aa → 配子分离 A:a=1:1 → 随机受精 F2 棋盘收敛 3:1;两对非同源染色体基因自由组合 9:3:3:1,连锁即偏离 · 拖动旋转 / 空格播放/暂停" data-en="AA×aa → all F1 Aa → gametes segregate A:a=1:1 → random fertilization converges on 3:1; two genes on different chromosomes assort 9:3:3:1, linkage breaks it · Drag to orbit / Space = play/pause">AA×aa → F1 全 Aa → 配子分离 A:a=1:1 → 随机受精 F2 棋盘收敛 3:1；两对非同源染色体基因自由组合 9:3:3:1，连锁即偏离 · 拖动旋转 / 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="F2 计数" data-en="F2 count">F2 计数</span><span class="v g" id="stCnt">0 / 256</span>
  <span class="k" data-zh="表型比" data-en="ratio">表型比</span><span class="v" id="stRatio" style="font-size:15px">—</span>
  <span class="k" data-zh="χ² 偏离" data-en="χ² dev">χ² 偏离</span><span class="v" id="stChi">—</span>
  <span class="k" data-zh="配子类型" data-en="gametes">配子类型</span><span class="v" style="font-size:13px" id="stGam">—</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip g" data-zh="A 显性(绿)" data-en="A dominant (green)">A 显性(绿)</span>
    <span class="chip y" data-zh="a 隐性(黄)" data-en="a recessive (amber)">a 隐性(黄)</span>
    <span class="chip n" data-zh="二因子:色×形" data-en="two genes: color × shape">二因子:色×形</span>
  </div>
  <div class="row"><label data-zh="样本数" data-en="sample size">样本数</label><input id="samp" type="range" min="64" max="400" step="8" value="256"><span class="val" id="sampVal">256</span></div>
  <div class="row"><label data-zh="重组率 r" data-en="recomb. r">重组率 r</label><input id="rec" type="range" min="0" max="50" step="1" value="0"><span class="val" id="recVal">0%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div class="row"><label data-zh="阶段进度" data-en="phase">阶段进度</label><input id="scrub" type="range" min="0" max="1000" step="5" value="0"><span class="val" id="scrubVal">0%</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
      <label><input id="tglLink" type="checkbox"> <span data-zh="连锁" data-en="linkage">连锁</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../meiosis/" data-zh="机制:减数分裂" data-en="mechanism: meiosis">机制:减数分裂</a>
    <a href="../dna-replication/" data-zh="上游:DNA 复制" data-en="upstream: DNA replication">上游:DNA 复制</a>
    <a href="../natural-selection/" data-zh="下游:自然选择" data-en="downstream: natural selection">下游:自然选择</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const qsInt = (k, d) => { const v = parseInt(qs.get(k), 10); return Number.isFinite(v) ? v : d; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  baseMat.color.set(THEME === 'light' ? 0xdde4ec : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('孟德尔遗传:分离定律与自由组合', 'Mendelian genetics: segregation & assortment');
  buildSteps();
  rebuildDecor();
  setPlayLabel();
  updateStats();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.2, 12.2, 13.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-1.2, 0.5, -1.2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 配色 ---------------- */
const COL = {
  deep: 0x17753f, light: 0x86cf6a, amb: 0xe2b13c,
  yel: 0xe6c84e, grn: 0x62a84e,
  dom: 0x5ad0f0, rec: 0xe46fb2,
  homA: 0xaebfcd, homB: 0xcdbfa5,
};
function typeInfo(t) {
  if (t === 'A') return { col: 0x3fcf74, wr: false };
  if (t === 'a') return { col: 0xe8c34a, wr: false };
  const y = t[1] === 'Y', r = t[0] === 'R';
  return { col: y ? COL.yel : COL.grn, wr: !r };
}

/* ---------------- 棋盘与植株(InstancedMesh) ---------------- */
const N = 20, HALF = 5, CS = 10 / N;
const dummy = new THREE.Object3D();
const tmpC = new THREE.Color();
const baseMat = new THREE.MeshStandardMaterial({ color: 0x1b212c, roughness: 0.9 });
const base = new THREE.Mesh(new THREE.BoxGeometry(10.9, 0.22, 10.9), baseMat);
base.position.y = -0.15;
scene.add(base);

const floorGeo = new THREE.BoxGeometry(0.44, 0.05, 0.44);
const floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.92 });
const floors = new THREE.InstancedMesh(floorGeo, floorMat, N * N);
const stemGeo = new THREE.CapsuleGeometry(0.05, 0.42, 4, 8);
const stemMat = new THREE.MeshStandardMaterial({ color: 0x3f8f52, roughness: 0.6 });
const stems = new THREE.InstancedMesh(stemGeo, stemMat, N * N);
const headGeo = new THREE.SphereGeometry(0.11, 12, 10);
const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.38, metalness: 0.05 });
const heads = new THREE.InstancedMesh(headGeo, headMat, N * N);
const flyGeo = new THREE.SphereGeometry(0.13, 12, 10);
const flyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.1 });
const NFLY = 28;
const flyers = new THREE.InstancedMesh(flyGeo, flyMat, NFLY);
[stems, heads, flyers].forEach(m => { m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m); });
scene.add(floors);

function hidePlant(c) {
  const i = c % N, j = (c / N) | 0;
  dummy.position.set(-HALF + (i + .5) * CS, 0, -HALF + (j + .5) * CS);
  dummy.rotation.set(0, 0, 0);
  dummy.scale.setScalar(0.0001);
  dummy.updateMatrix();
  stems.setMatrixAt(c, dummy.matrix);
  heads.setMatrixAt(c, dummy.matrix);
}
function hideFly(k) {
  dummy.position.set(0, -10, 0);
  dummy.rotation.set(0, 0, 0);
  dummy.scale.setScalar(0.0001);
  dummy.updateMatrix();
  flyers.setMatrixAt(k, dummy.matrix);
  flyers.instanceMatrix.needsUpdate = true;
}
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
  const c = j * N + i;
  dummy.position.set(-HALF + (i + .5) * CS, 0.03, -HALF + (j + .5) * CS);
  dummy.rotation.set(0, 0, 0);
  dummy.scale.setScalar(1);
  dummy.updateMatrix();
  floors.setMatrixAt(c, dummy.matrix);
  floors.setColorAt(c, tmpC.set(0x232a31));
  hidePlant(c);
  heads.setColorAt(c, tmpC.set(0xffffff));
}
const flySlots = [];
for (let k = 0; k < NFLY; k++) {
  flySlots.push({ idx: k, on: false, t0: 0, dur: 1, fx: 0, fy: 0, fz: 0, tx: 0, ty: 0, tz: 0, wr: false });
  flyers.setColorAt(k, tmpC.set(0xffffff));
  hideFly(k);
}
floors.instanceColor.needsUpdate = true;
heads.instanceColor.needsUpdate = true;
flyers.instanceColor.needsUpdate = true;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
let labelsOn = true;
function addLabel(textFn, pos, cls = '', target = scene, vis = null) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  const rec = { o, text: textFn, vis: vis || (() => true) };
  labelRegistry.push(rec);
  div.textContent = textFn();
  return rec;
}

/* ---------------- 生殖细胞(等位分离动画) ---------------- */
const membraneMat = new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.10,
  roughness: 0.15, side: THREE.DoubleSide, depthWrite: false });
const chrMatA = new THREE.MeshStandardMaterial({ color: COL.homA, roughness: 0.5 });
const chrMatB = new THREE.MeshStandardMaterial({ color: COL.homB, roughness: 0.5 });
const dotDomM = new THREE.MeshStandardMaterial({ color: COL.dom, emissive: COL.dom, emissiveIntensity: 0.7 });

let playing = !qsBool('pause', false);

let step = 0, ph = 0, tSim = 0;
let S = 256, rRec = 0, linked = false;
let occ = new Uint8Array(N * N);
let counts = [0, 0, 0, 0], filled = 0, fillAcc = 0;
let pending = [], growing = [];
let blocks = [];

function gamDist(side) {
  if (step <= 3) return [0.5, 0.5];
  if (step === 4) return side === 1 ? [0, 1] : [0.5, 0.5];
  const q = rRec / 2;
  return linked ? [0.5 - q, q, q, 0.5 - q] : [0.25, 0.25, 0.25, 0.25];
}
function buildBlocks() {
  blocks = [];
  if (step < 3) return;
  if (step <= 3) {
    blocks.push({ x0: 0, x1: N / 2, z0: 0, z1: N / 2, g: 'AA' });
    blocks.push({ x0: N / 2, x1: N, z0: 0, z1: N / 2, g: 'Aa' });
    blocks.push({ x0: 0, x1: N / 2, z0: N / 2, z1: N, g: 'Aa' });
    blocks.push({ x0: N / 2, x1: N, z0: N / 2, z1: N, g: 'aa' });
  } else if (step === 4) {
    blocks.push({ x0: 0, x1: N, z0: 0, z1: N / 2, g: 'Aa' });
    blocks.push({ x0: 0, x1: N, z0: N / 2, z1: N, g: 'aa' });
  } else {
    const sz = N / 4;
    for (let ti = 0; ti < 4; ti++) for (let tj = 0; tj < 4; tj++)
      blocks.push({ x0: tj * sz, x1: (tj + 1) * sz, z0: ti * sz, z1: (ti + 1) * sz });
  }
}
function sampleIdx(d) {
  let x = Math.random();
  for (let i = 0; i < d.length; i++) { if (x < d[i]) return i; x -= d[i]; }
  return d.length - 1;
}
function pickCell(b) {
  for (let t = 0; t < 10; t++) {
    const i = b.x0 + Math.floor(Math.random() * (b.x1 - b.x0));
    const j = b.z0 + Math.floor(Math.random() * (b.z1 - b.z0));
    const c = j * N + i;
    if (!occ[c]) return c;
  }
  for (let j = b.z0; j < b.z1; j++) for (let i = b.x0; i < b.x1; i++) {
    const c = j * N + i;
    if (!occ[c]) return c;
  }
  return -1;
}
function spawnFly(side, type, tx, tz) {
  const f = flySlots.find(s => !s.on);
  if (!f) return;
  const info = typeInfo(type);
  f.on = true;
  f.t0 = tSim;
  f.dur = 0.5 + Math.random() * 0.3;
  f.wr = info.wr;
  if (side === 0) { f.fx = -6.7; f.fy = 1.05 + (Math.random() - .5) * 0.5; f.fz = (Math.random() - .5) * 2; }
  else { f.fx = (Math.random() - .5) * 2; f.fy = 1.05 + (Math.random() - .5) * 0.5; f.fz = -6.7; }
  f.tx = tx; f.ty = 0.5; f.tz = tz;
  flyers.setColorAt(f.idx, tmpC.set(info.col));
  flyers.instanceColor.needsUpdate = true;
}
function doEvent() {
  if (step < 3 || filled >= S) return;
  const ti = sampleIdx(gamDist(0)), tj = sampleIdx(gamDist(1));
  let blk, tL, tT, geno;
  if (step <= 3) {
    blk = blocks[ti * 2 + tj];
    tL = ti === 0 ? 'A' : 'a';
    tT = tj === 0 ? 'A' : 'a';
    geno = blk.g;
  } else if (step === 4) {
    blk = blocks[ti];
    tL = ti === 0 ? 'A' : 'a';
    tT = 'a';
    geno = blk.g;
  } else {
    blk = blocks[ti * 4 + tj];
    tL = ['RY', 'Ry', 'rY', 'ry'][ti];
    tT = ['RY', 'Ry', 'rY', 'ry'][tj];
    geno = '';
  }
  let c = pickCell(blk);
  if (c < 0) for (const b of blocks) { c = pickCell(b); if (c >= 0) break; }
  if (c < 0) return;
  occ[c] = 1;
  const i = c % N, j = (c / N) | 0;
  spawnFly(0, tL, -HALF + (i + .5) * CS, -HALF + (j + .5) * CS);
  spawnFly(1, tT, -HALF + (i + .5) * CS, -HALF + (j + .5) * CS);
  const cls = geno ? (geno === 'aa' ? 1 : 0)

}
function fillCell(ev) {
  const c = ev.c;

  const i = c % N, j = (c / N) | 0;
  const x = -HALF + (i + .5) * CS, z = -HALF + (j + .5) * CS;
  const di = step >= 5;
  let stemS, col, wr = false;
  if (di) {
    stemS = 0;
    wr = ev.cls >= 2;
    col = (ev.cls === 0 || ev.cls === 2) ? COL.yel : COL.grn;
  } else if (ev.cls === 0) {
    stemS = 1;
    col = ev.geno === 'AA' ? COL.deep : COL.light;
  } else {
    stemS = 0.45;

  const headY = di ? 0.16 : 0.07 + 0.52 * stemS + 0.085;
  growing.push({ c, x, z, stemS, headY, wr, t0: tSim });
  floors.setColorAt(c, tmpC.set(col).multiplyScalar(0.33));

function updFlyers() {
  let dirty = false;

    const k = (tSim - f.t0) / f.dur;
    if (k >= 1) { f.on = false; hideFly(f.idx); dirty = true; continue; }
    const e = ss(0, 1, k);
    dummy.position.set(
      lerp(f.fx, f.tx, e),
      lerp(f.fy, f.ty, e) + Math.sin(e * Math.PI) * 1.1,
      lerp(f.fz, f.tz, e));
    dummy.rotation.set(0, e * 5, 0);
    const sc = 0.5 + ss(0, 0.25, k) * 0.5;
    if (f.wr) dummy.scale.set(1.3 * sc, 0.72 * sc, 1.3 * sc);
    else dummy.scale.setScalar(sc);

    flyers.setMatrixAt(f.idx, dummy.matrix);
    dirty = true;
  }

  if (!growing.length) return;

    const G = growing[g], k = (tSim - G.t0) / 0.35;

    dummy.rotation.set(0, 0, 0);
    dummy.position.set(G.x, 0.07 + 0.26 * G.stemS * e, G.z);
    dummy.scale.set(1, Math.max(G.stemS * e, 0.0001), 1);
    dummy.updateMatrix();
    stems.setMatrixAt(G.c, dummy.matrix);
    dummy.position.set(G.x, G.headY * e + 0.02, G.z);
    if (G.wr) dummy.scale.set(1.25 * e, 0.68 * e, 1.25 * e);
    else dummy.scale.setScalar(Math.max(e, 0.0001));
    dummy.updateMatrix();
    heads.setMatrixAt(G.c, dummy.matrix);

  heads.instanceMatrix.needsUpdate = true;
}

  { b: 'F1 全 Aa:显性一致', be: 'F1 all Aa: uniform',
    d: 'F1 全部高茎——显性 A 把隐性 a 完全遮住。表现一致不等于基因一致:杂合体里,分离的种子已经埋下。',
    de: 'Every F1 is tall — dominant A masks recessive a. Uniform look is not uniform genes: the heterozygote already carries the seed of segregation.',
    act: () => gotoStep(1) },
  { b: '减数分裂:等位基因分离', be: 'Meiosis: alleles segregate',
    d: 'F1 形成配子时,成对等位基因随染色体分开、各进一枚配子:A 配子与 a 配子五五开——这是 3:1 的根源(看两侧细胞动画)。',
    de: 'As F1 forms gametes, the allele pair splits with the chromosomes, one allele per gamete: A and a gametes 50/50 — the root of 3:1 (watch the cells).',
    act: () => gotoStep(2) },
  { b: 'F2 棋盘:3:1 收敛', be: 'F2 board: converging on 3:1',
    d: '配子随机相遇:AA:Aa:aa = 1:2:1,凡含 A 即高 → 表型 3:1。看棋盘铺满与计数收敛:样本越大,比例越稳、χ² 越小。',
    de: 'Gametes meet at random: AA:Aa:aa = 1:2:1, any A means tall → 3:1. Watch the board fill and counts converge: bigger samples, steadier ratio, smaller χ².',
    act: () => gotoStep(3) },
  { b: '测交:1:1 当场验证', be: 'Testcross: 1:1 proof',
    d: '让 F1(Aa)与隐性纯种 aa 测交:aa 亲本只出 a,后代表型直接暴露配子种类——高:矮 = 1:1,分离定律当场验证。',
    de: 'Cross F1 (Aa) with dwarf aa: the aa parent gives only a, so offspring phenotypes read the gametes out directly — 1:1, segregation verified.',
    act: () => gotoStep(4) },
  { b: '两对基因:自由组合 9:3:3:1', be: 'Two genes: 9:3:3:1',
    d: 'R/r 与 Y/y 位于非同源染色体上:减数分裂时两对染色体各自独立分开,配子 RY、Ry、rY、ry 各占 ¼ → F2 黄圆:绿圆:黄皱:绿皱 = 9:3:3:1。',
    de: 'R/r and Y/y sit on different chromosome pairs: each pair assorts independently in meiosis, gametes RY Ry rY ry at ¼ each → F2 9:3:3:1.',
    act: () => gotoStep(5) },
  { b: '连锁对照:比例偏离', be: 'Linkage: ratios break',
    d: '把 R 与 Y 搬上同一条染色体:两基因默认一起走,F2 偏向亲本组合(黄圆、绿皱),9:3:3:1 被打破、χ² 飙升;交叉互换按重组率 r 放进少量重组型,拉回一点。拖动 r 滑块看比例回摆。',
    de: 'Put R and Y on the SAME chromosome: they travel together by default, F2 skews to parental combos, 9:3:3:1 breaks and χ² explodes; crossing over at rate r lets a few recombinants back. Drag r and watch the ratio swing back.',
    act: () => gotoStep(6) },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ---------------- 步骤切换 ---------------- */
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
function gotoStep(k) {
  step = k;
  ph = (k + 0.02) / 7;
  elScrub.value = Math.round(ph * 1000);
  elScrubVal.textContent = Math.round(ph * 100) + '%';
  const tglLink = document.getElementById('tglLink');
  if (k === 5) tglLink.checked = false;
  if (k === 6) tglLink.checked = true;
  linked = tglLink.checked;
  configureGerm();
  rebuildDecor();
  buildBlocks();
  resetFill();
}
function configureGerm() {
  germL.grp.visible = germT.grp.visible = step >= 2;
  if (step <= 4) {
    germL.setVariant('mono');
    germT.setVariant(step === 4 ? 'aa' : 'mono');
  } else {
    const v = linked ? 'dil' : 'dii';
    germL.setVariant(v);
    germT.setVariant(v);
  }
}

/* ---------------- 读数 ---------------- */
const elCnt = document.getElementById('stCnt');
const elRatio = document.getElementById('stRatio');
const elChi = document.getElementById('stChi');
const elGam = document.getElementById('stGam');
function gamStatText() {
  if (step < 3) return '—';
  if (step <= 3) return 'A : a = 1 : 1';
  if (step === 4) return '♀ A:a=1:1 × ♂ a';
  const q = (50 - rRec * 100).toFixed(0);
  return linked
    ? L(`RY ${q}% ry ${q}% 重组 ${(rRec * 100).toFixed(0)}%`, `RY ${q}% ry ${q}% rec ${(rRec * 100).toFixed(0)}%`)
    : 'RY = Ry = rY = ry = ¼';
}
function updateStats() {
  elCnt.textContent = step >= 3 ? `${filled} / ${S}` : '—';
  if (step < 3 || filled === 0) {
    elRatio.textContent = '—';
    elChi.textContent = '—';
    elChi.style.color = '';
  } else if (step <= 4) {
    elRatio.textContent = counts[1] > 0 ? (counts[0] / counts[1]).toFixed(2) + ' : 1' : counts[0] + ' : 0';
    const e0 = filled * 0.75, e1 = filled * 0.25;
    const chi = (counts[0] - e0) ** 2 / e0 + (counts[1] - e1) ** 2 / e1;
    elChi.textContent = filled > 9 ? chi.toFixed(2) : '—';
    elChi.style.color = filled > 9 && chi > 3.84 ? '#ff8484' : '';
  } else {
    const k16 = filled / 16;
    elRatio.textContent = counts.map(c => (c / k16).toFixed(1)).join(' : ');
    const ex = [9, 3, 3, 1].map(p => filled * p / 16);
    const chi = counts.reduce((s, o, i) => s + (o - ex[i]) ** 2 / ex[i], 0);
    elChi.textContent = filled > 9 ? chi.toFixed(2) : '—';
    elChi.style.color = filled > 9 && chi > 7.81 ? '#ff8484' : '';
  }
  elGam.textContent = gamStatText();
}

/* ---------------- UI ---------------- */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const tglLink = document.getElementById('tglLink');
const elSamp = document.getElementById('samp');
const elSampVal = document.getElementById('sampVal');
const elRec = document.getElementById('rec');
const elRecVal = document.getElementById('recVal');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elScrub.addEventListener('input', () => {
  playing = false;
  setPlayLabel();
  ph = parseInt(elScrub.value, 10) / 1000;
  elScrubVal.textContent = Math.round(ph * 100) + '%';
  const k = clamp(Math.floor(ph * 7), 0, 6);
  if (k !== step) gotoStep(k);
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
tglLink.addEventListener('change', () => {
  linked = tglLink.checked;
  configureGerm();
  rebuildDecor();
  buildBlocks();
  resetFill();
});
elSamp.addEventListener('input', () => { S = parseInt(elSamp.value, 10); elSampVal.textContent = S; });
elSamp.addEventListener('change', () => { if (step >= 3) resetFill(); });
elRec.addEventListener('input', () => { rRec = parseInt(elRec.value, 10) / 100; elRecVal.textContent = elRec.value + '%'; updateStats(); });
elRec.addEventListener('change', () => { if (step >= 5 && linked) resetFill(); });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let advanceTimer = 0, lastStep = -1;
const elSteps = document.getElementById('steps');
function frame() {
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;
  germL.update(dts, (tSim % 2.4) / 2.4);
  germT.update(dts, ((tSim + 1.2) % 2.4) / 2.4);
  if (playing && step >= 3 && filled < S) {
    fillAcc += dts * 16;
    while (fillAcc >= 1 && filled < S) { fillAcc -= 1; doEvent(); }
  }
  processPending();
  updFlyers();
  updGrow();
  if (playing) {
    if (step >= 3) {
      ph = (step + clamp(filled / S, 0, 1)) / 7;
      if (filled >= S && pending.length === 0) {
        advanceTimer += dt * speed;
        if (advanceTimer > 0.8) {
          advanceTimer = 0;
          if (step < 6) gotoStep(step + 1);
          else { playing = false; setPlayLabel(); ph = 1; }
        }
      }
    } else {
      advanceTimer = 0;
      ph += dts * 0.035;
      if (ph >= 1) ph = 1;
      const nk = clamp(Math.floor(ph * 7), 0, 6);
      if (nk !== step) gotoStep(nk);
    }
    elScrub.value = Math.round(ph * 1000);
    elScrubVal.textContent = Math.round(clamp(ph, 0, 1) * 100) + '%';
  }
  for (const r of labelRegistry) {
    const el = r.o.element;
    el.textContent = r.text();
    el.style.display = (labelsOn && r.vis()) ? '' : 'none';
  }
  if (step !== lastStep) {
    lastStep = step;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === step));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
let rafId = 0, running = false;
function loop() { rafId = requestAnimationFrame(loop); frame(); }

/* ---------------- 初始化 ---------------- */
applyTheme();
applyLang();
setPlayLabel();
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
gotoStep(clamp(qsInt('t', 1), 1, 7) - 1);
running = true;
rafId = requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running) { cancelAnimationFrame(rafId); running = false; clock.getDelta(); }
  else if (!document.hidden && !running) { running = true; clock.getDelta(); rafId = requestAnimationFrame(loop); }
});
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
