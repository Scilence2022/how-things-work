<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>止回阀与单向流动 · 迟到的关门就是水锤</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="止回阀与单向流动" data-en="The Check Valve">止回阀与单向流动</h1>
  <div class="sub" data-zh="阀瓣+弹簧只许流体一路走:正向压差顶开、反向压差压回阀座——旋启式靠摆臂自重关门,慢半拍;升降式靠弹簧预紧,关门快;泵一停回流扑来,迟到的阀瓣拍上阀座,那一声「哐」就是水锤;静音止回阀的秘密只是让阀瓣早点离开水面 · 拖动旋转 / 空格运行/暂停" data-en="A disc and spring let fluid pass one way only: forward pressure lifts the disc, reverse pressure seats it — a swing check closes by gravity and lags; a spring-loaded lift check closes fast; when the pump dies the backflow rushes in and the late disc slams its seat — that clang is water hammer; silent checks just close the door earlier · drag to orbit / Space = run/pause">阀瓣+弹簧只许流体一路走:正向压差顶开、反向压差压回阀座——旋启式靠摆臂自重关门,慢半拍;升降式靠弹簧预紧,关门快;泵一停回流扑来,迟到的阀瓣拍上阀座,那一声「哐」就是水锤;静音止回阀的秘密只是让阀瓣早点离开水面 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="正向压差" data-en="Fwd press. drop">正向压差</span><span class="v" id="stDp">—</span>
  <span class="k" data-zh="阀瓣开度" data-en="Disc opening">阀瓣开度</span><span class="v" id="stOpen">—</span>
  <span class="k" data-zh="反向冲击" data-en="Slam peak">反向冲击</span><span class="v" id="stSlam">—</span>
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v" id="stS">—</span>
</div>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bSwing" data-zh="旋启式" data-en="Swing check">旋启式</button>
    <button class="abtn" id="bLift" data-zh="升降式" data-en="Lift check">升降式</button>
    <button class="abtn" id="bStop" data-zh="⚠ 模拟泵停" data-en="⚠ Trip the pump">⚠ 模拟泵停</button>
  </div>
  <div class="row">
    <label data-zh="正向流量" data-en="Forward flow">正向流量</label>
    <input id="sFlow" type="range" min="0" max="100" step="2" value="70">
    <span class="val" id="sFlowVal">70 L/min</span>

  <div class="row">
    <label data-zh="弹簧预紧" data-en="Spring preload">弹簧预紧</label>
    <input id="sPre" type="range" min="0" max="100" step="5" value="0">

    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="剖视" data-en="Cutaway">剖视</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../relief-valve/" data-zh="弹簧安全阀" data-en="The Safety Relief Valve">弹簧安全阀</a>
    <a href="../water-hammer/" data-zh="水锤效应" data-en="Water Hammer">水锤效应</a>
    <a href="../siphon/" data-zh="虹吸" data-en="The Siphon">虹吸</a>
    <a href="../venturi-flow/" data-zh="文丘里管" data-en="Venturi Tube">文丘里管</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-4.0,2.6,7.0);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=24;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:水平管路沿 X,中央阀腔,流动从上游(−X)到下游(+X) ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const YC=1.4;
const legM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
for(const lx of [-2.2,2.2]){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.95,1.0),legM);
  leg.position.set(lx,0.475,0);scene.add(leg);}
const pipeM=new THREE.MeshStandardMaterial({color:0x8a9aac,roughness:0.3,metalness:0.5,
  transparent:true,opacity:0.3,depthWrite:false});
const pipeL=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,2.8,32),pipeM);
pipeL.rotation.z=Math.PI/2;pipeL.position.set(-2.2,YC,0);scene.add(pipeL);
const pipeR=pipeL.clone();pipeR.position.x=2.2;scene.add(pipeR);
const chamberM=new THREE.MeshStandardMaterial({color:0xa8bccb,roughness:0.25,metalness:0.3,
  transparent:true,opacity:0.26,depthWrite:false,emissive:0xff6b6b,emissiveIntensity:0});
const chamber=new THREE.Mesh(new THREE.CylinderGeometry(0.95,0.95,1.9,36),chamberM);
chamber.rotation.z=Math.PI/2;chamber.position.set(0,YC,0);scene.add(chamber);
for(const cx of [-0.95,0.95]){
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.95,24,18),chamberM);
  cap.position.set(cx,YC,0);scene.add(cap);}
const flangeM=new THREE.MeshStandardMaterial({color:0x6b7787,roughness:0.4,metalness:0.6});
for(const fx of [-3.5,-0.95,0.95,3.5]){
  const fl=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.07,10,32),flangeM);
  fl.rotation.y=Math.PI/2;fl.position.set(fx,YC,0);scene.add(fl);}
/* 旋启式:顶部铰链 + 摆臂 + 阀瓣 + 竖直阀座 */
const swingG=new THREE.Group();scene.add(swingG);
const goldM=new THREE.MeshStandardMaterial({color:0xd8a03c,roughness:0.3,metalness:0.7,emissive:0xd8a03c,emissiveIntensity:0.12});
const steelM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85});
const bracket=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.22,0.36),flangeM);
bracket.position.set(0,2.16,0);swingG.add(bracket);
const armG=new THREE.Group();armG.position.set(0,2.06,0);swingG.add(armG);
const arm=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.6,0.24),steelM);
arm.position.set(0,-0.3,0);armG.add(arm);
const discS=new THREE.Mesh(new THREE.CylinderGeometry(0.44,0.44,0.06,36),goldM);
discS.position.set(0,-0.6,0);armG.add(discS);
const seatV=new THREE.Mesh(new THREE.TorusGeometry(0.45,0.035,10,40),flangeM);
seatV.rotation.y=Math.PI/2;seatV.position.set(0,YC,0);swingG.add(seatV);
/* 升降式:水平阀座 + 轴向阀瓣 + 弹簧 */
const liftG=new THREE.Group();liftG.visible=false;scene.add(liftG);
const seatH=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.045,10,40),flangeM);
seatH.rotation.x=Math.PI/2;seatH.position.set(0,1.2,0);liftG.add(seatH);
const discL=new THREE.Mesh(new THREE.CylinderGeometry(0.52,0.52,0.07,36),goldM);
discL.position.set(0,1.24,0);liftG.add(discL);
const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1,8),steelM);
liftG.add(stem);
const guide=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.14,0.4),flangeM);
guide.position.set(0,2.1,0);liftG.add(guide);
const sprCurve=new THREE.CatmullRomCurve3(Array.from({length:44},(_,i)=>{
  const t=i/43,a=t*Math.PI*14;return new THREE.Vector3(Math.cos(a)*0.1,t-0.5,Math.sin(a)*0.1);}),false);

const spr=new THREE.Mesh(new THREE.TubeGeometry(sprCurve,110,0.02,6),
  new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.35,metalness:0.5}));
liftG.add(spr);
/* 水锤脉冲环 */
const ringM=new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0});
const rings=[];
for(let i=0;i<4;i++){
  const r=new THREE.Mesh(new THREE.TorusGeometry(0.56,0.03,8,36),ringM);
  r.rotation.y=Math.PI/2;r.visible=false;scene.add(r);rings.push(r);}
/* 流动粒子 */
const NP=130;
const dropM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.35});
const drops=new THREE.InstancedMesh(new THREE.SphereGeometry(0.04,8,8),dropM,NP);
drops.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(drops);
const pd=[];for(let i=0;i<NP;i++)pd.push({x:-3.4+Math.random()*6.8,
  jy:(Math.random()-0.5)*0.56,jz:(Math.random()-0.5)*0.56});

/* 状态 */
let mode='swing',flow=70,pre=0,playing=true,labelsOn=true,slowMo=false,cut=true;
let pumpOn=true,Q=0,openFrac=1,phase='run',tPh=0,lastQ=60,surgeMax=50,slamK=0,slamT=99,dpNow=0,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function crackNow(){return pre*0.18;}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`上游 · ${dpNow.toFixed(0)} kPa`,`Upstream · ${dpNow.toFixed(0)} kPa`),
  new THREE.Vector3(-2.5,2.45,0),'b');
addLabel(()=>L('下游 · 通大气','Downstream · open tank'),new THREE.Vector3(2.5,2.45,0),'r');
const discLbl=addLabel(()=>L(`阀瓣 · 开度 ${(openFrac*100).toFixed(0)} %`,`Disc · ${(openFrac*100).toFixed(0)} % open`),
  new THREE.Vector3(0,2.0,0),'y');
const preLbl=addLabel(()=>L(`弹簧预紧 ${pre.toFixed(0)} N`,`Spring preload ${pre.toFixed(0)} N`),
  new THREE.Vector3(0.55,2.25,0),'o',()=>mode==='lift');

function setFlow(v){flow=clamp(v,0,100);
  document.getElementById('sFlow').value=flow;
  document.getElementById('sFlowVal').textContent=flow.toFixed(0)+' L/min';updateStats();}
function setPre(v){pre=clamp(v,0,100);
  document.getElementById('sPre').value=pre;
  document.getElementById('sPreVal').textContent=pre.toFixed(0)+' N';updateStats();}
function setMode(m){mode=m;
  document.getElementById('bSwing').classList.toggle('on',m==='swing');
  document.getElementById('bLift').classList.toggle('on',m==='lift');
  swingG.visible=(m==='swing');liftG.visible=(m==='lift');
  pumpOn=true;phase='run';slamT=99;syncStopBtn();updateStats();}
function trip(){pumpOn=false;lastQ=Math.max(Q,flow*0.9,12);
  surgeMax=Math.min(60,lastQ*0.85);phase='stopping';tPh=0;syncStopBtn();}
function tripFast(){pumpOn=false;lastQ=Math.max(flow*0.9,50);
  surgeMax=Math.min(60,lastQ*0.85);openFrac=Math.max(openFrac,0.85);phase='surge';tPh=0.26;syncStopBtn();}
function setPump(on){pumpOn=on;if(on)phase='run';syncStopBtn();}
function syncStopBtn(){document.getElementById('bStop').textContent=
  pumpOn?L('⚠ 模拟泵停','⚠ Trip the pump'):L('恢复泵送','Restart pump');}

const STEPS=[
 {zh:'<b>正向顶开</b>:压差把阀瓣抬离阀座,通行开始',en:'<b>Forward flow</b>: pressure difference lifts the disc off its seat',
  act(){setMode('swing');setPre(0);setFlow(70);setPump(true);}},
 {zh:'<b>稳定流</b>:开度随流量自动伸缩,阀瓣悬浮平衡',en:'<b>Steady flow</b>: the opening self-adjusts with flow, disc in balance',
  act(){setFlow(92);}},
 {zh:'<b>泵停</b>:流量归零,旋启阀瓣迟缓地摆回',en:'<b>Pump dies</b>: flow falls to zero, the swing disc lazily swings back',
  act(){setMode('swing');setPre(0);setFlow(80);setPump(true);trip();}},
 {zh:'<b>回流拍座</b>:迟到的阀瓣撞上回流,水锤炸响',en:'<b>Backflow slams</b>: the late disc meets the surge — water hammer rings the pipe',
  act(){setMode('swing');setPre(0);setFlow(90);tripFast();}},
 {zh:'<b>弹簧预紧</b>:升降式提早关门,锤声消失',en:'<b>Spring preload</b>: the lift check shuts early — the clang disappears',
  act(){setMode('lift');setPre(85);setFlow(80);setPump(true);trip();}},
 {zh:'<b>选型</b>:旋启式通量大阻力小,升降式关得快防锤',en:'<b>Choosing</b>: swing passes more with less drag; lift shuts fast against hammer',
  act(){setMode('swing');setPre(0);setFlow(100);setPump(true);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  let dp;
  if(Q<-1)dp=-Q*2;
  else if(openFrac>0.03)dp=0.045*Q*Q/(0.25+openFrac)*(mode==='lift'?1.6:1);
  else if(pumpOn&&flow>crackNow())dp=clamp(30+flow*2.5,0,380);
  else dp=0;
  dpNow=dp;
  const dv=document.getElementById('stDp');
  dv.innerHTML=dp.toFixed(0)+'<small> kPa</small>';
  dv.className='v '+((Q<-1||dp>300)?'warn':'ok');
  document.getElementById('stOpen').innerHTML=(openFrac*100).toFixed(0)+'<small> %</small>';
  const slamShow=slamT<2.5?slamK:(phase==='closed'?Math.max(8,slamK*0.08):0);
  const sv=document.getElementById('stSlam');
  sv.innerHTML=slamShow.toFixed(0)+'<small> kPa</small>';
  sv.className='v '+(slamShow>60?'warn':'ok');
  const st=document.getElementById('stS');
  if(slamT<1){st.textContent=L('拍击','SLAM');st.className='v warn';}
  else if(openFrac>0.05){st.textContent=L('开','OPEN');st.className='v ok';}
  else{st.textContent=L('关','SHUT');st.className='v';}
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSwing').addEventListener('click',()=>setMode('swing'));
document.getElementById('bLift').addEventListener('click',()=>setMode('lift'));
document.getElementById('bStop').addEventListener('click',()=>{pumpOn?trip():setPump(true);});
document.getElementById('sFlow').addEventListener('input',e=>setFlow(+e.target.value));
document.getElementById('sPre').addEventListener('input',e=>setPre(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{
  cut=e.target.checked;pipeM.opacity=cut?0.3:1;pipeM.depthWrite=!cut;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  syncStopBtn();buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 泵与回流的状态机 */
  tPh+=dts;
  if(phase==='run'){
    const tq=pumpOn?flow:0;
    Q+=(tq-Q)*Math.min(1,dts*3);
  }else if(phase==='stopping'){
    Q=lastQ*Math.max(0,1-tPh/0.3);
    if(tPh>0.3){phase='surge';tPh=0;}
  }else if(phase==='surge'){
    Q=-surgeMax*Math.min(1,tPh/0.55);
  }else{
    Q+=(0-Q)*Math.min(1,dts*2);
  }
  /* 阀瓣动态:开度追赶目标,关门速率分家族 */
  const tg=Q>crackNow()?clamp((Q-crackNow())/30,0,1):0;
  if(tg>openFrac)openFrac+=(tg-openFrac)*Math.min(1,dts*4);
  else openFrac=Math.max(0,openFrac-dts*(mode==='lift'?2.2+pre*0.06:1.1));
  if(phase==='surge'&&openFrac<=0){
    slamK=clamp(-Q*6.2*(1-0.45*pre/100),5,420);
    slamT=0;tPh=0;phase='closed';
    for(const p of pd)if(p.x>0.5)p.x+=0.3;
  }
  if(slamT<1.5)slamT+=dts;
  /* 阀瓣姿态 */
  if(mode==='swing'){
    const ang=openFrac*0.85;
    armG.rotation.z=-ang;
    discLbl.position.set(-Math.sin(ang)*0.6,2.06-Math.cos(ang)*0.6+0.28,0);
  }else{
    const dy=1.24+openFrac*0.38;
    discL.position.y=dy;
    const span=Math.max(0.05,2.02-(dy+0.035)-pre*0.0008);
    spr.scale.y=span;spr.position.y=(dy+0.035+2.02)/2;
    stem.scale.y=Math.max(0.02,2.02-(dy+0.035));
    stem.position.y=(dy+0.035+2.02)/2;
    discLbl.position.set(0,dy+0.2,0);
  }
  /* 水锤脉冲:红环沿管壁向两侧跑 */
  if(slamT<1.2){
    const k=slamT/1.2,op=Math.max(0,0.8*(1-k));
    ringM.opacity=op;
    rings[0].position.set(0.5+k*2.2,YC,0);rings[1].position.set(1.6+k*2.2,YC,0);
    rings[2].position.set(-0.5-k*2.2,YC,0);rings[3].position.set(-1.6-k*2.2,YC,0);
    rings.forEach(r=>r.visible=true);
    chamberM.emissiveIntensity=0.7*(1-k);
  }else{
    rings.forEach(r=>r.visible=false);
    chamberM.emissiveIntensity=0;
  }
  /* 流动粒子:正向染蓝、回流染红、关闭即截停 */
  const v=Q*0.006;
  for(let i=0;i<NP;i++){
    const p=pd[i];
    if(Q>=0){
      p.x+=v*dts;
      if(openFrac<0.45&&p.x>-0.62)p.x=-0.62;
      if(p.x>3.45)p.x=-3.45;
    }else{
      if(p.x>0.6){p.x+=v*dts;if(p.x<0.6)p.x=0.6;}
      else if(p.x<-0.6){p.x+=v*0.15*dts;if(p.x<-3.45)p.x=-3.45;}
    }
    let c=0x7d97ad;
    if(Q>1)c=0x74c0fc;else if(Q<-1)c=0xff6b6b;
    m4.makeScale(1,1,1);m4.setPosition(p.x,YC+p.jy,p.jz);
    drops.setMatrixAt(i,m4);
    drops.setColorAt(i,tmpC.setHex(c));
  }
  drops.instanceMatrix.needsUpdate=true;
  if(drops.instanceColor)drops.instanceColor.needsUpdate=true;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
const m4=new THREE.Matrix4(),tmpC=new THREE.Color();
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
