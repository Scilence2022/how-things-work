<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">

<title>蜂巢 · 六边形的最优解</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#f59f00;
    --bg:#141310; --panel:rgba(18,17,14,.87); --panel-border:rgba(255,255,255,.09);
    --text:#f5f3ee; --text2:#b0a68f; --text3:#d8cfba;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);

    --cv-pill:rgba(18,17,14,.82);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e67700;
    --bg:#e7ecef; --panel:rgba(255,255,255,.9); --panel-border:rgba(60,45,15,.12);
    --text:#241d10; --text2:#6f6350; --text3:#43392a;
    --hover:rgba(60,45,15,.05); --shadow:0 8px 26px rgba(80,60,20,.15);
    --tool:rgba(255,255,255,.87); --tool-border:rgba(60,45,15,.16);
    --cv-pill:rgba(255,255,255,.88);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }

  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; } .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a35c00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool); color: var(--text3);
    font: inherit; font-size: 12.5px; font-weight: 600; min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px; background: var(--panel);

  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; } #plotCv { width: 100%; height: calc(100% - 20px); display: block; }
  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 10px 16px; backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 16px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; } #stats .v.warn { color: #f59f00; } #stats .v.bad { color: #ff6b6b; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px); box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe9c4; border-color: rgba(245,159,0,.7); } .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); } .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a35c00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%; background: var(--hover); color: var(--text2);
    border: 1px solid var(--tool-border); border-radius: 9px; padding: 7px 8px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(245,159,0,.6); background: rgba(245,159,0,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(230,119,0,.55); background: rgba(230,119,0,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 76px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2); border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer; border: 1px solid transparent;
    align-items: flex-start; } #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(245,159,0,.10); border-color: rgba(245,159,0,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(230,119,0,.08); border-color: rgba(230,119,0,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px; display: flex; align-items: center;
    justify-content: center; margin-top: 1px; background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(60,45,15,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe9c4; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600; background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border); border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="蜂巢 · 六边形的最优解" data-en="The Honeycomb · Why Hexagons Win">蜂巢 · 六边形的最优解</h1>
  <div class="sub" data-zh="蜜蜂并不会画六边形:它们先砌出一个个圆筒,35 °C 的半熔蜡在表面张力与邻居的挤压下自发收拢成六边形。蜂窝定理说:围出同样面积,六边形铺法总壁长最短——P/A 三角 4.56、方形 4.00、六边形 3.72,省蜡 18%。巢脾是两层房口朝外的六棱柱,错位半房、109°28′ 菱形尖底两家共用;产 1 g 蜡要吃 8 g 蜂蜜,每一毫米壁都是口粮。内勤蜂扇风把花蜜从含水 80% 吹到 18%,酵母失活,蜂蜜才千年不腐 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Bees cannot draw hexagons: they build round wax tubes first, and at 35 °C the semi-molten wax is pulled by surface tension into regular hexagons. The honeycomb theorem: to enclose equal area, the hexagonal tiling has the least total wall — P/A is 4.56 for triangles, 4.00 for squares, 3.72 for hexagons, 18% saved. The comb is two back-to-back layers of hexagonal prisms, staggered half a cell, sharing 109°28′ rhombic bases; 1 g of wax costs 8 g of honey, so every millimetre is food. House bees fan nectar from 80% down to 18% water until yeasts fail and honey keeps forever · 3D interactive demo · drag to orbit · Space = run/pause">蜂巢 · 六边形的最优解</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="铺法 · 房径" data-en="Tiling · cell size">铺法 · 房径</span><span class="v" id="stMode">—</span>
  <span class="k" data-zh="总壁长(两层)" data-en="Total wall (2 layers)">总壁长(两层)</span><span class="v" id="stWall">—</span>

  <span class="k" data-zh="折合蜂蜜" data-en="In honey">折合蜂蜜</span><span class="v" id="stHoney">—</span>
  <span class="k" data-zh="含水 · 糖浓度" data-en="Water · sugar">含水 · 糖浓度</span><span class="v" id="stWater">—</span>
  <span class="k" data-zh="巢温 · 蜂群" data-en="Nest temp · bees">巢温 · 蜂群</span><span class="v" id="stNest">—</span>
</div>
<div id="plot">
  <h3 data-zh="含水量随扇风时间下降(80%→18% 成熟线,动点为当前值);右上小柱:三铺法 P/A 比" data-en="Water content falls with fanning time (80%→18% ripe line; dot = now); mini bars: P/A of the three tilings">含水量随扇风时间下降(80%→18% 成熟线,动点为当前值);右上小柱:三铺法 P/A 比</h3>

    <span class="chip.g" data-zh="蜂群 · 蜂蜜液面" data-en="bees · honey level">蜂群 · 蜂蜜液面</span>
    <span class="chip.b" data-zh="扇风气流 · 带走水汽" data-en="fanning airflow · vapor out">扇风气流 · 带走水汽</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnHex" data-zh="六边形铺法" data-en="Hexagonal tiling">六边形铺法</button>
    <button class="abtn" id="btnSq" data-zh="正方形铺法" data-en="Square tiling">正方形铺法</button>

  </div>
  <div class="row"><label data-zh="细胞数量" data-en="Cell count">细胞数量</label><input id="sCells" type="range" min="40" max="240" step="10" value="120"><span class="val" id="sCellsVal">120 房</span></div>
  <div class="row"><label data-zh="扇风强度" data-en="Fanning power">扇风强度</label><input id="sFan" type="range" min="0" max="3" step="0.1" value="1"><span class="val" id="sFanVal">1.0 ×</span></div>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>

    </div>

    <a href="../boids-flocking/" data-zh="boids:个体规则涌出群体秩序" data-en="boids: order from individual rules">boids:个体规则涌出群体秩序</a>
    <a href="../turing-patterns/" data-zh="图灵斑图:扩散自组织" data-en="turing patterns: diffusion self-organization">图灵斑图:扩散自组织</a>
    <a href="../fractals/" data-zh="分形:自然界的标度律" data-en="fractals: nature's scaling laws">分形:自然界的标度律</a>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);
/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x151310, 15, 46);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  const bgc = dark ? 0x151310 : 0xe2eaf1;
  scene.background = new THREE.Color(bgc);
  scene.fog.color.setHex(bgc);
  frameM.color.setHex(dark ? 0x8a6134 : 0xb08752);
  waxM.color.setHex(dark ? 0xf2a83a : 0xd98f1f);
  honeyBase.setHex(dark ? 0xd98f1f : 0xc27a12);
  beeM.color.setHex(dark ? 0x6b4a26 : 0x5d3f1e);
  wingM.color.setHex(dark ? 0xfff2d0 : 0xa8895c);
  ghostM.color.setHex(dark ? 0xffd36b : 0xd9a13c);
  airM.color.setHex(dark ? 0x7fb8ff : 0x3a78c8);
  airM.blending = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
  airM.opacity = dark ? 0.9 : 0.75;
  airM.needsUpdate = true;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('蜂巢 · 六边形的最优解', 'The Honeycomb · Why Hexagons Win');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});
/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);
if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 160);
camera.position.set(5.4, 2.9, 11.6);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 42;
controls.autoRotateSpeed = 0.35;
const hemi = new THREE.HemisphereLight(0xfff4e0, 0x241c10, 0.65);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff0d8, 1.0);
key.position.set(7, 9, 10);
scene.add(key);
const fillL = new THREE.DirectionalLight(0xffd8a0, 0.35);
fillL.position.set(-8, -4, -7);
scene.add(fillL);
/* ================= 状态(真实数值口径) ================= */
let mode = 'hex';                       // hex | sq | tri
let nCells = 120;                       // 每层房数(滑块)
let fanPower = 1.0;                     // 扇风强度 0-3
let water = 80;                         // 含水 %
let fanT = 0;                           // 有效扇风时间 s
let mature = false;                     // 是否已熟(≤18%)

    d: '巢脾是两层房口朝外的六棱柱,两层错开半个房。每个房底由三块菱形板拼成浅尖底,板间钝角恰为 109°28′(2·arctan√2);尖底正好嵌进对面三个房的交汇处,底壁由两层分摊。18 世纪 König 算出最优角 109°26′,与实测差 2 分,后来发现错在数学家的对数表——蜜蜂算得更准。',
    de: 'The comb is two layers of hexagonal prisms, mouths outward, offset by half a cell. Each cell closes in a shallow pyramid of three rhombic plates meeting at 109°28′ (2·arctan√2); each tip nests against the junction of three opposite cells, so the base walls are shared by both layers. In the 1700s König calculated 109°26′ and the measured 109°28′ looked wrong by 2 arcminutes — until the error was traced to the mathematician\'s log tables. The bees computed better.',
    act: () => { baseOn = true; document.getElementById('tglBase').checked = true; ghostGroup.visible = true; flyTo([11.2, 2.3, 5.2], [0, 0, 0]); notify('侧看两层:尖底嵌进对面三房交汇处,底壁两家共用', 'view from the side: each tip nests against three opposite cells, bases shared'); } },
  { b: '35 °C 加蜡车间:一毫米也要省', be: 'A 35 °C wax workshop: saving every millimetre',
    d: '蜡从工蜂腹部四对蜡腺分泌成蜡鳞,取下咀嚼后砌墙;筑脾区必须恒温约 35 °C,蜡才柔软可塑。代价高昂:约食 8 g 蜂蜜才分泌 1 g 蜡。按壁厚 0.08 mm、房深 11 mm 计,每 1000 个房约耗蜡 7 g,折合 55 g 蜂蜜——省下的每一毫米壁都是口粮。',
    de: 'Wax is secreted as tiny scales by four pairs of glands on the worker\'s belly, then chewed into place; the building zone is held near 35 °C so the wax stays workable. It is expensive: about 8 g of honey per 1 g of wax. At 0.08 mm walls and 11 mm depth, 1,000 cells cost roughly 7 g of wax — some 55 g of honey — so every saved millimetre of wall is food.',
    act: () => { flyTo([1.9, -1.2, 4.6], [0.4, -0.5, 0.6]); notify('产 1 g 蜡要吃 8 g 蜜:壁厚只有 0.08 mm', '1 g of wax costs 8 g of honey: walls are a mere 0.08 mm thick'); } },
  { b: '蜜为什么熟:80%→18% 的脱水', be: 'Why honey ripens: dewatering 80% → 18%',
    d: '花蜜含水约 80%,在巢内经反复吐纳摊成薄膜,转化酶把蔗糖水解为葡萄糖+果糖,内勤蜂再扇风带走水汽。含水降到 18.6% 以下,渗透压高到酵母无法存活——蜂蜜因此几乎永不变质;此时蜜蜂才封盖储存。按本页花蜜口径(糖 16 g+水 80 g),糖浓度从 16% 升到 42%。',
    de: 'Nectar is about 80% water. In the comb it is re-spread into thin films, invertase splits sucrose into glucose + fructose, and house bees fan the vapor away. Below ~18.6% water the osmotic pressure kills yeasts — honey barely spoils; only then do bees cap the cells. With this page\'s nectar recipe (16 g sugar + 80 g water), sugar climbs from 16% to 42%.',
    act: () => { if (fanPower === 0) { fanPower = 1; syncSliders(); } flyTo([2.6, 2.3, 8.2], [0.4, 1.1, 0.8]); notify('扇风蒸发开始:液面下降、糖分上升,直到 18%', 'evaporative fanning starts: level drops, sugars rise, until 18%'); } },
  { b: '自然界的六边形朋友', be: 'Hexagons elsewhere in nature',
    d: '同一个「等面积、省边界」的数学到处发芽:玄武岩冷却收缩,裂成六棱柱——巨人堤道约 4 万根;肥皂泡并排时膜以 120° 相交,拉成多边形;玉米芯、复眼、干裂泥面都收敛到六边形附近。凡是要用最少的边界隔开等大的空间,答案都指向六边形。',
    de: 'The same math of equal areas and minimal borders sprouts everywhere: cooling basalt cracks into hexagonal columns — about 40,000 pillars at the Giant\'s Causeway; adjacent soap bubbles meet at 120° and pull into polygons; corn cobs, compound eyes and dried mud all converge near hexagons. Whenever equal spaces must share the least boundary, the answer is hexagonal.',
    act: () => { controls.autoRotate = true; flyTo([7.6, 4.6, 10.4], [0, 0, 0]); notify('玄武岩柱、泡沫、复眼:都收敛到六边形', 'basalt columns, foam, compound eyes: all converge on hexagons'); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}
/* ================= 绘图:含水量下降曲线 + P/A 小柱图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#b0a68f';
  const acc = css.getPropertyValue('--acc').trim() || '#f59f00';
  const padL = 44, padR = 12, padT = 12, padB = 26;
  const T_MAX = 90;
  const xOf = t => padL + clamp(t, 0, T_MAX) / T_MAX * (W - padL - padR);
  const yOf = w => (H - padB) - (clamp(w, 8, 88) - 8) / 80 * (H - padT - padB);
  ctx.font = '15px system-ui';
  /* 坐标轴 */
  ctx.strokeStyle = 'rgba(128,150,170,.25)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(8)); ctx.lineTo(W - padR, yOf(8)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText('80%', 8, yOf(80) + 5);
  ctx.fillText('50%', 8, yOf(50) + 5);
  ctx.fillText('18%', 8, yOf(18) + 5);
  for (const tv of [0, 30, 60, 90]) ctx.fillText(`${tv}`, xOf(tv) - 6, H - padB + 18);
  ctx.fillText(L('扇风 s', 'fan s'), xOf(78), H - padB + 18);
  /* 成熟线 18% */
  ctx.strokeStyle = '#ff6b6b';
  ctx.setLineDash([7, 6]);
  ctx.beginPath(); ctx.moveTo(padL, yOf(18)); ctx.lineTo(W - padR, yOf(18)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ff6b6b';
  ctx.fillText(L('成熟线 18%', 'ripe 18%'), padL + 8, yOf(18) - 6);
  /* 理论曲线(当前扇风强度) */
  if (!mature && fanPower > 0) {
    ctx.strokeStyle = 'rgba(160,150,130,.5)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let t = 0; t <= T_MAX; t += 1) {
      const w = 14 + 66 * Math.exp(-0.05 * fanPower * t);
      t === 0 ? ctx.moveTo(xOf(t), yOf(w)) : ctx.lineTo(xOf(t), yOf(w));
    }
    ctx.stroke();
  }
  /* 实际轨迹 */
  if (history.length > 1) {
    ctx.strokeStyle = acc; ctx.lineWidth = 2.6;
    ctx.beginPath();
    history.forEach((p, i) => { i === 0 ? ctx.moveTo(xOf(p.t), yOf(p.w)) : ctx.lineTo(xOf(p.t), yOf(p.w)); });
    ctx.stroke();
    const last = history[history.length - 1];
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath(); ctx.arc(xOf(last.t), yOf(last.w), 5.5, 0, Math.PI * 2); ctx.fill();
  }
  /* 右上小柱图:三铺法 P/A(A=1 口径) */
  const modes = [['tri', 3, L('三', 'T')], ['sq', 4, L('方', 'S')], ['hex', 6, L('六', 'H')]];
  const bx = W - padR - 152, bw = 34, gap = 16, baseY = padT + 74, bhMax = 56;
  ctx.fillStyle = cTxt;
  ctx.fillText('P/A', bx - 4, padT + 14);
  modes.forEach((m, i) => {
    const pa = paRatio(m[1]);
    const h = pa / 4.7 * bhMax;
    const x = bx + i * (bw + gap);
    ctx.fillStyle = mode === m[0] ? acc : 'rgba(128,140,155,.4)';
    ctx.fillRect(x, baseY - h, bw, h);
    ctx.fillStyle = mode === m[0] ? acc : cTxt;
    ctx.fillText(pa.toFixed(1), x + 2, baseY - h - 5);
    ctx.fillText(m[2], x + bw / 2 - 6, baseY + 16);
  });
}
/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elCells = document.getElementById('sCells'), elCellsVal = document.getElementById('sCellsVal');
const elFan = document.getElementById('sFan'), elFanVal = document.getElementById('sFanVal');
const stMode = document.getElementById('stMode'), stWall = document.getElementById('stWall'),
  stWax = document.getElementById('stWax'), stHoney = document.getElementById('stHoney'),
  stWater = document.getElementById('stWater'), stNest = document.getElementById('stNest');
const formulaEl = document.getElementById('formula');
const btnHex = document.getElementById('btnHex'), btnSq = document.getElementById('btnSq'), btnTri = document.getElementById('btnTri');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elCells.value = nCells; elCellsVal.textContent = `${nCells} ${L('房', 'cells')}`;
  elFan.value = fanPower; elFanVal.textContent = `${fanPower.toFixed(1)} ×`;
}
function syncBtns() {
  btnHex.classList.toggle('on', mode === 'hex');
  btnSq.classList.toggle('on', mode === 'sq');
  btnTri.classList.toggle('on', mode === 'tri');
}
function setTiling(m) {
  if (mode === m) return;
  mode = m;
  rebuildComb();
  honeyDirty = true;
  controls.autoRotate = false;
}
function updateStats() {
  const wm = wallMetrics();
  stMode.textContent = `${L(MODE_ZH[mode], MODE_EN[mode])} · s=${wm.s.toFixed(2)} mm`;
  stWall.innerHTML = `${(wm.L / 1000).toFixed(2)}<small> m</small>`;
  stWax.innerHTML = `${wm.wax.toFixed(2)}<small> g</small>`;
  stWax.className = 'v warn';
  stHoney.innerHTML = `${(wm.wax * 8).toFixed(0)}<small> g</small>`;
  stWater.textContent = `${water.toFixed(1)}% · ${sugarPct().toFixed(0)}%`;
  stWater.className = mature ? 'v ok' : 'v warn';
  stNest.innerHTML = `${nestT().toFixed(1)}<small> °C</small> · ${BEE_N} ${L('只', 'bees')}`;
}
function updateFormula() {
  const wm = wallMetrics();
  formulaEl.innerHTML = L(
    `<b>正六边形 A=(3√3/2)s²≈2.598s²,P=6s</b>;同面积口径 P/A:三角 ${paRatio(3).toFixed(2)} · 方形 ${paRatio(4).toFixed(2)} · 六边形 ${paRatio(6).toFixed(2)}(蜂窝定理,黑尔斯 1999)<br>` +
    `<b>当前:${MODE_ZH[mode]},每层 ${nCells} 房×两层</b>:总壁长 ${(wm.L / 1000).toFixed(2)} m,壁厚 0.08 mm、房深 11 mm → 耗蜡 <b>${wm.wax.toFixed(2)} g</b><br>` +
    `<b>蜡账:1 g 蜡 ≈ 8 g 蜂蜜</b>(食 6-8 kg 糖才产 1 kg 蜡)→ 本脾折蜜 ≈ ${(wm.wax * 8).toFixed(0)} g;六边形比三角形省 18.4%、比正方形省 6.9%<br>` +
    `<b>菱形尖底:三块菱板互成 109°28′</b>(2·arctan√2;König 曾算错 2′,蜂是对的);双层错位半房,底壁两家共用<br>` +
    `<b>成熟:含水 ≤18.6% 封盖</b>;糖 16 g+其他 4 g 不变,水 80→${water.toFixed(1)} g → 糖浓度 16%→${sugarPct().toFixed(0)}%;酶把蔗糖水解为葡萄糖+果糖`,
    `<b>Regular hexagon A=(3√3/2)s²≈2.598s², P=6s</b>; at unit area P/A: tri ${paRatio(3).toFixed(2)} · square ${paRatio(4).toFixed(2)} · hex ${paRatio(6).toFixed(2)} (honeycomb theorem, Hales 1999)<br>` +
    `<b>Now: ${MODE_EN[mode]}, ${nCells} cells/layer ×2</b>: total wall ${(wm.L / 1000).toFixed(2)} m at 0.08 mm thick, 11 mm deep → wax <b>${wm.wax.toFixed(2)} g</b><br>` +
    `<b>Wax ledger: 1 g wax ≈ 8 g honey</b> (6-8 kg sugar per kg wax) → this comb ≈ ${(wm.wax * 8).toFixed(0)} g honey; hexagons save 18.4% over triangles, 6.9% over squares<br>` +
    `<b>Rhombic base: three plates at 109°28′</b> (2·arctan√2; König was off by 2′ — the bees were right); staggered layers share base walls<br>` +
    `<b>Ripening: capped at ≤18.6% water</b>; sugar 16 g + ash 4 g constant, water 80→${water.toFixed(1)} g → sugar 16%→${sugarPct().toFixed(0)}%; invertase splits sucrose into glucose+fructose`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot(); refreshLabels();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elCells.addEventListener('input', () => { nCells = +elCells.value; rebuildComb(); syncSliders(); updateFormula(); updateStats(); });
elFan.addEventListener('input', () => { fanPower = +elFan.value; syncSliders(); drawPlot(); refreshLabels(); });
btnHex.addEventListener('click', () => { setTiling('hex'); syncBtns(); updateFormula(); updateStats(); drawPlot(); });
btnSq.addEventListener('click', () => { setTiling('sq'); syncBtns(); updateFormula(); updateStats(); drawPlot(); });
btnTri.addEventListener('click', () => { setTiling('tri'); syncBtns(); updateFormula(); updateStats(); drawPlot(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglBase').addEventListener('change', e => { baseOn = e.target.checked; ghostGroup.visible = baseOn; });
document.getElementById('tglBees').addEventListener('change', e => { beesOn = e.target.checked; beeGroup.visible = beesOn; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});
/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    simT += dt;
    stepRipen(dt);
    stepBees(dt);
    stepAir(dt);
  }
  if (honeyDirty) { updateHoney(); honeyDirty = false; }
  /* 蜂蜜颜色随浓度加深 */
  const ripeK = clamp((80 - water) / 62, 0, 1);
  honeyM.color.copy(honeyBase).lerp(honeyRipe, ripeK * 0.75);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.15) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.15) { accPlot = 0; drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  lblWall.position.z = combDepth + 0.5;
  lblHoney.position.z = combDepth + 0.4;
  lblFan.position.z = combDepth + 0.8;
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
