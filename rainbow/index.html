<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩虹与霓 · 水滴里的极值角</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e599f7;
    --bg:#0d1420; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#9c36b5;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.g { border-color: rgba(229,153,247,.9); color: #f3d9fa; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(27,124,160,.9); color: #1b7ca0; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(156,54,181,.9); color: #9c36b5; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #inset { position: fixed; top: 64px; right: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 9px 10px 7px;
    backdrop-filter: blur(6px); }
  #cv { width: 264px; height: 150px; display: block; }
  #inset .cap { font-size: 10.5px; color: var(--text2); margin-top: 5px; max-width: 264px; line-height: 1.4; }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.c { color: #74c0fc; }
  #stats .v.g { color: #e599f7; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(229,153,247,.6); background: rgba(229,153,247,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(156,54,181,.55); background: rgba(156,54,181,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #sw { display: flex; gap: 4px; flex-wrap: wrap; }
  .swb { appearance: none; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
    background: var(--hover); color: var(--text3); border: 1px solid var(--tool-border);
    border-radius: 8px; padding: 3px 7px; transition: border-color .15s, background .15s; }
  .swb.on { border-color: var(--acc); background: rgba(229,153,247,.14); }
  :root[data-theme="light"] .swb.on { background: rgba(156,54,181,.10); }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(229,153,247,.10); border-color: rgba(229,153,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(156,54,181,.08); border-color: rgba(156,54,181,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #f3d9fa; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } #inset { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="彩虹与霓:水滴里的极值角" data-en="Rainbow &amp; secondary bow: the extremum angle">彩虹与霓:水滴里的极值角</h1>
  <div class="sub" data-zh="阳光射进雨滴:折射 → 色散 → 内反射 → 再折射;散射角 θ(b) 在 42°/51° 取极值,光线在那里扎堆 → 两道亮弧;主虹外红内紫,霓色序反转,中间是亚历山大暗带 · 3D 交互 · 拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Sunlight in a raindrop: refract → disperse → reflect → refract; the scattering angle θ(b) bottoms out at 42°/51°, piling rays into two bright arcs — primary red-outside, secondary reversed, Alexander's dark band between · drag to orbit / scroll to zoom · Space = play/pause">阳光射进雨滴:折射 → 色散 → 内反射 → 再折射;散射角 θ(b) 在 42°/51° 取极值,光线在那里扎堆 → 两道亮弧;主虹外红内紫,霓色序反转,中间是亚历山大暗带 · 3D 交互 · 拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

    <div id="sw">
      <button class="swb on" data-i="-1" data-zh="全" data-en="all">全</button><button class="swb" data-i="0" style="color:#ff4d4f" data-zh="红" data-en="red">红</button><button class="swb" data-i="1" style="color:#ffa940" data-zh="橙" data-en="orange">橙</button><button class="swb" data-i="2" style="color:#ffd60a" data-zh="黄" data-en="yellow">黄</button><button class="swb" data-i="3" style="color:#40c057" data-zh="绿" data-en="green">绿</button><button class="swb" data-i="4" style="color:#339af0" data-zh="蓝" data-en="blue">蓝</button><button class="swb" data-i="5" style="color:#bf5af2" data-zh="紫" data-en="violet">紫</button>
    </div></div>

  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const DEG = 180 / Math.PI;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x0d1420);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.ground.color.set(THEME === 'light' ? 0xdde3ec : 0x151b26);
  ghostMat.color.set(THEME === 'light' ? 0x4a5a6a : 0xbfd4e6);
  ghostMat.opacity = THEME === 'light' ? 0.22 : 0.14;
  updateDroplets();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('彩虹与霓:水滴里的极值角', 'Rainbow & secondary bow');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 300);
camera.position.set(2.4, 1.7, 4.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.4, 0.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 80;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(5, 9, 5);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.06, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  ground: mat(0x151b26, { roughness: 0.95, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
};

/* ---------------- 彩虹物理:水滴内的偏向 ---------------- */
const COLORS = [
  { nm: 650, n: 1.331, c: 0xff4d4f, zh: '红', en: 'red' },
  { nm: 610, n: 1.332, c: 0xffa940, zh: '橙', en: 'orange' },
  { nm: 580, n: 1.333, c: 0xffd60a, zh: '黄', en: 'yellow' },
  { nm: 530, n: 1.335, c: 0x40c057, zh: '绿', en: 'green' },
  { nm: 470, n: 1.338, c: 0x339af0, zh: '蓝', en: 'blue' },
  { nm: 410, n: 1.343, c: 0xbf5af2, zh: '紫', en: 'violet' },
];
function dev(n, k, b) {          // i, r, 总偏向 D, 散射角 θ = |D−180°|
  const i = Math.asin(clamp(b, 0, 0.999));
  const r = Math.asin(Math.sin(i) / n);
  const D = 2 * (i - r) + k * (Math.PI - 2 * r);
  return { i, r, D, th: Math.abs(D - Math.PI) };
}
function star(n, k) {            // 极值:dD/di = 0 → sin²i* = ((k+1)²−n²)/(k(k+2))
  const s2 = ((k + 1) * (k + 1) - n * n) / (k * (k + 2));
  const i = Math.asin(Math.sqrt(s2));
  const r = Math.asin(Math.sin(i) / n);
  const D = 2 * (i - r) + k * (Math.PI - 2 * r);
  return { i, b: Math.sin(i), D, th: Math.abs(D - Math.PI) };
}
function contactAngles(n, k, b) {  // 球面接触点角(截面 z=0 平面):入射 0 … 出射 k+1
  const { i, r } = dev(n, k, b);
  const a = [Math.PI - i];
  for (let j = 0; j <= k; j++) a.push(a[j] - (Math.PI - 2 * r));
  return a;
}
const nE = () => hl >= 0 ? COLORS[hl].n : 1.335;

/* ---------------- 状态 ---------------- */
let view = qs.get('mode') === 'sky' ? 'sky' : 'drop';
let kRef = qs.get('k') === '2' ? 2 : 1;
let b = clamp(qsFloat('b', 0.86), 0.05, 0.98);
let hl = -1;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let tSim = clamp(qsFloat('t', 0), 0, 600);
let phase = (tSim % 6) / 6;
let userHold = false, labelsOn = true;

/* ================= 水滴模式 ================= */
const dropGrp = new THREE.Group();

function bowMesh(k, op) {
  const stops = COLORS.map(c => ({ th: star(c.n, k).th, col: new THREE.Color(c.c) })).sort((s1, s2) => s1.th - s2.th);
  const pad = 0.5 * Math.PI / 180;
  const r0 = X0 * Math.tan(stops[0].th - pad), r1 = X0 * Math.tan(stops[5].th + pad);
  const NB = 72, NR = 12;
  const pos = [], col = [], idx = [];
  for (let ib = 0; ib <= NB; ib++) {
    const be = ib / NB * Math.PI, sy = Math.sin(be), cz = Math.cos(be);
    for (let ir = 0; ir <= NR; ir++) {
      const r = r0 + (r1 - r0) * ir / NR;
      pos.push(X0, EYE + r * sy, r * cz);
      const th = Math.atan(r / X0);
      let c = stops[0].col;
      if (th >= stops[5].th) c = stops[5].col;
      else for (let j = 0; j < 5; j++) {
        if (th >= stops[j].th && th <= stops[j + 1].th) {
          c = stops[j].col.clone().lerp(stops[j + 1].col, (th - stops[j].th) / (stops[j + 1].th - stops[j].th));
          break;
        }
      }
      col.push(c.r, c.g, c.b);
    }
  }
  for (let ib = 0; ib < NB; ib++) for (let ir = 0; ir < NR; ir++) {
    const a0 = ib * (NR + 1) + ir, a1 = a0 + NR + 1;
    idx.push(a0, a1, a0 + 1, a1, a1 + 1, a0 + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: op, side: THREE.DoubleSide, depthWrite: false }));
  m.renderOrder = 3;
  skyGrp.add(m);
  return m;
}

  const S = new THREE.Vector3(-3.4, b, 0);
  let Pg = null;
  for (let j = 0; j < 6; j++) {
    const P = contactAngles(COLORS[j].n, kRef, b).map(a => new THREE.Vector3(Math.cos(a), Math.sin(a), 0));
    if (hl < 0 ? j === 3 : j === hl) Pg = P;
    for (let m = 0; m < 3; m++) {
      const mesh = legRay[j][m];
      mesh.visible = m <= kRef;
      if (mesh.visible) {
        mesh.setSeg(P[m], P[m + 1]);
        mesh.scale.x = mesh.scale.z = (hl < 0 || hl === j) ? 1 : 0.55;
      }
    }
    const { D } = dev(COLORS[j].n, kRef, b);
    const dir = new THREE.Vector3(Math.cos(-D), Math.sin(-D), 0);
    outRay[j].setSeg(P[kRef + 1], P[kRef + 1].clone().addScaledVector(dir, 2.6));
    outRay[j].scale.x = outRay[j].scale.z = (hl < 0 || hl === j) ? 1 : 0.55;
    const op = (hl < 0 || hl === j) ? 0.95 : 0.15;
    legMat[j].opacity = op;
    outMat[j].opacity = op;
  }
  rayWhite.setSeg(S, contactAngles(1.335, kRef, b).slice(0, 1).map(a => new THREE.Vector3(Math.cos(a), Math.sin(a), 0))[0]);
  /* 法线(高亮色) */
  const angs = contactAngles(nE(), kRef, b);
  const na = normGeo.attributes.position;
  for (let m = 0; m < 4; m++) {
    const on = m <= kRef + 1;
    na.setXYZ(m * 2, 0, 0, 0);
    na.setXYZ(m * 2 + 1, on ? Math.cos(angs[m]) * 1.32 : 0, on ? Math.sin(angs[m]) * 1.32 : 0, 0);
  }
  na.needsUpdate = true;
  normLines.computeLineDistances();
  /* 标签跟点 */
  lblSun.position.set(-3.4, b + 0.3, 0);
  lblB.position.set(-1.5, b + 0.42, 0);
  lblEntry.position.set(Pg[0].x - 0.1, Pg[0].y + 0.34, 0);
  lblDisp.position.set((Pg[0].x + Pg[1].x) / 2, (Pg[0].y + Pg[1].y) / 2 + 0.18, 0);
  lblRefl.position.set(Pg[1].x + 0.28, Pg[1].y + 0.28, 0);
  const dE = dev(nE(), kRef, b);
  lblExit.position.set(Pg[kRef + 1].x + Math.cos(-dE.D) * 1.3, Pg[kRef + 1].y + Math.sin(-dE.D) * 1.3, 0);
}
function updateGhosts() {
  const ga = ghostGeo.attributes.position;
  for (let g = 0; g < GH_N; g++) {
    const bg = 0.30 + g / (GH_N - 1) * 0.68;
    const angs = contactAngles(1.335, kRef, bg);
    const { D } = dev(1.335, kRef, bg);
    const px = Math.cos(angs[kRef + 1]), py = Math.sin(angs[kRef + 1]);
    ga.setXYZ(g * 2, px, py, 0.004);
    ga.setXYZ(g * 2 + 1, px + Math.cos(-D) * 1.5, py + Math.sin(-D) * 1.5, 0.004);
  }
  ga.needsUpdate = true;
}
function updateExt() {
  const e = star(1.335, kRef);
  const p = extGeo.attributes.position;
  p.setXYZ(0, 0, 0, 0.006);
  p.setXYZ(1, Math.cos(-e.D) * 3.6, Math.sin(-e.D) * 3.6, 0.006);
  p.needsUpdate = true;
  extLine.computeLineDistances();
  lblExt.position.set(Math.cos(-e.D) * 3.05, Math.sin(-e.D) * 3.05, 0);
}
function updatePackets() {
  const S = new THREE.Vector3(-3.4, b, 0);
  for (let j = 0; j < 7; j++) {
    let p = null;
    if (j === 6) {
      if (phase < 0.25) {
        const a0 = contactAngles(1.335, kRef, b)[0];
        p = S.lerp(new THREE.Vector3(Math.cos(a0), Math.sin(a0), 0), phase / 0.25);
      }
    } else if (phase >= 0.25) {
      const P = contactAngles(COLORS[j].n, kRef, b).map(a => new THREE.Vector3(Math.cos(a), Math.sin(a), 0));
      if (phase < 0.7) {
        const f = (phase - 0.25) / 0.45 * (kRef + 1);
        const m = Math.min(Math.floor(f), kRef);
        p = P[m].lerp(P[m + 1], f - m);
      } else {
        const { D } = dev(COLORS[j].n, kRef, b);
        p = P[kRef + 1].addScaledVector(new THREE.Vector3(Math.cos(-D), Math.sin(-D), 0), (phase - 0.7) / 0.3 * 2.6);
      }
    }
    if (p) { dummy.position.copy(p); dummy.scale.setScalar(1); }
    else { dummy.position.set(0, 0, 0); dummy.scale.setScalar(0.0001); }
    dummy.updateMatrix();
    pkt.setMatrixAt(j, dummy.matrix);
  }
  pkt.instanceMatrix.needsUpdate = true;
}
function updateCone() {
  const rc = 8 * Math.tan(star(nE(), kRef).th);
  const p = coneGeo.attributes.position;
  for (let i2 = 0; i2 < 96; i2++) {
    const be = i2 / 96 * Math.PI * 2;
    p.setXYZ(i2, 8, EYE + rc * Math.sin(be), rc * Math.cos(be));
  }
  p.needsUpdate = true;
  coneLoop.computeLineDistances();
  lblCone.position.set(8, EYE + rc + 0.55, 0);
}
function updateDroplets() {
  if (!dropMesh.instanceColor) return;
  const thS = star(nE(), kRef).th;
  const litCol = new THREE.Color(hl >= 0 ? COLORS[hl].c : 0xeaf6ff);
  const base = new THREE.Color(THEME === 'dark' ? 0x33506e : 0x9fb8cc);
  for (let i2 = 0; i2 < DROP_N; i2++) {
    const d = drops[i2];
    const dy = d.p.y - EYE;
    const ang = Math.atan2(Math.hypot(dy, d.p.z), d.p.x);
    let lit = dy > -0.05 && Math.abs(ang - thS) < 0.028;
    if (lit && playing) lit = Math.sin(tSim * 4 + d.ph) > -0.6;
    dropMesh.setColorAt(i2, lit ? litCol : base);
  }
  dropMesh.instanceColor.needsUpdate = true;
}
/* ---------------- θ(b) 曲线内嵌图 ---------------- */
const cv = document.getElementById('cv'), cx2 = cv.getContext('2d');
const CW = 264, CH = 150;
cv.width = CW * 2;
cv.height = CH * 2;
function drawInset() {
  cx2.setTransform(2, 0, 0, 2, 0, 0);
  const dark = THEME === 'dark';
  cx2.clearRect(0, 0, CW, CH);
  const fg = dark ? '#9fb0c3' : '#5b6b7d', grid = dark ? 'rgba(255,255,255,.12)' : 'rgba(15,25,40,.12)';
  const padL = 30, padR = 8, padT = 16, padB = 16;
  const yMin = kRef === 1 ? 30 : 42, yMax = kRef === 1 ? 47 : 100;
  const bMin = kRef === 1 ? 0.02 : 0.45;
  const X = bb => padL + (CW - padL - padR) * (bb - bMin) / (1 - bMin);
  const Y = th => padT + (CH - padT - padB) * (1 - (th - yMin) / (yMax - yMin));
  cx2.strokeStyle = grid;
  cx2.lineWidth = 1;
  cx2.strokeRect(padL, padT, CW - padL - padR, CH - padT - padB);
  cx2.fillStyle = fg;
  cx2.font = '9px sans-serif';
  for (const t of kRef === 1 ? [35, 40, 45] : [50, 60, 70, 80, 90]) {
    cx2.fillText(t + '°', 5, Y(t) + 3);
    cx2.beginPath();
    cx2.moveTo(padL, Y(t));
    cx2.lineTo(CW - padR, Y(t));
    cx2.stroke();
  }
  cx2.fillText(L('散射角 θ(b)', 'scattering θ(b)'), padL, 10);
  cx2.fillText('b/R →', CW - 46, CH - 4);
  const NN = 90;
  const curve = n => {
    const p = [];
    for (let s = 0; s <= NN; s++) {
      const bb = bMin + s / NN * (0.99 - bMin);
      p.push([bb, Math.min(dev(n, kRef, bb).th * DEG, yMax)]);
    }
    return p;
  };
  const cR = curve(1.331), cV = curve(1.343);
  const trace = c => { cx2.beginPath(); c.forEach((p, i2) => i2 ? cx2.lineTo(X(p[0]), Y(p[1])) : cx2.moveTo(X(p[0]), Y(p[1]))); };
  trace(cR);
  [...cV].reverse().forEach(p => cx2.lineTo(X(p[0]), Y(p[1])));
  cx2.closePath();
  cx2.fillStyle = dark ? 'rgba(229,153,247,.13)' : 'rgba(156,54,181,.10)';
  cx2.fill();
  cx2.lineWidth = 1.4;
  cx2.strokeStyle = '#ff4d4f';
  trace(cR);
  cx2.stroke();
  cx2.strokeStyle = '#bf5af2';
  trace(cV);
  cx2.stroke();
  /* 极值线 */
  const ex = star(1.335, kRef);
  cx2.setLineDash([4, 3]);
  cx2.strokeStyle = dark ? '#e599f7' : '#9c36b5';
  cx2.beginPath();
  cx2.moveTo(padL, Y(ex.th * DEG));
  cx2.lineTo(CW - padR, Y(ex.th * DEG));
  cx2.stroke();
  cx2.setLineDash([]);
  cx2.fillStyle = dark ? '#e599f7' : '#9c36b5';
  cx2.fillText(`θ* ${(ex.th * DEG).toFixed(1)}° @ b*/R ${ex.b.toFixed(2)}`, padL + 4, Y(ex.th * DEG) + (kRef === 1 ? -3 : 11));
  /* 当前 b */
  const thB = dev(nE(), kRef, b).th * DEG;
  cx2.strokeStyle = fg;
  cx2.setLineDash([2, 3]);
  cx2.beginPath();
  cx2.moveTo(X(clamp(b, bMin, 0.99)), padT);
  cx2.lineTo(X(clamp(b, bMin, 0.99)), CH - padB);
  cx2.stroke();
  cx2.setLineDash([]);
  cx2.fillStyle = hl >= 0 ? '#' + COLORS[hl].c.toString(16).padStart(6, '0') : '#ff4d4f';
  cx2.beginPath();
  cx2.arc(X(clamp(b, bMin, 0.99)), Y(Math.min(thB, yMax)), 3, 0, 7);
  cx2.fill();
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0, dropAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) {
    tSim += dts;
    phase = (phase + dts / 6) % 1;
    if (!userHold && view === 'drop') {
      const u = (tSim % 12) / 12;
      b = 0.12 + 0.85 * (u < 0.5 ? 2 * u : 2 - 2 * u);
      elB.value = b;
      elBVal.textContent = b.toFixed(2);
    }
  }
  if (camK < 1) {
    camK = clamp(camK + dt / 0.9, 0, 1);
    const e = camK * camK * (3 - 2 * camK);
    camera.position.lerpVectors(camP0, camP1, e);
    controls.target.lerpVectors(camT0, camT1, e);
  }
  updateDropRays();
  updatePackets();
  if (view === 'sky' && playing) { dropAcc += dt; if (dropAcc > 0.15) { dropAcc = 0; updateDroplets(); } }
  /* 读数 */
  const dv = dev(hl >= 0 ? COLORS[hl].n : 1.331, kRef, b);
  stD.textContent = (dv.D * DEG).toFixed(1) + '°';
  stT.textContent = (dv.th * DEG).toFixed(1) + '°';
  stO.textContent = kRef === 1 ? L('外红内紫', 'red out') : L('外紫内红', 'violet out');
  stK.textContent = kRef === 1 ? L('1 次 · 虹', '1 · primary') : L('2 次 · 霓', '2 · secondary');
  formulaAcc += dt;
  if (formulaAcc > 0.25) { formulaAcc = 0; updateFormula(); }
  if (view === 'drop') drawInset();
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.element.style.display = on ? '' : 'none';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i2) => li.classList.toggle('on', i2 === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
setView(view, false);
setK(kRef);
setB(b);
setHl(-1);
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
