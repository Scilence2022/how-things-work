<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>阿基米德螺旋泵 · 每一格水都被斜面接力抬上一级</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#4dabf7;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1971c2;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(77,171,247,.9);color:#cfe8ff}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#1864ab}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(77,171,247,.6);background:rgba(77,171,247,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(25,113,194,.55);background:rgba(25,113,194,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}

  :root[data-theme="light"] #steps li.on{background:rgba(25,113,194,.08);border-color:rgba(25,113,194,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#a5d8ff}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>

  <h1 data-zh="阿基米德螺旋泵 · 每一格水都被斜面接力抬上一级" data-en="Archimedes Screw · every pocket of water relayed up one step">阿基米德螺旋泵 · 每一格水都被斜面接力抬上一级</h1>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0d1216,20,62);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(-2.4,7.0,15.0);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.4,3.1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=45;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(5,9,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-6,4,-5);scene.add(fill);

/* ---- 材质 ---- */
const tubeM=new THREE.MeshPhysicalMaterial({color:0xbfe3ff,transparent:true,opacity:0.16,roughness:0.12,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const bladeM=new THREE.MeshStandardMaterial({color:0xcf8a3a,metalness:0.45,roughness:0.42,side:THREE.DoubleSide});
const shaftM=new THREE.MeshStandardMaterial({color:0x9aa5b1,metalness:0.8,roughness:0.35});
const steelM=new THREE.MeshStandardMaterial({color:0x39424c,metalness:0.35,roughness:0.6});
const gripM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.45,roughness:0.4});
const waterM=new THREE.MeshStandardMaterial({color:0x4dabf7,emissive:0x1864ab,emissiveIntensity:0.55,roughness:0.25});
const trackM=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xe8590c,emissiveIntensity:0.7,roughness:0.3});
const demoM=new THREE.MeshStandardMaterial({color:0x74c0fc,transparent:true,opacity:0.45,roughness:0.3});
const poolM=new THREE.MeshPhysicalMaterial({color:0x3b9dd4,transparent:true,opacity:0.55,roughness:0.15,metalness:0});
const groundM=new THREE.MeshStandardMaterial({color:0x1a2027,roughness:0.95});
const stoneM=new THREE.MeshStandardMaterial({color:0x4c565f,roughness:0.9});

/* ---- 几何常数（比例 1 单位=0.25m：管长2.5m 内径0.42m 螺距≈0.5m 5圈） ----
   轴向每转推进 = 螺距 PITCH；水团轴向速度与叶片底线交点严格同速(都=ω·PITCH/2π)，
   因此水团永远待在同一格小斗内被接力抬升。 */
const TUBE_L=10,R_OUT=0.84,R_IN=0.79,SHAFT_R=0.16;
const TURNS=5,BL0=0.05,BL_L=9.9,K=2*Math.PI*TURNS/BL_L,PITCH=2*Math.PI/K;
const R_W=0.50,PARCEL_R=0.27;         // 水团贴最低素线
const S0=0.35,S1=9.8;                 // 小斗可乘区间(轴向)
const M_PER_U=0.25;                   // 场景单位→米
const V_POCKET=Math.PI/4*0.42*0.42*PITCH*M_PER_U*0.42*1000; // 单斗容积≈26L(充满率0.42)
const PIVOT=new THREE.Vector3(-4.4,0.95,0);  // 进水端支点(倾角变化时固定,进水口始终浸在池中)
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
let tilt=30*Math.PI/180,tiltDeg=30,rpm=28,rev=false,phi=0;
const omega=()=>rpm*Math.PI/30*(rev?-1:1);
const slipK=()=>0.85*Math.sin(tilt)**2*clamp(1.4-rpm/50,0.25,1); // 叶尖回漏率: 倾角越大漏越多, 转速越快漏越少(倾角与转速的配合)

/* ---- 场景组装：tiltG(绕进水端支点倾斜) > spinG(绕轴自转) ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(22,0.3,10),groundM);
ground.position.set(-0.5,-0.15,0);scene.add(ground);
const tiltG=new THREE.Group();tiltG.position.copy(PIVOT);scene.add(tiltG);
const spinG=new THREE.Group();tiltG.add(spinG);
/* 透明圆管(两端开口)+端口加强环 */
const tubeGeo=new THREE.CylinderGeometry(R_OUT,R_OUT,TUBE_L,30,1,true);
tubeGeo.rotateZ(Math.PI/2);tubeGeo.translate(TUBE_L/2,0,0);
const tube=new THREE.Mesh(tubeGeo,tubeM);tube.renderOrder=2;tiltG.add(tube);
const rimGeo=new THREE.TorusGeometry(R_OUT+0.02,0.045,10,36);rimGeo.rotateY(Math.PI/2);
for(const a of [0,TUBE_L]){const r=new THREE.Mesh(rimGeo,steelM);r.position.x=a;tiltG.add(r);}
/* 轴 + 螺旋叶片(参数化螺旋面: 绕轴每单位轴向转 -K, 右旋抬升) */
const shaftGeo=new THREE.CylinderGeometry(SHAFT_R,SHAFT_R,11.7,20);
shaftGeo.rotateZ(Math.PI/2);shaftGeo.translate(4.6,0,0);
spinG.add(new THREE.Mesh(shaftGeo,shaftM));
function helicoid(segU){ // 叶片: x∈[BL0,BL0+BL_L], 半径 SHAFT_R→R_IN, 相位 PH0=π/2 保证水团居格中
  const pos=[],idx=[],PH0=Math.PI/2;
  for(let i=0;i<=segU;i++){
    const x=BL0+i/segU*BL_L,th=PH0-K*x;
    for(let j=0;j<=2;j++){const r=SHAFT_R+0.02+(R_IN-SHAFT_R-0.03)*j/2;pos.push(x,r*Math.cos(th),r*Math.sin(th));}
  }
  for(let i=0;i<segU;i++)for(let j=0;j<2;j++){const a=i*3+j;idx.push(a,a+3,a+1,a+3,a+4,a+1);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();return g;
}
spinG.add(new THREE.Mesh(helicoid(260),bladeM));
/* 驱动端: 齿轮箱 + 摇柄(红握把=施力处) */
const gearBox=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.62,0.62),steelM);gearBox.position.x=-0.95;spinG.add(gearBox);
const arm=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.66,0.1),shaftM);arm.position.set(-1.34,-0.3,0);spinG.add(arm);
const grip=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.55,12),gripM);
grip.rotation.z=Math.PI/2;grip.position.set(-1.55,-0.62,0);spinG.add(grip);
/* 轴承座环(不随轴转) */
const bearGeo=new THREE.TorusGeometry(SHAFT_R+0.1,0.05,10,28);bearGeo.rotateY(Math.PI/2);
const bearing=new THREE.Mesh(bearGeo,steelM);bearing.position.x=-0.85;tiltG.add(bearing);
/* 下水池(进水端浸入) */
const poolG=new THREE.Group();poolG.position.set(-4.35,0,0);scene.add(poolG);
const poolWallM=new THREE.MeshStandardMaterial({color:0x4c565f,roughness:0.9,side:THREE.DoubleSide});
const wall=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.3,0.72,44,1,true),poolWallM);
wall.position.y=0.36;poolG.add(wall);
const poolFloor=new THREE.Mesh(new THREE.CircleGeometry(2.24,44),stoneM);
poolFloor.rotation.x=-Math.PI/2;poolFloor.position.y=0.03;poolG.add(poolFloor);
const poolWater=new THREE.Mesh(new THREE.CircleGeometry(2.12,44),poolM);
poolWater.rotation.x=-Math.PI/2;poolWater.position.y=0.42;poolWater.renderOrder=1;poolG.add(poolWater);
/* 出水端接水槽(随倾角移动,保持水平) */
const troughG=new THREE.Group();scene.add(troughG);
{
  const b=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.08,1.15),steelM);troughG.add(b);
  for(const s of [-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.6,1.15),steelM);w.position.set(s*0.81,0.3,0);troughG.add(w);
    const f=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.6,0.08),steelM);f.position.set(0,0.3,s*0.535);troughG.add(f);}
  const tw=new THREE.Mesh(new THREE.BoxGeometry(1.54,0.04,0.99),poolM);tw.position.y=0.34;tw.renderOrder=1;troughG.add(tw);
}
/* 支架(随倾角伸缩) */
const postGeo=new THREE.BoxGeometry(0.24,1,0.62);
const posts=[6.2,9.4].map(a=>{const m=new THREE.Mesh(postGeo,steelM);m.userData.a=a;scene.add(m);return m;});
const pedestal=new THREE.Mesh(new THREE.BoxGeometry(0.3,1,0.3),steelM);scene.add(pedestal);

/* ---- 状态 ---- */
let playing=true,labelsOn=true,demoT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;

function updateTilt(){ // 倾角: 整机绕进水端支点旋转, 出水端抬高, 支架/水槽跟随
  tilt=tiltDeg*Math.PI/180;tiltG.rotation.z=tilt;
  const c=Math.cos(tilt),s=Math.sin(tilt);
  for(const p of posts){
    const a=p.userData.a,h=Math.max(0.1,PIVOT.y+a*s-0.95);
    p.scale.set(1,h,1);p.position.set(PIVOT.x+a*c,h/2,0);
  }
  const hp=Math.max(0.08,PIVOT.y-0.85*s-0.32);
  pedestal.scale.set(1,hp,1);pedestal.position.set(PIVOT.x-0.85*c,hp/2,0);
  troughG.position.set(PIVOT.x+10.85*c,PIVOT.y+10.85*s-0.36,0);
  controls.target.y=1.3+3.1*s;
}
const axPos=(a,dx=0,dy=0)=>V3(PIVOT.x+a*Math.cos(tilt)+dx,PIVOT.y+a*Math.sin(tilt)+dy,0);

/* ---- 水团粒子: 轨道坐标 s(轴向), 与叶片同速推进 → 永在格中 ---- */
const parcelsG=new THREE.Group();scene.add(parcelsG);
const parcelGeo=new THREE.SphereGeometry(PARCEL_R,18,14);
const parcels=[];let tracker=null;
for(let i=0;i<7;i++){
  const m=new THREE.Mesh(parcelGeo,waterM);m.scale.setScalar(0.001);parcelsG.add(m);
  parcels.push({m,s:0,st:'wait',dir:1,v:new THREE.Vector3(),t:0,sc:0});
}
function resetSim(){
  phi=0;spinG.rotation.x=0;tracker=null;demoT=0;
  parcels.forEach((p,i)=>{
    p.st=i<5?'ride':'wait';p.dir=1;p.t=0;p.v.set(0,0,0);p.sc=i<5?1:0;
    p.s=i<5?S0+0.05+i*PITCH:S0-(i-4)*PITCH;
  });
}
const minRideS=()=>{let m=Infinity;for(const p of parcels)if(p.st==='ride'&&p.s<m)m=p.s;return isFinite(m)?m:S0+0.05;};
const maxRideS=()=>{let m=-Infinity;for(const p of parcels)if(p.st==='ride'&&p.s>m)m=p.s;return isFinite(m)?m:S1-0.05;};
function startPour(p,dir){ // dir=+1 顶端溢出 / -1 底端倒出
  p.st='pour';p.dir=dir;p.t=0;
  const c=Math.cos(tilt),s=Math.sin(tilt),vAx=Math.abs(omega())*PITCH/(2*Math.PI);
  if(dir>0){p.m.position.copy(axPos(10.02,0,-R_W));p.v.set(c*vAx,s*vAx+0.25,0);}
  else{p.m.position.copy(axPos(-0.02,0,-R_W));p.v.set(-c*vAx,-s*vAx-0.1,0);}
}
function advance(dPhi){ // 转角→轴向: 所有水团 s += dPhi/K, 与叶片严格同步
  if(dPhi===0)return;
  phi+=dPhi;spinG.rotation.x=phi;
  const dx=dPhi/K;
  for(const p of parcels){
    if(p.st==='pour')continue;
    p.s+=dx;
    if(p.st==='ride'){
      if(dx>0&&p.s>S1)startPour(p,1);
      else if(dx<0&&p.s<S0)startPour(p,-1);
    }else if(p.s>=S0&&p.s<=S1)p.st='ride';   // 等待中的水团从进/出水端入列
    p.s=clamp(p.s,S0-2.6*PITCH,S1+2.6*PITCH);
  }
}
function updateParcels(dt){
  const leak=1-0.45*slipK();   // 回漏多→每斗水变少(大倾角/低转速)
  for(const p of parcels){
    if(p.st!=='pour')p.m.position.copy(axPos(clamp(p.s,-0.4,TUBE_L+0.4),0,-R_W));
    p.sc+=((p.st==='wait'?0:1)-p.sc)*clamp(dt*6,0,1);
    const k=Math.max(0.001,p.sc*leak);
    p.m.scale.set(k,k*0.8,k);
  }
}
/* 单格追踪: 高亮最新入列的小斗, 跟到溢出为止 */
function pickTracker(){
  if(!document.getElementById('tglTrack').checked){tracker=null;return;}
  if(!tracker||tracker.st==='wait'){
    let best=null,bs=Infinity;
    for(const p of parcels)if(p.st==='ride'&&p.s<bs){bs=p.s;best=p;}
    tracker=best;
  }
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'斜管里水只会往低处流：没有螺旋，倒进去的水一路溜回池底',en:'Water in a tilted pipe only runs downhill — without the screw it all slips back'},
 {zh:'螺旋叶片把圆管切成一格格小斗，每格就是一级台阶',en:'The helical blade splits the tube into pockets — each pocket is one step'},
 {zh:'转动：下方叶片把水截住，随轴把整格水抬升一个螺距',en:'Turning: the blade below traps the water and lifts the pocket one pitch'},
 {zh:'倾角变大：每圈抬升更高(扬程↑)，但水更易翻过叶尖漏回(流量↓)',en:'Steeper tilt: more head per turn, but more water slips over the blade tips'},
 {zh:'反向转：叶片反过来把水一级级带下去——同一台机器也能泄水',en:'Reverse: the blades carry water back down — the same machine drains too'},
 {zh:'从尼罗河到荷兰圩田再到螺旋输送机：同一套斜面接力',en:'From the Nile to Dutch polders to screw conveyors: the same inclined-plane relay'},
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function setRpmUI(v){rpm=v;document.getElementById('sRpm').value=v;document.getElementById('sRpmVal').textContent=v+' rpm';}
function setTiltUI(v){tiltDeg=v;document.getElementById('sTilt').value=v;document.getElementById('sTiltVal').textContent=v+'°';updateTilt();}
function setRevUI(b){rev=b;document.getElementById('tglRev').checked=b;}
function applyPhase(i){
  if(i===0){setTiltUI(30);setRpmUI(0);setRevUI(false);}       // 无螺旋: 水直接溜下去(演示水滴)
  else if(i===1){setTiltUI(30);setRpmUI(5);setRevUI(false);}  // 慢转看清一格格小斗
  else if(i===2){setTiltUI(30);setRpmUI(28);setRevUI(false);} // 正常提水
  else if(i===3){setTiltUI(44);setRpmUI(28);setRevUI(false);} // 大倾角: 扬程高但易漏
  else if(i===4){setTiltUI(30);setRpmUI(28);setRevUI(true);}  // 反转: 水被带下去
  else {setTiltUI(30);setRpmUI(42);setRevUI(false);}          // 应用: 高效输水
  syncSteps();
}

/* ---- 读数 ----
   流量(相对模型): Q = rpm/60 × 单斗容积26L × 容积效率η(α), η=1-0.85sin²α (叶尖泄漏随倾角);
   扬程 = 管长2.5m×sinα (几何量, 只随倾角)。反向时流量为负。 */
function updateStats(){
  const eff=1-slipK();
  const q=rpm/60*V_POCKET*eff*(rev?-1:1);
  document.getElementById('stRpm').innerHTML=rpm.toFixed(0)+'<small> rpm</small>';
  document.getElementById('stTilt').innerHTML=tiltDeg.toFixed(0)+'<small> °</small>';
  const eF=document.getElementById('stFlow');
  eF.innerHTML=(q<0?'−':'')+Math.abs(q).toFixed(1)+'<small> L/s</small>';
  eF.className='v'+(((rev&&rpm>0)||(slipK()>0.26&&rpm>0))?' warn':'');
  document.getElementById('stHead').innerHTML=(TUBE_L*M_PER_U*Math.sin(tilt)).toFixed(2)+'<small> m</small>';
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);
  const pfn=pos.isVector3?null:pos;
  if(pos.isVector3)o.position.copy(pos);
  scene.add(o);labelReg.push({o,text:textFn,vis:visFn,pfn});div.textContent=textFn();return o;
}
addLabel(()=>L('进水口 · 浸入水池','Inlet · dipped in the pond'),()=>axPos(-0.2,-0.55,-1.05),'b');
addLabel(()=>L('螺旋叶片：一格格小斗','Helical blade: pocket by pocket'),()=>axPos(4.4,0,1.25),'o');
addLabel(()=>L('出水口 · 溢流入槽','Outlet · spills to the trough'),()=>axPos(10.25,0.45,0.7),'g');
addLabel(()=>L('倾角 α=','tilt α=')+tiltDeg.toFixed(0)+'°',()=>axPos(2.0,0,-1.45),'b');
addLabel(()=>L('倾角大·转速低：水翻过叶尖漏回，流量下降','Steep & slow: water slips over blade tips — flow drops'),()=>axPos(7.3,0,1.3),'r',()=>slipK()>0.26);
addLabel(()=>L('反转：叶片把水带下去','Reverse: blades carry water down'),()=>axPos(5.6,0,-1.5),'r',()=>rev&&rpm>0);
addLabel(()=>L('摇柄 / 驱动端','Crank / drive end'),()=>axPos(-1.05,-0.9,0.75),'o');
addLabel(()=>L('追踪小斗','tracked pocket'),
  ()=>tracker&&tracker.st!=='wait'?tracker.m.position.clone().add(V3(0,0.62,0)):V3(0,-99,0),'g',
  ()=>document.getElementById('tglTrack').checked&&tracker&&tracker.st!=='wait'&&parcelsG.visible);
/* 演示水滴(步骤1): 无螺旋时水沿管底直接溜到底 */
const demoDrop=new THREE.Mesh(new THREE.SphereGeometry(0.24,16,12),demoM);
demoDrop.renderOrder=3;demoDrop.visible=false;parcelsG.add(demoDrop);

/* ---- 事件 ---- */
document.getElementById('sRpm').addEventListener('input',e=>setRpmUI(+e.target.value));
document.getElementById('sTilt').addEventListener('input',e=>setTiltUI(+e.target.value));
document.getElementById('tglRev').addEventListener('change',e=>{rev=e.target.checked;});
document.getElementById('tglWater').addEventListener('change',e=>{parcelsG.visible=e.target.checked;});
document.getElementById('tglTrack').addEventListener('change',e=>{if(!e.target.checked)tracker=null;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('btnStep').addEventListener('click',()=>advance((rev?-1:1)*Math.PI/3));
document.getElementById('btnReset').addEventListener('click',resetSim);
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x0d1216:0xe8ecef);
  scene.fog.color.setHex(dark?0x0d1216:0xe8ecef);
  groundM.color.setHex(dark?0x1a2027:0xc6cdd3);
  stoneM.color.setHex(dark?0x4c565f:0xaeb8c0);
  poolWallM.color.setHex(dark?0x4c565f:0xaeb8c0);
  steelM.color.setHex(dark?0x39424c:0x8c98a2);
  poolM.opacity=dark?0.55:0.7;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  syncPlayBtn();buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    advance(omega()*dt);
    for(const p of parcels)if(p.st==='pour'){   // 溢出/倒出: 抛体运动入槽/入池
      p.t+=dt;p.v.y-=7*dt;p.m.position.addScaledVector(p.v,dt);
      const surf=p.dir>0?troughG.position.y+0.36:0.42;
      if(p.m.position.y<=surf+0.06||p.t>3){
        p.st='wait';p.s=p.dir>0?minRideS()-PITCH:maxRideS()+PITCH;
        p.s=clamp(p.s,S0-2.6*PITCH,S1+2.6*PITCH);
      }
    }
    demoT+=dt;
  }
  updateParcels(dt);
  /* 演示水滴: 仅步骤1, 沿最低素线从顶溜到底 */
  if(activeStep===0&&playing){
    const cyc=demoT%4.2;
    if(cyc<3.2){
      const u=cyc/3.2,a=9.3-9.0*u;
      demoDrop.position.copy(axPos(a,0,-R_W));
      const k=Math.min(1,5*u,5*(1-u));demoDrop.scale.setScalar(Math.max(0.001,k));
      demoDrop.visible=parcelsG.visible;
    }else demoDrop.visible=false;
  }else demoDrop.visible=false;
  pickTracker();
  for(const p of parcels)p.m.material=(p===tracker)?trackM:waterM;
  acc+=dt;if(acc>0.12){acc=0;updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis();
    if(!r.o.visible)continue;
    if(r.pfn)r.o.position.copy(r.pfn());
    r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化：30°倾角 + 28rpm 即刻爬水溢流，招牌画面 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setTiltUI(30);setRpmUI(28);setRevUI(false);
resetSim();
updateStats();syncPlayBtn();start();
</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
