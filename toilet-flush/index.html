<style>

  :root[data-theme="light"] .lbl { text-shadow: none; }

  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#0c8599; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }

  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }

  .chip.b { color: #bdeef5; border-color: rgba(59,201,219,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }

  :root[data-theme="light"] .chip.b { color:#0c8599; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.o { color:#a34e00; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(59,201,219,.6); background: rgba(59,201,219,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(12,133,153,.55); background: rgba(12,133,153,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }

  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(59,201,219,.10); border-color: rgba(59,201,219,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,133,153,.08); border-color: rgba(12,133,153,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bdeef5; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }

  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }

</style>

  <div class="sub" data-zh="按下手柄,翻板掀开,6 L 水按托里拆利 √(2gh) 在 3.5 秒内砸进碗;水位漫过存水弯堰口的瞬间,管内水柱在重力下自坠、把碗侧抽成负压——虹吸这只一次性启动的泵以约 2 L/s 把碗连同污物整体抽空,直到空气钻进管道、水柱断裂自毁;浮子跌落打开进水阀补水,补水管分出一缕 0.07 L/s 细流把残水重新垫回 55 mm 水封——这条水柱是隔断排污管臭气的唯一单向闸,浅一厘米,臭气通道就全线开放 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Press the handle, the flapper lifts, and 6 L of water crashes in by Torricelli's √(2gh) within 3.5 s; the moment the level crests the trap weir, the water column falls under gravity and drags the bowl side below atmospheric — the one-shot siphon pump empties the whole bowl at about 2 L/s until air breaks the column and the pump destroys itself; the dropping float reopens the fill valve, and a 0.07 L/s refill trickle rebuilds the 55 mm water seal — the only one-way gate against sewer gas; one centimetre shallow and the stink channel is wide open · 3D interactive demo · drag to orbit · Space = run/pause">抽水马桶 · 虹吸是一次性启动的泵</div>
</div>

  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

    <a href="../barometer/" data-zh="气压计:水柱为何止步 10 m" data-en="barometer: why water columns stop at 10 m">气压计:水柱为何止步 10 m</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 18, 60);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
  ceramM.color.setHex(dark ? 0xf0f2f4 : 0xe3e7ea);
  pipeM.color.setHex(dark ? 0x3b434e : 0x8e99a6);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('抽水马桶 · 虹吸是一次性启动的泵', 'Flush Toilet · The Siphon Is a One-Shot Pump');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 140);
camera.position.set(8.4, 4.4, 11.6);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0.4, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(6, 9, 7);
scene.add(key);
const fillLight = new THREE.DirectionalLight(0x9adfff, 0.3);
fillLight.position.set(-7, 5, -6);
scene.add(fillLight);

/* ================= 状态(物理模型,真实单位) ================= */
const G = 9.8;
const TANK_CAP = 6.0;        // 水箱容积 L
const TANK_H = 0.30;         // 水箱水柱满高 m
const DUMP_A = 0.0028;       // 翻板阀孔面积 m²(约 60 mm 孔)
const CD = 0.55;             // 孔口流量系数
const BOWL_A = 0.026;        // 碗侧等效水平面积 m²

function spawn(curve, speed, col, jitter = 0.03) {
  if (parts.length >= P_MAX) return;
  parts.push({ c: curve, u: 0, s: speed, col, j: jitter, ph: Math.random() * 6.28 });
}
function stepParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.u += p.s * dt;
    p.ph += dt * 9;
    if (p.u >= 1) parts.splice(i, 1);
  }
}
function drawParts() {
  const n = parts.length;
  for (let i = 0; i < P_MAX; i++) {
    if (i < n) {
      const p = parts[i];
      const v = p.c.getPoint(Math.min(1, p.u));
      pPos[i * 3] = v.x + Math.sin(p.ph) * p.j;
      pPos[i * 3 + 1] = v.y + Math.cos(p.ph * 1.3) * p.j;
      pPos[i * 3 + 2] = v.z + Math.sin(p.ph * 0.7) * p.j;
      pCol[i * 3] = p.col.r; pCol[i * 3 + 1] = p.col.g; pCol[i * 3 + 2] = p.col.b;
    } else {
      pPos[i * 3 + 1] = -999;
    }
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

function pressFlush() {
  flapperOpen = true;
  gasDrain = false;
  if (!cycleOn) cycleOn = true;
  notifyT = 2.4;
  notifyZ = '翻板掀开:孔口出流 Q=Cd·A·√(2gh),水箱快排';
  notifyE = 'flapper up: orifice flow Q=Cd·A·√(2gh), tank dumps';

function breakSealDemo() {

  notifyE = 'seal sucked shallow: too little water to block the path, gas climbs into the room';
}
function resetAll() {
  tankV = TANK_CAP; bowlH = DIP_Y + seal;
  flapperOpen = false; flapperK = 0; primed = false; gasDrain = false;
  qDump = qSip = qTube = 0; cycleOn = false;
  parts.length = 0;
}
function simStep(dt) {
  simT += dt;
  flapperK = flapperOpen ? Math.min(1, flapperK + dt * 3.2) : Math.max(0, flapperK - dt * 1.6);
  const hT = Math.max(0, tankV / TANK_CAP) * TANK_H;
  qDump = 0;
  if (flapperK > 0.6 && tankV > 0.02) {
    qDump = Math.min(CD * DUMP_A * Math.sqrt(2 * G * Math.max(0.02, hT)) * 1000, tankV / dt);
    tankV -= qDump * dt;
    if (tankV <= 0.02) { tankV = 0.02; flapperOpen = false; }
  }
  const fillOpen = tankV < TANK_CAP * 0.985;
  const qFill = fillOpen ? fillRate : 0;
  tankV = clamp(tankV + qFill * 0.78 * dt, 0.02, TANK_CAP);
  if (cycleOn && qFill > 0 && tankV >= TANK_CAP * 0.98) {
    cycleOn = false;
    events.push({ t: simT, k: EV.shut });
    notifyT = 2.2;
    notifyZ = '浮子到设定高度,进水阀关断:一轮结束';
    notifyE = 'float at set height, fill valve shut: cycle complete';
  }
  qTube = fillOpen && !primed ? TUBE_Q : 0;
  /* 虹吸:点火 → 维持 → 破膜 */
  qSip = 0;
  const over = bowlH - WEIR_Y;
  if (!primed && !gasDrain && over > 0.004) {
    qSip = 22 * Math.sqrt(over);
    if (qSip > 0.35) {
      primed = true;
      events.push({ t: simT, k: EV.prime });
      notifyT = 2.4;
      notifyZ = '水漫过堰口,管内水柱连续:虹吸点火,流量跃升';
      notifyE = 'water crests the weir, the tube runs full: siphon primed, flow jumps';
    }
  } else if (primed) {
    qSip = 1.9 * Math.sqrt(Math.max(0.02, bowlH - DIP_Y) / 0.12);
    const Vb = (bowlH - DIP_Y) * BOWL_A * 1000;
    if (Vb + (qDump + qTube) * dt - qSip * dt <= V_RES) {
      primed = false;
      events.push({ t: simT, k: EV.brk });
      notifyT = 2.6;
      notifyZ = '碗被抽到残水,空气钻进管道:水柱断裂,虹吸自毁';
      notifyE = 'bowl down to residue, air enters the tube: column breaks, siphon self-destructs';
    }
  }
  if (gasDrain && bowlH > DIP_Y + 0.003) bowlH -= dt * 0.05;
  bowlH += ((qDump + qTube - qSip) / (BOWL_A * 1000)) * dt;
  bowlH = clamp(bowlH, DIP_Y + 0.003, 1.45);
  /* 粒子生成 */
  if (partsOn) {
    if (qDump > 0.3) {
      if (Math.random() < qDump * dt * 14) spawn(curveFlush, 0.9 + Math.random() * 0.4, cWater);
      if (Math.random() < qDump * dt * 10) spawn(curveRim, 0.7 + Math.random() * 0.4, cRim);
    }
    if (primed && Math.random() < qSip * dt * 16) spawn(trapCurve, 0.55 + Math.random() * 0.25, cWater);
    const sealNow = (bowlH - DIP_Y) * 1000;
    if (!primed && sealNow < 8 && Math.random() < dt * 22) spawn(curveGas, 0.32 + Math.random() * 0.15, cGas, 0.05);
    else if (!primed && sealNow < 20 && Math.random() < dt * 10) spawn(curveGasBlock, 0.3 + Math.random() * 0.12, cGas, 0.04);
  }
  /* 采样(曲线用真实状态) */
  if (buf.length === 0 || simT - buf[buf.length - 1].t > 0.08) {
    buf.push({ t: simT, tk: tankV / TANK_CAP * 100, bw: (bowlH - DIP_Y) * 1000 });
    while (buf.length && simT - buf[0].t > 75) buf.shift();
  }
  while (events.length && simT - events[0].t > 75) events.shift();
}

}

    d: '存水弯是一段存着水的 U 形管:静水面比堰口低 55 mm,这段水柱把排污管与室内完全隔开——臭气要进屋必须以气泡形式顶穿水柱,而通气帽让两侧气压相等,没有持续压差,气体只能停在管里。点「破坏水封」看通道开放的样子。',
    de: 'The trap is a water-holding U-tube: the surface rests 55 mm below the weir, and this column fully separates the drain from the room — gas would have to bubble through, and with the vent stack equalising pressure there is no push, so it stays in the pipe. Break the seal to see the open channel.',
    act: () => { phaseIdx = 0; setState({ bowl: DIP_Y + 0.004, gas: true }); flyTo([3.4, 2.3, 5.6], [1.2, 0.6, 0]); } },
  { b: '按手柄:翻板打开快排', be: 'Press the handle: the flapper opens a fast dump',

    de: 'The flapper lifts and opens the tank-bottom orifice; flow obeys Torricelli, Q=Cd·A·√(2gh): 6 L in about 3.5 s, peaking at 3.7 L/s, driving the bowl level past the weir.',
    act: () => { phaseIdx = 1; setState({ tank: 5.6, flap: true }); pressFlush(); flyTo([-2.7, 3.4, 6.4], [-2.75, 2.3, 0]); } },
  { b: '漫过堰口:虹吸一次性点火', be: 'Over the weir: the siphon primes once',
    d: '水位漫过堰口的瞬间,管内水柱连续并整体在重力下自坠,出口侧把碗侧抽成负压——虹吸这只「一次性启动的泵」点火,流量跃到约 2 L/s,远超进水,水面被整体抽降。',
    de: 'The instant water crests the weir the tube runs full and the column falls under gravity, pulling the bowl side below atmospheric — the one-shot pump fires, flow leaps to about 2 L/s, far beyond any inflow, and the surface drops as a body.',
    act: () => { phaseIdx = 2; setState({ tank: 2.4, bowl: 0.72, primed: true, flap: true }); flyTo([2.6, 2.4, 4.6], [1.3, 0.7, 0]); } },
  { b: '抽空与破膜:虹吸自毁', be: 'Empty and break: the siphon destroys itself',
    d: '虹吸没有水源就自限:碗被抽到只剩残水时,空气钻进管道,水柱断裂、负压消失,流量瞬间归零——泵是自己关掉自己的。残水只剩几毫米,水封宣告失效。',
    de: 'With no reservoir the siphon is self-limiting: when the bowl is down to residue, air enters the tube, the column snaps, the vacuum vanishes and flow stops instantly — the pump shuts itself off, leaving millimetres of water: the seal has failed.',
    act: () => { phaseIdx = 3; setState({ tank: 0.3, bowl: 0.64, primed: true }); flyTo([4.4, 2.2, 5.4], [2.3, 0.3, 0]); } },
  { b: '浮子跌落:进水阀补水', be: 'The float drops: the fill valve reopens',
    d: '水箱排空,浮子跟着跌到底,杠杆把进水阀顶开,0.28 L/s 流回水箱;浮子-杠杆-阀是最简单的负反馈:水位决定阀的开度,与设定高度的差就是补水速率。',
    de: 'The emptied tank drags its float down; the lever cracks the fill valve open and 0.28 L/s flows back. Float-lever-valve is negative feedback at its simplest: level sets the valve, the gap to set-height sets the rate.',
    act: () => { phaseIdx = 4; setState({ tank: 0.15, bowl: DIP_Y + 0.004 }); flyTo([-3.2, 3.2, 5.6], [-3.0, 2.3, 0]); } },
  { b: '补水管重建水封,浮子到高关断', be: 'Refill tube rebuilds the seal; float shuts off',
    d: '进水阀分出 0.07 L/s 细流,经溢流管滴进碗侧,把残水重新垫回 55 mm 水封;水箱到位后浮子抬阀关断,整轮闭合——下次冲水,虹吸将再次点火、再次自毁。',
    de: 'The valve diverts a 0.07 L/s trickle through the overflow into the bowl, rebuilding the 55 mm seal; at set height the float shuts the valve and the cycle closes — next flush, the siphon fires and self-destructs again.',
    act: () => { phaseIdx = 5; setState({ tank: 4.6, bowl: DIP_Y + 0.03 }); flyTo([-1.2, 3.4, 5.2], [-0.9, 2.9, 0]); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:水位-时间(实时仿真) ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 40, padR = 48, padT = 16, padB = 26;
  const VIEW = 45;
  const t1 = Math.max(simT, VIEW), t0 = t1 - VIEW;
  const xOf = t => padL + clamp((t - t0) / VIEW, 0, 1) * (W - padL - padR);
  const yTk = v => (H - padB) - clamp(v, 0, 100) / 100 * (H - padT - padB);
  const yBw = v => (H - padB) - clamp(v, 0, 260) / 260 * (H - padT - padB);
  ctx.font = '13px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const v of [0, 50, 100]) {
    ctx.beginPath(); ctx.moveTo(padL, yTk(v)); ctx.lineTo(W - padR, yTk(v)); ctx.stroke();
    ctx.fillText(String(v), 8, yTk(v) + 4);
  }
  for (const v of [55, 260]) {
    ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(padL, yBw(v)); ctx.lineTo(W - padR, yBw(v)); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.fillText('水箱%', 8, padT + 2);
  ctx.fillText('碗mm', W - padR + 4, padT + 2);
  ctx.fillText(`${t0.toFixed(0)}s`, padL, H - padB + 18);
  ctx.fillText('now', W - padR - 18, H - padB + 18);
  if (buf.length > 1) {
    const line = (key, ymap, col, lw) => {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath();
      let started = false;
      for (const p of buf) {
        if (p.t < t0) continue;
        const x = xOf(p.t), y = ymap(p[key]);
        started ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        started = true;
      }
      ctx.stroke();
    };
    line('bw', yBw, '#ffa94d', 2.4);
    line('tk', yTk, '#3bc9db', 2.4);
    for (const e of events) {
      if (e.t < t0) continue;
      const x = xOf(e.t);
      ctx.strokeStyle = e.k === EV.prime ? 'rgba(59,201,219,.7)' : e.k === EV.brk ? 'rgba(255,107,107,.7)' : 'rgba(116,220,132,.7)';
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, H - padB); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fillText(e.k === EV.prime ? '点火' : e.k === EV.brk ? '破膜' : '关断', x + 3, padT + 10);
    }
  }
  ctx.fillStyle = '#3bc9db';
  ctx.fillText(L('水箱水位', 'tank'), padL + 8, padT + 26);
  ctx.fillStyle = '#ffa94d';
  ctx.fillText(L('碗内水柱 mm', 'bowl mm'), padL + 78, padT + 26);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSeal = document.getElementById('sSeal'), elSealVal = document.getElementById('sSealVal');
const elFill = document.getElementById('sFill'), elFillVal = document.getElementById('sFillVal');
const stTank = document.getElementById('stTank'), stBowl = document.getElementById('stBowl'),
  stSeal = document.getElementById('stSeal'), stSip = document.getElementById('stSip'),
  stValve = document.getElementById('stValve'), stPhase = document.getElementById('stPhase');
const formulaEl = document.getElementById('formula');
const btnFlush = document.getElementById('btnFlush'), btnGas = document.getElementById('btnGas'),
  btnReset = document.getElementById('btnReset'), btnView = document.getElementById('btnView');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elSeal.value = Math.round(seal * 1000); elSealVal.textContent = `${Math.round(seal * 1000)} mm`;
  elFill.value = fillRate; elFillVal.textContent = `${fillRate.toFixed(2)} L/s`;
}
function syncBtns() {
  btnFlush.classList.toggle('on', flapperOpen);
  btnGas.classList.toggle('on', gasDrain);
}
function phaseName() {
  if (primed) return L('虹吸', 'siphon');
  if (flapperK > 0.3 && tankV < TANK_CAP * 0.95) return L('快排', 'dump');
  if (gasDrain) return L('水封失效', 'seal failed');
  if (tankV < TANK_CAP * 0.985) return L('补水', 'refill');
  return L('待机', 'idle');
}
function updateStats() {
  stTank.innerHTML = `${tankV.toFixed(1)}<small> L · ${(tankV / TANK_CAP * 100).toFixed(0)}%</small>`;
  stBowl.textContent = `${((bowlH - DIP_Y) * 1000).toFixed(0)} mm`;
  const sm = (bowlH - DIP_Y) * 1000;
  stSeal.textContent = `${sm.toFixed(0)} mm`;
  stSeal.className = 'v ' + (sm >= 20 ? 'ok' : sm >= 8 ? 'warn' : 'bad');
  stSip.textContent = qSip > 0.02 ? qSip.toFixed(2) + ' L/s' : '0';
  stSip.className = 'v ' + (qSip > 0.02 ? 'warn' : '');
  const fillOpen = tankV < TANK_CAP * 0.985;
  stValve.textContent = fillOpen ? L('开 · 补水中', 'open · filling') : L('关 · 浮子已锁定', 'shut · float locked');
  stValve.className = 'v ' + (fillOpen ? 'warn' : 'ok');
  stPhase.textContent = phaseName();
}
function updateFormula() {
  const hNow = Math.max(0.02, tankV / TANK_CAP * TANK_H);
  formulaEl.innerHTML = L(
    `<b>孔口快排:Q = Cd·A·√(2gh)</b> = 0.55×28 cm²×√(2×9.8×${hNow.toFixed(2)}) = ${(CD * DUMP_A * Math.sqrt(2 * G * hNow) * 1000).toFixed(2)} L/s<br>` +
    `<b>虹吸条件:</b>水位漫过堰口 → 管内水柱连续,出口自坠产生负压;破膜即停,是一次性启动的泵<br>` +
    `<b>水封静压:</b>55 mm 水柱 ≈ 0.54 kPa——挡臭气靠「封死通道」,不靠压差<br>` +
    `<b>补水:</b>阀 ${fillRate.toFixed(2)} L/s,其中 0.07 L/s 走补水管专责垫回水封`,
    `<b>Orifice dump: Q = Cd·A·√(2gh)</b> = 0.55×28 cm²×√(2×9.8×${hNow.toFixed(2)}) = ${(CD * DUMP_A * Math.sqrt(2 * G * hNow) * 1000).toFixed(2)} L/s<br>` +
    `<b>Siphon condition:</b> level crests the weir → tube runs full, the falling outlet evacuates the bowl side; it breaks and stops — a one-shot pump<br>` +
    `<b>Seal head:</b> 55 mm of water ≈ 0.54 kPa — gas is blocked by plugging the path, not by pressure<br>` +
    `<b>Refill:</b> valve ${fillRate.toFixed(2)} L/s, of which 0.07 L/s trickles via the overflow to rebuild the seal`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elSeal.addEventListener('input', () => {
  seal = +elSeal.value / 1000;
  if (!primed && !flapperOpen && !gasDrain && tankV > TANK_CAP * 0.9) bowlH = DIP_Y + seal;
  syncSliders(); updateStats(); updateFormula();
});
elFill.addEventListener('input', () => { fillRate = +elFill.value; syncSliders(); updateFormula(); });
btnFlush.addEventListener('click', () => { pressFlush(); syncBtns(); });
btnGas.addEventListener('click', () => { breakSealDemo(); syncBtns(); });
btnReset.addEventListener('click', () => { resetAll(); syncAll(); });
btnView.addEventListener('click', () => flyTo([8.4, 4.4, 11.6], [0.4, 1.2, 0]));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglParts').addEventListener('change', e => { partsOn = e.target.checked; if (!partsOn) parts.length = 0; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    simStep(dt);
    stepParts(dt);
  }
  /* 布局同步 */
  layoutTankWater();
  layoutBowlWater();
  layoutTrapWater();
  const floatY = layoutTankWater();
  const th = Math.asin(clamp((floatY + 0.05 - 2.16) / 0.72, -0.9, 0.62));
  floatArm.rotation.z = th;
  floatBall.position.set(0.72 * Math.cos(th), 0.72 * Math.sin(th), 0);
  valveM.emissiveIntensity = tankV < TANK_CAP * 0.985 ? 0.6 + 0.25 * Math.sin(performance.now() / 180) : 0.05;
  flapHinge.rotation.z = -flapperK * 1.15;
  handleG.rotation.x = flapperK * 0.5;
  tubeM.emissiveIntensity = qTube > 0 ? 0.7 : 0.04;
  flapperM.emissiveIntensity = flapperK > 0.4 ? 0.6 : 0;
  weirM.emissiveIntensity = primed ? 0.9 : (bowlH > WEIR_Y - 0.02 ? 0.6 : 0.12);
  waterM.emissiveIntensity = primed ? 0.75 : 0.35;
  gasArr.visible = (bowlH - DIP_Y) * 1000 < 20;
  drawParts();
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.12) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
layoutTankWater();
layoutBowlWater();
layoutTrapWater();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
