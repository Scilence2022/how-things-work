<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨影效应 · 一座山两种命运</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ff8787;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c92a2a;
    --bg:#f0efed; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,135,135,.6); background: rgba(255,135,135,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(201,42,42,.55); background: rgba(201,42,42,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,135,135,.10); border-color: rgba(255,135,135,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(201,42,42,.08); border-color: rgba(201,42,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffc2c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="雨影效应:一座山,两种命运" data-en="Rain Shadow: One Mountain, Two Fates">雨影效应:一座山,两种命运</h1>
  <div class="sub" data-zh="湿气团被迫爬山,干绝热冷却 9.8 °C/km;到露点开始凝结,潜热接手、降温放缓——雨全下在迎风坡;过顶后的空气已经干透,下沉压缩回暖成焚风:同一座山,迎风是雨林,背风是沙漠 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A wet air mass is forced up the mountain, cooling 9.8 °C/km dry-adiabatically; at the dew point condensation begins and latent heat slows the cooling — all the rain falls windward; past the summit the air is bone dry and warms by compression: a foehn wind. One mountain: rainforest windward, desert leeward · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">湿气团被迫爬山,干绝热冷却 9.8 °C/km;到露点开始凝结,潜热接手、降温放缓——雨全下在迎风坡;过顶后的空气已经干透,下沉压缩回暖成焚风:同一座山,迎风是雨林,背风是沙漠 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="云底高度" data-en="Cloud base">云底高度</span><span class="v b" id="stL">—</span>
  <span class="k" data-zh="山顶温度" data-en="Summit temp">山顶温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="迎风坡雨量" data-en="Windward rain">迎风坡雨量</span><span class="v ok" id="stR">—</span>
  <span class="k" data-zh="背风麓气温" data-en="Lee foot temp">背风麓气温</span><span class="v warn" id="stF">—</span>
  <span class="k" data-zh="阶段" data-en="Stage">阶段</span><span class="v" id="stP">—</span>
</div>

<div id="plot">
  <h3 data-zh="温度-高度剖面:干绝热(橙)· 湿绝热(蓝)· 露点(红虚线)· 圆点=气团" data-en="T-altitude profile: dry adiabat (orange) · moist (blue) · dew point (red dashes) · dot = parcel">温度-高度剖面:干绝热(橙)· 湿绝热(蓝)· 露点(红虚线)· 圆点=气团</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.g" data-zh="迎风:雨林" data-en="windward: rainforest">迎风:雨林</span>
    <span class="chip.o" data-zh="背风:雨影沙漠+焚风" data-en="leeward: rain shadow + foehn">背风:雨影沙漠+焚风</span>
    <span class="chip.b" data-zh="气团" data-en="air parcel">气团</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnFlip" data-zh="风向翻转(雨影换边)" data-en="flip wind (swap the shadow)">风向翻转(雨影换边)</button>
    <button class="abtn" id="btnHimalaya" data-zh="喜马拉雅预设(3.0 km)" data-en="Himalaya preset (3.0 km)">喜马拉雅预设(3.0 km)</button>
  </div>
  <div class="row"><label data-zh="山高" data-en="Mountain height">山高</label><input id="hmt" type="range" min="0.4" max="3" step="0.05" value="2.2"><span class="val" id="hmtVal">2.2 km</span></div>
  <div class="row"><label data-zh="露点(湿度)" data-en="Dew point">露点(湿度)</label><input id="td" type="range" min="4" max="20" step="0.5" value="12"><span class="val" id="tdVal">12 °C</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="曲线" data-en="Chart">曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cloud-formation/" data-zh="云雨的完整生成课" data-en="the full cloud lesson">云雨的完整生成课</a>
    <a href="../atmospheric-circulation/" data-zh="30° 沙漠带的另一半原因" data-en="the other desert maker">30° 沙漠带的另一半原因</a>
    <a href="../el-nino/" data-zh="雨带还会搬家" data-en="rains also relocate">雨带还会搬家</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87a8c8, 16, 40);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x1c2836 : 0xa9c2d8);
  scene.fog.color = new THREE.Color(dark ? 0x1c2836 : 0xa9c2d8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('雨影效应 · 一座山两种命运', 'Rain Shadow · One Mountain, Two Fates');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setToggleBtns();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(-0.5, 3.6, 8.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x4a5540, 0.95));
const sun = new THREE.DirectionalLight(0xfff3de, 1.7);
sun.position.set(5, 9, 4);
scene.add(sun);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.02,
    emissive: color, emissiveIntensity: 0.04, transparent: true, ...opts });
}

/* ================= 模型参数 ================= */
const T0 = 24;                       // 山麓气温 °C
const G_DRY = 9.8, G_WET = 6.0;      // 干/湿绝热直减率 °C/km
const KM2U = 0.95;                   // km → 场景单位
let Hmt = clamp(qsFloat('hmt', 2.2), 0.4, 3);   // 山高 km
let Td = clamp(qsFloat('td', 12), 4, 20);       // 露点 °C
let windDir = qsBool('flip', false) ? -1 : 1;   // +1: 西风(左→右)
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let spinOn = qsBool('spin', true);
let parcelU = 0;                     // 气团路径参数 0..1(x -4 → +4)
const terrainH = xkm => Hmt * Math.exp(-xkm * xkm / 2.6);
/* 热力模型:返回路径各点 {T, h, cloud, rain} */
const lclKm = () => (T0 - Td) / G_DRY;
function profileAt(xkm) {                        // xkm: 风向坐标系(负=迎风)
  const h = terrainH(xkm);
  const lcl = lclKm();
  const wet = h > lcl;
  let T;
  if (!wet) T = T0 - G_DRY * h;
  else T = T0 - G_DRY * lcl - G_WET * (h - lcl);
  const rain = wet ? clamp((h - lcl) * 90, 0, 400) : 0;
  return { h, T, cloud: wet, rain };
}
const summit = () => ({ h: Hmt, ...profileAt(0) });
/* 过顶后的背风:所有凝结水已掉光,干绝热下沉 */
const leeFoot = () => {
  const s = summit();
  const lcl = lclKm();
  if (Hmt <= lcl) return T0;                     // 没到云底:对称往返
  return T0 + (G_DRY - G_WET) * (Hmt - lcl);     // 焚风
};
const rainWindward = () => Hmt <= lclKm() ? 0 : clamp((Hmt - lclKm()) * 90, 0, 400);

/* ================= 地形(顶点着色:迎风绿/背风沙) ================= */
const TER_W = 9.6, TER_D = 3.6;
const terGeo = new THREE.PlaneGeometry(TER_W, TER_D, 110, 42);
terGeo.rotateX(-Math.PI / 2);
const terCol = new Float32Array(terGeo.attributes.position.count * 3);
terGeo.setAttribute('color', new THREE.BufferAttribute(terCol, 3));
const terrain = new THREE.Mesh(terGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.9, metalness: 0, transparent: true, opacity: 1 }));
scene.add(terrain);
const C_SAND = [0.78, 0.66, 0.42], C_GREEN = [0.28, 0.45, 0.22], C_ROCK = [0.46, 0.44, 0.42];
function updateTerrain() {
  const pos = terGeo.attributes.position;
  const kmPerUnit = 3;
  const rain = rainWindward();
  for (let i = 0; i < pos.count; i++) {
    const wx = pos.getX(i), wz = pos.getZ(i);
    const xkm = wx * kmPerUnit;
    const h = terrainH(xkm);
    pos.setY(i, h * KM2U);
    /* 配色:迎风坡湿度→绿,背风→沙,高处岩石 */
    const windwardSide = (windDir > 0 ? xkm < 0.15 : xkm > -0.15);
    const moist = windwardSide ? clamp(0.25 + rain / 160, 0, 1) : clamp(0.22 - rain / 400, 0.02, 0.3);
    let c = [
      lerp(C_SAND[0], C_GREEN[0], moist),
      lerp(C_SAND[1], C_GREEN[1], moist),
      lerp(C_SAND[2], C_GREEN[2], moist),
    ];
    const rockF = clamp((h - Hmt * 0.55) / Math.max(Hmt, 0.1), 0, 1) * 0.85;
    c = [lerp(c[0], C_ROCK[0], rockF), lerp(c[1], C_ROCK[1], rockF), lerp(c[2], C_ROCK[2], rockF)];
    terCol[i * 3] = c[0]; terCol[i * 3 + 1] = c[1]; terCol[i * 3 + 2] = c[2];
  }
  pos.needsUpdate = true;
  terGeo.attributes.color.needsUpdate = true;
  terGeo.computeVertexNormals();
}

/* ================= 云、雨、气团、植被 ================= */
const cloudG = new THREE.Group();
scene.add(cloudG);
const cloudMats = [];
for (let i = 0; i < 7; i++) {
  const m = new THREE.MeshStandardMaterial({ color: 0xf2f5f8, roughness: 1, transparent: true, opacity: 0 });
  cloudMats.push(m);
  const puff = new THREE.Mesh(new THREE.SphereGeometry(0.34 + (i % 3) * 0.1, 10, 8), m);
  puff.position.set((i - 3) * 0.32, 0, (i % 2) * 0.18 - 0.09);
  puff.scale.y = 0.62;
  cloudG.add(puff);
}
/* 雨丝 */
const RAIN_N = 70;
const rainIM = new THREE.InstancedMesh(new THREE.BoxGeometry(0.012, 0.16, 0.012),
  new THREE.MeshBasicMaterial({ color: 0x9fc4e8, transparent: true, opacity: 0 }), RAIN_N);
rainIM.frustumCulled = false;
scene.add(rainIM);
const rains = Array.from({ length: RAIN_N }, () => ({ x: 0, z: (Math.random() - 0.5) * 1.2, y: Math.random() }));
/* 气团 */
const parcelG = new THREE.Group();
scene.add(parcelG);
const parcelCore = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 12),
  new THREE.MeshStandardMaterial({ color: 0x74c0fc, emissive: 0x1864ab, emissiveIntensity: 0.7, transparent: true, opacity: 0.95 }));
parcelG.add(parcelCore);
const parcelPuffs = [];
for (let i = 1; i <= 8; i++) {
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.09 - i * 0.006, 8, 7),
    new THREE.MeshBasicMaterial({ color: 0xbde9ff, transparent: true, opacity: 0 }));
  scene.add(p);
  parcelPuffs.push(p);
}
/* 植被:迎风树/背风仙人掌(随风向换边) */
const vegG = new THREE.Group();
scene.add(vegG);
function buildVeg() {
  vegG.clear();
  const lcl = lclKm();
  const rainy = Hmt > lcl;
  for (let i = 0; i < 16; i++) {
    const side = i % 2 ? 1 : -1;
    const xkm = side * (0.5 + (i * 0.53) % 3.4);
    const wxkm = windDir * xkm;                 // 风向坐标
    const windward = wxkm < 0;
    const h = terrainH(wxkm);
    const x = windDir * wxkm / 3;               // 世界坐标(km→unit)
    if (windward && rainy) {                    // 树
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 0.14, 6), mat(0x5a4636, { opacity: 1 }));
      trunk.position.set(x, h * KM2U + 0.07, Math.sin(i * 2.4) * 1.1);
      const crown = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.24, 8), mat(0x2f5a2a, { opacity: 1 }));
      crown.position.set(x, h * KM2U + 0.24, Math.sin(i * 2.4) * 1.1);
      vegG.add(trunk, crown);
    } else if (!windward) {                     // 仙人掌
      const cac = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, 0.2, 8), mat(0x5f7a3a, { opacity: 1 }));
      cac.position.set(x, h * KM2U + 0.1, Math.sin(i * 1.7) * 1.1);
      vegG.add(cac);
    }
  }
}

/* ---------------- 场景标签 ---------------- */
const labelReg = [];
let labelsOn = true;
function addLabel(textFn, pos, cls = '', vis = () => true) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  labelReg.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return o;
}
function refreshLabels() {
  for (const r of labelReg) r.o.visible = labelsOn && r.vis();
}
addLabel(() => L('迎风坡:雨林(雨全下在这)', 'windward: rainforest (all the rain)'), new THREE.Vector3(windDir * -1.9, 0.75, 1.35), 'g');
addLabel(() => L(`背风:雨影沙漠,焚风 ${leeFoot().toFixed(1)} °C`, `leeward: rain shadow, foehn ${leeFoot().toFixed(1)} °C`),
  new THREE.Vector3(windDir * 1.9, 0.75, 1.35), 'o');
const lblCloud = addLabel(() => Hmt > lclKm() ? L(`云底 = 露点高度 ${(lclKm()).toFixed(2)} km`, `cloud base = LCL ${lclKm().toFixed(2)} km`) : L('山不够高:气团没到云底', 'mountain too low: LCL not reached'),
  new THREE.Vector3(windDir * -0.9, clamp(lclKm() * KM2U + 0.75, 0.9, 3.4), 0), 'b', () => Hmt > lclKm() * 0.98 || true);
const lblWind = addLabel(() => L('湿气流 →', 'moist flow →'), new THREE.Vector3(windDir * -4.2, 1.15, -0.8), 'b');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '出发:一团暖湿空气', be: 'Departure: warm moist air',
    d: '海洋上的气团 24 °C、露点 12 °C 撞上山脉——它别无选择,只能往上爬。拖「露点」看湿度如何决定后面的一切。',
    de: 'A 24 °C parcel with 12 °C dew point meets the mountain and has nowhere to go but up. Drag the dew point to see how moisture decides everything.',
    act: () => { Td = 12; Hmt = 2.2; syncSliders(); refreshAll(); } },
  { b: '爬升:干绝热 9.8 °C/km', be: 'Climb: dry adiabatic 9.8 °C/km',
    d: '气压越来越低,气团膨胀做功、自己变冷——每升 1 km 掉 9.8 °C,没有热量流失,冷的代价是「膨胀」。',
    de: 'Lower pressure lets the parcel expand and do work on its way up — it cools 9.8 °C per km without losing any heat; expansion is the price.',

  { b: '摸到露点:云底出现', be: 'Hit the dew point: a cloud base',

    act: () => { Td = 14; Hmt = 2.6; syncSliders(); refreshAll(); } },
  { b: '迎风坡把雨下完', be: 'The windward side spends the rain',
    d: '爬升越高、凝出的水越多,八成化作迎风坡的雨——水被山「扣下」了。迎风是雨林:年雨量是背风的十倍。',
    de: 'The higher it climbs the more condenses, and ~80% falls right there on the windward slope — the mountain keeps the water. Rainforest on one side, ten times the rainfall.',
    act: () => { Td = 12; Hmt = 3.0; syncSliders(); refreshAll(); } },
  { b: '过顶下沉:焚风', be: 'Over the top: the foehn',
    d: '背风侧空气已经干透,下沉压缩回暖 9.8 °C/km——比迎风爬升时少蒸发了潜热,落地时反而比出发更热:焚风。瑞士的「吃雪风」就是它。',
    de: 'Leeward the air is bone dry and warms 9.8 °C/km by compression — with no latent heat to repay it lands HOTTER than it started: the foehn, the Alps\' snow-eater.',
    act: () => { Td = 12; Hmt = 2.8; syncSliders(); refreshAll(); } },
  { b: '雨影:背风沙漠', be: 'The shadow: a leeward desert',
    d: '落到背风麓的空气又热又干,相对湿度被升温一脚踩低——雨影沙漠铺开。点「风向翻转」看雨影瞬间换边;真实世界:喜马拉雅、内华达、安第斯。',
    de: 'The hotter air is relatively drier the moment it lands — a rain-shadow desert. Flip the wind to move the shadow instantly; Himalaya, Nevada and the Andes all run this.',
    act: () => { windDir *= -1; refreshAll(); setToggleBtns(); } },
];
function stepIndex() {
  if (parcelU > 0.62) return 5;
  if (parcelU > 0.5) return 4;
  if (rainWindward() > 100) return 3;
  if (Hmt > lclKm()) return 2;
  if (parcelU > 0.05) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 20, padB = 20;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const xOf = T => pad + (W - 2 * pad) * clamp(T, -4, 40) / 40;
  const yOf = h => pad + (H - pad - padB) * (1 - clamp(h, 0, 3.4) / 3.4);
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - padB); ctx.lineTo(W - pad, H - padB); ctx.stroke();
  /* 露点竖线 */
  ctx.strokeStyle = 'rgba(255,107,107,.7)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(xOf(Td), yOf(0)); ctx.lineTo(xOf(Td), yOf(3.4)); ctx.stroke();
  ctx.setLineDash([]);
  /* 干绝热线(从山麓) */
  ctx.strokeStyle = '#ffa94d'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(xOf(T0), yOf(0)); ctx.lineTo(xOf(T0 - G_DRY * 3.4), yOf(3.4)); ctx.stroke();
  /* 实际路径:爬升 + 下沉 */
  const lcl = lclKm();
  ctx.strokeStyle = '#74c0fc'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(xOf(T0), yOf(0));
  if (Hmt > lcl) {
    ctx.lineTo(xOf(Td), yOf(lcl));
    ctx.lineTo(xOf(T0 - G_DRY * lcl - G_WET * (Hmt - lcl)), yOf(Hmt));
    ctx.setLineDash([7, 5]);
    ctx.strokeStyle = 'rgba(255,169,77,.9)';
    ctx.lineTo(xOf(leeFoot()), yOf(0));
    ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.lineTo(xOf(T0 - G_DRY * Hmt), yOf(Hmt));
    ctx.lineTo(xOf(T0), yOf(0));
    ctx.stroke();
  }
  /* 气团当前位置 */
  const xkm = lerp(-4, 4, parcelU) * windDir;
  const p = profileAt(xkm);
  ctx.fillStyle = '#69db7c';
  ctx.beginPath(); ctx.arc(xOf(p.T), yOf(p.h), 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '13px system-ui';
  ctx.fillText('T °C →', W - pad - 46, H - 4);
  ctx.fillText('h(km)', pad + 2, pad + 12);
  ctx.fillText(`${Td}°`, xOf(Td) - 10, pad + 26);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elH = document.getElementById('hmt'), elHVal = document.getElementById('hmtVal');
const elTd = document.getElementById('td'), elTdVal = document.getElementById('tdVal');
const stL = document.getElementById('stL'), stT = document.getElementById('stT'), stR = document.getElementById('stR'),
  stF = document.getElementById('stF'), stP = document.getElementById('stP');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setToggleBtns() {
  document.getElementById('btnFlip').classList.toggle('on', windDir < 0);
}
function syncSliders() {
  elH.value = Hmt; elHVal.textContent = Hmt.toFixed(1) + ' km';
  elTd.value = Td; elTdVal.textContent = Td.toFixed(1) + ' °C';
}
function syncAll() { syncSliders(); drawPlot(); }
function refreshAll() {          // 参数变化 → 地形颜色/云/植被重建
  updateTerrain();
  buildVeg();
  updateCloud();
  syncAll();
}
function updateFormula() {
  const s = summit();
  formulaEl.innerHTML = L(
    `LCL = (T−T露点)/9.8 = <b>${lclKm().toFixed(2)} km</b> · 山顶 ${s.T.toFixed(1)} °C<br>` +
    `焚风:ΔT = (9.8−6.0)×(山高−LCL) = <b>+${Math.max(0, leeFoot() - T0).toFixed(1)} °C</b> → 背风麓 ${leeFoot().toFixed(1)} °C`,
    `LCL = (T−Td)/9.8 = <b>${lclKm().toFixed(2)} km</b> · summit ${s.T.toFixed(1)} °C<br>` +
    `foehn: ΔT = (9.8−6.0)×(H−LCL) = <b>+${Math.max(0, leeFoot() - T0).toFixed(1)} °C</b> → lee foot ${leeFoot().toFixed(1)} °C`);
}
function updateCloud() {
  const rainy = Hmt > lclKm();
  const lcl = lclKm();
  const cx = windDir * -1.15;                  // 云在迎风坡上空
  const cy = rainy ? lcl * KM2U + 0.28 : Math.min(Hmt * KM2U + 0.25, 1.4);
  cloudG.position.set(cx, cy, 0);
  const op = rainy ? clamp(0.55 + rainWindward() / 300, 0, 0.97) : 0.25;
  cloudMats.forEach(m => m.opacity = lerp(m.opacity, rainy ? op : 0.18, 0.2));
  /* 雨丝参数 */
  rainIM.material.opacity = rainy ? clamp(rainWindward() / 260, 0.1, 0.85) : 0;
  return { cx, cy, rainy };
}
document.getElementById('btnFlip').addEventListener('click', () => { windDir *= -1; refreshAll(); setToggleBtns(); });
document.getElementById('btnHimalaya').addEventListener('click', () => { Hmt = 3; Td = 10; syncSliders(); refreshAll(); });
elH.addEventListener('input', () => { Hmt = +elH.value; refreshAll(); });
elTd.addEventListener('input', () => { Td = +elTd.value; refreshAll(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = spinOn;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 气团运动与雨 ================= */
const dummy = new THREE.Object3D();
function updateParcel(dt) {
  parcelU += dt * 0.045;
  if (parcelU > 1) parcelU -= 1;
  const xkm = lerp(-4.4, 4.4, parcelU) * windDir;
  const p = profileAt(xkm);
  const wx = xkm / 3;                          // km→unit(风向坐标→世界)
  const baseY = p.h * KM2U;
  parcelG.position.set(wx, baseY + 0.16, 0);
  parcelCore.material.color.setHex(p.cloud ? 0xf2f5f8 : 0x74c0fc);
  parcelCore.material.emissive.setHex(p.cloud ? 0x888888 : 0x1864ab);
  /* 拖尾 */
  for (let i = 0; i < parcelPuffs.length; i++) {
    const back = clamp(xkm - windDir * (i + 1) * 0.28, -4.4, 4.4);
    const pp = profileAt(back);
    parcelPuffs[i].position.set(back / 3, pp.h * KM2U + 0.16, 0);
    parcelPuffs[i].material.opacity = clamp(0.5 - i * 0.055, 0, 0.5);
    parcelPuffs[i].material.color.setHex(pp.cloud ? 0xf2f5f8 : 0x9fc4e8);
  }
  /* 雨丝 */
  if (rainIM.material.opacity > 0.02) {
    const cinfo = updateCloud();
    for (let i = 0; i < RAIN_N; i++) {
      const r = rains[i];
      r.y -= dt * (1.2 + (i % 5) * 0.2);
      if (r.y < 0) { r.y = 1; r.x = (Math.random() - 0.5) * 1.5; }
      const groundY = terrainH((cinfo.cx + r.x) * 3 * windDir) * KM2U;
      dummy.position.set(cinfo.cx + r.x, groundY + r.y * (cinfo.cy - groundY), r.z);
      dummy.scale.set(1, 1 + (i % 3), 1);
      dummy.updateMatrix();
      rainIM.setMatrixAt(i, dummy.matrix);
    }
    rainIM.instanceMatrix.needsUpdate = true;
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05) * (playing ? speed : 0);
  updateParcel(dt);
  statsAcc += dt;
  if (statsAcc > 0.2) {
    statsAcc = 0;
    const rainy = Hmt > lclKm();
    stL.textContent = rainy ? lclKm().toFixed(2) + ' km' : L('未到云底', 'below LCL');
    stL.className = 'v ' + (rainy ? '' : 'warn');
    stT.textContent = summit().T.toFixed(1) + ' °C';
    stR.textContent = rainWindward().toFixed(0) + ' mm';
    const lf = leeFoot();
    stF.textContent = lf.toFixed(1) + ' °C' + (lf > T0 + 0.3 ? L(' 焚风', ' foehn') : '');
    stF.className = 'v ' + (lf > T0 + 0.3 ? 'bad' : 'ok');
    stP.textContent = !rainy ? L('干爬升', 'dry climb') : parcelU * windDir < 0 ? L('凝结爬升', 'wet climb') : L('背风下沉', 'lee descent');
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on;
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
Hmt = clamp(qsFloat('hmt', 2.2), 0.4, 3);
Td = clamp(qsFloat('td', 12), 4, 20);
windDir = qsBool('flip', false) ? -1 : 1;
syncSliders();
setToggleBtns();
applyTheme();
applyLang();
refreshAll();
setPlayLabel();
start();
</script>
