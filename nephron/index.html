<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肾单位 · 逆流倍增造浓度梯度</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(99,230,190,.9); color: #c3f5e5; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #63e6be; }
  #stats .v.b { color: #74c0fc; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.f { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.w { color: #a5d8ff; border-color: rgba(116,192,252,.7); }
  .chip.s { color: #ffccb8; border-color: rgba(255,169,120,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(99,230,190,.2); border-color: rgba(99,230,190,.6); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="肾单位:用一根 U 形管把尿「浓缩」" data-en="The Nephron: concentrating urine with one U-shaped tube">肾单位:用一根 U 形管把尿「浓缩」</h1>
  <div class="sub" data-zh="髓袢降支出水、升支泵盐——逆流倍增把髓质梯度从 300 抬到 1200 mOsm;集合管借梯度决定尿有多浓 · 空格播放/暂停" data-en="The descending limb loses water, the ascending limb pumps salt — countercurrent multiplication builds the medulla from 300 to 1200 mOsm; the collecting duct decides how concentrated your urine gets · Space = play/pause">髓袢降支出水、升支泵盐——逆流倍增把髓质梯度从 300 抬到 1200 mOsm;集合管借梯度决定尿有多浓 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="髓质顶端梯度" data-en="medulla tip gradient">髓质顶端梯度</span><span class="v g" id="stGrad">300<small> mOsm</small></span>
  <span class="k" data-zh="尿液渗透压" data-en="urine osmolarity">尿液渗透压</span><span class="v b" id="stUrine">—</span>
  <span class="k" data-zh="水回收率" data-en="water reclaimed">水回收率</span><span class="v" id="stRec">—</span>
  <span class="k" data-zh="ADH(抗利尿)" data-en="ADH (vasopressin)">ADH(抗利尿)</span><span class="v" id="stADH" style="font-size:14px">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.f" data-zh="滤液(黄球,越深越浓)" data-en="filtrate (yellow, deeper = saltier)">滤液(黄球,越深越浓)</span>
    <span class="chip.w" data-zh="渗出的水(蓝)" data-en="water leaving (blue)">渗出的水(蓝)</span>
    <span class="chip.s" data-zh="主动泵出的 Na⁺(橙)" data-en="pumped Na⁺ (orange)">主动泵出的 Na⁺(橙)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnADH" data-zh="ADH:关(喝水模式)" data-en="ADH: OFF (hydrated)">ADH:关(喝水模式)</button>
  </div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../osmosis/" data-zh="物理版:渗透与反渗透" data-en="the physics version: osmosis">物理版:渗透与反渗透</a>
    <a href="../dialysis/" data-zh="临床版:血液透析" data-en="the clinic version: dialysis">临床版:血液透析</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  medSlab.material.opacity = THEME === 'dark' ? 0.28 : 0.4;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('肾单位与逆流倍增', 'The Nephron');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.4, 2.2, 7.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.2,
    emissive: color, emissiveIntensity: 0.1, transparent: true, ...opts });
}
const M = {
  tube: mat(0x9aa7b8, { opacity: 0.85 }),
  glom: mat(0xff8787, { emissiveIntensity: 0.3 }),
  filtrate: null,
  water: new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.75 }),
  salt: new THREE.MeshBasicMaterial({ color: 0xffa94d, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.85 }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.6, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.5;
scene.add(base);
/* 髓质梯度板(颜色随 ADH/泵活动变化) */
const medSlab = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.6, 0.35),
  new THREE.MeshBasicMaterial({ color: 0x5c3d2e, transparent: true, opacity: 0.28 }));
medSlab.position.set(1.3, 1.4, -0.9);
scene.add(medSlab);

/* ================= 肾单位管路 ================= */
/* 布局(x, y):肾小球(-2.6, 3.2)→ 近曲管 → 髓袢降支直下(-1.2,0.2) → U弯 → 升支直上(0,3.0)
   → 远曲管 → 集合管竖直向下(2.2, 0.2) */
function pipeThrough(pts, r = 0.09) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], -0.9)));
  const g = new THREE.Group();
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 96, r, 10, false), M.tube);
  g.add(tube);
  scene.add(g);
  return { curve, tube };
}
const glomPos = new THREE.Vector3(-2.6, 3.3, -0.9);
/* 肾小球:一团小球 */
for (let i = 0; i < 26; i++) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.055 + Math.random() * 0.03, 8, 6), M.glom);
  b.position.copy(glomPos).add(new THREE.Vector3((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.25));
  scene.add(b);
}
const bowman = new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 16),
  mat(0xbfd8e8, { opacity: 0.18, roughness: 0.2 }));
bowman.position.copy(glomPos);
scene.add(bowman);
/* 主管路 */
const mainPipe = pipeThrough([
  [-2.6, 3.3], [-2.2, 3.0], [-1.6, 2.6], [-1.2, 2.0],      // 近曲小管迂回
  [-1.2, 1.2], [-1.2, 0.3],                                 // 降支直下(细)
]);
const loopPipe = pipeThrough([[-1.2, 0.3], [-0.7, 0.12], [-0.2, 0.3]]);      // U 弯
const ascPipe = pipeThrough([[-0.2, 0.3], [-0.2, 1.2], [-0.2, 2.2], [-0.2, 3.1]]);  // 升支直上(粗)
const distPipe = pipeThrough([[-0.2, 3.1], [0.6, 3.3], [1.6, 3.2]]);        // 远曲小管
const collPipe = pipeThrough([[2.2, 3.2], [2.2, 2.2], [2.2, 1.2], [2.2, 0.25]], 0.12);  // 集合管
/* 膀胱杯 */
const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.34, 0.6, 20, 1, true),
  mat(0xbfd8e8, { opacity: 0.2 }));
cup.position.set(2.2, -0.15, -0.9);
scene.add(cup);

/* 梯度色带(髓质,与深度的渗透压对应) */
const gradBars = [];
for (let i = 0; i < 6; i++) {
  const y = 0.4 + i * 0.6;
  const bar = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.56, 0.02),
    new THREE.MeshBasicMaterial({ color: 0x5c3d2e, transparent: true, opacity: 0.5 }));
  bar.position.set(1.0, y, -1.09);
  scene.add(bar);
  gradBars.push(bar);
}
function osmAt(y) {
  /* 皮质 300 → 髓质底 1200 */
  const f = clamp((3.2 - y) / 3.0, 0, 1);
  return Math.round(300 + f * 900);
}

/* ================= 状态(标签之前) ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let adh = false;
let tSim = 0;
let tipGrad = 300;         // 顶端梯度(泵活动累积)
let spawnCD = 0;
let reclaimed = 0, passed = 0;
const NMOLES = 15;

/* 滤液小球 */
const nmoles = [];   // {mesh, t, path, osm, alive}
const filtMat = () => new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffd166, emissiveIntensity: 0.15, roughness: 0.4 });
function spawnNmol() {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 8), filtMat());
  mesh.position.set(-2.6, 3.3, -0.9);
  scene.add(mesh);
  nmoles.push({ mesh, t: 0, osm: 300, alive: true });
}

/* 管路采样:按 t 求位置(分段手动构建曲线表) */
const PATH = [];   // 完整路径点(含弧长参数)
{
  const pts = [];
  for (const c of [mainPipe.curve, loopPipe.curve, ascPipe.curve, distPipe.curve]) {
    for (let i = 0; i < 24; i++) pts.push(c.getPoint(i / 24));
  }
  /* 集合管:远曲管末端(1.6,3.2) → 跳到集合管顶(2.2,3.2) 简化直连 */
  for (let i = 1; i <= 12; i++) {
    pts.push(new THREE.Vector3(lerp(1.6, 2.2, i / 12), 3.2, -0.9));
  }
  for (const p of collPipe.curve.getPoints(20)) pts.push(p);
  PATH.push(...pts);
}
function pathPoint(t) {
  const n = PATH.length - 1;
  const f = clamp(t, 0, 1) * n;
  const i = Math.floor(f);
  return PATH[i].clone().lerp(PATH[Math.min(n, i + 1)], f - i);
}

/* ================= 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblGlom = addLabel(() => L('肾小球:高压滤过——每分钟 125 mL 血浆滤成原尿(全肾 180 L/天!)', 
  'glomerulus: pressure filtration — 125 mL/min of plasma filtered (180 L/day across all nephrons!)'),
  new THREE.Vector3(-2.6, 3.95, -0.9), 'b');
const lblLoop = addLabel(() => L('髓袢 U 形管:降支免费渗出水,升支主动泵盐——两支反向流动互相加压,梯度越搅越浓(逆流倍增)', 
  'loop of Henle: descending limb leaks water free, ascending limb pumps salt actively — the two counterflows multiply the gradient'),
  new THREE.Vector3(-0.7, -0.35, -0.9), 'st');
const lblColl = addLabel(() => adh
  ? L('集合管:ADH 已开槽!水顺梯度整段渗出——尿被浓缩,身体保水', 
      'collecting duct: ADH has opened the slots! Water drains along the gradient — urine concentrated, body keeps water')
  : L('集合管:没有 ADH,水槽关闭——稀释尿直接流走(刚喝完一大杯水?)', 
      'collecting duct: no ADH, water slots shut — dilute urine flows on (just drank a big glass of water?)'),
  new THREE.Vector3(2.9, 1.7, -0.9), adh ? 'g' : 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '滤过:高压筛', be: 'Filtration: a pressure sieve',
    d: '肾小球毛细血管血压把水和小分子压进鲍曼囊——细胞与大蛋白留下。原尿成分≈血浆,只是没了蛋白。',
    de: 'Capillary pressure squeezes water and small molecules into Bowman\'s capsule — cells and big proteins stay. Filtrate ≈ plasma minus protein.',
    act: () => {} },
  { b: '近曲管:大扫荡重吸收', be: 'PCT: the bulk reclaim',
    d: '65-70% 的 Na⁺、水、葡萄糖在这里被主动+被动收回来——顺带把滤液「打回」等渗。',
    de: '65–70% of Na⁺, water and glucose are reclaimed here — the filtrate returns to isotonic.',
    act: () => {} },
  { b: '逆流倍增:梯度发动机', be: 'Countercurrent multiplication: the gradient engine',
    d: '升支把 NaCl 泵进髓质(不吃水),降支对它全透只渗水:两支反向流让盐浓度沿深度翻倍再加倍——300 → 1200 mOsm。',
    de: 'The ascending limb pumps NaCl out (water-impermeable) while the descending limb leaks water freely: counterflow doubles the salt again and again — 300 → 1200 mOsm.',
    act: () => {} },
  { b: 'ADH:决定尿多浓', be: 'ADH: how concentrated the urine gets',
    d: '脑垂体释放 ADH → 集合管插入水通道蛋白 → 水顺着髓质梯度整段吸走,尿可以浓到 1200 mOsm;没 ADH 就排出稀释尿(喝多了)。',
    de: 'Pituitary ADH inserts aquaporins into the collecting duct: water drains along the medullary gradient, urine up to 1200 mOsm; without ADH you pee dilute.',
    act: () => document.getElementById('btnADH').click() },
  { b: '水的账本', be: 'The water ledger',
    d: '180 L 原尿/天 → 终尿 1.5 L/天:回收率 99%+。逆流倍增这根 U 形管,就是身体省水的核心工程。',
    de: '180 L of filtrate/day → 1.5 L of urine: >99% reclaimed. That U-shaped tube is the body\'s master water-saving engineering.',
    act: () => {} },
];
function stepIndex() {
  if (adh) return 3;
  return 2;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const btnADH = document.getElementById('btnADH');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setADH(v) {
  adh = v;
  btnADH.classList.toggle('on', adh);
  btnADH.textContent = adh ? L('ADH:开(脱水,浓缩尿)', 'ADH: ON (dehydrated, concentrate)') : L('ADH:关(喝水模式)', 'ADH: OFF (hydrated)');
}
btnADH.addEventListener('click', () => setADH(!adh));
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 粒子行为 ================= */
const waters = [];   // {mesh, v}
function spawnWater(pos) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), M.water);
  m.position.copy(pos);
  scene.add(m);
  waters.push({ mesh: m, v: new THREE.Vector3((Math.random() - 0.5) * 0.3, -0.4 - Math.random() * 0.3, (Math.random() - 0.5) * 0.3) });
}
function spawnSalt(pos) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), M.salt);
  m.position.copy(pos);
  scene.add(m);
  waters.push({ mesh: m, v: new THREE.Vector3((Math.random() - 0.5) * 0.4, 0.3 + Math.random() * 0.4, (Math.random() - 0.5) * 0.4), salt: true });
}
function particleTick(dt) {
  spawnCD -= dt;
  if (spawnCD <= 0 && nmoles.length < NMOLES) {
    spawnCD = 0.55;
    spawnNmol();
  }
  for (let i = nmoles.length - 1; i >= 0; i--) {
    const n = nmoles[i];
    if (!n.alive) continue;
    n.t += dt * 0.045;
    const p = pathPoint(n.t);
    const y = p.y;
    /* 浓度:随深度加深(颜色变深) */
    n.osm = osmAt(y);
    n.mesh.material.color.setHSL(0.12, 0.9, 0.75 - clamp((n.osm - 300) / 900, 0, 1) * 0.45);
    n.mesh.position.copy(p);
    /* 事件:降支渗水 */
    if (y > 0.4 && y < 3.0 && p.x < -0.9 && Math.random() < dt * 2.2) {
      spawnWater(p);
      reclaimed++;
    }
    /* 升支泵盐 */
    if (Math.abs(p.x + 0.2) < 0.05 && y > 0.5 && y < 3.0 && Math.random() < dt * 2.6) {
      spawnSalt(p);
      tipGrad = Math.min(1200, tipGrad + 4);
    }
    /* 集合管:ADH 渗水 */
    if (p.x > 1.8 && adh && y < 3.0 && Math.random() < dt * 2.6) {
      spawnWater(p);
      reclaimed++;
    }
    /* 出口 */
    if (n.t >= 1) {
      n.alive = false;
      scene.remove(n.mesh);
      nmoles.splice(i, 1);
      passed++;
    }
  }
  for (let i = waters.length - 1; i >= 0; i--) {
    const w = waters[i];
    w.mesh.position.addScaledVector(w.v, dt);
    w.mesh.material.opacity = Math.max(0, 1 - Math.abs(w.mesh.position.y - 1.5) / 2.2);
    if (w.mesh.position.y < -0.4 || w.mesh.position.y > 3.6 || Math.abs(w.mesh.position.x) > 3.4) {
      scene.remove(w.mesh);
      waters.splice(i, 1);
    }
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  particleTick(dts);
  /* 泵活动自然衰减 */
  tipGrad = Math.max(300, tipGrad - dts * 14);
  /* 梯度色带:深=高渗 */
  gradBars.forEach((b, i) => {
    const f = i / (gradBars.length - 1);
    const osm = lerp(300, tipGrad, f);
    const k = clamp((osm - 300) / 900, 0, 1);
    b.material.color.setHSL(lerp(0.55, 0.03, k), 0.65, 0.55 - k * 0.12);
    b.material.opacity = 0.3 + k * 0.4;
  });

  const urine = Math.round(adh ? Math.min(tipGrad, 1200) : 300 + (tipGrad - 300) * 0.12);
  document.getElementById('stGrad').innerHTML = tipGrad.toFixed(0) + '<small> mOsm</small>';
  document.getElementById('stUrine').innerHTML = urine + '<small> mOsm</small>';
  const rec = reclaimed + passed > 0 ? (reclaimed / (reclaimed + passed) * 100) : 0;
  document.getElementById('stRec').innerHTML = rec.toFixed(0) + '<small>%(演示)</small>';
  document.getElementById('stADH').textContent = adh ? L('开', 'ON') : L('关', 'OFF');
  document.getElementById('stADH').style.color = adh ? '#63e6be' : '#9fb0c3';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setADH(adh);
setPlayLabel();
requestAnimationFrame(frame);
</script>
