<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蒙提霍尔 · 换还是不换:2/3 的直觉粉碎机</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e0a13f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 420px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 12px 18px;
    backdrop-filter: blur(6px); width: 300px; }
  #stats .row2 { margin-bottom: 8px; }
  #stats .lab { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text2); }
  #stats .lab b { color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .track { height: 10px; border-radius: 999px; background: var(--hover); overflow: hidden; margin-top: 3px; }
  #stats .fill { height: 100%; border-radius: 999px; }
  #fillSw { background: #43d17c; }
  #fillSt { background: #4cc9f0; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h  { color: #ffc188; border-color: rgba(255,159,67,.7); }
  .chip.b  { color: #bde9ff; border-color: rgba(76,201,240,.7); }
  :root[data-theme="light"] .chip.h  { color: #b26214; border-color: rgba(178,98,20,.7); }
  :root[data-theme="light"] .chip.b  { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: default;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(224,161,63,.12); border-color: rgba(224,161,63,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.10); border-color: rgba(176,118,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #reset { grid-column: 2; padding: 7px 10px; font-size: 12px; font-weight: 600;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; cursor: pointer; }
  #reset:hover { border-color: var(--acc); color: var(--acc); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="蒙提霍尔：换还是不换？——主持人「知道答案」这件事改写了概率" data-en="Monty Hall: switch or stay? — the host KNOWS, and that rewires the odds">蒙提霍尔：换还是不换？——主持人「知道答案」这件事改写了概率</h1>
  <div class="sub" data-zh="你选门后,主持人专开一扇「有山羊的」门——他的选择带着信息:换,胜率 2/3;不换,1/3 · 空格播放/暂停" data-en="After you pick, the host — who knows — opens only a goat door. His choice carries information: switching wins 2/3, staying 1/3 · Space = play/pause">你选门后,主持人专开一扇「有山羊的」门——他的选择带着信息:换,胜率 2/3;不换,1/3 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <div class="row2">
    <div class="lab"><span data-zh="始终换 · 胜率" data-en="always switch · win">始终换 · 胜率</span><b id="swPct">—</b></div>
    <div class="track"><div class="fill" id="fillSw" style="width:0%"></div></div>
    <div class="lab" style="margin-top:3px"><span>n = 0 局</span></div>
  </div>
  <div class="row2">
    <div class="lab"><span data-zh="始终不换 · 胜率" data-en="always stay · win">始终不换 · 胜率</span><b id="stPct">—</b></div>
    <div class="track"><div class="fill" id="fillSt" style="width:0%"></div></div>
    <div class="lab" style="margin-top:3px"><span data-zh="参考线:2/3 与 1/3" data-en="reference: 2/3 & 1/3">参考线:2/3 与 1/3</span></div>
  </div>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip h" data-zh="主持人专开羊门(他知道)" data-en="host opens a goat door (he knows)">主持人专开羊门(他知道)</span>
    <span class="chip b" data-zh="演示局:始终选门 1" data-en="demo: always pick door 1">演示局:始终选门 1</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="4" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <button id="reset" data-zh="清零重跑" data-en="Reset">清零重跑</button>
    <div class="row"><label data-zh="批量" data-en="Batch">批量</label><input id="batch" type="range" min="1" max="50" step="1" value="1"><span class="val" id="batchVal">×1</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('蒙提霍尔 · 换还是不换', 'Monty Hall · Switch or Stay');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

/* ================= 演示局状态机 ================= */
const DOOR_X = [430, 780, 1130], DOOR_Y = 300, DW = 280, DH = 380;
let tR = 0;                 // 演示局内相位(0..1)
let showLabels = true;
let round = 0;              // 已完成演示局数
let carPos = 0;             // 本局车门(0..2)
let picked = 0;             // 演示局固定选门 1
let hostOpen = 1;           // 主持人开的门
let swWin = 0, swN = 0, stWin = 0, stN = 0;   // 两种策略的胜场
let lastB = -1;
const RLEN = 1.0;           // 一局时长(秒)

function newRoundData() {
  carPos = Math.floor(Math.random() * 3);
  const others = [0, 1, 2].filter(d => d !== picked && d !== carPos);
  hostOpen = others.length === 1 ? others[0] : others[Math.floor(Math.random() * 2)];
}
function finishRound() {
  swN++; stN++;
  const switchedTo = [0, 1, 2].find(d => d !== picked && d !== hostOpen);
  if (switchedTo === carPos) swWin++;
  if (picked === carPos) stWin++;
}

/* ================= 讲解(按批量局数点亮) ================= */
const STEPS = [
  { at: 0, b: '直觉:三个门各 1/3', d: '车随机放在一扇门后,你选门 1——此刻它确实只有 1/3 的概率。到这一步,直觉没错。',
    be: 'Intuition: one third each', de: 'The car sits randomly behind one door; picking door 1 gives it exactly a 1/3 chance. So far, intuition is right.' },
  { at: 12, b: '主持人「知道答案」', d: '他从不开你选的门,也从不开车门——他专开羊门。这个「专开」把他的选择变成了信息。',
    be: 'The host KNOWS', de: 'He never opens your door and never the car — he always finds a goat. That deliberate choice turns his action into information.' },
  { at: 60, b: '换 = 把 2/3 拿回来', d: '车在你门后的概率仍是 1/3;于是在「另一扇未开的门」后面的概率 = 1 − 1/3 = 2/3。换,就是把两扇门的份额合起来。',
    be: 'Switching claims 2/3', de: 'The car is behind your door 1/3 of the time — so it is behind the other closed door 2/3. Switching merges both shares.' },
  { at: 300, b: '大数定律:数字站出来说话', d: '几百局之后,两条胜率线死死贴住 2/3 与 1/3——再嘴硬的直觉,也拗不过样本。',
    be: 'The numbers testify', de: 'After a few hundred rounds the win rates hug 2/3 and 1/3. Sample size settles every argument.' },
];
function stepIndex() {
  let si = 0;
  const total = swN;
  STEPS.forEach((s, i) => { if (total >= s.at) si = i; });
  return si;
}

/* ================= 绘制 ================= */
function drawDoors(t) {
  const stage = Math.floor(tR * 4);       // 0 选择,1 主持人开,2 揭晓,3 停顿
  const sub = tR * 4 - stage;
  const labelTxt = [L('你选门 1', 'you pick door 1'), L('主持人开一扇羊门', 'host opens a goat door'),
    L('揭晓(换/不换各记一局)', 'reveal (log switch & stay)'), ''][stage] || '';
  for (let d = 0; d < 3; d++) {
    const x = DOOR_X[d], open = (stage >= 1 && d === hostOpen) || stage >= 2;
    // 门框
    rrect(x - DW / 2, DOOR_Y, DW, DH, 16, 'rgba(154,167,184,.10)', PAL.axis, 2);
    // 门扇(未开时画满)
    if (!open) {
      rrect(x - DW / 2 + 10, DOOR_Y + 10, DW - 20, DH - 20, 10, 'rgba(127,208,247,.12)', 'rgba(127,208,247,.55)', 1.6);
      circle(x + DW / 2 - 34, DOOR_Y + DH / 2, 7, '#9aa7b8');
      text(String(d + 1), x, DOOR_Y + 58, 26, PAL.dim, 'center', 700);
    }
    // 选中标记(门 1)
    if (d === picked && stage >= 0) {
      rrect(x - DW / 2 + 4, DOOR_Y + 4, DW - 8, DH - 8, 14, null, '#ffd166', 3);
      if (showLabels) text(L('你选的', 'your pick'), x, DOOR_Y + DH + 28, 12.5, '#ffd166', 'center', 700);
    }
    // 主持人开的门:山羊
    if (stage >= 1 && d === hostOpen) {
      circle(x, DOOR_Y + DH / 2 - 10, 44, 'rgba(154,167,184,.15)');
      text('🐐', x, DOOR_Y + DH / 2 + 12, 44, null, 'center');
      if (showLabels) text(L('主持人开(必是羊)', 'host opens (always a goat)'), x, DOOR_Y + DH + 28, 12, PAL.dim2, 'center');
    }
    // 揭晓:车门显示车
    if (stage >= 2 && d === carPos) {
      circle(x, DOOR_Y + DH / 2 - 10, 46, 'rgba(67,209,124,.15)');
      text('🚗', x, DOOR_Y + DH / 2 + 14, 46, null, 'center');
      if (showLabels) text(L('车在这', 'car here'), x, DOOR_Y + DH + 28, 12.5, '#7ee2ae', 'center', 700);
    }
  }
  if (showLabels && labelTxt) text(labelTxt, W / 2, DOOR_Y - 40, 15, '#ffd166', 'center', 700);
}
function drawBayes(t) {
  // 贝叶斯三分支小卡(右上)
  const X = 1180, Y = 58, Wd = 392, Ht = 250;
  rrect(X, Y, Wd, Ht, 14, PAL.pill, PAL.grid, 1);
  text(L('贝叶斯:车在哪,主持人就避开哪', 'Bayes: the host avoids wherever the car is'), X + 16, Y + 28, 12.5, PAL.dim);
  const rows = [
    [L('车在门 1', 'car in door 1'), L('主持人开 2 或 3', 'host opens 2 or 3'), L('换 → 输', 'switch → lose'), '#ff8a80'],
    [L('车在门 2', 'car in door 2'), L('主持人只能开 3', 'host must open 3'), L('换 → 赢', 'switch → win'), '#7ee2ae'],
    [L('车在门 3', 'car in door 3'), L('主持人只能开 2', 'host must open 2'), L('换 → 赢', 'switch → win'), '#7ee2ae'],
  ];
  rows.forEach((r2, i) => {
    const ry = Y + 56 + i * 46;
    rrect(X + 14, ry, Wd - 28, 38, 8, 'rgba(154,167,184,.08)');
    text(r2[0], X + 28, ry + 25, 12, PAL.dim2);
    text(r2[1], X + 138, ry + 25, 12, PAL.dim2);
    text(r2[2], X + Wd - 92, ry + 25, 12.5, r2[3], 'right', 700);
  });
  text(L('三种等可能,两种换赢 → P(换赢) = 2/3', 'three equal cases, two favor switching → 2/3'),
    X + Wd / 2, Y + Ht - 12, 12.5, '#ffd166', 'center', 700);
}
function drawVerdict(t) {
  const stage = Math.floor(tR * 4);
  if (stage !== 2 && stage !== 3) return;
  const switchedTo = [0, 1, 2].find(d => d !== picked && d !== hostOpen);
  const swRes = switchedTo === carPos;
  const stRes = picked === carPos;
  const x = DOOR_X[switchedTo];
  text(swRes ? L('换 → 赢 ✅', 'switch → WIN ✅') : L('换 → 输', 'switch → lose'),
    x, DOOR_Y - 70, 15, swRes ? '#7ee2ae' : '#ff8a80', 'center', 700);
  const sx = DOOR_X[picked];
  text(stRes ? L('不换 → 赢 ✅', 'stay → WIN ✅') : L('不换 → 输', 'stay → lose'),
    sx, DOOR_Y + DH + 58, 13, stRes ? '#7ee2ae' : '#ff8a80', 'center', 700);
}

/* ================= 批量模拟 ================= */
let pendingBatch = 0, batchAcc = 0;
function runBatch(n) {
  for (let i = 0; i < n; i++) {
    const car = Math.floor(Math.random() * 3);
    swN++;
    if (car !== 0) swWin++;           // 换:只要车不在门 1 就赢
    stN++;
    if (car === 0) stWin++;           // 不换:车在门 1 才赢
  }
}
function updateStats() {
  const sp = swN ? Math.round(swWin / swN * 100) : 0;
  const tp = stN ? Math.round(stWin / stN * 100) : 0;
  document.getElementById('swPct').textContent = swN ? `${swWin}/${swN} = ${sp}%` : '—';
  document.getElementById('stPct').textContent = stN ? `${stWin}/${stN} = ${tp}%` : '—';
  document.getElementById('fillSw').style.width = sp + '%';
  document.getElementById('fillSt').style.width = tp + '%';
  const rows = document.querySelectorAll('#stats .lab span:nth-child(1)');
  if (rows[0]) rows[0].textContent = L(`n = ${swN} 局`, `n = ${swN}`);
  if (rows[2]) rows[2].textContent = L(`共 ${stN} 局`, `${stN} rounds`);
}

/* ================= 主绘制 ================= */
function draw(t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawDoors(t);
  drawVerdict(t);
  drawBayes(t);
}

/* ================= UI / 主循环 ================= */
let playing = true, speed = 1, batch = 1;
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elBatch = document.getElementById('batch');
const elBatchVal = document.getElementById('batchVal');
const elReset = document.getElementById('reset');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elBatch.addEventListener('input', () => { batch = parseInt(elBatch.value, 10); elBatchVal.textContent = '×' + batch; });
elReset.addEventListener('click', () => {
  swWin = swN = stWin = stN = 0; round = 0; lastB = -1; updateStats();
});
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

let last = performance.now();
applyTheme();
applyLang();
updateStats();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) {
    tR += dt * speed / RLEN;
    batchAcc += dt * speed * batch;
    while (batchAcc >= 1) { runBatch(1); batchAcc -= 1; }
    while (tR >= 1) { tR -= 1; round++; newRoundData(); }
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(tR);
  updateStats();
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
newRoundData();
requestAnimationFrame(frame);
</script>
