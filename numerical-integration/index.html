{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let speedK=clamp(parseFloat(qs.get('speed'))||1,0.2,3);
let simT=0,notifyT=0,notifyZ='',notifyE='';

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,80);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,300);
camera.position.set(6.5,5.5,11);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.1,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,9,7);scene.add(key);

/* ---- 材质 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const wallM=new THREE.MeshStandardMaterial({color:0x2e3a47,roughness:0.6,metalness:0.4});
const springM=new THREE.MeshStandardMaterial({color:0x8b939c,roughness:0.35,metalness:0.8});
const massM=new THREE.MeshStandardMaterial({color:0x4a7fa5,roughness:0.3,metalness:0.6});
const ghostM=new THREE.MeshStandardMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:0.4});
const barNumM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xffa000,emissiveIntensity:0.7,roughness:0.3});
const barExM=new THREE.MeshStandardMaterial({color:0x9aa8b5,roughness:0.5,metalness:0.4});
const starM=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xffa000,emissiveIntensity:1.6,roughness:0.4});
const planetM=new THREE.MeshStandardMaterial({color:0x74c0fc,emissive:0x1864ab,emissiveIntensity:0.5,roughness:0.4});
const trailM=new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.9});
const ellipseM=new THREE.LineDashedMaterial({color:0x74c0fc,dashSize:0.25,gapSize:0.16,transparent:true,opacity:0.7});
const ghostTrailM=new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.35});

/* ================= 物理状态 ================= */
let mode='spring';            // spring | orbit
let method='euler';           // euler | mid | rk4
let kSpring=1, GM=23.04;      // 弹簧刚度 / 引力参数(轨道预设)
let h=0.11;                   // 步长
const st={px:0,pz:0,vx:0,vz:0};
let E0=1, divged={v:false,notified:false}, tAcc=0;   // 发散闩锁:对象而非布尔(严格模式下不能给原始值挂属性)
/* 轨道解析解缓存 */
let orbA=1,orbE=0,orbW=0,orbN=1;
const A1={x:0,z:0},A2={x:0,z:0},A3={x:0,z:0},A4={x:0,z:0};
function accel(px,pz,out){
  if(mode==='spring'){out.x=-kSpring*px;out.z=0;}
  else{const r2=px*px+pz*pz,r=Math.sqrt(r2)||1e-9,f=-GM/(r2*r);out.x=f*px;out.z=f*pz;}
}
function stepEuler(s,hh){const a=A1;accel(s.px,s.pz,a);s.px+=s.vx*hh;s.pz+=s.vz*hh;s.vx+=a.x*hh;s.vz+=a.z*hh;}
function stepMid(s,hh){        // 显式中点法(二阶)
  accel(s.px,s.pz,A1);
  const mvx=s.vx+A1.x*hh/2,mvz=s.vz+A1.z*hh/2;
  accel(s.px+s.vx*hh/2,s.pz+s.vz*hh/2,A2);
  s.px+=mvx*hh;s.pz+=mvz*hh;s.vx+=A2.x*hh;s.vz+=A2.z*hh;
}
function stepRK4(s,hh){        // 经典四阶龙格-库塔
  accel(s.px,s.pz,A1);
  const p2x=s.px+s.vx*hh/2,p2z=s.pz+s.vz*hh/2,v2x=s.vx+A1.x*hh/2,v2z=s.vz+A1.z*hh/2;
  accel(p2x,p2z,A2);
  const p3x=s.px+v2x*hh/2,p3z=s.pz+v2z*hh/2,v3x=s.vx+A2.x*hh/2,v3z=s.vz+A2.z*hh/2;
  accel(p3x,p3z,A3);
  const p4x=s.px+v3x*hh,p4z=s.pz+v3z*hh,v4x=s.vx+A3.x*hh,v4z=s.vz+A3.z*hh;
  accel(p4x,p4z,A4);
  s.px+=hh/6*(s.vx+2*v2x+2*v3x+v4x);s.pz+=hh/6*(s.vz+2*v2z+2*v3z+v4z);
  s.vx+=hh/6*(A1.x+2*A2.x+2*A3.x+A4.x);s.vz+=hh/6*(A1.z+2*A2.z+2*A3.z+A4.z);
}
function energy(){             // 数值能量
  const v2=st.vx*st.vx+st.vz*st.vz;
  if(mode==='spring')return 0.5*v2+0.5*kSpring*st.px*st.px;
  const r=Math.sqrt(st.px*st.px+st.pz*st.pz)||1e-9;
  return 0.5*v2-GM/r;
}
function stepOnce(hh){(method==='euler'?stepEuler:method==='mid'?stepMid:stepRK4)(st,hh);simT+=hh;}
function diverged(){
  const r=Math.hypot(st.px,st.pz);
  if(mode==='spring')return r>30||Math.abs(st.vx)>60;
  return r<0.55||r>60;
}
/* 开普勒解析解(轨道 ghost) */
function keplerSetup(){
  const r0x=st.px,r0z=st.pz,v0x=st.vx,v0z=st.vz;
  const r0=Math.hypot(r0x,r0z),v02=v0x*v0x+v0z*v0z;
  const E=0.5*v02-GM/r0;
  orbA=-GM/(2*E);
  const mom=r0x*v0z-r0z*v0x;
  orbE=Math.sqrt(Math.max(0,1+2*E*mom*mom/(GM*GM)));
  const ex=((v02-GM/r0)*r0x-(r0x*v0x+r0z*v0z)*v0x)/GM;
  const ez=((v02-GM/r0)*r0z-(r0x*v0x+r0z*v0z)*v0z)/GM;
  orbW=Math.atan2(ez,ex);
  orbN=Math.sqrt(GM/(orbA*orbA*orbA));
}
function keplerPos(t,out){
  let M=orbN*t%(2*Math.PI);
  let E=M;
  for(let i=0;i<5;i++)E=E-(E-orbE*Math.sin(E)-M)/(1-orbE*Math.cos(E));
  const r=orbA*(1-orbE*Math.cos(E));
  const nu=Math.atan2(Math.sqrt(1-orbE*orbE)*Math.sin(E),Math.cos(E)-orbE);
  out.x=r*Math.cos(nu+orbW);out.z=r*Math.sin(nu+orbW);
}

function rebuildExactEllipse(){
  const pts=[];

const plotCv=document.getElementById('plotCv');
let plotMode='phase';          // phase | error
const phaseTrail=[];           // spring 相位历史
const ERR_HS=[];               // 误差-步长数据(init 时真算一遍)
const ERR_DATA={};
function computeErrorData(){
  for(let i=0;i<=11;i++)ERR_HS.push(0.5*Math.pow(10,-i/11*2));
  const T=Math.PI*6,x0=1,v0=0;
  for(const m of ['euler','mid','rk4']){
    ERR_DATA[m]=ERR_HS.map(hh=>{
      const s={px:x0,pz:0,vx:v0,vz:0};
      const keepM=method,keepMode=mode,keepK=kSpring;
      method=m;mode='spring';kSpring=1;
      const n=Math.ceil(T/hh);
      for(let i=0;i<n;i++)stepOnce(Math.min(hh,T-i*hh));
      method=keepM;mode=keepMode;kSpring=keepK;
      return Math.abs(s.px-Math.cos(T))+Math.abs(s.vx+Math.sin(T));
    });
  }
}
function drawPlot(){
  const ctx=plotCv.getContext('2d');
  const W=plotCv.width=plotCv.clientWidth*2,H=plotCv.height=plotCv.clientHeight*2;
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement);
  const cTxt=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  const acc=css.getPropertyValue('--acc').trim()||'#ffa94d';
  const padL=44,padR=12,padT=12,padB=28;
  ctx.font='13px system-ui';
  if(plotMode==='error'){
    const lmin=-4,lmax=3.2,xmin=-2.4,xmax=-0.28;
    const xOf=hh=>padL+(Math.log10(hh)-xmin)/(xmax-xmin)*(W-padL-padR);
    const yOf=e=>(H-padB)-(clamp(Math.log10(Math.max(e,1e-6)),lmin,lmax)-lmin)/(lmax-lmin)*(H-padT-padB);
    ctx.strokeStyle='rgba(128,150,170,.25)';
    ctx.beginPath();ctx.moveTo(padL,yOf(1));ctx.lineTo(W-padR,yOf(1));ctx.stroke();
    ctx.beginPath();ctx.moveTo(xOf(0.1),padT);ctx.lineTo(xOf(0.1),H-padB);ctx.stroke();
    const cols={euler:'#ff6b6b',mid:'#74c0fc',rk4:'#7bd88f'};
    const names={euler:'Euler O(h)',mid:'Midpoint O(h²)',rk4:'RK4 O(h⁴)'};
    for(const m of ['euler','mid','rk4']){
      ctx.strokeStyle=cols[m];ctx.lineWidth=2.4;ctx.beginPath();
      ERR_HS.forEach((hh,i)=>{const px=xOf(hh),py=yOf(ERR_DATA[m][i]);
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
      ctx.stroke();ctx.lineWidth=1;
      ctx.fillStyle=cols[m];
      ctx.fillText(names[m],padL+8+(m==='mid'?110:m==='rk4'?230:0),padT+14+(m==='mid'?20:m==='rk4'?40:0));
    }
    ctx.fillStyle=acc;
    ctx.fillRect(xOf(h)-1.5,padT,3,H-padT-padB);
    ctx.fillStyle=cTxt;
    ctx.fillText('h',padL+6,H-padB+18);
    ctx.fillText(L('误差(error)','error'),W-padR-70,H-padB+18);
    ctx.fillText('1e-4',padL-34,yOf(1e-4)+4);
    ctx.fillText('1e+3',padL-34,yOf(1e3)+4);
    ctx.fillText('0.01',xOf(0.01)-14,H-padB+18);
    ctx.fillText('0.1',xOf(0.1)-8,H-padB+18);
  }else{
    ctx.strokeStyle='rgba(128,150,170,.25)';
    ctx.beginPath();ctx.moveTo(padL,(padT+H-padB)/2);ctx.lineTo(W-padR,(padT+H-padB)/2);ctx.stroke();
    ctx.beginPath();ctx.moveTo((padL+W-padR)/2,padT);ctx.lineTo((padL+W-padR)/2,H-padB);ctx.stroke();
    if(mode==='spring'){
      const R=1.6,om=Math.sqrt(kSpring);
      const xOf=x=>padL+(x/R+1)/2*(W-padL-padR);
      const yOf=v=>(H-padB)-(v/R+1)/2*(H-padT-padB);
      ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(116,192,252,.6)';ctx.lineWidth=1.6;
      ctx.beginPath();
      for(let i=0;i<=90;i++){const a=i/90*Math.PI*2;
        const px=xOf(Math.cos(a)*1.2),py=yOf(-Math.sin(a)*1.2*om/om);
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;
      ctx.strokeStyle=acc;ctx.lineWidth=2.2;ctx.beginPath();
      phaseTrail.forEach((p,i)=>{const px=xOf(p[0]),py=yOf(p[1]/om);
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
      ctx.stroke();ctx.lineWidth=1;
      ctx.fillStyle=acc;
      if(phaseTrail.length){ctx.beginPath();ctx.arc(xOf(phaseTrail[phaseTrail.length-1][0]),yOf(phaseTrail[phaseTrail.length-1][1]/om),5,0,7);ctx.fill();}
      ctx.fillStyle=cTxt;
      ctx.fillText('x →',W-padR-38,(padT+H-padB)/2-8);
      ctx.fillText('v/ω ↑',padL+6,padT+14);
      ctx.fillText(L('虚线=解析椭圆','dashed = exact'),padL+8,H-padB-8);
    }else{
      const R=6.5;
      const xOf=x=>padL+(x/R+1)/2*(W-padL-padR);
      const yOf=z=>(H-padB)-(z/R+1)/2*(H-padT-padB);
      ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(116,192,252,.6)';
      ctx.beginPath();
      for(let i=0;i<=180;i++){const nu=i/180*Math.PI*2;
        const r=orbA*(1-orbE*orbE)/(1+orbE*Math.cos(nu));
        const px=xOf(r*Math.cos(nu+orbW)),py=yOf(r*Math.sin(nu+orbW));
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle=acc;ctx.lineWidth=2.2;ctx.beginPath();
      for(let i=0;i<trailN;i++){const px=xOf(trailPos[i*3]),py=yOf(trailPos[i*3+2]);
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.stroke();ctx.lineWidth=1;
      ctx.fillStyle=acc;
      ctx.beginPath();ctx.arc(xOf(st.px),yOf(st.pz),5,0,7);ctx.fill();
      ctx.fillStyle=cTxt;
      ctx.fillText('x →',W-padR-38,(padT+H-padB)/2-8);
      ctx.fillText('z ↑',padL+6,padT+14);
    }
  }
}

/* ================= 重置 / 预演 ================= */
function resetSim(presim=0){
  simT=0;tAcc=0;divged.v=false;divged.notified=false;trailN=0;phaseTrail.length=0;
  if(mode==='spring'){st.px=1.2;st.pz=0;st.vx=0;st.vz=0;}
  else{st.px=4;st.pz=0;st.vx=0;st.vz=2.7;}
  E0=energy();
  keplerSetup();rebuildExactEllipse();
  /* 预演:预填轨迹缓冲,首屏图不空 */
  let pt=0;
  while(pt<presim){stepOnce(h);pt+=h;pushTrail();}
}
function pushTrail(){
  if(mode==='orbit'){
    if(trailN<ORBMAX){
      trailPos[trailN*3]=st.px;trailPos[trailN*3+1]=0;trailPos[trailN*3+2]=st.pz;trailN++;
    }else{
      trailPos.copyWithin(0,3);
      trailPos[(ORBMAX-1)*3]=st.px;trailPos[(ORBMAX-1)*3+1]=0;trailPos[(ORBMAX-1)*3+2]=st.pz;
    }
    trailGeo.setDrawRange(0,trailN);
    trailGeo.attributes.position.needsUpdate=true;
  }else{
    phaseTrail.push([st.px,st.vx]);
    if(phaseTrail.length>900)phaseTrail.shift();
  }
}

/* ================= 步骤 ================= */
const STEPS=[
  {zh:'没有解析解的方程:把「求解」换成「小步递推」,每步只看当前斜率',en:'Unsolvable ODEs: replace solving with small steps along local slopes'},
  {zh:'显式欧拉:xₙ₊₁=xₙ+h·f(xₙ),沿切线走,每一步都悄悄注入能量',en:'Explicit Euler: follow the tangent — every step secretly injects energy'},
  {zh:'能量漂移:E/E₀ 一圈圈上涨,相位图螺旋外扩;步长越大漂得越快',en:'Energy drift: E/E₀ climbs, spiral grows — bigger h drifts faster'},
  {zh:'中点法:先探半步看斜率,再回头正式走,误差降到 O(h²)',en:'Midpoint: peek half a step, then move — error drops to O(h²)'},
  {zh:'RK4:四个斜率加权平均,四阶精度:h 减半,误差只剩 1/16',en:'RK4: four slopes, 4th order — halve h and error drops 16×'},
  {zh:'误差-步长双对数图:曲线斜率=方法的阶,是它的身份证',en:'Log-log error vs h: the slope IS the order — the method\'s fingerprint'},
  {zh:'刚性问题:ωh>2 时欧拉直接爆炸,振荡快的系统需要隐式方法',en:'Stiff systems: Euler explodes when ωh>2 — go implicit'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();stepAct(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function stepAct(i){
  if(i===0){mode='spring';method='rk4';setH(0.06);resetSim(2);notify('RK4 小步长:几乎贴着解析解走','RK4, small h: hugs the exact solution',3.0);}
  if(i===1){mode='spring';method='euler';setH(0.12);resetSim(2);notify('显式欧拉:切线外推,能量只进不出','explicit Euler: tangent extrapolation, energy only grows',3.4);}
  if(i===2){mode='spring';method='euler';setH(0.3);resetSim(2);notify('步长 0.3:几圈之内振幅就翻倍','h = 0.3: amplitude doubles within a few cycles',3.4);}
  if(i===3){mode='spring';method='mid';setH(0.2);resetSim(2);notify('中点法:先探半步,漂移慢一个量级','midpoint: half-step probe, drift an order slower',3.2);}
  if(i===4){mode='spring';method='rk4';setH(0.2);resetSim(2);notify('RK4 @ h=0.2:仍然纹丝不动','RK4 @ h=0.2: still motionless energy',3.2);}
  if(i===5){plotMode='error';syncPlotTitle();notify('双对数下,欧拉/中点/RK4 的斜率=1/2/4','on log-log axes the slopes are 1/2/4',3.4);}
  if(i===6){mode='spring';kSpring=25;method='euler';setH(0.42);resetSim(1.2);
    notify('刚性系统 ω=5:h·ω≈2.1 > 2,欧拉爆炸——换 RK4 或隐式','stiff ω=5: h·ω≈2.1 > 2, Euler blows up — use RK4 or implicit',4.2);}
  syncBtns();
}

  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let raf=null,acc=0,accPlot=0;
const gp={x:0,z:0};
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(notifyT>0)notifyT-=dt;
  if(playing&&!divged.v){
    let it=0;
    tAcc+=dt*speedK;
    while(tAcc>=h&&it<400){stepOnce(h);tAcc-=h;it++;pushTrail();if(diverged())break;}
    if(diverged()&&!divged.notified){
      divged.v=true;divged.notified=true;
      notify('发散!能量爆炸——这是方法的稳定性边界,不是物理','diverged! energy blow-up — a stability limit of the method, not physics',4.5);
    }
  }
  /* 3D 位姿 */
  if(mode==='spring'){
    mass.position.x=st.px;
    helixGrp.scale.x=Math.max(0.2,st.px+2.65);
    const om=Math.sqrt(kSpring),A=1.2;
    ghost.position.x=A*Math.cos(om*simT);
    const e=energy(),r=E0!==0?Math.abs(e/E0):1;
    const hb=clamp(r,0,2)*1.1;
    barNum.scale.y=Math.max(0.02,hb);barNum.position.y=0.1+Math.max(0.02,hb)/2;
    barEx.scale.y=1.1;barEx.position.y=0.1+0.55;
  }else{
    planet.position.set(st.px,0,st.pz);
    keplerPos(simT,gp);
    ghostPlanet.position.set(gp.x,0,gp.z);
    const e=energy(),r=E0!==0?Math.abs(e/E0):1;
    const hb=clamp(r,0,2)*1.1;
    barNum.scale.y=Math.max(0.02,hb);barNum.position.y=0.1+Math.max(0.02,hb)/2;
    barEx.scale.y=1.1;barEx.position.y=0.1+0.55;
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  accPlot+=dt;if(accPlot>0.12){accPlot=0;drawPlot();}
  for(const r of labelReg){
    const txt=r.text();
    r.o.visible=labelsOn&&r.vis()&&txt!=='';
    if(r.o.visible)r.o.element.textContent=txt;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ================= 初始化 ================= */
computeErrorData();      // 误差-步长曲线:init 时真实积分一遍
applyTheme();
buildSteps();
applyLang();
if(!playing)document.getElementById('play').textContent=L('运行','Run');
document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
document.getElementById('sSpd').value=clamp(Math.round(speedK*100),20,300);
resetSim(5);             // 预演 5 秒:相位图首屏不空
syncBtns();
updateStats();
drawPlot();
start();
</script>
</body>
</html>
