<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>并查集 · 森林与代表元</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.bad{color:#ff6b6b}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);border-top:1px dashed var(--panel-border);padding-top:7px}
  #formula b{color:var(--text3);font-weight:600}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="并查集 · 森林与代表元" data-en="Union-Find · Forest of Representatives">并查集 · 森林与代表元</h1>
  <div class="sub" data-zh="「这两点连通吗」只需问根:union 把一棵树挂到另一棵下;不管树高乱挂会退化成链,按秩合并 + 路径压缩两个启发式把 find 压到均摊 O(α(n)) · 看 find 沿链向上走、整条链「哗」地拍扁挂根;调 p 玩渗流实验 · 拖动旋转 / 空格运行/暂停" data-en="Asking 'are these connected?' only needs the root: union hangs one tree under another; careless merging degenerates into chains, and union-by-rank + path compression bring find down to amortized O(a(n)) · watch a find climb the chain, then the whole chain snap flat onto the root · drag to orbit / Space = run/pause">「这两点连通吗」只需问根:union 把一棵树挂到另一棵下;不管树高乱挂会退化成链,按秩合并 + 路径压缩两个启发式把 find 压到均摊 O(α(n)) · 看 find 沿链向上走、整条链「哗」地拍扁挂根;调 p 玩渗流实验 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
/* 模板公共状态:必须在任何使用点之前声明 */
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
let speedK=clamp(parseFloat(qs.get('speed'))||1,0.25,3);
let simT=0,notifyT=0,notifyZ='',notifyE='';

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,16,44);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,120);
camera.position.set(4.6,9.6,9.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.4,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=32;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,9,7);scene.add(key);

/* ---- 材质(主题可变) ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const siteM=new THREE.MeshStandardMaterial({roughness:0.35,metalness:0.15});
const pulseM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xffa000,emissiveIntensity:1.4,roughness:0.3});
const arcM=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.95});
const orangeC=new THREE.Color(0xffa94d);
const tmpC=new THREE.Color();

/* ---- 数据:8×8 格点上的并查集 ---- */
const GRID=8,N=GRID*GRID;
const pos=[];   // 每个格点的世界坐标
for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++)
  pos.push(new THREE.Vector3((j-(GRID-1)/2),0.06,(i-(GRID-1)/2)));
const parent=new Int16Array(N), rnk=new Int8Array(N), open=new Uint8Array(N);
const rootCache=new Int16Array(N);           // recolorSites 时缓存各点所在树的根
const arcAnim=new Array(N).fill(null);       // 挂接动画:{from2,t} 端点2从旧位置滑向新父
const arcFlash=new Float32Array(N);          // 新挂弧的橙色闪光衰减
const bump=new Float32Array(N);              // 节点被 find 途经时的放大脉冲
let rankOn=true,pcOn=true;
let lastHops=-1,unionCount=0,autoT=0,firstDemoT=1.6;
let arcDirty=true;

const hueOf=r=>((r*0.6180339887)%1+1)%1;     // 黄金角散列:相邻根颜色分开
function compColor(root,out){
  out.setHSL(hueOf(root),0.62,THEME==='dark'?0.58:0.44);return out;
}
function rawDepth(x){let d=0;while(parent[x]!==x){x=parent[x];d++;}return d;}
function findPath(x){                        // 真实 find:返回 {root,chain(不含根),hops}
  const chain=[];let hops=0;
  while(parent[x]!==x){chain.push(x);x=parent[x];hops++;}
  return {root:x,chain,hops};
}
/* union:两根相连,按秩时矮树挂高树 */
function union(a,b){
  const ra=findPath(a).root,rb=findPath(b).root;
  if(ra===rb)return false;
  let child=rb,root=ra;
  if(rankOn&&rnk[rb]>rnk[ra]){child=ra;root=rb;}
  parent[child]=root;
  if(rankOn&&rnk[child]===rnk[root])rnk[root]++;
  arcAnim[child]={from2:pos[child].clone(),t:0};  // 弧从自身「长」向新父
  arcFlash[child]=1;arcDirty=true;
  return true;
}
/* 渗流:以概率 p 开格点,再批量合并所有相邻开启对 */
function flow(p){
  for(let i=0;i<N;i++){parent[i]=i;rnk[i]=0;open[i]=Math.random()<p?1:0;arcAnim[i]=null;arcFlash[i]=0;}
  pulse.active=false;pulseMesh.visible=false;
  for(let i=0;i<N;i++){
    if(!open[i])continue;
    const r=(i/GRID)|0,c=i%GRID;
    if(c+1<GRID&&open[i+1])union(i,i+1);
    if(r+1<GRID&&open[i+GRID])union(i,i+GRID);
  }
  lastHops=-1;recolorSites();
}
function percolates(){                       // 顶行与底行是否共享一个根
  const top=new Set();
  for(let j=0;j<GRID;j++)if(open[j])top.add(rootCache[j]);
  for(let i=N-GRID;i<N;i++)if(open[i]&&top.has(rootCache[i]))return true;
  return false;
}
function randomUnion(){
  for(let t=0;t<40;t++){
    const i=(Math.random()*N)|0;
    if(!open[i])continue;
    const r=(i/GRID)|0,c=i%GRID,d=[[-1,0],[1,0],[0,-1],[0,1]][(Math.random()*4)|0];
    const rr=r+d[0],cc=c+d[1];
    if(rr<0||rr>=GRID||cc<0||cc>=GRID)continue;
    const j=rr*GRID+cc;
    if(!open[j])continue;
    if(findPath(i).root!==findPath(j).root)return union(i,j);
  }
  return false;
}

/* ---- 场景物体 ---- */
const ground=new THREE.Mesh(new THREE.BoxGeometry(24,0.24,24),groundM);
ground.position.y=-0.62;scene.add(ground);
const gridH=new THREE.GridHelper(GRID,GRID,0x4a5462,0x333b46);
gridH.material.transparent=true;gridH.material.opacity=0.45;gridH.position.y=0.001;scene.add(gridH);
/* 格点球:64 个实例全部使用 */
const sites=new THREE.InstancedMesh(new THREE.SphereGeometry(0.155,14,10),siteM,N);
scene.add(sites);
const m4=new THREE.Matrix4(),one=new THREE.Vector3(1,1,1),zero=new THREE.Vector3(0,0,0);
function writeSiteMatrices(){
  for(let i=0;i<N;i++){
    const s=1+0.5*bump[i];
    m4.compose(pos[i],new THREE.Quaternion(),bump[i]>0.01?one.clone().multiplyScalar(s):one);
    sites.setMatrixAt(i,m4);
  }
  sites.instanceMatrix.needsUpdate=true;
}
function recolorSites(){
  const closed=THEME==='dark'?0x272d36:0xb6afa2;
  for(let i=0;i<N;i++){
    if(open[i]){const r=findPath(i).root;rootCache[i]=r;tmpC.copy(compColor(r,new THREE.Color()));}
    else {rootCache[i]=i;tmpC.setHex(closed);}
    sites.setColorAt(i,tmpC);
  }
  sites.instanceColor.needsUpdate=true;
  arcDirty=true;
}
writeSiteMatrices();
/* find 脉冲小球 */
const pulseMesh=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,10),pulseM);
pulseMesh.visible=false;scene.add(pulseMesh);
let pulse={active:false,path:[],seg:0,u:0};
/* 树弧:child→parent 的上拱贝塞尔,容量 (N-1)×8 段×2 点 */
const SEG=8,ARCCAP=(N-1)*SEG*2*3;
const arcGeo=new THREE.BufferGeometry();
const arcPos=new Float32Array(ARCCAP),arcCol=new Float32Array(ARCCAP);
arcGeo.setAttribute('position',new THREE.BufferAttribute(arcPos,3));
arcGeo.setAttribute('color',new THREE.BufferAttribute(arcCol,3));
const arcs=new THREE.LineSegments(arcGeo,arcM);scene.add(arcs);
const ease=t=>t*t*(3-2*t);
function bez(out,off,a,b,m,t){               // 二次贝塞尔取点
  const it=1-t;
  out[off]  =it*it*a.x+2*it*t*m.x+t*t*b.x;
  out[off+1]=it*it*a.y+2*it*t*m.y+t*t*b.y;
  out[off+2]=it*it*a.z+2*it*t*m.z+t*t*b.z;
}
function rebuildArcs(){
  let off=0,cnt=0;
  for(let i=0;i<N;i++){
    if(!open[i]||parent[i]===i)continue;
    const a=pos[i];
    let b=pos[parent[i]];
    const an=arcAnim[i];
    if(an){if(an.t>=1)arcAnim[i]=null;else b=an.from2.clone().lerp(b,ease(an.t));}
    const up=0.3+0.09*Math.min(rawDepth(i),8);
    const m=new THREE.Vector3((a.x+b.x)/2,(a.y+b.y)/2+up,(a.z+b.z)/2);
    tmpC.copy(compColor(rootCache[i],new THREE.Color()));
    if(arcFlash[i]>0)tmpC.lerp(orangeC,arcFlash[i]);
    for(let s=0;s<SEG;s++){
      bez(arcPos,off,a,b,m,s/SEG);
      arcCol[off]=tmpC.r;arcCol[off+1]=tmpC.g;arcCol[off+2]=tmpC.b;off+=3;
      bez(arcPos,off,a,b,m,(s+1)/SEG);
      arcCol[off]=tmpC.r;arcCol[off+1]=tmpC.g;arcCol[off+2]=tmpC.b;off+=3;
    }
    cnt++;
  }
  arcGeo.setDrawRange(0,cnt*SEG*2);
  arcGeo.attributes.position.needsUpdate=true;
  arcGeo.attributes.color.needsUpdate=true;
  arcDirty=false;
}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,p,cls='',visFn=()=>true,parentObj=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(p);parentObj.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('连通分量 = 一棵树,根 = 全组「代表」','component = one tree; root = the representative'),new THREE.Vector3(0,2.3,0),'b');
addLabel(()=>L('路径压缩:find 沿途节点直接改挂到根','path compression: visited nodes re-hang on the root'),new THREE.Vector3(0,1.55,-2.6),'o',()=>pcOn);
addLabel(()=>L('按秩合并:矮树挂到高树下','union by rank: short tree under tall tree'),new THREE.Vector3(-3.4,1.1,2.6),'g',()=>rankOn);
addLabel(()=>L('树越高 = 节点越深,长链 = 退化','taller tree = deeper node; a long chain = degenerate'),new THREE.Vector3(3.4,0.9,2.6),'r');
const lblNotify=addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',new THREE.Vector3(0,3.1,0),'r');

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'集合即森林:每个连通分量是一棵树,「是否连通」= 是否同根',en:'Sets are a forest: same component iff same root'},
  {zh:'union 合并:把一棵树的根整棵挂到另一棵树的根下',en:'union: hang one whole tree under the other root'},
  {zh:'朴素退化:不管树高乱挂,树会退化成链,find 变成 O(n)',en:'Naive union degenerates into chains: find becomes O(n)'},
  {zh:'按秩合并:永远矮树挂高树,树高被压在 O(log n) 内',en:'Union by rank keeps height within O(log n)'},
  {zh:'路径压缩:find 走过的节点全部改挂根,一条链被「拍扁」',en:'Path compression flattens the whole visited chain'},
  {zh:'均摊 O(α(n)):两启发式合用,反阿克曼函数实践中是常数',en:'Amortized O(a(n)): inverse Ackermann, constant in practice'},
  {zh:'渗流实验:格点以概率 p 打开,上下贯通阈值 p_c≈0.593',en:'Percolation: site threshold p_c ≈ 0.593 on the square lattice'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();stepAct(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function stepAct(i){
  syncToggles();
  if(i===0){flow(0.5);notify('每个颜色是一个连通分量,球挂成小森林','each color is one component — a small forest',3.4);}
  if(i===1){flow(0.5);for(let k=0;k<5;k++)randomUnion();recolorSites();notify('union:两根相连,整棵树搬家','union: roots link, the whole tree moves',3.0);}
  if(i===2){rankOn=false;pcOn=false;syncToggles();flow(0.5);
    for(let k=0;k<45;k++)randomUnion();recolorSites();
    notify('启发式全关:45 次 union 后树已退化成长链','heuristics off: 45 unions later, chains appear',3.6);}
  if(i===3){rankOn=true;pcOn=false;syncToggles();flow(0.5);
    for(let k=0;k<45;k++)randomUnion();recolorSites();
    notify('只开按秩合并:同样 45 次 union,树高被压住','rank only: same 45 unions, height stays low',3.6);}
  if(i===4){rankOn=true;pcOn=true;syncToggles();flow(0.5);
    for(let k=0;k<25;k++)randomUnion();recolorSites();demoFind();
    notify('find 一路向上,回程把整条链拍扁挂根','find climbs up, then flattens the chain onto the root',3.6);}
  if(i===5){rankOn=true;pcOn=true;syncToggles();flow(0.62);
    for(let k=0;k<220;k++)randomUnion();recolorSites();
    notify('220 次 union 后最大树高仍是个位数:均摊 O(α(n))','after 220 unions max depth stays tiny: amortized O(a(n))',3.8);}
  if(i===6){rankOn=true;pcOn=true;syncToggles();flow(+document.getElementById('sP').value/100);
    notify(`p=${(+document.getElementById('sP').value/100).toFixed(2)}:${percolates()?'上下贯通!':'未贯通'} — 阈值 p_c≈0.593`,
      `p=${(+document.getElementById('sP').value/100).toFixed(2)}: ${percolates()?'spans top-bottom':'no span'} — threshold p_c≈0.593`,4.0);}
}
function notify(z,e,t=3.0){notifyT=t;notifyZ=z;notifyE=e;}
/* find 演示:脉冲沿链向上,到根后按需压缩 */
function demoFind(){
  if(pulse.active)return;
  let deepest=-1,bd=-1;
  for(let i=0;i<N;i++)if(open[i]){const d=rawDepth(i);if(d>bd){bd=d;deepest=i;}}
  if(bd<=0){notify('森林已经扁了:find 一步到根','forest already flat: one hop to the root',2.4);return;}
  const r=findPath(deepest);
  pulse={active:true,path:r.chain.concat([r.root]),seg:0,u:0};
  pulseMesh.visible=true;
  pulseMesh.position.copy(pos[pulse.path[0]]);
}
function pulseArrive(){
  const chain=pulse.path.slice(0,-1),root=pulse.path[pulse.path.length-1];
  lastHops=chain.length;
  bump[root]=1;
  if(pcOn&&chain.length>1){
    for(const c of chain){
      if(parent[c]!==root){
        arcAnim[c]={from2:pos[parent[c]].clone(),t:0};
        arcFlash[c]=1;parent[c]=root;
      }
      bump[c]=Math.max(bump[c],0.7);
    }
    recolorSites();
    notify(`拍扁!find ${chain.length} 步 → 1 步`,`flattened! find ${chain.length} hops → 1`,2.8);
  }else if(chain.length>3){
    notify(`find 走了 ${chain.length} 步(无路径压缩)`,`find took ${chain.length} hops (no compression)`,2.8);
  }
  pulse.active=false;pulseMesh.visible=false;
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  recolorSites();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('并查集 · 森林与代表元','Union-Find · Forest of Representatives');
  document.getElementById('formula').innerHTML=L(
    `<b>find(x)</b>:沿 parent 指针一路向上直到根;两次查询同根 ⇔ 连通<br>`+
    `<b>union(a,b)</b>:两根相连;按秩合并=矮树挂高树,树高 ≤ log₂n<br>`+
    `<b>路径压缩</b>:查询沿途节点全部改挂根;与按秩合并合用,均摊 O(α(n)),α(10⁹)<4<br>`+
    `<b>渗流</b>:p_c≈0.593(方格座渗流),并查集正是数连通块、判贯通的引擎`,
    `<b>find(x)</b>: climb parent pointers to the root; two queries share a root iff connected<br>`+
    `<b>union(a,b)</b>: link the two roots; by rank = short under tall, height ≤ log₂n<br>`+
    `<b>Path compression</b>: re-hang visited nodes on the root; combined: amortized O(a(n)), a(10^9)<4<br>`+
    `<b>Percolation</b>: p_c≈0.593 (square site lattice); union-find counts clusters and detects spanning`);
  buildSteps();updateStats();
}

/* ---- 统计 ---- */
function updateStats(){
  let blocks=0,maxD=0;
  for(let i=0;i<N;i++)if(open[i]){blocks++;const d=rawDepth(i);if(d>maxD)maxD=d;}
  blocks=0;const seen=new Set();
  for(let i=0;i<N;i++)if(open[i]){const r=rootCache[i];if(!seen.has(r)){seen.add(r);blocks++;}}
  document.getElementById('stBlocks').textContent=blocks;
  document.getElementById('stDepth').textContent=maxD;
  document.getElementById('stHops').innerHTML=lastHops<0?'—':lastHops+'<small> 跳</small>';
  const anyOpen=[...open].some(v=>v);
  const per=anyOpen?percolates():null;
  const el=document.getElementById('stPerc');
  el.textContent=per===null?'—':(per?L('贯通','spanning'):L('未通','no'));
  el.className='v'+(per===null?'':(per?' ok':' bad'));
}

/* ---- UI ---- */
function syncToggles(){
  document.getElementById('tglRank').checked=rankOn;
  document.getElementById('tglPC').checked=pcOn;
}
document.getElementById('btnUnion').addEventListener('click',()=>{
  let n=0;for(let k=0;k<10;k++)if(randomUnion())n++;
  recolorSites();
  notify(n?`执行了 ${n} 次 union`:'没有可合并的相邻分量了',n?`${n} unions performed`:'no adjacent components left to merge',2.4);
});
document.getElementById('btnFind').addEventListener('click',demoFind);
document.getElementById('btnFlow').addEventListener('click',()=>{
  flow(+document.getElementById('sP').value/100);
  notify(`重新渗流:${percolates()?'上下贯通':'未贯通'}`,`re-percolated: ${percolates()?'spanning':'not spanning'}`,2.6);
});
document.getElementById('btnReset').addEventListener('click',()=>{flow(0);notify('森林已清空','forest cleared',2.0);});
document.getElementById('sP').addEventListener('input',e=>{
  document.getElementById('sPVal').textContent=(+e.target.value/100).toFixed(2);});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/60;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';});
document.getElementById('tglRank').addEventListener('change',e=>{rankOn=e.target.checked;});
document.getElementById('tglPC').addEventListener('change',e=>{pcOn=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(notifyT>0)notifyT-=dt;
  if(playing){
    autoT+=dt*speedK;
    if(firstDemoT>0){firstDemoT-=dt;if(firstDemoT<=0)demoFind();}
    if(autoT>0.55){autoT=0;
      if(randomUnion()){unionCount++;recolorSites();
        if(unionCount%4===0)demoFind();}
    }
    /* find 脉冲沿弧移动 */
    if(pulse.active){
      pulse.u+=dt*speedK*3.0;
      while(pulse.active&&pulse.u>=1){
        pulse.u-=1;pulse.seg++;
        if(pulse.seg>=pulse.path.length-1){pulseArrive();break;}
        bump[pulse.path[pulse.seg]]=1;
      }
      if(pulse.active){
        const a=pos[pulse.path[pulse.seg]],b=pos[pulse.path[pulse.seg+1]];
        const t=pulse.u;
        pulseMesh.position.lerpVectors(a,b,t);
        pulseMesh.position.y+=Math.sin(t*Math.PI)*0.22;
      }
    }
  }
  /* 弧与节点的动态 */
  let dyn=false;
  for(let i=0;i<N;i++){
    if(bump[i]>0){bump[i]=Math.max(0,bump[i]-dt*3);dyn=true;}
    if(arcFlash[i]>0){arcFlash[i]=Math.max(0,arcFlash[i]-dt*1.3);dyn=true;}
    const an=arcAnim[i];
    if(an){an.t+=dt*2.6;dyn=true;if(an.t>=1)arcAnim[i]=null;}
  }
  writeSiteMatrices();
  if(dyn||arcDirty)rebuildArcs();
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    const txt=r.text();
    r.o.visible=labelsOn&&r.vis()&&txt!=='';
    if(r.o.visible)r.o.element.textContent=txt;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
applyTheme();
buildSteps();
applyLang();
syncToggles();
document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
document.getElementById('sSpd').value=clamp(Math.round(speedK*60),20,150);
if(!playing)document.getElementById('play').textContent=L('运行','Run');
flow(0.62);
updateStats();
start();
</script>
