  <div class="sub" data-zh="混凝土不是晒干而是水化:水是反应物,硅酸盐水泥 C₃S + H₂O → C-S-H 凝胶 + Ca(OH)₂,针状凝胶从颗粒表面长出互相搭接成网,把砂石粘死→强度按 1 天 ~30% · 3 天 ~50% · 7 天 ~65% · 28 天 100% 的节奏爬坡,数年后到 ~120%→水灰比越低越强(0.35 vs 0.6 差一倍)却越难施工;水化放热让大体积中心冲到 60–80 °C,大坝要预埋冷却水管→混凝土抗压 ~30 MPa 搭钢筋抗拉 ~400 MPa,两者热膨胀系数几乎相同(α≈1.0–1.2×10⁻⁵/K)所以不开裂,pH≈13 的碱性又给钢筋镀上钝化膜——碳化与失水是两大杀手:不养护,强度大打折扣 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Concrete does not dry — it hydrates: water is a reactant, C₃S + H₂O → C-S-H gel + Ca(OH)₂; needle-like gel grows from particle surfaces and interlocks into a network that glues the aggregate → strength climbs ~30% at 1 d, ~50% at 3 d, ~65% at 7 d, 100% at 28 d, toward ~120% over years → lower w/c is stronger (0.35 vs 0.6 doubles strength) but harder to place; hydration heat drives mass-pour cores to 60–80 °C, so dams bury cooling pipes → concrete takes ~30 MPa in compression with steel at ~400 MPa in tension, their thermal expansion coefficients nearly equal (α≈1.0–1.2×10⁻⁵/K) so they do not crack apart, and pH≈13 alkalinity passivates the steel — carbonation and water loss are the two killers: skip curing and strength collapses · 3D interactive demo · drag to orbit · Space = run/pause">水泥与混凝土 · 会「石头化」的化学反应</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 14, 52);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('水泥与混凝土 · 会「石头化」的化学反应', 'Concrete · Chemistry That Turns to Stone');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 120);
camera.position.set(4.6, 3.4, 9.6);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(-0.6, 0.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 40;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);

/* 强度基准(28 天 = 100%):1d 30 · 3d 50 · 7d 65 · 28d 100 · 90d ~112 → 渐近 120 */
const AGES = [0.04, 1, 3, 7, 28, 90, 400], BASE = [0, 30, 50, 65, 100, 112, 120];
function baseCurve(t) {
  if (t <= 0) return 0;
  for (let i = 1; i < AGES.length; i++) {
    if (t <= AGES[i]) {
      const u = (Math.log(t) - Math.log(AGES[i - 1])) / (Math.log(AGES[i]) - Math.log(AGES[i - 1]));
      return lerp(BASE[i - 1], BASE[i], clamp(u, 0, 1));
    }
  }
  return 120;
}
function wcf() { return Math.pow(0.45 / wc, 1.31); }
function computePhysics() {
  const tEff = !cured ? Math.min(age, Math.max(tExp, 0.3)) + 0.08 * Math.max(0, age - tExp)
    : (steam ? Math.min(age, 3) * 1.9 + Math.max(0, age - 3) : age);
  alphaNow = baseCurve(tEff) / 120;
  fNow = 30 * baseCurve(tEff) / 100 * wcf() * (1 - 0.45 * crackMax);
  const lw = Math.log(Math.max(tEff, 0.25) / 1.8);
  tNow = 25 + (wc / 0.45) * 52 * Math.exp(-lw * lw / 1.4);
  if (!cured) tNow = 25 + (tNow - 25) * clamp(alphaNow / Math.max(alphaExp, 0.05), 0, 1);
  crackMax = Math.max(crackMax, !cured ? clamp((age - 0.8) / 2, 0, 1) : 0);
}

  for (const f of [0, 15, 30, 45]) {
    ctx.beginPath(); ctx.moveTo(padL, yOf(f)); ctx.lineTo(W - padR, yOf(f)); ctx.stroke();
    ctx.fillText(String(f), padL - 30, yOf(f) + 5);
  }
  ctx.fillText('MPa', 6, padT + 12);
  const curve = (w, col, lw) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath();
    for (let i = 0; i <= 80; i++) {
      const t = i / 80 * 90;
      const f = 30 * baseCurve(t) / 100 * Math.pow(0.45 / w, 1.31);
      const x = xOf(t), y = yOf(f);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  };
  curve(0.35, '#4dabf7', 2.4);
  curve(0.6, '#ffa94d', 2.4);
  /* 实测基准点(28 天 100% 曲线) */
  ctx.fillStyle = 'rgba(200,220,240,.9)';
  for (const [t, b] of [[1, 9], [3, 15], [7, 19.5], [28, 30], [90, 33.6]]) {
    ctx.beginPath(); ctx.arc(xOf(t), yOf(b), 3.5, 0, 7); ctx.fill();
  }
  const xd = xOf(age), yd = yOf(fNow);
  ctx.strokeStyle = 'rgba(200,220,240,.5)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(xd, H - padB); ctx.lineTo(xd, yd); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = crackMax > 0.25 ? '#ff6b6b' : '#7bd88f';
  ctx.beginPath(); ctx.arc(xd, yd, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#4dabf7';
  ctx.fillText('w/c 0.35', padL + 6, padT + 14);
  ctx.fillStyle = '#ffa94d';
  ctx.fillText('w/c 0.6', padL + 92, padT + 14);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elWC = document.getElementById('sWC'), elWCVal = document.getElementById('sWCVal');
const elAge = document.getElementById('sAge'), elAgeVal = document.getElementById('sAgeVal');
const stF = document.getElementById('stF'), stA = document.getElementById('stA'), stT = document.getElementById('stT'),
  stAge = document.getElementById('stAge'), stSt = document.getElementById('stSt');
const formulaEl = document.getElementById('formula');
const btnCure = document.getElementById('btnCure'), btnRebar = document.getElementById('btnRebar'),
  btnCrush = document.getElementById('btnCrush'), btnSteam = document.getElementById('btnSteam');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elWC.value = wc; elWCVal.textContent = wc.toFixed(2);
  elAge.value = age; elAgeVal.textContent = age.toFixed(1) + L(' 天', ' d');
}
function syncBtns() {
  btnCure.classList.toggle('on', cured);
  btnCure.textContent = cured ? L('养护:保水', 'Curing: wet') : L('养护:裸露', 'Curing: exposed');
  btnRebar.classList.toggle('on', rebarOn);
  btnRebar.textContent = rebarOn ? L('钢筋:开', 'Rebar: ON') : L('钢筋:关', 'Rebar: OFF');
  btnSteam.classList.toggle('on', steam);
  btnSteam.textContent = steam ? L('蒸汽养护:开', 'Steam curing: ON') : L('蒸汽养护:关', 'Steam curing: OFF');
}
function stateText() {
  if (crackMax > 0.25) return L('开裂', 'cracked');
  return age < 0.8 ? L('塑形', 'plastic') : L('硬化', 'hardening');
}
function updateStats() {
  stF.textContent = fNow.toFixed(1) + ' MPa';
  stF.className = 'v ' + (crackMax > 0.25 ? 'bad' : fNow > 20 ? 'ok' : fNow > 8 ? 'warn' : 'bad');
  stA.textContent = Math.round(alphaNow * 100) + ' %';
  stA.className = 'v ' + (alphaNow > 0.8 ? 'ok' : alphaNow > 0.4 ? 'warn' : '');
  stT.textContent = tNow.toFixed(0) + ' °C';
  stT.className = 'v ' + (tNow > 60 ? 'bad' : tNow > 40 ? 'warn' : '');
  stAge.textContent = age.toFixed(1) + L(' 天', ' d');
  stSt.textContent = stateText();
  stSt.className = 'v ' + (crackMax > 0.25 ? 'bad' : age < 0.8 ? 'warn' : 'ok');
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>水化:C₃S + H₂O → C-S-H 凝胶 + Ca(OH)₂</b>(溶解-沉淀,水是反应物)<br>` +
    `<b>强度基准:1d 30% · 3d 50% · 7d 65% · 28d 100% · 数年 ~120%</b>(28 天为准)<br>` +
    `<b>Abram:f ∝ (0.45/(w/c))^1.31</b> — 0.35 vs 0.6 差一倍;水化热中心 60–80 °C<br>` +
    `<b>搭配:混凝土压 ~30 MPa / 钢筋拉 ~400 MPa;α≈1.0–1.2×10⁻⁵/K;pH≈13 钝化</b><br>` +
    `<b>当前:f = ${fNow.toFixed(1)} MPa,α = ${Math.round(alphaNow * 100)}%,T = ${tNow.toFixed(0)} °C</b>${crackMax > 0.25 ? ' → 已开裂!' : ''}`,
    `<b>Hydration: C₃S + H₂O → C-S-H gel + Ca(OH)₂</b> (dissolve-precipitate; water is a reactant)<br>` +
    `<b>Strength base: 1d 30% · 3d 50% · 7d 65% · 28d 100% · years ~120%</b> (28-day basis)<br>` +
    `<b>Abram: f ∝ (0.45/(w/c))^1.31</b> — 0.35 vs 0.6 doubles strength; hydration heat 60–80 °C in the core<br>` +
    `<b>Pairing: concrete ~30 MPa / steel ~400 MPa; α≈1.0–1.2×10⁻⁵/K; pH≈13 passivation</b><br>` +
    `<b>Now: f = ${fNow.toFixed(1)} MPa, α = ${Math.round(alphaNow * 100)}%, T = ${tNow.toFixed(0)} °C</b>${crackMax > 0.25 ? ' → cracked!' : ''}`);
}
function syncAll() {
  computePhysics();
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elWC.addEventListener('input', () => { wc = +elWC.value; computePhysics(); syncSliders(); updateStats(); updateFormula(); drawPlot(); });
elAge.addEventListener('input', () => { age = +elAge.value; computePhysics(); syncSliders(); updateStats(); updateFormula(); drawPlot(); });
btnCure.addEventListener('click', () => {
  cured = !cured;
  if (!cured) { alphaExp = alphaNow; tExp = age; }
  computePhysics(); syncAll();
  notifyT = 2.6;
  notifyZ = cured ? '恢复保水:水化重启,但裂缝不可愈合——强度上限已被罚没' : '切到裸露:表面失水,水化中止,塑性收缩开裂开始';
  notifyE = cured ? 'water restored: hydration resumes, but cracks never heal — the strength ceiling stays fined' : 'exposed: the surface dries, hydration halts, plastic shrinkage cracking begins';
});
btnRebar.addEventListener('click', () => { rebarOn = !rebarOn; rebar.visible = rebarOn; syncBtns(); });
btnSteam.addEventListener('click', () => { steam = !steam; computePhysics(); syncAll(); });
btnCrush.addEventListener('click', () => {
  if (crushPh >= 0 && crushPh < 5) return;
  crushPh = 0; broken1 = false; broken28 = false;
  fragMesh.visible = false;
  computePhysics();
  notifyT = 3.5;
  notifyZ = '拆模测试:同载荷压 1 天与 28 天试块——龄期就是强度';
  notifyE = 'formwork test: the same load on 1-day and 28-day cubes — age is strength';
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglWater').addEventListener('change', e => { waterOn = e.target.checked; watMesh.visible = waterOn; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
if (!waterOn) { document.getElementById('tglWater').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null, lastAlpha = -1;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    age = Math.min(90, age + dt * 2.5);
    computePhysics();
  }
  /* 颗粒/骨料/针晶 */
  if (Math.abs(alphaNow - lastAlpha) > 0.0008) {
    writeCement(alphaNow);
    writeCsh(alphaNow);
    lastAlpha = alphaNow;
  }
  writeWater(dt);
  watMesh.material.opacity = 0.9 * clamp(1 - alphaNow, 0.05, 1) * (cured ? 1 : 0.5);
  /* 热核 */
  const hf = clamp((tNow - 25) / 55, 0, 1);
  heatM.opacity = 0.22 * hf;
  heatM.color.setHSL(lerp(0.02, 0.6, clamp(1 - hf * 1.4, 0, 1)), 0.9, 0.55);
  heatLight.intensity = 4 * hf;
  /* 裂缝 */
  crackM.opacity = 0.95 * crackMax;
  crackLines.visible = crackMax > 0.02;
  /* 拆模测试动画 */
  if (crushPh >= 0) {
    crushPh += dt0 * 0.9;
    const f1 = 30 * 0.3 * wcf() * (1 - 0.45 * crackMax);
    const f28 = 30 * wcf() * (1 - 0.45 * crackMax);
    let press = 0;
    if (crushPh < 1) topP.position.y = lerp(1.1, -0.62, ease(clamp(crushPh, 0, 1)));
    else if (crushPh < 2.6) {
      press = 36 * ease(clamp((crushPh - 1) / 1.6, 0, 1));
      topP.position.y = -0.62 - 0.05 * (press / 36);
      if (!broken1 && press > Math.max(f1, 1.5)) {
        broken1 = true;
        fragMesh.visible = true;
        cube1.visible = false;
        fragSeeds.forEach(s => { s.p.set(-0.68, -1.1, 0); s.v.set((Math.random() - 0.5) * 3, 1 + Math.random() * 2.5, (Math.random() - 0.5) * 3); });
        notifyT = 2.5; notifyZ = `1 天试块在 ~${press.toFixed(0)} MPa 当场压碎(它只有 ${f1.toFixed(0)} MPa)`; notifyE = `the 1-day cube shatters at ~${press.toFixed(0)} MPa (it only has ${f1.toFixed(0)})`;
      }
      if (!broken28 && press > Math.max(f28, 1.5)) { broken28 = true; cube28.visible = false; }
    } else if (crushPh < 4.2) {
      topP.position.y = lerp(topP.position.y, 1.1, dt0 * 3);
      fragSeeds.forEach(s => {
        s.v.y -= 6 * dt0;
        s.p.addScaledVector(s.v, dt0);
        if (s.p.y < -1.62) { s.p.y = -1.62; s.v.y *= -0.3; s.v.x *= 0.8; }
      });
    } else if (crushPh >= 5) {
      crushPh = -1;
      topP.position.y = 1.1;
      cube1.visible = cube28.visible = true;
      fragMesh.visible = false;
    }
    if (fragMesh.visible) {
      fragSeeds.forEach((s, i) => {
        _E.set(s.r + s.p.y * 3, s.r * 2, s.r);
        _Q.setFromEuler(_E);
        _M4.compose(_V.copy(s.p), _Q, _S.setScalar(1));
        fragMesh.setMatrixAt(i, _M4);
      });
      fragMesh.instanceMatrix.needsUpdate = true;
    }
  }
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.06) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
writeCement(alphaNow);
writeCsh(alphaNow);
writeWater(0);
rebar.visible = rebarOn;
watMesh.visible = waterOn;
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
