<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氢脆 · 延迟几天才断的螺栓</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#b3873e;
    --bg:#0f1216; --panel:rgba(13,17,23,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,23,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,23,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#8f6a25;
    --bg:#eff1f4; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.e { border-color: rgba(255,205,112,.9); color: #ffe2ae; }
  .lbl.w { border-color: rgba(255,224,102,.9); color: #ffe9a8; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.e { border-color: rgba(143,106,37,.9); color: #8a5f12; }
  :root[data-theme="light"] .lbl.w { border-color: rgba(212,167,16,.9); color: #8a6d00; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(11,122,90,.9); color: #0b7a5a; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(30,120,200,.9); color: #1864ab; }
  :root[data-theme="light"] .lbl.bad { border-color: rgba(224,49,49,.9); color: #c92a2a; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 8px 12px 7px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.b { color:#1864ab; } :root[data-theme="light"] .chip.r { color:#c92a2a; }
  #actions { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 4px 7px; font-size: 11.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(179,135,62,.65); background: rgba(179,135,62,.14); color: var(--text); }
  .abtn.hot { border-color: rgba(255,107,107,.6); color: #ffa8a8; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(143,106,37,.55); background: rgba(143,106,37,.10); }
  :root[data-theme="light"] .abtn.hot { color:#c92a2a; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 15px; }
  #scope { width: 100%; height: 60px; display: block; margin-top: 4px; border-radius: 8px;
    background: rgba(127,140,160,.10); border: 1px solid var(--panel-border); }
  #formula { margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 4px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 3px; }
  #steps li { display: flex; gap: 6px; padding: 3px 5px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(179,135,62,.10); border-color: rgba(179,135,62,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(143,106,37,.08); border-color: rgba(143,106,37,.4); }
  #steps .n { flex: 0 0 15px; height: 15px; border-radius: 50%; font-size: 10.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 11px; color: var(--text3); line-height: 1.35; }
  #steps .t b { color: var(--text); font-size: 11px; }
  #steps li.on .t b { color: #e8c98f; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center;
    margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  .crow { display: flex; align-items: center; gap: 8px; }
  .crow .ck { font-size: 11.5px; color: var(--text2); flex: 0 0 34px; }
  .crow .cv { font-size: 10.5px; color: var(--text3); flex: 0 0 96px; text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 11.5px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11px; color: var(--text2); }
  #rel a { font-size: 11px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 2px 8px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="氢脆:延迟几天才断的螺栓" data-en="Hydrogen Embrittlement: The Bolt that Snaps Days Later">氢脆:延迟几天才断的螺栓</h1>
  <div class="sub" data-zh="高强钢(>1,000 MPa 级)在酸洗/电镀/阴极保护/含 H₂S 油气环境中吸氢;氢原子极小,室温扩散系数 ~10⁻⁹ cm²/s 量级,借晶界与陷阱的快速通道几天就能布满螺栓。氢聚到应力集中处,或促进局部塑性(HELP)或削弱键合(HEDE),韧窝断口变成脆性解理/沿晶——延伸率塌掉一半以上;静载荷下裂纹缓慢扩展,数小时到数年突然断裂。对策:镀后烘烤 190-210 °C × 4-24 h · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="High-strength steel (>1,000 MPa class) absorbs hydrogen during pickling, plating, cathodic protection or H₂S service. Tiny H atoms diffuse at ~10⁻⁹ cm²/s at room temperature and, helped by grain-boundary fast paths, saturate a bolt within days. At stress concentrators hydrogen either localizes plasticity (HELP) or weakens bonds (HEDE): the dimple ductile fracture turns brittle cleavage/intergranular, elongation collapses by more than half; under static load a crack creeps for hours to years, then snaps. Fix: bake 190-210 °C for 4-24 h after plating · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">氢脆:延迟几天才断的螺栓</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="抗拉强度" data-en="tensile strength">抗拉强度</span><span class="v" id="stA">—</span>
  <span class="k" data-zh="延伸率(充氢后)" data-en="elongation (charged)">延伸率(充氢后)</span><span class="v" id="stB">—</span>
  <span class="k" data-zh="可扩散氢含量" data-en="diffusible H">可扩散氢含量</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="扩散深度 √(2Dt)" data-en="diffusion depth √(2Dt)">扩散深度 √(2Dt)</span><span class="v" id="stD">—</span>
  <span class="k" data-zh="裂纹长度" data-en="crack length">裂纹长度</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="试验状态" data-en="test state">试验状态</span><span class="v" id="stF">—</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip g" data-zh="左:无氢对照(韧断)" data-en="left: H-free (ductile)">左:无氢对照(韧断)</span>
    <span class="chip r" data-zh="右:充氢试样(脆断)" data-en="right: H-charged (brittle)">右:充氢试样(脆断)</span>
    <span class="chip b" data-zh="氢原子(青色小点)" data-en="H atoms (cyan dots)">氢原子(青色小点)</span>
    <span class="chip o" data-zh="烘烤脱氢加热" data-en="bake-out heat">烘烤脱氢加热</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnTest" data-zh="对照拉伸(招牌)" data-en="tensile duel (signature)">对照拉伸(招牌)</button>
    <button class="abtn" id="btnDelayed" data-zh="静载延迟断裂" data-en="static-load delay">静载延迟断裂</button>
    <button class="abtn" id="btnBake" data-zh="镀后烘烤脱氢" data-en="bake-out after plating">镀后烘烤脱氢</button>
    <button class="abtn hot" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="充氢时间" data-en="charging time">充氢时间</label><input id="tH" type="range" min="0" max="48" step="1" value="24"><span class="val" id="tHVal">24 h</span></div>
  <canvas id="scope"></canvas>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="ctrlRows">
      <div class="crow"><span class="ck" data-zh="步骤" data-en="Step">步骤</span><input id="phase" type="range" min="0" max="1000" value="0"><span class="cv" id="phaseVal">—</span></div>
      <div class="crow"><span class="ck" data-zh="速度" data-en="Speed">速度</span><input id="speed" type="range" min="2" max="30" value="10"><span class="cv" id="speedVal">1.0×</span></div>
      <div id="toggles">
        <label><input id="tglCurve" type="checkbox" checked> <span data-zh="σ-ε 曲线" data-en="σ-ε curves">σ-ε 曲线</span></label>
        <label><input id="tglH" type="checkbox" checked> <span data-zh="氢原子" data-en="H atoms">氢原子</span></label>
        <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
        <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
      </div>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../stress-strain/" data-zh="应力应变曲线" data-en="stress-strain curve">应力应变曲线</a>
    <a href="../quench-hardening/" data-zh="淬火硬化" data-en="quench hardening">淬火硬化</a>
    <a href="../corrosion/" data-zh="腐蚀" data-en="corrosion">腐蚀</a>
    <a href="../bolt-preload/" data-zh="螺栓预紧" data-en="bolt preload">螺栓预紧</a>
    <a href="../sacrificial-anode/" data-zh="牺牲阳极" data-en="sacrificial anode">牺牲阳极</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = x => clamp(x, 0, 1);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0f1216 : 0xeff1f4);
  M.ground.color.set(dark ? 0x171b21 : 0xd8dee5);
  M.grid.color.set(dark ? 0x2c3540 : 0xa9b6c2);
  M.frame.color.set(dark ? 0x39424e : 0x5d6874);         // 试验机框架
  M.steelN.color.set(dark ? 0x9fb0c3 : 0x8494a6);        // 左试样(无氢)
  M.steelH.color.set(dark ? 0xb0a08c : 0x96897a);        // 右试样(充氢,暖灰)
  M.dull.color.set(dark ? 0x6a7280 : 0x5a6270);          // 韧断灰暗断口
  M.bright.color.set(dark ? 0xdfe6ee : 0xc8d2dc);        // 脆断亮晶断口
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('body *').forEach(el => {
    if (el.dataset && el.dataset.zh !== undefined) el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('氢脆 · 延迟几天才断的螺栓', 'Hydrogen Embrittlement · The Bolt that Snaps Days Later');
  buildSteps();
  setPlayLabel();
  markStep();
  syncPhase();
  updateTH();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

/* ---------------- 试样(上夹头组可上移;断口盘隐藏待揭) ---------------- */
function makeSpecimen(x0, isH) {
  const g = new THREE.Group();
  g.position.x = x0;
  scene.add(g);
  const steel = isH ? M.steelH : M.steelN;
  /* 下夹头组(固定) */
  const gripB = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.015, 0.035, 14), M.frame);
  gripB.position.y = 0.055;
  g.add(gripB);
  const shaftB = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.022, 10), steel);
  shaftB.position.y = 0.082;
  g.add(shaftB);
  const gauB = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.011, 12), steel);
  gauB.position.y = (GY0 + GY1) / 2 - 0.0045;
  g.add(gauB);
  const discB = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.0022, 12), isH ? M.bright : M.dull);
  discB.position.y = (GY0 + GY1) / 2;
  discB.visible = false;
  g.add(discB);
  /* 上夹头组(随载荷上移) */
  const upper = new THREE.Group();
  g.add(upper);
  const gauT = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.011, 12), steel);
  gauT.position.y = (GY0 + GY1) / 2 + 0.0045;
  upper.add(gauT);
  const discT = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.0022, 12), isH ? M.bright : M.dull);
  discT.position.y = (GY0 + GY1) / 2;
  discT.visible = false;
  upper.add(discT);
  const shaftT = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.05, 10), steel);
  shaftT.position.y = 0.142;
  upper.add(shaftT);
  const gripT = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.013, 0.03, 14), M.frame);
  gripT.position.y = 0.172;
  upper.add(gripT);
  /* 螺纹示意:上下柄部刻环 */
  for (let k = 0; k < 3; k++) {
    const ringB = new THREE.Mesh(new THREE.TorusGeometry(0.0075, 0.0012, 6, 18), steel);
    ringB.rotation.x = Math.PI / 2;
    ringB.position.y = 0.073 - k * 0.0035;
    g.add(ringB);
    const ringT = ringB.clone();
    ringT.position.y = 0.125 + k * 0.0035;
    upper.add(ringT);
  }
  /* 延迟断裂裂纹(右样专用) */
  const crack = new THREE.Mesh(new THREE.BoxGeometry(0.0132, 0.0016, 0.0132), M.crackM);
  crack.position.y = (GY0 + GY1) / 2 + 0.002;
  crack.visible = false;
  g.add(crack);
  return { g, upper, gauB, gauT, discB, discT, crack, isH };
}

/* ---------------- σ-ε 曲线(示波器:双试样对比) ---------------- */
const scope = document.getElementById('scope');
const scopeCtx = scope.getContext('2d');
function sizeScope() {
  const dpr = Math.min(devicePixelRatio, 2);
  scope.width = Math.max(10, scope.clientWidth * dpr);
  scope.height = 60 * dpr;
}
function drawScope() {
  const cw = scope.width, ch = scope.height, dpr = Math.min(devicePixelRatio, 2);
  scopeCtx.clearRect(0, 0, cw, ch);
  scopeCtx.font = `${Math.round(9 * dpr)}px system-ui`;
  scopeCtx.fillStyle = 'rgba(150,160,175,.9)';
  scopeCtx.fillText(L('σ-ε:绿=无氢 红=充氢', 'σ-ε: green=H-free, red=charged'), 4 * dpr, 11 * dpr);
  scopeCtx.fillStyle = 'rgba(150,160,175,.55)';
  scopeCtx.fillText('ε→', cw - 22 * dpr, ch - 4 * dpr);
  if (hist.length < 2) return;
  const draw = (ki, ks, color) => {
    scopeCtx.strokeStyle = color;
    scopeCtx.lineWidth = Math.max(1.3, 1.3 * dpr);
    scopeCtx.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const x = clamp01(hist[i][ki] / 0.14) * cw;
      const y = ch - (0.06 + 0.88 * clamp01(hist[i][ks] / 1150)) * ch;
      i === 0 ? scopeCtx.moveTo(x, y) : scopeCtx.lineTo(x, y);
    }
    scopeCtx.stroke();
  };
  draw(0, 1, 'rgba(123,216,143,.95)');
  draw(2, 3, 'rgba(255,107,107,.95)');
}

}
function updateTH() {
  tH = +elTH.value;
  elTHVal.textContent = tH + ' h';
  if (baked) { baked = false; bakeT = 0; }     // 重新充氢:烘烤状态失效
  updateFormula();
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elPhase.addEventListener('input', () => {
  activateStep(Math.round(parseInt(elPhase.value, 10) / 1000 * (STEPS.length - 1)));
});
elSpeed.addEventListener('input', () => { speed = (+elSpeed.value) / 10; elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elTH.addEventListener('input', updateTH);
tglCurve.addEventListener('change', () => { scope.style.display = tglCurve.checked ? 'block' : 'none'; if (tglCurve.checked) sizeScope(); });
tglH.addEventListener('change', () => { hPts.visible = tglH.checked; });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { labelsOn = false; tglLabels.checked = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  sizeScope();
});

/* ---------------- stats 刷新 ---------------- */
const stA = document.getElementById('stA'), stB = document.getElementById('stB'),
  stC = document.getElementById('stC'), stD = document.getElementById('stD'),
  stE = document.getElementById('stE'), stF = document.getElementById('stF');
function updateStats() {
  stA.innerHTML = '1050<small> MPa</small>';
  stA.className = 'v ok';
  const eh = elongOf(tHeff());
  stB.innerHTML = eh.toFixed(1) + '<small> %</small>';
  stB.className = 'v ' + (eh >= 10 ? 'ok' : eh >= 6 ? 'warn' : 'bad');
  stC.innerHTML = cHOf(tHeff()).toFixed(1) + '<small> wppm</small>';
  stC.className = 'v ' + (cHOf(tHeff()) < 2 ? 'ok' : cHOf(tHeff()) < 5 ? 'warn' : 'bad');
  stD.innerHTML = depthMm(tHeff()).toFixed(2) + '<small> mm</small>';
  stD.className = 'v ok';
  stE.innerHTML = (crackF * 6).toFixed(1) + '<small> mm</small>';
  stE.className = 'v ' + (crackF > 0.6 ? 'bad' : crackF > 0.2 ? 'warn' : 'ok');
  const stateTxt = bakeT > 0 && bakeT < 1 ? L('烘烤中', 'baking') : fracH ? L('已脆断', 'snapped') : mode === 'delayed' ? L('裂纹扩展中', 'crack creeping') : mode === 'test' ? L('对拉中', 'pulling') : L('待机', 'idle');
  stF.innerHTML = '<small>' + stateTxt + '</small>';
  stF.className = 'v ok';
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let rafOn = false, lastStatsT = 0;
function frame() {
  const dt = clamp(clock.getDelta(), 0, 0.05);
  et += dt;
  const dts = playing ? dt * speed : 0;
  const eh = elongOf(tHeff());
  const fracAtH = 0.82 * eh / 12;            // 充氢样断裂时刻(按延伸率折算)
  if (mode === 'test' && playing) {
    tTest = Math.min(1, tTest + dts / 9);
    /* 无氢样:0.82 断,颈缩 0.55 起 */
    if (!fracN) {
      epsN = 0.12 * Math.min(1, tTest / 0.82);
      sigN = 1050 * Math.min(1, tTest / 0.5);
      dN = 0.016 * Math.min(1, tTest / 0.82);
      neckN = 1 - 0.45 * clamp01((tTest - 0.55) / 0.27);
      if (tTest >= 0.82) { fracN = true; }
    } else {
      sigN = Math.max(0, sigN - dts * 6000);
      gapN = Math.min(0.012, gapN + dts * 0.012);
    }
    /* 充氢样:按延伸率提前脆断,几乎无颈缩 */
    if (!fracH) {
      epsH = 0.12 * Math.min(1, tTest / 0.82);
      sigH = 1050 * Math.min(1, tTest / 0.5);
      dH = 0.006 * Math.min(1, tTest / 0.82);
      neckH = 1 - 0.08 * clamp01((tTest - 0.55) / 0.27);
      if (tTest >= fracAtH) { fracH = true; }
    } else {
      sigH = Math.max(0, sigH - dts * 60000);   // 「啪」:瞬时卸载
      gapH = Math.min(0.009, gapH + dts * 0.05);
    }
  } else if (mode === 'delayed' && playing) {
    const tE = tHeff();
    if (tE >= 1) {
      /* 只有充氢试样才会延迟断裂:无氢时静载再久也不裂 */
      tDelay = Math.min(1, tDelay + dts / 12);
      dN = 0.004; dH = 0.004;
      sigN = sigH = 735;                      // ~70% UTS 静载
      epsN = epsH = 0.004;
      crackF = clamp01((tDelay - 0.15) / 0.8);
      if (tDelay >= 1 && !fracH) {
        fracH = true;
        specH.discB.visible = specH.discT.visible = true;
        sigH = 0; gapH = 0.01;
      }
    } else {
      dN = 0.004; dH = 0.004;
      sigN = sigH = 735;
      epsN = epsH = 0.004;
      crackF = 0;
    }
  }
  /* 烘烤 */
  if (bakeT > 0 && bakeT < 1 && playing) bakeT = Math.min(1, bakeT + dts / 5);
  if (bakeT >= 1) baked = true;
  /* 应用位移 / 颈缩 / 断口 */
  specN.upper.position.y = dN + gapN;
  specH.upper.position.y = dH + gapH;
  specN.gauT.scale.set(neckN, 1, neckN);
  specN.gauB.scale.set(neckN, 1, neckN);
  specH.gauT.scale.set(neckH, 1, neckH);
  specH.gauB.scale.set(neckH, 1, neckH);
  specN.discB.visible = specN.discT.visible = fracN;
  if (fracH) specH.discB.visible = specH.discT.visible = true;
  specH.crack.visible = mode === 'delayed' && crackF > 0.01 && !fracH;
  specH.crack.scale.x = Math.max(0.02, crackF);
  /* 烘烤热辉 */
  const heat = bakeT > 0 && bakeT < 1 ? 0.5 + 0.5 * Math.sin(et * 8) : 0;
  specH.gauT.material.emissiveIntensity = 0.05;
  specN.gauT.material.emissive.setHex(heat > 0 ? 0xff6622 : 0x9fb0c3);
  specN.gauT.material.emissiveIntensity = heat * 0.5;
  specH.gauT.material.emissive.setHex(heat > 0 ? 0xff6622 : 0xb0a08c);
  specH.gauT.material.emissiveIntensity = heat * 0.5;
  /* 氢原子随机游走 */
  const tE = tHeff();
  const depthF = tE <= 0.2 ? 0 : clamp(0.18 + 0.82 * Math.sqrt(tE / 48), 0, 0.92);
  for (let i = 0; i < NP; i++) {
    const target = tE <= 0.2 ? 1.25 : 1 - depthF * rndH[i];
    uH[i] += (target - uH[i]) * Math.min(1, dt * 1.2) + (Math.random() - 0.5) * 0.004;
    if (uH[i] > 1.02) { pH[i * 3 + 1] = -999; continue; }
    const th = thH[i] + Math.sin(et * 0.7 + i) * 0.05;
    const r = 0.0062 * clamp(uH[i], 0.05, 1);
    pH[i * 3] = XH + r * Math.cos(th);
    pH[i * 3 + 1] = (GY0 + GY1) / 2 + zH[i];
    pH[i * 3 + 2] = r * Math.sin(th);
  }
  hGeo.attributes.position.needsUpdate = true;
  /* 步骤高亮 */
  const hlK = 0.45 + 0.25 * Math.sin(et * 5);
  const hl = STEPS[scenario].hl;
  for (const m of [M.steelN, M.steelH, M.dull, M.bright, M.frame]) m.emissiveIntensity = Math.min(m.emissiveIntensity, 0.25);
  const boost = m => { m.emissiveIntensity = 0.5 + 0.3 * hlK; };
  if (hl === 'source') { boost(M.steelH); boost(M.frame); }
  else if (hl === 'trap') { boost(M.steelH); boost(M.crackM); }
  else if (hl === 'test') { boost(M.steelN); boost(M.steelH); }
  else if (hl === 'delay') { boost(M.steelH); boost(M.crackM); }
  else if (hl === 'bake') { boost(M.steelH); boost(M.frame); }
  else if (hl === 'design') { boost(M.steelN); boost(M.frame); }
  /* 波形历史 */
  if (playing && (mode === 'test' || mode === 'delayed')) {
    hist.push([epsN, sigN, epsH, sigH]);
    if (hist.length > 240) hist.shift();
  }
  /* 相机目标 */
  tmpV.fromArray(STEPS[scenario].tgt);
  controls.target.lerp(tmpV, 0.04);
  /* 标签 */
  for (const r of labelReg) {
    if (r.follow) r.follow(r.o.position);
    r.o.element.textContent = r.text();
    r.o.element.className = 'lbl ' + (r.cls ? r.cls() : '');
  }
  if (tglCurve.checked) drawScope();
  const now = performance.now();
  if (now - lastStatsT > 150) {
    lastStatsT = now;
    updateStats();
    updateFormula();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function schedule() { if (!rafOn && !document.hidden) { rafOn = true; requestAnimationFrame(tick); } }
function tick() { rafOn = false; frame(); schedule(); }
document.addEventListener('visibilitychange', schedule);

/* ---------------- 初始化 ---------------- */
applyTheme();
applyLang();
elSpeed.value = Math.round(speed * 10);
elSpeedVal.textContent = speed.toFixed(1) + '×';
sizeScope();
const t0 = parseInt(qs.get('t'), 10);
if (Number.isFinite(t0) && t0 >= 1) activateStep(clamp(t0 - 1, 0, STEPS.length - 1));
else activateStep(0);
startTest();
setPlayLabel();
tglH.dispatchEvent(new Event('change'));
schedule();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
