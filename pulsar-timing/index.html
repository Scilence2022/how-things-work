<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脉冲星计时与引力波探测</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark; --acc:#45c4d8;
    --bg:#0e0f13; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light; --acc:#1a7a9a;
    --bg:#edf0f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    transition:background .25s;}
  #app{position:fixed;inset:0;}
  #app canvas{display:block;}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3;}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);
    color:var(--text3);font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;
    white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s;}
  :root[data-theme="light"] .lbl{text-shadow:none;}
  .lbl.o{border-color:rgba(69,196,216,.9);color:#b2f0f8;}
  .lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2;}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0;}
  .lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff;}
  :root[data-theme="light"] .lbl.o{color:#1a7a9a;}
  :root[data-theme="light"] .lbl.r{color:#c92a2a;}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e;}
  :root[data-theme="light"] .lbl.b{color:#1864ab;}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;
    min-width:40px;height:32px;padding:0 12px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;
    max-width:calc(100vw - 320px);}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;
    text-shadow:0 2px 8px rgba(0,0,0,.6);}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;
    text-shadow:0 1px 4px rgba(0,0,0,.5);}
  :root[data-theme="light"] #title h1{text-shadow:none;}
  :root[data-theme="light"] #title .sub{text-shadow:none;}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
  #stats .k{font-size:12px;color:var(--text2);align-self:center;}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400;}
  #stats .v.ok{color:#38d9a9;} #stats .v.warn{color:#ffa94d;} #stats .v.bad{color:#ff6b6b;}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto;}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s;}
  .abtn:hover{border-color:var(--acc);color:var(--text);}
  .abtn.on{border-color:rgba(69,196,216,.6);background:rgba(69,196,216,.12);color:var(--text);}
  :root[data-theme="light"] .abtn.on{border-color:rgba(26,122,154,.55);background:rgba(26,122,154,.10);}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px;}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 78px;text-align:right;
    font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px;}
  #formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);
    border-top:1px dashed var(--panel-border);padding-top:7px;}
  #formula b{color:var(--text3);font-weight:600;}
  #steps{list-style:none;margin-top:8px;}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start;}
  #steps li:hover{background:var(--hover);}
  #steps li.on{background:rgba(69,196,216,.10);border-color:rgba(69,196,216,.45);}
  :root[data-theme="light"] #steps li.on{background:rgba(26,122,154,.08);border-color:rgba(26,122,154,.4);}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3);}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
  #steps li.on .n{background:var(--acc);color:#fff;}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45;}
  #steps .t b{color:var(--text);font-size:12px;}
  #steps li.on .t b{color:#b2f0f8;}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer;}
  #play:hover{filter:brightness(1.12);}
  @media(max-width:900px){#stats{display:none;}}
  @media(max-width:760px){
    #panel{width:calc(100vw - 36px);max-height:55vh;}
    #title{max-width:calc(100vw - 200px);}
    #title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="脉冲星计时与引力波探测" data-en="Pulsar Timing &amp; Gravitational Wave Detection">脉冲星计时与引力波探测</h1>
  <div class="sub" data-zh="旋转中子星每转一圈发出一个无线电脉冲——计时阵列捕捉时空的涟漪 · 空格=运行/暂停 · 拖动旋转" data-en="Each rotation of a neutron star fires a radio pulse — a timing array catches ripples in spacetime · Space=play/pause · drag to orbit">旋转中子星每转一圈发出一个无线电脉冲——计时阵列捕捉时空的涟漪 · 空格=运行/暂停 · 拖动旋转</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn">EN</button>
  <button class="tbtn" id="themeBtn">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="脉冲周期 P" data-en="Pulse period P">脉冲周期 P</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="脉冲计数" data-en="Pulse count">脉冲计数</span><span class="v" id="stCount">—</span>
  <span class="k" data-zh="计时残差 RMS" data-en="Timing residual RMS">计时残差 RMS</span><span class="v ok" id="stRMS">—</span>
  <span class="k" data-zh="引力波频率" data-en="GW frequency">引力波频率</span><span class="v" id="stGW">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn on" id="btnSingle" data-zh="单脉冲星" data-en="Single pulsar">单脉冲星</button>
    <button class="abtn" id="btnPTA" data-zh="脉冲星计时阵" data-en="PTA array">脉冲星计时阵</button>
    <button class="abtn" id="btnGW" data-zh="开启引力波" data-en="Enable GW">开启引力波</button>
    <button class="abtn" id="btnHD" data-zh="Hellings-Downs 曲线" data-en="Hellings-Downs">Hellings-Downs 曲线</button>
  </div>
  <div class="row"><label data-zh="脉冲周期" data-en="Pulse period">脉冲周期</label><input id="sPeriod" type="range" min="1" max="500" step="1" value="5"><span class="val" id="sPeriodVal">5 ms</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const $=id=>document.getElementById(id);
const DEG=Math.PI/180;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* --- renderer --- */
let renderer=null,webglOK=true;
try{
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  $('app').appendChild(renderer.domElement);
}catch(e){webglOK=false;}

const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
Object.assign(labelRenderer.domElement.style,{position:'fixed',inset:'0',pointerEvents:'none',zIndex:'3'});
$('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,400);
camera.position.set(0,18,28);
const controls=new OrbitControls(camera,webglOK?renderer.domElement:document.body);
controls.target.set(0,0,0);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=5; controls.maxDistance=80;

const hemi=new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5);
scene.add(hemi);

/* --- state --- */
let pulsarPeriod=5; // ms
let playing=true;
let mode='single'; // 'single','pta','gw','hd'
let pulseCount=0;
let simT=0; // seconds
let gwEnabled=false;
let lastPulsePhase=0;

/* --- star field (InstancedMesh) --- */
const sfGeo=new THREE.SphereGeometry(0.08,5,4);
const sfMat=new THREE.MeshBasicMaterial({transparent:true,opacity:0.8});
const starField=new THREE.InstancedMesh(sfGeo,sfMat,300);
{const d=new THREE.Object3D();
for(let i=0;i<300;i++){
  const a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1),r=60+Math.random()*60;
  d.position.set(Math.sin(b)*Math.cos(a)*r,Math.cos(b)*r,Math.sin(b)*Math.sin(a)*r);
  d.scale.setScalar(0.3+Math.random()*1.2); d.updateMatrix();
  starField.setMatrixAt(i,d.matrix);
}}
scene.add(starField);

/* --- pulsar neutron star --- */
const nsGeo=new THREE.SphereGeometry(0.35,20,16);
const nsMat=new THREE.MeshBasicMaterial({color:0xeef8ff});
const neutronStar=new THREE.Mesh(nsGeo,nsMat);
scene.add(neutronStar);

/* glow halo */
function makeGlow(col,sz){
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,col.replace(')',',1)').replace('rgb','rgba'));
  gr.addColorStop(0.4,col.replace(')',',0.35)').replace('rgb','rgba'));
  gr.addColorStop(1,col.replace(')',',0)').replace('rgb','rgba'));
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  return new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
}
const nsGlow=makeGlow('rgb(180,230,255)',3.5);
nsGlow.scale.setScalar(3.5);
scene.add(nsGlow);
const nsLight=new THREE.PointLight(0x88ccff,2.5,12,1.5);
scene.add(nsLight);

/* magnetic axis visual (spinning with neutron star) */
const nsGroup=new THREE.Group();
scene.add(nsGroup);
nsGroup.add(neutronStar);
nsGroup.add(nsGlow);
nsGroup.add(nsLight);
// beam cones
function makeCone(col){
  const g=new THREE.ConeGeometry(0.18,3.5,14,1,true);
  const m=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.45,side:THREE.DoubleSide,depthWrite:false});
  return new THREE.Mesh(g,m);
}
const beamA=makeCone(0xffee88); beamA.position.y=1.75; scene.add(beamA);
const beamB=makeCone(0xffee88); beamB.rotation.z=Math.PI; beamB.position.y=-1.75; scene.add(beamB);
const beamGroup=new THREE.Group();
beamGroup.add(beamA);beamGroup.add(beamB);
beamGroup.rotation.z=30*DEG; // tilt 30 deg
scene.add(beamGroup);

/* pulse flash ring */
const flashGeo=new THREE.RingGeometry(0.38,0.62,32);
const flashMat=new THREE.MeshBasicMaterial({color:0xffee66,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false});
const flashRing=new THREE.Mesh(flashGeo,flashMat);
scene.add(flashRing);

/* Earth marker */
const earthGeo=new THREE.SphereGeometry(0.22,14,12);
const earthMat=new THREE.MeshStandardMaterial({color:0x4a9eff,emissive:0x1a4a8a,emissiveIntensity:0.5,roughness:0.6});
const earth=new THREE.Mesh(earthGeo,earthMat);
earth.position.set(7,0,0);
scene.add(earth);
const earthLine=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),earth.position.clone()]),
  new THREE.LineDashedMaterial({color:0x4a9eff,transparent:true,opacity:0.3,dashSize:0.3,gapSize:0.2})
);
earthLine.computeLineDistances();
scene.add(earthLine);

/* PTA pulsars (InstancedMesh) */
const ptaCount=8;
const ptaGeo=new THREE.SphereGeometry(0.22,10,8);
const ptaMat=new THREE.MeshBasicMaterial({color:0x88eeff});
const ptaMesh=new THREE.InstancedMesh(ptaGeo,ptaMat,ptaCount);
ptaMesh.visible=false;
scene.add(ptaMesh);
const ptaPositions=[];
const ptaPhaseOffsets=[];
{const d=new THREE.Object3D();
for(let i=0;i<ptaCount;i++){
  const a=i/ptaCount*Math.PI*2+0.3;
  const r=9+Math.sin(i*1.3)*2;
  const elev=(Math.random()-0.5)*6;
  const p=new THREE.Vector3(Math.cos(a)*r,elev,Math.sin(a)*r);
  ptaPositions.push(p.clone());
  ptaPhaseOffsets.push(Math.random()*Math.PI*2);
  d.position.copy(p); d.scale.setScalar(1); d.updateMatrix();
  ptaMesh.setMatrixAt(i,d.matrix);
}
ptaMesh.instanceMatrix.needsUpdate=true;}

/* PTA lines to earth */
const ptaLineGroup=new THREE.Group(); ptaLineGroup.visible=false; scene.add(ptaLineGroup);
const ptaLineMats=[];
for(let i=0;i<ptaCount;i++){
  const mat=new THREE.LineBasicMaterial({color:0x45c4d8,transparent:true,opacity:0.25});
  ptaLineMats.push(mat);
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),ptaPositions[i]]),mat);
  ptaLineGroup.add(ln);
}

/* GW wave mesh (deforming grid plane) */
const gwGeo=new THREE.PlaneGeometry(28,28,32,32);
const gwMat=new THREE.MeshBasicMaterial({color:0x22aaff,wireframe:true,transparent:true,opacity:0.18});
const gwMesh=new THREE.Mesh(gwGeo,gwMat);
gwMesh.rotation.x=-Math.PI/2; gwMesh.visible=false;
scene.add(gwMesh);

/* residual bars (canvas overlay) */
const residCanvas=document.createElement('canvas');
residCanvas.style.cssText='position:fixed;right:18px;bottom:18px;z-index:4;border-radius:12px;pointer-events:none;';
residCanvas.width=340;residCanvas.height=200;
document.body.appendChild(residCanvas);

/* HD curve canvas */
const hdCanvas=document.createElement('canvas');
hdCanvas.style.cssText='position:fixed;right:18px;bottom:18px;z-index:4;border-radius:12px;pointer-events:none;display:none;';
hdCanvas.width=340;hdCanvas.height=200;
document.body.appendChild(hdCanvas);

/* --- label system --- */
const labelReg=[];
function addLabel(textFn,pos,cls='',vis=()=>true,parent=scene){
  const div=document.createElement('div');
  div.className='lbl '+cls;
  const o=new CSS2DObject(div);
  o.position.copy(pos);
  parent.add(o);
  o.userData={text:textFn,vis};
  labelReg.push(o);
  div.textContent=textFn();
  return o;
}
const lblNS=addLabel(()=>L('中子星 R≈12km · 旋转轴','Neutron star R≈12km · spin axis'),new THREE.Vector3(0,0.7,0),'o');
const lblEarth=addLabel(()=>L('地球观测站','Earth observatory'),new THREE.Vector3(0,0.4,0),'b',()=>true,earth);
const lblBeam=addLabel(()=>L('射电波束 (30° 倾角)','Radio beam (30° tilt)'),new THREE.Vector3(0,2.2,0),'g',()=>mode==='single');

/* --- theme / lang --- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  $('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x080a10:0xdde5ee);
  sfMat.color.setHex(dark?0xbfd0e8:0x5a6b85);
  sfMat.opacity=dark?0.8:0.25;
  hemi.intensity=dark?0.5:0.85;
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh;
  });
  $('langBtn').textContent=LANG==='en'?'中':'EN';
  document.title=L('脉冲星计时与引力波探测','Pulsar Timing & Gravitational Wave Detection');
  buildSteps(); syncBtns(); updateFormula(); setPlayLabel();
}
$('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
$('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});

/* --- steps --- */
const STEPS=[
  {b:'中子星：超新星后剩下的核心',be:'Neutron star: supernova remnant core',
   d:'超新星爆发后，质量 1.4–2 M☉ 的铁核在不到一秒内坍缩，密度达 ~10¹⁷ kg/m³，半径仅约 12 km。剧烈坍缩加速自转，像芭蕾演员收回手臂——通过吸积再加速则成为毫秒脉冲星。',
   de:'After a supernova, a 1.4–2 M☉ iron core collapses in under a second to ~10¹⁷ kg/m³ and radius ≈12 km. Collapse spins it up; accretion recycling produces millisecond pulsars.',
   act:()=>setMode('single')},
  {b:'射电脉冲：磁轴偏离自转轴',be:'Radio pulse: misaligned magnetic axis',
   d:'磁轴与自转轴夹角约 30°，射电辐射集中在磁极方向的锥形波束。每自转一圈，两个波束各扫过地球一次——到达地球的无线电脉冲即为计时信号。毫秒脉冲星周期 1–10 ms，频率高达 700 Hz。',
   de:'The magnetic axis is tilted ~30° from the spin axis; radio emission exits as a narrow cone at each magnetic pole. Once per rotation both beams sweep past Earth — the arriving radio pulse is the timing signal. MSPs spin up to 700 Hz.',
   act:()=>setMode('single')},
  {b:'计时稳定性：媲美原子钟',be:'Timing stability: matching atomic clocks',
   d:'毫秒脉冲星的自转周期稳定性优于 10⁻¹³，是自然界最精确的时钟之一。任何沿视线方向的时空扰动——引力波、星际色散、地球自转不规则——都会以纳秒级的脉冲到达时间偏差 (TOA 残差) 体现出来。',
   de:'MSP rotation period stability is better than 10⁻¹³ — among the best natural clocks. Any spacetime perturbation along the line of sight — gravitational waves, interstellar dispersion, Earth rotation irregularities — shows up as nanosecond-level pulse TOA residuals.',
   act:()=>setMode('single')},
  {b:'引力波效应：TOA 提前或推迟',be:'GW effect: TOA advance and retard',
   d:'经过地球–脉冲星连线的引力波周期性地拉伸和压缩这段距离，使脉冲比模型预测的提前或推迟到达。单颗脉冲星可能因其他原因产生残差，但引力波背景会在所有脉冲星中产生特征空间相关性。',
   de:'A GW passing along the Earth-pulsar direction periodically stretches and compresses that distance, making pulses arrive earlier or later than the model predicts. A GW background produces a characteristic spatial correlation across all pulsars.',
   act:()=>setMode('gw')},

   de:'Monitoring dozens of MSPs simultaneously, the correlation of TOA residuals between every pair is plotted versus their angular separation. A GW background produces the characteristic Hellings-Downs curve — a bump near 90°, distinct from clock errors and noise.',
   act:()=>setMode('pta')},
  {b:'NANOGrav 2023：数纳赫兹引力波背景证据',be:'NANOGrav 2023: nanohertz GW background evidence',
   d:'北美毫秒脉冲星计时阵列 (NANOGrav) 在 2023 年宣布发现数纳赫兹 (~10⁻⁸ Hz) 引力波背景的证据，符合 Hellings-Downs 相关特征，最可能来源于超大质量黑洞双星的螺旋并合。这是迄今对最低频率引力波的最强约束。',
   de:'NANOGrav (2023) announced evidence for a nanohertz (~10⁻⁸ Hz) GW background with a Hellings-Downs spatial correlation signature — most likely from supermassive black hole binaries inspiraling toward merger. The strongest constraint yet on the lowest-frequency GWs.',

];
function buildSteps(){
  const el=$('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{s.act();syncAll();});
    el.appendChild(li);
  });
}
function updateFormula(){
  const p=pulsarPeriod;
  $('formula').innerHTML=L(
    `<b>脉冲周期 P = ${p} ms</b>，自转频率 f = ${(1000/p).toFixed(1)} Hz<br>稳定性 ΔP/P ~ 10⁻¹³ → 1年内TOA误差 &lt; 100 ns<br>纳赫兹引力波周期 ~ 数年，频率 ~ 10⁻⁸ Hz`,
    `<b>Pulse period P = ${p} ms</b>, spin rate f = ${(1000/p).toFixed(1)} Hz<br>Stability ΔP/P ~ 10⁻¹³ → TOA error &lt; 100 ns per year<br>Nanohertz GW period ~ years, frequency ~ 10⁻⁸ Hz`
  );
}

/* --- mode switching --- */
function setMode(m){
  mode=m; gwEnabled=(m==='gw'||m==='hd');
  nsGroup.visible=m==='single'||m==='gw';
  beamGroup.visible=m==='single'||m==='gw';
  flashRing.visible=m==='single'||m==='gw';
  earth.visible=true;
  earthLine.visible=m==='single';
  ptaMesh.visible=m==='pta'||m==='gw'||m==='hd';
  ptaLineGroup.visible=m==='pta'||m==='gw';
  gwMesh.visible=m==='gw';
  residCanvas.style.display=(m==='gw')?'block':'none';
  hdCanvas.style.display=(m==='hd')?'block':'none';
  if(m==='single') camera.position.set(0,8,14);
  if(m==='pta'||m==='gw') camera.position.set(0,22,26);
  if(m==='hd'){camera.position.set(0,22,26);drawHD();}
  syncBtns();
}
function syncBtns(){
  ['Single','PTA','GW','HD'].forEach((n,i)=>{
    const ids=['btnSingle','btnPTA','btnGW','btnHD'];
    const modes=['single','pta','gw','hd'];
    $(ids[i]).classList.toggle('on',mode===modes[i]);
  });
}
function syncAll(){syncBtns();updateFormula();updateStats();}

/* --- stats --- */
function updateStats(){
  const p=pulsarPeriod;
  $('stP').innerHTML=p+'<small> ms</small>';
  $('stCount').textContent=pulseCount;
  const rms=gwEnabled?Math.round(80+Math.random()*40):Math.round(5+Math.random()*8);
  $('stRMS').innerHTML=rms+'<small> ns</small>';
  $('stRMS').className='v '+(rms>50?'warn':'ok');
  const gwf=gwEnabled?'~10':'—';
  $('stGW').innerHTML=gwEnabled?'~10<small> nHz</small>':'—';
}

/* --- residual bar chart --- */
function drawResiduals(t){
  const ctx=residCanvas.getContext('2d');
  const W=residCanvas.width, H=residCanvas.height;
  ctx.clearRect(0,0,W,H);
  const css=getComputedStyle(htmlEl);
  const panelBg=THEME==='dark'?'rgba(15,16,20,0.86)':'rgba(255,255,255,0.88)';
  const textCol=css.getPropertyValue('--text2').trim()||'#9fb0c3';
  ctx.fillStyle=panelBg; ctx.strokeStyle='rgba(255,255,255,0.09)';
  ctx.beginPath(); roundRect(ctx,0,0,W,H,12); ctx.fill(); ctx.stroke();
  ctx.font='bold 11px system-ui'; ctx.fillStyle=textCol;
  ctx.fillText(L('各脉冲星TOA残差 (nHz GW)','Per-pulsar TOA residuals (nHz GW)'),10,18);
  const bw=22, gap=8, n=ptaCount;
  const totalW=n*(bw+gap)-gap; const startX=(W-totalW)/2;
  const midY=H/2+10; const scale=55;
  ctx.strokeStyle='rgba(120,140,160,0.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(startX-4,midY); ctx.lineTo(startX+totalW+4,midY); ctx.stroke();
  for(let i=0;i<n;i++){
    const x=startX+i*(bw+gap);
    // GW produces correlated residuals based on pulsar sky position
    const ang=ptaPositions[i].angleTo(earth.position)||0;
    const res=Math.sin(t*0.8+ptaPhaseOffsets[i])*scale*(0.5+0.5*Math.cos(ang));
    const h=Math.abs(res); const top=res>0?midY-h:midY;
    const frac=i/n;
    const r=Math.round(69+frac*80), g2=Math.round(196-frac*80), b=Math.round(216);
    ctx.fillStyle=`rgba(${r},${g2},${b},0.75)`;
    ctx.fillRect(x,top,bw,h);
    ctx.fillStyle=textCol; ctx.font='9px system-ui';
    ctx.fillText('P'+(i+1),x+2,midY+14);
  }
}

function roundRect(ctx,x,y,w,h,r){
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawHD(){
  hdCanvas.style.display='block';
  const ctx=hdCanvas.getContext('2d');
  const W=hdCanvas.width, H=hdCanvas.height;
  ctx.clearRect(0,0,W,H);
  const panelBg=THEME==='dark'?'rgba(15,16,20,0.86)':'rgba(255,255,255,0.88)';
  const textCol=getComputedStyle(htmlEl).getPropertyValue('--text2').trim()||'#9fb0c3';
  ctx.fillStyle=panelBg; ctx.strokeStyle='rgba(255,255,255,0.09)';
  ctx.beginPath(); roundRect(ctx,0,0,W,H,12); ctx.fill(); ctx.stroke();
  ctx.font='bold 11px system-ui'; ctx.fillStyle=textCol;
  ctx.fillText(L('Hellings-Downs 相关 (GW背景特征)','Hellings-Downs correlation (GW background signature)'),8,17);
  const padL=36,padR=12,padT=26,padB=22;
  const iw=W-padL-padR,ih=H-padT-padB;
  ctx.strokeStyle='rgba(120,140,160,0.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,padT+ih); ctx.lineTo(padL+iw,padT+ih); ctx.stroke();
  // Hellings-Downs function: HD(zeta)=0.5-0.25*(1-cos(zeta))*[1-(3/2)*(1-cos(zeta))*ln((1-cos(zeta))/2)]  normalized
  function hd(zeta){
    const x=(1-Math.cos(zeta))/2;
    if(x<1e-9)return 0.5;
    return 1.5*x*Math.log(x)-0.25*x+0.5;
  }
  const maxHD=hd(0.001);
  const xOf=a=>padL+a/Math.PI*iw;
  const yOf=v=>padT+ih-(v/maxHD*0.75+0.15)*ih;
  ctx.strokeStyle='rgba(69,196,216,0.9)'; ctx.lineWidth=2.5;
  ctx.beginPath();
  for(let k=0;k<=120;k++){
    const zeta=k/120*Math.PI;
    const v=hd(zeta);
    k===0?ctx.moveTo(xOf(zeta),yOf(v)):ctx.lineTo(xOf(zeta),yOf(v));
  }
  ctx.stroke();
  // axis labels
  ctx.font='10px system-ui'; ctx.fillStyle=textCol;
  [0,45,90,135,180].forEach(a=>{
    const x=xOf(a*DEG);
    ctx.fillText(a+'°',x-8,padT+ih+14);
  });
  ctx.fillText(L('角间距 ζ','Angular sep. ζ'),padL+iw/2-24,H-4);
  ctx.save(); ctx.translate(11,padT+ih/2); ctx.rotate(-Math.PI/2);
  ctx.fillText(L('相关系数','Correlation'),0,0); ctx.restore();
  // scatter data points for the ptaCount*(ptaCount-1)/2 pairs
  ctx.fillStyle='rgba(255,200,80,0.85)';
  for(let i=0;i<ptaCount;i++) for(let j=i+1;j<ptaCount;j++){
    const a=ptaPositions[i].angleTo(ptaPositions[j]);
    const noise=(Math.random()-0.5)*0.18;
    const v=hd(a)+noise;
    ctx.beginPath(); ctx.arc(xOf(a),yOf(v),3.5,0,Math.PI*2); ctx.fill();
  }
}

/* --- GW mesh deformation --- */
function updateGW(t){
  if(!gwMesh.visible) return;
  const pos=gwMesh.geometry.attributes.position;
  const gwFreq=0.4; const gwAmp=0.9;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const r=Math.sqrt(x*x+z*z);
    pos.setY(i, Math.sin(r*0.5-t*gwFreq*2*Math.PI)*gwAmp*Math.exp(-r*0.04));
  }
  pos.needsUpdate=true;
}

/* --- play/pause --- */
function setPlayLabel(){$('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
$('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click();}});

/* --- sliders --- */
$('sPeriod').addEventListener('input',()=>{
  pulsarPeriod=+$('sPeriod').value;
  $('sPeriodVal').textContent=pulsarPeriod+' ms';
  updateFormula(); updateStats();
});

/* --- action buttons --- */
$('btnSingle').addEventListener('click',()=>setMode('single'));
$('btnPTA').addEventListener('click',()=>setMode('pta'));
$('btnGW').addEventListener('click',()=>setMode('gw'));
$('btnHD').addEventListener('click',()=>setMode('hd'));

/* --- main loop --- */
const clock=new THREE.Clock();
let raf=null;
let accStats=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dt2=playing?dt:0;
  simT+=dt2;

  // spin neutron star group
  const spinRate=(2*Math.PI)/(pulsarPeriod*0.001)*0.00003; // visual slow-down
  nsGroup.rotation.y+=spinRate*(playing?1:0)*200*dt;
  beamGroup.rotation.y=nsGroup.rotation.y;

  // pulse detection: when beam sweeps past earth direction
  const beamAngle=(nsGroup.rotation.y%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  const pulsePhase=Math.floor(beamAngle/(Math.PI));
  if(pulsePhase!==lastPulsePhase && playing){
    lastPulsePhase=pulsePhase;
    pulseCount++;
    flashMat.opacity=0.9;
    // flash on earth
    earth.material.emissiveIntensity=2.0;
  }
  // fade flash
  if(flashMat.opacity>0) flashMat.opacity=Math.max(0,flashMat.opacity-dt*6);
  if(earth.material.emissiveIntensity>0.5) earth.material.emissiveIntensity=Math.max(0.5,earth.material.emissiveIntensity-dt*8);

  // GW wave
  if(gwEnabled) updateGW(simT);

  // residual chart
  if(mode==='gw') drawResiduals(simT);

  accStats+=dt;
  if(accStats>0.25){accStats=0;updateStats();}

  controls.update();
  if(renderer){renderer.render(scene,camera);labelRenderer.render(scene,camera);}
}
function start(){if(raf===null&&webglOK){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  if(renderer)renderer.setSize(innerWidth,innerHeight);
  labelRenderer.setSize(innerWidth,innerHeight);
});

applyTheme(); buildSteps(); applyLang(); setMode('single');
$('sPeriodVal').textContent=pulsarPeriod+' ms';
updateFormula(); updateStats(); setPlayLabel();
start();
</script>
