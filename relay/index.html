<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电磁继电器 · 37 mA 搬动 4 A</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,169,77,.6); background: rgba(255,169,77,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(232,89,12,.55); background: rgba(232,89,12,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="电磁继电器 · 37 mA 搬动 4 A" data-en="Electromagnetic Relay · 37 mA Moves 4 A">电磁继电器 · 37 mA 搬动 4 A</h1>
  <div class="sub" data-zh="控制侧一按,12 V 线圈按 τ=L/R=0.375 ms 充到 37 mA,8000 匝安匝数把衔铁以 F∝(Ni)² 吸下来,NO 触点弹跳两三下后闭合,24 V/4 A 的大电流侧通路——小电流从此隔空指挥大电流;断开瞬间线圈的磁场能量无处可去,di/dt 冲到 1875 A/s,感应出 −225 V 尖峰足以击穿驱动管,一只续流二极管把它钳回 −0.8 V;再并上辅助触点与启动钮,按一下就能自锁保持 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="One press on the control side: the 12 V coil charges at τ=L/R=0.375 ms to 37 mA, 8000 ampere-turns pull the armature in with F∝(Ni)², the NO contact bounces two or three times and then closes the 24 V / 4 A load side — small current now commands big current from a distance; at break, the coil's magnetic energy has nowhere to go, di/dt hits 1875 A/s and induces a −225 V spike that would punch through the driving transistor, until a flyback diode clamps it to −0.8 V; wire an auxiliary contact in parallel with the start button and one press latches itself on · 3D interactive demo · drag to orbit · Space = run/pause">电磁继电器 · 37 mA 搬动 4 A</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="线圈电流" data-en="Coil current">线圈电流</span><span class="v" id="stI">—</span>
  <span class="k" data-zh="线圈电压" data-en="Coil voltage">线圈电压</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="触点状态" data-en="Contact state">触点状态</span><span class="v" id="stCt">—</span>
  <span class="k" data-zh="负载电流" data-en="Load current">负载电流</span><span class="v" id="stLoad">—</span>
  <span class="k" data-zh="电弧/弹跳" data-en="Arc / bounce">电弧/弹跳</span><span class="v" id="stArc">—</span>
  <span class="k" data-zh="阶段" data-en="Phase">阶段</span><span class="v" id="stPhase">—</span>
</div>

<div id="plot">
  <h3 data-zh="示波:线圈电压与负载电流(60 ms 窗,25 µs 子步真实仿真)——断开尖峰无二极管 −225 V,有二极管钳到 −0.8 V" data-en="Scope: coil voltage & load current (60 ms window, true 25 µs substeps) — the break spike is −225 V without the flyback diode, clamped to −0.8 V with it">示波:线圈电压与负载电流(60 ms 窗,25 µs 子步真实仿真)——断开尖峰无二极管 −225 V,有二极管钳到 −0.8 V</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.o" data-zh="琥珀流:线圈小电流" data-en="amber flow: small coil current">琥珀流:线圈小电流</span>
    <span class="chip.r" data-zh="红流:负载大电流 4 A" data-en="red flow: 4 A load current">红流:负载大电流 4 A</span>
    <span class="chip.g" data-zh="续流二极管:给磁场能一条退路" data-en="flyback diode: an exit for magnetic energy">续流二极管:给磁场能一条退路</span>
    <span class="chip.b" data-zh="辅助触点:自锁的钥匙" data-en="aux contact: the latching key">辅助触点:自锁的钥匙</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnStart" data-zh="启动(点动)" data-en="Start (momentary)">启动(点动)</button>
    <button class="abtn brk" id="btnStop" data-zh="停止(点断)" data-en="Stop (momentary break)">停止(点断)</button>
    <button class="abtn" id="btnSpike" data-zh="尖峰演示(断开线圈)" data-en="Spike demo (break the coil)">尖峰演示(断开线圈)</button>
  </div>
  <div class="row"><label data-zh="控制电压" data-en="Control voltage">控制电压</label><input id="sV" type="range" min="6" max="14" step="0.5" value="12"><span class="val" id="sVVal">12 V</span></div>
  <div class="row"><label data-zh="负载电流上限" data-en="Load rating">负载电流上限</label><input id="sLoad" type="range" min="1" max="10" step="0.5" value="4"><span class="val" id="sLoadVal">4 A</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="示波" data-en="Scope">示波</span></label>
      <label><input id="tglLock" type="checkbox" checked> <span data-zh="自锁接线" data-en="Latch wiring">自锁接线</span></label>
      <label><input id="tglDiode" type="checkbox" checked> <span data-zh="续流二极管" data-en="Flyback diode">续流二极管</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../electromagnetic-induction/" data-zh="电磁感应:尖峰的物理出处" data-en="electromagnetic induction: where the spike comes from">电磁感应:尖峰的物理出处</a>
    <a href="../motor-generator/" data-zh="电机与发电机:同一段磁路的两个方向" data-en="motor-generator: one magnetic path, two directions">电机与发电机:同一段磁路的两个方向</a>
    <a href="../transistor-adder/" data-zh="晶体管加法器:固态版的小控大" data-en="transistor adder: the solid-state small-controls-big">晶体管加法器:固态版的小控大</a>
    <a href="../thermostat/" data-zh="温控器:继电器的另一份工作" data-en="thermostat: the relay's day job">温控器:继电器的另一份工作</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 20, 66);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
  pcbM.color.setHex(dark ? 0x1e3a2a : 0x2f5e42);
  shellGlassM.color.setHex(dark ? 0xcfd8e6 : 0xb9c4d0);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('电磁继电器 · 37 mA 搬动 4 A', 'Electromagnetic Relay · 37 mA Moves 4 A');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 140);
camera.position.set(4.6, 3.2, 8.8);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(6, 9, 7);
scene.add(key);
const fillL = new THREE.DirectionalLight(0xffd8a8, 0.3);
fillL.position.set(-7, 5, -6);
scene.add(fillL);

/* ================= 电路状态(真实单位,25 µs 子步) ================= */
const RCOIL = 320, LCOIL = 0.12, VCTRL0 = 12;
const I_PULL = 0.022, I_DROP = 0.008;      // 吸合/释放阈值 A

function stepParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.u = (p.u + p.s * dt) % 1;
    const v = p.c.getPointAt(p.u);
    p.pos.copy(v);
  }
}
function drawParts() {
  const n = parts.length;
  for (let i = 0; i < P_MAX; i++) {
    if (i < n) {
      const p = parts[i];
      pPos[i * 3] = p.pos.x; pPos[i * 3 + 1] = p.pos.y; pPos[i * 3 + 2] = p.pos.z;
      pCol[i * 3] = p.col.r; pCol[i * 3 + 1] = p.col.g; pCol[i * 3 + 2] = p.col.b;
    } else pPos[i * 3 + 1] = -999;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

/* ================= 电气子步(25 µs,真实方程) ================= */
let spikeDemo = false;
function swPathClosed() {
  const stopClosed = stopHoldT <= 0;
  if (spikeDemo && !swStartHeld) return false;
  return stopClosed && (swStartHeld || (lockOn && auxClosed));
}
function elecStep(h) {
  const path = swPathClosed();
  if (path) {
    vCoil = vCtrl - iCoil * RCOIL;
    iCoil += (vCoil / LCOIL) * h;
    spikeV = 0;
  } else if (iCoil > 0) {
    if (diodeOn) {
      vCoil = -0.8;
      iCoil += (vCoil - iCoil * RCOIL) / LCOIL * h;
      if (iCoil < 0) iCoil = 0;
    } else {
      /* 分断时间 TAU_OPEN 内强制换路:感应电压 V = −L·di/dt − iR */
      const di = iCoil * h / TAU_OPEN;
      vCoil = -(LCOIL * iCoil / TAU_OPEN + iCoil * RCOIL);
      spikeV = Math.max(spikeV, -vCoil);
      iCoil -= di;
      if (iCoil < 0) iCoil = 0;
    }
  } else {
    iCoil = 0; vCoil = 0; spikeV = 0;
  }
  /* 衔铁二阶动力学 + 触点弹跳 */
  const fMag = iCoil > 0.0005 ? Math.pow(iCoil / I_PULL, 2) * 1.5 * (1 + 4 * armP) : 0;
  const springF = 1.25;
  const w0 = 2 * Math.PI * 240; // 固有 ~240 Hz
  let acc = (fMag - springF - armV * 0.09) * w0 * w0;
  armV += acc * h;
  armP += armV * h;
  if (armP >= 1) {
    armP = 1;
    if (armV > 0.25) {
      bounceN++;
      bounceT = 0;
      armV = -armV * 0.35;
    } else armV = 0;
  }
  if (armP <= 0) { armP = 0; if (armV < 0) armV = -armV * 0.3; }
  const closedNow = armP > 0.985;
  /* 电弧:闭合状态下失去接触(释放/弹跳)且负载有流 */
  if (relayClosed && !closedNow && lampI > 0.5) arcT = 0.045;
  relayClosed = closedNow;
  auxClosed = relayClosed;
  /* 负载:24 V 电源,电流由负载额定决定 */
  lampI = relayClosed ? loadI0 : 0;
  if (arcT > 0) { arcT -= h; if (arcT <= 0) arcT = 0; }
  bounceT += h;
  /* 示波缓冲 */
  scope.t[scope.head] = simT;
  scope.v[scope.head] = vCoil;
  scope.il[scope.head] = lampI;
  scope.head = (scope.head + 1) % SCOPE_N;
  scope.n = Math.min(SCOPE_N, scope.n + 1);
}

    d: '线圈断开瞬间 di/dt≈1875 A/s,V=−L·di/dt 冲到 −225 V,足以击穿驱动它的晶体管;并联一只二极管给磁场能一条退路,尖峰被钳到 −0.8 V、电流按 τ=L/R 缓释——关掉「续流二极管」开关再断一次,看示波上的紫色尖峰。',
    de: 'At break, di/dt≈1875 A/s drives V=−L·di/dt to −225 V, enough to punch through the driving transistor; a parallel diode gives the magnetic energy an exit, clamping the spike to −0.8 V while current decays at τ=L/R — switch the flyback off and break again to see the spike on the scope.',
    act: () => { phaseIdx = 4; pulseStart(1.2); flyTo([-3.0, 2.8, 4.2], [-1.6, 1.8, 0]); } },
  { b: '自锁:辅助触点并联启动钮', be: 'Self-latching: aux contact across START',
    d: '把继电器自己的一个 NO 辅助触点与启动钮并联:按一下,线圈得电、触点闭合、辅助触点接管供电,松手依然保持;停止钮串在总路里,一按断自锁——电动机启保停电路的全部逻辑就在这三根线里。',
    de: 'Wire one NO auxiliary contact of the relay itself across the start button: one press energizes the coil, the contact closes, the aux takes over the supply and the relay holds itself; the stop button sits in series to break the latch — the whole start-keep-stop motor circuit in three wires.',
    act: () => { phaseIdx = 5; pulseStart(0.5); flyTo([-3.4, 3.4, 6.2], [-1.6, 2.0, 0]); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:示波 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 40, padR = 46, padT = 14, padB = 24;
  const xOf = i => padL + i / (SCOPE_N - 1) * (W - padL - padR);
  const yV = v => (H - padB) - clamp(v, -260, 40) / 300 * (H - padT - padB);
  const yI = v => (H - padB) - clamp(v, 0, 6) / 6 * (H - padT - padB);
  ctx.font = '13px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.25)';
  ctx.beginPath(); ctx.moveTo(padL, yV(0)); ctx.lineTo(W - padR, yV(0)); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText('+40V', 6, yV(40) + 4);
  ctx.fillText('−260V', 6, yV(-260) + 4);
  ctx.fillText('6A', W - padR + 6, yI(6) + 4);
  ctx.fillText('0', W - padR + 12, H - padB + 4);
  const VMAX_BREAK = -260;
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = 'rgba(255,107,107,.5)';
  ctx.beginPath(); ctx.moveTo(padL, yV(VMAX_BREAK + 35)); ctx.lineTo(W - padR, yV(VMAX_BREAK + 35)); ctx.stroke();
  ctx.setLineDash([]);
  if (scope.n > 2) {
    const start = (scope.head - scope.n + SCOPE_N) % SCOPE_N;
    const draw = (get, ymap, col, lw, step) => {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath();
      for (let k = 0; k < scope.n; k += step) {
        const idx = (start + k) % SCOPE_N;
        const px = xOf(k), py = ymap(get(idx));
        k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
    };
    draw(i => scope.il[i], yI, '#ff6b6b', 2, 4);
    draw(i => scope.v[i], yV, '#ffa94d', 2.2, 1); /* 尖峰仅持续 ~60µs,电压道必须逐步绘制 */
  }
  ctx.fillStyle = '#ffa94d';
  ctx.fillText(L('线圈电压', 'coil V'), padL + 8, padT + 16);
  ctx.fillStyle = '#ff6b6b';
  ctx.fillText(L('负载电流', 'load A'), padL + 84, padT + 16);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elV = document.getElementById('sV'), elVVal = document.getElementById('sVVal');
const elLoad = document.getElementById('sLoad'), elLoadVal = document.getElementById('sLoadVal');
const stI = document.getElementById('stI'), stV = document.getElementById('stV'),
  stCt = document.getElementById('stCt'), stLoad = document.getElementById('stLoad'),
  stArc = document.getElementById('stArc'), stPhase = document.getElementById('stPhase');
const formulaEl = document.getElementById('formula');
const btnStart = document.getElementById('btnStart'), btnStop = document.getElementById('btnStop'),
  btnSpike = document.getElementById('btnSpike');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elV.value = vCtrl; elVVal.textContent = `${vCtrl.toFixed(1)} V`;
  elLoad.value = loadI0; elLoadVal.textContent = `${loadI0.toFixed(1)} A`;
}
function syncBtns() {}
function phaseName() {
  if (arcT > 0) return L('电弧燃烧中', 'arcing');
  if (bounceN > 0 && bounceT < 0.008) return L('触点弹跳', 'bouncing');
  if (relayClosed) return L('吸合·NO 通', 'picked up · NO on');
  if (spikeV > 30) return L('断开尖峰!', 'break spike!');
  if (iCoil > 0.001) return L('励磁中', 'energizing');
  return L('释放·NC 通', 'released · NC on');
}
function updateStats() {
  stI.innerHTML = `${(iCoil * 1000).toFixed(1)}<small> mA</small>`;
  stI.className = 'v ' + (iCoil >= I_PULL ? 'ok' : iCoil > 0.001 ? 'warn' : '');
  stV.innerHTML = `${vCoil.toFixed(1)}<small> V</small>`;
  stV.className = 'v ' + (vCoil < -30 ? 'bad' : vCoil < -0.4 ? 'warn' : vCoil > 1 ? 'ok' : '');
  stCt.textContent = relayClosed ? L('NO 通 · NC 断', 'NO on · NC off') : L('NO 断 · NC 通', 'NO off · NC on');
  stCt.className = 'v ' + (relayClosed ? 'ok' : '');
  stLoad.innerHTML = `${lampI.toFixed(1)}<small> A</small>`;
  stLoad.className = 'v ' + (lampI > 0.1 ? 'ok' : '');
  stArc.textContent = arcT > 0 ? L('电弧!', 'arc!') : bounceN > 0 && bounceT < 0.01 ? L(`弹跳×${bounceN}`, `bounce×${bounceN}`) : '—';
  stArc.className = 'v ' + (arcT > 0 ? 'bad' : bounceN > 0 && bounceT < 0.01 ? 'warn' : '');
  stPhase.textContent = phaseName();
}
function updateFormula() {
  const iNom = vCtrl / RCOIL;
  const tau = LCOIL / RCOIL * 1000;
  const spike = diodeOn ? 0.8 : LCOIL * iNom / TAU_OPEN;
  formulaEl.innerHTML = L(
    `<b>吸合过程:i = V/R·(1−e^(−t/τ))</b>,τ = L/R = 0.12/320 = ${tau.toFixed(2)} ms,稳态 i = ${vCtrl.toFixed(1)}/320 = ${(iNom * 1000).toFixed(1)} mA<br>` +
    `<b>吸力:F ∝ (N·i)²</b>:吸合 ≥ ${I_PULL * 1000} mA,释放 ≤ ${I_DROP * 1000} mA(回差即抗抖动磁滞)<br>` +
    `<b>断开尖峰:V = −L·di/dt</b> = −0.12×${(iNom * 1000).toFixed(0)}mA/${(TAU_OPEN * 1e6)}µs ≈ <b>${diodeOn ? '−0.8 V(二极管钳位)' : '−' + spike.toFixed(0) + ' V(足以击穿驱动管)'}</b><br>` +
    `<b>负载侧:24 V · ${loadI0.toFixed(1)} A</b>:${(iNom * 1000).toFixed(1)} mA 控 ${loadI0.toFixed(1)} A,控制比 ≈ ${(loadI0 / iNom).toFixed(0)} 倍,且两侧无电气连接<br>` +
    `<b>自锁:aux(NO)∥ START</b>,STOP 串联:按一下,保持;再按停止,释放`,
    `<b>Pickup: i = V/R·(1−e^(−t/τ))</b>, τ = L/R = 0.12/320 = ${tau.toFixed(2)} ms, steady i = ${vCtrl.toFixed(1)}/320 = ${(iNom * 1000).toFixed(1)} mA<br>` +
    `<b>Force: F ∝ (N·i)²</b>: picks up ≥ ${(I_PULL * 1000)} mA, drops out ≤ ${(I_DROP * 1000)} mA (hysteresis = chatter immunity)<br>` +
    `<b>Break spike: V = −L·di/dt</b> = −0.12×${(iNom * 1000).toFixed(0)}mA/${(TAU_OPEN * 1e6)}µs ≈ <b>${diodeOn ? '−0.8 V (diode-clamped)' : '−' + spike.toFixed(0) + ' V (lethal to the driver)'}</b><br>` +
    `<b>Load: 24 V · ${loadI0.toFixed(1)} A</b>: ${(iNom * 1000).toFixed(1)} mA commands ${loadI0.toFixed(1)} A, ratio ≈ ${(loadI0 / iNom).toFixed(0)}×, no electrical connection between sides<br>` +
    `<b>Latch: aux (NO) ∥ START</b>, STOP in series: one press holds; press stop to release`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elV.addEventListener('input', () => { vCtrl = +elV.value; syncSliders(); updateFormula(); });
elLoad.addEventListener('input', () => { loadI0 = +elLoad.value; syncSliders(); updateFormula(); });
btnStart.addEventListener('click', () => { spikeDemo = false; pulseStart(0.6); });
btnStop.addEventListener('click', () => { spikeDemo = false; pulseStop(0.4); });
btnSpike.addEventListener('click', () => {
  diodeOn = false;
  spikeDemo = true;
  document.getElementById('tglDiode').checked = false;
  pulseStart(1.0);
  notifyT = 3;
  notifyZ = '二极管已移除:1 秒后自动断开线圈,盯紧示波上的 −225 V 尖峰';
  notifyE = 'diode removed: the coil breaks in 1 s — watch the −225 V spike on the scope';
  updateFormula();
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglLock').addEventListener('change', e => {
  lockOn = e.target.checked;
  auxWire.material = lockOn ? wireCtlM : shellM;
  if (!lockOn) auxClosed = false;
  updateFormula();
});
document.getElementById('tglDiode').addEventListener('change', e => {
  diodeOn = e.target.checked;
  diodeG.visible = diodeOn;
  updateFormula();
});
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  /* 点动按钮计时 */
  if (dt > 0) {
    if (startHoldT > 0) { startHoldT -= dt; if (startHoldT <= 0) swStartHeld = false; }
    if (stopHoldT > 0) { stopHoldT -= dt; if (stopHoldT <= 0) stopHoldT = 0; }
    /* 电气子步 */
    const nSub = Math.min(4000, Math.ceil(dt / H_STEP));
    const h = dt / nSub;
    for (let k = 0; k < nSub; k++) { elecStep(h); simT += h; }
    /* 载流子粒子 */
    if (iCoil > 0.002 && parts.filter(p => p.col === cCtl).length < 26 && Math.random() < 0.5)
      parts.push({ c: coilLoop, u: Math.random(), s: 0.05 + iCoil * 2.4, col: cCtl, pos: coilLoop.getPointAt(0) });
    if (lampI > 0.5 && parts.length < P_MAX && Math.random() < 0.6)
      parts.push({ c: loadLoop, u: Math.random(), s: 0.09, col: cLoad, pos: loadLoop.getPointAt(0) });
    for (let i = parts.length - 1; i >= 0; i--) {
      if (parts[i].col === cCtl && iCoil < 0.002) parts.splice(i, 1);
      else if (parts[i].col === cLoad && lampI < 0.5) parts.splice(i, 1);
    }
    stepParts(dt * 1.4);
  }
  drawParts();
  /* 场景同步 */
  armPivot.rotation.z = lerp(0.14, -0.045, armP);
  /* 线圈与二极管发光 */
  copperM.emissiveIntensity = clamp(iCoil / 0.04, 0, 1) * 0.55;
  diodeG.visible = diodeOn;
  diodeM.emissive.setHex(0xe8590c);
  diodeM.emissiveIntensity = diodeOn && iCoil > 0.002 && !swPathClosed() ? 0.9 : 0;
  /* 电弧 */
  arc.visible = arcT > 0;
  if (arc.visible) {
    arc.position.set(1.32, lerp(0.965, 0.73, armP) + 0.1, 0);
    arc.scale.setScalar(0.7 + 0.5 * Math.random());
    arcLight.position.copy(arc.position);
    arcLight.intensity = 2.2;
  } else arcLight.intensity = 0;
  /* 弹跳计数老化 */
  if (bounceT > 0.5) bounceN = 0;
  /* 灯泡亮度 */
  lampM.emissiveIntensity = clamp(lampI / 4, 0, 1.2) * 1.6;
  btnStartMesh.position.y = 2.3 + (swStartHeld ? -0.05 : 0);
  btnStopMesh.position.y = 2.3 + (stopHoldT > 0 ? -0.05 : 0);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.08) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
