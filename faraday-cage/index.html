<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>法拉第笼 · 电荷在导体表面重排，内部场归零</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffd43b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e67700;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="法拉第笼 · 电荷在导体表面重排，内部场归零" data-en="Faraday Cage · charges rearrange on the surface, field inside dies">法拉第笼 · 电荷在导体表面重排，内部场归零</h1>
  <div class="sub" data-zh="外电场一压上来，导体里的自由电子瞬间重排：正面堆负电荷、背面留正电荷，这些感应电荷自己产生的场与外场在笼内逐点抵消——合场为零；闪电打在汽车上，人安然无恙，不是橡胶轮胎的功劳，是金属壳的功劳 · 拖动旋转 / 空格运行/暂停" data-en="Apply an external field and the conductor's free electrons rearrange instantly: negatives pile on the near face, positives left behind on the far face; the induced field cancels the external one point by point inside — net field zero; when lightning hits a car the occupant survives thanks to the metal shell, not the rubber tires · drag to orbit / Space = run/pause">外电场一压上来，导体里的自由电子瞬间重排：正面堆负电荷、背面留正电荷，这些感应电荷自己产生的场与外场在笼内逐点抵消——合场为零；闪电打在汽车上，人安然无恙，不是橡胶轮胎的功劳，是金属壳的功劳 · 拖动旋转 / 空格运行/暂停</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-6.5,4.6,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.9,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=80;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.1);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 页面场景 ---- */
/* 笼：网格立方体 */
const cageG=new THREE.Group();cageG.position.set(0,1.8,0);scene.add(cageG);
const wireM=new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.35,metalness:0.85,emissive:0x6b5500,emissiveIntensity:0.15});
const S=2.4,N0=6;
let meshLines=null;
function buildMesh(n){
  if(meshLines)cageG.remove(meshLines);
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=-S/2+i*S/n;
    for(const [a,b] of [[0,-S/2],[0,S/2]]){
      pts.push(a===0?new THREE.Vector3(t,-S/2,b):new THREE.Vector3(t,S/2,b));
      pts.push(a===0?new THREE.Vector3(t,S/2,b):new THREE.Vector3(t,-S/2,b));
    }
    for(const [a,b] of [[-S/2,-S/2],[S/2,S/2]]){
      pts.push(new THREE.Vector3(t,a,b));pts.push(new THREE.Vector3(t,b,a));
    }
    for(const [a,b] of [[-S/2,-S/2],[S/2,S/2]]){
      pts.push(new THREE.Vector3(a,t,b));pts.push(new THREE.Vector3(b,t,a));
    }
  }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  meshLines=new THREE.LineSegments(geo,wireM);
  cageG.add(meshLines);
}
buildMesh(6);
/* 笼内小鸟（演示者） */
const birdG=new THREE.Group();cageG.add(birdG);
const birdBody=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10),new THREE.MeshStandardMaterial({color:0xff8fab,roughness:0.6}));
birdBody.scale.set(1,0.85,1.25);birdG.add(birdBody);
const birdEye=new THREE.Mesh(new THREE.SphereGeometry(0.03,6,6),new THREE.MeshStandardMaterial({color:0x111111}));
birdEye.position.set(0.1,0.08,0.2);birdG.add(birdEye);
const birdEye2=birdEye.clone();birdEye2.position.x=-0.1;birdG.add(birdEye2);
const beak=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.14,6),new THREE.MeshStandardMaterial({color:0xffa94d}));
beak.rotation.x=Math.PI/2;beak.position.set(0,0,0.3);birdG.add(beak);
/* 感应电荷（正/负小球贴面） */
const negM=new THREE.MeshStandardMaterial({color:0x4dabf7,emissive:0x1864ab,emissiveIntensity:0.7});
const posM=new THREE.MeshStandardMaterial({color:0xff6b6b,emissive:0xc92a2a,emissiveIntensity:0.7});
const negG=new THREE.InstancedMesh(new THREE.SphereGeometry(0.075,8,6),negM,120);
const posG=new THREE.InstancedMesh(new THREE.SphereGeometry(0.075,8,6),posM,120);
scene.add(negG,posG);
/* 场线（外场向右）：穿笼外弯曲绕行 */
const NL=11;
const fieldLines=[];
const fieldM=new THREE.LineBasicMaterial({color:0x9fb0c3,transparent:true,opacity:0.7});
for(let i=0;i<NL;i++){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(60*3),3));
  const ln=new THREE.Line(geo,fieldM);
  ln.userData.z=(i/(NL-1)-0.5)*4.4;
  scene.add(ln);fieldLines.push(ln);
}
/* 探针（笼内小球，随合场变色抖动） */
const probe=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),
  new THREE.MeshStandardMaterial({color:0x51cf66,emissive:0x2b8a3e,emissiveIntensity:0.8}));
probe.position.set(0.5,1.4,0.4);scene.add(probe);
/* 雷电：顶部云 + 闪电折线 */
const cloud=new THREE.Mesh(new THREE.SphereGeometry(1.3,14,10),
  new THREE.MeshStandardMaterial({color:0x495057,roughness:0.9,transparent:true,opacity:0.85}));
cloud.position.set(0,6.4,-0.4);cloud.scale.set(1.7,0.8,1.3);cloud.visible=false;scene.add(cloud);
let bolt=null;
function buildBolt(){
  if(bolt)scene.remove(bolt);
  const pts=[];let x=0,z=-0.4;
  for(let y=6.2;y>3.2;y-=0.34){pts.push(new THREE.Vector3(x,y,z));x+=(Math.random()-0.5)*0.5;z+=(Math.random()-0.5)*0.3;}
  pts.push(new THREE.Vector3(0,3.15,-0.4));
  bolt=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xffffff}));
  bolt.visible=false;scene.add(bolt);
}
buildBolt();
/* 电磁波模式：平面波波前圆片序列 */
const waveGs=[];
const waveM2=new THREE.MeshBasicMaterial({color:0x4dabf7,transparent:true,opacity:0.25,side:THREE.DoubleSide});
for(let i=0;i<5;i++){
  const w=new THREE.Mesh(new THREE.CircleGeometry(2.6,32),waveM2);
  w.rotation.y=Math.PI/2;w.position.x=-7;w.visible=false;scene.add(w);waveGs.push(w);
}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('外场 E₀ 推自由电子','External E₀ pushes the free electrons'),new THREE.Vector3(-4.4,4.6,0),'b');
addLabel(()=>L('正面堆负电荷','Negatives pile on the near face'),new THREE.Vector3(-2.6,0.35,0),'b',
  ()=>mode==='static');
addLabel(()=>L('背面留正电荷','Positives left on the far face'),new THREE.Vector3(2.6,0.35,0),'r',
  ()=>mode==='static');
addLabel(()=>L('感应场抵消外场：内部合场 = 0','Induced field cancels: net inside = 0'),new THREE.Vector3(0,3.9,0),'g');
addLabel(()=>L('笼内小鸟：毫发无伤','The bird inside: unharmed'),new THREE.Vector3(1.6,2.3,0.8),'o');
addLabel(()=>L('网格再疏，波长远大于孔径就被挡','Mesh works while λ >> hole size'),new THREE.Vector3(-4.2,1.2,2.2),'y',
  ()=>mode==='wave');

/* ---- 状态 ---- */
let playing=true,labelsOn=true,simT=0;
let mode='static',E0=6,meshN=6;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
function setE(v){E0=v;document.getElementById('sE').value=v;
  document.getElementById('sEVal').textContent=v.toFixed(1)+' kV/m';}
function setMesh(n){meshN=n;buildMesh(n);document.getElementById('sMesh').value=n;
  document.getElementById('sMeshVal').textContent=n+'×';}
function setMode(m){
  mode=m;
  document.getElementById('bStatic').classList.toggle('on',m==='static');
  document.getElementById('bLightning').classList.toggle('on',m==='bolt');
  document.getElementById('bMicrowave').classList.toggle('on',m==='wave');
  cloud.visible=m==='bolt';
  waveGs.forEach(w=>w.visible=m==='wave');
}
/* ---- 步骤 ---- */
const STEPS=[
 {zh:'外电场压向导体：自由电子受力移动',en:'An external field pushes on the conductor: free electrons move'},
 {zh:'电子瞬间重排：正面堆负、背面留正——感应电荷',en:'Electrons rearrange instantly: negatives near, positives far — induced charge'},
 {zh:'感应电荷自己产生一个反向场',en:'The induced charge makes its own opposing field'},
 {zh:'两个场在笼内逐点相消：合场为零',en:'Inside, the two fields cancel point by point: net zero'},
 {zh:'探针放在笼内：指针纹丝不动；小鸟安然无恙',en:'A probe inside: needle dead still; the bird is safe'},
 {zh:'雷击车厢、微波炉门网、MRI 屏蔽室——同一原理',en:'Lightning on cars, microwave door mesh, MRI rooms — one principle'}
];
let activeStep=2;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){
activeStep=i;
  if(i===0){setMode('static');setE(0);}
  else if(i===1){setMode('static');setE(6);}
  else if(i===2){setMode('static');setE(8);}
  else if(i===3){setMode('static');setE(10);}
  else if(i===4){setMode('static');setE(6);}
  else {setMode('wave');setE(6);}
 syncSteps();
}

/* ---- 读数 ---- */
function updateStats(){
document.getElementById('stE').innerHTML=E0.toFixed(1)+'<small> kV/m</small>';
  const inside=document.getElementById('stIn');
  const res=mode==='static'?E0*(1-shieldQ()):E0*(mode==='bolt'?0.02:1-shieldQ());
  inside.innerHTML=(mode==='static'?0:res*0.01).toFixed(3)+'<small> kV/m</small>';
  inside.className='v ok';
  document.getElementById('stQ').innerHTML=(E0*shieldQ()).toFixed(1)+'<small> μC</small>';
  const sh=document.getElementById('stSh');
  sh.innerHTML=(shieldQ()*100).toFixed(1)+'<small> %</small>';
  sh.className='v'+(shieldQ()>0.95?' ok':' warn');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  if(typeof groundM!=='undefined')groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}
/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
/* 感应电荷沿网格面分布：正面密集负电荷，背面正电荷 */
  const m4=new THREE.Matrix4();
  let kn=0,kp=0;
  const ring=[];
  const n=meshN+1;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const t=-S/2+i*S/(n-1),u=-S/2+j*S/(n-1);
    ring.push([-S/2,t,u],[S/2,t,u],[t,-S/2,u],[t,S/2,u],[t,u,-S/2],[t,u,S/2]);
  }
  const w=E0/10;
  for(const [x,y,z] of ring){
    const density=mode==='static'?(x<0?1-w/2*0.2:0.15+w/10*0.3):1;
    const jitter=0.05*Math.sin(simT*7+x*4+y*3+z*2);
    const px=x+(x<0?-0.14:0.14)*(mode==='static'?1:0);
    const onFace=Math.abs(Math.abs(x)-S/2)<0.01||Math.abs(Math.abs(y)-S/2)<0.01||Math.abs(Math.abs(z)-S/2)<0.01;
    if(!onFace)continue;
    if(mode==='static'&&x<0&&kn<120){m4.setPosition(px+jitter,y+jitter,z+jitter);negG.setMatrixAt(kn++,m4);}
    else if(mode==='static'&&x>0&&kp<120){m4.setPosition(px+jitter,y+jitter,z+jitter);posG.setMatrixAt(kp++,m4);}
    else if(mode!=='static'){if(kn<120){m4.setPosition(x+jitter,y+jitter,z+jitter);negG.setMatrixAt(kn++,m4);}if(kp<60&&Math.random()<0.4){m4.setPosition(x,y,z);posG.setMatrixAt(kp++,m4);}}
  }
  negG.count=kn;posG.count=kp;
  negG.instanceMatrix.needsUpdate=true;posG.instanceMatrix.needsUpdate=true;
  negG.visible=posG.visible=E0>0.2;
  /* 场线绕行 */
  fieldLines.forEach((ln,i)=>{
    if(mode==='wave'||!tglFieldEl.checked||E0===0){ln.visible=false;return;}
    ln.visible=true;
    const pos=ln.geometry.attributes.position,z0=ln.userData.z;
    for(let k=0;k<60;k++){
      const x=-6+k/59*12;
      let yy=E0>0? 0:0;
      const dx=x-0,dy=0;
      /* 笼外直线 + 近笼绕行（示意偶极场） */
      const rr=Math.sqrt(x*x+z0*z0+0.4);
      let bend=0;
      if(Math.abs(x)<2.2){
        const s=(2.2-Math.abs(x))/2.2;
        bend=-Math.sign(z0||0.2)*s*s*1.7*Math.sign(z0||0.2)*Math.sign(z0||0.2)*Math.sign(z0||0.2);
        bend=Math.sign(z0||0.2)*s*s*1.7;
      }
      const yTop=2.4;
      let yv;
      if(Math.abs(x)<2.2&&Math.abs(z0)<1.9){
        yv=yTop+bend*(Math.abs(z0)<0.9?1:(1-(Math.abs(z0)-0.9)/1.0*0.6));
      }else yv=yTop*(0.4+0.2*Math.sin(i));
      pos.setXYZ(k,x,yv,z0);
    }
    pos.needsUpdate=true;
    ln.geometry.computeBoundingSphere();
  });
  fieldLines.forEach(l=>l.visible=l.visible&&mode==='static');
  /* 雷击 */
  if(mode==='bolt'){
    bolt.visible=playing&&(Math.sin(simT*2.2)>0.86);
    if(bolt.visible&&Math.random()<0.1)buildBolt();
    wireM.emissiveIntensity=bolt.visible?1.6:0.15;
  }else{bolt.visible=false;wireM.emissiveIntensity=0.15;}
  /* 电磁波波前 */
  if(mode==='wave'){
    waveGs.forEach((w,i)=>{
      w.visible=true;
      w.position.x=-7+((simT*2.4+i/5)%1)*14;
      const inCage=w.position.x>-1.25&&w.position.x<1.25;
      w.material.opacity=inCage?0.04:0.25;
    });
  }
  /* 探针：笼内合场≈0 → 绿色静止；漏磁时变红抖 */
  const leak=mode==='wave'?(meshN<3?0.8:0.06):0.02;
  probe.material.color.setHSL(0.33-leak*0.3,0.7,0.55);
  probe.position.x=0.5+Math.sin(simT*13)*leak*0.3;
  probe.position.y=1.4+Math.cos(simT*17)*leak*0.25;
  probe.visible=tglProbeEl.checked;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
const tglFieldEl=document.getElementById('tglField');
const tglProbeEl=document.getElementById('tglProbe');
function shieldQ(){return clamp(0.982+E0*0.0015-(10-meshN)*0.004,0.9,0.999);}
document.getElementById('bStatic').addEventListener('click',()=>setMode('static'));
document.getElementById('bLightning').addEventListener('click',()=>setMode('bolt'));
document.getElementById('bMicrowave').addEventListener('click',()=>setMode('wave'));
document.getElementById('sE').addEventListener('input',e=>setE(+e.target.value));
document.getElementById('sMesh').addEventListener('input',e=>setMesh(+e.target.value));
document.getElementById('tglField').addEventListener('change',()=>{});
document.getElementById('tglProbe').addEventListener('change',()=>{});
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setE(6);setMesh(6);setMode('static');
syncSteps();updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
