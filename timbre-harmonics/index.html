<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>泛音与音色 · 同一个音高,不同的频谱账本</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#a06ce0;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#7443b8;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(160,108,224,.6);background:rgba(160,108,224,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(116,67,184,.55);background:rgba(116,67,184,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(160,108,224,.10);border-color:rgba(160,108,224,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(116,67,184,.08);border-color:rgba(116,67,184,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#e7daf8}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

  <h1 data-zh="泛音与音色" data-en="Harmonics &amp; Timbre">泛音与音色</h1>
  <div class="sub" data-zh="两端固定的弦只肯驻下 n=1,2,3… 的半波,基频 f₁=v/2L 定音高,泛音全是它的整数倍 f_n=n·f₁;同一个音高,各泛音的幅度包络不同就是音色:在 1/n 处拨弦则 n 次泛音消失,中点拨偶次全消、声音柔暗,靠桥拨高泛音丰富、明亮;频谱就是乐器的指纹,而只有整数倍频率才有共同周期、听感和谐 · 拖动旋转 / 空格运行/暂停" data-en="A string fixed at both ends only holds standing waves of n=1,2,3… half-waves; the fundamental f₁=v/2L sets the pitch and every overtone is an integer multiple f_n=n·f₁; at one and the same pitch, the overtone amplitude envelope is the timbre: pluck at 1/n and the n-th harmonic vanishes, mid-string kills the evens for a soft dark tone, near the bridge rich highs ring bright; the spectrum is the instrument's fingerprint, and only integer multiples share a common period and sound harmonic · drag to orbit / Space = run/pause">两端固定的弦只肯驻下 n=1,2,3… 的半波,基频 f₁=v/2L 定音高,泛音全是它的整数倍 f_n=n·f₁;同一个音高,各泛音的幅度包络不同就是音色:在 1/n 处拨弦则 n 次泛音消失,中点拨偶次全消、声音柔暗,靠桥拨高泛音丰富、明亮;频谱就是乐器的指纹,而只有整数倍频率才有共同周期、听感和谐 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x10131a,20,55);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(0,3.0,10.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.8,-0.1);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.05);keyL.position.set(6,10,8);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-8,5,-6);scene.add(fillL);

/* ── 场景:弦沿 X(-4.2..+4.2, y=1.5),频谱板在身后 z=-1.7 ── */
const XL=-4.2,XR=4.2,SY=1.5,NS=220,NH=6;
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(16,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
/* 琴体与弦枕/琴桥 */
const woodM=new THREE.MeshStandardMaterial({color:0x6b4a2f,roughness:0.8});
const body=new THREE.Mesh(new THREE.BoxGeometry(8.9,1.25,1.0),woodM);
body.position.set(0,0.625,0);scene.add(body);
const postM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.6,metalness:0.3});
for(const px of [XL,XR]){
  const post=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.075,0.55,10),postM);
  post.position.set(px,1.45,0);scene.add(post);
}
/* 合成波形:一条动态更新的亮线 */
const waveGeo=new THREE.BufferGeometry();
waveGeo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(NS*3),3));
const waveMat=new THREE.LineBasicMaterial({color:0xcfa6f7,transparent:true,opacity:0.95,depthTest:false});
const waveLine=new THREE.Line(waveGeo,waveMat);waveLine.renderOrder=8;waveLine.frustumCulled=false;
scene.add(waveLine);
for(let i=0;i<NS;i++){waveGeo.attributes.position.setXYZ(i,XL+(XR-XL)*i/(NS-1),SY,0);}
/* 频谱板 */
const boardG=new THREE.Group();boardG.position.set(0,0,-1.7);scene.add(boardG);
const boardM=new THREE.MeshStandardMaterial({color:0x141a22,transparent:true,opacity:0.34,
  roughness:0.6,side:THREE.DoubleSide,depthWrite:false});
const board=new THREE.Mesh(new THREE.PlaneGeometry(8.9,2.7),boardM);
board.position.set(0,1.9,0);boardG.add(board);
const edgeM=new THREE.LineBasicMaterial({color:0x8fd0e8,transparent:true,opacity:0.5});
boardG.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(8.9,2.7)),edgeM));
const axisM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.4,metalness:0.6});
const axisBar=new THREE.Mesh(new THREE.BoxGeometry(8.9,0.03,0.05),axisM);
axisBar.position.set(0,0.55,0.05);boardG.add(axisBar);
/* 6 根频谱柱 */
const barGeo=new THREE.BoxGeometry(0.85,1,0.55);barGeo.translate(0,0.5,0);
const bars=[];
for(let i=0;i<NH;i++){
  const m=new THREE.MeshStandardMaterial({color:0x8f5cd0,roughness:0.5,metalness:0.15,
    emissive:0x6a35b0,emissiveIntensity:0.4});
  const bar=new THREE.Mesh(barGeo,m);
  bar.position.set(XL+(i+0.5)*(XR-XL)/NH,0.55,0);boardG.add(bar);bars.push(bar);
}
/* 前 6 个泛音的驻波模式(半透明) + 基频包络(虚线) */
const modeLines=[];
for(let n=1;n<=NH;n++){
  const col=new THREE.Color().setHSL(0.66+n*0.05,0.6,0.62);
  const m=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.4});
  const line=new THREE.Line(new THREE.BufferGeometry(),m);line.frustumCulled=false;
  line.position.z=0.55;scene.add(line);modeLines.push(line);
}
const envMat=new THREE.LineDashedMaterial({color:0xa06ce0,dashSize:0.12,gapSize:0.08,
  transparent:true,opacity:0.55});
const envTop=new THREE.Line(new THREE.BufferGeometry(),envMat);envTop.frustumCulled=false;scene.add(envTop);
const envBot=new THREE.Line(new THREE.BufferGeometry(),envMat);envBot.frustumCulled=false;scene.add(envBot);
/* 拨弦点标记 */
const pluckM=new THREE.MeshStandardMaterial({color:0xffc425,roughness:0.4,emissive:0xffc425,emissiveIntensity:0.5});
const pluckDot=new THREE.Mesh(new THREE.SphereGeometry(0.09,14,10),pluckM);scene.add(pluckDot);

/* ── 状态与声学 ── */
let MODE='pos',PCUR=0.25,F1=200,TAUC=1.8,playing=true,labelsOn=true,slowMo=false,modesOn=true;
let tNow=0,dwell=0;
const AMP=new Float32Array(NH);
const SNT=[];                     /* sin(nπu) 采样表 */
for(let n=1;n<=NH;n++){
  const row=new Float32Array(NS);
  for(let i=0;i<NS;i++)row[i]=Math.sin(n*Math.PI*i/(NS-1));
  SNT.push(row);
}
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function calcAmp(){
  for(let n=1;n<=NH;n++){
    AMP[n-1]=MODE==='violin'?1/n:Math.sin(n*Math.PI*PCUR)/(n*n*Math.sin(Math.PI*PCUR));
  }
}
function envN(n){return MODE==='violin'?1:Math.exp(-tNow/(TAUC/Math.sqrt(n)));}
const SUBN=['₁','₂','₃','₄','₅','₆'];

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblNut=addLabel(()=>L('琴枕(固定端)','Nut (fixed end)'),new THREE.Vector3(XL,2.15,0),'b');
const lblBridge=addLabel(()=>L('琴桥(固定端)','Bridge (fixed end)'),new THREE.Vector3(XR,2.15,0),'g');
const lblPluck=addLabel(()=>L(`拨弦点 p=${PCUR.toFixed(2)} L`,`Pluck p=${PCUR.toFixed(2)} L`),
  new THREE.Vector3(0,0,0),'y',()=>MODE!=='violin');
const lblWave=addLabel(()=>L('合成波形 = 各泛音叠加','Composite = sum of harmonics'),new THREE.Vector3(-2.1,2.75,0),'o');
const lblSpec=addLabel(()=>L('频谱:各泛音的幅度 = 音色的账本','Spectrum: overtone amplitudes = the timbre ledger'),
  new THREE.Vector3(0,3.62,-1.7),'o',()=>true,boardG);
const barLbls=[];
for(let i=0;i<NH;i++){
  const lb=addLabel(()=>`f${SUBN[i]} ${Math.round((i+1)*F1)} Hz${AMP[i]<-0.004?' ·π':''}`,
    new THREE.Vector3(XL+(i+0.5)*(XR-XL)/NH,3.32,-1.7),'',()=>true,boardG);
  barLbls.push(lb);
}

/* ── 参数变化 → 重算幅度与静态图元 ── */
function rebuildStatic(){
  calcAmp();
  /* 频谱柱 */
  for(let i=0;i<NH;i++){
    const h=clamp(Math.abs(AMP[i]),0.015,1)*1.9+0.02;
    bars[i].scale.y=h;
    bars[i].material.emissiveIntensity=0.15+Math.abs(AMP[i])*0.9;
    bars[i].material.color.setHex(AMP[i]<-0.004?0x5c7fd0:0x8f5cd0);
  }
  /* 泛音模式线(√压缩动态范围,节点仍精确为 0) */
  for(let n=1;n<=NH;n++){
    const arr=new Float32Array(120*3);
    const ampS=0.17*Math.sign(AMP[n-1]||1)*Math.sqrt(Math.abs(AMP[n-1]));
    for(let i=0;i<120;i++){
      const u=i/119;
      arr[i*3]=XL+(XR-XL)*u;arr[i*3+1]=SY+ampS*Math.sin(n*Math.PI*u);arr[i*3+2]=0;
    }
    modeLines[n-1].geometry.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
    modeLines[n-1].visible=modesOn;
  }
  /* 基频驻波包络(虚线) */
  const e1=0.5*Math.abs(AMP[0]);
  const at=new Float32Array(120*3),ab=new Float32Array(120*3);
  for(let i=0;i<120;i++){
    const u=i/119,s=Math.sin(Math.PI*u);
    at[i*3]=XL+(XR-XL)*u;at[i*3+1]=SY+e1*s;at[i*3+2]=0;
    ab[i*3]=XL+(XR-XL)*u;ab[i*3+1]=SY-e1*s;ab[i*3+2]=0;
  }
  envTop.geometry.setAttribute('position',new THREE.Float32BufferAttribute(at,3));
  envTop.computeLineDistances();
  envBot.geometry.setAttribute('position',new THREE.Float32BufferAttribute(ab,3));
  envBot.computeLineDistances();
  /* 拨弦点 */
  pluckDot.position.set(XL+PCUR*(XR-XL),SY,0);
  pluckDot.visible=MODE!=='violin';
  lblPluck.position.set(XL+PCUR*(XR-XL),SY+0.42,0);
  updateStats();
}
function updateWave(){
  const pos=waveGeo.attributes.position.array;
  for(let i=0;i<NS;i++){
    let y=0;
    for(let n=1;n<=NH;n++){
      const A=AMP[n-1];
      if(A===0)continue;
      y+=A*SNT[n-1][i]*Math.cos(2*Math.PI*n*F1*tNow)*envN(n);
    }
    pos[i*3+1]=SY+y*0.5;
  }
  waveGeo.attributes.position.needsUpdate=true;
}

/* ── 控件 ── */
function syncBtns(){
  document.getElementById('bP1').classList.toggle('on',MODE==='pos'&&Math.abs(PCUR-0.06)<0.006);
  document.getElementById('bP2').classList.toggle('on',MODE==='pos'&&Math.abs(PCUR-0.25)<0.006);
  document.getElementById('bP3').classList.toggle('on',MODE==='pos'&&Math.abs(PCUR-0.5)<0.006);
  document.getElementById('bG').classList.toggle('on',MODE==='guitar');
  document.getElementById('bPn').classList.toggle('on',MODE==='piano');
  document.getElementById('bV').classList.toggle('on',MODE==='violin');
}
function setPos(p){MODE='pos';PCUR=clamp(p,0.05,0.5);
  document.getElementById('sP').value=PCUR;
  document.getElementById('sPVal').textContent=PCUR.toFixed(2)+' L';
  tNow=0;rebuildStatic();syncBtns();}
function setMode(m){MODE=m;
  if(m==='guitar'){PCUR=0.16;TAUC=2.2;}
  else if(m==='piano'){PCUR=0.07;TAUC=1.4;}
  else if(m==='violin'){PCUR=0.12;TAUC=6;}
  document.getElementById('sP').value=PCUR;
  document.getElementById('sPVal').textContent=PCUR.toFixed(2)+' L';
  document.getElementById('sTau').value=TAUC;
  document.getElementById('sTauVal').textContent=TAUC.toFixed(1)+' s';
  tNow=0;rebuildStatic();syncBtns();}
function setF1(f){F1=clamp(f,80,400);
  document.getElementById('sF').value=F1;
  document.getElementById('sFVal').textContent=F1.toFixed(0)+' Hz';
  updateStats();}
function setTau(v){TAUC=clamp(v,0.3,6);
  document.getElementById('sTau').value=TAUC;
  document.getElementById('sTauVal').textContent=TAUC.toFixed(1)+' s';
  updateStats();}

const STEPS=[
 {zh:'<b>弦只驻整数倍半波</b>:两端固定,只有 n=1,2,3… 的驻波模式能存在,别的一概幸存不下来',
  en:'<b>Only integer half-waves survive</b>: fixed ends allow standing modes n=1,2,3… and nothing else',
  act(){setMode('pos');setPos(0.25);setF1(200);setTau(1.8);}},
 {zh:'<b>f₁=v/2L 定音高</b>:弦长与波速定基频——拉低到 110 Hz,所有泛音跟着整体下移',
  en:'<b>f₁=v/2L sets the pitch</b>: length and wave speed fix the fundamental — drop to 110 Hz and every harmonic follows',
  act(){setF1(110);}},
 {zh:'<b>泛音幅度=音色的账本</b>:同一音高,频谱柱的高低各不相同,听起来才不一样',
  en:'<b>Overtone amplitudes are the ledger</b>: same pitch, different bar heights — that is all timbre is',
  act(){setF1(200);}},
 {zh:'<b>拨在 1/10 处</b>:靠桥的高泛音丰富,H₂/H₁≈0.48,音色明亮',
  en:'<b>Pluck at 1/10</b>: near the bridge the highs are rich, H₂/H₁≈0.48 — a bright tone',
  act(){setPos(0.10);}},
 {zh:'<b>拨在中点</b>:偶次泛音正好落在节点上全消,声音柔暗',
  en:'<b>Pluck at the midpoint</b>: even harmonics sit on nodes and vanish — soft and dark',
  act(){setPos(0.5);}},
 {zh:'<b>整数倍才和谐</b>:f_n=n·f₁ 共享周期 1/f₁,合成波每个周期精确重复,听感和谐',
  en:'<b>Integer multiples sound harmonic</b>: f_n=n·f₁ share the period 1/f₁, so the composite repeats exactly',
  act(){setPos(0.25);setF1(220);}},
 {zh:'<b>频谱=乐器指纹</b>:小提琴弓奏出 1/n 的锯齿谱且不衰减——换乐器就是换一本账',
  en:'<b>The spectrum is a fingerprint</b>: a bowed violin holds a 1/n sawtooth spectrum without decay — change instrument, change ledger',
  act(){setMode('violin');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;dwell=0;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('stF').innerHTML=F1.toFixed(0)+'<small> Hz</small>';
  const h2=document.getElementById('stH2');
  h2.innerHTML=Math.abs(AMP[1]).toFixed(2);
  h2.className='v '+(Math.abs(AMP[1])>=0.4?'warn':(Math.abs(AMP[1])<=0.02?'ok':''));
  let sa=0,sw=0;
  for(let n=1;n<=NH;n++){if(Math.abs(AMP[n-1])>0.01){sa+=Math.abs(AMP[n-1]);sw+=n*Math.abs(AMP[n-1]);}}
  const B=sa>0?sw/sa:1;
  const bv=document.getElementById('stB');
  bv.innerHTML=B.toFixed(2);
  bv.className='v '+(B>=2.4?'warn':(B<1.9?'ok':''));
  document.getElementById('stTau').innerHTML=MODE==='violin'?'∞':TAUC.toFixed(1)+'<small> s</small>';
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bP1').addEventListener('click',()=>setPos(0.06));
document.getElementById('bP2').addEventListener('click',()=>setPos(0.25));
document.getElementById('bP3').addEventListener('click',()=>setPos(0.5));
document.getElementById('bG').addEventListener('click',()=>setMode('guitar'));
document.getElementById('bPn').addEventListener('click',()=>setMode('piano'));
document.getElementById('bV').addEventListener('click',()=>setMode('violin'));
document.getElementById('sP').addEventListener('input',e=>setPos(+e.target.value));
document.getElementById('sF').addEventListener('input',e=>setF1(+e.target.value));
document.getElementById('sTau').addEventListener('input',e=>setTau(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglModes').addEventListener('change',e=>{modesOn=e.target.checked;
  modeLines.forEach(l=>{l.visible=modesOn;});});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x10131a:0xece7de);
  scene.fog.color.setHex(dark?0x10131a:0xece7de);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
const DWELL=7;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  if(playing){dwell+=dts;if(dwell>DWELL)applyPhase((activeStep+1)%STEPS.length);}
  tNow+=dts;
  if(MODE!=='violin'&&tNow>Math.min(2.5*TAUC+0.4,9))tNow=0;   /* 自动再次拨弦 */
  updateWave();
  /* 拨弦点脉动 */
  const pd=pluckDot.visible?1+0.35*Math.max(0,Math.sin(tNow*14))*Math.exp(-tNow*2.5):1;
  pluckDot.scale.setScalar(pd);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();calcAmp();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);else applyPhase(1);
rebuildStatic();syncBtns();syncPlayBtn();start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
