<style>
  :root,:root[data-theme="dark"]{

  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}

  #stats .k{font-size:12px;color:var(--text2);align-self:center}

  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}

  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;

  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}

  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const QS=new URLSearchParams(location.search);
let playing=true, labelsOn=true;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,90);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,300);
camera.position.set(7.0,7.2,14.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-3.0,1.4,0); controls.enableDamping=true; controls.dampingFactor=0.08;   // 目标点左移：三机整体右移避开左下面板
controls.minDistance=3; controls.maxDistance=60;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.05); key.position.set(7,11,6); scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3); fill.position.set(-8,5,-7); scene.add(fill);

/* ---- 地面 ---- */
const floorM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const floor=new THREE.Mesh(new THREE.BoxGeometry(42,0.3,14),floorM);
floor.position.y=-0.15; scene.add(floor);
const grid=new THREE.GridHelper(42,42,0x3a4656,0x27303c);
grid.position.y=0.01; scene.add(grid);

/* ---- 物理模型（选型即比转速）----
   出力 P=ηρgQH（取 η=0.92，P 以 kW 计）；射流速度 v=√(2gH)。
   比转速 Ns=n·√P / H^1.25 —— 同一工况给三台候选机各按其典型同步转速算 Ns：
   Pelton n≈500 rpm 频带 8–40；Francis n≈250 rpm 频带 60–300；Kaplan n≈120 rpm 频带 300–1000。
   Ns 落在谁的频带内（否则离带最近）谁当选；离带越远效率跌得越狠（选错机型=长期偏离最优点）。 */
const G=9.81, RHO=1000;
const TYPES=[
  {zh:'Pelton 冲击式',en:'Pelton',n:500,lo:8,hi:40,col:0x4a7fa5},
  {zh:'Francis 混流式',en:'Francis',n:250,lo:60,hi:300,col:0x5a9a6d},
  {zh:'Kaplan 轴流式',en:'Kaplan',n:120,lo:300,hi:1000,col:0xb0785a}
];
let H=250, Q=8;                    // 水头 m / 流量 m³/s
let sel=1, cavOn=false, tourOn=false, tourT=0;
let eta=[0.9,0.9,0.9];
function powerKW(){ return 0.92*RHO*G*Q*H/1000; }
function calcSel(){
  const P=powerKW(), H125=Math.pow(H,1.25);
  let best=0, bestD=1e9;
  for(let i=0;i<3;i++){
    const ns=TYPES[i].n*Math.sqrt(P)/H125;
    const d=ns<TYPES[i].lo?TYPES[i].lo-ns:ns>TYPES[i].hi?ns-TYPES[i].hi:0;
    TYPES[i].nsNow=ns; TYPES[i].dNow=d;
    eta[i]=0.93*clamp(1-d/900,0.30,1);
    if(d<bestD){bestD=d;best=i;}
  }
  sel=best;
}
function share(i){ return i===sel?1:0.22; }

/* ---- 机型编号与工位 ---- */
const SX=[-5.6,0,5.6];             // 三工位 x 坐标（收窄间距，整排避开左下面板）
function stdMat(col,rough=0.45,metal=0.65){ return new THREE.MeshStandardMaterial({color:col,roughness:rough,metalness:metal,transparent:true}); }
const steel=()=>stdMat(0x93a3b2,0.4,0.7);
const dark =()=>stdMat(0x39434f,0.55,0.5);

/* ---- Pelton：卧轴、水斗轮、针阀喷嘴 ---- */
function buildPelton(){
  const g=new THREE.Group(); const mats=[]; const M=(m)=>{mats.push(m);return m;};
  const base=M(dark()); const bm=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.9,1.6),base); bm.position.y=0.45; g.add(bm);
  const bracket=new THREE.Mesh(new THREE.BoxGeometry(0.5,1.4,0.4),M(steel())); bracket.position.set(0,1.2,0); g.add(bracket);
  const wheel=new THREE.Group(); wheel.position.set(0,2.0,0); g.add(wheel);
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.16,24),M(stdMat(0x6b7d8e)));
  disc.rotation.x=Math.PI/2; wheel.add(disc);
  for(let i=0;i<13;i++){                          // 双碗水斗（简化为斜置方块）
    const a=i/13*Math.PI*2;
    const b=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.32,0.36),M(stdMat(0xb9c6d2,0.3,0.75)));
    b.position.set(Math.cos(a)*0.82,Math.sin(a)*0.82,0);
    b.rotation.z=a+Math.PI/2; b.rotation.x=0.6; wheel.add(b);
  }
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,2.6,12),M(steel()));
  shaft.rotation.x=Math.PI/2; shaft.position.set(0,2.0,0); g.add(shaft);
  const noz=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.13,1.3,14),M(stdMat(0x8a97a5)));
  noz.rotation.z=Math.PI/2; noz.position.set(-2.1,2.0,0); g.add(noz);   // 喷嘴水平指右，射流切向打上轮缘
  return {g,mats,wheel};
}
/* ---- Francis：立轴、蜗壳、活动导叶、径向转轴向 ---- */
function buildFrancis(){
  const g=new THREE.Group(); const mats=[]; const M=(m)=>{mats.push(m);return m;};
  const base=M(dark()); const bm=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.7,2.2),base); bm.position.y=0.35; g.add(bm);
  const caseM=M(stdMat(0x74a08a,0.35,0.6)); caseM.side=THREE.DoubleSide;
  const casing=new THREE.Mesh(new THREE.TorusGeometry(1.05,0.3,14,44),caseM);
  casing.rotation.x=Math.PI/2; casing.position.y=1.75; g.add(casing);   // 蜗壳（水平面）
  for(let i=0;i<12;i++){                          // 活动导叶
    const a=i/12*Math.PI*2;
    const v=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.55,0.24),M(stdMat(0xb9c6d2,0.3,0.75)));
    v.position.set(Math.cos(a)*0.72,1.75,Math.sin(a)*0.72);
    v.rotation.y=-a+0.5; g.add(v);
  }
  const crown=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.34,0.14,20),M(stdMat(0x5a9a6d,0.35,0.6)));
  crown.position.y=1.55; g.add(crown);
  const band=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.46,0.42,20,1,true),M(stdMat(0x5a9a6d,0.35,0.6)));
  band.material.side=THREE.DoubleSide; band.position.y=1.3; g.add(band);
  const runner=new THREE.Group(); runner.position.y=0; g.add(runner);   // 转轮整体转
  const blades=[];
  for(let i=0;i<10;i++){
    const a=i/10*Math.PI*2;
    const bl=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.42,0.3),M(stdMat(0xd6e2ea,0.25,0.8)));
    bl.position.set(Math.cos(a)*0.44,1.32,Math.sin(a)*0.44);
    bl.rotation.y=-a+0.7; runner.add(bl); blades.push(bl);
  }
  const draft=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.72,1.1,20,1,true),M(stdMat(0x6db8ff,0.2,0.1)));
  draft.material.side=THREE.DoubleSide; draft.material.opacity=0.16; draft.material.userData.base=0.16; draft.position.y=0.62; g.add(draft);
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,1.6,10),M(steel()));
  shaft.position.set(0,2.55,0); runner.add(shaft);
  return {g,mats,runner};
}
/* ---- Kaplan：立轴、转轮室、可调桨距叶片 ---- */
function buildKaplan(){
  const g=new THREE.Group(); const mats=[]; const M=(m)=>{mats.push(m);return m;};
  const base=M(dark()); const bm=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.6,2.4),base); bm.position.y=0.3; g.add(bm);
  const tubeM=M(stdMat(0x6db8ff,0.2,0.1)); tubeM.side=THREE.DoubleSide; tubeM.opacity=0.16; tubeM.userData.base=0.16;
  const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.95,1.0,3.1,26,1,true),tubeM);
  tube.position.y=1.95; g.add(tube);              // 转轮室（透明剖视）
  const hubM=M(stdMat(0xb0785a,0.35,0.6));
  const hub=new THREE.Mesh(new THREE.CapsuleGeometry(0.26,0.5,6,14),hubM);
  hub.position.y=1.95; g.add(hub);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.26,0.5,14),hubM.clone());
  mats.push(nose.material); nose.rotation.x=Math.PI; nose.position.y=1.5; g.add(nose);
  const runner=new THREE.Group(); runner.position.y=0; g.add(runner);
  const pitchPs=[];
  for(let i=0;i<5;i++){                           // 5 叶可调桨距：绕自身径向轴转动
    const a=i/5*Math.PI*2;
    const arm=new THREE.Group(); arm.position.y=1.95; arm.rotation.y=a; runner.add(arm);
    const bl=new THREE.Mesh(new THREE.BoxGeometry(0.72,0.05,0.26),M(stdMat(0xd6c9a8,0.3,0.7)));
    bl.position.x=0.55; arm.add(bl); pitchPs.push(bl);
  }
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,2.2,10),M(steel()));
  shaft.position.y=3.7; g.add(shaft);
  const gen=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.7,18),M(stdMat(0x39434f,0.5,0.4)));
  gen.position.y=4.9; g.add(gen);
  return {g,mats,runner,pitchPs};
}
const stations=[buildPelton(),buildFrancis(),buildKaplan()];
stations.forEach((s,i)=>{ s.g.position.set(SX[i],0,0); scene.add(s.g); });

/* ---- 水流粒子（InstancedMesh：未用实例零缩放）---- */
const NTOK=270, PER=90;
const tokMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.055,8,6),
  new THREE.MeshBasicMaterial({color:0x6db8ff,transparent:true,opacity:0.85}),NTOK);
tokMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(tokMesh);
const tok=[];
for(let i=0;i<NTOK;i++){
  const st=Math.floor(i/PER);
  tok.push({st,t:Math.random(),th0:Math.random()*6.28,ph:Math.random(),rz:Math.random()});
}
{                                                // 预填全部实例矩阵（?pause=1 时零缩放，避免堆在原点）
  const d0=new THREE.Object3D();
  for(let i=0;i<NTOK;i++){ d0.scale.setScalar(0); d0.updateMatrix(); tokMesh.setMatrixAt(i,d0.matrix); }
  tokMesh.instanceMatrix.needsUpdate=true;
}
function tokenPos(k){                             // 三条水路：射流 / 螺旋径向转轴向 / 轴流
  const T=tok[k], x0=SX[T.st], t=T.t, th=T.th0;
  if(T.st===0){                                   // Pelton：喷嘴→轮缘→反弹抛洒
    if(t<0.4) return [x0-2.6+t/0.4*1.75, 2.0, 0];
    const u=(t-0.4)/0.6, a0=T.ph*1.2-0.6, s=u*2.1;
    return [x0-0.85+Math.cos(a0)*s*0.8, 2.0+Math.sin(a0)*s*0.9-2.4*u*u, (T.rz-0.5)*0.8*u];
  }
  if(T.st===1){                                   // Francis：蜗壳螺旋进入→导叶→转轮转向下→尾水管
    if(t<0.5){ const u=t/0.5, r=1.15-0.66*u, a=th+u*4.4;
      return [x0+Math.cos(a)*r, 1.78-u*0.16, Math.sin(a)*r]; }
    const u=(t-0.5)/0.5, a=th+4.4+u*1.1, r=0.49+0.3*u*u;
    return [x0+Math.cos(a)*r, 1.62-1.56*u, Math.sin(a)*r];
  }
  const u=t, a=th+(t>0.62?(t-0.62)*2.6:t*0.8);    // Kaplan：轴向直进，过叶片后带旋
  const r=0.55+(u>0.85?(u-0.85)*1.1:0);
  return [x0+Math.cos(a)*r, 3.35-3.15*u, Math.sin(a)*r];
}

const NCAV=80;

{                                                // 预填零缩放矩阵

  for(let i=0;i<NCAV;i++){ d1.scale.setScalar(0); d1.updateMatrix(); cavMesh.setMatrixAt(i,d1.matrix); }

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div'); div.className='lbl '+cls;
  const o=new CSS2DObject(div); o.position.copy(pos); parent.add(o);

}
const lbType=[];
for(let i=0;i<3;i++){
  lbType.push(addLabel(()=>L(
    `${TYPES[i].zh}  η ${Math.round(eta[i]*100)}%${i===sel?'  ★当选':''}`,
    `${TYPES[i].en}  η ${Math.round(eta[i]*100)}%${i===sel?'  ★ chosen':''}`),

}
addLabel(()=>L(`射流 v=√(2gH)≈${Math.round(Math.sqrt(2*G*H))} m/s，水斗反弹射流交换动量`,
  `Jet v=√(2gH)≈${Math.round(Math.sqrt(2*G*H))} m/s; buckets reverse it`),
  new THREE.Vector3(SX[0]-1.8,3.4,0),'b',()=>sel===0);
addLabel(()=>L('径向进、轴向出：导叶先降压加速，压强与速度各付一半',
  'Radial in, axial out: pressure and velocity each pay half'),
  new THREE.Vector3(SX[1],3.6,0),'b',()=>sel===1);
addLabel(()=>L(`桨距随流量自调 (${(0.25+0.5*clamp(Q/120,0,1)).toFixed(2)} rad)——低水头就吃大流量`,
  'Blade pitch auto-trims with flow — low head feeds on big Q'),
  new THREE.Vector3(SX[2],3.6,0),'b',()=>sel===2);
const lbCav=addLabel(()=>L('气蚀：低压面气泡溃灭→微射流凿金属（靠吸出高度/安装深度对抗）',
  'Cavitation: bubbles implode into microjets that pit the blades'),
  new THREE.Vector3(0,0.6,0),'r',()=>cavOn);
const lbTour=addLabel(()=>L('选型之旅：水头从 1200 m 滑向 4 m——看当选者换人',
  'Tour: head sweeps 1200 m → 4 m — watch the crown change hands'),
  new THREE.Vector3(0,7.2,0),'o',()=>tourOn);

/* ---- 步骤 ---- */
const STEPS=[
  {zh:'水头与流量：P=ηρgQH——水头给速度，流量给体量，选址先看这两个数',en:'Head & flow: P=ηρgQH — head buys speed, flow buys bulk; read these two first'},
  {zh:'Pelton 冲击式：喷嘴把全部水头变成射流，水斗反弹射流交换动量——高水头小流量',en:'Pelton: nozzle converts the whole head into a jet; buckets reverse it — high head, low flow'},
  {zh:'Francis 混流式：径向进、轴向出，导叶先降压加速——压强与速度各付一半',en:'Francis: radial in, axial out; guide vanes drop pressure first — half pressure, half velocity'},
  {zh:'Kaplan 轴流式：可调桨距螺旋桨扫大流量——低水头大流量之王',en:'Kaplan: variable-pitch propeller sweeps big flow — king of low head, high flow'},
  {zh:'比转速 Ns=n√P/H^1.25：选型总纲——三机型各占一段频带，谁入带谁当选',en:'Specific speed Ns=n√P/H^1.25: the master key — each type owns a band, in-band wins'},
  {zh:'效率 90%+：选对机型都在设计点附近；选错比转速带，效率当场跳水',en:'Efficiency 90%+: right machine stays near BEP; wrong band and η plunges on the spot'},
  {zh:'气蚀：低压面气泡溃灭产生微射流凿蚀叶片——三机型的共同敌人',en:'Cavitation: imploding bubbles shoot microjets that pit blades — the common enemy'},
];
let activeStep=1;
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;gotoStep(i);syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  tourOn=false;
  if(i===1){H=800;Q=2;}
  else if(i===2){H=120;Q=12;}
  else if(i===3){H=8;Q=90;}
  else{H=120;Q=12;}
  if(i===6) cavOn=true;
  calcSel(); syncUI();
}

/* ---- 读数 ---- */
function fmtH(v){ return v>=100?Math.round(v):v>=10?v.toFixed(0):v.toFixed(1); }
function updateStats(){
  document.getElementById('stH').innerHTML=fmtH(H)+'<small> m</small>';
  document.getElementById('stQ').innerHTML=fmtH(Q)+'<small> m³/s</small>';
  const P=powerKW()/1000;
  document.getElementById('stP').innerHTML=(P>=10?P.toFixed(0):P.toFixed(1))+'<small> MW</small>';
  const t=TYPES[sel];
  document.getElementById('stNs').innerHTML=Math.round(t.nsNow)+'<small> → '+t.zh.split(' ')[0]+'</small>';
}
function syncUI(){
  const lH=Math.log10(H), lQ=Math.log10(Q);
  document.getElementById('sH').value=(3.176-lH)/0.02699;
  document.getElementById('sQ').value=(2.7-lQ)/0.0322;
  document.getElementById('sHVal').textContent=fmtH(H)+' m';
  document.getElementById('sQVal').textContent=fmtH(Q)+' m³/s';
  document.getElementById('btnCav').classList.toggle('on',cavOn);
  document.getElementById('btnTour').classList.toggle('on',tourOn);
  lbType.forEach((lb,i)=>{lb.element.className='lbl '+(i===sel?'g':'');});   // addLabel 返回 CSS2DObject 本体
}
/* 滑块（对数刻度）：raw 0–100 → H 3–1500 m, Q 0.3–500 m³/s */
document.getElementById('sH').addEventListener('input',e=>{
  H=Math.pow(10,3.176-(+e.target.value)*0.02699); tourOn=false; calcSel(); syncUI();
});
document.getElementById('sQ').addEventListener('input',e=>{
  Q=Math.pow(10,2.7-(+e.target.value)*0.0322); tourOn=false; calcSel(); syncUI();
});
function preset(h,q){ H=h; Q=q; tourOn=false; calcSel(); syncUI(); }
document.getElementById('btnHi').addEventListener('click',()=>{preset(800,2);activeStep=1;syncSteps();});
document.getElementById('btnMid').addEventListener('click',()=>{preset(120,12);activeStep=2;syncSteps();});
document.getElementById('btnLow').addEventListener('click',()=>{preset(8,90);activeStep=3;syncSteps();});
document.getElementById('btnTour').addEventListener('click',()=>{tourOn=true;tourT=0;syncUI();});
document.getElementById('btnCav').addEventListener('click',()=>{cavOn=!cavOn;syncUI();});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  floorM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';

}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null, acc=0, statAcc=0;
const dummy=new THREE.Object3D();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing){
    if(tourOn){                                    // 招牌：开机自动从高水头巡游到低水头
      tourT+=dt; const u=tourT/9;
      if(u>=1){tourOn=false;syncUI();}
      else{
        H=Math.pow(10,lerp(3.079,0.602,u));        // 1200 m → 4 m
        Q=Math.pow(10,Math.log10(400)-0.9*Math.log10(H));
        calcSel(); if(Math.random()<0.12)syncUI();
      }
    }
    calcSel();
    // 转轮转速：水头给速度，当选者满流量
    stations[0].wheel.rotation.z-=share(0)*(1.4+Math.sqrt(H)*0.3)*dt*3;
    stations[1].runner.rotation.y-=share(1)*(1.2+Math.sqrt(H)*0.22)*dt*3;
    stations[2].runner.rotation.y-=share(2)*(0.8+Math.sqrt(H)*0.16)*dt*3;
    const pitch=0.25+0.5*clamp(Q/120,0,1);
    for(const b of stations[2].pitchPs) b.rotation.x=pitch;
    // 水粒子推进
    const qk=0.35+Q/140;
    for(let k=0;k<NTOK;k++){
      const T=tok[k];
      T.t+=dt*qk*(0.45+share(T.st)*1.3);
      if(T.t>1){T.t=0;T.th0=Math.random()*6.28;T.ph=Math.random();T.rz=Math.random();}
      const p=tokenPos(k);
      const on=(k%PER)<PER*share(T.st);
      dummy.position.set(p[0],p[1],p[2]);
      dummy.scale.setScalar(on?1:0);               // 未用实例零缩放
      dummy.updateMatrix();
      tokMesh.setMatrixAt(k,dummy.matrix);
    }
    tokMesh.instanceMatrix.needsUpdate=true;
    // 气蚀气泡群（跟随当选机型）
    cavMesh.visible=cavOn;
    if(cavOn){
      const cx=SX[sel];
      for(let i=0;i<NCAV;i++){
        const c=cavP[i], pul=0.5+0.5*Math.sin(clock.elapsedTime*c.s*7+c.a*3);
        dummy.position.set(cx+Math.cos(c.a)*c.r*(0.5+c.y), 1.9-c.y*1.4, Math.sin(c.a)*c.r*0.9);
        dummy.scale.setScalar(0.3+pul*0.9);
        dummy.updateMatrix(); cavMesh.setMatrixAt(i,dummy.matrix);
      }
      cavMesh.instanceMatrix.needsUpdate=true;
      lbCav.position.set(SX[sel],0.55,1.2);
    }
    // 明暗：当选者全亮，其余低效暗淡
    for(let i=0;i<3;i++){
      const on=i===sel;
      for(const m of stations[i].mats){ m.opacity=on?(m.userData.base!==undefined?m.userData.base:1):0.26; m.emissive.setHex(on?0xffa94d:0x000000); m.emissiveIntensity=on?0.14:0; }
    }
  }
  statAcc+=dt; if(statAcc>0.1){statAcc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
if(QS.get('pause')==='1')playing=false;
if(QS.get('labels')==='0')labelsOn=false;
const qSpd=QS.get('speed'); if(qSpd){/* 本页无速度滑块：参数保留兼容 */}
document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
document.getElementById('tglLabels').checked=labelsOn;
tourOn=true; tourT=0;                            // 开机自动选型之旅（10 秒内看到两次换人）
calcSel(); syncUI();
applyTheme(); applyLang(); buildSteps(); updateStats(); start();
</script>
