<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水跃 · 超临界流越过 Fr=1</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark; --acc:#38d9a9;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
  }
  :root[data-theme="light"]{
    color-scheme:light; --acc:#0ca678;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;

    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    transition:background .25s;}
  #app{position:fixed;inset:0;} #app canvas{display:block;}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}

    display:inline-flex;align-items:center;justify-content:center;
    text-decoration:none;backdrop-filter:blur(6px);

  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;
    max-width:calc(100vw - 320px);}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;
    text-shadow:0 2px 8px rgba(0,0,0,.6);}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;
    text-shadow:0 1px 4px rgba(0,0,0,.5);}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:11px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
  #stats .k{font-size:12px;color:var(--text2);align-self:center;}
  #stats .v{font-size:19px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  #stats .v.g{color:#38d9a9;}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:384px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto;}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .row label{font-size:12px;color:var(--text2);flex:0 0 90px;}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 42px;text-align:right;}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px;}
  #steps{list-style:none;margin-top:8px;}

  #steps li:hover{background:var(--hover);}
  #steps li.on{background:rgba(56,217,169,.10);border-color:rgba(56,217,169,.45);}
  :root[data-theme="light"] #steps li.on{background:rgba(12,166,120,.08);border-color:rgba(12,166,120,.4);}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3);}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
  #steps li.on .n{background:var(--acc);color:#fff;}
  #steps .t{font-size:12.5px;color:var(--text3);line-height:1.45;}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1;min-width:100px;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);

    transition:border-color .15s,color .15s;}
  .abtn:hover{border-color:var(--acc);color:var(--acc);}
  #abtnRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;
    border-top:1px solid var(--panel-border);}
  #plot{position:fixed;right:18px;bottom:18px;z-index:4;width:330px;height:214px;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    backdrop-filter:blur(6px);padding:8px 10px 6px;}
  #plot h3{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:2px;}
  #plotCv{width:100%;height:calc(100% - 20px);display:block;}
  #formula{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--text2);
    border-top:1px dashed var(--panel-border);padding-top:7px;}
  #formula b{color:var(--text3);font-weight:600;}
  #steps .t b{color:var(--text);font-size:12.5px;}
  #steps li.on .t b{color:#a5f3d0;}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
  @media(max-width:1150px){#plot{display:none;}#stats{bottom:18px;}}
  @media(max-width:900px){#stats{display:none;}}
  @media(max-width:760px){
    #panel{width:calc(100vw - 36px);max-height:55vh;}
    #title{max-width:calc(100vw - 200px);}
    #title h1{font-size:16px;}
  }
</style>

<body>

  <div class="sub" data-zh="超临界流越过弗劳德数 Fr=1 的临界点，突变成深而慢的亚临界流" data-en="Supercritical flow crosses Fr=1 and abruptly becomes deep, slow subcritical flow">超临界流越过弗劳德数 Fr=1 的临界点，突变成深而慢的亚临界流</div>
</div>
<div id="stats">

  <canvas id="plotCv"></canvas>
</div>
<div id="panel">
  <div class="row">
    <label data-zh="Fr₁ 弗劳德数" data-en="Fr₁ Froude">Fr₁ 弗劳德数</label>

    <span class="val" id="frVal">4.5</span>
  </div>
  <ol id="steps"></ol>
  <div id="formula"></div>
  <div id="abtnRow">
    <button class="abtn" id="btnUndular" data-zh="微波水跃" data-en="Undular">微波水跃</button>
    <button class="abtn" id="btnSteady" data-zh="稳定水跃" data-en="Steady">稳定水跃</button>
    <button class="abtn" id="btnStrong" data-zh="强水跃" data-en="Strong">强水跃</button>
    <button class="abtn" id="btnStilling" data-zh="消能池" data-en="Stilling basin">消能池</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,200);
camera.position.set(0,5,14);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.5,0);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=5; controls.maxDistance=30;
scene.add(new THREE.HemisphereLight(0x9db4d6,0x2c3038,0.7));
const key=new THREE.DirectionalLight(0xffffff,2.0);
key.position.set(4,8,6); scene.add(key);
const fill=new THREE.DirectionalLight(0x8fb0ff,0.45);
fill.position.set(-6,3,-5); scene.add(fill);
const CLEN=12,CW=2.2,JUMP_X=1.5,y1b=0.5,g=9.81;
const floorMat=new THREE.MeshStandardMaterial({color:0x2a3545,roughness:0.85});
const floor=new THREE.Mesh(new THREE.BoxGeometry(CLEN,0.2,CW),floorMat);
floor.position.set(0,-0.1,0); scene.add(floor);
const wallMat=new THREE.MeshStandardMaterial({color:0x39424f,roughness:0.7,transparent:true,opacity:0.38,side:THREE.DoubleSide});
for(const z of [-CW/2,CW/2]){
  const w=new THREE.Mesh(new THREE.BoxGeometry(CLEN,5,0.08),wallMat);
  w.position.set(0,2.5,z); scene.add(w);
}
const gateMat=new THREE.MeshStandardMaterial({color:0x607080,roughness:0.4,metalness:0.7});
const gate=new THREE.Mesh(new THREE.BoxGeometry(0.18,4,CW+0.2),gateMat);
gate.position.set(-5.5,2,0); scene.add(gate);
let Fr1=4.5;
function conjugate(fr){return(Math.sqrt(1+8*fr*fr)-1)/2;}
function energyLoss(y1,y2){const d=y2-y1;return d*d*d/(4*y1*y2);}
function jumpType(fr){
  if(fr<1.7)return{en:'Undular',zh:'微波水跃',col:0x74c0fc};
  if(fr<2.5)return{en:'Weak',zh:'弱水跃',col:0xa9e34b};
  if(fr<4.5)return{en:'Oscillating',zh:'振荡水跃',col:0xffd43b};
  if(fr<9)return{en:'Steady',zh:'稳定水跃',col:0xff922b};
  return{en:'Strong',zh:'强水跃',col:0xff6b6b};
}
const surfacePts=40;
const surfaceGeo=new THREE.BufferGeometry();
const surfacePos=new Float32Array((surfacePts+1)*3);
surfaceGeo.setAttribute('position',new THREE.BufferAttribute(surfacePos,3));
const surfaceMat=new THREE.LineBasicMaterial({color:0x74c0fc,linewidth:2});
const surfaceLine=new THREE.Line(surfaceGeo,surfaceMat);
scene.add(surfaceLine);
const eglGeo=new THREE.BufferGeometry();
const eglPos=new Float32Array((surfacePts+1)*3);
eglGeo.setAttribute('position',new THREE.BufferAttribute(eglPos,3));
const eglMat=new THREE.LineDashedMaterial({color:0xffd43b,dashSize:0.3,gapSize:0.15,linewidth:1});
const eglLine=new THREE.Line(eglGeo,eglMat);
scene.add(eglLine);
const NPART=220;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(NPART*3);
const pCol=new Float32Array(NPART*3);
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pMat=new THREE.PointsMaterial({size:0.12,vertexColors:true,transparent:true,opacity:0.85,sizeAttenuation:true});
const particles=new THREE.Points(pGeo,pMat);
scene.add(particles);
const px=new Float32Array(NPART),py=new Float32Array(NPART),pz=new Float32Array(NPART);
const pvx=new Float32Array(NPART),pvy=new Float32Array(NPART),pvz=new Float32Array(NPART);
const XMIN=-CLEN/2+0.3,XMAX=CLEN/2-0.3,ZJUMP=JUMP_X;
function initParticle(i){
  const side=Math.random()<0.5?-1:1;
  const upstream=Math.random()>0.3;
  if(upstream){
    px[i]=XMIN+Math.random()*(ZJUMP-XMIN-0.5);
    const y2r=conjugate(Fr1);
    py[i]=Math.random()*y1b*0.9;
    pvx[i]=0.05+Math.random()*0.04;
    pvy[i]=(Math.random()-0.5)*0.01;
  } else {
    px[i]=ZJUMP+0.5+Math.random()*(XMAX-ZJUMP-1);
    const y2r=conjugate(Fr1);
    py[i]=Math.random()*y1b*y2r*0.9;
    pvx[i]=0.005+Math.random()*0.01;
    pvy[i]=(Math.random()-0.5)*0.02;
  }
  pz[i]=(Math.random()-0.5)*(CW*0.8);
  pvz[i]=(Math.random()-0.5)*0.005;
}
for(let i=0;i<NPART;i++)initParticle(i);
function updateSurface(){
  const ratio=conjugate(Fr1);
  const y2=y1b*ratio;
  const xJump=ZJUMP;
  for(let i=0;i<=surfacePts;i++){
    const t=i/surfacePts;
    const xw=XMIN+t*(XMAX-XMIN);
    let yw;
    if(xw<xJump-0.5){yw=y1b;}
    else if(xw<xJump+0.5){
      const blend=(xw-(xJump-0.5))/1.0;
      const ease=blend*blend*(3-2*blend);
      yw=y1b+(y2-y1b)*ease+(Fr1>4?Math.sin((xw-xJump)*4)*0.06*(1-ease):0);
    } else {yw=y2;}
    surfacePos[i*3]=xw; surfacePos[i*3+1]=yw; surfacePos[i*3+2]=0;
    const v1=Fr1*Math.sqrt(g*y1b);
    const E1=y1b+v1*v1/(2*g);
    const v2=v1*(y1b/y2);
    const E2=y2+v2*v2/(2*g);
    const Ex=(xw<xJump)?E1:E2+(E1-E2)*Math.max(0,(xJump+0.5-xw));
    eglPos[i*3]=xw; eglPos[i*3+1]=Math.min(Ex,5); eglPos[i*3+2]=0.05;
  }
  surfaceGeo.attributes.position.needsUpdate=true;
  eglGeo.attributes.position.needsUpdate=true;
  eglLine.computeLineDistances();
}
function stepParticles(dt){
  const ratio=conjugate(Fr1);
  const y2=y1b*ratio;
  const v1Up=Fr1*Math.sqrt(g*y1b)*0.12;
  const v2Dn=v1Up*(y1b/y2);
  for(let i=0;i<NPART;i++){
    const inUpstream=px[i]<ZJUMP-0.5;
    const inJump=px[i]>=ZJUMP-0.5&&px[i]<=ZJUMP+0.8;
    const surfH=inUpstream?y1b:(inJump?y1b+(y2-y1b)*((px[i]-(ZJUMP-0.5))/1.3):y2);
    if(inJump){
      pvx[i]+=(Math.random()-0.5)*0.04*Fr1*0.1;
      pvy[i]+=(Math.random()-0.5)*0.06*Fr1*0.1;
      pvz[i]+=(Math.random()-0.5)*0.03;
    } else if(inUpstream){
      pvx[i]+=(v1Up-pvx[i])*0.05;
      pvy[i]*=0.92;
    } else {
      pvx[i]+=(v2Dn-pvx[i])*0.05;
      pvy[i]*=0.92;
    }
    px[i]+=pvx[i]*dt*60;
    py[i]+=pvy[i]*dt*60;
    pz[i]+=pvz[i]*dt*60;
    if(py[i]<0.02)py[i]=0.02;
    if(py[i]>surfH)py[i]=surfH*0.98;
    if(Math.abs(pz[i])>CW*0.45)pz[i]*=0.9;
    if(px[i]>XMAX||px[i]<XMIN)initParticle(i);
    pPos[i*3]=px[i]; pPos[i*3+1]=py[i]; pPos[i*3+2]=pz[i];
    const u=inUpstream?1:0;
    const isJumpPart=inJump;
    if(isJumpPart){pCol[i*3]=1;pCol[i*3+1]=1;pCol[i*3+2]=1;}
    else if(u>0.5){pCol[i*3]=1;pCol[i*3+1]=0.65;pCol[i*3+2]=0.1;}
    else{pCol[i*3]=0.25;pCol[i*3+1]=0.7;pCol[i*3+2]=1;}
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
}
const STEPS=[
  {b:'弗劳德数：Fr=v/√(gd)',be:'Froude number Fr=v/√(gd) > 1',
   d:'超过 1 代表流速超过了重力波传播速度',de:'flow moves faster than gravity wave speed'},
  {b:'超临界流：流速快、水深浅',be:'Supercritical flow: fast and shallow',
   d:'像子弹射出水道，扰动不能向上游传播',de:'disturbances cannot propagate upstream'},
  {b:'共轭水深：y₂/y₁=(√(1+8Fr₁²)−1)/2',be:'Conjugate depths: y₂/y₁=(√(1+8Fr₁²)−1)/2',
   d:'跃前后水深比由弗劳德数唯一确定',de:'depth ratio determined solely by Froude number'},
  {b:'能量耗散：ΔE=(y₂−y₁)³/(4y₁y₂)',be:'Energy dissipation: ΔE=(y₂−y₁)³/(4y₁y₂)',
   d:'水跃把动能变成热与湍流',de:'jump converts kinetic energy to heat/turbulence'},
  {b:'水跃分类：Fr<1.7 微波；4.5–9 稳定；>9 强',be:'Jump types: Fr<1.7 undular; 4.5–9 steady; >9 strong',
   d:'稳定水跃是工程消能的首选类型',de:'steady jump is preferred for energy dissipation'},
  {b:'消能池：坝下溢洪道末端消能',be:'Stilling basin: dissipates floodwater energy below dam',
   d:'用水跃把高速洪水消能，保护下游河床',de:'hydraulic jump protects downstream riverbed'},
];
function buildSteps(){
  const el=document.getElementById('steps');
  el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b> ${L(s.d,s.de)}</span>`;
    el.appendChild(li);
  });
}
function updateFormula(){
  const ratio=conjugate(Fr1);
  const y2=y1b*ratio;
  const v1=Fr1*Math.sqrt(g*y1b);
  const v2=v1*(y1b/y2);
  const E1=y1b+v1*v1/(2*g);
  const dE=energyLoss(y1b,y2);
  const lossP=(dE/E1*100).toFixed(1);
  const jt=jumpType(Fr1);
  document.getElementById('formula').innerHTML=
    `<b>${L('共轭水深','Conjugate depths')}:</b> y₂/y₁ = (√(1+8·Fr₁²)−1)/2 = <b>${ratio.toFixed(2)}</b><br>`+
    `<b>${L('能量损失','Energy loss')}:</b> ΔE=(y₂−y₁)³/(4y₁y₂) = <b>${(dE*100).toFixed(0)} cm</b>  (${lossP}%)<br>`+
    `<b>${L('水跃类型','Jump type')}:</b> Fr₁=${Fr1.toFixed(1)} → <b>${L(jt.zh,jt.en)}</b>`;
}
function drawPlot(){
  const cv=document.getElementById('plotCv');
  if(!cv)return;
  const W=cv.parentElement.clientWidth-20, H=cv.parentElement.clientHeight-22;
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  const isDark=THEME==='dark';
  ctx.clearRect(0,0,W,H);
  const xm=38,xr=W-10,ym=8,yb=H-20;
  const maxFr=12, maxRatio=conjugate(12)+0.5;
  const xs=v=>(xm+(v/maxFr)*(xr-xm));
  const ys=v=>(yb-((v-0)/maxRatio)*(yb-ym));
  ctx.strokeStyle=isDark?'rgba(255,255,255,.1)':'rgba(0,0,0,.1)';
  ctx.lineWidth=1;
  for(let f=0;f<=12;f+=2){ctx.beginPath();ctx.moveTo(xs(f),ym);ctx.lineTo(xs(f),yb);ctx.stroke();}
  const ratioTicks=[1,3,5,7,9];
  for(const r of ratioTicks){if(r<=maxRatio){ctx.beginPath();ctx.moveTo(xm,ys(r));ctx.lineTo(xr,ys(r));ctx.stroke();}}
  ctx.fillStyle=isDark?'rgba(158,176,195,.7)':'rgba(60,80,100,.7)';
  ctx.font='9px system-ui'; ctx.textAlign='center';
  for(let f=0;f<=12;f+=2) ctx.fillText(f,xs(f),H-5);
  ctx.textAlign='right';
  for(const r of ratioTicks) if(r<=maxRatio) ctx.fillText(r,xm-3,ys(r)+3);
  ctx.strokeStyle=isDark?'#74c0fc':'#1864ab'; ctx.lineWidth=2;
  ctx.beginPath();
  for(let f=1.0;f<=12;f+=0.15){
    const r=conjugate(f);
    f<=1.05?ctx.moveTo(xs(f),ys(r)):ctx.lineTo(xs(f),ys(r));
  }
  ctx.stroke();
  const curRatio=conjugate(Fr1);
  ctx.fillStyle='#ffa94d';
  ctx.beginPath(); ctx.arc(xs(Fr1),ys(curRatio),5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=isDark?'rgba(158,176,195,.8)':'rgba(50,70,90,.8)';
  ctx.font='9.5px system-ui'; ctx.textAlign='left';
  ctx.fillText(L('Bélanger 方程  y₂/y₁=(√(1+8Fr₁²)−1)/2','Bélanger: y₂/y₁=(√(1+8Fr₁²)−1)/2'),xm+4,ym+11);
}

  const ratio=conjugate(Fr1);
  const y2=y1b*ratio;
  const v1=Fr1*Math.sqrt(g*y1b);
  const v2=v1*(y1b/y2);
  const Fr2=v2/Math.sqrt(g*y2);
  const E1=y1b+v1*v1/(2*g);
  const dE=energyLoss(y1b,y2);
  const lossP=(dE/E1*100);
  document.getElementById('stFr1').textContent=Fr1.toFixed(1);
  document.getElementById('stFr2').textContent=Fr2.toFixed(2);
  document.getElementById('stRatio').textContent=ratio.toFixed(2);
  document.getElementById('stLoss').textContent=lossP.toFixed(0)+'%';
  const jt=jumpType(Fr1);
  surfaceMat.color.set(jt.col);
}
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='light'?0xeef1f6:0x10141b);
  floorMat.color.set(THEME==='light'?0xc8d2e0:0x2a3545);
  drawPlot();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'中':'EN';
  document.title=L('水跃·超临界流','Hydraulic Jump');
  buildSteps(); updateFormula(); drawPlot();
}
document.getElementById('themeBtn').addEventListener('click',()=>{
  THEME=THEME==='dark'?'light':'dark';
  localStorage.setItem('htw-theme',THEME); applyTheme();
});
document.getElementById('langBtn').addEventListener('click',()=>{
  LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('htw-lang',LANG); applyLang();
});
const frSlider=document.getElementById('frSlider');
const frVal=document.getElementById('frVal');
frSlider.addEventListener('input',()=>{
  Fr1=parseFloat(frSlider.value);
  frVal.textContent=Fr1.toFixed(1);
  updateStats(); updateSurface(); updateFormula(); drawPlot();
  for(let i=0;i<NPART;i++)initParticle(i);
});
document.getElementById('btnUndular').addEventListener('click',()=>{frSlider.value=1.3;frSlider.dispatchEvent(new Event('input'));});
document.getElementById('btnSteady').addEventListener('click',()=>{frSlider.value=6.0;frSlider.dispatchEvent(new Event('input'));});
document.getElementById('btnStrong').addEventListener('click',()=>{frSlider.value=11.0;frSlider.dispatchEvent(new Event('input'));});
document.getElementById('btnStilling').addEventListener('click',()=>{frSlider.value=4.5;frSlider.dispatchEvent(new Event('input'));});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  drawPlot();
});
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);
  stepParticles(dt);
  controls.update();
  renderer.render(scene,camera);
}
updateSurface(); updateStats(); updateFormula(); applyTheme(); applyLang();
requestAnimationFrame(frame);
</script>
</body>
