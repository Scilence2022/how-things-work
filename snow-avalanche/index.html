<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>雪崩 · 弱层剪断的一瞬</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.ok{color:#7bd88f}#stats .v.warn{color:#ffd43b}#stats .v.bad{color:#ff6b6b}
  :root[data-theme="light"] #stats .v.warn{color:#d98f00}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="雪崩 · 弱层剪断的一瞬" data-en="Snow Avalanche · When the Weak Layer Shears">雪崩 · 弱层剪断的一瞬</h1>
  <div class="sub" data-zh="雪坡是千层饼:新雪/老雪之间夹着剪力最弱的霜晶弱层;坡度 25°–50° 是危险窗,触发让弱层剪断,裂纹横向劈开、整片雪板滑出,裹气加速到 100 km/h,粉雪云还冲在前头 · 拖动旋转 / 空格运行/暂停" data-en="A snowpack is a layer cake: a hoar weak layer with the least shear strength hides between slabs; 25°–50° is the danger window. A trigger shears the weak layer, the crack snaps across the slope, the whole slab rides, entrains air to 100 km/h — with the powder cloud outrunning it · drag to orbit / Space = run/pause">雪坡是千层饼：新雪/老雪之间夹着剪力最弱的霜晶弱层；坡度 25°–50° 是危险窗，触发让弱层剪断，裂纹横向劈开、整片雪板滑出，裹气加速到 100 km/h，粉雪云还冲在前头 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="坡角 θ" data-en="Slope angle θ">坡角 θ</span><span class="v" id="stTh">—</span>
  <span class="k" data-zh="雪板厚度" data-en="Slab depth">雪板厚度</span><span class="v" id="stSl">—</span>
  <span class="k" data-zh="弱层安全系数" data-en="Safety factor">弱层安全系数</span><span class="v" id="stSF">—</span>
  <span class="k" data-zh="雪流速度" data-en="Flow speed">雪流速度</span><span class="v" id="stV">—</span>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnSki" data-zh="触发(滑雪者)" data-en="Trigger (skier)">触发(滑雪者)</button>
    <button class="abtn" id="btnBomb" data-zh="炸药触发" data-en="Explosive trigger">炸药触发</button>
    <button class="abtn" id="btnShed" data-zh="雪棚对照" data-en="Snow shed">雪棚对照</button>
    <button class="abtn" id="btnReset" data-zh="重置坡面" data-en="Reset slope">重置坡面</button>
  </div>
  <div class="row">
    <label data-zh="坡角 θ" data-en="Slope angle">坡角 θ</label>
    <input id="sTh" type="range" min="15" max="55" step="1" value="35">
    <span class="val" id="sThVal">35°</span>
  </div>
  <div class="row">
    <label data-zh="新雪载荷" data-en="New snow load">新雪载荷</label>
    <input id="sLoad" type="range" min="0" max="60" step="5" value="30">
    <span class="val" id="sLoadVal">30 cm</span>
  </div>
  <div class="row">
    <label data-zh="时间慢放" data-en="Slow-motion">时间慢放</label>
    <input id="sSlow" type="range" min="0.1" max="1" step="0.05" value="0.4">
    <span class="val" id="sSlowVal">0.40×</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSpin" type="checkbox"> <span data-zh="自动环绕" data-en="Auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../glacier-flow/" data-zh="冰川流动:雪变冰的长镜头" data-en="glacier flow: the long cut from snow to ice">冰川流动</a>
    <a href="../sand-dunes/" data-zh="沙丘:颗粒坡面的休止角" data-en="sand dunes: angle of repose on grain slopes">沙丘</a>
    <a href="../river-meander/" data-zh="河曲:另一个会搬运颗粒的坡面系统" data-en="river meanders: another slope that moves grains">河曲</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* 板状雪崩(1 场景单位 = 1 m)
   分层:新雪/雪板 —— 弱层(霜晶,剪强 τ_f≈800 Pa) —— 老雪/基雪
   危险坡度窗 25°–50°:<25° 摩擦锁住(τ=ρgh·sinθ 打不过 μ),>50° 只溜小雪
   安全系数 SF=τ_f/(ρ·g·h·sinθ),新增载荷加大 h → SF<1 一触即发
   运动:a=g(sinθ−μcosθ);板状启动 μ≈0.47,破碎卷气后 μ≈0.12,速度可达 ~100 km/h
   粉雪云:裹气悬浮,阻力大、前锋超前于密实雪流;防治:雪棚/人工放雪崩 */

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const D2R=Math.PI/180;
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---------- 渲染器 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x9db4c8,120,340);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,700);
camera.position.set(6,22,62);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(40,-18,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=8;controls.maxDistance=260;controls.autoRotateSpeed=0.3;

scene.add(new THREE.HemisphereLight(0xdfeaf5,0x5a6470,0.9));
const sun=new THREE.DirectionalLight(0xfff0d8,1.1);sun.position.set(-50,80,40);scene.add(sun);

/* ---------- 状态 ---------- */
const G=9.8,X1=55,LEN=150,X_CROWN=10,X_SLABEND=26,TAU_F=800,RHO=250;
let theta=35,load=30,slowK=0.4;
let playing=true,labelsOn=true,shedOn=false;
let state='ready';          /* ready → crack → slide → done */
let simT=0,skierX=3,skierOn=false,vF=0,slabX=0,frontX=0,crackT=0,flash=0;
let playingInit=!(qs.get('pause')==='1');
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){const v=parseFloat(qs.get('speed'));if(Number.isFinite(v))slowK=clamp(v,0.1,1);}
function slabDepth(){return 0.35+load/100*0.6;}
function safety(){return TAU_F/(RHO*G*slabDepth()*Math.sin(theta*D2R));}
function slopeY(x){const t=Math.tan(theta*D2R);
  return x<=X1?-t*x:-t*X1-Math.tan(4*D2R)*(x-X1);}
function angAt(x){return x<X1?theta:4;}

/* ---------- 地形 ---------- */
const terrGeo=new THREE.PlaneGeometry(LEN,34,150,4);
terrGeo.rotateX(-Math.PI/2);terrGeo.translate(LEN/2,0,0);
const terrM=new THREE.MeshStandardMaterial({color:0xe9eef5,roughness:0.94});
const terr=new THREE.Mesh(terrGeo,terrM);scene.add(terr);
function buildTerrain(){
  const p=terrGeo.attributes.position;
  for(let i=0;i<p.count;i++)p.setY(i,slopeY(p.getX(i)));
  p.needsUpdate=true;terrGeo.computeVertexNormals();
}
/* 公路(被保护对象) */
const road=new THREE.Mesh(new THREE.BoxGeometry(14,0.3,10),new THREE.MeshStandardMaterial({color:0x3c434c,roughness:0.9}));
scene.add(road);
function placeRoad(){
  const rx=104;
  road.position.set(rx,slopeY(rx)+0.05,0);
}
/* 雪棚(斜顶导流楔) */
const shed=new THREE.Group();
{
  const roof=new THREE.Mesh(new THREE.BoxGeometry(12,0.5,10),new THREE.MeshStandardMaterial({color:0x8f9aa6,roughness:0.5,metalness:0.4}));
  roof.rotation.z=32*D2R;shed.add(roof);
  for(const dz of [-4,4]){
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,4,8),new THREE.MeshStandardMaterial({color:0x6b7480}));
    post.position.set(2,-2,dz);shed.add(post);
  }
}
shed.visible=false;scene.add(shed);
function placeShed(){
  const sx=78;
  shed.position.set(sx,slopeY(sx)+2.4,0);
}

/* ---------- 雪板 + 分层 + 裂纹线 ---------- */
const slabG=new THREE.Group();
scene.add(slabG);
const slab=new THREE.Mesh(new THREE.BoxGeometry(16,1,22),new THREE.MeshStandardMaterial({color:0xf6f9ff,roughness:0.85}));
slabG.add(slab);
/* 弱层(霜晶)与老雪层(截面示意,留在坡上) */
const weak=new THREE.Mesh(new THREE.BoxGeometry(17,0.35,22),new THREE.MeshStandardMaterial({color:0xb9c2cc,roughness:0.9}));
const old=new THREE.Mesh(new THREE.BoxGeometry(17,0.9,22),new THREE.MeshStandardMaterial({color:0xd8e2ee,roughness:0.95}));
scene.add(weak,old);
/* 裂纹线(发光,沿坡顶横劈) */
const crack=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.16,22),new THREE.MeshBasicMaterial({color:0x8fd3ff,transparent:true,opacity:0}));
slabG.add(crack);
crack.position.x=-8.4;crack.position.y=0.42;
function placeSlab(){
  const y=slopeY(18),rot=-theta*D2R;
  slabG.position.set(18,y,0);slabG.rotation.z=rot;
  const d=slabDepth();
  slab.scale.set(1,d,1);slab.position.y=d/2;
  weak.position.set(18,y-d/2-0.18,0);weak.rotation.z=rot;
  old.position.set(18,y-d/2-0.85,0);old.rotation.z=rot;
}

/* ---------- 破碎块(InstancedMesh) ---------- */
const NC2=90;
const chunkM=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({color:0xf2f6fc,roughness:0.85}),NC2);
chunkM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(chunkM);
const chunks=[];
for(let i=0;i<NC2;i++){
  chunks.push({x:0,y:0,z:0,v:0,vz:0,rest:false,s:0.55+Math.random()*0.6});
  chunkM.setMatrixAt(i,new THREE.Matrix4().makeScale(0,0,0));
}
chunkM.instanceMatrix.needsUpdate=true;
const zeroM=new THREE.Matrix4().makeScale(0,0,0);
const tmpM=new THREE.Matrix4(),tmpQ=new THREE.Quaternion(),tmpS=new THREE.Vector3(),tmpP=new THREE.Vector3();
function spawnChunks(){
  let ci=0;
  for(let i=0;i<NC2;i++){
    const c=chunks[i];
    c.x=X_CROWN+2+Math.random()*13;
    c.y=slopeY(c.x)+slabDepth()*0.6;
    c.z=(Math.random()-0.5)*20;
    c.v=vF*(0.85+Math.random()*0.4);
    c.vz=(Math.random()-0.5)*2.2;
    c.rest=false;
    tmpP.set(c.x,c.y,c.z);tmpQ.identity();tmpS.set(c.s,c.s*0.8,c.s);
    tmpM.compose(tmpP,tmpQ,tmpS);
    chunkM.setMatrixAt(i,tmpM);
    ci++;
  }
  chunkM.instanceMatrix.needsUpdate=true;
}

/* ---------- 粉雪云 ---------- */
const NP=420;
const pwGeo=new THREE.BufferGeometry();
const pwPos=new Float32Array(NP*3),pwVel=new Float32Array(NP*3),pwLife=new Float32Array(NP);
for(let i=0;i<NP;i++){pwLife[i]=-1;pwPos[i*3+1]=999;}
pwGeo.setAttribute('position',new THREE.BufferAttribute(pwPos,3));
const pw=new THREE.Points(pwGeo,new THREE.PointsMaterial({color:0xffffff,size:1.5,transparent:true,opacity:0.5,depthWrite:false,blending:THREE.AdditiveBlending}));
pw.frustumCulled=false;scene.add(pw);
function spawnPowder(x,y,z,n){
  for(let i=0;i<NP&&n>0;i++){
    if(pwLife[i]>=0)continue;
    n--;
    pwLife[i]=1.6+Math.random()*1.8;
    pwPos[i*3]=x;pwPos[i*3+1]=y+Math.random()*3;pwPos[i*3+2]=z+(Math.random()-0.5)*10;
    pwVel[i*3]=vF*0.45*(0.7+Math.random()*0.6);
    pwVel[i*3+1]=1.2+Math.random()*2.2;
    pwVel[i*3+2]=(Math.random()-0.5)*3;
  }
}

/* ---------- 标签 ---------- */
const labelReg=[];
let notifyT=0,notifyZ='',notifyE='';
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});
  div.textContent=textFn();
  return o;
}
const labSlab=addLabel(()=>L('雪板:新雪+老雪,整体性好的千层饼上层','Slab: cohesive new+old snow, the cake\'s top layer'),new THREE.Vector3(),'b');
const labWeak=addLabel(()=>L('弱层:霜晶,剪切强度最低,失败从这里开始','Weak layer: depth hoar, least shear — failure starts here'),new THREE.Vector3(),'r');
const labWin=addLabel(()=>L('危险坡度窗 25°–50°:<25° 留得住,>50° 只溜小雪','Danger window 25°–50°: holds below, only sluffs above'),new THREE.Vector3(),'o',()=>theta>=25&&theta<=50);
const labGentle=addLabel(()=>L('坡度太缓:摩擦锁住,雪板停住','Too gentle: friction locks — the slab stalls'),new THREE.Vector3(),'g',()=>theta<25);
const labSteep=addLabel(()=>L('超过 50°:雪挂不住,只会一层层溜走','Above 50°: snow won\'t stay — it sluffs layer by layer'),new THREE.Vector3(),'b',()=>theta>50);
function updLabelPos(){
  /* 锚点取 x=24:避开左下面板(投影 ~500px),仍指在雪板范围内 */
  labSlab.position.set(24,slopeY(24)+3.8,0);
  labWeak.position.set(24,slopeY(24)-slabDepth()/2-1.4,0);
  const p=new THREE.Vector3(30,slopeY(30)+7,0);
  labWin.position.copy(p);labGentle.position.copy(p);labSteep.position.copy(p);
}
addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',new THREE.Vector3(24,slopeY(24)+13,0),'r');
addLabel(()=>L('雪棚:把雪流导上路顶,护住公路','Snow shed: roofs the road, deflecting the flow'),new THREE.Vector3(0,4.5,0),'g',()=>shed.visible,shed);
addLabel(()=>L('公路:防治的对象','The road: what protection is for'),new THREE.Vector3(0,2.2,0),'b');

/* ---------- 步骤 ---------- */
function flyTo(px,py,pz,tx,ty,tz){camTween.p0=camera.position.clone();camTween.p1=new THREE.Vector3(px,py,pz);
  camTween.t0=controls.target.clone();camTween.t1=new THREE.Vector3(tx,ty,tz);camTween.k=0;}
const camTween={k:1};
function crackStart(zh,en){crackT=0;state='crack';flash=1;notifyT=2.2;notifyZ=zh;notifyE=en;}
const STEPS=[
  {zh:'千层饼:新雪/老雪之间夹着霜晶弱层,剪力最弱',en:'The layer cake: a hoar weak layer between slabs, weakest in shear',
   act(){reset();flyTo(4,16,44,18,-14,0);}},
  {zh:'危险窗 25°–50°:<25° 留得住,>50° 一层层自己掉',en:'The 25°–50° window: holds below, sluffs continuously above',
   act(){reset();theta=42;syncSliders();buildTerrain();placeAll();flyTo(6,18,46,22,-16,0);}},
  {zh:'触发:新载荷/滑雪者/炸药让弱层剪力破盘',en:'Trigger: new load, a skier, or explosives shear the weak layer',
   act(){reset();syncSliders();buildTerrain();placeAll();skierStart();flyTo(0,14,40,14,-10,0);}},
  {zh:'板状雪崩:裂纹一声咔横向劈开,整片雪板整体启动',en:'Slab release: the crack snaps across, the whole plate launches as one',
   act(){reset();syncSliders();buildTerrain();placeAll();crackStart('咔——弱层剪断!','Snap — the weak layer shears!');flyTo(10,10,34,26,-16,0);}},
  {zh:'破碎卷气:雪流加速到 ~100 km/h,粉雪云冲在前头',en:'Fragmenting & entraining: the flow nears 100 km/h, powder cloud ahead',
   act(){reset();syncSliders();buildTerrain();placeAll();vF=14;frontX=X_SLABEND;spawnChunks();state='slide';flyTo(40,4,52,52,-30,0);}},
  {zh:'防治:雪棚导流、人工放雪崩、关闭道路',en:'Mitigation: sheds, controlled release, road closure',
   act(){reset();syncSliders();buildTerrain();placeAll();shedOn=true;shed.visible=true;syncShedBtn();crackStart('人工放雪崩:炸药在安全时机引雪','Controlled release: explosives at a safe hour');flyTo(56,2,60,84,-38,0);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function syncSliders(){
  document.getElementById('sTh').value=theta;
  document.getElementById('sThVal').textContent=theta+'°';
  document.getElementById('sLoad').value=load;
  document.getElementById('sLoadVal').textContent=load+' cm';
  document.getElementById('sSlow').value=slowK;
  document.getElementById('sSlowVal').textContent=slowK.toFixed(2)+'×';
}
function syncShedBtn(){document.getElementById('btnShed').classList.toggle('on',shedOn);}
function placeAll(){placeSlab();placeRoad();placeShed();}
function skierStart(){skierOn=true;skierX=3;state='ready';}
function reset(){
  state='ready';simT=0;skierOn=false;vF=0;slabX=0;frontX=0;crackT=0;flash=0;
  slabG.visible=true;slabG.position.x=18;skier.visible=true;
  for(let i=0;i<NC2;i++)chunkM.setMatrixAt(i,zeroM);
  chunkM.instanceMatrix.needsUpdate=true;
  for(let i=0;i<NP;i++){pwLife[i]=-1;pwPos[i*3+1]=999;}
  crack.material.opacity=0;
  placeAll();
}

/* ---------- 滑雪者(触发者) ---------- */
const skier=new THREE.Group();
{
  const bm=new THREE.MeshStandardMaterial({color:0xd9483c,roughness:0.6});
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.22,0.6,4,8),bm);
  body.rotation.z=-theta*D2R;body.name='body';
  skier.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.16,10,8),new THREE.MeshStandardMaterial({color:0x22262b}));
  head.position.y=0.55;skier.add(head);
}
scene.add(skier);

/* ---------- 主题 / 语言 ---------- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x9db4c8:0xc6d8e6);
  scene.fog.color.setHex(dark?0x9db4c8:0xc6d8e6);
  terrM.color.setHex(dark?0xe9eef5:0xf2f6fb);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  syncSliders();buildSteps();updateStats();
}
function updateStats(){
  document.getElementById('stTh').innerHTML=theta+'<small> °</small>';
  document.getElementById('stSl').innerHTML=slabDepth().toFixed(2)+'<small> m</small>';
  const elS=document.getElementById('stSF');
  const sf=safety();
  elS.innerHTML=sf.toFixed(2);
  elS.className='v'+(sf<1?' bad':sf<1.25?' warn':' ok');
  document.getElementById('stV').innerHTML=(vF*3.6).toFixed(0)+'<small> km/h</small>';
}

/* ---------- 事件 ---------- */
document.getElementById('sTh').addEventListener('input',e=>{theta=+e.target.value;
  document.getElementById('sThVal').textContent=theta+'°';
  buildTerrain();placeAll();updLabelPos();reset();});
document.getElementById('sLoad').addEventListener('input',e=>{load=+e.target.value;
  document.getElementById('sLoadVal').textContent=load+' cm';placeSlab();});
document.getElementById('sSlow').addEventListener('input',e=>{slowK=+e.target.value;
  document.getElementById('sSlowVal').textContent=slowK.toFixed(2)+'×';});
document.getElementById('btnSki').addEventListener('click',()=>{if(state==='ready'&&!skierOn)skierStart();});
document.getElementById('btnBomb').addEventListener('click',()=>{
  if(state!=='ready')return;
  if(theta>50){notifyT=2.6;notifyZ='超过 50°:雪挂不住,只会一层层溜走';notifyE='Above 50°: snow sluffs layer by layer';sluff();return;}
  if(theta<25){notifyT=2.6;notifyZ='坡度太缓:SF>1,雪板纹丝不动';notifyE='Too gentle: SF>1, the slab holds';return;}
  crackStart('咔——弱层剪断!','Snap — the weak layer shears!');
});
document.getElementById('btnShed').addEventListener('click',()=>{shedOn=!shedOn;
  shed.visible=shedOn;syncShedBtn();});
document.getElementById('btnReset').addEventListener('click',reset);
document.getElementById('play').addEventListener('click',()=>{playing=!playing;
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';
  localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function sluff(){
  for(let i=0;i<24;i++){
    const x=X_CROWN+Math.random()*10;
    spawnPowder(x,slopeY(x)+1,(Math.random()-0.5)*16,1);
  }
}

/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let raf=null,acc=0;
if(!labelsOn)document.getElementById('tglLabels').checked=false;
if(!playingInit){playing=false;document.getElementById('play').textContent=L('运行','Run');}

function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  if(notifyT>0)notifyT-=dt0;
  const dt=dt0*slowK*(playing?1:0);
  simT+=dt;
  if(camTween.k<1){
    camTween.k=Math.min(1,camTween.k+dt0*1.6);
    const e=1-Math.pow(1-camTween.k,3);
    camera.position.lerpVectors(camTween.p0,camTween.p1,e);
    controls.target.lerpVectors(camTween.t0,camTween.t1,e);
  }
  /* 自动演示:约 1.5 s(墙钟,慢放 0.4×)后滑雪者进场触发 */
  if(playing&&simT>0.6&&state==='ready'&&!skierOn)skierStart();
  /* 滑雪者下滑 */
  if(skierOn&&state==='ready'){
    skierX+=dt*7;
    skier.position.set(skierX,slopeY(skierX)+0.75,0.8);
    skier.getObjectByName('body').rotation.z=-theta*D2R;
    if(skierX>=X_CROWN){
      skierOn=false;skier.visible=false;
      if(theta>50){notifyT=2.6;notifyZ='超过 50°:雪挂不住,只会一层层溜走';notifyE='Above 50°: snow sluffs layer by layer';sluff();}
      else if(theta<25){notifyT=2.6;notifyZ='坡度太缓:SF>1,雪板纹丝不动';notifyE='Too gentle: SF>1, the slab holds';}
      else crackStart('咔——弱层剪断!','Snap — the weak layer shears!');
    }
  }
  /* 裂纹扩展 0.7 s → 释放 */
  if(state==='crack'){
    crackT+=dt;
    const k=clamp(crackT/0.7,0,1);
    crack.material.opacity=0.9*(1-k*0.55)+flash*0.4;
    crack.scale.z=0.15+0.85*k;
    flash*=Math.exp(-3*dt0);
    if(crackT>=0.7){state='slide';vF=0.4;slabX=0;}
  }
  /* 雪板整体启动 0.6 s,随后破碎成块 */
  if(state==='slide'&&slabG.visible){
    slabX+=vF*dt;
    vF+=G*(Math.sin(theta*D2R)-0.47*Math.cos(theta*D2R))*dt;
    slabG.position.x=18+slabX*Math.cos(theta*D2R);
    slabG.position.y=slopeY(18)-slabX*Math.sin(theta*D2R);
    if(slabX>3.2){
      slabG.visible=false;
      spawnChunks();
    }
  }
  /* 块体积分:陡段低摩擦加速,缓段锁死 */
  if(state==='slide'){
    let vmax=0,maxX=0;
    for(let i=0;i<NC2;i++){
      const c=chunks[i];
      if(c.rest)continue;
      const th=angAt(c.x);
      let a=G*(Math.sin(th*D2R)-0.12*Math.cos(th*D2R));
      if(th<12)a=G*(Math.sin(th*D2R)-0.6*Math.cos(th*D2R));   /* 运行区急减速堆积 */
      if(shedOn&&Math.abs(c.x-78)<2&&c.y>slopeY(78)-1)a=0;    /* 雪棚顶:被托住导走 */
      c.v+=a*dt;
      if(c.v<0)c.v=0;
      c.x+=c.v*dt*Math.cos(th*D2R);
      c.y=slopeY(c.x)+slabDepth()*0.5+c.s*0.3;
      c.z+=c.vz*dt;c.vz*=Math.exp(-0.5*dt);
      if(shedOn&&c.x>76&&c.x<80){c.y=Math.max(c.y,slopeY(c.x)+3.4);}   /* 沿棚顶越过 */
      if(c.v<0.35&&th<12){c.rest=true;}
      tmpP.set(c.x,c.y,c.z);tmpQ.setFromAxisAngle(new THREE.Vector3(0,1,0),c.x*0.7);
      tmpS.set(c.s,c.s*0.8,c.s);
      tmpM.compose(tmpP,tmpQ,tmpS);
      chunkM.setMatrixAt(i,tmpM);
      if(c.v>vmax)vmax=c.v;
      if(c.x>maxX)maxX=c.x;
    }
    chunkM.instanceMatrix.needsUpdate=true;
    vF=vmax;
    frontX=maxX;
    /* 粉雪云:前锋超前密实雪流 */
    if(vF>6&&frontX<LEN-4){
      const lead=frontX+4+0.28*vF*2;
      if(Math.random()<dt*40)spawnPowder(lead,slopeY(lead)+1.5,0,10);
    }
    if(maxX>LEN-6&&vF<1){state='done';}
  }
  /* 粉雪粒子 */
  for(let i=0;i<NP;i++){
    if(pwLife[i]<0)continue;
    pwLife[i]-=dt;
    if(pwLife[i]<=0){pwLife[i]=-1;pwPos[i*3+1]=999;continue;}
    pwPos[i*3]+=pwVel[i*3]*dt;
    pwPos[i*3+1]+=pwVel[i*3+1]*dt;
    pwPos[i*3+2]+=pwVel[i*3+2]*dt;
    pwVel[i*3+1]+=0.6*dt;
  }
  pwGeo.attributes.position.needsUpdate=true;
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    r.o.visible=labelsOn&&r.vis()&&r.text()!=='';   /* 空文案不渲染胶囊 */
    if(r.o.visible)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildTerrain();placeAll();updLabelPos();start();
</script>
