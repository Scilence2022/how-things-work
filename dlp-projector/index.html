<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投影仪与 DLP 微镜 · 用时间画出灰阶</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d6a03c;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#ab7c2a;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(214,160,60,.9); color: #f2ddab; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bcd8ff; }
  .lbl.r { border-color: rgba(255,124,124,.9); color: #ffcaca; }
  .lbl.o { border-color: rgba(255,168,92,.9); color: #ffdcb2; }
  .lbl.y { border-color: rgba(235,215,130,.9); color: #fff0b8; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(171,124,42,.9); color: #8a6414; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(31,111,168,.9); color: #1e6fa8; }
  :root[data-theme="light"] .lbl.r { border-color: rgba(178,58,58,.9); color: #b23a3a; }
  :root[data-theme="light"] .lbl.o { border-color: rgba(165,90,23,.9); color: #a55a17; }
  :root[data-theme="light"] .lbl.y { border-color: rgba(138,109,20,.9); color: #8a6d14; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #d6a03c; }
  :root[data-theme="light"] #stats .v.g { color: #ab7c2a; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.p { color: #c3f5e5; border-color: rgba(99,230,190,.7); }
  .chip.r { color: #d0bfff; border-color: rgba(177,151,252,.7); }
  .chip.l { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(214,160,60,.12); color: var(--text); border: 1px solid rgba(214,160,60,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(214,160,60,.26); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(214,160,60,.10); border-color: rgba(214,160,60,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(171,124,42,.08); border-color: rgba(171,124,42,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #f0d9a4; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="投影仪与 DLP 微镜:用时间画出灰阶" data-en="DLP Projector: painting gray with time">投影仪与 DLP 微镜:用时间画出灰阶</h1>
  <div class="sub" data-zh="白光被色轮切成 R/G/B 子场轮流打上 DMD;每颗 ~10 µm 微铝镜只在 ±12° 两态翻转——开态反射进投影镜头、关态倒进吸光槽;灰度=一帧内「开」的占空比,人眼把闪光积分成 256 级、把三个子场积分成全彩 · 拖动旋转 / 空格运行/暂停" data-en="A color wheel slices white light into R/G/B sub-fields for the DMD; each ~10 µm mirror flips only between ±12° — on reflects into the lens, off dumps into the light sink; gray = on-time duty per frame; your eye integrates the flashes into 256 levels and full color · drag to orbit / space = play/pause">白光被色轮切成 R/G/B 子场轮流打上 DMD;每颗 ~10 µm 微铝镜只在 ±12° 两态翻转——开态反射进投影镜头、关态倒进吸光槽;灰度=一帧内「开」的占空比,人眼把闪光积分成 256 级、把三个子场积分成全彩 · 拖动旋转 / 空格运行/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="翻转角" data-en="tilt angle">翻转角</span><span class="v g" id="stAng">+12.0<small>°</small></span>
  <span class="k" data-zh="占空比" data-en="duty">占空比</span><span class="v" id="stDuty">50<small>%</small></span>
  <span class="k" data-zh="灰度级" data-en="gray level">灰度级</span><span class="v g" id="stGray">128<small>/255</small></span>
  <span class="k" data-zh="子场" data-en="sub-field">子场</span><span class="v" id="stField" style="font-size:14px">R</span>
  <span class="k" data-zh="刷新" data-en="refresh">刷新</span><span class="v" id="stHz">120<small>Hz</small></span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip.p" data-zh="色轮与 R/G/B 子场" data-en="color wheel &amp; sub-fields">色轮与 R/G/B 子场</span>
    <span class="chip.r" data-zh="微镜(±12° 两态)" data-en="micromirrors (±12°)">微镜(±12° 两态)</span>
    <span class="chip.l" data-zh="光子(颜色=当前子场)" data-en="photons (colored by sub-field)">光子(颜色=当前子场)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnSlow" data-zh="拉慢 20×" data-en="slow 20×">拉慢 20×</button>
    <button class="abtn" id="btnHold" data-zh="强制开态(绕过 PWM)" data-en="force ON (bypass PWM)">强制开态(绕过 PWM)</button>
  </div>
  <div class="row"><label data-zh="占空比(这一颗)" data-en="duty (this one)">占空比(这一颗)</label><input id="duty" type="range" min="0" max="100" step="1" value="50"><span class="val" id="dutyVal">50%</span></div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.05" max="3" step="0.05" value="1"><span class="val" id="spdVal">1.00×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tgl3chip" type="checkbox"> <span data-zh="三芯片分光" data-en="3-chip prism">三芯片分光</span></label>
      <label><input id="tglShutter" type="checkbox"> <span data-zh="高速快门" data-en="hi-speed shutter">高速快门</span></label>
      <label><input id="tglRainbow" type="checkbox"> <span data-zh="彩虹扫视" data-en="rainbow saccade">彩虹扫视</span></label>
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../liquid-crystal/" data-zh="液晶 LCD:另一种光阀" data-en="liquid-crystal: another light valve">液晶 LCD:另一种光阀</a>
    <a href="../oled-display/" data-zh="OLED:自发光像素" data-en="OLED: self-emissive pixels">OLED:自发光像素</a>
    <a href="../led-display/" data-zh="LED 大屏" data-en="LED display">LED 大屏</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  if (floor) floor.material.color.set(THEME === 'light' ? 0xd9dee7 : 0x161b23);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('投影仪与 DLP 微镜', 'DLP Projector & Micromirrors');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  refreshSlowBtn();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 80);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.6;
controls.maxDistance = 18;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  alu: new THREE.MeshStandardMaterial({ color: 0xd3dae4, roughness: 0.22, metalness: 0.9 }),
  heroAlu: new THREE.MeshStandardMaterial({ color: 0xf0d9a4, roughness: 0.18, metalness: 0.9,
    emissive: 0x8a6a20, emissiveIntensity: 0.35 }),
  body: mat(0x232830, { roughness: 0.6, metalness: 0.35 }),
  frame: mat(0x8a93a3, { metalness: 0.6, roughness: 0.35 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.25,
    roughness: 0.1, metalness: 0, side: THREE.DoubleSide, depthWrite: false }),
  sink: new THREE.MeshStandardMaterial({ color: 0x0a0b0e, roughness: 0.95, metalness: 0.1 }),
  bulb: new THREE.MeshStandardMaterial({ color: 0xfff6e0, emissive: 0xfff2cf, emissiveIntensity: 2.4 }),
  refl: new THREE.MeshStandardMaterial({ color: 0xd9dde2, roughness: 0.3, metalness: 0.85, side: THREE.DoubleSide }),
  barD: mat(0xd6a03c, { emissiveIntensity: 0.55 }),
  barL: mat(0x6b7c92, { emissiveIntensity: 0.2 }),
};

/* ---------------- 布局常量(光轴:灯在 +z 高处,向下 24° 打向芯片;镜头沿 -z) ---------------- */
const CHY = 1.0;                    // 芯片镜面高度
const N = 20, PITCH = 0.062, NN = N * N;
const S24 = Math.sin(24 * Math.PI / 180), C24 = Math.cos(24 * Math.PI / 180);
const dIn = new THREE.Vector3(0, -S24, -C24);          // 光行进方向:下前
const lampPos = new THREE.Vector3(0, CHY + S24 * 4.2, C24 * 4.2);
const wheelPos = new THREE.Vector3(0, CHY + S24 * 1.7, C24 * 1.7);
const lensPos = new THREE.Vector3(0, CHY, -1.95);
const S48 = Math.sin(48 * Math.PI / 180), C48 = Math.cos(48 * Math.PI / 180);
const offDir = new THREE.Vector3(0, S48, -C48);        // 关态反射方向:上前 48°
const sinkPos = new THREE.Vector3(0, CHY + S48 * 2.05, -C48 * 2.05);
const scrPos = new THREE.Vector3(0, 1.75, -5.9);
const heroIx = 10, heroIy = 10, heroIdx = heroIy * N + heroIx;

const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 48),
  new THREE.MeshStandardMaterial({ color: 0x161b23, roughness: 0.95, metalness: 0 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

/* 灯:灯泡 + 反光罩 */

function dutyAt(ix, iy) { return (ix < 0 || ix >= N) ? 0 : dutyArr[iy * N + ix]; }
function drawScreen(u, fc) {
  const D = imgData.data;
  const rb = rainbow && !threeChip;
  const oR = rb ? Math.round(4 * Math.sin(tSim * 0.9)) : 0;
  for (let iy = 0; iy < N; iy++) for (let ix = 0; ix < N; ix++) {
    let r, g, b;
    if (shutter) {
      const v = (u < dutyAt(ix, iy)) ? 255 : 0;
      r = fc[0] * v; g = fc[1] * v; b = fc[2] * v;
    } else if (rb) {
      r = 255 * dutyAt(ix + oR, iy); g = 255 * dutyAt(ix, iy); b = 255 * dutyAt(ix - oR, iy);
    } else {
      const v = 255 * dutyAt(ix, iy); r = v; g = v; b = v;
    }
    for (let dy = 0; dy < 3; dy++) {
      let k = ((iy * 3 + dy) * 60 + ix * 3) * 4;
      for (let dx = 0; dx < 3; dx++) { D[k] = r; D[k + 1] = g; D[k + 2] = b; D[k + 3] = 255; k += 4; }
    }
  }
  ctx2d.putImageData(imgData, 0, 0);
  tex.needsUpdate = true;
}

const XAX = new THREE.Vector3(1, 0, 0);
const ONE = new THREE.Vector3(1, 1, 1), ZERO = new THREE.Vector3(0.0001, 0.0001, 0.0001);
const tmpV = new THREE.Vector3();

function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  /* 色轮与子场 */
  wheelSpin.rotation.z = -tSim * 2 * Math.PI / (FP * 2);
  let sub = 0;
  if (!threeChip) {
    const a = ((wheelSpin.rotation.z % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    sub = Math.floor(a / (Math.PI / 3)) % 3;
  }
  const fc = threeChip ? [1, 1, 1] : FIELD_COL[sub];
  beamIn.material.color.setRGB(fc[0], fc[1], fc[2]);
  beamOn.material.color.setRGB(fc[0], fc[1], fc[2]);
  beamOff.material.color.setRGB(fc[0], fc[1], fc[2]);

  /* 微镜阵列 PWM */
  const u = (tSim % FP) / FP;
  for (let i = 0; i < NN; i++) {
    const target = (i === heroIdx && heroManual) ? 12 : (u < dutyArr[i] ? 12 : -12);
    let t = tiltArr[i];
    const dd = target - t, step = RATE * dts;
    t += Math.abs(dd) <= step ? dd : Math.sign(dd) * step;
    tiltArr[i] = t;
    qt.setFromAxisAngle(XAX, -t * Math.PI / 180);
    m4.compose(tmpV.set(baseX[i], CHY + 0.012, baseZ[i]), qt, i === heroIdx ? ZERO : ONE);
    facetIM.setMatrixAt(i, m4);
  }
  facetIM.instanceMatrix.needsUpdate = true;
  heroFacet.rotation.x = -tiltArr[heroIdx] * Math.PI / 180;

  /* 光子 */
  spawnCD -= dts;
  if (spawnCD <= 0) {
    spawnCD = 0.14;
    const p = phot.find(p => !p.alive);
    if (p) {
      p.alive = true; p.refl = false; p.thru = false;
      p.g.position.set((Math.random() - 0.5) * 0.84, lampPos.y + (Math.random() - 0.5) * 0.4, lampPos.z);
      p.dir.copy(dIn);
      p.dot.material = threeChip ? pMatW : pMat[sub];
      p.g.visible = true;
    }
  }
  for (const p of phot) {
    if (!p.alive) continue;
    p.g.position.addScaledVector(p.dir, 3.2 * dts);
    const P = p.g.position;
    if (!p.refl) {
      if (P.y <= CHY + 0.012) {
        p.refl = true;
        const ix = Math.round(P.x / PITCH + (N - 1) / 2), iy = Math.round(P.z / PITCH + (N - 1) / 2);
        if (ix >= 0 && ix < N && iy >= 0 && iy < N) {
          const phi = tiltArr[iy * N + ix] * Math.PI / 180;
          const cp = Math.cos(phi), sp = Math.sin(phi);
          const dn = p.dir.y * cp - p.dir.z * sp;
          p.dir.set(0, p.dir.y - 2 * dn * cp, p.dir.z + 2 * dn * sp);
        }
      }
    } else {
      const dxs = P.x - sinkPos.x, dys = P.y - sinkPos.y, dzs = P.z - sinkPos.z;
      if (dxs * dxs + dys * dys + dzs * dzs < 0.11) { p.alive = false; p.g.visible = false; continue; }
      if (!p.thru && p.dir.z < 0 && P.z <= -1.7) {
        const rr = P.x * P.x + (P.y - CHY) * (P.y - CHY);
        if (rr < 0.07) p.thru = true;
      }
      if (p.thru && P.z <= -5.86) { p.alive = false; p.g.visible = false; continue; }
      if (P.y < 0.06 || P.y > 4 || P.z < -7 || P.z > 6) { p.alive = false; p.g.visible = false; continue; }
    }
  }

  /* 对照柱生长 */
  for (const b of [barD, barL]) {
    const tgt = bars.visible ? 1 : 0.001;
    b.userData.cur += (tgt - b.userData.cur) * Math.min(1, dt * 5);
    b.scale.y = Math.max(0.001, b.userData.cur);
    b.position.y = b.userData.h * b.scale.y / 2;
  }

  /* 屏幕与读数 */
  drawScreen(u, fc);
  const ht = tiltArr[heroIdx];
  document.getElementById('stAng').innerHTML = (ht >= 0 ? '+' : '−') + Math.abs(ht).toFixed(1) + '<small>°</small>';
  document.getElementById('stDuty').innerHTML = Math.round(heroDuty * 100) + '<small>%</small>';
  document.getElementById('stGray').innerHTML = Math.round(heroDuty * 255) + '<small>/255</small>';
  const elF = document.getElementById('stField');
  elF.textContent = threeChip ? L('常亮', 'steady') : ['R', 'G', 'B'][sub];
  elF.style.color = threeChip ? '' : FIELD_HEX[sub];
  document.getElementById('stHz').innerHTML = '120<small>Hz</small>';

  for (const r of labelRegistry) {
    r.o.element.textContent = r.text();
    const vis = !r.ph || r.ph.includes(phase);
    r.o.element.style.display = (vis && labelsOn) ? '' : 'none';
  }
  if (phase !== lastStep) {
    lastStep = phase;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phase));
  }
  if (twK < 1) {
    twK = Math.min(1, twK + dt * 1.6);
    const s = twK * twK * (3 - 2 * twK);
    camera.position.lerpVectors(twFromP, twToP, s);
    controls.target.lerpVectors(twFromT, twToT, s);
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafOn) { cancelAnimationFrame(rafId); rafOn = false; }
  } else {
    clock.getDelta();
    if (!rafOn) { rafOn = true; rafId = requestAnimationFrame(frame); }
  }
});

/* ---------------- 初始化 ---------------- */
applyTheme();
applyLang();
setDuty(heroDuty);
setPhase(clamp(Math.round(qsFloat('t', 1)) - 1, 0, STEPS.length - 1), true);
setPlayLabel();
rafOn = true;
rafId = requestAnimationFrame(frame);
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
