<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>离子交换与硬水软化 · 珠面上的哨所与穿透曲线</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#3bc9db;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#1098ab;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(59,201,219,.6);background:rgba(59,201,219,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(16,152,171,.55);background:rgba(16,152,171,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(59,201,219,.10);border-color:rgba(59,201,219,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(16,152,171,.08);border-color:rgba(16,152,171,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#c5f6fa}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="离子交换与硬水软化" data-en="Ion Exchange & Water Softening">离子交换与硬水软化</h1>
  <div class="sub" data-zh="树脂珠抓着 Na⁺ 站岗,硬水里的 Ca²⁺ 一撞上来就被换下:床层从入口逐层用尽,穿透曲线探出耗竭,浓盐水逆流又能把它满血再生——水垢与肥皂渣的终结者 · 拖动旋转 / 空格运行/暂停" data-en="Resin beads hold Na⁺ on standby; Ca²⁺ in hard water swaps in as it arrives: the bed exhausts layer by layer from the inlet, the breakthrough curve betrays the spent zone, and brine backwash regenerates it — the end of scale and soap scum · drag to orbit / Space = run/pause">树脂珠抓着 Na⁺ 站岗,硬水里的 Ca²⁺ 一撞上来就被换下:床层从入口逐层用尽,穿透曲线探出耗竭,浓盐水逆流又能把它满血再生——水垢与肥皂渣的终结者 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="出水硬度" data-en="Outlet hardness">出水硬度</span><span class="v" id="stHard">—</span>
  <span class="k" data-zh="树脂容量余量" data-en="Capacity left">树脂容量余量</span><span class="v" id="stCap">—</span>
  <span class="k" data-zh="耗尽带位置" data-en="Front position">耗尽带位置</span><span class="v" id="stFront">—</span>
  <span class="k" data-zh="状态" data-en="State">状态</span><span class="v" id="stState">—</span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bRun" data-zh="运行/软化" data-en="Run / soften">运行/软化</button>
    <button class="abtn" id="bRegen" data-zh="盐水再生" data-en="Brine regen">盐水再生</button>
    <button class="abtn" id="bBypass" data-zh="旁通硬水对照" data-en="Bypass (hard)">旁通硬水对照</button>
  </div>
  <div class="row">
    <label data-zh="流量" data-en="Flow">流量</label>
    <input id="sFlow" type="range" min="2" max="20" step="1" value="8">
    <span class="val" id="sFlowVal">8 L/min</span>
  </div>
  <div class="row">
    <label data-zh="原水硬度" data-en="Feed hardness">原水硬度</label>
    <input id="sFeed" type="range" min="1" max="10" step="0.5" value="5">
    <span class="val" id="sFeedVal">5.0 °dH</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="穿透曲线" data-en="Breakthrough">穿透曲线</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../water-treatment/" data-zh="自来水厂" data-en="The Water Treatment Plant">自来水厂</a>
    <a href="../reverse-osmosis/" data-zh="反渗透海水淡化" data-en="Reverse Osmosis">反渗透海水淡化</a>
    <a href="../ksp-precipitation/" data-zh="溶度积与沉淀" data-en="Solubility Product & Precipitation">溶度积与沉淀</a>
    <a href="../surfactant-micelle/" data-zh="表面活性剂与胶束" data-en="Surfactants & Micelles">表面活性剂与胶束</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,22,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-6.2,3.8,7.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 地面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(24,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ---- 软化柱 ---- */
const COLX=0,R=0.68,BEDY0=0.9,BEDY1=3.6;
const glassM=new THREE.MeshPhysicalMaterial({color:0xcfe4f5,roughness:0.05,
  transparent:true,opacity:0.13,side:THREE.DoubleSide,depthWrite:false});
const col=new THREE.Mesh(new THREE.CylinderGeometry(R,R,4.4,40,1,true),glassM);
col.position.set(COLX,2.4,0);scene.add(col);
const capM=new THREE.MeshStandardMaterial({color:0x4a5160,roughness:0.6,metalness:0.5});
for(const y of [0.2,4.6]){
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(R+0.1,R+0.1,0.22,40),capM);
  cap.position.set(COLX,y,0);scene.add(cap);
}
/* 进水管/出水管 */
const pipeM=new THREE.MeshStandardMaterial({color:0x9fb0c3,roughness:0.4,metalness:0.6});
const inPipe=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.6,12),pipeM);
inPipe.position.set(COLX,5.4,0);scene.add(inPipe);
const outPipe=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.4,12),pipeM);
outPipe.rotation.z=Math.PI/2;outPipe.position.set(COLX+R+0.7,0.55,0);scene.add(outPipe);
/* 树脂珠床 */
const NBEAD=240;
const beadM=new THREE.MeshStandardMaterial({roughness:0.55});
const beads=new THREE.InstancedMesh(new THREE.SphereGeometry(0.085,10,8),beadM,NBEAD);
scene.add(beads);
const beadPos=[];
for(let i=0;i<NBEAD;i++){
  const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*(R-0.16);
  beadPos.push({x:COLX+r*Math.cos(a),y:BEDY0+Math.random()*(BEDY1-BEDY0),z:r*Math.sin(a)});
}
const C_FRESH=new THREE.Color(0x99e9f2),C_USED=new THREE.Color(0x862e9c);

/* ---- 穿透曲线(侧板) ---- */
const chartG=new THREE.Group();chartG.position.set(COLX+2.6,2.2,0);scene.add(chartG);
const chartBG=new THREE.Mesh(new THREE.BoxGeometry(2.2,2.2,0.06),
  new THREE.MeshStandardMaterial({color:0x232830,roughness:0.7}));
chartBG.position.y=0.4;chartG.add(chartBG);
const CHN=90,chartVals=new Array(CHN).fill(0);
const chartGeo=new THREE.BufferGeometry();
chartGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(CHN*3),3));
const chartLine=new THREE.Line(chartGeo,new THREE.LineBasicMaterial({color:0xffd43b}));
chartG.add(chartLine);
/* 坐标框 */
const boxM=new THREE.LineBasicMaterial({color:0x5b6b7d});
const boxPts=[new THREE.Vector3(-1,0.4,-0.05),new THREE.Vector3(1,0.4,-0.05),new THREE.Vector3(1,2.4,-0.05),new THREE.Vector3(-1,2.4,-0.05),new THREE.Vector3(-1,0.4,-0.05)];
chartG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(boxPts),boxM));
function redrawChart(){
  const p=chartGeo.attributes.position;
  for(let i=0;i<CHN;i++){
    p.setXYZ(i,-1+2*i/(CHN-1),0.4+2*chartVals[i],0.01);
  }
  p.needsUpdate=true;
}

/* ---- 水垢小壶(旁通对照) ---- */
const kettleG=new THREE.Group();kettleG.position.set(COLX-2.6,0,0);scene.add(kettleG);
const kettleM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.35,metalness:0.6});
const kettle=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.65,1.0,28),kettleM);
kettle.position.y=0.5;kettleG.add(kettle);
const scaleM=new THREE.MeshStandardMaterial({color:0xf1f3f5,roughness:0.9});
const kscale=new THREE.Mesh(new THREE.CylinderGeometry(0.66,0.66,0.5,28,1,true),scaleM);
kscale.position.y=0.42;kscale.scale.x=0.001;kscale.scale.z=0.001;kettleG.add(kscale);

/* ---- 离子(进水 Ca²⁺ / 出水 Na⁺ / 再生盐水) ---- */
const m4=new THREE.Matrix4();
function ionMesh(n,color,r){
  const m=new THREE.MeshStandardMaterial({color,roughness:0.3,metalness:0.1});
  const im=new THREE.InstancedMesh(new THREE.SphereGeometry(r,10,8),m,n);
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(im);return im;
}
const NION=30;
const ca=ionMesh(NION,0xffa94d,0.075);/* 硬度离子 */
const na=ionMesh(NION,0x63e6be,0.06);/* 软化后的 Na⁺ */
const brine=ionMesh(20,0xffd43b,0.075);/* 盐水 Na⁺(再生) */
const caState=[];for(let i=0;i<NION;i++)caState.push({y:BEDY1+Math.random()*1.6+2,ph:Math.random()*7,active:true});
const naState=[];for(let i=0;i<NION;i++)naState.push({y:BEDY1,ph:Math.random()*7,active:false});
const brineState=[];for(let i=0;i<20;i++)brineState.push({y:BEDY0+Math.random()*(BEDY1-BEDY0),ph:Math.random()*7});

/* ---- 状态 ---- */
let flow=8,feed=5,playing=true,labelsOn=true,slowMo=false,chartOn=true,bypass=false;
let mode='run';/* run | regen */
let front=0.12;/* 耗尽带 0(顶)→1(底) */
let outletHard=0,chartT=0,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const CAP=1.0;/* 每再生周期可处理的总硬度当量(模型) */
function frontSpeed(){/* 硬度量越大耗尽越快 */
  return mode==='regen'?-0.14:flow*feed*2.6e-4;}
function targetOutlet(){/* front 到 0.86 后曲线抬头 */
  return mode==='regen'?0:clamp((front-0.82)/0.14,0,1)*(bypass?0:1);}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('硬水进:Ca²⁺/Mg²⁺ 撞向树脂珠','Hard water in: Ca²⁺/Mg²⁺ hit the beads'),
  new THREE.Vector3(COLX,5.6,0),'o');
addLabel(()=>L('珠面交换:2 Na⁺ ⇄ Ca²⁺,钙被扣下','Bead swap: 2 Na⁺ ⇄ Ca²⁺, calcium stays'),
  new THREE.Vector3(COLX-1.9,2.8,0),'b');
addLabel(()=>L(`耗尽带 ${(front*100).toFixed(0)}% · 出水 ${(100*outletHard).toFixed(0)}%`,
    `Front ${(front*100).toFixed(0)}% · outlet ${(100*outletHard).toFixed(0)}%`),
  new THREE.Vector3(COLX,4.9,0),'y');
addLabel(()=>L('盐水逆流:把钙顶出去,树脂满血','Brine backwash: Ca²⁺ flushed, resin reborn'),
  new THREE.Vector3(COLX,3.9,0),'g',()=>mode==='regen');

/* ---- 控件 ---- */
function setFlow(v){flow=clamp(v,2,20);
  document.getElementById('sFlow').value=flow;
  document.getElementById('sFlowVal').textContent=flow.toFixed(0)+' L/min';updateStats();}
function setFeed(v){feed=clamp(v,1,10);
  document.getElementById('sFeed').value=feed;
  document.getElementById('sFeedVal').textContent=feed.toFixed(1)+' °dH';updateStats();}
function startRegen(){mode='regen';
  document.getElementById('bRun').classList.remove('on');
  document.getElementById('bRegen').classList.add('on');updateStats();}
function startRun(){mode='run';
  document.getElementById('bRun').classList.add('on');
  document.getElementById('bRegen').classList.remove('on');updateStats();}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'硬水进柱:钙镁离子撞上树脂珠',en:'Hard water enters: Ca/Mg ions hit the bead bed',
  act(){startRun();setFlow(8);setFeed(5);}},
 {zh:'珠面交换:2 个 Na⁺ 换下 1 个 Ca²⁺',en:'Bead swap: two Na⁺ hand over one Ca²⁺',
  act(){startRun();}},
 {zh:'耗尽带从入口逐层推进',en:'The exhaustion front creeps down from the inlet',
  act(){startRun();setFlow(14);setFeed(8);}},
 {zh:'出水软化:壶不结垢、肥皂起泡',en:'Soft outlet: no kettle scale, soap lathers up',
  act(){startRun();setFlow(6);setFeed(3);}},
 {zh:'穿透:耗尽带到底,曲线抬头该再生',en:'Breakthrough: front bottoms out, curve lifts — regenerate',
  act(){startRun();front=0.97;}},
 {zh:'盐水逆流再生:树脂满血复活',en:'Brine regen: the bed comes back to full capacity',
  act(){startRegen();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const hv=document.getElementById('stHard');
  hv.innerHTML=(100*outletHard).toFixed(0)+'<small> %</small>';
  hv.className='v '+(outletHard>0.3?'warn':'ok');
  document.getElementById('stCap').innerHTML=(100*(1-0.9*front)).toFixed(0)+'<small> %</small>';
  const fv=document.getElementById('stFront');
  fv.innerHTML=(front*100).toFixed(0)+'<small> %</small>';
  fv.className='v '+(front>0.85?'warn':'');
  const sv=document.getElementById('stState');
  if(mode==='regen'){sv.textContent=L('再生中','Regenerating');sv.className='v ok';}
  else if(outletHard>0.3){sv.textContent=L('已穿透!','Breakthrough!');sv.className='v warn';}
  else{sv.textContent=L('软化中','Softening');sv.className='v ok';}
}

/* ---- 事件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bRun').addEventListener('click',startRun);
document.getElementById('bRegen').addEventListener('click',startRegen);
document.getElementById('bBypass').addEventListener('click',()=>{
  bypass=!bypass;
  document.getElementById('bBypass').classList.toggle('on',bypass);});
document.getElementById('sFlow').addEventListener('input',e=>setFlow(+e.target.value));
document.getElementById('sFeed').addEventListener('input',e=>setFeed(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglChart').addEventListener('change',e=>{chartOn=e.target.checked;chartG.visible=chartOn;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,lastFront=-1;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 耗尽带推进 */
  front=clamp(front+frontSpeed()*dts,0,1);
  if(mode==='regen'&&front<=0.001)startRun();
  /* 出水硬度(平滑) + 穿透曲线 */
  const tgt=targetOutlet();
  outletHard+=(tgt-outletHard)*Math.min(1,dts*1.6);
  chartT+=dts;
  if(chartT>0.35){chartT=0;
    chartVals.shift();chartVals.push(outletHard);redrawChart();
    chartLine.material.color.setHex(outletHard>0.3?0xff6b6b:0xffd43b);}
  /* 珠床着色(仅在 front 变化时) */
  if(Math.abs(front-lastFront)>0.004||lastFront<0){
    lastFront=front;
    const frontY=BEDY1-(BEDY1-BEDY0)*front;
    const c=new THREE.Color();
    for(let i=0;i<NBEAD;i++){
      c.copy(beadPos[i].y>frontY?C_USED:C_FRESH);
      if(mode==='regen')c.lerp(C_FRESH,clamp((frontY-beadPos[i].y)/0.5,0,1));
      beads.setColorAt(i,c);
    }
    beads.instanceColor.needsUpdate=true;
  }
  /* Ca²⁺ 下落:在耗尽带顶被扣下 */
  const frontY=BEDY1-(BEDY1-BEDY0)*front;
  const fallV=mode==='run'?flow*0.16:0;
  for(let i=0;i<NION;i++){
    const s=caState[i];
    s.y-=fallV*dts;
    if(s.y<frontY+0.1){/* 被交换 */
      s.y=BEDY1+2+Math.random()*1.2;
      const k=Math.floor(Math.random()*NION);
      naState[k].y=frontY+0.05;naState[k].active=true;
    }
    const a=Math.sin(i*2.4)* (R-0.2),b=Math.cos(i*1.7)*(R-0.2);
    m4.makeTranslation(COLX+a*0.8,clamp(s.y,BEDY0,6),b*0.8);
    ca.setMatrixAt(i,m4);
  }
  ca.instanceMatrix.needsUpdate=true;
  /* Na⁺ 缓慢下漂 */
  for(let i=0;i<NION;i++){
    const s=naState[i];
    if(s.active){s.y-=fallV*0.55*dts;if(s.y<BEDY0-0.6)s.active=false;}
    const a=Math.cos(i*3.1)*(R-0.25),b=Math.sin(i*2.2)*(R-0.25);
    const sc=s.active?1:0.001;
    m4.makeScale(sc,sc,sc);m4.setPosition(COLX+a,clamp(s.y,0.2,6),b);
    na.setMatrixAt(i,m4);
  }
  na.instanceMatrix.needsUpdate=true;
  /* 再生盐水上升 */
  const upV=mode==='regen'?1.4:0;
  for(let i=0;i<20;i++){
    const s=brineState[i];
    s.y+=upV*dts*(0.7+0.3*Math.sin(s.ph));
    if(s.y>BEDY1+0.8)s.y=BEDY0;
    const a=Math.sin(i*2.9)*(R-0.25),b=Math.cos(i*1.3)*(R-0.25);
    m4.makeTranslation(COLX+a,mode==='regen'?s.y:BEDY0+((i*7)%20)/20*2.5,b);
    brine.setMatrixAt(i,m4);
  }
  brine.instanceMatrix.needsUpdate=true;
  brine.visible=mode==='regen';
  /* 水垢小壶:旁通(硬水)时壶内长垢 */
  const scaleTgt=(bypass||outletHard>0.3)?1:0;
  const sk=clamp(kscale.scale.x+(scaleTgt-kscale.scale.x)*dts*0.3,0.001,1);
  kscale.scale.x=sk;kscale.scale.z=sk;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
chartG.visible=chartOn;
applyTheme();buildSteps();
redrawChart();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
/* 初始让耗尽带处于中段,方便直接讲故事 */
front=0.55;
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
