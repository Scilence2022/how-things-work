<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>圆珠笔 · 笔尖上的流变学平衡术</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#38d9a9;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#0ca678;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="圆珠笔" data-en="The Ballpoint Pen">圆珠笔</h1>
  <div class="sub" data-zh="笔尖上一颗 0.5 mm 的钢珠既是阀门又是碾墨机:滚动把粘稠油墨碾出、铺在纸上,重力反过来拉墨,所以圆珠笔能倒着写;墨要稠到不渗不挥发,又要稀到跟得上笔尖——一支笔,一场流变学的平衡术 · 拖动旋转 / 空格运行/暂停" data-en="A 0.5 mm steel ball at the tip is both valve and ink mill: rolling shears viscous paste out and spreads it on paper, while gravity pulls the ink the wrong way — yet the pen writes upside down; the ink must be thick enough not to seep or dry out, thin enough to keep up with the tip — one pen, a balancing act in rheology · drag to orbit / Space = run/pause">笔尖上一颗 0.5 mm 的钢珠既是阀门又是碾墨机:滚动把粘稠油墨碾出、铺在纸上,重力反过来拉墨,所以圆珠笔能倒着写;墨要稠到不渗不挥发,又要稀到跟得上笔尖——一支笔,一场流变学的平衡术 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="球珠直径" data-en="Ball dia">球珠直径</span><span class="v" id="stBall">—</span>
  <span class="k" data-zh="供墨速率" data-en="Ink supply">供墨速率</span><span class="v" id="stInk">—</span>
  <span class="k" data-zh="墨迹宽度" data-en="Line width">墨迹宽度</span><span class="v" id="stW">—</span>
  <span class="k" data-zh="书写长度" data-en="Written">书写长度</span><span class="v" id="stLen">0<small> m</small></span>
</div>
<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bWrite" data-zh="正常书写" data-en="Normal write">正常书写</button>
    <button class="abtn" id="bInvert" data-zh="倒写对照" data-en="Upside down">倒写对照</button>
    <button class="abtn" id="bBleed" data-zh="重压洇墨" data-en="Heavy bleed">重压洇墨</button>
  </div>
  <div class="row">
    <label data-zh="握笔压力" data-en="Grip force">握笔压力</label>
    <input id="sP" type="range" min="0.2" max="3" step="0.1" value="1">
    <span class="val" id="sPVal">1.0 N</span>
  </div>
  <div class="row">
    <label data-zh="书写速度" data-en="Write speed">书写速度</label>
    <input id="sSp" type="range" min="0.2" max="2.5" step="0.1" value="1">
    <span class="val" id="sSpVal">1.0</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglSection" type="checkbox" checked> <span data-zh="剖面透视" data-en="Cutaway">剖面透视</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../capillarity/" data-zh="毛细与表面张力" data-en="Capillarity">毛细与表面张力</a>
    <a href="../non-newtonian/" data-zh="非牛顿流体" data-en="Non-Newtonian">非牛顿流体</a>
    <a href="../inkjet-printing/" data-zh="喷墨打印" data-en="Inkjet printing">喷墨打印</a>
    <a href="../poiseuille/" data-zh="泊肃叶流动" data-en="Poiseuille flow">泊肃叶流动</a>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(-3.8,2.9,9.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.2,1.7,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 桌面与纸张 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const deskM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8});
const desk=new THREE.Mesh(new THREE.BoxGeometry(13.6,0.24,4.4),deskM);
desk.position.y=0.12;scene.add(desk);
const paperM=new THREE.MeshStandardMaterial({color:0xe9ecef,roughness:0.85});
const paper=new THREE.Mesh(new THREE.BoxGeometry(12.6,0.04,3.0),paperM);
paper.position.y=0.26;scene.add(paper);
/* 顶部玻璃板:倒写时在上面留墨 */
const plateM=new THREE.MeshPhysicalMaterial({color:0xdfe8f2,roughness:0.12,transparent:true,opacity:0.32,side:THREE.DoubleSide});
const plate=new THREE.Mesh(new THREE.BoxGeometry(12.6,0.07,3.0),plateM);
plate.position.y=4.5;scene.add(plate);
const postM=new THREE.MeshStandardMaterial({color:0x2a2f38,roughness:0.5,metalness:0.4});
[-5.6,5.6].forEach(x=>{
  const p=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,4.46,12),postM);
  p.position.set(x,2.23,-1.25);scene.add(p);
});

/* ---- 圆珠笔:笔尖(球珠+球座)+ 半剖笔杆 + 墨管 ---- */
const BALLR=0.14,PAPERTOP=0.28,PLATEY=4.465,W_TIPY=PAPERTOP+BALLR,W_TIPYI=PLATEY-BALLR,WRITE_LEAN=0.95;
const penG=new THREE.Group();penG.position.set(0,W_TIPY,0);scene.add(penG);
/* 钢珠:金属球,带滚动标记点 */
const ballG=new THREE.Group();penG.add(ballG);
const metalM=new THREE.MeshStandardMaterial({color:0xc9ccd4,roughness:0.18,metalness:0.92});
const ball=new THREE.Mesh(new THREE.SphereGeometry(BALLR,28,20),metalM);ballG.add(ball);
const dotM=new THREE.MeshStandardMaterial({color:0x333a45,roughness:0.4});
[[0.1,0.02,0.045],[-0.06,0.09,0.045],[0.02,-0.1,0.05]].forEach(p=>{
  const d=new THREE.Mesh(new THREE.SphereGeometry(0.022,10,8),dotM);
  const l=Math.hypot(p[0],p[1],p[2]);
  d.position.set(p[0]/l,p[1]/l,p[2]/l).multiplyScalar(0.132);ballG.add(d);
});
/* 球座:锥形黄铜座,底部一圈细缝就是阀门 */
const socketM=new THREE.MeshStandardMaterial({color:0xb08d3e,roughness:0.3,metalness:0.85});
const socket=new THREE.Mesh(new THREE.CylinderGeometry(0.125,0.10,0.38,20),socketM);
socket.position.y=0.29;penG.add(socket);
const gapRing=new THREE.Mesh(new THREE.TorusGeometry(0.146,0.009,8,26),
  new THREE.MeshStandardMaterial({color:0x8c2f2f,roughness:0.5,emissive:0x5a1212,emissiveIntensity:0.4}));
gapRing.rotation.x=Math.PI/2;gapRing.position.y=0.03;penG.add(gapRing);
/* 笔杆:半剖(开向镜头)与完整两套,由"剖面透视"切换 */
const barrelM=new THREE.MeshStandardMaterial({color:0x2b3a42,roughness:0.35,side:THREE.DoubleSide});
const barrelHalf=new THREE.Mesh(new THREE.CylinderGeometry(0.21,0.21,3.0,24,1,true,Math.PI/2,Math.PI),barrelM);
barrelHalf.position.y=1.94;penG.add(barrelHalf);
const barrelFullM=new THREE.MeshStandardMaterial({color:0x2b3a42,roughness:0.35});
const barrelFull=new THREE.Mesh(new THREE.CylinderGeometry(0.21,0.21,3.0,24),barrelFullM);
barrelFull.position.y=1.94;barrelFull.visible=false;penG.add(barrelFull);
const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.215,0.215,0.16,24),barrelFullM);
cap.position.y=3.5;penG.add(cap);
const capDome=new THREE.Mesh(new THREE.SphereGeometry(0.215,20,12,0,Math.PI*2,0,Math.PI/2),barrelFullM);
capDome.position.y=3.58;penG.add(capDome);
const grip=new THREE.Mesh(new THREE.CylinderGeometry(0.225,0.225,0.34,24),barrelFullM);
grip.position.y=0.55;penG.add(grip);
/* 墨管(透明)+ 蓝色高粘油墨柱 */
const cartM=new THREE.MeshPhysicalMaterial({color:0xf1f3f5,roughness:0.1,transparent:true,opacity:0.28,side:THREE.DoubleSide});
const cart=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,2.5,16,1,true),cartM);
cart.position.y=1.75;penG.add(cart);
const inkColM=new THREE.MeshStandardMaterial({color:0x1450c8,roughness:0.15,emissive:0x0a2a66,emissiveIntensity:0.35});
const inkCol=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,2.3,14),inkColM);
inkCol.position.y=1.8;penG.add(inkCol);

/* ---- 对照:钢笔(毛细+重力供墨,必须竖着) ---- */
const fpG=new THREE.Group();fpG.position.set(-4.35,0.33,1.85);fpG.rotation.y=0.5;scene.add(fpG);
const fpBodyM=new THREE.MeshStandardMaterial({color:0x8c2f3a,roughness:0.3});
const fpBody=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,1.3,16),fpBodyM);
fpBody.rotation.z=Math.PI/2;fpG.add(fpBody);
const fpNib=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.3,12),metalM);
fpNib.rotation.z=-Math.PI/2;fpNib.position.x=0.78;fpG.add(fpNib);
const fpRing=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.06,16),metalM);
fpRing.rotation.z=Math.PI/2;fpRing.position.x=0.6;fpG.add(fpRing);

/* ---- 油墨粒子(沿墨管缓慢流向球珠)+ 墨迹 + 洇墨斑 ---- */
const NP=22;
const partM=new THREE.MeshStandardMaterial({color:0x3b82f6,roughness:0.2,emissive:0x123a8a,emissiveIntensity:0.5});
const inkFlow=new THREE.InstancedMesh(new THREE.SphereGeometry(0.03,8,8),partM,NP);
scene.add(inkFlow);inkFlow.frustumCulled=false;
const partP=new Float32Array(NP),partJ=new Float32Array(NP);
for(let i=0;i<NP;i++){partP[i]=Math.random();partJ[i]=0.75+Math.random()*0.5;}
const NTR=96;
const traceM=new THREE.MeshStandardMaterial({color:0x123c8c,roughness:0.4});
const paperMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),traceM,NTR);
const plateMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),traceM,NTR);
scene.add(paperMesh);scene.add(plateMesh);
paperMesh.frustumCulled=false;plateMesh.frustumCulled=false;
const paperSegs=[],plateSegs=[];
for(let i=0;i<NTR;i++){paperSegs.push({x:0,w:0.1,on:false});plateSegs.push({x:0,w:0.1,on:false});}
const NBLT=26;
const blotM=new THREE.MeshStandardMaterial({color:0x1e4fbf,roughness:0.3,transparent:true,opacity:0.45});
const blotMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),blotM,NBLT);
scene.add(blotMesh);blotMesh.frustumCulled=false;
const blots=[];for(let i=0;i<NBLT;i++)blots.push({x:0,z:0,w:0.1,l:0.1,on:false});
let bltCur=0;
/* 纸面基准虚线:随纸卷动,暗示纸在走 */
const NDA=12;
const dashMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(0.3,0.006,0.03),
  new THREE.MeshStandardMaterial({color:0x9aa3ad,roughness:0.9}),NDA);
scene.add(dashMesh);
const dashX=[];for(let i=0;i<NDA;i++)dashX.push(-6.2+i*1.07);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let P=1.0,WS=1.0,slowMo=false;
let mode='write',penT=0,penTarget=0;
let writtenLen=0,spawnAcc=0,segCur=0;
const SEG=0.16,WVIS=0.155,BALL_MM=0.5;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblBall=addLabel(()=>L('钢珠阀:既阀门又碾墨','Ball valve: metering gate + ink mill'),new THREE.Vector3(0.8,1.1,0.35),'y');
const lblInk=addLabel(()=>L('油墨流:粘稠、缓慢、持续','Ink flow: viscous, slow, continuous'),new THREE.Vector3(-2.05,2.1,0.35),'b');
const lblGap=addLabel(()=>L('球座细缝:供墨的咽喉','Socket gap: the throat of supply'),new THREE.Vector3(-0.9,0.62,0.3),'r');
const lblTrace=addLabel(()=>L('墨迹:宽度由压力决定','Line: width set by pressure'),new THREE.Vector3(-1.7,0.5,0.85),'g');
const lblFPen=addLabel(()=>L('对照:钢笔靠毛细+重力,倒置即断水','Contrast: fountain pen feeds by capillarity + gravity — starves upside down'),new THREE.Vector3(-4.35,1.15,1.9),'');
/* 标签锚点随 正写/倒写 切换 */
const anchors=[
  [lblBall,[0.8,1.1,0.35],[0.95,4.95,0.35]],
  [lblInk,[-2.05,2.1,0.35],[2.2,3.6,0.35]],
  [lblGap,[-0.9,0.62,0.3],[-0.9,4.3,0.3]],
  [lblTrace,[-1.7,0.5,0.85],[-1.8,4.12,0.7]],
];
let lastInv=null;
function updateLabelAnchors(inv){
  if(inv===lastInv)return;lastInv=inv;
  for(const [lb,a,b] of anchors)lb.position.set(...(inv?b:a));
}

/* ---- 物理与控件辅助 ---- */
function paperV(){return 0.42*WS;}
function feed(){return clamp(P*(0.45+0.55*WS),0,3);}
function starves(){return feed()<0.62;}
function widthMM(){return 0.28+0.32*P+(P>2.2?(P-2.2)*0.55:0);}
function setP(v){P=v;document.getElementById('sP').value=v;
  document.getElementById('sPVal').textContent=v.toFixed(1)+' N';}
function setWS(v){WS=v;document.getElementById('sSp').value=v;
  document.getElementById('sSpVal').textContent=v.toFixed(1);}
function setMode(m){mode=m;penTarget=m==='invert'?1:0;
  document.getElementById('bWrite').classList.toggle('on',m==='write');
  document.getElementById('bInvert').classList.toggle('on',m==='invert');}
function clearOn(){['bWrite','bInvert','bBleed'].forEach(id=>document.getElementById(id).classList.remove('on'));}
function applySection(){const c=document.getElementById('tglSection').checked;
  barrelHalf.visible=c;barrelFull.visible=!c;}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'钢珠坐在球座里:一圈细缝就是阀门',en:'The ball sits in its socket: a hairline annular gap is the metering valve',
  act(){setP(1.0);setWS(1.0);setMode('write');clearOn();
    document.getElementById('bWrite').classList.add('on');
    document.getElementById('tglSection').checked=true;applySection();}},
 {zh:'滚动碾墨:粘稠油墨被卷出铺开',en:'Rolling mills the ink: viscous paste is sheared out and spread',
  act(){setP(1.0);setWS(1.4);}},
 {zh:'墨的粘度账:稠到不渗、稀到跟笔',en:'The viscosity budget: thick enough not to seep, thin enough to follow the tip',
  act(){setP(0.9);setWS(1.0);}},
 {zh:'倒着写也行:重力不在供墨路径上',en:'Upside down it still writes: gravity is not in the supply path',
  act(){setMode('invert');clearOn();document.getElementById('bInvert').classList.add('on');}},
 {zh:'压力过大:墨迹变粗、洇纸',en:'Too much pressure: the line fattens and bleeds into the paper',
  act(){setMode('write');setP(2.8);setWS(0.9);clearOn();
    document.getElementById('bBleed').classList.add('on');}},
 {zh:'从匈牙利记者到航天笔:加压墨管的后传故事',en:'From a Hungarian journalist to the space pen: the pressurized-cartridge sequel',
  act(){setP(1.0);setWS(0.7);setMode('write');clearOn();
    document.getElementById('bWrite').classList.add('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  document.getElementById('stBall').innerHTML=BALL_MM.toFixed(2)+'<small> mm</small>';
  const fill=starves()?0.38:1;
  document.getElementById('stInk').innerHTML=(widthMM()*210*fill).toFixed(0)+'<small> μg/m</small>';
  document.getElementById('stW').innerHTML=widthMM().toFixed(2)+'<small> mm</small>';
  document.getElementById('stLen').innerHTML=writtenLen.toFixed(2)+'<small> m</small>';
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bWrite').addEventListener('click',()=>{
  setP(1.0);setWS(1.0);setMode('write');clearOn();
  document.getElementById('bWrite').classList.add('on');
});
document.getElementById('bInvert').addEventListener('click',()=>{
  setMode('invert');clearOn();document.getElementById('bInvert').classList.add('on');
});
document.getElementById('bBleed').addEventListener('click',()=>{
  setMode('write');setP(2.8);setWS(0.9);clearOn();
  document.getElementById('bBleed').classList.add('on');
});
document.getElementById('sP').addEventListener('input',e=>setP(+e.target.value));
document.getElementById('sSp').addEventListener('input',e=>setWS(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglSection').addEventListener('change',applySection);
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  deskM.color.setHex(dark?0x3a3f4b:0xb6ae9f);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
const tmpV=new THREE.Vector3();
let segTimer=0;
function spawnSeg(list,mesh,y,w,bleed){
  const s=list[segCur];segCur=(segCur+1)%list.length;
  s.x=-0.02;s.w=w;s.on=true;
  if(bleed&&Math.random()<0.6){
    const b=blots[bltCur];bltCur=(bltCur+1)%NBLT;
    b.x=0.06;b.z=(Math.random()-0.5)*0.18;b.w=w*1.75+0.09;b.l=0.09+Math.random()*0.13;b.on=true;
  }
}
function scrollSegs(list,mesh,y,pv,dts){
  for(let i=0;i<list.length;i++){const s=list[i];
    if(s.on){s.x-=pv*dts;if(s.x<-6.5)s.on=false;}
    if(s.on){m4.makeScale(0.17,0.012,s.w);m4.setPosition(s.x,y,0);}
    else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);}
    mesh.setMatrixAt(i,m4);}
  mesh.instanceMatrix.needsUpdate=true;
}
function scrollBlots(pv,dts){
  for(let i=0;i<NBLT;i++){const b=blots[i];
    if(b.on){b.x-=pv*dts;if(b.x<-6.5)b.on=false;}
    if(b.on){m4.makeScale(b.l,0.012,b.w);m4.setPosition(b.x,0.294,b.z);}
    else{m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);}
    blotMesh.setMatrixAt(i,m4);}
  blotMesh.instanceMatrix.needsUpdate=true;
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 姿态过渡:正写 ↔ 倒写(笔绕笔尖翻转) */
  penT+=(penTarget-penT)*Math.min(1,dt*3.5);
  const e=penT<0.5?2*penT*penT:1-Math.pow(-2*penT+2,2)/2;
  penG.rotation.z=WRITE_LEAN+Math.PI*e;
  penG.position.y=W_TIPY+(W_TIPYI-W_TIPY)*e;
  const inverted=e>0.5,writing=e<0.03||e>0.97;
  updateLabelAnchors(inverted);
  /* 钢珠滚动:ω=v/r;倒写时接触面在球珠上方,转向相反 */
  const pv=paperV();
  if(writing)ballG.rotation.z+=(inverted?1:-1)*(pv/BALLR)*dts;
  /* 墨粒:沿墨管被粘稠地挤向球珠——倒写时逆着重力上行,供墨照常 */
  const rate=(0.02+0.075*Math.min(1.6,feed()))*dts;
  for(let i=0;i<NP;i++){
    partP[i]-=rate*partJ[i];
    if(partP[i]<-0.14)partP[i]+=1.14;
    const yy=0.45+partP[i]*2.5;
    tmpV.set(Math.sin(partP[i]*34+i*2.1)*0.02,yy,Math.cos(partP[i]*29+i)*0.02);
    penG.localToWorld(tmpV);
    const sc=partP[i]<0?0.72:1;
    m4.makeScale(sc,sc,sc);m4.setPosition(tmpV.x,tmpV.y,tmpV.z);
    inkFlow.setMatrixAt(i,m4);
  }
  inkFlow.instanceMatrix.needsUpdate=true;
  /* 墨迹:随纸(或顶板)卷动;轻压断续露白,重压加宽并洇出墨斑 */
  spawnAcc+=dts*pv;
  if(!writing)spawnAcc=0;
  while(spawnAcc>SEG){
    spawnAcc-=SEG;
    const w=widthMM()*WVIS,bleed=P>2.2;
    if(inverted)spawnSeg(plateSegs,plateMesh,PLATEY-0.014,w,bleed);
    else spawnSeg(paperSegs,paperMesh,PAPERTOP+0.008,w,bleed);
  }
  scrollSegs(paperSegs,paperMesh,PAPERTOP+0.008,pv,dts);
  scrollSegs(plateSegs,plateMesh,PLATEY-0.014,pv,dts);
  scrollBlots(pv,dts);
  /* 纸面基准虚线滚动 */
  for(let i=0;i<NDA;i++){
    dashX[i]-=pv*dts;if(dashX[i]<-6.4)dashX[i]+=12.8;
    m4.makeScale(1,1,1);m4.setPosition(dashX[i],PAPERTOP+0.004,1.28);
    dashMesh.setMatrixAt(i,m4);
  }
  dashMesh.instanceMatrix.needsUpdate=true;
  /* 书写长度累计 */
  if(writing)writtenLen+=dts*WS*0.21;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setP(1.0);setWS(1.0);applySection();updateLabelAnchors(false);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
</html>
