<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>活塞环与窜气 · 端隙三关,背压自紧</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#d9822b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b05c10;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(217,130,43,.6);background:rgba(217,130,43,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(176,92,16,.55);background:rgba(176,92,16,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(217,130,43,.10);border-color:rgba(217,130,43,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(176,92,16,.08);border-color:rgba(176,92,16,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe3cc}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="活塞环与窜气" data-en="Piston Rings & Blow-by">活塞环与窜气</h1>
  <div class="sub" data-zh="环不是靠弹力硬贴缸壁——燃烧压力从环背缝隙钻进背隙,把环压向缸壁:压力越大密封越紧(自密封);端隙彼此错开 120°,每条泄漏路都要连闯三关;磨损让端隙变大,高压气下窜曲轴箱、机油上行被烧成蓝烟——密封与烧机油都是这几道环的事 · 拖动旋转 / 空格运行/暂停" data-en="The rings do not seal by spring force alone — combustion pressure sneaks behind each ring and presses it onto the wall: the harder it burns, the tighter the seal; end gaps staggered 120° make every leak path run three gauntlets; wear widens the gaps so gas blows into the crankcase and oil climbs up to burn blue — sealing and oil-burning are both these rings’ story · drag to orbit / Space = run/pause">环不是靠弹力硬贴缸壁——燃烧压力从环背缝隙钻进背隙,把环压向缸壁:压力越大密封越紧(自密封);端隙彼此错开 120°,每条泄漏路都要连闯三关;磨损让端隙变大,高压气下窜曲轴箱、机油上行被烧成蓝烟——密封与烧机油都是这几道环的事 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="转速" data-en="Speed">转速</span><span class="v" id="stRpm">—</span>
  <span class="k" data-zh="缸压" data-en="Cyl. press.">缸压</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="窜气量" data-en="Blow-by">窜气量</span><span class="v" id="stLeak">—</span>
  <span class="k" data-zh="机油消耗" data-en="Oil use">机油消耗</span><span class="v" id="stOil">—</span>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bGood" data-zh="正常环组" data-en="Healthy set">正常环组</button>
    <button class="abtn" id="bWorn" data-zh="磨损环组" data-en="Worn set">磨损环组</button>
    <button class="abtn" id="bStuck" data-zh="环黏死" data-en="Rings stuck">环黏死</button>
  </div>
  <div class="row">
    <label data-zh="转速" data-en="Speed">转速</label>
    <input id="sRpm" type="range" min="600" max="3000" step="100" value="1200">
    <span class="val" id="sRpmVal">1200 rpm</span>
  </div>
  <div class="row">
    <label data-zh="爆发压力" data-en="Peak press.">爆发压力</label>
    <input id="sPress" type="range" min="20" max="90" step="1" value="55">
    <span class="val" id="sPressVal">55 bar</span>
  </div>
  <div class="row">
    <label data-zh="端隙宽度" data-en="End gap">端隙宽度</label>
    <input id="sGap" type="range" min="0.02" max="0.40" step="0.01" value="0.05">
    <span class="val" id="sGapVal">0.05 mm</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>
      <label><input id="tglCut" type="checkbox" checked> <span data-zh="剖视" data-en="Cutaway">剖视</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../four-stroke-engine/" data-zh="四冲程内燃机" data-en="Four-Stroke Engine">四冲程内燃机</a>
    <a href="../diesel-engine/" data-zh="柴油机" data-en="Diesel Engine">柴油机</a>
    <a href="../wankel-rotary/" data-zh="转子发动机" data-en="Wankel Rotary">转子发动机</a>

</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,60);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.5;controls.maxDistance=60;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const keyL=new THREE.DirectionalLight(0xfff2dd,1.05);keyL.position.set(6,10,8);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0x9ab8ff,0.3);fillL.position.set(-8,5,-6);scene.add(fillL);
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(24,64),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
/* ── 场景:单缸剖视,曲轴在下、活塞往复,三道环的密封账 ── */
const CRANK_Y=0.95,R=0.9,RODL=2.2,PR=0.82,LR=0.98;
const blockM=new THREE.MeshStandardMaterial({color:0x54607a,roughness:0.55,metalness:0.35});
const steelM=new THREE.MeshStandardMaterial({color:0x9aa4b4,roughness:0.3,metalness:0.75});
const darkM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const wallM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.25,metalness:0.7,
  transparent:true,opacity:0.3,side:THREE.DoubleSide,depthWrite:false});
/* 缸套与缸头 */
const liner=new THREE.Mesh(new THREE.CylinderGeometry(LR,LR,2.6,48,1,true),wallM);
liner.position.y=3.4;scene.add(liner);
const headM=new THREE.MeshStandardMaterial({color:0x6b7787,roughness:0.5,metalness:0.5});
const head=new THREE.Mesh(new THREE.CylinderGeometry(1.18,1.18,0.55,48),headM);
head.position.y=4.95;scene.add(head);
const headTop=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.0,0.1,48),darkM);
headTop.position.y=5.27;scene.add(headTop);
const deck=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,0.16,48),blockM);
deck.position.y=2.08;scene.add(deck);
/* 曲轴箱 */
const cc=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.5,2.2),blockM);
cc.position.set(0,CRANK_Y-0.35,0);scene.add(cc);
const ccGlass=new THREE.Mesh(new THREE.BoxGeometry(2.24,1.5,2.24),
  new THREE.MeshStandardMaterial({color:0x9ab8ff,transparent:true,opacity:0.06,roughness:0.3}));
ccGlass.position.copy(cc.position);scene.add(ccGlass);
/* 曲轴:主轴颈+曲柄臂+配重+曲柄销 */
const crankG=new THREE.Group();crankG.position.set(0,CRANK_Y,0);scene.add(crankG);
const webM=new THREE.MeshStandardMaterial({color:0x76829a,roughness:0.4,metalness:0.6});
for(const sgn of [-1,1]){
  const web=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,0.12,32),webM);
  web.rotation.z=Math.PI/2;web.rotation.x=0;
  web.rotation.set(0,0,Math.PI/2);
  web.rotation.y=0;
  const w=new THREE.Mesh(new THREE.BoxGeometry(0.14,1.55,0.5),webM);
  w.position.x=sgn*0.14;crankG.add(w);
}
const cw=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.16,32,1,false,0,Math.PI),webM);
cw.rotation.z=Math.PI/2;cw.rotation.y=Math.PI/2;cw.position.x=-0.0;crankG.add(cw);
cw.rotation.set(0,0,Math.PI/2);
const pin=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.5,20),steelM);
pin.rotation.x=Math.PI/2;pin.position.set(0,R,0);crankG.add(pin);
const crankShaft=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,2.4,20),steelM);
crankShaft.rotation.x=Math.PI/2;crankG.add(crankShaft);
/* 连杆 */
const rod=new THREE.Mesh(new THREE.BoxGeometry(0.16,RODL,0.24),steelM);
scene.add(rod);
const pinB=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.42,16),steelM);
pinB.rotation.x=Math.PI/2;scene.add(pinB);
/* 活塞 */
const piston=new THREE.Group();scene.add(piston);
const pBody=new THREE.Mesh(new THREE.CylinderGeometry(PR,PR,0.95,48),steelM);
piston.add(pBody);
const pCrown=new THREE.Mesh(new THREE.CylinderGeometry(PR*0.92,PR,0.12,48),webM);
pCrown.position.y=0.53;piston.add(pCrown);
const pinA=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,PR*2,16),darkM);
pinA.rotation.x=Math.PI/2;piston.add(pinA);
/* 三道环:两道气环+一道油环,端隙错开 120° */
const ringGeo=new THREE.TorusGeometry(LR-0.02,0.035,10,64);
const ring1M=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85});
const ring2M=new THREE.MeshStandardMaterial({color:0xc4ccd8,roughness:0.3,metalness:0.8});
const oilM2=new THREE.MeshStandardMaterial({color:0xd9822b,roughness:0.35,metalness:0.6});
const rings=[];
const gapMarks=[];
const gapAngles=[0.3,0.3+2.09,0.3+4.19];
[[0.34,ring1M],[0.16,ring2M],[-0.14,oilM2,'oil']].forEach((cfg,i)=>{
  const m=new THREE.Mesh(ringGeo,cfg[1]);
  m.rotation.x=Math.PI/2;m.position.y=cfg[0];piston.add(m);
  rings.push(m);
  const gap=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.045,0.05),
    new THREE.MeshStandardMaterial({color:0xff7b4f,emissive:0xff7b4f,emissiveIntensity:0.6}));
  const a=gapAngles[i];
  gap.position.set(Math.cos(a)*(LR-0.02),cfg[0],Math.sin(a)*(LR-0.02));
  piston.add(gap);gapMarks.push(gap);
});
/* 燃烧室压力辉光 */
const glow=new THREE.Mesh(new THREE.CylinderGeometry(LR-0.05,LR-0.05,1.2,32,1,true),
  new THREE.MeshBasicMaterial({color:0xff9e40,transparent:true,opacity:0.12,side:THREE.DoubleSide,depthWrite:false}));
scene.add(glow);
/* 油膜 */
const film=new THREE.Mesh(new THREE.CylinderGeometry(LR+0.012,LR+0.012,2.5,48,1,true),
  new THREE.MeshStandardMaterial({color:0xc98a2b,transparent:true,opacity:0.35,roughness:0.4,
    side:THREE.BackSide,depthWrite:false}));
film.position.y=3.4;scene.add(film);
/* 粒子池:窜气(蓝)与机油(琥珀)与蓝烟 */
const NP=70;
const dropM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4});
const drops=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,8,8),dropM,NP);
drops.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(drops);
const pd=[];for(let i=0;i<NP;i++)pd.push({on:false,m:0,x:0,y:0,z:0,v:0,l:1});
const smokeM=new THREE.MeshStandardMaterial({color:0x9ab8ff,transparent:true,opacity:0.5,roughness:1});
const smoke=new THREE.InstancedMesh(new THREE.SphereGeometry(0.14,10,10),smokeM,24);
smoke.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(smoke);
const sk=[];for(let i=0;i<24;i++)sk.push({on:false,x:0,y:0,z:0,v:0,l:0});

/* 状态 */
let mode='good',rpm=1200,press=55,gap=0.05,playing=true,labelsOn=true,slowMo=false,cutOn=true;
let theta=0,strokeName='',Pnow=1,leakNow=0,oilNow=0,smokeT=0,spawnAcc=0,oilAcc=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}

const lblRing1=addLabel(()=>L('气环 ×2:背压自紧','Compression rings ×2: pressure-packed'),
  new THREE.Vector3(1.7,3.85,0),'y');
const lblOil=addLabel(()=>L('油环:上行布油、下行刮油','Oil ring: wipes the wall on the down-stroke'),
  new THREE.Vector3(1.7,3.1,0),'o');
const lblGap=addLabel(()=>L(`端隙 ${gap.toFixed(2)} mm · 错开 120°`,`End gap ${gap.toFixed(2)} mm · staggered 120°`),
  new THREE.Vector3(-1.6,3.5,0),'r');
const lblCC=addLabel(()=>L('曲轴箱通风:窜气从这里走','Crankcase vent: where blow-by goes'),
  new THREE.Vector3(1.55,0.75,0),'b');
const lblStroke=addLabel(()=>L(`冲程:${strokeName} · ${Pnow.toFixed(0)} bar`,`Stroke: ${strokeName} · ${Pnow.toFixed(0)} bar`),
  new THREE.Vector3(0,5.75,0),'g');

function pressProfile(phi){/* 四冲程 720° 压力曲线 */
  const c=press;
  if(phi<Math.PI)return 1.2;
  if(phi<2*Math.PI){const t=(phi-Math.PI)/Math.PI;return 1.2+(c-1.2)*t*t;}
  if(phi<3*Math.PI){const t=(phi-2*Math.PI)/Math.PI;return c*Math.pow(0.25,t)+1.4*(1-Math.pow(0.25,t));}
  const t=(phi-3*Math.PI)/Math.PI;return 1.4-0.2*t;
}
function strokeNameF(phi){
  if(phi<Math.PI)return L('进气','Intake');
  if(phi<2*Math.PI)return L('压缩','Compression');
  if(phi<3*Math.PI)return L('做功','Power');
  return L('排气','Exhaust');
}
function calc(){/* 泄漏与机油耗模型:层流缝隙 ∝ gap³ × 压力 × 转速 */
  const stuck=mode==='stuck';
  const g=stuck?0.42:(mode==='worn'?Math.max(gap,0.28):gap);
  leakNow=0.4+press*1.15*g*g*g*42*(rpm/1200);
  oilNow=(stuck?4:1)*Math.max(0,g-0.08)*260*(rpm/1200)*(0.4+press/90);
  if(mode==='stuck')leakNow=Math.max(leakNow,30);
}
function setRpm(v){rpm=clamp(v,600,3000);
  document.getElementById('sRpm').value=rpm;
  document.getElementById('sRpmVal').textContent=rpm.toFixed(0)+' rpm';updateStats();}
function setPress(v){press=clamp(v,20,90);
  document.getElementById('sPress').value=press;
  document.getElementById('sPressVal').textContent=press.toFixed(0)+' bar';updateStats();}
function setGap(v){gap=clamp(v,0.02,0.4);
  if(mode==='worn')gap=Math.max(gap,0.28);
  document.getElementById('sGap').value=gap;
  document.getElementById('sGapVal').textContent=gap.toFixed(2)+' mm';
  const gs=clamp(gap/0.4,0.05,1);
  gapMarks.forEach(m=>{m.scale.set(0.4+gs*1.6,1,1);});updateStats();}
function setMode(m){mode=m;
  document.getElementById('bGood').classList.toggle('on',m==='good');
  document.getElementById('bWorn').classList.toggle('on',m==='worn');
  document.getElementById('bStuck').classList.toggle('on',m==='stuck');
  if(m==='worn')setGap(0.3);else if(m==='good')setGap(0.05);
  updateStats();}

const STEPS=[
 {zh:'<b>正常环组</b>:端隙 0.05 mm,三道关把窜气压到个位数',en:'<b>Healthy set</b>: 0.05 mm gaps, three gauntlets keep blow-by single-digit',
  act(){setMode('good');setPress(55);setRpm(1200);}},
 {zh:'<b>背压自紧</b>:压力拉到 90 bar,环被自己压得更紧——越烧越密封',en:'<b>Pressure-packed</b>: at 90 bar the rings press themselves harder — the more it burns, the better the seal',
  act(){setPress(90);}},
 {zh:'<b>端隙错开</b>:三道环的缺口互隔 120°,直通泄漏要连闯三关',en:'<b>Staggered gaps</b>: notches 120° apart — a straight leak path must pass three gates',
  act(){setPress(55);}},
 {zh:'<b>磨损环组</b>:端隙拉到 0.3 mm,窜气破表、曲轴箱升压',en:'<b>Worn set</b>: gaps at 0.3 mm — blow-by pegs and the crankcase pressurizes',
  act(){setMode('worn');}},
 {zh:'<b>机油上窜</b>:油环刮不净,上行把机油带进燃烧室烧成蓝烟',en:'<b>Oil updraft</b>: the tired oil ring leaves film that burns as blue smoke',
  act(){setGap(0.35);setRpm(2400);}},
 {zh:'<b>环黏死</b>:积碳把环卡在槽里,弹力与背压双双失守',en:'<b>Stuck rings</b>: carbon seizes the rings in their grooves — spring and back pressure both lost',
  act(){setMode('stuck');setRpm(1800);}},
];

function updateStats(){
  calc();
  document.getElementById('stRpm').innerHTML=rpm.toFixed(0)+'<small> rpm</small>';
  const pv=document.getElementById('stP');
  pv.innerHTML=press.toFixed(0)+'<small> bar</small>';
  pv.className='v '+(press>75?'warn':'');
  const lv=document.getElementById('stLeak');
  lv.innerHTML=leakNow.toFixed(1)+'<small> L/min</small>';
  lv.className='v '+(leakNow>12?'warn':'ok');
  const ov=document.getElementById('stOil');
  ov.innerHTML=oilNow.toFixed(1)+'<small> g/h</small>';
  ov.className='v '+(oilNow>30?'warn':'ok');
}
document.getElementById('bGood').addEventListener('click',()=>setMode('good'));
document.getElementById('bWorn').addEventListener('click',()=>setMode('worn'));
document.getElementById('bStuck').addEventListener('click',()=>setMode('stuck'));
document.getElementById('sRpm').addEventListener('input',e=>setRpm(+e.target.value));
document.getElementById('sPress').addEventListener('input',e=>setPress(+e.target.value));
document.getElementById('sGap').addEventListener('input',e=>{mode='good';setMode('good');setGap(+e.target.value);});
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglCut').addEventListener('change',e=>{cutOn=e.target.checked;
  wallM.opacity=cutOn?0.3:0.62;});

camera.position.set(5.8,3.6,8.0);
controls.target.set(0,2.75,0);

const m4=new THREE.Matrix4(),tmpC=new THREE.Color();
function tick(dts,dt){
  const w=rpm/60*2*Math.PI*0.22;
  theta=(theta+dts*w)%(4*Math.PI);
  /* 曲柄连杆运动学 */
  const s=Math.sin(theta),c=Math.cos(theta);
  const pinY=CRANK_Y+R*c;
  const pisY=CRANK_Y+R*c+Math.sqrt(Math.max(0.01,RODL*RODL-R*R*s*s));
  crankG.rotation.x=-theta;
  piston.position.y=pisY-0.15;
  rod.rotation.x=Math.PI+Math.asin(clamp((R*s)/(RODL),-1,1));
  rod.position.set(0,(pinY+piston.position.y+0.15)/2,0);
  rod.scale.y=1;
  pinB.position.set(0,pinY,0);
  pinA.position.y=0.15;
  /* 压力辉光:活塞顶到缸头之间 */
  const pTop=piston.position.y+0.62;
  const pHi=pressProfile(theta);
  Pnow=pHi;
  glow.visible=pHi>2;
  glow.position.y=(pTop+4.68)/2;glow.scale.y=Math.max(0.05,4.68-pTop);
  glow.material.opacity=clamp((pHi-2)/press,0.03,0.4);
  strokeName=strokeNameF(theta);
  /* 窜气粒子:做功/压缩行程从端隙下渗 */
  calc();
  spawnAcc+=dts*(leakNow*1.4)*(pHi>10?1:0.15);
  while(spawnAcc>1){spawnAcc-=1;
    const p=pd.find(q=>!q.on);
    if(p){p.on=true;p.m=0;
      p.x=LR-0.1;p.z=(Math.random()-0.5)*1.2;
      p.y=piston.position.y+0.5;p.v=0.7+Math.random()*0.9;p.l=1;}
  }
  for(const p of pd){
    if(!p.on){m4.makeScale(0,0,0);m4.setPosition(0,-10,0);drops.setMatrixAt(pd.indexOf(p),m4);continue;}
    if(p.m===0){p.y-=p.v*dts*(2+leakNow*0.05);p.x=LR-0.08;
      if(p.y<1.1){p.on=false;}
    }
    tmpC.setHex(0x7fa8ff);
    m4.makeScale(1,1,1);m4.setPosition(p.x,p.y,p.z);
    drops.setMatrixAt(pd.indexOf(p),m4);
    drops.setColorAt(pd.indexOf(p),tmpC);
  }
  drops.instanceMatrix.needsUpdate=true;
  if(drops.instanceColor)drops.instanceColor.needsUpdate=true;
  /* 机油上窜+蓝烟:磨损/黏死时才明显 */
  const oily=oilNow>10;
  if(oily){
    oilAcc+=dts*oilNow*0.14;
    while(oilAcc>1){oilAcc-=1;
      const p=pd.find(q=>!q.on);
      if(p){p.on=true;p.m=1;
        p.x=LR-0.06;p.z=(Math.random()-0.5)*1.3;
        p.y=piston.position.y-0.3;p.v=0.5+Math.random()*0.5;}
    }
  }
  for(const p of pd){
    if(p.on&&p.m===1){
      p.y+=p.v*dts*(0.6+rpm/2000);p.x=LR-0.06;
      if(p.y>piston.position.y+0.4){p.on=false;smokeT=1;}
    }
  }
  smokeT-=dts*0.5;
  if(oily&&smokeT<=0&&Math.random()<dts*6){
    const s2=sk.find(q=>!q.on);
    if(s2){s2.on=true;s2.x=(Math.random()-0.5)*0.5;s2.y=5.5;s2.z=(Math.random()-0.5)*0.5;s2.v=0.5+Math.random()*0.4;s2.l=1;}
  }
  for(let i=0;i<24;i++){const s2=sk[i];
    if(!s2.on){m4.makeScale(0,0,0);m4.setPosition(0,-10,0);smoke.setMatrixAt(i,m4);continue;}
    s2.y+=s2.v*dts;s2.l-=dts*0.5;
    if(s2.l<=0)s2.on=false;
    const sc=1+(1-s2.l)*1.6;
    m4.makeScale(sc,sc,sc);m4.setPosition(s2.x,s2.y,s2.z);
    smoke.setMatrixAt(i,m4);
    smoke.setColorAt(i,tmpC.setHex(0x8fb3ff).multiplyScalar(0.4+s2.l*0.6));
  }
  smoke.instanceMatrix.needsUpdate=true;
  if(smoke.instanceColor)smoke.instanceColor.needsUpdate=true;
  /* 环的径向微动:背压把环往外壁压 */
  const pressFrac=clamp((Pnow-2)/press,0,1);
  rings.forEach((m,i)=>{
    const rBase=LR-0.02;
    const isOil=i===2;
    const spring=isOil?0.008:0.014;
    const back=mode==='stuck'?0:pressFrac*0.02;
    m.scale.setScalar(1);
    m.position.z=0;
  });
}
function themeExtra(dark){}

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();updateStats();}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  themeExtra(dark);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null,simT=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  tick(dts,dt);
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
});
</script>
