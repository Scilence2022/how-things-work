<html lang="zh-CN" data-theme="dark">
<head>

<title>滑翔与翱翔 · 没有发动机怎么飞</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;

  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;

  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #cvPolar{width:100%;height:118px;margin:6px 0 2px;border:1px solid var(--tool-border);border-radius:8px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具与全局 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const QS=new URLSearchParams(location.search);
const htmlEl=document.documentElement,el=id=>document.getElementById(id);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
let playing=!QS.has('pause'),labelsOn=QS.get('labels')!=='0';
let timeScale=clamp(parseFloat(QS.get('speed'))||1,0.15,2);

/* ============ 滑翔极曲线（真实量级，ASK-21 教练机锚定） ============
   下沉率 sink(V)=a·V³+b/V；调参使最小下沉 0.70 m/s @ 20.5 m/s(74km/h)，
   最佳滑翔 L/D≈34 @ 27 m/s(97km/h)，与真实滑翔机一致 */
const PA=2.03e-5,PB=10.7;
const sinkOf=V=>PA*V*V*V+PB/V;
const V_MIN_SINK=20.5; // 由 d(sink)/dV=0 解出
// MacCready 速度决策：最大化地速/高度损耗 (V−顶风)/(sink−上升)
function speedToFly(wUp,wHead){
  let best=V_MIN_SINK,bv=-1e9;
  for(let V=18;V<=48;V+=0.5){
    const s=sinkOf(V)-wUp;
    if(s<0.12)continue;               // 正在爬升：减速到最小下沉
    const val=(V-wHead)/s;
    if(val>bv){bv=val;best=V;}
  }
  return best;
}

/* ============ 渲染基础 ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
el('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101a24,80,320);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,600);
camera.position.set(-52,76,32);   // 拉远+俯角：滑翔机完整入画、比例正常
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-38,64,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=200;
scene.add(new THREE.HemisphereLight(0xcfe4ff,0x22301f,0.9));
const sun=new THREE.DirectionalLight(0xfff1d8,1.1);sun.position.set(40,60,25);scene.add(sun);
const world=new THREE.Group();scene.add(world);

/* ============ 地景 ============ */
const terrM=new THREE.MeshStandardMaterial({color:0x3d5233,roughness:1});
const terrain=new THREE.Mesh(new THREE.PlaneGeometry(500,500),terrM);
terrain.rotation.x=-Math.PI/2;terrain.position.y=0;world.add(terrain);
// 山脊：三角棱柱（迎风面把水平风顶成上升气流）
const ridgeShape=new THREE.Shape();
ridgeShape.moveTo(0,0);ridgeShape.lineTo(13,11);ridgeShape.lineTo(26,0);ridgeShape.closePath();
const ridge=new THREE.Mesh(new THREE.ExtrudeGeometry(ridgeShape,{depth:120,bevelEnabled:false}),
  new THREE.MeshStandardMaterial({color:0x5c6656,roughness:1}));
ridge.rotation.x=-Math.PI/2;ridge.position.set(96,0,-60);world.add(ridge);
// 热气流柱：半透明圆柱 + 上升粒子
const thermals=[{x:8,z:-6,r:9},{x:52,z:18,r:9}];
const thGroups=[];
const thMat=new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:0.10,side:THREE.DoubleSide,depthWrite:false});
for(const t of thermals){
  const g=new THREE.Group();g.position.set(t.x,40,t.z);world.add(g);
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(t.r,t.r,80,24,1,true),thMat);
  g.add(cyl);
  const n=90,pos=new Float32Array(n*3),seed=[];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*t.r*0.9;
    pos[i*3]=Math.cos(a)*rr;pos[i*3+1]=(Math.random()-0.5)*80;pos[i*3+2]=Math.sin(a)*rr;
    seed.push(Math.random());
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffc078,size:0.5,transparent:true,opacity:0.75,depthWrite:false}));
  pts.frustumCulled=false;g.add(pts);
  thGroups.push({t,geo,pos,seed,pts,cyl});
}

/* ============ 滑翔机 / 信天翁 ============ */
const glider=new THREE.Group();world.add(glider);
const gm=new THREE.MeshStandardMaterial({color:0xf2f5f9,roughness:0.35,metalness:0.2});
const gmAcc=new THREE.MeshStandardMaterial({color:0xffa94d,roughness:0.4});
const fuse=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,1.1,4,10),gm);
fuse.rotation.z=Math.PI/2;glider.add(fuse);
const wing=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.045,3.5),gm);
wing.position.set(0.1,0.05,0);wing.rotation.y=0.06;glider.add(wing);
const tail=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.03,0.9),gm);
tail.position.set(-0.75,0.12,0);glider.add(tail);
const fin=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.42,0.03),gmAcc);
fin.position.set(-0.78,0.3,0);glider.add(fin);
// 尾迹
const TRAILN=420;
const trailPos=new Float32Array(TRAILN*3);
const trailGeo=new THREE.BufferGeometry();
trailGeo.setAttribute('position',new THREE.BufferAttribute(trailPos,3));
const trail=new THREE.Line(trailGeo,new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.5}));
trail.frustumCulled=false;world.add(trail);
let trailLen=0;

/* ============ 信天翁场景：海面 + 风梯度箭头 ============ */
const sea=new THREE.Mesh(new THREE.PlaneGeometry(500,500),
  new THREE.MeshStandardMaterial({color:0x1b4a66,roughness:0.25,metalness:0.1}));
sea.rotation.x=-Math.PI/2;sea.position.y=0;sea.visible=false;world.add(sea);
const windArrows=[];
const arrM=new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.8});
for(let i=0;i<6;i++){
  const g=new THREE.Group();g.position.set(-16,1+i*2.4,0);g.visible=false;world.add(g);
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1,6),arrM);
  shaft.rotation.z=-Math.PI/2;shaft.position.x=0.5;g.add(shaft);
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.5,8),arrM);
  head.rotation.z=-Math.PI/2;head.position.x=1.15;g.add(head);
  windArrows.push({g,shaft,head,h:2+i*12});
}
/* 风梯度剖面：U(h)=1.5+7.5·(h/14)^0.6 m/s（贴近海面切应力层，指数律近似） */
const windAt=h=>1.5+7.5*Math.pow(Math.max(h,0.5)/14,0.6);

/* ============ 状态 ============ */
let mode='th';                 // th | ridge | none | alb
let gx=-38,gz=0,psi=0.15,alt=320,V=26;   // 位置(1u=5m)、航向、高度(m)、空速(m/s)
let wUp=0,vario=0,albT=0,albLaps=0,resetFlash=0,simT=0;
function setWMode(m){
  mode=m;
  el('btnTh').classList.toggle('on',m==='th');
  el('btnRidge').classList.toggle('on',m==='ridge');
  el('btnNone').classList.toggle('on',m==='none');
  el('btnAlb').classList.toggle('on',m==='alb');
  sea.visible=m==='alb';
  ridge.visible=m!=='alb';
  terrain.visible=m!=='alb';
  thGroups.forEach(tg=>{tg.pts.visible=(m==='th');tg.cyl.visible=(m==='th');});
  for(const a of windArrows)a.g.visible=(m==='alb');
  if(m==='alb'){albT=0;albLaps=0;glider.position.set(14,1.5,0);}
  syncKeys();
}
function syncKeys(){
  const alb=mode==='alb';
  setK('sk0',L('高度','Altitude'));
  setK('sk1',alb?L('空速','Airspeed'):L('升降率','Vario'));
  setK('sk2',alb?L('海面风差 ΔU','Shear ΔU'):L('滑翔比 L/D','Glide ratio L/D'));
  setK('sk3',alb?L('已绕圈数','Laps flown'):L('推荐空速','Speed-to-fly'));
}
function setK(id,txt){const e=el(id);e.dataset.zh=txt;e.dataset.en=txt;e.textContent=txt;}

/* ============ 标签 ============ */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn,parent){
  const div=document.createElement('div');div.className='lbl '+cls;
  div.textContent=textFn();
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||scene).add(o);
  labelReg.push({o,text:textFn,vis:visFn||(()=>true)});
  return o;
}
addLabel(()=>L('热气流柱：午后地面烤出的上升气泡','Thermal: a bubble the hot ground releases'),new THREE.Vector3(8,58,-6),'o',()=>mode==='th');
addLabel(()=>L('迎风坡：山把风顶上去','Ridge: the slope turns wind into lift'),new THREE.Vector3(96,13,10),'g',()=>mode==='ridge');
addLabel(()=>L('风梯度：贴近海面风速骤降','Wind gradient: speed drops near the sea'),new THREE.Vector3(-16,15,0),'b',()=>mode==='alb');

/* ============ 步骤 ============ */
const STEPS=[
 {zh:'滑翔比 34:1：没有发动机，用升阻比换航程——掉 1 m 飞 34 m',en:'Glide ratio 34:1 — trade height for distance at the L/D ratio'},
 {zh:'极曲线：一点下沉率最小（久留空），一点滑得最远（空速更快）',en:'The polar: one point for min sink (stay up), one for best glide (fly faster)'},
 {zh:'热气流：飞进上升气流柱盘旋两圈，高度计反跌为涨',en:'Thermal: circle inside the rising column — the altimeter turns upward'},
 {zh:'山脊风与地形波：迎风坡被迫抬升，山脊/波也能托住滑翔机',en:'Ridge lift and mountain waves: the slope deflects air upward'},
 {zh:'MacCready：顶风与下沉带要飞快些——推荐空速实时重算',en:'MacCready: fly faster into headwind and sink — speed-to-fly recomputed live'},
 {zh:'动态翱翔：信天翁上下穿风梯度，两层风速差就是它的发动机',en:'Dynamic soaring: the albatross pumps the shear layer — ΔU is its engine'},
];
let activeStep=0;
function buildSteps(){
  const o=el('steps');o.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();gotoStep(i);});
    o.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  playing=true;el('play').textContent=L('暂停','Pause');
  if(i===0||i===1){setWMode('none');relight();}
  if(i===2){setWMode('th');relight();gx=-38;gz=0;}
  if(i===3){setWMode('ridge');relight();gx=40;alt=300;}
  if(i===4){setWMode('none');relight();el('sHead').value=50;el('sHeadVal').textContent='5.0 m/s';}
  if(i===5)setWMode('alb');
}
function relight(){
  gx=-38;gz=0;alt=320;psi=0.15;trailLen=0;
  for(let i=0;i<TRAILN;i++){trailPos[i*3]=gx;trailPos[i*3+1]=alt/5;trailPos[i*3+2]=gz;}
}

/* ============ 交互 ============ */
el('btnTh').addEventListener('click',()=>setWMode('th'));
el('btnRidge').addEventListener('click',()=>setWMode('ridge'));

  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);

/* ============ 主题 / 语言 ============ */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  el('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101a24:0xcfe0ec);
  scene.fog.color.setHex(dark?0x101a24:0xcfe0ec);
  terrM.color.setHex(dark?0x3d5233:0x7a9a63);
  sea.material.color.setHex(dark?0x1b4a66:0x3f7ea6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(e=>{
    if(e.tagName==='INPUT')return;
    e.textContent=LANG==='en'?(e.dataset.en||e.dataset.zh):e.dataset.zh;
  });
  el('langBtn').textContent=LANG==='en'?'ZH':'EN';
  el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps();syncKeys();
}

/* ============ 风场 ============ */
function wUpAt(x,z){
  const wT=+el('sW').value/10;
  if(mode==='th'){
    for(const t of thermals){
      const dx=x-t.x,dz=z-t.z,d2=dx*dx+dz*dz;
      if(d2<(t.r*2.2)**2)return wT*Math.exp(-d2/(t.r*t.r)*0.8);
    }
    return 0;
  }
  if(mode==='ridge'){ // 迎风面带宽内 w ∝ 风强×坡度，随高度衰减（简化带状模型）
    const s=x-83;
    if(s>0&&s<13)return wT*Math.sin(Math.PI*s/13)*1.15*Math.exp(-alt/900);
    return 0;
  }
  return 0;
}

/* ============ 统计与极曲线图 ============ */
function updateStats(){
  if(mode==='alb'){
    const h=Math.max(glider.position.y*5,0.5);
    const Va=albV;
    el('sv0').innerHTML=h.toFixed(0)+'<small> m</small>';
    el('sv1').innerHTML=Va.toFixed(1)+'<small> m/s</small>';
    el('sv2').innerHTML=(windAt(14)-windAt(1)).toFixed(1)+'<small> m/s</small>';
    el('sv3').textContent=albLaps.toFixed(1);
    return;
  }
  const sk=sinkOf(V);
  el('sv0').innerHTML=alt.toFixed(0)+'<small> m</small>';
  const v=vario;
  el('sv1').innerHTML=(v>=0?'+':'')+v.toFixed(2)+'<small> m/s</small>';
  el('sv1').style.color=v>=0?'#74d890':'#ff8787';
  el('sv2').innerHTML=(V/sk).toFixed(1)+'<small> : 1</small>';
  const wHead=+el('sHead').value/10;
  el('sv3').innerHTML=(speedToFly(wUp,wHead)*3.6).toFixed(0)+'<small> km/h</small>';
  drawPolar();
}
const cv=el('cvPolar'),cx=cv.getContext('2d');
function drawPolar(){
  const W=cv.width,H=cv.height,dark=THEME==='dark';
  cx.clearRect(0,0,W,H);
  cx.fillStyle=dark?'rgba(255,255,255,.04)':'rgba(15,25,40,.05)';
  cx.fillRect(0,0,W,H);
  const X=v=>(v-16)/(50-16)*(W-58)+40;
  const Y=s=>8+(s)/(2.6)*(H-30);
  cx.strokeStyle=dark?'#5b6b7d':'#8a99a9';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(40,8);cx.lineTo(40,Y(2.4));cx.lineTo(W-10,Y(2.4));cx.stroke();
  cx.fillStyle=dark?'#9fb0c3':'#5b6b7d';cx.font='10px sans-serif';
  cx.fillText(L('下沉率 m/s','sink m/s'),44,18);
  cx.fillText('18',(X(18)),H-16);cx.fillText('30',X(30)-6,H-16);cx.fillText('48 km/h',X(46)-20,H-16);
  // 极曲线
  cx.strokeStyle='#ffa94d';cx.lineWidth=2;cx.beginPath();
  for(let v=17;v<=48;v+=0.5){
    const y=Y(sinkOf(v));
    v===17?cx.moveTo(X(v),y):cx.lineTo(X(v),y);
  }
  cx.stroke();
  // 最小下沉 / 最佳滑翔 / 当前点 / 推荐速度
  const dot=(v,s,c,r)=>{cx.fillStyle=c;cx.beginPath();cx.arc(X(v),Y(s),r,0,7);cx.fill();};
  dot(V_MIN_SINK,sinkOf(V_MIN_SINK),'#74c0fc',3.5);
  cx.fillStyle='#74c0fc';cx.fillText(L('最小下沉','min sink'),X(V_MIN_SINK)-20,Y(sinkOf(V_MIN_SINK))-8);
  dot(27,sinkOf(27),'#74d890',3.5);
  cx.fillStyle='#74d890';cx.fillText(L('最远滑翔','best glide'),X(27)+6,Y(sinkOf(27))+12);
  const wHead=+el('sHead').value/10;
  const vtf=speedToFly(wUp,wHead);
  cx.strokeStyle=dark?'rgba(255,169,77,.5)':'rgba(232,89,12,.5)';
  cx.setLineDash([3,3]);cx.beginPath();cx.moveTo(X(vtf),8);cx.lineTo(X(vtf),Y(2.4));cx.stroke();cx.setLineDash([]);
  dot(V,sinkOf(V),dark?'#ffffff':'#16202c',4);
  cx.strokeStyle='#ff6b6b';cx.lineWidth=1.5;cx.beginPath();cx.arc(X(V),Y(sinkOf(V)),6,0,7);cx.stroke();
}

/* ============ 物理推进 ============ */
let albV=10;
function stepSim(dt){
  const wHead=+el('sHead').value/10,wT=+el('sW').value/10;
  if(mode==='alb'){
    /* 动态翱翔（简化记账）：绕圈爬升段穿过风梯度获得相对气流增量，
       两次穿越各赚约 ΔU 一份动能——空速随之起伏（Rayleigh 1883） */
    albT+=dt;
    const T=9,R=14;
    const ph=albT/T*Math.PI*2;
    const bx=Math.cos(ph)*R,bz=Math.sin(ph)*R;
    const bh=7.5+6.5*Math.sin(ph);            // 高度 m
    const Utop=windAt(14),Ulow=windAt(1);
    albV=9+0.8*(windAt(Math.max(bh,1))-Ulow)*(0.5+0.5*Math.sin(2*ph));
    glider.position.set(bx,bh/5,bz);
    glider.rotation.set(0,-ph-Math.PI/2,-0.3*Math.cos(ph));
    albLaps=albT/T;
    for(const a of windArrows){
      const s=windAt(a.h)/windAt(14);
      a.shaft.scale.x=s*3;a.head.position.x=s*3+0.15;
    }
    return;
  }
  /* —— 自动驾驶：找热气流 / 盘旋 —— */
  let w=wUpAt(gx,gz);
  if(mode==='th'){
    let best=null,bd=1e9;
    for(const t of thermals){
      const d=Math.hypot(gx-t.x,gz-t.z);
      if(d<bd){bd=d;best=t;}
    }
    if(best){
      const toT=Math.atan2(best.z-gz,best.x-gx);
      if(bd>best.r*0.8){
        let dd=toT-psi;while(dd>Math.PI)dd-=2*Math.PI;while(dd<-Math.PI)dd+=2*Math.PI;
        psi+=clamp(dd,-0.45*dt,0.45*dt);        // 转向热气流
      }else psi+=(V/5)/8*dt;                     // 在柱内盘旋（半径≈40m，柱内）
    }
  }else if(mode==='ridge'){
    // 到达迎风带后沿山脊(z 向)飞行，留在上升带里爬升
    if(gx>78){
      let dd=Math.PI/2-psi;while(dd>Math.PI)dd-=2*Math.PI;while(dd<-Math.PI)dd+=2*Math.PI;
      psi+=clamp(dd,-0.3*dt,0.3*dt);
    }else psi+=Math.sin(simT*0.2)*0.03*dt;
  }else{
    psi+=Math.sin(simT*0.15)*0.02*dt;
  }
  w=wUpAt(gx,gz);
  const sk=sinkOf(V);
  vario+=((w-sk)-vario)*Math.min(1,dt*3);
  alt+=vario*dt;
  gx+=(V/5*Math.cos(psi)-wHead/5)*dt;
  gz+=V/5*Math.sin(psi)*dt;
  if(alt<60){alt=320;resetFlash=1.6;}            // 掉到底：重新拖曳起飞
  resetFlash=Math.max(0,resetFlash-dt);
  /* —— 场景 —— */
  glider.position.set(gx,alt/5,gz);
  const bank=mode==='th'?0.38:0;
  glider.rotation.set(0,-psi,bank);
  // 尾迹
  trailLen=Math.min(trailLen+dt*8,TRAILN);
  for(let i=TRAILN-1;i>0;i--){
    trailPos[i*3]=trailPos[(i-1)*3];trailPos[i*3+1]=trailPos[(i-1)*3+1];trailPos[i*3+2]=trailPos[(i-1)*3+2];
  }
  trailPos[0]=gx;trailPos[1]=alt/5;trailPos[2]=gz;
  trailGeo.setDrawRange(0,Math.floor(trailLen));
  trailGeo.attributes.position.needsUpdate=true;
  // 热气流粒子上升
  for(const tg of thGroups){
    const p=tg.pos,sp=wT/5;
    for(let i=0;i<90;i++){
      p[i*3+1]+=sp*dt*(0.6+tg.seed[i]*0.5);
      if(p[i*3+1]>40)p[i*3+1]-=80;
    }
    tg.geo.attributes.position.needsUpdate=true;
  }
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0;
const prevTgt=new THREE.Vector3(0,4,0);
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  if(playing){simT+=dt0*timeScale;stepSim(dt0*timeScale);}
  // 跟随相机：目标跟随飞机，位移同步到相机（不破坏用户环绕）
  const tp=mode==='alb'?glider.position:new THREE.Vector3(glider.position.x,glider.position.y,glider.position.z);
  controls.target.lerp(tp,Math.min(1,dt0*2.5));
  const d=controls.target.clone().sub(prevTgt);
  camera.position.add(d);prevTgt.copy(controls.target);
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSteps();
el('tglLabels').checked=labelsOn;
el('sSpd').value=timeScale*100;el('sSpdVal').textContent=timeScale.toFixed(1)+'×';
prevTgt.copy(controls.target);
glider.position.set(gx,alt/5,gz);glider.rotation.set(0,-psi,0);
updateStats();start();
</script>
