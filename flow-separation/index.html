<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>边界层分离与失速</title>
<style>
:root,:root[data-theme="dark"]{color-scheme:dark;
  --acc:#4dabf7;--bg:#0f1214;--panel:rgba(15,18,20,.86);--panel-border:rgba(255,255,255,.09);
  --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;--hover:rgba(255,255,255,.05);
  --shadow:0 8px 30px rgba(0,0,0,.45);--tool:rgba(15,18,20,.78);--tool-border:rgba(255,255,255,.12);}
:root[data-theme="light"]{color-scheme:light;
  --acc:#1864ab;--bg:#eef2f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
  --text:#16202c;--text2:#5b6b7d;--text3:#33414f;--hover:rgba(15,25,40,.05);
  --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s;}
#app{position:fixed;inset:0;}#app canvas{display:block;}
#tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
.tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
  font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;text-decoration:none;backdrop-filter:blur(6px);transition:border-color .15s,color .15s,transform .15s;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
#title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
#title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
#title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5);}
#plot{position:fixed;right:18px;bottom:18px;z-index:4;width:330px;height:214px;
  background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
  backdrop-filter:blur(6px);padding:8px 10px 6px;}
#plot h3{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:2px;}
#plotCv{width:100%;height:calc(100% - 20px);display:block;}
#stats{position:fixed;right:18px;bottom:244px;z-index:4;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
  backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px;}
#stats .k{font-size:12px;color:var(--text2);align-self:center;}
#stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
#stats .v small{font-size:11px;color:var(--text2);font-weight:400;}
#stats .v.ok{color:#7bd88f;}#stats .v.warn{color:#ffa94d;}#stats .v.bad{color:#ff6b6b;}
#panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
  background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
  padding:14px 16px 12px;backdrop-filter:blur(6px);box-shadow:var(--shadow);
  max-height:calc(100vh - 160px);overflow:auto;}
#actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;background:var(--hover);
  color:var(--text2);border:1px solid var(--tool-border);border-radius:9px;padding:7px 10px;
  font-size:12.5px;font-weight:600;transition:border-color .15s,color .15s,background .15s;}
.abtn:hover{border-color:var(--acc);color:var(--text);}
.abtn.on{border-color:rgba(77,171,247,.6);background:rgba(77,171,247,.12);color:var(--text);}
:root[data-theme="light"] .abtn.on{border-color:rgba(24,100,171,.55);background:rgba(24,100,171,.10);}
.row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.row label{font-size:12px;color:var(--text2);flex:0 0 80px;}
.row .val{font-size:11.5px;color:var(--text3);flex:0 0 42px;text-align:right;font-variant-numeric:tabular-nums;}
input[type=range]{width:100%;accent-color:var(--acc);height:18px;}
#formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);
  border-top:1px dashed var(--panel-border);padding-top:7px;}
#formula b{color:var(--text3);font-weight:600;}
#steps{list-style:none;margin-top:8px;}
#steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;align-items:flex-start;}
#steps li:hover{background:var(--hover);}
#steps li.on{background:rgba(77,171,247,.10);border-color:rgba(77,171,247,.45);}
:root[data-theme="light"] #steps li.on{background:rgba(24,100,171,.08);border-color:rgba(24,100,171,.4);}
#steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  background:rgba(255,255,255,.12);color:var(--text3);}
:root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10);}
#steps li.on .n{background:var(--acc);color:#fff;}
#steps .t{font-size:12px;color:var(--text3);line-height:1.45;}
#steps .t b{color:var(--text);font-size:12px;}
#steps li.on .t b{color:#bde9ff;}
:root[data-theme="light"] #steps li.on .t b{color:var(--acc);}
#ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
#play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
  background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer;}
#play:hover{filter:brightness(1.12);}
@media(max-width:1150px){#plot{display:none;}#stats{bottom:18px;}}
@media(max-width:900px){#stats{display:none;}}
@media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh;}
  #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="title">
  <h1 data-zh="边界层分离与失速" data-en="Boundary Layer Separation &amp; Stall">边界层分离与失速</h1>
  <div class="sub" data-zh="逆压梯度把边界层从翼面剥离——升力崩溃的那一刻" data-en="Adverse pressure gradient peels the boundary layer off — the moment lift collapses">逆压梯度把边界层从翼面剥离——升力崩溃的那一刻</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="攻角 AoA °" data-en="AoA °">攻角 AoA °</span><span class="v" id="stAoA">5<small>°</small></span>
  <span class="k" data-zh="升力系数 CL" data-en="Lift coeff CL">升力系数 CL</span><span class="v ok" id="stCL">0.549</span>
  <span class="k" data-zh="阻力系数 CD" data-en="Drag coeff CD">阻力系数 CD</span><span class="v" id="stCD">0.036</span>
  <span class="k" data-zh="分离位置 x/c" data-en="Sep. point x/c">分离位置 x/c</span><span class="v ok" id="stSep">0.95</span>
</div>
<div id="plot">
  <h3 data-zh="CL vs 攻角 (升力极曲线 · 失速断裂)" data-en="CL vs AoA (polar curve · stall break)">CL vs 攻角 (升力极曲线)</h3>
  <canvas id="plotCv"></canvas>
</div>
<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnNormal"  data-zh="正常飞行 5° / Normal 5°"  data-en="Normal 5°">正常飞行 5°</button>
    <button class="abtn" id="btnCritical" data-zh="临界攻角 15° / Critical 15°" data-en="Critical 15°">临界攻角 15°</button>
    <button class="abtn" id="btnStall"   data-zh="失速 18° / Stall 18°"       data-en="Stall 18°">失速 18°</button>
    <button class="abtn" id="btnTurb"    data-zh="湍流 BL / Turbulent BL"     data-en="Turbulent BL">湍流 BL</button>
  </div>
  <div class="row">
    <label data-zh="攻角 AoA" data-en="AoA">攻角 AoA</label>
    <input id="aoaSlider" type="range" min="0" max="22" step="0.5" value="5">
    <span class="val" id="aoaVal">5°</span>
  </div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="暂停" data-en="Pause">暂停</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
/* ---- renderer ---- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,100);
camera.position.set(0,2,10);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=22;
scene.add(new THREE.HemisphereLight(0x9db4d6,0x2c3038,0.6));
const key=new THREE.DirectionalLight(0xffffff,1.8); key.position.set(5,9,7); scene.add(key);
const fill=new THREE.DirectionalLight(0x8faaff,0.35); fill.position.set(-6,3,-5); scene.add(fill);
/* ---- state ---- */
let AoA=5, turbulent=false, playing=true, simT=0;
/* ---- NACA 0012 helper ---- */
function naca0012y(t){
  return 5*0.12*(0.2969*Math.sqrt(t)-0.1260*t-0.3516*t*t+0.2843*t*t*t-0.1015*t*t*t*t);
}
/* ---- Airfoil geometry ---- */
const CHORD=3.0, SPAN=1.8;
function buildFoilShape(){
  const N=64; const pts=[];
  for(let i=0;i<=N;i++){const t=i/N; pts.push(new THREE.Vector2(t*CHORD-CHORD/2, naca0012y(t)*CHORD));}
  for(let i=N;i>=0;i--){const t=i/N; pts.push(new THREE.Vector2(t*CHORD-CHORD/2,-naca0012y(t)*CHORD));}
  return new THREE.Shape(pts);
}
const foilShape=buildFoilShape();
const foilGeo=new THREE.ExtrudeGeometry(foilShape,{depth:SPAN,bevelEnabled:false});
const foilMat=new THREE.MeshStandardMaterial({color:0x4a6080,roughness:0.3,metalness:0.65,side:THREE.DoubleSide});
const foilGroup=new THREE.Group();
const foilMesh=new THREE.Mesh(foilGeo,foilMat);
foilMesh.position.z=-SPAN/2;
foilGroup.add(foilMesh);
scene.add(foilGroup);
/* ---- Streamlines ---- */
const NSTREAM=8, SPTS=60;
const streamMeshes=[];
for(let i=0;i<NSTREAM;i++){
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(SPTS*3); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const col=i>=NSTREAM/2?0x74c0fc:0xffd43b;
  const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.75});
  const line=new THREE.Line(geo,mat);
  scene.add(line); streamMeshes.push({geo,pos,mat,col});
}
/* ---- Physics helpers ---- */
function sepPointXc(){
  const critAoA=turbulent?18:15;
  if(AoA<=0)return 1.0;
  if(AoA>=critAoA)return 0.04;
  const t=AoA/critAoA;
  return Math.max(0.04,1.0-Math.pow(t,2.8)*0.96);
}
function computeCL(){
  const critAoA=turbulent?18:15;
  if(AoA<=critAoA){return Math.min(2*Math.PI*(AoA*Math.PI/180)*0.9,1.85);}
  return Math.max(0.25,1.75*(1-(AoA-critAoA)/8));
}
function computeCD(){
  const CL=computeCL(); const sp=sepPointXc();
  return 0.011+CL*CL*0.075+(1-sp)*0.32+(turbulent?0.003:0);
}
/* ---- Update streamlines ---- */
function updateStreamlines(){
  const sp=sepPointXc();
  const aRad=AoA*Math.PI/180;
  const sepX=(sp*CHORD)-CHORD/2;
  for(let si=0;si<NSTREAM;si++){
    const {geo,pos,mat}=streamMeshes[si];
    const frac=(si+0.5)/NSTREAM;
    const yBase=-2.2+frac*4.4;
    const upper=yBase>0;
    for(let pi=0;pi<SPTS;pi++){
      const t=pi/(SPTS-1);
      const xw=-5+t*10;
      let yw=yBase;
      const inFoil=xw>=-CHORD/2&&xw<=CHORD/2;
      if(inFoil){
        const tc=(xw+CHORD/2)/CHORD;
        const foilY=naca0012y(tc)*CHORD;
        const deflect=Math.exp(-Math.abs(yBase)*1.8)*0.8;
        if(upper){
          if(xw<sepX){
            yw=yBase+foilY*deflect*(0.4+Math.sin(aRad)*0.5);
          } else {
            const prog=(xw-sepX)/Math.max(0.01,CHORD/2-sepX);
            const chaos=(1-sp)*(Math.sin(yBase*3+xw*4)*0.08);
            yw=yBase+foilY*deflect*(0.4+Math.sin(aRad)*0.5)*(1-prog*0.8)+chaos*prog;
          }
        } else {
          yw=yBase-foilY*deflect*0.3;
        }
      } else if(xw>CHORD/2&&upper&&sp<0.8){
        const wf=Math.min(1,(xw-CHORD/2)/2.0);
        yw=yBase+wf*(1-sp)*0.35*Math.sin(yBase*1.5+simT*2);
      }
      pos[pi*3]=xw; pos[pi*3+1]=yw; pos[pi*3+2]=0;
    }
    geo.attributes.position.needsUpdate=true;
    const stalled=AoA>(turbulent?18:15);
    if(upper){mat.color.set(stalled?0xff6b6b:0x74c0fc);}
    else{mat.color.set(0xffd43b);}
    mat.opacity=upper?0.8:0.55;
  }
}
/* ---- Lift & Drag arrows ---- */
const liftArrow=new THREE.ArrowHelper(new THREE.Vector3(0,1,0),new THREE.Vector3(0,-2.2,0),2,0x7bd88f,0.28,0.16);
scene.add(liftArrow);
const dragArrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,-0.5,0),0.6,0xff6b6b,0.2,0.13);
scene.add(dragArrow);
/* ---- Separation bubble indicator ---- */
const bubbleMat=new THREE.MeshBasicMaterial({color:0xff8800,transparent:true,opacity:0.35,side:THREE.DoubleSide});
const bubbleGeo=new THREE.CircleGeometry(0.18,16);
const bubbleMesh=new THREE.Mesh(bubbleGeo,bubbleMat);
scene.add(bubbleMesh);
/* ---- Boundary-layer tube ---- */
const blPts=[]; for(let i=0;i<=30;i++){const t=i/30;blPts.push(new THREE.Vector3(t*CHORD-CHORD/2,naca0012y(t)*CHORD+0.06,0));}
const blCurve=new THREE.CatmullRomCurve3(blPts);
const blGeo=new THREE.TubeGeometry(blCurve,40,0.03,6,false);
const blMat=new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.55});
const blMesh=new THREE.Mesh(blGeo,blMat);
scene.add(blMesh);
/* ---- Ground plane ---- */
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(22,10),new THREE.MeshStandardMaterial({color:0x181e28,roughness:0.95}));
gnd.rotation.x=-Math.PI/2; gnd.position.y=-3.5; scene.add(gnd);
/* ---- steps ---- */
const STEPS=[
  {zh:'边界层：粘性使壁面速度=0，速度在极薄层内从0升到自由流',en:'Boundary layer: viscosity → v=0 at wall; velocity rises to free-stream in a thin layer'},
  {zh:'顺压梯度：前半翼流体加速（压强降），有利于边界层贴附',en:'Favorable gradient: flow accelerates over leading section — BL stays attached'},
  {zh:'逆压梯度：后半翼流体减速（压强升），近壁流体动量不足',en:'Adverse gradient: flow decelerates over trailing section — near-wall momentum deficit'},
  {zh:'分离：近壁流体动量耗尽后反向流动，边界层从壁面剥离',en:'Separation: near-wall flow reverses — BL detaches from surface'},
  {zh:'失速：攻角增大使分离点从后缘向前缘推进，约 15° 时突然全部分离',en:'Stall: increasing AoA pushes separation forward — sudden full separation at ~15°'},
  {zh:'湍流边界层：近壁动量更高，抗分离更强（高尔夫球凹坑原理）',en:'Turbulent BL: more near-wall momentum → resists separation better (golf ball dimples)'},
];
function buildSteps(){
  const el=document.getElementById('steps'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    const txt=LANG==='en'?s.en:s.zh;
    const colon=txt.indexOf(LANG==='en'?':':'：');
    const bold=colon>0?txt.slice(0,colon+1):txt.slice(0,Math.min(18,txt.length));
    const rest=colon>0?txt.slice(colon+1):'';
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${bold}</b>${rest}</span>`;
    li.addEventListener('click',()=>{li.classList.toggle('on');});
    el.appendChild(li);
  });
}
/* ---- Formula panel ---- */
function updateFormula(){
  const CL=computeCL(),CD=computeCD(),sp=sepPointXc();
  const stalled=AoA>(turbulent?18:15);
  document.getElementById('formula').innerHTML=
    `<b>${L('升力系数','Lift coeff')}:</b> CL = 2π·α·sin(α) ≈ <b>${CL.toFixed(3)}</b>${stalled?(' <span style="color:#ff6b6b">['+L('失速','STALL')+']</span>'):''}<br>`+
    `<b>${L('阻力系数','Drag coeff')}:</b> CD = CD₀ + CL²/(π·AR·e) ≈ <b>${CD.toFixed(3)}</b><br>`+
    `<b>${L('分离点','Sep. point')}:</b> x/c = <b>${sp.toFixed(2)}</b>  ${turbulent?L('（湍流 BL）','(turbulent BL)'):''}`;
}
/* ---- Stats panel ---- */
function updateStats(){
  const CL=computeCL(),CD=computeCD(),sp=sepPointXc();
  const stalled=AoA>(turbulent?18:15);
  document.getElementById('stAoA').innerHTML=AoA.toFixed(1)+'<small>°</small>';
  const clEl=document.getElementById('stCL');
  clEl.textContent=CL.toFixed(3); clEl.className='v '+(stalled?'bad':CL>1.2?'warn':'ok');
  document.getElementById('stCD').textContent=CD.toFixed(3);
  document.getElementById('stSep').textContent=sp.toFixed(2);
  liftArrow.setLength(Math.max(0.1,CL*1.6),0.28,0.16);
  dragArrow.setLength(Math.max(0.05,CD*5),0.2,0.13);
  liftArrow.setColor(stalled?0xff6b6b:0x7bd88f);
  const sepXworld=(sp*CHORD)-CHORD/2;
  const foilTopAtSep=naca0012y(sp)*CHORD;
  bubbleMesh.position.set(sepXworld,foilTopAtSep+0.1,0);
  bubbleMesh.visible=sp>0.05&&sp<0.95;
}
/* ---- CL polar plot ---- */
function drawPlot(){
  const cv=document.getElementById('plotCv');
  const W=cv.parentElement.clientWidth-20, H=cv.parentElement.clientHeight-22;
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  const isDark=THEME==='dark';
  ctx.fillStyle=isDark?'rgba(15,18,20,0)':'rgba(238,242,246,0)';
  ctx.clearRect(0,0,W,H);
  const xm=38,xr=W-10,ym=8,yb=H-22;
  const xScale=(xr-xm)/22, yScale=(yb-ym)/2.2;
  ctx.strokeStyle=isDark?'rgba(255,255,255,.12)':'rgba(0,0,0,.12)';
  ctx.lineWidth=1;
  for(let a=0;a<=22;a+=5){const x=xm+a*xScale; ctx.beginPath();ctx.moveTo(x,ym);ctx.lineTo(x,yb);ctx.stroke();}
  for(let c=0;c<=2.2;c+=0.5){const y=yb-c*yScale; ctx.beginPath();ctx.moveTo(xm,y);ctx.lineTo(xr,y);ctx.stroke();}
  ctx.fillStyle=isDark?'rgba(158,176,195,.7)':'rgba(80,100,120,.7)';
  ctx.font='9px system-ui'; ctx.textAlign='center';
  for(let a=0;a<=22;a+=5) ctx.fillText(a+'°',xm+a*xScale,H-6);
  ctx.textAlign='right';
  for(let c=0;c<=2;c+=0.5) ctx.fillText(c.toFixed(1),xm-3,yb-c*yScale+4);
  const drawPolar=(isTurb,col)=>{
    ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.beginPath();
    const critAoA=isTurb?18:15;
    for(let a=0;a<=22;a+=0.4){
      let cl; if(a<=critAoA){cl=Math.min(2*Math.PI*(a*Math.PI/180)*0.9,1.85);}
      else{cl=Math.max(0.2,1.75*(1-(a-critAoA)/8));}
      const x=xm+a*xScale, y=yb-cl*yScale;
      a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  };
  drawPolar(false,isDark?'#74c0fc':'#1864ab');
  drawPolar(true,isDark?'#69db7c':'#2b8a3e');
  const critAoA=turbulent?18:15;
  const CL=computeCL();
  const dotX=xm+AoA*xScale, dotY=yb-CL*yScale;
  ctx.fillStyle=AoA>critAoA?'#ff6b6b':'#ffa94d';
  ctx.beginPath(); ctx.arc(dotX,dotY,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=isDark?'rgba(158,176,195,.85)':'rgba(50,70,90,.85)';
  ctx.font='9.5px system-ui'; ctx.textAlign='left';
  ctx.fillText(L('蓝=层流  绿=湍流 BL','blue=laminar  green=turbulent BL'),xm+2,ym+10);
}
/* ---- Theme / Lang ---- */
function applyTheme(){
  htmlEl.setAttribute('data-theme',THEME);
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  renderer.setClearColor(THEME==='dark'?0x0f1214:0xeef2f6);
  scene.background=new THREE.Color(THEME==='dark'?0x0f1214:0xeef2f6);
  drawPlot();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh;});
  document.getElementById('langBtn').textContent=LANG==='en'?'中':'EN';
  document.title=L('边界层分离与失速','Boundary Layer Separation & Stall');
  buildSteps(); updateFormula(); drawPlot();
}
/* ---- Action buttons ---- */
function setAoA(v){
  AoA=v;
  document.getElementById('aoaSlider').value=v;
  document.getElementById('aoaVal').textContent=v.toFixed(1)+'°';
  foilGroup.rotation.z=-AoA*Math.PI/180;
  updateStreamlines(); updateStats(); updateFormula(); drawPlot();
}
document.getElementById('btnNormal').addEventListener('click',()=>setAoA(5));
document.getElementById('btnCritical').addEventListener('click',()=>setAoA(15));
document.getElementById('btnStall').addEventListener('click',()=>setAoA(18));
document.getElementById('btnTurb').addEventListener('click',()=>{
  turbulent=!turbulent;
  document.getElementById('btnTurb').classList.toggle('on',turbulent);
  updateStreamlines(); updateStats(); updateFormula(); drawPlot();
});
document.getElementById('aoaSlider').addEventListener('input',e=>{
  AoA=parseFloat(e.target.value);
  document.getElementById('aoaVal').textContent=AoA.toFixed(1)+'°';
  foilGroup.rotation.z=-AoA*Math.PI/180;
  updateStreamlines(); updateStats(); updateFormula(); drawPlot();
});
/* ---- Play/Pause ---- */
const playBtn=document.getElementById('play');
function setPlayLabel(){playBtn.textContent=playing?(LANG==='en'?'Pause':'暂停'):(LANG==='en'?'Play':'播放');}
playBtn.addEventListener('click',()=>{playing=!playing;setPlayLabel();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playBtn.click();}});
/* ---- Theme / Lang buttons ---- */
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);drawPlot();});
/* ---- Animation loop ---- */
const clock=new THREE.Clock();
let accStats=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);
  if(playing) simT+=dt;
  accStats+=dt;
  if(accStats>0.12){accStats=0;updateStats();updateStreamlines();}
  controls.update();
  renderer.render(scene,camera);
}
foilGroup.rotation.z=-AoA*Math.PI/180;
updateStreamlines(); updateStats(); updateFormula();
applyTheme(); applyLang(); buildSteps(); drawPlot();
requestAnimationFrame(frame);
</script>
