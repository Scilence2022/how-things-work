<style>

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }

    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }

  #steps .n { flex: 0 0 15px; height: 15px; border-radius: 50%; font-size: 10.5px;

  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;

  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>

<div id="title">
  <h1 data-zh="高压共轨与喷油嘴:把「压力」从转速里解放出来" data-en="Common-Rail Injection: Freeing Pressure from Engine Speed">高压共轨与喷油嘴:把「压力」从转速里解放出来</h1>
  <div class="sub" data-zh="高压泵(柱塞 ~2 cm³/转)把柴油压进共轨管,1,800-2,500 bar 轨压由 ECU 闭环调压——压力与转速解耦,怠速也有 2,000 bar。每次喷油:电磁阀/压电晶体通电 0.1-0.5 ms,针阀抬起 ~0.2 mm,5-8 个 ø0.10-0.15 mm 喷孔喷出 SMD ~5-10 μm 的雾;一次燃烧拆成预喷-主喷-后喷 3-5 段,喷油量=轨压×脉宽,重复精度 ±1% · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A high-pressure pump (plunger ~2 cm³/rev) feeds the rail at 1,800-2,500 bar, held by closed-loop ECU control - pressure is decoupled from speed, so even idle sees 2,000 bar. Each shot: solenoid/piezo energized 0.1-0.5 ms, needle lifts ~0.2 mm, and 5-8 holes of ø0.10-0.15 mm atomize fuel into 5-10 μm droplets. One combustion splits into pilot-main-post (3-5 segments); quantity = pressure × pulse width with ±1% repeatability · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">高压共轨与喷油嘴:把「压力」从转速里解放出来</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = x => clamp(x, 0, 1);
const TAU = Math.PI * 2;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0f1216 : 0xeff1f4);
  M.ground.color.set(dark ? 0x171b21 : 0xd8dee5);
  M.grid.color.set(dark ? 0x2c3540 : 0xa9b6c2);
  M.block.color.set(dark ? 0x3d4d63 : 0x5f7186);         // 泵体/基座
  M.railM.color.set(dark ? 0x9fb0c3 : 0x8494a6);         // 共轨管
  M.inj.color.set(dark ? 0x8fa3bd : 0x7d8fa6);           // 喷油器体
  M.needle.color.set(dark ? 0xd8b25c : 0xc09a45);        // 针阀(金=主角)
  M.liner.color.set(dark ? 0x8fb8d8 : 0xa8c8de);         // 透明缸套
  M.piston.color.set(dark ? 0x39424e : 0x5d6874);        // 活塞
  M.spray.color.set(dark ? 0xffc95c : 0xd89a2a);         // 喷雾
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('body *').forEach(el => {
    if (el.dataset && el.dataset.zh !== undefined) el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('高压共轨与喷油嘴 · 压力与转速解耦', 'Common-Rail Injection · Pressure Decoupled from Speed');
  buildSteps();
  setPlayLabel();
  markStep();
  syncPhase();
  updateRailP();
  updatePw();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();

const NP = 520;
const pPos = new Float32Array(NP * 3).fill(-999);
const pVel = new Float32Array(NP * 3);
const pLife = new Float32Array(NP);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const sprayPts = new THREE.Points(pGeo, M.spray);
sprayPts.frustumCulled = false;

let emitAcc = 0, pHead = 0;
const ORIG = new THREE.Vector3(INJ_X, 0.002, 0);
function emit(n) {
  const halfA = (11 - 3.5 * (railP - 600) / 1900) * Math.PI / 180;   // 轨压高→锥更窄
  const v0 = 0.30 + 0.55 * (vJet() / 780);                            // 演示慢放速度
  for (let i = 0; i < n; i++) {
    const az = Math.random() * TAU;
    const th = Math.random() * halfA;
    const sp = v0 * (0.75 + 0.5 * Math.random());
    const k = pHead; pHead = (pHead + 1) % NP;
    pPos[k * 3] = ORIG.x; pPos[k * 3 + 1] = ORIG.y; pPos[k * 3 + 2] = ORIG.z;
    pVel[k * 3] = Math.sin(th) * Math.cos(az) * sp;
    pVel[k * 3 + 1] = -Math.cos(th) * sp;
    pVel[k * 3 + 2] = Math.sin(th) * Math.sin(az) * sp;
    pLife[k] = 0.5 + 0.25 * Math.random();
  }
}

  scopeCtx.font = `${Math.round(9 * dpr)}px system-ui`;
  scopeCtx.fillStyle = 'rgba(150,160,175,.9)';
  scopeCtx.fillText(L('针阀 · 轨压 · 喷油率', 'needle · rail p · rate'), 4 * dpr, 11 * dpr);
  scopeCtx.fillStyle = 'rgba(150,160,175,.55)';
  scopeCtx.fillText(L('最近 ~2 个循环', 'last ~2 cycles'), cw - 74 * dpr, ch - 4 * dpr);
  if (hist.length < 2) return;
  const series = [
    { k: 0, c: 'rgba(116,192,252,.95)', mx: 1.2 },
    { k: 1, c: 'rgba(255,169,77,.95)', mx: 1.2 },
    { k: 2, c: 'rgba(123,216,143,.95)', mx: 1.2 },
  ];
  for (const ser of series) {
    scopeCtx.strokeStyle = ser.c;
    scopeCtx.lineWidth = Math.max(1.2, 1.2 * dpr);
    scopeCtx.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const x = i / (hist.length - 1) * cw;
      const v = ch - (0.08 + 0.84 * clamp01(hist[i][ser.k] / ser.mx)) * ch;
      i === 0 ? scopeCtx.moveTo(x, v) : scopeCtx.lineTo(x, v);
    }
    scopeCtx.stroke();
  }
}

/* ---------------- UI ---------------- */
const elPlay = document.getElementById('play');
const elPhase = document.getElementById('phase'), elPhaseVal = document.getElementById('phaseVal');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const elRailP = document.getElementById('railP'), elRailPVal = document.getElementById('railPVal');
const elPw = document.getElementById('pw'), elPwVal = document.getElementById('pwVal');
const tglCurve = document.getElementById('tglCurve');
const tglSpray = document.getElementById('tglSpray');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function refreshLabels() {
  for (const r of labelReg) r.o.visible = labelsOn;
}
function updateRailP() {
  railP = +elRailP.value;
  elRailPVal.textContent = railP + ' bar';
  updateFormula();
}
function updatePw() {
  pw = (+elPw.value) / 100;
  elPwVal.textContent = pw.toFixed(2) + ' ms';
  updateFormula();
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elPhase.addEventListener('input', () => {
  activateStep(Math.round(parseInt(elPhase.value, 10) / 1000 * (STEPS.length - 1)));
});
elSpeed.addEventListener('input', () => { speed = (+elSpeed.value) / 10; elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elRailP.addEventListener('input', () => {
  updateRailP();
  btnIdle.classList.remove('on'); btnFull.classList.remove('on'); btnDPF.classList.remove('on');
});
elPw.addEventListener('input', () => {
  updatePw();
  btnIdle.classList.remove('on'); btnFull.classList.remove('on'); btnDPF.classList.remove('on');
});
tglCurve.addEventListener('change', () => { scope.style.display = tglCurve.checked ? 'block' : 'none'; if (tglCurve.checked) sizeScope(); });
tglSpray.addEventListener('change', () => { sprayPts.visible = tglSpray.checked; });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { labelsOn = false; tglLabels.checked = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  sizeScope();
});

/* ---------------- stats 刷新 ---------------- */
const stA = document.getElementById('stA'), stB = document.getElementById('stB'),
  stC = document.getElementById('stC'), stD = document.getElementById('stD'),
  stE = document.getElementById('stE'), stF = document.getElementById('stF');
function updateStats() {
  stA.innerHTML = railP.toFixed(0) + '<small> bar</small>';
  stA.className = 'v ' + (railP >= 1800 ? 'ok' : 'warn');
  stB.innerHTML = pw.toFixed(2) + '<small> ms</small>';
  stB.className = 'v ok';
  stC.innerHTML = qShot().toFixed(1) + '<small> mg</small>';
  stC.className = 'v ok';
  stD.innerHTML = vJet().toFixed(0) + '<small> m/s</small>';
  stD.className = 'v ok';
  stE.innerHTML = smd().toFixed(1) + '<small> μm</small>';
  stE.className = 'v ' + (smd() <= 10 ? 'ok' : 'warn');
  const noise = 70 - (preOn ? 35 : 0);
  stF.innerHTML = noise + '<small> /100</small>';
  stF.className = 'v ' + (noise <= 40 ? 'ok' : noise <= 55 ? 'warn' : 'bad');
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let rafOn = false, lastStatsT = 0;
function frame() {
  const dt = clamp(clock.getDelta(), 0, 0.05);
  et += dt;
  const dts = playing ? dt * speed : 0;
  /* 分段定义 */
  const md = mainDemo();
  const segs = [];
  if (preOn) segs.push({ t0: 0.12, d: 0.07, main: false });
  segs.push({ t0: 0.32, d: md, main: true });
  if (postOn) segs.push({ t0: 0.32 + md + 0.10, d: 0.09, main: false });
  nSeg = segs.length + 1;
  evT = (evT + dts) % EV_LEN;
  let active = false, isMain = false;
  for (const sg of segs) {
    if (evT >= sg.t0 && evT < sg.t0 + sg.d) { active = true; isMain = sg.main; }
  }
  /* 主喷结束沿 → 着火发光 */
  if (wasMain && !isMain && glowT < 0) glowT = et;
  wasMain = isMain;
  if (isMain) { glowT = -1; glow = 0; }
  if (glowT >= 0) { glow = Math.max(0, 1 - (et - glowT) / 0.5); if (glow <= 0) glowT = -1; }
  /* 针阀 / 轨压 / 泵柱塞 */
  lift += ((active ? 1 : 0) - lift) * Math.min(1, dt * 22);
  railDip += (((isMain && active) ? 0.05 : 0) - railDip) * Math.min(1, dt * 10);
  needle.position.y = 0.038 - lift * 0.007;
  plunger.position.y = 0.06 + Math.abs(Math.sin(et * 4.2)) * 0.016;
  /* 喷雾粒子 */
  if (active && playing) {
    emitAcc += dts * (isMain ? 340 : 150);
    const n = Math.floor(emitAcc);
    if (n > 0) { emit(Math.min(n, 40)); emitAcc -= n; }
  }
  for (let k = 0; k < NP; k++) {
    if (pLife[k] <= 0) { pPos[k * 3 + 1] = -999; continue; }
    pLife[k] -= dts;
    pVel[k * 3] *= 0.965; pVel[k * 3 + 1] *= 0.965; pVel[k * 3 + 2] *= 0.965;
    pPos[k * 3] += pVel[k * 3] * dts;
    pPos[k * 3 + 1] += pVel[k * 3 + 1] * dts;
    pPos[k * 3 + 2] += pVel[k * 3 + 2] * dts;
    if (pPos[k * 3 + 1] < -0.135) { pLife[k] = 0; }
  }
  pGeo.attributes.position.needsUpdate = true;
  /* 燃烧发光 */
  glowLight.intensity = glow * 0.5;
  piston.material.emissive.setHex(0xff7726);
  piston.material.emissiveIntensity = 0.05 + glow * 0.85;
  /* 步骤高亮 */
  const hlK = 0.45 + 0.25 * Math.sin(et * 5);
  const hl = STEPS[scenario].hl;
  for (const m of [M.block, M.railM, M.inj, M.needle]) m.emissiveIntensity = Math.min(m.emissiveIntensity, 0.25);
  const boost = m => { m.emissiveIntensity = 0.5 + 0.3 * hlK; };
  if (hl === 'pump') boost(M.block);
  else if (hl === 'rail') { boost(M.railM); boost(M.block); }
  else if (hl === 'needle') { boost(M.needle); boost(M.inj); }
  else if (hl === 'spray') { boost(M.needle); piston.material.emissiveIntensity = 0.05; }
  else if (hl === 'multi') { boost(M.needle); boost(M.inj); }
  else if (hl === 'meter') { boost(M.block); boost(M.railM); }
  /* 波形历史 */
  if (playing) {
    hist.push([lift, railDip / 0.05 * 0.9, active ? (isMain ? 1 : 0.45) : 0.02]);
    if (hist.length > 160) hist.shift();
  }
  /* 相机目标 */
  tmpV.fromArray(STEPS[scenario].tgt);
  controls.target.lerp(tmpV, 0.04);
  /* 标签 */
  for (const r of labelReg) {
    if (r.follow) r.follow(r.o.position);
    r.o.element.textContent = r.text();
    r.o.element.className = 'lbl ' + (r.cls ? r.cls() : '');
  }
  if (tglCurve.checked) drawScope();
  const now = performance.now();
  if (now - lastStatsT > 150) {
    lastStatsT = now;
    updateStats();
    updateFormula();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function schedule() { if (!rafOn && !document.hidden) { rafOn = true; requestAnimationFrame(tick); } }
function tick() { rafOn = false; frame(); schedule(); }
document.addEventListener('visibilitychange', schedule);

/* ---------------- 初始化 ---------------- */
applyTheme();
applyLang();
elSpeed.value = Math.round(speed * 10);
elSpeedVal.textContent = speed.toFixed(1) + '×';
sizeScope();
const t0 = parseInt(qs.get('t'), 10);
if (Number.isFinite(t0) && t0 >= 1) activateStep(clamp(t0 - 1, 0, STEPS.length - 1));
else activateStep(0);
setPreset('full');
setPlayLabel();
tglSpray.dispatchEvent(new Event('change'));
schedule();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
