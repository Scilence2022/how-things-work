<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日悖论 · 23 人就过半</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e0a13f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.85);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.9);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 430px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 5px 16px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7ee2ae; }
  #stats .v.bad { color: #ff8a80; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 396px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 13px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h { color: #ffc188; border-color: rgba(255,159,67,.7); }
  .chip.r { color: #ff8a80; border-color: rgba(255,90,76,.7); }
  :root[data-theme="light"] .chip.h { color: #b26214; border-color: rgba(178,98,20,.7); }
  :root[data-theme="light"] .chip.r { color: #c0392b; border-color: rgba(192,57,43,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 64px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 44px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(224,161,63,.12); border-color: rgba(224,161,63,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.10); border-color: rgba(176,118,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="生日悖论:23 个人,同生日概率就过半" data-en="Birthday paradox: just 23 people and a shared birthday is more likely than not">生日悖论:23 个人,同生日概率就过半</h1>
  <div class="sub" data-zh="每个新人都要躲开全部已占生日,躲开概率连乘;配对数 n(n−1)/2 平方爆炸——23 人 P≈50.7%,57 人 P≈99% · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Each newcomer must dodge every taken birthday and the dodge odds multiply; pairs explode as n(n−1)/2 — P≈50.7% at 23 people, ≈99% at 57 · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">每个新人都要躲开全部已占生日,躲开概率连乘;配对数 n(n−1)/2 平方爆炸——23 人 P≈50.7%,57 人 P≈99% · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="人数 N" data-en="people N">人数 N</span><span class="v" id="stN">—</span>
  <span class="k" data-zh="配对数 n(n−1)/2" data-en="pairs n(n−1)/2">配对数 n(n−1)/2</span><span class="v" id="stPairs">—</span>
  <span class="k" data-zh="P 理论值" data-en="P theory">P 理论值</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="蒙特卡洛" data-en="Monte Carlo">蒙特卡洛</span><span class="v ok" id="stMC">—</span>
  <span class="k" data-zh="本局" data-en="this round">本局</span><span class="v" id="stRoll">—</span>
</div>

<div id="plot">
  <h3 id="plotH3">蒙特卡洛</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip h" data-zh="颜色 = 生日在年条上的位置" data-en="color = slot on the year strip">颜色 = 生日在年条上的位置</span>
    <span class="chip r" data-zh="撞生日 → 闪红 + 连线" data-en="shared birthday → red flash + link">撞生日 → 闪红 + 连线</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnRoll" data-zh="掷一次" data-en="Deal once">掷一次</button>
    <button class="abtn" id="btnMC" data-zh="蒙特卡洛 ×2000" data-en="Monte Carlo ×2000">蒙特卡洛 ×2000</button>
    <button class="abtn" id="btnReset" data-zh="清空" data-en="Clear">清空</button>
  </div>
  <div class="row"><label data-zh="人数 N" data-en="People N">人数 N</label><input id="n" type="range" min="1" max="80" step="1" value="23"><span class="val" id="nVal">23</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglLinks" type="checkbox" checked> <span data-zh="碰撞连线" data-en="Collision links">碰撞连线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../bayes-screening/" data-zh="基率如何碾压直觉" data-en="how base rates crush intuition">基率如何碾压直觉</a>
    <a href="../monty-hall-bayes/" data-zh="信息改变概率" data-en="information changes probability">信息改变概率</a>
    <a href="../galton-board/" data-zh="大数定律现场" data-en="law of large numbers, live">大数定律现场</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言(全站共享模式) ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
const ACC_C = new THREE.Color(0xe0a13f);
const RED_C = new THREE.Color(0xff5a4c);
const GREEN_C = new THREE.Color(0x7ee2ae);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const lite = THEME === 'light';
  scene.background = new THREE.Color(lite ? 0xeef1f6 : 0x10141b);
  scene.fog = new THREE.Fog(lite ? 0xeef1f6 : 0x10141b, 16, 36);
  ACC_C.set(lite ? 0xb0761f : 0xe0a13f);
  grid.material.color.set(lite ? 0x9aa7b8 : 0x3a4656);
  grid.material.opacity = lite ? 0.55 : 0.35;
  platform.material.color.set(lite ? 0xd9dee7 : 0x1a212c);
  slotMat.color.set(lite ? 0xbdc6d2 : 0x39434f);
  ringLineMat.color.set(lite ? 0x6b7a8a : 0x8b97a8);
  tickMat.color.set(lite ? 0x8fa0b0 : 0x55647a);
  monthTickMat.color.set(lite ? 0x6b7a8a : 0x9fb0c3);
  rbWallMat.color.set(lite ? 0xd9b268 : 0x8a6420);
  rbEdgeMat.color.set(lite ? 0xb0761f : 0xe0a13f);
  rbGridMat.color.set(lite ? 0x9aa7b8 : 0x46536a);
  refreshPeopleColors();
  drawPlot();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('生日悖论 · 23 人就过半', 'Birthday Paradox · 50% at 23 people');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  updateFormula();
  updateStats();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(5.6, 5.0, 9.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, -0.8);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(3, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

const grid = new THREE.GridHelper(30, 30, 0x3a4656, 0x3a4656);
grid.material.transparent = true;
grid.material.opacity = 0.35;
grid.position.y = -0.16;
scene.add(grid);

/* ================= 生日模型 ================= */
const MLEN = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const MSTART = [1, 32, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335];
const MEN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NC = [1];                                  // NC[n] = n 人全部躲开的概率
for (let n = 1; n <= 80; n++) NC[n] = NC[n - 1] * (366 - n) / 365;
const pTheory = n => 1 - NC[n];
const pctS = p => { const v = p * 100; return (v >= 99.95 ? v.toFixed(2) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + '%'; };
const colorFor = d => new THREE.Color().setHSL(((d / 365 * 335) % 360) / 360, 0.66, THEME === 'light' ? 0.48 : 0.57);
function md(d0) {
  let m = 0, d = d0;
  while (d > MLEN[m]) d -= MLEN[m++];

let N = 23, speed = 1, playing = true, showLabels = true, showLinks = true;

let revealed = 0, rollT = 0, perT = 0.1, revealDur = 1, holdT = 0;
let phase = 'idle';                    // idle | reveal | hold
let rollHasColl = false, rollInfo = null;
let mcHits = 0, mcTrials = 0, mcRunning = false, mcRunDone = 0, mcRunHits = 0;
const MC_TOTAL = 2000;
const mcCloud = [], mcLine = [];
const seen = new Int32Array(366);
let stamp = 0;

function deal() {
  days = Array.from({ length: N }, () => 1 + (Math.random() * 365 | 0));
  groups = new Map();
  days.forEach((d, i) => { if (!groups.has(d)) groups.set(d, []); groups.get(d).push(i); });
  collGroups = [...groups.values()].filter(g => g.length > 1);
  rollHasColl = collGroups.length > 0;
  flashStart.clear(); rollInfo = null;
  revealDur = clamp(0.7 + N * 0.075, 0.8, 3.0);
  perT = revealDur / N;
  rollT = 0; revealed = 0; holdT = 0; phase = 'reveal';
  rollCount++;
  clearTransient();
  for (const c of linkG.children) c.geometry.dispose();
  linkG.clear();
  for (const c of pulseG.children) c.geometry.dispose();
  pulseG.clear();
  refreshPeopleColors();
}
function revealOne(i) {
  const g = groups.get(days[i]);
  if (g.length > 1 && i === g[1]) {                    // 第二个到达者触发碰撞
    for (const idx of g) flashStart.set(idx, wall);
    if (!rollInfo) rollInfo = { k: i + 1, m: g[0] + 1, day: days[i] };
    const [x, z] = tilePos(g[0]);
    transientLbls.push(addLabel(() => md(days[i]) + (g.length > 2 ? ' ×' + g.length : ''),
      new THREE.Vector3(x, 0.85, z), 'r'));
  }
}
function buildLinks() {
  for (const c of linkG.children) c.geometry.dispose();
  linkG.clear();
  for (const c of pulseG.children) c.geometry.dispose();
  pulseG.clear();
  for (const [d, g] of groups) {
    if (g.length < 2 || g[g.length - 1] >= revealed) continue;
    const a = (d - 0.5) / 365 * Math.PI * 2;
    const tor = new THREE.Mesh(torGeo, slotPulseMat);
    tor.position.set(Math.cos(a) * RING_R, 0.08, Math.sin(a) * RING_R);
    tor.rotation.x = -Math.PI / 2;
    pulseG.add(tor);
    for (let k = 1; k < g.length; k++) {
      if (g[k] >= revealed) continue;
      const [x1, z1] = tilePos(g[0]), [x2, z2] = tilePos(g[k]);
      const p1 = new THREE.Vector3(x1, 0.42, z1), p2 = new THREE.Vector3(x2, 0.42, z2);
      const mid = p1.clone().add(p2).multiplyScalar(0.5);
      mid.y = 0.95 + 0.14 * k;
      linkG.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(p1, mid, p2), 18, 0.02, 6, false), linkMat));
    }
  }
}
function advanceRoll(dts) {
  rollT += dts;
  if (phase === 'reveal') {
    let adv = false;
    while (revealed < N && rollT >= (revealed + 1) * perT) { revealOne(revealed); revealed++; adv = true; }
    if (adv && rollHasColl) buildLinks();
    if (revealed >= N) { phase = 'hold'; holdT = 0; }
  } else if (phase === 'hold') holdT += dts;
}
function dealInstant() { deal(); advanceRoll(1e5); holdT = HOLD * 0.6; }

function refreshPeopleColors() {
  const dim = new THREE.Color(THEME === 'light' ? 0xaab4c0 : 0x55606e);
  for (let i = 0; i < 80; i++) {

    if (i < days.length) {

      marbles.setColorAt(i, groups.get(days[i]).length > 1 ? RED_C : c);
    }

  }
  if (bodies.instanceColor) bodies.instanceColor.needsUpdate = true;
  if (heads.instanceColor) heads.instanceColor.needsUpdate = true;
  if (marbles.instanceColor) marbles.instanceColor.needsUpdate = true;
}

/* ================= 蒙特卡洛 ================= */
function mcTrial() {
  stamp++;
  for (let i = 0; i < N; i++) {
    const d = 1 + (Math.random() * 365 | 0);
    if (seen[d] === stamp) return 1;
    seen[d] = stamp;
  }
  return 0;
}
function runMC() {
  if (mcRunning) return;
  mcRunning = true; mcRunDone = 0; mcRunHits = 0; mcLine.length = 0;
}
function advanceMC() {
  const chunk = Math.min(12, MC_TOTAL - mcRunDone);
  for (let i = 0; i < chunk; i++) {
    const hit = mcTrial();
    mcRunDone++; mcRunHits += hit; mcTrials++; mcHits += hit;
    if (mcRunDone % 5 === 0) mcCloud.push({ x: mcRunDone, y: mcRunHits / mcRunDone });
  }
  mcLine.push({ x: mcRunDone, y: mcRunHits / mcRunDone });
  if (mcRunDone >= MC_TOTAL) mcRunning = false;
  if (mcCloud.length > 8000) mcCloud.splice(0, mcCloud.length - 8000);
}

  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  c2.clearRect(0, 0, W, H);
  plotH3.textContent = L(`蒙特卡洛:2000 次/轮 @ N=${N}`, `Monte Carlo: 2,000 trials/run @ N=${N}`);
  const css = getComputedStyle(htmlEl);
  const cDim = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const cAcc = css.getPropertyValue('--acc').trim() || '#e0a13f';
  const cAxis = THEME === 'light' ? 'rgba(20,35,55,.4)' : 'rgba(255,255,255,.3)';
  const X0 = 64, X1 = W - 14, Y0 = 10, Y1 = H - 34;
  const P = pTheory(N);
  let lo = Math.max(0, P - 0.15), hi = Math.min(1, P + 0.15);
  if (hi - lo < 0.12) { lo = Math.max(0, P - 0.06); hi = Math.min(1, P + 0.06); }
  const fy = v => Y0 + (1 - (v - lo) / (hi - lo)) * (Y1 - Y0);
  const fx = k => X0 + k / MC_TOTAL * (X1 - X0);
  c2.strokeStyle = cAxis; c2.lineWidth = 1.5;
  c2.beginPath(); c2.moveTo(X0, Y0); c2.lineTo(X0, Y1); c2.lineTo(X1, Y1); c2.stroke();
  c2.fillStyle = cDim; c2.font = '17px system-ui'; c2.textAlign = 'center';
  for (const k of [0, 500, 1000, 1500, 2000]) {
    c2.beginPath(); c2.moveTo(fx(k), Y1); c2.lineTo(fx(k), Y1 + 6); c2.stroke();
    c2.fillText(String(k), fx(k), Y1 + 24);
  }
  c2.textAlign = 'right';
  c2.fillText(pctS(hi), X0 - 8, fy(hi) + 5);
  c2.fillText(pctS(lo), X0 - 8, fy(lo) + 5);
  c2.save(); c2.setLineDash([10, 7]); c2.strokeStyle = cAcc; c2.lineWidth = 2;
  c2.beginPath(); c2.moveTo(X0, fy(P)); c2.lineTo(X1, fy(P)); c2.stroke(); c2.restore();
  c2.fillStyle = cAcc; c2.textAlign = 'left'; c2.font = 'bold 18px system-ui';
  c2.fillText(L(`理论 ${pctS(P)}`, `theory ${pctS(P)}`), X0 + 8, fy(P) - 8);
  if (mcTrials === 0 && !mcRunning) {
    c2.fillStyle = cDim; c2.font = '19px system-ui'; c2.textAlign = 'center';
    c2.fillText(L('点「蒙特卡洛 ×2000」:看经验频率收敛到理论线',
      'press "Monte Carlo ×2000": watch the empirical ratio'), (X0 + X1) / 2, (Y0 + Y1) / 2 + 20);
    return;
  }
  if (mcTrials > 0) {
    c2.fillStyle = '#7ee2ae'; c2.textAlign = 'right'; c2.font = 'bold 18px system-ui';
    c2.fillText(L(`命中 ${mcHits}/${mcTrials} = ${pctS(mcHits / mcTrials)}`,
      `hits ${mcHits}/${mcTrials} = ${pctS(mcHits / mcTrials)}`), X1, Y0 + 16);
  }
  c2.globalAlpha = .22; c2.fillStyle = '#7ee2ae';
  for (const p of mcCloud) { c2.beginPath(); c2.arc(fx(p.x), fy(p.y), 2.4, 0, 7); c2.fill(); }
  c2.globalAlpha = 1;
  if (mcLine.length > 1) {
    c2.beginPath();
    mcLine.forEach((p, i) => { const xx = fx(p.x), yy = fy(p.y); i ? c2.lineTo(xx, yy) : c2.moveTo(xx, yy); });
    c2.strokeStyle = '#7ee2ae'; c2.lineWidth = 2.5; c2.stroke();
  }
  if (mcRunDone > 0) {
    c2.beginPath(); c2.arc(fx(mcRunDone), fy(mcRunHits / mcRunDone), 7, 0, 7);
    c2.fillStyle = '#7ee2ae'; c2.fill();
  }
  if (mcRunning) {
    c2.fillStyle = cDim; c2.textAlign = 'right'; c2.font = '18px system-ui';
    c2.fillText(L(`试验中… ${mcRunDone}/${MC_TOTAL}`, `running… ${mcRunDone}/${MC_TOTAL}`), X1, Y1 - 10);
  }
}

/* ================= UI / 主循环 ================= */
const elPlay = document.getElementById('play');
const elN = document.getElementById('n'), elNVal = document.getElementById('nVal');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels'), tglLinks = document.getElementById('tglLinks');
const tglRotate = document.getElementById('tglRotate');
let lastStep = -1;

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { setN(s.n); deal(); if (s.mc) runMC(); });
    elSteps.appendChild(li);
  });
  lastStep = -1;
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setN(v) {
  N = clamp(Math.round(v), 1, 80);
  elN.value = N; elNVal.textContent = N;
  days = []; groups = new Map(); collGroups = []; flashStart.clear();
  revealed = 0; phase = 'idle'; rollHasColl = false; rollInfo = null;
  mcHits = mcTrials = 0; mcRunning = false; mcRunDone = mcRunHits = 0;
  mcCloud.length = 0; mcLine.length = 0;
  clearTransient();
  for (const c of linkG.children) c.geometry.dispose();
  linkG.clear();
  for (const c of pulseG.children) c.geometry.dispose();
  pulseG.clear();
  refreshPeopleColors();
  updateFormula(); updateStats();
  drawPlot();
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elN.addEventListener('input', () => setN(+elN.value));
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
document.getElementById('btnRoll').addEventListener('click', () => deal());
document.getElementById('btnMC').addEventListener('click', () => runMC());
document.getElementById('btnReset').addEventListener('click', () => { setN(N); tSim = 0; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; labelsOn = showLabels; });
tglLinks.addEventListener('change', () => { showLinks = tglLinks.checked; linkG.visible = showLinks; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 场景标签注册 ================= */
addLabel(() => L(`房间:${N} 人 · 配对 ${N * (N - 1) / 2} 对(每对都是一次撞车机会)`,
  `room: ${N} people · ${N * (N - 1) / 2} pairs (each pair a collision chance)`),
  new THREE.Vector3(0, 1.35, 2.35), 'st');
addLabel(() => captionText(), new THREE.Vector3(0, 1.05, 2.35), 'st');
addLabel(() => L('一年 365 格 · 同色 = 同生日', '365 slots · same color = same birthday'),
  new THREE.Vector3(0, 0.32, RING_R + 0.62), 'b');
for (let m = 0; m < 12; m++) {
  const a = (MSTART[m] - 1 + MLEN[m] / 2) / 365 * Math.PI * 2;
  addLabel(() => LANG === 'en' ? MEN[m] : `${m + 1}月`,
    new THREE.Vector3(Math.cos(a) * (RING_R + 0.55), 0.1, Math.sin(a) * (RING_R + 0.55)), 'st');
}
addLabel(() => L('理论曲线:P(n) = 1 − (365/365)(364/365)···((365−n+1)/365)',
  'theory: P(n) = 1 − (365/365)(364/365)···((365−n+1)/365)'),
  new THREE.Vector3(0, RB.h + 0.42, RB.z), 'o');
for (const v of [0, .25, .5, .75, 1]) {
  addLabel(() => Math.round(v * 100) + '%', new THREE.Vector3(RB.x0 - 0.32, cY(v), RB.z), 'st');
}
for (const n of [1, 20, 40, 60, 80]) {
  addLabel(() => String(n), new THREE.Vector3(cX(n), -0.3, RB.z), 'st');
}
addLabel(() => L('人数 n', 'people n'), new THREE.Vector3(RB.x1 + 0.1, -0.3, RB.z), 'st');
addLabel(() => '50% · N=23', new THREE.Vector3(RB.x1 - 0.7, cY(.5) + 0.2, RB.z), 'g');
addLabel(() => '99% · N=57', new THREE.Vector3(RB.x1 - 0.7, cY(.99) + 0.2, RB.z), 'o');
addLabel(() => `N=${N} · ${pctS(pTheory(N))}`, new THREE.Vector3(), 'st', () => true,
  p => p.set(cX(N), cY(pTheory(N)) + 0.3, RB.z));
addLabel(() => L(`实测 ${pctS(mcHits / mcTrials)} (n=${mcTrials})`, `observed ${pctS(mcHits / mcTrials)} (n=${mcTrials})`),
  new THREE.Vector3(), 'g', () => mcTrials > 0,
  p => p.set(cX(N) + 0.35, cY(mcTrials ? mcHits / mcTrials : 0) + 0.22, RB.z));

/* URL 参数:?n= 初始人数 ?t= 预演秒数 ?pause=1 ?speed= ?labels=0 ?spin=0 */
setN(clamp(Math.round(qsFloat('n', 23)), 1, 80));
speed = clamp(qsFloat('speed', 1), 0.2, 3);
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
showLabels = qsBool('labels', true); tglLabels.checked = showLabels; labelsOn = showLabels;
playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;

applyTheme();
applyLang();
{ /* ?t= 预演:按自动节奏瞬时掷若干局 */
  const pre = clamp(qsFloat('t', 0), 0, 600);
  let guard = 0;
  while (tSim < pre && guard++ < 400) { dealInstant(); tSim += (revealDur + HOLD) / speed; }
}
setPlayLabel();

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, statAcc = 0;
const _m = new THREE.Matrix4(), _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();
const _flatQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
const stackMap = new Map();
function updateScene3D() {
  const rows = Math.ceil(N / COLS) || 1;
  let flashN = 0;
  for (let i = 0; i < 80; i++) {
    if (i >= N) {
      _m.makeScale(0, 0, 0);
      slots.setMatrixAt(i, _m); bodies.setMatrixAt(i, _m); heads.setMatrixAt(i, _m);
      continue;
    }
    const col = i % COLS, row = (i / COLS) | 0;
    const x = (col - (COLS - 1) / 2) * PITCH, z = (row - (rows - 1) / 2) * PITCH;
    _m.makeTranslation(x, 0.03, z);
    slots.setMatrixAt(i, _m);
    const dealt = i < revealed;
    const pop = dealt ? clamp((rollT - (i + 1) * perT) / 0.22, 0, 1) : 0;
    const s = pop * (2 - pop);
    if (s <= 0.001) {
      _m.makeScale(0, 0, 0);
      bodies.setMatrixAt(i, _m); heads.setMatrixAt(i, _m);
    } else {
      _m.compose(_v.set(x, 0.05 + 0.18 * s, z), _q.identity(), _s.set(s, s, s));
      bodies.setMatrixAt(i, _m);
      _m.compose(_v.set(x, 0.05 + 0.46 * s, z), _q.identity(), _s.set(s, s, s));
      heads.setMatrixAt(i, _m);
    }
    const fs = flashStart.get(i);
    if (dealt && fs !== undefined && wall - fs < 2.4) {
      const rs = 1 + 0.3 * Math.sin(wall * 9);
      _m.compose(_v.set(x, 0.075, z), _flatQ, _s.set(rs, rs, rs));
      flashRings.setMatrixAt(flashN++, _m);
    }
  }
  slots.instanceMatrix.needsUpdate = true;
  bodies.instanceMatrix.needsUpdate = true;
  heads.instanceMatrix.needsUpdate = true;
  flashRings.count = flashN;
  flashRings.instanceMatrix.needsUpdate = true;
  flashRingMat.opacity = 0.32 + 0.26 * Math.sin(wall * 9);
  /* 年环上的生日球(同日向上叠) */
  stackMap.clear();
  let mc = 0;
  for (let i = 0; i < revealed; i++) {
    const d = days[i], c = stackMap.get(d) || 0;
    stackMap.set(d, c + 1);
    const a = (d - 0.5) / 365 * Math.PI * 2;
    const pop = clamp((rollT - (i + 1) * perT) / 0.3, 0, 1);
    const y = 0.075 + Math.min(c, 8) * 0.115 + (1 - pop) * 0.85;
    _m.makeTranslation(Math.cos(a) * RING_R, y, Math.sin(a) * RING_R);
    marbles.setMatrixAt(mc++, _m);
  }
  marbles.count = mc;
  marbles.instanceMatrix.needsUpdate = true;
  /* 连线 / 槽位脉冲 */
  linkMat.opacity = 0.55 + 0.3 * Math.sin(wall * 6);
  slotPulseMat.opacity = 0.5 + 0.35 * Math.sin(wall * 7);
  const ps = 1 + 0.15 * Math.sin(wall * 7);
  for (const t of pulseG.children) t.scale.setScalar(ps);
  /* 理论飘带上的当前 N 动点 */
  const px = cX(N), py = cY(pTheory(N));
  marker.position.set(px, py, RB.z + RB.th + 0.05);
  markerRing.position.copy(marker.position);
  markerRing.scale.setScalar(1 + 0.18 * Math.sin(wall * 4));
  const dotC = phase === 'idle' ? ACC_C : rollHasColl ? RED_C : GREEN_C;
  marker.material.color.copy(dotC);
  markerRing.material.color.copy(dotC);
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  wall += dt;
  const dts = dt * speed;
  if (phase !== 'idle') advanceRoll(dts);
  if (mcRunning) { advanceMC(); drawPlot(); }
  if (playing) {
    tSim += dts;
    if (phase === 'idle' || (phase === 'hold' && holdT >= HOLD)) deal();
  }
  updateScene3D();
  statAcc += dt;
  if (statAcc > 0.25) { statAcc = 0; updateStats(); updateFormula(); if (!mcRunning) drawPlot(); }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    const txt = on ? r.text() : '';
    r.o.visible = on && txt !== '';
    if (r.o.visible) {
      if (r.o.element.textContent !== txt) r.o.element.textContent = txt;
      if (r.posFn) r.posFn(r.o.position);
    }
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
updateStats();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '▴' : '▾';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
