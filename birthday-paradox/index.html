<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日悖论 · 23 人就过半</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e0a13f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.85);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.9);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 430px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 5px 16px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7ee2ae; }
  #stats .v.bad { color: #ff8a80; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 396px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 13px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h { color: #ffc188; border-color: rgba(255,159,67,.7); }
  .chip.r { color: #ff8a80; border-color: rgba(255,90,76,.7); }
  :root[data-theme="light"] .chip.h { color: #b26214; border-color: rgba(178,98,20,.7); }
  :root[data-theme="light"] .chip.r { color: #c0392b; border-color: rgba(192,57,43,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 64px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 44px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(224,161,63,.12); border-color: rgba(224,161,63,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.10); border-color: rgba(176,118,31,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="生日悖论:23 个人,同生日概率就过半" data-en="Birthday paradox: just 23 people and a shared birthday is more likely than not">生日悖论:23 个人,同生日概率就过半</h1>
  <div class="sub" data-zh="每个新人都要躲开全部已占生日,躲开概率连乘;配对数 n(n−1)/2 平方爆炸——23 人 P≈50.7%,57 人 P≈99% · 空格播放/暂停" data-en="Each newcomer must dodge every taken birthday and the dodge odds multiply; pairs explode as n(n−1)/2 — P≈50.7% at 23 people, ≈99% at 57 · Space = play/pause">每个新人都要躲开全部已占生日,躲开概率连乘;配对数 n(n−1)/2 平方爆炸——23 人 P≈50.7%,57 人 P≈99% · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="人数 N" data-en="people N">人数 N</span><span class="v" id="stN">—</span>
  <span class="k" data-zh="配对数 n(n−1)/2" data-en="pairs n(n−1)/2">配对数 n(n−1)/2</span><span class="v" id="stPairs">—</span>
  <span class="k" data-zh="P 理论值" data-en="P theory">P 理论值</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="蒙特卡洛" data-en="Monte Carlo">蒙特卡洛</span><span class="v ok" id="stMC">—</span>
  <span class="k" data-zh="本局" data-en="this round">本局</span><span class="v" id="stRoll">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip h" data-zh="颜色 = 生日在年条上的位置" data-en="color = slot on the year strip">颜色 = 生日在年条上的位置</span>
    <span class="chip r" data-zh="撞生日 → 闪红 + 连线" data-en="shared birthday → red flash + link">撞生日 → 闪红 + 连线</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnRoll" data-zh="掷一次" data-en="Deal once">掷一次</button>
    <button class="abtn" id="btnMC" data-zh="蒙特卡洛 ×2000" data-en="Monte Carlo ×2000">蒙特卡洛 ×2000</button>
    <button class="abtn" id="btnReset" data-zh="清空" data-en="Clear">清空</button>
  </div>
  <div class="row"><label data-zh="人数 N" data-en="People N">人数 N</label><input id="n" type="range" min="1" max="80" step="1" value="23"><span class="val" id="nVal">23</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglLinks" type="checkbox" checked> <span data-zh="碰撞连线" data-en="Collision links">碰撞连线</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../bayes-screening/" data-zh="基率如何碾压直觉" data-en="how base rates crush intuition">基率如何碾压直觉</a>
    <a href="../monty-hall-bayes/" data-zh="信息改变概率" data-en="information changes probability">信息改变概率</a>
    <a href="../galton-board/" data-zh="大数定律现场" data-en="law of large numbers, live">大数定律现场</a>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill', acc:'--acc' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('生日悖论 · 23 人就过半', 'Birthday Paradox · 50% at 23 people');
  buildSteps();
  setPlayLabel();
  updateFormula();
  updateStats();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

/* ================= 生日模型 ================= */
const MLEN = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const MSTART = [1, 32, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335];
const MEN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NC = [1];                                  // NC[n] = n 人全部躲开的概率
for (let n = 1; n <= 80; n++) NC[n] = NC[n - 1] * (366 - n) / 365;
const pTheory = n => 1 - NC[n];
const pctS = p => { const v = p * 100; return (v >= 99.95 ? v.toFixed(2) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + '%'; };
const hueFor = d => `hsl(${Math.round(d / 365 * 335)},66%,${THEME === 'light' ? 48 : 57}%)`;
function md(d0) {
  let m = 0, d = d0;
  while (d > MLEN[m]) d -= MLEN[m++];
  return LANG === 'en' ? `${MEN[m]} ${d}` : `${m + 1}月${d}日`;
}

/* ================= 布局常量 ================= */
const GX = 40, GY = 150, COLS = 12, TILE = 52, PITCH = 60;      // 房间格子
const SX = 40, SW = 712, SY = 668;                              // 365 格年条
const CX = 890, CY = 170, CW = 600, CH = 220;                   // 理论曲线绘图区
const MX = 890, MY = 510, MW = 600, MH = 210;                   // 蒙特卡洛绘图区
const HOLD = 1.5;                                               // 揭晓后停留秒数

/* ================= 状态 ================= */
let N = 23, speed = 1, playing = true, showLabels = true, showLinks = true;
let tSim = 0, wall = 0, rollCount = 0;
let days = [], groups = new Map(), collGroups = [], flashStart = new Map();
let revealed = 0, rollT = 0, perT = 0.1, revealDur = 1, holdT = 0;
let phase = 'idle';                    // idle | reveal | hold
let rollHasColl = false, rollInfo = null;
let mcHits = 0, mcTrials = 0, mcRunning = false, mcRunDone = 0, mcRunHits = 0;
const MC_TOTAL = 2000;
const mcCloud = [], mcLine = [];
const seen = new Int32Array(366);
let stamp = 0;

function deal() {
  days = Array.from({ length: N }, () => 1 + (Math.random() * 365 | 0));
  groups = new Map();
  days.forEach((d, i) => { if (!groups.has(d)) groups.set(d, []); groups.get(d).push(i); });
  collGroups = [...groups.values()].filter(g => g.length > 1);
  rollHasColl = collGroups.length > 0;
  flashStart.clear(); rollInfo = null;
  revealDur = clamp(0.7 + N * 0.075, 0.8, 3.0);
  perT = revealDur / N;
  rollT = 0; revealed = 0; holdT = 0; phase = 'reveal';
  rollCount++;
}
function revealOne(i) {
  const g = groups.get(days[i]);
  if (g.length > 1 && i === g[1]) {                    // 第二个到达者触发碰撞
    for (const idx of g) flashStart.set(idx, wall);
    if (!rollInfo) rollInfo = { k: i + 1, m: g[0] + 1, day: days[i] };
  }
}
function advanceRoll(dts) {
  rollT += dts;
  if (phase === 'reveal') {
    while (revealed < N && rollT >= (revealed + 1) * perT) { revealOne(revealed); revealed++; }
    if (revealed >= N) { phase = 'hold'; holdT = 0; }
  } else if (phase === 'hold') holdT += dts;
}
function dealInstant() { deal(); advanceRoll(1e5); holdT = HOLD * 0.6; }

/* ================= 蒙特卡洛 ================= */
function mcTrial() {
  stamp++;
  for (let i = 0; i < N; i++) {
    const d = 1 + (Math.random() * 365 | 0);
    if (seen[d] === stamp) return 1;
    seen[d] = stamp;
  }
  return 0;
}
function runMC() {
  if (mcRunning) return;
  mcRunning = true; mcRunDone = 0; mcRunHits = 0; mcLine.length = 0;
}
function advanceMC() {
  const chunk = Math.min(12, MC_TOTAL - mcRunDone);
  for (let i = 0; i < chunk; i++) {
    const hit = mcTrial();
    mcRunDone++; mcRunHits += hit; mcTrials++; mcHits += hit;
    if (mcRunDone % 5 === 0) mcCloud.push({ x: mcRunDone, y: mcRunHits / mcRunDone });
  }
  mcLine.push({ x: mcRunDone, y: mcRunHits / mcRunDone });
  if (mcRunDone >= MC_TOTAL) mcRunning = false;
  if (mcCloud.length > 8000) mcCloud.splice(0, mcCloud.length - 8000);
}

/* ================= 步骤 ================= */
const STEPS = [
  { n: 1, mc: false, b: '第一人生日独占 365 格', be: 'Person 1 owns all 365 slots',
    d: '第一个人落在任何一格都不会撞——独占概率 365/365 = 100%。故事从这里开始还很安全。',
    de: 'The first person cannot collide — dodge probability 365/365 = 100%. All still safe.' },
  { n: 6, mc: false, b: '每个新人要躲开所有已占格子', be: 'Each newcomer must dodge every taken slot',
    d: '第二人躲开概率 364/365,第三人 363/365……新来的人必须同时避开前面所有人的生日,安全概率开始连乘。',
    de: 'Person 2 dodges with 364/365, person 3 with 363/365… each newcomer must avoid ALL existing birthdays, so the safe odds multiply.' },
  { n: 15, mc: false, b: '配对数按 n(n−1)/2 爆炸', be: 'Pairs explode as n(n−1)/2',
    d: '10 人有 45 对、15 人 105 对、23 人 253 对——每一对都是一次撞车机会。机会数不是线性涨,是平方涨。',
    de: '10 people → 45 pairs, 15 → 105, 23 → 253. Every pair is a fresh collision chance; chances grow quadratically, not linearly.' },
  { n: 23, mc: false, b: '23 人:碰撞概率过半', be: '23 people: over 50%',
    d: '连乘 23 次后,全部躲开的概率跌破一半:P(至少一对同生日) ≈ 50.7%;57 人更是 99%。反复掷,红闪停不下来。',
    de: 'After 23 multiplications the all-dodge chance drops below half: P ≈ 50.7%; at 57 it is 99%. Keep dealing — the red flashes will not stop.' },
  { n: 23, mc: true, b: '直觉错在哪', be: 'Where intuition fails',
    d: '直觉想的是「和我同一天」:22×(1/365) ≈ 6%。但题目问的是「任意两人同一天」——253 对都在掷骰。跑 2000 次蒙特卡洛,看经验值钉在理论点上。',
    de: 'Intuition thinks "same as ME": 22×(1/365) ≈ 6%. But ANY pair counts — all 253 pairs roll the dice. Run 2,000 Monte-Carlo trials and watch the empirical point land on theory.' },
];
function stepIndex() {
  if (mcTrials >= 500) return 4;
  if (N >= 23) return 3;
  if (N >= 10) return 2;
  if (N >= 2) return 1;
  return 0;
}

/* ================= 绘制:房间 ================= */
function tileXY(i) { return [GX + (i % COLS) * PITCH, GY + ((i / COLS) | 0) * PITCH]; }
function drawRoom() {
  const pairs = N * (N - 1) / 2;
  if (showLabels) text(L(`房间:${N} 人 · 配对 ${pairs} 对(每对都是一次撞车机会)`,
    `room: ${N} people · ${pairs} pairs (each pair a collision chance)`), GX, GY - 16, 13, PAL.dim2);
  for (let i = 0; i < N; i++) {
    const [x, y] = tileXY(i), dealt = i < revealed;
    const pop = dealt ? clamp((rollT - (i + 1) * perT) / 0.22, 0, 1) : 0;
    const d = days[i], dup = dealt && groups.get(d).length > 1;
    ctx.globalAlpha = dealt ? 0.35 + 0.65 * pop : 1;
    rrect(x, y, TILE, TILE, 9, dealt ? hueFor(d) : 'rgba(150,163,182,.14)',
      dup ? '#ff5a4c' : dealt ? 'rgba(255,255,255,.25)' : PAL.grid, dup ? 2.2 : 1.2);
    if (dealt) {
      text(String(d), x + TILE / 2, y + 26, 15, '#fff', 'center', 700);
      text(md(d), x + TILE / 2, y + 42, 9.5, 'rgba(255,255,255,.85)', 'center');
      text('#' + (i + 1), x + 5, y + 12, 8.5, 'rgba(255,255,255,.75)');
    } else {
      text('#' + (i + 1), x + TILE / 2, y + TILE / 2 + 4, 11, PAL.dim, 'center');
    }
    if (dup) {
      const age = wall - (flashStart.get(i) ?? -9);
      if (age < 2.4) {
        ctx.globalAlpha = (0.35 + 0.3 * Math.sin(wall * 9)) * (1 - age / 2.4);
        rrect(x - 3, y - 3, TILE + 6, TILE + 6, 11, null, '#ff5a4c', 3.5);
      }
    }
  }
  ctx.globalAlpha = 1;
  if (showLinks) for (const g of collGroups) {
    for (let k = 1; k < g.length; k++) {
      if (g[k] >= revealed) continue;
      const [x1, y1] = tileXY(g[0]), [x2, y2] = tileXY(g[k]);
      ctx.globalAlpha = 0.45 + 0.3 * Math.sin(wall * 6);
      ctx.beginPath(); ctx.moveTo(x1 + TILE / 2, y1);
      ctx.quadraticCurveTo((x1 + x2) / 2 + TILE / 2, Math.min(y1, y2) - 26, x2 + TILE / 2, y2);
      ctx.strokeStyle = '#ff5a4c'; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

/* ================= 绘制:365 格年条 ================= */
function drawStrip() {
  line(SX, SY, SX + SW, SY, PAL.axis, 1.5);
  for (let m = 0; m < 12; m++) {
    const x = SX + (MSTART[m] - 1) / 365 * SW;
    line(x, SY, x, SY + 5, PAL.axis, 1);
    if (showLabels) text(LANG === 'en' ? MEN[m] : `${m + 1}月`, x + 3, SY + 18, 10, PAL.dim);
  }
  if (showLabels) text(L('一年 365 格 · 同色 = 同生日', '365 slots · same color = same birthday'),
    SX + SW, SY - 76, 11.5, PAL.dim, 'right');
  const stack = new Map();
  for (let i = 0; i < revealed; i++) {
    const d = days[i], c = stack.get(d) || 0;
    stack.set(d, c + 1);
    const dup = groups.get(d).length > 1;
    const x = SX + (d - 0.5) / 365 * SW;
    const y = SY - 8 - Math.min(c, 8) * 7;
    circle(x, y, 3.1, dup ? '#ff5a4c' : hueFor(d));
    if (c === 8) text('+', x + 6, y + 3, 10, PAL.dim2);
  }
  /* 重复格:红圈脉冲 + 连接弧 */
  for (const [d, g] of groups) {
    if (g.length < 2 || g[g.length - 1] >= revealed) continue;
    const x = SX + (d - 0.5) / 365 * SW;
    const top = SY - 8 - (Math.min(g.length, 9) - 1) * 7;
    ctx.globalAlpha = 0.5 + 0.35 * Math.sin(wall * 7 + d);
    circle(x, (SY - 8 + top) / 2, 7 + 2 * Math.sin(wall * 7 + d), null, '#ff5a4c', 2);
    ctx.beginPath(); ctx.moveTo(x + 3.5, SY - 8);
    ctx.quadraticCurveTo(x + 16, (SY - 8 + top) / 2, x + 3.5, top);
    ctx.strokeStyle = '#ff5a4c'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.globalAlpha = 1;
    if (g.length > 2) text('×' + g.length, x + 9, top + 3, 10, '#ff8a80');
  }
}

/* ================= 绘制:因果链字幕 ================= */
function drawCaption() {
  if (!showLabels) return;
  let s = '', col = PAL.dim2;
  if (phase === 'idle') {
    s = L('点「掷一次」或按空格:每人随机分到一个生日(1–365)',
      'hit Deal or Space: each person draws a random birthday (1–365)');
  } else if (phase === 'reveal') {
    if (rollInfo) {
      s = L(`撞上!第 ${rollInfo.k} 人与第 ${rollInfo.m} 人同为 ${md(rollInfo.day)}`,
        `collision! #${rollInfo.k} & #${rollInfo.m} share ${md(rollInfo.day)}`);
      col = '#ff8a80';
    } else {
      const k = revealed;
      if (k === 0) {
        s = L('第 1 人:365 格全空,独占概率 365/365 = 100%', 'person 1: all 365 slots free — 365/365 = 100%');
      } else {
        const j = new Set(days.slice(0, k)).size;
        s = L(`已亮出 ${k} 人 · 已占 ${j} 格 → 下一人躲开概率 (365−${j})/365 = ${((365 - j) / 365 * 100).toFixed(1)}%`,
          `${k} dealt · ${j} slots taken → next dodges with (365−${j})/365 = ${((365 - j) / 365 * 100).toFixed(1)}%`);
      }
    }
  } else {
    const p = pTheory(N), pairs = N * (N - 1) / 2;
    if (rollHasColl) {
      const cp = collGroups.reduce((a, g) => a + g.length * (g.length - 1) / 2, 0);
      s = L(`${N} 人 · ${pairs} 对配对 · 理论 ${pctS(p)} → 本局:碰撞 ${cp} 对!`,
        `${N} people · ${pairs} pairs · theory ${pctS(p)} → this round: ${cp} colliding pair(s)!`);
      col = '#ff8a80';
    } else {
      s = L(`${N} 人 · ${pairs} 对配对 · 理论 ${pctS(p)} → 本局:全部躲开`,
        `${N} people · ${pairs} pairs · theory ${pctS(p)} → this round: all dodged`);
    }
  }
  text(s, GX, 592, 13.5, col, 'left', 600);
}

/* ================= 绘制:理论曲线 ================= */
const cX = n => CX + (n - 1) / 79 * CW;
const cY = v => CY + (1 - v) * CH;
function drawChart() {
  rrect(834, 116, 722, 318, 14, PAL.pill, PAL.grid, 1);
  text(L('理论曲线:P(n) = 1 − (365/365)(364/365)···((365−n+1)/365)',
    'theory: P(n) = 1 − (365/365)(364/365)···((365−n+1)/365)'), 856, 148, 13.5, PAL.text, 'left', 600);
  for (const v of [0, .25, .5, .75, 1]) {
    line(CX, cY(v), CX + CW, cY(v), v === 0 ? PAL.axis : PAL.grid, 1);
    if (showLabels) text(Math.round(v * 100) + '%', CX - 10, cY(v) + 4, 10.5, PAL.dim, 'right');
  }
  for (const n of [1, 20, 40, 60, 80]) {
    line(cX(n), CY + CH, cX(n), CY + CH + 5, PAL.axis, 1);
    if (showLabels) text(String(n), cX(n), CY + CH + 20, 10.5, PAL.dim, 'center');
  }
  if (showLabels) text(L('人数 n', 'people n'), CX + CW, CY + CH + 38, 11, PAL.dim2, 'right');
  line(CX, cY(.5), CX + CW, cY(.5), 'rgba(126,226,174,.5)', 1.2, [6, 5]);
  line(cX(23), cY(0), cX(23), cY(pTheory(23)), 'rgba(126,226,174,.4)', 1, [4, 4]);
  line(CX, cY(.99), CX + CW, cY(.99), 'rgba(255,159,67,.5)', 1.2, [6, 5]);
  line(cX(57), cY(0), cX(57), cY(pTheory(57)), 'rgba(255,159,67,.4)', 1, [4, 4]);
  if (showLabels) {
    text('50% · N=23', CX + CW - 6, cY(.5) - 7, 11, '#7ee2ae', 'right', 700);
    text('99% · N=57', CX + CW - 6, cY(.99) - 7, 11, '#ffb86b', 'right', 700);
  }
  ctx.beginPath();
  for (let n = 1; n <= 80; n++) { const x = cX(n), y = cY(pTheory(n)); n === 1 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.strokeStyle = PAL.acc; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.lineTo(cX(80), cY(0)); ctx.lineTo(cX(1), cY(0)); ctx.closePath();
  ctx.globalAlpha = .08; ctx.fillStyle = PAL.acc; ctx.fill(); ctx.globalAlpha = 1;
  /* 当前 N 动点 */
  const px = cX(N), py = cY(pTheory(N));
  const dotC = phase === 'idle' ? PAL.acc : rollHasColl ? '#ff5a4c' : '#7ee2ae';
  circle(px, py, 6.5 + 1.5 * Math.sin(wall * 4), null, dotC, 2);
  circle(px, py, 4, dotC);
  if (showLabels) text(`N=${N} · ${pctS(pTheory(N))}`, px, py - 14, 12, PAL.text, 'center', 700);
  /* 蒙特卡洛实测点:落到理论点上 */
  if (mcTrials > 0) {
    const r = mcHits / mcTrials, ey = cY(r);
    line(px, py, px, ey, 'rgba(126,226,174,.6)', 1.2, [3, 3]);
    circle(px, ey, 6, null, '#7ee2ae', 2.2);
    if (showLabels) text(L(`实测 ${pctS(r)} (n=${mcTrials})`, `observed ${pctS(r)} (n=${mcTrials})`),
      px + 12, ey + 4, 11, '#7ee2ae', 'left', 700);
  }
}

/* ================= 绘制:蒙特卡洛 ================= */
function drawMC() {
  rrect(834, 456, 722, 330, 14, PAL.pill, PAL.grid, 1);
  text(L(`蒙特卡洛:2000 次/轮 @ N=${N}`, `Monte Carlo: 2,000 trials/run @ N=${N}`),
    856, 488, 13.5, PAL.text, 'left', 600);
  if (mcTrials > 0) text(L(`累计 命中 ${mcHits} / ${mcTrials} = ${pctS(mcHits / mcTrials)}`,
    `total hits ${mcHits} / ${mcTrials} = ${pctS(mcHits / mcTrials)}`), 1534, 488, 12, '#7ee2ae', 'right', 700);
  if (mcTrials === 0 && !mcRunning) {
    text(L('点「蒙特卡洛 ×2000」:看经验频率收敛到理论线',
      'press "Monte Carlo ×2000": watch the empirical ratio settle onto theory'),
      MX + MW / 2, MY + MH / 2, 13, PAL.dim, 'center');
    return;
  }
  const P = pTheory(N);
  let lo = Math.max(0, P - 0.15), hi = Math.min(1, P + 0.15);
  if (hi - lo < 0.12) { lo = Math.max(0, P - 0.06); hi = Math.min(1, P + 0.06); }
  const y = v => MY + (1 - (v - lo) / (hi - lo)) * MH;
  const x = k => MX + k / MC_TOTAL * MW;
  line(MX, MY, MX, MY + MH, PAL.axis, 1); line(MX, MY + MH, MX + MW, MY + MH, PAL.axis, 1);
  for (const k of [0, 500, 1000, 1500, 2000]) {
    line(x(k), MY + MH, x(k), MY + MH + 4, PAL.axis, 1);
    if (showLabels) text(String(k), x(k), MY + MH + 18, 10, PAL.dim, 'center');
  }
  if (showLabels) {
    text(L('试验次数', 'trials'), MX + MW, MY + MH + 34, 11, PAL.dim2, 'right');
    text(pctS(hi), MX - 8, y(hi) + 4, 10, PAL.dim, 'right');
    text(pctS(lo), MX - 8, y(lo) + 4, 10, PAL.dim, 'right');
  }
  line(MX, y(P), MX + MW, y(P), PAL.acc, 1.4, [7, 5]);
  if (showLabels) text(L(`理论 ${pctS(P)}`, `theory ${pctS(P)}`), MX + 6, y(P) - 7, 11, PAL.acc, 'left', 700);
  ctx.globalAlpha = .22; ctx.fillStyle = '#7ee2ae';
  for (const p of mcCloud) { ctx.beginPath(); ctx.arc(x(p.x), y(p.y), 1.6, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (mcLine.length > 1) {
    ctx.beginPath();
    mcLine.forEach((p, i) => { const xx = x(p.x), yy = y(p.y); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); });
    ctx.strokeStyle = '#7ee2ae'; ctx.lineWidth = 2; ctx.stroke();
  }
  if (mcRunDone > 0) circle(x(mcRunDone), y(mcRunHits / mcRunDone), 5.5, '#7ee2ae', PAL.pill, 1.5);
  if (mcRunning) text(L(`试验中… ${mcRunDone}/${MC_TOTAL}`, `running… ${mcRunDone}/${MC_TOTAL}`),
    MX + MW - 6, MY + 18, 11.5, PAL.dim2, 'right');
}

function draw() {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawRoom();
  drawCaption();
  drawStrip();
  drawChart();
  drawMC();
}

/* ================= 读数 / 公式 ================= */
const stN = document.getElementById('stN'), stPairs = document.getElementById('stPairs'),
  stP = document.getElementById('stP'), stMC = document.getElementById('stMC'),
  stRoll = document.getElementById('stRoll');
const formulaEl = document.getElementById('formula');
function updateStats() {
  stN.textContent = N;
  stPairs.textContent = N * (N - 1) / 2;
  stP.textContent = pctS(pTheory(N));
  stMC.innerHTML = mcTrials ? `${pctS(mcHits / mcTrials)}<small> ${mcHits}/${mcTrials}</small>` : '—';
  if (phase === 'idle') { stRoll.textContent = '—'; stRoll.className = 'v'; }
  else if (rollHasColl) { stRoll.textContent = L('碰撞!', 'collision!'); stRoll.className = 'v bad'; }
  else { stRoll.textContent = L('全部躲开', 'all dodged'); stRoll.className = 'v ok'; }
}
function updateFormula() {
  const prod = NC[N], pairs = N * (N - 1) / 2;
  formulaEl.innerHTML = L(
    `P(至少一对同生日) = 1 − (365/365)×(364/365)×···×(${366 - N}/365)<br>` +
    `= 1 − ${prod.toFixed(4)} = <b>${pctS(1 - prod)}</b> · 配对 <b>${pairs}</b> 对,每对同生日 1/365 ≈ 0.27%`,
    `P(any shared birthday) = 1 − (365/365)×(364/365)×···×(${366 - N}/365)<br>` +
    `= 1 − ${prod.toFixed(4)} = <b>${pctS(1 - prod)}</b> · <b>${pairs}</b> pairs, each a 1/365 ≈ 0.27% shot`);
}

/* ================= UI / 主循环 ================= */
const elPlay = document.getElementById('play');
const elN = document.getElementById('n'), elNVal = document.getElementById('nVal');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels'), tglLinks = document.getElementById('tglLinks');
let lastStep = -1;

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { setN(s.n); deal(); if (s.mc) runMC(); });
    elSteps.appendChild(li);
  });
  lastStep = -1;
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setN(v) {
  N = clamp(Math.round(v), 1, 80);
  elN.value = N; elNVal.textContent = N;
  days = []; groups = new Map(); collGroups = []; flashStart.clear();
  revealed = 0; phase = 'idle'; rollHasColl = false; rollInfo = null;
  mcHits = mcTrials = 0; mcRunning = false; mcRunDone = mcRunHits = 0;
  mcCloud.length = 0; mcLine.length = 0;
  updateFormula(); updateStats();
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elN.addEventListener('input', () => setN(+elN.value));
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
document.getElementById('btnRoll').addEventListener('click', () => deal());
document.getElementById('btnMC').addEventListener('click', () => runMC());
document.getElementById('btnReset').addEventListener('click', () => { setN(N); tSim = 0; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglLinks.addEventListener('change', () => { showLinks = tglLinks.checked; });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

/* URL 参数:?n= 初始人数 ?t= 预演秒数 ?pause=1 ?speed= ?labels=0 */
setN(clamp(Math.round(qsFloat('n', 23)), 1, 80));
speed = clamp(qsFloat('speed', 1), 0.2, 3);
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(1) + '×';
showLabels = qsBool('labels', true); tglLabels.checked = showLabels;
playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;

applyTheme();
applyLang();
{ /* ?t= 预演:按自动节奏瞬时掷若干局 */
  const pre = clamp(qsFloat('t', 0), 0, 600);
  let guard = 0;
  while (tSim < pre && guard++ < 400) { dealInstant(); tSim += (revealDur + HOLD) / speed; }
}
setPlayLabel();

let last = performance.now(), rafId = 0, running = false, statAcc = 0;
function frame(now) {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  wall += dt;
  const dts = dt * speed;
  if (phase !== 'idle') advanceRoll(dts);
  if (mcRunning) advanceMC();
  if (playing) {
    tSim += dts;
    if (phase === 'idle' || (phase === 'hold' && holdT >= HOLD)) deal();
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw();
  statAcc += dt;
  if (statAcc > 0.25) { statAcc = 0; updateStats(); updateFormula(); }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
}
function setRunning(r) {
  if (r && !running) { running = true; last = performance.now(); rafId = requestAnimationFrame(frame); }
  else if (!r && running) { running = false; cancelAnimationFrame(rafId); }
}
document.addEventListener('visibilitychange', () => setRunning(!document.hidden));
updateStats();
setRunning(!document.hidden);
</script>
