<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wi-Fi · 把比特织进空气</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#69db7c;
    --bg:#0d1210; --panel:rgba(13,19,16,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f0f7f2; --text2:#93b3a0; --text3:#c4dccd;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,19,16,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,19,16,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#2b8a3e;
    --bg:#edf3ef; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,40,25,.10);
    --text:#152a1c; --text2:#5a7a66; --text3:#2f4a3a;
    --hover:rgba(15,40,25,.05); --shadow:0 8px 26px rgba(25,60,40,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,40,25,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(105,219,124,.6); background: rgba(105,219,124,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(43,138,62,.55); background: rgba(43,138,62,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(105,219,124,.10); border-color: rgba(105,219,124,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(43,138,62,.08); border-color: rgba(43,138,62,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,40,25,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #b8f0c2; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>

<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="Wi-Fi · 把比特织进空气" data-en="Wi-Fi · Weaving Bits into the Air">Wi-Fi · 把比特织进空气</h1>
  <div class="sub" data-zh="2.4 GHz(λ=12.5 cm,只有 1/6/11 三个不重叠信道,穿墙好但拥挤)与 5 GHz(信道多而宽、快,穿墙差)都是微瓦级的共享媒介→OFDM 把高速数据流拆到 52–234 个正交子载波上并行低速跑,每根梳齿用 64-QAM 载 6 bit 或 256-QAM 载 8 bit→墙的反射让同一符号走多条路先后到达:符号间干扰;保护间隔 CP 把延迟副本吃掉,多径从敌人变成可合并的冗余→空气只有一个:CSMA/CA 先听后说,忙就随机退避 0–CW 个时隙;两台设备同时归零=碰撞,全部作废、CW 翻倍重来;墙后的隐藏节点互相听不到,RTS/CTS 握手来救→SNR 掉(拉远/穿墙),MCS 就逐档降:256-QAM→64-QAM→16-QAM→QPSK,速率掉一个数量级 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="2.4 GHz (λ=12.5 cm, only three non-overlapping channels 1/6/11, good through walls but crowded) and 5 GHz (many wide fast channels, poor through walls) are both microwatt shared media → OFDM splits the fast stream across 52–234 orthogonal subcarriers running slow in parallel, each comb tooth carrying 6 bits (64-QAM) or 8 bits (256-QAM) → wall reflections make one symbol arrive several times: ISI; the CP guard interval eats the delayed copies, turning multipath from enemy into mergeable redundancy → air is a single channel: CSMA/CA listens before talking, backs off a random 0–CW slots when busy; two devices hitting zero together = collision, all voided, CW doubles; hidden nodes behind walls can't hear each other — RTS/CTS handshake to the rescue → when SNR drops (distance/walls), MCS steps down 256-QAM→64-QAM→16-QAM→QPSK and the rate loses an order of magnitude · 3D interactive demo · drag to orbit · Space = run/pause">Wi-Fi · 把比特织进空气</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

</div>

<div id="stats">
  <span class="k" data-zh="SNR(设备 B)" data-en="SNR (dev B)">SNR(设备 B)</span><span class="v ok" id="stSnr">—</span>
  <span class="k" data-zh="MCS / 速率" data-en="MCS / rate">MCS / 速率</span><span class="v ok" id="stRate">—</span>
  <span class="k" data-zh="碰撞次数" data-en="Collisions">碰撞次数</span><span class="v" id="stColl">0</span>
  <span class="k" data-zh="重传率" data-en="Retry rate">重传率</span><span class="v warn" id="stRetr">—</span>

</div>

<div id="plot">
  <h3 data-zh="速率-SNR 阶梯:MCS 档位的台阶——SNR 每跌过一道坎,调制就降一阶、速率跳水;绿点是设备 B 的工作点" data-en="Rate vs SNR staircase: each MCS step is a cliff — every threshold the SNR crosses drops the modulation one order and the rate dives; the green dot is device B's operating point">速率-SNR 阶梯:MCS 档位的台阶——SNR 每跌过一道坎,调制就降一阶、速率跳水;绿点是设备 B 的工作点</h3>
  <canvas id="plotCv"></canvas>

<div id="panel">
  <div id="legend">
    <span class="chip.b" data-zh="波纹:微瓦级射电,大家共享同一空气" data-en="ripples: microwatt radio, one shared medium">波纹:微瓦级射电,大家共享同一空气</span>
    <span class="chip.o" data-zh="OFDM 梳齿:每根子载波各自载比特" data-en="OFDM comb: each subcarrier carries its own bits">OFDM 梳齿:每根子载波各自载比特</span>
    <span class="chip.g" data-zh="绿=发射成功,琥珀=退避倒计时" data-en="green = tx ok, amber = backoff counting">绿=发射成功,琥珀=退避倒计时</span>
    <span class="chip.r" data-zh="红=碰撞:全部作废,CW 翻倍" data-en="red = collision: all voided, CW doubles">红=碰撞:全部作废,CW 翻倍</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnP0" data-zh="预设:正常" data-en="Preset: normal">预设:正常</button>
    <button class="abtn" id="btnP1" data-zh="预设:隐藏节点" data-en="Preset: hidden node">预设:隐藏节点</button>
    <button class="abtn" id="btnP2" data-zh="预设:拥塞" data-en="Preset: congestion">预设:拥塞</button>
    <button class="abtn" id="btnBand" data-zh="频段:2.4 GHz" data-en="Band: 2.4 GHz">频段:2.4 GHz</button>
  </div>
  <div class="row"><label data-zh="设备 B 距离" data-en="Device B range">设备 B 距离</label><input id="sDist" type="range" min="2" max="18" step="0.1" value="5"><span class="val" id="sDistVal">5.0 m</span></div>

      <label><input id="tglSub" type="checkbox" checked> <span data-zh="子载波" data-en="Subcarriers">子载波</span></label>
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglPlot" type="checkbox" checked> <span data-zh="图" data-en="Plot">图</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../cellular-network/" data-zh="蜂窝网络:无线同族(调度版)" data-en="cellular network: the scheduled sibling">蜂窝网络:无线同族(调度版)</a>
    <a href="../am-fm-modulation/" data-zh="AM/FM 调制:把比特装上正弦波" data-en="AM/FM: putting bits onto a sine wave">AM/FM 调制:把比特装上正弦波</a>
    <a href="../em-wave/" data-zh="电磁波:一切无线传播的本源" data-en="EM waves: the root of all wireless">电磁波:一切无线传播的本源</a>

    <a href="../error-correction/" data-zh="纠错码:链路的最后保险" data-en="error correction: the link's last safety net">纠错码:链路的最后保险</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d1210, 24, 70);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x0d1210 : 0xdfe8e2);
  scene.fog.color = new THREE.Color(dark ? 0x0d1210 : 0xdfe8e2);
  floorM.color.setHex(dark ? 0x161d19 : 0xbccdc2);
  wallM.color.setHex(dark ? 0x39434c : 0x9fb0ba);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('Wi-Fi · 把比特织进空气', 'Wi-Fi · Weaving Bits into the Air');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (err) { renderer = null; }
const glOK = !!renderer;
if (glOK) {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} else {
  const dv = document.createElement('div');
  dv.style.cssText = 'position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--text2);font-size:14px;background:var(--bg)';
  dv.textContent = L('WebGL 初始化失败:3D 场景不可用,但左侧控制面板仍可浏览。', 'WebGL failed to initialise: the 3D scene is unavailable, but the control panel still works.');
  document.body.appendChild(dv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (glOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 160);
camera.position.set(11, 10.5, 13.5);
let controls = null;
if (glOK) {
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(-0.5, 0.5, -0.5);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 2;
  controls.maxDistance = 60;
  controls.autoRotateSpeed = 0.3;
}

const BANDS = [
  { name: '2.4 GHz', ch: 'ch6', subs: 52, wave: '12.5 cm', snr0: 44, slope: 32, wallLoss: 6 },
  { name: '5 GHz', ch: 'ch36', subs: 234, wave: '6.1 cm', snr0: 41, slope: 38, wallLoss: 12 },
];
const MCS = [
  { n: 'MCS0 · BPSK ½', b: 1, r: 88 },
  { n: 'MCS2 · QPSK ¾', b: 2, r: 263 },
  { n: 'MCS4 · 16-QAM ¾', b: 4, r: 468 },
  { n: 'MCS6 · 64-QAM ⅔', b: 6, r: 585 },
  { n: 'MCS9 · 256-QAM ⅚', b: 8, r: 867 },
];
const MTH = [8, 14, 20, 27];
const AP = { x: 0, z: -8 };
const BDIR = { x: -0.4105, z: 0.9119 };
const WALL = { x: -4.5, z0: -2, z1: 12 };
const posB = () => ({ x: AP.x + BDIR.x * distB, z: AP.z + BDIR.z * distB });
function crossesWall(x1, z1, x2, z2) {
  if (!wallOn) return false;
  if ((x1 - WALL.x) * (x2 - WALL.x) > 0) return false;
  const t = (WALL.x - x1) / (x2 - x1);
  const z = z1 + t * (z2 - z1);
  return z >= WALL.z0 && z <= WALL.z1;
}
function snrB() {
  const b = BANDS[band];
  const p = posB();
  let s = b.snr0 - b.slope * Math.log10(Math.max(distB, 0.5) / 1.5);
  if (wallOn && crossesWall(p.x, p.z, AP.x, AP.z)) s -= b.wallLoss;
  return s;
}
function mcsIdx(s) { for (let i = MTH.length - 1; i >= 0; i--) if (s >= MTH[i]) return i + 1; return 0; }

/* ---------------- CSMA/CA 时隙引擎 ---------------- */
const SLOT = 0.14, TXS = 3, CWMIN_DEF = 8, CWMAX = 64;
let cwMin = CWMIN_DEF;
let slotN = 0, slotAcc = 0;
const DEV_DEF = [
  { id: 'A', x: 3.2, z: 1.5, color: 0x69db7c, fixed: true },
  { id: 'B', x: 0, z: 0, color: 0x4dabf7, fixed: false },
  { id: 'C', x: -9, z: -3.5, color: 0xffa94d, fixed: true },
];
let dev = [];
function buildDevState() {
  dev = DEV_DEF.map(d => ({
    ...d, active: true, state: 'idle', cnt: 0, cw: cwMin, txLeft: 0, nav: 0, idleT: Math.floor(Math.random() * 3),
    att: 0, retr: 0, ok: 0, flash: 0, ev: 'I', hist: [],
  }));
}
let hear = [[true, true, true], [true, true, true], [true, true, true]];
function recalcHear() {
  const ps = dev.map(d => ({ x: d.x, z: d.z }));
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    hear[i][j] = i === j ? false : !crossesWall(ps[i].x, ps[i].z, ps[j].x, ps[j].z);
}
let trafficP = [0.55, 0.55, 0];
function newPacket(v) { v.state = 'backoff'; v.cnt = Math.floor(Math.random() * (v.cw + 1)); }
function collideDev(v) {
  v.state = 'idle'; v.idleT = 0; v.retr++; v.cw = Math.min(CWMAX, v.cw * 2 + 1);
  v.flash = 1; newPacket(v);
}
function tick() {
  slotN++;
  if (slotN % 6 === 0) spawnRing(AP.x, AP.z, 0x66d9e8, 0, 1);
  const txers = dev.filter(v => v.active && v.state === 'tx');
  const starters = [];
  for (const v of dev) {
    if (!v.active) { v.ev = 'I'; continue; }
    if (v.state === 'idle') {
      if (v.idleT > 0) { v.idleT--; v.ev = 'I'; }
      else if (Math.random() < trafficP[dev.indexOf(v)] || trafficP[dev.indexOf(v)] >= 1) newPacket(v);
      if (v.state !== 'backoff') { v.ev = 'I'; continue; }
    }
    if (v.state === 'tx') { v.ev = 'T'; continue; }
    const busy = txers.some(t => t !== v && hear[dev.indexOf(v)][dev.indexOf(t)]) || v.nav > 0;
    if (v.nav > 0) v.nav--;
    if (busy) { v.ev = 'B' + v.cnt; continue; }
    v.cnt--;
    if (v.cnt < 0) starters.push(v);
    else v.ev = 'B' + Math.max(0, v.cnt);
  }
  let collided = starters.length >= 2 || (starters.length === 1 && txers.length >= 1);
  if (collided) {
    totalColl++; lastCollT = 0;
    for (const v of starters) { v.att++; v.ev = 'X'; collideDev(v); spawnRing(v.x, v.z, 0xff6b6b, 0, 1); }
    for (const t of txers) { t.retr++; t.flash = 1; t.ev = 'X'; collideDev(t); }
  } else if (starters.length === 1) {
    const v = starters[0];
    v.state = 'tx'; v.txLeft = TXS; v.att++; v.ev = 'T';
    spawnRing(v.x, v.z, v.color, 0, 1);
    if (wallOn) spawnRing(WALL.x, clamp(v.z, WALL.z0, WALL.z1), v.color, 0.38, 0.5);
    if (rtsOn) for (const w of dev) if (w !== v && w.active && w.state === 'backoff') w.nav = TXS + 2;
  }
  for (const v of dev) {
    if (!v.active) continue;
    if (v.state === 'tx') {
      v.txLeft--;
      if (v.txLeft <= 0) {
        v.ok++; v.cw = cwMin; v.state = 'idle';
        v.idleT = Math.random() < trafficP[dev.indexOf(v)] ? 0 : 1 + Math.floor(Math.random() * 3);
      }
    }
  }
  for (const v of dev) {
    v.hist.push(v.ev);
    if (v.hist.length > 46) v.hist.shift();
  }
}

  recalcHear();
}
function moveB() {
  const p = posB();
  dev[1].x = p.x; dev[1].z = p.z;
  devGrps[1].g.position.set(p.x, 0, p.z);
  recalcHear();
}
function setPreset(p) {
  preset = p;
  cwMin = p === 2 ? 4 : CWMIN_DEF;
  trafficP = p === 0 ? [0.55, 0.55, 0] : p === 1 ? [0.45, 0.45, 0.95] : [1, 1, 1];
  wallOn = p !== 2 ? true : false;
  document.getElementById('tglWall').checked = wallOn;
  totalColl = 0;
  buildDevState();
  applyWall();
  moveB();
  if (p === 1) notify('隐藏节点上线:墙后的 C 听不到 A/B,但 AP 听得到所有人', 'hidden node live: wall-blocked C cannot hear A/B, but the AP hears everyone');
  else if (p === 2) notify('拥塞:三台设备全负荷 + CWmin=4,碰撞成为日常', 'congestion: three saturated devices + CWmin=4 — collisions become routine');
  syncBtns();
}

/* ================= 面板绘制 ================= */
function drawPanel() {
  const ctx = pnCtx;
  const W = 512, H = 288;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text3').trim() || '#c4dccd';
  const cTxt2 = css.getPropertyValue('--text2').trim() || '#93b3a0';
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(10,14,12,.88)';
  ctx.fillRect(0, 0, W, H);
  const b = BANDS[band];
  const s = snrB(), mi = mcsIdx(s), mc = MCS[mi];
  ctx.font = 'bold 17px system-ui';
  ctx.fillStyle = cTxt;
  ctx.fillText(`OFDM · ${b.subs} ${L('子载波', 'subcarriers')} · ${b.name} · ${mc.n}`, 14, 24);
  ctx.font = '13px system-ui';
  ctx.fillStyle = cTxt2;
  ctx.fillText(L(`每根载 ${mc.b} bit · 正交梳齿互不干扰`, `each tooth ${mc.b} bits · orthogonal, no mutual interference`), 14, 44);
  if (subsOn) {
    const x0 = 20, x1 = W - 20, n = b.subs;
    const w = (x1 - x0) / n;
    for (let i = 0; i < n; i++) {
      const hue = 200 - mc.b * 23 + (i % 7) * 2;
      ctx.fillStyle = `hsl(${hue},70%,${52 + (i % 3) * 6}%)`;
      const h = 10 + mc.b * 5.5 + (i % 4) * 1.5;
      ctx.fillRect(x0 + i * w, 92 - h, Math.max(1, w - 0.6), h);
    }
    ctx.fillStyle = cTxt2;
    ctx.fillText('f', W - 14, 96);
    if (n <= 60) {
      ctx.font = '11px system-ui';
      ctx.fillStyle = cTxt2;
      for (let i = 0; i < n; i += 10) ctx.fillText(mc.b + 'b', x0 + i * w, 106);
    }
  } else {
    ctx.fillStyle = cTxt2;
    ctx.font = '14px system-ui';
    ctx.fillText(L('子载波显示已关闭(toggle 可重开)', 'subcarrier display off (toggle to reopen)'), 20, 70);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.moveTo(14, 116); ctx.lineTo(W - 14, 116); ctx.stroke();
  ctx.font = 'bold 15px system-ui';
  ctx.fillStyle = cTxt;
  ctx.fillText(L('CSMA/CA 时序带(每格 = 1 时隙)', 'CSMA/CA timeline (1 cell = 1 slot)'), 14, 136);
  ctx.font = '12px system-ui';
  for (let dvi = 0; dvi < dev.length; dvi++) {
    const v = dev[dvi];
    const y = 146 + dvi * 42;
    ctx.fillStyle = `#${v.color.toString(16).padStart(6, '0')}`;
    ctx.fillText(v.id + (v.active ? '' : L('(关)', '(off)')), 14, y + 22);
    ctx.fillStyle = cTxt2;
    ctx.fillText('cw=' + v.cw, 30, y + 34);
    for (let k = 0; k < 46; k++) {
      const e = v.hist[v.hist.length - 46 + k];
      const x = 58 + k * 9.6, yy = y + 6;
      if (e === undefined) continue;
      if (e === 'T') { ctx.fillStyle = '#37b24d'; ctx.fillRect(x, yy, 8, 26); }
      else if (e === 'I') { ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x, yy, 8, 26); }
      else if (e === 'X' || e === 'C') { ctx.fillStyle = '#e03131'; ctx.fillRect(x, yy, 8, 26); }
      else {
        const c = parseInt(e.slice(1), 10) || 0;
        ctx.fillStyle = 'rgba(255,169,77,.28)';
        ctx.fillRect(x, yy, 8, 26);
        ctx.fillStyle = '#ffa94d';
        ctx.font = '11px system-ui';
        ctx.fillText(String(c), x + 1.5, yy + 17);
        ctx.font = '12px system-ui';
      }
    }
  }
  ctx.fillStyle = '#37b24d'; ctx.fillRect(300, 262, 8, 12); ctx.fillStyle = cTxt2; ctx.fillText(L('发射', 'tx'), 312, 272);
  ctx.fillStyle = '#ffa94d'; ctx.fillRect(350, 262, 8, 12); ctx.fillStyle = cTxt2; ctx.fillText(L('退避', 'bo'), 362, 272);
  ctx.fillStyle = '#e03131'; ctx.fillRect(404, 262, 8, 12); ctx.fillStyle = cTxt2; ctx.fillText(L('碰撞', 'coll'), 416, 272);
  pnTex.needsUpdate = true;
}

/* ================= 绘图:速率-SNR 阶梯 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#93b3a0';
  const padL = 44, padR = 12, padT = 12, padB = 22;
  const xOf = s => padL + clamp(s, 0, 42) / 42 * (W - padL - padR);
  const yOf = r => (H - padB) - (Math.log10(clamp(r, 60, 1200)) - Math.log10(60)) / (Math.log10(1200) - Math.log10(60)) * (H - padB - padT);
  ctx.font = '13px system-ui';
  ctx.strokeStyle = 'rgba(140,170,155,.25)';
  ctx.fillStyle = cTxt;
  for (const r of [100, 300, 900]) {
    ctx.beginPath(); ctx.moveTo(padL, yOf(r)); ctx.lineTo(W - padR, yOf(r)); ctx.stroke();
    ctx.fillText(String(r), 8, yOf(r) + 4);
  }
  ctx.fillText('Mbps', 6, padT + 10);
  for (const s of [10, 20, 30, 40]) ctx.fillText(s, xOf(s) - 8, H - 6);
  ctx.fillText('SNR dB', W - padR - 52, H - 6);
  /* 阶梯 */
  ctx.strokeStyle = '#69db7c'; ctx.lineWidth = 2.6;
  ctx.beginPath();
  let px = padL, py = yOf(MCS[0].r);
  ctx.moveTo(px, py);
  for (let i = 0; i < MTH.length; i++) {
    const x = xOf(MTH[i]);
    ctx.lineTo(x, py);
    py = yOf(MCS[i + 1].r);
    ctx.lineTo(x, py);
  }
  ctx.lineTo(W - padR, py);
  ctx.stroke();
  /* 当前工作点 */
  const s = snrB(), mi = mcsIdx(s);
  const cx = xOf(s), cy = yOf(MCS[mi].r);
  ctx.fillStyle = '#69db7c';
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(cx, cy, 9, 0, 7); ctx.stroke();
  ctx.fillStyle = cTxt;
  ctx.fillText(MCS[mi].n, padL + 8, padT + 14);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elDist = document.getElementById('sDist'), elDistVal = document.getElementById('sDistVal');
const stSnr = document.getElementById('stSnr'), stRate = document.getElementById('stRate'), stColl = document.getElementById('stColl'),
  stRetr = document.getElementById('stRetr'), stCh = document.getElementById('stCh');
const formulaEl = document.getElementById('formula');
const btnP0 = document.getElementById('btnP0'), btnP1 = document.getElementById('btnP1'), btnP2 = document.getElementById('btnP2'),
  btnBand = document.getElementById('btnBand');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elDist.value = distB; elDistVal.textContent = distB.toFixed(1) + ' m';
}
function syncBtns() {
  btnP0.classList.toggle('on', preset === 0);
  btnP1.classList.toggle('on', preset === 1);
  btnP2.classList.toggle('on', preset === 2);
  btnBand.textContent = L('频段:' + BANDS[band].name, 'Band: ' + BANDS[band].name);
  btnBand.classList.toggle('on', band === 1);
}
function updateStats() {
  const s = snrB(), mi = mcsIdx(s);
  stSnr.textContent = s.toFixed(1) + ' dB';
  stSnr.className = 'v ' + (s >= MTH[3] ? 'ok' : s >= MTH[1] ? 'warn' : 'bad');
  stRate.textContent = MCS[mi].r + ' Mbps';
  stRate.className = 'v ' + (mi >= 3 ? 'ok' : mi >= 1 ? 'warn' : 'bad');
  stColl.textContent = String(totalColl);
  stColl.className = 'v ' + (totalColl === 0 ? 'ok' : lastCollT < 1 ? 'bad' : '');
  let att = 0, retr = 0;
  for (const v of dev) { att += v.att; retr += v.retr; }
  const rr = att > 0 ? retr / att * 100 : 0;
  stRetr.textContent = rr.toFixed(0) + ' %';
  stRetr.className = 'v ' + (rr < 10 ? 'ok' : rr < 30 ? 'warn' : 'bad');
  const b = BANDS[band];
  stCh.textContent = b.name + ' ' + b.ch + ' · ' + b.subs;
}
function updateFormula() {
  const s = snrB(), mi = mcsIdx(s);
  formulaEl.innerHTML = L(
    `<b>c = λf</b>:2.4 GHz → λ=12.5 cm,仅 1/6/11 三个不重叠信道;5 GHz 信道多而宽、穿墙差<br>` +
    `<b>OFDM</b>:数据拆到 52–234 个正交子载波并行;64-QAM 载 6 bit / 256-QAM 载 8 bit<br>` +
    `<b>多径→CP</b>:保护间隔吃掉延迟副本,反射从 ISI 变成可合并的冗余<br>` +
    `<b>CSMA/CA</b>:忙则随机退避 0–CW 时隙;同时归零=碰撞→CW 翻倍;隐藏节点→RTS/CTS<br>` +
    `<b>自适应</b>:SNR 掉一档,MCS 降一阶(256Q→64Q→16Q→QPSK),速率掉一个数量级<br>` +
    `<b>当前:SNR = ${s.toFixed(1)} dB → ${MCS[mi].n} = ${MCS[mi].r} Mbps</b>`,
    `<b>c = λf</b>: 2.4 GHz → λ=12.5 cm, only channels 1/6/11 don\u2019t overlap; 5 GHz has many wide channels, hates walls<br>` +
    `<b>OFDM</b>: the stream splits across 52–234 orthogonal subcarriers; 64-QAM carries 6 bits, 256-QAM 8<br>` +
    `<b>multipath→CP</b>: the guard interval eats delayed copies; reflections turn from ISI into mergeable redundancy<br>` +
    `<b>CSMA/CA</b>: busy → random 0–CW slot backoff; simultaneous zero = collision → CW doubles; hidden nodes → RTS/CTS<br>` +
    `<b>adaptation</b>: one step of SNR drops MCS one order (256Q→64Q→16Q→QPSK), the rate loses ×10<br>` +
    `<b>Now: SNR = ${s.toFixed(1)} dB → ${MCS[mi].n} = ${MCS[mi].r} Mbps</b>`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot(); drawPanel();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elDist.addEventListener('input', () => { distB = +elDist.value; moveB(); syncSliders(); updateStats(); updateFormula(); drawPlot(); });
btnP0.addEventListener('click', () => { setPreset(0); syncAll(); });
btnP1.addEventListener('click', () => { setPreset(1); syncAll(); });
btnP2.addEventListener('click', () => { setPreset(2); syncAll(); });
btnBand.addEventListener('click', () => { band = 1 - band; syncAll(); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglWall').addEventListener('change', e => { wallOn = e.target.checked; applyWall(); updateStats(); updateFormula(); drawPlot(); });
document.getElementById('tglRts').addEventListener('change', e => {
  rtsOn = e.target.checked;
  if (rtsOn) notify('RTS/CTS:先发短握手帧拿清场保证,隐藏节点的碰撞大幅减少', 'RTS/CTS: a short handshake reserves the floor — hidden-node collisions mostly vanish');
});
document.getElementById('tglSub').addEventListener('change', e => { subsOn = e.target.checked; });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglPlot').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
if (controls) controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
if (controls) controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedF * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  lastCollT += dt0;
  if (dt > 0) {
    slotAcc += dt;
    while (slotAcc >= SLOT) { slotAcc -= SLOT; tick(); }
  }
  /* 设备状态环与闪灯 */
  const RCOL = { idle: 0x555c63, back: 0xffa94d, tx: 0x7bd88f, col: 0xff6b6b };
  for (let i = 0; i < dev.length; i++) {
    const v = dev[i], dg = devGrps[i];
    v.flash *= Math.exp(-dt0 * 5);
    const col = v.flash > 0.25 ? RCOL.col : v.state === 'tx' ? RCOL.tx : v.state === 'backoff' ? RCOL.back : RCOL.idle;
    dg.ring.material.color.setHex(col);
    const sc = 1 + v.flash * 0.7;
    dg.ring.scale.setScalar(sc);
    dg.ring.material.opacity = 0.7 + v.flash * 0.3;
    dg.scr.material.emissiveIntensity = 1.1 + v.flash * 3 + (v.state === 'tx' ? 0.8 : 0);
  }
  apLed.material.emissiveIntensity = 1.8 + Math.sin(performance.now() / 280) * 0.9;
  /* 波纹 */
  for (const r of rings) {
    if (r.t < 0) continue;
    r.t += dt0;
    if (r.t < r.delay) continue;
    const u = (r.t - r.delay) / 1.35;
    if (u >= 1) { r.t = -1; r.m.visible = false; continue; }
    r.m.scale.setScalar(0.5 + 11 * u);
    r.m.material.opacity = (0.5 - 0.45 * u) * r.amp;
  }
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.066) { accPlot = 0; drawPanel(); if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildDevState();
buildDevLabels();
applyWall();
moveB();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
else setPreset(preset);
syncAll();
if (glOK) start();
</script>
</body>
</html>
