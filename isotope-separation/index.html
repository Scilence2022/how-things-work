<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>气体离心机与同位素分离 · 把 0.72% 爬到 3–5%</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffd43b;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#b8860b;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="气体离心机与同位素分离" data-en="Gas Centrifuges &amp; Isotope Separation">气体离心机与同位素分离</h1>
  <div class="sub" data-zh="²³⁵UF₆ 与 ²³⁸UF₆ 只差 1.3% 的质量,一场每秒几百转的离心把重的甩向壁、轻的聚在轴,再靠轴向逆流把径向差变成纵向差;单台机器只富集千分之几——上万台级联接力,才能把 0.72% 爬到 3–5% · 拖动旋转 / 空格运行/暂停" data-en="²³⁵UF₆ and ²³⁸UF₆ differ in mass by only 1.3%; a rotor spinning hundreds of times a second flings the heavy to the wall and gathers the light at the axis, while an axial counter-current turns the radial difference into a vertical one; a single machine enriches by only a few tenths of a percent — tens of thousands cascaded in series climb from 0.72% to 3–5% · drag to orbit / Space = run/pause">²³⁵UF₆ 与 ²³⁸UF₆ 只差 1.3% 的质量,一场每秒几百转的离心把重的甩向壁、轻的聚在轴,再靠轴向逆流把径向差变成纵向差;单台机器只富集千分之几——上万台级联接力,才能把 0.72% 爬到 3–5% · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="转速" data-en="Rotor speed">转速</span><span class="v" id="stRpm">—</span>
  <span class="k" data-zh="单级分离系数 α" data-en="Separation factor α">单级分离系数 α</span><span class="v" id="stAlpha">—</span>
  <span class="k" data-zh="级联级数" data-en="Cascade stages">级联级数</span><span class="v" id="stStages">—</span>
  <span class="k" data-zh="出口丰度" data-en="Product assay">出口丰度</span><span class="v" id="stOut">—</span>

  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="actions">
    <button class="abtn on" id="bUnit" data-zh="单机剖视" data-en="Cutaway unit">单机剖视</button>
    <button class="abtn" id="bCascade" data-zh="级联全览" data-en="Cascade view">级联全览</button>

    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglSlow" type="checkbox"> <span data-zh="慢放 ×0.3" data-en="Slow-mo ×0.3">慢放 ×0.3</span></label>

  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器与场景 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,26,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);
camera.position.set(0.4,4.4,9.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.1,1.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=50;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ---- 桌面 ---- */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const table=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,0.18,48),
  new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.8}));
table.position.y=-0.08;scene.add(table);/* 桌面顶面抬到 y=0.01,避免与 y=0 地面共面产生像素化闪面伪影 */

/* ---- 剖视离心机转子(左) ---- */
const RX=-2.1,RR=0.72,RH=2.5;
const metalM=new THREE.MeshStandardMaterial({color:0x94a3b8,roughness:0.3,metalness:0.85,side:THREE.DoubleSide});
const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.6,0.3,32),
  new THREE.MeshStandardMaterial({color:0x2b3038,roughness:0.6,metalness:0.3}));
pedestal.position.set(RX,0.12,0);scene.add(pedestal);/* 顶面降至 0.27,错开转子下端盖(y=0.30)共面闪面 */
/* 外壳:切开 1/4(缺口朝向默认机位) */
const shell=new THREE.Mesh(new THREE.CylinderGeometry(RR,RR,RH,48,1,true,Math.PI/4,1.5*Math.PI),metalM);
shell.position.set(RX,0.3+RH/2,0);scene.add(shell);
const rotorSpin=new THREE.Group();rotorSpin.position.set(RX,0,0);scene.add(rotorSpin);
const capTop=new THREE.Mesh(new THREE.CylinderGeometry(RR,RR,0.04,48,1,false,Math.PI/4,1.5*Math.PI),metalM);
capTop.position.y=0.3+RH+0.02;rotorSpin.add(capTop);
const capBot=new THREE.Mesh(new THREE.CylinderGeometry(RR,RR,0.04,48,1,false,Math.PI/4,1.5*Math.PI),metalM);
capBot.position.y=0.3-0.02;rotorSpin.add(capBot);
const marker=new THREE.Mesh(new THREE.BoxGeometry(0.03,RH-0.2,0.05),
  new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xffd43b,emissiveIntensity:0.7}));
marker.position.set(0,0.3+RH/2,RR-0.1);rotorSpin.add(marker);
/* 轴心取料管 + 上下取料勺 */
const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,RH-0.2,16),
  new THREE.MeshStandardMaterial({color:0xcbd5e1,roughness:0.25,metalness:0.9}));
tube.position.set(RX,0.3+RH/2,0);scene.add(tube);
const scoopTopM=new THREE.MeshStandardMaterial({color:0x51cf66,emissive:0x2b8a3e,emissiveIntensity:0.9,roughness:0.4});
const scoopTop=new THREE.Mesh(new THREE.TorusGeometry(0.09,0.025,10,24),scoopTopM);
scoopTop.rotation.x=Math.PI/2;scoopTop.position.set(RX,0.3+RH-0.25,0);scene.add(scoopTop);
const scoopBot=new THREE.Mesh(new THREE.TorusGeometry(0.09,0.025,10,24),
  new THREE.MeshStandardMaterial({color:0xff922b,emissive:0x8a4406,emissiveIntensity:0.9,roughness:0.4}));
scoopBot.rotation.x=Math.PI/2;scoopBot.position.set(RX,0.55,0);scene.add(scoopBot);
/* UF₆ 进料管 */
const feedPipe=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.5,12),
  new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4}));
feedPipe.rotation.x=Math.PI/2;feedPipe.position.set(RX,0.3+RH/2,-0.95);scene.add(feedPipe);
const valve=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.1),
  new THREE.MeshStandardMaterial({color:0x4dabf7,roughness:0.4}));
valve.position.set(RX,0.3+RH/2,-1.15);scene.add(valve);
/* 壁面贫料区 / 轴心轻组分辉光(随分层强度变化) */
const wallGlowM=new THREE.MeshBasicMaterial({color:0xff922b,transparent:true,opacity:0.12,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const wallGlow=new THREE.Mesh(new THREE.CylinderGeometry(0.66,0.66,RH-0.2,32,1,true),wallGlowM);
wallGlow.position.set(RX,0.3+RH/2,0);scene.add(wallGlow);
const axisGlowM=new THREE.MeshBasicMaterial({color:0x51cf66,transparent:true,opacity:0.1,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const axisGlow=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,RH-0.2,24,1,true),axisGlowM);
axisGlow.position.set(RX,0.3+RH/2,0);scene.add(axisGlow);
/* 轴向逆流螺旋示意 */
const helixPts=[];
for(let i=0;i<=64;i++){const t=i/64,a=t*2.25*Math.PI*2;
  helixPts.push(new THREE.Vector3(RX+0.3*Math.sin(a),0.55+1.9*t,0.3*Math.cos(a)));}
const helix=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(helixPts),96,0.012,6),
  new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.45,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(helix);

/* ---- 气体分子(InstancedMesh):绿=²³⁵UF₆,橙=²³⁸UF₆ ---- */
const NM=340,NG=136;
const mols=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,8,8),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.35,emissive:0x222222,emissiveIntensity:0.6}),NM);
mols.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(mols);
const mAng=new Float32Array(NM),mR=new Float32Array(NM),mY=new Float32Array(NM);
const mRg=new Float32Array(NM),mRo=new Float32Array(NM),mRu=new Float32Array(NM),mWob=new Float32Array(NM);
const mSp=new Uint8Array(NM),molPX=new Float32Array(NM),molPY=new Float32Array(NM),molPZ=new Float32Array(NM);
{
  const cG=new THREE.Color(0x51cf66),cO=new THREE.Color(0xff922b);
  for(let i=0;i<NM;i++){
    mSp[i]=i<NG?0:1;
    mAng[i]=Math.random()*Math.PI*2;
    mRg[i]=0.12+Math.random()*0.26;
    mRo[i]=0.44+Math.random()*0.22;
    mRu[i]=0.08+Math.random()*0.58;
    mR[i]=mRu[i];mY[i]=0.45+Math.random()*2.1;
    mWob[i]=Math.random();
    mols.setColorAt(i,i<NG?cG:cO);
  }
}
/* ---- 分子轨迹 ---- */
const NTR=12,TRP=26;
const trackIdx=[0,1,2,30,31,60,136,137,138,170,200,230];
const trailGeos=[],trailPos=[];
for(let k=0;k<NTR;k++){
  const g=new THREE.BufferGeometry();
  const arr=new Float32Array(TRP*3);
  g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const line=new THREE.Line(g,new THREE.LineBasicMaterial({
    color:trackIdx[k]<NG?0x51cf66:0xff922b,transparent:true,opacity:0.45}));
  line.frustumCulled=false;line.visible=false;scene.add(line);
  trailGeos.push(g);trailPos.push(arr);
}

/* ---- 级联塔(右):8 台小离心机(CX 左移,避免默认机位下被右缘裁切) ---- */
const CX=1.5,CZ=-0.1;
const casBase=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.12,0.85),
  new THREE.MeshStandardMaterial({color:0x2b3038,roughness:0.6,metalness:0.3}));
casBase.position.set(CX,0.06,CZ);scene.add(casBase);
const smallM=new THREE.MeshStandardMaterial({color:0x9aa7b8,roughness:0.3,metalness:0.85});
const markerGroups=[];
for(let k=0;k<8;k++){
  const y=0.55+k*0.42;
  const unit=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.3,20),smallM);
  unit.position.set(CX,y,CZ);scene.add(unit);
  const mg=new THREE.Group();mg.position.set(CX,y,CZ);scene.add(mg);
  const mk=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.24,0.03),
    new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0xb8860b,emissiveIntensity:0.8}));
  mk.position.x=0.12;mg.add(mk);markerGroups.push(mg);
  const stub=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.24,10),
    new THREE.MeshStandardMaterial({color:0x8b98a8,roughness:0.4,metalness:0.6}));
  stub.rotation.x=Math.PI/2;stub.position.set(CX,y,CZ-0.21);scene.add(stub);
}
const mainPipe=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,3.3,12),
  new THREE.MeshStandardMaterial({color:0x8b98a8,roughness:0.4,metalness:0.6}));
mainPipe.position.set(CX,2.19,CZ-0.3);scene.add(mainPipe);
const outM=new THREE.MeshStandardMaterial({color:0xffe08a,emissive:0xffd43b,emissiveIntensity:1,roughness:0.3});
const outlet=new THREE.Mesh(new THREE.SphereGeometry(0.075,16,14),outM);
outlet.position.set(CX,3.92,CZ-0.3);scene.add(outlet);
const feedCone=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.14,12),
  new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4}));
feedCone.rotation.z=-Math.PI/2;feedCone.position.set(CX-0.42,0.55,CZ);scene.add(feedCone);

/* ---- 状态与物理 ---- */
let playing=true,labelsOn=true,simT=0,speedMul=1;
let slowMo=false;
let spd=92,cut=0.25,sCur=1,spinAngle=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
if(qs.get('speed')!==null){speedMul=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);}
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
/* 单级分离系数:α = exp(ΔM·v_p²/(2RT)),ΔM=3 g/mol,R_real=0.13 m,T=320 K */
function calcAlpha(){const rpm=60000*spd/100,w=2*Math.PI*rpm/60,vp=w*0.13;
  return Math.exp(0.003*vp*vp/(2*8.314*320));}
function calcEff(){return clamp(1+(calcAlpha()-1)*(1.25-cut),1.05,1.32);}
function fieldG(){const w=2*Math.PI*60000*spd/100/60;return w*w*0.13;}
let trailsOn=false,trailWasOn=false;
let camAnim=null;
function flyTo(px,py,pz,tx,ty,tz){
  camAnim={p0:camera.position.clone(),t0:controls.target.clone(),
    p1:new THREE.Vector3(px,py,pz),t1:new THREE.Vector3(tx,ty,tz),k:0};
}
controls.addEventListener('start',()=>{camAnim=null;});
function trailsSet(v){trailsOn=v;trailWasOn=false;}
function setSpd(v2){spd=v2;document.getElementById('sSpd').value=v2;
  document.getElementById('sSpdVal').textContent=v2+' %';}
function setCut(c){cut=c;document.getElementById('sCut').value=c;
  document.getElementById('sCutVal').textContent=c.toFixed(2);}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L(`²³⁵UF₆ 聚轴 · 离心场 ${(fieldG()/9.8/1e5).toFixed(2)}×10⁵ g`,
  `²³⁵UF₆ to the axis · field ${(fieldG()/9.8/1e5).toFixed(2)}×10⁵ g`),new THREE.Vector3(RX,3.0,0),'g');
addLabel(()=>L('²³⁸UF₆ 靠壁 · 贫料区','²³⁸UF₆ at the wall · tails'),new THREE.Vector3(RX+1.05,1.55,0.5),'o');
addLabel(()=>L('轴向逆流:轻上 · 重下','Axial counter-current: light up · heavy down'),new THREE.Vector3(RX+1.1,0.5,0.8),'b');
addLabel(()=>L(`级联出口 ${(0.72*Math.pow(calcEff(),7)).toFixed(2)}%`,
  `Cascade product ${(0.72*Math.pow(calcEff(),7)).toFixed(2)}%`),new THREE.Vector3(CX-1.9,3.05,CZ+0.1),'y');
for(let k=0;k<8;k++){
  const y=0.55+k*0.42;
  addLabel(()=>`${(0.72*Math.pow(calcEff(),k)).toFixed(2)}%`,new THREE.Vector3(CX,y+0.3,CZ),k===7?'y':(k>=4?'g':''));
}

/* ---- 步骤 ---- */
const STEPS=[
 {zh:'UF₆ 气体入机:六氟化铀唯一选择',en:'UF₆ feed enters the rotor: uranium hexafluoride is the only workable gas',
  act(){setSpd(92);flyTo(-5.0,3.1,5.8,-1.6,1.8,0);
    document.getElementById('bUnit').classList.add('on');document.getElementById('bCascade').classList.remove('on');}},
 {zh:'高速旋转:离心场是重力的几百万倍',en:'Spin-up at hundreds of rev/s: the centrifugal field reaches hundreds of thousands of g',
  act(){setSpd(100);flyTo(-5.0,3.1,5.8,-1.6,1.8,0);}},
 {zh:'重的靠壁、轻的聚轴',en:'Heavy ²³⁸UF₆ hugs the wall, light ²³⁵UF₆ gathers at the axis',
  act(){setSpd(100);}},
 {zh:'轴向逆流把径向差搬成上下差',en:'The axial counter-current turns the radial gradient into a vertical one',
  act(){const t=document.getElementById('tglTrail');t.checked=true;trailsSet(true);}},
 {zh:'单级 α≈1.1:一杯水舀一勺',en:'One stage gives α≈1.1: one spoonful out of a glass of water',
  act(){setSpd(62);flyTo(-5.0,3.1,5.8,-1.6,1.8,0);
    document.getElementById('bSlowCmp').classList.add('on');}},
 {zh:'上万台级联接力:丰度才能爬到门槛',en:'Tens of thousands of machines in cascade lift 0.72% over the threshold',
  act(){flyTo(4.3,3.1,5.6,CX,1.9,CZ);
    document.getElementById('bCascade').classList.add('on');document.getElementById('bUnit').classList.remove('on');
    document.getElementById('bSlowCmp').classList.remove('on');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ---- 读数 ---- */
function updateStats(){
  const rpm=Math.round(60000*spd/100);
  const rEl=document.getElementById('stRpm');
  rEl.innerHTML=rpm.toLocaleString('en-US')+'<small> rpm</small>';
  rEl.className='v '+(sCur<0.3?'warn':'ok');
  document.getElementById('stAlpha').innerHTML=calcAlpha().toFixed(2)+'<small> ×</small>';
  document.getElementById('stStages').innerHTML=
    Math.ceil(Math.log(3.5/0.72)/Math.log(calcEff()))+'<small>'+L(' 级 → 3.5%',' stages → 3.5%')+'</small>';
  document.getElementById('stOut').innerHTML=(0.72*Math.pow(calcEff(),7)).toFixed(2)+'<small> %</small>';
}

/* ---- 控件 ---- */
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bUnit').addEventListener('click',()=>{
  flyTo(-5.0,3.1,5.8,-1.6,1.8,0);
  document.getElementById('bUnit').classList.add('on');
  document.getElementById('bCascade').classList.remove('on');
});
document.getElementById('bCascade').addEventListener('click',()=>{
  flyTo(4.3,3.1,5.6,CX,1.9,CZ);
  document.getElementById('bCascade').classList.add('on');
  document.getElementById('bUnit').classList.remove('on');
});
document.getElementById('bSlowCmp').addEventListener('click',()=>{
  setSpd(60);flyTo(-5.0,3.1,5.8,-1.6,1.8,0);
  document.getElementById('bSlowCmp').classList.add('on');
});
document.getElementById('sSpd').addEventListener('input',e=>setSpd(+e.target.value));
document.getElementById('sCut').addEventListener('input',e=>setCut(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglTrail').addEventListener('change',e=>trailsSet(e.target.checked));

/* ---- 主题/语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null;
const m4=new THREE.Matrix4();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*speedMul*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 相机缓动(用户拖动即取消) */
  if(camAnim){
    camAnim.k=Math.min(1,camAnim.k+dt*1.3);
    const k=camAnim.k,e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(camAnim.p0,camAnim.p1,e);
    controls.target.lerpVectors(camAnim.t0,camAnim.t1,e);
    if(k>=1)camAnim=null;
  }
  /* 转子旋转 */
  const w=4+16*spd/100;
  spinAngle+=dts*w;rotorSpin.rotation.y=spinAngle;
  /* 分层因子:转速不足立即变糊 */
  sCur+=(clamp((spd-58)/12,0,1)-sCur)*Math.min(1,dts*3);
  wallGlowM.opacity=0.05+0.13*sCur;axisGlowM.opacity=0.04+0.12*sCur;
  /* 分子:随转子公转 + 径向分层 + 轴向逆流 */
  for(let i=0;i<NM;i++){
    mAng[i]+=dts*w*(0.94+0.12*mWob[i]);
    const rT=mRu[i]+(mSp[i]===0?mRg[i]-mRu[i]:mRo[i]-mRu[i])*sCur;
    mR[i]+=(rT-mR[i])*Math.min(1,dts*1.6);
    mR[i]=clamp(mR[i]+(Math.random()-0.5)*dts*0.05*(1.3-sCur),0.07,0.665);
    mY[i]+=dts*(mR[i]<0.32?1:-1)*(0.08+0.4*sCur)*(mSp[i]===0?1.15:0.9);
    if(mY[i]>2.62)mY[i]=0.45;else if(mY[i]<0.42)mY[i]=2.6;
    const x=mR[i]*Math.sin(mAng[i]),z=mR[i]*Math.cos(mAng[i]);
    m4.makeScale(1,1,1);m4.setPosition(x,mY[i],z);
    mols.setMatrixAt(i,m4);
    molPX[i]=x;molPY[i]=mY[i];molPZ[i]=z;
  }
  mols.instanceMatrix.needsUpdate=true;
  /* 分子轨迹 */
  if(trailsOn){
    for(let k=0;k<NTR;k++){
      const i=trackIdx[k],arr=trailPos[k];
      if(!trailWasOn)for(let p=0;p<TRP;p++){arr[p*3]=molPX[i];arr[p*3+1]=molPY[i];arr[p*3+2]=molPZ[i];}
      else{arr.copyWithin(0,3);arr[TRP*3-3]=molPX[i];arr[TRP*3-2]=molPY[i];arr[TRP*3-1]=molPZ[i];}
      trailGeos[k].attributes.position.needsUpdate=true;
    }
    trailWasOn=true;
  }
  /* 级联:小转子标记旋转 + 出口闪亮 */
  for(let k=0;k<8;k++)markerGroups[k].rotation.y=simT*(10+spd/100*10)+k*0.7;
  outM.emissiveIntensity=0.7+0.5*Math.sin(simT*4);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.15){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
setSpd(92);setCut(0.25);
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
