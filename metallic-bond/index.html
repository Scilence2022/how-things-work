<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>金属键与延展性 · 电子海一重连,金属就打不碎</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#5fa8d3;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;

    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#2b6f9e;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);

  #stats .k{font-size:12px;color:var(--text2);align-self:center}

  #stats .v.warn{color:#ff6b6b}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}

    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(95,168,211,.6);background:rgba(95,168,211,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(43,111,158,.55);background:rgba(43,111,158,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(95,168,211,.10);border-color:rgba(95,168,211,.45)}

  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#d3e7f6}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="金属键与延展性" data-en="Metallic Bonds &amp; Ductility">金属键与延展性</h1>
  <div class="sub" data-zh="金属 = 正离子实浸在离域自由电子海里,金属键没有方向性:受剪时一层离子实整体滑过一个晶格位,电子海立刻重新布满新位置、键合如初——所以能塑性变形而不碎(延展);离子晶体滑过半个晶格 a/2 就同号离子对齐、静电排斥当场崩裂(脆);同一片电子海还负责导电导热,固溶原子与位错让滑移变难 = 合金强化 · 拖动旋转 / 空格运行/暂停" data-en="A metal = positive ion cores soaked in a delocalized electron sea, bonds without direction: shear one layer of cores past a lattice site and the sea instantly re-fills the new positions, bonding intact — so it deforms plastically instead of shattering (ductile); an ionic crystal cracks at half a slip a/2, when like charges align and repel (brittle); the same sea carries current and heat, while solute atoms and dislocations make slip hard = alloy strengthening · drag to orbit / Space = run/pause">金属 = 正离子实浸在离域自由电子海里,金属键没有方向性:受剪时一层离子实整体滑过一个晶格位,电子海立刻重新布满新位置、键合如初——所以能塑性变形而不碎(延展);离子晶体滑过半个晶格 a/2 就同号离子对齐、静电排斥当场崩裂(脆);同一片电子海还负责导电导热,固溶原子与位错让滑移变难 = 合金强化 · 拖动旋转 / 空格运行/暂停</div>
</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const $=id=>document.getElementById(id);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
$('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,14,42);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(0.4,4.8,11.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.85,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3.5;controls.maxDistance=28;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 地面与基座 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);

/* ── 晶格参数:两块并排,左金属右离子 ── */
const A=0.62,NX=5,NY=5,NZ=3,Y0=0.68,MX=-3.15,IX=3.15;
const P=[];
for(let j=0;j<NY;j++)for(let k=0;k<NZ;k++)for(let i=0;i<NX;i++)
  P.push({x:(i-(NX-1)/2)*A,y:j*A,z:(k-(NZ-1)/2)*A,s:(i+j+k)&1});
const NC=P.length;                                    /* 75 颗/块 */
const pedM=new THREE.MeshStandardMaterial({color:0x2a2f38,roughness:0.85});
for(const bx of [MX,IX]){
  const ped=new THREE.Mesh(new THREE.BoxGeometry(NX*A+0.42,0.5,NZ*A+0.42),pedM);
  ped.position.set(bx,0.25,0);scene.add(ped);
}
const matMetal=new THREE.MeshStandardMaterial({color:0xb9c4d2,roughness:0.35,metalness:0.85,transparent:true});
const matIonic=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.42,metalness:0.1,transparent:true});
const metalIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.105,18,14),matMetal,NC);
const ionicIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.115,18,14),matIonic,NC);
metalIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
ionicIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(metalIM,ionicIM);
const cNa=new THREE.Color(0xe06a5a),cCl=new THREE.Color(0x5a86e0),m4=new THREE.Matrix4();
for(let n=0;n<NC;n++)ionicIM.setColorAt(n,P[n].s?cCl:cNa);
ionicIM.instanceColor.needsUpdate=true;
/* 固溶原子(替代式,放在静止层) */
let impurFlag=false;
const impurM=new THREE.MeshStandardMaterial({color:0xd9973f,roughness:0.4,metalness:0.7});
const impG=new THREE.Group();scene.add(impG);
for(const [i,j,k] of [[1,0,0],[3,0,2],[2,1,2],[4,1,0],[0,1,1]]){
  const n=(j*NX+k)*NX+i,im=new THREE.Mesh(new THREE.SphereGeometry(0.15,16,12),impurM);
  im.position.set(MX+P[n].x,Y0+P[n].y,P[n].z);impG.add(im);
}
impG.visible=false;
/* 电子海:半透明膜 + 漂移电子 */
const seaM=new THREE.MeshStandardMaterial({color:0x86c8ec,transparent:true,opacity:0.055,
  roughness:0.9,depthWrite:false,side:THREE.DoubleSide});
const seaMem=new THREE.Mesh(new THREE.BoxGeometry(NX*A+0.55,NY*A+0.9,NZ*A+0.55),seaM);
seaMem.position.set(MX,Y0+NY*A/2,0);scene.add(seaMem);
const NE=110,electronIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,8),
  new THREE.MeshBasicMaterial({color:0xa8e4ff,transparent:true,opacity:0.9}),NE);
electronIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);electronIM.frustumCulled=false;
scene.add(electronIM);
const XB=NX*A/2+0.25,ZB=NZ*A/2+0.25,YTB=NY*A+0.15;
const eds=[];for(let i=0;i<NE;i++)eds.push({
  p:new THREE.Vector3((Math.random()*2-1)*XB,Math.random()*NY*A,(Math.random()*2-1)*ZB),
  v:new THREE.Vector3((Math.random()-0.5),(Math.random()-0.5)*0.6,(Math.random()-0.5))});
/* 剪切力箭头 */
const arrM=new THREE.MeshStandardMaterial({color:0xff8a4a,roughness:0.4,emissive:0xff8a4a,emissiveIntensity:0.45});
const arrow=new THREE.Group();
const acyl=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1,10),arrM);
acyl.rotation.z=Math.PI/2;acyl.position.x=0.5;arrow.add(acyl);
const acon=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.3,12),arrM);
acon.rotation.z=-Math.PI/2;acon.position.x=1.0;arrow.add(acon);
scene.add(arrow);

/* ── 键合线:动态重算最近邻 ── */
function makeBonds(hex,op){
  const seg=new Float32Array(400*6);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(seg,3).setUsage(THREE.DynamicDrawUsage));
  const mat=new THREE.LineBasicMaterial({color:hex,transparent:true,opacity:op});
  const ls=new THREE.LineSegments(geo,mat);ls.frustumCulled=false;scene.add(ls);
  return {seg,geo,mat,ls,integ:1,stretch:0};
}
const bndM=makeBonds(0x7fb3d8,0.5),bndI=makeBonds(0xc99090,0.55);
const segL=new Float32Array(200*6);
const geoL=new THREE.BufferGeometry();
geoL.setAttribute('position',new THREE.BufferAttribute(segL,3).setUsage(THREE.DynamicDrawUsage));
const likeLines=new THREE.LineSegments(geoL,
  new THREE.LineBasicMaterial({color:0xff5544,transparent:true,opacity:0.95}));
likeLines.frustumCulled=false;scene.add(likeLines);

/* ── 标签 ── */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblGlideM=addLabel(()=>L('滑移面','Glide plane'),new THREE.Vector3(MX+1.95,Y0+4*A,0),'y',()=>mode==='metal');
const lblGlideI=addLabel(()=>L('滑移面','Glide plane'),new THREE.Vector3(IX+1.95,Y0+4*A,0),'y',()=>mode==='ionic');
addLabel(()=>L('金属:正离子实 + 离域电子海','Metal: ion cores + delocalized e⁻ sea'),
  new THREE.Vector3(MX,Y0+NY*A+0.75,0),'b',()=>mode==='metal');
addLabel(()=>L('电子海 · 无方向性键合','Electron sea · non-directional bonding'),
  new THREE.Vector3(MX-1.6,Y0+1.3,1.1),'o',()=>mode==='metal'&&seaOn);
addLabel(()=>L('离子晶体:Na⁺ / Cl⁻ 交替阵列','Ionic crystal: alternating Na⁺ / Cl⁻'),
  new THREE.Vector3(IX,Y0+NY*A+0.75,0),'r',()=>mode==='ionic');
addLabel(()=>L('滑过 → 电子海重连 · 键合如初 → 延展','Slipped past → sea re-bonds · intact → ductile'),
  new THREE.Vector3(MX+0.4,Y0+NY*A+1.35,0),'g',()=>mode==='metal'&&shear>0.9);
addLabel(()=>L('同号离子对齐 · 静电排斥!','Like charges align · electrostatic repulsion!'),
  new THREE.Vector3(IX+0.4,Y0+(NY-1)*A+1.15,0),'r',()=>mode==='ionic'&&shear>0.42&&!frac.active);
addLabel(()=>L('当场崩裂 · 脆性断裂','Shatters on the spot · brittle fracture'),
  new THREE.Vector3(IX+1.6,1.7,0.8),'r',()=>mode==='ionic'&&frac.active);
addLabel(()=>L('电场 → 电子定向漂移 → 电流','Field → electron drift → current'),
  new THREE.Vector3(MX,0.34,1.55),'b',()=>condOn);
addLabel(()=>L('固溶原子钉住滑移面 → 强化','Solute atoms pin glide planes → strengthening'),
  new THREE.Vector3(MX-1.5,Y0+NY*A+0.35,0.8),'o',()=>impurFlag&&mode==='metal');

/* ── 状态 ── */
let mode='metal',shear=0,glide=1,shearHold=true,condOn=false;
let playing=true,labelsOn=true,slowMo=false,seaOn=true;
let simT=0,dwell=0,holdT=0;
const frac={active:false,dx:0,dy:0,rot:0,vx:0,vy:0,om:0,landed:false};
let chunkY0=(NY-glide)*A,pivY=chunkY0+glide*A/2;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null)t0=parseInt(qs.get('t'))||0;
const isC=n=>P[n].y>=chunkY0-1e-4;

function resetFrac(){frac.active=false;frac.dx=0;frac.dy=0;frac.rot=0;frac.vx=0;frac.vy=0;frac.om=0;frac.landed=false;}
function launchFrac(){resetFrac();frac.active=true;frac.vx=1.5;frac.vy=1.05;frac.om=0.55;}
function stepFrac(dts){
  if(!frac.active||frac.landed&&Math.abs(frac.vx)<0.02)return;
  frac.vy-=4.2*dts;frac.dy+=frac.vy*dts;frac.dx+=frac.vx*dts;frac.rot+=frac.om*dts;
  const floor=0.12-Y0-chunkY0;
  if(frac.dy<=floor){frac.dy=floor;frac.vy=0;frac.vx*=0.85;frac.om*=0.85;frac.landed=true;
    if(Math.abs(frac.vx)<0.05)frac.vx=0;}
  if(frac.dx>2.4){frac.dx=2.4;frac.vx=0;}
}
const posM=new Float32Array(NC*3),posI=new Float32Array(NC*3);
function fillPos(arr,bx,s){
  const c=Math.cos(frac.rot),sn=Math.sin(frac.rot);
  for(let n=0;n<NC;n++){const a=P[n];let x=a.x,y=a.y;
    if(a.y>=chunkY0-1e-4){x+=s*A;
      if(frac.active){const rel=y-pivY;
        const nx=x*c-rel*sn,ny=x*sn+rel*c;
        x=nx;y=pivY+ny+frac.dy;}}
    arr[n*3]=bx+x;arr[n*3+1]=Y0+y;arr[n*3+2]=a.z;}
}
/* 键合线重算:金属 cutoff 1.3a 自动换搭档;离子只连异号,滑过半层断 */
function bondsPass(pos,isMetal,B){
  let ns=0,crossN=0,crossSum=0;B.stretch=0;
  const cut=(isMetal?1.3:1.14)*A;
  for(let m=0;m<NC;m++){const m3=m*3,mx=pos[m3],my=pos[m3+1],mz=pos[m3+2],mc=isC(m);
    for(let n=m+1;n<NC;n++){
      if(!isMetal&&P[m].s===P[n].s)continue;
      const nc=isC(n);
      if(!isMetal&&frac.active&&mc!==nc)continue;
      const n3=n*3,dx=mx-pos[n3],dy=my-pos[n3+1],dz=mz-pos[n3+2];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d>cut)continue;
      if(ns<400){const o=ns*6;
        B.seg[o]=mx;B.seg[o+1]=my;B.seg[o+2]=mz;
        B.seg[o+3]=pos[n3];B.seg[o+4]=pos[n3+1];B.seg[o+5]=pos[n3+2];ns++;}
      if(mc!==nc){crossN++;
        crossSum+=clamp((1.3-d/A)/0.3,0,1);
        if(d/A-1>B.stretch)B.stretch=d/A-1;}
    }}
  B.geo.setDrawRange(0,ns*2);B.geo.attributes.position.needsUpdate=true;
  B.integ=crossN>0?crossSum/crossN:(isMetal?1:0);
}
function likePass(pos){
  let ns=0;
  if(mode==='ionic'&&!frac.active&&shear>0.33&&shear<0.8){
    for(let m=0;m<NC&&ns<200;m++){const mc=isC(m);
      for(let n=m+1;n<NC&&ns<200;n++){
        if(P[m].s!==P[n].s||mc===isC(n))continue;
        const m3=m*3,n3=n*3,dx=pos[m3]-pos[n3],dy=pos[m3+1]-pos[n3+1],dz=pos[m3+2]-pos[n3+2];
        const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
        if(d<1.3*A){const o=ns*6;
          segL[o]=pos[m3];segL[o+1]=pos[m3+1];segL[o+2]=pos[m3+2];
          segL[o+3]=pos[n3];segL[o+4]=pos[n3+1];segL[o+5]=pos[n3+2];ns++;}
      }}}
  geoL.setDrawRange(0,ns*2);geoL.attributes.position.needsUpdate=true;
}

/* ── 控件 ── */
function setShear(v){shear=clamp(v,0,1.5);
  if(mode==='ionic'&&shear<0.3)resetFrac();
  $('sShear').value=shear;$('sShearVal').textContent=shear.toFixed(2)+' ×a';updateStats();}
function setGlide(v){glide=clamp(Math.round(v),1,3);
  chunkY0=(NY-glide)*A;pivY=chunkY0+glide*A/2;resetFrac();
  $('sGlide').value=glide;$('sGlideVal').textContent=glide+L(' 层',' layer(s)');updateStats();}
function setMode(m){mode=m;
  $('bMetal').classList.toggle('on',m==='metal');
  $('bIonic').classList.toggle('on',m==='ionic');
  resetFrac();
  matMetal.opacity=m==='metal'?1:0.15;
  matIonic.opacity=m==='ionic'?1:0.15;
  bndM.mat.opacity=m==='metal'?0.5:0.08;
  bndI.mat.opacity=m==='ionic'?0.55:0.08;
  updateStats();}
function setPlay(v){playing=v;syncPlayBtn();}

const STEPS=[
 {zh:'<b>电子海模型</b>:金属 = 正离子实浸在离域电子海里,金属键没有方向性',en:'<b>Electron-sea model</b>: a metal is ion cores soaked in a delocalized sea — the bond has no direction',
  act(){setMode('metal');setShear(0);setGlide(1);condOn=false;impurFlag=false;shearHold=true;}},
 {zh:'<b>整层滑移</b>:受剪时滑移面以上整层离子实一起挪,键随断随接',en:'<b>Whole-plane slip</b>: shear drags whole planes along; bonds swap partners on the fly',
  act(){setMode('metal');setGlide(1);condOn=false;impurFlag=false;shearHold=false;setShear(0);}},
 {zh:'<b>滑过即复原</b>:电子海立刻填满新位置,键合如初——塑性变形不碎',en:'<b>Slip and heal</b>: the sea re-fills the new sites at once — bonding intact, the metal bends instead of shattering',
  act(){setMode('metal');shearHold=true;setShear(1.0);}},
 {zh:'<b>离子晶体受剪</b>:滑到半层,同号离子迎面相对',en:'<b>Shear an ionic crystal</b>: at half a slip, like charges come face to face',
  act(){setMode('ionic');shearHold=true;setShear(0.5);}},
 {zh:'<b>静电排斥崩裂</b>:同性相斥,解理面当场裂开——脆',en:'<b>Electrostatic shatter</b>: like charges repel and the crystal cleaves on the spot — brittle',
  act(){setMode('ionic');shearHold=true;setShear(0.62);}},
 {zh:'<b>同一片海导电导热</b>:外加电场,自由电子定向漂移成电流',en:'<b>The sea conducts</b>: apply a field and free electrons drift — current and heat ride the same sea',
  act(){setMode('metal');setShear(0);condOn=true;impurFlag=false;shearHold=true;}},
 {zh:'<b>合金强化</b>:固溶原子与位错钉住滑移面,滑移变难、金属变硬',en:'<b>Alloy strengthening</b>: solute atoms and dislocations pin the glide planes — slip gets hard, the metal gets strong',
  act(){setMode('metal');setShear(0);condOn=false;impurFlag=true;shearHold=false;}},
];
let activeStep=0;
function buildSteps(){
  const el=$('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;dwell=0;STEPS[i].act();syncSteps();}

function updateStats(){
  const integ=(mode==='metal'?bndM:bndI).integ,stretch=(mode==='metal'?bndM:bndI).stretch;
  const iv=$('stInt');
  iv.innerHTML=(integ*100).toFixed(0)+'<small> %</small>';
  iv.className='v '+(integ<0.4?'warn':integ>0.9?'ok':'');
  $('stSh').innerHTML=shear.toFixed(2)+'<small> ×a</small>';
  $('stEl').innerHTML=(stretch*100).toFixed(1)+'<small> %</small>';
  const sv=$('stState');let txt,cls='';
  if(mode==='metal'){
    txt=shear<0.04?L('结合','Bonded'):shear<0.92?L('滑移中','Slipping'):L('延展 ✓','Ductile ✓');
    cls=shear>=0.92?'ok':'';
  }else{
    txt=(frac.active||shear>0.53)?L('断裂 ✗','Fractured ✗'):shear>0.05?L('滑移中…','Slipping…'):L('结合','Bonded');
    cls=(frac.active||shear>0.53)?'warn':'';
  }
  sv.textContent=txt;sv.className='v '+cls;
}

$('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){$('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
$('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
$('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
$('bMetal').addEventListener('click',()=>setMode('metal'));
$('bIonic').addEventListener('click',()=>setMode('ionic'));
$('sShear').addEventListener('input',e=>setShear(+e.target.value));
$('sGlide').addEventListener('input',e=>setGlide(+e.target.value));
$('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
$('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
$('tglSea').addEventListener('change',e=>{seaOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  $('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  pedM.color.setHex(dark?0x2a2f38:0xd8d2c6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  $('langBtn').textContent=LANG==='en'?'ZH':'EN';
  $('sGlideVal').textContent=glide+L(' 层',' layer(s)');
  buildSteps();
}

const clock=new THREE.Clock();let raf=null;
const DWELL=7;                                        /* 分步播放:每步停留 7s 自动推进 */
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 分步播放:高亮同步推进 */
  if(playing){dwell+=dts;if(dwell>DWELL)applyPhase((activeStep+1)%STEPS.length);}
  /* 剪切自动推进:0 → 1.5a,停留后复位 */
  if(playing&&!shearHold){
    shear+=dts*0.32;
    if(shear>=1.5){shear=1.5;holdT+=dts;if(holdT>1.1){holdT=0;shear=0;resetFrac();}}
  }else holdT=0;
  if(mode==='ionic'&&!frac.active&&shear>0.53)launchFrac();
  stepFrac(dts);
  /* 原子位置与实例矩阵 */
  fillPos(posM,MX,shear);fillPos(posI,IX,shear);
  for(let n=0;n<NC;n++){
    m4.makeTranslation(posM[n*3],posM[n*3+1],posM[n*3+2]);metalIM.setMatrixAt(n,m4);
    m4.makeTranslation(posI[n*3],posI[n*3+1],posI[n*3+2]);ionicIM.setMatrixAt(n,m4);
  }
  metalIM.instanceMatrix.needsUpdate=true;ionicIM.instanceMatrix.needsUpdate=true;
  bondsPass(posM,true,bndM);bondsPass(posI,false,bndI);likePass(posI);
  /* 电子海:无序热运动 + 电场漂移 */
  const eVis=seaOn&&mode==='metal';
  electronIM.visible=eVis;seaMem.visible=eVis;
  if(eVis){
    for(let i=0;i<NE;i++){const e=eds[i];
      e.v.x=clamp(e.v.x+(Math.random()-0.5)*4*dt,-1.4,1.4);
      e.v.y=clamp(e.v.y+(Math.random()-0.5)*4*dt,-1.4,1.4);
      e.v.z=clamp(e.v.z+(Math.random()-0.5)*4*dt,-1.4,1.4);
      if(condOn)e.v.x=Math.min(e.v.x+2.6*dt,2.2);
      e.p.addScaledVector(e.v,dts);
      if(e.p.x>XB){if(condOn)e.p.x=-XB+0.05;else{e.p.x=XB;e.v.x*=-1;}}
      if(e.p.x<-XB){e.p.x=-XB;e.v.x*=-1;}
      if(e.p.y>YTB){e.p.y=YTB;e.v.y*=-1;}if(e.p.y<-0.15){e.p.y=-0.15;e.v.y*=-1;}
      if(e.p.z>ZB){e.p.z=ZB;e.v.z*=-1;}if(e.p.z<-ZB){e.p.z=-ZB;e.v.z*=-1;}
      m4.makeTranslation(MX+e.p.x,Y0+e.p.y,e.p.z);electronIM.setMatrixAt(i,m4);
    }
    electronIM.instanceMatrix.needsUpdate=true;
  }
  impG.visible=impurFlag&&mode==='metal';
  /* 剪切箭头 */
  const bx=mode==='metal'?MX:IX;
  arrow.visible=playing&&!shearHold;
  arrow.position.set(bx-0.6,Y0+NY*A+0.45,0);
  /* 滑移面标签跟随层数 */
  lblGlideM.position.y=Y0+chunkY0+0.1;
  lblGlideI.position.y=Y0+chunkY0+0.1;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();
    if(document.activeElement!==$('sShear')){$('sShear').value=shear;
      $('sShearVal').textContent=shear.toFixed(2)+' ×a';}}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
$('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length)applyPhase(t0);
else applyPhase(0);
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
