<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>激素负反馈调节 · 3D 原理动画</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;
    --acc:#a78bfa;
    --bg:#0d1017;--panel:rgba(13,16,23,.88);--panel-border:rgba(255,255,255,.09);
    --text:#f0f4f8;--text2:#8fa8c0;--text3:#b8c8d8;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,16,23,.78);--tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,16,23,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --acc:#6d28d9;
    --bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    transition:background .25s;}
  #app{position:fixed;inset:0;}
  #app canvas{display:block;}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;
    max-width:calc(100vw - 320px);}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;
    text-shadow:0 2px 8px rgba(0,0,0,.25);}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;
    text-shadow:0 1px 4px rgba(0,0,0,.2);}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;
    min-width:40px;height:32px;padding:0 12px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
  #stats{position:fixed;right:18px;top:64px;z-index:4;width:288px;
    display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    padding:11px 14px;backdrop-filter:blur(6px);box-shadow:var(--shadow);}
  .card h3{font-size:13px;color:var(--text);font-weight:600;margin-bottom:8px;}
  .kv{display:flex;justify-content:space-between;align-items:baseline;margin:5px 0;}
  .kv .k{font-size:12px;color:var(--text2);}
  .kv .v{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  .kv .v.big{font-size:20px;color:var(--acc);}
  .bar-wrap{height:6px;background:rgba(128,144,160,.18);border-radius:3px;margin-top:3px;}
  .bar-fill{height:100%;border-radius:3px;transition:width .3s;}
  .note{font-size:11px;color:var(--text2);border-top:1px solid var(--panel-border);
    margin-top:8px;padding-top:7px;line-height:1.55;}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
    border:1px solid;margin-top:6px;}
  @media(max-width:1150px){#stats{display:none;}}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:356px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 140px);overflow:auto;}
  #steps{list-style:none;}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start;}
  #steps li:hover{background:var(--hover);}
  #steps li.on{background:rgba(167,139,250,.13);border-color:rgba(167,139,250,.5);}
  :root[data-theme="light"] #steps li.on{background:rgba(109,40,217,.10);border-color:rgba(109,40,217,.4);}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
    background:rgba(128,140,155,.25);color:var(--text3);}
  #steps li.on .n{background:var(--acc);color:#fff;}
  #steps .t{font-size:12.5px;color:var(--text3);line-height:1.45;}
  #steps li.on .t b{color:var(--acc);}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer;}
  #play:hover{filter:brightness(1.12);}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px;}
  .row{display:flex;align-items:center;gap:8px;}
  .row label{font-size:12px;color:var(--text2);flex:0 0 30px;}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 38px;text-align:right;}
  #actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .abtn{font-size:11.5px;color:var(--text3);background:var(--hover);
    border:1px solid var(--panel-border);border-radius:8px;padding:5px 10px;
    cursor:pointer;transition:border-color .15s,color .15s;}
  .abtn:hover{border-color:var(--acc);color:var(--acc);}
  .abtn.active{border-color:var(--acc);color:var(--acc);background:rgba(167,139,250,.12);}
  @media(max-width:760px){
    #panel{width:calc(100vw - 36px);max-height:55vh;}
    #title{max-width:calc(100vw - 200px);}
    #title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="title">
  <h1 data-zh="激素负反馈调节" data-en="Hormone Negative Feedback">激素负反馈调节</h1>
  <div class="sub" data-zh="下丘脑–垂体–甲状腺轴：靶腺激素关掉自己的信号源 · 空格播放/暂停" data-en="Hypothalamus–Pituitary–Thyroid axis — the hormone silences its own signal · Space = play/pause">下丘脑–垂体–甲状腺轴：靶腺激素关掉自己的信号源 · 空格播放/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn">EN</button>
  <button class="tbtn" id="themeBtn">☀</button>
</div>
<div id="stats">
  <div class="card">
    <h3 data-zh="HPT 轴激素水平" data-en="HPT Axis Hormone Levels">HPT 轴激素水平</h3>
    <div class="kv"><span class="k">TRH</span><span class="v big" id="stTRH">1.0</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barTRH" style="width:50%;background:#a78bfa"></div></div>
    <div class="kv"><span class="k" data-zh="TSH (mIU/L)" data-en="TSH (mIU/L)">TSH (mIU/L)</span><span class="v" id="stTSH">2.0</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barTSH" style="width:40%;background:#fb923c"></div></div>
    <div class="kv"><span class="k" data-zh="T4 (nmol/L)" data-en="T4 (nmol/L)">T4 (nmol/L)</span><span class="v" id="stT4">80</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barT4" style="width:50%;background:#2dd4bf"></div></div>
    <div class="kv"><span class="k" data-zh="代谢率" data-en="Metabolic rate">代谢率</span><span class="v" id="stMeta">100%</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barMeta" style="width:50%;background:#fbbf24"></div></div>
    <div class="note" id="stateNote" data-zh="正常：HPT 轴在设定值附近稳定震荡" data-en="Normal: HPT axis oscillates stably around setpoint">正常：HPT 轴在设定值附近稳定震荡</div>
    <div class="tag" id="stateTag" style="color:#4ade80;border-color:rgba(74,222,128,.5);" data-zh="正常" data-en="Normal">正常</div>
  </div>
</div>
<div id="panel">
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="actions">
    <button class="abtn active" id="btnNormal" data-zh="正常状态" data-en="Normal">正常状态</button>
    <button class="abtn" id="btnHypo" data-zh="甲状腺功能减退" data-en="Hypothyroidism">甲减</button>
    <button class="abtn" id="btnGraves" data-zh="Graves 甲亢" data-en="Graves' hyperthyroidism">Graves 甲亢</button>
    <button class="abtn" id="btnCold" data-zh="寒冷刺激" data-en="Cold stimulus">寒冷刺激</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const lerp = (a,b,t) => a + (b-a)*t;
const ss = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

const STEPS_DATA = [
  ['下丘脑感受器：血 T3/T4 浓度下降→下丘脑分泌 TRH',
   'Hypothalamus senses low T3/T4 → releases TRH in pulses'],
  ['垂体放大：TRH→垂体前叶分泌 TSH，幅度约为 TRH 的 10–100 倍',
   'Pituitary amplifies: TRH → anterior pituitary releases TSH (10–100× amplification)'],
  ['甲状腺应答：TSH 激活腺苷酸环化酶→甲状腺激素合成加速',
   'Thyroid responds: TSH activates adenylyl cyclase → T3/T4 synthesis accelerates'],
  ['负反馈关闸：T3/T4 升高→同时抑制下丘脑 TRH 和垂体 TSH 分泌',
   'Negative feedback: rising T3/T4 inhibit both TRH and TSH release'],
  ['稳态维持：系统在设定值附近小幅震荡；寒冷使设定值上调',
   'Homeostasis: system oscillates around setpoint; cold shifts setpoint up'],
  ['病理推演：原发性甲减 TSH↑ T4↓；Graves 病 TSH↓↓ T4↑',
   'Pathology: primary hypothyroidism — TSH↑ T4↓; Graves — TSH↓↓ T4↑'],
];

function buildSteps() {
  const ol = document.getElementById('steps');
  ol.innerHTML = '';
  STEPS_DATA.forEach(([zh, en], i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i+1}</span><span class="t">${LANG==='en'?en:zh}</span>`;
    ol.appendChild(li);
    ol.appendChild(li);
  });
}

// De-duplicate appendChild bug fix: rebuild clean
function buildStepsClean() {
  const ol = document.getElementById('steps');
  ol.innerHTML = '';
  STEPS_DATA.forEach(([zh, en], i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i+1}</span><span class="t">${LANG==='en'?en:zh}</span>`;
    ol.appendChild(li);
  });
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 100);
camera.position.set(0, 0, 18);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 7; controls.maxDistance = 28;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 8, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0xb0a0ff, 0.4);
fill.position.set(-5, 2, -4); scene.add(fill);

function mat(color, opts={}) {
  return new THREE.MeshStandardMaterial({ color, roughness:0.45, metalness:0.15,
    emissive:color, emissiveIntensity:0.15, transparent:true, opacity:1, ...opts });
}

// Gland positions: hypothalamus top, pituitary middle, thyroid bottom
const HYPO_Y = 5.5, PIT_Y = 0, THYROID_Y = -5.5;

// Hypothalamus: pyramidal (cone-ish)
const hypoMesh = new THREE.Mesh(
  new THREE.ConeGeometry(1.0, 1.8, 6),
  mat(0x8b5cf6, { emissiveIntensity:0.35 })
);
hypoMesh.position.set(0, HYPO_Y, 0);
scene.add(hypoMesh);

// Pituitary: small oval
const pitMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.7, 20, 14),
  mat(0xf97316, { emissiveIntensity:0.3 })
);
pitMesh.scale.set(1, 0.75, 0.85);
pitMesh.position.set(0, PIT_Y, 0);
scene.add(pitMesh);

// Thyroid: two-lobed butterfly (two spheres merged)
const thyroidGroup = new THREE.Group();
const thyLeft = new THREE.Mesh(new THREE.SphereGeometry(1.0, 20, 14), mat(0x2dd4bf, { emissiveIntensity:0.3 }));
thyLeft.position.set(-0.85, 0, 0); thyLeft.scale.set(1, 0.72, 0.65);
const thyRight = new THREE.Mesh(new THREE.SphereGeometry(1.0, 20, 14), mat(0x2dd4bf, { emissiveIntensity:0.3 }));
thyRight.position.set(0.85, 0, 0); thyRight.scale.set(1, 0.72, 0.65);
const thyIsthmus = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.5, 8), mat(0x2dd4bf, { emissiveIntensity:0.3 }));
thyIsthmus.rotation.z = Math.PI/2;
thyroidGroup.add(thyLeft, thyRight, thyIsthmus);
thyroidGroup.position.set(0, THYROID_Y, 0);
scene.add(thyroidGroup);

// Blood vessel tube (portal: hypo -> pit), (systemic: pit -> thyroid), (feedback: thyroid -> up)
function makeTube(points, radius, color) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, 24, radius, 6, false);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color, roughness:0.5, metalness:0.1, transparent:true, opacity:0.28
  }));
  scene.add(m);
  return m;
}
makeTube([new THREE.Vector3(0.5, HYPO_Y-1, 0), new THREE.Vector3(0.8, (HYPO_Y+PIT_Y)/2, 0.3), new THREE.Vector3(0.5, PIT_Y+0.8, 0)], 0.10, 0x8b5cf6);
makeTube([new THREE.Vector3(0.5, PIT_Y-0.8, 0), new THREE.Vector3(0.8, (PIT_Y+THYROID_Y)/2, 0.3), new THREE.Vector3(0.5, THYROID_Y+1, 0)], 0.10, 0xf97316);
// Feedback tubes (T4 going up to hypo and pit)
makeTube([new THREE.Vector3(-0.5, THYROID_Y+1, 0), new THREE.Vector3(-1.2, (PIT_Y+THYROID_Y)/2, -0.3), new THREE.Vector3(-0.5, PIT_Y-0.8, 0)], 0.08, 0x2dd4bf);
makeTube([new THREE.Vector3(-0.5, PIT_Y+0.8, 0), new THREE.Vector3(-1.0, (HYPO_Y+PIT_Y)/2, -0.2), new THREE.Vector3(-0.5, HYPO_Y-1, 0)], 0.08, 0x2dd4bf);

// Hormone particles using InstancedMesh
const dummy = new THREE.Object3D();
const MAX_P = 60;

// TRH particles (purple, hypo -> pit)
const trhMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.12, 8, 6),
  mat(0xc4b5fd, { emissiveIntensity:0.7 }), MAX_P
);
trhMesh.count = 0; scene.add(trhMesh);

// TSH particles (orange, pit -> thyroid)
const tshMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.12, 8, 6),
  mat(0xfb923c, { emissiveIntensity:0.7 }), MAX_P
);
tshMesh.count = 0; scene.add(tshMesh);

// T4 particles (teal, thyroid -> up)
const t4Mesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.10, 8, 6),
  mat(0x2dd4bf, { emissiveIntensity:0.7 }), MAX_P
);
t4Mesh.count = 0; scene.add(t4Mesh);

// Autoantibody for Graves (looks like TSH but gold, from blood into thyroid)
const abMesh = new THREE.InstancedMesh(
  new THREE.OctahedronGeometry(0.15),
  mat(0xfcd34d, { emissiveIntensity:0.8 }), 12
);
abMesh.count = 0; scene.add(abMesh);

// Feedback inhibition arrows (red glow planes at hypo and pit when T4 high)
function mkFeedbackGlow(y) {
  const m = new THREE.Mesh(
    new THREE.RingGeometry(0.8, 1.5, 24),
    new THREE.MeshBasicMaterial({ color:0xff2244, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide })
  );
  m.position.set(0, y, 0);
  scene.add(m);
  return m;
}
const fbGlowHypo = mkFeedbackGlow(HYPO_Y);
const fbGlowPit = mkFeedbackGlow(PIT_Y);

// Body background silhouette (faint ellipse)
const bodyMesh = new THREE.Mesh(
  new THREE.EllipseCurve ? new THREE.SphereGeometry(8, 24, 16) : new THREE.SphereGeometry(8, 16, 12),
  new THREE.MeshBasicMaterial({ color:0x1a2030, transparent:true, opacity:0.12,
    side:THREE.BackSide, depthWrite:false })
);
bodyMesh.scale.set(1, 1.6, 0.25);
scene.add(bodyMesh);

// Mode: 0=normal, 1=hypo, 2=graves, 3=cold
let mode = 0;
let wallT = 0;
let playing = true;
let speed = 1;
let progress = 0;
let lastStep = -1;

// Hormone level targets per mode
const MODES = {
  0: { trhLevel:0.5, tshLevel:0.4, t4Level:0.5, metaLevel:0.5, feedbackStr:0.3 }, // normal
  1: { trhLevel:0.9, tshLevel:0.95, t4Level:0.1, metaLevel:0.2, feedbackStr:0.0 }, // hypo: TSH sky-high, T4 low
  2: { trhLevel:0.05, tshLevel:0.02, t4Level:0.98, metaLevel:0.92, feedbackStr:0.85 }, // graves: T4 soars, TSH crashes
  3: { trhLevel:0.8, tshLevel:0.75, t4Level:0.72, metaLevel:0.75, feedbackStr:0.4 }, // cold: setpoint up
};

let currentLevels = { ...MODES[0] };
let targetLevels = { ...MODES[0] };

function setMode(m) {
  mode = m;
  targetLevels = { ...MODES[m] };
  document.querySelectorAll('.abtn').forEach(b => b.classList.remove('active'));
  ['btnNormal','btnHypo','btnGraves','btnCold'][m].classList && document.getElementById(['btnNormal','btnHypo','btnGraves','btnCold'][m]).classList.add('active');
}

document.getElementById('btnNormal').addEventListener('click', () => setMode(0));
document.getElementById('btnHypo').addEventListener('click', () => setMode(1));
document.getElementById('btnGraves').addEventListener('click', () => setMode(2));
document.getElementById('btnCold').addEventListener('click', () => setMode(3));

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME==='dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME==='light' ? 0xeef1f6 : 0x0d1017);
}
function applyLang() {
  htmlEl.lang = LANG==='en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG==='en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG==='en' ? '中' : 'EN';
  document.title = L('激素负反馈调节 · 3D 原理动画', 'Hormone Negative Feedback · 3D Animation');
  buildStepsClean();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME==='dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME); applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG==='zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG); applyLang();
});

const elPlay = document.getElementById('play');
elPlay.addEventListener('click', () => {
  playing = !playing;
  elPlay.textContent = playing ? L('暂停','Pause') : L('播放','Play');
});
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1)+'×'; });
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
elScrub.addEventListener('input', () => { progress = parseInt(elScrub.value)/1000; });
addEventListener('keydown', e => { if (e.code==='Space') { e.preventDefault(); elPlay.click(); } });

// Particle path helpers
function ptOnPortal(t) { // hypo -> pit
  const y = lerp(HYPO_Y-1.0, PIT_Y+0.7, t);
  return new THREE.Vector3(0.5 + 0.3*Math.sin(t*Math.PI), y, 0.3*Math.sin(t*Math.PI*2));
}
function ptOnSystemic(t) { // pit -> thyroid
  const y = lerp(PIT_Y-0.7, THYROID_Y+0.9, t);
  return new THREE.Vector3(0.5 + 0.3*Math.sin(t*Math.PI), y, 0.3*Math.sin(t*Math.PI*2));
}
function ptOnFeedbackPit(t) { // thyroid -> pit (feedback)
  const y = lerp(THYROID_Y+0.9, PIT_Y-0.7, t);
  return new THREE.Vector3(-0.5 - 0.35*Math.sin(t*Math.PI), y, -0.3*Math.sin(t*Math.PI*2));
}
function ptOnFeedbackHypo(t) { // pit -> hypo (feedback)
  const y = lerp(PIT_Y+0.7, HYPO_Y-1.0, t);
  return new THREE.Vector3(-0.5 - 0.3*Math.sin(t*Math.PI), y, -0.2*Math.sin(t*Math.PI*2));
}

const clock = new THREE.Clock();

function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min(clock.getDelta(), 0.1);
  wallT += dt;
  if (playing) {
    progress = (progress + dt * speed * 0.04) % 1;
  }

  // Smooth level transitions
  const lerpK = 1 - Math.pow(0.02, dt);
  for (const k of Object.keys(currentLevels)) {
    currentLevels[k] = lerp(currentLevels[k], targetLevels[k], lerpK);
  }

  const { trhLevel, tshLevel, t4Level, metaLevel, feedbackStr } = currentLevels;

  // Pulse for TRH (pulsatile every ~60-90s, simulated)
  const trhPulse = trhLevel * (0.7 + 0.3*Math.sin(wallT*0.8));
  const nTrh = Math.round(trhPulse * 20);
  trhMesh.count = nTrh;
  for (let i = 0; i < nTrh; i++) {
    const t = ((wallT*0.35 + i/nTrh) % 1);
    const p = ptOnPortal(t);
    dummy.position.copy(p);
    dummy.scale.setScalar(1);
    dummy.rotation.set(0,0,0);
    dummy.updateMatrix();
    trhMesh.setMatrixAt(i, dummy.matrix);
  }
  trhMesh.instanceMatrix.needsUpdate = true;

  const nTsh = Math.round(tshLevel * 22);
  tshMesh.count = nTsh;
  for (let i = 0; i < nTsh; i++) {
    const t = ((wallT*0.28 + i/Math.max(nTsh,1)) % 1);
    const p = ptOnSystemic(t);
    dummy.position.copy(p);
    dummy.scale.setScalar(1);
    dummy.rotation.set(0,0,0);
    dummy.updateMatrix();
    tshMesh.setMatrixAt(i, dummy.matrix);
  }
  tshMesh.instanceMatrix.needsUpdate = true;

  const nT4 = Math.round(t4Level * 22);
  t4Mesh.count = nT4 * 2;
  for (let i = 0; i < nT4; i++) {
    const t = ((wallT*0.22 + i/Math.max(nT4,1)) % 1);
    const p = ptOnFeedbackPit(t);
    dummy.position.copy(p);
    dummy.scale.setScalar(1); dummy.rotation.set(0,0,0);
    dummy.updateMatrix();
    t4Mesh.setMatrixAt(i, dummy.matrix);
  }
  for (let i = 0; i < nT4; i++) {
    const t = ((wallT*0.20 + i/Math.max(nT4,1)) % 1);
    const p = ptOnFeedbackHypo(t);
    dummy.position.copy(p);
    dummy.scale.setScalar(1); dummy.rotation.set(0,0,0);
    dummy.updateMatrix();
    t4Mesh.setMatrixAt(nT4+i, dummy.matrix);
  }
  t4Mesh.instanceMatrix.needsUpdate = true;

  // Graves autoantibodies (gold octahedra approaching thyroid)
  const nAb = mode === 2 ? 10 : 0;
  abMesh.count = nAb;
  for (let i = 0; i < nAb; i++) {
    const t = ((wallT*0.18 + i/10) % 1);
    const angle = (i/10)*Math.PI*2;
    const r = lerp(5, 1.2, t);
    dummy.position.set(r*Math.cos(angle), THYROID_Y + r*0.3*Math.sin(angle+wallT*0.2), r*0.4*Math.sin(angle));
    dummy.rotation.set(wallT+i, wallT*0.7, 0);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    abMesh.setMatrixAt(i, dummy.matrix);
  }
  abMesh.instanceMatrix.needsUpdate = true;

  // Feedback glow (red inhibition rings when T4 high)
  fbGlowHypo.material.opacity = feedbackStr * 0.45 * (0.7 + 0.3*Math.sin(wallT*2));
  fbGlowPit.material.opacity = feedbackStr * 0.45 * (0.7 + 0.3*Math.sin(wallT*2+1));
  fbGlowHypo.rotation.z = wallT*0.3;
  fbGlowPit.rotation.z = -wallT*0.3;

  // Gland glow based on activity
  hypoMesh.material.emissiveIntensity = 0.2 + trhLevel*0.6;
  pitMesh.material.emissiveIntensity = 0.2 + tshLevel*0.6;
  [thyLeft, thyRight, thyIsthmus].forEach(m => {
    m.material.emissiveIntensity = 0.15 + t4Level*0.75;
  });

  // Stats update
  const trhV = (trhLevel * 4).toFixed(1);
  const tshV = (tshLevel * 10).toFixed(1);
  const t4V = Math.round(t4Level * 160);
  const metaV = Math.round(50 + metaLevel * 100);
  document.getElementById('stTRH').textContent = trhV;
  document.getElementById('barTRH').style.width = (trhLevel*100)+'%';
  document.getElementById('stTSH').textContent = tshV;
  document.getElementById('barTSH').style.width = (tshLevel*100)+'%';
  document.getElementById('stT4').textContent = t4V;
  document.getElementById('barT4').style.width = (t4Level*100)+'%';
  document.getElementById('stMeta').textContent = metaV+'%';
  document.getElementById('barMeta').style.width = (metaLevel*100)+'%';

  const noteEl = document.getElementById('stateNote');
  const tagEl = document.getElementById('stateTag');
  if (mode===1) {
    noteEl.textContent = L('甲减：TSH↑↑ T4↓，甲状腺无法应答', 'Hypothyroidism: TSH↑↑ T4↓, thyroid fails to respond');
    tagEl.textContent = L('甲减','Hypothyroidism');
    tagEl.style.color = '#f87171'; tagEl.style.borderColor = 'rgba(248,113,113,.5)';
  } else if (mode===2) {
    noteEl.textContent = L('Graves：抗体模拟 TSH→T4↑↑↑，TSH 被完全抑制', "Graves': antibody mimics TSH → T4↑↑↑, TSH suppressed to zero");
    tagEl.textContent = L('Graves 甲亢','Graves Hyperthyroidism');
    tagEl.style.color = '#fb923c'; tagEl.style.borderColor = 'rgba(251,146,60,.5)';
  } else if (mode===3) {
    noteEl.textContent = L('寒冷刺激：设定值上调，TRH 脉冲加强', 'Cold: setpoint raised, TRH pulse amplitude increases');
    tagEl.textContent = L('寒冷应激','Cold stress');
    tagEl.style.color = '#60a5fa'; tagEl.style.borderColor = 'rgba(96,165,250,.5)';
  } else {
    noteEl.textContent = L('正常：HPT 轴在设定值附近稳定震荡', 'Normal: HPT axis oscillates stably around setpoint');
    tagEl.textContent = L('正常','Normal');
    tagEl.style.color = '#4ade80'; tagEl.style.borderColor = 'rgba(74,222,128,.5)';
  }

  // Step highlight
  let si = Math.floor(progress * STEPS_DATA.length);
  si = clamp(si, 0, STEPS_DATA.length-1);
  if (si !== lastStep) {
    lastStep = si;
    document.querySelectorAll('#steps li').forEach((li,i) => li.classList.toggle('on', i===si));
  }
  elScrub.value = Math.round(progress*1000);
  elScrubVal.textContent = Math.round(progress*100)+'%';

  controls.update();
  renderer.render(scene, camera);
}

applyTheme(); applyLang();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
requestAnimationFrame(frame);
</script>
</body>
</html>
