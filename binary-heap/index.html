<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>二叉堆与优先队列 · 数组里的树</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 40%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #inVal{font:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--hover);
    border:1px solid var(--tool-border);border-radius:8px;padding:5px 8px;width:86px}
  #formula{margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--text2);
    border-top:1px dashed var(--panel-border);padding-top:7px}
  #formula b{color:var(--text3);font-weight:600}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="title">
  <h1 data-zh="二叉堆与优先队列 · 数组里的树" data-en="Binary Heap & Priority Queue · A Tree Living in an Array">二叉堆与优先队列 · 数组里的树</h1>
  <div class="sub" data-zh="完全二叉树不配指针直接住进数组：父 i、子 2i/2i+1；插入看气泡一路上浮，取顶看尾元素换顶后一路下沉，都只要 O(log n)；Dijkstra/A* 的后台引擎 · 拖动旋转 / 空格运行/暂停" data-en="A complete binary tree lives in a bare array: parent i, children 2i/2i+1; watch insert bubble up and extract-max sink down, both O(log n); the engine behind Dijkstra/A* · drag to orbit / Space = run/pause">完全二叉树不配指针直接住进数组：父 i、子 2i/2i+1；插入看气泡一路上浮，取顶看尾元素换顶后一路下沉，都只要 O(log n)；Dijkstra/A* 的后台引擎 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具 / 主题 / 语言 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const qs=new URLSearchParams(location.search);
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.01,200);
camera.position.set(0,2.2,25);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.6,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=80;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.9));
const keyL=new THREE.DirectionalLight(0xffffff,0.9);keyL.position.set(4,8,6);scene.add(keyL);
const grid=new THREE.GridHelper(40,40,0x2a3340,0x1c232c);
grid.position.y=-6.6;scene.add(grid);

/* ============ 布局 ============ */
function treeSlot(i){ /* 完全二叉树槽位 */
  const d=Math.floor(Math.log2(i+1)),idx=i+1-(1<<d),cnt=1<<d;
  return new THREE.Vector3((idx+0.5)/cnt*16-8,6.2-d*2.05,0);
}
const arraySlot=i=>new THREE.Vector3((i-7)*1.0,-4.6,3.4);
const shelfSlot=j=>new THREE.Vector3(-8+j*0.85,-4.6,-3.6);

/* ============ 堆数据 ============ */
let arr=[],heapSize=0,swaps=0,shelfN=0;
const nodeObjs=[];   // 与 arr 平行：每值的球体（值标签是球的子对象）
let gen=null,evTimer=0,curText='',labelsOn=true;
const sphereGeo=new THREE.SphereGeometry(0.4,18,14);
const C_BASE=0x3f6f96,C_CMP=0xffd43b,C_SW=0xffa94d;
const tweens=[];     // 按对象管理补间，同对象新补间替换旧补间
function tweenTo(obj,to,dur){
  for(let i=tweens.length-1;i>=0;i--)if(tweens[i].obj===obj)tweens.splice(i,1);
  tweens.push({obj,from:obj.position.clone(),to:to.clone(),t:0,dur});
}
const allCss=[];     // 所有受「标签」开关控制的 CSS2D 对象
function makeSphere(v,idx){
  const m=new THREE.Mesh(sphereGeo,new THREE.MeshBasicMaterial({color:C_BASE}));
  m.position.copy(treeSlot(idx));
  const d1=document.createElement('div');d1.className='lbl b';d1.textContent=v;
  const l1=new CSS2DObject(d1);l1.position.set(0,0.58,0);m.add(l1);
  const d2=document.createElement('div');d2.className='lbl';d2.textContent='i='+idx;
  const l2=new CSS2DObject(d2);l2.position.set(0,-0.58,0);m.add(l2);
  allCss.push(l1,l2);
  scene.add(m);
  return {mesh:m,valLbl:d1,idxLbl:d2};
}
function refreshCells(){
  /* 数组格子标签与明暗随堆状态同步 */
  for(let i=0;i<CAP;i++){
    const inHeap=i<heapSize;
    cellValDivs[i].textContent=inHeap?String(arr[i]):'·';
    cellCss[i*2].visible=inHeap;
    cellMats[i].opacity=inHeap?0.85:0.18;
  }
}
const CAP=15;
/* 数组格子（固定 15 个）：cellCss[i*2]=值标签对象, cellCss[i*2+1]=下标标签对象 */
const cellMats=[],cellValDivs=[],cellCss=[];
const cellGeo=new THREE.BoxGeometry(0.78,0.78,0.78);
for(let i=0;i<CAP;i++){
  const mat=new THREE.MeshBasicMaterial({color:0x2c4a63,transparent:true,opacity:0.85});
  const m=new THREE.Mesh(cellGeo,mat);
  m.position.copy(arraySlot(i));scene.add(m);cellMats.push(mat);
  const dv=document.createElement('div');dv.className='lbl b';
  const ov=new CSS2DObject(dv);ov.position.copy(arraySlot(i)).add(new THREE.Vector3(0,0.65,0));
  scene.add(ov);
  const di=document.createElement('div');di.className='lbl';di.textContent='['+i+']';
  const oi=new CSS2DObject(di);oi.position.copy(arraySlot(i)).add(new THREE.Vector3(0,-0.65,0));
  scene.add(oi);
  cellValDivs.push(dv);cellCss.push(ov,oi);allCss.push(ov,oi);
}
/* 有序区标签 */
const shelfLblDiv=document.createElement('div');shelfLblDiv.className='lbl g';
const shelfLbl=new CSS2DObject(shelfLblDiv);shelfLbl.position.set(-8,-3.5,-3.6);scene.add(shelfLbl);
allCss.push(shelfLbl);

/* 父子连线：每帧跟随球体位置 */
const edgeGeo=new THREE.BufferGeometry();
const edgePos=new Float32Array((CAP-1)*6);
edgeGeo.setAttribute('position',new THREE.BufferAttribute(edgePos,3).setUsage(THREE.DynamicDrawUsage));
const edges=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:0x51617a,transparent:true,opacity:0.8}));
edges.frustumCulled=false;scene.add(edges);

function swapArr(a,b){
  [arr[a],arr[b]]=[arr[b],arr[a]];
  const na=nodeObjs[a],nb=nodeObjs[b];
  nodeObjs[a]=nb;nodeObjs[b]=na;
  na.mesh.userData.to=treeSlot(a);nb.mesh.userData.to=treeSlot(b);
  tweenTo(na.mesh,treeSlot(a),0.45/Math.max(speedK,0.2));
  tweenTo(nb.mesh,treeSlot(b),0.45/Math.max(speedK,0.2));
  na.idxLbl.textContent='i='+a;nb.idxLbl.textContent='i='+b;
  swaps++;refreshCells();
}
function setHi(list,color){
  for(const o of nodeObjs)o.mesh.material.color.setHex(C_BASE);
  for(const i of list)if(nodeObjs[i])nodeObjs[i].mesh.material.color.setHex(color);
}

/* ============ 操作生成器（真实 sift-up / sift-down） ============ */
function* genSiftUp(i){
  while(i>0){
    const p=(i-1)>>1;
    curText=L(`比较 arr[${i}]=${arr[i]} 与父 arr[${p}]=${arr[p]}`,
      `compare arr[${i}]=${arr[i]} with parent arr[${p}]=${arr[p]}`);
    yield{t:'cmp',a:[i,p]};
    if(arr[i]>arr[p]){
      curText=L(`大于父 → 交换，继续上浮`,'greater than parent → swap, keep rising');
      swapArr(i,p);
      yield{t:'swap',a:[i,p]};
      i=p;
    }else{curText=L('不大于父 → 停在这一层','not greater → stop at this level');break;}
  }
  yield{t:'end'};
}
function* genSiftDown(i){
  while(true){
    const l=2*i+1,r=2*i+2;let m=i;
    if(l<heapSize){
      curText=L(`比较 arr[${i}]=${arr[i]} 与左子 arr[${l}]=${arr[l]}`,`compare arr[${i}] with left child arr[${l}]`);
      yield{t:'cmp',a:[i,l]};
      if(arr[l]>arr[m])m=l;
    }
    if(r<heapSize){
      curText=L(`较大者 arr[${m}] 再与右子 arr[${r}]=${arr[r]} 比`,`larger arr[${m}] vs right child arr[${r}]`);
      yield{t:'cmp',a:[m,r]};
      if(arr[r]>arr[m])m=r;
    }
    if(m===i)break;
    curText=L('子更大 → 交换下沉','child is larger → swap and sink');
    swapArr(i,m);
    yield{t:'swap',a:[i,m]};
    i=m;
  }
  yield{t:'end'};
}
function* genInsert(v){
  if(heapSize>=CAP){curText=L('堆满了（演示上限 15）','heap full (demo cap 15)');yield{t:'end'};return;}
  arr[heapSize]=v;nodeObjs[heapSize]=makeSphere(v,heapSize);heapSize++;
  curText=L(`新元素 ${v} 先放到尾部 arr[${heapSize-1}]`,`new ${v} lands at tail arr[${heapSize-1}]`);
  refreshCells();
  yield{t:'cmp',a:[heapSize-1]};
  yield* genSiftUp(heapSize-1);
}
function* genExtract(){
  if(heapSize===0){curText=L('堆已空','heap empty');yield{t:'end'};return;}
  curText=L('最大值与尾元素对调','swap max with last element');
  yield{t:'cmp',a:[0,heapSize-1]};
  swapArr(0,heapSize-1);
  yield{t:'swap',a:[0,heapSize-1]};
  /* 尾部（原顶）出列进有序区 */
  const out=nodeObjs.pop();arr.pop();heapSize--;
  shelfN++;
  out.mesh.material.color.setHex(0x74d896);
  out.idxLbl.textContent='✓';
  tweenTo(out.mesh,shelfSlot(shelfN-1),0.6/Math.max(speedK,0.2));
  curText=L(`最大值 ${out.valLbl.textContent} 进入有序区`,`max ${out.valLbl.textContent} joins the sorted shelf`);
  refreshCells();
  yield{t:'pop'};
  yield* genSiftDown(0);
}
function* genBuildHeap(){
  /* 自底向上：从最后一个非叶节点 ⌊n/2⌋−1 逐个下沉，总代价 O(n) */
  for(let i=(heapSize>>1)-1;i>=0;i--){
    curText=L(`对 arr[${i}]（最后一个非叶节点起）下沉`,`sift-down arr[${i}] (from last non-leaf up)`);
    yield{t:'cmp',a:[i]};
    yield* genSiftDown(i);
  }
  yield{t:'end'};
}
function* genHeapsort(){
  yield* genBuildHeap();
  while(heapSize>1)yield* genExtract();
  curText=L('堆排序完成：有序区从左到右升序','heapsort done: shelf reads ascending');
  yield{t:'end'};
}
function fillRandom(k){
  resetHeap(true);
  for(let i=0;i<k;i++){
    const v=5+Math.floor(Math.random()*95);
    arr.push(v);nodeObjs.push(makeSphere(v,i));heapSize++;
  }
  refreshCells();
}
function resetHeap(keepShelf){
  gen=null;
  for(const o of nodeObjs){
    o.mesh.children.forEach(ch=>{const ix=allCss.indexOf(ch);if(ix>=0)allCss.splice(ix,1);});
    scene.remove(o.mesh);
  }
  nodeObjs.length=0;arr=[];heapSize=0;swaps=0;curText='';
  if(!keepShelf){shelfN=0;}
  refreshCells();
}
function loadDemo(){
  resetHeap(false);
  /* 经典最大堆示例：90/70/80/30/20/50/60 */
  for(const v of [90,70,80,30,20,50,60]){arr.push(v);nodeObjs.push(makeSphere(v,heapSize));heapSize++;}
  refreshCells();
}

/* ============ 事件执行 ============ */
function execEvent(ev){
  if(ev.t==='cmp')setHi(ev.a,C_CMP);
  else if(ev.t==='swap')setHi(ev.a,C_SW);
  else if(ev.t==='pop'){/* 球体补间已在生成器中启动 */}
  else if(ev.t==='end')setHi([],C_BASE);
}

/* ============ UI / 步骤 ============ */
const elS=document.getElementById('stSize'),elH=document.getElementById('stH'),
      elSw=document.getElementById('stSw'),elOp=document.getElementById('stOp');
function updateStats(){
  elS.innerHTML=heapSize+'<small> / '+CAP+'</small>';
  elH.innerHTML=heapSize?(Math.floor(Math.log2(heapSize))+1)+'<small> 层</small>':'—';
  elSw.textContent=swaps;
  elOp.textContent=curText||'—';
}
const formulaEl=document.getElementById('formula');
function updateFormula(){
  formulaEl.innerHTML=L(
    `本页对照：最大堆 插入 <b>O(log n)</b> · 取顶 <b>O(log n)</b> · 看顶 <b>O(1)</b>；`+
    `有序数组 插入 O(n) · 取顶 O(1)；无序数组 插入 O(1) · 取顶 O(n)；自底向上建堆 Σh·n/2^(h+1) = <b>O(n)</b>`,
    `here: max-heap insert <b>O(log n)</b> · extract <b>O(log n)</b> · peek <b>O(1)</b>; `+
    `sorted array insert O(n) / max O(1); unsorted array insert O(1) / max O(n); bottom-up build Σh·n/2^(h+1) = <b>O(n)</b>`);
}
const STEPS=[
  {zh:'完全二叉树住进数组：父 i ↔ 子 2i、2i+1，不用任何指针',en:'A complete tree lives in an array: parent i, children 2i, 2i+1 — no pointers',
   act:()=>{loadDemo();curText=L('上：树视图 · 下：数组视图，同一种东西','top: tree view · bottom: array view — one thing');}},
  {zh:'最大堆性质：父 ≥ 子，最大值永远躺在顶部 arr[0]',en:'Max-heap invariant: parent ≥ child, the max always sits at arr[0]',
   act:()=>{loadDemo();setHi([0],C_CMP);curText=L('顶元素 arr[0] 就是全局最大','arr[0] is the global max');}},
  {zh:'插入：新元素放尾部，与父比较、大则交换，一路上浮 O(log n)',en:'Insert: place at tail, compare with parent, bubble up — O(log n)',
   act:()=>{loadDemo();const v=clamp(+document.getElementById('inVal').value||77,1,99);gen=genInsert(v);evTimer=0;playing=true;syncPlay();}},
  {zh:'取顶：顶与尾对调、尾收尾，新顶一路下沉换位 O(log n)',en:'Extract: swap top/tail, pop, then the new top sinks — O(log n)',
   act:()=>{gen=genExtract();evTimer=0;playing=true;syncPlay();}},
  {zh:'自底向上建堆：从最后一个非叶节点逐个下沉，总计只要 O(n)',en:'Build-heap: sift down from the last non-leaf — O(n) overall',
   act:()=>{fillRandom(12);gen=genBuildHeap();evTimer=0;playing=true;syncPlay();}},
  {zh:'堆排序：建堆 + 反复取顶，最大值一个个滚进有序区',en:'Heapsort: build then extract repeatedly — maxes roll onto the shelf',
   act:()=>{if(heapSize<2)fillRandom(10);gen=genHeapsort();evTimer=0;playing=true;syncPlay();}},
  {zh:'谁在用：Dijkstra / A* 每步都要「当前最小」——优先队列就是堆',en:'Who uses it: Dijkstra / A* need "current best" every step — that queue is a heap',
   act:()=>{curText=L('Dijkstra 取距离最小、A* 取 f 最小，都是 O(log n) 的 extract','Dijkstra pops min-dist, A* pops min-f — both O(log n) extracts');}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.zh,s.en)}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;s.act();syncSteps();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}

let playing=true,speedK=1;
function syncPlay(){playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('btnIns').addEventListener('click',()=>{
  const v=clamp(+document.getElementById('inVal').value||77,1,99);
  gen=genInsert(v);evTimer=0;playing=true;syncPlay();
});
document.getElementById('btnPop').addEventListener('click',()=>{gen=genExtract();evTimer=0;playing=true;syncPlay();});
document.getElementById('btnBuild').addEventListener('click',()=>{fillRandom(12);gen=genBuildHeap();evTimer=0;playing=true;syncPlay();});
document.getElementById('btnSort').addEventListener('click',()=>{if(heapSize<2)fillRandom(10);gen=genHeapsort();evTimer=0;playing=true;syncPlay();});
document.getElementById('btnReset').addEventListener('click',()=>{loadDemo();});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
});
const playBtn=document.getElementById('play');
playBtn.addEventListener('click',()=>{playing=!playing;syncPlay();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playBtn.click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x0f1113:0xf1efec);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  playBtn.textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps();updateFormula();
  shelfLblDiv.textContent=L('有序区（取顶出来就排队）','sorted shelf (extracted maxes line up)');
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  /* 惰性推进生成器：每个事件停留 0.5s/speed */
  if(playing&&gen){
    evTimer+=dt;
    if(evTimer>0.5/Math.max(speedK,0.05)){
      evTimer=0;
      const r=gen.next();
      if(r.done){gen=null;setHi([],C_BASE);}
      else execEvent(r.value);
    }
  }
  /* 补间 */
  for(let i=tweens.length-1;i>=0;i--){
    const t=tweens[i];t.t+=dt;
    const k=clamp(t.t/t.dur,0,1),e=1-Math.pow(1-k,3);
    t.obj.position.lerpVectors(t.from,t.to,e);
    if(k>=1)tweens.splice(i,1);
  }
  /* 父子连线跟随球体 */
  let e=0;
  for(let c=1;c<heapSize;c++){
    const p=(c-1)>>1;
    if(!nodeObjs[c]||!nodeObjs[p])continue;
    const a=nodeObjs[p].mesh.position,b=nodeObjs[c].mesh.position;
    edgePos[e*6]=a.x;edgePos[e*6+1]=a.y;edgePos[e*6+2]=a.z;
    edgePos[e*6+3]=b.x;edgePos[e*6+4]=b.y;edgePos[e*6+5]=b.z;
    e++;
  }
  edgeGeo.setDrawRange(0,e*2);
  edgeGeo.attributes.position.needsUpdate=true;
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const o of allCss)o.visible=labelsOn;
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ============ 初始化 ============ */
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(qs.get('speed')){document.getElementById('sSpd').value=qs.get('speed');speedK=+qs.get('speed')/100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';}
applyTheme();applyLang();loadDemo();syncPlay();start();
</script>
</body>
