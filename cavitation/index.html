<style>
  :root, :root[data-theme="dark"] {

    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }

    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }

  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;

    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);

    transition: border-color .15s, color .15s, background .15s; }
  .mbtn:hover { border-color: var(--acc); color: var(--text); }
  .mbtn.on { border-color: rgba(59,201,219,.65); background: rgba(59,201,219,.12); color: var(--text); }
  :root[data-theme="light"] .mbtn.on { border-color: rgba(11,114,133,.55); background: rgba(11,114,133,.10); }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }

  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }

  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }

  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;

    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #08222a; }

  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;

  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);

  @media (max-width: 900px) { #stats { display: none; } }

    #panel { width: calc(100vw - 36px); max-height: 55vh; }

</style>

<div id="title">
  <h1 data-zh="空化与超空泡:低压把水撕开,塌缩是微型水锤" data-en="Cavitation & Supercavitation: Low Pressure Tears Water Open">空化与超空泡:低压把水撕开,塌缩是微型水锤</h1>
  <div class="sub" data-zh="螺旋桨叶尖划得快,背面局部压强跌破汽化压(2.3 kPa),水当场「沸腾」成气泡;流到高压区又被周围的水压瘪——塌缩的微射流以百米每秒戳向桨叶,一颗气泡就是一次微型水锤,几百小时把钢叶打成海绵。空化数 σ=(p∞−pv)/½ρv² 是唯一的判据:拉转速 σ 降、加深下潜 σ 升。反过来「驯服」它:给空化通气体,气泡长成整件「气泡袍」裹住鱼雷——湿面积近乎归零,Shkval 水下 100 m/s · 时间放慢 ×30 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A propeller tip moves so fast that suction-side pressure falls below vapor pressure (2.3 kPa) and the water boils in place; drift into higher pressure and the surrounding water crushes the bubble — its collapse micro-jet stabs the blade at hundreds of m/s, one bubble = one miniature water hammer, turning steel into a sponge over hundreds of hours. The cavitation number σ = (p∞−pv)/½ρv² is the whole story: more rpm lowers σ, more depth raises it. Or tame it: feed the cavity gas until a full vapor shroud wraps the torpedo — wetted area vanishes, Shkval runs 100 m/s underwater · time slowed ×30 · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">空化与超空泡:低压把水撕开,塌缩是微型水锤</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x14364a, 24, 64);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x14364a : 0xc9e4ef);
  scene.fog.color = new THREE.Color(dark ? 0x14364a : 0xc9e4ef);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('空化与超空泡 · 低压把水撕开,塌缩是微型水锤', 'Cavitation & Supercavitation · Low Pressure Tears Water Open');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  syncSliderLabels();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
  drawPlot();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 300);
camera.position.set(5.5, 3.4, 9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.5, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 45;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xbdd3ea, 0x3a4048, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 9, 7);
scene.add(key);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3,
    emissive: color, emissiveIntensity: 0.05, transparent: true, ...opts });
}

/* ================= 常量 / 状态 ================= */
const RHO = 1000, G = 9.81, P_VAP = 2339, P_ATM = 101325;
let MODE = 'prop';                                   // prop | torp
let RPM = 400, DEPTH = 3;                            // 桨:转速、潜深(等效)
let THRUST = 150, TORP_V = 8, GAS_ON = false;        // 雷推力 kN、速度 m/s、通气
let cavityT = 0, pits = 0, tGlob = 0;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 4);
let spinOn = qsBool('spin', true);
const setPlayLabel = () => { document.getElementById('play').textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); };
const pInfOf = d => P_ATM + RHO * G * d;
const tipSpeed = () => RPM / 60 * 2 * Math.PI * 0.55;         // 桨半径 0.55 m
const sigmaOf = v => (pInfOf(DEPTH) - P_VAP) / (0.5 * RHO * v * v);
const sigmaProp = () => sigmaOf(tipSpeed());
/* 剥蚀判据:σ<0.30 起始空化;σ<0.12 片状空化(叶尖 σ_0.7R 量级) */
const SEV_I = 0.30, SEV_S = 0.12;
const sevProp = () => clamp((SEV_I - sigmaProp()) / (SEV_I - SEV_S), 0, 1);

/* ================= 模式 A:螺旋桨试验段 ================= */
const gProp = new THREE.Group();
scene.add(gProp);
const propG = new THREE.Group();
const PROP_SCALE = 1.45;
propG.scale.setScalar(PROP_SCALE);
gProp.add(propG);
const PIT_N = 260;
let pitIM = null;
{
  /* 水箱 */
  const tank = new THREE.Mesh(new THREE.BoxGeometry(11, 5.6, 5.2),
    mat(0x7fc4dd, { opacity: 0.10, roughness: 0.1, side: THREE.DoubleSide }));
  tank.position.x = 0.5;
  gProp.add(tank);
  gProp.add(new THREE.BoxHelper(tank, 0x46626f));
  /* 轴+电机 */
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 5.6, 12), mat(0x8a94a6, { opacity: 1 }));
  shaft.rotation.z = Math.PI / 2;

const CDA_WET = 0.22, CDA_CAV = 0.042, TORP_M = 2700;

const dragCav = v => 0.5 * RHO * v * v * CDA_CAV;

function stepTorp(dt) {
  const F = THRUST * 1000;
  const D = dragNow();
  const a = (F - D) / TORP_M;
  TORP_V = clamp(TORP_V + a * dt * 2.2, 0, 130);

  const sig = sigmaOf(Math.max(TORP_V, 1));

  cavityT = lerp(cavityT, target, clamp(dt * 1.8, 0, 1));
  envelope.visible = cavityT > 0.02;
  envelope.scale.set(3.2 + cavityT * 1.4, 0.44 + cavityT * 0.10, 0.44 + cavityT * 0.10);
  envelope.material.opacity = 0.10 + cavityT * 0.10;
  /* 不通气高速时的空化起始气泡 */

  }
}

  btnAct.textContent = L(btnAct.dataset.zh, btnAct.dataset.en);
  btnPre.textContent = L(btnPre.dataset.zh, btnPre.dataset.en);
  setGasBtn();
  syncSliderLabels();
  setLegend();
  updateFormula();
  drawPlot();
}
document.getElementById('mProp').addEventListener('click', () => setMode('prop'));
document.getElementById('mTorp').addEventListener('click', () => setMode('torp'));

/* ================= 曲线图 ================= */
const plotCv = document.getElementById('plotCv');
const plotTitle = document.getElementById('plotTitle');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const pad = 20, padB = 24;
  ctx.strokeStyle = 'rgba(128,150,170,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, 8); ctx.lineTo(pad, H - padB); ctx.lineTo(W - 12, H - padB); ctx.stroke();
  ctx.font = '16px system-ui';
  if (MODE === 'prop') {
    plotTitle.textContent = L('空化数 σ vs 转速(当前潜深)· 红区=空化', 'σ vs rpm (at current depth) · red = cavitation');
    const xOf = r => pad + (r - 200) / 1200 * (W - pad - 12);
    const yOf = s => 8 + (1 - clamp(s / 2.2, 0, 1)) * (H - padB - 10);
    /* 红区:σ<0.6 */
    ctx.fillStyle = 'rgba(255,107,107,.10)';
    ctx.fillRect(pad, yOf(SEV_I), W - pad - 12, H - padB - yOf(SEV_I));
    ctx.strokeStyle = '#3bc9db'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let r = 200; r <= 1400; r += 30) {
      const s = sigmaOf(r / 60 * 2 * Math.PI * 0.55);
      const x = xOf(r), y = yOf(s);
      r === 200 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2; ctx.setLineDash([7, 6]);
    ctx.beginPath(); ctx.moveTo(pad, yOf(SEV_I)); ctx.lineTo(W - 12, yOf(SEV_I)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ff8787';
    ctx.fillText(L('σ=0.30 起始', 'σ=0.30 onset'), W - 140, yOf(SEV_I) - 6);
    const sNow = sigmaProp();
    ctx.fillStyle = sNow < SEV_I ? '#ff6b6b' : '#ffd43b';
    ctx.beginPath(); ctx.arc(xOf(RPM), yOf(sNow), 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = cTxt;
    ctx.fillText('1400', xOf(1400) - 24, H - 6);
    ctx.fillText(L('rpm · 现在 σ=' + sNow.toFixed(2), 'rpm · now σ=' + sNow.toFixed(2)), pad + 8, 26);
  } else {
    plotTitle.textContent = L('阻力 vs 雷速 · 红=全湿 绿=超空泡 · 虚线=当前推力', 'drag vs speed · red wetted, green cavity · dashed = thrust');
    const vMax = 130, dMax = 900;
    const vOf = v => pad + v / vMax * (W - pad - 12);
    const dOf2 = d => H - padB - clamp(d / dMax, 0, 1) * (H - padB - 10);
    const curve = (fn, color) => {
      ctx.strokeStyle = color; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let v = 0; v <= vMax; v += 4) {
        const d = fn(v);
        const x = vOf(v), y = dOf2(d);
        v === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    };
    curve(dragWet, '#ff6b6b');
    curve(dragCav, '#51cf66');
    /* 推力线 */
    ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 2; ctx.setLineDash([7, 6]);
    const yt = dOf2(THRUST * 1000);
    ctx.beginPath(); ctx.moveTo(pad, yt); ctx.lineTo(W - 12, yt); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffd43b';
    ctx.fillText(L(`F=${THRUST} kN`, `F=${THRUST} kN`), W - 108, yt - 6);
    /* 工作点 */
    ctx.fillStyle = GAS_ON ? '#51cf66' : '#ff6b6b';
    ctx.beginPath(); ctx.arc(vOf(TORP_V), dOf2(dragNow()), 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = cTxt;
    ctx.fillText(L(`v=${TORP_V.toFixed(0)} m/s`, `v=${TORP_V.toFixed(0)} m/s`), vOf(TORP_V) - 20, dOf2(dragNow()) - 14);
    ctx.fillText('m/s', W - 30, H - 6);
  }
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const s1 = document.getElementById('s1'), s1Val = document.getElementById('s1Val');
const s2 = document.getElementById('s2'), s2Val = document.getElementById('s2Val');
const stSig = document.getElementById('stSig'), stTip = document.getElementById('stTip'),
  stPit = document.getElementById('stPit'), stS = document.getElementById('stS');
const formulaEl = document.getElementById('formula');
function syncSliders() {
  if (MODE === 'prop') {
    s1.value = RPM; s1Val.textContent = RPM.toFixed(0) + ' rpm';
    s2.value = DEPTH; s2Val.textContent = DEPTH.toFixed(0) + ' m';
  } else {
    s1.value = THRUST; s1Val.textContent = THRUST.toFixed(0) + ' kN';
    s2.value = Math.round(TORP_V); s2Val.textContent = TORP_V.toFixed(0) + ' m/s';
  }
}
function updateFormula() {
  if (MODE === 'prop') {
    const sig = sigmaProp();
    formulaEl.innerHTML = L(
      `σ = (p∞−pv)/½ρv_tip² = (${((pInfOf(DEPTH) - P_VAP) / 1000).toFixed(0)}k)/(500×${tipSpeed().toFixed(0)}²) = <b>${sig.toFixed(2)}</b><br>` +
      (sig >= SEV_I ? 'σ ≥ 0.30:干净流动' : sig >= SEV_S ? '0.12–0.30:起始空化,叶尖冒泡' : 'σ < 0.12:片状空化,剥蚀加速 ⚠'),
      `σ = (p∞−pv)/½ρv_tip² = (${((pInfOf(DEPTH) - P_VAP) / 1000).toFixed(0)}k)/(500×${tipSpeed().toFixed(0)}²) = <b>${sig.toFixed(2)}</b><br>` +
      (sig >= SEV_I ? 'σ ≥ 0.30: clean flow' : sig >= SEV_S ? '0.12–0.30: incipient, tips fizz' : 'σ < 0.12: sheet cavitation, fast erosion ⚠'));
  } else {
    formulaEl.innerHTML = L(
      `D = ½ρv²·(C_dA):全湿 <b>${CDA_WET.toFixed(2)}</b> → 超空泡 <b>${CDA_CAV.toFixed(2)}</b>(只剩空化器)<br>` +
      `平衡速度 ∝ √(F/C_dA):同推力 ${THRUST} kN,${(Math.sqrt(THRUST * 2000 / (RHO * CDA_CAV))).toFixed(0)} m/s vs ${(Math.sqrt(THRUST * 2000 / (RHO * CDA_WET))).toFixed(0)} m/s`,
      `D = ½ρv²·(C_dA): wetted <b>${CDA_WET.toFixed(2)}</b> → cavity <b>${CDA_CAV.toFixed(2)}</b> (cavitator only)<br>` +
      `terminal speed ∝ √(F/C_dA): at ${THRUST} kN, ${(Math.sqrt(THRUST * 2000 / (RHO * CDA_CAV))).toFixed(0)} m/s vs ${(Math.sqrt(THRUST * 2000 / (RHO * CDA_WET))).toFixed(0)} m/s`);
  }
}
s1.addEventListener('input', () => {
  if (MODE === 'prop') RPM = +s1.value;
  else THRUST = +s1.value;
  syncSliders(); updateFormula(); drawPlot();
});
s2.addEventListener('input', () => {
  if (MODE === 'prop') DEPTH = +s2.value;
  else TORP_V = +s2.value;
  syncSliders(); updateFormula(); drawPlot();
});
document.getElementById('btnAct').addEventListener('click', () => {
  if (MODE === 'prop') { RPM = 1200; syncSliders(); updateFormula(); drawPlot(); }
  else { GAS_ON = !GAS_ON; setGasBtn(); updateFormula(); drawPlot(); }
});
document.getElementById('btnPreset').addEventListener('click', () => {
  if (MODE === 'prop') { DEPTH = 300; RPM = 1200; syncSliders(); updateFormula(); drawPlot(); }
  else { THRUST = 150; TORP_V = 0; GAS_ON = true; syncSliders(); setGasBtn(); updateFormula(); drawPlot(); }
});
document.getElementById('btnReset').addEventListener('click', () => {
  if (MODE === 'prop') { RPM = 400; DEPTH = 3; pits = 0; updatePits(); }
  else { THRUST = 150; TORP_V = 8; GAS_ON = false; cavityT = 0; }
  syncSliders(); setGasBtn(); updateFormula(); drawPlot();
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = spinOn;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, statsAcc = 0, spawnAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * (playing ? speed : 0);
  tGlob += dt0;
  if (dt > 0) {
    if (MODE === 'prop') {
      propG.rotation.x += RPM / 60 * 2 * Math.PI * dt / 30;   // 慢镜头 ×30
      stepStreams(dt, 0.8 + RPM / 2000 * 1.6);
      stepBubbles(dt, sevProp());
    } else {
      stepTorp(dt);
      stepStreams(dt, -(0.4 + TORP_V * 0.03));      // 雷体坐标系:水从机头流向机尾
      stepBubbles(dt, 0);
    }
    drawBubbles();
  }
  statsAcc += dt0;
  if (statsAcc > 0.15) {
    statsAcc = 0;
    if (MODE === 'prop') {
      const sig = sigmaProp();
      stSig.textContent = sig.toFixed(2);
      stSig.className = 'v ' + (sig < SEV_S ? 'bad' : sig < SEV_I ? 'warn' : 'ok');
      stTip.textContent = tipSpeed().toFixed(0) + ' m/s';
      stPit.textContent = pits + ' / ' + PIT_N;
      stS.textContent = sig >= SEV_I ? L('干净流动', 'clean flow') : sig >= SEV_S ? L('起始空化 ⚠', 'incipient ⚠') : L('片状空化·剥蚀中 ⚠', 'sheet · eroding ⚠');
      stS.className = 'v ' + (sig >= SEV_I ? 'ok' : sig >= SEV_S ? 'warn' : 'bad');
    } else {
      const sig = sigmaOf(Math.max(TORP_V, 1));
      stSig.textContent = sig.toFixed(2);
      stSig.className = 'v ' + (cavityT > 0.5 ? 'ok' : sig < 0.4 ? 'bad' : 'ok');
      stTip.textContent = TORP_V.toFixed(0) + ' m/s';
      stPit.textContent = GAS_ON ? L('湿面 ~4%', 'wet ~4%') : L('湿面 100%', 'wet 100%');
      stS.textContent = GAS_ON ? (cavityT > 0.5 ? L('超空泡巡航', 'supercavitating') : L('气泡袍生长中', 'shroud growing'))
        : (sig < 0.4 ? L('表面空化噪声 ⚠', 'surface fizzing ⚠') : L('全湿航行', 'fully wetted'));
      stS.className = 'v ' + (GAS_ON && cavityT > 0.5 ? 'ok' : !GAS_ON && sig < 0.4 ? 'bad' : 'ok');
    }
    updateFormula();
    drawPlot();
  }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
{
  const m = qs.get('mode');
  if (m === 'prop' || m === 'torp') MODE = m;
}
RPM = clamp(qsFloat('rpm', 400), 200, 1400);
DEPTH = clamp(qsFloat('depth', 3), 2, 300);
THRUST = clamp(qsFloat('f', 150), 40, 300);
TORP_V = clamp(qsFloat('v', 8), 0, 60);
GAS_ON = qsBool('gas', false);
setPlayLabel();
buildSteps();
applyTheme();
setMode(MODE);
applyLang();
syncSliders();
start();
</script>
