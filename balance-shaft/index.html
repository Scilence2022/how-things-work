<style>

  <h1 data-zh="平衡轴与往复惯性" data-en="Balance Shafts &amp; Shaking Forces">平衡轴与往复惯性</h1>
  <div class="sub" data-zh="旋转质量的惯性力是个旋转矢量,曲柄上加一块对置配重就能当场对消;活塞加连杆小端的往复惯性 F=m r ω²(cosθ+λcos2θ) 只沿缸轴方向砸,一根旋转配重怎么转都对消不了——两根对转轴镜像布置,水平分量互抵、竖直分量叠加,才吃掉一阶力;直列四缸曲柄互抵一阶,却留下四个同相的二阶惯性,高转速四缸靠 2 倍转速双平衡轴(保时捷/本田)压掉 · 拖动旋转 / 空格运行/暂停" data-en="Rotating-mass inertia is a rotating vector — one counterweight opposite the crank pin cancels it on the spot; the reciprocating inertia of piston plus small end, F = m r ω²(cosθ + λcos2θ), only hammers along the cylinder axis and no single spinning weight can cancel it — two mirror-image counter-rotating shafts cancel each other's horizontal parts and add vertically, eating the first order; an inline-four's crank cancels the first order but leaves four in-phase second-order pulses, so rev-happy fours fit twin balance shafts at twice crank speed (Porsche/Honda) · drag to orbit / Space = run/pause">旋转质量的惯性力是个旋转矢量,曲柄上加一块对置配重就能当场对消;活塞加连杆小端的往复惯性 F=m r ω²(cosθ+λcos2θ) 只沿缸轴方向砸,一根旋转配重怎么转都对消不了——两根对转轴镜像布置,水平分量互抵、竖直分量叠加,才吃掉一阶力;直列四缸曲柄互抵一阶,却留下四个同相的二阶惯性,高转速四缸靠 2 倍转速双平衡轴(保时捷/本田)压掉 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(8.6,4.1,11.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.15,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:曲柄滑块装在弹性机脚上;曲轴沿 X,缸轴沿 Y ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const CRANK2=1.7,RCV=0.55,LROD2=1.7,UX=[-1.95,-0.65,0.65,1.95];
const MREC=0.55,MROT=0.25,RCR=0.035,LAM=0.30;   /* 往复/旋转质量 kg,曲柄半径 m,λ=r/L */
const colM=new THREE.MeshStandardMaterial({color:0x3a3f4b,roughness:0.7});
const base=new THREE.Mesh(new THREE.BoxGeometry(7.4,0.14,3.4),colM);base.position.y=0.07;scene.add(base);
/* 弹性机脚:4 根螺旋弹簧 */
const springM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.35,metalness:0.7});
function springGeo(){const pts=[];
  for(let j=0;j<=72;j++){const t=j/72,a=t*Math.PI*10;
    pts.push(new THREE.Vector3(0.11*Math.cos(a),t*0.81,0.11*Math.sin(a)));}
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),96,0.035,6);}
const springs=[];
for(let j=0;j<4;j++){
  const sp=new THREE.Mesh(springGeo(),springM);
  sp.position.set((j<2?-1:1)*1.5,0.14,(j%2?1:-1)*0.85);
  scene.add(sp);springs.push(sp);
}
/* 发动机整体(机脚以上):晃动时整体平移 */
const blockG=new THREE.Group();scene.add(blockG);
const blockM=new THREE.MeshStandardMaterial({color:0x5f6b7c,roughness:0.5,metalness:0.5,
  transparent:true,opacity:0.42});
const block=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,1.9),blockM);
block.position.y=CRANK2;blockG.add(block);
const guideM=new THREE.MeshStandardMaterial({color:0x8fd0e8,transparent:true,opacity:0.16,
  roughness:0.2,side:THREE.DoubleSide,depthWrite:false});
const guides=[];
for(let i=0;i<4;i++){
  const g=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,1.95,28,1,true),guideM);
  g.position.set(UX[i],3.525,0);blockG.add(g);guides.push(g);
}
/* 曲轴:主轴颈+每缸曲柄臂/配重/曲柄销,1、4 缸朝上,2、3 缸朝下 */
const crankG=new THREE.Group();crankG.position.y=CRANK2;blockG.add(crankG);
const shaftM=new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.25,metalness:0.85});
const webM=new THREE.MeshStandardMaterial({color:0x76829a,roughness:0.4,metalness:0.6});
const mainShaft=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1,14),shaftM);
mainShaft.rotation.z=Math.PI/2;crankG.add(mainShaft);
const unitGs=[];
for(let i=0;i<4;i++){
  const dir=(i===1||i===2)?-1:1,ug=new THREE.Group();ug.position.x=UX[i];crankG.add(ug);
  for(const sx of [-0.26,0.26]){
    const web=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.85,0.4),webM);
    web.position.set(sx,0.18*dir,0);ug.add(web);
    const cw=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.12,20,1,false,dir>0?Math.PI:0,Math.PI),webM);
    cw.rotation.z=Math.PI/2;cw.position.x=sx;ug.add(cw);
  }
  const cpin=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.44,12),shaftM);
  cpin.rotation.z=Math.PI/2;cpin.position.y=RCV*dir;ug.add(cpin);
  unitGs.push(ug);
}
/* 旋转惯性力(红)与曲柄配重(绿)箭头:跟着曲轴转,始终对消 */
const arrM=new THREE.MeshStandardMaterial({color:0xff7b4f,roughness:0.4,emissive:0xff7b4f,emissiveIntensity:0.5});
const okM=new THREE.MeshStandardMaterial({color:0x74dc84,roughness:0.4,emissive:0x2f9e50,emissiveIntensity:0.5});
function makeArrow(mat){
  const g=new THREE.Group();
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1,8),mat);cyl.position.y=0.5;g.add(cyl);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.22,10),mat);cone.position.y=1.0;g.add(cone);
  return g;
}
const arrRot=makeArrow(arrM),arrCW=makeArrow(okM);
unitGs[0].add(arrRot);arrCW.rotation.z=Math.PI;unitGs[0].add(arrCW);
/* 活塞+连杆 ×4 */
const pistM=new THREE.MeshStandardMaterial({color:0xcdd6e0,roughness:0.45,metalness:0.5});
const rodM=new THREE.MeshStandardMaterial({color:0x9aa8b8,roughness:0.35,metalness:0.6});
const pistons=[],rods=[];
for(let i=0;i<4;i++){
  const pg=new THREE.Group();
  const skirt=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.66,26),pistM);pg.add(skirt);
  const crown=new THREE.Mesh(new THREE.CylinderGeometry(0.40,0.40,0.10,26),pistM);
  crown.position.y=0.30;pg.add(crown);
  const wpin=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.36,10),shaftM);
  wpin.rotation.z=Math.PI/2;pg.add(wpin);
  blockG.add(pg);pistons.push(pg);
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.075,LROD2,10),rodM);
  blockG.add(rod);rods.push(rod);
}
/* 两根对转平衡轴:偏心半块+力箭头;相位镜像,水平互抵竖直叠加 */
function shaftUnit(x){
  const g=new THREE.Group();g.position.set(x,1.28,0);blockG.add(g);
  const rod0=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1,10),shaftM);
  rod0.rotation.z=Math.PI/2;g.add(rod0);
  const ws=[];
  for(let i=0;i<4;i++){
    const w=new THREE.Group();
    const half=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.30,0.14,20,1,false,0,Math.PI),webM);
    half.rotation.z=Math.PI/2;w.add(half);
    const a=makeArrow(arrM);a.scale.setScalar(0.55);w.add(a);
    w.userData.arrow=a;g.add(w);ws.push(w);
  }
  return {g,ws};
}
const shL=shaftUnit(-1.65),shR=shaftUnit(1.65);
/* 作用在机体上的合力箭头:竖直(红)+水平(橙) */
const hM=new THREE.MeshStandardMaterial({color:0xffb35c,roughness:0.4,emissive:0xffb35c,emissiveIntensity:0.5});
const arrV=makeArrow(arrM);arrV.position.set(0,4.62,0);blockG.add(arrV);
const arrH=makeArrow(hM);arrH.position.set(0,2.78,0);arrH.rotation.z=-Math.PI/2;blockG.add(arrH);

/* 状态 */
let mode='single',rpm=1800,kBal=0,wrong=false,playing=true,labelsOn=true,slowMo=false,arrowsOn=true;
let th=0,simT=0,fvS=0,ampS=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function forces(){/* 惯性力量级用真实 ω;波形用可视减速角 th(教学比例) */
  const w=rpm*2*Math.PI/60;
  const F1=MREC*RCR*w*w/1000,F2=LAM*F1,k=kBal/100;
  let Fv,Fh;
  if(mode==='single'){
    if(wrong){Fv=2*F1*Math.cos(th);Fh=F1*Math.sin(th);}
    else{Fv=(1-k)*F1*Math.cos(th)+F2*Math.cos(2*th);Fh=0;}
  }else{Fv=4*F2*(1-k)*Math.cos(2*th);Fh=0;}
  return {F1,F2,Fv,Fh};
}

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblPist=addLabel(()=>L('往复质量 · F = m r ω²(cosθ+λcos2θ)','Recip mass · F = m r ω²(cosθ + λcos2θ)'),new THREE.Vector3(1.35,4.62,0.35),'y');
const lblCrank=addLabel(()=>L('曲柄配重 · 当场对消旋转力','Crank web · cancels the rotating force'),new THREE.Vector3(0,0.98,1.2),'g');
const lblShafts=addLabel(()=>L('对转平衡轴 ×2 · 水平互抵','Counter-rotating shafts ×2 · horizontal cancels'),new THREE.Vector3(0,0.8,0.55),'o',()=>true,shL.g);
const lblWrong=addLabel(()=>L('错误示范:同向单轴 → 垂直翻倍+水平晃','Wrong: one co-rotating shaft → vertical doubles + side shake'),new THREE.Vector3(0,-0.78,0.55),'r',()=>wrong,shL.g);
const lblMount=addLabel(()=>L('弹性机脚 · 晃幅∝残余力','Elastic mounts · sway ∝ residual force'),new THREE.Vector3(1.75,0.55,1.05),'b');
const lblI4=addLabel(()=>L('直列四缸:一阶互抵 · 二阶同相叠加','Inline-4: 1st order cancels · 2nd order adds in phase'),new THREE.Vector3(0,2.78,1.35),'g',()=>mode==='i4');

function setRpm(v){rpm=clamp(v,600,6000);
  document.getElementById('sRpm').value=rpm;
  document.getElementById('sRpmVal').textContent=rpm.toFixed(0)+' rpm';updateStats();}
function setK(v){kBal=clamp(v,0,100);
  document.getElementById('sK').value=kBal;
  document.getElementById('sKVal').textContent=kBal.toFixed(0)+' %';updateStats();}
function setWrong(v){wrong=v&&mode==='single';
  shR.g.visible=!wrong;
  shL.g.position.x=wrong?-1.65:(mode==='i4'?-3.55:-1.65);
  shR.g.position.x=mode==='i4'?3.55:1.65;
  updateStats();}
function setMode(m){mode=m;
  document.getElementById('bSingle').classList.toggle('on',m==='single');
  document.getElementById('bFour').classList.toggle('on',m==='i4');
  if(m==='i4')wrong=false;
  const i4=m==='i4';
  block.scale.x=i4?7.0:2.7;
  mainShaft.scale.x=i4?7.0:2.9;
  unitGs.forEach((ug,i)=>{ug.position.x=i4?UX[i]:0;ug.visible=i4||i===0;});
  guides.forEach((g,i)=>{g.position.x=i4?UX[i]:0;g.visible=i4||i===0;});
  pistons.forEach((p,i)=>{p.position.x=i4?UX[i]:0;p.visible=i4||i===0;});
  rods.forEach((r,i)=>{r.visible=i4||i===0;});
  shL.g.position.x=wrong?-1.65:(i4?-3.55:-1.65);
  shR.g.position.x=i4?3.55:1.65;shR.g.visible=!wrong;
  [shL,shR].forEach(s=>s.ws.forEach((w,i)=>{
    w.position.x=i4?UX[i]:0;w.visible=i4||i===0;}));
  springs.forEach((sp,j)=>{sp.position.x=(j<2?-1:1)*(i4?3.15:1.5);});
  updateStats();}

const STEPS=[
 {zh:'<b>旋转力好消</b>:曲柄销的旋转惯性是矢量,曲柄反侧加配重就地对消',
  en:'<b>Rotating force is easy</b>: the crank-pin inertia is a vector — a counterweight opposite the pin cancels it',
  act(){setMode('single');setRpm(1200);setK(0);setWrong(false);}},
 {zh:'<b>往复力难消</b>:活塞惯性只沿缸轴上下砸,F=m r ω²(cosθ+λcos2θ),机脚跟着晃',
  en:'<b>Recip force is hard</b>: piston inertia only hammers along the bore, F=m r ω²(cosθ+λcos2θ), mounts sway',
  act(){setRpm(3000);}},
 {zh:'<b>单配重的错误示范</b>:一根同向同相的旋转配重,垂直分量与往复力同向叠加翻倍,水平晃动照旧',
  en:'<b>The wrong demo</b>: one co-rotating in-phase weight — its vertical part adds (doubles) and the side shake stays',
  act(){setWrong(true);setRpm(1800);}},
 {zh:'<b>对转平衡轴(Lanchester)</b>:两根反转轴镜像布置,水平互抵、竖直叠加,一阶全消',
  en:'<b>Lanchester shafts</b>: two mirror counter-rotating shafts — horizontal cancels, vertical adds, first order gone',
  act(){setWrong(false);setK(100);setRpm(2400);}},
 {zh:'<b>直列四缸的天然平衡</b>:1-3-4-2 曲柄互抵一阶;但四个二阶惯性同相,高转速摇振',
  en:'<b>Inline-4 natural balance</b>: the 1-3-4-2 crank cancels the first order; four in-phase 2nd orders still shake',
  act(){setMode('i4');setK(0);setRpm(1800);}},
 {zh:'<b>平衡轴让四缸安静</b>:两根 2 倍转速对转轴(保时捷/本田)把二阶残余也吃掉',
  en:'<b>Shafts quiet the four</b>: twin counter-rotating shafts at 2× speed (Porsche/Honda) eat the 2nd-order residue',
  act(){setK(100);setRpm(3000);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  const {F1,F2}=forces();
  document.getElementById('stRpm').innerHTML=rpm.toFixed(0)+'<small> rpm</small>';
  const f1v=document.getElementById('stF1');
  const r1=mode==='i4'?0:(wrong?2*F1:F1*(1-kBal/100));
  f1v.innerHTML=r1.toFixed(2)+'<small> kN</small>';
  f1v.className='v '+(r1<0.1?'ok':(r1>2?'warn':''));
  const f2v=document.getElementById('stF2');
  const r2=mode==='i4'?4*F2*(1-kBal/100):F2;
  f2v.innerHTML=r2.toFixed(2)+'<small> kN</small>';
  f2v.className='v '+(r2>1.5?'warn':'');
  const av=document.getElementById('stAmp');
  av.innerHTML=ampS.toFixed(2)+'<small> mm</small>';
  av.className='v '+(ampS>0.45?'warn':(ampS<0.15?'ok':''));
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bSingle').addEventListener('click',()=>setMode('single'));
document.getElementById('bFour').addEventListener('click',()=>setMode('i4'));
document.getElementById('sRpm').addEventListener('input',e=>setRpm(+e.target.value));
document.getElementById('sK').addEventListener('input',e=>setK(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglArrows').addEventListener('change',e=>{arrowsOn=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
const v1=new THREE.Vector3(),v2=new THREE.Vector3(),UP=new THREE.Vector3(0,1,0);
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;th+=dts*rpm*0.0035;
  const {F1,F2,Fv,Fh}=forces();
  /* 每缸曲柄连杆:1、4 缸与 2、3 缸互为 180° */
  for(let i=0;i<4;i++){
    if(!(mode==='i4'||i===0))continue;
    const ux=mode==='i4'?UX[i]:0;
    const ti=th+((i===1||i===2)?Math.PI:0);
    const si=Math.sin(ti),ci=Math.cos(ti);
    const py=CRANK2+RCV*ci+Math.sqrt(LROD2*LROD2-RCV*RCV*si*si);
    pistons[i].position.set(ux,py,0);
    v1.set(ux,CRANK2+RCV*ci,RCV*si);v2.set(ux,py,0);
    rods[i].position.copy(v1).add(v2).multiplyScalar(0.5);
    v1.sub(v2).normalize();rods[i].quaternion.setFromUnitVectors(UP,v1.negate());
  }
  crankG.rotation.x=th;
  /* 机脚晃动:水平跟 Fh、竖直下蹲随 |Fv| 均值;弹簧跟着伸缩 */
  fvS+=(Math.abs(Fv)-fvS)*Math.min(1,dts*5);
  blockG.position.x=clamp(0.05*Fh,-0.5,0.5);
  blockG.position.y=-0.028*fvS;
  const bb=0.95+blockG.position.y;
  for(const sp of springs)sp.scale.y=(bb-0.14)/0.81;
  ampS+=(0.5*Math.hypot(Fv,Fh)-ampS)*Math.min(1,dts*5);
  /* 平衡轴相位:单缸 ω 对转镜像;四缸 2ω;错误示范=同向同相单轴 */
  const i4=mode==='i4',k=kBal/100;
  shL.ws.forEach((w,i)=>{
    w.rotation.x=wrong?th:(i4?Math.PI-2*th:Math.PI-th);
    const W=wrong?F1:(i4?k*F2/2:k/2*F1);
    w.userData.arrow.visible=arrowsOn&&(W>0.05);
    const al=clamp(0.25+0.5*W,0.3,1.15);
    w.userData.arrow.scale.set(1,al,1);
  });
  shR.ws.forEach((w,i)=>{
    w.rotation.x=i4?Math.PI+2*th:Math.PI+th;
    const W=i4?k*F2/2:k/2*F1;
    w.userData.arrow.visible=arrowsOn&&(W>0.05);
    const al=clamp(0.25+0.5*W,0.3,1.15);
    w.userData.arrow.scale.set(1,al,1);
  });
  /* 力箭头:曲轴旋转力vs配重(绿),机体合力(红竖/橙横) */
  const w=rpm*2*Math.PI/60,Frot=MROT*RCR*w*w/1000;
  const alR=clamp(0.3+0.5*Frot,0.35,1.6);
  arrRot.scale.set(1,alR,1);arrCW.scale.set(1,alR,1);
  arrRot.visible=arrCW.visible=arrowsOn;
  const alV=clamp(0.25+0.28*Math.abs(Fv),0.3,2.3);
  arrV.visible=arrowsOn&&Math.abs(Fv)>0.06;
  arrV.scale.set(1,alV,1);arrV.rotation.z=Fv>=0?0:Math.PI;
  const alH=clamp(0.2+0.3*Math.abs(Fh),0.28,1.6);
  arrH.visible=arrowsOn&&Math.abs(Fh)>0.06;
  arrH.scale.set(1,alH,1);arrH.rotation.z=Fh>=0?-Math.PI/2:Math.PI/2;
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();setMode('single');
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
