<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注塑成型 · 颗粒进,几十秒出一个零件</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d07a2c;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a35f1e;
    --bg:#f0efed; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 8px 12px 7px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 4px 7px; font-size: 11.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(208,122,44,.65); background: rgba(208,122,44,.14); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(163,95,30,.55); background: rgba(163,95,30,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 15px; }
  #formula { margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 4px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 3px; }
  #steps li { display: flex; gap: 6px; padding: 3px 5px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(208,122,44,.10); border-color: rgba(208,122,44,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(163,95,30,.08); border-color: rgba(163,95,30,.4); }
  #steps .n { flex: 0 0 15px; height: 15px; border-radius: 50%; font-size: 10.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 11px; color: var(--text3); line-height: 1.35; }
  #steps .t b { color: var(--text); font-size: 11px; }
  #steps li.on .t b { color: #f2b077; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center;
    margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  .crow { display: flex; align-items: center; gap: 8px; }
  .crow .ck { font-size: 11.5px; color: var(--text2); flex: 0 0 34px; }
  .crow .cv { font-size: 10.5px; color: var(--text3); flex: 0 0 92px; text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 11.5px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11px; color: var(--text2); }
  #rel a { font-size: 11px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 2px 8px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="注塑成型:颗粒进,几十秒出一个零件" data-en="Injection Molding: Pellets In, a Part Out in Seconds">注塑成型:颗粒进,几十秒出一个零件</h1>
  <div class="sub" data-zh="螺杆旋转把颗粒剪切熔融、边转边后撤蓄料;再像活塞一样以 40–130 MPa 把熔体压进闭模的模腔,前沿以「喷泉流」贴壁冻成皮层;保压喂回收缩、浇口一冻保压失效,冷却后开模顶出——锁模力 = 型腔压力 × 投影面积 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="A rotating screw melts pellets by shear while retracting to store a shot; then it rams forward, forcing melt at 40–130 MPa into the closed cavity; the fountain-flow front freezes into a skin on the walls; holding pressure feeds the shrinkage until the gate freezes, then the mold opens and pins eject — clamp force = cavity pressure × projected area · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">螺杆旋转把颗粒剪切熔融、边转边后撤蓄料;再像活塞一样以 40–130 MPa 把熔体压进闭模的模腔,前沿以「喷泉流」贴壁冻成皮层;保压喂回收缩、浇口一冻保压失效,冷却后开模顶出——锁模力 = 型腔压力 × 投影面积 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="型腔压力" data-en="Cavity pressure">型腔压力</span><span class="v" id="stP">—</span>
  <span class="k" data-zh="熔体温度" data-en="Melt temp">熔体温度</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="螺杆位置" data-en="Screw pos">螺杆位置</span><span class="v" id="stS">—</span>
  <span class="k" data-zh="周期计时" data-en="Cycle time">周期计时</span><span class="v" id="stC">—</span>
  <span class="k" data-zh="状态" data-en="Status">状态</span><span class="v" id="stM">—</span>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip.o" data-zh="熔体" data-en="melt">熔体</span>
    <span class="chip.g" data-zh="皮层=成品" data-en="skin">皮层=成品</span>
    <span class="chip.b" data-zh="水路" data-en="water">水路</span>
    <span class="chip.r" data-zh="缺陷" data-en="defect">缺陷</span>
  </div>
  <div id="actions">
    <button class="abtn on" id="btnNormal" data-zh="正常工艺" data-en="normal cycle">正常工艺</button>
    <button class="abtn" id="btnSink" data-zh="保压不足 → 缩痕" data-en="low holding → sink marks">保压不足 → 缩痕</button>
    <button class="abtn" id="btnShort" data-zh="注射不足 → 缺料" data-en="low injection → short shot">注射不足 → 缺料</button>
    <button class="abtn" id="btnFlash" data-zh="压力过大 → 飞边" data-en="overpressure → flash">压力过大 → 飞边</button>
  </div>
  <div class="row"><label data-zh="注射压力" data-en="Injection p.">注射压力</label><input id="injP" type="range" min="40" max="130" step="5" value="95"><span class="val" id="injPVal">95 MPa</span></div>
  <div class="row"><label data-zh="保压压力" data-en="Holding p.">保压压力</label><input id="holdP" type="range" min="5" max="80" step="5" value="55"><span class="val" id="holdPVal">55 MPa</span></div>
  <div class="row"><label data-zh="螺杆转速" data-en="Screw rpm">螺杆转速</label><input id="rpm" type="range" min="60" max="180" step="10" value="120"><span class="val" id="rpmVal">120 rpm</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="ctrlRows">
      <div class="crow"><span class="ck" data-zh="相位" data-en="Phase">相位</span><input id="phase" type="range" min="0" max="1000" value="0"><span class="cv" id="phaseVal">—</span></div>
      <div class="crow"><span class="ck" data-zh="速度" data-en="Speed">速度</span><input id="speed" type="range" min="5" max="50" value="20"><span class="cv" id="speedVal">2.0×</span></div>
      <div id="toggles">
        <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
        <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
        <label><input id="tglXray" type="checkbox" checked> <span data-zh="模具剖视" data-en="x-ray mold">模具剖视</span></label>
      </div>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../3d-printing/" data-zh="3D 打印" data-en="3D printing">3D 打印</a>
    <a href="../ceramic-sintering/" data-zh="陶瓷烧结" data-en="sintering">陶瓷烧结</a>
    <a href="../glass-vitrification/" data-zh="玻璃化" data-en="vitrification">玻璃化</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = x => clamp(x, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const sm = k => k * k * (3 - 2 * k);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xf0efed : 0x0f1013);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('注塑成型 · 颗粒进,几十秒出一个零件', 'Injection Molding · Pellets In, a Part Out in Seconds');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  updateStats();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.7, 1.7, 3.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.9, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.4;
controls.maxDistance = 12;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(3, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const ground = new THREE.Mesh(new THREE.CylinderGeometry(7, 7.4, 0.12, 48),
  mat(0x23262c, { roughness: 0.95, emissive: 0x000000, opacity: 1 }));
ground.position.y = -0.5;
scene.add(ground);

/* ---------------- 材质 ---------------- */
const frameMat = mat(0x2f3640, { roughness: 0.55, metalness: 0.4, opacity: 1 });
const steelMat = mat(0x9aa8b5, { roughness: 0.3, metalness: 0.85, opacity: 1 });
const steelDark = mat(0x4a545e, { roughness: 0.45, metalness: 0.7, opacity: 1 });

const PILE_N = 46, FALL_N = 16, BAR_N = 14, PEL_N = PILE_N + FALL_N + BAR_N;
const pelIM = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.016, 0.016, 0.026, 6), pelletMat, PEL_N);

const pelX = new Float32Array(PEL_N), pelY = new Float32Array(PEL_N), pelZ = new Float32Array(PEL_N);
const pelA = new Float32Array(PEL_N), pelV = new Float32Array(PEL_N), pelH = new Uint8Array(PEL_N);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();
const _s = new THREE.Vector3(1, 1, 1), _v = new THREE.Vector3(), _c = new THREE.Color();
const cPel = new THREE.Color(0xe4c393), cMeltP = new THREE.Color(0xff7a26);
function pelRespawn(i) {
  if (i < PILE_N + FALL_N) {           // 落料流
    pelX[i] = -0.05 + (Math.random() - 0.5) * 0.24;
    pelZ[i] = (Math.random() - 0.5) * 0.24;
    pelY[i] = 1.5 + Math.random() * 0.35;
    pelV[i] = 0;
  } else {                             // 料筒内输送
    pelX[i] = -0.52 - Math.random() * 0.18;
    pelA[i] = Math.random() * Math.PI * 2;
    pelV[i] = 0.07 + Math.random() * 0.05;
  }
}
for (let i = 0; i < PEL_N; i++) {
  if (i < PILE_N) {                    // 料斗内静止料堆
    pelY[i] = 1.0 + Math.random() * 0.34;
    const ry = 0.07 + (pelY[i] - 0.95) / 0.5 * 0.23;
    const r = Math.sqrt(Math.random()) * Math.max(ry - 0.035, 0.01);
    const a = Math.random() * Math.PI * 2;
    pelX[i] = -0.05 + Math.cos(a) * r;
    pelZ[i] = Math.sin(a) * r;
    _e.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    _q.setFromEuler(_e);
    _m.compose(_v.set(pelX[i], pelY[i], pelZ[i]), _q, _s);
    pelIM.setMatrixAt(i, _m);
  } else {
    pelH[i] = 1;
    pelRespawn(i);
  }
  _c.copy(cPel).offsetHSL(0, 0, (Math.random() - 0.5) * 0.1);
  pelIM.setColorAt(i, _c);
}

/* ---------------- 全局仿真状态 ---------------- */
let injP = clamp(qsFloat('injp', 95), 40, 130);
let holdP = clamp(qsFloat('holdp', 55), 5, 80);
let rpm = clamp(qsFloat('rpm', 120), 60, 180);
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 2), 0.5, 5);
let labelsOn = qsBool('labels', true);
let simTime = 0, cycleN = 1;
let gPhase = 0, gK = 0, fFill = 0, fillStopped = false, sinkDepth = 0, gapV = 0, pinsV = 0;
let moldOffV = 0, pCav = 0, Tshow = 240, retract = 0.08, Fnow = 0, partMode = 0, partFallK = 0;
let TfillG = 2, fMaxG = 1;
function calcFill() { TfillG = clamp(2.2 * 90 / injP, 0.6, 6); fMaxG = Math.min(1, 3 / TfillG); }
calcFill();
function defectMode() {
  if (injP >= 112) return 'flash';
  if (fMaxG < 0.995) return 'short';
  if (holdP <= 30) return 'sink';
  return 'normal';
}

/* ---------------- 相位机(周期 20–40 s 量级) ---------------- */
const PH = [
  { k: 'close', dur: () => 1.5 },
  { k: 'charge', dur: () => clamp(9 * 120 / rpm, 3.5, 12) },
  { k: 'inject', dur: () => 3 },
  { k: 'hold', dur: () => 5 },
  { k: 'cool', dur: () => 7 },
  { k: 'open', dur: () => 3 },
];
const PHN = ['合模锁模', '塑化蓄料', '高压注射充型', '保压补缩', '冷却·浇口冻结', '开模顶出'];
const PHE = ['clamp & lock', 'plasticize & charge', 'inject & fill', 'pack & hold', 'cool & gate freeze', 'open & eject'];
function total() { let s = 0; for (const p of PH) s += p.dur(); return s; }
function phaseStart(i) { let a = 0; for (let j = 0; j < i; j++) a += PH[j].dur(); return a; }

/* 由 t 纯推导整场状态(可任意拖相位) */
function derive(t) {
  const T = total();
  t = clamp(t, 0, T);
  let acc = 0, pi = 0, k = 0;
  for (let i = 0; i < PH.length; i++) {
    const d = PH[i].dur();
    if (t < acc + d || i === PH.length - 1) { pi = i; k = clamp01((t - acc) / d); break; }
    acc += d;
  }
  gPhase = pi; gK = k;
  moldOffV = 0; pinsV = 0; partMode = 0; partFallK = 0;
  pCav = 0; sprueFrozen = false; fFill = 0; fillStopped = false;
  sinkDepth = 0;
  const dm = defectMode();
  switch (pi) {
    case 0:                                    // 合模锁模
      moldOffV = OPEN * (1 - sm(k));
      retract = 0.08;
      Tshow = 240;                             // 料筒内熔体已就绪
      Fnow = injP * A_PROJ * 1000;
      break;
    case 1:                                    // 塑化蓄料:旋转+后撤
      retract = 0.08 + 0.77 * k;
      Tshow = 200 + 40 * k;                    // 新料混入降温,剪切再热回 240
      Fnow = 0;
      break;
    case 2: {                                  // 高压注射充型
      const fillProg = clamp01(k * 3 / TfillG);
      fFill = Math.min(fillProg, fMaxG);
      retract = 0.85 - 0.77 * fillProg;
      pCav = injP * (0.15 + 0.85 * fFill);
      Tshow = 240;
      Fnow = 0;
      break;
    }
    case 3:                                    // 保压补缩
      fFill = fMaxG;
      retract = 0.08 - 0.03 * k;
      pCav = holdP;
      sinkDepth = holdP < 30 ? (1 - holdP / 30) * clamp01(k / 2.5) : 0;
      Tshow = 240;
      Fnow = holdP * A_PROJ * 1000;
      break;
    case 4:                                    // 冷却·浇口冻结
      fFill = fMaxG;
      retract = 0.05;
      pCav = k < 0.35 ? holdP * (1 - k / 0.35) : 0;
      sprueFrozen = k > 0.45;
      Tshow = 240 - 185 * sm(k);
      sinkDepth = holdP < 30 ? (1 - holdP / 30) : 0;
      break;
    case 5:                                    // 开模顶出
      fFill = fMaxG;
      moldOffV = OPEN * sm(k);
      retract = 0.05;
      Tshow = 55;
      sinkDepth = holdP < 30 ? (1 - holdP / 30) : 0;
      pinsV = 0.12 * clamp01((k - 0.35) / 0.3);
      if (k > 0.65) { partMode = 2; partFallK = k - 0.65; } else partMode = 1;
      break;
  }
  gapV = injP >= 112 ? 0.02 * clamp01((fFill - 0.75) / 0.25) : 0;
  if (pi >= 2 && pi <= 4) moldOffV += gapV;
  fillStopped = fMaxG < 0.995 && pi >= 2 && fFill >= fMaxG - 0.003;

  /* 应用到场景 */
  moldB.position.x = moldOffV;
  const rodL = clamp(3.25 - (2.35 + moldOffV), 0.02, 0.95);
  rodM.scale.y = rodL;
  rodM.position.set((2.35 + moldOffV + 3.25) / 2, AXIS_Y, 0);
  for (const p of pins) p.position.x = 2.01 - pinsV;
  ejPlate.position.x = 2.16 - pinsV;
  screwG.position.x = -retract;
  const headFace = 0.96 - retract;
  const poolL = Math.max(1.06 - headFace, 0.02);
  poolM.scale.y = poolL;
  poolM.position.set(headFace + poolL / 2, AXIS_Y, 0);

  partG.position.x = pi < 5 ? 0 : (partMode === 1 ? moldOffV - pinsV : moldOffV - 0.12);
  partG.position.y = partMode === 2 ? AXIS_Y - Math.min(12 * partFallK * partFallK, 0.94) : AXIS_Y;
  coreM.scale.set(Math.max(fFill, 0.001), 1, Math.max(fFill, 0.001));
  coreM.visible = fFill > 0.004;
  capA.scale.set(Math.max(fFill, 0.001), Math.max(fFill, 0.001), 1);
  capB.scale.copy(capA.scale);
  capA.visible = capB.visible = fFill > 0.01;
  const hubF = clamp01((fFill * R_CAV - 0.18) / (R_HUB - 0.18));
  const hubLen = 1 - 0.32 * sinkDepth;
  hubM.scale.set(Math.max(hubF, 0.001), hubLen, Math.max(hubF, 0.001));
  hubM.position.x = XB + HUB_H * hubLen / 2;
  hubM.visible = hubF > 0.02;
  craterM.position.x = XB + HUB_H * hubLen - 0.003;
  craterM.material.opacity = sinkDepth * 0.85;
  craterM.visible = sinkDepth > 0.05 && hubF > 0.5;
  frontT.scale.set(Math.max(fFill, 0.001), Math.max(fFill, 0.001), 1);
  frontT.visible = pi === 2 && fFill > 0.02 && fFill < 0.995;
  shortFront.scale.set(Math.max(fMaxG, 0.001), Math.max(fMaxG, 0.001), 1);
  shortFront.visible = fillStopped;
  finG.position.x = PX + gapV / 2;
  finSide.scale.y = gapV + 0.004;
  finRingA.position.x = -(gapV / 2 + 0.002);
  finRingB.position.x = gapV / 2 + 0.002;
  finG.visible = gapV > 0.0015;
  sprueM.visible = pi >= 2;
  const melting = pi === 2 || pi === 3 || (pi === 4 && !sprueFrozen);
  sprueMat.emissiveIntensity = melting ? 0.55 : 0.06;
  sprueMat.color.setHex(melting ? 0xff8c3a : 0xb07038);
  hubMat.emissiveIntensity = pi === 4 ? 0.3 * (1 - k) : (pi >= 2 ? 0.3 : 0.25);
}

addLabel(() => L('浇口冻结 · 保压失效', 'gate frozen · holding lost'), v3(1.5, AXIS_Y + 0.32, 0.3), 'b', () => gPhase === 4 && gK > 0.5);
addLabel(() => L(`锁模力 F = p·A ≈ ${Fnow.toFixed(0)} kN`, `clamp F = p·A ≈ ${Fnow.toFixed(0)} kN`), v3(3.25, AXIS_Y + 0.92, 0), 'st', () => gPhase === 0 || gPhase === 3);
addLabel(() => L('顶针顶出', 'ejector pins'), v3(1.82, AXIS_Y + 0.5, 0.3), 'g', () => gPhase === 5 && gK > 0.3);
addLabel(() => L('缩痕:厚壁处补缩不足,表面凹陷', 'sink mark: thick section starved, surface dips'), v3(XB + 0.12, AXIS_Y + 0.44, 0), 'r', () => sinkDepth > 0.12);
const lblShort = addLabel(() => L(`缺料:充型仅 ${(fMaxG * 100) | 0}%`, `short shot: only ${(fMaxG * 100) | 0}% filled`), v3(PX, 1.18, -0.1), 'r', () => fillStopped && gPhase < 5);
addLabel(() => L('飞边:压力撑开模具,熔体挤入分型面', 'flash: pressure cracks the mold open, melt squeezes out'), v3(PX + 0.02, AXIS_Y - 0.68, 0.15), 'r', () => gapV > 0.004);
addLabel(() => L('厚壁盘 Ø80×10 mm · 中心浇口', 'thick disc Ø80×10 mm · center gate'), v3(PX + 0.35, AXIS_Y - 0.8, 0), 'st', () => gPhase >= 2);

/* ---------------- 讲解步骤 ---------------- */
function resetPart() { partG.position.set(0, AXIS_Y, 0); }
function restart() { simTime = 0; resetPart(); playing = true; setPlayLabel(); }
const STEPS = [
  { b: '合模锁模', be: 'Clamp & lock',
    d: '动模压紧定模,锁模力 F = p·A ≈ 95 MPa × 50 cm² ≈ 480 kN;不足 → 涨模飞边。',
    de: 'Lock F = p·A ≈ 95 MPa × 50 cm² ≈ 480 kN must beat cavity pressure; too weak → flash.',
    act: () => { simTime = 0; resetPart(); playing = true; setPlayLabel(); } },
  { b: '塑化蓄料', be: 'Plasticize & charge',
    d: '颗粒入槽,螺杆旋转剪切熔融(240 °C),边转边后撤蓄料 85 mm。',
    de: 'The rotating screw shear-melts the pellets (240 °C), retracting to store an 85 mm shot.',
    act: () => { simTime = phaseStart(1); resetPart(); playing = true; setPlayLabel(); } },
  { b: '高压注射 · 喷泉流', be: 'Inject · fountain flow',
    d: '螺杆如活塞把熔体以 40–130 MPa 压入型腔;前沿「喷泉流」翻向模壁冻成皮层。',
    de: 'The screw rams melt in at 40–130 MPa; the fountain-flow front freezes into a skin on the walls.',
    act: () => { simTime = phaseStart(2); resetPart(); playing = true; setPlayLabel(); } },
  { b: '保压补缩', be: 'Pack & hold',
    d: '保压(≈注射压力之半)持续喂料补缩;不足则厚壁处凹陷——缩痕。',
    de: 'Holding ≈ half the injection pressure keeps feeding shrinkage; too little → sink marks.',
    act: () => { simTime = phaseStart(3); resetPart(); playing = true; setPlayLabel(); } },
  { b: '冷却 · 浇口冻结', be: 'Cool · gate freeze',
    d: '浇口一冻保压失效;水道把 240 °C 降到 60 °C,冷却占周期一半以上。',
    de: 'Gate freezes, holding ends; channels cool 240 → 60 °C — over half the cycle.',
    act: () => { simTime = phaseStart(4); resetPart(); playing = true; setPlayLabel(); } },
  { b: '开模顶出', be: 'Open & eject',
    d: '动模后退,顶针推落零件;一模 20–40 s,循环往复。',
    de: 'Moving half retreats, pins eject the part; one shot every 20–40 s.',
    act: () => { simTime = phaseStart(5); resetPart(); playing = true; setPlayLabel(); } },
  { b: '缺陷三连对照', be: 'Defect trio',
    d: '保压低→缩痕;压力低→缺料;超 112 MPa→飞边。点上方按钮对照。',
    de: 'Low holding → sink marks; low pressure → short shot; past 112 MPa → flash. Try the buttons above.',
    act: () => { restart(); } },
];
function stepIndex() {
  const dm = defectMode();
  if (dm !== 'normal' && gPhase >= 2) return 6;
  return gPhase;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { s.act(); });
    el.appendChild(li);
  });
}

/* ---------------- UI ---------------- */
const elPlay = document.getElementById('play');
const elInj = document.getElementById('injP'), elInjVal = document.getElementById('injPVal');
const elHold = document.getElementById('holdP'), elHoldVal = document.getElementById('holdPVal');
const elRpm = document.getElementById('rpm'), elRpmVal = document.getElementById('rpmVal');
const elPhase = document.getElementById('phase'), elPhaseVal = document.getElementById('phaseVal');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const stP = document.getElementById('stP'), stT = document.getElementById('stT'), stS = document.getElementById('stS'),
  stC = document.getElementById('stC'), stM = document.getElementById('stM');
const formulaEl = document.getElementById('formula');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setToggleBtns() {
  const dm = defectMode();
  document.getElementById('btnNormal').classList.toggle('on', dm === 'normal');
  document.getElementById('btnSink').classList.toggle('on', dm === 'sink');
  document.getElementById('btnShort').classList.toggle('on', dm === 'short');
  document.getElementById('btnFlash').classList.toggle('on', dm === 'flash');
}
function syncSliders() {
  elInj.value = injP; elInjVal.textContent = injP + ' MPa';
  elHold.value = holdP; elHoldVal.textContent = holdP + ' MPa';
  elRpm.value = rpm; elRpmVal.textContent = rpm + ' rpm';
  elSpeed.value = Math.round(speed * 10); elSpeedVal.textContent = speed.toFixed(1) + '×';
}
function updateFormula() {
  const kn = (injP * A_PROJ * 1000).toFixed(0), tf = (injP * A_PROJ * 1000 / 9.81).toFixed(0);
  let s;
  switch (gPhase) {
    case 0:
      s = L(`锁模力 F = p·A = ${injP} MPa × 50 cm² ≈ <b>${kn} kN</b>(≈ ${tf} t)· 扛不住 → 涨模飞边`,
        `clamp F = p·A = ${injP} MPa × 50 cm² ≈ <b>${kn} kN</b> (≈ ${tf} tf) · too weak → flash`);
      break;
    case 1:
      s = L(`螺杆转速 <b>${rpm} rpm</b> · 蓄料 ${(retract * 100) | 0} mm · 外热 + 剪切 → 熔体 ${Tshow | 0} °C`,
        `screw <b>${rpm} rpm</b> · shot ${(retract * 100) | 0} mm · heat + shear → melt ${Tshow | 0} °C`);
      break;
    case 2:
      s = L(`充型 <b>${(fFill * 100) | 0}%</b> · 填充时间 ≈ ${TfillG.toFixed(1)} s · 前沿速度 ∝ 注射压力`,
        `fill <b>${(fFill * 100) | 0}%</b> · fill time ≈ ${TfillG.toFixed(1)} s · front speed ∝ pressure`);
      break;
    case 3:
      s = L(`保压 <b>${holdP} MPa</b> ≈ ${(holdP / injP * 100) | 0}% 注射压力 · 补收缩、压缩痕`,
        `holding <b>${holdP} MPa</b> ≈ ${(holdP / injP * 100) | 0}% of injection · feeds shrinkage`);
      break;
    case 4:
      s = L(`型件 ${Tshow | 0} °C · 浇口${sprueFrozen ? '已冻结' : '未冻'} · 冷却占周期 > 1/2`,
        `part ${Tshow | 0} °C · gate ${sprueFrozen ? 'frozen' : 'open'} · cooling > 1/2 of cycle`);
      break;
    default:
      s = L(`周期 <b>${total().toFixed(1)} s</b>(典型 20–40 s)· 顶出温度 ≈ 60 °C · 第 ${cycleN} 模`,
        `cycle <b>${total().toFixed(1)} s</b> (typical 20–40 s) · eject ≈ 60 °C · shot #${cycleN}`);
  }
  formulaEl.innerHTML = s;
}
function updateStats() {
  stP.textContent = pCav.toFixed(1) + ' MPa';
  stT.textContent = Tshow.toFixed(0) + ' °C';
  stS.textContent = (retract * 100).toFixed(0) + ' mm';
  stC.textContent = simTime.toFixed(1) + ' / ' + total().toFixed(1) + ' s';
  const dm = defectMode();
  let stTxt = L(`第${cycleN}模 · ${PHN[gPhase]}`, `shot ${cycleN} · ${PHE[gPhase]}`);
  let cls = 'v';
  if (gPhase === 2) stTxt += ` · ${L('充型', 'fill')} ${(fFill * 100) | 0}%`;
  const shortBad = dm === 'short' && fillStopped;
  const flashBad = dm === 'flash' && gapV > 0.003;
  const sinkWarn = dm === 'sink' && gPhase >= 3 && sinkDepth > 0.1;
  if (shortBad) { stTxt += L(' · 缺料 ⚠', ' · short shot ⚠'); cls = 'v bad'; }
  else if (flashBad) { stTxt += L(' · 飞边 ⚠', ' · flash ⚠'); cls = 'v bad'; }
  else if (sinkWarn) { stTxt += L(' · 缩痕 ⚠', ' · sink mark ⚠'); cls = 'v warn'; }
  if (gPhase === 5 && gK > 0.93) { stTxt += L(' · 周期完成 ✓', ' · cycle done ✓'); cls = 'v ok'; }
  stM.textContent = stTxt;
  stM.className = cls;
  if (document.activeElement !== elPhase) {
    elPhase.value = Math.round(simTime / total() * 1000);
    elPhaseVal.textContent = `${L(PHN[gPhase], PHE[gPhase])} · ${simTime.toFixed(1)} s`;
  }
  updateFormula();
  setToggleBtns();
}
elInj.addEventListener('input', () => { injP = +elInj.value; calcFill(); syncSliders(); setToggleBtns(); updateFormula(); });
elHold.addEventListener('input', () => { holdP = +elHold.value; syncSliders(); setToggleBtns(); updateFormula(); });
elRpm.addEventListener('input', () => { rpm = +elRpm.value; syncSliders(); updateFormula(); });
document.getElementById('btnNormal').addEventListener('click', () => {
  injP = 95; holdP = 55; rpm = 120; calcFill(); syncSliders(); setToggleBtns(); restart();
});
document.getElementById('btnSink').addEventListener('click', () => {
  injP = 95; holdP = 12; calcFill(); syncSliders(); setToggleBtns(); restart();
});
document.getElementById('btnShort').addEventListener('click', () => {
  injP = 45; holdP = 55; calcFill(); syncSliders(); setToggleBtns(); restart();
});
document.getElementById('btnFlash').addEventListener('click', () => {
  injP = 130; holdP = 55; calcFill(); syncSliders(); setToggleBtns(); restart();
});
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elPhase.addEventListener('input', () => {
  simTime = (+elPhase.value) / 1000 * total();
  resetPart();
  derive(simTime);
  updateStats();
});
elSpeed.addEventListener('input', () => { speed = (+elSpeed.value) / 10; elSpeedVal.textContent = speed.toFixed(1) + '×'; });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
document.getElementById('tglXray').addEventListener('change', e => {
  const on = e.target.checked;
  moldMat.opacity = on ? 0.28 : 1;
  moldMat.transparent = on;
  moldMat.depthWrite = !on;
  moldMat.needsUpdate = true;
});
if (!qsBool('labels', true)) { document.getElementById('tglLabels').checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, lastStatsT = 0;
function updatePellets(dt) {
  const charging = playing && gPhase === 1 && dt > 0;
  const headFace = 0.96 - retract;
  for (let i = PILE_N; i < PEL_N; i++) {
    if (i < PILE_N + FALL_N) {              // 落料流
      if (pelH[i]) {
        if (charging) { pelH[i] = 0; pelRespawn(i); }
        else { _m.compose(_v.set(0, -10, 0), _q.identity(), _v.set(0.001, 0.001, 0.001)); pelIM.setMatrixAt(i, _m); continue; }
      }
      pelV[i] += 2.5 * dt;
      pelY[i] -= pelV[i] * dt;
      if (pelY[i] < 1.02) {
        if (charging) { pelRespawn(i); } else { pelH[i] = 1; }
      }
      _e.set(pelY[i] * 4, pelY[i] * 3, 0);
      _q.setFromEuler(_e);
      _m.compose(_v.set(pelX[i], pelY[i], pelZ[i]), _q, _s);
      pelIM.setMatrixAt(i, _m);
    } else {                                // 料筒内:输送+熔融变色
      if (pelH[i] || !charging) {
        if (!pelH[i]) pelH[i] = 1;
        _m.compose(_v.set(0, -10, 0), _q.identity(), _v.set(0.001, 0.001, 0.001));
        pelIM.setMatrixAt(i, _m);
        continue;
      }
      pelX[i] += pelV[i] * dt;
      pelA[i] += 7 * dt;
      if (pelX[i] > headFace - 0.06) { pelH[i] = 1; pelIM.setColorAt(i, cMeltP); continue; }
      const meltK = clamp01((pelX[i] + 0.55) / 1.35);
      _c.copy(cPel).lerp(cMeltP, meltK);
      pelIM.setColorAt(i, _c);
      _e.set(pelA[i], 0, 0);
      _q.setFromEuler(_e);
      _m.compose(_v.set(pelX[i], AXIS_Y + Math.cos(pelA[i]) * 0.05, Math.sin(pelA[i]) * 0.05), _q, _s);
      pelIM.setMatrixAt(i, _m);
    }
  }
  pelIM.instanceMatrix.needsUpdate = true;
  if (pelIM.instanceColor) pelIM.instanceColor.needsUpdate = true;
}
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dtSim = dt * (playing ? speed : 0);
  if (playing) {
    simTime += dtSim;
    if (simTime >= total()) { simTime = 0; cycleN++; }
  }
  derive(simTime);
  if (gPhase === 1 && dtSim > 0) screwG.rotation.x -= dtSim * (rpm / 120) * 7;
  const now = performance.now();
  heatMat.emissiveIntensity = 0.7 + 0.25 * Math.sin(now * 0.003);
  waterMat.emissiveIntensity = gPhase === 4 ? 0.55 + 0.3 * Math.sin(now * 0.006) : 0.12;
  updatePellets(dtSim);
  /* 动态标签位置 */
  if (gPhase === 2) lblFountain.position.set(PX + 0.02, AXIS_Y + R_CAV * fFill + 0.16, 0.12);
  if (fillStopped) lblShort.position.set(PX + 0.02, AXIS_Y + R_CAV * fMaxG + 0.14, -0.12);
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  /* stats 节流刷新(~150ms),避免每帧写 DOM */
  if (now - lastStatsT > 150) { lastStatsT = now; updateStats(); }
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ---------------- 初始化 ---------------- */
const tStep = Math.round(qsFloat('t', 0));
if (tStep >= 1 && tStep <= 6) simTime = phaseStart(tStep - 1);
else if (tStep >= 7) simTime = phaseStart(2);
syncSliders();
applyTheme();
applyLang();
derive(simTime);
updateStats();
setPlayLabel();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
