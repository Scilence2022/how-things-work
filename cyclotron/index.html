<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回旋加速器 · 一圈一圈甩出螺旋</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#69db7c;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#2b8a3e;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 372px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotPlots { display: flex; gap: 8px; height: calc(100% - 22px); }
  #plotPlots canvas { flex: 1 1 0; min-width: 0; display: block; }
  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0c2; border-color: rgba(255,169,77,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(105,219,124,.6); background: rgba(105,219,124,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(43,138,62,.55); background: rgba(43,138,62,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(105,219,124,.10); border-color: rgba(105,219,124,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(43,138,62,.08); border-color: rgba(43,138,62,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #d3f9d8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="回旋加速器 · 一圈一圈甩出螺旋" data-en="The Cyclotron · One Frequency, a Growing Spiral">回旋加速器 · 一圈一圈甩出螺旋</h1>
  <div class="sub" data-zh="上下磁轭与励磁线圈造出竖直磁场,把带电粒子弯成圆:磁场只转弯不加速,能量全部来自窄缝里的射频电场——粒子每过缝一次被踢一脚 qV,每圈两脚 2qV,半径按 r=mv/(qB) 一圈圈长大成螺旋。因为回旋频率 f=qB/(2πm) 与速度无关,射频只需锁定一个频率:B=1.5 T 时质子 22.9 MHz,100 kV 缝压下约 37 圈、真实时间 1.6 μs 就把质子送到 6.8 MeV 由偏转板甩出;相对论质量让粒子逐渐迟到,滑相过 90° 就撞壁——这是经典回旋加速器的天花板 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Yokes and coils make a vertical magnetic field that bends charged particles in circles: the field only turns, never accelerates — all energy comes from the RF electric field in the narrow gap. Each crossing kicks qV, two kicks per turn add 2qV, and the radius r=mv/(qB) grows turn by turn into a spiral. Since f=qB/(2πm) ignores speed, the RF locks to one frequency: 22.9 MHz for protons at 1.5 T, reaching 6.8 MeV in about 37 turns — 1.6 microseconds of real time — before the deflector kicks it out; relativistic mass makes the particle late, and past 90 degrees of phase slip it crashes into the wall, the classic cyclotron ceiling · 3D interactive demo · drag to orbit · Space = run/pause">回旋加速器 · 一圈一圈甩出螺旋</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>
<div id="stats">
  <span class="k" data-zh="当前动能" data-en="Kinetic E">当前动能</span><span class="v" id="stKE">—</span>
  <span class="k" data-zh="圈数" data-en="Turns">圈数</span><span class="v" id="stTurns">—</span>
  <span class="k" data-zh="回旋频率" data-en="Cyclotron f">回旋频率</span><span class="v" id="stFreq">—</span>
  <span class="k" data-zh="轨道半径" data-en="Orbit radius">轨道半径</span><span class="v" id="stRad">—</span>
  <span class="k" data-zh="每圈增能 2qV" data-en="Gain / turn">每圈增能 2qV</span><span class="v" id="stGain">—</span>
  <span class="k" data-zh="同步状态" data-en="Sync">同步状态</span><span class="v" id="stSync">—</span>
</div>
<div id="plot">
  <h3 data-zh="左:轨道俯视螺旋 · 右:动能阶梯与过缝相位(橙点=到达时刻,漂移=滑相)" data-en="left: top-view spiral · right: energy staircase & arrival phase (dot drift = slip)">左:轨道俯视螺旋 · 右:动能阶梯与过缝相位(橙点=到达时刻,漂移=滑相)</h3>
  <div id="plotPlots">
    <canvas id="plotCvL"></canvas>
    <canvas id="plotCvR"></canvas>
  </div>
</div>
<div id="panel">
  <div id="legend">
    <span class="chip.g" data-zh="绿:粒子螺旋与过缝闪光" data-en="green: particle spiral & gap flash">绿:粒子螺旋与过缝闪光</span>
    <span class="chip.b" data-zh="蓝:磁体与竖直磁场线" data-en="blue: magnet & vertical field lines">蓝:磁体与竖直磁场线</span>
    <span class="chip.o" data-zh="橙:RF 电源与缝电压" data-en="orange: RF supply & gap voltage">橙:RF 电源与缝电压</span>
    <span class="chip.r" data-zh="红:滑相与撞壁告警" data-en="red: phase slip & wall crash">红:滑相与撞壁告警</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnInject" data-zh="注入粒子" data-en="Inject particle">注入粒子</button>
    <button class="abtn" id="btnDetune" data-zh="失谐演示(RF −6%)" data-en="Detune demo (RF −6%)">失谐演示(RF −6%)</button>
  </div>
  <div class="row"><label data-zh="磁感应强度 B" data-en="Field B">磁感应强度 B</label><input id="sB" type="range" min="0.5" max="2" step="0.05" value="1.5"><span class="val" id="sBVal">1.50 T</span></div>
  <div class="row"><label data-zh="RF 缝电压" data-en="RF gap voltage">RF 缝电压</label><input id="sV" type="range" min="10" max="100" step="5" value="100"><span class="val" id="sVVal">100 kV</span></div>
  <div class="row"><label data-zh="粒子种类" data-en="Particle">粒子种类</label><input id="sPart" type="range" min="0" max="2" step="1" value="0"><span class="val" id="sPartVal">质子</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglField" type="checkbox" checked> <span data-zh="磁场线" data-en="B lines">磁场线</span></label>
      <label><input id="tglTrail" type="checkbox" checked> <span data-zh="轨迹" data-en="Trail">轨迹</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../mass-spectrometry/" data-zh="磁质谱:同一 qB 弯转称质量" data-en="mass spectrometry: the same qB bend, weighing mass">磁质谱:同一 qB 弯转称质量</a>
    <a href="../tokamak-fusion/" data-zh="托卡马克:环形磁场做笼子" data-en="tokamak: magnetic cage in a torus">托卡马克:环形磁场做笼子</a>
    <a href="../motor-generator/" data-zh="电动机与发电机:磁与力的互逆" data-en="motor & generator: magnetism and force reversed">电动机与发电机:磁与力的互逆</a>
    <a href="../laser/" data-zh="激光:谐振腔里的同频共振" data-en="laser: resonance in a cavity">激光:谐振腔里的同频共振</a>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);
/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 24, 72);
let accHex = 0x69db7c;
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  accHex = dark ? 0x69db7c : 0x2b8a3e;
  scene.background = new THREE.Color(dark ? 0x10141b : 0xdde6ee);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xdde6ee);
  groundM.color.setHex(dark ? 0x191c22 : 0xb9c3cd);
  yokeM.color.setHex(dark ? 0x3a414b : 0x9fabb8);
  poleM.color.setHex(dark ? 0x4a525c : 0x8b98a5);
  pipeM.color.setHex(dark ? 0x545c66 : 0x76828f);
  genM.color.setHex(dark ? 0x2f343c : 0x6d7884);
  deeM.color.setHex(dark ? 0x9fd8b0 : 0x4c9e66);
  deeM.opacity = dark ? 0.16 : 0.20;
  deeEdgeM.color.setHex(accHex); fieldM.color.setHex(accHex);
  trailM.color.setHex(accHex); haloM.color.setHex(accHex);
  gapM.color.setHex(accHex); gapLight.color.setHex(accHex);
  srcM.emissive.setHex(dark ? 0x1d5a2c : 0x2b8a3e);
  deflM.emissive.setHex(dark ? 0x1d4830 : 0x2b8a3e);
  plParticle.color.setHex(accHex);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('回旋加速器 · 一圈一圈甩出螺旋', 'The Cyclotron · One Frequency, a Growing Spiral');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels(); buildSteps(); setPlayLabel(); syncSliders(); syncBtns(); updateFormula(); drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});
/* ---------------- 渲染器 / 相机 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);
if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(8.8, 5.6, 10.8);

    d: '半径随动量线性长大,螺旋线就是能量账本:B=1.5 T 把质子送到 0.25 m 出口半径对应 6.8 MeV,用 100 kV 缝压要转 37 圈;真实时间里一圈只有 43.7 ns,37 圈合计 1.6 μs——屏幕上半分钟的螺旋,真空中不到两微秒就走完。',
    de: 'Radius grows linearly with momentum, so the spiral is an energy ledger: at B=1.5 T the 0.25 m exit radius means 6.8 MeV, reached in 37 turns at 100 kV. One turn lasts only 43.7 ns of real time, 37 turns just 1.6 us — the spiral you watch on screen takes under two microseconds in vacuum.',
    act: () => { flyTo([4.6, 8.8, 6.6], [0, 0, 0]); if (mode !== 'fly') inject(); } },
  { b: '失谐的宿命:相对论质量', be: 'The fate of detuning: relativistic mass',
    d: '动能变成质量:m=γm₀,γ=1+KE/(m₀c²),回旋频率跟着掉到 1/γ——粒子开始迟到,过缝相位一圈圈滑移,滑过 90° 就落进减速相位、被反踢回来撞上 D 盒壁。经典机器的天花板 KE≈√(qV·m₀c²):100 kV 缝压下质子约 9.7 MeV,劳伦斯当年正撞在这堵墙上。',
    de: 'Kinetic energy becomes mass: m=γm0 with γ=1+KE/(m0c2), so the revolution frequency sags by 1/γ — the particle runs late, its arrival phase slips turn after turn, and past 90 degrees it lands in the decelerating phase and is kicked backward into the dee wall. The classical ceiling is about KE=sqrt(qV·m0c2): 9.7 MeV for protons at 100 kV — the wall Lawrence himself hit.',
    act: () => { eta = 0.94; inject(); flyTo([5.6, 3.2, 6.4], [0.3, 0, 0.3]); notify('失谐演示开启:RF 偏 −6%,看粒子几圈内滑相撞壁', 'detune demo on: RF shifted −6%, watch the beam slip and crash within a few turns'); } },
  { b: '从回旋到同步', be: 'From cyclotron to synchrotron',
    d: '出路有两条:让射频频率跟着粒子掉(同步回旋加速器),或让磁场随半径增强、轨道频率不变(等时场,今天商用回旋加速器都用它)。劳伦斯与利文斯通 1931 年用 11 英寸机器把质子推过 1.22 MeV,1939 年劳伦斯获诺贝尔奖;同一谐振加速思想放大到 LHC 的 26.7 km 环上,质子被送到 6.8 TeV。',
    de: 'Two ways out: let the RF frequency follow the particle down (synchrocyclotron), or strengthen the field with radius so the orbit frequency stays fixed (isochronous fields, used by every commercial cyclotron today). Lawrence and Livingston pushed protons past 1.22 MeV with an 11-inch machine in 1931, and the 1939 Nobel Prize followed; the same resonant idea, scaled to the 26.7 km LHC ring, delivers protons at 6.8 TeV.',
    act: () => { eta = 1; inject(); flyTo([12.8, 8.4, 14.6], [0, 0.4, 0]); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}
/* ================= 绘图:左俯视螺旋 / 右动能阶梯+相位 ================= */
const cvL = document.getElementById('plotCvL'), cvR = document.getElementById('plotCvR');
function plotColors() {
  const css = getComputedStyle(document.documentElement);
  return { acc: css.getPropertyValue('--acc').trim() || '#69db7c', txt: css.getPropertyValue('--text2').trim() || '#9fb0c3' };
}
function drawPlotL() {
  const ctx = cvL.getContext('2d');
  const W = cvL.width = cvL.clientWidth * 2;
  const H = cvL.height = cvL.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const { acc, txt } = plotColors();
  const cx = W / 2, cy = H / 2, sc = Math.min(W, H) / 2 / (R_DEE * SCALE * 1.16);
  ctx.strokeStyle = 'rgba(128,150,170,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, R_DEE * SCALE * sc, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R_DEE * SCALE * sc, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - R_DEE * SCALE * sc); ctx.lineTo(cx, cy + R_DEE * SCALE * sc); ctx.stroke();
  ctx.fillStyle = txt; ctx.font = '16px system-ui';
  ctx.fillText(L('出口', 'exit'), cx + R_EXIT * SCALE * sc * 0.72 - 8, cy - R_EXIT * SCALE * sc * 0.78 - 6);
  ctx.strokeStyle = 'rgba(128,150,170,.7)';
  ctx.beginPath();
  ctx.moveTo(cx + R_EXIT * 0.7 * SCALE * sc, cy + R_EXIT * 0.7 * SCALE * sc);
  ctx.lineTo(cx + 2.9 * SCALE * sc, cy + 2.9 * SCALE * sc);
  ctx.stroke();
  if (trailPts.length > 6) {
    ctx.strokeStyle = acc; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let i = 0, n = trailPts.length / 3; i < n; i += 2) {
      const px = cx + trailPts[i * 3] * sc, py = cy + trailPts[i * 3 + 2] * sc;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  if (mode === 'fly' || mode === 'exit') {
    ctx.fillStyle = acc;
    ctx.beginPath(); ctx.arc(cx + pPos.x * sc, cy + pPos.z * sc, 5, 0, Math.PI * 2); ctx.fill();
  }
}
function drawPlotR() {
  const ctx = cvR.getContext('2d');
  const W = cvR.width = cvR.clientWidth * 2;
  const H = cvR.height = cvR.clientHeight * 2;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  const { acc, txt } = plotColors();
  const padL = 40, padR = 10, padT = 10;
  const waveY0 = H - 44, waveY1 = H - 6, waveMid = (waveY0 + waveY1) / 2, waveAmp = (waveY1 - waveY0) / 2 - 2;
  const n = keHist.length;
  const keAxisMax = Math.max(10, ...keHist) * 1.12;
  const xOf = i => padL + (n <= 1 ? 0 : i / (n - 1)) * (W - padL - padR);
  const yOf = ke => waveY0 - ke / keAxisMax * (waveY0 - padT);
  ctx.font = '15px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.25)';
  ctx.beginPath(); ctx.moveTo(padL, yOf(0)); ctx.lineTo(W - padR, yOf(0)); ctx.stroke();
  ctx.fillStyle = txt;
  ctx.fillText(`${keAxisMax.toFixed(0)} MeV`, 4, padT + 10);
  ctx.fillText(`${turns} ${L('圈', 'turns')}`, W - padR - 60, padT + 10);
  if (n > 0) {
    ctx.strokeStyle = acc; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(xOf(0), yOf(keHist[0]));
    for (let i = 1; i < n; i++) { ctx.lineTo(xOf(i), yOf(keHist[i - 1])); ctx.lineTo(xOf(i), yOf(keHist[i])); }
    ctx.stroke();
  }
  /* 底部:RF 波形 cos(φ),绿区=加速相位,红区=减速相位 */
  const wx0 = padL, wx1 = W - padR, ww = wx1 - wx0;
  ctx.fillStyle = 'rgba(105,219,124,.12)';
  ctx.fillRect(wx0, waveY0, ww * 0.25, waveY1 - waveY0);
  ctx.fillRect(wx0 + ww * 0.75, waveY0, ww * 0.25, waveY1 - waveY0);
  ctx.fillStyle = 'rgba(255,107,107,.12)';
  ctx.fillRect(wx0 + ww * 0.25, waveY0, ww * 0.5, waveY1 - waveY0);
  ctx.strokeStyle = 'rgba(128,150,170,.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let i = 0; i <= 64; i++) {
    const t = i / 64, y = waveMid - waveAmp * Math.cos(2 * Math.PI * t);
    i === 0 ? ctx.moveTo(wx0 + t * ww, y) : ctx.lineTo(wx0 + t * ww, y);
  }
  ctx.stroke();
  ctx.fillStyle = txt;
  ctx.fillText('RF', wx0 + 4, waveY0 - 4);
  const ph = ((slip % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / (2 * Math.PI);
  ctx.fillStyle = mode === 'lost' ? '#ff6b6b' : (Math.abs(slip) > 0.698 ? '#ffa94d' : acc);
  const mx = wx0 + ph * ww, my = waveMid - waveAmp * Math.cos(2 * Math.PI * ph);
  ctx.beginPath(); ctx.arc(mx, my, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillText(`ψ=${(slip * 180 / Math.PI).toFixed(0)}°`, wx1 - 74, waveY0 - 4);
}
function drawPlot() { drawPlotL(); drawPlotR(); }
/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elB = document.getElementById('sB'), elBVal = document.getElementById('sBVal');
const elV = document.getElementById('sV'), elVVal = document.getElementById('sVVal');
const elPart = document.getElementById('sPart'), elPartVal = document.getElementById('sPartVal');
const stKE = document.getElementById('stKE'), stTurns = document.getElementById('stTurns'),
  stFreq = document.getElementById('stFreq'), stRad = document.getElementById('stRad'),
  stGain = document.getElementById('stGain'), stSync = document.getElementById('stSync');
const formulaEl = document.getElementById('formula');
const btnInject = document.getElementById('btnInject'), btnDetune = document.getElementById('btnDetune');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elB.value = B; elBVal.textContent = `${B.toFixed(2)} T`;
  elV.value = Vrf; elVVal.textContent = `${Vrf.toFixed(0)} kV`;
  elPart.value = spIdx; elPartVal.textContent = L(sp().zh, sp().en);
}
function syncBtns() { btnDetune.classList.toggle('on', eta !== 1); }
function syncText() {
  if (mode === 'fly') return Math.abs(slip) < 0.698 ? L('锁定', 'locked') : L('滑相', 'slipping');
  if (mode === 'exit') return L('已引出', 'extracted');
  if (mode === 'lost') return L('撞壁', 'beam lost');
  return L('待机', 'standby');
}
function updateStats() {
  const fly = mode === 'fly';
  stKE.innerHTML = fly ? `${KE.toFixed(2)}<small> MeV</small>` : '—';
  stKE.className = 'v ' + (mode === 'lost' ? 'bad' : (mode === 'exit' ? 'ok' : ''));
  stTurns.textContent = fly || mode === 'exit' ? turns : '—';
  stFreq.innerHTML = `${(freqRev(B, fly ? gamma : 1) / 1e6).toFixed(2)}<small> MHz</small>`;
  stRad.innerHTML = fly ? `${orbitR.toFixed(3)}<small> m</small>` : '—';
  const gain = 2 * sp().q * Vrf * Math.cos(slip);
  stGain.innerHTML = fly ? `${gain.toFixed(0)}<small> keV</small>` : '—';
  stGain.className = 'v ' + (fly ? (gain < 0 ? 'bad' : (Math.abs(slip) > 0.698 ? 'warn' : 'ok')) : '');
  stSync.textContent = syncText();
  stSync.className = 'v ' + (mode === 'fly' ? (Math.abs(slip) >= Math.PI / 2 ? 'bad' : (Math.abs(slip) > 0.698 ? 'warn' : 'ok')) : (mode === 'lost' ? 'bad' : (mode === 'exit' ? 'ok' : '')));
}
function updateFormula() {
  const s = sp();
  const f0 = freqRev(B, 1) / 1e6, fRF = f0 * eta;
  const gNow = mode === 'fly' ? gamma : 1;
  const keExit = keAtRadius(R_EXIT, B);
  const tN = Math.max(1, Math.round(keExit * 1000 / (2 * s.q * Vrf)));
  const ceil = Math.sqrt(s.q * Vrf / 1000 * s.mc2);
  const psi = slip * 180 / Math.PI;
  const gainNow = 2 * s.q * Vrf * Math.cos(slip);
  const perTurnNs = 1e6 / freqRev(B, 1);
  const radTxt = mode === 'fly' ? orbitR.toFixed(3) : '—';
  const det = eta !== 1 ? '(失谐 −6%)' : '';
  formulaEl.innerHTML = L(
    `<b>qvB = mv²/r → r = mv/(qB)</b>:当前半径 ${radTxt} m;出口 ${R_EXIT} m ↔ ${keExit.toFixed(1)} MeV(B=${B.toFixed(2)} T,质子 12 MeV → 0.33 m)<br>` +
    `<b>回旋频率 f = qB/(2πm) = ${f0.toFixed(2)} MHz</b>,与速度无关(等时性);RF 锁定 ${fRF.toFixed(2)} MHz${det}<br>` +
    `<b>每圈 2 次过缝,增能 2qV = ${(2 * s.q * Vrf).toFixed(0)} keV</b>;到出口约 ${tN} 圈,当前过缝实得 ${gainNow.toFixed(0)} keV<br>` +
    `<b>相对论 m = γm₀ → f 掉队 1/γ</b>:γ=${gNow.toFixed(4)},ψ=${psi.toFixed(0)}°,天花板 KE≈√(qV·m₀c²)=${ceil.toFixed(1)} MeV<br>` +
    `<b>同步状态:${syncText()}</b>;真实耗时 ≈ 圈数 × ${perTurnNs.toFixed(1)} ns = ${realUs.toFixed(2)} μs`,
    `<b>qvB = mv²/r → r = mv/(qB)</b>: now ${radTxt} m; the ${R_EXIT} m exit ↔ ${keExit.toFixed(1)} MeV (B=${B.toFixed(2)} T, proton 12 MeV → 0.33 m)<br>` +
    `<b>Cyclotron f = qB/(2πm) = ${f0.toFixed(2)} MHz</b>, speed-independent (isochronism); RF at ${fRF.toFixed(2)} MHz${det}<br>` +
    `<b>2 crossings per turn, gain 2qV = ${(2 * s.q * Vrf).toFixed(0)} keV</b>; ~${tN} turns to exit, current kick ${gainNow.toFixed(0)} keV<br>` +
    `<b>Relativistic m = γm0 → f sags by 1/γ</b>: γ=${gNow.toFixed(4)}, ψ=${psi.toFixed(0)}°, ceiling KE≈√(qV·m0c2)=${ceil.toFixed(1)} MeV<br>` +
    `<b>Sync: ${syncText()}</b>; real time ≈ turns × ${perTurnNs.toFixed(1)} ns = ${realUs.toFixed(2)} us`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elB.addEventListener('input', () => { B = +elB.value; syncSliders(); updateFormula(); updateStats(); });
elV.addEventListener('input', () => { Vrf = +elV.value; syncSliders(); updateFormula(); updateStats(); });
elPart.addEventListener('input', () => {
  spIdx = +elPart.value; syncSliders(); updateFormula(); updateStats();
  if (mode === 'fly') inject();
});
btnInject.addEventListener('click', () => {
  inject();
  notify(`${L(sp().zh, sp().en)}注入:从中央离子源出发,每圈增能 ${2 * sp().q * Vrf} keV`,
    `${L(sp().zh, sp().en)} injected from the central source: +${2 * sp().q * Vrf} keV per turn`);
});
btnDetune.addEventListener('click', () => {
  eta = eta === 1 ? 0.94 : 1;
  if (eta !== 1) notify('失谐演示:RF 频率偏 −6%,粒子每圈都迟到,几圈内滑相撞壁',
    'detune demo: RF shifted −6%; the particle arrives late every turn and crashes within a few');
  else notify('恢复匹配:RF 重新锁定回旋频率,新注入的粒子将保持同步', 're-matched: RF locked back to the cyclotron frequency');
  if (eta === 1 && mode !== 'fly') inject();
  syncAll();
});
elPlay.addEventListener('click', () => {
  playing = !playing;
  if (playing && mode === 'idle') inject();
  setPlayLabel();
});
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglField').addEventListener('change', e => { fieldGroup.visible = e.target.checked; });
document.getElementById('tglTrail').addEventListener('change', e => { trailOn = e.target.checked; trailLine.visible = trailOn; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});
/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, accS = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) { simT += dt; stepParticle(dt); }
  particle.position.copy(pPos);
  /* 缝上极性翻转 + 闪光(每次过缝触发,与粒子到达同步) */
  gapFlash = Math.max(0, gapFlash - dt0 * 3.4);
  const pol = gapPolarity > 0;
  plateAM.color.setHex(pol ? accHex : 0xff922b).multiplyScalar(0.45 + 0.55 * gapFlash);
  plateBM.color.setHex(pol ? 0xff922b : accHex).multiplyScalar(0.45 + 0.55 * gapFlash);
  gapM.opacity = 0.10 + 0.78 * gapFlash;
  gapLight.intensity = 3.2 * gapFlash;
  led.scale.setScalar(1 + 1.6 * gapFlash);
  srcM.emissiveIntensity = 0.4 + 0.3 * Math.sin(simT * 5);
  if (ringT < 1) {
    ringT += dt0 * 2.8;
    const f = Math.min(1, ringT);
    ring.scale.setScalar(0.5 + f * 1.9);
    ringM.opacity = 0.95 * (1 - f);
  } else ringM.opacity = 0;
  if (targetPulse > 0) {
    targetPulse = Math.max(0, targetPulse - dt0 * 1.6);
    targetM.emissiveIntensity = targetPulse * 2.2;
  }
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  accS += dt0;
  if (accS > 0.14) { accS = 0; updateStats(); drawPlotR(); }
  drawPlotL();
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
trailLine.visible = trailOn;
fieldGroup.visible = document.getElementById('tglField').checked;
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
if (playing) inject();
start();
</script>
