<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>细胞凋亡 · 3D 原理动画</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;
    --acc:#6ab0f5;
    --bg:#0d1117;--panel:rgba(13,17,24,.88);--panel-border:rgba(255,255,255,.09);
    --text:#f0f4f8;--text2:#8fa8c0;--text3:#b8ccd8;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78);--tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --acc:#2563a8;
    --bg:#eef1f6;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    transition:background .25s;}
  #app{position:fixed;inset:0;}
  #app canvas{display:block;}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3;}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);
    color:var(--text3);font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;
    white-space:nowrap;}
  .lbl.hl{border-color:rgba(106,176,245,.75);font-weight:600;}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;
    max-width:calc(100vw - 320px);}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;
    text-shadow:0 2px 8px rgba(0,0,0,.25);}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;
    text-shadow:0 1px 4px rgba(0,0,0,.2);}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;
    min-width:40px;height:32px;padding:0 12px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
  #stats{position:fixed;right:18px;top:64px;z-index:4;width:288px;
    display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    padding:11px 14px;backdrop-filter:blur(6px);box-shadow:var(--shadow);}
  .card h3{font-size:13px;color:var(--text);font-weight:600;margin-bottom:8px;}
  .kv{display:flex;justify-content:space-between;align-items:baseline;margin:5px 0;}
  .kv .k{font-size:12px;color:var(--text2);}
  .kv .v{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  .kv .v.big{font-size:20px;color:var(--acc);}
  .bar-wrap{height:6px;background:rgba(128,144,160,.18);border-radius:3px;margin-top:3px;}
  .bar-fill{height:100%;border-radius:3px;background:var(--acc);transition:width .3s;}
  .note{font-size:11px;color:var(--text2);border-top:1px solid var(--panel-border);
    margin-top:8px;padding-top:7px;line-height:1.55;}
  @media(max-width:1150px){#stats{display:none;}}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:356px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 140px);overflow:auto;}
  #steps{list-style:none;}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start;}
  #steps li:hover{background:var(--hover);}
  #steps li.on{background:rgba(106,176,245,.13);border-color:rgba(106,176,245,.5);}
  :root[data-theme="light"] #steps li.on{background:rgba(37,99,168,.10);border-color:rgba(37,99,168,.4);}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
    background:rgba(128,140,155,.25);color:var(--text3);}
  #steps li.on .n{background:var(--acc);color:#fff;}
  #steps .t{font-size:12.5px;color:var(--text3);line-height:1.45;}
  #steps li.on .t b{color:var(--acc);}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer;}
  #play:hover{filter:brightness(1.12);}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px;}
  .row{display:flex;align-items:center;gap:8px;}
  .row label{font-size:12px;color:var(--text2);flex:0 0 30px;}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 38px;text-align:right;}
  #actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .abtn{font-size:11.5px;color:var(--text3);background:var(--hover);
    border:1px solid var(--panel-border);border-radius:8px;padding:5px 10px;
    cursor:pointer;transition:border-color .15s,color .15s;}
  .abtn:hover{border-color:var(--acc);color:var(--acc);}
  @media(max-width:760px){
    #panel{width:calc(100vw - 36px);max-height:55vh;}
    #title{max-width:calc(100vw - 200px);}
    #title h1{font-size:16px;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="细胞凋亡" data-en="Apoptosis — Programmed Cell Death">细胞凋亡</h1>
  <div class="sub" data-zh="死亡信号沿半胱氨酸蛋白酶瀑布传递：细胞主动拆解自身 · 空格播放/暂停" data-en="Death signal cascades through caspase proteases — the cell dismantles itself · Space = play/pause">死亡信号沿半胱氨酸蛋白酶瀑布传递：细胞主动拆解自身 · 空格播放/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn">EN</button>
  <button class="tbtn" id="themeBtn">☀</button>
</div>
<div id="stats">
  <div class="card">
    <h3 data-zh="凋亡进程" data-en="Apoptosis Progress">凋亡进程</h3>
    <div class="kv"><span class="k" data-zh="半胱氨酸蛋白酶活性" data-en="Caspase activity">半胱氨酸蛋白酶活性</span><span class="v big" id="stCasp">0%</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barCasp" style="width:0%"></div></div>
    <div class="kv"><span class="k" data-zh="细胞色素 c 释放量" data-en="Cytochrome c released">细胞色素 c 释放量</span><span class="v" id="stCytc">0%</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barCytc" style="width:0%;background:#f59e42"></div></div>
    <div class="kv"><span class="k" data-zh="细胞体积" data-en="Cell volume">细胞体积</span><span class="v" id="stVol">100%</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barVol" style="width:100%;background:#6ab0f5"></div></div>
    <div class="kv"><span class="k" data-zh="DNA 碎片化" data-en="DNA fragmentation">DNA 碎片化</span><span class="v" id="stDna">0%</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="barDna" style="width:0%;background:#e05a7a"></div></div>
    <div class="note" data-zh="凋亡≠坏死：无内容物外漏，无炎症反应" data-en="Apoptosis ≠ necrosis: no leakage, no inflammation">凋亡≠坏死：无内容物外漏，无炎症反应</div>
  </div>
</div>
<div id="panel">
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="actions">
    <button class="abtn" id="btnExtrinsic" data-zh="外源途径" data-en="Extrinsic pathway">外源途径</button>
    <button class="abtn" id="btnIntrinsic" data-zh="内源途径" data-en="Intrinsic pathway">内源途径</button>
    <button class="abtn" id="btnBodies" data-zh="显示凋亡小体" data-en="Show apoptotic bodies">显示凋亡小体</button>
    <button class="abtn" id="btnMacro" data-zh="巨噬细胞清除" data-en="Macrophage clearance">巨噬细胞清除</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const lerp = (a,b,t) => a + (b-a)*t;
const ss = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

const STEPS_DATA = [
  ['死亡信号：配体与受体结合，DISC 复合物激活启动型半胱氨酸蛋白酶-8',
   'Death signal: ligand binds receptor, DISC activates initiator caspase-8'],
  ['线粒体通路：应激→Bax/Bak 打孔→细胞色素 c 从线粒体释放',
   'Intrinsic: stress → Bax/Bak punch holes → cytochrome c exits mitochondria'],
  ['凋亡小体装配：Apaf-1+细胞色素 c 聚成七元环，激活半胱氨酸蛋白酶-9',
   'Apoptosome: 7 Apaf-1 + cytochrome c → heptamer activates caspase-9'],
  ['执行型瀑布：半胱氨酸蛋白酶-3/7 切割数百种底物——核纤层/细胞骨架/DNA酶',
   'Executioner caspase-3/7 cleaves 100s of substrates — lamins, cytoskeleton, DNase'],
  ['细胞拆解：染色质凝缩、细胞皱缩、膜起泡',
   'Dismantling: chromatin condenses, cell shrinks, membrane blebs'],
  ['静默清除：磷脂酰丝氨酸外翻→"吃我"信号→巨噬细胞吞噬，无炎症',
   'Silent clearance: PS flips out → "eat me" → macrophage engulfs, no inflammation'],
];

function buildSteps() {
  const ol = document.getElementById('steps');
  ol.innerHTML = '';
  STEPS_DATA.forEach(([zh, en], i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i+1}</span><span class="t">${LANG==='en'?en:zh}</span>`;
    li.addEventListener('click', () => { progress = i / (STEPS_DATA.length-1); });
    ol.appendChild(li);
  });
}

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME==='dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME==='light' ? 0xeef1f6 : 0x0d1117);
}
function applyLang() {
  htmlEl.lang = LANG==='en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG==='en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG==='en' ? '中' : 'EN';
  document.title = L('细胞凋亡 · 3D 原理动画', 'Apoptosis · 3D Animation');
  buildSteps();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME==='dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME); applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG==='zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG); applyLang();
});

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 100);
camera.position.set(0, 0, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 5; controls.maxDistance = 25;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(5, 8, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-5, 2, -4); scene.add(fill);

function mat(color, opts={}) {
  return new THREE.MeshStandardMaterial({ color, roughness:0.45, metalness:0.2,
    emissive:color, emissiveIntensity:0.1, transparent:true, opacity:1, ...opts });
}

// Cell body
const cellGeo = new THREE.SphereGeometry(3, 48, 32);
const cellMat = mat(0x3a6bbf, { opacity:0.22, side:THREE.DoubleSide, depthWrite:false });
const cellMesh = new THREE.Mesh(cellGeo, cellMat);
scene.add(cellMesh);

// Nucleus
const nucGeo = new THREE.SphereGeometry(1.2, 32, 24);
const nucMat = mat(0x1e3a6e, { opacity:0.85 });
const nucMesh = new THREE.Mesh(nucGeo, nucMat);
scene.add(nucMesh);

// Mitochondria (rod-shaped, green)
const mitoGroup = new THREE.Group();
const mitoPositions = [
  [2.0, 0.5, 0.3], [-1.8, 0.8, -0.4], [0.5, 2.0, 0.2],
  [-0.4, -1.9, 0.5], [1.5, -1.2, -0.6], [-1.5, -0.5, 1.0]
];
const mitoMeshes = [];
mitoPositions.forEach(([x,y,z]) => {
  const g = new THREE.CapsuleGeometry(0.18, 0.55, 6, 12);
  const m = new THREE.Mesh(g, mat(0x3dab6e, { emissiveIntensity:0.3 }));
  m.position.set(x, y, z);
  m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  mitoGroup.add(m);
  mitoMeshes.push(m);
});
scene.add(mitoGroup);

// Fas receptors on membrane surface (small red cones)
const fasGroup = new THREE.Group();
const fasPositions = [];
for (let i = 0; i < 8; i++) {
  const phi = Math.acos(-1 + (2*i+1)/8);
  const theta = Math.sqrt(8*Math.PI) * phi;
  const x = 3*Math.sin(phi)*Math.cos(theta);
  const y = 3*Math.sin(phi)*Math.sin(theta);
  const z = 3*Math.cos(phi);
  fasPositions.push([x,y,z]);
  const g = new THREE.ConeGeometry(0.12, 0.35, 6);
  const m = new THREE.Mesh(g, mat(0xe05060, { emissiveIntensity:0.5 }));
  m.position.set(x, y, z);
  m.lookAt(0,0,0); m.rotateX(-Math.PI/2);
  fasGroup.add(m);
}
scene.add(fasGroup);

// FasL ligand particles (small red triangles approaching)
const ligandCount = 6;
const ligandDummy = new THREE.Object3D();
const ligandMesh = new THREE.InstancedMesh(
  new THREE.TetrahedronGeometry(0.18),
  mat(0xff3355, { emissiveIntensity:0.7 }),
  ligandCount
);
scene.add(ligandMesh);

// Cytochrome c particles (orange dots, InstancedMesh)
const cytcCount = 40;
const cytcDummy = new THREE.Object3D();
const cytcMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.10, 8, 6),
  mat(0xf59e42, { emissiveIntensity:0.6 }),
  cytcCount
);
cytcMesh.count = 0;
scene.add(cytcMesh);

// Apoptosome: 7-unit heptagonal ring (gold)
const apoptosomeGroup = new THREE.Group();
const aRingRadius = 0.85;
const aUnitMeshes = [];
for (let i = 0; i < 7; i++) {
  const angle = (i / 7) * Math.PI * 2;
  const g = new THREE.CylinderGeometry(0.18, 0.18, 0.28, 7);
  const m = new THREE.Mesh(g, mat(0xffd700, { emissiveIntensity:0.5 }));
  m.position.set(Math.cos(angle)*aRingRadius, Math.sin(angle)*aRingRadius, 0);
  apoptosomeGroup.add(m);
  aUnitMeshes.push(m);
}
apoptosomeGroup.scale.setScalar(0);
apoptosomeGroup.position.set(0, 0, 0);
scene.add(apoptosomeGroup);

// Caspase glow (red expanding sphere)
const caspGlowMat = new THREE.MeshBasicMaterial({
  color:0xff2244, transparent:true, opacity:0,
  blending:THREE.AdditiveBlending, depthWrite:false
});
const caspGlow = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), caspGlowMat);
scene.add(caspGlow);

// Membrane blebs (small spheres on surface)
const blebGroup = new THREE.Group();
const blebCount = 10;
const blebDummy = new THREE.Object3D();
const blebMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.28, 10, 8),
  mat(0x5588cc, { opacity:0.7 }),
  blebCount
);
blebMesh.count = 0;
scene.add(blebMesh);

// Apoptotic bodies (small spheres, fragments)
const bodyGroup = new THREE.Group();
const bodyCount = 6;
const bodyDummy = new THREE.Object3D();
const bodyMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.55, 12, 10),
  mat(0x4477bb, { opacity:0.82 }),
  bodyCount
);
bodyMesh.count = 0;
scene.add(bodyMesh);

// Macrophage (large irregular gray mesh using scaled icosahedron)
const macroMat = mat(0x8899aa, { opacity:0.7, roughness:0.7 });
const macroMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2, 1), macroMat);
macroMesh.position.set(9, 0, 0);
macroMesh.scale.set(1, 0.7, 0.8);
scene.add(macroMesh);

// PS "eat-me" signal dots on surface
const psCount = 12;
const psDummy = new THREE.Object3D();
const psMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.09, 6, 5),
  mat(0xff9900, { emissiveIntensity:0.8 }),
  psCount
);
psMesh.count = 0;
scene.add(psMesh);

// Cytochrome c base positions (inside mitochondria, then scatter outward)
const cytcBase = [];
for (let i = 0; i < cytcCount; i++) {
  const mi = i % mitoPositions.length;
  const [mx, my, mz] = mitoPositions[mi];
  cytcBase.push([mx + (Math.random()-0.5)*0.3, my + (Math.random()-0.5)*0.3, mz + (Math.random()-0.5)*0.3]);
}
const cytcTarget = [];
for (let i = 0; i < cytcCount; i++) {
  const r = 1.5 + Math.random();
  const th = Math.random()*Math.PI*2;
  const ph = Math.acos(-1 + 2*Math.random());
  cytcTarget.push([r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph)]);
}

let progress = 0; // 0..1 overall apoptosis progress
let playing = true;
let speed = 1;
let wallT = 0;
let lastStep = -1;

// Action buttons
document.getElementById('btnExtrinsic').addEventListener('click', () => { progress = 0; playing = true; });
document.getElementById('btnIntrinsic').addEventListener('click', () => { progress = 0.15; playing = true; });
document.getElementById('btnBodies').addEventListener('click', () => { progress = 0.72; playing = true; });
document.getElementById('btnMacro').addEventListener('click', () => { progress = 0.88; playing = true; });

const elPlay = document.getElementById('play');
elPlay.addEventListener('click', () => {
  playing = !playing;
  elPlay.textContent = playing ? L('暂停','Pause') : L('播放','Play');
});
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1)+'×'; });
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
elScrub.addEventListener('input', () => { progress = parseInt(elScrub.value)/1000; });
addEventListener('keydown', e => { if (e.code==='Space') { e.preventDefault(); elPlay.click(); } });

const clock = new THREE.Clock();

function poseScene(p) {
  // ligand approach: p 0..0.12
  const ligandIn = ss(0, 0.10, p);
  for (let i = 0; i < ligandCount; i++) {
    const angle = (i/ligandCount)*Math.PI*2;
    const startR = 7, endR = 3.1;
    const r = lerp(startR, endR, ligandIn);
    ligandDummy.position.set(Math.cos(angle)*r, Math.sin(angle)*r*0.5 + 0.3, Math.sin(angle)*r*0.3);
    ligandDummy.rotation.set(wallT*0.5+i, wallT*0.3+i, 0);
    ligandDummy.updateMatrix();
    ligandMesh.setMatrixAt(i, ligandDummy.matrix);
  }
  ligandMesh.instanceMatrix.needsUpdate = true;
  ligandMesh.material.emissiveIntensity = 0.4 + 0.4*Math.sin(wallT*3);

  // Fas receptor flash
  fasGroup.children.forEach((m,i) => {
    m.material.emissiveIntensity = p > 0.08 ? 0.8 + 0.4*Math.sin(wallT*4 + i) : 0.3;
  });

  // Cytochrome c release: p 0.18..0.38
  const cytcFrac = ss(0.18, 0.38, p);
  const nCytc = Math.round(cytcFrac * cytcCount);
  cytcMesh.count = nCytc;
  for (let i = 0; i < nCytc; i++) {
    const f = ss(0.18 + i*0.005, 0.38 + i*0.003, p);
    cytcDummy.position.set(
      lerp(cytcBase[i][0], cytcTarget[i][0], f) + Math.sin(wallT*1.2+i)*0.05,
      lerp(cytcBase[i][1], cytcTarget[i][1], f) + Math.cos(wallT*0.9+i)*0.05,
      lerp(cytcBase[i][2], cytcTarget[i][2], f)
    );
    cytcDummy.scale.setScalar(1);
    cytcDummy.rotation.set(0,0,0);
    cytcDummy.updateMatrix();
    cytcMesh.setMatrixAt(i, cytcDummy.matrix);
  }
  cytcMesh.instanceMatrix.needsUpdate = true;

  // Apoptosome assembly: p 0.35..0.52 (signature moment - heptamer spins into place)
  const aFrac = ss(0.35, 0.52, p);
  apoptosomeGroup.scale.setScalar(aFrac);
  apoptosomeGroup.rotation.z = (1-aFrac)*Math.PI*2 + wallT*0.4;
  aUnitMeshes.forEach((m,i) => {
    m.material.emissiveIntensity = aFrac * (0.4 + 0.3*Math.sin(wallT*2+i));
  });

  // Caspase cascade glow: p 0.50..0.65 (red spreads outward)
  const caspFrac = ss(0.50, 0.65, p);
  caspGlowMat.opacity = caspFrac * (1 - ss(0.70, 0.80, p)) * 0.35;
  caspGlow.scale.setScalar(1 + caspFrac * 2.5);

  // Nucleus condensation
  const condensFrac = ss(0.58, 0.80, p);
  nucMesh.scale.setScalar(lerp(1.0, 0.7, condensFrac));
  nucMat.color.setHex(condensFrac > 0.5 ? 0x0d1a40 : 0x1e3a6e);
  nucMat.emissiveIntensity = lerp(0.1, 0.4, condensFrac);

  // Cell shrinkage: p 0.55..0.85
  const shrinkFrac = ss(0.55, 0.85, p);
  cellMesh.scale.setScalar(lerp(1.0, 0.62, shrinkFrac));

  // Membrane blebs: p 0.62..0.78
  const blebFrac = ss(0.62, 0.78, p);
  const nBleb = Math.round(blebFrac * blebCount);
  blebMesh.count = nBleb;
  for (let i = 0; i < nBleb; i++) {
    const angle = (i/blebCount)*Math.PI*2 + wallT*0.15;
    const r = lerp(2.5, 3.4, shrinkFrac) * (1 - shrinkFrac*0.3);
    blebDummy.position.set(
      Math.cos(angle)*r*Math.cos(i*0.7),
      Math.sin(angle*1.3 + i)*r*0.8,
      Math.sin(angle)*r*Math.sin(i*0.5+0.2)
    );
    blebDummy.scale.setScalar(0.7 + 0.5*blebFrac);
    blebDummy.rotation.set(0,0,0);
    blebDummy.updateMatrix();
    blebMesh.setMatrixAt(i, blebDummy.matrix);
  }
  blebMesh.instanceMatrix.needsUpdate = true;

  // Apoptotic bodies: p 0.72..0.85
  const bodyFrac = ss(0.72, 0.85, p);
  const nBody = Math.round(bodyFrac * bodyCount);
  bodyMesh.count = nBody;
  cellMesh.material.opacity = lerp(0.22, 0.05, bodyFrac);
  for (let i = 0; i < nBody; i++) {
    const angle = (i/bodyCount)*Math.PI*2;
    const r = lerp(0, 3.5, bodyFrac);
    bodyDummy.position.set(
      Math.cos(angle)*r + Math.sin(wallT*0.4+i)*0.1,
      Math.sin(angle)*r*0.7 + Math.cos(wallT*0.3+i)*0.1,
      Math.cos(angle*1.3)*r*0.5
    );
    bodyDummy.scale.setScalar(0.5 + 0.5*bodyFrac);
    bodyDummy.rotation.set(0,0,0);
    bodyDummy.updateMatrix();
    bodyMesh.setMatrixAt(i, bodyDummy.matrix);
  }
  bodyMesh.instanceMatrix.needsUpdate = true;

  // PS "eat me" signal: p 0.75..0.88
  const psFrac = ss(0.75, 0.88, p);
  psMesh.count = Math.round(psFrac * psCount);
  for (let i = 0; i < psCount; i++) {
    const angle = (i/psCount)*Math.PI*2;
    const phi = (i%3)*Math.PI/3 + 0.3;
    const r = 3.0 * (1-shrinkFrac*0.35);
    psDummy.position.set(Math.sin(phi)*Math.cos(angle)*r, Math.cos(phi)*r*0.8, Math.sin(phi)*Math.sin(angle)*r);
    psDummy.scale.setScalar(1);
    psDummy.rotation.set(0,0,0);
    psDummy.updateMatrix();
    psMesh.setMatrixAt(i, psDummy.matrix);
  }
  psMesh.instanceMatrix.needsUpdate = true;

  // Macrophage approach and engulfment: p 0.85..1.0
  const macroFrac = ss(0.85, 1.0, p);
  const macroX = lerp(9, 0, macroFrac);
  macroMesh.position.set(macroX, 0, 0);
  macroMesh.scale.set(lerp(1, 1.4, macroFrac), lerp(0.7, 0.9, macroFrac), 0.8);
  macroMesh.rotation.y = wallT*0.3;

  // Hide bodies as they're engulfed
  if (macroFrac > 0.7) {
    const hide = ss(0.94, 1.0, p);
    bodyMesh.material.opacity = lerp(0.82, 0.0, hide);
    cellMesh.material.opacity = lerp(0.05, 0.0, hide);
  }

  // Mitochondria permeabilization glow
  const mitoStress = ss(0.12, 0.30, p);
  mitoMeshes.forEach((m,i) => {
    m.material.emissiveIntensity = lerp(0.3, 0.9, mitoStress) * (1 + 0.2*Math.sin(wallT*2+i));
  });

  // Update stats
  const caspAct = Math.round(clamp(ss(0.48, 0.75, p)*100, 0, 100));
  const cytcPct = Math.round(cytcFrac*100);
  const vol = Math.round(lerp(100, 35, shrinkFrac));
  const dna = Math.round(clamp(ss(0.60, 0.82, p)*100, 0, 100));
  document.getElementById('stCasp').textContent = caspAct+'%';
  document.getElementById('barCasp').style.width = caspAct+'%';
  document.getElementById('stCytc').textContent = cytcPct+'%';
  document.getElementById('barCytc').style.width = cytcPct+'%';
  document.getElementById('stVol').textContent = vol+'%';
  document.getElementById('barVol').style.width = vol+'%';
  document.getElementById('stDna').textContent = dna+'%';
  document.getElementById('barDna').style.width = dna+'%';

  // Step highlight
  let si = 0;
  if (p < 0.18) si = 0;
  else if (p < 0.35) si = 1;
  else if (p < 0.52) si = 2;
  else if (p < 0.68) si = 3;
  else if (p < 0.80) si = 4;
  else si = 5;
  if (si !== lastStep) {
    lastStep = si;
    document.querySelectorAll('#steps li').forEach((li,i) => li.classList.toggle('on', i===si));
  }
}

applyTheme(); applyLang();

function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min(clock.getDelta(), 0.1);
  wallT += dt;
  if (playing) {
    progress += dt * speed * 0.025;
    if (progress >= 1) progress = 0;
  }
  poseScene(progress);
  elScrub.value = Math.round(progress*1000);
  elScrubVal.textContent = Math.round(progress*100)+'%';
  controls.update();
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
requestAnimationFrame(frame);
</script>
</body>
</html>
