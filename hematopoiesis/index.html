  scene.add(new THREE.Mesh(new THREE.TubeGeometry(c,42,0.08,8,false),m));return m;});
/* 造血干细胞:大球+亮核 */
const hscM=new THREE.MeshStandardMaterial({color:0xe8b39a,roughness:0.35,emissive:0xe8b39a,emissiveIntensity:0.1});

const hscBody=new THREE.Mesh(new THREE.SphereGeometry(0.34,24,18),hscM);hscGrp.add(hscBody);

/* 巨核细胞:超大球,多叶核 */
const megPos=new THREE.Vector3(-1.15,0.78,0.95);

meg.position.copy(megPos);scene.add(meg);

const myes=new THREE.InstancedMesh(new THREE.SphereGeometry(1,14,10),new THREE.MeshStandardMaterial({color:0xe3d0be,roughness:0.45}),NMYE);
myes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(myes);
const lobes=new THREE.InstancedMesh(new THREE.SphereGeometry(1,10,8),new THREE.MeshStandardMaterial({color:0x8a5a86,roughness:0.45}),NMYE*3);
lobes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(lobes);
const plts=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.055,0.055,0.024,10),new THREE.MeshStandardMaterial({color:0xffc9a3,roughness:0.5,emissive:0xd9822b,emissiveIntensity:0.2}),NPLT);
plts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(plts);
const eryD=[],myeD=[],pltD=[],pltDir=[];
for(let i=0;i<NERY;i++){eryD.push({on:0,t:0,sp:0.14});erys.setColorAt(i,cTmp.setHex(0xffffff));eryNs.setColorAt(i,cTmp.setHex(0xffffff));}
for(let i=0;i<NMYE;i++)myeD.push({on:0,t:0,sp:0.12});
for(let i=0;i<NPLT;i++){pltD.push({t:9,u:0,sp:0.5});pltDir.push(new THREE.Vector3().randomDirection());}

/* 状态 */
let epo=30,gcsf=30,divP=5,boost=1,mode='rest',playing=true,labelsOn=true,slowMo=false;
let mitT=0,mitPhase=-1,simT=0,stock=88,portFlash=0;
let eryAcc=0,myeAcc=0,pltAcc=0,dEry=0,dMye=0,dPlt=0,emaE=0,emaM=0,emaP=0,dEryRate=0,dMyeRate=0,dPltRate=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
function eryBase(){return 0.08+1.5*Math.pow(epo/100,1.3);}
function myeBase(){return 0.08+1.5*Math.pow(gcsf/100,1.3);}
function outMul(){return stock>12?1:0.25;}
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
controls.autoRotateSpeed=0.8;

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
const lblHsc=addLabel(()=>L('造血干细胞:补货自己,放行后代','HSC: restocks itself, releases progeny'),
  new THREE.Vector3(0,1.8,0),'y');
const lblE=addLabel(()=>L(`红系河道 · EPO ${epo.toFixed(0)}% → ${emaE.toFixed(1)} 个/s`,
    `Erythroid line · EPO ${epo.toFixed(0)}% \u2192 ${emaE.toFixed(1)}/s`),
  curves[0].getPoint(0.42).add(new THREE.Vector3(0,0.55,0)),'r');
const lblM=addLabel(()=>L(`粒系河道 · G-CSF ${gcsf.toFixed(0)}% → ${emaM.toFixed(1)} 个/s`,
    `Myeloid line · G-CSF ${gcsf.toFixed(0)}% \u2192 ${emaM.toFixed(1)}/s`),
  curves[1].getPoint(0.42).add(new THREE.Vector3(0,0.55,0)),'b');
const lblP=addLabel(()=>L(`巨核细胞:出芽造血小板 ${emaP.toFixed(1)} 个/s`,
    `Megakaryocyte: budding ${emaP.toFixed(1)} platelets/s`),
  new THREE.Vector3(megPos.x,megPos.y+0.95,megPos.z),'o');
addLabel(()=>L('血流出口:成品入循环','Sinus exit: finished cells join the blood'),
  new THREE.Vector3(3.3,1.95,0),'g');

function setEpo(v){epo=clamp(v,0,100);
  document.getElementById('sEpo').value=epo;
  document.getElementById('sEpoVal').textContent=epo.toFixed(0)+' %';updateStats();}
function setGcsf(v){gcsf=clamp(v,0,100);
  document.getElementById('sGcsf').value=gcsf;
  document.getElementById('sGcsfVal').textContent=gcsf.toFixed(0)+' %';updateStats();}
function setDiv(v){divP=clamp(v,2,12);
  document.getElementById('sDiv').value=divP;
  document.getElementById('sDivVal').textContent=divP.toFixed(1)+' s';updateStats();}
const modeBtn={rest:'bRest',anemia:'bAnemia',infect:'bInfect',trauma:'bTrauma',both:null};
function setMode(m){mode=m;
  for(const k in modeBtn){const el=modeBtn[k]&&document.getElementById(modeBtn[k]);
    if(el)el.classList.toggle('on',k===m);}
  if(m==='rest'){setEpo(30);setGcsf(30);boost=1;}
  else if(m==='anemia'){setEpo(92);setGcsf(22);boost=1;}
  else if(m==='infect'){setEpo(22);setGcsf(92);boost=1;}
  else if(m==='trauma'){setEpo(35);setGcsf(35);boost=3.4;}
  else boost=1;
  updateStats();}
function spawnCell(){/* 分裂放行的祖细胞按激素权重选河道 */
  const wE=0.4+epo/100,wM=0.4+gcsf/100,r=Math.random()*(wE+wM);
  if(r<wE){const c=eryD.find(c=>!c.on);if(c){c.on=1;c.t=0;c.sp=0.12+Math.random()*0.06;}}
  else{const c=myeD.find(c=>!c.on);if(c){c.on=1;c.t=0;c.sp=0.10+Math.random()*0.05;}}}

const STEPS=[
 {zh:'骨髓摇篮:干细胞滚动、自我更新',en:'Marrow cradle: the stem cell rolls and renews',
  act(){setMode('rest');setDiv(5);}},
 {zh:'一分为二:一份留底,一份放行',en:'One splits in two: one stays, one ships out',
  act(){setMode('rest');setDiv(2.2);}},
 {zh:'EPO 拉响红系:丢核换运氧',en:'EPO rings the red line: drop the nucleus, haul oxygen',
  act(){setMode('anemia');}},
 {zh:'G-CSF 拉响白系:分叶核上岗',en:'G-CSF rings the white line: lobed nuclei on duty',
  act(){setMode('infect');}},
 {zh:'巨核细胞碎身:一产出千血小板',en:'Megakaryocyte shreds itself: one cell, a thousand platelets',
  act(){setMode('trauma');setDiv(3);}},
 {zh:'库存与调度:贫血与感染的账目',en:'Stock and dispatch: the anemia-plus-infection ledger',
  act(){setMode('both');setEpo(95);setGcsf(95);setDiv(2.4);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  emaE=emaE*0.7+dEryRate*0.3;emaM=emaM*0.7+dMyeRate*0.3;emaP=emaP*0.7+dPltRate*0.3;
  document.getElementById('stRbc').innerHTML=emaE.toFixed(2)+'<small> /s</small>';
  document.getElementById('stMye').innerHTML=emaM.toFixed(2)+'<small> /s</small>';
  document.getElementById('stPlt').innerHTML=emaP.toFixed(2)+'<small> /s</small>';
  const sv=document.getElementById('stStock');
  sv.innerHTML=stock.toFixed(0)+'<small> %</small>';
  sv.className='v '+(stock<25?'warn':'ok');
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bRest').addEventListener('click',()=>setMode('rest'));
document.getElementById('bAnemia').addEventListener('click',()=>setMode('anemia'));
document.getElementById('bInfect').addEventListener('click',()=>setMode('infect'));
document.getElementById('bTrauma').addEventListener('click',()=>setMode('trauma'));
document.getElementById('sEpo').addEventListener('input',e=>setEpo(+e.target.value));
document.getElementById('sGcsf').addEventListener('input',e=>setGcsf(+e.target.value));
document.getElementById('sDiv').addEventListener('input',e=>setDiv(+e.target.value));
document.getElementById('tglSlow').addEventListener('change',e=>{slowMo=e.target.checked;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglAuto').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  marrowM.color.setHex(dark?0x241014:0xd8ac9c);
  boneM.color.setHex(dark?0xd8c7ae:0xb49c78);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*1*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 干细胞漫游 */
  hscGrp.position.set(1.05*Math.sin(simT*0.21),1.15+0.2*Math.sin(simT*0.53),0.85*Math.sin(simT*0.17+1.7));
  hscNuc.position.set(0.06*Math.sin(simT*1.3),0.05*Math.sin(simT*1.7),0.05*Math.cos(simT*1.1));
  hscBody.rotation.y=simT*0.5;
  meg.scale.setScalar(1+0.035*Math.sin(simT*2.1));meg.rotation.y=simT*0.3;
  /* 分裂:一变二,一份留底、一份放行 */
  mitT+=dts;
  if(mitPhase<0&&mitT>divP&&stock>6){mitPhase=0;mitT=0;}
  if(mitPhase>=0){
    mitPhase+=dts/1.15;const m=Math.min(1,mitPhase),st=Math.sin(m*Math.PI);
    hscBody.scale.set(1+0.85*st,1-0.22*st,1-0.22*st);
    hscB.visible=hscBN.visible=m>0.2;
    hscB.scale.setScalar(Math.max(0.05,m));
    hscB.position.set(hscGrp.position.x+0.8*m,hscGrp.position.y+0.12*m,hscGrp.position.z);
    hscBN.scale.setScalar(Math.max(0.05,m));
    hscBN.position.set(hscB.position.x,hscB.position.y+0.02,hscB.position.z);
    if(m>=1){mitPhase=-1;hscB.visible=hscBN.visible=false;hscBody.scale.setScalar(1);spawnCell();}
  }else hscBody.scale.set(1,1,1);
  /* 河道亮度随激素浓度 */
  chanM[0].emissiveIntensity=0.12+1.1*epo/100;chanM[0].opacity=0.08+0.24*epo/100;
  chanM[1].emissiveIntensity=0.12+1.1*gcsf/100;chanM[1].opacity=0.08+0.24*gcsf/100;
  chanM[2].emissiveIntensity=0.12+0.8*(boost-1)/2.4;chanM[2].opacity=0.1+0.18*(boost-1)/2.4;
  /* 生成节律与库存账目 */
  const om=outMul(),rE=eryBase()*om,rM=myeBase()*om,rP=(0.5+0.6*boost)*1.1;
  dEryRate=rE;dMyeRate=rM;dPltRate=rP;
  stock=clamp(stock+dts*(18/divP-(rE+rM)*3.0),0,100);
  eryAcc+=dts*rE;myeAcc+=dts*rM;pltAcc+=dts*rP;
  while(eryAcc>=1){eryAcc--;const c=eryD.find(c=>!c.on);if(c){c.on=1;c.t=0;c.sp=0.12+Math.random()*0.06;}}
  while(myeAcc>=1){myeAcc--;const c=myeD.find(c=>!c.on);if(c){c.on=1;c.t=0;c.sp=0.10+Math.random()*0.05;}}
  while(pltAcc>=1){pltAcc--;const c=pltD.find(c=>c.t>2);if(c){c.t=0;c.u=0;c.sp=0.5+Math.random()*0.3;}}
  /* 红系:变小变红、丢核入血 */
  for(let i=0;i<NERY;i++){const c=eryD[i];
    if(!c.on){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);erys.setMatrixAt(i,m4);eryNs.setMatrixAt(i,m4);continue;}
    c.t+=dts*c.sp;const t=Math.min(1,c.t),p=curves[0].getPoint(t);
    erys.setColorAt(i,cTmp.copy(cEryA).lerp(cEryB,t));
    const s=0.30-0.11*t;m4.makeScale(s,s,s);m4.setPosition(p.x,p.y,p.z);erys.setMatrixAt(i,m4);
    const ns=Math.max(0.001,0.13*(1-sstep(0.55,0.8,t)));
    m4.makeScale(ns,ns,ns);m4.setPosition(p.x,p.y+0.03,p.z);eryNs.setMatrixAt(i,m4);
    if(t>=1){c.on=0;dEry++;portFlash=1;}
  }
  erys.instanceMatrix.needsUpdate=true;erys.instanceColor.needsUpdate=true;eryNs.instanceMatrix.needsUpdate=true;
  /* 粒系:分叶核上岗 */
  for(let i=0;i<NMYE;i++){const c=myeD[i];
    if(!c.on){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);myes.setMatrixAt(i,m4);
      for(let j=0;j<3;j++){m4.setPosition(0,-9,0);lobes.setMatrixAt(i*3+j,m4);}continue;}
    c.t+=dts*c.sp;const t=Math.min(1,c.t),p=curves[1].getPoint(t);
    m4.makeScale(0.26,0.24,0.24);m4.setPosition(p.x,p.y,p.z);myes.setMatrixAt(i,m4);
    const ls=sstep(0.25,0.55,t)*0.11;
    for(let j=0;j<3;j++){const a=simT*0.9+j*2.09+i*0.7;
      m4.makeScale(ls,ls,ls);
      m4.setPosition(p.x+Math.cos(a)*0.13,p.y+0.02*Math.sin(a*2+j),p.z+Math.sin(a)*0.13);
      lobes.setMatrixAt(i*3+j,m4);}
    if(t>=1){c.on=0;dMye++;portFlash=1;}
  }
  myes.instanceMatrix.needsUpdate=true;lobes.instanceMatrix.needsUpdate=true;
  /* 血小板:巨核细胞边缘出芽 → 河道入血 */
  for(let i=0;i<NPLT;i++){const c=pltD[i];
    if(c.t>2){m4.makeScale(0.001,0.001,0.001);m4.setPosition(0,-9,0);plts.setMatrixAt(i,m4);continue;}
    c.t+=dts;let px,py,pz;
    if(c.t<0.3){const d=pltDir[i],k=0.55+0.5*(c.t/0.3),s=0.2+1.0*(c.t/0.3);
      px=megPos.x+d.x*k;py=megPos.y+d.y*k*0.7;pz=megPos.z+d.z*k;
      m4.makeScale(s,s,s);
    }else{c.u+=dts*c.sp*0.3;const u=Math.min(1,c.u),p=curves[2].getPoint(0.05+0.93*u);
      px=p.x;py=p.y+0.05*Math.sin(simT*3+i);pz=p.z;m4.makeScale(1.2,1.2,1.2);
      if(u>=1){c.t=9;dPlt++;portFlash=1;}}
    m4.setPosition(px,py,pz);plts.setMatrixAt(i,m4);
  }
  plts.instanceMatrix.needsUpdate=true;
  portFlash=Math.max(0,portFlash-dts*2.5);
  port.scale.setScalar(1+0.25*portFlash);portM.emissiveIntensity=0.15+1.1*portFlash;
  lblHsc.position.set(hscGrp.position.x,hscGrp.position.y+0.55,hscGrp.position.z);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
