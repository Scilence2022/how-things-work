<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>傅里叶级数 · 圆周运动叠出一切波形</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.ci { color: #ecd5ff; border-color: rgba(199,125,255,.7); }
  .chip.wv { color: #7fd0f7; border-color: rgba(127,208,247,.7); }
  .chip.gi { color: #ffc188; border-color: rgba(255,159,67,.7); }
  :root[data-theme="light"] .chip.ci { color: #7a2fb0; border-color: rgba(130,60,190,.7); }
  :root[data-theme="light"] .chip.wv { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.gi { color: #b26214; border-color: rgba(178,98,20,.7); }
  #waveRow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #waveRow .brl { font-size: 12px; color: var(--text2); }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: center; line-height: 1.25;
    font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(76,201,240,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(21,128,163,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: default;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="傅里叶级数：圆周运动叠出一切波形" data-en="Fourier series: circles stacking into any waveform">傅里叶级数：圆周运动叠出一切波形</h1>
  <div class="sub" data-zh="每个圆匀速转,链条末端画出方波/锯齿/三角——谐波越多越像;方波的角上永远有一根跳不完的刺(吉布斯) · 空格播放/暂停" data-en="Each circle spins at its own rate; the chain's tip traces square / sawtooth / triangle waves — more harmonics, closer fit; the Gibbs overshoot never dies · Space = play/pause">每个圆匀速转,链条末端画出方波/锯齿/三角——谐波越多越像;方波的角上永远有一根跳不完的刺(吉布斯) · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip ci" data-zh="本轮圆(半径=谐波幅度)" data-en="epicycles (r = harmonic amplitude)">本轮圆(半径=谐波幅度)</span>
    <span class="chip wv" data-zh="笔尖轨迹=目标波形" data-en="pen trace = target wave">笔尖轨迹=目标波形</span>
    <span class="chip gi" data-zh="吉布斯振铃" data-en="Gibbs ringing">吉布斯振铃</span>
  </div>
  <div id="waveRow">
    <span class="brl" data-zh="目标波形：" data-en="Target:">目标波形：</span>
    <button id="wSquare" class="bon on" data-zh="方波" data-en="Square">方波</button>
    <button id="wSaw" class="bon" data-zh="锯齿波" data-en="Sawtooth">锯齿波</button>
    <button id="wTri" class="bon" data-zh="三角波" data-en="Triangle">三角波</button>
  </div>
  <div class="row"><label data-zh="谐波数 N" data-en="Harmonics N">谐波数 N</label><input id="harm" type="range" min="1" max="50" step="1" value="5"><span class="val" id="harmVal">5</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCircles" type="checkbox" checked> <span data-zh="显示本轮圆" data-en="Show circles">显示本轮圆</span></label>
    <label><input id="tglTarget" type="checkbox" checked> <span data-zh="目标虚线" data-en="Target outline">目标虚线</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('傅里叶级数 · 圆周运动叠出一切波形', 'Fourier Series · Circles Stack into Any Wave');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}

/* ================= 谐波系数(幅度,相位) ================= */
let wave = 'square';
let NH = 5;
function termsOf(w) {
  if (w === 'square') return [...Array(25)].map((_, i) => { const k = 2 * i + 1; return { k, a: 4 / (Math.PI * k) }; });
  if (w === 'saw') return [...Array(50)].map((_, i) => { const k = i + 1; return { k, a: 2 * (i % 2 ? -1 : 1) / (Math.PI * k) }; });
  return [...Array(25)].map((_, i) => { const k = 2 * i + 1; const s = i % 2 ? -1 : 1; return { k, a: 8 / (Math.PI * Math.PI * k * k) * s }; });
}
function targetY(w, u) {   // 目标波形(u∈[0,1) 一个周期),y∈[-1,1]
  const s = Math.sin(u * Math.PI * 2);
  if (w === 'square') return s >= 0 ? 1 : -1;
  if (w === 'saw') return 1 - 2 * (u % 1);
  return 1 - 4 * Math.abs(u - 0.5);
}

/* ================= 状态 ================= */
let phase = 0, playing = true, speed = 1;
let showLabels = true, showCircles = true, showTarget = true;
let trace = [];
let tGlobal = 0;

/* ================= 相位讲解(按谐波数点亮) ================= */
const STEPS = [
  { at: 1, b: '一切周期波 = 圆的叠加', d: '第一个圆匀速转一圈,笔尖画出一根正弦——最简单的「波」。',
    be: 'Any wave = circles', de: 'One circle spinning at constant speed draws a sine — the simplest wave there is.' },
  { at: 3, b: '谐波叠加', d: '再叠上 3 倍速的小圆、5 倍速的更小圆……每个圆的半径就是那条谐波的幅度,链尖开始逼近目标。',
    de: '', be: 'Harmonics stack', de: 'Stack a 3× smaller circle, then 5× … each radius is a harmonic\'s amplitude; the chain tip homes in on the target.' },
  { at: 9, b: '吉布斯振铃', d: '方波的跳变点旁,总有一个 ~9% 的过冲冲出目标线——加再多谐波也不消失,只是被挤得更窄。',
    be: 'Gibbs ringing', de: 'Beside each jump of the square wave a ~9% overshoot pokes past the target — it never vanishes, only narrows.' },
  { at: 25, b: '傅里叶的用处', d: '把信号拆成圆(频率)是现代世界的底座:JPEG、MP3、降噪、量子力学,全是「换到频率视角」。拖到 N=50 看看能像到什么程度。',
    be: 'Why Fourier matters', de: 'Splitting signals into frequencies underpins the modern world: JPEG, MP3, denoising, quantum mechanics. Push N = 50 to see how close it gets.' },
];
function stepIndex() {
  let si = 0;
  STEPS.forEach((s, i) => { if (NH >= s.at) si = i; });
  return si;
}

/* ================= 绘制 ================= */
const CXC = 430, CYC = 430, SC = 150;
function drawEpicycles(t) {
  const terms = termsOf(wave).slice(0, NH);
  let x = CXC, y = CYC;
  ctx.setLineDash([]);
  for (const { k, a } of terms) {
    const r = a * SC;
    if (showCircles) circle(x, y, r, null, 'rgba(199,125,255,.45)', 1.2);
    const nx = x + r * Math.cos(phase * k + Math.PI / 2);
    const ny = y + r * Math.sin(phase * k + Math.PI / 2);
    line(x, y, nx, ny, 'rgba(236,213,255,.85)', 1.6);
    x = nx; y = ny;
  }
  dot(x, y, 7, '#ffd166', 12);
  // 目标波形虚线(在波形区右端画出当前周期形状)
  if (showTarget) {
    ctx.strokeStyle = 'rgba(127,208,247,.35)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const u = i / 120;
      const wx = 780 + u * 700;
      const wy = CYC - targetY(wave, u) * SC * 0.62;
      i ? ctx.lineTo(wx, wy) : ctx.moveTo(wx, wy);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }
  return { x, y };
}
function dot(x, y, r, c, g) {
  if (g) { ctx.shadowColor = c; ctx.shadowBlur = g; }
  circle(x, y, r, c, null);
  ctx.shadowBlur = 0;
}
const WAVE0 = 780;
function drawTrace(t, tip) {
  trace.push(tip.y);
  const maxPts = 700;
  if (trace.length > maxPts) trace.shift();
  ctx.strokeStyle = '#7fd0f7'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  trace.forEach((yy, i) => {
    const x = WAVE0 + i * 1.0, y = yy;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  // 连接笔尖
  line(tip.x, tip.y, WAVE0 + trace.length - 1, trace[trace.length - 1], 'rgba(255,209,102,.5)', 1.2, [4, 4]);
  if (showLabels) {
    text(L('本轮圆链', 'epicycle chain'), CXC - 60, 130, 13, '#ecd5ff', 'center');
    text(L('笔尖轨迹 → 目标波形', 'pen trace → target wave'), WAVE0 + 340, CYC + SC * 0.62 + 60, 13, '#7fd0f7', 'center');
  }
}
function drawScale() {
  line(WAVE0 - 10, CYC, 1500, CYC, PAL.axis, 1);
  text('0', WAVE0 - 4, CYC + 22, 11, PAL.dim2, 'center');
  text(L('1 个周期', 'one period'), WAVE0 + 350, CYC + 22, 11, PAL.dim2, 'center');
  text('+1', CXC + 10, CYC - SC + 6, 11, PAL.dim2);
  text('-1', CXC + 10, CYC + SC - 2, 11, PAL.dim2);
}
function drawGibbs(t) {
  if (wave !== 'square' || NH < 9 || !showLabels) return;
  // 在跳变点附近标注过冲
  text(L('~9% 过冲:吉布斯振铃,永不消失', '~9% overshoot: Gibbs ringing, never dies'),
    WAVE0 + 130, CYC - SC * 0.62 - 34, 12.5, '#ffc188', 'center', 700);
}

/* ================= 主绘制 ================= */
function draw(t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawScale();
  const tip = drawEpicycles(t);
  drawTrace(t, tip);
  drawGibbs(t);
}

/* ================= UI / 主循环 ================= */
let last = performance.now();
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elHarm = document.getElementById('harm');
const elHarmVal = document.getElementById('harmVal');
const elSteps = document.getElementById('steps');
const wS = document.getElementById('wSquare'), wSa = document.getElementById('wSaw'), wT = document.getElementById('wTri');
const tglLabels = document.getElementById('tglLabels');
const tglCircles = document.getElementById('tglCircles');
const tglTarget = document.getElementById('tglTarget');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de || s.de2 || '')}</span>`;
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elHarm.addEventListener('input', () => { NH = parseInt(elHarm.value, 10); elHarmVal.textContent = NH; });
function setWave(w, btn) {
  wave = w; trace = [];
  [wS, wSa, wT].forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}
wS.addEventListener('click', () => setWave('square', wS));
wSa.addEventListener('click', () => setWave('saw', wSa));
wT.addEventListener('click', () => setWave('tri', wT));
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglCircles.addEventListener('change', () => { showCircles = tglCircles.checked; });
tglTarget.addEventListener('change', () => { showTarget = tglTarget.checked; });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) phase = (phase + dt * speed * 0.9) % 1;
  tGlobal += dt;
  draw(tGlobal);
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
requestAnimationFrame(frame);
</script>
</body>
</html>
