<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>傅里叶级数 · 圆周运动叠出一切波形</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4cc9f0;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1580a3;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.p { border-color: rgba(199,125,255,.9); color: #ecd5ff; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.p { color:#7048a8; }
  :root[data-theme="light"] .lbl.b { color:#1864ab; } :root[data-theme="light"] .lbl.g { color:#2b8a3e; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.ci { color: #ecd5ff; border-color: rgba(199,125,255,.7); }
  .chip.wv { color: #7fd0f7; border-color: rgba(127,208,247,.7); }
  .chip.gi { color: #ffc188; border-color: rgba(255,159,67,.7); }
  :root[data-theme="light"] .chip.ci { color: #7a2fb0; border-color: rgba(130,60,190,.7); }
  :root[data-theme="light"] .chip.wv { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.gi { color: #b26214; border-color: rgba(178,98,20,.7); }
  #waveRow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #waveRow .brl { font-size: 12px; color: var(--text2); }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: center; line-height: 1.25;
    font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(76,201,240,.14); }
  :root[data-theme="light"] .bon.on { background: rgba(21,128,163,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 10px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: default;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li.on { background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(21,128,163,.10); border-color: rgba(21,128,163,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="傅里叶级数：圆周运动叠出一切波形" data-en="Fourier series: circles stacking into any waveform">傅里叶级数：圆周运动叠出一切波形</h1>
  <div class="sub" data-zh="每个圆匀速转,链条末端画出方波/锯齿/三角——笔尖轨迹在空间里立成一面会生长的波形墙;谐波越多越像;方波的角上永远有一根跳不完的刺(吉布斯) · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="Each circle spins at its own rate; the chain's tip traces square / sawtooth / triangle waves — the pen trace rises as a living wall of waveform; more harmonics, closer fit; the Gibbs overshoot never dies · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">每个圆匀速转,链条末端画出方波/锯齿/三角——笔尖轨迹在空间里立成一面会生长的波形墙;谐波越多越像;方波的角上永远有一根跳不完的刺(吉布斯) · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip ci" data-zh="本轮圆(半径=谐波幅度)" data-en="epicycles (r = harmonic amplitude)">本轮圆(半径=谐波幅度)</span>
    <span class="chip wv" data-zh="笔尖轨迹=目标波形墙" data-en="pen trace = target wave wall">笔尖轨迹=目标波形墙</span>
    <span class="chip gi" data-zh="吉布斯振铃" data-en="Gibbs ringing">吉布斯振铃</span>
  </div>
  <div id="waveRow">
    <span class="brl" data-zh="目标波形：" data-en="Target:">目标波形：</span>
    <button id="wSquare" class="bon on" data-zh="方波" data-en="Square">方波</button>
    <button id="wSaw" class="bon" data-zh="锯齿波" data-en="Sawtooth">锯齿波</button>
    <button id="wTri" class="bon" data-zh="三角波" data-en="Triangle">三角波</button>
  </div>
  <div class="row"><label data-zh="谐波数 N" data-en="Harmonics N">谐波数 N</label><input id="harm" type="range" min="1" max="50" step="1" value="5"><span class="val" id="harmVal">5</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglCircles" type="checkbox" checked> <span data-zh="显示本轮圆" data-en="Show circles">显示本轮圆</span></label>
    <label><input id="tglTarget" type="checkbox" checked> <span data-zh="目标虚线" data-en="Target outline">目标虚线</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言(全站共享模式) ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
let grid = null;
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  scene.fog = new THREE.Fog(THEME === 'light' ? 0xeef1f6 : 0x10141b, 18, 34);
  if (grid) {
    grid.material.color.set(THEME === 'light' ? 0x9aa7b8 : 0x3a4656);
    grid.material.opacity = THEME === 'light' ? 0.55 : 0.35;
  }
  ringMat.color.set(THEME === 'light' ? 0x7a2fb0 : 0xc77dff);
  ringMat.opacity = THEME === 'light' ? 0.55 : 0.4;
  spokes.material.color.set(THEME === 'light' ? 0x5a2d91 : 0xecd5ff);
  spokes.material.opacity = THEME === 'light' ? 0.8 : 0.85;
  dotMat.color.set(THEME === 'light' ? 0x6a3fb5 : 0xd9b8ff);
  edge.material.color.set(THEME === 'light' ? 0x0c7ba6 : 0x7fd0f7);
  wall.material.color.set(THEME === 'light' ? 0x35a8d8 : 0x2b9fc9);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('傅里叶级数 · 圆周运动叠出一切波形', 'Fourier Series · Circles Stack into Any Wave');
  for (const r of labelReg) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 120);
camera.position.set(1.6, 3.4, 8.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.6, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(3, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

/* 地面网格(幅度墙立在 y=0 之上) */
grid = new THREE.GridHelper(30, 30, 0x3a4656, 0x3a4656);
grid.material.transparent = true;
grid.material.opacity = 0.35;
grid.position.set(2, 0, 0);
scene.add(grid);

/* ================= 布局常量 ================= */
const SC = 0.95;                      // 幅度 1 → 场景单位
const CY = 1.9;                       // 圆链中心高 / 波形中线
const CHAIN_X = -3.3, CHAIN_Z = 0;    // 圆链所在竖直平面
const TRACE_X0 = -0.35;               // 波形墙起点(最新样本在左,靠近圆链)
const MAXS = 400;                     // 波形墙样本数
const DX = 0.0205;                    // 样本间距
const WALL_TH = 0.16;                 // 波形墙顶面半厚度(z 方向)

/* ================= 谐波系数 ================= */
let wave = 'square';
let NH = clamp(Math.round(qsFloat('n', 5)), 1, 50);
function termsOf(w) {
  if (w === 'square') return [...Array(25)].map((_, i) => { const k = 2 * i + 1; return { k, a: 4 / (Math.PI * k) }; });
  if (w === 'saw') return [...Array(50)].map((_, i) => { const k = i + 1; return { k, a: 2 * (i % 2 ? -1 : 1) / (Math.PI * k) }; });
  return [...Array(25)].map((_, i) => { const k = 2 * i + 1; const s = i % 2 ? -1 : 1; return { k, a: 8 / (Math.PI * Math.PI * k * k) * s }; });
}
function targetY(w, u) {   // 目标波形(u∈[0,1) 一个周期),y∈[-1,1]
  const s = Math.sin(u * Math.PI * 2);
  if (w === 'square') return s >= 0 ? 1 : -1;
  if (w === 'saw') return 1 - 2 * (u % 1);
  return 1 - 4 * Math.abs(u - 0.5);
}

/* ================= 状态 ================= */
let phase = 0, playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.1, 3);
let showLabels = qsBool('labels', true), showCircles = true, showTarget = true;
let trace = [];                       // trace[0] 最新

/* ================= 圆链(3D) ================= */
const chainG = new THREE.Group();
scene.add(chainG);
const ringMat = new THREE.LineBasicMaterial({ color: 0xc77dff, transparent: true, opacity: 0.4, toneMapped: false });
let rings = [];                       // LineLoop 列表,与谐波一一对应
const SEG = 72;
const unitCircle = [];
for (let i = 0; i < SEG; i++) {
  const a = i / SEG * Math.PI * 2;
  unitCircle.push(new THREE.Vector3(Math.cos(a), Math.sin(a), 0));
}
function rebuildRings() {
  for (const r of rings) { chainG.remove(r); r.geometry.dispose(); }
  rings = [];
  for (let i = 0; i < NH; i++) {
    const g = new THREE.BufferGeometry().setFromPoints(unitCircle);
    const loop = new THREE.LineLoop(g, ringMat);
    loop.visible = showCircles;
    chainG.add(loop);
    rings.push(loop);
  }
  spokesPos = new Float32Array(NH * 2 * 3);
  spokes.geometry.dispose();
  spokes.geometry = new THREE.BufferGeometry();
  spokes.geometry.setAttribute('position', new THREE.BufferAttribute(spokesPos, 3));
}
/* 辐条:一个 LineSegments 装下所有半径杆 */
let spokesPos = new Float32Array(0);
const spokes = new THREE.LineSegments(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({ color: 0xecd5ff, transparent: true, opacity: 0.85, toneMapped: false }));
chainG.add(spokes);
/* 节点小球:每个圆心/端点 */
const DOT_MAX = 51;
const dotGeo = new THREE.SphereGeometry(0.028, 8, 6);
const dotMat = new THREE.MeshBasicMaterial({ color: 0xd9b8ff, transparent: true, opacity: 0.9, toneMapped: false });
const dots = new THREE.InstancedMesh(dotGeo, dotMat, DOT_MAX);
dots.count = 0;
dots.frustumCulled = false;
chainG.add(dots);
/* 笔尖 */
const pen = new THREE.Mesh(new THREE.SphereGeometry(0.062, 14, 10),
  new THREE.MeshBasicMaterial({ color: 0xffd166, toneMapped: false }));
scene.add(pen);
function haloTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  grad.addColorStop(0, 'rgba(255,209,102,.9)');
  grad.addColorStop(0.4, 'rgba(255,209,102,.28)');
  grad.addColorStop(1, 'rgba(255,209,102,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const penHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: haloTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
penHalo.scale.setScalar(0.5);
scene.add(penHalo);

/* ================= 波形墙(轨迹的 3D 化) ================= */
/* 每个样本 4 个顶点:顶前/顶后/底前/底后;索引一次性建好 */
const wallPos = new Float32Array(MAXS * 4 * 3);
const wallGeo = new THREE.BufferGeometry();
wallGeo.setAttribute('position', new THREE.BufferAttribute(wallPos, 3));
{
  const idx = [];
  for (let i = 0; i < MAXS - 1; i++) {
    const a = i * 4, b = (i + 1) * 4;
    idx.push(a, b, a + 1, a + 1, b, b + 1);              // 顶面条带
    idx.push(a, a + 2, b, b, a + 2, b + 2);              // 前墙
    idx.push(a + 1, b + 1, a + 3, a + 3, b + 1, b + 3);  // 后墙
  }
  wallGeo.setIndex(idx);
}
const wall = new THREE.Mesh(wallGeo, new THREE.MeshStandardMaterial({
  color: 0x2b9fc9, roughness: 0.55, metalness: 0.15,
  transparent: true, opacity: 0.30, side: THREE.DoubleSide, depthWrite: false }));
wall.frustumCulled = false;
scene.add(wall);
/* 顶边亮线 */
const edgePos = new Float32Array(MAXS * 3);
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute('position', new THREE.BufferAttribute(edgePos, 3));
const edge = new THREE.Line(edgeGeo, new THREE.LineBasicMaterial({ color: 0x7fd0f7, transparent: true, opacity: 0.95, toneMapped: false }));
edge.frustumCulled = false;
scene.add(edge);
/* 中线(波形轴) */
const axisGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(TRACE_X0 - 0.25, CY, 0), new THREE.Vector3(TRACE_X0 + MAXS * DX + 0.4, CY, 0)]);
const axisLine = new THREE.Line(axisGeo, new THREE.LineBasicMaterial({ color: 0x8b97a8, transparent: true, opacity: 0.5, toneMapped: false }));
scene.add(axisLine);
/* 目标波形虚线(浮在墙面前方,相位与墙上样本锁定:N→∞ 时墙沿恰好贴合它) */
const TGT_N = 160;
const tgtPos = new Float32Array((TGT_N + 1) * 3);
const tgtGeo = new THREE.BufferGeometry();
tgtGeo.setAttribute('position', new THREE.BufferAttribute(tgtPos, 3));
const targetLine = new THREE.Line(tgtGeo,
  new THREE.LineDashedMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.8, dashSize: 0.14, gapSize: 0.1, toneMapped: false }));
targetLine.frustumCulled = false;
scene.add(targetLine);
function updateTarget() {
  for (let i = 0; i <= TGT_N; i++) {
    const u = i / TGT_N;
    /* 墙上 x=u 处的样本相位为 phase-u(左新右旧),目标线取同一相位 → 始终对位 */
    const uw = ((phase - u) % 1 + 1) % 1;
    tgtPos[i * 3] = TRACE_X0 + u * MAXS * DX;
    tgtPos[i * 3 + 1] = CY + targetY(wave, uw) * SC;
    tgtPos[i * 3 + 2] = WALL_TH + 0.12;
  }
  tgtGeo.attributes.position.needsUpdate = true;
  targetLine.computeLineDistances();
  targetLine.visible = showTarget;
}
/* 笔尖 → 墙头 连接线 */
const linkGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const linkLine = new THREE.Line(linkGeo, new THREE.LineDashedMaterial({
  color: 0xffd166, transparent: true, opacity: 0.55, dashSize: 0.09, gapSize: 0.07, toneMapped: false }));
scene.add(linkLine);

function updateWall() {
  const n = trace.length;
  for (let i = 0; i < n; i++) {
    const x = TRACE_X0 + i * DX;
    const y = CY + trace[i] * SC;
    const o = i * 12;
    wallPos[o]     = x; wallPos[o + 1]  = y;    wallPos[o + 2]  = WALL_TH;   // 顶前
    wallPos[o + 3] = x; wallPos[o + 4]  = y;    wallPos[o + 5]  = -WALL_TH;  // 顶后
    wallPos[o + 6] = x; wallPos[o + 7]  = 0.02; wallPos[o + 8]  = WALL_TH;   // 底前
    wallPos[o + 9] = x; wallPos[o + 10] = 0.02; wallPos[o + 11] = -WALL_TH;  // 底后
    edgePos[i * 3] = x; edgePos[i * 3 + 1] = y; edgePos[i * 3 + 2] = 0;
  }
  wallGeo.attributes.position.needsUpdate = true;
  edgeGeo.attributes.position.needsUpdate = true;
  wallGeo.computeVertexNormals();
  wallGeo.setDrawRange(0, Math.max(0, (n - 1) * 18));
  edgeGeo.setDrawRange(0, n);
}

/* ================= 场景标签 ================= */
const labelReg = [];
let labelsOn = showLabels;
function addLabel(textFn, pos, cls = '', vis = () => true) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  labelReg.push({ o, text: textFn, vis });
  div.textContent = textFn();
  return o;
}
function refreshLabels() {
  for (const r of labelReg) r.o.visible = labelsOn && r.vis() && r.text() !== '';
}
addLabel(() => L('本轮圆链:半径=谐波幅度', 'epicycle chain: r = harmonic amplitude'),
  new THREE.Vector3(CHAIN_X, CY + SC + 0.75, 0), 'p');
addLabel(() => L('笔尖轨迹 → 立成波形墙', 'pen trace → rising wave wall'),
  new THREE.Vector3(TRACE_X0 + MAXS * DX * 0.55, 0.35, 0), 'b');
addLabel(() => L('0', '0'), new THREE.Vector3(TRACE_X0 - 0.3, CY - 0.25, 0), 'st');
addLabel(() => L('1 个周期', 'one period'), new THREE.Vector3(TRACE_X0 + MAXS * DX * 0.5, CY - 0.28, 0), 'st');
addLabel(() => L('+1', '+1'), new THREE.Vector3(CHAIN_X - 0.55, CY + SC, 0), 'st');
addLabel(() => L('-1', '-1'), new THREE.Vector3(CHAIN_X - 0.55, CY - SC, 0), 'st');
addLabel(() => L('~9% 过冲:吉布斯振铃,永不消失', '~9% overshoot: Gibbs ringing, never dies'),
  new THREE.Vector3(TRACE_X0 + MAXS * DX * 0.22, CY + SC + 0.55, 0), 'o',
  () => wave === 'square' && NH >= 9);

/* ================= 相位讲解(按谐波数点亮) ================= */
const STEPS = [
  { at: 1, b: '一切周期波 = 圆的叠加', d: '第一个圆匀速转一圈,笔尖画出一根正弦——最简单的「波」。旋转视角看:圆链躺在竖直平面里,轨迹在身旁立成墙。',
    be: 'Any wave = circles', de: 'One circle spinning at constant speed draws a sine — the simplest wave there is. Orbit around: the chain lies in a vertical plane, the trace rises as a wall beside it.' },
  { at: 3, b: '谐波叠加', d: '再叠上 3 倍速的小圆、5 倍速的更小圆……每个圆的半径就是那条谐波的幅度,链尖开始逼近目标。',
    be: 'Harmonics stack', de: 'Stack a 3× smaller circle, then 5× … each radius is a harmonic\'s amplitude; the chain tip homes in on the target.' },
  { at: 9, b: '吉布斯振铃', d: '方波的跳变点旁,总有一个 ~9% 的过冲冲出目标线——加再多谐波也不消失,只是被挤得更窄。',
    be: 'Gibbs ringing', de: 'Beside each jump of the square wave a ~9% overshoot pokes past the target — it never vanishes, only narrows.' },
  { at: 25, b: '傅里叶的用处', d: '把信号拆成圆(频率)是现代世界的底座:JPEG、MP3、降噪、量子力学,全是「换到频率视角」。拖到 N=50 看看能像到什么程度。',
    be: 'Why Fourier matters', de: 'Splitting signals into frequencies underpins the modern world: JPEG, MP3, denoising, quantum mechanics. Push N = 50 to see how close it gets.' },
];
function stepIndex() {
  let si = 0;
  STEPS.forEach((s, i) => { if (NH >= s.at) si = i; });
  return si;
}

/* ================= UI / 主循环 ================= */
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elHarm = document.getElementById('harm');
const elHarmVal = document.getElementById('harmVal');
const elSteps = document.getElementById('steps');
const wS = document.getElementById('wSquare'), wSa = document.getElementById('wSaw'), wT = document.getElementById('wTri');
const tglLabels = document.getElementById('tglLabels');
const tglCircles = document.getElementById('tglCircles');
const tglTarget = document.getElementById('tglTarget');
const tglRotate = document.getElementById('tglRotate');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === stepIndex()));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elHarm.value = NH; elHarmVal.textContent = NH;
elHarm.addEventListener('input', () => { NH = parseInt(elHarm.value, 10); elHarmVal.textContent = NH; rebuildRings(); });
function setWave(w, btn) {
  wave = w; trace = [];
  [wS, wSa, wT].forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}
wS.addEventListener('click', () => setWave('square', wS));
wSa.addEventListener('click', () => setWave('saw', wSa));
wT.addEventListener('click', () => setWave('tri', wT));
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; labelsOn = showLabels; refreshLabels(); });
tglCircles.addEventListener('change', () => { showCircles = tglCircles.checked; for (const r of rings) r.visible = showCircles; });
tglTarget.addEventListener('change', () => { showTarget = tglTarget.checked; if (targetLine) targetLine.visible = showTarget; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
tglLabels.checked = showLabels;
controls.autoRotate = qsBool('spin', true);
tglRotate.checked = controls.autoRotate;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1;
const _m4 = new THREE.Matrix4();
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  if (playing) {
    /* 相位推进:基频恰好一个周期铺满整面波形墙(与目标虚线对齐) */
    phase = (phase + dt * speed * 60 / MAXS) % 1;
    /* 圆链递推 */
    const terms = termsOf(wave).slice(0, NH);
    let x = CHAIN_X, y = CY;
    for (let i = 0; i < terms.length; i++) {
      const { k, a } = terms[i];
      const r = a * SC;
      /* sin 相位:笔尖 y = Σa_k·sin(2πkφ),即目标波形的真傅里叶部分和 */
      const ang = phase * k * Math.PI * 2;
      const nx = x + r * Math.cos(ang);
      const ny = y + r * Math.sin(ang);
      if (rings[i]) {
        rings[i].position.set(x, y, CHAIN_Z);
        rings[i].scale.setScalar(r);
      }
      spokesPos[i * 6] = x; spokesPos[i * 6 + 1] = y; spokesPos[i * 6 + 2] = CHAIN_Z;
      spokesPos[i * 6 + 3] = nx; spokesPos[i * 6 + 4] = ny; spokesPos[i * 6 + 5] = CHAIN_Z;
      dots.setMatrixAt(i, _m4.makeTranslation(nx, ny, CHAIN_Z));
      x = nx; y = ny;
    }
    spokes.geometry.attributes.position.needsUpdate = true;
    spokes.geometry.setDrawRange(0, NH * 2);
    dots.count = NH;
    dots.instanceMatrix.needsUpdate = true;
    pen.position.set(x, y, CHAIN_Z);
    penHalo.position.set(x, y, CHAIN_Z);
    /* 轨迹 → 波形墙 */
    trace.unshift((y - CY) / SC);
    if (trace.length > MAXS) trace.pop();
    updateWall();
    /* 连接线 */
    const lp = linkGeo.attributes.position.array;
    lp[0] = x; lp[1] = y; lp[2] = CHAIN_Z;
    lp[3] = TRACE_X0; lp[4] = CY + trace[0] * SC; lp[5] = 0;
    linkGeo.attributes.position.needsUpdate = true;
    linkLine.computeLineDistances();
  }
  updateTarget();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  refreshLabels();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
rebuildRings();
updateTarget();
applyTheme();
applyLang();
setPlayLabel();
start();
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '▴' : '▾';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
