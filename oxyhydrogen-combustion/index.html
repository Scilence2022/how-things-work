<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爆鸣气与燃烧三角 · 安静的混合气与一声「轰」</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#e8590c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  .lbl.g { border-color: rgba(255,169,77,.9); color: #ffe0ae; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.r { border-color: rgba(201,42,42,.9); color: #c92a2a; }
  .pop { display: inline-block; opacity: 0; }
  .pop.on { animation: pop .8s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(.3); opacity: 0; }
    22% { transform: scale(1.9); opacity: 1; }
    45% { transform: scale(1.15); }
    75% { opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.o { color: #ffa94d; }
  #stats .v.ok { color: #69db7c; }
  #stats .v.bad { color: #ff6b6b; }
  :root[data-theme="light"] #stats .v.o { color: #e8590c; }
  :root[data-theme="light"] #stats .v.ok { color: #2b8a3e; }
  :root[data-theme="light"] #stats .v.bad { color: #c92a2a; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h { color: #dee2e6; border-color: rgba(222,226,230,.55); }
  .chip.o { color: #ffc9c9; border-color: rgba(255,107,107,.7); }
  .chip.r { color: #ffd8a8; border-color: rgba(255,169,77,.7); }
  :root[data-theme="light"] .chip.h { color: #495057; border-color: rgba(73,80,87,.5); }
  :root[data-theme="light"] .chip.o { color: #c92a2a; border-color: rgba(201,42,42,.6); }
  :root[data-theme="light"] .chip.r { color: #b3521c; border-color: rgba(179,82,28,.6); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 30%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,169,77,.6); background: rgba(255,169,77,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(232,89,12,.55); background: rgba(232,89,12,.10); }
  #ext { display: flex; gap: 6px; margin-top: 6px; }
  #ext .abtn { flex: 1 1 0; padding: 6px 4px; font-size: 11.5px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 66px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #cvChart { display: block; width: 100%; height: 112px; margin-top: 8px;
    border: 1px solid var(--panel-border); border-radius: 9px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(232,89,12,.08); border-color: rgba(232,89,12,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffd9a3; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="爆鸣气与燃烧三角:为什么 2:1 最响" data-en="Oxyhydrogen & the fire triangle: why 2:1 bangs loudest">爆鸣气与燃烧三角:为什么 2:1 最响</h1>
  <div class="sub" data-zh="氢氧各自稳定,混好也安静——能垒锁住亚稳态;一点火花,分支链式 1→2→4→8,自由基过限,毫秒内全反应:轰!2:1 最响;灭火 = 拆掉燃烧三角任一角 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="H₂ and O₂ are stable, even mixed — the barrier holds a metastable state. One spark, branching chains 1→2→4→8, radicals pass the limit, the whole volume reacts in milliseconds: bang! Loudest at 2:1; extinguishing = remove any leg of the fire triangle · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">氢氧各自稳定,混好也安静——能垒锁住亚稳态;一点火花,分支链式 1→2→4→8,自由基过限,毫秒内全反应:轰!2:1 最响;灭火 = 拆掉燃烧三角任一角 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="自由基计数" data-en="radicals">自由基计数</span><span class="v o" id="stR">0</span>
  <span class="k" data-zh="反应进度" data-en="reaction progress">反应进度</span><span class="v" id="stP">0<small> %</small></span>
  <span class="k" data-zh="放热量" data-en="heat released">放热量</span><span class="v" id="stQ">0<small> kJ</small></span>
  <span class="k" data-zh="当量比 φ" data-en="equivalence φ">当量比 φ</span><span class="v" id="stPhi">1.00</span>
  <span class="k" data-zh="判定" data-en="verdict">判定</span><span class="v ok" id="stV">—</span>

  <div id="legend">
    <span class="chip h" data-zh="H₂ 分子(白)" data-en="H₂ molecule (white)">H₂ 分子(白)</span>
    <span class="chip o" data-zh="O₂ 分子(红)" data-en="O₂ molecule (red)">O₂ 分子(红)</span>

  <div class="row"><label data-zh="混合比 H₂:O₂" data-en="Mix ratio H₂:O₂">混合比 H₂:O₂</label><input id="ratio" type="range" min="0.25" max="4" step="0.05" value="2"><span class="val" id="ratioVal">2.00 : 1</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="ext">
    <button class="abtn" id="btnLid" data-zh="盖盖断氧" data-en="lid: cut O₂">盖盖断氧</button>
    <button class="abtn" id="btnWater" data-zh="喷水降温" data-en="water: cool">喷水降温</button>

  </div>
  <canvas id="cvChart"></canvas>

      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="图示" data-en="Charts">图示</span></label>

    <a href="../activation-energy/" data-zh="为什么混合气能安静待着" data-en="why the mixture sits quietly">为什么混合气能安静待着</a>
    <a href="../water-electrolysis/" data-zh="爆鸣气从哪里来" data-en="where detonating gas comes from">爆鸣气从哪里来</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const labelReg = [];
const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  const cs = getComputedStyle(htmlEl);
  PAL.dim = cs.getPropertyValue('--text2').trim();
  PAL.dim2 = cs.getPropertyValue('--text3').trim();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('爆鸣气与燃烧三角', 'Oxyhydrogen & the fire triangle');
  for (const r of labelReg) if (!r.span) r.o.element.textContent = r.text();
  buildSteps(); setPlayLabel(); updateFormula(); refreshLabels();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.7, 2.2, 7.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.35);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  steel: mat(0xcfd4dc, { metalness: 0.8, roughness: 0.25 }),
  brass: mat(0xd5a34c, { metalness: 0.75, roughness: 0.3 }),
  carbon: mat(0x2b3240, { roughness: 0.6 }),
  film: new THREE.MeshStandardMaterial({ color: 0x9db4d6, transparent: true, opacity: 0.13,
    roughness: 0.15, metalness: 0, side: THREE.DoubleSide, depthWrite: false,
    emissive: 0x5c7ca8, emissiveIntensity: 0.05 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xbde9ff, transparent: true, opacity: 0.15,
    roughness: 0.1, metalness: 0, side: THREE.DoubleSide, depthWrite: false }),
};

/* ================= 布景:底座 + 肥皂泡(爆鸣气)+ 喷嘴(对照)================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.16, 4.4), M.floor);
floor.position.y = -0.08;
scene.add(floor);
const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.66, 0.3, 28), M.frame);
pedestal.position.y = 0.15;
scene.add(pedestal);
const BUB = new THREE.Vector3(0, 1.35, 0), BUB_R = 1.05;
const bubble = new THREE.Mesh(new THREE.SphereGeometry(BUB_R, 48, 32), M.film);
bubble.position.copy(BUB);
scene.add(bubble);
/* 电火花电极 */
for (const s of [-1, 1]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.26, 8), M.carbon);
  post.position.set(s * 0.055, 0.43, 0);
  scene.add(post);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), M.steel);
  tip.position.set(s * 0.055, 0.565, 0);
  scene.add(tip);
}
const sparkGlow = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0xffd8a8, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false }));
sparkGlow.position.set(0, 0.565, 0);
scene.add(sparkGlow);
/* 纯氢喷嘴 + 阀门 */

let consumedH2m = 0, consumedO2m = 0, Qjet = 0, jetBurn = 0;
let hist = [], histAcc = 0, jetAcc = 0, scriptQuench = -1;
const phi = () => ratio / 2;
const heatKJ = () => 242 * consumedH2m * 3 / NMOL;
const progress = () => MODE === 'jet' ? Math.min(1, jetBurn / 3) : (consumedH2m + consumedO2m) / NMOL;
const legCut = () => lidOn || cooled || valveClosed;
const jetBurning = () => MODE === 'jet' && state === 'burn' && !legCut();
function legName() { return lidOn ? L('氧(盖盖)', 'O₂ (lid)') : cooled ? L('着火点(喷水)', 'heat (water)') : L('燃料(关阀)', 'fuel (valve)'); }

function consumeMol(type, near) {
  let best = null, bd = 1e9;
  for (const m of mol) if (m.alive && m.type === type) {
    const d = m.p.distanceToSquared(near);
    if (d < bd) { bd = d; best = m; }
  }
  if (!best) return false;
  best.alive = false;
  if (type === 'H2') { consumedH2m++; nH2Left--; } else { consumedO2m++; nO2Left--; }
  spawnMist(best.p, new THREE.Vector3(rand(-0.2, 0.2), rand(0, 0.3), rand(-0.2, 0.2)), 0.5, 0.035, C_PUFF, 0);
  return true;
}
function react(i) {
  const r = rads[i];
  if (legCut()) return;                        // 拆掉任意一角:链终止
  const need = r.kind === 'H' ? 'O2' : 'H2';
  const have = r.kind === 'H' ? nO2Left > 0 : nH2Left > 0;
  if (!have || !consumeMol(need, r.p)) return; // 缺反应物:复合消亡
  if (r.kind === 'H') { spawnRad('OH', r.p); spawnRad('O', r.p); }    // H·+O₂→OH·+O·
  else if (r.kind === 'O') { spawnRad('OH', r.p); spawnRad('H', r.p); } // O·+H₂→OH·+H·
  else spawnRad('H', r.p);                     // OH·+H₂→H₂O+H·(传播)
  spawnMist(r.p, new THREE.Vector3(rand(-0.3, 0.3), rand(0.1, 0.5), rand(-0.3, 0.3)), 0.6, 0.05, C_MIST, 0);
}
function ignite() {
  if (state !== 'idle') return;
  sparkK = 1;
  state = 'burn';
  if (MODE === 'mix') {
    spawnRad('H', new THREE.Vector3(0, 0.565, 0));
    spawnRad('H', new THREE.Vector3(0, 0.565, 0));
    for (let i = 0; i < 8; i++)
      spawnMist(new THREE.Vector3(0, 0.565, 0),
        new THREE.Vector3(rand(-0.8, 0.8), rand(0.2, 1), rand(-0.8, 0.8)), 0.4, 0.03, C_SPARK, -1);
  }
}
function startBoom() {
  while (nH2Left >= 2 && nO2Left >= 1) {       // 恰按 2:1 耗尽,过量气剩余
    consumeMol('H2', BUB); consumeMol('H2', BUB); consumeMol('O2', BUB);
  }
  rads.length = 0;
  state = 'boom'; boomT = 0;
  yieldLast = clamp(progress() / 0.98, 0.12, 1);
  bubble.visible = false;
  const N = Math.round(90 + 200 * yieldLast);
  for (let i = 0; i < N; i++) {
    const d = new THREE.Vector3(rand(-1, 1), rand(-0.4, 1), rand(-1, 1)).normalize();
    spawnMist(BUB.clone().addScaledVector(d, rand(0, BUB_R * 0.8)),
      d.multiplyScalar(rand(1.2, 3.4) * (0.5 + yieldLast)), rand(1.4, 2.6), rand(0.05, 0.09), C_MIST, -1.1);
  }
  firePop();
}
function physStep(h) {
  tSim += h;
  if (sprayT > 0) sprayT -= h;
  if (MODE === 'mix') {
    if (state === 'burn') {
      for (let i = rads.length - 1; i >= 0; i--) {
        const r = rads[i];
        r.t -= h * (legCut() ? 8 : 1);
        r.p.addScaledVector(r.v, h);
        const loc = r.p.clone().sub(BUB);
        if (loc.length() > BUB_R - 0.18) {
          loc.setLength(BUB_R - 0.18);
          r.p.copy(BUB).add(loc);
          r.v.negate();
        }
        if (r.t <= 0) { react(i); rads.splice(i, 1); }
      }
      if (rads.length === 0) state = 'idle';
      else if (!legCut() && rads.length >= THRESH) startBoom();
    } else if (state === 'boom') {
      boomT += h;
      if (boomT > 1) state = 'done';
    }
  } else {
    if (scriptQuench > 0) {
      scriptQuench -= h;
      if (scriptQuench <= 0 && !valveClosed) { valveClosed = true; btnValve.classList.add('on'); }
    }
    if (state === 'burn') {
      if (!legCut()) { Qjet += 12 * h; jetBurn += 12 * h / 242; }
      else state = 'idle';
    }
  }
  histAcc += h;
  if (histAcc >= 0.1) {
    histAcc = 0;
    hist.push(MODE === 'mix' ? rads.length : (jetBurning() ? 6 : 0));
    if (hist.length > 110) hist.shift();
  }
}
function fastForward(sec) {
  const n = Math.round(clamp(sec, 0, 120) / 0.05);
  for (let i = 0; i < n; i++) physStep(0.05);
}
function resetAll() {
  state = 'idle'; boomT = 0; sparkK = 0; slowMul = 1;
  consumedH2m = 0; consumedO2m = 0; Qjet = 0; jetBurn = 0;
  rads.length = 0; hist.length = 0; histAcc = 0; scriptQuench = -1;
  lidOn = false; lidK = 0; valveClosed = false; valveA = 0; cooled = false; sprayT = 0;
  document.getElementById('btnLid').classList.remove('on');
  document.getElementById('btnWater').classList.remove('on');
  document.getElementById('btnValve').classList.remove('on');
  tSim = 0;
  for (const m of mistP) m.life = 0;
  for (const j of jetP) j.life = 0;
  bubble.visible = MODE === 'mix';
  atoms.visible = bonds.visible = MODE === 'mix';
  nozzle.visible = MODE === 'jet';
  flameGrp.visible = false;
  flash.intensity = 0;
  resetPool();
}

function stepIndex() {
  if (MODE === 'jet' || legCut()) return 5;
  if (state === 'boom' || state === 'done') return Math.abs(phi() - 1) <= 0.2 ? 4 : 3;
  if (rads.length >= 9) return 3;
  if (rads.length >= 2) return 2;
  if (rads.length > 0) return 1;
  return 0;
}

function setSpeed(v) { speed = clamp(v, 0.2, 3); elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×'; }
function setRatio(v) { ratio = clamp(v, 0.25, 4); elRatio.value = ratio; elRatioVal.textContent = ratio.toFixed(2) + ' : 1'; }
function updateFormula() {
  if (MODE === 'mix') {
    formulaEl.innerHTML = L(
      `<b>分支:H· + O₂ → OH· + O·</b>,<b>O· + H₂ → OH· + H·</b> — 每步 1→2<br>` +
      `总反应 <b>2H₂ + O₂ → 2H₂O</b>,ΔH = −572 kJ/mol · H₂:O₂ = ${ratio.toFixed(2)}:1(φ=${phi().toFixed(2)}) · 已放热 ${heatKJ().toFixed(0)} kJ`,
      `<b>Branching: H· + O₂ → OH· + O·</b>, <b>O· + H₂ → OH· + H·</b> — 1→2 each step<br>` +
      `Net <b>2H₂ + O₂ → 2H₂O</b>, ΔH = −572 kJ/mol · H₂:O₂ = ${ratio.toFixed(2)}:1 (φ=${phi().toFixed(2)}) · heat so far ${heatKJ().toFixed(0)} kJ`);
  } else {
    formulaEl.innerHTML = L(
      `<b>扩散燃烧 vs 预混爆炸</b>:纯氢喷流只在喷口与空气的接触面上缓慢反应——没有预混,就没有自由基分支失控<br>` +
      `燃烧三角 = <b>可燃物 + 助燃物 + 着火点</b>:盖盖断氧 · 喷水降温 · 关阀断燃料,拆任一角即灭`,
      `<b>Diffusion burn vs premixed boom</b>: a pure H₂ jet reacts only at the air interface — no premix, no branching runaway<br>` +
      `Fire triangle = <b>fuel + oxidizer + heat</b>: lid cuts O₂ · water cools · valve cuts fuel — remove any leg and it dies`);
  }
}
function verdictTxt() {
  if (MODE === 'jet') {
    if (legCut()) return [L('已熄灭:缺' + legName(), 'out: missing ' + legName()), 'bad'];
    return jetBurning() ? [L('缓燃(扩散焰)', 'slow burn (diffusion)'), 'ok'] : [L('待命', 'standby'), 'ok'];
  }
  if (state === 'burn') return legCut()
    ? [L('链终止:缺' + legName(), 'terminating: missing ' + legName()), 'bad']
    : [L('分支中 → 逼近爆炸', 'branching → nearing boom'), 'o'];
  if (state === 'boom' || state === 'done') return progress() >= 0.55
    ? [L('爆炸!', 'DETONATION!'), 'bad']
    : [L('弱爆鸣(离 2:1 远)', 'weak pop (far from 2:1)'), 'o'];
  return legCut()
    ? [L('缺' + legName() + ',点不着', 'missing ' + legName() + ', no ignition'), 'bad']
    : progress() > 0 ? [L('部分反应', 'partial'), 'o'] : [L('亚稳 · 安静', 'metastable · quiet'), 'ok'];
}
setRatio(ratio);
setSpeed(speed);
elRatio.addEventListener('input', () => {
  setRatio(+elRatio.value);
  if (MODE === 'mix' && state === 'idle' && progress() === 0) resetPool();
});
elSpd.addEventListener('input', () => setSpeed(+elSpd.value));
btnIgnite.addEventListener('click', () => ignite());
btnReset.addEventListener('click', () => resetAll());
btnJet.addEventListener('click', () => { setMode(MODE === 'mix' ? 'jet' : 'mix'); resetAll(); });
btnLid.addEventListener('click', () => { lidOn = !lidOn; btnLid.classList.toggle('on', lidOn); });
btnWater.addEventListener('click', () => {
  cooled = true; sprayT = 1.4; btnWater.classList.add('on');
  for (let i = 0; i < 46; i++)
    spawnMist(new THREE.Vector3(rand(-0.5, 0.5), 3.4, rand(-0.2, 0.8)),
      new THREE.Vector3(rand(-0.15, 0.15), -2.8, rand(-0.15, 0.15)), 1.2, 0.05, C_DROP, -3);
});
btnValve.addEventListener('click', () => { valveClosed = !valveClosed; btnValve.classList.toggle('on', valveClosed); });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglChart.addEventListener('change', () => { cvC.style.display = tglChart.checked ? 'block' : 'none'; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  sizeChart();
});
function setMode(m) { MODE = m; btnJet.classList.toggle('on', m === 'jet'); }

/* ---------------- 图示:能垒 / 自由基曲线 / 燃烧三角 ---------------- */
const cvC = document.getElementById('cvChart'), ctxC = cvC.getContext('2d');
function sizeChart() {
  const d = Math.min(devicePixelRatio || 1, 2);
  cvC.width = cvC.clientWidth * d;
  cvC.height = 112 * d;
  ctxC.setTransform(d, 0, 0, d, 0, 0);
}
function drawChart() {
  if (!tglChart.checked) return;
  const w = cvC.clientWidth, h = 112;
  ctxC.clearRect(0, 0, w, h);
  ctxC.font = '10px system-ui';
  const zw = (w - 30) / 3;
  /* A 能垒 */
  const ax = 8, ay = h - 24, aw = zw - 6;
  ctxC.strokeStyle = PAL.dim; ctxC.globalAlpha = 0.5; ctxC.lineWidth = 1;
  ctxC.beginPath(); ctxC.moveTo(ax, ay); ctxC.lineTo(ax + aw, ay); ctxC.stroke();
  ctxC.globalAlpha = 1;
  ctxC.strokeStyle = '#ffa94d'; ctxC.lineWidth = 2;
  ctxC.beginPath();
  for (let i = 0; i <= 24; i++) {
    const t = i / 24, e = t * t * (3 - 2 * t);
    const y = 68 + 24 * e - 44 * Math.pow(Math.sin(Math.PI * t), 2);
    const x = ax + t * aw;
    i ? ctxC.lineTo(x, y) : ctxC.moveTo(x, y);
  }
  ctxC.stroke();
  ctxC.strokeStyle = PAL.dim; ctxC.setLineDash([3, 3]); ctxC.lineWidth = 1;
  ctxC.beginPath(); ctxC.moveTo(ax + aw * 0.3, 48); ctxC.lineTo(ax + aw * 0.7, 48); ctxC.stroke();
  ctxC.setLineDash([]);
  ctxC.fillStyle = '#ff8787';
  ctxC.fillText('Ea', ax + aw * 0.48, 44);
  ctxC.fillStyle = PAL.dim;
  ctxC.fillText(L('H₂+O₂', 'H₂+O₂'), ax, ay + 11);
  ctxC.fillText(L('H₂O+热', 'H₂O+heat'), ax + aw - 42, ay + 11);
  if (sparkK > 0.1) {
    ctxC.globalAlpha = sparkK;
    ctxC.fillStyle = '#ffd8a8';
    ctxC.fillText('⚡', ax + aw * 0.12, 56);
    ctxC.globalAlpha = 1;
  }
  if (MODE === 'mix' && state !== 'idle') {
    ctxC.fillStyle = '#ff8787';
    ctxC.beginPath(); ctxC.arc(ax + aw * 0.88, 88, 3.2, 0, 7); ctxC.fill();
  }
  /* B 自由基计数 */
  const bx = ax + zw + 8, bw = zw - 6;
  const yFor = v => h - 22 - Math.log10(1 + v) / Math.log10(THRESH + 6) * (h - 40);
  ctxC.strokeStyle = PAL.dim; ctxC.globalAlpha = 0.4;
  ctxC.beginPath(); ctxC.moveTo(bx, h - 22); ctxC.lineTo(bx + bw, h - 22); ctxC.stroke();
  ctxC.globalAlpha = 1;
  ctxC.setLineDash([3, 3]); ctxC.strokeStyle = '#ff6b6b';
  ctxC.beginPath(); ctxC.moveTo(bx, yFor(THRESH)); ctxC.lineTo(bx + bw, yFor(THRESH)); ctxC.stroke();
  ctxC.setLineDash([]);
  if (hist.length > 1) {
    ctxC.fillStyle = 'rgba(255,135,135,.22)';
    ctxC.strokeStyle = '#ff8787'; ctxC.lineWidth = 1.6;
    ctxC.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const x = bx + i / 109 * bw, y = yFor(hist[i]);
      i ? ctxC.lineTo(x, y) : ctxC.moveTo(x, y);
    }
    ctxC.stroke();
    ctxC.lineTo(bx + (hist.length - 1) / 109 * bw, h - 22);
    ctxC.lineTo(bx, h - 22);
    ctxC.closePath(); ctxC.fill();
  }
  ctxC.fillStyle = PAL.dim;
  ctxC.fillText(L('自由基计数', 'radical count'), bx + 2, 12);
  ctxC.fillStyle = '#ff6b6b';
  ctxC.fillText(L('爆炸阈值', 'boom limit'), bx + bw - 46, yFor(THRESH) - 3);
  /* C 燃烧三角 */
  const cx0 = bx + bw + 8, cw2 = zw - 6;
  const T = [cx0 + cw2 / 2, 14], Lv = [cx0 + 8, h - 26], Rv = [cx0 + cw2 - 8, h - 26];
  const legs = [
    { a: Lv, b: T, ok: !valveClosed, col: '#ffa94d', name: 'H₂' },
    { a: T, b: Rv, ok: !lidOn, col: '#74c0fc', name: 'O₂' },
    { a: Lv, b: Rv, ok: !cooled, col: '#ff8787', name: L('热', 'heat') },
  ];
  for (const g of legs) {
    ctxC.strokeStyle = g.ok ? g.col : PAL.dim;
    ctxC.globalAlpha = g.ok ? 1 : 0.45;
    ctxC.lineWidth = g.ok ? 3 : 1.4;
    ctxC.setLineDash(g.ok ? [] : [4, 3]);
    ctxC.beginPath(); ctxC.moveTo(g.a[0], g.a[1]); ctxC.lineTo(g.b[0], g.b[1]); ctxC.stroke();
    ctxC.setLineDash([]);
    const mx = (g.a[0] + g.b[0]) / 2, my = (g.a[1] + g.b[1]) / 2;
    if (g.ok) { ctxC.fillStyle = g.col; ctxC.fillText(g.name, mx - 6, my + (g.name.length > 2 ? 10 : 3)); }
    else { ctxC.fillStyle = '#ff6b6b'; ctxC.fillText('✕', mx - 3, my + 3); }
  }
  ctxC.globalAlpha = 1;
  ctxC.fillStyle = PAL.dim;
  ctxC.fillText(L('燃烧三角', 'fire triangle'), cx0 + cw2 / 2 - 20, h - 12);
}

/* ---------------- 图形更新 ---------------- */
const qy2x = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0));
const uV = new THREE.Vector3(), locV = new THREE.Vector3();
function updateMolMesh(dt) {
  if (MODE !== 'mix') return;
  for (let i = 0; i < NMOL; i++) {
    const m = mol[i];
    if (!m.alive) {
      dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.0001); dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      atoms.setMatrixAt(2 * i, dummy.matrix); atoms.setMatrixAt(2 * i + 1, dummy.matrix);
      bonds.setMatrixAt(i, dummy.matrix);
      continue;
    }
    m.ang += m.w * dt;
    m.q.setFromAxisAngle(m.axis, m.ang);
    if (Math.random() < 0.06) m.v.applyAxisAngle(m.axis, rand(-0.5, 0.5));
    m.p.addScaledVector(m.v, dt);
    locV.copy(m.p).sub(BUB);
    if (locV.length() > BUB_R - 0.16) {
      locV.setLength(BUB_R - 0.16);
      m.p.copy(BUB).add(locV);
      const n = locV.clone().normalize();
      m.v.sub(n.multiplyScalar(2 * m.v.dot(n)));
    }
    uV.set(1, 0, 0).applyQuaternion(m.q);
    const aR = m.type === 'H2' ? 0.05 : 0.072;
    dummy.quaternion.copy(m.q);
    dummy.scale.setScalar(aR);
    dummy.position.copy(m.p).addScaledVector(uV, 0.095);
    dummy.updateMatrix();
    atoms.setMatrixAt(2 * i, dummy.matrix);
    dummy.position.copy(m.p).addScaledVector(uV, -0.095);
    dummy.updateMatrix();
    atoms.setMatrixAt(2 * i + 1, dummy.matrix);
    dummy.position.copy(m.p);
    dummy.quaternion.copy(m.q).multiply(qy2x);
    dummy.scale.set(1, 0.19, 1);
    dummy.updateMatrix();
    bonds.setMatrixAt(i, dummy.matrix);
  }
  atoms.instanceMatrix.needsUpdate = true;
  bonds.instanceMatrix.needsUpdate = true;
}
function updateRadMesh() {
  let idx = 0;
  const pulse = i => 1 + 0.25 * Math.sin(tSim * 18 + i * 1.7);
  for (const r of rads) {
    const s = 0.055 * pulse(idx);
    dummy.position.copy(r.p);
    dummy.scale.setScalar(s); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
    radCore.setMatrixAt(idx, dummy.matrix);
    radCore.setColorAt(idx, C_R[r.kind]);
    dummy.scale.setScalar(s * 2.6); dummy.updateMatrix();
    radHalo.setMatrixAt(idx, dummy.matrix);
    idx++;
  }
  if (jetBurning()) {
    const kinds = ['H', 'OH', 'O'];
    for (let k = 0; k < 6 && idx < NRAD; k++) {
      const a = k / 6 * Math.PI * 2 + tSim * 0.8;
      const s = 0.04 * pulse(idx);
      dummy.position.set(Math.cos(a) * 0.17, 1.56 + 0.07 * Math.sin(tSim * 11 + k * 2), Math.sin(a) * 0.17);
      dummy.scale.setScalar(s); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
      radCore.setMatrixAt(idx, dummy.matrix);
      radCore.setColorAt(idx, C_R[kinds[k % 3]]);
      dummy.scale.setScalar(s * 2.4); dummy.updateMatrix();
      radHalo.setMatrixAt(idx, dummy.matrix);
      idx++;
    }
  }
  dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.0001); dummy.rotation.set(0, 0, 0);
  for (let i = idx; i < NRAD; i++) {
    dummy.updateMatrix();
    radCore.setMatrixAt(i, dummy.matrix);
    radHalo.setMatrixAt(i, dummy.matrix);
  }
  radCore.instanceMatrix.needsUpdate = true;
  radHalo.instanceMatrix.needsUpdate = true;
  if (radCore.instanceColor) radCore.instanceColor.needsUpdate = true;
}
function stepInst(list, mesh, dt, floorBounce) {
  for (const q of list) {
    if (q.life > 0) {
      q.life -= q.dec * dt;
      q.p.addScaledVector(q.v, dt);
      q.v.y += q.g * dt;
      if (floorBounce && q.p.y < 0.04) { q.p.y = 0.04; q.v.y *= -0.25; q.v.x *= 0.9; q.v.z *= 0.9; }
      dummy.position.copy(q.p);
      dummy.scale.setScalar(Math.max(0.001, q.s * Math.min(1, q.life * 3) * (0.35 + 0.65 * q.life)));
    } else {
      dummy.position.set(0, -10, 0);
      dummy.scale.setScalar(0.0001);
    }
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    mesh.setMatrixAt(q.i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
}
function updateVisuals(dt) {
  sparkK *= Math.exp(-dt * 5);
  sparkGlow.material.opacity = sparkK * 0.9;
  sparkGlow.scale.setScalar(0.8 + 0.6 * sparkK + 0.15 * Math.sin(tSim * 40));
  M.film.emissiveIntensity = 0.04 + 0.03 * Math.sin(tSim * 2) + 0.3 * sparkK;
  bubble.scale.setScalar(1 + 0.006 * Math.sin(tSim * 3));
  lidK += ((lidOn ? 1 : 0) - lidK) * (1 - Math.exp(-dt * 6));
  lidGrp.visible = lidK > 0.02;
  lidGrp.position.y = 3.4 - lidK * 2.125;
  valveA += ((valveClosed ? 1.7 : 0) - valveA) * (1 - Math.exp(-dt * 8));
  spinG.rotation.z = valveA;
  const on = jetBurning();
  flameGrp.visible = on;
  if (on) {
    const f1 = 1 + 0.12 * Math.sin(tSim * 21) + 0.06 * Math.sin(tSim * 47);
    flameO.scale.set(f1, 0.9 + 0.25 * Math.sin(tSim * 29 + 2), f1);
    flameI.scale.set(f1, 1 + 0.1 * Math.sin(tSim * 33), f1);
  }
  if (MODE === 'jet' && !valveClosed) {
    jetAcc += dt * 30;
    while (jetAcc > 1) {
      jetAcc--;
      const j = jetP.find(x => x.life <= 0);
      if (!j) break;
      j.life = 1; j.dec = 1 / rand(0.5, 0.9);
      j.p.set(rand(-0.02, 0.02), 1.47, rand(-0.02, 0.02));
      j.v.set(rand(-0.06, 0.06), rand(1.1, 1.6), rand(-0.06, 0.06));
      j.g = 0; j.s = 0.03;
    }
  }
  if (MODE === 'mix' && (state === 'boom' || state === 'done')) {
    const k = clamp(boomT / 0.9, 0, 1), e = 1 - Math.pow(1 - k, 2);
    flash.intensity = (1 - k) * (1 - k) * (70 + 180 * yieldLast);
    rings.forEach((r, i) => {
      r.visible = k < 1;
      r.material.opacity = (1 - k) * (0.85 - i * 0.3);
      r.scale.setScalar(0.3 + e * (1.6 + 3.2 * yieldLast) + i * 0.3);
    });
  } else {
    flash.intensity *= Math.exp(-dt * 8);
    rings.forEach(r => { r.visible = false; });
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, acc = 0, chartAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) physStep(dts);
  updateVisuals(dt);
  updateMolMesh(dt);
  updateRadMesh();
  stepInst(mistP, mist, dt, true);
  stepInst(jetP, jetM, dt, false);
  chartAcc += dt;
  if (chartAcc >= 0.12) { chartAcc = 0; drawChart(); }
  acc += dt;
  if (acc >= 0.25) {
    acc = 0;
    stR.textContent = MODE === 'mix' ? rads.length : (jetBurning() ? 6 + Math.round(2 * Math.abs(Math.sin(tSim * 5))) : 0);
    stP.innerHTML = (progress() * 100).toFixed(0) + '<small> %</small>';
    stQ.innerHTML = (MODE === 'jet' ? Qjet : heatKJ()).toFixed(0) + '<small> kJ</small>';
    stPhi.textContent = phi().toFixed(2);
    const [vt, vc] = verdictTxt();
    stV.textContent = vt;
    stV.className = 'v ' + vc;
    updateFormula();
  }
  btnWater.classList.toggle('on', sprayT > 0);
  for (const r of labelReg) if (labelsOn && r.vis() && !r.span) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
setMode(MODE);
resetAll();
fastForward(clamp(qsFloat('t', 0), 0, 120));
sizeChart();
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
