  @media(max-width:900px){#stats{display:none}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============================================================
   正则 → NFA（Thompson 构造）→ 两种引擎：
   1) 集合模拟：每步维护「所有可能状态」集合，步数 O(n·|S|) 线性；
   2) 回溯对照：逐条路径尝试。路径数用「ε 路径计数向量」精确累乘：
      v₀ = ε闭包(起点)，每消耗一个字符 v ← (v·C_c)·ε闭包。
      (a+)+b 在 aⁿ 上每吃一个 a 都有「内层 + 继续 / 退出重进外层 *」
      两种走法，路径数 2ⁿ⁻¹，累计尝试 ≈2ⁿ⁺¹，指数爆炸；
      集合模拟永远只有 |S|≤状态数 个活跃状态。
   注：Thompson NFA 的 ε 环必经「无 ε 出边的字符态」，故 ε 路径数有限，
   上式精确成立（上限 1e13 截断防溢出显示）。
   ============================================================ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
const qsBool=(k,d)=>{const v=qs.get(k);return v===null?d:(v!=='0'&&v!=='false');};

/* ---- renderer ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,30,80);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0,6,20);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=60;

scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.8));
const keyL=new THREE.DirectionalLight(0xfff2dd,0.9);keyL.position.set(6,10,8);scene.add(keyL);

/* ---- Thompson 构造：| 串联 * + 与字符 ---- */
function buildNFA(re){
  const edges=[];let ns=0;
  const st=()=>ns++;
  const eps=(a,b)=>edges.push({f:a,t:b,ch:null});
  const parseAlt=()=>{
    let f=parseConcat();
    while(re[pos]==='|'){pos++;f=alt(f,parseConcat());}
    return f;
  };
  const parseConcat=()=>{
    let f=null;
    while(pos<re.length&&re[pos]!==')'&&re[pos]!=='|'){
      let a=parseAtom();
      while(re[pos]==='*'||re[pos]==='+'){a=(re[pos]==='*')?star(a):plus(a);pos++;}
      f=f?concat(f,a):a;
    }
    return f||skip();
  };
  const parseAtom=()=>{
    if(re[pos]==='('){pos++;const f=parseAlt();pos++;return f;}
    const a=st(),b=st();edges.push({f:a,t:b,ch:re[pos]});pos++;return{s:a,e:b};
  };
  const concat=(a,b)=>{eps(a.e,b.s);return{s:a.s,e:b.e};};
  const alt=(a,b)=>{const s=st(),e=st();eps(s,a.s);eps(s,b.s);eps(a.e,e);eps(b.e,e);return{s,e};};
  const star=a=>{const s=st(),e=st();eps(s,a.s);eps(a.e,a.s);eps(a.e,e);eps(s,e);return{s,e};};
  const plus=a=>{const s=st(),e=st();eps(s,a.s);eps(a.e,a.s);eps(a.e,e);return{s,e};};
  const skip=()=>{const s=st(),e=st();eps(s,e);return{s,e};};
  let pos=0;
  const frag=parseAlt();
  /* ε 路径计数矩阵 EP[i][j] = i→j 的不同 ε 路径数（含 0 条=单位元）。
     迭代 R ← I + R·E 共 n 次 = Σ_{k≤n} E^k；ε 图无环（Thompson 的 ε 环
     必经无 ε 出边的字符态），故 n 次后收敛为精确路径数。 */
  const n=ns,E=Array.from({length:n},()=>new Float64Array(n));
  for(const ed of edges)if(ed.ch===null)E[ed.f][ed.t]+=1;
  let EP=Array.from({length:n},(_,i)=>{const r=new Float64Array(n);r[i]=1;return r;});
  for(let it=0;it<n;it++){
    const NR=Array.from({length:n},(_,i)=>{const r=new Float64Array(n);r[i]=1;return r;});
    for(let i=0;i<n;i++)for(let k=0;k<n;k++){
      const rik=EP[i][k];if(!rik)continue;
      for(let j=0;j<n;j++)NR[i][j]=Math.min(1e13,NR[i][j]+rik*E[k][j]);
    }
    EP=NR;
  }
  const charEdges=edges.filter(e=>e.ch!==null);
  return{n,edges,charEdges,EP,start:frag.s,accept:frag.e,re};
}

/* ---- 布局：BFS 分层，回边识别 ---- */
let posV=[],layerArr=[];
function layout(nfa){
  const {n,edges,start}=nfa;
  const layer=new Array(n).fill(-1);layer[start]=0;
  const q=[start];
  while(q.length){const u=q.shift();
    for(const e of edges)if(e.f===u&&layer[e.t]<0){layer[e.t]=layer[u]+1;q.push(e.t);}
  }
  for(let i=0;i<n;i++)if(layer[i]<0)layer[i]=0;
  const maxL=Math.max(...layer);
  const cnt=new Array(maxL+1).fill(0),idx=[];
  for(let i=0;i<n;i++)idx[i]=cnt[layer[i]]++;
  posV=[];
  for(let i=0;i<n;i++)posV.push(new THREE.Vector3(
    (layer[i]-maxL/2)*2.3,(idx[i]-(cnt[layer[i]]-1)/2)*1.9,0));
  layerArr=layer;
}

/* ---- 场景 ---- */
const graphRoot=new THREE.Group();scene.add(graphRoot);
const charRowG=new THREE.Group();scene.add(charRowG);
const MAXTOK=200;
const tokIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.16,10,8),
  new THREE.MeshStandardMaterial({roughness:0.3,metalness:0.1,emissive:0xffa94d,emissiveIntensity:0.3}),MAXTOK);
tokIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const M4=new THREE.Matrix4(),S1=new THREE.Matrix4().makeScale(1,1,1),
  T1=new THREE.Matrix4(),SCL=new THREE.Matrix4();
for(let i=0;i<MAXTOK;i++){M4.makeScale(0,0,0);tokIM.setMatrixAt(i,M4);tokIM.setColorAt(i,new THREE.Color(0xffa94d));}
graphRoot.add(tokIM);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=graphRoot){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}

let NFA=null,stateMeshes=[];
const stateBase=new THREE.Color(0x3d5063),cAct=new THREE.Color(0xffa94d),
  cDie=new THREE.Color(0x868e96),cTmp=new THREE.Color();
let verdictOn=null;
function buildScene(re){
  graphRoot.clear();charRowG.clear();
  graphRoot.add(tokIM); /* clear 会连 token 池一起移除，重建后挂回 */
  labelReg.length=0;stateMeshes=[];charLbls=[];
  NFA=buildNFA(re);layout(NFA);
  const {n,edges,accept}=NFA;
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.24,24),
      new THREE.MeshStandardMaterial({color:stateBase.clone(),roughness:0.35,metalness:0.4,
        emissive:0xffa94d,emissiveIntensity:0}));
    m.position.copy(posV[i]);graphRoot.add(m);stateMeshes.push(m);
    if(i===accept){
      const t=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.05,10,32),
        new THREE.MeshStandardMaterial({color:0xffd43b,roughness:0.3,metalness:0.5,emissive:0xffa000,emissiveIntensity:0.4}));
      t.rotation.x=Math.PI/2;t.position.copy(posV[i]).setY(0.05);graphRoot.add(t);
    }
  }
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.4,12),
    new THREE.MeshStandardMaterial({color:0x74c0fc,roughness:0.4,emissive:0x1864ab,emissiveIntensity:0.5}));
  cone.rotation.z=-Math.PI/2;
  cone.position.copy(posV[NFA.start]).add(new THREE.Vector3(-1.0,0,0));
  graphRoot.add(cone);
  addLabel(()=>L('起点 q0','start q0'),cone.position.clone().add(new THREE.Vector3(0,-0.5,0)),'b');
  addLabel(()=>L('双圈 = 终态','double ring = accept'),posV[accept].clone().add(new THREE.Vector3(0,0.85,0)),'g');
  for(const e of edges){
    const a=posV[e.f],b=posV[e.t];
    const back=layerArr[e.t]<=layerArr[e.f];
    let pts,mid;
    if(back){
      mid=a.clone().add(b).multiplyScalar(0.5);mid.z=1.5;
      pts=new THREE.QuadraticBezierCurve3(a,mid,b).getPoints(28);
    }else{
      const dir=b.clone().sub(a).normalize();
      pts=[a.clone().add(dir.clone().multiplyScalar(0.5)),b.clone().sub(dir.clone().multiplyScalar(0.55))];
      mid=a.clone().add(b).multiplyScalar(0.5);
    }
    const mat=e.ch===null
      ?new THREE.LineDashedMaterial({color:0x8b97a5,dashSize:0.16,gapSize:0.12,transparent:true,opacity:0.75})
      :new THREE.LineBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.9});
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);
    if(e.ch===null)line.computeLineDistances();
    graphRoot.add(line);
    if(e.ch!==null)addLabel(()=>e.ch,mid.clone().add(new THREE.Vector3(0,0.32,0)),'b');
    else if(back)addLabel(()=>L('ε 回环','ε loop'),mid.clone().setZ(1.8),'');
  }
  /* 判定标签（常驻两个，按状态显隐） */
  addLabel(()=>L('✓ 接受','✓ ACCEPT'),new THREE.Vector3(0,4.6,0),'g',()=>verdictOn===true);
  addLabel(()=>L('✗ 拒绝','✗ REJECT'),new THREE.Vector3(0,4.6,0),'r',()=>verdictOn===false);
  buildCharRow();
}
let charLbls=[];
function buildCharRow(){
  for(let j=labelReg.length-1;j>=0;j--)if(labelReg[j].row)labelReg.splice(j,1);
  charRowG.clear();charLbls=[];
  const nRow=inputStr.length;
  for(let j=0;j<nRow;j++){
    const x=(j-(nRow-1)/2)*0.85;
    addLabel(()=>inputStr[j],new THREE.Vector3(x,-5.1,0),'',()=>true,charRowG);
    const reg=labelReg[labelReg.length-1];reg.row=1;charLbls.push(reg);
  }
}

/* ---- 模拟状态 ---- */
const TEMPLATES=[
  {re:'ab|c*',input:'ab'},
  {re:'a(a|b)*b',input:'abab'},
  {re:'(a+)+b',input:'a'.repeat(30)},
];
let inputStr='ab',curI=0,vec=null,subsetSteps=0,btSteps=0;
let engine='sub';
let playing=true,labelsOn=true,speedK=1,simT=0,stepT=0,dyingAll=false;
let dyingStates=[],dyingUntil=-1;
let tokPrev=[],tokTarget=[];

function resetSim(){
  curI=0;subsetSteps=0;btSteps=0;verdictOn=null;
  dyingAll=false;dyingStates=[];dyingUntil=-1;
  vec=new Float64Array(NFA.n);for(let j=0;j<NFA.n;j++)vec[j]=NFA.EP[NFA.start][j];
  tokPrev=new Array(MAXTOK).fill(null);tokTarget=new Array(MAXTOK).fill(null);
  stepT=0;placeTokens(true);
}
function closure(v){ /* v' = v·EP（ε 闭包，计数版） */
  const w=new Float64Array(NFA.n);
  for(let i=0;i<NFA.n;i++){const vi=v[i];if(!vi)continue;
    for(let k=0;k<NFA.n;k++){const vik=NFA.EP[i][k];if(!vik)continue;w[k]+=vi*vik;}}
  return w;
}
function consume(v,c){ /* w[t] = Σ v[f]·(f--c-->t) */
  const w=new Float64Array(NFA.n);
  for(const e of NFA.charEdges)if(e.ch===c&&v[e.f]>0)w[e.t]+=v[e.f];
  return w;
}
function sum(v){let s=0;for(let i=0;i<v.length;i++)s+=v[i];return s;}
const SCRATCH=new THREE.Matrix4();
function captureTokenPos(){
  for(let k=0;k<MAXTOK;k++){
    if(!tokTarget[k])continue;
    tokIM.getMatrixAt(k,SCRATCH); /* getMatrixAt 无返回值，结果写入目标矩阵 */
    const p=new THREE.Vector3().setFromMatrixPosition(SCRATCH);
    tokPrev[k]=p.lengthSq()>0.01?p:null;
  }
}
function stepOnce(){
  if(curI>=inputStr.length)return false;
  const c=inputStr[curI];
  const closed=vec; /* vec 恒为 ε 闭包（计数） */
  let act=0;for(let s=0;s<NFA.n;s++)if(closed[s]>0)act++;
  subsetSteps+=act;
  /* 整队死路：没有任何状态能吃掉 c → 本步全员熄火（灰闪 1.4s） */
  dyingAll=!NFA.charEdges.some(e=>e.ch===c&&closed[e.f]>0);
  if(dyingAll){
    dyingStates=[];for(let s=0;s<NFA.n;s++)if(closed[s]>0)dyingStates.push(s);
    dyingUntil=simT+1.4;
  }
  captureTokenPos();
  const nxt=closure(consume(closed,c));
  btSteps=Math.min(1e13,btSteps+sum(nxt));
  vec=nxt;curI++;
  stepT=0;placeTokens(false);
  if(curI>=inputStr.length)verdictOn=vec[NFA.accept]>0;
  return true;
}
function placeTokens(instant){
  const targets=[];
  if(engine==='sub'){
    for(let s=0;s<NFA.n;s++)if(vec[s]>0)targets.push({p:posV[s],c:0xffa94d});
  }else{
    const total=sum(vec);
    if(total>0){
      let assigned=0;
      const order=[...Array(NFA.n).keys()].sort((a,b)=>vec[b]-vec[a]);
      for(const s of order){
        if(vec[s]<=0||assigned>=MAXTOK)continue;
        const k=Math.min(MAXTOK-assigned,Math.round(MAXTOK*vec[s]/total));
        for(let j=0;j<k;j++){
          const r=0.25+0.5*Math.sqrt(((j*7919)%997)/997),th=((j*104729)%628)/100;
          targets.push({p:posV[s].clone().add(new THREE.Vector3(r*Math.cos(th),r*Math.sin(th)*0.7,0)),c:0xff6b6b});
        }
        assigned+=k;
      }
    }
  }
  for(let k=0;k<MAXTOK;k++){
    const t=targets[k];
    if(instant)tokPrev[k]=null;
    tokTarget[k]=t?t.p.clone():null;
    if(!t){M4.makeScale(0,0,0);tokIM.setMatrixAt(k,M4);continue;}
    const p0=tokPrev[k]||t.p;
    M4.makeTranslation(p0.x,p0.y,0.45).multiply(S1);
    tokIM.setMatrixAt(k,M4);
    tokIM.setColorAt(k,new THREE.Color(t.c));
  }
  tokIM.instanceMatrix.needsUpdate=true;
  if(tokIM.instanceColor)tokIM.instanceColor.needsUpdate=true;
}

/* ---- 步骤（点击切相位） ---- */
function forceFinish(){while(curI<inputStr.length&&stepOnce());stepT=1;}
const STEPS=[
  {zh:'Thompson 构造：a|b 译成分叉、ab 译成串联、a* 译成带回环的克隆',en:'Thompson construction: a|b forks, ab chains, a* clones with a loop',
   act(){engine='sub';syncEngineBtns();selectTemplate(0,false);playing=false;}},
  {zh:'集合模拟：小车驶入，分叉处一辆变两辆——每步同时走所有分支',en:'Subset sim: cars split at forks; all branches advance at once',
   act(){engine='sub';syncEngineBtns();selectTemplate(0,false);playing=true;setPlayText();}},
  {zh:'ε 虚线=不耗字符的免费跳转；无路可走的车队当场全体熄火',en:'Dashed ε = free hops; a fleet with no move stalls in gray',
   act(){engine='bt';syncEngineBtns();selectTemplate(0,false);
     document.getElementById('sIn').value='ac';applyInput();playing=false;setPlayText();stepOnce();}},
  {zh:'终态判定：输入耗尽时停在双圈终态 → 接受，否则拒绝',en:'Verdict: parked in the double ring when input ends → accept',
   act(){engine='sub';syncEngineBtns();selectTemplate(1,false);playing=false;setPlayText();forceFinish();}},
  {zh:'换回溯引擎：同一条 (a+)+b，路径数每吃一个 a 翻一倍',en:'Backtracking engine: on (a+)+b paths double per a',
   act(){engine='bt';syncEngineBtns();selectTemplate(2,false);playing=true;setPlayText();}},
  {zh:'30 个 a：划分方式 2²⁹≈5.4 亿，累计尝试路径超 10 亿——DFA 只要 31 步',en:'30 a\'s: 2²⁹ splittings, >10⁹ paths tried — a DFA needs 31 steps',
   act(){engine='bt';syncEngineBtns();selectTemplate(2,false);playing=false;setPlayText();forceFinish();}},
  {zh:'泵引理：正则数不了 aⁿbⁿ 的栈——有限状态没有计数器',en:'Pumping lemma: finite states cannot count aⁿbⁿ',
   act(){engine='sub';syncEngineBtns();selectTemplate(1,false);
     document.getElementById('sIn').value='aaabbb';applyInput();playing=true;setPlayText();}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();STEPS[i].act();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function selectTemplate(i,keepInput){
  document.querySelectorAll('.tpl').forEach((b,j)=>b.classList.toggle('on',j===i));
  buildScene(TEMPLATES[i].re);
  if(!keepInput)document.getElementById('sIn').value=TEMPLATES[i].input;
  applyInput();
}
function applyInput(){
  const raw=document.getElementById('sIn').value.replace(/[^abc]/g,'').slice(0,40);
  if(raw!==document.getElementById('sIn').value)document.getElementById('sIn').value=raw;
  inputStr=raw;buildCharRow();resetSim();
}
function syncEngineBtns(){
  document.getElementById('btnSub').classList.toggle('on',engine==='sub');
  document.getElementById('btnBt').classList.toggle('on',engine==='bt');
}
function fmtNum(v){
  if(v>=1e13)return '≥10¹³';
  if(v<1e4)return Math.round(v).toString();
  if(v<1e8)return LANG==='en'?(v/1e3).toFixed(1)+'k':(v/1e4).toFixed(1)+'万';
  const ex=Math.floor(Math.log10(v)),n2=Math.round(Math.log2(v));
  return '2^'+n2+'≈'+(v/Math.pow(10,ex)).toFixed(1)+'×10'+sup(ex);
}
function sup(x){const m={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  return String(x).split('').map(c=>m[c]||c).join('');}
function updateStats(){
  if(!NFA||!vec)return;
  let act=0,paths=0;for(let s=0;s<NFA.n;s++){if(vec[s]>0)act++;paths+=vec[s];}
  document.getElementById('stProg').innerHTML=curI+'<small> / '+inputStr.length+'</small>';
  document.getElementById('stAct').innerHTML=(engine==='sub'?act:Math.min(MAXTOK,Math.round(paths)))+'<small> '
    +(engine==='sub'?L('态','states'):L('条(截断)','(capped)'))+'</small>';
  document.getElementById('stSS').innerHTML=subsetSteps+'<small></small>';
  document.getElementById('stBT').innerHTML=fmtNum(btSteps)+'<small></small>';
}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  stateBase.setHex(dark?0x3d5063:0x8ea7bd);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();updateStats();
}

/* ---- 交互 ---- */
TEMPLATES.forEach((t,i)=>document.getElementById('tpl'+i).addEventListener('click',()=>{
  selectTemplate(i,false);activeStep=i===2?4:i;syncSteps();}));
document.getElementById('btnStep').addEventListener('click',()=>{playing=false;setPlayText();stepOnce();});
document.getElementById('btnSub').addEventListener('click',()=>{engine='sub';syncEngineBtns();placeTokens(true);updateStats();});
document.getElementById('btnBt').addEventListener('click',()=>{engine='bt';syncEngineBtns();placeTokens(true);updateStats();});
document.getElementById('sIn').addEventListener('change',applyInput);
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';});
function setPlayText(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayText();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt;
  if(playing)stepT+=dt*speedK;
  if(playing&&curI<inputStr.length&&stepT>=0.9)stepOnce();
  /* token 从上一位置流向新位置 */
  const f=clamp(stepT/0.9,0,1),e=1-Math.pow(1-f,3);
  for(let k=0;k<MAXTOK;k++){
    const t=tokTarget[k];if(!t)continue;
    const p=tokPrev[k]?tokPrev[k].clone().lerp(t,e):t;
    const s=1+0.3*Math.sin(simT*8+k);
    T1.makeTranslation(p.x,p.y,0.45);SCL.makeScale(s,s,s);
    M4.multiplyMatrices(T1,SCL);
    tokIM.setMatrixAt(k,M4);
  }
  tokIM.instanceMatrix.needsUpdate=true;
  /* 状态发光：集合引擎=活跃态，回溯引擎=路径密度；死路灰闪 */
  let maxv=0;for(let s=0;s<NFA.n;s++)maxv=Math.max(maxv,vec[s]);
  const dyingNow=engine==='sub'&&simT<dyingUntil;
  for(let s=0;s<NFA.n;s++){
    const on=vec[s]>0;
    const em=on?(engine==='sub'?0.8:0.25+0.55*Math.min(1,vec[s]/Math.max(1,maxv))):0;
    stateMeshes[s].material.emissiveIntensity+=(em-stateMeshes[s].material.emissiveIntensity)*0.3;
    cTmp.copy(stateBase);
    if(dyingNow&&dyingStates.includes(s))cTmp.lerp(cDie,0.7);
    else if(on)cTmp.lerp(cAct,0.4);
    stateMeshes[s].material.color.lerp(cTmp,0.3);
  }
  /* 字符行进度高亮 */
  for(let j=0;j<charLbls.length;j++){
    const cls='lbl'+(j<curI?' g':j===curI?' o':'');
    const el=charLbls[j].o.element;
    if(el.className!==cls)el.className=cls;
  }
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 启动 ---- */
applyTheme();applyLang();buildSteps();
selectTemplate(0,false);syncEngineBtns();
if(qs.get('pause')==='1'){playing=false;setPlayText();}
if(!qsBool('labels',true)){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(qs.get('speed')!==null){const v=clamp(parseFloat(qs.get('speed'))||1,0.3,2.5);
  speedK=v;document.getElementById('sSpd').value=Math.round(v*100);
  document.getElementById('sSpdVal').textContent=v.toFixed(1)+'×';}
updateStats();start();
</script>
