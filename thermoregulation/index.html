<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体温调节 · 身体里的恒温器</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffa94d;
    --bg:#10151c; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b25b16;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,169,77,.9); color: #ffe0ae; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(178,91,22,.9); color: #8a5c0d; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 320px; height: 182px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 216px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.b { color: #74c0fc; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,122,92,.6); background: rgba(255,122,92,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(214,73,51,.55); background: rgba(214,73,51,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,169,77,.10); border-color: rgba(255,169,77,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(178,91,22,.08); border-color: rgba(178,91,22,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="体温调节:身体里的恒温器" data-en="Thermoregulation: the body's thermostat">体温调节:身体里的恒温器</h1>
  <div class="sub" data-zh="下丘脑把核心温度与设定点比较,失配驱动一切:冷了血管收缩+颤抖产热,热了血管舒张+出汗蒸发;发烧=致热原把设定点上调,身体寒战着追上去;效应器饱和时,失温/中暑来袭 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="The hypothalamus compares core temperature with a set-point and the mismatch drives everything: cold → vasoconstriction + shivering, hot → vasodilation + sweating; fever = pyrogens raise the set-point and the body shivers its way up; when effectors saturate, hypothermia / heat stroke strike · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">下丘脑把核心温度与设定点比较,失配驱动一切:冷了血管收缩+颤抖产热,热了血管舒张+出汗蒸发;发烧=致热原把设定点上调,身体寒战着追上去;效应器饱和时,失温/中暑来袭 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="plot">
  <h3 data-zh="核心温度 vs 设定点(最近 160 s)" data-en="core temperature vs set-point (last 160 s)">核心温度 vs 设定点(最近 160 s)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="stats">
  <span class="k" data-zh="核心温度" data-en="core temp">核心温度</span><span class="v ok" id="stTc">—</span>
  <span class="k" data-zh="设定点" data-en="set-point">设定点</span><span class="v" id="stSet">—</span>
  <span class="k" data-zh="失配 ΔT" data-en="mismatch ΔT">失配 ΔT</span><span class="v" id="stE">—</span>
  <span class="k" data-zh="产热率" data-en="heat production">产热率</span><span class="v" id="stH">—</span>
  <span class="k" data-zh="散热率" data-en="heat loss">散热率</span><span class="v" id="stL">—</span>
  <span class="k" data-zh="皮肤血流量" data-en="skin blood flow">皮肤血流量</span><span class="v b" id="stBF">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnFever" data-zh="致热原:发烧" data-en="pyrogens: fever">致热原:发烧</button>
    <button class="abtn" id="btnEx" data-zh="运动负荷" data-en="exercise load">运动负荷</button>
  </div>
  <div class="row"><label data-zh="环境温度" data-en="Environment">环境温度</label><input id="env" type="range" min="-10" max="45" step="1" value="22"><span class="val" id="envVal">22 °C</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1.5"><span class="val" id="spdVal">1.5×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="温度曲线" data-en="Chart">温度曲线</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../centrifugal-governor/" data-zh="第一台负反馈机器" data-en="the first feedback machine">第一台负反馈机器</a>
    <a href="../thermostat/" data-zh="同款比较器:双金属片" data-en="same comparator: bimetal strip">同款比较器:双金属片</a>
    <a href="../insulin-glucagon/" data-zh="血糖的双激素负反馈" data-en="glucose's two-hormone feedback">血糖的双激素负反馈</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10151c);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('体温调节 · 身体里的恒温器', 'Thermoregulation: the body\'s thermostat');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  refreshFeverBtn();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 2.6, 8.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.1, 1.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.2,
    emissive: color, emissiveIntensity: 0.08, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  skin: mat(0xe8b4a0, { roughness: 0.6, metalness: 0.02 }),
  shell: mat(0xe8b4a0, { roughness: 0.55, metalness: 0.02, transparent: true, opacity: 0.26, side: THREE.DoubleSide, depthWrite: false }),
  heart: mat(0xc0392b, { emissive: 0xff4a3c, emissiveIntensity: 0.35 }),
  liver: mat(0x8a4b32, { roughness: 0.6 }),
  muscle: mat(0xd98a8a, { roughness: 0.55 }),
  brain: mat(0xd9a7b8, { roughness: 0.6, transparent: true, opacity: 0.55 }),
  hypo: mat(0xffb454, { emissive: 0xffb454, emissiveIntensity: 0.8 }),
  vessel: mat(0xd96a50, { emissiveIntensity: 0.3, roughness: 0.4 }),
  gland: mat(0xc98a6a, { roughness: 0.5 }),
  glass: mat(0xbfd4e6, { transparent: true, opacity: 0.25, roughness: 0.15, metalness: 0.1 }),
  merc: mat(0x74c0fc, { emissiveIntensity: 0.4 }),
};
const cCold = new THREE.Color(0x3f7de0), cHot = new THREE.Color(0xe0522f);
const cSkinCold = new THREE.Color(0x8fa8d8), cSkinNorm = new THREE.Color(0xe8b4a0), cSkinHot = new THREE.Color(0xe06a50);
const cCoreCold = new THREE.Color(0x74c0fc), cCoreHot = new THREE.Color(0xff5a3c);

/* ================= 布局:左=温度计,中=人体剖面,右=负反馈环路 ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 5.6), M.floor);
floor.position.y = -0.1;
scene.add(floor);

/* ---------------- 人体:皮肤外壳 + 核心器官 + 血管 + 汗腺 ---------------- */
const bodyGrp = new THREE.Group();
bodyGrp.position.set(-1.35, 0, 0);
scene.add(bodyGrp);
const vesselMeshes = [];
function addVessel(parent, x, y, z, len) {
  const v = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, len, 8), M.vessel);
  v.position.set(x, y, z);
  parent.add(v);
  vesselMeshes.push(v);
  return v;
}
for (const s of [-1, 1]) {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.13, 1.05, 14), M.skin);
  leg.position.set(s * 0.22, 0.53, 0);
  bodyGrp.add(leg);
  addVessel(bodyGrp, s * 0.22, 0.55, 0.15, 0.9);
  addVessel(bodyGrp, s * 0.22 + 0.09, 0.55, 0.11, 0.9);
}
const torsoShell = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.5, 1.35, 26, 1, true), M.shell);
torsoShell.position.y = 1.72;
bodyGrp.add(torsoShell);
const pelvis = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 14), M.skin);
pelvis.position.y = 1.06;
pelvis.scale.set(1, 0.45, 0.9);
bodyGrp.add(pelvis);
/* 核心:心 / 肝 / 骨骼肌 + 核心光晕 */
const coreGlow = new THREE.Mesh(new THREE.SphereGeometry(0.36, 18, 14),
  new THREE.MeshBasicMaterial({ color: 0xff8a5c, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false }));
coreGlow.position.set(0, 1.8, 0);
bodyGrp.add(coreGlow);
const heart = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), M.heart);
heart.position.set(-0.12, 1.98, 0.12);
bodyGrp.add(heart);
const liver = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), M.liver);
liver.position.set(0.18, 1.6, 0.1);
liver.scale.set(1.4, 0.8, 1);
bodyGrp.add(liver);
const muscles = [];

/* ================= 状态与生理 ================= */
const H0 = 2.34, K_COND = 0.24, SHIV_MAX = 1.6, SWEAT_MAX = 4.5, C_TH = 60;
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let speed = clamp(qsFloat('speed', 1.5), 0.2, 3);
let env = clamp(qsFloat('env', 22), -10, 45);
let fever = false, exOn = false, exK = 0;
let tc = 37, tset = 37, ts = 31, shiver = 0, sweat = 0, bf = 0.5, pilo = 0;
let tSim = 0, sampleAcc = 0, shiverT = 0, pulseA = Math.PI * 0.75;
let lastH = H0, lastL = H0, lastLc = H0;
const histT = [], histS = [];

function physStep(h) {
  const tgt = fever ? 39 : 37;                       // 致热原上调设定点(斜坡≈17 s)
  tset += clamp(tgt - tset, -h * 0.12, h * 0.12);
  const e = tset - tc;                               // 失配:正=偏冷,负=偏热
  exK = lerp(exK, exOn ? 1 : 0, clamp(h * 0.8, 0, 1));
  shiver = lerp(shiver, clamp(e / 0.8, 0, 1), clamp(h * 1.5, 0, 1));
  sweat = lerp(sweat, clamp(-e / 0.6, 0, 1), clamp(h * 1.5, 0, 1));
  bf = lerp(bf, clamp(0.5 - e * 0.9, 0.05, 1), clamp(h, 0, 1));
  const H = H0 * (1 + exK * 1.3) + shiver * SHIV_MAX;
  const Lc = K_COND * (tc - env) * (0.35 + 0.65 * bf);
  const L = Lc + sweat * SWEAT_MAX;
  tc = clamp(tc + (H - L) * h / C_TH, 30, 43);
  ts = env + (tc - env) * (0.3 + 0.6 * bf);
  pilo = clamp(e * 1.4, 0, 1);
  lastH = H; lastL = L; lastLc = Lc;
  sampleAcc += h;
  while (sampleAcc >= 0.5) {
    sampleAcc -= 0.5;
    histT.push(tc); histS.push(tset);
    if (histT.length > 320) { histT.shift(); histS.shift(); }
  }
}
function fastForward(sec) {
  sec = clamp(sec, 0, 400);
  let guard = 0;
  while (sec > 0 && guard++ < 1700) { physStep(0.25); tSim += 0.25; sec -= 0.25; }
}

/* ================= 曲线(核心温度 vs 设定点) ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const pad = 34, padR = 12;
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const yOf = T => pad + (H - pad - pad) * (1 - (clamp(T, 34, 41) - 34) / 7);
  ctx.fillStyle = 'rgba(123,216,143,.13)';
  ctx.fillRect(pad, yOf(37.5), W - pad - padR, yOf(36.5) - yOf(37.5));
  ctx.strokeStyle = cTxt; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.lineTo(W - padR, H - pad); ctx.stroke();
  ctx.setLineDash([7, 6]);
  ctx.strokeStyle = '#7bd88f'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < histS.length; i++) {
    const x = pad + (W - pad - padR) * i / 320, y = yOf(histS[i]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = '#ffa94d'; ctx.lineWidth = 3.5;
  ctx.beginPath();
  for (let i = 0; i < histT.length; i++) {
    const x = pad + (W - pad - padR) * i / 320, y = yOf(histT[i]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.fillStyle = cTxt; ctx.font = '18px system-ui';
  ctx.fillText('41', pad - 26, yOf(41) + 6);
  ctx.fillText('37', pad - 26, yOf(37) + 6);
  ctx.fillText('34', pad - 26, yOf(34) + 6);
  ctx.fillText('°C', pad - 12, pad - 8);
}

    `产热 <b>${(lastH / H0 * 100).toFixed(0)}%</b>(基础 ${(100 * (1 + exK * 1.3)).toFixed(0)} + 颤抖 ${(shiver * SHIV_MAX / H0 * 100).toFixed(0)})vs 散热 <b>${(lastL / H0 * 100).toFixed(0)}%</b>(传导 ${(lastLc / H0 * 100).toFixed(0)} + 蒸发 ${((lastL - lastLc) / H0 * 100).toFixed(0)})→ dT/dt ${dTmin >= 0 ? '+' : ''}${dTmin.toFixed(2)} °C/min`,
    `<b>e = set-point − core = ${e >= 0 ? '+' : ''}${e.toFixed(2)} °C</b> → shiver ${(shiver * 100).toFixed(0)}% · sweat ${(sweat * 100).toFixed(0)}% · flow ${(bf * 100).toFixed(0)}%<br>` +
    `production <b>${(lastH / H0 * 100).toFixed(0)}%</b> (basal ${(100 * (1 + exK * 1.3)).toFixed(0)} + shiver ${(shiver * SHIV_MAX / H0 * 100).toFixed(0)}) vs loss <b>${(lastL / H0 * 100).toFixed(0)}%</b> (conduction ${(lastLc / H0 * 100).toFixed(0)} + evaporation ${((lastL - lastLc) / H0 * 100).toFixed(0)}) → dT/dt ${dTmin >= 0 ? '+' : ''}${dTmin.toFixed(2)} °C/min`);
}
elEnv.value = env; elEnvVal.textContent = env + ' °C';
elEnv.addEventListener('input', () => { env = +elEnv.value; elEnvVal.textContent = env + ' °C'; });
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = +elSpd.value; elSpdVal.textContent = speed.toFixed(1) + '×'; });
document.getElementById('btnFever').addEventListener('click', () => setFever(!fever));
document.getElementById('btnEx').addEventListener('click', () => setEx(!exOn));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglChart.addEventListener('change', () => {
  document.getElementById('plot').style.display = tglChart.checked ? '' : 'none';
  document.getElementById('stats').style.bottom = tglChart.checked ? '216px' : '18px';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 图形更新 ---------------- */
const tmpC = new THREE.Color();
function updateVisuals(dt, dts) {
  /* 颤抖:全身高频抖动 */
  shiverT += dts;
  bodyGrp.position.x = -1.35 + Math.sin(shiverT * 34) * 0.018 * shiver;
  bodyGrp.rotation.z = Math.sin(shiverT * 34 + 1) * 0.008 * shiver;
  heart.scale.setScalar(1 + Math.sin(shiverT * 6) * 0.06);
  /* 血管:粗细 + 颜色随皮肤血流 */
  const bfN = (bf - 0.05) / 0.95;
  M.vessel.color.copy(cCold).lerp(cHot, bfN);
  M.vessel.emissive.copy(cCold).lerp(cHot, bfN);
  const vk = 0.35 + 0.85 * bf;
  for (const v of vesselMeshes) v.scale.set(vk, 1, vk);
  /* 皮肤颜色随皮肤温度 */
  const sk = clamp((ts - 24) / 12, 0, 1);
  tmpC.copy(sk < 0.5 ? cSkinCold : cSkinNorm).lerp(sk < 0.5 ? cSkinNorm : cSkinHot, sk < 0.5 ? sk * 2 : (sk - 0.5) * 2);
  M.skin.color.copy(tmpC);
  M.shell.color.copy(tmpC);
  /* 核心光晕随核心温度 */
  coreGlow.material.color.copy(cCoreCold).lerp(cCoreHot, clamp((tc - 35) / 5.5, 0, 1));
  coreGlow.material.opacity = 0.1 + clamp((tc - 36.2) / 4, 0, 1) * 0.3;
  /* 下丘脑:失配越大越亮;发烧时染成致热原紫 */
  const e = tset - tc, ae = Math.min(Math.abs(e), 2);
  M.hypo.emissive.setHex(fever ? 0xb197fc : 0xffb454);
  M.hypo.emissiveIntensity = 0.5 + ae * 1.3 + (fever && tset < 38.8 ? 0.6 : 0);
  hypo.scale.setScalar(1 + Math.sin(shiverT * 6) * 0.1 * Math.min(ae, 1));
  hypoLight.color.setHex(fever ? 0xb197fc : 0xffa94d);
  hypoLight.intensity = ae * 1.4;
  /* 竖毛 */
  const rx = lerp(1.35, 0.22, pilo);
  for (let i = 0; i < hairBase.length; i++) {
    dummy.position.copy(hairBase[i].p);
    dummy.rotation.set(rx, 0, hairBase[i].rz);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    hairs.setMatrixAt(i, dummy.matrix);
  }
  hairs.instanceMatrix.needsUpdate = true;
  /* 汗滴:冒出→蒸发 */
  if (playing) {
    spawnAcc += dts * sweat * 24;
    while (spawnAcc >= 1) {
      spawnAcc -= 1;
      const s = sweatP.find(x => x.life <= 0);
      if (s) {
        const g = glandPos[(Math.random() * glandPos.length) | 0];
        s.life = 1;
        s.p.set(g.x + (Math.random() - 0.5) * 0.12, g.y + (Math.random() - 0.5) * 0.1, g.z + Math.random() * 0.03);
      }
    }
  }
  for (let i = 0; i < 48; i++) {
    const s = sweatP[i];
    if (s.life > 0) {
      s.life -= dt * 0.5;
      s.p.y -= dt * 0.05;
      const a = 1 - s.life;
      const sc = a < 0.3 ? a / 0.3 : Math.max(1 - (a - 0.3) / 0.7, 0.01);
      dummy.position.copy(s.p);
      dummy.scale.setScalar(Math.max(sc, 0.001) * (0.8 + sweat * 0.5));
    } else { dummy.position.set(0, -10, 0); dummy.scale.setScalar(0.001); }
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    sweatInst.setMatrixAt(i, dummy.matrix);
  }
  sweatInst.instanceMatrix.needsUpdate = true;
  /* 温度计 */
  const ek = (env + 10) / 55;
  mercCol.scale.y = 1.55 * ek + 0.02;
  mercCol.position.y = 0.32 + mercCol.scale.y / 2;
  M.merc.color.copy(cCold).lerp(cHot, ek);
  M.merc.emissive.copy(cCold).lerp(cHot, ek);
  /* 环路:脉冲速度 ∝ 失配活跃度,所在节点高亮 */
  if (playing) pulseA -= (0.4 + Math.min(Math.abs(e), 2.5) * 0.85) * dts;
  const TAU = Math.PI * 2;
  pulse.position.set(R * Math.cos(pulseA), R * Math.sin(pulseA), 0);
  const rel = (((nodeDefs[0].a - pulseA) % TAU) + TAU) % TAU;
  const actIdx = Math.floor(rel / (Math.PI / 2)) % 4;
  for (let i = 0; i < 4; i++) {
    loopNodes[i].material.emissiveIntensity = i === actIdx ? 1.6 : 0.55;
    loopNodes[i].scale.setScalar(i === actIdx ? 1.3 : 1);
  }
  /* 失配仪表 */
  const ee = clamp(e, -2, 2) / 2;
  meterBar.scale.y = Math.max(Math.abs(ee), 0.03);
  meterBar.position.y = Math.sign(ee || 1) * 0.225 * meterBar.scale.y;
  meterBar.material.color.setHex(e >= 0 ? 0x74c0fc : 0xff7a5c);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0, plotAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) { physStep(dts); tSim += dts; }
  updateVisuals(dt, dts);
  /* 读数 */
  const e = tset - tc;
  stTc.textContent = tc.toFixed(1) + ' °C';
  stTc.className = 'v ' + (warnState() ? 'hot' : tc > 36.3 && tc < 37.6 ? 'ok' : '');
  stSet.textContent = tset.toFixed(1) + ' °C';
  stE.textContent = (e >= 0 ? '+' : '') + e.toFixed(2) + ' °C';
  stE.className = 'v ' + (e > 0.05 ? 'b' : e < -0.05 ? 'hot' : '');
  stH.innerHTML = (lastH / H0 * 100).toFixed(0) + '<small> %</small>';
  stL.innerHTML = (lastL / H0 * 100).toFixed(0) + '<small> %</small>';
  stBF.innerHTML = (bf * 100).toFixed(0) + '<small> %</small>';
  lblStatus.element.className = 'lbl ' + (warnState() ? 'bad' : 'st');
  formulaAcc += dt;
  if (formulaAcc > 0.25) { formulaAcc = 0; updateFormula(); }
  plotAcc += dt;
  if (plotAcc > 0.2) { plotAcc = 0; if (tglChart.checked) drawPlot(); }
  for (const r of labelReg) if (labelsOn) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
fastForward(clamp(qsFloat('t', 0), 0, 400));
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
