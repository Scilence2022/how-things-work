<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光合作用光反应 · 两部光子电梯(Z 方案)动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#5aa03c;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#3f7d2c;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 420px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }

  /* ===== 工具条（全站共享模式） ===== */
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.h { color: #7fd0f7; }
  #stats .v.p { color: #f48fb1; }
  #stats .v.a { color: #43d17c; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 372px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.ph { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  .chip.e  { color: #bde9ff; border-color: rgba(127,208,247,.7); }
  .chip.h  { color: #9adcf2; border-color: rgba(154,220,242,.7); }
  .chip.o2 { color: #ffaaa2; border-color: rgba(255,138,128,.7); }
  :root[data-theme="light"] .chip.ph { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  :root[data-theme="light"] .chip.e  { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.h  { color: #17708f; border-color: rgba(23,112,143,.7); }
  :root[data-theme="light"] .chip.o2 { color: #b23b32; border-color: rgba(178,59,50,.7); }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(90,160,60,.13); border-color: rgba(90,160,60,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(63,125,44,.10); border-color: rgba(63,125,44,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #toggles label.hot { color: #9ccc65; font-weight: 600; }
  :root[data-theme="light"] #toggles label.hot { color: #3f7d2c; }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="光合作用的光反应：两部光子电梯——Z 方案" data-en="The light reactions: two photon elevators — the Z-scheme">光合作用的光反应：两部光子电梯——Z 方案</h1>
  <div class="sub" data-zh="水在这里裂解，O₂ 只是副产品；H⁺ 被送进类囊体腔，ATP 合酶和线粒体是同一台机器 · 空格播放/暂停" data-en="Water is split here and O₂ is just a by-product; H⁺ fills the thylakoid lumen — same ATP synthase machine as mitochondria · Space = play/pause">水在这里裂解，O₂ 只是副产品；H⁺ 被送进类囊体腔，ATP 合酶和线粒体是同一台机器 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="已入腔 H⁺（每 2 e⁻）" data-en="H⁺ into lumen (per 2 e⁻)">已入腔 H⁺（每 2 e⁻）</span><span class="v h" id="stH">0<small>/6</small></span>
  <span class="k" data-zh="NADPH" data-en="NADPH">NADPH</span><span class="v p" id="stN">0<small>/1</small></span>
  <span class="k" data-zh="ATP" data-en="ATP">ATP</span><span class="v a" id="stA">0<small>≈1.5–2</small></span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip ph" data-zh="光子 hν" data-en="photon hν">光子 hν</span>
    <span class="chip e" data-zh="e⁻ 电子（下坡渐暗）" data-en="e⁻ (dimming downhill)">e⁻ 电子（下坡渐暗）</span>
    <span class="chip h" data-zh="H⁺ 入腔" data-en="H⁺ into lumen">H⁺ 入腔</span>
    <span class="chip o2" data-zh="O₂（副产品）" data-en="O₂ (by-product)">O₂（副产品）</span>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglFlow" type="checkbox" checked> <span data-zh="H⁺ 流" data-en="H⁺ flow">H⁺ 流</span></label>
    <label class="hot"><input id="tglGreen" type="checkbox"> <span data-zh="改照绿光会怎样？" data-en="What if green light?">改照绿光会怎样？</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
const qs = new URLSearchParams(location.search);
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('光合作用光反应 · 两部光子电梯(Z 方案)动画',
                     'Light Reactions · Two Photon Elevators (Z-Scheme)');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标，等比留白缩放） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function dot(x, y, r, color, glow) {
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  circle(x, y, r, color);
  ctx.shadowBlur = 0;
}

/* ================= 常量:类囊体工厂布局与时序 ================= */
const CYCLE = 13;                 // 一个周期 = 2 个电子走完 Z 形全程
const MEM_Y = 400, MEM_H = 100;
const LUM_Y = 385, STR_Y = 545;   // 腔面(上) / 基质面(下)
const PSII = { x: 560, w: 180 };  // 光系统 Ⅱ(裂解水)
const B6F  = { x: 820, w: 160 };  // 细胞色素 b₆f(泵 H⁺)
const PSI  = { x: 1060, w: 160 }; // 光系统 Ⅰ
const ATPC = { x: 1400, w: 110 }; // ATP 合酶
const FNR  = { x: 1205, y: 535 }; // FNR(NADP⁺ 还原酶,基质侧)
const Q_PARK = { x: 700, y: 470 };// PQ(质体醌)膜内停靠
const PC_PARK = { x: 942, y: 386 };// PC(质体蓝素)腔面停靠
const COL_PH = '#ffe08a', COL_E1 = '#ffe9a8', COL_E2 = '#ffd166', COL_E3 = '#ff9f43', COL_E4 = '#ff7043';
const COL_H = '#7fd0f7', COL_PQ = '#ff9f43', COL_PQH = '#7ee2a0', COL_PC = '#b39ddb';
const COL_O2 = '#ff8a80', COL_H2O = '#4dd0e1', COL_NADP = '#f48fb1', COL_ATP = '#43d17c';
const PUMP_B6F = [0.34, 0.375, 0.41, 0.445];   // b₆f 泵 4 H⁺
const SPLIT_H  = [0.12, 0.17];                 // 水裂解留在腔内的 2 H⁺
const ATP_POP  = [0.80, 0.88, 0.95];
const PHO1 = [0.12, 0.20], PHO2 = [0.50, 0.58];// 两次光子电梯窗口

/* ================= 相位讲解 ================= */
const STEPS = [
  { t0: 0.00, t1: 0.22, n: 1, b: '光子电梯 Ⅰ · 水的光解', d: '光子撞上 PSII 的 P680,电子被抬上第一级电梯;水在锰簇裂解补位——O₂ 冒泡只是副产品,H⁺ 留在腔内,e⁻ 补进空位。',
    be: 'Photon elevator Ⅰ · water splitting', de: 'A photon strikes P680 in PSII, boosting an electron up elevator one; water splits at the Mn cluster to refill the hole — O₂ bubbles off as a by-product, H⁺ stays in the lumen.' },
  { t0: 0.22, t1: 0.46, n: 2, b: 'PQ 摆渡 · b₆f 泵 H⁺', d: '电子下坡经质体醌 PQ 到细胞色素 b₆f,借势把 H⁺ 泵进类囊体腔;质体蓝素 PC 在腔面接力。',
    be: 'PQ shuttle · b₆f pumps H⁺', de: 'The electron rolls downhill via plastoquinone to cytochrome b₆f, which uses the fall to pump H⁺ into the lumen; plastocyanin relays it along the lumen face.' },
  { t0: 0.46, t1: 0.60, n: 3, b: '光子电梯 Ⅱ · PSI', d: '第二个光子在 PSI 把电子再抬一次——Z 形曲线的第二个峰;铁氧还蛋白 Fd 在基质侧接住它。',
    be: 'Photon elevator Ⅱ · PSI', de: 'A second photon lifts the electron again in PSI — the second peak of the Z; ferredoxin catches it on the stroma side.' },
  { t0: 0.60, t1: 0.74, n: 4, b: 'FNR 造 NADPH', d: 'FNR 把 2 e⁻ + H⁺ 装上 NADP⁺ → NADPH——光合作用的「还原力」出厂,准备去卡尔文循环。',
    be: 'FNR makes NADPH', de: 'FNR loads 2 e⁻ + H⁺ onto NADP⁺ → NADPH — the cell\'s reducing power, shipped off to the Calvin cycle.' },
  { t0: 0.74, t1: 1.00, n: 5, b: '梯度发电', d: '腔内 H⁺ 经 ATP 合酶流回基质,每 120° 弹出一个 ATP。和线粒体是同一台机器——只是方向相反,燃料都叫「质子梯度」。',
    be: 'The gradient generates ATP', de: 'Lumenal H⁺ flows back through ATP synthase, popping one ATP per 120°. The same machine as mitochondria — running the other way, fueled by the same thing: a proton gradient.' },
];
function stepIndex(t) {
  if (t < 0.22) return 0;
  if (t < 0.46) return 1;
  if (t < 0.60) return 2;
  if (t < 0.74) return 3;
  return 4;
}

/* ================= 状态 ---------------- */
let showLabels = true, showFlow = true, green = qsBool('green', false);
let t01 = 0;

/* ================= 背景 / 膜 / 复合体 ================= */
function drawBg() {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(127,208,247,.05)'; ctx.fillRect(0, 0, W, MEM_Y);          // 类囊体腔
  ctx.fillStyle = 'rgba(67,209,124,.04)'; ctx.fillRect(0, MEM_Y + MEM_H, W, H);   // 基质
  text(L('类囊体腔 [H⁺] 高', 'Thylakoid lumen [H⁺] high'), 44, 66, 14, PAL.dim2);
  text(L('基质 [H⁺] 低', 'Stroma [H⁺] low'), 44, H - 40, 14, PAL.dim2);
}
function drawMembrane() {
  for (let x = 56; x < W - 40; x += 22) {
    circle(x, MEM_Y + 12, 7, 'rgba(154,167,184,.55)');
    circle(x, MEM_Y + MEM_H - 12, 7, 'rgba(154,167,184,.55)');
    line(x, MEM_Y + 20, x, MEM_Y + MEM_H - 20, 'rgba(154,167,184,.28)', 2);
  }
}
function complexBox(x, w, color, label, tag) {
  rrect(x - w / 2, MEM_Y - 12, w, MEM_H + 24, 16, color + '2e', color, 1.6);
  text(tag, x - w / 2 + 16, MEM_Y + MEM_H / 2 - 4, 19, color, 'center', 700);
  if (showLabels) text(label, x, MEM_Y - 22, 12.5, PAL.dim2, 'center');
}
function drawComplexes() {
  complexBox(PSII.x, PSII.w, '#ff9f43', L('PSⅡ 光系统 Ⅱ(裂解水)', 'PSⅡ (splits water)'), 'Ⅱ');
  complexBox(B6F.x, B6F.w, '#cbaee8', L('Cyt b₆f(泵 H⁺)', 'Cyt b₆f (pumps H⁺)'), 'b₆f');
  complexBox(PSI.x, PSI.w, '#7fd0f7', L('PSⅠ 光系统 Ⅰ', 'PSⅠ'), 'Ⅰ');
  complexBox(ATPC.x, ATPC.w, '#43d17c', L('ATP 合酶', 'ATP synthase'), 'ATP');
  // FNR(基质侧小酶)
  circle(FNR.x, FNR.y, 16, '#f48fb12e', '#f48fb1', 1.6);
  if (showLabels) text(L('FNR', 'FNR'), FNR.x, FNR.y + 34, 12, PAL.dim2, 'center');
}

/* ================= 光子(两次电梯;绿光被弹回) ================= */
function photon(x0, hitX, hitY, t0, t1) {
  if (t01 < t0 || t01 > t1 + 0.03) return;
  const k = clamp((t01 - t0) / (t1 - t0 - 0.03), 0, 1);
  const prog = green ? (k < 0.5 ? k * 2 * 0.62 : (1 - k) * 2 * 0.62) : k * 0.92;  // 绿光半途弹回
  const x = lerp(x0, hitX, prog), y = lerp(120, hitY, prog);
  ctx.strokeStyle = green ? '#b8c2cf' : COL_PH; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i <= 20; i++) {
    const kk = i / 20 * prog;
    const wx = lerp(x0, hitX, kk), wy = lerp(120, hitY, kk) + 10 * Math.sin(kk * 40);
    i ? ctx.lineTo(wx, wy) : ctx.moveTo(wx, wy);
  }
  ctx.stroke();
  dot(x, y + 10 * Math.sin(prog * 40), 7, green ? '#b8c2cf' : COL_PH, 12);
  if (showLabels && k < 0.9) text(green ? L('绿光被弹回!', 'green bounces off!') : L('光子 hν', 'photon hν'), x + 16, y - 8, 12, green ? PAL.dim2 : COL_PH, 'center', 700);
  if (!green && k >= 0.99) {   // 命中闪光
    const fk = ss(t1 - 0.03, t1 + 0.03, t01);
    if (fk < 1) { ctx.globalAlpha = 1 - fk; circle(hitX, hitY, 14 + 26 * fk, null, COL_PH, 2.5); ctx.globalAlpha = 1; }
  }
}
function drawPhotons() {
  photon(240, PSII.x, MEM_Y + 20, PHO1[0], PHO1[1]);
  photon(240, PSI.x, MEM_Y + 20, PHO2[0], PHO2[1]);
}

/* ================= 载体:PQ / PC ================= */
function qState(t) {
  let x = Q_PARK.x, carrying = false;
  if (green) return { x, y: Q_PARK.y, carrying };
  if (t >= 0.18 && t < 0.24) x = lerp(Q_PARK.x, PSII.x + PSII.w / 2 + 16, ss(0.18, 0.22, t));
  else if (t >= 0.24 && t < 0.34) { x = lerp(PSII.x + PSII.w / 2 + 16, B6F.x - B6F.w / 2 - 16, ss(0.24, 0.34, t)); carrying = t >= 0.22; }
  else if (t >= 0.34 && t < 0.40) { x = B6F.x - B6F.w / 2 - 16; carrying = t < 0.38; }
  else if (t >= 0.40 && t < 0.48) x = lerp(B6F.x - B6F.w / 2 - 16, Q_PARK.x, ss(0.40, 0.48, t));
  return { x, y: Q_PARK.y, carrying };
}
function pcState(t) {
  let x = PC_PARK.x, carrying = false;
  if (green) return { x, y: PC_PARK.y, carrying };
  if (t >= 0.42 && t < 0.46) x = lerp(PC_PARK.x, B6F.x + 42, ss(0.42, 0.46, t));
  else if (t >= 0.46 && t < 0.56) { x = lerp(B6F.x + 42, PSI.x - PSI.w / 2 - 10, ss(0.46, 0.56, t)); carrying = true; }
  else if (t >= 0.56 && t < 0.62) { x = PSI.x - PSI.w / 2 - 10; carrying = t < 0.58; }
  else if (t >= 0.62 && t < 0.70) x = lerp(PSI.x - PSI.w / 2 - 10, PC_PARK.x, ss(0.62, 0.70, t));
  return { x, y: PC_PARK.y, carrying };
}
function drawCarriers(t) {
  const q = qState(t);
  circle(q.x, q.y, 13, q.carrying ? COL_PQH + 'cc' : COL_PQ + 'cc', COL_PQ, 1.6);
  text('PQ', q.x, q.y + 4, 10.5, '#10141b', 'center', 700);
  if (showLabels && Math.abs(q.x - Q_PARK.x) < 4) text(L('PQ 质体醌(膜内摆渡)', 'PQ (shuttle in membrane)'), q.x, q.y + 30, 12, PAL.dim2, 'center');
  const c = pcState(t);
  circle(c.x, c.y, 12, c.carrying ? '#cbb3ec' : COL_PC + '99', COL_PC, 1.6);
  text('PC', c.x, c.y + 4, 10.5, '#10141b', 'center', 700);
  if (showLabels && Math.abs(c.x - PC_PARK.x) < 4) text(L('PC 质体蓝素(腔面接力)', 'PC (relay on lumen face)'), c.x, c.y - 20, 12, PAL.dim2, 'center');
}

/* ================= 电子(Z 形全程;绿光停摆) ================= */
const EKEY = [
  [0.12, 545, 505], [0.22, 578, 470], [0.24, 666, 470], [0.34, 742, 470],
  [0.38, 820, 405], [0.42, 862, 386], [0.56, 1005, 386], [0.60, 1060, 405],
  [0.64, 1120, 505], [0.70, 1180, 530], [0.74, 1205, 535],
];
function eCol(t) { return t < 0.24 ? COL_E1 : t < 0.42 ? COL_E2 : t < 0.60 ? COL_E3 : COL_E4; }
function drawElectrons(t) {
  if (green || t < 0.12 || t >= 0.74) return;
  let i = 0;
  while (i < EKEY.length - 2 && t > EKEY[i + 1][0]) i++;
  const [t0, x0, y0] = EKEY[i], [t1, x1, y1] = EKEY[i + 1];
  const k = ss(t0, t1, t);
  const x = lerp(x0, x1, k), y = lerp(y0, y1, k);
  const col = eCol(t);
  dot(x - 7, y, 6.5, col, 10); dot(x + 7, y, 6.5, col, 10);
  if (showLabels && t < 0.18) text(L('2 e⁻', '2 e⁻'), x + 26, y - 10, 12, col);
}

/* ================= 水的光解 / H⁺ / ATP 合酶 ================= */
function hdot(x, y, r = 7.5, a = 1) {
  dot(x, y, r, COL_H);
  ctx.globalAlpha = a;
  text('+', x, y + 4, 10, '#0d1117', 'center', 700);
  ctx.globalAlpha = 1;
}
function drawWater(t) {
  if (green) return;
  const inK = ss(0.02, 0.08, t);
  if (t < 0.16) {
    const x = lerp(500, PSII.x - 14, inK), y = lerp(220, MEM_Y - 6, inK);
    circle(x, y, 9, COL_H2O + 'cc');
    if (showLabels && inK < 1) text('H₂O', x + 18, y + 4, 12, COL_H2O, 'center', 700);
  }
  const split = ss(0.10, 0.16, t);
  if (split > 0 && split < 1) {   // 裂解闪光
    ctx.globalAlpha = 1 - split; circle(PSII.x - 14, MEM_Y - 6, 12 + 22 * split, null, COL_H2O, 2.5); ctx.globalAlpha = 1;
  }
  if (t >= 0.14 && t < 0.34) {    // O₂ 气泡升入腔
    const k = ss(0.14, 0.30, t);
    const bx = PSII.x - 14 + 10 * Math.sin(k * 9), by = lerp(MEM_Y - 10, 130, k);
    const r = 8 + 3 * Math.sin(k * 12);
    circle(bx, by, Math.max(r, 1), COL_O2 + 'cc', COL_O2, 1.4);
    text('O₂', bx, by + 4, 10, '#0d1117', 'center', 700);
    if (showLabels && k > 0.4 && k < 0.9) text(L('O₂ 副产品 → 交给呼吸链', 'O₂ by-product → to the ETC'), bx + 30, by, 12, COL_O2, 'center', 700);
  }
}
function drawPumps(t) {
  if (!showFlow || green) return;
  for (const f of SPLIT_H) {      // 水裂解留在腔内的 H⁺
    const k = ss(f, f + 0.04, t);
    if (k > 0 && k < 1) hdot(PSII.x + 20 + (f === SPLIT_H[0] ? -10 : 14), lerp(MEM_Y - 4, 300, k), 6.5);
  }
  PUMP_B6F.forEach((f, i) => {    // b₆f 基质 → 腔
    const k = ss(f, f + 0.045, t);
    if (k > 0 && k < 1) hdot(B6F.x - 24 + i * 16, lerp(STR_Y, LUM_Y, k));
  });
  // 腔内环境 H⁺(随积累变密)
  const pumped = [...SPLIT_H, ...PUMP_B6F].filter(f => t > f + 0.04).length;
  for (let i = 0; i < 12; i++) {
    if (i >= Math.max(pumped * 2, 3) && pumped < 6) break;
    const bx = 480 + (i * 143) % 1040, by = 100 + (i * 97) % 230;
    hdot(bx, by + 5 * Math.sin(t * Math.PI * 4 + i), 6, 0.55);
  }
  for (let i = 0; i < 3; i++) hdot(560 + i * 300, 640 + 6 * Math.sin(t * Math.PI * 4 + i * 2), 6, 0.35);
  if (showLabels && t > 0.34 && t < 0.46) text(L('H⁺ 上坡入腔', 'H⁺ pumped into lumen'), B6F.x + 60, STR_Y - 40, 12.5, COL_H, 'center', 700);
}
function drawAtpase(t) {
  const x = ATPC.x;
  rrect(x - 13, MEM_Y + 4, 26, MEM_H - 8, 8, 'rgba(0,0,0,.18)', COL_ATP + '88', 1);
  const flowGate = green ? 0 : 1;
  if (showFlow) {
    for (let i = 0; i < 6; i++) {
      if (t < 0.74 || t > 0.97 || green) break;
      const k = ((t - 0.74) * 3 + i / 6) % 1;
      hdot(x - 6 + (i % 2) * 12, lerp(MEM_Y + 8, MEM_Y + MEM_H - 4, k), 6.5);
    }
  }
  const hy = MEM_Y + MEM_H + 34;
  const ang = 5 * Math.PI * ss(0.74, 0.96, t) * flowGate;
  circle(x, hy, 40, COL_ATP + '2b', COL_ATP, 1.8);
  for (let i = 0; i < 3; i++) {
    const a = ang + i * Math.PI * 2 / 3;
    circle(x + Math.cos(a) * 26, hy + Math.sin(a) * 26, 12, COL_ATP + '99');
  }
  line(x + 46, MEM_Y + 30, x + 46, hy - 8, COL_ATP + '77', 3);
  ATP_POP.forEach((pt) => {
    const k = ss(pt, pt + 0.06, t);
    if (k <= 0 || k >= 1 || green) return;
    dot(x + 50 + 60 * k, hy + 26 + 26 * k, 9, COL_ATP, 12);
    text('ATP', x + 50 + 60 * k, hy + 26 + 26 * k + 3.5, 8.5, '#0d1117', 'center', 700);
  });
  if (showLabels) {
    text(L('ATP 合酶(和线粒体同一台)', 'ATP synthase (same machine as mitochondria)'), x, hy + 66, 12, PAL.dim2, 'center');
    if (t > 0.76 && t < 0.95 && !green) text(L('H⁺ 出腔 → 转子转动', 'H⁺ leaves lumen → rotor turns'), x - 20, MEM_Y - 22, 12.5, COL_ATP, 'center', 700);
  }
}
function drawNadp(t) {
  if (green) return;
  const inK = ss(0.58, 0.66, t), outK = ss(0.72, 0.80, t);
  const made = t >= 0.74;
  if (inK > 0 && outK < 1) {
    const x = lerp(1330, FNR.x + 52, inK), y = lerp(600, FNR.y + 4, inK);
    const col = made ? COL_NADP : PAL.dim;
    rrect(x - 36, y - 14, 72, 28, 14, col + '30', col, 1.6);
    text(made ? 'NADPH' : 'NADP⁺', x, y + 5, 12.5, col, 'center', 700);
    if (made && showLabels) text(L('还原力 → 卡尔文循环', 'reducing power → Calvin cycle'), x + 6, y - 24, 12, COL_NADP, 'center', 700);
  }
}
function drawGreenNote() {
  if (!green) return;
  rrect(W / 2 - 300, MEM_Y + MEM_H + 26, 600, 56, 12, 'rgba(184,194,207,.12)', 'rgba(184,194,207,.7)', 1.4);
  text(L('绿光被弹回:叶绿素显绿色,正是因为它几乎不吸收绿光——两部「光子电梯」都停了。',
    'Green bounces off: chlorophyll is green because it barely absorbs green — both photon elevators are stalled.'),
    W / 2, MEM_Y + MEM_H + 50, 13.5, PAL.dim, 'center', 700);
  text(L('改照红光/蓝光(勾掉本选项)即可重新发电梯。', 'Switch back to red/blue light (untick) to restart the elevators.'),
    W / 2, MEM_Y + MEM_H + 70, 12, PAL.dim2, 'center');
}

/* ================= Z 形示意小卡(右上,签名时刻) ================= */
function drawZInset(t) {
  const X = 1228, Y = 58, Wd = 344, Ht = 220;
  const hl = (!green && (t < 0.24 || (t > 0.46 && t < 0.62)));
  rrect(X, Y, Wd, Ht, 14, PAL.pill, hl ? 'rgba(255,224,138,.8)' : PAL.grid, hl ? 1.6 : 1);
  text(L('Z 方案:电子的两部电梯', 'Z-scheme: two photon elevators'), X + 16, Y + 26, 13, PAL.dim);
  const pts = [
    [X + 26, Y + 176], [X + 26, Y + 66],   // P680 抬升(电梯Ⅰ)
    [X + 92, Y + 138], [X + 136, Y + 146], // Q → b₆f
    [X + 178, Y + 158],                    // PC
    [X + 214, Y + 148], [X + 214, Y + 52], // P700 抬升(电梯Ⅱ)
    [X + 276, Y + 120], [X + 318, Y + 128],// Fd → NADPH
  ];
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2;
  ctx.beginPath();
  pts.forEach(([px2, py2], i) => { i ? ctx.lineTo(px2, py2) : ctx.moveTo(px2, py2); });
  ctx.stroke();
  // 电梯箭头
  const boost = (bx, by, on) => {
    if (green) { text('✕', bx + 8, by - 34, 15, PAL.dim2, 'center', 700); return; }
    ctx.strokeStyle = COL_PH; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(bx, by - 8); ctx.lineTo(bx, by - 38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx - 5, by - 30); ctx.lineTo(bx, by - 38); ctx.lineTo(bx + 5, by - 30); ctx.stroke();
    text('hν', bx + 14, by - 26, 10.5, COL_PH, 'center', 700);
    void on;
  };
  boost(X + 26, Y + 176, t < 0.24);
  boost(X + 214, Y + 148, t >= 0.46 && t < 0.62);
  // 站名
  text('P680', X + 26, Y + 196, 10.5, PAL.dim2, 'center');
  text('Q', X + 92, Y + 158, 10.5, PAL.dim2, 'center');
  text('b₆f', X + 136, Y + 166, 10.5, PAL.dim2, 'center');
  text('P700', X + 214, Y + 168, 10.5, PAL.dim2, 'center');
  text('Fd', X + 276, Y + 140, 10.5, PAL.dim2, 'center');
  text('NADPH', X + 318, Y + 148, 10.5, PAL.dim2, 'center');
  // 电子游标
  if (!green && t >= 0.12 && t < 0.74) {
    let i = 0;
    while (i < pts.length - 2 && t > [0.22, 0.24, 0.34, 0.42, 0.46, 0.60, 0.70, 0.74][i]) i++;
    const gates = [0.22, 0.24, 0.34, 0.42, 0.46, 0.60, 0.70, 0.74];
    const k = ss(gates[i], gates[i + 1] ?? 1, t);
    const mx = lerp(pts[i][0], pts[i + 1][0], k), my = lerp(pts[i][1], pts[i + 1][1], k);
    dot(mx, my, 5, eCol(t), 10);
  }
  if (green) text(L('停摆', 'stalled'), X + 120, Y + 100, 12, PAL.dim2, 'center', 700);
}

/* ================= 计数 / 主绘制 ================= */
const stH = document.getElementById('stH'), stN = document.getElementById('stN'), stA = document.getElementById('stA');
let lastH = -1, lastN = -1, lastA = -1;
function updateStats(t) {
  const h = green ? 0 : [...SPLIT_H, ...PUMP_B6F].filter(f => t > f + 0.04).length;
  const n = (!green && t >= 0.74) ? 1 : 0;
  const a = green ? 0 : ATP_POP.filter(pt => t > pt).length;
  if (h !== lastH) { stH.innerHTML = h + '<small>/6</small>'; lastH = h; }
  if (n !== lastN) { stN.innerHTML = n + '<small>/1</small>'; lastN = n; }
  if (a !== lastA) { stA.innerHTML = a + '<small>≈1.5–2</small>'; lastA = a; }
}
function draw(t) {
  drawBg();
  drawMembrane();
  drawComplexes();
  drawAtpase(t);
  drawPhotons();
  drawWater(t);
  drawCarriers(t);
  drawNadp(t);
  drawElectrons(t);
  drawPumps(t);
  drawGreenNote();
  drawZInset(t);
}

/* ================= UI / 主循环 ================= */
let cycles = (() => { const v = parseFloat(qs.get('t')); return Number.isFinite(v) ? v : 0; })();
let playing = !qsBool('pause', false);
let speed = (() => { const v = parseFloat(qs.get('speed')); return Number.isFinite(v) ? v : 1; })();

const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elScrub = document.getElementById('scrub');
const elScrubVal = document.getElementById('scrubVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglFlow = document.getElementById('tglFlow');
const tglGreen = document.getElementById('tglGreen');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
elScrub.addEventListener('input', () => { cycles = Math.floor(cycles) + parseInt(elScrub.value, 10) / 1000; });
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglFlow.addEventListener('change', () => { showFlow = tglFlow.checked; });
tglGreen.addEventListener('change', () => { green = tglGreen.checked; });
tglGreen.checked = green;   // 同步 URL 指定的绿光状态
if (!qsBool('labels', true)) { tglLabels.checked = false; showLabels = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

let lastStep = -1, last = performance.now();
applyTheme();
applyLang();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (playing) cycles += dt * speed / CYCLE;
  t01 = cycles - Math.floor(cycles);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(t01);
  updateStats(t01);

  const si = stepIndex(t01);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t01 * 1000);
  elScrubVal.textContent = Math.round(t01 * 100) + '%';
}
requestAnimationFrame(frame);
</script>
</body>
