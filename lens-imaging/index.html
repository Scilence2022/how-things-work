<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>透镜成像 · 拖物距穿过一倍焦距</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#63e6be;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0ca678;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(99,230,190,.9); color: #c3f5e5; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(12,166,120,.9); color: #0ca678; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #63e6be; }
  #stats .v.b { color: #74c0fc; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #modeRow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
  .bon { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 5px 8px; text-align: left; line-height: 1.25;
    transition: border-color .15s, color .15s, background .15s; }
  .bon b { display: block; font-size: 12.5px; }
  .bon i { display: block; font-style: normal; font-size: 10.5px; opacity: .75; }
  .bon:hover { border-color: var(--acc); }
  .bon.on { border-color: var(--acc); color: var(--text); background: rgba(99,230,190,.12); }
  :root[data-theme="light"] .bon.on { background: rgba(12,166,120,.08); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(99,230,190,.10); border-color: rgba(99,230,190,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,166,120,.08); border-color: rgba(12,166,120,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #c3f5e5; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="透镜成像：拖物距穿过一倍焦距" data-en="Lens Imaging: drag the object through 1f">透镜成像：拖物距穿过一倍焦距</h1>
  <div class="sub" data-zh="三条特殊光线定位像:1/f = 1/u + 1/v;物距过 f 的瞬间实像⇄虚像翻转;眼睛 = 会自动变焦的透镜,近视只是焦点落早了 · 空格播放/暂停" data-en="Three special rays locate the image: 1/f = 1/u + 1/v; cross f and real flips to virtual; the eye is an auto-focusing lens — myopia just focuses early · Space = play/pause">三条特殊光线定位像:1/f = 1/u + 1/v;物距过 f 的瞬间实像⇄虚像翻转;眼睛 = 会自动变焦的透镜,近视只是焦点落早了 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="物距 u" data-en="object u">物距 u</span><span class="v" id="stU">—</span>
  <span class="k" data-zh="像距 v" data-en="image v">像距 v</span><span class="v g" id="stV">—</span>
  <span class="k" data-zh="放大率 m" data-en="magnification m">放大率 m</span><span class="v b" id="stM">—</span>
  <span class="k" data-zh="像的性质" data-en="image type">像的性质</span><span class="v" id="stT">—</span>
</div>

<div id="panel">
  <div id="modeRow">
    <button class="bon on" id="mBench"><b data-zh="光具座" data-en="optical bench">光具座</b><i data-zh="实像/虚像翻转" data-en="real ⇄ virtual flip">实像/虚像翻转</i></button>
    <button class="bon" id="mEye"><b data-zh="眼睛与眼镜" data-en="eye &amp; glasses">眼睛与眼镜</b><i data-zh="睫状肌变焦 + 近视矫正" data-en="accommodation + myopia fix">睫状肌变焦 + 近视矫正</i></button>
  </div>
  <div class="row" id="rowU"><label data-zh="物距 u" data-en="object u">物距 u</label><input id="u" type="range" min="30" max="450" step="5" value="280"><span class="val" id="uVal">2.80</span></div>
  <div class="row" id="rowF" style="display:none"><label data-zh="睫状肌(变焦)" data-en="accommodation">睫状肌(变焦)</label><input id="acc" type="range" min="0" max="100" step="5" value="50"><span class="val" id="accVal">50%</span></div>
  <div class="row" id="rowG" style="display:none"><label data-zh="眼镜度数" data-en="glasses">眼镜度数</label><input id="glas" type="range" min="0" max="100" step="5" value="0"><span class="val" id="glasVal">无</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../refraction/" data-zh="折射:透镜的物理根基" data-en="refraction: the root of lenses">折射:透镜的物理根基</a>
    <a href="../camera-sensor/" data-zh="应用:相机传感器(规划中)" data-en="camera sensors (planned)">应用:相机传感器(规划中)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
let mode = qs.get('mode') === 'eye' ? 'eye' : 'bench';

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('透镜成像', 'Lens Imaging');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.2, 2.6, 7.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.6, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 24;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  bench: mat(0x39424f, { roughness: 0.7 }),
  lens: new THREE.MeshPhysicalMaterial({ color: 0x9adbe8, transparent: true, opacity: 0.4, roughness: 0.1, metalness: 0.05 }),
  rayA: new THREE.MeshBasicMaterial({ color: 0xffe066 }),
  rayB: new THREE.MeshBasicMaterial({ color: 0xff8787 }),
  rayC: new THREE.MeshBasicMaterial({ color: 0x74c0fc }),
  rayV: new THREE.MeshBasicMaterial({ color: 0xffa8a8, transparent: true, opacity: 0.45 }),
  obj: mat(0xffd166, { emissive: 0xffd166, emissiveIntensity: 0.3 }),
  img: mat(0x63e6be, { emissive: 0x63e6be, emissiveIntensity: 0.25 }),
  eye: mat(0xf1f3f5, { roughness: 0.4 }),
  iris: mat(0x1971c2, { roughness: 0.4 }),
  retina: mat(0xff6b6b, { emissive: 0xff6b6b, emissiveIntensity: 0.25 }),
  glasses: new THREE.MeshPhysicalMaterial({ color: 0xbfd8e8, transparent: true, opacity: 0.35, roughness: 0.1 }),
};

/* ================= 模式 A:光具座 ================= */
const benchGrp = new THREE.Group();
scene.add(benchGrp);
const OPT_Y = 1.3;
{
  const rail = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.1, 0.3), M.bench);
  rail.position.set(0.6, 0.35, 0);
  benchGrp.add(rail);
}
/* 物(箭头) */
const objGrp = new THREE.Group();
scene.add(objGrp);
const objBar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.7, 0.05), M.obj);
objBar.position.y = 0.35;
objGrp.add(objBar);
const objTip = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.2, 12), M.obj);
objTip.position.y = 0.78;
objGrp.add(objTip);
/* 透镜(双凸,拉伸圆片) */
const lensGrp = new THREE.Group();
lensGrp.position.set(0, OPT_Y, 0);
scene.add(lensGrp);
const lensMesh = new THREE.Mesh(new THREE.SphereGeometry(0.75, 32, 24), M.lens);
lensMesh.scale.set(0.14, 1, 1);
lensGrp.add(lensMesh);
/* 像(箭头,可正可倒可虚) */
const imgGrp = new THREE.Group();
scene.add(imgGrp);
const imgBar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.7, 0.05), M.img);
imgBar.position.y = -0.35;
imgGrp.add(imgBar);
const imgTip = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.2, 12), M.img);
imgTip.position.y = -0.78;
imgTip.rotation.z = Math.PI;
imgGrp.add(imgTip);
/* 光线:三条特殊光线(每条 = 折前 + 折后两段) */
function mkRay(m) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 1, 8), m);
  scene.add(mesh);
  mesh.setSeg = (a, b) => {
    const d = new THREE.Vector3().subVectors(b, a);
    mesh.scale.y = Math.max(d.length(), 0.001);
    mesh.position.copy(a).addScaledVector(d, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
  };
  return mesh;
}
const ray1a = mkRay(M.rayA), ray1b = mkRay(M.rayA);
const ray2a = mkRay(M.rayB), ray2b = mkRay(M.rayB);
const ray3a = mkRay(M.rayC), ray3b = mkRay(M.rayC);
const rayV1 = mkRay(M.rayV), rayV2 = mkRay(M.rayV);
/* 焦点标记 */
const fMarks = [];
for (const x of [-1, 1]) {
  const f = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.015, 8, 20), M.frame);
  f.position.set(x, OPT_Y, 0);
  scene.add(f);
  fMarks.push(f);
}
const floorA = new THREE.Mesh(new THREE.BoxGeometry(10, 0.16, 3), M.floor);
floorA.position.set(0.5, -0.1, 0);
scene.add(floorA);

/* ================= 模式 B:眼睛 ================= */
const eyeGrp = new THREE.Group();
scene.add(eyeGrp);
/* 眼球(剖面:后半球实 + 前开口) */
const eyeball = new THREE.Mesh(new THREE.SphereGeometry(1.0, 36, 24, 0, Math.PI * 2, 0, Math.PI / 2), M.eye);
eyeball.rotation.x = -Math.PI / 2;    // 开口朝 +x
eyeball.position.set(0, 1.3, 0);
eyeGrp.add(eyeball);
const retina = new THREE.Mesh(new THREE.SphereGeometry(0.9, 36, 24, 0, Math.PI * 2, 0, Math.PI / 2), M.retina);
retina.rotation.x = -Math.PI / 2;
retina.position.set(0, 1.3, 0);
eyeGrp.add(retina);
/* 角膜+晶状体(可变焦凸透镜) */
const eyeLens = new THREE.Mesh(new THREE.SphereGeometry(0.34, 32, 24), M.lens);
eyeLens.scale.set(0.4, 1, 1);
eyeLens.position.set(0.75, 1.3, 0);
eyeGrp.add(eyeLens);
const irisM = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.06, 10, 32), M.iris);
irisM.rotation.y = Math.PI / 2;
irisM.position.set(0.95, 1.3, 0);
eyeGrp.add(irisM);
/* 眼镜(凹透镜,可出现) */
const glasses = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.1, 12, 32), M.glasses);
glasses.rotation.y = Math.PI / 2;
glasses.position.set(1.6, 1.3, 0);
glasses.visible = false;
eyeGrp.add(glasses);
/* 远处物体(小箭头) */
const farObj = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.4, 0.05), M.obj);
farObj.position.set(4.5, 1.55, 0);
eyeGrp.add(farObj);
/* 眼内光线(聚焦束) */
const eyeRays = [];
for (const dy of [-0.06, 0, 0.06]) {
  const r = mkRay(M.rayA);
  eyeRays.push(r);
}
const floorB = new THREE.Mesh(new THREE.BoxGeometry(10, 0.16, 3), M.floor);
floorB.position.set(0.5, -0.35, 0);
scene.add(floorB);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let u = 2.8;                 // 物距(bench)
const F = 1.5;               // 焦距(bench)
let accommod = 0.5;          // 睫状肌 0=看远(平) 1=看近(凸)
let glassesOn = 0;           // 0..1 度数
let tSim = 0;
/* 眼:视网膜距离固定 1.0(相对单位);焦点=f(acc,glasses);物距固定远 */
function eyeF() {
  /* 未矫正近视:晶状体偏厚,焦点偏短 */
  const base = 0.78 - 0.10 * accommod;   // 变焦范围
  return base + glassesOn * 0.10;
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblObj = addLabel(() => L('物体', 'object'), new THREE.Vector3(0, 1.05, 0), 'g', objGrp);
const lblLens = addLabel(() => L(`凸透镜 f = ${F}`, `lens f = ${F}`), new THREE.Vector3(0, OPT_Y + 1.0, 0), 'b', lensGrp);
const lblImg = addLabel(() => {
  const v = F * u / (u - F);
  if (u > F) return L(`实像:倒立,${Math.abs(v / u) >= 1 ? '放大' : '缩小'}`, `real: inverted, ${Math.abs(v / u) >= 1 ? 'magnified' : 'reduced'}`);
  return L('虚像:正立放大(同侧)', 'virtual: upright, magnified (same side)');
}, new THREE.Vector3(0, 0.4, 0), 'g', imgGrp);
const lblEye = addLabel(() => L('视网膜:焦点要正好落在这里', 'retina: the focus must land here'), new THREE.Vector3(-0.4, 2.5, 0), 'b', eyeGrp);
const lblStatus = addLabel(() => mode === 'bench'
  ? u > F ? L('实像:光线真的会聚,屏幕接得住', 'real image: rays truly converge — a screen can catch it')
  : L('虚像:光线发散,只能用眼睛逆着看', 'virtual image: rays diverge — only your eye can trace them back')
  : glassesOn > 0.4 ? L('凹镜预弯光线:焦点后移,正好落在视网膜 ✓', 'minus lens pre-bends rays: focus lands on the retina ✓')
  : L('近视:晶状体太凸,焦点落在视网膜之前', 'myopia: lens too strong, focus falls short of the retina'),
  new THREE.Vector3(0.8, 3.6, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS_BENCH = [
  { b: '三条特殊光线', be: 'Three special rays',
    d: '平行光过焦点、过光心不拐弯、过焦点变平行——三条一画,像的位置不用背公式都能找出来。',
    de: 'Parallel→focus, through-center straight, focus→parallel: draw three lines and the image locates itself.',
    act: () => { u = 2.8; document.getElementById('u').value = 280; document.getElementById('uVal').textContent = '2.80'; } },
  { b: '物距过 f:实像⇄虚像', be: 'Cross 1f: real ⇄ virtual',
    d: 'u > f:光线真的会聚,倒立实像;u 拖进 f 以内:光线发散,反向延长线交出一个正立放大的虚像——放大镜模式。',
    de: 'Beyond f the rays truly converge (inverted, real); inside f they diverge — backward extensions build an upright magnified virtual image.',
    act: () => { u = 1.2; document.getElementById('u').value = 120; document.getElementById('uVal').textContent = '1.20'; } },
  { b: 'u = 2f:等大倒立', be: 'At 2f: same size, inverted',
    d: '物距等于两倍焦距:像与物等大、倒立——投影仪与相机分界线上的一站。',
    de: 'At u = 2f the image equals the object in size, inverted — the boundary station between projector and camera.',
    act: () => { u = 3.0; document.getElementById('u').value = 300; document.getElementById('uVal').textContent = '3.00'; } },
  { b: '放大率 m = v/u', be: 'Magnification m = v/u',
    d: '像的大小与倒正全在 m 里:负号是倒立,绝对值是倍数——右下角实时读数。',
    de: 'Size and orientation live in m: the minus sign means inverted, the magnitude is the factor.',
    act: () => { u = 4.2; document.getElementById('u').value = 420; document.getElementById('uVal').textContent = '4.20'; } },
];
const STEPS_EYE = [
  { b: '眼睛 = 自动变焦镜头', be: 'The eye: an auto-zoom lens',
    d: '睫状肌收紧,晶状体变凸、焦距变短——看近处时自动「加度数」,全程无需拧对焦环。',
    de: 'Ciliary muscles squeeze the lens thicker for near work — autofocus with no focusing ring.',
    act: () => { accommod = 0.9; document.getElementById('acc').value = 90; document.getElementById('accVal').textContent = '90%'; glassesOn = 0; document.getElementById('glas').value = 0; document.getElementById('glasVal').textContent = L('无', 'none'); } },
  { b: '近视:焦点落早了', be: 'Myopia: focuses too early',
    d: '眼轴过长或晶状体过厚,远处的光在视网膜前就会聚——落到视网膜上时又散开了,所以远的东西糊。',
    de: 'A long eyeball or strong lens converges distant light in front of the retina — by the time it lands, it has blurred again.',
    act: () => { accommod = 0.9; document.getElementById('acc').value = 90; document.getElementById('accVal').textContent = '90%'; glassesOn = 0; document.getElementById('glas').value = 0; document.getElementById('glasVal').textContent = L('无', 'none'); } },
  { b: '眼镜:预弯光线', be: 'Glasses: pre-bending rays',
    d: '凹透镜先把光线发散一点,再进眼——焦点后移,正好落回视网膜。拖「眼镜度数」看光线归位。',
    de: 'A minus lens diverges slightly first, pushing the focus back onto the retina. Drag the prescription and watch the rays align.',
    act: () => { glassesOn = 0.8; document.getElementById('glas').value = 80; document.getElementById('glasVal').textContent = '−2.5 D'; } },
  { b: '远视与老花', be: 'Hyperopia & presbyopia',
    d: '远视相反:焦点落得偏远,要凸镜帮忙;老花是睫状肌力不从心,近看时凑不够度数——所以老花镜是正镜。',
    de: 'Hyperopia is the mirror case (focus too late, needs a plus lens); presbyopia is the muscle running out of range.',
    act: () => { accommod = 0.2; document.getElementById('acc').value = 20; document.getElementById('accVal').textContent = '20%'; } },
];
const STEPS = () => mode === 'bench' ? STEPS_BENCH : STEPS_EYE;
function stepIndex() {
  if (mode === 'bench') {
    if (u < F) return 1;
    if (Math.abs(u - 2 * F) < 0.2) return 2;
    if (u > 3.8) return 3;
    return 0;
  }
  if (glassesOn > 0.4) return 2;
  if (accommod < 0.4) return 3;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS().forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elU = document.getElementById('u');
const elUVal = document.getElementById('uVal');
const elAcc = document.getElementById('acc');
const elAccVal = document.getElementById('accVal');
const elGlas = document.getElementById('glas');
const elGlasVal = document.getElementById('glasVal');
const btnBench = document.getElementById('mBench');
const btnEye = document.getElementById('mEye');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stU = document.getElementById('stU'), stV = document.getElementById('stV'),
  stM = document.getElementById('stM'), stT = document.getElementById('stT');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setMode(m) {
  mode = m;
  btnBench.classList.toggle('on', m === 'bench');
  btnEye.classList.toggle('on', m === 'eye');
  benchGrp.visible = m === 'bench';
  objGrp.visible = m === 'bench';
  imgGrp.visible = m === 'bench';
  lensGrp.visible = m === 'bench';
  fMarks.forEach(f => f.visible = m === 'bench');
  floorA.visible = m === 'bench';
  eyeGrp.visible = m === 'eye';
  floorB.visible = m === 'eye';
  document.getElementById('rowU').style.display = m === 'bench' ? '' : 'none';
  document.getElementById('rowF').style.display = m === 'eye' ? '' : 'none';
  document.getElementById('rowG').style.display = m === 'eye' ? '' : 'none';
  camera.position.set(...(m === 'bench' ? [2.2, 2.6, 7.6] : [3.2, 2.4, 6.8]));
  controls.target.set(...(m === 'bench' ? [0.6, 1.1, 0] : [1.2, 1.3, 0]));
  buildSteps();
}
btnBench.addEventListener('click', () => setMode('bench'));
btnEye.addEventListener('click', () => setMode('eye'));
elU.addEventListener('input', () => { u = parseInt(elU.value, 10) / 100; elUVal.textContent = u.toFixed(2); });
elAcc.addEventListener('input', () => { accommod = parseInt(elAcc.value, 10) / 100; elAccVal.textContent = elAcc.value + '%'; });
elGlas.addEventListener('input', () => {
  glassesOn = parseInt(elGlas.value, 10) / 100;
  elGlasVal.textContent = glassesOn < 0.05 ? L('无', 'none') : '−' + (glassesOn * 3).toFixed(1) + ' D';
  glasses.visible = glassesOn > 0.03;
});
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', false) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;

  if (mode === 'bench') {
    objGrp.position.set(-u, OPT_Y, 0);
    const real = u > F;
    const vVal = real ? F * u / (u - F) : F * u / (F - u);   // 像距大小
    const m = vVal / u;
    const tipTop = new THREE.Vector3(-u, OPT_Y + 0.7, 0);
    const lensTop = new THREE.Vector3(0, OPT_Y + 0.7, 0);
    /* 像端点:实像在透镜后 v 处(倒立);虚像在物侧 −v 处(正立) */
    const imgEnd = real
      ? new THREE.Vector3(vVal, OPT_Y - 0.7 * m, 0)
      : new THREE.Vector3(-vVal, OPT_Y + 0.7 * m, 0);
    ray1a.setSeg(tipTop, lensTop);
    ray1b.setSeg(lensTop, imgEnd);
    ray2a.setSeg(tipTop, imgEnd);
    rayV1.visible = rayV2.visible = !real;
    if (!real) {
      rayV1.setSeg(lensTop, imgEnd);
      rayV2.setSeg(tipTop, imgEnd);
    }
    /* 像箭头:几何原点在上(杆向下、尖朝下);实像直接缩放,虚像翻转朝上 */
    imgGrp.visible = true;
    if (real) {
      imgGrp.position.set(vVal, OPT_Y, 0);
      imgGrp.scale.y = m;
    } else {
      imgGrp.position.set(-vVal, OPT_Y + 0.7 * m, 0);
      imgGrp.scale.y = -m;
    }
    imgGrp.scale.x = Math.abs(m);
    stU.textContent = u.toFixed(2);
    stV.textContent = real ? vVal.toFixed(2) : '−' + vVal.toFixed(2);
    stM.textContent = ((real ? -1 : 1) * m).toFixed(2);
    stT.textContent = real ? L('实像·倒立', 'real · inverted') : L('虚像·正立', 'virtual · upright');
  } else {
    /* 眼睛:远处平行光 → 晶状体 → 焦点 */
    const f = eyeF();
    const focusX = 0.75 + f;
    eyeLens.scale.set(0.4 - 0.1 * accommod, 1 + 0.12 * accommod, 1 + 0.12 * accommod);
    eyeRays.forEach((r, i) => {
      const dy = (i - 1) * 0.06;
      const yTop = 1.3 + dy;
      if (glassesOn > 0.03) {
        const g1 = new THREE.Vector3(1.6, 1.3 + dy * (1 + glassesOn * 0.5), 0);
        const g2 = new THREE.Vector3(0.75, 1.3 + dy * 0.7, 0);
        r.setSeg(new THREE.Vector3(4.5, 1.3 + dy, 0), g1);
        void g2;
      } else {
        r.setSeg(new THREE.Vector3(4.5, 1.3 + dy, 0), new THREE.Vector3(0.75, 1.3 + dy * 0.8, 0));
      }
      /* 第二段:晶状体 → 焦点 */
      const seg2m = r;
      void seg2m;
    });
    /* 简化:三束平行光都画到焦点 */
    eyeRays.forEach((r, i) => {
      const dy = (i - 1) * 0.09;
      const startX = glassesOn > 0.03 ? 1.6 : 0.75;
      const startY = 1.3 + dy * (glassesOn > 0.03 ? 0.75 : 0.8);
      r.setSeg(new THREE.Vector3(startX, startY, 0), new THREE.Vector3(focusX, 1.3, 0));
    });
    /* 落点指示 */
    stU.textContent = L('远处', 'distant');
    stV.textContent = focusX.toFixed(2);
    stM.innerHTML = (focusX >= 0.995 ? '✓' : '✗') + '<small> ' + (focusX >= 0.995 ? L('落视网膜', 'on retina') : L('未达视网膜', 'short of retina')) + '</small>';
    stT.textContent = glassesOn > 0.03 ? L('已矫正', 'corrected') : (accommod > 0.6 ? L('近视裸眼', 'myopic') : L('看近', 'near'));
  }

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setMode(mode);
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
