<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发酵 · 没有氧也要活下去</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffd166;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b0761f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,209,102,.9); color: #ffe9a8; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.e { border-color: rgba(99,230,190,.9); color: #c3f5e5; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffd166; }
  #stats .v.r { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.p { color: #ffccd5; border-color: rgba(255,143,163,.7); }
  .chip.l { color: #d0bfff; border-color: rgba(177,151,252,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,209,102,.12); color: var(--text); border: 1px solid rgba(255,209,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .abtn.on { background: rgba(116,192,252,.22); }
  #modeRow { display: flex; gap: 8px; margin-bottom: 8px; }
  .mbtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 8px; font-size: 12.5px; font-weight: 600; }
  .mbtn.on { background: rgba(255,209,102,.18); border-color: rgba(255,209,102,.6); color: var(--text); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,209,102,.10); border-color: rgba(255,209,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(176,118,31,.08); border-color: rgba(176,118,31,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffe9a8; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="发酵:没有氧,也要把 NAD⁺ 买回来" data-en="Fermentation: no oxygen? Buy NAD⁺ back anyway">发酵:没有氧,也要把 NAD⁺ 买回来</h1>
  <div class="sub" data-zh="糖酵解不停产的前提是 NAD⁺ 回收:有氧交给线粒体;没氧就 让丙酮酸变成乳酸/乙醇——面包、酸奶、肌肉酸痛同一条岔路 · 空格播放/暂停" data-en="Glycolysis only keeps running if NAD⁺ is recycled: with oxygen the mitochondrion does it; without, pyruvate becomes lactate/ethanol — bread, yogurt and sore muscles share one fork · Space = play/pause">糖酵解不停产的前提是 NAD⁺ 回收:有氧交给线粒体;没氧就 让丙酮酸变成乳酸/乙醇——面包、酸奶、肌肉酸痛同一条岔路 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="NAD⁺ 库存" data-en="NAD⁺ pool">NAD⁺ 库存</span><span class="v g" id="stNAD">—</span>
  <span class="k" data-zh="NADH 堆积" data-en="NADH pile">NADH 堆积</span><span class="v" id="stNADH">—</span>
  <span class="k" data-zh="ATP 速率" data-en="ATP rate">ATP 速率</span><span class="v" id="stATP">—</span>
  <span class="k" data-zh="当前途径" data-en="route">当前途径</span><span class="v" id="stRoute" style="font-size:14px">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.p" data-zh="丙酮酸(3C 粉)" data-en="pyruvate (3C pink)">丙酮酸(3C 粉)</span>
    <span class="chip.l" data-zh="NAD⁺ / NADH(紫)" data-en="NAD⁺ / NADH (violet)">NAD⁺ / NADH(紫)</span>
  </div>
  <div id="modeRow">
    <button class="mbtn on" id="mMuscle" data-zh="肌肉(→乳酸)" data-en="muscle (→lactate)">肌肉(→乳酸)</button>
    <button class="mbtn" id="mYeast" data-zh="酵母(→乙醇+CO₂)" data-en="yeast (→ethanol+CO₂)">酵母(→乙醇+CO₂)</button>
  </div>
  <div id="actions">
    <button class="abtn" id="btnO2" data-zh="通氧开关:当前无氧" data-en="oxygen switch: currently OFF">通氧开关:当前无氧</button>
  </div>
  <div class="row"><label data-zh="动画速度" data-en="animation">动画速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../glycolysis/" data-zh="上游:糖酵解" data-en="upstream: glycolysis">上游:糖酵解</a>
    <a href="../mitochondria/" data-zh="有氧主线:线粒体" data-en="the aerobic mainline: mitochondria">有氧主线:线粒体</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('发酵与无氧呼吸', 'Fermentation');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.5, 2.2, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.25,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const M = {
  glc: mat(0xffd166),
  pyr: mat(0xff8fa3),
  lac: mat(0xffa94d),
  etoh: mat(0xb197fc),
  NAD: mat(0xd0bfff, { emissiveIntensity: 0.35 }),
  NADH: mat(0x9775fa, { emissiveIntensity: 0.5 }),
  mito: mat(0x63e6be, { opacity: 0.42 }),
  o2: new THREE.MeshBasicMaterial({ color: 0x74c0fc, blending: THREE.AdditiveBlending, transparent: true }),
};
const base = new THREE.Mesh(new THREE.CylinderGeometry(3.1, 3.3, 0.14, 48),
  mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1 }));
base.position.y = -0.35;
scene.add(base);

/* 场景布局:左侧糖酵解区 → 中间岔路口 → 右上线粒体(有氧)/ 右下发酵器 */
const forkPos = new THREE.Vector3(0, 1.0, 0);
const mitoPos = new THREE.Vector3(2.6, 1.7, -0.6);
const fermPos = new THREE.Vector3(2.6, 0.35, 0.9);
/* 线粒体(半透明胶囊) */
const mito = new THREE.Mesh(new THREE.CapsuleGeometry(0.55, 1.1, 8, 20), M.mito);
mito.position.copy(mitoPos);
mito.rotation.z = -0.5;
scene.add(mito);
/* 岔路指示牌 */
function mkPipe(from, to) {
  const pts = [from, new THREE.Vector3((from.x + to.x) / 2, (from.y + to.y) / 2 + 0.25, 0), to];
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.045, 8, false),
    new THREE.MeshBasicMaterial({ color: 0x3a5a8a, transparent: true, opacity: 0.35 }));
  scene.add(tube);
  return tube;
}
const pipeA = mkPipe(forkPos, mitoPos);
const pipeB = mkPipe(forkPos, fermPos);

/* ================= 状态(标签之前) ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = 1;
let o2 = qsBool('o2', false);
let mode = 'muscle';           // muscle | yeast
let tSim = 0;
/* NAD 池:糖酵解产 NADH;有氧/发酵回收 NAD+ */
let pool = { NAD: 8, NADH: 0 };
let atpCount = 0;
let products = { lact: 0, etoh: 0, co2: 0 };

/* 分子池 */
const mols = [];   // {mesh, kind, state, t, path}
function mkMol(kind, pos) {
  const mm = { glc: M.glc, pyr: M.pyr, lac: M.lac, etoh: M.etoh, NAD: M.NAD, NADH: M.NADH, o2: null }[kind];
  const mesh = kind === 'o2'
    ? new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), M.o2)
    : new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 10), mm);
  mesh.position.copy(pos);
  mesh.visible = false;
  scene.add(mesh);
  const m = { mesh, kind, state: 'idle', t: 0 };
  mols.push(m);
  return m;
}
/* 池预建 */
for (let i = 0; i < 8; i++) mkMol('glc', new THREE.Vector3());
for (let i = 0; i < 16; i++) mkMol('pyr', new THREE.Vector3());
for (let i = 0; i < 10; i++) mkMol('lac', new THREE.Vector3());
for (let i = 0; i < 10; i++) mkMol('etoh', new THREE.Vector3());
for (let i = 0; i < 12; i++) mkMol('NAD', new THREE.Vector3());
for (let i = 0; i < 12; i++) mkMol('NADH', new THREE.Vector3());
for (let i = 0; i < 14; i++) mkMol('o2', new THREE.Vector3());

function grab(kind) {
  const m = mols.find(q => q.kind === kind && q.state === 'idle');
  if (m) m.state = 'busy';
  return m;
}
function release(m) { if (m) m.state = 'idle', m.mesh.visible = false; }

/* 补给点 */
const glcSrc = new THREE.Vector3(-3.0, 1.3, 0);
const o2Src = new THREE.Vector3(0.4, 2.8, -1.6);

/* 反应节拍 */
let beat = 0;
function reactionStep() {
  /* 糖酵解:消耗 NAD+ 产 NADH + 丙酮酸;NAD+ 不足时停产 */
  if (pool.NAD <= 0) return;
  pool.NAD--;
  pool.NADH++;
  atpCount += 2;
  /* 丙酮酸去向 */
  if (o2) {
    /* 有氧:线粒体回收全部 NADH */
  } else {
    if (mode === 'muscle') products.lact++;
    else { products.etoh++; products.co2++; }
  }
}
/* 独立回收节拍:线粒体/发酵把 NADH 氧化回 NAD⁺ */
let recycleCD = 0;
function recycleTick(dts) {
  recycleCD -= dts;
  if (recycleCD <= 0) {
    recycleCD = 0.7;
    if (pool.NADH > 0 && pool.NAD < 8) { pool.NADH--; pool.NAD++; }
  }
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblFork = addLabel(() => o2
  ? L('岔路口:有氧!丙酮酸进线粒体彻底氧化(36 ATP/糖),NADH 也被电子链接管', 
      'the fork: oxygen is ON! Pyruvate enters the mitochondrion for full oxidation (~36 ATP/sugar), NADH handled by the ETC')
  : L('岔路口:无氧!丙酮酸就地被发酵兜底——为了把 NADH 变回 NAD⁺,糖酵解才不停摆', 
      'the fork: oxygen OFF! Pyruvate is bailed out by fermentation — all to turn NADH back into NAD⁺ so glycolysis never stalls'),
  forkPos.clone().add(new THREE.Vector3(-0.4, 0.95, 0)), 'st');
const lblMito = addLabel(() => o2
  ? L('线粒体:接收丙酮酸 + NADH,产能全开', 'mitochondrion: taking pyruvate + NADH, full power')
  : L('线粒体:闲置(没有氧,电子链堵车)', 'mitochondrion: idle (no oxygen — the chain is jammed)'),
  mitoPos.clone().add(new THREE.Vector3(0, 1.0, 0)), o2 ? 'e' : 'st');
const lblFerm = addLabel(() => o2 ? L('发酵器:待命', 'fermenter: standby')
  : mode === 'muscle'
    ? L('乳酸发酵:丙酮酸 ←NADH→ 乳酸;酸奶、泡菜、剧烈运动后的酸痛', 
        'lactate fermentation: pyruvate ←NADH→ lactate; yogurt, pickles, post-workout soreness')
    : L('酒精发酵:丙酮酸 → 乙醛 + CO₂ → 乙醇;面包的孔、啤酒的泡', 
        'alcohol fermentation: pyruvate → acetaldehyde + CO₂ → ethanol; bread holes and beer foam'),
  fermPos.clone().add(new THREE.Vector3(0, 0.85, 0)), 'o');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '糖酵解的隐藏账单', be: 'Glycolysis\'s hidden bill',
    d: '每颗葡萄糖的糖酵解都会产生 2 个 NADH。NAD⁺ 是糖酵解的原料——不回收,糖酵解几秒内断粮。',
    de: 'Each glucose through glycolysis makes 2 NADH. NAD⁺ is a consumable — recycle it or glycolysis starves within seconds.',
    act: () => setO2(false) },
  { b: '有氧:线粒体代购', be: 'With oxygen: the mitochondrion recycles',
    d: '氧气让电子传递链跑起来,NADH 在线粒体内被氧化回 NAD⁺,能量被榨到 ~36 ATP/糖——这是默认高通路线。',
    de: 'Oxygen lets the ETC oxidize NADH back to NAD⁺, squeezing ~36 ATP per glucose — the default high-throughput route.',
    act: () => setO2(true) },
  { b: '拔掉氧:通路堵车', be: 'Cut the oxygen: the line jams',
    d: '没有氧,电子链停摆,NADH 堆积、NAD⁺ 枯竭——糖酵解即将停产。按「通氧开关」看 NAD⁺ 库存崩塌。',
    de: 'No oxygen means a stalled ETC: NADH piles up, NAD⁺ runs dry, glycolysis grinds to a halt. Watch the NAD⁺ pool collapse.',
    act: () => setO2(false) },
  { b: '发酵:用丙酮酸换 NAD⁺', be: 'Fermentation: pyruvate pays for NAD⁺',
    d: '丙酮酸牺牲自己接住 NADH 的电子变回 NAD⁺:肌肉里变乳酸,酵母里变乙醇+CO₂。丙酮酸被「浪费」了,但糖酵解 2 ATP 保住了。',
    de: 'Pyruvate sacrifices itself, taking NADH\'s electrons to regenerate NAD⁺: to lactate in muscle, to ethanol + CO₂ in yeast. Pyruvate is "wasted" but the 2 ATP survive.',
    act: () => { setO2(false); setMode('muscle'); } },
  { b: '一张清单,三个产业', be: 'One pathway, three industries',
    d: '面包的蓬松孔洞(酵母 CO₂)、酸奶的酸(乳酸菌)、剧烈运动后的肌肉灼烧(你的乳酸)——同一条无氧岔路。',
    de: 'Bread\'s airy holes (yeast CO₂), yogurt\'s tang (lactate), the burn after sprints (your lactate) — one anaerobic fork.',
    act: () => { setO2(false); setMode('yeast'); } },
];
function stepIndex() {
  if (o2) return 1;
  if (mode === 'yeast') return 4;
  if (pool.NAD <= 1) return 2;
  return 3;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const btnO2 = document.getElementById('btnO2');
const mMuscle = document.getElementById('mMuscle');
const mYeast = document.getElementById('mYeast');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function setO2(v) {
  o2 = v;
  pool.NAD = 3;   /* 切换途径:回收线重建,NAD⁺ 库存先跌再爬回 */
  btnO2.classList.toggle('on', o2);
  btnO2.textContent = o2 ? L('通氧开关:当前有氧 ✓', 'oxygen switch: currently ON ✓') : L('通氧开关:当前无氧', 'oxygen switch: currently OFF');
}
function setMode(m) {
  mode = m;
  mMuscle.classList.toggle('on', m === 'muscle');
  mYeast.classList.toggle('on', m === 'yeast');
}
btnO2.addEventListener('click', () => setO2(!o2));
mMuscle.addEventListener('click', () => setMode('muscle'));
mYeast.addEventListener('click', () => setMode('yeast'));
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elSpdVal.textContent = speed.toFixed(1) + '×';
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 分子行为 ================= */
function spawnGlycolysis() {
  const g = grab('glc');
  if (!g || pool.NAD <= 0) return;
  g.mesh.visible = true;
  g.mesh.position.copy(glcSrc);
  g.state = 'toFork';
  const n1 = grab('NAD');
  if (n1) {
    n1.mesh.visible = true;
    n1.mesh.position.copy(glcSrc).add(new THREE.Vector3(0, 0.4, 0));
    n1.state = 'toFork';
  }
}
function updateMols(dt) {
  for (const m of mols) {
    if (m.state === 'idle' || m.state === 'done') continue;
    const p = m.mesh.position;
    if (m.state === 'toFork') {
      p.lerp(forkPos, clamp(dt * 1.6, 0, 1));
      if (p.distanceTo(forkPos) < 0.12) {
        if (m.kind === 'glc') {
          /* 抵达岔路:变丙酮酸 */
          m.kind = 'pyr';
          m.mesh.material = M.pyr;
          const n = mols.find(q => q.kind === 'pyr' && q.state === 'idle');
          void n;
          m.state = 'decide';
        } else if (m.kind === 'NAD') {
          m.kind = 'NADH';
          m.mesh.material = M.NADH;
          m.state = 'decide';
        }
      }
    } else if (m.state === 'decide') {
      if (m.kind === 'pyr') {
        const dst = o2 ? mitoPos : fermPos;
        p.lerp(dst, clamp(dt * 1.5, 0, 1));
        if (p.distanceTo(dst) < 0.15) {
          if (o2) {
            m.state = 'done'; m.mesh.visible = false;
          } else {
            m.kind = mode === 'muscle' ? 'lac' : 'etoh';
            m.mesh.material = mode === 'muscle' ? M.lac : M.etoh;
            m.state = 'leave';
          }
        }
      } else if (m.kind === 'NADH') {
        const dst = o2 ? mitoPos.clone().add(new THREE.Vector3(-0.3, 0.3, 0)) : fermPos.clone().add(new THREE.Vector3(0, 0.3, 0));
        p.lerp(dst, clamp(dt * 1.5, 0, 1));
        if (p.distanceTo(dst) < 0.15) {
          /* NADH 被氧化回 NAD+ */
          m.kind = 'NAD';
          m.mesh.material = M.NAD;
          m.state = 'back';
        }
      }
    } else if (m.state === 'leave') {
      p.y -= dt * 0.7;
      p.x += dt * 0.3;
      if (p.y < -0.3) { release(m); }
    } else if (m.state === 'back') {
      p.lerp(glcSrc, clamp(dt * 1.2, 0, 1));
      if (p.distanceTo(glcSrc) < 0.2) release(m);
    }
  }
  /* O₂ 小气泡:有氧时飘向线粒体 */
  if (o2 && Math.random() < dt * 3) {
    const b = grab('o2');
    if (b) {
      b.mesh.visible = true;
      b.mesh.position.copy(o2Src).add(new THREE.Vector3((Math.random() - 0.5), (Math.random() - 0.5) * 0.4, (Math.random() - 0.5)));
      b.state = 'toMito';
    }
  }
  for (const m of mols) {
    if (m.kind === 'o2' && m.state === 'toMito') {
      m.mesh.position.lerp(mitoPos, clamp(dt * 1.4, 0, 1));
      if (m.mesh.position.distanceTo(mitoPos) < 0.2) { release(m); }
    }
  }
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let spawnCD = 0;
let stepCD = 0;
let atpWindow = [];
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;

  spawnCD -= dts;
  if (spawnCD <= 0) { spawnCD = 1.4; spawnGlycolysis(); }
  recycleTick(dts);
  stepCD -= dts;
  if (stepCD <= 0) {
    stepCD = 1.4;
    const before = atpCount;
    reactionStep();
    if (atpCount > before) atpWindow.push(tSim);
  }
  updateMols(dts);
  atpWindow = atpWindow.filter(t => tSim - t < 4);

  /* NAD 池模拟:无氧且发酵正常时维持;演示堆积 */
  pool.NAD = clamp(pool.NAD, 0, 8);
  pool.NADH = 8 - pool.NAD;
  document.getElementById('stNAD').innerHTML = pool.NAD + '<small>/8</small>';
  document.getElementById('stNAD').className = 'v ' + (pool.NAD > 2 ? 'g' : 'r');
  document.getElementById('stNADH').textContent = pool.NADH;
  document.getElementById('stATP').innerHTML = (atpWindow.length / 4).toFixed(1) + '<small>/s</small>';
  document.getElementById('stRoute').textContent = o2
    ? L('有氧 → 线粒体', 'aerobic → mitochondrion')
    : mode === 'muscle' ? L('无氧 → 乳酸', 'anaerobic → lactate') : L('无氧 → 乙醇', 'anaerobic → ethanol');

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setO2(o2);
setMode(mode);
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
