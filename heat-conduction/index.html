<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================= 物理内核（傅里叶定律 + 串联热阻） =================
   傅里叶定律 q=−k·dT/dx；单层墙 q=k·ΔT/Lw（Lw=0.2m）。真实导热率：
   铜 400 W/(m·K)、玻璃 ~1、泡沫 ~0.035、静止空气 0.026。
   复合墙（铜3cm | 砖8cm k=0.7 | 泡沫6cm）串联：R_i=L_i/k_i 相加，
   q=ΔT/ΣR，各界面温度 T_j=T_h−q·ΣR(前 j 层)——温差按热阻分配，
   泡沫层承担绝大部分压降（曲线在该层最陡）。
   金属额外通道：自由电子气输运（维德曼-弗兰兹：导热≈导电），铜中约九成
   热流由电子携带——所以金属摸着凉。声子散射率按材料自由程设定（可视化）。 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const XW=7, HWALL=1.5, LW=0.2;      // 半宽、半高、单层墙厚 m
let mode=0, matKey='cu', dT=80, speedK=1.0;
let playing=true, labelsOn=true;
const Tc=()=>293, Th=()=>293+dT;
const KCU=400,KGL=1.0,KFOAM=0.035,KBRICK=0.7;
const MATS={cu:{k:KCU,zh:'铜',en:'Copper',metal:true,scat:0.8,color:0xb87333},
            glass:{k:KGL,zh:'玻璃',en:'Glass',scat:3.2,color:0x7fb8c9},
            foam:{k:KFOAM,zh:'泡沫',en:'Foam',scat:5.5,color:0xd8d3c8}};
/* 复合墙三层的世界坐标边界（厚度比 3:8:6cm） */
const COMP=[{k:KCU,zh:'铜',en:'Cu'},{k:KBRICK,zh:'砖',en:'Brick'},{k:KFOAM,zh:'泡沫',en:'Foam'}];
const compFrac=[0.03,0.08,0.06].reduce((a,l)=>{a.cum.push((a.s+=l)/0.17);return a;},{cum:[],s:0}).cum;
function qNow(){ // 热流密度 W/m²
  if(mode===0)return MATS[matKey].k*dT/LW;
  const R=COMP.reduce((s,l,i)=>s+[0.03,0.08,0.06][i]/l.k,0);
  return dT/R;
}
function Tof(x){ // 稳态温度剖面
  const Th0=Th(),Tc0=Tc(),f=(x+XW)/(2*XW);
  if(mode===0)return Th0-(Th0-Tc0)*f;
  const Q=qNow();let R=0,prev=0;
  for(let i=0;i<3;i++){
    R+=[0.03,0.08,0.06][i]/COMP[i].k;
    if(f<=compFrac[i]||i===2)return Th0-(Th0-Tc0)*(prev+(f-(i?compFrac[i-1]:0))/(compFrac[i]-(i?compFrac[i-1]:0))*(R-prev));
    prev=R;
  }
  return Tc0;
}

const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,28,64);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0,3.2,15.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.4,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=5; controls.maxDistance=45;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.65));
const key=new THREE.DirectionalLight(0xfff2dd,0.9); key.position.set(5,9,8); scene.add(key);

/* 墙体：14 段，颜色随 T(x) */
const NS=14, segs=[], segGeo=new THREE.BoxGeometry(1,3,1.6);
for(let i=0;i<NS;i++){
  const m=new THREE.Mesh(segGeo.clone(),new THREE.MeshStandardMaterial({color:0x888888,roughness:0.7}));
  scene.add(m); segs.push(m);
}
function layoutSegs(){
  let b=[-XW,XW];
  if(mode===1)b=[-XW,-XW+2*XW*compFrac[0],-XW+2*XW*compFrac[1],XW];
  let s=0;
  for(let layer=0;layer<b.length-1;layer++){
    const n=mode===1?[2,6,6][layer]:NS;
    for(let i=0;i<n&&s<NS;i++,s++){
      const x0=b[layer]+(b[layer+1]-b[layer])*i/n, x1=b[layer]+(b[layer+1]-b[layer])*(i+1)/n;
      segs[s].scale.x=x1-x0;segs[s].position.x=(x0+x1)/2;
      segs[s].userData.cx=(x0+x1)/2;
    }
  }
}
function colorSegs(){
  segs.forEach(sg=>{
    const T=Tof(sg.userData.cx), tn=clamp((T-Tc())/Math.max(1,dT),0,1);
    const c=new THREE.Color().setHSL(0.66-0.62*tn,0.72,0.42+0.12*tn);
    sg.material.color.copy(c);sg.material.emissive.copy(c).multiplyScalar(0.25*tn);
  });
}
/* 晶格原子：每段 3 颗，振幅∝T */
const NAT=NS*3;
const latMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.09,8,6),
  new THREE.MeshStandardMaterial({color:0xffc078,roughness:0.4,emissive:0x663300,emissiveIntensity:0.3}),NAT);
scene.add(latMesh);
const latPhase=new Float32Array(NAT);
for(let i=0;i<NAT;i++)latPhase[i]=Math.random()*7;
const dummy=new THREE.Object3D();
const tglPh={on:true},tglEl={on:true};
/* 声子波包 */
const NPH=170, phPos=new Float32Array(NPH*3), ph=[], phGeo=new THREE.BufferGeometry();
phGeo.setAttribute('position',new THREE.BufferAttribute(phPos,3));
const phonons=new THREE.Points(phGeo,new THREE.PointsMaterial({color:0xffe08a,size:0.16,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(phonons);
for(let i=0;i<NPH;i++)ph.push({on:false,x:0,y:0,vx:0,vy:0});
let phAcc=0;
function spawnPh(){
  const p=ph.find(p=>!p.on);if(!p)return;
  p.on=true;p.x=-XW+0.15;p.y=(Math.random()*2-1)*(HWALL-0.2);
  const a=(Math.random()-0.5)*0.9;
  p.vx=3.2*Math.cos(a);p.vy=3.2*Math.sin(a);
}
/* 电子气（金属） */
const NEL=80, elPos=new Float32Array(NEL*3), el=[], elGeo=new THREE.BufferGeometry();
elGeo.setAttribute('position',new THREE.BufferAttribute(elPos,3));
const electrons=new THREE.Points(elGeo,new THREE.PointsMaterial({color:0x74c0fc,size:0.12,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(electrons);
for(let i=0;i<NEL;i++)el.push({x:-XW+Math.random()*2,y:(Math.random()*2-1)*(HWALL-0.2),
  vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8});
/* 热端/冷端辉光 */
const glowHot=new THREE.Mesh(new THREE.PlaneGeometry(0.5,3.4),
  new THREE.MeshBasicMaterial({color:0xff5a3c,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));
glowHot.position.set(-XW-0.3,0,0.4); scene.add(glowHot);
const glowCold=new THREE.Mesh(new THREE.PlaneGeometry(0.5,3.4),
  new THREE.MeshBasicMaterial({color:0x4dabf7,transparent:true,opacity:0.35,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));
glowCold.position.set(XW+0.3,0,0.4); scene.add(glowCold);

/* ---- CSS2D 标签 ---- */
const labelReg=[];
function addLabel(fn,pos,cls,vis=()=>true,parent){
  const div=document.createElement('div');div.className='lbl '+(cls||'');
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||scene).add(o);
  labelReg.push({o,fn,vis});div.textContent=fn();return o;
}
addLabel(()=>L('热端 '+(Th()-273).toFixed(0)+'°C','Hot '+(Th()-273).toFixed(0)+'°C'),new THREE.Vector3(-XW-0.3,2.1,0),'r');
addLabel(()=>L('冷端 '+(Tc()-273).toFixed(0)+'K','Cold '+Tc().toFixed(0)+'K'),new THREE.Vector3(XW+0.3,2.1,0),'b');
addLabel(()=>L('声子=晶格振动的能量量子，接力+散射','Phonons = quantized lattice vibrations, relay + scatter'),new THREE.Vector3(0,2.35,0),'o',()=>tglPh.on);
addLabel(()=>L('电子气：金属的快递通道（约九成热流）','Electron gas: metal express lane (~90% of heat)'),new THREE.Vector3(-4.6,-2.05,0),'b',()=>tglEl.on&&mode===0&&matKey==='cu');
addLabel(()=>{const T=Tof(-XW+2*XW*compFrac[0]);return L('界面1 '+T.toFixed(1)+' K','iface1 '+T.toFixed(1)+' K');},new THREE.Vector3(-XW+2*XW*compFrac[0],-2.05,0),'g',()=>mode===1);
addLabel(()=>{const T=Tof(-XW+2*XW*compFrac[1]);return L('界面2 '+T.toFixed(1)+' K','iface2 '+T.toFixed(1)+' K');},new THREE.Vector3(-XW+2*XW*compFrac[1],-2.05,0),'g',()=>mode===1);

/* ---- 主题/语言/步骤 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x101418:0xe9e4dc);
  scene.fog.color.setHex(THEME==='dark'?0x101418:0xe9e4dc);
  refreshPlotColors();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps(); updateStats();
}
const STEPS=[
 {zh:'固体不流动也能传热：晶格振动能量量子化成声子，从热端接力跑向冷端',en:'Heat flows without flow: lattice vibrations quantize into phonons relaying hot→cold'},
 {zh:'声子沿途散射：晶格越无序、自由程越短 → k 越小（玻璃、泡沫）',en:'Phonons scatter: more disorder, shorter free path, smaller k (glass, foam)'},
 {zh:'傅里叶定律 q=−k·dT/dx：温差越大、k 越大，热流越大',en:'Fourier\'s law q=−k·dT/dx: bigger ΔT or k, bigger flux'},
 {zh:'金属的捷径：自由电子气先送热到 → 金属摸着凉（导热≈导电）',en:'Metal shortcut: electron gas delivers first — why metal feels cold (Wiedemann-Franz)'},
 {zh:'串联热阻：复合墙 R=L/kA 相加，温差按热阻分配、界面温度呈阶梯',en:'Series resistances: R=L/kA add up; ΔT is parceled out, interfaces step down'},
 {zh:'隔热之道：泡沫与双层玻璃靠锁住空气(k≈0.026)——声子无路可走',en:'Insulation: foam & double glazing trap air (k≈0.026) — phonons run out of road'},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>gotoStep(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function setMode(m){
  mode=m;
  document.getElementById('btnSingle').classList.toggle('on',m===0);
  document.getElementById('btnComp').classList.toggle('on',m===1);
  ['mCu','mGlass','mFoam'].forEach(id=>document.getElementById(id).style.display=m===0?'':'none');
  layoutSegs();
}
function setMat(k){
  matKey=k;
  ['cu','glass','foam'].forEach(m=>document.getElementById('m'+m[0].toUpperCase()+m.slice(1)).classList.toggle('on',m===k));
}
function gotoStep(i){
  activeStep=i;syncSteps();
  if(i<=2){setMode(0);setMat(['cu','glass','foam'][i]);}
  if(i===3){setMode(0);setMat('cu');tglEl.on=true;document.getElementById('tglEl').checked=true;}
  if(i===4){setMode(1);}
  if(i===5){setMode(0);setMat('foam');dT=60;document.getElementById('sDT').value=60;document.getElementById('sDTVal').textContent='60 K';}
  playing=true;document.getElementById('play').textContent=L('暂停','Pause');
}
function updateStats(){
  const q=qNow(),k=mode===0?MATS[matKey].k:dT/q;
  document.getElementById('stQ').innerHTML=q>=100?q.toFixed(0)+'<small> W/m²</small>':q.toFixed(1)+'<small> W/m²</small>';
  document.getElementById('stK').innerHTML=k>=10?k.toFixed(0)+'<small> W/mK</small>':k.toFixed(2)+'<small> W/mK</small>';
  document.getElementById('stTh').innerHTML=(Th()-273).toFixed(0)+'<small> °C</small>';
  document.getElementById('stTc').innerHTML=(Tc()-273).toFixed(0)+'<small> °C</small>';
}

/* ---- 温度剖面 canvas ---- */
const plot=document.getElementById('plot'),pctx=plot.getContext('2d');
let PC={};
function refreshPlotColors(){
  PC={txt:THEME==='dark'?'#9fb0c3':'#5b6b7d',acc:THEME==='dark'?'#ffa94d':'#e8590c',
      red:THEME==='dark'?'#ff6b6b':'#c92a2a',grid:THEME==='dark'?'rgba(255,255,255,.10)':'rgba(15,25,40,.14)'};
}
function drawPlot(){
  const W=plot.width,H=plot.height,px=46,py=16,pw=W-px-14,ph=H-py-26;
  pctx.clearRect(0,0,W,H);
  pctx.font='11px sans-serif';pctx.fillStyle=PC.txt;
  pctx.fillText(L('稳态温度剖面 T(x)：斜率=dT/dx ∝ 1/k（陡=隔热好）','Steady T(x): slope = dT/dx ∝ 1/k (steep = insulating)'),px,11);
  pctx.strokeStyle=PC.grid;pctx.strokeRect(px,py,pw,ph);
  const X=x=>px+pw*(x+XW)/(2*XW), Y=t=>py+ph*(1-(t-Tc())/Math.max(1,dT));
  /* 剖面线 */
  pctx.strokeStyle=PC.acc;pctx.lineWidth=2;pctx.beginPath();
  for(let i=0;i<=140;i++){
    const x=-XW+2*XW*i/140;
    i?pctx.lineTo(X(x),Y(Tof(x))):pctx.moveTo(X(x),Y(Tof(x)));
  }
  pctx.stroke();pctx.lineWidth=1;
  /* 复合墙界面 */
  if(mode===1){
    for(let i=0;i<2;i++){
      const x=-XW+2*XW*compFrac[i],T=Tof(x);
      pctx.strokeStyle=PC.grid;pctx.setLineDash([3,3]);
      pctx.beginPath();pctx.moveTo(X(x),py);pctx.lineTo(X(x),py+ph);pctx.stroke();pctx.setLineDash([]);
      pctx.fillStyle=PC.txt;pctx.fillText(T.toFixed(1)+'K',X(x)+3,Y(T)-4);
    }
  }
  pctx.fillStyle=PC.txt;
  pctx.fillText('T/K',4,py+8);
  pctx.fillText(L('热端','hot'),px-10,H-6);
  pctx.fillText(L('冷端','cold'),W-40,H-6);
}
/* ---- 交互 ---- */
document.getElementById('btnSingle').addEventListener('click',()=>setMode(0));
document.getElementById('btnComp').addEventListener('click',()=>setMode(1));
document.getElementById('mCu').addEventListener('click',()=>setMat('cu'));
document.getElementById('mGlass').addEventListener('click',()=>setMat('glass'));
document.getElementById('mFoam').addEventListener('click',()=>setMat('foam'));
document.getElementById('sDT').addEventListener('input',e=>{
  dT=+e.target.value;document.getElementById('sDTVal').textContent=dT+' K';});
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';});
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
document.getElementById('tglPh').addEventListener('change',e=>{tglPh.on=e.target.checked;phonons.visible=tglPh.on;});
document.getElementById('tglEl').addEventListener('change',e=>{tglEl.on=e.target.checked;electrons.visible=tglEl.on;});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
const qp=new URLSearchParams(location.search);
if(qp.get('pause')==='1')playing=false;
if(qp.get('labels')==='0'){labelsOn=false;document.getElementById('tglLabels').checked=false;}
if(parseFloat(qp.get('speed'))>0){speedK=clamp(parseFloat(qp.get('speed')),0.2,3);
  document.getElementById('sSpd').value=speedK*100;document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0,simT=0;
function scatterRate(x){
  if(mode===0)return MATS[matKey].scat;
  const f=(x+XW)/(2*XW);
  return f<compFrac[0]?1.2:(f<compFrac[1]?2.8:5.5);
}
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  simT+=dt*speedK;
  colorSegs();
  /* 声子生成与运动（生成率∝q^0.25 视觉压缩，q 本身真实显示） */
  const q=qNow(), spawnRate=3+3.2*Math.pow(Math.max(0,q),0.25);
  if(playing&&tglPh.on){
    phAcc+=spawnRate*dt*speedK;
    while(phAcc>1){phAcc-=1;spawnPh();}
  }
  for(let i=0;i<NPH;i++){
    const p=ph[i];
    if(!p||!p.on){phPos[i*3+1]=99;continue;}
    if(playing){
      p.x+=p.vx*dt*speedK;p.y+=p.vy*dt*speedK;
      if(Math.random()<scatterRate(p.x)*dt*speedK){ // 散射：随机变向
        const a=Math.random()*Math.PI*0.9-0.45+(p.vx>0?0:Math.PI);
        const sp=Math.hypot(p.vx,p.vy);
        p.vx=sp*Math.cos(a);p.vy=sp*Math.sin(a)*0.6;
      }
      if(p.y>HWALL-0.15||p.y<-HWALL+0.15)p.vy*=-1;
      if(p.x>XW-0.1){p.on=false;}
    }
    phPos[i*3]=p.x;phPos[i*3+1]=p.y;phPos[i*3+2]=0.85;
  }
  phGeo.attributes.position.needsUpdate=true;
  /* 电子气：只在金属层内乱窜+漂移，快速送热 */
  const elOn=tglEl.on&&mode===0&&matKey==='cu';
  electrons.visible=elOn;
  if(elOn){
    for(let i=0;i<NEL;i++){
      const e=el[i];
      if(playing){
        e.x+=e.vx*dt*speedK;e.y+=e.vy*dt*speedK;
        e.vx+=(Math.random()-0.5)*4*dt+2.2*dt; // 乱窜+向冷的漂移
        e.vy+=(Math.random()-0.5)*6*dt;
        e.vx=Math.min(e.vx,9);
        if(e.x>XW-0.2){e.x=-XW+0.2;e.y=(Math.random()*2-1)*(HWALL-0.2);e.vx=1+Math.random()*3;}
        if(e.x<-XW+0.15)e.vx=Math.abs(e.vx);
        if(e.y>HWALL-0.1||e.y<-HWALL+0.1)e.vy*=-1;
      }
      elPos[i*3]=e.x;elPos[i*3+1]=e.y;elPos[i*3+2]=0.9;
    }
    elGeo.attributes.position.needsUpdate=true;
  }
  /* 晶格抖动：热端剧烈、冷端轻微 */
  let idx=0;
  segs.forEach(sg=>{
    const T=Tof(sg.userData.cx), tn=clamp((T-Tc())/Math.max(1,dT),0,1);
    const amp=0.02+0.22*tn*tn;
    for(let j=0;j<3;j++,idx++){
      dummy.position.set(sg.userData.cx+Math.sin(simT*13+latPhase[idx])*amp,
        (j-1)*(HWALL*0.55)+Math.cos(simT*17+latPhase[idx]*1.7)*amp, 0.9);
      dummy.rotation.set(0,0,0);dummy.scale.setScalar(1);
      dummy.updateMatrix();
      latMesh.setMatrixAt(idx,dummy.matrix);
    }
  });
  latMesh.instanceMatrix.needsUpdate=true;
  glowHot.material.opacity=0.35+0.2*Math.sin(simT*6);
  acc+=dt;if(acc>0.1){acc=0;updateStats();drawPlot();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.fn();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();layoutSegs();buildSteps();activeStep=0;syncSteps();drawPlot();start();
</script>
