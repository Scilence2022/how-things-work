<style>

  --shadow:0 8px 26px rgba(30,45,70,.15);--tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s;}
#app{position:fixed;inset:0;}#app canvas{display:block;}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;}
.lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);
  font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s;}
:root[data-theme="light"] .lbl{text-shadow:none;}
#tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;}
.tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);color:var(--text3);
  font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;padding:0 12px;
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;text-decoration:none;backdrop-filter:blur(6px);transition:border-color .15s,color .15s,transform .15s;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);}
#title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px);}
#title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6);}

.abtn:hover{border-color:var(--acc);color:var(--text);}

input[type=range]{width:100%;accent-color:var(--acc);height:18px;}

#steps{list-style:none;margin-top:8px;}
#steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;align-items:flex-start;}
#steps li:hover{background:var(--hover);}
#steps li.on{background:rgba(77,171,247,.10);border-color:rgba(77,171,247,.45);}

#steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;

#steps li.on .n{background:var(--acc);color:#fff;}
#steps .t{font-size:12px;color:var(--text3);line-height:1.45;}

#ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;

.rgb-row input{flex:1;accent-color:var(--acc);}
.rgb-row .val{font-size:11.5px;color:var(--text3);flex:0 0 32px;text-align:right;font-variant-numeric:tabular-nums;}
@media(max-width:1150px){#plot{display:none;}#stats{bottom:18px;}}
@media(max-width:900px){#stats{display:none;}}
@media(max-width:760px){
  #panel{width:calc(100vw - 36px);max-height:55vh;}
  #title{max-width:calc(100vw - 200px);}#title h1{font-size:16px;}}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG  = localStorage.getItem('htw-lang')  || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));

/* ---- state ---- */
let rVal=255, gVal=255, bVal=255;
let playing=true, showGamma=false, showOled=false, showPwm=false;
let pwmPhase=0, simT=0;
const COLS=10, ROWS=8;

/* ---- renderer ---- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c0e);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;

/* ---- lighting ---- */
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const dLight = new THREE.DirectionalLight(0xffffff,0.8);
dLight.position.set(5,10,8); scene.add(dLight);

/* ---- pixel grid ---- */
const PIXEL_W=1.1, GAP=0.12;
const STEP = PIXEL_W+GAP;
const offX = -(COLS-1)*STEP/2, offY = -(ROWS-1)*STEP/2;

// Each pixel = 3 sub-pixel boxes side by side
const subW = (PIXEL_W - 0.08*2)/3, subH=PIXEL_W*0.85, subD=0.12;
const subGeo = new THREE.BoxGeometry(subW, subH, subD);

// InstancedMesh for R, G, B sub-pixels
const rMat = new THREE.MeshStandardMaterial({color:0xff2222, emissive:0xff0000, emissiveIntensity:1, roughness:0.3});
const gMat = new THREE.MeshStandardMaterial({color:0x22ff44, emissive:0x00ff22, emissiveIntensity:1, roughness:0.3});
const bMat = new THREE.MeshStandardMaterial({color:0x2255ff, emissive:0x0044ff, emissiveIntensity:1, roughness:0.3});
const COUNT = COLS*ROWS;
const rMesh = new THREE.InstancedMesh(subGeo, rMat, COUNT);
const gMesh = new THREE.InstancedMesh(subGeo, gMat, COUNT);
const bMesh = new THREE.InstancedMesh(subGeo, bMat, COUNT);
rMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
gMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
bMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(rMesh); scene.add(gMesh); scene.add(bMesh);

// Pixel housing (dark background)
const housingGeo = new THREE.BoxGeometry(PIXEL_W, PIXEL_W, 0.08);
const housingMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.9});
const housingMesh = new THREE.InstancedMesh(housingGeo, housingMat, COUNT);
scene.add(housingMesh);

const dummy = new THREE.Object3D();
function rebuildGrid() {
  let idx=0;
  for(let row=0;row<ROWS;row++) for(let col=0;col<COLS;col++) {
    const x = offX + col*STEP, y = offY + row*STEP;
    dummy.position.set(x,y,0); dummy.rotation.set(0,0,0); dummy.scale.set(1,1,1);
    dummy.updateMatrix(); housingMesh.setMatrixAt(idx, dummy.matrix);
    // R sub-pixel
    dummy.position.set(x - subW - 0.04, y, subD); dummy.updateMatrix();
    rMesh.setMatrixAt(idx, dummy.matrix);
    // G sub-pixel
    dummy.position.set(x, y, subD); dummy.updateMatrix();
    gMesh.setMatrixAt(idx, dummy.matrix);
    // B sub-pixel
    dummy.position.set(x + subW + 0.04, y, subD); dummy.updateMatrix();
    bMesh.setMatrixAt(idx, dummy.matrix);
    idx++;
  }
  housingMesh.instanceMatrix.needsUpdate=true;
  rMesh.instanceMatrix.needsUpdate=true;
  gMesh.instanceMatrix.needsUpdate=true;
  bMesh.instanceMatrix.needsUpdate=true;
}
rebuildGrid();

// OLED split: right half shows "backlight bleed" plane
const bleedGeo = new THREE.PlaneGeometry(COLS*STEP/2, ROWS*STEP);
const bleedMat = new THREE.MeshBasicMaterial({color:0x1a1a2e, transparent:true, opacity:0, depthWrite:false});
const bleedPlane = new THREE.Mesh(bleedGeo, bleedMat);
bleedPlane.position.set(COLS*STEP/4, 0, -0.05); scene.add(bleedPlane);

/* ---- gamma panel (2D canvas overlay) ---- */
function drawPlot() {
  const cv = document.getElementById('plotCv');
  const ctx = cv.getContext('2d');
  const W=cv.offsetWidth, H=cv.offsetHeight;
  cv.width=W; cv.height=H;
  const dark = THEME==='dark';
  ctx.fillStyle = dark?'#111418':'#f0f4f8';
  ctx.fillRect(0,0,W,H);
  // axes
  ctx.strokeStyle = dark?'#2c3a44':'#c0ccd8'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(30,8); ctx.lineTo(30,H-22); ctx.lineTo(W-8,H-22); ctx.stroke();
  // linear ramp
  ctx.beginPath(); ctx.strokeStyle='#ffa94d'; ctx.lineWidth=1.5;
  for(let i=0;i<=100;i++){
    const x=30+(W-38)*(i/100), y=(H-22)-(H-30)*(i/100);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
  // gamma 2.2
  ctx.beginPath(); ctx.strokeStyle='#4dabf7'; ctx.lineWidth=1.8;
  for(let i=0;i<=100;i++){
    const lin=i/100;
    const perc = Math.pow(lin,1/2.2);
    const x=30+(W-38)*lin, y=(H-22)-(H-30)*perc;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.font='9px system-ui'; ctx.fillStyle='#ffa94d';
  ctx.fillText(LANG==='en'?'Linear':'线性', W-46, H-26);
  ctx.fillStyle='#4dabf7';
  ctx.fillText(LANG==='en'?'γ2.2':'γ2.2', W-30, H-40);
}

/* ---- color temperature estimate ---- */
function estimateCCT(r,g,b) {
  if(r+g+b===0) return 0;
  if(r===g&&g===b) return 6500;
  const nr=r/(r+g+b), ng=g/(r+g+b), nb=b/(r+g+b);
  const x=0.664*nr+0.025*ng+0.311*nb;
  const y=0.216*nr+0.699*ng+0.085*nb;
  if(y===0) return 0;
  const n=(x-0.3320)/(0.1858-y);
  return Math.round(449*n*n*n+3525*n*n+6823.3*n+5520.33);
}

/* ---- update sub-pixel emissive from RGB + mode ---- */
function applyColor() {
  const pwmOn = showPwm ? (Math.sin(pwmPhase*Math.PI*2)>0?1:0) : 1;
  const ri = (rVal/255)*pwmOn, gi=(gVal/255)*pwmOn, bi=(bVal/255)*pwmOn;
  if(showGamma){
    // show gamma ramp: each column = a different brightness step
    for(let row=0;row<ROWS;row++) for(let col=0;col<COLS;col++){
      const t=col/(COLS-1);
      const linBright = t;
      const gammaBright = Math.pow(t,1/2.2);
      const bright = row < ROWS/2 ? linBright : gammaBright;
      rMat.emissiveIntensity=bright; gMat.emissiveIntensity=bright; bMat.emissiveIntensity=bright;
      // per-instance color for gamma ramp
      const idx=row*COLS+col;
      const col3 = new THREE.Color(bright,bright,bright);
      rMesh.setColorAt(idx, col3); gMesh.setColorAt(idx, col3); bMesh.setColorAt(idx, col3);
    }
    if(rMesh.instanceColor){rMesh.instanceColor.needsUpdate=true; gMesh.instanceColor.needsUpdate=true; bMesh.instanceColor.needsUpdate=true;}
  } else if(showOled){
    // left half: OLED (pure black bg), right half: LCD (backlight bleed gray)
    for(let row=0;row<ROWS;row++) for(let col=0;col<COLS;col++){
      const idx=row*COLS+col;
      const isLeft=col<COLS/2;
      // text pattern: show white text on left, white text on right but with bleed
      const inText=(row===ROWS/2||row===ROWS/2-1)&&col>1&&col<COLS-1;
      const bright = inText?1:0;
      const rC = new THREE.Color(isLeft?bright*ri:(bright*ri+0.04), isLeft?bright*gi:(bright*gi+0.04), isLeft?bright*bi:(bright*bi+0.06));
      rMesh.setColorAt(idx,rC); gMesh.setColorAt(idx,rC); bMesh.setColorAt(idx,rC);
    }
    if(rMesh.instanceColor){rMesh.instanceColor.needsUpdate=true; gMesh.instanceColor.needsUpdate=true; bMesh.instanceColor.needsUpdate=true;}
    bleedMat.opacity=0.18;
  } else {
    bleedMat.opacity=0;
    // uniform color across all pixels
    for(let i=0;i<COUNT;i++){
      const c=new THREE.Color(ri,gi,bi);
      rMesh.setColorAt(i,c); gMesh.setColorAt(i,c); bMesh.setColorAt(i,c);
    }
    if(rMesh.instanceColor){rMesh.instanceColor.needsUpdate=true; gMesh.instanceColor.needsUpdate=true; bMesh.instanceColor.needsUpdate=true;}
  }
  rMat.emissiveIntensity=ri; gMat.emissiveIntensity=gi; bMat.emissiveIntensity=bi;
}

/* ---- stats update ---- */
function updateStats() {
  document.getElementById('stR').textContent=rVal;
  document.getElementById('stG').textContent=gVal;
  document.getElementById('stB').textContent=bVal;
  const perc=Math.round(0.2126*(rVal/255)+0.7152*(gVal/255)+0.0722*(bVal/255)*100);
  document.getElementById('stLum').innerHTML=perc+'<small>%</small>';
  const cct=estimateCCT(rVal,gVal,bVal);
  document.getElementById('stCct').innerHTML=(cct>0?cct:'—')+'<small>K</small>';
}

/* ---- steps ---- */
const STEPS=[
  {zh:'p-n 结发光：电子从 n 区越过禁带跃迁至 p 区，释放的能量变成光子，波长由禁带宽度决定',en:'p-n junction light: electron crosses bandgap to p-side, releasing energy as a photon — wavelength = bandgap energy'},
  {zh:'RGB 三基色：红(AlGaInP)、绿(InGaN)、蓝(InGaN)三颗 LED 芯片各自调光',en:'RGB: three chips — AlGaInP (red), InGaN (green/blue) — each dimmed independently'},
  {zh:'PWM 调光：脉宽调制，频率约 1 kHz，占空比 0–100% 对应亮度 0–255',en:'PWM dimming: 1 kHz pulse, duty cycle 0–100% maps to 8-bit brightness 0–255'},
  {zh:'混色：人眼空间积分红绿蓝子像素→感知混合色；256³=1677 万种颜色',en:'Color mixing: eye spatially integrates R/G/B sub-pixels → perceived blended color; 256³ = 16.7M colors'},
  {zh:'Gamma 校正：人眼感知亮度非线性，Gamma 2.2 曲线使梯度级间距均匀',en:'Gamma correction: perception is logarithmic — gamma 2.2 maps linear light to perceptual equal steps'},
  {zh:'OLED vs LCD：OLED 各像素自发光，关闭时真正黑；LCD 背光透过液晶门控，黑色泛灰',en:'OLED vs LCD: OLED self-emits → true black; LCD gates a white backlight → backlight bleed in dark areas'},
];
function buildSteps(){
  const ol=document.getElementById('steps'); ol.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en.split(':')[0]:s.zh.split('：')[0]}</b><br>${LANG==='en'?s.en:s.zh}</span>`;
    ol.appendChild(li);
  });
}

/* ---- sliders ---- */
const sR=document.getElementById('sR'), sG=document.getElementById('sG'), sB=document.getElementById('sB');
function syncSliders(){
  document.getElementById('sRVal').textContent=rVal;
  document.getElementById('sGVal').textContent=gVal;
  document.getElementById('sBVal').textContent=bVal;
  sR.value=rVal; sG.value=gVal; sB.value=bVal;
}
sR.addEventListener('input',()=>{rVal=+sR.value;showGamma=false;showOled=false;syncSliders();updateStats();});
sG.addEventListener('input',()=>{gVal=+sG.value;showGamma=false;showOled=false;syncSliders();updateStats();});
sB.addEventListener('input',()=>{bVal=+sB.value;showGamma=false;showOled=false;syncSliders();updateStats();});

/* ---- action buttons ---- */
function setPreset(r,g,b){rVal=r;gVal=g;bVal=b;showGamma=false;showOled=false;syncSliders();updateStats();}
document.getElementById('btnWhite').addEventListener('click',()=>setPreset(255,255,255));
document.getElementById('btnRed').addEventListener('click',()=>setPreset(255,0,0));
document.getElementById('btnGreen').addEventListener('click',()=>setPreset(0,255,0));
document.getElementById('btnBlue').addEventListener('click',()=>setPreset(0,0,255));
document.getElementById('btnGamma').addEventListener('click',()=>{showGamma=!showGamma;showOled=false;document.getElementById('btnGamma').classList.toggle('on',showGamma);});
document.getElementById('btnOled').addEventListener('click',()=>{showOled=!showOled;showGamma=false;document.getElementById('btnOled').classList.toggle('on',showOled);});
document.getElementById('btnPwm').addEventListener('click',()=>{showPwm=!showPwm;document.getElementById('btnPwm').classList.toggle('on',showPwm);});

/* ---- play/pause ---- */
const elPlay=document.getElementById('play');
function setPlayLabel(){elPlay.setAttribute('data-zh',playing?'暂停':'播放');elPlay.setAttribute('data-en',playing?'Pause':'Play');elPlay.textContent=L('暂停','Pause')===L('暂停','Pause')&&LANG==='zh'?(playing?'暂停':'播放'):(playing?'Pause':'Play');}
elPlay.addEventListener('click',()=>{playing=!playing;setPlayLabel();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();elPlay.click();}});

/* ---- theme / lang ---- */
function applyTheme(){
  htmlEl.setAttribute('data-theme',THEME);
  renderer.setClearColor(THEME==='dark'?0x0a0c0e:0xd8e0eb);
  drawPlot();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh;});
  document.getElementById('langBtn').textContent=LANG==='en'?'中':'EN';
  document.title=L('LED 显示屏 · 像素点亮的原理','LED Display — How Pixels Light Up');
  buildSteps(); setPlayLabel(); syncSliders(); drawPlot();
}
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});

/* ---- main loop ---- */
const clock=new THREE.Clock(); let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05)*(playing?1:0);
  simT+=dt; pwmPhase=(pwmPhase+(showPwm?0.5:8)*dt)%1;
  applyColor();
  controls.update();
  renderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);drawPlot();});

applyTheme(); applyLang(); syncSliders(); updateStats(); drawPlot(); start();
</script>
</body>
</html>
