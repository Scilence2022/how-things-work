<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铅酸电池 · 放电变稀、充电还原 3D 动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffb454;
    --bg:#10151c; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
    --hot:#ff7a5c; --cold:#74c0fc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#a06a12;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
    --hot:#d64933; --cold:#1b7ca0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1.35; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  .lbl.big { border-radius: 11px; text-align: center; }
  .lbl.big b { font-size: 12.5px; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  .lbl.r { border-color: rgba(255,122,92,.9); color: #ffc4b5; }
  .lbl.g { border-color: rgba(123,216,143,.9); color: #c9f0ca; }
  .lbl.dm { font-size: 10.5px; color: var(--text2); border-color: transparent;
    background: transparent; text-shadow: none; padding: 2px 4px; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  :root[data-theme="light"] .lbl.b { color: #1b6a9e; }
  :root[data-theme="light"] .lbl.r { color: #b23c22; }
  :root[data-theme="light"] .lbl.g { color: #2e7d4f; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v.hot { color: var(--hot); }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.sm { font-size: 12px; max-width: 190px; white-space: normal; line-height: 1.3; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(255,180,84,.6); background: rgba(255,180,84,.12); color: var(--text); }
  :root[data-theme="light"] .abtn.on { border-color: rgba(160,106,18,.55); background: rgba(160,106,18,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #warn { display: none; margin-top: 8px; font-size: 12px; color: #ffd2cc;
    background: rgba(220,60,45,.16); border: 1px solid rgba(255,90,70,.6);
    border-radius: 9px; padding: 6px 10px; line-height: 1.5; text-align: center; }
  :root[data-theme="light"] #warn { color: #a3271c; background: rgba(220,60,45,.10);
    border-color: rgba(210,70,55,.6); }
  #warn.on { display: block; animation: blink 1s infinite; }
  @keyframes blink { 50% { background: rgba(220,60,45,.38); } }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,180,84,.10); border-color: rgba(255,180,84,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(160,106,18,.08); border-color: rgba(160,106,18,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #ffe0ae; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="铅酸电池:放电变稀、充电还原" data-en="Lead-acid battery: acid thins on discharge, returns on charge">铅酸电池:放电变稀、充电还原</h1>
  <div class="sub" data-zh="1859 年的可充电老将:放电时两块极板双双披上 PbSO₄ 白霜、硫酸变稀——比重计浮子下沉就是电量表;充电把一切逆转数千次 · 汽车起动的秘密:薄栅极板超大反应面积,几百安随叫随到 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停" data-en="The 1859 rechargeable veteran: discharging frosts BOTH plates with PbSO₄ while the acid thins — the sinking hydrometer float is the fuel gauge; charging reverses it thousands of times · why it cranks cars: thin porous grids give huge area, hundreds of amps on demand · 3D interactive demo · drag to orbit / scroll to zoom · Space = play/pause">1859 年的可充电老将:放电时两块极板双双披上 PbSO₄ 白霜、硫酸变稀——比重计浮子下沉就是电量表;充电把一切逆转数千次 · 汽车起动的秘密:薄栅极板超大反应面积,几百安随叫随到 · 3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="单格电压" data-en="cell voltage">单格电压</span><span class="v" id="stV">—</span>
  <span class="k" data-zh="电解液比重" data-en="specific gravity">电解液比重</span><span class="v" id="stSG">—</span>
  <span class="k" data-zh="荷电状态" data-en="charge (SOC)">荷电状态</span><span class="v ok" id="stSOC">—</span>
  <span class="k" data-zh="电流" data-en="current">电流</span><span class="v hot" id="stI">—</span>
  <span class="k" data-zh="反应式相位" data-en="reaction phase">反应式相位</span><span class="v sm" id="stPh">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn on" id="btnDis" data-zh="放电 · 带负载" data-en="Discharge · load">放电 · 带负载</button>
    <button class="abtn" id="btnChg" data-zh="充电" data-en="Charge">充电</button>
    <button class="abtn" id="btnReset" data-zh="复位" data-en="reset">复位</button>
  </div>
  <div class="row"><label data-zh="负载" data-en="Load">负载</label><input id="load" type="range" min="5" max="300" step="5" value="60"><span class="val" id="loadVal">60 A</span></div>
  <div class="row"><label data-zh="荷电状态" data-en="State of charge">荷电状态</label><input id="soc" type="range" min="0" max="1" step="0.001" value="1"><span class="val" id="socVal">100 %</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div id="formula"></div>
  <div id="warn" data-zh="过充!多余电流在电解水:负极冒 H₂、正极冒 O₂ —— 电解液失水,要补蒸馏水" data-en="Overcharge! The surplus current electrolyzes water: H₂ at the negative plate, O₂ at the positive — the electrolyte loses water, top up with distilled water">过充!多余电流在电解水:负极冒 H₂、正极冒 O₂ —— 电解液失水,要补蒸馏水</div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../galvanic-cell/" data-zh="原电池:基本款" data-en="galvanic cell: the basic model">原电池:基本款</a>
    <a href="../li-ion-battery/" data-zh="锂离子:摇椅电池" data-en="Li-ion: the rocking chair">锂离子:摇椅电池</a>
    <a href="../water-electrolysis/" data-zh="电解水:过充副反应" data-en="water electrolysis: the overcharge side reaction">电解水:过充副反应</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10151c);
  M.table.color.set(THEME === 'light' ? 0xd6dce6 : 0x252b34);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('铅酸电池 · 放电变稀、充电还原', 'Lead-Acid Battery · Acid Thins, Then Returns');
  for (const r of labelReg) r.o.element.innerHTML = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.0, 3.7, 10.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.3, 1.95, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 ---------------- */
function gridTex(base, line) {          // 栅极板网格纹理
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 64, 64);
  x.strokeStyle = line; x.lineWidth = 6;
  for (let i = 8; i < 64; i += 16) {
    x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 64); x.stroke();
    x.beginPath(); x.moveTo(0, i); x.lineTo(64, i); x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3);
  return t;
}
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.35,
    emissive: color, emissiveIntensity: 0.06, ...opts });
}
const M = {
  table: mat(0x252b34, { roughness: 0.85, emissive: 0x000000 }),
  caseM: mat(0x2a313c, { roughness: 0.7 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xaebfd0, transparent: true, opacity: 0.14,
    roughness: 0.12, metalness: 0, depthWrite: false, side: THREE.DoubleSide }),
  elyte: new THREE.MeshStandardMaterial({ color: 0xc9b87a, transparent: true, opacity: 0.18,
    roughness: 0.3, depthWrite: false }),
  pb: new THREE.MeshStandardMaterial({ map: gridTex('#9aa4b0', '#5c6570'),
    metalness: 0.75, roughness: 0.4, emissive: 0x9aa4b0, emissiveIntensity: 0.04 }),
  pbo2: new THREE.MeshStandardMaterial({ map: gridTex('#5a4038', '#3a2823'),
    roughness: 0.6, metalness: 0.25, emissive: 0x5a4038, emissiveIntensity: 0.04 }),
  xtal: mat(0xe8ecf2, { roughness: 0.35, metalness: 0.05, transparent: true, opacity: 0.92 }),
  wire: mat(0x4a5160, { metalness: 0.7, roughness: 0.4 }),
  bulbBase: mat(0x8a929c, { metalness: 0.6, roughness: 0.4 }),
  filament: mat(0xffc36b, { emissive: 0xffc36b, emissiveIntensity: 0.05 }),
  chgBox: mat(0x31513f, { roughness: 0.55 }),
  chgInd: mat(0x10261a, { emissive: 0x51e07e, emissiveIntensity: 0.08 }),
  ionH: new THREE.MeshBasicMaterial({ color: 0xffb454, transparent: true, opacity: 0.8, depthWrite: false }),
  ionS: new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.8, depthWrite: false }),
  bubble: new THREE.MeshBasicMaterial({ color: 0xd8e8f0, transparent: true, opacity: 0.5, depthWrite: false }),
  floatM: mat(0xd5a34c, { metalness: 0.4, roughness: 0.4 }),
};

/* ================= 单格剖视:左 = Pb 负极板,右 = PbO₂ 正极板 ================= */
const table = new THREE.Mesh(new THREE.BoxGeometry(10, 0.18, 3.6), M.table);
table.position.y = -0.09;
scene.add(table);
{
  const bottom = new THREE.Mesh(new THREE.BoxGeometry(6.1, 0.14, 2.15), M.caseM);
  bottom.position.set(0, 0.07, 0);
  scene.add(bottom);
  const wallLR = new THREE.BoxGeometry(0.08, 2.0, 2.1);
  for (const x of [-2.95, 2.95]) {
    const w = new THREE.Mesh(wallLR, M.glass);
    w.position.set(x, 1.14, 0); w.renderOrder = 4; scene.add(w);
  }
  const wallBF = new THREE.BoxGeometry(6.0, 2.0, 0.08);
  for (const z of [-1.05, 1.05]) {
    const w = new THREE.Mesh(wallBF, M.glass);
    w.position.set(0, 1.14, z); w.renderOrder = 4; scene.add(w);
  }
}
const elyte = new THREE.Mesh(new THREE.BoxGeometry(5.7, 1.75, 1.85), M.elyte);

function physStep(h) {
  current = 0;
  if (MODE === 'dis') {
    if (soc > 0) { current = load; soc = Math.max(0, soc - load / AMP_S * h); }
    gassing = Math.max(0, gassing - h);
  } else {
    current = I_CHG;
    if (soc < 1) {
      soc = Math.min(1, soc + I_CHG / AMP_S * h);
      gassing = Math.max(0, gassing - h * 0.5);
    } else {
      gassing = Math.min(1, gassing + h * 0.4);      // 满充继续充:电解水
    }
  }
}
function fastForward(sec) {
  const lim = tSim + clamp(sec, 0, 600);
  let guard = 0;
  while (tSim < lim && guard++ < 4000) { physStep(0.2); tSim += 0.2; }
}
function resetState() {
  soc = 1; gassing = 0; tSim = 0;
  setMode('dis');
}

elSoc.addEventListener('input', () => { soc = +elSoc.value; elSocVal.textContent = Math.round(soc * 100) + ' %'; });
document.getElementById('btnDis').addEventListener('click', () => setMode('dis'));
document.getElementById('btnChg').addEventListener('click', () => setMode('chg'));
document.getElementById('btnReset').addEventListener('click', resetState);
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => { labelsOn = tglLabels.checked; refreshLabels(); });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; labelsOn = false; refreshLabels(); }
controls.autoRotate = qsBool('spin', true);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 图形更新 ---------------- */
const dummy = new THREE.Object3D();
function updateIons(dt) {
  const [x0, x1] = ionBounds[0], [y0, y1] = ionBounds[1], [z0, z1] = ionBounds[2];
  const drift = MODE === 'dis' ? 1 : -1;
  for (let i = 0; i < H_N; i++) {
    const o = hp[i];
    o.v.x += drift * 0.28 * dt;
    o.v.x += (Math.random() - .5) * 0.6 * dt;
    o.v.y += (Math.random() - .5) * 0.6 * dt;
    o.v.z += (Math.random() - .5) * 0.6 * dt;
    o.v.clampLength(0.04, 0.45);
    o.p.addScaledVector(o.v, dt);
    if (o.p.x < x0 || o.p.x > x1) { o.p.x = clamp(o.p.x, x0, x1); o.v.x *= -1; }
    if (o.p.y < y0 || o.p.y > y1) { o.p.y = clamp(o.p.y, y0, y1); o.v.y *= -1; }
    if (o.p.z < z0 || o.p.z > z1) { o.p.z = clamp(o.p.z, z0, z1); o.v.z *= -1; }
    dummy.position.copy(o.p);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.setScalar(0.9 + 0.2 * Math.sin(simTime * 5 + o.ph));
    dummy.updateMatrix();
    ionsH.setMatrixAt(i, dummy.matrix);
  }
  ionsH.instanceMatrix.needsUpdate = true;
  const nVis = Math.ceil(S_N * (0.12 + 0.88 * soc));       // 酸被消耗:HSO₄⁻ 越来越少
  for (let i = 0; i < S_N; i++) {
    const o = hs[i];
    o.v.x += drift * Math.sign(o.p.x || 1) * 0.4 * dt;
    o.v.x += (Math.random() - .5) * 0.5 * dt;
    o.v.y += (Math.random() - .5) * 0.5 * dt;
    o.v.z += (Math.random() - .5) * 0.5 * dt;
    o.v.clampLength(0.04, 0.42);
    o.p.addScaledVector(o.v, dt);
    if (o.p.x < x0 || o.p.x > x1) { o.p.x = clamp(o.p.x, x0, x1); o.v.x *= -1; }
    if (o.p.y < y0 || o.p.y > y1) { o.p.y = clamp(o.p.y, y0, y1); o.v.y *= -1; }
    if (o.p.z < z0 || o.p.z > z1) { o.p.z = clamp(o.p.z, z0, z1); o.v.z *= -1; }
    dummy.position.copy(o.p);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.setScalar(i < nVis ? 0.85 + 0.25 * Math.sin(simTime * 4 + o.ph) : 0.0001);
    dummy.updateMatrix();
    ionsS.setMatrixAt(i, dummy.matrix);
  }
  ionsS.instanceMatrix.needsUpdate = true;
}
function updateCrystals() {
  const sulf = 1 - soc;
  for (let i = 0; i < XT_N; i++) {
    const c = xt[i];
    dummy.position.set(c.x, c.y, c.z);
    dummy.rotation.set(c.rx, 0, c.rz);
    dummy.scale.setScalar(Math.max(sulf * (0.35 + 0.75 * c.rs), 0.0001));
    dummy.updateMatrix();
    xtal.setMatrixAt(i, dummy.matrix);
  }
  xtal.instanceMatrix.needsUpdate = true;
}
function updateBubbles(dt) {
  if (gassing > 0 && Math.random() < dt * 30 * gassing) spawnBubble();
  for (let i = 0; i < BUB_N; i++) {
    const b = bubP[i];
    if (b.life > 0) {
      b.life -= dt * 1.1;
      b.p.y += b.v * dt;
      dummy.position.copy(b.p);
      dummy.scale.setScalar(Math.max(b.life, 0.001) * (0.6 + 0.5 * Math.sin(i * 7)));
    } else { dummy.position.set(0, -9, 0); dummy.scale.setScalar(0.0001); }
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    bub.setMatrixAt(i, dummy.matrix);
  }
  bub.instanceMatrix.needsUpdate = true;
}
function updateCircuit(dt) {
  const path = MODE === 'dis' ? pathD : pathC;
  const on = current > 0;
  const v = on ? 0.16 + current / 300 * 0.34 : 0;
  for (const e of electrons) {
    e.s = (e.s + dt * v) % 1;
    e.grp.position.copy(path.getPointAt(e.s)).add(e.grp.userData.offset);
    const a = on ? Math.pow(Math.sin(Math.PI * e.s), 0.6) : 0;
    e.grp.children[0].material.opacity = a;
    e.grp.visible = a > 0.02;
  }
  const glow = MODE === 'dis' && on ? current / 300 : 0;
  filament.material.emissiveIntensity = 0.05 + glow * 2.6;
  bulbLight.intensity = glow * 6.5;
  M.chgInd.emissive.set(gassing > 0.05 ? 0xff5340 : 0x51e07e);
  M.chgInd.emissiveIntensity = MODE === 'chg'
    ? (gassing > 0.05 ? 1.4 + 0.5 * Math.sin(simTime * 9) : 0.9 + current / 40)
    : 0.08;
}
function updateVisuals(dt) {
  M.elyte.color.lerpColors(C_DIL, C_CHG, soc);             // 酸浓→琥珀,放空→寡淡
  elyte.material.opacity = 0.14 + 0.08 * soc;
  hydFloat.position.y = FLOAT_Y(sgVal());
  M.pb.emissiveIntensity = 0.04 + (MODE === 'dis' && current > 0 ? 0.25 : 0);
  M.pbo2.emissiveIntensity = 0.04 + (MODE === 'dis' && current > 0 ? 0.18 : 0)
    + (MODE === 'chg' && current > 0 ? 0.25 : 0);
  updateIons(dt);
  updateCrystals();
  updateBubbles(dt);
  updateCircuit(dt);
  elWarn.classList.toggle('on', gassing > 0.05);
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, lastStep = -1, formulaAcc = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) { physStep(dts); tSim += dts; simTime += dts; }
  if (camK < 1) {
    camK = clamp(camK + dt / 0.9, 0, 1);
    const e = camK * camK * (3 - 2 * camK);
    camera.position.lerpVectors(camP0, camP1, e);
    controls.target.lerpVectors(camT0, camT1, e);
  }
  updateVisuals(dt);
  formulaAcc += dt;
  if (formulaAcc > 0.25) {
    formulaAcc = 0;
    document.getElementById('stV').textContent = voltage().toFixed(2) + ' V';
    document.getElementById('stSG').textContent = sgVal().toFixed(2);
    document.getElementById('stSOC').textContent = Math.round(soc * 100) + ' %';
    document.getElementById('stI').textContent = current > 0
      ? (MODE === 'chg' ? '−' : '') + Math.round(current) + ' A' : '0 A';
    document.getElementById('stPh').textContent = phaseText();
    if (!scrubbing) { elSoc.value = soc; elSocVal.textContent = Math.round(soc * 100) + ' %'; }
    updateFormula();
  }
  for (const r of labelReg) if (labelsOn && r.vis()) r.o.element.innerHTML = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && !document.hidden) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化(URL 参数) ================= */
setMode(MODE);
fastForward(qsFloat('t', 0));
applyTheme();
applyLang();
setPlayLabel();
start();
</script>
