<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从晶体管到加法器 · 三级放大</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#63e6be;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0ca678;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1.25; padding: 4px 9px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.xs { font-size: 10.5px; padding: 2px 7px; opacity: .92; }
  .lbl.st { border-color: rgba(99,230,190,.85); color: #c9f3e4; font-size: 12.5px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.st { color: #0b7a58; border-color: rgba(12,166,120,.8); }
  .lbl.hot { pointer-events: auto; cursor: pointer; font-weight: 700; font-size: 13px;
    border-color: rgba(99,230,190,.7); color: var(--text); }
  .lbl.hot:hover { border-color: var(--acc); color: var(--acc); }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 330px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.acc { color: var(--acc); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 13px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.cE { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  .chip.cP { color: #ffc2c2; border-color: rgba(255,138,128,.7); }
  .chip.cS { color: #c9f3e4; border-color: rgba(99,230,190,.7); }
  .chip.cG { color: #ffe9a8; border-color: rgba(255,209,102,.7); }
  :root[data-theme="light"] .chip.cE { color: #0c7ba6; border-color: rgba(12,123,166,.7); }
  :root[data-theme="light"] .chip.cP { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.cS { color: #0b7a58; border-color: rgba(12,166,120,.7); }
  :root[data-theme="light"] .chip.cG { color: #9c6f00; border-color: rgba(178,128,20,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .hint { font-size: 11.5px; color: var(--text2); line-height: 1.5; margin-top: 6px; }
  #gateBtns, #presets { display: flex; gap: 6px; margin-top: 6px; }
  .mini { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 8px; padding: 6px 4px; font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums; transition: border-color .15s, color .15s; }
  .mini:hover { border-color: var(--acc); color: var(--text); }
  .mini.on { border-color: var(--acc); color: var(--acc); }
  #truth { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 2px 8px; margin-top: 8px;
    font-size: 11.5px; color: var(--text2); font-variant-numeric: tabular-nums; }
  #truth span { padding: 2px 6px; border-radius: 6px; text-align: center; }
  #truth .hd { color: var(--text3); border-bottom: 1px solid var(--panel-border); border-radius: 0; }
  #truth span.on { background: rgba(99,230,190,.12); color: var(--acc); font-weight: 700; }
  :root[data-theme="light"] #truth span.on { background: rgba(12,166,120,.10); }
  #formula { font-size: 12px; color: var(--text3); background: var(--hover); border-radius: 8px;
    padding: 6px 9px; margin-top: 8px; line-height: 1.5; }
  #binRow { font-size: 12px; color: var(--text2); background: var(--hover); border-radius: 8px;
    padding: 6px 9px; margin-top: 6px; line-height: 1.6; font-variant-numeric: tabular-nums; }
  #binRow b { color: var(--acc); }
  #actions { display: flex; gap: 6px; margin-top: 10px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 6px; font-size: 12px; font-weight: 600;
    transition: border-color .15s, color .15s; white-space: nowrap; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn:disabled { opacity: .38; cursor: default; }
  .abtn:disabled:hover { border-color: var(--tool-border); color: var(--text2); }
  #steps { list-style: none; margin-top: 9px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(99,230,190,.10); border-color: rgba(99,230,190,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,166,120,.08); border-color: rgba(12,166,120,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #a9f0d9; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="从晶体管到加法器：三级放大" data-en="From Transistor to Adder: zoom ×3">从晶体管到加法器：三级放大</h1>
  <div class="sub" data-zh="3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 栅压开沟道 → 非门/与非门 → 半加器 → 全加器 → 8 位行波进位 · 空格播放/暂停" data-en="3D interactive · drag to orbit / scroll to zoom · gate opens a channel → NOT/NAND → half adder → full adder → 8-bit ripple carry · Space = play/pause">3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 · 栅压开沟道 → 非门/与非门 → 半加器 → 全加器 → 8 位行波进位 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats"></div>

<div id="panel">
  <div id="legend"></div>
  <div id="gFet">
    <div class="row"><label data-zh="栅压 V_GS" data-en="gate V_GS">栅压 V_GS</label><input id="vg" type="range" min="0" max="2.5" step="0.01" value="0"><span class="val" id="vgVal">0.00 V</span></div>
    <div class="hint" data-zh="V_th ≈ 0.7 V：栅压高过阈值，电场才「吸」出一条反型沟道——像水闸提放，却没有机械件。" data-en="V_th ≈ 0.7 V: above threshold the field pulls up an inversion channel — a sluice with no moving parts.">V_th ≈ 0.7 V：栅压高过阈值，电场才「吸」出一条反型沟道——像水闸提放，却没有机械件。</div>
  </div>
  <div id="gGate" style="display:none">
    <div id="gateBtns">
      <button class="mini" id="btnInvA">非门 A=0</button>
      <button class="mini" id="btnNA">与非 A=0</button>
      <button class="mini" id="btnNB">与非 B=0</button>
    </div>
    <div id="truth"></div>
  </div>
  <div id="gAdd" style="display:none">
    <div class="row"><label data-zh="加数 A（0–255）" data-en="operand A (0–255)">加数 A（0–255）</label><input id="inA" type="range" min="0" max="255" step="1" value="1"><span class="val" id="inAVal">1</span></div>
    <div class="row"><label data-zh="加数 B（0–255）" data-en="operand B (0–255)">加数 B（0–255）</label><input id="inB" type="range" min="0" max="255" step="1" value="255"><span class="val" id="inBVal">255</span></div>
    <div id="presets">
      <button class="mini" id="p11">1+1</button>
      <button class="mini" id="p631">63+1</button>
      <button class="mini" id="p1255">1+255</button>
      <button class="mini" id="pRnd" data-zh="随机" data-en="random">随机</button>
    </div>
  </div>
  <div id="formula"></div>
  <div id="binRow"></div>
  <div id="actions">
    <button class="abtn" id="btnPrev" data-zh="◀ 缩回上一层" data-en="◀ level up">◀ 缩回上一层</button>
    <button class="abtn" id="btnReplay" data-zh="重放" data-en="Replay">重放</button>
    <button class="abtn" id="btnNext" data-zh="进入下一层 ▶" data-en="next level ▶">进入下一层 ▶</button>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin:0"><label data-zh="速度" data-en="speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row" style="margin:0"><label data-zh="进度" data-en="progress">进度</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    <label><input id="tglAuto" type="checkbox" checked> <span data-zh="自动演示" data-en="auto demo">自动演示</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../pn-junction/" data-zh="同族:p-n 结,沟道下的物理" data-en="same family: the p-n junction">同族:p-n 结,沟道下的物理</a>
    <a href="../sorting-race/" data-zh="同域:计算的成本" data-en="same domain: cost of computing">同域:计算的成本</a>
    <a href="../rsa-crypto/" data-zh="延伸:门电路搭出密码学" data-en="beyond: gates → cryptography">延伸:门电路搭出密码学</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 40, 95);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const bg = THEME === 'light' ? 0xeef1f6 : 0x10141b;
  scene.background = new THREE.Color(bg);
  if (scene.fog) scene.fog.color.set(bg);
  M.ground.color.set(THEME === 'light' ? 0xd6dce6 : 0x141922);
  M.pad.color.set(THEME === 'light' ? 0xc4cddc : 0x1d2532);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('从晶体管到加法器 · 三级放大', 'From Transistor to Adder · zoom ×3');
  for (const r of labelRegistry) if (r.zh !== undefined && r.zh !== '') r.o.element.textContent = L(r.zh, r.en);
  buildLegend(); buildStats(); buildSteps(); buildTruth(); buildFormula();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
camera.position.set(1, 13, 27);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 48;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(6, 14, 8);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-8, 5, -8);
scene.add(fill);

/* ---------------- 材质 ---------------- */
const M = {
  ground: new THREE.MeshStandardMaterial({ color: 0x141922, roughness: 0.95 }),
  pad: new THREE.MeshStandardMaterial({ color: 0x1d2532, roughness: 0.85 }),
  sub: new THREE.MeshStandardMaterial({ color: 0x59424a, roughness: 0.62 }),
  nplus: new THREE.MeshStandardMaterial({ color: 0x2e5f80, roughness: 0.4, emissive: 0x74c0fc, emissiveIntensity: 0.12 }),
  ox: new THREE.MeshBasicMaterial({ color: 0xcdbdf5, transparent: true, opacity: 0.4 }),
  gate: new THREE.MeshStandardMaterial({ color: 0xd9b96a, metalness: 0.85, roughness: 0.3, emissive: 0xffd166, emissiveIntensity: 0.08 }),
  chan: new THREE.MeshBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.1, depthWrite: false }),
  metal: new THREE.MeshStandardMaterial({ color: 0xcfd4dc, metalness: 0.8, roughness: 0.3 }),
  wire: new THREE.MeshStandardMaterial({ color: 0x93a0b4, metalness: 0.5, roughness: 0.4 }),
  railV: new THREE.MeshStandardMaterial({ color: 0xa24d57, roughness: 0.5 }),
  railG: new THREE.MeshStandardMaterial({ color: 0x3a4a63, roughness: 0.5 }),
  pmos: new THREE.MeshStandardMaterial({ color: 0xb3565e, roughness: 0.45, emissive: 0xff8787, emissiveIntensity: 0.06 }),
  nmos: new THREE.MeshStandardMaterial({ color: 0x2f5d8a, roughness: 0.45, emissive: 0x74c0fc, emissiveIntensity: 0.06 }),
  lamp: new THREE.MeshStandardMaterial({ color: 0xfff2cc, emissive: 0xffd166, emissiveIntensity: 0.06, roughness: 0.3 }),
  glow: new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0, depthWrite: false }),
  battery: new THREE.MeshStandardMaterial({ color: 0x90be6d, roughness: 0.4 }),

/* ---------------- 几何小工具 ---------------- */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
function rod(parent, a, b, m, r = 0.03) {
  a = V3(...a); b = V3(...b);
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), m);
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize());
  parent.add(mesh);
  return mesh;
}
function poly(pts) {
  const v = pts.map(p => V3(...p)), seg = [];
  let tot = 0;
  for (let i = 0; i < v.length - 1; i++) { const l = v[i].distanceTo(v[i + 1]); seg.push(l); tot += l; }
  return { v, seg, tot, at(q, out) {
    let d = clamp(q, 0, 0.9999) * this.tot;
    for (let i = 0; i < seg.length; i++) {
      if (d <= seg[i]) return out.copy(v[i]).lerp(v[i + 1], d / seg[i]);
      d -= seg[i];
    }
    return out.copy(v[v.length - 1]);
  } };
}

function applyOperands() {
  for (let i = 0; i < 8; i++) {
    const a = (aVal >> i) & 1, b = (bVal >> i) & 1;
    p_[i] = a ^ b; g_[i] = a & b;
    c_[i + 1] = g_[i] || (p_[i] && c_[i]);
    s_[i] = p_[i] ^ c_[i];
  }
  cOut = c_[8]; chain = 0;
  for (let i = 0; i < 8; i++) if (c_[i + 1]) chain = i + 1;
  for (let i = 0; i < 8; i++) {
    pegMesh.setColorAt(i, ((aVal >> i) & 1) ? cA : cOff);
    pegMesh.setColorAt(i + 8, ((bVal >> i) & 1) ? cB : cOff);
  }
  if (pegMesh.instanceColor) pegMesh.instanceColor.needsUpdate = true;
  for (let i = 0; i < 8; i++) tubeM[i].material = c_[i + 1] ? M.tubeLit : M.tubeDim;
  buildBin();
}
function setOperands(a, b) {
  aVal = Math.round(clamp(a, 0, 255));
  bVal = Math.round(clamp(b, 0, 255));
  elInA.value = aVal; elInB.value = bVal;
  elInAVal.textContent = aVal; elInBVal.textContent = bVal;
  applyOperands();
  tLoop = 0;
}

/* ================= 逐帧更新 ================= */
function updateFet(dt, dts) {
  const vov = Math.max(0, vDisp - 0.7), f = clamp(vov / 1.8, 0, 1);
  chanMesh.material.opacity = 0.08 + 0.65 * f;
  chanMesh.scale.y = 0.3 + 0.7 * f;
  M.gate.emissiveIntensity = 0.08 + 1.3 * (vDisp / 2.5);
  M.arr.opacity = 0.85 * clamp(vDisp / 2.5, 0, 1);
  fetLampM.emissiveIntensity = 0.06 + 2.4 * f;
  fetHalo.material.opacity = 0.38 * f;
  const flow = f > 0.02 ? 1.0 + 2.6 * f : 0;
  for (let i = 0; i < N_E; i++) {
    const p = eP[i], v = eV[i];
    if (eSub[i]) {
      v.x += rand(-1, 1) * 0.8 * dt; v.y += rand(-1, 1) * 0.8 * dt; v.multiplyScalar(0.92);
    } else if (flow > 0 && p.y > 1.95) {
      v.x = lerp(v.x, flow, 0.12);
      v.y += rand(-1, 1) * 0.6 * dt; v.z += rand(-1, 1) * 0.6 * dt;
    } else {
      const inCh = p.x > -1.3 && p.x < 1.3 && p.y > 1.95;
      if (inCh) { v.x = lerp(v.x, -2.4, 0.2); v.y -= 2.5 * dt; }
      else { v.x *= 0.9; v.y += rand(-1, 1) * 0.6 * dt; v.z += rand(-1, 1) * 0.6 * dt; v.multiplyScalar(0.95); }
    }
    p.addScaledVector(v, dts);
    if (p.x > 2.55) { p.set(rand(-2.5, -1.5), rand(1.3, 2.0), rand(-0.8, 0.8)); v.set(0, 0, 0); }
    if (!eSub[i]) {
      if (p.x > -1.3 && p.x < 1.3 && p.y > 1.9) p.y = clamp(p.y, 2.0, 2.22);
      else p.y = clamp(p.y, 1.2, 2.2);
    } else p.y = clamp(p.y, 0.25, 1.05);
    p.x = clamp(p.x, -2.55, 2.55); p.z = clamp(p.z, -0.9, 0.9);
    m4tmp.makeTranslation(p.x, p.y, p.z);
    eMesh.setMatrixAt(i, m4tmp);
  }
  eMesh.instanceMatrix.needsUpdate = true;
  if (flow > 0) {
    for (let k = 0; k < 4; k++) {
      pathF.at((tSim * 0.35 + k * 0.25) % 1, tv);
      m4tmp.makeTranslation(tv.x, tv.y, tv.z);
      dotMesh.setMatrixAt(16 + k, m4tmp);
    }
  } else for (let k = 16; k < 20; k++) { m4tmp.makeScale(0.001, 0.001, 0.001); dotMesh.setMatrixAt(k, m4tmp); }
}
function updateGates(dt) {
  const invY = invA ? 0 : 1, nandY = (nandA && nandB) ? 0 : 1;
  setT(P1, !invA); setT(N1, !!invA);
  setT(PA, !nandA); setT(PB, !nandB); setT(NA, !!nandA); setT(NB, !!nandB);
  lampInvM.emissiveIntensity = invY ? 1.8 : 0.06;
  haloInv.material.opacity = invY ? 0.35 : 0;
  yInv.material.emissiveIntensity = invY ? 1.4 : 0.08;
  lampNandM.emissiveIntensity = nandY ? 1.8 : 0.06;
  haloNand.material.opacity = nandY ? 0.35 : 0;
  yNand.material.emissiveIntensity = nandY ? 1.4 : 0.08;
  const kk = 1 - Math.exp(-dt * 8);
  levInv.rotation.z = lerp(levInv.rotation.z, invA ? 0.55 : -0.55, kk);
  levNA.rotation.z = lerp(levNA.rotation.z, nandA ? 0.55 : -0.55, kk);
  levNB.rotation.z = lerp(levNB.rotation.z, nandB ? 0.55 : -0.55, kk);
  const invPaths = invA ? [nPath] : [pPath];
  const nandPaths = [];
  if (nandA && nandB) nandPaths.push(sPath);
  else { if (!nandA) nandPaths.push(paPath); if (!nandB) nandPaths.push(pbPath); }
  for (let k = 0; k < 8; k++) {
    invPaths[k % invPaths.length].at((tSim * 0.5 + k * 0.125) % 1, tv);
    m4tmp.makeTranslation(tv.x, tv.y, tv.z);
    dotMesh.setMatrixAt(k, m4tmp);
    nandPaths[k % nandPaths.length].at((tSim * 0.5 + k * 0.125) % 1, tv);
    m4tmp.makeTranslation(tv.x, tv.y, tv.z);
    dotMesh.setMatrixAt(8 + k, m4tmp);
  }
}
function updateAdder() {
  const rt = tLoop * T;
  for (let i = 0; i < 8; i++) {
    const act = rt >= (i + 1) * ST;
    const fl = act ? Math.exp(-(rt - (i + 1) * ST) * 2.5) : 0;
    towers[i].mat.emissiveIntensity = 0.04 + 0.55 * fl;
    towers[i].lampM.emissiveIntensity = act ? ((s_[i] ? 1.5 : 0.05) + s_[i] * 1.8 * fl) : 0.04;
  }
  outLampM.emissiveIntensity = rt > 8 * ST + 0.85 ? (cOut ? 2.0 : 0.06) : 0.04;
  for (let i = 0; i < 8; i++) {
    if (c_[i + 1] && rt > (i + 1) * ST && rt < (i + 1) * ST + 0.85) {
      const q = (rt - (i + 1) * ST) / 0.85;
      const x1 = towers[i].x + 0.58, x2 = i < 7 ? towers[i + 1].x - 0.58 : 22.8;
      const s = 0.5 + 0.9 * Math.sin(Math.PI * q);
      m4tmp.makeScale(s, s, s);
      m4tmp.setPosition(lerp(x1, x2, q), 1.05 + 0.28 * Math.sin(Math.PI * q), 0);
    } else m4tmp.makeScale(0.001, 0.001, 0.001);
    cMesh.setMatrixAt(i, m4tmp);
  }
  cMesh.instanceMatrix.needsUpdate = true;
  if (focus >= 0) {
    const i = focus, a = (aVal >> i) & 1, b = (bVal >> i) & 1, cin = c_[i];
    const s1 = a ^ b, c1 = a & b, so = s1 ^ cin, c2 = s1 & cin, co = c1 | c2;
    const fa = focusStage === 'fa';
    gl1.element.innerHTML = `<b>${L('半加器 1', 'half adder 1')}</b>：S₁=A⊕B=<b>${s1}</b> · C₁=A·B=<b>${c1}</b>`;
    gl2.element.innerHTML = `<b>${L('半加器 2', 'half adder 2')}</b>：S=S₁⊕Cin=<b>${so}</b> · C₂=S₁·Cin=<b>${c2}</b>`;
    gl3.element.innerHTML = `<b>${L('或门', 'OR')}</b>：Cout=C₁|C₂=<b>${co}</b>`;
    gb1.material.emissiveIntensity = (s1 || c1) ? 0.9 : 0.15;
    if (fa) {
      gb2.material.emissiveIntensity = (so || c2) ? 0.9 : 0.15;
      gb3.material.emissiveIntensity = co ? 1.0 : 0.15;
    } else { gb2.material.emissiveIntensity = 0.08; gb3.material.emissiveIntensity = 0.08; }
  }
}

btnReplay.addEventListener('click', () => { tLoop = 0; });
tglLabels.addEventListener('change', refreshLabels);
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
tglAuto.addEventListener('change', () => { autoDemo = tglAuto.checked; });
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
if (!qsBool('labels', true)) tglLabels.checked = false;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
/* 点击:3D 拨杆切换输入,加法塔聚焦放大 */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let pdx = 0, pdy = 0;
renderer.domElement.addEventListener('pointerdown', e => { pdx = e.clientX; pdy = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if ((e.clientX - pdx) ** 2 + (e.clientY - pdy) ** 2 > 36) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(clickables, false)[0];
  if (!hit) return;
  const ud = hit.object.userData;
  if (ud.bit !== undefined) { if (focus === ud.bit) unfocus(); else setFocus(ud.bit, 'fa'); }
  else if (ud.k) {
    autoDemo = false; tglAuto.checked = false;
    if (ud.k === 'invA') invA ^= 1; else if (ud.k === 'nandA') nandA ^= 1; else nandB ^= 1;
  }
});

/* ================= 主循环(document.hidden 时停 rAF) ================= */
const clock = new THREE.Clock();
let rafId = 0;
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  tSim += dts;
  if (playing) {
    tLoop += dts / T;
    if (tLoop >= 1) {
      tLoop -= 1;
      if (autoDemo) { plIdx = (plIdx + 1) % PLAYLIST.length; setOperands(PLAYLIST[plIdx][0], PLAYLIST[plIdx][1]); }
    }
  }
  if (autoDemo) {
    const u = tLoop;
    Vg = 2.5 * (clamp((u - 0.46) / 0.08, 0, 1) - clamp((u - 0.96) / 0.08, 0, 1));
    const seg = SEG[Math.min(3, Math.floor(u * 4))];
    invA = seg[0]; nandA = seg[1]; nandB = seg[2];
  }
  vDisp = lerp(vDisp, Vg, 1 - Math.exp(-dt * 7));
  if (autoDemo) elVg.value = vDisp;
  elVgVal.textContent = vDisp.toFixed(2) + ' V';
  updateFet(dt, dts);
  updateGates(dt);
  updateAdder();
  dotMesh.instanceMatrix.needsUpdate = true;
  if (!scrubbing) elScrub.value = Math.round(tLoop * 1000);
  elScrubVal.textContent = Math.round(tLoop * 100) + '%';
  syncGateUI(); updateStats();
  if (level === 1) {
    const k = NANDTT.findIndex(r => r[0] === nandA && r[1] === nandB);
    for (let r = 0; r < 4; r++) elTruth.children[3 + r * 3 + 2].classList.toggle('on', r === k);
  }
  for (const r of dynLabels) r.o.element.innerHTML = r.fn();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  if (camGoal) {
    const k = 1 - Math.exp(-dt * 3.0);
    camera.position.lerp(camGoal.p, k);
    controls.target.lerp(camGoal.t, k);
    if (camera.position.distanceTo(camGoal.p) < 0.06 && controls.target.distanceTo(camGoal.t) < 0.06) camGoal = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { clock.getDelta(); rafId = requestAnimationFrame(frame); }
});

/* ================= 初始化 ================= */
applyTheme();
applyLang();
applyOperands();
elInA.value = aVal; elInB.value = bVal;
elInAVal.textContent = aVal; elInBVal.textContent = bVal;
refreshLabels();
setLevel(clamp(Math.round(qsFloat('lvl', 0)), 0, 2), qs.get('lvl') !== null);
if (qs.get('focus') !== null) {
  setLevel(2, true);
  setFocus(clamp(Math.round(qsFloat('focus', 0)), 0, 7), 'fa');
}
setPlayLabel();
rafId = requestAnimationFrame(frame);
</script>
</body>
</html>
