<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从晶体管到加法器 · 200 颗开关算出 5+3</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffb454;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b8740f;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,180,84,.9); color: #ffe3ba; }
  .lbl.b { border-color: rgba(76,201,240,.9); color: #bde9ff; }
  .lbl.hot { border-color: rgba(255,80,64,.9); color: #ffc4bd; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(184,116,15,.9); color: #8a5c0d; }
  :root[data-theme="light"] .lbl.hot { border-color: rgba(200,60,45,.9); color: #b83a2e; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: var(--acc); }
  #stats .v.hot { color: #ff8787; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 76px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 62px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,180,84,.10); border-color: rgba(255,180,84,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(184,116,15,.08); border-color: rgba(184,116,15,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #ffd9a0; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="从晶体管到加法器:200 颗开关算出 5+3" data-en="From Transistor to Adder: 200 switches compute 5+3">从晶体管到加法器:200 颗开关算出 5+3</h1>
  <div class="sub" data-zh="栅压一吸,电子成沟道——MOSFET 开闸;1→2→4→16→22→200 颗晶体管逐级搭出非门、与非门、异或、半加器、4 位行波加法器,进位红热如涟漪 · 点击加法器的 A/B 位柱切换 0/1 · 空格播放/暂停" data-en="Gate voltage pulls electrons into a channel — the MOSFET valve; 1→2→4→16→22→200 transistors build NOT, NAND, XOR, half adder, then a 4-bit ripple adder whose carry glows red-hot stage by stage · click the A/B pillars to flip bits · Space = play/pause">栅压一吸,电子成沟道——MOSFET 开闸;1→2→4→16→22→200 颗晶体管逐级搭出非门、与非门、异或、半加器、4 位行波加法器,进位红热如涟漪 · 点击加法器的 A/B 位柱切换 0/1 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="晶体管计数" data-en="transistors">晶体管计数</span><span class="v g" id="stTr">—</span>
  <span class="k" data-zh="关键路径延迟" data-en="critical path">关键路径延迟</span><span class="v" id="stDelay">—</span>
  <span class="k" data-zh="当前运算" data-en="computing">当前运算</span><span class="v g" id="stCalc">—</span>
  <span class="k" data-zh="进位波" data-en="carry wave">进位波</span><span class="v hot" id="stWave">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnBeat" data-zh="逐拍:打一拍" data-en="Step one beat">逐拍:打一拍</button>
    <button class="abtn" id="btnWave" data-zh="重放进位波" data-en="Replay carry wave">重放进位波</button>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0×</span></div>
    <div class="row"><label data-zh="进度" data-en="Phase">进度</label><input id="phase" type="range" min="0" max="36" step="0.1" value="0"><span class="val" id="phaseVal">0 拍</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglPulse" type="checkbox" checked> <span data-zh="信号脉冲" data-en="pulses">信号脉冲</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../pn-junction/" data-zh="上游:p-n 结——半导体怎么导电" data-en="upstream: p-n junction — how silicon conducts">上游:p-n 结——半导体怎么导电</a>
    <a href="../sorting-race/" data-zh="下游:门搭出的机器跑算法" data-en="downstream: machines of gates run algorithms">下游:门搭出的机器跑算法</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  M.board.color.set(THEME === 'light' ? 0x39434f : 0x232b38);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('从晶体管到加法器 · 200 颗开关算出 5+3', 'Transistor → Adder · 200 switches compute 5+3');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
camera.position.set(1, 10.5, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 32;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(5, 9, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 / 构建助手 ---------------- */
const AMBER = 0xffb454, RED = 0xff5040;
function std(color, o = {}) { return new THREE.MeshStandardMaterial({ color, roughness: .55, metalness: .15, ...o }); }
const M = {
  floor: std(0x1b212c, { roughness: .9 }),
  board: std(0x232b38, { roughness: .8 }),
  silicon: std(0x6f7f9a, { roughness: .7 }),
  nplus: std(0xc9863f, { roughness: .6 }),
  oxide: std(0xe8dfa0, { transparent: true, opacity: .4 }),
  metal: std(0xb9c2cc, { metalness: .85, roughness: .3 }),
  gnd: std(0x3a4350),
  elec: new THREE.MeshBasicMaterial({ color: 0x7fc8ff }),
  chan: new THREE.MeshBasicMaterial({ color: 0x5fb0ff, transparent: true, opacity: 0 }),
  beam: new THREE.MeshBasicMaterial({ color: AMBER, transparent: true, opacity: .18 }),
  hot: new THREE.MeshBasicMaterial({ color: RED }),
};
const animMats = [], redMats = [], pulses = [], dynLabels = [];
function glowMat(color, em = AMBER) { const m = std(color); m.emissive = new THREE.Color(em); m.emissiveIntensity = .06; return m; }
function regA(m, v) { animMats.push({ m, v }); return m; }
function regR(m, v) { redMats.push({ m, v }); return m; }
function box(w, h, d, m, x, y, z) { const s = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); s.position.set(x, y, z); scene.add(s); return s; }
function tube(pts, r, m) {
  const c = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const s = new THREE.Mesh(new THREE.TubeGeometry(c, 20, r, 6, false), m);
  scene.add(s); s.userData.curve = c; return s;
}
function sigWire(pts, v, r = .032) { return tube(pts, r, regA(glowMat(0x4a5566), v)); }
function ball(x, y, z, v, r = .09) { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), regA(glowMat(0x6a7484), v)); s.position.set(x, y, z); scene.add(s); return s; }
function pulse(curve, v, off) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), new THREE.MeshBasicMaterial({ color: AMBER, transparent: true, opacity: .9 }));
  scene.add(s); pulses.push({ curve, mesh: s, v, off });
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, x, y, z, cls = '', dyn = false) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.set(x, y, z);
  scene.add(o);
  labelRegistry.push({ o, text: textFn });
  if (dyn) dynLabels.push({ el: div, text: textFn });
  div.textContent = textFn();
  return o;
}

/* ---------------- 全局时钟信号 ---------------- */
let tSim = 0, GA = 0, GB = 0; // GA 每拍翻转, GB 每两拍翻转 → 4 拍扫完真值表

/* ---------------- 区 1:MOSFET 剖面(≈100 nm) ---------------- */
const X1 = -14;
box(6.4, .25, 4.2, M.board, X1, .125, 0);
box(4.4, 1.0, 2.4, M.silicon, X1, .75, 0);
box(.95, .34, 2.4, M.nplus, X1 - 1.5, 1.08, 0);
box(.95, .34, 2.4, M.nplus, X1 + 1.5, 1.08, 0);
box(1.9, .03, 2.2, M.chan, X1, 1.265, 0);
box(2.1, .07, 2.4, M.oxide, X1, 1.285, 0);
box(1.7, .22, 2.4, regA(glowMat(0x8a94a0), () => GA), X1, 1.43, 0);
box(.5, .16, .6, M.metal, X1 - 1.5, 1.33, 0);
box(.5, .16, .6, M.metal, X1 + 1.5, 1.33, 0);
const electrons = [];
for (let i = 0; i < 22; i++) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(.05, 8, 6), M.elec);
  scene.add(s);
  electrons.push({ mesh: s, u: Math.random(), zj: rand(-1, 1), yj: rand(0, 1) });
}
addLabel(() => L('栅极 G', 'gate G'), X1, 1.98, 0, 'g');
addLabel(() => L('源极 S', 'source S'), X1 - 1.5, 1.8, 1.15);
addLabel(() => L('漏极 D', 'drain D'), X1 + 1.5, 1.8, 1.15);
addLabel(() => L('p 型衬底', 'p-substrate'), X1, .55, 1.65);
addLabel(() => 'n⁺', X1 - 1.5, .85, -1.5);
addLabel(() => L('感应沟道(电子层)', 'induced channel (electrons)'), X1, 1.66, -1.55, 'b');
addLabel(() => 'Vth ≈ 0.7 V', X1 + 2.55, 1.75, 0);
addLabel(() => L('尺度 ≈ 100 nm', 'scale ≈ 100 nm'), X1, 2.5, 0, 'st');
addLabel(() => GA ? L('V_G > Vth:沟道开,源→漏导通', 'V_G > Vth: channel ON, S→D conducts')
  : L('V_G < Vth:沟道断,截止', 'V_G < Vth: channel OFF'), X1, 3.15, 0, 'st', true);

/* ---------------- 区 2:门级电路(≈1 µm) ---------------- */
box(11, .25, 4.5, M.board, 0, .55, -0.1);
ball(-5.35, 1.75, 1.5, () => GA);
ball(-5.35, 1.25, 1.5, () => GB);
addLabel(() => `A = ${GA}`, -5.35, 2.08, 1.5, 'b', true);
addLabel(() => `B = ${GB}`, -5.35, .92, 1.5, 'b', true);
addLabel(() => L('主时钟', 'master clock'), -5.35, 2.5, 1.5);
/* 非门 NOT:PMOS 上 / NMOS 下 */
const m0 = -4.2;
box(.5, .4, .5, regA(glowMat(0xd98a9a), () => 1 - GA), m0, 1.92, -0.5);
box(.5, .4, .5, regA(glowMat(0x6fa8dc), () => GA), m0, 1.06, -0.5);
box(1.2, .06, .3, regA(glowMat(0xb9c2cc), () => 1), m0, 2.28, -0.5);
box(1.2, .06, .3, M.gnd, m0, .7, -0.5);
tube([[m0, 2.25, -0.5], [m0, .73, -0.5]], .03, M.metal);
const wNin = sigWire([[m0 - 1.15, 1.5, .95], [m0 - .55, 1.5, .1], [m0 - .27, 1.5, -0.5]], () => GA);
const wNout = sigWire([[m0, 1.5, -0.5], [m0 + .7, 1.5, .2], [m0 + 1.15, 1.5, .95]], () => 1 - GA);
ball(m0 - 1.15, 1.5, .95, () => GA);
ball(m0 + 1.15, 1.5, .95, () => 1 - GA);
pulse(wNin.userData.curve, () => GA, .15);
pulse(wNout.userData.curve, () => 1 - GA, .55);
addLabel(() => L('非门 NOT · 2 颗', 'NOT · 2 tr.'), m0, 2.7, 0, 'g');
/* 与非门 NAND:两 NMOS 串联 / 两 PMOS 并联 */
const m1 = -1.4;
const NAND = () => 1 - (GA & GB);
box(.5, .34, .5, regA(glowMat(0xd98a9a), () => 1 - GA), m1, 1.95, -0.85);
box(.5, .34, .5, regA(glowMat(0xd98a9a), () => 1 - GB), m1, 1.95, -0.15);
box(.5, .34, .5, regA(glowMat(0x6fa8dc), () => GA), m1, 1.24, -0.5);
box(.5, .34, .5, regA(glowMat(0x6fa8dc), () => GB), m1, .9, -0.5);
box(1.2, .06, .3, regA(glowMat(0xb9c2cc), () => 1), m1, 2.26, -0.5);
box(1.2, .06, .3, M.gnd, m1, .7, -0.5);
tube([[m1, 2.23, -0.5], [m1, .73, -0.5]], .03, M.metal);
const wAa = sigWire([[m1 - 1.15, 1.75, .95], [m1 - .5, 1.75, -0.5]], () => GA);
sigWire([[m1 - 1.15, 1.25, .95], [m1 - .5, 1.25, -0.5]], () => GB);
const wND = sigWire([[m1, 1.6, -0.5], [m1 + 1.15, 1.6, .95]], NAND);
ball(m1 - 1.15, 1.75, .95, () => GA);
ball(m1 - 1.15, 1.25, .95, () => GB);
ball(m1 + 1.15, 1.6, .95, NAND);
pulse(wAa.userData.curve, () => GA, .3);
pulse(wND.userData.curve, NAND, .7);
addLabel(() => L('与非门 NAND · 4 颗', 'NAND · 4 tr.'), m1, 2.7, 0, 'g');
/* 异或 XOR:4 个 NAND 级联 */
const m2 = 1.4;
const N1 = () => 1 - (GA & GB), N2 = () => 1 - (GA & N1()), N3 = () => 1 - (GB & N1()), XR = () => GA ^ GB;
box(.4, .4, .4, regA(glowMat(0xb084d8), N1), m2 - .85, 1.55, -0.3);
box(.4, .4, .4, regA(glowMat(0xb084d8), N2), m2 - .1, 1.98, -0.45);
box(.4, .4, .4, regA(glowMat(0xb084d8), N3), m2 - .1, 1.12, -0.45);
box(.4, .4, .4, regA(glowMat(0xb084d8), XR), m2 + .7, 1.55, -0.3);
sigWire([[m2 - 1.15, 1.75, .95], [m2 - .95, 1.75, -0.5]], () => GA);
sigWire([[m2 - 1.15, 1.25, .95], [m2 - .95, 1.25, -0.5]], () => GB);
sigWire([[m2 - .85, 1.55, -0.3], [m2 - .1, 1.98, -0.45]], N1);
sigWire([[m2 - .85, 1.55, -0.3], [m2 - .1, 1.12, -0.45]], N1);
sigWire([[m2 - .1, 1.98, -0.45], [m2 + .7, 1.62, -0.3]], N2);
sigWire([[m2 - .1, 1.12, -0.45], [m2 + .7, 1.48, -0.3]], N3);
const wX = sigWire([[m2 + .7, 1.55, -0.3], [m2 + 1.15, 1.55, .95]], XR);
ball(m2 - 1.15, 1.75, .95, () => GA);
ball(m2 - 1.15, 1.25, .95, () => GB);
ball(m2 + 1.15, 1.55, .95, XR);
pulse(wX.userData.curve, XR, .45);
addLabel(() => L('异或门 XOR · 16 颗', 'XOR · 16 tr.'), m2, 2.7, 0, 'g');
/* 半加器 HA:XOR 出和 / AND 出进位 */
const m3 = 4.2;
box(.45, .45, .45, regA(glowMat(0x63c7b8), XR), m3 - .3, 1.8, -0.3);
box(.45, .45, .45, regA(glowMat(0xd8a05f), () => GA & GB), m3 - .3, 1.1, -0.3);
sigWire([[m3 - 1.15, 1.9, .95], [m3 - .62, 1.8, -0.3]], () => GA);
sigWire([[m3 - 1.15, 1.2, .95], [m3 - .62, 1.1, -0.3]], () => GB);
const wS = sigWire([[m3 - .08, 1.8, -0.3], [m3 + 1.15, 1.8, .6]], XR);
const wC = sigWire([[m3 - .08, 1.1, -0.3], [m3 + 1.15, 1.1, .95]], () => GA & GB);
ball(m3 - 1.15, 1.9, .95, () => GA);
ball(m3 - 1.15, 1.2, .95, () => GB);
ball(m3 + 1.15, 1.8, .6, XR);
ball(m3 + 1.15, 1.1, .95, () => GA & GB);
pulse(wS.userData.curve, XR, .2);
pulse(wC.userData.curve, () => GA & GB, .6);
addLabel(() => L('半加器 · 22 颗', 'half adder · 22 tr.'), m3, 2.7, 0, 'g');
addLabel(() => 'S = A⊕B', m3 + 1.15, 2.14, .6);
addLabel(() => 'C = A·B', m3 + 1.15, 1.44, .95);
addLabel(() => L('尺度 ≈ 1 µm', 'scale ≈ 1 µm'), 0, 3.35, 0, 'st');

/* ---------------- 区 3:4 位行波加法器(≈10 µm) ---------------- */
box(10.6, .25, 5.2, M.board, 16.4, .55, -0.15);
const X3 = [12.9, 14.95, 17, 19.05];
const bitsA = [1, 0, 1, 0], bitsB = [1, 1, 0, 0]; // 5 + 3,LSB 在前
const S = [0, 0, 0, 0], C = [0, 0, 0, 0, 0];
let waveT = 99, waveActive = false;
function compute() { let c = 0; for (let i = 0; i < 4; i++) { const a = bitsA[i], b = bitsB[i]; S[i] = a ^ b ^ c; c = (a & b) | (c & (a ^ b)); C[i + 1] = c; } }
function refire() { waveT = 0; waveActive = true; }
const reveal = () => waveT > 3.7;
const bin4 = a => [...a].reverse().join('');
const bval = a => a[0] + 2 * a[1] + 4 * a[2] + 8 * a[3];
const clickables = [], shellM = [], segM = [], sumM = [], pillars = [];
function redSeg(pts) { const m = std(0x5a3a3a); m.emissive = new THREE.Color(RED); m.emissiveIntensity = .06; return tube(pts, .05, m); }
for (let i = 0; i < 4; i++) {
  const x = X3[i];
  const sm = glowMat(0x3a4656, RED); sm.transparent = true; sm.opacity = .32; shellM.push(sm);
  box(1.6, 1.25, 1.6, sm, x, 1.3, 0);
  box(.34, .34, .34, std(0x63c7b8), x - .35, 1.1, -0.3);
  box(.34, .34, .34, std(0x63c7b8), x + .35, 1.1, 0.3);
  box(.34, .34, .34, regR(glowMat(0xd8a05f, RED), () => waveT > i + 0.55 && C[i + 1] === 1), x, 1.62, 0);
  for (const [arr, z] of [[bitsA, -1.55], [bitsB, -2.45]]) {
    const g = new THREE.BoxGeometry(.5, 1, .5); g.translate(0, .5, 0);
    const s = new THREE.Mesh(g, regA(glowMat(0x8a94a0), () => arr[i] === 1));
    s.position.set(x, .675, z); s.scale.y = arr[i] ? 1.15 : .45;
    s.userData = { arr, i }; scene.add(s); clickables.push(s); pillars.push({ mesh: s, arr, i });
    addLabel(() => `${arr[i]}`, x, 2.32, z, 'b', true);
  }
  sumM.push(glowMat(0x6a7484));
  box(.55, .32, .55, sumM[i], x, .86, 1.75);
  segM.push(redSeg(i < 3 ? [[x + .82, 2.15, 0], [X3[i + 1] - .82, 2.15, 0]] : [[x + .82, 2.15, 0], [20.35, 2.15, 0]]));
  addLabel(() => '2' + '⁰¹²³'[i], x, 2.78, 0);
}
tube([[11.62, 2.15, 0], [12.08, 2.15, 0]], .05, M.gnd);
ball(11.62, 2.15, 0, () => 0);
const coutM = regR(glowMat(0x6a7484, RED), () => waveT > 3.9 && C[4] === 1);
const coutB = new THREE.Mesh(new THREE.SphereGeometry(.1, 14, 10), coutM);
coutB.position.set(20.35, 2.15, 0); scene.add(coutB);
const hotS = new THREE.Mesh(new THREE.SphereGeometry(.14, 12, 10), M.hot);
const hotL = new THREE.PointLight(0xff4530, 0, 5);
hotS.add(hotL); hotS.visible = false; scene.add(hotS);
addLabel(() => L('全加器 × 4 = 4 位行波加法器(200 颗)', '4 full adders = 4-bit ripple adder (200 tr.)'), 16.4, 3.35, 0, 'g');
addLabel(() => `A = ${bval(bitsA)} (${bin4(bitsA)})`, 21, 1.55, -1.55, 'b', true);
addLabel(() => `B = ${bval(bitsB)} (${bin4(bitsB)})`, 21, 1.55, -2.45, 'b', true);
addLabel(() => reveal() ? `S = ${bval(S)} (${bin4(S)})` : L('S = ?(进位传播中…)', 'S = ?(carry rippling…)'), 21, 1.55, 1.75, 'g', true);
addLabel(() => L('进位链:红热涟漪一级级传递', 'carry chain: red-hot ripple'), 16, 2.58, .95, 'hot');
addLabel(() => 'Cin = 0', 11.62, 2.52, 0);
addLabel(() => 'Cout', 20.35, 2.52, 0);
addLabel(() => L('尺度 ≈ 10 µm', 'scale ≈ 10 µm'), 16.4, 3.95, 0, 'st');

/* ---------------- 三级 zoom 联动光桥 ---------------- */
tube([[X1, 2.3, 0], [-9.5, 3.6, 0], [-4.2, 2.95, 0]], .02, M.beam);
addLabel(() => L('放大 ×10', 'zoom ×10'), -9.3, 3.9, 0, 'st');
tube([[4.9, 2.6, 0], [10, 3.9, 0], [15.2, 3.1, 0]], .02, M.beam);
addLabel(() => L('放大 ×10', 'zoom ×10'), 10, 4.2, 0, 'st');

/* ---------------- 地面 ---------------- */
const floor2 = new THREE.Mesh(new THREE.BoxGeometry(48, .2, 13), M.floor);
floor2.position.set(2, -0.1, -0.2);
scene.add(floor2);

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: 'MOSFET:栅压开闸', be: 'MOSFET: the gate opens',
    d: '栅压超过阈值 Vth≈0.7V 时,电场把电子吸到氧化层下,感应出导电沟道,源→漏导通;撤压沟道消散——一座无机械部件的电控水闸。',
    de: 'Above Vth≈0.7 V the field pulls electrons under the oxide, inducing a channel so source→drain conducts; remove the voltage and it vanishes — an electric valve with no moving parts.' },
  { b: '非门:2 颗管反相', be: 'NOT: 2 transistors invert',
    d: 'PMOS 在上、NMOS 在下:A=1 时下管导通,输出被拉到地(0);A=0 时上管导通,输出接到电源(1)。',
    de: 'PMOS on top, NMOS below: A=1 opens the lower switch and pulls the output to ground (0); A=0 pulls it up to VDD (1).' },
  { b: '与非门:4 颗管', be: 'NAND: 4 transistors',
    d: '两 NMOS 串联到地、两 PMOS 并联到电源:只有 A、B 同为 1,输出才落地为 0。NAND 是万能门——任何逻辑都能用它搭出来。',
    de: 'Two NMOS in series to ground, two PMOS in parallel to VDD: only A=B=1 drives the output to 0. NAND is universal — any logic can be built from it.' },
  { b: '异或门:16 颗管', be: 'XOR: 16 transistors',
    d: '4 个 NAND 级联出 XOR:输入相同出 0、不同出 1——「只相加、不管进位」,正是一位加法的和。',
    de: 'Four NANDs cascaded: equal inputs give 0, different give 1 — add, ignore the carry — exactly the sum bit of 1-bit addition.' },
  { b: '半加器:22 颗管', be: 'Half adder: 22 transistors',
    d: '和 S=A⊕B 交给 XOR,进位 C=A·B 交给 AND——和与进位各就各位,但它还接不住低位送上来的进位。',
    de: 'XOR makes S=A⊕B, AND makes C=A·B — sum and carry in place, but it cannot yet accept a carry-in from the stage below.' },
  { b: '全加器 → 4 位行波:200 颗', be: 'Full adder → 4-bit ripple: 200 tr.',
    d: '两个半加器+或门=全加器(50 颗);4 级串联,进位像涟漪一级级红热传递:5+3=8,最坏 8 级门延迟 ≈80ps——这就是行波的代价。',
    de: 'Two half adders + OR = full adder (50); four stages chained and the carry ripples red-hot stage by stage: 5+3=8, worst case 8 gate delays ≈80 ps — the price of rippling.' },
];
const CAMS = [
  { p: [-14, 3.6, 8.8], t: [-14, 1.2, 0] },
  { p: [-4.2, 3.8, 7.2], t: [-4.2, 1.4, -0.1] },
  { p: [-1.4, 3.9, 7.2], t: [-1.4, 1.4, -0.1] },
  { p: [1.4, 4.0, 7.6], t: [1.4, 1.5, -0.1] },
  { p: [4.2, 4.2, 7.8], t: [4.2, 1.4, 0] },
  { p: [16.4, 6.6, 12.8], t: [16.2, 1.2, -0.3] },
].map(c => ({ p: new THREE.Vector3(...c.p), t: new THREE.Vector3(...c.t) }));
let goalP = CAMS[0].p, goalT = CAMS[0].t, flying = true, lastStep = -1;
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { tSim = i * 6 + 0.01; });
    el.appendChild(li);
  });
  lastStep = -1;
}

/* ================= UI ================= */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
tSim = Math.max(0, qsFloat('t', 0));
let spinOn = qsBool('spin', true), pulseOn = true;
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed'), elSpeedVal = document.getElementById('speedVal');
const elPhase = document.getElementById('phase'), elPhaseVal = document.getElementById('phaseVal');
const tglLabels = document.getElementById('tglLabels'), tglPulse = document.getElementById('tglPulse'), tglRotate = document.getElementById('tglRotate');
const stTr = document.getElementById('stTr'), stDelay = document.getElementById('stDelay'),
  stCalc = document.getElementById('stCalc'), stWave = document.getElementById('stWave');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed;
elSpeedVal.textContent = speed.toFixed(1) + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(1) + '×'; });
elPhase.addEventListener('input', () => { tSim = parseFloat(elPhase.value); });
document.getElementById('btnBeat').addEventListener('click', () => {
  tSim = Math.floor(tSim) + 1;
  if (waveActive) { waveT = Math.min(waveT + 1, 4.61); if (waveT > 4.6) waveActive = false; }
});
document.getElementById('btnWave').addEventListener('click', () => { compute(); refire(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglPulse.addEventListener('change', () => { pulseOn = tglPulse.checked; });
tglRotate.addEventListener('change', () => { spinOn = tglRotate.checked; controls.autoRotate = spinOn && !flying; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = spinOn && !flying;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
/* 点击 A/B 位柱切换输入位 */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let pdPos = null;
renderer.domElement.addEventListener('pointerdown', e => {
  pdPos = [e.clientX, e.clientY];
  if (flying) { flying = false; controls.autoRotate = spinOn; }
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!pdPos) return;
  const dx = e.clientX - pdPos[0], dy = e.clientY - pdPos[1];
  pdPos = null;
  if (dx * dx + dy * dy > 36) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(clickables, false)[0];
  if (hit) { const u = hit.object.userData; u.arr[u.i] ^= 1; compute(); refire(); }
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
const TRN = [1, 2, 4, 16, 22, 200];
const DLY = [
  ['单管开关 ~ps 级', 'single switch ~ps'],
  ['1 级 ≈ 10 ps', '1 ≈ 10 ps'], ['1 级 ≈ 10 ps', '1 ≈ 10 ps'],
  ['3 级 ≈ 30 ps', '3 ≈ 30 ps'], ['3 级 ≈ 30 ps', '3 ≈ 30 ps'],
  ['8 级 ≈ 80 ps', '8 ≈ 80 ps'],
];
function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * 0.8;
  if (playing) tSim += dts;
  GA = Math.floor(tSim) % 2;
  GB = Math.floor(tSim / 2) % 2;
  const k = 1 - Math.exp(-dt * 7);

  /* 步骤推进 → 相机飞镜 */
  const si = Math.floor((tSim % 36) / 6);
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
    goalP = CAMS[si].p; goalT = CAMS[si].t;
    flying = true; controls.autoRotate = false;
    if (si === 5) { compute(); refire(); }
  }

  /* 信号发光(琥珀=1)与进位红热 */
  for (const a of animMats) a.m.emissiveIntensity = lerp(a.m.emissiveIntensity, a.v() ? .95 : .06, k);
  for (const r of redMats) r.m.emissiveIntensity = lerp(r.m.emissiveIntensity, r.v() ? .9 : .05, k);
  for (const p of pulses) {
    p.mesh.visible = pulseOn;
    p.mesh.position.copy(p.curve.getPoint((tSim * 0.5 + p.off) % 1));
    p.mesh.material.opacity = p.v() ? .95 : .12;
  }

  /* MOSFET:沟道与电子流 */
  M.chan.opacity = lerp(M.chan.opacity, GA ? .45 : 0, k);
  for (const e of electrons) {
    if (GA) { e.u += dts * .5; if (e.u > 1) e.u -= 1; }
    else e.u = Math.max(0, e.u - dt * .6);
    e.mesh.position.set(lerp(X1 - 1.5, X1 + 1.5, e.u), lerp(1.05, 1.26, Math.min(1, e.u * 3)) + e.yj * .03, e.zj * .95);
  }

  /* 进位波 */
  if (playing && waveActive) { waveT += dts; if (waveT > 4.61) waveActive = false; }
  for (let i = 0; i < 4; i++) {
    let tg = .06;
    if (C[i + 1] === 1 && waveT > i + 1) tg = .75;
    if (waveActive && waveT > i && waveT <= i + 1) tg = 1.35;
    segM[i].material.emissiveIntensity = lerp(segM[i].material.emissiveIntensity, tg, k);
    shellM[i].emissiveIntensity = lerp(shellM[i].emissiveIntensity, waveActive && Math.floor(waveT) === i ? .55 : .04, k);
    sumM[i].emissiveIntensity = lerp(sumM[i].emissiveIntensity, waveT > i + .7 ? (S[i] ? 1 : .05) : .12, k);
  }
  const hotOn = waveActive && waveT <= 4.05;
  hotS.visible = hotOn; hotL.intensity = hotOn ? 6 : 0;
  if (hotOn) hotS.position.set(11.62 + (clamp(waveT, 0, 4) / 4) * (20.35 - 11.62), 2.15, 0);
  for (const p of pillars) p.mesh.scale.y = lerp(p.mesh.scale.y, p.arr[p.i] ? 1.15 : .45, k);

  /* 动态标签 / 统计 */
  for (const d of dynLabels) d.el.textContent = d.text();
  stTr.textContent = TRN[si] + L(' 颗', ' tr.');
  stDelay.textContent = L(DLY[si][0], DLY[si][1]);
  stCalc.innerHTML = reveal() ? `${bval(bitsA)} + ${bval(bitsB)} = ${bval(S)} <small>${bin4(bitsA)}+${bin4(bitsB)}</small>`
    : `${bval(bitsA)} + ${bval(bitsB)} = ?`;
  stWave.textContent = waveActive ? L(`第 ${Math.min(3, Math.floor(waveT)) + 1} / 4 级`, `stage ${Math.min(3, Math.floor(waveT)) + 1} / 4`) : L('已稳定', 'settled');

  /* 相机飞行 / 轨道 */
  if (flying) {
    const kk = 1 - Math.exp(-dt * 2.6);
    camera.position.lerp(goalP, kk);
    controls.target.lerp(goalT, kk);
    camera.lookAt(controls.target);
    if (camera.position.distanceTo(goalP) < .08) { flying = false; controls.autoRotate = spinOn; }
  } else controls.update();

  if (document.activeElement !== elPhase) elPhase.value = (tSim % 36).toFixed(1);
  elPhaseVal.textContent = L(`${(tSim % 36).toFixed(1)} 拍`, `beat ${(tSim % 36).toFixed(1)}`);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

compute();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
