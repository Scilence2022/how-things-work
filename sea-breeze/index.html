<style>
  :root,:root[data-theme="dark"]{

    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);

  }
  :root[data-theme="light"]{

    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}

  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>

<div id="app"></div>

<div id="title">
  <h1 data-zh="海陆风 · 一天转一圈的大气发动机" data-en="The Sea Breeze · A Daily Atmospheric Engine">海陆风 · 一天转一圈的大气发动机</h1>
  <div class="sub" data-zh="陆地热容小、白天升温快→陆上低压，午后海风推着一条云线登陆；日落后反转成陆风；纬度决定它如何随时间右偏——季风就是放大到季节尺度的海陆风 · 拖时间滑块看风向标全场掉头 · 拖动旋转 / 空格运行/暂停" data-en="Land heats faster than the sea: afternoon pressure gradient drives the sea breeze and its cloud line inland; after sunset it reverses to the land breeze; latitude sets the Coriolis veer — the monsoon is this engine at seasonal scale · drag to orbit / Space = run/pause">陆地热容小、白天升温快→陆上低压，午后海风推着一条云线登陆；日落后反转成陆风；纬度决定它如何随时间右偏——季风就是放大到季节尺度的海陆风 · 拖时间滑块看风向标全场掉头 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 工具与全局 ============ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const QS=new URLSearchParams(location.search);
const htmlEl=document.documentElement,el=id=>document.getElementById(id);
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
let playing=!QS.has('pause'),labelsOn=QS.get('labels')!=='0';
let timeScale=clamp(parseFloat(QS.get('speed'))||1,0.15,2);

/* ============ 模型（垂直剖面，1 格=5 km，域 200 km×~8 km） =
   热力：T_land=18+A·f(t)，f=sin(2π(t−9.5)/24)（14:30 峰值）；
        T_sea=18+0.2·A·f(t−3)（海洋热容大→幅度小、相位滞后）
   流场：单环流圈流函数 ψ=Ψ·sin(π(x−18)/26)·sin(πz/10)，
        强度 s(t) 以 ~30 min 弛豫跟随 ΔT；海风峰值风速≈0.75ΔT m/s
   科里奥利：北半球风向随时间右偏，veer ∝ f·Δt（简化标度）
   锋速 ≈ 0.4×沿岸风速（真实海风锋 2-4 m/s 量级） */
const XC=18,LCELL=26,HCELL=10,X0=3,X1=37;
let tDay=9.2,sLag=0,xf=18.6,stormOn=false,flashT=0,simT=0;
let ampK=7.0,latDeg=35;
const HRS_PER_SEC=1.25;                       // 自动播：每秒 1.25 小时
function fT(t){return Math.sin(2*Math.PI*(t-9.5)/24);}
function dTnow(){const A=ampK;return A*(fT(tDay)-0.2*fT(tDay-3));}
function windMS(x,z){                         // 剖面风场 (m/s)，u 沿 x、w 垂直
  const U0=0.75*sLag*8;                       // sLag∈[-1,1] 归一化环流强度
  const u= U0*Math.sin(Math.PI*(x-XC)/LCELL)*Math.cos(Math.PI*z/HCELL);
  const w=-U0*(HCELL/LCELL)*Math.cos(Math.PI*(x-XC)/LCELL)*Math.sin(Math.PI*z/HCELL);
  return [u,w];
}

/* ============ 渲染基础 ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
el('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,300);
camera.position.set(22,9,30);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(20,3,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=90;
scene.add(new THREE.HemisphereLight(0xcfe0f2,0x202820,0.75));
const sun=new THREE.DirectionalLight(0xfff1d8,1.0);scene.add(sun);
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(1.1,16,12),
  new THREE.MeshBasicMaterial({color:0xffd98a}));
scene.add(sunDisc);

/* ============ 地景：海、陆、滩 ============ */
const seaM=new THREE.MeshStandardMaterial({color:0x1d5e86,roughness:0.25,metalness:0.15});
const landM=new THREE.MeshStandardMaterial({color:0x6a7a44,roughness:1});
const beachM=new THREE.MeshStandardMaterial({color:0xc9b284,roughness:1});
const sea=new THREE.Mesh(new THREE.BoxGeometry(XC,0.2,26),seaM);
sea.position.set(XC/2,-0.1,0);scene.add(sea);
const beach=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.26,26),beachM);
beach.position.set(XC+0.8,-0.13,0);scene.add(beach);
const land=new THREE.Mesh(new THREE.BoxGeometry(X1-XC+4,0.5,26),landM);
land.position.set(XC+(X1-XC+4)/2,-0.25,0);scene.add(land);

/* ============ 示踪粒子（环流圈） ============ */
const PN=320;
const pPos=new Float32Array(PN*3);
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const pMat=new THREE.PointsMaterial({size:0.16,color:0xffd8a8,transparent:true,opacity:0.85,depthWrite:false});
const points=new THREE.Points(pGeo,pMat);points.frustumCulled=false;scene.add(points);
for(let i=0;i<PN;i++){
  pPos[i*3]=X0+Math.random()*(X1-X0);
  pPos[i*3+1]=0.2+Math.random()*8.8;
  pPos[i*3+2]=(Math.random()-0.5)*7;
}

/* ============ 风向标（沿岸+高空） ============ */
const arrows=[];
const arrMat=new THREE.MeshBasicMaterial({color:0xffa94d});
const arrMat2=new THREE.MeshBasicMaterial({color:0x74c0fc});
function mkArrow(mat){
  const g=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1,6),mat);
  shaft.rotation.z=-Math.PI/2;shaft.position.x=0.5;g.add(shaft);
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.42,8),mat);
  head.rotation.z=-Math.PI/2;head.position.x=1.1;g.add(head);
  scene.add(g);return g;
}
for(let i=0;i<7;i++){
  const a=mkArrow(arrMat);a.position.set(5+i*5,0.55,4.2);arrows.push({g:a,aloft:false});
}
for(let i=0;i<3;i++){
  const a=mkArrow(arrMat2);a.position.set(9+i*11,7.6,0);arrows.push({g:a,aloft:true});
}

/* ============ 等温线（5 条，随海陆温差俯仰） ============ */
const isoLines=[];
for(let k=0;k<5;k++){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(41*3),3));
  const col=new THREE.Color().lerpColors(new THREE.Color(0x74c0fc),new THREE.Color(0xff8787),k/4);
  const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.85}));
  line.frustumCulled=false;scene.add(line);
  isoLines.push({line,z0:1.4+k*1.65,amp:0.5+k*0.16});
}
function smooth(x){x=clamp(x,0,1);return x*x*(3-2*x);}

/* ============ 云：海风锋云线 + 积云 + 雷暴 ============ */
const cloudM=new THREE.MeshStandardMaterial({color:0xf4f7fa,roughness:1,transparent:true,opacity:0.94});
const stormM=new THREE.MeshStandardMaterial({color:0x4a5560,roughness:1});
function mkPuff(r){return new THREE.Mesh(new THREE.SphereGeometry(r,10,8),cloudM);}
const frontClouds=new THREE.Group();scene.add(frontClouds);
for(let i=0;i<3;i++){
  const p=mkPuff(0.55+0.12*i);p.position.set((i-1)*0.7,2.3+0.25*i,Math.sin(i*2.1)*1.5);
  frontClouds.add(p);
}
const cumulus=[];
for(let i=0;i<7;i++){
  const g=new THREE.Group();
  g.add(mkPuff(0.5));const p2=mkPuff(0.34);p2.position.set(0.4,0.25,0.2);g.add(p2);
  const p3=mkPuff(0.3);p3.position.set(-0.42,0.2,-0.15);g.add(p3);
  g.visible=false;scene.add(g);cumulus.push(g);
}
/* 雷暴云团 + 闪电 */
const storm=new THREE.Group();storm.visible=false;scene.add(storm);
{
  const base=new THREE.Mesh(new THREE.SphereGeometry(1.5,12,10),stormM);
  base.scale.set(1.5,0.7,1.2);base.position.y=4.6;storm.add(base);
  const tower=new THREE.Mesh(new THREE.ConeGeometry(1.15,3.2,10),stormM);
  tower.position.y=6.4;storm.add(tower);
  const top=new THREE.Mesh(new THREE.SphereGeometry(0.85,10,8),new THREE.MeshStandardMaterial({color:0xd8dee4,roughness:1}));
  top.position.y=8.1;storm.add(top);
}
const boltGeo=new THREE.BufferGeometry();
boltGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(8*3),3));
const bolt=new THREE.Line(boltGeo,new THREE.LineBasicMaterial({color:0xffffff}));
bolt.visible=false;scene.add(bolt);
const boltLight=new THREE.PointLight(0xbfe0ff,0,40);scene.add(boltLight);

/* ============ 标签 ============ */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn,parent){
  const div=document.createElement('div');div.className='lbl '+cls;
  div.textContent=textFn();
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||scene).add(o);
  labelReg.push({o,text:textFn,vis:visFn||(()=>true)});
  return o;
}
const frontPill=addLabel(()=>L('海风锋：推进 & 成云','Sea-breeze front: advancing & clouding'),new THREE.Vector3(20,3.6,0),'o',
  ()=>sLag>0.15);
addLabel(()=>L('陆上受热 → 低压 → 空气上升','Hot land: low pressure, rising air'),new THREE.Vector3(29,9.3,0),'g',
  ()=>dTnow()>1);
addLabel(()=>L('夜间反转：陆风离岸','Night reversal: land breeze offshore'),new THREE.Vector3(29,9.3,0),'b',
  ()=>dTnow()<-0.8);
addLabel(()=>L('海：热容大，几乎恒温','Sea: huge heat capacity, near-constant'),new THREE.Vector3(8,1.6,6),'b');

/* ============ 步骤 ============ */
const STEPS=[
 {zh:'热容差：陆地升温快、海洋几乎恒温——白天陆上变暖出低压',en:'Heat capacity gap: land heats fast, sea stays cool — low pressure over land'},
 {zh:'白天海风：午后冷海风涌向内陆，环流圈整体转起来',en:'Sea breeze: cool air pushes inland each afternoon, one big gyre'},
 {zh:'海风锋：锋线以 2-4 m/s 推进，沿途触发一串积云',en:'The front advances at 2-4 m/s, popping cumulus rows as it goes'},
 {zh:'强对流：温差够大时锋上触发雷暴——看闪电劈下',en:'Deep convection: enough ΔT and the front fires a thunderstorm'},
 {zh:'夜间陆风：日落后温差反号，风向标全场掉头',en:'Land breeze: after sunset the sign flips and every vane turns around'},
 {zh:'科里奥利：纬度越高，海风越随时间向右偏（北半球）',en:'Coriolis: the higher the latitude, the more the breeze veers right'},
 {zh:'家族：山谷风是同构日循环；季风=放大到季节尺度的海陆风',en:'Family: valley winds run the same daily cycle; monsoons are seasonal sea breezes'},
];
let activeStep=0;
function buildSteps(){
  const o=el('steps');o.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();gotoStep(i);});
    o.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));
}
function gotoStep(i){
  playing=true;el('play').textContent=L('暂停','Pause');
  if(i<=2){tDay=10+i*1.8;}
  if(i===3){tDay=14.8;}
  if(i===4){tDay=22.5;}
  if(i===5){tDay=15.2;}
  if(i===6){tDay=15.2;el('sLat').value=55;latDeg=55;el('sLatVal').textContent='55°N';}
  el('sTime').value=tDay;
}

/* ============ 交互 ============ */
el('btnNoon').addEventListener('click',()=>{tDay=12;el('sTime').value=12;});
el('btnNight').addEventListener('click',()=>{tDay=23;el('sTime').value=23;});
el('btnStorm').addEventListener('click',()=>{
  if(dTnow()>5&&sLag>0.3){stormOn=true;flashT=1.6;}
});
el('sTime').addEventListener('input',e=>{tDay=+e.target.value;});
el('sA').addEventListener('input',e=>{ampK=+e.target.value/10;el('sAVal').textContent=ampK.toFixed(1)+' K';});
el('sLat').addEventListener('input',e=>{latDeg=+e.target.value;el('sLatVal').textContent=latDeg+'°N';});
el('sSpd').addEventListener('input',e=>{timeScale=+e.target.value/100;el('sSpdVal').textContent=timeScale.toFixed(1)+'×';});
el('play').addEventListener('click',()=>{playing=!playing;el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');});
el('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
el('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
el('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
el('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();el('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ============ 天空 / 光照 / 主题 ============ */
const skyNight=new THREE.Color(0x0b1020),skyDawn=new THREE.Color(0xcf8a5a),skyDay=new THREE.Color(0x8fc3e8);
function updateSky(){
  const elev=Math.sin(Math.PI*(tDay-6)/13);          // 6h→19h 白昼弧
  const c=new THREE.Color();
  if(elev>0.25)c.lerpColors(skyDawn,skyDay,clamp((elev-0.25)/0.6,0,1));
  else if(elev>-0.15)c.lerpColors(skyNight,skyDawn,clamp((elev+0.15)/0.4,0,1));
  else c.copy(skyNight);
  scene.background=c;
  sun.intensity=clamp(elev,0,1)*1.05+0.06;
  sunDisc.material.color.setHex(elev>0?0xffd98a:0xd8dee9);
  sunDisc.visible=true;
}
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  el('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  updateSky();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(e=>{
    if(e.tagName==='INPUT')return;
    e.textContent=LANG==='en'?(e.dataset.en||e.dataset.zh):e.dataset.zh;
  });
  el('langBtn').textContent=LANG==='en'?'ZH':'EN';
  el('play').textContent=playing?L('暂停','Pause'):L('运行','Run');
  buildSteps();
}

/* ============ 统计 ============ */
function updateStats(){
  const hh=Math.floor(tDay),mm=Math.floor((tDay-hh)*60);
  el('sv0').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  const dT=dTnow();
  el('sv1').innerHTML=(dT>=0?'+':'')+dT.toFixed(1)+'<small> K</small>';
  el('sv1').style.color=dT>0.5?'#ff8787':dT<-0.5?'#74c0fc':'';
  const [u0]=windMS(XC+1,0.3);
  el('sv2').innerHTML=(u0>=0?'+':'')+u0.toFixed(1)+'<small> m/s</small>';
  el('sv3').innerHTML=Math.max(0,(xf-XC)*5).toFixed(0)+'<small> km</small>';
}

/* ============ 每帧更新 ============ */
function updateWorld(dth,dt0,anim){
  const dtA=anim?dt0:0;                        // 暂停时冻结粒子/云/闪电
  /* 太阳位置与光照 */
  const elev=Math.sin(Math.PI*(tDay-6)/13);
  const az=Math.PI*(1-(tDay-6)/13);                // 6h 东 → 19h 西
  const sx=XC+Math.cos(az)*26,sy=clamp(elev,0.02,1)*15+1;
  sunDisc.position.set(sx,sy,-14);
  sun.position.set(sx,sy,6);
  updateSky();
  /* 环流强度弛豫（~30 min） */
  const sT=clamp(dTnow()/8,-1,1);
  sLag+=(sT-sLag)*clamp(dth*2.0,0,1);
  /* 海风锋推进：锋速≈0.4×沿岸风速 */
  const [uf0]=windMS(clamp(xf,X0+2,X1-2),0.3);
  xf=clamp(xf+uf0*0.4*3.6/5*dth,18.4,34);
  frontClouds.position.set(xf,0,0);
  frontClouds.visible=sLag>0.15;
  frontPill.position.set(xf,3.7,0);
  frontPill.visible=labelsOn&&sLag>0.15;
  /* 风向标 */
  const veer=clamp((tDay-9.5)*6,0,80)*(Math.sin(latDeg*Math.PI/180)/0.643)*Math.PI/180*(sLag>0?1:0);
  const night=sLag<0;
  for(const a of arrows){
    const [u]=a.aloft?windMS(a.g.position.x,7.6):windMS(a.g.position.x,0.3);
    const mag=clamp(Math.abs(u)/6,0.15,1.4);
    a.g.scale.set(mag,mag,mag);
    let yaw;
    if(a.aloft)yaw=(u>=0?0:Math.PI)-veer;           // 高空回流
    else yaw=(u>=0?-veer:Math.PI+veer);
    a.g.rotation.y=yaw;
  }
  /* 等温线俯仰 */
  const S=clamp(dTnow()/ampK,-0.6,1);
  for(const iso of isoLines){
    const p=iso.line.geometry.attributes.position.array;
    for(let i=0;i<=40;i++){
      const x=X0+i*(X1-X0)/40;
      const lift=iso.amp*smooth((x-14)/8)*S*1.3;
      p[i*3]=x;p[i*3+1]=iso.z0+lift;p[i*3+2]=-6.5;
    }
    iso.line.geometry.attributes.position.needsUpdate=true;
  }
  /* 粒子随环流输运（可视化放大：风 m/s → 格/s） */
  for(let i=0;i<PN;i++){
    const i3=i*3;
    let [u,w]=windMS(pPos[i3],pPos[i3+1]);
    pPos[i3]+=(u/5000)*2200*dtA;
    pPos[i3+1]+=(w/800)*300*dtA;
    pPos[i3+2]+=Math.sin(simT*0.8+i)*0.004;
    if(pPos[i3]<X0)pPos[i3]=X1;if(pPos[i3]>X1)pPos[i3]=X0;
    if(pPos[i3+1]<0.15)pPos[i3+1]=0.15;if(pPos[i3+1]>9.6)pPos[i3+1]=9.6;
  }
  pGeo.attributes.position.needsUpdate=true;
  /* 积云：陆上上升区成云，随风漂移 */
  for(const c of cumulus){
    if(!c.visible&&anim&&sLag>0.35&&Math.random()<dth*6){
      c.position.set(XC+3+Math.random()*(X1-XC-6),3.1,Math.random()*10-5);
      c.userData.vx=0;c.visible=true;
    }
    if(c.visible){
      const [u]=windMS(c.position.x,3.1);
      c.position.x=clamp(c.position.x+u*0.4*3.6/5*dth,XC-2,X1);
      if(sLag<0.2)c.visible=false;
    }
  }
  /* 雷暴与闪电 */
  if(stormOn){
    storm.visible=true;
    storm.position.set(xf,0,0);
    if(flashT>0){
      flashT-=dtA;
      bolt.visible=Math.random()<0.35;
      if(bolt.visible){
        const p=bolt.geometry.attributes.position.array;
        let bx=xf;
        for(let k=0;k<8;k++){p[k*3]=bx;p[k*3+1]=4.2-k*0.6;p[k*3+2]=(Math.random()-0.5)*0.6;bx+=(Math.random()-0.5)*0.5;}
        bolt.geometry.attributes.position.needsUpdate=true;
      }
      boltLight.intensity=bolt.visible?60:8;
      boltLight.position.set(xf,3,2);
    }else{bolt.visible=false;boltLight.intensity=0;stormOn=dTnow()>4&&sLag>0.25;}
  }else{storm.visible=false;bolt.visible=false;boltLight.intensity=0;}
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  simT+=dt0;
  if(playing){
    const dth=dt0*timeScale*HRS_PER_SEC;
    tDay=(tDay+dth)%24;
    el('sTime').value=tDay;
    updateWorld(dth,dt0,true);
  }else{
    updateWorld(0,0,false);                    // 暂停也响应时间滑块拖动
  }
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  frontPill.visible=labelsOn&&sLag>0.15;
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

applyTheme();applyLang();buildSteps();
el('tglLabels').checked=labelsOn;
el('sSpd').value=timeScale*100;el('sSpdVal').textContent=timeScale.toFixed(1)+'×';
updateWorld(0.2,0.05,true);
updateStats();start();
</script>
</body>
