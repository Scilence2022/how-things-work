<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日内瓦机构 —— 连续旋转如何变成精确间歇 3D 动画</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#e63946;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --pill-border:rgba(255,255,255,.16); --btn2:rgba(255,255,255,.10);
    --cv-bg:#10141b; --cv-grid:#232b35; --cv-axis:#39424f;
    --cv-cursor:#ffffff; --cv-dim:#8b96a5; --cv-dim2:#97a1af;
    --cv-text:#dfe7f0; --cv-pill:rgba(12,16,23,.78);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#c22b38;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --pill-border:rgba(15,25,40,.18); --btn2:rgba(15,25,40,.08);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.16); --cv-axis:rgba(20,35,55,.42);
    --cv-cursor:#33414f; --cv-dim:#7d8b9b; --cv-dim2:#5f6f80;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

  .lbl { background: var(--cv-pill); border: 1px solid var(--pill-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  :root[data-theme="light"] .lbl { text-shadow: none; box-shadow: 0 1px 5px rgba(30,45,70,.12); }
  .lbl.red    { border-color: rgba(230,57,70,.85);  color: #ffb3b9; }
  .lbl.yellow { border-color: rgba(245,184,51,.85); color: #ffe1a3; }
  .lbl.cyan   { border-color: rgba(120,200,255,.85); color: #bfe6ff; }
  :root[data-theme="light"] .lbl.red    { border-color: rgba(194,43,56,.8);  color: #b3242f; }
  :root[data-theme="light"] .lbl.yellow { border-color: rgba(160,106,16,.75); color: #8a5d0d; }
  :root[data-theme="light"] .lbl.cyan   { border-color: rgba(23,94,143,.6);  color: #175e8f; }

  /* ===== 工具条（全站共享模式） ===== */
  #tools { position: fixed; top: 18px; right: 488px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none; }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  :root[data-theme="light"] #title h1, :root[data-theme="light"] #title .sub { text-shadow: 0 1px 4px rgba(255,255,255,.6); }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 348px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); }
  #legend { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.red    { color: #ff9aa1; border-color: rgba(230,57,70,.7); }
  .chip.yellow { color: #ffd98a; border-color: rgba(245,184,51,.7); }
  .chip.blue   { color: #d9b96a; border-color: rgba(217,169,65,.7); }
  .chip.gray   { color: #b7c0cc; border-color: rgba(151,161,175,.55); }
  :root[data-theme="light"] .chip.red    { color: #c22b38; border-color: rgba(194,43,56,.65); }
  :root[data-theme="light"] .chip.yellow { color: #9c6b0e; border-color: rgba(156,107,14,.6); }
  :root[data-theme="light"] .chip.blue   { color: #7a5c14; border-color: rgba(122,92,20,.6); }
  :root[data-theme="light"] .chip.gray   { color: #5b6b7d; border-color: rgba(91,107,125,.55); }

  #slotRow { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
  #slotRow > span { font-size: 12px; color: var(--text2); flex: 0 0 auto; }
  .slotBtn { flex: 1; padding: 6px 0; font-size: 12.5px; border-radius: 9px; cursor: pointer;
    background: var(--hover); color: var(--text3); border: 1px solid var(--pill-border); }
  .slotBtn:hover { background: var(--btn2); }
  .slotBtn.on { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }

  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(230,57,70,.12); border-color: rgba(230,57,70,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }

  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 30px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 38px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 760px) { #panel { width: calc(100vw - 36px); } #title h1 { font-size: 16px; } }

  #chart { position: fixed; top: 18px; right: 18px; z-index: 5; width: 452px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 12px 14px 10px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); }
  #chartHead { display: flex; justify-content: space-between; align-items: baseline;
    gap: 8px; margin-bottom: 6px; }
  #chartHead .ct { font-size: 13px; font-weight: 600; color: var(--text3); }
  #chartHead .cv { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums;
    white-space: nowrap; }
  #chartSvg { display: block; width: 100%; }
  #chartFoot { display: flex; justify-content: flex-end; margin-top: 4px; }
  #chartFoot label { font-size: 12px; color: var(--text2); display: flex; gap: 5px;
    align-items: center; cursor: pointer; }
  #chartFoot input { accent-color: #3f7dff; }
  @media (max-width: 1180px) { #chart { width: 360px; } #tools { right: 396px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

</div>

<div id="title">

    <span class="chip yellow" data-zh="锁定弧（凸）" data-en="Lock arc (convex)">锁定弧（凸）</span>
    <span class="chip blue" data-zh="从动轮 · 凹弧座" data-en="Wheel · concave seats">从动轮 · 凹弧座</span>

    <div class="row"><label data-zh="相位" data-en="Phase">相位</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="val" id="scrubVal">0%</span></div>

</div>

<div id="chart">
  <div id="chartHead">
    <span class="ct" data-zh="从动轮转位曲线 θ(δ) —— 间歇运动的“展开图”" data-en="Wheel index curve θ(δ) — intermittent motion unrolled">从动轮转位曲线 θ(δ) —— 间歇运动的“展开图”</span>

  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数（调试/截图用） ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};
let threeScene = null;   // 场景创建后回填，applyTheme 用 PAL.bg 作 WebGL 清屏色

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  if (threeScene) threeScene.background = new THREE.Color(PAL.bg);
  if (scanLine) {                     // SVG 图表颜色在构建时固化 → 换主题后按新 PAL 重绘
    buildChart();
    if (velOn) {
      velPath.setAttribute('visibility', 'visible');
      velZero.setAttribute('visibility', 'visible');
    }
  }
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('日内瓦机构 —— 连续旋转如何变成精确间歇 3D 动画',
                     'Geneva Drive · From Continuous Rotation to Precise Intermittent Motion (3D)');
  buildSteps();
  setPlayLabel();
  syncChartTexts();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 常量与几何参数 ----------------
   标准设计：圆销回转半径 R = 主动轮锁定盘半径；中心距 C = R / sin(π/n)
   （销到达槽口时曲柄恰好垂直于槽中线 → 沿径向入槽、无干涉）；
   转位期主动轮转角 2α = 180° − 360°/n，其余时间为停歇。 */
const D2R = Math.PI / 180;
const R = 1.0;
const SLOT_W = 0.15;
const CYCLE_SECONDS = 10.0;

let nSlots = qs.get('slots') === '4' ? 4 : 6;
let P = null;

function computeParams(n) {
  const C = R / Math.sin(Math.PI / n);
  const Rg = C * Math.cos(Math.PI / n);
  const alphaDeg = 90 - 180 / n;
  const Rlock = n === 4 ? 0.7 : 1.0;      // 4 槽时锁定盘缩小，避免凹弧座吞掉整个轮体
  const rho = Rlock + 0.05;               // 凹弧座半径（0.05 配合间隙）
  const rApex = C - R - 0.03;             // 槽底（销最近点 + 余量）
  const disc = rho * rho - (R - SLOT_W / 2) ** 2;
  const wallJ = disc > 0 ? Rg - Math.sqrt(disc) : Rg;   // 槽壁与凹弧交点的向径
  const swallow = disc > 0 && wallJ < Rg - 0.02;        // 凹弧是否吞掉槽口外圆（6 槽吞、4 槽不吞）
  return { n, C, Rg, alphaDeg, Rlock, rho, rApex, rBot: rApex + SLOT_W / 2, wallJ, swallow,
    holeR: Math.max(0.16, rApex - 0.12) };
}

/* 转位函数：主动轮转角 δ(°) → 从动轮已转位数 U(0..1)。
   销在槽内时槽方位角 ψ(θ)=atan2(R·sinθ, R·cosθ−C)（θ 为销相对连心线的角），
   入口/出口处速度比恰为 0，加减速连续、无速度突变。 */
let psi0 = 0;
function mBranch(x) { return x <= Math.PI / 2 ? x + 2 * Math.PI : x; }  // ψ 取值约束到 (π/2, 3π/2]
function rebuildPsi0() {
  const a = -P.alphaDeg * D2R;
  psi0 = mBranch(Math.atan2(R * Math.sin(a), R * Math.cos(a) - P.C));
}
function Uof(deg) {
  const tau = deg - (180 - P.alphaDeg);
  const e = Math.floor(tau / 360);
  const th = (tau - e * 360 - P.alphaDeg) * D2R;      // θ ∈ [−α, 360−α)
  let h;
  if (th <= P.alphaDeg * D2R + 1e-9) {                // 槽内：销拨动，U 随 ψ 从 0 → −1 个槽距
    const psi = mBranch(Math.atan2(R * Math.sin(th), R * Math.cos(th) - P.C));
    h = (psi - psi0) / (2 * Math.PI / P.n);
  } else h = -1;                                      // 停歇
  return e - h;
}
function Uperiodic(deg) {   // 周期延拓（供数值微分；U(δ+360) = U(δ)+1）
  const k = Math.floor(deg / 360);
  return Uof(deg - k * 360) + k;
}

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
threeScene = scene;
scene.background = new THREE.Color(PAL.bg || '#000000');

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.0, 1.15, 6.3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.0, 0.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 16;
controls.maxPolarAngle = 1.62;
controls.autoRotateSpeed = 0.7;

/* ---------------- 灯光 ---------------- */
scene.add(new THREE.HemisphereLight(0x9db4d6, 0x35322c, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4.5, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5; key.shadow.camera.right = 7;
key.shadow.camera.top = 5;  key.shadow.camera.bottom = -5;
key.shadow.camera.far = 25;
key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

/* ---------------- 材质 ---------------- */
const M = {
  steel:  new THREE.MeshStandardMaterial({ color: 0xc9ced6, metalness: 0.9,  roughness: 0.32 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x525a66, metalness: 0.75, roughness: 0.45 }),
  brass:  new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 0.82, roughness: 0.36 }),
  plate:  new THREE.MeshStandardMaterial({ color: 0x9aa3b0, metalness: 0.85, roughness: 0.4 }),
  pinRed: new THREE.MeshStandardMaterial({ color: 0xe63946, emissive: 0xe63946,
            emissiveIntensity: 0.55, roughness: 0.4 }),

const driverGrp = new THREE.Group();

let driverMesh = null;
function buildDriver() {
  if (driverMesh) { driverMesh.geometry.dispose(); driverGrp.remove(driverMesh); }
  const rl = P.Rlock;
  const e = 0.72 * rl, rhoc = 1.18 * rl;          // 让位月牙槽：圆心偏距与半径（随锁定盘缩放，张角≈170°）
  const cosd = (R * R + e * e - rhoc * rhoc) / (2 * R * e);
  const dlt = Math.acos(Math.min(1, Math.max(-1, cosd)));   // 与销轴圆的交点角（实体弧的缺角）
  const pts = [];
  const N1 = 56, N2 = 40;
  for (let i = 0; i <= N1; i++) {                 // 锁定盘实体外圆弧：经 0°（面向从动轮一侧，停歇时嵌入凹弧座）
    const a = dlt + (2 * Math.PI - 2 * dlt) * i / N1;
    pts.push(new THREE.Vector2(R * Math.cos(a), -R * Math.sin(a)));
  }
  const a0 = Math.atan2(-R * Math.sin(dlt), R * Math.cos(dlt) - e);   // 让位缺口始终背向凹弧座接触区
  const sweep = 2 * Math.abs(a0) - 2 * Math.PI;
  for (let i = 0; i <= N2; i++) {
    const aa = a0 + sweep * i / N2;
    pts.push(new THREE.Vector2(e + rhoc * Math.cos(aa), -rhoc * Math.sin(aa)));
  }
  if (THREE.ShapeUtils.isClockWise(pts)) pts.reverse();
  const g = new THREE.ExtrudeGeometry(new THREE.Shape(pts), { depth: 0.14, bevelEnabled: false });
  g.translate(0, 0, -0.09);                       // 板厚 z ∈ [−0.09, 0.05]
  driverMesh = new THREE.Mesh(g, M.plate);
  driverMesh.castShadow = true;
  driverGrp.add(driverMesh);
}

const wheelGrp = new THREE.Group();
scene.add(wheelGrp);
let wheelMesh = null;
function wheelOutlinePoints(p) {
  const n = p.n, C = p.C, Rg = p.Rg, off = SLOT_W / 2;
  const pts = [];
  const N_BOT = 8, N_RIM = 8, N_SCOOP = 22;
  const gammaQ = j => (j + 0.5) * 2 * Math.PI / n;
  const scoopPt = (gamma, gq) => {   // 凹弧（圆心在距轮心 C、方向 gq 处）上极角 γ 处的点
    const d = gamma - gq;
    const s = C * Math.cos(d) - Math.sqrt(Math.max(1e-6, p.rho * p.rho - (C * Math.sin(d)) ** 2));
    return new THREE.Vector2(Math.cos(gamma) * s, Math.sin(gamma) * s);
  };
  for (let j = 0; j < n; j++) {
    const th = j * 2 * Math.PI / n;
    const ux = Math.cos(th), uy = Math.sin(th), nx = -uy, ny = ux;
    for (let k = 0; k <= N_BOT; k++) {           // 槽底半圆（−侧 → +侧）
      const a = th + Math.PI + (Math.PI / 2 - Math.PI * k / N_BOT);
      pts.push(new THREE.Vector2(ux * p.rBot + Math.cos(a) * off, uy * p.rBot + Math.sin(a) * off));
    }
    const wallTop = p.swallow ? p.wallJ : Rg;
    pts.push(new THREE.Vector2(ux * wallTop + nx * off, uy * wallTop + ny * off));   // 槽壁上行
    if (p.swallow) {                             // 凹弧直接衔接两侧槽壁（6 槽）
      const dg = Math.atan2(off, p.wallJ);
      const ga = th + dg, gb = th + 2 * Math.PI / n - dg, gq = gammaQ(j);
      for (let k = 1; k <= N_SCOOP; k++) pts.push(scoopPt(ga + (gb - ga) * k / N_SCOOP, gq));
    } else {                                     // 外圆弧 → 凹弧 → 外圆弧（4 槽：槽口间留外圆段）
      const mouth = Math.asin(off / Rg);
      const gcross = Math.acos(Math.min(1, (Rg * Rg + C * C - p.rho * p.rho) / (2 * Rg * C)));
      const g1 = gammaQ(j) - gcross, g2 = gammaQ(j) + gcross, gq = gammaQ(j);
      for (let k = 1; k < N_RIM; k++) {
        const g = th + mouth + (g1 - th - mouth) * k / N_RIM;
        pts.push(new THREE.Vector2(Math.cos(g) * Rg, Math.sin(g) * Rg));
      }
      for (let k = 0; k <= N_SCOOP; k++) pts.push(scoopPt(g1 + (g2 - g1) * k / N_SCOOP, gq));
      for (let k = 1; k < N_RIM; k++) {
        const g = g2 + (th + 2 * Math.PI / n - mouth - g2) * k / N_RIM;
        pts.push(new THREE.Vector2(Math.cos(g) * Rg, Math.sin(g) * Rg));
      }
    }
    const t2 = (j + 1) * 2 * Math.PI / n;        // 下一槽 −侧槽壁下行至槽底
    const ux2 = Math.cos(t2), uy2 = Math.sin(t2), nx2 = -uy2, ny2 = ux2;
    pts.push(new THREE.Vector2(ux2 * p.rBot - nx2 * off, uy2 * p.rBot - ny2 * off));
  }
  return pts;
}
function buildWheel() {
  for (const c of [...wheelGrp.children]) { wheelGrp.remove(c); c.geometry?.dispose?.(); }
  const pts = wheelOutlinePoints(P);
  if (THREE.ShapeUtils.isClockWise(pts)) pts.reverse();
  const shape = new THREE.Shape(pts);
  const hole = [];
  for (let i = 40; i >= 0; i--) {
    const a = i / 40 * Math.PI * 2;
    hole.push(new THREE.Vector2(Math.cos(a) * P.holeR, Math.sin(a) * P.holeR));
  }
  shape.holes.push(new THREE.Path(hole));
  const g = new THREE.ExtrudeGeometry(shape, { depth: 0.08, bevelEnabled: false });
  g.translate(0, 0, -0.08);                      // 板厚 z ∈ [−0.08, 0]
  wheelMesh = new THREE.Mesh(g, M.brass);
  wheelMesh.castShadow = true;
  wheelGrp.add(wheelMesh);
  const hubR = Math.max(0.1, P.holeR - 0.05);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(hubR, hubR, 0.16, 24), M.dark);
  hub.rotation.x = Math.PI / 2;
  wheelGrp.add(hub);
  for (let k = 0; k < P.n; k++) {                // 辐条（放在两槽之间）
    const a = (k + 0.5) * 2 * Math.PI / P.n;
    const len = P.holeR + 0.08;
    const sp = new THREE.Mesh(new THREE.BoxGeometry(len, 0.09, 0.06), M.dark);
    sp.position.set(Math.cos(a) * len / 2, Math.sin(a) * len / 2, 0);
    sp.rotation.z = a;
    wheelGrp.add(sp);
  }
}

const CW = 420, CH = 250, ML = 48, MR = 12, MT = 30, MB = 30;

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('chartSvg');

function el(tag, at, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in at) e.setAttribute(k, at[k]);
  parent.appendChild(e);
  return e;
}
let scanLine, movDot, velPath, velZero;
let chartT1 = null, chartT2 = null, chartT3 = null, chartXL = null;
const X = a => ML + a / 360 * PW;
const Yof = s => MT + PH - s / (360 / P.n) * PH;

function buildChart() {
  svg.replaceChildren();
  const pitch = 360 / P.n;
  const Y = Yof;
  const defs = el('defs', {});
  const clip = el('clipPath', { id: 'plotClip' }, defs);
  el('rect', { x: ML, y: MT, width: PW, height: PH }, clip);
  const dA = 180 - P.alphaDeg, dB = 180 + P.alphaDeg;
  el('rect', { x: X(0), y: MT, width: X(dA) - X(0), height: PH, fill: PAL.dim2, opacity: 0.09 });
  el('rect', { x: X(dA), y: MT, width: X(dB) - X(dA), height: PH, fill: '#ef4550', opacity: 0.1 });
  el('rect', { x: X(dB), y: MT, width: X(360) - X(dB), height: PH, fill: PAL.dim2, opacity: 0.09 });
  const t1 = el('text', { x: (X(0) + X(dA)) / 2, y: MT - 8, fill: PAL.dim2, 'font-size': 10.5, 'text-anchor': 'middle' });
  t1.textContent = L('停歇（锁定）', 'Dwell (locked)');
  const t2 = el('text', { x: (X(dA) + X(dB)) / 2, y: MT - 8, fill: '#ef4550', 'font-size': 10.5, 'text-anchor': 'middle' });
  t2.textContent = L(`转位 ${pitch}°`, `Index ${pitch}°`);
  const t3 = el('text', { x: (X(dB) + X(360)) / 2, y: MT - 8, fill: PAL.dim2, 'font-size': 10.5, 'text-anchor': 'middle' });
  t3.textContent = L('停歇（锁定）', 'Dwell (locked)');
  chartT1 = t1; chartT2 = t2; chartT3 = t3;
  for (const sv of [pitch / 2, pitch]) {
    el('line', { x1: ML, x2: ML + PW, y1: Y(sv), y2: Y(sv), stroke: PAL.grid, 'stroke-width': 1 });
    const t = el('text', { x: ML - 6, y: Y(sv) + 3.5, fill: PAL.dim, 'font-size': 10, 'text-anchor': 'end' });
    t.textContent = sv + '°';
  }
  for (const av of [0, 90, 180, 270, 360]) {
    el('line', { x1: X(av), x2: X(av), y1: Y(0), y2: Y(0) + 4, stroke: PAL.axis });
    const t = el('text', { x: X(av), y: Y(0) + 15, fill: PAL.dim, 'font-size': 10, 'text-anchor': 'middle' });
    t.textContent = av;
  }
  el('line', { x1: ML, x2: ML + PW, y1: Y(0), y2: Y(0), stroke: PAL.axis, 'stroke-width': 1.2 });
  el('line', { x1: ML, x2: ML, y1: MT, y2: Y(0), stroke: PAL.axis, 'stroke-width': 1.2 });
  const yl = el('text', { x: 8, y: MT + 4, fill: PAL.dim2, 'font-size': 11 });
  yl.textContent = 'θ';
  const xl = el('text', { x: ML + PW - 4, y: Y(0) + 27, fill: PAL.dim2, 'font-size': 11, 'text-anchor': 'end' });
  xl.textContent = L('δ(°) 主动轮转角', 'δ(°) driver angle');
  chartXL = xl;
  velZero = el('line', { x1: ML, x2: ML + PW, y1: Y(0), y2: Y(0), stroke: PAL.axis,
    'stroke-width': 1, 'stroke-dasharray': '2 3', visibility: 'hidden' });
  velPath = el('path', { fill: 'none', stroke: '#8fe3c8', 'stroke-width': 1.4,
    'stroke-dasharray': '5 4', 'clip-path': 'url(#plotClip)', visibility: 'hidden' });
  let d = '';
  for (let i = 0; i <= 360; i++) {
    d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(Uof(i) * pitch).toFixed(1);
  }
  el('path', { d, fill: 'none', stroke: PAL.text, 'stroke-width': 2.6, 'stroke-linejoin': 'round' });
  let vmax = 1e-9;
  const vs = [];
  for (let a = 0; a <= 360; a++) {
    const h = 0.25;
    const v = (Uperiodic(a + h) - Uperiodic(a - h)) / (2 * h);
    vs.push(v); vmax = Math.max(vmax, v);
  }
  let dv = '';
  vs.forEach((v, i) => {
    const y = Y(0) - v / vmax * PH * 0.45;
    dv += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + y.toFixed(1);
  });
  velPath.setAttribute('d', dv);
  scanLine = el('line', { x1: ML, x2: ML, y1: MT, y2: Y(0), stroke: PAL.cursor, opacity: 0.32, 'stroke-width': 1 });
  movDot = el('circle', { cx: ML, cy: Y(0), r: 4.2, fill: PAL.cursor, stroke: '#ef4550', 'stroke-width': 2 });
}

  lblSlot.position.set(P.rBot + 0.16, 0.1, 0.16);
  lblScoop.position.set(Math.cos(Math.PI / P.n) * (P.C - P.rho - 0.05), Math.sin(Math.PI / P.n) * (P.C - P.rho - 0.05) + 0.08, 0.16);
  lblLockArc.position.set(Math.cos(55 * D2R) * (P.Rlock + 0.18), -Math.sin(55 * D2R) * (P.Rlock + 0.18), 0.2);
  controls.target.set(P.C / 2, 0.05, 0);
  buildChart();
  if (velOn) {
    velPath.setAttribute('visibility', 'visible');
    velZero.setAttribute('visibility', 'visible');
  }
}

if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
if (!qsBool('frame', true)) { tglFrame.checked = false; tglFrame.dispatchEvent(new Event('change')); }
if (!lockOn) { tglLock.checked = false; }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
if (qs.get('front') === '1') {   // 调试机位：正对机构平面，核对销与槽的贴合
  camera.position.set(1, 0.05, 7.6);
  controls.target.set(1, 0.05, 0);
}
if (velOn) { tglVel.checked = true; tglVel.dispatchEvent(new Event('change')); }

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 每帧更新 ---------------- */
function updateWorld(tFrac) {
  const deg = tFrac * 360;
  driverGrp.rotation.z = deg * D2R;                          // 主动轮逆时针匀速
  const U = Uof(deg);
  wheelGrp.rotation.z = Math.PI / P.n - U * 2 * Math.PI / P.n; // 从动轮反向转位（半槽距偏置使销对准直槽）
  const tau = deg - (180 - P.alphaDeg);
  const th = ((tau % 360) + 360) % 360 - P.alphaDeg;
  const engaged = th <= P.alphaDeg + 1e-9;
  lockGlow.visible = lockOn && !engaged;                     // 停歇期锁定弧贴合 → 高亮接触区
  const h = 0.25;
  const ratio = (Uperiodic(deg + h) - Uperiodic(deg - h)) / (2 * h) * (360 / P.n);
  const x = X(deg), y = Yof(U * (360 / P.n));
  scanLine.setAttribute('x1', x); scanLine.setAttribute('x2', x);
  movDot.setAttribute('cx', x); movDot.setAttribute('cy', y);
  chartVal.textContent =
    `δ = ${deg.toFixed(0)}° · ${L('已转位', 'indexed')} ${(U * 360 / P.n).toFixed(1)}°/${(360 / P.n).toFixed(0)}° · ${L('ω从/ω主', 'ωout/ωin')} ${engaged ? ratio.toFixed(2) : '0.00'}`;
}

const clock = new THREE.Clock();
let lastStep = -1;
function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing) cycles += dt * speed / CYCLE_SECONDS;
  const t = cycles - Math.floor(cycles);

  updateWorld(t);

  const si = stepIndex(t);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t * 1000);
  elScrubVal.textContent = Math.round(t * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* ---------------- 启动 ---------------- */
applyTheme();                        // 先填充 PAL，供 buildChart / scene.background 取色
setSlots(nSlots);
updateWorld(cycles - Math.floor(cycles));
applyLang();
requestAnimationFrame(frame);
</script>
</body>
</html>
