<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>内共生与细胞器起源 · 演化史上最成功的一次并购</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#ffa94d;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#e8590c;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.v{border-color:rgba(177,151,252,.9);color:#e5daff}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.v{color:#6741d9}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 8px;font-size:12px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(255,169,77,.6);background:rgba(255,169,77,.12);color:var(--text)}
  .abtn.branch.on{border-color:rgba(177,151,252,.6);background:rgba(177,151,252,.14)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(232,89,12,.55);background:rgba(232,89,12,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(255,169,77,.10);border-color:rgba(255,169,77,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(232,89,12,.08);border-color:rgba(232,89,12,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#ffe0c2}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>

<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="内共生与细胞器起源" data-en="Endosymbiosis & the Origin of Organelles">内共生与细胞器起源</h1>
  <div class="sub" data-zh="看一场约 20 亿年的慢放并购:古菌吞下细菌却没消化,细菌交出 ATP(或糖)换来庇护;随后基因组一格格迁入细胞核,共生体缩小成线粒体/叶绿体——双层膜、环状 DNA、70S 核糖体、二分裂,四条证据链都指向细菌出身 · 切线粒体/叶绿体分支,拖时间轴快进 · 拖动旋转 / 空格运行/暂停" data-en="A ~2-billion-year slow-motion merger: an archaeon swallowed a bacterium and failed to digest it; the bacterium traded ATP (or sugar) for shelter; then its genes slipped one by one into the host nucleus and the symbiont shrank into a mitochondrion / chloroplast — double membrane, circular DNA, 70S ribosomes, binary fission: every clue points back to bacteria · switch the mito/chloro branch, fast-forward the timeline · drag to orbit / Space = run/pause">看一场约 20 亿年的慢放并购:古菌吞下细菌却没消化,细菌交出 ATP(或糖)换来庇护;随后基因组一格格迁入细胞核,共生体缩小成线粒体/叶绿体——双层膜、环状 DNA、70S 核糖体、二分裂,四条证据链都指向细菌出身 · 切线粒体/叶绿体分支,拖时间轴快进 · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 生物学锚点:α-变形菌祖先基因组 ~4.5 Mb → 人线粒体 DNA 16.6 kb(保留 <0.4%);
   蓝细菌 ~3.2 Mb → 陆生植物叶绿体 ~150 kb(~5%);线粒体出现 ~18–20 亿年前,
   叶绿体(初级内共生)~15 亿年前;证据:双层膜/环状 DNA/70S 核糖体/二分裂/F1F0-ATP 合酶 */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
const easeOut=p=>1-Math.pow(1-p,3);
const easeIO=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;
const qs=new URLSearchParams(location.search);
let playing=qs.get('pause')!=='1';
let labelsOn=qs.get('labels')!=='0';
const speedMul=clamp(parseFloat(qs.get('speed'))||1,0.25,3);

/* ---- 渲染器 ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,20,60);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(-0.4,1.6,11.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-0.6,0.2,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=42;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(5,8,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-7,5,-5);scene.add(fill);

/* ---- 材质 ---- */
const floorM=new THREE.MeshStandardMaterial({color:0x171b22,roughness:0.96});
const hostMemM=new THREE.MeshStandardMaterial({color:0x7fb2e8,transparent:true,opacity:0.15,roughness:0.2,side:THREE.DoubleSide});
const cytoM=new THREE.MeshStandardMaterial({color:0x2c4a66,transparent:true,opacity:0.28,roughness:0.4});
const nucM=new THREE.MeshStandardMaterial({color:0x8a79d9,transparent:true,opacity:0.55,roughness:0.35});
const nucEnvM=new THREE.MeshStandardMaterial({color:0xa99ae8,transparent:true,opacity:0.2,roughness:0.2,side:THREE.DoubleSide});
const bactM=new THREE.MeshStandardMaterial({color:0xb06ad4,roughness:0.35,emissive:0x4a1a66,emissiveIntensity:0.5});
const vesM=new THREE.MeshStandardMaterial({color:0x7fb2e8,transparent:true,opacity:0.12,roughness:0.2,side:THREE.DoubleSide});
const dnaM=new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0x996b00,emissiveIntensity:0.7,roughness:0.3});
const geneM=new THREE.MeshBasicMaterial({color:0xffe08a});
const atpM=new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:0.9});
const nutM=new THREE.MeshBasicMaterial({color:0x8ce99a,transparent:true,opacity:0.85});
const riboM=new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0xa34e00,emissiveIntensity:0.5,roughness:0.4});
const cristaM=new THREE.MeshStandardMaterial({color:0x63e6be,emissive:0x0c6b52,emissiveIntensity:0.5,roughness:0.35});
const thylaM=new THREE.MeshStandardMaterial({color:0x69db7c,emissive:0x2b8a3e,emissiveIntensity:0.45,roughness:0.35});
const flagM=new THREE.MeshStandardMaterial({color:0xe5dbff,roughness:0.4,transparent:true,opacity:0.8});

/* ---- 海床(原初海洋) ---- */
const floor=new THREE.Mesh(new THREE.CylinderGeometry(17,17,0.16,48),floorM);
floor.position.y=-4.0;scene.add(floor);

/* ---- 宿主古菌 ---- */
const HOSTP=v3(-1.5,0,0);
const hostG=new THREE.Group();hostG.position.copy(HOSTP);scene.add(hostG);
hostG.add(new THREE.Mesh(new THREE.SphereGeometry(2.6,40,30),hostMemM));
hostG.add(new THREE.Mesh(new THREE.SphereGeometry(2.42,36,26),cytoM));
const nuc=new THREE.Group();nuc.position.set(-0.7,0.3,0.25);hostG.add(nuc);
nuc.add(new THREE.Mesh(new THREE.SphereGeometry(0.86,28,20),nucM));
nuc.add(new THREE.Mesh(new THREE.SphereGeometry(0.95,28,20),nucEnvM));

/* ---- 内共生体(细菌 ×4,其中 3 个为分裂副本) ---- */
function makeBact(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.34,0.55,6,18),bactM);
  body.rotation.z=Math.PI/2;g.add(body);
  const dna=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.028,8,24),dnaM);
  dna.rotation.x=Math.PI/2;dna.position.y=0.06;g.add(dna);
  for(let i=0;i<8;i++){
    const r=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6),riboM);
    const a=i/8*Math.PI*2;
    r.position.set(Math.cos(a)*0.28,0.1,Math.sin(a)*0.22);g.add(r);
  }
  const flag=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.7,8),flagM);
  flag.rotation.z=Math.PI/2;flag.position.x=-0.85;g.add(flag);
  g.userData={dna,flag};
  return g;
}
const b0=makeBact();scene.add(b0);
const copies=[1,2,3].map(()=>{const g=makeBact();g.visible=false;scene.add(g);return g;});
const COPYOFF=[v3(-0.5,-0.3,0.35),v3(0.5,0.35,-0.25),v3(-0.15,0.5,-0.45)];
const INTERIOR=v3(-0.25,0.1,0);
const swimStart=v3(4.6,1.3,0);
const membraneP=v3(1.15,0.45,0);

/* ---- 双层膜泡(吞噬泡 → 细胞器外膜) ---- */
const vesG=new THREE.Group();scene.add(vesG);
vesG.add(new THREE.Mesh(new THREE.SphereGeometry(0.72,22,16),vesM));
vesG.add(new THREE.Mesh(new THREE.SphereGeometry(0.56,20,14),vesM));
vesG.scale.setScalar(0.001);vesG.visible=false;

/* ---- 细胞器内部构造(收编后出现) ---- */
const mitoIn=new THREE.Group();
for(let i=0;i<3;i++){
  const c=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.045,8,20),cristaM);
  c.rotation.set(Math.PI/2,0,i*0.8);c.position.set(-0.1+i*0.1,0,0);
  c.scale.set(0.8,0.5,0.8);mitoIn.add(c);
}
const chlIn=new THREE.Group();
for(let i=0;i<3;i++){
  const d=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.035,20),thylaM);
  d.position.set(0.05,-0.1+i*0.09,0);chlIn.add(d);
}
mitoIn.visible=chlIn.visible=false;mitoIn.scale.setScalar(0.001);chlIn.scale.setScalar(0.001);
b0.add(mitoIn,chlIn);

/* ---- 基因迁移粒子 / ATP 与养分流 ---- */
const GENES=14;
const geneIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),geneM,GENES);
scene.add(geneIM);
const ATPN=12,NUTN=8;
const atpIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,8,6),atpM,ATPN);
const nutIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.045,8,6),nutM,NUTN);
scene.add(atpIM,nutIM);
const atpP=[],nutP=[];
for(let i=0;i<ATPN;i++)atpP.push({t:Math.random(),a:Math.random()*Math.PI*2,r:0.6+Math.random()*0.5});
for(let i=0;i<NUTN;i++)nutP.push({t:Math.random(),a:Math.random()*Math.PI*2,r:1.6+Math.random()*0.7});
const ZERO=new THREE.Matrix4().makeScale(0,0,0);
[geneIM,atpIM,nutIM].forEach(im=>{for(let i=0;i<im.count;i++)im.setMatrixAt(i,ZERO);im.instanceMatrix.needsUpdate=true;});

/* ---- 状态(先于所有闭包引用声明,防 TDZ) ---- */
let phase=0,phaseT=0,branch='mito',speedK=1,maNow=2000,retention=100,symCount=1;
let notifyT=0,notifyZ='',notifyE='';

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true,parent=scene){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);parent.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('宿主古菌:大的吞噬者(ASK 形祖先)','Host archaeon: the big devourer'),v3(-1.5,3.1,0),'b');
addLabel(()=>branch==='mito'?L('α-变形菌:需氧异养,会氧化底物','α-proteobacterium: aerobic heterotroph')
                            :L('蓝细菌:产氧光合','Cyanobacterium: oxygenic photosynthesis'),
  v3(2.2,2.2,0),'v',()=>phase===0);
addLabel(()=>L('吞噬泡未消化 → 双层膜:内膜=细菌膜,外膜=宿主泡膜','Undigested vacuole → double membrane: inner=bacterial OM, outer=host vacuole'),
  v3(0.4,-1.9,0),'b',()=>phase>=1);
addLabel(()=>L('环状 DNA(拟核)','Circular DNA (nucleoid)'),v3(-0.25,1.15,0),'o',()=>phase>=2&&phase<=4);
addLabel(()=>L('70S 核糖体','70S ribosomes'),v3(0.9,0.85,0),'o',()=>phase>=2&&phase<=4);
addLabel(()=>L('二分裂:随宿主代代相传','Binary fission: inherited every generation'),v3(-0.25,-1.2,0),'g',()=>phase>=3);
addLabel(()=>L('基因一格格迁入细胞核','genes migrate into the nucleus'),v3(-1.0,1.9,0),'r',()=>phase===4);
addLabel(()=>branch==='mito'?L('线粒体:氧化磷酸化,供应细胞大部分 ATP','Mitochondrion: oxidative phosphorylation, most cellular ATP')
                            :L('叶绿体:光合膜固定 CO₂,产出糖与 O₂','Chloroplast: photosynthetic membranes fix CO₂ into sugar + O₂'),
  v3(0.2,2.9,0),'g',()=>phase>=5);
const lblNotify=addLabel(()=>notifyT>0?L(notifyZ,notifyE):'',v3(0,4.4,0),'o');

/* ---- 状态机 ---- */
const PHASE_ZH=['相遇','吞噬','共生','折半增殖','基因内迁','收编成器','证据清单'];
const PHASE_EN=['Encounter','Engulfment','Symbiosis','Binary fission','Gene transfer','Organelle made','Evidence'];
const PHASE_DUR=[3.2,4.0,3.2,3.2,4.6,3.4,4.0];
const CUM=[];{let s=0;for(const d of PHASE_DUR){CUM.push(s);s+=d;}const TOTAL=s;}
function notify(zh,en){notifyT=3.4;notifyZ=zh;notifyE=en;}
function setPhase(i){
  phase=i;phaseT=0;
  if(i===0){
    b0.visible=true;b0.position.copy(swimStart);b0.scale.setScalar(1);
    copies.forEach(c=>c.visible=false);
    vesG.visible=false;vesG.scale.setScalar(0.001);
    mitoIn.visible=chlIn.visible=false;mitoIn.scale.setScalar(0.001);chlIn.scale.setScalar(0.001);
  }
  syncSteps();
}
function applyBranch(){
  document.getElementById('btnMito').classList.toggle('on',branch==='mito');
  document.getElementById('btnChl').classList.toggle('on',branch==='chloro');
  const dark=THEME==='dark';
  if(branch==='mito'){
    bactM.color.setHex(dark?0xb06ad4:0x9c4ec4);bactM.emissive.setHex(0x4a1a66);
    mitoIn.visible=phase>=5;chlIn.visible=false;
  }else{
    bactM.color.setHex(dark?0x58c472:0x2f9e44);bactM.emissive.setHex(0x1d5c2c);
    chlIn.visible=phase>=5;mitoIn.visible=false;
  }
}

/* ---- 相位驱动 ---- */
function updatePhase(dt0,dt){
  const t=phaseT;
  /* 细菌运动 */
  let bpos;
  if(phase===0){
    const p=easeIO(clamp(t/3.0,0,1));
    bpos=swimStart.clone().lerp(membraneP,p);
    b0.rotation.y=Math.sin(t*3)*0.18;
  }else if(phase===1){
    const p=easeIO(clamp(t/3.4,0,1));
    bpos=membraneP.clone().lerp(INTERIOR,p);
    b0.rotation.y=0;
    vesG.visible=true;
    vesG.scale.setScalar(0.001+easeOut(clamp(t/2.2,0,1))*0.999);
    vesG.position.copy(bpos);
  }else{
    bpos=INTERIOR.clone().add(v3(Math.sin(t*0.9)*0.05,Math.cos(t*1.1)*0.04,0));
    if(phase<5){vesG.visible=true;vesG.scale.setScalar(1);vesG.position.copy(bpos);}
  }
  b0.position.copy(bpos);
  const shrink=phase>=5?0.62:1;
  b0.scale.setScalar(b0.scale.x+((phase>=5?0.62:1)-b0.scale.x)*Math.min(1,dt0*4));
  vesG.scale.setScalar(phase>=5?0.62:vesG.scale.x);
  if(phase===5&&vesG.scale.x<0.63)vesG.scale.setScalar(0.62);
  /* 鞭毛摆动 */
  if(b0.userData.flag)b0.userData.flag.rotation.y+=dt*10;
  /* 分裂 */
  let cnt=1;
  if(phase>=3&&phase<5){
    cnt=clamp(1+Math.floor(t/0.9),1,4);
    copies.forEach((c,i)=>{
      c.visible=i<cnt-1;
      if(c.visible){
        c.position.copy(INTERIOR).add(COPYOFF[i]);
        c.scale.setScalar(Math.min(1,(t-i*0.9)/0.4));
      }
    });
  }else if(phase>=5){
    copies.forEach(c=>{c.scale.setScalar(c.scale.x*(1-Math.min(1,dt0*5)));if(c.scale.x<0.05)c.visible=false;});
    cnt=1;
  }
  symCount=cnt;
  /* 细胞器内部构造 */
  if(phase>=5){
    const inn=branch==='mito'?mitoIn:chlIn;
    inn.visible=true;
    inn.scale.setScalar(Math.min(1,inn.scale.x+dt0*2));
  }
  /* 基因迁移 */
  let prog=0;
  if(phase===4){
    let sum=0;
    for(let i=0;i<GENES;i++){
      const gp=easeIO(clamp(t*2.6-i*0.26,0,1));sum+=gp;
      if(gp<1){
        const from=v3(bpos.x-0.05,bpos.y+0.12,0);
        const to=v3(-0.7,0.3,0.25);
        const m=new THREE.Matrix4().setPosition(from.lerp(to,gp));
        geneIM.setMatrixAt(i,m);
      }else geneIM.setMatrixAt(i,ZERO);
    }
    geneIM.instanceMatrix.needsUpdate=true;
    prog=sum/GENES;
    const endRet=branch==='mito'?0.4:4.7;
    retention=100-(100-endRet)*prog;
  }else{
    for(let i=0;i<GENES;i++)geneIM.setMatrixAt(i,ZERO);
    geneIM.instanceMatrix.needsUpdate=true;
    retention=phase<4?100:(branch==='mito'?0.4:4.7);
  }
  /* ATP / 养分交换 */
  const trade=(phase>=2&&phase<6&&!branchHide());
  for(let i=0;i<ATPN;i++){
    if(!trade){atpIM.setMatrixAt(i,ZERO);continue;}
    const p=atpP[i];p.t+=dt*1.1;if(p.t>1)p.t=0;
    const from=bpos.clone(),to=v3(Math.cos(p.a)*1.7,Math.sin(p.a)*1.4,Math.sin(p.a*1.7)*1.0);
    const m=new THREE.Matrix4().setPosition(from.lerp(to,p.t));
    atpIM.setMatrixAt(i,m);
  }
  for(let i=0;i<NUTN;i++){
    if(!trade){nutIM.setMatrixAt(i,ZERO);continue;}
    const p=nutP[i];p.t+=dt*0.9;if(p.t>1)p.t=0;
    const from=v3(Math.cos(p.a)*2.3,Math.sin(p.a)*2.0,Math.sin(p.a*2.1)*1.2),to=bpos.clone();
    const m=new THREE.Matrix4().setPosition(from.lerp(to,p.t));
    nutIM.setMatrixAt(i,m);
  }
  atpIM.instanceMatrix.needsUpdate=true;nutIM.instanceMatrix.needsUpdate=true;
  /* 时间轴 */
  const total=PHASE_DUR.reduce((a,b)=>a+b,0);
  let cum=0;for(let i=0;i<phase;i++)cum+=PHASE_DUR[i];
  const elapsed=cum+Math.min(phaseT,PHASE_DUR[phase]);
  const startMa=branch==='mito'?2000:1600;
  maNow=startMa-elapsed/total*450;
}
function branchHide(){return false;}
function resetTrade(){/* 保留接口 */}

/* ---- 主题 / 语言 ---- */
function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  floorM.color.setHex(dark?0x171b22:0xcdc6ba);
  hostMemM.color.setHex(dark?0x7fb2e8:0x4a90c9);
  cytoM.color.setHex(dark?0x2c4a66:0x9cc0dd);
  applyBranch();
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  document.title=L('内共生与细胞器起源 · 演化史上最成功的一次并购','Endosymbiosis · evolution\'s most successful merger');
  buildSteps();setPlayLabel();updateStats();
}

/* ---- 讲解步骤 ---- */
const STEPS=[
  {zh:'相遇:古菌猎到 α-变形菌(或蓝细菌),本想当一顿饭',en:'Encounter: the archaeon catches an α-proteobacterium (or cyanobacterium) — intended as dinner'},
  {zh:'吞噬:膜内陷包裹却没消化,细菌留在双层膜泡里活了下来',en:'Engulfment: the vacuole fails to digest — the bacterium survives inside a double-membrane vesicle'},
  {zh:'共生:细菌交出 ATP(或糖),宿主供给庇护与底物,谁也离不开谁',en:'Symbiosis: the bacterium hands over ATP (or sugar); the host pays in shelter and substrate'},
  {zh:'折半增殖:内共生体二分裂,随宿主代代相传——单亲继承,谱系可追',en:'Binary fission: the symbiont divides and is inherited every generation — a traceable lineage'},
  {zh:'基因内迁:基因组一格格搬进细胞核,只留 0.4%(叶绿体约 5%)',en:'Gene transfer: the genome migrates bit by bit into the nucleus, keeping 0.4% (chloroplasts ~5%)'},
  {zh:'收编成器:体积缩到祖先的百分之一量级,成了线粒体/叶绿体',en:'Assimilation: shrunk to ~1/100th of the ancestor\'s size — a mitochondrion / chloroplast'},
  {zh:'证据链:双层膜、环状 DNA、70S 核糖体、二分裂——条条指向细菌出身',en:'Evidence: double membrane, circular DNA, 70S ribosomes, binary fission — all bacterial fingerprints'},
];
const EVMAP=[1,2,2,3,4];
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>setPhase(i));
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===phase));
  const on=[phase>=1,phase>=2,phase>=2,phase>=3,phase>=4];
  for(let i=0;i<5;i++)document.getElementById('ev'+i).classList.toggle('on',on[i]);
}

/* ---- 统计 ---- */
function updateStats(){
  document.getElementById('stMa').innerHTML=Math.round(maNow)+'<small> Ma</small>';
  document.getElementById('stGen').innerHTML=(retention<1?retention.toFixed(1):retention.toFixed(0))+'<small> %</small>';
  document.getElementById('stCnt').textContent=symCount;
  const o=document.getElementById('stOut');
  if(phase>=5){
    o.textContent=branch==='mito'?L('ATP','ATP'):L('糖+O₂','sugar+O₂');o.className='v ok';
  }else if(phase>=2){o.textContent=branch==='mito'?L('ATP↑','ATP↑'):L('糖↑','sugar↑');o.className='v';}
  else{o.textContent='—';o.className='v';}
}

/* ---- UI ---- */
function setPlayLabel(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('btnMito').addEventListener('click',()=>{branch='mito';setPhase(0);applyBranch();});
document.getElementById('btnChl').addEventListener('click',()=>{branch='chloro';setPhase(0);applyBranch();});
document.getElementById('btnReplay').addEventListener('click',()=>setPhase(0));
for(let i=0;i<5;i++){
  document.getElementById('ev'+i).addEventListener('click',()=>{
    setPhase(EVMAP[i]);
    const msgs=[
      ['双层膜:内膜是原细菌的膜,外膜来自吞噬泡','Double membrane: the inner one was the bacterium\'s, the outer the vacuole\'s'],
      ['环状 DNA:无组蛋白、像细菌拟核,不与核基因组重组','Circular DNA: histone-free, bacterial-style, never recombines with the nucleus'],
      ['70S 核糖体:抗生素(氯霉素等)只打它,不打 80S','70S ribosomes: chloramphenicol hits them, not the host 80S'],
      ['二分裂:像细菌一样一分为二,单亲遗传','Binary fission: splits like a bacterium, inherited from one parent'],
      ['基因内迁:大部分基因已搬进细胞核,印迹犹在','Gene transfer: most genes already moved to the nucleus — the trail is still there'],
    ];
    notify(msgs[i][0],msgs[i][1]);
  });
}
document.getElementById('sSpd').addEventListener('input',e=>{
  speedK=+e.target.value/100;
  document.getElementById('sSpdVal').textContent=speedK.toFixed(1)+'×';
});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;setPlayLabel();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

/* ---- 主循环 ---- */
const clock=new THREE.Clock();
let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt0=clamp(clock.getDelta(),0,0.05);
  const dt=playing?dt0*speedK*speedMul:0;
  if(playing){
    phaseT+=dt;
    if(phaseT>=PHASE_DUR[phase]){
      phaseT=0;phase=(phase+1)%7;
      if(phase===0)setPhase(0);
      syncSteps();
    }
  }
  if(notifyT>0)notifyT-=dt0;
  updatePhase(dt0,dt);
  acc+=dt0;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){
    const t=r.text();const on=labelsOn&&r.vis()&&t!=='';
    r.o.visible=on;if(on)r.o.element.textContent=t;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
document.getElementById('tglLabels').checked=labelsOn;
b0.position.copy(swimStart);
applyTheme();applyLang();setPlayLabel();
start();
</script>
