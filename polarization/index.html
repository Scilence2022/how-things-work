<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>偏振 · 光是横波,栅栏只放一边</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#91a7ff;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#5c7cfa;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.b { border-color: rgba(145,167,255,.9); color: #d5dcff; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.bad { border-color: rgba(255,93,93,.9); color: #ffc2c2; font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.b { border-color: rgba(92,124,250,.9); color: #5c7cfa; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.b { color: #91a7ff; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.b { color: #d5dcff; border-color: rgba(145,167,255,.7); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(145,167,255,.10); border-color: rgba(145,167,255,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(92,124,250,.08); border-color: rgba(92,124,250,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #d5dcff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="偏振：光是横波，栅栏只放一边" data-en="Polarization: light is transverse">偏振：光是横波，栅栏只放一边</h1>
  <div class="sub" data-zh="E 矢量只在垂直于传播的平面内振动;偏振片像一条栅栏只放行一个方向;检偏镜转 θ,光强按 cos²θ 衰减——正交即黑屏 · 空格播放/暂停" data-en="E oscillates only perpendicular to travel; a polarizer is a fence passing one direction; rotate the analyzer and intensity falls as cos²θ — crossed means black · Space = play/pause">E 矢量只在垂直于传播的平面内振动;偏振片像一条栅栏只放行一个方向;检偏镜转 θ,光强按 cos²θ 衰减——正交即黑屏 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="检偏角 θ" data-en="analyzer angle θ">检偏角 θ</span><span class="v b" id="stA">—</span>
  <span class="k" data-zh="透过光强 cos²θ" data-en="intensity cos²θ">透过光强 cos²θ</span><span class="v b" id="stI">—</span>
  <span class="k" data-zh="振幅 cosθ" data-en="amplitude cosθ">振幅 cosθ</span><span class="v" id="stAmp">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip b" data-zh="E 矢量(垂直于传播)" data-en="E vector (⊥ travel)">E 矢量(垂直于传播)</span>
  </div>
  <div class="row"><label data-zh="检偏角 θ" data-en="analyzer θ">检偏角 θ</label><input id="ang" type="range" min="0" max="90" step="3" value="30"><span class="val" id="angVal">30°</span></div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../double-slit/" data-zh="干涉:光的波动性铁证" data-en="interference: wave evidence">干涉:光的波动性铁证</a>
    <a href="../em-wave/" data-zh="电磁波:E⊥B⊥传播(规划中)" data-en="EM waves (planned)">电磁波:E⊥B⊥传播(规划中)</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('偏振 · 光是横波', 'Polarization · light is transverse');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.6, 2.8, 8.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.8, 1.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(4, 8, 6);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  ring: mat(0x39424f, { roughness: 0.7 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x91a7ff, transparent: true, opacity: 0.22, roughness: 0.1 }),
  gridBar: mat(0x91a7ff, { metalness: 0.3, roughness: 0.4 }),
  eVec: new THREE.MeshBasicMaterial({ color: 0xc3d0ff }),
  wave: new THREE.MeshBasicMaterial({ color: 0x91a7ff, transparent: true, opacity: 0.8 }),
  glow: new THREE.MeshBasicMaterial({ color: 0xc3d0ff, transparent: true, opacity: 0.0, depthWrite: false }),
};

/* ================= 布局:x 向右传播;偏振片 x=1.2(轴竖直 z);检偏片 x=3.4(轴可转) ================= */
const H = 1.3;
const X_P1 = 1.2, X_P2 = 3.4, X_DET = 4.9;
const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.16, 3.2), M.floor);
floor.position.set(2, -0.7, 0);
scene.add(floor);
function polarizer(x, axisAngle) {
  const g = new THREE.Group();
  g.position.set(x, H, 0);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.05, 40), M.glass);
  disc.rotation.z = Math.PI / 2;
  g.add(disc);
  /* 栅栏条(轴方向) */
  const bars = new THREE.Group();
  for (let i = -2; i <= 2; i++) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.2, 0.05), M.gridBar);
    bar.position.z = i * 0.22;
    bars.add(bar);
  }
  g.add(bars);
  g.rotation.x = axisAngle;
  scene.add(g);
  return { g, bars };
}
const pol1 = polarizer(X_P1, 0);            // 轴 = 竖直(y)
const pol2 = polarizer(X_P2, 0);            // 检偏:旋转的是 bars 绕 x? 轴向取 z-y 平面内角
const detector = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.08, 32), M.glow);
detector.rotation.z = Math.PI / 2;
detector.position.set(X_DET, H, 0);
scene.add(detector);

/* E 波可视化:三段(源→P1,P1→P2,P2→探测器) */
function makeETrail(n, material) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const l = new THREE.Line(g, material);
  scene.add(l);
  return { g, n };
}
const seg1 = makeETrail(90, new THREE.LineBasicMaterial({ color: 0x91a7ff, transparent: true, opacity: 0.55 }));
const seg2 = makeETrail(90, new THREE.LineBasicMaterial({ color: 0x91a7ff, transparent: true, opacity: 0.75 }));
const seg3 = makeETrail(90, new THREE.LineBasicMaterial({ color: 0xc3d0ff, transparent: true, opacity: 0.75 }));

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let theta = 30 * Math.PI / 180;      // 检偏角
let tSim = 0;
const OMEGA = 5.0, K = 4.2;

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblP1 = addLabel(() => L('起偏器:轴竖直,只放竖直分量', 'polarizer: vertical axis'), new THREE.Vector3(X_P1, H + 1.2, 0), 'b', pol1.g);
const lblP2 = addLabel(() => L(`检偏器:轴转 θ = ${Math.round(theta * 180 / Math.PI)}°`, `analyzer: θ = ${Math.round(theta * 180 / Math.PI)}°`),
  new THREE.Vector3(X_P2, H + 1.2, 0), 'b', pol2.g);
const lblStatus = addLabel(() => Math.abs(theta - Math.PI / 2) < 0.03
  ? L('正交:两栅栏互相垂直 → 全黑!', 'crossed: fences perpendicular → black!')
  : L('马吕斯定律:I = I₀·cos²θ(振幅只留 cosθ)', "Malus: I = I₀·cos²θ (amplitude keeps cosθ)"),
  new THREE.Vector3(2, -0.35, 0), Math.abs(theta - Math.PI / 2) < 0.03 ? 'bad' : 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: 'E 矢量:垂直于传播', be: 'E is perpendicular to travel',
    d: '光的电场只在垂直于传播方向的平面里振动——这是「横波」的铁证,声波(纵波)玩不了偏振。',
    de: 'The electric field oscillates perpendicular to travel — proof light is transverse; sound (longitudinal) cannot polarize.',
    act: () => { theta = 30 * Math.PI / 180; document.getElementById('ang').value = 30; document.getElementById('angVal').textContent = '30°'; } },
  { b: '起偏器:一条栅栏', be: 'The polarizer: a fence',
    d: '偏振片只放行沿自己轴的分量:自然光穿过它,一半被吃掉,剩下的全都排成同一方向——线偏振光。',
    de: 'The polarizer passes only its axis component: natural light comes out linearly polarized, half as bright.',
    act: () => { theta = 30 * Math.PI / 180; document.getElementById('ang').value = 30; document.getElementById('angVal').textContent = '30°'; } },
  { b: '马吕斯定律 cos²θ', be: "Malus's law: cos²θ",
    d: '检偏器转 θ 角:通过的振幅只剩 cosθ,光强按 cos²θ 衰减——拖滑块到 60°,只剩四分之一亮度。',
    de: 'Analyzer at θ: amplitude keeps cosθ, intensity falls as cos²θ — at 60° only a quarter remains.',
    act: () => { theta = 60 * Math.PI / 180; document.getElementById('ang').value = 60; document.getElementById('angVal').textContent = '60°'; } },
  { b: '正交:全黑', be: 'Crossed: black',
    d: 'θ = 90°:两个栅栏互相垂直,第一片放行的方向恰好被第二片全拦——屏幕全黑,光去哪了?变成检偏器的热。',
    de: 'At θ = 90° the fences are perpendicular — total black. Where did the light go? Into the analyzer as heat.',
    act: () => { theta = 90 * Math.PI / 180; document.getElementById('ang').value = 90; document.getElementById('angVal').textContent = '90°'; } },
  { b: '生活中的偏振', be: 'Polarization around you',
    d: '墨镜压掉水面反光、相机 CPL 滤镜、LCD 每个像素 = 一对偏振片 + 液晶旋光、3D 眼镜左右两套轴向——栅栏无处不在。',
    de: 'Glare-cutting sunglasses, CPL filters, every LCD pixel (polarizer pair + liquid crystal twist), 3D glasses — fences everywhere.',
    act: () => { theta = 45 * Math.PI / 180; document.getElementById('ang').value = 45; document.getElementById('angVal').textContent = '45°'; } },
];
function stepIndex() {
  if (Math.abs(theta - Math.PI / 2) < 0.03) return 3;
  if (theta > 0.9) return 2;
  return 1;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elAng = document.getElementById('ang');
const elAngVal = document.getElementById('angVal');
const tglLabels = document.getElementById('tglLabels');
const tglRotate = document.getElementById('tglRotate');
const stA = document.getElementById('stA'), stI = document.getElementById('stI'),
  stAmp = document.getElementById('stAmp');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elAng.addEventListener('input', () => {
  theta = parseInt(elAng.value, 10) * Math.PI / 180;
  elAngVal.textContent = elAng.value + '°';
});
elSpd.value = speed;
elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
/* 画一段正弦:E 方向由向量 dir(单位,位于 y-z 平面)与幅值 amp 决定 */
function drawSeg(seg, x0, x1, dirY, dirZ, amp, phase) {
  const pos = seg.g.attributes.position;
  for (let i = 0; i < seg.n; i++) {
    const t = i / (seg.n - 1);
    const x = lerp(x0, x1, t);
    const e = amp * Math.sin((x - x0) * K - tSim * OMEGA + phase);
    pos.setXYZ(i, x, H + e * dirY, e * dirZ);
  }
  pos.needsUpdate = true;
}
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed;
  if (playing) tSim += dts;
  const cosT = Math.cos(theta);
  const amp2 = Math.abs(cosT);          // 检偏后振幅

  /* 检偏片栅栏旋转(轴在 y-z 平面转 θ) */
  pol2.g.rotation.x = theta;
  pol1.g.rotation.x = 0;

  /* 三段波形 */
  /* 段1(源→起偏):两分量都在(画 45° 合成的圆偏示意:实际用 y 与 z 双分量) */
  {
    const pos = seg1.g.attributes.position;
    for (let i = 0; i < seg1.n; i++) {
      const t = i / (seg1.n - 1);
      const x = lerp(0, X_P1, t);
      const e = 0.3 * Math.sin((x) * K - tSim * OMEGA);
      const e2 = 0.3 * Math.sin((x) * K - tSim * OMEGA + Math.PI / 2);
      pos.setXYZ(i, x, H + e, e2);
    }
    pos.needsUpdate = true;
  }
  /* 段2(起偏→检偏):轴竖直(y) */
  drawSeg(seg2, X_P1, X_P2, 1, 0, 0.3, 0);
  /* 段3(检偏→探测器):轴转 θ,幅 cosθ */
  drawSeg(seg3, X_P2, X_DET, Math.cos(theta), Math.sin(theta), 0.3 * amp2, 0);

  /* 探测器亮度 */
  const inten = cosT * cosT;
  M.glow.opacity = inten * 0.85;

  stA.textContent = Math.round(theta * 180 / Math.PI) + '°';
  stI.innerHTML = (inten * 100).toFixed(0) + '<small> %</small>';
  stAmp.innerHTML = amp2.toFixed(2) + '<small> ×</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
