<style>

  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;

    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);

  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }

</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,0.1,600);
camera.position.set(-4,10.5,30);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-6,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=80;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x14161c,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,0.85);key.position.set(-14,16,18);scene.add(key);

/* ── 状态 ── 场景尺度:1 AU = 22 单位,太阳在 x=-20 */
let mode='cl',LAU=1,lgE=0.78,playing=true,labelsOn=true,slowMo=false,beamOn=true;
let simT=0,arrivedE=0,arrivedX=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const SUN_X=-20,AU=22;
const DET_OFF=[new THREE.Vector3(-0.3,0.15,-3.8),new THREE.Vector3(-0.3,2.6,0),new THREE.Vector3(-0.3,0.15,3.8)];
/* 振荡:低能真空平均 P=1−½sin²2θ₁₂=0.578;高能 MSW 绝热 P=sin²θ₁₂=0.304 */
function PEE(){return 0.578-0.274*smooth((lgE-0.26)/0.55);}
function curE(){return Math.pow(10,lgE);}
function detRatio(){
  const P=PEE();
  if(mode==='cl')return P;                       /* 氯只对 ν_e 敏感 */
  if(mode==='h2o')return P+0.21*(1-P);           /* 弹性散射对 ν_μ,τ 有 ~21% 交叉截面 */
  return 1.0;                                    /* SNO NC 计全部味 */
}

/* ── 星空 ── */
const NS=800;
const starM=new THREE.MeshBasicMaterial({color:0xffffff});
const stars=new THREE.InstancedMesh(new THREE.SphereGeometry(1,4,3),starM,NS);
{
  const m=new THREE.Matrix4(),q=new THREE.Quaternion();
  for(let i=0;i<NS;i++){
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=180+Math.random()*160;
    m.compose(new THREE.Vector3(r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph)),
      q,new THREE.Vector3().setScalar(0.14+Math.random()*0.3));
    stars.setMatrixAt(i,m);
  }
  stars.instanceMatrix.needsUpdate=true;
}
scene.add(stars);

/* ── 太阳:本体+核心+光晕 ── */
const sunM=new THREE.MeshStandardMaterial({color:0xff8a2a,emissive:0xff9a3c,emissiveIntensity:1.1,roughness:0.6});
const sun=new THREE.Mesh(new THREE.SphereGeometry(3.6,48,32),sunM);
sun.position.x=SUN_X;scene.add(sun);
const core=new THREE.Mesh(new THREE.SphereGeometry(1.6,32,24),
  new THREE.MeshBasicMaterial({color:0xfff3c4}));
core.position.x=SUN_X;scene.add(core);
const sunGlowCv=document.createElement('canvas');sunGlowCv.width=sunGlowCv.height=256;
{
  const g=sunGlowCv.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(255,190,90,.9)');gr.addColorStop(.35,'rgba(255,140,40,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
}
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sunGlowCv),
  blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.85}));
sunGlow.position.x=SUN_X;sunGlow.scale.setScalar(13);scene.add(sunGlow);

/* ── 光路虚线 ── */
const beamGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(SUN_X+3.6,0,0),new THREE.Vector3(SUN_X+AU,0,0)]);
const beamLine=new THREE.Line(beamGeo,new THREE.LineDashedMaterial({color:0x5f7186,dashSize:0.6,gapSize:0.45,transparent:true,opacity:0.5}));
beamLine.computeLineDistances();scene.add(beamLine);

/* ── 地球 + 三台探测器 ── */
const earthG=new THREE.Group();earthG.position.x=SUN_X+AU;scene.add(earthG);
const earthM=new THREE.MeshStandardMaterial({color:0x3e6f9e,roughness:0.7});
const earth=new THREE.Mesh(new THREE.SphereGeometry(0.85,36,24),earthM);earthG.add(earth);
const tankM=new THREE.MeshStandardMaterial({color:0x8a94a4,roughness:0.5,metalness:0.4,transparent:true});
const rockM=new THREE.MeshStandardMaterial({color:0x4a4038,roughness:0.95});
/* Cl:霍姆斯泰克 —— 矿井里的 615 t 四氯乙烯罐 */
const clG=new THREE.Group();clG.position.copy(DET_OFF[0]);earthG.add(clG);
const clRock=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.7,1.5),rockM);clRock.position.y=-0.75;clG.add(clRock);
const clTank=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,1.1,18),tankM);clG.add(clTank);
/* H2O:超级神冈 —— 5 万吨纯水切伦科夫罐 */
const skG=new THREE.Group();skG.position.copy(DET_OFF[2]);earthG.add(skG);
const skTank=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,1.2,18),
  new THREE.MeshStandardMaterial({color:0x3d7fbf,roughness:0.35,transparent:true}));skG.add(skTank);
/* D2O:SNO —— 1000 t 重水,Acrylic 球 */
const snG=new THREE.Group();snG.position.copy(DET_OFF[1]);earthG.add(snG);
const snBall=new THREE.Mesh(new THREE.SphereGeometry(0.62,28,20),
  new THREE.MeshStandardMaterial({color:0x9ad1ff,roughness:0.25,transparent:true,opacity:0.85}));snG.add(snBall);
const detGs=[clG,skG,snG];
/* 计数闪光环 */
const flashRings=[];
detGs.forEach(g=>{
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.85,0.05,8,32),
    new THREE.MeshBasicMaterial({color:0x38d9a9,transparent:true,opacity:0}));
  ring.rotation.y=Math.PI/2;g.add(ring);flashRings.push(ring);
});

/* ── 中微子粒子束 ── */
const PN=170;
const FLAV_COL=[new THREE.Color(0x69db7c),new THREE.Color(0x4dabf7),new THREE.Color(0xb197fc)];
const pMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(0.1,7,6),
  new THREE.MeshBasicMaterial({transparent:true,opacity:0.95}),PN);
pMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(pMesh);
const parts=[];
function setupPart(pt,fresh){
  const d=(Math.random()*3)|0;
  pt.d=d;
  const jit=0.28;
  const tgt=new THREE.Vector3(
    earthG.position.x+DET_OFF[d].x+(Math.random()-0.5)*jit,
    DET_OFF[d].y+(Math.random()-0.5)*jit,
    DET_OFF[d].z+(Math.random()-0.5)*jit);
  pt.start=new THREE.Vector3(SUN_X+3.2+Math.random()*1.6,(Math.random()-0.5)*4.4,(Math.random()-0.5)*4.4);
  pt.dir=tgt.clone().sub(pt.start).normalize();
  pt.dist=pt.start.distanceTo(tgt);
  pt.p=fresh?Math.random():0;
  pt.flavor=0;
  pt.switchAt=0.05+0.40*Math.random();
  pt.willSwitch=Math.random()>PEE();
  if(pt.p>pt.switchAt&&pt.willSwitch)pt.flavor=Math.random()<0.6?1:2;
}
for(let i=0;i<PN;i++){
  const pt={};setupPart(pt,true);parts.push(pt);
  pMesh.setColorAt(i,FLAV_COL[pt.flavor]);
}
if(pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true;
const _m4=new THREE.Matrix4(),_q=new THREE.Quaternion(),_v=new THREE.Vector3(),_s=new THREE.Vector3();
const flashT=[0,0,0];
function updateParts(dts){
  let colDirty=false;
  for(let i=0;i<PN;i++){
    const pt=parts[i];
    if(dts>0){
      pt.p+=dts/7;                                   /* 全程 ~7 s,光速尺度一致 */
      if(pt.flavor===0&&pt.willSwitch&&pt.p>pt.switchAt){
        pt.flavor=Math.random()<0.6?1:2;
        pMesh.setColorAt(i,FLAV_COL[pt.flavor]);colDirty=true;
      }
      if(pt.p>=1){
        if(pt.flavor===0)arrivedE++;else arrivedX++;
        if(pt.d===modeIdx())flashT[pt.d]=1;
        setupPart(pt,false);
        pMesh.setColorAt(i,FLAV_COL[pt.flavor]);colDirty=true;
      }
    }
    const pos=_v.copy(pt.start).addScaledVector(pt.dir,pt.p*pt.dist);
    _m4.compose(pos,_q,_s.setScalar(beamOn?1:0.001));
    pMesh.setMatrixAt(i,_m4);
  }
  pMesh.instanceMatrix.needsUpdate=true;
  if(colDirty&&pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true;
}
function modeIdx(){return mode==='cl'?0:mode==='h2o'?1:2;}

/* ── P–E 曲线(小画布) ── */
function drawOsc(){
  const cv=document.getElementById('oscCv'),g=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  g.clearRect(0,0,W,H);
  g.fillStyle=THEME==='dark'?'rgba(255,255,255,0.03)':'rgba(15,25,40,0.04)';
  g.fillRect(0,0,W,H);
  const x0=36,x1=W-12,y0=H-20,y1=10;
  const X=lg=>x0+(lg+0.6)/1.8*(x1-x0);
  const Y=p=>y0-p*(y0-y1);
  g.strokeStyle=THEME==='dark'?'#3a4356':'#a8b2c2';
  g.lineWidth=1;
  g.beginPath();g.moveTo(x0,y1);g.lineTo(x0,y0);g.lineTo(x1,y0);g.stroke();
  /* 参考线:氯的 1/3 */
  g.setLineDash([4,4]);
  g.strokeStyle=THEME==='dark'?'rgba(255,107,107,.5)':'rgba(201,42,42,.5)';
  g.beginPath();g.moveTo(x0,Y(1/3));g.lineTo(x1,Y(1/3));g.stroke();
  g.setLineDash([]);
  /* P_ee 曲线 */
  g.lineWidth=2;
  g.strokeStyle='#51cf66';g.beginPath();
  for(let i=0;i<=88;i++){
    const lg=-0.6+1.8*i/88;
    const P=0.578-0.274*smooth((lg-0.26)/0.55);
    i===0?g.moveTo(X(lg),Y(P)):g.lineTo(X(lg),Y(P));
  }
  g.stroke();
  /* 1−P 曲线 */
  g.strokeStyle='#b197fc';g.beginPath();
  for(let i=0;i<=88;i++){
    const lg=-0.6+1.8*i/88;
    const P=0.578-0.274*smooth((lg-0.26)/0.55);
    i===0?g.moveTo(X(lg),Y(1-P)):g.lineTo(X(lg),Y(1-P));
  }
  g.stroke();
  /* 当前能量标记 */
  const P=PEE();
  g.fillStyle='#ffa94d';
  g.beginPath();g.arc(X(lgE),Y(P),4,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(X(lgE),Y(1-P),4,0,Math.PI*2);g.fill();
  /* 文字 */
  g.font='10px sans-serif';
  g.fillStyle=THEME==='dark'?'#9fb0c3':'#5b6b7d';
  g.fillText(L('P(ν_e 存活)','P(ν_e survival)'),x0+6,y1+11);
  g.fillStyle='#51cf66';g.fillRect(x0+86,y1+4,8,3);
  g.fillStyle='#b197fc';g.fillRect(x0+86,y1+13,8,3);
  g.fillStyle=THEME==='dark'?'#9fb0c3':'#5b6b7d';
  g.fillText(L('振荡','conv.'),x0+98,y1+15);
  g.fillText('1/3',x0-24,Y(1/3)+3);
  g.fillText('0',x0-14,y0+3);
  g.fillText('0.3',X(-0.52)-10,y0+13);
  g.fillText('15',X(1.18)-6,y0+13);
  g.fillText(L('能量 E / MeV(对数) →','Energy E / MeV (log) →'),x1-118,y0-5);
}

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

/* ── 统计 ── */

  document.getElementById('stSSM').innerHTML='6.6×10¹⁰<small> cm⁻²s⁻¹</small>';

  document.getElementById('stPee').innerHTML=(P*100).toFixed(0)+'<small> %</small>';
  document.getElementById('stPtx').innerHTML=((1-P)*100).toFixed(0)+'<small> %</small>';
  const r=detRatio();
  const rv=document.getElementById('stRatio');
  rv.innerHTML=(r*100).toFixed(0)+'<small> %</small>';
  rv.className='v '+(r>0.9?'ok':r<0.4?'warn':'');

/* ── 主循环 ── */
const clock=new THREE.Clock();
let raf=null;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  updateParts(dts);
  for(let i=0;i<3;i++){
    flashT[i]=Math.max(0,flashT[i]-dt*2.2);
    flashRings[i].material.opacity=flashT[i]*0.9;
    flashRings[i].scale.setScalar(1+0.35*(1-flashT[i]));
  }
  earth.rotation.y+=dts*0.25;
  sun.rotation.y+=dts*0.04;
  lblOsc.position.set(SUN_X+3.6+(earthG.position.x-SUN_X-3.6)/2,-2.4,0);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&r.vis();
    r.o.visible=on&&r.text()!=='';
    if(on)r.o.element.textContent=r.text();
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');

applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
setL(1);setMode('cl');
updateStats();syncPlayBtn();start();

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
