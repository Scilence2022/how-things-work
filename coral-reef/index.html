<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珊瑚礁 · 白化与酸化的双重挤压</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#4dabf7;
    --bg:#0f1013; --panel:rgba(15,16,20,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,16,20,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(15,16,20,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#1864ab;
    --bg:#eef2f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.o { border-color: rgba(255,169,77,.9); color: #ffe0c2; }
  .lbl.r { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.g { border-color: rgba(116,220,132,.9); color: #c8f5d0; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #bde9ff; }
  :root[data-theme="light"] .lbl.o { color:#a34e00; } :root[data-theme="light"] .lbl.r { color:#c92a2a; }
  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 10px 6px; }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: calc(100% - 20px); display: block; }

  #stats { position: fixed; right: 18px; bottom: 244px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11px; color: var(--text2); font-weight: 400; }
  #stats .v.ok { color: #7bd88f; }
  #stats .v.warn { color: #ffa94d; }
  #stats .v.bad { color: #ff6b6b; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 392px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.o { color: #ffe0ae; border-color: rgba(255,180,84,.7); }
  .chip.g { color: #c8f5d0; border-color: rgba(116,220,132,.7); }
  .chip.r { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  :root[data-theme="light"] .chip.o { color:#a34e00; } :root[data-theme="light"] .chip.g { color:#2b8a3e; }
  :root[data-theme="light"] .chip.r { color:#c92a2a; } :root[data-theme="light"] .chip.b { color:#1864ab; }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1 1 40%;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.on { border-color: rgba(77,171,247,.6); background: rgba(77,171,247,.12); color: var(--text); }
  .abtn.brk { border-color: rgba(255,107,107,.55); color: #ff8787; }
  :root[data-theme="light"] .abtn.on { border-color: rgba(24,100,171,.55); background: rgba(24,100,171,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 72px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #formula { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: var(--text2);
    border-top: 1px dashed var(--panel-border); padding-top: 7px; }
  #formula b { color: var(--text3); font-weight: 600; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(77,171,247,.10); border-color: rgba(77,171,247,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(24,100,171,.08); border-color: rgba(24,100,171,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #bde9ff; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="珊瑚礁 · 白化与酸化的双重挤压" data-en="Coral Reefs · Bleaching & Acidification, a Double Squeeze">珊瑚礁 · 白化与酸化的双重挤压</h1>
  <div class="sub" data-zh="颜色来自共生虫黄藻(供能 90%)→ 海水 +1.5 °C,藻产生活性氧,珊瑚排藻变白 → 饿肚子;另一头 CO₂ 溶入海水 → H⁺ 吃掉 CO₃²⁻ → Ω=⟨Ca²⁺⟩⟨CO₃²⁻⟩/K_sp 从 4.0 滑到 3.3,pH 8.2→8.1(=H⁺ +26%)→ 盖 CaCO₃ 骨架越来越难 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="The color comes from symbiotic zooxanthellae (90% of the coral's energy) → warm the sea +1.5 °C and the algae turn toxic, get evicted, and the coral starves white → meanwhile CO₂ dissolves in → H⁺ eats CO₃²⁻ → Ω = [Ca²⁺][CO₃²⁻]/K_sp slides 4.0 → 3.3 and pH 8.2 → 8.1 (= +26% H⁺) → building the CaCO₃ skeleton gets harder and harder · 3D interactive demo · drag to orbit · Space = run/pause">珊瑚礁 · 白化与酸化的双重挤压</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="海温异常" data-en="SST anomaly">海温异常</span><span class="v" id="stT">—</span>
  <span class="k" data-zh="虫黄藻密度" data-en="Algae density">虫黄藻密度</span><span class="v ok" id="stA">—</span>
  <span class="k" data-zh="珊瑚状态" data-en="Coral state">珊瑚状态</span><span class="v" id="stS">—</span>
  <span class="k" data-zh="文石饱和度 Ω" data-en="Aragonite Ω">文石饱和度 Ω</span><span class="v ok" id="stOm">—</span>
  <span class="k" data-zh="海水 pH" data-en="Seawater pH">海水 pH</span><span class="v" id="stPH">—</span>
  <span class="k" data-zh="钙化速率" data-en="Calcification">钙化速率</span><span class="v" id="stG">—</span>
</div>

<div id="plot">
  <h3 data-zh="钙化速率随文石饱和度 Ω 下降(G ∝ Ω−1,Ω=1 即停止生长)" data-en="Calcification vs aragonite saturation Ω (G ∝ Ω−1; growth stops at Ω=1)">钙化速率随文石饱和度 Ω 下降(G ∝ Ω−1,Ω=1 即停止生长)</h3>
  <canvas id="plotCv"></canvas>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.g" data-zh="黄绿小点:共生虫黄藻" data-en="yellow-green dots: zooxanthellae">黄绿小点:共生虫黄藻</span>
    <span class="chip.r" data-zh="粉色小球:H⁺(酸化元凶)" data-en="pink dots: H⁺ (the acidifier)">粉色小球:H⁺(酸化元凶)</span>
    <span class="chip.b" data-zh="蓝色晶体:CO₃²⁻ 造骨材料" data-en="blue crystals: CO₃²⁻ building material">蓝色晶体:CO₃²⁻ 造骨材料</span>
    <span class="chip.o" data-zh="白珊瑚:被赶走房客后的空骨架" data-en="white coral: the skeleton after the eviction">白珊瑚:被赶走房客后的空骨架</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnPre" data-zh="1750 年基线" data-en="1750 baseline">1750 年基线</button>
    <button class="abtn on" id="btnNow" data-zh="今天(420 ppm)" data-en="Today (420 ppm)">今天(420 ppm)</button>
    <button class="abtn brk" id="btnHeat" data-zh="海洋热浪 +1.6 °C" data-en="Marine heatwave +1.6 °C">海洋热浪 +1.6 °C</button>
    <button class="abtn brk" id="btnFut" data-zh="未来 560 ppm" data-en="Future 560 ppm">未来 560 ppm</button>
    <button class="abtn" id="btnReset" data-zh="让珊瑚复原" data-en="Regrow the corals">让珊瑚复原</button>
  </div>
  <div class="row"><label data-zh="海温异常" data-en="SST anomaly">海温异常</label><input id="sT" type="range" min="0" max="3" step="0.05" value="1"><span class="val" id="sTVal">+1.0 °C</span></div>
  <div class="row"><label data-zh="大气 CO₂" data-en="Atmos. CO₂">大气 CO₂</label><input id="sC" type="range" min="280" max="560" step="5" value="420"><span class="val" id="sCVal">420 ppm</span></div>
  <div class="row"><label data-zh="动画速度" data-en="Speed">动画速度</label><input id="sSpd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="sSpdVal">1.0×</span></div>
  <div id="formula"></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">运行</button>
    <div id="toggles">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglChart" type="checkbox" checked> <span data-zh="钙化图" data-en="Chart">钙化图</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../greenhouse-effect/" data-zh="温室效应:变暖的上游" data-en="greenhouse effect: the warming upstream">温室效应:变暖的上游</a>
    <a href="../hydrogen-bond/" data-zh="氢键:水的特殊性" data-en="hydrogen bonds: water's quirks">氢键:水的特殊性</a>
    <a href="../titration-curve/" data-zh="滴定曲线:pH 如何读数" data-en="titration curves: how pH is read">滴定曲线:pH 如何读数</a>
    <a href="../le-chatelier/" data-zh="勒夏特列:平衡被谁推" data-en="Le Chatelier: who pushes the balance">勒夏特列:平衡被谁推</a>
    <a href="../ocean-conveyor/" data-zh="大洋传送带:CO₂ 的深海慢车" data-en="ocean conveyor: the deep CO₂ slow train">大洋传送带:CO₂ 的深海慢车</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const L = (zh, en) => LANG === 'en' ? en : zh;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x082636, 10, 42);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x082636 : 0xaad7e6);
  scene.fog.color = new THREE.Color(dark ? 0x082636 : 0xaad7e6);
  hemi.intensity = dark ? 0.55 : 0.85;
  key.intensity = dark ? 1.25 : 1.6;
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('珊瑚礁 · 白化与酸化的双重挤压', 'Coral Reefs · Bleaching & Acidification, a Double Squeeze');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 120);
camera.position.set(2.6, 4.4, 12.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.6, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.6;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x0e2f40, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xeaf6ff, 1.25);
key.position.set(4, 10, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x7fb8d8, 0.3);
fill.position.set(-6, 4, -5);
scene.add(fill);

/* ================= 化学模型(真实标定) ================= */
let CO2 = clamp(qsFloat('co2', 420), 280, 560);      /* 大气 CO₂ ppm */
let dT = clamp(qsFloat('dt', 1.0), 0, 3);            /* 海温异常 °C */
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let playing = !qsBool('pause', false);
if (qs.get('pause') === null && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
let labelsOn = true, chartOn = true;
let phaseIdx = 0, weeks = 0;
const pHof = C => 8.2 - 0.225 * Math.log2(C / 280);            /* 280→8.20, 420→8.07, 560→7.98 */
const OmOf = C => 4.0 * Math.pow(280 / C, 0.278);              /* 280→4.0, 420→3.58, 560→3.3 */
const Hof = C => Math.pow(10, 8.2 - pHof(C));                  /* H⁺ 相对倍数 */
const Gof = (Om, d) => clamp((Om - 1) / 3, 0, 1) * (1 - 0.3 * clamp(d / 3, 0, 1));  /* 钙化 0..1 */

/* ---------------- 海底 / 岩石 / 水面 ---------------- */
const sand = new THREE.Mesh(new THREE.CircleGeometry(15, 40),
  new THREE.MeshStandardMaterial({ color: 0xc9b487, roughness: 1 }));

const _M4 = new THREE.Matrix4(), _Q0 = new THREE.Quaternion(), _V = new THREE.Vector3(), _S = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);
function updateZoox(dt, t) {
  const A = avgAlgae();
  for (let i = 0; i < NZ; i++) {
    const p = zp[i];
    const target = p.th > A ? 1 : 0;
    p.out += (target - p.out) * Math.min(1, dt * (target > p.out ? 0.9 : 0.5));
    const o = p.out, e = o * o * (3 - 2 * o);
    _V.copy(p.home)
      .addScaledVector(p.dir, e * (1.5 + 1.1 * (p.th % 0.3)))
      .addScaledVector(UP, e * e * 1.3)
      .add(_S.set(Math.sin(t * 2 + p.ph), Math.cos(t * 1.7 + p.ph), Math.sin(t * 1.3 + p.ph * 2)).multiplyScalar(0.03 * (1 - o)));
    const sc = p.sc * (1 - o * 0.92);
    _M4.compose(_V, _Q0.identity(), _S.set(sc, sc, sc));
    zoox.setMatrixAt(i, _M4);
  }
  zoox.instanceMatrix.needsUpdate = true;
}
function avgAlgae() {
  let s = 0;
  for (const c of corals) s += c.h;
  return s / corals.length;
}
function updateCoralHealth(dt) {
  const s = stressLevel();
  for (const c of corals) {
    const si = clamp((s - c.th * 0.4) / 0.6, 0, 1);
    c.h += (1 - si - c.h) * Math.min(1, dt * (si > c.h ? 0.5 : 0.09));
    if (c.h < 0.15 && si > 0.5) c.dead = clamp(c.dead + dt * 0.015, 0, 1);
    else c.dead = clamp(c.dead - dt * 0.004, 0, 1);
    if (c.dead >= 0.999) c.mat.color.copy(DEAD);
    else c.mat.color.copy(WHITE).lerp(c.healthy, c.h);
    c.mat.emissiveIntensity = 0.05 * c.h;
  }
}

function updateLab(dt, t) {
  for (let i = 0; i < NC2; i++) {
    const m = co2p[i];
    if (!m.sink && Math.random() < dt * 0.14 * (CO2 / 280)) m.sink = true;
    if (m.sink) {
      m.y -= dt * 0.55 * (0.6 + (CO2 - 280) / 280);
      if (m.y < 4.6) { m.sink = false; m.y = 7.2; m.x = lerp(5.1, 7.9, Math.random()); m.z = lerp(-1.4, 1.4, Math.random()); }
    } else m.y += Math.sin(t * 1.2 + m.ph) * dt * 0.12;
    _M4.compose(_V.set(m.x, m.y, m.z), _Q0.identity(), _S.set(1, 1, 1));
    co2C.setMatrixAt(i, _M4);
    m.ax += dt * 0.7;
    const ax = 0.115;
    _M4.compose(_V.set(m.x + Math.cos(m.ax) * ax, m.y + 0.03, m.z + Math.sin(m.ax) * ax), _Q0.identity(), _S.set(1, 1, 1));
    co2O.setMatrixAt(i * 2, _M4);
    _M4.compose(_V.set(m.x - Math.cos(m.ax) * ax, m.y - 0.03, m.z - Math.sin(m.ax) * ax), _Q0.identity(), _S.set(1, 1, 1));
    co2O.setMatrixAt(i * 2 + 1, _M4);
  }
  co2C.instanceMatrix.needsUpdate = co2O.instanceMatrix.needsUpdate = true;
  /* 离子数量 ∝ 化学状态 */
  const nH = Math.round(6 + (NH - 6) * clamp((Hof(CO2) - 1) / 0.9, 0, 1));
  const nC = Math.round(40 * clamp(OmOf(CO2) / 4, 0.15, 1));
  hIons.count = nH; co3Ions.count = nC;
  for (let i = 0; i < nH; i++) {
    const p = hp[i];
    _M4.compose(_V.set(p[0] + Math.sin(t * 1.8 + p[3]) * 0.09, p[1] + Math.cos(t * 1.5 + p[3] * 2) * 0.09, p[2] + Math.sin(t * 1.2 + p[3]) * 0.09), _Q0.identity(), _S.set(1, 1, 1));
    hIons.setMatrixAt(i, _M4);
  }
  hIons.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < nC; i++) {
    const p = cp[i];
    _Q0.setFromEuler(new THREE.Euler(t * 0.4 + p[3], t * 0.3 + p[3], 0));
    _M4.compose(_V.set(p[0] + Math.sin(t * 1.1 + p[3]) * 0.07, p[1] + Math.cos(t * 0.9 + p[3]) * 0.07, p[2]), _Q0, _S.set(1, 1, 1));
    co3Ions.setMatrixAt(i, _M4);
  }
  co3Ions.instanceMatrix.needsUpdate = true;
  /* 晶体:Ω 越低越小越暗 */
  const Om = OmOf(CO2);
  const target = clamp(Om / 4, 0.3, 1.08);
  crystal.scale.setScalar(lerp(crystal.scale.x, target, Math.min(1, dt * 1.5)));
  crystal.rotation.y = t * 0.25;
  crystal.material.emissiveIntensity = Om > 3.4 ? 0.3 : clamp((Om - 1.6) / 2, 0.02, 0.3) * 0.4;
  crystal.material.color.copy(cTmp.setHex(0xbfe3f5).lerp(new THREE.Color(0xcfb9a8), clamp((4 - Om) / 1.4, 0, 1)));
}

    d: '变暖偷走藻与能量,酸化偷走建材与骨架;两根滑杆一起拉,就是本世纪珊瑚礁的真实处境:升温 2 °C,全球浅水珊瑚礁所剩无几。',
    de: 'Warming steals the algae and the energy; acidification steals the materials and the skeleton. Drag both sliders together and you have the reef\'s 21st century: at 2 °C, shallow reefs mostly gone.',
    act: () => { phaseIdx = 6; setD(1.5); setC(560); flyTo(...WIDE); } },
];
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { phaseIdx = i; s.act(); syncAll(); });
    el.appendChild(li);
  });
}

/* ================= 绘图:钙化-Ω 曲线 ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 44, padR = 16, padT = 12, padB = 26;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
  const X = om => x0 + clamp(om, 1, 4.5) / 4.5 * (x1 - x0);
  const Y = g => y1 - clamp(g, 0, 1) * (y1 - y0);
  ctx.font = '16px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const v of [0, 0.25, 0.5, 0.75, 1]) {
    const y = Y(v);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillText(String(v * 100), x0 - 34, y + 5);
  }
  ctx.fillText('%', x0 - 30, y0 + 12);
  /* Ω=1 阈值 */
  ctx.strokeStyle = 'rgba(255,107,107,.7)';
  ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(X(1), y0); ctx.lineTo(X(1), y1); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ff8787';
  ctx.fillText(L('Ω=1 溶解/停长', 'Ω=1 dissolve'), X(1) + 6, y0 + 14);
  /* 曲线 G ∝ Ω-1 */
  ctx.strokeStyle = '#4dabf7';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const om = 1 + i / 60 * 3.5;
    const x = X(om), y = Y(clamp((om - 1) / 3, 0, 1));
    i <= 0.01 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* 当前工作点(含温度惩罚) */
  const Om = OmOf(CO2), G = Gof(Om, dT);
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath(); ctx.arc(X(Om), Y(G), 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillText(L(`Ω=${Om.toFixed(2)}`, `Ω=${Om.toFixed(2)}`), X(Om) - 22, Y(G) - 12);
  ctx.fillStyle = cTxt;
  ctx.fillText(L('文石饱和度 Ω', 'aragonite Ω'), x1 - 110, H - 8);
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elT = document.getElementById('sT'), elTVal = document.getElementById('sTVal');
const elC = document.getElementById('sC'), elCVal = document.getElementById('sCVal');
const elSpd = document.getElementById('sSpd'), elSpdVal = document.getElementById('sSpdVal');
const stT = document.getElementById('stT'), stA = document.getElementById('stA'), stS = document.getElementById('stS'),
  stOm = document.getElementById('stOm'), stPH = document.getElementById('stPH'), stG = document.getElementById('stG');
const formulaEl = document.getElementById('formula');
const btnPre = document.getElementById('btnPre'), btnNow = document.getElementById('btnNow'),
  btnHeat = document.getElementById('btnHeat'), btnFut = document.getElementById('btnFut'), btnReset = document.getElementById('btnReset');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('运行', 'Run'); }
function syncSliders() {
  elT.value = dT; elTVal.textContent = '+' + dT.toFixed(2) + ' °C';
  elC.value = CO2; elCVal.textContent = CO2.toFixed(0) + ' ppm';
  elSpd.value = speed; elSpdVal.textContent = '×' + speed.toFixed(1);
}
function syncBtns() {
  btnPre.classList.toggle('on', CO2 === 280 && dT === 0);
  btnNow.classList.toggle('on', CO2 === 420 && dT === 1.0);
  btnHeat.classList.toggle('on', dT === 1.8);
  btnFut.classList.toggle('on', CO2 === 560);
}
function updateStats() {
  const Om = OmOf(CO2), G = Gof(Om, dT), A = avgAlgae();
  stT.innerHTML = '+' + dT.toFixed(2) + '<small> °C</small>';
  stT.className = 'v ' + (dT >= 1.5 ? 'bad' : dT >= 0.8 ? 'warn' : 'ok');
  stA.innerHTML = (A * 100).toFixed(0) + '<small> %</small>';
  stA.className = 'v ' + (A > 0.7 ? 'ok' : A > 0.35 ? 'warn' : 'bad');
  const dead = corals.filter(c => c.dead >= 0.999).length;
  let st = A > 0.7 ? L('健康', 'healthy') : A > 0.35 ? L('排藻中…', 'evicting…') : L('白化', 'BLEACHED');
  if (weeks > 1 && A < 0.5) st += L(`(第 ${weeks.toFixed(0)} 周)`, ` (wk ${weeks.toFixed(0)})`);
  if (dead > 0) st += L(` · ${dead} 株饿死`, ` · ${dead} starved`);
  stS.textContent = st;
  stS.className = 'v ' + (dead > 0 ? 'bad' : A > 0.7 ? 'ok' : A > 0.35 ? 'warn' : 'bad');
  stOm.innerHTML = Om.toFixed(2) + '<small> ×K_sp</small>';
  stOm.className = 'v ' + (Om > 3.5 ? 'ok' : Om > 3 ? 'warn' : 'bad');
  stPH.innerHTML = pHof(CO2).toFixed(2);
  stPH.className = 'v ' + (pHof(CO2) > 8.15 ? 'ok' : pHof(CO2) > 8.05 ? 'warn' : 'bad');
  stG.innerHTML = (G * 100).toFixed(0) + '<small> %</small>';
  stG.className = 'v ' + (G > 0.7 ? 'ok' : G > 0.4 ? 'warn' : 'bad');
}
function updateFormula() {
  formulaEl.innerHTML = L(
    `<b>Ω = ⟨Ca²⁺⟩⟨CO₃²⁻⟩ / K_sp</b>:工业革命前 ~4.0 → 今天 ~3.3;Ω 每降 0.3,钙化速率约掉 15%<br>` +
    `<b>CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻</b>:多溶的 CO₂ 放出 H⁺,H⁺ 吃掉 CO₃²⁻——建材被酸偷走<br>` +
    `<b>pH 8.2 → 8.1</b>:对数标度上 0.1 = H⁺ 浓度 ×1.26(+26%)<br>` +
    `<b>温度线</b>:虫黄藻供能 ~90%;持续白化 4–8 周,珊瑚真的饿死`,
    `<b>Ω = [Ca²⁺][CO₃²⁻] / K_sp</b>: preindustrial ~4.0 → today ~3.3; each 0.3 of Ω costs ~15% of calcification<br>` +
    `<b>CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻</b>: extra CO₂ releases H⁺, and H⁺ eats CO₃²⁻ — acid steals the building material<br>` +
    `<b>pH 8.2 → 8.1</b>: on a log scale, 0.1 = ×1.26 H⁺ (+26%)<br>` +
    `<b>Heat line</b>: algae supply ~90% of energy; 4–8 weeks bleached and the coral truly starves`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elT.addEventListener('input', () => { dT = +elT.value; syncSliders(); syncBtns(); });
elC.addEventListener('input', () => { CO2 = +elC.value; syncSliders(); syncBtns(); });
elSpd.addEventListener('input', () => { speed = +elSpd.value; syncSliders(); });
btnPre.addEventListener('click', () => { setC(280); setD(0); resetCorals(); syncAll(); });
btnNow.addEventListener('click', () => { setC(420); setD(1.0); syncAll(); });
btnHeat.addEventListener('click', () => { setD(1.8); syncAll(); });
btnFut.addEventListener('click', () => { setC(560); setD(2.2); syncAll(); });
btnReset.addEventListener('click', () => { resetCorals(); syncAll(); });
function resetCorals() {
  for (const c of corals) { c.h = 1; c.dead = 0; }
  weeks = 0;
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, camTween = null, simT = 0;
controls.addEventListener('start', () => { camTween = null; });
function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speed * (playing ? 1 : 0);
  simT += dt0;
  /* 热胁迫周数(白化时间线) */
  const s = stressLevel();
  if (s > 0.35 && avgAlgae() < 0.5) weeks += dt * 2.5;
  else if (dT < 0.5) weeks = Math.max(0, weeks - dt * 4);
  /* 生物与化学 */
  updateCoralHealth(dt);
  updateZoox(dt, simT);
  updateFish(simT);
  updateBubbles(dt, simT);
  updateLab(dt, simT);
  surfMat.opacity = 0.14 + 0.03 * Math.sin(simT * 0.8);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
