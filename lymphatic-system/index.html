<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淋巴系统 · 免疫巡逻与 3 升账本</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#3a7bc9;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#2c5f9e;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.g { border-color: rgba(255,107,107,.9); color: #ffc2c2; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  .lbl.e { border-color: rgba(99,230,190,.9); color: #c3f5e5; }
  .lbl.b { border-color: rgba(116,192,252,.9); color: #cfe5ff; }
  .lbl.y { border-color: rgba(255,209,102,.9); color: #ffe9b8; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; top: 86px; left: 22px; z-index: 5; display: flex; gap: 8px;
    flex-wrap: wrap; pointer-events: none; max-width: calc(100vw - 44px); }
  .stat { background: var(--cv-pill); border: 1px solid var(--tool-border); border-radius: 10px;
    padding: 5px 10px; font-size: 11.5px; color: var(--text2); display: flex; align-items: baseline;
    gap: 6px; backdrop-filter: blur(6px); }
  .stat b { color: var(--text); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat b.warn { color: #ff8787; }
  .stat b.hot { color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.p { color: #ffc2c2; border-color: rgba(255,107,107,.7); }
  .chip.b { color: #bcd8ff; border-color: rgba(116,192,252,.7); }
  .chip.y { color: #ffe9b8; border-color: rgba(255,209,102,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 7px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(58,123,201,.12); color: var(--text); border: 1px solid rgba(58,123,201,.5);
    border-radius: 9px; padding: 7px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s, background .15s; }
  .abtn:hover { filter: brightness(1.2); }
  .abtn.on { background: rgba(58,123,201,.3); border-color: rgba(120,180,240,.8); }
  :root[data-theme="light"] .abtn.on { background: rgba(44,95,158,.22); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 64px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 6px; }
  #steps li { display: flex; gap: 9px; padding: 5px 7px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(58,123,201,.10); border-color: rgba(58,123,201,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(44,95,158,.08); border-color: rgba(44,95,158,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.4; }
  #steps .t b { color: var(--text); font-size: 12px; }
  #steps li.on .t b { color: #a8cdef; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 7px 10px; align-items: center;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 8px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  .crow { display: flex; align-items: center; gap: 8px; }
  .crow label { font-size: 12px; color: var(--text2); flex: 0 0 40px; }
  .crow .val { font-size: 11.5px; color: var(--text3); flex: 0 0 34px; text-align: right; }
  #toggles { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }

  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; } /* panelTogglePad: 首行给 ▾ 按钮让位 */
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="淋巴系统:免疫巡逻与 3 升账本" data-en="The Lymphatic System: a 3-litre ledger &amp; immune patrol">淋巴系统：免疫巡逻与 3 升账本</h1>
  <div class="sub" data-zh="血压滤出 20 L·d⁻¹ → 静脉收回 17 L → 盲端淋巴管收尾 3 L:叠瓦内皮只进不出,肌肉/呼吸泵推送,淋巴结沿途侦察(巨噬细胞吞噬 → 生发中心增殖)——阻断即水肿 · 拖动旋转 / 空格运行/暂停" data-en="Blood pressure filters 20 L/day → veins reclaim 17 L → blind lymphatics collect the last 3 L: shingle valves admit one way, muscle &amp; breathing push it, nodes patrol (macrophages devour → germinal centers ignite) — blockage means edema · Drag to orbit / Space = play/pause">血压滤出 20 L·d⁻¹ → 静脉收回 17 L → 盲端淋巴管收尾 3 L：叠瓦内皮只进不出，肌肉/呼吸泵推送，淋巴结沿途侦察（巨噬细胞吞噬 → 生发中心增殖）——阻断即水肿 · 拖动旋转 / 空格运行/暂停</div>
</div>

<div id="stats">
  <div class="stat"><span data-zh="净积液" data-en="net fluid">净积液</span><b id="sAcc">+0.0</b><span data-zh="L·d⁻¹" data-en="L/day">L·d⁻¹</span></div>
  <div class="stat"><span data-zh="淋巴回流" data-en="lymph return">淋巴回流</span><b id="sLym">3.0</b><span data-zh="L·d⁻¹" data-en="L/day">L·d⁻¹</span></div>
  <div class="stat"><span data-zh="淋巴结应答" data-en="node response">淋巴结应答</span><b id="sNode">0%</b></div>
  <div class="stat"><span data-zh="水肿指数" data-en="edema index">水肿指数</span><b id="sEd">0%</b></div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="panel">
  <button id="panelToggle" title="折叠 / 展开" aria-label="toggle panel">▾</button>
  <div id="legend">
    <span class="chip.p" data-zh="抗原(红)" data-en="antigens (red)">抗原(红)</span>
    <span class="chip.b" data-zh="生发中心(蓝)" data-en="germinal center (blue)">生发中心(蓝)</span>

    <button class="abtn" id="btnInfect"></button>

  <div class="row"><label data-zh="肌肉泵强度" data-en="muscle pump">肌肉泵强度</label><input id="pump" type="range" min="0" max="2" step="0.05" value="1"><span class="val" id="pumpVal">1.00×</span></div>
  <ol id="steps"></ol>

    <button id="play">暂停</button>
    <div class="crow"><label data-zh="相位" data-en="phase">相位</label><input id="phase" type="range" min="1" max="6" step="1" value="1"><span class="val" id="phaseVal">1/6</span></div>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
    </div>

    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../immune-response/" data-zh="深入:免疫细胞如何开战" data-en="deep dive: how immune cells fight">深入:免疫细胞如何开战</a>
    <a href="../complement-cascade/" data-zh="助攻:防御级联" data-en="backup: the defense cascade">助攻:防御级联</a>
    <a href="../blood-coagulation/" data-zh="管道对照:血液凝固" data-en="vessel cousin: blood clotting">管道对照:血液凝固</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('淋巴系统:免疫巡逻与 3 升账本', 'The Lymphatic System: a 3-litre ledger & immune patrol');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
  updateActionBtns();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.5, 2.7, 9.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.2, 1.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3.5;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.3;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45);
fill.position.set(-6, 3, -5);
scene.add(fill);

/* ---------------- 材质 / 几何 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.12, transparent: true, ...opts });
}
const M = {
  base: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000, opacity: 1, transparent: false }),
  vessel: mat(0xe06666, { opacity: 0.4, roughness: 0.3, depthWrite: false }),
  rbc: mat(0xd64545, { opacity: 1, transparent: false, roughness: 0.35 }),
  tissue: mat(0xe8a0a8, { opacity: 0.75, roughness: 0.6, flatShading: true, depthWrite: false }),
  edema: mat(0x9ec9ff, { opacity: 0.08, roughness: 0.2, emissiveIntensity: 0.05, depthWrite: false }),
  lymphV: mat(0xbfe3d0, { opacity: 0.38, roughness: 0.3, depthWrite: false }),
  lymP: mat(0xdff5ea, { opacity: 0.9 }),
  fluid: mat(0x9ec9ff, { opacity: 0.75 }),
  valve: mat(0xe8f4ee, { opacity: 0.85, side: THREE.DoubleSide, depthWrite: false }),
  tile: mat(0xd6ecdf, { opacity: 0.8, depthWrite: false }),
  muscle: mat(0xb04a3a, { opacity: 1, transparent: false, roughness: 0.55 }),
  node: mat(0x8fb8e8, { opacity: 0.24, roughness: 0.3, emissiveIntensity: 0.05, depthWrite: false }),
  foll: mat(0x74a8e0, { opacity: 0.8 }),
  gc: new THREE.MeshStandardMaterial({ color: 0x3a7bc9, emissive: 0x3a7bc9, emissiveIntensity: 0.12, roughness: 0.3, transparent: true, opacity: 0.38, depthWrite: false }),
  mac: mat(0xe8b84a, { opacity: 1, transparent: false }),
  dc: mat(0xb08ae0, { opacity: 1, transparent: false }),
  tcell: mat(0x52c7a8, { opacity: 1, transparent: false }),
  bcell: mat(0x74a8e0, { opacity: 1, transparent: false }),
  fat: mat(0xf5f0e6, { opacity: 0.95 }),
  antigen: mat(0xff5f5f, { opacity: 1, transparent: false, emissiveIntensity: 0.3 }),
  clamp: mat(0xd64545, { opacity: 1, transparent: false, emissiveIntensity: 0.4 }),
};
const G = {
  sph: new THREE.SphereGeometry(1, 16, 12),
  ico: new THREE.IcosahedronGeometry(1, 1),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 20),
  cone: new THREE.ConeGeometry(1, 1, 12),
  box: new THREE.BoxGeometry(1, 1, 1),
};
const dummy = new THREE.Object3D();
const V1 = new THREE.Vector3(), V2 = new THREE.Vector3();
const mouthV = new THREE.Vector3(-2.35, 1.15, 0);
const nodeC = new THREE.Vector3(4.0, 1.5, 0);
const macWorld = [{ x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }];

/* ---------------- 底座 ---------------- */
const base = new THREE.Mesh(G.cyl, M.base);
base.scale.set(8.4, 0.14, 5.2);
base.position.y = -0.55;
scene.add(base);

/* ---------------- 血管端:滤出与回吸收 ---------------- */
const bWall = new THREE.Mesh(G.cyl, M.vessel);
bWall.scale.set(0.3, 3.4, 0.3);
bWall.rotation.z = Math.PI / 2;
bWall.position.set(-5.0, 1.7, 0);
scene.add(bWall);
const iRBC = new THREE.InstancedMesh(G.sph, M.rbc, 26);
scene.add(iRBC);
const rbcU = [], rbcPh = [];

const clock = new THREE.Clock();
let lastStep = -1, lastPH = -1;
let rafId = 0;
function tick(dts, dt) {
  while (PH < 6 && tSim >= stepStart[PH]) { PH++; updateActionBtns(); }
  const fInf = effInfect(), fBlk = effBlock();
  const fPumpN = fPump / 2;

  /* 泵:肌肉收缩包络 + 呼吸包络 */
  mPh += dts * (0.9 + 1.5 * fPump);
  const e0 = Math.max(0, Math.sin(mPh)); mEnv = e0 * e0;
  breathPh += dts * 1.05;
  const bEnv = 0.5 + 0.5 * Math.sin(breathPh);
  const openAmt = fBlk ? 0 : Math.min(1, 0.1 * bEnv + mEnv * (0.25 + 0.75 * fPumpN) * 1.15);

  /* 账本与水肿 */
  let flow = fBlk ? 0 : Math.min(7, 3 * (0.12 + 0.88 * fPump) + edema / 25);
  const accum = 3 - flow;
  edema = clamp(edema + accum * 2.8 * dts, 0, 100);

  muscle.scale.setScalar(0.38 * (1 - 0.22 * mEnv * (0.4 + 0.6 * fPumpN)));
  dome.position.y = 0.5 + 0.09 * bEnv;
  clampT.visible = clampB.visible = fBlk;
  edemaBlob.scale.setScalar(0.55 + edema / 100);
  M.edema.opacity = 0.06 + edema / 100 * 0.2;
  tissueCells.forEach(c => c.scale.setScalar(c.userData.s * (1 + edema / 100 * 0.35)));

  /* 血管内红细胞 */
  for (let i = 0; i < 26; i++) {
    rbcU[i] += dts * 0.25; if (rbcU[i] > 1) rbcU[i] -= 1;
    dummy.position.set(-6.7 + rbcU[i] * 3.4, 1.7 + Math.sin(rbcPh[i]) * 0.13, Math.cos(rbcPh[i]) * 0.13);
    dummy.rotation.set(rbcPh[i], rbcPh[i] * 2, 0);
    dummy.scale.set(0.09, 0.032, 0.09);
    dummy.updateMatrix(); iRBC.setMatrixAt(i, dummy.matrix);
  }
  iRBC.instanceMatrix.needsUpdate = true;

  /* 组织液粒子:通畅时被盲端吸走(动脉端再补给),阻断时堆积 */
  const drain = !fBlk && PH >= 2 && flow > 0.3;
  const drawn = Math.min(110, 40 + Math.round(edema * 0.7));
  iFluid.count = drawn;
  for (let i = 0; i < drawn; i++) {
    const p = fluidP[i];
    if (drain) {
      V1.copy(mouthV);
      p.lerp(V1, clamp(dts * (0.35 + 0.3 * flow), 0, 1));
      if (p.distanceTo(mouthV) < 0.3) p.set(-6.2 + Math.random() * 1.6, 1.7 + (Math.random() - 0.5) * 0.44, (Math.random() - 0.5) * 0.5);
    } else {
      V1.set(-3.6 + ((i % 7) - 3) * 0.3, 1.5 + ((i % 5) - 2) * 0.26, ((i % 3) - 1) * 0.34);
      p.lerp(V1, clamp(dts * 0.35 * (0.5 + edema / 100), 0, 1));
    }
    dummy.position.set(p.x + Math.sin(tSim * 1.9 + fluidPh[i]) * 0.03, p.y + Math.cos(tSim * 1.6 + fluidPh[i] * 1.3) * 0.03, p.z);
    dummy.rotation.set(fluidPh[i], 0, 0);
    dummy.scale.setScalar(0.045);
    dummy.updateMatrix(); iFluid.setMatrixAt(i, dummy.matrix);
  }
  iFluid.instanceMatrix.needsUpdate = true;

  /* 淋巴管内流动粒子 */
  for (let i = 0; i < 40; i++) {
    if (!fBlk) { lymS[i] += dts * (0.02 + 0.22 * openAmt); if (lymS[i] > 1) lymS[i] -= 1; }
    const s = lymS[i];
    dummy.position.set(-2.35 + s * 6.3, 1.15 + Math.max(0, (s - 0.85) / 0.15) * 0.3, Math.sin(tSim + i * 2.4) * 0.1);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.setScalar(0.05 + 0.02 * Math.sin(i * 3.3));
    dummy.updateMatrix(); iLym.setMatrixAt(i, dummy.matrix);
  }
  iLym.instanceMatrix.needsUpdate = true;

  /* 离心淋巴(输出端) */
  for (let i = 0; i < 8; i++) {
    exitS[i] += dts * 0.12; if (exitS[i] > 1) exitS[i] -= 1;
    dummy.position.set(4.95 + exitS[i] * 1.65, 1.5 - 0.18 * exitS[i], Math.sin(i * 2.1) * 0.08);
    dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(0.055);
    dummy.updateMatrix(); iExit.setMatrixAt(i, dummy.matrix);
  }
  iExit.instanceMatrix.needsUpdate = true;

  /* 乳糜脂肪上运 */
  for (let i = 0; i < 12; i++) {
    fatS[i] += dts * (PH >= 2 ? 0.16 : 0.05); if (fatS[i] > 1) fatS[i] -= 1;
    const f = fatS[i];
    if (f < 0.85) dummy.position.set(-1.55 + Math.sin(tSim * 2 + i) * 0.09, 0.3 + 0.75 * f, 0.75 + Math.cos(tSim * 1.7 + i) * 0.09);
    else dummy.position.set(-1.55, 1.05 + (f - 0.85) * 2, 0.75);
    dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(0.06);
    dummy.updateMatrix(); iFat.setMatrixAt(i, dummy.matrix);
  }
  iFat.instanceMatrix.needsUpdate = true;

  /* 瓣膜:脉冲时贴壁放开,平时闭锁 */
  for (let v = 0; v < 3; v++) {
    const ang = 0.22 + openAmt * 1.0;
    dummy.position.set(valveX[v], 1.15 + 0.26, 0);
    dummy.rotation.set(0, 0, ang); dummy.scale.set(1, 1, 1);
    dummy.updateMatrix(); iValve.setMatrixAt(v * 2, dummy.matrix);
    dummy.position.set(valveX[v], 1.15 - 0.26, 0);
    dummy.rotation.set(0, 0, -ang); dummy.scale.set(1, -1, 1);
    dummy.updateMatrix(); iValve.setMatrixAt(v * 2 + 1, dummy.matrix);
  }
  iValve.instanceMatrix.needsUpdate = true;

  /* 叠瓦小片:进气时外扩露缝 */
  const gap = 0.015 + 0.05 * (fBlk ? 0 : openAmt);
  for (let i = 0; i < tileBase.length; i++) {
    const t = tileBase[i];
    const r = t.r + gap;
    dummy.position.set(t.x, 1.15 + Math.cos(t.a) * r, Math.sin(t.a) * r);
    dummy.rotation.set(t.a, 0, 0);
    dummy.scale.set(0.12, 0.05, 0.16);
    dummy.updateMatrix(); iTile.setMatrixAt(i, dummy.matrix);
  }
  iTile.instanceMatrix.needsUpdate = true;

  /* 淋巴结内部 */
  const sc = 1 + 0.3 * resp / 100;
  nodeGroup.scale.setScalar(sc);
  M.gc.emissiveIntensity = 0.12 + resp / 100 * (1.0 + 0.45 * Math.sin(tSim * 6));
  gcMesh.scale.setScalar(0.3 * (1 + 0.45 * resp / 100));
  for (let i = 0; i < 22; i++) {
    const p = tBase[i];
    dummy.position.set(p.x + Math.sin(tSim * 1.3 + i) * 0.03, p.y + Math.cos(tSim * 1.1 + i * 2) * 0.03, p.z);
    dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(0.05);
    dummy.updateMatrix(); iTcell.setMatrixAt(i, dummy.matrix);
  }
  iTcell.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < 26; i++) {
    const r = 0.35 + (i % 4) * 0.13;
    const a = tSim * 0.25 * (i % 2 ? 1 : -1) + bPh[i];
    dummy.position.set(Math.cos(a) * r * 1.1, Math.sin(a * 0.8 + bPh[i]) * 0.45, Math.sin(a) * r);
    dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(0.055);
    dummy.updateMatrix(); iBpatrol.setMatrixAt(i, dummy.matrix);
  }
  iBpatrol.instanceMatrix.needsUpdate = true;
  const nGC = Math.round(resp / 100 * 36);
  iGC.count = nGC;
  for (let i = 0; i < nGC; i++) {
    const r = 0.12 + (i % 5) * 0.045;
    const a = tSim * (2 + resp / 40) + gcPh[i];
    dummy.position.set(0.15 + Math.cos(a) * r, -0.05 + Math.sin(a * 1.3) * r, Math.sin(a) * r);
    dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(0.04);
    dummy.updateMatrix(); iGC.setMatrixAt(i, dummy.matrix);
  }
  iGC.instanceMatrix.needsUpdate = true;

  /* 巨噬细胞巡逻位置(局部) */
  for (let k = 0; k < 3; k++) {
    const mx = 0.1 + 0.35 * Math.cos(tSim * 0.32 + k * 2.1);
    const my = 0.3 * Math.sin(tSim * 0.26 + k * 1.7);
    const mz = 0.3 * Math.sin(tSim * 0.21 + k * 2.6);
    macs[k].position.set(mx, my, mz);
    macWorld[k].x = nodeC.x + mx * sc;
    macWorld[k].y = nodeC.y + my * sc;
    macWorld[k].z = nodeC.z + mz * sc;
  }

  /* 抗原:撒入 → 随流进结 → 被吞噬 */
  agCd -= dts;
  let activeN = 0;
  for (const a of antigens) if (a.on) activeN++;
  if (fInf && agCd <= 0 && activeN < 8) {
    const a = antigens.find(x => !x.on);
    if (a) {
      a.on = true; a.s = 0; a.mode = 0; a.ph = Math.random() * 6.28; a.r = 0.3 + Math.random() * 0.35;
      a.g.position.set(-3.0 + Math.random() * 0.4, 1.15 + (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3);
      a.g.visible = true; agCd = 0.8;
    }
  }
  for (const a of antigens) {
    if (!a.on) continue;
    if (a.mode === 0) {
      a.s += dts * (0.03 + 0.18 * openAmt + 0.02);
      if (a.s >= 0.97) a.mode = 1;
      const s = a.s;
      a.g.position.set(-2.35 + s * 6.3, 1.15 + Math.max(0, (s - 0.85) / 0.15) * 0.3, Math.sin(tSim * 1.5 + a.ph) * 0.1);
    } else {
      const aa = tSim * 0.5 + a.ph;
      a.g.position.set(nodeC.x + Math.cos(aa) * a.r, nodeC.y + Math.sin(aa * 0.9) * 0.4, nodeC.z + Math.sin(aa) * a.r * 0.8);
    }
    a.g.rotation.y += dts * 2;
    for (let k = 0; k < 3; k++) {
      const m = macWorld[k];
      if (a.g.position.distanceTo(V1.set(m.x, m.y, m.z)) < 0.3) {
        a.on = false; a.g.visible = false; engulfed++;
        break;
      }
    }
  }

  /* 应答度:侦察到抗原(吞噬≥2)后攀升 */
  if (fInf && engulfed >= 2) resp = Math.min(100, resp + dts * 15);
  else resp = Math.max(0, resp - dts * 9);

  /* stats */
  const elSAcc = document.getElementById('sAcc'), elSLym = document.getElementById('sLym'),
    elSNode = document.getElementById('sNode'), elSEd = document.getElementById('sEd');
  elSAcc.textContent = (accum >= 0 ? '+' : '') + accum.toFixed(1);
  elSLym.textContent = flow.toFixed(1);
  elSNode.textContent = Math.round(resp) + '%';
  elSEd.textContent = Math.round(edema) + '%';
  elSAcc.classList.toggle('warn', accum > 0.2);
  elSAcc.classList.toggle('hot', accum < -0.05);
  elSNode.classList.toggle('hot', resp > 5);
  elSEd.classList.toggle('warn', edema > 20);

  /* 标签 */
  for (const r of labelRegistry) {
    const vis = tglLabels.checked && r.show();
    r.o.element.style.display = vis ? '' : 'none';
    if (vis) r.o.element.textContent = r.text();
  }
  lblGC.element.classList.toggle('e', resp >= 3);

  /* 步骤高亮 + 相位滑块 */
  const si = stepIndex(fBlk);
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  if (PH !== lastPH) {
    lastPH = PH;
    elPhase.value = PH;
    elPhaseVal.textContent = PH + '/6';
  }

  /* 相机目标缓移 */
  if (tween > 0) { tween -= dt; controls.target.lerp(camGoal, clamp(dt * 3, 0, 1)); }
}
function frame() {
  rafId = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * speed * (playing ? 1 : 0);
  tSim += dts;
  tick(dts, dt);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(rafId); rafId = 0; }
  else if (!rafId) { clock.getDelta(); rafId = requestAnimationFrame(frame); }
});

applyTheme();
applyLang();
setPlayLabel();
updateActionBtns();
{
  const t0 = parseInt(qs.get('t'));
  if (Number.isFinite(t0)) jumpStep(clamp(t0, 1, 6) - 1);
}
rafId = requestAnimationFrame(frame);
</script>

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div'); /* panelFadeJS */
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
</body>
