{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

/* ---- renderer ---- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,4000);
camera.position.set(-7,6,13);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=1.5; controls.maxDistance=120;
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const key=new THREE.DirectionalLight(0xfff2dd,1.6); key.position.set(6,10,8); scene.add(key);
const fill=new THREE.DirectionalLight(0x88aaff,0.4); fill.position.set(-8,-4,-6); scene.add(fill);

/* ---- 物理：Clohessy–Wiltshire（希尔）方程 ----
   目标在半径 a=6778 km 的圆轨道（≈ISS），n=√(μ/a³)=1.132e-3 rad/s。
   相对运动（x=径向外，y=航向）：ẍ=2nẏ+3n²x，ÿ=−2nẋ。RK4，h=0.5 s。
   场景 1 单位 = 100 m。轨道高度差 Δa=2Δε/(a·n²)，
   Δε=V·v_y+(μ/a²)·x（V=n·a=7.66 km/s）——后喷减速时 Δa<0 而接近速度>0：
   「刹车才是油门」的数值证据。 */
const MU=398600.4418, AORB=6778.0, N=Math.sqrt(MU/Math.pow(AORB,3)); // km,km/s
const VKA=N*AORB, GRAV=MU/(AORB*AORB); // km/s, km/s²
let rx=0,ry=-400,vx=0,vy=0; // m，m/s：追踪船相对目标（后方 400 m）
let timeK=120, dvUnit=0.5;
let playing=true, status='approach', demoStage=0, autoOn=false, missionT=0;
let simAbs=0; // RK4 内部秒
const Q=new URLSearchParams(location.search);
playing=!Q.has('pause');
let labelsOn=Q.get('labels')!=='0';
if(Q.get('speed'))timeK=clamp(+Q.get('speed')||120,10,300);

function stepSim(h){
  const s=[rx,ry,vx,vy],n2=N;
  const f=(st)=>[st[2],st[3],2*n2*st[3]+3*n2*n2*st[0],-2*n2*st[2]];
  const k1=f(s);
  const s2=s.map((v,i)=>v+k1[i]*h/2);
  const k2=f(s2);
  const s3=s.map((v,i)=>v+k2[i]*h/2);
  const k3=f(s3);
  const s4=s.map((v,i)=>v+k3[i]*h);
  const k4=f(s4);
  for(let i=0;i<4;i++)s[i]+=h*(k1[i]+2*k2[i]+2*k3[i]+k4[i])/6;
  rx=s[0];ry=s[1];vx=s[2];vy=s[3];
}
function burn(dxr,dyr){ // Δv m/s：dxr 径向，dyr 航向
  vx+=dxr;vy+=dyr;
  rcsFlash(dxr,dyr);
}

/* ---- 3D 场景：1 单位=100 m；+X=航向，+Y=径向外 ---- */
const worldG=new THREE.Group(); scene.add(worldG);
/* 目标空间站 */
const stationG=new THREE.Group();
{
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,1.6,16),
    new THREE.MeshStandardMaterial({color:0xb8c4d4,roughness:0.4,metalness:0.6}));
  body.rotation.z=Math.PI/2;stationG.add(body);
  const panelM=new THREE.MeshStandardMaterial({color:0x2a4a8a,roughness:0.35,metalness:0.4,side:THREE.DoubleSide});
  const p1=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.02,0.7),panelM);p1.position.set(-1.5,0,0);stationG.add(p1);
  const p2=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.02,0.7),panelM);p2.position.set(1.5,0,0);stationG.add(p2);
  const port=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.3,12),
    new THREE.MeshStandardMaterial({color:0xffa94d,emissive:0x93480f,roughness:0.4}));
  port.rotation.z=Math.PI/2;port.position.set(-0.95,0,0);stationG.add(port);
}
worldG.add(stationG);
/* 追踪船 */
const chaserG=new THREE.Group();
{
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.13,0.5,6,12),
    new THREE.MeshStandardMaterial({color:0xd8dee8,roughness:0.35,metalness:0.55}));
  body.rotation.z=Math.PI/2;chaserG.add(body);
  const sol=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.015,0.3),
    new THREE.MeshStandardMaterial({color:0x30507f,roughness:0.4,metalness:0.4,side:THREE.DoubleSide}));
  sol.position.y=-0.02;chaserG.add(sol);
}
worldG.add(chaserG);
/* 相对轨迹尾迹 */
const TRMAX=700;
const trailPos=new Float32Array(TRMAX*3);
const trailGeo=new THREE.BufferGeometry();
trailGeo.setAttribute('position',new THREE.BufferAttribute(trailPos,3));
trailGeo.setDrawRange(0,0);
worldG.add(new THREE.Line(trailGeo,new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.85})));
let trailN=0;
/* 速度矢量箭头 */
const velArr=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,0x74c0fc,0.35,0.2);
worldG.add(velArr);
/* 对接走廊：从目标沿 -X 的两条虚线 */
{
  const mat=new THREE.LineDashedMaterial({color:0x74c0fc,dashSize:0.25,gapSize:0.18,transparent:true,opacity:0.5});
  const mk=z=>{const g=new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(-4.5,0,z),new THREE.Vector3(-0.6,0,z)]);
    const l=new THREE.Line(g,mat);l.computeLineDistances();worldG.add(l);};
  mk(0.9);mk(-0.9);
}
/* RCS 喷流 */
const rcs=[];
for(let i=0;i<2;i++){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({color:0xcfe8ff,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  s.scale.setScalar(0.5);chaserG.add(s);rcs.push(s);
}
function rcsFlash(dxr,dyr){
  const s=rcs[Math.random()<0.5?0:1];
  s.material.opacity=0.9;
  s.position.set(dxr>0?-0.5:dxr<0?0.5:0, dyr>0?-0.15:0.15, 0);
  /* 喷流方向与推力相反（简化视觉） */
}
/* 地平线示意（尺度压缩，仅为空间感） */
{
  const earth=new THREE.Mesh(new THREE.SphereGeometry(90,40,28),
    new THREE.MeshStandardMaterial({color:0x1d3a5f,roughness:0.85}));
  earth.position.set(0,-96.5,0);scene.add(earth);
  const atmo=new THREE.Mesh(new THREE.SphereGeometry(92.5,40,28),
    new THREE.MeshBasicMaterial({color:0x5f9fdf,transparent:true,opacity:0.14,side:THREE.BackSide}));
  atmo.position.copy(earth.position);scene.add(atmo);
}
/* 星空 */
{const n=800,p=new Float32Array(n*3);
 for(let i=0;i<n;i++){const r=800+Math.random()*600,t=Math.random()*6.283,u=Math.random()*2-1,ss=Math.sqrt(1-u*u);
   p[i*3]=r*ss*Math.cos(t);p[i*3+1]=r*u;p[i*3+2]=r*ss*Math.sin(t);}
 const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.BufferAttribute(p,3));
 scene.add(new THREE.Points(gg,new THREE.PointsMaterial({color:0x3a4a5e,size:1.4,sizeAttenuation:false})));}

/* ---- 标签 ---- */
const labelReg=[];
function addLabel(textFn,pos,cls,visFn,parent){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);(parent||worldG).add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('目标空间站（原点）','Target station (origin)'),new THREE.Vector3(0,0.9,0),'b',()=>true);
const chLblPos=new THREE.Vector3();
addLabel(()=>L('追踪船','Chaser'),chLblPos,'o',()=>true);
addLabel(()=>L('对接走廊','Docking corridor'),new THREE.Vector3(-3.2,0.35,0.9),'g',()=>true);
addLabel(()=>L('← 航向 +y（速度方向）','← along-track +y (prograde)'),new THREE.Vector3(4.6,0,0),'o',()=>true);
addLabel(()=>L('↑ 径向 +x（背地）','↑ radial +x (out)'),new THREE.Vector3(0,4.4,0),'b',()=>true);
addLabel(()=>L('地平线示意（尺度已压缩）','Horizon (scale compressed)'),new THREE.Vector3(0,-8.5,0),'r',()=>true);

/* ---- UI ---- */
const STEPS=[
 {zh:'同轨追不上：同高度前喷加速 → 轨道抬高 → 周期变长 → 反而越落越远',en:'Same orbit, no catch-up: prograde burn raises the orbit, lengthens the period — you fall behind',
  act(){resetSim();}},
 {zh:'刹车才是油门：后喷降轨，能量换角速度，从低轨悄悄追上前方的目标',en:'Braking is the accelerator: retro burn drops to a faster lower orbit and sneaks up ahead',
  act(){resetSim();playing=true;syncPlay();}},
 {zh:'希尔方程：ẍ=2nẏ+3n²x——相对轨迹是一朵绕目标滚动的「涟漪花瓣」',en:'Hill equations: ẍ=2nẏ+3n²x — the relative path rolls around the target like a petal',
  act(){resetSim();burn(-dvUnit*2,0);}},
 {zh:'相位调整：径向喷气改变会合时机，把相遇点挪进对接走廊',en:'Phasing: radial burns retune the meeting point into the docking corridor',
  act(){resetSim();burn(0,-dvUnit*2);}},
 {zh:'末段速度匹配：走廊内把接近速度压到 0.35 m/s 以下——像并列飞行一样靠近',en:'Final approach: null the closing rate below 0.35 m/s — fly alongside, then soft-contact',
  act(){resetSim();rx=-15;ry=-8;vx=0;vy=0.02;}},
 {zh:'实战：联盟号 / 龙飞船的 V-bar、R-bar 绕鱼眼接近——先绕后停，逐步收敛',en:'In practice: Soyuz / Crew Dragon V-bar & R-bar fly-around — orbit, stop, converge, contact',
  act(){resetSim();autoOn=true;document.getElementById('bAuto').classList.add('on');}}
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{activeStep=i;syncSteps();STEPS[i].act();});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function resetSim(){
  rx=0;ry=-400;vx=0;vy=0;missionT=0;status='approach';
  trailN=0;trailGeo.setDrawRange(0,0);demoStage=0;
  document.getElementById('bAuto').classList.remove('on');
}
function syncPlay(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
function updateStats(){
  const dist=Math.hypot(rx,ry);
  const closing=dist>0.01?-(rx*vx+ry*vy)/dist:0;
  /* Δε=V·vy+(μ/a²)·x → Δa=2Δε/(a n²)；V、μ、a 用 km，x/v 换算 km */
  const dEps=VKA*(vy/1000)+GRAV*(rx/1000);
  const da=2*dEps/(AORB*N*N)*1000; // → 米
  document.getElementById('stD').innerHTML=dist.toFixed(dist<100?1:0)+'<small> m</small>';
  const vEl=document.getElementById('stV');
  vEl.innerHTML=(closing>0?'+':'')+closing.toFixed(2)+'<small> m/s</small>';
  vEl.className='v'+(closing>0.6?' bad':closing>0?'':' ok');
  document.getElementById('stA').innerHTML=(da>0?'+':'')+da.toFixed(0)+'<small> m</small>';
  const sEl=document.getElementById('stS');
  if(status==='docked'){sEl.innerHTML=L('成功对接 ✓','DOCKED ✓');sEl.className='v ok';}
  else if(status==='crash'){sEl.innerHTML=L('坠毁 ✕','CRASH ✕');sEl.className='v bad';}
  else sEl.innerHTML=L(autoOn?'GNC 自动':'手动/漂移',autoOn?'GNC auto':'manual/drift');
}
document.getElementById('bFwd').addEventListener('click',()=>burn(0,dvUnit));
document.getElementById('bBack').addEventListener('click',()=>burn(0,-dvUnit));
document.getElementById('bDown').addEventListener('click',()=>burn(-dvUnit,0));
document.getElementById('bUp').addEventListener('click',()=>burn(dvUnit,0));
document.getElementById('bAuto').addEventListener('click',()=>{autoOn=!autoOn;
  document.getElementById('bAuto').classList.toggle('on',autoOn);});
document.getElementById('bReset').addEventListener('click',()=>{resetSim();syncPlay();});
document.getElementById('sDv').addEventListener('input',e=>{dvUnit=+e.target.value;
  document.getElementById('sDvVal').textContent=dvUnit.toFixed(2)+' m/s';});
document.getElementById('sK').addEventListener('input',e=>{timeK=+e.target.value;
  document.getElementById('sKVal').textContent=timeK+'×';});
document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlay();});
document.getElementById('tglLabels').addEventListener('change',e=>{labelsOn=e.target.checked;});
document.getElementById('tglSpin').addEventListener('change',e=>{controls.autoRotate=e.target.checked;});
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';
  localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  scene.background=new THREE.Color(THEME==='dark'?0x07090c:0xdde6ee);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();syncPlay();
  document.getElementById('sDvVal').textContent=dvUnit.toFixed(2)+' m/s';
  document.getElementById('sKVal').textContent=timeK+'×';
}

/* ---- 简单比例导引（演示级 GNC）---- */
let gncT=0;
function gncTick(){
  const dist=Math.hypot(rx,ry);
  const closing=dist>0.01?-(rx*vx+ry*vy)/dist:0;
  const des=dist>150?0.9:dist>40?0.35:0.06;
  /* 航向：把接近速度调到 des（目标在 +y 一侧时向前赶，反之制动） */
  const toward=ry>0?1:-1;
  const need=clamp(des-closing,-dvUnit,dvUnit);
  if(Math.abs(need)>0.02)burn(0,toward*need);
  /* 径向：压掉 vx */
  if(Math.abs(vx)>0.03)burn(-clamp(vx,-dvUnit,dvUnit),0);
}

/* ---- 主循环 ---- */
const clock=new THREE.Clock();let raf=null,acc=0;
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  if(playing&&status==='approach'){
    /* 招牌演示（两段式，按 CW 真实动力学编排）：
       ① 刹车 0.1 m/s 降轨——先略微落后下沉，随后以 +0.3 m/s 漂移追赶；
       ② 沿迹距缩短到 170 m 内时前喷 0.1 m/s 抬回同高，逼近目标留给你收尾 */
    if(!autoOn&&demoStage===0&&missionT>1.2){demoStage=1;burn(0,-0.1);}
    if(!autoOn&&demoStage===1&&ry>-170&&rx<-25){demoStage=2;burn(0,0.1);}
    if(autoOn){gncT+=dt;if(gncT>0.4){gncT=0;gncTick();}}
    let rem=dt*timeK;missionT+=dt*timeK;
    while(rem>1e-6){const h=Math.min(rem,0.5);stepSim(h);rem-=h;}
    const dist=Math.hypot(rx,ry);
    const speed=Math.hypot(vx,vy);
    if(dist<6&&speed<0.5){status='docked';playing=false;syncPlay();}
    else if(dist<6&&speed>=0.5){status='crash';playing=false;syncPlay();}
  }
  /* 渲染同步：场景 X=航向 y，Y=径向 x */
  chaserG.position.set(ry/100,rx/100,0);
  chLblPos.copy(chaserG.position).add(new THREE.Vector3(0,0.55,0));
  const vs=new THREE.Vector3(vy/100,vx/100,0);
  velArr.position.copy(chaserG.position);
  velArr.setDirection(vs.lengthSq()>1e-10?vs.clone().normalize():new THREE.Vector3(1,0,0));
  velArr.setLength(clamp(vs.length(),0.4,2.6),0.4,0.18);
  if(playing&&(status==='approach')){
    if(trailN<TRMAX){trailPos[trailN*3]=chaserG.position.x;
      trailPos[trailN*3+1]=chaserG.position.y;trailPos[trailN*3+2]=0;trailN++;}
    else{trailPos.copyWithin(0,3);trailPos[TRMAX*3-3]=chaserG.position.x;
      trailPos[TRMAX*3-2]=chaserG.position.y;trailPos[TRMAX*3-1]=0;}
    trailGeo.setDrawRange(0,trailN);
    trailGeo.attributes.position.needsUpdate=true;
  }
  for(const s of rcs)s.material.opacity=Math.max(0,s.material.opacity-dt*3);
  acc+=dt;if(acc>0.1){acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();
    if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---- 初始化 ---- */
applyTheme();applyLang();updateStats();start();
</script>
</body>
</html>
