<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>卡诺循环 · 热机效率的理论天花板</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d95d4a;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b34232;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--cv-text); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lbl.red   { border-color: rgba(217,93,74,.9);  color: #ffb3ab; }
  .lbl.blue  { border-color: rgba(127,208,247,.9); color: #bfe6fb; }
  .lbl.st    { border-color: rgba(255,209,102,.75); color: #ffe3a1; font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.red  { color: #b34232; }
  :root[data-theme="light"] .lbl.blue { color: #17708f; }
  :root[data-theme="light"] .lbl.st   { color: #8a6d1f; }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;

  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  /* ===== pV HUD(右下,仿 heart-cycle 曲线叠加) ===== */
  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 356px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(6px); padding: 8px 12px 10px; box-shadow: var(--shadow); }
  #plot h3 { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 2px; }
  #plotCv { width: 100%; height: 208px; display: block; }
  #stats { display: grid; grid-template-columns: auto auto; gap: 3px 16px;
    margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--panel-border); }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.eta { color: #d95d4a; }
  :root[data-theme="light"] #stats .v.eta { color: #b34232; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h  { color: #ffaaa2; border-color: rgba(255,138,128,.7); }
  .chip.c  { color: #9adcf2; border-color: rgba(127,208,247,.7); }
  .chip.w  { color: #7ee2ae; border-color: rgba(67,209,124,.6); }
  :root[data-theme="light"] .chip.h  { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.c  { color: #17708f; border-color: rgba(23,112,143,.7); }
  :root[data-theme="light"] .chip.w  { color: #148a5c; border-color: rgba(20,138,92,.6); }
  #tempRows { margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(217,93,74,.12); border-color: rgba(217,93,74,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(179,66,50,.10); border-color: rgba(179,66,50,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;

  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;

  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;

  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);

  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);

  @media (max-width: 900px) { #plot { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool  = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

/* ---------------- 主题 / 语言（全站共享模式） ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

/* ---------------- 热力学状态（与原 2D 页同一模型） ---------------- */
let TH = 600, TC = 300;      // 高/低温热源(K)
const GAM = 5 / 3;           // 单原子理想气体
const VA = 1, VB = 2;        // A→B 等温膨胀 V:1→2
let VC = 1, VD = 1;          // 由 Tₕ/T꜀ 决定,tempChanged() 里重算
function stateAt(f) {        // f∈[0,1) 一整圈;返回 {V, p, T, leg}
  const g = GAM;
  if (f < 0.28) {                     // A→B 等温膨胀 (Tₕ)
    const k = f / 0.28, V = lerp(VA, VB, k);
    return { V, p: TH / V, T: TH, leg: 0 };
  }
  if (f < 0.50) {                     // B→C 绝热膨胀
    const k = ss(0.28, 0.50, f), V = lerp(VB, VC, k);
    return { V, p: (TH / VB) * Math.pow(VB / V, g), T: TH * Math.pow(VB / V, g - 1), leg: 1 };
  }
  if (f < 0.72) {                     // C→D 等温压缩 (T꜀)
    const k = 1 - (f - 0.50) / 0.22, V = lerp(VD, VC, k);
    return { V, p: TC / V, T: TC, leg: 2 };
  }
  {                                    // D→A 绝热压缩:p·V^γ = p_D·V_D^γ
    const k = ss(0.72, 0.94, f), V = lerp(VD, VA, k);
    const pd = TC / VD;
    return { V, p: pd * Math.pow(VD / V, g), T: TC * Math.pow(VD / V, g - 1), leg: 3 };
  }
}

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141b);  // 初值;applyTheme() 会按主题重设

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(41, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.9, 2.6, 5.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.35, 0.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 18;
controls.maxPolarAngle = 1.66;
controls.autoRotateSpeed = 0.5;

/* ---------------- 灯光 ---------------- */
scene.add(new THREE.HemisphereLight(0x9db4d6, 0x35322c, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.3);
key.position.set(4.5, 8, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 8;  key.shadow.camera.bottom = -6;
key.shadow.camera.far = 25;
key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

/* ---------------- 材质 ---------------- */
const M = {
  steel:  new THREE.MeshStandardMaterial({ color: 0xc9ced6, metalness: 0.9,  roughness: 0.32 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x525a66, metalness: 0.75, roughness: 0.45 }),
  brass:  new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 0.85, roughness: 0.35 }),
  piston: new THREE.MeshStandardMaterial({ color: 0xd6dade, metalness: 0.85, roughness: 0.3 }),
  liner:  new THREE.MeshStandardMaterial({ color: 0xa9c4dc, transparent: true, opacity: 0.14,
            depthWrite: false, metalness: 0.4, roughness: 0.35, side: THREE.DoubleSide }),
  insul:  new THREE.MeshStandardMaterial({ color: 0x8b9098, metalness: 0.1, roughness: 0.85 }),
};
const plateMat = new THREE.MeshStandardMaterial({ color: 0xb9c2cd, metalness: 0.85, roughness: 0.3,
  emissive: 0xff4a30, emissiveIntensity: 0 });
const hotMat  = new THREE.MeshStandardMaterial({ color: 0xc23a28, metalness: 0.45, roughness: 0.42,
  emissive: 0xff4a30, emissiveIntensity: 0.3 });
const coldMat = new THREE.MeshStandardMaterial({ color: 0x2f7fc4, metalness: 0.45, roughness: 0.42,
  emissive: 0x1c6fbf, emissiveIntensity: 0.28 });

function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...(opts.pos ?? [0, 0, 0]));
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.order) m.renderOrder = opts.order;
  m.castShadow = !!opts.cast;
  m.receiveShadow = !!opts.recv;
  if (opts.parent) opts.parent.add(m); else scene.add(m);
  return m;
}

/* ---------------- 几何常量:水平气缸 + 曲柄滑块 ---------------- */
const R = 0.5, ROD = 1.6;      // 曲柄半径 / 连杆长
const XC = 3.0;                // 曲轴中心 x
const XH = 0;                  // 缸头导热板内表面 x
const dOf = phi => {           // 滑块到曲轴中心距离(标准曲柄滑块)
  const s = Math.sin(phi);
  return R * Math.cos(phi) + Math.sqrt(ROD * ROD - R * R * s * s);
};
function crankPhi(d, upper) {  // 由 d 反解曲柄角;upper: φ∈[π,2π] 半圈(膨胀),否则 [0,π]
  let a = upper ? Math.PI : 0, b = upper ? TAU : Math.PI;
  for (let i = 0; i < 22; i++) {
    const m = (a + b) / 2;
    if (upper) { if (dOf(m) < d) a = m; else b = m; }
    else       { if (dOf(m) > d) a = m; else b = m; }
  }
  return (a + b) / 2;
}

/* ---------------- 底座 / 气缸(静态) ---------------- */

const plotCv = document.getElementById('plotCv');
const stE = document.getElementById('stE'), stW = document.getElementById('stW');
let showLabels = true;
function drawPlot(t01) {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const ML = 56, MR = 18, MT = 18, MB = 40;
  const VLO = 0.75, VHI = VC * 1.12, PHI = TH * 1.18, PLO = (TC / VC) * 0.55;
  const px = V => ML + (W - ML - MR) * (Math.log(V) - Math.log(VLO)) / (Math.log(VHI) - Math.log(VLO));
  const py = p => H - MB - (H - MT - MB) * (p - PLO) / (PHI - PLO);
  // 网格 + 坐标轴
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    const gx = ML + (W - ML - MR) * i / 5, gy = MT + (H - MT - MB) * i / 5;
    ctx.beginPath(); ctx.moveTo(gx, MT); ctx.lineTo(gx, H - MB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ML, gy); ctx.lineTo(W - MR, gy); ctx.stroke();
  }
  ctx.strokeStyle = PAL.axis; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(ML, H - MB); ctx.lineTo(W - MR + 8, H - MB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ML, H - MB); ctx.lineTo(ML, MT - 8); ctx.stroke();
  ctx.font = `500 19px system-ui`; ctx.fillStyle = PAL.dim2; ctx.textAlign = 'center';
  ctx.fillText(L('V (体积)', 'V (volume)'), W - MR - 40, H - MB + 32);
  ctx.fillText(L('p (压强)', 'p (pressure)'), ML + 34, MT - 2);
  // 四段:红等温 / 灰绝热 / 蓝等温 / 灰绝热
  const seg = (f0, f1, col, lw) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath();
    for (let i = 0; i <= 50; i++) {
      const s = stateAt(lerp(f0, f1, i / 50));
      i ? ctx.lineTo(px(s.V), py(s.p)) : ctx.moveTo(px(s.V), py(s.p));
    }
    ctx.stroke();
  };
  seg(0, 0.28, '#ff8a80', 4);      // A→B 热
  seg(0.28, 0.50, '#b8c2cf', 2.6); // B→C 绝热
  seg(0.50, 0.72, '#7fd0f7', 4);   // C→D 冷
  seg(0.72, 0.94, '#b8c2cf', 2.6); // D→A 绝热
  // 角标 A/B/C/D
  ctx.font = `700 21px system-ui`; ctx.fillStyle = PAL.dim;
  ctx.fillText('A', px(VA) + 18, py(TH) - 8);
  ctx.fillText('B', px(VB) + 18, py(TH / 2) - 8);
  ctx.fillText('C', px(VC) - 6, py(TC / VC) + 30);
  ctx.fillText('D', px(VD) - 18, py(TC / VD) + 28);
  if (showLabels) {
    ctx.font = `700 18px system-ui`;
    ctx.fillStyle = '#ff8a80';
    ctx.fillText(L('吸热 Qₕ(等温 Tₕ)', 'Qₕ in (isothermal Tₕ)'), (px(1) + px(2)) / 2, py(TH / 1.35) - 10);
    ctx.fillStyle = '#7fd0f7';
    ctx.fillText(L('放热 Q꜀(等温 T꜀)', 'Q꜀ out (isothermal T꜀)'), (px(VD) + px(VC)) / 2 - 26, py(TC * 1.5) + 30);
    ctx.font = `500 17px system-ui`; ctx.fillStyle = PAL.dim2;
    ctx.fillText(L('绝热:不吸不放', 'adiabats: no heat'), px(VC) - 40, py((TH / 2) * Math.pow(2 / VC, GAM) * 0.72));
  }
  // 动点(金色)+ 当前冲程标注
  const s = t01 < 0.94 ? stateAt(t01) : stateAt(0);
  const X = px(s.V), Y = py(s.p);
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 16;
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(X, Y, 8, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.font = `700 19px system-ui`; ctx.fillStyle = '#ffd166'; ctx.textAlign = 'left';
  ctx.fillText(L(...LEG_TXT[s.leg]), clamp(X + 16, ML, W - MR - 190), clamp(Y - 14, MT + 12, H - MB));
}

/* ---------------- 每帧更新 ---------------- */
function updateWorld(t, dt) {
  const s = t < 0.94 ? stateAt(t) : stateAt(0);
  const hot = clamp((s.T - TC) / Math.max(TH - TC, 1), 0, 1);

  /* 曲柄滑块:由 V 定活塞位置,反解曲柄角(连续转动) */
  const k = clamp(Math.log(s.V) / Math.log(VC), 0, 1);
  const d = (ROD - R) + 2 * R * k;
  const phi = crankPhi(d, t < 0.5);
  crankGrp.rotation.z = Math.PI - phi;
  const pinX = XC - d;
  pistonGrp.position.x = pinX;
  const cpx = XC - R * Math.cos(phi), cpy = R * Math.sin(phi);
  const dx = pinX - cpx, dy = -cpy;
  const len = Math.hypot(dx, dy);
  rodBeam.position.set((cpx + pinX) / 2, cpy / 2, 0);
  rodBeam.scale.y = len;
  rodBeam.quaternion.setFromUnitVectors(V3(0, 1, 0), V3(dx / len, dy / len, 0));
  bigEnd.position.set(cpx, cpy, 0);
  smallEnd.position.set(pinX, 0, 0);

  /* 气体:气柱 + 点光源 + 粒子,颜色随 T、活跃度随 T 升高 */
  const crown = pinX - 0.38;
  const gasLen = Math.max(0.08, crown - 0.06);
  gasMesh.position.x = (0.06 + crown) / 2;
  gasMesh.scale.y = gasLen;
  gasMat.color.copy(C_COLD).lerp(C_HOT, hot);
  gasMat.opacity = 0.16 + 0.14 * hot;
  gasLight.position.set((0.06 + crown) / 2, 0, 0);
  gasLight.color.copy(gasMat.color);
  gasLight.intensity = 0.3 + 0.9 * hot;
  const wsp = 0.55 + 1.5 * hot;
  for (let i = 0; i < N; i++) {
    const p = parts[i];
    const aa = p.ang + tWall * p.w3 * p.dir * wsp;
    const rr = clamp(p.rad + 0.05 * Math.sin(tWall * p.w2 * wsp + p.s2), 0, 0.6);
    const xx = 0.07 + p.u * Math.max(gasLen - 0.14, 0.02) + 0.03 * Math.sin(tWall * p.w1 * wsp + p.s1);
    _v.set(xx, rr * Math.cos(aa), rr * Math.sin(aa));
    _s.setScalar(p.sc);
    pm.setMatrixAt(i, _m4.compose(_v, _q, _s));
    pm.setColorAt(i, _c.copy(C_COLD).lerp(C_HOT, hot).multiplyScalar(p.cj));
  }
  pm.instanceMatrix.needsUpdate = true;
  pm.instanceColor.needsUpdate = true;

  /* 热源滑台:等温贴上对应热源,绝热退回绝热垫并留缝 */
  let tx = GAP_X, ty = 0;
  if (s.leg === 0) { tx = CONTACT_X; ty = -1.05; }
  else if (s.leg === 2) { tx = CONTACT_X; ty = 1.05; }
  const a = 1 - Math.exp(-dt * 5);
  shuttle.position.x += (tx - shuttle.position.x) * a;
  shuttle.position.y += (ty - shuttle.position.y) * a;
  const press = 1 - clamp((shuttle.position.x - CONTACT_X) / (GAP_X - CONTACT_X), 0, 1);
  plateMat.emissive.setHex(s.leg === 2 ? 0x2f8fd4 : 0xff4a30);
  plateMat.emissiveIntensity = (s.leg === 0 || s.leg === 2) ? press * 0.55 : 0;
  hotMat.emissiveIntensity = 0.28 + 0.12 * Math.sin(tWall * 2.6);

  /* 热流箭头:等温时穿过导热板,Qₕ 进缸(红)/ Q꜀ 出缸(蓝) */
  const flow = (s.leg === 0 || s.leg === 2) && press > 0.55;
  arrowMat.color.setHex(s.leg === 0 ? 0xff8a66 : 0x7fc8ff);
  arrowMat.opacity = 0.25 + 0.65 * press;
  for (let i = 0; i < arrows.length; i++) {
    const m = arrows[i];
    m.visible = flow;
    if (!flow) continue;
    const dir = s.leg === 0 ? 1 : -1;
    const p = (tWall * 0.85 + i / arrows.length) % 1;
    m.position.set(dir > 0 ? lerp(-0.04, 0.5, p) : lerp(0.5, -0.04, p), m.userData.y, m.userData.z);
    m.rotation.z = dir > 0 ? -Math.PI / 2 : Math.PI / 2;
    m.scale.setScalar(0.35 + 0.75 * Math.sin(Math.PI * p));
  }

  /* 状态标签(随气体中点移动) */
  lblState.position.x = (0.06 + crown) / 2;
  lblState.element.textContent =
    `${L(...LEG_TXT[s.leg])} · ${statusTxt(s.leg)} · T = ${Math.round(s.T)} K`;
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
applyTheme();
tempChanged();
applyLang();
function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) { clock.getDelta(); return; }  // 标签页不可见时停渲染、丢弃 dt
  const dt = clamp(clock.getDelta(), 0, 0.05);
  tWall += dt;
  if (playing) cycles += dt * speed / 12;
  t01 = cycles - Math.floor(cycles);

  updateWorld(t01, dt);
  drawPlot(t01);

  const si = stepIndex(t01);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  elScrub.value = Math.round(t01 * 1000);
  elScrubVal.textContent = Math.round(t01 * 100) + '%';

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
updateWorld(cycles - Math.floor(cycles), 0.016);
requestAnimationFrame(frame);
</script>
</body>
</html>
