<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡诺循环 · 热机效率的理论天花板</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#d95d4a;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-bg:#10141b; --cv-grid:rgba(255,255,255,.07); --cv-axis:rgba(255,255,255,.22);
    --cv-cursor:rgba(255,255,255,.10); --cv-dim:#77828f; --cv-dim2:#8b97a8;
    --cv-text:#c7d2de; --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#b34232;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-bg:#eef1f6; --cv-grid:rgba(20,35,55,.10); --cv-axis:rgba(20,35,55,.38);
    --cv-cursor:rgba(20,35,55,.14); --cv-dim:#8593a3; --cv-dim2:#6b7a8a;
    --cv-text:#33414f; --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #cv { position: fixed; inset: 0; display: block; }
  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 400px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }
  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 12px; color: var(--text2); font-weight: 400; }
  #stats .v.eta { color: #d95d4a; }
  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 380px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 150px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.h  { color: #ffaaa2; border-color: rgba(255,138,128,.7); }
  .chip.c  { color: #9adcf2; border-color: rgba(127,208,247,.7); }
  .chip.w  { color: #7ee2ae; border-color: rgba(67,209,124,.6); }
  :root[data-theme="light"] .chip.h  { color: #b23b32; border-color: rgba(178,59,50,.7); }
  :root[data-theme="light"] .chip.c  { color: #17708f; border-color: rgba(23,112,143,.7); }
  :root[data-theme="light"] .chip.w  { color: #148a5c; border-color: rgba(20,138,92,.6); }
  #tempRows { margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 96px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(217,93,74,.12); border-color: rgba(217,93,74,.5); }
  :root[data-theme="light"] #steps li.on { background: rgba(179,66,50,.10); border-color: rgba(179,66,50,.45); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(128,140,155,.25); color: var(--text3); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">
  <h1 data-zh="卡诺循环：所有热机效率的天花板" data-en="The Carnot cycle: the efficiency ceiling of every heat engine">卡诺循环：所有热机效率的天花板</h1>
  <div class="sub" data-zh="等温吸热 → 绝热膨胀 → 等温放热 → 绝热压缩:pV 图上的黄金圈,η = 1 − T꜀/Tₕ 实时可拖 · 空格播放/暂停" data-en="Isothermal expansion → adiabatic expansion → isothermal compression → adiabatic compression: the golden loop on a pV diagram, η = 1 − T꜀/Tₕ live · Space = play/pause">等温吸热 → 绝热膨胀 → 等温放热 → 绝热压缩:pV 图上的黄金圈,η = 1 − T꜀/Tₕ 实时可拖 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="卡诺效率 η" data-en="Carnot efficiency η">卡诺效率 η</span><span class="v eta" id="stE">—<small> = 1 − T꜀/Tₕ</small></span>
  <span class="k" data-zh="本周期做功 W" data-en="Work per cycle W">本周期做功 W</span><span class="v" id="stW">—<small> (面积)</small></span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip h" data-zh="红:高温等温(吸热 Qₕ)" data-en="red: hot isothermal (Qₕ in)">红:高温等温(吸热 Qₕ)</span>
    <span class="chip c" data-zh="蓝:低温等温(放热 Q꜀)" data-en="blue: cold isothermal (Q꜀ out)">蓝:低温等温(放热 Q꜀)</span>
    <span class="chip w" data-zh="绝热:不吸不放" data-en="adiabats: no heat">绝热:不吸不放</span>
  </div>
  <div id="tempRows">
    <div class="row"><label data-zh="高温热源 Tₕ" data-en="Hot reservoir Tₕ">高温热源 Tₕ</label><input id="th" type="range" min="400" max="800" step="10" value="600"><span class="val" id="thVal">600 K</span></div>
    <div class="row"><label data-zh="低温热源 T꜀" data-en="Cold reservoir T꜀">低温热源 T꜀</label><input id="tc" type="range" min="250" max="350" step="5" value="300"><span class="val" id="tcVal">300 K</span></div>
  </div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="speed" type="range" min="0.1" max="3" step="0.05" value="1"><span class="val" id="speedVal">1.0×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglPiston" type="checkbox" checked> <span data-zh="活塞联动" data-en="Piston view">活塞联动</span></label>
  </div>
</div>

<script>
/* ================= 主题 / 语言（全站共享模式） ================= */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;
const PAL = {};

function applyTheme() {
  htmlEl.dataset.theme = THEME;
  const cs = getComputedStyle(htmlEl);
  for (const [k, v] of Object.entries({ bg:'--cv-bg', grid:'--cv-grid', axis:'--cv-axis',
      cursor:'--cv-cursor', dim:'--cv-dim', dim2:'--cv-dim2', text:'--cv-text', pill:'--cv-pill' }))
    PAL[k] = cs.getPropertyValue(v).trim();
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('卡诺循环 · 热机效率的理论天花板', 'Carnot Cycle · the Efficiency Ceiling');
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ================= 画布（1600×900 虚拟坐标） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;
let dpr = 1, vs = 1, vox = 0, voy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  vs = Math.min(innerWidth / W, innerHeight / H);
  vox = (innerWidth - W * vs) / 2; voy = (innerHeight - H * vs) / 2;
}
addEventListener('resize', resize); resize();

/* ================= 工具 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function ss(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
function text(str, x, y, size, color, align = 'left', weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y);
}
function line(x1, y1, x2, y2, color, lw = 1, dash = null) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function circle(x, y, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

/* ================= 状态与热力学 ================= */
let TH = 600, TC = 300;      // 高/低温热源(K)
const GAM = 5 / 3;           // 单原子理想气体
let showLabels = true, showPiston = true;
let t01 = 0;

/* 循环四态(A→B 等温热, B→C 绝热, C→D 等温冷, D→A 绝热) */
const VA = 1;
const VC = 2 * Math.pow(TH / TC, 1 / (GAM - 1));
const VD = Math.pow(TH / TC, 1 / (GAM - 1));
function stateAt(f) {   // f∈[0,1) 一整圈;返回 {V, p, T, leg}
  const g = GAM;
  if (f < 0.28) {                     // A→B 等温膨胀 (Th)
    const k = f / 0.28, V = lerp(VA, 2, k);
    return { V, p: TH / V, T: TH, leg: 0 };
  }
  if (f < 0.50) {                     // B→C 绝热膨胀
    const k = ss(0.28, 0.50, f), V = lerp(2, VC, k);
    return { V, p: (TH / 2) * Math.pow(2 / V, g), T: TH * Math.pow(2 / V, g - 1), leg: 1 };
  }
  if (f < 0.72) {                     // C→D 等温压缩 (Tc)
    const k = 1 - (f - 0.50) / 0.22, V = lerp(VA * Math.pow(TH / TC, 1 / (g - 1)), VC, k);
    return { V, p: TC / V, T: TC, leg: 2 };
  }
  {                                    // D→A 绝热压缩
    const k = ss(0.72, 0.94, f), V = lerp(VD, VA, k);
    return { V, p: pOfAdiabDA(V), T: TC * Math.pow(VD / V, g - 1), leg: 3 };
  }
}
/* D→A 的压力用绝热关系精确给出:p·V^γ = p_D·V_D^γ */
function pOfAdiabDA(V) {
  const pd = TC / VD;
  return pd * Math.pow(VD / V, GAM);
}

/* ================= 相位讲解 ================= */
const STEPS = [
  { t0: 0.00, t1: 0.28, n: 1, b: '等温膨胀:吸热', d: '气体接触高温热源 Tₕ,等温膨胀推动活塞——吸热 Qₕ,全部用来对外做功(内能不变)。',
    be: 'Isothermal expansion', de: 'In contact with the hot reservoir Tₕ the gas expands isothermally, pushing the piston — it absorbs Qₕ and converts it entirely to work.' },
  { t0: 0.28, t1: 0.50, n: 2, b: '绝热膨胀:降温', d: '隔热后继续膨胀,靠消耗内能做功——温度从 Tₕ 滑到 T꜀,压强陡降。',
    be: 'Adiabatic expansion', de: 'Insulated, the gas keeps expanding on its own internal energy — temperature slides from Tₕ to T꜀ and pressure drops steeply.' },
  { t0: 0.50, t1: 0.72, n: 3, b: '等温压缩:放热', d: '接触低温热源 T꜀,外力等温压缩——把 Q꜀ 这份「必须扔掉的热」还给冷源。',
    be: 'Isothermal compression', de: 'In contact with the cold reservoir T꜀ the gas is compressed isothermally, dumping the unavoidable Q꜀ into the cold sink.' },
  { t0: 0.72, t1: 0.94, n: 4, b: '绝热压缩:回温', d: '再隔热压缩,温度从 T꜀ 拉回 Tₕ,回到起点——循环闭合。',
    be: 'Adiabatic compression', de: 'Insulated compression raises the temperature back from T꜀ to Tₕ, closing the loop.' },
  { t0: 0.94, t1: 1.00, n: 5, b: '效率天花板', d: 'η = 1 − T꜀/Tₕ,只由两个温度决定——卡诺定理:没有热机能超过它,四冲程只是它的粗糙实现。',
    be: 'The efficiency ceiling', de: 'η = 1 − T꜀/Tₕ depends only on the two temperatures — Carnot\'s theorem: no engine beats it; the four-stroke is just a crude implementation.' },
];
function stepIndex(t) {
  if (t < 0.28) return 0;
  if (t < 0.50) return 1;
  if (t < 0.72) return 2;
  if (t < 0.94) return 3;
  return 4;
}

/* ================= pV 坐标映射 ================= */
const PX0 = 190, PX1 = 890, PY0 = 130, PY1 = 720;
let VLO = 0.8, VHI = 8, PLO = 0.2, PHI = 10;
function setScale() {
  const vC = 2 * Math.pow(TH / TC, 1 / (GAM - 1));
  VLO = 0.75; VHI = vC * 1.12;
  PHI = TH * 1.18; PLO = (TC / vC) * 0.55;
}
const px = V => lerp(PX0, PX1, (Math.log(V) - Math.log(VLO)) / (Math.log(VHI) - Math.log(VLO)));
const py = p => lerp(PY1, PY0, (p - PLO) / (PHI - PLO));

/* ================= 绘制 ================= */
function drawAxes() {
  line(PX0, PY1, PX1 + 30, PY1, PAL.axis, 1.5);
  line(PX0, PY1, PX0, PY0 - 20, PAL.axis, 1.5);
  text('V (体积)', PX1 + 30, PY1 + 30, 13, PAL.dim2, 'center');
  text('p (压强)', PX0 - 14, PY0 - 32, 13, PAL.dim2, 'center');
}
function drawCycle() {
  setScale();
  const seg = (f0, f1, col, lw) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath();
    for (let i = 0; i <= 50; i++) {
      const s = stateAt(lerp(f0, f1, i / 50));
      const X = px(s.V), Y = py(s.p);
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    }
    ctx.stroke();
  };
  seg(0, 0.28, '#ff8a80', 3.5);      // A→B 热
  seg(0.28, 0.50, '#b8c2cf', 2.2);   // B→C 绝热
  seg(0.50, 0.72, '#7fd0f7', 3.5);   // C→D 冷
  seg(0.72, 0.94, '#b8c2cf', 2.2);   // D→A 绝热
  // 角标 A/B/C/D
  const corners = [[VA, 'A', 0], [2, 'B', 0.28], [VC, 'C', 0.50], [VD, 'D', 0.72]];
  for (const [V, s] of corners) {
    const p = s === 'A' ? TH : s === 'B' ? TH / 2 : s === 'C' ? TC / VC : TC / VD;
    text(s, px(V) + 16, py(p) - 10, 15, PAL.dim, 'center', 700);
  }
  if (showLabels) {
    text(L('吸热 Qₕ(等温 Tₕ)', 'Qₕ in (isothermal Tₕ)'), (px(1) + px(2)) / 2, py(TH / 1.35) - 12, 12.5, '#ff8a80', 'center', 700);
    text(L('放热 Q꜀(等温 T꜀)', 'Q꜀ out (isothermal T꜀)'), (px(VD) + px(VC)) / 2, py(TC * 1.5) + 26, 12.5, '#7fd0f7', 'center', 700);
    text(L('绝热:不吸不放', 'adiabats: no heat'), px(VC) + 30, py(TH / 2 / Math.pow(2 / VC, GAM) * 0.72), 11.5, PAL.dim2);
  }
}
function drawDot(t) {
  const s = t < 0.94 ? stateAt(t) : stateAt(0);
  const X = px(s.V), Y = py(s.p);
  dot(X, Y, 8, '#ffd166', 14);
  // 与活塞的连线
  if (showPiston) line(X, Y, 1210, 585, 'rgba(255,209,102,.35)', 1.2, [5, 5]);
  // 段落标签
  const legTxt = [
    L('① 等温膨胀:吸热 Qₕ', '① isothermal expansion: Qₕ in'),
    L('② 绝热膨胀:降温', '② adiabatic expansion: cooling'),
    L('③ 等温压缩:放热 Q꜀', '③ isothermal compression: Q꜀ out'),
    L('④ 绝热压缩:回温', '④ adiabatic compression: warming'),
  ][s.leg];
  if (showLabels) text(legTxt, X + 20, Y - 18, 13, '#ffd166', 'left', 700);
  function dot(x, y, r, c, g) {
    if (g) { ctx.shadowColor = c; ctx.shadowBlur = g; }
    circle(x, y, r, c, null);
    ctx.shadowBlur = 0;
  }
}
function drawPiston(t) {
  const s = t < 0.94 ? stateAt(t) : stateAt(0);
  const hot = clamp((s.T - TC) / Math.max(TH - TC, 1), 0, 1);
  const gasCol = `rgba(${Math.round(lerp(90, 235, hot))},${Math.round(lerp(140, 90, hot))},${Math.round(lerp(220, 70, hot))},.55)`;
  const X = 1130, Wc = 260, Hc = 190, Yc = 480;
  rrect2(X, Yc, Wc, Hc, 10, null, PAL.axis, 2);
  const k = (Math.log(s.V) - Math.log(VA)) / (Math.log(VC * 1.02) - Math.log(VA));
  const px2 = X + 26 + k * (Wc - 60);
  ctx.fillStyle = gasCol; ctx.fillRect(X + 4, Yc + 6, px2 - X - 4, Hc - 12);
  const piston = X + 26 + k * (Wc - 60);
  rrect2(piston, Yc + 4, 16, Hc - 8, 4, '#9aa7b8', PAL.axis, 1.5);
  line(piston + 8, Yc + Hc / 2, piston + 74, Yc + Hc / 2, '#9aa7b8', 5);
  circle(piston + 80, Yc + Hc / 2, 12, '#9aa7b8');
  // 热源符号
  const legNow = s.leg;
  if (legNow === 0) { text(L('Tₕ 热源:吸热 🔥', 'Tₕ: absorbing heat'), X + Wc / 2, Yc - 16, 13, '#ff8a80', 'center', 700); }
  else if (legNow === 2) { text(L('T꜀ 冷源:放热 🧊', 'T꜀: releasing heat'), X + Wc / 2, Yc - 16, 13, '#7fd0f7', 'center', 700); }
  else { text(L('隔热:Q = 0', 'insulated: Q = 0'), X + Wc / 2, Yc - 16, 13, PAL.dim2, 'center'); }
  const tLab = `T = ${Math.round(s.T)} K`;
  text(tLab, X + 24, Yc + Hc - 14, 13, '#fff', 'left', 700);
  function rrect2(a, b, c, d, e, f, g2, h2) {
    ctx.beginPath(); ctx.roundRect(a, b, c, d, e);
    if (f) { ctx.fillStyle = f; ctx.fill(); }
    if (g2) { ctx.strokeStyle = g2; ctx.lineWidth = h2; ctx.stroke(); }
  }
}
const stE = document.getElementById('stE'), stW = document.getElementById('stW');
function updateStats() {
  const eta = 1 - TC / TH;
  stE.innerHTML = (eta * 100).toFixed(1) + '<small>% = 1 − T꜀/Tₕ</small>';
  // 面积(做功)以格数近似:W ∝ 面积,相对值随温度变
  const area = (TH - TC) * Math.log(2) * 1;
  stW.innerHTML = area.toFixed(2) + '<small> 相对单位</small>';
}

/* ================= 主绘制 ================= */
function draw(t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  drawAxes();
  drawCycle();
  drawDot(t);
  if (showPiston) drawPiston(t);
}

/* ================= UI / 主循环 ================= */
let cycles = 0.0, playing = true, speed = 1;
const elPlay = document.getElementById('play');
const elSpeed = document.getElementById('speed');
const elSpeedVal = document.getElementById('speedVal');
const elTh = document.getElementById('th');
const elTc = document.getElementById('tc');
const elThVal = document.getElementById('thVal');
const elTcVal = document.getElementById('tcVal');
const elSteps = document.getElementById('steps');
const tglLabels = document.getElementById('tglLabels');
const tglPiston = document.getElementById('tglPiston');

function buildSteps() {
  elSteps.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => { cycles = Math.floor(cycles) + s.t0 + 0.003; });
    elSteps.appendChild(li);
  });
  [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === lastStep));
}
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
elSpeed.value = speed; elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
elSpeed.addEventListener('input', () => { speed = parseFloat(elSpeed.value); elSpeedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×'; });
function tempChanged() {
  TH = parseInt(elTh.value, 10); TC = parseInt(elTc.value, 10);
  if (TC >= TH - 40) { TC = TH - 40; elTc.value = TC; }
  elThVal.textContent = TH + ' K'; elTcVal.textContent = TC + ' K';
  updateStats();
}
elTh.addEventListener('input', tempChanged);
elTc.addEventListener('input', tempChanged);
tglLabels.addEventListener('change', () => { showLabels = tglLabels.checked; });
tglPiston.addEventListener('change', () => { showPiston = tglPiston.checked; });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
});

let lastStep = -1, last = performance.now();
applyTheme();
applyLang();
tempChanged();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) cycles += dt * speed / 12;
  t01 = cycles - Math.floor(cycles);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(vs * dpr, 0, 0, vs * dpr, vox * dpr, voy * dpr);
  draw(t01);

  const si = stepIndex(t01);
  if (si !== lastStep) {
    lastStep = si;
    [...elSteps.children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
}
requestAnimationFrame(frame);
</script>
