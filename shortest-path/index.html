<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导航与最短路径 · Dijkstra 波纹 vs A* 直觉</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#2ecf8f;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#0ca678;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1.25; padding: 4px 9px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s;
    font-variant-numeric: tabular-nums; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.s { border-color: rgba(46,207,143,.9); color: #a9f2d4; }
  .lbl.g { border-color: rgba(255,107,107,.9); color: #ffc9c9; }
  .lbl.st { border-color: rgba(77,171,247,.9); color: #cde6ff; font-size: 12.5px; }
  .lbl.fin { border-color: rgba(46,207,143,.95); color: #c6ffe6; font-size: 13px; padding: 6px 12px; }
  :root[data-theme="light"] .lbl.s { color: #0b7051; }
  :root[data-theme="light"] .lbl.g { color: #c03a3a; }
  :root[data-theme="light"] .lbl.st { color: #1864ab; }
  :root[data-theme="light"] .lbl.fin { color: #087a56; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.o { color: var(--acc); }
  #stats .v.b { color: #4dabf7; }
  #stats .v.a { color: #ffb84d; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 396px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #actions { display: flex; gap: 8px; margin-bottom: 6px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 9px; padding: 7px 8px; font-size: 12px; font-weight: 600;
    transition: border-color .15s, color .15s; }
  .abtn:hover { border-color: var(--acc); color: var(--text); }
  .abtn.hot { border-color: rgba(255,107,107,.55); }
  .abtn.hot:hover { color: #ff8787; border-color: #ff6b6b; }
  #pick { display: flex; gap: 6px; align-items: center; margin: 4px 0 2px; }
  #pick .plabel { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .seg { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: var(--hover); color: var(--text2); border: 1px solid var(--tool-border);
    border-radius: 8px; padding: 5px 0; font-size: 12px; font-weight: 600;
    transition: border-color .15s, color .15s; }
  .seg.on { border-color: var(--acc); color: var(--acc); background: rgba(46,207,143,.12); }
  :root[data-theme="light"] .seg.on { background: rgba(12,166,120,.10); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 92px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 56px; text-align: right;
    font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(46,207,143,.10); border-color: rgba(46,207,143,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(12,166,120,.08); border-color: rgba(12,166,120,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #8ce8c4; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="导航与最短路径:Dijkstra 波纹 vs A* 直觉" data-en="Navigation &amp; Shortest Paths: Dijkstra ripple vs A* instinct">导航与最短路径:Dijkstra 波纹 vs A* 直觉</h1>
  <div class="sub" data-zh="3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 — 路口=节点、街段=边、边权=通行分钟;Dijkstra 让等时波纹从起点扩散,确定一个点亮一个,终点确定即回溯出最短路;切到 A*:f = g + h 让波前直奔目标,探索路口大减;实时路况抬高边权,路径当场改道 · 点击路口换起/终点 · 空格播放/暂停" data-en="3D interactive demo · drag to orbit / scroll to zoom — intersections = nodes, street segments = edges, edge weight = minutes; Dijkstra floods equal-time ripples from the start and lights each node as it settles; when the goal settles, backtrack for the shortest path; switch to A*: f = g + h aims the wavefront at the goal with far fewer nodes explored; live traffic re-weights edges and the route re-routes on the spot · click intersections to move endpoints · Space = play/pause">3D 交互演示 · 鼠标拖动旋转 / 滚轮缩放 — 路口=节点、街段=边、边权=通行分钟;Dijkstra 让等时波纹从起点扩散,确定一个点亮一个,终点确定即回溯出最短路;切到 A*:f = g + h 让波前直奔目标,探索路口大减;实时路况抬高边权,路径当场改道 · 点击路口换起/终点 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="最短路总耗时" data-en="shortest total time">最短路总耗时</span><span class="v o" id="stCost">· · ·</span>
  <span class="k" data-zh="探索路口 · Dijkstra" data-en="nodes explored · Dijkstra">探索路口 · Dijkstra</span><span class="v b" id="stDij">—</span>
  <span class="k" data-zh="探索路口 · A*" data-en="nodes explored · A*">探索路口 · A*</span><span class="v a" id="stAst">—</span>
  <span class="k" data-zh="A* 少探" data-en="A* saves">A* 少探</span><span class="v o" id="stSave">—</span>
</div>

<div id="panel">
  <div id="actions">
    <button class="abtn" id="btnAlgo">切换到 A* →</button>
    <button class="abtn hot" data-zh="实时路况" data-en="Live traffic">实时路况</button>

    <span class="plabel" data-zh="点击路口设:" data-en="Click sets:">点击路口设:</span>
    <button class="seg on" id="segSrc" data-zh="起点 A" data-en="Start A">起点 A</button>
    <button class="seg" id="segDst" data-zh="终点 B" data-en="Goal B">终点 B</button>
  </div>
  <div class="row"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span class="val" id="spdVal">1.0×</span></div>
  <div class="row"><label data-zh="进度" data-en="Progress">进度</label><input id="prog" type="range" min="0" max="100" step="0.5" value="0"><span class="val" id="progVal">0/0</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div id="toggles" style="margin-top:0">
      <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
      <label><input id="tglRotate" type="checkbox"> <span data-zh="环绕视角" data-en="auto-orbit">环绕视角</span></label>
    </div>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>

    <a href="../sorting-race/" data-zh="同域:算法复杂度竞速" data-en="same domain: algorithm race">同域:算法复杂度竞速</a>
    <a href="../neural-gradient/" data-zh="同域:优化与下山" data-en="same domain: optimization">同域:优化与下山</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seedQs = parseInt(qs.get('seed'), 10);
let rng = mulberry32(Number.isFinite(seedQs) ? seedQs >>> 0 : (Math.random() * 2 ** 31) | 0);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.ground.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
  cEdgeBase.set(THEME === 'light' ? 0x93a1b0 : 0x5d6a78);
  cUnvisited.set(THEME === 'light' ? 0x9aa5b1 : 0x4c5664);
  cPath.set(THEME === 'light' ? 0x0ca678 : 0x2ecf8f);
  cGhost.set(THEME === 'light' ? 0xc98f92 : 0x8c5050);
  rippleMat.blending = THEME === 'light' ? THREE.NormalBlending : THREE.AdditiveBlending;
  rippleMat.needsUpdate = true;
  paintBlocks();
  paintEdges();
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('导航与最短路径', 'Navigation & Shortest Paths');
  updateAlgoBtn();
  updateSegUI();
  updateDoneText();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(4.8, 9.2, 9.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3.5;
controls.maxDistance = 28;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 11, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.4);
fill.position.set(-6, 4, -6);
scene.add(fill);

/* ---------------- 材质 / 公共颜色 ---------------- */
const M = {
  ground: new THREE.MeshStandardMaterial({ color: 0x1b212c, roughness: 0.92 }),
  block: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85 }),
  edge: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }),
  node: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, metalness: 0.1 }),
  ripple: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false, toneMapped: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }),
};
const cEdgeBase = new THREE.Color(0x5d6a78), cEdgeHot = new THREE.Color(0xff5d5d),
  cUnvisited = new THREE.Color(0x4c5664), cFrontier = new THREE.Color(0xffb84d),
  cSettled = new THREE.Color(0x4dabf7), cPath = new THREE.Color(0x2ecf8f),
  cGhost = new THREE.Color(0x8c5050), cRipple = new THREE.Color(0x74c0fc),
  cBurst = new THREE.Color(0x2ecf8f), cDark = new THREE.Color(0x000000),
  cLightBg = new THREE.Color(0xeef1f6), tmpC = new THREE.Color();
const rippleMat = M.ripple;

/* ================= 城市路网:节点=路口,边=街段 ================= */
const W = 12, HH = 9, S = 1.05, N = W * HH;
const idx = (i, j) => j * W + i;
const nx = n => (n % W - (W - 1) / 2) * S;
const nz = n => ((n / W | 0) - (HH - 1) / 2) * S;
const px = i => (i - (W - 1) / 2) * S;
const pz = j => (j - (HH - 1) / 2) * S;

const edges = [], adj = Array.from({ length: N }, () => []), edgeIdx = new Map();
function addEdge(a, b, horiz) {
  const e = { id: edges.length, a, b, w: 1, base: 0.9 + rng() * 0.5, con: false,
    cx: (nx(a) + nx(b)) / 2, cz: (nz(a) + nz(b)) / 2, len: S - 0.3, horiz };
  edges.push(e);
  adj[a].push({ v: b, e }); adj[b].push({ v: a, e });
  edgeIdx.set(a < b ? a * 256 + b : b * 256 + a, e.id);
}
for (let j = 0; j < HH; j++) for (let i = 0; i < W; i++) {
  if (i < W - 1) addEdge(idx(i, j), idx(i + 1, j), true);
  if (j < HH - 1) addEdge(idx(i, j), idx(i, j + 1), false);
}
const E = edges.length;

/* ---------------- 地面 / 街区楼块 ---------------- */
const ground = new THREE.Mesh(new THREE.BoxGeometry(W * S + 1.2, 0.2, HH * S + 1.2), M.ground);
ground.position.y = -0.1;
scene.add(ground);

const BW = W - 1, BH = HH - 1, B = BW * BH;
const blocks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.62, 1, 0.62), M.block, B);
blocks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(blocks);
const bMeta = [];
for (let j = 0; j < BH; j++) for (let i = 0; i < BW; i++) {
  bMeta.push({ x: px(i + 0.5), z: pz(j + 0.5), h: 0.1 + Math.pow(rng(), 1.7) * 0.8, park: rng() < 0.08, shade: rng() });
}
function paintBlocks() {
  const dark = THEME !== 'light';
  for (let k = 0; k < B; k++) {
    const b = bMeta[k];
    tmpC.setHex(dark ? 0x232b38 : 0xd2d9e3).multiplyScalar(dark ? 0.8 + b.shade * 0.5 : 0.9 + b.shade * 0.18);
    if (b.park) tmpC.setHex(dark ? 0x2b4a38 : 0xbcd8c4);
    blocks.setColorAt(k, tmpC);
    const m = new THREE.Matrix4().makeScale(1, b.h, 1);
    m.setPosition(b.x, b.h / 2, b.z);
    blocks.setMatrixAt(k, m);
  }
  blocks.instanceMatrix.needsUpdate = true;
  if (blocks.instanceColor) blocks.instanceColor.needsUpdate = true;
}

/* ---------------- 街段(边) ================= */
const edgeMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), M.edge, E);
scene.add(edgeMesh);
const mTmp = new THREE.Matrix4(), qTmp = new THREE.Quaternion(), vTmp = new THREE.Vector3(),
  sTmp = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0), IDQ = new THREE.Quaternion();

/* ---------------- 路口(节点) ================= */
const nodeMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.13, 0.13, 0.1, 14), M.node, N);
nodeMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(nodeMesh);

/* ---------------- 波纹(InstancedMesh 粒子池) ---------------- */
const RIP_N = 44;
const ripGeo = new THREE.RingGeometry(0.85, 1, 48);
ripGeo.rotateX(-Math.PI / 2);
const ripples = new THREE.InstancedMesh(ripGeo, rippleMat, RIP_N);
ripples.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(ripples);
const rip = Array.from({ length: RIP_N }, () => ({ age: 2, x: 0, z: 0, r1: 2, c: new THREE.Color() }));
let ripCursor = 0;
function spawnRipple(x, z, r1, color) {
  const r = rip[ripCursor]; ripCursor = (ripCursor + 1) % RIP_N;
  r.age = 0; r.x = x; r.z = z; r.r1 = r1; r.c.copy(color);
}
function updateRipples(dt) {
  const bg = THEME === 'light' ? cLightBg : cDark;
  for (let k = 0; k < RIP_N; k++) {
    const r = rip[k];
    if (r.age < 1) {
      r.age += dt * 1.5;
      const s = 0.35 + Math.min(r.age, 1) * r.r1;
      mTmp.compose(vTmp.set(r.x, 0.05 + k * 0.0012, r.z), IDQ, sTmp.set(s, 1, s));
      const f = 1 - Math.min(r.age, 1);
      if (THEME === 'light') tmpC.copy(bg).lerp(r.c, f);
      else tmpC.copy(r.c).multiplyScalar(f * f);
    } else {
      mTmp.makeScale(0, 0, 0);
    }
    ripples.setMatrixAt(k, mTmp);
    ripples.setColorAt(k, mTmp.elements[0] === 0 ? cDark : tmpC);
  }
  ripples.instanceMatrix.needsUpdate = true;
  if (ripples.instanceColor) ripples.instanceColor.needsUpdate = true;
}

/* ---------------- 起/终点地标 + 标签 ---------------- */
const pinSrc = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.34, 12), new THREE.MeshStandardMaterial({ color: 0x2ecf8f, emissive: 0x2ecf8f, emissiveIntensity: 0.5, roughness: 0.35 }));
pinSrc.rotation.x = Math.PI;
const pinDst = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.34, 12), new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: 0xff6b6b, emissiveIntensity: 0.5, roughness: 0.35 }));
pinDst.rotation.x = Math.PI;
scene.add(pinSrc, pinDst);

const labelRegistry = [];
function addLabel(text, cls) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  div.textContent = text;
  const o = new CSS2DObject(div);
  scene.add(o);
  labelRegistry.push(o);
  return o;
}
const lblSrc = addLabel('起点 A', 's');
const lblDst = addLabel('终点 B', 'g');
const lblCur = addLabel('', 'st');
const lblDone = addLabel('', 'fin');
lblCur.visible = false; lblDone.visible = false;

/* ================= 状态 ================= */
let src = 13, dst = idx(W - 2, HH - 2);
{ const a = parseInt(qs.get('src'), 10), b = parseInt(qs.get('dst'), 10);
  if (Number.isInteger(a) && a >= 0 && a < N && Number.isInteger(b) && b >= 0 && b < N && a !== b) { src = a; dst = b; } }
let trafficPct = clamp(qsFloat('traffic', 0), 0, 60);
let algo = qsBool('astar', false) ? 'astar' : 'dij';
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let speed = clamp(qsFloat('speed', 1), 0.2, 3);
let wMin = 1, T = {}, playhead = 0, done = false, reveal = 0, acc = 0;
let nodeState = new Uint8Array(N);        // 0 未到 1 波前 2 已确定
let onPath = new Set(), pathSlot = new Int16Array(E).fill(-1), ghostSet = null;
const RATE = 12;                          // 每秒确定路口数(1× 速度)

function congestEdges() {
  for (const e of edges) { e.w = e.base; e.con = false; }
  const want = Math.round(E * trafficPct / 100);
  let c = 0, tries = 0;
  while (c < want && tries++ < want * 10 + 20) {
    const e = edges[(rng() * E) | 0];
    if (!e.con) { e.con = true; e.w = e.base * (2.6 + rng() * 1.6); c++; }
  }
  wMin = Math.min(...edges.map(e => e.w));
}
function computeTrace(kind) {
  const INF = 1e18;
  const dist = new Float64Array(N).fill(INF), prev = new Int32Array(N).fill(-1),
    settled = new Uint8Array(N), inOpen = new Uint8Array(N), open = [src];
  const events = []; let relax = 0;
  dist[src] = 0; inOpen[src] = 1;
  const h = n => (Math.abs(n % W - dst % W) + Math.abs((n / W | 0) - (dst / W | 0))) * wMin;
  while (open.length) {
    let bi = 0, bk = Infinity;
    for (let k = 0; k < open.length; k++) {
      const v = open[k], key2 = dist[v] + (kind === 'astar' ? h(v) : 0);
      if (key2 < bk) { bk = key2; bi = k; }
    }
    const u = open[bi]; open[bi] = open[open.length - 1]; open.pop(); inOpen[u] = 0;
    if (settled[u]) continue;
    settled[u] = 1;
    const rel = [];
    for (const { v, e } of adj[u]) {
      if (settled[v]) continue;
      relax++;
      const nd = dist[u] + e.w;
      if (nd < dist[v] - 1e-9) {
        dist[v] = nd; prev[v] = u; rel.push(v);
        if (!inOpen[v]) { inOpen[v] = 1; open.push(v); }
      }
    }
    events.push({ v: u, d: dist[u], rel, goal: u === dst });
    if (u === dst) break;
  }
  const path = [];
  if (dist[dst] < INF) for (let v = dst; v >= 0; v = prev[v]) path.push(v);
  path.reverse();
  return { events, cost: dist[dst], path };
}
function recompute() {
  T.dij = computeTrace('dij');
  T.ast = computeTrace('astar');
  paintEdges();
}
function setPathVisuals() {
  onPath = new Set(T[algo].path);
  pathSlot.fill(-1);
  for (let k = 0; k + 1 < T[algo].path.length; k++) {
    const a = T[algo].path[k], b = T[algo].path[k + 1];
    pathSlot[edgeIdx.get(a < b ? a * 256 + b : b * 256 + a)] = k;
  }
}
function updateDoneText() {
  if (!done) { lblDone.visible = false; return; }
  const segs = Math.max(T[algo].path.length - 1, 0);
  lblDone.element.textContent = L(`最短路 ${T[algo].cost.toFixed(1)} 分钟 · ${segs} 段`,
    `shortest ${T[algo].cost.toFixed(1)} min · ${segs} hops`);
  lblDone.visible = true;
}
function applyEvent(ev) {
  nodeState[ev.v] = 2;
  for (const v of ev.rel) if (nodeState[v] === 0) nodeState[v] = 1;
  spawnRipple(nx(ev.v), nz(ev.v), 1.9, cRipple);
  lblCur.visible = true;
  lblCur.position.set(nx(ev.v), 0.38, nz(ev.v));
  lblCur.element.textContent = `(${ev.v % W},${ev.v / W | 0})  d = ${ev.d.toFixed(1)} min`;
  if (ev.goal) {
    done = true; reveal = 0;
    setPathVisuals();
    updateDoneText();
    spawnRipple(nx(dst), nz(dst), 3.2, cBurst);
    spawnRipple(nx(dst), nz(dst), 2.2, cBurst);
    paintEdges();
  }
}
function seek(k) {
  const len = T[algo].events.length;
  k = clamp(Math.round(k), 0, len);
  nodeState.fill(0);
  nodeState[src] = 1;
  onPath = new Set(); pathSlot.fill(-1);
  playhead = 0; acc = 0; done = false; reveal = 0;
  lblDone.visible = false; lblCur.visible = false;
  while (playhead < k) applyEvent(T[algo].events[playhead++]);
  paintEdges();
}
function paintEdges() {
  const lit = Math.floor(reveal);
  for (let k = 0; k < E; k++) {
    const e = edges[k];
    let thick = 0.09;
    if (pathSlot[k] >= 0 && pathSlot[k] < lit) { tmpC.copy(cPath); thick = 0.17; }
    else if (ghostSet && ghostSet.has(k)) tmpC.copy(cGhost);
    else tmpC.copy(cEdgeBase).lerp(cEdgeHot, clamp((e.w - 1) / 3, 0, 1));
    edgeMesh.setColorAt(k, tmpC);
    qTmp.setFromAxisAngle(UP, e.horiz ? 0 : Math.PI / 2);
    mTmp.compose(vTmp.set(e.cx, 0.03, e.cz), qTmp, sTmp.set(e.len, 0.06, thick));
    edgeMesh.setMatrixAt(k, mTmp);
  }
  edgeMesh.instanceMatrix.needsUpdate = true;
  if (edgeMesh.instanceColor) edgeMesh.instanceColor.needsUpdate = true;
}

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '城市是一张带权图', be: 'The city is a weighted graph',
    d: '路口 = 节点,街段 = 带权边,权 = 走完这段的分钟数(越红越堵)。导航问题:在图上找 A→B 总权重最小的那条路。点击任意路口可重选起点/终点。',
    de: 'Intersections = nodes, street segments = weighted edges, weight = minutes to walk it (redder = slower). Routing: find the min-total-weight A→B path. Click any intersection to move the endpoints.',
    act: () => { src = 13; dst = idx(W - 2, HH - 2); trafficPct = 0; congestEdges(); ghostSet = null; placeEndpoints(); recompute(); seek(0); setAlgo('dij', true); play(); } },
  { b: 'Dijkstra:波纹逐圈扩散', be: 'Dijkstra: the ripple expands',
    d: '每步从波前挑 d 最小的路口永久确定(点亮):边权都 ≥ 0 时,绕路不可能更便宜。同时松弛邻居 d(v) ← min(d(v), d(u) + w(u,v))。波纹 = 等时线,橙色 = 波前。',
    de: 'Each step settles the wavefront node with smallest d (lit up): with weights ≥ 0, a detour can never help. Neighbors get relaxed: d(v) ← min(d(v), d(u)+w(u,v)). Ripples = isochrones; orange = wavefront.',
    act: () => { setAlgo('dij'); play(); } },
  { b: '终点确定,回溯成路', be: 'The goal settles, trace back',
    d: '每次松弛都留下前驱指针「我从谁变便宜」。终点一被确定,沿指针倒走就是最短路:总耗时 = Σw。地图 App 的那条路线就是这样拼出来的。',
    de: 'Every relaxation leaves a predecessor pointer. Once the goal settles, walking the pointers backwards gives the shortest path: total = Σw. Map-app routes are built exactly like this.',
    act: () => { seek(T[algo].events.length); play(); } },
  { b: 'A*:给波前加直觉', be: 'A*: give the wavefront instinct',
    d: '出队顺序改为 f = g + h,h = 到终点的曼哈顿距离 × 全网最快路段(永不高估 ⇒ 仍保证最优)。波前被吸向目标:路径一样短,探索路口大减——看右上对比。',
    de: 'Dequeue by f = g + h, with h = Manhattan distance to the goal × fastest segment anywhere (never overestimates ⇒ still optimal). The wavefront bends toward the goal: same cost, far fewer nodes — see the tally.',
    act: () => { setAlgo('astar'); play(); } },
  { b: '实时路况:边权会变', be: 'Live traffic: weights drift',
    d: '拥堵把随机街段时间抬到 3–4 倍,旧最短路可能瞬间失守——用新边权重跑一遍,路径当场改道(暗红虚影 = 旧路)。真实导航 = 边权在变,算法不停地重跑。',
    de: 'Congestion multiplies random segments ×3–4 and the old shortest path can instantly lose — rerun with the new weights and the route re-routes on the spot (dark red ghost = old path). Real navigation = re-running on live weights.',
    act: () => { pressTraffic(); play(); } },
];
function stepIndex() {
  if (trafficPct > 0 && done) return 4;
  if (algo === 'astar') return 3;
  if (done) return 2;
  if (playhead > 4) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd'), elSpdVal = document.getElementById('spdVal');
const elProg = document.getElementById('prog'), elProgVal = document.getElementById('progVal');
const tglLabels = document.getElementById('tglLabels'), tglRotate = document.getElementById('tglRotate');
const btnAlgo = document.getElementById('btnAlgo');
const segSrc = document.getElementById('segSrc'), segDst = document.getElementById('segDst');
const stCost = document.getElementById('stCost'), stDij = document.getElementById('stDij'),
  stAst = document.getElementById('stAst'), stSave = document.getElementById('stSave');
let pickMode = 'src', scrubbing = false;

function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
function play() { playing = true; setPlayLabel(); }
function updateAlgoBtn() {
  btnAlgo.textContent = algo === 'dij' ? L('切换到 A* →', 'Switch to A* →') : L('← 切回 Dijkstra', '← Back to Dijkstra');
}
function updateSegUI() {
  segSrc.classList.toggle('on', pickMode === 'src');
  segDst.classList.toggle('on', pickMode === 'dst');
}
function setAlgo(a, quietSeek) {
  algo = a;
  updateAlgoBtn();
  if (!quietSeek) seek(0);
}
function pressTraffic() {
  ghostSet = done ? new Set(pathSlot.map((s, k) => s >= 0 ? k : -1).filter(k => k >= 0)) : null;
  trafficPct = 12 + rng() * 10;
  congestEdges();
  recompute();
  seek(0);
}
function placeEndpoints() {
  pinSrc.position.set(nx(src), 0.42, nz(src));
  pinDst.position.set(nx(dst), 0.42, nz(dst));
  lblSrc.position.set(nx(src), 0.85, nz(src));
  lblDst.position.set(nx(dst), 0.85, nz(dst));
}
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
btnAlgo.addEventListener('click', () => { setAlgo(algo === 'dij' ? 'astar' : 'dij'); play(); });
document.querySelector('#actions .hot').addEventListener('click', () => { pressTraffic(); play(); });
document.querySelector('#actions .abtn:last-child').addEventListener('click', () => { seek(0); play(); });
segSrc.addEventListener('click', () => { pickMode = 'src'; updateSegUI(); });
segDst.addEventListener('click', () => { pickMode = 'dst'; updateSegUI(); });
elSpd.value = speed; elSpdVal.textContent = speed.toFixed(1) + '×';
elSpd.addEventListener('input', () => { speed = parseFloat(elSpd.value); elSpdVal.textContent = speed.toFixed(1) + '×'; });
elProg.addEventListener('input', () => { scrubbing = true; seek(elProg.value / 100 * T[algo].events.length); });
elProg.addEventListener('pointerdown', () => { scrubbing = true; });
addEventListener('pointerup', () => { scrubbing = false; });
tglLabels.addEventListener('change', () => {
  for (const o of labelRegistry) o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
tglRotate.checked = qsBool('spin', false);
controls.autoRotate = tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* 点击路口重选起/终点(与拖拽旋转区分) */
const ray = new THREE.Raycaster();
const groundPlane = new THREE.Plane(UP, 0);
let downXY = null;
renderer.domElement.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  downXY = null;
  if (moved > 6) return;
  const ndc = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.ray.intersectPlane(groundPlane, new THREE.Vector3());
  if (!hit) return;
  const i = Math.round(hit.x / S + (W - 1) / 2), j = Math.round(hit.z / S + (HH - 1) / 2);
  if (i < 0 || i >= W || j < 0 || j >= HH) return;
  const n = idx(i, j);
  const target = pickMode === 'src' ? 'src' : 'dst';
  const other = target === 'src' ? dst : src;
  if (n === other) return;
  if (n === src || n === dst) return;
  if (target === 'src') src = n; else dst = n;
  ghostSet = null;
  placeEndpoints(); recompute(); seek(0); play();
});

/* ================= 主循环(document.hidden 停 rAF) ================= */
const clock = new THREE.Clock();
let rafId = 0, loopOn = false, lastStep = -1;
function frame() {
  if (!loopOn) return;
  rafId = requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const tm = performance.now() / 1000;
  if (playing && !done) {
    acc += dt * RATE * speed;
    let n = Math.min(Math.floor(acc), 400);
    acc -= n;
    const len = T[algo].events.length;
    while (n-- > 0 && playhead < len) applyEvent(T[algo].events[playhead++]);
  }
  if (done && reveal < T[algo].path.length) { reveal += dt * speed * 22; paintEdges(); }

  /* 节点颜色/脉冲 */
  for (let n = 0; n < N; n++) {
    const st = nodeState[n];
    let sc = 1;
    if (st === 1) sc = 1 + 0.16 * Math.sin(tm * 5 + n * 1.7);
    else if (st === 2) sc = onPath.has(n) && done ? 1.38 : 1.12;
    mTmp.compose(vTmp.set(nx(n), 0.06, nz(n)), IDQ, sTmp.set(sc, 1, sc));
    nodeMesh.setMatrixAt(n, mTmp);
    nodeMesh.setColorAt(n, st === 2 ? (done && onPath.has(n) ? cPath : cSettled) : st === 1 ? cFrontier : cUnvisited);
  }
  nodeMesh.instanceMatrix.needsUpdate = true;
  if (nodeMesh.instanceColor) nodeMesh.instanceColor.needsUpdate = true;

  /* 地标浮动 */
  pinSrc.position.y = 0.42 + 0.05 * Math.sin(tm * 2);
  pinDst.position.y = 0.42 + 0.05 * Math.sin(tm * 2 + 1.3);

  updateRipples(dt);

  /* 读数 */
  const nD = algo === 'dij' ? playhead : T.dij.events.length;
  const nA = algo === 'astar' ? playhead : T.ast.events.length;
  stCost.textContent = done ? T[algo].cost.toFixed(1) + ' min' : '· · ·';
  stDij.textContent = nD;
  stAst.textContent = nA;
  const fD = T.dij.events.length, fA = T.ast.events.length;
  stSave.textContent = fD > 0 ? '−' + Math.max(0, Math.round((1 - fA / fD) * 100)) + '%' : '—';

  /* 进度滑块 */
  const len = T[algo].events.length;
  if (!scrubbing) elProg.value = len ? playhead / len * 100 : 0;
  elProgVal.textContent = `${playhead}/${len}`;

  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function startLoop() { if (!loopOn) { loopOn = true; clock.getDelta(); rafId = requestAnimationFrame(frame); } }
function stopLoop() { loopOn = false; cancelAnimationFrame(rafId); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopLoop(); else startLoop();
});

/* ================= 初始化 ================= */
placeEndpoints();
congestEdges();
recompute();
applyTheme();
applyLang();
seek(clamp(qsFloat('t', 0), 0, 100) / 100 * T[algo].events.length);
setPlayLabel();
startLoop();
</script>
