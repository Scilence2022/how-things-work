  :root[data-theme="light"] .lbl.g { color:#2b8a3e; } :root[data-theme="light"] .lbl.b { color:#1864ab; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);

  #plot { position: fixed; right: 18px; bottom: 18px; z-index: 4; width: 330px; height: 214px;

  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12px; }

  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }

    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 0; flex-wrap: wrap; }

  @media (max-width: 1150px) { #plot { display: none; } #stats { bottom: 18px; } }

  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>

  <div class="sub" data-zh="支点一移,力臂就换:施力臂是阻力臂的几倍,力就省几倍,行程也精确地费几倍——1 颗小砝码压下 1 m,9 颗大砝码只抬起 11 cm,阿基米德把「省力」与「费程」锁死在同一本功账本 W=F·s 上;滑轮记同一本账:定滑轮 MA=1 只改方向,动滑轮 MA=2 却要绳程 ×2,滑轮组 n 段绳把 W 分成 W/n、绳程 ×n,摩擦与绳重再收一笔 η<100% 的税 · 3D 交互演示 · 拖动旋转 / 空格运行/暂停" data-en="Move the fulcrum and the arms trade places: an effort arm k times the load arm saves k times the force and exacts k times the travel — one small weight sinks 1 m while nine big ones rise just 11 cm; Archimedes locks 'less force' and 'more distance' into one work ledger, W=F·s; pulleys keep the same books: a fixed pulley (MA=1) only turns the force, a moving one (MA=2) doubles rope travel, an n-fold tackle shares W/n while the rope runs n times farther, and friction plus rope weight take an η<100% tax · 3D interactive demo · drag to orbit · Space = run/pause">杠杆与滑轮 · 省力不省功</div>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = u => u * u * (3 - 2 * u);
const L = (zh, en) => LANG === 'en' ? en : zh;
const speedMul = clamp(qsFloat('speed', 1), 0.25, 3);

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x10141b, 20, 70);
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  const dark = THEME === 'dark';
  scene.background = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  scene.fog.color = new THREE.Color(dark ? 0x10141b : 0xd9e2ea);
  groundM.color.setHex(dark ? 0x1c2027 : 0xb0bcc8);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('杠杆与滑轮 · 省力不省功', 'Levers & Pulleys · Force Is Bought with Distance');
  for (const r of labelReg) r.o.element.textContent = r.text();
  refreshLabels();
  buildSteps();
  setPlayLabel();
  syncSliders();
  syncBtns();
  updateFormula();
  drawPlot();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
let renderer = null, webglOK = true;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
} catch (err) {
  webglOK = false;
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:18px 26px;color:var(--text);font-size:14px;max-width:420px;text-align:center';
  errDiv.textContent = L('WebGL 初始化失败:3D 画面不可用,但左侧控制面板仍可浏览。', 'WebGL failed to start: the 3D view is unavailable, but the control panel still works.');
  document.body.appendChild(errDiv);
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

if (webglOK) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 140);
camera.position.set(7.5, 4.6, 12.5);
const controls = new OrbitControls(camera, webglOK ? renderer.domElement : document.body);
controls.target.set(2.2, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 50;
controls.autoRotateSpeed = 0.3;

const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x1a1c22, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2dd, 1.0);
key.position.set(6, 9, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ab8ff, 0.3);

function pulleyCalc() {
  const nMov = Math.floor(nP / 2);
  Fact = (W_LOAD + nMov * W_MOV) / (nP * FRIC);
  eff = W_LOAD / (Fact * nP);
  Fid = W_LOAD / nP;
}

/* ================= 绘图:F 与行程 vs MA ================= */
const plotCv = document.getElementById('plotCv');
function drawPlot() {
  const ctx = plotCv.getContext('2d');
  const W = plotCv.width = plotCv.clientWidth * 2;
  const H = plotCv.height = plotCv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const cTxt = css.getPropertyValue('--text2').trim() || '#9fb0c3';
  const padL = 46, padR = 52, padT = 14, padB = 26;
  const xOf = ma => padL + (clamp(ma, 1, 10) - 1) / 9 * (W - padL - padR);
  const yF = f => (H - padB) - clamp(f, 0, 100) / 100 * (H - padT - padB);
  const yS = s => (H - padB) - clamp(s, 0, 1.2) / 1.2 * (H - padT - padB);
  ctx.font = '14px system-ui';
  ctx.strokeStyle = 'rgba(128,150,170,.22)';
  ctx.fillStyle = cTxt;
  for (const ma of [1, 3, 5, 7, 9]) {
    ctx.beginPath(); ctx.moveTo(xOf(ma), padT); ctx.lineTo(xOf(ma), H - padB); ctx.stroke();
    ctx.fillText(String(ma), xOf(ma) - 6, H - padB + 18);
  }
  ctx.fillText('MA', W - padR + 14, H - padB + 18);
  ctx.fillText('100N', 6, padT + 10);
  ctx.fillText('0', 26, H - padB + 4);
  ctx.fillText('1.2m', W - padR + 2, padT + 10);
  const curve = (fn, ymap, col, lw) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) {
      const ma = 1 + i / 60 * 9;
      const x = xOf(ma), y = ymap(fn(ma));
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  };
  curve(ma => 90 / ma, yF, '#ffa94d', 2.4);
  curve(ma => 0.111 * ma, yS, '#4dabf7', 2.4);
  const MAc = clamp((xf + 4.8) / (4.8 - xf), 1, 10);
  const x = xOf(MAc);
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = 'rgba(200,220,240,.5)';
  ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, H - padB); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath(); ctx.arc(x, yF(90 / MAc), 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#4dabf7';
  ctx.beginPath(); ctx.arc(x, yS(0.111 * MAc), 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffa94d';
  ctx.fillText(L('力 F=W/MA', 'force F=W/MA'), padL + 8, padT + 14);
  ctx.fillStyle = '#4dabf7';
  ctx.fillText(L('行程 s=MA·s₀', 'travel s=MA·s₀'), padL + 108, padT + 14);
}

  formulaEl.innerHTML = L(
    `<b>力矩平衡:F₁·L₁ = F₂·L₂</b>;MA = L施/L阻 = ${( (xf+4.8)/(4.8-xf) ).toFixed(2)}<br>` +
    `<b>功守恒:省力必费行程</b>——s施 = MA·s阻,W = F·s 两侧恒等<br>` +
    `<b>定滑轮 MA=1</b> 只改向;<b>动滑轮 MA=2</b> 绳程 ×2;滑轮组 F = W/n,s绳 = n·s物<br>` +
    `<b>η = W/(F·s绳) = ${nP}×1000/( ${Fact.toFixed(0)}×${nP} ) = ${(eff*100).toFixed(0)}%</b> < 100%:摩擦与绳重收税`,
    `<b>Torque balance: F₁·L₁ = F₂·L₂</b>; MA = L_effort/L_load = ${( (xf+4.8)/(4.8-xf) ).toFixed(2)}<br>` +
    `<b>Work is conserved: saved force means spent travel</b> — s_effort = MA·s_load, W = F·s identical on both sides<br>` +
    `<b>Fixed pulley MA=1</b> turns only; <b>moving MA=2</b> doubles rope travel; tackle: F = W/n, s_rope = n·s_load<br>` +
    `<b>η = W/(F·s_rope) = ${(eff*100).toFixed(0)}%</b> < 100%: friction and rope weight take a tax`);
}
function syncAll() {
  syncSliders(); syncBtns(); updateFormula(); updateStats(); drawPlot();
  [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === phaseIdx));
}
elFul.addEventListener('input', () => { xf = +elFul.value; fulcrum.position.x = xf; pivot.position.x = xf; pressOn = false; syncSliders(); updateStats(); updateFormula(); drawPlot(); });
elNL.addEventListener('input', () => { nL = +elNL.value; rebuildWeights(); pressOn = false; syncSliders(); updateStats(); });
elNR.addEventListener('input', () => { nR = +elNR.value; rebuildWeights(); pressOn = false; syncSliders(); updateStats(); updateFormula(); });
elN.addEventListener('input', () => { nP = +elN.value; buildPulley(); pulleyCalc(); syncSliders(); updateStats(); updateFormula(); });
btnArchi.addEventListener('click', () => { archiPreset(); notifyT = 3; notifyZ = '阿基米德:支点 9:1——1 颗小砝码压下 1 m,9 颗大砝码只抬 11 cm,W=F·s 两边相等'; notifyE = 'Archimedes: fulcrum at 9:1 — one small weight sinks 1 m, nine big ones rise 11 cm, W=F·s equal on both sides'; });
btnBal.addEventListener('click', () => {
  if (nL + nR === 0) return;
  xf = clamp(4.8 * (nR - nL) / (nL + nR), -4, 4);
  fulcrum.position.x = xf; pivot.position.x = xf;
  pressOn = false;
  syncAll();
  notifyT = 2.2; notifyZ = `自动配平:支点移到 ${xf.toFixed(2)} m,两侧力矩相等,板回到水平`; notifyE = `auto-balance: fulcrum at ${xf.toFixed(2)} m, torques equal, plank level again`;
});
btnLever.addEventListener('click', () => flyTo([1.2, 2.6, 8.2], [-0.8, 0.8, 0]));
btnPulley.addEventListener('click', () => flyTo([10.8, 3.8, 6.8], [PX, 3.4, 0]));
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
document.getElementById('tglLabels').addEventListener('change', e => { labelsOn = e.target.checked; refreshLabels(); });
document.getElementById('tglChart').addEventListener('change', e => { chartOn = e.target.checked; document.getElementById('plot').style.display = e.target.checked ? '' : 'none'; });
document.getElementById('tglArms').addEventListener('change', e => { armsOn = e.target.checked; armLnL.visible = armLnR.visible = armsOn; refreshLabels(); });
if (!qsBool('labels', true)) { labelsOn = false; document.getElementById('tglLabels').checked = false; }
if (!armsOn) { armLnL.visible = armLnR.visible = false; document.getElementById('tglArms').checked = false; }
controls.autoRotate = qsBool('spin', false);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  drawPlot();
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let raf = null, acc = 0, accPlot = 0, camTween = null;
controls.addEventListener('start', () => { camTween = null; });

function frame() {
  raf = requestAnimationFrame(frame);
  const dt0 = clamp(clock.getDelta(), 0, 0.05);
  const dt = dt0 * speedMul * (playing ? 1 : 0);
  if (notifyT > 0) notifyT -= dt0;
  if (dt > 0) {
    pullPh += dt * 0.55;
    if (pressOn && pressT < 1) pressT = Math.min(1, pressT + dt / 2.8);
    sApp = pressT * 1.0;
    sLoad = pressT * (4.8 - xf) / (xf + 4.8);
  }
  /* 跷跷板角度 */
  const tauL = nL * WU * (xf + 4.8), tauR = nR * WU * (4.8 - xf);
  let thetaT;
  if (pressOn) thetaT = ease(pressT) * Math.asin(clamp(1 / (xf + 4.8), 0, 0.9));
  else thetaT = clamp((tauL - tauR) / (tauL + tauR + 40), -1, 1) * 0.3;
  theta += (thetaT - theta) * Math.min(1, dt0 * 3.5);
  pivot.rotation.z = theta;
  lblFul.position.x = xf;
  /* 滑轮组升降 */
  const pull = 0.5 - 0.5 * Math.cos(pullPh);
  const rise = 0.8 * pull;
  botBlock.position.y = 2.55 + rise;
  const yHandle = 5.6 - nP * rise;
  /* 绳段 */
  const kT = Math.ceil(nP / 2);
  const xFree = PX + (kT - 1) * 0.32 + 0.55;
  for (let i = 0; i < ropes.length; i++) {
    const r = ropes[i];
    let y0, y1, x;
    if (nP === 1) {
      if (i === 0) { x = PX - 0.3; y0 = botBlock.position.y - 0.1; y1 = 5.9; }
      else if (i === 1) { x = PX + 0.3; y0 = 5.9; y1 = yHandle; }
      else { r.visible = false; continue; }
      r.material = i === 1 ? ropeFreeM : ropeM;
    } else if (i < nP) {
      r.material = ropeM;
      x = PX + (i - (nP - 1) / 2) * 0.32;
      y0 = botBlock.position.y - 0.1; y1 = 5.9;
    } else if (i === nP) {
      x = xFree; y0 = 5.9; y1 = yHandle;
      r.material = ropeFreeM;
    } else { r.visible = false; continue; }
    r.visible = true;
    const len = Math.max(0.02, y1 - y0);
    r.scale.set(1, len, 1);
    r.position.set(x, (y0 + y1) / 2, 0);
  }
  /* 力箭头跟随砝码堆顶 */
  const c = Math.cos(theta), s = Math.sin(theta);
  const tipL = { x: xf + (-ARM_X) * c - (nL * 0.27 + 0.2) * s, y: 0.12 + (-ARM_X) * s + (nL * 0.27 + 0.2) * c };
  const tipR = { x: xf + ARM_X * c - (nR * 0.27 + 0.2) * s, y: 0.12 + ARM_X * s + (nR * 0.27 + 0.2) * c };
  const lenL = 0.3 + nL * WU * 0.011, lenR = 0.3 + nR * WU * 0.011;
  arrL.position.set(tipL.x, tipL.y + lenL + 0.1, 0);
  arrR.position.set(tipR.x, tipR.y + lenR + 0.1, 0);
  arrL.setLength(lenL, 0.24, 0.13);
  arrR.setLength(lenR, 0.24, 0.13);
  arrL.visible = nL > 0; arrR.visible = nR > 0;
  /* 标尺游标 */
  markRope.position.set(10.5, yHandle, 0);
  markLoad.position.set(6.7, 2.55 + rise, 0);
  /* 相机飞行 */
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt0 * 1.5);
    const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  acc += dt0;
  if (acc > 0.14) { acc = 0; updateStats(); }
  accPlot += dt0;
  if (accPlot > 0.06) { accPlot = 0; if (chartOn) drawPlot(); }
  for (const r of labelReg) {
    const on = labelsOn && r.vis();
    r.o.visible = on && r.text() !== '';
    if (on) r.o.element.textContent = r.text();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
function start() { if (raf === null && webglOK) { clock.getDelta(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

/* ================= 初始化 ================= */
applyTheme();
buildSteps();
applyLang();
rebuildWeights();
buildPulley();
pulleyCalc();
const t0 = Math.round(qsFloat('t', 0));
if (qs.get('t') !== null && t0 >= 0 && t0 < STEPS.length) { phaseIdx = t0; STEPS[t0].act(); }
syncAll();
start();
</script>
</body>
</html>
