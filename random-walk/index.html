<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机游走 · 一万颗醉汉走出正态</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --acc:#ffe066;
    --bg:#10141b; --panel:rgba(13,17,24,.86); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9; --text2:#9fb0c3; --text3:#c7d2de;
    --hover:rgba(255,255,255,.05); --shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(13,17,24,.78); --tool-border:rgba(255,255,255,.12);
    --cv-pill:rgba(13,17,24,.8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --acc:#f59f00;
    --bg:#eef1f6; --panel:rgba(255,255,255,.88); --panel-border:rgba(15,25,40,.10);
    --text:#16202c; --text2:#5b6b7d; --text3:#33414f;
    --hover:rgba(15,25,40,.05); --shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85); --tool-border:rgba(15,25,40,.14);
    --cv-pill:rgba(255,255,255,.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .25s; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { background: var(--cv-pill); border: 1px solid var(--tool-border);
    color: var(--text3); font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .25s; }
  :root[data-theme="light"] .lbl { text-shadow: none; }
  .lbl.g { border-color: rgba(255,224,102,.9); color: #fff3bf; }
  .lbl.st { border-color: rgba(154,167,184,.9); font-size: 13px; padding: 6px 11px; }
  :root[data-theme="light"] .lbl.g { border-color: rgba(245,159,0,.9); color: #e8590c; }

  #tools { position: fixed; top: 16px; right: 18px; z-index: 6; display: flex; gap: 8px; }
  .tbtn { appearance: none; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text3); font: inherit; font-size: 12.5px; font-weight: 600;
    min-width: 40px; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; backdrop-filter: blur(6px);
    transition: border-color .15s, color .15s, transform .15s; }
  .tbtn:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-1px); }

  #title { position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    max-width: calc(100vw - 320px); }
  #title h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title .sub { font-size: 12.5px; color: var(--text2); margin-top: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  #stats { position: fixed; right: 18px; bottom: 18px; z-index: 4; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 11px 16px;
    backdrop-filter: blur(6px); display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
  #stats .k { font-size: 12px; color: var(--text2); align-self: center; }
  #stats .v { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats .v small { font-size: 11.5px; color: var(--text2); font-weight: 400; }
  #stats .v.g { color: #ffe066; }

  #panel { position: fixed; left: 18px; bottom: 18px; z-index: 5; width: 384px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px 12px; backdrop-filter: blur(6px);
    box-shadow: var(--shadow); max-height: calc(100vh - 160px); overflow: auto; }
  #legend { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .chip.g { color: #fff3bf; border-color: rgba(255,224,102,.7); }
  .chip.b { color: #bde9ff; border-color: rgba(116,192,252,.7); }
  #actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .abtn { appearance: none; font: inherit; cursor: pointer; flex: 1;
    background: rgba(255,224,102,.12); color: var(--text); border: 1px solid rgba(255,224,102,.5);
    border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    transition: filter .15s; }
  .abtn:hover { filter: brightness(1.15); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .row label { font-size: 12px; color: var(--text2); flex: 0 0 104px; }
  .row .val { font-size: 11.5px; color: var(--text3); flex: 0 0 52px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 18px; }
  #steps { list-style: none; margin-top: 8px; }
  #steps li { display: flex; gap: 9px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; align-items: flex-start; }
  #steps li:hover { background: var(--hover); }
  #steps li.on { background: rgba(255,224,102,.10); border-color: rgba(255,224,102,.45); }
  :root[data-theme="light"] #steps li.on { background: rgba(245,159,0,.08); border-color: rgba(245,159,0,.4); }
  #steps .n { flex: 0 0 18px; height: 18px; border-radius: 50%; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    background: rgba(255,255,255,.12); color: var(--text3); }
  :root[data-theme="light"] #steps .n { background: rgba(15,25,40,.10); }
  #steps li.on .n { background: var(--acc); color: #fff; }
  #steps .t { font-size: 12.5px; color: var(--text3); line-height: 1.45; }
  #steps .t b { color: var(--text); font-size: 12.5px; }
  #steps li.on .t b { color: #fff3bf; }
  :root[data-theme="light"] #steps li.on .t b { color: var(--acc); }
  #ctrl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #play { grid-row: 1 / 3; grid-column: 1; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--acc); color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  #play:hover { filter: brightness(1.12); }
  #toggles { display: flex; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  #toggles label { font-size: 12px; color: var(--text2); display: flex; gap: 5px; align-items: center;
    cursor: pointer; }
  #toggles input { accent-color: var(--acc); }
  #rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--panel-border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rel span { font-size: 11.5px; color: var(--text2); }
  #rel a { font-size: 11.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 10px; transition: color .15s, border-color .15s; }
  #rel a:hover { color: var(--acc); border-color: var(--acc); }
  @media (max-width: 900px) { #stats { display: none; } }
  @media (max-width: 760px) {
    #panel { width: calc(100vw - 36px); max-height: 55vh; }
    #title { max-width: calc(100vw - 200px); }
    #title h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1 data-zh="随机游走 · 一万颗醉汉走出正态" data-en="Random Walk: ten thousand drunks draw a bell">随机游走 · 一万颗醉汉走出正态</h1>
  <div class="sub" data-zh="一颗醉汉的下一步无法预测;一万颗一起走,密度却摊成高斯——香味如何飘满房间、热量如何渗进墙壁,全是这一支舞 · 空格播放/暂停" data-en="One drunk's next step is unknowable; ten thousand together spread into a Gaussian — how scent fills a room, how heat seeps into walls · Space = play/pause">一颗醉汉的下一步无法预测;一万颗一起走,密度却摊成高斯——香味如何飘满房间、热量如何渗进墙壁,全是这一支舞 · 空格播放/暂停</div>
</div>

<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>
  <button class="tbtn" id="langBtn" aria-label="switch language">EN</button>
  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>
</div>

<div id="stats">
  <span class="k" data-zh="已走步数" data-en="steps taken">已走步数</span><span class="v g" id="stT">0</span>
  <span class="k" data-zh="扩散半径 σ" data-en="spread σ">扩散半径 σ</span><span class="v" id="stR">—</span>
  <span class="k" data-zh="中心密度" data-en="center density">中心密度</span><span class="v g" id="stC">—</span>
</div>

<div id="panel">
  <div id="legend">
    <span class="chip.g" data-zh="游走粒子(初始聚在中心)" data-en="walkers (seeded at center)">游走粒子(初始聚在中心)</span>
    <span class="chip.b" data-zh="明星粒子(带轨迹)" data-en="star walker (with trail)">明星粒子(带轨迹)</span>
  </div>
  <div id="actions">
    <button class="abtn" id="btnReset" data-zh="重新聚拢中心" data-en="re-seed center">重新聚拢中心</button>
    <button class="abtn" id="btnStar" data-zh="跟随明星粒子" data-en="follow the star walker">跟随明星粒子</button>
  </div>
  <div class="row"><label data-zh="粒子数" data-en="particles">粒子数</label><input id="pn" type="range" min="200" max="2000" step="100" value="1000"><span class="val" id="pnVal">1000</span></div>
  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play">暂停</button>
    <div class="row" style="margin-top:0"><label data-zh="速度" data-en="Speed">速度</label><input id="spd" type="range" min="0.5" max="4" step="0.5" value="1.5"><span class="val" id="spdVal">1.5×</span></div>
  </div>
  <div id="toggles">
    <label><input id="tglLabels" type="checkbox" checked> <span data-zh="标签" data-en="Labels">标签</span></label>
    <label><input id="tglTrail" type="checkbox" checked> <span data-zh="明星轨迹" data-en="star trail">明星轨迹</span></label>
    <label><input id="tglRotate" type="checkbox" checked> <span data-zh="自动环绕" data-en="auto-orbit">自动环绕</span></label>
  </div>
  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>
    <a href="../galton-board/" data-zh="伽尔顿板:同一家族" data-en="Galton board: same family">伽尔顿板:同一家族</a>
    <a href="../entropy/" data-zh="熵:扩散的账本" data-en="entropy: the ledger of spreading">熵:扩散的账本</a>
    <a href="../monty-hall/" data-zh="概率直觉:蒙提霍尔" data-en="probability: Monty Hall">概率直觉:蒙提霍尔</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- URL 参数 / 工具 ---------------- */
const qs = new URLSearchParams(location.search);
const qsFloat = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };
const qsBool = (k, d) => { const v = qs.get(k); return v === null ? d : v !== '0' && v !== 'false'; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- 主题 / 语言 ---------------- */
const htmlEl = document.documentElement;
let THEME = localStorage.getItem('htw-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let LANG = localStorage.getItem('htw-lang') || 'zh';
const L = (zh, en) => LANG === 'en' ? en : zh;

const scene = new THREE.Scene();
function applyTheme() {
  htmlEl.dataset.theme = THEME;
  document.getElementById('themeBtn').textContent = THEME === 'dark' ? '☀' : '☾';
  scene.background = new THREE.Color(THEME === 'light' ? 0xeef1f6 : 0x10141b);
  M.floor.color.set(THEME === 'light' ? 0xd6dce6 : 0x1b212c);
}
function applyLang() {
  htmlEl.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = LANG === 'en' ? el.dataset.en : el.dataset.zh;
  });
  document.getElementById('langBtn').textContent = LANG === 'en' ? '中' : 'EN';
  document.title = L('随机游走 · 高斯扩散', 'Random Walk · Gaussian spreading');
  for (const r of labelRegistry) r.o.element.textContent = r.text();
  buildSteps();
  setPlayLabel();
}
document.getElementById('themeBtn').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('htw-theme', THEME);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('htw-lang', LANG);
  applyLang();
});

/* ---------------- 渲染器 / 场景 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 3 });
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0.6, 5.2, 6.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c3038, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(4, 9, 5);
scene.add(key);

/* ---------------- 材质 ---------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1,
    emissive: color, emissiveIntensity: 0.06, transparent: true, ...opts });
}
const M = {
  floor: mat(0x1b212c, { roughness: 0.9, emissive: 0x000000 }),
  frame: mat(0x39424f, { roughness: 0.7 }),
  walker: new THREE.MeshBasicMaterial({ color: 0xffe066 }),
  star: mat(0x74c0fc, { emissive: 0x74c0fc, emissiveIntensity: 0.5 }),
  trail: new THREE.LineBasicMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.75 }),
};

/* ================= 场景 ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(7, 0.16, 7), M.floor);
floor.position.y = -0.1;
scene.add(floor);
const pad = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 0.04, 48), M.frame);
pad.position.y = 0.01;
scene.add(pad);
/* 游走粒子(instanced) */
let N = 1000;
const MAXN = 2200;
const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.035, 8, 6), M.walker.clone(), MAXN);
scene.add(mesh);
const m4 = new THREE.Matrix4();
const walkers = [];
/* 明星粒子 + 轨迹 */
const star = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), M.star);
scene.add(star);
const starIdx = 0;
const TRAIL = 300;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL * 3), 3));
const trail = new THREE.Line(trailGeo, M.trail);
scene.add(trail);
let trailLen = 0;
function pushTrail(x, y, z) {
  const a = trailGeo.attributes.position;
  if (trailLen >= TRAIL) { a.array.copyWithin(0, 3); a.setXYZ(TRAIL - 1, x, y, z); }
  else { a.setXYZ(trailLen, x, y, z); trailLen++; }
  a.needsUpdate = true;
  trailGeo.setDrawRange(0, trailLen);
}
/* 高斯参考圈(σ 与 2σ) */
const ringS = new THREE.Mesh(new THREE.TorusGeometry(1, 0.015, 6, 72), new THREE.MeshBasicMaterial({ color: 0x63e6be, transparent: true, opacity: 0.5 }));
ringS.rotation.x = Math.PI / 2;
ringS.position.y = 0.02;
scene.add(ringS);
const ring2 = ringS.clone();
ring2.scale.setScalar(2);
ring2.material = ringS.material.clone();
ring2.material.opacity = 0.28;
scene.add(ring2);

/* ---------------- 状态(在标签前) ---------------- */
let playing = !qsBool('pause', false);
if (matchMedia('(prefers-reduced-motion: reduce)').matches && qs.get('pause') === null) playing = false;
let spd = 1.5;
let steps = 0;
let tSim = 0;
function seed() {
  walkers.length = 0;
  for (let i = 0; i < N; i++) {
    walkers.push(new THREE.Vector3((Math.random() - 0.5) * 0.06, 0.06, (Math.random() - 0.5) * 0.06));
  }
  steps = 0;
  trailLen = 0;
  trailGeo.setDrawRange(0, 0);
}

/* ---------------- 标签 ---------------- */
const labelRegistry = [];
function addLabel(textFn, pos, cls = '', target = scene) {
  const div = document.createElement('div');
  div.className = 'lbl ' + cls;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  target.add(o);
  labelRegistry.push({ o, text: textFn });
  div.textContent = textFn();
  return o;
}
const lblRing = addLabel(() => L('青圈:理论 σ 与 2σ', 'teal rings: σ and 2σ'), new THREE.Vector3(2.4, 0.3, 0), 'g');
const lblStar = addLabel(() => L('明星粒子:一颗的轨迹', 'star walker: one path'), new THREE.Vector3(0, 0.75, 0), 'b', star);
const lblStatus = addLabel(() => L('单步随机,整体规律:密度从尖峰摊成高斯钟', 'random steps, lawful crowd: the pile melts into a Gaussian bell'),
  new THREE.Vector3(0, 3.3, 0), 'st');

/* ================= 讲解步骤 ================= */
const STEPS = [
  { b: '一颗醉汉:无法预测', be: 'One drunk: unpredictable',
    d: '跟着蓝色明星粒子走:每一步四向等概率,拐来拐去毫无规律——单粒子永远说不准。',
    de: 'Follow the blue star: every step is a coin flip in four directions. One particle alone says nothing.',
    act: () => { seed(); } },
  { b: '一万颗:规律浮现', be: 'Ten thousand: the law appears',
    d: '粒子群整体却在「扩散」:中心密度下降、边缘变密——无人指挥,高斯钟自己摊开。',
    de: 'The crowd spreads anyway: the center thins, the rim thickens — a Gaussian bell unfolds with no conductor.',
    act: () => { seed(); } },
  { b: 'σ ∝ √t', be: 'σ ∝ √t',
    d: '扩散半径正比于步数的平方根:想扩散 2 倍远,要花 4 倍时间——香味、热量、污染全都守这条慢律。',
    de: 'Spread grows as the square root of time: twice as far takes four times as long. Scent, heat, pollution — all obey.',
    act: () => { seed(); } },
  { b: '青圈=理论σ', be: 'The teal rings = theory',
    d: '青色圈是 √t 公式画出的 σ 与 2σ——实际粒子云的边缘始终贴着它走:理论与模拟互相作证。',
    de: 'The teal rings plot σ and 2σ from √t — the cloud\'s rim keeps hugging them. Theory and simulation vouch for each other.',
    act: () => { seed(); } },
  { b: '万物皆随机游走', be: 'Everything random-walks',
    d: '香味分子飘进鼻腔、电子在导线里晃、股价的日内抖动——同一套数学,伽尔顿板的连续版。',
    de: 'Scent molecules, electrons in wires, intraday stock jitters — one math, the continuous cousin of the Galton board.',
    act: () => { seed(); } },
];
function stepIndex() {
  if (steps > 60) return 3;
  if (steps > 10) return 1;
  return 0;
}
function buildSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t"><b>${L(s.b, s.be)}</b>　${L(s.d, s.de)}</span>`;
    li.addEventListener('click', () => s.act());
    el.appendChild(li);
  });
}

/* ================= UI ================= */
const elPlay = document.getElementById('play');
const elSpd = document.getElementById('spd');
const elSpdVal = document.getElementById('spdVal');
const elPn = document.getElementById('pn');
const elPnVal = document.getElementById('pnVal');
const btnReset = document.getElementById('btnReset');
const btnStar = document.getElementById('btnStar');
const tglLabels = document.getElementById('tglLabels');
const tglTrail = document.getElementById('tglTrail');
const tglRotate = document.getElementById('tglRotate');
const stT = document.getElementById('stT'), stR = document.getElementById('stR'),
  stC = document.getElementById('stC');
function setPlayLabel() { elPlay.textContent = playing ? L('暂停', 'Pause') : L('播放', 'Play'); }
btnReset.addEventListener('click', () => seed());
btnStar.addEventListener('click', () => { seed(); });
elPn.addEventListener('input', () => { N = parseInt(elPn.value, 10); elPnVal.textContent = elPn.value; seed(); });
elSpd.value = spd;
elSpdVal.textContent = spd.toFixed(1) + '×';
elSpd.addEventListener('input', () => { spd = parseFloat(elSpd.value); elSpdVal.textContent = spd.toFixed(1) + '×'; });
elPlay.addEventListener('click', () => { playing = !playing; setPlayLabel(); });
tglLabels.addEventListener('change', () => {
  for (const r of labelRegistry) r.o.element.style.display = tglLabels.checked ? '' : 'none';
});
tglTrail.addEventListener('change', () => { trail.visible = tglTrail.checked; });
tglRotate.addEventListener('change', () => { controls.autoRotate = tglRotate.checked; });
if (!qsBool('labels', true)) { tglLabels.checked = false; tglLabels.dispatchEvent(new Event('change')); }
controls.autoRotate = qsBool('spin', true) && tglRotate.checked;
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); elPlay.click(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let lastStep = -1;
let starStep = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = clamp(clock.getDelta(), 0, 0.05);
  const dts = dt * spd;
  if (playing) {
    tSim += dts;
    const sub = 2;
    for (let s = 0; s < sub; s++) {
      steps++;
      for (const w of walkers) {
        const a = Math.random() * Math.PI * 2;
        w.x += Math.cos(a) * 0.02;
        w.z += Math.sin(a) * 0.02;
        w.y = 0.06 + Math.abs(Math.sin(steps * 0.1 + w.x * 3)) * 0.04;
        const lim = 3.2;
        w.x = clamp(w.x, -lim, lim);
        w.z = clamp(w.z, -lim, lim);
      }
    }
    pushTrail(walkers[starIdx].x, walkers[starIdx].y + 0.08, walkers[starIdx].z);
  }
  /* 渲染粒子 */
  walkers.forEach((w, i) => {
    if (i >= MAXN) return;
    m4.makeScale(1, 1, 1);
    m4.setPosition(w);
    mesh.setMatrixAt(i, m4);
  });
  for (let i = N; i < MAXN; i++) { m4.makeScale(0.001, 0.001, 0.001); mesh.setMatrixAt(i, m4); }
  mesh.instanceMatrix.needsUpdate = true;
  star.position.copy(walkers[starIdx]).setY(walkers[starIdx].y + 0.1);

  /* σ 实测 */
  let ss = 0;
  for (const w of walkers) ss += w.x * w.x + w.z * w.z;
  const sigma = Math.sqrt(ss / N);
  ringS.scale.setScalar(Math.max(sigma, 0.05));
  ring2.scale.setScalar(Math.max(sigma * 2, 0.1));
  /* 中心密度:距中心 < 0.3 的比例 */
  let center = 0;
  for (const w of walkers) if (w.x * w.x + w.z * w.z < 0.09) center++;

  stT.textContent = steps;
  stR.innerHTML = sigma.toFixed(2) + '<small>(σ 实测)</small>';
  stC.innerHTML = (center / N * 100).toFixed(1) + '<small> %</small>';

  for (const r of labelRegistry) r.o.element.textContent = r.text();
  const si = stepIndex();
  if (si !== lastStep) {
    lastStep = si;
    [...document.getElementById('steps').children].forEach((li, i) => li.classList.toggle('on', i === si));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

seed();
applyTheme();
applyLang();
setPlayLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
