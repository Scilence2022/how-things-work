<style>

  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }

</style>

  <h1 data-zh="呼吸的化学驱动" data-en="The Chemical Drive to Breathe">呼吸的化学驱动</h1>
  <div class="sub" data-zh="呼吸节律由延髓自发产生,但深浅快慢由化学信号掌舵:CO₂ 从血管扩散进脑脊液,pH 微降,中枢随之加大驱动——负反馈把 pCO₂ 稳在 40 mmHg 附近;主动过度通气把 CO₂ 吹到 25 以下,驱动暂时消失,呼吸停几拍等 CO₂ 回来;只有 pO₂ 跌破 60 mmHg,颈动脉体这个前哨才接管驱动(高原适应) · 拖动旋转 / 空格运行/暂停" data-en="The medulla generates the rhythm by itself, but chemistry steers depth and pace: CO₂ diffuses from blood into cerebrospinal fluid, pH dips a little, and the center ramps up its drive — a negative feedback loop holding pCO₂ near 40 mmHg; hyperventilate CO₂ below 25 and the drive vanishes — breathing pauses a few beats until CO₂ rebuilds; only when pO₂ falls under 60 mmHg do the carotid bodies, the sentinels, take over (altitude) · drag to orbit / Space = run/pause">呼吸节律由延髓自发产生,但深浅快慢由化学信号掌舵:CO₂ 从血管扩散进脑脊液,pH 微降,中枢随之加大驱动——负反馈把 pCO₂ 稳在 40 mmHg 附近;主动过度通气把 CO₂ 吹到 25 以下,驱动暂时消失,呼吸停几拍等 CO₂ 回来;只有 pO₂ 跌破 60 mmHg,颈动脉体这个前哨才接管驱动(高原适应) · 拖动旋转 / 空格运行/暂停</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x101418,18,50);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(8.2,4.6,13.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,3.55,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=3;controls.maxDistance=26;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.55));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);

/* ── 场景:半透明上半身剖面,脑干/脑脊液/颈动脉体/肺/膈肌/血流 ── */
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),groundM);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const colM=new THREE.MeshStandardMaterial({color:0x2a303a,roughness:0.7});
const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.6,1.1,36),colM);
pedestal.position.y=0.77;scene.add(pedestal);
const bodyM=new THREE.MeshStandardMaterial({color:0x8fa3b8,transparent:true,opacity:0.3,
  roughness:0.5,depthWrite:false,side:THREE.DoubleSide});
function part(geo,mat,x,y,z,sx=1,sy=1,sz=1,rz=0){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.rotation.z=rz;
  scene.add(m);return m;
}
part(new THREE.CylinderGeometry(0.82,1.05,3.3,26,1,true),bodyM,0,2.97,0);
const shM=part(new THREE.SphereGeometry(0.95,22,16),bodyM,0,4.52,0,1.05,0.5,0.75);
part(new THREE.CylinderGeometry(0.27,0.31,0.95,18,1,true),bodyM,0,4.98,0);
part(new THREE.SphereGeometry(0.62,24,18),bodyM,0,5.94,0,0.88,1.04,0.95);
/* 脑与延髓 */
const brainM=new THREE.MeshStandardMaterial({color:0xc9b8e8,transparent:true,opacity:0.35,roughness:0.4,depthWrite:false});
part(new THREE.SphereGeometry(0.4,20,14),brainM,0,6.02,-0.02,0.85,0.78,0.95);
const medM=new THREE.MeshStandardMaterial({color:0x5a3a20,roughness:0.4,emissive:0xff8c3a,emissiveIntensity:0.6});
const medulla=part(new THREE.CapsuleGeometry(0.09,0.28,6,12),medM,0,5.5,-0.13,1,1,1,0.25);
const csfM=new THREE.MeshStandardMaterial({color:0x9fd8ff,transparent:true,opacity:0.16,roughness:0.2,depthWrite:false});
part(new THREE.CapsuleGeometry(0.17,0.42,6,14),csfM,0,5.5,-0.13,1,1,1,0.25);
const chemM=new THREE.MeshStandardMaterial({color:0x1a3a4a,emissive:0x9fd8ff,emissiveIntensity:1.2});
for(const [x,y] of [[-0.09,5.4],[0.09,5.4],[-0.09,5.58],[0.09,5.58]])
  part(new THREE.SphereGeometry(0.032,8,6),chemM,x,y,-0.02);
/* 气道与肺 */
const airM=new THREE.MeshStandardMaterial({color:0xcdd6e0,transparent:true,opacity:0.5,roughness:0.4});
part(new THREE.CylinderGeometry(0.085,0.085,0.75,14),airM,0,4.42,0);
part(new THREE.CylinderGeometry(0.05,0.055,0.5,10),airM,-0.24,4.05,0,1,1,1,0.55);
part(new THREE.CylinderGeometry(0.05,0.055,0.5,10),airM,0.24,4.05,0,1,1,1,-0.55);
const lungBase=[0.44,0.62,0.38];
const lungM=new THREE.MeshStandardMaterial({color:0xe8a0a8,transparent:true,opacity:0.42,roughness:0.5,depthWrite:false});
const lungL=part(new THREE.SphereGeometry(1,22,16),lungM,-0.44,3.35,0,...lungBase);
const lungR=part(new THREE.SphereGeometry(1,22,16),lungM,0.46,3.35,0,...lungBase);
/* 膈肌:穹顶,收缩时压扁下移 */
const diaM=new THREE.MeshStandardMaterial({color:0xb86a5a,transparent:true,opacity:0.55,
  roughness:0.5,side:THREE.DoubleSide,depthWrite:false});
const dia=part(new THREE.SphereGeometry(0.88,24,12,0,Math.PI*2,0,Math.PI/2),diaM,0,2.12,0.02,1.05,0.55,0.85);
part(new THREE.SphereGeometry(0.2,16,12),new THREE.MeshStandardMaterial({color:0xa84a4a,
  transparent:true,opacity:0.6,roughness:0.4,depthWrite:false}),0.14,2.98,0.16,1,1.2,1);
/* 脊柱与膈神经通路 */
const boneM=new THREE.MeshStandardMaterial({color:0xb9c2cc,roughness:0.45,transparent:true,opacity:0.75});
const spinePts=[[0,5.35,-0.16],[0,4.6,-0.44],[0,3.5,-0.5],[0,2.4,-0.42],[0,2.06,-0.16]]
  .map(p=>new THREE.Vector3(...p));
const spineCurve=new THREE.CatmullRomCurve3(spinePts);
part(new THREE.TubeGeometry(spineCurve,32,0.05,8),boneM,0,0,0);
/* 血管环路 + 血流粒子(CO₂ 橙 / O₂ 青) */
const vesselCurve=new THREE.CatmullRomCurve3([
  [0.14,2.98,0.18],[0.28,3.9,0.12],[0.28,4.9,0.1],[0.16,5.4,0.08],[-0.16,5.4,0.08],
  [-0.28,4.9,0.1],[-0.28,3.9,0.12],[-0.14,3.0,0.18],[0,3.28,0.5]].map(p=>new THREE.Vector3(...p)),true);
part(new THREE.TubeGeometry(vesselCurve,72,0.055,8,true),
  new THREE.MeshStandardMaterial({color:0x994444,transparent:true,opacity:0.35,roughness:0.4,depthWrite:false}),0,0,0);
const cbM=new THREE.MeshStandardMaterial({color:0x123a44,emissive:0x53d6e8,emissiveIntensity:0.15});
part(new THREE.SphereGeometry(0.06,10,8),cbM,0.29,4.9,0.12);
part(new THREE.SphereGeometry(0.06,10,8),cbM,-0.29,4.9,0.12);
const co2M=new THREE.MeshStandardMaterial({color:0x3a1c08,emissive:0xff8c3a,emissiveIntensity:0.9});
const o2M=new THREE.MeshStandardMaterial({color:0x08282e,emissive:0x53d6e8,emissiveIntensity:1.0});
const pGeo=new THREE.SphereGeometry(0.05,10,8);
const cells=[];
for(let i=0;i<21;i++){
  const co2=i<12;
  const m=new THREE.Mesh(pGeo,co2?co2M:o2M);scene.add(m);
  cells.push({m,co2,off:i/21});
}
/* CO₂ → 脑脊液扩散小径 */
const diffCurve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(0.16,5.42,0.09),
  new THREE.Vector3(0.09,5.36,0.0),new THREE.Vector3(0.0,5.44,-0.1));
const diffP=[];
for(let i=0;i<3;i++){const m=new THREE.Mesh(pGeo,co2M);scene.add(m);diffP.push(m);}
/* 延髓节律脉冲壳 + 膈神经信号点 */
const shells=[];
for(let i=0;i<3;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),
    new THREE.MeshBasicMaterial({color:0xffb35c,transparent:true,opacity:0,depthWrite:false}));
  m.position.copy(medulla.position);scene.add(m);shells.push(m);
}
const sigM=new THREE.MeshStandardMaterial({color:0x3a2408,emissive:0xffb35c,emissiveIntensity:1.6});
const signal=part(new THREE.SphereGeometry(0.05,8,6),sigM,0,5.4,-0.2);

/* 状态与生理模型:主驱动=CO₂/H⁺,负反馈稳 40 mmHg;低氧前哨 pO₂<60 */
let mode='rest',metab=1,pco2=40,po2=95,hypoT=0;
let playing=true,labelsOn=true,slowMo=false,curveOn=false;
let veAct=6,ph=7.32,rate=15,apnea=false,bPh=0,respW=0.4,flowT=0,simT=0;
const qs=new URLSearchParams(location.search);
if(qs.get('pause')==='1')playing=false;
if(qs.get('labels')==='0')labelsOn=false;
let t0=-1;if(qs.get('t')!==null){t0=parseInt(qs.get('t'))||0;}
const driveF=()=>Math.max(0,pco2-25)*0.4+(po2<60?(60-po2)*0.18:0);

const labelReg=[];
function addLabel(textFn,pos,cls='',visFn=()=>true){
  const div=document.createElement('div');div.className='lbl '+cls;
  const o=new CSS2DObject(div);o.position.copy(pos);scene.add(o);
  labelReg.push({o,text:textFn,vis:visFn});div.textContent=textFn();return o;
}
addLabel(()=>L('延髓呼吸中枢 · 节律自发生','Medullary center · self-made rhythm'),new THREE.Vector3(0.85,6.15,-0.15),'o');
addLabel(()=>L(`脑脊液 pH ${ph.toFixed(2)} · CO₂↑ 则 pH↓`,`CSF pH ${ph.toFixed(2)} · CO₂ up, pH down`),new THREE.Vector3(1.05,5.42,0.25),'r');
addLabel(()=>L('颈动脉体 · 低氧前哨(pO₂<60 接管)','Carotid body · sentinel (takes over < 60)'),new THREE.Vector3(1.0,4.88,0.3),'b');
addLabel(()=>L(`肺 · 通气 ${veAct.toFixed(1)} L/min`,`Lungs · ${veAct.toFixed(1)} L/min`),new THREE.Vector3(-1.25,3.95,0.3),'y');
addLabel(()=>L('膈肌收缩 → 胸腔扩大 → 吸气','Diaphragm contracts → chest expands → inhale'),new THREE.Vector3(1.05,1.95,0.55),'g');
addLabel(()=>L('pCO₂ < 25 · 驱动消失 → 呼吸暂停','pCO₂ < 25 · drive gone → apnea'),new THREE.Vector3(0,2.62,1.15),'r',()=>apnea);

function setPco(v){pco2=clamp(v,20,70);
  document.getElementById('sPco').value=pco2;
  document.getElementById('sPcoVal').textContent=pco2.toFixed(0)+' mmHg';updateStats();}
function setPo2(v){po2=clamp(v,30,100);
  document.getElementById('sPo').value=po2;
  document.getElementById('sPoVal').textContent=po2.toFixed(0)+' mmHg';updateStats();}
function setMode(m){mode=m;metab=m==='exercise'?2.3:1;
  if(m==='hypo')hypoT=6;
  document.getElementById('bRest').classList.toggle('on',m==='rest');
  document.getElementById('bEx').classList.toggle('on',m==='exercise');
  document.getElementById('bHypo').classList.toggle('on',m==='hypo');
  updateStats();}
function setCurve(v){curveOn=v;
  document.getElementById('curveWrap').style.display=v?'block':'none';
  document.getElementById('tglCurve').checked=v;
  if(v)drawCurve();}

function drawCurve(){
  const c=document.getElementById('curve'),ctx=c.getContext('2d');
  const w=c.width,h=c.height,pl=34,pr=8,pt=12,pb=22;
  const X=p=>pl+(p-20)/50*(w-pl-pr),Y=v=>h-pb-v/25*(h-pt-pb);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(140,155,175,0.7)';ctx.lineWidth=1;
  ctx.strokeRect(pl,pt,w-pl-pr,h-pt-pb);
  ctx.font='10px sans-serif';ctx.fillStyle='rgba(150,165,185,0.95)';ctx.textAlign='center';
  for(const p of [20,40,60])ctx.fillText(p,X(p),h-8);
  ctx.textAlign='right';
  for(const v of [0,10,20])ctx.fillText(v,pl-4,Y(v)+3);
  ctx.textAlign='left';
  ctx.fillText(L('通气量 L/min','Ve L/min'),pl+4,pt+2);
  ctx.textAlign='right';
  ctx.fillText(L('pCO₂ mmHg','pCO₂ mmHg'),w-pr-2,pt+2);
  /* 呼吸暂停阈值 25 mmHg */
  ctx.strokeStyle='rgba(255,107,107,0.8)';ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(X(25),pt);ctx.lineTo(X(25),h-pb);ctx.stroke();ctx.setLineDash([]);
  /* 响应曲线:中枢 CO₂ 驱动 + 低氧附加 */
  ctx.strokeStyle='#d9822b';ctx.lineWidth=2;ctx.beginPath();
  for(let p=20;p<=70;p+=1){
    const v=Math.max(0,(p-25))*0.4+(po2<60?(60-po2)*0.18:0);
    const y=Y(Math.min(v,25));
    p===20?ctx.moveTo(X(p),y):ctx.lineTo(X(p),y);
  }
  ctx.stroke();
  /* 当前工作点 */
  ctx.fillStyle='#f2f5f9';ctx.beginPath();
  ctx.arc(X(pco2),Y(Math.min(veAct,25)),3.2,0,Math.PI*2);ctx.fill();
}

const STEPS=[
 {zh:'<b>节律自发生</b>:延髓起搏网络自己振荡;没有化学反馈,基本节律照样走',
  en:'<b>The rhythm is self-made</b>: the medullary pacemaker oscillates on its own — no chemical input needed',
  act(){setMode('rest');setPco(40);setPo2(95);setCurve(false);}},
 {zh:'<b>CO₂ 是主驱动</b>:pCO₂ 拉到 60,中枢驱动与通气大增;此刻缺氧并未参与',
  en:'<b>CO₂ is the main drive</b>: pCO₂ to 60 — drive and ventilation surge; hypoxia plays no part yet',
  act(){setPco(60);}},
 {zh:'<b>感受器读 pH</b>:CO₂ 扩散进脑脊液,pH 微降,延髓信号随 pH 加密',
  en:'<b>Sensors read pH</b>: CO₂ diffuses into CSF and pH dips; the medulla fires faster',
  act(){setPco(52);}},
 {zh:'<b>通气响应曲线</b>:打开浮板——pCO₂ 25 mmHg 阈值之上的陡直线段,就是负反馈的增益',
  en:'<b>The response curve</b>: open the panel — the steep line above the 25 mmHg threshold is the feedback gain',
  act(){setCurve(true);setPco(45);}},
 {zh:'<b>过度通气的暂停</b>:强吹 6 秒,pCO₂ 跌破 25 → 驱动消失、呼吸暂停,CO₂ 回升后自动重启',
  en:'<b>Post-hyperventilation pause</b>: 6 s forced venting drops pCO₂ below 25 — drive vanishes, apnea until CO₂ rebuilds',
  act(){setMode('hypo');setCurve(false);}},
 {zh:'<b>低氧前哨与高原</b>:pO₂<60 时颈动脉体接管驱动;高原长期低氧正靠它撑起通气',
  en:'<b>Hypoxic sentinel & altitude</b>: under pO₂ 60 the carotid bodies take over — they carry ventilation at altitude',
  act(){setMode('rest');setPo2(45);setPco(38);}},
];
let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${LANG==='en'?s.en:s.zh}</b></span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

function updateStats(){
  document.getElementById('sPcoVal').textContent=pco2.toFixed(0)+' mmHg';
  const pv=document.getElementById('stPco');
  pv.innerHTML=pco2.toFixed(0)+'<small> mmHg</small>';
  pv.className='v '+(pco2>55||pco2<25?'warn':(pco2>=36&&pco2<=45?'ok':''));
  const hv=document.getElementById('stPh');
  hv.innerHTML=ph.toFixed(2)+'<small> </small>';
  hv.className='v '+(ph<7.25||ph>7.45?'warn':'');
  const vv=document.getElementById('stVe');
  vv.innerHTML=veAct.toFixed(1)+'<small> L/min</small>';
  vv.className='v '+(veAct<0.5?'warn':(veAct>=4&&veAct<=12?'ok':''));
  const rv=document.getElementById('stRate');
  rv.innerHTML=rate.toFixed(0)+'<small> /min</small>';
  rv.className='v '+(rate<0.5||rate>30?'warn':(rate>=10&&rate<=22?'ok':''));
  if(curveOn)drawCurve();
}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});
function syncPlayBtn(){document.getElementById('play').textContent=playing?L('暂停','Pause'):L('运行','Run');}
document.getElementById('langBtn').addEventListener('click',()=>{LANG=LANG==='zh'?'en':'zh';localStorage.setItem('htw-lang',LANG);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('htw-theme',THEME);applyTheme();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
document.getElementById('bRest').addEventListener('click',()=>setMode('rest'));
document.getElementById('bEx').addEventListener('click',()=>setMode('exercise'));
document.getElementById('bHypo').addEventListener('click',()=>setMode('hypo'));
document.getElementById('sPco').addEventListener('input',e=>setPco(+e.target.value));
document.getElementById('sPo').addEventListener('input',e=>setPo2(+e.target.value));

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x101418:0xe9e4dc);
  scene.fog.color.setHex(dark?0x101418:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';
  buildSteps();
}

const clock=new THREE.Clock();
let raf=null;
const v3=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* 化学驱动与负反馈:运动代谢↑ → pCO₂↑ → 通气↑;过度通气强排 6 s */
  if(mode==='hypo'){veAct=22;hypoT-=dts;if(hypoT<=0)setMode('rest');}
  else veAct=driveF();
  apnea=veAct<0.05;
  pco2=clamp(pco2+(6*metab-0.025*veAct*pco2)*0.28*dts,20,70);
  ph=clamp(7.32+(40-pco2)*0.01,6.9,7.6);
  rate=apnea?0:clamp(10+veAct*0.9,8,34);
  /* 呼吸机械:频率=rate,潮气量∝Ve/rate,膈肌收缩压扁、肺扩张 */
  const vt=veAct*1000/Math.max(rate,1),amp=clamp(vt/550,0.35,1.5);
  bPh+=dts*rate/60*Math.PI*2;
  const target=apnea?0.45:(1-Math.cos(bPh))/2;
  respW+=(target-respW)*Math.min(1,dts*6);
  const inf=1+0.11*amp*respW;
  lungL.scale.set(lungBase[0]*inf,lungBase[1]*inf,lungBase[2]*inf);
  lungR.scale.set(lungBase[0]*inf,lungBase[1]*inf,lungBase[2]*inf);
  dia.scale.y=0.55-0.24*amp*respW;
  dia.position.y=2.12-0.15*amp*respW;
  /* 延髓脉冲壳:频率∝驱动;暂停时熄灭 */
  const driveGlow=clamp(veAct/16,0,1);
  medM.emissiveIntensity=apnea?0.1:0.3+1.3*driveGlow;
  const period=apnea?0:60/Math.max(rate*2.2,6);
  shells.forEach((sh,i)=>{
    if(!period){sh.material.opacity=0;return;}
    const t=(simT/period+i/3)%1;
    sh.scale.setScalar(0.12+t*0.78);
    sh.material.opacity=(1-t)*0.32*(0.4+driveGlow*0.6);
  });
  /* 膈神经信号:每呼吸行程一次,延髓→膈肌 */
  signal.visible=!apnea;
  if(!apnea){const t=(simT*rate/60)%1;spineCurve.getPoint(1-t,v3);signal.position.copy(v3);}
  /* 血流:速度∝通气;CO₂/O₂ 亮度跟随分压 */
  flowT+=dts*(0.02+veAct*0.0038);
  for(const c of cells){
    v3.copy(vesselCurve.getPoint((c.off+flowT)%1));
    c.m.position.copy(v3);
  }
  co2M.emissiveIntensity=0.35+clamp((pco2-25)/45,0,1)*1.3;
  o2M.emissiveIntensity=0.25+clamp((po2-30)/70,0,1)*1.2;
  diffP.forEach((m,i)=>{
    const t=(simT*0.22+i/3)%1;
    diffCurve.getPoint(t,v3);m.position.copy(v3);
    m.scale.setScalar(0.5+Math.sin(Math.PI*t)*0.7);
  });
  /* 颈动脉体:pO₂<60 才点亮 */
  const cbOn=po2<60;
  cbM.emissiveIntensity=cbOn?1.2+0.8*Math.sin(simT*5):0.15;
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){r.o.visible=labelsOn&&r.vis();if(r.o.visible)r.o.element.textContent=r.text();}
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

</script>
<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
