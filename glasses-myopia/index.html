<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>近视眼镜与屈光矫正 · 镜片不治眼轴,只重排光路</title>
<style>
  :root,:root[data-theme="dark"]{
    color-scheme:dark;--acc:#15aabf;
    --bg:#0f1113;--panel:rgba(15,17,19,.86);--panel-border:rgba(255,255,255,.09);
    --text:#f2f5f9;--text2:#9fb0c3;--text3:#c7d2de;
    --hover:rgba(255,255,255,.05);--shadow:0 8px 30px rgba(0,0,0,.45);
    --tool:rgba(15,17,19,.78);--tool-border:rgba(255,255,255,.12);--cv-pill:rgba(15,17,19,.8);
  }
  :root[data-theme="light"]{
    color-scheme:light;--acc:#0c8599;
    --bg:#f1efec;--panel:rgba(255,255,255,.88);--panel-border:rgba(15,25,40,.10);
    --text:#16202c;--text2:#5b6b7d;--text3:#33414f;
    --hover:rgba(15,25,40,.05);--shadow:0 8px 26px rgba(30,45,70,.15);
    --tool:rgba(255,255,255,.85);--tool-border:rgba(15,25,40,.14);--cv-pill:rgba(255,255,255,.85);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;transition:background .25s}
  #app{position:fixed;inset:0}#app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{background:var(--cv-pill);border:1px solid var(--tool-border);color:var(--text3);font-size:12px;
    line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .25s}
  :root[data-theme="light"] .lbl{text-shadow:none}
  .lbl.o{border-color:rgba(255,169,77,.9);color:#ffe0c2}.lbl.r{border-color:rgba(255,107,107,.9);color:#ffc2c2}
  .lbl.g{border-color:rgba(116,220,132,.9);color:#c8f5d0}.lbl.b{border-color:rgba(116,192,252,.9);color:#bde9ff}
  .lbl.y{border-color:rgba(252,196,25,.9);color:#ffe9a8}
  :root[data-theme="light"] .lbl.o{color:#a34e00}:root[data-theme="light"] .lbl.r{color:#c92a2a}
  :root[data-theme="light"] .lbl.g{color:#2b8a3e}:root[data-theme="light"] .lbl.b{color:#1864ab}
  :root[data-theme="light"] .lbl.y{color:#b8860b}
  #tools{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px}
  .tbtn{appearance:none;border:1px solid var(--tool-border);background:var(--tool);
    color:var(--text3);font:inherit;font-size:12.5px;font-weight:600;min-width:40px;height:32px;
    padding:0 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;text-decoration:none;backdrop-filter:blur(6px);
    transition:border-color .15s,color .15s,transform .15s}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
  #title{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;max-width:calc(100vw - 320px)}
  #title h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #title .sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  #stats{position:fixed;right:18px;bottom:18px;z-index:4;background:var(--panel);
    border:1px solid var(--panel-border);border-radius:12px;padding:10px 16px;
    backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;gap:3px 18px}
  #stats .k{font-size:12px;color:var(--text2);align-self:center}
  #stats .v{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  #stats .v small{font-size:11px;color:var(--text2);font-weight:400}
  #stats .v.warn{color:#ffa94d}#stats .v.ok{color:#8ce99a}
  #panel{position:fixed;left:18px;bottom:18px;z-index:5;width:392px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(6px);
    box-shadow:var(--shadow);max-height:calc(100vh - 160px);overflow:auto}
  #actions{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .abtn{appearance:none;font:inherit;cursor:pointer;flex:1 1 30%;
    background:var(--hover);color:var(--text2);border:1px solid var(--tool-border);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;
    transition:border-color .15s,color .15s,background .15s}
  .abtn:hover{border-color:var(--acc);color:var(--text)}
  .abtn.on{border-color:rgba(21,170,191,.6);background:rgba(21,170,191,.12);color:var(--text)}
  :root[data-theme="light"] .abtn.on{border-color:rgba(12,133,153,.55);background:rgba(12,133,153,.10)}
  .row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .row label{font-size:12px;color:var(--text2);flex:0 0 92px}
  .row .val{font-size:11.5px;color:var(--text3);flex:0 0 72px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc);height:18px}
  #steps{list-style:none;margin-top:8px}
  #steps li{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;align-items:flex-start}
  #steps li:hover{background:var(--hover)}
  #steps li.on{background:rgba(21,170,191,.10);border-color:rgba(21,170,191,.45)}
  :root[data-theme="light"] #steps li.on{background:rgba(12,133,153,.08);border-color:rgba(12,133,153,.4)}
  #steps .n{flex:0 0 18px;height:18px;border-radius:50%;font-size:11.5px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    background:rgba(255,255,255,.12);color:var(--text3)}
  :root[data-theme="light"] #steps .n{background:rgba(15,25,40,.10)}
  #steps li.on .n{background:var(--acc);color:#fff}
  #steps .t{font-size:12px;color:var(--text3);line-height:1.45}
  #steps .t b{color:var(--text);font-size:12px}
  #steps li.on .t b{color:#b8ecf3}
  :root[data-theme="light"] #steps li.on .t b{color:var(--acc)}
  #ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border)}
  #play{grid-row:1/3;grid-column:1;padding:10px 14px;font-size:14px;font-weight:600;
    background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer}
  #play:hover{filter:brightness(1.12)}
  #toggles{display:flex;gap:12px;flex-wrap:wrap}
  #toggles label{font-size:12px;color:var(--text2);display:flex;gap:5px;align-items:center;cursor:pointer}
  #toggles input{accent-color:var(--acc)}
  #rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--panel-border);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #rel span{font-size:11.5px;color:var(--text2)}
  #rel a{font-size:11.5px;color:var(--text3);text-decoration:none;border:1px solid var(--tool-border);
    border-radius:999px;padding:3px 10px;transition:color .15s,border-color .15s}
  #rel a:hover{color:var(--acc);border-color:var(--acc)}
  /* 控制面板折叠按钮 */
  #panelToggle { display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin: -4px 0 -22px auto; position: sticky; top: 8px; z-index: 3;
    border-radius: 8px; border: 1px solid var(--tool-border); background: var(--tool);
    color: var(--text2); font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
  #panelToggle:hover { border-color: var(--acc); color: var(--acc); }
  #panelToggle + * { padding-right: 34px; }
  #panel { scrollbar-width: thin; scrollbar-color: rgba(140,140,150,.6) transparent; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(140,140,150,.55); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel > .panelFade { position: sticky; bottom: 0; z-index: 2; height: 26px; margin: -26px 0 -4px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(to bottom, transparent, var(--panel) 78%); }
  #panel.scrollable:not(.at-bottom) > .panelFade { opacity: 1; }
  #panel.collapsed { width: auto; min-width: 0; padding: 6px; max-height: none; overflow: visible; }
  #panel.collapsed > :not(#panelToggle) { display: none; }
  #panel.collapsed > #panelToggle { margin: 0; position: static; }
  @media (max-width: 760px) { #panel.collapsed { width: auto; } }
  @media(max-width:900px){#stats{display:none}}
  @media(max-width:760px){#panel{width:calc(100vw - 36px);max-height:55vh}
    #title{max-width:calc(100vw - 200px)}#title h1{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="title">
  <h1 data-zh="近视眼镜与屈光矫正" data-en="Glasses &amp; Refractive Correction">近视眼镜与屈光矫正</h1>
  <div class="sub" data-zh="眼轴过长(或角膜过陡)→ 远处平行光被 60 D 的角膜+晶状体聚焦在视网膜之前 → 看远糊 → 凹透镜(负度数)先把光线发散一档、焦点整体后推回视网膜 → 镜片不治眼轴,只重排光路:1/f=1/u+1/v → 度数=焦距倒数×100,−3.00 D 即焦距 −33 cm → 散光是角膜子午线曲率不均:两个方向各自成像,加柱镜对齐 → 远视相反:眼轴过短、凸透镜前移焦点 · 拖动旋转 / 空格运行/暂停" data-en="An axial length too long (or cornea too steep) → parallel rays from afar meet 60 D of cornea-plus-lens power and focus in FRONT of the retina → distance blur → a minus lens pre-diverges the beam and pushes the whole focal point back onto the retina → glasses never shorten the eye, they only re-route light: 1/f=1/u+1/v → power = 100/focal(m); −3.00 D means f = −33 cm → astigmatism: unequal corneal meridians form two line foci, tamed with a cylinder → hyperopia is the mirror case: eye too short, plus lens pulls focus forward · drag to orbit / Space = run/pause">眼轴过长(或角膜过陡)→ 远处平行光被 60 D 的角膜+晶状体聚焦在视网膜之前 → 看远糊 → 凹透镜(负度数)先把光线发散一档、焦点整体后推回视网膜 → 镜片不治眼轴,只重排光路:1/f=1/u+1/v → 度数=焦距倒数×100,−3.00 D 即焦距 −33 cm → 散光是角膜子午线曲率不均:两个方向各自成像,加柱镜对齐 → 远视相反:眼轴过短、凸透镜前移焦点 · 拖动旋转 / 空格运行/暂停</div>
</div>
<div id="tools">
  <a class="tbtn" href="../" data-zh="← 首页" data-en="← Home">← 首页</a>

  <button class="tbtn" id="themeBtn" aria-label="toggle theme">☀</button>

  <span class="k" data-zh="眼轴" data-en="Axial length">眼轴</span><span class="v" id="stAx">—</span>
  <span class="k" data-zh="焦点相对视网膜" data-en="Focus vs retina">焦点相对视网膜</span><span class="v" id="stF">—</span>

  <div id="actions">
    <button class="abtn on" id="bMy" data-zh="近视眼" data-en="Myopia">近视眼</button>
    <button class="abtn" id="bHy" data-zh="远视眼" data-en="Hyperopia">远视眼</button>

  </div>
  <div class="row">
    <label data-zh="球镜度数" data-en="Sphere">球镜度数</label>

    <span class="val" id="sCVal">0.00 D</span>

  <ol id="steps"></ol>
  <div id="ctrl">
    <button id="play" data-zh="运行" data-en="Run">运行</button>
    <div id="toggles">

  <div id="rel">
    <span data-zh="相关:" data-en="Related:">相关:</span>

  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const htmlEl=document.documentElement;
let THEME=localStorage.getItem('htw-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
let LANG=localStorage.getItem('htw-lang')||'zh';
const L=(zh,en)=>LANG==='en'?en:zh;

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3';
document.body.appendChild(labelRenderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x10141a,26,80);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,200);
camera.position.set(3.2,2.6,10.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(2.4,0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=40;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe8f2,0x1a1c22,0.6));
const key=new THREE.DirectionalLight(0xfff2dd,1.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x9ab8ff,0.3);fill.position.set(-8,5,-6);scene.add(fill);
const groundM=new THREE.MeshStandardMaterial({color:0x1c2027,roughness:0.95});
const ground=new THREE.Mesh(new THREE.CircleGeometry(20,48),groundM);
ground.rotation.x=-Math.PI/2;ground.position.y=-3.4;scene.add(ground);
/* 光轴虚线 */
const axGeo=new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(-5.4,0,0),new THREE.Vector3(8.6,0,0)]);
scene.add(new THREE.Line(axGeo,new THREE.LineDashedMaterial({color:0x54607a,dashSize:0.16,gapSize:0.12,transparent:true,opacity:0.6})));

/* ── 眼球剖面:世界 1 单位 = 4 mm,角膜顶点 x=0,光沿 +X ── */
const U=4;                       /* mm → unit */
const D2R=Math.PI/180;
const X_GL=-13/U, X_EYE=5/U;     /* 镜片 -13 mm,等效角膜+晶状体 5 mm 处,+54 D */
const P_EYE=54;
const outlineM=new THREE.MeshStandardMaterial({color:0xb8c4d4,roughness:0.5});
const outline=new THREE.Mesh(new THREE.TubeGeometry(
  new THREE.CatmullRomCurve3(new THREE.EllipseCurve(0,0,1,1,0,Math.PI*2,false,0).getPoints(90).map(p=>new THREE.Vector3(p.x,p.y,0)),true),64,0.035,8,false),outlineM);
outline.scale.set(0.5,0.5,0.5);scene.add(outline);
const vitM=new THREE.MeshBasicMaterial({color:0x74c0fc,transparent:true,opacity:0.05});
const vitreous=new THREE.Mesh(new THREE.CircleGeometry(0.93,48),vitM);
scene.add(vitreous);
const retM=new THREE.MeshBasicMaterial({color:0x51cf66});
const retinaPts=[];
for(let a=100;a<=260;a+=4)retinaPts.push(new THREE.Vector3(Math.cos(a*D2R),Math.sin(a*D2R),0));
const retina=new THREE.Line(new THREE.BufferGeometry().setFromPoints(retinaPts),retM);
scene.add(retina);
const maculaM=new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0.9});
const macula=new THREE.Mesh(new THREE.CircleGeometry(0.07,18),maculaM);
scene.add(macula);
const corM=new THREE.MeshStandardMaterial({color:0xaecbe0,roughness:0.15,transparent:true,opacity:0.5});
const cornea=new THREE.Mesh(new THREE.TorusGeometry(1.35,0.09,10,40,Math.PI*0.78),corM);
cornea.rotation.z=-Math.PI*0.61;cornea.position.set(0.62,0,0);scene.add(cornea);
const irisM=new THREE.MeshStandardMaterial({color:0x2b4a66,roughness:0.6});
for(const sy of [-1,1]){
  const ir=new THREE.Mesh(new THREE.CircleGeometry(0.42,20,0,Math.PI/2),irisM);
  ir.position.set(0.28,sy*0.42,0);ir.rotation.z=sy>0?Math.PI:0;ir.scale.set(1,0.8,1);
  scene.add(ir);
}
const lensM=new THREE.MeshStandardMaterial({color:0xcfe4f2,roughness:0.2,transparent:true,opacity:0.55});
const eyeLens=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),lensM);
eyeLens.scale.set(0.14,0.42,0.3);eyeLens.position.set(X_EYE,0,0);scene.add(eyeLens);
/* 眼底脉络膜红膜(视网膜后壁) */
const chM=new THREE.MeshBasicMaterial({color:0x7a2f2f,transparent:true,opacity:0.35});
const choroPts=[];
for(let a=110;a<=250;a+=4)choroPts.push(new THREE.Vector3(Math.cos(a*D2R),Math.sin(a*D2R),0));
const choroid=new THREE.Line(new THREE.BufferGeometry().setFromPoints(choroPts),chM);
scene.add(choroid);
/* 平行光源 */
const emitM=new THREE.MeshStandardMaterial({color:0x39424e,roughness:0.5,metalness:0.5});
const emitter=new THREE.Mesh(new THREE.BoxGeometry(0.3,2.6,0.5),emitM);
emitter.position.set(-5.6,0,0);scene.add(emitter);
/* 眼镜片 */
const glassM=new THREE.MeshStandardMaterial({color:0xd6ecf7,roughness:0.1,transparent:true,
  opacity:0.42,emissive:0x15aabf,emissiveIntensity:0.12});
const glasses=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.05,10,40),glassM);
glasses.rotation.y=Math.PI/2;glasses.scale.set(1,1,0.24);glasses.position.set(X_GL,0,0);scene.add(glasses);
/* 两束光线:白色(水平子午线)+ 青色(垂直子午线) */
const NR=9;
const HS=[-0.5,-0.375,-0.25,-0.125,0,0.125,0.25,0.375,0.5];
const rayGeoA=new THREE.BufferGeometry();
const rayGeoB=new THREE.BufferGeometry();
const arrA=new Float32Array(NR*3*2*3),arrB=new Float32Array(NR*3*2*3);
rayGeoA.setAttribute('position',new THREE.BufferAttribute(arrA,3));

/* ── 状态与近轴光学 ── */
let axMM=26.5,dsph=0,dcyl=0,astig=0,playing=true,labelsOn=true,slowMo=false,fanOn=true;

/* 近轴追迹:薄透镜 Δθ=−h·P·1e−3(h mm,P D),返回焦点位置与出射(h,θ) */
function trace(Pg,Pe){
  const h=1;                     /* 近轴 1 mm */
  let th=0,h1=h;
  th-=h1*Pg*1e-3;                /* 眼镜 */
  const h2=h1+th*(5-(-13));
  th-=h2*Pe*1e-3;                /* 角膜+晶状体 */
  const xF=th<0?5+h2/(-th):999;
  return {xF,h2,th};
}
function fanRays(Pg,Pe){
  /* 每根光线三段:光源→眼镜→眼内透镜→视网膜 */
  const Lmm=axMM;
  const out=[];
  for(const h0 of HS){
    const hm=h0*U;
    let th=0;
    const xg=X_GL*U;
    th-=hm*Pg*1e-3;
    const hEye=hm+th*(5-xg);
    th-=hEye*Pe*1e-3;
    const hRet=hEye+th*(Lmm-5);
    out.push({hm,hEye,hRet,th});
  }
  return out;
}
function focusOffset(){return trace(dsph,P_EYE).xF-axMM;}

  labelReg.push({o,text:textFn,vis:visFn,clsFn:typeof cls==='function'?cls:null});
  div.textContent=textFn();return o;
}

function rebuildEye(){
  const r=axMM/2/U;
  outline.position.set(r,0,0);outline.scale.set(r,r,r*0.92);
  vitreous.position.set(r,0,0);vitreous.scale.set(r/0.93*0.985,r/0.93*0.94,1);
  retina.position.set(r,0,0);retina.scale.setScalar(r-0.12);
  choroid.position.set(r,0,0);choroid.scale.setScalar(r-0.02);
}
function setL(vv){axMM=clamp(vv,21,29);
  document.getElementById('sL').value=axMM;
  document.getElementById('sLVal').textContent=axMM.toFixed(1)+' mm';
  rebuildEye();}
function setD(vv){dsph=clamp(vv,-16,8);
  document.getElementById('sD').value=dsph;
  document.getElementById('sDVal').textContent=(dsph>=0?'+':'')+dsph.toFixed(2)+' D';}
function setC(vv){dcyl=clamp(vv,-4,0);
  document.getElementById('sC').value=dcyl;
  document.getElementById('sCVal').textContent=dcyl.toFixed(2)+' D';}
function fmtRx(){
  const s=(dsph===0?'':(dsph>0?'+':'')+dsph.toFixed(2));
  const c=dcyl===0?'':' / '+(dcyl>0?'+':'')+dcyl.toFixed(2)+' DC';
  return (s||'0.00')+c;
}
function setMode(m){
  document.getElementById('bMy').classList.toggle('on',m==='my');
  document.getElementById('bHy').classList.toggle('on',m==='hy');
  document.getElementById('bAst').classList.toggle('on',m==='ast');
  if(m==='my'){setL(26.5);astig=0;}
  if(m==='hy'){setL(21.5);astig=0;}
  if(m==='ast'){setL(24.5);astig=4;}
}
function autoRefract(){
  /* 二分求恰好矫正的球镜(第一子午线) */
  let lo=-16,hi=8;
  for(let i=0;i<40;i++){
    const mid=(lo+hi)/2;
    if(trace(mid,P_EYE).xF>axMM)lo=mid;else hi=mid;
  }
  const Pg=(lo+hi)/2;setD(Math.round(Pg*4)/4);
  if(astig>0.01){
    let l2=-16,h2=8;
    for(let i=0;i<40;i++){
      const mid=(l2+h2)/2;
      if(trace(mid,P_EYE+astig).xF>axMM)l2=mid;else h2=mid;
    }
    const PgB=(l2+h2)/2;setC(clamp(Math.round((PgB-Pg)*4)/4,-4,0));
  }else setC(0);
}
function updateStats(){
  const off=focusOffset();
  const tr=trace(dsph,P_EYE);
  const rays=fanRays(dsph,P_EYE);
  const blur=2*Math.abs(rays[0].hRet);
  document.getElementById('stAx').innerHTML=axMM.toFixed(1)+'<small> mm</small>';
  const fv=document.getElementById('stF');
  fv.innerHTML=(off>=0?'+':'')+off.toFixed(1)+'<small> mm</small>';
  fv.className='v '+(Math.abs(off)<0.25?'ok':'warn');
  document.getElementById('stRx').textContent=fmtRx();
  const bv=document.getElementById('stBlur');
  bv.innerHTML=blur.toFixed(2)+'<small> mm</small>';
  bv.className='v '+(blur<0.1?'ok':'warn');
}

const STEPS=[

let activeStep=0;
function buildSteps(){
  const el=document.getElementById('steps');el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b>${L(s.b,s.be)}</b>　${L(s.d,s.de)}</span>`;
    li.addEventListener('click',()=>{applyPhase(i);});
    el.appendChild(li);
  });
  syncSteps();
}
function syncSteps(){document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===activeStep));}
function applyPhase(i){activeStep=i;STEPS[i].act();syncSteps();}

document.getElementById('play').addEventListener('click',()=>{playing=!playing;syncPlayBtn();});

function applyTheme(){
  htmlEl.dataset.theme=THEME;
  document.getElementById('themeBtn').textContent=THEME==='dark'?'☀':'☾';
  const dark=THEME==='dark';
  scene.background=new THREE.Color(dark?0x10141a:0xe9e4dc);
  scene.fog.color.setHex(dark?0x10141a:0xe9e4dc);
  groundM.color.setHex(dark?0x1c2027:0xc9c2b6);
  outlineM.color.setHex(dark?0xb8c4d4:0x8d99a8);
}
function applyLang(){
  htmlEl.lang=LANG==='en'?'en':'zh-CN';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.textContent=LANG==='en'?(el.dataset.en||el.dataset.zh):el.dataset.zh;
  });
  document.getElementById('langBtn').textContent=LANG==='en'?'ZH':'EN';

const clock=new THREE.Clock();
let raf=null;
const tmp=new THREE.Vector3();
function frame(){
  raf=requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05);
  const dts=dt*(playing?1:0)*(slowMo?0.3:1);
  simT+=dts;
  /* ── 光线追迹 ── */
  const Lmm=axMM;
  const fillFan=(arr,rays,draw)=>{
    if(!draw){for(let k=0;k<arr.length;k++)arr[k]=-99;return;}
    rays.forEach((r,i)=>{
      const x0=-5.45*U,h0=r.hm,x1=X_GL*U;
      const h1=h0;                       /* 眼镜前平行 */
      const x2=X_EYE*U,h2=r.hEye;
      const x3=Lmm,h3=r.hRet;
      const o=i*18;
      arr[o]=x0/U;arr[o+1]=h0/U;arr[o+2]=0;
      arr[o+3]=x1/U;arr[o+4]=h1/U;arr[o+5]=0;
      arr[o+6]=x1/U;arr[o+7]=h1/U;arr[o+8]=0;
      arr[o+9]=x2/U;arr[o+10]=h2/U;arr[o+11]=0;
      arr[o+12]=x2/U;arr[o+13]=h2/U;arr[o+14]=0;
      arr[o+15]=x3/U;arr[o+16]=h3/U;arr[o+17]=0;
    });
  };
  fillFan(arrA,fanRays(dsph,P_EYE),true);
  fillFan(arrB,fanRays(dsph+dcyl,P_EYE+astig),fanOn);
  rayGeoA.attributes.position.needsUpdate=true;
  rayGeoB.attributes.position.needsUpdate=true;
  /* 焦点标记(近轴迹线) */
  const tA=trace(dsph,P_EYE);
  const xa=clamp(tA.xF,0,14)/U;
  focA.position.set(xa,0,0);
  focA.visible=tA.xF>5.2;
  focA.material.color.setHex(Math.abs(tA.xF-axMM)<0.25?0x8ce99a:tA.xF<axMM?0xff6b6b:0x74c0fc);
  const tB=trace(dsph+dcyl,P_EYE+astig);
  const xb=clamp(tB.xF,0,14)/U;
  focB.position.set(xb,0.0,0);
  focB.visible=fanOn&&astig>0.01&&tB.xF>5.2;
  focB.material.color.setHex(Math.abs(tB.xF-axMM)<0.25?0x8ce99a:tB.xF<axMM?0xff6b6b:0x74c0fc);
  /* 视网膜光斑 */
  const rays=fanRays(dsph,P_EYE);
  const blur=Math.abs(rays[0].hRet)/U;
  spot.position.set(axMM/U+0.005,0,0);
  spot.scale.set(1,clamp(blur,0.012,1.6),1);
  spotM.opacity=clamp(blur*2.2,0.15,0.85);
  macula.position.set(axMM/U,0,0);
  /* 玻璃体微光脉动 */
  lensM.opacity=0.5+0.08*Math.sin(simT*1.8);
  /* 读数节流 */
  frame.acc=(frame.acc||0)+dt;
  if(frame.acc>0.12){frame.acc=0;updateStats();}
  for(const r of labelReg){
    const on=labelsOn&&(typeof r.vis==='function'?r.vis():true);
    r.o.visible=on;
    if(on){
      r.o.element.textContent=typeof r.text==='function'?r.text():r.text;
      if(r.clsFn)r.o.element.className='lbl '+r.clsFn();
    }
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
function start(){if(raf===null){clock.getDelta();raf=requestAnimationFrame(frame);}}
function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null;}}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

labelsOn=!(qs.get('labels')==='0');
document.getElementById('tglLabels').checked=labelsOn;
applyTheme();buildSteps();
rebuildEye();
if(qs.get('t')!==null&&t0>=0&&t0<STEPS.length){applyPhase(t0);}
else{applyPhase(0);}
updateStats();syncPlayBtn();start();

<script>
/* 控制面板折叠(按页面路径记忆;窄屏默认折叠) */
(function () {
  var panel = document.getElementById('panel');
  var btn = document.getElementById('panelToggle');
  if (!panel || !btn) return;
  var key = 'htw-panel-collapsed:' + location.pathname;
  function show(c) {
    panel.classList.toggle('collapsed', c);
    btn.textContent = c ? '\u25B4' : '\u25BE';
  }
  btn.addEventListener('click', function () {
    var c = !panel.classList.contains('collapsed');
    show(c);
    try { localStorage.setItem(key, c ? '1' : '0'); } catch (e) {}
  });
  var fade = document.createElement('div');
  fade.className = 'panelFade';
  panel.appendChild(fade);
  function updFade() {
    var sc = panel.scrollHeight - panel.clientHeight > 6;
    panel.classList.toggle('scrollable', sc);
    panel.classList.toggle('at-bottom', !sc || panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 6);
  }
  panel.addEventListener('scroll', updFade, { passive: true });
  if (window.ResizeObserver) { new ResizeObserver(updFade).observe(panel); }
  updFade();
  var saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  show(saved === '1' || (saved === null && matchMedia('(max-width: 760px)').matches));
})();
</script>
